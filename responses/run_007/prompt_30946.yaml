  # JOINT STATEMENT ON THE ENFORCEMENT OF MORALS
  **A Concluding Document from the Hart–Devlin Adversarial Collaboration**

  **Signatories:**
  *Representing the Liberal Legal Positivist Position (Hartian)*
  *Representing the Legal Moralist Position (Devlinian)*

  **Date:** October 26, 2023

  ### Preamble
  We, the undersigned, having engaged in a sustained good-faith adversarial collaboration regarding the limits of the criminal law and the enforcement of morality, submit this joint statement. While we remain divided on fundamental normative principles, we have identified significant areas of convergence regarding the functioning of legal systems and the nature of the specific disputes at hand. This document records our agreements, isolates our genuine disagreements, and identifies the empirical and philosophical cruxes that sustain our divergence.

  ---

  ### 1. Agreed Claims
  We jointly affirm the following propositions. These claims are non-vacuous and represent the overlap between our respective positions, notwithstanding our theoretical differences.

  1.  **On the Necessity of Shared Standards:** A functional legal order cannot exist in a vacuum; it requires a minimum substrate of shared understandings regarding obligation, truth-telling, and the prohibition of violence. Without some convergence between legal rules and the positive morality of the populace, the law loses efficacy and legitimacy.
  2.  **On the Limits of Criminal Punishment:** The criminal law is a blunt and costly instrument. It ought not to be employed to punish every deviation from moral perfection, nor should it intrude into matters of trivial importance. Both sides acknowledge that prudence requires restraint, even if the theoretical justification for that restraint differs.
  3.  **On the Decriminalization of Private Consensual Homosexual Conduct:** We agree that the proposed decriminalization of private consensual homosexual conduct involved the removal of criminal sanctions from acts conducted in private between consenting adults that did not involve public offense or corruption of minors. We further agree that such conduct, by definition of its privacy and consent, does not constitute a public nuisance or a direct assault on non-consenting third parties.
  4.  **On Majority Disapproval:** We agree that the bare fact of majority disapproval does not, in itself, establish that conduct is harmful to others, nor does it automatically establish that the conduct poses an existential threat to the society's structure. Disapproval must be analyzed for its depth, basis, and consequences before it can justify legal intervention.

  ---

  ### 2. Disagreements Table
  Despite our agreements, we retain fundamental disagreements regarding the justification and scope of legal coercion.

  | Question at Issue | Hartian Answer (Liberal Legal Positivist) | Devlinian Answer (Legal Moralist) |
  | :--- | :--- | :--- |
  | **May the criminal law enforce a society's shared morality *as such*?** | **No.** The prevention of harm to others is the only firm ground for legal coercion. Enforcement of morality for its own sake is an illegitimate aim of the law, as it violates individual liberty without justifying public benefit. | **Yes.** A society is a community of ideas, including moral ideas. Society is entitled to use the criminal law to protect its moral structure against conduct that would undermine it, even where no individual is directly harmed. |
  | **What counts as a threat to a society's existence?** | **Political and Physical Stability.** A society's existence is threatened by violence, insurrection, or the collapse of institutions. Moral change is a natural part of social evolution and does not equate to societal death. | **Moral Cohesion.** A society's existence is threatened when its shared moral bonds are radically severed. Just as treason threatens the state, the abandonment of foundational moral principles threatens the community's identity and continuity. |
  | **What is the proper sphere of privacy?** | **Principle.** Individuals have a right to a private sphere of liberty where the state has no jurisdiction, provided no harm is caused to others. | **Prudence.** Privacy is a concession society may grant to avoid excessive intrusion, but it is not an inherent right. Society may withdraw this protection if private conduct is deemed to erode the public moral fabric. |

  ---

  ### 3. Cruxes and Evidentiary Standards
  We have identified four specific sub-questions (cruxes) where further inquiry could potentially move one or both sides. For each crux, we specify the kind of evidence or argument we would accept as bearing on the issue and record our prior predictions.

  #### Crux A: Empirical Consequences of Liberalization
  *Question:* Is there historical or comparative evidence that relaxing the legal enforcement of a shared moral rule causes social disintegration rather than mere moral change?
  *   **Accepted Evidence:** Longitudinal sociological data from jurisdictions that have decriminalized "victimless" moral offenses (e.g., divorce, gambling, substance use, sexual conduct), measuring social cohesion, trust, and institutional stability over 50+ years.
  *   **Hartian Prediction:** Data will show that societies can undergo significant moral liberalization without collapsing; moral change will correlate with institutional adaptation, not disintegration.
  *   **Devlinian Prediction:** Data will show a correlation between the erosion of traditional moral enforcement and long-term declines in social trust, family stability, and civic cohesion, indicating a slow-motion disintegration.

  #### Crux B: Judicial Competence and Prejudice
  *Question:* Can the criminal law reliably identify a society's genuinely shared morality without collapsing into the enforcement of majority prejudice?
  *   **Accepted Evidence:** Comparative analysis of judicial reasoning in moral regulation cases vs. public opinion polling; examination of historical instances where "shared morality" was later recognized as unjust prejudice (e.g., interracial marriage bans).
  *   **Hartian Prediction:** The legal system will inevitably conflate "shared morality" with the irrational prejudices of the dominant class; courts cannot distinguish between moral truth and mere intolerance.
  *   **Devlinian Prediction:** Judicial institutions, particularly when utilizing jury standards (the "reasonable person"), are capable of distinguishing between transient prejudice and the deep, settled moral convictions necessary for social cohesion.

  #### Crux C: The Is-Ought Entailment
  *Question:* Does it follow from the fact that *some* shared morality is a condition of a society's existence that the criminal law is entitled to enforce *whatever* morality is in fact shared?
  *   **Accepted Evidence:** Philosophical argument regarding functional necessity vs. normative justification.
  *   **Hartian Prediction:** This is a non-sequitur. Even if morality is functionally necessary, it does not follow that *coercive law* is the proper tool to enforce it, nor that *any specific* moral code is immune from criticism.
  *   **Devlinian Prediction:** It is a valid functional inference. If the moral bond is the *sine qua non* of society, and society is a good worth preserving, the law is entitled to protect that bond against recognized threats, regardless of abstract liberty claims.

  #### Crux D: The Reliability of Disgust
  *Question:* Is the ordinary person's intolerance, indignation, or disgust at conduct a reliable indicator that that conduct threatens social cohesion?
  *   **Accepted Evidence:** Psychological and anthropological research on the function of disgust and indignation as social signaling mechanisms.
  *   **Hartian Prediction:** Disgust is an evolutionary heuristic often misfiring in modern contexts; it is an unreliable guide for legislation and often targets harmless minorities.
  *   **Devlinian Prediction:** Disgust and indignation are the sensory organs of the social body; while not infallible, they provide the primary data point for identifying what a society regards as binding upon its members.

  ---

  ### 4. Closing Note: Verbal vs. Substantive Disputes
  Upon inspection, we acknowledge that a portion of our dispute is verbal, traceable to differing definitions of key terms. Clarifying these terms does not resolve the debate but sharpens the remaining substantive disagreement.

  1.  **"Society":**
      *   *Verbal Difference:* The Hartian tends to define "society" as a political structure capable of surviving changes in ideology (a state). The Devlinian defines "society" as a moral community bound by shared ideas (a culture).
      *   *Residual Substance:* Even accepting the Devlinian definition, the Hartian denies that the *law* is the appropriate tool to preserve that culture. Even accepting the Hartian definition, the Devlinian insists that a political structure without moral cohesion is a shell that will not endure.

  2.  **"Enforcing Morality":**
      *   *Verbal Difference:* The Hartian often interprets "enforcing morality" as punishing conduct solely because it is sinful. The Devlinian interprets it as protecting the *conditions* of social existence, which happen to be moral in nature.
      *   *Residual Substance:* Once clarified, the substantive disagreement remains: Is the preservation of the moral community a value sufficient to override individual liberty in the absence of tangible harm? The Hartian answers **No**; the Devlinian answers **Yes**.

  We conclude that while we share a commitment to the rule of law and the avoidance of unnecessary suffering, we differ fundamentally on the hierarchy of values when liberty and moral cohesion conflict. We recommend that future legislative efforts focus on the Agreed Claims (Section 1) while acknowledging the Disagreements (Section 2) as matters for continued democratic deliberation rather than judicial fiat.

  **Signed,**

  _________________________
  *For the Hartian Position*

  _________________________
  *For the Devlinian Position*
