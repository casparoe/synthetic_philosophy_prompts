      *   **Task:** Evaluate a set of six commitments (a-f) for coherence/tensions.
      *   **Output Requirements:**
          *   Identify tensions between commitments.
          *   Rank tensions by severity.
          *   For each tension: suggest the cheapest revision and its cost.
          *   Flag apparent tensions that dissolve.
          *   Word count limit: 1,000 words.

  2.  **Analyze the Commitments:**
      *   (a) CJT is the *most promising* epistemic justification for democracy (normative reason).
      *   (b) CJT's independence condition is violated in reality (CJT doesn't straightforwardly apply).
      *   (c) Democracy is still epistemically superior to alternatives (epistocracy, etc.) for *most* questions.
      *   (d) Some domains (expert-heavy) should be insulated from majoritarian rule (epistemic requirement).
      *   (e) Equal moral standing/reject epistocracy (even if weighting votes yields accuracy).
      *   (f) Democracy's value is partly constitutive, not purely instrumental.

  3.  **Identify Tensions:**

      *   *Tension 1: (a) & (b) vs. (c).* If CJT is the best justification (a), but its conditions fail in reality (b), how can democracy still be epistemically superior (c)? This is the "Ideal vs. Non-Ideal" gap. If the mechanism doesn't work, why trust the outcome?
      *   *Tension 2: (c) vs. (d).* If democracy is epistemically superior for *most* questions (c), what defines the exception class in (d)? If experts are better in some domains, why aren't they better in others? This risks sliding into epistocracy.
      *   *Tension 3: (d) vs. (e).* (d) insulates policy from majoritarian pressure (expert bodies). (e) rejects epistocracy based on equal standing. Insulating domains looks like domain-specific epistocracy. Is this compatible with equal respect?
      *   *Tension 4: (a)/(c) vs. (f).* Instrumental epistemic justification (tracking truth) vs. Constitutive value (self-government). If democracy constitutes good governance, do we need the epistemic tracking claim? If we rely on epistemic tracking, does the constitutive claim matter?

  4.  **Evaluate Severity & Revisions:**

      *   *Severity 1 (High): (a)/(b) vs. (c).* This is the core theoretical vulnerability. If CJT fails, what replaces it as the epistemic mechanism for (c)?
          *   *Revision:* Downgrade (a). CJT is a *model*, not the actual justification. Use "Diversity Trumps Ability" (Hong/Page) or Deliberative systems instead.
          *   *Cost:* Lose the mathematical elegance of CJT; rely on messier social epistemology.
      *   *Severity 2 (High): (d) vs. (e).* Insulating domains looks like epistocracy.
          *   *Revision:* Frame (d) as *delegation* accountable to voters, not *rule* by experts. Experts implement, democrats set goals.
          *   *Cost:* Blurry line between implementation and goal-setting; experts still wield huge power.
      *   *Severity 3 (Medium): (c) vs. (d).* The boundary problem.
          *   *Revision:* Clarify that (c) applies to *value-laden* questions, (d) to *technical* means.
          *   *Cost:* Fact/value distinction is philosophically contested.
      *   *Dissolving Tension: (a)/(c) vs. (f).* Instrumental and constitutive values can be complementary (hybrid view). Estlund argues this. No need to choose one exclusively.

  5.  **Drafting the Response (incorporating constraints):**

      *   *Structure:* Introduction, Ranked Tensions (with revision/cost), Dissolving Tensions, Conclusion.
      *   *Tone:* Academic, direct, helpful for a prospectus.
      *   *Word Count:* Keep tight.

      *   *Drafting - Tension 1 (a/b vs c):* The "Empty Engine" problem. If CJT fails (b), why is democracy epistemically superior (c)?
          *   *Revision:* Shift from CJT to Diversity/Deliberation.
          *   *Cost:* Less formal rigor.
      *   *Drafting - Tension 2 (d vs e):* The "Stealth Epistocracy" problem. Insulating domains violates equal standing?
          *   *Revision:* Distinguish *authority* from *expertise*. Experts advise/constrain, citizens authorize.
          *   *Cost:* Complex institutional design.
      *   *Drafting - Tension 3 (c vs d):* The "Boundary" problem. How to distinguish domains?
          *   *Revision:* Focus on ends/means distinction.
          *   *Cost:* Fact/value entanglement.
      *   *Drafting - Dissolving:* (f) vs Instrumentalism. Hybrid views are standard (Estlund).

      *   *Refining:* Ensure I explicitly rank them. Ensure I mention specific authors if helpful (Estlund, Landemore). Check word count.

      *   *Self-Correction on Word Count:* I need to be concise. I'll combine the analysis of (a)/(b)/(c) into one major tension. I'll combine (d)/(e) into another.

      *   *Revised Plan:*
          1.  Intro (brief).
          2.  Tension 1: CJT Failure vs. Epistemic Superiority (a/b vs c). High Severity.
          3.  Tension 2: Expert Insulation vs. Equal Standing (d vs e). High Severity.
          4.  Tension 3: Domain Boundary (c vs d). Medium Severity.
          5.  Dissolving Tension: Instrumental vs. Constitutive (a/c vs f).
          6.  Conclusion.

      *   *Word Count Check:* Aiming for ~800-900 words to be safe.

      *   *Drafting content:*
          *   T1: If CJT conditions fail, the theorem doesn't hold. Claiming democracy is still epistemically superior requires a *different* mechanism (e.g., diversity).
          *   T2: Insulating policy looks like weighting votes by competence (epistocracy). Needs careful distinction between rule and administration.
          *   T3: Distinguishing "most questions" from "expert domains" is hard.
          *   Dissolving: Estlund's "Democratic Authority" combines instrumental and constitutive.

      *   *Refining Revisions:*
          *   T1 Revision: Treat CJT as heuristic, not mechanism. Cost: Lose formal proof.
          *   T2 Revision: Frame insulation as accountable delegation. Cost: Risk of capture.
          *   T3 Revision: Ends/Means distinction. Cost: Philosophical pushback.

      *   *Final Polish:* Ensure tone is appropriate for a PhD student.

      *(Self-Correction during drafting)*: Make sure to explicitly state "Cheapest Revision" and "Cost" for each tension as requested.

      *(Word Count Management)*: Keep descriptions tight. Avoid lengthy introductions of the authors mentioned in the prompt since the user knows them.

      *(Final Check)*: Did I rank them? Yes. Did I flag dissolving tensions? Yes. Is it under 1000 words? I will monitor closely.

      *Let's write.*
      *   Intro: 50 words.
      *   Tension 1: 250 words.
      *   Tension 2: 250 words.
      *   Tension 3: 150 words.
      *   Dissolving: 150 words.
      *   Conclusion: 100 words.
      *   Total: ~950 words.

      *Wait, one more check on Tension 1:* The user says CJT is the "most promising justification" but admits it fails. This is the biggest hole. If the justification fails, the claim of superiority (c) is unsupported.
      *Wait, one more check on Tension 2:* (d) says policy should be insulated. (e) says reject epistocracy. This is practically the definition of epistocracy (rule by the knowledgeable). This needs a strong distinction.

      *Okay, ready to generate.*
answer: |-
  Your prospectus commits you to a hybrid view: epistemic instrumentalism grounded in CJT, constrained by egalitarian non-instrumentalism, with expert exceptions. While sophisticated, three significant tensions threaten coherence, ranked by severity.

  **1. The "Empty Engine" Tension (a, b, vs. c)**
  *Severity: High*
  You claim CJT is the *most promising* justification (a), admit its conditions fail in reality (b), yet maintain democracy is epistemically superior (c). If the mechanism generating the epistemic benefit is broken, the claim of superiority lacks support. Committee members will ask: if independence is violated, what specific mechanism replaces CJT to secure (c)?

  *   **Cheapest Revision:** Demote CJT from a *mechanism* to a *heuristic* or ideal model. Argue that while CJT conditions fail, alternative aggregation mechanisms (e.g., Landemore's "Diversity Trumps Ability" or deliberative systems) preserve the epistemic benefit despite correlation.
  *   **Cost:** You lose the mathematical rigor of CJT. You must defend a messier social-epistemic model against charges that deliberation often increases polarization rather than truth-tracking.

  **2. The "Stealth Epistocracy" Tension (d vs. e)**
  *Severity: High*
  You reject epistocracy based on equal standing (e) but advocate insulating specific domains from majoritarian pressure in favor of experts (d). If experts decide policy without voter override, this is domain-specific epistocracy. If voters can override them, the insulation is ineffective. This looks like papering over the conflict between epistemic efficiency and moral equality.

  *   **Cheapest Revision:** Distinguish between *authority* and *expertise*. Frame expert bodies as implementing agencies constrained by democratic goals, not independent rulers. Voters set the ends (e.g., "reduce carbon"); experts choose the means (e.g., "carbon tax").
  *   **Cost:** The ends/means distinction is philosophically contested (many means constitute ends). You risk committing to a technocratic view of implementation that ignores the political nature of policy design.

  **3. The "Boundary Problem" Tension (c vs. d)**
  *Severity: Medium*
  You claim democracy is superior for *most* questions (c) but experts are required for identifiable domains (d). The tension lies in defining the boundary. If expertise is required for climate and monetary policy, why not healthcare, education, or infrastructure? A broad interpretation of (d) swallows (c).

  *   **Cheapest Revision:** Limit (d) to highly technical *instrumental* questions where scientific consensus is robust and value-disagreement is minimal.
  *   **Cost:** You invite debate over whether such domains exist. Climate policy, for example, involves distributive justice, not just science. You may need to concede that expert bodies should be advisory rather than insulated.

  **Dissolving Tensions**

  **Instrumental vs. Constitutive Value (a/c vs. f)**
  *Status: Compatible*
  This looks like a conflict but is standard in the literature (e.g., Estlund). You can hold that democracy is valuable *because* it tracks truth (instrumental) AND *because* it expresses equal respect/self-government (constitutive). These are complementary justifications. If democracy fails to track truth in a specific instance, the constitutive value may still preserve its legitimacy. You do not need to choose one; argue they are mutually reinforcing. The constitutive value protects democracy when epistemic performance dips; the epistemic value protects democracy when proceduralists argue accuracy doesn't matter.

  **Recommendation for the Prospectus**
  Your committee will likely focus on Tension 1. If CJT fails, why is democracy epistemically special? You need a backup epistemic mechanism ready (likely diversity-based). Tension 2 is your normative vulnerability; ensure your "insulation" model preserves ultimate democratic accountability to satisfy (e).

  If you revise (a) to treat CJT as a foundational intuition rather than a literal operational model, and clarify (d) as accountable delegation rather than insulation, the view becomes defensible. The constitutive claim (f) is your safety net if the epistemic claims become too contested; lean on it to secure the normative baseline while you fight the epistemic battles.

  **Word Count Check:** 590 words. (Well under the 1,000-word limit, allowing for clarity and density). I will expand slightly on the implications to ensure fullness without fluff.

  *Expansion on Tension 1:* Add note on correlation.
  *Expansion on Tension 2:* Add note on "guardrails."

