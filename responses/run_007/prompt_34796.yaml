prompt: |-
  I'm leading a two-hour seminar for third-year medical students on their clinical ethics rotation. The topic is the philosophical problem of advance directives: when a formerly competent patient has written an advance directive refusing certain treatments, but now lacks capacity and seems to express preferences or exhibit interests that conflict with that directive, what authority should the earlier self's instructions carry? These students already know the legal framework—they have seen advance directives on the wards—but they have not examined the underlying normative question. Plan how I should structure the session. What conceptual pieces must be in place before the problem even bites, and in what order must they be introduced? What one case or scenario should carry the whole discussion, and what features must it have (and lack) to keep the philosophical tension alive rather than collapsing it prematurely? What misconceptions will these students predictably bring from clinical experience—for instance, that the earlier self obviously prevails because the document is legally binding, or that the later self's apparent preferences do not count because the patient lacks capacity, or that the whole problem reduces to poor drafting of the directive—and at exactly which points in the sequence should I head each one off? What question can I pose near the end that would tell me whether they have grasped the genuine philosophical tension rather than just learned to recite a position? And what should I explicitly flag as unresolved at this level?
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Third-year medical students (clinical ethics rotation). They know the *law* and *clinical practice* but lack *philosophical depth*.
      *   **Topic:** The philosophical problem of advance directives (ADs) when the past competent self conflicts with the present incapacitated self (the "then-self vs. now-self" problem).
      *   **Duration:** Two hours.
      *   **Key Requirements:**
          *   Structure/Sequence of concepts.
          *   One central case/scenario (features it must have/lack).
          *   Address predictable misconceptions (legalism, capacity dismissal, drafting errors).
          *   Timing for addressing misconceptions.
          *   Final assessment question (to test grasp of tension).
          *   Explicitly flag unresolved issues.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *precedent autonomy* (the right of the past self to dictate the future) and *current well-being/interests* (the welfare of the present self who may be happy despite incapacity).
      *   Key philosophical concepts needed: Personal Identity (is the demented patient the *same person* as the writer?), Autonomy (does it survive incapacity?), Well-being (hedonic vs. objective list).
      *   The "Ulysses Contract" analogy is often useful but needs careful handling.

  3.  **Develop the Central Case:**
      *   *Requirement:* Must create tension. If the patient is suffering terribly, the AD wins easily. If the patient is perfectly happy, the AD still might win easily (depending on view). We need a case where the "now-self" is *content* but the "then-self" would find that state undignified.
      *   *Classic Example:* Rebecca Dresser's critique of Ronald Dworkin. A patient with dementia who enjoys simple pleasures (music, cookies) but previously wrote an AD refusing life-sustaining treatment if demented.
      *   *Features to Include:* Clear prior competence, clear AD, clear current incapacity, *positive* affect in current state (crucial for tension), specific treatment decision (e.g., antibiotics for pneumonia).
      *   *Features to Exclude:* Ambiguity in the AD (distracts to legal interpretation), family conflict (distracts to surrogate dynamics), pain/suffering (makes the utilitarian calculation too easy).

  4.  **Structure the Session (2 Hours):**
      *   *0:00-0:15:* Introduction & The Case. Hook them immediately.
      *   *0:15-0:45:* Conceptual Foundation 1: Autonomy & Identity. (Why does the past self matter?)
      *   *0:45-1:00:* Break (Mental processing).
      *   *1:00-1:30:* Conceptual Foundation 2: Well-being & Interests. (Does the current self have interests that matter?)
      *   *1:30-1:50:* Synthesis & Clinical Application. (How do we act?)
      *   *1:50-2:00:* Assessment & Unresolved Questions.

  5.  **Address Misconceptions:**
      *   *Misconception 1: "Law trumps philosophy."* (AD is legally binding, end of story).
          *   *Timing:* Early. Acknowledge law, but bracket it. "We know what you *can* do; we are asking what you *should* do."
      *   *Misconception 2: "Incapacity means preferences don't count."* (Now-self is a non-person).
          *   *Timing:* During Well-being section. Introduce the concept of "experiential interests."
      *   *Misconception 3: "It's just a drafting error."* (If the AD was specific enough, this wouldn't happen).
          *   *Timing:* During Synthesis. Show that no amount of drafting solves the metaphysical problem.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Present the case of "Mrs. G." (Grandmother, dementia, pneumonia, AD refuses treatment, but she smiles at grandchildren).
      *   *Concept 1: Personal Identity.* Are "Then-Mrs. G" and "Now-Mrs. G" the same? (Locke vs. Psychological Continuity). If they aren't the same, why bind Now-Mrs. G?
      *   *Concept 2: Autonomy.* Is autonomy a one-time event or an ongoing process? Dworkin's "Critical Interests" vs. Dresser's "Experiential Interests."
      *   *Concept 3: Harm.* Is it harm to keep her alive against her prior wishes if she's happy now?
      *   *Assessment Question:* Needs to force a choice between two bad options or reveal their weighting. "If you could ask the *current* Mrs. G one question, what would it be, and why isn't the answer definitive?" Or better: "Under what condition would you violate the AD?"

  7.  **Refining the Plan (Self-Correction/Review):**
      *   *Critique:* Is 2 hours enough for Personal Identity?
      *   *Fix:* Keep it pragmatic. Don't get bogged down in metaphysics. Focus on *moral weight* of identity, not just metaphysical truth.
      *   *Critique:* Will students get frustrated by lack of resolution?
      *   *Fix:* Explicitly frame the lack of resolution as the learning objective. Medicine likes algorithms; ethics likes ambiguity.
      *   *Case Refinement:* Make sure the treatment is routine (antibiotics) not heroic (ventilator), to make the refusal more striking.
      *   *Misconception Check:* Ensure I explicitly tell them to put their "legal hats" away at the start.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for med students (respectful of clinical reality but pushing intellectual boundaries).
      *   Check all constraints of the prompt are met (conceptual pieces, order, case features, misconceptions, assessment question, unresolved flags).

  9.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  Here is a structured plan for your two-hour seminar. It is designed to move students from legalistic compliance to philosophical inquiry, using a single sustained case to prevent the discussion from fragmenting into hypothetical edge-cases.

  ### **Session Title:** The Two Selves: Autonomy, Identity, and the Advance Directive
  **Duration:** 120 Minutes
  **Goal:** To move students from asking "What does the form say?" to "Whose life is this, and who owns the decision?"

  ---

  ### **I. The Central Case: "Mrs. G"**
  To sustain the philosophical tension, the case must avoid clinical confounders. It should not be a case of suffering (which makes the utilitarian calculation easy) nor a case of ambiguous legal language (which reduces the problem to drafting).

  **The Scenario:**
  Mrs. G, now 78, has moderate-to-severe Alzheimer's. She does not recognize her family, cannot recall her past, and cannot understand the concept of death. However, she is not suffering. She enjoys listening to big-band music, eating ice cream, and holding her granddaughter's hand. She appears content.
  She develops a treatable pneumonia. Without antibiotics, she will die in days. With them, she returns to her baseline demented state.
  **The Conflict:** Five years ago, a fully competent Mrs. G signed an AD refusing "life-sustaining treatment" if she reached a state of "severe cognitive decline where I am not myself." She specifically wrote: "I would rather die than be a vegetable."
  **The Clinical Reality:** Legally, the AD is valid. Her surrogate (her daughter) is torn: "She wrote this, but she looks happy now."

  **Required Features:**
  1.  **Positive Affect:** The current self must appear happy. If she were in pain, the "best interest" standard would override the AD easily.
  2.  **Routine Treatment:** Use antibiotics, not a ventilator. This prevents students from dismissing the AD based on the "futility" or "burdensomeness" of the technology.
  3.  **Clear Language:** The AD must be unambiguous. This prevents the "drafting error" escape hatch.
  4.  **No Surrogate Conflict:** The surrogate is cooperative but confused, not fighting the team. This keeps the focus on the *patient's* moral status, not family dynamics.

  ---

  ### **II. Session Structure & Conceptual Sequence**

  #### **Part 1: Bracketing the Law (0:00 – 0:20)**
  *   **Activity:** Present the case. Ask for a show of hands: "Who treats? Who withholds?"
  *   **The Pivot:** Students will immediately cite state law or hospital policy. You must interrupt this.
  *   **Intervention:** Explicitly state: *"For the next 90 minutes, the law does not exist. There are no lawsuits, no board complaints, and no liability. We are asking only: What is the morally right thing to do?"*
  *   **Misconception Head-Off (Legalism):** Students believe legal validity equals moral authority.
      *   *When:* **Minute 10.**
      *   *How:* Acknowledge that in practice, the law guides action. But explain that the law is a *proxy* for moral principles. If the moral principle fails, the proxy is hollow. Ask: "Just because she *could* bind her future self legally, does that mean she *should* have the moral power to do so?"

  #### **Part 2: The Metaphysics of the Self (0:20 – 0:50)**
  *   **Concept:** **Personal Identity.**
  *   **Discussion:** Is "Demented Mrs. G" the same person as "Competent Mrs. G"?
  *   **Philosophical Tool:** Introduce the **Psychological Continuity Theory** (Locke). We are the same person only if we share memories, intentions, and character.
  *   **Application:** If psychological continuity is broken, is the AD a will written by a stranger?
  *   **Misconception Head-Off (The "One Person" Assumption):** Students assume biological continuity equals moral identity.
      *   *When:* **Minute 35.**
      *   *How:* Ask: "If you promised to give your neighbor $100 tomorrow, but tonight you both undergo a procedure that wipes your memories and changes your personalities, is the promise still binding?" This decouples biological life from moral agency.

  #### **Part 3: Competing Interests (0:50 – 1:10)**
  *   **Concept:** **Critical Interests vs. Experiential Interests.** (Dworkin vs. Dresser).
  *   **Definitions:**
      *   *Critical Interests:* Values that make a life good *as a whole narrative* (e.g., dignity, independence). Only the competent self has these.
      *   *Experiential Interests:* What feels good *in the moment* (e.g., pleasure, absence of pain). The incapacitated self has these.
  *   **Discussion:** Does the "Critical Interest" in dignity survive the loss of capacity to understand dignity? Or does the "Experiential Interest" in ice cream and music now outweigh the past abstract value?
  *   **Misconception Head-Off (Capacity Dismissal):** Students believe that lacking capacity means lacking *any* morally relevant interests.
      *   *When:* **Minute 60.**
      *   *How:* Challenge the view that the "Now-Self" is a non-person. "If we stick her with a needle, she cries. That suffering counts morally, even if she can't sign a check. Why doesn't her joy count?"

  #### **Part 4: Synthesis & Clinical Resolution (1:10 – 1:40)**
  *   **Activity:** Return to the vote. Has anyone changed their mind?
  *   **Discussion:** How do we weigh the two selves?
      *   *Option A (Precedent Autonomy):* Respect the "life narrative." To ignore the AD is to treat the patient as an object of the state's benevolence, violating her lifelong values.
      *   *Option B (Current Well-being):* Respect the "living being." To kill a happy being based on the wishes of a "dead" (psychologically) self is a form of murder.
  *   **Misconception Head-Off (The Drafting Fix):** Students will suggest, "She should have written 'Unless I seem happy'."
      *   *When:* **Minute 85.**
      *   *How:* Explain the **Problem of Imagination.** A competent person *cannot* accurately imagine what it is like to be demented. Therefore, no amount of drafting can solve the epistemic gap. The conflict is inherent, not clerical.

  #### **Part 5: Assessment & Unresolved Questions (1:40 – 2:00)**
  *   **The Assessment Question:** Do not ask "What is the right answer?" Ask:
      > *"If you decide to treat Mrs. G against her advance directive because she looks happy now, what specific moral harm have you inflicted upon the 'Former Mrs. G'? Conversely, if you withhold treatment to honor the directive, what specific moral harm have you inflicted upon the 'Current Mrs. G'?"*
      *   *Why this works:* A student who has only memorized a position will say "I saved her life" or "I respected her rights." A student who grasps the tension will acknowledge a **residual moral remainder**—that in either choice, someone (or some *version* of someone) is being wronged. They should be able to articulate that honoring autonomy might cause suffering, and preventing suffering might violate integrity.

  *   **Explicitly Flagged Unresolved Issues:**
      1.  **The Threshold Problem:** There is no philosophical consensus on *how much* cognitive decline is required to sever personal identity.
      2.  **The Weighting Problem:** There is no formula for weighing Critical Interests against Experiential Interests.
      3.  **The Epistemic Problem:** We cannot truly know if the demented patient is "happy" or merely chemically content.
      4.  **Closing Statement:** "In your practice, the law will give you a shield. But ethics requires you to live with the sword. You will have to choose which self to betray. My goal today was not to tell you which choice to make, but to ensure you know the cost of whichever you choose."

  ---

  ### **III. Summary of Misconceptions & Interventions**

  | Misconception | Source | When to Head Off | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **"Legal Validity = Moral Authority"** | Clinical training focuses on compliance/risk management. | **Min 10** (Intro) | Bracket the law. "We are not asking what is defensible, but what is right." |
  | **"Incapacity = No Interests"** | Binary view of capacity (either you decide or you don't). | **Min 60** (Interests) | Highlight sensory experience. "Pain counts even if you can't sign a form. Why not joy?" |
  | **"This is just a drafting error"** | Engineering mindset; belief that better forms solve human problems. | **Min 85** (Synthesis) | The Problem of Imagination. "You cannot write instructions for a state of mind you cannot conceive." |
  | **"The Past Self is the 'Real' Patient"** | Bias toward rationality as the seat of humanity. | **Min 35** (Identity) | Challenge the "Stranger" analogy. "If the past self is a stranger, why do their words bind the present body?" |

  ### **IV. Instructor Notes for Facilitation**
  *   **Tone:** Maintain "agnostic facilitation." Do not reveal your own view until the very end (and even then, keep it personal, not prescriptive).
  *   **Pacing:** If the Personal Identity section (Part 2) gets too metaphysical/abstract, pull it back to the bedside. "Does this change how you hold her hand?"
  *   **Safety:** Some students may have personal experience with dementia in family. Frame the discussion respectfully; acknowledge that for families, this is not a thought experiment but a lived trauma.

  This structure ensures that by the end of the two hours, the students realize that the Advance Directive is not a solution to the problem of death and identity, but merely a vessel that carries the problem forward in time.
