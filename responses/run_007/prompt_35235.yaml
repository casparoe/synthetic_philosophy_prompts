answer: |-
  You have put your finger on one of the most persistent and frustrating issues in the philosophy of science and metaphysics. You are not confused; the gap you perceive between the formal machinery and the actual practice of philosophical argument is real, and it is widely acknowledged in the literature.

  Here is the breakdown of the names, the concepts, the proposed solutions, and why the formal approaches don't quite close the gap you've identified.

  ### 1. Does it have a name?

  There isn't one single capitalized term, but the problem is most commonly referred to as **"The Problem of Formulation Dependence"** or **"The Language Dependence of Simplicity."**

  It is inextricably linked to **Nelson Goodman's "New Riddle of Induction"** (the *Grue* paradox). Goodman showed that any set of data can be fitted by infinitely many hypotheses, and which hypothesis counts as "simpler" depends entirely on the choice of primitive predicates (vocabulary). If your primitive predicates are *green* and *blue*, "all emeralds are green" is simple. If your primitives are *grue* and *bleen*, a different hypothesis is simple.

  In the context of ontology and metaphysics (your dualism/physicalism examples), this is often discussed under the distinction between **Syntactic Simplicity** (brevity of statement) and **Ontological Parsimony** (number of entities posited). Your observation is that *Ontological Parsimony* often collapses back into *Syntactic Simplicity* because how we count "entities" depends on how we describe the theory.

  ### 2. How the literature carves up the problem

  Philosophers generally distinguish three versions of the problem you are describing:

  **A. The Vocabulary Problem (Goodmanian)**
  What counts as a "primitive"? As you noted, I can bundle three assumptions into one by coining a new term (e.g., "psychophysical bridging"). Is that one assumption or three?
  *   *Standard view:* Simplicity must be measured against a background of **"Natural Properties."**

  **B. The Logic Problem (Quinean)**
  W.V.O. Quine proposed a criterion for ontological commitment: *"To be is to be the value of a bound variable."* The idea was to fix the unit of counting by translating theories into standard first-order logic and counting the existential quantifiers.
  *   *The Failure:* As you suspected, this doesn't solve it. You can still translate the same theory into different logical formalisms (e.g., predicate logic vs. nominalistic logic) where the quantifier count changes. The choice of logical language is itself a choice of vocabulary.

  **C. The Parameter Problem (Statistical)**
  In philosophy of science (specifically the work of **Malcolm Forster and Elliott Sober**), simplicity is often cashed out as **parameter counting** (using tools like the Akaike Information Criterion, AIC).
  *   *The Failure:* This works well for curve-fitting (how many coefficients in the equation?), but it breaks down in metaphysics. Does "God" count as one parameter? Does "The Multiverse" count as one parameter (the wave function) or $10^{500}$ parameters (the universes)? There is no agreed-upon metric for "parameters" in metaphysical theories.

  ### 3. Standard Responses (How philosophers try to solve it)

  Since the "counting" move is vulnerable to the re-description game you identified, philosophers usually pivot to one of three justifications for why simplicity matters, hoping to bypass the counting problem.

  **Response 1: Naturalness (The Lewis/Sider Move)**
  David Lewis and Ted Sider argue that simplicity isn't about *counting*; it's about **carving nature at its joints**.
  *   *The Argument:* Some properties are objectively more "natural" than others. *Mass* is a natural property; *mass-or-charge* is a gerrymandered, unnatural property. A theory is simpler if it uses more natural properties, even if the sentence is longer.
  *   *Does it solve your problem?* It attempts to. It says you can't just bundle three assumptions into one label unless that label picks out a *natural kind*. However, critics argue that "naturalness" is just as contentious and language-dependent as simplicity. (Is *consciousness* a natural kind? Physicalists say no, Dualists say yes.)

  **Response 2: Predictive Accuracy (The Sober/Forster Move)**
  Elliott Sober argues that we shouldn't view simplicity as a guide to *truth* (ontology), but as a guide to **predictive accuracy**.
  *   *The Argument:* Complex models "overfit" the data. They capture noise rather than signal. Simpler models generalize better.
  *   *Does it solve your problem?* Only for empirical science. It doesn't help with metaphysical debates (God, Dualism, Nominalism) where there is no clear dataset to predict. In those cases, the "re-description" game remains unchecked.

  **Response 3: Ockham's Efficiency (The Kelly Move)**
  Kevin Kelly (Carnegie Mellon) uses formal learning theory to argue for an **"Ockham Efficiency Theorem."**
  *   *The Argument:* Following Occam's Razor doesn't guarantee you get the truth fastest, but it guarantees you **retract your beliefs the fewest number of times** on the way to the truth.
  *   *Does it solve your problem?* It's a sophisticated formal approach, but it still relies on a fixed topology of possible worlds. If the agents disagree on the "possibility space" (which they usually do in philosophy), the theorem doesn't apply.

  ### 4. Do the formal approaches (Kolmogorov, etc.) solve it?

  You asked to be told if you are confused about this. **You are not confused.** The formal approaches do not solve the problem for philosophical discourse; they merely relocate it.

  **Kolmogorov Complexity (Algorithmic Information Theory):**
  This measures the length of the shortest program that produces a given output. It is often touted as an objective measure of simplicity.
  *   **The Catch:** Kolmogorov complexity is only invariant up to an additive constant, depending on the choice of the **Universal Turing Machine (UTM)**.
  *   **The Implication:** For finite strings (which all human theories are), the choice of UTM matters immensely. I can design a UTM that has a "God" instruction built into its primitive set. In that language, a theistic theory has low Kolmogorov complexity. In a UTM with "Quantum Field" primitives, physicalism is lower.
  *   **Conclusion:** Kolmogorov complexity solves the problem *in the limit* (as data goes to infinity), but philosophical debates happen in the finite regime where the choice of language/vocabulary dominates the complexity measure.

  **Minimum Message Length (MML) / Bayesian Model Selection:**
  These require a **Prior Probability** distribution.
  *   **The Catch:** Where do the priors come from? If you assign a higher prior to "Physicalism" because it feels simpler, you have simply encoded your simplicity bias into the prior. You haven't explained *why* it is simpler; you've just asserted it mathematically. This is often called **"Subjective Bayesianism."**

  ### 5. Summary: How to think about the phenomenon

  The phenomenon you are noticing is the **underdetermination of simplicity by formal structure.**

  When Person A and Person B argue about simplicity in metaphysics, they are rarely arguing about logic or math. They are arguing about **Ideological Commitments**.
  *   **Ontological Parsimony:** How many *things*? (Entities)
  *   **Ideological Parsimony:** How many *kinds of properties*? (Primitives)

  The "re-description" move works because there is no neutral language.
  *   **Physicalist:** "Consciousness" is a complex structural relation. (Bundling neural states).
  *   **Dualist:** "Consciousness" is a primitive phenomenological fact. (Atomic).
  *   **Physicalist:** "Bridge Laws" are extra assumptions. (Splitting).
  *   **Dualist:** "Interaction" is a primitive fact. (Bundling).

  **The Verdict:**
  There is no consensus solution. The dominant view in contemporary philosophy of science (championed by **John Norton** and **Margaret Morrison**) is that there is **no universal logic of simplicity.** Simplicity is a **local virtue**. It only works when there is a background framework that fixes the vocabulary (e.g., within standard particle physics, counting fields is well-defined). In fundamental metaphysics, where the framework itself is up for grabs, appeals to Occam's Razor are often rhetorical disguises for deeper substantive disagreements about what exists.

  If you want to read more, look for:
  1.  **Nelson Goodman**, *Fact, Fiction, and Forecast* (The Grue problem).
  2.  **Elliott Sober**, *Simplicity* (The distinction between likelihood and prior justifications).
  3.  **Ted Sider**, *Writing the Book of the World* (The "Naturalness" response).
  4.  **J.D. Norton**, *A Material Theory of Induction* (The argument that all induction, including simplicity, is local and material, not formal).

  You have correctly identified that Occam's Razor, when removed from a fixed formal context, is often just a weaponized preference for one's own ontology.
