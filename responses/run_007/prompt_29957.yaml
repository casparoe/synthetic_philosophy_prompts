      *   Use Greek terms (*nomos*, *physis*, *telos*, *tokos*) to show depth but explain them clearly.
      *   Check for clarity on the "Sterility" point, as that's the crux of the usury argument.

  8.  **Final Output Structure:**
      *   Validate the question (it's a deep one).
