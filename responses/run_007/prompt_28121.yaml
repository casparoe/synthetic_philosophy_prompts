answer: |-
  # Activity Plan: The Sealed Envelope Seminar

  **Objective:** To simulate the structural tension of the "Death in Damascus" case without relying on magic or opaque technology. Students will experience the conflict between treating a prediction as fixed evidence (EDT) versus treating it as a fixed state of the world independent of their current causal power (CDT).

  **Class Size:** 20 Students
  **Time:** 75 Minutes
  **Materials:** 
  *   20 Opaque Envelopes (sealed with a sticker or tape).
  *   40 Small Slips of Paper (two per student).
  *   Pens/Pencils.
  *   Whiteboard/Projector for rules.
  *   A "Prediction Ledger" (a sheet of paper the TA keeps).

  ---

  ### 1. The Rules (5 Minutes)

  Begin by framing the activity as a decision game. Do **not** mention "Death in Damascus," "Evidential Decision Theory," or "Causal Decision Theory" yet.

  **The Narrative:**
  "You are traveling in a region where a highly accurate Predictor operates. This Predictor has already determined your fate for today. Your goal is to avoid the 'Bad Outcome.'"

  **The Mechanics:**
  1.  **The Prediction:** Inside the envelope on your desk is a slip of paper. It says either **CITY A** or **CITY B**. This was written *before* you entered the classroom based on a transparent rule (explained below). This represents where the 'Bad Outcome' is located.
  2.  **The Choice:** You will write your own choice on a fresh slip: **CITY A** or **CITY B**. This represents where *you* will go.
  3.  **The Payoff:**
      *   **Mismatch (You escape):** If your choice is *different* from the envelope's prediction, you earn **10 Points**.
      *   **Match (Death finds you):** If your choice is the *same* as the envelope's prediction, you earn **0 Points**.
  4.  **The Constraint:** You may not open the envelope until you have submitted your choice slip.

  **The Transparent Mechanism (Crucial for Trust):**
  Explain how the predictions were generated to rule out rigging.
  *   *Option A (If you have a class roster):* "I used your academic major. Humanities/Social Sciences = City A. STEM = City B."
  *   *Option B (If you want to simulate psychology):* "At the start of class, you wrote down a 'Risk Number' from 1-10. Low (1-5) = City A. High (6-10) = City B. I calculated this while you were reading the syllabus."
  *   *Recommendation:* Use **Option B** but streamline it. Have students write a number 1-10 on a scrap piece of paper immediately. Collect them. While they listen to the rules, you and a student volunteer quickly sort them into two piles and write the corresponding City on the prediction slips, seal them, and distribute them. This ensures the prediction is based on *their* input (transparency) but sealed before their final choice (temporal priority).

  ---

  ### 2. Timeline (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute envelopes (face down) and choice slips. Explain rules and payoff. |
  | **05-15** | **Input** | Students write their "Risk Number" (1-10). Collect slips. TA + 1 Student Auditor generate predictions based on the public rule (e.g., 1-5=A, 6-10=B), seal them, and return envelopes to desks. |
  | **15-25** | **Deliberation** | Students sit with their sealed envelope. They must decide: City A or City B? They write their choice on the *choice slip* but do not submit yet. |
  | **25-35** | **Submission** | Students fold choice slips and place them in a collection box. **Only now** are they allowed to open their envelopes. |
  | **35-45** | **Reveal** | TA opens envelopes and compares with choice slips. Tally points on the board. (Expect a high correlation between Prediction and Choice). |
  | **45-75** | **Debrief** | Guided discussion mapping the experience to Decision Theory (see below). |

  ---

  ### 3. Payoff Scheme

  *   **Survival (Mismatch):** 10 Course Participation Points.
  *   **Death (Match):** 0 Points.

  **Why this works:**
  The rational desire is to Mismatch. However, because the Prediction was based on a trait (Risk Number) that also influences the Choice, students who are "Type A" (Low Risk) likely had "City A" predicted *and* are inclined to choose "City A" to be safe/consistent.
  *   If they choose **City B** (to Mismatch), they are acting against their type.
  *   If they choose **City A** (to follow their type), they Match and get 0 points.

  ---

  ### 4. Debrief: Mapping to Decision Theory (30 Minutes)

  This is the most critical section. Do not lecture; ask questions to draw the distinction out of them.

  **Step 1: The Data (5 mins)**
  *   Ask: "How many of you got 10 points?" (Likely fewer than half if the correlation holds).
  *   Ask: "How many of you tried to choose the opposite of what you thought was in the envelope?"
  *   Reveal the correlation: "Notice that most people who wrote a Low Risk number chose City A, and most who wrote High Risk chose City B. The prediction matched the choice roughly 80% of the time."

  **Step 2: The Student Objection (10 mins)**
  *   Bring up the objection you faced previously: "One might say, 'This is no puzzle. You just go to the city where Death isn't.' If the envelope says A, you go to B. Why is this hard?"
  *   **The Counter:** "But you didn't know what was in the envelope. You had to *infer* it. How did you infer it?"
  *   **The Realization:** Students will admit they inferred the envelope's content based on their own *inclination*. "I felt like a City A person, so I thought the envelope said A, so I chose B."
  *   **The Trap:** "But if you are the *kind of person* who chooses B when you feel like an A-person, the Predictor (who knows your psychology) would have predicted B."

  **Step 3: EDT vs. CDT (15 mins)**
  *   **Evidential Decision Theory (EDT):**
      *   *Logic:* My choice provides *evidence* about what is in the envelope.
      *   *Reasoning:* "If I choose City A, that is strong evidence that I am a 'Type A' person, which means the envelope likely says City A. If the envelope says City A, I get 0 points. Therefore, choosing City A is bad news. I should choose City B."
      *   *Result:* EDT struggles here. If choosing B is evidence that the envelope says B (because you are a 'Type B' rebel), then both options look equally bad. You cannot find an option that is evidence of a Mismatch without changing your underlying type.
  *   **Causal Decision Theory (CDT):**
      *   *Logic:* The content of the envelope is *already fixed*. My choice cannot causally change what is written on the slip inside.
      *   *Reasoning:* "The slip is already sealed. It says either A or B. If it says A, I should choose B (10 pts). If it says B, I should choose A (10 pts). Since I don't know which it is, I should pick the one I prefer/feel like doing. My choice doesn't *cause* the prediction."
      *   *Result:* CDT recommends following your inclination (maximizing expected utility based on fixed states), but this leads to Matching (Death).
  *   **The Force of the Puzzle:**
      *   The student who said "Just go where Death isn't" is assuming they can break the correlation between their *type* and their *choice*.
      *   The puzzle forces them to ask: "Can I choose differently than my nature dictates? And if I can, would the Predictor have anticipated that?"

  ---

  ### 5. Misconceptions to Expect

  1.  **"I can outsmart the Predictor by randomizing."**
      *   *Response:* "If you flip a coin, the Predictor predicts you will flip a coin. If the rule is 'Coin Flip = City A', you still die. The Predictor predicts your *strategy*, not just your impulse."
  2.  **"The TA rigged the envelopes after seeing our choices."**
      *   *Response:* This is why the **Student Auditor** and the **Sealing Phase** are vital. Remind them the slips were sealed *before* the choice slips were written.
  3.  **"I chose City B because I hate City A, not because of the game."**
      *   *Response:* "That preference is exactly what the Predictor used. Your preference *is* the common cause. The puzzle isn't about the cities; it's about the correlation between your preference and the prediction."
  4.  **"This is just Newcomb's Problem."**
      *   *Response:* Acknowledge the similarity. "In Newcomb's, you choose between one box or two. Here, you choose between two locations. The structure is identical: a correlation between your act and a prior state that determines payoff."

  ---

  ### 6. Honest Note: Limitations of the Activity

  You must disclose this to maintain intellectual honesty during the debrief.

  **The Limitation:**
  "In the original 'Death in Damascus' case, the Predictor is **metaphysically perfect**. It is logically impossible for the Prediction and the Choice to diverge. In our classroom activity, the correlation is **empirical and psychological**. It is physically possible for you to choose against your 'Type.' You *could* have written 'City B' even if you are a 'Type A' person. If enough of you did that, my accuracy would drop."

  **Why it still matters:**
  "However, the *feeling* of the dilemma remains. To beat the Predictor, you must act against your own decision-making process. But if your decision-making process is what determines your choice, can you actually do that? If you *could* easily do that, the Predictor would have predicted you would do that. This activity reproduces the **reflective instability** of the original case, even if it lacks the logical necessity."

