prompt: |-
  I'm a quant at a hedge fund. I spend my days thinking about expected value, tail risk, position sizing, the Kelly criterion — the whole toolkit for making bets under uncertainty. I keep hearing about Pascal's mugging from the rationalist/EA crowd, and I'm trying to figure out if it's a real problem I should care about or just a philosophical toy.

  Restate the whole Pascal's mugging argument — the mugger, the wallet, the promise to simulate and torture 3^^^3 people, the claim that expected utility theory forces you to hand over the money — in the vocabulary I actually use: expected returns, risk measures (VaR, CVaR), position sizing, model uncertainty vs. parameter uncertainty, and the distinction between risk and Knightian uncertainty. Be as faithful as you can to the original argument.

  Then give me the residue report. What translated cleanly? What did you have to stretch or fudge? What parts of the argument have no expression at all in my framework? And here's the part I really want: tell me whether the things that didn't translate are gaps in my framework that I should be worried about, or whether they're artifacts of the philosophical setup that don't survive contact with how actual decision-making under uncertainty works.
