          *   What would change if we dropped the implicit theory?
      *   **Structure:** Start by brainstorming candidate presuppositions, then analyze which ones are actually *needed* by the practice vs. which are interpretive overlays.

  2.  **Initial Brainstorming & Mapping RL Concepts to Philosophy of Mind:**
