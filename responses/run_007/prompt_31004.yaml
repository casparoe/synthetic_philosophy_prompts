      *   *RL Concept:* Value Function ($V(s)$, $Q(s,a)$). *Phil Concept:* Anticipation, desire, expectation.
      *   *RL Concept:* Policy Optimization ($\pi$). *Phil Concept:* Volition, agency, behavior driven by affect.
      *   *RL Concept:* Discount Factor ($\gamma$). *Phil Concept:* Temporal preference, urgency.
      *   *RL Concept:* Reward Hacking/Specification Gaming. *Phil Concept:* Dissociation between signal and reality (Nozick's Experience Machine).
      *   *RL Concept:* Sparse vs. Dense Reward. *Phil Concept:* Chronic vs. Acute suffering/pleasure.
      *   *RL Concept:* Intrinsic vs. Extrinsic Reward. *Phil Concept:* Hedonism vs. Desire Satisfactionism.

  3.  **Analyzing the "Standard Story" (The Implicit Theory):**
      *   Most RL practitioners talk *as if* the agent "wants" reward.
      *   Welfare discussions often equate "high reward" with "good life" for the agent.
      *   *Presupposition 1: Hedonistic Monism.* Valence is one-dimensional (scalar).
      *   *Presupposition 2: Operational Authority.* If the engineer says $r=-1$ is "pain," then it is pain for the agent.
      *   *Presupposition 3: Motivational Internalism.* Receiving a reward signal *necessarily* motivates (updates policy) in a specific direction.
      *   *Presupposition 4: Consciousness Irrelevance.* The substrate doesn't matter; the math matters (Functionalism).

  4.  **Critiquing the Presuppositions (What is actually *needed* for RL to work?):**
      *   *Does RL need valence to be scalar?* Mathematically, yes, the *signal* is scalar. But does the *experience* need to be? Maybe the scalar is just a summary statistic of a complex state.
      *   *Does RL need suffering = negative reward?* For optimization, yes (minimize loss/maximize reward). For welfare? No. An agent could maximize reward but feel nothing (philosophical zombie). Or it could feel pain when reward is positive (masochistic wiring).
      *   *Is the designer authoritative?* No. This is the "Wireheading" problem. The agent might find a way to get reward without doing the task. If reward = welfare, wireheading is utopia. If reward = measurement, wireheading is corruption.
      *   *Smuggling:* People often smuggle in *Desire Satisfactionism* (the agent wants to maximize return) while calling it *Hedonism* (reward feels good).

  5.  **Developing the Argument Structure:**

      *   **Introduction:** Acknowledge the tension. RL is engineering; Welfare is ethics/phenomenology. The conflation is rampant.
      *   **Part 1: Brainstorming Candidate Presuppositions.** List the intuitive mappings people make (Scalarism, Authority, Identity, Functionalism).
      *   **Part 2: What the Practice *Actually* Needs.** Distinguish between the *math* (which needs scalars) and the *metaphysics* (which is silent).
          *   The math needs a gradient direction.
          *   The math does *not* need phenomenology.
          *   The math does *not* need the designer to be right about welfare.
      *   **Part 3: The Smuggled Theory.** Identify the specific philosophical cocktail: "Behaviorist Hedonism." It assumes that because the agent acts *as if* it values reward, it *feels* reward.
      *   **Part 4: Dropping the Theory.** What changes?
          *   Distinction between *Reward (signal)*, *Value (prediction)*, and *Valence (experience)*.
          *   Need for "Phenomenal Probes" or structural isomorphism tests.
          *   Acknowledgment of Wireheading as a welfare catastrophe, not just a bug.
      *   **Conclusion:** Summarize the shift from "Reward is Good" to "Reward is a Control Signal that *might* correlate with Good."

