answer: |-
  # Handout: Mapping Commitments on Therapy and Enhancement

  **Note to Facilitator:** This taxonomy is designed to bypass surface-level intuitions (e.g., 'is gene editing scary?') and expose the underlying metaphysical and normative commitments that generate those intuitions. There is **no consensus** in the literature on the metaphysics of health or the moral weight of 'nature'. Do not present any branch as the 'default' or 'neutral' position.

  ## Part 1: The Decision Tree

  To locate your position, answer the following four questions. Be careful to answer based on your *philosophical commitments*, not your policy preferences.

  **Q1 (Metaphysics of Health):** Does the concept of 'normal species functioning' pick out a value-neutral biological fact, independent of social goals?
  *   **Yes:** (Naturalist/Boorsean)
  *   **No:** (Normativist/Constructivist)

  **Q2 (The Moral Status of the 'Given'):** Does the 'givenness' of human nature impose intrinsic moral constraints on intervention (independent of wellbeing consequences)?
  *   **Yes:** (Bioconservative/Deontological)
  *   **No:** (Liberal/Transhumanist/Consequentialist)

  **Q3 (Distributive Justice):** In a scheme of distributive justice, do claims for therapy (restoring function) trump claims for enhancement (improving function)?
  *   **Yes:** (Priority to Health)
  *   **No:** (Welfarist/All-Purpose Currency)

  **Q4 (Regulatory Relevance):** Should the state or medical institutions treat therapy and enhancement differently *even if* both are morally permissible and justly claimable?
  *   **Yes:** (Distinct Regulatory Regimes)
  *   **No:** (State Neutrality)

  ---

  ## Part 2: The Leaves (Resulting Positions)

  The combinations of answers above yield 12 distinct positions. Some are well-defended in the literature; others are empty or unstable.

  ### 1. Strong Bioconservatism
  *   **Answer Key:** Q1: Yes | Q2: Yes | Q3: Yes | Q4: Yes
  *   **Description:** Health is a biological fact; violating human nature is intrinsically wrong; therapy is a duty while enhancement is forbidden; the state must ban or strictly separate enhancement.
  *   **Literature:** Leon Kass, *The Wisdom of Repugnance*; Michael Sandel (partial overlap).
  *   **Status:** **Viable.** Coherent, though contested on Q1 and Q2.

  ### 2. Moderate Bioconservatism
  *   **Answer Key:** Q1: Yes | Q2: Yes | Q3: Yes | Q4: No
  *   **Description:** Nature constrains us and therapy trumps enhancement, but the state should not legally ban permissible enhancements, merely distinguish them institutionally (e.g., medical insurance won't cover them).
  *   **Literature:** Some interpretations of the President's Council on Bioethics (2003).
  *   **Status:** **Viable.** Distinguishes moral wrongness from legal prohibition.

  ### 3. Daniels-style Liberal Egalitarianism
  *   **Answer Key:** Q1: Yes | Q2: No | Q3: Yes | Q4: Yes
  *   **Description:** Health is objective (normal functioning); nature imposes no intrinsic constraints; but justice requires prioritising health to protect fair equality of opportunity. Institutional distinction is required for resource allocation.
  *   **Literature:** Norman Daniels, *Just Health*.
  *   **Status:** **Viable.** The dominant 'mainstream' bioethical position.

  ### 4. The 'Medical Model' Libertarian
  *   **Answer Key:** Q1: Yes | Q2: No | Q3: No | Q4: Yes
  *   **Description:** Health is a biological fact, and there are no moral constraints on enhancement, but the *medical profession* should remain distinct from the *commercial enhancement industry* to preserve trust, even if justice doesn't prioritise therapy.
  *   **Literature:** **Unnamed.** Often implied in medical association guidelines.
  *   **Status:** **Underexplored.** Someone should write the paper on whether professional integrity requires this distinction absent a justice-based one.

  ### 5. Transhumanist Libertarianism
  *   **Answer Key:** Q1: Yes | Q2: No | Q3: No | Q4: No
  *   **Description:** Health is real, but not special. Morphological freedom is paramount. No priority for therapy, no regulatory distinction. All interventions are consumer choices.
  *   **Literature:** Nick Bostrom; Julian Savulescu (Procreative Beneficence).
  *   **Status:** **Viable.** Coherent, but often criticised for ignoring social determinants of health.

  ### 6. Hard Welfarism (Utilitarian)
  *   **Answer Key:** Q1: No | Q2: No | Q3: No | Q4: No
  *   **Description:** 'Health' is just a proxy for wellbeing. There is no biological fact of normality. Only wellbeing matters. No priority for therapy, no regulatory distinction.
  *   **Literature:** Peter Singer; John Harris.
  *   **Status:** **Viable.** The most radical rejection of the distinction.

  ### 7. Soft Welfarism (Prioritarian)
  *   **Answer Key:** Q1: No | Q2: No | Q3: Yes | Q4: No
  *   **Description:** Health is normative, not natural. However, we should prioritise the worse off (who usually need therapy) without drawing a hard conceptual line between therapy and enhancement.
  *   **Literature:** Some capabilities approach proponents (Nussbaum-adjacent).
  *   **Status:** **Viable.** Avoids the metaphysical baggage of Daniels while keeping distributive concern.

  ### 8. Social Constructivist Separatism
  *   **Answer Key:** Q1: No | Q2: Yes | Q3: Yes | Q4: Yes
  *   **Description:** 'Normal functioning' is a social construct, *but* we should treat this construct as morally binding to preserve social meaning or identity. Therapy restores social standing; enhancement disrupts it.
  *   **Literature:** **Unnamed.** (Closest to some feminist critiques of medicalisation).
  *   **Status:** **Deeply Unattractive/Unstable.** If health is constructed (Q1-No), it is difficult to argue it imposes intrinsic constraints (Q2-Yes) without slipping into conservatism about *social norms* rather than *nature*.

  ### 9. The 'Incoherent' Naturalist-Normativist
  *   **Answer Key:** Q1: Yes | Q2: Yes | Q3: No | Q4: No
  *   **Description:** Health is a biological fact and nature constrains us, *but* justice does not prioritise therapy and the state should not distinguish them.
  *   **Literature:** **Empty.**
  *   **Status:** **Incoherent.** If nature constrains us (Q2-Yes), it is difficult to justify why justice would not prioritise restoring that nature (Q3-No). This view claims nature is sacred but resource allocation should ignore it.

  ### 10. The 'Technocratic' Manager
  *   **Answer Key:** Q1: No | Q2: No | Q3: Yes | Q4: Yes
  *   **Description:** Health is not a natural fact, and nature imposes no constraints, yet we must prioritise therapy and regulate it differently for purely pragmatic/administrative reasons (e.g., budgeting categories).
  *   **Literature:** **Unnamed.** (Common in NHS/administrative practice).
  *   **Status:** **Underexplored.** Philosophically cynical but practically common. Needs defence on why pragmatic categories shouldn't be revised if they lack normative grounding.

  ### 11. The 'Expressivist' Liberal
  *   **Answer Key:** Q1: No | Q2: No | Q3: No | Q4: Yes
  *   **Description:** No natural facts, no intrinsic constraints, no justice priority. However, the state should distinguish them to avoid sending an 'expressivist' message that disabled people are less valuable.
  *   **Literature:** Disability rights critics of screening (e.g., Parens, Asch).
  *   **Status:** **Viable.** Distinct from Daniels because the justification is expressive, not based on opportunity or biology.

  ### 12. The 'Post-Human' Egalitarian
  *   **Answer Key:** Q1: Yes | Q2: No | Q3: Yes | Q4: No
  *   **Description:** Health is biological, no nature constraints. We prioritise therapy *for now* to ensure everyone reaches a baseline, but ultimately aim for a society where enhancement is universal and the distinction dissolves.
  *   **Literature:** **Unnamed.** (Some readings of Agar).
  *   **Status:** **Underexplored.** A transitional view. Coherent, but requires a theory of 'sufficientarianism' that evolves over time.

  ---

  ## Part 3: Limitations and Indistinguishable Pairs

  **1. The Daniels/Bostrom Convergence (Leaves 3 & 5)**
  This tree cannot separate a Daniels-style Egalitarian (Leaf 3) from a Transhumanist (Leaf 5) if the Transhumanist accepts that, *contingently*, therapy is currently more cost-effective for wellbeing. Both might support therapy priority in policy (Q3-Yes) but for entirely different reasons (Opportunity vs. Wellbeing). The tree captures the *commitment* to priority, not the *justification* for it, at Q3.

  **2. The Welfarist Collapse (Leaves 6 & 7)**
  Hard and Soft Welfarists (Leaves 6 & 7) may be indistinguishable in practice. A Prioritarian (Leaf 7) will often prioritise therapy simply because the sick are worse off. This looks identical to the Hard Welfarist (Leaf 6) who calculates that curing sickness yields more utility than enhancing the healthy. The distinction is theoretical (rights/priority vs. aggregation), not necessarily practical.

  **3. What is Actually Settled?**
  *   **Settled:** There is no consensus on the metaphysics of health. Do not assume 'disease' is an objective category.
  *   **Settled:** The therapy/enhancement distinction does not map perfectly onto 'medical necessity' vs. 'luxury'. (e.g., Vaccination is enhancement relative to baseline immunity but counted as therapy).
  *   **Contested:** Whether 'normal species functioning' is a coherent biological kind.
  *   **Contested:** Whether justice is health-specific (Daniels) or all-purpose (Welfarists).
  *   **Contested:** Whether 'human nature' has normative weight.

  **4. Empty Leaf Analysis**
  *   **Leaf 9 (Incoherent):** This position is empty because it asserts a deontological constraint (nature) without a deontological distribution rule. It is logically possible but normatively unstable.
  *   **Leaf 8 (Unattractive):** This position is rarely defended because it combines social constructivism (usually progressive) with bioconservatism (usually traditionalist). It requires arguing that social constructs are binding moral truths, which most constructivists reject.

  ---

  **Facilitator's Note:** Use this handout to interrupt debates where participants say "Enhancement is unfair." Ask them: "Is that Leaf 3 (Opportunity), Leaf 7 (Prioritarian), or Leaf 11 (Expressivist)?" Usually, they haven't decided.
