  # JOINT STATEMENT ON THE RAVEN PARADOX
  **Following Adversarial Collaboration between Proponents of Hempelian Confirmation Theory and Selective Confirmation Theory**

  **Date:** October 26, 2023
  **Signatories:** [The Hempelian Theorist], [The Selective-Confirmation Theorist]

  ## 1. Agreed Claims

  We, the undersigned, having engaged in good-faith dialogue regarding the paradox of confirmation originally formulated by Carl G. Hempel, affirm the following claims as common ground. These claims establish the logical and phenomenological constraints within which our disagreement persists.

  1.  **Logical Equivalence:** We agree that within classical first-order logic, the hypothesis $H_1$ ("All ravens are black," formalized as $\forall x (Rx \to Bx)$) is logically equivalent to the hypothesis $H_2$ ("All non-black things are non-ravens," formalized as $\forall x (\neg Bx \to \neg Rx)$). Any evidence that entails the falsity of one entails the falsity of the other.
  2.  **Satisfaction of the Contrapositive:** We agree that the observation report $E$ ("Object $a$ is a green apple"), which entails that $a$ is not black and $a$ is not a raven ($\neg Ba \land \neg Ra$), satisfies the antecedent and consequent of the contrapositive hypothesis $H_2$.
  3.  **The Derivation of the Paradox:** We agree that the paradoxical conclusion—that observing a green apple confirms that all ravens are black—follows validly from the conjunction of two principles:
      *   *Nicod's Condition (NC):* An observation of an $F$ that is $G$ confirms the universal generalization $\forall x (Fx \to Gx)$.
      *   *The Equivalence Condition (EC):* If evidence $E$ confirms hypothesis $H$, and $H$ is logically equivalent to $H'$, then $E$ confirms $H'$.
      *   *Derivation:* $E$ confirms $H_2$ by NC. Since $H_1 \equiv H_2$, $E$ confirms $H_1$ by EC.
  4.  **The Explanandum:** We agree that an adequate theory of confirmation must account for the *asymmetry of scientific practice and intuition*. Specifically, a theory must explain why observing a black raven is treated as a robust test of $H_1$, while observing a green apple is typically ignored, regardless of whether the theory ultimately validates or invalidates the logical confirmation provided by the apple.
  5.  **Non-Zero Support:** We agree that, strictly speaking, the observation of a green apple is not *inconsistent* with the hypothesis that all ravens are black. We disagree on whether this mere consistency constitutes "confirmation" in a sense relevant to epistemology, but we agree it does not decrease the likelihood of the hypothesis being true.

  ## 2. Disagreements

  While we share the logical framework outlined above, we diverge on the normative and structural principles governing evidential support. The following table summarizes our residual disagreements.

  | Issue | Hempelian Position | Selective-Confirmation Position | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of Confirmation** | Confirmation is a purely logical relation between evidence sentences and hypothesis sentences, independent of context, background knowledge, or sampling intentions. | Confirmation is a triadic relation involving evidence, hypothesis, and a context (reference class, background knowledge, or sampling procedure). | Is confirmation a syntactic property or a pragmatic/epistemic relation? |
  | **2. The Equivalence Condition (EC)** | The EC is a non-negotiable adequacy constraint. To deny it is to deny that logically equivalent statements have the same empirical content. | The EC holds only relative to a fixed context. If the sampling procedure changes (e.g., sampling ravens vs. sampling non-black objects), the confirmatory power shifts, breaking the equivalence in practice. | Can logical equivalence be severed from evidential equivalence without contradiction? |
  | **3. The Status of the Green Apple** | The green apple *does* confirm "All ravens are black." The intuition that it does not is a psychological bias resulting from the vast disparity in class sizes (ravens vs. non-black things). | The green apple does *not* confirm "All ravens are black" in any meaningful sense, because it is not drawn from the relevant reference class (ravens) required to test that specific generalization. | Is the intuition that the apple is irrelevant a datum to be preserved or a bias to be explained away? |
  | **4. Explication of "Confirms"** | "Confirms" means "is a positive instance of." Any positive instance provides support, however minute. | "Confirms" means "increases the rational degree of belief via a testing procedure." An instance that cannot falsify the hypothesis in the given context provides no support. | Are we explicating the same pre-theoretic notion? |

  ## 3. Tests, Cases, and Predictions

  For each crux identified above, we have selected a concrete case or argument that bears on the dispute. We record our respective assessments below to clarify the nature of our divergence.

  ### Crux 1: Logic vs. Context (The "Artificial Universe" Case)
  **Case:** Imagine a closed universe containing exactly 100 objects. We know nothing about them other than their logical descriptions. We hypothesize "All spheres are red." We inspect a cube and find it is blue.
  *   **Hempelian Assessment:** In this context-free logical space, the blue cube confirms "All spheres are red" because it eliminates one possible falsifier of the contrapositive. The confirmation is real, measurable, and context-independent.
  *   **Selective-Confirmation Assessment:** Even here, confirmation depends on *how* the cube was selected. If we sampled from "non-red things," it confirms the contrapositive. If we sampled from "shapes," it is irrelevant to the color generalization. Without a specified sampling rule, the question "Does this confirm?" is incomplete.

  ### Crux 2: The Equivalence Condition (The "Legislative Test" Case)
  **Case:** A legislature wishes to verify "All eligible voters are registered." They can either (A) check the list of voters to see if they are registered, or (B) check the list of unregistered people to see if they are voters.
  *   **Hempelian Assessment:** Method A and Method B are logically equipotent. If Method B finds an unregistered person who is not a voter, it supports the law just as Method A does. Denying this undermines the logic of the law.
  *   **Selective-Confirmation Assessment:** Method B is pragmatically degenerate. The class of "unregistered things" is too vast and heterogeneous to serve as a valid reference class for testing voter eligibility. The equivalence holds logically, but the *confirmatory weight* is zero in Method B due to the sampling frame.

  ### Crux 3: Intuition as Datum vs. Bias (The "Degree of Support" Case)
  **Case:** We compare the confirmatory weight of one black raven ($E_1$) vs. one green apple ($E_2$) regarding $H$: "All ravens are black."
  *   **Hempelian Assessment:** $E_1$ provides more confirmation than $E_2$ only because ravens are rarer than non-black things. However, $E_2$ provides *some* non-zero confirmation. The intuition that $E_2$ provides *none* is a cognitive illusion regarding scale.
  *   **Selective-Confirmation Assessment:** $E_1$ provides positive confirmation; $E_2$ provides zero confirmation. The intuition that $E_2$ is irrelevant is correct and must be preserved by the theory. A theory that assigns non-zero support to $E_2$ fails to capture the concept of *evidential relevance*.

  ## 4. Note on Verbal Dispute

  We acknowledge that a portion of our disagreement is verbal, specifically regarding the definition of the predicate **"confirms."**

  *   **The Hempelian** uses "confirms" to denote a **logical consistency relation** augmented by instance satisfaction. On this definition, anything that does not falsify a universal generalization and satisfies its conditions (or the conditions of its equivalent) counts as confirmation.
  *   **The Selective-Confirmation Theorist** uses "confirms" to denote **incremental warrant within a testing context**. On this definition, evidence must be capable of risking falsification within a specific reference class to count as confirmation.

  **Why this is verbal:** If the Hempelian agrees to say "The apple provides logical instance support but no incremental warrant," and the Selective-Theorist agrees to say "The apple is logically consistent but not evidentially relevant," they may be describing the same mathematical state of affairs using different normative labels.

  **The Substantive Remainder:** However, a substantive disagreement remains regarding **normative epistemology**. Even if we agree on the definitions, we disagree on which definition ought to govern scientific inference. The Hempelian maintains that logical consistency *is* a form of warrant that scientists ignore at their peril (risking logical incoherence). The Selective-Theorist maintains that logical consistency without contextual relevance is epistemically inert and that adopting the Hempelian definition leads to misleading accounts of scientific reasoning. We leave this normative question unresolved.

  ***

  **Signed,**

  _________________________
  [The Hempelian Theorist]

  _________________________
  [The Selective-Confirmation Theorist]
