          *   *Apparent Theory:* Objectivism (meaning is what a reasonable person reads, not what parties thought).
          *   *Alternative Justification:* Efficiency, reliance interests, certainty, incentivizing careful drafting.
          *   *Underdetermination:* One can be an intentionalist *and* support the Parol Evidence Rule if one believes the written document is the best *evidence* of intent, or if protecting reliance is more important than finding true intent.

      *   **Wills (Testamentary Intent):**
