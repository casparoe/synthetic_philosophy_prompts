answer: |-
  The inconsistency you identify lies at the heart of legal hermeneutics. It reveals that legal interpretive doctrines are rarely pure applications of a single philosophy of language. Instead, they are hybrid constructs that blend theories of meaning with policy goals, institutional constraints, and normative judgments about fairness. To understand this, we must distinguish between the *ontology of meaning* (what meaning *is*) and the *epistemology of proof* (how we *find* it), as well as the *normative rules* (how we *ought* to enforce it).

  Here is a reconstruction of the implicit theories presupposed by each practice, an analysis of whether they commit the law to specific philosophical views, and an explanation of where these practices are philosophically underdetermined.

  ### 1. Contracts and the Parol Evidence Rule

  **The Surface Theory: Objective Intentionalism (or Promisee Reliance)**
  On its face, the parol evidence rule presupposes an **objective theory of meaning**. It posits that the meaning of a contract is not the meeting of the minds (subjective intent) but the meeting of the signs. Under this view, meaning resides in the public text as understood by a reasonable third party. If the text is integrated, the "law" of the transaction is the document itself, not the private thoughts of the drafters.

  **Is it Committed to This Theory?**
  No. The parol evidence rule is philosophically underdetermined. It can be justified without adopting an objective theory of meaning.
  *   **Evidentiary Presumption:** A court could believe that meaning *is* subjective intent but hold that a final, signed writing is the most reliable *evidence* of that intent. Excluding prior drafts or oral promises is not a denial that intent matters, but a judgment that the final document is the best proxy for it.
  *   **Normative/Policy Justification:** The rule is often defended on grounds neutral to semantic theory:
      *   **Reliance:** Third parties (assignees, lenders) need to rely on the document without investigating secret negotiations.
      *   **Incentives:** Sophisticated parties should be incentivized to draft carefully. If they know oral side-deals will override the text, they will draft less precisely.
      *   **Administrability:** Litigation over "what we said three months ago" is costly and prone to perjury.

  **Where it is Underdetermined:**
  A judge who is a philosophical intentionalist (believing meaning *is* mental state) can consistently apply the parol evidence rule. They would simply argue that while intent is the goal, the *rule* protects the integrity of the transaction better than a search for subjective truth. Thus, the practice does not commit the law to objectivism; it merely fits well with it.

  ### 2. Wills and Testamentary Intent

  **The Surface Theory: Subjective Intentionalism**
  In contrast to contracts, the law of wills traditionally prioritizes the **subjective intent of the testator**. If a will contains a scrivener's error or ambiguous phrasing, courts frequently admit extrinsic evidence to ascertain what the testator actually meant to do. The presupposition here is that a will is a unilateral expression of will, not a bargain. The "meaning" of the will is the disposition the testator intended to effectuate.

  **Why Practical Considerations Cut Differently:**
  You asked why reliance and administrability concerns do not restrict evidence in wills as they do in contracts.
  *   **Absence of Bargain:** Contracts involve reliance interests because the promisee gives consideration. Beneficiaries of a will give nothing; they are donees. Therefore, protecting their "reliance" on the text is less morally urgent than protecting the testator's donative intent.
  *   **No Counterparty:** There is no other living party to the transaction who would be harmed by looking behind the text. The only risk is to the estate's efficiency or potential heirs, which the law weighs lighter than the testator's autonomy.
  *   **Drafting Incentives:** Testators are often unsophisticated and draft without counsel. Applying a strict parol evidence rule to wills would frustrate intent due to amateur drafting errors, whereas contract parties are presumed to be sophisticated actors.

  **Where it is Underdetermined:**
  Even here, the law is not purely intentionalist. The "Statute of Wills" requires writing and signatures. A pure intentionalist would enforce a video recording or an oral deathbed wish. The requirement of a writing shows that even in wills, there is a textualist constraint imposed for evidentiary reliability. Thus, the practice admits evidence of intent *within the bounds* of a textual framework, showing a mix of subjective theory and objective safeguards.

  ### 3. Statutory Interpretation and Textualism

  **The Surface Theory: Public Meaning Originalism**
  Statutory textualism explicitly commits to the view that the meaning of a law is its **public semantic meaning** at the time of enactment, not the private intentions of the legislators. Textualists argue that "Congress" is a multi-member body with no single mind; therefore, "legislative intent" is a fiction. Only the text voted on and presented to the public constitutes the law.

  **Is it Committed to This Theory?**
  Not necessarily. Textualism can be defended on institutional grounds that are neutral to the philosophy of language.
  *   **Democratic Legitimacy:** Only the text was voted on and bicamerally presented. Committee reports were not voted on. To enforce the reports is to allow unelected staff to legislate. This is a constitutional argument, not a semantic one.
  *   **Notice and Fairness:** Citizens are bound by the law. They can read the statute; they cannot read the floor debates. Fairness requires that the law be what the public can access.
  *   **Reliability (The Epistemic Argument):** A judge might believe meaning *is* intent but refuse to consult legislative history because it is manipulable, contradictory, or unreliable. This is a "skeptic intentionalist" position: "I want to find intent, but history is noise, so I will stick to the text."

  **Where it is Underdetermined:**
  This is the area of greatest philosophical flexibility. A judge can adopt textualist *methods* without adopting textualist *ontology*.
  *   **Scenario A:** The judge believes meaning is public meaning. (Philosophical Textualism).
  *   **Scenario B:** The judge believes meaning is intent, but thinks legislative history is too corrupt to prove intent accurately. (Epistemic Textualism).
  *   **Scenario C:** The judge believes meaning is intent, but thinks the Constitution forbids judges from enforcing unenacted intentions. (Constitutional Textualism).

  All three judges produce the same practice (ignoring legislative history), but only the first is committed to the theory that meaning resides solely in the text.

  ### Synthesis: Ontology vs. Policy

  The legal system's inconsistency arises because it conflates three distinct questions:
  1.  **What is meaning?** (Philosophy of Language)
  2.  **How do we prove it?** (Epistemology/Evidence)
  3.  **What should we enforce?** (Normative Policy)

  **The Parol Evidence Rule** is primarily a answer to Question 3 (Policy). It prioritizes certainty and reliance over the accurate discovery of intent (Question 1). It is underdetermined because a court can prioritize certainty regardless of whether it thinks meaning is objective or subjective.

  **The Law of Wills** is primarily an answer to Question 1 (Ontology). It prioritizes the testator's mental state. It relaxes evidentiary rules (Question 2) to serve that ontological commitment, because the policy costs (Question 3) of doing so are lower than in contracts.

  **Statutory Textualism** is a battleground where all three collide. However, the practice of excluding legislative history is underdetermined because it can be supported by constitutional structure (Question 3) or evidentiary skepticism (Question 2) without requiring a commitment to public meaning ontology (Question 1).

  ### Conclusion

  The legal system does not adhere to a unified theory of textual meaning.
  *   **Contracts** presuppose that **reliance interests** trump subjective intent, which *mimics* an objective theory of meaning but is justified by commercial policy.
  *   **Wills** presuppose that **donative intent** trumps textual clarity, which *mimics* a subjective theory of meaning but is justified by the lack of bargaining reliance.
  *   **Statutes** are divided because the debate is often less about what meaning *is* and more about **who has the authority to fix it** (the judiciary vs. the legislature) and **what evidence is trustworthy**.

  Therefore, none of these practices strictly commits the law to a specific philosophical theory of meaning. They are all compatible with rival theories if one accepts that legal interpretation is a normative enterprise designed to achieve stability, fairness, and democratic legitimacy, rather than a purely linguistic exercise in decoding authorial thought. The "meaning" of a legal text is ultimately a legal conclusion, not just a semantic fact.
