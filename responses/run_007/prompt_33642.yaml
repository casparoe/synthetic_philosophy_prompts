      *   **Deliverables:**
          *   (a) Rules & Materials (payoff scheme).
          *   (b) Timeline (80 mins).
          *   (c) Debrief Script (mapping to Hume, Rawls, Scanlon, Voluntarism).
          *   (d) Risk Assessment (what goes wrong).
          *   (e) Follow-up (question/reading).

  2.  **Deconstruct the Philosophical Puzzle:**
      *   *Hume/Rawls (Practice/Convention):* Promise-keeping is a social artifact. It only makes sense within a system where everyone expects it. Breaking a promise is wrong because it undermines the system (free-riding).
      *   *Scanlon (Expectation/Reliance):* It's about the specific relationship. I created an expectation in *you*, and breaking it harms *you* (Principle F).
      *   *Voluntarist/Authority (The "Third Thing"):* The act of promising itself transfers a right or creates an obligation regardless of consequences or practice. (e.g., Shiffrin, Raz, or classic Will Theory).
      *   *The Tension:* If I promise you in a vacuum (no practice, no reliance), am I still bound? Phase 1 should make the Practice view look obvious. Phase 2 should make it look insufficient, prompting the need for Scanlon or Voluntarism.

  3.  **Designing the Activity (The "Trust & Transfer" Game):**
      *   *Constraint:* Needs to be doable in 80 mins with 18 students.
      *   *Phase 1 (The Practice):* Needs to be a Public Goods Game or Iterated Prisoner's Dilemma variant where "promising" boosts collective yield.
          *   *Idea:* A "Contract Market." Students pair up. They can invest points. If both promise to invest, they get a bonus. If one defects, they steal the other's points. But there's a "Group Pot" that grows if *everyone* keeps promises.
          *   *Refinement:* Let's make it simpler to track. A "Coordination Game."
          *   *Mechanism:* "The Joint Venture." Pairs. Each gets 5 tokens. They can keep or invest. If both invest, they get 10 each. If one invests and one keeps, the keeper gets 15, investor gets 0. If both keep, 5 each.
          *   *The "Promise" Twist:* Before deciding, they can make a public promise to the *room* to invest. If *anyone* breaks a public promise, the "Market Bonus" (a pot of candy/points for everyone) shrinks. This captures Rawls/Hume: breaking hurts the *practice* (the Market Bonus), not just the partner.
      *   *Phase 2 (The Isolation):* Needs to strip away the group penalty.
          *   *Mechanism:* Private pairs. No public announcement. No group pot. Just "I promise you."
          *   *The Kicker:* The payoff structure remains the same (Prisoner's Dilemma), but the *social cost* of breaking is removed. Do they still feel bound?
          *   *Refinement for "Jarring Transition":* In Phase 1, the promise is to the *group* (upholding the practice). In Phase 2, the promise is *strictly bilateral*.
      *   *Stakes:* Candy works best. Extra credit can be contentious. Let's use candy + a small pool of "bonus points" for the whole class if Phase 1 succeeds.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Materials:* Tokens (paper slips), Candy, Whiteboard, Blindfolds or Dividers (for Phase 2 privacy).
      *   *Timeline:*
