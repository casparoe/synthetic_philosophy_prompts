answer: |-
  Here is a proposal for the in-class activity, designed to fit your seminar's specific philosophical trajectory and logistical constraints.

  # Activity Title: "The Practice and The Promise"

  ## (a) Rules and Materials

  **Materials Needed:**
  *   **Currency:** 100 chocolate coins (or equivalent candy).
  *   **Tokens:** 36 small slips of paper (marked "C" for Cooperate, "D" for Defect).
  *   **Dividers:** 9 folders or cardboard dividers (to create privacy in Phase 2).
  *   **Whiteboard:** To track the "Class Pot."
  *   **Handout:** A simple payoff matrix (printed or projected).

  **The Payoff Matrix (Standard Prisoner's Dilemma):**
  *   **Both Cooperate:** Each gets 3 coins.
  *   **Both Defect:** Each gets 1 coin.
  *   **One Cooperates / One Defects:** Defector gets 5 coins; Cooperator gets 0.

  ### Phase 1: The Social Practice (25 Minutes)
  **Setup:** Students remain in a large circle. The "Class Pot" (a bowl of 20 bonus coins) is placed visibly in the center.
  **The Rule:** Students form 9 pairs. Before making their move, each pair must stand and announce to the *room*: "We promise to Cooperate."
  **The Practice Mechanism:**
  1.  If **all 9 pairs** keep their promise (Both Cooperate), the Class Pot is distributed evenly (1 coin each).
  2.  If **any pair** breaks their promise (one or both Defect), the Class Pot is immediately confiscated by the instructor (representing the degradation of the practice).
  3.  Individual payoffs are still determined by the matrix.
  **Goal:** To demonstrate that breaking a promise harms a *third party* (the group/bowl), aligning with Hume/Rawls.

  ### Phase 2: The Isolated Promise (25 Minutes)
  **Setup:** Rearrange chairs into 9 dyads facing each other. Place dividers between dyads so pairs cannot see or hear others.
  **The Rule:** The Class Pot is removed. The instructor turns their back.
  **The Instruction:** "You are now epistemically isolated. No one else in this room will know your choice. The group bonus is gone. There is no reputational cost. You may make a promise to your partner, or you may not. If you promise, you must say it quietly, directly to them."
  **The Twist:** After the promise (if made), students write their choice (C or D) on a slip, fold it, and hand it to the instructor privately.
  **Goal:** To strip away the "Practice" justification. If students still feel bound to keep the promise, Rawls/Hume cannot explain why.

  ---

  ## (b) Timeline (80 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Introduction** | Explain the stakes (candy) and the core question: "What makes the promise stick?" |
  | **00:05 – 00:30** | **Phase 1** | **The Practice.** Pairs announce publicly. Play round. Tally results. Distribute Class Pot *only* if 100% compliance. (Allow 2 rounds if time permits, but 1 deep round is better). |
  | **00:30 – 00:35** | **Transition** | **The Jarring Shift.** Physically move chairs. Remove the Class Pot. Instructor steps back. Explicitly state: "The social contract is now void." |
  | **00:35 – 01:00** | **Phase 2** | **The Isolation.** Private negotiation. Private voting. Collect slips. Calculate individual winnings only. |
  | **01:00 – 01:20** | **Debrief** | **Philosophical Mapping.** Connect feelings to texts (see script below). |

  ---

  ## (c) Debrief Script & Philosophical Mapping

  *Instructor Notes: Do not reveal the aggregate results of Phase 2 immediately. Ask for feelings first.*

  **1. Anchoring Phase 1 (Rawls & Hume)**
  *   **Ask:** "In Phase 1, why did you keep the promise? Be honest."
  *   **Expected Answer:** "I didn't want to ruin the bonus for everyone," or "It felt unfair to take the candy if others were playing by the rules."
  *   **Map to Text:** "This is **Rawls's 'Practice Conception'** and **Hume's Convention**. The obligation didn't come from the person in front of you; it came from the *system*. You were avoiding free-riding. When you broke the promise, you didn't just hurt your partner; you taxed the 'Class Pot.' The normativity was external."

  **2. Confronting Phase 2 (The Failure of Practice)**
  *   **Ask:** "In Phase 2, the Class Pot was gone. No one was watching. Did the feeling of obligation disappear?"
  *   **Scenario A (Most kept promises):** "If you felt bound, Rawls cannot explain this. There was no practice to undermine. So what created the bond?"
      *   *Scanlon's Entry:* "Did you feel bound because you didn't want to disappoint *them*? Because you manipulated their expectations?" This is **Scanlon's Principle F**. The wrong is interpersonal, not systemic.
  *   **Scenario B (Many broke promises):** "If you felt free to break it, does that mean promises are *only* binding when the practice supports them?"

  **3. Introducing the "Third Thing" (Voluntarism/Authority)**
  *   **The Pivot:** "Consider this: In Phase 2, imagine your partner said, *'I won't rely on your promise. I expect you to defect.'* If you promised anyway, did you bind yourself?"
  *   **The Argument:** "Scanlon says obligation comes from *expectations created*. But what if I promise without creating expectations? Or what if I promise even if you release me?"
  *   **The Voluntarist View:** "This suggests a **Normative Power**. By saying 'I promise,' you didn't just predict behavior; you changed the normative landscape. You transferred authority over that action to your partner. This is the **Will Theory** (or Shiffrin's view). The obligation exists because *you authored it*, not because the practice supports it or because reliance occurred."

  **4. Synthesis**
  *   "Phase 1 showed us why we need a *practice* to make promising intelligible (Hume). Phase 2 showed us that the *force* of the promise might survive the practice (Voluntarism/Scanlon). The puzzle remains: Can the Will Theory stand without the Practice?"

  ---

  ## (d) Risk Assessment: What Will Go Wrong

  **1. The "Importing Norms" Risk (High Probability)**
  *   **The Problem:** Students in Phase 2 may feel bound simply because they are still in a classroom, subject to the instructor's authority, carrying over the norms from Phase 1. They aren't truly "isolated."
  *   **Mitigation:** During the Transition, explicitly name this risk. Say: *"You are likely importing the norms from Phase 1. I want you to try to suppress that. Imagine you are leaving this room and never seeing these people again."*
  *   **Debrief Handling:** If they admit this, use it! It proves Hume/Rawls: without the internalized practice, the obligation feels artificial.

  **2. The "Cynical Defector" Risk**
  *   **The Problem:** A few students might defect in Phase 1 just to see what happens, destroying the Class Pot and making everyone resentful.
  *   **Mitigation:** Frame Phase 1 as "Building the Institution." If the Pot is lost, pause and ask: "Is the practice now dead? Can we restart it?" This mirrors the fragility of conventions.

  **3. The "Scanlon Conflation" Risk**
  *   **The Problem:** Students may conflate "Practice" (Rawls) with "Expectations" (Scanlon).
  *   **Mitigation:** In the debrief, distinguish them sharply. Rawls = Harm to the *system*. Scanlon = Harm to the *person*. Phase 2 removes the system harm; ask specifically if they feared harming the *person* or just breaking a *rule*.

  **4. Time Overrun**
  *   **The Problem:** Negotiations in Phase 2 can drag on.
  *   **Mitigation:** Enforce a strict 3-minute negotiation window. Use a timer on the projector.

  ---

  ## (e) Follow-Up: Question and Reading

  **Discussion Question for Next Session:**
  > "If the normativity of promising comes from the exercise of a normative power (the Will Theory), why do we need a social practice (Hume/Rawls) to make that power intelligible? Can you have the power without the practice, or does the practice constitute the power?"

  **Suggested Short Reading:**
  *   **Seana Shiffrin, "Promising, Intimate Relationships, and Conversational Understanding" (2008), pp. 490–503.**
      *   *Why:* Shiffrin bridges the gap. She argues against the pure Practice view (Rawls) but also critiques pure Reliance (Scanlon). She emphasizes the *moral agency* involved in promising, which aligns perfectly with the "Phase 2 feeling" of self-binding. It gives students vocabulary for the "Third Thing" introduced in the debrief.

  ---

  ### Instructor's Note on the "Jarring Transition"
  To make the transition between Phase 1 and Phase 2 truly effective, you must change the *tone* of the room. In Phase 1, be a "Market Regulator" (loud, public, tracking the Pot). In Phase 2, become a "Ghost" (quiet, turned away, minimizing your presence). This performative shift helps students feel the removal of the social scaffold, making the persistence of the obligation (if it persists) much more philosophically salient.
