          *   *Revised:* Intro (5), Phase 1 (20), Transition (5), Phase 2 (20), Debrief (30). Debrief needs more time.

      *   *Phase 1 Design:* "The Commons." 18 students. 9 pairs.
          *   Decision: Cooperate (C) or Defect (D).
          *   Payoff: Standard PD.
          *   *The Practice:* Before deciding, pairs declare "We Promise to Cooperate."
          *   *The Sanction:* If *any* pair defects after promising, *everyone* in the class loses a piece of candy from a central bowl.
          *   *Lesson:* Breaking a promise harms the *system* (the candy bowl), not just the partner. This validates Rawls/Hume.

      *   *Phase 2 Design:* "The Desert Island."
          *   Rearrange chairs. Pairs face each other.
          *   Instruction: "You are the last two people on earth. No one will know what you do. The class candy bowl is gone."
          *   Task: Make a promise to cooperate. Then decide.
          *   *The Twist:* The payoff is individual only. No group penalty.
          *   *Lesson:* If you still feel bound, why? It's not the practice (Rawls). Is it reliance (Scanlon)? Or the act itself (Voluntarism)?

      *   *Debrief Script:* Needs to connect specific feelings to specific philosophers.
          *   Phase 1 anxiety = Fear of undermining the practice (Rawls).
          *   Phase 2 anxiety = Fear of betraying the person (Scanlon) OR Feeling of self-binding (Voluntarism).
          *   The "Jarring" moment = When the group penalty is removed but the obligation feels like it remains.

      *   *Risk Assessment:*
          *   *Risk 1:* Students treat it as just a game (ludic fallacy). *Mitigation:* Emphasize the "promise" speech act.
          *   *Risk 2:* Phase 2 feels identical to Phase 1 because they are still in class. *Mitigation:* Physical rearrangement, explicit framing ("No one is watching").
          *   *Risk 3:* Cynicism. Everyone defects. *Mitigation:* Need high enough reward for cooperation.

      *   *Follow-up:* Shiffrin's "Promising, Intimate Relationships, and Conversational Understanding" or Raz's "Promises and Obligations." Or a specific question about the "Normative Power."

  5.  **Refining the Payoff Scheme:**
      *   Candy is good. Let's use "Chocolate Coins."
      *   Phase 1: If both Cooperate = 3 coins each. If one Defects = 5 coins (Defector), 0 (Cooperator). If both Defect = 1 coin each.
      *   *The Practice Pot:* A bowl of 20 extra coins. If 100% promise-keeping rate, everyone gets 1 bonus. If any break, the bowl is destroyed.
      *   Phase 2: Same individual payoffs. No Practice Pot.

  6.  **Developing the Debrief Script:**
      *   Must explicitly name Hume, Rawls, Scanlon.
      *   Must introduce the "Normative Power" idea (Shiffrin/Raz) as the solution to the Phase 2 puzzle.
      *   Needs to handle the "Importing Norms" risk (Risk D).

  7.  **Final Review against Constraints:**
      *   18 students? Yes, 9 pairs.
      *   80 mins? Yes, timing looks tight but workable.
      *   Movable chairs? Yes, used for Phase 2 isolation.
      *   Whiteboard? Yes, for tracking scores.
      *   Two phases? Yes.
      *   Deliverables (a-e)? All covered.

