  7.  **Final Polish:** Ensure the tone is authoritative yet pedagogical (speaking to a teacher). Make sure the Nyāya perspective shines through as requested ("You're a specialist in Nyāya epistemology"), but remains fair to the other schools. *Self-Correction:* Ensure I explicitly distinguish *pramāṇa* (instrument) from *pramā* (result) in the definitions.

      *Refining the "Knockout":* While Irreducibility is key, the *Validity Certification* (Svataḥ vs Parataḥ) is arguably the deeper metaphysical split. However, for *counting* the pramāṇas (which is the prompt's focus on the "list"), Irreducibility is the specific filter. I will argue for Irreducibility as the list-filter, but acknowledge Validity as the deeper epistemic split. Actually, the prompt asks what knocks out *contenders* regarding the *list*. Irreducibility is the best fit for why Mīmāṃsā adds more than Nyāya. But Cārvāka is knocked out by Ontological Coverage (can't navigate the world). Buddhists are knocked out by Linguistic Autonomy (for orthodox schools). Let's stick with **Causal Irreducibility** as the main battleground for the *number* dispute, but note that **Ontological Coverage** knocks out Cārvāka. I'll select **Causal Irreducibility** as the single most work-doing requirement for the *debate about the list*.

