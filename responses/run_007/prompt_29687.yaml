answer: |-
  This is a profound pedagogical gap. Too often, we teach the *lists* (Cārvāka: 1, Buddhist: 2, Nyāya: 4, Mīmāṃsā: 6) without teaching the *logic of enumeration*. As a Nyāya specialist, I can tell you that the debate was never merely additive ("I'll add one more!"); it was argumentative, driven by specific meta-epistemological constraints.

  To adjudicate this dispute, we need a set of desiderata that function as filters. A candidate *pramāṇa* must pass through these filters to be counted. Below, I have distilled the implicit standards of the classical debate into six explicit desiderata.

  ### The Desiderata for an Adequate Theory of Pramāṇas

  **1. The Veridicality Condition (Yathārthatva)**
  *   **The Requirement:** The output of the instrument (*pramā*) must correspond to reality. A *pramāṇa* cannot, by definition, produce error.
  *   **The Case:** If an instrument yields false cognition (e.g., seeing a snake where there is a rope), it is defective (*doṣa*), not a genuine knowledge-source. Knowledge entails truth.
  *   **Status:** **Non-negotiable.** All schools agree on this. Disagreement lies in *how* we verify this (see Desideratum 4).
  *   **Pressure Point:** *Knowledge vs. Mere True Belief.* A lucky guess is true but not *pramā* because it lacks the specific causal chain (*karana*) of a *pramāṇa*. This condition ensures the theory tracks justification, not just truth.

  **2. The Causal Novelty Condition (Anadhigatatva)**
  *   **The Requirement:** The instrument must generate cognition of an object *not previously apprehended* in that specific context.
  *   **The Case:** This is the primary exclusion criterion for **Memory**. Memory reproduces past knowledge; it does not generate new knowledge. If memory were a *pramāṇa*, the count would be infinite (remembering that you remembered...).
  *   **Status:** **Non-negotiable** for the orthodox schools (āstika). (Buddhists nuance this regarding reflexive awareness, but generally agree knowledge reveals the unknown).
  *   **Pressure Point:** *Pramāṇa vs. Pramā.* The *pramāṇa* is the causal process; the *pramā* is the resulting cognition. This condition ensures the *pramāṇa* is a generative cause, not a reproductive storage mechanism.

  **3. The Causal Irreducibility Condition (Asādhāraṇa Kāraṇa)**
  *   **The Requirement:** Each *pramāṇa* must possess a unique causal structure that cannot be reduced to the operation of another *pramāṇa*.
  *   **The Case:** This is the battleground for the *number* of *pramāṇas*. If *testimony* is just *inference* (inferring the speaker is trustworthy), it is not a separate instrument. If *non-apprehension* is just *inference* (inferring absence from the lack of perception), it is not separate.
  *   **Status:** **Non-negotiable** for individuation, but **Contested** in application. Nyāya uses this to cut Mīmāṃsā's list down; Buddhists use it to cut Nyāya's list down.
  *   **Pressure Point:** *Testimony Reduction.* Does understanding a sentence require inferring the speaker's intent (Buddhist/Nyāya view sometimes), or does language convey meaning directly (Mīmāṃsā view)?

  **4. The Validity Certification Condition (Pramāṇya-vyavasthā)**
  *   **The Requirement:** The theory must explain how we know the *pramāṇa* has functioned correctly without circularity or infinite regress.
  *   **The Case:** If I need a second *pramāṇa* to validate the first, I need a third to validate the second. The theory must stop the regress.
      *   *Intrinsic (Svataḥ):* Validity is known automatically with the cognition (Mīmāṃsā).
      *   *Extrinsic (Parataḥ):* Validity is known through subsequent successful action or testing (Nyāya).
  *   **Status:** **Non-negotiable**, but the *method* is school-specific.
  *   **Pressure Point:** *Establishing Validity.* This is the engine of the *svataḥ/parataḥ* debate.

  **5. The Negative Fact Accommodation (Abhāva-jñāna)**
  *   **The Requirement:** The theory must account for how we know absences (e.g., "There is no pot on the table").
  *   **The Case:** We act on absences (we don't step where the hole is). If perception only grasps positives, how do we know negatives? Either we need a special instrument (*anupalabdhi*) or perception/inference must be stretched to cover it.
  *   **Status:** **Contested.** Cārvāka and Buddhists often deny real absence; Nyāya and Mīmāṃsā affirm it.
  *   **Pressure Point:** *Absence and Negative Facts.* This is the primary justification for adding *anupalabdhi* (non-apprehension).

  **6. The Error Resilience Condition (Khyāti-vyavasthā)**
  *   **The Requirement:** The theory must explain the possibility of error (illusion) without invalidating the *pramāṇa* itself.
  *   **The Case:** If perception is a *pramāṇa*, why do we see mirages? The theory must locate the defect (*doṣa*) in the conditions (bad light, diseased eye) rather than the instrument itself, or explain how invalid cognition arises differently than valid cognition.
  *   **Status:** **Non-negotiable.** A theory that cannot explain error collapses into skepticism or dogmatism.
  *   **Pressure Point:** *Error and Illusion.* Mīmāṃsā's *svataḥ* validity makes error hard to explain (if all cognition is initially valid, why is this one wrong?). Nyāya's *parataḥ* handles this easily (validity is confirmed later, so initial doubt is allowed).

  ***

  ### Jointly Unsatisfiable Desiderata (The Tensions)

  You asked for the friction points. These are the pairs where satisfying one makes satisfying the other difficult, forcing schools to choose sides.

  **1. Economy (Laghava) vs. Ontological Coverage**
  *   **The Tension:** To keep the list short (Economy), you must reduce complex cognitive events to basic instruments (e.g., reducing testimony to inference). To ensure we can know everything that exists (Coverage), you must posit specific instruments for specific ontological categories (e.g., a specific instrument for Absence, or for Vedic meaning).
  *   **The Conflict:** You cannot have the absolute economy of the Cārvāka (1 *pramāṇa*) and the full ontological coverage of the Mīmāṃsā (real absences, eternal duties, transcendent truths). One must give.

  **2. Intrinsic Validity (Svataḥ) vs. Error Resilience**
  *   **The Tension:** If validity is intrinsic (known immediately with the cognition), it is hard to explain why we ever accept an error as true initially. If every cognition shines forth as valid, error becomes a metaphysical mystery. If validity is extrinsic (Nyāya), we avoid this, but we risk skepticism (how do we ever *start* acting if we always need verification?).
  *   **The Conflict:** Mīmāṃsā prioritizes *Svataḥ* to protect the Vedas from doubt but struggles to explain illusion. Nyāya prioritizes Error Resilience but must work harder to avoid infinite regress in verification.

  ***

  ### Scorecard: Adjudicating the Schools

  Here is how the major contenders score against the desiderata.
  *(Scale: ✅ = Satisfies well, ⚠️ = Strained/Contested, ❌ = Fails)*

  | Desideratum | Cārvāka (Materialist) | Buddhist (Yogācāra/Sautrāntika) | Nyāya (Realist) | Bhāṭṭa Mīmāṃsā / Advaita |
  | :--- | :---: | :---: | :---: | :---: |
  | **1. Veridicality** | ✅ | ✅ | ✅ | ✅ |
  | **2. Causal Novelty** | ✅ | ✅ | ✅ | ⚠️ (Testimony can be "old") |
  | **3. Causal Irreducibility** | ❌ (Denies Inference) | ✅ (Strict reductionism) | ✅ (Balanced) | ⚠️ (Over-multiplication risk) |
  | **4. Validity Certification** | ❌ (No account for error) | ✅ (Pragmatic efficacy) | ✅ (Extrinsic/Success) | ✅ (Intrinsic/Presumption) |
  | **5. Negative Facts** | ❌ (Denies absence) | ⚠️ (Conceptual construct) | ✅ (Real object) | ✅ (Real object + *Anupalabdhi*) |
  | **6. Error Resilience** | ❌ (Perception never errs) | ✅ (Two-truths/Construction) | ✅ (Defect in conditions) | ⚠️ (Hard to explain initial error) |
  | **TOTAL** | **2/6** | **4/6** | **6/6** | **4.5/6** |

  ***

  ### The Knockout Requirement

  If you want to know which single requirement does the most work in knocking out contenders in the historical debate, it is **Desideratum 3: Causal Irreducibility**.

  Here is why:
  1.  **It eliminates Cārvāka:** They fail this because they deny *anumāna* (inference). Nyāya argues that without inference, you cannot even establish the validity of perception (e.g., recognizing fire from smoke requires inference). They fail to show perception is *sufficiently* independent to handle all human navigation.
  2.  **It trims Mīmāṃsā/Advaita:** This is the primary Nyāya attack on the 6-*pramāṇa* list. Nyāya argues that *arthāpatti* (postulation) is just a complex form of *anumāna* (inference). *Anupalabdhi* (non-apprehension) is just perception of the ground + inference of absence. By enforcing strict **Causal Irreducibility**, Nyāya reduces the Mīmāṃsā list from 6 to 4.
  3.  **It defines the Buddhist/Hindu split:** Buddhists reduce *śabda* (testimony) to *anumāna* (inference of speaker reliability). Orthodox schools must argue for the **Irreducibility** of language to keep *śabda* as a separate *pramāṇa*.

  While *Veridicality* is the definition of knowledge, it doesn't help count the *instruments*. While *Validity Certification* determines the *status* of knowledge, it doesn't determine the *number* of sources. **Causal Irreducibility** is the specific meta-criterion used to argue whether a cognitive process deserves its own slot on the list or should be merged into another. It is the arithmetic of epistemology.

  **Pedagogical Tip:** When teaching this, frame the debate not as "Who has the right list?" but "Who has the best justification for *individuating* causal processes?" That shifts the students from memorizing numbers to evaluating causal arguments.
