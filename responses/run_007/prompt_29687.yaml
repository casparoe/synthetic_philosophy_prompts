      *   *The "Knockout" Requirement:* **Causal Irreducibility.** This is where the debate actually lives. Everyone agrees on truth. Everyone agrees memory isn't a *pramāṇa*. The fight is about whether *upamāna*, *śabda*, *arthāpatti*, and *anupalabdhi* are *sui generis* causal processes or just complex forms of *anumāna*.

