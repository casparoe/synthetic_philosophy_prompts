  **Tolstoy's criteria for real art**
  For Tolstoy, art is not about beauty or skill, but a specific communicative activity. It occurs when one person consciously transmits a feeling they have genuinely lived through to others using external signs. If the audience experiences that same feeling, 'infection' has occurred. Three conditions must be met: sincerity (the artist must truly feel the emotion), infectiousness (the degree to which the audience catches it), and universality (accessibility to all people, not just the educated elite). Crucially, the content must align with the 'religious consciousness of the age,' promoting human unity and brotherhood rather than dividing people through exclusive pleasure. Art is a moral tool for spiritual progress, not mere amusement. He insisted that true art must unite mankind in shared emotion. This excludes art made solely for pleasure, which he saw as divisive. Anything failing these is 'counterfeit art,' designed merely for pleasure or prestige, which he believed dominated his own era.

  **The case against AI art**
  Tolstoy would likely view most AI generation as the ultimate counterfeit. His theory hinges on a soul-to-soul transmission; an algorithm has no soul, no lived experience, and no capacity for sincerity. When a diffusion model generates an image, it calculates statistical probabilities, not emotional truths. There is no feeling to transmit, only a simulation of style derived from scraped human work. For Tolstoy, this is akin to the professionalized, technical art he despised—dazzling on the surface but spiritually empty. Furthermore, the corporate ownership of these tools mirrors the aristocratic patronage he condemned. If the 'artist' is a machine owned by capitalists, the work serves commerce, not brotherhood. The viewer might feel something, but Tolstoy would argue this is a physiological reaction to stimuli, not spiritual infection from a fellow human. Without a conscious sender striving for moral unity, the circuit of art is broken. The deception involved in presenting machine output as human expression violates the core requirement of sincerity, making it a lie rather than a bridge between souls. It creates a false semblance of connection without the reality. This lack of struggle removes the sacrifice necessary for true sincerity, turning art into mere content consumption for the idle rich.

  **The case for AI art**
  However, Tolstoy valued universality above technical mastery. AI democratizes image-making, allowing peasants and professors alike to visualize inner states without years of guild training. If the prompter is the artist, the AI is merely a brush. A grieving person prompting an image of loss may transmit sincere feeling through the curation of results, selecting the one that matches their internal state. The selection process itself becomes an act of will, where the human spirit imposes meaning onto the machine's chaos. Thus, the human element persists. If the viewer is infected by that grief, the functional criterion is met. Tolstoy hated obscurity; AI can make complex feelings immediately visible. Moreover, if AI art is used to visualize shared human struggles—poverty, peace, love—it could serve the 'religious consciousness' of unity better than exclusive high art. The medium matters less than the moral intent. If the tool breaks class barriers to expression, allowing the masses to share feelings previously locked behind technical skill, it aligns with his demand for universal accessibility. Furthermore, if these images circulate among common people rather than galleries, they bypass the corrupting influence of critics. Tolstoy might see this as a return to folk art, where the function is communication, not prestige.

  **Your verdict**
  Ultimately, Tolstoy would judge the usage, not the tool. He would likely condemn the current industry as a factory of counterfeit amusement for the idle. However, he might concede that if a common person uses AI sincerely to transmit moral feeling to another, art occurs. His greatest fear would be deception: passing off machine calculation as human suffering undermines the trust required for infection. He would demand transparency. If the technology serves Christian brotherhood and universal access, it is permissible; if it serves profit and isolates people in simulated experiences, it is evil. He would likely urge artists to ensure the human feeling remains the master, not the servant, of the algorithm. The technology is neutral, but the moral context determines its status as art or counterfeit. In his final analysis, the soul of the user matters more than the mechanism of production. He would prioritize the ethical outcome over the aesthetic method.
