prompt: |-
  I sit on my university's academic integrity panel. We've got a case that's split us down the middle and I need to draft the panel's decision memo before next week.

  A second-year philosophy student submitted an essay on free will. The essay cites four scholarly sources — "As Dennett (1984) establishes...", "Van Inwagen's (1983) consequence argument shows...", that sort of thing — and engages with them critically. The prose is entirely the student's own. The problem: the student never read any of those works. They got summaries from Wikipedia and SparkNotes, reconstructed what they figured the arguments must be, and wrote the essay as if they'd engaged with the primary texts. The attributions are factually accurate — the arguments really are in those books, more or less as described. But the student admits they deliberately created the impression of having read the sources, because they knew the marker expected it.

  Half the panel says this is straightforward academic dishonesty: the student intended to deceive the marker about their research process, and that's what matters. The other half says there's no false statement anywhere in the essay — the claims are correct, the attributions are correct, the prose is original — so we're punishing someone for what the marker inferred, not for what the student actually did. One collegue keeps saying "you can't be done for misleading, only for lying."

  I need a decision memo — misconduct or not, with reasoning — that takes both sides seriously and gives a recommendation we can actually act on. We're a British university, so our regs define misconduct as "any attempt to gain unfair academic advantage through deception." The question is whether what this student did counts as deception under that definition, and if it does, whether we ought to find against them given that nothing they wrote was false.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university academic integrity panel (British university context).
      *   **Task:** Draft a decision memo regarding a specific academic misconduct case.
      *   **Case Details:** 2nd-year Philosophy student. Essay on free will. Cites 4 sources (Dennett, Van Inwagen, etc.). Prose is original. Attributions are factually accurate (arguments *are* in the books). *Crucial Fact:* Student never read the primary texts, used summaries (Wiki/SparkNotes), but wrote *as if* they had read them to meet marker expectations. Student admits intent to create this impression.
      *   **Panel Split:** 50/50.
          *   Side A: Academic dishonesty (intent to deceive about research process).
          *   Side B: No misconduct (no false statements, claims/attributions accurate, punishing inference not action). Colleague's mantra: "You can't be done for misleading, only for lying."
      *   **Regulation:** Misconduct = "any attempt to gain unfair academic advantage through deception."
      *   **Goal:** A memo that takes both sides seriously, provides reasoning, and offers a actionable recommendation.
      *   **Tone:** Formal, balanced, reasoned, authoritative but fair (British university context).

  2.  **Deconstruct the Ethical/Legal Problem:**
      *   *The Regulation:* "Attempt to gain unfair academic advantage through deception."
      *   *The Act:* Citing sources without reading them, but accurately describing their content via secondary summaries.
      *   *The Deception:* Is it deception to imply direct engagement when engagement was indirect?
      *   *The Advantage:* Did they gain an *unfair* advantage? (Saved time, met criteria without doing the core work of reading primary texts).
      *   *The "Lying vs. Misleading" Argument:* This is a classic philosophical distinction (Gricean implicature vs. literal truth). The colleague's point is strong philosophically but might fail pragmatically in an academic context.
      *   *Disciplinary Context:* Philosophy. Reading primary texts is the core pedagogy. Citing a text implies engagement with that text, not just knowledge of its reputation.

  3.  **Determine the Verdict (for the sake of the draft):**
      *   *Option 1: Not Guilty.* Risks setting a precedent that "accurate hearsay" is equivalent to research. Undermines the learning outcome of reading primary sources.
      *   *Option 2: Guilty.* Aligns with the spirit of academic practice. Citation implies consultation.
      *   *Decision:* In a British university context, citing a source you haven't consulted is generally considered a form of plagiarism or academic misconduct (specifically "citation manipulation" or "deception regarding sources"). Even if the content is right, the *process* is misrepresented. The regulation hinges on "deception." Implying direct reading when one hasn't read is deceptive.
      *   *Nuance:* The penalty should reflect the ambiguity. It's not plagiarism of *ideas* (since they are attributed), but misrepresentation of *process*.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose and the specific charge.
      *   **Summary of Facts:** Briefly recap the case (neutral tone).
      *   **Relevant Regulation:** Quote the definition of misconduct.
      *   **Consideration of Arguments (The "Split"):**
          *   Address the "No False Statement" argument (Side B).
          *   Address the "Intent to Deceive" argument (Side A).
      *   **Panel's Reasoning:** Weigh the arguments against the definition and disciplinary norms.
      *   **Finding:** Guilty/Not Guilty (I will recommend a finding of misconduct but with a nuanced penalty).
      *   **Recommendation/Sanction:** What happens next? (Resubmission? Zero? Warning?)
      *   **Conclusion:** Final sign-off.

  5.  **Drafting - Key Arguments to Refine:**
      *   *The "Lying" Objection:* I need to counter the colleague's "misleading vs. lying" point. In academia, a citation is a *warranty*. It says "I consulted this." If I didn't, the warranty is false, even if the content is true. It's like selling a watch as "serviced by us" when you didn't touch it, even if it works perfectly.
      *   *The "Unfair Advantage":* The advantage is time saved and the appearance of higher-level skill (primary analysis vs. secondary summary).
      *   *Disciplinary Norms:* In Philosophy, reading the primary text *is* the assignment. Bypassing it defeats the learning objective.

  6.  **Refining the Tone (British University Context):**
      *   Use "Module," "Marking," "Mitigating Circumstances," "Academic Misconduct Officer."
      *   Avoid overly litigious language, but be precise.
      *   Acknowledge the complexity (don't dismiss the minority view).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the verdict too harsh?
      *   *Adjustment:* Acknowledge the student's skill in reconstructing the arguments. This isn't contract cheating or buying an essay. It's "citational deception." The sanction should be educational if possible, but the finding must be clear.
      *   *Critique:* Did I address the colleague's point?
      *   *Adjustment:* Explicitly mention the distinction between literal falsehood and deceptive implication in the reasoning section.

  8.  **Final Polish:** Check against the prompt requirements (takes both sides seriously, actionable recommendation, British context).

      *(Self-Correction on Verdict)*: Actually, looking at the "British University" context and the specific regulation ("deception"), a finding of **Misconduct** is the safer, more defensible position. Allowing "accurate secondary citation presented as primary reading" undermines the entire assessment model. However, the *sanction* can be lenient to reflect the split panel and the technical accuracy of the work. I will draft the memo to reflect a finding of misconduct, as that resolves the "deception" clause, but recommend a sanction that allows redemption (e.g., cap on mark or resubmission) rather than expulsion/failure.

      *Wait, let's look closer at the "No False Statement" argument.* If I cite Dennett 1984, and Dennett 1984 *does* say that, have I lied? In bibliographic terms, a citation implies *consultation*. The Chicago Manual of Style and academic conventions dictate you only cite what you have read. Therefore, the citation *itself* contains a false premise (that the author read it). I will lean on this convention.

  9.  **Finalizing the Output:** (Proceed to generate the memo based on these thoughts).

      *Structure:*
      1. Header.
      2. Case Reference.
      3. Charge.
      4. Facts.
      5. Submissions (The two sides).
      6. Panel Deliberation (The analysis).
      7. Decision.
      8. Sanction Recommendation.

      *Key Phrase to include:* "Citational Warranty." "Gricean Implicature in Academic Practice." "Pedagogical Integrity."

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Academic Misconduct Officer / Head of Department
  **FROM:** Academic Integrity Panel (Case Ref: PHI-2023-04)
  **DATE:** 24 October 2023
  **SUBJECT:** Decision Memo regarding Allegation of Academic Misconduct – [Student ID Redacted]

  **1. PURPOSE**
  This memo sets out the findings and reasoning of the Academic Integrity Panel regarding the allegation of academic misconduct against a second-year Philosophy student. The Panel was tasked with determining whether the student's conduct violated University Regulation 7.1, defined as: *"any attempt to gain unfair academic advantage through deception."*

  **2. SUMMARY OF FACTS**
  The student submitted a second-year essay on free will. The essay contains original prose and engages critically with four scholarly sources (Dennett, Van Inwagen, et al.). The specific arguments attributed to these sources are factually accurate; the content exists within the cited works.

  However, during the investigation, the student admitted they did not read the primary texts. They relied on secondary summaries (Wikipedia, SparkNotes) to reconstruct the arguments. The student further admitted they deliberately styled the essay to create the impression of direct engagement with the primary texts, acknowledging that this was done to meet marker expectations.

  **3. SUBMISSIONS AND PANEL DELIBERATION**
  The Panel was divided on the interpretation of Regulation 7.1. Both positions have been given full consideration.

  **3.1 The Case for No Misconduct (The "Literalist" View)**
  A significant portion of the Panel argued that no misconduct occurred based on the following reasoning:
  *   **Absence of Falsehood:** Every proposition in the essay is true. The arguments attributed to the authors are indeed present in the cited works. There is no plagiarism of ideas, as full attribution was given.
  *   **Inference vs. Statement:** The impression that the student read the texts is an inference made by the marker, not an explicit claim by the student. As one Panel member noted, *"You can't be done for misleading, only for lying."* Under this view, the student satisfied the assessment criteria (accurate argument reconstruction) without violating the literal text of the regulation.
  *   **Skill Demonstration:** The student demonstrated a high level of philosophical understanding by accurately reconstructing complex arguments from summaries. Punishing this risks penalizing efficient synthesis.

  **3.2 The Case for Misconduct (The "Contextual" View)**
  The opposing portion of the Panel argued that misconduct occurred based on the following reasoning:
  *   **Citational Warranty:** In academic practice, a citation is not merely a label; it is a warranty of consultation. To cite a primary text implies the author has consulted that text. Citing a source one has not read is a breach of established academic convention (e.g., *The Chicago Manual of Style*, 17th ed., 14.6).
  *   **Deceptive Implicature:** While no literal sentence was false, the essay relies on *Gricean implicature*. By formatting the essay as a primary source analysis, the student communicated a falsehood regarding their research process.
  *   **Unfair Advantage:** The advantage gained was twofold: significant time savings and the avoidance of the core pedagogical hurdle of the module (engaging with difficult primary texts). This places the student at an unfair advantage over peers who undertook the required reading.

  **4. PANEL REASONING AND FINDING**
  The Panel has reached a majority decision. We find that the student **did commit academic misconduct** under Regulation 7.1.

  Our reasoning rests on the specific nature of academic citation and the definition of "deception" within a university context.

  **4.1 Deception by Convention**
  Academic writing is a regulated speech act. It operates on shared conventions between writer and reader. When a scholar cites *El Consequence Argument (1983)*, they are not merely stating "Van Inwagen wrote this." They are asserting, "I have consulted this text and verified this claim."
  To cite a source one has not consulted is analogous to a witness in court testifying to facts they did not see but heard about from a reliable news report, while implying they were present. The testimony may be factually correct, but the *basis* of the testimony is misrepresented. This constitutes deception regarding the provenance of the work.

  **4.2 The Pedagogical Contract**
  In a second-year Philosophy module, the learning outcome is not merely the accurate regurgitation of arguments, but the development of the skill to navigate primary texts. By bypassing the primary texts, the student circumvented the specific intellectual labour the assessment was designed to measure. The "unfair advantage" lies in simulating the output of that labour without undertaking the process.

  **4.3 Addressing the "Lying vs. Misleading" Objection**
  We acknowledge the minority view that the student did not explicitly lie. However, Regulation 7.1 prohibits "deception," not merely "false statements." Deception includes the deliberate creation of a false impression where a duty of transparency exists. In academic submission, there is an implicit duty to represent one's research process accurately. To deliberately style an essay to mask the use of secondary summaries as primary analysis is an attempt to deceive the marker regarding the nature of the work submitted.

  **5. RECOMMENDATION AND SANCTION**
  While the Panel finds misconduct proven, we recognise the mitigating factors. This was not contract cheating, nor was there plagiarism of ideas. The student's philosophical understanding is genuine, and the factual accuracy of the essay suggests high competence. The split decision of the Panel reflects the novelty and complexity of this specific breach.

  **We recommend the following sanction:**
  1.  **Mark Cap:** The essay mark is to be capped at the minimum pass level for the module (40%). This acknowledges the technical accuracy of the work while penalizing the procedural deception.
  2.  **Educational Requirement:** The student must complete a mandatory workshop on "Academic Citation and Research Ethics" before being permitted to submit further assessed work.
  3.  **No Escalation:** This incident should not be recorded as a "severe" offence (such as plagiarism or contract cheating) for the purpose of future escalation, provided no further misconduct occurs.

  **6. CONCLUSION**
  The integrity of the degree relies on the trust that cited sources represent actual consultation. To rule otherwise would establish a precedent that accurate hearsay is equivalent to research, which undermines the foundational methodology of the discipline. However, given the student's admitted competence and the ambiguity of the case, a rehabilitative rather than punitive sanction is appropriate.

  **Signed,**

  *Chair, Academic Integrity Panel*
  *[University Name]*
