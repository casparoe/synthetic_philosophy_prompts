prompt: |-
  I help run a co-working space with about 120 members, and we've got this whole unwritten rulebook that's built up over five years — who gets to use the phone booths for what, how long you can hog the good desk by the window, whether you need to clear your stuff at night or can leave it, how the coffee kitty works. Every few months someone gets burned by one of these rules they didn't know about, and then we have a meeting where half the room says "we need to write this down so it's clear" and the other half says "it's working fine, don't bureaucratize it, you'll just make it rigid." I'm the one who has to decide.

  I read something about David Lewis's account of convention — that a convention isn't just any old rule people follow, it's a solution to a coordination problem where everyone goes along because they expect everyone else to, and the specific rule is sort of arbitrary (everyone could have settled on a different one and it would've worked fine). That feels like it should have something to say about when you formalize a norm and when you leave it alone, but I don't know how to actually use it.

  Can you turn Lewis's account into a decision procedure I can run when someone proposes codifying one of our unwritten norms? I want a set of questions to ask in order, with clear stopping points: where the procedure says "leave it unwritten," where it says "codify it," and where it says "this isn't a convention in Lewis's sense, it's something else, and you need a different framework." The procedure should be usable by someone who's not a philosopher — I can observe what people do and talk to maybe five or six members, but I'm not running a survey. Also, flag the places where the procedure requires a judgment call that the theory itself can't settle.

  Then run the procedure on two of our actual norms: (1) the unwritten rule that you don't take calls in the main room, you go to a phone booth, and (2) the unwritten rule that the person who's been a member longest gets first dibs on the window desk when it opens up. For each one, tell me where the procedure stops and what it says.

  Oh, and be honest: if the procedure would tell me to do something I'm not gonna like — like telling me to leave something unwritten even though it's causing problems — don't soften it. I'd rather know that's what the view actually says.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Co-working space manager (120 members, 5 years old).
      *   **Problem:** Tension between codifying unwritten norms (clarity) vs. keeping them informal (flexibility/culture). People get "burned" by unknown rules.
      *   **Theoretical Framework:** David Lewis's account of *convention* (from *Convention: A Philosophical Study*).
      *   **Task 1:** Create a decision procedure based on Lewis's theory for deciding whether to codify a norm.
          *   Must be usable by a non-philosopher (observable behavior, small sample of interviews).
          *   Must have clear stopping points ("Leave Unwritten," "Codify," "Not a Convention").
          *   Must flag judgment calls where theory doesn't decide.
      *   **Task 2:** Run the procedure on two specific norms:
          1.  No calls in main room (use phone booth).
          2.  Seniority gets first dibs on window desk.
      *   **Constraint:** Be honest/blunt. Don't soften recommendations even if they are unpopular or counter-intuitive.

  2.  **Deconstruct David Lewis's Theory of Convention:**
      *   What makes something a *convention* for Lewis?
          *   **Regularity:** Everyone (or almost everyone) does $R$ in situation $S$.
          *   **Expectation:** Everyone expects everyone else to do $R$ in $S$.
          *   **Preference:** Everyone prefers to do $R$ *if* others do $R$ (coordination problem).
          *   **Arbitrariness:** There is at least one other possible regularity $R'$ that could have solved the coordination problem just as well (if everyone did $R'$, it would work too).
          *   **Common Knowledge:** Everyone knows (or believes) that the above conditions hold.
      *   *Key Insight for the User:* Lewisian conventions are self-enforcing coordination equilibria. If it's a *true* Lewisian convention, codification might be redundant or even harmful (changing the "arbitrary" solution). If it's *not* a convention (e.g., it's a moral rule, a power dynamic, or a pure efficiency rule with no alternative), Lewis's logic suggests different handling.
      *   *The "Codification" Question:* Lewis doesn't explicitly write about "when to write rules down." I need to extrapolate.
          *   If it's a *strong* convention (common knowledge, stable), writing it down adds little value and might signal distrust.
          *   If it's a *weak* convention (expectations are fraying, new members don't know), writing it down helps establish common knowledge.
          *   If it's *not* a convention (e.g., seniority rule might be a power hierarchy, not coordination), writing it down legitimizes a power structure.

  3.  **Drafting the Decision Procedure (The "Lewis Test"):**
      *   *Goal:* Translate philosophical conditions into manager actions.
      *   *Step 1: Regularity & Expectation.* (Do people actually do it? Do they expect others to?)
      *   *Step 2: Coordination vs. Conflict.* (Is this about fitting together, or about winning resources?)
      *   *Step 3: Arbitrariness.* (Could we have done it differently?)
      *   *Step 4: Common Knowledge.* (Do newbies know this?)
      *   *Step 5: The "Burn" Factor.* (Why is the user asking? Because people get burned.)
      *   *Refinement:* I need to map these to the three outcomes: "Leave Unwritten," "Codify," "Not a Convention."
      *   *Judgment Calls:* I need to explicitly highlight where the manager has to use intuition.

  4.  **Developing the Steps (Iterative Process):**
      *   *Step 1 (Regularity):* Is it actually followed? If no -> Not a convention. (Maybe needs enforcement, not codification).
      *   *Step 2 (Coordination):* Why do they follow it? To avoid crashing into each other (Convention) or because they fear punishment/prefer status (Not Convention).
      *   *Step 3 (Arbitrariness):* Could it be different? If no (e.g., safety), it's not a convention, it's a technical rule.
      *   *Step 4 (Common Knowledge):* Do new members know it? If yes -> Leave Unwritten. If no -> Codify (to *make* it common knowledge).
      *   *Wait, check the User's Problem:* The problem is people *don't* know the rules. So Common Knowledge is failing.
      *   *Revised Logic:*
          *   If it's a coordination problem + Arbitrary + Expectations hold but Knowledge is low -> Codify (to fix knowledge).
          *   If it's a coordination problem + Expectations hold + Knowledge is high -> Leave Unwritten (Codification is bureaucracy).
          *   If it's NOT a coordination problem (e.g. distribution of scarce goods based on power) -> It's not a Lewisian convention. It's a policy. Needs codification to be fair, but Lewis doesn't validate it as a "convention."

  5.  **Running the Procedure on the Examples:**

      *   **Norm 1: No calls in main room.**
          *   Regularity? Yes.
          *   Coordination? Yes (noise affects everyone).
          *   Arbitrary? Yes (could have been "whisper only" or "calls allowed 10-11").
          *   Common Knowledge? *Weak.* Newbies get burned.
          *   *Verdict:* Codify. It's a true convention failing the "Common Knowledge" test for new entrants.

      *   **Norm 2: Seniority gets window desk.**
          *   Regularity? Yes.
          *   Coordination? No. This is *distribution of scarce resources*, not coordination. It's a zero-sum game. If I take the desk, you don't get it. It's not like driving on the right side of the road (where we both win if we agree).
          *   Arbitrariness? Yes (could be lottery, first-come).
          *   *Verdict:* Not a Lewisian Convention. It's a priority rule. Lewis's theory says "This isn't what conventions are for." It requires a policy decision, not just codifying a norm. It likely needs codification to prevent conflict, but Lewis warns it's not a self-enforcing equilibrium.

  6.  **Refining the Tone:**
      *   Must be direct.
      *   Must acknowledge the "Burn" factor.
      *   Must highlight judgment calls.

  7.  **Final Review against Constraints:**
      *   Decision procedure with stopping points? Yes.
      *   Usable by non-philosopher? Yes (questions about behavior and expectations).
      *   Flag judgment calls? Yes.
      *   Run on two norms? Yes.
      *   Honest/Blunt? Yes.

  8.  **Self-Correction/Nuance Check on Lewis:**
      *   *Correction:* Lewis emphasizes *common knowledge*. If people are getting "burned," common knowledge is missing. A true Lewisian convention *requires* common knowledge to sustain the equilibrium. If new members don't know it, the equilibrium is unstable. Therefore, codification acts as a mechanism to *establish* common knowledge.
      *   *Nuance on Norm 2:* Is seniority a convention? Lewis might say it's a "precedent" solution to a conflict of interest. But strictly speaking, conventions solve *coordination* problems (everyone prefers the same outcome if others cooperate). Seniority solves a *conflict* problem (I want the desk, you want the desk). I need to make sure the procedure distinguishes Coordination vs. Conflict. This is crucial.

  9.  **Final Polish of the Procedure:**
      *   Make it a flowchart style text.
      *   Ensure the "Not a Convention" path is clear (because that changes *how* you codify).
      *   Ensure the "Leave Unwritten" path is clear (because that might be the unpopular "don't bureaucratize" advice).

  10. **Drafting the Response:** (Mental outline)
      *   Intro: Acknowledge the tension.
      *   The Procedure: 5 Steps.
      *   Judgment Call Flags.
      *   Application to Norm 1 (Phone Booths).
      *   Application to Norm 2 (Window Desk).
      *   Closing advice.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Codify" for everything. The "Leave Unwritten" outcome needs to be a real possibility if the convention is strong and known. But given the prompt says "Every few months someone gets burned," the "Common Knowledge" condition is likely failing on most things. I should reflect that.

  Let's refine the "Leave Unwritten" condition. It applies if: It's a convention, AND new members learn it quickly/orientation covers it informally, AND writing it down creates rigidity without adding clarity.
  Actually, if people are getting burned, Common Knowledge is *not* present. So the procedure should likely point to Codification *or* Better Onboarding, not necessarily "Leave Unwritten." But I must respect the prompt's request for a "Leave Unwritten" stopping point. I will set the bar high: Only leave unwritten if the "burns" are rare anomalies, not systemic.

  Okay, let's write it.
answer: |-
  Here is a decision procedure based on David Lewis's *Convention: A Philosophical Study*.

  Lewis argues that a convention is a **self-enforcing solution to a coordination problem**. It holds together not because of punishment, but because everyone follows it *because* they expect everyone else to follow it.

  If a norm fits this description, writing it down can sometimes weaken it (signaling that trust is gone). If it *doesn't* fit this description, writing it down is necessary because the norm won't enforce itself.

  ### The Lewisian Codification Procedure

  You need to talk to 5–6 members (mix of old and new) and observe behavior for a week. Then run these five steps in order.

  #### Step 1: The Regularity Test
  **Question:** In the relevant situation, does almost everyone follow the norm almost all the time, without being forced?
  *   **No:** Stop. **This is not a convention.** It is an aspiration or a rule that is being ignored. Do not codify it as a "norm." Either enforce it actively (hire someone to police it) or drop it.
  *   **Yes:** Proceed to Step 2.

  #### Step 2: The Coordination Test
  **Question:** Do people follow this rule primarily because it helps everyone avoid a mess/conflict, or because it gives some people an advantage over others?
  *   *Ask members:* "If everyone else ignored this rule tomorrow, would you still want to follow it?"
  *   **If they say "No, I'd stop too" (Coordination):** It means the value comes from *matching* behavior (like driving on the right side of the road). Proceed to Step 3.
  *   **If they say "Yes, I'd still want it" or "I'd fight to keep it" (Conflict/Distribution):** This means the rule benefits some at the expense of others (like who gets the best desk). **Stop.** **This is not a Lewisian Convention.** It is a **Policy of Distribution**. Lewis's theory does not protect this. You must codify it to make the power dynamic explicit, but understand you are creating a law, not recording a custom.

  #### Step 3: The Arbitrariness Test
  **Question:** Could the group have easily settled on a different rule that would have worked just as well?
  *   *Example:* "Phone calls in booths" vs. "No phone calls at all" vs. "Phone calls allowed only before 10 AM."
  *   **No (Technical Necessity):** If there is only one logical way to do it (e.g., "Don't unplug the server"), **Stop.** This is a technical constraint, not a convention. Codify it as a safety/ops rule.
  *   **Yes (Arbitrary):** Proceed to Step 4.

  #### Step 4: The Common Knowledge Test
  **Question:** Do new members know this rule exists within their first week, without being formally told?
  *   *Ask 3 new members:* "Did you know about this rule before you broke it or saw someone else break it?"
  *   **Yes:** The convention is healthy. Common knowledge is established via observation. **Verdict: LEAVE UNWRITTEN.** Codifying it adds bureaucracy without solving a coordination failure.
  *   **No:** The convention is failing. New members cannot infer the rule from behavior alone. Proceed to Step 5.

  #### Step 5: The Rigidity Cost
  **Question:** If we write this down, will it prevent us from adapting when the space changes?
  *   *Judgment Call:* Conventions evolve naturally. Rules require meetings to change.
  *   **High Risk of Harm:** If the norm needs to shift seasonally or based on crowd size, **Verdict: LEAVE UNWRITTEN (but improve onboarding).** The cost of rigidity outweighs the clarity.
  *   **Low Risk of Harm:** If the norm is stable (e.g., "quiet zone"), **Verdict: CODIFY.** The lack of common knowledge is causing "burns," and the rule is stable enough to write down.

  ***

  ### ⚠️ Required Judgment Calls
  *The theory cannot decide these for you. You must own them.*

  1.  **In Step 2 (Coordination vs. Conflict):** People often mask power grabs as coordination. You have to judge if the "seniority" rule is actually about respect (coordination) or privilege (conflict). Lewis assumes conventions benefit everyone equally by solving a mesh problem. If it benefits Group A and hurts Group B, it's not a convention.
  2.  **In Step 5 (Rigidity Cost):** Lewis doesn't quantify "bureaucratic cost." You have to guess whether writing this down will kill the vibe. If your culture is highly litigious, writing things down invites loopholes. If your culture is casual, writing things down invites clarity.

  ***

  ### Running the Procedure on Your Norms

  Here is the blunt application of the procedure to your two specific examples.

  #### Norm 1: "No calls in the main room, use phone booths."

  *   **Step 1 (Regularity):** **Pass.** 120 members, most go to the booth.
  *   **Step 2 (Coordination):** **Pass (It is a Convention).** If everyone else started shouting in the main room, you would stop trying to work there too. Everyone prefers the "quiet main room" equilibrium *if* others maintain it. It solves a noise coordination problem.
  *   **Step 3 (Arbitrariness):** **Pass.** You could have chosen "Whisper only in main room" or "No calls at all." The specific solution (booths) is arbitrary but functional.
  *   **Step 4 (Common Knowledge):** **Fail.** You stated people get "burned" by this every few months. New members don't know it until they are shamed. The "self-enforcing" part is broken because the expectation isn't communicated.
  *   **Step 5 (Rigidity):** **Low Risk.** This rule is unlikely to change next month.

  **Verdict: CODIFY.**
  **Why:** Lewis's theory requires *common knowledge* for a convention to hold. You don't have it. The convention is unstable because new entrants can't learn it through observation fast enough. Writing it down (or putting a sign up) isn't bureaucratizing; it's completing the conditions required for the convention to exist. If you leave it unwritten, you are allowing a coordination failure to persist.

  #### Norm 2: "Longest-standing member gets first dibs on the window desk."

  *   **Step 1 (Regularity):** **Pass.** It happens.
  *   **Step 2 (Coordination):** **FAIL.**
      *   *Analysis:* This is not a coordination problem. This is a **conflict of interest**.
      *   *Lewis Test:* If everyone else decided *not* to follow seniority and instead did a lottery, would the senior member still prefer seniority? Yes. Would the junior member? No.
      *   In a Lewisian convention (like driving on the right), *everyone* prefers the same outcome (no crashes). In this desk rule, Member A wants the desk, Member B wants the desk. They have opposing interests. Seniority is just a tie-breaker mechanism, not a mutual coordination equilibrium.
  *   **Step 3 (Arbitrariness):** **Pass.** You could use a lottery, a sign-up sheet, or first-come-first-served.
  *   **Step 4 (Common Knowledge):** **Fail.** Newbies get burned.

  **Verdict: NOT A CONVENTION (It is a Policy).**
  **Why:** Lewis's account tells you that this is **not** an unwritten rule you can rely on to self-enforce. It is a power hierarchy.
  **Action:** You must **CODIFY**, but do not call it a "community norm." Call it a "Membership Policy."
  **The Hard Truth:** Because this fails Step 2, leaving it unwritten is actually *more* dangerous than codifying it. Unwritten power structures feel like favoritism. Written power structures feel like policy. If you leave this unwritten, you are allowing a seniority hierarchy to rule by gossip and social pressure rather than transparent rules. Lewis's theory suggests this isn't a "convention" at all, so the argument "don't bureaucratize it" is invalid. It's already a bureaucracy; it's just a hidden one.

  ### Summary Recommendation

  1.  **Phone Booths:** Write it down. It's a true convention that is failing to transmit to new members. Fixing the knowledge gap saves the convention.
  2.  **Window Desk:** Write it down, but admit what it is. It's not a convention; it's a privilege allocation. Hiding it unwritten makes it feel like a clique. Writing it down makes it a clear (if perhaps unpopular) policy.

  **Final Warning:** The "don't bureaucratize" crowd will hate the Window Desk decision. But Lewis's framework shows them that their "unwritten rule" isn't a friendly handshake; it's a queue system. If you won't write it down, you should abolish it and move to first-come-first-served, which *is* closer to a Lewisian convention (everyone races, everyone accepts the winner). You can't have it both ways.
