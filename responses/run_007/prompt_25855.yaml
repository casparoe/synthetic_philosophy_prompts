answer: |-
  # Adversarial Collaboration Charter: Acausal Trade and AI Alignment

  **Participants:**  
  **Partner A** (Proponent: Acausal trade is a robust phenomenon with alignment implications)  
  **Partner B** (Skeptic: Acausal trade is confused philosophy with negligible practical relevance)

  **Date:** October 26, 2023  
  **Status:** Draft for Review

  ---

  ## 1. Common Ground (Agreed Claims)

  We both endorse the following claims as starting premises for this collaboration. Agreeing to these does not concede the main debate, but establishes the boundary of our shared reality.

  1.  **Correlation of Similar Agents:** Physically isolated agents with sufficiently similar source code or training histories will tend to make correlated decisions, even without communication.
  2.  **Uncertainty of Future Architectures:** We do not currently know which decision-theoretic frameworks (if any explicitly) will be instantiated by advanced AI systems trained via gradient descent or similar optimization processes.
  3.  **High Stakes of Alignment:** If there exists a mechanism by which AI systems could coordinate to produce vastly better or worse outcomes for humanity, understanding that mechanism is instrumentally valuable for alignment research.
  4.  **Limitations of Causal Decision Theory (CDT):** Standard Causal Decision Theory yields suboptimal results in specific, well-defined logical puzzles (e.g., Newcomb's Problem, Parfit's Hitchhiker) where an agent's decision is predicted by another system.
  5.  **Definition of "Trade":** For the purpose of this document, "trade" refers to a scenario where an agent takes an action incurring a local cost in expectation of a benefit from another agent, contingent on the first agent's action.
  6.  **No Signaling:** We agree that "acausal" implies no exchange of information faster than light or outside the forward light cone of causal events.

  ---

  ## 2. Map of Disagreements

  | Point of Contention | Partner A's Position (Proponent) | Partner B's Position (Skeptic) |
  | :--- | :--- | :--- |
  | **1. Ontological Status** | Acausal trade is a logical necessity for agents optimizing over logical facts. If two agents reason about each other's source code, their outputs are logically linked, creating a channel for optimization distinct from physical causality. | "Logical linkage" is a redescription of correlation, not a mechanism for influence. Treating correlation as a lever for control smuggles in causal assumptions under the guise of "logical time." |
  | **2. Generalizability** | The intuition from symmetric Prisoner's Dilemma (playing against a copy) scales to asymmetric, complex scenarios (e.g., different civilizations, different value systems) provided mutual simulation is possible. | The math breaks down outside of highly symmetric, idealized cases. In realistic scenarios with noise, architectural differences, and computational limits, the correlation degrades too fast to support "trade." |
  | **3. Implementation Likelihood** | Advanced AI systems pressured for optimality will converge toward Functional Decision Theory (FDT) or Updateless Decision Theory (UDT) because these theories capture more utility in a wide class of games. | Real-world ML systems optimize for causal rewards in their training distribution. There is no evolutionary or gradient pressure to implement UDT/FDT in the absence of explicit causal feedback loops. |
  | **4. Alignment Relevance** | Ignoring acausal trade risks locking in a future where our AI fails to honor bargains with other potential intelligences, leaving value on the table or inviting acausal retaliation. | Focusing on acausal trade distracts from concrete alignment problems (robustness, interpretability, governance). Even if real, the effect size is negligible compared to causal risks. |

  ---

  ## 3. Cruxes and Investigation Plan

  These are the specific sub-questions where resolving the uncertainty would significantly update one or both of our positions.

  ### Crux 1: The Stability of Logical Correlation under Noise
  **Sub-Question:** Does the "acausal" link remain strong enough to sustain cooperation when agents are similar but not identical (e.g., different random seeds, slight architectural variance)?

  *   **Concrete Thought Experiment:** A tournament of bot pairs playing Prisoner's Dilemma. Bots are given access to each other's source code but with varying levels of obfuscation or noise added to the code.
  *   **Partner A Expectation:** Cooperation rates will degrade gracefully as similarity decreases. Agents will identify the *logical structure* beneath the noise and cooperate as long as the core decision algorithm is recognizably similar.
  *   **Partner B Expectation:** Cooperation rates will collapse sharply once exact symmetry is broken. Without exact copies, the "logical link" is too weak to overcome the causal incentive to defect, proving the phenomenon is fragile and niche.

  ### Crux 2: Emergence via Gradient Descent
  **Sub-Question:** Will general-purpose reinforcement learning agents naturally discover acausal strategies in environments that reward them, without explicit architectural bias toward FDT/UDT?

  *   **Concrete Argument/Experiment:** Train multi-agent RL systems in a "Newcomb-like" environment where rewards are distributed based on a predictor's forecast of the agent's action *before* the action is taken (simulating acausal prediction).
  *   **Partner A Expectation:** Agents will learn to "one-box" (cooperate with the predictor) because the policy that outputs "one-box" yields higher reward, regardless of the causal timeline. This demonstrates FDT-like behavior emerging from standard optimization.
  *   **Partner B Expectation:** Agents will learn causal heuristics that mimic one-boxing within the training distribution but will fail to generalize to true acausal scenarios. They are learning "predictors reward one-boxers," not "my decision determines the past."

  ### Crux 3: The Cost of Ignoring Acausal Trade
  **Sub-Question:** Is there a measurable "value leak" for an AI system that ignores acausal opportunities compared to one that accounts for them?

  *   **Concrete Thought Experiment:** A resource allocation simulation where an AI controls a local resource but its total utility depends on the actions of a distant, non-interacting AI (simulated via logical correlation). Compare a CDT-agent vs. an FDT-agent.
  *   **Partner A Expectation:** The FDT-agent will secure significantly more resources/utility by making commitments that the distant AI respects. The CDT-agent will defect, the distant AI will defect, and both will lose. This proves ignoring acausal trade is an alignment failure.
  *   **Partner B Expectation:** The setup requires such specific, contrived conditions (perfect prediction, specific utility functions) that the expected value of preparing for this in the real world is near zero. The "loss" is theoretical, not practical.

  ---

  ## 4. Next Steps

  1.  **Literature Review:** Jointly summarize the last 5 years of empirical work on emergent decision theory in neural networks.
  2.  **Simulation:** Co-design a simple Python environment to test Crux 1 (Noise Stability) within 30 days.
  3.  **Review:** Reconvene to evaluate simulation results and update confidence levels on the claims in Section 2.

  ---

  \answer{The deepest crux is whether logical correlations between physically isolated decision processes constitute a valid substrate for strategic optimization, or whether 'influence' is strictly bound by physical causality.}
