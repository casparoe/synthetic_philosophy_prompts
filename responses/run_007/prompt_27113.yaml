prompt: |-
  So my housemate is a physics grad student and we got into it last night about whether the future is already real. He keeps telling me its like a loaf of bread: the whole spacetime loaf is already baked and sitting there, each slice is a moment, and "now" is just a spotlight sweeping across the slices — the feeling of time passing is the spotlight moving, not the loaf changing. He says special relativity basically forces this (he called it the Rietdijk–Putnam argument), and the spotlight is the friendly way to picture it. I can't tell how much of that conclusion is being carried by the loaf/spotlight analogy rather than the physics itself. Can you do the correspondence table — loaf, slices, spotlight, sweeping — and then go at where the picture breaks or quietly sneaks something in that the physics doesn't license, like a second time dimension for the spotlight to move in? Separate the disanalogies that actually matter for the "future is already real" conclusion from the harmless ones, say whether the conclusion survives once they're on the table, and if there's a better analogy, give it. And be explicit about how confident you are in what you claim, and which single point you're least sure of.
