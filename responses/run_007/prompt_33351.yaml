answer: |-
  An adequate solution must non-negotiably preserve classical validity for non-pathological discourse and achieve revenge immunity without retreating into ineffable metalanguages.

  **Non-Negotiable Requirements**
  1.  **Non-Triviality:** The theory must not entail every sentence (explosion). *Defense:* A logic that validates everything validates nothing; it ceases to be a tool for discrimination.
  2.  **Classical Validity Preservation:** In non-pathological contexts, standard inferences (Modus Ponens, Disjunctive Syllogism, Excluded Middle) must hold. *Defense:* Truth's primary function is to facilitate inference; sacrificing classical validity undermines mathematics and empirical science without sufficient gain.
  3.  **Revenge Immunity:** The solution must not generate a new paradox when characterizing the status of the Liar (e.g., via "is not true" or "is undefined"). *Defense:* A solution that requires a new concept to explain away the paradox merely relocates the inconsistency; adequacy requires stability.
  4.  **Semantic Closure:** The language must be able to express its own truth predicate and semantic categories without requiring an infinite hierarchy of metalanguages for ordinary use. *Defense:* Natural language is semantically closed; a theory that denies this fails descriptively.

  **Camp Preferences (Negotiable)**
  1.  **Unrestricted T-Schema:** Must be restricted to avoid inconsistency; the debate is only over *how* (syntax vs. semantics vs. context).
  2.  **Bivalence:** Truth-value gaps or gluts are permissible if they preserve classical validity in standard domains.
  3.  **Univocal Truth Predicate:** Contextual shifts are permissible if formally tractable.
  4.  **Static Stability:** Oscillating truth values are permissible if governed by stable rules.

  **Data Points & Distinctions**
  *   **Data:** Simple Liar, Strengthened Liar ("not true"), Truth-Teller, Cyclic Networks, Contingent Liars. A theory failing the Strengthened Liar fails Revenge Immunity.
  *   **Distinctions:** Must maintain Truth vs. Falsity vs. Non-truth (gap/glut); Object Language vs. Metalanguage (must be bridgeable); Semantics vs. Pragmatics (cannot explain away semantic paradoxes via pragmatics alone).

  **Jointly Unsatisfiable Subset & Knockout**
  *   **Unsatisfiable Subset:** Classical Logic + Full Transparency (intersubstitutability of $A$ and $T(\ulcorner A \urcorner)$ in all contexts) + Non-triviality. (Curry's Paradox shows this fails even without negation).
  *   **Single Knockout Requirement:** **Revenge Immunity.** This eliminates hierarchical theories (cannot express their own hierarchy), standard fixed-point theories (cannot express "undefined" in-object), and many contextualist accounts (cannot stabilize the context shift).

  **Theory Scorecard**
  *   **Hierarchical (Tarski):** Fails Semantic Closure (non-negotiable).
  *   **Fixed-Point (Kripke):** Fails Revenge Immunity (cannot express "is undefined" internally).
  *   **Paraconsistent (LP):** Fails Classical Validity Preservation (loses Disjunctive Syllogism).
  *   **Contextualist:** Fails Univocal Truth Predicate (often acceptable) but struggles with Formal Revenge Immunity.
  *   **Revision-Theoretic:** Fails Static Stability (truth values oscillate indefinitely), though handles cycles well.
