answer: |-
  The white tablecloth was pristine, a blank canvas stretched over the mahogany. Elias sat opposite Claire, the candlelight flickering in the reflection of his ocular implants. They were eating in silence, the kind that settles after ten years of marriage, comfortable but thick with unspoken things.

  Elias reached for the Cabernet. His fingers brushed the stem.

  In Claire's reality, the glass slipped. It tipped, wobbling on the edge, before crashing down. Red wine exploded across the white linen, a violent Rorschach test spreading toward Elias's cuff. Claire gasped, reaching for a napkin.

  In Elias's reality, the bottle settled back onto the table. The stem had felt slippery, yes, a momentary loss of friction, but his grip had corrected. The wine remained in the glass. The tablecloth remained white.

  "Elias," Claire said, her voice tight. She was dabbing at a stain that, for him, did not exist. "Are you okay?"

  Elias looked down. He saw the mahogany grain, the weave of the cloth, the full glass of wine. He saw Claire's hand scrubbing at nothing. A cold prickle of dissonance ran up his spine.

  "I didn't drop it," he said.

  "It shattered, Elias. Look at your sleeve."

  He looked. His cuff was dry. He looked at the floor. No glass. No red puddle. Just the hum of the refrigerator and the candle flame standing straight and still.

  "I'm calling Vane," Claire said, standing up. She walked around the table, stepping over a shard of glass that Elias could not see. She didn't trip. She stepped *around* nothing.

  ***

  Dr. Vane appeared on the wall screen ten minutes later. He was a man of soft edges, his voice calibrated to induce parasympathetic responses.

  "Telemetry shows a spike in galvanic skin response at 20:04:12," Vane said, looking at a waveform on his tablet. "Cortisol surge. Pupil dilation consistent with shock."

  "I felt nothing," Elias said. He was sitting in the study now, the dining room closed off. "I saw the bottle stabilize. I saw the cloth stay clean."

  "Your motor cortex fired a correction sequence," Vane explained. "But the visual latency buffer caught a discrepancy. The glass fell. The impact was registered by the room's sensors. But your implants... they smoothed it."

  "Smoothed it how?"

  Vane hesitated. This was the question that cost extra. "There are two protocols for error correction, Elias. You know this."

  "Tell me which one fired."

  "Protocol A is post-narrative revision. The experience occurs—the shock, the sight of the break—and then the memory is overwritten before consolidation. You would have flinched. You would have felt the adrenaline. But five seconds later, you would remember a save."

  "Orwellian," Elias said. He had read the philosophy papers. The history books rewritten after the fact.

  "Protocol B is pre-conscious synthesis," Vane continued. "The raw data comes in—the glass falling—but the rendering engine intercepts it. It calculates the trajectory, determines the outcome is negative, and constructs a 'save' scenario before it ever reaches your visual cortex. You never see the break. You never feel the shock. The first thing you are conscious of is the safety."

  "Stalinesque," Elias said. "The trial never happens. Only the verdict is delivered."

  "From your perspective," Vane said softly, "they are identical. In both cases, you sit there, dry-cuffed, believing you didn't drop the wine."

  "But the physiology," Elias insisted. "You said I had a cortisol spike."

  "Protocol A would require it. The body reacts to the raw stimulus before the mind edits the story."

  "And Protocol B?"

  "In Protocol B, the interception happens upstream. But the body is messy. Sub-cortical structures might still fire on the raw signal before the cortical edit suppresses it. A ghost reflex."

  Elias rubbed his temple. "So the blood test doesn't tell us?"

  "No."

  "Then how do I know?" Elias stood up, pacing the study. "If it was Protocol A, I *was* the man who dropped the wine. I panicked. I failed. That version of me existed for a few hundred milliseconds, and then he was executed. If it was Protocol B, that man never existed. I was always the man who caught it."

  "Does it change the outcome?" Vane asked. "The carpet is clean. Your wife is safe."

  "It changes *me*."

  Elias closed his eyes. He tried to reach back into the moment. 20:04:12. He tried to find the seam.

  If it was Orwellian, there should be a scar. A sense of déjà vu, a feeling of a thought interrupted. He tried to recall the sound of the crash. He could imagine it, but it felt like imagination, like remembering a movie scene. He tried to recall the feeling of the glass slipping. He remembered the friction. He remembered the correction.

  It felt continuous. A smooth arc of motion.

  "If I concentrate," Elias said, "I can almost feel... a hesitation."

  "Confirmation bias," Vane said. "You're looking for a glitch because I told you there might be one."

  "Is there a log?"

  "The neural log is encrypted for your protection. Accessing the raw feed can cause dissociation. You might see the break *now*, while sitting here, and your brain won't be able to reconcile it with the memory of the clean table."

  "Show me."

  "Elias, don't."

  "Show me the raw feed."

  There was a pause. The cursor on the screen blinked. "I'm sending a decryption key to your local interface. But Elias... if you view the raw data, you are creating a new memory of the event. You are overwriting the smooth version with the jagged one. You can't un-see it."

  "I need to know which world I live in."

  "Both worlds have the same furniture."

  Elias tapped his temple, accepting the packet.

  The room didn't change. But a new window opened in his peripheral vision. A timeline. He scrubbed it back to 20:04:12.

  He watched the data stream.
  *Input: Visual Cortex V1.*
  *Signal: Object trajectory downward. Velocity increasing.*
  *Input: Auditory.*
  *Signal: High-frequency shatter.*

  He watched the next line.
  *Process: Integration.*
  *Status: INTERCEPTED.*

  He watched the final line.
  *Output: Conscious Awareness.*
  *Signal: Object trajectory stabilized. Velocity zero.*

  Elias stared at the log. The interception happened *before* the output to awareness.

  "Stalinesque," Elias whispered. "It never reached me."

  "Wait," Vane said. "Look at the timestamp on the somatic response."

  Elias looked.
  *Somatic: Adrenal release.*
  *Timestamp: 20:04:11.9.*
  *Intercept Timestamp: 20:04:12.1.*

  "The body reacted two hundred milliseconds before the edit," Vane said. "The signal hit the amygdala. You felt the fear. But the visual construction was edited before it hit the theater."

  "So I felt it," Elias said. "But I didn't see it."

  "You felt a threat," Vane corrected. "But the *content* of the threat was swapped. You felt the adrenaline of a crash, but your eyes were fed a save. Your body is living in the Orwellian timeline. Your eyes are living in the Stalinesque one."

  Elias sat down heavily. "So which one is real? The body that panicked or the eyes that saw safety?"

  "The one that pays the bill," Vane said. "Your insurance premium is based on the accident report, which says the glass broke. Your experience is based on the subscription, which says it didn't."

  Elias looked at his hand. It was steady. But his heart was hammering, a rhythmic thudding that felt out of sync with the calm of the room. He was a hybrid thing. A creature of edited light and raw chemistry.

  "Can you reverse it?" Elias asked. "Can you restore the memory of the crash?"

  "We can't restore what was never rendered," Vane said. "If we pull the raw feed into your consciousness now, it won't be a memory. It will be a hallucination. You'll see a ghost glass breaking on a clean table."

  "And if it was the other way? If I saw it, and you erased it?"

  "Then you'd have a gap. A hole in the narrative. You'd feel the loss."

  Elias looked at the clean tablecloth through the open door. He tried to summon the ghost of the stain. He tried to feel the shame of the clumsiness. He could simulate it, but it lacked weight. It was a story he was telling himself, not a scar he was bearing.

  "I don't know who I am," Elias said. "If the edit happened before I knew, then I am innocent. If it happened after, I am a liar who forgot his lie."

  "Does the timing of the light matter more than the light itself?" Vane asked. "You are safe. The wine is spilled on the floor, not your pants. The distinction is academic."

  "It's not academic," Elias said. "It's the difference between a mistake and a miracle."

  He ended the call. The screen went dark.

  Claire walked in. She held a dustpan. In it lay the shards of the glass. To Elias, they looked like props. Evidence of a crime he didn't commit.

  "Vane say anything?" she asked.

  "He said my body reacted before my mind saw."

  Claire swept a tiny fragment of crystal into the pan. "And?"

  "And I don't know if I flinched."

  Claire stopped sweeping. She looked at him, really looked at him, searching his face for the tremor he claimed he couldn't feel. "Elias, I saw you. You didn't flinch. You moved like a machine. Perfectly smooth."

  "Too smooth?"

  "Too smooth." She dumped the shards into the trash. "It scared me more than the spill."

  She came to him, put her hand on his chest, over the hammering heart. "You're shaking."

  "I'm not," he said. But he felt the vibration under her palm.

  "You are," she said. "Your body knows what happened. Even if your eyes don't."

  She kissed his cheek. "Clean the table, Elias."

  He stood up and walked to the dining room. He took a sponge and wiped the mahogany where the wine had never touched. He wiped the white cloth where the stain had never bloomed. He wiped away nothing, over and over, trying to find the friction of the real world, trying to find the moment where the red turned to green, where the break became a save.

  But the cloth stayed white, and his hand moved in a perfect, unbroken arc, and he could not tell if he was remembering the motion or performing it for the first time.
