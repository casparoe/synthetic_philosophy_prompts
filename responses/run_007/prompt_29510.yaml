answer: |-
  # The Goodhart Screen: A Procedure for Incentive Proposals

  **Purpose:** To prevent reward schemes from encouraging gaming (meeting the letter of the rule while violating the spirit) and to ensure resources are not wasted on ineffective measures.
  **Time Required:** 45–60 minutes per proposal.
  **Users:** School Council Sub-committee (no specialist training required).

  ## Part 1: The Screening Procedure

  This procedure is a decision flow. You must proceed in order. If a step triggers a **Red Flag**, you must pause. You cannot proceed to a 'Recommend' decision until the Red Flag is resolved (either by revising the proposal or accepting the risk).

  ### Step 1: The Goal Definition (10 minutes)
  **Question:** What is the *actual* behaviour or outcome we want?
  **Action:** Write it down in one sentence.
  **Test:** Is the goal about *compliance* (doing a thing) or *internalisation* (valuing a thing)?
  *   *Example:* 'Pupils read books' (compliance) vs 'Pupils enjoy reading' (internalisation).
  **Red Flag:** If the goal is vague (e.g., 'improve culture') or purely compliance-based without a link to learning/wellbeing.
  **Judgement Call:** The committee must agree on the goal. If the proposer and the committee disagree on the goal, stop and refer back to the proposer.

  ### Step 2: The Metric Alignment (10 minutes)
  **Question:** Does the proposed metric measure the goal, or just an approximation of it?
  **Action:** Draw a line between the Metric and the Goal.
  **Test:** Can you have the Metric without the Goal?
  *   *If Yes:* This is a **Goodhart Risk**.
  *   *If No:* Proceed.
  **Hard Case (Partial Tracking):** If the metric only partially tracks the goal (e.g., attendance tracks engagement but not learning), acknowledge this explicitly. Ask: 'Is 50% of the goal better than 0%?'
  **Judgement Call:** Deciding if a partial metric is 'good enough' is a value judgement, not a fact.

  ### Step 3: The 'Clever Pupil' Test (15 minutes)
  **Question:** If you were a pupil who wanted the reward but did *not* want to do the actual work, how would you get the points?
  **Action:** Brainstorm three ways to game the system. Be ruthless. Assume pupils are intelligent and motivated by the prize.
  **Common Gaming Vectors:**
  *   *Quantity over Quality:* Doing more of the easy stuff, none of the hard stuff.
  *   *Timing:* Doing the behaviour only when measured, stopping immediately after.
  *   *Delegation:* Getting parents or friends to do the work.
  *   *Sabotage:* Making other forms/classes look worse to improve relative standing.
  **Red Flag:** If a gaming method is easy, undetectable, and yields high reward.
  **Decision:** If a Red Flag is raised, can a control be added without creating more bureaucracy than the scheme is worth? If not, **Reject**.

  ### Step 4: The Equity and Ethics Gate (10 minutes)
  **Question:** Who is disadvantaged by this scheme?
  **Action:** Identify groups who cannot compete on a level playing field.
  **Test:** Does success depend on factors outside the pupil's control (e.g., parental wealth, home environment, neurodivergence)?
  **Red Flag:** If the reward effectively punishes poverty, disability, or unstable home lives.
  **Judgement Call:** This is purely values-based. The committee must decide if the exclusion is acceptable collateral damage. There is no statistical fix for this.

  ### Step 5: The 'Do Nothing' Comparison (10 minutes)
  **Question:** Is this scheme better than the status quo?
  **Action:** Compare the risk of gaming against the cost of having no scheme.
  **Test:** If we reject this, does the problem persist? If we accept this and it gets gamed, does the problem get worse?
  **Decision:**
  *   **Recommend:** Risks are low or manageable; equity is protected.
  *   **Revise:** Send back to proposer with specific changes (e.g., change metric, add audit).
  *   **Reject:** Risks outweigh benefits; gaming is inevitable; equity is compromised.

  ---

  ## Part 2: Worked Examples

  Below are three typical proposals applied to the Screen.

  ### Proposal (a): House points for every 20 minutes of independent reading logged in an app.
  *Proposer: Head of English*

  1.  **Goal:** To foster a love of reading and improve literacy.
  2.  **Metric Alignment:** Metric is 'minutes logged'. Goal is 'love of reading/literacy'.
      *   *Test:* Can you log minutes without reading? **Yes.**
      *   *Risk:* High. This is a classic input metric.
  3.  **Clever Pupil Test:**
      *   *Gaming 1:* Open the book/app, walk away to play video games, return in 20 mins.
      *   *Gaming 2:* Read very simple picture books repeatedly to rack up time quickly rather than challenging texts.
      *   *Gaming 3:* Parents log the time for the child to secure house points.
      *   *Control:* Teachers would need to quiz every entry. This creates unmanageable workload.
  4.  **Equity:** Pupils with no quiet space at home or limited access to books are disadvantaged.
  5.  **Do Nothing:** Current system relies on classroom reading time. It is slower but more honest.

  **Conclusion: REJECT.**
  **Reasoning:** This is an unwelcome conclusion for the English Department, but the Screen identifies it as a high-risk Goodhart trap. The metric (time) is too easily decoupled from the goal (literacy). The controls required to stop gaming (verifying every 20-minute block) cost more in staff time than the scheme is worth.
  **Recommendation:** Return to proposer. Suggest rewarding *completion* of books with a short review, or random spot-checks, rather than raw time.

  ### Proposal (b): Weekly prize for the form class that reports the least litter in and around its form room.
  *Proposer: Site Manager*

  1.  **Goal:** Cleanliness and personal responsibility.
  2.  **Metric Alignment:** Metric is 'reported litter'. Goal is 'cleanliness'.
      *   *Test:* Can you have low reported litter but a dirty room? **Yes.**
      *   *Risk:* Moderate.
  3.  **Clever Pupil Test:**
      *   *Gaming 1:* Sweep litter under the radiators or into cupboards before inspection.
      *   *Gaming 2:* Do not report litter found in communal areas that might be attributed to the form.
      *   *Gaming 3:* Accuse other forms of dropping litter in your zone.
      *   *Control:* Site staff to do random spot-checks behind furniture. Feasible.
  4.  **Equity:** Generally fair, though forms with high foot traffic (near canteen) may be disadvantaged.
  5.  **Do Nothing:** Litter currently persists. A nudge is useful.

  **Conclusion: RECOMMEND WITH REVISION.**
  **Reasoning:** The gaming risk is manageable. The 'spirit' (taking pride in the space) is close enough to the 'letter' (clean floor).
  **Condition:** The Site Manager must agree to random 'deep checks' once a fortnight to prevent sweeping-under-carpet gaming. If a form is caught hiding litter, they are disqualified for the term.

  ### Proposal (c): Certificates and a trip for the pupils in the form that raises the most money during the annual charity drive.
  *Proposer: Parent Representative*

  1.  **Goal:** Generosity and community support.
  2.  **Metric Alignment:** Metric is 'total money raised'. Goal is 'generosity'.
      *   *Test:* Can you raise money without being generous? **Yes.**
      *   *Risk:* High (Equity risk).
  3.  **Clever Pupil Test:**
      *   *Gaming 1:* Wealthy pupils ask parents to donate £500 directly, bypassing pupil effort.
      *   *Gaming 2:* Pupils pressure peers to donate money they cannot afford.
      *   *Gaming 3:* Pupils in poorer forms disengage because they know they cannot win.
  4.  **Equity:** **RED FLAG.** This scheme rewards parental wealth, not pupil effort or character. It publicly highlights economic disparity between forms.
  5.  **Do Nothing:** Charity drives happen anyway. Removing the competitive 'trip' element might lower total funds slightly, but protects pupil wellbeing.

  **Conclusion: REVISE.**
  **Reasoning:** While the fundraising goal is good, the incentive structure is ethically flawed. It violates Step 4 (Equity).
  **Recommendation:** Change the metric to 'percentage of form participating' or 'average donation per pupil' (capped). The reward should be for *participation rates*, not *total yield*. This rewards the form's culture, not their bank balances.

  ---

  ## Part 3: Hard Cases and Limitations

  ### Handling Hard Cases
  The Screen forces you to make difficult choices. Here is how to handle the specific ambiguities you mentioned:

  1.  **The Partial Metric:** Sometimes a metric is imperfect but the only one available (e.g., attendance as a proxy for engagement).
      *   *Procedure:* In Step 2, explicitly record the 'Gap'. In Step 5, ask: 'Does knowing the Gap exists change our behaviour?' If the committee agrees that the metric is 'directionally correct' even if imprecise, you may Proceed, but you must add a monitoring clause to review the metric after one term.
  2.  **Gaming vs. Improvement:** Sometimes it is hard to tell if a pupil is gaming or improving (e.g., a pupil suddenly reads more).
      *   *Procedure:* In Step 3, assume the worst. If the *mechanism* allows gaming, it does not matter if the *current* pupils are honest. Design for the worst actor, not the best. If the mechanism allows cheating, reject it, even if you trust the current cohort.
  3.  **No Alternative:** Sometimes doing nothing is worse than a flawed scheme.
      *   *Procedure:* In Step 5, if the 'Do Nothing' scenario leads to significant harm (e.g., safety issue), you may Recommend a flawed scheme but must attach a 'Sunset Clause'. The scheme expires automatically after one term unless data shows the gaming was minimal.

  ### What This Procedure Cannot Catch
  You must be honest with the Headteacher that this paper exercise has blind spots. The Goodhart Screen **cannot** detect:

  1.  **Implementation Failure:** A perfect scheme on paper can fail if staff forget to award points, or if the app crashes. We are screening the *design*, not the *delivery*.
  2.  **Reward Saturation:** We cannot predict if pupils will stop caring about house points after three weeks. This requires post-implementation review.
  3.  **Staff Gaming:** This procedure focuses on pupils. Staff may also game the system (e.g., teachers inflating reading logs to make their department look good). This requires a separate staff-level check.
  4.  **Long-term Cultural Damage:** A scheme might work for a term but create a transactional culture ('I will only read if paid') that damages intrinsic motivation years later. The Screen assesses immediate risks, not deep pedagogical shifts.

  **Final Note to the Committee:**
  This procedure is not a way to avoid responsibility. Where the Screen marks a 'Judgement Call', the committee owns that decision. If you approve a scheme that fails, do not blame the metric; blame the decision to ignore the Red Flag.
