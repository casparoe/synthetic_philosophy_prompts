answer: |-
  This is a persistent and frustrating pedagogical cycle because the lottery analogy is *psychologically* compelling even when it is *logically* question-begging. It feels like an argument, but it is actually a description of a specific case where the hard work has already been done.

  Here is the audit you requested, broken down into the correspondence table, the Bertrand autopsy, the verdict on the "unique credence" claim, and a proposal for a more honest analogy.

  ### 1. The Correspondence Table: Die vs. Epistemic State

  To see where the analogy breaks, we must first formalize where it claims to hold. The move your students are making assumes an isomorphism between a physical chance setup and a state of knowledge.

  | Feature | The Fair Die (Ontic/Physical) | The Epistemic Case (PoI Application) |
  | :--- | :--- | :--- |
  | **The Outcomes** | 6 physical faces (distinct, mutually exclusive, exhaustive). | $n$ hypotheses/propositions (distinct, mutually exclusive, exhaustive). |
  | **The Partition** | **Given by geometry.** The cube *is* divided into 6 sides. | **Chosen by the agent.** How do we individuate the possibilities? |
  | **Symmetry** | **Physical invariance.** Rotating the die doesn't change the physics of the faces. | **Evidential symmetry.** "No reason to favor" is a mental state, not a physical property. |
  | **The Process** | Causal mechanism (throwing, bouncing, settling). | Truth-making mechanism (how the world settles the hypothesis). |
  | **"Fairness"** | A property of the object/process (center of mass, friction). | A property of the *agent's rationality* (impartiality). |
  | **The Measure** | **Natural measure exists.** Physics dictates the frequency tends to $1/6$. | **Natural measure absent.** No physical law dictates the "density" of truths. |
  | **Ignorance** | Ignorance of the *result* of the throw. | Ignorance of the *structure* of the possibility space. |

  **The Critical Mismatch:** Look at the row for **The Partition** and **The Measure**. In the die case, the partition (the faces) and the measure (the probability mass) are fixed by the physical constitution of the cube *before* you apply the principle of indifference. In the epistemic case, the PoI is being asked to *generate* the measure from the ignorance itself, without a pre-existing physical partition.

  ### 2. Bertrand's Paradox: The Autopsy

  When you bring up Bertrand's Paradox (the chord in the circle), the room goes quiet because the math contradicts the intuition. But to stop them from reverting to the die analogy, you need to show them *why* the die avoids Bertrand's problem.

  **The Setup:**
  Draw a circle. Inscribe an equilateral triangle. What is the probability that a "randomly chosen" chord is longer than the side of the triangle?
  *   **Method 1 (Random Endpoints):** Fix one point, choose the other randomly on the circumference. Probability = $1/3$.
  *   **Method 2 (Random Radius):** Choose a radius, choose a point on the radius for the chord's midpoint. Probability = $1/2$.
  *   **Method 3 (Random Midpoint):** Choose a point anywhere inside the circle as the midpoint. Probability = $1/4$.

  **Where the Die Analogy Fails:**
  In the die case, there is no ambiguity about "how to choose" the face.
  1.  **Discrete vs. Continuous:** The die has a finite, discrete set of outcomes. Bertrand's problem involves a continuous space. In continuous spaces, probabilities are densities, and densities change under transformation.
  2.  **The "Natural" Partition:** A die has a **privileged partition**. You cannot describe a die as having "3 outcomes" (Top/Bottom, Left/Right, Front/Back) in the same causal sense as "6 outcomes." The causal mechanism of the throw interacts with the 6 faces specifically.
  3.  **Invariance:** The die's probability distribution is invariant under rotation of the *table*. In Bertrand's paradox, the distribution is *not* invariant under the transformation of the *parameterization* (endpoints vs. midpoints).

  **The Smuggled Feature:**
  The die analogy works only because the die possesses **metric invariance**. The physical symmetry of the cube *forces* the partition. When students apply this to epistemology, they are silently assuming that the hypotheses they have listed (e.g., "The ball is red," "The ball is blue," "The ball is green") constitute a "cubic" partition of logical space.

  Bertrand shows that for almost any epistemic question, there is no "cube." There is only a circle, and you have to decide whether to measure the chords by angle, by distance, or by area. The die analogy smuggles in the assumption that **the way you have framed the question is the unique, physically correct way to frame the question.**

  ### 3. Verdict: Does the Conclusion Survive?

  **No.** The conclusion that "ignorance by itself picks out a unique distribution" does not survive the disanalogies.

  Once the disanalogies are on the table, it becomes clear that the Principle of Indifference is not a principle of *ignorance*, but a principle of *symmetry*.
  *   **Ignorance** is the absence of information.
  *   **Symmetry** is the presence of structural information (i.e., knowing that parameter $x$ is equivalent to parameter $y$).

  The die works because we have positive knowledge of its symmetry, not merely ignorance of the outcome. If we were truly ignorant about the die (e.g., we don't know if it's loaded, or if it's a d20 hidden in a sock), we could not assign $1/6$.

  Therefore, the lottery analogy was indeed smuggling in a **natural partition**. It assumes the "atoms" of possibility are already individuated. In formal epistemology, individuating the atoms is often the primary source of bias. If I am ignorant about the volume of wine in a barrel, am I indifferent between 1L and 2L? Or should I be indifferent between the surface area of the liquid? Or the height of the liquid? Ignorance about volume implies a specific distribution over height, which is *not* uniform.

  **The Lesson:** Ignorance is not a generator of probability; it is a constraint. It tells you what you *cannot* know, but it does not tell you how to measure what you *do* know.

  ### 4. A Better Analogy (Or, How to Fix the Pedagogy)

  Since the die is a "best-case scenario" that misleads students into thinking all cases are best-case, you need an analogy that highlights the **dependence on parameterization**.

  **Option A: The Currency Exchange (The "Van Fraassen" Move)**
  Instead of a die, use money.
  *   **Scenario:** You are ignorant about the exchange rate between Dollars and Pounds.
  *   **PoI Claim:** You should be indifferent between the rate being 1.0, 1.5, or 2.0.
  *   **The Catch:** If you are indifferent about Dollars per Pound, you are *mathematically required* to be biased about Pounds per Dollar. (If $X$ is uniform, $1/X$ is not).
  *   **Pedagogical Point:** "Ignorance" cannot be uniform across all descriptions of the same fact. Which description is the "face of the die"? There is no fact of the matter. This kills the idea that ignorance yields a *unique* credence.

  **Option B: The Blind Archer (Refining Bertrand)**
  Keep Bertrand, but change the analogy from the *Die* to the *Archer*.
  *   **Scenario:** A blindfolded archer shoots at a circular target.
  *   **Question:** What is the probability the arrow lands in the inner bullseye (radius $r/2$)?
  *   **The Trap:** If you think in terms of *radius* (distance from center), you might say $1/2$ (it's either in the first half or the second half of the radius).
  *   **The Reality:** If you think in terms of *area*, it's $1/4$ (area scales with $r^2$).
  *   **The Lesson:** The "Die" analogy assumes the target is divided into equal *areas* (faces). But why should epistemic possibilities be divided by area rather than radius? The die analogy hides the choice of metric. The Archer analogy forces them to choose the metric.

  **Recommendation for Next Week:**
  Start the lecture by conceding that the Die is the **only** case where the PoI works effortlessly.
  1.  Tell them: "The die is not the model for epistemology; it is the exception that proves the rule."
  2.  Show the **Currency Exchange** paradox. It is algebraically simpler than Bertrand's geometry but demonstrates the same failure of invariance.
  3.  Conclude that rational credence requires **Invariance Principles** (à la Jaynes), not just Indifference. We need to know *what transformation leaves the problem unchanged*, not just that we are ignorant.

  If they lean on the lottery analogy again, ask them: *"Is your state of ignorance invariant if I rephrase the hypotheses in logarithmic terms?"* If they hesitate, the die has lost its grip.
