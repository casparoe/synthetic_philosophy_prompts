  Actually, the **"Volume vs. Surface Area"** (Cube Factory) is the standard counter to PoI. I should recommend that as the *corrective* analogy.
  But for a *replacement* for the die? Maybe there isn't one because the die is uniquely suited to PoI. The point is to show the die is a *special case*. I will argue that the best analogy is to admit the die is a *physical chance device*, not a pure epistemic state.

  Let's structure the response to lead the user through the audit as requested.

