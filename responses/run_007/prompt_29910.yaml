prompt: |-
  I spent my career in population genetics and only started reading philosophy of science after I retired, so go easy on the jargon — I know the biology, not the epistemology. I write a monthly newsletter where I fact-check how the science press, and sometimes journals, report heritability, and my readers are mostly high-school biology teachers and science journalists, so what I write gets repeated. I keep hitting the same wall: a study reports a heritability of 0.6 for some trait, or a headline says a trait is "60% genetic," and within a week someone has concluded that the trait is fixed, that an individual's case is 60% caused by genes, or that a group difference must be partly genetic because the trait is heritable within each group. I know these moves are wrong, but I don't have a crisp procedure I can run, and I end up re-arguing from scratch every month, and I suspect I'm too charitable to the quantitative genetics and not charitable enough to the environment.

  Please write me a reusable decision procedure — a checklist or flowchart in words — that I can actually run in a afternoon on any heritability claim that lands in my inbox, grounded in what the quantitative genetics actually says rather than how the word gets used. It should tell me, in order: what a claim has to specify before its even well-formed (population, range of environments, broad versus narrow sense, and whatever else matters); what a number does and does not license; which common inferences to flag as outright category errors; which questions about study design and gene-environment interplay to ask before I trust the estimate; where the procedure stops with a clear verdict; and where it has to stop and say the claim is underdetermined, or that the next step is a values call rather than a fact call. Assume I can do arithmetic and read a methods section, but don't make me re-derive the variance decomposition each time. Flag the steps that are judgment calls dressed up as procedure.

  Then run the procedure on these three, and show the worksheet:
  1. A widely shared article says schizophrenia is about 80% heritable and therefore "mostly genetic," so prevention should focus on genes rather than environments.
  2. A blogger argues that because the heritability of finger number in humans is near zero, genes hardly matter for how many fingers a person has.
  3. A policy report argues that because height is about 80% heritable within both a well-nourished and a chronically undernourished population, the height difference between the two populations must be mostly genetic.

  I expect the procedure to return at least one verdict I don't like — that's fine, I want to see where my instincts as a geneticist are doing the work rather than the procedure. Also tell me, briefly, what the procedure cannot do: the cases it will systematically miss or get wrong, and what I'd have to add to handle them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Background:** Retired population geneticist. Knows the biology/math deeply. New to philosophy of science/epistemology.
      *   **Task:** Write a monthly newsletter fact-checking heritability claims in science press/journals.
      *   **Audience:** High-school biology teachers, science journalists (ideas get repeated).
      *   **Problem:** Constantly fighting the same misconceptions (fixed traits, individual causation, group difference fallacies). Needs a *reusable decision procedure* (checklist/flowchart in words) to streamline this.
      *   **Requirements:**
          *   Grounded in quantitative genetics (QG), not just colloquial usage.
          *   Step-by-step order (well-formedness, licensing, category errors, study design, verdicts).
          *   Distinguish fact calls from value calls/judgment calls.
          *   Apply the procedure to three specific cases (Schizophrenia, Finger Number, Height/Group Difference).
          *   Show the worksheet for the three cases.
          *   Include a "limitations" section (what the procedure misses).
          *   Tone: Professional, respectful of expertise, crisp, avoiding unnecessary epistemological jargon.
          *   Constraint: "Go easy on the jargon" (regarding philosophy), but assume QG competence.

  2.  **Deconstruct the "Heritability Problem":**
      *   What are the core errors?
          *   $h^2$ is population-specific, not universal.
          *   $h^2$ is variance *within* a population, not determination *of* an individual.
          *   High within-group $h^2$ does not imply between-group differences are genetic (Lewontin's fallacy).
          *   $h^2$ depends on environmental variance ($V_E$). If $V_E$ is low, $h^2$ is high, even if genes aren't "doing" more work.
          *   $h^2$ (narrow) $\neq$ $H^2$ (broad).
          *   GxE interactions can mask or inflate estimates depending on design.
      *   What does the user need? A filter. A way to say "Stop, this claim is ill-formed" or "Stop, this inference is invalid" before getting into the weeds of the specific study.

  3.  **Drafting the Decision Procedure (The "Heritability Audit Protocol"):**
      *   *Goal:* Make it actionable.
      *   *Structure:*
          1.  **Well-Formedness Check:** Does the claim even define the parameters? (Population, Environment, $h^2$ vs $H^2$).
          2.  **Inference License Check:** What does the number actually allow you to say? (Variance vs. Means, Population vs. Individual).
          3.  **Design & Context Check:** How was it measured? (Twins? GWAS? Range of E?).
          4.  **The Verdict:** Valid, Invalid, or Underdetermined/Value-laden.
      *   *Philosophical nuance:* Need to highlight where "judgment calls" happen (e.g., defining "relevant environments").
      *   *Tone:* Direct, like a lab protocol.

  4.  **Developing the Three Case Studies:**
      *   *Case 1 (Schizophrenia):* High $h^2$ (0.8). Claim: "Mostly genetic" $\rightarrow$ focus prevention on genes.
          *   *Analysis:* $h^2$ is high in current environments. But "prevention" implies changing outcomes. If $V_E$ is restricted, $h^2$ is high. Changing $E$ (e.g., urban stress, viruses) could lower incidence even if $h^2$ is high. The inference from $h^2$ to *malleability* is the error.
      *   *Case 2 (Finger Number):* $h^2 \approx 0$. Claim: Genes hardly matter.
          *   *Analysis:* Classic canalization. Genes specify 5 fingers robustly. Variation comes from accidents (environment). Low $h^2$ means genes don't explain *variation*, not that they don't cause the *trait*. This is the "intervention vs. variation" distinction.
      *   *Case 3 (Height/Group Difference):* High $h^2$ in both groups. Claim: Between-group difference is genetic.
          *   *Analysis:* Classic Lewontin. Within-group variance $\neq$ between-group mean difference. If $E$ differs systematically (nutrition), mean difference can be 100% environmental despite high within-group $h^2$.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is it too technical?
      *   *Fix:* Keep the QG terms ($V_G, V_E$) but explain their implication simply. The user knows them, but the *newsletter readers* need the logic translated. The procedure is for the *user* to apply, but the output is for the readers.
      *   *Critique:* Did I highlight the "judgment calls"?
      *   *Fix:* Explicitly label steps where the user has to decide what counts as a "relevant environment."
      *   *Critique:* The user asked for a verdict they might not like.
      *   *Strategy:* In Case 1 (Schizophrenia), the procedure might force the admission that we *don't know* the specific environmental levers, even if the logic says "environment could matter." This challenges the geneticist's instinct to defend the $h^2$ estimate itself rather than the policy implication. Or, perhaps more likely, the procedure will highlight that "80% heritable" is often an upper-bound estimate from twins that assumes equal environments, which a geneticist might be too charitable about. Let's make sure the procedure flags the "Equal Environment Assumption" (EEA) rigorously.

  6.  **Drafting the Limitations Section:**
      *   What does this miss?
      *   Molecular mechanisms (QG is agnostic).
      *   Normative claims (what *should* we do?).
      *   Dynamic systems (developmental noise).
      *   The "Missing Heritability" problem (GWAS vs. Twin).

  7.  **Final Review against Constraints:**
      *   No epistemology jargon? (Avoid "ontological," "teleological," use "causal," "purpose").
      *   Reusable? Yes, structured as a checklist.
      *   Worksheet included? Yes.
      *   Limitations included? Yes.

  8.  **Final Polish:** Ensure the voice sounds like a colleague speaking to a retired expert. Respectful, efficient, precise. (Self-correction: Make sure to explicitly distinguish $h^2$ [narrow] and $H^2$ [broad] as requested in the "well-formed" section).

  *(Self-Correction on Case 1 Verdict)*: The user expects a verdict they might not like. As a population geneticist, they might be inclined to say "The heritability estimate is robust." The procedure should force them to acknowledge that *even if* the estimate is robust, the policy conclusion is invalid. That's the friction point. The "dislike" might be admitting that the $h^2$ number itself is often treated as more stable than it is across environments. I will ensure the procedure flags the "Range of Environments" as a critical failure point in most press reports.

  *(Self-Correction on Case 2)*: This is the "canalization" case. The verdict must be "Invalid Inference." The user knows this, but the procedure needs to codify *why* (Variance vs. Development).

  *(Self-Correction on Case 3)*: This is the Lewontin case. Verdict: "Category Error."

