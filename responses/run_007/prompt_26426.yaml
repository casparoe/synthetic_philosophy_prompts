answer: |-
  You have identified one of the oldest and most persistent structural problems in political philosophy. While there is no single, universally standardized noun for this specific *dialectical oscillation*, it is most famously anchored in **Pascal's Antinomy of Justice and Force**, and its most rigorous structural analysis is found in **Jacques Derrida's deconstruction of that antinomy** (specifically in his essay *"Force of Law"*).

  Here is a breakdown of the lineage of this idea, the philosophers who have analyzed it most carefully, and how to distinguish it from related concepts.

  ### 1. The Historical Anchor: Pascal's Maxim
  The specific rhetorical move you described is almost a direct paraphrase of **Blaise Pascal**, written in the *Pensées* (Fragment 103/298, c. 1669):

  > *"Justice without force is powerless; force without justice is tyrannical."*
  > (*"La justice sans la force est impuissante ; la force sans la justice est tyrannique."*)

  Pascal's point was cynical and sociological: because we cannot make what is just become strong, we have made what is strong become just. He recognized exactly the dynamic you noted: justice needs force to be effective, but force needs the label of justice to be accepted.

  However, Pascal treats this as a tragic fact of the human condition to be managed. You are describing the *dialectical engine* that keeps the argument going. For that, we must look to the 20th century.

  ### 2. The Structural Analysis: Derrida and Benjamin
  The philosopher who analyzed this specific **mutual dependence and mutual destabilization** most carefully is **Jacques Derrida**, particularly in his 1989 lecture *"Force of Law: The 'Mystical Foundation of Authority'"*.

  Derrida takes Pascal's quote as his starting point. He argues that this is not just a balance to be struck, but an **aporia** (a logical impasse or paradox).
  *   **The Dependence:** Law (*droit*) is essentially the unity of justice and force. A law that is not enforced is not a law; a force that is not authorized is mere violence.
  *   **The Destabilization:** Derrida argues that the *origin* of any legal order is always an act of force (a revolution, a coup, a founding violence) that is neither legal nor illegal at the moment it happens. Therefore, the "justice" of the system rests on a foundational act of "force" that cannot be fully justified by the system itself.

  This matches your observation: the moment Side B exercises power, Side A can point to the lack of prior justification (the foundational violence). The moment Side A appeals to justice, Side B can point to the lack of enforcement (the inefficacy).

  **Walter Benjamin** is the other key figure here. In his *"Critique of Violence"* (1921), he distinguishes between **law-making violence** (which establishes justice) and **law-preserving violence** (which enforces it). He shows that the state relies on violence to maintain justice, but must conceal that violence to maintain legitimacy. This concealment is what fuels the oscillation you see in debates.

  ### 3. The Sociological Frame: Max Weber
  In sociological terms, this is the tension between **Macht** (Power) and **Herrschaft** (Authority/Domination).
  *   **Power:** The ability to impose one's will despite resistance (Side B's initial move).
  *   **Authority:** Power that is accepted as legitimate by those subjected to it (Side A's counter-move).

  Weber defines the state by its "monopoly on the legitimate use of physical force." Note the conjunction: **legitimate use**. The entire political project is an attempt to fuse these two. Your observation highlights that in public discourse, this fusion is constantly unraveling.

  ### 4. Proposed Terminology
  Since there isn't one single word, here are the three most accurate ways to name this pattern, depending on which discipline you are invoking:

  **A. The Pascal-Derrida Aporia**
  If you want to emphasize the philosophical impossibility of fully separating or fully uniting the two. This highlights that justice is "undeconstructible" but law is "deconstructible" because it is always contaminated by force.

  **B. The Paradox of Legal Violence**
  This is common in Critical Legal Studies. It refers to the fact that the law must use violence (force) to achieve justice, but that violence always threatens to undermine the justice it claims to serve.

  **C. The Legitimacy-Efficacy Dilemma**
  In political science, this is often framed as the tension between *input legitimacy* (justice, right, consent) and *output legitimacy* (effectiveness, power, results). Your description is the rhetorical manifestation of this dilemma.

  ### 5. Distinguishing from Related Concepts
  You asked how to distinguish this from nearby ideas. Here is the differentiation:

  *   **Vs. Normative vs. Descriptive Legitimacy:**
      *   *That concept:* A static distinction. Normative = "Should they rule?" Descriptive = "Do people believe they should rule?"
      *   *Your pattern:* A dynamic **process**. It is the *weaponization* of the gap between the two. Side A uses Normative to attack Descriptive; Side B uses Descriptive to attack Normative.
  *   **Vs. The Circularity of the Rule of Law:**
      *   *That concept:* "The law is valid because the law says it is valid." (Kelsen's Grundnorm).
      *   *Your pattern:* This is not about legal validity; it is about **moral authority vs. physical capacity**. It is extra-legal. It is the argument that happens *about* the law, not *within* it.
  *   **Vs. Realism vs. Idealism (International Relations):**
      *   *That concept:* Two opposing schools of thought. Realists choose Power; Idealists choose Justice.
      *   *Your pattern:* You have identified that **neither side can actually choose**. The Realist needs the Idealist's language to avoid being called a tyrant; the Idealist needs the Realist's capacity to avoid being ignored. They are locked in a symbiotic hostility.

  ### Summary
  You have rediscovered the **Pascalian Aporia of Authority**.

  If you wish to cite this in writing or discussion, the most precise attribution is:
  > *"This reflects the **Pascalian antinomy of justice and force**, later deconstructed by **Derrida** as the **aporia of the foundation of law**, where authority requires both the justification of justice and the enforcement of power, yet each undermines the purity of the other."*

  It is a profound insight because it reveals that political debate often isn't about solving problems, but about managing this inevitable oscillation. The "solution" is never found; it is only temporarily stabilized by institutions that successfully mask the force behind their justice, or the justice behind their force.
