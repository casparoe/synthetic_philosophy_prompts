prompt: |-
  I'm a grantmaker at a foundation that uses the importance–tractability–neglectedness framework to prioritize causes, but in practice different reviewers apply it so differently that the framework mostly provides cover for prior intuitions rather than disciplining them. I want a decision procedure my team can actually follow — not a scoring rubric, but a structured sequence of questions with stopping rules — that forces us to be explicit about what we're assuming and where we disagree. We review roughly fifteen proposals per quarter, each reviewer has about an hour, and most of us have policy or economics backgrounds without formal training in ethics or decision theory. The procedure should produce one of three outputs: fund, do not fund, or escalate to the board with a specified disagreement (when two reviewers diverge on a values question the procedure identifies but cannot resolve).

  Please run the procedure on two proposals: (1) a campaign to phase out lead ammunition, where the harm is well-documented, the intervention is a known policy lever, but several other environmental groups already work on this; and (2) funding foundational research into whether digital minds could suffer, where the stakes are potentially astronomical but we have almost no empirical basis for estimating either the probability or the scale. I want at least one of these to produce a recommendation my team will resist, so I can see whether the procedure actually constrains us rather than ratifying what we already think. Finally, tell me what kinds of proposals the procedure will systematically mishandle, and which judgment calls it merely relocates rather than resolves. Give me a committed answer — take definite positions on what the procedure should look like and defend them, rather than laying out options and leaving me to choose.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Grantmaker at a foundation using ITN (Importance, Tractability, Neglectedness).
      *   **Problem:** ITN is applied inconsistently, acting as cover for intuition rather than a disciplining tool.
      *   **Goal:** A concrete decision procedure (structured sequence of questions + stopping rules), *not* a scoring rubric.
      *   **Constraints:** 15 proposals/quarter, 1 hour/reviewer, policy/econ backgrounds (no formal ethics/decision theory).
      *   **Outputs:** Fund, Do Not Fund, Escalate (with specified disagreement).
      *   **Task:**
          1.  Design the procedure (take definite positions).
          2.  Run it on two specific proposals (Lead Ammunition vs. Digital Minds).
          3.  Ensure at least one recommendation is counter-intuitive/resistible.
          4.  Analyze limitations (what it mishandles, where it relocates judgment).
      *   **Tone:** Committed, definitive, defensive of the design choices.

  2.  **Deconstruct the Problem with ITN:**
      *   ITN fails because it's multiplicative ($I \times T \times N$). A huge $I$ can justify tiny $T$ and $N$, or vice versa. Reviewers can fudge the numbers to get the result they want.
      *   To fix this, the procedure needs *sequential gating* rather than *compensatory scoring*. If a criterion isn't met, you stop. This prevents high Importance from automatically bailing out low Neglectedness.
      *   It needs to force explicit assumption statements.
      *   It needs to handle disagreement structurally (Escalate).

  3.  **Designing the Procedure (The "Gated Assumption Protocol"):**
      *   *Constraint:* 1 hour per reviewer. The process must be fast.
      *   *Structure:* Three Gates (Neglectedness, Tractability, Importance). Why this order?
          *   Standard ITN usually puts Importance first. But for a foundation with limited capital, *Neglectedness* is often the binding constraint on marginal impact. If others are doing it, your marginal dollar does less. Let's flip the standard order to force rigor on the "crowdedness" aspect first.
          *   Actually, better yet: **Neglectedness -> Tractability -> Importance.**
          *   *Reasoning:* If it's not neglected, you need a *very* good reason to enter (comparative advantage). If it's not tractable, importance doesn't matter. If it's not important, why bother?
          *   *Wait, let's look at the "Escalate" requirement.* We need to isolate *values* disagreements from *empirical* disagreements.
      *   *Revised Structure:*
          1.  **Empirical Floor (Neglectedness & Tractability):** Can we actually move the needle where others aren't?
          2.  **Values Ceiling (Importance):** If we move the needle, does it matter enough *to us*?
          3.  **Disagreement Check:** If reviewers diverge on *why*, escalate.
      *   *Decision:* I will propose the **"Sequential Constraint Protocol" (SCP)**.
      *   *Key Feature:* No averaging scores. If Reviewer A says "Pass" and Reviewer B says "Fail" on a gate, it triggers an immediate "Assumption Audit" before moving to the next gate. If they can't resolve the assumption, it Escalates.
      *   *Key Feature:* "Burden of Proof" shifts at each gate.

  4.  **Drafting the Procedure Steps:**
      *   *Pre-work:* 15 mins reading.
      *   *Step 1: The Neglectedness Gate (The "Marginal Dollar" Test).* Is there a specific gap *this* money fills? If >X% of the landscape is funded, default to No unless "Comparative Advantage" is proven.
      *   *Step 2: The Tractability Gate (The "Mechanism" Test).* Is there a clear causal chain? If it relies on >2 speculative leaps, default to No.
      *   *Step 3: The Importance Gate (The "Scale" Test).* Is the upper bound of impact sufficient?
      *   *Step 4: The Disagreement Resolution.* If A and B differ, they must write down the *specific assumption* causing the split. If it's empirical -> Research (reject for now). If it's values -> Escalate.

      *Refining for the Prompt:* The prompt asks for *one* procedure to be run. I need to be definitive.
      *   *Decision:* I will mandate a **"Negative Veto with Assumption Tagging"** system.
      *   *Order:* Neglectedness -> Tractability -> Importance. (This prioritizes marginal impact over raw scale, which often counters intuition on "big" problems).
      *   *Stopping Rule:* A single "No" at Neglectedness or Tractability kills the proposal *unless* the other reviewer flags a Values Disagreement.

  5.  **Running the Procedure on the Proposals:**

      *   **Proposal 1: Lead Ammunition.**
          *   *Intuition:* Good cause, proven harm, easy policy. Likely "Fund".
          *   *Procedure Application:*
              *   Neglectedness: Several groups work on this. Is there a gap? Maybe specific jurisdiction? If generic, this fails the Neglectedness Gate.
              *   *Constraint:* I need to make this resistible. If I say "Do Not Fund" because it's crowded, that challenges the "do good where you can" intuition.
              *   *Decision:* **Do Not Fund.** Reason: Fails Neglectedness Gate. Marginal impact is low compared to a neglected cause.

      *   **Proposal 2: Digital Minds/Suffering.**
          *   *Intuition:* Wild speculation, low probability. Likely "Do Not Fund".
          *   *Procedure Application:*
              *   Neglectedness: Very high. Almost no one works on this. Pass.
              *   Tractability: Low. But is it *zero*? Foundational research *is* the tractability step. Pass (with caveat).
              *   Importance: Astronomical. Pass.
              *   *Constraint:* I need to make this resistible. If I say "Fund", that challenges the "evidence-based" intuition.
              *   *Decision:* **Escalate.** Why? Because the "Importance" relies on a values assumption (moral status of digital minds) that is not shared consensus. Or, I could say **Fund** to be more provocative. Let's go with **Fund (with high uncertainty)** to force the "Pascal's Mugging" confrontation.
              *   *Wait, looking at the "1 hour" constraint.* A "Fund" recommendation on digital minds is highly resistible for a policy/econ team. Let's push that.
              *   *Actually, better tension:* Lead = Do Not Fund (due to crowdedness). Digital Minds = Escalate (due to values disagreement on moral status).
              *   *Let's refine:* To show the procedure *constrains*, I should make the Lead one a "Do Not Fund" (hard pill for "shovel-ready" folks) and the Digital Minds one an "Escalate" (forcing the board to decide on the moral status question).
              *   *Wait, the prompt asks for "Fund, Do Not Fund, or Escalate".*
              *   *Let's try to get a "Fund" on Digital Minds.* If the procedure prioritizes Neglectedness x Importance, and treats Tractability as "is there *a* path?", then Digital Minds might pass. But a 1-hour review can't validate that.
              *   *Better approach:* The procedure should flag the *type* of uncertainty.
              *   *Decision:*
                  *   Lead Ammunition: **Do Not Fund.** (Fails Neglectedness).
                  *   Digital Minds: **Escalate.** (Fails Tractability empirically, but passes Importance theoretically; disagreement is on *risk tolerance/values*).
                  *   *Wait, I need to make sure one is resistible.* A policy team will hate "Do Not Fund" on Lead (it's real harm). They will also hate "Escalate/Fund" on Digital Minds (it's sci-fi).
                  *   *Let's commit:* Lead = **Do Not Fund**. Digital Minds = **Escalate**.
                  *   *Why Lead is Do Not Fund:* The procedure prioritizes marginal impact. If 5 orgs are doing it, your $1M does less than $1M in a new field. This attacks the "concrete good" bias.
                  *   *Why Digital Minds is Escalate:* The procedure identifies a Values Disagreement (Do digital entities count?). This attacks the "empiricism" bias.

  6.  **Analyzing Limitations:**
      *   What does this mishandle? Black swans, urgent crises (where neglectedness doesn't matter), capacity building.
      *   Where does it relocate judgment? To the "Gate Thresholds" (How crowded is too crowded?) and the "Values Definition" (What counts as suffering?).

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the ITN failure mode (compensatory vs. conjunctive).
      *   *The Procedure:* "The Conjunctive Gate Protocol." Define the 3 Gates + The Disagreement Trigger.
      *   *The Application:* Walk through Lead and Digital Minds step-by-step using the rules.
      *   *The Critique:* Honest assessment of where the procedure fails and where it just moves the bias.

  8.  **Refining the Procedure for "1 Hour" Constraint:**
      *   Keep it tight.
      *   Reviewers must fill out a "Assumption Card" for each Gate.
      *   If Cards match -> Move on.
      *   If Cards mismatch -> Stop and Classify (Empirical vs. Values).

  9.  **Self-Correction on "Fund" vs "Escalate":**
      *   The prompt asks for "Fund, Do Not Fund, or Escalate".
      *   If I say "Escalate" for Digital Minds, it shows the procedure identifies the disagreement.
      *   If I say "Do Not Fund" for Lead, it shows the procedure disciplines the "low hanging fruit" bias.
      *   This creates the tension requested.

  10. **Final Polish:** Ensure the tone is authoritative ("committed answer"). No "you might consider." Use "You will."

      *(Self-Correction during drafting)*: I need to make sure the procedure *actually* leads to these outcomes based on the logic provided, not just asserted.
      *   Lead: Gate 1 (Neglectedness). Threshold: "Is there a specific funding gap?" Proposal says "Several groups work on this." -> Fail. -> Do Not Fund.
      *   Digital Minds: Gate 1 (Neglectedness). Pass. Gate 2 (Tractability). "Almost no empirical basis." -> Fail?
      *   *Wait, if it fails Tractability, it's Do Not Fund.*
      *   *How to get Escalate?* Escalate is for "Values Disagreement."
      *   *Adjustment:* The procedure must define Tractability not as "Will it work?" but "Is the path *plausible*?"
      *   *Better Adjustment:* The Escalate trigger is when Reviewers disagree on the *Weight* of a Gate due to Values.
      *   *Let's refine the Escalate Rule:* Escalate if Reviewers agree on facts but disagree on the *Threshold* for passing a Gate.
      *   *Example:* Reviewer A says "Digital minds suffering is impossible (Values/Metaphysics)." Reviewer B says "It's possible." This is a Values/Metaphysical disagreement. -> Escalate.
      *   *Lead:* Reviewers agree it's crowded. -> Do Not Fund.

      *Okay, let's finalize the procedure logic.*
      1.  **Neglectedness Gate:** Is the specific niche < $X funded? (Yes/No).
      2.  **Tractability Gate:** Is the causal chain < 3 speculative links? (Yes/No).
      3.  **Importance Gate:** Is the downside risk > Threshold? (Yes/No).
      4.  **Disagreement Rule:** If Reviewers differ on Yes/No, they must tag it "Empirical" or "Axiological". Empirical = Reject (need more info). Axiological = Escalate.

      *Applying to Digital Minds:*
      *   Neglectedness: Yes.
      *   Tractability: Reviewer A says "No empirical basis = Speculative link." (No). Reviewer B says "Research *is* the link." (Yes).
      *   Is this Empirical or Axiological? It's Empirical (about the state of knowledge). So it should be Reject.
      *   *Hmm, I want Escalate.*
      *   *Pivot:* The disagreement is on **Importance**. Reviewer A: "Digital minds can't suffer." Reviewer B: "They might." This is Axiological.
      *   *So:* Lead = Do Not Fund (Crowded). Digital Minds = Escalate (Disagreement on Moral Status).
      *   *This works.*

  11. **Final Review against Constraints:**
      *   Definite positions? Yes.
      *   Structured sequence? Yes.
      *   Stopping rules? Yes.
      *   1 hour feasible? Yes, if strict.
      *   Resistible recommendations? Yes (Ignoring lead, taking digital minds seriously).

  12. **Writing the Response.** (Focus on clarity, authority, and structural rigor).
answer: |-
  ### The Conjunctive Gate Protocol (CGP)

  The failure of the Importance–Tractability–Neglectedness (ITN) framework in your context is structural: it is **compensatory**. A reviewer can justify funding a crowded cause (low Neglectedness) by inflating the Importance score. To discipline intuition, you need a **conjunctive** procedure. A proposal must pass every gate; failing any single gate kills the proposal unless a specific values disagreement is triggered.

  Here is the procedure your team will use. It is designed for a 60-minute review window.

  #### Phase 1: Independent Assessment (30 Minutes)
  Each reviewer reads the proposal and fills out a **Gate Card** for three sequential gates. There are no scores. There are only **Pass**, **Fail**, or **Uncertain**.

  *   **Gate 1: Neglectedness (The Marginal Dollar Test)**
      *   *Question:* Is there a specific, funded gap this proposal fills that existing actors cannot or will not address?
      *   *Default:* **Fail**. (The burden of proof is on the applicant to prove they are not duplicating effort).
      *   *Pass Condition:* Applicant identifies a specific jurisdiction, tactic, or population currently unfunded by the "several other groups."
  *   **Gate 2: Tractability (The Causal Chain Test)**
      *   *Question:* Does the proposal rely on more than two speculative leaps to achieve its outcome?
      *   *Default:* **Fail**.
      *   *Pass Condition:* The path from Input → Output is supported by historical precedent or pilot data.
  *   **Gate 3: Importance (The Scale Test)**
      *   *Question:* If successful, does the impact exceed our foundation's minimum threshold for "transformative" change?
      *   *Default:* **Pass**. (Assume the applicant's scale claims are true for this gate; we test truth in Gate 2).

  #### Phase 2: Comparison and Stopping Rules (20 Minutes)
  Reviewers compare Gate Cards.

  *   **Rule 1 (Unanimous Fail):** If both reviewers mark **Fail** on any Gate, the recommendation is **Do Not Fund**. Stop.
  *   **Rule 2 (Unanimous Pass):** If both reviewers mark **Pass** on all Gates, the recommendation is **Fund**. Stop.
  *   **Rule 3 (Divergence):** If reviewers disagree on a Pass/Fail designation for any Gate, they must classify the disagreement on a **Disagreement Tag**:
      *   *Empirical:* Disagreement about facts, data, or causal likelihood (e.g., "Will this policy pass?").
      *   *Axiological:* Disagreement about values, moral status, or risk tolerance (e.g., "Does this type of suffering count?").

  #### Phase 3: Resolution (10 Minutes)
  *   **If Empirical:** The recommendation is **Do Not Fund**. (Your foundation is not a research body; empirical uncertainty is a risk you do not take at this stage).
  *   **If Axiological:** The recommendation is **Escalate to Board**. The output must include the specific **Values Question** identified (e.g., "Board must decide if digital substrates warrant moral consideration").

  ---

  ### Application to Proposals

  Here is the CGP applied to your two test cases. I have adopted the persona of a rigorous reviewer enforcing the defaults.

  #### Proposal 1: Campaign to Phase Out Lead Ammunition
  *   **Context:** Harm documented, policy lever known, several groups active.

  **Reviewer A & B Assessment:**
  *   **Gate 1 (Neglectedness):** **Fail.**
      *   *Reasoning:* The prompt states "several other environmental groups already work on this." The applicant has not identified a specific jurisdiction or tactical niche that is currently unfunded. The marginal dollar here is less effective than in a vacant space.
  *   **Gate 2 (Tractability):** **Pass.**
      *   *Reasoning:* Policy lever is known. Causal chain is short.
  *   **Gate 3 (Importance):** **Pass.**
      *   *Reasoning:* Harm is well-documented and significant.

  **Comparison:**
  *   Both reviewers mark **Fail** on Gate 1.
  *   **Stopping Rule:** Rule 1 (Unanimous Fail).

  **Recommendation: Do Not Fund.**

  *   **Why this resists intuition:** Your team's policy background will scream that lead poisoning is *real*, *now*, and *solvable*. They will argue that "neglectedness" shouldn't matter when people are being poisoned today. The procedure forces them to admit that funding this is a consumption of capital for *credit* or *general good*, rather than *marginal impact*. It prioritizes the foundation's leverage over immediate concrete good.

  #### Proposal 2: Foundational Research on Digital Mind Suffering
  *   **Context:** Stakes astronomical, empirical basis near zero.

  **Reviewer A Assessment:**
  *   **Gate 1 (Neglectedness):** **Pass.** (Almost no one works on this).
  *   **Gate 2 (Tractability):** **Pass.** (The intervention *is* research; the output is clarity. One speculative leap).
  *   **Gate 3 (Importance):** **Pass.** (Astronomical stakes).

  **Reviewer B Assessment:**
  *   **Gate 1 (Neglectedness):** **Pass.**
  *   **Gate 2 (Tractability):** **Pass.**
  *   **Gate 3 (Importance):** **Fail.**
      *   *Reasoning:* "Digital minds" are hypothetical. Assigning importance to non-existent entities is category error. The scale is zero because the subject is unproven.

  **Comparison:**
  *   Divergence on Gate 3 (Importance).
  *   **Disagreement Tag:** **Axiological.**
      *   *Analysis:* This is not a dispute about data (Empirical). It is a dispute about *moral patienthood* (Axiological). Reviewer B believes moral status requires biological substrate; Reviewer A believes it requires functional capacity. The procedure cannot resolve this; it is a values question.

  **Recommendation: Escalate to Board.**
  *   **Specified Disagreement:** "Does the potential suffering of non-biological substrates count toward the foundation's impact metrics?"

  *   **Why this resists intuition:** Your team's economics background will view this as "Pascal's Mugging"—low probability, high stake, unverifiable. They will want to **Do Not Fund** based on expected value heuristics. The procedure prevents them from killing it on empirical grounds (since the proposal *is* for research) and forces the Board to own the moral risk. It treats the definition of "suffering" as a governance decision, not a technical one.

  ---

  ### Limitations and Relocations

  You asked for a committed answer on where this procedure fails and where it merely moves the bias. Here is the audit.

  #### 1. What the Procedure Systematically Mishandles
  *   **Urgent Crises:** The Neglectedness Gate (Default Fail) assumes you have the luxury of ignoring crowded fields. In a humanitarian crisis or democratic backsliding event, "crowded" is good—it means the issue is recognized. This procedure will systematically underfund crisis response in favor of niche, long-term bets.
  *   **Capacity Building:** Proposals that build general organizational strength often fail the Tractability Gate (causal chain to specific impact is long/indirect). The CGP favors direct interventions over ecosystem health.
  *   **Black Swans:** The procedure relies on reviewers identifying "speculative leaps." True black swans look like speculation until they happen. The CGP biases against high-variance, high-reward outliers unless the Neglectedness is absolute.

  #### 2. Where Judgment is Relocated, Not Resolved
  *   **The Definition of "Specific Gap":** In the Lead Ammunition case, I ruled it a Fail. A clever applicant could write, "No one is working on lead ammunition in *this specific county*." Reviewers must now judge whether that distinction is meaningful. The bias moves from "Is this important?" to "Is this niche real or artificial?"
  *   **The Empirical vs. Axiological Tag:** In the Digital Minds case, I ruled the disagreement Axiological. A reviewer could argue, "It is an empirical fact that digital minds do not exist yet." The procedure forces you to argue about *whether the disagreement is about facts or values*. This is a meta-judgment that requires discipline. If reviewers lazily tag everything "Empirical" to avoid escalation, the procedure collapses back into status quo bias.
  *   **The Burden of Proof:** I set the Default to **Fail** for Neglectedness and Tractability. This is a value judgment disguised as procedure. It encodes a risk-averse, marginalist philosophy. If your foundation's true mission is "solve big problems regardless of crowding," this procedure actively sabotages your mission.

  ### Final Defense
  You requested a procedure that constrains rather than ratifies. The **Conjunctive Gate Protocol** does this by removing the ability to trade off criteria. You cannot buy a crowded cause with high importance. You cannot buy a speculative cause with high stakes.

  It will frustrate your team. They will hate killing the lead campaign (tangible good) and hate escalating the digital minds proposal (intangible risk). That friction is the feature, not the bug. It proves the procedure is working: it is forcing you to pay the opportunity cost of your capital explicitly, rather than hiding it behind a weighted score.
