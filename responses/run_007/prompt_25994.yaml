answer: |-
  Hey, thanks for reaching out about this. It is completely understandable that you are going in circles because this is one of the most debated and tricky areas in moral philosophy, and you have hit on exactly the right cases to expose the tension. The short answer to your question is that no, the two distinctions are not coextensive across all cases, and recognizing where they diverge is key to untangling the confusion. While killing and letting die are often understood as specific instances of doing and allowing applied to the outcome of death, the mapping is not perfect because the classification often depends on causal structure and normative expectations rather than just physical movement.

  The case you mentioned about withdrawing life support is the classic wedge that drives these distinctions apart. If you look at it purely physically, turning off a ventilator involves muscle movement and an intervention, which looks like a doing. However, most legal and ethical frameworks classify this as letting die. The reason is that the distinction here relies on the source of the lethal threat. In a killing, the agent introduces a new causal sequence that leads to death. In letting die, the agent removes an obstacle or aid that was holding back an existing lethal threat, such as the patient's underlying disease. So, in the life support case, you are physically doing something, but causally and morally you are allowing the underlying pathology to take its course. This shows that killing and letting die are not just about bodily movement but about the relationship between the agent and the cause of death, which means the doing/allowing distinction in a metaphysical sense does not always line up with the killing/letting die distinction in a moral sense.

  Then you have the issue of duty and omission, which you brought up with the famine relief versus drowning child example. This highlights another way the distinctions can diverge. Whether an omission counts as allowing or letting die often depends on whether there was a specific duty to act. If you walk past a drowning child, you had a duty to rescue, so your inaction is typically classified as letting die. If you do not send money to famine relief, many philosophers argue you are merely not preventing death rather than letting die, because the duty is less specific or demanding. This suggests that the killing/letting die distinction carries normative baggage about expectations and roles that the bare metaphysical doing/allowing distinction does not. You can have a doing that is not a killing, like the life support case, and you can have an allowing that is not a letting die if no duty existed to prevent the death in the first place.

  Regarding your question about which one is doing the normative work, that is really the heart of the debate. Some philosophers, most famously James Rachels, argue that the distinction itself has no intrinsic moral weight. In his view, the difference between killing and letting die is irrelevant compared to the agent's intentions and the consequences. If the outcome and the intent are the same, he argues, the moral judgment should be the same. However, other philosophers argue that the distinction marks a real difference in agency. They suggest that doing harm violates a negative right not to be interfered with, while allowing harm violates a positive right to be aided, and these rights have different strengths. So, while killing/letting die is technically a special case of doing/allowing applied to death, death has features regarding causal origin and the finality of the harm that make the distinction operate differently than it might with non-fatal outcomes.

  Ultimately, you should think of the doing/allowing distinction as the broader metaphysical category, while killing/letting die is the normative application of that category to fatal outcomes, filtered through specific views on causation and duty. They come apart when physical action does not equal causal initiation, as in withdrawing treatment, or when omission does not equal a breach of duty, as in distant famine relief. The normative work is done not by the labels themselves but by the underlying theories of rights and causation that we use to assign those labels in the first place. I hope that helps clarify the landscape a bit without sending you back into the circles you were stuck in.
