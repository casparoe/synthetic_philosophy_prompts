  *(Refining the "Unfalsifiable" point)*: If the claim is "Humans can see truth," how do we test that? If a human says "I see it," are they right? If they are wrong, they aren't consistent. If they are right, how do we know? This touches on the verification problem. I need to make sure this is clear.

