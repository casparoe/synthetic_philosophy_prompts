answer: |-
  **JOINT STATEMENT ON THE NORMATIVE STATUS OF REFLECTIVE EQUILIBRIUM**

  **I. Agreed Claims**

  1.  **Causal Sensitivity:** Moral judgments are causally sensitive to morally irrelevant variables, including order of presentation, physiological states (e.g., disgust, fatigue), and framing effects.
  2.  **Reflective Modification:** Critical reflection modifies first-order intuitions, typically by suppressing immediate emotional responses in favor of explicit principles.
  3.  **Evolutionary Genealogy:** The cognitive mechanisms underlying both intuition and reflection are products of natural selection and cultural evolution, designed for fitness rather than truth-tracking.
  4.  **Introspective Opacity:** Subjects lack reliable introspective access to the causal origins of their own normative convictions; we cannot feel the difference between reasoning and rationalization.
  5.  **Internal Validation:** There is no external "view from nowhere" to validate moral reasoning; any validation must be internal to the practice of justification itself.

  **II. Statement of Disagreement**

  The Constructivist asserts that the process of critical reflection transforms causal influences into normative reasons, granting the output authority independent of its genealogy. The Debunker asserts that "normative authority" is a phenomenological illusion generated by the same causal mechanisms, wherein reflection serves primarily to rationalize entrenched preferences rather than filter them.

  **III. Cruxes and Empirical Tests**

  | Crux | Question | Test Case | Constructivist Prediction | Debunker Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Insularity** | Does reflection insulate judgment from irrelevant variables, or merely swap one bias for another? | **The Disgust Protocol:** Subjects evaluate moral transgressions under induced disgust (olfactory) vs. neutral conditions, with mandatory reflection time. | Reflection will significantly reduce variance between groups. The "filter" removes the disgust signal from the final verdict. | Reflection will not reduce variance magnitude, only shift its expression. Disgust will correlate with stricter principles justified via "purity" language. |
  | **2. Convergence** | Do idealized conditions lead to consensus on substance, or only on coordination? | **The Veil Simulation:** Subjects assign rights behind varying degrees of information concealment (partial vs. total veil). | Convergence on fundamental principles increases as information concealment approaches totality. | Convergence increases only on instrumental rules for coordination; fundamental value variance remains high regardless of concealment. |
  | **3. Stability** | Are reflective judgments more stable over time than intuitive ones? | **Longitudinal Tracking:** Subjects re-evaluate cases after 6 months, with intervening exposure to counter-arguments. | Reflective judgments will show higher retention rates than intuitive ones. | Retention rates will correlate with social reinforcement, not initial processing depth. Reflection predicts no stability advantage. |

  **IV. Signatories**

  *Dr. Elena Vance (Constructivist)*
  *Dr. Marcus Reid (Debunker)*

  ***

  **Notes on Methodology:**
  Both parties agree that failure to meet the Constructivist's predictions in **Crux 1** would necessitate abandoning the claim that reflection *filters* bias, though not necessarily the claim that it *constructs* validity. Both agree that if the Debunker's prediction in **Crux 2** holds (convergence only on instrumentality), the Constructivist must concede that moral objectivity is limited to procedural fairness, not substantive value.

  We commit to publishing the raw data from these trials regardless of outcome.
