      *   **Another Tension:** (1) vs (5). Kripke argues that the conceivability of pain without C-fibers is an illusion of contingency. Chalmers (5) argues it's real possibility. The user accepts (1) for water (illusion of contingency) but (5) for phenomenals (real possibility). This requires a disunified theory of concepts (Natural Kinds vs. Phenomenal Concepts). This is tenable (Chalmers does this), but it's a theoretical cost.

