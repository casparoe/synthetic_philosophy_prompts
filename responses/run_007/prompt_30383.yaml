          *   *Severity:* Moderate. This is the classic "Fregean vs. Kripkean" tension within 2DS.

      *   *Tension B: (1)/(6) vs. (5).* (1) & (6) are standard Kripke/Putnam externalism. (5) is Chalmers's Modal Rationalism.
          *   *Analysis:* Chalmers uses 2DS to argue for dualism (zombies). He needs primary intensions to track metaphysical possibility for *phenomenal* terms. But for natural kinds (water), primary conceivability (XYZ is water) does *not* entail metaphysical possibility (Water is XYZ). The user accepts (1) Water=H2O is necessary. The user accepts (5) Conceivability $\rightarrow$ Possibility *where intensions coincide*.
          *   *Conflict:* Does the user apply Modal Rationalism to *natural kinds*? (5) says "where primary and secondary intensions coincide." For water, they *don't* coincide. So (5) is safe regarding water. But does (5) undermine the spirit of (1)? Not necessarily.
