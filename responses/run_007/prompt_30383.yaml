      *   (4) Standard Kripkean orthodoxy (often seen as tension with Descriptivism, but 2DS tries to bridge this).
      *   (5) Chalmers-specific addition (Modal Rationalism). This is the most controversial metaphysical claim.
      *   (6) Standard Externalism (compatible with 1 & 2).

  3.  **Identify Potential Tensions (Brainstorming):**

      *   *Tension A: (3) vs. (4).* (3) says there's an a priori association (like "watery stuff"). (4) says it's not a description and competence doesn't require it.
