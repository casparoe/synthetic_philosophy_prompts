      *   **Recommendation:**
          *   If the user wants to keep 2DS (2 & 3) and Modal Rationalism (5), they must relax (4). They cannot be a *strict* Kripkean anti-descriptivist. They must accept a "neo-descriptivism" or "epistemic descriptivism."
