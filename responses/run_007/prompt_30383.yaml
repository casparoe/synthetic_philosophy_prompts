      *   **Task:** Audit the package of six commitments. Rank tensions by severity, distinguish apparent from real conflicts, and identify the least costly revision if the package is untenable.
      *   **The Package:**
          1.  Kripkean rigid designation for natural kinds (Water = H2O is necessary a posteriori).
          2.  Acceptance of a 2DS framework (Primary = epistemic/scenarios, Secondary = metaphysical/worlds).
