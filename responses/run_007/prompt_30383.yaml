          4.  Anti-descriptivist (Kripkean): 'Water' doesn't *abbreviate* a description; competence doesn't require specific descriptive knowledge.
          5.  Attraction to Chalmers's Modal Rationalism (Ideal primary conceivability $\rightarrow$ primary possibility; coincidence of intensions for phenomenals $\rightarrow$ zombies possible).
