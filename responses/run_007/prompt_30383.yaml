          *   *Conflict:* You can't easily be a Kripkean causal theorist about reference fixing (4) and a 2D descriptivist about reference fixing (3) simultaneously without significant modification. Kripke says descriptions don't fix reference. 2DS says the primary intension (often descriptive) determines extension in a scenario.
