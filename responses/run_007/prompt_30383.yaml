          *   *Analysis:* This is the standard 2DS explanation of the necessary a posteriori. The statement "Water = H2O" has a necessary secondary intension but a contingent primary intension. This is the *point* of 2DS.
          *   *Severity:* None (This is the intended function of the framework).

      *   *Tension D: (4) vs. (2)/(3).* This is the big one. Kripke's anti-descriptivism (4) is usually motivated by the ignorance/error argument. 2DS (2 & 3) usually rehabilitates descriptivism by splitting the intensions. If the user is a *Kripkean* anti-descriptivist (4), they usually reject the idea that there is *any* descriptive content that fixes reference a priori. But (3) posits a primary intension that *is* descriptive ("watery stuff").
