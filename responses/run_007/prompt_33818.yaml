          *   **Assessment:** *Nuance Check.* "Entirely separate" is strong. Kripke argues they *come apart* (i.e., the intersection is not exhaustive/identical). There are Necessary A Priori truths (2+2=4). There are Contingent A Priori truths (The meter stick is one meter long). There are Necessary A Posteriori truths (Hesperus is Phosphorus). There are Contingent A Posteriori truths (It is raining).
