  7.  **Final Polish:** Ensure the distinction between "orthogonal" and "disjoint" is clear in the feedback, as that's the only place a strict grader might dock points. Ensure the Putnam/Kripke distinction on Water is noted gently (since Kripke *does* argue for natural kind essentialism, even if Putnam made H2O famous).

