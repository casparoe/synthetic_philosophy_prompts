      *   *Comment:* *Phrasing Issue:* "Entirely separate" is ambiguous. It implies the sets are disjoint (i.e., no necessary truth is a priori). You mean they are **orthogonal** or **independent**. There are Necessary A Priori truths (e.g., logic/math). Kripke argues the distinctions *come apart*, not that they never overlap.
