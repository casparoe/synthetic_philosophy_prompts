  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Mental Event" (token) and "Mental Property" (type) is hinted at, as Kim's later work focuses on property exclusion. (Decided to keep it simple first, focusing on the event/property distinction only where necessary to avoid confusion, but emphasizing Property Exclusion is more accurate to Kim's mature view). *Correction:* Actually, Kim's mature argument is the *Supervenience Argument* regarding *properties*, not just events. I should mention this shift.

