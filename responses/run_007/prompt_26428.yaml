prompt: |-
  In my philosophy of language class we read Hofstadter's 'A Person Paper on Purity in Language' — you know, the one where he writes as if 'black' were the default term for people and 'white' the marked category, so you get coinages like 'white-person' and 'chairwhite.' My friend who took the course last year summarized the essay for me like this:

  'Hofstadter's point is that sexist language and racist language are structurally the same problem. The essay shows we'd never put up with racial marking in everyday speech, so it's just inconsistent to keep using gendered defaults like 'he' and 'man' as generics. The argument is basically: if you wouldn't say "white person" every time someone happened to be white, you shouldn't say "chairman" eihter. Once you notice the parallel, the case for gender-neutral language becomes basically unanswerable.'

  I'm not sure this is quite right — the essay felt weirder and more unsettling than just a consistency argument, and I don't think Hofstadter was making a point about racist language per se. Can you go through my friend's summary and tell me what's accurate, what's misleading, and what the essay is actually doing that the summary misses?
