      *   *Closing:* Invite further pushback on the "negative" account of hallucination.

      *Draft:* I understand why that feels compelling; it is the natural starting point for almost everyone, and it captures the genuine force of the Argument from Illusion. However, we must be careful not to slide from an epistemic premise—that you cannot tell the cases apart—to an ontological conclusion—that the cases must share a constituent. When you reflect on "what it is like" in the veridical case, you are reflecting on the actual lemon making itself manifest to you; in the hallucination, you are in a state that merely seems to be a manifestation of a lemon. The similarity is real, but it is not explained by a shared positive ingredient. Rather, we should say the hallucination has the character it does precisely because it is indistinguishable from a veridical perception, not because it possesses a common phenomenal object. To posit a shared phenomenal character is to assume what we are disputing: that the mind must be buffered from the world by an intermediary. If we allow the world itself to constitute the experience in the good case, the need for a common factor dissolves.

