  I hear you, and I agree that this is the hardest hurdle to clear because the intuition is so immediate. But consider this: when you infer a common factor from indistinguishability, you are moving from an epistemic claim—that the subject cannot know which state they are in—to an ontological claim—that the states must be made of the same stuff. In the veridical case, the "what it is like" is constituted by the lemon itself presenting its properties to you; in the hallucination, there is no lemon, so there is nothing to constitute that character in the same way. We shouldn't say they share a positive phenomenal property, but rather that the hallucination is a state that merely seems to be a perception of a lemon. The similarity is explained by the fact that the hallucination is indistinguishable from the veridical case, not because they share a common core. To insist on a shared phenomenal character is to presuppose that the mind is always closed off from the world, even when perception succeeds, which is precisely what I deny.
