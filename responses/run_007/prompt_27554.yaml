  2.  **Deconstruct Hume's Argument (Part 1):**
      *   Hume argues that a wise man proportions his belief to the evidence.
      *   Evidence for a miracle is testimony.
      *   Evidence against a miracle is the uniform experience of natural law.
      *   These two evidences are contrary.
      *   We should subtract the smaller evidence from the larger.
      *   Since the evidence against a miracle (uniform experience) is as strong as evidence can possibly be, the evidence for it (testimony) must be even stronger to overcome it.
      *   Hume claims no testimony has ever reached such a standard.
      *   Essentially: $P(Miracle | Testimony)$ is always low because $P(Miracle)$ is extremely low (based on uniform experience) and the reliability of testimony is never high enough to overcome this prior improbability.

