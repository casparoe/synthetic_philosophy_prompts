      *   Likelihood: $P(T|M)$ (Probability of testimony given the miracle) vs $P(T|\neg M)$ (Probability of testimony given no miracle, i.e., deception/error).
      *   Posterior: $P(M|T)$ (Probability of the miracle given the testimony).
      *   Bayes Factor: $\frac{P(T|M)}{P(T|\neg M)}$.
      *   Hume's "subtraction" metaphor is roughly akin to comparing log-odds or weighing evidence, though he speaks of "proof" vs "probability."
      *   Hume's claim: The prior against $M$ is so strong (based on uniform experience) that the Bayes factor from testimony never exceeds the threshold required to make the posterior $> 0.5$.

