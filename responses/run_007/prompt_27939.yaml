answer: |-
  To survive the Pessimistic Meta-Induction (PMI) without collapsing into instrumentalism, a realist position must navigate a narrow channel. It must concede enough to history to acknowledge that past scientists were wrong, but hold enough ground to claim that current scientists are not merely guessing.

  Here are the requirements for an adequate realist position, followed by an analysis of their consistency and a committed judgment on the viable path forward.

  ### The Desiderata List

  **1. The Reference Requirement**
  *   **Statement:** The central terms of mature current theories (e.g., "electron," "gene," "spacetime curvature") must refer to mind-independent entities or structures, not merely serve as placeholders in a calculation.
  *   **Forcing Consideration:** Without this, realism collapses into instrumentalism. If terms do not refer, the theory is not describing the world, only organizing phenomena.
  *   **Status:** **Non-negotiable.** This is the definition of realism.
  *   **Distinction:** *Reference* is not *Truth*. A term can refer (e.g., "Newtonian mass") even if the laws governing it are false. PMI attacks reference primarily (e.g., "Aether" refers to nothing).

  **2. The Success Explanation Requirement**
  *   **Statement:** The position must explain the instrumental success of past false theories without admitting that truth is unnecessary for success.
  *   **Forcing Consideration:** The No-Miracles Argument. If false theories can be just as successful as true ones, then current success is no evidence for current truth.
  *   **Status:** **Non-negotiable.** If you concede that success does not track truth-like properties, you have lost the argument for realism.
  *   **Distinction:** *Predictive Success* (saving the phenomena) vs. *Explanatory Truth* (describing the mechanism). Instrumentalism is satisfied with the former; Realism requires the latter to explain the former.

  **3. The Discrimination Requirement**
  *   **Statement:** The position must provide a principled criterion to distinguish, within a single past theory, the components that were "right" (and survived) from those that were "wrong" (and were discarded), without relying on hindsight from the current theory.
  *   **Forcing Consideration:** The PMI shows that whole theories are rarely preserved. If we cannot distinguish the "wheat from the chaff" in past theories, we cannot claim to be doing it in current ones.
  *   **Status:** **Non-negotiable for Survival.** A realism that claims "Newton was approximately true" without specifying *in what respect* is vulnerable to the fact that Newton's ontology (absolute space) was discarded.
  *   **Distinction:** *Ontological Claims* (what exists) vs. *Structural Claims* (how it behaves). This requirement forces a split between the two.

  **4. The Continuity Requirement**
  *   **Statement:** There must be demonstrable continuity between the successful parts of discarded theories and the accepted parts of current theories.
  *   **Forcing Consideration:** If science were a series of revolutions with no cumulative progress, PMI would be undefeated. Realism requires progress.
  *   **Status:** **Non-negotiable.** Without continuity, science is not converging on truth; it is merely replacing myths.
  *   **Distinction:** *Conceptual Continuity* (we still think about heat as a fluid) vs. *Mathematical/Causal Continuity* (the equations for heat flow remain valid). History favors the latter.

  **5. The Non-Trivial Approximation Requirement**
  *   **Statement:** "Approximately true" cannot mean "makes correct predictions in a limited domain." It must mean "correctly identifies the causal powers or structural relations of the entities involved."
  *   **Forcing Consideration:** If "approximate truth" is defined solely by predictive accuracy, realism collapses into sophisticated instrumentalism (e.g., Ptolemaic astronomy was "approximately true" by this metric).
  *   **Status:** **Non-negotiable.** This prevents the retreat to "it works, so it's true enough."
  *   **Distinction:** *Empirical Adequacy* (fits the data) vs. *Verisimilitude* (resembles the actual structure of the world).

  ### Historical Episodes and Application

  An adequate position must handle these specific cases, as they represent the gradient of failure:

  1.  **Phlogiston Theory (Chemistry):**
      *   *Challenge:* The central term "phlogiston" fails to refer entirely. There is no substance released during combustion.
      *   *Requirement Test:* **Reference Requirement.** A realist must admit non-reference here. If you try to save reference for phlogiston, your criterion is too loose (trivializing realism).
  2.  **Luminiferous Aether (Optics):**
      *   *Challenge:* Fresnel's equations were incredibly successful, but relied on a mechanical aether that does not exist.
      *   *Requirement Test:* **Discrimination & Continuity.** A realist must explain how the *mathematics* survived while the *ontology* died. This is the crux of the PMI.
  3.  **Newtonian Gravitation (Physics):**
      *   *Challenge:* Predictively successful for centuries, but ontologically false (action at a distance vs. spacetime curvature).
      *   *Requirement Test:* **Non-Trivial Approximation.** Newtonian gravity is not just "predictively useful"; it is a limiting case of General Relativity. The realist must explain in what sense "force" approximates "curvature."

  ### Consistency Analysis: The Incompatibility Problem

  Here is the critical result you requested: **The set of requirements is inconsistent with "Wholesale Theory Realism."**

  Wholesale Theory Realism holds that a mature scientific theory is approximately true *as a whole package* (ontology + laws + structure). The history of science renders this impossible to satisfy jointly with the **Discrimination Requirement** and the **Reference Requirement**.

  *   **The Conflict:** If you insist that the *whole* theory is approximately true (to satisfy a strong reading of Non-Trivial Approximation), you violate the Reference Requirement regarding cases like Phlogiston and Aether. The ontology *was* discarded, not approximated.
  *   **The Consequence:** To satisfy the list, you must abandon the idea that "theories" (as complete narrative-ontological packages) are the unit of truth. You cannot maintain that "Newton's Theory was approximately true" in a wholesale sense. You can only maintain that "Newton's *equations* were approximately true" or "Newton's *causal posits* were partially correct."

  Therefore, a position that treats the *theory* as the primary truth-bearer is inconsistent with the actual history of science. The requirements force a fragmentation of the concept of "theory."

  ### Committed Judgment

  **The Most Eliminative Requirement:**
  The **Discrimination Requirement** is the single factor that eliminates the standard positions.
  *   It eliminates **Instrumentalism** because instrumentalism refuses to discriminate between "true parts" and "useful parts"; it treats the whole theory as a tool.
  *   It eliminates **Wholesale Realism** because history shows we cannot discriminate successfully at the level of full ontological narratives (e.g., we cannot save the Aether).
  *   It forces the realist to abandon "Theory" as the unit of analysis and look for sub-theoretical components that survive theory change.

  **The Winning Position:**
  **Entity Realism combined with Structural Realism (a Causal-Structural View).**

  This is not a compromise; it is the only position that satisfies the consistency constraints.

  **Reasons:**
  1.  **It Solves the Reference Problem:** Entity Realism argues that we have reason to believe in the *existence* of entities (like electrons) when we can manipulate them causally (e.g., spraying electrons to clean a surface), independent of our theoretical description of them. This bypasses the PMI attack on theoretical *descriptions* while securing the realist commitment to *things*.
  2.  **It Solves the Continuity Problem:** Structural Realism argues that while the *nature* of the entities changes (from Aether to Electromagnetic Field), the *mathematical structure* describing their relations is preserved (Fresnel's equations). This satisfies the Continuity Requirement without lying about the ontology of the past.
  3.  **It Meets the Discrimination Requirement:** It provides the necessary criterion: trust the causal manipulation and the mathematical structure; distrust the mechanistic narrative. In the Aether case, we keep the structure (equations) and discard the mechanism (fluid medium). In the Phlogiston case, we discard the entity entirely because it had no causal manipulability independent of the error.
  4.  **It Avoids Instrumentalism:** It maintains that the structure and entities are *real*, not just useful. The equations work *because* the structure of the world is mathematical, not because we forced the data to fit.

  **Conclusion:**
  You should reject the idea that "scientific theories are approximately true" if that implies the narrative ontology is correct. That claim is inconsistent with the history you are worried about. Instead, adopt the view that **science converges on the causal structure of the world, and identifies real entities, but the mechanistic stories we tell about how those entities work are perpetually liable to replacement.** This preserves the core realist intuition (science touches reality) while fully conceding the force of the Pessimistic Meta-Induction against specific theoretical mechanisms. It is the only way to hold the line without ignoring the history.
