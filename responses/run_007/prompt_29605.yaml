answer: |-
  Here is a decision procedure based on causal inference (the actual math behind Simpson's Paradox), simplified for a 20-minute engineering review.

  ### The 20-Minute Causal Checklist

  Simpson's Paradox is not a math error; it is a **causal identification problem**. The aggregate number is the "Total Effect." The subgroup numbers are the "Direct Effect." The paradox happens when a third variable (a confounder) distorts the relationship.

  To decide which number is "honest," you must determine the **causal role** of the variable you are slicing by.

  **Step 1: The Time Test (Confounder vs. Mediator)**
  *   **Question:** Did the user have this trait *before* they were exposed to the feature?
      *   *Examples:* Device type, geographic region, acquisition channel, past purchase history.
      *   *Examples (Post-Treatment):* Clicking a new widget, visiting a new page, time spent on site.
  *   **Decision:**
      *   **Pre-existing:** This is a **Confounder**. It affects the outcome independently of your feature. You generally need to look at the **Subgroups** (weighted).
      *   **Post-Treatment:** This is a **Mediator** or **Collider**. Your feature caused this trait. **STOP.** Do not slice on this. Trust the **Aggregate**.
  *   **Handoff:** If you cannot determine if the trait is pre-existing (e.g., "Power User" status that might change daily), hand off to Data Science.

  **Step 2: The Balance Test (RCTs Only)**
  *   **Question:** In an A/B test, was the distribution of this pre-existing trait equal between Control and Treatment? (e.g., Did 50% of iOS users get the new flow?)
  *   **Decision:**
      *   **Balanced:** The Aggregate is usually safe, unless the subgroups are wildly different in size.
      *   **Imbalanced:** If the Treatment group accidentally got more "high value" users (e.g., more Desktop), the **Aggregate is lying**. Trust the **Subgroups**.
  *   **Stop Condition:** If the trait is pre-existing, *and* the subgroups all show harm (negative lift), *and* the aggregate shows gain → **DO NOT SHIP.** This indicates randomization failure or a feature that harms everyone but shifted traffic to a better channel.

  **Step 3: The Sample Size Test**
  *   **Question:** Are the subgroup sample sizes large enough to be statistically significant on their own?
  *   **Decision:**
      *   **Yes:** Proceed with subgroup decision.
      *   **No:** The subgroup noise is too high. Trust the **Aggregate**, but flag for monitoring.
  *   **Handoff:** If subgroups are small but the effect size is massive, hand off to Data Science for Bayesian adjustment.

  **Step 4: The Mechanism Test**
  *   **Question:** Is there a plausible product reason why the feature would help the Total but hurt every Part?
  *   **Decision:**
      *   **Yes (Rare):** Usually implies the feature changes *who* uses the product (e.g., attracts high-value users but annoys existing ones). This is a business judgment. **Handoff to Product Lead.**
      *   **No:** If there is no mechanism, the Aggregate is likely distorted by mix shift. Trust **Subgroups**.

  ---

  ### Running the Cases

  Here is how the procedure applies to your three scenarios.

  #### Case 1: The Checkout Flow (A/B Test)
  *   **Data:** Overall Conversion $\uparrow$ (Exciting!). iOS $\downarrow$, Android $\downarrow$, Desktop $\downarrow$.
  *   **Step 1 (Time):** Device type is **Pre-existing**. (Confounder).
  *   **Step 2 (Balance):** For the Total to be $\uparrow$ while all parts are $\downarrow$, the Treatment group must have had a much higher proportion of high-converting devices (e.g., Desktop) than the Control group. Randomization failed or was skewed.
  *   **Step 4 (Mechanism):** Is there a reason a checkout flow improves total conversion while worsening it on every single platform? No.
  *   **Verdict:** **DO NOT SHIP.**
  *   **Why:** The Aggregate is lying. The feature harms every user type. The overall lift is an artifact of accidental sample imbalance (you accidentally tested on more high-converting users).
  *   **Meeting Script:** "Device is pre-existing. Since all segments are down, the feature is toxic. The aggregate lift is due to sample imbalance, not feature performance. We block until we fix randomization."

  #### Case 2: The Activation Dashboard (Before/After)
  *   **Data:** Overall Activation Flat. Channel A $\uparrow$, Channel B $\uparrow$, Channel C $\uparrow$. Mix shifted to Channel C (low converter).
  *   **Step 1 (Time):** Acquisition Channel is **Pre-existing**. (Confounder).
  *   **Step 2 (Balance):** This is observational (Before/After), not an RCT. We expect mix shifts over time.
  *   **Step 4 (Mechanism):** Did the feature cause the mix shift? Unlikely (Marketing usually drives channel mix). The feature improved activation within every channel.
  *   **Verdict:** **KEEP THE CHANGE.**
  *   **Why:** The feature works (Subgroups are honest). The flat aggregate is a business/marketing issue (channel quality dropped), not a product failure. Reverting the feature would lower activation in every channel.
  *   **Meeting Script:** "Channel is a confounder. The feature lifts activation in every segment. The flat top-line is due to external mix shift. We keep the feature and address channel quality separately."

  #### Case 3: The Widget Click (A/B Test)
  *   **Data:** Overall Metric Flat. Users who *Clicked Widget* $\uparrow\uparrow\uparrow$. PM wants to ship based on clickers.
  *   **Step 1 (Time):** Clicking the widget is **Post-Treatment**. (Mediator/Collider).
  *   **Decision:** **STOP.** Do not slice on this.
  *   **Verdict:** **DO NOT SHIP (on this evidence).**
  *   **Why:** This is selection bias. You are comparing "People who liked the widget" vs "Everyone." Of course they converted better; they engaged! You cannot attribute the lift to the feature because clicking is *caused* by the feature. The Aggregate (Flat) is the honest number for the *total population*.
  *   **Meeting Script:** "Clicking is a post-treatment variable. Conditioning on it creates selection bias. The aggregate is flat, meaning the feature has no total effect. We cannot ship based on a subgroup defined by feature usage."

  ---

  ### Where This Procedure Will Misfire

  1.  **Observational Data (Case 2 Risk):** In Before/After studies, unmeasured confounders exist. Maybe a bug in Channel C *also* lowered activation, masking the feature's gain. The procedure assumes "Channel" is the only confounder. If there are others, the "Keep" decision could be wrong.
  2.  **Mediator vs. Confounder Ambiguity:** Sometimes a trait is both. Example: "Logged In Status." A feature might encourage login (Mediator), but logged-in users also convert better naturally (Confounder). The checklist forces a binary choice; reality is often a graph.
  3.  **Small Subgroups:** If iOS is only 5% of traffic, the "iOS $\downarrow$" signal might be noise. The procedure tells you to trust subgroups if pre-existing, but if $N$ is too small, you might block a good feature due to variance.

  ### Confidence & Uncertainty

  **Confidence Level:** **High (85%)** on the statistical logic; **Medium (60%)** on the practical application without seeing your specific data pipeline.

  **The Point I Am Least Sure About:**
  I am least sure about **Case 2 (The Before/After)**.
  *Why:* Causal inference on observational data (Before/After) is significantly harder than on Randomized Controlled Trials (Case 1 & 3). My procedure assumes the "Channel Mix" is the only thing that changed besides the feature. In reality, seasonality, competitor moves, or concurrent bugs often change alongside feature releases. A Data Scientist should run a propensity score match or difference-in-differences analysis here before you fully trust the "Keep" decision. The checklist treats it as a Confounder, but without randomization, you can never be 100% sure it's not an unmeasured variable driving the result.
