          *   *Okay, I will ensure Case 1 is the definitive "Block" and Case 3 is "Invalid/Block". Case 2 is "Keep".* I will explicitly highlight Case 1 as the one where someone is excited (about the aggregate) but we block.

  5.  **Refining the Procedure (The "Causal Check"):**
      *   Need to simplify "Confounder vs. Mediator" into engineer speak.
