          *   If $Z$ (group) causes $X$ (treatment) and $Z$ causes $Y$ (outcome) $\rightarrow$ $Z$ is a confounder. Look at subgroups (weighted average).
          *   If $X$ causes $Z$ and $Z$ causes $Y$ $\rightarrow$ $Z$ is a mediator. Look at aggregate (total effect).
          *   If $Z$ is caused by both $X$ and $Y$ (or just selected on) $\rightarrow$ $Z$ is a collider. Do not condition on $Z$.
