      *   *Option C (Drop 5):* Go back to standard EU (pick one P). *Cost:* Abandons ambiguity aversion (Ellsberg), which motivated IP in the first place.
      *   *Option D (Restrict 1):* Require representors to be "independent" enough to prevent dilation. *Cost:* Forces precision in cases where you want imprecision.
      *   *Recommendation:* The "Cheapest" fix usually involves nuancing (3). Dilation doesn't make you *worse off* decision-theoretically if you use the right decision rule (e.g., E-admissibility), even if precision drops. So, distinguish "precision" from "utility."

  7.  **Final Review against Constraints:**
