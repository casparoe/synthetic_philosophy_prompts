  Also, regarding (7): Assigning 1/2 to a fair coin is compatible with IP (Levi allows precision). The tension is only if (1) is read as "Precision is *never* rational." I should note that (1) says "Most real-world evidence," which leaves room for (7). So (1) & (7) are likely fine.

