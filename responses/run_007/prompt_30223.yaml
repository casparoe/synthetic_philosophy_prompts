          *   *Verdict:* Low tension, just needs articulation.
      *   *Section 4: Second-Order Prob (6).*
          *   Keep this strict. It distinguishes IP from Bayesian Hierarchical models.
          *   Ensure (7) doesn't sneak in a hidden second-order prob.
      *   *Section 5: Consensus Check on Dilation.*
