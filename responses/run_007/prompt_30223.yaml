      *   *User's (3):* "Cost-free information can't rationally leave you worse off." This is Good's Theorem. Good's Theorem assumes precise probabilities and standard EU. In IP + Ambiguity Aversion, Good's Theorem *fails*.
      *   *Key Insight:* The tension isn't necessarily that IP is wrong, but that (3) might not hold in an IP framework *if* you keep (5). If you value information by precision, dilation looks bad. If you value it by decision utility, it depends on the decision rule.

  5.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication. Validate that this is a live debate.
      *   *Section 1: The Big Tension (Dilation & Value of Info).*
          *   Focus on (1), (2), (3), (4).
