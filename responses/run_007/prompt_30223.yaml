      *   *Section 2: Decision Theory & Consistency.*
          *   Focus on (5) + (2).
          *   Mention Dynamic Consistency. MaxMin + Pointwise Conditioning often leads to time inconsistency.
          *   *Fix:* E-admissibility or relaxing MaxMin.
      *   *Section 3: The Fair Coin (7) vs. General Imprecision (1) & (6).*
          *   This is actually consistent if grounded in "chance" vs. "evidence."
