prompt: |-
  I keep hearing about the hole argument in philosophy of physics but I've never quite got my head round what's actually at stake in it. As I understand it, it's something to do with diffeomorphism invariance in general relativity and whether spacetime points have primitive identity, and it was originally Einstein's argument against generally covariant field equations before it got turned into an argument against substantivalism by Earman and Norton. But I get lost in the middle bit — the move from "here are two mathematically distinct models that agree on all observable predictions" to "therefore substantivalism entails indeterminism." Could you walk me through that step slowly? I'm less interested in the technical differential geometry than in the conceptual structure of the argument: what exactly substantivalism is committed to that generates the problem, and whether the standard responses (sophisticated substantivalism, relationalism, etc.) actually address that commitment or just talk past it. I'm trying to work out whether this is a genuine problem for realism about spacetime or more of a bookkeeping issue about how we describe models.
