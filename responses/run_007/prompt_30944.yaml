  3.  **Drafting the Core Argument (The "Middle Bit"):**
      *   *Premise 1 (Substantivalism):* Spacetime points exist independently of the fields/matter on them. They have their own identity (haecceity). Point $p$ is point $p$, regardless of what metric value is there.
      *   *Premise 2 (General Covariance):* If $(M, g)$ is a solution to Einstein's equations, then $(M, \phi^*g)$ is also a solution, where $\phi$ is a diffeomorphism (specifically one that is the identity outside the "hole" but shifts things inside).
      *   *The Setup:* Imagine a region (the Hole). Everything outside is fixed. Inside, we have two mathematical descriptions: Model A and Model B. They are related by a smooth shift.
      *   *The Conflict:* In Model A, point $p$ has curvature $X$. In Model B, point $p$ has curvature $Y$ (because the field was shifted onto a different point $q$, but we are looking at $p$).
      *   *The Substantivalist Verdict:* Since $p$ is a real thing with independent identity, "Curvature at $p$ is $X$" is a different physical fact than "Curvature at $p$ is $Y$."
      *   *The Indeterminism:* The state outside the hole determines the equations, but the equations allow *both* Model A and Model B. Therefore, the past does not determine the future distribution of metric properties over specific points.
      *   *Conclusion:* Substantivalism + GR = Radical Indeterminism.

  4.  **Refining the Explanation (Avoiding Technical Jargon):**
      *   Use an analogy. The "shift" analogy is classic. Imagine a chessboard.
      *   *Substantivalist:* The squares are real. Moving a piece from square E4 to E5 is a real change.
