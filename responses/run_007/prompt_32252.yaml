  2.  **Deconstruct Public Reason Liberalism (PRL):**
      *   *Core Claim:* Legitimacy requires justification accessible to all reasonable citizens.
      *   *Scope:* Constitutional essentials and matters of basic justice.
      *   *Constraint:* No comprehensive doctrines (religious, deep metaphysical) as *primary* justification.
