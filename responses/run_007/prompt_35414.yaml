      *   *Idea 2:* Not about Personal Identity over Time. This is about *origin*, not survival of fission/amoeba cases.
      *   *Idea 3:* Artifacts. Both might agree that *some* origin constraints apply to artifacts (a statue can't come from a completely different block of marble), even if they disagree on the degree. *Correction:* The prompt suggests OE might argue artifacts have it, OOE might agree but think humans are different. Let's make it about the *logical form*.
      *   *Idea 4:* The "No-Branching" constraint. Both agree that one origin cannot produce two numerically distinct people (in the same world).
      *   *Refinement:* Let's focus on the modal logic structure. Both agree that the question is about *de re* modality. Both agree that genetic makeup is not identical to numerical identity (clones are possible). Both agree that the question is not about epistemic access (we can't know the origin, but does it determine identity?).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Point 1: Kripke's Necessity of Origin.*
          *   OE: Kripke's intuition pumps work directly for humans.
