      *   *Point 3: The "Almost You" Intuition.*
          *   OE: A person from slightly different gametes is a *sibling*, not you.
          *   OOE: A person from slightly different gametes is *you* (counterfactually).

  5.  **Drafting Section 3: Cruxes:**
      *   *Focus:* The move from Artifacts to Gametes.
