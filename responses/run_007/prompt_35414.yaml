          *   OOE: No, identity should supervene on intrinsic properties at a time.
      *   *Crux 3: Moral/Practical Implications (maybe too pragmatic?).* Let's stick to metaphysics. Let's use the "Twin Earth" style thought experiment regarding gamete swapping.
      *   *Refinement on Crux 1 (as requested):* The Artifact-Human Analogy.
          *   OOE Disanalogy: Artifacts are constituted by matter; humans are constituted by life processes. Matter is replaceable in life, not in tables.
