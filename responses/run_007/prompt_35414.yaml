answer: |-
  # Joint Statement of Adversarial Collaboration: Origin Essentialism and Human Persons

  **Date:** October 26, 2023
  **Parties:** 
  *   **The Origin Essentialist (OE):** Representing the view that human persons necessarily originate from the specific sperm and egg from which they actually originated.
  *   **The Opponent of Origin Essentialism (OOE):** Representing the view that human persons could have originated from slightly (or significantly) different gametes while remaining numerically identical.

  ---

  ## 1. Agreed Claims

  We, the undersigned, acknowledge that while we disagree on the modal status of human origins, we share a common metaphysical framework regarding the structure of the debate. We affirm the following substantive claims:

  1.  **Numerical vs. Qualitative Identity:** We agree that the question concerns *numerical identity* (whether the resulting entity is *you*), not *qualitative identity* (whether the resulting entity resembles you). Both sides accept that a person originating from different gametes could be qualitatively identical to you (a doppelgänger) without being numerically identical to you.
  2.  **Distinctness of Genetic and Numerical Identity:** We agree that sharing a genome is not sufficient for numerical identity. Both sides accept the possibility of identical twins or cloning scenarios where two numerically distinct persons share the same genetic code. Therefore, the dispute is not reducible to genetic essentialism alone.
  3.  **Synchronic vs. Diachronic Identity:** We agree that this dispute is distinct from questions of *persistence* over time (e.g., fission, teleportation, or psychological continuity). We are addressing the *initial individuation* of the person, not their survival through change after birth.
  4.  **The Rejection of Epistemicism as a Solution:** We agree that the difficulty of empirically verifying counterfactual origins does not resolve the metaphysical question. The dispute is about the truth conditions of counterfactual claims, not our epistemic access to them.
  5.  **Constraints on Artifacts:** We agree that *some* form of origin essentialism applies to artifacts. Specifically, we agree that a specific table could not have been made from *no* matter, nor from a completely disjoint block of wood located on a different continent at the time of construction. The disagreement lies in whether the constraint on humans is as strict as the constraint on artifacts.

  ---

  ## 2. Disagreements Table

  | Point of Disagreement | Origin Essentialist (OE) Position | Opponent of Origin Essentialism (OOE) Position |
  | :--- | :--- | :--- |
  | **1. The Force of Kripke's Argument**<br>*(Does the necessity of origin established for artifacts/queens transfer directly to human gametes?)* | **Direct Transfer.** Kripke's intuition in *Naming and Necessity* is robust. Just as Queen Elizabeth II could not have been born of different parents, a person cannot originate from a different zygote. The specific material cause (the gametes) individuates the effect (the person). | **Blocked Transfer.** Kripke's examples rely on discrete historical events (parentage) or artifact construction. Biological fertilization involves a continuum of genetic material. The intuition that works for "parents" does not automatically scale down to microscopic gametic variations. |
  | **2. The Tolerance Principle & Sorites**<br>*(If a person could come from gametes $G$, could they come from $G'$, where $G'$ differs by one molecule?)* | **Rejection of Tolerance.** There is no vagueness in identity. If you originate from sperm $S$, you could not have originated from $S^*$, even if $S^*$ differs by a single molecule. The "Sorites" pressure is an illusion caused by confusing qualitative similarity with numerical identity. | **Acceptance of Tolerance.** Identity should not hinge on microscopic physical differences. If a person could exist from gametes $G$, they could exist from $G'$ (minimally different). By iteration, this implies a person could exist from significantly different gametes. Denying this makes identity arbitrarily sensitive to quantum fluctuations. |
  | **3. The Status of "Possible Siblings"**<br>*(In a counterfactual world where slightly different gametes fuse, who exists?)* | **A Distinct Person.** The entity resulting from the fusion of slightly different gametes is a *different* person (a possible sibling). It is metaphysically impossible for *you* to be that entity. | **You (Counterfactually).** The entity resulting from the fusion of slightly different gametes is *you*, merely in different circumstances. To say it is a "sibling" is to privilege the actual world's biological lottery over modal flexibility. |

  ---

  ## 3. Cruxes

  We have identified specific sub-questions where further argumentation or conceptual analysis could shift the dialectic. Resolution of these cruxes would require one side to abandon a core premise.

  ### Crux 1: The Artifact-Biology Analogy
  **The Issue:** The OE relies on an inference from Kripke's table case (made from block $B$) to the human case (made from gametes $G$). The OOE claims this inference fails due to a disanalogy between material constitution in artifacts and biological generation.

  *   **Proposed Test:** A detailed analysis of *individuation conditions* for processes vs. objects. Does the identity of a *life* supervene on the identity of the *matter* at the start of the life in the same way a statue supervenes on clay?
  *   **OOE's Disanalogy:** In artifacts, the matter is static; in biology, the matter is immediately metabolized and replaced. The "origin" in biology is a process of information transfer, not just material constitution. Therefore, slight variations in the material carrier (gametes) do not alter the identity of the information pattern (the person).
  *   **OE's Reply:** The crucial moment is fertilization, which creates a new causal chain. Like the first cut of the sculptor's chisel, fertilization is a discrete event that fixes identity. The subsequent replacement of matter is irrelevant to the *origin* constraint.
  *   **Predictions:**
      *   **OE:** Analysis will show that causal chains require a fixed starting point to be individuated. Without fixed gametic origins, we cannot distinguish between one person and a twin in modal space.
      *   **OOE:** Analysis will show that biological identity is "fuzzy" at the boundaries, unlike artifact identity. The "fixed starting point" is a conceptual imposition, not a biological reality.

  ### Crux 2: The Intrinsicness Principle
  **The Issue:** Does the identity of a person supervene on their intrinsic properties at a given time, or can it depend on extrinsic historical facts (like which sperm won the race)?

  *   **Proposed Test:** Consider a "Switch Case." Two zygotes, $Z_1$ and $Z_2$, are genetically identical (clones). $Z_1$ is implanted in World A; $Z_2$ is implanted in World B. In World A, $Z_1$ comes from Sperm $S$. In World B, $Z_2$ comes from Sperm $S^*$ (a duplicate of $S$). Are the resulting adults the same person?
  *   **Predictions:**
      *   **OE:** They are **different** persons. Identity is determined by the *token* history (the actual sperm $S$), not just the type. History is essential.
      *   **OOE:** They are the **same** person (or the question is indeterminate). If intrinsic properties and qualitative history are identical, numerical identity should hold. Relying on the "thisness" of the sperm commits one to a controversial haecceitism.
  *   **Movement Condition:** If the OOE can demonstrate that token-haecceitism leads to unacceptable consequences in ethics (e.g., moral luck regarding existence), the OE may concede. If the OE can demonstrate that intrinsicness leads to duplication paradoxes, the OOE may concede.

  ### Crux 3: The Sharp Boundary vs. Vagueness
  **The Issue:** The OE accepts a sharp boundary between "you" and "not you" regarding gametic composition. The OOE finds this arbitrary.

  *   **Proposed Test:** Examination of other biological identity criteria (e.g., species boundaries, organismal persistence through cell replacement).
  *   **Predictions:**
      *   **OE:** Biological *kinds* may be vague, but numerical *identity* cannot be. Vague identity is a contradiction. Therefore, the sharp boundary at the actual gametes is the only coherent option.
      *   **OOE:** Numerical identity *can* be vague in cases of gradual replacement (e.g., Ship of Theseus applied to organisms). The "sharp boundary" is a linguistic artifact, not a metaphysical fact.
  *   **Movement Condition:** If a coherent logic of vague identity is produced that satisfies the OE, the OOE gains ground. If the OOE is forced to admit that vague identity renders quantification impossible, the OE gains ground.

  ---

  ## 4. Closing Assessment: Verbal or Substantive?

  **Verdict:** The disagreement is **substantive**, not merely verbal.

  **Reasoning:**
  Both sides acknowledge that a verbal dispute might arise if we were merely debating the definition of the word "person" or the usage of "could have been." However, we agree that the dispute persists even when we fix the reference of "you" (via rigid designation) and agree on the non-modal facts of biology.

  1.  **Metaphysical Commitments:** The OE is committed to a metaphysics where *haecceities* (this-ness) and causal histories determine identity. The OOE is committed to a metaphysics where intrinsic properties and qualitative continuity determine identity. These are conflicting views about the structure of reality, not just language.
  2.  **Modal Space:** The disagreement changes the "size" and "shape" of modal space. For the OE, the set of possible worlds containing *you* is narrow (restricted to worlds with your specific gametes). For the OOE, that set is broad. This is a factual disagreement about the nature of possibility.
  3.  **No Paraphrase:** We cannot paraphrase one another's claims to make them compatible. The OE cannot say "In a manner of speaking, I could have had different parents," because they mean it is *metaphysically impossible*. The OOE cannot say "Strictly speaking, I am different," because they mean the strictness is a mistake.

  **Caveat:** We acknowledge a minor verbal element regarding the **Tolerance Principle**. The OE interprets "tolerance" as a claim about identity preservation across a chain; the OOE sometimes interprets it as a claim about the *indeterminacy* of the concept "person." However, once we distinguish between *ontic vagueness* (OOE) and *epistemic sharpness* (OE), the substantive core remains: **Does the actual token history of a human being metaphysically necessitate their identity?** On this, we remain fundamentally opposed.

  ***

  **Signed,**

  _________________________ 
  *The Origin Essentialist*

  _________________________ 
  *The Opponent of Origin Essentialism*
