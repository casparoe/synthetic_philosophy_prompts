      *   **Opponent (OOE):** Follows Lewis, Mackie, or similar modal skeptics. Identity is more flexible. Small changes in origin might be compatible with the *same* person. Strict gametic essentialism leads to absurdities or ignores the continuity of biological processes.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Substantive agreement. Not just "we disagree."
