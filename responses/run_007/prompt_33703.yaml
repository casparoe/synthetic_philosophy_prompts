answer: |-
  Here is a brainstorming overview followed by the crisp one-page proposal you can distribute to your students.

  ### Expert Brainstorming & Contextual Notes
  *Before handing out the proposal, here is the background logic used to construct it.*

  Gödel's argument for immortality is not extant as a formal derivation (unlike the Ontological Proof). It appears primarily in **Hao Wang's *Reflections on Kurt Gödel* (1987) and *A Logical Journey* (1996)**, as well as correspondence with his mother. The core tension is between **Leibnizian Metaphysics** and **Axiological Necessity**.

  1.  **The Leibnizian Route:** Gödel was a committed Leibnizian. Leibniz argued that monads (simple substances) have no parts; therefore, they cannot be destroyed by decomposition. If the mind is a monad, it is naturally immortal. *Independence Check:* This relies on metaphysics of substance, not necessarily the Ontological Proof (GOP), though both share Leibnizian roots.
  2.  **The Axiological/Transcendental Route:** Gödel argued that the world is rational and meaningful. If death is annihilation, human potential and moral striving are rendered ultimately futile. A rational universe (governed by God) would not permit such irrational waste. *Independence Check:* This looks like a transcendental argument ("Meaning is possible only if..."). It might require *a* God, but does it require the specific "God-like being" of the GOP?
  3.  **The Theological Entailment Route:** God exists (via GOP). God is just. Justice requires post-mortem rectification. Therefore, immortality. *Independence Check:* This is fully dependent on the GOP.

  The most philosophically interesting paper will investigate whether routes (1) or (2) can stand without (3).

  ***

  ### Term Paper Proposal
  **Course:** [Course Name/Number]
  **Topic:** Rational Reconstruction of Gödel's Argument for Personal Immortality
  **Length:** 12–15 Pages

  **1. The Central Question**
  Kurt Gödel is famous for his formal Ontological Proof for the existence of God. Less known, but frequently discussed in his later years, was his conviction that he possessed a rational argument for personal immortality. Unlike the Ontological Proof, this argument was never formalized in manuscript.

  **Your task is to answer the following:**
  > *What is the strongest rational reconstruction of Gödel's argument for personal immortality, and does its probative force depend essentially on his Ontological Proof, or can it stand as an independent axiological or metaphysical argument?*

  **2. Background & Sources**
  You must move beyond biographical anecdote. While there is no "Immortality Manuscript," the raw material for reconstruction exists in:
  *   Hao Wang's records of conversations (*Reflections on Kurt Gödel*; *A Logical Journey*).
  *   Gödel's letters to his mother (specifically regarding the meaningfulness of the world).
  *   Gödel's published remarks on Leibniz and Kant.
  *   Secondary literature: Dawson (*Logical Dilemmas*), Sobel (*Logic and Theism*), and recent analyses of Gödel's philosophical theology.

  **3. Methodological Approach**
  A successful paper must attempt a **charitable rational reconstruction**. You should not merely report that Gödel *believed* in immortality; you must formulate the premises that would make that belief rational *for Gödel*. Consider the following vectors:
  *   **The Argument from Meaning:** Does Gödel argue that the existence of objective value (Platonism) necessitates a realm where that value is realized?
  *   **The Argument from Simplicity:** Does he rely on a Leibnizian view of the soul as a simple substance indestructible by physical means?
  *   **The Argument from Rationality:** Does he claim that a universe ending in annihilation violates the Principle of Sufficient Reason?

  **4. The Independence Thesis (Crucial)**
  The core of your analysis must address the relationship between the Immortality Argument (IA) and the Gödelian Ontological Proof (GOP).
  *   **Dependence:** Does the IA merely follow as a corollary of the GOP? (e.g., "God exists, therefore justice exists, therefore immortality exists").
  *   **Independence:** Can the IA function as a free-standing transcendental argument? (e.g., "Rationality/Meaning is intelligible only if immortality is true," regardless of the specific modal logic of the GOP).
  *   **Partial Overlap:** Does the IA share axioms with the GOP (e.g., the nature of "positive properties") without being derived from it?

  **5. Criteria for Success**
  *   **Reconstruction:** You must present the argument in premise-conclusion form. It need not be modal logic, but it must be logically valid.
  *   **Textual Fidelity:** Your reconstruction must be grounded in Gödel's actual remarks (Wang, letters), not speculative theology.
  *   **Critical Analysis:** You must evaluate the plausibility of the premises. Why would Gödel find them compelling? Where is the weak point?
  *   **Verdict:** You must take a clear stance on the Independence Thesis. A paper that hedges without argument will be penalized.

  **6. Common Pitfalls (Failure Conditions)**
  *   **Conflation:** Treating the Immortality Argument as simply "part of" the Ontological Proof without analyzing the distinct inferential steps.
  *   **Biographical Drift:** Spending too much time on Gödel's mental health or paranoia rather than the philosophical content of the argument.
  *   **Straw Man:** Reconstructing the argument so weakly that it is easily dismissed, rather than making it as strong as possible before critiquing it.

  **7. Suggested Starting Point**
  Begin with Wang's report that Gödel viewed the world as "rational" and that "the meaning of the world" requires a continuation of the personality. Ask yourself: Is this an empirical claim, a moral claim, or a metaphysical necessity? From there, trace the connection to the concept of God.
