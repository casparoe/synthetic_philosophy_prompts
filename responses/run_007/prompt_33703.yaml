          *   It's not a formal proof like the Ontological Argument (which exists in manuscripts).
          *   It's mostly anecdotal, found in letters (especially to his mother) and reported conversations (Wang, Morgenstern).
          *   Key source: Hao Wang's *Reflections on Kurt Gödel* and *A Logical Journey*. Also, John Dawson's *Logical Dilemmas*.
          *   *The Core Idea:* Gödel believed the world is rational and meaningful. He thought the existence of a "next world" was necessary for the meaningfulness of *this* world. If death is the end, the potentialities of human life (especially moral and intellectual) are wasted. A rational universe wouldn't allow such waste.
          *   *Connection to Ontological Proof:* The Ontological Proof establishes the existence of a "God-like" being (positive properties). Immortality often follows from the nature of the soul as a "positive" entity or the necessity of a just universe governed by this God.
          *   *Leibnizian Influence:* Gödel was a deep Leibniz scholar. The argument likely leans on the Principle of Sufficient Reason (PSR) and the idea of a pre-established harmony or monadology where the soul is simple and indestructible.
          *   *Kantian Influence:* Gödel was critical of Kant but engaged with him. The argument might be transcendental: "Experience/Meaning is possible only if X (immortality) is true."
          *   *Independence Question:* If the argument relies on "The world is rational" + "Death makes it irrational," does that require the specific modal logic of the GOP? Or is it a separate axiological argument (argument from value/meaning)?
      *   *Potential Reconstructions:*
          1.  **Axiological:** Value requires permanence. (If good exists, it must endure).
          2.  **Rationality/PSR:** The universe is intelligible. Death as annihilation is unintelligible/wasteful. Therefore, annihilation is false.
          3.  **Monadic/Simple Substance:** The mind is simple (Leibniz). Simple things cannot be destroyed by decomposition. Therefore, the mind survives bodily death.
          4.  **Theological Entailment:** God exists (via GOP). God is just. Justice requires an afterlife. Therefore, afterlife. (This is the dependent version).

  3.  **Drafting the Proposal - Section by Section:**

