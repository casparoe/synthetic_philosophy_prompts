prompt: |-
  I'm a philosophy professor putting together a seminar for advanced undergrads on neglected arguments in early analytic philosophy, and I want to pitch a term-paper project on Gödel's argument for personal immortality. I know the rough outlines: Gödel was a theist, he took his ontological proof seriously, and he also had what he thought was a rational argument for an afterlife — he discussed it in letters to his mother and with friends like Einstein and Oskar Morgenstern. But I've never seen a careful reconstruction of the argument itself, as opposed to biographical remarks about it. 

  What I want you to do: act as an expert on Gödel's philosophical theology and help me turn this into a crisp one-page proposal for a student term paper. State the central question precisely — something like, "What is the strongest rational reconstruction of Gödel's argument for the afterlife, and does it have any probative force independant of his ontological proof?" Then lay out the approach: what the student would need to do to reconstruct it (what kinds of considerations, what conceptual moves), what the possible conclusions are, and what would count as a successful paper vs. a failure. The angle I'm most interested in is whether the afterlife argument is genuinely independent of the ontological proof or whether it collapses into it — if someone rejects the ontological argument, is there anything left of the afterlife argument, or is it just the ontological proof wearing a different hat?

  Think carefully about this — maybe start with some brainstorming about what the possible reconstructions of the argument could look like, what kinds of premises Gödel would have found congenial given his broader views, and where the argument gets its traction. Then give me the proposal.
