answer: |-
  Here is a disambiguation of the slogan "the whole is more than the sum of its parts," ordered from mathematically trivial to metaphysically radical, followed by an application to your two cases.

  ### The Menu of Readings

  **1. Mathematical Non-Additivity**
  *   **Claim:** The value of a system-level variable is not a linear function of the values of component variables (e.g., synergy, interference, threshold effects).
  *   **Status:** **Platitude.** True by definition in any system with interaction terms.
  *   **Metaphysical Weight:** None. Compatible with strict reductionism.

  **2. Structural/Relational Dependence**
  *   **Claim:** The properties of the whole depend on the *arrangement* of parts, not just the inventory of parts.
  *   **Status:** **Platitude.** A diamond and graphite differ only in structure, yet have different properties.
  *   **Metaphysical Weight:** None. Compatible with strict reductionism.

  **3. Practical Unpredictability (Weak Emergence)**
  *   **Claim:** Given the parts and laws, deriving the behavior of the whole is computationally intractable or practically impossible for finite agents.
  *   **Status:** **Substantive but Defensible.** Standard in complexity theory and chaos theory.
  *   **Metaphysical Weight:** Low. Epistemic limitation only; the whole is still ontologically determined by the parts.

  **4. Explanatory Autonomy**
  *   **Claim:** Explanations at the higher level are necessary for human understanding, even if lower-level explanations are theoretically possible (e.g., using "predation" is better than tracking muscle contractions).
  *   **Status:** **Substantive but Defensible.** Standard in philosophy of science (pragmatic reductionism).
  *   **Metaphysical Weight:** Low. Concerns methodology, not ontology.

  **5. Property Distinctness (Multiple Realizability)**
  *   **Claim:** Higher-level properties cannot be *type-identified* with lower-level properties because the same higher-level property can be realized by different lower-level configurations.
  *   **Status:** **Substantive and Defensible.** The core argument of non-reductive physicalism.
  *   **Metaphysical Weight:** Moderate. Denies *theory reduction* (bridge laws) but accepts *ontological reduction* (supervenience).

  **6. In-Principle Non-Deducibility (Strong Emergence)**
  *   **Claim:** Truths about the whole cannot be logically derived from truths about the parts and their interactions, even with infinite computing power and knowledge.
  *   **Status:** **Radical and Controversial.** Implies a break in logical supervenience. Generally rejected in physics; debated in philosophy of mind.
  *   **Metaphysical Weight:** High. Denies that the parts fully determine the whole.

  **7. Novel Causal Powers**
  *   **Claim:** The whole possesses causal capacities that are not exhausted by the causal capacities of the parts acting in concert.
  *   **Status:** **Radical and Contested.** Risks violating the causal closure of the physical domain (the "causal exclusion" problem).
  *   **Metaphysical Weight:** High. Suggests new forces or laws at the macro level.

  **8. Downward Causation (Violational)**
  *   **Claim:** The whole constrains or alters the behavior of the parts in a way that contradicts or overrides the laws governing the parts in isolation.
  *   **Status:** **Metaphysically Radical / Generally False.** In standard physics, this is indistinguishable from parts interacting via fields/forces. If it implies violating micro-laws, it is falsified.
  *   **Metaphysical Weight:** Extreme. Implies a hierarchy of substances or laws.

  ---

  ### Application to the Cases

  #### Case 1: The Ant Colony
  *   **The Target Claim:** "Collective behavior is *fully determined* by the behaviors of individual ants and their interactions." (A claim about **Ontological Determination/Supervenience**).
  *   **The Dismissal:** "The whole is more than the sum of its parts."

  **Analysis:**
  To dismiss a claim about *determination*, readings **1 through 5** are **too weak**. Non-additivity, unpredictability, and even property distinctness are all compatible with the idea that the ants *determine* the colony's behavior. If the colony is determined by the ants, the slogan cannot be used to deny that determination unless one invokes **Reading 6 (In-Principle Non-Deducibility)**, **Reading 7 (Novel Causal Powers)**, or **Reading 8 (Downward Causation)**.

  *   **Too Weak:** Readings 1–5. These admit the colony is determined by the ants, merely noting that it's hard to calculate or describe.
  *   **Overshoot:** Reading 8. Suggesting the colony overrides the physical laws governing the ants veers into vitalism or magic, which a serious working group member likely wishes to avoid.
  *   **Tacit Reliance:** The member is most likely sliding from **Reading 3 (Practical Unpredictability)** to **Reading 6 (In-Principle Non-Deducibility)**.
      *   *Why:* In biology, collective behavior is often *practically* unpredictable due to complexity (Reading 3). However, to dismiss the claim of *determination*, the member needs Reading 6. He is likely conflating "we cannot predict it" with "it is not determined." This is a category error, but it is the only way the slogan licenses his specific dismissal.

  #### Case 2: The Gas Temperature
  *   **The Target Claim:** "Temperature is *nothing over and above* the mean kinetic energy of its molecules." (A claim about **Property Identity/Reduction**).
  *   **The Dismissal:** "The whole is more than the sum of its parts."

  **Analysis:**
  To dismiss a claim about *identity* ("nothing over and above"), one does not need to deny determination. One only needs to show that the concepts or properties are distinct, even if they co-vary perfectly. Therefore, **Reading 5 (Property Distinctness)** is sufficient to license this dismissal. **Reading 6 (In-Principle Non-Deducibility)** would be **false** here, as statistical mechanics *does* successfully derive temperature from kinetic theory.

  *   **Too Weak:** Readings 1–2. Non-additivity doesn't prevent identity (e.g., water *is* H₂O, even if wetness isn't additive).
  *   **Overshoot:** Readings 6–8. Claiming temperature is not deducible from molecular motion contradicts established thermodynamics. Claiming it has novel causal powers suggests temperature exerts force independent of molecular collision, which is physically incoherent.
  *   **Tacit Reliance:** The member is most likely relying on **Reading 5 (Property Distinctness)** via **Multiple Realizability**.
      *   *Why:* He is likely thinking that "temperature" is a functional role that *could* be realized by something other than kinetic energy (e.g., in a different kind of universe or system), and therefore the *concept* of temperature is not identical to the *concept* of kinetic energy. This is a defensible philosophical point (Reading 5), but he uses the slogan ("more than") which sounds like he is making the stronger, false claim that the *physical quantity* itself exceeds the kinetic energy (Reading 6 or 7).

  ### Summary of the Shift
  Your suspicion is correct. The slogan shifts content to suit the target:
  1.  **In the Ant Case,** he uses it as a **Strong Emergence** claim (denying determination), likely conflating epistemic difficulty with ontological independence.
  2.  **In the Gas Case,** he uses it as a **Non-Reductive Physicalist** claim (denying identity), which is defensible, but the slogan implies a stronger ontological gap than is scientifically warranted.

  In both instances, the slogan functions as a "stopper" because it is ambiguous enough to sound like a trivial truth (Reading 1) while doing the work of a radical metaphysical claim (Reading 6).
