      *Refining Question 1:* "The Dynamics of Aggregate Welfare in Agro-Ecosystems." Does suppression lead to compensatory reproduction that increases total suffering? This is specific to pest control, not general WAS.

      *Refining Question 3:* Focus on "Regulatory Weighting." Current policy weighs biodiversity, not welfare. How to integrate welfare?

