answer: |-
  # Q&A Prep Sheet: Kelly vs. EV Maximisation
  **Event:** Local EA Meetup
  **Topic:** Geometric Rationality & Repeated Decisions
  **Tone:** Rigorous but conversational. Don't get bogged down in proofs; keep it intuitive.

  ---

  ### 1. "Isn't this just risk aversion with a log utility function?"
  **Who:** The Hardcore EV Maximiser (probably your friend).
  **Damage:** **High.** If they think this is just a preference parameter, they'll dismiss it as subjective.
  **Concede:** Formally, maximising geometric growth looks like maximising expected log utility.
  **Hold:** It's not a *preference*; it's a property of the *system*. Log utility isn't what you *want*; it's what you *need* to avoid ruin in non-ergodic processes.
  **Reply:** "That's the standard objection, and formally, yes, the maths looks identical. But the justification is completely different. Risk aversion says 'I dislike volatility.' Kelly says 'If I bet too much, the time-average growth rate turns negative and I go to zero.' It's not about psychological comfort; it's about the fact that the ensemble average (EV) and the time average (what actually happens to you) diverge. If you maximise EV in a multiplicative environment, you aren't 'brave'; you're mathematically guaranteed to go bust eventually. We're not arguing about taste; we're arguing about arithmetic."

  ### 2. "Most EA decisions aren't repeated bets. I make a grant once."
  **Who:** The Grantmaker / Career Switcher.
  **Damage:** **Medium.** Challenges the applicability of the 'repeated' premise.
  **Concede:** Individual grants or career moves often look like one-offs.
  **Hold:** The EA *movement* is a repeated player, and your career is a sequence of bets.
  **Reply:** "Individually, a grant looks like a one-off. But you're part of a movement that makes thousands of grants. If every actor takes high-variance, positive-EV bets without regard for correlation, the movement itself faces ruin. Plus, look at your own career: you're making repeated decisions over 40 years. If you maximise EV on every career bet without a floor, you might end up burnt out or bankrupt before you can do any good. Kelly provides the sustainability constraint for a long-term strategy."

  ### 3. "But we can pool risk across the community. That restores EV maximisation."
  **Who:** The Institutional Thinker (FTX Future Fund alum type).
  **Damage:** **High.** This is the strongest technical counter-argument for EAs.
  **Concede:** Risk pooling *does* allow for higher variance tolerance.
  **Hold:** Correlation is the killer. In a crisis, all 'positive EV' bets often fail together.
  **Reply:** "Pooling works beautifully if risks are independent. But in global catastrophic risks or macroeconomic crashes, correlations go to one. If the whole movement leverages up on 'positive EV' bets that are correlated, we don't get the Law of Large Numbers; we get systemic ruin. Kelly is the safe default for *uncorrelated* risk. If you truly have uncorrelated risk and perfect pooling, fine, move towards EV. But assume correlation is higher than you think."

  ### 4. "Kelly requires precise probabilities. Ours are made up."
  **Who:** The Practitioner / Forecaster.
  **Damage:** **High.** Undermines the input data.
  **Concede:** We rarely know true probabilities in cause prioritisation.
  **Hold:** Kelly is more robust to estimation error than EV because it punishes overconfidence.
  **Reply:** "Absolutely, our probabilities are often guesses. But that's actually an argument *for* Kelly, not against it. EV maximisation tells you to bet the house on a 55% chance if the payout is high enough. Kelly tells you to bet a small fraction. If your probability estimate is wrong, EV ruins you; Kelly just reduces your growth rate. Fractional Kelly is essentially a 'confidence interval' adjustment. It's a regulariser against overconfidence."

  ### 5. "Full Kelly is too volatile. Surely we should use Half-Kelly?"
  **Who:** The Investor / Trader type.
  **Damage:** **Low.** This is a quibble about parameters, not principles.
  **Concede:** Full Kelly is indeed very volatile (50% drawdowns are common).
  **Hold:** The *principle* remains geometric maximisation; fractional is just a pragmatic tweak.
  **Reply:** "Spot on. Full Kelly maximises growth, but it comes with stomach-churning volatility. Half-Kelly gives you 75% of the growth rate with half the variance. I'm not advocating for full Kelly in practice; I'm advocating for geometric rationality as the *norm*. Whether you run at 0.5x or 1.0x Kelly, you're still rejecting the EV-maximising policy of 'bet everything on positive expectation.' The principle holds, even if we dial down the aggression."

  ### 6. "What does 'the long run' mean? We all die in the end."
  **Who:** The Philosopher.
  **Damage:** **Medium.** Attacks the ergodicity premise.
  **Concede:** Individual human lifespans are finite.
  **Hold:** Institutions, causes, and the movement outlive individuals.
  **Reply:** "You're right that *you* won't see infinity. But the causes we support—existential risk reduction, animal welfare, global health—are infinite games. If we want the movement to persist for centuries, we need strategies that survive the long run. Ergodicity economics isn't about you living forever; it's about ensuring the capital available to do good doesn't vanish due to volatility before the work is done. We're stewards, not just consumers."

  ### 7. "What about opportunity cost? What if a better bet comes next week?"
  **Who:** The VC / Entrepreneur.
  **Damage:** **Medium.** Points out the myopic nature of simple Kelly.
  **Concede:** Simple Kelly assumes a fixed opportunity set.
  **Hold:** Dynamic programming generalises Kelly; it doesn't revert to EV.
  **Reply:** "That's a fair point about deal flow. Simple Kelly is myopic. But the solution isn't to revert to EV maximisation; it's to use dynamic programming to optimise geometric growth over a sequence of opportunities. If you know a better bet is coming, Kelly tells you to bet *less* now, not to ignore the compounding dynamics. It still prioritises survival and growth rate over raw expectation."

  ---

  ### 8. THE QUESTION I'M HOPING NOBODY ASKS
  **"If our goal is to save lives, isn't utility linear? One life saved is one life. Why apply wealth logic to altruism?"**
  **Who:** The Hardcore Utilitarian.
  **Damage:** **Critical.** If utility is linear in *good done*, EV maximisation is actually correct for altruism, even if Kelly is correct for personal finance. This invalidates the talk's relevance to EA mission.
  **Concede:** If the utility function of *impact* is truly linear and unbounded, EV is the correct metric for *impact*.
  **Hold:** Capital is a bottleneck. Ruin stops impact. Diminishing returns on capital exist even if returns on lives don't.
  **Reply:** "This is the crux of it. If you could instantly convert money to lives at a fixed rate with no friction, you'd be right. But you can't. Impact is constrained by capital availability over time. If you go bust, you save zero lives. Furthermore, there are diminishing returns to funding in most cause areas—the first million saves more lives than the billionth. So the 'utility of money for altruism' is likely concave, not linear. Kelly protects the capital base required to deploy that utility. We need to stay in the game to do the good."

  ---

  ### General Notes for Delivery
  *   **Pacing:** Don't rush the replies. If you need a moment to think, take a sip of water.
  *   **Body Language:** When the Philosopher speaks, nod respectfully. When the EV Maximiser speaks, keep your eyes steady.
  *   **The "Get Out" Clause:** If someone gets too technical on the ergodicity math, say: "I'm happy to walk through the proof afterwards, but I want to keep this accessible for the room."
  *   **Britishisms:** Don't overdo it, but ensure you say "maximise" with an 's', and feel free to describe a bad strategy as "a bit dodgy" or "proper ruinous."
