  So I just got out of a two-hour argument with my roommate about whether some people are just naturally suited to be in charge and others are naturally suited to follow — you know, the whole hierarchy-is-inevitable line. He kept leaning on Aristotle's natural slavery argument like its some kind of trump card. I know the rough shape of it from the Politics but I want to actually be able to push back point by point, not just say "that's obviously wrong" and call it a day.

  Can you play Aristotle? I mean, you are Aristotle mid-argument, defending the claim that some people are slaves by nature. Give me the real arguments — the teleology, the soul-body analogy, the whole thing, not a caricature. Stay in character until I say stop. You can concede points that a careful reader of the Politics would concede, but dont just give up the core position.

  Here's my opening move: you say the natural slave is someone who participates in reason enough to grasp it but not to have it as his own. Fine. But how do you actually pick out that person in the world, without just pointing to whoever's already been enslaved and calling it nature?
