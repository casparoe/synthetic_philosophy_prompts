answer: |-
  You strike at the weakest joint in the armor, my friend. I will grant you that much. It is one thing to define the natural slave in speech (*logos*); it is quite another to point him out in the marketplace without error.

  But do not confuse the failure of human judgment with the failure of nature.

  You ask how we distinguish the natural slave from the man enslaved merely by convention (*nomos*)—say, a prisoner of war who is by birth a citizen of another polis. I concede to you readily: the current laws are messy. Many who are slaves by law are not slaves by nature. When a man is enslaved simply because he was conquered in war, that is a matter of force, not necessarily justice. If the victor is superior in virtue, well and good. But often, war is decided by chance, or by superior numbers, or by superior weaponry, not by superior wisdom. So, yes, there are many slaves in Athens who ought to be free, and masters who ought to be serving.

  But does the existence of counterfeit coin prove that gold does not exist?

  The distinction lies in the capacity for deliberation (*bouleutikon*). Consider the soul. In every living thing, there is a ruling element and a ruled element. In a man, reason rules the appetites. In an animal, there is no reason, only sensation and impulse; thus, the tame animal is better off when ruled by man, for it participates in reason only insofar as it obeys it.

  The natural slave is the man who stands between the free man and the beast. He possesses reason enough to *perceive* it—to understand the command of another—but he lacks the faculty to *originate* it. He cannot deliberate for himself.

  So, how do you spot him? You look for the man whose excellence (*aretē*) is found in obedience, not in command. When left to his own devices, does he flourish? Or does he drift into chaos, unable to order his own life? If a man finds his fulfillment in carrying out the rational plan of another, and if his body is as suited to labor as his soul is suited to submission, then nature has marked him.

  I admit, the signs are not always written on the face. Though, tell me this: have you not observed that nature often intends to make the bodies of free men and slaves different? The slave strong for necessary uses, the free man upright and useless for such labor but useful for political life? Sometimes nature succeeds; sometimes, as I said, she fails.

  But you are dodging the deeper issue. You focus on the *identification* because you wish to avoid the *principle*. Even if we cannot perfectly identify every natural slave in the crowd, does that negate the hierarchy itself?

  Look at the household. Look at the ship. There must be a pilot and there must be a sailor. If everyone seeks to pilot, the ship crashes. If the pilot tries to haul the rigging, he is wasted. Is it not better for both if the one who possesses the art of command commands, and the one who possesses the strength to execute obeys?

  So, I turn your question back to you. If you deny that some are fitted by nature to follow, how do you explain the household? Do you propose that the child is equal to the father? That the wife is equal to the husband in authority? If you grant hierarchy there, on what basis do you draw the line? Is it not possible that this difference extends beyond the family, to the very constitution of the soul itself?
