answer: |-
  This is one of the most insightful distinctions in decision theory, and it gets at why "risk" and "uncertainty" are not the same thing.

  For Keynes, **Probability** is the *ratio* of favorable evidence to total evidence (how likely is $X$?). **Weight** is the *absolute amount* of evidence (how much do I know about $X$?).

  Here is an example that isolates the two variables to show why action should differ.

  ### The Example: The Two Urns

  Imagine you are at a carnival. There are two opaque urns on a table, **Urn A** and **Urn B**. You are told that if you pull a Black ball from either urn, you win \$1,000. If you pull a White ball, you win nothing. You have to choose one urn to draw from.

  **Person 1 (The High-Weight Agent):**
  This person has been allowed to draw **1,000 balls** from Urn A, replacing them each time. They have recorded 500 Black balls and 500 White balls.
  *   **Probability Judgment:** Based on this data, they judge the probability of the next ball being Black to be **50%**.
  *   **Weight of Argument:** Very High (1,000 observations).

  **Person 2 (The Low-Weight Agent):**
  This person is new to the game. They are told nothing about Urn B other than it contains Black and White balls. They apply the "Principle of Indifference" (since they have no reason to think one color is more likely than the other, they treat them as equal).
  *   **Probability Judgment:** They judge the probability of the next ball being Black to be **50%**.
  *   **Weight of Argument:** Very Low (Zero observations, pure assumption).

  **The Situation:**
  Both people agree on the number: **There is a 50% chance of winning.**

  **The Action:**
  The carnival owner offers to let them **sell their right to draw** back to him for a fixed price before they pull the ball. How much should they sell it for? Or, conversely, if they were allowed to **bet their own money** on the outcome, how much should they wager?

  *   **Person 1 (High Weight):** Should be willing to wager significantly more (or demand a higher price to sell their ticket). They know the 50% estimate is *stable*. If they draw one more ball and it's Black, their estimate won't move from 50% (501/1001 is still roughly 50%).
  *   **Person 2 (Low Weight):** Should wager very little (or sell the ticket cheaply). Their 50% estimate is *fragile*. If they draw one ball and it is Black, their estimate for the *next* ball might shift dramatically (depending on their Bayesian prior) because they have no data to anchor them. They are exposed to **ambiguity**.

  ### What "Weight" Actually Adds

  If probability tells you the *direction* of the evidence, weight tells you the **stability** of that direction.

  Here is what weight adds to the calculation that probability alone misses:

  **1. Resistance to New Information (Volatility)**
  Probability tells you where you stand *now*. Weight tells you how likely you are to be forced to change your mind *soon*.
  *   In the example above, Person 1's 50% is robust. It would take hundreds of anomalous draws to convince them the urn isn't 50/50.
  *   Person 2's 50% is volatile. A single piece of new evidence could swing their probability to 80% or 20%.
  *   **Rational Action:** You commit more resources to beliefs that are less likely to be overturned by the next news cycle.

  **2. Distinguishing Risk from Uncertainty**
  Economist Frank Knight (a contemporary of Keynes) made a similar distinction.
  *   **Risk:** You know the probability distribution (Urn A). You can insure against it.
  *   **Uncertainty:** You don't know the distribution (Urn B). You cannot accurately price insurance.
  *   Keynes's "Weight" quantifies this. Low weight means you are in a state of Uncertainty, even if you have assigned a specific probability number. Rational agents are "ambiguity averse"—they prefer the known risk (High Weight) over the unknown uncertainty (Low Weight), even if the expected value is identical.

  **3. The Value of Waiting**
  Weight dictates the value of gathering *more* information.
  *   If you have **Low Weight** (Person 2), it is rational to **delay action**. Since your evidence base is thin, one more test or observation has high marginal value. It might drastically change your probability.
  *   If you have **High Weight** (Person 1), it is rational to **act now**. Gathering more evidence has low marginal value because it is unlikely to change your probability estimate enough to alter your decision.

  ### Summary
  Keynes's point is that a probability number is not a complete description of a rational belief.

  *   **Probability** = "I think it will rain."
  *   **Weight** = "I looked out the window" vs. "I analyzed 50 years of satellite meteorological data."

  If both you and I say "There is a 70% chance of rain," but I have the satellite data and you just looked at a cloudy sky, I am rational to cancel the outdoor wedding, while you are rational to keep the tent rental just in case. The number is the same; the **commitment** justified by that number is different.
