answer: |-
  The Frege–Geach problem is widely considered the most significant technical hurdle for metaethical expressivism. To understand why, we must first distinguish the semantic commitments of cognitivism and expressivism, and then examine how each handles logical embedding.

  ### 1. Cognitivism and the Ease of Compositionality

  For the **cognitivist**, moral sentences like "Lying is wrong" express beliefs that represent the world. These sentences have **truth conditions**: they are true if the world is a certain way (e.g., if lying possesses the property of wrongness) and false otherwise.

  This view aligns perfectly with standard formal logic, which is **truth-conditional** and **compositional**.
  *   **Compositionality:** The meaning (truth condition) of a complex sentence is determined by the meanings of its parts and the way they are combined.
  *   **Embedding:** When a sentence $P$ is embedded in a conditional ("If $P$, then $Q$"), its truth condition remains unchanged. The conditional itself has a truth condition defined by the truth values of $P$ and $Q$ (specifically, it is false only if $P$ is true and $Q$ is false).

  Because the cognitivist treats moral sentences as propositions with truth values, logical validity is straightforward. An argument like *Modus Ponens* is valid because it is **truth-preserving**: if the premises are true, the conclusion *must* be true. Embedding poses no difficulty because the proposition expressed by "Lying is wrong" is the same whether it stands alone or sits in the antecedent of a conditional.

  ### 2. The Expressivist Difficulty: Attitudes vs. Truth Conditions

  The **expressivist** claims that "Lying is wrong" does not describe a fact but expresses a non-cognitive attitude, such as disapproval (often schematized as "Boo lying!").

  The Frege–Geach problem arises because moral sentences function logically just like descriptive sentences, even when they are not being asserted. Consider this valid argument:
  1.  Lying is wrong.
  2.  If lying is wrong, then getting your little brother to lie is wrong.
  3.  Therefore, getting your little brother to lie is wrong.

  For the expressivist, premise (1) expresses an attitude of disapproval toward lying. But what does premise (2) express?
  *   The speaker is **not** expressing disapproval of lying in premise (2). They are merely hypothesizing.
  *   If the meaning of a moral sentence *is* the attitude it expresses, then "Lying is wrong" means something different in premise (1) (where it is asserted) than in premise (2) (where it is embedded).
  *   If the meaning changes, the argument commits the fallacy of **equivocation**. The term "Lying is wrong" is being used in two different senses, so the logic fails.

  ### 3. Why Attitudes Resist Compositional Functions

  The prompt asks why the expressivist cannot simply claim that the attitude expressed by a complex sentence is a function of the attitudes expressed by its parts, mirroring the cognitivist's truth-conditional compositionality.

  The obstacle lies in the **ontological and psychological nature of attitudes** compared to truth conditions.

  **A. Lack of Logical Structure in Psychological States**
  Truth conditions are abstract semantic values governed by logical laws. Psychological attitudes (like fear, desire, or disapproval) are mental states governed by causal and psychological laws.
  *   **Negation:** For a cognitivist, $\neg P$ is true iff $P$ is false. For an expressivist, if $P$ expresses *disapproval*, what does $\neg P$ express? It cannot simply be the *absence* of disapproval (tolerance), because one can assert "It is not the case that lying is wrong" actively, not just by remaining silent. Nor can it be "disapproval of disapproval," as that changes the object of the attitude. There is no clear psychological state that maps onto logical negation.
  *   **Conditionals:** Truth conditions combine via logical operators (e.g., material implication). Attitudes do not combine this way. There is no specific psychological state of "conditional disapproval." I cannot "Boo" conditionally. If I say, "If lying is wrong, then..." I am not currently disapproving of lying; I am expressing a commitment regarding how my other attitudes relate.

  **B. The Problem of Logical Validity**
  Logic requires that validity be a matter of form, not content. For cognitivism, validity is guaranteed by the structure of truth conditions. For expressivism, if meanings are attitudes, validity must be explained as **consistency of attitudes**.
  However, psychological states do not inherently contradict one another in the way propositions do. I can logically believe $P$ and believe $\neg P$ (I am simply mistaken/irrational), but can I *feel* two contradictory attitudes? It is unclear what it means for two desires or disapprovals to be "logically inconsistent" rather than just psychologically difficult to hold simultaneously. Without a robust account of how attitudes can contradict one another, the expressivist cannot explain why the *Modus Ponens* argument above is valid.

  ### 4. Expressivist Solutions

  Expressivists have developed sophisticated strategies to overcome these hurdles, primarily by refining what kind of attitude is being expressed or by redefining logical consequence.

  **A. Higher-Order Attitudes (Simon Blackburn)**
  Simon Blackburn, a proponent of **Quasi-Realism**, suggests that complex moral sentences express **higher-order attitudes**.
  *   Simple sentence: "Lying is wrong" $\rightarrow$ First-order disapproval of lying.
  *   Conditional sentence: "If lying is wrong, then getting brother to lie is wrong" $\rightarrow$ A second-order attitude. Specifically, it expresses **disapproval of holding a combination of attitudes that is inconsistent**.
  *   In this view, accepting the conditional means you disapprove of anyone who disapproves of lying but *fails* to disapprove of getting their brother to lie.
  *   **Solution to Logic:** Logical validity is reconstructed as the avoidance of "attitudinal inconsistency." If you have the attitude in premise (1) and the higher-order attitude in premise (2), rationality *requires* you to have the attitude in the conclusion. You aren't preserving truth; you are preserving rational coherence.

  **B. Norm-Expressivism and Planology (Allan Gibbard)**
  Allan Gibbard shifts the focus from "attitudes" to **norms**. To judge an action wrong is to accept a norm that forbids it.
  *   Embedding is handled by analyzing what it means to accept a norm conditionally.
  *   Gibbard develops a semantics where moral terms express **plans** or **norm-acceptance**. Logical consistency is defined as consistency in planning. You cannot consistently plan to do $A$ while planning to do whatever is necessary to prevent $A$.
  *   This allows for a formal logic of norm-consistency that mimics truth-conditional logic without requiring moral facts.

  **C. Hybrid Expressivism and Bilateralism**
  Some modern expressivists (like Daniel Boisvert or Michael Ridge) argue for **hybrid views**. They suggest moral sentences express *both* a belief (a descriptive content) and an attitude.
  *   The descriptive content handles the embedding and logic (solving Frege-Geach by providing a proposition that can be embedded).
  *   The expressive content explains the motivational force of morality.
  *   Alternatively, **Bilateralists** distinguish between the *content* of a sentence and the *force* with which it is uttered. They argue the content remains constant across asserted and embedded contexts, while the force changes, allowing for compositional semantics similar to cognitivism but grounded in expressive norms.

  ### Summary

  The Frege–Geach problem highlights that while truth conditions are inherently suited for logical composition, psychological attitudes are not. Truth values combine according to logical laws; attitudes combine according to psychological tendencies. The expressivist cannot simply map one onto the other because there is no natural psychological equivalent to logical negation or material implication. To solve this, expressivists like Blackburn and Gibbard have moved beyond simple "Boo/Hooray" models. They reconstruct logic not as truth-preservation, but as **rational consistency among higher-order attitudes or norms**, attempting to earn the right to use logical vocabulary within a non-cognitive framework.
