prompt: |-
  In metaethics, expressivists hold that moral sentences like "Lying is wrong" do not express beliefs or report facts but instead express non-cognitive attitudes — disapproval, for instance. The Frege–Geach problem points out that moral sentences embed in complex constructions: "If lying is wrong, then getting your little brother to lie is wrong," or "It is not the case that lying is wrong." Explain why these embeddings pose a special difficulty for expressivism that they do not pose for cognitivism. In your explanation, address the following: why can't the expressivist simply say that the attitude expressed by a complex sentence is a function of the attitudes expressed by its parts, the way a cognitivist says the truth-condition of a complex sentence is a function of the truth-conditions of its parts? What is it about the nature of attitudes, as opposed to truth-conditions, that blocks this straightforward compositional move? And how have expressivists attempted to get around the difficulty — for instance, by treating moral language as expressing higher-order attitudes, or by developing expressivist-friendly notions of logical consequence?
reasoning: |-
  Here's a thinking process that leads to the explanation of the Frege-Geach problem for expressivism:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Metaethics, specifically Expressivism vs. Cognitivism regarding the Frege-Geach Problem.
      *   **Core Claim of Expressivism:** Moral sentences express non-cognitive attitudes (e.g., disapproval), not beliefs/facts.
      *   **The Problem:** Moral sentences embed in logical constructions (conditionals, negations).
      *   **Required Explanations:**
          1.  Why embeddings pose a special difficulty for expressivism but not cognitivism.
          2.  Why the expressivist can't simply say complex attitudes are functions of simple attitudes (unlike truth-conditions).
          3.  What is it about the *nature of attitudes* vs. *truth-conditions* that blocks this.
          4.  How expressivists have attempted to solve this (higher-order attitudes, logical consequence).

  2.  **Initial Brainstorming & Definitions:**
      *   *Cognitivism:* Moral sentences = propositions. They have truth values. Logic works on truth values. "If P then Q" is true/false based on truth of P and Q.
      *   *Expressivism (Classic/Emotivism):* "Lying is wrong" = "Boo lying!" (Attitude). No truth value.
      *   *Frege-Geach Problem:* How do we account for the meaning of "Lying is wrong" when it's *not* being asserted? E.g., in "If lying is wrong..."
      *   *The Logic Issue:* Validity. Modus Ponens.
          *   P1: Lying is wrong.
          *   P2: If lying is wrong, then getting brother to lie is wrong.
          *   C: Getting brother to lie is wrong.
      *   *The Expressivist Struggle:* If P1 expresses disapproval, what does P2 express? Disapproval of... what? Disapproval of disapproval? That doesn't seem to capture the conditional link. If meaning *is* the attitude, the meaning changes when the sentence is embedded. This threatens logical validity (equivocation).

  3.  **Drafting Section 1: Cognitivism vs. Expressivism on Embedding:**
      *   *Cognitivism:* Easy. Sentences express propositions with truth conditions. Logic is truth-preserving. Embedding doesn't change the proposition, just how it's used. "P" has truth condition $p$. "If P then Q" has truth condition $p \rightarrow q$. Compositionality works.
      *   *Expressivism:* Hard. Sentences express attitudes. Attitudes are usually tied to *assertion*. When I say "Boo lying!", I'm expressing disapproval. When I say "If boo lying...", what am I doing? I'm not disapproving of lying in the antecedent. So, does the sentence mean the same thing? If meaning = use/attitude, then meaning changes. If meaning changes, logic fails (equivocation).

  4.  **Drafting Section 2: Why not just make attitudes compositional? (The Core Difficulty):**
      *   *Prompt Question:* Why can't the expressivist say complex attitudes are functions of simple attitudes?
      *   *Truth Conditions:* Truth is binary (or semantic values). Logic defines how values combine (e.g., True + True = True for conjunction).
      *   *Attitudes:* Attitudes are psychological states (desires, approvals, disapprovals). They aren't inherently logical.
      *   *The "Negation" Problem:* If "Lying is wrong" = Disapproval of lying. What is "It is not the case that lying is wrong"?
          *   Is it "Absence of disapproval"? (Tolerance).
          *   Is it "Disapproval of disapproval"? (Tolerance of tolerance? No.)
          *   Cognitivist: $\neg P$ is true iff $P$ is false. Clear.
          *   Expressivist: What is the *specific attitude* corresponding to negation? It's hard to define a psychological state that maps perfectly to logical negation without smuggling in cognitive content.
      *   *The "Conditional" Problem:* "If P then Q".
          *   Cognitivist: True unless P is true and Q is false.
          *   Expressivist: What attitude is this? It's not a conditional attitude (I don't conditionally disapprove). It's an attitude about the *relation* between attitudes? But expressivism says moral language expresses attitudes *toward actions*, not attitudes toward attitudes (initially).
      *   *Key Distinction:* Truth conditions are *world-guided* and obey logical laws by definition. Attitudes are *mind-states* and don't inherently obey logical laws (you can desire P, desire If P then Q, but not desire Q without being irrational, but the *states themselves* don't have logical form in the same way propositions do). This is the "problem of logical validity."

  5.  **Drafting Section 3: Expressivist Solutions:**
      *   *Blackburn's Quasi-Realism:* We need to *earn the right* to talk about truth and logic.
      *   *Higher-Order Attitudes:* Blackburn suggests that accepting a conditional moral claim involves having a higher-order attitude. E.g., Disapproving of the combination of (Disapproving of lying AND Not disapproving of getting brother to lie). This is "disapproving of a moral inconsistency."
      *   *Gibbard's Norm-Expressivism:* Shift from "attitudes" to "norms." To judge something wrong is to accept a norm that forbids it. Logic becomes consistency of norm-acceptance.
      *   *Schroeder's Hybrid Expressivism / Bilateralism:* Distinguish between the content and the force. Or treat moral sentences as having both descriptive and expressive content. (Maybe keep it simpler: focus on Blackburn/Gibbard as per prompt hint).
      *   *Logical Consequence:* Redefine validity. Validity isn't truth-preservation (since no truth). It's *attitude-consistency* preservation. If you have the attitudes for the premises, rationality requires you to have the attitude for the conclusion.

  6.  **Refining and Polishing:**
      *   *Check against prompt:* Did I explain *why* attitudes block compositionality? Yes (psychological states vs. semantic values). Did I cover higher-order attitudes? Yes. Did I cover logical consequence? Yes.
      *   *Clarity Check:* Ensure the distinction between *asserted* contexts and *embedded* contexts is clear. This is the heart of Frege-Geach.
      *   *Terminology:* Use terms like "Modus Ponens," "Equivocation," "Compositional Semantics," "Quasi-Realism."
      *   *Structure:*
          1.  Introduction (Define Expressivism & F-G Problem).
          2.  Cognitivist Ease (Truth-conditional compositionality).
          3.  Expressivist Difficulty (The nature of attitudes).
          4.  Why simple compositionality fails for attitudes.
          5.  Solutions (Higher-order attitudes, Logical consistency).
          6.  Conclusion.

  7.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* Make sure not to say expressivists *deny* logic. They try to *reconstruct* it.
      *   *Nuance:* The prompt asks specifically about the *nature of attitudes*. I need to emphasize that attitudes (like fear, booing, desiring) don't have negations or antecedents in the way propositions do. You can't "not-desire" in the same way a proposition can be false.
      *   *Refining the "Function" point:* A cognitivist says $Val(A \land B) = f(Val(A), Val(B))$. An expressivist wants $Att(A \land B) = f(Att(A), Att(B))$. The problem is there is no natural psychological state that corresponds to $Att(If A then B)$. It's not a conditional desire. It's a commitment to consistency.

  8.  **Final Review:** Does this answer the "Why" deeply enough?
      *   *Why:* Because truth conditions are abstract objects governed by logical laws, whereas attitudes are concrete psychological states governed by causal/psychological laws. Mapping the former onto the latter requires explaining how psychological states can entail one another logically.
      *   *Solutions:* Blackburn's "Hooray/Boo" logic (higher order). Gibbard's "Planology."

