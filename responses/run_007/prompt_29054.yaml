prompt: |-
  I'm a PhD student in moral philosophy with a background in empirical moral psychology, and I'm choosing a dissertation topic within the virtue ethics–situationist debate. The empirical challenge has been on the table for over two decades now, and several distinct lines of response have emerged: the cognitive-affective personality system (CAPS) model, whole trait theory and the density-distributions approach, the argument that the classic experiments do not target the right kinds of situations (virtue is only expected to manifest in characteristic situations, not in the contrived settings of social psychology), the rarity reply (which concedes that virtue is rare but insists it remains the right normative ideal), the skill model of virtue, and the claim that the situationist data actually supports a revised virtue ethics rather than undermining it.

  I have roughly three years and want to produce work that could genuinely shift the debate rather than add another layer of epicycles to an existing defence. Please rank these approaches—and any others you think I have missed—by their promise as a dissertation focus, and defend the ranking. For each approach, I want to know: what its hardest unresolved internal question is; how tractable it is with philosophical rather than purely empirical methods; and what result, if achieved, would most change the broader assessment of virtue ethics.

  After your main answer, please provide a structured summary as a JSON array of objects, each with the fields: 'approach_name', 'rank', 'promise_summary', 'hardest_open_question', 'tractability_assessment', and 'most_decisive_possible_result'. Please write in British English throughout.
