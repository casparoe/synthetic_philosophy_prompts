      *   *Better Tie-Breaker:* A case where believing makes it true, but you know that believing *another* proposition also makes it true. Or, a case involving *false* self-fulfilling beliefs? No, the definition requires truth.
      *   *Best Tie-Breaker:* **The "Arbitrary Self-Fulfillment" Case.** Suppose believing *either* "I will succeed" *or* "I will fail" causes the respective outcome. If the reason is just "believing makes it true," then you have an RKR for *both* contradictory beliefs. That seems absurd. If she says you have no reason to pick one over the other (or that both are WKRs), it confirms the Object-Given view.
