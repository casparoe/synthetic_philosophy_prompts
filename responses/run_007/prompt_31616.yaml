      *   **Principle:** "Reasons for belief must be evidence of the proposition's truth *independent* of the act of believing." OR "Reasons must be object-given properties, not state-given properties."
      *   **Underdetermination?** Is it possible she thinks it's an RKR? Yes, some teleologists might say this. If the student is unsure, they need a tie-breaker.
