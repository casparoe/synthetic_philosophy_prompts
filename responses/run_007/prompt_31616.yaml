      *   *Pattern:* The tutor adheres to a **Strict Evidentialist** or **Object-Given vs. State-Given** distinction.
          *   RKRs are *object-given* (features of the object of the attitude: the demon's lack of merit, the friend's actual trustworthiness, the film's quality).
