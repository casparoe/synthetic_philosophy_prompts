      *   **Introduction:** Acknowledge the sophistication of the problem (this is a classic "Pragmatic Encroachment" or "Self-Fulfilling Belief" puzzle in RKR literature).
      *   **Identify the Theory:** The tutor is running a **State-Given vs. Object-Given** theory (often associated with Parfit or Scanlon). RKRs cite properties of the object of the attitude. WKRs cite properties of holding the attitude.
