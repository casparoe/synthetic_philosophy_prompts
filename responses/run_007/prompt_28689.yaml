prompt: |-
  im writing a paper arguing that no single species concept can do all the work people want it to do, and before I read any more of the literature I want the spec sheet: what would an adequate account of what species are actually have to deliver? I keep seeing people defend their favorite concept because it handles one hard case — ring species, asexual lineages, bacteria with horizontal gene transfer, chronospecies in the fossil record, hybrid zones — and then quietly set aside the cases it mangles, and I cant tell which "a real theory has to handle X" demands are genuine and which are just what a particular subfield needs for its own convenience. Give me the desiderata, each with the case or consideration that makes it a requirement, and flag which are non-negotiable and which are camp-specific (systematists, population geneticists, paleontologists, conservation biologists). Include distinctions a theory can't collapse — like between a criterion for recognising species and a definition of what they are, or between species being real units in nature and being useful units for classification — and any results from population genetics or microbiology it can't contradict. If some subset of the desiderata can't be jointly satisfied, say a criterion that works for asexuals plus the requirement that species be the units that play the causal role in evolution, I want to know, because that's the actual argument of my paper. Then one line each on how the usual contenders (biological, phylogenetic, ecological, morphological, pluralist) do against the list. no citations needed, I just need the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested spec sheet:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "spec sheet" (list of desiderata) for an adequate species concept.
      *   **Context:** The user is writing a paper arguing that *no single species concept can do all the work*. They want to identify the conflicting demands placed on species concepts before diving deeper into literature.
      *   **Key Requirements:**
          *   List desiderata with the specific case/consideration motivating each.
          *   Flag which are non-negotiable (general) vs. camp-specific (systematists, geneticists, paleontologists, conservationists).
          *   Include crucial philosophical/methodological distinctions (e.g., ontology vs. epistemology, real vs. useful).
          *   Include hard constraints from population genetics/microbiology.
          *   Identify incompatibilities (trade-offs) between desiderata (this is the core of the user's argument).
          *   Provide a one-line assessment of major contenders (BSC, PSC, ESC, MSC, Pluralism) against the list.
          *   No citations needed.

  2.  **Deconstruct the Problem (The "Species Problem"):**
      *   Why is there no consensus? Because "species" is asked to be too many things at once.
      *   It needs to be an evolutionary unit (process).
      *   It needs to be a taxonomic unit (classification).
      *   It needs to be observable (operation).
      *   It needs to cover all life (universality).
      *   It needs to handle time (fossils/ancestry).
      *   It needs to handle distinct modes of reproduction (sexual/asexual/HGT).

  3.  **Drafting the Desiderata (The "Spec Sheet"):**
      *   *Constraint 1: Universality.* Must apply to bacteria, plants, animals, fossils. (Motivation: HGT, asexuals, fossils).
      *   *Constraint 2: Evolutionary Significance.* Must correspond to independent evolutionary lineages. (Motivation: Species as units of evolution/biodiversity).
      *   *Constraint 3: Operationality.* Must be identifiable by researchers in the field/lab. (Motivation: Taxonomy, conservation policy).
      *   *Constraint 4: Stability.* Names shouldn't change every time a new gene is sequenced. (Motivation: Communication, legislation).
      *   *Constraint 5: Ontological Reality.* Are they discovered or invented? (Motivation: Realism vs. Instrumentalism).
      *   *Constraint 6: Reproductive/Genetic Cohesion.* Explains why individuals look alike. (Motivation: Sexual populations).
      *   *Constraint 7: Distinctness.* Must allow for fuzzy boundaries (hybrid zones) without collapsing into individuals or genera. (Motivation: Ring species, incipient speciation).

  4.  **Categorizing Desiderata (Non-negotiable vs. Camp-Specific):**
      *   *Non-negotiable:* Logical consistency, non-contradiction with established genetics.
      *   *Camp-Specific:*
          *   Systematists: Diagnosability, stability.
          *   Population Geneticists: Reproductive isolation, gene flow metrics.
          *   Paleontologists: Morphological continuity, time-slicing.
          *   Conservationists: Legal defensibility, discrete units for protection.
          *   Microbiologists: HGT compatibility, clonality.

  5.  **Identifying Crucial Distinctions:**
      *   Ontology (what they *are*) vs. Epistemology (how we *know* them).
      *   Process (speciation) vs. Pattern (taxonomy).
      *   Ideal (theoretical limit) vs. Operational (practical application).

  6.  **Identifying Incompatibilities (The "Killer" Section):**
      *   *Universality vs. Process:* Sexual isolation (BSC) doesn't work for asexuals.
      *   *Reality vs. Diagnosability:* Lineages are real but often cryptic/indistinguishable (PSC struggles here).
      *   *Time vs. Boundaries:* Anagenesis (chronospecies) breaks discrete boundary requirements.
      *   *Gene Flow vs. HGT:* Bacteria swap genes across vast taxonomic distances, breaking "cohesion" models.
      *   *Stability vs. Accuracy:* Phylogenetic resolution changes with more data, destabilizing names.

  7.  **Evaluating Contenders (One-liners):**
      *   *BSC:* Great for sexual animals, fails for fossils/asexuals.
      *   *PSC:* Universal in theory, oversplits in practice, ignores process.
      *   *ESC:* Focuses on niche, hard to measure, ignores neutral divergence.
      *   *MSC (Morphological):* Practical for fossils, subjective, misses cryptic species.
      *   *Pluralism:* Honest about limitations, but lacks unified theory.

  8.  **Refining and Formatting:**
      *   Organize logically: Distinctions first, then Desiderata (tagged), then Incompatibilities, then Contender Assessment.
      *   Ensure tone is analytical and rigorous (matching the user's academic intent).
      *   Check against the prompt: Did I flag non-negotiable vs. camp-specific? Yes. Did I include the distinctions? Yes. Did I highlight the trade-offs? Yes.

