      *   *Clichés/Officialese* $\rightarrow$ Borrowed language, inauthentic dialogue (even internal), failure of voice.
      *   *Ambition* $\rightarrow$ Character motivation (status, belonging) vs. Moral compass.
      *   *Inability to think from another's standpoint* $\rightarrow$ Failure of empathy, solipsism, limited POV.
      *   *Shallowness* $\rightarrow$ Is the character "round" or "flat"? Arendt suggests a terrifyingly flat character doing round things.

  4.  **Drafting the Restatement (Section 1):**
