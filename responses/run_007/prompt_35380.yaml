  - Best Guess (which rule you think she's actually using and why, maybe a paragraph)
  - Litmus Test (one new case i could give her that would definatively tell the rules apart, and what each rule predicts for it)

  also if any of her verdicts contradict each other in a way i'm missing, flag that.
