      *(Refining the Octopus context):* Octopuses are actually a real-world test case for this. They have distributed nervous systems. I should mention that real science supports Priya's functionalism regarding cephalopod pain (UK law recognizes them as sentient), which adds weight to Priya's side in a practical sense.

