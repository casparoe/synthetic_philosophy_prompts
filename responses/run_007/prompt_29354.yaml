          *   Marcus's Counter: Wiring diagram $\neq$ inner state. Causal role underdetermines feeling.
          *   *Analysis:* Priya strengthens her case by adding complexity. The hemoglobin analogy is strong for *functional* equivalence. Marcus holds the line on the "explanatory gap." He is technically correct that function doesn't *logically entail* qualia, but Priya is correct that in science, we usually infer state from function.

      *   *Move 3: Priya's Trap (The Problem of Other Minds).*
