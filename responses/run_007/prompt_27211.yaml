  # JOINT STATEMENT ON METAETHICAL ONTOLOGY AND SEMANTICS
  **Signatories:** The Robust Moral Realist Bloc & The Quasi-Realist Expressivist Bloc
  **Date:** October 26, 2023

  ### I. Agreed Claims (Substantive Concessions)

  1.  **On Logical Validity:** The Robust Realist grants that Quasi-Realism successfully reconstructs the logical validity of moral arguments (solving the Frege-Geach problem) without positing realist truth-conditions, thereby avoiding the charge that expressivism renders moral reasoning logically defective.
  2.  **On Phenomenology:** The Quasi-Realist grants that Robust Realism is not merely a linguistic confusion but a genuine attempt to capture the phenomenological "felt objectivity" of moral experience, and that the Realist's demand for stance-independence is an intelligible philosophical ambition, not a category error.
  3.  **On Disagreement:** Both sides agree that fundamental moral disagreement is not merely a clash of non-cognitive preferences (like clashing tastes in food) but involves a mutual claim to correctness that cannot be resolved solely by empirical discovery of non-moral facts.
  4.  **On Motivation:** Both sides accept a sophisticated internalism: moral judgment is necessarily connected to motivation, but this connection is normative (rational requirement) rather than merely causal (psychological compulsion), and neither side reduces moral properties *to* motivational states.
  5.  **On Supervenience:** Both sides agree that the moral supervenes on the natural (no moral difference without a natural difference), and that this supervenience is necessary, though they disagree on the *source* of this necessity.

  ### II. Residual Disagreements

  | Issue | Robust Moral Realist Commitment | Quasi-Realist Expressivist Commitment |
  | :--- | :--- | :--- |
  | **1. The Nature of Moral Truth** | Moral propositions are true in virtue of correspondence to mind-independent normative properties that exist regardless of our attitudes. | Moral propositions are "true" in virtue of the stability and consistency of our committed attitudes under ideal reflection (superassertibility), without corresponding to stance-independent properties. |
  | **2. Direction of Explanation** | The existence of the moral fact explains (or justifies) the formation of the moral belief/judgment. | The practical commitment (attitude) explains the assertion of the moral "fact"; the "fact" is a projection of the attitude, not its cause. |
  | **3. Metaphysical Queerness** | Irreducible normative properties are not "queer" but are sui generis features of reality accessible to rational intuition or sensitive judgment. | Positing stance-independent normative properties is metaphysically profligate; the quasi-realist account provides all the normativity needed without ontological excess. |
  | **4. The Status of "Belief"** | Moral judgments are beliefs in the full-blooded sense: cognitive states aimed at representing reality as it is. | Moral judgments function *grammatically* as beliefs, but are fundamentally practical states (plans/commitments) that mimic belief-talk to facilitate coordination. |

  ### III. Cruxes and Predictive Cases

  **Crux 1: The Source of Normative Authority**
  *   **Sub-Question:** Does the authority of a moral claim depend on its tracking a feature of the world, or on its coherence within a practical standpoint?
  *   **Concrete Case:** *The Alien Rationality.* Consider a being with a fully coherent, reflective practical standpoint that endorses "pain-maximization" as a virtue, utilizing the same logical operators and truth-claims as humans.
  *   **Realist Prediction:** The Alien is objectively wrong; their coherence does not grant truth because they fail to track the mind-independent property of *Goodness*.
  *   **Expressivist Prediction:** The Alien is not "wrong" in a realist sense but has different fundamental commitments; we must oppose them practically, but we cannot cite a stance-independent fact they are missing.

  **Crux 2: The Explanation of Supervenience**
  *   **Sub-Question:** Is the necessary connection between natural properties and moral properties a brute metaphysical necessity or a conceptual constraint on practical reasoning?
  *   **Concrete Argument:** *The Open Question vs. Brute Necessity.* If moral properties are distinct from natural properties, why is it conceptually impossible for them to come apart?
  *   **Realist Prediction:** The connection is a brute, necessary metaphysical law (like the link between water and H2O), which is acceptable despite being unexplainable further.
  *   **Expressivist Prediction:** The connection is a constraint on the *logic of attitudes*; it is not a metaphysical law but a rule of practical consistency, making the Realist's "brute law" a reductio of their position.

  **Crux 3: The "Earning the Right" Sufficiency**
  *   **Sub-Question:** Does the quasi-realist reconstruction of truth-talk provide everything we value in morality, or does it leave out a crucial "normative grip"?
  *   **Concrete Case:** *The Moral Regret.* An agent sincerely judges "X was wrong," later revises their view, and says "I was mistaken."
  *   **Realist Prediction:** The agent's statement is literally true only if there was a fact they failed to track; the Expressivist account makes "mistake" merely mean "change of plan," losing the normative force of regret.
  *   **Expressivist Prediction:** The agent's statement is fully legitimate within the practical discourse; the Realist's demand for a "fact tracked" adds no practical value and mystifies the nature of moral revision.

  ### IV. Note on Drafting Failure Points

  The claim most likely to cause a signatory to withdraw is **Agreed Claim #1**. While the Robust Realist can concede that Expressivism solves the *logical* Frege-Geach problem, many will refuse to grant that Expressivism has earned the right to *normative* truth-talk without a causal or grounding connection to reality. A Realist may argue that syntactic validity is insufficient for genuine normative authority, insisting that without stance-independent truth-conditions, the Expressivist is merely "playing house" with moral language. To secure the signature, the clause "thereby avoiding the charge that expressivism renders moral reasoning logically defective" would need to be amended to "thereby avoiding the charge that expressivism renders moral reasoning *syntactically* defective," acknowledging the Realist's lingering doubt about semantic depth.

  Crux summary: Whether the normative authority of moral claims requires a metaphysical ground external to human practical reasoning or is fully constituted by the demands of that reasoning itself.
