      *   Key motivation: Leibniz's Law (different modal properties/persistence conditions).
      *   Key cost: Multiplication of entities (two things in one place), causal exclusion worries, grounding problems.

  3.  **Brainstorming Defeaters/Objections:**
      *   *Grounding Problem:* How do distinct objects share all physical properties? (Standard, but needs depth).
      *   *Causal Overdetermination:* Do both cause the shattering? If so, is that redundant?
      *   *Problem of the Many:* If there's one, why not thousands of slightly different cloud-like aggregates?
      *   *Parsimony/Ockham's Razor:* Why posit two when one does the job?
      *   *Sortal Essentialism:* Is the reliance on sortals justified?
      *   *Relative Identity:* Maybe identity is sortal-relative? (Alternative solution).
      *   *Dominant Sorts:* Maybe only one object exists (the dominant one)?
      *   *Nihilism/Mereological Nihilism:* Maybe there are no composite objects at all?
      *   *Four-Dimensionalism/Perdurantism:* Maybe they are just temporal stages of a single worm?
      *   *Metaphysical Vagueness:* Is the boundary between statue and lump vague?
      *   *Logic of Identity:* Is Leibniz's Law being misapplied? (Kripkean necessity of identity).

  4.  **Categorizing Defeaters (Instruction 1 & 2):**

      *   *Fatal:*
          *   Proof that Leibniz's Law doesn't apply to modal properties (Kripkean rigid designation issues).
          *   Proof that distinct material objects cannot occupy the same space (Impenetrability principle as metaphysical law).
