          *   Relative Identity logic proving incoherence of absolute distinctness.

      *   *Seriously Awkward:*
          *   Causal Overdetermination (systematic redundancy).
          *   The Grounding Problem (explaining the supervenience of differences).
          *   The Problem of the Many (explosion of coincident objects).

      *   *Merely Uncomfortable:*
          *   Parsimony complaints (Ockham's Razor).
          *   Counterintuitiveness ("common sense" says one object).
          *   Linguistic awkwardness (counting problems).

  5.  **Internal vs. External Concessions (Instruction 3):**
      *   *Conceded:* Parsimony cost, causal exclusion worries (need a story), grounding mystery.
