      *   *Section 1 (Fatal):* Focus on the logic of identity and mereological nihilism. If identity is necessary and sortals don't track real metaphysical differences, the view collapses. If composites don't exist, the view has no relata.
      *   *Section 2 (Awkward):* Focus on Grounding and Causal Exclusion. These are the "cost of doing business" but if they get too high, the theory dies of starvation. The "Problem of the Many" fits here too—it makes the view messy.
      *   *Section 3 (Uncomfortable):* Parsimony and Intuition. These are defeasible.
