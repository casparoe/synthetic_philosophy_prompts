  2. A volunteer is given a severe, ten-minute headache so that ten thousand other people can each have five minutes of a mild pleasant sensation, like a warm compress on a cold day. She said no, that's wrong.

  3. A volunteer is given a mild, ten-minute headache so that ten thousand other people can each have five minutes of that same mild pleasant sensation. She said yes, that's fine.

  4. A volunteer is given a mild, ten-minute headache so that five other people can each have five minutes of the mild pleasant sensation. She said no.

  5. A volunteer is given a severe, ten-minute headache so that another person can avoid a severe headache of the same intensity that would otherwise last for a month. She said yes, that's worth it.

