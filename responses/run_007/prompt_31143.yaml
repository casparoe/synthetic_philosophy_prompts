  ### Which Rule Is She Actually Running?

  I believe your sister is operating on **Rule 3: The Justification Asymmetry View.**

  Here is why this is the best reading:

  1.  **The Case 2 vs. Case 5 Contrast:** This is the smoking gun. In Case 2, she rejects causing severe pain for 10,000 people's pleasure. In Case 5, she *accepts* causing severe pain for 1 person's pain avoidance. If she were a simple Lexical Threshold theorist (Rule 2), she might view severe pain as "very bad" but tradable for "very good" things. But her willingness to trade severe pain in Case 5 shows she isn't absolutist about severe pain itself. She is absolutist about the *reason* for inflicting it.
  2.  **The Aggregation Sensitivity:** In Cases 3 and 4, she clearly performs utilitarian calculus (aggregation) for mild experiences. This proves she isn't a general deontologist who rejects trading people. She restricts her calculus only when the *severity* of the harm escalates.
  3.  **Moral Intuition:** This aligns with a common philosophical distinction between **Negative Duties** (do not harm) and **Positive Duties** (help others). We often feel we can cause minor harm to help many (Case 3), and we can cause major harm to prevent catastrophe (Case 5), but causing major harm merely to make people happy (Case 2) feels like a violation of rights, regardless of the happiness generated.

  **Prediction for Case 6:** Based on Rule 3, she will say **NO**. Even 1 billion people does not change the *kind* of benefit from "Pleasure" to "Pain Avoidance."

