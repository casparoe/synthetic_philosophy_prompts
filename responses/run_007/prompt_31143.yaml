  **Rule 2: The Lexical Threshold View (Qualitative Discontinuity)**
  *   **The Principle:** Severe pain and mild pleasure are in *different categories* of value. No amount of mild pleasure can morally justify causing severe pain. They are "incommensurable." However, mild pain and mild pleasure *are* in the same category and can be aggregated (as seen in Cases 3 & 4).
  *   **Fit to Data:**
      *   Explains Case 2: It's not that the math was wrong; it's that the trade is forbidden.
      *   Explains Case 3: Mild trades with mild, so numbers count.
      *   Explains Cases 1 & 5: Preventing pain is a "higher" duty than creating pleasure, or pain-avoidance sits on the "pain scale" where duration/intensity matters more.
  *   **Prediction for Case 6 (1 Billion People):** **NO.**
      *   *Reasoning:* The category error remains. A billion mild pleasures are still mild; they cannot touch the lexical priority of severe suffering.

  **Rule 3: The Justification Asymmetry View (Deontological Hybrid)**
  *   **The Principle:** The *type* of benefit matters as much as the intensity. You may inflict **Mild Pain** for either Pleasure or Pain Avoidance. However, you may only inflict **Severe Pain** to Prevent **Greater Pain**. You cannot inflict Severe Pain merely to Create Pleasure, regardless of intensity or quantity.
  *   **Fit to Data:**
      *   Explains Case 3: Mild Pain for Pleasure is allowed (if numbers suffice).
      *   Explains Case 2: Severe Pain for Pleasure is forbidden (wrong justification).
      *   Explains Case 5: Severe Pain for Pain Avoidance is allowed (right justification).
      *   Explains Case 1: Mild Pain for Pain Avoidance is allowed (right justification + low cost).
  *   **Prediction for Case 6 (1 Billion People):** **NO.**
      *   *Reasoning:* The goal is "Pleasure." The cost is "Severe Pain." This violates the asymmetry rule, regardless of the number of people.

