  ### The Decisive Test Case

  To definitively settle whether she follows **Rule 2 (Lexical Threshold)** or **Rule 3 (Justification Asymmetry)**, you need to test if the blockage is about the *Intensity* of the pleasure or the *Type* of the benefit.

  Both rules predict "No" for Case 6. To distinguish them, you must offer a scenario where the benefit is **Severe** but still **Pleasure**.

  **Ask her this:**

