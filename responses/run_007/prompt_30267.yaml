answer: |-
  This is a classic and formidable objection to the procreation asymmetry (often associated with David Benatar). It is known as the **"Pro-Mortalism Objection."** If the asymmetry implies it's better never to be, does it not also imply it's better to cease to be?

  Your friend's argument is valid (the logic flows), so to stop the conclusion, you must reject a premise. While you fear "special pleading," the standard and most robust philosophical defense is to reject **Step (2)**.

  Here is the breakdown of why Step (2) is the weak link, how to defend rejecting it without arbitrary special pleading, and what that costs you.

  ### The Primary Rejection: Step (2)
  **Claim:** *There's no relevant difference between a person who never comes into existence and a person who stops existing.*

  **Why reject it:**
  This step conflates **potential people** with **actual people**. The procreation asymmetry is grounded in the logic of *interests*.

  1.  **Non-Existent Beings Have No Interests:** A person who is never born does not exist. Therefore, they have no desires, no projects, and no interest in continuing to live. Because they have no interests, they cannot be *harmed* by being deprived of pleasure. (This supports Premise 1).
  2.  **Existing Beings Have Interests:** A person who is already alive has developed psychological continuity, desires, and a stake in their own future. Most existing people have a strong desire to continue living.
  3.  **The Difference:** When you choose not to procreate, you violate no one's interests (because there is no "one"). When you kill an existing person, you violate their interest in continuing to live and frustrate their desires.

  Therefore, the absence of pleasure *is* bad for the person who dies, because that person *wanted* that pleasure. The absence of pleasure is *not* bad for the unborn, because there was no subject to want it.

  **Addressing the "Special Pleading" Fear:**
  It feels like special pleading to say "Birth matters but death doesn't," but it isn't arbitrary if grounded in **moral status**.
  *   **Before existence:** There is no subject of harm. Ethics is largely about how we treat subjects.
  *   **After existence:** There is a subject of harm.
  The "slide" from birth to death ignores the transition from *no subject* to *subject*. Rejecting (2) asserts that the creation of a subject changes the moral landscape fundamentally.

  **The Cost of Rejecting (2):**
  *   **Commitment to "Interests":** You must commit to the view that moral harm requires a subject who is harmed. You cannot hold a purely impersonal view of value (e.g., "Pleasure is good even if no one feels it").
  *   **The "Misery" Exception:** You have to accept that if a person *has no interest in living* (e.g., severe, untreatable suffering where death is preferred), the logic might actually swing back toward permitting death. You lose the absolute prohibition on suicide/euthanasia in extreme cases (which many ethicists are fine with).

  ### The Secondary Rejection: Step (6)
  **Claim:** *If an action has a good aspect and lacks the bad aspect, we ought to do it, all else equal.*

  **Why reject it:**
  Even if you grant your friend Step (2) for the sake of argument, Step (6) is a crude form of consequentialism that ignores **rights and autonomy**.

  *   **Autonomy:** An existing person has a right to self-determination. Painlessly killing them violates their autonomy, regardless of the pleasure/pain calculus.
  *   **The "Good Aspect" Fallacy:** Preventing future pain is only "good" if the subject *wants* to avoid that pain. If the subject wants to endure pain for a greater goal, or simply wants to stay alive despite pain, preventing that pain against their will is not a "good aspect"; it is a violation.

  **The Cost of Rejecting (6):**
  *   **Non-Consequentialism:** You have to admit that consequences (pain/pleasure) aren't the *only* thing that matters. Rights, consent, and autonomy act as side-constraints on action. This complicates your ethical framework but aligns better with most intuitive moral systems.

  ### Summary of the Defense

  To save the asymmetry without accepting pro-mortalism, you should argue this:

  1.  **Reject (2):** The asymmetry applies to the **creation** of interests, not the **satisfaction** of them.
      *   *Never born:* No interests exist. Absence of pain is good (impersonally); absence of pleasure is neutral (no one deprived).
      *   *Death:* Interests exist. Absence of pain is good; absence of pleasure is **bad** (because the existing person is deprived of what they value).
  2.  **Reject (6):** Even if the calculus were neutral, we are not permitted to violate the autonomy of an existing being to satisfy an impersonal good.

  ### What does this cost you?
  You asked what rejecting these steps costs. Here is the price of keeping the asymmetry:

  1.  **You must accept a metaphysical distinction between "Possible" and "Actual" people.** You have to defend the idea that coming into existence creates a moral status that didn't exist before. Some utilitarians find this metaphysically suspicious.
  2.  **You cannot claim life is *always* a harm.** The asymmetry shows that *coming* into existence risks harm without obligation. But once here, life contains goods (satisfaction of interests) that make continuing to live preferable to death for most people. You have to walk the line that "Non-existence is preferable to Existence" (for the potential person) but "Existence is preferable to Death" (for the actual person).
  3.  **You lose the "Pure Numbers" Game.** You cannot simply sum up pain and pleasure across the universe. You have to ask "Who is feeling this?" This makes the ethics more complex than simple hedonic calculus.

  ### Recommendation for the Argument
  Tell your friend:
  > "The asymmetry relies on the distinction between **harming someone** and **not benefiting someone**.
  >
  > 1.  Not birthing a child is 'not benefiting' a non-existent entity (which is neutral).
  > 2.  Killing a child is 'harming' an existent entity (which is bad).
  >
  > Your Step (2) fails because it treats the dead like the unborn. The dead *were* someone with interests. The unborn *never were*. The violation of an existing interest (in Step 5) creates a 'bad aspect' that blocks your conclusion in Step (8)."

  This blocks the slide without denying the core intuition that bringing suffering into the world is worse than withholding pleasure from the void.
