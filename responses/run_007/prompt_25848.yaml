answer: |-
  Your intuition is spot-on. The passage you quoted is a classic example of a popularizer taking a specific, contested philosophical argument (most associated with Alfred Lessing) and presenting it as the "settled view," while simultaneously mischaracterizing two of the philosophers (Goodman and Danto) who are most famous for arguing the *opposite*.

  If you were to walk into a conference on aesthetics today and assert that "philosophers agree preferring originals is irrational," you would start a very lively debate. There is no consensus.

  Here is a breakdown of what is actually settled, what is contested, and where the popular author has gone wrong.

  ### 1. The "Consensus" Claim
  **Verdict: False.**

  There is no philosophical consensus that preferring originals is irrational. In fact, the dominant trend in analytic aesthetics over the last 50 years has been to argue that **provenance and history of production are constitutive of the artwork itself.**

  The view the author describes—that aesthetic value is purely perceptual and that a perfect forgery is aesthetically equal to the original—is known as **Aesthetic Formalism** or **Perceptualism**. While it has defenders, it is arguably the minority view in contemporary philosophy of art.

  ### 2. The Misreading of Goodman and Danto
  **Verdict: Significant Distortion.**

  The author claims Goodman and Danto showed that provenance is "collective make-believe." In reality, both philosophers provided rigorous arguments for why the history of an object matters fundamentally to its identity and value.

  *   **Nelson Goodman (*Languages of Art*, 1968):**
      *   **What he actually argued:** Goodman distinguished between *autographic* arts (like painting, where the history of production matters) and *allographic* arts (like music or literature, where a score or text defines the work). For painting, the history of production is part of the work's identity.
      *   **The "Perfect Forgery" point:** Goodman famously argued that even if a forgery is visually indistinguishable from the original *now*, the fact that there *is* a difference means we must look differently. Knowing one is a forgery trains us to look for subtle differences. Therefore, they are not aesthetically equivalent because the *potential* for perceptual difference exists.
      *   **The Error:** The book uses Goodman to support the idea that history doesn't matter. Goodman used history to prove that it *does* matter.

  *   **Arthur Danto (*The Transfiguration of the Commonplace*, 1981):**
      *   **What he actually argued:** Danto argued that artworks are embodied meanings. Two visually identical things can be different artworks (or one can be art and the other not) based on their historical context and the "artworld" theory that surrounds them.
      *   **The Forgery implication:** For Danto, a forgery is a different artwork than the original, even if they look identical, because they have different "aboutness." A Van Gogh is about Van Gogh's vision and struggle; a Van Meegeren forgery of a Vermeer is about Van Meegeren's deception and skill at mimicry. They express different things.
      *   **The Error:** The book suggests Danto thinks the difference is just "snobbery." Danto would argue the difference is ontological (about the nature of the thing itself).

  ### 3. The Core Debate: Why Do We Value Originals?
  The philosophical literature generally divides into two camps regarding *why* we prefer originals. The popular book presents Camp A as the only rational position, but Camp B is equally robust.

  #### Camp A: The Perceptual View (The Book's Position)
  *   **Proponent:** Alfred Lessing ("Art and the Quality of Art," 1965).
  *   **Argument:** Aesthetic value resides solely in the visual experience. If Object X and Object Y provide the exact same visual experience, they have the exact same aesthetic value.
  *   **On Forgery:** Forgery is a moral crime (lying/fraud), but not an *aesthetic* crime. A perfect forgery is just as "beautiful" as the original.
  *   **Status:** This is the view the popular author is channeling, likely without realizing it is a specific argument by Lessing rather than a general consensus.

  #### Camp B: The Historical/Performance View (The Dominant View)
  *   **Proponents:** Denis Dutton, Kendall Walton, Noel Carroll.
  *   **Argument:** Art is not just an object; it is a **performance** or an **achievement**. We value art partly because of what the artist *did* to create it.
  *   **Denis Dutton ("Artistic Crimes"):** Dutton argues that we value art as a display of human skill and creativity. When we admire a Van Gogh, we are admiring the achievement of creating that image in that historical context. A forgery is a different achievement (the achievement of copying). Therefore, the forgery is aesthetically inferior because it represents a lesser artistic achievement, even if the result looks the same.
  *   **Kendall Walton ("Categories of Art"):** Walton argues that we perceive art through categories (e.g., "Impressionism," "Cubism"). If you think a painting is an original Impressionist work, you see it as "innovative." If you find out it is a 1950s forgery, you might see the same brushstrokes as "derivative" or "kitsch." The aesthetic properties change based on the category, which depends on provenance.
  *   **Status:** This view is widely accepted in contemporary aesthetics. It explains why we don't value a high-resolution photograph of the *Mona Lisa* the same as the *Mona Lisa*, even though the visual experience is similar.

  ### 4. Is the Preference "Irrational"?
  **Verdict: No.**

  The book claims paying more for an original is "irrational." Philosophers generally argue it is **rationally defensible** for several reasons:

  1.  **Epistemic Risk:** "Perfect" forgeries are theoretical. In reality, forgeries usually degrade or reveal themselves over time. Paying for the original is an insurance policy against future re-attribution.
  2.  **Historical Connection:** The original is a relic that was touched by the artist. For many, this has a value similar to a religious relic or a historical document (e.g., the Declaration of Independence). A perfect photocopy of the Declaration is not worth millions; the original is. This isn't snobbery; it's valuing historical causality.
  3.  **Support of the Art Ecosystem:** Buying originals supports living artists and the preservation of culture. Buying forgeries supports criminals.

  ### 5. Is Deception the *Only* Wrong?
  **Verdict: Contested, but mostly "No."**

  The book claims that if a forgery were honestly labeled, there would be nothing left to object to.
  *   **The Legal/Moral View:** Yes, the primary harm is fraud. If you sell a copy as a copy, no crime is committed.
  *   **The Artistic View:** Many philosophers argue forgery corrupts the **historical record**. Art history is a conversation across time. A forgery inserts a fake voice into that conversation. Even if labeled, a museum displaying a forgery as art (rather than as a curiosity) is presenting a false narrative about human creative achievement.
  *   **Example:** If Han van Meegeren's fakes were displayed as "Van Meegeren pretending to be Vermeer," they are fascinating. If they are displayed as "Vermeer," they distort our understanding of the 17th century. The wrong is not just lying to the buyer; it is lying to history.

  ### Summary: Settled vs. Contested

  | Claim | Status in Philosophy | Notes |
  | :--- | :--- | :--- |
  | **"There is a consensus that preferring originals is irrational."** | **False.** | This is the book's biggest error. It is a live, vigorous debate. |
  | **"Goodman and Danto argue provenance doesn't matter."** | **False.** | Both argue provenance is constitutive of the artwork's identity. |
  | **"Aesthetic value is purely visual/perceptual."** | **Contested.** | This is the Formalist view (Lessing). It is opposed by Contextualists (Walton, Danto, Dutton). |
  | **"Forgery is only wrong because of deception."** | **Contested.** | Most agree deception is the *legal* wrong, but many argue there is an *artistic* wrong (corrupting the record/achievement). |
  | **"Perfect forgeries are aesthetically identical to originals."** | **Contested.** | Walton and Goodman argue that knowing the history changes the aesthetic properties (e.g., from "bold" to "imitative"). |

  ### Conclusion for the Reader

  The author of the book you are reading has likely taken **Alfred Lessing's 1965 argument** and presented it as the modern consensus, while name-dropping **Goodman and Danto** to lend authority, despite the fact that Goodman and Danto largely undermine Lessing's conclusion.

  A philosopher working on this topic would tell you:
  1.  **Your preference for originals is not irrational.** It is grounded in valid theories about artistic achievement, historical connection, and the nature of aesthetic categories.
  2.  **Provenance is not just "make-believe."** It is part of the work's identity.
  3.  **Forgery damages more than just wallets.** It damages our understanding of art history and human creativity.

  The book offers a good story, but on the philosophy, it is offering a "just-so story" that simplifies a complex metaphysical problem into a moral lesson about snobbery. You are right to feel that it was too tidy.
