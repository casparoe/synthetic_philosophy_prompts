prompt: |-
  I've been reading a popular book on art forgery — one of those narrative nonfiction page-turners that moves through the big scandals (Van Meegeren, Elmyr de Hory, the Knoedler fakes) and then tries to draw some philosophical morals. In the chapter that steps back to ask what's really wrong with a forgery, the author offers what he presents as the settled philosophical view. He writes something to the effect of:

  "The philosophical consensus on forgery is that our preference for originals over perfect forgeries is irrational. If two paintings are visually identical, then any pleasure or aesthetic experience you get from one you could get from the other, so paying millions more for the original is just snobbery dressed up as connoisseurship. Philosophers like Arthur Danto and Nelson Goodman have shown that the artworld's obsession with provenance is a kind of collective make-believe: we treat the original as special because we've been told it's a Vermeer, not because there's any real difference in the object itself. The only thing genuinely wrong with forgery is the deception — if a forgery were honestly labeled as such, there would be nothing left to object to."

  Something about this feels too tidy to me. I know there's a substantial philosophical literature on forgery and the value of originals, and I suspect the author is collapsing distinctions that matter — maybe between aesthetic value and artistic value, or between different kinds of forgery, or between what Danto and Goodman actually argued and what the author says they showed. But I don't know the literature well enough to pinpoint where the summary goes wrong. Could you go through it and tell me what a philosopher working on this topic would accept, what they'd push back on, and whether the conclusion — that our preference for originals is irrational — follows from anything accurate in the summary? And please separate what's settled from what's genuinely contested among people who know the topic; I don't want to come away thinking there's a consensus where there isn't one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Source Material:** A popular nonfiction book on art forgery (narrative style).
      *   **The Claim:** The book asserts a "philosophical consensus" that preferring originals over perfect forgeries is irrational/snobbish. It cites Danto and Goodman as supporting this. It claims the *only* wrong with forgery is deception.
      *   **User's Intuition:** Something feels "too tidy." Suspects collapsing of distinctions (aesthetic vs. artistic value, etc.) and misrepresentation of Danto/Goodman.
      *   **Task:** Evaluate the claim from the perspective of a philosopher of art. Identify what is accepted, what is contested, and whether the conclusion follows. Separate settled matters from genuine debates.
      *   **Goal:** Provide a nuanced, accurate overview of the philosophical literature on forgery without oversimplifying.

  2.  **Initial Assessment of the Book's Claim:**
      *   *Is there a consensus?* No. This is a classic debate in aesthetics.
      *   *Did Danto and Goodman say this?* Not exactly. They are often cited in this context, but their views are more nuanced and sometimes support the *opposite* conclusion (that history/provenance matters constitutively).
      *   *Is the preference irrational?* This is the core philosophical question. Many philosophers argue it is *rational* because art isn't just about visual qualia.
      *   *Is deception the only wrong?* Most philosophers of art would say no. Forgery violates artistic achievement, historical record, and the nature of art itself.

  3.  **Deconstruct the Philosophical Landscape:**

      *   **Nelson Goodman (*Languages of Art*):**
          *   *Key Concept:* Autographic vs. Allographic arts. Painting is autographic; history of production matters.
          *   *The "Perfect Forgery" Thought Experiment:* Goodman argues that even if we *can't* tell the difference now, the fact that there *is* a difference (one is the original, one isn't) means they are aesthetically different because knowing the difference changes how we look.
          *   *Verdict on Book's Claim:* The book gets Goodman mostly wrong. Goodman argues *for* the importance of provenance, not against it.

      *   **Arthur Danto (*The Transfiguration of the Commonplace*):**
          *   *Key Concept:* Artworld, theory, history. An artwork is more than a physical object; it's embodied meaning.
          *   *Indiscernibles:* Two visually identical things can be different artworks (e.g., Warhol's *Brillo Boxes* vs. actual Brillo boxes).
          *   *Verdict on Book's Claim:* Danto would likely argue that the *history of making* is part of the artwork's identity. A forgery has a different artistic identity than the original, even if they look alike.

      *   **Alfred Lessing ("Art and the Quality of Art"):**
          *   *Key Concept:* The "Lessing View." This is likely what the popular author is actually channeling. Lessing argued that aesthetic value is purely perceptual. If it looks the same, it *is* aesthetically the same. Forgery is only morally wrong (lying), not aesthetically inferior.
          *   *Verdict:* This is the view the book attributes to the "consensus," but it's actually a specific, contested minority view.

      *   **Denis Dutton ("Artistic Crimes"):**
          *   *Key Concept:* Performance theory of art. We value art as a performance of human skill/achievement. A forgery is a different performance (forging a Van Gogh vs. creating a Van Gogh).
          *   *Verdict:* Strong argument against the book's claim.

      *   **Kendall Walton ("Categories of Art"):**
          *   *Key Concept:* We perceive art through categories (e.g., "Cubism," "Impressionism"). Knowing something is a forgery changes the category, which changes the aesthetic properties (e.g., what looks "bold" in an original might look "derivative" in a forgery).
          *   *Verdict:* Undermines the idea that visual identity = aesthetic identity.

  4.  **Structure the Response:**

      *   **Introduction:** Validate the user's intuition. State clearly: There is no consensus. The book is likely simplifying Alfred Lessing's view and misreading Goodman/Danto.
      *   **The "Consensus" Claim:** Debunk this immediately. It's a live debate.
      *   **The Goodman/Danto Misreading:** Explain what they actually argued (provenance matters constitutively).
      *   **The Core Debate (Aesthetic vs. Artistic Value):**
          *   *The Formalist/Perceptual View (Lessing):* What the book describes.
          *   *The Historical/Contextual View (Goodman, Walton, Dutton):* Why history matters to the experience.
      *   **The "Deception Only" Claim:** Address the ethical/artistic wrongness beyond lying.
      *   **Summary of Settled vs. Contested:** Create a clear table or list for the user.
      *   **Conclusion:** Reiterate that the preference for originals is defensible philosophically.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining Goodman:* Make sure to mention his distinction between autographic and allographic. Emphasize his point that "looking the same" isn't enough if the history of production is part of the identity.
      *   *Refining Danto:* Focus on the "artworld" and how meaning is constituted by history. A forgery has different meaning (it's about the original artist) than the original (it's about the artist's vision).
      *   *Refining Walton:* This is crucial for the "aesthetic experience" point. If I know it's a forgery, I see it as "imitative" rather than "innovative." That changes the aesthetic property.
      *   *Refining Dutton:* The "achievement" argument. We admire the *feat*. A forgery is a feat of copying, not a feat of original creation.
