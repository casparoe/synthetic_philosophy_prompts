  2.  **Deconstruct the Positions:**
      *   *Knowledge Norm (KN):* Assert $p$ only if you know $p$. (Williamson)
      *   *Truth Norm (TN):* Assert $p$ only if $p$ is true. (Weiner)
      *   *Belief Norm (BN):* Assert $p$ only if you believe $p$. (Bach)
      *   *Reasonable Belief/Justification Norm (RN):* Assert $p$ only if it is reasonable for you to believe $p$ (or you have justification). (Douven, Lackey)
      *   *Conversational/No Special Norm (CN):* Assertion is governed by general Gricean maxims or social norms, no specific epistemic rule. (Pagin, some contextualists)

  3.  **Drafting the Questions (incorporating required cases):**

      *   *Q1: Lottery.* (Required)
          *   Scenario: Draw happened, haven't checked. Odds 1 in a million. Assert "I lost."
          *   KN: No (don't know).
          *   TN: Yes (likely true).
          *   BN: Yes (likely believe).
          *   RN: Yes (highly justified).
          *   CN: Yes (informative).
          *   *Separates:* KN from almost everyone else.

      *   *Q2: Teacher/Evolution.* (Required)
          *   Scenario: Teacher doesn't believe evolution, teaches it anyway. Asserts "Humans evolved..."
          *   KN: No (doesn't know/believe).
          *   TN: Yes (true).
          *   BN: No (doesn't believe).
          *   RN: Yes (professionally justified).
          *   CN: Yes (pedagogically appropriate).
          *   *Separates:* BN from TN/RN/CN. KN is tricky (does she know? Usually assumed no if she doesn't believe). Let's assume she lacks knowledge due to lack of belief.

      *   *Q3: Moore-Paradox.* (Required)
          *   Scenario: "It's raining but I don't know it." (While looking out window at rain).
          *   KN: No (violates norm explicitly).
          *   TN: Yes (conjunct is true).
          *   BN: No (can't believe the conjunction).
          *   RN: No (unreasonable to believe conjunction).
          *   CN: No (misleading/odd).
          *   *Separates:* TN from others (mostly).

      *   *Q4: Lucky Guess.* (Required)
          *   Scenario: No evidence, just hunch. Asserts "The meeting is at 3." Turns out true.
          *   KN: No.
          *   TN: Yes.
          *   BN: Yes (if they believed the hunch).
          *   RN: No.
          *   CN: Maybe (depends on utility).
          *   *Separates:* TN/BN from KN/RN.

      *   *Q5: Stopped Clock.* (Required)
          *   Scenario: Look at clock, it's right time, but clock stopped 12h ago. Assert "It's 2pm."
          *   KN: No.
          *   TN: Yes.
          *   BN: Yes.
