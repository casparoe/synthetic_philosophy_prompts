answer: |-
  # Handout: Mapping the Logical Space of Thought Experiments
  **Workshop on Philosophical Methodology**

  ## I. The Taxonomy Tree

  This taxonomy classifies positions on the epistemic status of thought experiments based on specific commitments regarding their *mechanism of justification* and their *primary mode of failure*. Answer the branching questions sequentially to locate a position.

  **ROOT QUESTION:** When a philosopher accepts the conclusion of a thought experiment, is this acceptance primarily driven by a **phenomenological 'seeming' (intuition)** triggered by the scenario, or by a **judgment of truth** about a described counterfactual situation using ordinary cognitive capacities?

  *   **BRANCH A: Intuition-Driven** (The force comes from a *sui generis* intuitive response.)
      *   **Q1:** Is the source of this intuition **conceptual competence** (grasping meanings/relations) or **modal imagination** (simulating possibilities via conceivability)?
          *   **Path A1 (Conceptual Competence):**
              *   **Q2:** Is this intuitive faculty **robust** against irrelevant framing, ordering, and affective loading, or is it **sensitive** to such variations?
                  *   **Leaf 1: Classical Rationalism** (Robust)
                  *   **Leaf 2: Experimentalist Skepticism** (Sensitive)
          *   **Path A2 (Modal Imagination):**
              *   **Q3:** Does the position claim that **conceivability entails metaphysical possibility**, or merely that it provides defeasible evidence?
                  *   **Leaf 3: Modal Rationalism** (Entailment)
                  *   **Leaf 4: Modal Fallibilism** (Defeasible Evidence)
              *   *(Note: If one holds Conceivability provides **no** evidence due to framing manipulation, see Leaf 2 or Leaf 5)*
                  *   **Leaf 5: Intuition Pump Critique** (Seduction via Framing)

  *   **BRANCH B: Judgment-Driven** (The force comes from evaluating a claim using ordinary reasoning.)
      *   **Q4:** Does the inference from the scenario to the conclusion require supplying **tacit theoretical premises** not explicitly stated in the setup?
          *   **Path B1 (Yes, Tacit Premises Required):**
              *   **Q5:** Are these suppressed premises **controversial theoretical commitments** or **shared background knowledge**?
                  *   **Leaf 6: The Argument View** (Theoretical Commitments)
                  *   **Leaf 7: [Unoccupied]** (Shared Background Knowledge)
          *   **Path B2 (No, Direct Evaluation):**
              *   **Q6:** Does the scenario provide **sufficient causal detail** to determine the outcome, or does it **suppress relevant contextual factors**?
                  *   **Leaf 8: The Counterfactual View** (Sufficient Detail)
                  *   **Leaf 9: Contextualist Critique** (Suppresses Factors)
                  *   **Leaf 10: [Unoccupied]** (Insufficient Detail but Reliable Anyway)

  ---

  ## II. Position Descriptions & Test Cases

  **Leaf 1: Classical Rationalism**
  *   **Commitment:** Intuitions arising from conceptual competence are stable and justify necessary truths.
  *   **Test Case:** **Thomson's Violinist.** The intuition that you may unplug is a stable deliverance of conceptual competence regarding rights, unaffected by how the story is told.
  *   **Proponents:** George Bealer, early Frank Jackson.

  **Leaf 2: Experimentalist Skepticism**
  *   **Commitment:** Intuitive seemings vary across demographics/cultures and are unreliable guides to truth.
  *   **Test Case:** **The Gettier Case.** Judgments about whether the subject "knows" vary by culture, suggesting the intuition is not a universal guide to the concept of knowledge.
  *   **Proponents:** Jonathan Weinberg, Shaun Nichols, Stephen Stich.

  **Leaf 3: Modal Rationalism**
  *   **Commitment:** Ideal positive conceivability entails metaphysical possibility; thought experiments map modal space.
  *   **Test Case:** **Chalmers's Zombies.** If a physical duplicate without consciousness is conceivable, it is metaphysically possible, refuting physicalism.
  *   **Proponents:** David Chalmers, Frank Jackson (later work).

  **Leaf 4: Modal Fallibilism**
  *   **Commitment:** Conceivability provides evidence for possibility but does not guarantee it; errors arise from confusion.
  *   **Test Case:** **Kripke's Heat.** We can conceive of heat without molecular motion, but this does not make it possible; the intuition is evidential but defeasible.
  *   **Proponents:** Stephen Yablo, Peter Kung.

  **Leaf 5: Intuition Pump Critique**
  *   **Commitment:** Thought experiments often function rhetorically to bypass reflection via affective framing rather than providing warrant.
  *   **Test Case:** **Searle's Chinese Room.** The vivid imagery of a man shuffling cards seduces us into ignoring the systemic nature of understanding.
  *   **Proponents:** Daniel Dennett, Kathleen Wilkes.

  **Leaf 6: The Argument View**
  *   **Commitment:** Thought experiments are merely arguments with suppressed premises; the scenario itself adds no epistemic value.
  *   **Test Case:** **Searle's Chinese Room.** The conclusion follows only if one accepts the tacit premise that "syntax is not sufficient for semantics," which is the real point of contention.
  *   **Proponents:** John Norton.

  **Leaf 7: [Unoccupied] Naive Common-Sense Argumentism**
  *   **Commitment:** Thought experiments are arguments, but the suppressed premises are uncontroversial common sense, not theory.
  *   **Status:** **Unattractive.** Rarely defended because philosophical thought experiments usually target controversial theoretical boundaries where common sense is insufficient.

  **Leaf 8: The Counterfactual View**
  *   **Commitment:** Thought exercises test our ordinary capacity to evaluate counterfactuals; no special intuition faculty is needed.
  *   **Test Case:** **Gettier Cases.** We judge "If the case were as described, the subject would not know" using the same capacity used to judge everyday counterfactuals.
  *   **Proponents:** Timothy Williamson.

  **Leaf 9: Contextualist Critique**
  *   **Commitment:** Thought experiments strip away too much causal context, making the judgment underdetermined or inapplicable to the real world.
  *   **Test Case:** **The Trolley Problem.** Removing real-world emotional and social context renders the judgment irrelevant to actual moral reasoning.
  *   **Proponents:** Margaret Urban Walker, Bioethics Particularists.

  **Leaf 10: [Unoccupied] Underdetermined Reliabilism**
  *   **Commitment:** Scenarios lack sufficient detail to determine an outcome, yet our judgments remain reliable.
  *   **Status:** **Incoherent.** If the detail is insufficient to determine the truth, it is unclear what mechanism ensures reliability without collapsing into Leaf 1 (Intuition).

  ---

  ## III. Instructor's Meta-Analysis (For Workshop Discussion)

  *This section highlights limitations in the taxonomy to encourage critical engagement.*

  ### 1. Indistinguishable Positions
  **The Problem:** **The Argument View (Leaf 6)** and **The Counterfactual View (Leaf 8)** may be difficult to separate using the current branching questions. Both reject *sui generis* intuition (Branch B) and both claim to use ordinary cognitive capacities. Norton (Argument) might claim Williamson (Counterfactual) is just describing an argument with a suppressed conditional premise.
  **How to Prise Them Apart:** Ask: *"Is the conclusion derived via **deductive validity** from reconstructed premises (Norton), or is it a **non-inferential judgment** of a counterfactual conditional that serves as a premise for further theory (Williamson)?"* Williamson insists the judgment itself is the evidence; Norton insists the judgment must be reconstructed into a valid argument to be evidence.

  ### 2. Logically Possible but Unoccupied Combinations
  **The Problem:** **Leaf 7 (Tacit Premises + Common Sense)** is largely empty.
  **Why?** It is **unattractive**. If the suppressed premises were truly shared common sense, the philosophical debate surrounding the thought experiment (e.g., Chinese Room, Trolley) would not be so intractable. The existence of persistent disagreement suggests the tacit premises are theory-laden (Leaf 6).
  **The Problem:** **Leaf 10 (Insufficient Detail + Reliable)** is empty.
  **Why?** It appears **incoherent**. Reliability typically requires a mechanism tracking truth. If the scenario lacks the causal detail required to determine the truth (the definition of the branch), positing a reliable judgment mechanism without appealing to *sui generis* intuition (which would move it to Branch A) is difficult to motivate.

  ### 3. Diagnostic Utility
  This taxonomy is not merely descriptive; it is an argument about **where the burden of proof lies**.
  *   If you are on **Branch A**, you must defend the reliability of a specific cognitive faculty against empirical challenge.
  *   If you are on **Branch B**, you must defend the sufficiency of the scenario's description against charges of underdetermination or hidden theory.
  *   **Workshop Task:** Ask students to place *themselves* on the tree. If they find they cannot answer a branching question without knowing their own view, ask them *why* that distinction feels opaque to them. That opacity often reveals a deeper methodological commitment.
