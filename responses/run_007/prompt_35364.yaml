  - A crystal growing in solution: not alive
  - A mule: alive
  - A person who's brain-dead but on a ventilator: alive
  - A seed sitting in a seed bank, still viable after 30 years: alive
  - A self-replicating RNA molecule in a test tube (the kind they use in origin-of-life experiments): not alive
  - A red blood cell: not alive

  I'm about to ask her about a mitochondrion — you know, the organelle that used to be a free-living bacterium, has its own DNA, runs its own metabolism, and divides by fission inside the cell, but can't survive outside it anymore.

