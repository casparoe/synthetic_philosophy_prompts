          *   Language: British English (e.g., "colour," "defence," "programme," "analyse").

  2.  **Deconstruct the Argument:**
      *   *Premise 1:* Thought experiments rely on eliciting intuitions.
      *   *Premise 2:* Intuitions are susceptible to framing effects, emotional priming, and narrative bias (psychological evidence).
      *   *Premise 3:* Philosophical methodology often treats these intuitions as data points equivalent to empirical observations.
      *   *Conclusion:* Therefore, the evidentiary basis of much analytic philosophy is unstable compared to natural science.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Acknowledge the user's background (bridge the gap between biochemistry and philosophy).
          *   State the thesis clearly: Intuition pumps are rhetorical devices, not logical proofs.
          *   Set the tone: Critical but constructive (not fatal, but serious).

      *   **The Mechanism of Persuasion (Narrative & Affect):**
          *   Focus on *how* they work. It's not just the logic; it's the story.
          *   *Example:* The Trolley Problem. Contrast the Switch vs. the Footbridge. Logically similar (1 dies, 5 live), but emotionally distinct (personal force, up-close violence).
          *   *Psychological angle:* Mention Haidt or Kahneman (System 1 vs. System 2). The "yuck factor."
          *   *Example:* The Chinese Room. Is it the logic of syntax vs. semantics, or the vivid image of a man shuffling cards in a room?

      *   **Epistemic Irrelevance and Framing:**
          *   Discuss "irrelevant details." In science, you control variables. In philosophy, the "flavour text" often drives the intuition.
