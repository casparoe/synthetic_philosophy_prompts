      *   **Core Thesis to Argue:** Intuition pumps (thought experiments) persuade primarily through narrative/affective mechanisms (framing, emotion, vividness, ordering) rather than rational evaluation of the hypothetical case. This is a serious epistemic problem for philosophy.
      *   **Requirements:**
          *   Argue *for* the user's position (support the scepticism).
