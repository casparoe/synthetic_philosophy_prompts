      *   **The Counterarguments (Steel-manning):**
          *   *Argument 1: Controlled Experiments.* Philosophers claim they isolate variables like scientists.
          *   *Rebuttal:* Scientists calibrate instruments; philosophers calibrate nothing. Inter-subjective agreement is low (expert disagreement).
          *   *Argument 2: Conceptual Truths.* Intuitions track modal facts or conceptual boundaries.
