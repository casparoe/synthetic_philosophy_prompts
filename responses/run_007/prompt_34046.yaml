answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who has wrestled with the Principal Principle as deeply as you have. It is entirely fitting that a physicist should find the philosophy of probability both inviting and infuriating; after all, you folks invented the formalism that keeps the philosophers employed. Your confusion is not a sign of misunderstanding but rather of honesty, for you have stumbled upon the very fissures that David Lewis himself spent the last years of his life trying to patch. The Principal Principle, in its original formulation, is indeed seductive in its simplicity, but as you have noticed, the notion of admissibility is the ghost in the machine. You are looking for a principle that sorts your evidence into the admissible and the inadmissible without leaving contradictions in its wake. I believe we can construct such a principle, though it will require us to refine some of your verdicts and adopt a slightly more sophisticated version of the principle than the one you first encountered.

  Let us begin by articulating a working definition of admissibility that respects your intuitions in the clear cases. The core idea, which we might call the Principle of Informational Mediation, is this: evidence is admissible relative to a chance claim if and only if any information that evidence provides about the outcome is fully mediated by the chance value itself. In other words, admissible evidence tells you about the setup, the history, or the laws, but it does not peek behind the curtain to tell you the result by any shortcut. This handles your first three cases elegantly. In the standard fair coin flip, your evidence is just the setup, so the chance mediates everything, and your credence matches the chance. When the coin was flipped an hour ago, the outcome is metaphysically settled, but epistemically hidden from you. Your evidence is merely that a flip occurred, not what the result was. The chance of heads at the time of the flip remains the only bridge between your evidence and the outcome, so your credence stays at one half. This aligns with your second case. Then comes the crystal ball. Here, the evidence bypasses the chance process entirely; the crystal ball does not tell you about the coin's bias or the laws of physics, it tells you the outcome directly. The chance value no longer screens off the evidence from the outcome, so the evidence is inadmissible, and your credence should shift to near one. This matches your third case perfectly.

  However, things become stickier with your fourth case, the hundred heads in a row. Here I must gently suggest that your intuition is leading you astray, or at least conflating two different states of knowledge. You stipulate that the coin is fair by construction and that you know this. If you truly know the objective chance is one half, then the outcomes are probabilistically independent. The history of previous flips is admissible evidence—it is just history—but because the chance is fixed at one half, that history is irrelevant to the next flip. If you raise your credence above one half, you are effectively saying that you no longer believe the chance is one half. You are treating the chance as an unknown parameter to be estimated from frequency rather than a known fact derived from construction. To save the Principal Principle here, you must revise this verdict: if the chance is known to be one half, your credence must remain one half, regardless of the streak. If your credence rises, you are admitting that your evidence has undermined your certainty about the chance claim itself, which is a different operation than applying the Principal Principle to a fixed chance.

  This distinction helps us navigate your fifth and sixth cases regarding the radioactive atom. In the fifth case, where the hour has passed but you haven't checked the detector, your situation is identical to the past coin flip. The event is settled, but your evidence is merely that time has passed, not what the detector registered. The chance function at the start of the hour still mediates your uncertainty, so a credence of one half is correct. But in the sixth case, the oracle changes everything. The oracle's testimony is not mediated by the chance of decay; it is a direct report on the truth value of the proposition. This violates the Principle of Informational Mediation. The difference between the oracle and the passing of time is that the passing of time is part of the historical record up to the present, whereas the oracle's statement is information about the outcome that bypasses the probabilistic laws. You are right to feel that both give information about what happens, but admissibility is not about whether the information concerns the outcome, but about how that information was acquired. If the information comes via the chance process (or lack thereof, in the case of settled history you haven't seen), it is admissible. If it comes via a channel that ignores the chance process, it is inadmissible.

  Now we arrive at your seventh case, the undermining future, and here I must validate your feeling that something has to break. This is the famous "Big Bad Bug" that Lewis identified. If the laws of nature plus the present state entail that E does not happen, then the objective chance of E cannot be 0.7, because chances must respect the laws. If the chance is 0.7, the laws cannot entail not-E. The contradiction arises because the Original Principal Principle assumes that chance propositions are compatible with any admissible evidence, but in a Humean world, the future can undermine the present chance claims. To resolve this, you cannot keep the Original Principal Principle intact. You must adopt what Lewis called the New Principle. The New Principle modifies the conditioning statement. Instead of setting your credence in A conditional on the chance of A being x, you set your credence in A conditional on the chance of A being x AND the proposition that the chance function is what you think it is. In practice, this means acknowledging that when you learn the chance is 0.7, you are also learning that the future does not undermine that chance. This requires a slight revision to your expectation in Case seven: you cannot coherently believe both that the chance is 0.7 and that the laws entail not-E. If you accept the chance claim, you must accept that the laws do not entail not-E. The New Principle saves the connection between chance and credence by making it conditional on the consistency of the chance function itself.

  Finally, let us apply this mediated information account to your new case of the ten coins. You know the chance of heads for the tenth coin is one half. You also know that nine other coins were flipped and landed heads. The crucial question is whether the coins are independent. If you know the chance is one half by construction for each coin individually, then the outcomes are independent. The results of the nine coins are admissible historical evidence, but because the chance is fixed and known, that evidence is screened off. Your credence in the tenth coin should remain one half. However, if your knowledge of the chance being one half was itself derived from the assumption that the coins are similar and you are uncertain about their bias, then the nine heads would update your belief about the bias, and your credence would rise. But since you stated explicitly that you know the chance is one half, you are committed to independence. To raise your credence would be to fall into the same trap as the hundred-heads coin flip; you would be treating the chance as uncertain when you stipulated it was known. Therefore, the principle dictates a credence of one half, because the other coins provide no information about the tenth coin that is not already mediated by the known chance value.

  In summary, the account that best captures your valid intuitions while correcting the problematic ones is the Principle of Informational Mediation coupled with the New Principle for undermining cases. This requires you to revise your verdict on the hundred-heads coin and the ten-coin scenario if you insist on maintaining that the chance is known rather than estimated. It also requires you to accept that the undermining future case dissolves once you realize the chance claim and the entailment claim are incompatible. It is a heavy price to pay for precision, but then again, you know better than anyone that nature rarely offers us a clean equation without a few boundary conditions. I hope this helps you rest easier in your retirement, though I suspect the probabilities will keep you awake all the same.

  Warmly,

  Your Philosophical Correspondent
