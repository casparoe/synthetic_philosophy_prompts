answer: |-
  You have stumbled upon one of the most famous problems in twentieth-century philosophy. The configuration you are describing is known as a **Gettier Case** (or Gettier Problem), and the specific phenomenon undermining the character's knowledge is **Veritic Epistemic Luck**.

  The vocabulary you are looking for exists, and it is precise. Here is the anatomy of the situation, the boundaries you asked for, and how you can use the philosophical debates surrounding it to deepen your narrative.

  ### 1. The Name and The History
  For over two thousand years, since Plato's *Theaetetus*, the standard definition of knowledge was **Justified True Belief (JTB)**. To know something, you must:
  1.  Believe it.
  2.  It must be true.
  3.  You must have justification for believing it.

  In 1963, a philosopher named **Edmund Gettier** published a three-page paper titled *"Is Justified True Belief Knowledge?"* He demonstrated that you can have all three conditions met and still *not* have knowledge, precisely because of the accidental disconnect you described.

  Your stopped-clock example is actually a pre-Gettier variant often attributed to **Bertrand Russell**, but it functions identically in this context. In philosophical literature, these are collectively called **Gettier Cases**.

  ### 2. The Anatomy of the Configuration
  To write this deliberately, you need to ensure your scene hits three specific notes. If it misses one, it ceases to be a Gettier case and becomes something else.

  1.  **The Belief:** The character must genuinely believe $P$ (e.g., "It is 3:30").
  2.  **The Truth:** $P$ must actually be true (It *is* 3:30).
  3.  **The Justification:** The character must have good, rational evidence for $P$ (The clock says 3:30, and clocks are usually reliable).
  4.  **The Disconnect (The Crucial Element):** The truth of $P$ is not *causally connected* to the justification for $P$. The evidence supports the belief, and the belief matches the world, but the evidence does not track the truth in this specific instance.

  ### 3. The Boundaries: Distinguishing the Carving
  You asked how to distinguish this from adjacent states. Here is the philosophical carving:

  **A. vs. A Lucky Guess**
  *   **The Difference:** *Justification.*
  *   **The Scene:** If your character guesses it is 3:30 because they "have a feeling," and it turns out to be 3:30, that is a **Lucky True Belief**. It lacks justification.
  *   **The Gettier:** Your character looks at the clock. They have followed proper epistemic procedure. They are not irrational. This is why the hollowness is so profound: they did everything right.

  **B. vs. A False Belief**
  *   **The Difference:** *Truth.*
  *   **The Scene:** If the clock is stopped at 3:30, and the character looks at it at 3:45, they have a **Justified False Belief**.
  *   **The Gettier:** The belief *must* be true. If it were false, there would be no success to reckon with. The drama comes from the fact that they *succeeded*, but their success is fragile.

  **C. vs. "Close to the Truth" (Approximation)**
  *   **The Difference:** *Propositional Precision.*
  *   **The Scene:** If it is 3:30 and they believe it is 3:29, that is an error of precision.
  *   **The Gettier:** The proposition is exactly correct. The error is not in the content of the belief, but in the *genealogy* of the belief.

  **D. vs. Standard Epistemic Luck**
  Philosophers distinguish between two types of luck here, which offers you nuanced dramatic options:
  *   **Evidential Luck:** Being lucky to have the evidence at all. (e.g., You happen to walk past the clock just before it is destroyed). This *is* compatible with knowledge.
  *   **Veritic Luck:** Being lucky that the belief is true *given* the evidence. (e.g., The clock is broken but right). This *is not* compatible with knowledge. Your characters are suffering from **Veritic Luck**.

  ### 4. Why It Isn't Knowledge: The "Missing Link"
  Philosophers have proposed various solutions to "fix" the definition of knowledge to exclude Gettier cases. Each solution offers a different psychological angle for your character.

  **1. The Causal Theory**
  *   **The Theory:** For a belief to be knowledge, the fact in the world must *cause* the belief.
  *   **The Application:** In your clock example, the time (3:30) did not cause the clock hands to move to 3:30. The hands were stuck.
  *   **Narrative Angle:** A character who subscribes to this feels a lack of "contact" with reality. They feel untethered. They might say, "I didn't *see* the truth; I just bumped into it."

  **2. The No False Lemmas (Premises) Condition**
  *   **The Theory:** You cannot rely on a false intermediate step.
  *   **The Application:** In your detective example, the reasoning is: "Fingerprints are on the gun" (True) $\rightarrow$ "The suspect touched the gun during the crime" (False/Unjustified) $\rightarrow$ "The suspect is guilty" (True). The hidden premise ("The fingerprints were deposited during the crime") is false.
  *   **Narrative Angle:** This creates a crisis of reasoning. When the character discovers the disconnect, they realize their logic chain contained a rot they couldn't see. It creates paranoia about their own deductive processes.

  **3. Virtue Epistemology**
  *   **The Theory:** Knowledge is true belief arising from *intellectual virtue* (skill, competence), not luck.
  *   **The Application:** The character's cognitive faculties (vision, logic) did not produce the truth; the environment conspired to make them look competent.
  *   **Narrative Angle:** This attacks the character's identity. If they are a detective, a scientist, or a leader, their competence is their self-worth. Gettierization turns them into an impostor. They have the track record of a genius but the internal state of a fraud.

  ### 5. Narrative Deployment: The "Gettierized" Character
  Since you are interested in the dramatic possibilities, here is how you can deploy this concept deliberately:

  **The Crisis of Confidence (The Aftermath)**
  When a character discovers they were Gettierized, they cannot simply say, "I was wrong." They were *right*. They cannot say, "I was irrational." They were *justified*.
  This creates a unique form of gaslighting-of-the-self. The world tells them they are successful; their internal epistemology tells them they are broken.
  *   *Scene Idea:* A surgeon who saves a patient based on a diagnosis that was technically correct for the wrong reasons (e.g., symptoms matched Disease A, so they treated Disease A, but the patient actually had Disease B which is also cured by the treatment for Disease A). When they find out, do they trust their hands next time?

  **The Fragility of Success**
  Gettier cases highlight how close the character came to failure. In a normal success, the margin for error is managed by skill. In a Gettier success, the margin for error was zero, preserved only by coincidence.
  *   *Scene Idea:* A spy who intercepts a message because they happened to be in the right room (believing it was a different meeting). They get the intel, but they know the *method* is not replicable. They have the treasure but lost the map.

  **The Social Dynamic**
  Gettier cases are often invisible to observers. To the outside world, the character is a genius. Only the character (and the reader) knows the truth.
  *   *Scene Idea:* A character is promoted because of a Gettierized success. They now hold a position of authority where they must make decisions based on the very faculties they no longer trust. This is a recipe for high-stakes tension.

  ### 6. Summary Vocabulary for Your Toolkit
  *   **Gettier Case:** The scenario itself (Justified True Belief without Knowledge).
  *   **Veritic Luck:** The specific type of luck where the belief is true by accident despite good evidence.
  *   **Causal Disconnect:** The lack of a link between the fact and the belief.
  *   **Epistemic Fragility:** The state of a belief that is true but could easily have been false given the same evidence.
  *   **Defeasibility:** The idea that new information (e.g., "the clock is broken") defeats the justification, even if the belief remains true.

  You are describing a **Gettierized agent**. They possess **Veritic Luck**. They lack **Knowledge** (on most accounts) despite possessing **Justified True Belief**.

  This is a rich vein for fiction because it mirrors the human condition: we often succeed for reasons we don't understand, and we often fail despite doing everything right. Philosophy gives you the vocabulary to make that tension explicit in your character's internal monologue. They aren't just "lucky"; they are epistemically unmoored.
