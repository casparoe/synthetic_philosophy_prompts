prompt: |-
  I'm on the board of my neighborhood association, and we're rewriting our bylaws. The big fight is over who gets to vote on the budget and rules. Right now only property owners within the official boundaries vote, but we've got renters who've lived here 15 years, and we've got owners who live three states away and just collect checks. Some people want to expand the vote to renters, others want to restrict it to owner-occupants only. But here's what's been bugging me: every time we try to settle this by voting on it, we're already assuming a particular answer to who the voters should be. Like, if we let the current voters decide who gets to be a voter, of course they're gonna pick whoever benefits them. But there's no neutral way to step outside that circle and decide from nowhere. I keep going in circles on this (no pun intended). Is there a principled way out, or is this just a power struggle dressed up as a procedural question? Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Neighborhood association board member rewriting bylaws.
      *   **Core Conflict:** Who gets to vote? (Current: Property owners within boundaries. Proposals: Include renters? Restrict to owner-occupants?)
      *   **The Philosophical Dilemma:** The "Boundary Problem" (or *demos* problem). Deciding *who* decides requires a decision by *someone*. If current voters decide, it's self-serving. If non-voters decide, they lack authority. There seems to be no neutral ground.
      *   **User's Feeling:** Stuck in circles, questioning if it's just a power struggle disguised as procedure.
      *   **Request:** Is there a principled way out? Write in American English.

  2.  **Identify the Underlying Political Theory:**
      *   The user has stumbled upon a classic problem in democratic theory known as the **"Boundary Problem"** (who constitutes the *demos*?).
      *   Key thinkers: Robert Dahl, Frederick Whelan, J.S. Mill.
      *   The user is correct: There is no purely logical or neutral solution to this *within* the system itself. It requires an external normative judgment.

  3.  **Determine the Goal of the Response:**
      *   Validate the user's insight (it's a real, recognized philosophical problem).
      *   Explain *why* it's a problem (the circularity).
      *   Offer practical/principled frameworks to break the circle (not a magic solution, but a way to argue through it).
      *   Keep it grounded in the context of a neighborhood association (HOA/COA), not just abstract theory.
      *   Maintain a neutral, advisory tone (not taking sides on renters vs. owners).
      *   Use American English.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the observation. It's not just them; it's a fundamental issue in political science. Name-drop the "Boundary Problem."
      *   **The Core Dilemma:** Explain the circularity clearly. "To decide who decides, you need deciders." Confirm their suspicion that it *is* partly a power struggle, but that doesn't mean principles can't guide it.
      *   **Principled Frameworks (The "Way Out"):** Since logic alone doesn't solve it, we need *values*. What values should guide the decision?
