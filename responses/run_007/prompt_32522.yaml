answer: |-
  You have hit on one of the oldest and thorniest problems in political theory. You aren't just stuck in a neighborhood dispute; you have stumbled onto what philosophers call **the Boundary Problem** (or the question of constituting the *demos*).

  You are absolutely right to feel stuck in a circle. Logically, there is no neutral way to decide who gets to decide. If you let the current voters choose, it's self-interest. If you let the non-voters choose, they are usurping authority they don't legally hold. If you bring in an outside arbiter, you have to decide who picks the arbiter.

  So, is there a principled way out? The answer is **no, not a logical one, but yes, a normative one.** You cannot solve this with math or procedure alone. You have to solve it by agreeing on *values*.

  Here is a framework to help your board move past the circular logic and toward a legitimate settlement.

  ### 1. Acknowledge the "Boundary Problem"
  Start by admitting to the board what you've realized. Say it out loud: *"We are trying to use the rules to decide who makes the rules. Logic won't solve this; only a shared principle will."*

  This lowers the temperature. It admits that both sides aren't necessarily "wrong" on procedure; they are just prioritizing different values. Once you admit there is no "God's eye view" neutral position, you can stop looking for one and start negotiating based on interests.

  ### 2. Apply Three Principled Lenses
  Since you can't derive the answer from the bylaws themselves, you have to import principles from outside. Political theorists usually argue for voting rights based on one of these three criteria. Your board should debate which one fits your community's mission:

  *   **The "All Affected Interests" Principle:** Who is impacted by the decisions?
      *   *Argument for Renters:* Renters pay the fees (even if bundled in rent) and live with the rules (noise, parking, pets). A bad budget or a stupid rule affects their daily quality of life immediately.
      *   *Argument for Owners:* Property values are affected. A poorly managed association lowers equity. Renters can leave; owners are financially tethered.
  *   **The "All Subject to Coercion" Principle:** Who is bound by the enforcement?
      *   *Argument for Renters:* If the association can fine a household for a violation, the people living there should have a say in the laws they are policed under.
      *   *Argument for Owners:* The legal contract (the deed) binds the owner, not the tenant. The owner is ultimately liable for the fines, even if they pass the cost to the tenant.
  *   **The "Stakeholder/Equity" Principle:** Who has long-term skin in the game?
      *   *Argument for Owner-Occupants:* They have the most to lose (value) and the most to gain (livability). They balance the financial and social aspects.
      *   *Argument against Absentee Owners:* An investor three states away cares only about ROI, not community cohesion. They might vote for low fees now at the expense of long-term maintenance.
      *   *Argument against Short-term Renters:* They may not care about long-term capital improvements. (Though you noted some have been there 15 years, which negates this).

  ### 3. Distinguish Between "Budget" and "Rules"
  One way to break the circle is to stop treating "voting" as a monolithic block. You might apply different principles to different powers.

  *   **Financial Votes (Budget/Assessments):** This is arguably about property equity. You could restrict voting on special assessments or bond issues to property owners, as they hold the collateral.
  *   **Governance Votes (Rules/Bylaws):** This is about daily living. You could argue that long-term residents (renters or owners) should vote on rules regarding noise, aesthetics, or common area use, because they are the ones subject to the social contract.

  Some associations create a two-tier system: Owners vote on financial solvency; Residents (owners + renters) vote on community standards.

  ### 4. The Legitimacy Trap (Addressing the Power Struggle)
  You asked if this is just a power struggle dressed up as procedure. **Yes, it is.** But that doesn't mean principles don't matter.

  In community associations, **enforcement relies on legitimacy.** If you impose a rule or budget that a large chunk of the population (like long-term renters) views as illegitimate because they had no voice, compliance will drop. Litigation will rise. Community cohesion will rot.

  Sometimes, the "principled" move is the pragmatic one: *Give the vote to the group whose cooperation you need most to keep the neighborhood running smoothly.* If your renters are stable, long-term neighbors, excluding them creates an adversarial class system within the HOA. If your absentee owners are funding the reserves, alienating them risks financial solvency.

  ### 5. Practical Compromises
  If the board can't agree on a full expansion or restriction, consider these off-ramps:

  *   **Proxy Requirements:** Require absentee owners to designate a local proxy (who could be the tenant) for voting on non-financial matters.
  *   **Residency Clauses:** Grant voting rights to any resident (owner or renter) who has lived in the unit for more than X years (e.g., 2 years). This rewards the 15-year renters while filtering out transient tenants.
  *   **Advisory Boards:** Create a "Residents Council" for renters that has a formal, non-voting seat at the board table. It doesn't solve the legal authority issue, but it gives them a voice in the deliberation.

  ### 6. The Legal Reality Check
  Before you get too deep into philosophy, check your state statutes. In many U.S. states, HOA law is statutory.
  *   Some states **mandate** that voting rights are tied to the deed (ownership), and bylaws cannot override this.
  *   Some states allow associations to define "member" more broadly.
  *   Some states have specific protections for tenants in community associations.

  If state law says "only owners vote," your philosophical debate is moot unless you lobby for a change at the state level. If the law is silent, you have the freedom to choose.

  ### Summary
  There is no neutral algorithm to solve this. You are correct that deciding *who* decides is a political act, not a mathematical one.

  The way out of the circle is to stop asking *"What does the procedure allow?"* and start asking *"What kind of community do we want to be?"*
  *   Do you want a **financial corporation** focused on protecting property values? (Lean toward owners/investors).
  *   Do you want a **civic community** focused on neighborhood stability and livability? (Lean toward residents/occupants).

  Once the board agrees on the *purpose* of the association, the voting rights usually follow. If you can't agree on the purpose, no bylaw language will save you from the power struggle.
