answer: |-
  Here is the plain truth upfront: **There is no single "adequate theory" of Common Knowledge of Rationality (CKR).**

  The request for a "full specification" assumes CKR is a settled natural kind or an engineering target. It is not. In epistemic game theory, CKR is a *parameter* that shifts depending on which solution concept you are trying to justify (Nash Equilibrium, Correlated Equilibrium, Backward Induction, etc.). Different camps define "Rationality" differently (instrumental vs. substantive), "Knowledge" differently (S5 logic vs. belief vs. probability 1), and "Common" differently (infinite hierarchy vs. approximate/common $p$-belief).

  Consequently, an "adequate theory" is always adequate *relative to a specific goal*. A theory that perfectly justifies Nash Equilibrium in static games will often collapse when applied to Backward Induction in dynamic games.

  However, we can map the **desiderata landscape**. Below are the requirements that any serious candidate theory must address, flagged by their status, followed by the impossibility results that force tradeoffs.

  ---

  ### Part I: The Desiderata

  #### 1. Extensional Adequacy (The Solution Concept Match)
  *   **Requirement:** The epistemic conditions must be necessary and sufficient for the intended solution concept. If you claim to model CKR for Backward Induction, the model must yield the Backward Induction outcome and nothing else.
  *   **Case:** Without this, the epistemic machinery is ornamentation. The value of epistemic game theory is grounding solution concepts in assumptions about agents.
  *   **Status:** **Non-negotiable** (but the *target* solution concept is contested).
      *   *Aumann/Brandenburger:* CKR + Common Priors $\rightarrow$ Correlated Equilibrium.
      *   *Stalnaker:* CKR $\rightarrow$ Nash Equilibrium (in static).
      *   *Aumann (1995):* CKR + Counterfactuals $\rightarrow$ Backward Induction.

  #### 2. Logical Coherence (No Contradictions)
  *   **Requirement:** The formal system describing knowledge and rationality must not derive $P \land \neg P$. The axioms of knowledge (e.g., Truth, Positive Introspection, Negative Introspection) must be consistent with the axioms of rationality (Maximization).
  *   **Case:** A theory that generates logical contradictions is useless for prediction or normativity.
  *   **Status:** **Non-negotiable.** (However, see *The Centipede Paradox* below for how hard this is to maintain).

  #### 3. Dynamic Consistency (Belief Revision)
  *   **Requirement:** If the game is dynamic, the theory must specify how agents update beliefs when observing actions. If an agent observes a move that was deemed "impossible" under CKR, how do they revise their belief about the opponent's rationality?
  *   **Case:** In extensive form games, play proceeds through time. A static definition of CKR is insufficient. Agents must have a plan for belief revision off the equilibrium path.
  *   **Status:** **Non-negotiable for dynamic games**, but the *method* of revision is the primary source of conflict.

  #### 4. Counterfactual Consistency (The "What If" Test)
  *   **Requirement:** The theory must specify what agents believe *would have happened* had a player deviated. Does a deviation imply a mistake (tremble) or a change in type (irrationality)?
  *   **Case:** To sustain CKR in dynamic games, I must believe you are rational even if you make a move that looks irrational. This requires a robust theory of counterfactuals.
  *   **Status:** **Contested.** This is the fault line between the "Aumann Camp" (rationality is substantive, deviations are impossible) and the "Binmore/Stalnaker Camp" (rationality is instrumental, deviations trigger belief updates).

  #### 5. Cognitive Tractability (Avoiding Logical Omniscience)
  *   **Requirement:** The model should not assume agents automatically know all logical consequences of their knowledge (e.g., if I know the rules and I know you are rational, I don't necessarily instantly compute the Nash Equilibrium of a complex chess position).
  *   **Case:** Standard epistemic logic (S5) assumes logical omniscience. This is empirically false for humans and computationally impossible for bounded machines.
  *   **Status:** **Contested / Preference.** Formalists often accept omniscience as an idealization; behavioralists reject it as a non-starter.

  #### 6. The Common Prior Assumption (CPA)
  *   **Requirement:** All agents' beliefs must be derivable from a single prior probability distribution updated by private information.
  *   **Case:** CPA is required for Aumann's Agreement Theorem and many CKR $\rightarrow$ Correlated Equilibrium results. It prevents "agreeing to disagree."
  *   **Status:** **Highly Contested.** Many argue priors are subjective. Dropping CPA breaks the link between CKR and Correlated Equilibrium in some frameworks.

  ---

  ### Part II: The Impossibility Results and Forced Tradeoffs

  You asked if subsets of these desiderata are jointly unsatisfiable. **Yes.** This is the central crisis of epistemic game theory. You cannot satisfy all non-negotiables simultaneously in all contexts.

  #### 1. The Backward Induction Paradox (Centipede Game)
  *   **The Conflict:** **CKR + Dynamic Consistency + Counterfactual Consistency.**
  *   **The Problem:** In the Centipede Game, Backward Induction (BI) requires players to stop immediately. This relies on the belief that if the game reached the final node, the opponent would take the money (rationality).
  *   **The Contradiction:** If Player 1 *doesn't* stop at the first node, Player 2 observes a deviation.
      *   If Player 2 maintains **CKR** (Player 1 is still rational), Player 2 must believe Player 1 has a reason to deviate that Player 2 didn't anticipate.
      *   If Player 2 believes Player 1 is rational, Player 2 should also deviate from BI to exploit this.
      *   But if Player 2 believes Player 1 is *irrational* (to explain the deviation), **CKR is violated**.
  *   **The Tradeoff:**
      *   **Aumann (1995):** Saves CKR and BI by using a specific counterfactual logic (substantive rationality). Deviations are "impossible worlds." *Cost:* Counterintuitive belief revision.
      *   **Binmore / Stalnaker:** Save Dynamic Consistency and intuitive belief revision. *Cost:* CKR does not imply Backward Induction. It implies Nash Equilibrium, which allows for cooperation in the Centipede.
  *   **Verdict:** You must choose between **CKR implying Backward Induction** or **CKR allowing for sensible belief revision after surprises.** You generally cannot have both.

  #### 2. The Agreement Theorem vs. Strategic Speculation
  *   **The Conflict:** **CKR + Common Priors + Speculative Trade.**
  *   **The Problem:** Aumann's Agreement Theorem states that if rationality and priors are common knowledge, agents cannot agree to disagree (i.e., they cannot bet against each other).
  *   **The Contradiction:** Financial markets and poker rely on speculative trade (agreeing to disagree). If CKR + CPA held strictly, markets would freeze.
  *   **The Tradeoff:** To explain markets, you must drop either **Common Priors** (priors are heterogeneous) or **Common Knowledge of Rationality/Beliefs** (there is private information about rationality itself).
  *   **Verdict:** In applied settings, **Common Priors** is usually the first desideratum sacrificed, not CKR.

  #### 3. Logical Omniscience vs. Complexity
  *   **The Conflict:** **S5 Knowledge Axioms + Computational Boundedness.**
  *   **The Problem:** Standard CKR assumes if I know $X$, and $X \implies Y$, I know $Y$. In complex games, deriving the equilibrium ($Y$) from the rules ($X$) is NP-hard.
  *   **The Contradiction:** A theory assuming logical omniscience predicts agents play Equilibrium instantly. Bounded agents do not.
  *   **The Tradeoff:** You must weaken the logic of knowledge (e.g., use **Awareness Structures** or **LeXicographic Probability Systems**) or accept the theory only applies to idealized agents.
  *   **Verdict:** For normative theory, Omniscience is kept. For descriptive theory, it is dropped.

  ---

  ### Part III: The Verdict

  #### Which requirement is the most exclusionary?
  **Dynamic Consistency in Perfect Information Games (Counterfactual Consistency).**

  This is the single requirement that kills the most candidate theories.
  *   If you demand that agents maintain Common Knowledge of Rationality *even after observing a deviation*, you are forced into convoluted counterfactual logics (like Aumann's substantive rationality) that many find semantically incoherent.
  *   If you demand that agents update beliefs naturally upon observing a deviation (Bayesian updating), you typically break the Common Knowledge of Rationality at that node, which often collapses Backward Induction.

  #### Is the framing confused?
  **Yes, but productively so.**
  Asking for "The Theory of CKR" is like asking for "The Theory of Distance." Distance depends on the metric (Euclidean, Manhattan, Minkowski). CKR depends on the **epistemic model**:
  1.  **Semantic (Aumann):** Partitions of state space. Good for static, Common Priors. Struggles with dynamic counterfactuals.
  2.  **Syntactic (Brandenburger-Keisler):** Type hierarchies. Good for completeness, but suffers from logical omniscience.
  3.  **Lexicographic (Brandenburger-Keisler-Stalnaker):** Allows for "trembles" and belief revision. Solves the Centipede paradox but complicates the definition of "Knowledge."

  #### Summary of Forced Choices
  If you are building or evaluating a theory of CKR, you cannot check every box. You must declare your allegiance:

  1.  **Do you want Backward Induction?** Then you must accept a definition of Knowledge that treats deviations as "null events" (Aumann 1995). *Cost:* Counterintuitive belief revision.
  2.  **Do you want sensible Belief Revision?** Then you must accept that CKR does not guarantee Backward Induction (Stalnaker 1998). *Cost:* Loss of the strongest predictive power in dynamic games.
  3.  **Do you want Cognitive Plausibility?** Then you must drop S5 Logic and Logical Omniscience. *Cost:* Loss of clean mathematical characterization (No Agreement Theorem).

  **Recommendation:** Do not look for a theory that delivers "CKR." Look for a theory that delivers **"CKR + [Specific Solution Concept] + [Specific Belief Revision Policy]."** Any paper claiming to offer CKR without specifying its stance on **off-equilibrium belief revision** is incomplete.
