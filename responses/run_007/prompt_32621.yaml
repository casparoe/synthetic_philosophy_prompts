  3.  **Evaluate the Philosophy (The "Instructor's" Perspective):**

      *   **The Core Tension:** The debate is the classic SIA vs. SSA stalemate. SIA avoids DA but invites PP. SSA avoids PP but invites DA.
      *   **Who is Right?**
