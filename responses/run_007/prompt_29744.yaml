answer: |-
  # Adversarial Collaboration Statement: The Doomsday Argument

  **Date:** October 26, 2023
  **Parties:** The Proponent (holds that the Doomsday Argument provides substantial reason to update credence toward a shorter human future) and The Critic (holds that the Doomsday Argument provides no reason to update and relies on unjustified assumptions).

  ---

  ## Part 1: Agreed Claims

  Both parties sign the following statements. These claims establish the shared ground regarding the structure, scope, and empirical context of the argument, without conceding the validity of the conclusion.

  1.  **Structure of the Reasoning:** The Doomsday Argument (DA) is a probabilistic inference derived from applying a Copernican-style principle to an observer's "birth rank" ($n$)—their position in the sequential ordering of all observers in a specific reference class—relative to the total number of observers who will ever exist in that class ($N$).
  2.  **Nature of the Conclusion:** The argument does not predict a specific calendar date, a specific population ceiling, or a specific mechanism of extinction (e.g., nuclear war, asteroid, AI). It claims only that, *ceteris paribus*, the probability distribution for the total size of the reference class ($N$) should shift toward lower values upon observing one's own rank ($n$).
  3.  **Empirical Baseline:** Both parties accept the standard demographic estimate that approximately 100–120 billion humans (*Homo sapiens*) have been born to date. Both parties accept that it is physically and biologically plausible for the future population to vastly exceed this number (e.g., by factors of $1,000\times$ or more) if humanity survives for a cosmologically significant duration.
  4.  **Bayesian Framework:** Both parties agree that the argument is best formalized using Bayesian updating, where the observation of one's birth rank serves as evidence ($E$) applied to a prior probability distribution over possible total population sizes ($N$).
  5.  **Independence from Causal Models:** Both parties agree that the DA purports to operate independently of specific causal models of risk. It does not claim to identify *why* humanity might end, only that the statistical likelihood of a long future is reduced simply by virtue of our early temporal position.
  6.  **Uncertainty Acknowledgement:** Both parties agree that the DA, even if valid, does not imply imminent extinction with certainty. It implies a probability shift that must be weighed against other evidence (e.g., technological resilience, resource availability).

  ---

  ## Part 2: Disagreements

  The following table details the precise points of divergence. Each statement is phrased such that the respective party endorses it as an accurate description of their position.

  | Point of Contention | The Proponent's Position | The Critic's Position |
  | :--- | :--- | :--- |
  | **1. The Self-Sampling Assumption (SSA)** | It is rational to treat one's own existence as if one were a random sample drawn uniformly from the set of all observers who will ever exist in my reference class. This is a necessary principle for making inferences from indexical information (information about *where* or *who* I am). | The SSA is unjustified in this context. Treating one's birth rank as a random sample ignores the fact that my existence is a precondition for making the observation. Indexical information cannot generate empirical evidence about the world's total size without additional causal assumptions. |
  | **2. Reference Class Stability** | The reference class "humans" (or "conscious observers similar to me") is sufficiently natural and stable. While boundary cases exist (e.g., cyborgs), they do not alter the order of magnitude of $n$ enough to invalidate the core probabilistic shift. | The reference class is arbitrary and unstable. If the class is narrowed (e.g., "people who understand the DA") or widened (e.g., "all sentient beings"), the birth rank $n$ changes drastically. An argument whose conclusion swings wildly based on class definition is unreliable. |
  | **3. Evidential Weight vs. Prior Encoding** | The observation of my birth rank provides *new* evidence that was not contained in my prior beliefs about human longevity. It forces an update even if my causal models suggest a long future. | The DA does not provide new evidence; it merely forces a shift in priors that contradicts causal evidence. If I have strong causal reasons to expect a long future, the DA is "probabilistic magic" that attempts to override physical evidence with pure math. |
  | **4. The "Presumptuous Philosopher" Counter** | The alternative to SSA (often the Self-Indication Assumption, or SIA) leads to absurd conclusions, such as allowing a philosopher to presume the universe is vast simply because they exist. SSA avoids this presumptuousness. | The "absurdity" of SIA is less damaging than the "absurdity" of DA (predicting doom without cause). SIA correctly accounts for the fact that I am more likely to exist in a universe with more observers. DA fails to account for this selection effect. |

  ---

  ## Part 3: Cruxes

  The following sub-questions identify the specific issues where resolution would compel at least one side to significantly alter their credence. For each crux, we specify a concrete case or test and the predictions each side makes regarding the outcome.

  ### Crux 1: The Reference Class Sensitivity Test
  *   **The Question:** Does the validity of the inference depend on the precision of the reference class definition?
  *   **Concrete Case:** Consider a future where humanity merges with AI. If we define the reference class as "biological humans," $N$ might be small (trillions). If we define it as "conscious computational processes," $N$ might be vast (quadrillions).
  *   **Proponent Prediction:** The argument remains forceful within any *consistent* reference class. If I define myself as a biological human, I should expect the total number of biological humans to be relatively close to the number so far. The fuzziness of the future class does not invalidate the inference about the current class.
  *   **Critic Prediction:** The argument collapses because the choice of class determines the conclusion. If the Proponent cannot specify *why* "biological human" is the correct class without begging the question (i.e., choosing the class that gives the desired result), the argument is arbitrary.
  *   **Resolution Condition:** If it can be demonstrated that shifting the reference class by one plausible degree changes the probability of doom from >90% to <10%, the Critic is vindicated. If the probability shift remains substantial across all *natural* kinds of reference classes, the Proponent is vindicated.

  ### Crux 2: The "Long-Future Species" Thought Experiment
  *   **The Question:** Would the argument seem forceful to an observer who possesses independent evidence of a long future?
  *   **Concrete Case:** Imagine we discover an alien civilization that has left a durable beacon stating, "We have existed for 1 million years and plan to exist for 1 billion more." A member of this species, at rank $n = 1$ trillion, applies the Doomsday Argument to their own species.
  *   **Proponent Prediction:** The alien *should* update their credence downward. Even with the beacon, the DA provides a counter-weighting likelihood. If the DA is valid, it implies the beacon is likely misleading, or the alien is an unusually early observer in a distribution they misunderstood.
  *   **Critic Prediction:** The alien should ignore the DA. The external evidence (the beacon) swamps the indexical evidence. If the DA suggests ignoring reliable external data about longevity, the DA is proven to be epistemologically defective.
  *   **Resolution Condition:** If the Proponent concedes that strong external evidence renders the DA silent, they admit DA is weak. If the Critic concedes the alien should feel *some* doubt based on rank alone, they admit DA has *some* weight.

  ### Crux 3: Non-Human and Digital Observers
  *   **The Question:** Does the inclusion of non-human observers dilute the evidential value of human birth rank?
  *   **Concrete Case:** Consider the possibility of "ancestor simulations." If 99% of observers with my exact mental state are simulations running in the far future, my "rank" among *all* such observers is very high, even if biological human history is short.
  *   **Proponent Prediction:** This strengthens the Doomsday Argument. If I am likely a simulation, the "real" humanity may have already ended. If I am not a simulation, I am extremely early in the sequence of *real* humans, which implies a short future for real humans. Either way, the expectation of a long, flourishing biological future is reduced.
  *   **Critic Prediction:** This renders the argument meaningless. If I cannot distinguish between being a "real" early human or a "simulated" late human, my rank is undefined. An argument that relies on a variable ($n$) that cannot be objectively measured provides no evidence.
  *   **Resolution Condition:** If the Proponent can show that the DA holds regardless of simulation hypotheses, they strengthen their case. If the Critic can show that simulation hypotheses make $n$ unknowable, they weaken the Proponent's case.

  ---

  ## Identification of Verbal Disputes

  Upon review, a portion of this dispute is **verbal**, specifically regarding the definition of **"Evidence."**

  *   **The Dispute:** The Proponent uses "evidence" to mean "any information that updates a Bayesian probability distribution, including indexical information about one's location in a sequence." The Critic uses "evidence" to mean "causal information about the physical state of the world."
  *   **Why it is Verbal:** If the Proponent agrees that DA provides no *causal* leverage, and the Critic agrees that DA provides *indexical* leverage, they may agree on the math but disagree on whether indexical leverage counts as "reason to change one's mind" in a practical sense.
  *   **Substantive Core:** However, the dispute is not *purely* verbal. It remains substantive regarding **epistemic norms**: *Ought* rational agents to update on indexical information when it conflicts with causal priors? This is a factual disagreement about how rational minds should process self-locating beliefs, not merely a definition clash.

  **Signed:**

  _________________________ (The Proponent)

  _________________________ (The Critic)
