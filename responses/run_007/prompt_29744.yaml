      *   *Proponent View:* Bayesian update. Prior beliefs about longevity should be shifted toward shorter futures.
      *   *Critic View:* Flawed reference class, flawed sampling assumption (SSA vs. SIA), or implies we know something we don't (the "Self-Indication Assumption" counter, or the "No One Knows Their Rank" objection).
