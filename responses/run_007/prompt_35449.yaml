prompt: |-
  I'm a UX research lead at a mid-size tech company, and I keep noticing that our user interview protocols assume something like a Cartesian theater — we ask people "what was your experience using feature X" as if there's a single, stable experience they can just replay and report. I've read enough Dennett to know this is probably wrong, that what we get is a draft constructed at the moment of asking, shaped by the question itself. But I don't know how to turn that insight into something my team can actually use. Could you write me a practical interview-and-interpretation procedure grounded in the multiple drafts model? It should be a step-by-step guide my researchers can follow: what questions to ask instead of the standard ones, what follow-ups probe for the construction process rather than pretending to access a fixed memory, what kinds of answers should be treated as artifacts of the method rather than data, and where the procedure forces a judgment call that can't be offloaded onto the theory. Then walk it through two example interviews — one where the procedure catches something the standard approach would miss, and one where the procedure itself probably creates a misleading draft and you have to flag that. My team has about 30 minutes per interview and moderate qual-research training but no philosophy background.
reasoning: |-
  Here's a thinking process that leads to the suggested guide:

  1.  **Analyze the Request:**
      *   **User:** UX Research Lead at a mid-size tech company.
      *   **Problem:** Current interview protocols assume a "Cartesian Theater" (single, stable experience replayable on demand).
      *   **Insight:** User knows Dennett's "Multiple Drafts Model" (experience is constructed at the moment of reporting, shaped by context).
      *   **Goal:** A practical, step-by-step interview and interpretation procedure grounded in the Multiple Drafts Model.
      *   **Audience:** Researchers with moderate qual training, no philosophy background, 30 mins per interview.
      *   **Requirements:**
          *   Step-by-step guide (questions, follow-ups, interpretation).
          *   Distinguish between "data" and "artifacts of the method."
          *   Identify judgment calls.
          *   Two example interviews (one success, one failure/limitation).
      *   **Tone:** Professional, actionable, pragmatic, not overly academic.

  2.  **Deconstruct the Theory (Dennett's Multiple Drafts Model) for UX:**
      *   *Cartesian Theater:* There's a "place" in the brain where "it all comes together" and consciousness happens. User says: "I felt frustrated." Researcher hears: "Frustration happened."
      *   *Multiple Drafts:* Narratives are spun up continuously. There is no final draft until the report is made. The question *creates* the memory as much as it retrieves it.
      *   *UX Implication:* Don't ask for "the truth" of the past. Ask for the *process* of meaning-making. Treat the interview as a co-construction event. Look for inconsistencies not as errors, but as different drafts.

  3.  **Drafting the Procedure (The "Draft-Aware Protocol"):**
      *   *Phase 1: Preparation.* Acknowledge the co-construction. Set expectations.
      *   *Phase 2: The Interview (Questioning).*
          *   Avoid: "What did you feel?" (Assumes pre-existing feeling).
          *   Use: "What's coming to mind as you look at this?" (Present tense construction).
          *   Avoid: "Why did you do that?" (Assumes rational access to motive).
          *   Use: "How would you explain that choice to a colleague?" (Framing the narrative).
          *   Probe for *revision*: "Has your take on that changed since it happened?"
      *   *Phase 3: Interpretation.*
          *   Treat consistency with suspicion (too polished).
          *   Treat hesitation/conflict as data (competing drafts).
          *   Identify "Method Artifacts" (answers given just to please the researcher).
      *   *Phase 4: Judgment Calls.* Where does the theory stop and decision-making begin? (e.g., when to trust a draft).

  4.  **Developing the Examples:**
      *   *Example 1 (Success):* Standard approach misses the nuance of *why* a feature failed. Draft-aware approach reveals the user is constructing a narrative of "being bad at tech" to explain a UI flaw.
      *   *Example 2 (Failure/Limitation):* The protocol itself is too meta. The user gets confused by the probing about their thinking process, leading to a "I don't know" draft that isn't useful for design.

  5.  **Refining for Constraints:**
      *   *Time:* 30 minutes is tight. The protocol can't be too long. Needs to be efficient.
      *   *Training:* Avoid jargon like "phenomenology" or "heterophenomenology." Use "Story-building" or "In-the-moment."
      *   *Actionability:* Needs specific scripts.

  6.  **Writing - Section by Section:**

      *   *Introduction:* Validate the insight. Briefly explain the shift from "Excavation" to "Co-creation."
      *   *The Protocol (D.A.M.P. - Draft-Aware Memory Protocol? No, let's keep it descriptive).* Let's call it the "Constructive Recall Protocol."
      *   *Step 1: Framing.* Tell the user there are no right answers.
      *   *Step 2: Questioning.* Shift from Past/Static to Present/Dynamic.
      *   *Step 3: Probing.* Focus on the *telling*, not just the *told*.
      *   *Step 4: Analysis.* Coding for "Narrative Friction."
      *   *Judgment Calls:* Explicitly list where the researcher must decide.
      *   *Example 1 (The Win):* Feature adoption. Standard = "It's hard." Draft-aware = "I feel like I should know this, but I don't." (Shame vs. Usability).
      *   *Example 2 (The Trap):* Over-intellectualizing. User starts analyzing the interview instead of the product.
      *   *Conclusion:* Encouragement.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too abstract?
      *   *Fix:* Add specific "Say This / Not That" tables.
      *   *Critique:* Is 30 mins enough?
      *   *Fix:* Emphasize that this doesn't add time, it changes *where* time is spent (less chasing facts, more exploring narratives).
      *   *Critique:* Did I address "artifacts of the method"?
      *   *Fix:* Make a specific section on "Red Flags" (e.g., answers that mirror the question's phrasing too closely).
      *   *Critique:* Did I address the judgment call?
      *   *Fix:* Create a "Decision Point" section in the analysis phase.

  8.  **Final Polish:** Check tone. Ensure it sounds like it's written by a peer/consultant, not a philosophy professor. (e.g., "Don't treat the transcript as a recording; treat it as a printout of a live render.")

  9.  *(Final check against Dennett)*: Ensure I'm not misrepresenting the Multiple Drafts Model. It's not that *nothing* is real, it's that the *authority* of the report is not privileged. The user is the expert on their *report*, not necessarily the causal history. The guide needs to reflect that distinction.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a sophisticated insight to bring into a product environment. Most UX research operates on an **Excavation Model** (the truth is buried, dig it up) when, as you note, cognition works more like a **Rendering Engine** (the image is generated at the moment of viewing, based on available assets and lighting).

  If you treat a user's report as a fixed memory, you optimize for consistency. If you treat it as a draft, you optimize for *narrative friction*.

  Here is a practical procedure designed for a 30-minute window, written for researchers who need scripts, not philosophy lectures.

  ***

  # The Constructive Recall Protocol (CRP)
  **Goal:** Shift from verifying past events to observing how users construct meaning about the product *now*.
  **Time:** 30 Minutes
  **Mindset:** The interview is not a recording playback; it is a collaborative design session where the "design" is the user's story.

  ## Phase 1: Framing (Minutes 0–3)
  *Standard protocols try to make the user comfortable. CRP tries to lower the stakes of "accuracy."*

  **The Script:**
  > "I want to be clear: I'm not testing your memory, and there are no right answers. Often, when we talk about using a tool, we realize our feelings about it change depending on how we look at them. If you find yourself contradicting something you said earlier, don't correct it—just tell me what's making sense *right now*. I'm interested in how you make sense of the tool, not just what happened."

  **Why:** This gives permission for the "drafts" to vary. It reduces the user's impulse to polish their narrative into a consistent lie.

  ## Phase 2: Inquiry (Minutes 3–25)
  *Avoid questions that assume a pre-existing internal state. Ask questions that require construction.*

  ### A. The Question Swap
  | Instead of (Cartesian/Excavation) | Use (Constructive/Draft) | Why |
  | :--- | :--- | :--- |
  | "How did you feel when X happened?" | "What words come to mind as you look at that screen now?" | Shifts from retrieving a stored emotion to observing a present reaction. |
  | "Why did you click that button?" | "If you had to explain that click to a coworker, what would you say?" | Acknowledges that "why" is often a post-hoc rationalization. |
  | "Was this feature useful?" | "In what kind of story does this feature fit? Where does it feel out of place?" | Treats utility as context-dependent, not an inherent property. |
  | "What was your goal?" | "What were you trying to become in that moment? (e.g., efficient, careful, exploratory)" | Goals are often identities we adopt, not just tasks. |

  ### B. Probing the Construction
  When a user gives a definitive statement (e.g., "It was confusing"), do not accept it as a data point. Probe the *drafting process*.

  *   **The Revision Probe:** "Has there been a time when that *wasn't* confusing? What was different about the story then?"
  *   **The Audience Probe:** "Would you describe it as 'confusing' if you were talking to the CEO versus talking to me?"
  *   **The Sensory Check:** "You said it was 'frustrating.' Is that a hot frustration (anger) or a cold frustration (giving up)?" (Forces specificity on vague labels).

  ## Phase 3: Interpretation (Post-Interview)
  *Do not code for "Issues." Code for "Narrative Stability."*

  **1. Identify Method Artifacts (Discard These)**
  *   **Mirroring:** The user uses the exact adjectives found in your question. (e.g., You ask: "Was it *intuitive*?" They say: "No, not *intuitive*.")
  *   **Politeness Drafts:** Sudden shifts to positive language right before the timer ends or when discussing pricing/billing.
  *   **Theoretical Answers:** When the user starts guessing your business goals ("I guess you want me to say...").

  **2. Identify High-Value Drafts (Keep These)**
  *   **Hesitation Markers:** Pauses, self-corrections ("Well, actually..."), or laughter during serious topics. This indicates competing drafts.
  *   **Contextual Shifts:** "I hated it yesterday, but today it seems fine." This isn't noise; it's data about stability.
  *   **Metaphor Breakdowns:** When a user's metaphor for the system fails ("It's like a filing cabinet, except the drawers move..."). This is where the mental model is breaking.

  ## Phase 4: The Judgment Call (The Theory Limit)
  *Theory cannot make design decisions. You must decide when a "draft" is actionable.*

  **The Decision Point:**
  You will encounter two conflicting drafts from the same user (e.g., "I love this workflow" vs. "This workflow blocks me").
  *   **Cartesian Approach:** Assume one is a lie. Try to verify which.
  *   **CRP Approach:** Assume both are true in different contexts.
  *   **The Call:** You must decide which *context* is the one you are designing for.
      *   *Ask:* "Which draft represents the user's **aspirational** self, and which represents their **operational** self?"
      *   *Action:* Design for the operational draft (what they actually do), but market to the aspirational draft (what they tell you they want).

  ***

  # Example Walkthroughs

  ## Example 1: The Success (Catching the "Shame Draft")
  **Context:** A B2B analytics dashboard.
  **Standard Protocol Result:** User says, "I don't use the Export feature often. It's just not that relevant."
  *   *Design Decision:* Deprioritize Export.

  **CRP Protocol Result:**
  *   **Researcher:** "You mentioned Export isn't relevant. What words come to mind when you look at that button *now*?"
  *   **User:** "It looks... technical. Like a spreadsheet."
  *   **Researcher:** "If you had to explain to a coworker why you haven't clicked it, what would you say?"
  *   **User:** "I'd tell them I don't need the data yet."
  *   **Researcher (Revision Probe):** "Has there been a time when you *did* need the data but still didn't click it?"
  *   **User:** (Long pause) "Actually, yes. Last week. I wanted to show my boss, but..."
  *   **Researcher:** "But?"
  *   **User:** "I wasn't sure if I was pulling the *right* numbers. I didn't want to look like I didn't understand the dashboard."

  **Analysis:**
  *   **The Artifact:** The initial "not relevant" claim was a **Face-Saving Draft**.
  *   **The Insight:** The barrier isn't utility; it's confidence. The user constructs a narrative of "irrelevance" to protect themselves from a narrative of "incompetence."
  *   **Outcome:** Standard research kills the feature. CRP research adds "confidence cues" (e.g., "This export matches your current view") to the feature.

  ## Example 2: The Trap (The "Meta-Analysis Draft")
  **Context:** A consumer meditation app.
  **Standard Protocol Result:** User says, "I use it when I'm stressed."
  *   *Design Decision:* Push notifications during high-stress times.

  **CRP Protocol Result:**
  *   **Researcher:** "You said you use it when stressed. What's coming to mind as you say that?"
  *   **User:** "Well, I'm thinking about how I *should* be using it."
  *   **Researcher (Audience Probe):** "If you were explaining this to the app developers, would you say the same thing?"
  *   **User:** "No. To you, I'd say I'm trying to be mindful. To myself, I know I just use it to fall asleep."
  *   **Researcher (Over-probing):** "So which draft is the real one? How do you decide which version of yourself is using the app?"
  *   **User:** "I don't know. I guess I'm overthinking this. Am I answering right? What are you looking for?"

  **Analysis:**
  *   **The Failure:** The researcher pushed the "construction" angle too hard. The user became aware of the **Interview as a Performance**.
  *   **The Artifact:** The user's final answers ("I guess I'm overthinking") are **Compliance Drafts**. They are no longer reporting on the app; they are reporting on the interview.
  *   **The Judgment Call:** The researcher should have stopped at the "To myself, I know I just use it to fall asleep" line. That was the operational draft. By asking "Which is real?", the researcher reverted to Cartesian thinking (there must be one truth) and broke the user's flow.
  *   **Outcome:** Data is contaminated. The team learns that users get anxious when asked to analyze their own analysis. Future protocols need a "Stop Rule": If the user asks "Am I answering right?", revert to simple task-based questions for 5 minutes to reset.

  ***

  # Implementation Checklist for Your Team

  1.  **Training:** Run a workshop where researchers interview each other. The goal isn't to learn about the partner, but to catch the moment the partner *constructs* an answer.
  2.  **Transcript Review:** In synthesis sessions, highlight moments of hesitation or self-correction in yellow. Treat these as higher fidelity data than smooth, confident answers.
  3.  **Reporting:** When presenting findings, do not say "Users feel X." Say "Users construct a narrative of X when context is Y, but shift to Z when..."
  4.  **The 30-Minute Guardrail:** If you spend 10 minutes probing the construction, you lose task coverage. Limit "Meta-Probes" (questions about their thinking) to 2 per interview.

  ### Final Note on Judgment
  Dennett's model tells you that the user's report is a construct. It does **not** tell you which construct leads to a better product.
  *   If a user constructs a story where your product makes them feel smart, that is a "Good Draft."
  *   If a user constructs a story where your product makes them feel safe, even if they use it inefficiently, that is also a "Good Draft."

  Your job is not to find the "Real User." Your job is to design the environment that encourages the most productive drafts.
