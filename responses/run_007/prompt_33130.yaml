answer: |-
  There is no single, canonical term in the philosophical lexicon (like "ad hominem" or "straw man") that captures this exact configuration. However, the pattern you have identified is a well-recognized tension in meta-ethics and political philosophy. It sits at the intersection of **methodological conservatism**, **Moorean dogmatism**, and a specific failure of **reflective equilibrium**.

  If you need a label to use in discourse, the most precise existing description is **Methodological Conservatism** (specifically regarding moral intuitions), executed via a **Moorean Shift**. However, to capture the specific "promissory note" aspect regarding boundaries, I would propose the descriptive term **Asymmetric Reflective Equilibrium** or **The Promissory Boundary Defense**.

  Here is a breakdown of the nearest concepts, why they don't quite fit, and how to distinguish the phenomenon you observed.

  ### 1. The Closest Existing Concepts

  **Methodological Conservatism (or Phenomenal Conservatism)**
  *   **What it is:** Associated with philosophers like Michael Huemer. It holds that if it seems to a subject that $P$, then the subject has some degree of justification for believing $P$. It grants pre-theoretical intuitions a "presumption of truth" that theories must overcome.
  *   **Why it fits:** Your friend is treating the intuition ("we have special obligations to compatriots") as a fixed datum that theory must explain, rather than a hypothesis that theory might falsify.
  *   **Why it's not exact:** Methodological conservatism is a general stance on justification. It doesn't specifically describe the *dialectical move* of deferring the boundary problem as a "gap" rather than a falsification. A methodological conservative might still abandon an intuition if the theoretical cost becomes too high; your friend treats the intuition as immune to the boundary problem.

  **The Moorean Shift**
  *   **What it is:** Derived from G.E. Moore's defense of common sense (e.g., holding up his hand to prove the external world exists against skeptical arguments). It prioritizes the certainty of a common-sense proposition over the premises of a theoretical argument that denies it.
  *   **Why it fits:** Your friend is effectively saying, "The existence of special obligations is more certain than the requirement that we must currently be able to draw their boundary."
  *   **Why it's not exact:** Moore's move is usually immediate ("I know this hand exists"). Your friend's move is temporal/deferred ("We know the obligation exists; the *explanation* will come later").

  **Narrow Reflective Equilibrium**
  *   **What it is:** In Rawlsian methodology, "narrow" equilibrium is aligning principles with existing intuitions. "Wide" equilibrium involves revising intuitions in light of principles and background theories.
  *   **Why it fits:** Your friend is stuck in *narrow* equilibrium. He wants a principle that matches the intuition, but when the principle fails to match the boundary, he refuses to adjust the intuition (which would be *wide* equilibrium).
  *   **Why it's not exact:** Reflective equilibrium implies a process of adjustment. Your friend is halting the process.

  ### 2. A Proposed Term: "Asymmetric Reflective Equilibrium"

  Since no standard term captures the *one-way direction of fit* combined with the *deferred boundary justification*, I suggest calling this **Asymmetric Reflective Equilibrium**.

  *   **Definition:** A dialectical stance where a moral agent treats pre-theoretical intuitions as fixed constraints on moral theory, while treating theoretical inconsistencies (such as arbitrary boundaries) as temporary gaps to be solved later, rather than as evidence against the intuition.
  *   **Direction of Fit:** Theory $\rightarrow$ Intuition (One-way).
  *   **Key Feature:** The "Promissory Note." The agent acknowledges the lack of principled demarcation but reclassifies it from a *falsifying condition* to a *research problem*.

  ### 3. Distinguishing It from Neighbors

  To use this concept precisely, it helps to distinguish it from the neighbors you mentioned:

  | Concept | Relationship to Intuition | Relationship to Theory | Handling of Boundary Gaps |
  | :--- | :--- | :--- | :--- |
  | **Wide Reflective Equilibrium** | **Mutable.** Intuitions can be revised if they conflict with coherent principles. | **Constraining.** Theory must explain intuitions, but can reject some. | A boundary gap suggests the intuition may be flawed or the principle wrong; adjustment is required. |
  | **Meta-Ethical Intuitionism** | **Epistemic Source.** Intuitions are a direct source of moral knowledge. | **Descriptive.** Theory describes what intuitions reveal. | Often claims boundaries *are* intuited (e.g., "I just see that the nation is the unit"). |
  | **Moral Particularism** | **Contextual.** Rejects the need for general principles/boundaries altogether. | **Skeptical.** Principles are not the goal. | Would argue the search for a boundary principle is a mistake; obligations are context-dependent. |
  | **Asymmetric Reflective Equilibrium** | **Fixed.** Intuitions are data points that cannot be discarded. | **Subordinate.** Theory must eventually catch up to the intuition. | **Deferred.** The gap is a "problem for theory," not a problem for the intuition. |

  ### 4. The Lakatosian Critique

  There is one more framework that helps name this, drawn from the philosophy of science: **Imre Lakatos's Research Programmes**.

  *   **Hard Core:** The irrefutable assumptions of a theory (e.g., "National obligations are real").
  *   **Protective Belt:** Auxiliary hypotheses that absorb anomalies (e.g., "We haven't found the right boundary principle yet").
  *   **Degenerating Programme:** When a research programme spends all its time adding ad-hoc explanations to protect the hard core without making new predictions or finding the promised principles.

  Your friend is treating the moral distinction as the **Hard Core** of a research programme and the missing boundary principle as an anomaly to be absorbed by the **Protective Belt**. If he continues to defer the justification indefinitely, a critic would call this a **Degenerating Moral Research Programme**.

  ### Summary Recommendation

  If you are writing or debating this, you might frame it this way:

  > "You are employing a strategy of **Asymmetric Reflective Equilibrium**. You are treating the intuition of special obligation as a fixed point (a **Moorean Shift**) and reclassifying the lack of a principled boundary not as a counter-argument, but as a **promissory note** for future theory. While this is a form of **Methodological Conservatism**, it risks becoming a **degenerating research programme** if the boundary principle is perpetually deferred."

  This accurately captures the structure (asymmetry), the move (Moorean/Conservative), and the risk (degenerating programme/promissory note) without relying on a non-existent single noun.
