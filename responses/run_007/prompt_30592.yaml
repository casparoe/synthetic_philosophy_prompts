answer: |-
  This is one of the most rigorous definitions of lying in the Western tradition, and it makes perfect sense that it snags you. You are reading it correctly: Augustine is radically internalizing the ethics of speech. For him, truth is not a relationship between a statement and the world; it is a relationship between a statement and the speaker's mind.

  Here is the breakdown of the mechanics, the implication for your craft, and the specific point where I hesitate to trust my own reading.

  ### 1. The "True-but-Lying" Case
  You asked what the "double thought" is doing in the example where someone tells the truth but still lies.

  Imagine you are hiding a refugee in your attic. A soldier knocks on the door and asks, "Is anyone in the house?" You *believe* the refugee is there (Thought A). You want the soldier to believe no one is there. So you say, "No, I am alone" (Utterance).

  It turns out, the refugee slipped out the back window five minutes ago. Objectively, your statement "I am alone" is **true**.

  Augustine says you have still **lied**. Why? Because of the "double heart."
  *   **Thought 1:** You hold in your mind: "There is someone here."
  *   **Thought 2:** You produce in words: "There is no one here," *while knowing/believing Thought 1 is the reality.*

  The sin, for Augustine, is the **will to deceive**. You attempted to sever the connection between your mind and your neighbor's mind. You tried to plant a falsehood in them. The fact that reality accidentally saved you from the *consequences* of the lie doesn't absolve you of the *act* of lying. The "double thought" is the internal dissonance of asserting $X$ while holding $\text{not-}X$. The external fact ($X$ happens to be true) is irrelevant to the moral state of the speaker.

  ### 2. The Novelist Question
  Is a novelist lying? By Augustine's definition in this specific passage, you are walking a razor's edge, but I believe you can step off it safely.

  Augustine writes: *"Wherefore, that man lies, who has one thing in his mind and utters another in words, **or by signs of whatever kind**."*

  That bolded phrase is your shield.

  When you write a novel, you are uttering words that do not correspond to factual reality (you know Gatsby never existed). However, you are also employing a **sign** (the genre convention of "fiction") that signals to the reader: *"Do not map this directly onto historical reality."*

  For Augustine, a lie requires the **intent to deceive** (*fallendi voluntas*).
  *   **The Liar:** Wants the listener to believe $X$ is a fact of the world, knowing it is not.
  *   **The Novelist:** Wants the reader to engage with $X$ as a truth of the *narrative*, knowing it is not a fact of the world.

  If the contract of fiction is clear (i.e., the book is sold as a novel, not a memoir), you are not creating a "double heart" in the deceptive sense. You are creating a "double world" in the mimetic sense. You are saying, "In the mind of this story, this is true." Augustine generally exempts "jests" and "fables" from the condemnation of lying because the tone or context acts as a sign that no deception is intended. The listener is not meant to be deceived about the *facts*, only entertained or instructed by the *simulation*.

  However, your character—the fanatical truth-teller—might still struggle with this. They might argue that even if the reader isn't deceived, the writer is still "uttering another" than what is in their mind (i.e., "I know this didn't happen, but I write that it did"). This is where the fanaticism lies: in refusing to accept the "sign" of fiction as a valid modifier of truth.

  ### 3. Where I Am Least Confident (and What Would Change My Mind)

  You asked me not to give a safe paraphrase but to show my cracks. Here is mine.

  I am least confident about how Augustine weighs the **"signs of whatever kind"** against the **"sense of his own mind."**

  My reading relies on the assumption that Augustine accepts genre conventions (like "this is a play" or "this is a fable") as sufficient "signs" to negate the "double thought." I am assuming that for Augustine, if I signal "I am joking" or "I am storytelling," my mind is no longer "double" because I am not *asserting* the falsehood as fact.

  **What would change my mind:**
  If I look at Augustine's *Against Lying* (*Contra Mendacium*), written later in life, his position hardens. In that text, he becomes increasingly worried that *any* departure from factual truth damages the soul's orientation toward God (who is Truth itself).

  There is a passage in *On Lying* (Section 10) where he discusses whether it is permissible to tell a lie to save someone from physical defilement. He ultimately says **no**. He argues that once you allow *any* exception, the sanctity of truth-telling collapses.

  If Augustine applies that same rigor to fiction, my defense of the novelist crumbles. If he argues that the "sign" of fiction is insufficient to cleanse the "utterance of falsehood," then the novelist *is* lying, because the novelist *knows* the words do not match the created reality, regardless of the reader's expectation.

  The textual evidence that makes me nervous is this: Augustine defines the lie as having one thing in the mind and uttering another. When I write "Call me Ishmael," I know I am not Ishmael. I have one thing in my mind (I am the author) and I utter another (I am Ishmael). Unless the "sign" of the novel completely transforms the *nature* of the utterance from "assertion" to "representation," the mechanical definition of lying is met.

  **The Pivot Point:**
  The only thing that saves the novelist is if Augustine classifies fiction under **"play" (jocandi)** rather than **"teaching/asserting" (docendi)**.
  *   **If Fiction = Play:** Then it is not a lie, because the "sign" of play suspends the obligation of factual correspondence.
  *   **If Fiction = Assertion:** Then it is a lie, because the author is asserting propositions they know to be factually false.

  In *On Lying*, Augustine seems to allow for play. But in his broader theology, he is deeply suspicious of the theater and mimetic arts because they stir up passions based on falsehoods.

  **So, for your character:**
  Your fanatical truth-teller could legitimately use this passage to argue that fiction *is* lying. They could argue that the "sign" of a novel is too subtle, too easily confused, and that the author *does* have a double heart: they know the world is $A$, but they write $B$. The fact that the reader "knows it's a story" doesn't fix the author's internal dissonance.

  If I were you, I would let your character seize on that uncertainty. They could argue: *"Augustine says we are judged by the sense of our own mind. In my mind, I know this event never occurred. Yet I write it as if it did. My heart is double, regardless of what the reader believes."*

  That interpretation is textually defensible, and it makes for a much more tortured artist than the standard "of course fiction isn't lying" defense.
