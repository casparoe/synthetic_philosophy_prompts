      *   Legal and logical systems routinely handle transitions. The rule in force *at the moment of voting* validates the transition. Once validated, the new state of affairs obtains. The fact that the old rule no longer exists *afterwards* doesn't retroactively invalidate the act that occurred *while it existed*.
