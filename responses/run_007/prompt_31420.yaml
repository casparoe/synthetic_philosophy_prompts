          *   If a rule says "I cannot be amended," and players try to amend it.
          *   If the rule is in force, the amendment fails.
          *   If they amend the *procedure* first, then the rule?
          *   Actually, the specific case: An amendment rule that says "This rule can never be amended."
          *   If players try to amend it, they fail because the current rule forbids it.
          *   This is consistent. The friend's argument said *no* amendment rule can be changed. My view says some can, some can't (depending on content).
