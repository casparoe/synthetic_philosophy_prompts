answer: |-
  Here is a plan for a forty-minute session designed to make the "Wrong Kind of Reasons" problem visceral for a group of writers.

  ### 1. The Sequence of Components
  **Total Time: 40 Minutes**

  **0:00–0:05: The Hook (The Two Questions)**
  *   **Action:** Do not mention philosophy. Write two questions on the board:
      1.  *Why should I hold this attitude?*
      2.  *What makes this attitude correct?*
  *   **Dependency:** This distinction must be established before introducing the example. If they think these are the same question, the puzzle cannot exist.
  *   **Goal:** Elicit agreement that these questions sometimes yield different answers. (e.g., "Why should I believe my friend is innocent?" vs. "What makes that belief true?")

  **0:05–0:15: The Concrete Example (The Poet and the Critic)**
  *   **Action:** Present the scenario (detailed below). Ask the group to identify the reasons the protagonist has to admire the poem. List them on the board in two columns, but do not label the columns yet.
  *   **Dependency:** This relies on the "Two Questions" hook. You are asking them to populate the answers to Question 1.
  *   **Goal:** Generate a list of reasons that all look like "reasons" but feel qualitatively different.

  **0:15–0:25: The Squeeze (The Puzzle)**
  *   **Action:** Challenge the group to articulate the difference between the two columns without using the words "good/bad" or "moral/immoral."
  *   **Dependency:** This relies on the list generated in the previous step. You need the raw data of their intuitions before you show them the contradiction.
  *   **Goal:** Make them feel the friction. They will want to say one set of reasons is "fake," but you must show them those reasons are pragmatically rational.

  **0:25–0:35: Head Off Misconceptions**
  *   **Action:** Introduce the predictable errors (Instrumentalism and "Bad Reasons") and dismantle them using the material from "The Squeeze."
  *   **Dependency:** This must happen *after* they have struggled to define the difference. If you do this too early, you give them the vocabulary before they feel the need for it.
  *   **Goal:** Prevent the discussion from collapsing into standard pragmatic vs. moral debates.

  **0:35–0:40: The Open Decline & Diagnostic Question**
  *   **Action:** State what you will not solve. Pose the diagnostic question.
  *   **Dependency:** This relies on the failure of the previous attempts to define the distinction.
  *   **Goal:** Leave them with the puzzle intact, not a solution.

  ---

  ### 2. The Single Concrete Example
  **The Scenario:**
  > You are a young poet. You have submitted a manuscript to a powerful critic who controls your career. The critic invites you to his study and reads you a poem he has written. It is objectively terrible—clichéd, clumsy, and insincere. You know this. He knows you know this.
  >
  > He leans forward and says: "If you genuinely admire this poem, I will launch your career. If you do not, I will ensure you never publish again."
  >
  > You leave the study. You find that, to save your livelihood, you have successfully psyched yourself up. You now feel a surge of admiration for the poem.

  **Why this example is better than alternatives:**
  *   **Vs. The Evil Demon:** The "Demon" example (admire me or die) is too abstract. The Critic scenario is grounded in the social reality of the literary world your audience inhabits. They understand the stakes of career and reputation viscerally.
  *   **Vs. Belief Scenarios:** Epistemic examples (believing a proposition is true) often get bogged down in truth-conditions. "Admiration" is an aesthetic attitude writers manipulate constantly. They know what it feels like to admire something versus *pretending* to admire something, which makes the tension sharper.
  *   **Vs. Fear/Pain:** Fear is reactive. Admiration is evaluative. The puzzle is about *evaluation*. If you fear a harmless puppy because of a threat, it's confusing. If you *admire* a bad poem because of a threat, you are corrupting your own judgment, which is a writer's specific nightmare.

  ---

  ### 3. Predictable Misconceptions & When to Head Them Off

  **Misconception A: "The Instrumental Distinction"**
  *   **The Error:** They will argue that the threat is an *instrumental* reason (a means to an end) and the poem's quality is an *intrinsic* reason (an end in itself). They will try to solve the puzzle by saying one is for *action* and one is for *feeling*.
  *   **When to Head Off:** During **The Squeeze (Minute 20)**.
  *   **How:** Point out that the critic demanded *admiration*, not *praise*. Praise is an action (you can lie). Admiration is an attitude. The threat successfully generated the attitude. Therefore, the threat was a reason *for the attitude*, not just for the action of pretending. If it wasn't a reason for the attitude, you couldn't have formed it. Ask: "Is the reason you feel admiration right now instrumental? Yes. So why does it still feel like the wrong kind of support for the feeling?"

  **Misconception B: "The Bad Reason Theory"**
  *   **The Error:** They will claim the threat is simply a "bad reason" or an "irrational reason" to admire the poem.
  *   **When to Head Off:** During **The Squeeze (Minute 22)**.
  *   **How:** Remind them of the stakes. "If you lose your career, you cannot write. If you cannot write, you cannot fulfill your life's purpose. Is it irrational to save your career?" Force them to admit that holding the attitude is the *most rational thing they could do*. The problem isn't rationality; it's that the reason doesn't make the poem *admirable*. It makes the *admiration* beneficial.

  ---

  ### 4. What to Openly Decline to Settle
  You must explicitly state that you are **not** going to answer the following question, even though it is the natural next step:

  > *"Are Wrong Kind of Reasons actually reasons at all, or are they just causes disguised as reasons?"*

  **Why:** This is the meta-ethical "Extensional Adequacy" problem. Philosophers have debated this for decades without consensus. If you attempt to settle it, you will drift into technical semantics about the nature of normativity.
  **Instruction to Group:** Tell them: "We are stopping at the cliff edge. We are agreeing that there is a difference between what makes an attitude *smart to have* and what makes it *right to have*. I am not asking you to decide if the 'smart' reason counts as a 'reason' in the universal ledger. I am asking you to acknowledge that your creative intuition treats them as different species."

  ---

  ### 5. The Diagnostic Question
  **Pose this at Minute 38:**

  > "If you were writing a character who admires a tyrant solely because the tyrant threatens their family, and you want to show that the admiration is *fitting* rather than just *prudent*, what would you have to change about the tyrant?"

  **Why this tells you they grasped the problem:**
  *   **If they haven't grasped it:** They will suggest changing the *stakes* (e.g., "Make the threat worse") or changing the *character's psychology* (e.g., "Make them love their family more"). This shows they still think the reason for the attitude lies in the advantage or the emotion's intensity.
  *   **If they have grasped it:** They will insist you must change the *tyrant*. They will say, "You have to make the tyrant actually admirable." This confirms they understand that RKR (Right Kind of Reasons) must bear on the **object** of the attitude (the tyrant's merit), whereas WKR (Wrong Kind of Reasons) bear on the **subject** (the character's safety). They will see that no amount of pragmatic pressure can turn a WKR into a RKR without altering the object itself.
