  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on free will and moral responsibility.
      *   **Participants:** Two students (one Pro-Frankfurt/Anti-PAP, one Anti-Frankfurt/Pro-PAP).
      *   **Task:** Draft an "adversarial-collaboration document."
      *   **Requirements:**
          1.  Numbered list of agreed claims (structure of cases, original PAP, success conditions, implications for compatibilism/incompatibilism).
          2.  Disagreements table (neutral wording, no caricatures).
          3.  List of cruxes (sub-questions, relevant arguments/cases, predictions from each side).
          4.  Terminological flagging (distinguish verbal vs. substantive disputes).
      *   **Tone/Style:** Academic, precise, collaborative but adversarial, reflecting the literature (flicker, dilemma defense, etc.) without being a literature review. Must be signable by both parties.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Side A (Frankfurtian/Anti-PAP):** Believes Frankfurt cases (FCs) show Moral Responsibility (MR) is compatible with the inability to do otherwise (~AP). The counterfactual intervener (Black) ensures the agent (Jones) couldn't do otherwise, but since Black doesn't intervene, Jones is responsible. Therefore, PAP is false. This supports compatibilism (or at least breaks the link between incompatibilism and PAP).
      *   **Side B (PAP Defender/Pro-PAP):** Believes FCs fail. Either (a) there *are* alternative possibilities (Flicker Strategy: e.g., the possibility of signing vs. being made to sign, or the possibility of the intervener triggering), or (b) the case begs the question (Dilemma Defense: if determinism is assumed in the actual sequence, incompatibilists won't grant MR; if indeterminism, the intervener might fail). Therefore, PAP stands.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to establish common ground on definitions and stakes.
      *   *Structure of FC:* Jones decides on his own; Black is ready to intervene if Jones shows signs of doing otherwise; Black doesn't intervene; Jones does the action.
      *   *Original PAP:* "A person is morally responsible for what he has done only if he could have done otherwise." (Frankfurt 1969).
      *   *Success Conditions:* Side A needs to show MR exists without AP. Side B needs to show AP exists or the intuition of MR is unwarranted.
      *   *Implications:* If PAP is false, the *direct* argument for incompatibilism (via PAP) fails, but incompatibilism might survive on other grounds (sourcehood). If PAP is true, incompatibilism is bolstered (assuming determinism removes AP).
      *   *Constraint:* Both must be able to sign. Avoid loading terms.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the core conflict without bias.
      *   *Point 1: The existence of AP in FCs.* Side A says "None relevant to MR." Side B says "Flickers exist" or "The setup implies AP."
      *   *Point 2: The source of the intuition of MR.* Side A says "Actual sequence independence." Side B says "Question-begging/hidden assumptions."
      *   *Point 3: The Dilemma.* Side A says "We can construct cases that avoid the dilemma." Side B says "The dilemma is structural/unavoidable."
      *   *Wording:* Use "Side A contends..." vs "Side B contends..." Ensure Side B doesn't sound like they just deny intuitions, and Side A doesn't sound like they ignore determinism.

  5.  **Drafting Section 3: Cruxes:**
      *   What would actually change minds?
      *   *Crux 1: Robustness of Flickers.* Are the remaining alternatives morally significant? (Robustness constraint).
      *   *Crux 2: The Dilemma Defense.* Can a Frankfurt case be constructed that is both deterministic (to remove AP) and non-question-begging (to secure MR intuition)?
      *   *Crux 3: Sourcehood vs. Leeway.* Is AP essential for MR, or is it just the *source* of the action?
      *   *Predictions:* Side A predicts flickers are too thin. Side B predicts flickers are sufficient or the case fails without them.

  6.  **Drafting Section 4: Terminology:**
      *   "Could have done otherwise" is the big one. (Conditional analysis vs. Categorical).
      *   "Alternative Possibility." (Robust vs. Non-robust).
      *   "Moral Responsibility." (Basic desert vs. Forward-looking).
      *   *Substantive core:* Even if we agree on definitions, do we agree on the *intuition* that Jones is responsible in the Frankfurt case? That's the real fight.

  7.  **Review and Refine:**
      *   *Check:* Did I mention the Flicker Strategy? Yes. The Dilemma Defense? Yes.
      *   *Check:* Is it a literature review? No, it's framed as *their* document.
      *   *Check:* Is the tone appropriate? Yes, formal and precise.
      *   *Self-Correction during drafting:* Initially, I might make the implications for incompatibilism too strong. Need to remember that falsifying PAP doesn't *prove* compatibilism, it just removes one obstacle. I need to make sure the Agreed Claims reflect that nuance so the Incompatibilist-leaning student (Side B) can sign it.
      *   *Refining the Disagreements:* Make sure Side B's position isn't just "PAP is true" but *why* (Flicker/Dilemma). Make sure Side A's position isn't just "FCs work" but *why* (Actual Sequence).
      *   *Refining Cruxes:* Ensure the "predictions" are clear.

  8.  **Final Polish:** Check formatting (numbered lists, tables). Ensure the distinction between Side A (Frankfurtian) and Side B (PAP Defender) is consistent. (Let's label them "The Frankfurt Proponent" and "The PAP Defender" for clarity).

  *(Self-Correction on Labeling)*: The prompt says "One holds... The other holds..." I should probably label them "Participant A" and "Participant B" or descriptive titles. Descriptive titles are clearer for the reader. Let's use "The Frankfurt Proponent (FP)" and "The PAP Defender (PD)."

  *(Check on Implications)*: If PAP is false, does Compatibilism win? Not necessarily. Source Incompatibilism exists. I must ensure the Agreed Claims acknowledge Source Incompatibilism so PD can sign.

  *(Check on Terminology)*: Ensure the distinction between "leeway incompatibilism" and "source incompatibilism" is acknowledged in the implications section.

  Okay, ready to write.
answer: |-
  # Adversarial Collaboration Document: Frankfurt Cases and the Principle of Alternative Possibilities

  **Participants:** The Frankfurt Proponent (FP) and The PAP Defender (PD)
  **Date:** October 26, 2023
  **Subject:** Status of the Principle of Alternative Possibilities (PAP) in light of Frankfurt-style Cases (FSCs)

  ## 1. Agreed Claims

  Both participants affirm the following claims regarding the definitions, structure, and stakes of the debate. Signing this section indicates agreement on the framework of the dispute, not on the resolution.

  1.  **Structure of a Canonical Frankfurt Case:** An FSC involves an agent (Jones) and a counterfactual intervener (Black). Black wants Jones to perform a specific action (e.g., voting for a candidate). Black monitors Jones's prior signs. If Jones shows signs of choosing otherwise, Black intervenes to ensure the action occurs. If Jones chooses the action on his own, Black does nothing. In the actual sequence, Jones chooses and performs the action on his own, without intervention.
  2.  **Definition of PAP:** We adopt Harry Frankfurt's original formulation as the baseline: "A person is morally responsible for what he has done only if he could have done otherwise." We acknowledge that contemporary discussions often refine this to specify *robust* alternative possibilities or *moral* responsibility of a specific kind (e.g., basic desert).
  3.  **Conditions for FP's Success:** To establish that FSCs refute PAP, FP must demonstrate that in the actual sequence of a canonical FSC: (a) the agent lacks the ability to do otherwise (due to Black's presence), and (b) the agent is nonetheless morally responsible for the action.
  4.  **Conditions for PD's Success:** To establish that PAP survives FSCs, PD must demonstrate either: (a) that relevant alternative possibilities remain available to the agent in the case (the Flicker Strategy), or (b) that the case fails to generate a non-question-begging intuition of responsibility (the Dilemma Defense).
  5.  **Implications for Incompatibilism:** Both parties agree that if PAP is false, the *direct* argument for incompatibilism (which relies on PAP + Determinism removes AP) fails. However, both agree that incompatibilism might still be defended via "Sourcehood" conditions (i.e., that determinism undermines responsibility even if AP is irrelevant).
  6.  **Implications for Compatibilism:** Both parties agree that if PAP is false, a major obstacle to compatibilism is removed, but this does not automatically prove compatibilism true (as other incompatibilist arguments may remain).
  7.  **Methodology:** Both parties agree that the debate turns largely on intuitions regarding specific cases and the theoretical interpretation of those intuitions, rather than on empirical data.

  ## 2. Disagreements Table

  The following table outlines the core points of contention. The wording is chosen to allow each participant to recognize their own position without accepting the opponent's characterization of it as erroneous.

  | Point of Dispute | The Frankfurt Proponent (FP) Contends... | The PAP Defender (PD) Contends... |
  | :--- | :--- | :--- |
  | **1. Existence of Alternatives** | In a properly constructed FSC, the agent possesses no alternative possibilities that are relevant to moral responsibility. Any remaining "flickers" (e.g., the possibility of the intervener triggering) are too trivial to ground responsibility. | In any FSC where the agent is responsible, there remain some alternative possibilities (e.g., the sequence of events leading to the action). These "flickers" are sufficient to satisfy a refined PAP, or their absence would undermine the intuition of responsibility. |
  | **2. Source of Responsibility Intuition** | The intuition that Jones is responsible stems from the *actual sequence* of events (his own reasoning and volition), which is identical to a case where he could have done otherwise. The counterfactual mechanism is irrelevant to this intuition. | The intuition that Jones is responsible often illicitly assumes that the actual sequence is indeterministic or free in a way that implies AP. If the actual sequence is deterministic, incompatibilists will not grant responsibility; if indeterministic, the intervener's guarantee fails. |
  | **3. The Dilemma Defense** | The dilemma (deterministic vs. indeterministic actual sequence) is avoidable. We can construct cases where the prior signs are causally sufficient for the action (removing AP) without making the action determined by external factors that undermine responsibility. | The dilemma is structural. To remove AP, one must introduce determinism or a prior sign that guarantees the outcome. If determinism is present, the incompatibilist denies responsibility independent of PAP. If not, AP remains. Thus, FSCs beg the question against the incompatibilist. |
  | **4. Role of PAP** | PAP is a false principle. Responsibility depends on the history and structure of the actual sequence (sourcehood), not on the availability of alternative options. | PAP (or a plausible refinement thereof) is a necessary condition for responsibility. The appeal of FSCs relies on masking the fact that we only attribute responsibility when we believe some form of control (entailing AP) was present. |

  ## 3. Cruxes

  Settling any one of the following sub-questions would, by both parties' own lights, substantially resolve or shift the burden of the dispute.

  **Crux 1: The Robustness of Flickers**
  *   **The Question:** Are the alternative possibilities remaining in an FSC (e.g., "voluntarily voting" vs. "being made to vote") robust enough to ground moral responsibility?
  *   **Relevant Consideration:** The "Robustness Constraint" (e.g., Whittle, Campbell). Does an alternative possibility need to offer the agent a genuine opportunity to avoid *blame* to count for PAP?
  *   **FP Prediction:** Flickers are not robust. The agent cannot avoid blame in the FSC because Black ensures the outcome. Therefore, the flicker cannot explain the responsibility attribution.
  *   **PD Prediction:** Flickers are robust enough, or the *absence* of robust flickers correlates with the *absence* of responsibility intuition. If we rigorously exclude all flickers, the intuition that Jones is responsible vanishes.

  **Crux 2: The Question-Begging Charge**
  *   **The Question:** Can an FSC be described that removes AP without implicitly assuming compatibilism in the description of the actual sequence?
  *   **Relevant Consideration:** The "Dilemma Defense" (Widerker, Kane). Does the description of Jones's decision process presuppose that determinism is compatible with responsibility?
  *   **FP Prediction:** Yes. We can describe the actual sequence using neutral terms (e.g., "Jones decided based on his reasons") that do not presuppose compatibilism, yet the presence of Black ensures no AP.
  *   **PD Prediction:** No. To make the case compelling (i.e., to make us feel Jones is responsible), the proponent must describe the actual sequence in a way that incompatibilists reject as sufficient for responsibility under determinism.

  **Crux 3: The Best Explanation of Intuitions**
  *   **The Question:** What is the best explanation for why we attribute responsibility in the actual sequence of an FSC?
  *   **Relevant Consideration:** Comparison with "Blockage Cases" (where no intervener exists, but the agent is blocked from alternatives by physical barriers).
  *   **FP Prediction:** The best explanation is that responsibility tracks actual sequence control (sourcehood), not alternative possibilities. Blockage cases confirm we attribute responsibility even when AP is physically blocked, provided the actual sequence is untouched.
  *   **PD Prediction:** The best explanation is that we implicitly assume the blockage is irrelevant *because* we assume the agent could have initiated a different causal chain prior to the blockage. If we remove that assumption, responsibility vanishes.

  ## 4. Terminological and Substantive Clarifications

  We have identified areas where disagreement appears terminological. We agree to clean up the terminology as follows, acknowledging the substantive disagreement that remains.

  **1. "Could Have Done Otherwise"**
  *   **Terminological Issue:** FP tends to interpret this as "categorical ability to choose differently in the exact same circumstances." PD sometimes allows for conditional analyses or broader notions of "opportunity."
  *   **Resolution:** We agree to use "Alternative Possibilities (AP)" to refer to the metaphysical ability to perform a different action in the exact same actual sequence up to the point of decision.
  *   **Remaining Substantive Disagreement:** Even with this definition, FP claims AP is absent in FSCs and responsibility remains. PD claims AP is present (via flickers) or that responsibility vanishes if AP is truly absent.

  **2. "Moral Responsibility"**
  *   **Terminological Issue:** Disagreement exists over whether we are discussing "basic desert" responsibility or forward-looking accountability.
  *   **Resolution:** We agree this debate concerns **basic desert moral responsibility** (the kind that makes an agent genuinely praiseworthy or blameworthy in a backward-looking sense).
  *   **Remaining Substantive Disagreement:** FP believes basic desert is compatible with the absence of AP. PD believes basic desert requires AP (or a sourcehood condition that entails AP).

  **3. "Relevance"**
  *   **Terminological Issue:** FP often claims flickers are "irrelevant." PD claims they are "relevant."
  *   **Resolution:** We define "relevant alternative possibility" as an alternative that would allow the agent to avoid the moral status (praise/blame) they possess in the actual sequence.
  *   **Remaining Substantive Disagreement:** FP argues that because Black ensures the outcome, the agent cannot avoid blame even with the flicker, so the flicker is not relevant. PD argues that the *existence* of the flicker (e.g., the possibility of acting on one's own) is itself what makes the actual sequence blameworthy, regardless of whether the flicker leads to a different outcome.

  ***

  **Signatures:**

  _________________________ (The Frankfurt Proponent)

  _________________________ (The PAP Defender)
