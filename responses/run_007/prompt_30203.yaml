answer: |-
  This is a classic ethical dilemma that mixes logic, social dynamics, and psychology. You are asking two distinct questions: one about the **validity of the advice**, and one about the **standing of the advisor**.

  Here is the breakdown of whether you are wrong to feel the way you do, and whether there is a principled reason to discount his criticism.

  ### 1. The Logical Truth vs. The Messenger
  Logically, you are encountering the *Tu Quoque* fallacy (Latin for "you also"). This is the idea that an argument is invalid if the person making it is a hypocrite. Strictly speaking, **your friend is logically correct.** Lying to your partner is generally wrong, regardless of whether the person pointing it out is a saint or a sinner. If a chain smoker tells you smoking will kill you, they are still telling the truth.

  However, human relationships do not operate on pure logic. They operate on trust, credibility, and moral capital.

  ### 2. Is there a "Principled Reason" his criticism counts for less?
  **Yes.** There are three principled reasons why his criticism carries less weight and why your irritation is justified:

  **A. Moral Standing and Credibility**
  In ethics and law, there is a concept called "unclean hands." It suggests that someone who has acted unethically regarding a specific issue loses the standing to demand ethical behavior from others regarding that same issue. Your friend burned down his last relationship through deception. Until he has demonstrated long-term reformed behavior with humility, he lacks the moral capital to lecture you on fidelity.

  **B. The Disparity of Severity**
  You are describing "white lies" or avoidance (saying you're working late to avoid a fight about going for drinks). Your friend described active, long-term infidelity. There is a categorical difference in the harm caused. For him to equate your behavior with his past behavior (implicitly, by policing it so aggressively) minimizes the severity of what he did. It feels like he is trying to normalize his past actions by focusing intensely on your minor ones.

  **C. Projection and Guilt Management**
  Psychologically, people who harbor unresolved guilt often become hyper-critical of others committing similar (even minor) sins. By policing you, he may be subconsciously trying to convince *himself* that he is now an "honest person." This makes his advice less about *your* well-being and more about *his* ego. Advice given to manage the giver's guilt is rarely helpful to the receiver.

  ### 3. Are you just being defensive?
  You are likely being **both** defensive and perceptive.

  *   **You are perceptive:** You have correctly identified that his delivery is hypocritical and lacks the humility of someone who has learned a hard lesson. If he were truly reformed, he might say, "Hey, I used to lie to my partner and it destroyed everything. I don't want you to go down that road." Instead, he is acting like the "ethics police," which suggests judgment rather than support.
  *   **You are defensive:** You admitted yourself that you should probably knock it off. You know the behavior isn't ideal. It is convenient to focus on his hypocrisy because it allows you to avoid looking at your own behavior. If you make him the villain, you don't have to be the hero of your own story.

  ### 4. The Verdict
  **You are not wrong to feel like he isn't in a position to lecture you.**

  A friendship relies on mutual respect. When someone ignores their own glaring faults to nitpick yours, it violates the spirit of reciprocity. It feels condescending because, in this specific domain, he has not earned the right to be condescending.

  **However, here is the trap:**
  If you use his hypocrisy as a reason to keep lying to your girlfriend, you are letting him control your integrity.

  *   **His behavior** is about his lack of humility.
  *   **Your behavior** is about your relationship's health.

  If you continue lying because "he's a hypocrite," you are damaging your relationship to win a point against your friend. That is a bad trade.

  ### How to handle it
  You can validate your feeling without validating your lying. You need to separate the message from the messenger.

  1.  **To your friend:** Set a boundary. You can say, *"I appreciate that you care, but given your history with [ex-girlfriend], it's really hard for me to take lectures on honesty from you. I'm working on being more open with my girlfriend, but I need support, not policing."* This calls out the hypocrisy without starting a war.
  2.  **To yourself:** Acknowledge that while the messenger is annoying, the message might still be useful. You don't need his permission to be honest, and you don't need his validation to stop lying. Do it for your girlfriend and your own self-respect, not because he told you to.

  **Summary:** His criticism is logically valid but socially tone-deaf and ethically compromised. You are right to be annoyed by the delivery, but don't let his hypocrisy become your excuse.
