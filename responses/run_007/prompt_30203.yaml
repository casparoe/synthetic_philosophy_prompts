prompt: |-
  My friend keeps getting on my case about lying to my girlfriend. Not huge lies — I'll say I'm working late when I'm actually out with coworkers, that kind of thing. He's not wrong that it's bad and I should probably knock it off. But here's the thing: this is the same guy who cheated on his last girlfriend for the better part of a year and lied to her constantly, and now he's in a new relationship and just... talks to me like he's the ethics police. If our other friend (who's actually honest with his partner) said the exact same words to me, I'd take it fine. So it's not that I can't handle hearing it. My question is whether theres a principled reason his criticism counts for less, or whether that's just me being defensive and the criticism is just as valid no matter who says it. Am I wrong to feel like he's not in a position to lecture me?
reasoning: |-
