  Strictly, this practice requires **resource fungibility** and **commensurability**. It presupposes that marginal resources are morally neutral regarding their origin; thus, income from finance is interchangeable with income from non-profits. It further presupposes that careers and grants are comparable instruments for resource allocation. The moral assessment of a career depends entirely on the counterfactual impact of the donated surplus, not the intrinsic nature of the work. The tension regarding systemic effects is resolved via an **epistemic heuristic**: quantifiable interventions are prioritized because they offer higher confidence in impact estimates, not because systemic change lacks value. The systemic effects of employing firms are excluded from the calculus due to measurement uncertainty or assumed negligibility relative to direct donations.

  This framework does not strictly require **welfarism**; any aggregable good (e.g., preference satisfaction) suffices. However, it is incompatible with deontological constraints prohibiting specific means (e.g., participating in exploitative systems) regardless of outcomes, or with virtue ethics emphasizing moral integrity over external impact.

  If these institutions held that goods are **incommensurable** with lives-saved-per-dollar, earning to give would be unjustifiable. If the *source* of income matters morally (e.g., complicity in harm), money is not a neutral vessel. Careers would be assessed by their intrinsic alignment with values, not just income potential. Grants would avoid funds from morally contested industries.

  If **durable institutional change** were the primary moral concern, behavior would shift radically. Grantmaking would prioritize advocacy and political reform, accepting higher uncertainty for potential structural leverage. The epistemic preference for RCTs would weaken in favor of qualitative theories of change. Earning to give would be replaced by "earning to influence," selecting careers for proximity to power rather than surplus maximization. The assumption that individual marginal donations outweigh systemic career effects would reverse; changing the rules of the system would be valued above optimizing within it to fund others.

