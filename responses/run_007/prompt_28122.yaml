      *   *Careers assessable like grants?* Yes, this is central. Both are vehicles for resource allocation toward good outcomes.
      *   *Marginal dollar fungible?* Yes, essential for ETG.
      *   *What if incommensurable goods/institutional change primary?* ETG would lose priority. Career choices would focus on direct influence/power rather than income maximization. Funding would shift to advocacy/politics despite measurement difficulties.

