          *   *Column 2 (Crux):* What specific question divides them?
              *   Is the selection of the invariance group part of the PoI or an external modelling choice?
              *   Does "lack of evidence" logically entail "equiprobability"?
          *   *Column 3 (Shared Evidence/Argument & Predictions):*
              *   Example: Jaynes' Maximum Entropy/Invariance derivation.
              *   Restrictionist Prediction: This validates PoI as a meta-rule.
              *   Eliminativist Prediction: This validates physical modelling, not PoI.
              *   Example: The "Borel" critique.
              *   Restrictionist Prediction: Borel failed to specify invariances.
              *   Eliminativist Prediction: Borel showed specification is always arbitrary.

      *   **Section 3: Verbal vs. Substantive:**
          *   *Verbal:* Definitions of "Principle of Indifference." Is it a logical rule or a heuristic? Definition of "Well-posed."
          *   *Substantive:* Whether symmetry principles are *logical* necessities (Restrictionist) or *physical/model-based* contingencies (Eliminativist).

  4.  **Refining the Content (Self-Correction/Polishing):**
      *   *Check:* Did I use British English? (e.g., "modelling," "programme," "favour," "centre").
      *   *Check:* Is the tone appropriate? It should sound like philosophers/statisticians trying to map the terrain, not fighting.
      *   *Check:* Did I capture Jaynes' argument without getting bogged down in technicalities? Yes, focus on the *interpretation* of Jaynes.
      *   *Check:* Is the distinction between verbal and substantive clear? The core substantive issue is the source of normative force for probability assignments.

  5.  **Drafting the Text (Iterative Process):**
      *   *Title:* Joint Statement on the Principle of Indifference and Bertrand's Paradox.
      *   *Preamble:* Mention the adversarial collaboration nature.
      *   *Agreed Claims:*
          1.  Math of the circle is sound.
