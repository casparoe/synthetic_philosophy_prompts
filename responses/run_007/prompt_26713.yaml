      *   Verbal/Substantive distinction? Yes.
      *   Both camps' views represented fairly? Yes.

  7.  **Final Polish:** Ensure the distinction between "Restrictionist" (often associated with Jaynes/Rosenkrantz) and "Eliminativist" (often associated with van Fraassen/Howson/Uffink) is clear in the wording. Ensure the "Crux" is sharp. (e.g., Is the choice of group *forced* by the problem description?)

