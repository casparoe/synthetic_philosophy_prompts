      *   *Tension 2: Rigidity vs. Plasticity.* If the learning rules are too fixed, it's not a "child" (it's a fixed algorithm). If they are too plastic, it never stabilizes into an "adult."
      *   *Tension 3: Teacher Dependence vs. Autonomy.* If the teacher shapes everything, it's puppetry. If the teacher does nothing, it's random walk.

  6.  **Refining the "Blank Slate" Tension (User's specific hunch):**
      *   User suspects: Blank Slate vs. Learn-Anything-From-Finite-Experience.
