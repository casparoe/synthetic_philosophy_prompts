  *(Final check on Turing's text)*: Turing explicitly says the child machine needs an "initial state" and "education." He compares it to buying a notebook vs. writing in it. He acknowledges the need for a "learning mechanism." Okay, I have enough to ground the criteria.

  *(One more thought on the "Surpassing Teacher" point)*: Turing says, "We can only see a short distance ahead, but we can see there is much that needs to be done." He implies the machine might solve things we can't. I will include this as a high-bar desideratum.

