answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION: THE EPISTEMOLOGY OF TESTIMONY**

  **Participants:** Committed Reductionist (R) and Committed Anti-Reductionist (AR)
  **Context:** Graduate Epistemology Seminar
  **Date:** October 2023

  **Preamble:**
  We acknowledge that the debate between Reductionism (the Humean view) and Anti-Reductionism (the Reidian view) often stalls due to imprecise formulations of the *explanandum* and the conflation of global vs. local theses. This document isolates our fixed points, precise disagreements, and empirical cruxes. We agree to treat "justification" as *propositional justification* (having reasons) that is capable of being *doxastically justified* (properly basing belief) absent defeaters. We are not debating knowledge primarily, but the justificatory status of the belief.

  ### I. SUBSTANTIVE CLAIMS ACCEPTED BY BOTH SIDES

  1.  **The Nature of the Act:** Testimony is not merely acoustic signal detection. It requires the hearer to recognize the speaker's utterance as an intentional communicative act offering a reason for belief. Both sides agree that without this recognition (e.g., hearing a parrot or a recording unknowingly), testimonial justification does not arise.
  2.  **The Role of Defeaters:** Both sides agree that defeaters function identically. If the hearer possesses a *psychological defeater* (believes the speaker is lying) or a *normative defeater* (should have believed the speaker is lying given available evidence), testimonial justification is destroyed. The dispute is not about how justification *ends*, but how it *begins*.
  3.  **Local vs. Global Distinction:** Both sides distinguish between *Local* theses (justification for a specific utterance) and *Global* theses (justification for the general practice of trusting testimony). We agree that Local Reductionism is implausible (no one checks credentials before asking for the time), and Global Anti-Reductionism is vulnerable (blind trust is irrational). The live debate is: **Local Anti-Reductionism vs. Global Reductionism.**
  4.  **The Necessity of Perception:** Both sides agree perception is necessary to receive testimony. The dispute is whether perception *plus the utterance* is sufficient for justification (AR), or whether perception *plus the utterance plus independent inductive support* is required (R).
  5.  **Empirical Data on Children:** Both sides accept the empirical data showing that children (ages 3–5) are not indiscriminate trusters. They track past accuracy, confidence, and consensus. Both sides agree this data proves *monitoring occurs*. The dispute is whether this monitoring is a *constitutive requirement for justification* (R) or a *natural mechanism for identifying defeaters* (AR).
  6.  **Memory Analogy:** Both sides agree memory is a preservative source, not a generative source. If you weren't justified in believing $p$ when you learned it, you aren't justified in remembering $p$. The dispute is whether testimony is like memory (preservative/transmissive, favoring AR) or like induction (generative/inferential, favoring R).
  7.  **The "Monitoring Cost" Constraint:** Both sides agree that any viable theory must respect cognitive economy. If a theory requires conscious, effortful inference for every testimonial belief, it is phenomenologically inadequate. R claims the inference can be sub-personal/fast; AR claims no inference is needed at all.
  8.  **Learning to Monitor:** Both sides agree that the *ability* to monitor speakers for sincerity and competence is learned over time. The dispute is whether the *justification* to trust waits until that ability is fully online (R) or exists prior to it (AR).

  ### II. DISAGREEMENTS TABLE

  | Precise Question | Reductionist Answer (R) | Anti-Reductionist Answer (AR) |
  | :--- | :--- | :--- |
  | **1. What is the source of the justification for a single instance of testimony?** | The justification is inferential. It derives from the hearer's independent premises: (1) I perceive the speaker saying $p$, (2) Speakers in this context are generally reliable, (3) Therefore, $p$ is likely true. | The justification is non-inferential. It derives from the recognition of the utterance as testimony itself. The fact that a speaker asserts $p$ provides a *sui generis* reason to believe $p$, absent defeaters. |
  | **2. What is the default status of a hearer prior to hearing an utterance?** | The default is neutrality or skepticism. The hearer has no epistemic right to believe until positive reasons (inductive or perceptual) are supplied to bridge the gap between "said" and "true." | The default is a *presumptive right*. The hearer is entitled to believe simply in virtue of being a rational agent in a communicative environment. The burden of proof lies on the skeptic, not the hearer. |
  | **3. Is active monitoring of the speaker a condition of justification?** | Yes. Justification requires that the hearer has (sub-personally) assessed the speaker's competence and sincerity. If monitoring fails, justification fails, even if no defeaters are present. | No. Monitoring is a tool for *defeating* justification, not creating it. A hearer can be justified even if they fail to monitor, provided they have no positive reason to doubt. |
  | **4. Does an infant/child have justified testimonial beliefs?** | No, not initially. Infants lack the inductive base regarding human reliability required to support the inference. They acquire justification only as they build a database of reliable correlations. | Yes. Infants have a default entitlement to trust caregivers. This entitlement is necessary for language acquisition and cognitive development; it does not wait for induction. |
  | **5. Is there a circularity problem in justifying testimony?** | No. We justify testimony using perception and induction. We do not need to use testimony to prove testimony is reliable; we use observed regularities in the world. | Yes, if you try to reduce it. Any inductive proof of testimony's reliability inevitably relies on testimony (to know the past observations were reported correctly). Thus, testimony must be basic to avoid circularity. |
  | **6. What explains the "Assurance View" intuition (that the speaker takes responsibility)?** | It explains it pragmatically. The speaker's assurance raises the probability of truth, which feeds into the hearer's inductive calculation. It is evidence, not a distinct normative relation. | It explains it normatively. The speaker's assurance creates a second-personal reason. The justification is not just about truth-conduciveness, but about the rights and responsibilities transferred in communication. |

  ### III. CRUXES: SETTLEMENT CONDITIONS AND PREDICTIONS

  We identify the following sub-questions as cruxes. If settled, one side must concede significant ground.

  **Crux 1: The "Inductive Base" Requirement**
  *   **The Question:** Can a subject possess justified testimonial beliefs *before* they have accumulated a sufficient inductive history of speaker reliability?
  *   **Concrete Case:** The "Feral Child" or "Isolate." A human raised in total isolation (no language, no observation of others) is introduced to a speaker. The speaker says, "There is water outside." The isolate believes it.
  *   **Agreed Evidence:** A thought experiment refined by cognitive science models of isolated agents.
  *   **R Prediction:** The isolate is **not justified**. Without prior observation of correlations between utterances and facts, the isolate has no premise for the inductive inference. Belief is blind guesswork.
  *   **AR Prediction:** The isolate **is justified** (prima facie). The capacity to recognize assertion triggers the default entitlement. The lack of history is irrelevant unless a defeater is present.
  *   **Settlement Condition:** If it can be shown that the isolate *cannot* even understand the utterance as testimony without prior social induction, R wins (because the AR condition of "recognizing testimony" collapses into R's inductive requirement). If the isolate can recognize the act but lacks evidence, AR wins.

  **Crux 2: The Cost of Monitoring vs. Default Trust**
  *   **The Question:** Is the cognitive load of monitoring speakers for reliability compatible with the speed and volume of ordinary testimonial uptake?
  *   **Concrete Case:** Rapid-fire conversation in a noisy environment (e.g., a pit crew, a kitchen, or casual gossip). Hearers process dozens of claims per minute with high accuracy.
  *   **Agreed Evidence:** Dual-task experiments where subjects monitor testimony while performing a secondary cognitive load task.
  *   **R Prediction:** Performance will degrade significantly under load. If monitoring is a *condition* of justification, occupying the monitoring faculty should destroy justification (or at least the ability to form the belief rationally).
  *   **AR Prediction:** Performance will remain stable under load. Monitoring is only for *defeaters*. Unless a specific alarm is rung, the default channel remains open without cognitive cost.
  *   **Settlement Condition:** If dual-task experiments show testimonial justification remains robust under high cognitive load, R must concede that monitoring is not a *necessary condition* for justification, weakening Global Reductionism to a trivial claim.

  **Crux 3: The Source of Monitoring Skills**
  *   **The Question:** Does the ability to monitor speakers for sincerity/competence itself rely on testimony?
  *   **Concrete Case:** Learning to identify "lying eyes" or "nervous ticks." We are often *told* by others how to spot liars, or we learn via cultural norms transmitted via testimony.
  *   **Agreed Evidence:** Developmental studies on how children learn to distrust.
  *   **R Prediction:** There must be a core layer of non-testimonial monitoring (pure perception/induction). If all monitoring skills are learned via testimony, Reductionism is circular (using testimony to justify testimony).
  *   **AR Prediction:** Most monitoring skills are socially transmitted via testimony. This is not circular for AR because testimony is basic. For R, this is a fatal regress.
  *   **Settlement Condition:** If it is demonstrated that >90% of reliability cues are learned via testimony, R must abandon the claim that testimony reduces to *non-testimonial* sources.

  **Crux 4: The Infant Selectivity Data**
  *   **The Question:** Do infants track reliability *before* they have a robust inductive base, or is their selectivity evidence of early induction?
  *   **Concrete Case:** 12-month-olds preferring to learn from a speaker who previously labeled objects correctly vs. incorrectly.
  *   **Agreed Evidence:** Longitudinal studies of infant gaze and learning choices.
  *   **R Prediction:** This *is* induction, just fast and sub-personal. The infant is building a statistical model. If you block the infant's ability to form statistical expectations, selectivity disappears.
  *   **AR Prediction:** This is a mechanism for finding defeaters, not building justification. The infant trusts *until* the negative evidence appears. The default is trust; the selectivity shows the defeater system working.
  *   **Settlement Condition:** If infants show *no* trust prior to the first reliability test, R is supported. If infants show trust *until* the first failure, AR is supported. (Current data is ambiguous; we agree a controlled study measuring baseline trust *prior* to any accuracy testing is required).

  ### IV. NOTE ON MERELY VERBAL DISPUTES

  We identify one area that appears to be merely verbal and agree to bracket it for the remainder of the seminar:

  **The Definition of "Inference"**
  *   **The Dispute:** R often claims that any sensitivity to reliability is an "inference." AR often claims that unless it is conscious and premise-driven, it is not an "inference."
  *   **Why Verbal:** Both sides agree on the *mechanism* (the brain processes reliability cues). R calls this "sub-personal induction." AR calls this "non-inferential sensitivity."
  *   **Resolution:** We agree to stop arguing about whether the mechanism is "inferential." We will instead argue about the **normative structure**: Does the justification *depend* on the reliability of the mechanism being established independently (R), or does the justification hold *in virtue of* the mechanism being a proper function of a rational agent (AR)?

  **The Definition of "Reduction"**
  *   **The Dispute:** "Global Reductionism" is sometimes defined as "all testimony must be checked" (strawman) vs. "testimony relies on general inductive grounds" (steelman).
  *   **Why Verbal:** AR often attacks the strawman; R defends the steelman.
  *   **Resolution:** We agree to define Reductionism strictly as: *Testimonial justification is not a basic source; it is derivative of perception, memory, and induction.* We agree to define Anti-Reductionism strictly as: *Testimonial justification is a basic source; it provides prima facie justification without requiring independent inductive support.*

  ***

  **Signed,**

  _________________________ (Reductionist)

  _________________________ (Anti-Reductionist)
