  8.  *(Self-Correction during drafting)*: Make sure to mention Frege. The concept of "unsaturatedness" is the direct counter to the glue/reification move. Also, mention Armstrong's "non-relational tie" as a modern attempt to solve this without regress.

  9.  *(Final thought)*: Ensure I address whether the regress conclusion *survives*. The answer is nuanced: The *infinite* regress might be blocked by changing categories, but the *explanatory gap* (what grounds the unity?) remains. This is the "Bradleyan challenge."

