answer: |-
  Here is a Q&A prep sheet tailored to your specific departmental demographics. The objections are phrased in the jargon your colleagues will use, ordered by the likelihood of them being raised and the potential damage to your thesis.

  ### **Q&A Prep Sheet: The Strawsonian Defense**

  #### **1. The Normativity Gap (The Pereboom Objection)**
  **Likelihood:** High | **Damage:** High
  **The Question:** "You've given us a brilliant descriptive sociology of our reactive attitudes. But you haven't bridged the normative gap. Just because we *cannot* or *do not* give up resentment in the face of determinism doesn't mean we *ought* to retain it. If determinism renders blame unfair, isn't the correct moral response to cultivate the objective stance, regardless of how unnatural it feels?"
  **The 2-Minute Reply:** "This assumes 'fairness' is a metaphysical currency we can spend independently of our form of life. My claim is that 'fairness' in the moral sense *gets its content* from the participant stance. To ask if the participant stance is 'fair' from outside the stance is like asking if the rules of chess are 'true' from the perspective of checkers. If we adopt the objective stance universally, we don't get 'more justice'; we get the cessation of interpersonal relationships. The cost of that is not just psychological discomfort; it is the loss of the very framework in which 'ought' and 'fair' have traction. I'm not saying we *can't* try to suppress resentment; I'm saying that if we succeed universally, we haven't solved a moral problem, we've dissolved the moral community."
  **Where it's Soft:** You are bordering on a transcendental argument that might look like a refusal to engage with the moral cost. Hard incompatibilists will press that "losing the moral community" is preferable to "unjustly punishing the determined."

  #### **2. The Empirical Corruption (The Moral Psych Objection)**
  **Likelihood:** High | **Damage:** Medium-High
  **The Question:** "Our data shows reactive attitudes track implicit bias, hunger, weather, and racial stereotypes far more reliably than they track control or reasons-responsiveness. If the 'bedrock' is this empirically corrupted, why treat it as a normative foundation? Doesn't this just license our biases under the guise of 'human nature'?"
  **The 2-Minute Reply:** "I agree entirely that our *actual* practices are corrupted. But the Strawsonian move isn't to sanctify every flash of anger we feel. It's to identify the *conditions of possibility* for holding responsible. The fact that our scales are sometimes rigged doesn't mean we abandon the concept of weight; it means we recalibrate the scales. We use the participant stance to critique bias *from within*. When I resent you for a slight, and then learn you didn't see me, my resentment dissolves. That internal correction mechanism relies on the very practices you say are corrupted. We reform the practice by appealing to better participant reasons, not by abandoning the stance for the objective view."
  **Where it's Soft:** You have to concede that the "internal correction" often fails. If the psychologists show the attitudes are *systematically* unresponsive to control, your "recalibration" defense looks wishful.

  #### **3. The Manipulation Generalization (The Four-Case Argument)**
  **Likelihood:** Medium | **Damage:** High
  **The Question:** "In Pereboom's Case 4, the agent is deterministically caused but not directly manipulated. We still feel resentment. But if you agree that direct manipulation (Case 1) exempts the agent, what is the relevant difference? If determinism is just 'global manipulation,' why isn't the objective stance warranted there too?"
  **The 2-Minute Reply:** "The difference is local vs. global exemption conditions. When someone is coerced or manipulated, they are *locally* opted out of the participant community; we still treat everyone else as participants. If determinism triggers the objective stance, *no one* is a participant. That's not an exemption; it's the end of the game. My point is that the reactive attitudes are sensitive to *quality of will*. Determinism doesn't change the quality of will. A determined friend who betrays me still exhibits ill will. A manipulated friend might not. Determinism is a backdrop; manipulation is a foreground interference. We react to the foreground."
  **Where it's Soft:** Incompatibilists will argue there is *no* metaphysical difference between Case 1 and Case 4, so your distinction is pragmatic, not principled. You need to own that: "Correct, it's not a metaphysical difference, it's a human one."

  #### **4. The 'Changing the Subject' Charge (The Compatibilist Objection)**
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "When people ask if we are morally responsible, they want to know if we deserve blame in the basic desert sense, not whether it's useful to blame us. By defining responsibility in terms of our practices, aren't you just changing the subject to avoid the hard metaphysical bullet?"
  **The 2-Minute Reply:** "I'm arguing that 'basic desert' is the philosophical fiction, not the participant stance. If you strip away the practices of blame and praise, what is left of 'desert'? It becomes a metaphysical ghost. I'm not changing the subject; I'm arguing that the subject *is* the practice. If you want a notion of responsibility that survives the removal of all human reactive attitudes, you have a concept, but it's not one that does any moral work. It's a solution in search of a problem."
  **Where it's Soft:** The compatibilist is right that many people *intend* to refer to a metaphysical capacity when they say "responsibility." You are engaging in conceptual revisionism while claiming to be descriptive.

  #### **5. The Revisionist Challenge**
  **Likelihood:** Medium | **Damage:** Medium
  **The Question:** "Even if we currently can't drop the participant stance, suppose we could train ourselves to. If determinism is true, wouldn't it be morally *better* to become the kind of creatures who adopt the objective stance universally? Why privilege our current psychological limitations?"
  **The 2-Minute Reply:** "Because the 'better' here is empty. To say it's 'morally better' presupposes a moral framework. That framework exists only within the participant stance. You can say it would be *safer* or *kinder* in a therapeutic sense, but not morally better. Furthermore, the project of training ourselves out of resentment requires us to view *ourselves* objectively, which is self-undermining. You can't decide to give up responsibility responsibly."
  **Where it's Soft:** This sounds circular. They will press that "well-being" is a metric independent of responsibility practices.

  #### **6. The Scope of Participation**
  **Likelihood:** Low | **Damage:** Low
  **The Question:** "Your view hinges on who counts as a participant. How do you handle psychopaths or severe narcissists who don't reciprocate reactive attitudes? Do we take the objective stance toward them? If so, aren't you admitting that responsibility *does* depend on metaphysical capacities (like empathy) after all?"
  **The 2-Minute Reply:** "We take the objective stance toward them not because they lack a metaphysical soul, but because they cannot sustain the interpersonal relationship. It's a relational failure, not a causal one. This confirms my thesis: we drop the stance when the *relationship* breaks, not when the *causation* is determined."
  **Where it's Soft:** It's hard to distinguish "cannot sustain relationship" from "lacks capacity" without slipping back into compatibilist metaphysics.

  #### **7. The Harm Objection**
  **Likelihood:** Low | **Damage:** Medium
  **The Question:** "Reactive attitudes cause immense suffering. If we can mitigate that suffering by adopting a more therapeutic, objective outlook (as in restorative justice models), doesn't a commitment to human well-being trump your commitment to preserving the 'form of life'?"
  **The 2-Minute Reply:** "Restorative justice isn't the objective stance; it's a *modified* participant stance. It still demands accountability and acknowledgment of harm. The objective stance is what we take toward a dangerous animal or a broken car. We don't want restorative justice; we want moral repair. That requires the very attitudes you want to minimize."
  **Where it's Soft:** There is a grey area where the objective stance *is* more humane. You risk sounding like you value the practice over the people in it.

  #### **8. The Dreaded Question (The "Fairness" Trap)**
  **Likelihood:** Low (but hoped for by you) | **Damage:** Critical
  **The Question:** "Let's strip the philosophy away. If a student fails an exam because their brain was determined to fail, and you blame them, aren't you just inflicting pain on someone who couldn't do otherwise? Doesn't your view just rationalize cruelty?"
  **The 2-Minute Reply:** "If I blame them, I am treating them as a member of my moral community, capable of understanding reasons and modifying behavior. If I stop blaming them, I am saying their failure doesn't matter and their agency is illusory. The 'cruelty' charge assumes the objective stance is the compassionate one. I'm arguing the opposite: the objective stance is the ultimate alienation. To treat someone as determined is to stop talking *to* them and start talking *about* them."
  **Where it's Soft:** This is emotionally risky. If the audience is strongly anti-punitive, this can sound like a justification for retribution.

  ---

  ### **Strategic Concessions**

  **Where to Concede Up Front:**
  Do not fight the **Moral Psychologists** on the data.
  *   **Say this:** "I want to be clear: I am not claiming our reactive attitudes are infallible guides to control. The experimentalists are right: our resentment is often biased, misfired, and irrational. My claim is weaker: even a corrupted compass is still a compass. We fix the bias by appealing to better participant reasons, not by throwing away the compass and adopting the objective stance."
  *   **Why:** If you fight the data, you lose the psychologists and look unscientific. If you concede the data but challenge the *implication*, you keep the high ground.

  **The "Get Out of Jail Free" Card:**
  If an Incompatibilist presses the "But it's *unfair*" point repeatedly:
  *   **Say this:** "We are using the word 'fair' differently. You are using it to mean 'metaphysically ultimate control.' I am using it to mean 'appropriate within a community of mutual regard.' I don't think I can convince you to adopt my definition, but I hope to show that mine is the only one that allows us to actually live together."

  **Final Advice:**
  Your biggest risk is sounding like you are saying "We can't help it, so we shouldn't try." Make sure you emphasize that the participant stance is **normatively demanding**. It requires us to be sensitive to reasons, to exemptions, and to quality of will. It is not a license to blame blindly; it is a framework for blaming *well*.
