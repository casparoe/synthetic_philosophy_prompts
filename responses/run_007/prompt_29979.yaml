  4.  **Drafting Replies and "Soft Spots":**
      *   *Constraint:* 2-minute replies. Needs to be punchy, philosophical, not defensive.
      *   *Soft Spots:* Must be honest. Strawson's view *is* vulnerable to the "is-ought" gap and the empirical reliability of emotions.

  5.  **Refining the Tone:**
      *   Academic, collegial, but sharp.
      *   Acknowledge the specific factions (Pereboom, Fischer, Experimentalists).
      *   Include the "Concession" section as requested.

  6.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Phrased as the audience would? Yes (using jargon like "normative force," "exemption conditions," "basic desert").
