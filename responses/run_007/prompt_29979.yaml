      *   *Objection 2 (Psych):* Reply: Acknowledge corruption, but argue for internal reform, not external abandonment.
      *   *Objection 3 (Manipulation):* Reply: Determinism isn't a *local* exemption condition.
      *   *Objection 4 (Compatibilist):* Reply: Control is defined *by* the practice, not vice versa.

      *Let's finalize the "Dreaded Question".* It should be the one that exposes the political/moral cost. "Doesn't this view condemn us to perpetuating a system of punishment that is fundamentally unfair?"

      *Concession:* Where to concede? Probably on the *empirical* point. Admit reactive attitudes are messy. Don't fight the psychologists on the data; fight them on the *implications* of the data.

