      *   **Topic:** Defending a P.F. Strawsonian line on moral responsibility (reactive attitudes, participant vs. objective stance).
      *   **Thesis:** Practices of blame/praise are bedrock; metaphysics (determinism) doesn't undermine them unless it triggers the objective stance (like coercion/insanity does). Order of explanation: practice first, metaphysics second.
      *   **Audience:** Philosophy department.
          *   Majority: Hard Incompatibilists (Pereboom-style: determinism + no responsibility).
          *   One: Reasons-Responsive Compatibilist (Fischer-style: Strawson changes the subject).
          *   Rest: Moral Psychologists (Experimentalists: reactive attitudes track bias, not control).
      *   **Goal:** A Q&A prep sheet with ~8 objections, ordered by likelihood/damage, phrased academically, with 2-minute replies, honesty about weaknesses, one "dreaded" question, and concession advice.

  2.  **Deconstruct the Audience's Likely Objections:**

      *   *Hard Incompatibilists (Pereboom-ish):* They will attack the *normativity* of the reactive attitudes. Just because we *have* them doesn't mean they are *justified*. They will push the "Manipulation Argument" or the idea that determinism *should* trigger the objective stance even if it currently doesn't.
      *   *Reasons-Responsive Compatibilist:* They will argue that Strawson ignores the *control condition*. If you can't do otherwise or aren't reasons-responsive, blame is unfair, regardless of our feelings. They'll say Strawson is "changing the subject" from *desert* to *social utility* or *psychology*.
      *   *Moral Psychologists:* They will attack the *reliability* of the reactive attitudes. If resentment tracks implicit bias or mood rather than moral agency, why take it as bedrock? They'll argue the practices are corrupted.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Incompatibilist Core):* "You're describing our practices, not justifying them." (The Normativity Objection). This is the big one. Strawson describes *what we do*, not *what we ought to do*.
      *   *Objection 2 (The Manipulation Argument):* "If determinism is true, we are just manipulated puppets. Why isn't that an exemption condition?" (Pereboom's Four-Case Argument adapted).
      *   *Objection 3 (The Compatibilist/Subject-Changing):* "Real responsibility requires control. You're talking about social regulation." (The 'Changing the Subject' charge).
      *   *Objection 4 (The Empirical Challenge):* "Reactive attitudes track bias, not agency. Why trust the bedrock?" (Moral Psych angle).
      *   *Objection 5 (The Scope of the Objective Stance):* "If determinism is true, *everyone* is exempt. Why limit it to coercion/insanity?" (The Generalization Argument).
      *   *Objection 6 (The Revisionist Pressure):* "If we learn determinism is true, shouldn't we *cultivate* the objective stance?" (The Ethical Revisionism Objection).
      *   *Objection 7 (The Harm of Blame):* "Reactive attitudes cause harm. Why prioritize them over well-being?" (Consequentialist/Pragmatic challenge).
      *   *Objection 8 (The Dreaded Question):* "Is your view just a sophisticated error theory?" or "Are you saying we *can't* give up blame even if we wanted to?" Let's go with: "If the metaphysics *did* undermine it, would you admit it?" (The Metaphysical Anchor). Actually, the *real* dreaded question is usually about the *injustice* of holding people responsible when they couldn't do otherwise. Let's frame it as: "Doesn't this license cruel treatment of the determined?"

      *Refining the Order:*
      1.  Normativity (Incompatibilists) - Most likely, high damage.
      2.  Manipulation/Exemption (Incompatibilists) - High damage.
      3.  Changing the Subject (Compatibilist) - Medium likelihood, specific attacker.
      4.  Empirical Corruption (Psychologists) - High likelihood given the dept makeup.
      5.  Revisionism (Can we change?) - Medium.
      6.  Harm/Well-being - Medium.
      7.  The "Basic Desert" definition - Technical.
      8.  The Dreaded Question (The "So what?" or "Is it fair?").

      *Let's select the top 8 based on the specific department profile.*
      1.  The Normativity Gap (Incompatibilists).
      2.  The Empirical Corruption (Psychologists).
      3.  The Manipulation/Exemption Generalization (Incompatibilists).
      4.  Changing the Subject (Compatibilist).
