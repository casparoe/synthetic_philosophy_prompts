prompt: |-
  Ok here's what I want. I keep reading about Russell's theory of descriptions and every paper seems to be holding it to a different standard of what a theory of definite descriptions even has to do. Before I read any more of this stuff, give me the spec. What should I be asking of a theory of definite descriptions, if the point is a theory good enough for doing semantics of natural language — one that explains how we actually understand definite descriptions and why the classic puzzles arise in the first place? Write the desiderata: the cases it has to get right (the present king of France, negative existentials, incomplete descriptions like 'the table is covered with books', anaphoric uses like 'a man walked in; the man sat down', fictional names), the distinctions it can't collapse (surface grammar vs logical form, referring vs quantifying, presupposition vs assertion, referential vs attributive use, primary vs secondary occurrence of a description under negation), and the facts it can't just contradict (compositionality, the ease with which we understand novel descriptions, the way uniqueness is normally contextually restricted rather than global — or if you think that framing is wrong, say so and make it a point of dispute rather than a datum). For each requirement, give the case or consideration that makes it a requirement, and say whether it's non-negotiable or just a preference of one camp. It also has to say something principled about whether bivalence survives once 'the present king of France is bald' and its negation are both on the table. Then score Russell, Strawson's presupposition view, and Donnellan's referential/attributive distinction against the list, but keep that part short — the list is the point, not the scorecard. Also tell me wether any pair of these desiderata are in tension or jointly unsatisfiable; if the list itself is a result because some pair can't both be met, that's the part I most want. And at the end, say how confident you are in the list as a whole and single out the one requirement you're least sure about.
