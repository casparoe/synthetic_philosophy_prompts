prompt: |-
  I am the director of a small geopolitical forecasting unit within a policy institute. Twice a year, we produce probability estimates for a set of events — elections, armed conflicts, economic indicators — and these estimates feed directly into our government clients' contingency planning. Our process is inherently forward-looking: we assign a credence now, but we also know that in three months our team will have new sources, new analytical frameworks, and quite possibly a different view. The question I keep wrestling with is: when should I trust my future team's judgment over my current one, and when should I regard the anticipated shift as a sign that something has gone wrong with our present reasoning?

  I have read a little about Van Fraassen's Reflection principle, which says roughly that your current credence in a proposition should equal your expected future credence in it — that you should treat your future self as an expert. But I also know there are cases where this breaks down: you might know you will be drunk, or sleep-deprived, or that you will have forgotten some crucial piece of evidence you now possess. And there are the more subtle puzzles — the Sleeping Beauty problem, cases where you will gain evidence whose character you cannot now anticipate, or cases where you know you will be subject to a systematic bias. I need a procedure my team can actually run, not a theorem.

  Please write me a decision procedure for determining when to defer to an anticipated future credence and when to override it. The procedure should be a checklist or flowchart in words: the questions to ask in order, what counts as a sufficient answer to each, where the procedure says "defer," where it says "do not defer," and where it hands the decision to a human because the question cannot be settled by the procedure. The procedure must be usable by analysts with no formal training in epistemology, in under half an hour, for a single forecast. It should be honest about which steps are judgment calls dressed up as procedure. Then apply it to three worked examples: (1) a forecast about an election outcome where we expect to gain high-quality polling data between now and the next review; (2) a forecast where we know the team will be under severe time pressure and fatigue at the next review, and we anticipate that their credence will shift accordingly; (3) a case where the team's current estimate is 70% but we expect the future estimate to be 40% solely because we anticipate a change in team composition — a respected contrarian is joining next month. For each, show what the procedure yields and flag any step where the procedure's answer is one the team will not like.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a small geopolitical forecasting unit.
      *   **Task:** Create a decision procedure (checklist/flowchart in words) for determining when to defer to an anticipated future credence vs. when to override it (stick with current credence).
      *   **Context:** Biannual probability estimates for government clients (elections, conflicts, economics). Forward-looking nature (current view vs. expected future view).
      *   **Theoretical Background:** Acknowledges Van Fraassen's Reflection Principle but recognizes its limitations (forgetting, bias, new evidence, etc.).
      *   **Constraints:**
          *   Usable by analysts with *no formal training in epistemology*.
          *   Time limit: Under 30 minutes per forecast.
          *   Format: Checklist/Flowchart in words (questions in order, sufficient answers, outcomes: Defer, Do Not Defer, Human Escalation).
          *   Honesty: Must flag where steps are judgment calls disguised as procedure.
          *   Application: Must apply to three specific worked examples (Election/Polling, Fatigue/Time Pressure, Team Composition/Contrarian).
          *   Tone: Professional, practical, honest about limitations.

  2.  **Deconstruct the Epistemological Problem:**
      *   *Reflection Principle:* $P_{now}(A) = E_{now}[P_{future}(A)]$. Basically, trust your future self unless you have a specific reason not to.
      *   *Violations:*
          *   *Loss of Information:* Forgetting, memory loss.
          *   *Cognitive Impairment:* Drugs, fatigue, bias induction.
          *   *Evidence Change:* Learning new facts (good reason to shift) vs. losing old facts (bad reason).
          *   *Identity Change:* New team members (different priors/expertise).
      *   *The Core Tension:* Is the expected shift due to *better information/processing* (Defer) or *degraded capacity/loss of evidence* (Do Not Defer)?

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Goal:* Make it actionable. Avoid jargon like "conditionalization" or "diachronic coherence." Use terms like "information," "capacity," "bias."
      *   *Step 1: Define the Shift.* What is the expected change? (Direction and magnitude).
      *   *Step 2: Source of Change.* Why will it change? (New info vs. internal state).
      *   *Step 3: Quality of Future State.* Will the future team be capable?
      *   *Step 4: Evidence Continuity.* Will they have what we have?
      *   *Step 5: The Decision.*
      *   *Constraint Check:* Needs to be under 30 mins. Needs to flag judgment calls.

      *Refining the Steps:*
      *   *Q1:* Do we expect the probability to change? If no, stop (Defer to self, trivial). If yes, proceed.
      *   *Q2:* Why? Is it new evidence? (This is the biggest differentiator).
      *   *Q3:* If not new evidence, is it cognitive degradation? (Fatigue, bias).
      *   *Q4:* If new people, are they more expert or just different?
      *   *Decision Node:* If New Evidence + Capable Team -> Defer. If Degradation -> Do Not Defer. If Ambiguous -> Escalate.

      *Adding "Honesty" Flags:* I need to explicitly mark where the analyst is making a subjective call.

  4.  **Developing the Worked Examples:**
      *   *Case 1 (Election/Polling):* Expected shift due to new data.
          *   *Analysis:* New evidence is a valid reason for shift. Future team capable.
          *   *Verdict:* Defer.
          *   *Uncomfortable truth:* Admitting current estimate is provisional/less informed.
      *   *Case 2 (Fatigue/Time Pressure):* Expected shift due to stress.
          *   *Analysis:* Cognitive degradation.
          *   *Verdict:* Do Not Defer (Trust current sober self).
          *   *Uncomfortable truth:* Acknowledging institutional failure to protect analyst time.
      *   *Case 3 (Contrarian Joining):* Expected shift due to personnel change.
          *   *Analysis:* Is the contrarian *right* or just *different*? This is the hardest one. It's a "Human Escalation" or a nuanced "Do Not Defer" unless expertise is proven. Let's make it a "Human Escalation" because "expertise" is subjective. Or, to fit the flowchart, maybe it requires a specific check on *why* they are contrarian. Let's aim for "Human Escalation" to be safe, or a nuanced "Do Not Defer" based on the idea that mere composition change isn't *evidence*. Actually, if the contrarian is "respected," that implies expertise. But is it *new evidence*? No, it's a new prior. Reflection principle usually breaks here. I will guide this to "Human Escalation" because it requires valuing one expert over another.

  5.  **Refining the Procedure for the "Under 30 Minutes" Constraint:**
      *   Keep questions binary or ternary.
      *   Provide clear definitions for terms like "New Evidence."
      *   Ensure the "Human Escalation" path is clear (Director's call).

  6.  **Writing the Content (incorporating the constraints):**
      *   *Introduction:* Acknowledge the difficulty.
      *   *The Protocol:* "The Diachronic Credence Protocol (DCP)."
      *   *The Steps:* Numbered, bolded questions, clear branching.
      *   *The "Honesty Flags":* Use a specific icon or bracketed text to denote judgment calls.
      *   *The Examples:* Walk through step-by-step.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Defer" the right word? If I defer to the future, I acknowledge my current number is just a placeholder. If I "Do Not Defer," I lock in the current number as more robust than the future one.
      *   *Correction:* Make sure the output tells them what to do *now*. If "Defer," it means "Record current estimate but annotate that it is expected to shift due to info gain." If "Do Not Defer," it means "Record current estimate as the robust baseline; flag future shift as noise."
      *   *Wait, re-reading the prompt:* "When should I trust my future team's judgment over my current one."
      *   *Clarification:* The output of the procedure determines the *weight* given to the current estimate vs. the anticipated future estimate for the purpose of *current* planning. Actually, the prompt asks: "when to defer to an anticipated future credence and when to override it." This implies the decision is about how to treat the *current* number in light of the *future* number.
      *   *Interpretation:* If I "Defer," I acknowledge the current number is weak and the future number will be the 'real' one. If I "Do Not Defer," I stand by the current number and view the future shift as an error.
      *   *Refinement:* Let's frame the outcome as: "Accept Current as Provisional (Expect Shift)" vs "Accept Current as Robust (Resist Shift)."
      *   *Actually, simpler:* "Trust Future" vs "Trust Current."
      *   *Let's stick to the prompt's phrasing:* "Defer" (Trust Future) vs "Override" (Trust Current).

      *Case 3 Nuance:* If a contrarian joins, is that "New Evidence"? No. Is it "Cognitive Degradation"? No. It's "Change in Priors." The Reflection Principle fails here because the future self is not the *same* epistemic agent. This needs to be a specific branch.

      *Time Check:* Can this be done in 30 mins? Yes, if the questions are direct.

      *Honesty Check:* I need to explicitly state where the procedure relies on gut feeling.

  8.  **Final Polish:**
      *   Ensure the tone is appropriate for a policy institute (serious, precise).
      *   Check that all three examples are fully worked.
      *   Ensure the "Uncomfortable Truth" is highlighted in the examples.

  **(Self-Correction on Case 3):** If a respected contrarian joins, the future team has *new expertise*. This is arguably "New Information" about the problem space (via the expert's brain). However, it's not public evidence. It's a change in the *processor*. I will classify this as "Change in Processing Agent." The procedure should treat this cautiously. I will route this to "Human Escalation" because deciding if a new hire is "better" or just "different" is a management decision, not an epistemic one.

  9.  **Finalizing the Structure:**
      *   Title.
      *   Preamble (Scope & Limitations).
      *   The Procedure (The "Diachronic Stability Check").
      *   The Three Examples.
      *   Closing advice.

