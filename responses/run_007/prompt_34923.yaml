answer: |-
  # The Diachronic Stability Check (DSC)
  **Version 1.0 | For Internal Use Only**

  ## Preamble: Scope and Limitations
  This procedure is designed to help analysts decide whether to treat their current probability estimate as **provisional** (expecting the future team's view to be superior) or **robust** (expecting the future shift to be an error or degradation). 

  **Time Limit:** 30 Minutes per forecast.
  **Epistemic Honesty:** This is not a mathematical proof. Several steps require subjective judgment. These are marked with **[JUDGMENT CALL]**. The procedure cannot resolve deep disagreements about expertise or institutional culture; these are routed to the Director.

  ---

  ## The Procedure

  ### Step 1: Quantify the Anticipated Shift
  **Question:** Do you expect the team's credence (probability estimate) to change significantly by the next review cycle?
  *   **Definition:** "Significantly" means a change large enough to alter a client's contingency decision (e.g., moving from 40% to 60%, or crossing a threshold like 50%).
  *   **If No:** Stop. **Outcome: TRUST CURRENT.** (No anticipated shift requires no resolution).
  *   **If Yes:** Record the expected direction and magnitude. Proceed to Step 2.

  ### Step 2: Identify the Driver of Change
  **Question:** What is the primary reason you expect the estimate to change? Select *one* dominant factor.
  *   **A. New Evidence:** We expect to receive specific data, intelligence, or observable events that we do not have now (e.g., polling results, troop movements, economic reports).
  *   **B. Cognitive/Environmental State:** We expect the team's ability to process information to change (e.g., fatigue, time pressure, emotional stress, intoxication).
  *   **C. Agent Composition:** We expect the people making the judgment to change (e.g., new hires, departures, different lead analyst).
  *   **D. Methodological Change:** We expect to use a different model or analytical framework.
  *   **If A or D:** Proceed to Step 3.
  *   **If B:** Proceed to Step 4.
  *   **If C:** Proceed to Step 5.

  ### Step 3: Evaluate Information Gain (For Drivers A & D)
  **Question:** Is the anticipated new evidence or methodology strictly *additive* and *reliable*?
  *   **Criteria for "Yes":** The new data will be verified, relevant, and accessible to the future team without obscuring current data. The new method is validated.
  *   **Criteria for "No":** The new data is rumor-based, the new method is experimental, or gaining the new data requires forgetting/ignoring current classified access. **[JUDGMENT CALL]**
  *   **If Yes:** **Outcome: DEFER TO FUTURE.** (Current estimate is provisional; the shift represents learning).
  *   **If No:** Proceed to Step 6 (Escalation).

  ### Step 4: Evaluate Cognitive Integrity (For Driver B)
  **Question:** Is the future team's state likely to be *more* or *less* conducive to rational calibration than the current team's state?
  *   **Indicators of "Less":** Known deadlines causing rush, sleep deprivation, known emotional stressors, political pressure to conform.
  *   **Indicators of "More":** Current team is rushed/uninformed; future team has dedicated analysis time.
  *   **Instruction:** Compare current capacity vs. anticipated future capacity. **[JUDGMENT CALL]**
  *   **If Future is "Less":** **Outcome: TRUST CURRENT.** (Override anticipated shift; attribute it to degradation).
  *   **If Future is "More":** **Outcome: DEFER TO FUTURE.**
  *   **If Equal/Unclear:** Proceed to Step 6 (Escalation).

  ### Step 5: Evaluate Agent Expertise (For Driver C)
  **Question:** Is the change in personnel an upgrade in *domain-specific expertise* relevant to this specific forecast?
  *   **Criteria for "Upgrade":** The new member has a proven track record on *this specific type of event* (e.g., a regional linguist joining a coup forecast).
  *   **Criteria for "Lateral/Unknown":** The new member is smart but generalist, or their track record is unproven, or they are a "contrarian" without specific domain advantage. **[JUDGMENT CALL]**
  *   **If Upgrade:** **Outcome: DEFER TO FUTURE.**
  *   **If Lateral/Unknown:** Proceed to Step 6 (Escalation).

  ### Step 6: Director Escalation
  **Condition:** Reached if Step 3, 4, or 5 yielded "No," "Unclear," or "Lateral."
  **Action:** Flag the forecast for Director review.
  **Reason:** The anticipated shift stems from ambiguous epistemic value. The Director must weigh institutional risk against potential insight.
  **Outcome:** **HUMAN DECISION.**

  ---

  ## Worked Examples

  ### Case 1: The Election Forecast (Driver: New Evidence)
  **Context:** Current credence is 55% for Incumbent victory. Review is in 3 months. We know high-quality, verified polling data is released in 2 months. We expect the credence to shift to 70% or 40% depending on that data.
  **Constraint:** Analysts have no epistemology training.

  *   **Step 1:** Do we expect a shift? **Yes.** (Polling moves numbers).
  *   **Step 2:** Driver? **A. New Evidence.** (Polling data).
  *   **Step 3:** Is it additive and reliable? 
      *   *Analysis:* The polling is from a reputable firm. It adds to current knowledge without erasing current knowledge (we still know the economic context). 
      *   *Answer:* **Yes.**
  *   **Procedure Outcome:** **DEFER TO FUTURE.**
  *   **Operational Meaning:** Record the 55% now, but annotate it as "High Volatility / Data Pending." Do not build rigid contingency plans on the 55% alone.
  *   **[UNCOMFORTABLE TRUTH]:** This step forces the analyst to admit their current work is inherently incomplete. Analysts often dislike labeling their own rigorous work as "provisional," fearing it undermines client confidence. The procedure requires them to prioritize accuracy over the appearance of certainty.

  ### Case 2: The Conflict Escalation (Driver: Cognitive State)
  **Context:** Current credence is 30% for armed conflict. Review is in 3 months. We know the next review coincides with the annual budget cycle. The team will be working 14-hour days to meet administrative deadlines. We anticipate the team will become risk-averse and shift the credence to 15% to avoid "alarmism."
  **Constraint:** Must be decided in under 30 minutes.

  *   **Step 1:** Do we expect a shift? **Yes.** (30% to 15%).
  *   **Step 2:** Driver? **B. Cognitive/Environmental State.** (Fatigue/Pressure).
  *   **Step 3:** (Skipped).
  *   **Step 4:** Is future state more or less conducive to rational calibration?
      *   *Analysis:* Current state is normal operations. Future state is severe time pressure + institutional pressure to minimize risk. This is a known bias inducer.
      *   *Answer:* **Less.**
  *   **Procedure Outcome:** **TRUST CURRENT.**
  *   **Operational Meaning:** Record the 30% as the robust baseline. If the future team reports 15%, flag it as "Potential Artifact of Resource Constraints" rather than a genuine update on the ground.
  *   **[UNCOMFORTABLE TRUTH]:** This step requires the analyst to formally certify that their future colleagues (and potentially themselves) will be intellectually compromised. It creates a permanent record that the Institute is scheduling work in a way that degrades analysis. This may trigger friction with management regarding resource allocation.

  ### Case 3: The Contrarian Hire (Driver: Agent Composition)
  **Context:** Current credence is 70% for Trade Sanctions. A new analyst, Dr. X, joins next month. Dr. X is a "respected contrarian" known for challenging consensus. We anticipate the team's credence will drop to 40% because Dr. X will argue the consensus is groupthink.
  **Constraint:** Usable by analysts with no formal training.

  *   **Step 1:** Do we expect a shift? **Yes.** (70% to 40%).
  *   **Step 2:** Driver? **C. Agent Composition.** (New hire).
  *   **Step 3 & 4:** (Skipped).
  *   **Step 5:** Is the change an upgrade in domain-specific expertise?
      *   *Analysis:* Dr. X is "respected" generally, but is a contrarian by temperament. Is contrarianism *expertise*? Not necessarily. It is a heuristic. Does Dr. X have specific data we lack? No, they have a different *prior*.
      *   *Answer:* **Lateral/Unknown.** (Temperament is not domain expertise).
  *   **Procedure Outcome:** **HUMAN DECISION (Director Escalation).**
  *   **Operational Meaning:** The procedure halts. The Director must decide if Dr. X's skepticism is valuable signal or noise.
  *   **[UNCOMFORTABLE TRUTH]:** The procedure refuses to solve the "Expertise vs. Opinion" problem. It forces the Director to admit that "respect" is not a quantifiable metric. The team might want a clear answer to proceed, but the procedure denies them one to prevent valuing "loudness" over "evidence." It highlights that personnel changes are epistemic risks, not just administrative ones.

  ---

  ## Implementation Notes for the Director

  1.  **The "Defer" Trap:** When the procedure says **DEFER TO FUTURE**, ensure your clients understand this does not mean "Ignore Current." It means "Current is a baseline; Future is the target." You must manage their expectation that the number *will* move.
  2.  **The "Trust Current" Risk:** When the procedure says **TRUST CURRENT**, you are effectively betting against your own organization's future output. This should be rare. If you find yourself overriding your future team frequently, your hiring or scheduling processes are the problem, not the forecasts.
  3.  **Judgment Call Auditing:** I have marked three steps as **[JUDGMENT CALL]**. Once a quarter, review the answers given in these steps. If analysts consistently rate "Future Capacity" as "Less" due to fatigue, you have a management problem, not a forecasting problem.

  **Final Warning:** This procedure stabilizes your reasoning; it does not guarantee accuracy. It prevents you from treating noise as signal, but it cannot generate signal where there is none. Use it to calibrate confidence, not to manufacture truth.
