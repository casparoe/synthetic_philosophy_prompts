answer: |-
  1. Begin by securing their assent to three specific premises: the teacher is known to be truthful, the students will know each evening whether the exam occurred that day, and the class meets only on known weekdays. This foundation prevents them from dismissing the backward induction as relying on ambiguous scheduling or dishonest authority.

  2. Use a three-day week scenario rather than five, as it reduces cognitive load while preserving the recursive structure necessary for the contradiction to emerge. The announcement must be framed as common knowledge that there will be exactly one exam and it will be unforeseeable on the morning of the exam.

  3. When they claim backward induction is generally invalid, point out that it works perfectly in game theory contexts to show the error lies specifically in epistemic assumptions. If they argue it is merely a semantic trick about surprise, insist they formalize surprise as "not known beforehand" to demonstrate the logical contradiction remains.

  4. Resist the conclusion that the teacher simply lied by showing how the students' own deduction eliminates the possibility of the exam, thereby making any exam surprising again. Guide them to see that the announcement creates a self-undermining belief state rather than a false proposition about the world.

  5. Conclude by asking whether the students know the announcement is true on Monday morning, and if so, why that knowledge disappears by Thursday night. Their ability to explain this shift without appealing to forgotten information will reveal whether they grasp the dynamic nature of the epistemic collapse.
