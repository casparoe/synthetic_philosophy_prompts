prompt: |-
  For a post I have been drafting, I keep coming back to the unilateralist's curse in discussions of AI risk and community governance: the pattern in which a group where any single member may act on behalf of the whole produces systematically risky outcomes, because the member with the most optimistic estimate of a proposal's value acts while the more pessimistic members' reservations carry no veto. The standard illustrations are open-sourcing a dangerous model, gain-of-function research, and unilateral geoengineering, but the structure also appears in more mundane decisions about who may fork a project, disclose a vulnerability, or post on a shared account. Rather than another argument for a particular remedy — majority vote, a consensus requirement, a designated decider, a higher evidence bar — I want the specification first. What would an adequate theory of how a group should handle decisions in which any one member can act have to deliver?

  Write the desiderata. I want the cases it must handle: asymmetric stakes, correlated versus independent judgments, strategic or adversarial members, unknown or open group membership, irreversible versus reversible actions, one-shot versus repeated settings. I want the distinctions it must not collapse: unilateral action versus public advocacy, epistemic disagreement versus value disagreement, ex ante versus ex post evaluation, a small aligned team versus a large anonymous commons, and the procedural question of who is entitled to act versus the substantive question of whether acting is wise. I want the formal results it must be consistent with: the original curse argument, the Condorcet jury theorem and its limits, information cascades, and the conditions under which agreement theorems do or do not force convergence. Give the case or consideration behind each requirement, flag which are non-negotiable and which are merely the preferences of a particular camp, and say whether any subset is jointly unsatisfiable — in particular, whether respecting individual autonomy, avoiding the curse, and remaining robust to strategic actors can all be satisfied at once. I am less interested in a scorecard of existing proposals than in knowing which single requirement does the most to exclude the popular fixes.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of the unilateralist's curse:

  1.  **Deconstruct the Request:**

      *   **Topic:** The Unilateralist's Curse (UC) in the context of AI risk and community governance.
      *   **Goal:** Specify the *desiderata* (requirements/criteria) for an *adequate theory* of how groups should handle decisions where any member can act.
      *   **Constraint 1 (Cases):** Must handle asymmetric stakes, correlated vs. independent judgments, strategic/adversarial members, unknown/open membership, irreversible vs. reversible actions, one-shot vs. repeated settings.
      *   **Constraint 2 (Distinctions):** Must not collapse unilateral action vs. public advocacy, epistemic vs. value disagreement, ex ante vs. ex post evaluation, small aligned team vs. large anonymous commons, procedural entitlement vs. substantive wisdom.
      *   **Constraint 3 (Formal Results):** Must be consistent with the original curse argument, Condorcet jury theorem (and limits), information cascades, agreement theorems (Aumann, etc.).
      *   **Constraint 4 (Analysis):** Flag non-negotiable vs. preference, identify joint unsatisfiability (impossibility results), and identify which single requirement excludes popular fixes.
      *   **Tone:** Analytical, rigorous, philosophical/social-choice-theoretic, not prescriptive of a specific solution.

  2.  **Initial Brainstorming & Concept Mapping:**

      *   *The Unilateralist's Curse (Bostrom et al.):* When $N$ agents face a decision with value $V$, and each estimates $V_i$, the agent with the highest $V_i$ acts. If estimates are unbiased, the max estimate is upwardly biased. Result: Too much action.
      *   *The Core Tension:* Individual agency/autonomy vs. Collective safety/optimality.
      *   *The "Theory":* Needs to be a normative framework for governance/decision-making under these specific structural conditions.
      *   *Key Challenge:* You can't just say "vote" because the curse arises precisely when voting is impossible or bypassed (capability to act is distributed). The theory must address the *capability* to act, not just the *authority*.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Structural/Cases.*
          *   Need to handle high stakes (AI x-risk).
          *   Need to handle correlation (if we all read the same paper, our errors are correlated).
          *   Need to handle bad actors (sabotage).
          *   Need to handle open source (who is in the group?).
          *   Reversibility matters (locking in a bad outcome vs. testing).
          *   Repetition matters (reputation effects).
      *   *Category 2: Conceptual Distinctions.*
          *   Don't confuse "I can do it" with "I should say it."
          *   Don't confuse "We disagree on facts" with "We disagree on goals."
          *   Don't judge by outcome only (luck vs. skill).
          *   Don't treat a 5-person lab like a global public good.
          *   Don't confuse "Who has the key?" with "Is turning the key smart?"
      *   *Category 3: Formal Consistency.*
          *   Must explain why the curse happens (order statistics).
          *   Must respect Condorcet (more info is good, but aggregation matters).
          *   Must account for cascades (herding).
          *   Must respect Aumann (why don't we agree?).
      *   *Category 4: Impossibility/Trade-offs.*
          *   Can we have Autonomy + Safety + Strategy-Proofness? Likely not (Gibbard-Satterthwaite vibes).

  4.  **Refining and Organizing the Desiderata:**

      *   *Requirement 1: The Bias Correction Condition.* (Addresses the core UC argument). Non-negotiable.
      *   *Requirement 2: The Correlation Sensitivity Condition.* (Addresses independent vs. correlated errors). Non-negotiable.
      *   *Requirement 3: The Strategic Robustness Condition.* (Addresses adversarial members). Non-negotiable for safety-critical contexts.
      *   *Requirement 4: The Boundary Definition Condition.* (Addresses open/unknown membership). Hard problem.
      *   *Requirement 5: The Reversibility/Stakes Scaling Condition.* (Addresses asymmetric stakes).
      *   *Requirement 6: The Epistemic/Value Separation Condition.* (Addresses disagreement types).
      *   *Requirement 7: The Procedural/Substantive Distinction Condition.* (Addresses authority vs. wisdom).

  5.  **Analyzing Trade-offs and Impossibility:**

      *   *The Trilemma:* Autonomy (anyone can act), Safety (avoid curse), Strategy-Proofness (no gaming).
      *   If anyone can act (Autonomy), you need a norm to stop the curse.
      *   If the norm is "don't act unless sure," it's vulnerable to strategy (I pretend to be sure).
      *   If the norm is "vote," it violates Autonomy (capability is restricted).
      *   *Conclusion:* You cannot satisfy all three perfectly in a one-shot, open-membership setting.
      *   *Which requirement kills popular fixes?*
          *   *Majority Vote:* Killed by "Capability Distribution" (if I *can* act, voting doesn't stop me physically, only normatively).
          *   *Consensus:* Killed by "Strategic Robustness" (one holdout can hold hostage).
          *   *Deference to Authority:* Killed by "Epistemic Humility/Agreement Theorems" (who is the authority?).
          *   *Actually, the strongest killer is likely Strategic Robustness combined with Open Membership.* Most fixes assume a closed, friendly group.

  6.  **Developing the Content (Section by Section):**

      *   *Introduction:* Define the scope. Not a solution, but a spec for a solution.
      *   *Section 1: Case Coverage.* (Stakes, Correlation, Strategy, Membership, Reversibility, Repetition).
      *   *Section 2: Conceptual Distinctions.* (Action vs. Speech, Epistemic vs. Value, Ex Ante vs. Ex Post, Group Type, Procedure vs. Substance).
      *   *Section 3: Formal Consistency.* (UC Math, Condorcet, Cascades, Agreement).
      *   *Section 4: Impossibility & Tensions.* (The Trilemma).
      *   *Section 5: The Exclusionary Requirement.* (Identify the one that breaks most fixes).

  7.  **Self-Correction/Refinement during drafting:**

      *   *Check:* Did I distinguish between "preference of a camp" and "non-negotiable"?
      *   *Adjustment:* Explicitly label them. E.g., "Privacy of judgments" might be a preference, but "Bias Correction" is non-negotiable for the theory to address the curse.
      *   *Check:* Did I address the "single requirement that excludes popular fixes"?
      *   *Insight:* Most popular fixes (norms of consultation) fail because they assume *good faith*. The **Strategic Robustness** requirement is the hammer that breaks the "gentlemen's agreement" fixes.
      *   *Check:* Ensure the distinction between *procedural entitlement* and *substantive wisdom* is clear. This is crucial for AI governance (just because you *can* release weights doesn't mean you *should*).

  8.  **Final Polish:**

      *   Ensure tone is rigorous and matches the prompt's sophistication.
      *   Verify all constraints from the prompt are met.
      *   Make sure the "Impossibility" section is honest about the trade-offs.

  9.  *(Self-Correction on the "Single Requirement"):* I need to be careful. Is it Strategic Robustness? Or is it the definition of the Group Boundary? Open membership makes almost everything harder. But Strategic Robustness is more fundamental to the *decision mechanism*. Let's argue that **Strategic Robustness in an Open Boundary** is the killer combination, but if forced to pick one, it's Strategic Robustness because closed groups can use trust, open groups cannot. Actually, looking at the prompt: "which single requirement does the most to exclude the popular fixes." Popular fixes are usually normative (consultation norms). These fail against *adversaries*. So Strategic Robustness is the key.

  10. **Final Review against Prompt:**
      *   Cases handled? Yes.
      *   Distinctions preserved? Yes.
      *   Formal results consistent? Yes.
      *   Non-negotiable vs. Preference flagged? Yes.
      *   Joint unsatisfiability identified? Yes.
      *   Single exclusionary requirement identified? Yes.

      *Let's write.*
answer: |-
  Below is a specification of desiderata for a normative theory of unilateral action in high-stakes collective contexts. This is not a proposal for a specific governance mechanism, but a meta-theoretical constraint set: any adequate account of the unilateralist's curse must satisfy these conditions to be considered complete.

  ### I. Case Coverage Requirements
  *The theory must generate prescriptions or evaluations across the following structural variations.*

  **1. Asymmetric Stakes Scaling (Non-Negotiable)**
  *   **Requirement:** The theory must explain how the threshold for permissible unilateral action shifts as the downside tail thickens. A model for releasing a blog post cannot be identical to a model for releasing model weights.
  *   **Case:** Releasing a vulnerability exploit (high negative externality) vs. publishing a theoretical alignment paper (low negative externality).
  *   **Rationale:** The original curse argument assumes a symmetric loss function. A robust theory must incorporate risk-weighted expected value, where $P(\text{catastrophe}) \times \text{Cost}$ dominates simple expected value maximization.

  **2. Correlation Sensitivity (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between independent errors and correlated errors among members.
  *   **Case:** A team where everyone read the same flawed safety argument vs. a team with diverse methodological backgrounds.
  *   **Rationale:** The unilateralist's curse relies on the statistical properties of the maximum of $N$ estimates. If estimates are perfectly correlated, the curse vanishes (there is effectively $N=1$). If independent, the bias grows with $N$. A theory that treats these identically fails to capture the epistemic geometry of the problem.

  **3. Strategic Robustness (Non-Negotiable)**
  *   **Requirement:** The mechanism or norm must remain stable when members have incentives to misrepresent their judgments or capabilities.
  *   **Case:** A bad actor pretending to be optimistic to force a release, or a good actor exaggerating risk to block progress (sabotage via veto).
  *   **Rationale:** Most proposed fixes (e.g., "norms of consultation") assume good faith. A theory for AI risk must assume the possibility of adversarial optimization within the group.

  **4. Boundary Permeability (Preference of Open-Source Camps)**
  *   **Requirement:** The theory should ideally handle unknown or fluid group membership.
  *   **Case:** A decentralized open-source project where "members" are anyone with a git commit, vs. a closed lab with an employment contract.
  *   **Rationale:** The curse is most dangerous where capability is distributed (open weights). However, enforcing norms on unknown agents is arguably impossible. This is flagged as a preference because a theory might legitimately conclude that unilateralism is unsolvable in open boundaries, requiring containment instead of governance.

  **5. Reversibility and Time Horizon (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between one-shot irreversible actions and reversible, iterative testing.
  *   **Case:** Deploying a self-replicating agent (irreversible) vs. deploying a localized API (reversible).
  *   **Rationale:** The cost of the curse is largely a function of irreversibility. A theory that treats reversible experiments with the same caution as irreversible deployments is overly conservative; one that treats them identically is reckless.

  **6. Repeated Interaction Effects (Preference of Communitarians)**
  *   **Requirement:** The theory should account for reputation and future cooperation.
  *   **Case:** A researcher who plans to stay in the field vs. an exit-scammer.
  *   **Rationale:** In repeated games, defection from norms can be punished. However, relying on this is a preference for stable communities; it fails in one-shot anonymous contexts (e.g., anonymous model uploads).

  ---

  ### II. Conceptual Distinctions
  *The theory must not collapse the following pairs.*

  **7. Unilateral Action vs. Public Advocacy (Non-Negotiable)**
  *   **Distinction:** The capability to *execute* an outcome vs. the capability to *argue* for it.
  *   **Rationale:** Restricting speech to prevent action is a category error that creates information cascades. A theory must explain how to restrict the *act* (e.g., weights release) without necessarily restricting the *discourse* (e.g., discussing the vulnerability), even though the latter influences the former.

  **8. Epistemic vs. Value Disagreement (Non-Negotiable)**
  *   **Distinction:** Disagreement about $P(\text{outcome})$ vs. disagreement about $U(\text{outcome})$.
  *   **Rationale:** The curse is primarily epistemic (over-optimism). Solutions that impose value homogeneity (e.g., "only those who share our goals may act") address the wrong variable. A theory must handle agents who agree on values but disagree on probabilities.

  **9. Ex Ante vs. Ex Post Evaluation (Non-Negotiable)**
  *   **Distinction:** Judging the decision process at the time of action vs. judging the outcome after the fact.
  *   **Rationale:** Outcome bias. A unilateralist might get lucky (good outcome, bad process) or be cursed (bad outcome, rational process). A governance theory must evaluate the *rule*, not the *realization*.

  **10. Small Aligned Team vs. Large Anonymous Commons (Non-Negotiable)**
  *   **Distinction:** High-trust, low-$N$ groups vs. low-trust, high-$N$ groups.
  *   **Rationale:** Mechanisms that work for a 5-person founding team (e.g., informal consensus) often fail catastrophically when scaled to a global community (e.g., open-source forks). The theory must specify the $N$ and trust threshold where a mechanism breaks.

  **11. Procedural Entitlement vs. Substantive Wisdom (Non-Negotiable)**
  *   **Distinction:** Who has the *right* to decide vs. what is the *correct* decision.
  *   **Rationale:** A member may be procedurally entitled to fork a repo (they have the code) but substantively unwise to do so (it risks safety). The theory must bridge the "is-ought" gap between capability and normativity without relying solely on legal enforcement.

  ---

  ### III. Formal Consistency Requirements
  *The theory must not contradict established results in social choice and epistemology.*

  **12. Consistency with Order Statistics (Non-Negotiable)**
  *   **Requirement:** Must acknowledge that $\max(E_1, ... E_N) > E[\text{True Value}]$ when estimates are unbiased and independent.
  *   **Rationale:** This is the mathematical core of the curse. Any theory claiming the curse is a "myth" or easily solved by "better communication" without adjusting for the max-operator bias is mathematically incoherent.

  **13. Condorcet Jury Theorem Limits (Non-Negotiable)**
  *   **Requirement:** Must recognize that aggregation only improves accuracy if individual competence $p > 0.5$ and errors are independent.
  *   **Rationale:** You cannot vote your way out of the curse if the group is systematically biased or if errors are correlated (see Requirement 2). The theory cannot rely on "democracy" as a panacea.

  **14. Information Cascade Vulnerability (Non-Negotiable)**
  *   **Requirement:** Must account for sequential decision-making where later agents ignore private signals to follow early actors.
  *   **Rationale:** If the first unilateralist acts, others may infer the action was safe and follow suit, compounding the risk. A theory must prevent early actions from becoming focal points that override private caution.

  **15. Agreement Theorem Constraints (Preference of Rationalists)**
  *   **Requirement:** Should ideally explain why Aumann's Agreement Theorem fails in practice (why don't we just update until we agree?).
  *   **Rationale:** If agents are Bayesian and commonize priors, they should converge. The fact that they don't implies computational limits, private information, or value divergence. The theory must specify which barrier is dominant. *Flagged as preference* because a theory could simply posit bounded rationality as a brute fact.

  ---

  ### IV. Impossibility and Trade-Off Analysis

  **16. The Trilemma of Unilateral Governance**
  There is a joint unsatisfiability among three desirable properties in a one-shot, high-stakes setting:
  1.  **Individual Autonomy:** Any capable member may act without external permission.
  2.  **Curse Avoidance:** The group does not systematically undertake risky actions based on outlier optimism.
  3.  **Strategic Robustness:** The system cannot be gamed by adversarial members.

  *   **Proof Sketch:**
      *   To satisfy (2), you must suppress the maximum estimate (e.g., require consensus or lower thresholds).
      *   To satisfy (1), you cannot require consensus (which grants veto power).
      *   If you allow action based on individual judgment (1) but try to mitigate risk (2) via norms (e.g., "only act if very sure"), you violate (3) because an adversary can lie about their certainty.
      *   If you enforce (3) via cryptographic restrictions, you violate (1).
      *   **Conclusion:** You must sacrifice one. Most AI safety proposals implicitly sacrifice (1) (via capability control) or (3) (by assuming good faith).

  **17. The Exclusionary Requirement**
  *   **Which single requirement excludes the most popular fixes?**
      *   **Strategic Robustness (Requirement 3).**
      *   **Why:** The most common proposed remedies for the unilateralist's curse are **normative**: "cultivate a culture of consultation," "adopt a pledge," or "practice epistemic humility."
      *   **Failure Mode:** These fixes rely entirely on good faith. They collapse immediately in the presence of a strategic adversary (a competitor wanting to release first, a malicious actor, or a true believer who values their own judgment over the group).
      *   **Implication:** Any theory that satisfies Strategic Robustness must move beyond *norms* and into *mechanisms* (cryptographic controls, multi-party computation, hardware constraints). This excludes the vast majority of current community-governance discourse, which focuses on social coordination rather than capability constraint.

  **18. Non-Negotiable vs. Camp Preferences Summary**

  | Requirement | Status | Reason |
  | :--- | :--- | :--- |
  | **Bias Correction** | Non-Negotiable | Core definition of the problem. |
  | **Strategic Robustness** | Non-Negotiable | AI risk implies adversarial environments. |
  | **Epistemic/Value Split** | Non-Negotiable | Necessary for diagnostic clarity. |
  | **Boundary Permeability** | Preference | Some theories may legitimately require closed groups. |
  | **Repeated Interaction** | Preference | Safety cannot rely on reputation alone. |
  | **Agreement Theorems** | Preference | Bounded rationality is a valid axiom. |

  ### V. Conclusion for the Drafter

  An adequate theory of the unilateralist's curse cannot simply be a better voting scheme. It must be a **mechanism design problem under epistemic uncertainty.**

  The critical insight for your post should be this: **The Unilateralist's Curse is not a coordination failure; it is a statistical inevitability given distributed capability.** Therefore, any solution that relies on "better coordination" (talk more, vote more) without addressing the *distribution of capability* or the *incentive compatibility* of the actors is mathematically doomed.

  The requirement that does the most work is **Strategic Robustness**. It forces the discussion away from "How do we trust each other?" to "How do we build systems where trust is not required?" This is the pivot from community governance to technical governance.
