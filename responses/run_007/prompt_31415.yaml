      *   *Sentence 1:* The replication crisis is fundamentally a pathology of institutional incentives and selection bias, not a mathematical failure of frequentist null-hypothesis significance testing that would have been cured by adopting Bayesian methods.
      *   *Paragraph 1 (Incentives/File Drawer):* The engine of the crisis is the publication filter. Journals demand novel, positive findings. Under NHST, this means p < .05. Under Bayesianism, this means BF > 10 or a credible interval excluding zero. If the reward structure remains unchanged, researchers will simply hack until they achieve a decisive Bayes Factor instead of a significant p-value. The file drawer fills with "inconclusive" Bayesian analyses just as it did with non-significant p-values, distorting the literature equally.
      *   *Paragraph 2 (Optional Stopping):* Proponents argue Bayesian evidence is robust to optional stopping, but this ignores the decision-theoretic context. While the likelihood principle suggests data collection rules don't invalidate the BF calculation, the *publication rule* does. If a researcher collects data until BF > 3, they are effectively conducting a sequential test with a stopping boundary optimized for publication, not truth. Simulations show that optional stopping based on Bayes Factors can still inflate false discovery rates if the stopping rule is contingent on achieving a specific threshold of evidence favorable to the hypothesis.
      *   *Paragraph 3 (Degrees of Freedom/Priors):* Researcher degrees of freedom do not vanish; they migrate from data cleaning and variable selection to prior specification and model structure. In NHST, a researcher might drop outliers to secure p < .05. In a Bayesian framework, they might select a prior scale parameter that maximizes the Bayes Factor for their desired outcome or choose a model specification that ignores a nuisance parameter known to dampen the effect. "Weak" priors are not neutral; a Cauchy distribution centered at zero with a wide scale can still be manipulated, and the choice of alternative hypothesis model (H1) is often just as flexible as the frequentist test statistic.
      *   *Paragraph 4 (Power and Effect Sizes):* Ultimately, most non-replications stem from original studies being severely underpowered to detect the true, often tiny, effect sizes. Bayesian estimation with weak priors on small samples yields wide credible intervals that acknowledge uncertainty, but if the incentive is to claim a discovery, researchers will focus on the posterior mode or report the probability of direction rather than admitting the data are too noisy to inform the prior. Without preregistration and registered reports to lock down analysis plans, the human tendency to find patterns in noise will exploit any inferential framework available.

