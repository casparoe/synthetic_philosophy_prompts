      *   **Key Mechanisms to Address:** Publication bias, file drawer, p-hacking (optional stopping, undisclosed flexibility), researcher degrees of freedom (migrating to prior/model specification in Bayesian frameworks).
      *   **Concession:** Grant that NHST has real problems.
      *   **Core Thesis:** The crisis is mainly about incentives and selection, not the inferential framework.
      *   **Format:** Lead with the bottom line in the first sentence. No preamble. No restating the question.

  2.  **Determine the Bottom Line (First Sentence):**
      *   Needs to be punchy and direct.
