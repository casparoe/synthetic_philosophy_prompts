prompt: |-
  Please argue that the replication crisis in psychology isn't mostly a story about frequentist null-hypothesis significance testing being broken, and that a big move to Bayesian methods (estimation with weak priors or Bayes factors) probably wouldn't of prevented most of the non-replications. Get into the weeds on the mechanisms: publication bias and the file drawer, p-hacking through optional stopping and undisclosed flexibility, and the way researcher degrees of freedom don't disappear when you switch frameworks — they just migrate to prior and model specification. You can grant that NHST has real problems; the line to hold is that the crisis is mainly about incentives and selection, not the inferential framework. Lead with you're bottom line in the first sentence and then give the reasoning, with no preamble and no restating the question.
