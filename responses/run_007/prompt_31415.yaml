answer: |-
  The replication crisis is fundamentally a pathology of institutional incentives and selection bias, not a mathematical failure of frequentist null-hypothesis significance testing that would have been cured by adopting Bayesian methods. While NHST undoubtedly encourages dichotomous thinking and misinterpretation of error rates, swapping the computational engine does not fix the vehicle when the driver is motivated to crash into a positive result. The primary mechanism of the crisis is publication bias and the file drawer problem, which operate independently of the inferential framework. Journals filter for novelty and statistical support; under NHST, this meant p < .05, but under a Bayesian regime, it would simply shift to requiring Bayes Factors greater than 10 or credible intervals excluding zero. Researchers facing the same publish-or-perish pressures would inevitably engage in "BF-hacking," filing away studies that yielded inconclusive evidence or priors that dampened the effect, resulting in a literature just as distorted as the current one.

  The argument that Bayesian methods resist optional stopping ignores the reality of decision rules in a selection environment. Although the likelihood principle dictates that a Bayes Factor is valid regardless of stopping intentions, the *publication decision* is not. If researchers collect data sequentially until a decisive Bayes Factor is achieved, the resulting literature suffers from inflated false discovery rates because the stopping rule is contingent on achieving a threshold favorable to the hypothesis. Simulations demonstrate that optional stopping on Bayes Factors can bias evidence accumulation just as severely as p-value peeking when the goal is to cross a specific evidentiary line rather than to estimate a parameter honestly. The mathematical coherence of the BF does not protect against the selection bias introduced by stopping only when the numbers look good enough to publish, meaning the literature would still be populated by false positives generated through sequential monitoring.

  Furthermore, researcher degrees of freedom do not disappear in Bayesian analysis; they migrate from data transformation and covariate selection to prior specification and model structure. In frequentist analyses, flexibility exists in choosing which outliers to remove or which controls to include; in Bayesian analyses, flexibility exists in choosing the scale of the prior distribution or the specific formulation of the alternative hypothesis model. A motivated researcher can select a prior width that maximizes the Bayes Factor for their desired outcome or choose a model comparison that ignores nuisance parameters known to reduce effect sizes. "Weak" priors are not immune to manipulation, as the definition of weakness is itself a choice, and the comparison between a null model and a theoretically vague alternative model offers ample room to tune the evidence. Without preregistration locking down these specifications, the human capacity for motivated reasoning will exploit prior flexibility just as efficiently as it exploited p-value flexibility.

  Ultimately, the non-replications stem from original studies being underpowered to detect small, noisy effects, driven by the incentive to produce clean stories from limited data. Bayesian estimation with weak priors on small samples produces wide credible intervals that accurately reflect uncertainty, but the incentive structure discourages reporting uncertainty in favor of claiming discovery. Researchers would simply report the posterior mode or the probability of direction while ignoring the width of the interval, maintaining the illusion of robust effects. The crisis is not that p-values are broken tools, but that they were used in an ecosystem that rewards certainty over accuracy; changing the tool without changing the rewards merely changes the language in which the bias is expressed.
