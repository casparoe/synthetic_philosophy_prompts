      *Refining the Optional Stopping point:* Be careful not to misrepresent Bayesian theory. Bayesians say optional stopping doesn't invalidate the *interpretation* of the BF for a given dataset. But if the *process* is "stop when BF is high," the *set of published BFs* is biased. This is the crucial distinction. The *literature* becomes biased, even if individual BFs are coherent.

