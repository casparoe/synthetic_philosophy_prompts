prompt: |-
  ok here's what i need. i teach an upper-level undergrad game theory course aimed at philosophy students, about 20 people, and we have one 80-minute meeting to spend on Hofstadter's superrationality. i want the session built around the Platonia dilemma and the Luring Lottery, and i want the students to run into the tension themselves before anyone says the word superrationality in the room. no lecture up front. you're an expert on superrationality and on running philosophy seminars, so think carefully, maybe sketch two or three structures first, then commit to one and write it up concrete enough that a TA could run it cold. the goal is for them to feel, not just hear, the difference between standard game-theoretic reasoning (given what everyone else will do, can i do better by switching?) and superrational reasoning (we're symmetric copies of the same reasoning, so the answer has to be the same for all of us before i even know what it is).

  quick recap so the design stays grounded. in the Platonia dilemma a trillionaire tells 20 people that if exactly one of them sends a telegram by noon the next day, that one will recieve a billion dollars; if zero or more than one send, nobody gets anything, and communication is forbidden. the superrational move is to send with probability 1/20, but a game-theoretic player who thinks everyone else is doing that will feel the pull to just send for sure, since that wins whenever none of the other 19 happens to send. in the Luring Lottery (actually run by Scientific American in the 80s) a reader could enter once by sending a postcard with the number 1, or send a single postcard with any larger number to count as that many entries; the prize was a million dollars split across all the entries and awarded to a randomly drawn entry. submitting more entries raises your chance but shrinks the prize for everyone including you, and the expected-value-maximizing number of entries is exactly however many entries everyone else submits, which is the runaway. the superrational move there was to roll a die with as many sides as the expected number of responders and send 1 only on a roll of 1.

  design a runnable in-class activity, not a lecture. give me rules, materials, a payoff scheme that doesnt need real money (points toward something trivial is fine, like choosing the music or skipping a reading), a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the symmetric 1/20 strategy, the unilateral-deviation objection to it, and the lottery's runaway logic. also tell me what will predictably go wrong the first time i run it and how to handle it, and be honest about which part of the real thing a classroom cant reproduce (i suspect the no-communication condition and the stakes, but say what you actually think).
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergrad philosophy students (approx. 20 people). They likely know basic logic, maybe some ethics, but the prompt specifies "game theory course," so they likely know Nash Equilibrium, dominance, expected utility, etc.
      *   **Topic:** Hofstadter's Superrationality.
      *   **Key Concepts:** Platonia Dilemma (exactly one sender wins), Luring Lottery (more entries = higher chance but lower payout, runaway equilibrium).
      *   **Core Tension:** Standard Game Theory (Nash/Best Response to fixed strategies) vs. Superrationality (Symmetric reasoning implies correlated output).
      *   **Constraint:** 80-minute session. No lecture up front. Students must *feel* the tension before the term "superrationality" is introduced.
      *   **Deliverable:** A concrete, runnable activity plan (rules, materials, payoffs, timeline, debrief, troubleshooting) that a TA could run cold.
      *   **Specific Requirement:** Sketch 2-3 structures first, then commit to one.

  2.  **Initial Brainstorming & Structure Sketches:**

      *   *Sketch 1: Sequential Play.* Do Platonia first, discuss, then do Lottery.
          *   *Pros:* Clear separation of concepts.
          *   *Cons:* Takes too long. By the time you get to the Lottery, the "secret" (superrationality) might be out. Also, Platonia is hard to run in class because you can't wait until "noon the next day." You need an instant version.
      *   *Sketch 2: Simultaneous Secret Ballot (Platonia) + Open Shout (Lottery).*
          *   *Pros:* Captures the secrecy of Platonia.
          *   *Cons:* The Lottery needs to demonstrate the *runaway* aspect. If everyone just writes a number, it's abstract.
      *   *Sketch 3: The "Double-Blind" Hybrid.* Run a modified Platonia game where the payoff structure changes mid-stream or where there are two rounds.
          *   *Idea:* Round 1 is Platonia (Exactly one wins). Round 2 is Lottery (Proportional share).
          *   *Refinement:* To make the tension palpable, they need to make a decision, see the result, feel the regret/temptation to deviate, and then do it again or switch games.
          *   *Critical Constraint:* Hofstadter's argument relies on the assumption that everyone is *superrational* (i.e., thinks exactly like me). In a classroom, students know they are *not* identical. This is the biggest hurdle. The activity needs to highlight the *temptation* to defect from the cooperative/superrational strategy even when they know it's "best" for the group.

      *   *Selection:* I will commit to a **Two-Round Simultaneous Choice** structure.
          *   **Round 1 (The Platonia Instant):** "Exactly one person stands up."
          *   **Round 2 (The Luring Lottery Instant):** "Write a number. Prize pool / Total Numbers."
          *   **Why:** This allows direct comparison. Round 1 highlights the coordination problem (1/N probability). Round 2 highlights the arms race (unbounded escalation). Both can be done with paper slips in 10 minutes. The debrief does the heavy lifting on the theory.

  3.  **Developing the Chosen Structure (The "Symmetry Breaker" Plan):**

      *   *Goal:* Make them experience the instability of the Nash Equilibrium vs. the fragility of the Superrational strategy.
      *   *Payoffs:* Needs to be low stakes but meaningful. "Bonus points" or "Choice of next topic." Let's use a "Class Currency" (e.g., "Hofstadters") redeemable for a minor privilege (skip a short reading, pick music).
      *   *The Twist:* To make the "Superrational" tension real, I need to prime them to think alike *without* telling them to. I need to emphasize that they are all taking the *same course*, reading the *same texts*, and are *similarly intelligent*. This sets up the "symmetric reasoners" premise.
      *   *The "Trap":* In Round 1, the Nash Equilibrium is "Everyone Sends" (if you think others randomize, you should definitely send). The Superrational move is "Randomize 1/20". If they play Nash, nobody wins. If they play Superrational, someone *might* win.
      *   *Wait, correction on Nash for Platonia:* In a one-shot Platonia with no communication:
          *   If everyone plays "Don't Send": Payoff 0. Deviation (Send) = Win. (Not NE).
          *   If everyone plays "Send": Payoff 0. Deviation (Don't Send) = 0. (NE, but weak).
          *   Mixed Strategy NE: Everyone sends with $p$. For $N=20$, $p$ is actually quite high in standard Nash terms because you want to maximize the chance *someone* wins? No, standard Nash assumes others' strategies are fixed. If others randomize at $1/20$, my best response is to Send with $p=1$. That's the tension.
      *   *Round 2 (Lottery):* Nash is "Infinity" (or max allowed). Superrational is "1" (or limited).

  4.  **Drafting the Plan Details:**

      *   **Materials:** Slips of paper, pens, a hat/box, whiteboard.
      *   **Timeline:**
          *   0-5: Setup & Stakes.
          *   5-20: Round 1 (Platonia).
          *   20-35: Round 1 Results & Frustration.
          *   35-50: Round 2 (Lottery).
          *   50-65: Round 2 Results & Chaos.
          *   65-80: Debrief & Theory Reveal.
      *   **Debrief:** Map the frustration in Round 1 (nobody won or too many won) to the 1/N logic. Map the explosion in Round 2 to the runaway logic. Introduce "Superrationality" as the label for the strategy they *wished* they could coordinate on.

  5.  **Refining the "TA-Runnable" Aspect:**
      *   Instructions must be script-like.
      *   Ambiguity is the enemy.
      *   Need to handle the "But we aren't actually identical!" objection during the debrief.
      *   Need to address the "No Communication" rule strictly.

  6.  **Addressing the "What Will Go Wrong" Section:**
      *   *Problem 1:* Someone laughs and writes "1,000,000" in Round 2 immediately.
      *   *Problem 2:* In Round 1, everyone stands up (focal point failure).
      *   *Problem 3:* Students argue they aren't symmetric.
      *   *Solution:* Acknowledge these as *features*, not bugs. They prove the difficulty of superrationality in the real world.

  7.  **Final Polish:**
      *   Ensure the distinction between "Best Response" (Nash) and "Symmetric Output" (Superrational) is clear in the debrief guide.
      *   Make sure the payoff is clear.
      *   Check timing (80 mins is tight for two games + deep debrief). I might need to compress the game play. Let's make the games very fast. 5 mins per game setup/play, 10 mins per result discussion.
      *   *Self-Correction on Timing:* 80 minutes is actually generous for 20 students if managed well. I will allocate more time to the debrief because that's where the philosophy happens.

  8.  **Final Review against constraints:**
      *   No lecture up front? Yes.
      *   Platonia & Lottery included? Yes.
      *   Tension felt before term introduced? Yes.
      *   Concrete enough for TA? Yes.
      *   Troubleshooting included? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the Platonia Nash Equilibrium explanation. In a one-shot game where you maximize individual expected utility:
      If everyone else plays $p$, my expected utility for Sending is $(1-p)^{19} \times \$1B$. My EU for Not Sending is $0$. So I should always Send.
      The only way Not Sending is viable is if I care about the *group* outcome or if I assume my decision *correlates* with theirs.
      The activity needs to make them feel the pull of "I should just send/write a big number" vs "If we all do that, we lose."

      Let's refine the Lottery payoff. If the prize is fixed (e.g., 100 points) and divided by total entries, writing $N$ entries gives you share $N / \sum N$. If everyone writes $k$, your share is $k / (20k) = 1/20$. If you write $2k$ and others write $k$, your share is $2k / (21k + k) \approx 2/21 > 1/20$. So deviation is always rewarded. This creates the runaway.

      Okay, ready to write.

      *Structure Selection:* I will present the "Two-Round Symmetry Trap" as the committed plan.
      *Sketches:* I will briefly outline the "Sequential" and "Role-Play" options in the beginning to satisfy the prompt's request to "sketch two or three structures first."

      *Wait, one more thing:* The prompt asks for "concrete enough that a TA could run it cold." I need to write the instructions the TA reads verbatim.

      *Payoff:* Let's use "Exemption Tokens." One token = skip one short reading response. Total pool = 5 tokens. This creates scarcity without needing money.

      *Debrief:* Must explicitly map:
      1. Platonia -> 1/N randomization.
      2. Deviation temptation -> Nash Best Response.
      3. Lottery -> Runaway/Infinite escalation.
      4. Superrationality -> The assumption of isomorphic reasoning.

      *Limitations:* Acknowledge that in class, they *know* they aren't identical. Hofstadter's thought experiment requires a stronger metaphysical claim about reason than a classroom possesses.

      Let's assemble.
answer: |-
  Here are three structural sketches for the session, followed by the committed lesson plan.

  ### Structural Sketches

  **Option 1: The Sequential Deep-Dive**
  *   **Structure:** Spend 40 minutes on Platonia, debrief, then 40 minutes on Luring Lottery.
  *   **Pros:** Allows deep analysis of each game individually.
  *   **Cons:** Risks "spoiling" the second game during the first debrief. Once students hear "randomize 1/N," they will try to apply that to the Lottery, muddying the specific tension of the runaway escalation. It also leaves little time for the final synthesis of *why* these two games point to the same philosophical conclusion.

  **Option 2: The Role-Play Simulation**
  *   **Structure:** Assign students roles (e.g., "Cautious Carl," "Greedy Gina," "Logic-Bot") and have them play the games according to scripts.
  *   **Pros:** Controls the variables; guarantees specific outcomes for discussion.
  *   **Cons:** Removes the *personal* tension. Students won't feel the pull to defect if they are just following a script. The goal is for them to feel the irrationality of rationality in their own bones, not observe it in puppets.

  **Option 3: The "Symmetry Trap" (Selected)**
  *   **Structure:** Two rapid-fire, simultaneous-move rounds using the actual class as the players. Round 1 is Platonia (Coordination/Scarcity). Round 2 is Luring Lottery (Escalation/Tragedy). No theory is named until the final 20 minutes.
  *   **Pros:** Maximizes personal stake and tension. The contrast between the two rounds highlights the different failure modes of standard rationality (coordination failure vs. arms race). It creates a "data set" from their own behavior to analyze during the debrief.
  *   **Cons:** Requires strict proctoring to prevent communication. Outcomes are stochastic (Round 1 might result in 0 winners or 5 winners), which requires flexible debriefing.

  ***

  # Lesson Plan: The Symmetry Trap
  **Topic:** Hofstadter's Superrationality (Platonia & Luring Lottery)
  **Time:** 80 Minutes
  **Class Size:** 20 Students
  **Instructor Load:** Low (TA can run this verbatim)

  ## I. Learning Objectives
  By the end of the session, students will:
  1.  Experience the instability of Nash Equilibria in symmetric games without communication.
  2.  Distinguish between *causal* decision theory (my choice doesn't affect theirs) and *acausal* decision theory (my choice correlates with theirs because we reason alike).
  3.  Articulate why "superrationality" requires a stronger assumption of symmetry than standard game theory allows.

  ## II. Materials & Payoffs
  *   **Materials:** 40 small slips of paper (2 per student), 1 collection box/bag, whiteboard/markers.
  *   **Payoff Scheme:** **"Exemption Tokens."**
      *   The class pool starts with **5 Tokens**.
      *   A Token allows a student to skip one short reading response assignment later in the term.
      *   *Note:* Using a shared pool creates group tension without requiring the instructor to spend money.
  *   **Room Setup:** Students seated so they cannot easily see each other's papers.

  ## III. Minute-by-Minute Timeline

  ### 0:00 – 0:05 | Setup & Stakes (The "Black Box")
  **TA Script:**
  "Put away your phones and books. Today is not a lecture. It is an experiment. We are going to play two games. The rules are absolute. There is no talking, no signaling, no eye contact during decision phases. If you break silence, you are disqualified from winnings.

  We have a pool of 5 Exemption Tokens. These are real. You can use them to skip a reading response. How these tokens are distributed depends entirely on the slips of paper you hand me in the next hour.

  You are all students in this specific course. You have read the same texts, heard the same lectures, and presumably possess similar reasoning capacities. Keep that similarity in mind. It matters."

  ### 0:05 – 0:20 | Round 1: The Platonia Instant
  **TA Script:**
  "Take one slip of paper. On it, you must write either **YES** or **NO**.

  Here is the rule for Round 1:
  If **exactly one** person in this room writes YES, that person receives **3 Exemption Tokens** for themselves.
  If **zero** people write YES, or if **more than one** person writes YES, **nobody gets anything**. The tokens vanish.
  You cannot communicate. You have 2 minutes to decide. Fold the paper. I will collect them."

  *(TA collects papers silently. While counting, TA writes the results on the board: Total YES = __)*

  **Activity:**
  *   Count the "YES" slips.
  *   **Scenario A (0 YES):** "Nobody took the risk. The pot is lost."
  *   **Scenario B (1 YES):** "One person won. Everyone else got nothing."
  *   **Scenario C (2+ YES):** "Too many people took the risk. The pot is lost."
  *   *Note:* Scenario C is the most likely outcome in a naive class and provides the best tension for the debrief.

  ### 0:20 – 0:25 | The First Itch (Mini-Discussion)
  **TA Script:**
  "Look at the result.
  If you wrote NO: Do you regret it? If you had written YES, would you have won? (Only if exactly one other person said YES).
  If you wrote YES: Do you regret it? Why did you think you would be the *one*?
  Turn to a neighbor for 60 seconds. Do not discuss strategy for the next round yet. Just discuss: Was your decision based on what *you* wanted, or what you thought *everyone else* would do?"

  *(Allow 1 min chatter. Regain silence.)*

  ### 0:25 – 0:40 | Round 2: The Luring Lottery
  **TA Script:**
  "Take your second slip of paper.
  For Round 2, the 2 remaining Exemption Tokens are in the pot.
  On this paper, write any **positive whole number** (1, 2, 100, 1,000,000). This number represents your 'entries' into a lottery.

  Here is the rule:
  Your share of the tokens is determined by your number divided by the **total sum of all numbers** written by the class.
  Formula: **(Your Number / Total Class Sum) × 2 Tokens**.
  If you write a higher number, you get a larger slice of the pie.
  However, the pie does not grow. The total tokens available are fixed at 2.
  You have 3 minutes. Write your number. Fold it. I will collect."

  *(TA collects papers. This takes time. TA sums the numbers on the board. This usually results in a massive number.)*

  **Calculation:**
  *   Calculate the total sum (e.g., 500,000).
  *   Calculate a few students' payouts live.
  *   *Likely Outcome:* Someone wrote a huge number (e.g., 1,000,000). They take almost the whole pot. Everyone who wrote '1' gets effectively zero.
  *   *Distribute the tokens* (or record who won).

  ### 0:40 – 0:50 | The Frustration Phase
  **TA Script:**
  "Look at the payouts.
  In Round 1, many of you likely thought: 'If everyone randomizes, we have a chance.' But then you thought: 'If they randomize, I should definitely say YES to grab the win.'
  In Round 2, many of you likely thought: 'If we all write 1, we split evenly.' But then you thought: 'If they write 1, I should write 2 to double my share.' And then: 'If they write 2, I should write 4.'

  Raise your hand if you felt tempted to increase your number in Round 2 after thinking about what others might do.
  Raise your hand if you felt tempted to switch from NO to YES in Round 1 for the same reason.

  Keep that feeling. That tension is the entire lecture. You may now talk."

  ### 0:50 – 1:20 | Debrief & Theory Reveal (The "Lecture" Portion)
  *The TA now shifts from referee to instructor. Use the whiteboard.*

  **Part 1: Mapping Round 1 (Platonia)**
  *   **The Math:** "In Round 1, the 'Superrational' move is to randomize. Specifically, with 20 people, you should say YES with probability 1/20. Why? Because if we are all identical reasoners, we will all choose the same strategy. If we all choose 'Always YES', we lose. If we all choose 'Always NO', we lose. If we all choose '1/20 Chance YES', the probability of exactly one winner is maximized."
  *   **The Tension:** "But standard Game Theory (Nash) asks: 'Given that everyone else is doing 1/20, what should *I* do?' If everyone else is rolling a 20-sided die, your best move is to **Always Say YES**. You win whenever none of them hit. This is the **Unilateral Deviation**. Standard rationality destroys the cooperative outcome."

  **Part 2: Mapping Round 2 (Luring Lottery)**
  *   **The Math:** "In Round 2, if everyone writes '1', we all get 1/20th of the tokens. But if everyone writes '1', my best move is to write '2'. I double my share. But if I think that, everyone thinks that. So we all write '2'. Then I should write '4'. This is the **Runaway Equilibrium**. The Nash Equilibrium is infinity. Everyone writes the maximum possible number, and the payout per person approaches zero."
  *   **The Superrational Fix:** "Hofstadter argues that if we are truly symmetric reasoners, I cannot decide to write '2' without assuming you will also decide to write '2'. Therefore, I must choose the number that, if chosen by *everyone*, yields the best result. That number is 1."

  **Part 3: The Philosophical Hook**
  *   **Question:** "Why is this controversial?"
  *   **Answer:** "Standard Causal Decision Theory says: 'My choice cannot physically force yours. We are separate people.' Superrationality says: 'Our reasoning processes are isomorphic. The output of the function "Reasoning" given "Input: Game" must be the same for both of us.' It treats your decision as *evidence* of mine, not just a causal input."

  ### 1:20 – 1:25 | Closing
  "Next week, we read Hofstadter's 'The Prisoner's Dilemma and Computer Tournaments.' Bring your frustration from today's games with you. Class dismissed."

  ***

  ## IV. Troubleshooting: What Will Go Wrong
  *Be honest with the TA about these scenarios.*

  **1. The "Joker" Problem (Round 2)**
  *   **What happens:** One student writes "1,000,000,000" just to break the game.
  *   **Impact:** They win almost everything. The class gets angry.
  *   **Handling:** **Do not scold them.** This is a feature, not a bug. In the debrief, point to them: "This person played the Nash Equilibrium perfectly. They assumed everyone else would be 'nice' (write 1) and exploited it. This proves why Superrationality is unstable in a world of non-superrational agents."

  **2. The "Zero Winners" Problem (Round 1)**
  *   **What happens:** Everyone writes NO.
  *   **Impact:** Students feel safe, no tension.
  *   **Handling:** Ask: "Why didn't anyone take the risk?" Guide them to see that they all reasoned: 'If I say YES, I risk ruining it for everyone, so I won't.' Then ask: "But if everyone reasons that, nobody wins. Isn't that also a failure?" This highlights the coordination failure.

  **3. The "We Aren't Identical" Objection**
  *   **What happens:** During debrief, a student says, "But I know Sarah thinks differently than me, so I can't assume she'll copy my strategy."
  *   **Handling:** Acknowledge this is the **primary criticism** of Superrationality. Hofstadter's model works best for AI or perfect logicians. In humans, it relies on *trust* in shared rationality. Ask the class: "Is it rational to act as if you are symmetric, even if you aren't sure? Or is that just wishful thinking?"

  ## V. Limitations of the Classroom Simulation
  *Include this in your TA briefing notes so they don't overpromise.*

  1.  **The Stakes:** Exemption tokens are not $1 billion. Students might not feel the true weight of the Platonia Dilemma. *Mitigation:* Emphasize that the *logic* holds regardless of stake size.
  2.  **The Symmetry:** In Hofstadter's thought experiment, the agents are *guaranteed* to be identical reasoners. In class, students know they are distinct individuals with different risk tolerances. This makes the "Superrational" move feel like magic or faith rather than logic. *Mitigation:* Frame Superrationality not as "magic telepathy" but as "acting on the logical necessity that if reason dictates X for me, it dictates X for you."
  3.  **Communication:** It is impossible to fully prevent eye-rolling or sighing in a classroom. *Mitigation:* Tell the TA to stand at the front and maintain eye contact with the room during the decision windows to discourage side-signaling.

  ## VI. TA Cheat Sheet (Key Concepts for Debrief)
  *   **Nash Equilibrium:** "Given what you are doing, I cannot do better by switching." (Leads to runaway in Lottery, failure in Platonia).
  *   **Superrationality:** "Given that we reason the same way, we must arrive at the same answer." (Leads to 1/20 randomization in Platonia, '1' in Lottery).
  *   **Causal vs. Evidential:** Standard theory says my choice doesn't *cause* yours. Superrationality says my choice is *evidence* of yours because we run the same mental software.
  *   **The "Luring" aspect:** The Lottery is called "Luring" because the rules *invite* you to escalate. It lures you into rationality that destroys value.
