      *   *Narrow Context:* Bartender sees drunk person; AI sees text prompt (limited context).
      *   *Duty of Care:* Bartender has legal/moral duty not to serve drunk people; AI has alignment/safety guidelines.

  3.  **Identify Disanalogies (Breakdown Points):**
      *   *Relationship Depth:* Bartender knows the patron physically (slurred speech, stumbling). AI only knows text (unless multimodal, but still limited).
      *   *Expertise:* Bartender knows alcohol effects. AI knows... what? General knowledge? Does it know *this* user's specific situation?
      *   *Agency/Override:* Bartender physically withholds drink. AI can refuse text, but can it "override" in a meaningful way?
      *   *Consent/Contract:* Going to a bar implies accepting rules. Using AI implies Terms of Service, but expectations differ (tool vs. service).
      *   *Harm Definition:* Alcohol harm is well-defined (poisoning, DUI). AI harm is vague (psychological distress, bad advice, enabling delusion).
