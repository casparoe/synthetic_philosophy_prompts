answer: |-
  You have identified one of the most persistent and fertile problems in modern moral philosophy. There is no single, universally settled technical term like "gravitational lensing" that covers this exact configuration, but there is a tight cluster of concepts that map onto it.

  The closest established idiom is indeed Bernard Williams's **"one thought too many."** However, to capture the full nuance of the *deliberative defect* (rather than just the justificatory intrusion), you need to triangulate Williams with Michael Stocker's **"moral schizophrenia"** and Nomy Arpaly's work on **"moral fetishism."**

  Here is a precise carving of the concept, its established labels, its boundaries, and its relationship to nearby ideas.

  ---

  ### 1. The Established Labels

  #### A. "One Thought Too Many" (Bernard Williams)
  In *Persons, Character and Morality* (1981), Williams describes a man who saves his wife from drowning. If he justifies this by saying, "She is my wife," Williams finds this acceptable. If he justifies it by saying, "In this situation, it is permissible to save one's wife," Williams says this is **one thought too many**.

  *   **Scope:** Williams specifically targeted the intrusion of *impartial moral theory* (like utilitarianism or Kantianism) into *personal projects and relationships*.
  *   **Fit for your cases:** It fits your second example (the drowning child) perfectly. It fits the first (the sick friend) well, provided the calculation is seen as an appeal to impartial duty/utility rather than friendship.
  *   **Limitation:** Williams was concerned with *justification* and *integrity*. He was arguing that morality shouldn't demand we step outside our personal commitments to validate them. Your query is slightly broader: it concerns the *psychological process* of deliberation itself, even if no impartial theory is explicitly invoked (e.g., calculating social costs).

  #### B. "The Schizophrenia of Modern Ethical Theories" (Michael Stocker)
  In his 1976 paper of that title, Stocker argues that modern theories separate the *motive* (why I act) from the *justification* (why the act is right). If you visit a friend in the hospital *because it is your duty* (or maximizes utility), rather than *because you care for them*, you are alienated from the value of the friendship.

  *   **Scope:** This captures the **motivational defect**. Stocker argues that an agent who acts rightly but for the "wrong" internal reason suffers a kind of spiritual malaise.
  *   **Fit for your cases:** This is the strongest fit for your first example (the utility calculation). It names the disconnect between the *content* of the action (friendship) and the *content* of the deliberation (calculation).

  #### C. "Moral Fetishism" (Nomy Arpaly / Michael Smith)
  In *Unprincipled Virtue* (2003), Arpaly distinguishes between acting *de re* (because of the features that make the act right, e.g., "she is suffering") and *de dicto* (because the act falls under the description "right," e.g., "this maximizes utility").

  *   **Scope:** Arpaly argues that acting *de dicto* (wanting to do the Right Thing) is actually less praiseworthy than acting *de re* (responding to the moral features directly). She calls an excessive focus on "rightness" itself a form of **moral fetishism**.
  *   **Fit for your cases:** This provides the technical machinery for your intuition. The defect is that the agent is responding to the *label* ("obligation," "utility") rather than the *feature* ("suffering," "child").

  ---

  ### 2. A Precise Definition

  Since no single term captures the *deliberative path* specifically, if you wish to carve this out as a distinct concept, I propose the term **"Deliberative Alienation"** or **"Motivational Mediation."**

  Here is a precise definition based on your pattern:

  > **Deliberative Alienation** occurs when an agent performs a morally correct action, but the deliberative process required to reach that action mediates the agent's relationship to the moral features of the situation in a way that undermines the moral value of the agency.
  >
  > **Conditions:**
  > 1.  **Action-Concordance:** The external action matches what morality requires.
  > 2.  **Mediated Access:** The agent accesses the reason for action through a theoretical or calculative framework (utility, duty, permission) rather than directly through the salient moral features (pain, love, relationship).
  > 3.  **Value Deficit:** The resulting action lacks a specific kind of moral worth (praiseworthiness, warmth, integrity) that would have been present had the deliberation been direct.

  ---

  ### 3. Boundaries and Edge Cases

  To use this concept rigorously, you must know where it applies and where it does not. The defect is not "thinking" per se; it is thinking *of the wrong kind in the wrong context.*

  #### Where the Defect Applies (The Core)
  *   **Intimate Relationships:** As in your examples. Love and friendship are constitutively non-calculative. To calculate is to misunderstand the nature of the relationship.
  *   **Habitual Virtue:** If a virtuous person must stop to calculate whether lying is wrong, they are not yet fully virtuous (Aristotle's *phronesis*). The virtuous agent sees the truth and speaks it; the calculator weighs the costs.
  *   **Emergency/Instinct:** In high-stakes, immediate scenarios (saving a drowning child), deliberation indicates a lack of immediate identification with the value at stake.

  #### Where the Defect Does *Not* Apply (The Boundaries)
  *   **Tragic Conflicts:** If a parent must choose between saving their child or saving five strangers, deliberation is *required*. Here, the "one thought" is necessary because the moral features conflict. The defect only appears when the path is clear but the agent chooses to calculate anyway.
  *   **Institutional Roles:** A judge sentencing a defendant *should* deliberate impartially. If the judge sentences based on "immediate feeling," that is a defect. The "calculative stance" is a feature, not a bug, in impersonal institutional contexts.
  *   **Moral Development:** A learner might need to calculate ("Is this honest?") before it becomes second nature. The defect applies to the *competent* agent, not the novice.
  *   **The Kantian Counter-Claim:** It is crucial to note that a Kantian would reject your premise. For Kant, acting *from duty* (the calculation/rationale) is the *only* way to have moral worth. Acting from inclination (love) has no moral worth. Your concept presupposes a Virtue Ethics or Care Ethics framework where *motives* contribute to the *goodness* of the act, not just the rightness.

  ---

  ### 4. Relation to Nearby Concepts

  *   **Integrity (Williams):** Integrity is the broader state of being whole. Deliberative Alienation is a specific *threat* to integrity. When you calculate the utility of visiting a friend, you fragment yourself into a "moral calculator" and a "friend," rather than being a unified agent.
  *   **Alienation (Marx/Scheffler):** Usually refers to alienation from the *product* of labor or from one's *commitments* due to moral demands. Deliberative Alienation is internal; it is alienation from one's own *reasons*.
  *   **Supererogation:** This is about going above duty. Your pattern is about meeting duty but in the "wrong way."
  *   **Moral Luck:** This is about factors outside control. Your pattern is entirely internal to the agent's psychology.

  ### 5. Summary Recommendation

  If you are writing or speaking to a philosophical audience:
  1.  Use **"One Thought Too Many"** as the cultural shorthand. Everyone knows it, and it points immediately to Williams's drowning husband case.
  2.  Qualify it with **Stocker's "Schizophrenia"** to emphasize the split between motive and justification.
  3.  If you need a technical term for the *deliberative mechanism* itself, use **"Mediated Moral Motivation"** or **"De Dicto Moral Motivation"** (per Arpaly).

  If you are carving this out as a new concept for a specific argument:
  Define it as **"Deliberative Alienation."** This distinguishes it from Williams's focus on *justification* and places the weight where you want it: on the *process of thinking* as the locus of the moral flaw.

  **The precise configuration you are looking for is:**
  *The intrusion of a second-order moral justification into a first-order moral response, where the presence of the justification signals a failure of character or relationship, despite the correctness of the resulting action.*
