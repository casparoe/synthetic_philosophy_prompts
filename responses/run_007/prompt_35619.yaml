      *   *Counter:* But the deprivation of death happens *after* existence stops. The deprivation of betrayal happens *during* existence.
      *   *So the Epicurean can resist (8).* The reasoning in (1)-(5) does *not* apply to secret betrayal in the same way it applies to death.
