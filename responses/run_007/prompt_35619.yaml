      *   User asks: If the Epicurean says betrayal is bad because it sets back interests you have *while alive*, why can't death be bad because it frustrates the interest in continued life *while alive*?
      *   This is the "Desire Satisfaction" or "Interest Frustration" account of harm (e.g., Joel Feinberg, Thomas Nagel).
      *   *Epicurean Response:* The Epicurean must deny that frustration of an interest counts as harm *unless* it is experienced or unless the subject exists at the time of the frustration's *effect*.
      *   *Nagel's View:* Harm is a setback to interests. You can be harmed without knowing it. Death is a setback to the interest in living. Therefore death is bad. (This rejects Premise 1).
