      *   *Analysis:* The Epicurean argument relies on *existence*, not *experience*. The extension relies on *experience*.
      *   *Correction:* If the argument is about *existence*, secret betrayal is fine (you exist when betrayed). If the argument is about *experience*, then death is bad (you existed when you had the interest in living), but so is secret betrayal.
