  ok so ive been going down a rabbit hole reading about decision theory puzzles and i found this thing called the absent-minded driver problem. i think i get the basic setup — driver at a bar, two exits on the way home, first exit is bad second is good, but the driver is absent-minded and whenever theyre at an exit they cant remember if they already passed the first one or not. so they have to decide what to do at each exit without knowing which one theyre at.

  but heres what i dont understand. theres two ways of looking at it. before leaving the bar, you can plan a strategy — like "exit with probability 1/3 at each exit" — and you can calculate the expected payoff of the whole plan. and theres a specific probability that maximizes it. but then when youre actually AT an exit, you have to decide what to do right then, and given your information state (which is the same at both exits), the principle of maximizing expected utility seems to tell you to do something — and apparently that something is different from what the optimal plan said?

  and i dont get WHY they come apart. like is it that the plan is choosing a policy but the action is choosing an individual act? is it that theres a consistency condition that links your choice at exit 1 to your choice at exit 2 (since theyre the same decision problem from your perspective) and that creates a kind of fixed point problem? or is the whole thing just a trick about how you define the probability space?

  also i keep hearing that this is specifically a problem for causal decision theory but not for evidential or functional decision theory and i have no idea why. could you walk me through what the actual deep issue is here, not just the solution but why the problem is hard in the first place?
