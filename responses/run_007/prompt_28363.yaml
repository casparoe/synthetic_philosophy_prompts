answer: |-
  Your framework is structurally sound except for a critical contradiction between your welfare-based defense of sweatshop purchasing and your exploitation-based condemnation of price gouging.

  Commitments (1), (3), (4), and (5) form a coherent liberal structure: (1) establishes a presumption of liberty, while (5) and (3) define specific exceptions where markets are morally or legally bounded, with (4) providing the necessary theoretical justification (exploitation) to override the presumption in (1) without collapsing into paternalism. Commitment (6) is compatible with all others as it concerns private moral action rather than legal coercion or universal permissibility. The apparent tensions between (1) and (5) and between (1) and (3) dissolve once you recognize that "presumptively" in (1) invites the exact defeaters provided by (4) and (5); no revision is needed there.

  The genuine tensions lie exclusively with commitment (2), which clashes with your other principles regarding vulnerability and exploitation. I order these tensions by severity as follows:

  1.  **(2) vs. (4) [Severe]:** This is a foundational logical conflict. (2) asserts that mutual benefit relative to alternatives is *sufficient* to make sweatshop purchasing permissible, while (4) asserts that mutual benefit is *insufficient* to guarantee permissibility if exploitation is present. You cannot hold that benefit shields sweatshops from moral critique while simultaneously holding that benefit does not shield price gougers from moral critique.
  2.  **(2) vs. (3) [Moderate]:** This is a consistency conflict regarding vulnerability. In (3), you argue that a buyer's desperation (disaster) makes high prices wrongful; in (2), you argue that a worker's desperation (poverty) makes low wages permissible. Without a distinguishing principle, this looks like arbitrary special pleading for employers.

  The least costly revision is to qualify (2) to align it with (4) and (3). You should revise (2) to state: "Buying goods produced in sweatshops is not wrong when the jobs are better than the workers' actual alternatives *and the employer does not take unfair advantage of the workers' desperation to capture disproportionate surplus.*" This revision preserves your intuition that blocking sweatshops harms workers but acknowledges the principle in (4) that benefit alone does not immunize a transaction from exploitation claims. It resolves the tension with (3) by distinguishing between *creating value* for the vulnerable (employment) versus *extracting value* from the vulnerable (gouging), allowing you to maintain that the former is permissible while the latter is not.
