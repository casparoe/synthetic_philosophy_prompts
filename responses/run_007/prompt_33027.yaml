answer: |-
  This is a classic high-stakes workshop scenario. You're attacking a entrenched position (Flicker) with a "burden-shifting" argument (show me why *this* alternative matters). The Flicker strategist's job is to make you prove a negative (that *no* relevant alternative exists), while your job is to show their positive account is circular.

  Here is your Q&A Prep Sheet. I've ordered these by potential damage to your thesis, starting with the kill-shot.

  ### 1. The Flicker Expert (The "Robustness" Trap)
  **Likely Phrasing:** "You claim the surviving alternatives (like 'deciding on one's own' vs. 'being forced') aren't *robust* enough to ground responsibility. But isn't your definition of 'robust' just 'an alternative that would ground responsibility'? If so, aren't you just defining PAP out of existence rather than arguing against it? How do you specify robustness without begging the question?"

  **Your 2-Minute Reply:**
  "That's the exact hurdle I'm trying to clear, and I grant it's the hardest part. I'm not defining robustness *as* 'responsibility-grounding.' I'm defining it functionally: an alternative is robust if it offers the agent a genuine opportunity to avoid *blame* (or praise) for the actual outcome.
  My argument is that in standard Frankfurt cases, the flicker (e.g., the neural sign preceding the decision) doesn't offer an opportunity to avoid blame. If the agent flickers toward the 'forced' path, they are still blamed for the action if it occurs. The alternative is merely a difference in the *causal history*, not a difference in the *normative status* of the outcome.
  I'm not saying no story *could* work. I'm saying the existing stories (like Widerker's or Ginet's) rely on the intuition that *any* alternative matters. But if we press them on *why* that specific alternative matters for blame, they appeal to PAP itself. That's the circularity. I need them to give me a reason why 'deciding on one's own' protects you from blame if the outcome is identical and unavoidable."

  **Honest Note on Softness:**
  This is the standard counter to your position (the "Capes/Widerker" objection). Your soft spot is that you haven't provided a *positive* account of robustness, only a negative critique of theirs. If they press you to define robustness positively, you might wobble.
  **Pivot:** "I'm offering a constraint on robustness, not a full theory. The constraint is: It must allow the agent to avoid the specific normative judgment in question. The flicker doesn't do that."

  ### 2. The Agent-Causal Libertarian (The "Sourcehood" Objection)
  **Likely Phrasing:** "You say the flicker is just a neural sign or a manner of decision. But for an agent-causalist, the difference between 'causing it myself' and 'being caused to do it' is the *only* thing that matters. That flicker *is* the exercise of agent-causal power. If that alternative exists, doesn't that mean the agent *could* have been the ultimate source, which is all PAP requires?"

  **Your 2-Minute Reply:**
  "I appreciate that distinction, and I agree sourcehood is vital. But in the Frankfurt case, the setup ensures that if the agent *doesn't* exercise that power, the outcome happens anyway via the backup mechanism.
  So, the alternative isn't 'I could have done otherwise.' It's 'I could have *caused* the same thing otherwise.'
  If responsibility tracks sourcehood, fine. But PAP is about *Alternative Possibilities*, not just Sourcehood. If the flicker theorist says 'The possibility of being the source is the alternative possibility,' they are conflating Sourcehood with Leeway.
  My point is: If the outcome is inevitable, does the *mode* of causation really give you the *freedom to do otherwise* in the sense PAP defenders historically cared about? If you say yes, you've changed PAP from 'could have done otherwise' to 'could have originated otherwise.' That's a revision of PAP, not a defense of it."

  **Honest Note on Softness:**
  Agent-causalists are willing to revise PAP. They might just say, "Fine, we revise PAP." This doesn't destroy your argument, but it concedes the terminological battle.
  **Pivot:** "If you revise PAP to mean 'Alternative Sourcehood,' we might agree. But that's not the PAP that challenged compatibilism originally."

  ### 3. The Event-Causal Libertarian (The "Causal Path" Objection)
  **Likely Phrasing:** "Even if the outcome is the same, the causal path is different. In one world, I choose; in the other, I am manipulated. Isn't the ability to access the 'choice' path rather than the 'manipulation' path a significant alternative possibility? Why is that irrelevant?"

  **Your 2-Minute Reply:**
  "It is significant for *dignity*, perhaps, or for *autonomy*. But is it significant for *moral responsibility* in the sense of blameworthiness for the *action*?
  Imagine I murder someone. In World A, I choose it. In World B, a neuroscientist forces me. I am only responsible in World A.
  But in the Frankfurt case, the neuroscientist *doesn't* intervene. I choose it. The fact that I *could* have entered World B (where I am forced) doesn't change my responsibility in World A.
  The flicker theorist says the *availability* of World B matters. I'm saying: If I'm in World A, and World B involves me being less free (forced), why does the *possibility* of being less free make me *more* responsible? Usually, having fewer options restricts responsibility, it doesn't ground it."

  **Honest Note on Softness:**
  This relies on the intuition that "possibility of coercion" isn't a valuable freedom. Some libertarians disagree. They think the *ability to trigger the intervention* is a form of control.
  **Pivot:** "Control over what? Over being forced? That's not control over the action."

  ### 4. The Reasons-Responsiveness Compatibilist (The "So What?" Objection)
  **Likely Phrasing:** "I'm sympathetic, but aren't we all just fighting over intuitions about thought experiments? If the agent is reasons-responsive in the actual sequence, who cares about the flicker? Why are we still spending capital on PAP?"

  **Your 2-Minute Reply:**
  "I actually agree with you that the Actual Sequence is where the action is. But the Libertarian camp still holds PAP as a non-negotiable constraint.
  As long as PAP is the gatekeeper for free will in the broader dialectic, we have to settle whether Frankfurt cases kick it down.
  If I can show the Flicker strategy fails, I force the Libertarian to either abandon PAP or admit that 'alternatives' can be trivial. Either way, it helps your camp by weakening the Leeway requirement. So, I'm doing the dirty work so we can get to the Reasons-Responsiveness part of the conversation."

  **Honest Note on Softness:**
  They might think you're wasting your time. Don't let them dissolve your project.
  **Pivot:** "It's dialectical necessity. We can't ignore PAP until it's dead."

  ---

  ### What to Concede Upfront
  In your opening or early clarification, concede this to look reasonable:
  1.  **Concede that *some* alternatives matter:** "I am not arguing that *no* alternative possibilities ever matter for responsibility. If I could have stayed home instead of coming here, that matters. I am arguing specifically about the *residual* alternatives in Frankfurt cases."
  2.  **Concede the burden is heavy:** "I know asking for a non-question-begging account of robustness is a high bar. But if PAP is to be a substantive principle, it must clear that bar."

  ### The Nightmare Question (Pray Nobody Asks This)
  **The Question:** "If the flicker is truly irrelevant to responsibility, why does its *absence* in the coercion sequence explain the *loss* of responsibility there? If the difference between the Actual Sequence and the Coerced Sequence is just the flicker, and the flicker is irrelevant, then the agent should be equally responsible in both. But they aren't. So the flicker *must* be doing explanatory work."

  **Why it hurts:** This attacks the symmetry of your view. You say the flicker doesn't matter for responsibility in the Actual Sequence. But everyone agrees the *lack* of freedom in the Coerced Sequence matters. If the only difference between the two is the flicker, then the flicker *must* be the thing that matters.

  **Emergency Reply:**
  "That's a powerful objection. My response is that the loss of responsibility in the Coerced Sequence isn't due to the *absence of the flicker*, but due to the *presence of the coercive mechanism*.
  In the Actual Sequence, the mechanism is idle. In the Coerced Sequence, it is active.
  The flicker is just a byproduct of the mechanism being idle. It's not the flicker that grounds responsibility; it's the *absence of coercion*. The flicker theorist mistakes the smoke (the alternative possibility) for the fire (the absence of constraint)."

  **Honest Note:** This is a Hail Mary. It distinguishes between the *indicator* of freedom (the flicker) and the *ground* of freedom (no coercion). If they press that the indicator is the only *observable* difference, you might struggle. Stay calm, emphasize "Actual Sequence" properties.

  ### Final Advice
  *   **Don't get bogged down in case details.** (e.g., Jones, Black, the neuron). Keep it structural.
  *   **Validate the Flicker Expert.** "You've written extensively on this, and I know my argument targets your 2012 paper specifically." (Flattery disarms aggression).
  *   **Watch the clock.** If a reply goes over 2 minutes, stop and say, "I'd love to discuss the nuances of that one-on-one."

  You know the material. They know you know the material. The goal isn't to "win" (nobody changes their mind in Q&A), it's to show you can handle the pressure. Good luck.
