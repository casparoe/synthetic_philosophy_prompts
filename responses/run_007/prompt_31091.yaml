answer: |-
  **MEMORANDUM**

  **TO:** Long-Range Capital Planning Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Social Discount Rates for Intergenerational Infrastructure

  ### 1. Executive Summary

  This memo addresses the Committee's charge to recommend a standard discount rate for appraising capital projects with lifespans exceeding 50 years. The current proposal from our economic advisors suggests a constant real discount rate of 4–5 percent, aligned with the private-sector cost of capital. While this rate is appropriate for short-term investments, applying it rigidly to century-scale infrastructure effectively renders long-term benefits negligible in present-value terms.

  This creates a systematic bias against projects that protect future generations from low-probability, high-impact risks (e.g., catastrophic flooding, sea-level rise). To balance economic efficiency with intergenerational equity, I recommend the Authority adopt a **Declining Discount Rate (DDR)** schedule. This approach respects market realities in the near term (0–30 years) while acknowledging ethical obligations and economic uncertainty in the long term (50–100+ years).

  ### 2. Context and Charge

  Our Authority builds assets that outlive their builders. A flood barrier or reservoir constructed today will serve constituents in 2100 who have no voice in today's budget discussions. The discount rate we select is not merely a technical parameter; it is the mathematical expression of how much we value the welfare of those future constituents relative to our own.

  A high discount rate prioritizes current consumption and investment efficiency. A low discount rate prioritizes long-term security and intergenerational equity. The Committee must select a rate that satisfies fiduciary responsibility to current ratepayers without mortgaging the safety of future ones.

  ### 3. The Case for a Market-Based Rate (4–5 Percent)

  Our economic advisors advocate for a discount rate of 4–5 percent. This position rests on two robust pillars: the **Social Opportunity Cost of Capital (SOC)** and **Consumption Smoothing**.

  *   **Efficiency and Opportunity Cost:** Capital is scarce. If the Authority invests $100 million in a flood barrier, that capital is not available for other public services (schools, hospitals) or private investment. If the private sector can generate a 5 percent real return, public investments should arguably meet that hurdle to ensure capital is allocated to its most productive use. A rate below this threshold risks "crowding out" more efficient private investment.
  *   **Revealed Preference:** Market interest rates reflect how individuals actually trade off consumption now versus later. People generally prefer money today to money tomorrow. By using a rate that mirrors this behavior, the Authority aligns its planning with the actual preferences of the citizens it serves.

  **The Strength of this Argument:** It prevents the approval of "white elephant" projects—infrastructure that sounds noble but consumes resources that could yield greater immediate welfare. It imposes fiscal discipline.

  **The Limitation:** This logic assumes a continuous, stable market horizon. Financial markets rarely price risk beyond 30 years. Using a short-term market signal to value a 100-year asset is a category error. Furthermore, a constant 4 percent rate reduces a dollar of benefit in 2100 to approximately **two cents** in present value. This implies that we are effectively indifferent to the welfare of our great-grandchildren, regardless of the magnitude of the risk they face.

  ### 4. The Case for Intergenerational Equity (The Ethical Argument)

  When the timeframe extends beyond a human lifespan, the justification for discounting shifts from *market efficiency* to *ethical weighting*. This is governed by the Ramsey Equation, which decomposes the discount rate ($r$) into three components:

  $$r = \delta + \eta \times g$$

  Where:
  *   $\delta$ (Delta) is the **pure rate of time preference** (how much we discount the future simply because it is the future).
  *   $\eta$ (Eta) is the **elasticity of marginal utility of consumption** (how much less we value an extra dollar as we get richer).
  *   $g$ is the **expected growth rate** of consumption.

  **The Ethical Objection to $\delta$:**
  Economists often include a positive $\delta$ (around 1–2%) to account for impatience or mortality risk. However, as philosopher Derek Parfit and economist Nicholas Stern have argued, "pure time preference" is ethically indefensible when comparing different generations. My mortality is not a valid reason to discount the welfare of a child born in 2080. For public policy affecting distinct generations, $\delta$ should be near zero.

  **The Uncertainty of $g$:**
  The standard model assumes future generations will be significantly wealthier than we are ($g > 0$), meaning a dollar means less to them. While historically true, assuming steady growth over 100 years ignores systemic risks. In my former field of climate modeling, we observed that unchecked environmental degradation can suppress economic growth. If climate damages reduce future growth, the logic for discounting future benefits collapses. Betting on perpetual growth is a risk, not a certainty.

  **The Consequence:**
  If we accept $\delta \approx 0$ and acknowledge uncertainty in $g$, the appropriate discount rate for the distant future drops significantly (often to 1–2 percent). At 2 percent, that same dollar in 2100 is worth **14 cents** today—seven times more valuable than at the 4 percent rate. This fundamentally changes which projects are viable.

  ### 5. Risk and Uncertainty

  There is a third, technical argument for lowering the long-term rate: **Uncertainty about the rate itself.**

  We do not know what the "correct" discount rate will be in 50 years. It could be 1 percent; it could be 7 percent. When there is uncertainty about the discount rate, the "certainty equivalent" discount rate declines over time. This is a mathematical necessity, not just an ethical preference.

  If we average a range of possible discount rates over a long horizon, the lower rates dominate the calculation in the distant future. Therefore, even a risk-neutral economist should support a declining schedule. To use a constant high rate is to assume we possess perfect foresight regarding the economy of the next century—a level of hubris unsupported by historical data.

  ### 6. Recommendation: A Declining Discount Rate Schedule

  To reconcile the economists' concern for efficiency with the ethical imperative of intergenerational equity, I recommend the Authority adopt a **Declining Discount Rate (DDR)** schedule. This is consistent with guidance from the UK Treasury (Green Book) and recent updates to US EPA guidelines for climate-related rulemaking.

  This approach applies a higher rate to near-term costs/benefits (satisfying the opportunity cost argument) and a lower rate to distant outcomes (satisfying the equity and uncertainty arguments).

  **Proposed Schedule (Real Terms):**

  | Time Horizon | Discount Rate | Rationale |
  | :--- | :--- | :--- |
  | **0 – 30 Years** | **3.5% – 4.0%** | Aligns with current cost of capital; ensures near-term fiscal discipline. |
  | **31 – 75 Years** | **2.5% – 3.0%** | Begins to account for uncertainty and reduced market liquidity. |
  | **76 – 100+ Years** | **1.5% – 2.0%** | Reflects intergenerational equity ($\delta \approx 0$) and long-term risk uncertainty. |

  **Why this works:**
  1.  **It prevents inefficiency:** Projects that lose money in the first 30 years are still screened out by the higher initial rate.
  2.  **It values survival:** Projects that prevent catastrophic loss in the late 21st century (e.g., sea-wall elevation) retain positive Net Present Value (NPV).
  3.  **It is auditable:** It removes the need for philosophical debate on every individual project. The schedule becomes policy.

  ### 7. Implementation and Policy Language

  I propose the Committee recommend the following policy language for Board adoption:

  > *"The Authority shall apply a real declining discount rate schedule for the economic appraisal of capital assets with expected lifespans exceeding 50 years. This schedule shall reflect the social opportunity cost of capital in the near term and the principle of intergenerational equity in the long term. The default schedule shall begin at [X]% for years 0–30, declining to [Y]% for years 75–100. Sensitivity analyses using rates +/- 1 percent from the default schedule must be included in all Final Investment Decisions."*

  ### 8. Conclusion

  The choice of a discount rate is a choice about who counts. A constant 4–5 percent rate effectively excludes the 22nd century from our planning calculus. It treats the Authority as a private firm with a quarterly horizon rather than a public trust with a centennial mandate.

  The economists on this committee are correct that we must not waste current resources. But they are mistaken in applying short-term market signals to long-term existential risks. By adopting a Declining Discount Rate, we can honor our fiduciary duty to current ratepayers without abdicating our moral duty to those who will inherit the infrastructure we build today.

  I recommend the Committee vote to advance the DDR schedule to the Board for adoption.

  ***

  **Attachments:**
  *   *Appendix A: Sensitivity Analysis of NPV under Constant vs. Declining Rates*
  *   *Appendix B: Summary of UK Treasury Green Book Discounting Guidance*
