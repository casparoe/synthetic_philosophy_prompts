answer: |-
  You have stumbled onto the famous **Problem of Old Evidence**, and your intuition that the standard fix feels like "cheating" is shared by many philosophers of science. The issue is that standard Bayesianism assumes **logical omniscience** (you know all logical consequences of your beliefs instantly), which makes learning a new theory that entails old data mathematically invisible.

  Here is a ranking of the main ways out, ordered from the one that best preserves the intuition that old evidence *really* confirms new theories without fiction, down to the one that abandons that intuition.

  ### 1. The "Learning the Link" Move (Garber/Jeﬀrey)
  **The Gist:** You don't update on the fact $E$ (which you knew); you update on the new logical proposition "$H$ entails $E$." This is genuinely new information learned at the moment you formulated the theory.
  **Where it Leaks:** It requires you to abandon the standard Bayesian assumption of logical omniscience. You have to allow probabilities to be assigned to logical relationships themselves, which complicates the math and implies your previous beliefs were logically incoherent (you knew $H$ and $E$ but didn't know they matched).

  ### 2. The "Never Certain" Move (Jeffrey Conditioning)
  **The Gist:** You argue that no empirical fact ever has probability exactly 1. Even old facts have $P(E) = 0.999$. If $H$ raises that to $0.9999$, the math works and belief updates without pretending.
  **Where it Leaks:** It feels like moving the goalposts. For truly settled facts (e.g., "there is a sun"), treating them as less than certain feels arbitrary just to save the equation. It solves the technical problem but ignores the psychological reality that we *do* treat some evidence as fixed.

  ### 3. The "Time-Travel" Move (Counterfactual/Ur-Priors)
  **The Gist:** This is the "cheating" move you identified. You reconstruct a hypothetical prior belief state where you didn't know $E$, calculate the update, and paste that confidence onto your current self.
  **Where it Leaks:** It is explicitly fictional. It tells you what your belief *would have been* if you were a different person with less knowledge, but it doesn't explain why your *actual* current state should change based on a scenario that never happened.

  ### 4. The "Compartment" Move (Fragmentation)
  **The Gist:** Your mind is fragmented into contexts. In the "theory evaluation" context, the "old fact" context is temporarily walled off, so effectively $P(E) < 1$ within that specific reasoning module.
  **Where it Leaks:** This is essentially a psychological version of the Time-Travel move. It avoids calling it "pretending," but it still requires you to artificially ignore knowledge you possess, which raises questions about why rationality requires self-imposed ignorance.

  ### 5. The "Surrender" Move (Explanationism)
  **The Gist:** Old evidence does *not* confirm new theories probabilistically. Instead, new theories provide *explanations* for old facts. Confirmation is for predictions; explanation is for coherence.
  **Where it Leaks:** It gives up on the intuition entirely. It admits Bayes' rule cannot capture the full scientific practice of using old data (like Mercury's orbit) to validate new theories (like General Relativity), forcing you to accept two different standards for "support."

  ### Recommendation
  If you want to keep Bayes without lying to yourself, **Move #1 (Learning the Link)** is the strongest candidate. It respects the fact that you didn't learn the data, but it identifies a specific, real cognitive event (realizing the entailment) that acts as the actual evidence. It costs you the simplicity of "ideal" Bayesianism, but it saves the honesty of the update.
