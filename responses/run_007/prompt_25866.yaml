          *   *Theory of Knowledge:* "The Wisdom of Crowds" (Condorcet) OR "Rational Ignorance" (Downs). Either everyone knows a little bit and it averages out, or it doesn't matter because politicians will compete for the median voter. Knowledge is individual and static.
      *   **Assembly Track:**
          *   *Theory of Democracy:* Deliberative Democracy (Habermas, Fishkin). Democracy is about reasoning together. Legitimacy comes from the quality of the process.
