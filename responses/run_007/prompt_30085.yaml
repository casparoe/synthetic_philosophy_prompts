      *   *Gavagai:* This illustrates the "Inscrutability of Reference" (a subset of indeterminacy).
      *   *Impossibility:* Quine doesn't say we can't communicate or translate practically. He says there is no *unique* correct translation manual. "Impossible in a strict sense" is a bit dramatic but captures the "no fact of the matter" vibe.
