      *   *Key Tension:* The user accepts human responsibility for suffering in farming (Cases 1, 2, 6) but seems to absolve human responsibility for suffering in "natural" or "collateral" contexts (Cases 3, 5), *unless* intervention prevents greater harm (Case 6).
