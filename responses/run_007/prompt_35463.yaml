  I've been trying to build a decision theory that handles ambiguity—not just risk, like every framework from von Neumann–Morgenstern onward. Before I go further down the rabbit hole, I want the desiderata. What does a theory of decision under uncertainty have to actually deliver to count as an adequate treatment of the Ellsberg paradox and ambiguity aversion more generally? Give me the list of requirements, with the case or consideration behind each one. Flag which are non-negotiable and which are more like camp-specific preferences (e.g., some people insist on preserving the sure-thing principle, others are fine ditching it). And if there's any pair of requirements that can't be jointly satisfied—like, if accommodating the Ellsberg choices forces you to give up dynamic consistency or makes you suceptible to Dutch books—I want to know about that. That's the part I most need.
