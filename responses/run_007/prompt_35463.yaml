answer: |-
  This is the right place to pause. The literature on decision theory under ambiguity is littered with models that solve one problem only to create a deeper structural pathology elsewhere. If you are building a new framework, you need to know exactly which bullets you are biting.

  Below is the breakdown of desiderata for a theory of ambiguity, categorized by their necessity, followed by the specific impossibility results that define the boundaries of the possible.

  ---

  ### Part 1: The Desiderata

  #### I. The Empirical Core (Non-Negotiable)
  *If your theory fails these, it is not a theory of ambiguity; it is just Expected Utility (SEU).*

  **1. Accommodation of Ellsberg Choices**
  *   **Requirement:** The model must permit a preference for known probabilities over unknown probabilities, even when the expected value is identical. Specifically, it must allow the violation of Savage's Sure Thing Principle (P2) in the classic 2-urn setup.
  *   **Consideration:** This is the phenomenological baseline. If your axioms force the agent to be indifferent between the risky and ambiguous urns, you have merely reconstructed SEU.
  *   **Status:** **Non-Negotiable.**

  **2. Reduction to Risk**
  *   **Requirement:** In the limit where ambiguity vanishes (i.e., the set of priors collapses to a singleton, or the capacity becomes additive), the model must collapse to standard Von Neumann–Morgenstern Expected Utility.
  *   **Consideration:** Ambiguity is supposed to be a generalization of risk, not a replacement. If your model behaves strangely even when probabilities are objective, it lacks face validity.
  *   **Status:** **Non-Negotiable.**

  #### II. The Structural Rationality (Mostly Non-Negotiable)
  *These ensure the agent is actually making a "decision" rather than exhibiting random noise.*

  **3. Weak Order (Completeness & Transitivity)**
  *   **Requirement:** For any acts $f$ and $g$, either $f \succeq g$ or $g \succeq f$ (Completeness), and if $f \succeq g$ and $g \succeq h$, then $f \succeq h$ (Transitivity).
  *   **Consideration:** Without this, the agent cannot maximize. (Note: Some models, like Bewley's Knightian Uncertainty, drop Completeness to represent "indecisiveness," but if you want to model *aversion*, you usually need a complete ranking to say one ambiguous option is strictly worse than another).
  *   **Status:** **Non-Negotiable** for a choice function; **Camp-Specific** for preference representation (some allow incomplete preferences).

  **4. Monotonicity (State-wise Dominance)**
  *   **Requirement:** If act $f$ yields a better outcome than act $g$ in every possible state of the world, then $f \succeq g$.
  *   **Consideration:** This is the bedrock of instrumental rationality. Violating this implies the agent is ignoring the consequences of their actions in favor of some superstitious correlation between acts and states.
  *   **Status:** **Non-Negotiable.**

  #### III. The Dynamic & Coherence Zone (Camp-Specific Preferences)
  *This is where the wars are fought. You generally cannot have all of these.*

  **5. Dynamic Consistency (Consequentialism)**
  *   **Requirement:** A plan chosen at $t=0$ must remain optimal at $t=1$ after new information arrives, provided the new information does not rule out the state that made the plan optimal.
  *   **Consideration:** Without this, the agent is "time-inconsistent." They will pay to restrict their future choices or suffer regret. It allows for recursive solution methods (backward induction).
  *   **Status:** **Camp-Specific.** SEU purists demand this. Ambiguity modelers often sacrifice this (or modify updating) to preserve Ellsberg preferences.

  **6. Coherence (No Dutch Books)**
  *   **Requirement:** The agent should not accept a set of bets that guarantees a loss regardless of the state of the world.
  *   **Consideration:** This is the standard for economic rationality. If a theory allows a Dutch Book, the agent can be "money pumped."
  *   **Status:** **Non-Negotiable** for normative theories; **Contested** for descriptive theories. (Note: Static Dutch books are usually avoided; *Dynamic* Dutch books are the risk).

  **7. Standard Bayesian Updating**
  *   **Requirement:** Upon observing event $E$, the set of priors (or capacities) should be updated via conditional probability (e.g., Full Bayesian Updating).
  *   **Consideration:** This preserves the link between belief and evidence.
  *   **Status:** **Camp-Specific.** Many ambiguity models require non-Bayesian updating rules (like Maximum Likelihood Updating or Recursive Updating) to maintain Dynamic Consistency.

  ---

  ### Part 2: The Impossibility Results (The "Hard Truths")

  This is the section you requested most. You cannot simply stack the desiderata above. There are proven incompatibilities.

  #### 1. The Ellsberg–Dynamic Consistency–Updating Trilemma
  You cannot jointly satisfy the following three conditions:
  1.  **Ellsberg Preferences** (Ambiguity Aversion / Violation of Sure Thing Principle).
  2.  **Dynamic Consistency** (Plans made ex-ante are optimal ex-post).
  3.  **Consequentialism / Standard Updating** (Beliefs update only based on information received, not on the menu of options).

  *   **The Conflict:** If you have Ellsberg preferences, your valuation of a bet depends on the context (the set of priors). When you move from $t=0$ to $t=1$, the context changes. If you update beliefs standardly (Bayesian), your ex-ante optimal plan will often look sub-optimal ex-post, leading to dynamic inconsistency.
  *   **The Fix:** You must break one leg of the triangle.
      *   *Break Updating:* **Epstein & Schneider (2003)** show that if you restrict the set of priors to be **Rectangular**, you can preserve Dynamic Consistency, but you must use a specific recursive updating rule, not standard Full Bayesian Updating.
      *   *Break Dynamic Consistency:* **Gilboa & Schmeidler (MEU)** models generally suffer from dynamic inconsistency unless heavily constrained.
      *   *Break Ellsberg:* Return to SEU.

  #### 2. The Dutch Book Vulnerability
  If you violate the Sure Thing Principle (to allow Ellsberg choices), you open yourself to **Dynamic Dutch Books**.
  *   **The Conflict:** A bookie can offer you a sequence of bets that looks acceptable at each stage given your current ambiguity-averse evaluation, but which guarantees a loss in aggregate.
  *   **The Nuance:** This is not a *static* Dutch book (which would imply incoherent beliefs at a single moment). It is a *dynamic* Dutch book that exploits the shift in your evaluation criteria between $t=0$ and $t=1$.
  *   **The Fix:** To avoid this, you must either:
      1.  Commit to a pre-commitment strategy (bind yourself at $t=0$).
      2.  Adopt a "Sophisticated" choice model (anticipate your future inconsistency and choose accordingly).
      3.  Accept that ambiguity aversion implies a vulnerability to exploitation in dynamic settings (a descriptive stance).

  #### 3. Machina's Paradox (The Stress Test)
  Even if you solve Ellsberg, you face **Machina's Paradox (2009, 2014)**.
  *   **The Conflict:** Machina constructed examples where ambiguity-averse agents (specifically those using MaxMin Expected Utility or Smooth Ambiguity models) make choices that violate lower tail independence or other weakened axioms designed to save ambiguity models.
  *   **Consideration:** This suggests that simply relaxing the Independence Axiom (as Gilboa-Schmeidler did) is not enough. The structure of the ambiguity (how probabilities correlate across events) matters in ways current models struggle to capture without becoming ad-hoc.
  *   **Status:** If your theory cannot handle Machina's "50/51" examples, it is considered structurally fragile.

  ---

  ### Part 3: Strategic Recommendations for Your Build

  If you are building a new theory, you need to decide where to locate yourself in the impossibility space. Here are the three viable paths currently occupied in the literature:

  **Path A: The Recursive / Rectangular Approach (Epstein-Schneider)**
  *   **Keeps:** Dynamic Consistency, No Dynamic Dutch Books.
  *   **Sacrifices:** Full Bayesian Updating (uses rectangularity constraint on priors).
  *   **Verdict:** Best for macroeconomics and finance applications where solving dynamic programs is necessary.

  **Path B: The Sophisticated / Pre-commitment Approach (Siniscalchi)**
  *   **Keeps:** Ellsberg Preferences, Standard Updating.
  *   **Sacrifices:** Dynamic Consistency (acknowledges it, models the agent as "sophisticated" enough to know they will change their mind).
  *   **Verdict:** Best for behavioral description and game theory.

  **Path C: The Smooth Ambiguity Approach (Klibanoff-Marinacci-Mukerji)**
  *   **Keeps:** Separation of attitudes toward risk and ambiguity.
  *   **Sacrifices:** Dynamic Consistency (unless priors are degenerate).
  *   **Verdict:** Best for empirical calibration, but mathematically difficult to make dynamic.

  ### Summary Checklist for Your Theory
  Before writing the axioms, answer these three questions. Your answers determine the mathematical structure you must use:

  1.  **Is the agent Sophisticated or Naive?** (Do they know they will be dynamically inconsistent?)
  2.  **How do Priors Update?** (Full Bayesian, Maximum Likelihood, or Rectangular/Recursive?)
  3.  **Is Ambiguity Epistemic or Ontological?** (Is the probability unknown to the agent, or does the probability not exist?)

  If you try to claim **Standard Bayesian Updating** + **Ellsberg Preferences** + **Dynamic Consistency**, your theory will be mathematically empty (it will collapse back to SEU). That is the hard constraint you must design around.
