answer: |-
  Good morning.

  For those of you who knew my aunt professionally, you know that she was a woman of precise language. She believed that if you couldn't say what you meant clearly, you probably didn't understand it yourself. For those of you who knew her as family, you know she was a woman of immense feeling. She could be brought to tears by a piece of music, a stubborn flower pushing through concrete, or a particularly kind gesture from a stranger.

  To some, those two things might seem contradictory. How can someone be so rigorous and yet so easily moved? But for her, they were the same project. She spent thirty years thinking about a specific question: Why do we feel real pain for things that aren't there?

  She spent her career asking why we cry when Anna Karenina dies. We know Anna isn't real. We know we are safe in our chairs. Some philosophers argued that because we know this, the tears we shed are a kind of trick. They called them "quasi-emotions." They said our grief for a fictional character is a pretense, a shadow of the real thing, because we can't actually *do* anything about it.

  My aunt thought that was nonsense.

  She argued that the feeling itself is the truth. The fact that we don't run out of the theater during a horror movie doesn't mean the fear is fake; it just means that for a little while, we suspend the urge to run, but we keep the feeling. The emotion is real, even if the object of it is not.

  I've been thinking about this a lot for the last two weeks. Because in a way, that is what we are doing here today. We are gathered to feel something for someone who is no longer here to receive it.

  There is a temptation, when someone dies, to treat our grief as a problem to be solved. We try to fix it with platitudes. We tell ourselves the pain isn't "useful" because she can't feel us feeling it. We are told to "move on," as if the absence of the person should eventually negate the presence of the love.

  If she were here, and I suggested that, she would have rolled her eyes. She would have told me that the validity of an emotion does not depend on its utility.

  To her colleagues and students: She taught us that the capacity to feel for the absent is not a cognitive error. It is a feature of being human.
  To her family and friends: She taught us that just because we cannot change what happened, just because we cannot bring her back, does not make our love any less real.

  The standard view of grief is often like the standard view of fiction: *She is gone, so your pain is a reaction to a void. It is a shadow.*

  But she taught us better. She taught us that the pain is not a shadow. The pain is the evidence.

  We are not feeling "quasi-grief" today. We are not pretending. We are sitting in our seats, unable to act, unable to fix the one thing we wish we could fix. And yet, the love we feel, the ache of her absence, is entirely intact. It is not diminished by the fact that she is gone. If anything, her absence is the only thing that allows us to see the emotion in its purest form. Stripped of the daily routines, stripped of the ability to call her or visit her, all that is left is the feeling itself. And according to her, that feeling is the most real thing in the room.

  She didn't just write about this; she lived it. She loved us with a clarity that didn't require anything in return. She listened to us with a focus that made you feel like the only person in the world. She didn't love us because it was useful, or because it solved a problem. She loved us because she was capable of feeling the reality of another person, even when they were far away, even when they were struggling.

  So, I am not going to stand here and tell you that she is in a better place. I don't know that, and I suspect she would find it imprecise. I am not going to tell you that the pain will go away, because that implies the pain was a mistake.

  Instead, I will say this: We are allowed to cry for her. We are allowed to feel the full weight of this loss, even though we know, logically, that death is a part of life. We know she isn't here. But the love is.

  She spent her life defending the reality of our feelings against the claim that they were just make-believe. The greatest tribute we can pay her is to accept her final lesson. To acknowledge that while she is now absent from the world, she is not absent from us. And because she is in us, this grief is not a shadow. It is real. It is valid. And it is hers.

  Thank you.
