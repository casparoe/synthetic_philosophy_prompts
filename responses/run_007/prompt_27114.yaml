  6.  **Addressing the "Competence" Question specifically:**
      *   User asks: Is calling it a competence problem condescending?
      *   My take: Yes. It shifts blame to the victim's capacity rather than the researcher's duty to educate. The barrier wasn't cognitive capacity; it was systemic exclusion from knowledge.

  7.  **Addressing the "Coercion/Inducement" Question:**
