          *   *Best candidate:* The distinction between the *B-series* (ordering of events) and the *A-series* (passage/presentness). Or, more specifically, the role of *Quantum Measurement* (collapse) which might introduce fundamental asymmetry unlike classical statistical mechanics. Let's go with the Quantum Measurement/Collapse issue or the distinction between Anisotropy and Transience. Actually, the "Passage" vs. "Direction" distinction is crucial. The Philosopher hints at it, but the *Psychological Arrow* independent of Thermodynamics (e.g., in non-equilibrium systems) is also good.
