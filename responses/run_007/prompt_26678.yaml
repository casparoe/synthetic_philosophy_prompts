      *   *Philosopher (F):* Argues for a more nuanced/metaphysical view. Correlation $\neq$ Explanation. Causation could be primitive. The thermodynamic arrow defines a gradient, not an intrinsic direction (A-series vs. B-series issue). Explaining *why we talk* about the past isn't explaining *why time is directed*.

  3.  **Drafting - Section by Section:**

