answer: |-
  **Project Title:** Decoupling Attribution and Liability: Resolving the Harshness Objection to Luck Egalitarianism

  **Project Description**
  Luck egalitarianism maintains that inequalities arising from choice are just, while those arising from luck are not. The dominant critique, the "harshness objection," charges that this view forbids aiding individuals who suffer due to their own imprudent choices, thereby licensing unacceptable suffering. This project addresses a precise question: Does the attribution of a bad outcome to an agent's choice necessarily entail that the agent is liable to bear the full costs of that outcome?

  Current literature leaves this question open because it treats "responsibility" as a monolithic concept. Defenders of luck egalitarianism typically attempt to soften the view's implications by narrowing the scope of what counts as a genuine choice. Critics, conversely, argue that any view linking distribution to choice inevitably yields harsh results. Both sides assume that if an outcome is attributable to agency in the sense relevant to moral appraisal, the agent must necessarily bear the material costs in the sense relevant to distributive justice. This assumption creates a stalemate characterized by the trading of intuition-pumping cases (e.g., the reckless smoker) without resolving the underlying theoretical confusion.

  This project makes progress by shifting the debate from case-comparison to conceptual analysis. I argue that there are two distinct normative questions currently conflated: (1) *Attributive Responsibility*: Is the outcome sufficiently connected to the agent's agency to be credited or debited to them? and (2) *Substantive Liability*: Does that connection obligate others to withhold aid? My hypothesis is that luck egalitarianism is committed to the first claim but not the second. By decoupling attribution from liability, I aim to show that one can acknowledge an individual's agency in creating their predicament without concluding that justice permits leaving them to suffer. This resolves the standoff not by modifying luck egalitarianism's core commitments, but by clarifying the normative bridge between responsibility and distribution.

  **Work Plan**
  *   **Weeks 1–3:** Comprehensive review of the harshness objection literature to map where the conflation of attribution and liability occurs.
  *   **Weeks 4–6:** Develop the conceptual distinction between attributive responsibility and substantive liability; draft the core argument establishing their independence.
  *   **Weeks 7–10:** Stress-test the distinction against standard counter-examples (e.g., expensive tastes, voluntary unemployment) to ensure it blocks the harshness objection without collapsing into prioritarianism.
  *   **Weeks 11–13:** Draft the full term paper, integrating the analysis with the broader luck egalitarian framework.
  *   **Weeks 14–15:** Revise for clarity, coherence, and objection-handling; finalize the manuscript.

  **Criteria for Success and Failure**
  Success will be defined by the production of a complete term paper that articulates a coherent distinction between attribution and liability and demonstrates that this distinction allows luck egalitarians to mandate aid for the imprudent without contradicting their core principles. A successful project will show that the harshness objection targets a specific, unnecessary inference rather than the theory itself.

  The project will count as a failure if the proposed distinction proves untenable upon scrutiny—for example, if it becomes clear that substantive liability is conceptually entailed by attributive responsibility within the luck egalitarian framework. Additionally, failure would result if the distinction solves the harshness objection only by abandoning the core luck egalitarian commitment to neutralizing the effects of brute luck, thereby dissolving the view it seeks to defend.
