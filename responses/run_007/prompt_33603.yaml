  I've been going down a rabbithole on Marx and technology, and I keep seeing people reference that "Fragment on Machines" bit in the Grundrisse where he suposedly says the worker steps aside from the production process and becomes more like a supervisor or a conscious link in an automated system. It makes Marx sound almost utopian about automation—like he thought machines would eventually do all the grunt work and free us for more creative stuff. But then why are pretty much all the Marxists I read today so gloomy about AI taking jobs and turning workers into deskilled button-pushers? If Marx really believed technology would set us free under capitalism, what's with all the pessimism now? Is that actually what Marx was saying, or am I mixing things up? Answer in American English, please.
