answer: |-
  ### Brainstorming Candidate Diagnostic Questions

  To construct a logical space for the units of selection debate, we must identify the hierarchical levels at which a reader accepts *causal efficacy* in evolution. The debate is not merely about labels (e.g., "kin selection" vs. "group selection") but about which entities possess fitness that is not reducible to the fitness of their parts. I propose three binary dimensions corresponding to the major biological hierarchies: intragenomic, inter-organismic (within populations), and inter-specific (macroevolutionary).

  1.  **Dimension 1: Intragenomic Conflict.**
      *   *Candidate Question:* Do "selfish" genetic elements evolve?
      *   *Refinement:* We must distinguish between acknowledging the phenomenon and accepting it as a distinct *level of selection*. The question must ask if the element's fitness is causally primary or if it is a disruption of organismic function.
      *   *Case:* Segregation distorters (alleles that cheat meiosis).
      *   *Draft:* "When a segregation distorter spreads despite harming the organism, is this selection on the gene?"

  2.  **Dimension 2: Group vs. Organism (Within Population).**
      *   *Candidate Question:* Does group selection exist?
      *   *Refinement:* Avoid the term "group selection." Focus on the trade-off between individual cost and group benefit. Crucially, distinguish between "real" group causality and individualistic explanations (like kin selection) that merely use group terminology as shorthand.
      *   *Case:* Sterile worker castes in eusocial insects.
      *   *Draft:* "When a trait prevents individual reproduction but saves the colony, is the colony's survival the cause?"

  3.  **Dimension 3: Species vs. Group (Macroevolution).**
      *   *Candidate Question:* Is species selection real?
      *   *Refinement:* Distinguish this from group selection. Group selection is synchronic (groups within a population); species selection is diachronic (lineages over geological time). The case must involve a property emergent at the species level.
      *   *Case:* Geographic range affecting extinction rates.
      *   *Draft:* "Does broad geographic range select the species, or is it just the sum of individual survival?"

  4.  **Dimension 4: Reducibility (Ontological Status).**
      *   *Candidate Question:* Is higher-level selection just math?
      *   *Refinement:* This is implicit in the "Yes/No" framing of the first three questions. To save question slots, I will embed the realism condition into the answer choices (e.g., "Yes, it is a distinct cause" vs. "No, it is reducible").

  **Selected Dimensions for the Tree:**
  1.  **Intragenomic Causality** (Gene vs. Organism integrity).
  2.  **Collective Causality** (Group vs. Individual within population).
  3.  **Lineage Causality** (Species vs. Aggregate of organisms).

  These three binary questions yield exactly eight leaves, allowing us to map every logical combination of causal commitments.

  ***

  ### Decision Tree: Causal Structure of Evolutionary Theory

  **Instructions:** Answer the following three questions based on your view of the *causal structure* of evolution. Choose the option that best reflects whether you believe the higher-level entity acts as a genuine unit of selection or merely as a site where lower-level forces play out.

  **Q1. The Segregation Distorter Case**
  Consider a "selfish" allele (e.g., a segregation distorter) that increases its own transmission to the next generation but reduces the survival or fertility of the organism carrying it.
  *   **(A)** This is a genuine case of selection acting on the gene, independent of the organism's fitness. *(Go to Q2)*
  *   **(B)** This is a pathological disruption of the organism, which remains the primary unit of selection. *(Go to Q2)*

  **Q2. The Sterile Worker Case**
  Consider a trait (e.g., sterility in worker bees) that prevents an individual from reproducing but increases the persistence of the local colony.
  *   **(A)** The colony's persistence is a distinct causal force; the group is a real unit of selection. *(Go to Q3)*
  *   **(B)** The trait spreads solely due to the fitness effects on the individual (or its kin); group talk is a shorthand for individual-level dynamics. *(Go to Q3)*

  **Q3. The Geographic Range Case**
  Consider a property emergent at the species level (e.g., broad geographic range) that makes a species less likely to go extinct than a narrow-range species, regardless of individual fitness.
  *   **(A)** Differential extinction here is selection acting on the species lineage itself. *(End)*
  *   **(B)** This is merely the aggregate result of individual organisms dying or surviving; species do not have fitness. *(End)*

  ***

  ### Map of Leaves and Logical Space

  The combination of answers (Q1, Q2, Q3) generates eight logical positions. Below, I locate the standard named positions and diagnose the coherence of the logical space.

  | Leaf | Q1 (Gene) | Q2 (Group) | Q3 (Species) | Named Position / Diagnosis |
  | :--- | :---: | :---: | :---: | :--- |
  | **1** | **A** (Yes) | **B** (No) | **B** (No) | **Gene's-Eye View.** (e.g., Dawkins, Williams). Selection is fundamentally genic; organisms and groups are vehicles. |
  | **2** | **B** (No) | **B** (No) | **B** (No) | **Organism-Level Selection.** (e.g., Mayr, Standard Neo-Darwinism). The organism is the unified replicator/interactor; sub- and supra-organismic effects are derivative. |
  | **3** | **B** (No) | **A** (Yes) | **B** (No) | **Multilevel Selection (MLS).** (e.g., Sober & Wilson). Groups are real units of selection within populations, but organisms are coherent (no genic conflict) and species selection is denied or subsumed. |
  | **4** | **B** (No) | **B** (No) | **A** (Yes) | **Species Selection.** (e.g., S.J. Gould, E.S. Vrba). Organisms are the primary micro-units, but macroevolution involves sorting of species lineages via emergent traits. |
  | **5** | **A** (Yes) | **A** (Yes) | **B** (No) | **Genic Multilevel.** Accepts genic conflict and real group selection, but denies species-level sorting. *Rare; theoretically stable but seldom explicitly defended.* |
  | **6** | **A** (Yes) | **B** (No) | **A** (Yes) | **Genic Species Selection.** Accepts genic conflict and species sorting, but denies real group selection. *Unexplored/Unstable.* Why accept macro-level realism while rejecting meso-level realism? |
  | **7** | **B** (No) | **A** (Yes) | **A** (Yes) | **Hierarchical Selectionism.** (e.g., Eldredge & Salthe). Accepts Group and Species as real levels, but maintains organismic integrity (denies genic conflict). |
  | **8** | **A** (Yes) | **A** (Yes) | **A** (Yes) | **Universal Hierarchical Selection.** Selection acts at all levels simultaneously. *Coherent, but explanatory power may be diluted by pluralism.* |

  #### Diagnostic Notes on the Logical Space

  **1. Separation of MLS and Species Selection**
  The tree cleanly separates **Leaf 3 (MLS)** from **Leaf 4 (Species Selection)**. Both accept selection above the organism, but they diverge on *where* that selection occurs. MLS (Leaf 3) locates the higher-level cause in synchronic groups within a population (Q2=A), whereas Species Selection (Leaf 4) locates it in diachronic lineages across geological time (Q3=A) while potentially treating within-population group talk as shorthand (Q2=B). This captures the philosophical distinction between *trait-group selection* and *effect macroevolution*.

  **2. Unoccupied or Unstable Combinations**
  *   **Leaf 6 (Genic Species Selection):** This combination (Yes Gene, No Group, Yes Species) is logically possible but philosophically unattractive. It asserts that the smallest unit (gene) and the largest unit (species) are real, but the intermediate unit (group) is not. There is no obvious causal reason to skip the meso-level. This space is largely **unexplored**.
  *   **Leaf 5 (Genic Multilevel):** While coherent, this position is rare. Most Gene's-Eye theorists (Leaf 1) argue that if you account for genes correctly, group selection disappears (reducing Q2 to B). Most MLS theorists (Leaf 3) argue that if groups are real, the organism must be treated as a cohesive unit (reducing Q1 to B). Holding both A's requires a robust defense of both intragenomic conflict and inter-group causality without collapsing one into the other.

  **3. Indistinguishable Leaves**
  *   **Leaf 7 vs. Leaf 8:** The distinction between **Hierarchical Selectionism (Leaf 7)** and **Universal Hierarchical Selection (Leaf 8)** rests entirely on Q1 (Intragenomic Conflict). In practice, many Hierarchical Selectionists are agnostic about Q1, focusing primarily on the Organism-Group-Species hierarchy. Consequently, Leaf 7 and Leaf 8 may be **empirically indistinguishable** in seminars focused solely on macroevolution or social behavior, as both agree on the reality of Group and Species levels. The tree distinguishes them only on the basis of meiotic drive.

  **4. The "Real vs. Shorthand" Constraint**
  Note that Q2 and Q3 explicitly frame the "Yes" option as accepting a "distinct causal force" and the "No" option as "aggregate/shorthand." This ensures that **Leaf 3** captures only those who treat group selection as a *real level* (as requested), filtering out kin-selection theorists who might mathematically model group effects but ontologically reduce them to individual fitness (who would fall to Leaf 2).
