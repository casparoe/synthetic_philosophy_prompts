      *   **The "Betrayal" Aspect (Michael Stocker):** Discuss how reducing love to duty kills the value of love. If the wife hears, "I saved you because the maxim of saving spouses maximizes utility," she feels unloved.
      *   **Critique of the Professor's Demand:** The professor is operating from an Impartialist/Utilitarian/Kantian framework that demands universalizability. But this framework might be ill-equipped to handle the *particularity* of love.
