prompt: |-
  I am a professor of philosophy and chair of my university's Grounds and Sustainability Committee. Each month we review proposals for insecticide use across the campus: aphids on the ornamental lindens along the main quadrangle, mosquito control around the stormwater wetlands, drywood termites in the nineteenth-century library, scale insects in the glasshouses, ants in the student kitchens. At present we decide case by case, and our discussions lurch between members who regard insects as beneath moral consideration, members who would ban all chemical control on precautionary grounds, and members who simply defer to the pest-control contractor's recommendation. I want to stop relitigating first principles every month, and to give the facilities director, who signs off on every application, something more principled than whichever argument prevailed at the last meeting.

  Please write a decision procedure the committee can actually run on a proposal. It should be grounded in what environmental and animal ethics can defensibly say about harming and killing insects, yet remain usable by non-specialists in about half an hour per proposal, on the strength of evidence the proposing unit can reasonably supply. Specify the questions in order, what counts as a sufficient answer to each, where the procedure returns a no or attaches conditions, and where it must hand the decision to a person because the question is one of values rather than facts. Pay particular attention to the hard cases: uncertainty about insect sentience, the difference between nociception and pain, the difference between harms to individual organisms and harms to populations or ecosystems, the value-ladenness of the category 'pest', and the question of who bears the residual risk. Be explicit about which steps are judgment calls dressed up as procedure, and about what the procedure cannot settle.

  Then run the procedure on three proposals the committee will actually see this term: (i) a neonicotinoid soil drench for aphids on the ornamental lindens, where the damage is purely cosmetic; (ii) a larvicide application to the campus wetlands following two locally acquired cases of mosquito-borne disease; and (iii) whole-structure fumigation of the library to eliminate a drywood termite infestation threatening the timber frame and the special collections. I expect at least one of these to yield an answer the committee will find unwelcome; make that explicit rather than softening it. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and its application:

  1.  **Analyze the Request:**
      *   **User:** Professor of Philosophy and Chair of the Grounds and Sustainability Committee.
      *   **Task:** Create a decision procedure for reviewing insecticide use proposals.
      *   **Constraints:**
          *   Grounded in environmental/animal ethics (defensible positions on harming/killing insects).
          *   Usable by non-specialists in ~30 minutes per proposal.
          *   Based on evidence proposing units can reasonably supply.
          *   Specify questions, sufficient answers, decision points (No/Conditions/Hand-off).
          *   Address hard cases: sentience uncertainty, nociception vs. pain, individual vs. population/ecosystem harm, the category 'pest', residual risk.
          *   Be explicit about judgment calls and limitations.
          *   Run the procedure on three specific cases (Lindens/Aphids, Wetlands/Mosquitoes, Library/Termites).
          *   At least one outcome must be unwelcome/explicit.
          *   Language: British English.

  2.  **Determine the Ethical Framework:**
      *   *Problem:* Insects are morally ambiguous. They aren't clearly sentient like mammals, but they aren't rocks either. Utilitarianism (pain minimization) clashes with Ecocentrism (ecosystem health) and Deontology (rights/integrity).
      *   *Solution:* A hybrid "Precautionary Principle + Proportionality + Least Harm" framework.
      *   *Key Ethical Commitments:*
          1.  **Sentience Precaution:** Assume some capacity for suffering exists, however rudimentary.
          2.  **Ecological Integrity:** Protecting populations/ecosystems outweighs individual insect welfare *unless* the individual harm is extreme and the ecological benefit negligible.
          3.  **Necessity:** Is the intervention actually needed?
          4.  **Proportionality:** Does the harm caused match the harm prevented?
          5.  **Non-Target Risk:** Collateral damage matters more than target damage.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Structure:* Needs to be a flowchart or step-by-step questionnaire. Let's go with a Step-by-Step Protocol with clear "Gates".
      *   *Time Limit:* 30 minutes means max 5-6 critical questions.
      *   *Steps:*
          1.  **Necessity & Alternatives:** Can we do nothing? Can we do non-chemical?
          2.  **Scope of Harm (Target):** How many insects? What kind of suffering?
          3.  **Scope of Harm (Non-Target):** Ecosystem impact? Pollinators?
          4.  **Human Interest:** What is being protected? (Health > Structural > Aesthetic).
          5.  **Risk Allocation:** Who bears the risk?
          6.  **Final Weighing:** The "Hand-off" point.

      *   *Refining the Ethics:*
          *   *Sentience:* Acknowledge uncertainty. Use a "Sentience Weighting Factor."
          *   *Pest Category:* Challenge the label. Is it a pest because it harms, or because it's inconvenient?
          *   *Judgment Calls:* Explicitly mark where values override facts (e.g., weighing aesthetic value against life).

  4.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Lindens/Aphids (Neonicotinoids)**
          *   *Necessity:* Cosmetic damage only.
          *   *Alternatives:* Tolerance, biological control (ladybirds), washing.
          *   *Chemical:* Neonicotinoids are systemic, high non-target risk (pollinators).
          *   *Ethical Verdict:* Hard No. Aesthetic convenience does not outweigh potential pollinator collapse or mass insect death.
          *   *Unwelcome Outcome:* This will annoy the Grounds Manager who wants perfect trees.

      *   **Case 2: Wetlands/Mosquitoes (Larvicide)**
          *   *Necessity:* Human health risk (locally acquired disease).
          *   *Alternatives:* Drainage (bad for wetlands), biological (Bti).
          *   *Chemical:* Larvicide (likely Bti or chemical). Let's assume chemical for the sake of tension, or specify Bti. The prompt says "larvicide application," implying chemical.
          *   *Ethical Verdict:* Conditional Yes. Human health trumps insect life, *but* must use most specific agent (Bti over broad spectrum) to minimize non-target harm.
          *   *Nuance:* Wetlands are for stormwater *and* ecology.

      *   **Case 3: Library/Termites (Fumigation)**
          *   *Necessity:* Structural integrity + Special Collections (cultural heritage).
          *   *Alternatives:* Spot treatment (might miss colony), heat treatment (possible?).
          *   *Chemical:* Whole-structure fumigation (Vikane/Sulfuryl fluoride). High lethality, contained.
          *   *Ethical Verdict:* Yes, but with strict containment/mitigation. Cultural preservation + Structural safety > Termite colony.
          *   *Nuance:* This is a "Last Resort" case.

  5.  **Refining the Output (British English & Tone):**
      *   Use "programme," "centre," "colour," "defence."
      *   Tone: Academic, administrative, precise, empathetic but firm.
      *   Ensure the "Unwelcome" result is highlighted.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Keep the questions binary where possible. Require the proposer to fill out the data *before* the meeting. The committee *reviews* the data, doesn't gather it.
      *   *Critique:* Did I address sentience?
      *   *Fix:* Add a specific step on "Moral Status of Target."
      *   *Critique:* Did I identify the judgment calls?
      *   *Fix:* Add a "Limitations" section at the end of the procedure.
      *   *Critique:* Is the Library case too easy?
      *   *Fix:* Make sure the fumigation conditions are strict (e.g., timing to avoid swarming seasons outside).
      *   *Critique:* Is the Linden case unwelcome enough?
      *   *Fix:* Explicitly state that cosmetic damage never justifies systemic neurotoxins.

  7.  **Final Polish:** Check against all prompt requirements.
      *   Decision procedure? Yes.
      *   Grounded in ethics? Yes.
      *   Usable by non-specialists? Yes.
      *   Evidence requirements? Yes.
      *   Hard cases addressed? Yes.
      *   Judgment calls explicit? Yes.
      *   Three cases run? Yes.
      *   Unwelcome outcome explicit? Yes.
      *   British English? Yes.

  8.  *(Self-Correction on Case 2)*: The prompt mentions "larvicide application" following disease. If I recommend Bti (biological), is that "chemical"? Technically it's a microbial pesticide. To make it ethically robust, the procedure should demand the *least harmful effective agent*. If they propose a broad-spectrum organophosphate, the procedure should reject it in favour of Bti. I will frame the proposal as a generic "chemical larvicide" and let the procedure force the specific choice.

  9.  *(Self-Correction on Case 1)*: Neonicotinoids are heavily restricted in the UK/EU anyway. I should acknowledge this regulatory context but focus on the *ethical* procedure which might be stricter than the law. I will treat the proposal as if it were legally permissible but ethically questionable.

  10. *(Final check on "Unwelcome")*: The Linden decision is the most likely to cause friction with facilities/grounds staff who prize aesthetics. I will ensure this is flagged clearly.

  Let's write.
answer: |-
  **To:** The Grounds and Sustainability Committee
  **From:** The Chair
  **Subject:** Protocol for the Ethical Review of Insecticide Proposals (v1.0)

  ### Preamble: Ethical Commitments

  This procedure is not a mechanism to evade responsibility, but to structure it. It rests on three defensible ethical premises derived from contemporary environmental philosophy:

  1.  **The Precautionary Principle regarding Sentience:** While insect consciousness is uncertain, the possibility of nociception (pain-like experience) is non-zero. We must act as if suffering matters, weighting the probability of sentience against the severity of the harm.
  2.  **Ecological Integrity over Individual Welfare:** In most cases, the health of the local ecosystem (including non-target species) outweighs the lives of individual insects, *unless* the intervention causes disproportionate collateral damage.
  3.  **Proportionality of Interest:** Human interests are hierarchically weighted. Immediate threats to human health justify greater harm than threats to property, which justify greater harm than aesthetic preferences.

  ### The Procedure

  **Pre-Condition:** The proposing unit (Facilities, Grounds, Library, etc.) must submit the *Insecticide Impact Statement* (IIS) 7 days prior to the meeting. The Committee's role is to audit the IIS, not to gather data.

  **Time Allocation:** 30 Minutes per proposal.

  #### Step 1: The Necessity Test (5 Minutes)
  *Question:* Is the intervention necessary to prevent demonstrable harm, or merely to prevent inconvenience or aesthetic decline?
  *Evidence Required:* Photographs of damage; expert assessment of progression rate; definition of 'unacceptable damage'.
  *   **Pass:** Harm is structural, health-related, or threatens irreversible loss of heritage/biodiversity.
  *   **Fail:** Harm is purely cosmetic, temporary, or nuisance-level.
  *   **Decision:** If **Fail**, the proposal is **Rejected**. No chemical intervention is permissible for aesthetics alone.
  *   **Judgment Call:** Defining 'cosmetic' vs. 'structural'. (e.g., Is leaf curling cosmetic? Is timber tunnelling structural?)

  #### Step 2: The Alternatives Audit (5 Minutes)
  *Question:* Have all non-chemical and less-intrusive chemical methods been exhausted or ruled out as ineffective?
  *Evidence Required:* Log of tried methods (biological controls, physical removal, tolerance); citation of expert opinion on efficacy.
  *   **Pass:** Alternatives are documented as ineffective for this specific context, or the urgency precludes them.
  *   **Fail:** Alternatives exist but are deemed 'too slow', 'too expensive', or 'too labour-intensive' without quantitative justification.
  *   **Decision:** If **Fail**, return to proposer with **Condition**: Implement alternatives for one season.
  *   **Judgment Call:** What counts as 'reasonable cost'? (Committee must accept the University's financial constraints but challenge 'convenience' costs).

  #### Step 3: The Collateral Damage Assessment (10 Minutes)
  *Question:* What is the risk to non-target organisms and the wider ecosystem?
  *Evidence Required:* Chemical safety data sheet (SDS); specific toxicity data for pollinators and aquatic life; application method (spot vs. broadcast vs. systemic).
  *   **Pass:** Agent is highly specific (e.g., pheromone trap, *Bti* for mosquitoes); application is contained; residual risk is negligible.
  *   **Fail:** Agent is systemic, persistent, or broad-spectrum (e.g., neonicotinoids, organophosphates); application risks runoff or drift to high-traffic ecological zones.
  *   **Decision:** If **Fail**, the proposal is **Rejected** unless Step 4 (Human Interest) is Category A (see below).
  *   **Judgment Call:** Weighing uncertain long-term ecological harm against certain short-term pest elimination.

  #### Step 4: The Hierarchy of Human Interests (5 Minutes)
  *Question:* What human value is being protected?
  *Classification:*
  *   **Category A (Life & Safety):** Prevention of vector-borne disease; prevention of structural collapse.
  *   **Category B (Heritage & Function):** Protection of unique cultural assets (archives, specimens); prevention of major service disruption.
  *   **Category C (Amenity):** Aesthetics, comfort, minor convenience.
  *   **Decision:**
      *   Category C cannot override a **Fail** in Step 3.
      *   Category B can override a **Fail** in Step 3 only if the chemical risk is contained and temporary.
      *   Category A can override a **Fail** in Step 3, provided the *least harmful* effective agent is used.

  #### Step 5: Risk Allocation & Review (5 Minutes)
  *Question:* Who bears the residual risk, and how is success monitored?
  *Evidence Required:* Plan for post-application monitoring; indemnity for affected third parties (e.g., local beekeepers).
  *   **Condition:** Approval is always provisional on a post-incident review if non-target mortality is observed.
  *   **Hand-off:** If the proposal passes Steps 1–4 but involves significant moral residue (e.g., killing a large colony of social insects for Category B reasons), the decision must be signed by the Committee Chair *and* the Facilities Director jointly. This ensures the moral burden is shared, not outsourced to the contractor.

  ### Limitations and Explicit Judgment Calls

  This procedure cannot settle metaphysical questions. The following are value judgments dressed as procedural gates:
  1.  **The Sentience Threshold:** We treat insects as if they can suffer, but we prioritise human health. This is anthropocentric, but unavoidable in a human institution.
  2.  **The Definition of 'Pest':** The procedure challenges the label. An insect is only a pest if it conflicts with a human interest defined in Step 1.
  3.  **Uncertainty:** Where science is uncertain (e.g., sub-lethal effects of a new chemical), the procedure defaults to the Precautionary Principle (Step 3).
  4.  **What this cannot settle:** It cannot resolve the tension between preserving a historic building (Category B) and preserving the lives of the organisms consuming it. It merely forces that trade-off into the open.

  ***

  ### Application of the Procedure to Current Proposals

  Below is the application of the Protocol to the three proposals scheduled for this term's review.

  #### Proposal (i): Ornamental Lindens (Aphids)
  *   **Proposal:** Soil drench of imidacloprid (neonicotinoid) to prevent honeydew drop and leaf curling on the Main Quadrangle.
  *   **Step 1 (Necessity):** **Fail.** The damage is cosmetic (leaf curling) and nuisance-level (sticky honeydew on benches). There is no threat to tree viability or human safety.
  *   **Step 2 (Alternatives):** **Fail.** Grounds staff cite 'efficiency', but biological controls (ladybirds) and high-pressure washing are viable, albeit labour-intensive.
  *   **Step 3 (Collateral Damage):** **Fail.** Neonicotinoids are systemic and highly toxic to pollinators. Bees foraging on the linden flowers or nearby clover will be exposed.
  *   **Step 4 (Human Interest):** **Category C (Amenity).**
  *   **Decision:** **REJECTED.**
  *   **Rationale:** Under Step 4, a Category C interest cannot override a Step 3 Fail. The aesthetic preference for unblemished leaves does not ethically justify the potential destruction of pollinator populations.
  *   **Unwelcome Outcome:** The Committee must inform the Grounds Manager that the lindens will remain infested. We must accept the 'mess' as the cost of ecological integrity. Tolerance is the required policy.

  #### Proposal (ii): Stormwater Wetlands (Mosquitoes)
  *   **Proposal:** Application of chemical larvicide following two locally acquired cases of West Nile Virus.
  *   **Step 1 (Necessity):** **Pass.** Locally acquired disease indicates an active vector risk to human health.
  *   **Step 2 (Alternatives):** **Conditional Pass.** Drainage is ecologically damaging. Biological larvicides (*Bti*) are available. If the proposal specifies a broad-spectrum neurotoxin, this step fails. If it specifies *Bti*, it passes.
  *   **Step 3 (Collateral Damage):** **Conditional.** Wetlands are high-sensitivity zones. Broad-spectrum chemicals would fail. *Bti* is specific to Diptera larvae and has low non-target impact.
  *   **Step 4 (Human Interest):** **Category A (Life & Safety).**
  *   **Step 5 (Risk Allocation):** **Condition.** Monitoring required to ensure no fish or amphibian die-off.
  *   **Decision:** **APPROVED WITH CONDITIONS.**
  *   **Rationale:** Category A interest justifies intervention even in sensitive zones. However, the Committee mandates the use of *Bti* (biological larvicide) rather than synthetic chemicals. If the contractor proposes synthetic chemicals, the proposal returns to Step 3.
  *   **Note:** This balances human health with the wetland's ecological function.

  #### Proposal (iii): Nineteenth-Century Library (Termites)
  *   **Proposal:** Whole-structure fumigation (sulfuryl fluoride) to eliminate drywood termites in the timber frame and special collections.
  *   **Step 1 (Necessity):** **Pass.** Threat is to structural integrity and irreplaceable cultural heritage.
  *   **Step 2 (Alternatives):** **Pass.** Spot treatment is ineffective for drywood termites (colonies hidden). Heat treatment is possible but risks damage to bindings and is less certain for deep timber. Fumigation is the industry standard for total eradication.
  *   **Step 3 (Collateral Damage):** **Pass (with mitigation).** Fumigation is contained within the structure. Risk to external ecosystem is negligible if tenting is secure. Internal non-target harm (e.g., spiders, beetles inside the library) is total, but contained.
  *   **Step 4 (Human Interest):** **Category B (Heritage & Function).**
  *   **Step 5 (Risk Allocation):** **Condition.** Must be scheduled during low-activity seasons for external insects to prevent swarming refugees.
  *   **Decision:** **APPROVED.**
  *   **Rationale:** The preservation of the building and the archives outweighs the colony of termites and the incidental insects within. The harm is contained, and the human interest is substantial.
  *   **Hand-off:** This requires joint signature (Chair + Facilities Director) due to the scale of killing involved (entire colony + incidental fauna).

  ### Summary of Committee Action

  1.  **Lindens:** Rejection. We must draft a communication to the University community explaining why the trees will look 'untidy' this year. This will be the most contentious outcome.
  2.  **Wetlands:** Approval contingent on switching to *Bti*. If the contractor cannot supply this, no application is permitted.
  3.  **Library:** Approval. Joint signature required.

  ### Closing Note to the Committee

  This procedure will not make the hard choices easy. In the case of the Lindens, it forces us to choose between beauty and life. In the case of the Library, it forces us to choose between heritage and habitat. The value of this protocol is not that it removes the moral residue, but that it prevents us from ignoring it. We are no longer deferring to the contractor; we are owning the kill.
