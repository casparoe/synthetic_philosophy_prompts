          *   *Pragmatic Encroachment:* If practical stakes raise the threshold for knowledge/justification, accuracy-first (which is purely alethic) cannot explain this without smuggling in pragmatic utility. *Severity:* Medium (depends on whether one accepts encroachment).
          *   *Vindication vs. Rationalisation:* Does maximising expected accuracy *explain* why we should conditionalise, or does it just model it? If the agent can't compute the expectation, is it a norm? *Severity:* Medium.

      *   *Section 3: Falsifiability and Qualification.*
