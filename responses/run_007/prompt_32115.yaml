answer: |-
  This slogan, famously attributed to Edwin Boring (1923), is indeed one of the most potent rhetorical shivs in the history of psychology. In the context of LessWrong and EA debates—where the reality of $g$ (general intelligence) often underpins arguments about AI takeoff speeds and human cognitive enhancement—clarity on this distinction is vital.

  The slogan's power comes from **equivocation**. It slides between a methodological rule (how we do science) and an ontological claim (what exists in the world).

  Here is a taxonomy of the distinct claims embedded in "Intelligence is whatever intelligence tests measure," ranked from trivial to substantive.

  ### Taxonomy of the Slogan

  #### 1. The Methodological Operationalist Reading
  *   **Precise Claim:** "In order to conduct quantitative research on intelligence, we must define the variable 'intelligence' in terms of the specific operations (tests) used to quantify it."
  *   **Verdict:** **Platitude.**
  *   **Commentary:** This is standard scientific practice. You cannot correlate "intelligence" with "income" unless you have a number for "intelligence." This reading demands rigor: if you change the test, you must acknowledge you might be measuring a slightly different operational construct. It does not deny a underlying reality; it just demands precise labeling for data collection.

  #### 2. The Predictive Instrumentalist Reading
  *   **Precise Claim:** "The scientific value of the concept 'intelligence' derives entirely from the ability of test scores to predict external criteria (job performance, academic success, AI capability), not from any theoretical understanding of the brain."
  *   **Verdict:** **Defensible.**
  *   **Commentary:** This is a pragmatic stance. It argues that even if we don't know *how* the brain processes information, if the test predicts outcomes, the construct is useful. This aligns with the "shut up and calculate" approach often found in machine learning. It sidesteps the "what is it?" question to focus on "what does it do?"

  #### 3. The Psychometric Construct Reading
  *   **Precise Claim:** "Intelligence is the latent statistical factor ($g$) that explains the positive correlations (the 'positive manifold') between diverse cognitive tests."
  *   **Verdict:** **Defensible (Mainstream Consensus).**
  *   **Commentary:** This is the standard psychometric definition. It posits that because different tests (vocab, matrices, memory) correlate, there is a common variance. "Intelligence" is the name we give to that common variance. This treats intelligence as a statistical reality that requires explanation, rather than just a test score.

  #### 4. The Tautological Circularity Reading
  *   **Precise Claim:** "Saying 'tests measure intelligence' is a tautology because 'intelligence' is defined as 'test score.' Therefore, claims about intelligence cannot be falsified by test results."
  *   **Verdict:** **False.**
  *   **Commentary:** This confuses *operationalization* with *validation*. While we use tests to define the variable for a study, the construct is validated by its correlation with *non-test* outcomes (e.g., real-world problem solving). If tests did not correlate with external reality, the construct would be discarded. The circle is not closed; it opens onto the world via predictive validity.

  #### 5. The Strong Anti-Realist Reading
  *   **Precise Claim:** "There is no underlying cognitive mechanism or neural substrate corresponding to 'intelligence.' The test score is the only reality; positing a brain-based capacity is a reification error."
  *   **Verdict:** **False (Scientifically Unsupported).**
  *   **Commentary:** This claims the territory *is* the map. Modern neuroscience and behavioral genetics strongly suggest there are biological underpinnings to $g$ (e.g., neural efficiency, processing speed, genetic correlations). To claim there is *nothing* but the test score is to ignore the causal mechanisms that produce the score.

  #### 6. The Socio-Political Construct Reading
  *   **Precise Claim:** "'Intelligence' is merely a label society applies to the specific skills valued by the dominant culture and encoded into tests by institutions of power."
  *   **Verdict:** **Partially Defensible (Sociologically), but Misleading (Psychologically).**
  *   **Commentary:** It is true that test *content* can be culturally biased. However, this reading is often used to imply that the *capacity to learn and solve novel problems* is itself a social construct. While the *expression* of intelligence is culturally mediated, the underlying cognitive capacity appears to be a human universal with biological constraints.

  ---

  ### The "Insight-Stopper" Diagnosis

  When someone uses this slogan to argue that **"general intelligence is a meaningless concept and we should stop trying to define it,"** they are performing a specific rhetorical bait-and-switch.

  **They are implicitly relying on Reading 5 (Strong Anti-Realism), but they are defending it with Reading 1 (Methodological Operationalism).**

  Here is the move they are making:
  1.  **The Motte (Defensible):** "We need operational definitions to do science." (Reading 1)
  2.  **The Bailey (Controversial):** "Therefore, there is no deeper cognitive reality to discover." (Reading 5)

  They argue that because we *measure* intelligence via tests, we are forbidden from hypothesizing about the *mechanism* of intelligence. They treat the operational definition as an ontological ceiling.

  **Why this is a failure mode in AI/IQ debates:**
  In the context of AI, this slogan is particularly damaging. If intelligence is "whatever tests measure," then AI capability is just "whatever benchmarks measure." This leads to the error of assuming that because an AI passes a benchmark, it possesses the latent capability, or conversely, because it fails a benchmark, it lacks the capability.

  It prevents researchers from asking: *"What is the underlying computational capacity that allows both humans and AIs to solve these problems, and how does it scale?"* By collapsing the latent variable into the measurement, they make it impossible to theorize about generalization beyond the test set.

  ### How to Reference This in Debate

  If this slogan is dropped on you, you can respond by forcing a disambiguation:

  > "Are you making a methodological point that we need operational definitions (which is true), or are you making an ontological claim that there is no underlying cognitive mechanism causing test performance (which is false)?
  >
  > If you mean the former, we agree: let's specify our benchmarks. If you mean the latter, you are ignoring the positive manifold, behavioral genetics, and neuroscience, all of which suggest $g$ is a real, causal property of information processing systems, not just a label for a test score."

  **Summary for your taxonomy reference:**
  *   **Readings 1 & 2:** Useful constraints on rigor.
  *   **Reading 3:** The standard scientific model.
  *   **Readings 4, 5, & 6:** The "Insight-Stopper" cluster. These are the claims used to dismiss $g$ as a reification. They rely on conflating the measurement tool with the territory.
