answer: |-
  This is a fascinating translation exercise. As a game theorist, your suspicion is well-founded: there is a strong structural isomorphism between many philosophical arguments about promising and equilibrium analysis. However, the "lossless compression" you hope for hits a specific entropy limit when you move from *stability* to *normativity*.

  Here is the translation of the three main positions into your vocabulary, followed by the residue report.

  ---

  ### Part 1: The Translation

  #### 1. The Expectation-Based View (e.g., Mill, Utilitarian)
  *Philosophical Claim:* You are obligated to keep a promise because you have induced reliance. Breaching causes harm (disappointed expectations) that outweighs the benefit of breach.
  *Game-Theoretic Restatement:* **Reliance Costs in an Incomplete Contract.**
  Promising is a signal that moves the game from a *Cheap Talk* equilibrium to a *Sequential Equilibrium* with investment.
  *   **Mechanism:** Player A sends a signal ("I promise"). Player B, observing this, makes a specific investment (reliance) that is costly to reverse.
  *   **Obligation:** The "obligation" is the **Incentive Compatibility (IC) Constraint** required to sustain the efficient equilibrium. If A breaches after B invests, B incurs a sunk cost loss. The social welfare function dictates that A must internalize this negative externality.
  *   **Binding Force:** The constraint is binding only insofar as the long-term cost of destroying B's trust (reputation) or legal sanction exceeds the short-term gain from defection. If the game is one-shot and anonymous, the "obligation" dissolves because the IC constraint fails.

  #### 2. The Practice/Convention View (e.g., Rawls, Lewis)
  *Philosophical Claim:* Promising is a social institution. The obligation arises from the rules of the practice, which we accept because the practice itself is useful for coordination. You can't pick and choose; you either accept the rules or opt out of the practice.
  *Game-Theoretic Restatement:* **Correlated Equilibrium via Social Norms.**
  Promising is a **Focal Point** mechanism that solves a coordination problem.
  *   **Mechanism:** The "practice" is a publicly known correlation device. When an agent says "I promise," they are invoking a specific equilibrium strategy profile known to all players in the population.
  *   **Obligation:** The obligation is the **deviation penalty** inherent in the equilibrium. If you deviate from the practice's rules, you are no longer playing the equilibrium strategy. Other players will update their beliefs about your type and revert to a punishment equilibrium (e.g., Nash reversion, social exclusion).
  *   **Binding Force:** You are bound because opting out of the convention removes the coordination benefits. The "rules" are simply the common knowledge required to sustain the Correlated Equilibrium.

  #### 3. The Sui Generis View (e.g., Scanlon, Deontologists)
  *Philosophical Claim:* The obligation is intrinsic to the act of promising itself. It is a distinct normative power. By saying "I promise," you create a reason to act that did not exist before, independent of consequences or social utility.
  *Game-Theoretic Restatement:* **Endogenous Commitment Device / Lexicographic Preferences.**
  This is the hardest to translate, but it maps to a **constraint on the Strategy Space** rather than a modification of Payoffs.
  *   **Mechanism:** The speech act ("I promise") is not cheap talk; it is a **binding commitment technology** that is exogenous to the payoff structure. It effectively removes the "Defect" branch from the game tree for that specific interaction.
  *   **Obligation:** The agent is modeled as having a **Lexicographic Preference Ordering**. First priority: Keep promise. Second priority: Maximize material payoff.
  *   **Binding Force:** This is not derived from reputation or future gains. It is a **Type Constraint**. The agent is "hardwired" (or self-modified) such that breaching yields $-\infty$ utility, or is simply not a feasible strategy. The act of promising changes the agent's type or feasible set instantaneously.

  ---

  ### Part 2: The Residue Report

  Here is the honest assessment of the translation loss.

  #### What Translated Cleanly
  1.  **Reliance and Harm:** The Expectation view maps almost perfectly to hold-up problems and relationship-specific investment. The "harm" of a broken promise is precisely the sunk cost in the sequential game.
  2.  **Social Utility:** The Practice view maps cleanly to equilibrium selection. The "usefulness of the practice" is the efficiency gain of the Correlated Equilibrium over the mixed-strategy Nash Equilibrium.
  3.  **Stability:** All three views can be modeled as conditions for equilibrium stability. In all cases, a world where promises are kept is (usually) Pareto superior to a world where they are not.

  #### What Required Fudging
  1.  **The "Act" of Promising:** In GT, signals are usually cheap talk unless backed by incentives. In the *Sui Generis* view, the *utterance itself* changes the normative landscape. To model this, I had to assume the utterance magically alters the utility function or strategy space. In GT, words don't change payoffs; only mechanisms do. I had to treat the speech act as a *mechanism* without specifying the gears.
  2.  **Opting Out:** In the Practice view, philosophers argue you can't easily "opt out" of the practice of promising while still using the word. In GT, an agent can always choose to play a different equilibrium or exit the game. I had to fudge the "cost of exit" to make it prohibitive enough to mimic the philosophical constraint.

  #### What Has No Expression in Your Vocabulary
  **The Normative "Ought."**
  This is the critical residue. Game theory is a positive science of instrumental rationality. It tells you what an agent *will* do to maximize utility, or what they *should* do *if* they want to maximize utility.
  Philosophy asks: "Why *ought* I keep the promise even if I can defect without reputation loss, without harming expectations, and without violating a social convention?"
  *   **GT Answer:** "You shouldn't. Unless you have a preference for it."
  *   **Philosophical Answer:** "You should, because you created a right in another person."
  GT has no variable for **Rights** or **Validity**. It only has **Power** (ability to enforce) and **Preference** (desire to act).

  ---

  ### Part 3: The Moral vs. Prudential Distinction

  You asked specifically about the distinction between a *moral* reason (duty) and a *prudential* reason (reputation/payoff).

  **Can it be stated in GT terms?**
  Technically, **yes**, but only by collapsing the distinction.
  *   **Prudential:** $U(\text{Keep}) > U(\text{Break})$ because of future reputation payoffs ($\delta V_{future}$).
  *   **Moral:** $U(\text{Keep}) > U(\text{Break})$ because of an internal "guilt" or "duty" parameter ($\mu$).

  In both cases, the agent is maximizing a utility function. The math looks identical:
  $$ \text{Choose Keep if } \delta V_{future} + \mu > \text{Gain from Defection} $$

  **The Problem:**
  In your vocabulary, the "moral" reason is just another **preference parameter**. It is indistinguishable from a taste for ice cream or a fear of punishment. If a philosopher says, "I keep the promise *because it is right*, not because I *want* to," game theory hears, "You derive utility from doing the right thing."

  **The Verdict:**
  This suggests two possibilities:

  1.  **Your Vocabulary is Missing Something Real:**
      Game theory assumes **Consequentialism** (actions are judged by outcomes/utility). Moral obligation often claims **Deontology** (actions are judged by adherence to rules/rights, regardless of utility).
      If the moral/prudential distinction is real, then human agency is not fully captured by utility maximization. There is a mode of reasoning (reason-giving, validity claims) that is not reducible to preference satisfaction. If this is true, GT is a subset of rationality, not the whole set.

  2.  **The Philosophers' Distinction is Less Clear Than It Looks:**
      It is possible that the "feeling" of moral obligation is just an evolved psychological commitment device. Evolution hardwired $\mu$ (guilt/duty) into us because it solved the one-shot Prisoner's Dilemma better than pure prudential calculation.
      If this is true, the philosophers are describing the *phenomenology* of the commitment device, while you are describing the *mechanism*. The distinction is real to the agent, but illusory to the modeler.

  **My Honest Assessment:**
  Your suspicion is 90% correct. Most philosophical debates about *why* we promise are actually debates about *which equilibrium selection device* we are using (reputation vs. convention vs. internalized norms).

  However, the remaining 10% is the **Normative Gap**. Game theory can explain why a promise-keeping *equilibrium* exists and is stable. It cannot explain why an agent *should* feel bound to it when the equilibrium breaks down (e.g., in a one-shot game with no reputation effects).
  *   If you think the philosophers are wrong to think there's an obligation in that one-shot case, then your vocabulary is sufficient.
  *   If you think there *is* an obligation even then (as many do), then your vocabulary is missing the concept of **Validity**—the idea that some moves are off-limits not because they are costly, but because they are illegitimate.

  **Recommendation:**
  Treat the "Moral" parameter not as a preference, but as a **constraint on the feasible set**.
  *   Prudential: Defect is feasible, but low payoff.
  *   Moral: Defect is *infeasible* (conceptually ruled out).
  This preserves the distinction better than burying it in the utility function. It aligns with your work on mechanism design: sometimes the mechanism simply removes the option to defect. The philosophical debate is essentially about whether the human mind runs a mechanism that removes the option, or one that just prices it highly.
