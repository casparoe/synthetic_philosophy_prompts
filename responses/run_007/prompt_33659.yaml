  2.  **Deconstruct the Slogan ("Occam's Razor is a Theorem"):**
      *   What does Solomonoff Induction actually say? It defines a universal prior $M(x) = \sum_{p: U(p)=x*} 2^{-|p|}$. Shorter programs get higher weight.
      *   What does "Occam's Razor" mean in this context? Prefer simpler hypotheses.
      *   What does "Theorem" imply? Mathematical necessity, universality, objective truth.
      *   What is the gap? The gap between *mathematical properties of SI* and *actual scientific practice/ontology*.

