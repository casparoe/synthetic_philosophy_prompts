      *   *Counter-argument:* It doesn't show simplicity is *true* (realism), nor does it escape the choice of UTM (which can be seen as a "sociological" choice of language), nor does it handle uncomputable physics (if any).
      *   *Verdict:* The member is overreaching. The math licenses a *pragmatic* rule for prediction, not an *ontological* theorem about nature. It actually reinforces the pragmatic view (it works for prediction) rather than refuting it.

  6.  **Refining the "Least Sure" Point:**
