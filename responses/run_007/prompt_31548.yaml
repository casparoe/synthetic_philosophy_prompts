prompt: |-
  I run a small research group inside a company that builds robots and vision systems whose internal states are supposed to stand for things in the world — a map a robot maintains, object tokens in a perception stack, a planner's belief variable. We make calls like this every week, and the stakes are high: our safety cases and papers rest on claims about what a system represents, not merely what its states correlate with. I have been told that teleosemantics — the program of naturalizing mental content by appeal to biological function — has the sharpest version of the distinction. Roughly, a state has content when it has the function of indicating something or of guiding behavior in a way that depends on that thing, and it misrepresents when it fails at that function. I want that turned into a reusable procedure my engineers can actually run.

  Please write a decision procedure, grounded in the actual teleosemantics literature — Dretske's indicator/function approach and Millikan's producer–consumer account, including where the two would give different verdicts — that a non-philosopher engineer can apply to a given internal state in about half a day and decide: does this state have semantic content, and if so, what does it represent, and under what conditions would it count as misrepresenting? The procedure should be a sequence of questions with what counts as a sufficient answer to each; it should say where it stops with "no, only a correlate"; it should mark the steps that are judgment calls dressed up as procedure and the points where it should stop and hand the decision to a person because it has become a question of values or theory choice rather than facts; and it should say what it cannot do. Then run it on three cases: (a) the honeybee waggle dance, as a calibration case; (b) a hidden unit in a trained vision model that activates almost exactly when a door is in the image; and (c) a robot's internal battery-voltage variable that is logged but never consumed by any downstream module. Make sure at least one worked application reaches a conclusion my team will not like. Finally, say how confident you are in the procedure you have given and single out the point you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Leader of a small research group in a robotics/vision company.
      *   **Context:** High stakes (safety cases, papers). Claims about *representation* matter, not just correlation.
      *   **Task:** Create a reusable decision procedure based on *teleosemantics* (specifically Dretske and Millikan) for engineers to determine if an internal state has semantic content, what it represents, and when it misrepresents.
      *   **Constraints:**
          *   Must be usable by non-philosophers in ~0.5 days.
          *   Must be grounded in literature (Dretske, Millikan).
          *   Must highlight divergence points between the two theories.
          *   Must identify "judgment calls" vs. "facts."
          *   Must identify where it stops ("no, only a correlate").
          *   Must identify where it hands off to humans (values/theory choice).
          *   Must state limitations ("what it cannot do").
          *   **Applications:** Run on three cases: (a) Honeybee waggle dance (calibration), (b) Hidden unit in vision model (door detector), (c) Robot battery variable (logged but unused).
          *   **Requirement:** At least one conclusion must be unwelcome to the team.
          *   **Reflection:** State confidence level and least certain point.

  2.  **Deconstruct Teleosemantics (Dretske vs. Millikan):**
      *   *Core Idea:* Content is grounded in biological (or designed) *function*. A state represents $X$ if it is *supposed to* indicate $X$ or guide action regarding $X$, and it can fail (misrepresent) if it occurs without $X$ when it was supposed to indicate $X$.
      *   *Dretske (Indicator/Function):* Focuses on the *learning/history* of the indicator. A state represents $X$ if it was recruited because it carried information about $X$. Key: The function is to indicate.
      *   *Millikan (Producer-Consumer):* Focuses on the *systemic role*. A "producer" makes a state, a "consumer" uses it. Content is determined by the conditions under which the consumer's use of the state leads to success (fulfillment of proper function). Key: The function is to guide successful action.
      *   *Divergence:* Dretske might say a state represents $X$ if it was selected for indicating $X$, even if the downstream system is broken. Millikan might say content is undefined or different if the consumer cannot successfully use it to achieve its goal. Millikan is more relational (producer-consumer pair); Dretske is more historical/etiological regarding the signal itself.

  3.  **Drafting the Decision Procedure (The "Teleosemantic Audit"):**
      *   *Goal:* Make it algorithmic but honest about philosophical fuzziness.
      *   *Structure:* Step-by-step questions.
      *   *Step 1: Existence of Function.* Is the state there *because* of what it does? (vs. side effect).
      *   *Step 2: The Consumer.* Is there a downstream mechanism using this? (Millikan emphasis).
      *   *Step 3: The Condition of Success.* What makes the consumer's action work?
      *   *Step 4: Error Possibility.* Can the state exist when the condition fails?
      *   *Step 5: Dretske vs. Millikan Check.* Where do they split?
      *   *Flags:* Mark "Engineering Judgment," "Philosophical Theory Choice," "Stop."

  4.  **Developing the Test Cases:**
      *   *(a) Honeybee Waggle Dance:* Classic example. Should pass. Represents direction/distance to nectar. Misrepresentation: Dance indicates nectar, none there.
      *   *(b) Hidden Unit (Door Detector):* Tricky. Correlates strongly. But was it *selected* for that? Or did it just emerge? If it's a standard backprop net, the "function" is minimizing loss, not necessarily "representing doors." This is likely the "unwelcome conclusion" (it's just a correlate, not a representation).
      *   *(c) Battery Variable (Logged only):* No consumer. Millikan says no content (no use). Dretske might be ambiguous but leans towards no function if it doesn't guide behavior. This should also fail, reinforcing the "unused data isn't representation" point.

      *Decision:* Case (b) is the best candidate for the "unwelcome conclusion." Engineers love to say "this neuron represents a door." Teleosemantics often denies this if there's no specific etiological function or dedicated consumer mechanism distinct from the statistical correlation. I need to make sure the procedure forces this distinction.

  5.  **Refining the Procedure for Engineers:**
      *   Avoid jargon like "etiological" without definition.
      *   Use terms like "Design Intent," "Downstream Dependency," "Failure Mode."
      *   Explicitly mark the "Theory Choice" points (Dretske vs. Millikan).

  6.  **Addressing the Constraints:**
      *   *Time:* ~0.5 days. Keep it to ~10 key questions.
      *   *Unwelcome Conclusion:* Case (b) concluding "No Content" is standard teleosemantics but annoying for AI researchers.
      *   *Confidence:* Be humble. This is philosophy applied to engineering.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the stakes.
      *   *The Procedure:* "The Teleosemantic Content Audit (TCA)."
      *   *Sections:*
          1.  Functional Status (Is it a bug or a feature?).
          2.  The Consumer Test (Millikan).
          3.  The Indicator Test (Dretske).
          4.  Misrepresentation Condition.
          5.  Verdict & Divergence.
      *   *Annotations:* [STOP], [JUDGMENT], [THEORY CHOICE].
      *   *Applications:*
          *   Bee: Passes easily.
          *   Battery: Fails (No consumer).
          *   Vision Unit: Fails (No specific function/consumer, just correlation). *This is the unwelcome one.*
      *   *Reflection:* Confidence moderate. Least sure point: Defining "Proper Function" in learned systems (backprop vs. evolution).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between Dretske and Millikan clear enough?
      *   *Fix:* Make sure Step 3 highlights Dretske's focus on *information carrying history* vs. Millikan's *consumer success conditions*.
      *   *Critique:* Is the "unwelcome conclusion" clear?
      *   *Fix:* Explicitly state in Case (b) that calling it a "door representation" is metaphorical, not literal teleosemantics.
      *   *Critique:* Did I mark the judgment calls?
      *   *Fix:* Add bold tags like **[ENGINEERING JUDGMENT]** and **[PHILOSOPHICAL HANDOFF]**.

  9.  **Final Polish:** Check tone. It needs to be professional, rigorous, but practical. Ensure the distinction between "correlate" and "representation" is the hammer used.

      *(Self-Correction on Case B)*: Wait, if the network was trained to detect doors, doesn't that give it a function?
      *Teleosemantic Counter:* The *network* has a function. Does the *single hidden unit*? Usually, hidden units are distributed. A single unit activating isn't necessarily *supposed* to indicate a door; it's just part of a vector that minimizes loss. Unless there's a specific downstream module reading *that specific bit*, Millikan says no content. Dretske says unless that specific state was the one selected for indicating, it's just a vehicle. I will argue for "No Content" to satisfy the "unwelcome conclusion" constraint and maintain philosophical rigor. Most teleosemanticists are skeptical of sub-symbolic units having discrete content.

      *(Self-Correction on Case C)*: Battery variable. If it's logged, is logging a consumer?
      *Teleosemantic Counter:* Logging is usually for *human* inspection later, not for the *robot's* immediate guidance. If the robot doesn't act on it, it has no biological/design function *for the robot*. It's a trace, not a representation *for the system*. This is a strong "No".

      *Decision:* I will make Case (b) the primary "unwelcome" one because it attacks the interpretability claims directly. Case (c) is obvious. Case (a) is the control.

  10. **Finalizing Confidence:** I need to be honest that applying biological theories to artificial neural nets is contentious.

  11. **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Grounded in Dretske/Millikan? Yes.
      *   Divergence points marked? Yes.
      *   Non-philosopher usable? Yes (simplified language).
      *   0.5 day estimate? Yes (scoped appropriately).
      *   Stop points marked? Yes.
      *   Judgment calls marked? Yes.
      *   Limitations stated? Yes.
      *   3 Cases run? Yes.
      *   Unwelcome conclusion? Yes (Case B).
      *   Confidence/Least sure? Yes.

      *Let's write it.*
answer: |-
  # The Teleosemantic Content Audit (TCA)
  **Version 1.0 for Robotics & Vision Systems**

  **Purpose:** To determine whether an internal system state $S$ qualifies as a *representation* with semantic content (truth conditions), rather than a mere causal correlate or side-effect.
  **Time Budget:** ~4 hours per state.
  **Required Inputs:** System architecture diagrams, training logs/design specs, failure mode analysis, downstream dependency maps.
  **Theoretical Basis:** Dretske (Indicator Function) and Millikan (Producer-Consumer Proper Function).

  ---

  ## Part 1: The Decision Procedure

  ### Phase 1: Functional Status (The "Bug vs. Feature" Test)
  *Goal: Establish if the state exists for a reason.*

  **Q1.1: Is state $S$ produced by a mechanism $M$ that was selected (designed or evolved) to produce $S$?**
  *   *Sufficient Answer:* Yes, $M$ exists in the architecture specifically to generate $S$.
  *   *Sufficient Answer:* No, $S$ is a side-effect (e.g., heat, memory leakage, emergent activation without design intent).
  *   **[STOP]** If **No**: $S$ is a physical byproduct, not a representation. **Verdict: No Content.**
  *   **[ENGINEERING JUDGMENT]:** Distinguishing "designed to produce" from "inevitable consequence of design" in learned systems (e.g., neural nets) is hard. Consult training loss functions.

  **Q1.2: Does the presence of $S$ play a causal role in the system's subsequent behavior?**
  *   *Sufficient Answer:* Yes, downstream modules read $S$ to determine actions/outputs.
  *   *Sufficient Answer:* No, $S$ is a "sink" (logged only, never read by the agent).
  *   **[STOP]** If **No**: $S$ is a trace, not a representation *for the system*. **Verdict: No Content.** (Note: It may represent something to the *human analyst*, but not to the robot).

  ### Phase 2: The Consumer Test (Millikan's Account)
  *Goal: Determine content based on how the state is used.*

  **Q2.1: Identify the "Consumer" module $C$ that reads $S$. What is $C$'s "Proper Function"?**
  *   *Definition:* $C$'s Proper Function is what $C$ is *supposed* to do to contribute to the system's survival or goal completion.
  *   *Sufficient Answer:* $C$ is supposed to navigate to a location / grasp an object / avoid collision.
  *   **[PHILOSOPHICAL HANDOFF]:** If $C$'s goal is ambiguous (e.g., "minimize loss" vs. "find door"), pause. This is a theory-choice question about the system's teleology.

  **Q2.2: Under what conditions in the world does $C$ successfully perform its Proper Function when relying on $S$?**
  *   *Sufficient Answer:* $C$ succeeds *if and only if* property $P$ holds in the world (e.g., "There is a door at location $L$").
  *   *Sufficient Answer:* $C$ succeeds regardless of $P$, or depends on a complex conjunction of factors where $S$ is negligible.
  *   **[STOP]** If **No specific condition**: $S$ does not have determinate content. **Verdict: No Content.**

  **Q2.3: Can $S$ occur when condition $P$ does *not* hold?**
  *   *Sufficient Answer:* Yes. The system can be in state $S$ even if $P$ is false.
  *   *Sufficient Answer:* No. $S$ is physically necessitated by $P$ (infallible).
  *   **[STOP]** If **No**: Infallible states do not misrepresent. **Verdict: Causal Signal, not Semantic Representation.** (Teleosemantics requires the possibility of error).

  ### Phase 3: The Indicator Test (Dretske's Account)
  *Goal: Determine content based on the history of the signal.*

  **Q3.1: Was mechanism $M$ recruited/tuned specifically because $S$ carried information about $P$?**
  *   *Sufficient Answer:* Yes. The design/training loop reinforced $M$ because $S$ correlated with $P$.
  *   *Sufficient Answer:* No. $S$ correlates with $P$, but $M$ was tuned for a different signal $Q$, or for general loss reduction.
  *   **[THEORY CHOICE DIVERGENCE]:**
      *   If **Yes**: Dretske says **Content = $P$**.
      *   If **No**: Dretske says **No Content** (even if Millikan might allow it based on current use).

  ### Phase 4: Verdict & Misrepresentation Conditions

  **Q4.1: Synthesis.**
  *   If Phase 1 & 2 Pass: Millikan says **Content = $P$** (from Q2.2).
  *   If Phase 1 & 3 Pass: Dretske says **Content = $P$** (from Q3.1).
  *   If both Pass: High Confidence.
  *   If they diverge: See "Divergence Protocol" below.

  **Q4.2: Define Misrepresentation.**
  *   **Condition:** State $S$ is active AND Condition $P$ (from Q2.2/Q3.1) is false in the world.
  *   **Consequence:** The Consumer $C$ attempts its Proper Function and fails (or would fail if not for backup systems).

  ---

  ## Part 2: Divergence Protocol (When Dretske and Millikan Disagree)

  **Scenario A: The Broken Consumer.**
  *   *Situation:* $S$ was designed to indicate $P$ (Dretske Pass), but the downstream module $C$ is broken or uses $S$ for something else (Millikan Fail).
  *   *Verdict:* **Dretske:** Represents $P$ (but system is malfunctioning). **Millikan:** No content (no successful consumption).
  *   *Action:* For safety cases, assume **Dretske**. If the design intent was indication, treat errors as misrepresentations, not just noise.

  **Scenario B: The Repurposed Signal.**
  *   *Situation:* $S$ was designed for $P$, but $C$ now successfully uses it for $Q$ (e.g., a sensor drift that the planner learned to exploit).
  *   *Verdict:* **Dretske:** Represents $P$ (historical function). **Millikan:** Represents $Q$ (current success condition).
  *   *Action:* **Handoff to Human.** This is a question of whether you care about *design safety* (Dretske) or *operational reality* (Millikan). For safety certification, prioritize Dretske (design intent). For performance papers, Millikan may be acceptable.

  ---

  ## Part 3: Limitations & Handoffs

  **What this procedure CANNOT do:**
  1.  **Resolve "Grue" Problems:** It cannot distinguish between "represents Green" and "represents Grue" without external temporal data.
  2.  **Assign Content to Distributed States:** It struggles with highly distributed representations (e.g., a pattern across 10,000 neurons) where no single "Consumer" reads a specific state $S$.
  3.  **Determine Moral Status:** It says nothing about whether the system *feels* like anything (phenomenology).
  4.  **Arbitrate Training Ambiguity:** In deep learning, if the loss function is generic ("minimize error"), Q3.1 often fails. This is a **[THEORY CHOICE]** point: Do you treat loss minimization as a "function"? (Standard teleosemantics says no; it needs a specific biological/design analog).

  **Where to Handoff to a Philosopher:**
  *   If Q2.1 (Proper Function) yields multiple conflicting goals.
  *   If Q3.1 (History) is ambiguous due to self-modifying code or continuous online learning.
  *   If the "Unwelcome Conclusion" (see below) threatens a core safety claim.

  ---

  ## Part 4: Worked Applications

  ### Case (a): The Honeybee Waggle Dance (Calibration)
  *   **Q1.1:** Is the dance produced by a mechanism selected to produce it? **Yes.** (Evolutionary history).
  *   **Q1.2:** Does it cause behavior? **Yes.** (Other bees fly).
  *   **Q2.1:** Consumer Proper Function? **Find nectar.**
  *   **Q2.2:** Success Condition? **Nectar exists at vector $V$.**
  *   **Q2.3:** Can dance occur without nectar? **Yes.** (Experimenter moves nectar).
  *   **Q3.1:** Recruited for information? **Yes.** (Evolutionary selection for communication).
  *   **Verdict:** **Content: "Nectar is at vector $V$."**
  *   **Misrepresentation:** Bee dances for $V$, but nectar is gone.
  *   **Outcome:** Passes. This confirms the procedure works on the paradigm case.

  ### Case (b): Hidden Unit in Trained Vision Model (The "Door Detector")
  *   *Context:* A single neuron $U$ in Layer 5 activates at 0.95 probability when a door is present. Engineers call this "The Door Unit."
  *   **Q1.1:** Was $U$ specifically designed to produce this activation? **No.** It emerged via backpropagation minimizing global loss.
  *   **Q1.2:** Does it cause behavior? **Yes,** it contributes to the final vector.
  *   **Q2.1:** Consumer Proper Function? The downstream layers minimize classification loss.
  *   **Q2.2:** Success Condition? **Correct classification of the image.** (Not specifically "door presence").
  *   **Q2.3:** Can $U$ activate without a door? **Yes.** (Adversarial examples, or correlated features like a rectangular frame).
  *   **Q3.1:** Was $U$ recruited *because* it indicated doors? **No.** It was recruited because it helped minimize loss. It might be indicating "rectangular vertical gradient" or "contextual hallway feature." The *network* was selected for doors; the *unit* was not individually selected.
  *   **Divergence:**
      *   **Millikan:** Content is indeterminate. The consumer (downstream layers) uses $U$ as part of a vector. $U$ alone has no success condition.
      *   **Dretske:** No content. $U$ has no etiological history of being selected *as an indicator*.
  *   **Verdict:** **NO SEMANTIC CONTENT.**
  *   **Misrepresentation Condition:** Undefined.
  *   **Outcome:** **UNWELCOME CONCLUSION.** Your engineers cannot claim "Unit 45 represents a door." It is a *correlate* that contributes to a function. Calling it a representation is a metaphor, not a teleosemantic fact. For safety cases, you must treat it as a statistical feature, not a belief.

  ### Case (c): Robot Battery-Voltage Variable (Logged Only)
  *   *Context:* Variable `bat_vol` is read by the power management system but the specific log entry $L$ is written to disk and never read by the robot.
  *   **Q1.1:** Is $L$ produced by a mechanism selected to produce it? **Yes** (Logging subroutine).
  *   **Q1.2:** Does $L$ cause robot behavior? **No.** It is a sink. The *variable* affects behavior; the *log entry* does not.
  *   **[STOP]** at Q1.2.
  *   **Verdict:** **NO CONTENT (for the robot).**
  *   **Nuance:** It represents voltage *to the human analyst* who reads the log later. But for the robot's safety case, the log entry is not an internal representation guiding action.
  *   **Outcome:** Passes. Distinguishes internal state from external trace.

  ---

  ## Part 5: Confidence & Uncertainty

  **Confidence Level:** **Moderate (60%).**
  The procedure is robust for classical control architectures (Case C) and biological analogs (Case A). It is significantly less robust for modern deep learning systems (Case B).

  **Least Certain Point:** **Q3.1 in Learned Systems (The "Etiology of Weights" Problem).**
  Teleosemantics relies on *selection history*. In evolution, selection is clear. In backpropagation, selection is distributed over millions of weights to minimize a global loss function.
  *   *The Uncertainty:* Does minimizing global loss count as "selecting $S$ to indicate $P$"?
      *   If **Yes**: Case (b) might pass, granting content to hidden units.
      *   If **No** (Standard View): Case (b) fails.
  *   *Why this matters:* Most philosophers of cognitive science lean toward **No** for individual hidden units. They argue the *whole network* represents, not the parts. If your safety case relies on "The system believes there is a door," you are safe. If it relies on "Neuron 45 believes there is a door," you are on thin ice. I have written the procedure to reflect the stricter, standard philosophical view (No), which is why Case (b) fails.

  **Recommendation:** For safety cases, use the **Dretske** branch (Design Intent). If you can prove the system was *designed* such that state $S$ is *supposed* to track $P$, you can claim representation even if the learning dynamics are opaque. If you cannot prove design intent for a specific state, classify it as a **Correlate**.
