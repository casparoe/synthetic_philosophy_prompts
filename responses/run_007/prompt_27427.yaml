  4.  **Analyzing Each Reading against Criteria:**

      *   *Reading 1 (Institutional):* Defensible (Constitutional). Trivial in liberal democracies. Doesn't apply to the interlocutor (they aren't running a theocracy).
      *   *Reading 2 (Rhetorical):* Defensible (norm of persuasion). Substantive but narrow. Doesn't apply (interlocutor didn't quote scripture).
      *   *Reading 3 (Justificatory/Public Reason):* Defensible (Rawls). Substantive. *Crucial:* Does it apply to Natural Law? Natural Law claims to be accessible to reason, not just revelation. So, technically, no. But critics might argue it's "crypto-theology."
      *   *Reading 4 (Motivational):* Hard to defend (psychologically impossible/policeable). Substantive. Applies if we assume the natural law argument is a sham for religious motivation.
      *   *Reading 5 (Ontological/Exclusionary):* Illiberal. Highly substantive. Applies broadly.

  5.  **Focusing on the Specific Context (Natural Law):**
      *   The interlocutor used *Natural Law*. This is the pivot point.
