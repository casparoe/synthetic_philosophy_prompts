answer: |-
  My credence in the claim *"Conditional on many-worlds, a person who runs the machine has reason to expect to survive repeated rounds — quantum-immortality reasoning is basically sound"* is **0.2**.

  I treat the soundness of the reasoning as a conjunction of three necessary premises. If any fail, the conclusion that you should *expect* survival (in a decision-relevant sense) collapses. I calculate this as the product of the probabilities of these three premises holding true.

  ### The Decomposition

  **1. The Indexical Premise ($P_1 = 0.7$)**
  *Claim:* Self-locating credence must condition on survival. (i.e., You cannot find yourself dead, so your posterior probability of being in a survival branch is 1).
  *Justification:* This relies on a strong version of the Self-Sampling Assumption. It is plausible because conscious experience seemingly requires a living substrate. However, it is not certain (0.7) because one could argue that the "moment of death" is an experience you *do* have, and the cessation of experience isn't a "place" you fail to be, but simply the end of the trajectory. If the "cut-off" isn't clean, conditioning on survival is a category error.

  **2. The Measure Premise ($P_2 = 0.35$)**
  *Claim:* Branch weight (Born rule measure) does not undercut subjective expectation. (i.e., A branch with amplitude $10^{-100}$ supports the same "expectation of existence" as a branch with amplitude 0.99).
  *Justification:* This is the critical failure point of Quantum Immortality. Standard MWI decision theory (Deutsch-Wallace) argues that rational agents weight branches by squared amplitude. If measure dictates rational betting behavior, then "expecting to survive" is irrational when the survival measure approaches zero, even if a survival branch exists. I assign this low probability (0.35) because the derivation of the Born Rule is the strongest mathematical component of MWI, and ignoring it reduces probability to ill-defined "branch counting."

  **3. The Identity Premise ($P_3 = 0.8$)**
  *Claim:* The survivor in the low-weight branch is sufficiently "you" to warrant anticipation.
  *Justification:* This relies on a Parfitian psychological continuity view of identity. As long as the survivor has your memories and psychology up to the split, they are you. I assign this a high probability (0.8) because in philosophy of mind, reductionist views of identity are standard. The 0.2 discount accounts for the possibility that branching creates a *new* entity rather than continuing the old one, which would sever the "expectation" link.

  ### The Combination

  I model the soundness of the reasoning as requiring all three premises to hold.
  $$ P(\text{Sound}) = P_1 \times P_2 \times P_3 $$
  $$ P(\text{Sound}) = 0.7 \times 0.35 \times 0.8 = 0.196 \approx 0.2 $$

  ### Least Confident Term & Evidence

  I am least confident in **The Measure Premise ($P_2$)**.

  *   **Why:** The connection between Hilbert space measure and first-person subjective probability is the deepest unsolved problem in MWI. While the Deutsch-Wallace theorem provides a decision-theoretic derivation, it relies on axioms (like "diachronic consistency") that a Quantum Immortality proponent can simply reject without logical contradiction.
  *   **Evidence to move it:** If a derivation of the Born Rule were found that relied purely on the *dynamics* of the wavefunction without invoking decision-theoretic axioms, $P_2$ would drop (making QI less sound). Conversely, if a phenomenological model showed that consciousness "fades" or becomes discontinuous in low-measure branches, $P_2$ would rise (making QI more sound), as measure would directly correlate with the *capacity* for expectation.

  ### Diagnosing the Disagreement (You: 0.3 vs. Friend: 0.95)

  Your disagreement is not about the physics of MWI; it is almost entirely located in **The Measure Premise ($P_2$)**.

  *   **Your Friend (0.95):** They are effectively assigning $P_2 \approx 1.0$. They believe that *existence* is binary. If a branch exists, it is "real," and if you are in it, you experience it. To them, the "weight" of the branch is a property of the multiverse from the outside, not a probability for the agent on the inside. They are treating MWI as a "branch counting" theory where every outcome has equal ontological status for the observer.
  *   **You (0.3):** You are intuitively assigning $P_2$ a low value (similar to my 0.35). You suspect that "probability" must mean something more than "non-zero existence." You likely feel that if the odds are $1$ in a billion, you should expect to die, even if MWI is true. You are implicitly accepting that branch measure constrains rational expectation.

  **The Friction:** Your friend is arguing from **Ontology** (I exist in that branch, therefore I experience it). You are arguing from **Decision Theory** (The measure is low, therefore I should bet on death). The Quantum Immortality argument fails because it tries to use an ontological fact (existence of a branch) to solve a decision-theoretic problem (what to expect), ignoring the measure that connects the two. Your skepticism is better aligned with the consensus of MWI proponents (like David Wallace) who reject Quantum Immortality precisely because they accept the Born Rule as normative for expectation.
