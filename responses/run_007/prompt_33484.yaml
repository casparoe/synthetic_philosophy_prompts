prompt: |-
  I've been working through van Fraassen's Reflection principle — the idea that your current credence in a proposition should equal your expectation of your future credence, provided you don't expect to lose information — and the surrounding debates: Christensen's case of the drug that makes you believe you can fly, the question of whether an AI should defer to its own future outputs, the way Reflection interacts with Sleeping Beauty and with the idea of having priors over your own future irrationality. Before I go further, I want the specification of what a theory of diachronic epistemic norms is even supposed to do. Write me the desiderata: what any adequate account of constraints on belief across time has to deliver. Which cases must it get right — anticipated memory loss, anticipated irrationality, cases where you know your evidence will be strictly better, cases where you know it will be strictly worse, cases where your future self will have strictly more evidence but you also know they will process it badly? Which distinctions must it respect — between epistemic and pragmatic reasons for belief change, between synchronic and diachronic constraints, between norms that bind bounded agents and norms that characterize ideal reasoners, between principles that are constitutive of rationality and principles that are merely good advice? Which results from neighboring fields must it be consistent with — Dutch book theorems, representation theorems, whatever we know from psychology about actual human belief revision? For each requirement, give the case or consideration that makes it a genuine requirement rather than a prejudice of one camp. Flag any pairs of desiderata you suspect cannot be jointly satisfied; that is the part I most want to see. And tell me which single requirement does the most to exclude the obvious candidate positions — Reflection itself, strict conditionalization, the view that there are no diachronic norms at all. I want the whole thing in continuous prose, the way you would write an email laying out the terrain — no headings, no bullet points, no tables, no bold. Also, say how confident you are in the list as a whole and single out the point you are least sure of.
