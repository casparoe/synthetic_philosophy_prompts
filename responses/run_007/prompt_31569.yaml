prompt: |-
  I work on the survey design team at a large public-health research institute. We run longitudinal studies tracking health outcomes across populations, and we're constantly fighting about which demographic categories to include on our intake forms and how to ask about them. The fights are usually between people who say "we need to track race/gender/etc. because health disparities are real" and people who say "these categories are socially constructed and by using them we're reifying them and doing harm." Both sides are right about something and we have no framwork for resolving this.

  I want a decision procedure my team can use when we're designing a new survey or revising an old one. For each candidate category (say, a race question, a gender question, a disability-status question, an income bracket question), the procedure should walk us through: should we include it at all? If yes, should we use fixed checkboxes or a free-text field? Should we let people select multiple? And when should we push back on a funder or a PI who insists on a category we think is harmful?

  Ground this in whatever the social-construction literature actually implies for practical classification decisions — not the metaphysics for its own sake, but what follows for someone who has to build a form that real people will fill out. The procedure has to be something a team with no philosophy background can run in an hour-long meeting. Flag the steps that are genuinely judgment calls vs. steps where the theory gives a clear answer. And be honest about where the procedure will give an answer that makes everyone unhappy.

  Then run it on three cases: (1) a question about race/ethnicity on a study of maternal health outcomes, where we know there are real disparities but the standard OMB categories are a mess; (2) a question about gender identity on a study of adolescent mental health, where our IRB is nervous and some parents will see the form; (3) a question about "household income" on a study of food insecurity, where the category seems straightforward but the construction is actually pretty loaded (what counts as a household? whose income?).
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case studies:

  1.  **Deconstruct the Request:**
      *   **Context:** Large public-health research institute, longitudinal studies.
      *   **Problem:** Internal conflict between "tracking disparities requires categories" (essentialist/pragmatic view) vs. "categories are socially constructed and reifying them causes harm" (constructionist/critical view).
      *   **Goal:** A decision procedure for survey design teams (no philosophy background) to use in ~1 hour.
      *   **Requirements:**
          *   Grounded in social construction literature (practical implications, not metaphysics).
          *   Address: Include? Fixed vs. Free-text? Multiple selection? Pushing back on funders/PIs?
          *   Distinguish judgment calls vs. clear theoretical answers.
          *   Acknowledge where the procedure makes everyone unhappy.
          *   Apply to three specific cases: Race/Ethnicity (Maternal Health), Gender Identity (Adolescent Mental Health), Household Income (Food Insecurity).

  2.  **Theoretical Grounding (Social Constructionism in Practice):**
      *   *Core Insight:* Categories aren't "natural kinds" (like blood type) but they have "real consequences" (like Thomas Theorem: "If men define situations as real, they are real in their consequences").
      *   *Implication 1:* Don't treat categories as biological truths. Avoid language implying innate difference.
      *   *Implication 2:* Categories measure *experience of social positioning*, not intrinsic identity.
      *   *Implication 3:* Measurement affects the phenomenon (reactivity).
      *   *Implication 4:* Granularity matters. Aggregation hides harm; over-specificity risks identification/stereotyping.
      *   *Key Framework:* Ian Hacking's "Looping Effects" (classifying people changes how they understand themselves) + Nancy Krieger's "Ecosocial Theory" (embodiment of social conditions).
      *   *Practical Rule:* Measure the *social exposure* or *lived experience* associated with the category, not just the label.

  3.  **Drafting the Decision Procedure (The "Classification Impact Assessment"):**
      *   Needs to be step-by-step.
      *   Needs to fit in an hour.
      *   Needs to address the specific questions (Include? Format? Multiplicity? Pushback?).

      *   *Step 1: The "Why" Test (Necessity).* Is there a specific hypothesis linking this category to a mechanism? Or is it just "standard"?
      *   *Step 2: The "Harm/Benefit" Analysis.* Who benefits from the data? Who risks harm (stereotyping, reification)?
      *   *Step 3: The "Mechanism" Check.* Are we measuring the label or the exposure (racism, sexism, poverty)?
      *   *Step 4: Format & Granularity.* Fixed vs. Open, Single vs. Multi.
      *   *Step 5: The Pushback Protocol.* How to talk to PIs/Funders.

      *   *Refining for "No Philosophy Background":* Use plain language. Instead of "Ontological Status," use "What are we actually measuring?" Instead of "Reification," use "Making it seem biological."

  4.  **Addressing the "Unhappy Answers":**
      *   Sometimes the procedure says "Don't ask." PIs hate that.
      *   Sometimes it says "Ask, but it's messy." Analysts hate that.
      *   Sometimes it says "Ask open-ended." Coders hate that.
      *   Need to explicitly flag these tension points.

  5.  **Developing the Case Studies:**

      *   **Case 1: Race/Ethnicity (Maternal Health).**
          *   *Tension:* Disparities are real (Black maternal mortality) vs. OMB categories are political/blurry.
          *   *Application:* Must include (disparities exist). But don't treat as biological. Add racism/experience questions. Allow multiple/write-in.
          *   *Unhappy outcome:* Analysis becomes harder; OMB reporting requires collapsing data later.

      *   **Case 2: Gender Identity (Adolescent Mental Health).**
          *   *Tension:* Trans youth mental health crisis vs. IRB/Parental consent/outting risks.
          *   *Application:* Two-step method (sex assigned, current identity). Privacy is paramount.
          *   *Unhappy outcome:* IRB might still block it; parents might object; data might be noisy.

      *   **Case 3: Household Income (Food Insecurity).**
          *   *Tension:* Economic determinant vs. "Household" is a social construct (who counts? pooled resources?).
          *   *Application:* Define "household" explicitly. Ask about resource access, not just raw income.
          *   *Unhappy outcome:* Respondents find it confusing; comparability with Census data decreases.

  6.  **Review and Refine:**
      *   *Tone:* Professional, empathetic, pragmatic, authoritative but humble.
      *   *Check:* Did I answer the specific prompts? (Include? Format? Multiple? Pushback?)
      *   *Check:* Is the social construction theory visible but not jargon-heavy? (Focus on Hacking/Krieger concepts without name-dropping too much).
      *   *Check:* Are the judgment calls flagged? Yes, need to highlight where the team must vote.

  7.  **Final Polish:**
      *   Ensure the "Decision Procedure" looks like a checklist or workflow.
      *   Make sure the "Unhappy Truths" section is prominent.
      *   Verify the case studies follow the procedure logically.

      *(Self-Correction during drafting)*: I initially thought about suggesting removing race questions entirely in some cases. But for public health, that's often malpractice given known disparities. The constructionist argument isn't "never measure," it's "measure carefully and contextualize." I need to make sure the procedure reflects *critical realism* (structures are real even if constructed) rather than *radical constructivism* (nothing is real). I will lean on Nancy Krieger's work implicitly here—race isn't biological, but *racism* is a biological exposure.

      *(Refining the "Pushback" section)*: It needs to be actionable. Not just "say no," but "say yes, but with these caveats."

      *(Refining the "Judgment Calls")*: I need to explicitly mark which steps require voting/consensus vs. which are rule-based.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic tension in epidemiological and social science research. The conflict arises because both sides are operating on different ontological assumptions: one side treats categories as *containers* for real biological/social differences (Realism), and the other treats categories as *engines* that produce those differences (Constructionism).

  The resolution lies in **Critical Realism**: acknowledging that while categories (like race) are not biological facts, the *social processes* that sort people into those categories have biological consequences (e.g., weathering, stress, access to care). Therefore, you measure the category not to define the person, but to measure the exposure to the social structure.

  Below is a practical decision procedure grounded in this framework, designed for a 60-minute team meeting.

  ***

  # The Classification Impact Assessment (CIA)
  **Time:** 60 Minutes
  **Participants:** Survey Lead, Data Analyst, Community Liaison (if available), PI/Rep.
  **Goal:** Determine the necessity, format, and ethical guardrails for a demographic variable.

  ## Part 1: The Necessity Test (15 Mins)
  *Theory:* If a category is socially constructed, measuring it without a hypothesis reinforces the idea that the difference is intrinsic rather than structural. (Hacking's "Looping Effects").

  **Question 1: What is the specific mechanism?**
  *   **A:** We suspect discrimination, access barriers, or cultural factors linked to this label affect the outcome. (e.g., "Racism affects maternal care.")
  *   **B:** We want to control for it statistically just in case.
  *   **C:** The funder/OMB requires it for comparison.

  *   **Decision Rule:**
      *   If **A**: Proceed to Part 2. (Clear theoretical justification).
      *   If **B**: **STOP.** Do not include the question. Controlling for "race" without a mechanism model reifies race as a biological confounder.
      *   If **C**: Proceed to Part 2, but flag as "Compliance Only" in metadata.

  **Question 2: Can we measure the exposure instead of the identity?**
  *   *Example:* Instead of just "Race," can we ask about "Experience of discrimination in healthcare"?
  *   **Judgment Call:** If the answer is "No, we need the demographic for disparity tracking," acknowledge that you are measuring *social positioning*, not identity.

  ## Part 2: The Format & Granularity Test (20 Mins)
  *Theory:* Fixed categories force people into boxes that may not fit (erasure), while free text creates analysis nightmares. Multiple selections acknowledge intersectionality but complicate longitudinal tracking.

  **Question 3: Fixed List vs. Free Text vs. Hybrid**
  *   **Rule:** If the category is known to be fluid or highly specific (Gender, Ethnicity), **Hybrid is mandatory.**
  *   **Procedure:** Provide standard checkboxes (for compliance/comparability) + "My identity is not listed" + Free text field.
  *   **Judgment Call:** Does the free text field create privacy risks? (e.g., small subgroups in a specific zip code). If yes, suppress free text in public datasets.

  **Question 4: Single vs. Multiple Selection**
  *   **Rule:** If the category describes a social experience (Race, Disability), **Allow Multiple.** People inhabit multiple social positions.
  *   **Exception:** If the analysis requires mutually exclusive groups for longitudinal tracking, you must plan for a "bridging strategy" (how to code multi-selectors later) and disclose this to participants.

  ## Part 3: The Harm/Benefit Analysis (15 Mins)
  *Theory:* Data collection is an intervention. It can validate identity or it can out/endanger participants.

  **Question 5: Who owns the risk?**
  *   **Checklist:**
      *   Does answering this question out the participant to parents/gatekeepers? (Crucial for adolescents).
      *   Does answering this question trigger stigma? (e.g., Disability, Income).
      *   Is the data secure enough to prevent re-identification of small groups?
  *   **Decision Rule:** If risk > benefit to the *participant* (not just the researcher), modify the protocol (e.g., skip logic, separate consent) or drop the question.

  ## Part 4: The Pushback Protocol (10 Mins)
  *Theory:* Funders often want "clean" data that ignores social complexity.

  **Scenario:** A PI insists on a binary category (e.g., Sex: M/F) for "simplicity."
  **Response Script:**
  1.  **Validate:** "We understand the need for clean analysis."
  2.  **Cite Mechanism:** "However, current literature shows that binary categorization introduces measurement error in this population, which threatens validity."
  3.  **Offer Compromise:** "We will collect granular data and map it to your binary variable for analysis, but we need the granular data to ensure the mapping is accurate."
  4.  **Hard Line:** If the category implies biological essentialism (e.g., "Genetic Race"), you must refuse based on institutional ethical guidelines regarding scientific accuracy.

  ***

  # Where This Procedure Will Make Everyone Unhappy
  Be honest with your team about these three friction points. The theory does not solve them; it only clarifies them.

  1.  **The Analysis Burden:** By allowing write-ins and multiple selections, you are breaking the clean columns analysts love. You will have to spend budget on coding text and bridging variables. *The theory says this is the cost of accuracy.*
  2.  **The Longitudinal Break:** If social constructs change (e.g., gender options expand in Year 3), your longitudinal data becomes non-comparable. *The theory says it is better to have accurate snapshots than consistent errors.*
  3.  **The "Compliance" Lie:** You will often have to collect OMB-compliant data you know is flawed. *The theory says you must document the flaw in the codebook so future users don't treat it as biological truth.*

  ***

  # Case Study Applications

  Here is how the CIA runs on your three specific conflicts.

  ## Case 1: Race/Ethnicity (Maternal Health Outcomes)
  *Context:* Known disparities in Black maternal mortality. OMB categories are broad (e.g., "Asian" lumps together vastly different health profiles).
  *Conflict:* Disparity trackers want granular data; Constructionists worry about reifying race as biological.

  **Running the Procedure:**
  1.  **Necessity:** **Pass (Mechanism A).** Racism is a known exposure affecting maternal stress and care quality. We must track positioning.
  2.  **Format:** **Hybrid.** Use OMB minimums for federal reporting, but add detailed ethnic sub-groups (e.g., Nigerian, Haitian, Afro-Caribbean) via write-in or expanded list.
  3.  **Multiplicity:** **Allow Multiple.** Acknowledge multiracial identity.
  4.  **Crucial Addition:** The procedure dictates you cannot *just* ask race. You must add a module on **experiences of discrimination in prenatal care**. This shifts the variable from "intrinsic difference" to "social exposure."
  5.  **Unhappy Outcome:** Analysts will complain that the "Asian" category is too heterogeneous to be useful.
      *   *Resolution:* Code the write-ins post-hoc for analysis, but report the limitations.
      *   *Pushback:* If PI says "Just use the 5 OMB boxes," reply: "Aggregating these groups hides the specific disparities we are funded to find. We will map to OMB for reporting, but we need granularity for analysis."

  ## Case 2: Gender Identity (Adolescent Mental Health)
  *Context:* High risk of mental health issues for trans/non-binary youth. IRB worried about parental consent/outting. Parents will see the form.
  *Conflict:* Need to identify risk group vs. Do no harm (privacy/safety).

  **Running the Procedure:**
  1.  **Necessity:** **Pass (Mechanism A).** Minority stress theory links gender marginalization to mental health outcomes.
  2.  **Harm/Benefit:** **High Risk.** If a parent sees "Transgender" on a survey bill or portal, the child could be endangered.
  3.  **Format:** **Two-Step Method.** (1) Sex assigned at birth, (2) Current gender identity. This allows you to identify trans youth without forcing a single label.
  4.  **Safety Protocol:** **Skip Logic/Privacy.** The survey must be self-administered on a device the parent cannot see. Data must be encrypted separately from identifiers.
  5.  **Unhappy Outcome:** The IRB may still block it, or the sample size of trans youth will be smaller than desired because those in unsafe homes won't answer.
      *   *Resolution:* Accept the selection bias. It is ethically preferable to have missing data than to out a child.
      *   *Pushback:* If PI says "We need to verify gender with parents," reply: "Verification invalidates the data for the population most at risk. We cannot measure this outcome if we exclude the subjects."

  ## Case 3: Household Income (Food Insecurity)
  *Context:* Economic determinant of health. "Household" is assumed to be straightforward.
  *Conflict:* Economists want precise brackets; Sociologists note "household" is a social construct (e.g., pooled resources vs. separate wallets, extended family).

  **Running the Procedure:**
  1.  **Necessity:** **Pass (Mechanism A).** Resource scarcity directly impacts nutrition.
  2.  **Format:** **Fixed Brackets + "Prefer not to say".** Income is sensitive.
  3.  **Construction Check:** **Define "Household".** Do not assume the respondent knows.
      *   *Bad:* "What is your household income?"
      *   *Good:* "We define a household as people who live together and share money for food/rent. Does this include your grandparents? Your boyfriend?"
  4.  **Mechanism Shift:** Instead of just income, ask about **Food Access**. Income is a proxy; food insecurity is the exposure.
  5.  **Unhappy Outcome:** Respondents will find the definition of "household" confusing, leading to higher item non-response. Comparability with Census data (which uses their own definition) becomes difficult.
      *   *Resolution:* Include both the Census-style question (for comparison) and the "Resource Pooling" question (for mechanism).
      *   *Pushback:* If Funder says "Just give us the Census variable," reply: "The Census definition misclassifies resource pooling in [Target Population]. We need the resource question to explain *why* income correlates with insecurity."

  ***

  # Summary Checklist for the Team
  *Print this for your meeting.*

  1.  [ ] **Mechanism:** Have we stated *why* this category predicts the outcome? (If "control variable," drop it).
  2.  [ ] **Exposure:** Are we measuring the label *plus* the social experience (discrimination/access)?
  3.  [ ] **Format:** Is there a write-in option for identities not on the list?
  4.  [ ] **Safety:** Does answering this put the participant at risk (privacy/stigma)?
  5.  [ ] **Documentation:** Have we budgeted time to document the limitations of this category in the codebook?

  **Final Note:** This procedure will not stop the fighting. It will simply move the fight from "Is this real?" (Metaphysics) to "Is this useful and safe?" (Pragmatics). That is a fight you can win.
