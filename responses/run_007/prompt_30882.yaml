answer: |-
  You have correctly identified one of the most significant and frustrating results in the field of algorithmic fairness. Your intuition is spot-on: this is not merely an engineering trade-off (like latency vs. accuracy); it is a mathematical incompatibility.

  Here is the specific terminology, the theorem, the assumptions, and the practical reality of dealing with it.

  ### 1. The Name of the Result
  There is no single universally standardized name, but in the literature, this is most commonly referred to as the **Impossibility Theorem of Fairness** or the **Fairness Impossibility Result**.

  Sometimes it is specifically attributed to the authors who formalized it in the context of risk scores and hiring/recidivism:
  *   **The Kleinberg-Mullainathan-Raghavan Impossibility** (from their 2016 paper *"Inherent Trade-Offs in the Fair Determination of Risk Scores"*).
  *   **Chouldechova's Impossibility** (from her 2017 paper *"Fair Prediction with Disparate Impact: A Study of Bias in Recidivism Prediction Instruments"*).

  If you need a term that captures the "harder than a trade-off" feeling you described, philosophers of technology often refer to this as **normative incommensurability**. It implies that the definitions of fairness rely on different underlying moral frameworks that cannot be simultaneously satisfied within a single mathematical object (the classifier).

  ### 2. The Formal Statement
  You described three criteria. In standard fairness literature, they map as follows:
  1.  **Equal False Positive Rate & Equal False Negative Rate:** Together, these constitute **Equalized Odds** (Hardt et al., 2016).
  2.  **Equal Calibration across groups:** Often called **Predictive Parity** or **Calibration by Group**.
  3.  **Base Rates:** The prevalence of the positive class ($Y=1$) in each group ($A$).

  **The Theorem:**
  It is mathematically impossible to satisfy **Equalized Odds** and **Predictive Parity** simultaneously unless one of two conditions holds:
  1.  **Perfect Prediction:** The classifier makes zero errors (AUC = 1).
  2.  **Equal Base Rates:** The true rate of qualified candidates is identical across groups ($P(Y=1|A=0) = P(Y=1|A=1)$).

  Since your domain (hiring) involves imperfect models and, as you noted, structurally different base rates, you are in the impossibility region. You must violate at least one criterion.

  ### 3. Why It Feels Different Than a Trade-off
  You mentioned this feels like a "conservation law" rather than a knob you can tune. That is because it *is* a constraint satisfaction problem, not an optimization problem.

  In a normal engineering trade-off (e.g., precision vs. recall), you can move along a Pareto frontier. You can choose a point that is "mostly precise" and "mostly recall."
  In this impossibility result, the constraints are **mutually exclusive**. There is no point on the Pareto frontier where both are satisfied. Satisfying one *mathematically necessitates* violating the other when base rates differ.

  This is why you feel confused: you are trying to solve for $X$ and $Y$ where the system of equations has no solution. No amount of hyperparameter tuning will fix it.

  ### 4. Are There Escape Hatches?
  Mathematically, no. Practically, there are ways to navigate the impasse, but none are "magic bullets."

  **A. Fix the Labels (The Structural Argument)**
  The base rate difference ($P(Y=1|A)$) is derived from your historical data labels ($Y$). In hiring, $Y$ is often "was hired" or "performance review score." If past hiring was biased, $Y$ is noisy.
  *   *Escape Hatch:* If you can argue that the observed base rate difference is due to label bias rather than true qualification difference, you can attempt to correct the labels (e.g., using proxy tasks or audit data). If you successfully equalize the *true* base rates, the impossibility vanishes.
  *   *Risk:* This requires strong causal assumptions about what "qualified" means.

  **B. Cost-Sensitive Fairness**
  Instead of constraining the model to meet a fairness metric, you assign different costs to errors for different groups.
  *   *Escape Hatch:* You define a loss function where a False Negative for Group A is "more expensive" than a False Negative for Group B.
  *   *Result:* This doesn't satisfy the impossibility theorem's criteria (you still won't have equal FNR), but it aligns the model with a specific utility function that prioritizes protecting the disadvantaged group.

  **C. Choose the Metric That Matches the Legal/Ethical Goal**
  This is the most common industry response. You must select which definition of fairness aligns with your liability and ethical stance.
  *   **Equalized Odds:** Appropriate if the cost of errors is high and symmetric. (e.g., "We don't want to reject good candidates from Group A faster than Group B").
  *   **Predictive Parity (Calibration):** Appropriate if the score is used for risk assessment where the probability must be meaningful. (e.g., "If we say someone is 80% likely to succeed, that must mean 80% for everyone").
  *   **Demographic Parity:** (Equal selection rates). Often required by regulatory bodies (like the EEOC's 4/5ths rule in the US), even though it ignores base rates and accuracy entirely.

  **D. Abandon Group Fairness for Individual Fairness**
  *   *Concept:* "Similar individuals should be treated similarly" (Dwork et al., 2012).
  *   *Escape Hatch:* This sidesteps the base rate issue by focusing on the metric space of individuals.
  *   *Problem:* It requires a agreed-upon similarity metric (which is hard to define) and does not guarantee group-level equity.

  ### 5. Practical Advice for Your Team
  Since you are the person translating this, here is how to frame it to stakeholders who might not understand the math:

  1.  **Stop calling it a "Bug":** Make it clear that violating one metric is not a failure of the model engineering; it is a consequence of the data distribution and the chosen definitions.
  2.  **Visualize the Constraint:** Plot the metrics against each other. Show that as you force Calibration to align, the FNR gap widens. Show that there is no "sweet spot" where both lines cross.
  3.  **Document the Choice:** In your model card or documentation, explicitly state: *"We prioritized Equalized Odds over Predictive Parity because [Reason]. This results in a calibration gap of X%."* This shifts the burden from the *model* to the *policy decision*.
  4.  **Audit the Base Rate:** Spend time investigating *why* the base rates differ. Is it that one group applies less often? Is it that the definition of "qualified" relies on credentials that one group historically couldn't access? If the base rate difference is the root cause of the unfairness, the model might not be the right place to fix it.

  ### Summary
  *   **Name:** The Impossibility Theorem of Fairness (Kleinberg et al. / Chouldechova).
  *   **Condition:** Holds whenever Base Rates differ and Classification is imperfect.
  *   **Nature:** Logical incompatibility, not an optimization trade-off.
  *   **Solution:** There is no mathematical solution. There is only a policy decision about which definition of fairness best serves your specific context and legal requirements.

  You are not confused; the system is inconsistent. Your job is not to solve the math, but to facilitate the decision about which mathematical violation is less harmful.
