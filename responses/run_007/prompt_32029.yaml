answer: |-
  Here is the exam question you requested, followed by the model answer and the marking scheme.

  Exam Question: Sen's Liberal Paradox demonstrates a formal impossibility in social choice theory, but its philosophical significance remains contested. Does the paradox reveal a fundamental moral conflict between individual liberty and collective efficiency, or does it merely expose a defect in how rights are modeled within welfarist frameworks? In your response, first clarify the nature of the conflict demonstrated by the paradox. Then, argue for one specific interpretation of its upshot. You must evaluate at least one proposed resolution or reinterpretation, such as the distinction between outcome-based rights and game-form rights, or the view of rights as constraints on the agenda rather than the social decision function. Conclude by stating whether you believe liberalism requires revision in light of Sen's proof.

  Model Answer: Sen's liberal paradox proves that no social decision function can simultaneously satisfy minimal liberalism, the Pareto principle, and universal domain. The standard reading suggests a deep conflict between liberty and efficiency, implying that respecting individual rights sometimes forces society into Pareto inferior outcomes. However, this interpretive leap is unwarranted. The paradox does not show that liberty and efficiency are morally incompatible, but rather that defining rights as decisiveness over social states is conceptually flawed. When Sen formalizes rights, he treats them as effective power over outcomes, regardless of the preferences of others. This conflates having a right with having the power to enforce it against all opposition. A more compelling response, proposed by theorists like Robert Nozick or later game-form analysts, distinguishes between rights as constraints on the permissible actions of others versus rights as guarantees of specific outcomes. If we view rights as side constraints on the agenda rather than components of the social welfare function, the paradox dissolves. The Pareto principle applies to the evaluation of outcomes, but rights determine which outcomes are morally permissible to begin with. In the Lewd/Prude case, the Pareto improvement exists only if we assume both agents' preferences are valid inputs for the social choice. But if Prude has a right not to read the book, Lewd's preference for Prude reading it should be excluded from the calculus entirely. Thus, the paradox reveals a category error in social choice theory rather than a genuine political tragedy. The upshot is that liberalism need not abandon efficiency, but must reject welfarist aggregations that violate individual boundaries. The conflict is not between liberty and efficiency, but between liberty and unrestricted welfarism. By restricting the domain of admissible preferences or redefining rights as protections of agency rather than outcomes, we preserve the core liberal intuition without logical contradiction. Therefore, the paradox is a reductio of the formal modeling of rights, not a refutation of liberal philosophy itself. The lesson is that rights should not be modeled as preferences within a utility function but as structural constraints on what counts as a valid social choice. This preserves the Pareto principle for permissible states while protecting individual spheres of sovereignty. Consequently, the paradox is not a problem for liberalism but a problem for consequentialist frameworks that attempt to absorb rights into utility maximization. Liberals should accept the impossibility result as a reason to reject the welfarist meta-ethical commitment underlying the formal setup.

  Marking Scheme: This exam question is worth twenty marks total. To achieve an A grade, ranging from seventeen to twenty marks, the student must accurately summarize the formal conflict without getting bogged down in the proof mechanics, and they must take a clear stance on whether the paradox is a moral problem or a modeling artifact. They must also evaluate a specific response, such as the game-form approach or the agenda constraint view, explaining precisely how it blocks the paradox. A typical error at this level is failing to explain why the proposed solution actually resolves the logical contradiction rather than just asserting that it does. For a B grade, ranging from thirteen to sixteen marks, the student will correctly explain the paradox and identify the interpretive question, but their evaluation of the response will be descriptive rather than critical. They might explain what the game-form distinction is without showing how it changes the normative upshot. Students typically lose marks here by treating the response as a separate topic rather than integrating it into their argument about the paradox's significance. A C grade, ranging from nine to twelve marks, will demonstrate a basic understanding of the Lewd/Prude example but will fail to move beyond the claim that there is a tension between rights and efficiency. They will likely mention a response but will not explain how it alters the interpretation of the paradox. The common mistake in this band is regurgitating the proof instead of discussing the philosophical implications, treating the theorem as a final verdict rather than a starting point for debate. Answers below nine marks will usually misunderstand the Pareto principle or the definition of minimal liberalism, rendering the philosophical analysis incoherent. Students in this range often confuse rights with preferences or claim that Sen proves liberalism is impossible rather than showing a conflict within specific formal assumptions. When grading, prioritize the clarity of the argument regarding the upshot over the technical completeness of the proof reconstruction. Ensure that the discussion of the response connects back to the central question about whether liberalism is fundamentally compromised. Deduct marks if the student claims the paradox is solved without acknowledging that the solution requires changing the underlying framework of social choice. Finally, reward answers that recognize the distinction between welfarism and rights-based constraints, as this indicates a sophisticated grasp of the seminar material.
