answer: |-
  This phrase comes from the philosopher Daniel Dennett (specifically his 1991 paper *"The Self as a Center of Narrative Gravity"*). It is a powerful metaphor, but like all metaphors, it is leaky. When people use it to argue against mind uploading, they are often sliding between different philosophical commitments without realizing it.

  A "center of gravity" in physics is a useful mathematical abstraction. It allows you to predict how an object will move. However, you cannot cut open a rock and find its center of gravity inside. It has no mass, no color, and no independent existence; it exists only in relation to the distribution of mass around it.

  Here is a menu of four distinct interpretations of that phrase, ranked from the least controversial (compatible with standard science) to the most radical (ontologically nihilistic). For each, I have evaluated its defensibility and whether it actually proves mind uploading is impossible.

  ---

  ### Menu Item 1: The Anti-Substance Claim
  **The Claim:** The self is not a "thing" (like a soul, a Cartesian ego, or a homunculus) sitting inside the brain. It is a functional role played by the brain's systems.
  *   **What it means:** There is no little man inside your head watching the screens. There is just the brain processing data. The "self" is just a label for the aggregate output of those processes.
  *   **Defensibility:** **High.** This is the standard view in cognitive science and neurobiology. Dualism (the idea of a non-physical soul) is largely rejected in philosophy of mind.
  *   **Does it kill mind uploading?** **No.** In fact, it helps it. If the self is not a magical soul but a functional pattern of information processing, then in principle, that pattern could be instantiated on a different substrate (a computer). If the self is software-like, it can be uploaded.
  *   **Verdict:** If your interlocutor meant this, they are right about the self, but wrong about the conclusion. This view suggests uploading *is* possible.

  ### Menu Item 2: The Abstraction Claim
  **The Claim:** The self is a theoretical construct, like a "center of gravity." It is real in terms of its effects, but it is not a physical object that can be moved.
  *   **What it means:** You can't locate the self in a specific neuron. It emerges from the relationships between memories, behaviors, and social interactions. It is an abstraction derived from the physical system.
  *   **Defensibility:** **Moderate to High.** This is Dennett's actual view. Abstractions are real (money is an abstraction, but it has real power), but they are "ontologically subjective."
  *   **Does it kill mind uploading?** **Not necessarily.** Software is also an abstraction. You cannot hold "Microsoft Word" in your hand; it is an abstraction running on hardware. Yet, you can copy Word from one hard drive to another. If the self is an abstraction like software, it can be copied. However, if the self is an abstraction *like a shadow* (which depends on specific lighting and objects), it cannot be moved without changing the source.
  *   **Verdict:** Ambiguous. It depends on whether the self is more like *software* (transferable) or more like *a shadow* (dependent on specific physical history).

  ### Menu Item 3: The Historicist Claim (The Likely Culprit)
  **The Claim:** A "center of narrative gravity" is defined by its *trajectory* through time, not just its current state. You cannot copy the history that generated the gravity.
  *   **What it means:** A center of gravity is calculated based on the past and present distribution of mass. Similarly, your "self" is the story of where you have been, not just who you are right now. A perfect copy of your brain state at age 40 does not have the *history* of being you; it just has the *memory* of it. Therefore, the "gravity" of the original self stays with the original body.
  *   **Defensibility:** **Moderate.** This relies on a specific theory of identity called "Psychological Continuity Theory" with a strict requirement for causal connection. It argues that a copy is a *clone*, not a *continuation*.
  *   **Does it kill mind uploading?** **Yes (sort of).** It doesn't mean uploading is technologically impossible; it means *survival* is impossible. You can build the upload, but "you" (the specific center of narrative gravity) won't be in it. The upload will be a new center of gravity that *thinks* it is you.
  *   **Verdict:** This is likely the argument your interlocutor was using. It supports the claim that "there is nothing to upload" in the sense that *your specific identity* cannot be transferred, only replicated.

  ### Menu Item 4: The Illusionist/Eliminativist Claim
  **The Claim:** The self is a user-illusion. There is no "center" at all, not even an abstract one. The brain creates the feeling of a self to simplify control, but nothing actually corresponds to it.
  *   **What it means:** Consciousness is a "magic trick" the brain plays on itself. To ask if the self can be uploaded is like asking if the horizon can be uploaded. The horizon isn't a thing; it's a perspective.
  *   **Defensibility:** **Low to Moderate.** This is a radical position (Illusionism). While defensible philosophically (by thinkers like Dennett or Keith Frankish), it conflicts with our immediate phenomenological experience (it *feels* like there is a self).
  *   **Does it kill mind uploading?** **Yes, radically.** If there is no self, there is no one to upload. There are only biological processes. You can copy the processes, but since there was never a "passenger" in the first place, no one arrives at the destination.
  *   **Verdict:** This supports the "nothing to upload" claim most strongly, but at the cost of denying the existence of the person having the debate.

  ---

  ### Analysis: Which one was your interlocutor using?

  Based on the context ("shut down a debate," "nothing to upload"), they were likely relying on a conflation of **Menu Item 3 (Historicist)** and **Menu Item 4 (Illusionist)**.

  They are arguing that because the self is not a *substance* (Item 1), it must be *nothing* (Item 4). This is a logical leap. Just because the self is an abstraction (like a melody) doesn't mean it can't be transferred (you can play a melody on a piano or a violin).

  However, the **Historicist (Item 3)** reading is the strongest philosophical objection they have. If personal identity requires an unbroken causal chain (a continuous narrative), then a "cut and paste" upload breaks that chain. The upload wakes up thinking it is you, but the "center of gravity" of the original narrative remains with the biological body (or ceases if the body is destroyed).

  ### Should you be worried?

  **1. Don't worry about the "Nothing exists" claim (Item 4).**
  Even if the self is an illusion, the *illusion* is what cares about survival. The pain you feel is real to the illusion. If the upload suffers, it suffers. If the upload achieves your goals, it achieves your goals. The ontological status of the self doesn't change the pragmatic value of uploading.

  **2. Do worry about the "Continuity" claim (Item 3).**
  This is the real philosophical hurdle. If you value *continuity of consciousness* over *psychological similarity*, then mind uploading (via copying) looks like suicide followed by the creation of a twin.
  *   **If the person was right:** Uploading is not a form of travel; it is a form of reproduction.
  *   **If the person was wrong:** (As many functionalists argue) If the pattern is preserved, the identity is preserved, regardless of the substrate or the copy process.

  **Summary:** The phrase "center of narrative gravity" proves the self isn't a soul. It does **not** prove the self can't be uploaded, unless you add the extra premise that identity requires unique, un-copyable biological history. Your interlocutor likely smuggled that extra premise in without stating it.
