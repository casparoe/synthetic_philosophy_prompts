answer: |-
  ### Part 1: Brainstorming Candidate Background Facts

  To separate the indicative ("If P, Q") from the counterfactual ("If P had been, Q would have been"), we need a scenario where learning $P$ gives us good reason to believe $Q$ (making the indicative assertable), but actually making $P$ true (in a metaphysical sense) does not require $Q$ to be true (making the counterfactual false).

  Here are three candidates I considered:

  1.  **The "Causal Preemption" Case:** Two switches can turn on a light. Switch A wasn't flipped, but Switch B was.
      *   *Verdict:* **Rejected.** This is too close to standard metaphysics examples (like the "Oswald/Kennedy" structure you asked to avoid). It often confuses students with talk of "backup causes."
  2.  **The "Broken Rule" Case:** A boss says, "If anyone is late, they are fired." Alice was late but wasn't fired (boss forgot).
      *   *Verdict:* **Rejected.** This makes the indicative *false* (since the rule was broken in reality), whereas we want the indicative to be assertable/true based on background knowledge.
  3.  **The "Common Cause / Indicator" Case:** A sensor reads a value ($P$) because of a physical state ($Q$). The sensor is reliable but fallible.
      *   *Verdict:* **Selected.** This is the cleanest. It relies on the difference between *evidence* (epistemic) and *causation* (metaphysical). It is mundane, requires no crime or sci-fi, and clearly separates what we *infer* from what *would have happened*.

  I will adapt the classic "Barometer" example from philosophical literature into a modern office IT setting. This keeps it mundane while preserving the logical structure.

  ***

  ### Part 2: The Thought Experiment — "The Server Room Light"

  **The Scenario:**
  You and a colleague, Sarah, work in the back office of a small logistics company. There is a server rack in the corner that handles all the shipping data. On the front of the server, there is a small diagnostic LED light.

  **The Background Fact:**
  You both know how the server works. When the network traffic load becomes **critical** (over 90% capacity), the internal sensor triggers the LED light to turn **Amber**. The system is designed to be reliable: High Load causes the Amber Light. However, you also know that electronic components can glitch. The light *could* turn Amber due to a wiring short, even if the load is low, though this is rare.

  **The Reality (The Context):**
  It is 2:00 PM on a Tuesday. You look at the monitoring dashboard: Network load is **low** (10%). You look at the server rack: The LED light is **Green**.
  Both of you know for a fact that the load is *not* critical and the light is *not* Amber.

  **The Conditionals:**
  1.  **Indicative:** You say to Sarah, *"If the light is Amber, the network load is critical."*
  2.  **Counterfactual:** Sarah replies, *"That's not right. If the light **had been** Amber, the load **would have been** critical."* (She claims this is false).

  **The Intuition:**
  *   Your indicative statement feels **correct/assertable**. Given the system design, seeing the Amber light is excellent evidence of high load.
  *   Sarah's counterfactual claim (that the sentence is *false*) feels **correct**. She is imagining a scenario where the light is Amber *without* assuming the load changed—perhaps a bulb glitch. In that scenario, the load stays low.

  ***

  ### Part 3: Logical Walkthrough

  Here is the precise breakdown for your students.

  **1. The Variables:**
  *   **$P$ (Antecedent):** The diagnostic light is Amber.
  *   **$Q$ (Consequent):** The network load is critical.
  *   **Background Knowledge:** High Load ($Q$) causes Amber Light ($P$). The reverse is not strictly true (a glitch can cause $P$ without $Q$).
  *   **Actual World Facts:** $P$ is False (Light is Green). $Q$ is False (Load is Low).

  **2. Why the Indicative is Assertable (The Epistemic Track):**
  *   **Semantics:** Indicative conditionals are typically evaluated relative to an **epistemic state** (what we know). When we assess "If $P$, then $Q$," we temporarily add $P$ to our stock of knowledge and see if $Q$ follows.
  *   **Evaluation:** We start with what we know (System Design + Current Low Load). We then *update* our information with the supposition: "The light is Amber."
  *   **Inference:** Since we know the light is a reliable indicator of load, the most reasonable explanation for the light being Amber is that the load is high. We treat the light as *evidence*.
  *   **Result:** In the epistemically closest worlds where the light is Amber, the load is critical. The indicative is assertable.

  **3. Why the Counterfactual is False (The Metaphysical Track):**
  *   **Semantics:** Counterfactual conditionals are typically evaluated relative to **metaphysical closeness** (similar possible worlds). We look for the "closest" possible world where $P$ is true and check if $Q$ is true there.
  *   **Evaluation:** We look for the closest world where "The light is Amber."
  *   **The Divergence:** To make the light Amber in a world where it is actually Green, something must change.
      *   *Option A:* The network load spiked to critical (causing the light).
      *   *Option B:* The light malfunctioned (glitching to Amber) while the load stayed low.
  *   **Closeness Metric:** In standard semantics (like Lewis or Stalnaker), we try to hold fixed as much of the actual past and present as possible. The actual network load *is* low. Changing the load requires a larger deviation from reality (more "miracles") than a small local glitch in the LED bulb.
  *   **Result:** The "closest" world where the light is Amber is one where the bulb glitched, but the network load remained low (as it actually is). Therefore, $Q$ is false in that world. The counterfactual is false.

  ***

  ### Part 4: The "Moving Parts" Analysis

  **Which single feature is doing the real work?**
  The **direction of dependence** (Causation vs. Correlation).
  Specifically, the fact that $Q$ causes $P$, but $P$ does not cause $Q$.
  *   $Q$ (Load) $\rightarrow$ $P$ (Light).
  *   The Indicative treats $P$ as *evidence* for $Q$ (reasoning backward from effect to cause).
  *   The Counterfactual treats $P$ as an *intervention* (reasoning forward from a change). Since changing the effect ($P$) doesn't force the cause ($Q$) to change, the counterfactual fails.

  **What happens if you remove this feature?**
  If you change the scenario so that $P$ causes $Q$ (e.g., "If I flip the switch ($P$), the light turns on ($Q$)"):
  *   **Indicative:** "If I flip the switch, the light turns on." (True).
  *   **Counterfactual:** "If I *had* flipped the switch, the light *would* have turned on." (True).
  *   **Result:** The divergence disappears. Both conditionals align. The split *only* happens when the antecedent is an effect (or indicator) of the consequent, not a cause.

  ***

  ### Part 5: The Objection — "The Unified Semantics Attack"

  **The Objection:**
  A sophisticated student (or a philosopher like Robert Stalnaker) might attack this case using a **Unified Possible-Worlds Semantics**. They would argue:
  *"You are cheating by using two different rulebooks. A conditional is always about closest possible worlds. The only difference is the **context**. In the indicative context, the 'closeness' metric prioritizes the system's rules (Light $\rightarrow$ Load). In the counterfactual context, the metric prioritizes actual history (Load stayed low). If we fix the context, both conditionals have the same truth value."*

  Essentially, they claim the indicative is *also* false if we look closely, or the counterfactual is *also* true if we assume the system is perfect.

  **Does the case survive?**
  **Yes, but with a caveat.** The case survives as a demonstration of **ordinary language usage**, which is what matters for an intro logic course.
  1.  **Ordinary Assertion:** In normal conversation, we *do* assert the indicative ("If the light is on, it's overloaded") while denying the counterfactual ("But if the light had been on, it wouldn't necessarily mean it was overloaded; it could be a glitch"). The fact that speakers distinguish them suggests the semantics must account for that distinction.
  2.  **The "Context Shift" Reply:** Even if a unified semanticist argues that context shifts the "closeness" metric, they must admit that the *default* context for indicatives is epistemic (updating information) and for counterfactuals is metaphysical (changing history).
      *   To evaluate the indicative, we ask: "What do we *learn* if $P$?" (We learn $Q$).
      *   To evaluate the counterfactual, we ask: "What *changes* if $P$?" (Only the light changes).
  3.  **Conclusion for Class:** You can tell your students: *"Some philosophers try to unify these meanings, but to do so, they have to say that the word 'if' changes its rules depending on the tense. For our purposes, the Server Room case proves that 'If P, Q' and 'If P had been, Q would have been' behave differently in reasoning. One tracks evidence; the other tracks causal dependencies."*

  This example is robust enough for undergraduates because it relies on a physical intuition (breaking a light vs. changing the traffic) that is easier to grasp than abstract logic symbols.
