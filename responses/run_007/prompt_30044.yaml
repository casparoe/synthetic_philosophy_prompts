prompt: |-
  You're an expert on philosophical logic and formal semantics, especially the semantics of conditionals. I've been arguing with a freind about whether "if A then B" and "if A had been the case, B would have been the case" are really saying the same kind of thing, and I want one clean, ordinary case that shows they come apart. So construct a thought experiment for me. Specs: the scenario should be completely mundane (an office, a shared house, a small local business), no assassinations, no lotteries, no science-fiction, and please don't just re-skin the Oswald/Kennedy example by swapping in a different crime. The case should be one where the indicative "If P, then Q" is true—or at least clearly assertable for the people in the scenario—while the matching counterfactual "If P had been the case, Q would have been the case" is false. The antecedent P should be something the characters know to be false, and the indicative's assertability should come from a piece of background knowledge they have, not from direct evidence about the antecedent itself and not just from the antecedent being false (so no vacuous-truth cheating).

  After you give the scenario, walk me through it precisely: state P and Q, state the background fact, and show—using the standard two-track picture where indicatives are evaluated against an epistemic or evidential background and counterfactuals are evaluated against the closest worlds in which the antecedent holds—why the indicative comes out true and the counterfactual comes out false. Then be honest about which single feature of the scenario is doing the real work, what would happen to the example if you removed just that feature, and how someone who thinks both conditionals have the same underlying truth conditions (say, a unified possible-worlds semanticist) would attack your case—and whether the case survives that attack. I want to use this in an intro logic course, so the moving parts have to be visible enough that a smart undergrad could follow. Start by brainstorming two or three candidate background facts and then say why the one you picked is cleanest.
