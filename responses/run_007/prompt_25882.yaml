prompt: |-
  So our company is going through this big automation push — AI tools, RPA, the whole thing — and I got put on the committee that decides which roles and tasks get automated and which stay human. At first I thought it was just a cost-benefit thing, but the more I've been reading about the philosophy of work — like, what actually makes work meaningful versus just a paycheck — the more I realize we don't have any way to factor that in. Like, sure, automating data entry saves money, but if that data entry job was the only thing giving someone structure and social contact and a sense of competence, maybe we're making a mistake that looks great on a spreadsheet and terrible in people's lives.

  I want an actual decision procedure I can bring to the next committee meeting. Something step-by-step that takes a task or role we're considering automating and runs it through the philosophical criteria for meaningful work — autonomy, mastery, social connection, contribution to something beyond yourself, whatever the literature actually supports. It needs to be concrete enough that my colleagues (who have not read a page of philosophy and don't want to) can use it. It should say what questions to ask, in what order, what counts as a sufficient answer to each, and — this is crucial — where the procedure has to stop and say "a human being needs to make a judgment call here, and here's why the procedure can't make it for you."

  Then I want you to run the procedure on two cases: automating the monthly report generation that three analysts currently spend a week on (tedious but they say it gives them a deep understanding of the business), and automating the first-pass resume screening in HR (which everyone hates doing but which currently forces hiring managers to actually read what candidates write).

  And be honest: tell me where this procedure would give me an answer I'm not going to like, or where it would tell me to preserve work that seems obviously pointless from a buisness perspective. I need to know what I'd be signing up for before I walk into that meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is on a committee deciding what to automate (AI/RPA) vs. keep human.
      *   **Problem:** Current decision-making is purely cost-benefit. The user recognizes the philosophical dimension of "meaningful work" (autonomy, mastery, connection, purpose) is missing.
      *   **Goal:** A concrete, step-by-step decision procedure (algorithm/checklist) that incorporates philosophical criteria for meaningful work, usable by non-philosophers.
      *   **Requirements:**
          *   Step-by-step instructions.
          *   Specific questions to ask.
          *   Criteria for sufficient answers.
          *   Explicit "stop points" where human judgment is required (and why).
          *   Application to two specific cases (Monthly Report Generation, Resume Screening).
          *   Honest assessment of downsides/unpopular outcomes (where the procedure might suggest keeping "pointless" work or blocking efficiency).

  2.  **Deconstruct "Meaningful Work" (Philosophical Basis):**
      *   I need to ground this in established literature without getting bogged down in jargon.
      *   *Key concepts:*
          *   **Autonomy:** Control over how/when work is done. (Kant, Self-Determination Theory).
          *   **Mastery/Competence:** Opportunity to develop skills and feel capable. (Aristotle/Eudaimonia, Csikszentmihalyi/Flow).
          *   **Relatedness/Social Connection:** Work as a site of community. (Marx/Species-being, Arendt/Labor vs. Work).
          *   **Purpose/Contribution:** Feeling the work matters to others/society. (Nozick, Graeber/Bullshit Jobs).
      *   *Constraint:* The procedure must be practical for a business committee.

  3.  **Drafting the Decision Procedure (The "Meaningful Work Impact Assessment" - MWIA):**
      *   *Structure:* Needs to look like a flowchart or a scored rubric, but with qualitative gates.
      *   *Phase 1: The Efficiency Gate.* (Business reality check). If it doesn't save money/time, why automate?
      *   *Phase 2: The Meaning Audit.* (The core philosophical part). Break down into the four pillars identified above.
      *   *Phase 3: The Mitigation Check.* If meaning is lost, can we redesign the role?
      *   *Phase 4: The Judgment Call.* Where the algorithm stops.

      *   *Refining the Steps:*
          *   Make the questions binary or scaled where possible, but force narrative answers for the "Judgment Call."
          *   Define "Sufficient Answer."
          *   Identify the "Hard Stop."

  4.  **Developing the Two Case Studies:**
      *   *Case 1: Monthly Report Generation.*
          *   *Efficiency:* High gain (3 analysts x 1 week).
          *   *Meaning:* They claim "deep understanding." Is that real mastery or just familiarity with a broken process?
          *   *Outcome:* Likely a "Judgment Call" on whether the "understanding" can be gained another way.
      *   *Case 2: Resume Screening.*
          *   *Efficiency:* High gain (HR hates it).
          *   *Meaning:* It's drudgery, *but* it forces human engagement with candidates.
          *   *Outcome:* Might suggest keeping it human to preserve empathy/ethical hiring, which contradicts the "everyone hates it" premise.

  5.  **Addressing the "Honest Assessment" (The Catch):**
      *   The user wants to know where this hurts.
      *   *Risk 1:* Paternalism. Who are we to decide what gives someone meaning?
      *   *Risk 2:* Inefficiency. You might keep costly processes alive for "meaning."
      *   *Risk 3:* The "Bullshit Job" Paradox. Sometimes the meaningful part is the *only* part of a useless job. Do we keep the useless job to save the meaning?
      *   *Risk 4:* Implementation friction. Colleagues will hate this.

  6.  **Writing the Response (Iterative refinement):**
      *   *Tone:* Professional, empathetic, rigorous, slightly provocative (matching the user's introspection).
      *   *Formatting:* Use bolding, lists, and clear headers to make it "committee-ready."
      *   *Self-Correction during drafting:* I initially thought about scoring (1-10), but scoring meaning is dangerous. Better to use "Red Flags" and "Green Lights." Let's make it a "Traffic Light" system with a mandatory review phase.
      *   *Refining the "Stop Point":* It can't just be "ask the boss." It needs to be "assemble a specific group."
      *   *Refining the Case Studies:* Ensure I apply the steps explicitly, not just give a verdict.

  7.  **Final Review against Constraints:**
      *   Step-by-step? Yes.
      *   Philosophical criteria included? Yes (Autonomy, Mastery, Connection, Purpose).
      *   Concrete questions? Yes.
      *   Stop point identified? Yes.
      *   Two cases run? Yes.
      *   Honest downsides included? Yes.

  8.  **Final Polish:** Check for clarity and impact. Ensure the distinction between "Labor" (survival), "Work" (creation), and "Action" (political/social) à la Arendt is hinted at but not overused. Focus on the *Human Impact Assessment*.

  *(Self-Correction Note)*: I need to make sure I don't sound *too* academic. The colleagues "don't want to read philosophy." The procedure must translate concepts like "eudaimonia" into "Do they feel they are getting better at something?"

  *(Final Plan)*:
  1.  Intro: Acknowledge the weight of the task.
  2.  The Procedure: "The Human Impact Assessment (HIA)."
  3.  The Cases: Apply HIA to Reports and Resumes.
  4.  The Hard Truths: Where this will hurt the business or the user.
  5.  Closing: Encouragement.

