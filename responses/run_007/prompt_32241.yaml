prompt: |-
  I'm a software engineer who works on distributed systems and multi-agent simulations. I've been hearing the concept of "Moloch" and multipolar traps invoked in discussions about AI risk — the idea that competitive dynamics can lock groups into races to the bottom that no participant wants. I'd like to understand this in vocabulary I actually trust.

  Restate the Moloch/multipolar-trap thesis in the language of multi-agent systems: objective functions, local vs. global optima, Nash equilibria, gradient dynamics, coordination protocols, and the gap between specified goals and emergent behavior. Map each substantive claim as cleanly as you can, and flag where the mapping strains.

  Then give me the residue report. I'm especially interested in whether the following have any counterpart in the CS vocabulary: (a) the personification of the competitive dynamic as a kind of agent ("Moloch") that demands sacrifice, (b) the normative claim that the resulting equilibrium is genuinely bad rather than merely Pareto-suboptimal, and (c) the idea that the trap is self-reinforcing in a way that goes beyond what a Nash equilibrium already captures. For each, tell me whether the CS vocabulary is missing something real or whether the philosophical framing is smuggling confusion under a vivid metaphor.

  End with a one-sentence summary of the residue as the last line, prefixed with "Summary:".
