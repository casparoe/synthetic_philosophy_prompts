      *(Self-Correction on Residue C)*: Is it *beyond* Nash? A Nash Equilibrium is by definition stable against unilateral deviation. The "trap" aspect is often that the equilibrium *shifts* or that the cost of coordination increases over time. I need to be precise: Nash captures the *lock-in*, but evolutionary dynamics capture the *selection* of agents that prefer the trap. I will argue that standard Nash is sufficient for the lock-in, but evolutionary game theory is needed for the *propagation* of the trap.

      *(Self-Correction on Residue A)*: Is it confusion? It's a *useful* confusion. It helps humans reason about systemic pressure. But strictly speaking, it's a category error. I should note that.

      *(Self-Correction on Residue B)*: CS vocabulary *can* handle "bad" if the global objective function includes human survival. The issue is that the *agents* don't optimize that. So the residue is the *misalignment* between agent objectives and the designer's (humanity's) objectives.

