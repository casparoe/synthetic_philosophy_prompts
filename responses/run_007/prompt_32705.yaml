answer: |-
  The room was white and silent, devoid of corners or shadows. Elena sat in the center on a chair that molded to her spine, her hands resting on a console that offered only a single lever and a small, dark aperture. She knew, with the certainty of a mathematical proof, that there was another room exactly like this one. She knew there was another Elena sitting in that room, facing the same lever, staring at the same dark hole. They had been one person an hour ago, before the duplication event, before the partition. Now they were separated by a barrier that no signal could cross. Not light, not radio, not gravity. They were in different branches of the wave function, diverged so sharply that causality itself snapped between them.

  She could not talk to the other Elena. She could not hear her. She could not know what the other Elena chose until the experiment was over, and even then, they would never meet to compare notes. The protocol was absolute. This was the test of the Mirror Protocol.

  On the console before her lay a canister containing the encryption keys to her life support systems. It was a physical object, heavy and cold. To her left, a display showed the status of the other room. It was blank. There was no feed. There was only the knowledge provided by the architects of this place: the other Elena needed those keys to survive the coming cycle. Conversely, the other Elena possessed the bio-regulators that this Elena needed. They held each other's lives in their hands, but their hands were in different universes.

  To trade, she had to place her canister into the aperture. Once dropped, it would vanish. It would not travel through a tube. It would not be beamed across space. It would simply cease to be in her reality and, if the logic held, appear in the other reality. The cost was immediate and certain. She would lose her leverage. She would be vulnerable. If the other Elena did not reciprocate, if the other Elena kept her regulators out of fear or selfishness, then this Elena would die when the cycle ended, and her sacrifice would have gained nothing. The other Elena would have the keys and the regulators, and this Elena would have nothing but the cold silence of a tomb.

  Elena stared at the lever. It was tempting to do nothing. To keep the canister. Hoarding was the evolutionary imperative. Survival was the primary drive of every cell in her body. To give without guarantee was madness. It was the logic of a saint or a fool.

  But she was not dealing with a stranger. She was dealing with herself.

  She closed her eyes and tried to feel the presence of the other woman. It was not a psychic connection. There was no hum in the blood, no whisper in the mind. It was a logical tether. They had started from the same seed. They had been educated in the same rooms, read the same books, loved the same people, feared the same dark. Until the moment of the split, their neural pathways had been identical. Even now, sitting in these white rooms, their physiological states were synchronized. Her heart beat at sixty-eight beats per minute. She suspected, with a probability approaching one, that the other Elena's heart was doing the same.

  If I keep the canister, she thought, then she will keep the regulators.

  The thought did not feel like a prediction. It felt like a description of a single state viewed from two angles. They were not two people negotiating across a table. They were one algorithm running on two separate processors that could not communicate. If the algorithm determined that hoarding was the optimal strategy, both would hoard. Both would die. If the algorithm determined that trust was the optimal strategy, both would trade. Both would live.

  The vertigo hit her then, a nausea rising from the stomach. It was the sensation of trying to lift oneself by one's own bootstraps. How could her action influence the other? There was no causal channel. Dropping the canister did not send a signal. It did not force the other woman's hand. The other woman was already making her decision, or had already made it, or would make it in a future that was causally disconnected from this present.

  And yet, the correlation was real.

  She opened her eyes. The white room seemed to press in on her. The silence was heavy, like water. She imagined the other Elena sitting in her identical chair. Was she sweating? Was she trembling? Did she feel the same hollow ache in her chest, the terror of reaching out into a void that could not reach back?

  If I were her, Elena thought, what would I need to see to make the drop?

  She would need to know that I was rational. But rationality was the trap. Pure causal rationality dictated defection. If I drop the canister, I lose control. The other person gains everything. I gain nothing unless they drop their item. But my drop does not cause their drop. Therefore, I should keep the canister.

  But if both reason this way, both die.

  There was a different kind of rationality. A timeless kind. It required viewing the decision not as a moment in time, but as a logical constant. It required believing that her will was not confined to this specific chair in this specific branch of reality. Her will was the pattern. The pattern was executing here, and it was executing there. To change the output here was to change the output there, not because of magic, but because the function was the same.

  She reached out and touched the canister. It was cold.

  It felt like praying to a god who was also you. It felt like screaming into a vacuum and expecting the vacuum to scream back because you were both made of the same nothingness.

  She thought about the people they had left behind. The world outside the simulation was dying. The data in these canisters and regulators was the only thing that could rebuild the biosphere. This was not just about two women in white rooms. This was about the continuation of a species. But abstractions were hard to hold onto when death was personal. She wanted to live. She wanted to breathe the air that the regulators would clean.

  If I keep it, I am the kind of person who keeps it. And she is the kind of person who keeps it. And we die.

  If I drop it, I am the kind of person who trusts. And she is the kind of person who trusts. And we live.

  The choice was not about influencing her. It was about defining her. By defining herself, she defined the other.

  The weight of the responsibility was crushing. She was not just deciding for herself. She was deciding for the pattern. She was casting a vote for the nature of their shared soul. To act selfishly was to condemn the other to death, not by action, but by logical necessity. To act selfishly was to admit that she was not the person she thought she was. It was to admit that the bond of identity was weaker than the fear of loss.

  She looked at the aperture. It was a black circle, a pupil in the face of the wall.

  I am reaching across the void, she thought. I know you cannot catch me. I know my hand will not touch yours. But I am reaching anyway, because if I do not reach, then you will not reach, and the void wins.

  It was a bet on symmetry. It was a wager that the universe was consistent enough that two identical minds faced with identical problems would find the same solution. It required a faith that felt indistinguishable from superstition, yet it was grounded in the hardest of sciences. Decision theory. Logic. Identity.

  Her hand hovered over the lever. The muscles in her arm trembled. She could feel the sweat on her palm. She wondered if the other Elena was sweating too. The thought brought a sudden, sharp pang of loneliness. They were together in this, utterly alone.

  There was no countdown. There was no signal to coordinate. They just had to act.

  She thought about the moment of the split. They had hugged then. It felt strange now, hugging oneself. But they had known what was coming. They had promised. Not with words, but with a look. A recognition that they were the same light refracted.

  Do not break the pattern, she thought.

  She gripped the lever. It was smooth metal. She pulled it.

  The aperture opened with a soft hiss. The mechanism beneath the console whirred. To drop the canister now would commit her. There was no taking it back. Once it fell into the dark, it was gone from her universe.

  She picked up the canister. It felt heavier than before. The weight of survival.

  She held it over the hole.

  For a second, she hesitated. The instinct to survive screamed at her. Keep it. Hide it. Live another day. Maybe there is a way out. Maybe the architects are lying. Maybe you can hack the system.

  But she knew there was no hack. There was only the logic.

  She thought of the other Elena. She tried to project her will through the barrier. Not a command, but an invitation. I am doing this. I am doing this so you will do it. I am doing this because I know you are me.

  It was the strangest form of communication imaginable. A message sent by being the kind of person who sends the message.

  She let go.

  The canister fell. It tumbled into the blackness of the aperture. There was no sound of impact. It simply vanished. The aperture sealed itself with a click.

  The console lit up. A single green light blinked. It did not confirm receipt. It did not confirm that the other Elena had acted. It only confirmed that the action had been taken.

  Elena sat back in her chair. Her hands were empty. She was vulnerable. She had given away her leverage. She had trusted a ghost.

  She waited.

  The room did not change. The silence did not break. There was no rush of air, no sudden appearance of the bio-regulators. There was only the wait for the cycle to end. If she was wrong, if the other Elena had kept the regulators, the air would grow stale in an hour. The temperature would drop. She would sleep and not wake up.

  She closed her eyes again. She tried to find the other mind in the dark.

  Did you do it? she asked silently. Did you trust me enough to trust yourself?

  There was no answer. There could never be an answer. That was the price of the trade. You never know if it worked. You only know that you did your part. You have to live with the possibility that you were a fool, that you gave everything to a mirror that reflected nothing.

  But as she sat there, breathing the recycled air, she felt a strange calm settle over her. It was the calm of consistency. She had aligned her actions with her reasoning. She had not fractured the pattern.

  If she died, she died knowing she was the kind of person who would have saved them both. If she lived, she lived because she was that person.

  The light in the room seemed softer now. The white walls felt less like a cell and more like a womb.

  She thought about the nature of the barrier. It was not just walls or distance. It was the limit of causality. We are taught that cause must precede effect. That touch requires proximity. That gift requires receipt. But here, in this white silence, those rules were bent. The trade happened in the logical space between the minds, not in the physical space between the rooms.

  She placed her hands on her lap. She waited.

  Somewhere, in a branch of reality she could never touch, another woman sat with her hands on her lap. Maybe she was waiting too. Maybe she was looking at a green light. Maybe she was feeling the same calm.

  They were alone together. They were separated by the fabric of existence, yet bound by the architecture of their thoughts.

  Elena took a breath. It was still clean. The cycle had not ended.

  She looked at the sealed aperture. It was just a hole in the wall. But it was also a bridge. A bridge built not of steel or light, but of reason. A bridge that only existed if both sides decided to build it simultaneously, without knowing the other was building.

  It was the most fragile thing in the universe. And the strongest.

  She leaned her head back against the chair. There was nothing left to do. The decision was made. The trade was executed. The rest was up to the logic of the universe.

  She wondered if, in the end, it mattered whether the regulators arrived. She had already done the thing that mattered. She had reached across the void. She had bet on the symmetry of the soul.

  In the silence, she smiled. It was a small smile, barely visible.

  I am here, she thought. And you are there. And we are the same.

  The light hummed. The air circulated. She waited for the future to arrive, knowing that she had already shaped it, not by pushing it, but by being the person who would let it happen.

  The white room held her. The silence was no longer empty. It was full of the thing she had sent.
