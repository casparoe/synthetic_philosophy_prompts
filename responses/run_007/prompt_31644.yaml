prompt: |-
  Two people in my philsophy of language seminar got into it last week about expressivism and I've been turning it over ever since. They were arguing about whether the Frege-Geach problem is still a live issue.

  Dan said it's basically a knockout: if moral claims just express attitudes, then you can't explain what's going on when moral language shows up embedded in conditionals. Take "If lying is wrong, then getting your brother to lie is wrong." The speaker isn't expressing disapproval of lying in the antecedent—they're entertaining a hypothetical. So the meaning of "wrong" seems to shift between asserted and unasserted contexts. That's a compositionality failure, end of story.

  Mira said Dan was about thirty years behind. Blackburn showed you can treat the conditional as expressing a higher-order attitude: an attitude of disapproval toward the combination of disapproving of lying and not disapproving of getting your brother to lie. So "wrong" means the same thing throughout—it's just that the whole complex sentence expresses a more complicated attitude. No shift in meaning, no problem.

  Dan said okay, but then modus ponens breaks. If "If murder is wrong, then abortion is wrong" and "murder is wrong" are both just attitudes, then what makes the inference to "abortion is wrong" logically valid? You need truth conditions to underwrite logical consequence. Without them, anything goes.

  Mira said that's question-begging. Blackburn's whole move is to redefine validity in terms of clashes of attitudes, not truth-preservation. An inference is valid if you can't accept the premises and reject the conclusion without your attitudes clashing. And Blackburn shows there's a clash in the modus ponens case: approving of the conditional, approving of the antecedent, and disapproving of the consequent is an incoherent combination of attitudes. That's the constraint—it's not just "anything goes."

  Dan said that's not logic, it's psychology. You're telling me what attitudes I can coherently hold, not what follows from what. The whole point of logic is that it's topic-neutral and attitude-independent.

  Mira said that's the point Dan keeps missing: expressivism is a revisionary theory of moral language. Once you give up the idea that moral claims are truth-apt, you should expect the logic to look different. But it still constrains reasoning—incoherent combinations of attitudes are still something you should avoid, and that's normativity enough.

  Then Dan shifted ground. He said: fine, but what about mixed inferences? "If the cat is on the mat, then murder is wrong" is a mixed sentence with a descriptive antecedent and a moral consequent. What's the attitude there? You can't just say it's a higher-order attitude about combinations of descriptive beliefs and moral attitudes, because then you've got to explain how logical vocabulary works across the descriptive/normative divide without collapsing the distinction.

  Mira admitted mixed sentences are the hardest case but said both Gibbard and later Blackburn have accounts. Gibbard's norm-expressivism treats all normative language as expressing plans, and the logic of plans handles mixed contexts by treating factual-normative worlds as the objects of planning states. She said Dan was cherry-picking the earliest version of the view and acting like nobody's worked on it since 1984.

  Dan said Gibbard's solution is basically to build truth conditions back in through the back door—if you're treating normative statements as expressing plans plus factual beliefs with representational content, you're not really an expressivist anymore, you're a hybrid theorist.

  That's where they left it. Neither convinced the other. I'm not sure who's right. Can you go through their exchange and adjudicate each move? Who has the better of which specific arguments, and what, if anything, are both of them missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy of language seminar debate between two students (Dan and Mira) about Expressivism and the Frege-Geach Problem.
      *   **Task:** Adjudicate their exchange. Evaluate who wins specific arguments, identify strengths/weaknesses in their positions, and point out what both might be missing.
      *   **Key Topics:** Expressivism, Frege-Geach Problem, Blackburn's Quasi-Realism, Logic/Validity (truth-preservation vs. attitude-consistency), Mixed Inferences, Gibbard's Plan-Expressivism, Hybrid Theories.

  2.  **Deconstruct the Debate (Move by Move):**

      *   **Move 1: The Basic Frege-Geach Challenge (Dan)**
          *   *Claim:* Moral claims express attitudes. In conditionals ("If lying is wrong..."), no attitude is expressed in the antecedent. Therefore, meaning shifts (compositionality failure).
          *   *Assessment:* This is the classic statement of the problem (Geach 1960, Searle 1962). It's a strong starting point. Dan is correct that *simple* expressivism faces this.
          *   *Verdict:* Dan is right about the *problem*, but maybe too quick to call it a "knockout" given subsequent literature.

      *   **Move 2: Blackburn's Higher-Order Attitudes (Mira)**
          *   *Claim:* Blackburn (1984, *Spreading the Word*) solves this. Conditionals express higher-order attitudes (disapproval of holding conflicting attitudes). Meaning stays constant.
          *   *Assessment:* This is an accurate summary of Blackburn's quasi-realist strategy. It addresses the compositionality worry by assigning semantic content to the complex sentence without assigning truth conditions to the parts in a realist sense.
          *   *Verdict:* Mira is right that Dan is ignoring 40 years of literature. Blackburn's solution is the standard expressivist response.

      *   **Move 3: The Logic/Validity Objection (Dan)**
          *   *Claim:* Modus Ponens breaks. Attitudes aren't truth-apt. Logic requires truth-preservation. Without truth conditions, validity collapses.
          *   *Assessment:* This is the "Logic Objection" (Schroeder, Hale). It's a serious challenge. Expressivists need to explain *why* the inference is valid, not just why we feel compelled to make it.
          *   *Verdict:* Dan raises a genuine technical difficulty. Truth-conditional semantics has a clean definition of validity; expressivism needs to work harder.

      *   **Move 4: Redefining Validity (Mira)**
          *   *Claim:* Validity = inconsistency of attitudes (accepting premises + rejecting conclusion = clash). Blackburn shows the clash.
          *   *Assessment:* This is the expressivist definition of validity (consistency of commitments). It works for pure moral inferences.
          *   *Verdict:* Mira is right that expressivists *have* an account of validity. However, Dan's worry (that this is psychology, not logic) is a standard realist counter.

      *   **Move 5: Logic vs. Psychology (Dan)**
          *   *Claim:* This is psychology (coherence of mind), not logic (topic-neutral consequence).
          *   *Assessment:* This touches on the "Problem of Creeping Minimalism" or the distinction between *explaining* validity vs. *providing* a logic. If validity is just about mental coherence, does it hold for someone who doesn't care about coherence? Realists argue logic is mind-independent.
          *   *Verdict:* Dan has a point here. Expressivist validity is often accused of being too subjective or psychological. However, quasi-realists argue this *is* what logic amounts to normatively.

      *   **Move 6: Mixed Inferences (Dan)**
          *   *Claim:* "If cat is on mat, then murder is wrong." Descriptive antecedent, moral consequent. How do attitudes mix with beliefs?
          *   *Assessment:* This is the "Mixed Compound" problem. It's harder than pure moral conditionals. Simple higher-order attitudes struggle here because beliefs and desires/attitudes are different mental states (Humean psychology).
          *   *Verdict:* Dan scores a point. This is widely acknowledged as a tougher hurdle than the pure moral case.

      *   **Move 7: Gibbard's Plan-Expressivism (Mira)**
          *   *Claim:* Gibbard (*Wise Choices, Apt Feelings*, *Thinking How to Live*) solves this. All normative language expresses plans. Factual-normative worlds handle mixed contexts.
          *   *Assessment:* Accurate summary of Gibbard. He unifies the mental states (planning) to handle the logic uniformly.
          *   *Verdict:* Mira is right that the theory evolved. Gibbard is the go-to for logical sophistication in expressivism.

      *   **Move 8: Hybrid Theory Accusation (Dan)**
          *   *Claim:* Gibbard builds truth conditions back in (factual beliefs + plans). It's hybrid expressivism, not pure expressivism.
          *   *Assessment:* This is the "Creeping Minimalism" worry (Dreier, Lenman). If expressivism explains everything realism does (logic, truth, knowledge), is it distinct? Gibbard's later work does look very close to cognitivism.
          *   *Verdict:* Dan hits a nerve. The line between sophisticated expressivism and cognitivism is blurry.

  3.  **Synthesize and Adjudicate:**

      *   **Overall:** Dan represents the classic realist/semantic objection. Mira represents the updated quasi-realist/expressivist defense.
      *   **Who wins what?**
          *   *Frege-Geach (Basic):* Mira wins. Dan's "knockout" claim is outdated. Blackburn solved the basic embedding issue.
          *   *Logic/Validity:* Draw/Lean Dan. Mira explains *consistency*, but Dan is right that explaining *validity* (normative force independent of psychology) is harder for expressivists. Schroeder's "Inconsistency" argument is relevant here.
          *   *Mixed Inferences:* Lean Mira (technically), but Dan's Hybrid worry is potent. Gibbard solves the logic, but at the cost of distinctiveness.
      *   **What are they missing?**
          *   *Mark Schroeder:* His book *Being For* is the modern benchmark. He formalizes the expressivist logic but argues it still faces a "negation problem" (Baker 2023 also relevant).
          *   *Creeping Minimalism:* The meta-ontological question. If expressivism mimics realism perfectly, what's the dispute about?
          *   *Global vs. Local Expressivism:* Are they talking about moral language only (local) or all language (global)? Gibbard is more global.
          *   *The Nature of the Disagreement:* Is it metaphysical (what moral properties *are*) or semantic (what moral words *do*)?

  4.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the quality of the debate. It's a classic dialectic.
      *   *Round 1 (Embedding):* Mira wins. Dan's "knockout" is 1960s thinking. Blackburn's higher-order attitudes handle the compositionality.
      *   *Round 2 (Logic):* Dan has the stronger philosophical intuition, but Mira has the technical defense. The "Logic vs. Psychology" objection is the hardest for expressivists to shake. Mention Schroeder here.
      *   *Round 3 (Mixed Inferences & Gibbard):* Mira is right about the technical solution, but Dan is right about the cost. This leads to the "Creeping Minimalism" problem.
      *   *Missing Context:*
          *   Schroeder's *Being For* (the formalization of the logic).
          *   The Negation Problem (a newer version of Frege-Geach).
          *   The distinction between Local and Global Expressivism.
          *   The meta-ethical cost: If Gibbard is right, is expressivism distinct from cognitivism?
      *   *Conclusion:* Mira wins on textual/historical accuracy (expressivism isn't dead). Dan wins on philosophical cost (expressivism pays a high price to mimic realism).

  5.  **Refining the Tone:**
      *   Keep it academic but accessible.
      *   Ensure fairness to both sides.
      *   Use specific terminology (Quasi-Realism, Plan-Expressivism, Creeping Minimalism, Truth-Aptness).

  6.  **Self-Correction/Check during drafting:**
      *   *Did I represent Blackburn correctly?* Yes, higher-order attitudes of disapproval.
      *   *Did I represent Gibbard correctly?* Yes, planning states and factual-normative worlds.
      *   *Is Dan's "Hybrid" claim accurate?* It's a common criticism. Gibbard denies it, but many argue his view *is* a form of cognitivism or hybrid view. I should frame this as a boundary dispute.
      *   *Make sure to mention the "Negation Problem".* It's the modern version of Frege-Geach that Dan might not know about (Schroeder/Baker).

  7.  **Final Polish:** Organize with clear headings for readability. (Proceed to generate output based on this structure.)
answer: |-
  This is a remarkably high-quality exchange. Dan and Mira have effectively reenacted the central dialectic of meta-ethics from 1960 to the present. Dan is channeling the classic realist objections (Geach, Hale, early Schroeder), while Mira is channeling the quasi-realist defenses (Blackburn, Gibbard, later Schroeder).

  Neither is "wrong" in a factual sense, but they are talking past each other on the *cost* of the theory. Dan thinks the cost is fatal; Mira thinks the cost is the price of admission.

  Here is an adjudication of their specific moves, followed by what both of them are missing.

  ### Round 1: The Basic Frege-Geach Problem
  **Dan:** Claims embedding in conditionals proves meaning shifts (compositionality failure).
  **Mira:** Claims Blackburn's higher-order attitudes solve this.

  **Adjudication: Mira wins this round.**
  Dan's claim that this is a "knockout" is historically outdated. In 1960, Geach did deal a severe blow to *simple* emotivism (Ayer, Stevenson). However, Blackburn's *Spreading the Word* (1984) is specifically designed to answer this.
  *   **Why Dan is weak here:** He treats expressivism as if it stops at "Boo! Murder." Quasi-realism explicitly grants that moral sentences have semantic structure. Blackburn argues that "If lying is wrong..." expresses a state of mind that is *structurally* identical to a belief, even if its functional role is different.
  *   **Why Mira is strong:** She correctly identifies that the expressivist can assign a consistent semantic value to "wrong" across asserted and unasserted contexts by appealing to the structure of the attitude, not the presence of a truth condition.

  ### Round 2: Logic and Validity
  **Dan:** Claims modus ponens requires truth conditions; otherwise, it's just psychology.
  **Mira:** Claims validity is redefined as inconsistency of attitudes (clash of commitments).

  **Adjudication: Dan has the stronger philosophical intuition; Mira has the technical defense.**
  This is the hardest hill for expressivists to die on.
  *   **Dan's Point:** Logic is traditionally topic-neutral and mind-independent. If validity is just "you feel weird holding these attitudes together," then a sociopath who feels no clash commits no logical error. Dan is right that expressivism struggles to capture the *normativity* of logic itself, rather than just the normativity of morality.
  *   **Mira's Point:** She is right that expressivists *have* a formal account. Blackburn and Gibbard define validity as the impossibility of accepting the premises and rejecting the conclusion without being in an inconsistent state.
  *   **The Verdict:** Dan identifies the *explanatory gap*. Expressivists can *mimic* the practice of logic, but Dan is right to question whether they explain *why* logic binds us. If logic is just coherent psychology, it loses its authority over people with incoherent psychologies.

  ### Round 3: Mixed Inferences and Gibbard
  **Dan:** Mixed sentences ("If cat is on mat, then murder is wrong") break the attitude model.
  **Mira:** Gibbard's plan-expressivism unifies the mental states to handle this.

  **Adjudication: Mira wins on technicality, Dan wins on distinctiveness.**
  *   **Mira:** She is correct that Gibbard's *Thinking How to Live* (2003) offers a sophisticated semantics that handles mixed inferences. By treating all normative judgments as "plans" and embedding them in "factual-normative worlds," Gibbard provides a truth-conditional-style semantics for expressivism.
  *   **Dan:** His accusation that Gibbard is a "hybrid theorist" (or worse, a covert cognitivist) is a serious philosophical charge. If the "plan" state has a world-to-mind direction of fit *and* representational content sufficient to underwrite logic, in what sense is it not a belief?
  *   **The Verdict:** Dan hits the "Creeping Minimalism" worry. If expressivism explains everything cognitivism explains (truth, logic, knowledge, embedding), the distinction between the two views threatens to vanish.

  ### What Both of Them Are Missing

  While their debate is historically accurate, both are missing three crucial developments in the last 15 years that would sharpen their arguments.

  **1. The "Negation Problem" (Schroeder & Baker)**
  Dan stops at the classic Frege-Geach problem. Mira cites Gibbard as the solution. However, Mark Schroeder (*Being For*, 2008) and Mark Baker (2023) have argued that even Gibbard's solution fails on **negation**.
  *   **The Issue:** Expressivists say "Murder is wrong" expresses Disapproval(Murder). What does "Murder is not wrong" express? It can't be "Not Disapproval(Murder)" (that's indifference). It must be "Tolerance(Murder)." But then, what does "It is not the case that murder is not wrong" express?
  *   **Why it matters:** Dan thinks the problem is solved; Mira thinks it's solved. Schroeder argues that expressivists still cannot distinguish between logically distinct negative sentences without collapsing distinct attitudes. This is the current "live issue" Dan claimed was dead.

  **2. Local vs. Global Expressivism**
  They are arguing as if this is only about moral language (Local Expressivism).
  *   **The Issue:** If moral language is expressive but descriptive language is representational, mixed inferences (Dan's Move 6) are indeed a nightmare because you are mixing two different kinds of semantic glue.
  *   **The Fix:** Global Expressivists (like Huw Price or late Gibbard) argue *no* language is representational. All language is expressive of functional roles.
  *   **Why it matters:** If Mira were a Global Expressivist, Dan's mixed inference objection loses force because "The cat is on the mat" is also expressing a state, not describing a fact. But Global Expressivism is a much heavier metaphysical pill to swallow than Local Expressivism. Neither student clarified which version they are defending.

  **3. The "Quasi-Realist" Goal**
  Dan treats the mimicry of realism as a bug; Mira treats it as a feature. They are missing the meta-ontological point.
  *   **The Issue:** Blackburn's goal isn't just to save logic; it's to earn the right to talk about moral "truth" and "knowledge" without positing moral "facts."
  *   **Why it matters:** Dan's final move ("You're just a hybrid theorist") is actually the ultimate compliment to a quasi-realist. If the expressivist successfully earns the right to talk exactly like a realist, the debate shifts from semantics to metaphysics. Dan is assuming there *must* be a semantic difference to have a metaphysical difference. Mira should argue that the difference is in the *explanation* of the semantics, not the semantics themselves.

  ### Final Scorecard

  *   **On History:** **Mira.** Dan is wrong to call it a "knockout." The literature has moved on significantly since 1960.
  *   **On Logic:** **Dan.** He correctly identifies that expressivist validity is psychologically grounded, which struggles to match the objective normativity of logic.
  *   **On Mixed Inferences:** **Draw.** Gibbard solves the logic, but Dan is right that it blurs the line between expressivism and cognitivism.
  *   **On the "Live Issue" Question:** **Dan is surprisingly right.** While Mira is right that Blackburn/Gibbard exist, the Frege-Geach problem *is* still a live issue because the solutions (Gibbard's plans) are so complex they invite new problems (Negation Problem, Creeping Minimalism). It is not "solved" in the sense that everyone accepts it; it is "solved" only by making expressivism look almost identical to realism.

  **Recommendation:** Tell them to read Mark Schroeder's *Being For* (2008). It formalizes Mira's logic but validates Dan's worry that the cost of the solution is incredibly high. That book is the modern battlefield where this exact fight is happening.
