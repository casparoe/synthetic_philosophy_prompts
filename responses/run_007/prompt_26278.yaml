      *   *Requirement 1: Moral Responsibility.* We need free will to justify praise, blame, punishment, and reward. If we don't have it, the legal and moral systems collapse or become purely utilitarian quarantine systems.
      *   *Requirement 2: Control/Agency.* The agent must be the source of the action, not external coercion or internal compulsion (like addiction or psychosis).
      *   *Requirement 3: Evitability/Ability to Do Otherwise.* We need to feel that we could have done differently if we had chosen differently. (Dennett redefines this compatibilistically).
      *   *Requirement 4: Coherence/Intelligibility.* The concept shouldn't rely on miracles or breaks in the laws of physics (libertarian indeterminism).
      *   *Requirement 5: Dignity/Autonomy.* We want to be authors of our lives, not puppets.

  4.  **Categorize Requirements ("Worth Wanting" vs. "Free Will"):**
      *   "Free Will" part: Usually implies sourcehood, alternate possibilities, control.
      *   "Worth Wanting" part: Usually implies moral responsibility, dignity, social utility, coherence (because we don't want magic).
      *   Tension: The traditional "Free Will" definition (Libertarian) often conflicts with the "Worth Wanting" constraint of Coherence (Naturalism). Dennett resolves this by adjusting the "Free Will" definition to fit the "Worth Wanting" constraints.

