      You are right to pause there because that phrase is the pivot point of his whole project and it does the heavy lifting in his argument. When Dennett talks about the varieties of free will worth wanting he is essentially setting up a filter that screens out metaphysical luxuries we think we want but would actually undermine the very things we value about agency. To get clear on the criteria you need to look at what work we expect free will to do in our lives versus what we think it requires metaphysically. The first and perhaps most non-negotiable requirement comes from the worth wanting side and it is the capacity to ground moral responsibility. If a conception of free will does not allow us to distinguish between an agent who is responsible for their actions and one who is not then it fails the test because the primary reason we care about free will in social and legal contexts is to justify praise blame punishment and reward. We do not want a version of free will that makes everyone either a puppet or a random number generator because neither of those states allows for meaningful accountability. This requirement is not just Dennett's preference it is structural to how we operate as social beings though one could argue a hard determinist might reject it.

      The second requirement comes more from the free will side of the equation and it is control or authorship. We need to be the source of our actions in a way that distinguishes us from coerced agents or those suffering from compulsions. This means the theory must explain how an agent can reflect on their desires and endorse some while rejecting others. Dennett insists that this control must be robust enough to protect our dignity and autonomy because without it we are merely vessels for causal chains. This ties closely to the third requirement which is evitability or the ability to do otherwise. Traditionally people think this requires that at the exact moment of choice the future was open in a metaphysical sense but Dennett argues that what is worth wanting is not magic openness but rather the practical capacity to have done otherwise if you had chosen differently. We want the kind of evitability that allows us to learn from mistakes and adjust our behavior not the kind that introduces randomness into the decision-making process.

      Here is where you start to see the tension between the requirements that come from the free will label and those that come from the worth wanting filter. The traditional intuition about free will often demands indeterminism the idea that the causal chain must be breakable by the agent to be truly free. However the worth wanting requirement of control demands determinism or at least regularity because if your actions are uncaused or random you cannot control them and if you cannot control them you cannot be responsible for them. This is the central incompatibility that Dennett is trying to dissolve. He argues that the libertarian conception of free will which insists on metaphysical indeterminism fails the worth wanting test because it sacrifices control for the sake of a mysterious freedom that offers no actual benefit. So the requirement for coherence or naturalism is a hard line for Dennett he treats it as non-negotiable because he believes incoherent concepts cannot be wanted by rational agents but you might view this as his philosophical preference sneaking in. He insists we cannot want magic because magic is unintelligible whereas a compatibilist freedom is real and actionable.

      Another tension arises between the desire for ultimate responsibility and the reality of causal history. We often want to be the unmoved movers of our lives entirely self-created but the worth wanting criteria forces us to accept that we are products of our genetics and environment. Dennett argues that this is actually worth wanting because being shaped by evolution and culture gives us the competencies we need to be free in the first place. If we were not determined by our history we would not have the stable character traits required for responsibility. So the requirement here is that the theory must accommodate our status as natural beings without reducing us to mere mechanisms. This is where Dennett's preferences are most visible because he is committed to a Darwinian worldview and he shapes the definition of free will to fit within that framework. A libertarian might say this is giving up too much but Dennett would say it is the only way to keep the concept intelligible.

      Ultimately the non-negotiable requirements are those that preserve the social practice of holding each other accountable and the psychological experience of being in control. If a theory loses those it is not free will worth wanting. The requirements that are more specific to Dennett are the strict adherence to naturalism and the rejection of any form of dualism or miracle. The tension you are looking for is precisely between the intuition that freedom requires escaping causality and the pragmatic need for freedom to rely on causality. If you demand the former you lose the latter and vice versa. Dennett's solution is to argue that the former is a illusion and only the latter is worth wanting. So when you evaluate the criteria you have to decide if you agree that a naturalistic controlled agency is sufficient or if you feel that something essential is lost when you remove the metaphysical openness. The desiderata are basically moral responsibility control evitability and coherence and the trade-off is that you must accept determinism to keep the first three.

