      *   Dennett is a compatibilist. He argues against libertarian free will (the "magic" kind that requires breaking causality) because it's incoherent and not actually desirable.
      *   He argues for a naturalistic, evolutionary account of free will.
      *   "Worth wanting" implies pragmatic value: moral responsibility, dignity, control, avoidance of manipulation, ability to do otherwise (in a sensible sense).
      *   Key concepts: Evitability, control, self-control, moral responsibility, predictability vs. randomness.

