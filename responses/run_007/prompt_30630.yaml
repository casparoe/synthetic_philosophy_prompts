      *   *Claim 5 (The Hand-off):* This is the dangerous part. Even if you get the reward, optimizing it blindly leads to specification gaming. Mention the "King Midas" problem.
      *   *Claim 6 (Computational):* Distinguish between "playing Atari from demos" and "learning human morality." The latter is not just a compute problem.
