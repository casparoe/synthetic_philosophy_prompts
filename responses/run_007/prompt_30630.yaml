      *   *Claim 2 (Mechanism):* RL = Reward $\to$ Policy; IRL = Policy $\to$ Reward. *Verdict:* Technically accurate definition. This is the standard textbook definition.
      *   *Claim 3 (Revealed Preference):* "Simply read off." *Verdict:* **Highly Misleading.** Revealed preference assumes rationality. Humans are irrational, inconsistent, and have hidden states. There's also the problem of *degeneracy* (many reward functions explain the same behavior).
      *   *Claim 4 (Key to Alignment):* "Often called the key." *Verdict:* Overstated. It's *a* approach (Apprenticeship Learning, Imitation Learning), but "the key" implies a consensus that doesn't exist.
      *   *Claim 5 (The Promise):* Recover reward $\to$ Agent does what human wants. *Verdict:* **The Biggest Leap.** This ignores the "Objective Robustness" problem, the "Goodhart's Law" problem, and the fact that the recovered reward might be context-dependent. Also, humans don't have a single static reward function.
      *   *Claim 6 (Obstacles):* "Mainly computational... significant progress." *Verdict:* **Overly Optimistic.** The obstacles are fundamental (identifiability, rationality assumptions, normative vs. descriptive), not just computational. Deep IRL has progress, but not on *human* alignment specifically at scale.

