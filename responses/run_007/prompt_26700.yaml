      *   *Decision:* There is a potential verbal dispute regarding "assertability" vs. "truth." The Adams camp might say "assertability conditions *are* the meaning," while the Prop camp says "truth conditions are the meaning, assertability is derivative." This is substantive, not merely verbal, but often *talked past* via terminology. I should note that the term "proposition" is the flashpoint.

  8.  **Review and Refine:**
