  # Adversarial Collaboration Statement: The Status of Indicative Conditionals

  **Date:** October 26, 2023
  **Participants:** [Name, Adams-Camp], [Name, Propositionalist-Camp]
  **Facilitator:** [User/Software Engineer]

  ## Preamble
  We acknowledge that the relationship between Indicative Conditionals ("If A, then C"), Probability, and Truth Conditions is governed by limitative results (specifically Lewis's Triviality Results). We agree that these results force a choice between maintaining Adams' Thesis as a universal semantic rule and maintaining that conditionals express standard propositions. This document isolates our shared understanding of the logic, specifies our residual disagreements, and identifies empirical or conceptual "cruxes" that would resolve the dispute.

  ---

  ## 1. Shared Substantive Claims
  *Both parties affirm the following claims as accurate descriptions of the logical landscape.*

  1.  **Adams' Thesis (AT):** We agree on the formulation of Adams' Thesis: For any rational agent and propositions $A$ and $C$ (where $P(A) > 0$), the degree of belief in the indicative conditional $A \to C$ is equal to the conditional probability of $C$ given $A$. Formally: $P(A \to C) = P(C|A)$.
  2.  **Lewis's Assumptions:** We agree that David Lewis's 1976 triviality proof relies on two key structural assumptions:
      *   **Propositionality:** The conditional $A \to C$ expresses a proposition (i.e., it is an event in the Boolean algebra over which the probability function is defined).
      *   **Closure under Conditioning:** The probability function can be updated by conditioning on the conditional itself (i.e., $P(\cdot | A \to C)$ is a well-defined probability function).
  3.  **The Trilemma:** We agree that Lewis's proof demonstrates that AT, Propositionality, and Non-Triviality (the existence of non-0/1 probabilities) are mutually inconsistent. One must be rejected.
  4.  **Scope of the Proof:** We agree that Lewis's proof does *not* demonstrate that AT is false, nor does it demonstrate that Propositionality is false on its own. It only demonstrates they cannot *both* be universally true in a standard probability space.
  5.  **Normative Force:** We agree that AT captures a robust intuition about rational reasoning. Even if one side denies AT as a semantic truth, both acknowledge it functions as a strong pragmatic norm or heuristic for assertability in most ordinary contexts.

  ---

  ## 2. Disagreements Table
  *The following table isolates the specific points of divergence. Each statement is phrased such that the proponent of that view accepts it as a fair characterization of their position.*

  | Topic | Adams-Camp Position (Non-Propositionalist) | Propositionalist Position |
  | :--- | :--- | :--- |
  | **Ontological Status** | Indicative conditionals do not express propositions. They lack truth conditions. Their semantic value is a probability (or acceptance condition), not a truth value. | Indicative conditionals do express propositions. They have truth conditions (e.g., possible worlds semantics) and can be strictly true or false. |
  | **Interpretation of Lewis** | Lewis's result is a *reductio* of the Propositionalist view. Since AT is phenomenologically correct, the assumption that conditionals are propositions must be discarded. | Lewis's result is a *reductio* of the unrestricted Adams' Thesis. Since conditionals behave like propositions (e.g., in logic), AT must be restricted to assertability or specific contexts. |
  | **Nature of Belief** | To "believe" a conditional is not to believe a proposition is true, but to have a high conditional degree of belief. | To "believe" a conditional is to believe a proposition is true; high conditional probability is merely evidence for that truth, not the belief itself. |
  | **Logical Embedding** | Conditionals do not genuinely embed within other logical operators (negation, disjunction, antecedents). Apparent embeddings are pragmatic shorthands. | Conditionals genuinely embed within other logical operators. Their behavior in complex sentences confirms their propositional status. |

  ---

  ## 3. Cruxes
  *These are sub-questions where settling the matter would cause at least one party to revise their position or concede the debate.*

  1.  **The Embedding Crux:** Can indicative conditionals be coherently embedded as constituents of larger truth-functional compounds (e.g., "Either if A then C, or if B then D") without paraphrase?
      *   *Resolution Condition:* If it is demonstrated that such embeddings are semantically coherent and truth-evaluable, the Adams-Camp must concede propositionality. If it is demonstrated that such embeddings systematically fail to have truth conditions, the Propositionalist must concede non-propositionality.
  2.  **The Divergence Crux:** Are there clear cases where rational credence in $A \to C$ *diverges* from $P(C|A)$?
      *   *Resolution Condition:* If robust cases (e.g., Kaufmann cases) are identified where rational agents intuitively assign $P(A \to C) \neq P(C|A)$, the Adams-Camp must accept AT is not universal. If all such cases can be explained away as performance errors or context shifts, the Propositionalist must accept AT as a stronger semantic constraint.

  ---

  ## 4. Concrete Arguments and Pre-Recorded Predictions
  *For each Crux, we specify a test case. Each side records their prediction of how the case will be judged by neutral third parties or further analysis.*

  ### Crux 1: The Embedding Crux
  **Test Case:** Consider the sentence: *"Either if it rains the match will be cancelled, or if it snows the match will be moved indoors."*
  *   **Question:** Does this sentence have a determinate truth condition that is a function of the truth conditions of its parts?

  | Side | Prediction |
  | :--- | :--- |
  | **Adams-Camp** | We predict that neutral analysis will show this sentence lacks standard truth conditions. It will be analyzed as a disjunction of *assertability conditions* or paraphrased into a molecular proposition (e.g., $(R \to C) \lor (S \to M)$ is actually $(R \land C) \lor (S \land M)$). |
  | **Propositionalist** | We predict that neutral analysis will confirm this sentence is truth-evaluable. It will be shown that possible-worlds semantics (e.g., Stalnaker) can assign it a truth value without paraphrase, preserving the conditional structure. |

  ### Crux 2: The Divergence Crux
  **Test Case:** **Kaufmann's Urn Cases.** An urn contains 100 balls. 80 are red, 20 are white. Of the red balls, 10 have a black spot. Of the white balls, 18 have a black spot. You pick a ball at random.
  *   **Question:** What is the probability of: *"If the ball is red, it has a black spot"*?
      *   $P(\text{Spot} | \text{Red}) = 10/80 = 0.125$.
      *   However, intuitively, many agents assess the probability as the total proportion of spotted balls that are red, or simply find the conditional probability mismatch intuitive in specific causal setups. (Specifically, we look for cases where $P(A \to C)$ aligns with causal probability rather than evidential conditional probability).

  | Side | Prediction |
  | :--- | :--- |
  | **Adams-Camp** | We predict that upon rigorous clarification of the setup, rational agents will converge on $P(C|A) = 0.125$. Any divergence is a cognitive illusion caused by confusing the conditional with a causal claim or a different context. |
  | **Propositionalist** | We predict that rational agents will persistently judge the probability of the conditional differently from $P(C|A)$ in these specific causal structures. This proves AT is not a semantic law, but at best a default heuristic. |

  ---

  ## 5. Identification of Merely Verbal Disputes
  *We have reviewed our terminology to ensure we are not talking past one another.*

  **Finding:** We identify a potential verbal dispute regarding the definition of **"Proposition."**
  *   **Risk:** The Adams-Camp sometimes uses "proposition" to mean "object of categorical belief." The Propositionalist uses "proposition" to mean "function from worlds to truth values."
  *   **Resolution:** We agree to stipulate for this collaboration that **"Proposition" means "truth-conditional content capable of being the semantic value of a sentence in a Boolean algebra."**
  *   **Remaining Substantive Dispute:** Even with this definition, the dispute remains **substantive**, not verbal. The disagreement is not merely about how to use the word "proposition," but about whether the semantic value of conditionals *actually possesses* truth conditions. The Adams-Camp claims the semantic value is fundamentally probabilistic; the Propositionalist claims it is fundamentally truth-conditional (with probability being derivative). This is an ontological disagreement about language and mind, not a terminological one.

  ---

