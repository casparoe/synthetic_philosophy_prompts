prompt: |-
  I'm a software engineer with no formal philosophy background who has been reading about indicative conditionals on my own, and I've gotten stuck on Lewis's triviality results. I'm in a study group with two people who have argued about this for months, and we've agreed to write an adversarial-collaboration statement to separate real disagreement from talking past each other. One of them takes the Adams-camp view: Adams' Thesis is correct without qualification — the degree of belief appropriate to an indicative conditional just is the corresponding conditional probability — and since Lewis's results show that no propositional connective can satisfy that thesis in general, indicative conditionals do not express propositions. The other takes the propositionalist view: indicative conditionals do express propositions with truth conditions, so Adams' Thesis must be either false or at most a norm of assertability rather than a claim about credence; he takes the triviality results to be the main reason to accept that restriction. Draft the document they should both be able to sign. It should include: (1) a numbered list of substantive claims both accept, covering Adams' Thesis itself, what Lewis's proof actually assumes (for example, closure under conditioning and treating the conditional as an ordinary event in the algebra), and what the proof rules out and what it does not; (2) a disagreements table in which each residual disagreement is phrased so that its own side would accept the wording; (3) the cruxes — the sub-questions such that settling one would move at least one of them; and (4) for each crux, a concrete argument or case that both would agree bears on it, with each side's prediction recorded in advance. If you conclude that part of their dispute is merely verbal, say which part and why.
