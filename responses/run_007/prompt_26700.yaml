  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to frame the disagreement so neither feels strawmanned.
      *   *Adams-Camp:* "Conditionals lack truth conditions."
      *   *Propositionalist:* "Conditionals have truth conditions; AT is a norm of assertability."
      *   *Phrasing:* Use "We disagree on whether..." or "Side A holds X, Side B holds Y."
      *   *Key tension:* Is the semantic value of a conditional a truth condition (proposition) or something else (probability/acceptance condition)?

  5.  **Drafting Section 3: Cruxes:**
      *   What would change their minds?
      *   *Crux 1:* Intuitions about embedding. If conditionals embed in logical operators (negation, disjunction), they look like propositions. If they don't embed well, they look non-propositional.
      *   *Crux 2:* The "Gibbard Phenomenon" or similar limitative results. Does another proof kill the propositionalist view even if they restrict AT?
      *   *Crux 3:* Pragmatics vs. Semantics. Is the divergence between $P(A \to C)$ and $P(C|A)$ in specific cases a bug (Adams) or a feature (Prop)?
      *   *Selection:* Let's focus on *Embedding* and *The Nature of the Divergence*. Embedding is the strongest test for propositionality. The interpretation of "counterexamples" to AT is the strongest test for the thesis itself.

  6.  **Drafting Section 4: Concrete Arguments/Cases:**
      *   *Case for Embedding:* "If it rains, the match is cancelled" inside a disjunction: "Either if it rains the match is cancelled, or if it snows..."
      *   *Prediction (Adams):* This sounds awkward or requires paraphrase; it doesn't behave like a standard proposition.
      *   *Prediction (Prop):* This is perfectly intelligible and truth-evaluable.
      *   *Case for AT Divergence:* McGee's counterexamples or Kaufmann's cases (where $P(C|A) \neq P(A \to C)$ intuitively).
      *   *Prediction (Adams):* These are trick cases where conditional probability isn't the right measure, or intuitions are confused.
      *   *Prediction (Prop):* These show AT is not a universal semantic rule.

  7.  **Drafting Section 5: Verbal Disputes:**
      *   Is there a verbal dispute? Often, the fight is over the definition of "proposition."
