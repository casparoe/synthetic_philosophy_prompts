          *   If the agent knows the bias is *only* on the positive side, they can mathematically strip that weight out.
          *   Result: They converge.
          *   *Why?* Because the asymmetry provides a "correction factor."
          *   *To break them:* You need the HOE to undermine the very reasoning used to process the HOE. (Self-undermining). Or, you need the HOE to be non-specific about direction (as per the user's angle).
          *   *Decision:* I will construct the case so that (a) and (b) **converge**, precisely because the asymmetry makes the bias correctable. I will then explain that to create divergence (and address the user's angle about unknown direction), we need to remove the asymmetry/specificity. This validates the user's intuition that the "unknown direction" is where the trouble lies.

