          *   (c) Divergence? No. They converge.
          *   **The Twist:** Explain *why* they converge (the asymmetry allows a clean subtraction of error). Explain what's needed to break them (symmetric/vague HOE where you don't know *which way* to adjust). This ties back to the user's angle about "adjust in the direction you're probably biased."

