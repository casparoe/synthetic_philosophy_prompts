answer: |-
  The history of hedonistic theories of well-being is defined by a struggle to identify the common denominator of pleasure. The classical Sensory Theory posited that pleasure is a distinctive, introspectible felt quality—a "glow" or "tingle"—that accompanies all pleasant experiences. This view was rightly abandoned due to the **heterogeneity problem**: the phenomenology of enjoying a cool drink, solving a complex equation, and listening to a symphony share no common sensory element. In response, contemporary philosophers (most notably Fred Feldman and Chris Heathwood) advanced the **Attitudinal Theory**. On this view, pleasure is not a sensation but a propositional attitude: the state of *taking pleasure in* some state of affairs $p$.

  It is standardly claimed that this move dissolves the heterogeneity problem. By shifting from a sensory component to an intentional attitude, the theory allegedly accommodates the diverse phenomenology of pleasant experiences while preserving their unity as contributors to well-being. I argue that this claim is illusory. The shift from Sensory to Attitudinal theory does not solve the heterogeneity problem; it merely relocates it. The unity of the sensory "glow" is replaced by the disunity of the attitudinal "taking." The attitude of *taking pleasure in* is itself realized by a heterogeneous collection of psychological states, and the standard attempts to unify them either fail to identify a natural kind or forfeit the specific advantages the attitudinal view was meant to secure.

  ### The Heterogeneity of the Attitude

  The core promise of the Attitudinal Theory is that while the *objects* of pleasure vary (ice cream, justice, music), the *attitude* remains constant. Just as belief is a single attitude directed at various propositions, *taking pleasure in* is purported to be a single attitude directed at various states of affairs. However, this analogy breaks down under scrutiny.

  Consider the psychological state involved in *taking pleasure in* a witty joke versus *taking pleasure in* the relief of a headache subsiding. In the former, the state involves amusement, a cognitive shift in perspective, and perhaps a disposition to laugh. In the latter, the state involves the cessation of aversion, a sense of release, and a return to baseline. To label both as "taking pleasure in" is to apply a functional label to two distinct psychological mechanisms. The "attitude" is not a unitary mental glue; it is a disjunctive category covering amusement, satisfaction, relief, joy, contentment, and gratification.

  If the Attitudinal Theory claims that these are all tokens of a single type of mental state, it faces the same phenomenological emptiness that plagued the Sensory Theory. There is no introspectible commonality to the *attitude itself* any more than there was to the *sensation itself*. The heterogeneity has not been eliminated; it has been moved from the sensory content of the experience to the intrinsic nature of the pro-attitude.

  ### The Failure of Unification Strategies

  Proponents of the Attitudinal Theory might attempt to unify these heterogeneous states through three standard strategies: appeal to a formal object, appeal to a functional role, or appeal to a reintroduced felt quality. Each strategy fails to secure the theoretical ground the Attitudinal view requires.

  **1. The Appeal to Formal Object**
  One might argue that what unifies these attitudes is their **formal object**: they are all pro-attitudes directed at something apprehended as *good* or *favorable*. While it may be true that all tokens of pleasure share this intentional target, this does not establish that they form a single **psychological kind**.
  Belief and hope can both be directed at the same proposition (e.g., "it will rain"), sharing a content and perhaps a broad formal object (truth/possibility), yet they are distinct psychological kinds with different conditions of satisfaction and phenomenological profiles. Similarly, showing that amusement and relief are both directed at "the good" explains their rational intelligibility, but not their metaphysical unity. For a theory of well-being, it is not enough to say these states target the same value; one must explain why this specific cluster of attitudes constitutes *pleasure* rather than *desire* or *approval*. If the only unity is the formal object, the Attitudinal Theory collapses into a version of Desire Satisfactionism, forfeiting its claim to be a distinct account of *pleasure*.

  **2. The Appeal to Functional Role**
  Alternatively, one might unify the attitudes by their **functional role**: perhaps all instances of *taking pleasure in* cause a desire for the experience to continue, or produce smiling behavior. This strategy also fails. First, the behavioral outputs are heterogeneous (laughter vs. sighing vs. stillness). Second, the causal powers are not unique to pleasure. Relief causes a desire for continuation; so does moral satisfaction; so does obsessive compulsion.
  If the functional role is defined broadly enough to encompass all instances of pleasure, it becomes too vague to distinguish pleasure from other pro-attitudes. If it is defined narrowly, it excludes legitimate cases of pleasure (e.g., masochistic pleasure or tragic enjoyment where one does not desire continuation). Thus, functionalism either fails to unify the states or unifies them at the cost of distinctness.

  **3. The Reintroduction of Felt Quality**
  Finally, an Attitudinalist might retreat to the claim that there *is*, after all, a subtle, generic felt quality associated with the attitude of *taking pleasure in*, even if it is not a sensory quality like a taste or touch. This is the most damaging concession. The primary advantage of the Attitudinal Theory over the Sensory Theory was its ability to bypass the phenomenological search for a common "pleasure sensation." By admitting that the attitude itself carries a distinctive phenomenology necessary to unify it, the Attitudinalist silently reintroduces the Sensory Theory. They are no longer arguing that pleasure is an attitude; they are arguing that pleasure is an attitude *accompanied by a specific feeling*. This forfeits the advantage of the attitudinal move entirely, leaving the theory vulnerable to the original heterogeneity objection: if the feeling is too subtle to be noticed (as the Attitudinalist usually claims to avoid the heterogeneity problem), it cannot do the explanatory work required; if it is noticeable, the heterogeneity problem resurfaces.

  ### Formal Object vs. Psychological Kind

  The crux of the relocation objection lies in distinguishing two claims that Attitudinalists often conflate:
  1.  **Claim A:** All tokens of the attitude share a single **formal object** (they are all about "the good").
  2.  **Claim B:** All tokens of the attitude form a single **psychological kind** (they are intrinsically the same type of mental state).

  The Attitudinal Theory requires Claim B to succeed as a theory of *pleasure*. If pleasure is merely a label for any pro-attitude toward the good (Claim A), then "pleasure" is not a natural kind but a functional classification, and the theory loses its explanatory power regarding well-being. Why does *this* classification of attitudes constitute well-being rather than another?
  The relocation objection demonstrates that while Claim A might be defensible, Claim B is not. The psychological realizers of "taking pleasure in" are as heterogeneous as the sensory realizers of "feeling pleasure." By relying on Claim A to support Claim B, the Attitudinalist commits a category mistake. Unification via intentionality (object) does not entail unification via ontology (kind).

  ### Conclusion: The Strength of the Objection

  How strong a conclusion does this relocation objection establish? It does not prove that the Attitudinal Theory is *false*, nor does it prove that hedonism is untenable. One could consistently hold that well-being consists in a disjunctive set of attitudinal states.

  Rather, the objection establishes a **metaphysical stalemate**. It proves that the Attitudinal Theory offers no *progress* over the Sensory Theory regarding the unity of pleasure. The Sensory Theory failed because it could not identify a common phenomenological denominator. The Attitudinal Theory fails for the exact same reason, merely one level up: it cannot identify a common psychological denominator.
  Therefore, the conclusion is that the move from Sensory to Attitudinal theory is theoretically costless but also theoretically fruitless regarding the heterogeneity problem. It solves the problem only by renaming it. If the heterogeneity of pleasant experiences was a fatal blow to the idea that pleasure is a unitary constituent of well-being under the Sensory view, it remains an equally fatal blow under the Attitudinal view. The Attitudinalist has not found a unity that the Sensory theorist missed; they have simply shifted the locus of disunity from the *what* of experience to the *how* of engagement, leaving the fundamental metaphysical problem of pleasure's unity entirely unresolved.
