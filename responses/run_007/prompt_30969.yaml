answer: |-
  This is a sharp formulation. It captures the "Causal Exclusion" worry that haunts non-reductive physicalism. You are right to feel stuck: the argument is **valid**. If you accept the premises, the conclusion follows.

  To hold onto what you want (that self-citing explanations are true, not fictions), you must reject **Premise 2**.

  > **2. An abstraction like a center of gravity does no causing: the mass distribution does the causal work, and the center of gravity merely summarizes that distribution.**

  Here is the diagnosis, the fix, and the cost.

  ### 1. The Diagnosis: Microphysical Chauvinism
  Premise 2 relies on a specific, contested theory of causation: **Causal Fundamentalism**. This is the view that "real" causation only happens at the bottom level of physics (particles, fields, etc.) and that higher-level descriptions are merely epistemic shortcuts for us limited humans.

  Under this view, if you say "The software crashed the computer," you are speaking loosely. Really, *electrons* crashed the computer. The "software" is just a story we tell about the electrons.

  This premise smuggles in the idea that causation is a conserved quantity like energy, such that if the micro-level does the causing, the macro-level *cannot* also be causing. This is the **Causal Exclusion Principle**.

  ### 2. The Fix: Interventionist Causation
  You reject Premise 2 by adopting an **Interventionist** or **Counterfactual** account of causation (associated with philosophers like James Woodward or Judea Pearl, and popular in rationalist circles).

  On this view, $X$ causes $Y$ if manipulating $X$ (while holding other relevant factors fixed) changes the probability or value of $Y$.

  *   **Does the Center of Gravity cause?** You are right to be skeptical here. Moving the mathematical point of the CoG doesn't move the rock. The CoG is a *passive* abstraction.
  *   **Does the Self cause?** The Self (as a narrative center/control structure) is not like a CoG; it is like a **software variable**. If you change the value of a variable in a program (an abstraction over voltage states), the output changes. The abstraction is *causally efficacious* because the system is organized to respect the abstraction.

  When you say, "I raised my hand because I decided to," you are making a high-level causal claim. Is it true? Yes, because if the decision process (the abstraction) had been different, the hand would not have raised. The fact that the decision is implemented by neurons does not drain the causal power from the decision, any more than the fact that software is implemented by electrons drains causal power from the code.

  By rejecting Premise 2, you block the inference to Premise 3 ("The self does no causing"). If abstractions *can* cause (in the interventionist sense), the self can cause. If the self causes, Premise 4's antecedent is false, and you are free to say self-citing explanations are true.

  ### 3. The Cost: What You Lose
  Rejecting Premise 2 is not free. Here is the bill:

  1.  **You lose the "One True Causal Order."** You must accept **Causal Pluralism**. There is no single ledger of causation where microphysics is the only currency. Causation is relative to the level of abstraction and the set of variables you are modeling. This feels unsettling if you crave a "God's eye view" of reality where only the bottom layer is real.
  2.  **You must accept that "Real" does not mean "Fundamental."** A software bug is real. A belief is real. A self is real. But they are not *fundamental*. They are **Real Patterns** (to use Dennett's term). They exist objectively, but their existence depends on the structure of the system, not on a specific substance.
  3.  **You concede that the Self is not a "Thing."** You still cannot have the self be a "concrete item in the causal order" (a soul, a homunculus, a specific neuron cluster). It remains an abstraction. You are saving the *causal efficacy* of the self, but not its *substantiality*.

  ### 4. Why Premise 5 is a Red Herring
  Premise 5 says: *"The same reasoning applies to every other abstraction... corporations, markets, software..."*

  Your friend intends this as a *reductio ad absurdum* ("Look, now you have to say corporations aren't real!").
  Dennett (and you, if you reject P2) should embrace this as a **feature, not a bug**.

  Corporations *are* abstractions. Markets *are* abstractions. But they are causally efficacious abstractions. If you dissolve a corporation, people stop showing up to the building. If you change interest rates (an abstract number), inflation (a macro pattern) changes.

  The argument tries to force a dilemma: **Concrete Substance** vs. **Useless Fiction**.
  The exit is the middle ground: **Causally Efficacious Pattern**.

  ### 5. Is the Task Badly Posed?
  Yes, slightly. The argument conflates two different roles the "Self" plays in Dennett's philosophy:
  1.  **The Locus of Narrative Unity (CoNG):** This ties your experiences together into a story. This is indeed passive, like a Center of Gravity.
  2.  **The Locus of Control (The Agent):** This is the system that processes information and actuates outputs. This is active, like a Virtual Machine.

  The argument attacks the Self as a *Narrative Center* (Premise 1) but demands causal power appropriate for an *Agent* (Premise 4).
  *   **Resolution:** The Narrative Center doesn't cause anything directly. But the *Agent* (which is also an abstraction over distributed processes) does. When you say "I decided," you are citing the Agent. The fact that the Agent and the Narrative Center are closely linked allows you to use "I" for both.

  ### Summary Recommendation
  **Reject Premise 2.**

  *   **Reading:** Causation is about counterfactual dependence and control, not just physical pushing. High-level abstractions (software, selves) support counterfactuals and are sites of control. Therefore, they "do causing."
  *   **Cost:** You must abandon the intuition that only microphysical events are "really" happening. You must accept that reality is layered, and higher layers are objectively real despite being ontologically dependent on lower layers.
  *   **Gain:** You keep self-citing explanations as true (satisfying your constraint on 4) without needing to posit a magical soul-substance (satisfying Dennett's physicalism).

  The argument fails because it assumes that to be real, a thing must be a **brick**. Dennett (and you) should argue that to be real, a thing must be a **pattern**. Bricks cause things by hitting; patterns cause things by constraining. The self constrains the body. That is enough for responsibility.
