answer: |-
  You are right to feel troubled. The argument your friend presented is a robust reconstruction of what is known in contemporary philosophy of mind as **Jaegwon Kim's Causal Exclusion Argument**. It is widely regarded as one of the most significant challenges to non-reductive physicalism.

  Your friend is correct that the argument is logically valid. If you accept all the premises, the conclusion follows inescapably. Therefore, the diagnosis must focus on **soundness**. We must identify which premise is false or misleading.

  While there are philosophers who defend every option in your friend's trilemma (epiphenomenalism, reductionism, or denying closure), the consensus among those wishing to save non-reductive physicalism is that the flaw lies in **Premise (3)** and the supporting **Premise (4)**. Specifically, the argument relies on a specific, and arguably mistaken, conception of how causation works and how mental and physical events relate to one another.

  Here is a careful diagnosis of where the argument goes wrong, focusing on your specific interest in the notion of 'sufficient cause' and the possibility of rejecting (3) without reductionism.

  ### 1. The Problem with the 'Competition Model' of Causation

  Premise (3) states: *If a mental event M causes a physical event P, and P also has a sufficient physical cause P*, then P is causally overdetermined — unless M just is P*.*

  This premise assumes a **competition model** of causation. It imagines causation as a kind of conserved quantity, like energy, where if P* has done all the 'work' to bring about P, there is no 'work' left for M to do. It treats M and P* as if they were two distinct billiard balls striking a third.

  However, most non-reductive physicalists argue that M and P* are not independent competitors. M (the mental state) is **realised by** P* (the neural state). They are not two separate events happening side-by-side; rather, M is the higher-level description of the very same occurrence that P* describes at the lower level.

  If M and P* are related by realisation (or supervenience), the exclusion principle in (3) does not apply in the standard way. To use a classic analogy: if a peg fits into a hole because it is square, and also because it is made of wood, these are not competing causes. The peg's squareness is realised by its molecular structure. It would be absurd to say the molecular structure does all the causing, leaving the squareness causally inert. The squareness causes the fitting *in virtue of* the molecular structure.

  Therefore, you can reject (3) by arguing that **causation is not exclusive** when the putative causes are metaphysically related (as mental and physical states are under physicalism). The physical cause P* does not *exclude* the mental cause M; rather, P* enables M to cause P.

  ### 2. The Ambiguity of 'Sufficient Cause'

  You asked whether the notion of 'sufficient cause' in (2) and (3) is doing more work than it appears. It is.

  In Premise (2), 'causal closure' relies on the idea that every physical event has a sufficient *physical* cause. In physics, 'sufficiency' usually refers to nomological sufficiency (given the laws of nature, the prior physical state guarantees the subsequent one).

  However, in Premise (3), 'sufficient cause' is treated as **causally sufficient to the exclusion of other causes**. This is a slide in meaning. Just because a neural state P* is nomologically sufficient for an arm rising P, it does not follow that P* is the *only* description under which the cause is relevant.

  Consider a computer. The movement of electrons (physical) is sufficient for the screen to light up. But we also say the software command (computational/functional) caused the screen to light up. The electron flow is sufficient, but it is not *explanatorily exclusive*. The software level captures a pattern of causation that the electron level obscures.

  If you define 'cause' strictly as 'the bottom-level physical push', then yes, the mental is excluded. But if you define 'cause' in terms of **counterfactual dependence** or **explanatory relevance**, the mental state retains its causal status. If you had not had the belief (M), you would not have had the neural state (P*), and thus not the action (P). The mental state is causally relevant because the physical cause depends on it (via supervenience).

  ### 3. How to Reject (3) Without Reductionism

  Your friend claims that to reject (3) without accepting overdetermination, you must identify M with P* (reductionism). This is the crux of the dispute. There is a middle path: **The Determinable/Determinate Relation.**

  Many philosophers (such as Eric Funkhouser and Sydney Shoemaker) suggest that mental properties are **determinables** of physical **determinates**.
  *   **Determinable:** Being red.
  *   **Determinate:** Being scarlet.

  If a scarlet ball causes a dog to bark, did 'being red' cause it, or did 'being scarlet' cause it? Both. They are not two competing causes. 'Being scarlet' is just a specific way of 'being red'.

  Similarly, a specific neural firing pattern (P*) is a determinate way of realising a belief (M). The belief causes the action. The neural state causes the action. They are not identical (because the belief could be realised by a different neural state in a different creature, preserving multiple realisability), but they are not competitors either. This allows you to deny (3) without collapsing into type-identity reductionism. You maintain that M is distinct from P* (preserving non-reductive physicalism) but deny that they compete for causal influence.

  ### 4. Alternative Conceptions of Causation

  Another powerful way to resist the argument is to adopt an **interventionist account of causation** (championed by James Woodward).

  On this view, X causes Y if, were we to intervene to change X (while holding other relevant factors fixed), Y would change.
  *   If we intervene on the mental state (change the belief), the action changes.
  *   If we intervene on the physical state (change the neurons), the action changes.

  Crucially, interventionism does not require us to trace a physical energy transfer. It requires us to identify stable counterfactual dependencies. Since mental states provide a stable framework for predicting and manipulating behaviour (often better than the chaotic detail of neural states), they qualify as causes. This renders Premise (3) false because the exclusion principle simply does not hold for variables at different levels of abstraction that track different counterfactual dependencies.

  ### 5. Which Bullet to Bite?

  If we assess the costs of abandoning the premises:

  1.  **Abandon Causal Closure (Premise 2):** This is the most expensive option. It implies that physics is incomplete and that mental forces can alter physical trajectories in ways physics cannot predict. This violates conservation laws and isolates the mind from the scientific image of the world.
  2.  **Accept Epiphenomenalism (Conclusion 7):** This is intellectually honest but deeply counter-intuitive. It makes the evolution of consciousness a mystery (why would we have beliefs if they do nothing?) and undermines the justification for our own beliefs (if my belief that 'logic is valid' causes nothing, why trust it?).
  3.  **Accept Reductionism (Premise 6/8):** This saves causation but sacrifices multiple realisability and makes cross-species psychology difficult. It also struggles with the 'hard problem' of why these physical states feel like something.
  4.  **Reject the Exclusion Principle (Premise 3):** This is the **least costly** option for a non-reductive physicalist. It requires adopting a more sophisticated metaphysics of causation (realisation, determinables, or interventionism) but allows you to keep the scientific worldview (closure), the autonomy of psychology (non-reductionism), and the efficacy of thought (anti-epiphenomenalism).

  ### Conclusion

  Your friend's argument is valid, but it is not sound. The flaw lies in **Premise (3)**.

  The argument assumes that for M to cause P, it must do so in competition with P*. But if M is realised by P*, or if M is a determinable of P*, they do not compete. The physical state P* causes P *by* realising the mental state M which causes P.

  By rejecting the competition model of causation, you can maintain that:
  1.  The physical domain is closed (physics is complete).
  2.  Mental states are not identical to physical states (multiple realisability holds).
  3.  Mental states are genuinely causal (they are not epiphenomenal).

  The cost of this move is that one must abandon the intuitive, 'billiard-ball' picture of causation in favour of a layered or counterfactual account. However, given that the 'billiard-ball' model struggles to account for causation in biology, economics, and computing anyway, this is a price well worth paying. You need not accept that your thoughts are idle; you need only accept that they do not work by pushing atoms around directly, but by organising them into patterns that have physical effects.
