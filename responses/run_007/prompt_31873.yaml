answer: |-
  ### Requirements Document: Ontology of Virtual Objects and Harms

  **Purpose:** Define criteria for a philosophical theory to adjudicate the reality of virtual objects and harms without contradicting technical implementation or lived experience.

  | ID | Requirement | Case / Consideration | Priority | Conflict Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Identity Persistence** | Must explain how Item A differs from Item B when bits are identical (duplication bug). Must distinguish "unique" from "copy." | **NN** | Conflicts with strict technical reductionism. |
  | **R2** | **Normative Distinction** | Must distinguish theft (scam) from mechanic (PvP loot) and enforcement (dev deletion). "I lost my sword" vs. "I was defeated." | **NN** | Conflicts with ToS absolutism (all are license violations). |
  | **R3** | **Existence Conditions** | Must define when an object ceases to exist. Server shutdown (collective loss) vs. single item deletion (targeted harm). | **NN** | Conflicts with "service continuity" models. |
  | **R4** | **Value Grounding** | Must account for value sources: labor (400 hrs), capital (RMT), or utility (stats). Must explain why cosmetics (no stats) hold value. | **P** | Labor vs. Capital debates often diverge here. |
  | **R5** | **Agency Attribution** | Must distinguish player agency (theft) from platform agency (shutdown). Harm requires a moral agent, not just code execution. | **NN** | Conflicts with "code is law" automaton views. |
  | **R6** | **Legal/Moral Interface** | Must address the ToS disclaimer ("you own nothing") vs. moral intuition ("you were wronged"). | **P** | **Critical Tension:** Hard to satisfy both Legal Formalism and Moral Realism. |
  | **R7** | **Deprivation vs. Copy** | Must explain why duplication harms the original owner if they still possess the item (inflation of uniqueness/status). | **NN** | Conflicts with material scarcity models. |

  #### Incompatible Pairs
  1.  **Technical Reductionism vs. Phenomenological Reality:** A theory cannot simultaneously claim objects are *only* database rows (R1) and that their loss is *ontologically equivalent* to physical theft (R2). If the object is just state, reverting state fixes the harm perfectly; experience suggests trauma persists.
  2.  **ToS Absolutism vs. Moral Intuition:** A theory cannot fully satisfy the legal reality (R6: players license access) while validating the user's feeling of ownership (R2: "my possession"). If the ToS is supreme, dev deletion is never harm, only service adjustment. Most theories must privilege one over the other.

  #### The Key Driver: Requirement R4 (Value Grounding)
  The single requirement that does the most work in separating existing positions is **R4 (Value Grounding)**.

  How a theory answers "Why does this item have value?" dictates its verdict on every other case.
  *   **Lockean Labor Theories:** If value comes from effort (400 hours), then scams are theft, but cash-shop items are less "real." Dev deletion is destruction of property.
  *   **Social Constructivist Theories:** If value comes from consensus (we agree this sword is rare), then duplication is the primary harm (destroying scarcity), regardless of labor. Shutdowns are cultural erasure.
  *   **Legal Formalist Theories:** If value comes from contract (ToS), then nothing is owned; harms are merely breach of service expectations.
  *   **Causal Power Theories:** If value comes from gameplay effect (stats), cosmetics are illusory, and RMT is irrelevant.

  Choosing the grounding mechanism forces the theory to collapse certain distinctions (e.g., labor vs. purchase) while preserving others (e.g., scarcity vs. abundance). It determines whether the "harm" is located in the code, the wallet, the community, or the self.

  #### Implementation Note
  An adequate theory must function like a distributed system: it cannot rely on a single source of truth (e.g., only the server state or only the user feeling). It must handle consistency models where the server says "deleted," the law says "licensed," and the user says "stolen," without throwing an exception. If the theory crashes when faced with a server shutdown, it is production-ready for neither ethics nor engineering.
