answer: |-
  Here is a principle that captures the nuances in your cases, explains the distinction between the cheater and the ex-smoker/vegan, and tests the limits of your intuitions.

  ### The Principle: **Credible Commitment via Conduct**

  > **You lack standing to blame someone for violating a norm if your own *conduct* regarding that norm demonstrates a lack of genuine commitment to it, unless you have credibly repented and reformed.**

  This principle relies on three specific distinctions to handle your cases:

  1.  **Conduct vs. Disposition:** Standing is lost through *actions* (violations), not merely thoughts or dispositions.
  2.  **Current vs. Reformed Status:** A past violation only undermines standing if it remains "active" (i.e., unrepented or ongoing). Reform "closes the file" on the past violation.
  3.  **Standing vs. Appropriateness:** Standing is a binary moral status (you have it or you don't); it does not fluctuate based on audience. Audience affects *wisdom* or *proportionality*, not standing.

  ---

  ### How It Handles Your Cases

  **The Cheater vs. The Ex-Smoker/Vegan (Cases 1, 2, 7)**
  This is the core of your puzzle. Why does Alex (Case 1) lack standing while your sister (Case 2) and the vegan (Case 7) have it?
  *   **Alex:** His conduct is either *ongoing* ("cheated for years," no mention of stopping) or *unrepented*. His blame implies, "I hold you to a standard I do not hold myself to." This is hypocritical and undermines his commitment to the norm of fidelity.
  *   **Sister/Vegan:** Their past violations are *reformed*. By quitting smoking or going vegan, they have aligned their conduct with the norm. Their blame is not hypocritical; it is *testimonial*. They are effectively saying, "I broke this norm, it was wrong, and you shouldn't do it either." Their past error actually *strengthens* their credibility because they speak from experience about the difficulty of the norm.

  **The Politician & The Boss (Cases 3, 5)**
  *   **Politician:** Lacks standing. The scale of the wrong (war vs. drone) doesn't matter as much as the *unrepented violation*. He is authorizing killing while condemning killing. His conduct shows he doesn't truly hold the norm "killing is wrong" as binding on himself.
  *   **Boss:** Lacks standing. Even though one act is private and one is public, the relevant norm is "treat subordinates with dignity/respect." The boss violates this norm regularly. The domain (private/public) is less important than the underlying value (abuse of power).

  **The Would-Be Thief (Case 4)**
  *   **Verdict:** **Has Standing.**
  *   **Why:** The principle specifies *conduct*. Knowing you *would* steal if desperate is a disposition, not a violation. You haven't actually subordinated the norm to your desires yet. Until you act, your commitment to the norm remains intact in the public sphere.

  **The Drunk Driver (Case 6)**
  *   **Verdict:** **Has Standing (in both contexts).**
  *   **Why:** He reformed (20 years, ashamed). His conduct now aligns with the norm. Therefore, he has standing.
  *   **The Catch:** This is where I need you to adjust your intuition. You felt he has standing privately but not on Facebook. The principle argues that **standing is binary**. If he has the moral authority to make the judgment, he has it regardless of the audience. Posting on Facebook might be *unwise*, *uncharitable*, or *disproportionate*, but it is not a lack of *standing*. Confusing standing with appropriateness is a common error.

  ---

  ### The Verdict You Must Abandon

  Based on **Credible Commitment via Conduct**, you need to adjust your view on **Case 6 (The Drunk Driver)**.

  You wrote: *"I think my friend has standing to make that judgment, at least to me. But if he posted about it on Facebook I'd feel differently."*

  **The Correction:** Your friend has standing in *both* instances (because he reformed), or *neither* (if you think 20 years isn't enough reform, which seems unlikely). Standing is about the *right* to hold someone accountable, not the *prudence* of how you do it.
  *   If he has standing, he can blame publicly (though it might be annoying).
  *   If he lacks standing, he shouldn't blame you privately either.
  *   **Why this matters:** If standing fluctuates by audience, it's not really "standing"—it's just social tact. By separating the two, you clarify that the friend's *moral status* is clean, even if his *social media strategy* is bad.

  *(Note: If you are stubborn about Case 6, the alternative is to abandon Case 4. A stricter version of this principle argues that "knowing you would steal" reveals a lack of genuine commitment to property rights, rendering your blame hypocritical even without action. But the Conduct view is more standard.)*

  ---

  ### The Test Case: **The "Emergency" Litterer**

  Here is a new case to test the principle:

  > **Case 8:** A man drops a candy wrapper on the ground because he was rushing to help someone who had fallen. He feels bad about it but doesn't go back. Later, he sees a teenager drop a soda can on a clean sidewalk and scolds him for littering.

  **Apply the Principle:**
  1.  **Conduct:** He did litter (violation occurred).
  2.  **Reform/Repentance:** He "feels bad" but didn't rectify it (didn't pick it up). Is this reform?
  3.  **Relevance:** The norm is "keep public spaces clean."

  **The Verdict:**
  According to **Credible Commitment**, he likely **lacks standing**, or at least has *diminished* standing.
  *   Unlike the ex-smoker (Case 2), he hasn't *reformed* the specific instance; he let the violation stand.
  *   Unlike the vegan (Case 7), he hasn't adopted a lifestyle change that negates the past.
  *   However, the *reason* for the violation matters. If the norm is "Don't litter *unless* there is an emergency," he didn't violate the *true* norm. If the norm is "Never litter," he did.

  **Why this tests the principle:**
