prompt: |-
  I've followed the LessWrong and alignment discussions of Goodhart's law and specification gaming for years, and I keep running into a translation problem: I understand the examples, but I don't have a usable procedure for deciding when a given metric is safe to adopt or keep as a target. I manage a team at a large online marketplace, and every quarter we set targets for things like seller response time, customer satisfaction scores, and content quality; typically we discover only after the fact that a metric has been gamed into meaninglessness. Please write a decision procedure we can run, in under an hour per metric, without the operator knowing the underlying theory, and with final sign-off by our head of analytics rather than the team that owns the metric. It should specify the questions to ask in order, what counts as a sufficient answer at each step, where the procedure returns "do not target this metric" versus "acceptable with monitoring," and where it must escalate to a human judgment call rather than pretending the checklist decides. Ground the steps in what is actually known about Goodhart-style failure and specification gaming, but keep the theory in the rationale and put the usable steps up front. Then apply the procedure to three cases: a seller response-time metric we are considering tying to search ranking; an established customer satisfaction score that already determines bonuses; and a newly proposed AI-generated content quality metric for an internal tool. Include at least one case where the procedure gives an answer my team will not like, and close with a short account of the failure modes the procedure cannot catch.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Manager at a large online marketplace.
      *   **Problem:** Understands Goodhart's Law/Specification Gaming conceptually but lacks a *usable procedure* to prevent metric gaming *before* implementation.
      *   **Constraints:**
          *   Must be runnable in under an hour per metric.
          *   Operator (person running the check) should *not* need to know the underlying theory (keep it practical).
          *   Final sign-off by Head of Analytics (independent of the team owning the metric).
          *   Must specify questions, sufficient answers, decision points (Stop/Go/Escalate).
          *   Grounded in Goodhart/Specification Gaming literature (but theory in rationale, steps up front).
          *   Apply to three specific cases (Seller Response Time, CSAT Bonuses, AI Content Quality).
          *   Include at least one "unpopular" answer (procedure says "no" or "escalate" when the team wants "go").
          *   Close with limitations (failure modes the procedure can't catch).

  2.  **Deconstruct Goodhart's Law & Specification Gaming:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure."
      *   *Types of Goodhart:*
          *   *Regressional:* The measure is noisy; picking the extreme picks the noise.
          *   *Causal:* The measure doesn't cause the goal; manipulating the measure doesn't move the goal.
          *   *Extremal:* The relationship holds in normal ranges but breaks at extremes.
          *   *Adversarial (Gaming):* Agents actively manipulate the measure to look good without achieving the goal.
      *   *Specification Gaming:* Finding loopholes in the reward function to maximize reward without satisfying the intent.
      *   *Key Mitigation Strategies:*
          *   Proxy vs. Goal distinction.
          *   Incentive intensity (high stakes = high gaming).
          *   Observability/Verifiability (can we see the gaming?).
          *   Multi-metric balance (cannot optimize one thing in isolation).
          *   Human-in-the-loop/Qualitative checks.

  3.  **Drafting the Procedure (The "Metric Safety Check"):**
      *   *Goal:* A checklist that forces the user to think about the *gap* between the metric and the actual goal.
      *   *Structure:*
          1.  Define Goal vs. Metric.
          2.  Assess Incentive Strength.
          3.  Identify Loopholes (Adversarial).
          4.  Check for Noise/Extremes.
          5.  Monitoring Plan.
          6.  Decision Matrix.
      *   *Constraint Check:* Needs to be under an hour. Needs to be theory-light for the operator. Needs independent sign-off.
      *   *Refinement:* Let's make it a form with specific "Pass/Fail/Escalate" criteria.

      *   *Step 1: The Gap Test.* (Goal vs. Metric). If they are too far apart, stop.
      *   *Step 2: The Stakes Test.* (Incentive Intensity). High stakes + easy to game = danger.
      *   *Step 3: The Loophole Brainstorm.* (Adversarial). Can you list 3 ways to cheat? If yes, can you detect them?
      *   *Step 4: The Control Test.* (Verification). Is there an orthogonal measure?
      *   *Step 5: The Sunset Clause.* (Extremal). When do we stop using it?

      *   *Sign-off:* Head of Analytics looks at the completed form. They don't run the test, they audit the answers.

  4.  **Developing the Rationale (The "Why"):**
      *   Keep this separate from the steps. Explain *why* Step 1 matters (Causal Goodhart), *why* Step 2 matters (Adversarial Goodhart), etc.

  5.  **Applying to Cases:**
      *   *Case 1: Seller Response Time (Search Ranking).*
          *   *Goal:* Better buyer experience.
          *   *Metric:* Time to first reply.
          *   *Risk:* Sellers send "Got it" instantly.
          *   *Verdict:* Likely "Acceptable with Monitoring" *if* paired with resolution rate. If used alone for ranking? Probably "Do Not Target." Let's make it the "unpopular" one. Let's say the team wants to weight it heavily. The procedure should flag this.
      *   *Case 2: CSAT Bonuses (Established).*
          *   *Goal:* Happy customers.
          *   *Metric:* Post-interaction survey score.
          *   *Risk:* Agents beg for 5s, filter unhappy customers.
          *   *Verdict:* It's already live. The procedure might suggest "Escalate/Review" because high stakes (bonuses) + single metric is dangerous. Or "Acceptable with Monitoring" if they have fraud detection. Let's make this one "Acceptable with Monitoring" but highlight the risks.
      *   *Case 3: AI Content Quality (Internal Tool).*
          *   *Goal:* Useful internal docs.
          *   *Metric:* AI classifier score of "quality."
          *   *Risk:* Writing for the AI, not humans.
          *   *Verdict:* "Do Not Target." This is classic specification gaming. The metric *is* the AI's output.

      *   *Selection for "Unpopular Answer":* Case 1 is usually the most contentious for marketplace ops. They *want* to punish slow sellers. The procedure should say "Don't tie directly to search ranking without a secondary quality check." Or Case 3 (AI Quality) is a hard "No" which engineers might hate. Let's go with Case 1 being the "No/escalate" because it impacts revenue directly, making it a painful but necessary stop. Actually, Case 3 is a clearer example of specification gaming. Let's make Case 1 the "Acceptable with heavy monitoring" and Case 3 the "Do Not Target" (which the AI team won't like). Wait, the prompt asks for *one* case where the team won't like the answer. Let's make Case 1 (Response Time) the one where the procedure says "Do Not Target as a *direct* ranking factor" because it's too easily gamed with low-effort messages. That hits revenue, so they won't like it.

  6.  **Refining the Procedure for "Under 1 Hour":**
      *   Needs to be tight. 5 steps max.
      *   Needs clear "Stop" conditions.
      *   Needs the Head of Analytics to have veto power based on the answers.

  7.  **Drafting the Content:**
      *   *Title:* Metric Safety Protocol (MSP-1).
      *   *Introduction:* Context setting.
      *   *The Procedure:* Step-by-step questions.
      *   *The Rationale:* Hidden theory.
      *   *The Cases:* Applied examples.
      *   *Limitations:* What this misses (e.g., cultural shifts, external shocks).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too theoretical?
      *   *Fix:* Use plain language. Instead of "Causal Goodhart," use "Does doing X actually cause Y?"
      *   *Critique:* Is the sign-off clear?
      *   *Fix:* Explicitly state the Head of Analytics reviews the *answers*, not just the result.
      *   *Critique:* Did I include the failure modes?
      *   *Fix:* Ensure the final section covers "Unknown Unknowns" and "Cultural Drift."

  9.  **Final Polish:**
      *   Ensure tone is professional, directive, and actionable.
      *   Check against the "under an hour" constraint (word count and complexity of questions).
      *   Verify the "unpopular answer" is distinct.

      *(Self-Correction on Case 1)*: If I say "Do Not Target" for response time, that might be too extreme for a marketplace. Sellers *should* respond. The gaming is sending "Hi" instantly. The fix is usually a composite metric. I will structure the procedure to flag *single* metrics with high stakes. So the verdict for Case 1 will be "Do Not Target *in isolation*." The team wants to use it as a primary ranking signal. The procedure says "No, not without a companion metric." That's the friction point.

      *(Self-Correction on Case 3)*: AI Content Quality. If the metric is "AI Score," and the goal is "Human Readability," this is a proxy problem. The procedure should catch this.

      *(Refining the "Operator doesn't know theory" constraint)*: The checklist must not ask "Is this Regressional Goodhart?" It must ask "If everyone hits 100% on this, does that mean we succeeded?"

  10. **Finalizing the Output Structure:**
      *   Protocol Name: Metric Safety Protocol (MSP-1).
      *   Section 1: The Procedure (The Checklist).
      *   Section 2: Rationale (For the Head of Analytics).
      *   Section 3: Case Studies.
      *   Section 4: Limitations.

      *Let's write it.*
answer: |-
  # Metric Safety Protocol (MSP-1)

  **Purpose:** To prevent metric gaming and unintended consequences before a metric is adopted as a target.
  **Time Required:** 45–60 minutes.
  **Operator:** Metric Owner (Product Manager, Ops Lead, etc.).
  **Approver:** Head of Analytics (Independent sign-off required).
  **Theory:** None required for Operator. Theory is embedded in the questions.

  ---

  ## Part 1: The Procedure (Operator Checklist)

  *Instructions: Answer the following five sections. Be specific. Vague answers (e.g., "We will monitor it") are insufficient. If any section triggers a **STOP**, do not proceed to the next section. Submit the completed form to the Head of Analytics.*

  ### Step 1: The Goal-Metric Gap
  1.  **State the actual business goal** in one sentence (e.g., "Customers resolve issues quickly," not "Lower response time").
  2.  **State the proposed metric** (e.g., "Average minutes to first reply").
  3.  **Question:** If every employee/seller hit the target perfectly for this metric, would the business goal automatically be achieved?
      *   *Yes:* Proceed to Step 2.
      *   *No:* **STOP.** You must define a secondary metric that captures the missing piece before proceeding. (Example: If metric is "Speed," missing piece is "Resolution Quality").

  ### Step 2: The Stakes Test
  1.  **Question:** What happens if the target is missed? (Select one)
      *   A) Low visibility reporting only.
      *   B) Performance review input.
      *   C) Direct financial bonus/penalty or Search Ranking algorithm input.
  2.  **Question:** How easy is it to manipulate the number *without* doing the work? (Scale 1–5, where 5 is "I can think of a way right now").
      *   *If 1 or 2:* Proceed to Step 3.
      *   *If 3, 4, or 5:* **ESCALATE.** You must propose a specific detection method for this manipulation before proceeding.

  ### Step 3: The Loophole Brainstorm
  1.  **Task:** List three specific ways a rational actor could maximize this metric while making the customer experience *worse*.
      *   *Example:* "Send an auto-reply immediately to lower response time, then ignore the ticket."
  2.  **Question:** For each of the three ways listed, is there an existing data signal that would catch this behavior?
      *   *Yes, for all three:* Proceed to Step 4.
      *   *No, for one or more:* **STOP.** You cannot target this metric until you have a way to detect these specific behaviors.

  ### Step 4: The Extremes Check
  1.  **Question:** Look at the top 1% of performers on this metric today. Do they look like your ideal employees/sellers, or do they look like outliers doing something strange?
      *   *Ideal:* Proceed to Step 5.
      *   *Outliers/Strange:* **STOP.** The metric breaks at high performance. Redefine the target range.

  ### Step 5: The Sunset Clause
  1.  **Question:** Define the specific condition under which we will retire or re-evaluate this metric. (e.g., "If the correlation with [Goal Proxy] drops below 0.5," or "Re-evaluate in 2 quarters").
      *   *Specific condition defined:* **READY FOR APPROVAL.**
      *   *Vague condition:* **STOP.** Define a concrete trigger.

  ---

  ## Part 2: Rationale (For Head of Analytics Only)

  *Do not share this section with the Operator. This explains the theoretical underpinnings so you can audit their answers.*

  *   **Step 1 (Causal Goodhart):** Tests if the metric is a valid proxy. If optimizing the metric doesn't cause the goal, you are optimizing noise.
  *   **Step 2 (Adversarial Goodhart):** High stakes + High manipulability = Guaranteed gaming. This forces the operator to acknowledge the incentive intensity.
  *   **Step 3 (Specification Gaming):** Forces the operator to simulate the adversary. If they cannot list loopholes, they haven't thought hard enough. If they list them but can't detect them, the risk is unmanaged.
  *   **Step 4 (Extremal Goodhart):** Relationships often break at the tails. Top performers on a gamed metric often look different from top performers on the actual goal.
  *   **Step 5 (Dynamic Stability):** Metrics decay. A sunset clause prevents "zombie metrics" that were once good but are now gamed.

  **Approval Criteria:**
  *   **Green Light:** All steps passed.
  *   **Yellow Light:** Step 2 Escalation resolved with robust detection.
  *   **Red Light:** Any STOP condition remains unresolved. **Veto the metric.**

  ---

  ## Part 3: Case Applications

  ### Case 1: Seller Response Time (Tied to Search Ranking)
  *Context:* Ops team wants to weight "Time to First Reply" heavily in search ranking to improve buyer experience.
  *   **Step 1 (Gap):** Goal = "Buyers feel heard and helped." Metric = "Minutes to first reply."
      *   *Answer:* No. A fast "Hello" does not mean the buyer is helped.
      *   *Action:* **STOP.** Requires secondary metric (e.g., "Resolution Rate" or "Follow-up Count").
  *   **Step 3 (Loopholes):**
      *   1. Send "Got it" bot message instantly. (Detectable? Maybe.)
      *   2. Mark ticket as "Waiting on Buyer" immediately to stop clock. (Detectable? Hard.)
      *   3. Ignore complex tickets to keep average time low. (Detectable? No.)
  *   **Verdict:** **DO NOT TARGET.**
  *   **Why the team won't like it:** The Ops team believes slow sellers hurt the platform. They want this live *now*. The procedure forces them to admit they cannot distinguish between "fast help" and "fast noise" with current data. Tying this directly to search ranking will incentivize spammy bot messages, degrading the marketplace. They must build a "Quality of Response" classifier before this metric is safe to weight heavily.

  ### Case 2: Customer Satisfaction (CSAT) Bonuses (Established)
  *Context:* Support agents receive quarterly bonuses based on average CSAT score (1–5 scale).
  *   **Step 1 (Gap):** Goal = "Happy Customers." Metric = "Survey Score."
      *   *Answer:* Mostly Yes, but noisy.
  *   **Step 2 (Stakes):** Direct financial bonus (High Stakes). Manipulability = 4 (Agents can beg for scores or avoid difficult tickets).
      *   *Action:* **ESCALATE.** Need detection.
  *   **Step 3 (Loopholes):**
      *   1. "Please give me a 5 or I get in trouble." (Detectable via transcript analysis?)
      *   2. Transferring difficult customers to other queues. (Detectable via transfer rate monitoring?)
      *   3. Only closing easy tickets. (Detectable via ticket complexity weighting?)
  *   **Verdict:** **ACCEPTABLE WITH MONITORING.**
  *   **Conditions:** The Head of Analytics approves this *only* because the team committed to Step 5 (Sunset). They must correlate CSAT with "Repeat Contact Rate" quarterly. If CSAT goes up but Repeat Contact goes up, the bonus structure is paused. This acknowledges the metric is already live but imposes a safety valve.

  ### Case 3: AI-Generated Content Quality (Internal Tool)
  *Context:* Engineering proposes using an internal AI classifier score to rate the quality of documentation written by staff using a new AI tool.
  *   **Step 1 (Gap):** Goal = "Useful Documentation for Humans." Metric = "AI Quality Score."
      *   *Answer:* **NO.**
  *   **Step 3 (Loopholes):**
      *   1. Staff write prompts specifically to maximize the classifier score (keyword stuffing).
      *   2. Staff generate verbose, empty text that looks "high quality" to the model.
      *   3. Staff stop writing docs that the AI rates poorly, even if technically necessary.
  *   **Verdict:** **DO NOT TARGET.**
  *   **Rationale:** This is pure specification gaming. The metric is derived from the same class of system (AI) that is generating the content. There is no orthogonal verification. Using this for performance targets will result in documentation that is perfect for the AI classifier and useless for engineers. The Head of Analytics must veto this immediately.

  ---

  ## Part 4: Limitations & Failure Modes

  This procedure is a filter, not a guarantee. It cannot catch the following:

  1.  **Cultural Drift:** The procedure assumes rational actors gaming the system. It does not account for a culture shift where "hitting the number" becomes more virtuous than "doing the job," even without financial incentives.
  2.  **External Shocks:** A metric might be safe until an external event (e.g., a pandemic, a new competitor) changes user behavior, suddenly making a previously safe metric vulnerable to Goodhart effects.
  3.  **The "Measurement Itself" Effect:** Sometimes the act of measuring changes behavior even without targets (Hawthorne Effect). This procedure focuses on *targeting*, not *measuring*.
  4.  **Collusion:** Step 3 assumes individual gaming. It does not detect coordinated collusion where a group of sellers or agents agrees to game the metric in a way that looks like normal variance.
  5.  **Unknown Unknowns:** The Loophole Brainstorm (Step 3) relies on the operator's imagination. If they cannot conceive of a gaming strategy, the procedure will pass a metric that is actually vulnerable. This is why the Head of Analytics must challenge the "Loophole" answers aggressively during sign-off.

  **Final Note:** If a metric feels too good to be true, it is. The goal of MSP-1 is not to find perfect metrics, but to identify which imperfect metrics are safe enough to use temporarily.
