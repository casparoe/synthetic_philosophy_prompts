prompt: |-
  I'm in a political theory seminar and last week we were discussing whether a public official who authorized a drone strike that killed civilians could be morally justified. I argued that even if the overall outcome was good, the official still did something wrong by directly causing those deaths. A classmate shut me down by saying "that's just the problem of dirty hands — in politics you sometimes have to do wrong to do right, end of story." The professor nodded and moved on.

  I've been chewing on this all week. The phrase "dirty hands" seems to be doing an enormous amount of work in that exchange, and I'm not sure my classmate and I even mean the same thing by it. I've since heard it used in three different ways: as a description of political reality (politicians inevitably get their hands dirty), as a moral excuse (they're not blameworthy for it), and as something almost tragic (they are blameworthy but had to do it anyway). I want to go to office hours and push back, but first I need to get clear on what the phrase actually commits someone to.

  Can you lay out the distinct precise claims that "the problem of dirty hands" could be making — from the trivial sociological observation to the most controversial moral thesis — and say for each whether it's plausible, whether it actually gets my classmate his conclusion, and which reading a careful defender of the dirty hands tradition (someone like Walzer) is actually commited to? And please, no formatting — no headings, bullet points, bold text, or tables. Just continuous prose, the way you'd write an email. I want something I can read straight through and then bring to office hours.
