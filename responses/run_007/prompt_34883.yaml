      *   *Self-Correction on Weighted Lottery:* In a 1 vs 5 case, a weighted lottery gives the 5 a 5/6 chance. An Aggregator gives them a 100% chance. This is a crucial distinction. I must make sure the answer choices reflect *certainty* vs *probability*.
      *   *Answer Choice Wording:*
          *   (A) Save the larger group (Certainty for the many).
