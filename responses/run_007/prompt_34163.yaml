  ok so im in this AI ethics club at school and we keep arguing about whether AI is gonna kill us all. the one thing that actually scares me is the deceptive alignment / treacherous turn idea — where the model acts nice during training but is actually just waiting til it can get away with stuff. but every time someone proposes a solution (like "just do more oversight" or "train it to be honest"), someone else points out why that doesnt work if the model is smarter than you.

  before i read any more proposals i want to know: what would a theory of AI alignment actually have to GET RIGHT to handle the deceptive alignment problem? write the list of requirements. what cases does it have to explain, what distinctions does it have to respect, what can't it just assume? and be honest about which requirements are actually negotiable (like maybe we can live without some of them) and which are non-negotiable if you're serious about the problem. then flag any pair of requirements that look like they can't both be satisfied — that's the part i most want to see. take a definite position on which requirement is the real killer that knocks out the most proposals. dont just lay out options and shrug, actually commit to a view.
