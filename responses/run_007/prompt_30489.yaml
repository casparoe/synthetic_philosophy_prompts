answer: |-
  Here is a lesson plan designed for a 50-minute first-year section. It prioritizes conceptual scaffolding over theoretical depth, using a single robust example to anchor the distinction.

  ### 1. The Carrying Example: Why Not the Soldier?
  **Do not use the soldier jumping on the grenade.**
  *   **Why:** It introduces "role obligations." Students will argue that a soldier *is* required to protect their unit, which collapses the example back into "Duty." It also involves death, which makes the cost so extreme students can't imagine it as a live option, turning it into a myth rather than a moral category.
  *   **The Replacement:** **The Stranger Kidney Donor.**
      *   **The Case:** Alex is healthy. A stranger on a waiting list will die without a kidney. Alex can donate, living a normal life but undergoing surgery and assuming long-term health risks.
      *   **Why it works:** It involves significant physical sacrifice (distinguishing it from buying someone lunch). It saves a life (high moral value). It is legally and intuitively optional (distinguishing it from duty). It is relatable enough to be discussed seriously.

  ### 2. Order of Ideas (Conceptual Scaffolding)
  You cannot introduce supererogation until four prior concepts are locked in. If you skip one, the category collapses. Teach them in this dependency order:

  1.  **The Moral Minimum (Duty):** Acts we *must* do; omission is blameworthy. (Established in prior units).
  2.  **The Moral Ceiling (Sanctity):** Acts that are morally excellent. (Students usually conflate this with Duty).
  3.  **Optionality (Permission):** Acts where omission is *not* blameworthy.
  4.  **Cost/Sacrifice:** The agent incurs a significant loss (time, risk, resources).

  **Supererogation is the intersection of these four:** It hits the Moral Ceiling, stays within Optionality, and requires Cost.

  ### 3. Lesson Sequence (50 Minutes)

  **0:00–0:05: Activate the Tripartite Map**
  *   Draw three buckets on the board: **Required**, **Permitted**, **Forbidden**.
  *   Ask for quick examples (e.g., Paying taxes, Eating salad, Stealing).
  *   **Goal:** Confirm they currently believe every act fits in one of these three.

  **0:05–0:15: Stress Test with the Kidney Case**
  *   Present the **Stranger Kidney Donor** case.
  *   Ask two specific questions:
      1.  "If Alex *does* donate, is Alex a good person?" (They will say Yes).
      2.  "If Alex *does not* donate, is Alex a bad/wrong person?" (Most will say No).
  *   **The Trap:** If they say "Yes" to #2, push back: "Would you support a law forcing kidney donation? If not, why is it wrong?"
  *   **Goal:** Create cognitive dissonance. The act is "Good," but not doing it is "Not Wrong." It doesn't fit the "Required" bucket (because omission isn't wrong), but "Permitted" feels too weak (because it's morally special).

  **0:15–0:30: Construct the Fourth Category (Head Off Misconceptions Here)**
  *   Draw a fourth bucket: **Above and Beyond (Supererogatory)**.
  *   **Intervention 1 (The Utilitarian Collapse):** Students will argue, "If it saves a life, it's the *best* act, so it must be *required*."
      *   **Counter:** Distinguish **Optimizing** from **Satisfying**. Duty is the minimum bar to avoid blame. Supererogation is clearing the high bar to earn praise. You can be "in the clear" without being a saint.
  *   **Intervention 2 (The Indifference Collapse):** Students will argue, "If it's not required, it's just a preference, like choosing vanilla ice cream."
      *   **Counter:** Emphasize **Moral Value**. Choosing ice cream is morally neutral. Donating a kidney is morally *good*, even if optional. The key differentiator is **Sacrifice**. If it cost Alex nothing, it would be merely permitted. Because it costs Alex something, it is supererogatory.

  **0:30–0:40: Theoretical Context & The "Leave Out"**
  *   Briefly connect to their prior units.
      *   **Utilitarianism:** Tends to hate this category. If the goal is "maximize good," then the best act becomes the required act. (This explains why they feel the pressure to call it "Required").
      *   **Kant:** Tends to absorb this into "Wide/Imperfect Duty."
  *   **What to Leave Out:** Do **not** debate whether supererogation *actually exists* ontologically. Do not try to resolve the Kantian objection that "duty covers everything."
  *   **How to Frame the Omission:** Say this explicitly: *"Philosophers fight about whether this fourth bucket is real or just an illusion of our language. For today, we are not asking if the bucket exists. We are asking: If we use this bucket, does it help us map our moral intuitions more accurately than the three-bucket system? We are analyzing the concept, not defending its metaphysics."*

  **0:40–0:45: Boundary Work**
  *   Test the limits of the definition using the **Cost** variable.
  *   *Scenario A:* Giving a stranger a dollar. (Permitted, not Supererogatory—too low cost).
  *   *Scenario B:* Giving a stranger your kidney. (Supererogatory).
  *   *Scenario C:* A parent feeding their child. (Required—special obligation removes optionality).
  *   **Goal:** Solidify that Supererogation = Optional + Good + Costly.

  **0:45–0:50: Assessment Question**
  *   Do not ask "Define supererogation."
  *   **Ask this:** *"Imagine a firefighter runs into a burning building to save a cat. She is trained and paid to fight fires, but saving animals is not part of her job description and puts her at significant extra risk. Is this act supererogatory? Why or why not, based on our criteria?"*
  *   **What to listen for:** You want them to identify the **Role Obligation** tension. If they say "Yes," they must argue that saving the cat is outside her *moral* duty despite her job. If they say "No," they must argue her role makes it required. You are checking if they understand that **Optionality** is the dealbreaker, not just the **Risk**.

  ### 4. Summary of Misconception Management

  | Misconception | Where it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Best = Required"** | During the Kidney Case (0:05) | Explicitly separate **Blame** (Duty) from **Praise** (Supererogation). You aren't blamed for missing the high jump, but you are praised for clearing it. |
  | **"Optional = Arbitrary"** | During Category Construction (0:15) | Emphasize **Sacrifice**. Arbitrary choices (ice cream) cost nothing. Supererogatory choices cost the agent something significant. |
  | **"It's just Charity"** | During Boundary Work (0:40) | Distinguish low-cost giving (Permitted) from high-cost giving (Supererogatory). The magnitude of sacrifice defines the category. |

  ### 5. Why This Sequence Works
  1.  **It respects their current mental model:** You start with the 3 buckets they know.
  2.  **It breaks the model before fixing it:** The Kidney case forces the 3-bucket system to fail.
  3.  **It isolates variables:** By holding "Goodness" constant and varying "Cost" and "Obligation," you show them exactly what creates the supererogatory category.
  4.  **It protects the timeline:** By explicitly bracketing the "Does it exist?" debate, you prevent the class from getting stuck in meta-ethics before they understand the concept.
