  2.  **Deconstruct the Concept (Supererogation):**
      *   What makes an act supererogatory?
          1.  It is morally good.
          2.  It is not obligatory (not doing it is not wrong).
          3.  It is "above and beyond" the call of duty (often involves sacrifice or significant effort).
      *   Why is it hard for first-years?
          *   Utilitarianism tends to collapse it (maximize utility = duty).
          *   Kantianism tends to reject it (perfect/imperfect duties cover everything).
          *   Common sense morality accepts it, but struggles to define the boundary.

  3.  **Determine the Carrying Example:**
      *   *Soldier/Grenade:* Classic, but problematic.
          *   *Pros:* High stakes, clear sacrifice.
          *   *Cons:* Military context implies *duty* (soldiers are trained/ordered to protect comrades). It might confuse "duty of role" with "moral duty." Also, it's extreme; students might think supererogation *requires* death, missing everyday examples.
      *   *Alternative:* Needs to be high sacrifice but clearly *not* required. Needs to be relatable.
      *   *Selection:* **The Kidney Donor.**
          *   *Why:* It involves significant physical cost/risk (sacrifice). It saves a life (great good). It is legally and generally morally optional (not required). It distinguishes clearly between "nice to do" (buying coffee) and "above and beyond" (giving an organ).
          *   *Refinement:* Let's use a specific scenario: "Giving a kidney to a stranger vs. a friend." Or simply "Giving a kidney to save a life." Let's go with **The Stranger Kidney Donor**. It removes special obligations (like family) that might muddy the "duty" waters.

  4.  **Sequence the Ideas (Scaffolding):**
      *   *Step 1: Establish the Baseline.* Confirm their current map (Required/Permitted/Wrong).
      *   *Step 2: Introduce the Tension.* Use the example to break the map.
      *   *Step 3: Define the New Category.* Formalize supererogation.
      *   *Step 4: Address the Theories.* Briefly touch on why Util/Kant struggle (without getting bogged down).
      *   *Step 5: Solidify the Distinction.* Differentiate from "merely optional."
      *   *Step 6: Assessment.*

  5.  **Address Misconceptions:**
      *   *Misconception 1: "If it's the best thing to do, it's required."* (Utilitarian collapse).
          *   *Fix:* Distinguish between *optimizing* and *satisfying* duty. Use the Kidney example: Is it *wrong* not to donate? Most say no. Is it *better* to donate? Yes. Therefore, Best $\neq$ Required.
      *   *Misconception 2: "If it's not required, it's just a preference (like choosing ice cream)."* (Moral indifference).
          *   *Fix:* Emphasize the *moral value* and the *sacrifice*. It's optional, but morally significant.
      *   *Misconception 3: "It's just charity."*
          *   *Fix:* Distinguish low-cost charity (permitted) from high-cost sacrifice (supererogatory).

  6.  **Determine What to Leave Out:**
      *   *The Kantian/Utilitarian Deep Dive.* First-years can't handle the meta-ethical debate about whether supererogation *exists* yet. They need to grasp the concept before critiquing its ontological status.
