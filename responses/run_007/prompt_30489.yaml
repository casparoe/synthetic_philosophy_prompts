prompt: |-
  Got into a long argument last night with a friend about whether someone who gives away most of their income is doing something above and beyond or just doing what everyone owes. This morning I remembered i'm leading a fifty-minute intro ethics section next week, and the topic is supererogation. Don't explain supererogation to me; plan how I should teach it. The students are first-years, they've done one unit on utilitarianism and one on Kant, and they mostly think an act is either required, permitted, or wrong, end of story. I need the order of ideas: what has to be in place before the concept even makes sense, and what depends on what. I also want the one carrying example I should build the whole session around — and if you don't think the standard soldier-jumping-on-a-grenade case is right for this, say why not and tell me what the example has to have and has to lack. What misconceptions should I expect them to form, and exactly where in the sequence should I head each one off? I'm especially worried they'll collapse the category into the idea that if an act is best, it's required, or on the other side make supererogatory acts sound merely optional in the sense of no reason to do them. I also know there's something I should openly leave out at this level — maybe the whole Kantian objection that there cant be a category beyond duty — but I want you to tell me what to leave out and how to say so. And give me one question I can ask in the last five minutes to check whether they actually got the distinction rather than just repeating the word.
