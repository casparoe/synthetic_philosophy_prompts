prompt: |-
  I'm the secretary of a small union local (about 400 members), and I keep getting handed proposed voting rules for officer elections, contract ratification votes, and strike authorizations. The problem is that people game whatever we adopt: they rank a weak candidate first to knock out a stronger one, or vote against a contract they'd actually accept because they're hoping to force a better offer, and we end up with outcomes nobody wanted. We revise the rules every couple years, and the same argument happens every time — someone wants ranked choice, someone wants approval voting, someone wants a two-round runoff — and nobody on the commitee can say, from the rules themselves, which ones are safe from strategic voting and which ones invite it. The stakes are high (a bad ratification rule can lock us into a contract the membership hates), and I have to explain whatever we pick to members who are suspicious of anything that sounds like a consultants' trick, so it has to be plain-language.

  I half-remember a theorem — Gibbard–Satterthwaite, I think? — that says something like every nontrivial rule with three or more options is manipulable, so perfect strategy-proofness is off the table. But I don't know how to turn that into something I can actually use when a rule lands on my desk. Could you write me a reusable decision procedure I can run on any proposed voting rule before we put it to a vote of the membership? I want the questions to ask in order, what counts as a pass or fail at each step, how to actually exhibit the strategic ballot a rule invites when it fails (not just say "it's manipulable"), and where the procedure has to stop and say "this is a tradeoff between values, not a math question." Then run it on three proposals we're currently looking at: (1) instant-runoff/ranked-choice for a three-candidate officer election; (2) approval voting for a contract decision with three options (accept the company's offer, reject and authorize a strike, accept with amendments); (3) plain majority between two options with the incumbent chair breaking ties. Please be honest about which ones the procedure approves or fails and why, including any result I'm not going to like, and say plainly what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Secretary of a small union local (400 members).
      *   **Problem:** Constant gaming of voting rules (strategic voting), leading to unwanted outcomes (bad contracts, weak officers). Frequent rule changes without resolving the core issue.
      *   **Knowledge Level:** Knows of Gibbard–Satterthwaite (G-S) theorem but doesn't know how to apply it practically. Needs plain language for members.
      *   **Task:** Create a reusable *decision procedure* (checklist/algorithm) to evaluate proposed voting rules.
      *   **Requirements for Procedure:**
          *   Ordered questions.
          *   Pass/Fail criteria.
          *   Must show *how* to exhibit strategic ballots (not just abstract claims).
          *   Must identify where math ends and values/trade-offs begin.
      *   **Task:** Run the procedure on three specific proposals:
          1.  IRV/Ranked-Choice (3 candidates).
          2.  Approval Voting (3 options: Accept, Reject/Strike, Accept w/ Amendments).
          3.  Plain Majority + Chair Tie-break (2 options).
      *   **Tone:** Honest, plain-language, practical, acknowledging limitations (no perfect system).

  2.  **Deconstruct the Theoretical Background:**
      *   *Gibbard–Satterthwaite Theorem:* Basically says if there are $\ge 3$ outcomes and the rule isn't a dictatorship, it's manipulable.
      *   *Implication:* We cannot find a "perfect" rule. The goal isn't perfection; it's *resilience* and *transparency*.
      *   *Key Concepts to Translate:*
          *   Manipulability (Can I vote differently than my true preference to get a better result?)
          *   Monotonicity (Does voting for X ever hurt X?)
          *   Condorcet Criterion (Does the candidate who beats everyone head-to-head win?)
          *   Simplicity/Transparency (Can a member understand it?)
          *   Context (Officer election vs. Contract Ratification vs. Strike Auth).

  3.  **Drafting the Decision Procedure (The "Union Voting Rule Stress Test"):**
      *   *Goal:* Make it actionable.
      *   *Step 1: Context Check.* Is this 2 options or 3+? (Crucial because G-S applies to 3+).
      *   *Step 2: The "Honesty" Test (Strategy-Proofness).* Can I construct a scenario where lying helps?
      *   *Step 3: The "Backfire" Test (Monotonicity).* Can supporting a candidate make them lose?
      *   *Step 4: The "Majority Will" Test (Condorcet).* Does the consensus choice win?
      *   *Step 5: The "Kitchen Table" Test (Complexity).* Can I explain this to a tired member after a shift?
      *   *Step 6: The Trade-off Declaration.* If it fails Step 2 or 3, is the benefit worth the risk?

  4.  **Running the Procedure on the Three Proposals:**

      *   **Proposal 1: IRV/Ranked-Choice (3 Officer Candidates)**
          *   *Context:* 3+ options. G-S applies.
          *   *Strategy:* "Push-over" strategy. Rank a weak candidate first to eliminate a strong rival, then rank your true favorite second.
          *   *Monotonicity:* IRV fails monotonicity. (Voting for X can cause X to lose).
          *   *Verdict:* Fails Strategy and Monotonicity. High complexity.
          *   *Nuance:* Better than Plurality (spoiler effect), but still gameable.

      *   **Proposal 2: Approval Voting (Contract: Accept, Strike, Amend)**
          *   *Context:* 3+ options. G-S applies.
          *   *Mechanism:* Vote for as many as you want. Most votes wins.
          *   *Strategy:* "Bullet Voting." If I like Accept best and Amend second, but fear Strike winning, I might only vote Accept to weaken Amend.
          *   *Monotonicity:* Passes (voting for X never hurts X).
          *   *Verdict:* Fails Strategy (bullet voting), Passes Monotonicity. Simpler than IRV.
          *   *Nuance:* Good for consensus, but requires strategic calculation on where to draw the approval line.

      *   **Proposal 3: Plain Majority + Chair Tie-break (2 Options)**
          *   *Context:* 2 options. G-S *does not* apply (strictly speaking).
          *   *Strategy:* Minimal. You vote your preference.
          *   *Monotonicity:* Passes.
          *   *Verdict:* Passes Strategy (mostly), Passes Monotonicity.
          *   *Catch:* The Chair tie-break introduces power imbalance. If it's truly 2 options, it's the most robust mathematically, but limits choice.
          *   *Wait, check the prompt:* "Contract decision with three options" was Proposal 2. Proposal 3 is "Plain majority between two options with the incumbent chair breaking ties."
          *   *Critique:* The Chair tie-break is a vulnerability. It's not a voting rule flaw, it's a governance flaw.
          *   *Verdict:* Mathematically robust (2 options), but politically risky due to the Chair's power.

  5.  **Refining the Output:**
      *   *Tone Check:* Needs to sound like a tool for a union secretary, not a math professor. Use terms like "gaming," "spoiler," "honest vote."
      *   *G-S Explanation:* Keep it brief. "If you have 3+ choices, someone can game it. Period."
      *   *The "Exhibit" Requirement:* I need to write out specific numbers for the failure scenarios (e.g., "Imagine 100 voters...").
      *   *The "Stop" Point:* Clearly mark where the math ends and the political decision begins.

  6.  **Self-Correction/Review during drafting:**
      *   *Correction on Proposal 2:* Approval voting on contract ratification is unusual. Usually, it's Up/Down. If there are 3 options, Approval allows voting for "Accept" AND "Accept w/ Amendments." This could lead to "Accept" winning even if "Amend" was the compromise. Need to highlight the "threshold" strategy.
      *   *Correction on Proposal 3:* The prompt says "Plain majority between two options." Gibbard-Satterthwaite doesn't forbid strategy-proofness for $N=2$. So this one *can* be strategy-proof. I need to make sure I don't falsely claim it fails G-S. It fails on *power dynamics* (Chair tie-break), not math.
      *   *Clarity on G-S:* Make sure the user understands G-S means "Don't look for perfection, look for *least worst*."
      *   *Formatting:* Use bolding, boxes, or clear headers for the Procedure so it can be copied/pasted or printed.

  7.  **Final Polish:**
      *   Ensure the "How to exhibit" section is concrete (e.g., "Scenario: 400 members...").
      *   Ensure the conclusion summarizes the "Union Secretary's Takeaway."
      *   Check against the "plain-language" constraint. Avoid jargon like "Condorcet Winner" without defining it.

  8.  *(Self-Correction on Proposal 1 IRV)*: IRV is notoriously bad at monotonicity. I should provide a concrete example of that.
      *(Self-Correction on Proposal 2 Approval)*: Approval is actually quite resistant to *some* strategies compared to IRV, but the "where do I cut off approval" is the strategic lever.
      *(Self-Correction on Proposal 3)*: The Chair tie-break is the weak point. I need to emphasize that.

  9.  **Finalizing the Structure:**
