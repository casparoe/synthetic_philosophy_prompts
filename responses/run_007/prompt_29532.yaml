answer: |-
  Here is the diagnostic map you asked for. I am adopting the role of the metaethicist trying to shake your confidence, not by appealing to intuition pumps about "objective values," but by attacking the semantic machinery you claim is robust.

  ### Phase 1: Brainstorming the Counter-Landscape

  Before ranking the defeaters, we need to isolate where the expressivist engine actually overheats. You are confident in the *dissolution* of Frege-Geach (F-G). I contend that while the *initial* F-G problem (embedding in conditionals) has plausible solutions (Gibbard, Schroeder, Blackburn), solving it generates new, harder problems.

  Here are the candidate defeaters I am weighing:

  1.  **The Negation Problem (Schroeder):** It is not enough to embed "lying is wrong." You must distinguish "not (lying is wrong)" from "lying is not-wrong." In belief semantics, $\neg B(p)$ is distinct from $B(\neg p)$. In attitude semantics, "not being for lying" is distinct from "being for not-lying." If your semantics collapses these, you cannot account for the logical relations between them.
  2.  **The Validity/Consistency Mismatch:** Logic is defined by truth-preservation. Expressivism defines it by consistency-of-attitude. Do these map 1:1? If there is a case where attitudes are consistent but the argument is logically invalid (or vice versa), the semantics fails.
  3.  **The Supervenience Explanation:** Moral properties supervene on natural properties. Realists explain this via metaphysical necessitation. Expressivists (Blackburn) explain it via a "ban on mixed worlds" grounded in the nature of practical deliberation. Is this an explanation or a restatement of the phenomenon?
  4.  **Creeping Minimalism (Dreier):** If expressivism successfully mimics all realist discourse (truth, facts, knowledge) via deflationism, does it remain a distinct semantic thesis? If the semantics are extensionally equivalent to realism, is the "expressive" core doing any work?
  5.  **Mixed Normative/Descriptive Conditionals:** "If stealing is wrong, then the bank is empty." How does an attitude toward stealing interact with a belief about the bank in the antecedent? The compositional semantics get messy fast.

  **Assessment of Depth:**
  *   (5) is technical and often patchable.
  *   (3) is explanatory; losing it makes the view less attractive but not necessarily *false*.
  *   (4) is metaphilosophical; it threatens the *point* of the view, not its truth.
  *   (1) and (2) are **fatal**. If the logic doesn't work, the semantics is broken.

  ---

  ### Phase 2: The Ranked Defeaters

  Here is the map of what would actually count against your position, ranked from "Fatal Structural Flaw" to "Theoretical Cost."

  #### 1. Fatal: The Negation Problem & The Logic of Attitudes
  You mentioned you think F-G is dissolved. I challenge whether the solution holds under the weight of **negation**.

  *   **The Challenge:** Mark Schroeder's *Being For* argues that standard expressivist semantics cannot distinguish between the inconsistency of *believing p* and *believing not-p* (A-type inconsistency) versus the inconsistency of *believing p* and *desiring not-p* (B-type inconsistency).
  *   **Why it's Fatal:** Logic relies on these distinctions. If I say "It is not the case that lying is wrong," I am not necessarily expressing a con-attitude toward lying; I might be withholding the attitude. If your semantics treats "not wrong" as "con-attitude toward lying" (or similar), you lose the ability to model uncertainty or agnosticism about morals without contradiction.
  *   **The Test Case:** Consider the sentence: *"Either lying is wrong or it is not the case that lying is wrong."*
      *   For a realist, this is a tautology (True).
      *   For an expressivist, this must express a state of mind that is *necessarily* held. But what state of mind is expressed by a disjunction of an attitude and a negation of an attitude?
      *   If you say it expresses "being for (accepting the law of excluded middle)," you are smuggling in a cognitive belief about logic to fix a normative semantic problem.
      *   **What would move you:** A formal proof that the expressivist logic of "being for" cannot replicate the truth-tables of classical logic without positing a hidden cognitive layer that does all the semantic work. If the "attitude" part is idle and the "logic" part is just realism in disguise, the expressivist semantics is false.

  #### 2. Severe: The "Validity" Gap
  Expressivism defines validity not as truth-preservation, but as **consistency-preservation of attitudes**.

  *   **The Challenge:** There are arguments that are valid in classical logic but seem to fail the attitude-consistency test, or vice versa.
  *   **The Test Case:** *Modus Tollens with Normative Antecedents.*
      *   P1: If lying is wrong, then getting your brother to lie is wrong.
      *   P2: It is not the case that getting your brother to lie is wrong.
      *   C: Therefore, lying is not wrong.
      *   For the realist, this is valid. For the expressivist, P2 expresses a con-attitude toward *con-attitudes toward brother-lying*. This creates higher-order attitudes that quickly become psychologically implausible or formally distinct from the simple attitudes in the conclusion.
  *   **Why it's Severe:** If expressivism requires a *non-classical* logic to function (e.g., intuitionistic or paraconsistent), it fails to capture how we actually use moral language in reasoning. We treat moral reasoning as classical. If you have to say, "Actually, moral logic is slightly different," you are revising the data to fit the theory.
  *   **Concession:** A committed expressivist (like Gibbard) might concede this requires a complex "plan-laden" logic, but they would argue it converges on classical logic in the limit. If it *doesn't* converge, the view is false.

  #### 3. Metaphilosophical: Creeping Minimalism (The "Death by Success")
  This is the worry you hinted at: has the view been qualified until it is unfalsifiable?

  *   **The Challenge:** Jack Dreier argued that if expressivism succeeds in its quasi-realist project (earning the right to talk of moral truths, facts, knowledge), it becomes **extensionally equivalent** to realism.
  *   **The Test Case:** Ask the expressivist: "Is it *true* that lying is wrong?"
      *   If they say "No" (because there are no moral facts), they fail quasi-realism and lose ordinary discourse.
      *   If they say "Yes" (via deflationary truth), then what distinguishes them from the realist?
  *   **Why it Matters:** If the semantics are identical, the disagreement is purely metaphysical (about "robust" facts). But if the semantics are identical, then *expressivism as a semantic thesis is false*. It turns out the semantics *are* truth-conditional, just with deflationary truth conditions.
  *   **The Verdict on this point:** This doesn't prove expressivism *false*, but it proves it **redundant**. If the "expressive" mechanism drops out of the semantic explanation entirely, replaced by deflationary truth-conditions, then you are a realist about semantics and only an anti-realist about metaphysics. That is a significant retreat from "expressivism about normative language."

  #### 4. Awkward: The Supervenience Explanation
  *   **The Challenge:** Why do moral properties supervene on natural properties?
  *   **Realist Answer:** Metaphysical necessitation (or identity).
  *   **Expressivist Answer:** It is conceptually impossible to have different moral attitudes toward two situations identical in natural properties, because moral attitudes are *responses* to natural properties.
  *   **Why it's Awkward:** This looks like a psychological claim masquerading as a conceptual one. What about the person who *does* have different attitudes to identical natural cases (the "moral twin earth" or just a capricious agent)? The expressivist must say they are irrational. The realist says they are mistaken.
  *   **Concession:** Expressivists usually concede this is a pragmatic explanation, not a metaphysical one. It counts against the *explanatory power* of the view, not its truth.

  ---

  ### Phase 3: The Honest Verdict

  You asked for a verdict on whether the view has been "qualified into a research program" and whether that is a problem.

  **1. Has Expressivism been qualified to death?**
  **Yes, but specifically in the semantics.**
  To solve Frege-Geach and the Negation Problem, modern expressivism (Gibbard, Schroeder) has had to adopt a **hybrid semantics**. They posit that normative sentences express *both* a belief (about the norm/system) and an attitude (plan/commitment).
  *   **The Cost:** Once you admit that normative sentences have belief-like content that carries the logical load (to solve F-G), the "expressive" part becomes secondary. The logic is carried by the cognitive component.
  *   **The Result:** You are no longer a pure expressivist. You are a **Hybrid Theorist**. Pure expressivism (Blackburn's early quasi-realism) is likely semantically untenable without smuggling in truth-conditions.

  **2. Is "Research Program" status a bug or a feature?**
  If a view becomes "Expressivism is the claim that we should model normative semantics using tools X, Y, and Z, which may end up looking like truth-conditions," it risks becoming unfalsifiable.
  *   **The Danger:** If *any* successful semantic model counts as a victory for expressivism (because it "explains the function"), then expressivism is just "functionalism about moral language." That is trivial.
  *   **The Refutation Condition:** Expressivism is **false** if it turns out that the *best* semantic model for normative language is one where the truth-conditions are **robustly representational** (i.e., they track mind-independent properties) rather than deflationary or plan-based.
  *   **Specifically:** If we find linguistic data showing that normative terms behave like natural kind terms (rigid designation, causal history) in embedded contexts *in a way that plan-semantics cannot mimic*, expressivism is dead. (Some experimental pragmatics work hints at this, but it's not conclusive).

  **3. Final Diagnosis**
  You are right that the *basic* Frege-Geach objection is often overstated; Gibbard and Schroeder have built machinery that works. However, you are likely wrong that the problem is "dissolved." It has been **displaced**.

  The problem is no longer "How do we embed attitudes?" It is now: **"Why posit attitudes at all if the logic requires belief-like content?"**

  *   **Fatal Flaw to Watch:** If the "plan" or "attitude" component does no *semantic* work (i.e., it doesn't affect truth conditions, validity, or embedding), then it is not part of the *meaning*. It is merely a pragmatic effect. If it is merely pragmatic, **Expressivism is false as a semantic thesis.** It becomes a theory of *use*, not *meaning*.
  *   **Your Move:** To remain an expressivist, you must demonstrate a case where the **attitude component affects the semantic value** of a complex sentence in a way that a pure cognitivist model cannot capture. If you cannot find such a case, you are a Cognitivist who likes to talk about attitudes.

  **Summary Verdict:**
  Expressivism is not dead, but **Pure Expressivism** is likely untenable. The view survives only as a **Hybrid Semantics**. If you are willing to concede that normative language has truth-conditional content (even if deflationary) *plus* an expressive component, you are safe from F-G. But if you hold that it is *only* expressive, the Negation Problem remains a live bullet that could yet burst the tire. The view is not unfalsifiable, but its falsification conditions have shifted from "Can it handle 'if'?" to "Is the non-cognitive component semantically idle?"
