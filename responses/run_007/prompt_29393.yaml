prompt: |-
  I am about to work through the literature on the physical, design, and intentional stances and the notion of a real pattern that is supposed to license them, and I want the specification before I read another defense or attack. Write the desiderata for an adequate account: the phenomena it must explain, the cases it must get right, and the distinctions it must not quietly collapse, with the case or consideration behind each. Adequacy here means good enough to settle when a stance is warranted, what adopting it commits you to, and why the stances succeed when they do — not a practical recipe for prediction. Make sure your list engages at least these cases: a thermostat (where the intentional stance looks gratuitous and the design stance seems to do all the work), a chess-playing program (where the intentional stance predicts well without any inner life), the compulsive hand-washer or addict (where the intentional stance predicts poorly despite the system being a person), a corporation or market treated as an agent, and the design without a designer exhibited by natural selection. For each requirement, mark it as non-negotiable or as the preference of a particular camp — realist versus instrumentalist about the posits of the intentional stance, say — and justify the marking. Then say whether any pair of requirements on your list cannot be jointly satisfied; I suspect there is a real tension between treating the intentional stance as an optional, merely predictive heuristic and also treating beliefs and desires as real patterns on a par with physical-stance posits, but I want your judgment on whether that tension is genuine and which side should give. Identify the single requirement that does the most to exclude the standard readings of the view, such as a crude realism, a flat instrumentalism, or an eliminativism about the intentional. A brief scorecard of the main contenders is fine, but the criteria are the deliverable. Close by telling me which requirement in your own list you are least confident is a genuine desideratum, and what argument, case, or empirical finding would lead you to drop it or add a new one.
