answer: |-
  Here is a specification of desiderata for an adequate account of the Three Stances and Real Patterns. These criteria are designed to adjudicate warrant, commitment, and success conditions, engaging the specific cases you listed.

  ### Desiderata for an Adequate Account

  **1. The Efficiency Threshold (Warrant)**
  *   **Specification:** The account must specify the conditions under which abandoning a lower stance (Physical) for a higher one (Design/Intentional) is warranted solely by a gain in predictive tractability, absent any claim about inner constitution.
  *   **Case:** **The Thermostat.** A physical explanation of a thermostat is tractable; an intentional explanation ("it wants the room to be 70°") is gratuitous. The account must explain why the Design Stance is sufficient here and why the Intentional Stance is usually withheld, despite the system having a "goal."
  *   **Marking:** **Non-negotiable.**
  *   **Justification:** Without a tractability constraint, the stances collapse into one another. If the Intentional Stance is warranted everywhere there is teleology, it loses its distinctive utility. The stances are defined by their trade-off between detail and predictive power.

  **2. The Substrate Neutrality Constraint (Scope)**
  *   **Specification:** The account must allow intentional predicates to apply to systems regardless of their physical medium, provided they exhibit the requisite pattern of information processing and goal-directedness.
  *   **Case:** **Corporations and Markets.** We treat firms as agents with beliefs and desires (e.g., "Apple wants to capture market share"). The account must explain how a distributed, non-biological system can legitimately bear intentional description without metaphor.
  *   **Marking:** **Non-negotiable.**
  *   **Justification:** If intentional ascriptions require biological wetware, the Design and Intentional stances lose their generality. Dennett's core insight is that agency is a functional pattern, not a substance.

  **3. The Rationality Norm (Success Condition)**
  *   **Specification:** The account must explain that the Intentional Stance succeeds by assuming the system is *rational*, and must define the limits of this assumption when the system systematically deviates from rationality.
  *   **Case:** **The Compulsive Hand-Washer/Addict.** This system is a person, yet the Intentional Stance predicts poorly (they desire health but wash hands until they bleed). The account must distinguish between a system that is *too broken* for the Intentional Stance (where we revert to Physical/Medical) and a system that is merely irrational but still an agent.
  *   **Marking:** **Preference of the Realist Camp.**
  *   **Justification:** An Instrumentalist might say the stance simply fails here, so no commitment is warranted. A Realist about persons argues that the *person* remains an intentional system even when their intentional states are pathological. This requirement pushes for a robust notion of agency that survives local irrationality.

  **4. The Teleology without Mind Constraint (Success Condition)**
  *   **Specification:** The account must explain how the Design Stance can be objectively warranted for systems that have a function but no designer.
  *   **Case:** **Natural Selection.** Evolution produces organisms that look designed. The account must license the Design Stance for biology without positing a cosmic designer, grounding "function" in history/selection rather than intention.
  *   **Marking:** **Non-negotiable.**
  *   **Justification:** This is the bridge between the Physical and Intentional stances. If Design requires a Designer, the Intentional Stance becomes circular (explaining mind via mind). Evolution must be able to generate Design-stance objects naturally.

  **5. The Pattern Reality Constraint (Commitment)**
  *   **Specification:** The account must specify that if a pattern of behavior is robust enough to support reliable prediction and counterfactuals, the entities posited by that pattern (beliefs, desires) are "real," even if they do not map 1:1 to physical states.
  *   **Case:** **The Chess-Playing Program.** The program has no inner life, yet "It wants to control the center" predicts moves. The account must determine if the program's "beliefs" are real patterns or useful fictions.
  *   **Marking:** **Preference of the Pattern-Realist Camp (Dennettian).**
  *   **Justification:** A Flat Instrumentalist says the beliefs are fictions. A Crude Realist says they must be neural/silicon states. This requirement demands a middle path: the pattern is real *as a pattern*, licensing ontological commitment without requiring reduction.

  ---

  ### Analysis of Tensions

  **The Tension:** There is a genuine tension between **Desideratum 1 (Efficiency Threshold)** and **Desideratum 5 (Pattern Reality Constraint)**.

  *   **The Conflict:** Desideratum 1 treats the stances as *optional heuristics* chosen for pragmatic convenience (we *could* predict the chess program physically, but it's hard). Desideratum 5 treats the posits of the stance as *real patterns* on a par with physical posits. If the stance is merely optional/pragmatic, the reality of its posits seems observer-relative and fragile. If the posits are real, the stance seems less like a choice and more like a recognition of objective structure.
  *   **Judgment:** The tension is genuine for traditional metaphysics but resolvable within a pragmatic ontology. However, one side must give. **The "optional/heuristic" characterization (Desideratum 1) must give way to the "constitutive" nature of the pattern (Desideratum 5).**
  *   **Reasoning:** If beliefs are *only* useful fictions (heuristic), we slide into eliminativism or hard instrumentalism. To save the phenomena of agency, we must accept that the "choice" of stance is often forced by the structure of the world. The pattern is there to be found; the stance is the method of finding it. The reality of the pattern grounds the warrant for the stance, not merely the computational ease.

  ### The Exclusionary Requirement

  **Desideratum 5 (The Pattern Reality Constraint)** is the single requirement that does the most work to exclude standard readings.

  *   **Excludes Crude Realism:** By asserting patterns are real *without* requiring 1:1 mapping to physical states (neurons/silicon), it rejects the idea that beliefs must be "things in the head" to be real.
  *   **Excludes Flat Instrumentalism:** By asserting the patterns are *real* and not just useful fictions, it rejects the idea that intentional posits have no ontological standing.
  *   **Excludes Eliminativism:** By licensing ontological commitment based on predictive success, it validates the existence of beliefs and desires against the claim that they are theoretical errors.

  It forces a "Pattern Realism" that is distinct from the traditional trilemma.

  ### Scorecard of Contenders

  *   **Eliminative Materialism (Churchland):** Fails Desideratum 5. Treats intentional posits as false theory rather than real patterns. Good on Desideratum 1 (physical is fundamental), but loses the phenomena of agency.
  *   **Interpretational Realism (Fodor):** Fails Desideratum 2 (Substrate Neutrality) and 5 (Pattern Reality). Requires internal symbolic structures (Language of Thought) for real intentionality, making corporations and simple programs mere metaphors.
  *   **Hard Instrumentalism:** Fails Desideratum 5. Saves the predictive utility but denies the reality of the agent, making the "self" a fiction.
  *   **Dennett's Pattern Realism:** Satisfies all, provided one accepts the redefinition of "real" in Desideratum 5. It is the only view that accommodates Evolution (4) and Corporations (2) without metaphor.

  ### Least Confident Requirement

  I am least confident in **Desideratum 3 (The Rationality Norm)** as a genuine desideratum for *warrant*.

  *   **Reason for Doubt:** The boundary between a "irrational agent" (Intentional Stance applies but predicts poorly) and a "broken mechanism" (Design/Physical Stance required) is notoriously slippery. In the case of the addict, we often oscillate between stances seamlessly. Demanding a sharp criterion for when the Intentional Stance is *warranted* versus when it *fails* might impose a false precision on a continuum.
  *   **What Would Change My Mind:** Empirical findings in **psychiatry or neurology** that identify a specific structural breakdown corresponding exactly to the failure of rationality prediction. If we found a "switch" in the brain or system architecture that toggles between "rational agent mode" and "mechanical failure mode," Desideratum 3 would be vindicated as a hard boundary. Without that, it may be that the Rationality Norm is a gradient, not a binary warrant condition, and should be replaced by a **Robustness Requirement** (how much noise the pattern can tolerate) rather than a Rationality Requirement.
