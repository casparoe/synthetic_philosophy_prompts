answer: |-
  ### Comments on the Draft

  **1. Accuracy**
  The dilemma is fairly stated as a challenge to *classical* phenomenal hedonism, but it may be too dichotomous regarding contemporary replies. You mention the "determinable" view briefly ("thin to the point of being uninformative"), but this is a standard escape route (e.g., C.D. Broad, J.J.C. Smart) that deserves a dedicated sentence explaining why the "thinness" is fatal (e.g., if the determinable is introspectively inaccessible, can it ground well-being?). Additionally, you treat phenomenal and attitudinal views as exhaustive. Representationalist or intentionalist accounts (e.g., Chris Heathwood) argue pleasure is a representation of something as good, which is neither a raw feel nor a simple desire. While these may not fully escape your dilemma, acknowledging them would strengthen the accuracy of the landscape.

  **2. Interest**
  The framing is illuminating because it shifts the focus from the metaphysics of pleasure to the *theoretical identity* of hedonism. The claim that attitudinal hedonism is "a preference theory wearing hedonist vocabulary" is the most original and worth retaining; it challenges proponents to justify why their view remains distinctively hedonistic rather than merely experientialist desire-satisfaction. However, the heterogeneity problem itself is a familiar objection. The novelty lies in pressing the second horn as a surrender of the theory's motivating intuition rather than just a technical adjustment.

  **3. Specific Parts**
  Regarding the first horn: Yes, there is a risk of conflating "having something in common" with "sharing a single homogeneous felt quality." A determinable property is common but not homogeneous in the specific sense you imply. You should clarify that your objection is not just that the quality is heterogeneous, but that any common determinable is introspectively elusive or normatively inert. Regarding the second horn: The move from "liking" to "desire-satisfaction theory" is quick. Attitudinal hedonists (e.g., Fred Feldman) argue that because the object of the attitude is restricted to *experiences*, it remains distinct from standard desire theories where objects are states of affairs. You need to argue why this restriction doesn't save the theory from your objection.

  **4. Suggestions**
  The argument is most vulnerable to the counter-claim that attitudinal hedonism preserves the "inside view" of life even without raw feels. To strengthen this for professional philosophers, explicitly engage with Feldman's *Adjustment for Truth* or similar hybrid views. A concrete revision would be to add a paragraph acknowledging the attitudinal hedonist's distinction between experience-directed attitudes and world-directed desires, then argue why this distinction fails to preserve the unique normative force of phenomenal hedonism. This would show you have considered the strongest version of the opposing view before delivering the dilemma.

