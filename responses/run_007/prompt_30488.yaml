prompt: |-
  Me and a friend have been going back and forth on the St. Petersburg paradox for months and we want to write up the adversarial-collaboration statement we could both sign. One of us thinks the right lesson is that utility has to be bounded, so expected utility maximization survives intact; the other thinks the lesson is that expected utility maximization itself has to be restricted or replaced for these infinite/long-tail cases, and that bounding utility is just patching the symptom. Write that document. Include a numbered list of claims we both accept about what the paradox does and doesn't show; a disagreements table where each side's view is worded the way its own side would endorse; and the cruxes, the sub-questions that would actually change at least one of our minds. For each crux, give the case or argument both of us agree bears on it—finite-bankroll versions, Menger-style super-St. Petersburg games, the Pasadena game, stochastic dominance considerations—and record each side's prediction in advance. Flag anything you think is just a verbal dispute.
