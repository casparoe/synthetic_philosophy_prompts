          *   *Standard EDT:* Calculates $EU(A) = \sum P(O|A)U(O)$. If $P(\text{Death}|\text{Aleppo}) = 1$ and $P(\text{Death}|\text{Damascus}) = 1$, then $EU(\text{Aleppo}) = EU(\text{Damascus}) = \text{Death}$.
          *   *The Equilibrium Problem:* If I decide Aleppo, I believe Death is in Aleppo. So I should go to Damascus. If I decide Damascus, I believe Death is in Damascus. So I should go to Aleppo. This is *deliberational instability*.
