answer: |-
  Here is a complete seminar plan designed for your 75-minute session. It balances game mechanics with philosophical rigor, specifically tailored for advanced undergrads who can handle the nuance but need the intuition pumped.

  # Seminar Plan: The Hitchhiker's Bind
  **Topic:** Parfit, Practical Rationality, and Rational Irrationality
  **Time:** 75 Minutes
  **Participants:** 16 Students (Split: 8 Drivers, 8 Hitchhikers)

  ## 1. Learning Objectives
  *   **Visceral:** Experience the "Rational Trap" where straightforward maximization leads to Pareto-inferior outcomes.
  *   **Structural:** Understand the value of pre-commitment mechanisms.
  *   **Philosophical:** Distinguish between *external* binding (game mechanics) and *internal* disposition (Parfit's actual claim).

  ## 2. Materials Needed
  *   **Tokens:** 200 poker chips or printed "Utility Points" (UP).
  *   **Decision Slips:** Two colors of small paper slips (e.g., Blue for Drivers, Red for Hitchhikers).
  *   **"Vow" Cards:** 8 index cards labeled "ULYSSES CONTRACT."
  *   **Whiteboard:** For tracking aggregate scores.

  ## 3. The Payoff Structure (The Math)
  Write this on the board before starting.
  *   **Driver:**
      *   *Don't Offer:* 0 UP
      *   *Offer & Paid:* +10 UP (Cost -5, Reward +15)
      *   *Offer & Not Paid:* -5 UP (Cost -5, Reward 0)
  *   **Hitchhiker:**
      *   *No Ride:* 0 UP
      *   *Ride & Pay:* +10 UP (Value +20, Cost -10)
      *   *Ride & Defect:* +20 UP (Value +20, Cost 0)

  *Note: The Hitchhiker always gains more by defecting *ex-post*. The Driver knows this and won't offer *ex-ante*.*

  ---

  ## 4. Session Flow (75 Minutes)

  ### Part 1: Setup & Phase 1 (The Rational Trap) [25 Mins]
  **Rules (5 mins):**
  1.  Split the room: 8 Drivers (Left), 8 Hitchhikers (Right).
  2.  **Anonymous Pairing:** You will play 3 rounds. Each round, Hitchhikers are randomly assigned a Driver (you draw a number). You will never know who you played until the end.
  3.  **Sequence:**
      *   Driver writes "Offer" or "Ignore" on Blue slip.
      *   If "Ignore," round ends. Both get 0.
      *   If "Offer," slip goes to Hitchhiker.
      *   Hitchhiker writes "Pay" or "Defect" on Red slip.
  4.  **Goal:** Maximize your personal UP. Top 3 scores get... eternal glory (or chocolate).

  **Play Phase 1 (15 mins):**
  *   Run 3 rounds.
  *   Collect slips, calculate payoffs, distribute tokens.
  *   **Expected Outcome:** Round 1 might see 1-2 offers. By Round 3, Drivers will stop offering. Hitchhikers will defect. Total utility in the room will be near zero.

  **Mini-Debrief (5 mins):**
  *   Ask Drivers: "Why did you stop offering?" (Answer: They won't pay.)
  *   Ask Hitchhikers: "Why did you defect?" (Answer: It's the dominant strategy.)
  *   **Point:** Straightforward Maximization (SM) leads to collective ruin.

  ### Part 2: Phase 2 (The Ulysses Contract) [25 Mins]
  **Rules (5 mins):**
  *   "We are introducing a market for **Dispositions**."
  *   Before Round 4, Hitchhikers can optionally purchase a **Vow Card** for **5 UP**.
  *   **The Mechanism:** If you hold a Vow Card, you *physically cannot submit a Defect slip*. You must submit "Pay." (Collect their Red slips immediately upon pairing; if they try to write Defect, they are disqualified and lose all points).
  *   **Information:** Drivers are told *how many* Vows were purchased in total, but **not who holds them**.
  *   Run 3 more rounds with random re-pairing.

  **Play Phase 2 (15 mins):**
  *   Hitchhikers decide: Buy Vow (cost 5, guaranteed Pay) or Stay Free (cost 0, can Defect).
  *   Drivers decide: Offer (risking meeting a non-Vow holder) or Ignore.
  *   **Expected Outcome:** Some Hitchhikers buy Vows. Drivers start offering again because the *probability* of payment rises. Vow-holders net +5 per round (10 payoff - 5 cost). Non-Vow holders get 0 (Drivers ignore them).

  **Tally (5 mins):**
  *   Compare total utility generated in Phase 1 vs. Phase 2.
  *   Identify the "Winners" (Likely Vow-holders).

  ### Part 3: Philosophical Debrief [25 Mins]
  *This is where you do the heavy lifting. Do not rush this.*

  **1. Map the Game to Parfit (10 mins)**
  *   **Phase 1 = Straightforward Maximizers (SM).** Explain that in Parfit's desert, once you are in the car, paying is irrational. The Driver knows this. You die.
  *   **Phase 2 = Constrained Maximizers (CM).** The Vow Card simulates a *disposition*.
  *   **The Crucial Question:** "In Phase 2, was it rational to buy the Vow?"
      *   *Yes,* because it allowed you to access the cooperative surplus.
      *   *But,* once you bought the Vow and were in the car, you were forced to pay. You lost the "freedom" to be irrational.
      *   **Parfit's Claim:** It is rational to cultivate a disposition that makes you *unfree* to defect, even if the act of paying is locally irrational.

  **2. Introduce Kavka's Toxin Puzzle (5 mins)**
  *   Ask: "In the game, the Instructor *forced* you to pay if you had the card. What if there was no Instructor? What if you just *promised*?"
  *   Introduce Toxin Puzzle: An eccentric billionaire offers $1M if you *intend* to drink a harmless toxin tonight at midnight. You get the money at 5 PM. You don't actually have to drink it, just intend to.
  *   **Link:** Can you form the intention? If you are a straightforward maximizer, you know that at midnight, drinking the toxin is irrational (money is already in the bank, sickness is certain). So you can't intend it. So you don't get the money.
  *   **Lesson:** You need to be the *kind of person* who follows through, even when incentives change.

  **3. The Limitation Discussion (10 mins)**
  *   **The Gap:** In the game, the Vow was *externally enforced* by me (the instructor). If you defied it, I punished you.
  *   **Parfit's Harder Claim:** Parfit isn't arguing for external contracts. He's arguing for *internal* rationality. He claims that if you truly adopt a disposition, it is not "irrational" to follow it, because your utility function has changed.
  *   **Ask the Class:** "Is it possible to train yourself to feel pain when you break a promise, such that paying the hitchhiker fee becomes the utility-maximizing move *in the moment*? Or is that just self-deception?"

  ---

  ## 5. What Will Go Wrong (And How to Fix It)

  **1. The "Small World" Problem**
  *   **Risk:** With 16 people, anonymity is fragile. Drivers might recognize Hitchhiker's handwriting or mannerisms. They might build reputations ("Don't pick up Sarah, she defected last time").
  *   **Fix:** Insist on typed slips or have them write in block capitals. Shuffle slips in a box before distributing. If reputation building happens, **pause the game** and point it out: "You just invented external enforcement. Parfit wants to know if we can solve this *without* reputation."

  **2. Gaming the Vow**
  *   **Risk:** A clever student buys the Vow, hands in the "Pay" slip, but whispers to the Driver "Let's split the points off the record," or tries to sneak a Defect slip past you.
  *   **Fix:** Be the strict bank. Collect the Hitchhiker's decision slip *yourself* immediately after pairing. If they hold a Vow Card and hand you a Defect slip, they are publicly busted and lose all points. Make the enforcement theatrical.

  **3. The "Sucker" Sentiment**
  *   **Risk:** In Phase 2, Drivers might still refuse to pick up Vow-holders because they fear the *non-Vow* holders. Cooperation might not fully recover.
  *   **Fix:** This is actually a **feature**, not a bug. It demonstrates the *signaling problem*. If Drivers can't distinguish Vow-holders, the market for dispositions is inefficient. Use this in the debrief to discuss why we need *visible* signs of virtue (and why they are often fake).

  **4. Confusion over "Rationality"**
  *   **Risk:** Students will argue that buying the Vow was just "long-term rationality," not "rational irrationality."
  *   **Fix:** Be precise. "Ex-ante (before the ride), buying the Vow is rational. Ex-post (in the car), paying is irrational *unless* your disposition has changed your utility function. The game forces the payment externally. Parfit asks if we can do it internally."

  ---

  ## 6. Philosophical Limitations (For Your Prep)
  *Be ready to admit these in the debrief. It builds trust.*

  1.  **External vs. Internal:** The game solves the commitment problem via **external enforcement** (you, the instructor, penalizing defection). Parfit's project is about **internal rationality** (changing one's own psychology so that keeping the promise maximizes utility *without* external threats). The game shows *why* we want dispositions; it doesn't show *how* they work psychologically.
  2.  **One-Shot vs. Iterated:** The game is technically iterated (3 rounds), which allows for reputation. Parfit's Hitchhiker is a **one-shot** interaction. You will need to remind them to treat each round as a fresh desert crossing.
  3.  **The Cost of Disposition:** In the game, the Vow costs 5 points. In reality, cultivating a disposition (e.g., honesty) has a "maintenance cost" (you sometimes pay when you could have gotten away with cheating). The game captures this cost, which is good, but make sure they see the cost as the *price of admission* to cooperation.
  4.  **Toxin Nuance:** The game is a Prisoner's Dilemma/Hitchhiker hybrid. It doesn't perfectly map to Kavka's Toxin Puzzle (which is about *intention* without *action*). You will need to verbally bridge that gap in the debrief.

  ## 7. Instructor Script Snippet (For the Debrief)
  *"Look at the winners of Phase 2. They paid 5 points to tie their own hands. A straightforward maximizer would say: 'Why pay 5 points to lose the option to defect?' But because they lost that option, the Drivers trusted them. They survived the desert.*

  *Parfit's radical claim is this: You don't need me, the instructor, to enforce that Vow. If you are truly rational, you should cultivate a psychology where breaking a promise causes you such psychic pain that paying the driver becomes the 'rational' thing to do in the moment. You make yourself irrational to the temptation, so that you can be rational to your survival.*

  *The question for next week is: Can we actually do that? Or are we stuck with the Vow Cards?"*
