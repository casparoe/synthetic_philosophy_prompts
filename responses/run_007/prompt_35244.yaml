  2. The funds do not belong to you, and taking them constitutes a violation of ownership rights that exists independently of whether the violation is detected or punished. Moral wrongness can reside in the unauthorized transfer itself, not just in the resulting harm or risk of discovery.
  3. The primary moral question is not what you do, but who you become, and choosing deceit cultivates a character defined by dishonesty regardless of external validation. Integrity is an internal state of wholeness that is fractured the moment you act against your own knowledge of rightness.
  4. As the engineer maintaining the system, you hold a fiduciary-like responsibility to uphold its integrity that supersedes your personal financial interest. Breaching this trust corrupts the professional role itself, turning you from a guardian of the system into its predator.
  5. You cannot escape the knowledge of your own action, and living with the secret truth of being a thief imposes a psychological burden that alters your relationship with yourself and others. The guarantee of never being caught by others does not guarantee you will not be judged by your own conscience.
