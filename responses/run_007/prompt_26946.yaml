  A cosmic mechanism generates a human colony on a distant planet. There are two equally probable hypotheses regarding the colony's total lifespan and population ($N$):
  *   **$H_S$ (Small):** The colony lasts 10 years and contains **100 people** total.
  *   **$H_L$ (Large):** The colony lasts 1,000 years and contains **1,000 people** total.
  *   **Prior:** $P(H_S) = P(H_L) = 0.5$.

  **The Structural Difference**
  The social structure of the colony depends on its lifespan:
  *   In **$H_S$**, the colony is in a permanent state of crisis mobilization. Every single citizen is briefed on the total population count and their own birth rank. (100% "Informed").
  *   In **$H_L$**, the colony becomes a vast, stratified bureaucracy. Only the top administrators know the total count and their rank. The rest live ordinary lives without access to global statistics. Specifically, only the first **10 people** are "Informed." The remaining 990 are "Uninformed."

  **The Evidence**
  You find yourself existing as a conscious observer in this colony. You possess a specific piece of data: **"I am an Informed observer, and my birth rank is 5."**

  **The Agents**
  *   **Agent A (The Standardist):** Adopts the Reference Class (RC) of **"All Human Observers."**
  *   **Agent B (The Cognitivist):** Adopts the Reference Class of **"Observers Capable of Accessing Global Statistics"** (i.e., Informed Observers). This class is defensible on the grounds that only members of this class can actually process the evidence required to apply the Doomsday Argument.

  ---

  ### Computations

  Both agents apply the Self-Sampling Assumption (SSA): *"Treat yourself as a random sample from your Reference Class."*

  #### Agent A (RC = All Humans)
  Agent A treats "Being Informed" as additional evidence ($I$) alongside "Rank 5" ($R5$).
  *   **Under $H_S$:**
      *   Total Humans ($N_{total}$) = 100.
      *   Informed Humans ($N_{inf}$) = 100.
      *   Probability of being Informed: $P(I | H_S) = 100/100 = 1$.
      *   Probability of Rank 5 given Informed: $P(R5 | I, H_S) = 1/100$.
      *   Likelihood: $P(E | H_S) = 1 \times (1/100) = \mathbf{1/100}$.
  *   **Under $H_L$:**
      *   Total Humans ($N_{total}$) = 1,000.
      *   Informed Humans ($N_{inf}$) = 10.
      *   Probability of being Informed: $P(I | H_L) = 10/1,000 = 1/100$.
      *   Probability of Rank 5 given Informed: $P(R5 | I, H_L) = 1/10$.
      *   Likelihood: $P(E | H_L) = (1/100) \times (1/10) = \mathbf{1/1,000}$.
  *   **Posterior Odds:**
      $$ \frac{P(H_S | E)}{P(H_L | E)} = \frac{P(E | H_S)}{P(E | H_L)} \times \frac{P(H_S)}{P(H_L)} = \frac{1/100}{1/1,000} \times 1 = \mathbf{10 : 1} $$
  *   **Conclusion:** Strongly favors **Small** ($P(H_S) \approx 91\%$).

  #### Agent B (RC = Informed Humans)
  Agent B defines the Reference Class *as* Informed Humans. Under SSA, they condition on being in the RC. They do not calculate the probability of *being* Informed; they assume they are a random sample from the set of Informed observers.
  *   **Under $H_S$:**
      *   Size of RC ($N_{RC}$) = 100.
      *   Probability of Rank 5 within RC: $P(R5 | H_S, RC) = \mathbf{1/100}$.
  *   **Under $H_L$:**
      *   Size of RC ($N_{RC}$) = 10.
      *   Probability of Rank 5 within RC: $P(R5 | H_L, RC) = \mathbf{1/10}$.
  *   **Posterior Odds:**
      $$ \frac{P(H_S | E)}{P(H_L | E)} = \frac{1/100}{1/10} \times 1 = \mathbf{1 : 10} $$
  *   **Conclusion:** Strongly favors **Large** ($P(H_S) \approx 9\%$).

  ---

  ### Analysis of Divergence

  **The Driving Feature**
  The divergence is driven solely by the **correlation between Reference Class cardinality and the Hypothesis**.
  *   For Agent A, the Reference Class size scales *positively* with the Total Population ($100 \to 1,000$). This creates the standard Doomsday penalty for the Large hypothesis.
  *   For Agent B, the Reference Class size scales *negatively* with the Total Population ($100 \to 10$). Because the Large hypothesis concentrates the "Informed" property into a smaller absolute group, finding yourself in that group is more probable under $H_L$ than $H_S$ *relative to the class size*.

  **Removing the Feature**
  If we remove the negative correlation—specifically, if the proportion of Informed observers is held constant across hypotheses (e.g., 10% in both)—the divergence vanishes.
  *   If $H_S$ has 10 Informed and $H_L$ has 100 Informed:
      *   Agent A Likelihoods: $1/100$ vs $1/1,000$ (Favors Small 10:1).
      *   Agent B Likelihoods: $1/10$ vs $1/100$ (Favors Small 10:1).
  *   Both agents would agree on the Small conclusion. The reversal depends entirely on the assumption that the Large world makes the specific property defining Agent B's class *rarer in absolute terms*.

  **The Doomsday Defender's Rebuttal**
  A defender of the standard Doomsday Argument would argue that Agent B's Reference Class is **illegitimately gerrymandered** because it ignores the *selection probability* of the class itself.
  *   **Argument:** SSA requires you to reason as if you are a random sample from the RC, but it does not allow you to ignore the probability that the RC *contains you*. In $H_L$, it is highly unlikely (1%) that you would be born into the "Informed" stratum. In $H_S$, it is certain (100%).
  *   **Critique:** By defining the RC as "Informed," Agent B treats the evidence "I am Informed" as a tautological precondition rather than probabilistic data. This discards the strongest evidence favoring $H_S$. The defender would insist that the only non-arbitrary Reference Class is the widest natural kind (e.g., "Human Observers"), which forces Agent A's calculation. Agent B's class is defined *post-hoc* based on a property that correlates with the hypothesis, violating the requirement that reference classes be independent of the hypotheses being tested.

  ---

  ### Confidence Assessment

  **Confidence in Diagnosis:** **High.**
  The mathematical divergence is robust and follows directly from the definition of SSA. The identification of the "inverse correlation of RC size" as the driver is analytically sound. This scenario effectively isolates the Reference Class problem as the variable determining the direction of the inference.

  **Least Sure Point:** **The Defensibility of Agent B's Reference Class.**
  While I have argued that "Observers capable of accessing statistics" is a defensible cognitive class (similar to "Observers capable of understanding the Doomsday Argument"), a staunch proponent of the Doomsday Argument would likely reject this as *obviously* gerrymandered. They would argue that any RC narrower than "All Observers" is suspect unless justified by a theory of personal identity that excludes the Uninformed. Whether this exclusion is "independently defensible" or "obviously gerrymandered" is the central philosophical stalemate of the Doomsday Argument literature, making this the most contestable premise of the thought experiment.
