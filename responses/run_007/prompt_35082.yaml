      *   **Sphexishness:** Rigid, scripted behavior vs. flexibility.
      *   **Complexity vs. Qualitative Difference:** Is it just more neurons, or is there a structural shift?
      *   **Free Will/Illusion:** The hard determinist view vs. a compatibilist or libertarian-leaning view (though Dennett is a compatibilist, the prompt asks for a defense of *real* agency, so I need to navigate Dennett's actual view vs. Jake's interpretation of it). *Correction:* Dennett actually argues *against* the idea that we are Sphex-like. He uses Sphex to show what we *aren't*. So Maya should align closer to Dennett's actual intent, while Leo misappropriates Sphex for hard determinism.
      *   **Meta-cognition:** The ability to think about thinking.
      *   **Evolutionary Continuity:** Acknowledging we evolved from simpler beings without conceding we are *just* simpler beings.

  4.  **Drafting - Section by Section:**

      *   **Setting the Scene:** A coffee shop late at night. Papers, empty cups. Establishes the academic context.
      *   **Opening:** Start mid-conversation or just after class. Let's go with post-class decompression. Leo brings up the wasp.
      *   **Round 1: The Sphex Argument.** Leo argues the wasp is a robot, and we are too, just complex. Maya counters that Dennett's point was the opposite.
      *   **Round 2: Complexity vs. Kind.** Leo argues quantity becomes quality (emergence). Maya argues that *recursive* modeling is a qualitative shift. The "view from nowhere" vs. the "view from inside."
      *   **Round 3: The Illusion of Will.** Leo claims the feeling of choice is just a UI (user interface). Maya argues the UI *is* the functionality. If it acts like choice and handles novelty like choice, it *is* choice in the only sense that matters.
      *   **Round 4: Shifting Ground.** Leo admits that "illusion" might be the wrong word, but maintains physical determinism. Maya admits we aren't "magic" but insists on the reality of the process.
      *   **Closing:** No definitive resolution (it's philosophy), but a mutual understanding of the stakes.

  5.  **Refining the Arguments (Self-Correction during drafting):**
