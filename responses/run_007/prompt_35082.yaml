      *   **Setting:** Natural environment (bar, coffee shop, etc.).
      *   **Goal:** Help the user visualize arguments for their final paper.

  2.  **Character Development:**
      *   **Character A (The Mechanist/Neuroscience perspective):** Let's call him *Leo*. He needs to be grounded in physicalism, comfortable with reductionism, but not dismissive of phenomenology. He sees the brain as a machine.
      *   **Character B (The Agency/Compatibilist perspective):** Let's call her *Maya*. She needs to understand the neuroscience but argue for emergence, higher-order cognition, or the functional reality of choice. She shouldn't be a dualist (that's too easy to knock down); she needs to argue within the physicalist framework but find room for *real* agency.
