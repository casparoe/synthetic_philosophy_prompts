      *   *Check:* Is Maya too mystical? *Fix:* Keep her grounded. She shouldn't appeal to a soul. She should appeal to functional architecture (feedback loops, simulation).
      *   *Dennett Nuance:* Dennett is a compatibilist. He thinks free will is real *enough*. Leo is taking a harder determinist line than Dennett. Maya should channel Dennett's actual "Elbow Room" arguments.
      *   *The "Sphexishness" definition:* Ensure they define it clearly. It's not just "instinct," it's "insensitivity to environmental variation."

  6.  **Writing the Dialogue (Iterative Process):**
