  # Modal Epistemology: A Decision Tree for Conceivability & Possibility

  **Instructions:** Start at the **Entry Question**. Answer based on your intuitions about the cases described, not on which philosophers you have read. Follow the arrows to find your position in the logical space.

  ---

  ### **ENTRY: Does imagining a coherent scenario provide *any* justification for thinking it could actually obtain?**
  *(Example: You can imagine a planet with two suns. Does that give you even a slight reason to think such a planet is possible?)*

  *   **NO** $\rightarrow$ **MODAL SKEPTICISM**
      *   *Commitment:* Conceivability is purely psychological; it tells us about our minds, not the world.
      *   *Sub-positions:* *Error Theory* (Modal judgments are all false) vs. *Non-Cognitivism* (Modal judgments aren't truth-apt).
      *   *Note:* Often motivated by the lack of a causal link between imagination and modal facts.

  *   **YES** $\rightarrow$ Go to **Question 1**.

  ---

  ### **Q1: If you conceive of a scenario *ideally* (no logical errors, full rational reflection), does possibility follow *necessarily*?**
  *(Is the link a guarantee, or just strong evidence that could be overturned?)*

  *   **NO (It is defeasible evidence)** $\rightarrow$ **MODERATE / DEFEASIBLE RATIONALISM**
      *   *Commitment:* Conceivability is a reliable guide, but fallible. Cognitive limitations or hidden contradictions might fool us.
      *   *Sub-positions:* *Empiricist* (Grounded in experience) vs. *Weak Rationalist* (Grounded in reason but not infallible).
      *   *Note:* This view avoids the "Kripke problem" by denying the inference is strong enough to cover necessary truths.

  *   **YES (It is an entailment)** $\rightarrow$ Go to **Question 2**.

  ---

  ### **Q2: Consider the statement: "Water is not H₂O." You can conceive it ideally. Is this *metaphysically possible*?**
  *(Could the actual substance in our lakes have been chemically different, or is it impossible given what water *is*?)*

  *   **YES (It is possible)** $\rightarrow$ Go to **Question 3**.
      *   *Commitment:* You reject the Kripkean intuition that identity statements are necessary.
  *   **NO (It is impossible)** $\rightarrow$ Go to **Question 4**.
      *   *Commitment:* You accept that some truths are necessary but only discoverable empirically (a posteriori necessities).

  ---

  ### **Q3: When you say "It is possible," what are you describing?**
  *(Is possibility a feature of the world independent of us, or a limit of our description?)*

  *   **A Feature of the World (Realism)** $\rightarrow$ **STRONG RATIONALIST**
      *   *Commitment:* Ideal conceivability entails metaphysical possibility. Identity statements are contingent.
      *   *Sub-positions:* *Cartesian* (Clear & Distinct Perception) vs. *Contingent Identity Theorist*.
      *   *Diagnosis:* Maintains the strongest link between mind and world.

  *   **A Limit of Description (Anti-Realism)** $\rightarrow$ **HUMEAN / LOGICAL POSSIBILIST**
      *   *Commitment:* "Metaphysical possibility" just *means* "logical consistency." There is no deeper modal fact.
      *   *Sub-positions:* *Verificationist* vs. *Linguistic Conventionalist*.
      *   *Diagnosis:* Collapses the distinction between logical and metaphysical possibility.

  ---

  ### **Q4: Since conceivability did not yield metaphysical possibility here, what *did* it yield?**
  *(You conceived "Water $\neq$ H₂O", but it's impossible. So what status does that scenario have?)*

  *   **It is Logically/Epistemically Possible, but Metaphysically Impossible** $\rightarrow$ **TWO-DIMENSIONALIST**
      *   *Commitment:* **Distinguishes Logical from Metaphysical Possibility.** Conceivability tracks the first (primary intension), not the second (secondary intension).
      *   *Sub-positions:* *Chalmers-style* (Epistemic $\to$ Metaphysical for fundamental truths) vs. *Jackson-style* (Conceptual analysis).
      *   *Diagnosis:* Saves the rationalist insight by restricting its target domain.

  *   **It is Nothing; Conceivability Fails Here** $\rightarrow$ **KRIPKEAN ESSENTIALIST**
      *   *Commitment:* A posteriori necessities break the inference. Essence trumps imagination.
      *   *Sub-positions:* *Rigid Designation Theorist* vs. *Causal Theorist of Reference*.
      *   *Diagnosis:* Prioritizes metaphysical structure over epistemic access.

  ---

  ### **Notes on Logical Space & Gaps**

  **1. Indistinguishable Leaves:**
  *   **Strong Rationalist vs. Humean:** Both end up saying "Water $\neq$ H₂O is possible." The tree separates them via **Q3** (Realism vs. Anti-Realism about modality). In practice, without ontological commitments, these positions look identical regarding which scenarios are permitted.
  *   **Moderate Rationalist vs. Skeptic:** Both deny entailment. The difference is degree (evidence vs. no evidence). In borderline cases, a Moderate may look like a Skeptic if they find the evidence too weak to act on.

  **2. Unoccupied Combinations (The "Empty Quadrants"):**
  *   **The "Contradictory Rationalist":** *Ideal Conceivability Entails Metaphysical Possibility* **BUT** *"Water $\neq$ H₂O" is Metaphysically Impossible.*
      *   *Diagnosis:* **Incoherent.** If entailment holds, the scenario must be possible. To occupy this space, one must argue "Water $\neq$ H₂O" is *not* ideally conceivable (a move some Kripkeans attempt, but it shifts you to the Kripkean leaf).
  *   **The "Metaphysical Skeptic":** *Conceivability tracks Metaphysical Possibility* **BUT** *There is no distinction between Logical and Metaphysical Possibility.*
      *   *Diagnosis:* **Unstable.** This collapses into the Humean view. If there is no distinction, claiming to track "Metaphysical" specifically is vacuous.

  **3. The "Logical vs. Metaphysical" Turn:**
  *   The **Two-Dimensionalist** leaf is the only position that *requires* the distinction between Logical and Metaphysical possibility to function. For the Humean, the distinction is false; for the Kripkean, the distinction exists but conceivability doesn't track the Metaphysical side; for the Strong Rationalist, the two align.

