answer: |-
  ### The Strawson Filter: A Decision Procedure for Accountability

  This procedure translates P.F. Strawson's philosophical framework into a management tool. It is designed to be run in 30–45 minutes before a calibration or postmortem. It does not replace HR policy; it flags when HR policy must be engaged.

  **Pre-Work:** Gather the facts of the incident. Separate *outcome* (production down) from *behavior* (skipped tests, missed handoff).

  #### Step 1: The Excuse Check (Act-Specific)
  *Goal: Determine if the specific act reflected a lack of good will, or if external factors broke the link between will and outcome.*

  **Ask:**
  1.  Did the engineer have **reasonable knowledge** that this action was risky or wrong at the time?
  2.  Did they have **reasonable control** to prevent the outcome given the resources and time they had?

  *   **If NO to either:** **STOP.** This is an **Excuse**.
      *   *Action:* Do not hold the individual accountable. Focus on process fixes (training, guardrails, resourcing).
      *   *HR Flag:* None.
  *   **If YES to both:** Proceed to Step 2.

  #### Step 2: The Exemption Check (Agent-Specific)
  *Goal: Determine if the engineer is currently capable of participating in the normative relationship of accountability.*

  **Ask:**
  3.  Is there a known, significant impairment to their capacity to function as a standard participant (e.g., medical crisis, severe personal trauma, documented disability, or extreme skill mismatch for the assigned role)?
      *   *Note:* Do not diagnose this yourself. Rely on disclosures or HR guidance.

  *   **If YES:** **STOP.** This is an **Exemption**.
      *   *Action:* Suspend reactive attitudes (indignation/blame). Treat the situation as a support/accommodation case.
      *   *HR Flag:* **MANDATORY.** Engage HR/People Ops immediately regarding accommodations or leave.
  *   **If NO:** Proceed to Step 3.

  #### Step 3: The Good Will Check (Relationship-Specific)
  *Goal: Determine if the behavior indicates a breach of the mutual expectations required for teamwork.*

  **Ask:**
  4.  Does the behavior suggest **indifference** to the team's goals or safety (e.g., cutting corners for personal glory, ignoring repeated feedback, hiding mistakes)?

  *   **If NO:** (e.g., they made a genuine mistake despite knowing better and trying hard).
      *   *Action:* **Excuse (Weak).** Acknowledge the error, but treat it as a learning moment. Low-intensity feedback.
  *   **If YES:** Proceed to Step 4.

  #### Step 4: The Objective Stance Threshold (Risk-Specific)
  *Goal: Determine if the relationship is damaged enough that you must manage the risk rather than the person.*

  **Ask:**
  5.  Has this pattern persisted **after** previous accountability conversations (Step 3 actions)?
      *   *Note:* If this is the first occurrence, you generally stay in Step 3 (Reactive Attitudes).

  *   **If NO:** **STOP.** Engage **Reactive Attitudes**.
      *   *Action:* Have the accountability conversation. Express disappointment/indignation professionally. Demand a repair plan. Expect an apology. This is *not* punishment; it is recognizing them as a responsible agent.
  *   **If YES:** **Shift to Objective Stance.**
      *   *Action:* Stop trying to reason with them as a peer. Manage them as a risk. Initiate formal Performance Improvement Plan (PIP), role change, or termination.
      *   *HR Flag:* **MANDATORY.** This is now a compliance/documentation process.

  ---

  ### Running the Cases

  #### Case 1: Senior Engineer, Rushed Demo, Production Down
  *   **Step 1 (Excuse):** Did they know tests were required? **Yes.** Did they have control? **Yes** (chose to rush). -> *Proceed.*
  *   **Step 2 (Exemption):** Capacity impaired? **No.** -> *Proceed.*
  *   **Step 3 (Good Will):** Did this show indifference? **Yes.** Prioritizing a demo over stability is a choice that devalues team safety. -> *Proceed.*
  *   **Step 4 (Objective):** First occurrence? **Assume Yes.**
  *   **Result:** **Reactive Attitudes Appropriate.**
  *   **Action:** You must hold them accountable. In the postmortem, you cannot simply say "process failed." You must state: "You made a choice that violated our safety norms. I am disappointed. I need to know why you felt that trade-off was acceptable."
  *   **Why you won't like this:** You want to be "blameless." This feels like blaming. But Strawson argues that *withholding* this reaction treats the senior engineer like a child (Exemption) or a broken machine (Objective). To respect their seniority, you must demand better.

  #### Case 2: Junior Engineer, Data Loss, Admitted Confusion
  *   **Step 1 (Excuse):** Did they know it was risky? **No** (told lead they didn't understand). Did they have control? **No** (task assigned beyond skill without support).
  *   **Result:** **Excuse.**
  *   **Action:** Stop immediately. Do not hold the junior accountable. The failure belongs to the Lead/Process that allowed an unguarded task assignment.
  *   **HR Flag:** None.
  *   **Note:** This is the easy win. It protects the junior and highlights the systemic failure.

  #### Case 3: Solid Engineer, Bereavement, Missing Handoffs
  *   **Step 1 (Excuse):** Did they know handoffs matter? **Yes.** Control? **Compromised.**
  *   **Step 2 (Exemption):** Capacity impaired? **Yes** (Bereavement is a recognized temporary incapacity).
  *   **Result:** **Exemption.**
  *   **Action:** Suspend reactive attitudes. Do not express indignation. Treat this as a temporary accommodation.
  *   **HR Flag:** **YES.** Ensure leave/accommodation is documented properly so you aren't inadvertently discriminating.
  *   **Nuance:** This is temporary. If this continues for 6 months, Step 2 may eventually flip to "No" (capacity returns) or Step 4 (Objective Stance) if the role can no longer be held open.

  ---

  ### What This Procedure Cannot Do

  You asked for the plain truth about the limitations. There is a specific failure mode in Step 4 (The Objective Stance) that this procedure cannot detect.

  **The Procedure cannot distinguish between a Necessary Objective Stance and a Cowardly Objective Stance.**

  Strawson warns that taking the Objective Stance is always a "big deal." It is a withdrawal of human relationship.
  *   **Necessary:** You have had the accountability conversations (Step 3), the behavior hasn't changed, and the team is at risk. You move to Objective Stance (PIP/Exit) to protect the collective.
  *   **Cowardly:** You are uncomfortable with the emotional friction of Step 3 (expressing disappointment, demanding an apology). You skip the hard human conversation and jump straight to Objective Stance (documentation, cold management) because it feels safer and more "professional."

  In **Case 1**, if you skip the "Reactive Attitudes" step and go straight to "Objective Stance" (e.g., quietly documenting the incident for a future firing without telling the engineer it was a breach of trust), you are using the procedure as a cop-out. You are treating a moral agent as a risk to be mitigated because you don't want to have a difficult human interaction.

  Conversely, in **Case 3**, if you stay in "Exemption" forever because you are afraid to have the "Objective" conversation about business viability when the grief does not end, you are also failing. You are prioritizing your desire to be "kind" over the team's need for reliability.

  **The procedure gives you the *when*; it cannot give you the *why*.** Only you know if you are shifting stances to protect the team or to protect your own discomfort. If you use this tool to avoid looking an engineer in the eye and saying, "I expected better from you," you are eroding trust, not building it.
