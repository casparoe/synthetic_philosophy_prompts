answer: |-
  This is a sharp objection, and it cuts to the heart of the philosophical machinery driving moral trade. Your friend has constructed a *reductio ad absurdum* that targets the aggregative assumption underlying the theory.

  You are right to feel stuck between (2) and (3). However, the most robust philosophical move here is to **reject (3)**.

  Here is the breakdown of why (3) is the failure point, how to justify that rejection without arbitrariness, and what it costs the theory.

  ### The Diagnosis: Step (3) Assumes Consequentialism
  Step (3) claims: *"There's no principled cutoff between mildly bad and gravely wrong acts — the negative side can always be outweighed if the positive side is big enough."*

  This premise smuggles in a **consequentialist ontology of value**. It assumes that all moral disvalue is of the same *kind* (a cost on a single scale) and differs only in *degree* (magnitude). On this view, a rights violation is just a very expensive cost, but like any cost, it can be purchased if the benefit is high enough.

  A deontologist (or any non-consequentialist) denies this. For them, moral reasons come in different *categories*.
  *   **Costs/Goals:** These are fungible. (e.g., "I value saving animals, but saving humans is more urgent.")
  *   **Constraints/Permissions:** These are structural. (e.g., "I must not murder," regardless of the consequences.)

  In the vegetarian/poverty example, the "negative value" the vegetarian incurs is **opportunity cost** (not helping animals as much as they could). This is a *goal* they are compromising.
  In the murder example, the "negative value" is a **rights violation**. This is a *constraint*.

  Therefore, (3) is false because it treats constraints as if they were merely high costs. Rejecting (3) is not drawing an arbitrary line on a slider of "badness"; it is denying that the slider exists for certain types of actions.

  ### How to Defend Rejecting (3) Without Arbitrariness
  Your worry is that rejecting (3) "smuggles in a line I can't draw." The response is that the line is **conceptual, not quantitative.**

  1.  **The Vegetarian Case:** The vegetarian is trading *efficacy* for *cause priority*. They are doing something suboptimal according to their view, but not *forbidden*. The "negative value" is "less good than the best option."
  2.  **The Murder Case:** The deontologist is being asked to perform an action that is *forbidden*. The "negative value" is "moral prohibition."

  You do not need to specify exactly how many lives make murder okay. You simply assert that *no number of lives* converts a forbidden act into a permissible one within that moral framework. This is the definition of a **side-constraint**.

  By rejecting (3), you preserve the logic of moral trade for disagreements about **priorities** (where (2) holds) while blocking it for disagreements about **permissions** (where (2) does not hold).

  ### The Cost of This Rejection
  Rejecting (3) does come with a cost, which your friend should acknowledge in the paper. It limits the scope of moral trade.

  1.  **No Trading on Constraints:** Moral trade cannot resolve fundamental clashes between deontologists and consequentialists regarding rights. You cannot "trade" a murder for lives saved, because the deontologist cannot value the package as "net positive" in the required sense.
  2.  **Reduced Gains from Trade:** A significant portion of moral disagreement is about constraints (e.g., abortion, animal rights, punishment). If moral trade only works for disagreements within the "permissible set" (e.g., how to allocate surplus charitable funds), the potential welfare gains are smaller.

  However, this is a feature, not a bug. It prevents the theory from demanding moral monstrosities.

  ### An Alternative: Modifying Step (2)
  If your friend is worried that rejecting (3) feels too much like "special pleading" for deontology, they can instead **modify (2)** to make the permissibility condition explicit.

  *   **Original (2):** "If a combined package is better than no trade by your own lights, then you should make the trade."
  *   **Revised (2):** "If a combined package is better than no trade by your own lights **and involves only permissible actions**, then you should make the trade."

  This preserves the intuition you want to keep (cooperation is good when it makes things better) but builds in a "veto" for actions that are strictly forbidden.

  **Why this works:**
  In the vegetarian case, donating to poverty instead of animals is *permissible* (just suboptimal). So the trade goes through.
  In the murder case, killing is *impermissible*. So the trade is blocked.

  This avoids the "arbitrary line" worry because the line is drawn at the boundary of **permissibility**, which is already a core concept in ethics, rather than a new, arbitrary threshold of "badness."

  ### Summary Recommendation for the Paper
  1.  **Reject (3).** Argue that it conflates *moral costs* (which are aggregative) with *moral constraints* (which are lexical or absolute).
  2.  **Clarify the Vegetarian Example.** Ensure the example is framed as a trade of *resources* (money/time), not a trade of *violations*. The vegetarian isn't eating meat; they are diverting funds. This keeps their action in the "suboptimal but permissible" category.
  3.  **Accept the Cost.** Concede that moral trade cannot solve all moral disagreements. It works best for agents who share a common framework of permissibility but disagree on weighting or empirical facts.
  4.  **Refine the Normative Principle.** Adopt the Revised (2) above. This captures the truth of cooperation without entailing the monstrosity of (4).

  By taking this route, your friend saves the theory from the *reductio* without abandoning the core insight that cooperation under moral disagreement is often rational and good.
