  1. Does the safety case explicitly rely on future institutional continuity to maintain safety, and if so, does it provide a passive alternative should that continuity fail? If the proposal lacks a passive fallback, treat the assumption as a critical vulnerability rather than a benign background expectation.

  2. If humanity were known to cease existing one thousand years from now, would the stated ethical justification for this specific expenditure collapse? If the answer is yes, recognize that the proposal's intelligibility depends on confidence in humanity's future rather than immediate harm reduction.

  3. Does the proposal treat the continuation of humanity as a benign background fact or as a necessary condition for its own value? If the latter, distinguish it from benign assumptions by marking the proposal as ethically dependent on human survival.

  4. Does the proposal demand the panel accept a value judgement on whether protecting a potential future is sufficient? This requires a value judgement rather than a factual determination, so record dissenting views on whether intergenerational duty survives existential uncertainty.

  5. Does the proposal pretend to quantify existential uncertainty rather than admitting the limitation? Accept that admitting this limitation is the only satisfactory answer, as the procedure is likely to misfire on existential prediction.
