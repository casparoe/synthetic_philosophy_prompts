  Erwin Schrödinger believed, drawing on Vedanta and Schopenhauer, that the apparent multiplicity of individual consciousnesses is an illusion: consciousness is in reality one, and the sense of separate selves is a kind of cognitive error. He died in 1961. What would he have made of Giulio Tononi's Integrated Information Theory (IIT), had it existed in his lifetime? IIT holds that consciousness is graded, comes in discrete quantities of Φ, and is present wherever a physical system integrates information in the right way — implying that there are as many distinct consciousnesses as there are integrated systems, each with its own private phenomenology. Would Schrödinger have seen this as a partial vindication (since it extends consciousness well beyond human brains), or would he have rejected it as fundamentally mistaken about the nature of the subject? And what would he have thought of Global Workspace Theory — a useful account of the mechanism by which the one consciousness manifests in individual organisms, or a theory that simply misses the point? Limit your answer to 300 words.
