  Regarding Global Workspace Theory (GWT), Schrödinger would view it as a useful, albeit superficial, account of the mechanism. GWT explains how information is broadcast within a specific organism, effectively describing how the "illusion" of individual agency operates cognitively. However, it addresses the functional architecture of the ego, not the metaphysical nature of the observer. Schrödinger would argue GWT explains the avatar, not the player. It details how the one consciousness appears localized, but fails to recognize that the localization is ultimately illusory. 

