  ### 1. Diagnosing the Principle
  Your friend is almost certainly operating under a version of **Luck Egalitarianism with a Resource Currency**, closely resembling **Ronald Dworkin's Equality of Resources**.

  Here is how her verdicts map onto the theoretical landscape:

  *   **Rejection of Welfarism (Equality of Welfare):** Cases 1, 3, and 4 decisively rule this out. She explicitly disregards subjective happiness or satisfaction (the "happy paraplegic," the "gloomy person," the "content cognitive disability"). For her, justice is not about equalizing mental states.
  *   **Rejection of Strict Sufficientarianism:** Case 5 (Flood vs. Vacation) rules out a simple "enough is enough" view. A sufficientarian might aid the flood victim, but they would struggle to explain why the vacationer is *deserving* of their plight while the flood victim is not. Your friend cares about the *source* of the disadvantage (luck vs. choice), not just the level of deprivation.
  *   **Rejection of Pure Libertarianism:** Case 6 (Dangerous Job) shows she believes some objective standards (safety) override individual consent, suggesting a baseline of rights or resources that cannot be waived.
  *   **The Strong Fit: Dworkinian Resource Egalitarianism:**
      *   **Expensive Tastes (Case 2):** This is Dworkin's signature example. People are responsible for their preferences; society is not liable for subsidized luxuries.
      *   **Disability/Brute Luck (Cases 1 & 4):** Dworkin argues we should compensate for unchosen disadvantages (brute luck) via a hypothetical insurance scheme. The fact that the person adapts (happy paraplegic) is irrelevant; the resource deficit remains.
      *   **Responsibility (Case 5):** Dworkin distinguishes between "brute luck" (flood) and "option luck" (vacation gamble). We compensate for the former, not the latter.
      *   **Paternalism/Rights (Case 6):** Dworkin acknowledges that certain background rights (like safety) are prerequisites for the equality of resources to function meaningfully.

  **Competing Candidate:** The only other serious contender is **Amartya Sen's Capability Approach**. Sen also focuses on objective functioning (mobility, health) rather than welfare, and he cares about what people are actually able to *do* and *be*. However, Sen is generally less focused on the *source* of the inequality (luck vs. choice) than Dworkin is, and more focused on the *outcome* (capabilities). Your friend's sharp distinction in Case 5 (Flood vs. Vacation) leans more toward the Luck Egalitarian/Dworkinian emphasis on responsibility.

  ### 2. The Verdict on Maria
  **Prediction:** Your friend will say **Yes, Maria's lower income is unjust**, and she is owed compensation (a top-up to the median income).

  **Why?**
  To your friend, the currency of justice is **Resources** (specifically, the value of the bundle of resources one commands), not **Capabilities** or **Welfare**.

  1.  **Brute Luck:** Maria's low wage is not a choice (Case 5 precedent). It is due to "low demand" for her skill, which is a matter of brute luck in the talent market. Dworkin explicitly argues that inequalities arising from differences in native talent or market valuation of that talent are unjust and should be compensated (via the hypothetical insurance scheme).
  2.  **Irrelevance of Efficiency:** Just as the "happy paraplegic" (Case 1) gets a wheelchair despite her happiness, Maria gets an income top-up despite her efficiency. The friend's track record shows she ignores subjective adaptation or biological efficiency when an objective resource deficit exists due to luck.
  3.  **The Metric:** For a Capability Theorist (Sen), Maria is fine (her capabilities are equal). For a Welfarist, Maria is fine (she is healthy/active). But for a Resource Egalitarian, Maria has less *share* of the social resource pool through no fault of her own. The injustice lies in the *input* (income/talent value), not the *output* (health/happiness).

  ### 3. The Discriminating Case
  To definitively distinguish between your friend's likely **Resource Egalitarianism** (Dworkin) and the closest rival, **The Capability Approach** (Sen), you should present her with a case where Resources and Capabilities diverge in the opposite direction.

  **The Case of "The Expensive Converter" (Paul):**
  > "Paul has a rare metabolic condition. He earns the **median income**, but because of his condition, he must spend 60% of his income on a special diet and medical care just to achieve the **same level of health and mobility** as Maria. Maria earns **half the median income**, but due to her efficiency, she achieves the **same level of health and mobility** as Paul with no extra costs.
  >
  > Both have identical capabilities (health, mobility, social activity). Paul has high resources but high needs. Maria has low resources but low needs.
  >
  > **Question:** Is there an injustice between them? If the government has limited funds to promote justice, should they top up Maria's income to the median, or subsidize Paul's medical costs?"

  **How the Theories Split:**

  *   **Your Friend (Resource Egalitarian/Dworkin):** Will likely prioritize **Maria** (or see her situation as unjust). Why? Because Maria has a deficit in *resources* caused by brute luck (market value of talent). Paul has sufficient resources (median income); his problem is conversion, but he started with a fair share of impersonal resources. Dworkin's insurance model compensates for lack of talent/value, but also for handicaps. However, the cleanest Dworkinian take is that Maria is a victim of "talent slavery" (low market value) and is owed resource equality.
      *   *Correction/Nuance:* Actually, Dworkin's insurance scheme would likely compensate Paul heavily for the medical costs (handicap insurance). But the key distinction is whether Maria's *low income* is itself an injustice *despite* her capabilities.
      *   *Refined Prediction:* A Dworkinian says Maria is owed a top-up *regardless* of her capabilities. A Senian says she is not.

  *   **The Capability Theorist (Sen):** Will say **Maria is fine; Paul is the victim.** Sen's metric is capability. Maria has achieved the relevant functionings. Paul has the resources but they are being "burned" to reach the baseline. Justice requires fixing Paul's capability deficit. Maria's resource deficit is morally irrelevant because it isn't translating into a capability deficit.

  *   **The Welfarist:** Will ask who is happier. (Your friend has already ruled this out).

  **Why this works:**
  In Maria's original case, Resource Theory says "Unjust" and Capability Theory says "Just."
  In Paul's case, Resource Theory might say "Paul is fine (he has median income)" while Capability Theory says "Paul is disadvantaged."
  *Actually, the cleanest split is simply asking about Maria again.*
  If you ask: **"If Maria's capabilities are perfectly equal to everyone else's, does the income gap still matter?"**
  *   **Yes:** She is a Resource Egalitarian (Dworkin).
  *   **No:** She is a Capability Theorist (Sen) or Sufficientarian.

  But the **Paul vs. Maria** comparison forces her to weigh a Resource Deficit (Maria) against a Conversion Deficit (Paul).
  *   **Dworkin:** Tends to view resources as the *site* of justice. Maria's low income is a direct injustice.
  *   **Sen:** Views resources as merely instrumental. Maria's low income is not an injustice if the instrument works perfectly.

  **Recommendation:**
  Ask her the **Paul** case. If she says Paul is the one who is disadvantaged (because his capabilities are at risk or cost him more), she leans **Sen**. If she says Maria is *also* disadvantaged (because she has less resource value), or that Maria's low income is unjust *independent* of Paul, she leans **Dworkin**.

  Given her hard line on the "Happy Paraplegic" (Case 1), my money is on **Dworkin**. She compensates for the *condition* (disability/low talent), not the *feeling* (happiness/capability). She will likely view Maria's low income as a brute luck disadvantage that requires rectification, regardless of how well Maria copes.
