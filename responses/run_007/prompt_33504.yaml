prompt: |-
  Okay so I just spent like two hours arguing with my roommate about split-brain patients and we cannot agree on this one thing. He's taking a philosophy of mind class and he's convinced that split-brain cases show that consciousness is NOT unified — like, there are literally two seperate conscious minds in one skull after the corpus callosum is cut. I pushed back and said that's way too strong a conclusion, because even in split-brain patients there's still a single organism acting in the world, and the disunity only shows up in these very contrived experimental setups where you're feeding different information to each hemisphere. Most of the time the patient walks around and acts like one person.

  But here's what I'm actually confused about, and this is where we got totally stuck: we realized we couldn't even agree on what "unity of consciousness" means in a way that's precise enough to be tested by the split-brain data. Like, there's the phenomenological sense — my experience just feels unified to me, everything shows up in one conscious field. But that's just a subjective report, and maybe the right hemisphere also has a subjective field it just can't talk about. Then there's functional unity, where different cognitive processes coordinate and access each other's outputs. And there's also this idea of there being a single "subject of experience" — like a numerical oneness of the thing that's doing the experiencing. We kept going in circles about whether the split-brain findings challenge all three of these, or just some of them, or maybe none of them if you're careful enough.

  Can you walk me through this? Specifically, I want to understand: what are the different senses in which philosophers talk about the unity of consciousness, and which of these senses are genuinely threatened by split-brain findings versus which ones survive pretty much intact? My roommate thinks it's all or nothing — either consciousness is unified or it isn't — but I feel like the real picture has to be more nuanced than that.
reasoning: |-
