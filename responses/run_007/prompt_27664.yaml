answer: |-
  You have stumbled upon one of the most profound difficulties in the foundations of probability, a problem that troubled Keynes, Bertrand, and Jaynes in equal measure. You are quite right to feel uneasy: the naive Principle of Indifference is, strictly speaking, incoherent when applied to continuous variables without further qualification. It is not a law of logic, but a heuristic that requires a deeper justification.

  There is indeed a candidate principle that rescues your intuition in the case of the Earth whilst explaining why the cube and chord cases are problematic. It is known as the **Principle of Transformation Groups**, or simply the **Principle of Invariance**. Most famously championed by the physicist E. T. Jaynes, it suggests that we should not assign probabilities based on mere ignorance, but rather based on the symmetries inherent in the problem statement.

  ### The Guiding Principle: Invariance

  The core idea is this: if your state of knowledge is invariant under a certain transformation (such as rotation, translation, or scaling), then your probability distribution must also be invariant under that transformation. You do not assign probabilities because you are ignorant; you assign them because the physical or geometrical symmetries of the situation demand it.

  Let us apply this to your three examples to see which verdicts survive.

  **1. The Point on the Earth**
  You stated you are happy to say a random point is as likely to land in any two equal-area patches, but you balk at saying it is as likely to be at latitude 80° as at the equator.
  *   **Verdict:** **Keep this.**
  *   **Reasoning:** The description "a random point on the Earth's surface" implies rotational invariance. The Earth is a sphere; there is no physical feature distinguishing the equator from the poles in the abstract problem. A uniform distribution over latitude would bunch points near the poles, violating rotational symmetry. A uniform distribution over surface area preserves this symmetry. Your gut was correct because it recognised the underlying geometry.

  **2. The Chords in a Circle (Bertrand's Paradox)**
  You listed three methods yielding 1/3, 1/2, and 1/4.
  *   **Verdict:** **Drop the idea that there is a unique answer without further specification.**
  *   **Reasoning:** The phrase "pick a random chord" is ill-posed. It does not specify a symmetry group. However, Jaynes argued that if we demand the distribution be invariant under translation, rotation, and scaling (i.e., the circle could be anywhere, any size, and any orientation), only one method survives. Interestingly, Jaynes' invariance argument favours the method yielding **1/2** (picking the midpoint by its distance from the centre).
  *   **Caveat:** Most modern statisticians would argue that unless a physical mechanism is described (e.g., "throw a straw onto a circle"), the question has no answer. Your intuition that these are conflicting is correct; the principle of indifference alone cannot resolve them.

  **3. The Cube (The Volume Paradox)**
  You are torn between a uniform side length (probability 1/2) and a uniform volume (probability 1/8).
  *   **Verdict:** **Give up both.**
  *   **Reasoning:** There is no symmetry here that distinguishes length from volume. Unlike the sphere, a cube factory is a physical mechanism. Does the machine set a length and cut? Or does it pour a fixed mass of molten metal and let it cool? Without knowing the *generative process*, there is no invariance to appeal to. Length is not more fundamental than volume; they are mathematically equivalent descriptions. To assign a probability based on indifference is to pretend knowledge you do not have. You must accept that the probability is undefined until the mechanism is specified.

  ### A Prediction for a New Case

  To test this principle, let us consider a case you did not list: **The Wine/Water Paradox** (attributed to von Mises).

  **The Case:**
  A mixture of wine and water is provided. You are told the ratio of wine to water is somewhere between $1/2$ and $2$. You are asked: what is the probability that the ratio is less than $1$ (i.e., more water than wine)?

  **The Conflict:**
  1.  If you assume the *ratio* $r$ is uniformly distributed between $0.5$ and $2$, the range is $1.5$. The portion less than $1$ is $0.5$. Probability = $0.5 / 1.5 = 1/3$.
  2.  If you assume the *inverse ratio* (water to wine) is uniformly distributed, you get a different answer.

  **The Invariance Prediction:**
  The Principle of Transformation Groups asks: what is invariant here? Ratios are scale-invariant. If we change the units (from litres to gallons), the ratio remains the same. The appropriate measure for scale-invariant quantities is the **logarithm** of the variable (Jeffreys' prior).
  If we assume a uniform distribution over $\log(r)$, the calculation changes.
  $\log(0.5) \approx -0.301$
  $\log(2) \approx 0.301$
  $\log(1) = 0$
  The range is symmetric around 0. The probability that $\log(r) < 0$ is exactly **1/2**.

  Therefore, the principle predicts that if the problem implies scale invariance (which ratios usually do), the probability is 1/2, not 1/3.

  ### Summary of Required Sacrifices

  To align your worldview with the Principle of Invariance, you must make the following adjustments:

  1.  **Retain** your verdict on the **Earth**. It is the only one of your examples grounded in a genuine physical symmetry (rotational invariance).
  2.  **Abandon** the conviction that the **Cube** problem has a solution based on indifference. You must accept that probability is not a measure of pure ignorance, but of information regarding the generative process. Without knowing how the machine cuts, no probability exists.
  3.  **Refine** your view on **Bertrand's Chords**. While you were right to see a contradiction, the Principle of Invariance actually rescues one specific answer (1/2) *if* we assume the problem implies translation and rotation invariance. However, in practical terms, it is safer to say the question is incomplete without a physical description.

  In short, your intuition regarding the Earth was not luck; it was a recognition of symmetry. Your confusion regarding the cube was not a failure of logic, but a correct detection of a missing premise. The Principle of Indifference is not dead, but it must be shackled to the Principle of Invariance to prevent it from leading us into paradox.
