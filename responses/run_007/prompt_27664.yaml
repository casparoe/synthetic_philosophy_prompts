      *   **Questions:**
          1.  Is there one principle (or small set) that resolves these?
          2.  What does it predict for a new case?
          3.  Which of the user's current verdicts must be given up?
      *   **Constraint:** Write in British English.

  2.  **Deconstruct the Philosophical/Mathematical Problem:**
      *   The Principle of Indifference states that if there are $N$ mutually exclusive and collectively exhaustive possibilities, and no reason to prefer one over the other, assign probability $1/N$ to each.
      *   *Problem:* It's parameterisation dependent. As the user noted, uniform distribution on $x$ is not uniform on $x^2$ or $x^3$.
      *   *The Earth Example:* This is the key clue. The user accepts uniform area measure (surface area) but rejects uniform latitude measure. Why? Because "random point on a sphere" implies rotational invariance (symmetry). Uniform latitude violates this (bunching at poles).
      *   *The Cube Example:* This is trickier. There is no inherent physical symmetry distinguishing length from volume unless we specify the *process*.
      *   *Bertrand's Paradox:* Similar to the cube. "Random chord" is ill-defined without a physical generation method.

  3.  **Identify the Solution/Resolution:**
      *   There isn't a single "magic" principle that saves the naive PoI. The naive PoI is fundamentally flawed when applied to continuous variables without specifying the *measure* or the *generative process*.
      *   *Candidate 1: The Principle of Transformation Groups (Jaynes).* Edwin Jaynes proposed using symmetry/invariance to determine the prior. If the problem description is invariant under certain transformations (scaling, rotation, translation), the probability distribution should be too.
      *   *Candidate 2: Physicalism/Process Specification.* Probabilities aren't about ignorance; they're about physical propensities. You must specify *how* the random variable is generated.
      *   *Candidate 3: Maximum Entropy.* (Related to Jaynes). Choose the distribution with maximum entropy subject to known constraints.

      *   *Best Fit for the User's Intuitions:* The user's Earth example aligns perfectly with **Jaynes' Principle of Transformation Groups** (specifically rotational invariance). The user rejects uniform latitude because it violates the symmetry of the sphere.
      *   *Applying to the Cube:* Jaynes' approach suggests we need to look for scale invariance or other symmetries. However, the cube problem is often cited as a case where PoI *fails* without physical context. If the machine cuts cubes, how does it operate? If it sets a length, $L$ is uniform. If it pours material, $V$ might be uniform. Without knowing the mechanism, the problem is ill-posed.
      *   *Applying to Bertrand:* Jaynes showed that if you demand invariance under rotation, translation, and scaling, you get a specific solution (often the 1/2 one, depending on the exact formulation of invariance required). But generally, the consensus is that "random chord" is meaningless without a method.

  4.  **Formulate the Argument:**
