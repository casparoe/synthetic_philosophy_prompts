  1. The issue

  The problem of old evidence arises because standard Bayesian confirmation defines evidence $E$ as confirming hypothesis $H$ only if $P(H|E) > P(H)$. By conditionalization, this requires $P(E) < 1$. However, historically significant evidence (like Mercury's perihelion) is often known with certainty ($P(E)=1$) before the theory (like General Relativity) is formulated. Consequently, standard Bayesianism implies such evidence cannot confirm the theory, contradicting scientific practice.

  Ellen argues this discrepancy is fatal, showing Bayesianism cannot model actual scientific reasoning. Marcus contends the formalism can be saved by relaxing idealizations. He proposes two patches: evaluating counterfactual priors (ignoring $E$) or modeling the learning of logical entailments ($T \vdash E$) rather than $E$ itself. The stake is whether Bayesianism is a rigid formal structure that fails historical cases or a flexible framework adaptable to human cognitive limitations. Ellen fears these patches alter the theory's substance; Marcus sees them as necessary corrections to false idealizations like logical omniscience.

  2. Move-by-move adjudication

  The following adjudication evaluates the dialectical strength of each move.

  (1) **Clearly right.** Ellen correctly identifies the formal contradiction. In standard Bayesian conditionalization, if $P(E)=1$, then $P(H|E)$ must equal $P(H)$, rendering confirmation impossible. Her appeal to the historical case of Mercury and General Relativity is the canonical example in the literature. She correctly diagnoses that a theory of confirmation failing to account for historical theory acceptance is deficient.

  (2) **Partly right.** Marcus's counterfactual proposal is a standard maneuver in the literature. It captures the explanatory intuition: GR is confirmed because it made the data likely compared to rivals. However, it is partly mistaken because it shifts the analysis from the actual epistemic state to a hypothetical one. While formally coherent, it risks irrelevance to the actual agent's justification, as Ellen will note.

  (3) **Clearly right.** Ellen's objection regarding "subtracting" evidence is decisive against simple counterfactuals. There is no unique, rational method for constructing an "ur-prior" by removing known evidence. Different reconstruction methods yield different confirmation values, introducing arbitrariness. Furthermore, she correctly insists that confirmation theory should explain actual support, not hypothetical support in a state of ignorance no scientist occupied.

  (4) **Partly right.** Marcus's shift to logical omniscience is the most robust Bayesian defense (akin to Garber's solution). It is right that standard Bayesianism falsely idealizes agents as knowing all logical consequences. By treating the discovery of the entailment ($T \vdash E$) as the new information, confirmation becomes possible. However, it is partly mistaken because it requires modifying the probability algebra to treat logical truths as uncertain, which conflicts with standard axioms. Specifically, standard probability theory assigns probability 1 to all logical truths. Relaxing this requires a non-standard probability logic, which complicates the mathematics significantly. This makes the solution technically demanding.

  (5) **Partly right.** Ellen is right that this relocates the difficulty. If logical truths aren't certain, the foundation of probability theory shakes. She is correct that priors over entailments are under-constrained. However, she is slightly mistaken to dismiss this as merely "obscure"; modeling logical uncertainty is a serious field of study. Still, her point stands that this solution introduces new parameters without unique constraints. This undermines the objectivity of the confirmation measure, making it dependent on arbitrary assignments of logical probability. Consequently, the solution may lack the normative force required to guide rational belief.

  (6) **Partly right.** Marcus is right that all Bayesian models require priors, so this isn't a unique flaw. He is also empirically correct that scientists are not logically omniscient. However, his claim that priors can be tied to "derivational work" is vague. It suggests a sociological metric for logical probability, which risks conflating psychological effort with logical support. It defends the model's applicability but admits its precision is limited. It implies that confirmation varies based on how hard a scientist worked, which seems counterintuitive for a logical theory of support. Thus, while it saves the model, it changes its character from logical to sociological.

  (7) **Clearly right.** This is Ellen's strongest philosophical point. She identifies that the solution changes the *nature* of confirmation. If confirmation depends on learning a logical relation, it becomes a story about psychological updates regarding logic, not about the evidential relationship between data and theory. This saves the formalism but abandons the original intuition that evidence itself confirms theories.

  (8) **Partly right.** Marcus defends the subjective Bayesian definition: confirmation is rational credence change under *any* new information. He is right that logical learning counts as information. However, he glosses over Ellen's distinction. By making confirmation depend on the agent's logical acumen rather than the evidence's relation to the hypothesis, he alters the normative force of the theory. It becomes a theory of learning, not necessarily of evidential support.

  Collectively, the exchange reveals a stalemate between formal consistency and empirical adequacy.

  3. What both parties are missing

  Both parties operate under a shared assumption that confirmation must be modeled exclusively as a diachronic change in credence via conditionalization. They miss the crucial distinction between dynamic updating and synchronic support. If confirmation is defined synchronically—assessing whether $H$ is probable given $E$ regardless of when $E$ was learned—the problem largely dissolves. General Relativity is supported by Mercury's perihelion because the conditional probability $P(GR | Mercury)$ is high, not because scientists updated on Mercury yesterday. Ellen assumes Bayesianism must track historical psychology; Marcus assumes it must track rational updates. Neither considers that Bayesianism might best serve as a logic of support rather than a history of discovery.

  Furthermore, both overlook the potential integration of Inference to the Best Explanation (IBE). Marcus hints at it with "entailment," but the core intuition behind old evidence is often explanatory: GR *explained* the anomaly where others failed. A hybrid account might treat explanatory power as a prior booster independent of conditionalization. By sticking strictly to conditionalization mechanics, they fight over how to force the square peg of historical discovery into the round hole of updating, rather than questioning whether updating is the only metric of confirmation. The debate remains trapped within a narrow view of Bayesianism as solely about learning events, ignoring its potential role as a static logic of scientific relations.

  However, adopting a purely synchronic view carries costs. It severs the link between confirmation and rational belief change, making confirmation irrelevant to decision-making. If $P(H|E)$ is high but I already knew $E$, why should I act differently? Thus, the diachronic element matters. The missing consideration is not just choosing one, but explaining how they relate. A complete theory needs to explain why synchronic support matters for diachronic rationality. Neither Ellen nor Marcus addresses how a solution preserves the normative force of confirmation if it disconnects from the actual learning event. They argue over how to save the update rule, missing the chance to redefine the relationship between logical support and psychological change.

  4. Overall verdict

  Ellen is more right regarding the theoretical integrity of Bayesianism. She correctly identifies that Marcus's solutions alter the fundamental definition of confirmation from an evidential relation to a psychological learning event. If Bayesianism cannot handle old evidence without redefining its inputs, it fails as a universal logic of science. However, Marcus is more right about the framework's resilience. Bayesianism is a tool for modeling rationality, and relaxing logical omniscience makes it more psychologically realistic.

  The verdict depends on one's goal. If confirmation theory must describe actual historical justification, Ellen wins: the patches are ad hoc. If the goal is normative guidance for ideal agents approximating reality, Marcus wins: the patches are necessary idealizations. Ultimately, Marcus saves the practice of Bayesianism, but Ellen wins the philosophical argument that the "solution" changes the subject. The problem of old evidence remains a significant scar on the theory, showing it models learning better than it models support.
