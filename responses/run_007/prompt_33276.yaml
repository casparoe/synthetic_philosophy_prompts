prompt: |-
  I'm a philosopher who's been defending a version of the Lucas-Penrose argument—basically that Gödel's first incompleteness theorem shows the human mind isn't a Turing machine, because we can recognize the truth of the Gödel sentence for any consistent formal system we can understand, while the system itself can't prove it. I'm presenting this to a mixed audience next term that includes a couple of theoretical computer scientists, and I want to see what my argument looks like from inside their framework before they dismantle it.

  Restate the core anti-mechanist move from Gödel in the vocabulary of a working theoretical computer scientist—think Turing machines, the halting problem, proof systems as enumerators, the difference between proving consistency and assuming it, undecidability, all of that. Be as faithful as you can. Then give me the residue report: what translates cleanly, what you had to fudge, and what has no counterpart at all in the CS vocabulary. And the real question I'm after: is the untranslatable stuff where the philosophy is doing genuine work, or is it where the argument is smuggling something in?
