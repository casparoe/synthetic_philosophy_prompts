answer: |-
  # The Expected Suffering Minimization Protocol (ESMP)
  **Version:** 1.0 (Procurement Use Only)  
  **Time Allocation:** 4 Hours per Proposal  
  **Owner:** University Dining Procurement  
  **Sign-Off:** Sustainability & Ethics Committee (for Value Judgments)

  ## Purpose
  To select protein contracts that minimize **Expected Suffering**. This includes farmed animals, wild animals affected by crop production, and wild animals affected by climate change. This procedure does not calculate a single "score." It identifies whether one option is *dominant* (better under all reasonable assumptions) or if the choice depends on unresolved value judgments (which must go to the Committee).

  ## Part 1: The Procedure Checklist

  ### Step 1: Gather Standardized Inputs (45 Minutes)
  *Action:* Request the following data from the supplier. If unavailable, use the **Standard Coefficients** (Appendix A).
  1.  **Protein Yield:** Kg of edible protein per unit purchased.
  2.  **Feed Conversion Ratio (FCR):** Kg of feed required per Kg of protein produced. (Skip for plant-only).
  3.  **Land Use:** Hectares per ton of protein.
  4.  **Lifecycle Emissions:** Kg CO2e per Kg of protein.
  5.  **Welfare Certification:** (e.g., Global Animal Partnership, Organic, None).

  *   **Sufficient Answer:** Data sheet received or Standard Coefficients applied.
  *   **Stop Condition:** If supplier refuses all data, **Reject Proposal** (Insufficient transparency to calculate suffering).

  ### Step 2: Calculate Farmed Animal Suffering Units (FASU) (45 Minutes)
  *Action:* Estimate the direct suffering of the animals raised for this product.
  1.  **Count:** Calculate animals required per 1,000 meals. (Use Standard Coefficients if unknown).
  2.  **Intensity:** Assign a Welfare Weight (1.0 = Standard Industrial, 0.5 = High Welfare, 0.1 = Wild/Foraged).
  3.  **Duration:** Assign a Life Duration Weight (1.0 = Standard Slaughter Age, 1.5 = Extended Life).
  4.  **Formula:** `Count × Intensity × Duration = Total FASU`.

  *   **Sufficient Answer:** A comparative total (e.g., Option A = 500 FASU, Option B = 50 FASU).
  *   **Note:** For plant products, FASU is **0** (no farmed animals).

  ### Step 3: Calculate Wild Animal Suffering Units (WASU) (90 Minutes)
  *Action:* Estimate suffering caused to wild animals by growing feed or crops and land use.
  1.  **Crop Deaths (Feed & Product):**
      *   If Animal Product: Calculate feed mass required (from Step 1). Apply *Crop Death Rate* (Standard: 10 small wild animals/ton of grain).
      *   If Plant Product: Calculate crop mass required. Apply *Crop Death Rate*.
      *   *Note:* Grass-fed ruminants with **zero grain feed** score **0** here.
  2.  **Land Displacement:**
      *   Compare Land Use (Step 1) against baseline land type.
      *   **Intensive Cropland:** High displacement (Weight 1.0).
      *   **Marginal Pasture:** Low displacement (Weight 0.2).
      *   **Deforestation:** Critical displacement (Weight 5.0).
  3.  **Formula:** `(Feed Mass × Crop Death Rate) + (Land Use × Displacement Weight) = Total WASU`.

  *   **Sufficient Answer:** A comparative total.
  *   **Stop Condition:** If Land Use involves deforestation (e.g., Amazon Soy), **Flag for Automatic Committee Review**.

  ### Step 4: Calculate Climate Suffering Proxy (CSP) (45 Minutes)
  *Action:* Convert emissions into expected future suffering (drought, habitat loss).
  1.  **Emissions:** Use Kg CO2e from Step 1.
  2.  **Weighting:** Apply a flat multiplier (Standard: 1 WASU per 10 Kg CO2e).
  3.  **Formula:** `Total Emissions / 10 = CSP`.

  *   **Sufficient Answer:** A comparative total.
  *   **Note:** This step acknowledges climate change harms wild animals. It does not count human suffering.

  ### Step 5: The Existence Filter (Value Judgment) (15 Minutes)
  *Action:* Determine if "bringing animals into existence" counts as a harm or a benefit.
  1.  **Question:** Does the fact that these farmed animals would not exist without this contract count as a *negative* (they suffer) or a *positive* (they have a life worth living)?
  2.  **Procurement Role:** **DO NOT DECIDE.**
  3.  **Procedure:**
      *   If Option A has higher FASU than Option B, but Option A involves animals with "High Welfare" (Weight < 0.5 in Step 2):
      *   **Mark as "Existence Ambiguity."**
      *   **Hand to Committee.**

  *   **Sufficient Answer:** A binary flag: [Resolved by Data] or [Requires Committee Value Judgment].
  *   **Stop Condition:** If the choice hinges entirely on whether existence is a benefit, **Escalate to Committee**.

  ### Step 6: Dominance Check & Recommendation (45 Minutes)
  *Action:* Compare Option A (Current) vs. Option B (Proposal).
  1.  **Total Expected Suffering Range:** Sum FASU + WASU + CSP for both.
  2.  **Dominance Test:**
      *   Does Option B have lower suffering across **all three** categories (FASU, WASU, CSP)? → **Approve.**
      *   Does Option B have higher suffering in one category (e.g., WASU) but lower in others (e.g., FASU)? → **Escalate.**
      *   Is the difference within the margin of error (±20%)? → **Escalate.**
  3.  **Final Output:** A one-page memo stating: "Option B reduces Farmed Suffering by X%, but increases Wild Suffering by Y%. Decision rests on weighting of Wild vs. Farmed suffering."

  ---

  ## Part 2: Application to Three Proposals

  Below is the procedure run on three actual contract renewal scenarios. **Standard Coefficients** (Appendix A) were used where supplier data was missing.

  ### Proposal 1: Replace Beef (Grain-Fed) with Chicken (Standard)
  *   **Step 1 (Inputs):** Chicken has 4x better feed conversion, 10x lower emissions, 5x less land use than beef.
  *   **Step 2 (FASU):** Chicken requires 50x more individual lives per kg protein. However, Welfare Weight is similar (Industrial). **Result:** Chicken FASU is higher due to sheer count, but duration is shorter. Net FASU is roughly comparable or slightly higher for chicken.
  *   **Step 3 (WASU):** Chicken feed (corn/soy) causes crop deaths, but total feed mass is 4x lower than beef. **Result:** Chicken WASU is significantly lower.
  *   **Step 4 (CSP):** Chicken emissions are drastically lower. **Result:** Chicken CSP is lower.
  *   **Step 5 (Existence):** Both are industrial. No "life worth living" claim. **Result:** No Escalation.
  *   **Step 6 (Dominance):** Chicken dominates on Wild Suffering and Climate. Farmed Suffering is a wash (more lives, less suffering per life).
  *   **Recommendation:** **APPROVE.**
  *   **Reasoning:** Efficiency gains in land and feed reduce wild animal deaths and climate harm enough to offset the higher count of individual chickens.

  ### Proposal 2: Replace Chicken with Soy-Based Patty (Conventional)
  *   **Step 1 (Inputs):** Soy has zero feed conversion loss. Lowest emissions. Moderate land use.
  *   **Step 2 (FASU):** **Zero.** (No farmed animals).
  *   **Step 3 (WASU):** **High.** Conventional soy involves intensive tillage (killing field mice, snakes) and heavy pesticide use (insects). Land use is lower than beef but higher than chicken per protein unit due to processing loss.
      *   *Calculation:* 1 ton Soy Protein ≈ 15,000 estimated small wild animal deaths (crop + habitat).
      *   *Comparison:* 1 ton Chicken Protein ≈ 10,000 estimated small wild animal deaths (feed crops).
  *   **Step 4 (CSP):** Soy is lowest.
  *   **Step 5 (Existence):** Not applicable (no animals brought into existence).
  *   **Step 6 (Dominance):** Soy wins on FASU (0 vs High) and CSP. **Chicken wins on WASU** (due to feed efficiency vs. direct crop tillage).
  *   **Recommendation:** **ESCALATE TO COMMITTEE.**
  *   **Reasoning:** This is a trade-off between *Farmed* Suffering (Chicken) and *Wild* Suffering (Soy). Procurement cannot weigh a chicken's life against a field mouse's life. The Committee must decide if eliminating farmed suffering justifies increasing wild suffering.

  ### Proposal 3: Replace Grain-Fed Beef with Local Grass-Fed Beef
  *   **Step 1 (Inputs):** Grass-fed has higher land use, similar/higher emissions (methane), **zero feed crops**.
  *   **Step 2 (FASU):** Similar count to grain-fed. Welfare Weight is lower (0.5 vs 1.0) due to pasture access. **Result:** FASU is roughly halved compared to grain-fed.
  *   **Step 3 (WASU):** **Zero Crop Deaths.** No grain feed means no tillage deaths. Land is marginal pasture (low wild displacement weight).
      *   *Calculation:* Grass-Fed WASU is 90% lower than Grain-Fed (which requires massive corn/soy feed).
      *   *Comparison:* Grass-Fed WASU is **lower** than the Soy Patty (Proposal 2) because soy requires tillage and grass-fed requires only grazing on existing pasture.
  *   **Step 4 (CSP):** Higher than chicken and soy.
  *   **Step 5 (Existence):** **FLAG.** Pasture-raised animals may have "lives worth living." This is a value judgment.
  *   **Step 6 (Dominance):**
      *   Vs. Grain-Fed Beef: Grass-Fed dominates (Lower FASU, Lower WASU, Higher CSP). **Approve.**
      *   Vs. Soy Patty (Proposal 2): Grass-Fed has Higher FASU (animals vs none) and Higher CSP. **BUT** Grass-Fed has Lower WASU (Grazing vs Tillage).
  *   **Recommendation:** **APPROVE GRASS-FED BEEF OVER SOY PATTY.** (Counter-Intuitive Result).
  *   **Reasoning:** Under the ESMP, the **Wild Animal Suffering (WASU)** from conventional soy tillage and monoculture habitat loss exceeds the **Farmed Animal Suffering (FASU)** of a small number of pasture-raised cattle. Because the procedure weights physical death/suffering of wild animals as equivalent to farmed animals, the zero-tillage beef profile minimizes *total* expected suffering, despite the climate penalty.

  ---

  ## Part 3: Analysis of the Unwelcome Result

  **The Result:** The procedure recommends **Local Grass-Fed Beef** over the **Soy-Based Patty**.
  **Why it is unwelcome:** Sustainability officers typically view plant-based options as inherently superior due to lower carbon footprints and zero direct animal slaughter.
  **Why the procedure forces this:**
  1.  **Crop Deaths:** The ESMP explicitly counts small wild vertebrates and sentient insects killed during harvest. Conventional soy is tillage-intensive.
  2.  **Feed Elimination:** Grass-fed beef removes the "hidden" animal cost of feed crops. A grain-fed cow kills hundreds of mice via its corn diet; a grass-fed cow kills none.
  3.  **Land Quality:** The procedure weights "Marginal Pasture" lower than "Arable Cropland." If the beef comes from land unsuitable for crops, the displacement of wild animals is minimal compared to converting land for soy.
  4.  **Suffering vs. Climate:** The procedure prioritizes immediate physical suffering (WASU/FASU) over probabilistic future suffering (CSP). If the Committee accepts that a mouse death today weighs more than a fractional increase in drought risk tomorrow, the Beef wins.

  *Note: This does not mean Beef is "good." It means that under a strict suffering-minimization framework that counts crop deaths, conventional plant-mono-cultures are not ethically cost-free.*

  ---

  ## Part 4: Limitations and Scope

  ### Fixed Inputs (What we assume is true)
  1.  **Sentience Threshold:** We assume vertebrates (mice, birds, fish) and cephalopods are sentient. We assume insects are *not* sentient for calculation purposes (to prevent data paralysis), though this is contested.
  2.  **Climate Harm:** We assume CO2e correlates linearly with animal suffering (via habitat loss). We do not calculate human suffering from climate change.
  3.  **Baseline Land:** We assume "Marginal Pasture" does not displace high densities of wild animals. If the pasture was recently deforested, the WASU calculation fails.

  ### Scope Misfires (Where not to use this)
  1.  **Seafood:** Wild-caught fish involves bycatch and ecosystem disruption not captured by "Feed/Crop" metrics. A separate "Fisheries Protocol" is needed.
  2.  **Exotic/Novel Proteins:** Lab-grown meat or insect protein lacks Standard Coefficients. Do not use ESMP until coefficients are established.
  3.  **Nutritional Deficits:** This procedure minimizes suffering, not malnutrition. If a switch reduces protein quality significantly, dietitians must veto regardless of ESMP results.

  ### Residual Uncertainties
  1.  **The "Life Worth Living" Variable:** Step 5 hands this to the Committee, but the Committee may not agree. The procedure cannot resolve whether it is better to exist and suffer or never exist.
  2.  **Insect Sentience:** If future science confirms high insect sentience, the WASU for *all* crop-based options (including chicken feed and soy) will skyrocket, potentially making animal products look better (if they eat waste) or worse (if they eat crops).
  3.  **Supplier Truthfulness:** Welfare Weights rely on certifications. If a "High Welfare" farm is misrepresenting conditions, the FASU is incorrect. The procedure relies on audit integrity.

  ---

  ### Appendix A: Standard Coefficients (For Procurement Use)
  *Use these if supplier data is missing. Update annually.*
  *   **Crop Death Rate:** 10 wild vertebrates / ton of harvested grain/legume.
  *   **Feed Conversion (Chicken):** 1.6 kg feed / 1 kg meat.
  *   **Feed Conversion (Beef):** 6.0 kg feed / 1 kg meat.
  *   **Welfare Weight (Industrial):** 1.0
  *   **Welfare Weight (Pasture/High):** 0.5
  *   **Land Displacement (Cropland):** 1.0
  *   **Land Displacement (Marginal Pasture):** 0.2
  *   **Climate Proxy:** 1 WASU / 10 Kg CO2e.
