answer: |-
  ### Exam Question

  **Question 4 (50 Minutes)**

  Consider the following scenario regarding a measurable phenotypic trait, *T* (e.g., adult height), in two distinct human populations, Population A and Population B.

  Researchers estimate the narrow-sense heritability ($h^2$) of *T* within Population A and find it to be 0.80. They conduct a similar study within Population B and also find $h^2$ to be 0.80. However, the mean value of *T* in Population B is significantly higher than the mean value of *T* in Population A. It is further known that Population B has access to a higher quality of nutrition during development than Population A.

  Based on this data, a policy analyst makes the following three claims:
  1.  **The Group Difference Claim:** Since heritability is high in both groups, the difference in the average trait value between Population A and Population B is primarily due to genetic differences between the populations.
  2.  **The Intervention Claim:** Because $h^2$ is 0.80 within Population A, environmental interventions (such as improving nutrition) will be futile for increasing *T* in that population; the trait is genetically fixed.
  3.  **The Stability Claim:** Heritability is a stable property of the trait *T*, so we can expect $h^2$ to remain 0.80 even if the environmental variance within these populations changes drastically.

  Write an essay evaluating these three claims. In your response, you must explain what a heritability estimate actually measures, why it does not license the **Group Difference Claim**, why it does not license the **Intervention Claim**, and why the **Stability Claim** misunderstands the nature of variance partitioning.

  ***

  ### Model Answer

  Heritability ($h^2$) is a population statistic defined as the proportion of total phenotypic variance ($V_P$) in a specific population that is attributable to additive genetic variance ($V_G$) at a specific time. Mathematically, $h^2 = V_G / V_P$. Crucially, this ratio describes the sources of *variation* within a group, not the absolute level of a trait, nor the causes of differences *between* groups. The policy analyst's three claims all commit category errors regarding what this statistic licenses.

  The **Group Difference Claim** is the most egregious error, confusing within-population variance with between-population means. A high $h^2$ indicates that, within Population A, individuals who differ from the mean tend to differ because of genetic differences *relative to the environmental variance present in A*. It does not follow that the *mean difference* between A and B is genetic. This is best illustrated by Lewontin's seed analogy: if one takes a handful of genetically diverse corn seeds and plants half in nutrient-rich soil (Population B) and half in nutrient-poor soil (Population A), the heritability of height within each patch may be very high (because genetic differences between seeds still matter). However, the difference in average height *between* the patches is entirely environmental. In the scenario provided, since we know nutrition differs, the mean difference could be 100% environmental despite high within-group heritability. Heritability estimates are silent on the etiology of group means.

  The **Intervention Claim** misunderstands the relationship between heritability and malleability. High heritability does not imply genetic determinism or immutability. $h^2$ is high only relative to the current range of environmental variance. If environmental conditions are uniform within Population A (low $V_E$), then $V_G$ will account for most of the remaining $V_P$, driving $h^2$ up. However, this does not mean the trait is insensitive to environmental change. If the environment is shifted systematically (e.g., improving nutrition for everyone), the mean phenotype can change drastically even if $h^2$ was previously high. A classic example is PKU: a condition with high genetic heritability that is nonetheless treatable via environmental intervention (diet). Therefore, the high $h^2$ in Population A licenses no conclusion about the futility of changing the environment; it only describes the current distribution of causes for deviation from the mean.

  Finally, the **Stability Claim** treats heritability as an intrinsic property of the trait, rather than a property of a population in a specific context. Because $h^2$ is a ratio of variances, it changes if either the numerator ($V_G$) or the denominator ($V_P$, which includes $V_E$) changes. If the government intervenes to equalize nutrition in Population A, environmental variance ($V_E$) might decrease, potentially raising $h^2$. Conversely, if new genetic variants are introduced, $V_G$ might change. If the range of environments expands (e.g., some people get excellent nutrition, others get poor), $V_E$ increases, which would lower $h^2$. Thus, heritability is not a fixed constant like the speed of light; it is contingent on the specific distribution of genes and environments in that population at that time.

  In conclusion, heritability is a limited statistical tool. It partitions variance within a specific context. It cannot explain group means, it cannot predict the outcome of novel environmental interventions, and it is not a stable biological constant. The analyst's inferences fail because they reify a context-dependent ratio into a causal explanation for means and a prediction of immutability.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Definition and Scope of Heritability (4 Marks)**
  *   **A-Grade Move (4):** Clearly defines $h^2$ as a ratio of *variances* ($V_G/V_P$) within a *specific population* and *specific environment*. Explicitly states it explains variation around a mean, not the mean itself.
  *   **Common Error (0-2):** Defines heritability vaguely as "how genetic a trait is" or implies it measures the proportion of an *individual's* trait caused by genes. Fails to mention variance.

  **2. Evaluation of the Group Difference Claim (6 Marks)**
  *   **A-Grade Move (6):** Explicitly distinguishes between *within-group variance* and *between-group means*. Uses an argument or analogy (e.g., Lewontin's seeds/corn) to demonstrate that high within-group $h^2$ is compatible with 100% environmental causation of the group difference. Notes that the scenario specifies different nutritional environments.
  *   **Common Error (0-3):** Argues that the difference is "partly genetic" without explaining why the inference is logically invalid. Fails to see that within-group statistics do not scale to between-group explanations.

  **3. Evaluation of the Intervention Claim (5 Marks)**
  *   **A-Grade Move (5):** Explains that high $h^2$ often results from low environmental *variance*, not lack of environmental *sensitivity*. Argues that shifting the environmental *mean* (intervention) is distinct from measuring environmental *variance*. Mentions that traits can be highly heritable yet malleable (e.g., PKU or height/nutrition).
  *   **Common Error (0-2):** Accepts that high heritability makes intervention difficult. Confuses "heritability" with "inheritance" or "fixedness."

  **4. Evaluation of the Stability Claim (3 Marks)**
  *   **A-Grade Move (3):** Identifies that $h^2$ is context-dependent. Explains that changing the range of environments ($V_E$) or genes ($V_G$) alters the ratio. Denies that $h^2$ is an intrinsic property of the trait.
  *   **Common Error (0-1):** Treats heritability as a biological constant (like a physical constant) that travels with the trait across populations.

  **5. Clarity and Structure (2 Marks)**
  *   **A-Grade Move (2):** Essay is well-organized, addresses all three claims, and stays within the philosophical scope (logic of inference) rather than getting bogged down in biological minutiae.
  *   **Common Error (0-1):** Disorganized, fails to address one of the three claims, or exceeds word count significantly to the detriment of argument quality.

  **Specific Penalties:**
  *   **-2 Marks:** If the student treats heritability as a measure of an *individual's* trait composition (e.g., "80% of John's height is genetic").
  *   **-2 Marks:** If the student argues that the Group Difference Claim *might* be true empirically, without emphasizing that the *inference from heritability* is logically invalid. (The question asks about what the estimate *licenses*, not what is empirically possible).
