answer: |-
  This is a fantastic set of data points. You are effectively doing fieldwork in metaphysics. Your intuitions place you firmly in the camp of **Moderate Restrictionism** (specifically, a version often called "Common Sense Ontology" or "Sortal-Dependent Restrictionism").

  You are correct that standard principles like "Life" (Van Inwagen) or "Function" (Artifacts only) fail your test. The "Stable Interaction" hunch is close, but as you noted, a pile of sand interacts less than a solar system, yet you count both as objects while excluding scattered grains.

  Here is an analysis of the principle behind your verdicts, the tension you need to resolve, and how to handle the new cases.

  ### The Principle: "Dominant Binding + Sortal Salience"

  Your verdicts are best captured by a hybrid principle. It isn't just one thing, but two conditions that usually travel together:

  1.  **Dominant Internal Binding:** The parts are held together by a force or boundary that is stronger than the forces separating them from the immediate environment. This binding can be mechanical (hammer), frictional (sand), biological/structural (cat/corpse), gravitational (solar system), or container-based (deck of cards).
  2.  **Sortal Salience:** The arrangement falls under a stable concept (a "sortal") that allows us to track it as a unit over time. We have a concept for "Solar System"; we do not have a concept for "Rock-and-Moon."

  **Why this fits your data:**
  *   **Hammer:** Mechanical binding + "Hammer" concept.
  *   **Sand Pile:** Frictional binding (angle of repose) + "Pile" concept.
  *   **Corpse:** Residual structural binding (skin/bone hold it together) + "Specimen/Corpse" concept.
  *   **Ashes:** Binding lost (scattered) + No concept for "that specific scattered ash."
  *   **Deck in Box:** Container binding + "Deck" concept.
  *   **Mixed Cards:** No specific binding for *those* 52 + No concept for "that specific mixed subset."
  *   **People Holding Hands:** Physical binding exists, *but* agency overrides it. They are capable of independent motion that defeats the "binding." (This is a crucial nuance: **Autonomous Agents resist composition.**)

  ### The Tension: Rock + Moon vs. Solar System

  You identified the crack in your own foundation: *Why is the Solar System an object, but a Rock and the Moon are not?* Both involve gravity. Both involve distance.

  **The Diagnosis:**
  You are conflating **Substances** with **Systems**.
  *   A **Rock** is a *substance*. It is a cohesive chunk of matter.
  *   A **Solar System** is a *system*. It is a set of objects interacting dynamically.

  Your intuition tells you the Solar System is "one object" because it is a **closed dynamic loop**. The planets are bound to the sun in a way that excludes other stars. The Rock and the Moon are not a closed loop; they are just two things near each other in a larger system (the Earth-Moon-Sun system).

  **The Sacrifice:**
  To make your principle consistent, you must slightly adjust one verdict. You have two options:

  1.  **Hardline Physicalist:** Admit the Solar System is *not* a concrete object in the same way the hammer is. It is a "conceptual object" or a "system." If you do this, you preserve the Rock+Moon verdict (no scattered object).
  2.  **Moderate Conceptualist:** Admit that "Objecthood" depends partly on our interests. If we decided to study "The Rock-Moon Dyad" as a specific gravitational unit, it *would* compose an object.

  **Recommendation:** Given your museum work, **Option 1** is safer for your cataloging. In a museum, the Solar System is a *topic*, not a *specimen*. The Rock is a specimen. You should downgrade the Solar System verdict: It is a *system*, not a *composite object*. This resolves the contradiction with the Rock+Moon case. Neither is a composite object; one is just a more interesting system than the other.

  ### Verdicts on Your New Cases

  Based on the **Dominant Binding + Sortal Salience** principle (treating Systems as distinct from Substances), here is how your intuitions should logically extend:

  **1. A Forest**
  *   **Verdict:** **Vague Object / No Object.**
  *   **Reasoning:** Where does the forest end? Is the single tree on the edge part of it? The binding is ecological (roots, shade, soil), which is real, but the boundary is arbitrary. Unlike the deck of cards (the box stops the boundary), the forest bleeds into the meadow.
  *   **Museum Context:** You would likely accession "Soil sample from Forest X" or "Log from Forest X," but rarely "The Forest" as a single tray item. It is a *location*, not an *object*.

  **2. A Swarm of Bees**
  *   **Verdict:** **One Object.**
  *   **Reasoning:** This is like the Solar System but tighter. The bees are dynamically bound by pheromones and movement patterns into a single functional unit (the swarm) that moves together. It has a clear boundary (the cloud of bees) and a sortal ("Swarm").
  *   **Distinction:** Unlike the "Two People," the individual bees lose autonomous trajectory to the group motion.

  **3. A Mosaic on a Wall**
  *   **Verdict:** **One Object.**
  *   **Reasoning:** The tiles are fastened (binding) to a substrate to create a unified image (function/form). Even if a tile falls off, it is a "damaged mosaic," implying the object persists. It is an artifact, like the hammer.
  *   **Contrast:** If the tiles are in a bag, they are "tiles." On the wall, they are "mosaic." The arrangement creates the objecthood.

  **4. The Letters that Spell a Word on a Page**
  *   **Verdict:** **Two Objects (The Ink and The Word).**
  *   **Reasoning:**
      *   *The Ink:* The physical graphite/ink particles are one object (a stain).
      *   *The Word:* The "word" is an abstract object or a semantic unit, not a physical composite.
      *   **Why:** If you erase one letter, the physical object (the ink stain) is just smaller. But the *word* is destroyed. Because the identity conditions differ, they are not the same composite object. Your intuition likely says "The word is there," but physically, it's just ink arranged pattern-wise.
      *   **Museum Context:** You would accession "The Page," not "The Word."

  ### Summary for your Museum Work

  You are operating with a **Curatorial Ontology**. In your work, something counts as "One Object" (one accession number) when:
  1.  **Integrity:** It holds together without external intervention (or within a designated container).
  2.  **Identity:** It falls under a label that persists through minor changes (a chipped rock is still the rock; a scattered ash pile is not the cat).
  3.  **Non-Arbitrariness:** The boundary isn't just "where I drew the line," but "where the thing ends" (friction, glue, gravity, skin).

  **The Principle to keep in your head:**
  > *"Parts compose a whole when they are bound by a dominant internal force or container that creates a stable boundary distinct from the environment, **and** that arrangement supports a persistent identity concept."*

  **The one thing to let go of:**
  Stop calling the Solar System an "object" in the same sense as the hammer. Call it a "System." That saves you from having to say the Rock and Moon compose an object, keeping your ontology clean enough for cataloging.
