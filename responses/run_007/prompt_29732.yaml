answer: |-
  # Q&A Prep Sheet: Reductive Account of Shared Intention

  **Talk Goal:** Defend shared intention as constituted by interlocking individual intentions + meshing subplans + common knowledge (CK), with normativity explained by ordinary morality/promises, not sui generis joint commitment.

  **Strategy:** Concede on phenomenology and the complexity of CK; Hold firm on ontological individualism and the source of normativity.

  ---

  ### 1. The Gilbertian Normativity Objection (Highest Damage/Likelihood)
  **Who:** The Social Ontologist (Gilbertian) & Your Friend.
  **The Question:** "You claim the entitlement to rebuke a partner who abandons a joint walk is explained by 'ordinary moral considerations.' But in the spontaneous walking-together case, there is no explicit promise. If the normativity isn't built into the intention itself, where does the *directed obligation* come from? Without a joint commitment, your account reduces the partner's abandonment to a mere frustration of your expectations, not a violation of their obligation to *you*."

  **The 2-Minute Reply:**
  "I grant that the *feeling* of obligation is immediate. But we must distinguish the *source* of the normativity from the *psychological experience* of it. In the walking case, the interlocking intentions function as mutual assurances. When I adjust my pace to match yours, and you know I know, I am implicitly inviting your reliance.
  If I then peel off without signaling, I violate a norm of *not inducing reliance without warning*, which is an ordinary moral duty, not a sui generis collective one. The entitlement to rebuke stems from the harm of manipulated reliance, not from a group entity. We don't need a 'joint commitment' to explain why misleading someone is wrong; we just need the morality of interpersonal reliance. The 'we' is constituted by the interlocking, but the 'ought' comes from the ethics of communication."

  **Soft Spot:** This relies on the claim that adjusting pace counts as an implicit assurance/promise. If they press that many joint actions happen without even implicit assurance (e.g., strangers falling into step), the "ordinary morality" bridge looks shaky.

  ### 2. The Searlean Phenomenology Objection (High Damage)
  **Who:** The Searlean.
  **The Question:** "You've analyzed the functional conditions, but you've left out the 'mode.' When we play a duet, I don't intend 'I play' and believe 'You play.' I intend 'We play.' This we-mode is biologically primitive. If your account is correct, why does the phenomenology of 'doing-it-together' feel irreducible? You are explaining the *coordination*, but not the *collective intentionality*."

  **The 2-Minute Reply:**
  "I agree the phenomenology is unified, but phenomenology is not ontology. The 'we-mode' is a way of experiencing a complex structure of individual attitudes, not evidence of a distinct mental state. Think of binocular vision: the experience is of a single 3D object, but the mechanism is two eyes processing distinct data.
  My claim is that the 'we' in 'we-intend' is a distributive operator over individual contents, not a primitive subject. If I can show that the functional role of the we-intention is fully exhausted by the interlocking individual intentions plus CK, then positing a primitive biological mode is ontologically profligate. The 'sense' of togetherness is the cognitive access to the Common Knowledge, not a separate faculty."

  **Soft Spot:** Searle will insist the *content* of the intention is different, not just the mode. If the content is "We do X," and you reduce it to "I do my part," you may be changing the subject.

  ### 3. The Bratmanian Common Knowledge Load (Medium Damage)
  **Who:** The Two Planning Theorists.
  **The Question:** "You are assigning immense weight to Common Knowledge. In complex subplan meshing, CK requires infinite recursive belief states. Psychologically, agents don't have this. If CK is idealized, your account is normative, not descriptive. If it's psychological, it's false. How do you avoid the regress without smuggling in a collective assumption?"

  **The 2-Minute Reply:**
  "This is why I emphasize *common ground* rather than strict logical CK. We don't need infinite recursion in the head; we need a public environment where the intentions are manifest. When we stand up to walk together, the context makes our intentions mutually manifest.
  I am not claiming agents compute infinite loops. I am claiming that the *condition* for shared intention is that there is no 'surprise' defeater available. The regress is blocked by the public nature of the action. If the subplans mesh and are publicly visible, the CK condition is satisfied functionally. I'm happy to concede that 'CK' is a shorthand for 'mutual manifestness in a shared context,' provided we agree that doesn't require a group mind."

  **Soft Spot:** "Mutual manifestness" can sound like a joint commitment by another name. You must ensure you don't concede that the *context* does the work that the *commitment* usually does.

  ### 4. The Decision Theorist's Luck Objection (Medium Damage)
  **Who:** The Decision Theorist.
  **The Question:** "Consider two strangers walking toward a door who happen to mesh their pace and arrive together. Their intentions interlock, they have CK of the movement. But they lack shared intention. Your account seems to count this as shared intention. Do you need 'Team Reasoning' to distinguish designed meshing from lucky meshing?"

  **The 2-Minute Reply:**
  "No, I don't need Team Reasoning, but I do need *intention-dependence*. In the lucky door case, my intention is not *responsive* to yours; I just happen to match you. In shared intention, my plan is conditional on yours. I intend to do my part *because* you intend to do yours.
  The distinction isn't in the outcome (meshing), but in the formation of the intention. My account requires that the individual intentions are formed *in response* to the knowledge of the other's intention. Luck gets coordination; responsive planning gets shared intention. I can capture this without positing a team agent."

  **Soft Spot:** Defining "responsive to" without circularity. If "responsive to" means "guided by a shared goal," you're back to collectivism.

  ### 5. The Wittgensteinian Methodological Objection (Low Damage)
  **Who:** The Wittgensteinian.
  **The Question:** "What is this analysis *for*? You are dissecting a concept that works perfectly well in practice. By trying to reduce 'we-intend' to 'I-intend,' aren't you just creating a philosophical picture that holds us captive? What work does this reduction do?"

  **The 2-Minute Reply:**
  "It does work in determining *responsibility*. If shared intention is primitive, abandonment is a collective failure. If it's reductive, abandonment is an individual breach of reliance. This matters for moral philosophy and legal theory.
  We need to know if the 'group' can be held responsible, or if only individuals can. My analysis clarifies that the normativity flows between individuals. It dissolves the mystery of 'group agency' by showing the mechanics of interpersonal obligation. That's not captivity; it's clarification."

  **Soft Spot:** Wittgensteinians often view "clarification" of this sort as precisely the disease.

  ---

  ### Strategic Concessions & Holds

  **What to Concede Up Front:**
  1.  **CK is Idealized:** Admit that agents don't literally compute infinite belief loops. Frame CK as "publicly manifest mutual responsiveness."
  2.  **Phenomenology:** Concede that it *feels* like a primitive "we." Do not fight the phenomenology; fight the ontology.
  3.  **Complexity:** Admit that in long-term collaborations (orchestras), implicit promises become explicit. The "walking" case is the hard limit, not the norm.

  **What to Hold Firm:**
  1.  **No Sui Generis Normativity:** Do not allow the "entitlement to rebuke" to force you into admitting a joint commitment. Keep pivoting to *reliance* and *assurance*.
  2.  **Ontological Individualism:** Do not concede that "we" is a subject. "We" is a plural referring to individuals in a specific relation.
  3.  **Reductivity:** Do not agree that something is "left out." If the functional role is filled, the entity is accounted for.

  ---

  ### The One Reply That Must Land
  **The Normativity/Rebuke Reply (Objection #1).**
  If you fail to explain why I can rebuke you without a joint commitment, the talk collapses into "parallel play." You must successfully argue that **interpersonal morality (do not mislead/manipulate reliance)** is sufficient to ground the entitlement to rebuke. If the audience thinks only a Joint Commitment can ground a *directed* obligation, your reductive account fails.
  *Key phrase to use:* "The obligation is not to the *group*, it is to the *partner* based on induced reliance."

  ---

  ### The Question You Hope Nobody Asks
  **"The Normative Transformation Question"**
  *"You say the normativity comes from 'ordinary moral considerations' like promises or reliance. But in the spontaneous walking case, neither agent performs a speech act or explicitly invites reliance. At what exact moment does my individual intention to walk transform into an obligation to you? If it's just the interlocking intention, doesn't that mean intention itself is normative in a way you denied? If it's not the intention, what specific action triggered the moral duty if no promise was made?"*

  **Why this is deadly:** It forces you to pinpoint the exact mechanism where "I intend" + "You intend" becomes "I owe you." If you say "the intention," you concede normativity is internal to intention (closer to Gilbert/Bratman). If you say "the walking," you admit the action creates the obligation, not the intention. If you say "implicit promise," they will ask for the conditions of that implication, which often look exactly like... a Joint Commitment.
