answer: |-
  **Project Title:** The Metaphysics of Value Aggregation: Resolving the Pasadena Paradox through Ontological Holism

  **1. Statement of the Research Question**

  The Pasadena paradox demonstrates that for certain coherent gambles, the expected utility (EU) calculation yields a conditionally convergent series. Consequently, the expected value is undefined, as it depends entirely on the order of summation. Standard decision theory assumes that the value of a prospect is the probability-weighted sum of the values of its constituent outcomes. The paradox reveals that when the series is conditionally convergent, this summation lacks a unique result.

  Existing literature treats this primarily as a technical failure of the expectation formula or a problem of unbounded utilities. This project proposes that the root of the paradox is not mathematical but metaphysical. The mathematical indeterminacy of the sum reflects an ontological indeterminacy in how value inheres in the world. If the value of a prospect were truly constituted by the values of its outcomes in a straightforwardly additive way, there would be a fact of the matter about how they sum. The fact that there is not suggests that our ontological model of value is incomplete.

  This project addresses three interlocking questions:
  1.  **Ontological:** What must the metaphysical structure of value be for the expected-utility sum to be well-defined for all coherent prospects? Specifically, does value inhere atomistically in outcomes, or is it a holistic feature of the prospect itself?
  2.  **Normative:** If value is holistic (i.e., the value of a prospect is not strictly composed of outcome-values), can we reconstruct a decision rule that recovers the successes of expected utility theory in standard cases while providing determinate verdicts in Pasadena-type cases?
  3.  **Scope:** If the atomistic picture of value is untenable, what are the limits of decision theory? Does the Pasadena paradox show that rational choice is impossible in certain domains, or merely that our formalization of rationality requires a metaphysical revision?

  The central hypothesis is that the Pasadena paradox arises from a category mistake: we treat value as a scalar quantity attached to outcomes that *must* aggregate linearly, when in fact value aggregation requires a metaphysical grounding relation that is absent in Pasadena-style prospects. By developing a metaphysics of "Value Holism," this project aims to either rule out such prospects as metaphysically incoherent or provide a new aggregation principle grounded in the structure of the prospect rather than the sum of its parts.

  **2. Critique of Existing Responses and the Metaphysical Gap**

  The literature on the Pasadena paradox generally falls into three camps, none of which adequately address the metaphysical underpinnings of the problem.

  The first camp accepts the paradox as a reductio of standard expected utility theory and proposes technical modifications. These include adopting "weak expectations" (convergence in probability rather than expectation), utilizing non-standard analysis to handle infinite values, or restricting the domain of admissible utilities to ensure absolute convergence. While mathematically rigorous, these approaches treat the symptoms rather than the disease. They adjust the calculus without asking why the calculus failed. They assume the inputs (the values of the outcomes) are fixed and unproblematic, and that the error lies solely in the summation operator. This ignores the possibility that the inputs themselves—the values assigned to the outcomes—lack the ontological independence required for summation.

  The second camp argues that Pasadena-style games are physically or practically impossible. Some argue that no agent can face a payoff schedule that grows without bound, or that the time required to resolve the gamble exceeds the lifespan of the universe. This "physicalist" dismissal is unsatisfying for decision theory, which is traditionally concerned with normative rationality rather than physical feasibility. A theory of rational choice should be able to evaluate coherent descriptions of prospects even if they are physically unrealizable, just as geometry studies idealized lines. Dismissing the paradox on physical grounds leaves the conceptual tension unresolved: why does a coherent description of value lead to mathematical indeterminacy?

  The third camp, which is the smallest, suggests that rationality is simply silent in these cases. This "quietist" approach accepts that there is no fact of the matter about the value of the prospect. However, this is a concession of defeat. It implies that there are rationally describable situations where reason cannot guide action. While this may be true, it should be a conclusion reached after exhausting explanatory resources, not a starting assumption.

  The gap this project fills is the **metaphysical angle**. Decision theorists rarely interrogate the ontology of value. They treat utility as a real number assigned to a world-state, assuming that this number represents a property that aggregates linearly. The Pasadena paradox shows that linearity fails when the series is conditionally convergent. The standard response is to fix the linearity (the math). My proposal is to interrogate the property (the value).

  If the value of a prospect is *constituted* by the values of its outcomes, there must be a principle of composition. In standard cases, the probabilities provide the weights for this composition. In Pasadena cases, the weights exist, but the composition is order-dependent. This suggests that the "value" of the outcome is not an intrinsic property that can be summed independently of the structural context of the prospect. This points toward a holistic metaphysics: the value of the prospect is not the sum of the parts, but a property of the whole structure. Existing literature has not explored this because it requires bridging decision theory with analytic metaphysics (specifically, mereology and grounding theory). By treating the indeterminacy of the sum as evidence of an indeterminacy in the metaphysical grounding of value, this project moves beyond technical patching to a foundational reconstruction of how we model value in decision theory.

  **3. Methodology and Work Plan**

  This project employs a method of **conceptual engineering grounded in analytic metaphysics**. It will not rely on empirical data, nor will it prioritize historical exegesis. Instead, it will use formal modeling as a tool to test metaphysical hypotheses about value. A purely formal decision-theory approach is insufficient because it takes the ontology of value for granted; a purely historical approach is insufficient because the Pasadena paradox is a contemporary problem requiring novel conceptual tools. The proposed method treats decision-theoretic paradoxes as diagnostic tools for metaphysical inquiry.

  **Year 1: Diagnosis and Ontological Taxonomy**

  The first year is dedicated to deconstructing the assumptions underlying expected utility theory and mapping the metaphysical landscape.

  *   **Months 1–4: The Metaphysics of Additivity.** I will analyze the principle of additive separability in value theory. I will examine the conditions under which value aggregation is order-independent. This involves engaging with literature on the mereology of value (how parts of a whole contribute to its value) and the grounding of normative facts. The goal is to produce a rigorous definition of "Value Atomism" (the view that outcome values are intrinsic and prior to the prospect) and "Value Holism" (the view that prospect value is primitive or structurally dependent).
  *   **Months 5–8: Formalizing the Metaphysical Constraint.** I will work with a formal model to demonstrate that the Pasadena indeterminacy arises specifically when Value Atomism is combined with Countable Additivity in probability. I aim to show that if we impose a metaphysical constraint on how outcomes ground the value of the prospect (e.g., a requirement for absolute convergence as a metaphysical necessity, not just a mathematical convenience), the paradox dissolves. This will result in a working paper arguing that Pasadena prospects are metaphysically ill-formed under an Atomist ontology.
  *   **Months 9–12: Developing the Holistic Alternative.** If Atomism must be rejected, I will begin constructing a Holistic model. This model will treat the value of the prospect as a function of the *structure* of the probability distribution, not just the sum of outcomes. I will investigate whether this aligns with existing "holistic" approaches in ethics (e.g., organic unities) and how it might be formalized.
  *   **Deliverable Year 1:** One major paper submitted to a top journal in philosophy of science or decision theory, titled *"The Ontological Presuppositions of Expected Utility."* A second working paper outlining the distinction between Atomistic and Holistic value structures.

  **Year 2: Construction, Application, and Implications**

  The second year focuses on building the positive account and testing its limits.

  *   **Months 13–16: Constructing the Holistic Decision Rule.** I will develop a decision rule based on the Holistic metaphysics. This rule must replicate standard EU results in cases of absolute convergence (to ensure continuity with established theory) but yield determinate results in conditionally convergent cases. This may involve prioritizing the "natural order" of the prospect's description as metaphysically significant, rather than arbitrary.
  *   **Months 17–20: Stress-Testing the Model.** I will apply the new framework to related paradoxes (e.g., the St. Petersburg paradox, the Altadena game) to ensure robustness. I will also examine the normative implications: if value is holistic, does this change how we ought to deliberate? Does it imply that agents must consider the global structure of a gamble rather than individual payoffs?
  *   **Months 21–24: Synthesis and Dissemination.** The final months will be dedicated to synthesizing the findings into a comprehensive framework. I will organize a small workshop to gather feedback from decision theorists and metaphysicians to refine the arguments. The final output will be a second major paper and a draft monograph proposal.
  *   **Deliverable Year 2:** One major paper submitted to a top journal in ethics or metaphysics, titled *"Value Holism and the Limits of Aggregation."* A complete draft of the project's central argument ready for monograph development.

  **Justification for Method:**
  This approach is superior to a purely formal one because formalism alone cannot dictate which mathematical representation corresponds to reality. We can mathematically force the Pasadena series to converge to any number, but that doesn't tell us which number represents the *value*. Only a metaphysical account can privilege one ordering over another (or reject the summation entirely). It is superior to a historical approach because the Pasadena paradox reveals a structural flaw in contemporary decision theory that historical texts did not anticipate; solving it requires new conceptual vocabulary, specifically drawn from contemporary metaphysics of grounding and composition.

  **4. Success and Failure Conditions**

  **Successful Outcomes:**
  1.  **Conceptual Clarity:** The project successfully articulates a clear distinction between Atomistic and Holistic value ontologies and demonstrates that the Pasadena paradox is a symptom of conflating the two.
  2.  **Resolution or Dissolution:** The project either (a) provides a metaphysical argument that Pasadena-style prospects are impossible (dissolving the paradox) or (b) provides a Holistic decision rule that yields determinate verdicts for such prospects (resolving the paradox).
  3.  **Publication:** At least two peer-reviewed articles in high-impact journals (e.g., *Philosophical Review*, *Mind*, *Philosophy of Science*, or *Noûs*).
  4.  **Framework Adoption:** The "Atomism vs. Holism" distinction becomes a recognized framework in subsequent literature on infinite decision theory.

  **Failure Conditions:**
  1.  **Triviality:** The metaphysical analysis amounts to merely restating the mathematical problem in different words (e.g., "the sum is undefined" becomes "the value is ungrounded") without offering new explanatory power or normative guidance.
  2.  **Incompatibility:** The Holistic model developed is incompatible with standard rationality axioms (e.g., it violates dominance or transitivity in standard cases), rendering it useless as a general theory of choice.
  3.  **Scope Creep:** The project becomes bogged down in general metaphysics of value without returning to the specific constraints of the Pasadena paradox, failing to deliver a solution to the decision-theoretic problem.

  **5. Feasibility Assessment**

  A two-year timeline is realistic for this project, provided the scope remains tightly focused on the intersection of metaphysics and decision theory.

  **Strengths:**
  *   **No Empirical Constraints:** The project is purely theoretical, eliminating delays associated with data collection, IRB approval, or experimental design.
  *   **Built on Existing Foundation:** The user's half-formed idea indicates a strong grasp of the core paradox, reducing the time needed for preliminary literature review. The core mathematical facts are established; the work is interpretive and constructive.
  *   **Interdisciplinary Demand:** There is a growing interest in the foundations of decision theory and the metaphysics of normativity. This ensures a receptive audience for workshops and publications, facilitating feedback loops that accelerate progress.

  **Risks and Mitigation:**
  *   **Risk:** The formal modeling required to articulate the Holistic view may become too technically demanding, slowing progress.
      *   *Mitigation:* The project will collaborate with a formal decision theorist (identified during the first year) to ensure the mathematical representations are sound without the PI needing to derive novel mathematics from scratch. The focus remains on the *interpretation* of the math, not the invention of new calculus.
  *   **Risk:** The metaphysical distinction (Atomism vs. Holism) may prove too vague to do the heavy lifting required.
      *   *Mitigation:* Year 1 is dedicated specifically to rigorously defining these terms using existing mereological literature. If the distinction proves untenable by Month 6, the project will pivot to a "Metaphysical Quietism" argument, which is itself a significant result (showing that metaphysics cannot save decision theory here). This pivot is built into the work plan as a contingency.
  *   **Risk:** Two years is a short time for a conceptual shift of this magnitude.
      *   *Mitigation:* The goal is not to settle the metaphysics of value forever, but to establish the *relevance* of metaphysics to the Pasadena paradox. Even a negative result (showing that metaphysical moves don't help) is a publishable contribution that clarifies the field. The timeline allows for two major papers, which is a standard and achievable output for a two-year postdoc in philosophy.

  In conclusion, this project is feasible because it leverages a specific, well-defined paradox to interrogate a broad theoretical assumption. It avoids the trap of endless formalization by anchoring the math in metaphysical inquiry. The two-year window is sufficient to diagnose the ontological assumptions, propose a holistic alternative, and test its viability, yielding significant contributions to both decision theory and the metaphysics of value.
