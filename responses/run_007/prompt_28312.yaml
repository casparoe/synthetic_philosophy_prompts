prompt: |-
  Alright, here's my position and I want you to push back on it properly. You're an epistemologist who's thought a lot about forecasting and debiasing — take that role and think carefully.

  I've basically become an outside-view fundamentalist. Whenever I'm trying to estimate how long something will take, whether a startup will succeed, whether I'll finish a paper by the deadline — I force myself to ignore the specifics of my situation and just ask: what's the base rate for projects like this? The inside view, where you build a model from the details of your own case, is what gives you the planning fallacy and cost overruns and all the rest. I've read the literature and I'm convinced the outside view is just epistemically superior in almost every domain where we have decent reference classes.

  But I'm aware this might be too pat. So here's what I want: tell me what would count against this position. Not just obvious exceptions — I already know the outside view fails when the reference class is bad or when you have inside information that genuinely distinguishes your case. I mean: what kind of evidence, argument, or result would show that the outside view, as a default epistemic policy, is actually worse than the inside view? What would the world have to look like for the inside view to be the rational starting point and the outside view to be the crutch you use only when you're ignorant? Are there domains where we can actually test this, and if so, what do they show? And here's the thing I really want to know: is there a version of this debate where the outside view is self-defeating — where applying the outside view to the outside view itself would tell you not to trust it? If so, how seriously should I take that?

  Be as specific as you can about what would shift my credence and by how much. And don't let me get away with insulating the view — if I've made it unfalsifiable, say so and tell me whether that's a problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Someone well-read in forecasting literature (Kahneman, Tetlock, etc.), currently holding a strong position ("outside-view fundamentalist"). They believe the outside view (base rates) is epistemically superior to the inside view (case-specific details) in almost all domains with decent reference classes.
      *   **My Role:** An epistemologist specializing in forecasting and debiasing. I need to be rigorous, specific, and push back hard.
      *   **The Task:** Challenge the "outside-view fundamentalism."
      *   **Specific Questions to Answer:**
          1.  What evidence/argument would show the outside view is *worse* as a default policy?
          2.  What would the world have to look like for the inside view to be the rational starting point?
          3.  Are there testable domains, and what do they show?
          4.  Is there a self-defeating version of this debate (applying the outside view to the outside view)?
          5.  How much should credence shift?
          6.  Is the view unfalsifiable/insulated?

  2.  **Deconstruct the "Outside-View Fundamentalism":**
      *   *Core Claim:* Base rates > Case specifics (default).
      *   *Strength:* Mitigates planning fallacy, overconfidence, optimism bias.
      *   *Weakness (Potential):* Ignores relevant causal information, assumes stationarity, reference class tennis, passive agency.

  3.  **Brainstorming Counter-Arguments (The Pushback):**

      *   *Argument 1: The Reference Class Problem (Hájek).* How do you choose the class? "Projects like this" is vague. If you choose narrowly, it becomes an inside view. If broadly, it loses predictive power. This isn't just a "bad reference class" exception; it's structural.
      *   *Argument 2: Causal Mechanisms & Agency.* The outside view treats the agent as a statistical unit. But agents *learn*. If I know *why* others failed, I can avoid those pitfalls. Ignoring this is throwing away signal.
      *   *Argument 3: Non-Stationarity.* In fast-moving domains (tech, AI), the past is not a prologue. Base rates lag reality.
      *   *Argument 4: The Self-Defeat Argument.* If we apply the outside view to the success of using the outside view, what do we find? Do people who rigidly use base rates actually outperform those who integrate both?
      *   *Argument 5: Decision Quality vs. Prediction Accuracy.* A correct prediction based on base rates might lead to fatalism (giving up). An incorrect inside-view prediction might drive the effort needed to succeed (self-fulfilling prophecy).

  4.  **Developing the Specific Responses:**

      *   *What would count against the position?*
          *   Evidence that "integrators" (superforecasters) weigh inside info *more* than base rates in specific contexts.
          *   Evidence that rigid base-rate adherence leads to worse *outcomes* (not just calibration) due to lost agency.
      *   *When is Inside View rational starting point?*
          *   Novelty/Discontinuity. When the mechanism of change is understood and breaks historical trends (e.g., Moore's Law vs. horse carriage adoption).
          *   High-Agency contexts. Where effort directly correlates with outcome in a non-linear way.
      *   *Testable Domains:*
          *   Sports (high data, clear rules). Inside view (player stats, matchups) often beats simple team base rates.
          *   Medical Diagnosis. Base rates (prevalence) are crucial, but specific symptoms (inside view of the patient) dominate. Actually, this is Bayesian updating. The user's view might be "Base Rate Neglect," but fundamentalism is "Base Rate Only."
          *   Venture Capital. Top VCs claim to beat base rates via inside view (due diligence). Are they lying or skilled?
      *   *The Self-Defeat Argument:*
          *   Look at the track record of "Outside View Fundamentalists." Do they actually predict better than "Eclectic Forecasters"? Tetlock's work suggests the latter win.
          *   If the outside view says "Humans are bad at forecasting," does it imply "Humans are bad at selecting reference classes"? Yes.
      *   *Falsifiability:*
          *   The view risks unfalsifiability if every failure is blamed on "bad reference class" rather than the method.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the strength of the position (it's better than naive inside view) but state the thesis: Fundamentalism is a heuristic error itself.
      *   **Point 1: The Reference Class Tennis Problem.** It's not just about *having* a class; it's about *choosing* one. This choice is an inside-view judgment.
      *   **Point 2: The Agency & Causal Mechanism Objection.** Base rates describe *what* happened, inside view explains *why*. In high-agency domains, the 'why' allows intervention.
      *   **Point 3: The Superforecaster Empirical Rebuttal.** Tetlock's data shows winners integrate, they don't just default to base rates.
      *   **Point 4: The Self-Defeating Meta-Argument.** Apply the outside view to the strategy of using the outside view.
      *   **Point 5: Falsifiability Check.** Call out the "No True Scotsman" risk regarding reference classes.
      *   **Conclusion:** Specific credence adjustments.

  6.  **Refining the Tone:**
      *   Needs to be respectful but sharp.
      *   Use epistemological terminology (stationarity, causal granularity, reference class tennis).
      *   Avoid generic advice. Be specific about *what evidence* would shift credence.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Inside View":* Make sure I distinguish between "naive inside view" (storytelling) and "informed inside view" (causal modeling). The user is attacking the naive one, but defending the fundamentalist outside view. I need to defend the *informed* inside view.
      *   *Refining the Self-Defeat:* If the outside view says "most forecasting methods fail," then the outside-view method is a forecasting method. Does it fail? The data on superforecasters is key here. They use base rates as *anchors*, not *answers*.
      *   *Credence Shift:* Don't just say "you should doubt." Say "If X is true, lower credence by Y%."

  8.  **Final Polish:** Check against the prompt's specific constraints (specific about evidence, don't let them insulate, address self-defeat). *Ensure I explicitly address the "world would have to look like" question.*

      *(Self-Correction during drafting)*: I need to make sure I don't just say "balance is good." I need to argue why Inside View might be the *default* in certain ontological conditions.
      *Condition:* A world where causal mechanisms are stable but statistical regularities are non-stationary. (e.g., technological progress).
      *Condition:* A world where the observer affects the outcome (reflexivity).

      *Let's build the response.*
answer: |-
  This is a strong position, and frankly, it's better than where most intelligent people start. The planning fallacy is real, base-rate neglect is pervasive, and Kahneman & Lovallo's original formulation of the inside/outside view distinction was a necessary corrective to naive storytelling.

  However, as an epistemologist of forecasting, I see "Outside-View Fundamentalism" not as the end of the journey, but as a sophisticated form of bias itself. It is a heuristic that has hardened into a dogma. You are treating the outside view as an *oracle* rather than an *anchor*.

  Here is the pushback you asked for, structured around the specific epistemic vulnerabilities of your position.

  ### 1. The Reference Class Tennis Problem (The Structural Objection)
  You acknowledge that the outside view fails when the reference class is bad. But you are underestimating the epistemic labor required to select a reference class. There is no algorithm for choosing a reference class; it is a judgment call.

  *   **The Argument:** Every event belongs to an infinite number of reference classes. A startup is a "business," a "tech venture," "a project founded by two friends," "a project started in a recession," etc. Each class yields a different base rate.
  *   **The Trap:** To choose the *correct* reference class, you must use **inside-view information** to determine which features are causally relevant. You cannot know whether "being founded by two friends" is a relevant classifier without looking inside the case.
  *   **What would count against you:** If we find that expert forecasters spend more time debating *which* reference class to use than actually looking up the statistics, it implies the epistemic heavy lifting is being done by the inside view (causal modeling), not the outside view (statistics).
  *   **Credence Shift:** If you cannot specify an objective algorithm for reference class selection that doesn't secretly rely on inside-view causal judgments, you should reduce your credence in the outside view as a *standalone* method by at least **20%**. It is not a replacement for judgment; it is a input to judgment.

  ### 2. The Agency and Causal Mechanism Objection
  The outside view assumes **stationarity**. It assumes that the future will resemble the past because the underlying causal structure remains constant. This is often false in high-agency domains.

  *   **The Argument:** Base rates describe the performance of *average* agents with *average* information. If you have specific inside information (e.g., "I have identified a specific bottleneck in the code that caused previous teams to fail, and I have fixed it"), the base rate of "previous teams" is no longer your relevant population. You have changed the causal mechanism.
  *   **The World Where Inside View Wins:** In a world where **reflexivity** is high (your beliefs affect the outcome) and **causal granularity** is accessible.
      *   *Example:* In medical diagnosis, base rates (prevalence) are vital. But if a patient presents with a specific constellation of symptoms (inside view), ignoring those specifics in favor of the population base rate is malpractice. The "inside view" of the patient's biology *overrides* the outside view of the population.
      *   *Example:* In startups, if the base rate of success is 10%, but you have a proprietary distribution channel (inside info), your probability is not 10%. To stick to 10% is to ignore causal power.
  *   **Testable Domain:** **Venture Capital.** Top-tier VCs consistently beat the market base rate. If the outside view were fundamentalist, no VC should ever invest (since the base rate of startup success is near zero). The fact that some VCs have sustained alpha suggests that inside-view due diligence *can* extract signal from noise.
  *   **Credence Shift:** If you operate in a domain where your actions directly alter the probability of success (high agency), you should discount the outside view by **30-40%** in favor of a causal model.

  ### 3. The Superforecaster Empirical Rebuttal
  You cite the literature, but I suspect you are weighting Kahneman (psychologist) heavier than Tetlock (political scientist/forecaster).

  *   **The Evidence:** In the Good Judgment Project, superforecasters do not use the outside view as a *conclusion*. They use it as an **anchor**. They start with the base rate, then aggressively adjust based on inside-view information.
  *   **The Result:** The forecasters who performed *worst* were often those who relied too heavily on abstract models (outside view) without updating for specific news, or those who relied only on stories (inside view). The winners were "eclectic."
  *   **The Pushback:** Your position is that the outside view is the *default*. The data suggests the default should be **Bayesian Updating**. The outside view is just the Prior. The inside view is the Likelihood. Ignoring the Likelihood because the Prior is "safer" is statistically irrational.
  *   **Credence Shift:** If you accept Tetlock's data as the gold standard, you must admit that "Outside-View Fundamentalism" is a sub-optimal strategy compared to "Bayesian Integration." This should lower your confidence in the *fundamentalist* claim to near **0%**, while maintaining high confidence in the *importance* of base rates.

  ### 4. The Self-Defeating Meta-Argument
  You asked if applying the outside view to the outside view defeats it. Yes, it does.

  *   **The Argument:** Let's construct the reference class: "Epistemic strategies employed by humans to predict complex outcomes."
  *   **The Base Rate:** What is the success rate of rigid heuristic adherence in complex systems? The history of science and forecasting suggests that rigid methodological monism (always use method X) tends to fail when environments shift.
  *   **The "Method" Base Rate:** Most forecasting methods have low accuracy. Does the "Outside View Method" have a track record?
      *   If you say "Yes, it works better than inside view," you are making an inside-view claim about the method's specific causal efficacy.
      *   If you say "We need an outside view on the Outside View," you enter an infinite regress.
  *   **The Knockout:** The outside view tells us that **humans are bad at identifying when to use the outside view.** (See: Reference Class Tennis). Therefore, the outside view dictates that you should not trust your own judgment about when the outside view applies.
  *   **Credence Shift:** This paradox should reduce your confidence in your *ability to apply* the view, even if the view itself is sound. Reduce confidence in your implementation by **25%**.

  ### 5. Falsifiability and Insulation
  You asked if you've insulated the view. **You have.**

  *   **The Insulation:** Whenever the outside view fails, you attribute it to "bad reference class." But since reference class selection is subjective (see Point 1), this makes the theory unfalsifiable. Any failure can be retroactively explained by "you picked the wrong class."
  *   **The Fix:** To make this falsifiable, you must pre-register your reference class selection criteria. If you cannot do that, you are not a fundamentalist; you are a story-teller who uses statistics as props.
  *   **The Problem:** Unfalsifiable views are not epistemic tools; they are ideologies. If you cannot specify *in advance* what evidence would make you abandon the outside view (e.g., "If a causal model beats the base rate 3 times in a row in domain X"), you are dogmatizing.

  ### Summary: What Would Shift My Credence?
  If I were to quantify the shift required to move you from "Fundamentalist" to "Pragmatist":

  1.  **Evidence of Non-Stationarity:** Show me a domain where the base rate changed by >50% over a decade due to a known mechanism (e.g., AI compute costs). If the outside view predicts the old rate and the inside view (mechanism) predicts the new rate, the outside view is epistemically inferior in that domain. **(Shift: -30% in tech domains)**
  2.  **Evidence of Expert Integration:** Show me data where forecasters who *adjusted* base rates by >20% based on inside info outperformed those who stuck to the base rate. (Tetlock's data already does this). **(Shift: -40% in general forecasting)**
  3.  **The "Fatalism" Cost:** Show me cases where using the outside view caused agents to abandon viable projects that would have succeeded *because* they abandoned them. (Self-fulfilling prophecy). The outside view optimizes for calibration, not necessarily utility. **(Shift: -20% in decision-making contexts)**

  ### Final Verdict
  The outside view is a **necessary constraint**, not a **sufficient method**.

  Your position is that the inside view is a "crutch." I argue the opposite: The outside view is the crutch for those unwilling to do the hard work of causal modeling. It is cognitively cheaper to look up a statistic than to understand a system.

  **Rational Starting Point:**
  1.  **Start with the Outside View** (to combat optimism bias).
  2.  **Apply the Inside View** (to identify causal differentiators).
  3.  **Discount the Inside View** (because you are likely overconfident in your causal model).
  4.  **Integrate.**

  If you refuse step 2 and 3, you are not being rational; you are being lazy. You are trading the bias of optimism for the bias of **historical determinism**.

  **How seriously take the self-defeat?** Very. If the outside view implies that human judgment is unreliable, it implies your judgment in selecting the reference class is unreliable. Therefore, the output of the outside view is contaminated by the very bias it seeks to avoid. You must treat the outside view's output as a *noisy signal*, not a *ground truth*.

  **Actionable Advice:** Stop calling yourself a fundamentalist. It implies you've stopped updating. Call yourself a **Bayesian Anchorer**. It keeps the base rate central but admits that the likelihood ratio (inside view) is where the truth often hides.
