answer: |-
  **The Illusion of Derivation: Indeterminacy and Interpersonal Comparison in Harsanyi's Aggregation Theorem**

  John Harsanyi's aggregation theorem stands as one of the most ambitious attempts in modern welfare economics to bridge the gap between positive rational choice theory and normative ethics. His programme sought to demonstrate that classical utilitarianism—the doctrine that social welfare is the sum of individual utilities—could be derived from non-ethical premises, specifically the axioms of rational choice under uncertainty and the Pareto principle. However, a rigorous examination reveals that this derivation is fundamentally incomplete. The theorem succeeds in establishing the *form* of the social welfare function but fails to determine its *content*. Specifically, the indeterminacy of the weights assigned to individual utilities means the theorem is consistent with virtually any distributional principle. Resolving this indeterminacy necessitates interpersonal comparisons of utility (ICU) of a robust kind, precisely the sort of ethical commitment the axiomatic apparatus was purported to render unnecessary. Consequently, Harsanyi's project does not derive utilitarianism from rationality alone; rather, it smuggles ethical assumptions into the weighting mechanism, undermining the claim that the conclusion follows from non-ethical premises.

  To understand the shortfall, one must first grasp the technical relationship between von Neumann–Morgenstern (vNM) utility functions and the aggregation result. Harsanyi posits that if individual preferences and social preferences both satisfy the vNM axioms of expected utility theory, and if the social preference ordering satisfies the Pareto principle, then the social welfare function ($W$) must be a linear combination of individual utility functions ($U_i$). Mathematically, this is expressed as:

  $$W = \sum_{i=1}^{n} a_i U_i + b$$

  where $a_i$ are non-negative weights and $b$ is a constant. Harsanyi argues that this structure vindicates utilitarianism. Yet, this conclusion relies on a conflation of mathematical form with ethical substance. The theorem proves that social welfare is a weighted sum, but it remains silent on the values of the weights $a_i$. Without a determination of these weights, the theorem is compatible not only with utilitarianism (where all $a_i$ are equal) but also with inegalitarian hierarchies, prioritarianism, or any other system that respects the Pareto principle. A society that prioritises the utility of a specific caste simply requires higher weights for members of that caste; the linearity of the function remains intact. Thus, the aggregation theorem, in isolation, is distributionally neutral.

  The crux of the problem lies in the nature of vNM cardinality. It is often asserted that vNM utility is 'cardinal', distinguishing it from the ordinal utility of standard consumer theory. This is true, but only in a limited, intrapersonal sense. A vNM utility function is unique only up to a positive affine transformation. That is, if $U_i$ represents an individual's preferences, then $U'_i = \alpha U_i + \beta$ (where $\alpha > 0$) represents the same preferences. This cardinality allows an individual to compare the intensity of their own preferences across different lotteries; it permits them to say they prefer the jump from outcome $A$ to $B$ more than the jump from $C$ to $D$. However, this intrapersonal scale provides no metric for interpersonal comparison.

  For the summation $\sum a_i U_i$ to have ethical meaning as a utilitarian calculus, the units of $U_i$ must be comparable across persons. If individual $i$'s utility scale ranges from 0 to 1, and individual $j$'s scale ranges from 0 to 1,000,000, summing their utilities without normalisation is mathematically incoherent and ethically arbitrary. The vNM axioms fix the scale and origin for each individual independently, based on their risk attitudes. They do not, and cannot, anchor these scales to a common zero point or a common unit of measurement. Consequently, the weights $a_i$ in Harsanyi's equation perform a dual function: they represent the moral importance of the individual, but they also act as conversion factors to render the disparate utility scales commensurable.

  Harsanyi attempts to bypass this difficulty by invoking the concept of the 'impartial observer' in related work, suggesting that rational agents behind a veil of ignorance would assign equal weights to all individuals. However, within the strict confines of the aggregation theorem, this move is extraneous. The theorem's axioms—rationality and Pareto efficiency—do not entail equal weights. To assert that $a_i = a_j$ is to introduce a substantive ethical premise regarding the equality of moral worth. It is not a deduction from the logic of rational choice. If one accepts the vNM axioms and the Pareto principle but rejects the ethical premise of equality, one can consistently accept the aggregation theorem while rejecting utilitarianism.

  Critics, such as Amartya Sen and John Weymark, have highlighted that the indeterminacy of the weights renders the theorem vacuous regarding distributional justice unless one assumes full interpersonal comparability of utility levels and units. Harsanyi's defence often rests on the claim that his framework requires only 'unit comparability'. Yet, even establishing unit comparability requires information that is not present in the preference orderings or the risk choices of the individuals. The vNM apparatus reveals how individuals trade off probabilities against outcomes, but it does not reveal whether a 'util' for one person corresponds to the same subjective experience or welfare gain as a 'util' for another. To assume they do is to make an empirical or metaphysical claim about human psychology that lies outside the scope of the axioms.

  Therefore, the claim that utilitarianism is derived from non-ethical premises is unsustainable. The derivation holds only if one presupposes the very ethical conclusion one seeks to prove. If the weights are left indeterminate, the theorem fails to specify a normative guide for policy. If the weights are fixed to achieve utilitarianism, they must be fixed by an ethical stipulation of equality. This stipulation cannot be found within the vNM axioms, which are concerned with consistency of choice, nor in the Pareto principle, which is concerned with efficiency. It must be imported from a moral theory that asserts the equal standing of persons.

  Furthermore, by attempting to resolve the weighting problem through the formalism of rational choice, Harsanyi obscures the ethical labour being performed. The axiomatic approach creates an illusion of scientific neutrality, suggesting that the move from 'is' (preferences) to 'ought' (social welfare) is a matter of mathematical necessity. In reality, the transition relies on the hidden premise that the arbitrary scales of vNM utility can be harmonised into a single social metric without loss of information or ethical distortion. This harmonisation is not a technical step; it is a moral one. It requires a judgement that the intensity of preference, as revealed by risk-taking behaviour, is the appropriate currency of justice, and that this currency is fungible across persons.

  In conclusion, Harsanyi's aggregation theorem falls short of its foundational ambition. While it elegantly demonstrates that a Paretian social welfare function satisfying vNM axioms must be linear, it leaves the crucial question of distribution entirely unresolved. The indeterminacy of the weights means the theorem is consistent with any distributional principle that respects Pareto efficiency. To narrow the result to classical utilitarianism, one must impose equal weights, a move that requires robust interpersonal comparisons of utility. Since the vNM framework provides only intrapersonal cardinality, justifying these comparisons demands ethical premises regarding the commensurability of human welfare and the equality of moral agents. Thus, the theorem does not derive utilitarianism from non-ethical premises; rather, it formalises utilitarianism once those ethical premises are assumed. The axiomatic apparatus does not eliminate the need for moral philosophy; it merely disguises it within the algebra of weights.
