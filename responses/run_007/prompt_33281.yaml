answer: |-
  To rehabilitate the Principle of Indifference (PoI), one must move from the **Naive PoI** ("assign equal probability to mutually exclusive possibilities when there is no evidence to the contrary") to a **Structured PoI** that specifies *which* possibilities count and *under what description*.

  The following desiderata outline what a successful theory of probability under ignorance must achieve. They are divided into **Non-Negotiable Constraints** (failure implies the theory is not a theory of probability) and **Theoretical Virtues** (failure implies the theory is weak, incomplete, or pragmatically limited).

  ---

  ### I. Non-Negotiable Constraints (Formal Coherence)

  These requirements are definitional. A system violating them may be a logic of belief, but it is not a probability theory in the standard sense, and thus cannot rehabilitate the PoI as a probabilistic principle.

  #### 1. Probabilistic Coherence (Kolmogorov Consistency)
  *   **Requirement:** The assigned values must satisfy the axioms of probability (non-negativity, normalization, finite/countable additivity).
  *   **Motivation:** If the outputs violate coherence, the agent is susceptible to a Dutch Book (a set of bets guaranteeing a loss). A principle intended to guide rational belief under ignorance cannot mandate irrational betting behavior.
  *   **Status:** **Non-Negotiable.**

  #### 2. Logical Equivalence
  *   **Requirement:** If proposition $A$ is logically equivalent to proposition $B$, then $P(A) = P(B)$.
  *   **Motivation:** Probabilities attach to the truth conditions of propositions, not their linguistic formulation. If "It will rain" and "It is not the case that it will not rain" receive different probabilities, the system is tracking syntax rather than semantics.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Core Desiderata (Handling Ignorance)

  These requirements address the specific failures of the Naive PoI. They are the battleground where rehabilitation attempts succeed or fail.

  #### 3. Representation Invariance (The "Water-and-Wine" Constraint)
  *   **Requirement:** The probability assignment must be invariant under smooth, one-to-one reparameterizations of the state space. If ignorance is described by variable $x$, and $y = f(x)$ is a valid alternative description of the same physical magnitude, the probability distribution derived from ignorance of $x$ must be transformable to the distribution derived from ignorance of $y$ without contradiction.
  *   **Motivation (Water-and-Wine):** Consider a mixture where the ratio of water to wine ($r$) is between 1 and 3.
      *   Naive PoI on $r$: Uniform on $[1, 3]$, mean = 2.
      *   Naive PoI on $1/r$ (wine to water): Uniform on $[1/3, 1]$, mean = 2/3 (implies water/wine mean = 1.5).
      *   **The Conflict:** The same state of ignorance yields different expectations depending on whether we measure "water per wine" or "wine per water."
      *   **Generalization:** This is not just about ratios. It applies to any continuous parameterization (temperature in Celsius vs. Fahrenheit, time vs. frequency). A rehabilitated PoI must identify a **privileged measure** or admit that no unique probability exists.
  *   **Status:** **Theoretical Virtue (but critical).** Some theories (Imprecise Probability) sacrifice uniqueness to save this; others (Jaynes' MaxEnt) try to satisfy it via symmetry groups.

  #### 4. Partition Independence (The "Cube Factory" Constraint)
  *   **Requirement:** The assignment should not depend arbitrarily on how the logical space is carved up (the "graining" of the possibility space), provided the underlying physical facts remain constant.
  *   **Motivation (Cube Factory):** A factory produces cubes with side length $L$ between 1 and 3 cm.
      *   Naive PoI on Length ($L$): Uniform on $[1, 3]$. $P(L < 2) = 0.5$.
      *   Naive PoI on Face Area ($A = L^2$): Uniform on $[1, 9]$. $P(A < 4) \rightarrow P(L^2 < 4) \rightarrow P(L < 2) = 3/8 = 0.375$.
      *   Naive PoI on Volume ($V = L^3$): Uniform on $[1, 27]$. $P(V < 8) \rightarrow P(L < 2) = 7/26 \approx 0.27$.
      *   **The Conflict:** "Ignorance about the cube" yields three different probabilities for the same event ($L < 2$) depending on whether we conceive the factory as randomizing length, area, or volume.
      *   **Generalization:** This generalizes to the **Problem of Partition Dependence**. If I divide a possibility space into $\{A, B\}$ vs $\{A, B_1, B_2\}$ (where $B = B_1 \cup B_2$), Naive PoI assigns $1/2$ in the first case and $1/3$ to $A$ in the second. A rehabilitation must specify which partition reflects the **objective symmetries** of the chance setup.
  *   **Status:** **Theoretical Virtue.**

  #### 5. Symmetry Identification (The "Bertrand" Constraint)
  *   **Requirement:** The theory must provide a principled method for identifying the relevant symmetry group of the problem, rather than assuming symmetry applies to all descriptions.
  *   **Motivation (Bertrand's Chord):** What is the probability that a "random chord" of a circle is longer than the side of an inscribed equilateral triangle?
      *   Method 1 (Random Endpoints): $P = 1/3$.
      *   Method 2 (Random Radius): $P = 1/2$.
      *   Method 3 (Random Midpoint): $P = 1/4$.
      *   **The Conflict:** "Random" is undefined. The Naive PoI assumes the space of chords has a natural uniform measure. It does not.
      *   **What a Theory Must Get Right:** It must not simply pick an answer. It must either:
          1.  Identify a physical mechanism (e.g., "straws thrown from a distance") that dictates the measure (frequentist rehabilitation).
          2.  Identify a transformation group (e.g., rotation, translation, scaling) that leaves the problem invariant and derive the unique Haar measure (Jaynes' rehabilitation).
          3.  Declare the question ill-posed until the mechanism is specified (Skeptical rehabilitation).
  *   **Status:** **Theoretical Virtue.**

  #### 6. Action-Guiding Uniqueness
  *   **Requirement:** For any well-posed problem of ignorance, the theory should yield a single, precise probability distribution (or a compelling reason why it cannot).
  *   **Motivation:** The primary function of probability in decision theory is to calculate expected utility. If a theory of ignorance yields a set of distributions (e.g., $P \in [0.3, 0.7]$), it fails to mandate a specific action unless supplemented by a decision rule (like Maximin). A rehabilitation of PoI aims to justify *the* rational credence, not just a range.
  *   **Status:** **Theoretical Virtue.** (This is the main point of contention between Objective Bayesians and Imprecise Probabilists).

  ---

  ### III. Impossibility Results and Trade-offs

  A successful rehabilitation must explicitly navigate the tensions between the desiderata above. It is provably impossible to satisfy all of them simultaneously in the general case.

  #### 1. The Uniqueness vs. Invariance Tension
  *   **The Conflict:** If you demand **Uniqueness** (Desideratum 6) and **Representation Invariance** (Desideratum 3) for *all* continuous problems, you run into contradictions. There is no probability distribution that is uniform over all possible parameterizations of a continuous variable.
  *   **The Consequence:**
      *   **Option A (Jaynes/MaxEnt):** Sacrifice generality. Uniqueness is maintained only when a specific symmetry group can be identified (solving Bertrand). If no symmetry group exists, the PoI does not apply.
      *   **Option B (Imprecise Probability/Keynes):** Sacrifice Uniqueness. Accept that ignorance yields a *set* of probabilities (e.g., the interval $[0, 1]$ for Water-and-Wine). This satisfies Invariance (the set transforms correctly) but fails to guide action without extra decision rules.
      *   **Option C (Subjective Bayesianism):** Sacrifice Objectivity. Deny that PoI is a logical principle. priors are subjective; coherence is the only constraint. (This abandons the rehabilitation project entirely).

  #### 2. The Countable Additivity Tension
  *   **The Conflict:** If the possibility space is countably infinite (e.g., "Which integer is the winner?"), the Naive PoI suggests $P(n) = \epsilon$. To sum to 1, $\epsilon$ must be 0. But if $P(n) = 0$ for all $n$, the sum is 0, not 1.
  *   **The Consequence:** A rehabilitation must either reject Countable Additivity (allowing improper priors, which complicates conditionalization) or restrict the PoI to finite spaces (severely limiting its scope).

  #### 3. The "Killer" Requirement
  *   **Representation Invariance (Desideratum 3)** is the requirement that does the most work in eliminating the Naive PoI.
  *   **Why:** The Naive PoI is essentially the claim that *linguistic description* maps directly to *logical weight*. Representation Invariance proves that linguistic description is arbitrary. Therefore, the Naive PoI is false.
  *   **Differentiation:** Remaining contenders are distinguished primarily by how they respond to this failure:
      *   **Objective Bayesians:** Try to find a "deep" description (symmetry groups) that restores invariance.
      *   **Imprecise Probabilists:** Accept the failure of uniqueness to preserve invariance.
      *   **Frequentists:** Ground the measure in physical propensities rather than logic.

  ---

  ### IV. Scorecard of Desiderata

  | Desideratum | Description | Status | Tension / Trade-off |
  | :--- | :--- | :--- | :--- |
  | **1. Coherence** | Obeys Kolmogorov Axioms. | **Non-Negotiable** | None. |
  | **2. Logical Equivalence** | $A \iff B \implies P(A)=P(B)$. | **Non-Negotiable** | None. |
  | **3. Rep. Invariance** | Invariant under reparameterization (Water-and-Wine). | **Virtue** | Conflicts with Uniqueness in continuous spaces. |
  | **4. Partition Indep.** | Insensitive to arbitrary graining (Cube Factory). | **Virtue** | Requires identifying "natural" variables. |
  | **5. Symmetry ID** | Identifies relevant transformation groups (Bertrand). | **Virtue** | Requires physical or structural knowledge beyond "ignorance." |
  | **6. Uniqueness** | Yields a single precise probability. | **Virtue** | Often requires dropping strong Invariance or restricting scope. |
  | **7. Countable Add.** | Works for infinite discrete spaces. | **Virtue** | Conflicts with uniform priors over infinite sets. |

  ---

  ### V. Summary for Your Paper

  When evaluating proposals for rehabilitating the Principle of Indifference, you should assess them based on which of the **Theoretical Virtues** they sacrifice to maintain **Non-Negotiable Constraints** and **Representation Invariance**.

  1.  **If a theory yields unique probabilities for Water-and-Wine:** Check if it violates Representation Invariance (i.e., does it arbitrarily privilege one variable over its inverse?). If so, it is a disguised Naive PoI.
  2.  **If a theory solves Bertrand's Paradox:** Check if it relies on physical assumptions (making it a physical chance theory, not a logical principle) or on Group Invariance (making it applicable only to symmetric problems).
  3.  **If a theory handles the Cube Factory:** Check if it identifies *why* length is more "fundamental" than volume, or if it admits a range of probabilities.

  **The Central Thesis for Your Evaluation:**
  There is no "free lunch." A successful rehabilitation cannot simply be a rule for assigning numbers; it must be a theory of **description invariance**. The Naive PoI fails because it treats the *syntax* of the problem as the *semantics* of the probability space. Any adequate theory must either:
  1.  Provide an algorithm for translating syntax into a canonical semantic space (e.g., Jaynes' Maximum Entropy/Group Invariance).
  2.  Deny that a canonical semantic space exists and output indeterminate probabilities (e.g., Imprecise Probability).

  If a proposal claims to do the former without specifying the algorithm for finding the canonical description, it has not solved the paradoxes; it has merely hidden them. If it claims to do the latter, it must explain how such indeterminate probabilities can guide rational action without collapsing into arbitrariness.
