answer: |-
  This is a sophisticated and compelling use of *Arrival*. The film's non-linear narrative structure uniquely positions it to explore intergenerational ethics, specifically the **Non-Identity Problem** and the **Procreation Asymmetry**.

  However, to use this effectively in a classroom, you must navigate the fact that population ethics is one of the most fractured subfields of moral philosophy. There is very little "consensus" on the big questions. Below is a breakdown of how to teach this, distinguishing between standard definitions and genuinely contested claims.

  ### 1. The Framework: Defining the Asymmetry
  **Status:** *The definition is standard; the validity is contested.*

  Start by clarifying the **Procreation Asymmetry** (often associated with Jan Narveson or Derek Parfit).
  *   **The Claim:** We have a strong moral reason *not* to bring into existence a child whose life would be miserable (filled with suffering). However, we do *not* have a parallel moral reason *to* bring into existence a child whose life would be happy.
  *   **The Implication:** Creating a happy person is morally neutral (permissible, but not required). Creating a suffering person is morally wrong.
  *   **The Contestation:** **Total Utilitarianism** rejects the asymmetry entirely. A Total Utilitarian argues that creating a happy person *is* a moral good because it increases total utility in the universe. Conversely, **Negative Utilitarians** or **Anti-Natalists** (e.g., Benatar) might argue the asymmetry is too weak; they argue that the presence of pain is bad, but the absence of pleasure is *not* bad, making procreation almost always impermissible.

  **Teaching Tip:** Make sure students understand that treating the Asymmetry as "true" is already taking a side in a debate between Person-Affecting Views (which support the asymmetry) and Impersonal Views (which often reject it).

  ### 2. Louise's Choice: Rejecting or Accepting the Asymmetry?
  **Status:** *Interpretive, but leans toward acceptance with a shift in locus.*

  Louise knows Hannah will live a life that is largely joyful but ends in premature death and illness. She chooses to conceive her anyway.

  *   **Does she reject the asymmetry?**
      *   **No.** She does not act as if she has a *duty* to create Hannah. She isn't saving the universe by having a child. She acknowledges there is no moral imperative forcing her hand.
      *   **Yes (in a sense).** She rejects the idea that the *potential for suffering* (the "Reason Against" in the asymmetry) acts as a veto. The asymmetry says if a life is "miserable," don't do it. Louise judges Hannah's life as **worth living** despite the tragedy. Therefore, the "Reason Against" (don't create misery) is not triggered.
  *   **Where does the reason come from?**
      *   The film locates the reason in **affirmation**, not obligation. Louise says, "I forgot how good it feels to be loved." Her reason is experiential and relational.
      *   **Population Ethics Lens:** This aligns with the asymmetry's permission structure. Since there is no duty *not* to create a life worth living, she is free to act on personal reasons (love, curiosity, destiny).
      *   **Ian's Counterpoint:** Ian (the father) represents the intuitive pull of the asymmetry's negative duty. He cannot accept the future pain. He leaves. He weighs the "Reason Against" (grief/death) as heavier than the "Reason For" (joy). Louise weighs them differently.

  ### 3. Where the Film "Stacks the Deck"
  **Status:** *Critical analysis (Settled that the film omits details; Contested how much that matters).*

  The film makes it easy for the audience to side with Louise by obscuring the hard data required for ethical calculation.

  *   **Hannah's Subjective Experience:**
      *   **The Deck Stacking:** We see Hannah laughing, hugging, and learning. We do *not* see Hannah suffering from the rare disease. We do not see her fear of death, her physical pain, or her frustration at a life cut short. The suffering is almost entirely **Louise's** (anticipatory grief and mourning).
      *   **Ethical Implication:** The Procreation Asymmetry is concerned with the *child's* welfare, not the *parent's*. If Hannah's life is net-positive (Joy > Suffering), the asymmetry permits it. By hiding Hannah's suffering, the film ensures the audience calculates "Net Positive" easily.
      *   **The Hard Question:** If Hannah's illness involved years of agonizing pain, would the life still be "worth living"? If the suffering outweighed the joy, the asymmetry would dictate Louise *should not* have conceived her. The film avoids this calculation.

  *   **The "Gift" of Existence:**
      *   **The Deck Stacking:** The film treats existence as an intrinsic good ("I want to give you a gift").
      *   **Ethical Implication:** This is contested. In population ethics, you cannot say you benefited someone by bringing them into existence unless their life is worth living (The Non-Identity Problem). You can't compare "Existing with pain" to "Not existing" because "Not existing" isn't a state of being deprived. The film relies on the poetic intuition that existence is better than non-existence, which is philosophically slippery.

  ### 4. Filling in the Blanks: What would the Asymmetry say?
  **Status:** *Application of theory (Settled within the framework; Contested across frameworks).*

  If you ask students to fill in the missing details, you can test the limits of the asymmetry.

  *   **Scenario A: Hannah's life is 90% joy, 10% pain (mostly Louise's grief).**
      *   **Asymmetry Verdict:** Permissible. No reason against (no misery), no reason for (no duty), but allowed. Louise is morally clear.
  *   **Scenario B: Hannah's life is 50% joy, 50% agonizing pain.**
      *   **Asymmetry Verdict:** This is the gray zone. Is the life "miserable"? If yes, Louise violates the negative duty. If no, she is still permissible.
      *   **Contested:** There is no consensus on where the threshold of "a life worth living" lies.
  *   **Scenario C: Hannah begs not to be born.**
      *   **Contested:** Since Hannah doesn't exist yet, she can't beg. But if Louise knows the specific child *Hannah* would prefer non-existence, does that change things? This touches on **Person-Affecting Restrictions**. Most theorists agree you shouldn't create a specific person who you know will regret existing. The film implies Hannah *does* love her life ("I'm so lucky"), which clears Louise ethically.

  ### 5. Pedagogical Map: Settled vs. Contested
  To ensure you don't present contested views as consensus, use this guide in your lecture:

  | Concept | Settled / Standard View | Genuinely Contested |
  | :--- | :--- | :--- |
  | **The Asymmetry** | It is a standard position in population ethics (Narveson/Parfit). | Whether the asymmetry is *true*. Total Utilitarians reject it; Anti-Natalists radicalize it. |
  | **Non-Identity** | It is logically true that Hannah cannot claim she was harmed by being born if her life is worth living (she wouldn't exist otherwise). | Whether this logic is morally satisfying. Many feel it allows parents to offload responsibility for creating suffering children. |
  | **Louise's Choice** | Under the Asymmetry, if Hannah's life is net-positive, Louise's choice is **permissible**. | Whether "permissible" is enough. Does Louise have a responsibility to consider Ian's grief? Does the parent's desire justify the child's risk? |
  | **Value of Life** | The film assumes life is inherently valuable. | Philosophers debate whether non-existence is a neutral state or a deprivation. |

  ### 6. Suggested Classroom Exercise
  **"The Threshold of Suffering"**
  Ask students to rewrite the montage of Hannah's life.
  1.  **Version A:** Keep the film's version (mostly happy, sudden death). Ask: Does the Asymmetry forbid this? (Answer: No).
  2.  **Version B:** Hannah lives 12 years, 6 of them in a hospital bed in pain. Ask: Does the Asymmetry forbid this? (Answer: Likely Yes, or at least highly problematic).
  3.  **Version C:** Hannah lives 12 years, is happy, but Louise knows *she* (Louise) will be so devastated by the loss that she becomes unable to function/care for others. Ask: Does the Asymmetry account for *Louise's* suffering? (Answer: The Asymmetry focuses on the *child*, but general utilitarianism would count Louise's pain).

  ### Summary for the Unit
  *Arrival* is a case study in **affirming the permissible**. Louise does not claim a moral *duty* to create happiness (which would violate the asymmetry). She claims a personal right to experience a life that she judges to be worth living, despite the pain.

  The film "stacks the deck" by aestheticizing the child's life and displacing the suffering onto the parent. To make it a rigorous ethics case study, you must force students to quantify Hannah's suffering. If Hannah's suffering is significant, Louise's choice moves from "heroic affirmation" to "potential violation of the negative duty" described by the Procreation Asymmetry.
