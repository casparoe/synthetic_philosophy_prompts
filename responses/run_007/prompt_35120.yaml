      *Drafting Game:*
      **Phase 1 (Normative):** Distribute slips. Ask students to write their ID number and answer: "What *should* a rational person do with the Extension Token opportunity: Keep it for themselves or Return it for the class good?" Collect in the Public jar. Do not reveal results yet.
      **Phase 2 (Surveillance):** Explain the rules: "If you Keep the slip, you are entered into the raffle for the Tokens. If you Return it, you are not. However, I will see who Kept." Give 2 minutes. Collect in the Public jar.
      **Phase 3 (The Ring):** Change the conditions. "I am leaving the room for 3 minutes. Use the opaque box. I cannot see who submitted what. The raffle rules remain: Keeping enters you; Returning does not." Leave the room. This implements the Ring of Gyges: immunity from detection.
      **Phase 4 (Revelation):** Return. Tally Phase 1 (Should), Phase 2 (Public Action), and Phase 3 (Private Action) on the board. Display the percentages of students who chose to "Keep" in each phase. Typically, Phase 1 shows high morality, Phase 2 shows moderate morality (fear of judgment), and Phase 3 shows high self-interest. Ask students to compare their own three choices silently before speaking.

      *Drafting Debrief:*
      Begin by asking: "Look at the shift from Phase 2 to Phase 3. Why did the numbers change if the rules of the raffle didn't?" Elicit the fear of reputation damage. Connect this to Glaucon's claim that justice is practiced unwillingly, only due to social constraint.
      Next, ask: "In Phase 1, why did you say people *should* return the token?" Guide them to see they view justice as good in itself (intrinsic), yet their actions in Phase 3 suggest they view it as burdensome (instrumental). Introduce Glaucon's threefold classification of goods: those welcomed for themselves, those for consequences, and those for both. Ask where they placed justice in Phase 1 versus Phase 3.
      Finally, pose the thought experiment: "If you could guarantee no one ever knew your Phase 3 choice, would you change it?" This mirrors the two lives: the unjust man seeming just versus the just man seeming unjust. Ask: "Who here feels angry at those who Kept in Phase 3?" This surfaces the social contract element—we condemn injustice because we fear suffering it, not because we hate doing it. Do not lecture; let the data from the board drive the realization that their behavior mirrors Glaucon's cynical anthropology.

      *Drafting Risks:*
      **Cynicism/Disengagement:** Students may treat the tokens as trivial. *Fix:* Emphasize the utility of extensions early; remind them assignments are coming.
      **Distrust of Anonymity:** Students may fear Phase 3 isn't truly anonymous. *Fix:* Literally leave the room. Use the opaque box. Verify the box is empty beforehand.
      **Moral Grandstanding:** Students may lie in Phase 1 to look good. *Fix:* Acknowledge this during debrief as part of the "seeming just" phenomenon.
      **Collusion:** Students might signal each other. *Fix:* Forbid communication during voting phases.
      **Guilt/Shame:** Students who "Kept" may feel attacked. *Fix:* Frame the discussion around human nature, not individual moral failure. Normalize the Glauconian impulse.

      *Drafting Limitations:*
      This game measures external motivation, not internal harmony. Glaucon argues injustice damages the *soul*, regardless of consequences. The game cannot simulate psychic health; it only simulates social reputation. Students might conclude justice is purely instrumental. You must clarify in the debrief that Plato's response (in later books) is that justice is intrinsic health, not just social contract. The game sets up the problem of motivation, not the metaphysical solution. It captures the *challenge*, not the *answer*.

