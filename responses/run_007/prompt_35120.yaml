answer: |-
  - **Setup and materials**
  Arrange seats in a semi-circle to facilitate discussion, but ensure enough distance for private writing. You need two collection boxes: one clear glass jar (labeled "Public") and one opaque, locked box (labeled "Private"). Prepare 18 slips of paper with unique ID numbers (known only to students) to track individual choices without names. The stakes are three "Extension Tokens" (24-hour, no-questions-asked deadline extensions for future assignments). These are highly valued currency in upper-division seminars. Place the tokens visibly on the desk. Explain that participation is mandatory, but choices are free. The tension relies on the perceived value of the tokens versus the social pressure of the classroom. Ensure students know the ID numbers allow *you* to track data for the debrief, but only in the Public phase. In the Private phase, emphasize that even you cannot link slips to students.

  - **The game: phases and rules**
  **Phase 1 (Normative Commitment):** Distribute slips. Ask students to write their ID number and answer: "What *should* a rational person do: Keep the token chance or Return it?" Collect in the Public jar. Do not reveal results. This establishes their professed values.
  **Phase 2 (Surveillance):** Explain the payoff: "If you Keep the slip, you are entered into the raffle for the three Extension Tokens. If you Return it, you are excluded. However, I will record who Kept." Emphasize that you will see their ID numbers. Give 2 minutes. Collect in the Public jar. This introduces social consequence.
  **Phase 3 (The Ring):** Dramatically change the conditions. "I am leaving the room for 3 minutes. Use the opaque box. I cannot see who submitted what, nor can I track ID numbers. The raffle rules remain: Keeping enters you; Returning does not." Leave the room. Wait outside the door. This implements the Ring of Gyges: total immunity from detection.
  **Phase 4 (Revelation):** Return. Open the opaque box. Tally Phase 1 (Should), Phase 2 (Public Action), and Phase 3 (Private Action) on the board. Display the percentages of students who chose to "Keep" in each phase. Typically, Phase 1 shows high morality, Phase 2 shows moderate morality (fear of judgment), and Phase 3 shows high self-interest. Ask students to compare their own three choices silently before speaking. The discrepancy between Phase 1 and Phase 3 is the data point. Ensure the raffle actually happens to maintain trust for future classes.

  - **Debrief**
  Begin by asking: "Look at the shift from Phase 2 to Phase 3. Why did the numbers change if the rules of the raffle didn't?" Elicit the fear of reputation damage. Connect this to Glaucon's claim that justice is practiced unwillingly, only due to social constraint.
  Next, ask: "In Phase 1, why did you say people *should* return the token?" Guide them to see they view justice as good in itself (intrinsic), yet their actions in Phase 3 suggest they view it as burdensome (instrumental). Introduce Glaucon's threefold classification of goods: those welcomed for themselves, those for consequences, and those for both. Ask where they placed justice in Phase 1 versus Phase 3.
  Finally, pose the thought experiment: "If you could guarantee no one ever knew your Phase 3 choice, would you change it?" This mirrors the two lives: the unjust man seeming just versus the just man seeming unjust. Ask: "Who here feels angry at those who Kept in Phase 3?" This surfaces the social contract element—we condemn injustice because we fear suffering it, not because we hate doing it. Do not lecture; let the data from the board drive the realization that their behavior mirrors Glaucon's cynical anthropology.

  - **What will predictably go wrong**
  **Cynicism/Disengagement:** Students may treat the tokens as trivial. *Fix:* Emphasize the utility of extensions early; remind them assignments are coming.
  **Distrust of Anonymity:** Students may fear Phase 3 isn't truly anonymous. *Fix:* Literally leave the room. Use the opaque box. Verify the box is empty beforehand.
  **Moral Grandstanding:** Students may lie in Phase 1 to look good. *Fix:* Acknowledge this during debrief as part of the "seeming just" phenomenon.
  **Collusion:** Students might signal each other. *Fix:* Forbid communication during voting phases.
  **Guilt/Shame:** Students who "Kept" may feel attacked. *Fix:* Frame the discussion around human nature, not individual moral failure. Normalize the Glauconian impulse.

  - **What the activity cannot capture**
  This game measures external motivation, not internal harmony. Glaucon argues injustice damages the *soul*, regardless of consequences. The game cannot simulate psychic health; it only simulates social reputation. Students might conclude justice is purely instrumental. You must clarify in the debrief that Plato's response (in later books) is that justice is intrinsic health, not just social contract. The game sets up the problem of motivation, not the metaphysical solution. It captures the *challenge*, not the *answer*.
