              1.  Survey: "What is the right thing to do?"
              2.  Round 1 (Visible): Contribute to a pool. If pool reaches threshold, everyone gets token. (Encourages justice).
              3.  Round 2 (Invisible): Same choice, but no one sees who contributed. If pool reaches threshold, everyone gets token.
              4.  The Twist: In Round 2, if you keep your token, you get one *plus* a bonus if others share.
