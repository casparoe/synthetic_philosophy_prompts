prompt: |-
  ok so I've been reading the back-and-forth between longtermists and neartermists in EA for like five years now and I still feel like nobody has actually sat down and produced the kind of adversarial collaboration document that would force both sides to stop talking past each other. You know the kind Scott Alexander writes about — where you get both camps to agree on a joint statement and then precisely nail down where they actually diverge.

  I want you to draft that document. Specifically, between a committed strong longtermist (someone who thinks the far future swamps near-term effects in expected value and that we should orient our priorities around influencing the long-run trajectory of civilization) and a committed neartermist (someone who thinks expected value reasoning over very long time horizons is too epistemically fragile to justify deprioritizing near-term suffering, and that we should focus on interventions where we can actually see the results).

  The document should have:

  - A numbered section of claims both sides can sign. These should be substantive, not just "we both agree 2+2=4." I'm talking about points in population ethics, expected value theory, existential risk, epistemic humility, etc. where there's actually overlap.
  - A disagreements table. Each row: neutral statement of the disagreement, the strong longtermist's preferred formulation of their own view, and the neartermist's preferred formulation of theirs. Each side should read their own column and say "yeah, that's what I think."
  - Cruxes. The sub-questions that, if resolved, would shift at least one side's confidence meaningfully. For each crux, what evidence or argument would both sides agree is relevant, and what each side predicts about it.
  - If any part of the dispute is mostly verbal (e.g., different definitions of "expected value" or "priority" that make the disagreement look bigger than it is), flag it.

  Also, please separate what's genuinely contested among people who actually know this stuff from what's basically settled. If there's a view that's contested, don't present it as the consensus. And if one side's position tends to get caricatured in blog posts, give the strongest version of it, not the dumb one.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Topic:** Longtermism vs. Neartermism within Effective Altruism (EA).
      *   **Format:** Adversarial Collaboration Document (Scott Alexander style).
      *   **Participants:** Committed Strong Longtermist (SL) vs. Committed Neartermist (SN).
      *   **Requirements:**
          *   Numbered section of substantive agreed claims.
          *   Disagreements table (Neutral statement, SL view, SN view).
          *   Cruxes (sub-questions, relevant evidence, predictions).
          *   Flag verbal disputes/semantic issues.
          *   Distinguish settled vs. contested issues.
          *   Steelman both sides (avoid caricatures).
      *   **Tone:** Rigorous, charitable, precise, epistemically humble but clear.

  2.  **Deconstruct the Positions:**
      *   **Strong Longtermism (SL):** Focuses on the astronomical value of the potential future. Key arguments: Expected Value (EV) over long timelines, existential risk (x-risk) reduction as the primary priority, trajectory changes. Willing to accept high uncertainty for high upside. Population ethics (total utilitarianism usually).
      *   **Neartermism (SN):** Focuses on reducing suffering now. Key arguments: Epistemic fragility of long-term forecasts, cluelessness (unintended consequences), moral urgency of present suffering, diminishing returns on x-risk work or difficulty in influencing it. Often prioritizes cause areas like global health, animal welfare, or systemic change with visible feedback loops.
      *   **Common Ground:** Both are generally consequentialist/utilitarian-leaning, care about doing good effectively, agree on the importance of evidence/reasoning, acknowledge x-risk is bad, acknowledge present suffering is bad.

  3.  **Drafting - Section 1: Areas of Agreement (The "Common Ground"):**
      *   Need substantive claims, not trivialities.
      *   *Idea 1:* Consequentialism. Both care about outcomes.
      *   *Idea 2:* X-risk is bad. Even neartermists don't want humanity to go extinct tomorrow.
      *   *Idea 3:* Present suffering matters. Longtermists don't want people to suffer now.
      *   *Idea 4:* Epistemic standards. Both want rigorous reasoning, though they apply it differently.
      *   *Idea 5:* Resource constraints. We can't do everything; prioritization is necessary.
      *   *Refinement:* Make sure these aren't just "we agree suffering is bad." Make it about the *framework*. E.g., "The value of a life does not depend on when it is lived" (Time neutrality). "Existential catastrophe is irreversible."

  4.  **Drafting - Section 2: The Disagreements Table:**
      *   Need neutral phrasing.
      *   *Dimension 1:* Epistemic access to the future. (Can we predict impact?)
      *   *Dimension 2:* Moral Weight of Future People. (Do they count equally?)
      *   *Dimension 3:* Cluelessness/Unintended Consequences. (Does acting now mess up the future?)
      *   *Dimension 4:* Tractability of X-Risk. (Can we actually reduce it effectively?)
      *   *Dimension 5:* Discounting. (Pure time preference vs. zero discount rate).
      *   *Steelman Check:* Ensure SL isn't "ignore all current suffering" and SN isn't "the future doesn't matter." SL says "EV dominates despite uncertainty." SN says "Uncertainty swamps EV calculations."

  5.  **Drafting - Section 3: Cruxes:**
      *   What would change minds?
      *   *Crux 1:* The "Astronomical Waste" argument's sensitivity to probability estimates. If x-risk reduction is 0.0001% effective, does it still win?
      *   *Crux 2:* Moral Circle Expansion. Does helping now help later? (Correlation of interventions).
      *   *Crux 3:* Epistemic Decay. How fast does predictive power decay over time?
      *   *Crux 4:* Population Ethics. Totalism vs. Person-Affecting views (though many neartermists are also totalists, just skeptical of the *application*). Let's focus on the *application* of totalism under uncertainty.

  6.  **Drafting - Section 4: Verbal/Semantic Disputes:**
      *   "Longtermism" as a moral view vs. a strategic priority.
      *   "Expected Value" (mathematical expectation vs. practical heuristic).
      *   "Suffering" (aggregate vs. trajectory).

  7.  **Review and Refine:**
      *   *Check:* Did I distinguish settled vs. contested? Yes, in the intro or footnotes.
      *   *Check:* Is the tone right? Needs to be dry, analytical, EA-community literate.
      *   *Check:* Are the positions strong? Avoid the "longtermists want to let people die now" strawman. Avoid the "neartermists are short-sighted hedonists" strawman.
      *   *Self-Correction on Neartermism:* "Neartermism" isn't always a positive identity. Many just call themselves "Global Health & Welfare" proponents or "Skeptics of Longtermism." I should label the column "Skeptic of Strong Longtermism (Neartermist Priority)" to be precise.
      *   *Self-Correction on Longtermism:* Ensure distinction between "Strong Longtermism" (future swamps all) and "Weak Longtermism" (future is one important factor). The prompt asks for "Committed Strong Longtermist."
      *   *Refining the "Agreement" section:* Make sure to include the "Time Neutrality" principle. Both usually agree time *itself* doesn't matter, they disagree on our *ability* to affect it.

  8.  **Final Polish:** Organize with clear headings. Add an introductory context setting. Ensure the "Cruxes" are actionable. (Proceed to generate output based on these thoughts).

  *(Self-Correction during drafting)*: I need to be careful about Population Ethics. Not all neartermists reject total utilitarianism. Many accept totalism but reject the *epistemic feasibility* of acting on it. I should frame the disagreement around *action-guidance under uncertainty* rather than just fundamental axiology, though axiology is a factor.

  *(Refining the "Verbal Disputes" section)*: A key verbal dispute is often about what "priority" means. Is it "sole priority" or "marginal priority"? Most strong longtermists admit we should do *some* near-term good. Most neartermists admit the future is *large*. The fight is over the *margin* of the next dollar. I must highlight this.

  9.  **Final Output Generation** (incorporating the above structure).
answer: |-
  # ADVERSARIAL COLLABORATION: STRONG LONGTERMISM VS. NEARTERMIST PRIORITY
  **Date:** October 26, 2023
  **Participants:** 
  *   **SL:** Proponent of Strong Longtermism (Future-oriented trajectory change)
  *   **SN:** Proponent of Neartermist Priority (Skeptic of long-horizon EV maximization)

  **Context:** This document attempts to map the disagreement between two camps within the Effective Altruism (EA) community. It distinguishes between *fundamental moral disagreement* (axiology) and *empirical/epistemic disagreement* (forecasting and tractability). Both parties agree that the goal is to do the most good possible, but diverge on which heuristics and cause areas achieve this.

  ---

  ## I. SUBSTANTIVE AREAS OF AGREEMENT
  *Both parties sign onto the following claims. These are not trivialities; they represent the shared philosophical infrastructure that makes this a family dispute rather than a war between strangers.*

  1.  **Consequentialist Framework:** The moral value of an action is determined primarily by its consequences. Intentions matter only insofar as they correlate with outcomes or build virtuous capacity.
  2.  **Time Neutrality (Axiological):** The date on which a life is lived does not intrinsically alter its moral value. A life of equal quality in 2100 is as valuable as a life of equal quality in 2024, *ceteris paribus*. (Disagreement exists on whether *ceteris paribus* ever holds across time).
  3.  **Existential Catastrophe is Irreversible:** An event that causes human extinction or permanent civilizational collapse permanently forecloses all future potential value. Both sides agree this is a uniquely bad outcome compared to reversible catastrophes.
  4.  **Present Suffering is Intrinsically Bad:** Severe suffering occurring now (e.g., factory farming, extreme poverty, torture) is bad and constitutes a moral claim on resources. SL does not deny this badness; SN does not deny the potential badness of future suffering.
  5.  **Epistemic Humility is Required:** Our ability to predict the future is imperfect. Overconfidence in complex causal chains is a known cognitive bias that both sides aim to mitigate.
  6.  **Prioritization is Necessary:** Resources (time, money, attention) are scarce. We cannot maximize all good causes simultaneously. We must make trade-offs based on comparative advantage and expected impact.
  7.  **The "Long Future" Premise:** Both sides acknowledge that, physically, the future could be vast (billions of years, potentially astronomical populations). The disagreement is not about the *physical possibility* of a long future, but the *probability of influencing it*.
  8.  **Feedback Loops Matter:** Interventions that create positive feedback loops (e.g., institutional stability, knowledge preservation) are generally more robust than one-off transfers, regardless of time horizon.

  ---

  ## II. DISAGREEMENTS TABLE
  *This section isolates the specific points of divergence. The "Neutral Statement" describes the parameter being debated. The "SL" and "SN" columns represent the steelmanned position of each side.*

  | Neutral Statement of Disagreement | Strong Longtermist (SL) Formulation | Neartermist Priority (SN) Formulation |
  | :--- | :--- | :--- |
  | **1. Epistemic Decay Rate**<br>How quickly does our ability to predict the impact of an intervention degrade over time? | **Slow Decay / Robustness:** Certain interventions (e.g., reducing nuclear war risk, AI alignment) have robustly positive expected value over centuries. The sign of the effect is knowable even if the magnitude is uncertain. | **Rapid Decay / Cluelessness:** Causal chains longer than a few decades become dominated by noise. We cannot reliably know if an intervention today helps or harms the long-term future due to complex systems and unintended consequences. |
  | **2. The Dominance of Tail Risk**<br>Does the sheer magnitude of the potential future swamp high uncertainty? | **EV Dominance:** Even a tiny probability (e.g., 1 in 10,000) of affecting an astronomical future yields higher Expected Value than certainty of saving a finite number of lives now. | **Epistemic Fragility:** When probabilities are this small and stakes this high, our estimates are noise, not signal. "Pascal's Mugging" dynamics apply; we should cap credence in unverified high-stakes claims. |
  | **3. Correlation of Interventions**<br>Do near-term improvements (health, governance) naturally lead to better long-term outcomes? | **Weak Correlation / Trajectory Sensitivity:** Near-term welfare does not guarantee long-term survival. We could be a "happy zoo" that still goes extinct. Specific trajectory changes (e.g., locking in moral values, technical safety) are required and may not overlap with welfare work. | **Strong Correlation / Foundation Building:** A future that emerges from a present with less suffering, better institutions, and more rationality is inherently more likely to be good and stable. You cannot build a good future on a foundation of present misery. |
  | **4. Marginal Tractability**<br>Where is the next dollar most effective? | **X-Risk Reduction:** The marginal dollar in existential risk reduction (especially AI/Bio) has higher EV because the stakes are infinite and the field is currently underfunded relative to the problem size. | **Suffering Reduction / Systemic Change:** The marginal dollar in global health, animal welfare, or climate adaptation has higher *verified* EV. X-risk work is often speculative, hard to measure, and prone to hype cycles. |
  | **5. Population Ethics Application**<br>How do we weigh potential people vs. existing people? | **Total Utilitarianism (Applied):** We must count potential lives in our calculus. Failing to ensure the future exists is equivalent to killing those potential people. | **Person-Affecting / Uncertainty Constraint:** Even if Totalism is true theoretically, under deep uncertainty, we should prioritize existing sentient beings whose interests are knowable. Potential people have no claims until they exist. |
  | **6. Institutional Risk**<br>Does focusing on the long-term create dangerous political dynamics? | **Manageable:** We can advocate for long-term safety without becoming authoritarian. The risk of misalignment is greater than the risk of political backlash. | **High Risk:** "Sacrificing the present for the future" is a dangerous meme that can justify authoritarianism, eugenics, or ignoring current rights. It creates bad incentives for the EA movement's reputation. |

  ---

  ## III. CRUXES
  *These are the sub-questions where resolution would meaningfully shift confidence. Both sides agree on what evidence would be relevant.*

  ### Crux 1: The "Sign" of the Effect
  *   **Question:** For a proposed longtermist intervention (e.g., AI alignment research), can we establish with >90% confidence that the *sign* of the impact is positive (i.e., it reduces x-risk rather than increasing it)?
  *   **Relevant Evidence:** Historical analysis of technological interventions. Retrospective studies on whether safety research accelerated or decelerated capability overhangs.
  *   **SL Prediction:** Yes, for a core set of interventions (e.g., technical alignment), the sign is robustly positive.
  *   **SN Prediction:** No, complex systems often react perversely. Safety research often accelerates deployment by making tech seem safer ("safety tax" is negative).

  ### Crux 2: The Discount Rate for Moral Uncertainty
  *   **Question:** Should we apply a "epistemic discount rate" to Expected Value calculations based on the complexity of the causal chain? (e.g., If chain length > 5 links, discount EV by 50% per link).
  *   **Relevant Evidence:** Decision theory literature on "cluelessness." Comparison of forecast accuracy in macroeconomics vs. engineering.
  *   **SL Prediction:** No. A hard discount rate arbitrarily discards high-stakes information. We should use wide confidence intervals, not discount the mean.
  *   **SN Prediction:** Yes. Without a heuristic discount on complexity, models become vulnerable to fanaticism. Accuracy decays exponentially with time-steps.

  ### Crux 3: Substitutability of Labor
  *   **Question:** If a Longtermist donor stops funding X-risk, will that funding be replaced by non-EA actors (governments, corporations) anyway?
  *   **Relevant Evidence:** Analysis of government spending trends in AI safety/biosecurity. Elasticity of supply in the x-risk labor market.
  *   **SL Prediction:** No. EA funding is marginal and catalytic. Without it, critical work remains undone.
  *   **SN Prediction:** Partially. Governments are increasingly motivated by national security. EA money often displaces public funding rather than adding to it (crowding in/out effects).

  ### Crux 4: The "Moral Circle" Trajectory
  *   **Question:** Is the expansion of the moral circle (including animals, future people, AI) an inevitable historical trend or a fragile contingency?
  *   **Relevant Evidence:** Historical sociology of moral progress. Analysis of regimes where moral circle contracted.
  *   **SL Prediction:** Fragile contingency. It requires active philosophical and technical work to lock in.
  *   **SN Prediction:** Robust trend. As societies become wealthier and more educated, empathy expands naturally. Focus on wealth/education now is the best way to expand the circle later.

  ---

  ## IV. VERBAL AND SEMANTIC DISPUTES
  *Parts of the debate appear larger than they are due to differing definitions.*

  1.  **"Longtermism" (Moral View vs. Priority View):**
      *   *Dispute:* SN often attacks Longtermism as claiming *only* the future matters. SL often defines it as a claim about where the *marginal* dollar should go.
      *   *Resolution:* SL clarifies they do not advocate ignoring present suffering, but rather that the *marginal* impact of x-risk reduction outweighs the *marginal* impact of direct aid. SN clarifies they do not deny the future's value, but deny the *calculability* of that marginal impact.
      *   *Status:* **Mostly Verbal.** Once "priority" is defined as "marginal resource allocation," the moral disagreement shrinks significantly.

  2.  **"Expected Value" (Mathematical vs. Heuristic):**
      *   *Dispute:* SL uses EV as a formal mathematical expectation (Probability × Impact). SN uses EV as a practical heuristic for decision-making under uncertainty.
      *   *Resolution:* SL admits that when P is < 1%, the "Expected Value" is largely a reflection of prior assumptions, not data. SN admits that ignoring low-probability high-stakes events entirely is also a bias.
      *   *Status:* **Substantive but Nuanced.** The fight is over *when* EV reasoning breaks down, not whether it is useful in principle.

  3.  **"Existential Risk" (Extinction vs. Trajectory Change):**
      *   *Dispute:* SL often conflates "preventing extinction" with "ensuring a good future." SN points out that surviving doesn't guarantee a good future (e.g., global totalitarianism).
      *   *Resolution:* SL distinguishes between *Existential Risk* (extinction/lock-in) and *Trajectory Change* (shaping the quality of the future).
      *   *Status:* **Settled among experts, contested in public.** Both sides agree survival is necessary but not sufficient. The disagreement is on whether survival work *also* improves quality.

  ---

  ## V. SETTLED VS. CONTESTED LANDSCAPE
  *To prevent re-litigating settled issues, we mark the following:*

  **Settled (Consensus among both SL and SN):**
  *   **Climate Change is Real and Bad:** Both sides support mitigation, though they differ on whether it is an x-risk or a severe global catastrophic risk.
  *   **Global Health is Good:** SL does not oppose bednets; they argue the *opportunity cost* of the funding is higher elsewhere.
  *   **AI is Transformative:** Both sides agree AI will be a major driver of the future. The disagreement is on the timeline and the nature of the risk.
  *   **Animal Suffering is Morally Relevant:** Both sides generally accept the inclusion of non-human animals in the moral circle.

  **Contested (Genuine Open Questions):**
  *   **The "Astronomical Waste" Argument:** Whether the potential number of future lives actually dictates current priority.
  *   **Forecasting Reliability:** Whether expert elicitation on x-risk probabilities is meaningful or noise.
  *   **Institutional Legitimacy:** Whether EA should publicly advocate for longtermist priorities given the political risks.
  *   **Moral Uncertainty:** How to act when we are unsure if Total Utilitarianism is the correct ethical framework.

  ---

  **Signatories:**

  _________________________ (Strong Longtermist)

  _________________________ (Neartermist Priority)

  **Date:** _________________________
