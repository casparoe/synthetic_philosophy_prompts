prompt: |-
  I am giving a talk next month to a joint seminar in cognitive science and visual communication, in which I will defend a thesis drawn from the Letter Spirit project: that what makes every 'a' an 'a' is not a context-free set of geometric features but the role a mark occupies within a whole alphabet under a coherent style, so that style is constitutive of letter identity rather than an optional decoration. My argument, in compressed form, runs as follows. Feature-list accounts fail because two instances of the same letter in different fonts may have less in common, geometrically, than two different letters within a single font, yet readers group them by letter without effort; the grid-based letterforms produced by the Letter Spirit simulations handle this only by representing letters as roles to be filled and style as constraints on how those roles may be filled, extrapolating a coherent family of letterforms from a few seed letters; so a letter's identity is best modeled as a fluid concept, in Hofstadter's sense, rather than as a definition.

  The audience is not uniformly sympathetic. It includes a type designer who holds that letter identity is grounded in the history of writing and printing and in optical proportion, and who will be skeptical of any account that treats a grid simulation as evidence about real letterforms; a philosopher of language who defends a classical account of concepts as necessary and sufficient conditions and will charge that an appeal to an alphabet-wide 'role' is circular; and a machine-learning researcher who believes that a convolutional network trained on labeled letterforms already captures 'a-ness' without needing any explicit representation of an alphabet or a style. Draft my Q&A preparation sheet: the eight or so objections I will actually get from this audience, ordered by how probable and how damaging each one is, noting which of the three is likely to raise it, phrased as that person would phrase it, each with a reply that could be delivered in about two minutes and a frank note on where that reply is most vulnerable. Identify which objections have real force and what I should concede up front, what I should hold, and the weakest point in my own argument that I should prepare to defend rather than hope they miss. Conclude with the question I am most dreading.
