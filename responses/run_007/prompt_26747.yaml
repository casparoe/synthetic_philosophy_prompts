answer: |-
  # JOINT STATEMENT ON THE VARIABILITY OF KNOWLEDGE ASCRITIONS
  **A Collaborative Document by Proponents of Contextualism and Subject-Sensitive Invariantism**

  **Preamble:**
  We, the undersigned, represent two distinct theoretical camps regarding the semantics and metaphysics of knowledge. One camp defends **Epistemic Contextualism** (the view that the semantic content of 'knows' varies with the attributor's context). The other defends **Subject-Sensitive Invariantism (SSI)**, also known as Pragmatic Encroachment (the view that the knowledge relation itself varies with the subject's practical stakes).

  We have engaged in adversarial collaboration to isolate our shared commitments from our genuine disagreements. We agree that "Plain Invariantism" (Traditional Intellectualism) fails to capture the data. We disagree on the locus of the variability. This document records our consensus, our divergences, and the specific empirical/theoretical cruxes that remain to be settled.

  ---

  ### PART I: AGREED CLAIMS
  **The Common Ground**

  1.  **The Bank Cases Track Reality:** We agree that intuitive judgments regarding "Bank Cases" (e.g., Hannah and Sarah on Friday vs. Saturday) are not mere performance errors. There is a genuine shift in the felicity and apparent truth of knowledge ascriptions when practical stakes change. Plain Invariantism, which denies this shift, is incorrect.
  2.  **The Airport Cases Track Reality:** We agree that the salience of error possibilities (e.g., the possibility of a flight schedule change) affects whether it is appropriate to claim knowledge. A theory that ignores the salience of alternatives is descriptively inadequate.
  3.  **Knowledge is Action-Guiding:** We agree that knowledge is the norm of assertion and practical reasoning. If a subject does not know *p*, they should not rely on *p* in high-stakes practical reasoning. Both our theories accommodate the link between knowledge and action better than Plain Invariantism.
  4.  **Rejection of Skepticism:** We both aim to preserve the truth of ordinary knowledge claims in ordinary contexts. We reject the skeptical conclusion that we almost never know anything, even if we disagree on *why* skeptical arguments feel compelling in the seminar room.
  5.  **Mutual Concession on Data:**
      *   **The Contextualist grants:** The Subject's stakes *do* matter epistemically. It is not merely about what the attributor is thinking; the subject's practical situation is relevant to whether they count as knowing.
      *   **The SSI Proponent grants:** Attributor context (salience of error) *does* affect the conversational dynamics of knowledge ascriptions. It is not merely about the subject's stakes; the conversational environment shapes whether we *say* someone knows.

  ---

  ### PART II: POINTS OF DIVERGENCE
  **Where the Shift Lives**

  | Feature of the Theory | **Contextualist Position** | **Subject-Sensitive Invariantist (SSI) Position** |
  | :--- | :--- | :--- |
  | **Locus of Variability** | The variability lies in the **semantics** of the word 'knows'. The proposition expressed by "S knows that p" changes depending on the **attributor's** conversational context (standards/salience). | The variability lies in the **metaphysics** of the knowledge relation. The proposition expressed is invariant, but whether the subject stands in that relation depends on the **subject's** practical stakes. |
  | **Truth Conditions** | Truth conditions shift with the **attributor's** standards. A claim "S knows" can be true when uttered by A (low standards) and false when uttered by B (high standards), even if S's situation is unchanged. | Truth conditions shift with the **subject's** stakes. A claim "S knows" is true or false simpliciter, based on S's situation. If A and B disagree, one is objectively wrong, regardless of their context. |
  | **First-Person Authority** | When I say "I know," I am implicitly setting a standard for my audience. My claim is sensitive to what *my* context makes salient. | When I say "I know," I am reporting a state that depends on *my* stakes. My claim is sensitive to how much it matters to *me* if I am wrong. |
  | **Explanation of Error** | Plain Invariantists err by ignoring semantic context-sensitivity (like 'tall' or 'flat'). | Plain Invariantists err by ignoring the pragmatic encroachment on justification/warrant. |

  ---

  ### PART III: THE CRUXES
  **Diagnostic Cases and Predictions**

  We identify three specific areas where our theories make distinguishable predictions. We agree to treat the following cases as bearing directly on the dispute.

  #### Crux 1: The First-Person Present-Tense Case
  **The Issue:** Does the truth of "I know" depend on my stakes (SSI) or the salience of error in my current conversation (Contextualism)?
  **The Test Case:** *The Solitary High-Stakes Subject.*
  Hannah is alone in a room. She has high stakes (if she is wrong about the bank hours, she loses her house). However, she is not deliberating about acting; she is merely filling out a diary. No error possibilities are currently salient to her (she is distracted). She writes, "I know the bank is open."
  *   **SSI Prediction:** The ascription is **False**. Her high stakes lower her epistemic position below the threshold for knowledge, regardless of salience or assertion.
  *   **Contextualist Prediction:** The ascription is **True** (or at least not false on semantic grounds). Since she is not in a "high standards" conversational context (no one is challenging her, error is not salient), the semantic bar is low. Her stakes alone do not shift the semantic content.

  #### Crux 2: Ascending and Descending Contexts (Retraction)
  **The Issue:** When standards rise, must we retract earlier claims?
  **The Test Case:** *The Friday-Monday Retraction.*
  On Friday (low stakes), Hannah says, "I know the bank is open." On Monday (high stakes, having realized the importance), she reflects on her Friday claim.
  *   **SSI Prediction:** Hannah should **not retract** the truth of her Friday claim (assuming her stakes were actually low on Friday). She should say, "I knew it then, but I don't know it now." The knowledge relation changed because her situation changed.
  *   **Contextualist Prediction:** Hannah faces pressure to **retract** or qualify. She must say, "What I said on Friday was true *relative to Friday's context*, but I cannot say it now." If the Contextualist treats 'knows' as context-sensitive like 'here', retraction is often infelicitous without qualification. (Note: Some Contextualists predict retraction is required to maintain conversational coherence in the high-standards context).

  #### Crux 3: Truth vs. Conversational Appropriateness
  **The Issue:** Can we separate the truth of the ascription from the appropriateness of making it?
  **The Test Case:** *The Salient Error/Low Stakes Case.*
  Hannah has low stakes. However, a skeptic is present, making far-fetched error possibilities salient (brain-in-a-vat scenarios). Hannah says, "I know I have hands."
  *   **SSI Prediction:** The ascription is **True**. Hannah's stakes are low, so she knows. However, asserting it is **inappropriate** because it ignores the salient error possibilities raised by the skeptic (violating conversational norms, not semantic truth).
  *   **Contextualist Prediction:** The ascription is **False**. The skeptic's salience has raised the semantic standard for 'knows'. The proposition expressed is no longer satisfied by Hannah's evidence. It is not just inappropriate; it is untrue in that context.

  ---

  ### PART IV: ASSESSMENT OF VERBAL DISPUTE
  **How Much of This is Merely Verbal?**

  After rigorous collaboration, we offer the following straight assessment regarding the "merely verbal" nature of our dispute:

  **1. The Extensional Overlap is High.**
  In the vast majority of ordinary cases, attributor context and subject stakes correlate. When stakes are high for the subject, attributors usually notice and raise standards. When stakes are low, standards remain low. Consequently, our theories agree on the truth-value of knowledge ascriptions in 90% of real-world scenarios. This suggests a significant portion of the *practical* disagreement is verbal; we are carving the same extensional cake with different knives.

  **2. The Semantic Machinery is Substantive.**
  However, the dispute is **not merely verbal** because the theoretical costs differ radically.
  *   If the **Contextualist** is right, logic involving 'knows' is non-standard (validity becomes context-relative), and we must accept a proliferation of propositions expressed by knowledge claims.
  *   If the **SSI Proponent** is right, traditional logic holds, but we must accept that practical interests can constitute epistemic warrant, which challenges the traditional separation of the theoretical and practical realms.

  **3. The Verdict.**
  We estimate that **40% of the dispute is verbal**, centering on whether we label the variability "semantic" or "metaphysical." However, the remaining **60% is substantive**, centering on the normative consequences for logic, the nature of evidence, and the correct handling of the "Solitary High-Stakes Subject" (Crux 1). Until we resolve Crux 1, we cannot dismiss the disagreement as purely terminological.

  **Signed,**

  __________________________
  *Representative, Epistemic Contextualism*

  __________________________
  *Representative, Subject-Sensitive Invariantism*

