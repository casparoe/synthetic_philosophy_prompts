prompt: |-
  Here's one I keep meaning to have someone actually write up. Produce the joint statement that a contextualist about 'knows' and a subject-sensitive invariantist in the pragmatic-encroachment camp could both sign after a good-faith adversarial collaboration. Both sides think the bank cases and the airport case are tracking something real, and both think plain invariantism misses it; their fight is over where the shift lives — in the semantics of 'knows', with the attributor's standards fixing what proposition gets expressed, or in the knowledge relation itself, with the subject's practical stakes partly determining whether she knows. I want a numbered agreed-claims section (the data they share, what each side grants the other, where each admits the other has a real point), then a disagreements table with each side's view stated in wording that side would sign. After that, the cruxes: I'd start with the first-person present-tense 'I know' case, the ascending/descending-context story, and the question whether the contextualist can seperate the truth of a knowledge ascription from its conversational appropriateness. For each crux, tell me what case or argument both camps would accept as bearing on it, and record each side's prediction in advance. Then be straight with me about how much of the dispute is merely verbal — my hunch is some of it is, but I want it marked precisely.
