      The most devastating objection to the immateriality reading targets the leap from conceptual independence to ontological independence. Critics argue that Ibn Sina conflates epistemological separation with metaphysical separation. Just because the Flying Man can affirm his existence without affirming his body does not prove the soul can *exist* without the body. It only proves he can *conceive* of himself without conceiving of his body. This is the classic distinction between intension and extension. For example, one can conceive of "morning star" without conceiving of "evening star," yet they are the same object (Venus). Similarly, a materialist could argue that self-awareness is a function of the brain, but in the thought experiment, the subject simply lacks information about the brain. The absence of sensory data regarding the body does not entail the absence of the body itself.
