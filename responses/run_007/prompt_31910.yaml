  **The Setup Restated**

  Ibn Sina asks us to imagine a man created all at once, fully adult and mature, yet suspended in an absolute void where he perceives nothing. His limbs are separated so they do not touch one another, and his eyes are covered so he sees no light. He feels no air resistance, hears no sound, and tastes nothing. In this state of total sensory deprivation, Ibn Sina claims this person would not hesitate to affirm his own existence. He would not yet affirm the existence of his hands, his brain, or any external body, but he would incontrovertibly know that *he* is. This scenario isolates the self from all bodily sensations and external perceptions. The purpose is to test what remains of the self when stripped of empirical data. Ibn Sina uses this to probe the nature of the soul (*nafs*), suggesting that self-awareness is primitive and not derived from bodily experience. The thought experiment serves as the foundation for his metaphysics of the soul.

  **The Main Readings**

  Interpretations of the Flying Man vary significantly in metaphysical ambition. The weakest reading is purely epistemological. It suggests Ibn Sina merely demonstrates that self-awareness is primitive, immediate, and non-inferential. On this view, the thought experiment shows that knowledge of the self does not depend on sensory perception or syllogistic reasoning. It establishes a first-person certainty that survives radical sensory deprivation, but it does not necessarily dictate what the self *is*, only how it is known. This reading limits the argument to phenomenology: the *experience* of selfhood is independent of the body, not necessarily the *entity* itself. It secures the primacy of self-knowledge without committing to dualism. It is a claim about access, not essence.

  A stronger reading moves from epistemology to ontology, arguing for the substantiality of the soul. Here, the focus shifts to what is being affirmed. If I know I exist without knowing I have a body, then my existence is not identical to my body's existence. This suggests the soul is a substance in its own right, not merely a faculty or form of the body. It implies the self has a reality beyond physical attributes, functioning as the true subject of experience rather than a byproduct of biology. This reading asserts that the self is a "something" ( *shay'* ) independently of bodily configuration.

  The strongest reading posits full immateriality and real distinctness. Proponents argue that if the self can be conceived without the body, it must be ontologically distinct from it. This interpretation claims the thought experiment proves substance dualism: the soul is an immaterial substance capable of existing independently of matter. This reading treats the intuitive affirmation of existence as proof of metaphysical separability, licensing the conclusion that the soul survives bodily death. It transforms a psychological intuition into a metaphysical proof, asserting that the essence of the soul excludes matter entirely. This view aligns the Flying Man with Cartesian dualism, suggesting Ibn Sina provides an a priori argument for the soul's independence. It claims the thought experiment settles the mind-body problem by showing the mind's conceptual independence entails ontological independence. Consequently, this reading implies that the body is merely an instrument used by the soul, rather than a constituent of the person. It suggests that personal identity remains intact even if the physical vessel is destroyed.

  **The Strongest Objection**

  The most devastating objection to the immateriality reading targets the leap from conceptual independence to ontological independence. Critics argue that Ibn Sina conflates epistemological separation with metaphysical separation. Just because the Flying Man can affirm his existence without affirming his body does not prove the soul can *exist* without the body in any meaningful sense. It only proves he can *conceive* of himself without conceiving of his body. This is the classic distinction between intension and extension. For example, one can conceive of "morning star" without conceiving of "evening star," yet they are the same object (Venus). Similarly, a materialist could argue that self-awareness is a function of the brain, but in the thought experiment, the subject simply lacks information about the brain. The absence of sensory data regarding the body does not entail the absence of the body itself.

  Furthermore, the thought experiment relies on intuition, which is historically contingent. A modern neuroscientist might argue that without sensory input, the sense of self would dissolve rather than affirm itself. But even granting Ibn Sina's intuition, the logic holds only that the *concept* of the self does not include the *concept* of the body. It does not demonstrate that the *referent* of the self is distinct from the *referent* of the body. To prove immateriality, one needs more than ignorance of the body; one needs positive proof that the self lacks material properties. The Flying Man shows ignorance of the body, not independence from it. The body is merely veiled from perception, not eliminated from existence. Therefore, the argument begs the question by assuming that what is not perceived does not constitute the essence of the perceiver. It mistakes a limitation of awareness for a feature of reality.

  **Your Verdict**

  The Flying Man does not establish full immateriality; it establishes only the primitivity of self-awareness and the substantiality of the soul. The argument secures the self as a distinct locus of experience, but it fails to prove the soul is immaterial without supplementary premises. Ibn Sina himself characterizes the Flying Man as a reminder (*tanbih*), not a standalone logical demonstration (*burhan*). He relies on other arguments regarding the unity of consciousness and the nature of intellection to prove immateriality. The thought experiment alone only shows that the essence of the self is not *perceived* as bodily.

  Defending this claim requires acknowledging the objection's force. The gap between "I don't feel my body" and "I am not my body" is unbridgeable by intuition alone. However, this does not render the experiment useless. It successfully establishes that the self is not *known through* the body. This is a crucial epistemological point: self-knowledge is immediate. It also suggests substantiality because the affirming subject persists when all accidents are stripped away. But immateriality requires proving the soul cannot be a material form, which requires analyzing the nature of universals and intellection, not just sensory deprivation.

  Therefore, the seminar's confusion is justified if they sought dualism here. The Flying Man establishes that the self is a substance known immediately to itself, distinct from bodily sensations. It does not prove the soul can exist apart from matter. To claim otherwise is to overread the text. The experiment isolates the phenomenology of the self, not the metaphysics of substance. We should accept the weaker reading: it proves the self is not *identified* with the body in consciousness, leaving the ontological question for further argumentation. This preserves Ibn Sina's insight without committing his metaphysics to a logical fallacy. It clarifies that self-awareness is foundational, but ontology requires more rigorous proof than introspection can provide. Thus, it paves the way for dualism without constituting the proof. Accepting this limitation strengthens rather than weakens Ibn Sina's overall system. This distinction resolves the seminar's deadlock by respecting the text's limits.
