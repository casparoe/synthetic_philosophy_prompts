      *   *Unpleasantness/Badness:* Reward signal ($R_t$) or Value Function ($V(s)$). The negative scalar feedback that drives policy updates.
      *   *Normal Brain:* $O_t$ (damage detected) $\rightarrow$ Hardwired/Learned mapping $\rightarrow$ $R_t$ (large negative reward). Policy $\pi$ learns to minimize exposure to $O_t$ that triggers $R_t$.
      *   *Asymbolic Brain:* $O_t$ (damage detected) $\rightarrow$ Broken mapping $\rightarrow$ $R_t \approx 0$ (or disconnected).
      *   *Behavior:* Normal agent takes avoidance actions ($a_{avoid}$). Asymbolic agent takes null actions or unrelated actions ($a_{null}$), despite $O_t$ indicating damage.
      *   *Wireheading Analogy:* If an agent could trigger the "pain" observation without the negative reward, would it? In asymbolia, the "pain" observation *is* triggered, but the negative reward is absent. It's like having the sensor read "HIGH HEAT" but the reward function doesn't penalize it.
