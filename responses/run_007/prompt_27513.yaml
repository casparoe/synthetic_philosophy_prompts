      *   *The "Hurt":* In RL, "hurt" is just a negative reward signal. In philosophy, "hurt" is the *feeling* of the negative reward.
      *   *The Gap:* The RL framework describes the *structure* of the valuation, but not the *substrate* of the experience. The "glow" of the reward signal is invisible to the math.

  5.  **Evaluate the Residue (Task 3):**
