      *   *Implication:* The "badness" of pain is not intrinsic to the sensory data; it's an evaluative layer added on top.
      *   *Philosophical Conclusion:* Hedonic tone is separable from qualia.

  3.  **Translate to RL/AI Alignment Vocabulary (Task 1):**
