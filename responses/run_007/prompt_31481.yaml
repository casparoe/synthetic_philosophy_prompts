      *   *Claim 3 (Truth = Peer Acceptance/Social Justification):* This is the tricky one. Rorty *does* say truth is what peers let you get away with (often quoting William James or using that phrase). *However*, he distinguishes between *justification* (social) and *truth* (a compliment we pay to justified beliefs). He is often accused of relativism here, but he denies being a relativist. He says truth is *not* objective in a metaphysical sense, but he doesn't think truth *changes* when acceptance changes. He thinks we *attribute* truth to what is justified. The summary says "if it stops being accepted, it stops being true." Rorty would likely say "we stop *calling* it true." This is a subtle but crucial distinction regarding the *use* of the word "truth."
