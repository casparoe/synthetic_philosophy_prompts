      *   Meta-reflection? Yes.

      *(Self-Correction during drafting)*: Make sure the distinction between "Fixed" and "Inadmissible" is clear.
      *   Fixed (Hidden): Chance is 0 or 1, but *evidence* is admissible (only knows the setup). PP applies.
      *   Oracle: Evidence is inadmissible (bypasses the chance process). PP does not apply directly.
      *   Actually, Lewis says PP applies *conditional on admissible evidence*. If Oracle info is inadmissible, PP doesn't tell you what to do directly. You must use Bayes.
