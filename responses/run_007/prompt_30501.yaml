answer: |-
  # Seminar Activity: "The Oracle and the Urn"
  **Topic:** The Principal Principle and Admissible Evidence
  **Level:** Upper-level Undergraduate Philosophy
  **Class Size:** 18 Students
  **Time:** 75 Minutes

  ## 1. Learning Objectives
  By the end of this session, students will:
  1.  Experience the intuitive pull of the Principal Principle (PP) when only objective chance is known.
  2.  Distinguish between *epistemically fixed* events (admissible ignorance) and *inadmissible* information (outcome knowledge).
  3.  Observe how rational credence departs from objective chance when "inadmissible" evidence is introduced.
  4.  Map their betting behavior onto Lewis's formula: $C(A \mid XE) = X$ (where $E$ is admissible).

  ## 2. Materials
  *   **The Urn:** A transparent container with 10 opaque ping-pong balls (7 Red, 3 Blue).
  *   **The Safe:** A lockable box or opaque envelope sealed with a signature across the flap.
  *   **Betting Sheets:** 18 sheets per round (4 rounds total).
  *   **Projector:** To display the Scoring Rule and aggregate results.
  *   **Incentives:** Participation points (e.g., 20 points total for the game, scaled to course grade).
  *   **Calculator:** Spreadsheet pre-loaded with Brier Score formulas.

  ## 3. The Scoring Rule (Crucial Setup)
  *Time: 0:00–0:10*

  To measure *credence* rather than binary choice, you must use a **Proper Scoring Rule**. Do not use binary bets (which encourage thresholding). Use the **Brier Score**.

  **Script for Instructor:**
  > "We are measuring your *credence*, not just your guess. On your sheet, write a percentage (0 to 100) representing how confident you are the ball will be **Red**.
  >
  > Here is how you earn points. This is mathematically designed so your best strategy is to write your *true* belief.
  > *   **If Red wins:** Your Score = $100 - (100 - \text{Your}\%)^2 / 100$
  > *   **If Blue wins:** Your Score = $100 - (\text{Your}\%)^2 / 100$
  >
  > **Example:** If you write **70%**:
  > *   Red wins: $100 - (30)^2/100 = 100 - 9 = 91$ points.
  > *   Blue wins: $100 - (70)^2/100 = 100 - 49 = 51$ points.
  >
  > If you lie and say **100%**:
  > *   Red wins: 100 points.
  > *   Blue wins: 0 points.
  >
  > Because Blue is possible, saying 100% is risky. Saying your true probability maximizes your average points over time."

  *(Hand out a cheat sheet with this calculation for common percentages.)*

  ---

  ## 4. The Game Rounds
  *Time: 0:10–0:50 (10 mins per round)*

  ### Round 1: The Baseline (Pure Chance)
  *   **Setup:** Display the Urn (7 Red, 3 Blue). Shake it visibly.
  *   **Protocol:** "I will draw one ball at the *end* of class. It is not drawn yet."
  *   **Task:** Students submit credence for Red.
  *   **Expected Behavior:** Credences cluster around **0.7**.
  *   **Philosophical State:** $C(Red \mid Chance(Red)=0.7) = 0.7$.

  ### Round 2: The Fixed Future (Admissible Ignorance)
  *   **Setup:** Draw a ball *now*. Place it in the **Safe/Sealed Envelope**. Sign the seal. Put it in a drawer.
  *   **Protocol:** "The outcome is physically determined. It is either Red or Blue. But *no one knows which*. I will open it at the end of class."
  *   **Task:** Students submit credence for Red.
  *   **Expected Behavior:** Credences should remain around **0.7**.
  *   **Philosophical State:** The outcome is fixed (Chance is 0 or 1), but evidence is *admissible* (we only know the setup). PP still guides us to 0.7.
  *   **Note:** If students shift to 0.5 (Principle of Indifference) or 0/1 (Determinism), note this for debrief.

  ### Round 3: The Fallible Predictor (Bayesian Update)
  *   **Setup:** Introduce a **"Sensor Urn"** (Second container).
      *   *Rule:* If the Main Ball is **Red**, Sensor Urn contains (8 Red, 2 Blue).
      *   *Rule:* If the Main Ball is **Blue**, Sensor Urn contains (2 Red, 8 Blue).
  *   **Protocol:** A student volunteer draws from the Sensor Urn. Suppose they draw **Red**.
  *   **Task:** Students submit credence for Main Ball being Red.
  *   **Expected Behavior:** Credences should rise above 0.7 (approx **0.9** via Bayes).
      *   *Calc:* $P(R|S_R) = \frac{P(S_R|R)P(R)}{P(S_R|R)P(R) + P(S_R|B)P(B)} = \frac{0.8 \cdot 0.7}{0.8 \cdot 0.7 + 0.2 \cdot 0.3} = \frac{0.56}{0.62} \approx 0.90$.
  *   **Philosophical State:** Evidence $E$ is admissible. We update the chance via conditionalization. $C(Red \mid XE) \neq X$, but only because $E$ updates the probability of $X$ obtaining.

  ### Round 4: The Oracle (Inadmissible Evidence)
  *   **Setup:** The "Time Capsule."
  *   **Protocol:** "At 8:00 AM this morning, I drew the ball. I put it in this envelope. I have looked at it. I am now writing the color on the board." (Instructor writes **RED**).
  *   **Constraint:** Instructor must have a reputation for honesty. To ensure trust, have a TA verify the envelope contents match the board *after* betting but *before* the final reveal.
  *   **Task:** Students submit credence for Main Ball being Red.
  *   **Expected Behavior:** Credences jump to **1.0** (or very close).
  *   **Philosophical State:** Evidence $E$ is **inadmissible**. We have knowledge of the outcome that bypasses the chance setup. The PP ($C = X$) is suspended. We defer to the Oracle, not the 0.7 chance.

  ---

  ## 5. Debrief & Theory Mapping
  *Time: 0:50–1:15 (25 mins)*

  **Step 1: Aggregate Data (5 mins)**
  Project the average credence for each round.
  *   *Round 1:* ~0.70
  *   *Round 2:* ~0.70 (Hopefully)
  *   *Round 3:* ~0.90
  *   *Round 4:* ~1.00

  **Step 2: Map to Lewis (15 mins)**
  Draw Lewis's formula on the board: **$C(A \mid XE) = X$**.
  *   **$A$:** The ball is Red.
  *   **$X$:** The objective chance of Red is 0.7.
  *   **$E$:** Your extra evidence.

  | Round | Situation | Value of E | Admissible? | Rational Credence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Pure Chance | Tautology | Yes | **0.7** (Defer to X) |
  | **2** | Fixed/Hidden | "Outcome is sealed" | Yes | **0.7** (Defer to X) |
  | **3** | Sensor | "Sensor said Red" | Yes | **0.9** (Update X via Bayes) |
  | **4** | Oracle | "Instructor saw Red" | **No** | **1.0** (Ignore X, follow E) |

  **Discussion Questions:**
  1.  **Round 2:** "The ball was already Red or Blue. Why didn't you bet 0 or 1?" (Leads to distinction between *metaphysical* fixity and *epistemic* access).
  2.  **Round 4:** "Why did you ignore the 0.7 chance?" (Because the Oracle's word is *inadmissible* evidence relative to the chance hypothesis. It tells you the *outcome*, not the *propensity*).
  3.  **The Limit:** "What if I told you the 0.7 chance was a lie? That's 'Undermining.' We didn't simulate that. Why is that harder?" (Because it attacks $X$ itself, not just $E$).

  **Step 3: Scoring & Wrap (5 mins)**
  Calculate winners based on Brier scores. Award points.

  ---

  ## 6. Predicted Failures & Fixes

  | Failure Mode | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Risk Aversion** | Students hedge (e.g., write 0.5) to avoid low scores, distorting data. | Emphasize that *Expected Value* is maximized by honesty. Run a practice round with candy to prove it. |
  | **Distrust of Oracle** | Students think the Instructor is bluffing in Round 4. | Use the "TA Verification" method. The TA holds the envelope key. The TA confirms the match *after* bets are in. |
  | **Round 2 Confusion** | Students treat "Fixed" as "50/50" (Indifference) or "0/1" (Determinism). | Explicitly script: "Metaphysically fixed, epistemically random." If they drift, use this as a teaching moment about *epistemic* probability. |
  | **Math Anxiety** | Brier Score formula scares them. | Provide a **Lookup Table** on the betting sheet (e.g., "If you believe 70%, write 70. If Red, you get 91 pts"). |

  ---

  ## 7. Limitations of the Activity
  **What this activity cannot reproduce:**
  1.  **Undermining Futures:** Lewis's major worry for PP is that future information could reveal the chance itself was different (e.g., a world where the coin is biased, but we don't know yet). This game assumes the Chance ($X$) is fixed and known. You must lecture this limitation.
  2.  **True Objective Chance:** We are using a deterministic urn (classical probability). Some students may argue "There is no real chance, only ignorance." Acknowledge this, but stipulate that for the seminar, we treat the setup as a proxy for objective propensity.
  3.  **Causal Influence:** We cannot simulate a scenario where the student's *bet* influences the outcome (Newcomb-style), which is another form of inadmissibility.

  ---

  ## 8. Meta-Reflection: What Would Change My Mind?

  **Condition for Redesign:**
  If, in **Round 2 (Fixed/Hidden)**, the class average credence drops significantly below 0.6 or spikes above 0.8.
  *   **Reasoning:** This indicates the students do not share the "Epistemic Randomness" intuition required for the Principal Principle. If they treat the fixed envelope as 50/50, they are applying the Principle of Indifference instead of deferring to the known chance. If they treat it as 0/1, they are conflating ontology with epistemology.
  *   **Implication:** The game fails to isolate *admissibility* because the baseline understanding of "chance vs. ignorance" is unstable. I would need to spend the first 20 minutes on the metaphysics of probability before running the game, or switch to a purely hypothetical thought-experiment discussion.

  **Weakest Link in Reasoning:**
  The **Oracle Round (4)** relies entirely on **Instructor Authority**.
  *   **Risk:** If students suspect the Instructor is manipulating the game to make a philosophical point (e.g., writing "Red" because they know students bet Red), the "Inadmissible Evidence" becomes "Testimony," which is just another form of admissible evidence (updating on reliability).
  *   **Mitigation:** The "Time Capsule" (drawn at 8 AM) is essential. It removes the Instructor's agency *at the moment of the bet*. If I draw it live in class, students might think I can "will" the result. The 8 AM draw makes the outcome independent of the classroom context, making the revelation truly "inadmissible" news about the world.

  **Final Check:**
  Does this meet the 75-minute constraint?
  *   Intro/Scoring: 10m
  *   4 Rounds (betting + setup): 40m (10m each)
  *   Debrief: 25m
  *   **Total:** 75m.
  *   **Risk:** It is tight. If betting takes too long, cut Round 3 (Fallible Predictor). Round 1, 2, and 4 are the core triad (Chance, Fixed, Oracle). Round 3 is nice for Bayes but expendable if time runs short.

  **Instructor Note:** Bring a physical timer. Keep the betting windows to 3 minutes max per round. Use the remaining time for setup and discussion.
