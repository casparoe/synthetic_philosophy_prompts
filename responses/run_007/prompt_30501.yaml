      *   *Debrief:* Connect Round 1/2 to $X$. Connect Round 3 to $E$ (admissible). Connect Round 4 to $E$ (inadmissible).

  12. **Final Polish:** Check against constraints. 18 students, 75 mins. Upper-level. Needs to be tight.
      *   *Constraint Check:* 18 students is small enough for individual betting sheets.
