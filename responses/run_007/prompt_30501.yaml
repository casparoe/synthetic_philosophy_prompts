      If Sensor is infallible, $Chance(Red)$ *given Sensor=Red* is 1.
      So PP still holds, but the "Chance" variable updates.
      *The philosophical point:* The Principal Principle says defer to *objective chance*. If you have info that *bypasses* the chance setup (like seeing the future), that info is inadmissible.
