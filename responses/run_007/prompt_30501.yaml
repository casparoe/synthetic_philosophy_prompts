prompt: |-
  I teach an upper-level undergraduate philosophy of probability seminar — roughly 18 students, one 75-minute session — and the students are comfortable with Bayesian updating and conditional probabilities. Design an in-class game that makes them feel the force of the Principal Principle, the thesis that a rational credence should defer to a known objective chance, and that makes them discover, before it is named, where that deference should stop. I want the game built around a genuinely chancy device with an announced chance (say 0.7) and small-stakes bets using points rather than money, with successive conditions in which participants receive further information: information about the device's calibration, information about the already-determined outcome, and a messier middle case such as a fallible but reliable predictor of the outcome. The rules and incentives should be arranged so that their betting behavior visibly tracks the chance in some conditions and departs from it in others, so that the admissibility problem surfaces in what they do rather than in a lecture afterwards. Give me exact rules, materials, a timeline, and a debrief that maps what happened in each condition onto the distinction between admissible and inadmissible evidence; say what will predictably go wrong the first time I run it and how to fix it; and be explicit about which feature of the Principle the activity cannot reproduce — for instance, undermining information about the chances themselves — and would have to be supplied by hand. Finally, tell me what would change your mind about this design: which fact about how students actually behave, or which objection to the setup, would lead you to redesign it, and where your reasoning about the activity is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class game:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergrad philosophy students (comfortable with Bayes/conditional prob).
      *   **Class Size/Time:** ~18 students, 75 minutes.
      *   **Goal:** Teach the *Principal Principle* (PP) via an experiential game. Specifically, make them *feel* the pull of deferring to objective chance and *discover* the limits of that deference (admissibility).
      *   **Core Mechanics:** Genuinely chancy device, announced chance (e.g., 0.7), small-stakes bets (points), successive conditions (calibration, determined outcome, fallible predictor).
      *   **Output Requirements:** Exact rules, materials, timeline, debrief (mapping to admissibility), predicted failures/fixes, limitations of the activity, and conditions for redesigning (meta-reflection).

  2.  **Deconstruct the Principal Principle (PP):**
      *   *Lewis's Formulation:* $C(A | XE) = X$, where $C$ is credence, $A$ is the proposition, $X$ is the proposition that the chance of $A$ is $x$, and $E$ is *admissible* evidence.
      *   *The Intuition:* If you know the objective chance is 70%, your credence should be 70%.
      *   *The Catch:* Unless you have "inadmissible" evidence (e.g., knowledge of the future, crystal balls, causal influence).
      *   *The Challenge:* How to simulate "objective chance" in a classroom without actual metaphysical randomness (which is hard to prove) and how to simulate "inadmissible evidence" (usually time-travel or omniscience).

  3.  **Game Design - Phase 1: The Device:**
      *   Need something visibly random but controllable by the instructor.
      *   *Idea:* A bag of colored chips? A digital random number generator (RNG)? A die?
      *   *Selection:* A transparent bag with colored balls is classic, but a digital RNG projected on screen is faster and allows for "rigging" (for the sake of the lesson) without students noticing immediately. However, physical objects feel more "chancy." Let's go with a **transparent urn with 10 balls (7 Red, 3 Blue)**. It's tangible.
      *   *Stakes:* Course participation points (e.g., 10 points total for the game).

  4.  **Game Design - Phase 2: The Rounds (Conditions):**
      *   *Round 1 (Baseline):* Just the chance. Urn is 70/30. Bet on Red.
          *   *Expected Behavior:* Credence = 0.7. Bet accordingly.
      *   *Round 2 (Inadmissible - The "Peek"):* The outcome is determined *before* the bet, and a trusted agent (TA or instructor) looks.
          *   *Problem:* If the instructor looks, students might think the instructor is lying.
          *   *Better:* Use a "Black Box" protocol. The ball is drawn and put in an opaque box.
          *   *Condition 2a (Determined):* The ball is drawn. Students bet. (Should still be 0.7 *unless* they think the draw changes the chance, which it doesn't, but the *outcome* is fixed). Wait, PP says if the chance is 0.7, credence is 0.7. If the outcome is fixed but unknown, chance is arguably 0 or 1, but *epistemically* it's still 0.7. This is tricky.
          *   *Refinement:* To show the *limit* of PP, we need *inadmissible* evidence.
          *   *Condition 2 (The Oracle):* A "predictor" who is 100% accurate (or claims to be). If the predictor says "Red", credence should go to 1.0, overriding the 0.7 chance.
          *   *Condition 3 (The Fallible Predictor):* Predictor is 90% accurate. This forces Bayesian updating *on top of* the chance.
          *   *Condition 4 (Causal Influence/Time Travel equivalent):* This is hard to simulate. Let's stick to the "Future Knowledge" proxy. The instructor reveals the ball *before* the bet in one round (secretly). No, that's just lying.
          *   *Best Approach for "Inadmissible":* Use the "Already Drawn" scenario vs. "To Be Drawn".
          *   *Actually, the clearest violation of PP is "Crystal Ball" info.* Let's use a "Prophet" role.
          *   *Revised Plan:*
              1.  **Standard:** Urn is 7/3. Bet on Red.
              2.  **Historical/Calibration:** Show past 100 draws were 70/30. (Reinforces chance).
              3.  **The "Peek" (Inadmissible):** The ball is drawn, placed in an opaque envelope. The Instructor *looks* at it. Instructor offers a hint. (If I say "It's Red", you should bet 1.0, not 0.7).
              4.  **The "Prophecy" (Fallible):** A student volunteer draws a "prediction card" from a separate deck that correlates with the outcome.

      *   *Wait, let's simplify for 75 mins.*
      *   **Round 1: Pure Chance.** Urn 7R/3B. Bet on Red.
      *   **Round 2: The "Fixed" Outcome (The Admissibility Test).** Ball is drawn, sealed in envelope. *No one knows.* Bet on Red. (Should behave same as Round 1).
      *   **Round 3: Inadmissible Info (The "Cheat").** Ball is drawn, sealed. Instructor *looks*. Instructor writes prediction on board *before* students bet. (If Instructor is trusted, Credence $\to$ 1).
      *   **Round 4: Fallible Info.** A "Sensor" device (another urn?) gives a signal.

      *   *Critique:* Round 3 relies on trust. If students think the instructor is bluffing, they won't update to 1.
      *   *Alternative:* Use a "Time Capsule" method. The outcome is determined at the *start* of class, sealed.
      *   *Let's try a different angle:* The "Principal Principle" is about *deference*.
      *   **Round 1:** Chance = 0.7. Bet.
      *   **Round 2:** Chance = 0.7. But you are told "The coin is biased towards Red *today* specifically" (Undermining?). No, that changes the chance.
      *   **Round 3:** Chance = 0.7. But you are told "This specific ball is Red" (Inadmissible).
      *   **Round 4:** Chance = 0.7. But you are told "A reliable oracle says Red" (Inadmissible).

      *   *Decision:* Let's use the **"Oracle"** mechanic. It's the standard philosophical example for inadmissibility.
      *   **Setup:** One specific draw is the "Target Draw".
      *   **Round 1 (Baseline):** Target Draw will happen at end. Chance 0.7. Place bets.
      *   **Round 2 (Calibration):** Show history of the urn. (Reinforces 0.7).
      *   **Round 3 (The Oracle):** A "reliable predictor" (a pre-recorded video or sealed note opened by a student) gives a verdict.
      *   **Round 4 (The Determined State):** The ball is drawn *now*, put in envelope. Bets placed. (Tests if they treat fixed-but-unknown as chancy).

  5.  **Refining the Incentives:**
      *   Points system needs to encourage honest credence reporting.
      *   *Brier Score* is too complex for a quick game.
      *   *Binary Bet:* Bet on Red or Blue. Win 10 pts if right, 0 if wrong.
      *   *Problem:* Binary bets encourage thresholding (if $P > 0.5$, bet all on Red). This hides the *degree* of credence.
      *   *Solution:* **Probability Betting.** Students submit a number $p \in [0, 1]$ representing their credence that the ball is Red.
      *   *Scoring Rule:* **Brier Score** is best for accuracy, but **Linear Scoring Rule** is easier to explain.
      *   *Linear Rule:* Payoff = $1 - |Outcome - p|$. If Red (1) and $p=0.7$, payoff = $1 - |1 - 0.7| = 0.7$. If Blue (0) and $p=0.7$, payoff = $1 - |0 - 0.7| = 0.3$.
      *   *Wait, Linear Rule invites extreme reporting if you want to maximize expected value?* No, Linear Rule is *not* proper. It encourages reporting 1 or 0.
      *   *Quadratic (Brier) Score:* Payoff = $1 - (Outcome - p)^2$. This is proper. It incentivizes reporting true credence.
      *   *Simpler Proper Rule:* **Logarithmic Scoring Rule.** Too math-heavy.
      *   *Compromise:* Use a **Token Betting Market**. Give them 10 tokens. They can distribute tokens on Red and Blue. Payout is proportional.
      *   *Actually, keep it simple:* Ask them to write down a percentage. Use a Brier Score calculator (spreadsheet) to grade them later. Tell them: "Your score is maximized if you write your true probability." (Trust them, or explain the math briefly).
      *   *Better:* **The "Stake" Method.** "You have 10 points. You must allocate them between Red and Blue. If Red comes up, you get the points on Red. If Blue, you get points on Blue."
      *   *Expected Value:* $E = p \cdot R + (1-p) \cdot B$. To maximize E, if you believe $Prob(Red) > 0.5$, you put all on Red. This collapses credence to binary action.
      *   *Fix:* **The "Fee" Method.** You pay a fee to buy a ticket. No, that's complex.
      *   *Best for Philosophy Class:* **The Brier Score Explanation.** Spend 5 mins explaining that honesty is the best policy with this scoring rule. Provide a handout.
      *   *Alternative:* Just ask for binary bets but discuss the *threshold*. No, the prompt asks for *credence*.
      *   *Decision:* Use a **Proper Scoring Rule (Brier)**. Explain it simply: "You get points based on how close your number is to the truth (0 or 1). Guessing 0.7 when you believe 0.7 gives more points on average than guessing 1.0."

  6.  **Developing the "Admissibility" Twist:**
      *   We need a condition where they *should not* follow the 0.7 chance.
      *   **Condition A (Standard):** Urn 7/3. Draw happens at end.
      *   **Condition B (Fixed but Unknown):** Draw happens now. Envelope sealed. Bet. (PP says stay at 0.7).
      *   **Condition C (Inadmissible Info):** "The Oracle." A student draws a card from a "Prophecy Deck". The deck is rigged. 10 cards. 7 say "Red", 3 say "Blue". *But* the Prophecy Deck is correlated perfectly with the Urn Draw (pre-arranged by instructor).
      *   *Wait, if correlated perfectly, Chance is no longer 0.7.*
      *   *Let's try the "Time Traveler" simulation.*
      *   **Round 1:** Standard.
      *   **Round 2:** "The Future is Written." The instructor reveals they drew the ball at 8:00 AM this morning. It is in a safe. (Should be 0.7).
      *   **Round 3:** "The Crystal Ball." The instructor opens the safe, looks, and says "It is Red." (Should be 1.0).
      *   *Issue:* Round 3 is just testimony.
      *   *Better:* **The "Causal Influence" Round.**
      *   Let's go with the **"Reliable Predictor"** vs. **"Chance"** conflict.
      *   Setup: We have the 7/3 Urn. We also have a "Predictor Machine" (a second bag).
      *   If Predictor says Red, what is your credence?
      *   If Predictor is 100% accurate, Credence = 1.0 (overrides 0.7).
      *   If Predictor is 70% accurate (matches urn), Credence = ? (Bayes).
      *   *This highlights the "E" in $C(A|XE)$.* If E includes the Predictor's output, and the Predictor is infallible, E is inadmissible relative to the Chance X.

  7.  **Timeline & Logistics:**
      *   0-10: Intro & Scoring Rule.
      *   10-25: Round 1 (Baseline) & Round 2 (Calibration).
      *   25-40: Round 3 (The "Fixed" Outcome).
      *   40-55: Round 4 (The "Oracle"/Inadmissible).
      *   55-75: Debrief & Theory Mapping.

  8.  **Predicting Failures:**
      *   *Failure 1:* Students don't trust the scoring rule and hedge.
      *   *Fix:* Run a practice round with trivial stakes.
      *   *Failure 2:* Students don't believe the "Oracle" is reliable.
      *   *Fix:* Make the Oracle's reliability demonstrable (e.g., show past predictions).
      *   *Failure 3:* The "Fixed Outcome" round confuses them (Gambler's Fallacy vs. Determinism).
      *   *Fix:* Emphasize epistemic access, not metaphysics.

  9.  **Limitations:**
      *   Can't simulate "Undermining Futures" (Lewis's big problem for PP).
      *   Can't simulate true objective chance (determinism worry).
      *   Instructor authority biases the "Oracle."

  10. **Meta-Reflection (What would change my mind):**
      *   If students treat the "Fixed" round as 50/50 (Principle of Indifference violation).
      *   If students ignore the Oracle entirely (skepticism).
      *   If the scoring rule confusion dominates the philosophical discussion.

  11. **Drafting the Content:** (Iterative refinement of the rules for clarity).
