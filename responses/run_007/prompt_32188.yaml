answer: |-
  You have put your finger on one of the most unstable fault lines in contemporary bioethics. The current regulatory and clinical consensus on Preimplantation Genetic Testing (PGT, formerly PGD) is not the result of a single, coherent philosophical theory. It is instead a **reflective equilibrium** born of political compromise, historical trauma (eugenics), and a specific liberal-democratic intuition about the role of medicine.

  If we try to reconstruct the implicit philosophical commitments underwriting the current consensus (Screen Disease: Yes; Select Sex: No; Enhance Traits: Absolutely Not), we find a hybrid framework that is philosophically fragile. It collapses under scrutiny if you apply a consistent principle of either *Beneficence* or *Autonomy*.

  Here is a reconstruction of the implicit theory, where it breaks, and what is actually doing the heavy lifting.

  ### 1. The Implicit Consensus: "Threshold Sufficiency" + "Medical Model"

  The current practice rests on two main pillars that together form a **Threshold Conception of Parental Duty**.

  **A. The Duty to Prevent Serious Harm (The Threshold)**
  The consensus assumes parents owe their future children a life that clears a minimum threshold of "species-typical functioning" (a concept borrowed from Norman Daniels).
  *   **Philosophical Commitment:** Parents have a negative duty not to inflict preventable, severe suffering.
  *   **Application:** Screening out Tay-Sachs or Huntington's is viewed as preventing a life below the threshold of viability or one filled with net suffering.
  *   **The Tension:** As you noted, this relies on an objective medical definition of "harm." This is why the Deaf culture argument fails in policy settings. The consensus assumes a **Medical Model of Disability** (deafness is a physiological deficit) rather than a **Social Model** (deafness is a difference exacerbated by society). The state implicitly asserts that a life with deafness is *objectively* worse than a life without it, regardless of cultural integration. This contradicts the liberal neutrality the state usually claims regarding conceptions of the good life.

  **B. The Therapy/Enhancement Distinction**
  This is the primary boundary marker. Medicine is for restoring or preserving normal functioning; it is not for improving upon it.
  *   **Philosophical Commitment:** The goal of reproduction is to create a *child*, not to create a *product*.
  *   **Application:** Screening for disease is "therapy" (protecting the child's open future). Screening for IQ or height is "enhancement" (imposing parental will).
  *   **The Tension:** This distinction is biologically porous. Is preventing a genetic predisposition to low IQ therapy or enhancement? Is selecting against a predisposition to alcoholism therapy? The consensus draws a bright line where there is a gradient, relying on social agreement rather than biological fact.

  ### 2. The Sex Selection Paradox: Method vs. Motive

  You asked why natural family balancing is permissible but technological selection is not. This reveals that the consensus is not actually about the *motive* (sexism or preference) but about the **systemic consequences of medicalization**.

  *   **The Efficiency Argument:** Natural sex selection is inefficient. Technological selection is near 100% effective. If 55% of parents prefer boys, natural selection results in a roughly 51/49 split. PGD could result in a 90/10 split (as seen in demographics in parts of Asia). The ban is utilitarian: it prevents demographic skewing that harms society.
  *   **The Commodification Objection:** When you select for sex via IVF, you are intervening in the "givenness" of the child. Philosophers like Michael Sandel argue this turns the child from a "gift" into a "manufacture." Natural conception preserves the "open future" of the child (they are a surprise); PGD selection makes them a project.
  *   **The Regulatory Reality:** The state regulates *medical procedures*, not private sexual behavior. It is legally easier to ban a clinic from running a test than to ban parents from trying for a boy. The "method" matters because the method involves the healthcare system, which is publicly funded or publicly licensed, and thus subject to public norms.

  ### 3. Stress Testing the Consensus

  If we swap in the pure theories you mentioned, the current consensus disintegrates.

  **Scenario A: Pure Procreative Beneficence (Julian Savulescu)**
  *   **The Theory:** Parents are morally obligated to select the embryo with the best expected life, all things considered.
  *   **The Result:** The distinction between disease and enhancement collapses. If a polygenic score predicts higher IQ, and higher IQ correlates with better life outcomes (health, income, happiness), Beneficence *requires* you to select for it. Screening out deafness is good; screening *in* high IQ is also good.
  *   **Why the Consensus Rejects It:** It creates a "arms race" of enhancement. It places an unbearable burden on parents (if you pick the lower IQ embryo, did you harm your child?). It exacerbates inequality (only the rich can afford the best embryos). The current consensus rejects Beneficence in favor of **Sufficiency**: you must ensure the child is healthy enough, but you are not obligated to make them the *best*.

  **Scenario B: Pure Reproductive Autonomy**
  *   **The Theory:** Parents have a right to reproduce as they see fit, provided they do not harm others.
  *   **The Result:** Sex selection should be legal (it's a parental preference). Enhancement should be legal. Even selecting *for* deafness should be legal (if Deaf parents believe they can provide a good life).
  *   **Why the Consensus Rejects It:** It ignores the **Expressivist Objection**. Selecting against disability is seen by disability rights advocates as expressing a judgment that "people like us should not exist." Pure autonomy ignores the message sent to existing people with disabilities. Furthermore, it ignores the harm to the *child* as a future autonomous agent (the "right to an open future").

  ### 4. Where the Practice is Philosophically Underdetermined

  You asked where the choice is being made on "some other basis entirely." There are three areas where the philosophy is a mask for politics or pragmatism.

  **1. The Non-Identity Problem (The Logic Gap)**
  Philosophically, the "harm" argument for PGD is shaky due to Derek Parfit's Non-Identity Problem. If you screen out Embryo A (with Huntington's) and implant Embryo B (healthy), you haven't helped Embryo A; Embryo A never exists. You haven't harmed Embryo B; Embryo B has a life worth living.
  *   **The Workaround:** The consensus smuggles in a **Person-Affecting View** despite the logic. We act *as if* we are preventing harm to a specific child, even though we are actually selecting which child exists. We do this because the alternative (moral nihilism regarding selection) is socially untenable.

  **2. The "Eugenics" Label (The Historical Trauma)**
  The line between "screening for cystic fibrosis" and "screening for IQ" is not a bright moral line; it is a historical tripwire.
  *   **The Commitment:** The consensus is driven by a **Precautionary Principle** regarding state-sanctioned breeding. Because state-mandated eugenics led to atrocities in the 20th century, any *enhancement* is tainted by that history, while *disease prevention* is granted a "medical exemption."
  *   **The Inconsistency:** If the goal is to prevent eugenics, private selection for IQ is arguably less dangerous than state-mandated sterilization. But the *language* of eugenics is used to shut down enhancement debates regardless of the voluntary nature of the choice.

  **3. Justice and Inequality (The Real Driver)**
  The strongest philosophical underpinning for banning enhancement (and restricting sex selection) is not about the child's welfare, but about **Social Justice**.
  *   **The Commitment:** Liberal Egalitarianism.
  *   **The Logic:** If embryo enhancement becomes available, it will be expensive. This will allow the wealthy to biologically cement their advantage, creating a "genetic aristocracy." This violates fair equality of opportunity.
  *   **The Underdetermination:** This is a political argument, not a bioethical one. It implies that if we had universal healthcare and free access to enhancement, the moral objection might vanish. But the current consensus treats the technology as inherently suspect, not just the distribution.

  ### Summary: The "Liberal Paternalist" Compromise

  The theory underwriting the current PGD consensus is **Liberal Paternalism regarding the Medical Sphere.**

  1.  **Parents owe children a "normal" start:** They must clear the threshold of serious disease (Paternalism/Beneficence).
  2.  **Parents do not own children:** They cannot design traits for preference or advantage (Anti-Commodification).
  3.  **Medicine serves health, not desire:** The medical profession acts as a gatekeeper to enforce social norms about what counts as a "need" vs. a "want."

  **Is it consistent?** No.
  *   It claims to be neutral about the "good life" but defines deafness as a harm.
  *   It claims to prevent harm but relies on the Non-Identity Problem which negates harm.
  *   It claims to protect autonomy but bans sex selection while allowing natural family balancing.

  **Why does it persist?**
  Because it is the only stable equilibrium that avoids two terrifying extremes:
  1.  **The Gattaca Scenario:** Unrestricted enhancement leading to biological castes.
  2.  **The Suffering Scenario:** Parents refusing to screen out fatal diseases due to absolute autonomy or religious belief.

  The "line" bugs you because it is not drawn by a geometer; it is drawn by a politician. It is a boundary maintained not because it is philosophically pure, but because it is the only one that allows the technology to exist without triggering a full-scale cultural war over the definition of human nature. The inconsistency is a feature, not a bug—it allows different groups to project their own values onto the rules while agreeing on the prohibitions.
