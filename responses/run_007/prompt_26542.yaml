answer: |-
  First, a crucial caveat for your piece: Behavioral science does not produce precise variance percentages like physics. If you quote these numbers as empirical fact, you will be vulnerable to criticism. However, as a **heuristic device** to illustrate relative weight and theoretical consensus, we can construct a model based on the literature (Shubik, Teger, Brockner, Staw, Kahneman/Thaler).

  Here is a breakdown of the explanatory weight of these mechanisms in the context of the Dollar Auction, followed by the mechanism that is systematically underweighted.

  ### The Explanatory Breakdown (Heuristic Model)

  If we treat the total variance in escalation behavior as 100%, here is how the literature suggests the weight is distributed. Note that these mechanisms are not siloed; they feed each other.

  **1. Loss Aversion: 35%**
  *   **The Mechanism:** Based on Prospect Theory. The pain of losing $1.00 (as the second-highest bidder who gets nothing) is psychologically weighted about twice as heavily as the pleasure of gaining $1.00.
  *   **Why it tops the list:** In the Dollar Auction, the moment you become the second-highest bidder, you are facing a *certain loss* if you stop. Escalation becomes a way to avoid realizing that loss. This is the engine of the trap. It isn't just that you spent money (sunk cost); it's that stopping guarantees a negative outcome, while bidding offers a *probability* of breaking even. The brain prioritizes avoiding the certain pain over the rational calculation of total loss.

  **2. Sunk Cost Thinking: 25%**
  *   **The Mechanism:** The tendency to continue an endeavor once an investment in money, effort, or time has been made.
  *   **Why it's second:** This is the most commonly cited reason, but often it is a post-hoc rationalization for Loss Aversion. "I've already bid 90 cents" is the thought, but the emotional fuel is "I can't afford to lose that 90 cents." It explains the *justification* for escalation, whereas Loss Aversion explains the *impulse*.

  **3. Competitive Arousal: 20%**
  *   **The Mechanism:** The physiological and psychological state of "hot" competition. The goal shifts from "maximize profit" to "defeat the opponent."
  *   **Why it's third:** Martin Shubik (who invented the auction) emphasized this. In experiments, escalation is significantly higher when bidders can see each other or know each other. The dollar becomes secondary; the victory becomes primary. This explains why auctions escalate faster than solitary investment decisions.

  **4. Face-Saving (Social Reputation): 15%**
  *   **The Mechanism:** The desire to avoid looking foolish, weak, or inconsistent to observers.
  *   **Why it's fourth:** This is distinct from competitive arousal. Arousal is about beating the other person; face-saving is about the audience (even an imagined one). In institutional settings (wars, corporate projects), this is often the dominant factor for leaders, but in pure Dollar Auction experiments, Loss Aversion usually outweighs it.

  **5. The "Just One More Round" Fallacy (Optimism Bias): 5%**
  *   **The Mechanism:** The belief that the opponent is on the verge of capitulation and the next bid will be the winning one.
  *   **Why it's last:** While present, this is often a thin veneer over the deeper emotional drivers. Bidders rarely truly believe the other will stop; they bid because they *can't afford* for the other not to stop. It is a hope, not a primary driver.

  ---

  ### The Systematically Underweighted Mechanism

  If there is one mechanism that is consistently overlooked in popular discussions (and even some academic ones) of escalation, it is **Narrow Framing (or Decision Isolation).**

  **What it is:**
  Narrow Framing is the cognitive tendency to evaluate a decision in isolation from the broader context. In the Dollar Auction, the critical psychological shift happens when the question changes from **"Should I be in this auction?"** to **"Should I bid $1.05?"**

  **Why it's underweighted:**
  Journalists and commentators love to focus on *emotion* (greed, pride, stubbornness). It makes for a better story about human folly. However, Narrow Framing is a structural cognitive error that affects even cold, rational actors.

  1.  **The Shift in Reference Point:** When you first bid 5 cents, the reference point is $0. When you are the second bidder at 95 cents, the reference point shifts. You no longer compare the bid to the value of the dollar; you compare the *next bid* to the *current loss*.
  2.  **The Institutional Parallel:** This is the most important angle for your piece on institutions. Governments and corporations rarely ask, "Should we be in this war/project?" They ask, "Should we fund this quarter's deployment to secure our previous investment?"
  3.  **Why it matters:** If you attribute escalation only to "sunk cost fallacy," the solution is "ignore past costs." But if you attribute it to **Narrow Framing**, the solution is "widen the frame." It suggests that escalation isn't just an emotional failure; it's a *procedural* failure. Institutions lack "circuit breakers" that force a re-evaluation of the entire premise rather than just the next step.

  **How to use this in your piece:**
  You can argue that we treat escalation as a *moral* failing (pride, stubbornness) when it is often a *cognitive architecture* failing. The Dollar Auction is designed to exploit Narrow Framing. Once you are in, the game forces you to look at the next move, not the whole board. The most dangerous escalators aren't the emotional ones; they are the ones who are calmly and logically optimizing for the wrong timeframe.

  ### Summary for your Narrative Arc
  *   **The Hook:** The Dollar Auction shows rational people acting irrationally.
  *   **The Standard Explanation:** They are trapped by sunk costs and pride (Loss Aversion/Sunk Cost).
  *   **The Nuance:** While emotion fuels the fire, the *structure* of the decision changes.
  *   **The Insight:** The real villain is **Narrow Framing**. We escalate because we stop asking "Is this worth it?" and start asking "How do I fix this specific loss?"
  *   **The Takeaway:** To stop escalation, you don't just need willpower; you need institutional mechanisms that force the frame to widen.

  This approach allows you to use the behavioral econ literature without getting bogged down in the "percentages are fake" critique, while offering a fresher, more structural insight for your readers.
