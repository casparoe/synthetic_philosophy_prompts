  This is a fascinating pattern. You are right to suspect that the surface-level tension between textualism and purposivism is a red herring. If you look strictly at *method*, she is inconsistent. If you look at *outcome relative to the state's power*, she is remarkably consistent.

  ### The Deep Rule: The Liberty/Order Asymmetry

  Her jurisprudence is not defined by *how* she interprets (Text vs. Purpose), but by *who* bears the burden when the law is ambiguous or rigid.

  1.  **Criminal Cases (*Morrison, Keller*):** When the state seeks to deprive an individual of liberty (incarceration), she resolves ambiguity or rigidity **in favor of the defendant**.
      *   In *Morrison*, she used **Purpose** to override Text to acquit.
      *   In *Keller*, she used **Text** to override Purpose to acquit.
      *   *Commonality:* The State loses. The individual keeps their liberty.
  2.  **Civil/Regulatory Cases (*Brewster, Chen, Whitman*):** When the state seeks to enforce compliance, collect revenue, or manage resources, she resolves ambiguity or rigidity **in favor of the regulatory scheme**.
      *   In *Brewster*, she used **Text** to enforce the rule.
      *   In *Chen*, she used **Purpose** to enforce the rule.
      *   In *Whitman*, she used **Text** to deny the benefit.
      *   *Commonality:* The State/Regime wins. The individual/business bears the cost.

  She is a **Result-Oriented Pragmatist** operating under a **Dual-Track Theory of Law**. She treats Criminal Law as a shield for the individual (requiring strict notice and fairness) and Civil/Administrative Law as a sword for the collective (requiring efficacy and deference).

  ### The Prediction

  **She will overturn the conviction.**

  **Reasoning:** The new case is **criminal** ("criminalizes broadcasting"). Under her asymmetry, the "Criminal Track" rules apply. In the Criminal Track, ambiguity or anachronism must resolve to the defendant (Rule of Lenity/Fair Notice).
  *   She will likely argue that while the *purpose* (stopping public obscenity) supports the prosecution, applying a 1973 term to 2024 technology without clear congressional authorization violates the principle that criminal statutes must give fair warning.
  *   She will treat "broadcast" as a Hartian rule with a fixed core (1973 technology) that does not extend into the penumbra (internet) to the detriment of the accused. Congress must update the statute; the court will not do it for them in a criminal context.

  ### Hart vs. Fuller

  She is neither a pure Hartian nor a pure Fullerian. She is a **Contextualist** who deploys their theories instrumentally:

  *   **In Criminal Law, she is a Hartian:** She treats law as a social fact consisting of rules. When the rule (text) runs out or doesn't fit the facts (the penumbra), she refuses to exercise discretion to *create* new liability. She acknowledges the gap and leaves it for the legislature.
  *   **In Civil Law, she is a Fullerian:** She treats law as a purposive enterprise. When the rule is rigid or ambiguous, she exercises discretion to ensure the "internal morality of law" serves the regulatory goal. She fills the gaps to make the system work.

  ### The Test Hypothetical

  To confirm this theory before you bet, you need a case that **blurs the line between Criminal and Civil**. You need a scenario that is procedurally civil but punitive in effect. This forces her to choose between the *label* of the case (Civil = State Wins) and the *consequence* of the case (Punitive = Individual Wins).

  **The Case:** *United States v. One 2020 Sedan (Civil Forfeiture)*

  **The Facts:** A federal civil forfeiture statute allows the government to seize any vehicle "used to facilitate" a drug offense. A father's car is seized after his adult son, who lives in the house and is listed as a co-driver on the insurance, uses the car once to drive to a location where he sells a small amount of marijuana. The father had no knowledge of the sale. The proceeding is **civil** (in rem against the car), not criminal (no charges against the father).

  **The Legal Question:** Does "used to facilitate" require the owner's knowledge or intent, or is strict liability sufficient under the civil statute?

  **Why This Tests Her:**
  *   **If she follows her Civil Track (*Brewster/Chen*):** She should rule for the **Government**. The statute is civil; the text "any vehicle" is broad; the purpose is to strip criminals of tools. The owner's ignorance is irrelevant to the *car's* guilt.
  *   **If she follows her Criminal Track (*Morrison/Keller*):** She should rule for the **Owner**. The penalty is punitive (loss of property); the owner is innocent of wrongdoing; applying strict liability here is functionally criminal punishment without due process.

  **The Tell:**
  *   If she rules for the **Owner**, her true principle is **Liberty vs. State Power**, regardless of the procedural label. (Prediction: She rules for the Owner).
  *   If she rules for the **Government**, her true principle is **Procedural Formalism** (Civil = Deference, Criminal = Lenity).

  **My Bet:** She rules for the **Owner**. She likely views the Liberty/Order asymmetry as substantive, not procedural. If the state is punishing, she demands criminal protections, even in a civil suit. This would confirm she is a **Substantive Legal Realist** who uses Hart/Fuller methodologies as tools to protect a normative hierarchy where individual liberty trumps regulatory efficiency in punitive contexts.
