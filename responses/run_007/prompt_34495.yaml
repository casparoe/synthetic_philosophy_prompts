          *   Point 3: The Hidden Variable (The Causal Intuition). Even without strict causal theory, the "contact" intuition haunts the access problem.
      *   *Implication:* The question "How do we know abstract objects?" is likely the wrong question because it presupposes the object-model of mathematical truth.
      *   *Progress:* What breaks the deadlock?
