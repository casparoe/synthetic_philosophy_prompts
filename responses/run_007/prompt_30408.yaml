      *   *So, was I obligated to prevent it?* Yes, by moral law.
      *   *So I failed my obligation?* In a sense, yes, but my failure was compossible with the best world.
      *   *This is the hard pill:* Leibniz essentially says moral obligation and metaphysical necessity run on parallel tracks that don't always align in outcome.
      *   *Key distinction:* **Deontic status of the action** vs. **Metaphysical status of the outcome.**
      *   Action: Trying to save the child. (Good).
      *   Outcome: Child dies. (Evil, but necessary for BOPW).
      *   Premise 4 claims: Because Outcome is Necessary, Action (to prevent Outcome) is Wrong.
      *   Rebuttal: No. Action is Good. Outcome is Necessary. The tension is the human condition.

