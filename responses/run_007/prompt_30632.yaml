answer: |-
  This is an excellent set of questions. You have correctly identified the central tension in the last 20 years of experimental philosophy (x-phi). The "Standard Reading" you describe—that moral valence *constitutively* influences the application of folk-psychological concepts like "intentional"—was Joshua Knobe's initial headline-grabbing claim (2003).

  However, if you dig into the current literature, you will find that the "Moral Penetration" view has taken significant hits. Many proponents, including Knobe himself, have retreated from the claim that *morality* specifically is the driver, moving instead toward broader claims about *normativity* or *reasons*.

  Here is a breakdown of what would count against the view, ranked from "Fatal" to "Awkward," along with an assessment of whether the theory has become unfalsifiable.

  ---

  ### Tier 1: The "Non-Moral Norms" Threat (Fatal to the Moral Claim)
  **The Challenge:** If the asymmetry appears in cases involving *etiquette, conventions, or rules* that have no moral weight, then morality is not doing the work. *Normativity* is.

  **The Experiment:**
  Imagine a variation of the Chairman case.
  *   **Case A (Violation):** A CEO starts a new policy to increase profits. The policy requires employees to wear blue ties on Tuesdays. The CEO knows this violates the company's longstanding (but morally neutral) dress code tradition. He doesn't care about the tradition, only profit. Employees stop wearing the traditional ties.
  *   **Case B (Conformity):** A CEO starts a new policy to increase profits. The policy accidentally aligns with the company's longstanding tradition (e.g., wearing blue ties). He doesn't care about the tradition, only profit.

  **The Result:** If participants say the CEO *violated* the tradition "intentionally" in Case A, but did *not* uphold the tradition "intentionally" in Case B, the asymmetry holds without morality.

  **Why this kills the "Moral" View:**
  This result has essentially been obtained (e.g., by **Hindriks 2011**, **Guglielmo & Malle 2010**). If breaking a rule of etiquette produces the same effect as harming the environment, then the mechanism isn't "Moral Judgment." It is "Normative Judgment."
  *   **Concession Condition:** A defender of the *Moral* Knobe Effect must concede that morality is not the specific trigger. They must broaden their theory to "Normative Expectations." This effectively kills the specific claim that *good vs. bad* is the driver, replacing it with *expected vs. unexpected* (relative to a norm).

  ### Tier 2: The "Statistical Normality" Threat (Fatal to the Valence Claim)
  **The Challenge:** Perhaps it isn't about whether the outcome is *good or bad*, but whether it is *statistically typical*. We describe statistically deviant actions as "intentional" to explain why the deviation occurred.

  **The Experiment:**
  **Sripada and Stanley (2012)** proposed this. You need a case where a *good* outcome is statistically expected, and a *bad* outcome is statistically rare.
  *   **Case:** A machine is designed to produce widgets. 99% of the time, it produces high-quality widgets (Good/Normal). 1% of the time, due to a glitch, it produces toxic sludge (Bad/Abnormal).
  *   **Flip:** A machine is designed to produce widgets but is known to be broken. 99% of the time it produces sludge (Bad/Normal). 1% of the time it produces a widget (Good/Abnormal).

  **The Result:** If people say the machine (or operator) produced the sludge "intentionally" when it was rare, but *not* when it was common (regardless of moral valence), then statistical normality swamps moral valence.

  **Why this kills the "Valence" View:**
  Some studies suggest statistical normality *does* drive the effect. If I can make a "Help" case look intentional simply by making helping the statistically expected outcome, then "badness" is not the necessary condition.
  *   **Concession Condition:** If a defender admits that moral valence is just a *proxy* for normative/statistical expectations, they have conceded that morality isn't penetrating the concept; rather, the concept tracks deviations from the norm (which often correlate with morality).

  ### Tier 3: The "Deep Self" Challenge (Severe)
  **The Challenge:** The asymmetry isn't about the *outcome's* morality, but about whether the side effect reveals something about the agent's *character* (their "Deep Self").

  **The Experiment:**
  **Sripada (2010)** argues that we call an action intentional if the side effect concordances with the agent's deeper values.
  *   **Case:** A Chairman who is known to be a secret environmentalist signs off on a profit project that harms the environment. He claims he doesn't care.
  *   **Prediction:** If the "Moral View" is right, people should still say "intentional" because harm is bad. If the "Deep Self View" is right, people might hesitate because the harm contradicts his known values, suggesting it was truly accidental/unwanted.

  **Why this is Severe:**
  It shifts the locus from the *act* to the *agent*. If the effect disappears when the agent's character is swapped, the "Moral Valence of Outcome" theory is falsified.
  *   **Concession Condition:** Defenders have largely absorbed this by incorporating "attitudes" into their models. It forces the theory to become more complex (it's not just Outcome + Morality, it's Outcome + Morality + Agent's Values).

  ### Tier 4: Cross-Cultural Variation (Moderate/Severe)
  **The Challenge:** If the Knobe Effect is a fundamental feature of how human moral psychology shapes concepts, it should be universal.

  **The Experiment:**
  **Machery et al. (2004)** tested this in the US, India, and China. They found variation. Some cultures did not show the asymmetry as strongly, or showed it differently.

  **Why this is Moderate:**
  Defenders can argue that while the *underlying mechanism* is universal, cultural norms dictate what counts as a "norm violation." However, if the effect vanishes entirely in a specific culture, it suggests the "Moral Penetration" thesis is a WEIRD (Western, Educated, Industrialized, Rich, Democratic) phenomenon, not a feature of the human concept of intentionality.
  *   **Concession Condition:** It forces the view to be relativized. "Morality shapes intentionality *in cultures where individual agency is prioritized over collective outcome*," etc.

  ### Tier 5: Pragmatic Explanations (Awkward but Survivable)
  **The Challenge:** Maybe people *know* the mental states are identical in both cases, but they use the word "intentionally" differently for pragmatic reasons (e.g., to blame).

  **The Experiment:**
  Ask participants: "Did the Chairman *know* the harm would occur?" (Knowledge ascription). Usually, the asymmetry disappears for knowledge. But if you ask, "Is the Chairman *to blame*?" and correlate that with "intentional," you might find "intentional" is just a proxy for "blameworthy."
  **Adams & Steadman (2004)** argued this is a conversational implicature, not a conceptual change.

  **Why this is Awkward:**
  It suggests x-phi is measuring linguistic usage, not metaphysical concepts. It doesn't kill the data, but it kills the philosophical implication. It means our *concept* of intentionality hasn't changed; our *willingness to apply the label* has.
  *   **Concession Condition:** Most defenders accept this is part of the story. It's hard to disentangle semantics from pragmatics.

  ---

  ### The "Unfalsifiable" Worry: Has the Theory Retreated too Far?

  You asked if the view has been adjusted so that it risks nothing. **Yes, to a significant degree.**

  1.  **From Morality to Normativity:** Knobe and others have largely abandoned the claim that *moral* judgment specifically is the driver. The current "Standard View" among specialists is closer to the **Normative Theory**: people judge intentionality based on whether the side effect violates a *norm* (which can be moral, conventional, or statistical).
  2.  **From Concepts to Reasons:** More recently, Knobe (2014+) has argued that the effect isn't about the concept of "intentional" at all, but about how we determine what counts as a *reason* for action. If a side effect is bad, we see it as a reason *not* to act; if the agent acts anyway, we infer they must have intended it.

  **Is this unfalsifiable?**
  It is *harder* to falsify, but not impossible.
  *   **The Risk:** If the theory becomes "People apply 'intentional' when they detect a normative violation," it risks tautology. (When do they detect a violation? When they call it intentional.)
  *   **The Remaining Exposure:** The theory is still exposed if we find cases where a **Norm is Violated** but people **deny Intentionality**.
      *   *Example:* A case where an agent violates a norm purely due to incompetence or ignorance, where no one would blame them, and no one calls it intentional. If the Normative Theory says "Norm Violation → Intentional," but people say "Norm Violation + Ignorance → Not Intentional," the theory must add a "Culpable Ignorance" clause.
      *   If the theory requires enough clauses (Norms + Deep Self + Statistical Frequency + Culpability), it loses its explanatory power. It becomes a list of factors rather than a unified theory.

  ### Honest Assessment of Exposure

  **How exposed is the "Standard Reading" (Morality shapes Intentionality)?**
  **Very Exposed.** In fact, in specialist circles, that specific reading is largely considered refuted or superseded.

  *   **What survives:** The *asymmetry* is robust. People *do* apply "intentionally" differently based on side effects.
  *   **What died:** The claim that *Moral Good/Bad* is the specific switch.
  *   **What replaced it:** A hybrid of **Normative Expectations** (is this normal?) and **Deep Self Concordance** (does this match who they are?).

  **The "Killer" Experiment for the Modern View:**
  To threaten the current *Normative* consensus, you would need a case where:
  1.  A Norm is clearly violated (statistically or conventionally).
  2.  The agent is fully aware.
  3.  The agent is blameworthy.
  4.  **BUT** participants overwhelmingly refuse to say the action was "intentional."

  If you can construct a case where we blame someone for something we refuse to call intentional (beyond simple negligence), the link between Normative Judgment and Intentionality Ascription is broken. Some argue **addiction cases** or **compulsion cases** do this (e.g., "He knew it violated his values and the norms, but he couldn't help it"). If people say "He shouldn't have done it (Blame/Norm)" but "He didn't do it intentionally (Compulsion)," the Knobean link is severed.

  ### Summary Ranking of Threats

  1.  **Non-Moral Norms (Etiquette/Conventions):** *Fatal to Moral Claim.* (Already largely accepted as a refutation of the strict moral view).
  2.  **Statistical Normality:** *Fatal to Valence Claim.* (If expectation trumps goodness).
  3.  **Deep Self Discordance:** *Severe.* (If bad outcomes aren't intentional when they contradict the agent's values).
  4.  **Cross-Cultural Elimination:** *Moderate.* (Limits universality).
  5.  **Pragmatic Explanations:** *Awkward.* (Changes the philosophical stakes, but keeps the data).

  **Bottom Line:** You are right to be skeptical of the "Morality is doing the work" claim. The rabbit hole leads to a more complex place: our concept of "intentional" is not a clean mental-state detector, but a messy tool for holding people accountable within a normative framework. The view hasn't become unfalsifiable, but it has become much less sexy: it's not that "Morality corrupts Logic," it's that "Accountability drives Description."
