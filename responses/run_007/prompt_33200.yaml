      *   *Case 9 (Gov/Flood):* No Defenses $\neq$ Cause; Dismantled Defenses = Cause. (Status Quo vs. Intervention/Reliance).
      *   *Case 10 (Hiker/Snake):* Silence $\neq$ Cause; Luring = Cause. (Creation of Risk vs. Failure to Prevent).

  3.  **Identify the Underlying Principles:**
      *   *Observation 1:* The distinction isn't purely physical. Physically, the parent not feeding and the sunbather not saving are identical (both didn't act). The difference is *normative*.
      *   *Observation 2:* "Duty" is the strongest predictor. Where there is a specific duty (legal, moral, contractual, relational), omission feels like causation. Where there is no duty, it feels like "letting happen."
      *   *Observation 3:* The "Status Quo" bias. Dismantling defenses (Case 9) is worse than not building them. Luring (Case 10) is worse than warning. This suggests *intervention* vs. *non-intervention*.
      *   *Observation 4:* Counterfactual Dependence. In all "Cause" cases, if the agent *had* acted, the result would likely not have occurred. But this is true for the Sunbather too. So counterfactuals alone aren't enough.
      *   *Observation 5:* Expectation/Reliance. Case 8 (Gardener) and Case 9 (Defenses) hinge on whether the victim relied on the agent.

      *   *Synthesis:* The user's intuitions align with a **Normative/Expectation-Based Theory of Causation**. Specifically, the "Causal Selection" problem. We select causes from a vast web of conditions based on what is *abnormal* or *violates a norm*.
      *   *Key Philosophical Concepts:*
          *   **Hart & Honoré (1959):** The classic legal/philosophical treatment. Distinguishes "causes" from "conditions." An omission is a cause only if there was a duty to act.
          *   **Counterfactual Dependence + Norms:** Lewis-style counterfactuals filtered through normative expectations.
          *   **The "Default" State:** What is the expected background condition? (Case 9: No defenses is default; removing them is an intervention).

  4.  **Address the "Weirdness" (Case 5 & 8):**
      *   Why does mental state (Case 5) or a promise (Case 8) change *causation*?
