answer: |-
  You have stumbled onto one of the most persistent problems in the philosophy of law and action theory. Your intuitions are not random; they are remarkably consistent with a specific framework known as **Normative Causal Selection** (often associated with legal philosophers H.L.A. Hart and Tony Honoré).

  The short answer is: **Your gut is applying a "Duty + Baseline" filter to raw counterfactual dependence.**

  Physically, an omission is nothing. It is the absence of an event. Therefore, metaphysically, "nothing" cannot cause "something." However, in human practice (law, morality, engineering), we treat omissions as causes *only when there was a normative expectation that the event would occur.*

  Here is the principle that unifies your 10 cases, followed by the verdict on your programmer scenario.

  ### The Unifying Principle: Deviation from the Normative Baseline

  For an omission to be judged as a *cause* (rather than just a background condition), three conditions must be met:

  1.  **Counterfactual Dependence:** If the agent had acted, the outcome would likely have been prevented. (All 10 cases pass this).
  2.  **Normative Duty/Expectation:** The agent was *supposed* to act based on a role, contract, relationship, or prior conduct.
  3.  **Baseline Deviation:** The omission represents a deviation from the "normal" or "expected" course of events, rather than merely failing to improve upon the status quo.

  Let's run your cases through this filter.

  #### 1. The Duty Filter (Cases 1, 2, 3, 6, 7, 8)
  This explains why the Parent, Lifeguard, and Doctor are causal, but the Sunbather and Stranger-Gardener are not.
  *   **Physics:** The sunbather's inaction is physically identical to the lifeguard's inaction.
  *   **Norms:** The lifeguard has a **role-based duty**. The parent has a **relational duty**. The doctor has a **professional duty**.
  *   **The Promise (Case 8):** You noted it feels "philosophically suspect" that a promise changes causation. Under this principle, it doesn't change the *physics*, but it changes the **baseline expectation**. Once the gardener agrees, the "normal course of events" includes watering. By not watering, they deviated from the established script. You are intuitively treating the promise as creating a *causal pipeline* that was then severed.

  #### 2. The Baseline Filter (Cases 4, 5, 9, 10)
  This explains the "Status Quo" bias in your thinking.
  *   **Fire (Case 4 & 5):** You correctly identify that mental state shouldn't change metaphysical causation. However, it changes **causal attribution**. In Case 5 (malice), the omission becomes *instrumental*. You didn't just "fail to stop" the fire; you "used the fire" to achieve a goal. Psychologically, instrumentalizing an outcome makes an omission feel like a commission.
  *   **Flood Defenses (Case 9):** This is the clearest example of **Baseline Deviation**.
      *   *No defenses built:* The baseline is "no defenses." The storm happened as nature intended.
      *   *Defenses removed:* The baseline was "protection." The government actively shifted the baseline to "vulnerability." Removing a shield is causally potent; failing to buy a shield is not.
  *   **The Snake (Case 10):** You wrote: *"Structurally both are omissions."* This is the crux. **Luring is not an omission.**
      *   *Silence:* You failed to alter the environment. (Omission).
      *   *Luring:* You altered the environment to introduce risk. (Commission).
      *   Your intuition is correct to distinguish them. Luring creates a new causal chain. Silence merely fails to interrupt an existing one. The difference is **Creation of Risk vs. Failure to Mitigate Risk.**

  ### Why Your Gut Feels "Suspect" (Cases 5 & 8)
  You feel uneasy because you sense that **Causation** (a metaphysical relation) is getting mixed up with **Blame** (a normative relation).

  Philosophers call this the **Causal Selection Problem**. The world contains infinite conditions for any event (the oxygen, the gravity, the spark, the lack of a fire extinguisher). We "select" the cause based on what is **abnormal** or **culpable**.
  *   In Case 8, the promise makes the gardener's inaction *abnormal*.
  *   In Case 5, the malice makes your inaction *abnormal* (you became an ally of the fire).

  Your intuition isn't wrong; it's just pragmatic. In human discourse, "What caused this?" usually means "Who is responsible for fixing/preventing this next time?"

  ### The Programmer Verdict

  Now, let's apply the **Duty + Baseline** principle to your losing-sleep scenario.

  **Scenario A: The Ignorant Programmer**
  *   *Context:* A programmer doesn't patch a vulnerability they don't know about.
  *   *Counterfactual:* If they knew, they might have patched it.
  *   *Duty:* Programmers have a duty to write secure code, but they do not have a duty to be omniscient.
  *   *Baseline:* Software contains unknown bugs. This is the industry baseline.
  *   **Verdict:** **Not Causal.** The vulnerability is a background condition (like the storm in Case 9). The programmer's ignorance is part of the normal state of affairs. The *exploit* caused the damage; the bug was the condition.

  **Scenario B: The Knowing Programmer**
  *   *Context:* A programmer knows about the vulnerability and decides not to patch it (due to laziness, cost, or deadline).
  *   *Counterfactual:* If they patched it, the damage would not have occurred.
  *   *Duty:* Once a vulnerability is *known*, the professional baseline shifts. The "normal course of events" now demands a patch.
  *   *Baseline Deviation:* Deciding not to patch is a deviation from the standard of care. It is analogous to the Government dismantling flood defenses (Case 9) or the Gardener breaking a promise (Case 8).
  *   **Verdict:** **Causal.** By knowingly leaving the door open, the programmer has deviated from the normative baseline of security maintenance. Their omission is now a "cause" in the same way the lifeguard's inaction is a cause.

  ### The Nuance: "Maintainer" vs. "Contributor"
  There is one variable that could flip Scenario B back to "Not Causal." **Role.**
  *   If the programmer is the **Maintainer/Owner**: They have the Duty. Verdict = Causal.
  *   If the programmer is a **Random Contributor** who filed a bug report that was ignored by the Maintainer: They have no Duty to enforce the patch. Verdict = Not Causal (The Maintainer is the cause by omission).

  ### Summary
  Your intuitions are tracking **Hart and Honoré's Theory of Causation in the Law**. You are consistently distinguishing between:
  1.  **Mere Conditions:** Background facts that allow an event to happen (The sunbather, the unknown bug, the lack of flood walls).
  2.  **Intervening Causes:** Deviations from a normatively expected baseline that allow the event to happen (The lifeguard, the known unpatched bug, the dismantled walls).

  You aren't confused; you are correctly identifying that in human systems, **causation is not just about physics, it's about expectations.** When an agent violates a specific expectation of protection, their inaction transforms from a "condition" into a "cause."
