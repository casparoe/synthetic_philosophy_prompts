      *   **Core Question:** If $\psi$ is epistemic (information), why is the measurement problem still a problem? Shouldn't collapse just be a Bayesian update? What assumption am I missing?
      *   **Goal:** Explain why the measurement problem persists even in $\psi$-epistemic frameworks, identifying the hidden assumptions and the specific hurdles epistemic views face (e.g., PBR theorem, no-go theorems, the nature of the "underlying state").

