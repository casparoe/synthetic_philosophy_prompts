          2.  Show vs. Grant proposal: Not fine (violation).
          3.  Drunk friend/abuse vs. Moving: Fine (released/forfeited).
          4.  No service vs. Mom call: Fine (impossible).
          5.  Don't feel like it vs. Mom call: Not fine (violation).
          6.  Deathbed promise (ashes) vs. Inconvenience/No reliance: Not fine (binding).
      *   **User's Proposed Principle:** "A promise binds you to the extent the promisee still relies on it or would be hurt by its breaking."
      *   **Problem:** This principle fits 1-5 but fails on 6 (Grandfather is dead, can't rely or be hurt).
      *   **Specific Questions:**
          1.  Is there a principle that covers all six without being gerrymandered?
          2.  If not, which verdict should be dropped?
          3.  Is this a case for particularism?
          4.  What does the best principle say about the *New Case* (PhD defense, friend doesn't care)?

  2.  **Evaluate the User's Proposed Principle (Reliance/Harm):**
      *   This is essentially a *consequentialist* or *reliance-based* view of promising (similar to Scanlon's Principle of Fidelity or simple utilitarianism).
      *   *Strengths:* Handles excuses (1, 4), prioritizes importance (2, 5), handles release/forfeiture (3).
      *   *Weakness:* Fails on duties to the dead or duties that seem intrinsic to the act of promising itself (6). The grandfather cannot be harmed, yet the duty persists.

  3.  **Explore Alternative General Principles:**
      *   *Option A: Autonomy/Authority Transfer.* (Shiffrin, Raz). When you promise, you give the promisee authority over that domain of action.
          *   *Case 6:* Did the grandfather have authority? He's dead. Does authority persist? Maybe, but it feels clunky.
      *   *Option B: Integrity/Self-Constitution.* (Kantian, Williams). Breaking a promise corrupts *your* integrity, regardless of the other person.
          *   *Case 6:* Fits well. You become a person who breaks deathbed promises.
          *   *Case 1:* Does integrity allow for emergencies? Yes, reasonable expectations are part of the commitment.
      *   *Option C: Expectation + Normative Expectation.* (T.M. Scanlon). It's about violating a principle that others could reasonably reject.
          *   *Case 6:* Harder. Who is being wronged? The memory? The living relatives (if they knew)? But the prompt says "no one else knows."
      *   *Option D: The "Obligation to the Past Self/Relationship" View.*
          *   The promise creates a normative bond that transcends current utility or reliance.

  4.  **Develop a Unified Principle (The "Hybrid" Approach):**
      *   To save generalism, we need a principle that accounts for *reliance* (cases 1-5) but also *intrinsic obligation* (case 6).
      *   *Proposal:* **The Principle of Normative Commitment.** A promise creates a pro tanto duty to perform unless: (a) performance becomes impossible/disproportionately costly (excuse), (b) the promisee releases you or forfeits the right (release), or (c) the duty is overridden by a significantly weightier moral demand. Crucially, the duty originates in the *act of commitment itself*, not solely in the *consequences of breaking it*.
      *   *Refining for Case 6:* The duty is to honor the *trust* placed in you, which exists independently of the beneficiary's current capacity to suffer. It's about respecting the *past agency* of the promisor and promisee.
      *   *Better phrasing:* "A promise binds you because you invoked a normative power to obligate yourself. Excuses mitigate the *blame*, but do not always erase the *residue* of the obligation."
      *   *Wait, let's look at Case 6 again.* Why is it not fine? Because it's a sacred duty? Because it's about *respect for the dead*?
      *   *Synthesis:* A principle based on **Invited Trust and Normative Power**. When you promise, you invite the promisee to trust you and you alter your normative landscape.
          *   1 & 4: Trust wasn't violated because the scope of the promise implies "unless impossible/emergency."
          *   2 & 5: Trust violated for trivial reasons.
          *   3: Trust forfeited by abuse.
          *   6: Trust was invited and accepted. The death of the promisee doesn't dissolve the normative bond created *ante-mortem*. The "harm" is to the *sanctity of the commitment* or the *memory*, not current welfare.

  5.  **Address the Particularism Question:**
      *   Particularism (Dancy) says principles are useless because context changes the valence of reasons.
      *   Is the user a particularist? They *want* a principle. Their intuition on 6 clashes with their reliance principle.
      *   *Verdict:* It's not necessarily particularism. It's just that the user's *first draft* principle was too narrow (consequentialist). A deontological or hybrid principle can cover all six.
      *   *Honesty Check:* Is adding "except duties to the dead" gerrymandering? Maybe. But if the principle is "Promises create obligations that survive the promisee's capacity for reliance if the promise concerns posthumous interests," that's specific but not arbitrary.
      *   *Better:* The principle is about **Fidelity**, not **Harm**. Fidelity applies even without a living victim.

  6.  **Analyze the New Case (PhD Defense):**
      *   *Scenario:* Promised to attend. Friend says "I don't care, plenty of people."
      *   *Application of Reliance Principle:* No reliance, no harm -> No obligation.
      *   *Application of Fidelity/Authority Principle:* The promisee has released the promisor. If the promisee says "I don't claim this," the obligation is dissolved.
      *   *Nuance:* Is she being polite? If she *genuinely* doesn't care (as stated), the promise is effectively retracted/release.
      *   *Verdict:* You likely have no *strict* obligation, but there might be a *supererogatory* reason to go (support). But strictly speaking, the promise bond is loosened by release.

  7.  **Drafting the Response:**
      *   **Acknowledge the tension:** The user has identified the classic clash between Consequentialist/Reliance views (Scanlon/Utilitarian) and Deontological/Trust views (Kant/Shiffrin).
      *   **Critique the User's Principle:** It's too narrow. It explains *why* promises are usually important (harm/reliance) but not *what* a promise is (a binding commitment).
      *   **Propose a Better Principle:** "The Principle of Invited Trust and Normative Power."
          *   Promises transfer control/invite trust.
          *   Excuses (1, 4) are built into the scope of "reasonable expectation."
          *   Forfeiture (3) voids the trust.
          *   Triviality (2, 5) violates the trust.
          *   Death (6) doesn't void the trust because the obligation was crystallized when the promise was made and accepted. It's about *integrity* now, not *harm* then.
      *   **Address Particularism:** You aren't necessarily a particularist. You just need a richer principle. Particularism is the "nuclear option" if no principle works. Here, a Fidelity-based principle works.
      *   **Address the PhD Case:**
          *   If she *genuinely* releases you, the obligation dissolves (unlike Case 6 where he *can't* release you).
          *   Distinction between "Release" (Case 7) and "Incapacity" (Case 6).
          *   Advice: You don't *owe* it, but going is an act of friendship beyond the promise.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, Case 6 is tricky.* If no one knows, who is wronged? The dead? Can the dead be wronged? Most moral theories say yes (interests survive death).
      *   *Make sure to distinguish:* Case 3 (Friend releases/forfeits) vs. Case 7 (Friend releases). In Case 3, the user *decided* not to show because of the fight. In Case 7, the friend says "don't worry."
      *   *Refine the Principle:* Let's call it the **Principle of Fidelity to Commitment**.
      *   *Structure:*
          1.  Validate the intuition (Case 6 is the anchor).
          2.  Show why the Reliance Principle fails.
          3.  Offer the Fidelity Principle.
