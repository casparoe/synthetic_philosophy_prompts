answer: |-
  ### Translation Report: Epistemic Injustice in ML Vocabulary

  Here is the systematic translation of Fricker's framework into the vocabulary of ranking and recommender systems, followed by the residue report on what remains untranslatable.

  #### 1. Testimonial Injustice
  *   **The Concept:** A speaker receives a credibility deficit due to identity prejudice, causing their testimony to be underweighted.
  *   **The Translation:**
      *   **Credibility:** This maps cleanly to a **source weight** or **attention score** in a multi-source aggregation model. In a Bayesian framework, it is the **prior confidence** assigned to a specific data generator.
      *   **Testimony:** This is an **update step**. In online learning, it is the gradient contribution from a specific user interaction; in inference, it is the signal passed through the attention mechanism.
      *   **Credibility Deficit:** This is a **systematically miscalibrated source weight**. The model assigns a lower attention score to inputs from a specific cluster (identity group) than their signal-to-noise ratio warrants.
      *   **Identity Prejudice:** This translates to **bias in protected feature correlations**. The model learns to associate protected attributes (e.g., gender, race proxies) with lower reliability scores, independent of actual data quality.

  #### 2. Hermeneutical Injustice
  *   **The Concept:** A gap in shared interpretive resources prevents someone from making their experience intelligible.
  *   **The Translation:**
      *   **Hermeneutical Gap:** This maps to **missing features** or **insufficient latent dimensionality**. The model architecture lacks the specific nodes or dimensions required to represent a certain pattern of experience.
      *   **Making Intelligible:** This is **representation learning** or **convergence**. It is the process by which the model adjusts its latent space to minimize loss on a specific pattern of inputs.
      *   **Shared Resources:** This corresponds to the **training distribution** and **model architecture**. If the collective training data lacks examples of a phenomenon, the model cannot learn the feature representation for it.

  ---

  ### Residue Report

  **What Translates Cleanly:**
  The *mechanisms* of error translate perfectly. A credibility deficit is mathematically isomorphic to a miscalibrated weight. A hermeneutical gap is structurally identical to a missing feature in the latent space. Your framework can detect the *symptoms* of epistemic injustice as variance, bias, or unexplained loss.

  **What Had to Be Fudged:**
  The *cause* of the error required distortion. In Fricker's framework, "prejudice" implies a moral culpability or a vicious habit of the listener. In your framework, "bias" is a statistical dependency to be regularized. You can optimize away the correlation, but you cannot optimize away the "vice." Similarly, "shared resources" implies a social negotiation of meaning; "training distribution" implies a static dataset. The ML view treats the gap as a technical debt; Fricker treats it as a structural exclusion.

  **The Untranslatable Residue:**
  The core of Fricker's claim is that the victim is **wronged specifically as a knower**.
  *   **In ML:** A miscalibrated weight is a "bad prediction." It increases the loss function. It is an efficiency problem.
  *   **In Fricker:** A credibility deficit is a "dignitary harm." It violates the subject's status as a rational agent. It is an ethical problem.

  Your framework has no variable for **dignity** or **epistemic agency**. You can measure that Group A has higher loss than Group B (disparate impact), but you cannot measure that Group A has been *insulted* by the system. The ML framework sees a suboptimal fit; Fricker sees a violation of rights. The concept of "injustice" does more work than the gloss of "bias" lets on: it demands a normative judgment about the status of the human behind the data point, which your loss function explicitly ignores to achieve convergence.

