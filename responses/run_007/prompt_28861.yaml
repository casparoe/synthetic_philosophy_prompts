      *   If we centralize, Council picks winners.
      *   Hayek says: Decentralize (Clubs know value of trip).
      *   Treasurer feels: That's unfair to poor clubs.
      *   *Decision:* This highlights the Values Call perfectly.

      *Wait, the prompt asks for a case where the procedure gives an answer I'm not going to like.*
      *   Okay, let's try: **Mandatory Uniforms for Event Staff.**
      *   Centralize: Council buys 50 black shirts. Looks pro.
      *   Decentralize: Volunteers wear what they want.
      *   Hayek: Decentralize (Students have shirts, no info needed).
      *   Treasurer: But it looks messy!
      *   *Better:* **Club "Morale" Grants.**
      *   Procedure says: Decentralize (Clubs know what boosts morale).
      *   Treasurer: But they'll just buy pizza. It feels like waste.
      *   This works. It hits the "Waste" anxiety the user mentioned.

  7.  **Final Review against Constraints:**
      *   Plain English? Yes.
      *   Order of questions? Yes.
      *   Stop rule for values? Yes.
      *   Three cases? Yes.
