  6.  **Refining the Logical Example:**
      *   Tarski's hierarchy of languages is the classic "bottoming out" move.
      *   Paraconsistent logic is the "accept the loop" move.

  7.  **Final Polish:**
      *   Ensure tone is conversational but rigorous.
      *   Check that all parts of the prompt are answered.
      *   *Self-Correction on "Same Structure":* Be careful not to say they are *identical*. They are *isomorphic* in structure but *heteromorphic* in function.

  8.  **Final Output Structure:**
