answer: |-
  This is a profound question that strikes at the heart of the tension between naturalistic explanation and interpretive understanding in the human sciences. As a retired evolutionary biologist, you are well-positioned to see the elegance of the signaling model, yet your engagement with philosophy and anthropology has rightly sensitized you to the category errors that occur when biological frameworks are projected onto institutional facts.

  The potlatch is indeed the "fruit fly" of this theoretical conflict. To analyze the mapping itself, we must look at the ontology of "cost," the unit of selection, and the nature of rationality implied by each framework.

  Here is a philosophical analysis of the friction between Costly Signaling Theory (CST) and the anthropological account of the potlatch.

  ### I. What CST Illuminates and What It Flattens

  **The Illumination: The Stability of Waste**
  The primary explanatory power CST brings to the potlatch is an answer to the question of *stability*. A purely historical or cultural account might describe *how* the potlatch works (the rules, the ranks, the rituals), but it sometimes struggles to explain why such a seemingly maladaptive behavior persists without being invaded by "cheaters."

  If status can be claimed without cost, everyone will claim it, and the signal loses value. CST illuminates the *structural necessity of the waste*. It explains why the destruction of blankets or copper is not merely symbolic but functional: the irreversibility of the cost creates the reliability of the claim. It cuts through the participants' own explanations (which may involve spirits or ancestors) to identify the homeostatic mechanism that keeps the hierarchy stable. It reveals the potlatch not just as a ceremony, but as an equilibrium strategy that prevents the collapse of the status system through cheap talk.

  **The Flattening: The Ontology of "Cost"**
  However, this illumination comes at the price of ontological flattening. In behavioral ecology, "cost" is typically metabolic or mortality-related (energy expended, predation risk increased). It is a "brute fact" in John Searle's terminology.

  In the potlatch, the cost is an *institutional fact*. Destroying a blanket is only costly because there is a shared normative agreement that blankets represent stored labor and social credit. If the normative order collapses (as it did under colonial suppression), the destruction of blankets becomes mere incineration of wool, devoid of signaling value.
  *   **CST Assumption:** Cost is intrinsic to the act (energy out).
  *   **Anthropological Reality:** Cost is extrinsic, assigned by the normative system (status risk).

  By treating the cost as a biological handicap, CST risks missing that the "handicap" is constituted by the very social network it is supposed to signal into. The signal does not just travel *through* the medium of culture; the cost is *created* by the medium.

  **Handicap vs. Social Investment**
  You asked if CST has the resources to distinguish between a cost incurred as a handicap (screening) and a cost incurred as a social investment (transforming the game).
  *   **Strict CST:** Struggles here. In the Zahavian framework, the cost is a "sink." It is paid to prove quality *ex ante*. The benefit is the immediate reception of the signal (mating opportunity, deterrence).
  *   **The Potlatch Reality:** The cost is a "seed." It is paid to create a debt *ex post*. The benefit is the future reciprocation and the reinforcement of the lineage's position over generations.

  To model the potlatch accurately, CST must mutate into **Iterated Game Theory** or **Indirect Reciprocity** models. In these models, the cost is not just a filter for quality; it is a move that alters the payoff matrix for future interactions. However, even this expansion often treats the "obligation" to reciprocate as a strategic constraint rather than a normative constitutive rule. CST views the recipient's obligation as a calculated best response; anthropology views it as a moral necessity that defines the recipient's personhood. CST can model the *behavior* of reciprocity, but it lacks the vocabulary to describe the *binding nature* of the obligation.

  ### II. What the Potlatch Reveals About the Limits of CST

  If we reverse the lens and use the potlatch to test the boundaries of CST, three major philosophical limitations emerge regarding individualism, utility, and transmission.

  **1. Methodological Individualism vs. The Corporate Lineage**
  CST is fundamentally methodologically individualist. The "signaler" is an organism maximizing its inclusive fitness.
  The potlatch challenges this because the "signaler" is often a **corporate group** (the lineage or house). A chief hosts the potlatch, but he is acting as a node for ancestors and descendants. The "fitness" being maximized is not necessarily the chief's reproductive output, but the persistence of a *name* or *title* across generations.
  *   **The Limit:** CST assumes the unit of signaling is the biological body. The potlatch reveals that in human cultural evolution, the unit of signaling can be a juridical person (the Lineage) that outlives the biological bodies comprising it. CST must be significantly modified to handle "group-level signaling" where the "individual" is a trans-generational legal entity.

  **2. Utility Maximization vs. Normative Constitution**
  In CST, agents are utility maximizers. They follow norms because deviating is too costly.
  In the anthropological view (following Mauss or Winch), agents are **normatively constituted**. They do not hold potlatches because they calculated it maximizes utility; they hold them because to *be* a chief *is* to hold potlatches. The action is not a means to an end; it is a performance of an identity.
  *   **The Limit:** CST treats norms as external constraints on rational choice (like gravity). Anthropology treats norms as internal constitutive rules (like the rules of chess). You cannot "optimize" your way out of the rules of chess and still be playing chess. Similarly, a chief who calculates that skipping a potlatch saves resources has ceased to be a chief. CST struggles to model behaviors where the "utility" is the maintenance of the normative system itself, rather than a resource extracted from it.

  **3. Genetic vs. Cultural Transmission**
  CST originates in genetic evolution, where transmission is vertical and slow. The "honesty" of the signal is guaranteed by the genetic correlation between the signal and the quality.
  The potlatch operates in **Cultural Evolution**, where transmission is oblique, horizontal, and Lamarckian. Titles and rights are transmitted via recognition, not genes.
  *   **The Limit:** In biological CST, a "fake" signal is usually physiologically impossible (a weak gazelle cannot stot). In the potlatch, a "fake" signal is socially impossible *only as long as the audience agrees*. A chief could theoretically borrow wealth to host a potlatch (which did happen). The "honesty" is not guaranteed by physiological handicap but by the threat of social sanction and the collapse of future credit. This shifts the mechanism from *biological constraint* to *institutional enforcement*. CST, in its standard form, does not easily distinguish between a signal that is hard to fake because of physics (antlers) and one that is hard to fake because of law (titles).

  ### III. The Difficulty of the Mapping: Institutional Facts and Time

  The core philosophical difficulty in mapping CST onto the potlatch is the mismatch in **temporality** and **facthood**.

  **The Problem of Time**
  CST is often synchronic or short-term diachronic (signaling now for reward soon). The potlatch is deeply diachronic. A potlatch given today validates a claim based on an ancestor's action fifty years ago and secures a reciprocal obligation due fifty years hence.
  *   **Analysis:** CST views the cost as a *sunk cost* validating current quality. The anthropological view sees the cost as a *link in a chain*. If you view the potlatch merely as a handicap, you miss its function as a mechanism of intergenerational memory and contract enforcement. The "waste" is actually a capitalization of social debt.

  **The Problem of Facthood**
  This returns to Searle's distinction.
  *   **Brute Facts:** Weight, caloric value, energy expenditure. (CST's domain).
  *   **Institutional Facts:** Value, rank, debt, title. (Anthropology's domain).
  The potlatch converts Brute Facts (blankets) into Institutional Facts (status). CST tends to reduce the Institutional back down to the Brute (status is just a proxy for resource holding potential).
  *   **The Mapping Error:** By reducing the Institutional to the Brute, CST explains the *persistence* of the behavior but loses the *meaning* of the behavior. It explains why the potlatch *survives*, but not what the potlatch *is*. It is the difference between explaining a marriage ceremony by analyzing the caloric expenditure of the wedding feast (CST) versus analyzing the change in kinship rights (Anthropology). Both are true, but they are truths at different levels of description.

  ### Conclusion: Complementary or Incommensurable?

  Does the potlatch falsify Costly Signaling Theory? No. But it exposes CST as a **subset** of a broader theory of social action, rather than the foundation of it.

  1.  **CST is necessary but not sufficient.** It explains the *mechanism of stability* (why cheating doesn't destroy the system). Without the cost, the signal fails.
  2.  **Anthropology is necessary but not sufficient.** It explains the *content and direction* of the signal (why this cost, for this title, in this direction). Without the norms, the cost is meaningless.

  The philosophical lesson is that human social behavior operates on **dual ontologies**. We are biological organisms subject to handicap principles, *and* we are normative agents subject to institutional rules.
  *   When CST treats the potlatch as a handicap, it correctly identifies that **reliability requires cost.**
  *   When it fails to distinguish that cost as **social investment**, it misses that the cost is not just screening the signaler, but **building the receiver's capacity to respond.**

  The potlatch reveals that in human societies, the "environment" to which we adapt is not just the physical world, but the normative world we construct. CST works best when the environment is fixed. In the potlatch, the signaling *changes* the environment (the network of obligations). Therefore, a static signaling model is insufficient. We require a **dynamic systems model** where the signal alters the payoff structure for future signals.

  For a philosopher of biology, the potlatch suggests that evolutionary explanations of human behavior must be **pluralistic**. We cannot simply "reduce" the normative to the biological. Instead, we must understand how biological capacities for signaling are co-opted by cultural systems to create institutional realities that then exert their own selective pressures. The cost is real, but it is a social cost, enforced by history and normativity, not just by metabolism and mortality.
