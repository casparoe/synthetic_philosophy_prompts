      *   *Refining the "Investment vs. Handicap" distinction:* This needs careful handling. In CST, an investment is usually a cost paid *now* for benefit *later*. A handicap is a cost paid *now* to prove quality *now*. The Potlatch is both. It proves quality *and* creates future obligation. CST can model the first part well, but the second part requires game theory (Iterated Prisoner's Dilemma) more than pure signaling theory. The philosophical point is that CST often conflates *signaling* with *strategic interaction*.

