prompt: |-
  I retired from a career in evolutionary biology a few years ago and have been spending my time reading philosophy — philosophy of biology, certainly, but also philosophy of social science and anthropology. A question has been nagging at me, and I would value a careful analysis.

  The potlatch ceremonies of the Indigenous peoples of the Pacific Northwest — the Kwakwaka'wakw, Haida, Tlingit, and others — are a standard case study in behavioral ecology. Chiefs would host feasts at which they gave away or destroyed staggering quantities of wealth: blankets, copper shields, canoes, and in earlier periods, slaves. The scale of the destruction and gifting validated claims to hereditary titles, ranked status, and territorial rights. The conventional evolutionary analysis, drawing on Zahavi's handicap principle, treats the potlatch as costly signaling: the wastefulness guarantees honesty, because only a chief with genuine resources and social support could absorb the cost, so the display reliably advertises the underlying quality it signals.

  But the more I read the anthropological literature, the more I suspect this mapping is too quick. The potlatch was embedded in a normative order — a system of ranked lineages, ancestral privileges, and reciprocal obligations that spanned generations. A chief who gave a potlatch was not merely advertising his individual quality; he was discharging duties to his ancestors, validating the standing of his lineage, and placing recipients under obligation to reciprocate at an even greater scale in the future. The cost was not simply a handicap that screened out low-quality signalers; it was a social investment that restructured the network of obligations within which all future signaling would take place.

  I would like a philosophical analysis — not an empirical verdict on whether the potlatch really was costly signaling — that works in both directions. First, what does costly signaling theory illuminate about the potlatch that a purely cultural or historical account might miss, and what does it distort or flatten when applied to a practice so thoroughly shaped by norms, kinship, and intergenerational obligation? In particular, does the theory have the resources to distinguish between a cost incurred as a handicap (which merely screens) and a cost incurred as a social investment (which transforms the game)? Second, what does the potlatch, as a case, reveal about the scope and limits of costly signaling as a framework for human social behavior? Does it expose assumptions about individualism, utility-maximization, or the genetic transmission of traits that do not travel well once culture and history enter the picture? I am less interested in whether the theory is right or wrong than in what the attempt to map it onto a rich ethnographic case teaches us about the theory, the case, and the difficulties of the mapping itself.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**

      *   **User Profile:** Retired evolutionary biologist, now reading philosophy (biology, social science, anthropology). This means I can use technical terminology (handicap principle, signaling theory, fitness) but need to pivot towards philosophical conceptual analysis rather than empirical data gathering.
      *   **Topic:** The Potlatch (Pacific Northwest Indigenous peoples) viewed through the lens of Costly Signaling Theory (CST) vs. Anthropological/Normative accounts.
      *   **Core Tension:** CST sees potlatch as "wasteful" honest signaling (Zahavi). Anthropology sees it as normative, reciprocal, lineage-validating, and transformative of social networks.
      *   **Task:** A philosophical analysis working in two directions:
          1.  *CST $\rightarrow$ Potlatch:* What does CST illuminate? What does it distort/flatten? Can CST distinguish between "handicap cost" and "social investment cost"?
          2.  *Potlatch $\rightarrow$ CST:* What does this case reveal about the scope/limits of CST for human behavior? Does it expose assumptions about individualism, utility, genetic transmission vs. cultural transmission?
      *   **Goal:** Not an empirical verdict, but an examination of the *mapping* itself (theory-ladenness, reductionism, explanatory scope).

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *Costly Signaling Theory (CST):* Rooted in biology (peacocks, gazelles). Key concept: Cost ensures honesty. If it's cheap, liars can do it. If it's expensive, only the "high quality" individual can afford it. Focus: Individual fitness, reliability of information.
      *   *Potlatch (Anthropological View):* Mauss (*The Gift*). Not just exchange, but total social fact. Kinship, law, religion, economics merged. Time horizon: Generational. Goal: Status *within* a structure, not just individual dominance. Reciprocity is mandatory, not optional.
      *   *The Clash:* Biology tends to be ahistorical and individualistic. Anthropology is historical, structural, and relational.
      *   *Key Philosophical Issues:* Reductionism, Functionalism, Agency, The nature of "Cost" (biological vs. social), Time scales (immediate fitness vs. intergenerational stability).

  3.  **Drafting Section 1: What CST Illuminates vs. Distorts (CST $\rightarrow$ Potlatch)**

      *   *Illumination:* It explains the *persistence* of seemingly irrational waste. Why destroy wealth? CST says: To prove you have so much you can afford to lose it. It cuts through the "native's point of view" to find the underlying functional logic. It highlights the *risk* involved.
      *   *Distortion:* It treats wealth as biological resource (calories/energy) rather than social currency. It assumes the goal is *individual* status/fitness, whereas potlatch is about *lineage* continuity.
      *   *The "Handicap vs. Investment" Problem:* This is crucial.
          *   Handicap: Cost is sunk. Burnt resources. Signal ends there.
          *   Investment: Cost creates debt. Signal creates a *relationship*.
          *   Can CST handle this? Standard CST struggles with *reciprocity* that isn't immediate. However, "Indirect Reciprocity" or "Reputation Models" might bridge this. But does CST capture the *normative obligation*? CST sees obligation as a constraint on strategy; Anthropology sees obligation as constitutive of the self.
      *   *Philosophical Point:* CST risks category errors. It treats social debt like metabolic debt.

  4.  **Drafting Section 2: What Potlatch Reveals about CST (Potlatch $\rightarrow$ CST)**

      *   *Individualism:* CST is methodologically individualist. Potlatch is holistically relational. The "signaler" is often a lineage, not a body.
      *   *Utility:* In CST, utility = fitness (or proxies). In Potlatch, utility = social cohesion, cosmic order, ancestral satisfaction. "Rationality" looks different.
      *   *Transmission:* CST assumes genetic evolution (slow). Potlatch is cultural evolution (fast, Lamarckian). The "traits" being signaled are titles/rights, not genes.
      *   *The Nature of Cost:* In biology, cost is energy/risk of death. In potlatch, cost is social (losing face if you can't reciprocate later). The "cost" is only real within the normative system. If the system collapses, the blankets are just wool.
      *   *Scope Limits:* CST works best for dyadic, ahistorical interactions. It struggles with institutional facts (Searle's term).

  5.  **Synthesizing and Refining the Argument:**

      *   *Tone:* Respectful, rigorous, philosophical. Acknowledge the user's background.
