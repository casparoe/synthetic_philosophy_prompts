      *   *Ensure:* I address the "normative" aspect. Norms aren't just constraints in anthropology; they are the medium of action. In CST, norms are often treated as equilibrium strategies.
      *   *Check:* Did I answer the specific question about distinguishing handicap cost vs. social investment cost? I need to make sure I explicitly discuss whether CST *has the resources* to do this. (Answer: Only if expanded into cultural evolutionary theory, but pure behavioral ecology struggles).

  7.  **Final Polish:** Check the flow. Ensure the transition between the biological perspective and the philosophical/anthropological perspective is smooth. (The user is a biologist, so I don't need to explain Zahavi, but I do need to explain the philosophical implications of Zahavi).

      *(Self-Correction during drafting)*: I should be careful not to set up a strawman of CST. Modern evolutionary anthropology *does* incorporate culture. I should distinguish between "Human Behavioral Ecology" (HBE) which is more adaptationist, and "Dual Inheritance Theory." The prompt mentions "behavioral ecology" specifically, so I will focus on the HBE version of CST as the primary target of critique, while acknowledging broader evolutionary frameworks.

      *(Refining the "Cost" argument)*: The core philosophical distinction is between *ontological* cost (energy, matter) and *institutional* cost (status, obligation). CST sees the former; Anthropology sees the latter. The Potlatch shows they are entangled.

