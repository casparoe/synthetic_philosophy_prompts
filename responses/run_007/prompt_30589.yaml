prompt: |-
  Below is a passage from Karl Marx's The Poverty of Philosophy (1847):

  "M. Proudhon the economist understands very well that men make cloth, linen, or silk materials in definite relations of production. But what he has not understood is that these definite social relations are just as much produced by men as linen, flax, etc. Social relations are closely bound up with productive forces. In acquiring new productive forces men change their mode of production; and in changing their mode of production, in changing the way of earning their living, they change all their social relations. The hand-mill gives you society with the feudal lord; the steam-mill society with the industrial capitalist."

  I am trying to get clear about exactly what this passage asserts about the relation between technology and social organization. Please help me work through it closely. First, explain what Marx means here by "productive forces," "mode of production," and "social relations," and how the passage takes them to be connected. Second, unpack the aphorism about the hand-mill and the steam-mill: is it best read as the claim that technology causally determines the form of society, as the claim that a given technology rules certain social arrangements in or out, or as something else? Third, address whether this passage commits Marx to technological determinism, and say what would have to be shown for that label to be warranted or unwarranted. Finally, consider whether the passage implies that an artifact such as a mill itself has a politics — that it favors or demands a particular social order — or whether its political significance depends entirely on the social relations in which it is used. Stay close to the text, and distinguish what the passage explicitly says from what interpreters have read into it.
