  7.  **Final Polish:** Ensure the structure matches the prompt exactly (1-5 with a/b/c, then Residue Report). Ensure the "Residue Report" answers the specific question about hidden normative work. (Self-correction: Make sure to explicitly mention Ultrafilters in the context of Paralysis/Average, as that's a key mathematical tool for these problems).

  8.  *(Final thought before generating)*: The prompt asks me to *be* the philosopher fluent in math. I need to sound like someone who sees the isomorphism but respects the kernel of the homomorphism that gets lost.

