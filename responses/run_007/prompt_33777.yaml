answer: |-
  This is one of the most famous and contentious knots in welfare economics and climate ethics. You are absolutely right to feel tangled up; the literature often conflates descriptive psychology, normative ethics, and mathematical accounting in ways that make this very hard to parse.

  Let's untangle this by breaking it down into the four specific confusions you identified.

  ### 1. The Math: Why isn't the discount rate zero if pure time preference is zero?

  This is the most common technical stumbling block. You are looking at the **Ramsey Rule**, which defines the social discount rate ($r$) as:

  $$r = \rho + \eta \cdot g$$

  Where:
  *   **$\rho$ (rho):** The **Pure Rate of Time Preference**. This is pure impatience. It values utility today over utility tomorrow simply because it is today.
  *   **$\eta$ (eta):** The **Elasticity of Marginal Utility**. This measures how much the value of an extra dollar drops as you get richer (diminishing marginal utility). It also reflects aversion to inequality.
  *   **$g$:** The **Growth Rate** of per capita consumption.

  **The Clarification:**
  Ramsey (and later philosophers like Sidgwick and Pigou) argued that $\rho$ should be **zero** for intergenerational justice. Discriminating against future people simply because they are born later is ethically indefensible (like discriminating based on distance).

  **However, setting $\rho = 0$ does not make $r = 0$.**

  Why? Because of the second term: $\eta \cdot g$.
  If we expect future generations to be richer than us ($g > 0$), and if money has diminishing marginal utility ($\eta > 0$), then an extra dollar is worth *less* to a rich future person than to a poorer current person.

  Therefore, we discount future **consumption** not because we are impatient ($\rho$), but because we expect future people to be wealthier. We would rather give \$100 to a poor person today than to a rich person in 100 years. That is an efficiency/equity argument, not an impatience argument.

  **So, to answer your question:** No, they aren't sneaking impatience back in through $\eta$. They are accounting for the fact that if the economy grows, future utility is "cheaper" to buy. If you want $r$ to be truly zero, you need $\rho=0$ **AND** either zero growth ($g=0$) or no diminishing marginal utility ($\eta=0$).

  ### 2. Pure Time Preference vs. Existence Risk

  You asked: *"Does [pure time preference] include the probability that future generations won't exist?"*

  **Technically, no.** In the standard Ramsey framework, $\rho$ is about valuing a life less *conditional on it existing*.

  However, in practice, many economists argue there is a legitimate reason to discount the future: **Catastrophic Risk / Extinction Probability.**
  If there is a 1% chance per year that humanity goes extinct, then expected utility in 100 years is mathematically lower, not because we don't care about those people, but because they might not be there.

  *   **Ethical View:** Some argue this should be treated as a separate "hazard rate" added to the discount rate, distinct from $\rho$.
  *   **The Trap:** If you bundle extinction risk into $\rho$, you risk double-counting or ethically justifying impatience as "prudence."
  *   **The Stern Review:** Stern kept $\rho$ near zero (0.1%) but acknowledged extinction risk separately. Critics (like Nordhaus) argued Stern's discount rate was too low because it didn't adequately account for the risk that the money we spend today might be wasted if society collapses anyway.

  ### 3. Descriptive vs. Normative (The Paternalism Charge)

  You asked: *"People do discount their own future utility... Isn't it paternalistic for economists to say that's a mistake?"*

  This is the clash between **Positive Economics** (how people *do* behave) and **Normative Economics** (how a social planner *should* weigh interests).

  *   **Individual Discounting:** When *you* discount your own future, it is rational for biological reasons. You might die tomorrow. You have uncertainty about your future preferences. You have a finite horizon.
  *   **Social Discounting:** The "State" or "Society" is (in theory) immortal. It represents a chain of generations. If the government uses your personal impatience to decide on climate policy, it is effectively letting the current generation vote on the welfare of future generations who cannot vote.

  **Is it paternalistic?**
  Most philosophers of intergenerational justice say **no**. It is not paternalistic to say that the current generation does not have the moral right to impose high costs on future generations simply because the current generation is impatient.

  Think of it this way: If I borrow money on a credit card that *my grandchildren* have to pay off, my personal impatience is not a valid ethical justification for burdening them. The social discount rate is meant to reflect the ethical weight of their welfare, not my psychological urge for immediate gratification.

  ### 4. Individual Impatience vs. Social Discounting

  You noted: *"Readings seem to go back and forth between talking about individual impatience and social discounting as if they're the same thing."*

  This is the source of much bad literature.
  *   **The "Revealed Preference" Argument:** Economists like Nordhaus argue we should look at market interest rates to determine the social discount rate. If people demand 5% return on investments, society's discount rate is 5%. This conflates individual impatience + risk + market imperfections with social ethics.
  *   **The "Prescriptive" Argument:** Philosophers and economists like Stern argue that market rates reflect the biases of currently living people. For long-term issues (climate change, nuclear waste), we must use an ethical discount rate ($\rho \approx 0$), regardless of what the bond market says.

  **Why the conflation?**
  In short-term cost-benefit analysis (building a bridge), individual and social time horizons align. In intergenerational analysis (climate change), they diverge completely. When textbooks use the same Ramsey formula for both without distinguishing the parameters, it creates the confusion you are experiencing.

  ### Summary Checklist to Untangle Yourself

  1.  **$\rho = 0$ does not mean $r = 0$.** The discount rate ($r$) stays positive if the economy grows ($g$), because future people will be richer ($\eta \cdot g$).
  2.  **$\eta$ is not impatience.** It is inequality aversion. It says "a dollar helps a poor person more than a rich person."
  3.  **Existence risk is real,** but it is conceptually distinct from pure time preference. Discounting because they might not exist is different from discounting because they are in the future.
  4.  **Individual impatience $\neq$ Social Ethics.** Just because humans are biologically impatient doesn't mean society *ought* to value future lives less. Using market rates for century-long problems is often considered an ethical failure in this specific field.
  5.  **Stern vs. Nordhaus:** This is the real-world application of your confusion. Stern said $\rho \approx 0$ (ethical approach); Nordhaus said $\rho > 0$ (market/descriptive approach). The difference determines whether we spend trillions now or later to fix climate change.

  You aren't misunderstanding the concepts; you are noticing that the field hasn't agreed on whether discounting is a mathematical necessity, a psychological fact, or an ethical choice. In intergenerational justice, the consensus leans heavily toward treating it as an **ethical choice**, which is why Ramsey's argument against pure time preference holds so much weight there, even if it's ignored in corporate finance.
