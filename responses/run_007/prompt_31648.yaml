answer: |-
  The alarm on the *Orpheus* station wasn't a siren; it was a rhythmic, digital thrumming that vibrated in the teeth. It meant the structural integrity of the magnetic containment field was slipping.

  Elias sat in the command chair, his hands hovering over the console. The screen displayed the power distribution map in stark amber and red. A cascade failure in the main regulator meant they had enough energy to sustain life support in one sector for the next four hours, until the rescue shuttle arrived.

  They did not have enough for both.

  Sector 4 held Kael. He was the lone technician down in the engine well, fixing the very conduit that had blown.
  Habitat Ring B held five people. The science team. Elias knew their names, but he knew Kael's better. Kael had played poker with him last night. Kael had a daughter in Vancouver.

  The computer had already flashed its recommendation in bold white text: *OPTIMIZE SURVIVAL PROBABILITY. DIVERT POWER TO HABITAT RING B.*

  Five lives. One life. The math was a closed loop. It was the kind of equation you solved in secondary school ethics modules before you went out for drinks and forgot about it. But Elias wasn't in a classroom. He was in a tin can orbiting Jupiter, and the thrumming was getting faster.

  He opened the comms channel to Sector 4.

  "Kael," Elias said. His voice sounded thin, stripped of the authority he usually wore like a uniform.

  "Commander?" Kael's voice came through with a layer of static. He sounded calm. Too calm. "I'm seeing the power dips down here. Life support is cycling."

  "We have a regulator failure, Kael. The main bus can't hold the load for the whole station."

  There was a pause. In that silence, Elias knew Kael was doing the same math. "How many in the Ring?"

  "Five."

  "Okay." Kael exhaled. It wasn't a sigh of resignation; it was the sound of a man checking a box. "So you cut Sector 4. You keep the Ring."

  Elias's finger hovered over the confirmation key. This was the moment his friend down the pub had argued was obvious. *You save the five, Elias. It's not even a question. If you don't, you're letting five die to save one. That's murder by omission.*

  But Elias couldn't press the key.

  He looked at the bio-readout for Kael. Heart rate steady. Respiration normal. A human being, currently alive, currently breathing air that Elias was about to turn off.

  If he pressed the key, he was acting on a principle: *When forced to choose, minimize the total number of deaths.*

  Elias tried to imagine saying that to Kael. Not as a command, but as a justification. *Kael, I am killing you because five other people will live.*

  Would Kael have to accept that?

  In the pub, his mate had said yes. Obviously. The greater good. But looking at Kael's face on the monitor—tired eyes, grease on his forehead—Elias felt the hollowness of the sum. To Kael, the five lives in the Ring didn't add up to more than his one. They added up to *other people*.

  If Elias cut the power, Kael didn't lose a portion of his future. He lost the whole thing. The five in the Ring would gain the whole of theirs. But could Elias stand in front of Kael's daughter in Vancouver and tell her that her father's life was the currency used to balance the equation? Could he look Kael in the eye and say, *You have no grounds to object to this*?

  "Commander?" Kael prompted. The static crackled. "You still there?"

  "I'm here."

  "Are you waiting for me to say it's okay?" Kael asked.

  Elias swallowed. "I need to know that you understand the necessity."

  "I understand the math, Elias. Five is bigger than one. I get it." Kael shifted in his seat; the camera jiggled. "But that's your reason. Not mine."

  Elias frowned. "What do you mean?"

  "I mean, if I'm the one dying, why should I care about the sum?" Kael's voice hardened, just a fraction. "If you do this, you're saying my life is worth less because there are more of them. But from where I'm sitting, there's just me. And there's you. And you're choosing them."

  Elias's finger trembled. This was the knot. The aggregation said the choice was clear. The individual claim said the choice was an violence.

  If he saved Kael, he could justify it to Kael. *I did not sacrifice you.* But how would he justify it to the five in the Ring? *I let you die because I couldn't bear the weight of killing one man?* That was a justification about Elias's conscience, not about their right to live.

  If he saved the five, he could justify it to the group. *I saved the majority.* But to Kael? There was no principle Kael could reasonably accept that said *You should die so they can live.* Kael could reject that principle. He could say, *My claim to life is as strong as any of theirs. Why does their number outweigh my singularity?*

  "Kael," Elias said. "If I don't divert power, the containment field fails. The station breaks up. Everyone dies."

  "Then don't make it about the numbers," Kael said. "Make it about the choice. You're choosing to turn off my air. Don't hide behind the five."

  The thrumming alarm jumped a octave. Warning lights shifted from amber to red. *TIME TO CRITICAL FAILURE: 90 SECONDS.*

  Elias felt sweat prickle under his arms. He wanted to tell Kael that this was the only rational way. He wanted to say that any reasonable person would agree to the rule of saving the many. But he knew that if he were Kael, trapped in the dark while the lights stayed on upstairs, he wouldn't think it was reasonable. He would think it was a betrayal.

  And yet, if he didn't do it, five families would get a call instead of one.

  "Kael," Elias started, then stopped. He couldn't find the words. There was no sentence that could bridge the gap between *five* and *one* without erasing Kael's personhood.

  "Commander," Kael said softly. "The air is getting thin. You need to decide."

  Elias looked at the key. It was unmarked, just a haptic sensor.

  He thought about the Scanlonian ideal—that morality is about finding rules no one could reasonably reject. But here, someone *had* to be rejected. Someone had to be told that their claim was void.

  If he pressed the key, he was asserting that the aggregate claim of the five overrode the individual claim of the one. Kael would reject that.
  If he didn't press the key, the five would reject him.

  There was no principle here that was safe. There was only blood.

  "Kael," Elias whispered. "I'm sorry."

  "For the math?"

  "For the reason."

  Kael didn't answer. The line was open, but the silence was heavy, filled with the sound of the ventilation slowing down in Sector 4.

  Elias closed his eyes. He could hear his mate's voice from the pub, loud and certain. *It's obvious, mate. Five beats one. Don't be a hero.*

  But heroes didn't have to explain it to the victim.

  Elias opened his eyes. The red light pulsed against his retina. *30 SECONDS.*

  He moved his hand. He didn't press the key yet. He just rested his finger on the sensor, feeling the warmth of the console, feeling the hum of the station that was about to choose who belonged to the future and who belonged to the past.

  "Kael?" Elias said.

  No answer. The comms in Sector 4 were already cycling down to save power.

  Elias sat in the silence, his finger pressing down, not quite engaging the switch, hovering in the millimeter of space between the justification and the act. The alarm screamed. The five in the Ring were sleeping, unaware. The one in Sector 4 was waiting for the dark.

  Elias knew that whatever he did next, he would never be able to explain it in a way that made it right. He just had to make it done.

  He took a breath, and the air tasted like copper.
