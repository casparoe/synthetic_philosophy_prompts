      *   **Settled vs. Contested:**
          *   *Settled:* Williams argues utilitarianism alienates agents from their ground projects via negative responsibility.
          *   *Contested:* Whether this refutes utilitarianism (utilitarians have replies), whether Williams offers an alternative theory (he doesn't really), and the exact scope of the "one thought too many" (does it kill *all* impartiality?).

  5.  **Drafting the Response (Iterative Process):**

