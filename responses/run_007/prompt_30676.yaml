  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Methodological Individualism vs. Methodological Holism in Social Explanation
  **Parties:** Proponent of Methodological Individualism (PMI) | Proponent of Methodological Holism (PMH)

  ## I. AGREED CLAIMS
  The undersigned parties affirm the following propositions as the common ground for further inquiry. These claims are intended to delimit the scope of disagreement and prevent talk-past-one-another regarding metaphysical and methodological distinctions.

  1.  **Supervenience of the Social:** All social facts (including institutional facts, normative statuses, and aggregate outcomes) supervene on the totality of facts about individual human beings, their physical properties, their psychological states, their actions, and their physical environments. There can be no difference in the social world without some difference in the underlying configuration of individuals and their physical setting.
  2.  **Distinction Between Ontology and Explanation:** Acceptance of Claim 1 (Ontological Supervenience) does not logically entail that satisfactory *explanations* of social phenomena must be formulated exclusively in the vocabulary of individual psychology and action. Ontological dependence is distinct from explanatory reduction.
  3.  **Definition of Explanatory Reduction:** A social explanation is deemed "reducible" to the individual level if and only if: (a) the social-level generalization can be derived from premises describing only individual agents and their interactions; and (b) the derived explanation preserves the counterfactual robustness and predictive accuracy of the original social-level explanation without requiring *ad hoc* auxiliary assumptions for every new case.
  4.  **Indispensability of Social Vocabulary:** Both parties acknowledge that current social scientific practice relies heavily on structural, institutional, and normative vocabulary (e.g., "inflation," "patriarchy," "bureaucracy"). The dispute is not whether this vocabulary is heuristically useful, but whether it is eliminable in principle or indispensable in practice for genuine understanding.
  5.  **Causal Efficacy:** Both parties agree that social structures must have causal efficacy to be explanatorily relevant. The dispute concerns the *locus* of that efficacy (whether it resides in the structure itself or is mediated entirely through individual dispositions).

  ## II. DISAGREEMENTS TABLE
  The following table enumerates residual disagreements. Where a disagreement is identified as merely verbal, the substantive issue remaining after clarification is specified.

  | # | Disagreement Statement | PMI Position | PMH Position | Status (Substantive/Verbal) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Requirement of Microfoundations**<br>Is the provision of individual-level mechanisms a constitutive condition for a valid social explanation? | **Yes.** An explanation lacking a specification of the individual-level mechanisms is incomplete or merely descriptive, regardless of predictive success. | **No.** Structural explanations can be complete if they identify stable causal relations between social variables, even if the individual-level mediation is unspecified or heterogeneous. | **Substantive.** Dispute over the criteria for explanatory completeness. |
  | **2** | **Explanatory Autonomy**<br>Do social-level explanations offer insights that are *in principle* inaccessible to individual-level narratives? | **No.** Structural insights are pragmatic compressions. Any structural explanation can, in principle, be unpacked into an individual-level narrative without loss of content. | **Yes.** Structural explanations capture relational properties and constraints that are obscured or lost when decomposed into individual attributes. | **Substantive.** Dispute over information loss in decomposition. |
  | **3** | **The Definition of "Individual Fact"**<br>Does the base of supervenience include only intrinsic psychological states, or can it include relationally defined states? | **Intrinsic/Relational Mix.** An individual's belief or desire counts as an individual fact even if the *content* refers to social objects, provided the state is held by the agent. | **Relational Constitution.** The identity of the agent and their capacities are constituted by social relations; therefore, the "individual base" is not independent of the "social structure." | **Partially Verbal.**<br>*Clarification:* PMI accepts that beliefs can have social content. PMH insists that the *capacity* to hold such beliefs depends on prior social initiation. <br>*Substantive Remainder:* Whether explaining the *origin* of those capacities is a prerequisite for explaining actions based on them. |
  | **4** | **Multiple Realizability**<br>Does the fact that social kinds (e.g., "revolution") can be realized by diverse individual configurations block reduction? | **No.** Multiple realizability makes reduction difficult and disjunctive, but not impossible. A disjunctive list of individual conditions is still an individual-level explanation. | **Yes.** If the realization base is indefinitely heterogeneous, the individual-level "law" is not projectable. Only the social kind supports counterfactuals. | **Substantive.** Dispute over whether disjunctive individual-level generalizations count as lawful explanations. |

  ## III. CRUXES AND PRE-REGISTRATION
  The following sub-questions are identified as load-bearing. Settlement of any single crux would require at least one party to significantly revise their position. For each crux, a concrete case or type of evidence is specified, along with the pre-registered predictions of each party.

  ### Crux 1: The Explanatory Value of Structural Constraints
  *   **Question:** Are there cases where a structural constraint explains an outcome better than the sum of individual intentions, such that the individual-level explanation is not just harder but *misleading*?
  *   **Concrete Case:** **The Prisoner's Dilemma in Institutional Settings.** Consider a scenario where two agents defect, leading to a suboptimal outcome.
      *   *PMI Prediction:* The explanation terminates in the agents' preference orderings and beliefs about the other's action. Changing the outcome requires changing individual incentives or beliefs. The "structure" is just the payoff matrix perceived by individuals.
      *   *PMH Prediction:* The explanation terminates in the institutional rules that *generated* the payoff matrix. Explaining the defection requires explaining why the agents are in a context that imposes these payoffs. The structure explains the stability of the dilemma across different populations of individuals.
  *   **Condition for Shift:** If PMI concedes that the stability of the payoff matrix cannot be explained by individual preferences alone, PMI must accept structural autonomy. If PMH concedes that the matrix is fully explicable via prior individual bargaining, PMH must accept methodological individualism.

  ### Crux 2: Multiple Realizability and Projectability
  *   **Question:** Does the heterogeneity of individual realizations of a social kind prevent the formulation of individual-level laws that support counterfactuals?
  *   **Concrete Case:** **Hyperinflation.** This social kind can be realized by diverse individual psychological states (fear, greed, confusion) and transaction types (barter, cash, digital).
      *   *PMI Prediction:* There exists a complex, disjunctive set of individual-level conditions (beliefs about currency value + opportunity to transact) that is necessary and sufficient for hyperinflation. This set supports counterfactuals (e.g., "If agents had not believed X, inflation would not have occurred").
      *   *PMH Prediction:* No stable individual-level generalization exists across cases of hyperinflation. Only the monetary theory (a structural account) supports the counterfactual ("If the central bank had not expanded the money supply, inflation would not have occurred").
  *   **Condition for Shift:** If PMI can produce a specific, non-disjunctive individual-level generalization that predicts hyperinflation across distinct historical cases, PMH must concede reducibility. If PMI admits that only the monetary aggregate predicts the outcome reliably, PMI must concede explanatory autonomy.

  ### Crux 3: The Social Constitution of the Agent
  *   **Question:** Is the "individual" an independent explanatory base, or is the individual's agency itself a product of social relations?
  *   **Concrete Case:** **Preference Formation (Adaptive Preferences).** Agents in oppressive structures often report satisfaction with their constrained options.
      *   *PMI Prediction:* Preferences are exogenous inputs to the explanation of action. While their origin may be social, the explanation of the *current action* relies only on the current preference. The origin story is separate from the action explanation.
      *   *PMH Prediction:* The preference is endogenous to the structure. Explaining the action requires explaining the structural mechanism that shaped the preference. Treating the preference as an exogenous individual fact masks the causal power of the structure.
  *   **Condition for Shift:** If PMH accepts that action explanations can bracket the *genesis* of preferences without loss of validity, PMI wins on methodological grounds. If PMI accepts that the genesis of preferences is internal to the explanation of the action (because the preference is not an independent variable), PMH wins on ontological grounds regarding the base.

  ### Crux 4: The Status of Black-Box Predictions
  *   **Question:** Is a social-scientific model that predicts accurately without specifying individual mechanisms scientifically acceptable?
  *   **Concrete Case:** **Macro-Econometric Models.** Models that use aggregate variables (interest rates, unemployment) to predict recession without modeling individual agent psychology.
      *   *PMI Prediction:* These models are instrumentally useful but scientifically incomplete. They are "black boxes" that demand opening via microfoundations to be considered explanatory.
      *   *PMH Prediction:* These models are scientifically complete insofar as they identify stable causal relations between social kinds. Demanding microfoundations is a metaphysical constraint, not a scientific one.
  *   **Condition for Shift:** If PMI accepts that predictive stability without mechanism constitutes explanation in social science (as in physics), the demand for microfoundations becomes defeasible. If PMH accepts that such models are merely descriptive until mechanisms are found, the demand for microfoundations becomes constitutive.
