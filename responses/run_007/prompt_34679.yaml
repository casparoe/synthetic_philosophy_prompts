  1. Philosophers call this the suspension of "reactive attitudes" like resentment, a concept central to P.F. Strawson's theory of moral responsibility. It describes how we shift from holding someone accountable to viewing them objectively when we see them as unfit for normal social relations.
  2. This shift occurs because new information moves the agent from the category of responsible participants to those exempt from standard demands, such as the coerced or the psychologically incapacitated. You stop seeing the act as a quality of will directed at you and start seeing it as an event caused by external pressures.
  3. Unlike forgiveness, which acknowledges blame but chooses to release it, this reaction denies the blame altogether because the action no longer counts as a genuine moral slight. It differs from a standard excuse because you aren't arguing they couldn't help it, but rather that the context removes the hostile intent required for resentment.
  4. The reverse scenario you noted is often called the "medicalization of deviance," where bad behavior is reclassified as a symptom rather than a choice. This similarly suspends moral blame but risks stripping the individual of agency by treating them purely as an object of treatment.
  5. Strawson argues this shows responsibility depends on our social practices of holding each other accountable, not on metaphysical free will. The disappearance of anger suggests that blame is rooted in interpersonal relationships rather than abstract facts about whether someone "could have done otherwise."
