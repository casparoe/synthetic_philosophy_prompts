      *   **Tone/Style:** Professional, academic, strategic.

  2.  **Determine the Strategy (Summary):**
      *   The core tension is between the *utility* of frequentist methods (which the audience values) and the *interpretation* of probability (which the speaker challenges).
      *   The line to hold: "Subjectivism about *meaning* does not entail arbitrariness in *practice*." Rationality constraints + convergence make subjective probabilities objective enough for science, while avoiding the metaphysical pitfalls of propensities and the reference class problems of frequentism.
