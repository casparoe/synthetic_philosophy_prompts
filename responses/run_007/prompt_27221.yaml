      *   **Topic:** Defending a subjectivist (Bayesian/credence) interpretation of probability against frequentist and propensity views.
      *   **Thesis:** Probability = degrees of belief of an ideally rational agent. No mind-independent chances for single cases.
      *   **Three Claims:**
          1.  Single-case probs $\neq$ frequencies (reference class) & $\neq$ propensities (unexplained values).
          2.  Dutch book/accuracy arguments $\rightarrow$ probability axioms for rational credences.
          3.  Objectivity via constraints on priors (regularity, symmetry, etc.) + convergence theorems.
      *   **Audience:**
          *   Mostly applied statisticians (frequentist training, care about coverage, error rates, calibration, reproducibility).
          *   2-3 philosophers of science.
          *   1 senior faculty member (propensity theorist).
      *   **Constraints:**
          *   Q&A ~20 mins.
