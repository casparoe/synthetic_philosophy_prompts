answer: |-
  You have put your finger on the central nerve of the contemporary debate over scientific realism. Your observation is sharp: the same historical cases (Newton, Caloric, Phlogiston) are treated as *evidence for convergence* by realists (who emphasize continuity/mathematical preservation) and as *evidence for skepticism* by anti-realists (who emphasize ontological discontinuity).

  There is no single, catchy colloquial name for this specific rhetorical flip-flop (like "The Flip-Flop Fallacy"), but in the philosophy of science, this tension is the core engine of the **Realism vs. Anti-Realism debate**, specifically centering on the **Pessimistic Meta-Induction** and the problem of **Theory Change**.

  Here is a breakdown of the names, the positions, and the attempted resolutions.

  ### 1. Naming the Tension

  While the tension itself doesn't have one proper noun, it is discussed under three specific headers:

  *   **The Pessimistic Meta-Induction (PMI):** Formulated most famously by Larry Laudan (1981). This is the argument you described that uses the "false" characterization. It argues that because past successful theories (phlogiston, caloric, ether) posited entities that do not exist, our current successful theories likely posit entities that do not exist either.
  *   **The No Miracles Argument (NMA):** This is the counter-argument that uses the "approximately true" characterization. It argues that the success of science would be a "miracle" if the theories were not at least approximately true and their terms did not refer.
  *   **The Problem of Theory Change (Continuity vs. Discontinuity):** This is the specific name for the tension you identified. It asks: *What is preserved when theories change?* If nothing is preserved, realism is untenable (Discontinuity). If the "truth" is preserved, why did we discard the ontology? (Continuity).

  So, to answer your question: It is not *just* the PMI. The PMI is the weapon used by the anti-realist. The tension you are noticing is the **dialectic conflict** between the PMI and the Realist's defense of **Approximate Truth**.

  ### 2. The "False Enough / True Enough" Resolutions

  You asked if there are positions that try to resolve this by saying old theories were "false enough for the induction to go through but true enough for realism to survive." **Yes, there are.** This is the primary occupation of modern scientific realists. They need to admit the old ontology was wrong (to respect history) while maintaining the old theory had truth-content (to save realism).

  Here are the three main strategies, their names, and their success rates.

  #### A. Structural Realism (The most prominent solution)
  *   **Proponent:** John Worrall (1989).
  *   **The Move:** This position directly addresses your Caloric and Newton examples. It argues that when theories change, the **ontology** (the nature of the stuff) is discarded, but the **mathematical structure** (the relations and equations) is preserved.
  *   **How it resolves the tension:**
      *   *To the Anti-Realist:* It admits Caloric fluid does not exist. The theory was "false" in its central posit. (PMI satisfied).
      *   *To the Realist:* It argues the *equations* of heat flow derived from Caloric theory were retained in Thermodynamics. Therefore, science converges on the *structure* of the world, even if our picture of the *furniture* changes.
  *   **Does it work?** It is widely considered the most sophisticated version of realism. However, critics argue it is unstable. If you strip away the ontology (the "stuff"), does the structure mean anything? Some argue Structural Realism collapses into **Instrumentalism** (the view that theories are just tools for prediction, not descriptions of truth).

  #### B. Selective (or Divisional) Realism
  *   **Proponents:** Stathis Psillos, Philip Kitcher.
  *   **The Move:** This strategy attempts to surgically separate the "working posits" of a past theory from the "idle wheels."
  *   **How it resolves the tension:** It argues that Phlogiston theory had some parts that were essential to its success (e.g., observations about combustion) and some parts that were gratuitous (the actual substance "phlogiston"). Realists should only commit to the essential parts.
  *   **Does it work?** The major criticism here is the **"Problem of Novelty"** or the **"Post-Hoc Problem."** Critics ask: *How do we know which parts are the "true" ones before the theory is superseded?* If we can only identify the "true parts" after we already know the future theory, Selective Realism offers no guidance for current science. It looks like a rationalization of history rather than a philosophy of science.

  #### C. The Causal Theory of Reference (Semantic Realism)
  *   **Proponents:** Hilary Putnam, Richard Boyd, Philip Kitcher.
  *   **The Move:** This attacks the claim that terms like "phlogiston" or "caloric" failed to refer. It argues that reference is determined by causal contact with the world, not by the description in the theory.
  *   **How it resolves the tension:** It argues that when Priestley talked about "phlogiston," he was causally interacting with **oxygen** (or the process of oxidation). He got the *description* wrong, but the *term* still referred to a real thing. Therefore, the theory wasn't "false" about the existence of the entity, just false about its properties.
  *   **Does it work?** This is controversial. Many historians and philosophers find it revisionist. It seems counterintuitive to say Priestley "meant" oxygen when he explicitly defined phlogiston as a substance released during burning (which is the opposite of oxidation). If we stretch reference this far, does the word "truth" lose its meaning?

  ### 3. Summary of the Debate Status

  The tension you noticed is not a bug in the system; it is the system.

  *   **If you lean Anti-Realist (e.g., Bas van Fraassen):** You argue the "Approximate Truth" move is a convenient fiction. Theories are just empirically adequate, not true. The "limiting case" argument is just mathematical consistency, not ontological continuity.
  *   **If you lean Realist (e.g., Stathis Psillos):** You argue that without the "Approximate Truth" move, the success of science *is* a miracle. You accept that specific entities vanish, but argue the *causal powers* or *structures* are retained.

  **The Verdict:**
  There is no consensus resolution. **Structural Realism** is currently the dominant attempt to solve the specific tension you raised (preserving the math while discarding the fluid). It is generally viewed as the "best game in town" for realists, but it remains contested.

  If you want to read further on this specific dynamic, look for papers discussing **"The Pessimistic Meta-Induction and Structural Continuity"** or **"The Problem of Non-Referring Terms."** Your intuition that the historical cases are being "characterized in opposite ways" is exactly what philosophers like **Larry Laudan** (who highlighted the inconsistency) and **John Worrall** (who tried to fix it) have been debating for forty years.
