answer: |-
  They claim the mind is luminous and bright,
  When pain is present, knowledge is at hand.
  No shadow stands between the feel and sight,
  No veil obscures what consciousness commands.
  If I am cold, I cannot be deceived,
  The state itself makes certain what I know.
  By introspection, truth is thus achieved,
  And inner states are forced to plainly show.

  But trace the warming from the frost to ease,
  Where adjacent moments blend, no border line.
  If knowledge held, it would not cease by degrees,
  Where phenomenal neighbors undermine.
  Luminosity fades where margins bind,
  And transparency leaves the mind behind.
