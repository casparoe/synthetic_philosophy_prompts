answer: |-
  You are not operating on pure Expected Value (EV) maximization. If you were, you would pay the mugger (if the math holds), you would be obsessed with the lottery in Case 7, and you would be indifferent between the climate bike and the lottery ticket.

  Instead, your intuition aligns with a framework often called **Credibility-Constrained Decision Theory** (sometimes referred to as "Robust Decision Making" or "Epistemic Humility").

  You are implicitly applying three filters before you even calculate the expected value. If a scenario fails any of these filters, you discard the EV calculation entirely.

  ### The Three Pillars of Your Principle

  **1. The Causal Plausibility Filter**
  You require a mechanism that fits within your current understanding of physics and causality. You reject claims that rely on "magic," unverified supernatural powers, or causal chains that defy known models.
  *   **Passes:** Climate change (known physics), Vacuum decay (theoretical physics), Lottery (known statistics).
  *   **Fails:** Magic mugger, Causal ripple sadness, Future AI simulation.
  *   **Verdict:** This explains why you reject Cases 1, 2, and 6 immediately. The cost ($10 or $1000) is irrelevant because the prior probability of the *mechanism* existing is effectively zero.

  **2. The Probability Floor (Epistemic Humility)**
  You recognize that human beings cannot meaningfully distinguish between extremely small probabilities. Once a probability drops below a certain threshold (somewhere between $10^{-10}$ and $10^{-20}$ for you), the "error bars" on your estimate become larger than the estimate itself. You treat these numbers as noise.
  *   **Passes:** $1$ in $10^8$ (Cases 3, 4, 5). This is rare, but physically comprehensible.
  *   **Fails:** $1$ in $10^{100}$ (Case 7). This is physically meaningless in our universe (there aren't enough atoms to represent the odds).
  *   **Verdict:** This explains why Case 7 feels "wrong." You intuitively understand that when numbers get this big, the math stops describing reality and starts describing a fantasy.

  **3. Asymmetric Risk Aversion (The Precautionary Principle)**
  You treat potential catastrophic *losses* differently than potential speculative *gains*. You are willing to incur a small cost to mitigate a low-probability disaster, but you are not willing to incur a cost to chase a low-probability windfall.
  *   **Losses:** You bike (Case 3) and you don't power the device (Case 5).
  *   **Gains:** You are neutral on the lottery ticket (Case 4).
  *   **Verdict:** This explains the difference between Cases 3/5 and Case 4. Even though the math ($10^{-8}$) is similar, your brain weights the "avoiding death" scenario much heavier than the "getting rich" scenario.

  ---

  ### Do You Need to Abandon Any Verdicts?

  Your framework is internally consistent, with one minor tension: **Case 4 (The Lottery).**

  If you are willing to bike to work to mitigate a $1$ in $10^8$ risk of millions dying (Case 3), strict consistency suggests you should value the $1$ in $10^8$ chance of winning $10 billion (Case 4) much more highly.
  *   **The Tension:** In Case 3, you are spending effort to *reduce* a tiny probability of harm. In Case 4, you are spending money to *increase* a tiny probability of gain.
  *   **The Fix:** You don't have to abandon the verdict, but you must acknowledge that you are **risk-averse**, not risk-neutral. You accept that diminishing marginal utility of money makes the lottery less compelling, while the catastrophic nature of the climate/physicist cases makes them compelling. As long as you admit you aren't a pure EV maximizer, Case 4 stays.

  ---

  ### Applying Your Principle to Edge Cases

  Here is how your principle handles the specific scenarios you asked about:

  **1. What if the mugger asks for a penny instead of $10?**
  *   **Verdict:** **Don't pay.**
  *   **Why:** This fails the **Causal Plausibility Filter**. It doesn't matter if the cost is negligible. If the mechanism is magic, the probability is zero. Paying validates a causal model you believe is false. (Also, paying signals to scammers that you are a target).

  **2. What if the physicist's probability is 1 in $10^{20}$ instead of $1$ in $10^8$?**
  *   **Verdict:** **Probably still don't power it on.**
  *   **Why:** This hits your **Probability Floor**. However, because the stakes are *infinite* (destruction of the entire universe vs. one child's life), the Precautionary Principle overrides the Probability Floor. When the downside is "game over," you don't gamble on probabilities you can't comprehend. You defer to the credible expert's warning, even if the number is tiny.

  **3. What if the climate bike probability drops to 1 in $10^{20}$?**
  *   **Verdict:** **Drive (Don't bike).**
  *   **Why:** This fails the **Probability Floor** *and* the **Causal Plausibility Filter** regarding individual impact. Unlike the physicist's device (a specific trigger), your individual emissions are part of a diffuse aggregate. At $10^{-20}$, the causal link between *your specific trip* and the threshold is too noisy to be credible. The "error bars" on that probability are huge. At that point, the effort of biking outweighs the non-robust risk reduction.

  ### Summary
  You are operating on **Credibility-Constrained Decision Theory with Asymmetric Risk Aversion.**

  *   **Don't pay the mugger:** No causal mechanism.
  *   **Don't trust the $10^{100}$ lottery:** Probability is below the floor of meaning.
  *   **Do bike / Don't power the device:** Credible mechanism + catastrophic stakes = Precaution.
  *   **Neutral on lottery:** Credible mechanism + speculative gain = Risk aversion applies.

  This is a very healthy, robust way to navigate the world. It protects you from scams (Mugger), paralysis (Case 7), and existential risk (Physicist), without forcing you to live your life as a calculating machine for every mundane decision (Lottery).
