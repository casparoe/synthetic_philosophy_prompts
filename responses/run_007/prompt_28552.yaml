      *   *Refining the Package Principle:* Christensen (1991) is key here. If I don't know the bets are being offered together, can I be blamed? The DBA requires a "super-bookie."
      *   *Refining Accuracy:* Accuracy arguments (Joyce, Pettigrew) avoid money entirely. They measure distance from truth. This is the modern standard. A DBA defender must explain why pragmatic vulnerability matters *epistemically*.
