      *   *Correction:* Make sure to distinguish between "DBA is valid" (it is) and "DBA justifies Probabilism as an *epistemic* norm" (this is the contention).
      *   *Emphasis:* The user wants to know if the sure-loss vulnerability is doing *real justificatory work*. I need to argue that it's doing *pragmatic* work, which fails to translate to *epistemic* work without extra assumptions.

