prompt: |-
  Ok so I'm reading The Prince and I'm stuck on this bit from Chapter 25 where Machiavelli is talking about fortune and virtù. Here's the passage:

  "I believe also that he will be successful who directs his actions according to the spirit of the times, and that he whose actions do not accord with the times will not be successful. Because men are seen, in affairs that lead to the end which every man has before him, namely, glory and riches, to get there by various methods; one with caution, another with haste; one by force, another by skill; one by patience, another by its opposite; and each one succeeds in reaching the goal by a different method. One can also see of two cautious men the one attain his end, the other fail; and similarly, two men by different observances are equally successful, the one being cautious, the other impetuous; all this arises from nothing else than whether or not they conform in their methods to the spirit of the times. This follows from what I have said, that two men working differently bring about the same effect, and of two working similarly, one attains his object and the other does not.

  Changes in estate also issue from this, for if, to one who governs himself with caution and patience, times and affairs converge in such a way that his administration is successful, his fortune is made; but if times and affairs change, he is ruined if he does not change his course of action. But a man is not often found sufficiently circumspect to know how to accommodate himself to the change, both because he cannot deviate from what nature inclines him to do, and also because, having always prospered by acting in one way, he cannot be persuaded that it is well to leave it; and, therefore, the cautious man, when it is time to turn adventurous, does not know how to do it, hence he is ruined; but had he changed his conduct with the times fortune would not have changed."

  What I'm confused about is this: Machiavelli seems to be saying that success comes from matching your method to the times — if you're cautious and the times call for caution, you win; if they call for boldness, you lose. But then he also says that a person's nature inclines him to one way of acting and he can't really change it. So if your nature is fixed but the times keep changing, doesn't that mean success is basically just luck — that you happened to be born with a temperament that happens to fit the moment? But earlier in the chapter he says fortune only controls half our actions, and the rest is up to us. How are those two claims consistent? Help me figure out what Machiavelli is actually saying here about how much control we have.
