answer: |-
  Here is a procedure designed to identify structural vulnerability to the "hold-up problem" (the economic reality behind the dollar auction) at the RFP stage.

  This is not a bid evaluation tool. This is a **project structure audit**. It is designed to be run by your team *before* the RFP is released.

  ### The Procurement Hold-Up Risk Audit (PHRA)

  **Time required:** 2–3 hours per project.
  **Participants:** Procurement Lead, Project Owner, Technical Lead, Legal Counsel (optional).
  **Goal:** Identify if the *structure* of the deal invites escalation, regardless of vendor integrity.

  #### Part 1: The Five Structural Questions
  Score each question 0 (Low Risk), 1 (Medium Risk), or 2 (High Risk).

  **1. Scope Definability**
  *Can we define "complete" in the RFP with enough precision that a vendor cannot claim ambiguity later?*
  *   **0:** Yes. Specifications are engineering-grade or code-spec precise.
  *   **1:** Mostly. Some areas require "best effort" or discovery.
  *   **2:** No. The scope depends on findings discovered *after* work begins (e.g., "repair as needed").

  **2. Verification Asymmetry**
  *If the vendor claims a task is harder than expected, can we verify that claim independently without hiring them?*
  *   **0:** Yes. We have internal expertise or a third-party standard to audit their claim.
  *   **1:** Partially. We can audit the output, but not the process/effort.
  *   **2:** No. Only the vendor has the tools/knowledge to validate their own assessment of the problem.

  **3. Asset Specificity (Lock-In)**
  *If we fire this vendor mid-project, can a new vendor use the work already done, or must they start over?*
  *   **0:** Fully Interchangeable. Work products are standard/open; new vendor picks up day one.
  *   **1:** Moderate Friction. New vendor needs 1–3 months to onboard/convert work.
  *   **2:** Total Reset. Work is proprietary or knowledge-based; new vendor must redo from scratch.

  **4. Market Depth**
  *At the RFP stage, how many vendors are capable of doing this work?*
  *   **0:** 5+ qualified vendors.
  *   **1:** 3–4 qualified vendors.
  *   **2:** 1–2 qualified vendors (or only the incumbent).

  **5. Payment Milestone Alignment**
  *Does the payment schedule match value delivered, or does it front-load costs?*
  *   **0:** Payment tied to verified deliverables; retainage held until final acceptance.
  *   **1:** Mixed. Some time-and-materials (T&M) or front-loaded mobilization fees.
  *   **2:** High. Significant upfront payment or T&M dominant with no cap.

  ---

  #### Part 2: The Decision Matrix

  **Total Score: 0–3 (Green)**
  *   **Diagnosis:** Standard Competitive Procurement.
  *   **Action:** Proceed with RFP. Low risk of dollar auction. Low bids are likely due to efficiency.

  **Total Score: 4–6 (Yellow)**
  *   **Diagnosis:** Vulnerable to Change Order Creep.
  *   **Action:** Proceed with caution. You must add specific contractual guards (see Mitigations below). Low bids should be treated as suspicious until proven otherwise.

  **Total Score: 7–10 (Red)**
  *   **Diagnosis:** Structural Trap.
  *   **Action:** **Do not issue RFP in this format.** This structure guarantees a dollar auction. A rational vendor *must* bid low to win, then exploit the lock-in to survive.
  *   **Requirement:** You must restructure the procurement (split contracts, change pricing model, or internalize work) before soliciting.

  ---

  #### Part 3: Application to Your Cases

  Here is how the PHRA applies to the two scenarios you provided.

  ##### Case 1: Custom Software Migration
  *Context: Vendor gains institutional knowledge by month six.*

  1.  **Scope Definability (2):** Software migrations rarely have fixed scopes. Requirements evolve as legacy code is touched.
  2.  **Verification Asymmetry (2):** By month six, the vendor knows the legacy system better than your IT team. If they say "this module requires 200 more hours," you cannot verify that without doing the work yourself.
  3.  **Asset Specificity (2):** If they write custom scripts or configure proprietary middleware, a new vendor cannot easily pick up the keys. Knowledge is the asset.
  4.  **Market Depth (1):** Few vendors know your specific legacy stack.
  5.  **Payment Milestone (1):** Often tied to sprints or time, not functional utility.

  **Total Score: 8 (RED)**
  **Verdict:** **Do not structure as a single fixed-vendor migration contract.**
  **Why:** This is the quintessential hold-up scenario. The vendor buys the contract with a low bid, knowing that by month six, the switching cost (system failure during migration) is infinite.
  **Restructuring Required:**
  *   **Modularize:** Break the migration into discrete, standalone packages (e.g., "Database Migration" vs. "Front End Build").
  *   **Knowledge Escrow:** Contractually mandate weekly documentation dumps and code commits to a city-owned repository as a condition of payment.
  *   **Pairing:** Require the vendor to pair-program with city staff for knowledge transfer, verified by the city staff's ability to complete a task independently.

  ##### Case 2: Bridge Repair (Assessor = Contractor)
  *Context: Contractor does initial assessment and bids for the work.*

  1.  **Scope Definability (2):** The scope is literally defined by the assessment. It is unknown at RFP.
  2.  **Verification Asymmetry (2):** The contractor assesses the damage. They say it's worse than thought. You have no way to know if they are right without hiring another engineer (which costs money/time).
  3.  **Asset Specificity (1):** Heavy equipment mobilization creates some lock-in, but another contractor could theoretically step in.
  4.  **Market Depth (1):** Specialized bridge repair is a niche market.
  5.  **Payment Milestone (2):** Usually T&M or Unit Price based on the *quantity* of repair needed. The vendor controls the quantity.

  **Total Score: 9 (RED)**
  **Verdict:** **Conflict of Interest / Structural Trap.**
  **Why:** This is not just a dollar auction; it is a moral hazard. The vendor profits from identifying more problems. A low bid on the assessment is a loss leader to secure the high-margin repair work.
  **Restructuring Required:**
  *   **Split the Contract:** The entity that assesses the bridge *cannot* be eligible to bid on the repair. Hire an engineering firm for the Scope of Work (SOW), then bid the repair based on that fixed SOW.
  *   **Guaranteed Maximum Price (GMP):** If you must keep them together, demand a GMP based on the assessment, with any overage requiring third-party validation.
  *   **Unit Price Audit:** Pre-negotiate unit prices for common repairs, but require independent verification of quantities before work proceeds.

  ---

  #### Part 4: How to Sell This to Your Boss

  Your boss cares about two things: **Speed** (getting projects done) and **Optics** (not wasting taxpayer money). They will hate the "Red" verdict because it delays the project.

  **The Script:**
  > "We are currently seeing projects finish at 200% of budget due to change orders. This isn't vendor malice; it's math. When we structure a deal where the switching cost is high and the scope is vague, the lowest bid is actually the most expensive one.
  >
  > This Audit takes three hours. If it flags a project as 'Red,' it means issuing the RFP *as written* is a fiscal liability. It forces us to fix the contract structure now, rather than explaining a budget overrun in Year Three. I am recommending we adopt this as a mandatory checkpoint for any project over $500k."

  **The "Boss-Proof" Clause:**
  Include a line in the audit report: *"Proceeding with a Red-Risk procurement without restructuring requires written sign-off from the City Administrator accepting the high probability of >50% cost escalation."*
  No administrator wants to sign a document admitting they know a project will likely double in cost. This forces the restructuring conversation without you having to be the "bad guy."

  ### Summary of Mitigations for "Red" Projects

  If you must proceed with a Red project, you cannot use a standard Fixed Price or T&M contract. You must use one of these structures:

  1.  **The "Two-Phase" Lock:** Phase 1 is paid discovery (fixed fee) to define scope. Phase 2 is the work, bid by Phase 1 vendor *and* new competitors using the Phase 1 specs.
  2.  **Open Book + Fixed Fee:** Vendor is reimbursed for actual costs (audited) plus a fixed profit fee. This removes the incentive to inflate scope, though it requires heavy city oversight.
  3.  **Alliance Contracting:** Vendor and City share savings and overages. If the project goes over budget, the vendor's profit margin shrinks. If it comes under, they get a bonus. This aligns incentives.

  **Final Rule:** If the PHRA scores a 9 or 10, and you cannot apply one of the mitigations above, **do not buy.** The market structure is broken for this specific need. Consider delaying the project until internal capacity can be built or the market matures.
