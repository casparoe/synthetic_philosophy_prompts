prompt: |-
  I run procurement for a mid-size city government and I keep seeing projects turn into dollar auctions — a contractor underbids, we're locked in, change orders pile up, and by year three we're paying double because pulling out would mean paying someone else to redo the work from scratch. I need a procedure my team can use at the RFP stage to flag which procurements are structurally vulnerable to escalation traps, not just which bids look suspiciously low. It should be something we can run in an afternoon for a given RFP, it should distinguish between ordinary competitive pressure and genuine trap structure, and it should be honest about when the procedure says "don't structure the procurement this way" and my boss won't like the answer. Apply it to two cases: a custom software migration where the vendor will have all the institutional knowledge by month six, and a bridge repair where the contractor who does the initial assessment is also bidding for the work.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**
      *   **User Role:** Procurement lead for a mid-size city government.
      *   **Problem:** Projects turning into "dollar auctions" (winner's curse/hold-up problem). Low initial bid $\rightarrow$ lock-in $\rightarrow$ excessive change orders $\rightarrow$ total cost explosion.
      *   **Need:** A procedure to flag structurally vulnerable procurements *at the RFP stage*.
      *   **Constraints:**
          *   Must be executable in an afternoon.
          *   Must distinguish between healthy competition and trap structures.
          *   Must be honest/uncomfortable (willing to say "don't do this").
          *   Must apply to two specific cases: Custom Software Migration (lock-in via knowledge) and Bridge Repair (conflict of interest/assessment lock-in).

  2.  **Analyze the "Dollar Auction" in Procurement:**
      *   *Economic Concept:* A dollar auction is a game where bidders escalate commitment to a losing position to avoid sunk costs. In procurement, this manifests as the "Hold-Up Problem."
      *   *Mechanism:* Asymmetric information + High Switching Costs + Incomplete Contracts.
      *   *The Trap:* The vendor knows they can exploit the switching cost later. The city knows it but feels powerless once started.
      *   *Key Indicators:*
          *   Is the scope definable *ex-ante*?
          *   Are switching costs high *ex-post*?
          *   Is performance verifiable?
          *   Is there a monopoly/oligopoly emerging mid-project?

  3.  **Develop the Procedure (The "Hold-Up Risk Audit"):**
      *   *Goal:* Quick, actionable, structural analysis.
      *   *Format:* A checklist/scoring matrix.
      *   *Components:*
          1.  **Scope Definability:** Can we write down exactly what "done" looks like?
          2.  **Asset Specificity:** Does the vendor build something only *they* can maintain?
          3.  **Verification Asymmetry:** Can we tell if they are doing a good job without their help?
          4.  **Switching Cost:** How painful is it to fire them mid-stream?
      *   *Thresholds:* Need clear "Stop/Go" signals.
      *   *Tone:* Professional, direct, risk-focused.

  4.  **Drafting the Procedure Steps:**
      *   *Step 1: The Scope Test.* (Fixed Price vs. T&M).
      *   *Step 2: The Lock-In Test.* (Proprietary tech, specialized knowledge).
      *   *Step 3: The Verification Test.* (Can we audit them?).
      *   *Step 4: The Market Test.* (How many can actually do this?).
      *   *Scoring:* Low/Medium/High Risk.
      *   *Decision Rule:* High Risk = Restructure or Don't Procure.

  5.  **Applying to Case 1: Custom Software Migration:**
      *   *Context:* Vendor gains institutional knowledge.
      *   *Analysis:*
          *   Scope: Likely vague (software is iterative).
          *   Asset Specificity: High (codebase, data structure, knowledge).
          *   Verification: Hard (city IT might not know the legacy system as well as the vendor).
          *   Switching Cost: Extreme (mid-migration failure = broken systems).
      *   *Verdict:* High Risk. Needs restructuring (modular contracting, escrow, knowledge transfer milestones).

  6.  **Applying to Case 2: Bridge Repair (Assessment + Work):**
      *   *Context:* Contractor assesses and bids.
      *   *Analysis:*
          *   Scope: Unknown until assessment (inherent uncertainty).
          *   Asset Specificity: Medium (heavy equipment, site knowledge).
          *   Verification: High Asymmetry (Contractor says "it's worse than we thought," City has to trust them).
          *   Switching Cost: High (safety, mobilization costs).
          *   *Conflict:* The assessor defines the scope of their own profit.
      *   *Verdict:* Critical Risk. Structural conflict of interest. Needs third-party assessment.

  7.  **Refining the Output:**
      *   *Title:* Needs to sound official but punchy. "Procurement Hold-Up Risk Audit."
      *   *Introduction:* Acknowledge the pain point (dollar auction).
      *   *The Tool:* A 4-quadrant matrix or scored checklist. Let's go with a Scored Checklist for granularity.
      *   *The "Boss-Proof" Element:* Explicit "Red Flags" that mandate restructuring.
      *   *Case Studies:* Walk through the logic clearly.
      *   *Mitigation:* Don't just identify problems; offer the "Don't structure it this way" alternatives.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use plain language. Instead of "Asset Specificity," use "Vendor Lock-In Potential."
      *   *Critique:* Is it quick enough?
      *   *Fix:* Limit to 5 key questions.
      *   *Critique:* Will the boss like it?
      *   *Fix:* Frame it as "Fiscal Risk Mitigation" rather than "Procurement Obstruction." Show how it saves money long-term.
      *   *Critique:* Did I address the "dollar auction" specifically?
      *   *Fix:* Explicitly link the scoring to the *escalation of commitment* dynamic.

  9.  **Final Polish:** Ensure the distinction between "low bid due to efficiency" vs. "low bid due to trap" is clear. (Efficiency = low margin, Trap = negative margin initially recouped via change orders).

  10. **Final Output Structure:**
      *   Executive Summary.
      *   The "Hold-Up Risk Audit" (5 Questions).
      *   Scoring & Decision Matrix.
      *   Application: Software Migration.
      *   Application: Bridge Repair.
      *   Implementation Note (How to sell this to the boss).

  *(Self-Correction on the Bridge Case)*: The prompt specifically mentions the contractor doing the *assessment* is also bidding. This is a classic conflict of interest, not just a hold-up problem. I need to make sure the procedure flags *Information Asymmetry* specifically.

  *(Self-Correction on Software Case)*: The lock-in is "Institutional Knowledge." This is human capital specificity. The procedure needs to ask about "Knowledge Transfer."

