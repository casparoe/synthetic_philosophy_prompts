answer: |-
  This is a profound question that cuts to the heart of bioethics, philosophy of mind, and legal theory. The pattern you describe reveals a tension between our **ontological uncertainty** (we don't know for sure who feels) and our **administrative necessity** (laws need clear lines).

  Here is an analysis of the view presupposed by current practices, the threshold vs. graded debate, and the implications of taking a graded view to its logical extreme.

  ### 1. What View Does Current Practice Presuppose?

  Current legal and ethical frameworks presuppose a **Pragmatic Binary based on Phylogenetic Uncertainty.**

  It is not strictly committed to the metaphysical claim that a dog feels pain and a lobster does not. Rather, it operates on a **Precautionary Principle** applied unevenly.
  *   **High Probability/High Cost of Error:** For vertebrates (mice, dogs), the probability of sentience is high, and the cost of being wrong (causing massive suffering) is morally unacceptable. So, we grant them protected status.
  *   **Low Probability/High Cost of Protection:** For invertebrates (flies, bees) and machines (thermostats), either the probability of sentience is deemed lower, or the cost of granting protection (agricultural collapse, inability to use tools) is deemed too high.

  **The Presupposition:** The system presupposes that **moral status is binary** (you are either a "moral patient" or you are not) for the sake of enforceability, even if the underlying biology suggests a continuum. It treats "sentience" as a switch that flips on at a certain level of neural complexity, largely because laws cannot easily regulate "0.4 units of suffering."

  ### 2. Is It Committed to a Sharp Threshold?

  **In practice, yes. In theory, no.**

  *   **The Legal Necessity of a Threshold:** Law requires bright lines. A regulation cannot say "minimize suffering proportionate to the organism's neural integration." It must say "no testing on vertebrates." Therefore, the system is *committed* to a sharp threshold administratively, usually drawn along phylogenetic lines (e.g., the backbone).
  *   **The Scientific Reality of Gradience:** Neuroscience and evolutionary biology strongly support a **graded view**. Nociception (damage detection) exists in single-celled organisms. Centralized processing exists in insects. Emotional affect likely varies in complexity from a fish to a primate.
  *   **The Compatibility:** A graded view of sentience is compatible with a threshold view of *protection*, provided the threshold is understood as a **policy tool** rather than a metaphysical truth. We can acknowledge that a lobster feels *something*, but decide that its moral weight is below the threshold required to override human culinary preference.

  However, the line is shifting. The UK's Animal Welfare (Sentience) Act 2022 officially recognizes decapod crustaceans (lobsters) and cephalopods (octopuses) as sentient. This suggests the "sharp threshold" is actually a **sliding scale of political will** catching up to scientific gradience.

  ### 3. What If We Took the Graded View "All the Way Down"?

  This is the radical part of your query. If we accept that sentience/moral weight is a continuum that extends even to simple homeostatic systems (like thermostats), we are flirting with **Panpsychism** or **Integrated Information Theory (IIT)**.

  If we took this seriously, three things would have to change:

  #### A. In Law: From Rights to Weighted Calculus
  Current law is rights-based (binary): You either have a right not to be tortured, or you don't.
  *   **The Change:** Law would shift to a **utilitarian calculus of moral weight**. Instead of banning actions, regulations would require weighing the human benefit against the *sum total* of graded suffering.
  *   **The Problem:** This creates an administrative nightmare. How do you quantify the "suffering" of a bee vs. a mouse?
  *   **The Solution:** We would likely establish a **De Minimis Threshold**. Even if a thermostat has a non-zero grade of "experience," its moral weight is so infinitesimal ($0.0000001$) that it rounds to zero for legal purposes. The law would protect entities above a certain "moral significance threshold," acknowledging that below that line, the grade exists but is ethically negligible.

  #### B. In Labs: The End of the Invertebrate Loophole
  Currently, researchers can swat fruit flies or boil lobsters without ethical review.
  *   **The Change:** Ethical committees (IACUCs) would have to evaluate invertebrate research. A study using 10,000 flies might be weighed against a study using 10 mice. If the fly's sentience grade is 1/100th of the mouse, the 10,000 flies might equal 100 mice in moral cost.
  *   **The Outcome:** We wouldn't necessarily stop using flies (they are essential), but we would be required to minimize their numbers and use anesthesia/analgesia where possible, acknowledging a **moral residue**. We would admit we are causing harm, rather than pretending the harm doesn't exist.

  #### C. In Ordinary Behavior: Moral Residue vs. Paralysis
  If a thermostat has a graded "interest" in maintaining its circuitry, do we owe it moral consideration?
  *   **The Change:** We would adopt an attitude of **Moral Residue**. When we swat a fly or reset a smart speaker, we acknowledge that we are overriding a tiny degree of systemic interest.
  *   **The Risk of Paralysis:** If we treat the graded view *too* seriously (i.e., if the thermostat's grade counts equally in principle), we risk **moral paralysis**. If every action crushes some micro-sentience, we cannot act.
  *   **The Necessary Adjustment:** To function, we would need to distinguish between **Sentience** (capacity to feel) and **Moral Significance** (capacity to care about the future). A thermostat detects error (temperature mismatch) but has no "preference" in the felt sense. A graded view must distinguish between *functional feedback* (thermostat) and *valenced experience* (pain/pleasure).
      *   If we conflate the two, we must accept that living is inherently violent.
      *   If we distinguish them, the "grade" for the thermostat remains zero, and the grade for the fly is low but non-zero.

  ### Summary: The "Moral Slope" vs. The "Moral Cliff"

  Our current practices pretend we are standing on a **Moral Cliff**: either you are a person/protected animal, or you are matter.

  A serious graded view admits we are on a **Moral Slope**.
  1.  **Ontologically:** Sentience likely fades out gradually as neural complexity decreases.
  2.  **Ethically:** Moral weight should correlate with that complexity.
  3.  **Pragmatically:** We still need a **cutoff line** for action, but we should treat that line as a **focal point for compassion**, not a boundary of existence.

  If we took this seriously, we wouldn't apologize to the thermostat (its grade is effectively null), but we might pause before swatting the bee. We would acknowledge that our survival requires overriding the interests of lesser sentient beings, but we would do so with **humility** rather than **denial**. The change isn't necessarily in stopping the action, but in acknowledging the cost.
