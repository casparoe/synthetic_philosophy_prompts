      *Key reference check:* Parfit (*Reasons and Persons*), Kavka (Toxin Puzzle), Gauthier (*Morals by Agreement*), McClennen (*Rationality and Dynamic Choice*), Kolodny (Reasons and Rationality).

      *AI Angle:* Emphasize that for an AI, "taking the drug" is "rewriting the loss function." This makes the Instrumental view much more natural, potentially dissolving the "coherence" worry for artificial agents specifically.

  9.  **Final Review against constraints:**
      *   Diagnose structure? Yes.
      *   Grounded in arguments? Yes.
      *   What counts as progress? Yes.
