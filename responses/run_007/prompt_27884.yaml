      *   **Dimension 2: The Temporal/Agency Structure (The Formal Problem).**
          *   *Dynamic Consistency:* Can a plan span time if the agent changes?
          *   *The "Bootstrapping" Problem:* Can a rational state cause an irrational state *rationally*?
          *   *AI Context:* Code can rewrite code. Humans can't easily rewrite their reward functions. This distinction matters.
      *   **Dimension 3: The Object of Evaluation.**
          *   Is the *act* of taking the drug rational? Or the *disposition*? Or the *agent*?
          *   Camp 1 evaluates the *policy*. Camp 2 evaluates the *momentary mental state*.

  5.  **Identifying Paths to Progress:**

      *   *Dissolution:* Accept there are two concepts (Prudence vs. Rationality).
      *   *Formal Progress:* Updateless Decision Theory (UDT) / Functional Decision Theory (FDT). These try to formalize the "Camp 1" view without calling it "irrationality." They reframe the "irrational" act as the output of a rational *algorithm*.
      *   *The AI Distinction:* This is the user's unique angle. In AI, "self-modification" is transparent. In humans, it's opaque.
      *   *The "Why" Question:* Why do we care about rationality? If it's for guidance, Camp 2 wins. If it's for evaluation/design, Camp 1 wins.

