      *   Block the "Liar" and "Psychological" objections.
      *   End with the Diary Question.

      *Wait, one refinement on the example:* The prompt asks for *one example or scenario*. I will advocate for the "Window Testimony" scenario. It's the cleanest.
      *Wait, one refinement on the Final Question:* The diary question is good, but maybe a "Phone Call" scenario is more active. "If you call a friend and say..." No, the Diary question better isolates the temporal aspect. Let's stick with the Diary/Record question.

      *Wait, checking the "Unsettled" goal:* To leave them unsettled, I need to hint that this applies to *all* speech, not just this sentence. The "Norm of Assertion" is the hook. If assertion *always* implies belief, what does that mean for fiction? Politeness? Uncertainty? I'll add a note to the facilitator to hint at this breadth without going into it.

