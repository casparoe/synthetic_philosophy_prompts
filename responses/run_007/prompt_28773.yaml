  A friend of mine has been going through a bunch of forced-choice harm comparison questions, and I'm trying to reverse-engineer the rule she's actually running. Her track record so far:

  - one person tortured for 50 years vs 10^15 people getting a single dust speck in the eye: she says the torture is worse
