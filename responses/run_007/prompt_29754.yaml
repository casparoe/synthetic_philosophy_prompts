answer: |-
  Here is a plan for your fifty-minute section, designed to move students from a naive 'equality' intuition to the Difference Principle without losing them in the text. I have written this in British English as requested.

  ### 1. The Apparatus: What Must Be in Place First?

  Before you state the Difference Principle, you must secure three specific conceptual commitments. If you skip these, the principle will look like an arbitrary compromise rather than a rational choice.

  1.  **Primary Goods (The 'What'):** Students must understand that parties in the Original Position are not dividing 'happiness' or 'welfare', but *social primary goods* (rights, liberties, opportunities, income, wealth, and the social bases of self-respect).
      *   *Why:* If they think we are dividing 'welfare', they will drift towards Utilitarianism. If they think we are dividing 'talent', they will drift towards Meritocracy. Primary goods are the all-purpose means any rational person wants, regardless of their life plan.
  2.  **The Basic Structure (The 'Where'):** Clarify that the principles apply to the *rules of the game* (constitution, property law, tax structure), not to individual transactions or specific allocations.
      *   *Why:* This prevents students from asking, "But what if I work harder than my neighbour?" The principles judge the system that allows the inequality, not the individual outcome.
  3.  **Social Cooperation as Non-Zero-Sum (The 'How'):** This is the most critical. You must establish that society is a cooperative venture for *mutual* advantage. The economic pie is not fixed; it expands or contracts based on the incentives built into the rules.
      *   *Why:* This is the only way to justify inequality. If the pie is fixed, equality is always rational under the Veil of Ignorance. Inequality is only rational if it makes the pie bigger.

  **Order of Operations:**
  1.  Recap Veil of Ignorance (2 mins).
  2.  Define Primary Goods & Basic Structure (5 mins).
  3.  **Crucial Step:** Establish the 'Variable Pie' assumption (5 mins).
  4.  Run the Core Example (20 mins).
  5.  State the Difference Principle as the *solution* to the example (5 mins).
  6.  Address Misconceptions (8 mins).
  7.  Exit Question (5 mins).

  ---

  ### 2. The Core Example: Replace the Cake

  You are right to be suspicious of the cake example. It implies a *fixed* stock of resources to be sliced. This leads directly to the misconception that Rawls advocates strict equality.

  **Use instead: The 'Productivity Incentive' Scenario.**

  **The Setup:**
  Imagine the class represents the 'constitutional convention' behind the Veil of Ignorance. You are designing the tax and wage structure for a new society. There are two representative positions in this society:
  *   **Position A (High Productivity):** Doctors, engineers, entrepreneurs.
  *   **Position B (Low Productivity):** Unskilled labourers, care workers.

  **The Choice:**
  You do not know which position you will occupy. You are choosing the rules for income distribution. You have two options for the basic structure:

  *   **Scheme 1 (Strict Equality):** We mandate equal pay for all work.
      *   *Result:* Because high-skill jobs require long training and high stress, few people bother to train for them. Productivity crashes.
      *   *Payoff:* Position A gets £30k; Position B gets £30k.
  *   **Scheme 2 (Incentivised Inequality):** We allow higher pay for Position A to encourage people to train and work harder.
      *   *Result:* The economy grows significantly due to higher productivity and innovation. This generates more tax revenue to support Position B.
      *   *Payoff:* Position A gets £100k; Position B gets £45k.

  **The Decision:**
  Ask the students: *Behind the Veil, which scheme do you choose?*
  Most will choose Scheme 2. Why? Because even if you end up in the worst position (B), you are better off (£45k) than you would be in the equal society (£30k).

  **Why this example works:**
  *   **It has:** Incentives, variable total output, and a clear 'floor' comparison.
  *   **It lacks:** Any reference to moral desert (we don't ask if the doctors *deserve* more, only if paying them more *helps* the worst off).

  ---

  ### 3. Mapping the Misconceptions

  Here is how to head off the three misconceptions you identified, mapped to the sequence above.

  #### (a) 'The Veil means you'd be risk-averse and choose equality.'
  *   **When to address:** During the **Core Example** (Step 4 above).
  *   **How:** When students suggest Scheme 1 (Equality), ask: "Is equality the goal, or is security the goal?"
  *   **The Fix:** Distinguish between *minimising risk* (fear) and the *maximin rule* (rational floor). Rawls isn't saying "don't gamble"; he is saying "ensure the worst possible outcome of the gamble is as good as it can possibly be." If inequality raises the floor, risk-aversion actually *demands* inequality.
  *   **Script:** "If you are truly worried about being the worst off, you shouldn't care about the gap between rich and poor. You should only care about the absolute level of the bottom rung. If inequality lifts the bottom rung, strict equality is actually the riskier choice."

  #### (b) 'The Difference Principle is trickle-down economics.'
  *   **When to address:** Immediately **after stating the Principle**.
  *   **How:** Contrast *hope* with *constraint*.
  *   **The Fix:** Trickle-down suggests that if we let the rich get richer, benefits *might* eventually reach the poor. The Difference Principle says inequality is *forbidden* unless it *necessarily* benefits the worst off. It is a justificatory burden, not an economic hypothesis.
  *   **Script:** "Trickle-down says: 'Let them eat cake, and maybe crumbs will fall.' Rawls says: 'You can only have the cake if you prove the crumbs are bigger than what everyone would get if we shared the cake equally.' It is a strict condition, not a hope."

  #### (c) 'It's about desert/compensating for bad luck.'
  *   **When to address:** In the **Apparatus** phase (Step 2), when defining Primary Goods.
  *   **How:** Pre-emptively strike this down before they apply it to the example.
  *   **The Fix:** Remind them that the Veil of Ignorance hides your talents and your effort. You cannot claim you *deserve* your talent because you didn't choose your genetics. Therefore, the system cannot be based on rewarding moral worth.
  *   **Script:** "Rawls is radical here. He thinks 'desert' presupposes a social system to define it. You don't deserve your IQ or your work ethic; those are lucky accidents. So we don't distribute goods based on who deserves them. We distribute them based on what rules make everyone's life tolerable."

  ---

  ### 4. What to Explicitly Leave Out

  To keep this to fifty minutes, you must explicitly tell the students what you are *not* doing. This manages their anxiety about 'missing' parts of the theory.

  *   **The First Principle (Liberty):** Tell them: "We are assuming basic liberties are already secured. We are only talking about the second principle regarding economic distribution today."
  *   **The Argument for Maximin:** Do not try to prove *why* rational agents use the maximin rule (the three conditions regarding uncertainty, gravity of risk, etc.). Take it as a given for this section.
  *   **Real-World Policy:** Avoid debating whether UK tax rates actually satisfy the Difference Principle. That is an empirical question; today is about the normative justification.

  ---

  ### 5. The Exit Question (Last 5 Minutes)

  Do not ask them to define the principle. Ask them to apply the *logic* of the justification.

  **The Question:**
  > "Imagine a society where the worst-off group has an income of £20,000. A policy is proposed that allows top earners to double their income, which would raise the worst-off income to £21,000. However, a different policy exists that would raise the worst-off income to £22,000, but requires capping the top earners' income growth.
  >
  > According to the Difference Principle, is the first policy permissible? Why or why not?"

  **What this tests:**
  *   If they say **Yes**: They think the DP just means "the worst off must benefit somewhat." (This is the trickle-down error).
  *   If they say **No**: They understand the **Maximising** condition. The DP requires the *maximum* possible benefit to the worst off, not just *any* benefit. Inequality is only allowed if it is *necessary* to achieve that maximum.

  **Ideal Answer:**
  "No. The Difference Principle requires that inequalities be arranged to the *greatest* benefit of the least advantaged. Since the second policy benefits the worst off more (£22k vs £21k), the first policy is unjust, even though it helps them compared to the status quo."

  ### Summary Checklist for the TA
  *   [ ] **British English:** Ensure spelling (organise, maximise, labour, programme) and vocabulary (marking, section, module) are consistent.
  *   [ ] **Visual Aid:** Draw the two schemes (£30k/£30k vs £45k/£100k) on the board. Visualising the 'floor' rising is essential.
  *   [ ] **Timing:** Keep the example tight. If the debate on 'doctors deserve more' starts, shut it down by referencing the Veil.
  *   [ ] **Confidence:** If they push back on "Why not equality?", stand firm on the 'Variable Pie'. If the pie shrinks under equality, equality is irrational for the poor.

  Good luck with the section. If you can get them to see that the Difference Principle is about *leverage* rather than *charity*, you will have succeeded.
