prompt: |-
  I'm a hydrologist at a municipal water utility, and a few times a year I have to write sentences like "the annual probability of the West Fork reservoir running dry is 0.4%" or "there is a 1-in-500 chance this levee overtops in the next decade." The board uses those numbers to decide whether to spend nine figures on a new spillway or a pipeline and they have to sign off on the exact wording, so the numbers matter, but I was trained as an engineer and I keep tripping over the fact that the word "probability" is doing different work in different sentences. Sometimes we have ninety years of streamflow records, sometimes we're talking about a structure that has never failed and will never get a second run, and sometimes the number is basically three senior engineers in a room agreeing on a feeling. I'd like you to write me a reusable decision procedure, grounded in the frequentist / subjectivist / propensity distinction, that tells me, for any probability claim I have to make, which interpretation I'm entitled to use, what the resulting number actually licenses me to say in the document, and when I should refuse to put a number in at all. Make it a checklist I can actually run in a day or too, with the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it's a values call rather than a technical one. Then run it on three of my recurring cases: (1) the annual probability that the river drops below a level we've seen many times in the gauge record, (2) the probability that a brand-new dam fails by internal erosion in its first fifty years, and (3) the probability that a once-a-century drought lasts more than five years. Give me the committed version: tell me which interpretation wins in each case and why, don't just lay out the menu. And be straight about where the procedure will misfire or where the three-way distinction itself is doing more work than it can actually bear.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Hydrologist at a municipal water utility.
      *   **Task:** Create a reusable decision procedure (checklist) for assigning probability interpretations (Frequentist, Subjectivist/Bayesian, Propensity) to specific claims in official documents.
      *   **Context:** High-stakes decisions (nine-figure spending), board sign-off on exact wording, mixed data quality (records vs. expert judgment vs. unique events).
      *   **Requirements:**
          *   Grounded in Frequentist/Subjectivist/Propensity distinction.
          *   Checklist format (orderly questions, sufficient answers, stop conditions, hand-off points).
          *   Apply to three specific cases: (1) River level drop (historical data), (2) New dam failure (internal erosion, no history), (3) Century drought duration (extreme event).
          *   "Committed version": Don't just list options; decide which interpretation wins and why.
          *   Critique: Acknowledge where the procedure misfires or where the distinction breaks down.
      *   **Tone:** Professional, direct, technically rigorous but practical for an engineer/hydrologist.

  2.  **Deconstruct the Probability Interpretations:**
      *   *Frequentist:* Long-run relative frequency. Requires repeatable trials under identical conditions. Good for gauge records, historical flows. Bad for unique structures or climate change shifts.
      *   *Subjectivist (Bayesian/Epistemic):* Degree of belief. Based on available evidence, expert judgment, priors. Good for unique events, new structures, data-scarce scenarios. Needs calibration.
      *   *Propensity:* Physical tendency of a specific setup to produce an outcome. Often conflated with Frequentist but focuses on the *system* rather than the *history*. Good for physical failure modes (e.g., erosion physics) where history is lacking but physics is known. *Self-Correction:* In practice, Propensity is often hard to distinguish from Frequentist in engineering without deep philosophical debate. I need to make it practical. Let's treat Propensity as "Physical Reliability" based on mechanistic models, distinct from "Historical Frequency."

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   *Goal:* Filter claims from "Hard Data" to "Expert Judgment" to "No Number."
      *   *Step 1: Repeatability.* Can the event be repeated under identical conditions? (Frequentist check).
      *   *Step 2: Data Sufficiency.* Do we have enough observations to stabilize the frequency? (Frequentist vs. Uncertainty).
      *   *Step 3: Physical Mechanism.* If no data, do we have a validated physical model? (Propensity check).
      *   *Step 4: Expert Consensus.* If no model, can we aggregate expert judgment? (Subjectivist check).
      *   *Step 5: Values/Policy.* Is the number masking a risk tolerance decision? (Hand-off to Board).
      *   *Stop Conditions:* If data is non-stationary (climate change), Frequentist fails. If physics is unknown, Propensity fails. If experts disagree wildly, Subjectivist fails (or needs wide bounds).

  4.  **Applying to the Three Cases:**
      *   *Case 1: River drops below historical level.*
          *   Data: 90 years of streamflow.
          *   Interpretation: Frequentist (with non-stationarity caveat).
          *   Wording: "Based on historical record..."
      *   *Case 2: New dam failure (internal erosion).*
          *   Data: None (never failed).
          *   Physics: Geotechnical models exist but have uncertainty.
          *   Interpretation: Propensity/Subjectivist hybrid (Engineering Reliability).
          *   Wording: "Estimated likelihood based on design standards and material properties..."
      *   *Case 3: Century drought lasting > 5 years.*
          *   Data: Rare event, non-stationary climate.
          *   Interpretation: Subjectivist (Epistemic).
          *   Wording: "Expert assessment of risk..."

  5.  **Refining the "Committed Version":**
      *   I need to be decisive. No "it depends."
      *   Case 1: Frequentist.
      *   Case 2: Propensity (Physical Reliability).
      *   Case 3: Subjectivist (Epistemic).
      *   *Critique:* The distinction is fuzzy. Propensity often collapses into Subjectivist when models are calibrated by experts. Frequentist fails under climate change.

  6.  **Developing the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the pain point. Language matters for liability and budget.
      *   *The Protocol:* "The Probability Warrant Protocol."
      *   *The Cases:* Apply the protocol strictly.
      *   *The Critique:* Be honest about the limitations.

      *(Self-Correction during drafting)*: I need to make sure I don't get too philosophical. The user is an engineer. They need to know what they can *sign*.
      *   *Frequentist* = "The data says..."
      *   *Propensity* = "The physics says..."
      *   *Subjectivist* = "We judge..."
      *   *No Number* = "This is a policy choice."

      *Refining Case 2:* Internal erosion is tricky. It's often modeled via "event trees" in dam safety. These are inherently Subjectivist/Bayesian but dressed up as Propensity. I should call it out as Subjectivist masked as Propensity, or define Propensity broadly as "Model-Based." Let's stick to the prompt's request for the three-way distinction. I will classify it as *Propensity* because it relies on the physical properties of the dam, even if the probability is derived via expert elicitation on those properties. Actually, strict Propensity is hard. Let's classify it as *Subjectivist (Expert Elicitation)* because the failure mode has no frequency and the physics are probabilistic due to material heterogeneity. Wait, the prompt asks for the three-way distinction. I will argue for *Propensity* for the dam because it's about the *disposition of the specific object*, whereas the river is about the *class of events*.
      *Re-evaluation:* In dam safety (e.g., USBR), failure probabilities are often treated as "annualized failure probabilities" (AFP). These are technically Subjectivist (degree of belief in failure) but operationalized as Frequentist for risk calculations. I need to be sharp here. I will classify it as *Subjectivist* because it relies on expert judgment of hidden variables, but I will note the engineering convention treats it as Propensity. Let's go with *Subjectivist* for honesty, as the prompt asks to be straight.
      *Actually, looking at the prompt:* "grounded in the frequentist / subjectivist / propensity distinction."
      Okay, for the Dam: It's a unique object. Frequentist is out. Is it Propensity (physical chance) or Subjectivist (state of knowledge)? In engineering reliability, we usually treat it as Propensity (the dam *has* a failure rate). But epistemically, it's Subjectivist. I will recommend labeling it Subjectivist to protect the utility, but acknowledge the industry treats it as Propensity.
      *Decision:* I will assign Case 2 to **Propensity** (Physical Reliability) because the failure depends on the physical construction, not just our knowledge. But I will add a heavy caveat.
      *Decision:* Case 3 (Drought) is **Subjectivist**. Climate non-stationarity kills Frequentist. It's not a physical property of the drought (Propensity), it's our projection.

      *Refining the Checklist:*
      1. Is the process repeatable? (Frequentist)
      2. Is the system stationary? (Frequentist validity)
      3. Is the outcome determined by physical properties of a specific object? (Propensity)
      4. Is the number derived from expert consensus on evidence? (Subjectivist)
      5. Is the number actually a risk tolerance threshold? (Policy Hand-off)

  7.  **Final Review against Constraints:**
      *   Checklist format? Yes.
      *   Orderly questions? Yes.
      *   Stop conditions? Yes.
      *   Hand-off points? Yes.
      *   Three cases run through? Yes.
      *   Committed version (no fence-sitting)? Yes.
      *   Critique of the procedure? Yes.

  8.  **Drafting the Response:** (Mental outline of the text)
      *   Header: Protocol name.
      *   Section 1: The Protocol (The Checklist).
      *   Section 2: Application to Cases (The Commitments).
      *   Section 3: The Failure Modes (The Critique).
      *   Tone check: Professional, authoritative, empathetic to the engineer's dilemma.

      *(Self-Correction on "Propensity"):* Popper's Propensity is metaphysical. In engineering, "Reliability" is the proxy. I will use "Physical Propensity (Reliability)" to make it actionable.
      *(Self-Correction on "Subjectivist"):* Call it "Epistemic/Subjective" to emphasize it's about knowledge state.

      *Let's write.*
answer: |-
  ## The Probability Warrant Protocol (PWP)

  **Purpose:** To determine the epistemic warrant for any probability claim in a municipal water utility document, ensuring the interpretation matches the evidence and limiting liability.
  **Time Required:** 2–4 hours per claim (including data review).
  **Output:** A specific interpretation label (Frequentist, Propensity, Subjectivist) or a "No Number" decision, plus mandated wording constraints.

  ---

  ### Part 1: The Decision Checklist

  Run these questions in order. If you answer **NO** to a condition required for a specific interpretation, you cannot use that interpretation. If you reach the end without a valid interpretation, you must not publish a number.

  #### Step 1: The Repeatability Test (Frequentist Filter)
  *   **Q1.1:** Is the event part of a theoretically infinite sequence of identical trials under stable conditions?
      *   *Sufficient Answer:* Yes (e.g., annual peak flows, daily demand).
      *   *Stop Condition:* No (e.g., failure of a specific unique dam, a specific drought sequence). **→ Go to Step 2.**
  *   **Q1.2:** Do we have sufficient historical data to stabilize the frequency estimate (n > 30 for normal distributions, significantly higher for tail events)?
      *   *Sufficient Answer:* Yes, and the record is quality-controlled.
      *   *Stop Condition:* No. **→ Go to Step 2.**
  *   **Q1.3:** Is the system stationary? (i.e., Is the underlying physics/climate stable enough that the past predicts the future?)
      *   *Sufficient Answer:* Yes, within acceptable error margins for the planning horizon.
      *   *Stop Condition:* No (e.g., climate change impacts, land use shifts). **→ Frequentist interpretation is invalid. Go to Step 2.**

  **If Q1.1, Q1.2, and Q1.3 are YES:**
  *   **Verdict:** **Frequentist.**
  *   **Wording License:** You may use "probability," "frequency," or "chance." You must cite the record length (e.g., "based on 90 years of gauge data").
  *   **Liability:** You are warranting the stability of the record, not the future.

  #### Step 2: The Physical Disposition Test (Propensity Filter)
  *   **Q2.1:** Is the probability claim about the physical tendency of a specific, constructed object or system to fail, independent of our knowledge of it?
      *   *Sufficient Answer:* Yes (e.g., pump mechanical failure, levee seepage).
      *   *Stop Condition:* No (e.g., human operational error, policy decisions). **→ Go to Step 3.**
  *   **Q2.2:** Do we have a validated mechanistic model (physics-based) that links material properties to failure, even if historical failure data is absent?
      *   *Sufficient Answer:* Yes (e.g., geotechnical stability models, hydraulic capacity models).
      *   *Stop Condition:* No (purely empirical or black-box). **→ Go to Step 3.**

  **If Q2.1 and Q2.2 are YES:**
  *   **Verdict:** **Propensity (Physical Reliability).**
  *   **Wording License:** You may use "probability" but must qualify it as model-based (e.g., "modeled likelihood," "reliability index"). Avoid implying historical frequency.
  *   **Liability:** You are warranting the validity of the physical model, not the data.

  #### Step 3: The Knowledge State Test (Subjectivist Filter)
  *   **Q3.1:** Is the number derived from a structured aggregation of expert judgment (e.g., Delphi method, formal elicitation) rather than a single engineer's "feeling"?
      *   *Sufficient Answer:* Yes, documented consensus of ≥3 qualified experts.
      *   *Stop Condition:* No (single opinion). **→ STOP. Do not publish a number.**
  *   **Q3.2:** Can the uncertainty be expressed as a range or confidence bound rather than a point estimate?
      *   *Sufficient Answer:* Yes.
      *   *Stop Condition:* No (board demands single digit). **→ STOP. Escalate to Step 5.**

  **If Q3.1 and Q3.2 are YES:**
  *   **Verdict:** **Subjectivist (Epistemic).**
  *   **Wording License:** You must use "degree of belief," "expert assessment," or "estimated likelihood." Do not use "frequency" or "chance" without qualification.
  *   **Liability:** You are warranting the rigor of the elicitation process, not the outcome.

  #### Step 4: The Values Hand-Off (Policy Filter)
  *   **Q4.1:** Does the probability threshold imply a specific risk tolerance (e.g., "1-in-10,000 is safe")?
      *   *Sufficient Answer:* No, the number is descriptive only.
      *   *Stop Condition:* Yes. **→ HAND OFF TO BOARD.**
  *   **Action:** If Q4.1 is Yes, the document must state: "This probability is provided for decision support. The acceptability of this risk level is a policy determination."

  ---

  ### Part 2: Application to Your Recurring Cases

  Here is the committed application of the PWP to your three scenarios. I have made the call for you.

  #### Case 1: Annual probability that the river drops below a historical level.
  *   **Data:** 90 years of streamflow records.
  *   **PWP Run:**
      *   Step 1.1 (Repeatable?): **Yes.** Annual hydrologic cycles are treated as repeatable trials.
      *   Step 1.2 (Data Sufficiency?): **Yes.** 90 years is sufficient for central tendency, though tail uncertainty is high.
      *   Step 1.3 (Stationarity?): **Borderline/No.** Climate change and upstream development likely violate strict stationarity.
  *   **Commitment:** **Frequentist (with Non-Stationarity Caveat).**
  *   **Why:** While climate change challenges stationarity, hydrology still operationalizes this as a frequency claim based on the *observed* record. To call it Subjectivist undermines the gauge data; to call it Propensity ignores that it's a flow statistic, not a structural property.
  *   **Mandated Wording:** "Based on the 90-year historical record, the annual frequency of flow dropping below X is 0.4%. This estimate assumes future hydrologic conditions remain consistent with the historical period."
  *   **Restriction:** Do not call this a "prediction." It is a description of the past applied to the future.

  #### Case 2: Probability that a brand-new dam fails by internal erosion in its first fifty years.
  *   **Data:** No failure history (never failed).
  *   **PWP Run:**
      *   Step 1 (Frequentist?): **No.** This is a unique structure; there is no population of identical dams to generate a frequency.
      *   Step 2.1 (Physical Disposition?): **Yes.** Failure depends on soil gradation, compaction, and hydraulic gradient.
      *   Step 2.2 (Mechanistic Model?): **Yes.** Geotechnical models exist, but input parameters (soil heterogeneity) are uncertain.
  *   **Commitment:** **Propensity (Physical Reliability).**
  *   **Why:** Even though we use expert judgment to set the model inputs, the *source* of the risk is the physical disposition of the embankment, not our state of knowledge. The dam would fail even if we weren't watching. Treating this as Subjectivist suggests the risk disappears if we learn more; treating it as Propensity acknowledges the physical hazard exists regardless of our models.
  *   **Mandated Wording:** "The modeled annualized failure probability due to internal erosion is 1-in-50,000. This is derived from geotechnical reliability analysis, not historical failure rates."
  *   **Restriction:** You must explicitly state this is *not* a frequency. Do not say "1-in-50,000 years." Say "1-in-50,000 chance per year."

  #### Case 3: Probability that a once-a-century drought lasts more than five years.
  *   **Data:** Rare event, non-stationary climate.
  *   **PWP Run:**
      *   Step 1 (Frequentist?): **No.** "Once-a-century" implies a frequency, but the event (5+ year drought) has likely not occurred enough times in the record to establish a frequency. Stationarity is violated.
      *   Step 2 (Propensity?): **No.** A drought is not a physical object with a disposition; it is a meteorological sequence.
      *   Step 3.1 (Expert Consensus?): **Yes.** Assuming you convene climatologists and hydrologists.
  *   **Commitment:** **Subjectivist (Epistemic).**
  *   **Why:** This is purely a statement about our current understanding of a changing climate system. There is no physical "drought generator" with a fixed propensity, and there is no frequency data. The number represents the consensus degree of belief among experts given current climate models.
  *   **Mandated Wording:** "Based on current climate projections and expert elicitation, the assessed likelihood of a drought exceeding five years is X%."
  *   **Restriction:** You must include confidence bounds (e.g., "0.5% to 2.0%"). If the Board demands a single number without bounds, trigger Step 4 (Values Hand-Off).

  ---

  ### Part 3: Where This Procedure Misfires

  You asked for straight talk on the limitations. Here is where the PWP and the three-way distinction will break down in your actual work.

  **1. The Propensity/Subjectivist Blur in Dam Safety**
  In Case 2 (Dam Failure), I assigned Propensity. In practice, industry standards (like USBR or ANCOLD) calculate these probabilities using event trees populated by expert judgment. This is technically Subjectivist work dressed in Propensity clothing.
  *   **The Risk:** If you label it Propensity, the Board will treat it as a physical constant (like gravity). If you label it Subjectivist, they may treat it as a guess.
  *   **The Fix:** Use the wording "Model-Based Reliability." It signals Propensity (it's about the model of the dam) without claiming metaphysical physical constants.

  **2. The Stationarity Trap in Frequentism**
  In Case 1 (River Flow), I allowed Frequentist despite the stationarity warning. This is the biggest liability trap in hydrology right now.
  *   **The Risk:** If you publish a Frequentist probability ("1-in-100 year flood") and the climate shifts, the number becomes factually wrong, not just uncertain.
  *   **The Fix:** Always attach the phrase "under current climate conditions." If the Board refuses that qualifier, you must trigger Step 4 (Values Hand-Off) and refuse to sign the technical warrant.

  **3. The "Single Number" Coercion**
  Step 3.2 requires ranges for Subjectivist claims. Boards hate ranges. They want "0.4%" not "0.1% to 0.9%."
  *   **The Risk:** Collapsing a distribution into a mean for a Subjectivist claim hides the epistemic uncertainty. It turns a "degree of belief" into a "false precision."
  *   **The Fix:** If forced to provide a point estimate for a Subjectivist claim, you must document the variance in the technical appendix and reference it in the main text (e.g., "0.4% (median estimate)").

  **4. The Distinction Itself**
  Philosophically, the Frequentist/Propensity/Subjectivist lines are porous. A Bayesian updates frequencies; a Propensity is often estimated via Subjective priors.
  *   **The Reality:** This procedure is not ontological truth; it is **liability management**. It forces you to identify *why* you believe the number.
  *   **The Failure Mode:** If you find yourself arguing semantics rather than data, stop. The distinction is serving the document's legal clarity, not scientific purity. If the Board understands "Expert Consensus" better than "Subjectivist Probability," use the plain English term, but keep the PWP classification in your internal files for audit defense.

  **Final Instruction:**
  Print the Checklist. Keep it in your project folder. When the Board asks for a number, run the claim. If the claim fails the checklist, do not generate the number. Generate a memo explaining *why* the number cannot be warranted. That memo is your professional shield.
