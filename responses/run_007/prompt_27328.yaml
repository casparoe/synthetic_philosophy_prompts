  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Clinical Utility.* (Non-negotiable). If it doesn't help patients, why do it?
      *   *Desideratum 2: Causal/Etiological Validity.* (Realist commitment). We want to know *why*, not just *what*.
      *   *Desideratum 3: Reliability/Operationalization.* (Non-negotiable for science).
