      *   Implication: A purely static, Platonic realist theory (like chemistry) fails because the "elements" talk back.
      *   Requirement: The theory must account for *feedback loops* between classification and classified.
      *   Tension: If kinds change due to classification, can they be "natural kinds"?
      *   Resolution: Maybe "dynamic kinds" or "homeostatic property clusters" that include social feedback as a causal mechanism. Or accept a weaker realism.

  5.  **Addressing "Non-Negotiable" vs. "Camp-Specific":**
      *   *Non-Negotiable:* Must help patients (Utility), must be consistent (Logic), must acknowledge harm (Normativity).
