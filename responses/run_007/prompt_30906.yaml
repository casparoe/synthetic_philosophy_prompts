answer: |-
  **Project Title:** Pleasure as Computational Role: A Functional Solution to the Heterogeneity Problem

  **Research Question**
  Can defining pleasure as a specific computational role (a reward signal within a reinforcement learning architecture) resolve the heterogeneity problem for hedonism without collapsing the theory into desire-satisfactionism?

  **Background and Problem Statement**
  Classical hedonism relies on the premise that "pleasure" is a unified natural kind that grounds value. However, the **Heterogeneity Problem** suggests no such kind exists.
  1.  **The Phenomenal Account:** Claims pleasures share a common "felt quality." This fails because the phenomenology of distinct pleasures (e.g., relief from pain, aesthetic appreciation, schadenfreude) is too diverse to share a single qualitative thread.
  2.  **The Attitudinal Account:** Claims pleasure is merely the attitude of "wanting for its own sake." This saves unity but sacrifices distinctiveness; if pleasure is defined entirely by disposition to seek, hedonism becomes indistinguishable from desire-satisfaction theory, losing its normative bite (i.e., the claim that *feeling* good matters, not just getting what you want).

  Current debates assume a false dichotomy: that the unifying feature of pleasure must be either a *phenomenal quality* or a *propositional attitude*. This project proposes a third option: **Functionalism.**

  **Methodology**
  This is a conceptual analysis project grounded in interdisciplinary synthesis. I will not conduct empirical experiments. Instead, I will:
  1.  **Analyze** the logical structure of the heterogeneity objection in recent meta-ethical literature.
  2.  **Synthesize** philosophical functionalism with computational models of valence from reinforcement learning (RL) literature. Specifically, I will examine the concept of the "reward prediction error" as a candidate for the "pleasure signal."
  3.  **Construct** an argument showing how a signal can be functionally identical across diverse implementations (different feelings) without being identical to the policy output (desire/seeking behavior).

  **Expected Outcomes and Success Conditions**
  A successful project will produce a paper demonstrating that:
  1.  **Unity without Phenomenology:** Diverse experiences count as "pleasure" because they play the same causal role in learning and policy updating, even if they feel different.
  2.  **Distinction from Desire:** The *reward signal* (pleasure) is distinct from the *policy update* (desire). One can have the signal without the disposition to seek (e.g., in cases of weakness of will or chemical stimulation), preventing the collapse into desire-satisfactionism.
  3.  **Normative Preservation:** The account preserves the hedonistic intuition that internal states matter, not just external satisfaction.

  **Failure Conditions**
  The project will be considered unsuccessful if:
  1.  The "computational role" turns out to be extensionally equivalent to "disposition to seek," merely rebranding the attitudinal account.
  2.  The account implicitly relies on a specific phenomenology to identify the signal, reverting to the phenomenal account.
  3.  The scope expands into solving the Hard Problem of Consciousness rather than addressing the specific heterogeneity objection.

  **Scope and Timeline (One Semester)**
  *   **Weeks 1–4:** Literature review on the heterogeneity problem (Sidgwick to contemporary) and introductory RL/valence literature.
  *   **Weeks 5–9:** Drafting the core argument: mapping the "reward signal" to the philosophical concept of "pleasure."
  *   **Weeks 10–12:** Addressing objections (e.g., wireheading, philosophical zombies, non-learning pleasures).
  *   **Weeks 13–15:** Revision and final polish.

  **Significance**
  If successful, this proposal offers a way to salvage hedonism as a distinct, viable normative theory by updating its metaphysics of mind. It moves the debate beyond the stalemate of "feeling vs. wanting" by utilizing a robust framework for understanding value in cognitive systems.
