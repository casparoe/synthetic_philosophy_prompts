      *   *The Breakdown:* Biological determinism (Dennett) vs. Authorial Determinism (Stoppard). In Dennett's world, *I* am the cause (via my brain states). In Stoppard's, *Stoppard/Shakespeare* is the cause. This is the "manipulation" clause Dennett worries about.

