      *(Self-Correction)*: Wait, I need to be careful not to conflate Ryle's anti-dualism with the game design mind/body split. Ryle was attacking the "Ghost in the Machine." In games, the "machine" is the console/avatar. The player is the ghost. Actually, Ryle says the mind *is* the behavior. In games, skill *is* the input sequence. That's a strong link. I should highlight that.

