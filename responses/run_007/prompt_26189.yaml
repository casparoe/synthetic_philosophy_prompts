      *   **Core Problem:** Distinguishing between knowledge that can be told (tooltip/tutorial) vs. knowledge that must be felt/learned through doing (timing, intuition, execution).
      *   **Philosophical Reference:** Gilbert Ryle's "Knowing How" vs. "Knowing That" (from *The Concept of Mind*, 1949). Specifically, the regress argument (intellectualist legend).
      *   **Task:**
          1.  Restate Ryle's distinction and regress argument *entirely* in game design vocabulary (explicit/implicit tutorials, declarative/procedural, frame data vs. muscle memory, etc.).
          2.  Provide a "Residue Report": What translated cleanly? What was stretched/distorted? What has no expression in game design terms?
          3.  Analyze the Residue: Does it show a gap in game design theory, or a flaw in Ryle's argument when operationalized?
      *   **Tone:** Professional, precise, honest, bridging philosophy and game design.

  2.  **Deconstruct Ryle's Argument (Mental Sandbox):**
      *   *Knowing That:* Propositional knowledge. Facts. "The parry window is 5 frames."
      *   *Knowing How:* Dispositional knowledge. Skills. Actually parrying consistently.
      *   *The Intellectualist Legend:* The idea that "Knowing How" is just "Knowing That" + "Thinking about it."
      *   *The Regress:* If I need a rule to tell me how to act, I need a rule to tell me how to apply that rule, ad infinitum.
      *   *Ryle's Conclusion:* Knowing How is sui generis (its own thing). It's a disposition/ability, not just internalized facts.

  3.  **Translate to Game Design Vocabulary:**
      *   *Knowing That* $\rightarrow$ Explicit Tutorialization, Declarative Knowledge, Tooltips, Loading Screen Tips, Design Docs, Frame Data Charts.
      *   *Knowing How* $\rightarrow$ Procedural Skill, Muscle Memory, Game Sense, Implicit Tutorialization, Execution Check, Flow State.
      *   *The Regress* $\rightarrow$ If execution required consulting a mental wiki, you'd need a meta-skill to consult the wiki in real-time, and a meta-meta-skill to know when to consult... leading to analysis paralysis (the "freeze up" the user mentioned).
      *   *Onboarding* $\rightarrow$ The process of converting *That* into *How* (or bypassing *That* entirely).

  4.  **Drafting Section 1: The Translation (The "Designer's Ryle"):**
      *   Need to sound like a senior systems designer talking to another.
      *   Use terms like "cognitive load," "input latency," "mental model," "feedback loop."
      *   Frame the regress argument as a "UI/UX bottleneck" or "processing pipeline" issue.
      *   *Key metaphor:* The difference between reading the patch notes and having the rank.

  5.  **Drafting Section 2: The Residue Report:**
      *   *Clean Translations:* The distinction itself is perfect. Game design lives on this split.
      *   *Stretches:* Ryle talks about "intelligent action" broadly. Game design narrows this to "interaction with a system." Ryle's "disposition" is broader than "muscle memory."
      *   *Missing/No Expression:* Ryle cares about *normativity* (doing it *right* vs. just doing it). Games have win states, but Ryle means moral/rational correctness. Also, Ryle's focus on the *mind* vs. the *body* (dualism critique) doesn't map perfectly to "brain vs. hands" because game skills are often cognitive-procedural hybrids (e.g., resource management).
      *   *The "Ghost" in the machine:* Ryle was attacking Cartesian Dualism. Game design often implicitly accepts a dualism (Input $\rightarrow$ Processing $\rightarrow$ Output).

  6.  **Drafting Section 3: Analysis of the Residue:**
      *   *Is Design Missing Something?* Yes. We treat "skill" as a stat or a curve, but rarely analyze the *ontology* of the skill acquisition. We assume "practice makes perfect" without defining *what* is changing in the player.
      *   *Is Ryle Weaker?* Not necessarily weaker, but his argument is metaphysical. In games, we *can* sometimes reduce "how" to "that" via assist modes or auto-play. This challenges Ryle slightly (technology can bridge the gap).
      *   *Synthesis:* The residue suggests game design needs a better theory of "internalization." We measure retention and churn, but not the phenomenological shift from explicit to implicit.

