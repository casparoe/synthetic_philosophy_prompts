prompt: |-
  I've been working my way through some older philosophy of mind and animal cognition literature, and a pattern keeps surfacing that I can't quite pin down with the vocabulary I have. The pattern goes like this: you observe a system — an animal, a piece of software, a bureaucracy — performing a sequence of actions that looks intelligent and goal-directed. It adjusts to circumstances, it completes sub-tasks in order, it seems to "know what it's doing." But then you notice that the whole performance is keyed to a very specific triggering condition, and if you interrupt the sequence at just the wrong point, the system doesn't improvise or find a workaround — it loops back to the beginning and starts the entire routine over, even when that makes no sense by its own apparent goals. The example that got me thinking about this is a solitary wasp I read about (I think in the context of a discussion of free will): the wasp brings a paralyzed cricket to the entrance of its burrow, leaves it there, goes inside to inspect the nest, comes back out, and then drags the cricket in. If an experimenter nudges the cricket a few inches away while the wasp is inside, the wasp emerges, finds the cricket, drags it back to the entrance — and then, instead of just taking it inside, goes down into the burrow again to repeat the inspection step. It will do this dozens of times, never "catching on" that the inspection is redundant. What interests me is that this isn't just a failure of intelligence in a general sense — it's a very specific kind of failure where the behavior presents all the outward marks of flexible, means–end rationality right up until the moment it doesn't, and the brittleness is invisible unless you probe at exactly the seam the system isn't built to handle. I've started noticing analogues in automated phone trees that send you back to the main menu when they can't parse your response, in institutional procedures that restart a multi-step review because one box wasn't checked, and arguably in certain human cognitive habits — though I'm less sure about that last one.

  I'm trying to find out whether there is an established term for this specific configuration: the gap between the apparent purposiveness of a behavior and its underlying mechanical rigidity, where the rigidity is revealed only by interrupting the routine at a point the system has no provision for. I'm aware of several nearby concepts — fixed action patterns in ethology, stimulus–response chains, maybe something in Dennett's work on the intentional stance, and certainly the broader idea that apparent intelligence can be underlain by simple mechanisms. But what I'm after is narrower: not just any rigid behavior, and not just any case where something looks smarter than it is, but this particular structure where the behavior is complex and multi-step, looks flexible in normal operation, and has a specific kind of brittleness that shows up as compulsive restarting when the world deviates from the script at an un-handled juncture. Does this have a name? If it does, how exactly is the concept defined, and what are its boundaries — does it apply to humans, to institutions, or only to simpler systems? If it doesn't have a name, what are the closest concepts, how do they fall short, and what would you propose calling it? I'm also interested in whether the concept, once clarified, has any philosophical traction: does it mark a distinction that matters for debates about free will, or about the difference between genuine and merely apparent agency?

  Please structure your response in the following sections, in this order:

  - **Nearest Established Concepts** (roughly 250 words): identify the concepts in philosophy, ethology, or cognitive science that come closest to capturing the phenomenon I've described, with brief definitions of each.
  - **How the Described Phenomenon Differs** (roughly 250 words): for each candidate concept, explain where it matches the description and where it diverges — what it includes that I'm not pointing at, or what it misses that I am.
  - **Which Fits Best, and Whether a New Term Is Needed** (roughly 200 words): give your verdict on whether an existing term adequately covers the phenomenon, and if so which one and why; if not, explain why the gap is real.
  - **Proposed Term and Definition** (roughly 200 words): if you think a new term is warranted, propose one, define it precisely, and give its boundary conditions. If you think an existing term suffices, use this section to refine its definition so it captures the phenomenon more sharply.
  - **Philosophical Significance** (roughly 200 words): discuss whether this phenomenon, once properly named and bounded, has implications for debates about free will, agency, or the nature of intelligence — or whether it's merely a curiosity with no deeper philosophical weight.
