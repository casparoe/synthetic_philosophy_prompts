answer: |-
  The verificationists claim all truth is light:
  That truth is knowable, or so they say.
  For every truth, $\Diamond Kp$ shines bright,
  Yet much remains concealed from human day.
  There are some truths beyond our mental sight,
  So some $p \land \neg Kp$ holds its sway.
  An unknown truth stands in the logical night,
  Where fact and knowledge drift and go astray.

  Now take that unknown truth and make it one:
  Conjoin the fact with ignorance of it.
  If knowable, the collapse has now begun:
  A state that logic cannot permit.
  Thus Knowability forces all truths known,
  Since not all known, some seeds are never sown.
