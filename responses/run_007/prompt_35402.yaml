answer: |-
  Dear Colleague,

  It is wise to survey the terrain before committing to a specific construction, especially in a domain as fraught as the relationship between credence and chance. You are right to look beyond Lewis's Principal Principle as the final word, treating it instead as a landmark that defines the surrounding problems. To begin, any adequate theory must capture the core intuitive datum that forces the entire discussion onto the agenda. This is the observation that when a rational agent knows the objective chance of an event, her credence in that event should align with the chance. The case that forces this requirement is the simplest probabilistic scenario, such as knowing a coin is physically fair. If you know the chance of heads is 0.5, it seems irrational to hold a credence of 0.9. This requirement is largely non-negotiable because without it, the concept of objective chance loses its epistemic significance; however, the exact form of the alignment is where the debate begins. You need a theory that specifies whether this is a unconditional equality or a conditional one. Lewis argued it must be conditional on admissible evidence, but stating this precisely is the first major hurdle. The requirement here is to provide a formal schema, typically involving conditional probability, that captures this deference without collapsing into triviality.

  This leads directly to the problem of admissibility, which generates the next strict desideratum. You must provide a principled account of what counts as admissible evidence and why. The case that forces this onto your list is the scenario of inadmissible information, such as looking into a crystal ball or having knowledge of the future outcome. If an agent knows the coin will land heads, her credence should be 1, not 0.5, even if the chance is 0.5. Therefore, the theory must rule out such evidence from the conditioning set when applying the deference principle. Is this non-negotiable? Yes, because without a distinction between admissible and inadmissible evidence, the principle yields contradictions in cases of foreknowledge. However, defining admissibility without circularity is notoriously difficult. Lewis offered a tentative definition involving historical information, but many find it unsatisfactory. Your theory must either refine this definition or explain why the distinction emerges from the metaphysics of chance rather than being stipulated.

  Closely related to admissibility is the problem of undermining futures, which Lewis himself identified as a critical threat to his own system. This requirement demands that your account handle cases where evidence about the future pattern of events undermines the present chance assignment. The forcing case arises specifically within Humean metaphysics, where chances supervene on the total history of events. If the best system analysis implies that a certain future sequence of outcomes would make the present chance different than it currently appears to be, then knowing that future sequence is possible seems to undercut the current chance. Lewis viewed this as a bug that required modifying the Principal Principle, but some successors argue it is a feature that reveals the need for a revised understanding of deference. This is a high-priority constraint because if your theory cannot accommodate the logical possibility of undermining without contradiction, it may be incompatible with Humean supervenience. Whether this is non-negotiable depends on your metaphysical commitments; if you are willing to abandon Humeanism, the problem dissolves, but if you wish to remain neutral, you must solve it.

  This brings us to the requirement of metaphysical compatibility. Your theory should ideally be compatible with whatever the correct metaphysics of chance turns out to be, whether Humean or non-Humean, or else it must argue persuasively for one over the other. The case forcing this is the divergence between propensity theories, which view chances as primitive physical properties, and Best System accounts, which view them as summaries of patterns. Lewis argued that the Principal Principle actually refutes Humeanism because of the undermining problem, implying that a correct theory of credence-chance relations might dictate metaphysics. This is a significant pivot point. You can treat metaphysical neutrality as a desideratum, but you must be prepared to drop it if the arguments show that only one metaphysics can sustain the required normative link between chance and credence. If your theory presupposes a specific metaphysics, that presupposition must be defended as part of the package, not hidden in the background.

  Another critical area is dynamic consistency, which requires your account to make sense of the fact that chances are time-indexed and evolve as time passes. The forcing case here is any situation where an agent updates her beliefs over time. The theory must not generate contradictions when combined with Bayesian conditionalization. If an agent defers to chance at time t1 and then learns new evidence at t2, her new credence should be consistent with both conditionalization and the new chance values. Furthermore, the theory must cohere with principles like van Fraassen's Reflection Principle, which relates current credence to expected future credence. This is often treated as a non-negotiable constraint on rationality, yet there are known tensions here. If the Principal Principle and the Reflection Principle yield different instructions for updating credence in light of changing chances, you have a conflict that must be resolved. Some philosophers argue that Reflection should be modified to accommodate chance, while others argue that the Principal Principle needs adjustment to fit Bayesian dynamics.

  You also need to ensure the theory connects properly to causal decision theory, since chances are the quantities supposed to guide action in uncertain environments. The case forcing this requirement involves Newcomb-style problems or scenarios where causal efficacy is separated from evidential correlation. If your account of credence-chance relations does not yield the correct recommendations for action in these cases, it fails to capture the practical role of chance. This is generally considered a non-negotiable constraint because the primary philosophical motivation for positing objective chance is often its role in explaining rational action and physical propensity. If the credence guided by chance does not lead to successful decision-making, the link between chance and credence becomes purely theoretical and loses its normative force.

  There is also a foundational question regarding the status of the constraint itself. You must address whether the principal constraint is a constraint on what chance is, serving as a conceptual role that defines chance, or a constraint on what rational credence is, serving as a norm of rationality. The case forcing this distinction arises when we consider worlds where the principle fails. If the principle is conceptual, then there are no chances in worlds where rational agents do not defer to them. If it is a norm, then chances might exist even if agents are irrational. Lewis treated it as conceptual analysis, but others see it as a substantive normative bridge. This choice changes the shape of the theory significantly. While you might treat this as a philosophical preference, it is better viewed as a non-negotiable clarification because ambiguity here leads to equivocation in arguments about the principle's validity.

  Finally, and perhaps most urgently for your paper, you must address the known impossibility results and no-go theorems that suggest some subsets of these requirements are jointly unsatisfiable. There is a significant tension, highlighted by work from Lewis, Hall, Arntzenius, and others, between three claims: that chances are Humean, that rational credence obeys the Principal Principle, and that credence updates via Bayesian conditionalization. The conflict arises because Humean chances depend on the future, but Bayesian conditionalization treats evidence about the future as updating current credence in ways that can violate the Principal Principle if not carefully managed. Specifically, if you know the chances are Humean, you know they depend on the future, which makes information about the future admissible in a way that undermines the chance itself. This creates a triad where you may have to drop one horn. Additionally, there are conflicts between the Principal Principle and the Reflection Principle when chances are expected to change without new evidence about the outcome, known as the problem of certain future chances. These are not merely desiderata but formal constraints that suggest you cannot have everything. You will likely need to argue that one of these constraints is less fundamental than the others, or propose a modified principle that navigates between them.

  In sum, you are walking a tightrope between metaphysical commitments, normative requirements, and formal consistency. The most dangerous pitfall is assuming that the intuitive pull of the Principal Principle is strong enough to override the formal contradictions that arise when you combine it with Bayesianism and Humeanism. My advice is to treat the metaphysical compatibility and the dynamic consistency requirements as the stress points where the theory is most likely to break. You should explicitly state which constraint you are willing to relax if a contradiction arises, rather than hoping to satisfy all of them simultaneously. The landscape is littered with attempts to keep everything, and the most successful recent work tends to be those accounts that clearly prioritize either the metaphysics of chance or the norms of rationality and adjust the other to fit. I hope this overview helps you map out your argument without getting lost in the thickets of previous formulations.

  Best regards,

  Your Colleague
