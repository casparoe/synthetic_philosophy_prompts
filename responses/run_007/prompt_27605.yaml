      *   *Focus on (6):* Even if frameworks rest on hinges, they aren't equal. Why? Because hinges aren't isolated. They form a system (OC §142). Some systems work better for prediction, control, and coherence with other certainties. The 'oracle' system might have hinges, but does it mesh with the rest of our picture of the world? Also, Wittgenstein allows for the *conversion* of propositions. What is a hinge in one system might be a testable hypothesis in another, or vice versa.
