      *   **Step (6):** "If foundations are arbitrary, then no framework... is more rationally justified." This assumes a neutral standpoint from which to compare frameworks. Wittgenstein denies the possibility of a "view from nowhere." We judge from *within* a system. But does this lead to relativism? Not necessarily. It leads to a rejection of *absolute* justification, not *local* or *pragmatic* superiority.

