answer: |-
  This is a formidable objection, and it is one that haunts almost every seminar on *On Certainty*. Your friend has constructed a clean *reductio* that targets the vulnerability of hinge epistemology: the spectre of relativism. It is the sort of argument that keeps Wittgensteinians awake at night.

  To address this properly, we must first disentangle the terminology, as the force of the argument relies heavily on equivocation.

  ### Brainstorming: 'Arbitrary' and 'Foundations'

  **1. 'Arbitrary'**
  *   **Voluntarist sense:** Chosen at will, without constraint. If I pick a number between 1 and 10, that is arbitrary.
  *   **Groundless sense:** Lacking a further reason or justification. If I say 'I am in pain', there is no evidence I offer; it is groundless, but is it arbitrary?
  *   **Pejorative sense:** Capricious, unreasonable, or lacking a basis in reality.
  *   **Wittgensteinian sense:** 'Without a ground' (*grundlos*). Crucially, for Wittgenstein, 'groundless' does not imply 'unreasonable'. It implies that the 'game' of giving reasons has reached its bedrock.

  **2. 'Foundations'**
  *   **Architectural:** Static, load-bearing blocks upon which a structure rests. If these are removed, the building collapses. This suggests they are distinct from the building.
  *   **River-bed:** Wittgenstein's own metaphor (§96–99). The bed guides the water, but the bed itself can shift over time. It is part of the same system, not a separate support.
  *   **Biological/Pragmatic:** Inherited ways of acting. Not propositions we assent to, but things we *do*.

  ### The Diagnosis: Rejecting Steps (4) and (6)

  I am inclined to reject the inference at **(4)** and the implication at **(6)**. While they possess an initial plausibility, they import externalist or internalist assumptions that Wittgenstein is explicitly dismantling.

  #### Why Step (4) Looks Right
  > *(4) But a belief held without evidence is arbitrary.*

  This premise feels compelling because it inherits the Cartesian and empiricist tradition which equates rationality with justification. In standard epistemology, if you cannot cite a reason for $p$, your holding of $p$ is indeed suspect. If I believe it will rain but cannot point to a barometer or a cloud, my belief appears arbitrary. Your friend is applying this norm to the hinges themselves. It looks right because it treats hinges as if they were ordinary empirical claims that have simply lost their supporting data.

  #### Why Step (4) is Wrong
  However, this mischaracterises the modal status of a hinge. For Wittgenstein, a hinge certainty is not a 'belief held without evidence'; it is a **way of acting** that manifests in our language-games (§204, §310).

  To call it 'arbitrary' implies a choice was made. But we do not *choose* to accept that the world exists or that objects don't vanish when unobserved. We find ourselves compelled to act this way. As Wittgenstein writes, "I act with *complete* certainty. But this certainty is my own" (§174). It is animal, not intellectual.

  Therefore, 'groundless' does not mean 'arbitrary' in the voluntarist or pejorative sense. It means 'unjustifiable' only in the sense that justification comes to an end. The end of justification is not an arbitrary stopping point; it is determined by our form of life. To call the bedrock of the river 'arbitrary' is to misunderstand that it is what *makes* the flow possible. It is not a random obstacle; it is the channel.

  #### Why Step (6) Looks Right
  > *(6) If the foundations of inquiry are arbitrary, then no framework of inquiry is more rationally justified than any other...*

  This follows naturally if one accepts (4). If the bedrock is arbitrary, then one bedrock is as good as another. This suggests a radical conceptual relativism where science and oracle-worship are merely different 'games' with no neutral court of appeal. This looks right because Wittgenstein explicitly denies a 'view from nowhere' (§104). We cannot step outside our system to judge it.

  #### Why Step (6) is Wrong
  Even if we grant that frameworks rest on different hinges, it does not follow that they are on an **epistemic par**.

  First, not all 'hinges' are compatible with the rest of the system. A conspiracy theory often functions by immunising its hinges from *any* interaction with empirical reality (e.g., 'all contrary evidence is part of the conspiracy'). Wittgenstein notes that some propositions are so fundamental that to doubt them is to lose the ability to judge anything else (§494). A system that systematically disconnects from the 'river-bed' of shared human action ceases to be a language-game we can recognise.

  Second, 'rational justification' is internal to a system, but systems themselves can be evaluated pragmatically. We prefer the scientific framework not because its hinges are 'truer' in a transcendent sense, but because the *superstructure* built upon them allows for prediction, control, and coherence with other certainties we are unwilling to surrender (e.g., 'I have parents', 'the earth is old').

  Wittgenstein is not saying 'anything goes'. He is saying that the 'going' is determined by where we actually stand. We are entitled to say the oracle-worshipper is wrong, not because we have a God's-eye view, but because *our* picture of the world—the one that allows us to build bridges and cure diseases—compels us to reject theirs. It is a matter of persuasion and conversion, not proof (§105), but that does not render the two positions equal in value or utility.

  ### The Cost of This Rejection

  Rejecting (4) and (6) comes at a price. We must abandon the dream of **absolute justification**. We cannot prove to the oracle-worshipper that they are wrong using neutral premises, because there are no neutral premises. We can only show them how our system works and hope they adopt it.

  This means accepting that rationality is, to a degree, local to a 'form of life'. We lose the ability to claim science is 'Objective' with a capital 'O' in a way that transcends human practice. We must be content with a robust, pragmatic realism: science is better because it works for *us*, and 'us' is defined by the very hinges we are defending. This is a quietist cost; it silences the metaphysical urge to ground our knowledge in something beyond human practice.

  ### Where My Diagnosis Might Fail

  My defence relies heavily on the **dissolution of the propositional status of hinges**. This aligns with the 'non-epistemic' reading (championed by Danièle Moyal-Sharrock), where hinges are rules or ways of acting, not knowledge-claims.

  However, if the **epistemic reading** (championed by Duncan Pritchard) is correct—that hinges *are* propositions but we have a non-evidential 'entitlement' to them—then your friend's argument gains traction. If hinges are beliefs, and beliefs aim at truth, then holding them without evidence *does* look suspicious. If they are propositional attitudes, Step (4) becomes harder to resist. If hinges are simply 'beliefs we can't prove', the charge of arbitrariness is more difficult to deflect.

  Furthermore, my defence might fail if one insists that 'arbitrary' simply means 'contingent'. Our form of life *is* contingent; we could have been different. If our hinges are contingent facts about human biology/history, then in a strong metaphysical sense, they are 'arbitrary' (not necessary). If that is the definition your friend is using, I cannot deny it. I can only deny the *pejorative* consequence that follows in Step (7).

  ### What Would Change My Mind

  I would be compelled to accept your friend's conclusion if it could be demonstrated that **action implies belief** in a way that resurrects the demand for evidence.

  If one could show that acting with certainty *just is* holding a belief that aims at truth, and that aiming at truth *necessarily* requires evidence (even if implicit), then the 'groundless' nature of hinges would indeed be a defect. If it turned out that the 'oracle' framework produced the same predictive success and internal coherence as science, and rested on hinges just as deep-seated for its practitioners, I would struggle to maintain that science is epistemically superior without smuggling in a circular appeal to scientific hinges.

  If a community of oracle-worshippers could be shown to navigate the world as successfully as we do, without contradiction, my pragmatic defence would crumble. But until then, I maintain that the 'river-bed' of science allows for a flow of inquiry that the oracle's bedrock blocks. That difference in flow is enough to break the parity, without needing to prove the bedrock itself.

  ***

  In sum, your friend's argument is a potent reminder of the risks of *On Certainty*, but it conflates 'groundless' with 'unreasonable'. We can keep the hinges and keep science superior, provided we accept that the superiority is found in the fruit of the tree, not the metaphysical status of the roots.
