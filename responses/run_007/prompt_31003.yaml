      *   *The Crux:* Does the Careenium show that higher-level patterns *are* causal, or just that talk *about* them is useful? Does it solve the exclusion problem, or dissolve it? A strong student needs to see that Dennett is changing the subject from "causal oomph" to "explanatory utility."

