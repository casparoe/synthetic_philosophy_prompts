answer: |-
  This is a splendid question. It cuts right to the heart of why writers often find philosophy tantalising but occasionally frustrating: philosophers love a good slogan, but slogans often hide the machinery.

  The phrase 'the self is a centre of narrative gravity' comes from the philosopher Daniel Dennett. It is indeed seductive, but as you have sensed, it is slippery. Your workshop colleague used it to suggest that looking for a 'real self' beneath the story is a mistake. To push back effectively, you need to know that this slogan can be read in at least three distinct ways, ranging from a harmless observation to a highly controversial metaphysical claim.

  Here is a breakdown of the precise theses that slogan might be expressing, assessed for plausibility and defensibility.

  ### 1. The Epistemic Thesis (The 'Lens' View)
  **The Claim:** Human beings cannot understand themselves or others except through narrative structures. We *need* stories to make sense of actions, motives, and changes over time.
  **The Metaphor:** The centre of gravity is a point we calculate to make sense of how an object moves. Similarly, 'selfhood' is a point we calculate to make sense of how a person behaves.
  **Plausibility:** High. It is difficult to dispute that humans are storytelling creatures. Cognitive psychology generally supports the idea that we organise memory and identity narratively.
  **Defensibility:** Very defensible. It doesn't deny there is a brain or a body underneath; it just says our *access* to identity is narrative.
  **Does it support your colleague?** No. This thesis says we need stories to *know* the self. It leaves open the possibility that there is a 'thing' being known, even if our knowledge of it is story-shaped.

  ### 2. The Constitutive Thesis (The 'Weaving' View)
  **The Claim:** The self does not exist prior to the narrative; the act of narrating *creates* the unity of the self. Without the story, there is only a disjointed bundle of experiences, not a person.
  **The Metaphor:** A centre of gravity does not exist without the mass distributed around it. The 'self' emerges from the distribution of events in the story.
  **Plausibility:** Moderate. This is the standard view in 'Narrative Identity Theory' (e.g., Marya Schechtman). It suggests identity is an achievement, not a given.
  **Defensibility:** Defensible, but with caveats. It struggles to account for pre-linguistic infants or people with severe amnesia who still seem to possess a form of selfhood or moral status.
  **Does it support your colleague?** Partially. This supports the idea that you can't peel the story away to find the self, because the self is the pattern of the story. However, it still implies the *materials* of the story (the mass) are real.

  ### 3. The Eliminativist Thesis (The 'Fiction' View)
  **The Claim:** There is literally nothing but the story. There is no underlying subject, no 'homunculus', no psychological core. To ask what someone is 'really like' beneath the narrative is like asking where the centre of gravity is located in a vacuum—it's a category mistake.
  **The Metaphor:** A centre of gravity is a mathematical abstraction. It is not a physical thing you can touch. Therefore, the self is an abstraction, not a physical or psychological thing.
  **Plausibility:** Low to Moderate (highly contested). This is the radical reading. While Dennett leans this way, many philosophers of mind argue he is throwing the baby out with the bathwater.
  **Defensibility:** Controversial. It risks conflating 'not a physical object' with 'not real'. Emotions, for instance, aren't physical objects you can hold, but they are real.
  **Does it support your colleague?** Yes. This is exactly the move they made. They used the abstraction of the centre of gravity to imply the non-existence of the 'mass' (the inner life/temperament/biology).

  ***

  ### Where the Metaphor Becomes Metaphysics

  You asked specifically about the boundary between the literary observation and the philosophical claim. This is the crux of the matter.

  **The Metaphor (Safe Ground):**
  In physics, a centre of gravity is a useful fiction for calculation. It helps predict how a tumbling box will fall. However, no physicist denies the existence of the box. The mass is real; the 'centre' is just a way of summarising the mass's distribution.
  *   *In literature:* The 'self' is a useful way to summarise a character's actions and history.
  *   *Confidence:* I am highly confident this is the intended literary utility.

  **The Metaphysics (Dangerous Ground):**
  The shift happens when one argues that because the *label* ('centre of gravity') is an abstraction, the *substance* (the mass/person) must also be illusory or irrelevant.
  Your colleague committed a slight sleight of hand here. Dennett's point is usually that the self is real, but its *ontology* (its mode of existence) is abstract, like a software program or a legal institution, rather than concrete, like a neurone.
  *   *The Error:* Your colleague moved from "The self is an abstraction" to "There is nothing underneath the story."
  *   *Why it matters for a novelist:* Even if the self is a narrative construct, the *constraints* on that narrative are real. A character's biology, trauma, temperament, and unconscious drives act as the 'mass' that creates the gravity. You cannot tell just any story about just any person. A pacifist cannot suddenly become a berserker without a narrative bridge, because their underlying 'mass' (psychology) resists it.

  ***

  ### How to Push Back

  If you wish to challenge this next time, you need not deny the utility of the phrase. Instead, you should challenge the inference your colleague drew from it.

  **The Argument:**
  "Accepting that the self is a centre of narrative gravity doesn't mean there's no mass generating that gravity. In physics, you can't have gravity without mass. In character psychology, the 'mass' is the unconscious, the biological temperament, the trauma, the habits that exist before the character starts telling themselves a story. If we say there is *only* the story, we lose the tension between who a character thinks they are (the narrative) and who they actually are (the mass). That tension is where the drama lives."

  This allows you to keep the clever slogan while reclaiming the necessity of deep, coherent inner lives.

  ***

  ### Confidence Check

  You asked me to be upfront about where I am least sure.

  1.  **High Confidence:** I am very confident in the distinction between the Epistemic and Constitutive theses. This is standard terrain in philosophy of mind and literary theory.
  2.  **High Confidence:** I am confident that your colleague's usage aligns with the Eliminativist reading (Thesis 3), and that this is a common (perhaps too common) interpretation of Dennett in literary circles.
  3.  **Moderate Confidence:** I am moderately confident in my attribution of Dennett's specific intent. Dennett is notoriously difficult to pin down; he sometimes writes for cognitive scientists and sometimes for a general audience. He often oscillates between saying the self is an 'illusion' and saying it is 'real but abstract'. Philosophers still argue over whether Dennett is an eliminativist or a functionalist.
  4.  **Low Confidence:** I am least sure about the *consensus* view among contemporary novelists regarding this. While I know the theoretical landscape, I cannot be certain how prevalent this specific anti-essentialist view is in current creative writing pedagogy. It may be that in a workshop context, the 'radical' reading is treated as more orthodoxy than it is in academic philosophy.

  ### Summary for your Retreat

  *   **The Slogan:** Useful, but ambiguous.
  *   **The Colleague's Move:** They jumped from "The self is a story" to "There is nothing but the story."
  *   **The Counter:** A story needs a teller and material. The 'inner life' is the material. Without it, the narrative has no weight.
  *   **The Boundary:** The metaphor breaks when it denies the existence of the thing being measured.

  If you frame your pushback around the necessity of 'mass' to create 'gravity', you honour the philosophy while protecting the novelist's right to explore the deep, messy, pre-narrative depths of a character's psyche.
