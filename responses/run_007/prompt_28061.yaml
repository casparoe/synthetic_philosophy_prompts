      *   *Tension B (3 vs. 6):* Point (3) attributes "simulating possible actions and anticipating outcomes" to corvids/octopuses. Point (6) says "Genuine thought... requires... reflect on one's own thinking... symbol system." Does simulation count as reflection? If an octopus simulates, is it "thinking"? Point (6) seems to exclude the animals praised in (3) from "genuine thought."
