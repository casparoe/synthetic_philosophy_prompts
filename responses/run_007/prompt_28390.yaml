prompt: |-
  so my brother's been on dialysis for almost two years and we've been going through the whole donor matching nightmare, and I keep circling back to why we can't just pay people for kidneys. I run a small philosophy podcast and I somehow managed to book a guest who defends legalizing kidney markets — not just as a pragmatic harm-reduction thing but on principled grounds, like there's nothing inherently wrong with selling organs. I want to really press him on the stuff that actually bothers me, not just let him do his standard talking points. can you draft me 8-10 interview questions? I want at least a couple on the exploitation worry (if someone's desperate enough to sell a kidney, is that really free consent?), at least one on whether paying donors would crowd out altruistic donation, and one on the dignity thing — like whether something gets lost when a body part becomes a commodity. and for each question give me a follow-up that anticipates the counterargument he's most likely to make, so I don't let him off the hook too easy.
reasoning: |-
