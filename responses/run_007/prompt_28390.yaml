answer: |-
  Here are 10 interview questions designed to press your guest on the philosophical and ethical complexities of kidney markets, including the specific follow-ups you requested to keep the conversation rigorous.

  ### 1. The Principle of Body Ownership
  **Question:** You argue for this on principled grounds, not just pragmatic ones. Central to your view seems to be the idea of self-ownership—that I have an absolute right to dispose of my body parts as I see fit. But do we actually own our bodies like property, or are we merely *custodians* of them? If I can't legally sell myself into slavery, why is selling a vital organ fundamentally different?

  **Follow-up:** *If he argues that a kidney isn't essential for life (unlike total slavery):* "But it does alter my life expectancy and health trajectory permanently. If the state can stop me from selling myself into slavery to protect my future autonomy, doesn't it have the same interest in stopping me from trading my long-term health for short-term cash?"

  ### 2. Exploitation and "Voluntary" Consent (Part 1)
  **Question:** Let's talk about the seller's mindset. In philosophy, we distinguish between a "free choice" and a "forced choice." If a parent is selling a kidney specifically because they need rent money or to feed their children, is that really consent? Or is that coercion by circumstance?

  **Follow-up:** *If he argues that financial pressure exists in many jobs (like mining or construction):* "Those jobs pay for *time and risk*, but they don't require the permanent removal of a body part to generate the wage. When the labor itself is the mutilation of the body, doesn't the financial desperation invalidate the 'voluntariness' of the act in a way that digging a ditch does not?"

  ### 3. Exploitation and Structural Inequality (Part 2)
  **Question:** Even if we regulate the market, the economic reality is that buyers will generally be wealthy and sellers will generally be poor. Doesn't institutionalizing this create a class of "biological underclass" whose value to society is reduced to their spare parts?

  **Follow-up:** *If he argues that the current waitlist is already biased toward the wealthy/insured:* "Fixing one injustice doesn't justify creating another. If the solution to 'rich people jump the queue' is 'rich people buy organs from poor people,' haven't we just codified the idea that the poor exist to service the biological needs of the rich?"

  ### 4. Commodification and Human Dignity
  **Question:** There's a Kantian worry here: that putting a price on a kidney turns a human being (or a part of one) into a *thing* with a market value. Does something sacred get lost when we shift the language from "the gift of life" to "a transaction for goods"?

  **Follow-up:** *If he argues that we already commodify the body (surrogacy, hair, plasma):* "Plasma regenerates; surrogacy is a service. A kidney is a non-regenerative piece of human infrastructure. If we treat body parts as inventory, does that change how we value the people attached to them? Does it make the poor 'less than' because they are the only ones who can afford to be 'parts donors'?"

  ### 5. Crowding Out Altruism
  **Question:** Behavioral economists worry about "motive crowding." If we introduce money, we might signal that donating is *work* that deserves compensation, rather than a moral good. Won't this dry up the pool of altruistic donors, making us permanently dependent on a market that requires desperation to function?

  **Follow-up:** *If he argues that altruism hasn't been enough to solve the shortage:* "True, but if we switch to a market, we might lose the altruistic baseline entirely. If the market becomes the norm, will future donors feel *entitled* to payment? Are you willing to risk the remaining culture of gift-giving to gamble on a market supply?"

  ### 6. The "Regulation Solves Everything" Defense
  **Question:** Proponents often say, 'We can regulate this to ensure sellers are healthy, compensated fairly, and followed up with.' But given the profit motive of clinics and the desperation of sellers, isn't it inevitable that corners will be cut on long-term care once the transaction is complete?

  **Follow-up:** *If he points to successful models in Iran:* "Iran is often cited, but reports show sellers often face social stigma and long-term health complications without adequate support. If a regulated market in a controlled environment still struggles to protect the seller five years post-op, why do we think a globalized or privatized market would do better?"

  ### 7. Distributive Justice
  **Question:** In a market system, allocation goes to the highest bidder, not the medically urgent. If I have a brother on dialysis (as I do), I want him to get a kidney. But if a wealthier person with a less urgent need can buy their way ahead of him, have we not violated the medical ethic of triage?

  **Follow-up:** *If he argues that a market increases the total supply, helping everyone:* "That's a utilitarian calculation. But on a *principled* level, is it just for access to life-saving treatment to be determined by wallet size rather than medical need? Are you comfortable telling the person who is sicker but poorer that they must wait because someone else paid more?"

  ### 8. The Personal Stake (The "Brother" Question)
  **Question:** I have to ask this personally: If a legal market existed today, and I had the money to buy my brother a kidney from a stranger, I probably would. Does the fact that I, as a desperate family member, *want* this option mean it's ethically sound? Or does my desperation blind me to the harm done to the seller?

  **Follow-up:** *If he says our intuitions in emergencies are valid:* "But policy shouldn't be written based on the panic of emergency. If we legislate based on what desperate families *want* to do, rather than what is safe for the vulnerable, aren't we building a system on exploitation fueled by love?"

  ### 9. Drawing the Line
  **Question:** If the principle is "bodily autonomy and property rights," where do we draw the line? If I can sell a kidney, can I sell my corneas? My liver lobe? At what point does the right to sell become a duty to sell if the market demands it?

  **Follow-up:** *If he argues kidneys are unique because you have two:* "But I also have two lungs, two eyes, and a liver that can regenerate. If the principle is ownership, why is a kidney the stopping point? Is there a coherent philosophical boundary, or is it just a line in the sand?"

  ### 10. The "Dirty Hands" Conclusion
  **Question:** Ultimately, you're arguing that we should get our hands dirty to save lives. But if the cost of saving one life is potentially compromising the dignity and health of another, is that a trade philosophy should endorse? Or is there a line where we say some things shouldn't be done, even to save lives?

  **Follow-up:** *If he argues that letting people die is worse than exploitation:* "Letting people die is a failure of the *current* system. But building a new system on the backbone of the poor isn't a solution; it's a different kind of failure. If we can't solve the shortage without exploitation, doesn't that mean we should focus on prevention and artificial kidneys rather than legalizing the sale of human parts?"
