  1.  **Analyze the Request:**
      *   **Context:** The user's brother has been on dialysis for two years. They are struggling to find a donor. The user hosts a philosophy podcast.
      *   **Guest:** A philosopher/advocate defending legalizing kidney markets on *principled* grounds (not just pragmatic).
      *   **Goal:** Draft 8-10 interview questions that press the guest on difficult issues, avoiding standard talking points.
      *   **Specific Requirements:**
          *   At least 2 questions on exploitation/consent (desperation).
          *   At least 1 question on crowding out altruism.
          *   At least 1 question on dignity/commodification.
          *   Each question needs a follow-up that anticipates the guest's likely counterargument (to prevent evasion).
      *   **Tone:** Philosophical, probing, empathetic but rigorous (given the personal stake).

  2.  **Deconstruct the Guest's Position:**
      *   The guest argues for *legalized kidney markets* on *principled grounds*.
      *   *Likely Arguments:* Autonomy (body sovereignty), beneficence (saving lives), consistency (we pay for other bodily services like surrogacy or labor), black market reduction.
      *   *Likely Counterarguments to Anticipate:* "Regulation solves exploitation," "Altruism isn't crowded out, it's supplemented," "Dignity is preserved by choice," "Current system is already exploitative (time/health cost)."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: Exploitation/Coercion (Requirement: 2 questions)*
          *   *Idea:* If someone sells because they are poor, is it voluntary?
          *   *Draft Q:* Isn't selling a kidney out of poverty coercive?
          *   *Refinement:* Make it more philosophical. Focus on the "offer they can't refuse" aspect.
          *   *Follow-up:* Guest will say "Regulation ensures safety/income." Counter: Regulation doesn't fix the background inequality.
          *   *Idea 2:* Global vs. Local. Will rich people buy from poor people?
          *   *Draft Q:* Won't this just be rich buying from poor?
          *   *Refinement:* Focus on the structural injustice.
          *   *Follow-up:* Guest will say "Better than dying." Counter: Does necessity validate the transaction?

      *   *Topic 2: Crowding Out Altruism (Requirement: 1 question)*
          *   *Idea:* If we pay, will people stop giving for free?
          *   *Draft Q:* Will paying stop altruistic donors?
          *   *Refinement:* Reference the "motive corruption" argument. Does money change the meaning of the gift?
          *   *Follow-up:* Guest will say "We need more organs, altruism isn't enough." Counter: But does it degrade the social fabric?

      *   *Topic 3: Commodification/Dignity (Requirement: 1 question)*
          *   *Idea:* Is the body for sale?
          *   *Draft Q:* Isn't selling body parts undignified?
          *   *Refinement:* Use Kantian language or "market norms vs. social norms."
          *   *Follow-up:* Guest will say "We sell labor/blood." Counter: Is a kidney *like* labor, or is it constitutive of the self?

      *   *Topic 4: Personal/Stakeholder Perspective (Adding flavor based on user's context)*
          *   *Idea:* As a brother of a patient, I want a kidney. But at what cost?
          *   *Refinement:* The tension between wanting to save a brother and not wanting to exploit someone.
          *   *Follow-up:* Guest will say "You'd do it if it saved him." Counter: Is personal desperation a good policy guide?

      *   *Topic 5: Long-term Consequences/Health (Pragmatic/Principled mix)*
          *   *Idea:* What happens to sellers later?
          *   *Refinement:* Long-term care. If they sell, who pays for complications?
          *   *Follow-up:* Guest will say "Insurance covers it." Counter: What about lost wages/life quality?

      *   *Topic 6: The "Principled" Defense (Challenging the core philosophy)*
          *   *Idea:* You say it's principled, not just pragmatic. Why?
          *   *Refinement:* Is there a *right* to sell?
          *   *Follow-up:* Guest will say "Body ownership." Counter: Do we own ourselves like property?

      *   *Topic 7: Inequality/Justice*
          *   *Idea:* Rich get kidneys, poor lose them.
