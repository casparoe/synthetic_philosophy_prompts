      *   *Desideratum 2 (The El Greco Constraint):* If beliefs change perception, do they change the perception of the test stimuli used to prove the belief changed perception? This is about internal consistency and avoiding infinite regress or self-undermining evidence.
      *   *Desideratum 3 (State Specificity):* Beliefs are different from desires. Does fear make the spider look bigger (penetration) or just make me judge it as threatening (post-perceptual)? Mechanism: Top-down modulation vs. bias.
      *   *Desideratum 4 (Locus):* V1 vs. IT cortex. Early vision is supposed to be encapsulated (Fodor). If penetration happens there, Fodor is wrong. If only late, maybe it's just cognition.
      *   *Desideratum 5 (Epistemology):* If perception is theory-laden, is it circular? Does it lose its foundational status?
      *   *Incompatibilities:* Epistemic circularity vs. Empirical verification. If penetration undermines justification, how do we trust the experiments proving penetration?
      *   *Most Constraining:* The Attention/Judgment distinction (The "Alternative Explanation" constraint).

  3.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Refining Desideratum 1 (Attention/Judgment):* It's not just terminology. It's about *functional architecture*. If a theory can't distinguish top-down *modulation of processing* from top-down *selection of input*, it fails. *Case:* The "purple cow" example or color perception experiments. *Status:* Non-negotiable.
      *   *Refining Desideratum 2 (El Greco):* This is often called the "El Greco Fallacy" in the context of CPP (derived from art history, applied by Firestone & Scholl). If a cognitive state alters experience, it must alter the experience of the *measurement* of that alteration. *Case:* Measuring color perception while believing the room is red. *Status:* Non-negotiable (logical consistency).
      *   *Refining Desideratum 3 (State Types):* Doxastic (belief) vs. Conative (desire/fear). *Case:* Stefanucci & Proffitt's hill perception (fatigue/desire). *Status:* Highly desirable, maybe non-negotiable for a *general* theory, but some theories might restrict to doxastic. Let's call it a requirement for *completeness*.
      *   *Refining Desideratum 4 (Locus):* Where in the pipeline? *Case:* Fodor's modularity. If it's post-perceptual, it's not CPP. *Status:* Non-negotiable (definition of perception).
      *   *Refining Desideratum 5 (Epistemology):* The "Bad Company" argument. If perception is penetrated, is it justified? *Case:* Siegel's epistemic downgrade. *Status:* Contingent. A theory of the *phenomenon* doesn't strictly *need* to solve epistemology, but it must be *compatible* with an epistemology. However, the prompt asks what the theory must say *if anything*. I should frame this as an explanatory demand regarding the *consequences* of the mechanism.

