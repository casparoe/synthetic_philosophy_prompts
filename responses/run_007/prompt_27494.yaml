answer: |-
  An adequate theory of cognitive penetration must do more than argue for or against the phenomenon's existence; it must define the architecture of the mind such that the question is decidable. Below is the list of desiderata required for such a theory, structured by the five domains you specified, followed by an analysis of incompatibilities and the single most constraining requirement.

  ### 1. The Functional Discriminability Constraint (Attention & Judgment)
  **The Desideratum:** The theory must provide a functional or mechanistic criterion that distinguishes cognitive penetration from (a) cognitive effects on attention and (b) cognitive effects on post-perceptual judgment, memory, or reporting.

  *   **Forcing Consideration:** The "Alternative Explanation" problem. In almost every putative case of penetration (e.g., seeing a hill as steeper when tired, or a neutral face as hostile when primed with hostility), skeptics argue the effect is due to attentional weighting (selecting different inputs) or response bias (judging the same input differently). If a theory cannot distinguish *altering the processing of sensory input* from *selecting sensory input* or *interpreting the output*, the term "penetration" lacks a referent.
  *   **Status:** **Non-negotiable.** Without this distinction, the phenomenon is conceptually incoherent. It is not merely terminological; it maps onto distinct computational roles. Attention selects *which* information enters the processing stream; penetration alters *how* that information is transformed into a representation. A theory that conflates them fails to describe a specific causal pathway.

  ### 2. The Structural Consistency Constraint (The El Greco Condition)
  **The Desideratum:** The theory must explain why a cognitive state alters the perception of a target stimulus without necessarily altering the perception of the *measurement tools* or *reference frames* used to verify that alteration, avoiding a self-canceling regress.

  *   **Forcing Consideration:** The El Greco Fallacy (as applied by Firestone & Scholl). If a belief that "the room is red" alters color perception, it should arguably alter the perception of the color chart used to test that belief. If the belief alters both the target and the measure equally, the effect is behaviorally invisible and empirically undetectable. If it alters the target but not the measure, the theory must explain the selectivity (why does cognition penetrate *this* representation but not *that* one?).
  *   **Status:** **Non-negotiable.** This is a constraint of logical consistency and empirical coherence. A theory that allows cognition to alter perception universally without restriction renders the alteration unverifiable (because the verification apparatus is also altered). A theory must specify the *scope* of the penetration to avoid this fallacy.

  ### 3. The State Specificity Constraint (Doxastic vs. Conative)
  **The Desideratum:** The theory must specify whether the penetrating states are limited to propositional attitudes (beliefs, expectations) or extend to conative/evaluative states (desires, fears, values), and if both, whether they operate via a unified mechanism or distinct pathways.

  *   **Forcing Consideration:** The "Hill Perception" and "Threat" cases. Studies suggest that fatigue (a bodily state), desire (to reach a goal), or fear (of a spider) alter perceptual metrics (slant, distance, size). Beliefs are truth-aimed; desires are satisfaction-aimed. If both penetrate, the theory must explain how a state that is not "about" the world (a desire) alters a representation that *is* about the world (perception) without creating a functional mismatch (e.g., seeing what you want rather than what is there).
  *   **Status:** **Explanatory Demand (High Priority).** While a minimalist theory could restrict penetration to beliefs, an *adequate* theory of the mind's top-down architecture cannot ignore conative influences. However, it is not strictly non-negotiable that *both* penetrate; it is non-negotiable that the theory *adjudicates* which do and why. Failing to distinguish them risks conflating motivational bias with informational processing.

  ### 4. The Locus Specification Constraint (Encapsulation & Modularity)
  **The Desideratum:** The theory must identify the computational or neural locus of the interaction (e.g., V1 feedback, inferotemporal cortex, multisensory integration areas) and explain whether this violates or preserves the encapsulation of early vision.

  *   **Forcing Consideration:** Fodor's Modularity of Mind. If penetration occurs in "early vision" (edge detection, color constancy), then early vision is not modular/encapsulated. If it occurs only in "late vision" (object recognition, semantic categorization), the dispute may be verbal (depending on where one draws the line between perception and cognition). The locus determines the theoretical cost: early penetration requires overhauling standard models of sensory processing; late penetration may be compatible with traditional modularism.
  *   **Status:** **Non-negotiable.** "Perception" is not a monolith. A theory must locate the effect within the processing stream. Without a specified locus, the theory is compatible with any data (by shifting the locus to fit the data) and thus unfalsifiable.

  ### 5. The Epistemic Consequence Constraint (Justification)
  **The Desideratum:** The theory must map the relationship between penetrated states and perceptual justification. It must specify whether penetration necessarily entails an "epistemic downgrade" (loss of justificatory power) or if penetrated perceptions can still serve as foundational evidence.

  *   **Forcing Consideration:** The "Bad Company" argument (Siegel). If perception is influenced by beliefs, it risks circularity (believing $P$ makes you see $P$, which justifies believing $P$). If a theory claims penetration occurs but ignores the epistemic fallout, it is incomplete, as the primary philosophical interest in CPP often concerns its impact on knowledge and rationality.
  *   **Status:** **Explanatory Demand.** A metaphysical theory of penetration does not *strictly* require a normative epistemology to be true. However, an *adequate* theory must be *compatible* with an epistemology. It cannot simply ignore the consequence; it must at least delineate the conditions under which justification is preserved or lost.

  ---

  ### Incompatibilities: The Empirical/Epistemic Loop

  There is a severe tension between **Desideratum 2 (Structural Consistency)** and **Desideratum 5 (Epistemic Consequence)**, which creates a potential impossibility for a unified theory.

  **The Conflict:**
  1.  **Empirical Verification requires Stability:** To empirically prove penetration occurs (Desideratum 2), we must trust the subject's perceptual reports and the experimenter's perception of the data. We assume the measurement tools (and the cognition evaluating them) are *not* penetrated in the same way as the target stimulus, or we cannot detect the effect.
  2.  **Epistemic Downgrade requires Instability:** If penetration is robust enough to threaten perceptual justification (Desideratum 5), it implies that cognitive states systematically distort perceptual evidence. If this distortion is general, it applies to the scientists designing the experiment and the subjects reporting the data.
  3.  **The Impasse:** If a theory vindicates strong epistemic downgrade (penetration makes perception unreliable), it undermines the empirical evidence used to vindicate the theory itself (self-defeat). If a theory preserves empirical reliability (to avoid self-defeat), it struggles to explain why penetration should threaten justification in everyday contexts (ad hoc restriction).

  **Can they be jointly met?**
  Only if the theory posits a **context-sensitive mechanism**. It must explain why penetration occurs in "hot" ecological contexts (threat, desire) but is suspended or controlled in "cold" experimental contexts (careful measurement, calibration). If the theory cannot explain this switch, it faces a dilemma: either penetration is rare/weak (saving empiricism but reducing philosophical interest) or penetration is pervasive (saving philosophical interest but threatening empiricism).

  ---

  ### The Single Most Constraining Requirement

  **The Functional Discriminability Constraint (Desideratum 1).**

  **Why:**
  This is the bottleneck through which all other desiderata must pass.
  1.  **It determines the Locus (Desideratum 4):** You cannot identify *where* penetration happens (V1 vs. V4) if you cannot distinguish the signal of penetration from the signal of attention. Attention also modulates V1 activity. Without a functional distinction, neural data is ambiguous.
  2.  **It determines the State Specificity (Desideratum 3):** You cannot determine if a *desire* penetrates differently than a *belief* if you cannot first isolate the perceptual change from the motivational bias in reporting.
  3.  **It determines the Epistemic Consequence (Desideratum 5):** If the effect is merely attentional, there is no epistemic problem (attention is a rational filter). If it is penetrative, there might be. The epistemic stakes depend entirely on the successful isolation of the phenomenon.
  4.  **It is the primary point of failure:** The vast majority of proposed cases of cognitive penetration collapse under this constraint (e.g., the "purple cow" case, color perception priming). Skeptics win not by proving penetration is impossible, but by showing that proposed theories fail to rule out attention/judgment alternatives.

  Therefore, a theory that does not solve the **Functional Discriminability Constraint** does not have a subject matter. It is the gatekeeper; without it, the debate is not about cognitive penetration, but about the definition of words. Satisfying this requirement forces the theory to be mechanistically precise, which in turn constrains the possible solutions to the El Greco problem, the Locus problem, and the Epistemic problem.
