          *   *Probabilistic:* Instead of $\vdash \phi$, use $P(\phi) > 0.99$. Does Löb hold? There are "Probabilistic Löb" theorems, but they allow for "reflective consistency" under specific conditions (e.g., allowing a small margin of error). Mention the "Christiano et al." approach.
