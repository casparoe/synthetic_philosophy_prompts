      *   Key figures: James Rachels (famous "Smith and Jones" baby bath case arguing AOD is morally irrelevant), Philippa Foot, Judith Jarvis Thomson.
      *   Legal context: *Cruzan v. Director, Missouri Dept. of Health*, *Vacco v. Quill*, *Washington v. Glucksberg*.
