prompt: |-
  I'm a type design student and a classmate walked me threw an argument that's been bugging me all week, because every step sounds right but the conclusion is obviously false. (1) If the letter 'a' is a real kind of thing, there has to be some shape feature — or list of features — that all a's have and no non-a's have. (2) But there isn't one: a single-story 'a', a double-story 'a', and a blackletter 'a' share almost no geometric parts, and for any feature you point to (a closed bowl, a stem on the right, a tail) some perfectly legible 'a' in some style lacks it or some other letter has it. (3) So 'a' isn't a real kind. (4) And if 'a' isn't a real kind, then whether a scribble is an 'a' is just convention, with no fact of the matter beyond what people happen to call it. (5) But that can't be right: a 'g' is not an 'a' no matter how we label it, and a working type designer can tell that a badly drawn glyph is still an 'a' while a slightly different mark has become something else. My classmate says (5) is just folk intuition and we should drop it. I'd rather drop one of the earlier steps, but I can't tell which one is doing the damage. Could you take the role of a philosopher who works on concepts and categories, think through this carefully — maybe brainstorm a bit first — and tell me which step to reject and what rejecting it costs? Please answer in American English.
