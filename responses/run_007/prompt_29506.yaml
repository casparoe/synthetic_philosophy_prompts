answer: |-
  Here is the spec sheet. It strips away the metaphysical posturing and focuses on extensional adequacy: does the theory actually fit the things we need it to classify?

  ### Part 1: The Spec Sheet (Requirements & Justifications)

  An adequate theory of disease cannot just be internally consistent; it must map onto medical practice and ethical intuition without collapsing critical distinctions. Below are the non-negotiable constraints, the cases that enforce them, and why they are constraints rather than philosophical tastes.

  | Requirement | The Enforcing Case | Why This Is a Constraint (Not a Preference) |
  | :--- | :--- | :--- |
  | **1. Objectivity (Mind-Independence)** | **Asymptomatic Hypertension** / **Unnoticed Infection** | **Constraint:** Medical intervention often *must* precede subjective feeling. If a theory requires the patient to feel "ill" to be "diseased," it renders preventative medicine incoherent. A theory that fails here is clinically useless. |
  | **2. Normative Force (Harm Entailment)** | **Infertility (Wanted vs. Unwanted)** / **Homosexuality** | **Constraint:** Medicine is a normative practice aimed at relief. If a condition is biologically deviant but causes no harm (wanted infertility) or is socially stigmatized but biologically functional (homosexuality), classifying it as disease leads to unethical overtreatment or pathologizing difference. |
  | **3. Disease/Illness Distinction** | **Chronic Pain (No Finding)** vs. **Asymptomatic Cancer** | **Constraint:** We need to distinguish *biological malfunction* from *subjective suffering*. Chronic pain syndrome is an illness without clear disease pathology; early-stage cancer is a disease without illness. Collapsing these confuses treatment targets (fixing tissue vs. managing experience). |
  | **4. Risk/State Boundary** | **High Cholesterol** / **Genetic Predisposition** | **Constraint:** A risk factor is a probability; a disease is a current state. If a theory classifies all risk factors as diseases, everyone is diseased, and the concept loses triage utility. The theory must mark the threshold where probability becomes pathology. |
  | **5. Reference Class Stability** | **Aging** / **Fever** | **Constraint:** Statistical normality is relative. A heart rate of 140 is normal during exercise, pathological at rest. A theory relying on "statistical subnormality" must solve the *Reference Class Problem* (which group do we compare against?) or it classifies aging as a disease (statistically universal decline) or fever as health (statistically normal in infection). |
  | **6. Historical/Forward-Looking Capacity** | **Addiction** / **Latent Virus** | **Constraint:** Some conditions are defined by their trajectory or origin, not just current snapshot function. Addiction involves a history of exposure and a future risk of compulsion. A purely snapshot functional view misses the *process* that constitutes the pathology. |

  #### Camp Preferences vs. Real Constraints
  *   **Naturalist Preference:** "Disease must be purely biological, no values allowed."
      *   **Verdict:** **Preference.** While objectivity is required (Req 1), total value-freedom is impossible because "function" itself is teleological (goal-directed). You cannot define "malfunction" without implying a "proper function," which smuggles in a norm.
  *   **Normativist Preference:** "Disease is whatever society deems bad."
      *   **Verdict:** **Preference.** While harm is required (Req 2), making disease *solely* a social judgment fails the Objectivity constraint (Req 1). It cannot handle the silent killer (hypertension) which is bad before society notices it.

  ---

  ### Part 2: The Statistical Reality (The Reference Class Problem)

  Any theory relying on statistics (like Boorse's Biostatistical Theory) faces a hard mathematical constraint. You cannot define disease as "statistical subnormality" without specifying the **Reference Class**.

  *   **The Problem:** If the class is "all humans," then being unable to run a 4-minute mile is a disease. If the class is "90-year-olds," then having the immune system of a 20-year-old is a disease (statistically deviant).
  *   **The Constraint:** The theory must specify *natural* reference classes (age, sex) without arbitrary gerrymandering.
  *   **The Failure Point:** **Aging.** Aging is a universal, statistically normal decline in function.
      *   If you say "Disease is subnormal function," Aging is *not* a disease (it's normal).
      *   If you say "Disease is functional decline," Aging *is* a disease.
      *   Standard views struggle here. If Aging isn't a disease, why is menopause? If Aging is a disease, medicine becomes immortalism. The spec sheet requires the theory to draw this line without arbitrariness.

  ---

  ### Part 3: The Incompatibilities (The "Gotcha")

  You asked if any two desiderata are jointly unsatisfiable. Yes. This is why the debate has stalled for 50 years.

  **The Jointly Unsatisfiable Pair:**
  1.  **Value-Freedom (Naturalism):** The definition of disease must rely *only* on biological facts, independent of social values or harm.
  2.  **Extensional Adequacy on Contested Cases:** The theory must correctly exclude conditions like **Homosexuality** (historically classified as disease) and include **Asymptomatic Hypertension** (currently classified as disease).

  **Why they clash:**
  To exclude Homosexuality while including Hypertension without using "values" is mathematically impossible.
  *   Hypertension is "disease" because it leads to *harm* (stroke/death).
  *   Homosexuality was "disease" because it was deemed *reproductively dysfunctional* (by some) or socially deviant.
  *   To rule out Homosexuality now, you must appeal to **Harm/Well-being** (it doesn't hurt you).
  *   To rule in Hypertension, you must appeal to **Harm/Well-being** (it kills you).
  *   **The Trap:** If you appeal to Harm, you violate **Value-Freedom** (Harm is a value judgment). If you stick to **Value-Freedom** (pure function/stats), you risk classifying Homosexuality as a dysfunction (if defined reproductively) or failing to classify Hypertension as a disease (if the patient feels fine and functions normally).

  You cannot have a theory that is purely descriptive *and* guarantees normative correctness on boundary cases.

  ---

  ### Part 4: The Killer Criterion

  Which single criterion does the most to kill the standard views (including Biostatistical Naturalism)?

  **The Criterion: The Harm Entailment Constraint.**
  *(A theory must explain why identifying a 'disease' necessarily provides a reason for medical intervention, without defining disease 'as' the need for intervention.)*

  **Why it kills Biostatistical Naturalism (BST):**
  BST defines disease as "subnormal species-typical functioning."
  *   **The Kill:** Subnormal function does not entail harm.
  *   **Example:** A person with statistically subnormal sprinting speed or subnormal fertility (who doesn't want kids) has a "disease" under BST, but no reason for intervention. BST cannot explain *why* we treat some dysfunctions (hypertension) and ignore others (flat feet, low sperm count in celibate men) without smuggling in a value judgment about what functions *matter*.
  *   **Result:** BST is extensionally inadequate. It overgenerates diseases.

  **Why it kills Pure Normativism:**
  Normativism defines disease as "socially disvalued condition."
  *   **The Kill:** Social value does not entail biological pathology.
  *   **Example:** Asymptomatic Hypertension. If the patient feels fine and functions well, a pure normativist view struggles to call it a disease until the patient *values* being free of stroke risk. It makes disease contingent on the patient's current desires rather than their biological reality.
  *   **Result:** Normativism is clinically unsafe. It undergenerates diseases.

  **The Verdict:**
  The **Harm Entailment Constraint** exposes that "Disease" is a **hybrid kind**. It is not a natural kind (like Gold) and not a social kind (like Money). It is a **functional kind anchored in values**. Any theory that tries to be purely one or the other fails this criterion.

  ---

  ### Part 5: Scorecard of Standard Views

  | Theory | Objectivity (Hypertension) | Normative Force (Homosexuality) | Disease/Illness Split | Reference Class Stability | **Fatal Flaw** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Biostatistical (Boorse)** | **Pass** (Handles silent killers well) | **Fail** (Struggles to exclude homosexuality/aging without values) | **Pass** (Clear biological basis) | **Fail** (Reference class problem; Aging is normal decline) | **Harm Entailment:** Cannot distinguish harmful vs. harmless dysfunction. |
  | **Normativist (Engel/etc.)** | **Fail** (Struggles with asymptomatic cases) | **Pass** (Easily excludes homosexuality) | **Fail** (Collapses disease into illness/experience) | **Pass** (Context dependent) | **Objectivity:** Makes disease dependent on feeling/social view. |
  | **Hybrid (Wakefield/Harmful Dysfunction)** | **Pass** | **Pass** | **Pass** | **Mixed** (Still relies on evolutionary function) | **Evolutionary Spec:** Hard to determine "designed function" for complex traits. |
  | **Pragmatist (Clinical View)** | **Pass** | **Pass** | **Pass** | **Pass** | **Theoretical:** Admits "disease" is just a tool, not a real category. (Kills the project of definition). |

  **Summary:** The spec sheet demands a theory that is biologically grounded but normatively sensitive. No current view satisfies this without remainder. The **Harm Entailment Constraint** is the wedge that breaks them open. If you are writing or evaluating a paper, check if they address how their definition moves from "is" (biology) to "ought" (treatment). If they don't, they haven't met the spec.
