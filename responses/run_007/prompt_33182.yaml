answer: |-
  This is a classic formulation of a problem that has troubled moral philosophers since Henry Sidgwick and was revitalized by Derek Parfit. Your friend has reconstructed a version of the **"Absurd Conclusion"** or the **"Overdemandingness Objection"** to temporal neutrality.

  The argument is logically valid. If you accept premises (1) through (6), you arrive at a contradiction. Since you find the conclusion (that we are systematically irrational) preposterous, and your friend finds the defense of pure time preference (premise 3) unconvincing, the most philosophically robust way to resolve the paradox is to reject the inference in **Premise (5)**.

  Here is the breakdown of why (5) is the weak point, why it looks plausible, and what rejecting it commits you to.

  ### The Weak Point: Premise (5)

  **Premise (5):** *If temporal neutrality is rationally required, then we are rationally obligated to make very large sacrifices now for the sake of the far future. Future people vastly outnumber present people, and resources invested now can compound into enormous benefits over centuries.*

  #### Why it looks plausible
  Premise (5) derives its force from combining **Temporal Neutrality** with **Total Utilitarianism** and **Compound Interest**.
  1.  **Temporal Neutrality:** A unit of wellbeing in 2124 counts the same as a unit in 2024.
  2.  **Total View:** The value of the future is the sum of the wellbeing of all people who will ever live. Since humanity could last millions of years, the number of future people is astronomically larger than the number of living people.
  3.  **Compounding:** Small investments now (e.g., in AI safety or biosecurity) can prevent extinction, preserving that astronomical future.

  Mathematically, if the future contains trillions of lives, their aggregate interest swamps the interests of the present. It looks like simple arithmetic: $1 \text{ (present)} \ll 1,000,000,000,000 \text{ (future)}$.

  #### Why it overreaches
  Premise (5) smuggles in a controversial theory of **Population Ethics** that is not entailed by Temporal Neutrality alone. Temporal Neutrality says *time* is not a morally relevant distinction. It does *not* say that *potential people* have the same claim on us as *actual people*, nor does it mandate the **Total View** of value aggregation.

  There are two specific ways (5) fails:

  **1. The Person-Affecting Restriction**
  Temporal neutrality applies to *interests*. But do future people who do not yet exist have interests that can be harmed or benefited *now*?
  *   **The Total View (assumed in 5):** We ought to maximize the total sum of happiness, even if that means bringing more people into existence.
  *   **The Person-Affecting View:** We only have obligations to people who will exist independently of our choices, or to specific identifiable future individuals.
  If you adopt a Person-Affecting View, the fact that future people "vastly outnumber" us loses its normative force. We are not obligated to maximize the *number* of future people, only to ensure that the future people who *do* exist have lives worth living. This drastically reduces the demandingness of the obligation without requiring pure time preference.

  **2. Diminishing Marginal Utility Across Time**
  Premise (5) assumes that a dollar's worth of welfare is constant across time. However, if we expect future generations to be significantly wealthier and healthier than us (due to technological progress), the **marginal utility** of resources may be lower for them than for us.
  *   $1,000 today might save a child from malaria.
  *   $1,000 compounded to $1,000,000 in 2124 might buy a slightly faster spaceship for already-wealthy descendants.
  Unless the investment is specifically for **existential risk reduction** (where the benefit is existence itself, not wealth), temporal neutrality does not demand we transfer wealth to a richer future. (Note: This does not fully escape the existential risk obligation, which is why the Population Ethics objection above is stronger).

  #### What rejecting (5) commits you to
  Rejecting (5) does not mean you can ignore the future. It commits you to a more nuanced view of intergenerational justice:
  *   **Rejection of the Total View:** You must accept that the sheer number of potential future people does not automatically trump the urgent needs of present people.
  *   **Sufficientarianism:** You are obligated to ensure future generations have *enough* (a safe environment, stable institutions), but not to maximize their total aggregate welfare at the cost of your own subsistence.
  *   **Rationality Preserved:** You can maintain that it is rational to care about the future (temporal neutrality) without accepting that rationality demands self-impoverishment.

  ### An Alternative: Rejecting Premise (6)

  If you find the Population Ethics debate too technical, there is a second, more direct option: **Reject Premise (6).**

  **Premise (6):** *But we are plainly not rationally obligated to live this way. A theory of practical reason that demands we impoverish ourselves... is too demanding to be credible.*

  Many moral philosophers (such as Peter Singer or Shelly Kagan) argue that (6) is simply false. They argue that our "common sense" intuition that morality should be easy is a bias, much like the bias favoring the present.
  *   **The Commitment:** If you reject (6), you accept that we **are** rationally/morally obligated to make large sacrifices for the future.
  *   **The Escape from "Irrationality":** This does not mean we are *irrational*; it means we are **immoral** or **weak-willed**. There is a difference between a failure of *reason* (contradiction, miscalculation) and a failure of *will* (knowing what is right but failing to do it).
  *   **Why this helps:** Your friend's conclusion is that we are "systematically irrational." If you reject (6), you can say: "The theory is correct; the obligations are real; humans just fail to meet them." This preserves the coherence of practical reason while acknowledging human frailty.

  ### Recommendation

  The cleanest way out that preserves both rationality and a credible moral theory is to **reject the inference in Premise (5)**.

  Your friend's argument assumes that **Temporal Neutrality + Large Future Population = Extreme Obligations.** By showing that this equation requires the controversial **Total View of Population Ethics**, you break the link. You can argue:

  > "I agree that time itself makes no moral difference (Temporal Neutrality). However, I reject the claim that the potential existence of trillions of people creates an infinite demand on the present. We have duties to ensure the future is *good*, but not to maximize the *size* of the future at the cost of the present. Therefore, we can be temporally neutral without being enslaved to the forty-first century."

  This allows you to keep (1)-(4), modify (5), and keep (6), dissolving the paradox without declaring humanity irrational.
