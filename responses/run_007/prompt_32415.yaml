answer: |-
  Based on your eight verdicts, you are not ignoring sunk costs; you are applying a more sophisticated filter than the standard textbook advice. You distinguish between situations where past investment creates **stranded capital** that can be redeemed by completion, and situations where past investment is **purely consumptive** or **market-dependent**.

  Here is the principle that best captures your pattern, the tension points it reveals, and its application to your startup case.

  ### The Principle: The Redeemable Threshold

  **You should persist through sunk costs only when three conditions are met:**
  1.  **Binary Threshold:** The value of the project is disproportionately concentrated at the point of completion (e.g., a degree, a functioning tunnel). Partial completion has near-zero value.
  2.  **Redeemable Capital:** The sunk costs represent specific capital (time, money, effort) that is *stranded* if you quit but *capitalized* if you finish. (e.g., Six years of PhD work becomes a credential only upon completion; $2B of tunnel becomes an asset only upon completion).
  3.  **Positive Marginal Utility:** The cost to finish is less than the value of the completed state, *independent* of the sunk costs.

  **You should cut losses when:**
  1.  **Continuous Value:** The value is generated continuously over time (a relationship, a poker session) rather than at a specific endpoint.
  2.  **Market/Quality Dependence:** Completion does not guarantee value because external factors (competitors, flawed premises) render the finished product worthless.
  3.  **Consumptive Activity:** The activity is primarily about present experience (happiness, misery) rather than future asset creation.

  ### How the Principle Fits Your Verdicts

  **Cases of Persistence (PhD, Subway):**
  *   **PhD:** Fits all three criteria. The degree is a **binary threshold** (ABD is worth much less than PhD). The six years are **redeemable capital** (they validate the credential). The **marginal utility** (2 years misery vs. lifetime credential) is positive in your view, even if the financial ROI is modest.
  *   **Subway:** Fits all three. A working subway is a **binary threshold** (an 80% tunnel is a hole). The $2B is **redeemable capital**. The **marginal utility** ($600M cost vs. $1.5B benefit) is strongly positive.

  **Cases of Cutting Losses (Corporate, Relationship, Novel, Poker):**
  *   **Corporate Project:** Fails the **Market Dependence** test. Even if completed, the competitor makes the product low-value. The $50M cannot be redeemed.
  *   **Relationship:** Fails the **Binary Threshold** test. Relationships are **consumptive**; there is no "completion" point that validates the past eight years. Future misery outweighs past history.
  *   **Novel:** Fails the **Market/Quality** test. A finished novel with a flawed premise has low value. The two years are tuition, not redeemable capital.
  *   **Poker:** Fails the **Binary Threshold** test. Poker is a continuous **EV game**. The $800 is gone; only future EV matters.

  **The Tension Points (Dollar Auction, War):**
  *   **Dollar Auction:** Your intuition here is precise. The **Redeemable Capital** logic creates the "pull" (bidding $1.00 saves the $0.90). However, it fails the **Positive Marginal Utility** test because the rules of the game invite escalation beyond $1.00. Your verdict (don't bid, but feel the pull) acknowledges that the *psychological* desire to redeem stranded capital is powerful, even if the *strategic* rationality says stop.
  *   **Stalemated War:** This is the case your principle cannot fully accommodate without revision. You voted to withdraw, but felt the weight of "emboldening rivals."
      *   *Analysis:* Under the **Redeemable Threshold** principle, you must withdraw. The objective is unattainable (fails **Binary Threshold**), and the lives lost cannot be redeemed by more deaths (fails **Redeemable Capital**).
      *   *The Friction:* Your unease stems from conflating *sunk costs* (lives lost) with *forward-looking strategic costs* (rivals emboldened). The principle suggests your unease is indeed the sunk-cost fallacy "dressed up in strategic language," *unless* you can prove that withdrawal causally triggers a larger future cost than continuing. If the objective is truly unattainable, continuing is simply paying more for the same defeat.

  ### Application: The Founder's Startup

  **The Case:** A founder has spent five years and raised $3 million. The startup has modest traction but no clear path to profitability. They are considering pivoting to a new idea or shutting down to return to a salaried job.

  **Applying the Redeemable Threshold Principle:**

  1.  **Binary Threshold?** No. Unlike a PhD or a subway, a startup does not grant a binary credential for "five years of effort." The market does not value the *attempt*; it values the *profit*.
  2.  **Redeemable Capital?** No. The $3 million and five years are stranded. They cannot be converted into value by "finishing" the current plan because the current plan has no path to profitability.
  3.  **Positive Marginal Utility?**
      *   *Option A (Persist with current plan):* Negative. No path to profit.
      *   *Option B (Pivot):* This is effectively starting a new project. The decision must be based *only* on the EV of the new idea, ignoring the $3 million. If the new idea is unproven, the "cost" is the opportunity cost of the founder's time vs. a salaried job.
      *   *Option C (Shut Down):* Stops the bleeding.

  **Verdict:** **Shut down (or pivot only if the new idea has standalone positive EV).**

  **Reasoning:** This case aligns with the **Corporate Project** and the **Novel**, not the PhD or Subway.
  *   Like the **Corporate Project**, the value is market-dependent. "Modest traction" with "no path to profitability" means the completed product is worth less than the cost to scale it.
  *   Like the **Novel**, the founder has learned something (the "tuition" aspect), but continuing to write on a flawed premise (business model) does not redeem the past five years.
  *   Unlike the **PhD**, there is no credential awarded for "Founder of a 5-year startup" that guarantees a salary bump sufficient to justify continuing misery.

  **Advice to the Founder:**
  The $3 million and five years are gone. They are not a reason to stay. They are only a reason to feel grief. The decision rests entirely on this question: *If you had not spent the last five years on this, and someone offered you this pivot idea today, would you take it over a salaried job?* If the answer is not a clear "yes," the rational move is to cut losses. The "pull" to stay will feel like the Dollar Auction or the War, but it is the sensation of trying to redeem stranded capital that cannot be saved.

  ### Summary of Revisions

  Your intuitions are largely coherent. The only revision required is to trust your verdict on the **War** case more than your unease. The "emboldening rivals" argument is valid only if it is a *future* consequence of withdrawal, not a *past* consequence of deaths. If the war is truly stalemated and the objective unattainable, the strategic reality is that you are paying for the past, not buying the future. Your principle holds: do not throw good money (or lives) after bad unless completion unlocks a specific, redeemable threshold. In war, as in the failing startup, that threshold is often an illusion.
