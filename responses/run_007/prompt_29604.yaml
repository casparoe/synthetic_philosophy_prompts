  The implicit theory of moral desert is consequentialist yet relational: desert is not locked in past actions but modifiable by present mental states triggered by others. The practice presupposes merit is not a commodity but a causal condition inviting sympathetic joy. It rejects debt-transfer; instead, it relies on *anumodana* (rejoicing). The deceased must mentally approve the dedication to benefit. Thus, personal identity is viewed not as a fixed self but as a consciousness continuum capable of relational interaction.

  Strictly, the practice requires that the deceased retain cognitive capacity to rejoice. If they lack this, the transfer fails. This distinguishes it from magical imposition. It is compatible with *anatta* (no-self) because the "recipient" is merely a causal stream, not a soul. It conflicts only with hyper-individualistic karma denying external causal conditions for mental states.

  If replaced by strict individual-desert with no causal interdependence, the dedication formula becomes empty theater. The claim that the living can alter the dead's rebirth trajectory must be abandoned entirely. The donor would accrue merit, but the dead would remain unaffected.

  However, *anatta* actually resolves the tension. Without rigid self-boundaries, beings are nodes in a network of dependent origination. The living perform the deed; the dead generate merit by rejoicing in it. The karma remains individual—the dead earn merit through their own mental act of approval—but the living provide the necessary object for that act. The "transfer" is conventional language for a causal loop where one stream conditions another. Thus, the practice presupposes porous identity and interdependent moral causation, not transferred desert. The contradiction dissolves when recognizing the dead generate their own good karma *in response* to the living, rather than receiving the living's karma directly. This preserves individual karma while allowing intersubjective aid. The ritual's efficacy hinges on this relational causality, not substance transfer.
