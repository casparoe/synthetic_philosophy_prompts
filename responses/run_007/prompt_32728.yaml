answer: |-
  **Setting:** *The Sixth Form common room. It's 4:15 PM. Most people have gone home. Sam and Josh are slumped on the battered leather sofas, packing their bags slowly. There's a whiteboard behind them with half-erased notes about "Hume" and "Reid."*

  **Sam:** I'm just saying, mate, your view is proper risky. If you just believe everyone by default, you're gonna get played.

  **Josh:** I never said *everyone*. I said testimony is its own thing. It's not just… fancy guessing.

  **Sam:** But what else is it? Look, Hume's point makes sense. When I believe you, it's not magic. It's because I've seen, in the past, that people usually tell the truth. And I've seen *you* specifically aren't a liar. So it's just induction. Like seeing smoke and guessing fire.

  **Josh:** Okay, but think about when you were five. Did you have a massive database of evidence that your mum was reliable before you believed her when she said "don't touch the stove"?

  **Sam:** Probably not. But that just means kids are gullible. It doesn't mean they *know* stuff. They're just lucky if they turn out right.

  **Josh:** See, that's where you lose me. You're saying a kid doesn't *know* the stove is hot until they've done a statistical analysis of their parents' honesty? That sounds mental. They just believe, and they know. It's a basic source, like seeing or remembering.

  **Sam:** But there's a difference though, innit? If I see a cup, I just see it. If you *tell* me there's a cup in the other room, I have to trust *you*. That extra step means I need a reason to trust you. Otherwise, why wouldn't I just make stuff up myself?

  **Josh:** Because we're social creatures? Reid's whole thing was that if we didn't have a default setting to trust, language wouldn't work. Imagine if every time I spoke, you had to check my credentials before processing the sentence. We'd never get anywhere.

  **Sam:** I get that practically. But we're talking about *justification*. Like, are you *allowed* to believe me? If I walk up to you on the high street and say "I just saw a blue giraffe," you're not gonna believe me. You'd want proof.

  **Josh:** Exactly. I wouldn't believe you *because* it's crazy. Not because I don't trust testimony in general. The default is trust, unless there's a red flag. You're acting like the default is suspicion, unless there's a green light.

  **Sam:** But why should trust be the default? People lie. People get things wrong. The world is full of noise. If I treat everything as true until proven false, I'm gonna end up believing fake news and conspiracy theories. My way is safer. Assume nothing, check the evidence.

  **Josh:** But you can't check the evidence for everything. That's the problem. If I tell you "Canberra is the capital of Australia," have you been there? Did you check a map? Or did you just take my word for it?

  **Sam:** I've probably heard it before, from teachers, or read it. So I've got inductive backing. I know textbooks are usually right.

  **Josh:** But right now, in this moment, you're taking *my* word that textbooks say that. You're relying on me. You can't keep pushing the justification back forever. At some point, you just have to accept that other people can give you knowledge directly.

  **Sam:** Okay, fair. But that doesn't mean it's a *separate* source. It just means the chain of induction is really long and I've forgotten the links. It's still based on observation eventually. If everyone started lying tomorrow, you'd stop believing them.

  **Josh:** Would I? If everyone started lying, I'd think *they* were broken, not that my ability to listen was wrong. Look, think about it this way. If testimony is just induction, then I need positive reasons to believe you. But I don't feel like I need that. I feel like *you* need a reason to make me doubt you.

  **Sam:** That's just a feeling though, Josh. Feelings aren't epistemology. Just because it feels easy to believe doesn't mean it's rational. It's easier to eat cake than salad, doesn't mean cake is healthier.

  **Josh:** *Laughs.* Low blow. But seriously, if your view is right, then we're all basically isolated brains. We only know what we've directly observed or calculated. That makes learning from others basically the same as learning from a barometer.

  **Sam:** Is that a bad thing? A barometer tells you pressure. You trust it because it's been right before. People tell you stuff. You trust them because they've been right before. Seems consistent.

  **Josh:** But a barometer doesn't *mean* to tell you anything. It doesn't have responsibility. When I speak to you, I'm inviting you to trust me. There's a moral thing going on. If I lie, I've wronged *you*. If a barometer breaks, it's just broken.

  **Sam:** Okay, that's a nice thought about connection and whatever. But does it help us get truth? If I'm trying to figure out if A-Level reforms are happening, I don't want "moral connection," I want to know if the source is reliable.

  **Josh:** And how do you know they're reliable without asking someone else? It's circular, Sam. You need testimony to verify testimony. So testimony has to stand on its own feet at some point.

  **Sam:** It's not circular if it's all grounded in perception eventually. Someone saw the government document. They told someone. They told you. It's a chain of perceptions.

  **Josh:** But the link in the chain isn't perception. It's understanding. You have to understand *me*. That's a different faculty. Look, I'm not saying you should believe idiots. I'm saying you don't need a *positive reason* to believe me. You only need a lack of reasons not to.

  **Sam:** So if I say "I have a dragon in my garage," and you don't have a reason not to believe me, you should?

  **Josh:** No, because "dragon" clashes with everything else we know. That's a defeater.

  **Sam:** Aha! So you *are* checking it against your other knowledge. You are doing the work. You're reducing it to coherence with what you already know.

  **Josh:** *Pauses.* Okay, that's fair. Maybe it's not 100% blind. But it's still… lighter weight than your view. You want me to interview you like a witness before I accept you said "pass the salt." I just say "cheers" unless you look like you're holding a knife.

  **Sam:** I don't want an interview. I just want you to admit that the reason you say "cheers" is because, deep down, you reckon I'm a reliable salt-passer based on past data.

  **Josh:** I reckon I say "cheers" because if I didn't trust anyone, I'd be dead in a week. Maybe that's pragmatic, not epistemic. But it feels like the same thing.

  **Sam:** *Zips up bag.* Pragmatic success doesn't equal truth, Josh. But… I'll give you this. Maybe for small stuff, like salt or capitals, the default is trust. But for big stuff? Politics, science, philosophy?

  **Josh:** Then we check. Obviously.

  **Sam:** Right. So maybe it's a spectrum. Default trust for the mundane, reductionist scrutiny for the important.

  **Josh:** *Stands up.* Compromise? I can live with that. As long as you admit you believe me when I say the bus is coming.

  **Sam:** Only because I can hear the engine, mate.

  **Josh:** *Shakes head.* Die hard. Come on, let's go.

  **Sam:** Alright. But if you tell me you've got homework, I'm verifying that.

  **Josh:** Get lost.
