      *   Confidence/Weakness included? Yes.
      *   "Hope nobody asks" included? Yes.

  9.  **Drafting Content (Iterative refinement):**
      *   *Consequentialist Objection:* Focus on *expected* value, not *actual* value. Hiller's work is relevant here.
      *   *Kantian Objection:* Focus on maxims.
      *   *Political Objection:* Focus on "responsibility vs. blame."
      *   *Threshold Objection:* Focus on supply chain sensitivity (Nefsky vs. Budolfson).
