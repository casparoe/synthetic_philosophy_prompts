answer: |-
  # Q&A Prep Sheet: Qualified Inefficacy in Climate Ethics

  **Context:** 20-minute Q&A. Audience: 30 Philosophers (Majority Consequentialists, Minority Kantians, 2 Political Theorists).
  **Goal:** Defend the distinction between *discernible difference* and *threshold cases*, while insulating the view from charges of complacency and inconsistency.

  ---

  ### 1. The Expected Utility Objection (Consequentialists)
  **Likelihood:** Very High | **Damage:** High
  **Phrasing:** "You rest your view on the claim that individual acts make no *discernible* difference. But standard consequentialist analysis relies on *expected* value, not certain outcomes. Even if the probability of my burger triggering an extra order is tiny, the disvalue of climate harm is so massive that the expected utility is still negative. By ignoring probability-weighted harm, aren't you just stipulating the conclusion?"

  **Reply (2 mins):**
  "I appreciate the push. My claim isn't that expected utility is irrelevant, but that 'inefficacy' arguments often conflate *probabilistic* influence with *moral* requirement in contexts of causal overdetermination. In standard market cases (like a single burger), the causal chain is so attenuated and buffered by inventory that the probability isn't just low; it's functionally indistinguishable from zero for the agent.
  However, I grant that if the expected harm were knowable and significant, the obligation would return. That is precisely why I carve out the 'threshold' exception. My argument is epistemic: where thresholds are opaque and buffering is high (supermarket meat), the 'expected harm' calculation becomes speculative fiction rather than moral guidance. Where thresholds are clear (voting in small electorates, or specific policy triggers), the calculation holds. I am arguing for a moral heuristic based on *discernible* causal leverage, not abstract probabilistic metaphysics."

  *   **Confidence:** 7/10
  *   **Weakest Point:** The claim that market buffering makes probability "functionally zero." Economists (like Budolfson) argue supply chains are more sensitive than we think. If you concede sensitivity, the expected utility argument crushes the inefficacy claim.

  ### 2. The Universalizability Objection (Kantians)
  **Likelihood:** High | **Damage:** Medium-High
  **Phrasing:** "Even if your consequentialist math works, this fails the Formula of Universal Law. If everyone adopted the maxim 'I will fly whenever it is convenient because my individual flight makes no difference,' the result is climate catastrophe. Therefore, the maxim is non-universalizable. Why doesn't Kantian duty require abstention regardless of individual efficacy?"

  **Reply (2 mins):**
  "This is a standard and serious challenge. However, the Formula of Universal Law tests the *rationality* of the will, not necessarily the *outcome* of the action in a causal sense. My response is twofold. First, the maxim can be refined: 'I will emit carbon unless I am in a position to cross a known harm threshold.' This *is* universalizable without catastrophe, because if everyone followed *that* maxim, thresholds wouldn't be crossed.
  Second, I distinguish between *perfect* and *imperfect* duties. While we have a duty to promote a stable climate, the specific means (individual abstinence vs. structural advocacy) are wide. Inefficacy cases fall under imperfect duty: you must do *something*, but you aren't required to do *this specific thing* if it lacks leverage. Voting is required because it has leverage; flying is not, provided one meets other duties."

  *   **Confidence:** 6/10
  *   **Weakest Point:** The reformulation of the maxim. Kantians often argue this looks like 'gerrymandering' the maxim to avoid the conclusion. Distinguishing perfect/imperfect duties here is also contentious in environmental ethics.

  ### 3. The Structural Injustice Objection (Political Theorists)
  **Likelihood:** Certain (The two Young scholars) | **Damage:** Medium
  **Phrasing:** "Your framing treats climate harm as an aggregation of individual acts, which is exactly the liberal individualist mistake Young warns against. The problem isn't that you fly; it's that the infrastructure makes flying necessary for professional participation. By focusing on whether *you* are required to abstain, you're obscuring the structural political responsibility to change the system."

  **Reply (2 mins):**
  "I agree that structural injustice is the primary driver, and I don't intend my view to exonerate agents from political responsibility. In fact, my exception for *voting* is an acknowledgment of that structural duty.
  However, ethics must guide action *within* structures, not just regarding them. Agents still need to know how to live now. If I tell a grad student 'you are morally required to stop flying,' but their career depends on it, I create a dilemma without a solution. My view clarifies that the *moral stain* isn't on the individual act of flying itself, but on failing to engage in the structural work (voting, advocacy) that actually moves the needle. I am trying to redirect moral energy from futile individual purity to effective political action."

  *   **Confidence:** 8/10
  *   **Weakest Point:** Admitting that individual acts are morally neutral might undermine the motivation for the structural change you advocate. If flying isn't wrong, why fight to change the infrastructure that requires it?

  ### 4. The "Threshold Ignorance" Objection (Empirical/Epistemic)
  **Likelihood:** Medium | **Damage:** High
  **Phrasing:** "You exempt cases with 'definite, knowable aggregation thresholds.' But in climate systems and supply chains, thresholds are rarely knowable ex ante. Tipping points are opaque. If we don't *know* we aren't at a threshold, can we really claim inefficacy? Isn't the precautionary principle required here?"

  **Reply (2 mins):**
  "This is the crux of the qualification. I am not claiming we know thresholds *never* exist. I am claiming that for routine consumer choices (one burger, one flight), the *burden of proof* for a threshold connection is not met.
  In voting, the threshold is institutional (50% + 1). In climate tipping points, the link between *my* ton of carbon and the *tipping* is mediated by millions of others. The precautionary principle applies when the risk is foreseeable. Here, the causal link is so distributed that attributing 'threshold risk' to a single unit is category error. We should treat routine consumption as below-threshold *unless* specific evidence suggests otherwise (e.g., a boycott with a stated goal)."

  *   **Confidence:** 5/10
  *   **Weakest Point:** The distinction between "institutional thresholds" (voting) and "physical thresholds" (climate) is shaky. Climate tipping points are real, even if the link to individual acts is distant. Denying the precautionary principle here is risky.

  ### 5. The Complicity/Integrity Objection (Moral Psychology)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "Even if you cause no harm, aren't you complicit in the harm caused by others? By participating in a harmful practice, you normalize it and lose moral integrity. Doesn't the duty to keep one's hands clean require abstention, regardless of efficacy?"

  **Reply (2 mins):**
  "Complicity is a powerful intuition, but it risks becoming a form of moral fetishism. If the goal is to reduce harm, focusing on 'clean hands' can be counterproductive if it distracts from effective action.
  Furthermore, complicity usually requires some form of endorsement or reinforcement. If I fly but publicly advocate for high carbon taxes and rail investment, am I normalizing flying or highlighting the lack of alternatives? My view allows that one can participate in a system while working to dismantle it, provided one fulfills the 'threshold' duties (political action) that actually drive change. Integrity is found in coherence with effective moral goals, not ritual purity."

  *   **Confidence:** 7/10
  *   **Weakest Point:** "Ritual purity" sounds dismissive. For many, participation *is* endorsement. Distinguishing between "participating" and "endorsing" is difficult when the participation fuels the market demand.

  ### 6. The Voting Inconsistency Objection (Internal Consistency)
  **Likelihood:** Low | **Damage:** High
  **Phrasing:** "You say voting is required but flying isn't. But in a national election, my single vote is just as causally inefficacious as my single flight. The probability of being decisive is infinitesimal. Why is voting a 'threshold case' but flying isn't?"

  **Reply (2 mins):**
  "The difference is the *type* of threshold. Voting is part of a *constitutive* process where the threshold is the definition of the outcome (winning the election). Even if my vote doesn't tip it, it is a necessary unit of the *mechanism* of authority.
  Flying is part of an *aggregative* process where the harm is a side effect. In voting, the act is intrinsically linked to the collective decision rule. In consumption, the act is linked to harm only via complex market mediation. We have a duty to participate in the mechanism of collective decision-making (voting) precisely because that is the only way to legally alter the thresholds that govern consumption."

  *   **Confidence:** 6/10
  *   **Weakest Point:** The causal probability of a single vote deciding an election is often lower than the probability of a single purchase affecting supply. Relying on "constitutive vs. aggregative" might look like special pleading for voting.

  ---

  ### The "Hope Nobody Asks" Question
  **Question:** "If individual consumption acts are not morally required because they lack discernible difference, does that mean it is *morally permissible* to continue them indefinitely, even if you know the collective result is catastrophic? If you say 'yes,' you seem to license moral free-riding. If you say 'no,' on what grounds do you prohibit it if it's not morally required?"

  **Why this is dangerous:** It forces you to admit that your theory might allow agents to knowingly contribute to catastrophe without violating a moral requirement, which sounds absurd. Or, you have to introduce a "supererogatory" category that does all the work, rendering the "not required" claim trivial.

  **Prepared Answer (Brief):** "It is permissible *ceteris paribus*, but *ceteris* is never *paribus*. We have a duty to promote just institutions. If continuing the act undermines that duty (e.g., by signaling lack of commitment to the cause), it becomes impermissible. The prohibition comes from the *political* duty, not the *consumption* act itself."
  *(Note: This is the hardest pivot to make smoothly.)*

  ---

  ### General Strategic Advice
  1.  **Don't fight the Consequentialists on Math:** You will lose on expected utility calculations. Fight them on **Epistemology** (we can't know the numbers) and **Action-Guidance** (heuristics are better than speculative math).
  2.  **Befriend the Political Theorists:** Concede the "Structural Injustice" point quickly. Frame your paper as "How to live ethically *within* structural injustice," not "How to solve structural injustice."
  3.  **Watch the "Voting" Trap:** If they press hard on the voting inconsistency, concede that voting is a "special case of collective agency" rather than a standard causal act. Don't try to prove voting is causally potent; argue it is *constitutively* potent.
  4.  **Tone:** Avoid sounding like you are giving people an "excuse." Frame it as "redirecting moral effort from futile gestures to effective leverage."
