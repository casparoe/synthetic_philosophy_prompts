      *   *Fourth:* The Threshold/Sensitivity Objection (Empirical challenge to the "inefficacy" premise).
      *   *Fifth:* Complicity/Integrity (Moral psychology angle).
      *   *Sixth:* The Voting Inconsistency (Internal consistency check).

  5.  **Draft Replies (aiming for ~2 minutes spoken):**
      *   *Strategy:* Acknowledge strength, pivot to the specific qualification of the theory, or challenge the empirical/moral premise.
      *   *Constraint:* Must include confidence rating and "least sure point."

  6.  **Develop the "Hope Nobody Asks" Question:**
