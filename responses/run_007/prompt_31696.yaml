          *   Address the specific norm of "independent corroboration."

  2.  **Deconstruct the Philosophical Positions:**
      *   **Reductionism (Humean):** Testimony is *not* a basic source of justification. Belief based on testimony is justified only if it reduces to other sources (perception, memory, induction/inference). I need positive reasons to trust the speaker (track record, consistency with known facts). Default stance: Skepticism/Neutrality until proven reliable.
      *   **Anti-Reductionism (Reidian):** Testimony *is* a basic source of justification. We are entitled to believe what we are told unless there are specific defeaters (reasons not to believe). Default stance: Trust/Presumption of truth.

  3.  **Translate into Journalistic Vocabulary:**

      *   *Reductionism:* This sounds like "Trust but verify" taken to the extreme. Every claim needs backing. A source's word isn't enough. You need to check their track record, cross-reference with other sources, check internal plausibility. It aligns with "independent corroboration."
      *   *Anti-Reductionism:* This sounds like "On good authority." If a trusted expert says it, you run it, unless something smells fishy. It aligns with "attribution" where the authority *is* the justification. It acknowledges the impossibility of verifying everything personally (e.g., complex immunology).

  4.  **Drafting the Restatements (Iterative Process):**

      *   *Drafting Reductionism:* Focus on "due diligence." The journalist shouldn't believe the immunologist just because they are an immunologist. They need to check the preprint, ask a rival statistician, see if it fits known data. Justification comes from the *work* the journalist does, not the *status* of the source.
      *   *Drafting Anti-Reductionism:* Focus on "authority" and "default trust." If the university press office sends a release, you assume it's true unless you have a reason to doubt. You can't re-run the lab experiment. The warrant comes from the social structure of expertise.

  5.  **Developing the Residue Report:**
      *   *Clean Translations:* "Track record" maps to inductive inference (Reductionism). "On good authority" maps to default warrant (Anti-Reductionism).
      *   *Distortions:* Philosophy cares about *justification for belief*. Journalism cares about *justification for publication*. These are different. A journalist might believe something but not print it (libel, safety). A journalist might print something they aren't fully convinced by (on the record, attributed).
      *   *No Counterpart:* The philosophical idea of "basic warrant" doesn't account for editorial policy or legal liability. Also, the "deadline" pressure creates a pragmatic constraint philosophy often ignores.

  6.  **Developing the Verdict/Analysis:**
      *   *Is something missing?* Yes, the *social* dimension of knowledge. Journalism is a public act; epistemology is often individual.
      *   *Is the contrast less sharp?* In practice, journalists oscillate. You trust the AP wire (Anti-Reductionist) but investigate a whistleblower (Reductionist).
