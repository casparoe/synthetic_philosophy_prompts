      *   *Premise:* Some people are "backward" (Mill's term/concept) and cannot sustain free institutions yet.
      *   *Mechanism:* Despotism is okay *if* the end is improvement toward liberty.
      *   *Analogy:* Parent/Guardian vs. Child/Ward.
      *   *Goal:* To show that denying liberty now secures liberty later.
