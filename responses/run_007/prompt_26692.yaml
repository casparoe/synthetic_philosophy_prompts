      *   *Tutelage:* The period of colonial rule.
      *   *Maturity:* When the people are "capable" of representative government.
      *   *Accountability:* In the ideal analogy, the guardian is accountable to law/courts for the ward's welfare. In Mill's political version, this is vague (public opinion in the metropole?).
      *   *Exit:* Independence/Self-rule once maturity is reached.

  4.  **Drafting Section 2: The Disanalogies (Sorting):**
