      *   *Verdict:* The analogy carries the conclusion. Without the emotional/moral weight of the parent-child bond, the "duty" becomes "power."
      *   *Better Analogy:* A teacher-student relationship? Still has power imbalance. A trustee-beneficiary in finance? (Actually, this is closer to what Mill *wanted*, but the EIC wasn't a fiduciary in that sense).
