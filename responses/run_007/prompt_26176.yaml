      *   **Output Format:** Essay-style reading followed by a specific JSON summary.

  2.  **Deconstruct Rousseau's Critique (Mental Sandbox):**
      *   Rousseau isn't just saying "theater is bad." He's saying it creates a *substitute* for virtue. I feel sad for Hecuba, so I don't need to help my neighbor. It's a transaction of emotion that ends with the curtain.
      *   He hates the *passivity* of the spectator. In Geneva, he wants festivals where people *are* the spectacle, interacting in the public square.
      *   He worries about *identification*. If I identify with a king, do I lose my civic equality? Or if I identify with a victim, do I just enjoy the pain?

  3.  **Deconstruct *King Lear* (Mental Sandbox):**
      *   *Lear* is notoriously uncomfortable. It's not a "pleasant discharge." It's often described as unbearable.
      *   Does it encourage passivity? We watch suffering we cannot stop.
      *   Does it encourage false virtue? Or does it strip away pretense (Lear on the heath)?
      *   Edgar's "the worst is not..." suggests a cognitive distancing. We analyze pain rather than just feeling it.
      *   The ending: Lear howling over Cordelia. Is this catharsis? Aristotle says tragedy purges pity and fear. *Lear* seems to leave them festering.

  4.  **Synthesize: The Encounter:**
      *   *Confirmation:* The spectacle of Gloucester's blinding is pure voyeurism. The audience watches atrocity without intervening. The "poor naked wretches" speech: Lear realizes his past neglect *while* doing nothing to fix it in the moment.
      *   *Resistance:* The play refuses the "pleasant discharge." It denies the audience the comfort of moral superiority. The silence of the audience isn't isolation; it's a shared shock that might provoke post-theatrical reflection (though Rousseau would doubt this). The play critiques *spectacle* itself (Lear's love test is a bad spectacle; the storm is a true one).
      *   *Implicit Theory:* *Lear* seems to argue that true insight comes only through the destruction of social role-playing. It forces the audience to confront the "bare forked animal." This isn't narcissistic pity; it's existential horror.

  5.  **Drafting the Essay (Iterative Process):**
      *   *Introduction:* Set up the tension. Rousseau's fear of "tears in the dark" vs. *Lear*'s relentless suffering.
      *   *Section 1: The Rousseauian Trap (Confirmation).* Focus on the spectacle of pain. Gloucester's blinding is the prime example. We watch. We do nothing. We feel "bad" but leave safe. Also, the passivity of the seating arrangement mirrors the political passivity Rousseau hates.
      *   *Section 2: The Refusal of Catharsis (Resistance).* Rousseau assumes theater offers a *pleasant* purge. *Lear* denies this. The ending is not cleansing; it's devastating. This disrupts the "self-congratulation" Rousseau mocks. We don't feel virtuous; we feel implicated.
      *   *Section 3: Political Community vs. Isolation.* Rousseau wants active festivals. *Lear* shows the breakdown of community. But does the *experience* of watching it create a community of witnesses? Or does it isolate us in our horror? Edgar's survival suggests a duty to speak ("Speak what we feel"), which counters the silence of the spectator.
      *   *Conclusion:* The encounter reveals that *Lear* is a tragedy about the limits of spectatorship itself. It confirms Rousseau's danger but pushes through it by making the spectator uncomfortable enough to question their own position.

  6.  **Refining the Arguments (Self-Correction):**
