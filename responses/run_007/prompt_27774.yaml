answer: |-
  This is a sharp observation that cuts to the methodological heart of consciousness science. You have identified a tension that philosophers of cognitive science (like Michel, Pascual-Leone, and Seth) have debated extensively.

  Here is the reconstruction of the implicit epistemology, an evaluation of its coherence, and the consequences of altering its assumptions.

  ### 1. The Implicit Epistemology: "Phenomenal Directness, Causal Inferentialism"

  The practice you describe presupposes a specific, bifurcated theory of introspection. We can call it **Phenomenal Directness paired with Causal Inferentialism**.

  *   **Premise A (Phenomenal Directness):** Subjects have privileged, immediate, and generally veridical access to the *phenomenal character* of their current experience. If a light flashes and creates a visual qualia, the subject knows "there is light" better than any external observer could. The report "I saw it" is treated as a *readout* of a state that exists independently of the report.
  *   **Premise B (Causal Inferentialism):** Subjects do *not* have direct access to the *causal mechanisms* producing that experience or their subsequent behavior. When asked "Why did you press the button?" or "Why did you choose that face?", the subject does not look up the log files of their brain. Instead, they construct a plausible narrative based on the available phenomenal data and cultural scripts. This is the domain of confabulation (à la Nisbett & Wilson).
  *   **The Demarcation:** The epistemology draws a hard line between **Experience** (what it is like) and **Metacognition/Narrative** (the story about why it is like that).

  **Is this coherent?**
  Yes, it is logically coherent, provided you accept a specific model of the mind: **Dual-Process or Multi-System architecture.**
  If the brain has a subsystem that generates experience (System 1/Phenomenal) and a separate subsystem that generates language and explanation (System 2/Interpretive), then it makes perfect sense that the second subsystem can accurately report the *output* of the first ("I see red") without understanding the *wiring* of the first ("I see red because V4 activated"). The report "I saw it" is treated as a behavioral proxy for the phenomenal state, whereas "I chose it because..." is treated as a hypothesis generated by the interpretive system.

  ### 2. Strict Commitment vs. Pragmatic Necessity

  Is the field strictly committed to this theory, or is it a pragmatic double standard?

  It is primarily a **pragmatic necessity disguised as a theoretical commitment.**

  *   **The Operational Trap:** Consciousness science needs an operational definition. If you cannot trust "I saw it," you have no way to distinguish conscious from unconscious processing behaviorally. If you discard first-person reports of presence entirely, you are no longer studying consciousness; you are studying neural ignition or information processing. Therefore, researchers *must* treat presence-reports as valid to keep the field alive.
  *   **The Theoretical Flexibility:** However, the practice is compatible with several deeper theories.
      *   **Realists** believe the report tracks a real non-physical or physical state.
      *   **Illusionists** (like Keith Frankish) might argue the experience is an illusion, but the *report* is still a reliable behavioral indicator that the illusion-generating mechanism fired.
      *   **Global Workspace Theorists** argue that "I saw it" is valid only because reporting *requires* global access.

  So, the practice is not strictly committed to "Phenomenal Directness" being metaphysically true. It is committed to the report being a **reliable indicator variable.** They treat the subject as a calibrated instrument for detecting the *presence* of a signal, but not for analyzing the *circuitry*.

  **The "No-Report" Nuance:**
  You mentioned "no-report" paradigms (e.g., Tsuchiya et al.). It is crucial to note that these labs usually do *not* doubt the subject's claim that they saw the stimulus. They doubt that the *act of reporting* (pressing a button, speaking) is neurally neutral. They worry that the motor planning and working memory required to report contaminate the Neural Correlates of Consciousness (NCC). This reinforces the epistemology: The experience is real (trust the "I saw it"), but the *process of telling us about it* adds noise (distrust the motor/cognitive overhead).

  ### 3. Counterfactuals: Changing the Introspection Assumption

  **Scenario A: Introspection is Unreliable Across the Board**
  If we decide subjects cannot even reliably report the *presence* of experience (e.g., they say "I saw it" when they didn't, or vice versa, without us being able to calibrate it):
  *   **Methodological Collapse:** The standard psychophysical paradigm vanishes. We cannot distinguish subliminal from supraliminal perception.
  *   **Shift to Objective Thresholds:** We would have to rely entirely on forced-choice performance (e.g., "Press Left or Right") without confidence ratings. If they perform above chance, we assume some processing occurred, but we could never claim it was *conscious*.
  *   **Theoretical Shift:** The field would likely pivot to identifying "Access Consciousness" (reportability) only, abandoning "Phenomenal Consciousness" (experience) as scientifically unmeasurable. This is essentially the behaviorist return or the adoption of Dennett's "Heterophenomenology" where the report is treated as fiction to be explained, not truth to be recorded.

  **Scenario B: Introspection is Reliable Across the Board**
  If we decide subjects have transparent access to causes and mechanisms:
  *   **Invalidation of Confabulation Research:** Choice blindness and split-brain findings would have to be reinterpreted. If a split-brain patient says "I chose the shovel because I want to clean the snow," and we accept that as true, we must posit a unified conscious agent we currently can't detect.
  *   **End of Cognitive Psychology as we know it:** If subjects can accurately introspect the causes of their behavior, we don't need experiments to find mechanisms; we can just ask them. The hidden variables (biases, heuristics, unconscious priming) would cease to exist as scientific constructs.
  *   **Validation of Folk Psychology:** Our everyday assumptions about why we do things would be vindicated. Science would shift from discovering hidden causes to cataloging introspective truths.

  ### 4. Confidence and Uncertainty

  **Confidence Level:** **85%**
  I am highly confident in this reconstruction because it aligns with the explicit methodological papers of major labs (Dehaene, Koch, Lamme) and the philosophical literature surrounding the "Measurement Problem" in consciousness science. The distinction between *phenomenal content* and *metacognitive judgment* is the standard framework used to resolve the tension you identified.

  **Point of Least Certainty:**
  The single point I am least sure of is **the motivation behind "No-Report" paradigms.**
  There is an ongoing debate about whether "No-Report" proponents distrust the *veracity* of the subjective report (i.e., "The subject thinks they saw it, but they are wrong") or merely the *neural purity* of the report (i.e., "The subject saw it, but pressing the button recruits prefrontal cortex which hides the true NCC").
  *   If it's the former, they are skeptical of Phenomenal Directness.
  *   If it's the latter, they accept Phenomenal Directness but reject the report as a clean neural measure.
  Most literature suggests the latter, but the rhetoric sometimes blurs this, implying that without a report, we can't be sure consciousness was there, which circles back to your original critique. The exact epistemic status of the "unreported experience" remains the wobbliest pillar in the reconstruction.
