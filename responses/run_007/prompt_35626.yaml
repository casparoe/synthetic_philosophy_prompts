answer: |-
  You have hit on one of the most significant and debated distinctions in behavioral ecology. Your intuition is correct: the frog's croak and the peacock's tail represent fundamentally different mechanisms for ensuring signal honesty.

  The short answer is: **Yes, "Index Signal" is the standard term,** and yes, there is an established taxonomy that draws a sharp line between indices and handicaps, though the boundary can get blurry in complex biological systems.

  Here is the breakdown of the taxonomy, the mechanistic differences, and how biologists handle signals that seem to be both.

  ### 1. The Standard Taxonomy
  The most widely accepted framework comes from John Maynard Smith and David Harper's 2003 book, *Animal Signals*. They classify honest signals into three categories based on **what prevents cheating**:

  1.  **Indices (Physically Constrained):**
      *   **Mechanism:** The signal is physically linked to the quality being signaled.
      *   **Why it's honest:** It is physically impossible (or physiologically prohibitive) to fake.
      *   **Example:** The frog's croak. A small vocal cord cannot vibrate at a low frequency regardless of how much energy the frog expends. The signal is "yoked" to the trait.
      *   **Cost:** Production might cost energy, but the *honesty* does not depend on a differential cost.

  2.  **Handicaps (Strategically Costly):**
      *   **Mechanism:** The signal is costly to produce or maintain.
      *   **Why it's honest:** Low-quality individuals *could* physically produce the signal, but doing so would reduce their fitness (survival/reproduction) more than it would for a high-quality individual. This is known as **differential cost**.
      *   **Example:** The peacock's tail. A weak peacock *could* grow a big tail, but it would likely die from predation or starvation before mating. A strong peacock can absorb that cost.
      *   **Cost:** The cost is the *enforcer* of honesty.

  3.  **Conventional Signals (Socially Constrained):**
      *   **Mechanism:** The signal is cheap to produce and arbitrary (not physically linked to quality).
      *   **Why it's honest:** Honesty is enforced by punishment. If you bluff, you get challenged and beaten.
      *   **Example:** The black bib of the house sparrow. It signals aggression. If a weak sparrow sports a big bib, stronger sparrows will attack it, revealing the bluff.

  ### 2. Index vs. Handicap: The Fundamental Distinction
  You asked if the distinction is fundamental or a matter of degree. Theoretically, it is **fundamental** because the *source of reliability* is different.

  *   **In a Handicap:** The receiver trusts the signal because the sender pays a price. If the price were removed, the signal would become unreliable (cheating would evolve).
  *   **In an Index:** The receiver trusts the signal because the sender has no choice. Even if the signal were free to produce, a small frog still could not make a deep sound.

  **The "Cost" Confusion:**
  This is where most confusion arises. Indices *do* often have costs (roaring takes energy). However, in signal theory, we distinguish between **production cost** and **strategic cost**.
  *   **Frog:** Roaring costs calories (production cost). But a small frog cannot buy a deeper voice by eating more flies. The honesty comes from anatomy, not the calorie burn.
  *   **Peacock:** Growing the tail costs calories and safety (strategic cost). The honesty comes *because* of that cost.

  ### 3. What if a signal is Both? (Hybrid Signals)
  You asked: *"If a signal is both physically constrained AND costly, which category does it fall into?"*

  This is common. A stag's roar is an index of body size (vocal tract length), but roaring is also energetically expensive and attracts predators (handicap).

  In these cases, biologists classify the signal based on **which mechanism is necessary to prevent cheating.**
  *   If the physical constraint makes cheating impossible, it is an **Index**, even if there are additional costs. The costs might serve other functions (e.g., ensuring the signaler is motivated), but they aren't needed to ensure the *accuracy* of the size information.
  *   However, if the physical constraint is "leaky" (e.g., a small animal can slightly lower its pitch through effort, but it's exhausting), then it becomes a **Hybrid**.

  Most modern evolutionary biologists view these not as rigid boxes but as endpoints on a **continuum of fakability**.
  *   **Hard Index:** Physically impossible to fake (e.g., insect wing buzz frequency).
  *   **Soft Index:** Physiologically very difficult to fake (e.g., deep frog croak).
  *   **Handicap:** Possible to fake, but too costly (e.g., antler size).
  *   **Conventional:** Easy to fake, punished socially (e.g., color badges).

  ### 4. Is the Distinction Controversial?
  Yes. There is a faction of theorists (often following Amotz Zahavi's original strictures) who argue that **all signals must be costly to be stable.** They argue that if an index has *any* production cost, and if that cost is differential (harder for a weak animal to produce), it technically fits the mathematical models of the Handicap Principle.

  However, the majority view (championed by Maynard Smith, Hurd, and Searcy) is that distinguishing them is crucial for understanding evolution:
  *   **Handicaps** evolve because the cost *creates* the information.
  *   **Indices** exploit pre-existing physical information; the signal evolves to *reveal* information that already exists.

  ### 5. Summary of Terminology
  To clear up the vocabulary for your reading:

  *   **Index / Index Signal:** The term you encountered. Standard usage for physically constrained signals.
  *   **Unfakeable Signal:** Often used synonymously with Index.
  *   **Condition-Dependent Signal:** Usually refers to Handicaps (the signal depends on the "condition" or quality of the individual).
  *   **The Zahavi-Handicap Debate:** The historical argument over whether cost is *always* required.

  ### Recommendation for Further Reading
  If you want to read the primary source that formalized this distinction, look for:
  *   **Maynard Smith, J., & Harper, D. (2003). *Animal Signals*.** (Specifically Chapter 2).
  *   **Hurd, P. L. (1995). "Communication in discrete action-response games."** (This paper formally modeled indices vs. handicaps).

  **Verdict:** You are right to separate them. The frog's croak is an **Index**. The peacock's tail is a **Handicap**. While they both result in "honest signaling," the evolutionary logic maintaining them is mechanistically distinct. When you see a signal that is both, classify it by the constraint that *actually stops the liar*—if physics stops the liar, it's an index; if poverty stops the liar, it's a handicap.
