answer: |-
  Your hunch that Vonnegut's story equalizes achieved functionings by destroying capabilities is a robust starting point for the seminar, and it holds up well under philosophical scrutiny, though it requires some nuance to fully separate the story's caricature from the serious theories you intend to teach. The society in Harrison Bergeron is not equalizing welfare, for the general population is depicted as sedated, pained, or cognitively diminished, and the protagonist Harrison is executed for seeking excellence. Nor is it equalizing resources in the Dworkinian sense, as the state does not redistribute external goods to compensate for bad luck but rather physically and mentally alters the citizens to prevent the expression of natural endowments. Instead, the Handicapper General enforces a strict equality of outcome, or achieved functioning, by actively suppressing the underlying capabilities. In the language of Amartya Sen, a functioning is what a person manages to do or be, while a capability is the substantive freedom to achieve those functionings. The ballerinas in the story are weighted with sash weights and masked so that their performance matches the average; their functioning is equalized, but their capability to dance beautifully is not enhanced or respected, it is crushed. This distinction is vital for your students because it allows you to demonstrate that serious egalitarianism, particularly the capability approach, is concerned with expanding freedom, not restricting it to meet a statistical mean. Vonnegut presents a world where equality is mistaken for uniformity, and where the metric of justice is not whether people have the freedom to flourish, but whether they appear identical in their output.

  If you ask a welfarist to diagnose this society, they would condemn it on the grounds of aggregate well-being. Classical welfarism seeks to maximize happiness or preference satisfaction, and the world of Harrison Bergeron is one of universal diminishment. George Bergeron suffers physical pain from the mental-handicap radio in his ear, which blasts noises to interrupt his thoughts, and Hazel is incapable of sustained sorrow or joy due to her average intelligence. The total sum of welfare is low, and the distribution is arguably equal only in the sense that everyone is equally deprived of the capacity for deep satisfaction. However, a welfarist critique might struggle slightly if the citizens were successfully sedated into enjoying their state, but Vonnegut safeguards against this by showing George's resentment and fear, ensuring that even subjective welfare is compromised. A resourcist like Ronald Dworkin would offer a sharper structural critique focused on the treatment of talent and ambition. Dworkin's theory of equality of resources distinguishes between brute luck, which should be compensated, and option luck, for which individuals are responsible. Crucially, his model is ambition-sensitive; it allows people to benefit from their choices and efforts. The Handicapper General's regime violates this by treating natural talent not as a resource to be managed or insured against, but as a threat to be neutralized. When George wears the handicap bag to offset his strength, the state is effectively taxing his internal resources at a one hundred percent rate, destroying the link between ambition and outcome. Dworkin would argue that the state should compensate those with fewer natural assets, perhaps through social support or training, but it should never penalize the talented for their endowment. The story illustrates the horror of ignoring the ambition-sensitivity constraint, showing a world where excellence is treated as a social debt that must be paid through physical suffering.

  The capability theorist, following Sen or Nussbaum, would identify the core injustice as the reduction of human freedom. For Sen, development is the expansion of capabilities, the real opportunities people have to lead the lives they value. In Vonnegut's story, the state operates on a presumption that equality requires the reduction of the highest capabilities to match the lowest. This illuminates a distinction that philosophical articles sometimes state abstractly but which the story dramatizes viscerally: the difference between leveling up and leveling down. The philosophical literature often discusses the leveling down objection, which posits that equality is not valuable if it is achieved only by making the better off worse off without improving the worse off. Vonnegut provides the perfect narrative embodiment of this objection. The weighted ballerinas are not lifted by better training or nutrition; they are dragged down by lead balls. This allows your students to see that a commitment to equality of capability would demand enhancing the abilities of the less gifted, not lobotomizing the gifted. The story resists a philosophical reading only in its assumption that these are the only two options. It presents a false dichotomy where the only alternative to brutal suppression is chaotic inequality, ignoring the possibility of a society that enhances the baseline without capping the ceiling. However, this resistance is pedagogically useful, as it forces students to articulate why enhancement is possible and desirable, thereby clarifying the positive claims of the capability approach against the story's negative example.

  Specific scenes in the text serve as excellent anchors for these theoretical distinctions. Consider the moment when George's mental-handicap radio transmits a sharp noise to break his train of thought. A resourcist would analyze this as an violation of internal resource integrity; George's mind is his own property, and the state's intrusion prevents him from utilizing his natural endowment. A capability theorist would focus on the loss of the freedom to think, a central human functioning. But the scene also illuminates the cost of enforcement, a topic often underplayed in ideal theory. The philosophical literature frequently discusses the principles of distribution without fully grappling with the bureaucratic machinery required to maintain them. Vonnegut shows that maintaining this specific type of equality requires constant surveillance and inflicting pain. George accepts the pain because he fears a return to the dark ages of competition, suggesting that the society relies on a manufactured consent born of fear rather than a genuine commitment to justice. This highlights the difference between compensating for unchosen natural disadvantage and punishing the exercise of talent. Serious egalitarians want to mitigate the effects of bad brute luck, such as a disability or a lack of innate aptitude. Vonnegut's society punishes good brute luck, such as intelligence or strength. By pairing the text with luck egalitarianism, you can show students that the story attacks a straw man that luck egalitarians also reject. No serious theorist argues that the strong should be weighed down; they argue that the weak should be supported. The story conflates these two projects, treating every attempt to correct natural inequality as the same kind of absurdity.

  The climax of the story, where Harrison removes his handicaps and dances with the ballerina, offers a potent visualization of the capability set expanding. When Harrison sheds the weights and the mask, he does not just change his resources; he actualizes a potential that was previously blocked. He and the ballerina leap toward the ceiling, a physical manifestation of exceeding the imposed limits of functioning. This scene allows you to discuss the intrinsic value of excellence. For a welfarist, the dance might be justified if it produced enough happiness, but for a capability theorist, the dance is valuable in itself as an expression of human freedom and potential, regardless of the aggregate welfare it produces. The fact that they are shot for this transgression underscores the regime's commitment to equality of outcome over equality of opportunity. The ending, where Hazel and George forget the tragedy immediately due to their handicaps, reinforces the welfare critique. The society survives only because its citizens are incapable of remembering their oppression. This suggests that the equality being pursued is incompatible with full human agency. If students are asked to evaluate the society through the three lenses, they will find that all three condemn it, but for different reasons that map onto your course distinctions. The welfarist condemns the misery, the resourcist condemns the violation of ambition and property in oneself, and the capability theorist condemns the destruction of freedom.

  Ultimately, the story gives your students something the articles alone do not: an emotional and intuitive grasp of why the metric of equality matters. Reading Rawls or Sen can sometimes feel like an exercise in balancing abstract variables, but seeing George wince in pain every time he thinks too hard makes the stakes of the equality-of-what debate immediate. It forces the question of what we are trying to equalize and why. If the answer is welfare, Vonnegut shows us that sedation is a efficient but repulsive solution. If the answer is resources, he shows us that confiscating talent is a violation of the self. If the answer is capabilities, he shows us that freedom is the casualty of enforced uniformity. Your hunch that the story equalizes achieved functionings by destroying capabilities is correct, but the deeper lesson is that this is a category error. Equality of capability requires that people have the effective freedom to achieve different functionings. Vonnegut's Handicapper General assumes that equality requires identical functionings, which necessitates the destruction of varying capabilities. By working through this error, your students will better understand that serious egalitarianism is not about making everyone the same, but about ensuring everyone has the genuine freedom to be who they are. The story serves as a negative blueprint, outlining exactly what a theory of justice must avoid, and in doing so, it clarifies what that theory must affirm. It transforms the leveling down objection from a logical puzzle into a human tragedy, ensuring that when your students return to the philosophical texts, they understand that the choice of metric is not merely technical, but deeply moral.
