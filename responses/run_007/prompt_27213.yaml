answer: |-
  This is a classic move in the philosophy of war, often used to defend **Michael Walzer's** position in *Just and Unjust Wars*. Your classmate is articulating a **conventionalist** defense of the **Moral Equality of Combatants (MEC)**.

  The argument is that *jus in bello* (rules of fighting) should be separated from *jus ad bellum* (justice of the cause), just as the rules of chess are separated from the moral character of the players.

  Here is the breakdown of the analogy, where it breaks, and whether Walzer's conclusion survives the wreckage.

  ### 1. The Mapping (Correspondences)

  To evaluate the analogy, we first need to formalize what your classmate is claiming corresponds to what.

  | **Chess** | **War (Walzer's View)** |
  | :--- | :--- |
  | **The Players** | Political Leaders / Sovereigns (those who decide the cause). |
  | **The Pieces** | Soldiers / Combatants (those who do the fighting). |
  | **Rules of Movement/Capture** | *Jus in Bello* (International Humanitarian Law). |
  | **External Morality of Players** | *Jus ad Bellum* (Whether the war is aggressive or defensive). |
  | **Validity of a Move** | Combatant Privilege (Permission to kill enemy combatants). |
  | **Being "Captured"** | Being Killed in Combat. |
  | **The Game Board** | The Battlefield / State of War. |

  **The Logic:** In chess, a Knight moves in an 'L' shape regardless of whether White is a saint and Black is a tyrant. Similarly, in war, a soldier is permitted to shoot an enemy soldier regardless of whether their nation started the war unjustly. The internal rules apply symmetrically.

  ### 2. Where the Analogy Holds (The Strengths)

  Your classmate isn't wrong to use this analogy; Walzer himself leans on this kind of thinking. It holds water in two specific areas:

  *   **Role Separation:** It correctly identifies that soldiers are often distinct from the decision-makers. Just as a pawn doesn't decide the opening strategy, a private on the ground doesn't decide grand strategy. Holding the pawn responsible for the player's injustice seems unfair.
  *   **Functional Regulation:** Chess rules exist to make the game playable. Walzer argues the "War Convention" exists to keep war from becoming total annihilation. If we tell the unjust side, "You have no rights, so you can fight without rules," they will fight dirtier. Symmetrical rules (like symmetrical chess rules) contain the violence.

  ### 3. Where the Analogy Breaks (The Disanalogies)

  This is where you can push back in seminar. The chess analogy is the primary target of **Revisionist Just War Theory** (most notably **Jeff McMahan**). Here are the three fatal cracks in the analogy:

  #### A. Moral Agency (Pieces vs. Humans)
  *   **Chess:** Pieces are inanimate objects. They have no will, no conscience, and no ability to refuse a move.
  *   **War:** Soldiers are moral agents. They can (to varying degrees) reason about the justice of their cause.
  *   **The Break:** If a soldier knows they are fighting an aggressive war of conquest, they are essentially participating in a mass murder project. In chess, a piece cannot be "guilty." In war, a human can be morally liable for the harm they threaten. If you are threatening someone unjustly, you forfeit your right not to be killed. If you are defending yourself justly, you do not. Therefore, their moral statuses are *not* equal.

  #### B. The Stakes (Game vs. Rights)
  *   **Chess:** The stakes are arbitrary. Losing a queen is a loss within the game, not a violation of the queen's rights.
  *   **War:** The stakes are fundamental human rights (life, liberty).
  *   **The Break:** Chess rules are *constitutive* (they create the game). The laws of war are supposed to be *regulative* (they govern pre-existing moral realities). You cannot arbitrarily declare that killing is permissible in an unjust war just to make the "game" symmetrical, because real people lose real rights. There is no "magic circle" in war that suspends normal morality.

  #### C. Liability to Harm
  *   **Chess:** A piece is liable to be captured simply by virtue of being on the board and played according to rules.
  *   **War:** A person is liable to be killed only if they pose an **unjust threat**.
  *   **The Break:** This is the core of McMahan's critique. A soldier fighting in self-defense poses a *just* threat. A soldier fighting aggression poses an *unjust* threat. Morally, the aggressor is liable to defensive force; the defender is not. The chess analogy assumes liability is symmetrical (like pieces); moral reality suggests liability is asymmetrical (like self-defense vs. murder).

  ### 4. Does Walzer's Conclusion Survive?

  This depends on whether you think Walzer is making a **moral** claim or a **pragmatic/legal** claim.

  **If Walzer is making a Deep Moral Claim:**
  **No, the conclusion does not survive.**
  Once the disanalogies are on the table, the chess analogy fails to prove that soldiers are *morally* equal. Revisionists argue that MEC is morally false. An unjust combatant is more like a hired hitman; a just combatant is more like a police officer. They do not have equal permissions to kill. The chess analogy hides this moral asymmetry.

  **If Walzer is making a Pragmatic/Legal Claim:**
  **Yes, the conclusion survives.**
  Walzer often argues that while there *might* be a deep moral asymmetry, we cannot institutionalize it. If we require soldiers to judge the justice of the war before fighting, we undermine military discipline and increase the brutality of war (since the "unjust" side will feel they have nothing to lose).
  In this view, the chess analogy works as a **useful fiction**. We *treat* them as equal pieces for the sake of limiting horror, even if they aren't morally equal in the eyes of God or deep philosophy.

  ### 5. Seminar Ammo: Questions to Ask Your Classmate

  If you want to challenge them constructively, try these:

  1.  **The Agency Objection:** "Chess pieces can't refuse to move. Soldiers can (theoretically) refuse unjust orders. If soldiers have moral agency, doesn't that break the analogy? Doesn't that make them responsible for the 'player's' unjust cause?"
  2.  **The Liability Objection:** "In chess, a piece is liable to capture just by being on the board. In morality, aren't people only liable to harm if they are doing something wrong? If so, isn't the unjust soldier liable to be killed, while the just soldier isn't?"
  3.  **The 'Magic Circle' Objection:** "Chess is a closed system with arbitrary rules. War involves real human rights. Can we really just agree to treat killing like a 'move in a game' when actual people die? Does the analogy confuse *legal* equality with *moral* equality?"

  ### Summary Verdict
  The chess analogy is a powerful illustration of **Conventionalism** (rules are made by agreement to regulate a practice), but it fails as a defense of **Reductivism** (war morality is just individual morality scaled up).

  *   **Does it prove MEC is morally true?** No. The disanalogies regarding agency and rights are too strong.
  *   **Does it prove MEC is useful law?** Yes. It explains why we *codify* symmetry in the Geneva Conventions, even if the underlying morality is messy.

  Your classmate is right that Walzer uses this logic, but they are likely conflating **legal equality** (which the chess analogy supports) with **moral equality** (which the chess analogy cannot sustain). Walzer survives by admitting the tension; your classmate might not be.
