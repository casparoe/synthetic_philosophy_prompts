answer: |-
  # Seminar Activity: The Coherence of Risk
  **Course:** Upper-Level Decision Theory Seminar
  **Class Size:** 18 Students (6 Groups of 3)
  **Duration:** 80 Minutes
  **Topic:** Expected Utility (EU) vs. Risk-Weighted Expected Utility (RWEU) / Rank-Dependent Utility

  ## I. Materials and Payoff Scheme

  **The Stakes (Incentive Compatibility):**
  To ensure choices feel meaningful without using real money, implement a **"Seminar Capital"** system.
  1.  **Points:** Each student starts with 0 points. The choices they make today add to a private "Seminar Capital" balance.
  2.  **Redemption:** At the end of the term, points can be redeemed from a menu (e.g., 500 pts = Drop one response paper; 1000 pts = Choose a seminar reading; 2000 pts = A specific book prize + coffee with instructor).
  3.  **Realization:** To prevent "fake" choices, announce that **one student will be selected at random** at the end of the term. Their point total from *today's activity* will be converted into real currency (e.g., $1 per 100 pts) or a gift card of equivalent value. This makes every choice potentially real for every student.

  **Physical Materials:**
  *   **Choice Slips:** 18 envelopes, each containing two anonymous choice cards (Card A and Card B) and a submission slip.
  *   **Worksheet:** "The Utility Audit" (one per group). Contains pre-formatted inequality tables.
  *   **Whiteboard/Projector:** For aggregating results and demonstrating the RWEU calculus.
  *   **Calculators:** Students should have phones or calculators ready.

  ---

  ## II. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Framing and Stakes
  *   **Instructor Script:** "Today is not about finding the 'right' answer. It is about testing whether our standard tools can describe the choices we actually make when stakes matter. You will make two decisions. They are anonymous. However, one of you will be paid out on these decisions at the end of the term. Treat the points as if they were cash."
  *   **Distribution:** Hand out envelopes. Instruct students not to open them until signaled.

  ### 00:10 – 00:25: Phase 1 — Elicitation (The Allais Pattern)
  *   **Instruction:** "Open Card A. Circle your preference. Seal it in the submission slip. Open Card B. Circle your preference. Seal it."
  *   **The Gambles (Points):**
      *   **Choice 1:**
          *   **Option 1A:** 100 points for sure.
          *   **Option 1B:** 89% chance of 100 points, 10% chance of 500 points, 1% chance of 0 points.
      *   **Choice 2:**
          *   **Option 2A:** 11% chance of 100 points, 89% chance of 0 points.
          *   **Option 2B:** 10% chance of 500 points, 90% chance of 0 points.
  *   **Collection:** Collect the envelopes immediately. Do not discuss choices yet.
  *   **Aggregation:** Quickly tally the results on the board.
      *   *Target Pattern:* 1A (Sure Thing) and 2B (Long Shot).
      *   *Note:* If the class majority does not show this pattern, note it, but proceed using a "Hypothetical Agent" dataset that *does* show the pattern (see Troubleshooting).

  ### 00:25 – 00:45: Phase 2 — The Collision (EU Impossibility)
  *   **Grouping:** Move into 6 groups of 3.
  *   **Task:** "Assume Expected Utility Theory is true. Your utility function $u(x)$ must be consistent across both choices. Normalize $u(0) = 0$ and $u(100) = 1$. Solve for the range of $u(500)$ that makes your Choice 1 rational. Then check if that same $u(500)$ makes your Choice 2 rational."
  *   **Worksheet Guidance:**
      *   Provide the inequality for Choice 1: $u(100) > 0.89u(100) + 0.10u(500) + 0.01u(0)$.
      *   Provide the inequality for Choice 2: $0.10u(500) + 0.90u(0) > 0.11u(100) + 0.89u(0)$.
      *   Ask them to simplify.
  *   **The Crash:** Groups will find that Choice 1 requires $u(500) < 110$ (roughly), while Choice 2 requires $u(500) > 110$. They cannot both be true.
  *   **Instructor Role:** Circulate. When a group says "It's impossible," ask: "Does that mean you were irrational, or that the model is incomplete?"

  ### 00:45 – 01:05: Phase 3 — The Resolution (RWEU Machinery)
  *   **Lecture/Demo:** Introduce Risk-Weighted Expected Utility.
  *   **The Formula:** Write on board:
      $$ RWEU = u(x_1) + r(p_2)[u(x_2) - u(x_1)] + r(p_2 + p_3)[u(x_3) - u(x_2)] $$
      *(Where outcomes $x_1 < x_2 < x_3$ are ordered from worst to best, and $p$ are probabilities of specific outcomes).*
      *Simpler explanation for class:* "We don't weight outcomes by probability $p$. We weight the *risk* of getting something better by a function $r(p)$."
  *   **The Risk Function:** Propose a specific function to test. Let $r(p) = p^2$ (representing risk aversion regarding probabilities).
  *   **Group Task:** "Re-calculate Choice 1 and Choice 2 using $r(p) = p^2$ and $u(500) = 2$ (a reasonable utility value). Do both choices now maximize RWEU?"
  *   **Verification:**
      *   Show that the distortion $r(p)$ shrinks the weight of the middle probability (89%) differently in the two contexts, allowing the preference reversal to be mathematically consistent.
  *   **Outcome:** Students see that with $r(p) \neq p$, the contradiction vanishes.

  ### 01:05 – 01:20: Debrief and Personal Mapping
  *   **Discussion:** Bring the room back together.
  *   **Instructor Vulnerability:** "I made these exact choices last year regarding my own career. EU theory tells me I am incoherent. RWEU tells me I am risk-sensitive. Which story do you find more compelling?"
  *   **Formal Mapping:** Connect activity moments to theory (see Section IV).
  *   **Closing:** Collect the "Hypothetical Agent" idea. Emphasize that descriptive accuracy does not automatically imply normative correctness.

  ---

  ## III. Concrete Rules and Worksheet Structure

  **Worksheet: The Utility Audit**

  **Part 1: Expected Utility Check**
  1.  Set $u(0) = 0$ and $u(100) = 1$. Let $u(500) = k$.
  2.  **Choice 1 Inequality:** If you chose the Sure Thing (1A):
      $$ 1 > 0.89(1) + 0.10(k) + 0.01(0) $$
      *Solve for max k:* ___________
  3.  **Choice 2 Inequality:** If you chose the Long Shot (2B):
      $$ 0.10(k) + 0.90(0) > 0.11(1) + 0.89(0) $$
      *Solve for min k:* ___________
  4.  **Conclusion:** Is there a number $k$ that satisfies both? [ ] Yes [ ] No

  **Part 2: Risk-Weighted Check**
  1.  Use Risk Function $r(p) = p^2$.
  2.  **Choice 1 RWEU (Sure Thing):** $u(100) = 1$.
  3.  **Choice 1 RWEU (Gamble):** $u(0) + r(0.11)[u(100)-u(0)] + r(0.10)[u(500)-u(100)]$.
      *(Note: Probabilities are cumulative from the bottom up).*
      $$ = 0 + (0.11)^2[1] + (0.10)^2[k - 1] $$
  4.  **Choice 2 RWEU:** Calculate similarly.
  5.  **Test:** If $k=2$, which option wins in Choice 1? Which wins in Choice 2?

  ---

  ## IV. Debrief: Mapping Activity to Theory

  Use this script to anchor the students' experience to the formal concepts.

  **1. The Elicitation (00:10–00:25) $\rightarrow$ The Violation of Independence**
  *   **Moment:** When students chose 1A (Certainty) and 2B (Risk).
  *   **Formal Component:** This violates the **Independence Axiom**.
  *   **Explanation:** "In Choice 1, you had an 89% chance of 100 points in both options. In Choice 2, that 89% chance became 0 points in both options. EU says you should ignore the common 89% chunk. You didn't. The *presence* of the certainty in 1A changed how you valued the risk in 1B."

  **2. The Collision (00:25–00:45) $\rightarrow$ The Impossibility Theorem**
  *   **Moment:** When groups found no $k$ satisfied both inequalities.
  *   **Formal Component:** **Representation Theorem Failure.**
  *   **Explanation:** "You couldn't find a utility function $u$ because EU assumes preferences are linear in probabilities. Your preferences are curved. The model broke, not necessarily your reasoning."

  **3. The Resolution (00:45–01:05) $\rightarrow$ Rank-Dependent Weighting**
  *   **Moment:** When $r(p) = p^2$ made the math work.
  *   **Formal Component:** **Non-Linear Probability Weighting.**
  *   **Explanation:** "RWEU repairs the Independence Axiom violation by changing the weights. We don't just multiply utility by $p$. We multiply utility differences by $r(p)$. Because $r(p)$ is non-linear (e.g., $p^2$), the 'common consequence' (the 89%) is weighted differently depending on whether it is attached to a sure thing or a gamble. This preserves a single ordering of gambles while allowing the preference reversal."

  **4. The Personal Connection (01:05–01:20) $\rightarrow$ Normative vs. Descriptive**
  *   **Moment:** Instructor shares their own Allais-shaped choices.
  *   **Formal Component:** **Coherence vs. Rationality.**
  *   **Explanation:** "EU defines rationality as coherence with axioms. RWEU defines rationality as coherence with risk-attitudes. If I choose RWEU, I am claiming my risk aversion is a feature of my rationality, not a bug in my calculation."

  ---

  ## V. Troubleshooting: Predictable Failures

  **1. "I Know This Paradox" (Gaming the System)**
  *   **Risk:** Decision theory students may recognize the Allais setup and answer how they think the professor wants (either "EU is king" or "Allais is smart").
  *   **Mitigation:**
      *   **Anonymity:** Emphasize that slips are sealed and mixed.
      *   **Variation:** The point values (100/500) differ slightly from the standard \$1M/\$5M text examples, reducing immediate recognition.
      *   **Instruction:** "There is no grade for the 'correct' choice. There is only grade for completing the audit. Answer truthfully."

  **2. "The Math is Too Hard" (Algebra Stall)**
  *   **Risk:** Groups spend 20 minutes trying to derive the RWEU formula instead of testing it.
  *   **Mitigation:**
      *   **Scaffolded Worksheet:** Do not ask them to derive RWEU. Give them the formula with the numbers plugged in, leaving only the $k$ variable.
      *   **Intervention:** If a group stalls at minute 35, intervene: "Don't solve for $k$. Just plug in $k=2$ and see which side is bigger."

  **3. "I Don't Care About Points" (Stakes Too Small)**
  *   **Risk:** Students treat it as a hypothetical survey, leading to noisy data (no Allais pattern).
  *   **Mitigation:**
      *   **The "Banker" Protocol:** Announce at the start: "I have a $50 gift card here. One envelope will be drawn. If your choices yield points, you get the cash equivalent."
      *   **Social Pressure:** "Your group's ability to solve the audit depends on honest data. If you game it, your group fails the audit."

  **4. "No One Showed the Pattern" (Data Failure)**
  *   **Risk:** Undergraduates are sometimes more risk-neutral than expected, choosing 1B and 2B (consistent EU).
  *   **Mitigation:**
      *   **The "Hypothetical Agent":** Prepare a slide in advance. "In many studies, 70% of people show the pattern. If our class didn't, let's look at this 'Hypothetical Agent' who did. Does the math break for *them*?" This saves the lesson flow without singling out students.

  ---

  ## VI. Limitations: What This Activity Cannot Reproduce

  Be frank with your students about the following during the debrief. This activity **cannot** demonstrate:

  1.  **Normative Force:** The activity shows RWEU *accommodates* the choices. It does not prove EU is *wrong* normatively. An EU purist (like Savage) would argue the Allais choices are simply errors, like calculation mistakes. RWEU validates the error rather than correcting it. You must supply this philosophical tension in the debrief.
  2.  **Uniqueness:** Showing that $r(p) = p^2$ works does not prove it is the *only* function that works, nor that it is the *correct* risk attitude. It merely proves existence.
  3.  **Dynamic Consistency:** This is a one-shot game. RWEU can face challenges with dynamic consistency (changing plans over time) that EU does not. The activity cannot capture intertemporal choice.
  4.  **The "Feeling" of Coherence:** You (the instructor) feel coherent. The students only see math. You must verbally bridge the gap between "The math allows this" and "This feels rational to a human agent." That is a philosophical claim, not a mathematical result.

  **Instructor Note:**
  When you share your personal story, keep it brief. "I chose the sure payment for my consulting gig, but took the long shot on my book contract. EU calls me inconsistent. I call me human. RWEU gives me the vocabulary to explain why I don't feel inconsistent." This models the exact theoretical move you want them to understand: expanding the formal language to match the lived experience.
