      *   *Actually, to be safe and accurate to the prompt:* The prompt says "rank-dependent weighting of outcomes from worst to best." I will use the cumulative probability transformation method (RDEU) as it's algebraically simpler for undergrads to grasp in 20 mins than Buchak's incremental utility differences, *unless* I want to emphasize the "risk attitude" aspect.
      *   *Decision:* I will use the **Buchak RWEU** formulation because the prompt uses the specific name "Risk-Weighted Expected Utility" (Buchak's book title) and mentions "risk aversion corresponding to r(p) at most p". This is Buchak's specific claim. The "rank-dependent" phrase is likely referring to how the risk function applies to cumulative probabilities in the calculation. I will simplify the math for the classroom to show how $r(p)$ distorts the weights.

  6.  **Drafting the Timeline:**
      *   0-10: Intro & Stakes.
      *   10-25: Choice Elicitation (Allais).
      *   25-45: Group Work (The EU Impossibility).
      *   45-65: Lecture/Demo (RWEU Solution).
      *   65-80: Debrief & Personal Connection.

  7.  **Addressing "Predictable Failures":**
      *   *Gaming:* Students know the paradox. *Fix:* Frame it as "Personal Decision Audit," emphasize anonymity, vary the numbers slightly from standard text books.
      *   *Algebra Stall:* EU algebra can get messy. *Fix:* Provide a worksheet with the inequalities pre-set, just need to plug in.
      *   *Stakes:* Points feel fake. *Fix:* Make the points matter for a small tangible reward (e.g., choice of final paper topic, book prize).
      *   *RWEU Complexity:* The math is harder than EU. *Fix:* Use a specific example function (e.g., $r(p) = p^2$) to show it works, rather than asking them to derive the general condition.

  8.  **Addressing Limitations:**
      *   The activity shows *consistency* with RWEU, not *uniqueness*.
      *   It doesn't prove RWEU is *normatively* correct, just descriptively accurate.
      *   It doesn't capture the "personal coherence" feeling the instructor has (that's philosophical).

  9.  **Refining the Payoff Scheme:**
      *   18 students.
      *   Points accumulate.
      *   End of term: Top 3 points get a prize. Or, one random student is selected to have their points converted to cash/coffee.
      *   *Better:* "The Bank." One student is randomly selected at the end of the term to have *one* of their choices from today actually played out for a real gift card. This makes every choice potentially real (Incentive Compatibility).

  10. **Writing the Plan:**
      *   *Tone:* Professional, empathetic to the instructor's position, rigorous.
      *   *Structure:* Follow the prompt's requested sections.

  11. **Self-Correction on RWEU vs RDEU:**
      *   I need to be careful. The prompt says "Risk-Weighted Expected Utility" (Buchak) but describes "rank-dependent weighting of outcomes" (Quiggin).
      *   Buchak's RWEU: $REU = \sum r(P(\text{outcome} \ge x_i)) \cdot (u(x_i) - u(x_{i-1}))$.
      *   Quiggin's RDEU: $V = \sum (r(F(x_i)) - r(F(x_{i-1}))) \cdot u(x_i)$.
      *   They are mathematically equivalent in the binary/ternary cases if defined carefully.
      *   *Strategy:* I will use the Buchak terminology (since the prompt uses the specific name) but explain the mechanism using cumulative probabilities (which satisfies the "rank-dependent" description). I will provide a specific $r(p)$ function (e.g., $r(p) = p^2$) to make the calculation concrete during the class.

  12. **Final Review against Constraints:**
