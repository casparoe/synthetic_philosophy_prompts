      *   **Instructor's Situation:** The material is personal. The instructor has exhibited Allais-type behavior (certainty effect + long-shot effect) and feels coherent, contradicting standard Expected Utility Theory (EUT).
      *   **Goal:** Design an 80-minute activity where students *experience* the Allais paradox, *fail* to rationalize it with EUT, and *succeed* with Risk-Weighted Expected Utility (RWEU).
      *   **Requirements:**
          *   Concrete rules and materials.
          *   Point-based payoff scheme (no real money, but meaningful).
          *   Minute-by-minute timeline.
          *   Debrief mapping activity moments to formal components (Independence Axiom failure, Rank-Dependent Weighting).
          *   Troubleshooting (predictable failures and solutions).
          *   Limitations (what the activity *can't* show).

  2.  **Deconstruct the Pedagogical Arc:**
      *   *Phase 1: Elicitation.* Students need to make choices that reveal the Allais pattern without knowing it's a test. Needs to feel consequential (points).
      *   *Phase 2: The Collision.* Students try to fit their choices into $U(x) \cdot p$. They need to see the math break.
      *   *Phase 3: The Resolution.* Introduce $r(p)$. Show how it fixes the math.
      *   *Phase 4: Debrief.* Connect to the instructor's personal stake and the theory's limits.

  3.  **Drafting the Activity - Phase 1 (Elicitation):**
      *   *Standard Allais:*
