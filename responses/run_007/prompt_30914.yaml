      *   No real money? Yes (Points/Prize).
      *   Debrief mapping? Yes.
      *   Troubleshooting? Yes.
      *   Limitations? Yes.

      *(Self-Correction during drafting)*: Make sure the algebra in Phase 2 is solvable in 20 minutes. I should provide the utility normalization ($u(0)=0, u(100)=1$) so they only solve for $u(500)$.

      *(Refining the "Personal" aspect)*: The instructor wants to share their vulnerability. The debrief needs to allow space for this without making it about the instructor's ego. It should be about "Theory vs. Lived Experience."

      *(Stakes)*: To make it meaningful without money: "Seminar Capital." Points can be traded for exemptions (e.g., skip one response paper) or a book. Let's suggest a "Menu of Rewards."

