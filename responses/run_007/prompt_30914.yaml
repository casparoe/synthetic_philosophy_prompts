          *   1B: 10% \$5M, 89% \$1M, 1% \$0.
          *   2A: 11% \$1M, 89% \$0.
          *   2B: 10% \$5M, 90% \$0.
      *   *Problem:* Large numbers feel fake to undergrads. "Points" need to feel like grades or status.
      *   *Modification:* Use course-related points or a "lottery for a prize" (e.g., book, coffee, exemption from a small assignment). Let's use "Seminar Points" redeemable for a tangible reward at the end of the term (e.g., top scorer gets a book choice or dinner with prof). This creates *some* stakes.
      *   *Simplification for Classroom:* Keep probabilities clean.
          *   Choice 1: Sure 100 pts vs. Gamble (89% 100, 10% 500, 1% 0).
          *   Choice 2: Gamble (11% 100, 89% 0) vs. Gamble (10% 500, 90% 0).
      *   *Anonymity:* Crucial. If they think the professor wants a specific answer, they'll game it. Use slip of paper or digital form. Let's go with physical slips for tactile engagement.

  4.  **Drafting the Activity - Phase 2 (The Collision):**
      *   Groups of 3 (18 students = 6 groups).
      *   Task: Find $u(0), u(100), u(500)$ and verify EU.
      *   They will find that if $EU(1A) > EU(1B)$, then mathematically $EU(2A) > EU(2B)$ must hold. If they chose 1A and 2B, they break the math.
      *   Need a worksheet that guides the algebra without giving away the solution immediately.

  5.  **Drafting the Activity - Phase 3 (The Resolution - RWEU):**
      *   Introduce the weighting function $r(p)$.
      *   Concept: We don't weight by $p$, we weight by $r(p)$.
      *   Crucial detail: Rank-Dependent Utility (RDU) / Quiggin. The prompt specifies "rank-dependent weighting of outcomes from worst to best." This is important. It's not just $r(p)$ on the probability of the outcome, it's on the cumulative probability.
      *   *Correction/Refinement:* The prompt asks for "Risk-Weighted Expected Utility" (Buchak) but describes "rank-dependent weighting... from worst to best" (Quiggin/RDEU). Buchak's RWEU weights the *risk* component separately from utility, whereas RDEU transforms cumulative probabilities.
      *   *Re-reading the prompt carefully:* "a utility function over outcomes, a continuous strictly increasing risk function r on probabilities... and rank-dependent weighting of outcomes from worst to best." This description is actually **Rank-Dependent Expected Utility (RDEU)** (Quiggin, 1982), often conflated with Buchak's RWEU (2013) in casual discourse, but mathematically distinct. Buchak's RWEU uses a risk function on the *complement* of cumulative probability to weight utility differences. RDEU transforms cumulative probabilities.
      *   *Decision:* The prompt description ("rank-dependent weighting of outcomes from worst to best") aligns with **RDEU (Quiggin)**. However, the term "Risk-Weighted Expected Utility" usually refers to **Buchak**. Buchak's model is more philosophically aligned with "risk attitude as a separate parameter from utility."
      *   *Wait, looking closer at the prompt's math description:* "risk function r on probabilities... rank-dependent weighting of outcomes from worst to best." This is definitely RDEU structure ($V = \sum [r(F(x_i)) - r(F(x_{i-1}))] u(x_i)$).
      *   *Pedagogical Choice:* I will follow the prompt's mathematical description (RDEU structure) but acknowledge the terminology. Actually, to make it fit the "personal coherence" narrative best, Buchak's RWEU is often better for "risk attitude." But the prompt *explicitly* defines the machinery: "rank-dependent weighting of outcomes from worst to best." I must follow the prompt's definition of the machinery, even if the name "Risk-Weighted Expected Utility" is technically Buchak's. I will treat the prompt's definition as the target model (which is effectively RDEU).
