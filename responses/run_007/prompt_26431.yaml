answer: |-
  You raise the standard objection, but you miss the crucial asymmetry between the cases. In physics, the underdetermined theories are competing accounts of an external world whose existence we affirm precisely because it explains our sensory irritations; the electron is a posit within that explanatory framework, judged by how well it systematizes the flux of experience. But meaning is not a posit in the same sense; it is supposed to be the interface between language and that very world. If all possible behavioral evidence—every conceivable stimulus condition—is exhausted by two conflicting translation manuals, what remains to constitute a "fact of the matter"? You seem to be hankering for a meaning entity, a proposition or idea in the mind, to settle the issue, but I have argued repeatedly that such entities lack identity conditions and are mere mythology. There is no reality of meaning independent of the dispositions to verbal behavior, so where the behavior leaves off, the fact of the matter ceases. To insist otherwise is to reintroduce the very mentalistic ghosts we ought to have exorcised.
