answer: |-
  1. The original Church–Turing thesis concerns effective calculability by human agents, whereas the claim that Turing machines match all physical systems is the distinct Physical Church–Turing Thesis. Conflating these ignores that the original thesis does not inherently bound physical laws.
  2. It is mathematically correct that lambda calculus and general recursive functions are provably equivalent to Turing machines within formal computability theory. However, this equivalence only applies to defined formal systems, not to the informal notion of effective method or physical reality.
  3. Describing the thesis as a settled theorem is incorrect because it equates a formal model with an informal intuitive concept, which precludes mathematical proof. Consequently, the thesis remains a widely accepted hypothesis rather than a derived logical necessity.
  4. The assertion that all physical systems are Turing-computable is an empirical claim about physics that remains open to debate, particularly regarding quantum computing or hypercomputation. Therefore, stating this as a fact derived from the equivalence of formal models is a non sequitur.
  5. The conclusion about the human brain relies on the unproven Physical Church–Turing Thesis rather than the established mathematical equivalence of formal systems. Thus, while plausible to many, the claim that the brain cannot exceed Turing computability does not logically follow from the premises provided.
