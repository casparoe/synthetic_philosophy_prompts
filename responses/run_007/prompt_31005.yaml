answer: |-
  It is rare for a non-specialist to pinpoint the structural friction of a metaethical debate as accurately as you have. Your intuition that the Frege–Geach (F-G) impasse is not merely a technical glitch in semantics, but a clash over the *purpose* of semantic theory, is shared by many senior philosophers in the field. The debate often feels circular because the participants are frequently arguing past one another, using the same terminology ("truth," "belief," "validity") to track fundamentally different theoretical commitments.

  As requested, I will first brainstorm several candidate diagnoses for this stalemate, weighing the costs of each. Then, I will offer my considered diagnosis, supported by the textual record, and outline what genuine progress would look like.

  ### Candidate Diagnoses and Their Costs

  **1. The Substantive Psychological Disagreement**
  *   **The View:** The debate is purely about moral psychology. Cognitivists say moral judgments are beliefs (mind-to-world direction of fit); Expressivists say they are desires/plans (world-to-mind direction of fit). The F-G problem is just the technical fallout of this psychological split.
  *   **The Cost:** This diagnosis is too shallow. Modern expressivists (like Allan Gibbard or Mark Schroeder) grant that moral judgments *function* like beliefs in reasoning. The disagreement isn't just about what happens in the head; it's about whether that psychological story can *ground* logical validity. If it were only psychology, expressivists could concede the logic point and retreat to psychology, but they don't; they insist their view explains logic too.

  **2. The Verbal Dispute (Deflationism)**
  *   **The View:** The disagreement is merely about the definition of "truth." Expressivists use a deflationary notion of truth (to say "It is true that lying is wrong" is just to say "Lying is wrong"), while critics use a robust, representational notion. If they agreed on definitions, the problem would vanish.
  *   **The Cost:** This fails to address the problem of *validity*. Even if we agree on a deflationary notion of truth, we still need to explain why the inference from "Lying is wrong" and "If lying is wrong, then..." to the conclusion is *valid* rather than just a consistent set of attitudes. Critics argue that deflationary truth doesn't do the heavy lifting required for logical consequence. Calling it "verbal" dismisses the genuine worry about whether non-cognitive states can stand in logical relations.

  **3. Two Different Questions Under One Heading**
  *   **The View:** Cognitivists are doing **semantics** (what do sentences mean?), while Expressivists are doing **pragmatics** or **metasemantics** (what are speakers doing when they use these sentences?). They are answering different questions but calling them both "metaethics."
  *   **The Cost:** This is too charitable to the expressivist project. Expressivists explicitly claim to offer a semantics (e.g., "Quasi-Realism"). They want to earn the right to say moral sentences have truth conditions and logical form. If they were only doing pragmatics, they would concede the F-G point to the cognitivists and argue that semantics doesn't matter. They fight too hard on the semantic ground for this diagnosis to hold.

  **4. The Methodological Disagreement (Order of Explanation)**
  *   **The View:** Both sides agree on the data (moral language looks propositional, logic works), but they disagree on what explains what. Cognitivists prioritize logic/truth as the foundation; Expressivists prioritize practical rationality/psychology as the foundation.
  *   **The Cost:** This makes the debate seem intractable. If it's a clash of foundational priorities, there may be no neutral ground to adjudicate the winner. However, this cost is actually a virtue: it explains *why* the debate has stalled for decades without resolving.

  ### My Considered Diagnosis

  I diagnose this as a **Methodological Disagreement about the Order of Explanation.**

  You hypothesized that the sides disagree about "what a semantic theory is supposed to do." I refine this: they disagree on **which phenomena are fundamental and which are derivative.**

  *   **The Cognitivist/Realist Priority:** Logic and Truth are fundamental. A semantic theory must first assign truth conditions to sentences. Validity is defined as truth-preservation. Moral psychology (belief) is explained by the fact that we assent to true propositions.
      *   *Why F-G is fatal here:* If expressivism cannot assign truth conditions to the antecedent of a conditional ("If lying is wrong..."), it cannot explain validity. Therefore, expressivism is false.
  *   **The Expressivist Priority:** Practical Rationality and Psychological Consistency are fundamental. A semantic theory must explain the functional role of moral language in guiding action. Logic and Truth are *constructions* built out of consistent planning and attitude expression (Quasi-Realism).
      *   *Why F-G is a challenge, not a refutation:* The expressivist admits moral sentences don't *start* with truth conditions. They argue we can *construct* a logic of attitudes that mimics propositional logic well enough to "earn the right" to talk about truth and validity.

  The impasse exists because each side demands the other start from their axiom. The Critic says, "You can't build logic without truth." The Expressivist says, "You can't explain the normativity of morality without starting from practical reason."

  ### Evidence from the Debate

  This diagnosis is supported by how the key players frame their solutions:

  1.  **Simon Blackburn (Quasi-Realism):** Blackburn explicitly admits the F-G problem arises because expressivism starts with psychology. His goal is to show how a projectivist (someone who projects attitudes onto the world) can *simulate* realist discourse. He writes that we must "earn the right" to talk of truth and facts. This confirms his priority: Psychology $\to$ Semantics.
  2.  **Bob Hale ("Assertion and Conditionals"):** Hale's classic objection is that expressivists confuse the *expression* of an attitude with the *content* of a thought. He argues that for a conditional to work, the antecedent must have a content that can be supposed without being asserted. He insists that only truth-apt content can fill that role. This confirms the Realist priority: Semantics/Logic $\to$ Psychology.
  3.  **Mark Schroeder (*Being For*):** Schroeder attempts to solve F-G by creating a formal logic of "being for" (a plan-like state). He tries to meet the Realists on their own ground (formal logic) but builds it from Expressivist materials. The criticism he faces (e.g., from Gibbard or Realists) is often that his formal system is either too complex to be plausible psychology or effectively collapses into a cognitivist logic. This illustrates the friction of trying to reverse the order of explanation.

  ### What Counts as Progress?

  If my diagnosis is correct, we should not expect a "knockout argument" that solves the F-G problem once and for all. A technical fix will always be met with a methodological objection (e.g., "That formalism doesn't capture the *nature* of the state").

  Instead, progress would look like one of the following three developments:

  1.  **A Metasemantic Shift:** Progress would come from moving the debate upstream to **metasemantics** (what fixes the meaning of our words?). If both sides agree on a metasemantic framework (e.g., interpretivism or functional role semantics) that allows psychological states to fix truth conditions, the F-G problem dissolves into a technical implementation detail. We are seeing hints of this in "Ecumenical Expressivism."
  2.  **A Formal Result regarding "Logic of Attitudes":** If an expressivist can produce a formal system for non-cognitive states that is provably isomorphic to classical logic *without* smuggling in truth conditions, the Realist's "impossibility claim" is refuted. (Schroeder attempts this, but the consensus is not yet reached).
  3.  **Honest Methodological Pluralism:** The most mature progress would be the recognition that "What is the meaning of moral sentences?" is a question that admits of two valid answers depending on one's theoretical goals. If the goal is to integrate ethics into a scientific worldview, Cognitivism wins. If the goal is to preserve the action-guiding normativity of ethics, Expressivism wins. Acknowledging this trade-off would end the "circling" and turn the debate into a comparison of theoretical virtues rather than a search for a single truth.

  ### Conclusion

  The Frege–Geach problem persists not because expressivists are bad at logic, nor because realists are dogmatic, but because they are building theories from opposite foundations. The expressivist tries to build logic out of psychology; the realist tries to build psychology out of logic. Until the field agrees on which foundation is permissible, the problem will remain a stalemate of mutually unintelligible standards of success.

  Diagnosis: The impasse is a methodological clash over the order of explanation, where realists prioritize logical form as the foundation of meaning and expressivists prioritize practical rationality, causing each side to reject the other's solutions as category errors.
