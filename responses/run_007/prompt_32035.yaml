answer: |-
  The stalemate over the Kelly criterion is not merely a verbal dispute, nor is it purely a substantive disagreement about risk preferences. It is best diagnosed as a **category error regarding the normative authority of asymptotic limits applied to finite horizons**, compounded by a verbal ambiguity over the term "optimal."

  The two sides are indeed using the same mathematics, but they are applying it to different ontological models of the decision-maker. The Proponent views the agent as a **trajectory through time** subject to multiplicative dynamics where ruin is an absorbing state. The Critic views the agent as a **preference structure** maximizing expected utility over a distribution of outcomes, where the "limit" is a mathematical abstraction that does not necessarily dictate finite action.

  Here is the diagnosis of the disagreement, the characteristic moves of each side, and the path to progress.

  ### 1. The Diagnosis: Three Layers of Disagreement

  To resolve the impasse, we must disentangle three overlapping layers of the debate.

  **A. The Verbal Layer: The Definition of "Optimal"**
  There is a genuine verbal dispute here.
  *   **Proponents** define "optimal" as **asymptotic dominance**. A strategy is optimal if, as $N \to \infty$, the probability approaches 1 that it yields higher wealth than any other strategy.
  *   **Critics** define "optimal" as **Expected Utility (EU) Maximization**. A strategy is optimal if it maximizes $\mathbb{E}[U(W)]$ for a specific utility function $U$ and horizon $N$.
  *   **Diagnosis:** When Proponents say "Kelly is optimal," they mean "Kelly maximizes the time-average growth rate." When Critics say "Kelly is not optimal," they mean "Kelly does not maximize the ensemble-average expected utility for non-log agents." They are answering different optimization problems.

  **B. The Substantive Layer: The Normativity of the Limit**
  This is the deeper, substantive conflict. It concerns whether the properties of an infinite sequence impose normative constraints on finite decisions.
  *   **The Proponent's Move:** They argue that because wealth accumulation is multiplicative (compounding), the *geometric mean* is the physically relevant metric, not the arithmetic mean. They argue that any deviation from Kelly reduces the long-term growth rate, and since "the long run" is just a sequence of short runs, one should maximize growth at every step. This is often bolstered by **Breiman's Theorem** (1961), which shows Kelly dominates other strategies asymptotically.
  *   **The Critic's Move:** They invoke **Samuelson's "Fallacy of Large Numbers"** (1969). Samuelson argued that just because a bet looks good in the limit doesn't mean you should take it now. If you wouldn't take a single bet because of risk aversion, you shouldn't take a sequence of them simply because the law of large numbers smooths out the variance. The Critic argues that risk aversion is a primitive preference, not a mathematical error to be corrected by log-utility.
  *   **Diagnosis:** The Proponent smuggles in a norm of **survival** (don't go broke) and treats it as a norm of **rationality**. The Critic treats survival as a constraint but prioritizes **satisfaction of subjective risk tolerance**. The Proponent claims log-utility is *objective* (derived from the math of compounding); the Critic claims log-utility is *subjective* (just one utility function among many).

  **C. The Structural Layer: Ergodicity**
  The most profound disconnect is about the nature of probability in this context.
  *   **Proponents (implicitly or explicitly):** Rely on **time averages**. They ask: "What happens to *this* gambler's wealth over time?"
  *   **Critics:** Rely on **ensemble averages**. They ask: "What is the expected value across all possible paths at time $t$?"
  *   **Diagnosis:** In non-ergodic systems (like multiplicative wealth with ruin), the time average and ensemble average do not converge. The debate persists because standard economics assumes ergodicity (or ignores the distinction), while Kelly proponents intuitively grasp the non-ergodic nature of ruin.

  ### 2. Characteristic Moves in the Literature

  **The Proponent's Playbook:**
  1.  **The Ruin Argument:** "Any strategy betting more than Kelly has a positive probability of ruin; any strategy betting less grows slower. Therefore Kelly is the unique survivor."
  2.  **The Information Theory Appeal:** Citing Shannon and Cover to frame betting as data transmission, implying Kelly is a physical law of information growth, not a preference.
  3.  **The "Free Lunch" Claim:** Arguing that Kelly maximizes wealth without increasing risk (defined as volatility of log-wealth), framing deviation as leaving money on the table.

  **The Critic's Playbook:**
  1.  **The Finite Horizon Counter:** "I am retiring in 10 years, not infinity. For $N=10$, a fractional Kelly strategy might yield higher expected utility for my specific $U(W)$."
  2.  **The Utility Defense:** "If I have linear utility, I should bet my entire bankroll on every positive EV bet. Kelly tells me not to. Therefore Kelly contradicts EU theory."
  3.  **The Volatility Objection:** "Kelly paths are too volatile. The drawdowns are psychologically unbearable and practically dangerous (margin calls)."

  ### 3. What Counts as Progress?

  Given this diagnosis, more mathematical proofs of asymptotic dominance will not solve the debate; the math is already agreed upon. Progress requires conceptual clarification and a shift in the framing of the problem.

  **A. Conceptual Distinction: Survival vs. Optimization**
  Progress requires distinguishing between **viability constraints** and **optimization goals**.
  *   *Resolution:* Kelly should be viewed as a **boundary condition for survival** in multiplicative environments, not necessarily the unique maximizer of subjective utility.
  *   *Progress:* A formal framework that treats "avoiding ruin" as a hard constraint (where Kelly is the boundary) and "risk preference" as the optimization function within that safe region. This validates the Critic's concern for risk tolerance while acknowledging the Proponent's concern for ruin.

  **B. The Ergodicity Economics Reframing**
  The most significant recent progress comes from **Ole Peters and Ergodicity Economics**.
  *   *The Shift:* This framework explicitly formalizes the difference between ensemble averages (standard EU theory) and time averages (Kelly). It argues that for non-ergodic dynamics (like wealth with ruin), maximizing ensemble expected value is physically irrational because no single agent experiences the ensemble.
  *   *Progress:* If this framework gains traction, it dissolves the "smuggling norms" accusation. It demonstrates that log-utility isn't a subjective preference but the **utility function that makes the time-average growth rate equivalent to the expected utility**. This turns the Proponent's argument from a normative claim ("you should like log") into a descriptive claim ("log is the only utility consistent with time-average maximization").

  **C. Change of Question: From "Full Kelly" to "Fractional Kelly"**
  The binary debate (Kelly vs. Not-Kelly) is a false dichotomy.
  *   *The Shift:* The literature has already moved pragmatically toward **Fractional Kelly** (e.g., Half-Kelly).
  *   *Progress:* Formalizing *why* Fractional Kelly is the robust solution. It can be shown that Fractional Kelly is optimal if there is **parameter uncertainty** (you don't know the true edge) or if the agent has **power-law utility** ($U(W) = W^\gamma$) rather than log utility.
  *   *Outcome:* Acknowledging that "Full Kelly" is a theoretical limit for an agent with perfect knowledge and log-utility, while "Fractional Kelly" is the robust normative standard for real agents with estimation error and finite risk tolerance.

  ### Summary Diagnosis

  The debate is a **substantive disagreement about the normative authority of asymptotic limits**, disguised as a verbal dispute over "optimality."

  *   **Proponents** are right that in a non-ergodic, multiplicative world, the time-average growth rate is the physically relevant metric for long-term survival.
  *   **Critics** are right that Expected Utility Theory allows for risk preferences that deviate from log-utility, and that asymptotic theorems do not automatically prescribe behavior for finite horizons.

  **Progress** will not come from proving more theorems about the limit $N \to \infty$. It will come from:
  1.  **Adopting the Ergodicity distinction:** Acknowledging that ensemble expectations (standard EU) are often the wrong metric for single-trajectory wealth.
  2.  **Formalizing Robustness:** Showing that Fractional Kelly is the optimal solution under parameter uncertainty, bridging the gap between the "aggressive" Kelly and the "conservative" EU critic.
  3.  **Separating Constraints from Preferences:** Treating Kelly as the boundary of the "survival region" rather than the unique point of "rationality."

  Until the field accepts that **rationality involves both respecting the dynamics of the environment (ergodicity/ruin) and satisfying the preferences of the agent (risk tolerance)**, the same moves will continue to recur. The resolution lies in recognizing that Kelly describes the *environment's* constraint on growth, while Expected Utility describes the *agent's* preference for consumption, and the two must be reconciled, not opposed.
