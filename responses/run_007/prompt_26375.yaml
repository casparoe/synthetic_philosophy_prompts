answer: |-
  **The Scenario**

  Alice and Bob are roommates cooking a slow-simmering stew on a gas stove. At 6:00 PM exactly, Alice reaches out and twists the burner knob from "Low" to "High," a physical motion transferring momentum to the valve and increasing gas flow. Bob stands next to her, watching the flame flare up; he knows the recipe requires low heat, and for the next ten minutes, he has the physical ability to reach over and correct the setting at any moment. He does not intervene. At 6:10 PM, the stew boils over and ruins the dinner. Intuitively, Alice's turning of the knob and Bob's failure to correct it seem equally responsible for the mess: one initiated the excess energy, the other allowed it to persist unchecked.

  **The Theoretical Verdicts**

  **Lewis-style Counterfactual Theory:** This theory asks: "If $C$ had not occurred, would $E$ still have happened?" For Alice, the answer is no; if she hadn't turned the knob, the heat stays low. For Bob, the theory treats the omission as an event: if Bob *had* turned the knob down (i.e., if the omission had not occurred), the stew would not have boiled over. The temporal vagueness of Bob's omission—whether it happened at 6:01, 6:05, or 6:09—is irrelevant to the logical dependency. The counterfactual holds regardless of *when* you locate the "not-turning," so Lewis counts both as causes.

  **Dowe-style Conserved Quantity Theory:** This theory requires a causal process to be a world-line of a physical object transmitting a conserved quantity (like energy or momentum). Alice's action is a clear cause: her finger transfers momentum to the knob, and gas transfers chemical energy to the pot. Bob's omission, however, involves no such transmission. There is no physical process connecting Bob to the stove. Crucially, because there is no physical process, there is no determinate spacetime coordinate for the cause. You cannot point to a specific $t$ where Bob's "causing" happened, because there is no event to timestamp. For Dowe, this lack of temporal localization isn't just a nuisance; it signals that the omission is not a physical event at all. Therefore, Alice is a cause, but Bob is not.

  **The Divergence Feature**

  The wedge driving these verdicts apart is the **ontological status of the event in spacetime**. Lewis treats causation as a logical relation between propositions, which can tolerate vague or negative events. Dowe treats causation as a physical structure within the manifold of spacetime. The omission's lack of a determinate time is the observable symptom of its lack of physical substance. For the production theorist, if you can't say *when* it happened in terms of a physical interaction, it didn't happen in the causal network.

  **The Artificial Time Stipulation**

  If we stipulate an artificial time for the omission—say, "Bob's cause occurred at 6:09:59 PM, the last possible moment to act"—the Production Theory **does not flip its verdict**.

  Even if you assign a timestamp to Bob's inaction, there is still no conserved quantity transmitted between Bob and the stove at 6:09:59 PM. You have merely labeled an absence; you have not created a physical process. This tells us that the temporal-location problem is a **symptom**, not the root issue. The deeper issue is ontological: production theories require causation to be a "stuff" (energy/momentum) moving through spacetime. An omission is a "no-stuff." The reason it lacks a precise time is precisely because there is no physical event to anchor it to the timeline. For a physicist, this confirms your intuition: the temporal weirdness is the red flag indicating that the omission doesn't belong in the physical causal ledger, even if our logical or moral reasoning wants to include it.
