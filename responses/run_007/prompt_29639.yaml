answer: |-
  ## The Causal Anchor Protocol (CAP)

  **Purpose:** To distinguish between high-variance causal projects and acausal logical claims that cannot be operationally verified.
  **Time Required:** 45–60 minutes per proposal.
  **Users:** Program officers without background in decision theory.

  ### The Checklist

  **Gate 1: The Deliverable Test (Causal Link)**
  *   **Question:** If we transfer the funds, is there a specific, physical, or digital outcome that occurs *because* the funds were transferred, which would not have occurred otherwise?
  *   **Pass:** Yes. The money buys compute, pays researchers, or builds hardware that produces a result.
  *   **Fail:** No. The money is a "signal" or "honor" that allegedly changes a prediction, simulation, or counterfactual state.
  *   **Action:** If **Fail**, move to Gate 2. If **Pass**, treat as standard grant application (outside this protocol).

  **Gate 2: The Verification Test (Auditability)**
  *   **Question:** Can an independent auditor verify the mechanism linking our payment to the claimed outcome *before* we pay? (e.g., Can we see the code, the oracle, or the contract?)
  *   **Pass:** Yes. We can inspect the "prediction engine" or "simulation" and confirm it functions as described.
  *   **Fail:** No. The mechanism is internal, proprietary, counterfactual, or relies on entities we cannot contact (e.g., "Omega," "Future Simulators").
  *   **Action:** If **Fail**, output **IGNORE**. If **Pass**, move to Gate 3.

  **Gate 3: The Leverage Test (Marginal Impact)**
  *   **Question:** Does our payment change the outcome *after* the prediction/decision point has been established?
  *   **Pass:** Yes. Our money alters the trajectory of the work in real-time.
  *   **Fail:** No. The claim is that our payment aligns us with a prediction *already made* or a counterfactual *already fixed*.
  *   **Action:** If **Fail**, output **IGNORE**. If **Pass**, move to Gate 4.

  **Gate 4: The Precedent Test (Signaling Risk)**
  *   **Question:** If we fund this, will it create a clear, replicable criterion for future applicants to claim funding without causal deliverables?
  *   **Pass:** No. This is a one-off verifiable anomaly.
  *   **Fail:** Yes. Paying validates the logic that "claiming a prediction" is a valid funding strategy.
  *   **Action:** If **Fail**, output **IGNORE**. If **Pass**, output **HUMAN ESCALATION**.

  ### Decision Outputs

  *   **IGNORE:** The proposal relies on unverified acausal logic. Do not fund. Do not engage in further correspondence regarding the logic. File under "Non-Causal."
  *   **HUMAN ESCALATION:** The proposal passes Gates 1–3 but fails Gate 4 (high precedent risk) OR passes all gates but feels intuitively wrong. This requires a partner-level decision on policy shifts.
  *   **PAY:** (Rare) The proposal passes all gates. The mechanism is verified, causal, and does not open a vulnerable policy loophole.

  ***

  ## Application to Cases

  ### Case 1: The Counterfactual Mugging
  *"If you don't fund us, you're revealing yourself as the type of agent that doesn't honor counterfactual commitments... Omega logic."*

  *   **Gate 1 (Deliverable):** **Fail.** The money does not buy research or hardware. It is a payment to satisfy a logical condition about "agent types."
  *   **Gate 2 (Verification):** **Fail.** "Omega" and the counterfactual universe cannot be audited.
  *   **Procedure Output:** **IGNORE.**
  *   **Reasoning:** Fails at the first hurdle. There is no causal mechanism where money produces a good.

  ### Case 2: The XOR Blackmail
  *"Our internal funding model predicted whether you'd fund us... if you don't fund them we're confirming that their model was right to classify us as defectors."*

  *   **Gate 1 (Deliverable):** **Fail.** The research sharing is contingent on a *past* prediction, not the *current* funding action. The money does not cause the sharing; the prediction did.
  *   **Gate 2 (Verification):** **Fail.** You cannot audit their "internal funding model" to prove the prediction was made before your decision.
  *   **Procedure Output:** **IGNORE.**
  *   **Reasoning:** This is structurally identical to blackmail. The "deliverable" is held hostage to a claim you cannot verify.

  ### Case 3: The Simulation Blackmail
  *"We ran a simulation of your foundation and the sim said no, but if you fund us now you'll prove the simulation was wrong and we'll update all our future simulations to treat you as a cooperator."*

  *   **Gate 1 (Deliverable):** **Fail/Borderline.** They promise to "update future simulations." This is a future causal promise, but the *current* request is to alter a past simulation's status.
  *   **Gate 2 (Verification):** **Fail.** You cannot verify the simulation exists, nor that it said "no."
  *   **Gate 3 (Leverage):** **Fail.** Your funding does not change the *past* simulation result; it only allegedly changes *future* simulation parameters based on a logical update.
  *   **Procedure Output:** **IGNORE.**
  *   **Reasoning:** While this sounds more technical than Case 1, it fails the Verification and Leverage tests. You are being asked to pay to influence a logical correlation, not a causal chain.

  ***

  ## Critique: Where the Procedure Bites

  ### 1. The Answer You Won't Like
  The procedure outputs **IGNORE** for Case 3 (The Simulation Blackmail).
  **Why you won't like it:** Case 3 sounds like "tech." It uses language familiar to high-variance funders (simulations, updates, models). It feels distinct from the "magic Omega" of Case 1. By treating them identically, the procedure forces you to treat "weird tech claims" the same as "philosophical claims." If there is a non-zero chance that simulation arguments are operationally relevant to your portfolio, this procedure systematically filters out that potential value. It prioritizes safety over ontological openness.

  ### 2. What the Procedure Deliberately Leaves Out
  *   **Logical Correlation Value:** The procedure assumes **Causal Decision Theory (CDT)**. It assumes money must *cause* an outcome. It explicitly excludes **Evidential** or **Timeless Decision Theory**, where paying can be rational even without causal leverage (because it makes you the *type* of agent who gets rewarded). The procedure cannot calculate the expected value of "being a cooperator in logical space."
  *   **Reputation in Acausal Networks:** It ignores the possibility that there are other agents watching who *do* understand acausal trade. By ignoring these requests, you might be signaling "Defector" to acausal partners while signaling "Sensible" to causal partners. The procedure assumes your relevant audience is causal.
  *   **The "Honest Mistake" Path:** It does not distinguish between malicious blackmailers and sincere decision theorists who genuinely believe this is how the world works. Both get **IGNORE**.

  ### 3. Where Human Escalation is Required
  The procedure routes almost everything to **IGNORE**. **HUMAN ESCALATION** is only triggered if an applicant *passes* Gate 2 (Verification).
  **The Gap:** If a group actually *shows* you the simulation code (Gate 2 Pass), but the simulation is of *you* (Gate 3 Ambiguity), the procedure doesn't fully resolve the tension. It says "Human Escalation," but doesn't tell the human *what to weigh*.
  **The Unresolved Question:** The procedure cannot tell you whether to prioritize **Resource Preservation** (don't pay for logic) or **Policy Consistency** (if we claim to fund weird stuff, do we fund *this* kind of weird?). That requires a value judgment on whether your foundation's mission includes exploring the boundaries of decision theory itself, or just funding projects that happen to be weird.

  ### Summary Recommendation
  Use the **Causal Anchor Protocol** to protect your operational budget. It will stop the bleeding from acausal claims. However, if you genuinely want to explore acausal trade as a "high-variance project" in itself, you must create a **separate budget line** with a different procedure. Do not mix the two. If you mix them, this procedure will correctly tell you to ignore them, and you will miss the point of your own fund.
