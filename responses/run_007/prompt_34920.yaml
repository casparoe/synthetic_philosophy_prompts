answer: |-
  You have a very sharp ear for philosophical ambiguity. Your suspicion is well-founded: in the literature on convention, particularly following David Lewis's *Convention: A Philosophical Study* (1969), the claim "conventions are arbitrary" is a notorious locus of equivocation. It slides between a technical condition in a definition, a claim about history, a claim about value, and a claim about malleability.

  When an instructor uses the same phrase to block a question about historical etiology ("Why right?") and a question about normative evaluation ("Is it bad?"), they are likely committing a fallacy of equivocation. They are treating a property of the convention's *origin* or *structure* as if it implies a property of the convention's *value* or *stability*.

  Below is the menu of distinct theses hidden inside that phrase, evaluated for their philosophical viability, followed by an analysis of how they apply to your instructor's specific moves.

  ### The Menu of "Arbitrariness" Theses

  Here are five distinct claims that "conventions are arbitrary" might express.

  #### 1. The Lewisian Condition (Alternative Regularity)
  **Thesis:** A regularity $R$ is a convention only if there exists at least one alternative regularity $R'$ that agents *could* have followed instead to solve the same coordination problem.
  *   **Status:** **Substantive but Defensible.**
  *   **Analysis:** This is the technical core of Lewis's definition. It distinguishes conventions from natural laws or biological imperatives. If physics forced us to drive on the right (e.g., if cars would explode if they drove on the left), it wouldn't be a convention. This thesis does not claim $R'$ is *equally good*, only that it was *possible*.

  #### 2. Symmetric Equivalence (Ex Ante Indifference)
  **Thesis:** At the moment of selection, the alternative regularity $R'$ was effectively identical in value to the chosen regularity $R$. Agents were rationally indifferent between them prior to coordination.
  *   **Status:** **Substantive but Often False.**
  *   **Analysis:** This applies to driving (left vs. right are roughly symmetric). It does *not* apply to all conventions. For example, in a language convention, "cat" could have meant dog, but once the mapping is set, they aren't equivalent. Furthermore, even in driving, slight geographical or historical factors often break perfect symmetry *ex ante*. However, as an idealization for coordination games (like the pure coordination game), it is defensible.

  #### 3. Etiological Contingency (Historical Accident)
  **Thesis:** The specific selection of $R$ over $R'$ was not determined by rational necessity or natural law, but by historical path-dependence, chance, or focal points that are no longer recoverable.
  *   **Status:** **Substantive and Defensible.**
  *   **Analysis:** This claims there is no *deep reason* (like a law of physics) for the specific outcome. It explains why we don't look for a functionalist explanation for every detail of a norm. It allows that there might be a historical cause (e.g., Napoleon's armies), but denies there is a *rational justification* for why that cause won out over the alternative.

  #### 4. Normative Neutrality (Moral Vacuity)
  **Thesis:** Because a convention is arbitrary in origin or structure, it carries no intrinsic moral weight. Conventions are merely tools for coordination and cannot be morally criticized or praised in themselves.
  *   **Status:** **False.**
  *   **Analysis:** This is the most dangerous slide. While the *origin* might be arbitrary, the *consequences* are not. A convention of segregation, or a convention of tipping that exploits workers, has real moral outcomes. The fact that a norm *could have been otherwise* does not mean it is immune to ethical evaluation. This commits the **Genetic Fallacy** (judging the validity of a thing by its origin).

  #### 5. Voluntarism (Revocability)
  **Thesis:** Because conventions are arbitrary, they can be changed at will or by simple agreement without significant cost.
  *   **Status:** **False.**
  *   **Analysis:** Lewis explicitly argues against this. Conventions are self-perpetuating Nash Equilibria. Once established, the "arbitrariness" vanishes *ex post*. Switching from driving on the right to the left is incredibly costly and dangerous, even if the initial choice was arbitrary. Conventions are "sticky."

  ---

  ### Analysis of Your Instructor's Moves

  Now, let's apply this menu to the two specific classroom interventions you described.

  #### Move 1: Dismissing "Why Right Rather Than Left?"
  *   **The Student's Question:** Is there a reason we drive on the right, or was it an accident?
  *   **The Instructor's Response:** "That's the wrong question; conventions are arbitrary."
  *   **Which Thesis is in play?** The instructor is relying on **Thesis 3 (Etiological Contingency)**, supported by **Thesis 2 (Symmetric Equivalence)**.
  *   **Is the move licensed?** **Yes, mostly.**
      *   If the question implies "Is there a *rational necessity* or *physical law* dictating the right side?", the instructor is correct to dismiss it. Thesis 3 tells us there is no deep rational necessity; it was a historical contingency.
      *   *Caveat:* The instructor is slightly imprecise. It is not a "wrong question" historically (historians can tell us why). It is only a "wrong question" if the student is looking for a *functionalist justification* that makes the right side inherently superior to the left. In a Lewisian framework, looking for a rational preference between symmetric equilibria is indeed a category mistake.

  #### Move 2: Dismissing "Can a Convention be Criticized?"
  *   **The Student's Question:** Can we criticize a convention as "bad"?
  *   **The Instructor's Response:** "Conventions are arbitrary."
  *   **Which Thesis is in play?** The instructor is relying on **Thesis 4 (Normative Neutrality)**.
  *   **Is the move licensed?** **No. This is a fallacy.**
      *   To block normative criticism, the instructor must assume that *arbitrary origin* implies *arbitrary value*. This is false.
      *   Lewisian conventions solve coordination problems, but they can solve them poorly (inefficient equilibria) or unjustly (exploitative equilibria).
      *   For example, a convention might stabilize a coordination problem regarding property rights, but do so in a way that systematically disadvantages a minority group. The fact that the property convention *could have been different* (Thesis 1) does not mean the current one is immune to critique (Thesis 4).
      *   By using the phrase "conventions are arbitrary" here, the instructor is smuggling in the claim that "conventions have no moral content," which does not follow from the definition of convention.

  ### Summary for Your Coursework

  Your instructor is using a single slogan to do three different jobs:
  1.  **Demarkation:** To distinguish social norms from natural laws (Thesis 1).
  2.  **Explanation:** To explain the lack of rational necessity in historical selection (Thesis 3).
  3.  **Immunization:** To protect norms from ethical critique (Thesis 4).

  The first two uses are standard Lewisian fare. The third is philosophically indefensible.

  **Recommendation:** In your essays or discussions, you should explicitly distinguish between **arbitrariness of origin** (there was an alternative) and **arbitrariness of value** (the alternative is equally good/moral). You can grant your instructor that conventions are arbitrary in the Lewisian sense (Thesis 1 & 3) without conceding that they are arbitrary in the normative sense (Thesis 4). This will demonstrate that you understand the technical definition while avoiding the trap of normative nihilism regarding social norms.

  If you want to impress the instructor, ask this: *"Professor, are you claiming that conventions are arbitrary in the Lewisian sense of alternative equilibria, or are you claiming they are arbitrary in the normative sense of being value-neutral? Because Lewis's definition only guarantees the former, but you seem to be using it to imply the latter."* That cuts directly to the equivocation.
