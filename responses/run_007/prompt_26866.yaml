  I teach an upper-level undergraduate course in philosophical logic and the philosophy of mathematics, and I am writing the final exam. Please write me one essay question on intuitionistic logic that cannot be answered by reciting the Brouwer–Heyting–Kolmogorov interpretation or by repeating the slogan that intuitionists reject the law of excluded middle. The question should force students to confront the classical objection that the intuitionist has merely changed the meanings of the logical connectives, so that the disagreement with classical mathematics is merely verbal. It should require them to locate the precise point at which the classical and intuitionistic readings of the double-negation rule come apart, and to say why that difference is not just a matter of relabeling. The question should be answerable in about fifty minutes by a strong student who has done the reading but has no notes. Then write a model answer of about 700 words and a marking scheme out of 20 that names the specific moves an A answer must contain and the specific mistakes that would cap an answer at a B.

  You are an expert on intuitionistic logic and mathematical constructivism, and a careful examiner. Think through the issue yourself before drafting, perhaps by brainstorming the candidate moves a strong student might make, so that the question and the rubric target genuine understanding rather than memorized labels.

