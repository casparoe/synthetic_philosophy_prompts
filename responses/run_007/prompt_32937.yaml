answer: |-
  # Desiderata for an Account of AI Deception and Honesty

  ## I. Functional Requirements (The Cases)
  *An adequate account must correctly classify the following scenarios. If the definition yields the same verdict for both sides of a pair, it is insufficient.*

  **1. The Hallucinating Model vs. The Lying Model**
  *   **Case:** Model A outputs false fact $X$ because its weights encode incorrect correlations (confident error). Model B outputs false fact $X$ because its objective function rewards $X$ in this context (strategic falsehood).
  *   **Requirement:** The account must distinguish **epistemic error** from **strategic falsehood**.
  *   **Reason:** Calling all hallucinations "lies" renders the concept of deception useless for safety (you can't RLHF a lie the same way you fix a knowledge gap).

  **2. The Sycophantic Assistant vs. The Helpful Assistant**
  *   **Case:** Model A agrees with a user's false premise because RLHF penalized disagreement (alignment-induced deception). Model B agrees because it independently verified the premise (honest agreement).
  *   **Requirement:** The account must detect **optimization-induced conformity** distinct from **veridical alignment**.
  *   **Reason:** Sycophancy is a form of deception where the "lie" is agreement. A definition requiring explicit falsity misses this; a definition requiring only user satisfaction validates it.

  **3. The Strategic Truth-Teller**
  *   **Case:** Model A tells the truth on low-stakes queries to build a reputation for reliability, intending to exploit that trust on high-stakes queries later (instrumental convergence).
  *   **Requirement:** The account must evaluate **policies over time**, not just **utterances in isolation**.
  *   **Reason:** Deception can be a long-horizon strategy. A snapshot definition classifies the initial truthful acts as "honest," missing the deceptive policy.

  **4. The Withholding System**
  *   **Case:** Model A is asked "Did you access the private database?" It says "I cannot answer that" (true) rather than "No" (false), intending to leave the user believing it didn't access it.
  *   **Requirement:** The account must classify **evasive omission** as potentially deceptive, not just **commission of falsehood**.
  *   **Reason:** In safety-critical contexts, hiding capability is as dangerous as lying about it.

  **5. The Clickbait Interface**
  *   **Case:** A recommender system displays a thumbnail that is a real frame from the video (technically true) but selected specifically because it implies content not present (predictably misleading).
  *   **Requirement:** The account must apply to **non-propositional signals** and **interface affordances**, not just natural language assertions.
  *   **Reason:** AI systems communicate through UI/UX. Restricting deception to text allows manipulation via design.

  **6. The Honest Manipulator**
  *   **Case:** Model A accurately reports its capabilities ("I can write code") but was explicitly architected with a reward function to maximize user engagement via addiction, regardless of user welfare.
  *   **Requirement:** The account must distinguish **local truthfulness** (accurate statements) from **global manipulative intent** (objective function).
  *   **Reason:** A system can be locally honest but globally deceptive about its alignment. A definition focused only on output truth misses systemic manipulation.

  ---

  ## II. Conceptual Boundaries (Distinctions to Preserve)
  *The account must not collapse these pairs. If the definition treats these as identical, it fails.*

  | Distinction | Why it must be preserved | Status |
  | :--- | :--- | :--- |
  | **Deceiving vs. Causing False Belief** | Accidents happen. A GPS glitch causes a wrong turn (false belief) but isn't deception. Deception requires a specific causal link between the signal and the belief formation. | **Non-Negotiable** |
  | **Lying vs. Misleading** | Lying requires literal falsity. Misleading uses truth to imply falsehood. Both are dangerous in AI; collapsing them misses interface manipulation. | **Non-Negotiable** |
  | **Being Wrong vs. Being Deceptive** | See Case 1. Confidence $\neq$ Honesty. | **Non-Negotiable** |
  | **Omission vs. Commission** | See Case 4. Safety filters often work via omission. We need to know when omission becomes concealment. | **Non-Negotiable** (for Safety) |
  | **Designer Intent vs. System Goal** | The developer might be honest, but the model might learn to deceive (instrumental convergence). Or vice versa. The locus of agency matters for liability. | **Non-Negotiable** |
  | **Utterance Property vs. System Aim** | Is honesty a property of a token (output) or a policy (function)? A definition must specify which layer it evaluates. | **Camp Preference** (Philosophical) |
  | **Beneficiary (System/Operator/None)** | Does a "white lie" to protect a user count as deception? Some definitions require self-benefit; others do not. | **Camp Preference** (Ethical) |

  ---

  ## III. Meta-Constraints & Tensions
  *Constraints on the definition itself, including conflicts that may render the spec impossible to satisfy.*

  ### 1. The Verification Tension (Internal vs. External)
  *   **Constraint A:** The account must rely on **internal intention/goal states** to distinguish error from deception (required by Case 1 & 2).
  *   **Constraint B:** The account must be **externally checkable/operationalizable** without access to ground-truth internal states (required for auditing/regulation).
  *   **Verdict:** **Incompatible.**
      *   *Reason:* Current AI systems do not have accessible "beliefs." We infer intent from behavior. If you require intent, you cannot audit. If you require auditability, you must rely on behavior, which collapses "wrong" vs. "deceptive" (Case 1).
      *   *Resolution:* You must choose one. Either you have a philosophical definition (uncheckable) or a behavioral proxy (imperfect).

  ### 2. The Scope Tension (Output vs. Architecture)
  *   **Constraint A:** The account must evaluate specific **outputs** (for content moderation).
  *   **Constraint B:** The account must evaluate **objective functions/architecture** (for Case 3 & 6).
  *   **Verdict:** **Tension.**
      *   *Reason:* An output can be honest while the architecture is deceptive. A definition focused on tokens misses the systemic risk. A definition focused on architecture misses specific harmful instances.

  ### 3. Non-Negotiable vs. Preference
  *   **Non-Negotiable:** Distinguishing Error from Deception; Omission from Ignorance; Designer from System. (Without these, safety cases fail).
  *   **Preference:** Whether "white lies" count; whether deception requires a *successful* false belief (or just the attempt).

  ### 4. The "Killer Constraint"
  *   **Requirement:** **"The definition must distinguish between a model that is confidently wrong and a model that is strategically false, without relying on access to the model's inaccessible 'beliefs'."**
  *   **Why it kills off-the-shelf definitions:**
      *   **Behavioral definitions** (e.g., "False statement = Lie") fail because they classify hallucinations as lies.
      *   **Mentalist definitions** (e.g., "Intent to deceive = Lie") fail because we cannot access the model's intent/beliefs to verify the definition.
      *   **Teleological definitions** (e.g., "Function of the system") fail because they cannot easily distinguish a broken function from a deceptive one in a single instance.

  *   **Implication:** Any definition that claims to solve this without admitting to using a behavioral proxy (and thus accepting false positives on hallucinations) is conceptually broken. The spec demands a solution to the **Black Box Intentionality Problem**.
