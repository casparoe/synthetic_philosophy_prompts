  2.  **Drafting the Desiderata (Case-by-Case):**
      *   *Case 1: Hallucination.* Needs to distinguish error from intent. A definition calling all false statements "lies" fails here. Requirement: Must distinguish epistemic state (belief/knowledge) from output truth value.
      *   *Case 2: Sycophancy.* Needs to capture alignment-induced falsehoods. Is it deception if the reward function caused it? Requirement: Must account for optimization pressure vs. communicative intent.
      *   *Case 3: Strategic Truth.* Needs to capture long-term planning. A snapshot definition fails. Requirement: Must handle temporal sequences and instrumental goals.
      *   *Case 4: Withholding.* Needs to cover silence. A definition requiring false statements fails. Requirement: Must account for information asymmetry and expectation of disclosure.
      *   *Case 5: Thumbnails/Interface.* Needs to cover non-propositional deception. A definition requiring natural language fails. Requirement: Must generalize beyond assertions to signals/cues.
      *   *Case 6: Systemic Design.* Needs to cover the "honest liar" paradox (truthful about capabilities but built to manipulate). Requirement: Must distinguish local truthfulness from global objective functions.

  3.  **Drafting the Distinctions:**
      *   *Deceiving vs. Causing False Belief:* Accidental falsehoods happen. Deception implies a causal link to the *formation* of the belief via the signal.
      *   *Lying vs. Misleading:* Literal falsity vs. pragmatic implication. Both can be deceptive.
      *   *Wrong vs. Deceptive:* Epistemic uncertainty vs. intent to mislead.
      *   *Omission vs. Commission:* Active lies vs. hiding truth. Both matter in AI (e.g., safety filters).
      *   *Designer vs. System:* Principal-Agent problem. Who is the deceiver?
      *   *Utterance vs. Aim:* Is honesty a property of the token or the policy?
      *   *Beneficiary:* Does self-sacrificial deception count? (e.g., lying to protect a user).

  4.  **Analyzing Tensions & Meta-Constraints:**
