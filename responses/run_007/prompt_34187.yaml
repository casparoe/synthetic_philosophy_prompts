prompt: |-
  I'm a postdoc in a vision lab, and I've somehow ended up as the person who has to settle a running fight about how we handle subjects' verbal reports. We run masking and binocular rivalry experiments, and on every trial the participant says whether they saw the stimulus, how clear it was, and sometimes what it looked like. Right now the lab is split: one RA codes "I didn't see anything" as if it's a fact about the display, another treats every report as an infallible readout of the subject's private experience, and a third wants to throw the reports away entirely and only use forced-choice performance. My PI told me to write a single protocol everyone has to follow, because every paper we publish turns on how these reports get coded, and I want it to be based on heterophenomenology, which I half-remember from a seminar as something like: take first-person reports seriously as reports of how things seem to the subject, but don't take them as authoritative about what is actually going on in their head, and stay neutral about whether the things the subject reports are real. That sounds right in the abstract, but I have no idea how to turn it into a procedure a sleep-deprived RA with no philosophy background can actually run before lunch.

  Please write me that procedure: a step-by-step protocol for collecting, transcribing, coding, and using verbal reports in a consciousness experiment. I want the questions in order, what counts as a good enough answer to each question, where the procedure stops and says "this report is unusable," and where it has to hand the decision to a human because the step is a judgment call rather then a rule. Then run the procedure on three cases: (1) a subject in a rivalry study says "I saw the face the whole time" even though the stimulus alternated between a face and a house every second and their button presses tracked the alternation; (2) a blindsight-type patient says "I don't see anything" but then guesses the location of the stimulus at 80 percent; (3) a subject in a masking study reports "it wasn't a visual experience, more like a vague hunch that something was there" on trials where the mask came too fast. Include at least one case where the procedure tells me to do something I'm going to hate, and say what the procedure can't settle. Also be straight with me about which parts of this are heterophenomenology actually doing work and which parts are just a fancy name for "write down what they said." And tell me how confident you are in the procedure overall and which step you're least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested protocol:

  1.  **Analyze the Request:**
      *   **User:** Postdoc in a vision lab.
      *   **Problem:** Lab fight over handling verbal reports (masking/binocular rivalry). Three camps: reports as facts about display, reports as infallible experience, reports as useless (forced-choice only).
      *   **Goal:** A single, actionable protocol based on *heterophenomenology* (Dennett's approach).
      *   **Requirements:**
          *   Step-by-step procedure (collect, transcribe, code, use).
          *   Specific questions, pass/fail criteria, stop points, human judgment calls.
          *   Run the procedure on three specific cases (Rivalry contradiction, Blindsight dissociation, Masking hunch).
          *   Include a "hated" outcome.
          *   Identify what the procedure *can't* settle.
          *   Critique: What parts are actual heterophenomenology vs. just transcription?
          *   Confidence level and weakest step.
      *   **Tone:** Professional, practical, slightly weary (postdoc to postdoc), philosophically grounded but operationally strict.

  2.  **Deconstruct Heterophenomenology for the Lab:**
      *   *Core Idea:* Treat the subject as a source of data about *what they believe they experienced*, not as an oracle of truth about neural states or external reality. The "hetero" means *other*-phenomenology: we construct a text of their experience from the third-person perspective.
      *   *Operationalization:*
          1.  **Neutrality:** Don't correct them during the task (unless it's a training block).
          2.  **Transcription:** Record exactly what was said, not an interpretation.
          3.  **Interpretation:** Code the report as a *belief state* (e.g., "Subject reports confidence X"), not a *stimulus state* (e.g., "Stimulus was visible").
          4.  **Triangulation:** Compare reports with behavioral data (RT, accuracy) and physiological data (EEG, eye-tracking) without privileging any single source as "The Truth."
      *   *The Trap:* It's easy to just say "write down what they said." The "hetero" part comes in when we analyze the report as an object of study itself, potentially conflicting with other data, without resolving the conflict by fiat.

  3.  **Drafting the Protocol (The "Standard Operating Procedure"):**
      *   Need clear phases: Collection, Transcription, Coding, Integration.
      *   Need specific decision rules.
      *   Need to define "Unusable."
      *   *Key Heterophenomenological Move:* The report is treated as a *text* to be interpreted, not a direct window.
      *   *Step 1: Collection.* Standardize the prompt. Avoid leading questions.
      *   *Step 2: Transcription.* Verbatim. No cleaning up "umms" if they indicate hesitation.
      *   *Step 3: Coding.* This is where the fight usually happens. Need categories: Visibility, Content, Confidence.
      *   *Step 4: Conflict Resolution.* What if report $\neq$ behavior?
      *   *Human Judgment:* Where do we need a senior researcher? When language is ambiguous or contradictory.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Rivalry):* Report ("Face whole time") vs. Button Press (Alternating).
          *   *Hetero approach:* Don't call them a liar. Code the report as "Subject *believes* they saw face continuously." Flag the discrepancy. Do not discard. Use the discrepancy as data (e.g., memory error, criterion shift).
      *   *Case 2 (Blindsight):* Report ("Nothing") vs. Guess (80%).
          *   *Hetero approach:* Code report as "No conscious awareness." Code behavior as "Above chance discrimination." Do not say "They actually saw it." Do not say "They are guessing." Treat as dissociation.
      *   *Case 3 (Masking):* Report ("Vague hunch").
          *   *Hetero approach:* This is gold. Code as "Non-visual awareness" or "Fringe consciousness." Don't force into "Seen/Not Seen."
      *   *The "Hated" Outcome:* Probably Case 1. The PI probably wants clean data. Heterophenomenology says keep the messy data and model the error. Or Case 2, where we can't claim "conscious vision." I'll make Case 1 the hated one: we have to keep the trial in the analysis but mark it as a "Report-Behavior Mismatch," which complicates the stats.

  5.  **Critiquing the Protocol (Self-Correction/Reflection):**
      *   *What is actually heterophenomenology?* The stance of neutrality and treating the report as a belief state rather than a fact.
      *   *What is just transcription?* The mechanical act of writing down words.
      *   *Confidence:* High on the structure, lower on the specific coding schema for "hunches" (Case 3) because language is slippery.
      *   *Weakest Step:* The "Conflict Resolution" step. It's easy to say "triangulate," hard to say how to weight the data when they disagree.

  6.  **Refining the Tone:**
      *   Acknowledge the pain of the RA.
      *   Acknowledge the PI's pressure.
      *   Be honest about the limitations.
      *   Avoid jargon where possible, but keep the philosophical integrity.

  7.  **Final Polish (Reviewing against constraints):**
      *   Step-by-step? Yes.
      *   Questions in order? Yes.
      *   Stop points? Yes.
      *   Human judgment calls? Yes.
      *   Three cases run through? Yes.
      *   Hated outcome included? Yes.
      *   What it can't settle? Yes.
      *   Hetero vs. Transcription distinction? Yes.
      *   Confidence/Weakest step? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "be neutral." I need to give the RA a checkbox or a flag. "Flag: REPORT_BEHAVIOR_CONFLICT." That makes it actionable. Also, for Case 1, the hated outcome should be that we *cannot* use the report to define ground truth for perceptual states, which undermines a common analysis method in the lab.

  *(Refining the "Hated" part)*: The lab likely uses reports to sort trials into "Seen" vs. "Unseen" for neural analysis. Heterophenomenology suggests this is dangerous if the report contradicts behavior. The hated outcome is: "You cannot bin trials based solely on verbal report if behavior contradicts it."

  *(Refining the "What it can't settle")*: It can't settle the *ontological* status of the experience. It doesn't tell us if qualia exist.

  Let's assemble the document.

  *Structure:*
  1.  Header/Memo style.
  2.  The Protocol (Steps 1-5).
  3.  The Test Cases.
  4.  The "Hated" Truth.
  5.  The Limitations.
  6.  Meta-Analysis (Hetero vs. Transcription).
  7.  Confidence/Weakness.

  *Drafting content...*
  *Step 3 (Coding)* needs specific tags. `R_Vis` (Report Visibility), `B_Acc` (Behavior Accuracy).
  *Case 1:* Tag `MISMATCH`.
  *Case 2:* Tag `DISSOCIATION`.
  *Case 3:* Tag `FRINGE`.

  *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Vision Lab Personnel
  **FROM:** Postdoc (Consciousness Methods)
  **SUBJECT:** Standard Operating Procedure 004: Verbal Report Handling (Heterophenomenological Protocol)
  **DATE:** October 26, 2023

  **Purpose:** To resolve inconsistencies in how verbal reports are collected, coded, and interpreted in masking and rivalry experiments. This protocol adopts a *heterophenomenological* stance.

  **The Core Principle:** A subject's verbal report is treated as a **text** describing the subject's *beliefs* about their experience. It is **not** treated as infallible truth about their neural state, nor is it treated as a direct measurement of the physical stimulus. It is data to be triangulated against behavior (button presses, accuracy) and physiology (EEG, eye-tracking).

  ---

  ### PART 1: THE PROCEDURE

  #### Phase 1: Collection (During Experiment)
  **Goal:** Standardize the input without leading the subject.

  1.  **Prompt Standardization:**
      *   **Action:** RAs must use the exact script provided in the experiment builder (PsychoPy/Matlab).
      *   **Script:** "Please describe what you experienced on that trial." (Open-ended) OR "On a scale of 1-4, how clear was the stimulus?" (Scaled).
      *   **Constraint:** Do **not** ask "Did you see the face?" (Yes/No forces a binary that may not match experience).
      *   **Stop Condition:** If the subject asks, "What do you want me to say?", the RA must reply: "There is no right answer. Just tell us what it seemed like to you." If the subject persists (3x), flag the block as `SUBJECT_CONFUSED` and pause.

  2.  **Recording:**
      *   **Action:** Audio record all verbal sessions. Log typed responses with timestamps.
      *   **Constraint:** Do not correct grammar or slang during entry.

  #### Phase 2: Transcription (Post-Session)
  **Goal:** Create the "Text" for analysis.

  1.  **Verbatim Rule:**
      *   **Action:** Transcribe exactly what was said, including hesitations ("um," "uh") and self-corrections ("I saw a... well, actually, maybe a face").
      *   **Pass/Fail:** If audio is unintelligible, mark transcript as `UNCODEABLE`. Do not guess.
      *   **Human Judgment:** If a word is ambiguous (e.g., "face" vs. "place"), listen with a second RA. If consensus fails, mark `AMBIGUOUS_CONTENT`.

  #### Phase 3: Coding (The Critical Step)
  **Goal:** Convert text into data tags without assuming truth.

  1.  **Tagging Visibility:**
      *   **Action:** Assign a `REPORT_VISIBILITY` tag.
      *   **Scale:**
          *   `V0`: No experience ("Black," "Nothing").
          *   `V1`: Fringe/Hunch ("Felt like something," "Glimmer").
          *   `V2`: Partial ("Blurry," "Fragments").
          *   `V3`: Clear ("Saw it clearly").
      *   **Rule:** If the subject says "I didn't see it but I felt it," code as `V1`, **not** `V0`.

  2.  **Tagging Content:**
      *   **Action:** Assign `REPORT_CONTENT` (e.g., `FACE`, `HOUSE`, `GRATING`).
      *   **Rule:** If subject says "I think it was a face," code as `CONTENT_FACE` + `CONFIDENCE_LOW`. Do not clean this to `CONTENT_FACE`.

  3.  **Conflict Detection (The Heterophenomenological Check):**
      *   **Action:** Compare `REPORT_CONTENT` against `BEHAVIORAL_CHOICE` (button press).
      *   **Rule:** If `REPORT_CONTENT` $\neq$ `BEHAVIORAL_CHOICE`, flag trial as `MISMATCH`.
      *   **Action:** Compare `REPORT_VISIBILITY` against `STIMULUS_PRESENCE`.
      *   **Rule:** If `V0` but `STIMULUS_PRESENCE` = True, flag as `REPORT_NEGATIVE`.

  #### Phase 4: Integration (Analysis)
  **Goal:** Use the data without privileging one source.

  1.  **Trial Binning:**
      *   **Rule:** Do **not** bin trials for neural analysis (e.g., ERP averaging) based *solely* on verbal report if a `MISMATCH` flag exists.
      *   **Requirement:** You must create separate bins: `MATCH_SEEN`, `MATCH_UNSEEN`, and `MISMATCH`.
      *   **Stop Condition:** If >20% of trials are `MISMATCH`, the task instructions are invalid. Halt analysis and consult PI.

  2.  **Interpretation:**
      *   **Rule:** In the manuscript, refer to reports as "Subject reported..." not "The stimulus was..."
      *   **Forbidden:** "The subject was unconscious on this trial."
      *   **Required:** "The subject reported no awareness on this trial."

  #### Phase 5: Escalation (Human Judgment)
  **Goal:** Handle edge cases.

  *   **When to Escalate to Postdoc/PI:**
      1.  Subject uses metaphorical language ("It felt like a color I can't name").
      2.  `MISMATCH` rate exceeds 15%.
      3.  Subject reports experience *after* the response window has closed (post-decision wagering issues).

  ---

  ### PART 2: RUNNING THE PROCEDURE ON THREE CASES

  #### Case 1: The Rivalry Contradiction
  *   **Data:** Subject says "I saw the face the whole time." Button presses track Face/House alternation (1Hz).
  *   **Protocol Execution:**
      1.  **Transcribe:** "I saw the face the whole time."
      2.  **Code:** `REPORT_CONTENT` = `FACE`. `REPORT_VISIBILITY` = `V3`.
      3.  **Conflict Check:** Button press indicates `HOUSE` on 50% of trials. Flag `MISMATCH`.
      4.  **Integration:** Do **not** discard the verbal report. Do **not** assume the buttons are the "truth."
      5.  **Outcome:** Trial is binned as `MISMATCH`. Analysis must account for the possibility of *memory consolidation error* (they remember the dominant percept) or *criterion shift* (they define "seeing" differently).
  *   **Result:** The data is kept, but the interpretation is complicated. We cannot claim "Continuous conscious perception of face." We claim "Subject *reports* continuous perception despite behavioral evidence of alternation."

  #### Case 2: The Blindsight Dissociation
  *   **Data:** Patient says "I don't see anything." Forced-choice location guess is 80% correct.
  *   **Protocol Execution:**
      1.  **Transcribe:** "I don't see anything."
      2.  **Code:** `REPORT_VISIBILITY` = `V0`.
      3.  **Conflict Check:** Behavior is above chance. Flag `DISSOCIATION`.
      4.  **Integration:** Do **not** recode `V0` to `V2` just because accuracy is high. Do **not** claim the patient is "lying."
      5.  **Outcome:** This is the definition of the blindsight phenomenon. The protocol preserves the dissociation. The paper states: "Patient reported no awareness (`V0`) despite above-chance localization."
  *   **Result:** Clean. This is what the protocol is designed for.

  #### Case 3: The Masking Hunch
  *   **Data:** Mask SOA is short. Subject says: "It wasn't a visual experience, more like a vague hunch that something was there."
  *   **Protocol Execution:**
      1.  **Transcribe:** Verbatim.
      2.  **Code:** `REPORT_VISIBILITY` = `V1` (Fringe/Hunch). `REPORT_CONTENT` = `NULL`.
      3.  **Conflict Check:** No direct conflict, but does not fit binary "Seen/Unseen."
      4.  **Integration:** Create a `V1` bin for ERP analysis. Do not collapse `V1` into `V0`.
      5.  **Outcome:** We acknowledge "Fringe Consciousness" as a distinct data category.
  *   **Result:** Nuanced. Requires more statistical power (more bins), but more accurate.

  ---

  ### PART 3: THE OUTCOME YOU WILL HATE

  **The "Hated" Outcome:** Case 1 (The Rivalry Contradiction).

  **Why you will hate it:** Your lab likely wants to use verbal reports to sort trials into "Conscious" vs. "Unconscious" to compare neural activity (e.g., P3b presence). In Case 1, the subject says "Conscious" but behavior says "Unconscious/Alternating."
  **The Protocol's Verdict:** You are **forbidden** from grouping this trial into a clean "Conscious" bin. You must either:
  1.  Discard the trial (loss of power).
  2.  Create a "Conflict" bin (messy stats).
  3.  Prioritize behavior (undermines the value of the report).

  **Heterophenomenology demands Option 2.** It forces you to admit that "Consciousness" is not a unitary variable you can bin simply. It complicates your ANOVA. It makes your figures uglier. But it prevents you from publishing a finding that relies on an unexamined assumption about the authority of the report.

  ---

  ### PART 4: LIMITATIONS & META-ANALYSIS

  **What This Procedure Cannot Settle:**
  1.  **Ontological Truth:** This protocol does not tell us if the subject *actually* had qualia. It only tells us what they *said* they had. It solves the *measurement* problem, not the *hard* problem.
  2.  **The "True" Threshold:** It cannot tell you if `V1` (Hunch) counts as "conscious." That is a theoretical decision for the Discussion section, not a coding decision for the RA.
  3.  **Memory vs. Perception:** In Case 1, we don't know if they saw the face and forgot the house, or saw the house and hallucinated the face. The protocol flags the conflict; it does not resolve the cognitive mechanism.

  **Heterophenomenology vs. "Write Down What They Said":**
  *   **Just Transcription:** "Subject said 'Face'. Code = Face." (Assumes report = Reality).
  *   **Heterophenomenology:** "Subject said 'Face'. Code = Report(Face). Compare Report(Face) to Behavior(House). Flag Discrepancy."
  *   **Where the work happens:** The work is in **Phase 3 (Conflict Detection)** and **Phase 4 (Integration)**. Treating the report as a *belief state* that might be false is the philosophical heavy lifting. If you just transcribe and then treat the transcript as ground truth for neural correlates, you aren't doing heterophenomenology; you're doing naive introspectionism.

  **Confidence & Weakest Step:**
  *   **Overall Confidence:** 85%. This is robust enough for publication and strict enough for RAs.
  *   **Weakest Step:** **Phase 3, Tagging Visibility (`V1` vs `V2`).** Distinguishing a "hunch" from a "blurry image" is subjective. Even with examples, RAs will drift.
      *   *Mitigation:* We need a calibration set of 50 example transcripts that the whole lab codes together to establish inter-rater reliability before starting real data. I will prepare this.

  **Final Instruction:**
  Print this. Tape it to the coding station. If an RA encounters a Case 1, they do not ask the PI "What do I do?" They tag `MISMATCH` and move on. We deal with the mess in the analysis, not during data entry.
