          *   *View B (Dominant):* Compassion is a duty (*dharma*). The act of helping is part of the karmic web. The suffering person's karma brought them to the helper; the helper's karma compelled them to help.
      *   *Settled:* All major Dharmic traditions mandate compassion. It is not considered a violation of cosmic law to help.

  5.  **Address the Contradiction (Karma vs. Compassion):**
