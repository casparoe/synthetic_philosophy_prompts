      *   *Resolution 3 (Grace/Devotion):* In Bhakti traditions, divine grace overrides karma.
      *   *Resolution 4 (Buddhist Emptiness):* Ultimately, karma is empty. Compassion is the skillful means (*upaya*) to realize this.

