answer: |-
  The principle that best captures your judgments is the **Principle of Non-Alienation of Fundamental Autonomy**, which holds that the state may prohibit consensual conduct only when it involves fraud, non-consensual harm, or the intentional and irrevocable destruction of an individual's life or permanent capacity for self-governance.

  This principle contains three prohibitive clauses and one permissive clause, each motivated by specific cases in your list. The first clause prohibits conduct lacking valid consent, motivated by the **stranger beating** case, establishing that autonomy cannot be waived where it is not exercised. The second clause prohibits exploitation of defective consent, motivated by the **sham cure** case, recognizing that fraud vitiates the validity of agreement. The third clause prohibits the intentional and irrevocable destruction of life or permanent liberty, motivated by the **duel**, **cannibalism**, and **chattel slavery** cases; this distinguishes death and permanent enslavement from lesser harms because they eliminate all future possibilities for autonomous choice. The permissive clause allows conduct involving reversible harm, partial bodily sacrifice, or managed risks where death is not the intended objective, motivated by the **private club beatings** (reversible harm), **kidney sale** (partial bodily integrity), and **professional boxing** (managed risk without intent to kill) cases. This framework avoids legal moralism by focusing on the structural capacity for future agency rather than the moral worth of the act, distinguishing the **club beatings** from the **duel** not by the severity of pain but by the reversibility of the status change.

  Applied to your unsettled cases, this principle implies that **physician-assisted suicide** should be prohibited because it entails the intentional and irrevocable destruction of life, aligning it with the duel and cannibalism verdicts rather than the kidney sale. Similarly, a **consensual gladiatorial match** would be prohibited as an intentional destruction of life for entertainment, lacking the regulatory and social utility context of boxing. Regarding your existing verdicts, the principle forces you to abandon none of them provided you accept the distinction between *risking* death as a side effect (boxing) and *intending* death as an outcome (dueling). However, if you intuitively believe physician-assisted suicide should be legal, you would be forced to abandon either the prohibition on dueling and cannibalism or the strict prohibition on intentional death, requiring you to introduce a moralistic exception for mercy that treats medical killing differently from violent killing.
