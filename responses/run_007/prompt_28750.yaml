prompt: |-
  You're a professional philosopher who works on Rorty and the pragmatist tradition, and I want you to think carefully here — start by laying out, in your own words, the core commitments of Rorty's antirepresentationalism and neopragmatism that you'll need (the rejection of language as a mirror of nature, the idea that justification is internal to a community's practices, the deflationary story about truth on which truth is more a matter of what a community's standards permit you to say than of accurately representing how things are), and don't just assert conclusions.

  Now take the Sokal affair as a case study: the hoax where the physicist Alan Sokal got a deliberatly nonsensical paper accepted by the cultural-studies journal Social Text and then announced what he'd done. I already know the basic facts, so don't retell them. What I want is a careful mapping between the episode and Rorty's view, running in both directions.

  Under Rorty's picture, who are the relevant parties and what are they actually doing? What does the view say the Social Text editors were doing when they accepted the piece — were they just playing by their own community's standards of justification, in which case there's no neutral standpoint from which Sokal can call them wrong, or does the hoax expose a failure even by Rorty's lights? And what does the view commit Sokal to — is his accusation that the editors couldn't tell sense from nonsense itself smuggling in representationalism?

  Then turn it around: what does the episode do to the theory? Does it refute antirepresentationalism, does it only embarass a caricature of it, or does it show that Rorty needs a distinction he officially wants to avoid — like a line between normal and abnormal discourse, or between vocabularies that let you cope with the world and vocabularies that just talk past each other? Be honest about where Rorty can dodge and where he can't, and mark where the view goes silent rather than forcing it to speak. In particular, I want your view on whether the hoax is best read as showing that some vocabularies have a better grip on the world in a pragmatic sense (not a representationalist one), and whether that reading ends up closer to the realists than Rorty would like. If you think his normal/abnormal discourse distinction does real work here, show exactly how, and where it runs out.

  Set aside whatever you happen to know about Rorty's own comments on the science wars; I want what the view commits him to, not his spin on it.
