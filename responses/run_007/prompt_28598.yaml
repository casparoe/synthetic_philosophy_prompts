          *   *Student:* "Jeffrey updating works by shifting probabilities across a partition while keeping the conditional probabilities on each cell of the partition fixed (this is the rigidity condition). When you do two Jeffrey updates in sequence, the second update's rigidity condition applies to the probabilities that result from the first update... Since the intermediate probabilities are different... the conditional probabilities that get held fixed... are different."
          *   *Verdict:* **Correct.** This is the standard explanation. $P_{new}(A) = \sum P_{old}(A|E_i) P_{new}(E_i)$. If you update on partition $\mathbf{E}$ then $\mathbf{F}$, the second step holds $P(A|F_j)$ fixed *relative to the post-first-update distribution*. If you swap order, you hold $P(A|E_i)$ fixed relative to the *other* post-first-update distribution. Unless specific conditions hold (like independence of the partitions), these diverge.
