          *   Is it *probabilistic independence* of the partitions?
          *   If $P(E \cap F) = P(E)P(F)$, does JC commute?
          *   Let $P$ be the prior. Update on $\mathbf{E}$ to $P_E$. Then on $\mathbf{F}$ to $P_{EF}$.
          *   $P_E(A) = \sum P(A|E_i) P_{new}(E_i)$.
          *   $P_{EF}(A) = \sum P_E(A|F_j) P_{new}(F_j)$.
          *   For commutativity, we need $P_E(A|F_j) = P(A|F_j)$.
          *   $P_E(A|F_j) = \frac{P_E(A \cap F_j)}{P_E(F_j)}$.
          *   If $\mathbf{E}$ and $\mathbf{F}$ are independent, $P(E_i \cap F_j) = P(E_i)P(F_j)$.
          *   Does the first update preserve the independence?
          *   $P_E(F_j) = \sum P(F_j|E_i) P_{new}(E_i)$. If independent, $P(F_j|E_i) = P(F_j)$. So $P_E(F_j) = P(F_j) \sum P_{new}(E_i) = P(F_j)$.
          *   So the marginal of $\mathbf{F}$ doesn't change after updating on independent $\mathbf{E}$.
