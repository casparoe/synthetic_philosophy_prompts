              *   $P(H|F) = 0.5$. $P(H|D) = 1$.
              *   $P(H) = 0.75$.
              *   $P(F \cap H) = P(H|F)P(F) = 0.5 \times 0.5 = 0.25$.
              *   $P(F)P(H) = 0.5 \times 0.75 = 0.375$.
