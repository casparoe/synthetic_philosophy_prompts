prompt: |-
  I teach an upper-level undergraduate seminar called "Mind, Morality, and Experimental Philosophy" — about 18 students, mostly philosophy and psychology majors, in 80-minute sessions. We're about to start the unit on intentional action and the Knobe effect, and I want them to experience the asymmetry firsthand before they read the papers. I've tried this before by just describing the CEO vignette and asking for a show of hands, but that didn't really land: students could see where I was going, and the ones who'd read the Stanford Encyclopedia entry ahead of time just sat there looking smug. This semester I want to run it as a proper in-class experiment where they don't know what's being tested until the reveal.

  Here's what I have in mind: students get slips of paper with a vignette and a question, they answer individually, we pool the results, and the asymmetry between conditions emerges from their own numbers. The key is that they shouldn't know there are two conditions until the reveal — so I need the two versions of the vignette to look similar enough at a glance that nobody notices their neighbor has a different one. I want the debrief to walk them through what just happened: the harm/help asymmetry, what it suggests about the relationship between moral judgment and folk psychology, and the methodological move of treating their own responses as data. The debrief should also flag what a single in-class run can't show — cross-cultural replication, the debate with conversational pragmatics about whether the effect is semantic or pragmatic, and the fact that the asymmetry doesn't by itself settle whether the folk concept of intentional action is genuinely sensitive to moral considerations or merely tracks something else that is.

  Please give me a complete, runnable plan. Commit to specifics rather than offering options: the exact vignettes I should print on the slips, the rating scale, the precise question wording, a procedure for collecting and displaying results that makes the asymmetry visually striking, a timeline for the 80 minutes, and a detailed debrief script. Also tell me what will predictably go wrong the first time I run it — students who already know the effect, students who guess the hypothesis mid-activity and try to answer "consistently," students who argue with the vignette's realism rather than answering the question — and how I should handle each in the moment. I want the debrief to be frank about which features of the philosophical terrain the activity can and cannot reproduce, so my students don't walk away thinking the in-class demo settled everything.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level undergraduate seminar ("Mind, Morality, and Experimental Philosophy").
      *   **Students:** ~18 students (Philosophy/Psych majors).
      *   **Session:** 80 minutes.
      *   **Topic:** Intentional Action and the Knobe Effect (Side-Effect Effect).
      *   **Goal:** Run an in-class experiment where students *experience* the asymmetry firsthand without knowing the hypothesis beforehand.
      *   **Requirements:**
          *   Specific vignettes (Harm vs. Help).
          *   Specific rating scale/question.
          *   Procedure for collection/display (visually striking).
          *   Timeline (80 mins).
          *   Detailed debrief script (covering asymmetry, moral judgment/folk psychology, methodology, limitations).
          *   Troubleshooting (prior knowledge, hypothesis guessing, realism objections).
          *   Tone: Frank about limitations (doesn't settle the debate).

  2.  **Deconstruct the Knobe Effect:**
      *   *Core:* People say a side effect is intentional if it's bad (harm), but not intentional if it's good (help), even when the agent's attitude toward the side effect is identical (indifference).
      *   *Vignette Structure:* Chairman + Project + Side Effect (Harm/Help) + Attitude ("I don't care...").
      *   *Question:* "Did the chairman intentionally [harm/help] the environment?"
      *   *Scale:* Usually Likert (1-7) or Yes/No. For a classroom demo, a 1-7 scale is better for nuance, but Yes/No is clearer for a binary "Intentional/Not" split. Given the request for "visually striking," a binary vote or a clear Likert distribution is best. Let's go with a 7-point Likert scale ranging from "Definitely Not Intentional" to "Definitely Intentional" to allow for statistical pooling, but emphasize the binary threshold in analysis. Actually, for an 80-minute class with 18 students, a simple 1-7 scale is easier to aggregate quickly on a whiteboard.
      *   *Constraint:* Vignettes must look identical at a glance to prevent condition spotting.

  3.  **Drafting the Vignettes:**
      *   Need to ensure only the word "harm" vs. "help" changes.
      *   Need to ensure the "indifference" line is identical.
      *   *Version A (Harm):* "The new program will *harm* the environment."
      *   *Version B (Help):* "The new program will *help* the environment."
      *   *Visual Camouflage:* Use the same font, layout, and paper color. Maybe add a dummy question or code to make them look like surveys.

  4.  **Designing the Procedure:**
      *   *Distribution:* Hand out slips face down. Tell them not to look until instructed.
      *   *Randomization:* Need to ensure roughly 9 Harm / 9 Help. Pre-sort the slips.
      *   *Data Collection:* How to make it visual?
          *   Option 1: Sticky notes on a board.
          *   Option 2: Hand raise (too obvious).
          *   Option 3: Digital poll (too tech-heavy/risk of wifi).
          *   *Decision:* Sticky notes on a pre-drawn axis on the whiteboard. It's tactile, anonymous enough, and builds a histogram live.
      *   *Reveal:* Only after data is on the board do we separate the groups.

  5.  **Timeline (80 Minutes):**
      *   0-10: Intro & Setup (Hook, instructions, distribution).
      *   10-20: Reading & Responding (Individual work).
      *   20-35: Data Collection (Sticky notes on board).
      *   35-55: The Reveal & Initial Analysis (Separating conditions, observing asymmetry).
      *   55-75: Debrief & Philosophical Implications (Knobe's thesis, alternatives).
      *   75-80: Wrap-up & Reading Assignment.

  6.  **Developing the Debrief Script:**
      *   Must cover:
          1.  The Result (Asymmetry).
          2.  The Puzzle (Standard belief/desire model predicts symmetry).
          3.  Knobe's Claim (Moral judgment penetrates intentional action).
          4.  Limitations (Pragmatics, sample size, WEIRD population).
          5.  Methodology (Using themselves as data).
      *   Must address Troubleshooting (Prior knowledge, etc.).

  7.  **Addressing Troubleshooting (Predictable Failures):**
      *   *Prior Knowledge:* Some *will* know Knobe.
          *   *Fix:* Tell them upfront: "If you know this study, your job is to answer as your *gut* says now, not what you remember the 'right' answer is. Also, please don't signal to neighbors." Better yet, assign them a specific role (e.g., "Data Verifier"). Actually, the prompt asks how to handle it *in the moment*. Best approach: Acknowledge it, ask them to bracket it, or use their data as a "control" for demand characteristics.
      *   *Hypothesis Guessing:* Students might try to be "consistent."
          *   *Fix:* Emphasize "gut reaction."
      *   *Realism Objections:* "No CEO would say that."
          *   *Fix:* "Philosophical vignettes are trolleys, not case studies. Suspend disbelief."

  8.  **Refining the Plan (Self-Correction/Optimization):**
      *   *Critique:* 18 students is a small sample size. The asymmetry might not be statistically significant if the split is 10/8 and the effect is weak in this specific group.
      *   *Mitigation:* The Knobe effect is usually robust (70-80% vs 20-30%). With 9 per group, we expect ~7 "Yes" in Harm and ~2 "Yes" in Help. This should be visible.
      *   *Visuals:* Instead of just sticky notes, use two different colored sticky notes *after* the reveal? No, that reveals condition too early. Use one color, then ask them to stand up by condition.
      *   *Better Visual:* Have them write their score on a slip. Collect slips. Instructor tallies on board *live* while students watch. Then reveal the condition key.
      *   *Wait, the prompt asks for "visually striking."*
      *   *Idea:* Hand out Red and Blue slips? No, that signals condition.
      *   *Idea:* Hand out identical slips. Collect them. Tally "Intentional" vs "Not" on the board in two columns: "Group A" and "Group B." *Then* reveal Group A = Harm, Group B = Help.
      *   *Refined Procedure:*
          1.  Distribute slips (marked A or B in corner, small font).
          2.  Students answer.
          3.  Collect slips.
          4.  Tally results on board under "Condition A" and "Condition B" (keep key hidden).
          5.  Ask class to predict the difference.
          6.  Reveal Key.
      *   *Wait, one more thing:* The prompt asks for specific vignettes. I need to make sure the text is *exact*.
      *   *Scale:* 1 (Not at all intentional) to 7 (Fully intentional).
      *   *Question:* "On a scale of 1 to 7, how intentionally did the chairman bring about the side effect?"

  9.  **Finalizing the Debrief Content:**
      *   Need to mention the *Standard Model* (Belief + Desire + Causation = Intentional).
      *   Need to mention *Knobe's Radical View* (Moral badness is part of the concept).
      *   Need to mention *Pragmatics* (Uttal, etc. - we imply blame/praise).
      *   Need to mention *Cross-Cultural* (Knobe effect varies by culture).
      *   Need to mention *Sample Size* (N=18 is a demo, not a study).

  10. **Review against Constraints:**
      *   Commit to specifics? Yes.
      *   Exact vignettes? Yes.
      *   Rating scale? Yes.
      *   Timeline? Yes.
      *   Debrief script? Yes.
      *   Troubleshooting? Yes.
      *   Frank about limitations? Yes.

  11. **Drafting the Content:** (Mental check of the vignette text to ensure it matches Knobe's 2003 original closely enough for validity but is concise for a slip of paper).
      *   *Original:* "The vice-president... presented a plan... 'We are thinking of starting a new program. It will help us increase profits, but it will also [harm/help] the environment.' The chairman... 'I don't care at all about [harming/helping] the environment. I just want to make as much profit as I can. Go ahead and start the new program.' They started the program. Sure enough, the environment was [harmed/helped]."
      *   *Modification for slips:* Keep it tight. Ensure the "I don't care" line is identical except for the target word.

  12. **Final Polish:** Check tone. Needs to be authoritative but pedagogical. Ensure the "what will go wrong" section is practical. (Self-correction: Make sure to instruct students to cover their slips so neighbors don't see).

  13. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a complete, runnable plan for your 80-minute seminar session. This plan is designed to maximize the visual impact of the data while insulating the experiment from demand characteristics as much as possible in a classroom setting.

  ### I. Materials Preparation

  **1. The Vignette Slips**
  Print 18 slips of paper (half-sheet letter size is sufficient). Use the same font, layout, and paper stock for all. To ensure random assignment, pre-sort them into two piles of 9.
  *   **Marking:** In the top right corner, print a tiny, unobtrusive code: **Condition A** on 9 slips, **Condition B** on 9 slips. Do not use "Harm" or "Help" anywhere on the slip.
  *   **Text:** Use the exact text below. The only difference between the two versions is the bolded word (do not bold it on the actual slip; keep it plain text).

  > **Condition A (Harm Version)**
  > The vice-president of a large corporation presented a new plan to the chairman. He said, "We are thinking of starting a new program. It will help us increase profits, but it will also **harm** the environment."
  > The chairman answered, "I don't care at all about **harming** the environment. I just want to make as much profit as I can. Go ahead and start the new program."
  > They started the program. Sure enough, the environment was **harmed**.
  >
  > **Condition B (Help Version)**
  > The vice-president of a large corporation presented a new plan to the chairman. He said, "We are thinking of starting a new program. It will help us increase profits, but it will also **help** the environment."
  > The chairman answered, "I don't care at all about **helping** the environment. I just want to make as much profit as I can. Go ahead and start the new program."
  > They started the program. Sure enough, the environment was **helped**.

  **2. The Response Slip**
  On the bottom of the vignette slip (or a separate small card if you prefer to collect the vignette separately), include this exact question and scale:

  > **Question:** On a scale from 1 to 7, how intentionally did the chairman bring about the side effect on the environment?
  > **Scale:**
  > 1 (Definitely Not Intentional) — 2 — 3 — 4 (Unsure) — 5 — 6 — 7 (Definitely Intentional)
  >
  > **Your Rating:** ______

  **3. Whiteboard Setup**
  Before class, draw two large empty bar charts on the board side-by-side.
  *   Left Chart Title: **Condition A**
  *   Right Chart Title: **Condition B**
  *   Y-Axis: Number of Students (0 to 5)
  *   X-Axis: Rating (1-2, 3-4, 5-6, 7) *Grouping them makes the trend clearer with small N.*
  *   **Crucial:** Do not write "Harm" or "Help" under the charts yet. Cover the bottom of the charts with a piece of paper or leave space to write it in later.

  ---

  ### II. Timeline (80 Minutes)

  *   **00:00 – 00:10 (10 min): Introduction & Distribution**
      *   Hook: "Today we are testing a hypothesis about how we use language, but the subjects are you."
      *   Instructions: Hand out slips face down. Tell students: "Do not turn this over until I say so. Do not show your slip to your neighbor. If you have seen this thought experiment before, I need you to answer based on your immediate gut reaction *right now*, not based on what you think the 'philosophical answer' is. Your honesty is the only variable that matters."
      *   Action: Students turn over, read, circle a number. (2 minutes).

  *   **00:10 – 00:25 (15 min): Data Collection**
      *   Collect the slips in two piles based on the corner code (A and B). You can ask a student to help sort them quickly if you want to step out of the "researcher" role, but it is faster if you do it to maintain the blind.
      *   **Live Tally:** As you read the numbers aloud from the slips ("Condition A, rating 7... Condition A, rating 6..."), draw the bars on the whiteboard charts.
      *   *Pedagogical Move:* Do not comment on the numbers as you write them. Maintain a neutral "data clerk" persona.

  *   **00:25 – 00:35 (10 min): The Reveal**
      *   Once the charts are full, turn to the class. Ask: "Look at the distribution. Do you see a difference?" (There should be one).
      *   Ask: "What do you think distinguishes Condition A from Condition B?" Take 2-3 guesses.
      *   **The Reveal:** Write **HARM** under Condition A and **HELP** under Condition B.
      *   Allow the murmur/reaction to settle.

  *   **00:35 – 00:55 (20 min): Guided Debrief (Part 1: The Phenomenon)**
      *   Scripted discussion (see Section III below).

  *   **00:55 – 01:15 (20 min): Guided Debrief (Part 2: The Theory & Limits)**
      *   Scripted discussion (see Section III below).

  *   **01:15 – 01:20 (5 min): Wrap-up & Assignment**
      *   Assign Knobe (2003) "Intentional Action and Side Effects" for next time.
      *   Prompt: "Read Knobe with the question: Is he explaining the *data* we just saw, or is he explaining away a confusion?"

  ---

  ### III. Detailed Debrief Script

  **Part 1: The Phenomenon (Minutes 35–55)**

  **Instructor:** "Look at the board. In Condition A (Harm), the majority of you rated the action as intentional (5–7). In Condition B (Help), the majority rated it as unintentional (1–3). Yet, the chairman's mental state was identical in both cases. He knew the outcome, he didn't desire it specifically, but he pursued it as a means to profit.

  **Instructor:** "According to the Standard Model of folk psychology—the one we usually start with in this course—intentionality is a function of belief and desire.
  1.  Did he believe the outcome would happen? Yes (both).
  2.  Did he desire the outcome? No (both).
  3.  Did the outcome happen because of his action? Yes (both).
  If the Standard Model is correct, your ratings should have been identical. They weren't. Why?"

  *(Let students offer initial thoughts. They will likely say 'Because harming is bad.')*

  **Instructor:** "Exactly. This is the **Knobe Effect**, or the Side-Effect Effect. Joshua Knobe's radical claim is this: Moral judgment is not a separate process that happens *after* we decide if an action was intentional. Instead, moral judgment penetrates the very concept of intentional action. We cannot decide if he did it 'on purpose' without first deciding if what he did was 'bad.'"

  **Part 2: The Theory & Limits (Minutes 55–75)**

  **Instructor:** "Before we accept Knobe's conclusion, we need to be methodologically careful. We just ran an experiment with N=18. What can this *not* tell us?"

  *(Guide them to these three specific limitations)*

  **1. The Pragmatics Objection:**
  **Instructor:** "One critique is that this isn't about the *concept* of intentionality, but about *conversational implicature*. When I ask 'Did he intentionally harm the environment?', you might hear 'Is he blameworthy?' When I ask 'Did he intentionally help?', you might hear 'Is he praiseworthy?' Since he didn't care about helping, you don't want to give him credit (praise), so you say 'No.' You aren't describing his mind; you're managing social credit. Knobe says it's semantic; critics like [e.g., Uttal or Machery] say it's pragmatic."

  **2. The Sample Limitation:**
  **Instructor:** "We are 18 undergraduates at [Your University]. We are 'WEIRD' (Western, Educated, Industrialized, Rich, Democratic). Cross-cultural studies show this asymmetry disappears or reverses in some collectivist cultures. If the concept of 'intentional' is universal, why does it shift with culture? This suggests our demo captures a local norm, not necessarily a universal cognitive structure."

  **3. The Methodological Takeaway:**
  **Instructor:** "Why did we do this instead of just reading the paper? Because in experimental philosophy, *you* are the data. Philosophical intuition pumps often assume 'we all agree that...' This exercise proves we don't always agree, and even when we do, our agreement might be driven by factors (like moral valence) we didn't notice. It forces us to treat intuition as an empirical phenomenon to be explained, not just a premise to be used."

  ---

  ### IV. Troubleshooting: What Will Go Wrong & How to Handle It

  **1. The "I Know This" Student**
  *   **The Problem:** 2-3 students have read the SEP or a pop-sci article. They might giggle when they read the vignette or try to signal neighbors.
  *   **Prevention:** In the intro, say: "If you recognize this vignette, you have a specific job. Your job is to ignore what you remember the 'result' being and answer strictly based on how this specific wording strikes you *today*. If you answer based on memory, you corrupt the data."
  *   **In the Moment:** If you see signaling, stop the room. "Please keep your eyes on your own paper. We need independent data points."
  *   **In Debrief:** Acknowledge it openly. "Some of you knew this study. Did you feel pressure to answer a certain way? That is 'demand characteristics,' a major problem in experimental design. It's why we randomize and blind in professional settings."

  **2. The "Realism" Objector**
  *   **The Problem:** A student says, "No CEO would actually say 'I don't care about the environment.' This is fake."
  *   **In the Moment:** Do not let this derail the data collection. Say: "That is a valid criticism of the ecological validity, but for this exercise, we must treat the vignette as a logical constraint, like a physics problem with no friction. Please answer based on the text as written."
  *   **In Debrief:** Return to this. "The student who questioned the CEO's realism was right. This is a limitation. But if the effect holds even in unrealistic stories, it suggests the cognitive mechanism is very robust."

  **3. The "Consistency" Guesser**
  *   **The Problem:** A student guesses there are two versions and tries to make their answer "match" what they think the experiment wants, or tries to be logically consistent across conditions they can't see.
  *   **In the Moment:** Emphasize the "Gut Reaction." "There are no right answers. I am not grading your moral consistency. I am measuring your linguistic intuition."
  *   **In Debrief:** Use this to discuss the "Competence vs. Performance" distinction. "Even if you tried to game the system, the aggregate data still showed the asymmetry. This suggests the effect is often unconscious."

  **4. The Data Doesn't Show the Effect**
  *   **The Problem:** With N=18, random variance could result in a flat distribution (e.g., equal splits in both conditions).
  *   **In the Moment:** Do not panic. Do not fudge the numbers.
  *   **In Debrief:** This is actually a valuable teaching moment. "The Knobe Effect is robust in large samples (N=100+), but in small samples, noise dominates. This is why single-case intuition in philosophy is risky. If we hadn't pooled our data, individual students might have thought their intuition was universal. The failure of the demo today proves the need for statistical power."

  ### V. Post-Class Reflection Note
  When you assign the reading, explicitly tell them: "As you read Knobe, compare his claims to our whiteboard. Did our data support his 'Skill Model' or his 'Moral Penetration' hypothesis? Be prepared to argue why our N=18 demo is insufficient to settle the debate he is having." This ensures they leave the class understanding that the experiment was a *probe*, not a *proof*.
