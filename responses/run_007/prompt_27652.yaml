  The first and strongest principle is **Continuity of Functional History**. This drives your verdicts in Cases A (Ship), B (Continuous Ship), D (Mended Sweater), and F (Chess Club). You consistently judge that an object or institution remains the same so long as there is an unbroken chain of existence where changes happen gradually or functionally, even if all the original components (planks, yarn, members) are replaced. Crucially, in Case B, you prioritize the vessel that stayed in continuous service over the one reassembled from original parts, establishing that *history of operation* trumps *material origin*.

  The second principle is **Structural or Locational Constancy**. This drives your verdicts in Case C (Statue) and Case E (River). Here, identity is tied to a specific form or location; if the form is squashed or the river bed diverted, the object ceases to exist even if the matter persists. This principle suggests that if the bakery's location or specific product (bread vs. pastries) is essential to its "form," moving or changing focus might break its identity.

  These principles pull in different directions for the bakery. The **Continuity Principle** says it is the **same bakery** because the business operated without interruption; the changes in ownership, location, and product are analogous to the replacing planks (Case A) or changing members (Case F). The **Structural Principle** suggests it might be a **new bakery** (or a replica) because the move to a new neighborhood resembles the river diversion (Case E), and the friend's restoration resembles the reassembly of original planks (Case B).

  However, the Continuity Principle fits your overall pattern better. You treat artifacts and institutions (ships, sweaters, clubs) differently than natural features or art objects (rivers, statues). Since a bakery is a business institution like the chess club, your verdict in Case F implies that location and specific members (or owners/products) are incidental to the identity, provided the institutional practice continues. Therefore, the bakery remained the same entity throughout the outside ownership, and your friend's repurchase is merely a change of ownership, not a re-creation.

  To cleanly separate these principles, consider this case: **The Relocated Club.** Suppose the chess club from Case F decided to move their weekly meetings to a different building across town, keeping the same members, rules, and name. If you say it is the *same club*, you confirm that location is not essential for institutions, sealing the verdict that the bakery's move did not break its identity. If you say it is a *new club*, then location is essential, and the bakery's move likely broke its identity, making your friend's version a replica.

  \answer{You should say it is the same bakery because your prior judgments establish that for institutions and artifacts, unbroken functional continuity preserves identity even through changes in location, ownership, and composition.}
