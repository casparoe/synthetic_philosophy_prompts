answer: |-
  # Sidebar: Which School of Anthropic Reasoning Do You Actually Belong To?

  Anthropic reasoning asks how the fact of your own existence should influence your estimates about the world. Do you live in a universe teeming with life because that makes observers like you more likely? Or is your existence just a random draw from whatever pool happens to exist?

  Read the eight scenarios below. Don't overthink the physics; go with your gut intuition about what is *probable*. Tally your answers, then scroll to the key to find your philosophical profile.

  ***

  ### 1. The Sleeping Volunteer
  A scientist puts you to sleep. She flips a fair coin. If it lands **Heads**, she wakes you once on Monday, interviews you, and ends the experiment. If it lands **Tails**, she wakes you on Monday, erases your memory of the awakening, wakes you again on Tuesday, interviews you, and then ends the experiment.
  You wake up. You don't know what day it is. What is your credence (degree of belief) that the coin landed **Heads**?
  *   **A.** 1/2. The coin is fair; waking up doesn't change the odds of the flip.
  *   **B.** 1/3. There are three possible awakenings (Heads-Mon, Tails-Mon, Tails-Tue), and only one involves Heads.

  ### 2. The Birth Rank
  Imagine you learn that every human who will ever live is assigned a sequential number at birth. You discover your number is roughly 100 billion. You know that about 100 billion humans have lived *so far*.
  Does this information suggest that the total number of humans who will *ever* live is likely to be...
  *   **A.** ...not much larger than 200 billion? (Humanity is likely to end relatively soon.)
  *   **B.** ...irrelevant? (My birth rank tells me nothing about the future total.)
  *   **C.** ...vastly larger? (Being early in a long sequence is expected.)

  ### 3. The Two Theories
  Physicists are debating two theories of the universe. They are equally elegant and fit current data equally well.
  *   **Theory X** predicts the universe contains 1 trillion observers.
  *   **Theory Y** predicts the universe contains 1 trillion trillion observers.
  Before gathering new telescope data, how should you bet on which theory is true?
  *   **A.** It's a 50/50 toss-up. Observer counts don't determine physical truth.
  *   **B.** Theory Y is a trillion times more likely. I am more likely to exist in a universe with more observers.

  ### 4. The Incubator
  A machine creates rooms numbered 1 to 100. A coin is flipped. If **Heads**, it creates only Room 1. If **Tails**, it creates all 100 rooms. In every created room, it places a person.
  You find yourself in Room 1. What is the probability the coin was **Heads**?
  *   **A.** 1/2. The coin was fair.
  *   **B.** Very high (near 1). If Tails had landed, I would likely be in a room numbered higher than 1.
  *   **C.** It depends on whether the people in rooms 2–100 are "like me."

  ### 5. The Alien Census
  You are trying to estimate the probability of intelligent life in the galaxy. You know that if life is common, there are billions of civilizations. If life is rare, there is only one (us).
  Does the fact that *you* are an observer count as evidence that life is common?
  *   **A.** No. I had to be somewhere to ask the question.
  *   **B.** Yes. There are more slots for "observers" in a crowded galaxy than an empty one.
  *   **C.** Only if I define "observer" strictly as "human."

  ### 6. The Infinite Hotel
  Imagine a universe that is infinite in size and time. In such a universe, every possible configuration of matter happens infinitely many times. There are infinite copies of you reading this quiz.
  When you ask, "What is the probability I see the letter 'A' next?", the question...
  *   **A.** ...has a standard answer based on the frequency of 'A' in English.
  *   **B.** ...is meaningless without a "measure" to weigh the infinite copies against each other.
  *   **C.** ...implies I am likely a random fluctuation (a Boltzmann Brain) rather than a real person.

  ### 7. The Lottery Winner
  You win a lottery with odds of 1 in 100 million. You are tempted to think: "If the universe were vast enough to contain many lottery players, my winning is less surprising than if I were the only player."
  Is this reasoning sound?
  *   **A.** No. The odds were 1 in 100 million regardless of how many played.
  *   **B.** Yes. In a universe with trillions of players, a winner is guaranteed, and I am simply one of them.
  *   **C.** It's sound only if I didn't know the number of players beforehand.

  ### 8. The Memory Wipe (Variation)
  Ten people are cloned. One clone is randomly selected to have their memory wiped and placed in a red room; the other nine are placed in blue rooms. You wake up in a red room.
  What do you infer about the selection process?
  *   **A.** It was random. I just got unlucky.
  *   **B.** The process was likely rigged to put me in red, because it's unlikely I'd be the 1 in 10 selected otherwise.
  *   **C.** The setup is incoherent; "I" cannot be randomly selected from clones.

  ***

  ## Scoring Key

  Tally your answers. Most readers will have a mix, but look for the dominant pattern.

  ### Mostly A's: The Modest Centurion (SSA)
  **The View:** You hold to the **Self-Sampling Assumption**. You reason as if you are a random sample from the set of all observers in your "reference class." You believe your existence is a fixed fact that doesn't bias the world toward having more people.
  **The Commitment:** You must accept the **Doomsday Argument**. If you are human #100 billion, it is statistically improbable that you are early in a sequence of trillions. You are forced to conclude humanity is likely to go extinct sooner rather than later, simply because of your birth rank.
  **Sub-variant:** If you chose **C** on Question 5 or 4, you are a **Narrow-Class Centurion**. You believe only observers very similar to you count in your reference class. This saves you from Doomsday but makes your reasoning sensitive to arbitrary definitions of "similarity."

  ### Mostly B's: The Cosmic Populist (SIA)
  **The View:** You hold to the **Self-Indication Assumption**. You believe that worlds with more observers are *a priori* more likely to contain you. Your existence is evidence that the world is populous.
  **The Commitment:** You must accept the **Presumptuous Philosopher**. On Question 3, you admitted you could determine the size of the universe (a physical fact) just by counting potential observers, without looking through a telescope. Critics argue this allows you to discover physics from an armchair.
  **Sub-variant:** If you chose **B** on Question 6, you are aware of the **Measure Problem**. You recognize that in infinite universes, simple counting breaks down and requires a mathematical "measure" to compare infinities, a notoriously unsolved problem in cosmology.

  ### Mostly C's (or Mixed A/B with C on 5 & 8): The Evidence Purist (FNC/Bayesian)
  **The View:** You reject special anthropic axioms. You argue for **Full Non-Indexical Conditioning**. You believe you should just update on all available evidence ("I am a human experiencing X") using standard Bayesian math, without assuming you are a "random sample."
  **The Commitment:** You often end up in the same place as the Cosmic Populist (SIA) but claim a different justification. Your uncomfortable pill is **Guilt by Association**: mathematically, your view often yields the same "presumptuous" results as SIA, forcing you to defend why your reasoning isn't subject to the same criticisms.
  **Note:** If you found the questions themselves frustrating or linguistically slippery, you may be a **Grounded Skeptic**, believing that "probability" doesn't apply to unique events like one's own existence.

  ***

  ## A Note on Indistinguishable Positions

  This quiz sorts you by your *intuitions about cases*, not your *justifications*. Consequently, it cannot reliably separate **The Cosmic Populist (SIA)** from **The Evidence Purist (FNC)**.

  In finite cases (like the Sleeping Volunteer or the Incubator), SIA and FNC almost always yield the same numerical probabilities. They diverge only on deep theoretical grounds: the Populist believes there is a *principle* that favors populous worlds, while the Purist believes populous worlds are simply more likely to *generate the specific evidence you have*. To separate them, one would need to ask not "What is the probability?" but "Why is it the probability?"—a question too subtle for a sidebar quiz.

  Additionally, a **Modest Centurion** who chooses an extremely narrow reference class (e.g., "The reference class contains only me") becomes behaviorally indistinguishable from a **Skeptic** who rejects anthropic updating entirely. They both refuse to update their beliefs based on observer counts. They come apart only when asked to define the boundaries of that class: the Centurion believes a class exists but is small; the Skeptic believes the class concept is irrelevant to probability.
