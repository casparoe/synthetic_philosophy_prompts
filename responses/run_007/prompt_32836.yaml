answer: |-
  Here is the allocation of explanatory weight based on the current consensus in the cognitive science of religion and evolutionary anthropology, followed by the requested analysis.

  ### Explanatory Allocation

  *   **Cognitive-byproduct accounts: 40%**
      This family carries the most weight because it explains the universal *content* and *intuitiveness* of religious ideas by anchoring them in pre-existing mental systems like hyperactive agency detection and theory of mind.
  *   **Cultural-evolution accounts: 25%**
      This accounts for the differential *transmission* and *variation* of religious traditions, explaining why certain concepts survive and spread while others vanish, independent of genetic fitness.
  *   **Big Gods / prosocial religion: 15%**
      This explains the specific historical correlation between moralizing high gods and the rise of large-scale complex societies, functioning as a mechanism for norm enforcement.
  *   **Coping-and-health accounts: 15%**
      This explains the *maintenance* and *individual adherence* to religion through the physiological and psychological benefits of ritual, stress reduction, and social support.
  *   **Adaptationist accounts: 5%**
      This remains the smallest share because there is scant evidence that religious behavior was directly favored by genetic selection rather than emerging as a byproduct or cultural adaptation.

  **Total: 100%**

  ***

  ### Hardest Pair to Pull Apart Empirically

  The pair hardest to distinguish is **Adaptationist (Genetic)** and **Cultural-evolution** accounts.

  **Why:** Both frameworks utilize evolutionary logic to predict similar behavioral outcomes, such as in-group cohesion, altruism, and costly signaling. Because human evolution involves gene-culture coevolution, the archaeological and anthropological record rarely preserves the specific signature of whether a trait spread because it increased genetic fitness (selection on the genome) or because it was a highly transmissible idea (selection on the meme), making the locus of selection incredibly difficult to isolate.

  ***

  ### Most Vulnerable Allocation

  My allocation is most vulnerable regarding the **Big Gods / prosocial religion (15%)** category.

  **What would shift it:** Recent data from the Seshat: Global History Databank suggests that social complexity often *preceded* the appearance of moralizing gods, rather than gods facilitating complexity. If further longitudinal analysis definitively proves that moralizing high gods are a *consequence* of large-scale society rather than a *cause*, the explanatory weight of this category would collapse, requiring those points to be redistributed primarily to **Cultural-evolution** (as a downstream effect) or **Cognitive-byproduct** accounts.
