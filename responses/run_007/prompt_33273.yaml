answer: |-
  ### Essay Question

  **Teleosemantic theories aim to naturalize mental content by appealing to biological functions. However, they face a structural tension: approaches that rely on current indication (like Dretske's early informational semantics) struggle to solve Fodor's disjunction problem, while approaches that rely on selection history (like Millikan's proper functions) face the Swampman objection. Critically evaluate this tension. Can a teleosemanticist employ selection history to solve the disjunction problem without making content so dependent on the past that it yields counter-intuitive results in Swampman cases? In your answer, explain why 'Normal Conditions' are introduced and whether the Swampman verdict is a fatal flaw or a necessary cost of externalism.**

  ***

  ### Model Answer

  Teleosemantics attempts to solve the fundamental problem of naturalizing intentionality: explaining how mental states can be *about* the world and, crucially, how they can *misrepresent* it. A purely causal or informational theory struggles here. If a neural state is caused by flies, and also caused by black blobs (BBs) in the dark, a simple indication theory suggests the content is "fly-or-BB." If the frog snaps at a BB, it hasn't erred; it has satisfied the disjunctive content. This is Fodor's disjunction problem. To naturalize error, teleosemantics must distinguish between what a state *does* indicate and what it *should* indicate.

  Dretske's early informational account leans on reliable indication. However, as the disjunction problem shows, reliability is insufficient for error. If the tokening is reliable under conditions C, and C includes BBs, the content expands to include BBs. Millikan's etiological account solves this by shifting the ground from current reliability to historical function. For Millikan, a representation has content based on what the consuming mechanism was *selected* to do in "Normal Conditions." Normal Conditions are not statistical averages; they are the conditions under which the ancestor of the mechanism successfully performed its function. The frog's snap mechanism was selected to catch nutritious flies, not BBs. Therefore, the content is "fly." When the frog snaps at a BB, it is operating outside Normal Conditions, and misrepresentation occurs. The disjunction problem is solved because the content is fixed by the specific historical success conditions, not the current causal covariance.

  However, this historical solution generates the vulnerability to Swampman cases. Davidson's Swampman is a molecule-for-molecule duplicate of a human, created by a lightning strike in a swamp, with no evolutionary or learning history. Because Millikan's theory makes content constitutively dependent on selection history, Swampman lacks proper functions. Consequently, Swampman has no mental content. His states indicate nothing, and he misrepresents nothing.

  The tension is now explicit: the very feature that solves the disjunction problem (appeal to selection history) is what denies content to Swampman. To solve the disjunction problem, one must ground normativity in something other than current causal relations; otherwise, error collapses into complex success. History provides that normativity. But if history is constitutive of content, then a being without history lacks content.

  Is this a fatal flaw? A defender of Millikan might argue that the Swampman intuition relies on an internalist bias—the idea that intrinsic duplicate implies mental duplicate. If we accept radical externalism, the verdict is consistent. If content is a functional role defined by a lineage, Swampman lacks the role. Just as a duplicate of a heart made of swamp stuff is not a heart because it lacks the lineage of pumping blood, Swampman's states are not representations. The cost of solving the disjunction problem is accepting that content is not supervenient on the intrinsically physical state of the organism.

  However, a critic might argue this cost is too high. It renders the theory unable to account for the immediate phenomenology of thought. If Swampman behaves exactly like a human, claims to have thoughts, and navigates the world successfully, denying him content seems to change the subject. A potential middle ground involves distinguishing between *derivative* and *underived* content. Perhaps Swampman acquires content rapidly through new learning processes, establishing new proper functions. But strictly speaking, at the moment of creation, the etiological view holds he has none.

  Ultimately, the teleosemanticist faces a trade-off. To avoid the disjunction problem, they must ground content in norms derived from history. To avoid the Swampman objection, they must ground content in current capacity. Millikan chooses the former. Whether this is successful depends on whether one views the Swampman intuition as a data point to be saved or a pre-theoretic mistake to be corrected. If naturalizing content requires breaking the link between intrinsic state and meaning, then the Swampman verdict is a necessary cost of a robust theory of error.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  #### **A Range (70–100): Excellent to Outstanding**
  *   **Integration of Issues (30 marks):** Does not treat the Disjunction Problem and Swampman as separate items. Explicitly argues that the *solution* to the former (etiology) creates the *vulnerability* to the latter. Identifies the core tension between "current indication" and "historical normativity."
  *   **Technical Accuracy (30 marks):** Correctly defines "Normal Conditions" (not statistical, but success conditions of ancestors). Accurately explains why indication theories fail on error (the "fly-or-BB" collapse). Distinguishes Millikan's etiological view from Dretske's informational view without conflating them.
  *   **Critical Evaluation (25 marks):** Takes a stance on whether the Swampman verdict is fatal. Discusses externalism vs. internalism or the "changing the subject" reply. Does not merely describe the theories but evaluates the trade-off.
  *   **Clarity & Structure (15 marks):** Concise, argumentative flow. No fluff.

  #### **B Range (60–69): Good to Very Good**
  *   **Integration (20 marks):** Discusses both problems but the connection is weaker. Might say "Millikan solves Disjunction but fails Swampman" without explaining *why* the solution causes the failure (the reliance on history).
  *   **Technical Accuracy (25 marks):** Generally correct on Proper Functions and Disjunction. May be slightly vague on "Normal Conditions" (e.g., calling them "ideal conditions" without referencing selection).
  *   **Critical Evaluation (15 marks):** Offers an opinion on Swampman but lacks depth (e.g., just says "it seems wrong" without analyzing externalism).
  *   **Clarity & Structure (10 marks):** Clear but perhaps spends too much time on exposition in the first half.

  #### **C Range (50–59): Satisfactory**
  *   **Integration (10 marks):** Treats the prompt as two separate questions ("Part 1: Disjunction, Part 2: Swampman").
  *   **Technical Accuracy (20 marks):** Basic definitions present but may confuse Dretske and Millikan. Might define Normal Conditions as "what usually happens."
  *   **Critical Evaluation (10 marks):** Minimal evaluation; mostly summary of views.
  *   **Clarity & Structure (10 marks):** Understandable but disorganized.

  #### **Common Mistakes & Penalties**
  *   **Conflating Disjunction with Quinean Indeterminacy (-10 marks):** The disjunction problem is about error/misrepresentation, not translation/manual of reference.
  *   **The "No History" Shorthand (-5 marks):** Saying "Swampman has no history so no content" without explaining *why* history is required for norms/functions.
  *   **Confusing Dretske and Millikan (-10 marks):** Attributing Proper Functions to Dretske or Informational Semantics to Millikan.
  *   **Missing the "Normal Conditions" Nuance (-5 marks):** Defining Normal Conditions as statistical frequency rather than conditions required for the performance of the proper function.
  *   **Regurgitation (-15 marks):** If the answer reads like lecture notes without addressing the specific tension in the prompt, cap at 55%.
