answer: |-
  # The Viable Set

  The PDF was only two pages long. It sat on Elena's laptop screen, glowing in the dark of the kitchen, casting a pale rectangle onto the table. She had ordered the test on a Tuesday, during a lull in grading papers, thinking it would be fun to know if she had a predisposition for cilantro aversion or if her ancestors had migrated through the Caucasus.

  The second page contained a section titled *Reproductive History Insights*. It was a new feature, beta-tested.

  *Our analysis indicates a high probability of assisted reproductive technology (ART) in your direct lineage. Specifically, markers suggest multiple viable zygotes were created during a single cycle. You were one of a set.*

  Elena read the sentence three times. She knew she was IVF. Her parents had told her when she was ten, in the matter-of-fact tone they used for explaining taxes or why they didn't go to church. *We needed a little help, El. That's all.*

  She had never asked about the help. She had assumed it was a singular, medical effort: one egg, one sperm, one needle, one hope.

  She clicked the dropdown menu for *Sibling Probability*.

  *Estimated number of viable embryos in cycle: 4.*
  *Selection method: Morphological grading (randomized among top tier).*

  Four. There had been four of them. Four distinct genetic combinations, sitting in a warmed incubator in a clinic in Baltimore in 1986. An embryologist, perhaps tired, perhaps humming along to the radio, had looked at four microscopic spheres of potentiality. He had chosen the one that looked the most symmetrical. The one with the least fragmentation.

  He had chosen Elena.

  She closed the laptop. The kitchen was silent, save for the hum of the refrigerator. She looked at her hands. They were resting on the laminate table. They looked like her hands. They felt like her hands. But the thought arrived cold and hard in her chest: *If he had picked the one to the left, I would not be here.*

  It wasn't that she would be living a different life. It wasn't that she would have her sister's eyes or her brother's laugh. It was that *she*—the specific consciousness currently worrying about the mortgage and the stain on the rug—would not exist. Someone else would be sitting in this chair. Someone else would be the wife of Mark, the mother of Sophie.

  She stood up and walked to the hallway mirror. She leaned in until her breath fogged the glass.

  Kripke was right, she thought suddenly, surprised by the clarity of it. She had read *Naming and Necessity* in grad school, a dry requirement for a metaphysics seminar she'd barely passed. *Origin Essentialism.* The origin of a person is essential to them. You cannot come from different gametes and remain yourself. It is not a contingent fact that you came from *this* sperm and *this* egg. It is necessary.

  If the embryologist had picked Embryo B, Embryo B would have grown up to be a woman in her late thirties. She might have looked like Elena. She might have even been named Elena. But she would not be *this* Elena. She would be a stranger wearing Elena's life.

  The vertigo was physical. She gripped the sink. It felt as though the floor had dropped out, not because her life was meaningless, but because it was too specific. It was a single thread pulled from a tapestry of four, and the other three had been discarded, thawed, or donated to research.

  ***

  Sunday dinner was roast chicken. Her mother, now seventy-two, carved with steady hands. Her father sat at the head of the table, watching the news on the muted TV in the corner.

  "Did you get the results?" her mother asked. She didn't look up from the carving board.

  "I did," Elena said. She was pushing a carrot around her plate. "It mentioned the cycle. The four embryos."

  Her mother's knife paused. Just for a fraction of a second. Then she slid a slice of breast onto Elena's plate. "Oh. Yes. Well. That was standard then."

  "Did you know they chose randomly?"

  "We didn't ask them to flip a coin, Elena." Her mother's voice was light, defensive. "They chose the healthiest one. The one most likely to take."

  "But if that one hadn't taken? If they had tried the next one?"

  "Then we would have tried the next one." Her mother finally looked at her. Her eyes were the same shade of hazel as Elena's. "Why are you asking this?"

  "I'm just trying to understand," Elena said. "If they had picked a different one... I wouldn't be me. You know that, right?"

  Her mother put the knife down. She wiped her hands on her apron. "Don't be morbid. You are you. You're sitting right there."

  "But I'm contingent, Mom. I'm an accident."

  "You are a miracle," her father said from the head of the table, still looking at the muted TV. A politician was mouthing silently on the screen. "We wanted a child. We got you."

  "That's the problem," Elena said, and she heard the edge in her voice, sharp enough to make her mother flinch. "You wanted *a* child. You didn't want *me*. You wanted the outcome. I'm just the mechanism that got you there."

  "That is not true," her mother said. Her voice was hard now. "We loved you before you were born."

  "You loved the idea of me. You loved the possibility." Elena stood up. She needed air. "If you had gotten Embryo Two, you would have loved her just as much. And I would be... nothing."

  "Elena," her mother said. "Sit down."

  "I can't."

  She walked out to the garden. The air was cool, smelling of damp earth and the neighbor's woodsmoke. She wrapped her arms around herself.

  It was the Non-Identity Problem, she realized. Parfit. If her parents had chosen a different embryo, they would not have harmed *her*, because she would never have existed to be harmed. They would have created a different person who would, presumably, be happy. So she had no grounds for complaint. She had no grounds for resentment. To resent the choice was to resent her own existence.

  She looked at the swing set in the corner of the yard. Sophie's swing.

  If she hadn't existed, Sophie wouldn't exist. The chain of causality was unbroken. Her accident was Sophie's necessity.

  ***

  Mark was asleep when she got home. He lay on his side, one arm thrown over the pillow where her head should have been. She stood in the doorway for a long time, watching the rise and fall of his shoulders.

  She climbed into bed carefully, trying not to wake him. He stirred anyway, rolling toward her. His hand found her waist, heavy and warm.

  "You okay?" he mumbled, his eyes still closed.

  "I'm here," she said.

  "That's what I asked."

  She lay in the dark, staring at the ceiling. The intimacy felt suddenly fragile. Mark loved *her*. He loved the way she took her coffee, the way she laughed at bad puns, the specific scar on her knee from a bicycle accident when she was twelve.

  But all of that was built on the foundation of that single cell division. If Embryo Three had been picked, that woman would have had a different scar. Maybe she wouldn't ride bikes. Maybe she would hate coffee. Maybe she would be lying here right now, in this bed, and Mark would think he was loving Elena. But he would be loving a stranger.

  And yet, from the inside, it would feel the same. To the other woman, *she* would be the necessary one. She would look at her own hands and think, *I am inevitable.*

  "Mark," she whispered.

  "Hmm?"

  "If I were different... would you know?"

  He was half-asleep, drifting back under. "You're not different. You're warm. Go to sleep."

  He pulled her closer. She rested her head on his chest, listening to his heart. It was a rhythmic, biological sound. Unconcerned with metaphysics.

  She realized then that she was conflating epistemic possibility with metaphysical necessity. Before she opened the PDF, it was *epistemically* possible that she was any of the four. She didn't know which one she was. But now that she knew she was *this* one, it was *metaphysically* impossible for her to have been the others.

  She couldn't have been the other one. It wasn't that she lost a chance to be someone else. It was that *she* is the name for this specific trajectory.

  But knowing it didn't stop the feeling of thinness. She felt like a ghost haunting a body that was selected by a lottery.

  ***

  The next morning, she took Sophie to the park. It was a crisp autumn day, the kind that made the light look like it was made of gold dust. Sophie was five, a whirlwind of denim and energy.

  "Push me high, Mommy!" Sophie demanded, standing by the swing.

  Elena pushed her. Back and forth. The rhythm was hypnotic.

  "Higher!"

  "I'm pushing," Elena said.

  Sophie laughed, a sound that seemed to come from everywhere at once. Elena watched her daughter's face. The shape of the nose was Mark's. The eyes were Elena's. Or were they the eyes of Embryo Two?

  *Stop it,* she told herself. *This is madness.*

  But the philosophy wouldn't leave her alone. It was a splinter in her mind.

  She thought about death. Usually, she feared death as an end to her projects, a separation from the people she loved. But now, the fear shifted. If her origin was this narrow, this accidental, then her end was just a return to the statistical norm. Non-existence was the default state. She had emerged from the void of the three discarded embryos, and soon she would return to the void.

  But Sophie was here. Sophie was real.

  "Mommy, look!" Sophie pointed at a squirrel running up an oak tree.

  "I see it."

  "It's going to get a nut."

  "Yes."

  "Will it come back?"

  "Maybe."

  Elena caught the swing as it came toward her. She held it still. Sophie looked at her, puzzled.

  "What is it?" Sophie asked.

  Elena looked at her daughter. This was the asymmetry. She looked backward at her origin and saw chaos, chance, a roll of the dice. But when she looked forward, toward Sophie, she saw necessity.

  If Elena ceased to exist, Sophie would grieve. But Sophie would still exist. But if Elena had never existed, Sophie would never exist.

  Elena's existence was the bridge. A bridge built on a single, random pillar.

  "I love you," Elena said.

  Sophie rolled her eyes, the way five-year-olds do when their mothers get weird. "I know. Push me again."

  Elena pushed.

  ***

  That night, she went back to the laptop. She opened the PDF again. She looked at the diagram of the four embryos. Little circles labeled A, B, C, D. She was B.

  She imagined the other three. Not as ghosts, but as null sets. They weren't waiting in the wings. They weren't alternative versions of her living parallel lives. They were nothing. They were the roads not taken, except in this case, the roads not taken were never roads at all. They were just dirt.

  She thought about gratitude. Was she grateful to the embryologist? That felt wrong. He was a technician. Was she grateful to her parents? They had made the choice to seek the technology, but not the choice of *her* specifically.

  She was grateful to the universe? No, the universe was indifferent.

  She was just... here.

  She closed the laptop. She walked into the bedroom. Mark was reading. He looked up as she entered.

  "You've been quiet all week," he said. He marked his page and set the book down. "Is it work?"

  "No." She sat on the edge of the bed. "It's about Sophie. About us."

  "Okay."

  "I found out... about the IVF. Specifically."

  Mark nodded slowly. "Your mom mentioned you were asking about it. Look, El. It doesn't matter."

  "It does matter. It's who I am."

  "It's how you started. It's not who you are." He reached out and took her hand. His thumb rubbed over her knuckles. "You think if they picked a different one, I wouldn't be sitting here?"

  "I think *I* wouldn't be sitting here."

  "Right. But someone would. And maybe she would be happy, too."

  "That's not comforting, Mark."

  "I know." He squeezed her hand. "But you're the one who is here. You're the one I know. The others... they're not people, Elena. They're just biology. You're the person."

  He was right, logically. But he was missing the point. The point was that *being a person* felt like it should be more solid than a lottery win.

  "I feel like an imposter," she said quietly.

  "In your own life?"

  "Yes."

  Mark sighed. He shifted, pulling her down so she was lying next to him. He wrapped his arms around her, the way he had the night before.

  "Then stop trying to own it," he said into her hair. "Just live it."

  ***

  She woke up early the next morning. The house was silent. She went to the bathroom and turned on the tap. She splashed water on her face and looked in the mirror.

  The woman in the mirror looked tired. There was a fine line near her eye that hadn't been there last year.

  She thought about the Kripkean thesis again. *Origin Essentialism.*

  If she accepted it fully, truly accepted it, then the vertigo should stop. If it is *necessary* that she came from these gametes, then there is no other possibility. There is no other world where she exists and came from Embryo C. That is a logical impossibility.

  So, she was not lucky. Luck implies you could have lost. But she couldn't have lost, because if she lost, she wouldn't be there to lose.

  She was not accidental. She was necessary, by definition of her own existence.

  It was a tautology. *I am me, therefore I am me.* It was empty. It was circular.

  And yet, as she dried her face with the towel, she felt the roughness of the cotton against her skin. She felt the cold air on her wet cheeks. She heard Sophie waking up down the hall, the soft cry that meant she wanted water.

  Elena turned off the tap.

  She walked out of the bathroom and down the hall. The floorboards creaked under her feet. Specific floorboards. Specific feet.

  She entered Sophie's room. The little girl was sitting up, rubbing her eyes.

  "Water," Sophie whispered.

  Elena went to the dresser, picked up the sippy cup, and held it to Sophie's lips. Sophie drank, her throat working, her eyes heavy.

  When she was done, she lay back down and pulled the duvet up. "Story?"

  "Later," Elena said. "Sleep now."

  She tucked the blanket around Sophie's shoulders. She leaned down and kissed her daughter's forehead. The skin was warm, smelling of milk and sleep.

  In that moment, the metaphysics dissolved. It didn't matter if she was Embryo B or Embryo D. It didn't matter if she was necessary or contingent. The love she felt was not a logical proposition. It was a physical fact, like gravity.

  She walked back to her room. Mark was still asleep. She lay down beside him.

  She closed her eyes. She thought about the other three embryos. She wished them well, in the strange, null way one wishes well to things that do not exist. *I am sorry I won,* she thought. *I am sorry I am the one who has to die.*

  But then she felt Mark's arm move in his sleep, draping over her waist, anchoring her to the bed, to the house, to the morning.

  She was here. The lottery was over. The ticket had been cashed.

  She took a breath. She let it out.

  "I'm here," she whispered to the dark.

  And the dark, indifferent and vast, did not argue.
