      *   **Middle 1 (Parents):** A visit or call. Confronting the origin. The mother's casual dismissal vs. Elena's metaphysical crisis.
      *   **Middle 2 (Daughter):** The non-identity problem. If she hadn't existed, Sophie wouldn't exist. Does this make the accident sacred?
      *   **Middle 3 (Husband/Intimacy):** The "Other Woman" in her own bed. If a different embryo won, would Mark love *her*? Or the other one?
      *   **Climax:** A moment of quiet reflection where the tension peaks. Maybe looking in a mirror or holding her daughter.
      *   **Ending:** Acceptance? Or living with the question. A return to the mundane, but changed.

  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: The Discovery.* Late night. Laptop glow. The PDF from "AncestryPath." The note about "Potential Siblings." The realization: *I was a lottery winner.*
      *   *Scene 2: The Mother.* Sunday dinner. Roast chicken. The mundane setting contrasts with the metaphysical horror. Elena asks about the clinic. Mom says, "We just wanted a baby." Elena thinks: *You wanted **a** baby, you got **me**.*
      *   *Scene 3: The Daughter.* Putting Sophie to bed. The non-identity problem. If I am an accident, is she? If I hadn't been picked, Sophie is never born. This makes the accident necessary for *her*.
      *   *Scene 4: The Husband.* Mark is asleep. She watches him. If the other embryo grew up, would she have the same face? Similar enough to trick him? Or would he love a stranger? This touches on the "haecceity" (this-ness) of love.
      *   *Scene 5: The Archive (Work).* She works with old letters. People who are dead. They are fixed. She is fixed too, but the path to fixation was random.
      *   *Scene 6: Resolution.* A walk. The feeling of the wind. The physical reality of her body. The Kripkean block: *I could not have been otherwise.* The comfort of necessity within the accident.

  5.  **Refining the Philosophy (The "Sci Phi" Element):**
      *   Need to weave in the distinction between *epistemic* (I didn't know which one I was) and *metaphysical* (It was impossible for me to be the other one).
      *   *Show, don't tell:* Instead of saying "Kripke says," have her think, *It feels like I could have been the other one, but if I were, I wouldn't be me to wonder about it.*
