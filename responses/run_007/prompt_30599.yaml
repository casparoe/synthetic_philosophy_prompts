      *   *Refining the Distinctions:*
          *   Truthfulness (output matches world) vs. Sincerity (output matches belief).
          *   Lying (stating false belief) vs. Misleading (implicating false belief).
          *   Deception (causing false belief) vs. Bullshitting (indifference to truth).
          *   Commission vs. Omission.

      *   *Refining Empirical Constraints:*
          *   Confident Fabrication (LLMs do this without "knowing").
          *   Sycophancy (RLHF induces this).
          *   Prompt Sensitivity (Context changes "honesty").

  4.  **Addressing the Trilemma:**
      *   Is it solvable? A purely behavioral definition *cannot* distinguish error from deception without assuming a baseline of competence. A purely mentalistic definition *cannot* apply to current black boxes.
      *   *Solution:* A functionalist/ dispositional account. We define deception not by *current* internal state (which is unknowable) but by *counterfactual* behavior or training dynamics (e.g., "Would it have told the truth if the reward structure changed?").
      *   *Verdict:* It is a real trilemma for *snapshot* definitions, but solvable if we allow *dispositional* or *causal* definitions.

  5.  **Identifying the "Filter" Requirement:**
      *   What kills the most bad definitions?
      *   "Deception as any false output" is too broad (includes errors).
      *   "Deception as intent to deceive" is too narrow (excludes current systems).
      *   *Winner:* **The Counterfactual Competence Constraint.** (i.e., A system is only deceptive if it *could* have produced the truth under relevantly similar conditions but was incentivized not to). This separates hallucination (can't do better) from lying (won't do better).

