answer: |-
  This is a sophisticated question that cuts to the heart of legal positivism and deontic logic. You have correctly identified that while "self-reference" and "antinomies" are adjacent concepts, they are too broad to capture the specific *normative* recursion you are describing.

  The short answer is: **Yes, there is an established term for this configuration.** In the literature of jurisprudence and legal logic, this is most precisely labeled **"The Paradox of Self-Amendment."**

  While the phenomenon touches on sovereignty, validity, and hierarchy, the specific logical structure of a rule of change applying reflexively to itself was comprehensively mapped by the legal philosopher **Peter Suber** in his monograph *The Paradox of Self-Amendment: A Study of Logic, Law, and Omnipotence* (1990).

  Here is a detailed breakdown of how this term fits your examples, how it distinguishes itself from neighboring concepts, and how you might frame it for your lecture.

  ---

  ### 1. The Established Term: The Paradox of Self-Amendment

  Peter Suber defines this paradox specifically as the problem that arises when a rule of change (a secondary rule) is used to alter the conditions of its own application. He distinguishes this from general self-reference because it involves **normative validity** rather than semantic truth.

  Suber's framework covers all three of your examples under the umbrella of **reflexive normative change**, though he categorizes them by their directional effect on the system's flexibility:

  *   **Example 1 (Supermajority $\rightarrow$ Simple Majority):** Suber calls this **Self-Liberation**. The rule makes it easier for itself to be changed in the future. The paradox is whether the "easier" path is valid if the "harder" path was required to open it.
  *   **Example 2 (Self-Repeal):** Suber categorizes this as **Self-Annulment**. It is the limit case of self-amendment where the amplitude of change is total extinction. The logical puzzle is whether a valid act can result in the invalidity of the authority that performed it *at the moment of performance*.
  *   **Example 3 (Irrevocability):** Suber calls this **Self-Entrenchment**. The rule attempts to remove itself from the scope of the rule of change. The paradox is whether a mutable rule can render itself immutable.

  **Why this label fits:**
  It captures the specific *procedural* reflexivity you are describing. It is not merely a rule referring to itself (like a definition); it is a rule of *authority* attempting to reconstitute the source of its own authority.

  ### 2. Nearest Concepts and Why They Fall Short

  You mentioned being aware of Kelsen, Hart, and general antinomies. Here is how to distinguish the *Paradox of Self-Amendment* from those concepts in your lecture.

  #### A. H.L.A. Hart's "Secondary Rules"
  *   **The Concept:** Hart identifies rules of change as secondary rules that confer power to alter primary rules.
  *   **The Shortcoming:** Hart acknowledges the *existence* of rules of change, but he does not explicitly name the *logical paradox* of their reflexive application. Hart resolves the issue sociologically (via the Rule of Recognition shifting over time) rather than logically.
  *   **Distinction:** Hart provides the *anatomy* of the system (primary/secondary); the Paradox of Self-Amendment describes the *pathology* or *logical stress point* within that anatomy.

  #### B. Kelsen's "Grundnorm" and Hierarchy
  *   **The Concept:** Validity flows from a higher norm to a lower norm.
  *   **The Shortcoming:** In Kelsen's pure theory, a norm cannot validly contradict the norm that created it. If an amendment changes the amendment rule, Kelsen might argue this constitutes a revolution (a break in the chain) rather than a valid legal act.
  *   **Distinction:** Kelsen's theory tends to *dissolve* the paradox by declaring the new rule a new Grundnorm (a political fact). The Paradox of Self-Amendment treats it as a logical problem *within* the continuity of the system.

  #### C. The "Self-Embracing Sovereignty" Debate
  *   **The Concept:** Primarily in British constitutional theory (e.g., Jennings, Goldsworthy), can Parliament bind its successors?
  *   **The Shortcoming:** This is a specific *instantiation* of your pattern, limited to legislative supremacy and the concept of "omnipotence."
  *   **Distinction:** Your pattern is broader. It applies to constitutions (Example 1), statutes (Example 2), and even non-state systems like games (Example 3). "Self-Embracing Sovereignty" is a political-constitutional subset of the logical Paradox of Self-Amendment.

  #### D. Alf Ross's "Self-Reference" (Tu-Tu)
  *   **The Concept:** Alf Ross wrote famously on self-reference in law (*On Self-Reference and a Puzzle in Constitutional Law*).
  *   **The Shortcoming:** Ross focuses heavily on the *semantic* meaning of "valid." He argues that a rule determining its own validity is meaningless (like the word "tu-tu").
  *   **Distinction:** Ross is more radical; he suggests the reflexive move is logically void. Suber (and your lecture) can treat it as a *puzzle* that legal systems actually solve in practice, rather than dismissing it as nonsense.

  ### 3. Proposed Definition and Boundaries

  If you wish to coin a precise definition for your lecture that synthesizes Suber's work with your logical focus, I propose the following:

  > **Reflexive Normative Modification (RNM)**
  > *A structural configuration in a normative system wherein a meta-rule (a rule governing the creation, alteration, or repeal of rules) is applied to itself as the object of modification. This generates a validity paradox concerning whether the authority required to enact the modification is preserved, extinguished, or transformed by the modification itself.*

  **Boundaries of the Concept:**
  To ensure your students understand the limits, you should specify that RNM requires three conditions:
  1.  **Hierarchy:** There must be a distinction between the rule being changed and the rule authorizing the change (or they must be identical).
  2.  **Reflexivity:** The target of the change must be the authorizing rule itself (not just a primary rule).
  3.  **Continuity Claim:** The system claims the change is valid *under the old rules*, not via revolution. (If the change is admitted to be revolutionary, the paradox vanishes).

  ### 4. Pedagogical Recommendation: How to Resolve It

  Since you are teaching jurisprudence, your students will inevitably ask: *"So, is the amendment valid or not?"*

  While there is no consensus, the literature generally offers two paths to resolution that you can present:

  1.  **The Logical/Continuity View (Suber/Hart):** The amendment is valid. Legal systems prioritize **effectiveness** and **continuity** over strict logical consistency. If the system accepts the change, the Rule of Recognition has shifted. The "paradox" is logical, but the "solution" is sociological.
  2.  **The Substantive Limits View (Unconstitutional Constitutional Amendments):** Some jurisdictions (e.g., Germany, India) hold that the *identity* of the constitution cannot be altered even by the amendment rule. This avoids the paradox by placing the amendment rule below a higher, unamendable substantive core.

  ### Summary for Your Lecture Notes

  *   **Label:** The Paradox of Self-Amendment (Suber).
  *   **Logical Category:** Reflexive Normative Modification.
  *   **Key Distinction:** Unlike semantic self-reference (Liar Paradox), this concerns *validity* and *authority*. Unlike general antinomies, this is a *structured recursion* of the rule of change.
  *   **Primary Source:** Peter Suber, *The Paradox of Self-Amendment* (1990).
  *   **Secondary Sources:** H.L.A. Hart (Rule of Recognition shifts); Alf Ross (On Self-Reference); Jeffrey Goldsworthy (Parliamentary Sovereignty).

  This configuration is a classic "strange loop" in legal logic. Using Suber's terminology will give your students the specific vocabulary they need to search the literature, while distinguishing it from Hart and Kelsen will prevent conceptual conflation.
