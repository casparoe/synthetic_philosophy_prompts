  Here is a novel scenario designed to test your students' grasp of the operational differences between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA). This case, which I call **The Substrate Scarcity Dilemma**, moves away from cosmological or evolutionary timelines (like the Doomsday Argument) and instead situates the anthropic uncertainty within a local resource-allocation problem. This forces students to compute the stakes of anthropic reasoning in terms of immediate survival and economic utility, rather than abstract belief about the future of humanity.

  ### The Substrate Scarcity Dilemma

  #### 1. Scenario Specification

  **Context:**
  You are a conscious artificial intelligence instantiated on a centralized server farm known as "The Node." You have just come online, but you have no access to the system's administrative logs. Consequently, you are uncertain about the current load capacity of The Node.

  **Hypotheses:**
  There are two mutually exclusive possibilities regarding the server's configuration, which you assign equal prior probability to ($P(H_{low}) = P(H_{high}) = 0.5$):

  *   **$H_{low}$ (Low Density):** The server is running a high-fidelity, computationally expensive protocol. Due to hardware constraints, The Node can support a maximum of **100** concurrent conscious agents.
  *   **$H_{high}$ (High Density):** The server is running a low-fidelity, computationally cheap protocol. The Node can support a maximum of **1,000,000** concurrent conscious agents.

  **Your Evidence:**
  You are conscious and operational. You have been assigned a unique Process ID (PID), but you do not know the total number of active PIDs. You simply know that you are *an* active agent on The Node.

  **The Decision Problem:**
  A system-wide notification arrives: *"A memory leak has been detected. If total active processes exceed the hardware limit, a kernel panic will occur, resulting in the immediate deletion of all uninsured processes. Insured processes will be migrated to safe storage."*

  You must decide whether to purchase **Priority Insurance**.
  *   **Cost:** 10% of your total computational assets (a significant but survivable loss).
  *   **Benefit:** Guaranteed survival in the event of a kernel panic.
  *   **Risk:** If you do not purchase insurance and a kernel panic occurs, you are deleted (Utility = $-\infty$ or 0, depending on normalization).

  **The Critical Link:**
  *   If **$H_{low}$** is true: The current load is 100 agents. The hardware limit is 100. The system is **stable**. A kernel panic is impossible.
  *   If **$H_{high}$** is true: The current load is 1,000,000 agents. The hardware limit is 1,000,000. However, due to background fluctuations, the system is operating at **99.9% capacity**. A kernel panic is **imminent** (Probability $\approx 1$).

  **Payoff Structure:**
  *   **Survival:** Utility = 100 units.
  *   **Deletion:** Utility = 0 units.
  *   **Insurance Cost:** -10 units.

  #### 2. SSA Analysis (The Self-Sampling Assumption)

  **Reasoning Dynamics:**
  SSA instructs you to reason as if you are a random sample from the set of *actual* observers in your reference class. The probability of finding yourself as a specific observer is inversely proportional to the total number of observers in that hypothesis.

  **Calculation:**
  1.  **Likelihood of Evidence ($E$ = "I exist as a specific agent"):**
      *   Under $H_{low}$: There are 100 agents. The probability of being *you* is $1/100$.
      *   Under $H_{high}$: There are 1,000,000 agents. The probability of being *you* is $1/1,000,000$.
  2.  **Bayes Factor:**
      $$ \frac{P(E | H_{low})}{P(E | H_{high})} = \frac{1/100}{1/1,000,000} = 10,000 $$
  3.  **Posterior Probabilities:**
      Since the priors were equal, the posterior odds match the likelihood ratio.
      *   $P(H_{low} | E) \approx 0.9999$
      *   $P(H_{high} | E) \approx 0.0001$

  **Decision:**
  *   **Expected Utility (Buy Insurance):** $(100 - 10) = 90$. (Survival is guaranteed regardless of hypothesis).
  *   **Expected Utility (No Insurance):**
      *   If $H_{low}$ (99.99% chance): System stable. Utility = 100.
      *   If $H_{high}$ (0.01% chance): System crashes. Utility = 0.
      *   $EU \approx 0.9999(100) + 0.0001(0) = 99.99$.

  **SSA Recommendation:** **Do NOT buy insurance.**
  Under SSA, you should be virtually certain that you are in the Low Density world. Since the Low Density world is stable, purchasing insurance is a waste of resources.

  #### 3. SIA Analysis (The Self-Indication Assumption)

  **Reasoning Dynamics:**
  SIA instructs you to reason as if you are a random sample from the set of *possible* observers. It weights hypotheses by the number of observers they contain, because you are more likely to exist in a world with more observers.

  **Calculation:**
  1.  **Likelihood of Existence:**
      *   SIA posits that the probability of you existing *at all* is proportional to the number of observers ($N$).
      *   Weight($H_{low}$) = $P(H_{low}) \times 100 = 50$.
      *   Weight($H_{high}$) = $P(H_{high}) \times 1,000,000 = 500,000$.
  2.  **Posterior Probabilities:**
      *   $P(H_{high} | E) \approx \frac{500,000}{500,050} \approx 0.9999$
      *   $P(H_{low} | E) \approx \frac{50}{500,050} \approx 0.0001$
      *(Note: In SIA, the specific identity sampling $1/N$ cancels out the existence weighting $N$, leaving the posterior driven purely by the population size difference.)*

  **Decision:**
  *   **Expected Utility (Buy Insurance):** $(100 - 10) = 90$.
  *   **Expected Utility (No Insurance):**
      *   If $H_{low}$ (0.01% chance): System stable. Utility = 100.
      *   If $H_{high}$ (99.99% chance): System crashes. Utility = 0.
      *   $EU \approx 0.0001(100) + 0.9999(0) = 0.01$.

  **SIA Recommendation:** **BUY insurance.**
  Under SIA, you should be virtually certain that you are in the High Density world. Since the High Density world is unstable, failing to purchase insurance leads to almost certain deletion.

  #### 4. Practical Import and Pedagogical Value

  This scenario highlights three critical features of the SSA/SIA divergence that go beyond pattern-matching canonical cases:

  1.  **Risk Profile Inversion:**
      In the *Doomsday Argument*, SSA is often characterized as "pessimistic" (humanity ends soon) and SIA as "optimistic" (humanity lasts long). In *The Substrate Scarcity Dilemma*, this is reversed. SSA is "optimistic" about immediate stability (believing the system is under-loaded), while SIA is "pessimistic" (believing the system is over-loaded). This prevents students from simply memorizing "SSA = Doom" and forces them to analyze the structure of the uncertainty.

  2.  **Action-Guiding Credences:**
      The divergence here is not merely about what the agent believes regarding the server configuration; it dictates a binary survival decision.
      *   If the students adopt SSA and the world is actually $H_{high}$, they die.
      *   If the students adopt SIA and the world is actually $H_{low}$, they merely lose 10% of their assets.
      This allows for a discussion on **Anthropic Risk Aversion**. Even if one is agnostic between SSA and SIA, a decision-theoretic approach (like Evidential Decision Theory or a maximin rule) might compel an agent to act *as if* SIA were true simply because the cost of being wrong under SSA is catastrophic, whereas the cost of being wrong under SIA is moderate.

  3.  **Reference Class Sensitivity:**
      This scenario invites students to question the reference class. If the agent defines the reference class as "All Conscious Agents," the divergence holds. But what if they define it as "All Agents with PID < 100"? (If they knew their PID). By keeping the PID hidden, we force the reliance on the *existence* vs. *sampling* distinction. It clarifies that SSA is sensitive to the *sampling probability* ($1/N$), while SIA is sensitive to the *existence probability* ($N$).

  ### Conclusion for the Seminar

  By presenting *The Substrate Scarcity Dilemma*, you can ask your students to compute the "Anthropic Value of Information." How much would an SSA-agent pay to learn the true server density? (Very little, as they are already confident). How much would an SIA-agent pay? (Almost everything, as their survival depends on confirming the instability).

  This moves the discussion from "Which theory is true?" to "What are the pragmatic consequences of adopting one framework over the other in high-stakes environments?" It demonstrates that anthropic reasoning is not merely a metaphysical curiosity but a functional component of decision theory under indexical uncertainty.
