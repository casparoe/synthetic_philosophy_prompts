prompt: |-
  So in my philosophy of mind class we've been doing epiphenomenalism and my friend who took the course last year tried to explain it to me. He basically said: "Epiphenomenalism is the view that consciousness is like the steam from a train whistle — it's a byproduct of brain activity with no causal power of its own. But this leads to a paradox: if your conscious experiences don't cause anything, then your belief that you're having an experience isn't caused by the experience itself. It's caused by unconscious brain processes. So you can never know whether you're actually conscious — your judgments about your own mind are completely unreliable, and the epiphenomenalist can't even coherently state their own view since the act of arguing for it would require consciousness to have causal effects on reasoning. So the view is self-refuting."

  I feel like he's got the gist of it but also that something's being oversimplified — especially the part about the view being self-refuting and the thing about not knowing you're conscious. Can you go through this and tell me what's accurate, what's subtly off, and what a defender of epiphenomenalism would actually say about the paradox of phenomenal judgment?
