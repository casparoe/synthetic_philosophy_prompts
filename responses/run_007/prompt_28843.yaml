      *   *Case 8 (Masochistic):* Not Bad (or not bad in the way that matters). (Key insight: Desire/Context can invert or neutralize valence).

  3.  **Evaluate Candidate Principles:**

      *   *Candidate A: Pure Hedonism (Badness = Unpleasant Phenomenology).*
          *   Fits: 1, 3, 5, 6 (no experience = no bad).
