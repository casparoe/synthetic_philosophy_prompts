          *   *Problem:* Case 8 is the sticking point. Does masochistic pain *feel* unpleasant? The user says "the sensation isn't different" but "experienced as pleasurable." This suggests the *affective* tone has flipped. If the affective tone flips, Hedonism works. If the sensation is the same but the *attitude* changes, Hedonism struggles.

