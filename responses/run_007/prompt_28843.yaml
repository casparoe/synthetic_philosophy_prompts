          *   Chronic Adaptation (7): Similar to marathon. The *suffering* (affective load) decreases, even if sensation remains. So it becomes *less* bad intrinsically.

  5.  **Addressing the "Revision" Requirement:**
      *   The user needs to know which verdicts might be wrong under a strict interpretation of the principle.
      *   *Case 8 (Masochism):* If the sensation *hurts* (has negative valence) but is desired, the principle says it is *intrinsically bad*. The user's verdict ("Not bad") needs nuance. It is *all-things-considered* good, but the pain component itself remains a negative value being traded for a positive.
