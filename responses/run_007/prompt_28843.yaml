  4.  **Developing the Best Principle:**
      *   The most robust philosophical account that aligns with the user's intuitions (especially Case 2 vs. Case 1) is the **Affective-Motivational Account of Pain's Badness**.
      *   *Core Thesis:* Pain is bad for a subject in virtue of its *unpleasantness* (its phenomenal aversiveness), not its sensory quality or its correlation with tissue damage. Unpleasantness is constituted by a negative affective tone that motivates avoidance.
