prompt: |-
  I'm part of a political philosophy reading group that's been going through the "equality of what?" literature — Dworkin, Sen, Nussbaum, Arneson, G.A. Cohen, the whole gang. We've got two members who've been at it for months: one's a committed resourcist in the Dworkinian vein (thinks egalitarian justice is about equalizing the bundle of resources people have, with an envy test and hypothetical insurance markets doing the work), and the other's a capabilities theorist (thinks resources are just means, and what matters is what people can actually do and be — their real freedoms). They've finally agreed to try an adversarial collaboration instead of just arguing past each other every week.

  I want you to draft the document they'd produce. It should have:

  (1) A numbered list of claims both can sign — not just platitudes like "inequality matters," but substantive claims about the structure of the problem, the inadequacy of simple GDP metrics, the fact that both resources and capabilities are relevant at some level, and anything else their traditions genuinely share.

  (2) A disagreements table. Each row should state a single point of disagreement, with the resourcist's position and the capabilities theorist's position each phrased in wording their own camp would accept. No strawmanning. If there are disagreements that turn out to be merely verbal once you get the phrasings right, flag those and explain why.

  (3) The cruxes: the sub-questions such that if you settled them, at least one side would have to budge. For each crux, describe a concrete case or kind of evidence both would agree bears on it, and record what each predicts. (I suspect one crux is about whether the envy test actually captures what matters about disadvantage — the capabilities person thinks you can envy-free allocate resources and still have someone who can't participate in social life — and another is about whether capabilities can be measured or operationalized without smuggling in resource metrics through the back door.)

  (4) Finally, if there's anything both agree would actually change someone's mind — a real empirical finding, a conceptual argument — note it. If they conclude that some part of their dispute is unlikely to be resolved by anything short of a clash of fundamental intuitions, say that too.

  Make it feel like a document both could actually sign — not a compromise that papers over differences, but a clear map of where they agree, where they don't, and what it would take to move forward.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A political philosophy reading group discussing "equality of what?" (Dworkin, Sen, Nussbaum, Arneson, Cohen, etc.).
      *   **Participants:** Two specific members: a Dworkinian Resourcist vs. a Capabilities Theorist (Sen/Nussbaum).
      *   **Task:** Draft an "Adversarial Collaboration Document."
      *   **Requirements:**
          1.  Numbered list of shared substantive claims (no platitudes).
          2.  Disagreements table (Resourcist view vs. Capabilities view, no strawmanning, flag verbal disputes).
          3.  The Cruxes (sub-questions, concrete cases/evidence, predictions).
          4.  Mind-Changing Conditions (what evidence/arguments would shift views, or acknowledgment of fundamental intuition clashes).
      *   **Tone:** Professional, philosophical, precise, collaborative but honest about differences. Not a compromise, but a map.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Dworkinian Resourcism:** Focus on *resources* (external and personal). Key mechanism: *Envy Test* (no one prefers another's bundle) and *Hypothetical Insurance Market* (compensation for bad brute luck based on what people would insure against behind a veil of ignorance). Goal: Ambition-sensitivity, endowment-insensitivity.
      *   **Capabilities Approach (CA):** Focus on *functionings* (doings/beings) and *capabilities* (substantive freedoms to achieve functionings). Resources are merely means. Conversion factors (personal, social, environmental) matter. Key concern: Human dignity, pluralism of values, real freedom.
      *   **Shared Ground:** Both are "luck egalitarian" adjacent (though Sen is critical of strict luck egalitarianism, there's overlap on brute luck). Both reject welfarism (utility/happiness) as the metric of justice. Both care about agency and responsibility to some degree. Both reject GDP/income as sufficient metrics.

  3.  **Drafting Section 1: Shared Substantive Claims:**
      *   Need to avoid "inequality is bad."
      *   Need specific structural agreements.
      *   *Idea 1:* Rejection of welfarism. Both think utility isn't the metric.
      *   *Idea 2:* Responsibility matters. Both distinguish between choice and circumstance (though they draw the line differently).
      *   *Idea 3:* Resources aren't self-interpreting. Both acknowledge conversion factors exist, even if they weigh them differently.
      *   *Idea 4:* Public reasoning. Both value democratic scrutiny of metrics.
      *   *Idea 5:* GDP is insufficient.
      *   *Refinement:* Make sure the Dworkinian can sign off on conversion factors (Dworkin acknowledges handicaps require compensation) and the CA theorist can sign off on resources (they are instrumentally crucial).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Point 1: The Metric of Justice.* Resources vs. Capabilities.
      *   *Point 2: The Role of the Envy Test.* Is it sufficient? Resourcist: Yes (with insurance). CA: No (different conversion rates).
      *   *Point 3: Compensation for Internal Endowments.* Resourcist: Via hypothetical insurance (monetized). CA: Via direct capability enhancement (often in-kind or structural).
      *   *Point 4: Paternalism/Perfectionism.* Resourcist: Neutral about ends (ambition-sensitive). CA: Some functionings are constitutive of dignity (Nussbaum's list).
      *   *Verbal Dispute Check:* Is "resource" defined differently? Dworkin includes "personal resources" (talents). CA focuses on "conversion." Need to clarify if the dispute is about *what* we equalize or *how* we measure the compensation.
      *   *Refinement:* Ensure the language is charitable. Instead of "Resourcist ignores disability," say "Resourcist addresses disability via resource compensation."

  5.  **Drafting Section 3: The Cruxes:**
      *   Need concrete cases where predictions diverge.
      *   *Crux 1: The Wheelchair Case.* Equal income vs. ramp access. Resourcist says give money (let them buy access). CA says money isn't enough if society is ableist.
      *   *Crux 2: The Expensive Tastes Case.* Dworkin's classic: someone needs champagne to be happy. Resourcist: No compensation. CA: Nuanced. If it's a genuine need for social participation, maybe yes? Actually, better Crux: *Adaptive Preferences.* A deprived person claims they are happy. Resourcist: They have resources, so they're fine. CA: They lack capabilities, even if satisfied.
      *   *Crux 3: Measurement/Operationalization.* Can we measure capabilities without reducing them to resources?
      *   *Predictions:* What would each expect to see in a pilot policy?
      *   *Refinement:* Focus on the *Envy Test* vs. *Conversion Factors*. If Person A and Person B have equal resources, but A cannot convert them into mobility due to disability, does A envy B? Dworkin says the insurance scheme handles this *ex ante*. CA says *ex post* capability failure is the injustice.

  6.  **Drafting Section 4: Mind-Changing Conditions:**
      *   What would shift the Resourcist? Evidence that hypothetical insurance markets yield counter-intuitive results (e.g., leaving the severely disabled with nothing because no one would insure against that odds).
      *   What would shift the CA theorist? Evidence that capability metrics are too indeterminate for policy, leading to arbitrary paternalism, whereas resource metrics successfully track disadvantage in practice.
      *   *Fundamental Clash:* Acknowledge that the definition of "advantage" might be axiomatic.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Too dry? Needs to feel like a working document. Use headers, clear formatting.
      *   *Accuracy Check:* Does this represent Dworkin fairly? (Yes, focus on ambition/endowment distinction). Does it represent Sen/Nussbaum fairly? (Yes, focus on freedom/functionings).
      *   *Constraint Check:* Did I include all 4 required sections? Yes.
      *   *Self-Correction during drafting:* I initially thought about bringing in Arneson (welfare opportunism), but the prompt specifies Dworkin vs. Sen/Nussbaum. Keep it focused. Ensure the "verbal dispute" section is genuine. Often the dispute is about whether "resources" *includes* the power to convert them. Dworkin says we compensate for lack of power via insurance. CA says that's indirect and flawed. That's a substantive disagreement, not just verbal. I need to find a *real* verbal one. Maybe the definition of "freedom"? Negative vs. Positive? No, that's Berlin. Maybe "well-being"? Both reject hedonic well-being. Let's look at "Advantage." Resourcist: Advantage = Command over goods. CA: Advantage = Power to function. This is substantive. Is there a verbal one? Perhaps regarding "Responsibility." Dworkin is strict on option luck. Sen is wary of blaming the victim. But they might agree on the *principle* of responsibility, disagreeing on *application*. I will flag the "Responsibility" row as having a verbal component regarding what counts as a "choice."

  8.  **Final Polish:** Check the formatting to match the prompt's request for a "document they'd produce." Add a title, date, and signatories.

  *(Self-Correction on Crux 1)*: The wheelchair case is classic. Dworkin handles this via the insurance market. The CA theorist says the insurance market might under-insure the severely disabled. The crux is: *Would a hypothetical insurance market provide sufficient coverage for severe congenital disabilities?*
  *(Self-Correction on Crux 2)*: Adaptive preferences. Resourcist says if they have resources, they are responsible for their preferences. CA says preferences adapt to oppression, so we must look at capabilities. Crux: *Do self-reported satisfaction metrics track justice?*

  Let's assemble the document.

  9.  **Final Review against constraints:**
      *   (1) Numbered list of claims? Yes.
      *   (2) Disagreements table? Yes.
      *   (3) Cruxes with concrete cases? Yes.
      *   (4) Mind-changing conditions? Yes.
      *   Tone? Collaborative but rigorous.

