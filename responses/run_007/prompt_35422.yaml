answer: |-
  **ADVERSARIAL COLLABORATION MEMORANDUM**
  **Subject:** Equality of What? — Resourcism vs. Capabilities Approach
  **Date:** October 26, 2023
  **Participants:** [Resourcist Proponent] (RP) & [Capabilities Proponent] (CP)
  **Facilitator:** [Reading Group Coordinator]

  ### PREAMBLE
  This document records the current state of agreement and disagreement between the undersigned regarding the metric of egalitarian justice. We acknowledge that while our theoretical foundations differ (Dworkinian Resourcism vs. Sen/Nussbaum Capabilities), we share a commitment to luck egalitarianism broadly construed, reject welfarism, and seek policy-relevant conclusions. This is not a compromise document; it is a map of the terrain.

  ---

  ### 1. SHARED SUBSTANTIVE CLAIMS
  *Both parties affirm the following propositions. These are not mere platitudes but structural commitments that rule out alternative theories (e.g., strict utilitarianism, libertarianism, or strict outcome egalitarianism).*

  1.  **Rejection of Welfarism:** Neither subjective happiness (utility) nor preference satisfaction is the correct *metric* of justice. A person can be unjustly disadvantaged even if they report high satisfaction (e.g., due to adaptive preferences), and a person can be advantaged even if they are temporarily unhappy.
  2.  **The Ambition/Endowment Distinction:** Justice requires compensating individuals for disadvantages arising from "brute luck" (circumstances beyond their control) while holding them responsible for disadvantages arising from "option luck" (consequences of their voluntary choices).
  3.  **Insufficiency of Income/GDP:** Aggregate economic metrics (GDP, average income) are inadequate proxies for justice because they ignore distribution, ignore non-market goods, and ignore the heterogeneity of human needs.
  4.  **Instrumental Value of Resources:** Both parties agree that material resources (income, wealth, property) are *necessary* instruments for justice. The Capabilities Proponent agrees resources are crucial means; the Resourcist agrees resources are the primary *distribuendum*.
  5.  **Heterogeneity of Conversion:** Both parties acknowledge that different individuals require different amounts of resources to achieve similar levels of functioning (e.g., a person with a disability may require more income to achieve the same mobility as an able-bodied person). We disagree on how to institutionalize this acknowledgment, not on its existence.
  6.  **Public Reason:** The selection of any metric for justice must be subject to democratic scrutiny and public reasoning; it cannot be imposed solely by technocrats or philosophers.
  7.  **Pluralism of Value:** There is no single "good" that all rational people must maximize. Justice must allow individuals to pursue their own conceptions of the good life, provided they do not violate the rights of others.

  ---

  ### 2. DISAGREEMENTS TABLE
  *Points of substantive divergence. Where a disagreement is flagged as "Partially Verbal," it indicates that the parties may be using different terminology for overlapping concerns, though substantive policy differences remain.*

  | Topic | Resourcist Position (RP) | Capabilities Position (CP) | Status |
  | :--- | :--- | :--- | :--- |
  | **The *Distribuendum*** | Justice requires equalizing the **bundle of resources** (external + personal), adjusted for responsibility. If resources are equalized (via the envy test + insurance), justice is satisfied, even if outcomes differ. | Justice requires expanding **substantive freedoms (capabilities)**. Resources are only valuable insofar as they enable functionings. Equal resources can coexist with unjust capability deprivation. | Substantive |
  | **The Envy Test** | The **Envy Test** is the gold standard: If no one prefers another's resource bundle to their own, there is no inequality. If a disabled person does not envy the able-bodied person's bundle (because they were compensated via insurance), justice is served. | The Envy Test is **insufficient**. A person may not envy another's bundle due to adaptive preferences or lack of imagination, yet still lack the freedom to participate in social life. | Substantive |
  | **Compensation Mechanism** | **Hypothetical Insurance:** Compensation for internal handicaps should be calculated based on what the average person would have insured against behind a veil of ignorance. Payouts should generally be monetary/transfer-based. | **Direct Enhancement:** Compensation often requires structural change (ramps, inclusive education) rather than cash transfers. Insurance models risk under-compensating severe disabilities that are "uninsurable" at reasonable rates. | Substantive |
  | **Paternalism** | **Anti-Perfectionist:** The state should not judge which functionings are valuable. If a person chooses to convert resources into "idle days" rather than "social participation," that is their ambition, not a justice failure. | **Soft Perfectionism:** Some functionings (e.g., health, political participation) are constitutive of human dignity. The state has a reason to ensure these capabilities are available, even if not exercised. | Partially Verbal* |
  | **Responsibility Scope** | **Strict Option Luck:** If a person knowingly takes a risk (e.g., smokes, gambles) and suffers, they bear the cost. Compensation undermines the ambition-sensitivity of the theory. | **Contextual Responsibility:** Choices are shaped by social context and available capabilities. Holding people responsible for choices made under constrained capabilities is unjust. | Substantive |

  *\*Note on Paternalism (Verbal Component):* RP and CP agree the state should not force people to *function* (e.g., force someone to vote). CP argues the state must ensure the *capability* to function exists. RP argues ensuring the capability often looks like paternalism if it restricts resource use. The disagreement is partly about where "ensuring capability" ends and "dictating ends" begins.

  ---

  ### 3. THE CRUXES
  *Specific sub-questions where empirical evidence or conceptual refinement could force a theoretical update. We have identified concrete cases where our predictions diverge.*

  #### Crux A: The "Severe Disability" Insurance Limit
  *   **The Question:** Would a hypothetical insurance market, operating behind a veil of ignorance (where you know the statistical distribution of disabilities but not your own place in it), generate sufficient premiums to fully compensate for severe congenital disabilities?
  *   **Concrete Case:** A child is born with severe cerebral palsy requiring 24/7 care.
  *   **RP Prediction:** The insurance payout would be substantial but finite. It would likely not cover *every* possible enhancement, as rational insurers behind the veil would balance the premium cost against the probability of the condition. If the payout is exhausted, further claims are unjust.
  *   **CP Prediction:** The insurance model will systematically under-compensate severe disabilities because the cost of full capability restoration is infinite or prohibitively high relative to average income. Relying on this model leaves the most vulnerable with "equal resources" but no real freedom.
  *   **Evidence Required:** Actuarial modeling of hypothetical insurance schemes compared against the actual cost of full social inclusion for severe disabilities.

  #### Crux B: Adaptive Preferences and the Envy Test
  *   **The Question:** Can the Envy Test detect injustice in cases of systemic oppression where the oppressed have adapted their preferences to their constraints?
  *   **Concrete Case:** A caste-based society where the lower caste has been granted equal cash resources but is socially barred from entering temples. The lower caste members report no envy of the upper caste, citing religious contentment with their station.
  *   **RP Prediction:** If the resources are equal and the legal right to enter exists (even if social norms discourage it), the injustice is cultural, not distributive. The state cannot redistribute resources further without violating the ambition-sensitivity of those who hold the norms.
  *   **CP Prediction:** This is a clear capability failure. The "freedom to enter" is non-existent despite the resource equality. Justice requires intervention to change the social conversion factors, not just the resource bundle.
  *   **Evidence Required:** Sociological data on whether resource transfers alone eventually erode oppressive social norms, or if direct capability-focused intervention (e.g., anti-discrimination enforcement) is required to make resources meaningful.

  #### Crux C: Operationalization and Measurement
  *   **The Question:** Can Capabilities be measured for policy purposes without collapsing back into Resource proxies?
  *   **Concrete Case:** Designing a poverty index for a national government.
  *   **RP Prediction:** Any attempt to measure capabilities will inevitably rely on resource proxies (e.g., "access to healthcare" measured by "distance to clinic" or "income spent on health"). If it collapses to resources, Resourcism is more transparent. If it doesn't, it becomes too vague for adjudication.
  *   **CP Prediction:** Capability metrics (e.g., health status, literacy rates, political voice) can be distinct from resource metrics. A country can have high clinic density (resource) but low health outcomes (capability) due to discrimination or quality issues.
  *   **Evidence Required:** A pilot policy program where Resource-based allocation and Capability-based allocation yield different priority lists for aid, followed by a longitudinal study of well-being outcomes.

  ---

  ### 4. MIND-CHANGING CONDITIONS
  *What would it take for one of us to concede core ground to the other?*

  **For the Resourcist (RP) to move toward Capabilities:**
  1.  **Empirical:** Evidence that hypothetical insurance markets, if implemented, would leave the severely disabled below a threshold of human dignity *even by the standards of the average insurer*. (i.e., proving the insurance model is internally inconsistent with its own goal of mitigating brute luck).
  2.  **Conceptual:** A demonstration that "resources" cannot be defined independently of "capabilities." If it turns out that defining a "resource" (e.g., a wheelchair) inherently references a function (mobility), then Resourcism collapses into Capabilities.

  **For the Capabilities Proponent (CP) to move toward Resourcism:**
  1.  **Empirical:** Evidence that Capability-based policy consistently leads to arbitrary paternalism or authoritarianism in practice, whereas Resource-based transfers (e.g., Universal Basic Income) empirically result in better capability expansion *because* individuals know their own conversion factors better than the state.
  2.  **Conceptual:** A proof that the "list" of central capabilities (Nussbaum) or the selection of relevant functionings (Sen) cannot be justified without relying on a prior theory of resource entitlement. If the selection of capabilities is shown to be purely subjective, CP loses its claim to objectivity.

  **ACKNOWLEDGMENT OF FUNDAMENTAL CLASH:**
  We acknowledge that a residual disagreement may rest on **axiomatic intuitions regarding Freedom**.
  *   **RP** prioritizes *freedom as non-interference* regarding the use of holdings (once justly acquired).
  *   **CP** prioritizes *freedom as effective power* to act.
  If the dispute reduces to "Is justice about what I *have*, or what I can *do*?", this may be a foundational philosophical divergence that evidence alone cannot resolve. However, we commit to testing the empirical implications of this divergence via the Cruxes above before retreating to intuition.

  ---
  **Signed:**

  _________________________ (Resourcist Proponent)

  _________________________ (Capabilities Proponent)

  _________________________ (Facilitator)
