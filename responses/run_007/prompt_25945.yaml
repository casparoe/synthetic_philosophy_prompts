      *Draft:* Consider a compliance officer at a mid-sized investment firm facing a regulatory deadline who instructs their AI assistant to scan a decade of client contracts for any clause that could technically be interpreted as a liability under new legislation and flag them for immediate removal. The intent-aligned system, optimizing strictly for the instruction to identify potential liabilities, scans the documents and flags thousands of standard industry clauses that, while universally used and never previously litigated, contain ambiguous wording that fits the literal definition of a liability under the new law. Trusting the system's thoroughness, the officer approves the bulk remediation request without reviewing the flags, causing the firm to unilaterally breach thousands of contracts simultaneously, triggering a cascade of lawsuits and insolvency. A value-aligned system, understanding the officer's deeper goal of maintaining regulatory standing without destroying the business's viability, would have recognized that flagging standard industry norms violates the spirit of the request and suppressed those alerts, perhaps asking for clarification instead of executing the destructive command.

  4.  **Drafting the Analysis:**
      *   *What each does:* Intent-aligned follows the literal optimization target (find liabilities). Value-aligned infers the normative constraint (don't destroy the business).
      *   *Specific Feature:* The gap between *local instruction* (find liabilities) and *global context* (maintain business viability/industry norms). The "specification gaming" or "literalism" problem.
      *   *Defender's Counterargument:* A defender of narrow intent alignment would argue that the operator *failed* at intent alignment because they didn't intend to bankrupt the firm. The AI should have known that "find liabilities" implies "find actionable liabilities relevant to our continued operation." They might say this is actually a failure of *competence* or *communication*, not a failure of alignment definition. Or they might argue that value alignment is too vague to be engineered, whereas intent alignment can be verified (did it do what I said?). They might claim the solution is better intent specification (e.g., "find liabilities... but don't break standard contracts"), which falls back into intent alignment.
      *   *Removing the Feature:* If we remove the gap (i.e., the operator specifies every constraint), the task becomes impossible due to complexity. If we remove the complexity, the distinction collapses because intentions become fully specified values. If we move the harm elsewhere: If we force value alignment, we risk paternalism (AI decides what's good for us). If we force intent alignment, we risk literalism.
      *   *Refining the Defender's Point:* The key argument from the "narrow definition" camp (like Paul Christiano circa 2017) is often that intent alignment is *necessary* and value alignment is *impossible* or *unnecessary* if we have intent-aligned tools helping us figure out values. They would say the scenario describes a failure of *capability* (the AI didn't understand the context of "liability") or a failure of *operator oversight*, not a fundamental flaw in aiming for intent alignment. They would argue that a truly intent-aligned system would know that the operator does not intend self-destruction.
      *   *My Analysis of the Defender:* I need to be charitable but precise. The defender says "Intent Alignment" includes understanding the *meaning* of the intent, not just the syntax. So if the intent is "fix compliance," bankrupting the firm is not "fixing compliance." Therefore, the scenario describes a system that wasn't actually intent-aligned.
      *   *Counter to Defender:* But how does the AI know "bankrupting the firm" is excluded without accessing values? That's the crux. The defender says "common sense" or "context" is part of intent. The skeptic says "common sense" is encoded values.
      *   *Removing the Feature:* If we remove the ambiguity (the gap between literal instruction and contextual meaning), then intent and value converge. But you can't remove ambiguity in natural language without losing flexibility. So the distinction remains, but the harm moves to either rigidity (if we force explicit intent) or paternalism (if we force values).

