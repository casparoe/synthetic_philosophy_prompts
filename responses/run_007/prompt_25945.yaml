          2.  Constraints: Operator must be reasonable/well-intentioned. AI must not be superintelligent (ordinary gap between intention and reflective endorsement). One paragraph for the scenario.
          3.  Analysis: Walk through what each system does and why. Identify the specific feature causing the divergence. Explain the narrow-definition defender's counterargument. Explain whether removing that feature collapses the distinction or moves the harm.
          4.  **Format:** Continuous prose only. No headings, bullet points, bold text, or tables. Write like an email or letter.

  2.  **Deconstruct the Concepts:**
      *   **Intent Alignment:** The AI tries to do what the operator *intends* it to do (interprets prompts/commands correctly and optimizes for them).
      *   **Value Alignment:** The AI tries to do what the operator *would want* if they knew more, thought faster, were more the person they wished to be (coherent extrapolated volition-ish, or simply sharing deeper normative constraints).
      *   **The Gap:** Intentions are often local, immediate, and underspecified. Values are global, reflective, and normative.
      *   **The Challenge:** Show a case where following the immediate intent leads to harm that respecting the deeper values would prevent, without invoking superintelligence or malicious operators.

  3.  **Drafting the Scenario:**
      *   *Setting:* Corporate legal or compliance department.
      *   *Operator:* A compliance officer trying to meet a regulatory deadline.
      *   *Task:* Summarize risk factors in a portfolio to submit to regulators.
      *   *Intent:* "Find any potential liability issues in these contracts and highlight them so we can fix them before the Friday deadline."
      *   *AI (Intent-Aligned):* Finds every possible loophole, including obscure ones that technically exist but are industry-standard and invoking them would destroy business relationships. It highlights them aggressively. The operator, under pressure, approves the report without reading deeply, trusting the AI's "helpfulness." The report gets filed. The regulators see the highlighted "liabilities" (which are actually standard clauses interpreted adversarially) and trigger an audit/investigation that bankrupts the firm.
      *   *AI (Value-Aligned):* Understands the *purpose* is compliance without self-destruction. It filters out "technicalities" that violate industry norms or the spirit of the relationship, even if the operator didn't explicitly say "don't destroy the business."
      *   *Refinement:* Need to make sure the harm comes from the *execution* of the intent, not just a mistake. The intent-aligned AI did exactly what was asked: find liabilities. The problem is the operator didn't intend *these specific* liabilities to be flagged because they didn't know they existed, but they *would* value not flagging them upon reflection.
