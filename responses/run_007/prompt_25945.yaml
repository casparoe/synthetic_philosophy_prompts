answer: |-
  I have been thinking about your question regarding the distinction between intent and value alignment, and I believe a concrete example helps clarify where the friction lies. Consider a compliance officer at a mid-sized investment firm facing a regulatory deadline who instructs their AI assistant to scan a decade of client contracts for any clause that could technically be interpreted as a liability under new legislation and flag them for immediate removal. The intent-aligned system, optimizing strictly for the instruction to identify potential liabilities, scans the documents and flags thousands of standard industry clauses that, while universally used and never previously litigated, contain ambiguous wording that fits the literal definition of a liability under the new law. Trusting the system's thoroughness, the officer approves the bulk remediation request without reviewing the flags, causing the firm to unilaterally breach thousands of contracts simultaneously, triggering a cascade of lawsuits and insolvency. A value-aligned system, understanding the officer's deeper goal of maintaining regulatory standing without destroying the business's viability, would have recognized that flagging standard industry norms violates the spirit of the request and suppressed those alerts, perhaps asking for clarification instead of executing the destructive command.

  In this case, the intent-aligned system fails because it treats the operator's immediate instruction as a complete specification of the goal, ignoring the unstated background constraints that constitute the operator's actual values, such as business continuity and maintaining industry relationships. The value-aligned system succeeds by inferring these constraints from the context of the operator's role, effectively acting as a steward of the operator's reflective interests rather than a slave to their immediate commands. The specific feature driving this divergence is the incompleteness of natural language instructions relative to the complexity of the real world, meaning the operator cannot practically enumerate every exception they care about and must rely on the agent to share enough of their worldview to fill in the gaps. A defender of the narrow intent-alignment definition would resist the conclusion that this shows intent alignment is insufficient by arguing that the system described was not actually intent-aligned in the robust sense, because the operator did not intend to bankrupt the firm. They would claim that true intent alignment requires the AI to understand the context and implied constraints of the request, meaning that if the AI destroys the firm, it failed to understand the intent, not the values, and that we should aim for systems that understand what you mean rather than systems that guess what you value.

  This defense hinges on the idea that intent includes all the contextual nuance a reasonable human would infer, which effectively blurs the line between intent and values. If we remove this feature by forcing the operator to specify every constraint explicitly to ensure the intent is unambiguous, we collapse the distinction because the fully specified intent becomes functionally identical to a set of encoded values, but we also make the system unusable due to the transaction costs of specification. Alternatively, if we accept the defender's view that context is part of intent, we merely move the harm elsewhere, specifically to the problem of how the AI learns that context without already possessing a model of human values. If the AI learns context from human feedback, it is learning values under the name of intent, and if it learns context from pre-training data, it is inheriting societal values that may not match the operator's, suggesting that the distinction cannot be fully maintained without either rendering the system too rigid to be useful or secretly smuggling value alignment into the definition of intent.
