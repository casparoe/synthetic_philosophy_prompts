      *(Self-Correction during drafting)*: I should be careful not to dismiss Expected Utility as just a "math trick." It *is* the standard rational choice model. I need to explain why it *feels* like a trick to the skeptic (because it divorces agency from outcome). I should reference Nefsky specifically on "helping" vs. "making a difference."

      *(Final thought on the "Unsticking")*: The most productive path is usually to move away from *causal efficacy* and toward *complicity*. Even if I didn't cause the death, did I participate in the demand? That shifts the ground from (a)/(b) to (c).

  8.  **Final Structure:**
