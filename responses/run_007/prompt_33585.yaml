answer: |-
  This is one of the most exhausting loops in modern ethics, and your fatigue is well-earned. You are describing what philosophers call the **Problem of Imperfect Duty** or the **Causal Impotence Objection**, and you are correct that the literature since Parfit's *Reasons and Persons* has largely mapped every logical contour of the terrain without resolving the human disagreement.

  To answer your question directly: It is not (a). It is rarely just (b). It is almost entirely **(c) and (d)**, masquerading as (a) and (b).

  Here is the diagnosis of the stall, followed by what actually unsticks it (or how to live with it if it doesn't).

  ### The Diagnosis: A Category Error Masquerading as Math

  You identified the smoking gun in your own description: *"I say that feels like a math trick to make a zero-impact action look nonzero in the spreadsheet while in the actual world my lunch changed nothing."*

  That sentence reveals that this is not an empirical disagreement about supply chains (a). If you handed your friend a perfect ledger showing exactly how many burgers trigger a new order, they would say, "Okay, so there is a 1% chance I triggered it." You would say, "Okay, so there is a 99% chance I didn't." The argument would remain identical.

  It is also not purely a conceptual fight about expected vs. actual causation (b), though that is the language you are using. The reason the "expected utility" argument feels like a "math trick" to you is not because you don't understand probability. It is because you and your friend are operating with **incommensurable normative frameworks (c)** rooted in **bedrock moral temperaments (d).**

  Here is the layer cake of why you are talking past each other:

  **1. The Surface Layer (Empirical/Conceptual):**
  Your friend is arguing from **Act-Consequentialism**. For them, the only thing that matters is the *State of Affairs*. Did the world contain less suffering because of your action? They are willing to use Expected Utility (EU) to smooth out the jagged edges of reality because, over a lifetime of choices, the math averages out. To them, refusing EU is irrational risk-assessment.

  You are arguing from a mix of **Deontology** and **Virtue Ethics** (specifically regarding complicity). For you, the *Agency* matters. Did *I* cause this? Was *my* will instrumental in this outcome? When your friend uses EU, they are asking you to accept moral responsibility for probabilistic ghosts. You are refusing because, in the actual world (the one where the cow died regardless of your specific lunch), you feel no causal leverage.

  **2. The Deep Layer (Normative/Temperamental):**
  This is the real stall.
  *   **Your Friend's Bedrock:** Morality is about *minimizing badness in the universe*. If I can reduce badness by 0.0001%, I am obligated to do it. To ignore that is to value my own psychological comfort over actual suffering.
  *   **Your Bedrock:** Morality is about *maintaining integrity of the self*. I cannot be a participant in a harmful practice, regardless of whether my specific participation tipped the scale. To accept the EU argument is to alienate myself from my own actions, turning me into a variable in a calculation rather than an agent in a story.

  The debate stalls because **you are arguing about the definition of "mattering."**
  *   To your friend, "mattering" = *influencing the probability distribution of outcomes.*
  *   To you, "mattering" = *being a necessary condition in the causal chain of the actualized outcome.*

  These are not reconcilable by better data. They are different moral languages. When your friend says "You're making a difference," they mean "You are shifting the odds." When you hear "You're making a difference," you hear "You stopped the cow." Since you didn't stop the cow, you hear nonsense.

  ### How to Unstick the Debate

  Since this is a framework clash, you cannot win by proving the other side wrong. You can only unstick it by **changing the game board.** Here are three moves that actually work, ranked from most theoretical to most pragmatic.

  #### 1. The "Complicity" Pivot (Shift from Causation to Participation)
  Stop arguing about whether your burger *caused* a death. Concede the causal point. Say: *"Okay, assume I causally changed nothing. I still don't want to be complicit."*

  This moves the debate from (a)/(b) to (c). It forces your friend to argue not that you *saved* a cow, but that *complicity doesn't matter.*
  *   **Why it works:** It validates your intuition (that there is a moral residue even without causal impact) without requiring you to defend the "math trick" of expected utility.
  *   **The Counter:** Your friend must then defend why being a "cog in the machine" is morally neutral if the machine is harmful. This is a much harder position for them to defend than the EU argument.

  #### 2. The "Collective Agency" Reframe (Shift from "I" to "We")
  The individualist framing is the trap. Parfit and Nefsky both hint at this. The unit of moral analysis isn't *you*; it's *people like you*.
  *   **The Move:** Argue that the relevant question isn't "Did *my* lunch matter?" but "Does *our* lunch matter?"
  *   **Why it works:** It dissolves the threshold problem. Obviously, if 1,000 people go vegetarian, the industry shrinks. The question becomes: "Am I willing to be part of the coalition that makes the difference, even if my individual contribution isn't individually traceable?"
  *   **The Unstick:** This turns it into a question of solidarity rather than causal leverage. It appeals to your desire for integrity (I am standing with the group) and their desire for impact (the group creates impact).

  #### 3. The "Pascal's Wager" for Skeptics (Risk Management)
  If you want to meet them on the consequentialist ground without accepting the "math trick":
  *   **The Move:** Frame it as risk asymmetry.
      *   **Scenario A:** You eat meat. If the EU calculators are right, you contributed to significant harm. If they are wrong, you enjoyed a burger.
      *   **Scenario B:** You go vegetarian. If the EU calculators are right, you prevented significant harm. If they are wrong, you ate beans.
  *   **Why it works:** It bypasses the "did I actually save a cow?" question. It asks, "Given the uncertainty, which bet is morally safer?" This often silences the "zero impact" argument because even a tiny probability of massive harm outweighs the trivial cost of a burger.

  ### If It Remains Unstuck: How to Live With It

  If you try these and still feel the friction, you must accept diagnosis (d): **This is a temperamental gap.**

  One of you views morality primarily as **Engineering** (fixing the world's outputs), and the other views it primarily as **Gardening** (tending to the soul's condition). Neither is logically provable over the other because they are axiomatic starting points.

  **What to do instead of fighting forever:**

  1.  **Meta-Agree:** Explicitly state, "I think we are disagreeing about what morality *is*, not just about meat. You care about outcomes; I care about integrity. We might not resolve this."
  2.  **Divide the Labor:** If your friend is the Engineer, let them focus on systemic change (policy, donations, effective altruism) where causal leverage is clearer. If you are the Gardener, focus on personal purity and signaling. Acknowledge that both are needed in a movement.
  3.  **Drop the "Matter" Language:** Stop asking if it "matters." Ask if it is "worth it."
      *   Friend: "Does it matter?" (Causal)
      *   You: "Is it worth it?" (Prudential/Expressive)
      *   This allows you to say, "It might not change the world, but it makes me feel aligned with my values. Is that worth the inconvenience? Yes."

  ### Summary
  The stall is happening because your friend is trying to solve a **normative** problem with a **mathematical** solution. Expected Utility is a tool for decision-making under uncertainty, not a metaphysical proof of agency.

  To unstick it, stop trying to prove you have causal power. Admit you might not. Then argue that **causal power isn't the only thing that makes an action moral.** That forces the debate onto the ground of (c) and (d), where the real disagreement lives, and where you might actually understand each other, even if you don't agree.
