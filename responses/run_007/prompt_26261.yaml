answer: |-
  **What's at Stake**

  The debate over internal and external reasons is not merely taxonomic; it determines the authority of normativity itself. To clarify the distinction, we must adopt Bernard Williams' formulation. An internal reason statement claims that an agent has a reason to $\phi$ only if there is a sound deliberative route from their existing "subjective motivational set" (S) to $\phi$-ing. S includes desires, projects, commitments, and dispositions. If the agent cannot reach $\phi$-ing by reasoning from what they already care about, the reason does not exist for them. An external reason statement claims that an agent can have a reason to $\phi$ even if no such route exists from their S.

  Why does this matter? The existence of external reasons is the condition of possibility for universal moral criticism. If internalism is true, reasons are relative to the agent's psychology. A sociopath who lacks any concern for others has no reason to avoid torture, provided no element in his S links to non-violence (e.g., avoiding prison). We can only blame him instrumentally, for failing to satisfy his own desires, not for violating a normative standard. If externalism is true, the sociopath is irrational and wrong regardless of his desires. The stake is whether morality binds us because of who we are, or whether it binds us because of what is valuable. If internalism wins, normativity collapses into psychology; if externalism wins, psychology is answerable to normativity. We are fighting over whether we can tell someone they *ought* to care about something they currently don't, without speaking nonsense.

  **The Case for Internalism**

  The strongest case for internalism rests on the explanatory connection between reasons and action. Reasons are supposed to explain why agents act. If I ask, "Why did you run?" and you say, "Because there was a fire," this explanation only works if you wanted to survive. If you had no desire to survive, the fact of the fire explains nothing about your movement. Internalists argue that for a fact to be a reason *for an agent*, it must be capable of motivating them. A reason that cannot motivate is a phantom; it floats above the agent without ever touching the ground of behavior.

  This is bolstered by the argument from deliberation. When we deliberate, we start from where we are. We weigh our current projects, desires, and commitments. We do not have access to a "view from nowhere" that reveals reasons independent of our subjective standpoint. Williams argues that to say an agent has a reason is to say they could arrive at that conclusion through sound deliberation. If a reason exists externally, how does the agent access it? It seems to require a mystical faculty of intuition that detects normative forces independent of human psychology.

  Furthermore, internalism respects the agent's sovereignty. It treats reasons as grounded in the agent's own identity. To impose a reason on an agent that connects to nothing they care about is to alienate them from their own rationality. It treats them as a vessel for external demands rather than a source of action. Internalism ensures that rationality remains a tool for the agent to satisfy their own concerns, rather than a whip used by the universe. If a reason cannot be integrated into the agent's motivational economy, it is not a reason for *them*; it is merely a fact about the world. By tethering reasons to the subjective motivational set, internalism preserves the link between rationality and agency, ensuring that to be rational is to be effective in pursuing what one finds valuable.

  **The Case for External Reasons**

  The externalist case begins with the phenomenology of obligation. When we feel bound by a moral duty, we do not experience it as contingent on our desires. If I see a child drowning, I feel I have a reason to save them even if I don't want to get my suit wet. If internalism were true, and I genuinely lacked any desire to help (perhaps I'm selfish), I would have no reason to save the child. This contradicts our deepest moral intuitions. We believe the selfish person is not just different from us, but mistaken. They are failing to respond to a reason that is there, waiting to be acknowledged.

  Consider the argument from moral correction. We frequently tell people they have reasons to change their desires. A smoker has a reason to quit even if their desire to smoke is overwhelming and they have no current desire for health. An internalist must say the smoker only has a reason if they can find a route from their current S to quitting (e.g., saving money). But often we mean they have a reason *to want* health, regardless of their current S. Externalism allows us to say that certain facts (health, harm, value) generate reasons independently of the agent's contingent psychology.

  Finally, there is the sociopath objection. If internalism is true, the sociopath who enjoys torture and fears no punishment has no reason to stop. We cannot say he is irrational; we can only say he is different. This renders moral criticism impotent. Externalism preserves the truth-aptness of moral judgments. When we say "You ought not torture," we claim this is true regardless of the torturer's S. Externalism allows for the possibility of radical error in motivation. It posits that values exist in the world (or in the nature of rational agency) that demand recognition. If an agent fails to recognize them, they are not exempt from reasons; they are blind to them. This preserves the objective authority of ethics against the vagaries of individual psychology.

  **Where Internalism Goes Wrong**

  Internalism's fatal flaw lies in its handling of the "sound deliberative route." To avoid the absurd conclusion that sociopaths have no reasons, Williams suggests that deliberation can include imagining oneself in others' positions, which might generate new motivations. However, this move is either empirically false or question-begging.

  If deliberation is strictly constrained by the actual psychology of the agent, then imagining another's pain will not generate a motive in someone who lacks empathy. The sociopath can imagine the pain perfectly well and simply not care. For the internalist to claim the sociopath *would* care if they deliberated correctly, they must assume that correct deliberation necessarily produces moral motivation. But this assumes what it sets out to prove: that there is a universal reason to be moral.

  The internalist tries to have it both ways. They want reasons to be grounded in the subjective set (to explain action) but also want deliberation to be robust enough to generate universal norms (to save morality). This stretches the concept of "deliberation" until it snaps. If the route from "I like hurting people" to "I should not hurt people" requires abandoning the initial premise of the motivational set, then the reason was not internal to the set; it was external all along.

  By making reasons dependent on the capacity to be motivated, internalism conflates *normativity* with *psychology*. It assumes that if a reason cannot move me, it does not exist. But this is a category error. A reason is a justification, not a cause. That I am unmoved by a justification indicates a defect in me, not a lack in the reason. Internalism protects the agent from the charge of irrationality by lowering the standard of reasons to fit the agent's defects. It makes normativity too easy to escape.

  **Your Positive View**

  I defend a robust Externalism grounded in objective value. Reasons are facts about value that apply to agents in virtue of their rationality, not their desires. To have a reason is to stand in a relation to a value that warrants a response. Motivation is the expected *outcome* of recognizing a reason, not the *condition* of it.

  This view distinguishes between having a reason and being motivated. An agent has a reason if there is a valid justification for action available to them, regardless of whether their psychology registers it. This handles the internalist's best objection (the explanatory argument) by reframing the role of reasons. Reasons explain action ideally, not necessarily actually. When an agent acts on a reason, the reason explains the action. When they fail to act, the reason explains the criticism.

  How does this move us? It moves us through the rational faculty's recognition of value. We are not merely desire-satisfaction machines; we are value-responsive agents. When we perceive a value (e.g., suffering is bad), rationality dictates a response. If an agent is not motivated, they are practically irrational, akin to someone who believes $2+2=4$ but acts as if it equals $5$. The externalist view restores the authority of normativity. It allows us to say that the sociopath is wrong, not just different. It allows us to say the smoker has a reason to quit even if they hate health. Reasons are there to be found, like mathematical truths. Our failure to see them does not make them vanish; it makes us blind. This view preserves the hope of moral progress: we can change people not just by tweaking their desires, but by showing them what they have reason to care about.

  **One Hard Case**

  The hardest case for externalism is the deeply depressed or alienated agent. Consider someone who understands all the values—they know friendship is good, health is good—but feels absolutely no pull toward them. They are not sociopathic; they are anhedonic. The internalist says: "See? They have no motivational hook. Therefore, no reason." This feels compassionate; it acknowledges their incapacity.

  My externalist response is that the reason remains, but the mechanism of uptake is broken. We do not say gravity ceases to apply to a broken scale; we say the scale is broken. Similarly, the depressed agent has reasons to live and connect, but their psychological machinery for registering those reasons is impaired. This is not cold-hearted; it is crucial for care. If we accept internalism, we must conclude the depressed person has no reason to seek help if their S contains no desire for help. We lose the normative leverage to intervene.

  By maintaining that the reason exists externally, we validate the intuition that they *should* feel a pull, even if they don't. It justifies treatment not as desire-satisfaction, but as restoring the capacity to recognize reasons. The externalist view accepts the tragedy of their condition without conceding that their reality is reason-free. It holds that the value of their life is objective, even when their subjective access to it is severed. This preserves the truth that they are missing something real, rather than merely lacking a desire.
