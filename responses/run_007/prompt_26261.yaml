          *   Define Externalism: Reasons exist independently of S.
          *   Stake: Moral blame, rational criticism, hope for reform. If internalism is true, the sociopath has no reason to be moral unless he cares. If externalism is true, he's irrational *and* wrong, regardless of care. It's about the authority of normativity.

      *   **The case for internalism (~500 words):**
          *   Focus on the "Explanatory Argument" and "Action Guidance."
          *   Reason must explain action. If a fact doesn't link to motivation, how does it move us?
          *   Williams' deliberation point: Reasons must be discoverable through deliberation from where the agent stands.
          *   The "Queerness" worry (though Mackie-ish, fits here): External reasons seem like magical entities commanding us without leverage.
          *   Focus on the link between *reason* and *rationale*. To have a reason is to have a rationale for acting. If I couldn't care less, it's not *my* reason.

      *   **The case for external reasons (~500 words):**
          *   Phenomenology of Obligation: We experience duties as binding even when we don't want to fulfill them.
          *   The Sociopath/Amoralist: Internalism says the sociopath has no reason not to torture. This seems absurd. It makes morality contingent on desire.
          *   Moral Error/Correction: We often tell people they have reasons to change their desires. "You have a reason to stop smoking" even if they want to smoke. Internalism struggles with reasons to change S itself.
          *   Truth in Moral Judgment: When we say "You ought," we claim truth. Internalism makes this claim relative to S.

      *   **Where internalism goes wrong (~400 words):**
          *   Target the "Sound Deliberative Route."
          *   Internalism tries to save objectivity by expanding "deliberation" to include imagining oneself in others' shoes, etc.
          *   Critique: This is either too weak (if I don't care about others, imagining their pain doesn't generate a motive) or too strong (if imagining pain *necessarily* generates a motive, then human psychology is universally moral, which is false).
          *   The fundamental error: Conflating *motivation* with *normativity*. Just because I'm not motivated doesn't mean there isn't a reason. It means I'm defective. Internalism protects the agent's psychology at the cost of normative authority.

      *   **Your positive view (~400 words):**
          *   Defend Robust Externalism. Reasons are facts about value.
          *   Value is objective (or intersubjectively robust).
          *   Motivation is a separate faculty. Reasons *justify*, desires *move*.
