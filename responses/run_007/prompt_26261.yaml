          *   Externalist response: They still have a reason. The lack of motivation is a symptom of their condition (depression), not a lack of reason. We don't say a broken leg means gravity doesn't apply. We say the mechanism is broken. The reason exists; the uptake is failed. This preserves the normativity needed for care/intervention.

