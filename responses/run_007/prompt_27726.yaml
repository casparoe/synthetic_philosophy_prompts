answer: |-
  You have hit the nail on the head, and your intuition that this is not a biological disagreement but a philosophical one is shared by many philosophers of biology who have dissected this debate over the last two decades.

  If you ask a philosopher of biology like Samir Okasha (author of *Evolution and the Levels of Selection*) or Peter Godfrey-Smith, they will tell you that the stalemate persists because the participants are arguing past each other on three distinct axes: **ontology, explanation, and heuristic utility.**

  Here is a breakdown of what kind of disagreement this actually is, and what (if anything) could move it.

  ### 1. It is a "Causal Granularity" Disagreement
  You noted that the math is the same (the Price Equation partitions variance regardless of how you slice it). This implies empirical equivalence. If the predictions are identical, why the fight?

  It comes down to **causal adequacy**.
  *   **The Gene-Centrist:** Argues that causal fidelity requires tracking the *persistent* entity. DNA is the only thing that persists through the bottleneck of meiosis and development. Organisms are ephemeral; genes are (potentially) immortal. Therefore, the gene is the only *ontologically robust* unit of selection. To them, saying "the group was selected" is a shorthand for "genes that code for group-beneficial behavior increased in frequency."
  *   **The Multilevel Selection (MLS) Proponent:** Argues that causal adequacy requires tracking the *interaction* where fitness differences arise. If a group goes extinct, the genes inside it die regardless of their individual quality. Therefore, the group is a *causal agent* in the evolutionary process. To them, reducing everything to genes is "greedy reductionism" that obscures the actual mechanism of selection (differential survival of collectives).

  **The Verdict:** This is a disagreement about **causal ontology**. Is the "cause" of evolution the thing that replicates (gene) or the thing that interacts with the environment (organism/group)? Both are true, but they prioritize different links in the causal chain.

  ### 2. It is a Disagreement About "Explanatory Virtue"
  Your hunch that this is about "what counts as an explanation" is correct. In philosophy of science, we talk about **explanatory pluralism**.

  *   **Reductionist Explanation:** For Dawkins, an explanation is only complete if it is fundamental. Explaining altruism via "group benefit" is incomplete until you show the gene-frequency math. It's like explaining chemistry via biology; it might work, but it's not the "bottom" truth.
  *   **Emergentist Explanation:** For Wilson or Gould, an explanation is best when it is **perspicuous**. If you want to explain why eusociality evolved in ants, talking about individual gene frequencies is a nightmare of complexity. Talking about colony-level fitness is clear, predictive, and manageable.

  **The Verdict:** This is a pragmatic disagreement. The gene-centrists value **unity** (one theory to rule them all). The MLS people value **tractability** (use the level that makes the problem solvable).

  ### 3. It is a Kuhnian "Paradigm" Clash
  You asked if it's two research programs talking past each other. Yes.
  *   **The Gene-Centric Program:** Generated Kin Selection, Inclusive Fitness Theory, and Parent-Offspring Conflict. It produced massive amounts of empirical work in behavioral ecology.
  *   **The MLS Program:** Generated work on Major Transitions, Cultural Evolution, and Ecosystem Ecology.

  Scientists invest their careers in these frameworks. Admitting the other side is "right" feels like devaluing your own life's work. This is why the debate is so sticky. It's not just about truth; it's about **scientific capital**.

  ### So, what would move it?

  You asked if it would take a new formal result, a conceptual distinction, or retirement. Here is the cold reality:

  **1. A New Formal Result? No.**
  The math is settled. The Price Equation, Game Theory, and Population Genetics all show that you can translate between the "gene eye view" and "multilevel view" mathematically. They are isomorphic. A new equation won't solve a philosophical preference.

  **2. A Conceptual Distinction? Maybe, but it's already here.**
  Philosophers have already offered the "Replicator vs. Interactor" distinction (David Hull) or "Evolver vs. Selector" (Godfrey-Smith). The problem is that biologists often ignore philosophical distinctions if they don't yield immediate empirical fruit.

  **3. Generational Change? Yes.**
  Planck's Principle applies here: "Science advances one funeral at a time." The titans of the debate (Dawkins, Wilson, etc.) have defined the terms of engagement. Younger biologists are increasingly **pluralists**. They use inclusive fitness when studying kin and group selection models when studying microbes or human culture. They don't care about the "true" unit; they care about the **useful model**.

  **4. The Real Mover: Evolutionary Transitions in Individuality (ETI)**
  The debate is actually dissolving, not being won. The field is shifting toward **Maynard Smith and Szathmáry's** framework of *Major Transitions*.
  Instead of asking "Which unit is the *real* unit?", the question is now: **"Under what conditions does a lower-level unit become a higher-level unit?"**
  *   How do genes become a genome?
  *   How do cells become an organism?
  *   How do organisms become a eusocial colony?

  This framework accepts that selection happens at all levels *simultaneously*, and the history of life is the history of suppressing lower-level selection to allow higher-level selection to dominate. This sidesteps the "who is right" argument by making the *conflict* between levels the object of study.

  ### Summary
  The debate is **ontologically verbal** (both sides describe the same reality) but **heuristically substantive** (they ask different questions and build different models).

  It won't end with a knockout punch. It will end when the question "What is the *unit* of selection?" is recognized as a category error. There is no single unit. There is a **hierarchy of replicators**, and the "unit" is simply the level at which heritable variance in fitness is currently highest and most constrained.

  If you are covering this, the story isn't "Who won the debate?" The story is "Why are we still asking the question?" The persistence of the debate tells us more about the sociology of science and our psychological desire for a "fundamental particle" of biology than it does about evolution itself. Biology is messy; it doesn't respect our desire for a single unit of account.
