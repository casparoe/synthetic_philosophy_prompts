answer: |-
  ### Examination Question

  **Module:** PHI304 Philosophy of Mathematics
  **Section:** B (Essay Questions)
  **Time Allowed:** 3 Hours

  **Question 1:**
  Thomson argues that the impossibility of determining the final state of his lamp proves that supertasks are logically contradictory. Benacerraf replies that the lamp's description is simply incomplete. Evaluate this debate by contrasting Thomson's Lamp with a supertask where the state at the limit *is* logically determined by the preceding states (such as a particle completing a Zeno-style trajectory). Does the Lamp's indeterminacy refute the logical possibility of supertasks *in toto*, or does it merely distinguish between continuous and discontinuous state transitions?

  ***

  ### Model Answer

  Thomson's argument against supertasks relies on the claim that completing an infinite sequence of actions entails a logical contradiction. In the Lamp paradox, a lamp is toggled on and off at intervals halving towards a minute. Thomson contends that at $t=1$, the lamp must be either on or off, yet the preceding series dictates neither. He concludes that the very concept of a supertask is logically incoherent. However, this inference is too hasty. As Benacerraf demonstrated, the failure to determine the lamp's state does not prove logical impossibility; it proves only that the description of the task is underdetermined relative to the logic of limits.

  To evaluate whether this refutes supertasks generally, one must distinguish between the logic of the infinite sequence and the specific properties of the state space. Thomson assumes that the state at the limit ($t=1$) must be a logical consequence of the states prior to the limit ($t<1$). Benacerraf correctly identifies that no such logical entailment exists for the lamp. The function describing the lamp's state (0 for off, 1 for on) is discontinuous at the limit. Logic alone cannot dictate the value of a discontinuous function at its limit point without an additional boundary condition. Therefore, the Lamp does not generate a contradiction; it generates indeterminacy. A contradiction would require proving the lamp is *both* on and off; Thomson merely shows it is *neither* determined on *nor* determined off.

  The weakness of Thomson's generalisation becomes apparent when contrasting the Lamp with a supertask involving continuous spatial motion. Consider a particle moving from $x=0$ to $x=1$, traversing distances $1/2, 1/4, 1/8...$ in corresponding halving time intervals. This is a supertask: infinitely many spatial intervals are traversed in finite time. Unlike the lamp, the state of the particle at $t=1$ is logically determined by the description. Given the continuity of space and time, the limit of the position sequence is uniquely $x=1$. There is no indeterminacy. If Thomson were correct that supertasks are logically impossible *in toto*, this spatial task should also fail to yield a determinate state. It does not.

  This contrast reveals that the Lamp's failure is not due to the infinity of the task, but the topology of the state space. The Lamp operates in a discrete state space $\{On, Off\}$ with no metric connection between the states, whereas the particle operates in a continuous metric space. The indeterminacy in the Lamp arises because the description specifies the history ($t<1$) but omits the boundary condition at the limit ($t=1$). In the spatial case, the continuity of the trajectory acts as an implicit boundary condition fixing the limit.

  Consequently, the Lamp does not refute the logical possibility of supertasks. It refutes the claim that the history of a discrete, discontinuous process logically entails its limit state without further stipulation. Thomson conflates "logically underdescribed" with "logically impossible." If we stipulate the lamp is off at $t=1$, no contradiction arises; the task is simply one where the final state is independent of the prior toggling.

  Therefore, the debate shifts from logical possibility to physical possibility. While the Lamp is logically coherent (provided we accept underdescription), it may be physically impossible due to energy constraints or the quantization of time. However, Benacerraf's analysis saves the *concept* of the supertask from logical annihilation. The Lamp serves not as a reductio of supertasks, but as a lesson in the necessity of defining limit conditions for discontinuous functions. To claim it proves supertasks impossible is to mistake a lack of descriptive necessity for a logical contradiction. The existence of determinate supertasks (like the Zeno runner) confirms that infinity itself is not the barrier; the barrier is merely the topology of the properties being manipulated.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **First-Class Criteria:** To achieve a First (16–20 marks), the script must successfully execute all five moves below, integrating them into a coherent argument about the *scope* of the impossibility. An Upper-Second (12–15 marks) will typically execute the moves descriptively without synthesising the implication for logical possibility, or will conflate physical and logical constraints.

  | Move | Marks | Requirement | Typical Error (2:1 or below) |
  | :--- | :--- | :--- | :--- |
  | **1. Thomson's Contradiction** | 4 | Accurately reconstructs Thomson's claim: that the lack of a final state implies a logical contradiction regarding the task's completion. | Merely retelling the story of the lamp switching without articulating the claimed *contradiction*. |
  | **2. Benacerraf's Objection** | 4 | Explains Benacerraf's 'underdescription' reply: logic does not entail a limit state for discontinuous functions. | Treating Benacerraf's reply as a physical objection (e.g., "we can't build it") rather than a logical one. |
  | **3. Contrast Case** | 4 | Introduces a specific supertask where the limit state *is* determined (e.g., Zeno-style spatial motion). | Failing to provide a contrast case, or choosing one that is equally indeterminate (e.g., another discrete switch). |
  | **4. Topological Analysis** | 4 | Explains *why* the contrast case succeeds where the Lamp fails (continuity of space vs. discreteness of on/off). | Asserting the contrast case works without explaining the role of continuity/topology in fixing the limit. |
  | **5. Scope Verdict** | 4 | Concludes that the Lamp refutes neither logical possibility nor supertasks *in toto*, but highlights descriptive incompleteness. | Concluding that supertasks are logically impossible, or conflating logical possibility with physical feasibility. |

  **Differentiation Guide:**
  *   **First Class (16–20):** All five moves are present and explicitly linked. The candidate uses the contrast case (Move 3) to drive the conclusion (Move 5), showing that the impossibility is local to discontinuous states, not global to supertasks.
  *   **Upper Second (12–15):** Moves 1, 2, and 3 are present, but Move 4 is weak (fails to explain *why* the contrast works) or Move 5 hedges (e.g., "It depends on physics"). The argument remains a comparison of two examples rather than an analysis of logical scope.
  *   **Lower Second (8–11):** Moves 1 and 2 are present, but the contrast case is missing or misunderstood. The essay focuses on the narrative of the Lamp.
  *   **Third/Fail (0–7):** Significant misunderstanding of the paradox, or failure to address the prompt's requirement for a contrast case.
