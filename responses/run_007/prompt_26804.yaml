      *   *Section 2 (Sharper Angles):*
          *   *The Marriage:* Identity isn't just individual; it's relational.
          *   *Risk & Value:* If identity doesn't matter, does life matter less?
          *   *The "First Person" Problem:* The draft touches on this, push it harder. The "view from nowhere" vs. "view from here."
