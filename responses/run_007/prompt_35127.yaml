answer: |-
  It is completely understandable that something about that summary felt off to you, because while the author gets the basic experimental setup right, the philosophical interpretation they layer on top is highly contested and arguably misrepresents the significance of Joshua Knobe's actual work. You are correct to suspect that the author is using the Knobe effect to score a broader point about the reliability of intuitions that the data itself does not necessarily support. To start with the accurate portion, the description of the CEO vignettes is standard and correct. In the harm case, where a CEO proceeds with a profit-making scheme knowing it will damage the environment, the majority of people say he harmed the environment intentionally. In the help case, where the side effect is beneficial, the majority say he did not help intentionally. This asymmetry is the robust empirical finding that sparked years of debate. However, the moment the author claims that moral judgments distort factual judgments, they are smuggling in a theoretical assumption that many philosophers of action reject. By calling it a distortion, the author assumes there is a pure, morally neutral fact of the matter about whether an action was intentional, and that moral considerations are merely noise interfering with our perception of that fact. This presupposes that the concept of intentional action is purely descriptive, like the concept of water or mass, rather than partly normative. Many researchers argue that moral evaluation is not a contaminant but a constitutive part of how we conceptualize agency in the first place, meaning the subjects are not making a mistake but rather applying the concept correctly according to its actual structure.

  This leads directly to the problem with the conclusion that the project of using folk intuitions as evidence in philosophy is undermined. That is a massive overreach that does not follow from the results. Experimental philosophy often uses these very intuitions as data to build better theories of concepts, rather than discarding them as useless. If the data shows that our concept of intentionality is sensitive to moral valence, then the philosophical project shifts from trying to find a moral-neutral definition to explaining why morality is built into the concept. The author's claim relies on a naive view of intuition pumps, assuming they are supposed to reveal mind-independent truths rather than the structure of our own cognitive frameworks. Furthermore, Knobe himself has explicitly argued against the idea that this shows people are irrational or confused. He suggests instead that this reveals something deep about the nature of social cognition, specifically that we cannot understand what someone is doing without understanding their moral relationship to the outcome. So, rather than undermining the use of intuitions, the Knobe effect actually revitalized the field by providing rich empirical data that theories of action must account for.

  Regarding the competing explanations you asked about, the book you read presented only the moral contamination view, but there are several other robust hypotheses that attempt to explain the asymmetry without claiming people are conflating oughts and ises. One prominent alternative is the pragmatic explanation, which suggests that people actually have the same underlying judgment about intentionality in both cases but use the word intentionally differently depending on the conversational context. On this view, saying the CEO intentionally helped sounds odd because we usually reserve that praise for cases where the help was the goal, so subjects say no not because they think it wasn't intentional, but because affirming it would imply undue praise. Another major theory is the Deep Self view, which argues that people judge an action as intentional only if it aligns with the agent's deeper values or character. Since the CEO in the vignette is portrayed as caring only about profit, harming the environment fits his profile while helping it does not, leading to the asymmetry without requiring moral judgment to distort factual assessment. There is also the negativity bias hypothesis, which posits that humans are simply more sensitive to negative outcomes than positive ones when assigning agency, meaning we are quicker to attribute intentionality to bad side effects than good ones as a mechanism for assigning blame.

  Ultimately, the most significant misrepresentation in that summary is the implication that Knobe views the effect as a bug in human reasoning. In his later work, Knobe has moved toward a view called the Conceptual Competence perspective, arguing that moral considerations are genuinely part of the competence conditions for applying the concept of intentional action. He posits that to understand what an action is, we must understand its moral significance, so there is no clean separation between the factual and the moral to begin with. If this is true, then the folk are not failing to keep their oughts and ises apart; rather, their concept of action simply does not distinguish between them in the way the author assumes. So while the pop philosophy book uses the effect to argue that folk intuitions are unreliable for serious metaphysics, a more nuanced reading suggests that folk intuitions are reliable guides to the actual structure of our concepts, even if that structure is more morally laden than traditional philosophers preferred to admit. Your instinct that the author was stretching the conclusion is well-founded, as the Knobe effect is generally seen as a challenge to specific theories of action rather than a demolition of intuition-based methodology itself.
