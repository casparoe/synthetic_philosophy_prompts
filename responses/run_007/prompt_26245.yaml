prompt: |-
  I'm a software engineer — I think in terms of functions that get called, interfaces vs. implementations, technical debt, legacy systems, specs vs. what the code actually does. I keep hearing philosophers of biology argue about wether biological functions are "etiological" (a trait's function is what it was selected for) or "causal-role" (a trait's function is what it does in the larger system). Restate this whole debate in the vocabulary I actually use. What maps cleanly — is the etiological account basically saying a function is whatever the original spec said it should do, even if the code's been repurposed? And is the causal-role account saying a function just is whatever it currently contributes to the system's behavior? Then give me the residue report: what in the philosophers' debate doesn't translate at all, and is that because my vocabulary is missing something important or because they're arguing about something less substantive than it looks?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer. Thinks in terms of functions, interfaces, implementations, technical debt, legacy systems, specs vs. code.
      *   **Topic:** Philosophy of Biology debate: Etiological Functions vs. Causal-Role Functions.
      *   **Task:**
          1.  Restate the debate using software engineering vocabulary.
          2.  Validate the user's intuition (Etiological = Spec/Intent, Causal-Role = Current Behavior/Contribution).
          3.  Provide a "Residue Report": What doesn't translate? Is it a vocabulary gap or a substantive difference?

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Etiological Function (Selected Effects):** A trait's function is defined by its evolutionary history. *Why* was it selected? (e.g., The heart's function is to pump blood because ancestors with pumping hearts survived/reproduced).
      *   **Causal-Role Function (Systemic Contribution):** A trait's function is defined by its current causal contribution to the containing system. *What* does it do right now? (e.g., The heart's function is to pump blood, make thumping noises, and circulate hormones because that's its current causal role).

  3.  **Map to Software Engineering Vocabulary:**
      *   *System:* The running application/production environment.
      *   *Trait/Component:* A module, class, function, or microservice.
      *   *Etiological:* The original Git commit message, the Jira ticket, the PR description, the initial architecture doc. It's about *intent* and *history*.
      *   *Causal-Role:* The runtime behavior, the logs, the side effects, the actual API contract as observed by callers (even if unintended).
      *   *Selection:* Deployment, A/B testing, user retention, market fit (what kept the code in the codebase).
      *   *Technical Debt/Refactoring:* Changing implementation without changing interface vs. changing purpose.

  4.  **Drafting the Translation (Iterative Process):**
      *   *Attempt 1:* Etiological is the spec. Causal is the code.
      *   *Critique 1:* Too simple. Code *is* the implementation. Etiological is more about *why* the code was merged. Causal is about what happens when it runs.
      *   *Attempt 2:* Etiological is the "Intent of the Commit." Causal is the "Runtime Side Effects."
      *   *Refinement:* Let's use "Legacy Code" and "Refactoring."
      *   *Etiological:* The function exists because it solved a specific ticket in v1.0. Even if we use it differently now, its "true function" is what the original dev intended.
      *   *Causal-Role:* The function is a black box. We look at inputs/outputs and side effects. If it updates a cache *and* sends an email, both are its functions, regardless of what the docstring says.

  5.  **Addressing the User's Hypothesis:**
      *   User asks: "Is etiological basically saying a function is whatever the original spec said it should do, even if the code's been repurposed?" -> Yes, essentially. It's about the *reason for existence*.
      *   User asks: "Is causal-role saying a function just is whatever it currently contributes to the system's behavior?" -> Yes. It's about *current utility*.

  6.  **Developing the "Residue Report" (The Hard Part):**
      *   What doesn't fit?
      *   *Evolution vs. Design:* Software is designed (top-down); Biology is evolved (bottom-up). There is no "Grand Architect" in biology. In software, there *was* an original developer. This makes the "Etiological" view in biology harder because "intent" is metaphorical (Natural Selection), whereas in software, intent is literal (The Dev).
      *   *Normativity:* In biology, "function" implies "proper function" vs. "malfunction." A heart *should* pump blood. If it doesn't, it's broken. In software, if code doesn't match spec, it's a bug. If it matches spec but doesn't solve the user problem, it's a failed feature. The philosophical debate is often about defining "health" or "normalcy."
      *   *Repurposing (Exaptation):* In biology, a feather might evolve for warmth, then get used for flight. In software, we call this "refactoring" or "reuse." But in biology, the *history* matters more for the definition of function than in software. In software, if I reuse a function, I update the docstring (usually). In biology, the "docstring" (DNA) doesn't get updated to reflect the new use immediately.
      *   *Selection Pressure:* In software, code survives because a dev decided not to delete it. In biology, traits survive because organisms didn't die. The "feedback loop" is different.

  7.  **Synthesizing the Output:**
      *   **Introduction:** Acknowledge the mapping. It's a strong analogy.
      *   **The Translation:**
          *   Etiological = `git blame` / Commit Message / Original Ticket.
          *   Causal-Role = Runtime Profiling / Observability / Actual Side Effects.
