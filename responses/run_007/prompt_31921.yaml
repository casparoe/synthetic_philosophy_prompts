answer: |-
  You have hit the nail on the head. Quantum Immortality (QI) is not primarily a physics claim; it is a metaphysical claim disguised as physics. It relies entirely on the **Many-Worlds Interpretation (MWI)** being true (physics), but even more critically, it relies on a specific theory of **Personal Identity (PI)** being true (metaphysics).

  If your theory of identity says "I am my specific biological organism," QI might look different than if your theory says "I am a pattern of information."

  Here is an analysis of the desiderata for a theory of personal identity to make the QI question well-posed, categorized by necessity, conflict, and decisive weight.

  ---

  ### 1. Non-Negotiable Requirements (The "Must-Haves")
  For the question "Will *I* survive quantum suicide?" to be meaningful, a theory of identity must address these three things. If it fails any of these, the theory is incompatible with the premises of MWI, not just QI.

  *   **The Fission Constraint (Your "Branching Case"):**
      *   **Requirement:** The theory *must* provide a truth condition for identity across fission events.
      *   **Why:** MWI posits that the universe (and you) splits. A standard "one-to-one" identity theory (I am one thing now, I must be one thing later) breaks mathematically here.
      *   **Verdict:** Non-negotiable. If a theory says "Fission is impossible," it rejects MWI. If it says "Fission destroys identity," QI is false. If it says "Identity splits," QI is plausible.

  *   **The Duplication Logic (Your "Duplication Problem"):**
      *   **Requirement:** The theory must distinguish between *qualitative identity* (exact copy) and *numerical identity* (the same entity).
      *   **Why:** In QI, the survivor is qualitatively identical to the pre-branch you. But are they numerically identical?
      *   **Verdict:** Non-negotiable. QI claims numerical identity persists. If the theory says only qualitative identity persists, then "you" die, and a "copy" lives. QI fails.

  *   **Substrate Neutrality (Your "Psych vs. Bio"):**
      *   **Requirement:** The theory must specify whether identity tracks *matter* (the specific atoms) or *structure* (the pattern).
      *   **Why:** In MWI branching, the "matter" of the wavefunction is conserved, but the configuration splits. If identity requires specific atoms, branching might sever identity. If it requires pattern, identity flows with the branch.
      *   **Verdict:** Non-negotiable. You cannot evaluate survival without knowing *what* is surviving.

  ### 2. Camp-Specific Requirements (The "Debatably Necessary")
  These are important, but different schools of thought handle them differently. A theory of identity can be coherent without settling these, but the answer to QI will shift based on them.

  *   **The Measure Problem:**
      *   **Issue:** Does identity track *existence* or *measure* (amplitude squared)?
      *   **Camp A:** Identity is binary. If the branch exists, "I" am there, regardless of amplitude. (Supports QI).
      *   **Camp B:** Identity is weighted. If the amplitude drops to near zero, the "intensity" of my existence drops. I survive, but I "fade out." (Weakens QI).
      *   **Verdict:** Camp-specific. Standard metaphysics ignores measure, but MWI-specific metaphysics must grapple with it.

  *   **Gradual Replacement / Fading Qualia:**
      *   **Issue:** This tests the Sorites Paradox applied to identity.
      *   **Verdict:** This is a stress test for the theory, but not strictly required to answer the *instant* branching of QI. However, if identity is vague/fuzzy, then "Did I survive?" might have no determinate truth value, rendering QI neither true nor false.

  ### 3. Jointly Unsatisfiable Requirements (The Trilemma)
  You asked if any requirements are jointly unsatisfiable. **Yes.** This is the central problem in the philosophy of fission (identified famously by Derek Parfit). You cannot hold all three of these intuitions simultaneously in an MWI context:

  1.  **Transitivity:** If A=B and B=C, then A=C. (Identity is a logical equivalence relation).
  2.  **Uniqueness:** There can be only one "me" at any given time. (I cannot be two different people).
  3.  **Fission Possibility:** It is possible for one person to split into two psychologically continuous successors. (MWI requires this).

  **The Conflict:**
  In QI, Pre-Branch You (A) splits into Survivor (B) and Deceased (C).
  *   B is psychologically continuous with A.
  *   C is psychologically continuous with A (up to the moment of death).
  *   If identity = psychological continuity, then A=B and A=C.
  *   By **Transitivity (1)**, B=C.
  *   But B and C are different people (one is dead, one is alive). This violates **Uniqueness (2)**.

  **To solve this, a theory must drop one:**
  *   **Drop Uniqueness:** "I am both B and C." (This leads to QI. You survive as B).
  *   **Drop Transitivity:** "A is related to B, and A is related to C, but B is not C, and strictly speaking, A does not survive as either." (This kills QI. "You" cease to exist; successors exist).
  *   **Drop Fission:** Deny MWI.

  ### 4. The "Decider" Requirement
  You asked which single requirement does the most work. It is this one:

  **The "What Matters" vs. "Identity" Distinction.**

  This is the pivot point.
  *   **Option A (Identity is What Matters):** If you believe that *numerical identity* is the necessary condition for rational self-concern (i.e., I should only fear death if *I* strictly cease to exist), then you must solve the Trilemma above. If you choose "Drop Uniqueness" (I am the set of all branches), **QI is True.** If you choose "Drop Transitivity" (I am none of the branches), **QI is False.**
  *   **Option B (Relation R is What Matters):** This is the Parfitian view. It argues that "Identity" is a empty concept. What matters is *Psychological Continuity and Connectedness* (Relation R).
      *   If you take this view, the question "Am I the survivor?" is an **Empty Question**. It has no answer.
      *   Instead, you ask: "Will there be someone in the future who remembers being me and carries my goals?"
      *   **Result:** QI becomes irrelevant. You don't "immortally experience" the survival; rather, there is simply a future branch where a person exists who is R-related to you. Whether that counts as "you" surviving is a semantic choice, not a metaphysical fact.

  **Why this is the Decider:**
  If you demand a True/False answer to "Is that me?", you are forced into Option A, which forces you to choose between Uniqueness (No QI) or Multiplicity (QI).
  If you accept Option B, QI dissolves into a question of semantics.

  ### 5. Missing Requirements
  You missed two critical components that are necessary for QI to function as a *practical* hypothesis rather than just a metaphysical curiosity.

  *   **Decision-Theoretic Link:**
      *   A theory of identity must explain **betting behavior**.
      *   *Requirement:* If QI is true, how should I bet *before* the split?
      *   If I am about to play Quantum Russian Roulette (1 in a million chance to live), a QI proponent says "I will experience surviving." But should I bet on winning the lottery?
      *   If your theory of identity doesn't tell you how to weight probabilities (Born Rule) against subjective certainty, it cannot guide action. A theory that says "I survive in the 0.00001% branch" but gives no account of why I should fear the 99.999% branch is practically useless.

  *   **The Phenomenological Continuity Constraint:**
      *   *Requirement:* The theory must account for the *gap* in experience.
      *   In QI, there are branches where you die. In the surviving branch, time passes continuously. But what about the "weight" of the dead branches?
      *   Some critics argue that if 99% of your "measure" dies, your subjective experience should reflect that degradation (e.g., you survive but reality looks "fuzzy" or probability feels broken). A theory of identity needs to explain why the survivor experiences a *normal* world despite being a statistical anomaly.

  ### Summary Checklist for a QI-Ready Theory of Identity

  If you want to evaluate whether QI holds water, test your theory of identity against this hierarchy:

  1.  **Does it allow Fission?** (If No -> No MWI / No QI).
  2.  **Does it prioritize Uniqueness or Multiplicity?**
      *   Uniqueness -> You die (QI False).
      *   Multiplicity -> You survive (QI True).
  3.  **Does it distinguish Identity from "What Matters"?**
      *   If Identity matters -> You must solve the Trilemma.
      *   If Relation R matters -> The question "Is it me?" is meaningless (QI Dissolved).
  4.  **Does it link to Probability?**
      *   Can it explain why you should care about the *measure* of the branch, not just its existence? (If not, QI implies you should be reckless with your life, which seems irrational).

  **The Verdict:**
  The single requirement that does the most work is **Uniqueness**.
  *   If you insist **Identity must be Unique** (I can only be one person), QI is logically impossible in MWI, because MWI creates multiple successors. You must conclude you do not survive as *the* survivor, but rather that *a* survivor exists.
  *   If you allow **Identity to be Non-Unique** (I am a branching tree), QI follows naturally.

  Most philosophers of physics lean toward the Parfitian view: Identity is not what matters. Therefore, QI is a category error. It promises "Immortality" (Identity), but MWI only delivers "Successors" (Relation R). Whether that satisfies you is the real question.
