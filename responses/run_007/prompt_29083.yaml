prompt: |-
  I keep getting into this argument on our curriculum committee. One of my collegues is very pro-AI, and whenever someone raises the worry that students will stop actually understanding the material, he says using a language model is just like using GPS. You still decide where you're going, you still do the driving, you just offload the route-finding; nobody thinks GPS destroyed our ability to navigate, and the people who paniced about calculators turned out to be wrong. So, in his view, the erosion-of-understanding worry is just another moral panic about a new tool.

  I'm not convinced, partly because I've heard the GPS case used in the opposite direction, as evidence that offloading a skill does quietly erode it. I want you to audit the analogy. Start with the correspondence table: what's the GPS unit, the driver, the route, the destination, the mental map, and the map-reading skill that might atrophy. Then tell me where the mapping earns its keep and where it breaks. Pay special attention to the places where the value of the activity is in the doing rather than the arriving, and to which features of the GPS case the analogy quietly imports that don't carry over to writing or reasoning with a language model. Then say whether the relaxed conclusion — stop worrying, it's just a tool — survives once the disanalogies are on the table. If it doesn't survive, tell me what a better analogy would be, if there is one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** A curriculum committee argument about AI in education.
      *   **Opposing View:** Colleague claims AI is like GPS (tool for efficiency, doesn't destroy understanding, similar to calculator panic).
      *   **User's View:** Skeptical. Believes GPS might actually *support* the idea that offloading erodes skills. Wants to focus on "value in the doing" vs. "value in the arriving."
      *   **Task:** Audit the analogy.
          1.  Create a correspondence table (GPS unit, driver, route, destination, mental map, map-reading skill).
          2.  Analyze where the mapping works (earns its keep).
          3.  Analyze where the mapping breaks (disanalogies).
          4.  Focus on intrinsic value (doing vs. arriving).
          5.  Focus on features imported from GPS that don't apply to LLMs/writing/reasoning.
          6.  Evaluate the conclusion ("stop worrying").
          7.  Propose a better analogy if the GPS one fails.

  2.  **Step 1: The Correspondence Table:**
      *   *GPS Unit:* Large Language Model (LLM) / AI Chatbot.
      *   *Driver:* The Student.
      *   *Route:* The argument structure, the logical steps, the code syntax, the essay flow.
      *   *Destination:* The final product (essay, solution, code, answer).
      *   *Mental Map:* The student's internal conceptual understanding of the subject matter.
      *   *Map-Reading Skill:* The ability to reason, write, synthesize, and solve problems without assistance.

  3.  **Step 2: Where the Mapping Earns Its Keep (Similarities):**
      *   *Efficiency:* Both save time on navigation/generation.
      *   *Error Reduction:* Both reduce wrong turns/grammar errors.
      *   *Accessibility:* Both allow novices to achieve results previously reserved for experts (getting to a destination without knowing the city; writing a coherent paragraph without strong grammar).
      *   *Human Oversight:* Ideally, both require a human to set the goal and verify the output (though this is often skipped).

  4.  **Step 3: Where the Mapping Breaks (Disanalogies):**
      *   *Transparency:* GPS shows you the turn *before* you make it. You can still look out the window. LLMs generate the *whole* route instantly. It's a black box.
      *   *Skill Interdependence:* Driving and navigating are distinct skills. You can be a great driver with bad navigation. Writing/Reasoning and the *product* of writing/reasoning are fused. You can't separate the "thinking" from the "writing" easily.
      *   *Feedback Loop:* GPS corrects you immediately if you deviate. LLMs give you a finished path; if you don't understand *why* it's the path, you learn nothing.
      *   *The "Doing" is the Point:* In education, the "navigation" *is* the learning. In driving, the "navigation" is a means to an end.
      *   *Illusion of Competence:* GPS makes you feel like you know the way. LLMs make you feel like you know the material.

  5.  **Step 4: Value in the Doing vs. Arriving:**
      *   *GPS Context:* The value is almost entirely in the *arriving*. Nobody takes a drive just to practice using a map (unless it's a specific training exercise).
      *   *Education Context:* The value is largely in the *doing* (the cognitive struggle). The essay isn't the point; the thinking required to write the essay is the point.
      *   *Implication:* If the tool automates the "doing," it automates the learning.

  6.  **Step 5: Imported Features (Hidden Assumptions):**
      *   *Passive vs. Active:* GPS is often passive (follow instructions). LLM interaction *can* be active (prompt engineering), but often becomes passive (copy-paste).
      *   *External vs. Internal:* GPS offloads spatial memory. LLMs offload semantic processing and logic generation. Spatial memory is less critical for general cognition than logical synthesis.
      *   *Verification:* It's easy to see if a GPS took you off a cliff. It's hard to see if an LLM hallucinated a logical fallacy if you don't know the material.

  7.  **Step 6: Evaluating the Conclusion:**
      *   Does "stop worrying" survive? No. The GPS analogy actually supports the *worry* if you look at cognitive offloading research (spatial cognition declines with GPS reliance).
      *   The colleague's argument relies on the assumption that the *outcome* is the only thing that matters. In education, the *process* is the outcome.

  8.  **Step 7: Better Analogies:**
      *   *The Exoskeleton:* Makes you stronger, but muscles atrophy if you never lift without it.
      *   *The Ghostwriter/Tutor:* A human who does the work for you vs. guides you.
      *   *The Calculator (Nuanced):* Calculators offload *arithmetic*, not *math*. AI offloads *reasoning*, which is closer to the *math* itself.
      *   *Best Analogy:* **The Cognitive Prosthesis / Exoskeleton for Thought.** Or perhaps **The Ghostwriter.** Let's go with the **Exoskeleton** for physical atrophy or **The Ghostwriter** for intellectual honesty. Actually, the **Calculator** analogy is the one the colleague used, so I need to refute that specifically.
      *   *Refinement:* A better analogy is **a muscle stimulator vs. exercise.** Or **a food processor vs. cooking.**
      *   *Let's choose:* **The Food Processor/Chef Analogy.** You can make a meal (product) without knowing how to chop or sauté (skills). But if you never chop, you never become a chef.
      *   *Actually, the strongest one:* **The Autopilot.** Pilots still need to fly manually to maintain proficiency because when autopilot fails, they need the skill.

      *Decision:* I will propose the **"Cognitive Exoskeleton"** or **"Autopilot"** analogy. Autopilot is strong because it implies high stakes and the necessity of manual override capability.

  9.  **Drafting the Response:**
      *   *Tone:* Analytical, balanced, rigorous (fitting a curriculum committee context).
      *   *Structure:* Follow the prompt's requirements strictly.
      *   *Key Insight:* The GPS analogy proves the colleague *wrong* regarding skill retention, not right.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "value in the doing" aspect. That's the crux of the educational argument. Also, ensure the distinction between *arithmetic* (calculator) and *reasoning* (AI) is clear.

      *(Refining the Table)*:
      *   GPS -> LLM
      *   Driver -> Student
      *   Route -> Argument/Logic/Code
      *   Destination -> Final Submission
      *   Mental Map -> Conceptual Understanding
      *   Map Reading -> Critical Thinking/Synthesis

      *(Refining the Break)*: The biggest break is that in driving, navigation is instrumental. In writing/thinking, navigation is constitutive.

      *(Refining the Conclusion)*: The "stop worrying" conclusion fails.

      *(Refining the New Analogy)*: I'll suggest the **"Autopilot"** analogy. It captures the need for baseline competence to handle failure modes.

  10. **Final Review:** Does this answer all parts of the prompt?
      *   Correspondence table? Yes.
      *   Where it earns keep? Yes.
      *   Where it breaks? Yes.
      *   Value in doing vs. arriving? Yes.
      *   Imported features? Yes.
      *   Conclusion survival? Yes.
