answer: |-
  1. Menu of readings

  1. **The Untested Hypothesis Reading:** This claims the proposal is merely an unverified narrative lacking data. It asserts that while the logic might be internally consistent, no empirical evidence currently supports the link between the trait and reproductive fitness. It is a statement about the current state of evidence, not necessarily the potential truth of the claim. It implies the work is scientifically incomplete rather than fundamentally incorrect. The critic is essentially saying, "You have a hypothesis, but you haven't done the work to validate it yet." This is a call for data collection, not a rejection of the theoretical framework. It treats the story as a placeholder for future rigorous testing. In this reading, the PI is reminding the student that speculation is not data.

  2. **The Comparative Deficit Reading:** This argues the hypothesis lacks necessary phylogenetic or cross-species comparison. To prove adaptation, one must show the trait varies consistently with selection pressures across related species. Without this, the explanation relies on single-case intuition regarding humans alone. It demands specific methodological rigor regarding evolutionary history rather than rejecting the adaptationist framework itself. The critic wants to see if other primates share this landscape preference under similar ecological conditions. It suggests the current evidence is anecdotal rather than comparative. Here, the PI is demanding a specific type of control group that is missing from the argument.

  3. **The Alternative Explanations Reading:** This asserts the hypothesis ignores plausible non-adaptive mechanisms like genetic drift, developmental constraint, or exaptation. Referencing Gould and Lewontin's spandrels, it claims the trait might be a byproduct of other selected features rather than selected directly. It criticizes the researcher for failing to rule out null models where the trait provides no fitness advantage whatsoever. The burden is on the adaptationist to show why selection is a better explanation than chance or structural necessity. It demands a comparison of likelihoods between adaptive and non-adaptive models. The PI is insisting that adaptation is not the default null hypothesis.

  4. **The Unfalsifiability Reading:** This claims the story is constructed so that any possible observation could be interpreted as supporting it post hoc. If evidence contradicts the story, the narrator adjusts the historical context rather than abandoning the hypothesis. This attacks the scientific status of the claim, suggesting it operates outside the bounds of empirical refutation. It implies the hypothesis is immune to evidence, functioning more like ideology than science. The critic argues that without clear conditions under which the hypothesis would be abandoned, it is scientifically useless. The PI is accusing the student of practicing pseudoscience.

  5. **The Presentism Reading:** This argues the hypothesis conflates current utility with historical selection pressures. Just because a landscape is relaxing now does not mean relaxation caused the preference ancestrally. It highlights the temporal gap between the environment of evolutionary adaptedness and the modern laboratory setting, warning against assuming continuity. The critic points out that modern preferences may be maladaptive or neutral today. It requires evidence that the trait existed and was beneficial in the ancestral environment, not just that it exists now. The PI is warning against projecting modern feelings onto ancestral minds.

  6. **The Anti-Adaptationist Reading:** This radical claim asserts that psychological traits rarely stem from specific selection pressures due to brain complexity. It suggests the mind is too plastic for specific modules like "savanna preference" to evolve. This rejects the foundational premise of evolutionary psychology, arguing that most behaviors are noise, culture, or general learning rather than specific adaptations. It implies that searching for specific fitness functions for behavior is a category error. The critic advocates for developmental or cultural explanations over evolutionary ones. The PI is rejecting the entire research program, not just this specific hypothesis.

  2. Verdicts

  | Reading in one line | Verdict (platitude / substantive / false) | Supports dismissal? (yes / only with additions / no) |
  | :--- | :--- | :--- |
  | 1. Untested Hypothesis | Platitude: All hypotheses start untested. | No: Requires data, not dismissal. |
  | 2. Comparative Deficit | Substantive: Methodological rigor is required. | Only with additions: Needs specific phylogenetic critique. |
  | 3. Alternative Explanations | Substantive: Null models must be considered. | Only with additions: Must show alternatives are likelier. |
  | 4. Unfalsifiability | Substantive: Unfalsifiable claims are unscientific. | Yes: If truly unfalsifiable, it is not science. |
  | 5. Presentism | Substantive: Current utility ≠ historical selection. | Only with additions: Needs evidence of discontinuity. |
  | 6. Anti-Adaptationist | False/Debatable: Adaptationism is valid but limited. | No: Rejects valid science alongside bad science. |

  This table summarizes the epistemic weight of each criticism. Only the unfalsifiability reading justifies immediate rejection of the hypothesis as scientifically invalid. The others indicate missing work or methodological flaws that require correction or further testing rather than abandonment. The anti-adaptationist stance is generally considered too extreme by mainstream evolutionary biologists.

  3. What the dismissal needs to work

  For the PI's interruption to be justified rather than merely rude, they must be operating under Reading 4 (Unfalsifiability). Simply lacking data (Reading 1) is the normal state of a hypothesis in a lab meeting; dismissing it for that reason stifles creativity. To fairly dismiss the savanna hypothesis as a "just-so story," the PI must demonstrate that no conceivable evidence could contradict it. For example, if the student claims both preference for open spaces *and* dense forests are adaptive depending on mood, without specifying the switching mechanism, the hypothesis becomes unfalsiable.

  If the PI meant Reading 2 or 3 (Comparative or Alternatives), the interruption was premature. Those criticisms license skepticism, not dismissal. The fair response there is, "That is a plausible adaptationist story, but how will you distinguish it from a spandrel or a cultural artifact?" The PI needs to articulate *why* this specific narrative is immune to testing. Without demonstrating that the student refuses to define conditions for falsification or ignores obvious null models, the PI is merely asserting authority. A fair dismissal requires showing the hypothesis is structurally flawed, not just currently unsupported.

  4. Bottom line

  "Just-so story" usually means "untested hypothesis," which deserves further work, not dismissal. It only justifies killing an idea if the story is unfalsifiable—meaning no evidence could ever prove it wrong. Ask your PI: "Are you saying we lack data, or that this claim cannot be tested?" If it's the former, propose a test. If it's the latter, ask them to define what evidence would change their mind.
