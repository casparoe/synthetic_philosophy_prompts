prompt: |-
  I'm a program manager at a large tech company overseeing a portfolio of about twenty projects ranging from six-month experiments to multi-year platform builds. The thing I struggle with most is knowing when to kill a project that's gone sideways. I've read about the dollar auction and escalation of commitment, and I recognize the pattern: we've sunk $X into something, it's not working, but pulling the plug feels like admitting $X was wasted, so we throw in more. I want a decision procedure I can actually use in quarterly reviews — a checklist or sequence of questions I run through for each amber/red project, that takes maybe 15 minutes, and that's designed specifically to catch the escalation dynamic. It should flag where I'm likely to be fooling myself (e.g. 'the next milestone will be different' when it never is), and it should be honest about the fact that the procedure itself can be gamed by the same psychology its meant to check. Then run it on two cases: (1) an internal tooling project that was supposed to ship in 9 months, is now at month 20, has a working but unloved MVP, and the team lead wants 6 more months and 2 more engineers to 'get it right'; (2) a machine learning feature that was supposed to improve user retention by 5%, has delivered 1.2% in A/B tests after a year of tuning, and the data science lead argues the model is 'on the verge of a breakthrough' if we just double the training compute. For each, tell me what the procedure says and whether I should trust it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Analyze the Request:**
      *   **Role:** Program Manager at a large tech company.
      *   **Context:** Portfolio of ~20 projects (mixed duration/scope).
      *   **Problem:** Difficulty killing sideways projects (Escalation of Commitment / Sunk Cost Fallacy).
      *   **Goal:** A 15-minute decision procedure/checklist for quarterly reviews (specifically for amber/red projects).
      *   **Requirements:**
          *   Designed to catch escalation dynamics.
          *   Flag self-deception patterns (e.g., "next milestone will be different").
          *   Acknowledge that the procedure itself can be gamed by psychology.
          *   Apply to two specific cases (Internal Tooling, ML Feature).
          *   Provide a recommendation and a "trustworthiness" assessment for each case.

  2.  **Deconstruct the Psychology (Escalation of Commitment):**
      *   *Why do we keep going?* Sunk costs, ego/reputation, loss aversion, hope/optimism bias, social pressure (not wanting to let the team down), ambiguity (maybe it *will* work).
      *   *How to counteract?* Pre-commitment, outside view, opportunity cost framing, killing criteria defined *before* investment, separating decision-makers from builders.

  3.  **Drafting the Decision Procedure (The "Kill Switch" Protocol):**
      *   *Constraint:* Must take ~15 minutes.
      *   *Structure:* Needs to be sequential to force cognitive shifting.
      *   *Key Elements:*
          1.  **The Zero-Base Question:** Remove sunk costs.
          2.  **The Opportunity Cost:** What else could we do?
          3.  **The Evidence Check:** Is the "breakthrough" real or hypothetical?
          4.  **The Pre-Mortem:** Imagine it failed again.
          5.  **The Meta-Check:** Am I gaming this checklist?

      *   *Refining the Questions:*
          *   Instead of "Should we continue?", ask "If we weren't doing this, would we start it today?"
          *   Instead of "How much more?", ask "What is the specific metric that proves success, and has it moved historically?"
          *   Instead of "Can we fix it?", ask "What has changed fundamentally since the last failure?"

      *   *Addressing the "Gaming" Aspect:* The procedure needs a "Red Team" step or a specific question about *why* the PM wants to say yes.

  4.  **Developing the Procedure (Iterative refinement):**
      *   *Name:* The "Zero-Base Continuation Audit" (ZBCA).
      *   *Timebox:* 15 mins.
      *   *Sections:*
          1.  The Fresh Eyes Test (Sunk Cost removal).
          2.  The Trajectory Truth (Evidence vs. Hope).
          3.  The Opportunity Shadow (Cost of Delay elsewhere).
          4.  The Meta-Cognition Check (Am I lying to myself?).

  5.  **Applying to Case 1: Internal Tooling (The "Zombie" Project):**
      *   *Facts:* 9 mo plan -> 20 mo actual. MVP exists but unloved. Request: +6 mo, +2 engineers.
      *   *Analysis:*
          *   Zero-Base: Would we build this today? Probably not, given adoption is low.
          *   Trajectory: 20 months vs 9 months. MVP "unloved" suggests product-market fit issue, not just engineering.
          *   Opportunity: 2 engineers for 6 months = 12 eng-months. High cost for internal tool.
          *   Meta: Team lead asking for more time is classic escalation.
      *   *Verdict:* Kill or Pivot drastically.
      *   *Trust:* High confidence in killing.

  6.  **Applying to Case 2: ML Feature (The "Almost There" Trap):**
      *   *Facts:* Target 5% retention. Actual 1.2%. 1 year tuning. Request: Double compute.
      *   *Analysis:*
          *   Zero-Base: Would we invest double compute for a model that is 1/4th to target?
          *   Trajectory: Diminishing returns. "On the verge" is a classic phrase for escalation.
          *   Opportunity: Compute is expensive. Talent could work on other features.
          *   Meta: Data Science leads often chase model perfection over business value.
      *   *Verdict:* Kill or Cap investment (hard stop).
      *   *Trust:* Moderate/High. ML is noisy, but 1.2% vs 5% after a year is a strong signal.

  7.  **Addressing the "Procedure can be gamed" requirement:**
      *   I need to explicitly state *how* a user might cheat the checklist (e.g., answering the Zero-Base question dishonestly to justify prior feelings).
      *   I need to build a safeguard into the procedure (e.g., requiring written answers before discussion, or involving an outsider).

  8.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty and the psychology.
      *   **The Procedure:** "The Zero-Base Continuation Audit." Step-by-step.
      *   **The Meta-Warning:** How the procedure itself fails.
      *   **Case Study 1:** Internal Tooling.
      *   **Case Study 2:** ML Feature.
      *   **Conclusion:** Final advice on implementation.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Make the questions sharp and binary where possible. Emphasize preparation (data should be ready *before* the 15 mins).
      *   *Critique:* Is "Kill" the only option?
      *   *Fix:* Allow for "Pivot" but define it strictly (new success criteria, not just more time).
      *   *Critique:* Make sure I explicitly answer "Whether you should trust it" for the cases.

  10. **Final Polish:** Ensure tone is professional, empathetic to the PM role, but rigorous. (Proceed to generate output based on these thoughts).

  *(Self-Correction on the "Gaming" aspect)*: I need to make sure I don't just say "it can be gamed." I need to explain *how* the psychology attacks the checklist. For example, answering "Yes, I would start this today" when you know deep down you wouldn't, just to avoid conflict. I will add a "Pre-Commitment" rule to the procedure.

  *(Refining Case 2)*: ML projects are tricky because of non-linearity. I need to be careful not to apply software engineering logic strictly to probabilistic systems, but 1 year vs 5% target is still a strong signal of diminishing returns. I will highlight the "Compute vs. Value" trade-off.

  *(Final Review against Prompt)*:
  - 15 min procedure? Yes.
  - Catches escalation? Yes.
  - Flags self-deception? Yes.
  - Acknowledges procedure gaming? Yes.
  - Run on Case 1 & 2? Yes.
  - Tell me what it says + trust level? Yes.

  Okay, ready to write.cw
answer: |-
  Here is a decision procedure designed specifically to interrupt the escalation of commitment cycle, followed by the application to your two cases.

  ### The Procedure: The Zero-Base Continuation Audit (ZBCA)

  **Timebox:** 15 Minutes (Strict)
  **Prerequisite:** Project data (spend, timeline, metrics) must be prepared *before* the timer starts.
  **Rule:** You cannot move to the next question until you have written down a one-sentence answer to the current one. Writing forces cognitive load that reduces emotional reasoning.

  #### Phase 1: The Sunk Cost Reset (4 Minutes)
  *Goal: Remove the past from the equation.*

  1.  **The Acquisition Question:** "If this project were a startup seeking funding today, with its *current* traction (not its potential), would my company acquire it for the cost of the *remaining* budget?"
      *   *Trap:* Answering based on what it *could* be.
      *   *Correction:* Look only at the MVP/current output.
  2.  **The Replacement Question:** "If we killed this project tomorrow and freed up the budget/headcount, what is the specific high-priority initiative we would fund instead?"
      *   *Trap:* Saying "nothing" or "backlog."
      *   *Correction:* Name a specific project. If you can't name one, the resource constraint isn't real, and the escalation is purely ego-based.

  #### Phase 2: The Evidence vs. Hope Check (5 Minutes)
  *Goal: Distinguish signal from noise.*

  3.  **The Variance Question:** "What fundamental variable has changed since the last milestone failure that guarantees the *next* milestone will succeed?"
      *   *Trap:* "The team is working harder" or "We learned a lot."
      *   *Correction:* Look for structural changes (e.g., "We changed the algorithm," not "We tuned the parameters").
  4.  **The Diminishing Returns Question:** "Plot the last three milestones. Is the cost-per-unit-of-value increasing, decreasing, or flat?"
      *   *Trap:* Ignoring the slope.
      *   *Correction:* If cost is going up and value is flat, you are in a sunk cost spiral.
  5.  **The Definition of 'Done':** "Is the success metric for the next phase binary (ship/don't ship) or subjective ('improved feel', 'on the verge')?"
      *   *Trap:* Subjective metrics allow infinite extension.
      *   *Correction:* Demand a hard number.

  #### Phase 3: The Meta-Cognition Check (6 Minutes)
  *Goal: Audit the auditor (You).*

  6.  **The Reputation Test:** "If I kill this project, whose ego is hurt most? Mine, the Team Lead's, or a Stakeholder's?"
      *   *Trap:* Denying personal attachment.
      *   *Correction:* If the answer is "Mine," you are the risk factor.
  7.  **The Pre-Mortem:** "Imagine it is one year from now. We granted the extension, and the project failed anyway. What is the headline reason why?"
      *   *Trap:* Optimism bias ("It won't fail").
      *   *Correction:* Force a specific failure mode (e.g., "Adoption remained low").
  8.  **The Gaming Check:** "Am I answering these questions to reach a conclusion I've already made emotionally?"
      *   *Trap:* Rationalizing a gut feeling.
      *   *Correction:* If you feel resistance to writing the answer, that is the signal.

  ---

  ### How This Procedure Can Be Gamed (And How to Stop It)

  You asked for honesty about the procedure's flaws. The ZBCA relies on **radical honesty**. The psychology of escalation is insidious; it will co-opt the checklist.

  *   **The Lie:** You answer "No" to the Acquisition Question (Q1) but justify it with "But the strategic value is long-term."
      *   *Countermeasure:* Ban the words "strategic," "potential," and "long-term" during Phase 1.
  *   **The Vagueness:** You answer Q3 with "We have new insights."
      *   *Countermeasure:* Insights must be actionable code or data changes, not learnings.
  *   **The Social Pressure:** You answer Q6 honestly ("My ego"), but feel you cannot act on it due to politics.
      *   *Countermeasure:* This requires you to escalate the decision to a peer or manager who has no skin in the game. **If you cannot show your written answers to a neutral third party, the audit is invalid.**

  ---

  ### Case Application

  #### Case 1: The Internal Tooling "Zombie"
  *   **Context:** 9 mo plan → 20 mo actual. MVP unloved. Request: +6 mo, +2 engineers.
  *   **ZBCA Run:**
      1.  **Acquisition:** Would we buy this today? **No.** An unloved MVP after 20 months indicates a product-market fit failure, not an engineering problem.
      2.  **Replacement:** What else? **Likely yes.** 12 eng-months is significant. Could fund 2-3 smaller features or tech debt reduction.
      3.  **Variance:** What changed? **Nothing structural.** "Getting it right" implies the previous 20 months were "wrong." No new tech or user constraint has shifted.
      4.  **Diminishing Returns:** **Increasing cost.** 20 months for an MVP is extreme. Adding headcount to a late software project usually makes it later (Brooks' Law).
      5.  **Definition:** **Subjective.** "Get it right" is not a metric.
      6.  **Reputation:** **Team Lead.** They have invested 20 months. Killing it invalidates their tenure.
      7.  **Pre-Mortem:** Headline: "Tool shipped after 2 years, adoption remains 0%."
      8.  **Gaming Check:** Are you keeping it because you don't want to have a hard conversation? **Probably.**

  *   **Procedure Verdict:** **KILL.**
  *   **Trust Level:** **High.**
      *   *Reasoning:* This is a classic "Sunk Cost" profile. The gap between plan (9) and actual (20) is >100%. The output (unloved MVP) suggests the *problem* was misidentified, not the execution. Adding engineers to a product problem is waste. The procedure correctly identifies that the "variable change" is non-existent.

  #### Case 2: The ML "Breakthrough" Trap
  *   **Context:** Target 5% retention. Actual 1.2%. 1 year tuning. Request: Double compute.
  *   **ZBCA Run:**
      1.  **Acquisition:** Would we buy this? **Maybe, but cheap.** A 1.2% lift has value, but not at the cost of double compute + 1 year dev time.
      2.  **Replacement:** What else? **Yes.** DS talent is scarce. Could be applied to ranking, search, or fraud.
      3.  **Variance:** What changed? **Scale.** "Double compute" is a brute force approach, not a fundamental insight.
      4.  **Diminishing Returns:** **Sharply Increasing.** 1 year for 1.2% vs target 5%. The curve is flattening.
      5.  **Definition:** **Subjective.** "On the verge of breakthrough" is the single biggest red flag phrase in R&D.
      6.  **Reputation:** **Data Science Lead.** ML leads often conflate model elegance with business value.
      7.  **Pre-Mortem:** Headline: "Compute costs doubled, retention lift stalled at 1.5%."
      8.  **Gaming Check:** Are you fascinated by the tech? **Risk.** ML is shiny.

  *   **Procedure Verdict:** **HARD CAP (Kill the current trajectory).**
      *   *Nuance:* Unlike Case 1, there is *some* value (1.2%). Do not necessarily fire the team, but **kill the request.**
      *   *Action:* Offer a "Last Stand" budget. "You have 1 month and current compute to get to 3%. If not, the project closes."
  *   **Trust Level:** **Moderate/High.**
      *   *Reasoning:* ML projects are probabilistic, so "breakthroughs" *can* happen. However, after one year, the law of diminishing returns usually dominates. The procedure flags the "double compute" request as a brute-force escalation rather than a strategic pivot. The trust is slightly lower than Case 1 because ML non-linearity introduces genuine uncertainty, but the *economic* signal (1.2% vs 5% cost) is clear.

  ### Final Recommendation for You

  Use the **Zero-Base Continuation Audit**, but with one modification: **Do not run it alone in the room.**

  The escalation of commitment is a social disease. It thrives in the private space between you and the Project Lead.
  1.  Send the 8 questions to the Project Lead 24 hours in advance. Require *their* written answers.
  2.  Run the 15-minute audit in the review meeting using *their* answers.
  3.  If their answers to Q1 (Acquisition) and Q3 (Variance) are optimistic but unsupported by data, the conflict is no longer "You vs. Them." It is "Their Answers vs. Reality."

  This externalizes the decision. You aren't killing the project; the data (via their own answers) is killing the project. This protects your relationship with the team while protecting the portfolio from your own psychology.
