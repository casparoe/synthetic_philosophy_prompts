answer: |-
  # The Monday Test: Why Sleeping Beauty Must Be a Thirder

  The Sleeping Beauty problem has festered in philosophy for decades because both sides are partially right about different things. Halfers are right about the coin: it is fair, and no new physical evidence about the toss is gained upon waking. Thirders are right about the experience: Beauty's awakening is an event that happens twice as often on Tails as on Heads. The debate stalls because Halfers talk about the *chance of the coin*, while Thirders talk about the *chance of the moment*.

  However, this ambiguity cannot stand. Rational agents must have a single, consistent credence function that updates properly when new information arrives. When we subject the two positions to a specific stress test involving information update—what I call the "Monday Test"—the Halfer position collapses into incoherence, while the Thirder position remains robust.

  Beauty should assign a credence of **1/3** to Heads upon waking. The Halfer view is not just a different interpretation; it is a violation of Bayesian conditionalization.

  ### The Betting Red Herring

  To reach this conclusion, we must first clear away the standard betting arguments, as you requested. The standard Thirder argument is pragmatic: if Beauty bets on Tails every time she wakes, she wins twice on Tails and once on Heads. To avoid a sure loss, she should act as if Tails is twice as likely. The Halfer retort is that this is a "money pump" artifact; the bet is rigged because the number of betting opportunities depends on the outcome.

  You proposed a variant to fix this: Beauty is offered a bet that counts *only* on Monday. On Tuesday, she is interviewed but no bet is placed. When she wakes, not knowing the day, what odds should she take?

  This variant actually clarifies the epistemic state rather than solving it. If the bet only counts on Monday, Beauty is effectively being asked for her credence in Heads *conditional on it being Monday*. Since the coin is fair, and Monday occurs in both Heads and Tails worlds, her credence *given it is Monday* must be 1/2. Both Halfers and Thirders can agree on this. The disagreement lies in her credence *before* she knows the bet is restricted to Monday.

  The Halfer says her credence is 1/2 upon waking, and remains 1/2 when she learns the bet is on Monday.
  The Thirder says her credence is 1/3 upon waking, and updates to 1/2 when she learns the bet is on Monday.

  To decide between them, we must look not at wallets, but at how beliefs change when information is revealed.

  ### The Monday Test

  Here is the decisive argument. Imagine the standard experiment. Beauty wakes up. She is asked for her credence in Heads. She gives an answer. Then, immediately after, the experimenters tell her: "By the way, today is Monday."

  How should her credence change?

  Let's trace the Bayesian update. We need to compare the likelihood of the evidence ("It is Monday") under the two hypotheses (Heads and Tails).
  1.  **If Heads:** Beauty wakes only on Monday. The probability that "It is Monday" given Heads is **1**.
  2.  **If Tails:** Beauty wakes on Monday and Tuesday. From her perspective, upon waking, she could be in either awakening. The probability that "It is Monday" given Tails is **1/2**.

  This means the statement "It is Monday" is evidence *for* Heads. It is more likely to be said in a Heads world than in a Tails world. Learning it is Monday should increase her confidence in Heads relative to Tails.

  Now, let's apply this to the two camps.

  **The Thirder Consistency:**
  The Thirder starts with $P(Heads) = 1/3$ and $P(Tails) = 2/3$ upon waking.
  When she learns "It is Monday," she updates.
  $$P(Heads | Monday) = \frac{P(Monday | Heads) \times P(Heads)}{P(Monday)}$$
  $$P(Heads | Monday) = \frac{1 \times (1/3)}{1 \times (1/3) + (1/2) \times (2/3)} = \frac{1/3}{2/3} = 1/2$$
  The Thirder starts at 1/3, receives evidence favoring Heads, and updates to 1/2. This is perfect. It aligns with the intuition that once we rule out the Tuesday awakening, we are back to a fair coin scenario.

  **The Halfer Incoherence:**
  The Halfer starts with $P(Heads) = 1/2$ and $P(Tails) = 1/2$ upon waking.
  When she learns "It is Monday," she must update using the same likelihoods (since the protocol hasn't changed).
  $$P(Heads | Monday) = \frac{1 \times (1/2)}{1 \times (1/2) + (1/2) \times (1/2)} = \frac{1/2}{3/4} = 2/3$$
  The Halfer starts at 1/2, receives evidence that it is Monday, and concludes that Heads is now *more* likely than Tails ($2/3$).

  This is absurd. Learning that it is Monday cannot bias a fair coin flip that occurred on Sunday. If you tell Beauty it is Monday, she should return to the prior probability of the coin (1/2), not skew it toward Heads. The only way for the Halfer to avoid this $2/3$ result is to claim that learning "It is Monday" provides *no* evidence for Heads over Tails. But that requires claiming that $P(Monday | Heads) = P(Monday | Tails)$. This implies that on Tails, the probability of it being Monday is 1. But on Tails, there is also a Tuesday. To say the probability of "It is Monday" is 1 on Tails is to deny the existence of the Tuesday awakening from Beauty's perspective, which contradicts the setup of the problem.

  The Halfer is trapped. Either they accept that learning it is Monday makes Heads more likely than Tails (which is irrational), or they must deny that "It is Monday" is relevant evidence (which violates the probability calculus). The Thirder faces no such dilemma.

  ### The Halfer's Mistake: Ignoring Indexical Evidence

  Why do Halfers fall into this trap? They conflate the *probability of the proposition* with the *probability of the experience*.

  The Halfer argues: "Beauty knew on Sunday that she would wake on Monday. So waking on Monday gives her no new information." This is the "Standard Halfer" move. It sounds plausible but is subtly wrong. Beauty knew she would wake on Monday *at some point*. She did not know that *this specific conscious experience* was the Monday one.

  In self-locating contexts, "I am here now" is a piece of data. When Beauty wakes, she learns "I am experiencing an awakening." Since there are three possible awakenings in the experiment ($H$-Mon, $T$-Mon, $T$-Tue) and only one involves Heads, the probability is 1/3.

  The Halfer treats the coin flip as the only source of uncertainty. They treat the day as irrelevant noise. But for Beauty, the day is part of her evidence. By ignoring the indexical information ("Which awakening is this?"), the Halfer breaks the link between evidence and belief. They preserve the fairness of the coin at the cost of the rationality of the agent.

  ### Addressing the "Ambiguity" Defense

  Some philosophers suggest the debate rests on an ambiguity in "credence." Perhaps there is "coin-credence" (1/2) and "awakening-credence" (1/3), and both are valid depending on what question you ask.

  This is a diplomatic surrender, not a solution. Credence is defined as a guide to action and belief update. If a belief system cannot update correctly when told "It is Monday," it is broken. We cannot have two credences for the same proposition ("The coin is Heads") held by the same agent at the same time. If Beauty is asked to place a bet, she needs one number. If she is asked to predict the future, she needs one number.

  If we allow "credence" to be ambiguous, we allow agents to be Dutch-booked in their own reasoning. The Thirder position subsumes the Halfer intuition: it acknowledges the coin is fair (evidenced by the update to 1/2 on Monday) while respecting the frequency of experience (the 1/3 upon waking). The Halfer position cannot subsume the Thirder intuition without breaking Bayesian math.

  ### Conclusion

  The Sleeping Beauty problem is not a paradox; it is a test of whether we treat self-locating information as real evidence.

  When Beauty wakes, she is in one of three indistinguishable situations: Heads/Monday, Tails/Monday, or Tails/Tuesday. Only one of these is Heads. Her credence should be 1/3.

  The Halfer position fails because it cannot account for the information gain of learning it is Monday without implying that the day of the week biases the coin flip. The Thirder position handles the update perfectly: starting at 1/3, conditioning on Monday, and arriving at the fair coin probability of 1/2.

  Rationality requires that our beliefs update coherently. Since only the Thirder view allows Beauty to learn it is Monday without becoming irrational about the coin, the Thirder view is the only viable option. Beauty should open her eyes, look at the white ceiling, and believe with 1/3 confidence that the coin landed Heads. Anything else is a failure to account for where she is in the story.
