prompt: |-
  I'm a programming language theorist — I work on type systems, denotational semantics, that sort of thing. I've been trying to wrap my head around the Frege-Geach problem for expressivism. Here's what I gather: expressivists think moral sentences like "murder is wrong" don't state facts but express attitudes (like disapproval). The problem is these sentences also show up embedded — "If murder is wrong, then stealing is wrong," "Murder is not wrong," "Is murder wrong?" — and in those positions the attitude doesn't seem to be expressed in the same way. So the expressivist needs a compositional account: the meaning of a complex sentence should be a function of the meanings of its parts, but the "meanings" of atomic moral sentences are supposed to be attitudes, not truth-conditions.

  Restate this whole problem in the vocabulary I actually use: compositional semantics, expression types, denotations, evaluation contexts, syntactic forms vs semantic values — whatever you need from PL theory. I want to see what the Frege-Geach problem looks like when you treat moral language as a formal language and ask how to define its semantics. Then give me a residue report: what translates cleanly, what you had to fudge, and whether anything in the philosophers' debate has no counterpart in PL semantics. My hunch is that this is basically the problem of giving a denotational semantics for a language whose atomic expressions have non-truth-conditional semantic values, and that PL theory has already solved this — but I want to know if I'm missing something, or wether the philosophers are just confused.
