answer: |-
  This is a fascinating translation task. You are essentially asking to map a meta-ethical problem onto the semantics/pragmatics interface in programming language theory.

  Your hunch is partially correct: PL theory has robust mechanisms for handling non-truth-conditional semantic values (effects, continuations, monads). However, the philosophical "residue" lies not in the *mechanics* of composition, but in the *justification of inference*.

  Here is the Frege-Geach problem restated in your vocabulary, followed by the residue report.

  ---

  ### Part 1: The Frege-Geach Problem as a Semantic Type Error

  Let us define a formal language $\mathcal{L}_{moral}$ for moral discourse.

  #### 1. Syntax
  We have a standard set of syntactic forms $e \in \text{Expr}$:
  *   **Atomic:** $a \in \text{Atom}$ (e.g., `"Murder is wrong"`).
  *   **Compound:** $e_1 \to e_2$, $\neg e$, etc.

  #### 2. The Expressivist Semantic Assignment
  In a standard truth-conditional semantics (Realism), we define a denotation function $\llbracket \cdot \rrbracket$ mapping expressions to a domain of propositions $D_{prop}$ (typically functions from worlds to bools, or sets of worlds).
  $$ \llbracket a \rrbracket \in D_{prop} $$
  $$ \llbracket e_1 \to e_2 \rrbracket = \llbracket e_1 \rrbracket \Rightarrow \llbracket e_2 \rrbracket $$

  The **Expressivist** claims that atomic moral sentences do not denote propositions. Instead, they denote **Attitudes** (mental states or speech acts). Let $D_{att}$ be the domain of attitudes (e.g., plans, disapproval states, normative commitments).
  $$ \llbracket a \rrbracket \in D_{att} $$

  #### 3. The Compositionality Constraint
  We require the semantics to be compositional. For a conditional operator `cond`, there must exist a semantic function $F_{cond}$ such that:
  $$ \llbracket \text{cond}(e_1, e_2) \rrbracket = F_{cond}(\llbracket e_1 \rrbracket, \llbracket e_2 \rrbracket) $$

  #### 4. The Type Mismatch (The Problem)
  In classical logic (and standard PL semantics for logic), the conditional operator is defined over propositions. Its semantic function expects inputs of type $D_{prop}$:
  $$ F_{cond} : D_{prop} \times D_{prop} \to D_{prop} $$

  However, under Expressivism:
  1.  $\llbracket a \rrbracket \in D_{att}$
  2.  Therefore, $F_{cond}(\llbracket a \rrbracket, \dots)$ is a **type error**.

  #### 5. The Equivocation Bug
  To fix the type error, the Expressivist might try to overload the denotation based on evaluation context (asserted vs. embedded).
  *   **Top-level (Asserted):** $\llbracket a \rrbracket_{top} \in D_{att}$ (Expresses attitude).
  *   **Embedded (Unasserted):** $\llbracket a \rrbracket_{emb} \in D_{prop}$ (Contributes to truth conditions).

  This breaks **context-independence of meaning**. In PL terms, the identifier $a$ does not have a fixed semantic value; its value depends on the stack frame or evaluation context. This makes the logic unsound because the $a$ in the premise $P$ and the $a$ in the premise $P \to Q$ now have different denotations. Modus Ponens becomes an equivocation fallacy:
  $$ \frac{\Gamma \vdash a : \text{Att} \quad \Gamma \vdash a \to b : \text{Prop}}{\Gamma \vdash b : \text{Att}} \quad \text{(Type Mismatch / Invalid)} $$

  ---

  ### Part 2: Residue Report

  Here is the analysis of what maps cleanly from meta-ethics to PL theory, where the friction lies, and what has no counterpart.

  #### 1. What Translates Cleanly
  *   **Compositionality:** The demand that the meaning of the whole be a function of the parts is identical to the principle of compositional semantics in PL.
  *   **Embedding Contexts:** The distinction between "asserted" (top-level execution) and "embedded" (inside a lambda or conditional) maps perfectly to the distinction between **Commands** and **Expressions**, or **Computations** and **Values**.
  *   **The Type Error:** The core logical problem is precisely a static type mismatch. You are trying to pass an effectful computation (expressing an attitude) into a position expecting a pure value (a truth condition).

  #### 2. What Requires "Fudging" (Conceptual Friction)
  *   **The Nature of $D_{att}$:** In PL, semantic domains are mathematical objects (CPOs, sets, categories). In Expressivism, $D_{att}$ is supposed to be psychological (states of mind) or pragmatic (speech acts). PL semantics usually abstracts *away* from the physical/psychological act of evaluation to the mathematical result. Expressivism insists the *act* is the meaning. To model this in PL, you have to treat "printing to stdout" or "updating global state" as the semantic value, which is non-standard for declarative languages.
  *   **Logical Validity vs. Type Safety:** In PL, if the types check, the program runs. In ethics, the goal is to show that the inference is *rationally binding*. Even if you fix the type error (see below), you still have to explain why an agent *ought* to align their attitudes according to the semantic function $F_{cond}$. PL semantics explains *what* a program means; it rarely prescribes *why* a programmer is rationally compelled to accept the output.

  #### 3. What Has No PL Counterpart
  *   **The Normative Force of Logic:** This is the biggest residue. In PL, logic is descriptive of the system. In meta-ethics, logic is normative for the agent. The Frege-Geach problem isn't just "how do we parse this?" it is "why is it *irrational* to disapprove of murder, accept the conditional, but not disapprove of stealing?" PL theory has no concept of "irrationality" in the semantics, only "type error" or "runtime exception."
  *   **Quasi-Realism:** Philosophers like Simon Blackburn try to have it both ways: the semantics are expressivist, but the language *behaves* as if it were realist (truth-conditional). In PL, this is like having a language that compiles to side-effecting machine code but provides a purely functional interface that guarantees referential transparency. It's possible (via Monads), but the philosophical claim is that the functional interface *isn't a fiction*—it's genuinely how we reason.

  ---

  ### Part 3: Verdict on Your Hunch

  > *My hunch is that this is basically the problem of giving a denotational semantics for a language whose atomic expressions have non-truth-conditional semantic values, and that PL theory has already solved this.*

  **Verdict:** You are **technically correct**, but **philosophically incomplete**.

  PL theory *has* solved the compositionality problem for non-truth-conditional values. We have at least three mature frameworks that solve the "Frege-Geach Type Error":

  1.  **Monadic Semantics:**
      Treat moral sentences as having type $M(\text{Prop})$, where $M$ is a monad representing the "expressive effect."
      *   Atomic: $\llbracket a \rrbracket : \text{Attitude}$
      *   Conditional: $\llbracket A \to B \rrbracket : (\text{Attitude} \to \text{Attitude}) \to \text{Attitude}$
      *   This allows embedding without collapsing the attitude into a truth value. (See: **Blackburn's Expressive Logic**).

  2.  **Call-By-Push-Value (CBPV):**
      Distinguish strictly between **Values** (truth-conditions) and **Computations** (attitude expressions).
      *   Atomic moral sentences are Computations.
      *   Logical connectives operate on Values.
      *   The "embedding" is a thunking operation: we suspend the expression of the attitude to manipulate its content.

  3.  **Continuation-Passing Style (CPS):**
      Treat an attitude not as a value, but as a continuation (a function from the rest of the world/state to a result).
      *   $\llbracket a \rrbracket = \lambda k. \text{disapprove}(\text{murder}); k()$
      *   Embedding captures the continuation $k$ without executing the side effect immediately.

  **Where the Philosophers are Not Confused:**
  The philosophers know these technical solutions exist. Their debate is not about *whether* you can construct such a semantics (you can). Their debate is about **explanatory adequacy**.

  In PL, if I define a Monad for State, I don't need to justify *why* the state transitions follow the monad laws other than "it models the hardware."
  In Ethics, the Expressivist must explain why the **logic of attitudes** mirrors the **logic of propositions**.
  *   Why does $F_{cond}$ have the truth-table of material implication if its inputs are feelings?
  *   If $\llbracket a \rrbracket$ is a plan, why does Modus Ponens preserve "plan-consistency" in the same way it preserves truth?

  **The "Missing" Theorem:**
  PL theory lacks a counterpart to the **Gibbard-Blackburn Theorem** (informal). Philosophers are looking for a proof that:
  $$ \text{Semantics}(D_{att}) \implies \text{Normativity}(\text{Inference Rules}) $$
  PL gives you $\text{Semantics}(D_{att}) \implies \text{TypeSafety}(\text{Inference Rules})$.

  **Conclusion:**
  The Frege-Geach problem is indeed a problem of **compositional semantics for effectful expressions**. PL theory provides the *syntax and semantic machinery* to solve it (Monads/CBPV). However, the philosophical problem includes a **normative constraint** (why these semantics bind rational agents) that has no direct counterpart in PL semantics, which is typically descriptive.

  If you treat moral language as a DSL for configuring a rational agent's state machine, the problem is solved. If you treat it as a language describing objective constraints on rationality, the PL semantics alone doesn't bridge the gap from "is" (semantic value) to "ought" (logical commitment).
