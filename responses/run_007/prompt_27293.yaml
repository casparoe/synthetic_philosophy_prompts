answer: |-
  Your intuition is tracking a specific, well-defined decision-theoretic framework. You have essentially rediscovered **Superrationality** (a term coined by Douglas Hofstadter) or, in modern academic terms, **Functional Decision Theory (FDT)**.

  Your tentative principle is sound, but it needs a slight adjustment to handle the Newcomb case consistently. Here is the precise formulation, the test against your five cases, and the resolution of the dominance paradox you identified.

  ### The Principle: Symmetric Superrationality

  **Statement:** In a decision problem where you have common knowledge that other agents are running the same decision algorithm as you (logical correlation), choose the output $s$ that maximizes your expected utility conditional on **all** symmetric agents outputting $s$.

  **Mathematical Form:**
  Let $U(s_1, s_2, ..., s_n)$ be the utility function.
  Let $A$ be your decision algorithm.
  If you know that for all other players $i$, their algorithm $A_i \equiv A$:
  $$ \text{Choose } s \text{ to maximize } E[U(s, s, ..., s)] $$

  **Key Distinction:** This differs from Nash Equilibrium. In Nash, you optimize given *what others are doing*. In Superrationality, you optimize given *what others must do because they are you*.

  ---

  ### Testing the Principle Against Your Cases

  Here is how Symmetric Superrationality (SSR) evaluates your five verdicts.

  #### 1. Platonia Dilemma
  *   **Your Verdict:** Randomize 1/20.
  *   **SSR Verdict:** **Saved.**
  *   **Analysis:** If everyone sends, payoff is 0. If everyone stays silent, payoff is 0. If everyone adopts a mixed strategy "Send with probability $p$," the group expected utility is maximized when the probability of exactly one sender is maximized. For $N=20$, this occurs at $p=1/20$.
  *   **Why:** You correctly identified that "Sending" is not an isolated act; it is a signal to your algorithmic twins. If your algorithm outputs "Send," theirs does too.

  #### 2. The Luring Lottery
  *   **Your Verdict:** Randomize participation (play with prob $1/N$).
  *   **SSR Verdict:** **Saved.**
  *   **Analysis:** If everyone submits 1 entry, the prize is $M/N$ and your win chance is $1/N$, so $EV = M/N^2$. If everyone randomizes participation with $p=1/N$, the expected number of players is 1. If exactly one plays (which happens with significant probability), the prize is $M$ and win chance is 1. Your personal $EV$ becomes roughly $(1/N) \times M = M/N$.
  *   Since $M/N > M/N^2$, SSR dictates restricting the field via randomization rather than everyone playing safely. Your intuition to treat this like Platonia is mathematically correct under SSR.

  #### 3. Newcomb's Problem (Simulation Variant)
  *   **Your Verdict:** Two-Box.
  *   **SSR Verdict:** **Overturned.**
  *   **Analysis:** You noted the tension: *"Why should symmetry among players' rationality matter in one and not the other?"* Under SSR, it **must** matter in both.
      *   If the Predictor is a simulation of you, it is running your algorithm.
      *   If your algorithm outputs "One-Box," the simulation outputs "Predict One-Box" $\rightarrow$ Box B has $1M.
      *   If your algorithm outputs "Two-Box," the simulation outputs "Predict Two-Box" $\rightarrow$ Box B has $0.
      *   SSR asks: "What if everyone (Me + Predictor) runs strategy $S$?"
      *   Strategy "One-Box" yields $1M. Strategy "Two-Box" yields $1,000.
      *   **The Conflict:** You are applying Causal Decision Theory (CDT) to Newcomb (focusing on causal dominance) but Superrationality to Platonia (focusing on logical correlation). **You cannot consistently hold both.** If symmetry justifies randomizing in Platonia despite weak dominance, symmetry justifies One-Boxing in Newcomb despite weak dominance.
  *   **Resolution:** To be consistent with your Platonia intuition, you must One-Box when the Predictor is a simulation.

  #### 4. Twin Prisoner's Dilemma
  *   **Your Verdict:** Cooperate.
  *   **SSR Verdict:** **Saved.**
  *   **Analysis:** If I Cooperate, my twin (running my code) Cooperates. Payoff: High. If I Defect, my twin Defects. Payoff: Low. SSR mandates Cooperation. This is the classic case for Superrationality.

  #### 5. Stag Hunt (Identical Reasoners)
  *   **Your Verdict:** Hunt Stag.
  *   **SSR Verdict:** **Saved.**
  *   **Analysis:** If I hunt Stag, identical others hunt Stag. Payoff: $1000. If I hunt Rabbit, identical others hunt Rabbit. Payoff: $900. SSR selects the Pareto-optimal equilibrium because symmetry guarantees coordination.

  ---

  ### The Dominance Paradox (Case 1 vs. Case 3)

  You asked: *"In case 1 sending weakly dominates staying silent... and yet I refuse to just send. In Newcomb I take both because two-boxing weakly dominates one-boxing. Those feel like the same structure and I land differently."*

  They **are** the same structure. Here is why your gut diverges, and why SSR says you should align them:

  1.  **Platonia:** You feel that "Sending" implies "Everyone Sends." You recognize that your decision is *logically linked* to the 19 others. You reject dominance because you know your action isn't causally isolated.
  2.  **Newcomb:** You feel that "Taking Both" gets the money in Box A *regardless* of what's in Box B. You treat the Predictor's action as *causally fixed* in the past.
  3.  **The SSR Correction:** If the Predictor is a simulation, its action is **not** causally fixed in the past; it is logically fixed in the present. Your current computation *is* the Predictor's computation.
      *   In Platonia, you intuitively grasp that $MyAction = TheirAction$.
      *   In Newcomb, you intuitively grasp that $MyAction \neq Predictor'sAction$ (temporal separation).
      *   SSR argues that **logical identity trumps temporal separation.** If the code is the same, the output is the same, regardless of when it runs.

  **Verdict:** To be consistent, you must either Two-Box in Newcomb *and* Send in Platonia (pure CDT), or One-Box in Newcomb *and* Randomize in Platonia (pure SSR/FDT). Mixing them creates the incoherence you feel.

  ---

  ### The Cost Variant of Platonia

  **Scenario:** 20 people. Win $1B if unique sender. **Cost:** $1 to send, win or lose.
  **Question:** What does SSR say?

  **Analysis:**
  SSR still applies, but the optimal probability $p$ shifts. You are no longer maximizing the probability of a unique sender; you are maximizing the *net expected value* per person.

  Let $N=20$, $V = 10^9$, $C = 1$.
  If everyone plays "Send with probability $p$":
  $$ EV(p) = [\text{Prob You Win}] \cdot (V - C) + [\text{Prob You Send & Lose}] \cdot (-C) $$
  $$ EV(p) = p(1-p)^{19}(V - 1) + p(1 - (1-p)^{19})(-1) $$
  $$ EV(p) = p(1-p)^{19}V - p $$

  We maximize this with respect to $p$.
  In the costless case ($C=0$), we maximize $p(1-p)^{19}$, which yields $p = 1/20$.
  With the cost term $-p$, the derivative includes a negative constant. This pulls the optimal $p$ downward.

  **Result:** SSR dictates you should still randomize, but **the die should have more than 20 sides.**
  You should be *more* conservative than in the costless case. The symmetry argument holds (you still can't pretend to be special), but the "tax" on sending means the group optimum requires less total sending activity.

  ### Summary of Your Decision Profile

  You are naturally a **Functionalist** (FDT/Superrational) but you have a lingering **Causalist** (CDT) habit regarding time.

  1.  **Principle:** Symmetric Superrationality. "Act as if your decision determines the output of all identical algorithms."
  2.  **Cases Saved:** Platonia, Lottery, Twin PD, Stag Hunt.
  3.  **Case Overturned:** Newcomb (Simulation Variant). To be consistent with Platonia, you must One-Box.
  4.  **Cost Variant:** Randomize, but with $p < 1/20$.

  Your gut is more consistent than you think; it's just your explicit justification for Newcomb that is lagging behind your intuition in Platonia. In both cases, the "dominance" argument fails because it assumes your action is independent of the other agent's state. In Platonia, you correctly see they aren't independent. In Newcomb (simulation), you must accept they aren't independent there either.
