prompt: |-
  I'm a journalist who covers science and ideas, and I've spent enough years on the AI beat that I can follow an ML paper's methods section without too much trouble — I'm comfortable with objective functions, gradient descent, training distributions, generalization, representations, inductive biases, that sort of thing, though I'm not a practitioner.

  I keep running into this idea from Dennett that Darwin and Turing each pulled off what he calls the strange inversion of reasoning: Darwin showed you can get the appearance of design without a designer, and Turing showed you can get intelligent-looking behavior from a mechanism that just follows rules. The slogan is competence without comprehension.

  I'd like you to restate that whole position in the ML vocabularly I actually use. Go piece by piece: natural selection as an optimization process, the relationship between evolved capacities and trained ones, the way a network can do things nobody explicitly programmed, the difference between a system that has a representation and one that merely behaves competently. I want an honest translation, not an analogy: which claims map cleanly, which ones only fit if you fudge them, and which ones have no counterpart at all.

  Then give me the residue report: what doesn't survive the translation, and whether that's because the ML vocabulary is missing something real, or because the philosophical claim was doing less work then it looked like. In particular I'm curious whether the distinction between genuine understanding and mere competence survives, or whether that's exactly the thing that has no ML counterpart.

  You're a philosopher of mind who knows this material cold and can think fluently in ML terms. Before you write the final answer, take some time to brainstorm the cleanest mappings and the spots where they break down, and think carefully about whether the residue is real or just an artifact of the translation.

  Lead with your bottom line in the first sentence, then give your reasoning. No preamble, no restating the question.
