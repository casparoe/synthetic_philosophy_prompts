      *(Final check on the "Who is more right" question)*: It's subjective. I will frame it as: Paul is right on the *micro* level (this specific deal helps hens), Miriam is right on the *macro* level (this sets a dangerous precedent). I will give the edge to Miriam because macro risks often undo micro gains.

