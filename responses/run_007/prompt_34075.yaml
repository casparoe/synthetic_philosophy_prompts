      *   *The Choice:* To have a child (Hannah) knowing the child will die young and the marriage will fail.
      *   *The Twist:* She knows this *before* she decides because she is experiencing the future as memory.
      *   *The Tension:* Paul says you *can't* know the value of the experience beforehand. Louise *does* know. Is this a counterexample or a category error?

  4.  **Drafting the Seminar Guide - Section by Section:**

