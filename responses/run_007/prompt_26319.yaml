answer: |-
  This is a classic dissertation bottleneck. You are stuck because the literature on interpersonal comparability (IC) is not a cumulative science; it is a series of overlapping language games where economists, ethicists, and psychologists talk past one another. The economists (post-Robbins) often define IC as impossible to avoid normative commitments, while the ethicists define it as necessary to avoid moral absurdity.

  To break the circle, you need to treat the desiderata not as "truths" but as **functional requirements**. A theory of IC is a tool. To evaluate the tool, we must ask: *What job is it hired to do?*

  Here is the breakdown of the desiderata, the tensions, and the litmus test you need for your chapter.

  ---

  ### Part 1: The Core Desiderata
  *What a theory of Interpersonal Comparability must deliver to count as adequate.*

  #### 1. The Action-Guidance Constraint
  *   **The Requirement:** The theory must yield verdicts that can discriminate between policy or moral choices in cases of conflict. It cannot simply say "A is better for Alice, B is better for Bob" without a rule for trading off Alice against Bob.
  *   **The Consideration:** If a theory of IC cannot resolve a conflict where one person gains and another loses, it is functionally identical to having no theory of IC at all. It fails the "use test" for welfare economics and distributive justice.
  *   **Status:** **Hard Constraint.** (Even ordinalists who reject IC usually admit this is why they retreat to Pareto criteria; if you claim to offer IC, you must beat Pareto in conflict cases).

  #### 2. The Epistemic Accessibility Constraint
  *   **The Requirement:** There must be a specified method or evidence base by which a third party (a planner, a judge, a scientist) can verify the comparison. It cannot be a fact that is metaphysically real but empirically inaccessible.
  *   **The Consideration:** If the truth of "Alice suffers more than Bob" is locked inside their souls with no external correlate, the theory is politically inert. We cannot build institutions on private revelations.
  *   **Status:** **Hard Constraint for Policy/Economics;** **Camp-Specific for Metaphysics.** (A pure moral realist might argue the fact exists even if we can't know it, but for a dissertation on *accounts* of utility, this is usually a hard constraint).

  #### 3. The Structural Richness Constraint (Cardinality & Level)
  *   **The Requirement:** The theory must specify the mathematical structure of the comparison. Is it merely ordinal (who is better off)? Is it unit-comparable (how much better)? Is it level-comparable (where is the zero point)?
  *   **The Consideration:** Different normative theories require different structures. Utilitarianism requires unit comparability (to sum). Prioritarianism requires level comparability (to weight the worse off). Rawlsianism arguably only needs ordinal level comparability.
  *   **Status:** **Camp-Specific.** (This is where the fighting happens. Preference ordinalists reject this; Hedonic realists embrace it).

  #### 4. The Phenomenological Fit Constraint
  *   **The Requirement:** The metric must track what it *feels like* to be the subject (or what the subject values), rather than tracking an external proxy that diverges from the subject's perspective.
  *   **The Consideration:** If a theory says a brainwashed slave is "better off" than a frustrated revolutionary because his preferences are satisfied, it violates the intuitive link between well-being and the subject's perspective.
  *   **Status:** **Camp-Specific.** (Preference-satisfaction theorists often sacrifice this for objectivity; Hedonists/Capability theorists prioritize this).

  ---

  ### Part 2: Addressing Your Specific Stuck Points

  You asked four specific questions. Here is how they map onto the desiderata above.

  **1. Does it need to recover intuitive comparisons ("She suffers more") or can it revise them?**
  *   **Verdict:** It is allowed to revise them, **but** it must explain the error theory.
  *   **Analysis:** If your theory says "Actually, the person screaming in pain is not suffering more than the person calmly tolerating mild annoyance," you have violated *Phenomenological Fit*. You can do this (e.g., if you are a strict preference theorist and the screaming person *prefers* to scream), but you incur a high justificatory burden. You must explain why folk psychology is wrong.
  *   **Classification:** **Soft Constraint.** Revisionism is permitted (e.g., Sen's Capability approach revises utility metrics), but radical revisionism risks changing the subject from "well-being" to "something else."

  **2. Does it need to ground comparisons in something publicly observable?**
  *   **Verdict:** Yes, for any theory claiming practical application (*Epistemic Accessibility*).
  *   **Analysis:** First-person report is necessary but not sufficient (people lie, lack self-knowledge, or lack vocabulary). Purely third-person observation (behavior) is insufficient (the "happy slave" problem).
  *   **Classification:** **Hard Constraint for Economics/Policy;** **Debated for Philosophy.** Neuroscience-of-valence tries to bridge this by making the first-person state publicly observable via fMRI/EEG. If a theory relies *only* on private introspection, it fails the Action-Guidance constraint.

  **3. Does it need to specify a neutral level (zero point)?**
  *   **Verdict:** Only if the normative theory requires summation across populations.
  *   **Analysis:** For standard distributive justice (allocating resources among existing people), you only need differences (unit comparability). You need a zero point (level comparability) for **Population Ethics** (Is it better to add a happy person?) or **Prioritarianism** (Is this person below the threshold of sufficiency?).
  *   **Classification:** **Camp-Specific.** If your chapter focuses on standard welfare economics, you can bracket this. If it touches on population ethics or suffering-focused ethics, it is a **Hard Constraint**.

  **4. What about cross-species or different cognitive architectures?**
  *   **Verdict:** This is the stress test for *Epistemic Accessibility*.
  *   **Analysis:** Preference satisfaction fails here (do ants have preferences?). Hedonism works better (do ants feel pain?). Capability fails (do fish have functionings?). If your theory cannot compare a human to a dog, it is likely too dependent on human-specific linguistics or rationality.
  *   **Classification:** **Nice-to-Have for Economics;** **Hard Constraint for Comprehensive Ethics.** If you claim to have a theory of *well-being* (not just *consumer choice*), excluding non-rational agents is a major bug.

  ---

  ### Part 3: The Tension Map (Joint Unsatisfiability)

  This is the section that will give your chapter teeth. You cannot satisfy all desiderata simultaneously. You must choose which constraint to relax.

  **Tension 1: The Robbins Trade-off (Objectivity vs. Comparability)**
  *   **The Conflict:** Lionel Robbins (1932/1938) argued that to maintain scientific objectivity (public observability of preference), we must reject interpersonal comparability. To accept comparability, we must embrace metaphysical claims about mental states that are not publicly observable.
  *   **The Unsatisfiability:** You cannot have **Strict Behaviorism** + **Full Interpersonal Comparability**.
  *   **The Choice:** Modern neuro-economics tries to solve this by making mental states public (via brain scans). Preference theorists solve it by denying IC. Hedonic realists solve it by accepting the metaphysics.

  **Tension 2: The Sovereignty Trade-off (Respect vs. Paternalism)**
  *   **The Conflict:** If you respect individual evaluative perspectives (Subjective Sovereignty), you cannot compare them because scales differ. If you impose a common scale (Objective Metric), you violate Subjective Sovereignty.
  *   **The Unsatisfiability:** You cannot have **Radical Subjectivism** + **Interpersonal Comparability**.
  *   **The Choice:** Capability theorists (Sen/Nussbaum) choose a middle path: Objective list, but weighted by individual valuation. Hedonists choose the Objective Metric. Economists choose Radical Subjectivism (and drop IC).

  **Tension 3: The Precision Trade-off (Universality vs. Specificity)**
  *   **The Conflict:** The more precise your metric (e.g., "dopaminergic firing rates in the nucleus accumbens"), the less universal it is (doesn't apply to AI, aliens, or simple organisms). The more universal your metric (e.g., "preference satisfaction"), the less precise/observable it is.
  *   **The Unsatisfiability:** You cannot have **Maximum Precision** + **Maximum Scope**.
  *   **The Choice:** Neuroscience views sacrifice scope for precision. Preference views sacrifice precision for scope.

  ---

  ### Part 4: The Litmus Test

  You asked for the single desideratum that does the most work in ruling out approaches.

  **The Litmus Test: Epistemic Accessibility (The "Evidence Constraint")**

  *   **The Question:** "Specify the evidence required to verify the claim 'Alice gains more utility than Bob' without relying on Alice or Bob's own testimony."
  *   **Why this rules out the dead views:**
      1.  **Kills "Magic Realism":** It rules out philosophical views that say "IC is metaphysically real but we can never know it." (If we can't know it, it can't guide action).
      2.  **Kills Hard Ordinalism:** It forces ordinalists to admit they *cannot* pass the test, thereby clarifying that their view is a *rejection* of IC, not a theory *of* IC.
      3.  **Kills Naive Hedonism:** It rules out versions of hedonism that rely on "private qualia" without a public correlate.
      4.  **Favors the Contenders:** It leaves standing only the views that have an evidence base:
          *   **Neuroscience:** Evidence = Brain states.
          *   **Behavioral Welfare:** Evidence = Choice data + Nudges (though this struggles with the Robbins Trade-off).
          *   **Capability:** Evidence = Functioning achievement (though this struggles with the Sovereignty Trade-off).

  **How to use this in your chapter:**
  Frame the debate not as "Which theory is true?" but "Which theory can clear the Epistemic Accessibility bar without collapsing into the Robbins Trade-off?"

  If a proponent of Preference Satisfaction says, "We compare preferences," you ask: "How do you measure the *intensity* of preference across persons without invoking mental states?" If they can't answer, they fail the Litmus Test. If a Hedonist says, "We compare pleasure," you ask: "How do you measure it without relying on self-report?" If they point to neuroscience, they pass, but inherit the Scope limitation.

  ### Summary Advice for the Chapter
  1.  **Stop looking for consensus.** There is none. Explicitly state that the literature is fragmented because different camps prioritize different desiderata.
  2.  **Map the Trade-offs.** Your contribution isn't solving IC (nobody has); it's clarifying *which desideratum* each theory sacrifices to make its model work.
  3.  **Use the Litmus Test.** Use Epistemic Accessibility to filter the "zombie" theories (theories that claim to allow comparison but offer no method to detect it) from the "live" theories.

  This structure allows you to stop going in circles. You aren't trying to find the *right* answer; you are evaluating the *cost* of each answer in terms of the desiderata it violates. That is a defensible, dissertation-level contribution.
