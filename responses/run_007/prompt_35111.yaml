answer: |-
  This is an exceptionally sharp observation, and you are right to feel that standard introductory labels (like the Frame Problem or the Doctrine of Double Effect) do not quite capture the specific texture of the difficulty. You have identified a genuine conceptual bottleneck in the literature on AI safety and normative ethics.

  While there is no single, canonical proper name for this specific knot (like "The Gettier Problem"), it is a recognized instance of a broader cluster of issues in the philosophy of action and metaphysics. In the philosophical literature, this is most precisely characterized as **The Problem of Causal Selection** (or **Causal Salience**), and in recent experimental philosophy, it is empirically demonstrated by **The Knobe Effect** (or **The Side-Effect Effect**). In the specific context of AI alignment, this is often discussed under the heading of **Ontology Mismatch** or the **Value-Ladenness of Impact Measures**.

  Here is a breakdown of how your "knot" maps onto existing philosophical territory, why your intuition about the Frame Problem was close but distinct, and how the literature attempts to characterize the difficulty.

  ### 1. The Philosophy of Action: Causal Selection and Salience
  Your intuition that one cannot define "side effects" without a prior specification of value is a classic problem in the metaphysics of causation.

  In their seminal work *Causation in the Law* (1959), H.L.A. Hart and Tony Honoré argued that the distinction between a "cause" and a mere "background condition" is not found in the physical world itself. Physically, every antecedent condition is equally necessary for an effect (via the *conditio sine qua non* principle). We distinguish the "cause" (e.g., the spark) from the "condition" (e.g., the presence of oxygen) based on **pragmatic or normative interests**.

  *   **The Connection:** To say an AI should minimize "impact" is to ask it to distinguish between *causal changes that matter* and *causal changes that do not*. But as Hart and Honoré showed, this distinction is interest-relative. Without a prior account of what matters (values), the AI has no principled way to select which causal ripples count as "impact" and which count as "noise."
  *   **The Name:** This is the **Problem of Causal Selection**. Your knot is the realization that causal selection cannot be done value-neutrally.

  ### 2. Experimental Philosophy: The Knobe Effect
  Your suspicion that the distinction between "task" and "side effect" relies on a "substantive picture of what is worth doing" has been empirically validated by Joshua Knobe.

  In a famous series of experiments (2003), Knobe presented subjects with scenarios where a chairman implements a policy to increase profits.
  *   **Case A:** The policy helps the environment (a good side effect). Subjects tend to say the chairman did *not* intentionally help the environment.
  *   **Case B:** The policy harms the environment (a bad side effect). Subjects tend to say the chairman *did* intentionally harm the environment.

  The physical causal structure is identical; only the moral valence changes. Yet, people's attribution of intentionality (and thus the distinction between the "main effect" and the "side effect") shifts based on moral judgment.

  *   **The Connection:** This suggests that the concept of a "side effect" is not a descriptive, value-neutral category. It is a **thick ethical concept**. You cannot define the side effect *before* you judge the value; the judgment of value helps constitute the description of the action.
  *   **The Name:** This is known as **The Knobe Effect** or **The Side-Effect Effect**. It supports your claim that low-impact AI proposals often implicitly smuggle in value judgments under the guise of neutral impact measures.

  ### 3. AI Safety Literature: Ontology Mismatch and Goodhart's Law
  In the specific context of AI alignment, this problem is often discussed, though sometimes fragmented across different technical terms.

  *   **Ontology Mismatch:** This refers to the gap between the AI's internal model of the world (e.g., atoms, pixels, state vectors) and the human ontology (e.g., relationships, institutions, welfare). An impact measure defined on atoms (value-neutral) fails because human values reside in the higher-level ontology. This is essentially your "absurdities" point (the AI refuses to move atoms, or moves the wrong ones).
  *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." If you target "minimize change in atomic configuration," the AI optimizes for that proxy, decoupling it from the actual goal (minimize harm to human flourishing).
  *   **The Specific Critique:** Some researchers (e.g., Armstrong, Levinstein, Krakovna) acknowledge this. They often frame it as the difficulty of defining a **Baseline** or **Counterfactual**. To measure impact, you must compare the AI's trajectory to a "default" trajectory. But defining the "default" requires knowing what the AI *would have done* if it weren't optimizing, or what humans would have done. This quickly runs into the same regress you identified: defining the default requires knowing what is "normal" or "permissible," which is a value judgment.

  ### 4. Relation to the Frame Problem
  You mentioned the Frame Problem and felt it wasn't quite right. You were correct to hesitate, but the connection is deep.

  *   **The Frame Problem** is roughly: *How do we represent what stays the same without explicitly listing everything?* It is an epistemic/computational problem about prediction.
  *   **Your Knot** is: *How do we represent what matters without explicitly listing all values?* It is a **Normative Relevance Problem**.

  Some philosophers of AI (like Daniel Dennett) have argued that the Frame Problem is actually a problem of **Relevance**. Your insight extends this: Relevance is inherently normative. Therefore, your knot is the **Normative Frame Problem**. It is the difficulty of bounding the set of consequences that need to be evaluated without already possessing the evaluative criteria.

  ### 5. Characterizing the Phenomenon
  If you were to write a paper on this, how should you characterize the phenomenon?

  **Boundaries:**
  The problem arises whenever a normative constraint (do no harm/minimize impact) is operationalized using a descriptive metric (physical change/state distance). It sits at the intersection of metaphysics (causation), philosophy of action (individuation of acts), and value theory.

  **What it is a special case of:**
  It is a special case of **The Is-Ought Problem** applied to causal modeling. You are trying to derive a normative constraint (ought to minimize impact) from a descriptive state space (is of atomic configurations), and you are finding that the derivation fails without a bridging principle (values).

  It is also a specific instance of **Proxy Optimization Failure**.

  **Dissolving the Difficulty:**
  You asked what it would take to *dissolve* the difficulty rather than solve an instance of it.
  To dissolve it, one would have to show that "Impact" is not a value-laden concept after all, or that there is a "thin" theory of value sufficient to ground it.
  *   **The "Attainable Utility Preservation" (AUP) Reply:** Proponents like Alexander Turner argue that we don't need to know *human* values, just that the AI should preserve its ability to achieve *a wide range of possible goals*. This attempts to ground impact in **power** (ability to achieve goals) rather than **welfare**.
  *   **The Counter-Reply:** Your knot applies here too. "Power" is also value-laden. Preserving the ability to make paperclips is "power" for a paperclip maximizer but "impact" (danger) for a human. Defining "attainable utility" still requires a distribution over utility functions, which is a value judgment.

  **Conclusion:**
  The conceptual pattern you have identified does not have a single famous name like "The Trolley Problem," but it is a robustly recognized tension. In philosophy, it is the **Value-Ladenness of Causal Selection** (supported by the **Knobe Effect**). In AI safety, it is the **Ontology Mismatch** inherent in **Impact Regularization**.

  Your intuition is correct: "Low Impact" is not a value-neutral workaround for the Alignment Problem. It is a different way of specifying values, one that risks hiding those values inside the definition of "change" or "baseline." The difficulty cannot be dissolved value-neutrally; it can only be managed by making the implicit value commitments of the impact measure explicit.

  **Suggested Reading for your Course:**
  1.  **Joshua Knobe**, "Intentional Action and Side Effects in Ordinary Language" (2003) — for the empirical basis of your intuition.
  2.  **H.L.A. Hart & Tony Honoré**, *Causation in the Law* (Chapter on "Principles of Selection") — for the metaphysical basis.
  3.  **S. Armstrong & B. Levinstein**, "Low Impact Artificial Intelligences" (2020) — to see how alignment researchers attempt to formalize this and where they acknowledge the baseline problem.
  4.  **A. M. Turner et al.**, "Optimal Policy Generalization in Power-Scale Environments" (on AUP) — to see the "power" based reply to your objection.
  5.  **C. K. Waters**, "Causes That Make a Difference" (2007) — A contemporary philosophical take on causal selection that might resonate with your "knot."

  You have effectively rediscovered a core tension in non-consequentialist ethics and action theory through the lens of AI safety. It is a sophisticated position to hold as a junior.
