      *   **The 1797 Essay ("On a Supposed Right to Lie..."):**
          *   Context: Response to Benjamin Constant. Constant argued truth-telling is a duty only to those who have a *right* to the truth. Kant rejects the "right to truth" framing but argues lying violates an internal duty.
          *   Key Distinction: *Ethics* (internal duty/virtue) vs. *Right* (external coercion/legal). The 1797 essay sits on the border. It's often classified under *Doctrine of Right* (legal liability) but touches on *Doctrine of Virtue*.
