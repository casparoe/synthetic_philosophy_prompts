answer: |-
  Your friend's summary is a very common representation of Kant's view, often found in introductory textbooks. It gets the *conclusions* mostly right but conflates different texts, arguments, and contexts in ways that a Kant scholar would find problematic. Specifically, it mixes the argument from the *Groundwork of the Metaphysics of Morals* (1785) with the argument from the late essay "On a Supposed Right to Lie from Philanthropy" (1797), and it treats a juridical (legal) argument as if it were purely an ethical one.

  Here is a breakdown of what is settled, what is a conflation, and what remains genuinely contested in the literature.

  ### 1. The Absolute Prohibition
  **Verdict: Settled Consensus**

  *   **What the friend got right:** It is the consensus view that Kant maintains a strict prohibition against lying (defined as an intentional untruthful assertion) in his mature work. There are no "emergency exceptions" built into his system.
  *   **Scholarly Nuance:** Scholars distinguish between *lying* (asserting what one believes to be false) and other forms of deception. Kant's prohibition is specifically against the *declaration* of untruth. While Kant is rigid on this, the definition of what constitutes a "declaration" is where some flexibility is sometimes found (see Section 5).

  ### 2. The Argument from Universalizability
  **Verdict: Conflation / Partially Mistaken**

  *   **What the friend got wrong:** The summary claims Kant's argument in the murderer case is that "if everyone lied... the practice of truth-telling would collapse." This is the argument from the *Groundwork* (specifically the example of the false promise to borrow money).
  *   **The Scholarly Correction:** In the 1797 essay "On a Supposed Right to Lie" (where the murderer case appears), Kant **does not** primarily use the universalizability test (Contradiction in Conception). Instead, he argues from the standpoint of **Right** (*Recht*) and **Duty to Oneself**.
      *   **Duty to Humanity:** Kant argues that lying violates a duty to humanity in one's own person. It makes the speaker an object of contempt and undermines their own dignity as a moral agent.
      *   **The Constant Context:** The essay is a response to Benjamin Constant, who argued that truth-telling is only a duty to those who have a *right to the truth*. Kant rejects the idea that truth-telling depends on the other person's rights. He argues lying is wrong *intrinsically*, regardless of the listener's entitlement.
  *   **Consensus:** Scholars agree that attributing the *Groundwork* "collapse of trust" argument to the 1797 Murderer case is a textual error, even if the sentiments are compatible.

  ### 3. The Murderer at the Door & Responsibility for Consequences
  **Verdict: Accurate, but Contextually Misunderstood**

  *   **What the friend got right:** Kant explicitly argues that if you lie to the murderer, and your lie inadvertently leads to the victim's death (e.g., the victim left without you knowing, and the murderer found them because of your misinformation), you are legally and morally accountable for the consequences. If you tell the truth, you are not accountable for the murderer's actions.
  *   **The Scholarly Correction (Ethics vs. Right):** This is the most critical distinction your friend's summary misses. The 1797 essay is not primarily a treatise on *virtue* (ethics); it is largely a treatise on *Right* (juridical liability).
      *   **Imputation:** Kant is arguing about **imputation** (*Zurechnung*). In a court of law, if you lie, you enter the chain of causality and become liable for unforeseen outcomes. If you tell the truth, the causal chain is broken by the murderer's free will.
      *   **Why this matters:** Scholars emphasize that Kant is not necessarily saying you are *more sinful* if the victim dies due to your lie. He is saying you become *liable* for the outcome in a way you are not if you tell the truth. The friend's summary presents this as a purely moral burden ("you are morally responsible"), whereas Kant frames it significantly as a matter of legal and causal accountability.
  *   **Consensus:** It is settled that Kant makes this argument about liability in the 1797 text. However, scholars debate whether this juridical argument is meant to ground the ethical prohibition or merely illustrate the dangers of violating public right.

  ### 4. "Collaborating with the Murderer"
  **Verdict: Contested Interpretation**

  *   **The Friend's Claim:** "Kant's ethics demands that you collaborate with a murderer."
  *   **Scholarly Pushback:** This is the most contested area. While Kant says you cannot *assert* a falsehood, does he demand you *assist* the murderer?
      *   **The "Silence" Loophole:** Many contemporary Kantians (e.g., Christine Korsgaard, Allen Wood) argue that Kant's prohibition is against *asserting* what is false, not against remaining silent or being evasive. If the murderer asks, "Is your friend inside?" one might say, "I am not telling you," or "That is not a question I will answer."
      *   **Textual Evidence:** In the 1797 essay, Kant writes that truthfulness is a duty in "declarations." Some scholars argue this implies that in contexts where there is no duty to make a declaration (e.g., to a hostile aggressor), one is not obligated to speak at all.
      *   **The Counter-View:** Other scholars (e.g., Thomas Hill) argue that Kant's text is too rigid for this. Kant seems to suggest that in a civil society context, one is obligated to answer truthfully to maintain the conditions of Right.
  *   **Status:** It is **contested** whether a consistent Kantian *must* reveal the location, or whether they can evade the question without lying. The friend's summary presents the "collaboration" view as settled, but modern scholarship often rejects this as a misreading of the scope of the duty.

  ### 5. Development and Consistency
  **Verdict: Genuinely Contested**

  *   **The Issue:** Is the 1797 essay Kant's final, considered view, or is it a polemic?
  *   **View A (Continuity):** Some scholars argue the 1797 essay is consistent with the *Groundwork* and *Critique of Practical Reason*. The strictness is a feature, not a bug, of respecting rational agency.
  *   **View B (Development/Regression):** Others argue the 1797 essay is a "hardening" of Kant's view, perhaps influenced by his aging or the specific political context of Prussian censorship at the time. Some suggest the *Lectures on Ethics* (transcribed by students) show a more flexible Kant who allowed for "necessary lies" in extreme cases, though the reliability of these lectures is always debated.
  *   **Status:** There is no consensus on whether the 1797 essay represents the definitive Kantian position or a specific argument tailored to refute Constant.

  ### Summary Map for Your Conversation

  If you want to correct your friend without being pedantic, here is the accurate map:

  1.  **On the Prohibition (Settled):** You are right that Kant forbids lying without exception in his mature published works.
  2.  **On the Argument (Correction):** You are citing the *Groundwork* argument (universalizability/trust), but the Murderer case comes from a later essay (1797) which argues from **dignity** and **legal liability**, not just the collapse of trust.
  3.  **On Responsibility (Nuance):** You are right that Kant says you are responsible for the consequences of a lie. However, scholars emphasize this is a **juridical** argument about legal liability (imputation), not just a claim that you are morally "worse."
  4.  **On Collaboration (Contested):** You claim Kant demands collaboration. Many Kant scholars argue Kant only forbids *asserting falsehoods*, not *speaking at all*. There is a live debate on whether silence or evasion is permissible, which might avoid the "collaboration" conclusion.
  5.  **On the System (Critique):** Your conclusion that "something is deeply wrong with the system" is a valid philosophical critique (made by Hegel, Mill, and others), but it relies on the interpretation that Kant leaves no room for silence. If the "silence loophole" holds, the system may be less counter-intuitive than it appears.

  ### Recommended Reading for Precision
  If you want to dig into the contested literature, the key texts to look at are:
  *   **Primary:** *On a Supposed Right to Lie from Philanthropy* (1797) and *The Doctrine of Virtue* (1797).
  *   **Secondary (Defending/Refining Kant):** Christine Korsgaard, "Kant's Analysis of Obligation: The Argument of the *Groundwork*"; Allen Wood, *Kant's Ethical Thought*.
  *   **Secondary (Critical):** Benjamin Constant, "On Political Reactions" (the original trigger); Bernard Williams, *Ethics and the Limits of Philosophy* (for the critique of the system).

  In short: Your friend has the "headline" right, but the "article" contains significant conflation of Kant's earlier and later arguments, and misses the crucial distinction between ethical duty and legal liability that drives the 1797 essay.
