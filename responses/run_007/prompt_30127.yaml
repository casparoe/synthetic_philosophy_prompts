answer: |-
  ### The Desiderata for a Theory of Scientific Change

  To evaluate Lakatos's Methodology of Scientific Research Programmes (MSRP), we must first establish the criteria of success. A theory of scientific change aims to explain the dynamics of knowledge without succumbing to the rigidity of naive falsificationism or the relativism of strong Kuhnianism. The following desiderata outline what such a theory must achieve, categorized by the phenomena it must explain, the distinctions it must draw, and the normative work it must perform.

  #### I. Phenomena to Explain
  *What the theory must account for in the actual history of science.*

  1.  **The Apparent Cumulative Progress of Mature Sciences**
      *   **Requirement:** The account must explain why later theories (e.g., General Relativity) are generally regarded as "better" or "more knowledgeable" than earlier ones (e.g., Newtonian Mechanics), despite the fact that all theories are technically falsifiable.
      *   **Motivation:** Without this, science collapses into mere opinion change. We need to explain the intuition that science *learns* about the world, rather than just swapping one myth for another.
  2.  **The Persistence of Anomalies Without Theory Abandonment**
      *   **Requirement:** The account must explain why scientists rationally retain a theory despite known counter-evidence (e.g., the orbit of Uranus before Neptune was discovered).
      *   **Motivation:** Naive falsificationism suggests a single counter-instance should kill a theory. History shows scientists rightly ignore anomalies temporarily to develop the theory further. A theory of change must accommodate this tenacity without labeling it irrational.
  3.  **The Coexistence of Rival Research Programmes**
      *   **Requirement:** The account must explain how competing frameworks (e.g., wave vs. particle theories of light) can coexist for long periods without one being immediately "falsified."
      *   **Motivation:** Scientific monism is historically false. Rivalry drives progress. An adequate account must explain the rationality of funding/supporting a minority programme that currently has more anomalies than the dominant one.
  4.  **The Occasional Rapid Overthrow of a Dominant Framework**
      *   **Requirement:** The account must explain "revolutions" where a dominant framework is abandoned relatively quickly (e.g., the shift from Phlogiston to Oxygen chemistry).
      *   **Motivation:** If theory tenacity is rational, why does abandonment ever happen? The theory must distinguish between *dogmatic* persistence and *rational* persistence, explaining the tipping point where abandonment becomes the rational choice.

  #### II. Distinctions to Draw
  *The conceptual tools the theory must provide.*

  5.  **Progressive vs. Degenerating Problemshifts**
      *   **Requirement:** The theory must provide a criterion to distinguish between changes that advance knowledge and changes that merely patch up holes (ad hocery).
      *   **Motivation:** Not all theory change is good. Without this distinction, we cannot explain why we prefer Einstein over Lorentz, even if both saved the phenomena. This is the core engine of Lakatos's rationality.
  6.  **Rational vs. Irrational Theory Choice**
      *   **Requirement:** The theory must allow us to judge whether a scientist's decision to stick with or abandon a theory was rational given the evidence available *at the time*.
      *   **Motivation:** To preserve the rationality of science, we must be able to say that scientists are not merely swayed by mob psychology, authority, or aesthetics, but by epistemic reasons.
  7.  **The Proper Unit of Appraisal**
      *   **Requirement:** The theory must identify whether we evaluate single hypotheses, whole theories, or historical lineages.
      *   **Motivation:** Evaluating single hypotheses leads to immediate falsification (Popper's problem). Evaluating "paradigms" (Kuhn) leads to incommensurability. A middle unit is needed to allow for longitudinal evaluation of success.

  #### III. Normative Work
  *The philosophical utility of the theory.*

  8.  **Demarcating Science from Non-Science**
      *   **Requirement:** The theory must provide a boundary between scientific research programmes and pseudoscientific or metaphysical ones (e.g., Astrology vs. Astronomy).
      *   **Motivation:** If everything is a "research programme," the concept loses critical bite. We need to know why Marxism or Psychoanalysis (in Lakatos's view) failed to progress scientifically.
  9.  **Retrospective Reconstruction (Without Whig History)**
      *   **Requirement:** The theory must allow us to reconstruct history rationally without judging past scientists solely by present knowledge (Whig history), while still maintaining that some past choices were objectively wrong.
      *   **Motivation:** We need to understand history as a rational process, not just a chronicle of errors. However, we cannot simply project current truths onto the past to explain why they were accepted.
  10. **Prospective Guidance (Without "Anything Goes")**
      *   **Requirement:** The theory must offer advice to working scientists on when to pursue a line of inquiry and when to cut losses, without being so rigid that it stifles discovery (Feyerabend's critique).
      *   **Motivation:** Methodology should be action-guiding. If a methodology only makes sense in hindsight, it is merely history, not a guide for future research.

  ***

  ### Classification of Desiderata

  Here we distinguish between requirements essential to the *project of Rationalism* itself, and requirements specific to *Lakatos's implementation* (MSRP) which are vulnerable to Naturalist or Sociological critique.

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. Cumulative Progress** | **[Rationalist Core]** | Any rationalist account must assert that science improves epistemically. Naturalists may accept this as a fact to explain; Sociologists of Scientific Knowledge (SSK) may reject it as a social construct. |
  | **2. Anomaly Persistence** | **[Rationalist Core]** | Required to save rationality from Naive Falsificationism. Naturalists accept this as behavior; Rationalists must justify it as *reasonable*. |
  | **3. Rival Coexistence** | **[Rationalist Core]** | Necessary to explain historical reality without claiming scientists were irrational for not converging immediately. |
  | **4. Rapid Overthrow** | **[Rationalist Core]** | Necessary to explain revolutions without resorting to "mob psychology" (Kuhn). |
  | **5. Progressive vs. Degenerating** | **[Lakatos Commitment]** | **Naturalists/SSK Reject.** While Rationalists need a distinction, Lakatos's specific criterion (novel predictions) is contested. Naturalists argue "progress" is defined by the community, not an objective logical metric. |
  | **6. Rational vs. Irrational Choice** | **[Rationalist Core]** | **Naturalists/SSK Reject.** This is the defining feature of Rationalism. Naturalists seek causal explanations, not rational justifications. SSK argues choices are socially determined, not logically compelled. |
  | **7. Unit of Appraisal (Programme)** | **[Lakatos Commitment]** | **Naturalists/SSK Reject.** Popper chose hypotheses; Kuhn chose paradigms. Lakatos's "Research Programme" is a specific theoretical construct. Naturalists argue the "unit" is fluid and defined by practice, not philosophy. |
  | **8. Demarcation** | **[Rationalist Core]** | **Naturalists/SSK Reject.** Most contemporary naturalists and sociologists reject the possibility of a sharp, ahistorical demarcation line. |
  | **9. Non-Whig Reconstruction** | **[Lakatos Commitment]** | **Naturalists/SSK Reject.** Lakatos's "Internal vs. External History" is a specific methodological move. Naturalists argue history is just history; "reconstruction" imposes artificial rationality on messy causal chains. |
  | **10. Prospective Guidance** | **[Rationalist Core]** | **Naturalists/SSK Reject.** Naturalists describe; they do not prescribe. The idea that philosophy should guide science is a normative claim Naturalists reject. |

  ***

  ### The Incompatibility: The "Lag Time" Dilemma

  The most critical failure point in any rationalist reconstruction of scientific change, and specifically in Lakatos's MSRP, lies in the tension between **Desideratum 9 (Retrospective Reconstruction)** and **Desideratum 10 (Prospective Guidance)**.

  **The Conflict:**
  To satisfy **Retrospective Reconstruction**, the criteria for "progress" must be flexible enough to accommodate the actual history of successful sciences. We know Newtonian mechanics was a progressive programme because it *eventually* led to great successes. Therefore, a rational reconstruction must allow us to look back and say, "Despite the anomalies in 1750, it was rational to stick with Newton."

  To satisfy **Prospective Guidance**, the criteria must be strict and decidable *in the present*. A scientist in 1750 needs to know *now* whether to stick with Newton or abandon him. The rule must be: "If a programme produces X, stay; if Y, leave."

  **Why They Cannot Be Jointly Satisfied:**
  1.  **The Hindsight Problem:** We can only definitively identify a "degenerating problemshift" in hindsight. A programme that looks degenerating (patching up anomalies without novel predictions) might suddenly produce a novel prediction ten years later (as Newtonian mechanics did with Neptune).
  2.  **The Guidance Gap:** If Lakatos admits that we cannot know if a programme is degenerating until it is superseded (to ensure Historical Accuracy), then the methodology offers **no Prospective Guidance**. A scientist cannot use MSRP to decide what to work on today, because the "court of appeal" only convenes after the trial is over.
  3.  **The Rigidity Trap:** If Lakatos tightens the rules to offer Guidance (e.g., "Abandon if no novel predictions in 5 years"), he violates **Historical Accuracy**. Many historically successful programmes would have been prematurely abandoned by such a rule, making the rational reconstruction "Whiggish" (judging the past by a rule that would have falsified the winners).

  **Conclusion on the Tension:**
  Lakatos attempts to solve this by claiming MSRP is a "court of appeal" rather than a set of instant rules. However, this concession effectively sacrifices **Desideratum 10 (Prospective Guidance)**. If the methodology cannot tell a scientist *now* whether their research is rational or degenerating, it fails to distinguish itself from a mere description of history. It saves Rationality (Desideratum 6) and History (Desideratum 9) by sacrificing Action (Desideratum 10).

  Thus, a theory of scientific change cannot simultaneously be a **faithful reconstruction of actual history** and a **decidable guide for future action**. The more accurately it maps the messy reality of scientific persistence (to avoid Whig history), the less it can tell a scientist what they ought to do tomorrow. This is the structural limit of the rationalist project Lakatos inherited.
