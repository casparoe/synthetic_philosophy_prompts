answer: |-
  1. Hard-constraint races involve actions that are physically costly to reverse, forcing opponents to concede, such as a general moving troops to a border where withdrawal invites attack.
  2. Simultaneous-move races force blind preemptive action because parties cannot observe who committed first, exemplified by drivers accelerating at a blind intersection to avoid yielding.
  3. Symmetric-stake races involve parties with equal interest in winning, driving mutual escalation despite shared losses, as seen in bidding wars where rivals spend beyond an item's value to avoid losing.
  4. Audience-cost races rely on public signaling rather than physical constraints, driving escalation when leaders fear looking weak, like politicians adopting extreme platforms to satisfy primary voters.
  5. Communication-constrained races involve inability to negotiate during escalation, such as rival gangs unable to talk during a turf war, whereas a theoretically possible race with perfect communication and costless reversal has no instances because costless coordination eliminates the incentive to compete.
