answer: |-
  You have put your finger on one of the most significant and debated distinctions in the philosophy of language and logic. Your intuitions are exactly right: these two sentences function differently, and sliding between them is a common source of error in reasoning.

  Here is the breakdown of the terminology, the diagnostics, and the contexts where the distinction matters (or dissolves).

  ### 1. The Names: Indicative vs. Subjunctive

  The standard grammatical and philosophical terms for this distinction are **Indicative Conditionals** and **Subjunctive (or Counterfactual) Conditionals**.

  *   **Indicative:** "If the gardener **didn't** do it, the butler **did**."
      *   *Grammar:* Uses standard tense (past/present/future indicative).
      *   *Function:* **Epistemic.** It operates on your current state of knowledge. It says, "Of the possible worlds compatible with what we know, none are such that the gardener didn't do it *and* the butler didn't do it." It eliminates possibilities.
  *   **Subjunctive/Counterfactual:** "If the gardener **hadn't** done it, the butler **would have**."
      *   *Grammar:* Uses backshifted tense (past perfect + modal "would").
      *   *Function:* **Ontic/Causal.** It operates on how the world works. It asks you to imagine a world where the gardener *didn't* do it (even though he did) and asks what *would* happen in that scenario based on causal laws, dispositions, or habits.

  Philosophers often refer to this as the difference between **learning** (Indicative: updating information) and **intervening** (Subjunctive: changing the past or the setup).

  ### 2. Standard Diagnostics

  In messy cases where grammar alone doesn't clarify the meaning, philosophers and linguists use several diagnostics to tell them apart.

  **A. The "Known False" Test**
  *   **Subjunctive:** You can comfortably use a subjunctive conditional even if you know the antecedent is false.
      *   *Example:* "If Oswald **hadn't** shot Kennedy, someone else **would have**." (We know Oswald did shoot him; we are debating the conspiracy/causal setup).
  *   **Indicative:** Using an indicative with a known false antecedent usually sounds infelicitous or changes the meaning.
      *   *Example:* "If Oswald **didn't** shoot Kennedy, someone else **did**." (This sounds like we don't know who shot him yet. If we *know* Oswald did it, this sentence feels wrong).

  **B. The Betting Test**
  *   **Indicative:** You can bet on an indicative based on current evidence.
      *   *Scenario:* A card is drawn from a deck and hidden. "If it's red, it's a heart." You can bet on this based on probability (50%).
  *   **Subjunctive:** You generally cannot bet on a counterfactual in the same way because it relies on causal stability, not just probability.
      *   *Scenario:* "If I *had* drawn a red card, it *would* have been a heart." This claims a specific causal or structural link, not just a statistical one.

  **C. The "Even If" Test**
  *   Subjunctives often tolerate "even if" better when the connection is robust against interference.
  *   *Indicative:* "If it rains, the match is cancelled." (Standard contingency).
  *   *Subjunctive:* "Even if it had rained, the match would have gone on." (Claims the causal mechanism of cancellation was disabled).

  ### 3. The Ambiguous Middle: "If You Press the Button"

  You noted: *"If you press that button, the bomb goes off."*

  This is a **Future Indicative**, and it is famously ambiguous because it sits on the fence.
  *   **Reading 1 (Predictive/Epistemic):** Based on my current knowledge of the wiring, I predict that pressing it triggers the bomb. (Indicative).
  *   **Reading 2 (Dispositional/Causal):** The bomb has a disposition such that in any nearby world where you press it, it explodes. (Subjunctive-like).

  **Why it shifts:**
  *   **Said before the press:** It functions as a warning/prediction (Indicative).
  *   **Said after (when you didn't press):** It functions as a claim about the machine's state (Subjunctive/Counterfactual: "If you *had* pressed it, it *would* have gone off").

  In linguistics, this is sometimes called the **open vs. closed** conditional. Before you press, the future is "open." After you don't press, the opportunity is "closed," forcing the interpretation toward the counterfactual.

  ### 4. The Argumentative Slide (The Fallacy)

  You observed people sliding from "If she was..." to "If she had been..." This is a recognized rhetorical move, often considered a fallacy of **equivocation**.

  **The Example:**
  1.  *Premise:* "If she **was** at the party, she **saw** the theft." (Indicative/Epistemic).
      *   *Meaning:* Given the layout of the room and where she was standing, her visual field included the theft.
  2.  *Conclusion:* "Therefore, if she **had been** at the party, she **would have seen** the theft." (Subjunctive/Causal).
      *   *Meaning:* Her presence *guarantees* observation.

  **Why it's a problem:**
  The first statement might be true simply because, as a matter of fact, the theft happened right in front of the spot where she stood.
  The second statement implies a robust causal link: that *anyone* in that spot would have seen it, or that she would have been looking in the right direction.
  *   *Counter-example:* She was at the party (true), but she was looking at her phone.
  *   The Indicative ("If she was... she saw") might still be accepted by a speaker who knows she was looking at her phone but is reasoning about *locations*.
  *   The Subjunctive ("If she had been... she would have seen") is clearly false if she was distracted.

  There isn't a single catchy name like "The Gardener Fallacy," but in formal logic and critical thinking, this is treated as **Modal Equivocation** or **shifting the modal base**. The speaker shifts from an *epistemic modal base* (what is known) to a *circumstantial/causal modal base* (how the world works).

  ### 5. Does the Distinction Ever Collapse?

  You asked if there are contexts where the distinction genuinely collapses. The answer is **yes**, but only in specific domains.

  **A. Mathematical and Logical Truths**
  *   *Indicative:* "If 2 + 2 = 5, then 4 + 4 = 10."
  *   *Subjunctive:* "If 2 + 2 *had been* 5, then 4 + 4 *would have been* 10."
  *   *Result:* These are effectively identical. Because mathematical truths are necessary, there is no difference between "worlds compatible with our knowledge" and "nearby possible worlds." The connection holds in all cases.

  **B. Strict Causal Laws (Generic Statements)**
  *   *Statement:* "If you heat ice to 10°C, it melts."
  *   Here, the indicative (prediction) and subjunctive (disposition) converge because the causal law is assumed to be invariant. However, even here, philosophers argue there is a subtle difference: the indicative allows for the possibility that *this* ice is fake, whereas the subjunctive asserts the nature of ice itself.

  **C. Biconditionals**
  *   Sometimes, pragmatic context strengthens an indicative into a biconditional ("If and only if").
  *   "If you press the button, the light goes on."
  *   In many contexts, we hear: "The light goes on *only* if you press the button."
  *   When a conditional is understood as a biconditional, the difference between "If P then Q" and "If not-P then not-Q" (which relates to counterfactuals) becomes less distinct in practice, though logically they remain different.

  ### Summary

  *   **Name:** Indicative (Epistemic) vs. Subjunctive/Counterfactual (Ontic/Causal).
  *   **Diagnostics:** Check if the speaker assumes the antecedent is false (Subjunctive) or agnostic (Indicative). Check if the claim is about *knowledge* (Indicative) or *causal mechanisms* (Subjunctive).
  *   **The Slide:** Moving from one to the other without justification is a **Modal Equivocation**. It is a very common rhetorical trick to make a weak epistemic claim sound like a strong causal law.
  *   **Collapse:** The distinction collapses in **necessary truths** (math/logic) but remains vital in **contingent empirical matters** (history, crime, physics).

  Your intuition that the "Gardener/Butler" case is about eliminating possibilities while the "Hadn't/Would Have" case is about causal commitment is the standard philosophical view (associated with theorists like Robert Stalnaker and David Lewis). You are analyzing language with the precision of a semanticist.
