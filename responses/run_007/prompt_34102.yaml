  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Semantics of Indicative and Counterfactual Conditionals
  **Parties:** The Unificationist Party (UP) and The Bifurcationist Party (BP)
  **Date:** 24 May 2024

  ## Preamble
  This document records the outcome of a structured adversarial collaboration between proponents of Unificationist and Bifurcationist accounts of conditionals. The aim is not to force a compromise, but to produce a precise map of the dialectical landscape. We distinguish settled common ground from substantive disagreement, identify the empirical and formal cruxes that could resolve the dispute, and isolate any portions of the debate that are merely verbal. All terminology follows standard usage in formal semantics and philosophy of language, rendered in British English.

  ---

  ## 1. Agreed Claims (Common Ground)
  The following claims are accepted by both parties. They constitute the data and constraints that any adequate theory must accommodate.

  1.  **The Oswald Divergence:** In a standard context where it is known that Oswald killed Kennedy and acted alone, the indicative conditional ('If Oswald didn't kill Kennedy, someone else did') is assessed as true, while the counterfactual conditional ('If Oswald hadn't killed Kennedy, someone else would have') is assessed as false. Any theory must account for this divergence in truth-value or assertibility.
  2.  **Modus Ponens:** Both indicative and counterfactual conditionals generally support Modus Ponens inference patterns in simple, unembedded contexts. Neither party claims that either construction systematically fails to license the inference from *If A, C* and *A* to *C*.
  3.  **World-Quantification:** Both constructions involve quantification over, or selection of, possible worlds or situations. Neither party advocates for a purely material implication analysis that ignores modal dimensions.
  4.  **Context Sensitivity:** The truth conditions or assertibility conditions of both constructions are sensitive to context. Specifically, the domain of worlds over which quantification occurs shifts depending on conversational background, salient evidence, or causal assumptions.
  5.  **Embedding Constraints:** Both constructions exhibit non-trivial behaviour when embedded under propositional attitude verbs (e.g., 'believe', 'know') and epistemic modals (e.g., 'might', 'must'). A theory that handles simple assertions but fails to predict behaviour in embedded environments is inadequate.
  6.  **Probabilistic Judgements:** Speakers readily assign subjective probabilities to indicative conditionals, broadly aligning with the Equation (P(If A, C) = P(C|A)). While speakers also assign probabilities to counterfactuals, the relationship between these judgements and conditional probability is less stable and more sensitive to causal structure.
  7.  **Morphological Marking:** In English and many Indo-European languages, counterfactuals are typically marked by past-tense morphology (or subjunctive forms) that does not always correlate with past time reference, whereas indicatives typically lack this specific marking.

  ---

  ## 2. Disagreements Table
  The following table isolates substantive disagreements. The 'Neutral Statement' column describes the point of contention without favouring either view.

  | # | Neutral Statement of Contention | Unificationist Formulation | Bifurcationist Formulation |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **The Source of Divergence**<br>Regarding the Oswald Divergence (Claim 1), is the difference located in the conditional operator itself or in the parameters supplied to it? | The divergence arises from a single conditional operator ($>$) taking distinct modal bases and ordering sources. The indicative accesses an epistemic modal base; the counterfactual accesses a metaphysical or causal base, often triggered by the past-tense morphology. | The divergence arises from two distinct logical operators ($>_{ind}$ and $>_{cf}$). The operators differ in their truth conditions, specifically regarding how they handle the antecedent's relationship to the actual world. |
  | **2.2** | **The Status of the Antecedent**<br>Does the grammar presuppose the factual status of the antecedent differently for the two constructions? | The difference is presuppositional. The counterfactual morphology triggers a presupposition that the antecedent is false (or unlikely) in the common ground. This is a pragmatic or semantic presupposition, not a difference in the core conditional logic. | The difference is truth-conditional. The counterfactual operator requires a 'distance' from actuality that is part of the truth conditions, not merely a presupposition. An indicative can be true even if the antecedent is known false, provided the epistemic connection holds. |
  | **2.3** | **Embedding under Epistemic Modals**<br>How do the constructions behave when embedded under 'might' or 'must'? | Behavioural differences under embedding are derived from the interaction of the single operator with the embedding modal's own modal base. Apparent scope differences are illusory or result from context-shifts. | Behavioural differences under embedding reveal distinct scopal properties. Counterfactuals resist taking scope under epistemic modals in ways that indicatives do not, indicating distinct syntactic-semantic architectures. |
  | **2.4** | **The Role of Tense**<br>What is the semantic contribution of the past-tense morphology in counterfactuals? | The past tense is a modal marker, not a temporal one. It shifts the evaluation time or the modal base to a context where the antecedent was open, but the core conditional relation remains invariant. | The past tense (or subjunctive) marks a distinct syntactic head that combines with a distinct conditional operator. It signals a shift in the world of evaluation that is intrinsic to the counterfactual operator's definition. |
  | **2.5** | **Sobel Sequences**<br>Do both constructions exhibit identical dynamic behaviour in Sobel sequences (e.g., 'If A, C; but if A and B, not C')? | Yes. Both constructions exhibit the same non-monotonicity. The apparent differences in Sobel sequences are due to how the context set is updated, which applies uniformly to the single operator. | No. Counterfactuals exhibit stricter constraints on Sobel sequences due to causal stability. Indicatives are more fluid, allowing context shifts that counterfactuals block. This suggests different update mechanisms. |

  ---

  ## 3. Cruxes
  The following are specific sub-questions. Settlement of these matters would compel at least one party to revise their position. We agree on what evidence would be relevant and record our prior predictions.

  ### Crux 3.1: Embedding under 'Know'
  *   **Question:** Can a counterfactual conditional serve as the complement of a factive verb like 'know' without infelicity, and does it pattern with indicatives?
  *   **Agreed Evidence:** Corpus analysis and acceptability judgements of sentences like 'John knows that if Oswald hadn't killed Kennedy, someone else would have' vs 'John knows that if Oswald didn't kill Kennedy, someone else did'.
  *   **UP Prediction:** Both are equally acceptable (or unacceptable) in contexts where the subject's knowledge state matches the modal base. The factivity of 'know' interacts with the presupposition, not the operator.
  *   **BP Prediction:** The counterfactual embedding is infelicitous or requires a distinct interpretation because 'know' requires truth in the actual world, which conflicts with the counterfactual operator's distance from actuality. The indicative embeds naturally.

  ### Crux 3.2: Probabilistic Coherence in Causal Models
  *   **Question:** In scenarios where epistemic probability and causal probability diverge (e.g., common cause structures), do speakers' probability judgements for counterfactualals track the causal model strictly, while indicatives track the epistemic model?
  *   **Agreed Evidence:** Experimental data (e.g., polling on vignettes involving barometers and storms, or smoking and cancer) asking for probability estimates of indicative vs. counterfactual conditionals.
  *   **UP Prediction:** Once the modal base is explicitly controlled for in the experiment, the divergence disappears. If subjects are forced to adopt a causal modal base for indicatives, their judgements converge with counterfactuals.
  *   **BP Prediction:** The divergence persists even when context is controlled. Indicatives default to evidential probability; counterfactuals default to interventional probability. This indicates two distinct cognitive systems.

  ### Crux 3.3: Cross-Linguistic Morphology
  *   **Question:** Do languages that lack specific past-tense/subjunctive morphology for counterfactuals still maintain a strict semantic distinction between the two types?
  *   **Agreed Evidence:** Fieldwork data from languages (e.g., certain Creoles or East Asian languages) where the morphological distinction is neutralised or absent.
  *   **UP Prediction:** In the absence of morphological marking, the distinction collapses or becomes purely pragmatic. A single operator is used, disambiguated only by context.
  *   **BP Prediction:** The semantic distinction remains robust regardless of morphology. Speakers will use other particles, word order, or context to enforce the bifurcation, because the conceptual distinction is logical, not morphological.

  ### Crux 3.4: The 'If A, A' Triviality
  *   **Question:** Is the conditional 'If A, had been the case, A would have been the case' trivially true?
  *   **Agreed Evidence:** Intuition pumps regarding reflexivity.
  *   **UP Prediction:** It is trivially true, just as 'If A, A' is for indicatives. The operator is reflexive; the modal base shift does not alter identity.
  *   **BP Prediction:** It may be infelicitous or non-trivial. Counterfactuals imply a departure from actuality; asserting the antecedent and consequent are identical in a non-actual world may require more than logical reflexivity (e.g., causal stability).

  ---

  ## 4. Identification of Verbal Dispute
  Both parties acknowledge that a portion of the dispute is verbal, specifically concerning the boundary between **semantics** and **pragmatics** (or more precisely, between the *lexical entry* and the *contextual parameter*).

  *   **The Issue:** The Unificationist proposes a single operator $>$ that takes a modal base $f$ as an argument ($>(f, A, C)$). The Bifurcationist proposes two operators, $>_{ind}$ and $>_{cf}$.
  *   **Why it is Verbal:** If the Unificationist's 'modal base' parameter is formally encoded and strictly determined by morphology (e.g., past tense *always* selects the counterfactual base), the resulting formal system is mathematically isomorphic to the Bifurcationist's two-operator system.
  *   **Resolution Criterion:** The dispute is substantive only if the Unificationist can demonstrate that the 'modal base' parameter is genuinely fluid and context-dependent in ways that cut across the indicative/counterfactual divide (e.g., if indicatives can sometimes access causal bases without morphological change, or vice versa). If the mapping from morphology to modal base is one-to-one and rigid, the disagreement reduces to a notational preference regarding where to store the variation (in the operator or in the index).
  *   **Joint Stance:** We agree to treat the dispute as substantive only insofar as the Unificationist predicts *flexibility* in the modal base that the Bifurcationist predicts is *fixed* by the operator. Where the Unificationist's parameters are rigidly tied to morphology, we acknowledge this as a notational variant of bifurcation.

  ---

