      *   **Philosopher (The Realist/Modeler):** Needs to lean on modern causal inference and Bayesian subjective probability or objective propensity theories (like Popper or Suppes). The model represents a causal structure. The probability is conditional on the *model specification*, which is justified by causal relevance, not just statistical association. The "single-case chance" is the causal disposition of the specific biological system.

