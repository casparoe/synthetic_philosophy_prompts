          *   *Fundamental T-Violation:* If we find T-violation in strong/gravity sectors that *explains* the arrow without PH. Currently, Weak force T-violation is too small, but if it were dominant, the thermodynamic story becomes secondary.
          *   *Gravitational Entropy Incoherence:* If we can't define a global entropy function that matches the arrow (Penrose's point). If black hole thermodynamics doesn't scale to cosmology.
      *   **Category 2: Serious Structural Threats (Requires major surgery).**
