          *   *The "Past Hypothesis" Instability:* If cosmology shows the "beginning" wasn't low entropy (e.g., certain bounce models).
          *   *Coarse-Graining Subjectivity:* If the arrow disappears with different variable choices. Defenders argue for "natural" macrostates, but if that fails, the arrow isn't mind-independent.
      *   **Category 3: Awkward but Manageable (Standard objections).**
