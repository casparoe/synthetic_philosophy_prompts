answer: |-
  Dear Colleague

  You have asked me to bridge the conceptual gap between your expertise in international relations theory and the singleton hypothesis emerging from existential risk and artificial intelligence circles, and I find this to be a fascinating exercise in translation. To restate the singleton hypothesis in the vocabulary of international relations, one must describe it as a terminal form of unipolarity where the structural condition of anarchy is abolished rather than merely managed. In your field, unipolarity describes a distribution of material capabilities where one state possesses preponderant power, yet it operates within a system that remains anarchic, meaning there is no higher authority to enforce rules or guarantee security. The singleton hypothesis claims something more radical: the emergence of a single decision-making agency at the highest level that possesses not just preponderant capability but effective control over the global system, capable of preventing the emergence of any rival agency. Proponents argue this structure would be more stable than the present order because it resolves the security dilemma by removing the uncertainty of other actors' intentions and capabilities. In the current anarchic order, states are forced to compete for security, often leading to arms races or the premature deployment of dangerous technologies because the cost of falling behind is perceived as existential. A singleton, by monopolizing decisive power, eliminates the competitive pressure that drives these risky behaviors, allowing for coordinated management of global threats without the fear of defection or cheating that plagues international regimes.

  The proponents of the singleton hypothesis regard the present order as dangerous precisely because it is a multipolar or bipolar system operating under anarchy while possessing technologies that confer existential risk. In IR terms, you would recognize this as an acute security dilemma where the defensive preparations of one actor are indistinguishable from offensive threats, but escalated to a level where a single miscalculation could result in human extinction rather than just territorial loss. They argue that without a singleton, the competitive pressures of the international system will force actors to cut corners on safety protocols, particularly in artificial intelligence, because no state can afford to let another gain a decisive strategic advantage. The paths to a singleton that these theorists take seriously map unevenly onto IR historical precedents. One path is hegemonic war, where a single state achieves such overwhelming dominance that it can enforce a global monopoly on force, resembling a hyper-stable version of hegemonic stability theory. Another path is voluntary federation, where states cede sovereignty to a global governance structure, akin to a world state emerging from a social contract rather than conquest. The third path, which distinguishes this literature most sharply from yours, is the development of a superintelligent artificial agent that acts as the singleton, exerting control not through traditional statecraft but through cognitive superiority and technological lock-in.

  When we produce a residue report on this translation, several parts map cleanly onto your existing vocabulary while others require significant distortion or reveal conceptual voids. The claim that a singleton would be more stable translates cleanly into the claim that a unipole faces no balancing coalition, yet it distorts the IR understanding of hegemony because IR theory generally assumes hegemony is transient due to the law of uneven growth and the inevitable rise of challengers. The singleton hypothesis assumes that the transition to a singleton can be permanent, locking in the power structure in a way that classical IR theory deems impossible due to the dynamic nature of material capabilities. Furthermore, the concept of balancing fits only if we assume the singleton successfully prevents the emergence of peers, whereas IR theory predicts that balancing is a systemic imperative that will occur unless the cost is prohibitive. The singleton hypothesis argues the cost can be made permanently prohibitive through technology, which is a claim IR theory rarely entertains seriously. The most significant distortion arises from the definition of the actor itself. IR theory is state-centric, defining polarity by the distribution of capabilities among sovereign states. The singleton hypothesis defines the order by the distribution of decision-making agency, which could reside in a non-state entity, such as an artificial intelligence, or a supranational corporation. This breaks the translation because IR lacks a robust vocabulary for a supreme authority that is not a state, nor for a power transition that occurs through software recursion rather than industrialization or mobilization.

  There are parts of the singleton hypothesis that have no expression in your vocabulary at all, primarily concerning the nature of the risk being managed and the timescale of the order. IR theory focuses on security, defined largely as regime survival or territorial integrity, whereas the singleton hypothesis focuses on existential risk, defined as the permanent extinction of humanity or the permanent lock-in of undesirable values. This is a category of risk that exceeds the security dilemma because it removes the possibility of future interaction or recovery. Additionally, the concept of value lock-in has no equivalent in IR. IR theory assumes that states have preferences that can change over time through domestic politics or systemic pressure, but the singleton hypothesis worries about a structure that fixes preferences permanently, preventing moral progress or political change. This introduces a normative dimension to structural realism that your field typically brackets out. The path to a singleton through artificial intelligence also lacks expression in IR, as it implies a power transition where the new hegemon is not a social collective but a computational agent, rendering concepts like legitimacy, domestic cohesion, or national interest incoherent.

  Finally, you ask whether what fails to translate is evidence that the singleton hypothesis is less precise than its proponents think, or that international relations theory lacks concepts it needs. I believe the failure of translation suggests primarily that international relations theory lacks the concepts required to analyze post-human or technologically locked-in political structures, though there is a secondary sense in which the singleton hypothesis is imprecise regarding politics. IR theory lacks concepts for permanent structural change because it assumes anarchy is a recurring condition, and it lacks concepts for non-state supreme agency because it assumes sovereignty is the ultimate form of political organization. The singleton hypothesis forces us to consider a hierarchy that is not just hegemonic but constitutive, changing the nature of the units themselves. However, the singleton hypothesis is often less precise than its proponents think regarding the maintenance of such an order. It treats the establishment of control as a technical problem rather than a political one, underestimating the friction of governance, the potential for internal fragmentation, and the difficulty of monitoring and enforcing compliance on a global scale without triggering the very balancing behaviors it seeks to avoid. It assumes that control can be centralized without generating the inefficiencies and resistance that plague all large hierarchies. Therefore, while IR theory needs to expand its ontology to include non-state agencies and existential risks, the singleton hypothesis would benefit from incorporating the IR insight that power is relational and contested, not merely a function of capability or algorithmic control. The dialogue between our fields suggests that while the singleton hypothesis identifies a potential future structure that IR cannot yet name, it often describes that structure with a technocratic confidence that ignores the enduring logic of political conflict.

  Sincerely

  Your Colleague
