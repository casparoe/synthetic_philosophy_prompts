  ### Decision Tree: Diagnosing the Surprise Exam Paradox

  **START:** The student accepts the teacher's announcement is **true** and begins the backward-induction reasoning.

  **Node 1:** When the teacher says "surprise," do they mean "you won't psychologically expect it" or "it is impossible for you to know it in advance"?
  *   **Psychologically expect it** $\rightarrow$ Go to Node 2.
  *   **Impossible to know it** $\rightarrow$ Go to Node 3.

  **Node 2:** If "surprise" just means low expectation, does the student's logical proof still hold?
  *   **No (Proof dissolves)** $\rightarrow$ **Leaf A: Equivocation/Dissolution**
  *   **Yes (Proof holds)** $\rightarrow$ *Incoherent (Psychological surprise doesn't support logical elimination)* $\rightarrow$ **Leaf B: No Defenders**

  **Node 3:** Is the teacher's announcement logically defective, like saying "This sentence is false"?
  *   **Yes (Self-referential)** $\rightarrow$ **Leaf C: Knower Paradox / Self-Reference**
  *   **No (Logically consistent)** $\rightarrow$ Go to Node 4.

  **Node 4:** Does solving the paradox require concluding the teacher's announcement is actually **false**?
  *   **Yes (Teacher was wrong)** $\rightarrow$ **Leaf D: Quinean (Announcement False)**
  *   **No (Teacher was right)** $\rightarrow$ Go to Node 5.

  **Node 5:** If the announcement is true, is it possible for the students to **know** it is true on Sunday night?
  *   **No (True but unknowable)** $\rightarrow$ **Leaf E: Blindspot / Unknowable Truth**
  *   **Yes (Knowable)** $\rightarrow$ Go to Node 6.

  **Node 6:** When the student deduces "It's not Friday," does that deduction guarantee they **know** the conclusion?
  *   **No (Knowledge doesn't transfer)** $\rightarrow$ **Leaf F: Closure Failure**
  *   **Yes (Knowledge transfers)** $\rightarrow$ Go to Node 7.

  **Node 7:** Does the standard for "knowing" stay the same throughout the week, or does it get stricter?
  *   **It gets stricter (Context shifts)** $\rightarrow$ **Leaf G: Contextualism**
  *   **It stays the same (Fixed standard)** $\rightarrow$ **Leaf H: The Paradox Stands (Incoherent)**

  ***

  ### Diagnostic Leaves

  | Leaf | Diagnosis | The "Awkward Commitment" | Status |
  | :--- | :--- | :--- | :--- |
  | **A** | **Equivocation** | "The teacher and student are using two different definitions of 'surprise' without realizing it." | **Defended** (e.g., Wright) |
  | **B** | **No Defenders** | "Psychological surprise somehow validates a logical proof about knowledge." | **Incoherent** (Psychological states don't entail logical impossibility) |
  | **C** | **Knower Paradox** | "The teacher's sentence is neither true nor false; it's a logical glitch." | **Defended** (e.g., Chow, Kaplan) |
  | **D** | **Quinean** | "The teacher lied; a surprise exam was impossible all along." | **Defended** (e.g., Quine, Hall) |
  | **E** | **Blindspot** | "The exam is happening and the announcement is true, but you are logically barred from knowing it." | **Defended** (e.g., Fitch, Sorensen) |
  | **F** | **Closure Failure** | "Valid deduction from known premises does not always yield knowledge." | **Defended** (e.g., Hawthorne, Williamson) |
  | **G** | **Contextualism** | "You knew the announcement on Sunday, but 'know' means something harder by Thursday." | **Defended** (e.g., Cohen, DeRose) |
  | **H** | **Paradox Stands** | "The student's reasoning is perfect, and therefore there cannot be an exam." | **No Defenders** (Contradicts the premise that an exam *did* occur) |

  ***

  ### Notes for the Instructor

  *   **Logical Space:** This tree maps the primary "escape routes" from the paradox. It forces a choice between attacking the semantics (Node 1), the logic (Node 3), the truth (Node 4), the knowability (Node 5), the deduction (Node 6), or the context (Node 7).
  *   **Unexplored/Incoherent:** **Leaf B** is flagged as incoherent because psychological expectation cannot sustain the rigorous modal logic required for the elimination argument. **Leaf H** represents the "hard" paradox where all epistemic principles hold; most epistemologists reject this because it denies the possibility of the exam actually occurring.
  *   **Blurred Lines:** The tree struggles to cleanly separate **Closure Failure (Leaf F)** from **Contextualism (Leaf G)**. Many contextualists argue that context shifts *cause* closure to fail. Similarly, **Blindspot (Leaf E)** and **Quinean (Leaf D)** views both conclude the students "can't know," but differ on whether the announcement is *false* (Quine) or *true but unknowable* (Fitch). Use this ambiguity to spark discussion about the fact that epistemological diagnoses often overlap.
