answer: |-
  This is one of the classic problems in the philosophy of art, often traced back to Marcel Duchamp's *Fountain* (1917), but you have framed it precisely in terms of **semantic ontology**: *Where does the meaning reside?*

  Your observation is correct: the physical properties of the object remain constant while the semantic value oscillates wildly depending on location. Here is a breakdown of what that practice presupposes, how many theories can license it, and what happens if you demand intrinsic meaning.

  ### 1. Where does the meaning live?
  If the object itself isn't the container of meaning, museum practice presupposes that meaning is **relational** and **performative**. It is not a substance inside the urinal; it is an event that happens *around* it.

  Most contemporary philosophy of art suggests the meaning lives in a feedback loop of four elements:

  *   **The Institutional Frame (The "Artworld"):** Following Arthur Danto and George Dickie, the museum acts as a consecrating institution. By placing the object behind a rope, the museum signals: "Do not use this; contemplate this." The meaning lives in the **suspension of utility**. The urinal in the shop signifies *function*; the urinal in the gallery signifies *concept*.
  *   **The Artist's Intention (The "Choice"):** Duchamp argued that the creative act was not making the object, but *choosing* it. The meaning lives in the **gesture of selection**. The artist says, "I hereby transfer this from the realm of utility to the realm of aesthetics."
  *   **The Historical Context:** The object means something because it arrives at a specific moment in art history. A urinal in 1850 would not be art; in 1917, it was a provocation; today, it is a canonical reference. The meaning lives in the **narrative timeline**.
  *   **The Viewer's Complicity:** This is crucial. If you walk into a museum and see a pile of candy (like Felix Gonzalez-Torres's work) and eat it, you are completing the work. If you see it in a grocery store, you are just snacking. The meaning lives in the **viewer's agreement to play the "art game."**

  **Conclusion on Locus:** Museum practice presupposes that meaning is **context-dependent**. It treats meaning not as a property of the *noun* (the object) but of the *verb* (the framing, the displaying, the viewing).

  ### 2. Is the practice underdetermined?
  You ask if this practice is only coherent on one theory of meaning, or if it is **underdetermined** (compatible with multiple theories).

  It is strongly **underdetermined**. You can justify the museum's practice using several conflicting philosophical frameworks:

  *   **Institutional Theory:** Meaning is conferred by authority. (Coherent with museum practice).
  *   **Intentionalism:** Meaning is what the artist intended. Since the artist intended the urinal to be a critique of art, it is so. (Coherent with museum practice).
  *   **Reception Theory:** Meaning is created by the viewer. Since viewers interpret the urinal as a symbol of modernism, it is one. (Coherent with museum practice).
  *   **Historical Materialism:** The object is a artifact of its economic conditions. The museum displays it to show the commodification of art. (Coherent with museum practice).

  The museum practice is robust precisely because it doesn't commit to a single metaphysical theory of meaning. It operates as a **cluster concept** (a term coined by philosopher Berys Gaut). An object counts as art/meaningful if it satisfies *enough* of the conditions (intent, context, reception, history), even if it lacks others (like craftsmanship or beauty).

  ### 3. The Challenge of Intrinsic Meaning
  This is the most provocative part of your query. If someone holds that **meaning is intrinsic to the object itself** (a form of essentialism or realism), the current museum practice becomes incoherent, even dishonest.

  If meaning is intrinsic:
  *   A urinal *is* a plumbing fixture. That is its essence.
  *   Putting it in a gallery does not change its essence; it only disguises it.
  *   Therefore, the museum is lying. They are presenting a plumbing fixture as a "work of art," which is a category error.

  **How would practice have to change?**

  **Option A: The Purist Ban (Stop showing readymades)**
  If meaning is intrinsic, the museum must stop presenting readymades as "Art." They would have to return to a model where art is defined by **craft** or **transfiguration of material**. If the artist didn't shape the matter, they didn't imbue it with new meaning. This was the stance of many traditionalists in the 20th century (and the Soviet Union under Socialist Realism). The museum would become a place of skilled fabrication, not curation of existing objects.

  **Option B: The Redescription (Keep the objects, change the label)**
  The museum could keep the urinals and candy, but they would have to admit they are not displaying "Art" in the intrinsic sense. They would have to reclassify the gallery as a **Philosophy Department** or a **Sociological Archive**.
  *   *Current Label:* "Fountain, Artwork by Marcel Duchamp."
  *   *Intrinsicist Label:* "Plumbing Fixture, utilized as a philosophical prop by Marcel Duchamp."

  In this scenario, the museum admits the object hasn't changed meaning; rather, the *context* is using the object to point at a meaning *outside* itself. The urinal remains a urinal, but it is being *quoted*.

  **Option C: The "Frame" as the Object**
  An intrinsicist might try to save the practice by arguing that the **frame** is part of the object. Once the urinal is signed "R. Mutt" and placed on a pedestal, it is physically distinct from the shop urinal (it has paint on it, it is oriented differently).
  *   *Counter-argument:* This is weak. If you take a photo of the shop urinal and print it on the wall, is that art? The intrinsicist usually struggles here because the *visual data* can be identical, yet the status differs.

  ### Summary
  The museum practice of showing readymades presupposes that **meaning is contextual and relational.** It relies on a "magic circle" (to borrow from game theory) where normal rules of utility are suspended.

  This practice is **underdetermined**; it works whether you believe meaning comes from the artist, the institution, or the viewer, as long as you agree meaning is *not* solely physical.

  However, if you hold that meaning is **intrinsic**, the practice collapses. You cannot simply redescribe it easily, because calling a urinal "Art" asserts a change in ontology that the intrinsicist denies is possible. To remain coherent, an intrinsicist museum would either have to **exclude readymades** entirely or display them as **cultural artifacts** (like a stone tool in a history museum) rather than as **aesthetic transfigurations**. The "rope and label" would have to change from "Behold the Art" to "Behold the Argument."
