answer: |-
  Dennett's tower classifies minds by the locus of selection. Darwinian creatures die if their genes fail. Skinnerian creatures learn via reinforcement; behaviors die if punished. Popperian creatures simulate outcomes internally; hypotheses die before action. Gregorian creatures offload intelligence onto tools and memes; ideas die in the cultural sphere.

  The boundaries are architectural, not merely behavioral. The Skinnerian/Popperian threshold is crossed when selection pressure moves from the environment to an internal model. A sophisticated Skinnerian still requires actual action to update values. The Popperian litmus test: Can the creature reject a viable action solely via internal counterfactual simulation? If the environment doesn't kill the hypothesis, the organism does. This requires an internal model robust enough to support substitution of actions without real-world cost. Your worry about a "smart Skinnerian" is apt; the distinction lies in whether the selection happens *before* motor output.

  The Popperian/Gregorian line concerns the locus of intelligence storage. It isn't mere copying; it's cognitive offloading. A Gregorian mind is structured by artifacts that embody past intelligence (language, maps). The boundary is indeed fuzzy because evolution is continuous. However, fuzziness does not undermine qualitative novelty. Consider phase transitions: water isn't suddenly ice at one molecule, yet liquid and solid are distinct states with different properties.

  Similarly, these levels are attractor states in design space. A creature can exhibit mixed competencies, but the architectural shift—internalizing the selector or externalizing memory—marks the functional leap. Dennett's naturalism demands continuity, so sharp binaries would actually undermine his project. The taxonomy identifies distinct *mechanisms* of intelligence, not magical essences. Fuzzy edges are expected in biological evolution, but the functional distinction remains robust enough to explain cognitive architecture. The claim isn't that creatures are purely one type, but that new layers of control evolve, permitting new kinds of survival without requiring new kinds of magic. The "qualitative" shift is real because it changes the *cost structure* of learning. A Popperian learns faster than a Skinnerian because fewer die. A Gregorian learns faster still because fewer have to invent. The taxonomy holds because the *economy* of intelligence changes at each level, even if the transition is gradual.
