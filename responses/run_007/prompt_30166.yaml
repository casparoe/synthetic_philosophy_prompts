      *Drafting - Section by Section:*

      Your hypothesis is astute: the core friction is indeed epistemological. However, characterizing it merely as a dispute over what counts as "evidence" misses the sociological and pragmatic stakes. This is a **meta-scientific disagreement** about the demarcation of science, grounded in conflicting epistemological frameworks and risk assessments.

      On one side, proponents of non-empirical theory confirmation (NETC), like Richard Dawid, operate within a **Bayesian framework**. In Bayesian epistemology, belief is probabilistic. You update your confidence in a hypothesis based on new information. They argue that factors like "no alternatives" or "unexpected explanatory coherence" legitimately update the probability that a theory is true, even without direct empirical data. For them, science is about inference to the best explanation, where "explanation" includes mathematical consistency and unification.

      On the other side, critics often adhere to a **Popperian or strict empiricist framework**. Here, science is defined by falsifiability. A theory that cannot be proven wrong is not science. For this group, theoretical virtues are heuristic guides for *generating* hypotheses, not for *confirming* them. To them, NETC conflates "interesting mathematics" with "physical reality."

      But the disagreement runs deeper than philosophy of science; it is also **sociological and pragmatic**. Critics worry about the "monoculture" risk. If a field accepts non-empirical confirmation, resources may funnel into untestable frameworks for decades, stifling alternative approaches. Proponents argue that nature is under no obligation to be accessible to current instruments, and restricting science to current technology is arbitrary. Thus, the debate is also about **resource allocation and field health**, not just truth conditions.

      Your software engineering bias toward testing is aligned with the empiricist view, but it's not doing "all the work." The empiricist position has a strong philosophical lineage. However, your bias might obscure the Bayesian argument: in practice, physicists often pursue theories based on elegance before tests exist (e.g., Dirac's antimatter). The disagreement is whether that pursuit phase can be called "confirmation."

      So, what counts as progress?
      1.  **Conceptual Distinction:** The most productive shift is adopting Imre Lakatos's distinction between a "research program" and a "confirmed theory." We can agree string theory is a *progressive research program* (generating new math/connections) without claiming it is *confirmed physics*. This sidesteps the demarcation fight.
      2.  **Sociological Metrics:** Progress could involve tracking whether non-empirical criteria actually lead to empirical success historically. If theories selected solely on elegance consistently fail later, the NETC argument weakens.
      3.  **Reframing the Question:** Stop asking "Is this science?" and ask "Is this a productive use of intellectual capital?" This moves the debate from semantics to pragmatics.

      Expecting a formal result to resolve this is unlikely. Philosophy cannot prove a physical theory true. A historical finding would be ambiguous because past success (General Relativity) doesn't guarantee future validity (String Theory). The only definitive resolver is empirical data. Until then, the stalemate is rational. Both sides are optimizing for different values: one for theoretical unity and continuity, the other for empirical rigor and diversity.

      Progress lies not in one side winning, but in clarifying that they are arguing about different stages of the scientific process. Proponents are arguing for **pursuit worthiness** (we should work on this); critics are arguing against **acceptance** (we shouldn't teach this as fact). Recognizing this distinction dissolves much of the heat. The field can tolerate speculative work if it is labeled as such, preserving empirical standards for claims about reality.

