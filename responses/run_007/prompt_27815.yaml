answer: |-
  Here is a 50-minute recitation plan designed to maximize conceptual clarity while managing common undergraduate pitfalls.

  ### 1. Dependency Order: Prerequisites and Taboos
  Before you introduce the counterexample, you must secure agreement on the framework. The contradiction only bites if they accept the premises.

  **What must be in place first:**
  *   **JTB Consensus:** Spend the first 10 minutes ensuring everyone agrees on what Justification, Truth, and Belief mean in this specific context. Clarify that "justification" here means "having good reasons," not "logical proof."
  *   **The Knowledge Intuition:** You need them to agree *before* checking the JTB boxes that the subject in your story clearly *does not know* the proposition. If they think the subject knows, the counterexample fails.
  *   **The JTB Checklist:** You must walk them through the case to prove the subject *does* meet all three JTB conditions.

  **What not to do first:**
  *   **Do not start with the case:** Do not walk in and say, "Imagine Smith looks at a clock." Start with the definition.
  *   **Do not mention solutions:** Do not hint at how philosophers fixed this (reliabilism, virtue epistemology, etc.) until the very end. If they think there's an easy fix, they won't feel the tension of the problem.
  *   **Do not debate skepticism:** If a student says, "But how do we know anything is true?", park that issue. This session is about the structure of knowledge, not the possibility of truth.

  ### 2. The Example: Selection and Structure
  **Should you use Smith-and-Jones?**
  No. The original ten-coins case is too cluttered for a 50-minute session (jobs, pockets, coins, entailment). It invites confusion about whether Smith was actually justified in believing Jones would get the job.

  **Better Option:** Use the **Stopped Clock** case (attributed to Russell).
  *   *The Case:* Henry looks at a clock on the wall to check the time. The clock stopped exactly 12 hours ago. Henry has no reason to suspect it is broken. He forms the belief that it is 2:00 PM. It happens to be 2:00 PM.
  *   *Why it works:* It isolates the variables quickly.

  **What the example must have:**
  *   **Reasonable Justification:** The subject's evidence must be the kind we usually accept for knowledge (e.g., looking at a normally reliable clock).
  *   **Objective Truth:** The proposition must be factually true (it really is 2:00 PM).
  *   **Epistemic Luck:** The truth of the belief must be disconnected from the justification (the clock is broken, so the reason for the belief isn't what makes it true).

  **What the example must not have:**
  *   **Ambiguous Justification:** Do not use a case where students can argue the subject was being irrational or careless.
  *   **Complex Entailment:** Avoid cases requiring logical derivation (like Smith inferring "the man who will get the job has ten coins"). Keep it direct.

  ### 3. Timeline and Misconception Management
  **0:00–10:00: JTB Review**
  Define the three conditions. Write them on the board. Get verbal confirmation that these are the necessary and sufficient conditions for knowledge *for the sake of this exercise*.

  **10:00–25:00: The Case Walkthrough**
  Present the Stopped Clock case. Ask three specific questions in order:
  1.  Does Henry believe it is 2:00 PM? (Yes)
  2.  Is it true that it is 2:00 PM? (Yes)
  3.  Is Henry justified? (Yes, looking at a wall clock is standard justification).
  4.  Does Henry *know* it is 2:00 PM? (No).

  **25:00–35:00: Head Off Misconception #1 ("Stronger Justification")**
  *   *The Misconception:* Students will say, "He doesn't know because his justification isn't strong enough; he should have checked his phone."
  *   *The Intercept:* Ask immediately: "If he checked his phone, but the phone was also hacked to show the wrong time except for this exact minute, would he know?" Force them to see that piling on evidence doesn't fix the structural disconnect between the evidence and the fact.

  **35:00–45:00: Head Off Misconception #2 ("No-Luck Clause") & #3 ("JTB is Hopeless")**
  *   *The Misconception:* "So we just add a 'no luck' condition," or "So JTB is useless."
  *   *The Intercept:* Acknowledge the "no luck" intuition but challenge them to define "luck" without using the word "knowledge." Regarding hopelessness, emphasize that JTB is still the foundation; Gettier shows it's incomplete, not broken beyond repair.

  **45:00–50:00: Diagnostic and Wrap-Up**
  Use the final minutes for the diagnostic question below.

  ### 4. The Diagnostic Question
  Do not ask, "What is a Gettier case?" That tests memory. Ask this:

  **"Take the Stopped Clock case and change exactly one detail so that Henry *does* have knowledge. Tell me what you changed and why that specific change fixes the problem."**

  *   *Why this works:* If they say "Make the clock work," they understand the connection between justification and truth. If they say "Make him believe it harder," they missed the point.

  ### 5. What to Leave Out
  Explicitly tell the class: "We are leaving out the specific solutions philosophers have proposed, such as Reliabilism or Virtue Epistemology. We are also leaving out the history of Gettier's 1963 paper. Today is solely about understanding why the JTB definition fails, not how to repair it."

  Summary: Secure agreement on JTB conditions first, use a streamlined case like the Stopped Clock to isolate epistemic luck, intercept the 'stronger justification' objection during analysis, and verify comprehension by asking students to repair the case rather than define it.
