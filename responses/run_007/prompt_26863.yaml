prompt: |-
  A friend and I just spent an evening arguing about whether the free energy principle is a genuine scientific theory or a mathematically dressed-up tautology. We've concluded that we need an adversarial collaboration to make progress. Could you draft the joint document?

  Our positions, roughly: I'm inclined to think the free energy principle is either unfalsifiable or trivially true—any persisting system can be described as minimizing free energy under some model, but this redescription doesn't constrain specific mechanisms or yield predictions we couldn't have made without it. My friend holds that this objection mistakes the principle's epistemic role: it's a normative framework specifying what any adaptive system must do to resist entropic dissolution, and it has generated substantive empirical work—for instance, in computational psychiatry, where atypical precision-weighting of prediction errors has been used to model hallucinations, delusions, and catatonia in mechanistic detail.

  We need the document to include:

  1. A numbered list of claims we can both sign. These should cover what the free energy principle actually asserts mathematically, what predictive processing models have and haven't demonstrated empirically, what a satisfying theory of cognition requires, and where the principle's defenders and critics agree about its limitations.

  2. A disagreements table. Each row should state a precise point of disagreement, with each side's position phrased so that its own advocate would endorse the wording. No straw men.

  3. Cruxes: sub-questions such that if they were resolved, at least one of us would change our overall view. For each crux, specify a test, experiment, or argument that both of us agree would bear on it, and record each side's prediction in advance.

  4. A diagnosis of any verbal disputes. We suspect we've been using "explanation" and "model" in different ways; if you find that some of our disagreements dissolve under more careful terminology, say so explicitly.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Topic:** The Free Energy Principle (FEP) and Predictive Processing (PP).
      *   **Context:** Two friends arguing about whether FEP is a genuine scientific theory or a tautology/unfalsifiable framework.
      *   **Goal:** Draft a joint "Adversarial Collaboration" document to structure the debate and find progress.
      *   **User's Position (Skeptic):** FEP is unfalsifiable/trivially true (any persisting system minimizes free energy under *some* model). It doesn't constrain mechanisms or yield novel predictions.
      *   **Friend's Position (Proponent):** FEP is a normative framework for adaptive systems. It has generated substantive empirical work (e.g., computational psychiatry: precision-weighting, hallucinations, etc.).
      *   **Required Components:**
          1.  Numbered list of agreed claims (Math, Empirics, Theory requirements, Limitations).
          2.  Disagreements table (Precise points, charitably phrased).
          3.  Cruxes (Sub-questions, tests/experiments, advance predictions).
          4.  Diagnosis of verbal disputes (Terminology check).

  2.  **Deconstruct the Subject Matter (FEP/PP):**
      *   *What is FEP?* Roughly, systems that maintain their states within viable bounds (non-equilibrium steady states) must minimize variational free energy (an upper bound on surprise).
      *   *What is PP?* A specific implementation/interpretation where the brain minimizes prediction error (a form of free energy).
      *   *The "Tautology" Charge:* If *any* system that persists *must* minimize free energy by definition, then saying "the brain minimizes free energy" explains nothing unless we specify *how* (the model structure).
      *   *The "Normative/Generative" Defense:* It provides a unifying mathematical language to derive specific models (like active inference) that *are* testable. The psychiatry examples are key here.
      *   *Key Terminology:* Surprise, Free Energy, Generative Model, Precision Weighting, Active Inference.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground. Both likely agree on the math definition (variational bound). Both likely agree PP has had *some* success but maybe not *definitive* proof. Both agree cognition needs mechanistic explanation. Both agree FEP has limitations (e.g., scale, complexity).
      *   *Drafting thought:* Make sure the skeptic doesn't feel forced to agree FEP is "true," but rather agree on what the math *says*.
      *   *Item 1 (Math):* FEP states that a self-organizing system in a non-equilibrium steady state minimizes variational free energy with respect to an internal generative model.
      *   *Item 2 (Empirics):* PP models have successfully fit behavioral/neural data (e.g., mismatch negativity), but direct causal evidence for free energy minimization *per se* is indirect.
      *   *Item 3 (Theory):* A theory of cognition needs to link computational goals to neural mechanisms.
      *   *Item 4 (Limitations):* FEP is abstract; mapping it to specific neurobiology is hard. It doesn't specify the *content* of the generative model.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the core tension: Tautology vs. Normative Constraint.
      *   *Row 1 (Falsifiability):* Skeptic says it's unfalsifiable as stated. Proponent says it's a postulate that generates falsifiable specific models.
      *   *Row 2 (Explanatory Power):* Skeptic says it's a redescription. Proponent says it unifies disparate phenomena under one calculus.
      *   *Row 3 (Psychiatry):* Skeptic says these are post-hoc fits. Proponent says these are novel predictions about precision weighting.
      *   *Row 4 (Scope):* Skeptic says it applies to *everything* (therefore nothing). Proponent says it applies to *adaptive* systems (therefore constraining).

  5.  **Drafting Section 3: Cruxes:**
      *   What would change minds?
      *   *Crux 1 (The "Any System" Test):* If we find a persisting biological system that *cannot* be modeled as minimizing free energy without trivializing the model, Skeptic moves. If every system fits, Proponent admits it's too broad.
      *   *Crux 2 (Novel Prediction):* A specific prediction derived *only* from FEP (not standard RL or Bayesian models) that is confirmed.
      *   *Crux 3 (Mechanism):* Identifying the specific neural circuit implementing the gradient descent on free energy.
      *   *Refinement:* Make the tests concrete. E.g., A pre-registered study in computational psychiatry.

  6.  **Drafting Section 4: Verbal Disputes:**
      *   "Theory" vs. "Framework."
      *   "Explanation" (Mechanistic vs. Mathematical necessity).
      *   "Model" (Generative Model in the math sense vs. Scientific Model).
      *   This is crucial. The skeptic often treats FEP as a *scientific model* (making claims about the world), while the proponent treats it as a *theoretical framework* (constraining how models are built).

  7.  **Review and Refine:**
      *   *Tone Check:* Is it neutral? Yes.
      *   *Accuracy Check:* Does this reflect the actual philosophical debate (e.g., Colombo & Wright, Kirchhoff, Friston)? Yes, the tautology objection is a standard critique (e.g., by Colombo, Palacios, etc.). The psychiatry defense is standard (e.g., Adams, Stephan).
      *   *Formatting:* Use clear headings, tables, and lists as requested.
      *   *Self-Correction during drafting:* Ensure I don't take sides. The prompt asks me to draft the document *for* them, not solve the debate. The document must be something they can actually sign.
      *   *Specific attention to the "Tautology" claim:* Ensure the agreed claims acknowledge the mathematical validity without conceding the scientific utility.

  8.  **Final Polish:** Check against the four specific requirements in the prompt.
      1.  Numbered list of claims? Yes.
      2.  Disagreements table? Yes.
      3.  Cruxes with tests/predictions? Yes.
      4.  Diagnosis of verbal disputes? Yes.

      *(Self-Correction on Cruxes)*: Make sure the predictions are distinct. If both predict the same outcome, it's not a crux.
      *   *Crux 1:* Can FEP fit data that standard Bayesian models cannot?
      *   *Crux 2:* Is the mapping from FEP to neurobiology unique?

      *(Refining the "Verbal Disputes")*: Focus heavily on "Model." In FEP, "Generative Model" is a mathematical object. In philosophy of science, "Model" is a representation of a target system. Confusing these leads to the tautology charge.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # Adversarial Collaboration Protocol: The Status of the Free Energy Principle

  **Date:** October 26, 2023
  **Participants:** [Skeptic Name] (SK), [Proponent Name] (PR)
  **Subject:** The scientific status, falsifiability, and explanatory power of the Free Energy Principle (FEP) and Predictive Processing (PP).

  ---

  ## 1. Agreed Claims
  *The following statements represent the common ground upon which this collaboration is built. Both parties endorse these claims as accurate descriptions of the current state of affairs.*

  1.  **Mathematical Definition:** The Free Energy Principle asserts that any self-organizing system that maintains its states within viable bounds (a non-equilibrium steady state) must, mathematically, minimize variational free energy with respect to an internal generative model. This is a derivation from the properties of random dynamical systems, not an empirical hypothesis in itself.
  2.  **Empirical Status of Predictive Processing:** Models based on Predictive Processing (a specific instantiation of FEP) have successfully fitted behavioral and neurophysiological data (e.g., mismatch negativity, smooth pursuit eye movements, binocular rivalry) often with greater parsimony than competing reinforcement learning models. However, direct causal evidence that neural circuits explicitly compute variational free energy gradients remains inferential.
  3.  **Requirements for a Theory of Cognition:** A satisfactory theory of cognition must bridge three levels: the computational goal (what is being optimized), the algorithmic process (how it is optimized), and the physical implementation (neural mechanisms).
  4.  **Limitations of FEP:** Both parties agree that the FEP, in its general formulation, does not specify the *content* of the generative model (i.e., what the system believes about the world) nor the specific timescales of inference. It constrains the *form* of the dynamics but not the specific semantic content of the representations.
  5.  **Role of Computational Psychiatry:** Both parties acknowledge that computational psychiatry has utilized PP frameworks to propose mechanistic explanations for symptoms (e.g., hallucinations as overweighted priors, catatonia as altered precision weighting). Both agree that while promising, these models often rely on post-hoc fitting and require further prospective validation to distinguish them from alternative computational accounts.

  ---

  ## 2. Disagreements Table
  *Each row identifies a specific point of contention. Positions are phrased charitably to ensure each advocate can endorse their own column without feeling misrepresented.*

  | Point of Contention | Position A (Skeptic - SK) | Position B (Proponent - PR) |
  | :--- | :--- | :--- |
  | **1. Falsifiability of the Core Principle** | The general FEP is unfalsifiable because any persisting system can be *described* as minimizing free energy if one is allowed to choose the generative model arbitrarily. A theory that fits all possible behaviors constrains nothing. | The FEP is a normative postulate, not a direct empirical claim. Its falsifiability lies in the specific process models (e.g., Active Inference) derived from it. If a system persists but cannot be modeled as performing inference without violating biological plausibility, the framework fails. |
  | **2. Explanatory vs. Redcriptive Power** | Applying FEP to cognition is largely a redescription of known homeostatic or Bayesian processes in more complex mathematical language. It does not yield predictions unavailable to standard control theory or Bayesian brain hypotheses. | The FEP provides a unifying calculus that dissolves the distinction between perception, action, and homeostasis. It yields unique predictions regarding the coupling of action and perception (Active Inference) that standard Bayesian models (which treat action as separate) do not. |
  | **3. Interpretation of Psychiatric Models** | Current psychiatric models using FEP are "just-so stories." The parameters (e.g., precision weighting) are flexible enough to explain opposite symptoms (e.g., both high and low confidence) post-hoc, reducing their predictive validity. | The precision-weighting hypothesis generates specific, dissociable predictions about neurochemistry (e.g., dopamine/glutamate ratios) and connectivity that have been borne out in pharmacological challenge studies, offering mechanistic detail unavailable to descriptive phenomenology. |
  | **4. Scope and Universality** | If FEP applies to cells, brains, and societies equally, it is too abstract to explain the specific architecture of the human mind. Universality implies a lack of specific biological commitment. | Universality is a strength, indicating a fundamental law of adaptive systems. The specific architecture of the human mind emerges from the specific *priors* and *hierarchical depth* of the human generative model, which sits within the universal constraint. |

  ---

  ## 3. Cruxes
  *These are sub-questions where resolution would significantly shift the overall debate. For each, we specify a testable condition and record our advance predictions.*

  ### Crux 1: The "Alternative Model" Test
  **Question:** Can the specific empirical successes attributed to FEP/Active Inference be matched equally well by standard Reinforcement Learning (RL) or Control Theory models without invoking free energy minimization?
  **Test:** A pre-registered model comparison study on a complex task involving both perceptual inference and active sampling (e.g., a foraging task with changing volatility). Models: Active Inference vs. Model-Based RL. Metric: Out-of-sample predictive accuracy and parameter recoverability.
  *   **SK Prediction:** Model-Based RL will fit the data equally well or better, with more interpretable parameters. FEP offers no gain in predictive accuracy.
  *   **PR Prediction:** Active Inference will outperform RL in conditions where exploration is driven by "information gain" (epistemic value) rather than reward maximization, as RL requires ad-hoc curiosity bonuses to match FEP's intrinsic motivation.

  ### Crux 2: The "Trivial Mapping" Test
  **Question:** Is it possible to construct a persisting biological system (simulation or simple organism) that clearly maintains homeostasis but *cannot* be plausibly described as minimizing variational free energy without making the generative model biologically impossible (e.g., requiring infinite complexity)?
  **Test:** A theoretical proof or simulation demonstration. SK attempts to construct a "counter-example system" that persists but violates FEP constraints. PR attempts to map the system to FEP.
  *   **SK Prediction:** I can demonstrate a simple homeostatic controller (e.g., a specific nonlinear feedback loop) that persists but requires a generative model of such complexity that attributing "inference" to it is vacuous.
  *   **PR Prediction:** Any such system, if it truly maintains a non-equilibrium steady state against fluctuations, will necessarily possess a Markov blanket and can be mathematically described as minimizing free energy; the complexity of the model reflects the complexity of the environment, not a flaw in FEP.

  ### Crux 3: The Neurobiological Mechanism
  **Question:** Can a specific neural circuit be identified where the *only* coherent explanation of its connectivity and dynamics is the gradient descent on variational free energy?
  **Test:** Identification of a specific microcircuit (e.g., in cortical layers) where the separation of "prediction units" and "prediction error units" and their specific synaptic weighting updates are confirmed physiologically, ruling out alternative Hebbian or error-backpropagation accounts.
  *   **SK Prediction:** Neural data will remain consistent with multiple computational accounts (e.g., contrastive Hebbian learning). The mapping from FEP math to spikes is not unique.
  *   **PR Prediction:** Emerging data on laminar-specific connectivity (e.g., superficial layers encoding prediction errors, deep layers encoding predictions) will converge to uniquely support the canonical microcircuit derived from FEP.

  ---

  ## 4. Diagnosis of Verbal Disputes
  *Upon reviewing our arguments, we suspect several disagreements stem from divergent definitions of key terms. Clarifying these may dissolve some friction.*

  **1. "Model" (Mathematical vs. Scientific)**
  *   **Dispute:** SK often treats the "Generative Model" in FEP as a *scientific model* (a claim about how the brain works). PR treats it as a *mathematical object* (a probability distribution required for the math to hold).
  *   **Resolution:** We agree to distinguish between the **System's Generative Model** (the internal statistical structure the organism supposedly uses) and the **Scientist's Model** (the equations we write to describe the organism). SK's tautology charge applies if the Scientist's Model can be adjusted arbitrarily to fit any System. PR's defense relies on the constraint that the System's Generative Model must be biologically plausible.

  **2. "Explanation" (Mechanistic vs. Nomological)**
  *   **Dispute:** SK seeks a *mechanistic explanation* (X causes Y via mechanism Z). PR often offers a *nomological explanation* (Y happens because it is a necessary condition for X to persist).
  *   **Resolution:** We acknowledge that FEP is currently stronger as a nomological framework (specifying necessary conditions for existence) than a mechanistic theory (specifying sufficient conditions for specific behaviors). The collaboration will focus on whether the nomological constraints are tight enough to generate mechanistic predictions.

  **3. "Theory" vs. "Framework"**
  *   **Dispute:** SK critiques FEP as a failed *Theory* (because it doesn't make specific predictions alone). PR defends it as a *Framework* (like Evolution by Natural Selection, which requires specific ecological contexts to make predictions).
  *   **Resolution:** We agree to classify FEP as a **Theoretical Framework**. The critique then shifts from "Is FEP false?" to "Is the FEP framework *fruitful*?" This moves the debate to the Cruxes above (predictive accuracy, parsimony, and novelty) rather than abstract falsifiability.

  **4. "Triviality"**
  *   **Dispute:** SK claims "minimizing surprise" is trivial because if you survive, you didn't get surprised (by definition). PR argues "minimizing *expected* free energy" is non-trivial because it dictates *policy selection* (action).
  *   **Resolution:** We agree to restrict debate to **Active Inference** (the minimization of *expected* free energy regarding future states) rather than the basic FEP (minimization of surprise regarding current states). The basic FEP may be tautological; Active Inference is the claim that carries empirical weight regarding behavior.

  ---

