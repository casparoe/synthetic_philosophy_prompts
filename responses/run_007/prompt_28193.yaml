prompt: |-
  I work on multi-agent systems, and I think naturally in terms of agents, local policies, joint reward functions, shared plans, communication protocols, commitments, common knowledge, and decentralized execution. Restate the philosophical debate over collective intentionality and joint action — roughly, the debate among Searle, Bratman, Gilbert, and Tuomela about what it is for us to intend or act together rather than merely to act in parallel — in that vocabulary, as faithfully as you can. For each major position, tell me what translates cleanly, what had to be distorted to fit, and what has no expression at all in my vocabulary.

  Then give me the residue report. I especially want to know whether the parts that fail to translate — for example, the ought that comes with Gilbert's joint commitments, or Searle's claim that collective intentionality is biologically primitive and irreducible to individual intentionality — are things my framework is genuinely missing, or whether they look less substantive once you try to force the translation. Be explicit about any place where you had to smuggle in assumptions from one side of the debate to make the translation work at all.

  Finally, tell me what would change your mind about the residue: which argument or consideration would lead you to a different verdict about whether the untranslated remainder is real content or merely verbal residue, and where in your translation you think your reasoning is most likely to fail.
reasoning: |-
