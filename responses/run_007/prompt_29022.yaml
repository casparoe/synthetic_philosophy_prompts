prompt: |-
  I was talking to a friend about Plato and he explained the ring of Gyges bit like this. He said Glaucon tells the story of a shepherd named Gyges who finds a ring that makes him invisible, and right away he seduces the queen, kills the king and takes over the kingdom. Glaucon's point, my friend said, is that if you gave the same ring to a just person and an unjust person they'd act exactly the same, becuase the only reason anyone is good is fear of getting caught. So Glaucon concludes that justice is just a compromise we make with each other — we agree not to harm other people so they won't harm us — and that the person who is actually unjust but seems just has the best life. My friend also said Glaucon is basically arguing that morality is a social invention, and that Socrates never really answers him. This strikes me as a pretty cynical read and I'm not sure it's fair to what Plato was actually doing. Could you go through it and tell me which parts are accurate, which parts are off, and whether the claim about Socrates not answering is fair?
