      *   *Martha Nussbaum:* Capabilities approach. Gregor is blocked from functioning.
      *   *Jeff McMahan:* Species norms. Gregor violates the norm of his species.
      *   *Pest Control Specifics:* The definition of a "pest" is contextual. A beetle in the forest is fine; in the bedroom, it's a pest. Gregor highlights that "pest" is a spatial/relational category, not an intrinsic one.

