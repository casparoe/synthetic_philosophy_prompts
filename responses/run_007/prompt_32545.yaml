          *   *Claim:* Therefore, "True Contradiction" in LP $\neq$ "True Contradiction" in natural language. It's a bait-and-switch.
          *   *Assessment:* This is the classic "negation problem" or "meaning change charge" (often associated with Parsons, Slater, or Williamson). It hits the philosophical core, not just the math.
