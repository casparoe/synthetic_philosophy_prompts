  3.  **Evaluate the Philosophical Landscape:**
      *   *The "Negation Problem":* This is a well-known objection to dialetheism. If $A$ and $\neg A$ are both true, does $\neg$ mean "not"? Slater (1995) argued paraconsistent negation is really a subcontrary-forming operator, not a contradictory-forming one. Priest responds by arguing that negation is defined by its truth conditions (truth-functional), not by exclusion.
      *   *Denial vs. Assertion:* Priest distinguishes between *asserting* a contradiction (which is true) and *accepting* it in a way that guides action. He introduces the pragmatic notion of *denial* (rejecting a proposition) which is distinct from *asserting its negation*. This is crucial for the "rationality" of dialetheism.
