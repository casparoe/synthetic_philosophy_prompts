          *   *Supervaluationism:* Vagueness is semantic indecision. There are many "admissible precisifications." A sentence is "supertrue" if true on all precisifications, "superfalse" if false on all. Borderline cases are neither (truth-value gaps). Classical logic holds for "supertruth" (e.g., Excluded Middle holds, but Bivalence might fail depending on formulation).

