answer: |-
  Your diagnosis is sharp, and your intuition that the two camps are talking past each other is correct. However, characterizing it merely as a verbal dispute about "what morality means" or a simple split between "individual vs. institutional" questions underestimates the structural lock.

  The stalemate is not primarily substantive (about who is liable), nor merely verbal (about the definition of morality). **It is a methodological disagreement about the relationship between moral truth and social practice.** Specifically, it is a clash between **practice-independent** moral reasoning (Revisionism) and **practice-dependent** moral reasoning (Orthodoxy).

  Here is the structural diagnosis of why the debate is stuck, followed by what would actually constitute progress.

  ### 1. The Structural Diagnosis: The Methodological Gap

  The reason the concessions don't bridge the gap is that each side treats the other's domain as normatively inert.

  *   **The Revisionist Method (Practice-Independent):** McMahan and colleagues apply reductive individualism. They assume the morality of war is derived from the morality of interpersonal violence (self-defense, liability, aggression) *outside* the context of war. For them, the "War Convention" is a layer of positive law that might be pragmatically necessary, but it has no *moral* weight of its own. It cannot change who is liable to be killed. Therefore, when Orthodox theorists say "symmetry is required for the practice," Revisionists hear "we should lie about morality to make the practice work."
  *   **The Orthodox Method (Practice-Dependent):** Walzer and colleagues assume that war is a distinct normative sphere with its own internal logic. The "War Convention" is not just law; it is a moral achievement that constrains violence. For them, the permissions soldiers have are constituted by their role within that practice. When Revisionists say "unjust combatants are liable," Orthodox theorists hear "you are ignoring the epistemic and functional reality that makes moral regulation of war possible."

  **The Real Disagreement:** It is about **where moral authority resides.**
  *   For Revisionists, authority resides in the **facts of the case** (who is objectively aggressive).
  *   For Orthodox, authority resides in the **status of the agent** (who is a recognized combatant).

  The stalemate persists because the Revisionists have won the argument on *critical morality* (what is truly right), while the Orthodox have won the argument on *regulative morality* (what we can enforce). But because both claim to be describing "the morality of war," they collide. The Revisionist concession ("keep the law symmetric") is a pragmatic retreat, not a moral one. The Orthodox concession ("deep morality might be asymmetric") is an abstract admission, not an action-guiding one. This leaves the actual combatant in a normative vacuum: *Legally* permitted to fight, *deeply* immoral for doing so.

  ### 2. Is it Substantive, Verbal, or Methodological?

  It is **methodological**, which manifests as a substantive disagreement about **epistemic burden**.

  If it were merely verbal, we could stipulate definitions and move on. But we can't, because the methodological split dictates how we assign risk.
  *   **Revisionism** places the epistemic burden on the **individual soldier**. If the war is unjust, you are liable, even if you didn't know. (Or, if you should have known, you are culpable).
  *   **Orthodoxy** places the epistemic burden on the **state/institution**. The soldier is entitled to presume the state's authority is legitimate unless it is manifestly criminal.

  This is why the debate feels stuck. To move it, you cannot argue about liability alone; you have to argue about **who is responsible for resolving moral uncertainty in non-ideal conditions.**

  ### 3. What Would Count as Progress?

  Since the deadlock is methodological, more first-principles arguments (Revisionist) or more appeals to tradition (Orthodox) will not work. Progress requires reframing the problem to account for the gap between critical morality and institutional reality.

  Here are the three specific avenues that would constitute genuine progress:

  #### A. A Tripartite Distinction (Splitting the Question)
  The current binary (Deep Morality vs. Law of War) is insufficient. Progress requires a robust theory of **Professional Role Morality** that sits between the two.
  *   **Level 1: Critical Morality:** (Revisionist domain) Who is objectively liable?
  *   **Level 2: Institutional Law:** (Legal domain) What does the Geneva Convention permit?
  *   **Level 3: Role Ethics:** (The missing link) What does a soldier owe *qua* professional, given the gap between 1 and 2?

  Progress would look like a theory that explains why a soldier might have a *moral* obligation to follow symmetric rules even when they suspect their cause is unjust, without reducing that obligation to mere pragmatism. This requires showing how role obligations generate genuine moral reasons, not just prudential ones. (Seth Lazar's work on "responsibility and risk" attempts this, but a full synthesis is still lacking).

  #### B. Empirical Granularity on Epistemic Access
  The Orthodox view relies heavily on the claim that soldiers *cannot* know the justice of the war. The Revisionist view often assumes they *can* (or should).
  *   **Progress:** High-resolution empirical work on military epistemology. Not "can soldiers know?" but "under what specific informational conditions does a soldier's epistemic position shift?"
  *   If we can demonstrate that modern information environments give soldiers significantly higher access to *jus ad bellum* facts than in 1970 (Walzer's context), the Orthodox epistemic defense crumbles. If we show that cognitive bias and propaganda make objective assessment impossible even for informed actors, the Revisionist demand for individual liability becomes untenable. This moves the debate from armchair intuition to evidence-based normativity.

  #### C. A Functional Justification for Symmetry (Non-Ideal Theory)
  The Revisionist concession that "law should be symmetric" is currently pragmatic. To break the deadlock, Revisionists need to explain why symmetry might be **morally required** in non-ideal theory, not just legally convenient.
  *   **Progress:** A formal or theoretical result showing that asymmetric moral rules, even if true, lead to worse moral outcomes (e.g., total war, higher civilian casualties) in a way that violates the very principles Revisionists care about (liability/proportionality).
  *   If Revisionists can prove that enforcing "deep morality" on the battlefield increases the violation of rights overall, then the Orthodox view becomes a subset of Revisionist logic (a "second-best" solution), rather than a rival theory. This subsumes the Orthodox view into a broader Revisionist framework of non-ideal theory.

  ### Summary
  The debate is ill-posed as a binary choice between "True Morality" and "War Convention." It is a disagreement about **how moral theory applies to imperfect institutions.**

  Progress will not come from better arguments about liability. It will come from:
  1.  **Acknowledging a third category** (Role Ethics/Professional Duty) that bridges the gap.
  2.  **Empirical data** on soldier epistemology.
  3.  **Non-ideal theory** that demonstrates why symmetric rules might be morally mandatory, not just legally useful, even if deep morality is asymmetric.

  Until the debate shifts from "Who is liable?" to "How do we assign moral risk under epistemic uncertainty within an institution?", the two sides will continue to concede each other's points without moving an inch.
