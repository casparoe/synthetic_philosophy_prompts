      *   **Part 2: The Procedure (The Tool).** Design the "Mencius-Xunzi Diagnostic." Include the required flags (Overlap, No Guidance, User Judgment).
      *   **Part 3: Application.** Run the two cases through the tool.
      *   **Part 4: Implementation Advice.** How to teach this to teachers without them misusing it.

  7.  **Refining the Content (Self-Correction during drafting):**
