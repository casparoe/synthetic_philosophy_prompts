  *(Key Insight)*: The real synthesis is that Xunzi provides the *scaffolding* for Mencius's *growth*. You need the trellis (Xunzi) for the vine (Mencius). I should embed this metaphor.

  *(Final check on Case 2)*: A 12-year-old with no remorse. A strict Mencian might struggle here. A strict Xunzian would say "impose ritual until it becomes second nature." I need to be careful not to label the child "evil" (Xunzi says nature is *bad* but transformable). The procedure must emphasize transformability in both.

