answer: |-
  There is no comfort I can offer today that repairs what was broken, and I will not stand here and pretend that Martin's life adds up to a sum that feels fair to everyone in this room. To his wife and daughter, I know that no amount of philosophical abstraction can mend the absence he left behind fifteen years ago, nor should it. You are right to feel the weight of that abandonment, and you are right to judge him by the standards of the world we all live in, where a father's duty is to his home and a husband's word is his bond. I am not here to ask for your forgiveness on his behalf, because I know that some debts cannot be paid, and some wounds do not close simply because the bleeding has stopped.

  To his colleagues and friends from the university, I know there is a temptation to view what happened as a tragedy of the mind, a brilliant scholar who finally confused the text for the world and suffered a breakdown. But Martin did not lose his grip on reality; he tightened it until it drew blood. He understood perfectly well that he was violating the universal ethical norms that bind society together, and he did not do so out of confusion or madness, but with a clarity that terrified him almost as much as it terrified those of us who watched it happen. He knew exactly what he was losing, and he knew that by the lights of reason and morality, he was in the wrong.

  The thing he asked me to explain is the hardest thing to say aloud without sounding like I am making an excuse for cruelty. Martin believed that there are moments when a human being is called to a duty that supersedes the ethical, a command that cannot be justified to another soul because it belongs solely to the individual and their conscience. He did not leave because he stopped loving his family; he left because he believed he was being summoned to a task that required him to become, in the eyes of the world, a villain. To explain himself would have been to justify himself, and he knew that if he could justify it using language we all understand, it would cease to be the thing he was called to do.

  I have spent the years since watching him live in exile, caring for a dying stranger whilst carrying the silence of a man who knows he is hated by the people he loves most. He never sought praise for it, and he never sought to be understood, because he knew that faith of that magnitude looks identical to madness from the outside. He accepted the judgment of his peers, the hatred of his family, and the confusion of his friends as the price of admission for that higher duty. He did not wear his sacrifice as a badge of honour; he wore it as a penance, knowing that to step out of the universal is to step into a loneliness that no other human being can share.

  Martin told me specifically that I was not to make him sound like a nice man, because he was not nice, and kindness was not the metric by which he was trying to live. He was a man who attempted to live out the terrifying possibility that there are things more important than being good, and that sometimes doing the right thing looks exactly like doing the worst thing imaginable. I cannot tell you if he was right, and I cannot tell you if the cost was worth it, but I can tell you that he died exactly as he lived: answerable to a silence that none of us can hear, and faithful to a burden he refused to put down.
