  Dear Colleagues,

  I am writing to share my analysis of our recent cases regarding the determination of death and to offer a recommendation on how we should proceed with our current patient who has suffered a massive basilar-artery stroke. As you noted, our committee members have been describing the standard for death in conflicting ways, ranging from the irreversible loss of all functions of the entire brain to the irreversible loss of brainstem function, the irreversible loss of the capacity for consciousness, or the irreversible cessation of circulation and respiration. To determine which rule we are actually applying, we must look closely at the precedents set by our own records rather than the verbal descriptions offered during our meetings.

  Our first case, where death was declared after unsuccessful resuscitation following pulselessness and apnea, is straightforward and consistent with all major standards, including the uniform determination of death act and traditional cardiopulmonary criteria. It establishes that we accept death by circulatory criteria when spontaneous function cannot be restored. The third case, involving the patient on veno-arterial ECMO, is equally instructive because it establishes a boundary regarding mechanical support. By refusing to declare death in a patient whose heart had stopped but who was awake and following commands, we affirmed that machine-maintained circulation does not constitute death if consciousness is preserved. This case suggests that the presence of consciousness overrides the absence of spontaneous circulatory function, but it does not clarify whether the absence of consciousness alone is sufficient for death.

  The second case is the closest analog to our current patient, as it involved a declaration of death by neurologic criteria in a ventilator-dependent patient with a beating heart. In that instance, death was declared based on the absence of brainstem reflexes and respiratory drive. However, our record of that case does not specify whether cortical activity or hypothalamic functions, such as temperature regulation and endocrine control, were tested and found absent. Standard clinical practice often assumes that the loss of brainstem function implies the loss of all brain function, but biologically these can come apart. Because our documentation for that case did not explicitly rule out preserved cortical or hypothalamic function, our record underdetermines whether we are operating under a whole-brain standard or a brainstem standard. If we declared death in that second case based solely on brainstem criteria, then consistency would demand we declare death in our current patient. However, if we declared death in that second case based on an assumption of whole-brain cessation that was not documented, then consistency with the whole-brain standard would demand we do not declare death in the current patient, who clearly retains cortical and hypothalamic function.

  Given this ambiguity, I recommend that we should not declare the current patient dead if we wish to remain consistent with the strictest interpretation of our recorded comments and the prevailing legal standard, which requires the irreversible cessation of all functions of the entire brain. Declaring death in this patient would effectively adopt the principle that death is the irreversible loss of brainstem function, prioritizing the brainstem's role in integrative biological function over the preserved activity of the cortex and hypothalamus. Refusing to declare death would adopt the principle that death requires the irreversible loss of all brain functions, including those of the cortex and hypothalamus, regardless of brainstem status. Since our record does not definitively show that we have previously declared death in the presence of preserved hypothalamic function, the safer and more legally defensible choice is to withhold the declaration until we are certain our precedent supports it.

  If our record underdetermines the answer as I suspect, we need a further case to cleanly settle which rule we are really running, specifically to address the divergent view held by some members that death is the irreversible loss of the capacity for consciousness. The current patient helps distinguish between the brainstem and whole-brain standards, but to test the consciousness standard against the others, we would need a case involving a patient in a permanent vegetative state. Such a patient would have intact brainstem reflexes and spontaneous respiration, satisfying the brainstem and whole-brain criteria for life, but would have permanently lost the capacity for consciousness. If we were to declare death in such a case, we would confirm that our operating principle is the loss of the capacity for consciousness. If we refused to declare death, we would confirm that our principle relies on biological brain function, either of the brainstem or the entire brain. Until we have confronted such a case or clarified our stance on the current patient through explicit policy, our records will continue to support conflicting interpretations of the rule we follow.

  Sincerely,

  A Committee Member
