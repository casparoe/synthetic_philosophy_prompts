answer: |-
  This is a splendid bit of philosophical legwork you've done. You've essentially reconstructed a version of the 'self-refutation' objection that has dogged eliminative materialism (EM) since the Churchlands first started championing it in the 1980s. It is a robust argument, but like most arguments in this arena, its strength depends entirely on how one interprets the ontology of content.

  To answer your specific queries: the weakest step is indeed **(2)**, the eliminativist response hinges on a distinction between *folk* content and *neuro* content, and your worry about proving too much is astute but ultimately manageable. Let's unpick this in order.

  ### The Weakest Link: Step (2)

  Your argument hinges on the move from 'no propositional attitudes' to 'no truth-evaluable mental states'. This is the pressure point.

  Premise (1) is simply the definition of EM, so the eliminativist must accept it. However, Premise (2) assumes that truth-evaluability (intentionality) is the exclusive preserve of folk-psychological propositional attitudes (beliefs, desires). The eliminativist will deny this. They argue that while the *folk conception* of belief (as discrete, sentence-like items in a head) is false, *representation* itself is not.

  Paul Churchland, for instance, argues that neural networks possess 'activation vectors' across synapses. These vectors can map onto states of the world. If a neural state covaries with a state of affairs and plays a role in guiding behaviour successfully, the eliminativist argues it has a form of content, even if it isn't a 'belief' in the folk sense.

  Therefore, the eliminativist rejects (2). They claim: *There are no beliefs, but there are neurocomputational states that function as representations and can be assessed for accuracy.*

  ### The Thermostat Objection and the 'Line'

  You anticipated their move perfectly: if any state carrying information counts, then thermostats reason. You worry that drawing a line here smuggles propositional attitudes back in.

  The best eliminativist response (drawing on work by folks like Ruth Millikan or even Dennett, though Dennett is an instrumentalist rather than a hard eliminativist) is to appeal to **systematicity and complexity**.

  A thermostat has a simple causal covariance: temperature drops $\rightarrow$ switch on. It lacks *inferential role*. It cannot combine that information with other information to derive a novel conclusion. A neural network, however, exhibits high-dimensional systematicity. It can recombine inputs, generalise from past data, and adjust its own processing rules (learning).

  The eliminativist argues that 'reasoning' is not a magical process involving ghostly propositions; it is a high-grade information-processing activity. The line between a thermostat and a human brain is not a difference in *kind* of ontology (both are physical), but a difference in *architectural complexity*. They don't need to smuggle in folk-psychological beliefs to draw this line; they only need to cite computational capacity.

  So, they concede that 'reasoning' as the folk conceive it (a homunculus shuffling sentences) doesn't exist. But 'reasoning' as a naturalised process of truth-preserving neural transformation *does* exist. They are revisionists about reasoning, not eliminativists about it.

  ### Does It Prove Too Much?

  This is the most intriguing part of your query. You ask if a parallel argument would destroy moral error theory or mereological nihilism.

  The short answer is: **No, not in the same way.** Here is why.

  **Moral Error Theory:**
  J.L. Mackie argues there are no objective moral values. If you argue against him, you are using *epistemic* norms (logic, evidence, truth), not *moral* norms.
  *   **The Parallel:** If EM is true, there are no beliefs. If Error Theory is true, there are no moral facts.
  *   **The Difference:** To argue for Error Theory, one does not need to instantiate a moral fact. One only needs to instantiate a belief. But to argue for EM, one must instantiate the very thing being denied (a belief/argument).
  *   **Verdict:** Error theory survives because it eliminates the *subject matter* of ethics, not the *medium* of argumentation. EM eliminates the medium itself. So your argument does not prove too much here; EM is uniquely vulnerable because it targets the mind holding the theory.

  **Mereological Nihilism:**
  This view says there are no composite objects (no tables, only simples arranged table-wise).
  *   **The Parallel:** If nihilism is true, there are no arguments (which are composite wholes of premises and conclusions).
  *   **The Response:** Nihilists typically employ a paraphrase strategy. They say, 'There are no arguments, but there are simples arranged argument-wise.'
  *   **Verdict:** The eliminativist tries to do this too ('There are no beliefs, but there are neural activation vectors'). The difference is that 'simples arranged argument-wise' still allows for the *structure* of the argument to exist in the world. The eliminativist claims the *intentional structure* (the 'aboutness') is illusory.
  *   **The Distinction:** The self-refutation charge is stronger against EM than Nihilism because intentionality is required for the *meaning* of the argument, whereas composition is merely required for the *physical vehicle* of the argument. If I write my nihilist thesis in the sand, the waves might erase the composite arrangement, but the meaning remains. If I erase the intentionality, the meaning is gone.

  ### What the Best Eliminativist Concedes

  A sophisticated eliminativist (like Patricia Churchland in later work) will concede that the *vocabulary* of folk psychology is indispensable for now. They will admit that saying "I believe it is raining" is a useful shorthand for a complex neural state, even if strictly false.

  They will concede that until neuroscience provides a replacement vocabulary that is as communicatively efficient as folk psychology, we must continue to use the old terms. They treat EM as a long-term research goal, not an immediate prescription for daily speech.

  Consequently, they would reject your Premise (5). They would say: *Philosophy is currently built on a mistake, yes, but it is a necessary mistake on the path to a mature neurophilosophy.* They accept the branch is rotten, but argue we haven't finished sawing through it yet, and we'll build a better branch (neuroscience) before the old one snaps.

  ### Summary

  Your argument is a classic and potent one. It identifies the genuine tension in EM. However, it likely fails to be a knockout blow for two reasons:

  1.  **Step (2) is too strong:** Truth-evaluability need not rely on folk-psychological propositional attitudes. Naturalised semantics can do the heavy lifting.
  2.  **The 'Proves Too Much' worry is unfounded:** EM is uniquely self-threatening because it targets the preconditions of argumentation (intentionality), whereas other error theories target specific domains (morality, composition) that are not preconditions for logical inference.

  The eliminativist isn't saying reasoning doesn't exist; they are saying *your explanation* of reasoning is wrong. They aren't sawing off the branch; they are claiming the branch is actually a steel beam, and you're just describing it as wood.

  Cheers.
