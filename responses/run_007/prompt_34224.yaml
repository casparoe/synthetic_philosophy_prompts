answer: |-
  This is a sophisticated reconstruction of the *Bai Ma Fei Ma* (White Horse Not Horse) paradox, and you have correctly identified the tension that makes the School of Names so enduringly difficult. You have built a *reductio ad absurdum* against Gongsun Long (GL) that hinges on the viability of ordinary language (5).

  To keep (5) without abandoning the structural insights of (7) and (8), you should **reject Step (3).**

  Here is the diagnosis of why (3) fails, what it costs you to reject it, and how it resolves the Fregean tension.

  ### 1. Why Step (3) is the Break Point

  Step (3) claims: *"The same move then applies to every subject–predicate sentence. 'Socrates is a man' comes out false..."*

  This step commits a **category mistake regarding the copula ("is").** It conflates two distinct logical relations that Gongsun Long keeps separate (or at least, that his argument requires to remain separate):

  1.  **Class Inclusion / Identity:** The relation between "White Horse" and "Horse."
  2.  **Exemplification / Instantiation:** The relation between "Socrates" and "Man."

  **Gongsun Long's Argument (Steps 1 & 2)** works on the level of **concepts or classes**.
  When GL says "A white horse is not a horse," he is arguing that the *concept* (or the extension of the name) "White Horse" is not identical to the concept "Horse."
  *   In modern terms: $Extension(White Horse) \subset Extension(Horse)$.
  *   Since a proper subset is not identical to the set, $White Horse \neq Horse$.
  *   This is logically valid if "is" means "is identical to."

  **Step (3)** attempts to apply this to **particulars and universals**.
  *   "Socrates is a man" does not mean $Socrates = Man$ (Identity).
  *   It means $Socrates \in Man$ (Membership/Instantiation).
  *   To argue that "Socrates is not a man" because the particular is not the universal is to demand that membership be identity. This is the error.

  If you reject (3), you block the slide into the nihilism of (4). You can accept GL's point that compound names differ from simple names (Step 2) without accepting that predication is impossible. You preserve (5) because "Socrates is a man" remains true as an instantiation claim, even if "Socrates" (particular) is not identical to "Man" (universal).

  ### 2. The Cost of Rejecting (3)

  Rejecting (3) comes with two specific costs regarding how you interpret Gongsun Long:

  **Cost A: You must limit GL's scope.**
  You cannot read GL as a radical skeptic destroying all language (Step 4). Instead, you must read him as making a specific, technical point about **naming conventions and ontology**. He is arguing that adding a modifier changes the *zhi* (intent/concept) such that the resulting name demands a different *shi* (actuality/extension). He is not arguing that white horses don't exist or that we cannot talk about them; he is arguing that the *name* "White Horse" is not synonymous with the *name* "Horse." This makes GL less of a nihilist and more of a precise logician or ontologist.

  **Cost B: You must nuance the Frege comparison (Step 7 & 8).**
  This is the most philosophically rich cost. If you reject (3), you must also adjust how you view the parallel with Frege.

  *   **Frege's Move:** "Morning Star" and "Evening Star" have different *Senses* but the **same Reference**. This explains how $a=b$ can be informative.
  *   **Gongsun Long's Move:** "White Horse" and "Horse" have different *Senses* (Zhi) and **different References** (Extension/Shi).
      *   If you ask for a "horse," a yellow one satisfies the request.
      *   If you ask for a "white horse," a yellow one does not.
      *   Therefore, the objects/extensions picked out are not the same.

  **The Crucial Difference:** Frege uses the Sense/Reference distinction to **save** identity statements (Morning Star *is* Evening Star). GL uses a similar distinction to **deny** identity statements (White Horse *is not* Horse).

  If you accept (8)—that GL was doing something "close to the sense/reference distinction"—you must acknowledge that GL's version is **extensional**, whereas Frege's is **intensional** regarding reference. GL argues that a difference in sense *entails* a difference in reference (extension). Frege argues that a difference in sense *allows for* sameness of reference.

  So, you can keep the insight that GL anticipated a distinction between "how a name presents" and "what a name picks out," but you must deny that he arrived at Frege's specific conclusion about how those two relate.

  ### 3. Resolving the Dilemma

  Here is the revised path that keeps (5) and respects the history:

  1.  **Keep (1) & (2):** GL is right that "White Horse" $\neq$ "Horse" in terms of concept and extension. ($A \cap B \neq B$).
  2.  **Reject (3):** This does not generalize to "Socrates is not a man." Predication ($x \in F$) is not Identity ($x = F$).
  3.  **Reject (4):** Language can state how things are because predication is not identity.
  4.  **Keep (5):** Ordinary language works.
  5.  **Revise (7) & (8):** GL is not a proto-Fregean in the full sense. He anticipated the **distinction** between mode of presentation and object, but he drew a different **consequence**.
      *   Frege: Different modes $\rightarrow$ Possible Same Object.
      *   GL: Different modes $\rightarrow$ Different Objects (Extensions).

  ### Summary

  You do not need to abandon the School of Names or Frege to save ordinary language. You only need to recognize that Gongsun Long is playing a game of **mereology and class logic**, while Step (3) accuses him of playing a game of **predication and instantiation**.

  By rejecting (3), you pay the cost of having to interpret GL charitably as a logician of names rather than a destroyer of truth, and you avoid the anachronism of making him a perfect Fregean. You preserve the insight that language is sensitive to modification (GL's point) without accepting that language is incapable of describing reality (the *reductio*).

  **The Exit:** Step (3) is the illusion. The "is" in "White Horse is not Horse" is the "is" of identity/inclusion. The "is" in "Socrates is a man" is the "is" of predication. Gongsun Long never intended to collapse the latter; he was exposing the ambiguity of the former.
