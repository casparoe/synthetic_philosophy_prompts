      *   *Event:* The "state" or social contract emerges (violently, Nietzsche notes). Humans are enclosed within walls of society/law.
      *   *Premise 2 (Psychological):* Instincts don't just disappear. They need discharge (*Entladung*).
      *   *Mechanism:* If outward discharge is blocked, the energy turns inward (*Verinnerlichung*).
      *   *Result:* This creates an "inner world" where there was none before.
      *   *Specific Quality:* Why "bad conscience"? Because the primary instinct being blocked is the *instinct for freedom* (which manifests as aggression/hostility/cruelty in the state of nature). Turning aggression on oneself creates self-hatred/guilt.
      *   *Evaluation:* It's a sickness (painful) but also a potential (depth, soul).
