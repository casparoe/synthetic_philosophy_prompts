      *   **Addressing "Why Bad Conscience?":** Explain the creation of the "inner space." Frustration is surface; bad conscience is structural. It creates the subject/object split within the self.
      *   **Connecting to Guilt/Debt (*Schuld*):** This is the trickiest part. Essay II starts with Debt/Credit. Then moves to Bad Conscience. Then they merge. Explain that Bad Conscience is the *engine*, Debt is the *fuel/interpretation*.
