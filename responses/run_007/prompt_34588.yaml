      *   *Candidate 3: Information Integration/Access.* (Can information in module A access module B simultaneously?). This is close to Integrated Information Theory (IIT) or Global Workspace Theory (GWT).
      *   *Refined Principle:* **The Principle of Simultaneous Access and Integration.**
          *   One consciousness exists where there is a single, unified field of access to information *at a given moment*.
