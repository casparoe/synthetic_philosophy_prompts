answer: |-
  **Project Title:** Compounding Names, Fracturing Reference: A Sequential Reading of the *White Horse Dialogue*

  **Principal Investigator:** [Your Name]
  **Duration:** Eight Weeks (Summer Term)

  **1. Statement of the Interpretive Question**
  The *White Horse Dialogue* (*Bai Ma Lun*) attributed to Gongsun Long is the most famous text of the Early Chinese School of Names (*Ming Jia*). The central thesis—that "a white horse is not a horse"—has generated centuries of commentary. Contemporary scholarship generally operates under a "Single Argument Assumption": the text is treated as a unified attempt to prove one thesis via one core logical mechanism. Scholars dispute whether this mechanism is mereological (parts vs. wholes), logical (the semantics of compound terms), or pragmatic (reference fixing).

  This project challenges the Single Argument Assumption. My central interpretive question is: **Does the *White Horse Dialogue* present a monolithic argument for a single thesis, or does it enact a sequential progression of distinct semantic tests that explore the limits of compounding names?**

  I hypothesize that the text is not a failed attempt at a single valid deduction, but a deliberate sequence of three distinct moves: (1) the ontological distinction between naming shape (*horse*) and naming color (*white*); (2) the pragmatic divergence in extension (seeking a *horse* vs. seeking a *white horse*); and (3) the semantic instability of the term *white* in isolation versus compounding. The project asks whether these moves converge on a unified theory of *ming* (name) and *shi* (actuality), or whether they are designed to display the inherent friction when compound names attempt to inherit the commitments of their constituent parts.

  **2. Critique of Existing Readings**
  Standard readings, ranging from A.C. Graham's logical reconstructions to Chad Hansen's mass-noun hypothesis and Chris Fraser's pragmatic analysis, share a methodological constraint: they seek to harmonize the text into a consistent argumentative structure. To do so, they must often treat certain passages as explanatory glosses, rhetorical flourishes, or textual corruptions that obscure the "real" argument.

  This approach leaves a significant gap. It ignores the textual flow, which shifts registers from ontological categorization to pragmatic scenarios to semantic meta-commentary. By forcing the text into a single logical mold (e.g., treating it purely as a problem of intersection of sets), existing readings flatten the dialectical tension. They assume Gongsun Long's goal was to *solve* the problem of reference, whereas the School of Names was often concerned with *exposing* the difficulties in aligning names with actualities (*zheng ming*). If the text is read as a sequence of failures or complications rather than a single proof, it aligns better with the broader *Ming Jia* project of testing the boundaries of language. The current scholarship leaves open the possibility that the *Bai Ma Lun* is not a puzzle to be solved, but a phenomenon to be described.

  **3. Methodology and Eight-Week Work Plan**
  This project will not reconstruct the *Bai Ma Lun* using modern formal logic. While formalization clarifies validity, it risks anachronism by imposing truth-functional semantics onto a text concerned with the normative and pragmatic alignment of names and roles. Early Chinese philosophical argumentation is often performative and dialectical rather than axiomatic. Therefore, the methodology will be conceptual-historical, focusing on the internal shifts in the text's argumentative strategy.

  **Weeks 1–2: Textual Mapping and Philological Review**
  I will establish a working text based on the *Sibu Congkan* edition, consulting major commentaries (e.g., Chen Mengjia, Tan Jiefu) to identify variant readings. The goal is not to emend the text to fit a theory, but to map the transitions between the three identified moves. I will annotate where the interlocutor's objections shift focus, indicating a shift in the protagonist's strategy.

  **Weeks 3–4: Analysis of the Three Moves**
  *   *Move 1 (Ontology):* Analyze the claim that "horse" names the form and "white" names the color. I will investigate whether this is a category mistake argument or a claim about distinct ontological referents.
  *   *Move 2 (Pragmatics):* Analyze the "seeking" scenario (yellow/black horses). I will examine this not as extensional logic, but as a claim about satisfaction conditions for names.
  *   *Move 3 (Semantics):* Analyze the closing argument regarding "white" alone vs. "white horse." I will focus on the claim that compound terms fix reference in ways simple terms cannot.

  **Weeks 5–6: Contextualization within School of Names Concerns**
  I will situate these moves against fragments from other *Ming Jia* figures (Hui Shi, Deng Xi) and Mohist Canons. The aim is to determine if Gongsun Long's sequential moves reflect a broader concern with *kuang* (going astray) in language. Does the sequence demonstrate how names "fracture" when compounded?

  **Weeks 7–8: Synthesis and Drafting**
  I will draft the final paper, arguing for the "Sequential Testing" hypothesis. I will refine the conclusion to ensure it does not over-state the coherence of the text.

  **4. Addressing the Objection: Rationalizing Inconsistency**
  A primary objection to this approach is that it rationalizes an inconsistent old text. Critics may argue that positing a "dialectical progression" is merely a sophisticated way of excusing logical contradictions, projecting a coherence onto Gongsun Long that isn't there.

  I address this by distinguishing between *systematic consistency* and *dialectical coherence*. A text can be logically inconsistent (containing moves that do not follow from one another deductively) while still being dialectically coherent (moving through a problem space to reveal its complexity). If the project finds that the moves are genuinely contradictory with no thematic link, I will classify this as a failure of the hypothesis (see below). However, if the inconsistencies serve to highlight different facets of the *ming-shi* problem, the text is not "bad logic" but "diagnostic philosophy." The goal is not to prove Gongsun Long was a hidden analytic philosopher, but to show he was a rigorous tester of linguistic limits.

  **5. Defensible Conclusions and Success Conditions**
  A successful project will produce a paper arguing that the *Bai Ma Lun* operates as a cumulative critique of compound naming. A defensible conclusion would look like one of two outcomes:
  1.  **Convergence:** The three moves are distinct but mutually supportive, converging on a specific theory that compound names create new actualities (*shi*) distinct from the sum of their parts.
  2.  **Aporia:** The moves are designed to show that compounding names inevitably leads to semantic slippage, suggesting the thesis "White Horse is Not Horse" is a warning label rather than a metaphysical claim.

  Success is defined by providing a reading that accounts for *all* passages without dismissing any as mere rhetoric, while respecting the historical context of the School of Names.

  **6. Failure Conditions**
  This project will be considered to have failed if:
  *   **Textual Evidence:** Close reading reveals that the transitions between the three moves are the result of textual corruption or interpolation rather than authorial design.
  *   **Forced Coherence:** The "sequential" reading requires as much interpretive charity to smooth over contradictions as the "single argument" readings it critiques.
  *   **Historical Isolation:** The analysis cannot be connected to broader Warring States concerns regarding *zheng ming* (rectification of names), rendering the interpretation philosophically isolated.

  If the moves prove to be genuinely disjointed with no unifying thematic thread, I will pivot the conclusion to argue that the text is a composite of distinct school traditions rather than a unified dialogue, which would still be a significant philological contribution.

  **7. Significance**
  Reframing the *White Horse Dialogue* from a logical puzzle to a sequential exploration of naming has implications beyond Gongsun Long scholarship. It suggests that Early Chinese philosophy of language was less concerned with truth-conditions and more concerned with the pragmatic stability of social and ontological categories. This aligns with recent trends in sinological philosophy that resist mapping Western logical categories onto Chinese texts, offering a more nuanced view of how the School of Names understood the relationship between language and the world.
