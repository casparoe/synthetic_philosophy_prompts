prompt: |-
  I'm applying for a small summer research grant in early Chinese philosophy and need a three-page proposal. I want it to be on the White Horse Dialogue — the Gongsun Long text arguing that a white horse is not a horse — read against the School of Names worry about how names and things line up. My half-formed idea is this: the standard readings all treat the dialogue as though it contains one core argument, and then they fight about which one it is — a point about the logic of compound terms, a point about parts and wholes, or a point about how names pick out objects. But the text actually runs several different moves in sequence: the one where 'horse' names the shape and 'white' names the color, the one where someone looking for a horse will take a yellow or black one but someone looking for a white horse won't, and the closing one where 'white' by itself doesn't fix what it picks out but 'white horse' does. I suspect the dialogue isn't just piling up bad arguments for one thesis; it might be working through several different ways a compound term fails to inherit the commitments of its parts, and the real question is whether those moves are supposed to converge on a single conclusion or to display something about the limits of compounding names. Turn this into a proposal. I need: a precise statement of the interpretive question, why the exisiting readings leave it open, an eight-week plan for what I'd actually do (and why that approach rather than just reconstructing the argument in modern logic), what a defensible conclusion would look like, and what would count as the project failing. Don't bother with a bibliography — I'll add citations myself. And somewhere address the obvious objection that I'm just rationalizing an inconsistent old text.
