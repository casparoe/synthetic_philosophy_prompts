      *   *Camp 2 (The Skeptics/Subjectivists):* Jaynes, Price (sometimes), Frigg. Focus on coarse-graining. If coarse-graining is agent-relative, and agents are time-asymmetric, the explanation is circular.
      *   *Camp 3 (The Dynamical Asymmetrists):* Penrose, Prigogine, some causal realists. SM + PH is "de facto," not "de jure." Need objective collapse or fundamental causation.

