          3.  *Dynamical Asymmetry View:* Time-symmetric laws + boundary condition isn't enough; need time-asymmetric laws (e.g., GRW, causation).
      *   **User's Hypothesis:** The stalemate is *not* empirical or verbal, but *methodological/metaphysical* regarding "what counts as an explanation."
