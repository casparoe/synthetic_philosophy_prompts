          *   Include: Clean cases, Breakdown cases (boundary conditions), Underdetermined units (chunking), Position vs. Alphabet conflicts.
          *   Address Distinctions: Operation slip vs. Role slip vs. Object slip (separate mechanisms vs. unified process).
          *   Classification: Non-negotiable vs. Taste.
          *   Tensions/Incompatibilities: Specifically address the "Fluid vs. Fixed" tension regarding concepts.
      *   **Constraint:** Do *not* score actual systems (e.g., Copycat, Metacat, SeqSee) against the list.
      *   **Tone:** Analytical, philosophical, precise, acknowledging the cognitive science/AI context.

  2.  **Initial Brainstorming & Categorization:**

