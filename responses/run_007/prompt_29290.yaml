  5.  **Addressing the "Fluid vs. Fixed" Tension:**

      *   This is the crux of the prompt.
      *   If concepts are too fluid, anything goes (arbitrariness).
      *   If concepts are too fixed, no analogy works (brittleness).
      *   Is this a real incompatibility? No, it's a dynamic balance. The theory must explain the *mechanism of stabilization*. (e.g., cooling, temperature, reinforcement).
      *   I need to flag this as the central theoretical hurdle.

  6.  **Classifying: Non-Negotiable vs. Taste:**

      *   *Non-Negotiable:* Solving baseline, handling boundaries without crashing, distinguishing mapping types, explaining *why* an answer is chosen (justification).
