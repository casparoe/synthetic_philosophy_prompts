answer: |-
  Here is a set of desiderata for an adequate theory of the Copycat microworld. These are structured to separate the phenomenological requirements (what the system must *do*) from the architectural requirements (how the system must *be*), followed by a classification of necessity and an analysis of the central theoretical tension.

  ### I. Phenomenological Desiderata (What the Theory Must Explain)

  **1. The Baseline Competence (The "Sanity Check")**
  *   **Requirement:** The theory must derive the statistically dominant human response for canonical problems without special-casing.
  *   **The Case:** `abc → abd`, `ijk → ?` yields `ijl`.
  *   **Rationale:** If a theory cannot recover the obvious "successor of the rightmost letter" rule in the absence of pressure, it lacks a foundational representation of the domain. It must establish a "zero-pressure" baseline against which conceptual slippage is measured.

  **2. Boundary Sensitivity (The "Breakdown" Case)**
  *   **Requirement:** The theory must account for rule failure at domain boundaries and generate plausible *alternative* rules rather than crashing or returning null.
  *   **The Case:** `abc → abd`, `xyz → ?`.
  *   **Rationale:** There is no successor to `z`. A rigid symbolic system fails here. An adequate theory must explain why `xyd` (wrap-around), `wyz` (mirror-image/predecessor), or `xy` (deletion) are "live" answers, while `xyy` is not. It must model the *pressure* that forces the concept "successor" to slip into "predecessor" or "wrap-around" specifically when the literal application is blocked.

  **3. Hierarchical Chunking (The "Unit" Case)**
  *   **Requirement:** The theory must allow the unit of perception to be fluid, shifting between atomic elements and grouped structures based on context.
  *   **The Case:** `aabbcc → aabbcd` vs. `aabbcc → aabbdd`.
  *   **Rationale:** In `aabbcc`, is the object the letter `c` or the group `cc`? If the source is `abc → abd`, the unit is a letter. If the source is `aaa → aad`, the unit might be the group. The theory cannot hard-code the granularity; it must allow grouping to emerge from perceived regularities (sameness, succession) and allow the rule to apply to the group as a single object.

  **4. Mapping Disambiguation (The "Alignment" Case)**
  *   **Requirement:** The theory must resolve conflicts between spatial position and conceptual role when mapping source to target.
  *   **The Case:** `abc → abd`, `kji → ?`.
  *   **Rationale:** Here, `kji` is a reverse alphabet string.
      *   If the rule is "change the **rightmost physical letter**," the answer is `kjj` (changing `i` to `j`).
      *   If the rule is "change the **letter latest in the alphabet**" (the conceptual `c`-role), the answer is `lji` (changing `k` to `l`).
      *   Humans strongly prefer `lji`. The theory must explain why conceptual mapping (C-role maps to K-role) overrides spatial mapping (rightmost maps to rightmost) under these specific conditions. It must quantify the "strength" of a bond based on conceptual coherence vs. positional fidelity.

  **5. Graded Response Distribution (The "Probability" Case)**
  *   **Requirement:** The theory must not produce a single deterministic answer but a distribution of answers that matches human frequency data.
  *   **The Case:** `abc → abd`, `mrrjjj → ?`.
  *   **Rationale:** Humans might answer `mrrjjk` (most common), `mrrjjjj` (group length change), or `mrrkkk` (group successor). A theory that only outputs the "best" answer hides the underlying competition between interpretations. It must account for why some answers are "clever but rare" and others are "obvious and common."

  ---

  ### II. Architectural Desiderata (How the Theory Must Work)

  **6. Representational Homogeneity of Slippage**
  *   **Requirement:** The theory must explain *Operation* slips (successor→predecessor), *Role* slips (rightmost→leftmost), and *Object* slips (letter→group) without necessarily positing three distinct, modular mechanisms.
  *   **The Distinction:**
      *   *Operation Slip:* Changing the transformation logic.
      *   *Role Slip:* Changing the slot being filled.
      *   *Object Slip:* Changing the entity being acted upon.
  *   **Rationale:** In human cognition, these feel like variations of the same phenomenon ("seeing it differently"). A theory that requires a dedicated "Chunking Module" separate from a "Rule-Slipping Module" risks fragmentation. The desideratum is that these should emerge from a unified process of activation and association (e.g., a semantic network where 'group' and 'letter' are nodes with varying activation, just as 'successor' and 'predecessor' are).

  **7. Contextual Activation (The "Relevance" Mechanism)**
  *   **Requirement:** The theory must explain why certain concepts are available for slippage in one context but inert in another.
  *   **The Case:** In `abc → abd`, the concept "alphabet start" is inert. In `xyz → ?`, "alphabet start" becomes highly active.
  *   **Rationale:** Concepts cannot be statically defined. Their relevance must be dynamic, dependent on the failure of other concepts. This requires a feedback loop where the failure of a rule increases the activation of neighboring concepts in the semantic space.

  ---

  ### III. Classification: Non-Negotiable vs. Taste

  | Desideratum | Classification | Reasoning |
  | :--- | :--- | :--- |
  | **1. Baseline Competence** | **Non-Negotiable** | If it fails the canonical case, it is not a theory of *this* analogy. |
  | **2. Boundary Sensitivity** | **Non-Negotiable** | The microworld is designed to test boundary handling. A system that crashes on `z` is brittle, not cognitive. |
  | **3. Hierarchical Chunking** | **Non-Negotiable** | Without this, the system cannot handle `aabbcc` type problems, which are central to the domain's complexity. |
  | **4. Mapping Disambiguation** | **Non-Negotiable** | This tests the core definition of "same." If it cannot distinguish spatial from conceptual mapping, it fails the analogy task. |
  | **5. Graded Response** | **Taste** | A deterministic system that picks the *most probable* answer is technically functional, but less cognitively plausible. However, it is not strictly required to solve the logic. |
  | **6. Homogeneity of Slippage** | **Taste** | You *could* build a system with three separate modules that works perfectly. It would be architecturally ugly, but functionally adequate. |
  | **7. Contextual Activation** | **Non-Negotiable** | Without dynamic relevance, slippage becomes random noise. The theory must explain *why* a slip happens *now*. |

  ---

  ### IV. The Central Tension: Fluidity vs. Stability

  You identified the core worry: *The theory has to let concepts be fluid enough to slip under pressure but fixed enough to give a determinate, non-arbitrary answer.*

  **Is this a genuine incompatibility?**
  No, but it is the **primary constraint** on the architecture. It is not a logical contradiction, but a dynamic equilibrium problem.

  **The Tension Flagged:**
  *   **Requirement A (Fluidity):** Concepts must be soft. "Successor" must be able to become "Predecessor" when `z` blocks the path. If concepts are rigid symbols, the system is brittle (fails Desideratum 2).
  *   **Requirement B (Stability):** Concepts must be stable. If "Successor" can slip to "Predecessor" too easily, `abc → abd`, `ijk → ?` could yield `ijj` (predecessor of k) just as easily as `ijl`. If everything slips, nothing means anything (fails Desideratum 1).

  **How a Theory Must Resolve This:**
  An adequate theory cannot simply assert that concepts are "both fluid and fixed." It must specify the **mechanism of convergence**.
  *   **The Mechanism:** There must be a cost function or an energy landscape. Slippage is permitted, but it incurs a "conceptual distance" cost.
  *   **The Resolution:** The system seeks the *lowest cost* interpretation that satisfies the structural constraints.
      *   In `abc → abd`, `ijk`, the cost of slipping "successor" is higher than the benefit, so it stays fixed.
      *   In `abc → abd`, `xyz`, the cost of *failing* to find an answer is infinite (dead end). The system is forced to pay the high cost of slipping "successor" to "predecessor" to find *any* valid path.

  **Potential Incompatibility Warning:**
  There is a risk of incompatibility between **Desideratum 6 (Homogeneity)** and **Computational Tractability** (which I listed as Taste, but is practical).
  *   If all slips (Object, Role, Op) are handled by one unified stochastic process searching a high-dimensional semantic space, the search space explodes.
  *   To keep it tractable, you might be tempted to hard-code constraints (separate modules).
  *   **The Trade-off:** A theory that fully satisfies the "Fluid vs. Fixed" requirement via a unified stochastic process may be computationally intractable for larger domains. A theory that is tractable may have to cheat by hard-coding stability, thereby violating the spirit of Desideratum 6.

  ### Summary for Your Evaluation
  When you read the implementations, look for how they handle the **XYZ boundary case**.
  *   If they hard-code `z` behavior, they fail **Desideratum 2**.
  *   If they allow `z` to slip to `a` but also allow `a` to slip to `z` in the baseline case, they fail **Desideratum B (Stability)**.
  *   If they use three different subroutines for changing letters, groups, and directions, they fail **Desideratum 6 (Homogeneity)**.

  The winning theory will be the one that treats "successor," "rightmost," and "letter" as nodes in the same network, subject to the same activation dynamics, where the "answer" is the stable state the network settles into after the pressure of the problem is applied.
