      *   *Refinement on Mechanisms:* The prompt asks if Object/Role/Op slips need separate mechanisms. Copycat says no (Slipnet). A symbolic theory might say yes. I should frame the desideratum as: "The theory must account for the *interaction* of these slips without necessarily positing distinct *modules*."

  9.  **Final Review against Prompt:**

