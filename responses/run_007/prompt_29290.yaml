          *   Context sensitivity (why does the rule change in different problems?).
      *   *Theoretical Tensions:* Symbolic vs. Subsymbolic, Rigid vs. Fluid, Local vs. Global.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Baseline.* Must solve the obvious cases. (abc->abd, ijk->ijl). If it can't do this, it's broken.
      *   *Requirement 2: Boundary Handling.* The "xyz" problem. A theory must explain *why* the rule breaks and what the plausible alternatives are (wyz vs. xyd). It needs to handle "pressure" on concepts.
      *   *Requirement 3: Chunking/Grouping.* The "aabbcc" problem. Is the object a letter or a group? The theory must allow hierarchical perception.
      *   *Requirement 4: Mapping/Correspondence.* The "kji" problem (reverse alphabet). Distinguishing spatial position (rightmost) from conceptual position (successor).
      *   *Requirement 5: Conceptual Slippage.* Distinguishing types of slips (Object, Role, Operator). Can one mechanism handle all?
