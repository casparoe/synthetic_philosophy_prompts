answer: |-
  Consider Patient K, treated for intractable pelvic cancer pain at a specialized neurosurgery unit. Before surgery, K rates her pain as 8/10, localized to the lower abdomen, describing it as burning and throbbing; she grimaces, requests morphine, and cannot sleep due to distress. After a bilateral anterior cingulotomy, K's nociceptive pathways remain intact. When subjected to the same nociceptive stimulus during clinical testing, she still rates the pain 8/10, identifies the location as lower abdomen, and describes the quality as burning and throbbing. However, she no longer grimaces, refuses further analgesia, and reports feeling no distress or urge to make the sensation stop, often reading or sleeping through episodes that previously caused screaming. The tissue damage remains identical; the social context is unchanged; only the neural substrate of affective processing has been altered.

  **The setup**
  The case compares Patient K before and after anterior cingulotomy. Condition One is pre-surgery standard pain. Condition Two is post-surgery asymbolia. Held fixed are sensory-discriminative properties: nociceptive input, reported intensity (8/10), location (lower abdomen), and qualitative character (burning/throbbing). External factors like tissue damage and social context are also fixed. What varies exclusively is the affective-motivational component. In Condition One, the sensation accompanies significant distress and aversion. In Condition Two, the sensation persists without suffering, distress, or desire to avoid the stimulus. This isolates the affective variable completely.

  **The intrinsic view**
  According to the intrinsic view, the badness of pain is constituted by the sensory phenomenology itself. Since the sensory qualities—intensity, location, and burning quality—are held fixed between Condition One and Condition Two, the intrinsic theorist must verdict that the badness is identical in both instances. The surgery merely severed the behavioral and expressive connections to the pain, not the pain's normative weight. If the sensation feels the same, its inherent disvalue remains unchanged. The patient's lack of distress in Condition Two is interpreted as a failure of recognition or a dissociation from the value already present in the experience. The pain is still bad *for* the patient, even if the patient no longer reacts to that badness. Thus, the surgery did not remove the badness, only the reaction to it. The clinic alleviated comprehension, not badness.

  **The evaluative view**
  The evaluative view holds that pain's badness arises from the subject's negative attitude toward the sensation. Here, the verdicts diverge sharply. Condition One is bad because the sensory state is coupled with aversion, distress, and a desire for cessation. Condition Two, however, lacks this constitutive element. While the sensory signal persists, the affective response that makes pain unpleasant has been extinguished. Therefore, Condition Two is not bad in the relevant normative sense, despite retaining the sensory label of 'pain.' The surgery successfully removed the badness by targeting the affective processing center, not the sensory cortex. For the evaluative theorist, a pain without suffering is a contradiction in terms regarding value; the sensation is merely information. Thus, Patient K's well-being is genuinely improved in Condition Two because the negative evaluative layer has been stripped away, leaving a merely informational sensory state.

  **What's doing the work**
  The feature forcing disagreement is the dissociation between sensory qualia and affective response. Standard cases conflate sensation and suffering, letting both theories agree pain is bad. This case isolates variables. If affect were removed with sensation, both would agree badness is gone. If sensation and distress remained, both would agree it is bad. Conflict arises only because sensory character is preserved while 'minding' is deleted. This decoupling forces the intrinsicist to locate badness in the signal, and the evaluativist in the reception. Without this clinical dissociation, the debate remains verbal. It works because sensory identity is maintained while motivational pull vanishes.

  **The intrinsic theorist's reply**
  The intrinsic theorist might deny the phenomenology is truly fixed. They could argue that 'minding' is part of the sensory phenomenology, not a separate layer. If K doesn't mind, the sensation itself has changed subtly, even if ratings match. Alternatively, they might argue K is confabulating; the badness is present but K lacks the capacity to react to it. However, this reply struggles against neural evidence showing distinct pathways for sensation and affect. If the cingulate processes affect and the somatosensory cortex processes sensation, claiming they are phenomenally identical despite neural separation begs the question against the evaluative view.
