answer: |-
  **Memorandum: Practical Position Sizing Protocol**

  **To:** Investment Committee / Trading Desk
  **From:** Head of Risk & Strategy
  **Subject:** Implementing a Kelly-Based Sizing Framework

  ### 1. Philosophy and Ground Rules

  You are correct to adopt the Kelly criterion as your organising principle. Maximising expected log wealth is the only mathematically sound method for compounding capital over repeated bets without risking ruin. However, the textbook Kelly criterion assumes you know the true probabilities and payoffs. You do not. You have estimates.

  If you bet "Full Kelly" on estimated edges, you will overbet. Overbetting by even a small margin turns a positive expectation into a negative growth rate. In our context, "Half-Kelly" (betting 50% of the theoretical optimum) is not conservative; it is the baseline. It reduces volatility by 75% while sacrificing only 25% of expected growth.

  The following procedure is designed for your team's skill set. It relies on spreadsheet arithmetic, not stochastic calculus. It distinguishes between **Calculations** (derived from theory) and **Judgments** (heuristics to survive model error).

  ---

  ### 2. The "Desk Kelly" Procedure

  Run this sequence weekly for every active position.

  #### Step 1: Standardise Inputs (Calculation)
  Your forecasts come in different formats. Convert them all into an Expected Return ($\mu$) and a Standard Deviation of Outcome ($\sigma$).

  *   **For Binary Events (e.g., Merger Arb):**
      *   $\mu = (P_{win} \times Return_{win}) + (P_{loss} \times Return_{loss})$
      *   $\sigma = \sqrt{P_{win}(Return_{win} - \mu)^2 + P_{loss}(Return_{loss} - \mu)^2}$
  *   **For Continuous Forecasts (e.g., FX, Equities):**
      *   $\mu =$ Your point forecast (e.g., 2%).
      *   $\sigma =$ The standard deviation implied by your confidence interval.
      *   *Note:* If you provide a 95% Confidence Interval, $\sigma \approx \text{Width of Interval} / 4$. If you provide a Standard Error (SE) on the forecast, treat this as $\sigma$ only if it represents the volatility of the outcome, not just the uncertainty of the mean. *For this protocol, we will treat the provided SE as the volatility of the P&L distribution.*

  #### Step 2: Calculate Raw Kelly Fraction (Calculation)
  Compute the theoretical optimal leverage ($f_{raw}$).

  *   **Continuous/Gaussian:** $f_{raw} = \mu / \sigma^2$
  *   **Binary:** $f_{raw} = \frac{P_{win}}{1} - \frac{P_{loss}}{\text{Odds}}$
      *   Where $\text{Odds} = |Return_{win} / Return_{loss}|$

  #### Step 3: Apply Estimation Haircut (Judgment)
  Your $\mu$ and $\sigma$ are noisy. Full Kelly assumes they are truth. We must discount.

  *   **Base Rule:** Apply a 50% haircut ($f_{adj} = 0.5 \times f_{raw}$).
  *   **Significance Filter:** Calculate the t-statistic of your forecast ($t = \mu / \text{SE}_{\text{forecast}}$).
      *   If $|t| < 1$: Set $f_{adj} = 0$. (Do not trade noise).
      *   If $1 < |t| < 2$: Reduce haircut to 25% of Raw Kelly.
      *   If $|t| \ge 2$: Use the Base 50% haircut.

  #### Step 4: Portfolio Aggregation & Correlation Cap (Judgment)
  You cannot simply sum the $f_{adj}$ of 25 positions. Correlations increase during stress.

  *   **Grouping:** Bucket positions by risk driver (e.g., "Global Equities", "G10 FX", "Volatility").
  *   **Bucket Cap:** The sum of Kelly fractions in any single bucket cannot exceed 50% of NAV.
  *   **Global Cap:** The sum of all Kelly fractions cannot exceed 150% of NAV (Gross Exposure).
  *   **Scaling:** If the sum exceeds the caps, scale all positions down pro-rata.

  #### Step 5: Sanity Checks (Judgment)
  *   **Liquidity:** Is the calculated position size > 10% of average daily volume? If yes, cap at 5% of ADV.
  *   **Skew Warning:** If the payoff distribution is highly skewed (e.g., short volatility, where you win small often and lose big rarely), Kelly underestimates ruin risk. Apply an additional 50% haircut to these specific strategies.

  ---

  ### 3. Worked Examples

  Here is how the procedure functions in practice.

  #### Example 1: The Binary Event (Merger Arb)
  **Forecast:** 65% probability of close.
  **Payoff:** +12% if close, -20% if fails.

  **Step 1: Standardise**
  *   $\mu = (0.65 \times 0.12) + (0.35 \times -0.20) = 0.078 - 0.070 = 0.008$ (0.8% expected return).
  *   Variance $\sigma^2 = 0.65(0.12 - 0.008)^2 + 0.35(-0.20 - 0.008)^2$
      *   $= 0.65(0.0125) + 0.35(0.0432) = 0.0081 + 0.0151 = 0.0232$
      *   $\sigma = \sqrt{0.0232} \approx 15.2\%$
  *   *Alternative Binary Kelly Formula:* Odds $b = 12/20 = 0.6$.
      *   $f_{raw} = \frac{p(b+1) - 1}{b} = \frac{0.65(1.6) - 1}{0.6} = \frac{1.04 - 1}{0.6} = \frac{0.04}{0.6} = 6.67\%$

  **Step 2: Raw Kelly**
  *   $f_{raw} = 6.67\%$

  **Step 3: Haircut**
  *   This is a binary event, so t-stat logic is less direct, but our probability estimate (65%) is noisy.
  *   Apply Base 50% Haircut.
  *   $f_{adj} = 3.33\%$

  **Step 4 & 5: Caps**
  *   Assuming this is the only deal in the "Event Driven" bucket, it passes.
  *   **Final Position Size:** 3.3% of NAV.

  **Commentary:** Note that despite a positive expectation, the size is small. This is because the downside (-20%) is large relative to the upside, and the probability edge (15% over random) is modest. Kelly protects you from the "blow up" risk inherent in arb.

  #### Example 2: The Continuous Trade (FX)
  **Forecast:** EUR/USD appreciates by 2% over the quarter.
  **Uncertainty:** Standard Error (SE) of 4% on the forecast.
  *Assumption:* We treat the 4% SE as the standard deviation ($\sigma$) of the quarterly return distribution.

  **Step 1: Standardise**
  *   $\mu = 0.02$
  *   $\sigma = 0.04$

  **Step 2: Raw Kelly**
  *   Formula: $f_{raw} = \mu / \sigma^2$
  *   $f_{raw} = 0.02 / (0.04)^2 = 0.02 / 0.0016 = 12.5$
  *   **Raw Kelly suggests 1,250% leverage.**

  **Step 3: Haircut**
  *   t-stat = $2\% / 4\% = 0.5$.
  *   **Stop.** The Significance Filter (Step 3) states if $|t| < 1$, set size to zero.
  *   *Hypothetical:* If we ignored the filter and applied Half-Kelly: $12.5 \times 0.5 = 625\%$.

  **Step 4: Caps**
  *   Global Cap is 150%.
  *   Even with Half-Kelly, we are capped at 150%.

  **Final Decision:**
  *   **Strict Protocol:** 0% (Signal is not statistically significant).
  *   **Override (if Conviction is high):** If you override the t-stat filter based on fundamental view, you are capped at 150% Gross, likely scaled down to 50% for a single FX position.

  **Commentary:** This example highlights a critical flaw in applying continuous Kelly to low-volatility assets with point forecasts. Because $\sigma$ is in the denominator squared, small volatility estimates explode the position size. The **Significance Filter** is your safety net here. A 2% forecast with 4% noise is essentially a coin flip. Kelly correctly identifies there is no reliable edge to compound.

  #### Example 3: The "Unliked" Answer (High Conviction, High Noise)
  **Forecast:** Small-cap equity mispricing.
  **View:** We are convinced the stock is undervalued.
  **Numbers:** $\mu = 10\%$ (over 6 months).
  **Uncertainty:** The model is unstable. 95% Confidence Interval is -50% to +70%.

  **Step 1: Standardise**
  *   $\mu = 0.10$
  *   95% CI Width = $0.70 - (-0.50) = 1.20$.
  *   $\sigma \approx 1.20 / 4 = 0.30$ (30%).

  **Step 2: Raw Kelly**
  *   $f_{raw} = 0.10 / (0.30)^2 = 0.10 / 0.09 = 1.11$ (111%).

  **Step 3: Haircut**
  *   t-stat = $10\% / 30\% = 0.33$.
  *   Significance Filter says **0%**.
  *   *Let's assume you override the filter because the Principal demands we take the view.*
  *   Apply 50% Haircut: $f_{adj} = 55\%$.

  **Step 4: Caps**
  *   Single position limit (Equity): Typically 10% for family office risk comfort.
  *   The procedure suggests 55%, but the risk limit caps at 10%.

  **The Friction:**
  Your team feels high conviction. The model says "massive bet" (55%), but the noise is huge. The risk committee says "max 10%".
  However, consider the **Skew Warning** (Step 5). If this is a long equity position, losses are capped at 100%, but gains are unlimited. However, if the *estimate* is this noisy, the probability of a -50% drawdown is real.
  **Revised Decision:** Because the CI is so wide (-50%), the "Risk of Ruin" within the holding period is non-trivial. A prudent adjustment is to size based on the *lower bound* of the CI.
  *   Lower Bound = -50%.
  *   If the worst case is -50%, and you bet 10%, you lose 5% of NAV. Acceptable.
  *   If you bet 55%, you lose 27.5% of NAV. Unacceptable.

  **Final Position Size:** 10% (Capped by risk policy, justified by the wide CI).

  **Commentary:** This is where the procedure tells you something you won't like. Mathematically, the high mean drives the Kelly fraction up. Practically, the high variance should drive it down. In this specific case, the **Significance Filter** was the honest arbiter: it told you to bet zero. Overriding it requires admitting you are gambling, not trading.

  ---

  ### 4. What This Procedure Cannot Handle

  You must be clear with the Principal about the limitations of this framework. It is a tool, not an oracle.

  **1. Fat Tails and Kurtosis**
  The continuous Kelly formula ($\mu / \sigma^2$) assumes returns are Normally distributed (Gaussian). They are not. Real markets have "fat tails" (extreme events happen more often than the bell curve predicts).
  *   **The Risk:** In a crash, your $\sigma$ estimate (based on recent history) will be too low. Kelly will tell you to bet big exactly when you should be exiting.
  *   **The Fix:** You must manually stress-test $\sigma$. Do not use the last 3 months of volatility. Use the worst 3 months of the last 10 years. This is a judgment call, not a formula.

  **2. Non-Stationary Edge**
  Kelly assumes your edge ($\mu$) is constant. In trading, edges decay. A signal that worked last year may not work next quarter.
  *   **The Risk:** You size up based on historical backtests, but the live edge is zero. You are effectively "Full Kelly betting on noise."
  *   **The Fix:** The **Significance Filter** (Step 3) helps, but you need a mechanism to reduce size as a trade ages. Consider a "decay factor" where $f_{adj}$ is reduced by 10% for every month the position is held without thesis validation.

  **3. Correlation Breakdown**
  Step 4 uses simple buckets. In a liquidity crisis, correlations converge to 1. Your "diversified" book of 25 positions becomes one giant position.
  *   **The Risk:** The Global Cap of 150% might feel safe in normal markets but lethal in a crisis.
  *   **The Fix:** You need a "Crisis Correlation" estimate. When calculating the Bucket Cap, assume correlations within the bucket are 0.8, not the historical 0.3. This reduces your effective capacity.

  **4. Discontinuous Payoffs (Volatility Products)**
  You trade volatility products. These have non-linear payoffs (gamma/vega). A simple $\mu / \sigma^2$ calculation is mathematically incorrect for options.
  *   **The Risk:** Selling volatility looks like steady income (high $\mu$, low $\sigma$) until it blows up. Kelly will suggest massive sizing on short vol.
  *   **The Fix:** Do not use Kelly directly on option premiums. Convert option positions into "Delta-Equivalent" or "Vega-Equivalent" notional and apply the sizing to the *risk factor*, not the premium. Even better, treat Short Vol as a binary event with a high probability of small gain and low probability of total loss, and size accordingly (see Example 1).

  ### 5. Implementation Advice

  1.  **Start with Quarter-Kelly:** Do not start with Half-Kelly. Given your team's estimation noise, start with 25% of the theoretical Kelly. It is better to leave growth on the table than to explain a 40% drawdown to a family office principal.
  2.  **Audit the Inputs:** The procedure is only as good as the $\mu$ and $\sigma$ you feed it. If your team cannot honestly estimate the Standard Error of their forecasts, the output is garbage. Spend your next month calibrating your forecast confidence, not refining the sizing formula.
  3.  **Document Overrides:** When you override the Significance Filter or the Caps (as in Example 3), record it. If you override the model more than twice a year, the model is not the problem; your discipline is.

  This protocol balances the mathematical rigour of growth optimisation with the survival instincts required in actual markets. Use it to constrain risk, not to justify leverage.
