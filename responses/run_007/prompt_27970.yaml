  This is a classic "inverse decision theory" problem. You have a set of input cases and output verdicts, and you need to identify the function (the decision theory) mapping them. Given your advisor's specific pattern—particularly the combination of *Smoking Lesion* (Smoke) and *Classic Newcomb* (One-Box)—she is almost certainly operating within the **Functional Decision Theory (FDT)** or **Timeless Decision Theory (TDT)** cluster.

  Here is the step-by-step breakdown, the prediction for the Mom case, and the tie-breaking case you need.

  ### 1. Candidate Theories and Fit Check

  Let's evaluate the three main contenders against your six data points.

  **A. Causal Decision Theory (CDT)**
  *   **Mechanism:** Maximize utility based on causal consequences of actions. Ignores correlations that aren't causal.
  *   **Fit:**
      *   *Classic Newcomb:* **Two-Box.** (Your choice doesn't cause the money to be there). **FAIL.**
      *   *Smoking Lesion:* **Smoke.** (Smoking doesn't cause the lesion). **PASS.**
      *   *Psychopath Button:* **Press.** (Pressing doesn't cause you to be a psychopath). **FAIL** (Advisor says Don't Press).
      *   *Hitchhiker:* **Don't Pay.** (Paying doesn't cause you to have been picked up). **FAIL.**
  *   **Verdict:** Ruled out. Your advisor rejects standard CDT on Newcomb and Hitchhiker.

  **B. Evidential Decision Theory (EDT)**
  *   **Mechanism:** Maximize utility based on the news value of actions (conditional probabilities).
  *   **Fit:**
      *   *Classic Newcomb:* **One-Box.** (One-boxing is evidence of \$1M). **PASS.**
      *   *Smoking Lesion:* **Don't Smoke.** (Smoking is evidence of the lesion). **FAIL** (Advisor says Smoke).
      *   *Statistical Newcomb (60%):* **One-Box.** (At 60% accuracy, the expected utility of one-boxing usually dominates two-boxing in EDT calculations). **FAIL** (Advisor says Two-Box).
  *   **Verdict:** Ruled out. Your advisor rejects EDT on Smoking Lesion and weak Newcomb cases.

  **C. Functional Decision Theory (FDT) / Timeless Decision Theory (TDT)**
  *   **Mechanism:** Maximize the utility of the *output* of your decision procedure. You one-box if the predictor predicts via a model of your decision algorithm (subjunctive dependence). You two-box if the prediction is based on mere statistical correlation or common causes (like a lesion or personality test) without logical dependence.
  *   **Fit:**
      *   *Classic Newcomb:* **One-Box.** (Omega simulates your algorithm). **PASS.**
      *   *Smoking Lesion:* **Smoke.** (Lesion is a common cause, not logically linked to decision output). **PASS.**
      *   *Psychopath Button:* **Don't Press.** (Outputting "Press" implies you are the type who presses, i.e., a psychopath). **PASS.**
      *   *Transparent Newcomb:* **Two-Box.** (Observation screens off the correlation; the money is already fixed). **PASS.**
      *   *Hitchhiker:* **Pay.** (Your decision procedure now is logically linked to the driver's past prediction of that procedure). **PASS.**
      *   *Statistical Newcomb (60%):* **Two-Box.** (Prompt specifies "no simulation." This is a common cause/correlation case, like Smoking Lesion. FDT two-boxes here). **PASS.**
  *   **Verdict:** **Perfect Fit.** This theory unifies all six verdicts under a single principle: *One-box on logical/subjunctive dependence; Two-box on mere statistical correlation.*

  **D. Accuracy-Threshold View (Hybrid)**
  *   **Mechanism:** One-box if predictor accuracy > $X\%$; Two-box otherwise.
  *   **Fit:** Fits the Newcomb variants (100% vs 60%). Struggles to unify *Smoking Lesion* (Smoke) vs. *Psychopath Button* (Don't Press) without importing EDT/CDT distinctions ad-hoc. It lacks a principled explanation for *Hitchhiker* (where accuracy isn't quantified).
  *   **Verdict:** Less theoretically robust than FDT, though it fits the Newcomb data points.

  ### 2. Prediction: The "Mom Omega" Case

  **The Case:** Omega interviews Mom (95% accurate). Boxes filled based on Mom's prediction. No simulation specified; prediction based on Mom's knowledge of your character.

  **The Conflict:**
  *   **FDT Prediction:** **Two-Box.**
      *   *Reasoning:* FDT distinguishes between *subjunctive dependence* (Omega simulating your algorithm) and *statistical dependence* (Mom inferring your choice from your character). Mom's prediction is causally upstream of your choice (based on your past character), much like the "Personality Test" in your 60% case. There is no logical link between your *current* decision output and Mom's *past* statement, only a correlation via your psychology. Since your advisor Two-Boxed the 60% Statistical case (which was also non-simulation), consistency demands she Two-Box here, regardless of the higher accuracy.
  *   **Threshold View Prediction:** **One-Box.**
      *   *Reasoning:* 95% accuracy crosses the implicit threshold (which lies between 60% and 100%).

  **My Best Guess:**
  Your advisor will say **Two-Box**.

  **Why:**
  Philosophers working in this niche (FDT/TDT) prioritize the *mechanism of prediction* over the *accuracy rate*. The 60% Statistical verdict is the "smoking gun." It establishes that she does not One-Box on mere correlation, even when positive. Mom's interview is structurally identical to the personality test: it is an inference from *type/character*, not a simulation of *decision logic*. In FDT terms, Mom's prediction and your choice share a common cause (your psychology), but your choice does not *logically determine* Mom's past prediction. Therefore, dominance reasoning applies, and you take the extra \$1K.

  If she were to One-Box, she would be inconsistent with her verdict on the 60% Statistical case unless she argues that "Mom knowing you ridiculously well" implies a logical simulation, which contradicts the "interview" setup.

  ### 3. The Tie-Breaking Case

  To definitively settle whether she is running **FDT** (Mechanism matters) vs. **Threshold** (Accuracy matters), you need a case that decouples accuracy from the mechanism of prediction.

  **Proposed Case: "Genetic Newcomb"**
  *   **Setup:** A predictor looks at your genes. A specific gene causes both (a) a tendency to One-Box and (b) the predictor's belief that you will One-Box. The predictor is 99% accurate. Payoffs are standard Newcomb (\$1M/\$0 vs \$1K).
  *   **The Divergence:**
      *   **FDT Verdict:** **Two-Box.** (The gene is a common cause. Your decision now cannot logically change your genes or the past prediction. This is structurally identical to the Smoking Lesion).
      *   **Threshold Verdict:** **One-Box.** (99% accuracy exceeds the threshold).
      *   **EDT Verdict:** **One-Box.** (One-boxing is strong evidence you have the gene and the money).

  **Why this settles it:**
  If she Two-Boxes the Mom case (as I predict), she leans FDT. But if she Two-Boxes the **Genetic Newcomb** case, it confirms she is strictly following the *subjunctive dependence* criterion of FDT, rejecting One-Boxing even at 99% accuracy when the link is merely causal/statistical. If she One-Boxes Genetic Newcomb, she is actually an Accuracy Threshold theorist (or an EDTer who makes exceptions for Lesions), and my Mom prediction might be wrong.

  ### 4. Consensus vs. Contested

  It is vital you frame this correctly in your meeting.

  *   **Settled (Broadly):** There is no consensus that CDT is "wrong," but it is widely acknowledged in decision theory circles that CDT Two-Boxes Classic Newcomb and EDT Don't Smokes in Smoking Lesion. Your advisor's verdicts place her firmly in the "Post-CDT" camp (rejecting CDT on Newcomb/Hitchhiker) but also the "Post-EDT" camp (rejecting EDT on Lesion).
  *   **Contested:** The "Rational" verdict on **Psychopath Button** is contested. CDT proponents (like Frank Arntzenius or David Lewis-types) often argue "Press" is rational because you can't change your nature. Your advisor's "Don't Press" verdict is a specific commitment to FDT/TDT-style reasoning.
  *   **Contested:** The **Transparent Newcomb** verdict is actually a point of agreement between CDT, EDT, and FDT (all Two-Box once the boxes are transparent), so it doesn't distinguish theories, but it does rule out "dogmatic" One-Boxing views.
  *   **Niche vs. Consensus:** FDT is still considered a "niche" or "emerging" theory compared to CDT and EDT in the broader philosophical community, though it is dominant in certain decision theory workshops (e.g., MIRI-associated circles, some Oxford/Cambridge groups). Do not present FDT as the standard view; present it as the *only* view that cleanly systematizes her specific pattern of verdicts.

  ### Summary for your Meeting
  1.  **Theory:** She is running **Functional Decision Theory (FDT)**.
  2.  **Mom Verdict:** **Two-Box.** (Because Mom's prediction is statistical/common-cause, not logically dependent, matching the 60% Statistical case).
  3.  **Discriminating Case:** **Genetic Newcomb** (99% accurate, gene-based). FDT says Two-Box; Threshold/EDT says One-Box.

  This shows you understand that for her, the *source* of the correlation (logical vs. statistical) matters more than the *strength* of the correlation. Good luck.
