  Please think through this step by step. Start by laying out the candidate rules explicitly, check whether each genuinely fits all six of her verdicts, then apply them to the Mom case and give me your best guess about what she'll say and why. Also tell me what further case you'd want to see her rule on to be sure. And please separate what's basically settled among people working in decision theory from what's genuinely contested — don't present a niche view as if it's the consensus.
