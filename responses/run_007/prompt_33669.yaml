      *   *Section 2:* Explain SIA's difficulty. SIA says "I exist, therefore worlds with more observers are more likely." High risk = fewer observers. So SIA says "Risk is likely low." This kills the Shadow argument. Bring in Presumptuous Philosopher: SIA allows you to rule out "Small World" theories just by existing. This is controversial. Rejecting SIA to avoid PP pushes you back to SSA, which saves the Shadow argument but risks the Doomsday Argument.
