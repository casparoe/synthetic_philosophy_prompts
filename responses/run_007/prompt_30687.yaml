answer: |-
  **MEMORANDUM**

  **TO:** Disciplinary and Registration Committee
  **FROM:** Legal Officer
  **SUBJECT:** Procedure for Statutory Interpretation (Drafting and Application)
  **DATE:** 24 May 2024

  ### 1. Introduction

  You are often asked to decide cases where the outcome depends on the meaning of a single word or phrase in our enabling Act or Rules. Because these decisions affect livelihoods and tenant rights, they must be robust enough to withstand judicial review. The courts do not expect you to be legal theorists, but they do expect you to demonstrate a rational process of reasoning.

  The procedure below is designed to be used in real-time. It is grounded in the established principles of statutory interpretation (specifically the approach of the UK Supreme Court in cases like *R (Quintavalle) v Secretary of State for Health* [2003]). It distinguishes between what the law *allows* you to do and what it *requires* you to do.

  **Note on Theory:**
  *   **Textualism** prioritises the ordinary meaning of the words. It warns against judges or regulators rewriting laws because the outcome seems unfair.
  *   **Purposivism** prioritises the goal the law was trying to achieve. It allows meaning to shift to ensure the purpose is not defeated.
  *   **UK Law:** The courts use a "purposive construction." You start with the text, but you read it in the light of the purpose. However, you cannot ignore clear text simply because the result is harsh.

  ---

  ### 2. The Decision Procedure

  Use the following six steps in order. Do not skip to Step 4 (Purpose) unless Step 3 (Ambiguity) is satisfied.

  #### Step 1: Establish the Ordinary Meaning
  **Question:** What is the ordinary, natural meaning of the disputed words in the context of everyday English?
  *   **Sufficient Answer:** A definition that a layperson would recognise without legal training. (e.g., "In person" means physical presence; "Enter" means to go inside).
  *   **Theory Note:** *Textualist baseline.* This anchors the interpretation. If you cannot define the ordinary meaning, you cannot measure departure from it.
  *   **Stop Condition:** If the ordinary meaning is clear and leads to a sensible result in this case, proceed to Step 6 to confirm no absurdity. Do not look for purpose yet.

  #### Step 2: Check the Statutory Context
  **Question:** Do other sections of the Act or Rules define this word differently, or use it in a way that constrains its meaning?
  *   **Sufficient Answer:** Reference to a definitions section or a consistent pattern of usage elsewhere in the legislation.
  *   **Pragmatic Shortcut:** If the Act has a definitions section, it controls. If not, look at the immediate subsection.
  *   **Stop Condition:** If context clarifies the meaning, return to Step 1.

  #### Step 3: Identify Genuine Ambiguity
  **Question:** Is the ordinary meaning *unclear* or *capable of two or more reasonable interpretations* in this specific scenario?
  *   **Sufficient Answer:** You must be able to articulate two distinct, plausible meanings. (e.g., Does "enter" mean physical bodily entry, or does it include sending a device? Both are plausible).
  *   **Theory Note:** *The Fork.*
      *   **Textualist Instruction:** If the text is clear, stop. Do not pass Go. Do not collect Purpose.
      *   **Purposivist Instruction:** If the text is ambiguous, purpose is the primary tool to resolve it.
      *   **UK Law:** You may only move to Step 4 if there is genuine ambiguity or if the literal meaning leads to Step 5 (Absurdity).
  *   **Stop Condition:**
      *   If **NO** (Text is clear): Go to Step 5 (Absurdity Check).
      *   If **YES** (Text is ambiguous): Go to Step 4 (Purpose).

  #### Step 4: Resolve Ambiguity via Purpose
  **Question:** What is the "mischief" or objective this provision was designed to address? Which of the plausible meanings from Step 3 best gives effect to that purpose?
  *   **Sufficient Answer:** A statement of the legislative goal (e.g., "To protect tenant privacy" or "To ensure market transparency").
  *   **Theory Note:** *Purposive Resolution.* You are not asking "What do we want?" You are asking "What did Parliament/Ministers want?"
  *   **Stop Condition:** Select the meaning that best aligns with the purpose. Proceed to Step 6.

  #### Step 5: The Absurdity and Drafting Error Check
  **Question:** Does applying the clear ordinary meaning (from Step 1/3) lead to a result that is logically impossible, incoherent, or defeats the obvious object of the statute entirely?
  *   **Sufficient Answer:** You must identify a logical contradiction, not just an unfair outcome. (e.g., A rule requiring a hearing "within 7 days" where the only available room is booked for 10 days creates an impossibility).
  *   **Theory Note:** *The Safety Valve.*
      *   **Distinction (ii) vs (iii):** This step addresses **drafting errors/absurdity** (iii). It does *not* address **harsh results** (ii).
      *   **Textualist View:** The bar for absurdity is extremely high (logical incoherence).
      *   **Purposivist View:** The bar is lower (defeating the purpose).
      *   **UK Law:** Follow *Stock v Frank Jones (Tipton) Ltd* [1978]. You cannot rewrite legislation to cure unfairness. You can only correct a drafting error if the intended meaning is obvious and the text fails to capture it due to a mistake.
  *   **Stop Condition:**
      *   If **YES** (It is absurd/incoherent): You may depart from the ordinary meaning to the minimum extent necessary to fix the incoherence.
      *   If **NO** (It is just harsh/unfair): You **must** apply the ordinary meaning. Go to Step 6.

  #### Step 6: Final Verification and Committee Hand-off
  **Question:** Is the remaining disagreement about the *law* (meaning of words) or about *policy* (whether the rule is good)?
  *   **Sufficient Answer:**
      *   **Law:** "The words mean X." (Legal Officer advises).
      *   **Policy:** "The words mean X, but X is unfair." (Committee decides).
  *   **Theory Note:** *Separation of Powers.* If the text is clear and not absurd, but the result is harsh, the law is settled. The Committee cannot fix it by interpretation. They must record the harshness and recommend a rule change to the Ministry/Board.
  *   **Stop Condition:** Procedure ends. The Committee votes on the facts applying the meaning determined above.

  ---

  ### 3. Application to Current Cases

  I have applied the procedure above to the three pending matters. Below are the outcomes.

  #### Case 1: The Drone ("Entered... premises")
  *   **Step 1 (Ordinary Meaning):** "Enter" ordinarily implies a person physically crossing a boundary. A drone is an object, not a person.
  *   **Step 3 (Ambiguity):** **Yes.** In the modern context, "entering" a space can metaphorically include penetrating the airspace with a surveillance device. It is ambiguous whether "agent enters" includes "agent's device enters."
  *   **Step 4 (Purpose):** The purpose of the notice requirement is to protect tenant privacy and security within the home. A drone photographing the interior violates this privacy just as much as physical entry.
  *   **Step 5 (Absurdity):** N/A (Ambiguity resolved at Step 4).
  *   **Conclusion:** **Breach Found.** The purposive reading resolves the ambiguity in favour of protecting privacy. The agent "entered" via the drone.

  #### Case 2: The Private Message ("Advertised... to let")
  *   **Step 1 (Ordinary Meaning):** "Advertise" usually implies a public announcement. A private message to a known group is less clearly an advertisement.
  *   **Step 3 (Ambiguity):** **Yes.** Is a private offer to a select group an "advertisement"? It lies on the boundary between private correspondence and public marketing.
  *   **Step 4 (Purpose):** The purpose of licensing and advertising rules is to ensure tenants know they are dealing with a regulated entity and to prevent unlicensed letting activity. Hiding offers in private groups defeats this transparency.
  *   **Step 5 (Absurdity):** N/A.
  *   **Conclusion:** **Breach Found.** The purposive reading captures private mass-messaging as "advertising" to prevent evasion of the licensing scheme.

  #### Case 3: The Video Link ("In person")
  *   **Step 1 (Ordinary Meaning):** "In person" means physical bodily presence in the same room. Video link is explicitly *not* physical presence.
  *   **Step 3 (Ambiguity):** **No.** The meaning is clear. "In person" contrasts with "remotely" or "by proxy." There is no genuine linguistic ambiguity here.
  *   **Step 5 (Absurdity Check):** Does requiring physical presence create a logical impossibility? **No.** The licensee *can* physically attend, though it causes significant distress due to their anxiety disorder.
  *   **Step 6 (Harshness vs Law):** The result is harsh. Denying a disabled person a reasonable adjustment feels unjust. However, under Step 5, **harshness is not absurdity.** The text is clear.
  *   **Conclusion:** **Request Denied (under the Rules).** The Rules say "in person." Video is not "in person."
      *   *Legal Officer's Note:* This is the answer I do not like. It exposes a gap between our Rules and the *Equality Act 2010*. However, strictly interpreting *our* Rules, the Committee cannot deem video attendance to be "in person."
      *   *Action:* The Committee must refuse the request *under the Rules*, but should immediately trigger a separate process to consider a Reasonable Adjustment under the Equality Act, or recommend an emergency rule amendment. The interpretation procedure cannot cure the policy defect.

  ---

  ### 4. Limitations of the Procedure

  This procedure is a tool for interpreting the law as it exists, not for fixing the law as it ought to be. Specifically, it cannot settle:

  1.  **Conflicts between Statutes:** In Case 3, the procedure interprets the *Hearing Rules* correctly, but it cannot reconcile them with the *Equality Act 2010*. That is a matter of legal hierarchy, not interpretation.
  2.  **Policy Gaps:** Where the text is clear but the outcome is outdated (e.g., "in person" in a post-pandemic world), the procedure forces you to apply the old rule. It identifies the need for legislative change but cannot enact it.
  3.  **Evidential Weight:** This procedure tells you what the words mean, not whether the facts are proven. It does not replace the need for evidence.

  **Summary for the Committee:**
  In Cases 1 and 2, the language was ambiguous, so we used the purpose of the law to find breaches. In Case 3, the language was clear, so we must apply it even though the result is harsh. If you wish to allow the video link in Case 3, you must do so under separate statutory duties (Equality Act), not by reinterpreting the words "in person."
