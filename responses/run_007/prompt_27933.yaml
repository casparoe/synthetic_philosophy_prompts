          *   No citations.

  2.  **Deconstruct the Core Tension:**
      *   *Liberal Neutrality (LN):* Focuses on legitimacy via non-imposition of specific "goods." Problem: AI isn't a state, but it *does* impose outcomes (default settings, recommendations that shape behavior). Also, LN assumes distinct agents; AI often mediates within a single agent's conflicting preferences or acts for groups without clear boundaries.
      *   *Social Choice (SC):* Focuses on aggregating fixed preferences into a collective decision. Problem: AI preferences are fluid, inferred, context-dependent, and involve entities (future people, animals) not present to vote.
      *   *The Gap:* How to legitimize AI action when the "constituency" is ill-defined and the "state" constraint (coercion) doesn't apply, yet the impact is pervasive.

  3.  **Drafting the Candidate Questions:**
      *   Need 3-4 strong questions.
      *   *Q1 (The Constituency Problem):* Who counts? (Future people, animals, non-users affected by externalities). LN usually limits to citizens; SC limits to voters. AI affects everyone.
      *   *Q2 (The Neutrality Constraint):* What does neutrality mean for a non-coercive agent? If AI can't be neutral (it must act), what is the default? LN says "don't justify by the good." AI must optimize *something*.
      *   *Q3 (Intrapersonal Aggregation):* LN/SC assume stable agents. Humans are fragmented. Should AI align with the "reflective self" or the "impulsive self"? This is aggregation *within* a user, which spills over to aggregation *between* users.
      *   *Q4 (Deprioritized):* Something technical or already well-trodden. Maybe "How to mathematically model utility functions." Too ML/Econ. Or "Global Constitutionalism for AI." Too abstract/untractable for 2 years. Let's pick "Defining a Global AI Constitution."

  4.  **Developing the Ordering/Strategy:**
      *   *Criteria:* Tractability for philosophers (conceptual clarity > formal modeling), Upstream leverage (foundational concepts first), Neglectedness (avoid standard SC/LN rehashes).
      *   *Ordering:*
          1.  *Constituency:* You can't aggregate if you don't know *whose* values. (Most upstream).
          2.  *Neutrality/Justification:* Once you know whose values, how do you weigh them without imposing a specific "good"? (The core normative constraint).
          3.  *Intrapersonal/Interpersonal Boundary:* How to handle the fragmentation of the "whose" identified in Q1.
      *   *Deprioritize:* "Procedural Legitimacy for AI Governance." (Too institutional/policy-focused, less conceptual).

  5.  **Refining the Arguments (incorporating the User's Angle):**
      *   Acknowledge the user's suspicion: LN is for states, SC is for elections.
      *   Argue that the *first* step isn't how to aggregate, but *who is in the room*.
      *   Argue that philosophers are best suited for the *conceptual boundaries* (moral status, moral patienthood) rather than the *algorithmic implementation*.
      *   Trade-off: Importance (Constituency is huge) vs. Tractability (It's very hard). But for a 2-year philosophy grant, defining the moral circle is more feasible than solving the aggregation math.

  6.  **Drafting the Memo Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The core thesis (shift from "how to aggregate" to "who counts and what is neutrality for agents").
      *   **Strategic Criteria:** How we ranked them.
      *   **Research Questions (Prioritized):**
