      *   *Critique:* Is Q2 too vague? *Fix:* Define progress as a taxonomy of "non-coercive imposition."
      *   *Critique:* Make sure to explicitly validate the user's intuition about Liberal Neutrality while pushing it further. The memo should say "You are right, LN fails, but here is the specific conceptual repair needed."
      *   *Tone:* Professional, strategic, academic but actionable.

  9.  **Final Polish:** Check word count and flow. Ensure the "Why Philosophers" aspect is clear (conceptual clarity precedes formalization). (Self-correction: Ensure I don't drift into ML safety technicalities).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Research Directorate
  **FROM:** Strategy Advisory
  **DATE:** October 26, 2023
  **SUBJECT:** Prioritizing Research on Value Aggregation and Liberal Neutrality in AI

  ### Executive Summary

  The standard literature on AI alignment treats value aggregation as a technical problem of satisfying fixed preferences, and political legitimacy as a problem of state coercion. Both frames are mismatched to the reality of deployed AI systems. AI is not a coercive state, yet it exerts pervasive influence through default actions. It is not a voting machine, yet it must aggregate interests across ill-defined constituencies (including non-users and future persons).

  This memo proposes a two-year research agenda for 4–5 FTE researchers in philosophy and political theory. We recommend prioritizing **conceptual boundary-setting** over **aggregation mechanics**. The field currently attempts to solve *how* to aggregate before settling *whose* values count and *what kind* of neutrality is possible for a non-state agent. Our ordering prioritizes upstream conceptual questions that are tractable for philosophers and necessary before formal modeling can proceed meaningfully.

  ### Strategic Criteria for Ordering

  We ranked candidate questions based on three criteria:

  1.  **Upstream Leverage:** Does answering this question resolve ambiguities that block progress on others? (e.g., You cannot aggregate values if you haven't defined the moral status of the entities holding them).
  2.  **Philosophical Tractability:** Is progress measurable via conceptual analysis and argumentation within two years, rather than requiring empirical data or new mathematical formalisms better suited to economists or ML researchers?
  3.  **Neglectedness:** Does this address the specific gap where Liberal Neutrality (LN) and Social Choice (SC) both fail, rather than rehashing established debates in either field?

  **Trade-off:** We are trading off immediate applicability (e.g., "what loss function should we use?") for foundational clarity. A flawed conceptual foundation will render precise aggregation models normatively inert.

  ### Prioritized Research Questions

  #### 1. The Moral Constituency of Default Action
  **The Question:** When an AI system acts without explicit instruction (e.g., filtering content, routing traffic, scheduling resources), what is the normative boundary of the "constituency" whose interests must be weighed? Specifically, does the AI owe moral consideration to affected parties who are not users, cannot consent, or lack moral agency (e.g., animals, future people, cognitively impaired persons)?

  **Why the Literature Leaves This Open:**
  *   **Liberal Neutrality** typically restricts the constituency to citizens subject to coercive law. AI users are not citizens, and AI impact is not strictly coercive law.
  *   **Social Choice** restricts the constituency to voters with revealed preferences. AI affects those with no voice and no revealed preferences.
  *   **Current Alignment Work** assumes the "user" is the sole principal, ignoring externalities.

  **Conditions for Progress:**
  Researchers produce a defended taxonomy of "moral patients" in the context of AI delegation. Success is not a final list, but a set of criteria distinguishing between *stakes* (being affected), *agency* (ability to choose), and *authority* (right to command). Two researchers would agree progress has been made if they can consistently classify edge cases (e.g., a non-user whose job is displaced by an AI assistant optimizing a user's workflow) using these criteria.

  **Upstream/Downstream:**
  This is the most upstream question. You cannot determine how to aggregate values (Q2) until you know whose values enter the function.

  **Tractability for Philosophers:**
  High. This relies on existing debates in moral status and moral patienthood, applied to a new technological context. It does not require new math.

  #### 2. Neutrality as a Constraint on Optimization (Not Justification)
  **The Question:** Liberal Neutrality forbids the state from justifying laws by appealing to the superiority of a specific conception of the good. Since AI is not a state but an optimizer that *must* select a specific outcome to function, what is the analogous constraint for AI? Is it possible for an AI to be "neutral" while acting, or must we replace neutrality with a duty of "non-domination" or "minimal imposition"?

  **Why the Literature Leaves This Open:**
  *   **Liberal Neutrality** relies on the distinction between justification and coercion. AI justifies its actions through code, not public reason, and its "coercion" is often soft (friction, defaults) rather than hard (force).
  *   **Alignment Research** often assumes "neutrality" means "do what the user wants," which collapses when user wants conflict with the good or with others' wants.

  **Conditions for Progress:**
  Researchers articulate a normative framework for "non-state neutrality." Success looks like a paper distinguishing between *outcome neutrality* (impossible for optimizers) and *procedural neutrality* (possible). Progress is achieved if we can define a "legitimacy threshold" for AI action that does not rely on state-based consent mechanisms.

  **Upstream/Downstream:**
  Downstream of Q1 (you need to know who counts to know who you must be neutral toward), but upstream of Q3. It defines the *rules* of aggregation before we handle the *inputs*.

  **Tractability for Philosophers:**
  Medium-High. This requires re-purposing political concepts for private/algorithmic power. It is conceptual work, but risks becoming too abstract without grounding in AI capabilities.

  #### 3. Intrapersonal Aggregation as a Precondition for Interpersonal Aggregation
  **The Question:** Standard aggregation assumes stable agents with coherent preferences. Humans are temporally fragmented and psychologically conflicted. Before aggregating *between* users, how should an AI aggregate *within* a single user (e.g., present self vs. future self, impulsive self vs. reflective self)? Does resolving intrapersonal conflict change the weight that self's values carry in interpersonal aggregation?

  **Why the Literature Leaves This Open:**
  *   **Social Choice** treats the individual as a black box with a preference ordering.
  *   **Liberal Neutrality** treats the individual as the sovereign unit of respect.
  *   **AI Reality** AI systems (e.g., health coaches, productivity tools) are explicitly designed to override immediate preferences for long-term goals, effectively taking a stance on intrapersonal aggregation.

  **Conditions for Progress:**
  Researchers develop a theory of "diachronic agency" for alignment. Success is a framework that specifies when an AI is justified in privileging a user's long-term values over short-term preferences, and whether that privilege alters the user's voting weight in multi-user settings.

  **Upstream/Downstream:**
  Downstream of Q1 and Q2. Once we know who counts and what neutrality requires, we must handle the internal structure of those counts.

  **Tractability for Philosophers:**
  Medium. This intersects with philosophy of action and psychology. It risks requiring empirical input on human psychology, but the normative core is philosophical.

  ### Deprioritized Question

  **Question:** *Procedural Legitimacy for Global AI Governance.*
  (How do we construct democratic institutions to oversee AI development globally?)

  **Reason for Deprioritization:**
  While critically important, this is a question of institutional design and political science, not foundational normative theory. For a 4-person philosophy team over two years, this is too broad and too dependent on empirical political dynamics. Furthermore, it is downstream of Q1 and Q2; we cannot design legitimate institutions until we know what constitutes legitimacy for AI agents. Funding this now would risk producing procedural solutions for undefined normative problems.

  ### Re-Ranking Triggers

  We should re-evaluate this ordering if the following developments occur within the next 12–18 months:

  1.  **Capability Shock:** If AI systems demonstrate the ability to autonomously negotiate contracts or wield legal authority, Q2 (Neutrality/Justification) moves to top priority, as the "non-state" distinction collapses.
  2.  **Formal Breakthroughs:** If economists or ML researchers solve the formal problem of aggregating incomplete preferences, our researchers should shift from Q3 (Intrapersonal) to critiquing the normative assumptions of that formalism.
  3.  **Regulatory Hardening:** If major jurisdictions pass laws defining "AI personhood" or "digital rights," Q1 (Constituency) becomes partially settled by fiat, requiring us to shift to compliance and critique rather than foundational theory.

  ### Conclusion

  The most valuable contribution this program can make is to stop the field from importing state-centric political theory and voter-centric economics into a domain where neither fits. By prioritizing the **Constituency** (Q1) and the **Nature of Non-State Neutrality** (Q2), we provide the conceptual scaffolding necessary for any subsequent formal work on aggregation. This plays to the comparative advantage of philosophers: clarifying the concepts that engineers are currently operationalizing by default.
