      *   *Why literature leaves it open?* Yes, contrast State vs. Agent, Voter vs. Affected.
      *   *Upstream/Downstream?* Yes, Constituency -> Neutrality -> Aggregation.
      *   *Tractability for Philosophers?* Yes, focus on normative concepts, not code.
      *   *Deprioritize one?* Yes.
      *   *Defend ordering?* Yes, in the criteria section.
      *   *No citations?* Checked.

  8.  **Self-Correction/Polishing during drafting:**
