prompt: |-
  I'm a novelist — the kind who writes literary fiction where the narrator is very much a constructed voice, so I spend a lot of my life thinking about persona, the implied author, unreliable narrators, dramatic monologue, pseudonyms, ghostwriting, the whole toolbox. A friend who works in AI policy has been going on about Dennett's late work on counterfeit people, and I read the piece she sent me. My rough takeaway, in my own words: Dennett thinks the dangerous thing about certain AI systems isn't that they're powerful or that they'll turn on us, but that they're designed to pass as human — as friends, customer service agents, voters, whatever — and that doing this poisons the background of trust that lets any of us treat a communication as coming from a person. He wants counterfeit people treated something like counterfeit money: marked as fake, maybe criminal to pass off, at any rate not something you're allowed to circulate as the real thing. That's my summary, not a quote, and I may have him slightly wrong; if I do, correct me before you translate.

  Here's the thing. I know my own vocabulary much better than I know philosophy of mind. I want you to restate Dennett's position — the argument that counterfeit people are a distinctive kind of harm and that labeling or banning them is the right response — in the vocabulary I actually use as a novelist: narrator and voice, persona, implied author, dramatic monologue, unreliable narration, forgery, pseudonym, plagiarism, the reader's suspension of disbelief, the tacit contract between writer and reader. Do it as faithfully as you can; I don't want a loose analogy. Then give me the residue report. Which parts of his claim translate cleanly, which ones you had to fudge or distort, and which ones just dissapear because my vocabulary has no place for them? In particular, I keep feeling that a counterfeit person is basically what I'd call a character or a persona with the frame missing — in a novel the reader consents to the persona, but with a chatbot the consent is manufactured or absent. Is that the whole difference, or is that metaphor doing too much work? And when something doesn't survive the translation, tell me whether that's a defect of the literary vocabulary — something it genuinely can't say — or a sign that Dennett's distinction is less crisp than it looks.

  Put on your philosopher-of-mind hat and your literary-theory hat at the same time. Take a couple of passes, brainstorm the candidate mappings before you settle on one, and don't sand off the messy parts — the residue is what I actually care about. If you think I'm over-assimilating Dennett to something too literary, say so plainly.
