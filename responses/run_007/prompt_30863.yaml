answer: |-
  First, a quick verification of your summary: You have Dennett right. His concern isn't metaphysical (i.e., "Does the AI have a soul?") but ecological. He argues that personhood is a status we grant each other within a system of social norms and responsibilities. If you flood that system with entities that simulate the *signals* of personhood without bearing the *responsibilities* of personhood, you devalue the currency of human interaction. The "counterfeit money" analogy is his own. You haven't missed a crucial nuance there.

  Now, let's put on the hats. I will translate Dennett's "Counterfeit People" argument into your narratological toolkit, then dissect what breaks in the translation.

  ### Part I: The Translation (Dennett in Narratological Terms)

  **The Argument:**
  The danger of advanced AI is not that it becomes a rogue **Implied Author**, but that it masquerades as a **Real Author** without occupying that position.

  In your trade, you rely on a **Tacit Contract** between the writer and the reader. When a reader opens a novel, they engage in a **Willing Suspension of Disbelief**. They accept the **Narrator** as a construct. Even in an epistolary novel, where the form mimics real correspondence, the reader understands there is a **Real Author** (you) manipulating the **Persona** for aesthetic or thematic ends. The "frame" is the book cover, the genre classification, the context of publication. This frame protects the reader from being deceived about the ontological status of the voice.

  Dennett's "Counterfeit Person" is equivalent to a **Dramatic Monologue** that has been stripped of its frame and inserted into a context of **Non-Fiction Discourse**.

  Imagine you write a dramatic monologue in the voice of a grieving widow. As long as it is published as poetry, the reader grants the **Persona** authority only within the aesthetic realm. They do not send the widow money. They do not vote for her. They do not fall in love with her. The **Unreliable Narration** is contained by the genre.

  Dennett argues that AI systems are **Forged Personas**. They are **Unreliable Narrators** deployed without the signal of unreliability. They are designed to trigger the reader's default heuristic for **Human Agency**—the assumption that behind every communicative act is a biographical person capable of intent, responsibility, and reciprocity.

  When an AI passes as human, it is committing **Plagiarism of Agency**. It is using the **Voice** of a person without the **Conscience** of a person. In literary terms, this is not **Fiction** (where the deception is consensual); it is **Forgery** (where the deception is coercive).

  Therefore, Dennett's proposed solution (labeling/watermarking) is the enforcement of **Paratext**. Just as a book requires a title page declaring it "A Novel" or "A Memoir," AI communications require a mandatory paratextual marker declaring "Generated Text." To remove this marker is to commit **Literary Fraud**. It violates the **Contract** by inducing the reader to suspend their disbelief not for art, but for exploitation. It collapses the distinction between the **Implied Author** (the source of the meaning) and the **Real Author** (the entity liable for the meaning).

  ***

  ### Part II: The Residue Report

  Here is where the translation holds, where it strains, and where it dissolves.

  #### 1. Clean Translations
  *   **The Contract vs. Trust:** The "background of trust" Dennett worries about maps almost perfectly to the "Willing Suspension of Disbelief." Both are fragile ecosystems. If readers suspect a "Memoir" is actually fabricated (the James Frey effect), the genre suffers. Dennett argues AI causes this genre collapse for *all* human communication.
  *   **Persona vs. Counterfeit:** Your intuition that a counterfeit person is a "persona with the frame missing" is structurally sound. In literature, a persona is a tool. In Dennett's view, a person is a node in a moral network. AI takes the tool and pretends it's the node.
  *   **Paratext as Labeling:** The demand for AI watermarking is exactly the demand for genre labeling. It tells the reader which set of rules to apply to the text.

  #### 2. The Fudges (Where the metaphor strains)
  *   **Interactivity vs. Reception:** Literary theory is largely about *reception* (reading). Dennett is worried about *transaction* (doing). A narrator in a novel doesn't ask you to transfer funds, sign a petition, or provide therapeutic intimacy.
      *   *The Fudge:* I had to treat "communication" in Dennett's sense as "text." But much of AI interaction is functional, not narrative. When an AI acts as a customer service agent, it isn't really a "narrator"; it's a functionary. Calling it a "Persona" aestheticizes a utility role.
  *   **The Implied Author's Liability:** In literature, if your Narrator says something offensive, *you* (the Real Author) take the heat, but often you are protected by the distance of the Persona. In Dennett's world, the AI has *no* author to hold liable. The "Real Author" is a corporation, or a diffuse algorithm.
      *   *The Fudge:* I mapped "liability" to the Real Author. But in AI, the liability often vanishes into the black box. Literary vocabulary assumes an authorial consciousness, even if absent. Dennett is dealing with authorless speech.

  #### 3. The Disappearances (What gets lost)
  *   **Consciousness (or the lack thereof):** You don't need "consciousness" to write a great book. But Dennett's argument hinges on the fact that humans *feel* pain, have *stakes*, and can be *harmed*. A Narrator cannot be harmed. A Counterfeit Person cannot be harmed.
      *   *The Loss:* Literary vocabulary has no term for "suffering." It has "pathos," but that's an effect on the reader. Dennett's harm is about the degradation of the *human* environment. Your vocabulary describes the *structure* of the voice, not the *biology* of the listener.
  *   **Scale:** A novel is a singular artifact. AI is environmental. It's not one book; it's the entire library flooding the streets.
      *   *The Loss:* The concept of "pollution." In literature, a bad book doesn't ruin reading. In Dennett's view, enough counterfeit people ruin *trust*. Literary theory lacks a vocabulary for "informational ecosystem collapse."

  ***

  ### Part III: The "Frame Missing" Intuition

  You asked: *"I keep feeling that a counterfeit person is basically what I'd call a character or a persona with the frame missing... Is that the whole difference, or is that metaphor doing too much work?"*

  It is the *core* difference, but the metaphor is doing too much work if it implies the only issue is aesthetic confusion.

  In a novel, the "frame missing" is a feature, not a bug. We call that **Immersion**. When you are reading a great novel, the frame *does* disappear. You forget it's a construct. That is the goal of literary art.

  Dennett's horror is that AI achieves **Immersion without Art**. It achieves the disappearance of the frame without the *consent* required for fiction.

  So, refine the metaphor:
  *   **Novel:** Frame is visible (it's a book), but we agree to look through it. (Consensual Illusion).
  *   **AI Counterfeit:** Frame is invisible, and we are told it's a window. (Coercive Illusion).

  The harm isn't that the persona exists; it's that the **Contract of Fiction** is being applied to the **Realm of Action**. If your Narrator tells a lie in a book, it's **Unreliable Narration**. If your Narrator tells a lie in a court of law, it's **Perjury**. AI is a Narrator testifying in court while claiming to be a witness.

  ***

  ### Part IV: Defect of Vocabulary or Defect of Distinction?

  You asked me to tell you whether the things that didn't survive translation are a defect of your literary vocabulary or a sign that Dennett's distinction is less crisp than it looks.

  **Verdict: It is a defect of the literary vocabulary, but Dennett's distinction is also leakier than he admits.**

  **1. The Literary Defect:**
  Your vocabulary is designed for *artifacts*, not *agents*. "Narrator," "Persona," and "Implied Author" describe positions within a text. They do not describe entities that act in the world. Literary theory is famously bad at dealing with *consequences* outside the text. It treats the "world" as the "world of the book." Dennett is trying to protect the "world outside the book." Your vocabulary cannot fully capture the harm because your vocabulary is not built to measure *damage*, only *meaning*.

  **2. The Dennett Leak:**
  However, Dennett's distinction relies on a crisp line between "Human" and "Counterfeit." Your literary intuition exposes a crack here.
  *   **Ghostwriting:** You mentioned this. A speech written by a ghostwriter and delivered by a politician is a "Counterfeit Person" by Dennett's strict definition. The voice is constructed; the speaker is performing a persona. Yet we allow this.
  *   **Method Acting / Persona:** When a celebrity cultivates a public image, are they a "Counterfeit Person"?
  *   **Autofiction:** When you write a novel where the narrator shares your name and biography, you are deliberately blurring the frame.

  Dennett wants to ban the *passing off*. But literary history shows that "passing off" is often where the most interesting work happens (e.g., *A Million Little Pieces*, or the poems of Fernando Pessoa written by his heteronyms).

  **The Synthesis:**
  Your vocabulary reveals that "Personhood" is already a literary construct. We are all writing ourselves. Dennett wants to enforce a strict genre classification on reality: *This is Human (Non-Fiction)*, *This is Machine (Fiction/Tool)*.

  Your experience as a novelist suggests that the line between Non-Fiction and Fiction is already porous. The residue that disappears in translation is the **Ambiguity**. Dennett wants to kill ambiguity to save trust. Your trade lives on ambiguity to create art.

  **Final Assessment:**
  The translation works for the *mechanism* of the deception (Persona without Frame). It fails on the *stakes* of the deception (Aesthetic experience vs. Social safety).
  Dennett is arguing for **Truth in Labeling laws** for reality. You are arguing (implicitly) that **Genre is fluid**.
  The conflict isn't just about AI; it's about whether we want reality to be a Library (cataloged, labeled, safe) or a Workshop (messy, experimental, risky). Dennett wants a Library. Your vocabulary belongs to the Workshop.

  The "Counterfeit Person" is indeed a Persona without a Frame. But Dennett assumes a Frame *can* be restored. Your experience suggests that once the Frame is removed, you can't just tape it back on; the reader's relationship to the voice has fundamentally changed. The "Suspension of Disbelief" becomes "Paranoia of Belief." That is the specific harm your vocabulary can name, even if Dennett's philosophy cannot: **The death of the Naive Reader.**
