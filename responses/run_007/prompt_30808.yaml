answer: |-
  The regulatory patchwork you observed presupposes no coherent theory of sentience, operating instead on a phylogenetic heuristic modified by behavioral complexity and constrained by a legal requirement for biological substrate.

  The implicit view is best described as Phylogenetic Pragmatism. It assumes that evolutionary proximity to humans (vertebrates) serves as a reliable proxy for the capacity to suffer, creating a default boundary that is easy to administer. The octopus exception reveals a secondary, override criterion: overt behavioral complexity that signals pain despite taxonomic distance. The exclusion of simulations reveals a third, legalistic criterion: biological vitalism, where moral standing requires being a living organism rather than instantiating a functional state. These parts do not presuppose consistent things; the octopus ruling explicitly contradicts the vertebrate rule, and the simulation exclusion contradicts the functional evidence that nervous systems are information processors.

  The practice strictly commits only to minimizing probable suffering while maximizing research utility, using taxonomy as a risk-management shortcut rather than an ethical truth. The vertebrate line is largely historical accident, rooted in legislation like the US Animal Welfare Act which was drafted when invertebrate cognition was poorly understood. The exclusion of insects is administrative convenience, avoiding the logistical nightmare of regulating vast populations of short-lived organisms. The exclusion of simulations is a legal artifact, stemming from statutory definitions of "animal" that predate computational neuroscience.

  If we took seriously the idea that certain computations matter morally regardless of substrate, regulation would need to shift from ontology to functional architecture. Oversight bodies would no longer check species IDs but would audit whether a system—biological or silicon—instantiates specific algorithms associated with negative valence or pain processing. This would require developing metrics for "moral computation" to determine threshold complexity, potentially bringing insect research under review if their neural circuits meet the criteria, and subjecting high-fidelity simulations to ethical scrutiny if they replicate the causal dynamics of suffering. The regulatory burden would move from verifying the container to verifying the content, demanding a new science of ethical functionalism to distinguish morally relevant processing from mere information transformation.
