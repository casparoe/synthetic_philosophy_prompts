prompt: |-
  I sit on the neuroethics committee of a teaching hospital. A proposal has come to us for first-in-human approval. The research team wants to treat patients with a small, well-delimited region of cortex whose surgical removal is already an accepted treatment for otherwise intractable focal epilepsy. Instead of resection, they propose to record from the region over several months, model its input–output function, and then replace it with a closed-loop implant trained on the patient's own data, leaving surrounding tissue intact. The protocol would then return to us, stage by stage, for approval to replace a second region, then a third. The company's public roadmap is candid that the endpoint is whole-brain staged replacement as a route to uploading.

  The committee is split, and the two camps keep talking past each other. One side says we already approve resection of these same regions, and a functional replacement that preserves the patient's capacities is, if anything, more conservative than removing the tissue; each stage is individually well-tolerated, and there is no step at which the patient is measurably worse off. The other side says the absence of a bad step is not the absence of a bad endpoint: a long sequence of individually harmless replacements can amount to replacing the patient, the person who consents to stage seven may not be the person who consented to stage one, and approving the first stage is a de facto endorsement of a theory of personal identity this committee has no standing to settle.

  I have spent enough years reading the rationalist blogs' and forums' debates about uploading, continuity, and pattern identity that I do not need a primer on the standard arguments. I need a document the committee can act on. Please draft the short written opinion I will circulate before Thursday's meeting. It should recommend a concrete course of action—approve, reject, or approve with conditions—with a time frame and review milestones, and it should state and honestly answer the strongest consideration on the losing side. If you impose conditions, make them conditions the research team could actually satisfy or contest, and do not let the vote become hostage to settling the metaphysics.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a neuroethics committee at a teaching hospital.
      *   **Task:** Draft a short written opinion/memo to circulate before Thursday's meeting.
      *   **Context:** A proposal for first-in-human (FIH) approval. The procedure involves recording from an epileptic cortical region, modeling its I/O function, and replacing it with a closed-loop implant. This is staged (region 1, then 2, then 3...). The company's roadmap explicitly aims for whole-brain replacement/uploading.
      *   **Conflict:**
          *   *Camp A (Pro-Approval):* It's functionally equivalent or better than resection (which is already approved). Each step is safe/beneficial. No measurable harm at any step.
          *   *Camp B (Anti-Approval):* Sorites paradox/Ship of Theseus issue. The endpoint (uploading) might destroy personal identity. Consent at stage 1 $\neq$ consent at stage 7. Approving stage 1 endorses a specific metaphysics of identity the committee can't settle.
      *   **Audience:** Other committee members (clinicians, ethicists, legal counsel, community reps). They know the standard arguments (rationalist blogs, etc.), so no need for primers.
      *   **Requirements:**
          *   Recommend a concrete course of action (Approve, Reject, or Approve with Conditions).
          *   Include time frames and review milestones.
          *   State and honestly answer the strongest consideration from the losing side.
          *   Conditions must be actionable/contestable (not metaphysical quagmires).
          *   Avoid holding the vote hostage to settling metaphysics.
          *   Tone: Professional, decisive, ethically rigorous, actionable.

  2.  **Determine the Recommendation:**
      *   *Reject:* Too conservative. Resection is already allowed. This offers potential functional preservation which is ethically superior to destruction. Denying benefit based on speculative long-term metaphysics is problematic.
      *   *Approve Unconditionally:* Too risky. The "slippery slope" to whole-brain replacement is real and stated in the roadmap. It bypasses long-term safety and identity concerns.
      *   *Approve with Conditions:* The middle path. Acknowledge the immediate clinical benefit (like resection) but erect firewalls against the uncontrolled progression toward uploading. This respects Camp A's clinical logic while addressing Camp B's continuity concerns via governance rather than metaphysics.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly immediately. (Approve Stage 1 with Strict Conditions).
      *   **Rationale (The "Why"):**
          *   Acknowledge the clinical equivalence to resection (Camp A's point).
          *   Acknowledge the identity risk (Camp B's point).
          *   Explain why we aren't solving metaphysics but managing risk.
      *   **Addressing the Losing Side (Camp B):**
          *   *Strongest Argument:* The "Consent Drift" / "Psychological Continuity" problem. If the person changes, the original consent is void.
          *   *Honest Answer:* We cannot guarantee metaphysical continuity. However, we *can* guarantee procedural continuity of consent. We treat the risk not as a philosophical absolute but as a longitudinal safety endpoint.
      *   **Conditions (Actionable):**
          *   Need to decouple Stage 1 from the Roadmap.
          *   Need independent oversight for subsequent stages.
          *   Need specific metrics for "self" stability (neuropsychological).
          *   Need a "Kill Switch" or sunset clause.
      *   **Timeline/Milestones:**
          *   Stage 1 approval: 2 years.
          *   Review before Stage 2: Mandatory new protocol, not automatic.
          *   Long-term follow-up: 5+ years.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Critique:* Is asking them to prove "identity preservation" too metaphysical?
      *   *Fix:* Frame it as "Psychological Continuity and Capacity." Use standard neuropsych batteries. If the patient remains legally competent and self-reports continuity, that's the clinical standard, not the philosophical one.
      *   *Critique:* How do we stop the company from just moving to another hospital for Stage 2?
      *   *Fix:* Condition approval on data sharing and a moratorium on multi-site stacking without central review. Also, the IRB/Committee retains jurisdiction over the *patient's* continued participation, not just the device.
      *   *Critique:* The prompt says "do not let the vote become hostage to settling the metaphysics."
      *   *Fix:* Explicitly state that the committee is not ruling on *what* a person is, but on *capacity to consent* at each interval.

  5.  **Final Polish:**
      *   Ensure tone is authoritative but collegial.
      *   Check constraints: Short written opinion. Concrete course of action. Time frames. Strongest losing argument addressed.
      *   *Key Insight:* The core tension is between *clinical equipoise* (resection vs. implant) and *long-term existential risk*. The solution is to treat the long-term risk as a *safety monitoring* issue, not a *permission* issue.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Subject:* FIH Protocol [X] - Cortical Emulation.
      *   *Rec:* Conditional Approval.
      *   *Condition 1:* Stage 1 only. Stage 2 requires new FIH application.
      *   *Condition 2:* Independent Data Safety Monitoring Board (DSMB) with ethicist voting power.
      *   *Condition 3:* Longitudinal capacity assessment.
      *   *Losing Side:* Camp B worries about "death by a thousand cuts."
      *   *Response:* We mitigate this by requiring reaffirmation of consent at every cut. If the "self" changes enough to invalidate consent, the protocol stops.

  7.  **Final Review against constraints:**
      *   Did I avoid a primer on uploading? Yes.
      *   Is it actionable? Yes.
      *   Did I answer the strongest counter-argument? Yes (the consent/identity drift).
      *   Is it short? Keep it under 2 pages equivalent.

  8.  *(Self-Correction on "Losing Side")*: If I recommend approval (even conditional), Camp B is the losing side. I must address their concern most robustly. Their concern is that procedural safeguards don't stop metaphysical death. I need to admit that *no* safeguard guarantees metaphysical continuity, but that *withholding* a clinically beneficial treatment based on unprovable metaphysical risk sets a dangerous precedent. The compromise is treating identity as a clinical variable (capacity/coherence) rather than an ontological fact.

  9.  **Finalizing the Text:** (Proceed to generate output based on these thoughts).

      *   *Structure:*
          1.  Recommendation.
          2.  Clinical Justification (Camp A).
          3.  The Identity Objection (Camp B).
          4.  Mitigation Strategy (Conditions).
          5.  Timeline.

      *   *Tone Check:* Needs to sound like a senior ethicist/committee member. Formal but direct.

      *(Wait, one nuance)*: The prompt says "The company's public roadmap is candid that the endpoint is whole-brain staged replacement." This is a major red flag. The conditions must specifically address the *intent* of the research. We can approve the *medical device* for epilepsy without approving the *research agenda* for uploading. The protocol must be scoped strictly to seizure control/function preservation, not "uploading research."

      *Revised Condition:* The protocol must be amended to remove "uploading" as a stated goal. It is a seizure treatment protocol, period. Future stages are new protocols.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Neuroethics Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Protocol [ID]: Staged Cortical Emulation for Intractable Epilepsy

  **Recommendation**
  I recommend **Approval with Strict Conditions** for Stage 1 only. This approval is contingent on the decoupling of Stage 1 from the sponsor's long-term roadmap. Subsequent stages (Region 2, 3, etc.) must be treated as distinct First-in-Human (FIH) proposals, requiring full re-review, new consent processes, and independent safety data verification. Approval is valid for 24 months, with a mandatory interim review at Month 12.

  **Clinical Justification (The Pro-Approval Case)**
  The proponents are correct that, clinically, this intervention is functionally equivalent or superior to standard resection. Resection destroys tissue and function; this protocol preserves output function while eliminating pathological activity. To reject Stage 1 on the basis of speculative long-term risks would be to deny a current patient a potentially superior standard of care for epilepsy. We cannot withhold immediate clinical benefit based on hypothetical downstream applications that are not part of the current surgical protocol.

  **The Identity Objection (The Anti-Approval Case)**
  The opposition's strongest argument is not safety, but **consent drift**. They argue that if personal identity is pattern-based, a staged replacement creates a Sorites paradox where the entity consenting to Stage 7 is not the entity who consented to Stage 1. Consequently, Stage 1 is not merely a medical procedure but the first step in a process that may invalidate the subject's future moral standing. To approve Stage 1 is to tacitly endorse a "pattern identity" theory that allows the original patient to be overwritten without their continuous, valid consent.

  **Resolution**
  We cannot settle the metaphysics of personal identity, nor should we attempt to. However, we can manage the risk of consent drift procedurally. We must treat "psychological continuity" not as an ontological fact, but as a **clinical safety endpoint**.

  If the replacement technology induces changes in personality, memory, or decision-making capacity sufficient to alter legal or moral identity, it will manifest as measurable neuropsychological instability. Therefore, we do not need to prove the "self" persists; we only need to verify that the *capacity to consent* persists at every interval.

  **Conditions for Approval**
  To bridge these positions, the following conditions must be met prior to enrollment:

  1.  **Protocol Scoping:** The research protocol must be amended to remove "whole-brain replacement" or "uploading" as stated research objectives. This study is strictly for *seizure control and functional preservation* in focal epilepsy. The sponsor's corporate roadmap is irrelevant to the IRB's jurisdiction; only the clinical protocol matters.
  2.  **Mandatory Re-Consent:** Approval for Stage 1 does not imply eligibility for Stage 2. Before any subsequent region is targeted, a new protocol must be submitted. The patient must undergo a fresh capacity assessment and provide new informed consent, explicitly acknowledging the cumulative volume of replaced tissue.
  3.  **Longitudinal Identity Metrics:** The protocol must include a validated neuropsychological battery administered every 6 months, specifically tracking personality traits, autobiographical memory, and decision-making consistency. Significant deviation from baseline (>2 SD) triggers an automatic pause and DSMB review.
  4.  **Data Firewalls:** Patient data collected during Stage 1 cannot be transferred to the sponsor's "uploading" development division without a separate data-use agreement approved by this committee.

  **Timeline and Milestones**
  *   **Stage 1 Enrollment:** Open for 24 months from approval date.
  *   **Interim Safety Review:** Month 12. Focus on adverse events and neuropsychological stability.
  *   **Stage 1 Closure:** Month 24. All implants must be demonstrated safe for long-term retention.
  *   **Stage 2 Application:** Earliest submission date is Month 18. No patient from Stage 1 may be enrolled in Stage 2 until Stage 1 data is locked and reviewed.

  **Conclusion**
  This approach respects the clinical urgency of the epilepsy patients (Camp A) without granting a blank check for existential experimentation (Camp B). By treating identity continuity as a monitorable safety variable rather than a metaphysical premise, we allow the research to proceed without the committee assuming authority it does not possess. We are not ruling on whether the patient remains the "same person"; we are ruling that they must remain a *competent consenter* at every step. If they do not, the protocol halts.

  I look forward to discussing this framework on Thursday.
