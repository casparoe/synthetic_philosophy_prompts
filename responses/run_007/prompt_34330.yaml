prompt: |-
  I'm a grad student and I've been asked to give a guest session in a second-year type design course. The topic is basically: what makes every 'a' an 'a'? Not the history of the letter, but the conceptual puzzle — how a blackletter 'a', a single-story 'a', and a kid's handwritten 'a' are all the same letter when they share almost no shape in common. The students know typefaces and can talk about x-heights and contrast, but they've never done philosophy and I'm pretty sure they'll walk in thinking there's just an ideal 'a' in the head that all the others are distorted copies of.

  Don't explain the answer to me; plan how I should explain it in one seventy-five-minute session. I want the plan to have a real order to it, not a list of topics: what idea has to land before what, and why. What should the carrying example be? I was thinking of using the double-story versus single-story 'a', but I'm not sure that actually does the work — if that's the wrong choice, tell me why and what to use instead. Which misconceptions should I expect, and exactly where in the sequence should I head each one off? I'm guessing the big ones are the Platonic template thing, then a retreat to a feature checklist, and then an overcorrection to "it's all just convention so anything goes" — but I dont know what order they'll come in or which one I should actually let them sit in for a while.

  Also: what should I openly refuse to explain at this level, and what's one question I can ask at the end that would show me they got the category/style distinction rather than just learned to say "family resemblance"?

  Start with the single sentence I should want them to leave believing, then give the plan and the reasoning for the order. No preamble, and don't restate the question back at me.
