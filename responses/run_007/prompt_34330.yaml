answer: |-
  An 'a' is not a shape you copy, but a job you do within a system of differences.

  ### The Carrying Example
  Keep the single-story versus double-story 'a', but do not use it alone. It is necessary but insufficient. It successfully breaks the idea that there is one correct shape, but it risks reinforcing the idea that there is a fixed list of features (e.g., "both have a counter"). To break the feature checklist, you must introduce an **imposter**: the Greek lowercase alpha (α). It looks identical to the single-story 'a' but is not an 'a'. This forces the students to realize that visual features alone cannot define the letter; context and system membership are required.

  ### The Session Plan (75 Minutes)

  **1. The Elicitation (0:00–0:15)**
  *   **Activity:** Hand out paper. Ask everyone to draw the lowercase 'a' quickly. Put five distinct versions on the board (including a printed single-story, a printed double-story, and a handwritten loop).
  *   **Reasoning:** You must start where they are. They will naturally assume their internal drawing is the "real" one and the others are variations. Do not correct this yet. You need them to verbally commit to the idea that there is a "correct" version in their head so they feel the tension later.
  *   **Misconception Handling:** Let the **Platonic Template** misconception sit here. If a student says, "The double-story is the real one, the other is just shorthand," write it down and accept it as a hypothesis to be tested.

  **2. The Shape Break (0:15–0:30)**
  *   **Activity:** Project the single-story (ɑ) and double-story (a) side-by-side at the same size. Ask: "If I swap this glyph for that glyph in a text, does the word change?" (No). "If I swap the 'a' glyph for an 'o' glyph, does the word change?" (Yes).
  *   **Reasoning:** This creates the first crisis. If the shape changes completely but the meaning doesn't, the shape cannot be the definition. This forces them off the Platonic ledge.
  *   **Misconception Handling:** They will immediately retreat to the **Feature Checklist**. They will say, "Well, they both have a closed counter and a vertical stem." Let them build this list on the board. Do not refute it yet; let them feel secure in this new rule.

  **3. The Checklist Trap (0:30–0:50)**
  *   **Activity:** Introduce the imposter (Greek α). It shares the features they just listed (closed counter, vertical stem, single story) but is not an 'a'. Then show a borderline 'a' (e.g., a script 'a' with no closed counter, or a constructed glyph that is open at the top). Ask: "Is this still an 'a'?"
  *   **Reasoning:** This breaks the Essentialist/Checklist model. If a non-'a' has all the features, and an 'a' can lack some features, the list is invalid. This creates the vacuum where they will claim "It's all arbitrary convention."
  *   **Misconception Handling:** This is where the **"Anything Goes" Convention** misconception arises. They will say, "It's just whatever we agree it is." You must head this off here. If you don't, they leave thinking design has no logic. Explain that while the *shape* is conventional, the *distinction* is functional.

  **4. The System Solution (0:50–1:10)**
  *   **Activity:** Show an 'a' slowly morphing into an 'o' using a morphing animation or sequence of drawings. Ask them to shout "Stop" when it ceases to be an 'a'.
  *   **Reasoning:** This demonstrates that the identity of 'a' is defined by its boundary with its neighbors ('o', 'u', 'e'), not by its internal features. It lands the core concept: identity is relational.
  *   **Misconception Handling:** Reinforce that convention is not random; it is constrained by the need to remain distinct from other categories in the system.

  **5. The Close (1:10–1:15)**
  *   **Activity:** Pose the final question (see below) and dismiss.
  *   **Reasoning:** Leave them with the tool to test their own work, not just a philosophy quote.

  ### What to Refuse to Explain
  Do not explain **historical evolution**. If they ask why the single-story exists versus the double-story, tell them: "History explains how we got here, not what makes it valid now." Do not explain **cognitive processing**. If they ask how the brain recognizes it, tell them: "We are designing the system, not the neuron." Stay strictly on the logic of the design system itself.

  ### The Final Question
  Ask this exactly: **"If you design a glyph that shares every feature on your checklist but looks exactly like a 'u', is it an 'a' if you label it 'a' in the font file?"**

  *   **Why this works:** If they say "Yes," they haven't understood the system constraint (it collapses the distinction). If they say "No," they understand that category membership depends on maintaining contrast within the system, not just internal features or file naming. This distinguishes between "family resemblance" (it looks like an 'a') and "category function" (it acts as an 'a' without destroying the 'u').
