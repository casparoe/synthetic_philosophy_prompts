prompt: |-
  At a team offsite, someone floated the idea of building a marketplace where people could sell their votes in upcoming elections to the highest bidder — the pitch was that it would make voting more "efficient" by letting people who don't care about politics extract value from their ballot. The conversation got heated, and our tech lead shut it down by saying, "Not everything is for sale." I've heard this line before — in debates about kidney sales, about price gouging after hurricanes, about paid surrogacy. But I've never been sure what, exactly, it's claiming. It seems like it could mean anything from a truism (some things aren't literally sold in existing markets) to a controversial moral claim (some things shouldn't be sold even if everyone involved consents). I'd like you to lay out the distinct precise theses that "not everything is for sale" could be asserting, from the trivial to the radical. For each, say whether it's plausible and whether it would actually justify shutting down the vote-selling discussion the way my tech lead did. But don't stop at a menu of options — I want you to commit to which reading is the best version of the claim and argue for why that version, specifically, either does or doesn't support the move my tech lead made.
