      *   **Cost-First (Friend):** Supererogatory iff Cost > Threshold. If Cost is low, it's Obligatory.
      *   **Discharge-First (User):** Supererogatory iff Act > Duty Limit. If Duty is already met, further acts are supererogatory even if low cost.
      *   **Goal:** Find a case where Cost is Low, but Duty is already Met.
          *   If Cost is Low -> Cost-First says Obligatory.
          *   If Duty is Met -> Discharge-First says Supererogatory.
      *   *Challenge:* Usually, if cost is low, duty extends to cover it. I need a case where duty has a *structural* limit independent of cost.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: Tipping.* Duty is to pay the bill. Tip is extra. But is tipping obligatory? Socially maybe, morally debatable.
      *   *Idea 2: Visiting a sick friend.* Duty to visit once? Is visiting twice supererogatory? Cost is low (time).
      *   *Idea 3: Helping a colleague.* Duty to do your share. Helping with their share is extra. If their share is easy, is helping obligatory?
      *   *Idea 4: Promise keeping.* I promised to water your plants once. I water them twice. Cost is negligible. Duty discharged after once.
      *   *Idea 5: Gift giving.* Duty to give a gift on birthday? If I give two, is the second obligatory?
      *   *Idea 6: The "Specific Duty" case.* A duty defined by specific terms rather than general welfare.

