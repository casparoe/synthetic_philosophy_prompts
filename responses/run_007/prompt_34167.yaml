      *Let's refine the "Houseplant" case.*
      Setup: You agree to housesit for a friend solely to water their plants daily. You water them perfectly. While there, you notice a single dead leaf on the floor that fell naturally. Picking it up takes five seconds and spares your friend minor tidying upon return. You have already fulfilled the specific agreement to water the plants.
      *   Cost-First: The cost is trivial (5 seconds). Any moral theory demanding beneficence makes this obligatory because the burden is negligible compared to the benefit.
      *   Discharge-First: The duty was specific (water plants). That duty is fully discharged. The leaf is outside the scope. Doing it is good, but beyond duty.

      *Does this work?* It hinges on whether duties are specific or general. Cost-First assumes general beneficence fills gaps when cost is low. Discharge-First respects the boundary of the specific obligation.

