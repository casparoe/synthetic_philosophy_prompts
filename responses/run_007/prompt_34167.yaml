prompt: |-
  Was up till like 2am arguing with my friend about supererogation and I think I need a concrete case to settle something, or at least to see where the disagreement actually bites. We were going back and forth on whether the whole category even makes sense. He takes what I'd call the "cost-first" view: an act is supererogatory exactly when it's morally good but the sacrifice involved is big enough that morality can't reasonably demand it of everyone. On his picture, if a good act costs you basically nothing, it's not supererogatory — it's just obligatory, full stop. The only thing keeping supererogatory acts from being duties is the size of the burden. So supererogation isn't a distinct kind of moral status; it's just the upper end of a cost spectrum.

  I was pushing a different line. I think what makes an act supererogatory isn't the cost but the fact that you've already done what morality requires — you've discharged the relevant duty — and now you're doing more. On this "discharge-first" view, even a trivially easy act can be supererogatory if it goes beyond the point where your duty is satisfied. The cost matters for explaining why the duty stops where it does, but it's not what makes the further act supererogatory; what makes it supererogatory is that it exceeds the duty's threshold.

  We realized we were talking past each other because in most obvious examples — the soldier jumping on the grenade, the stranger donating a kidney — both views agree: high cost, beyond duty, clearly supererogatory. What we need is a case where the views come apart.

  So here's what I want you to build: a thought experiment where the cost-first view and the discharge-first view give opposite verdicts about whether some specific act is supererogatory or obligatory. Constraints: realistic, ordinary-life scenario, one paragraph max for the setup. No life-or-death stakes, no saints or heros — I want the disagreement to show up in mundane territory. Both views should come off as defensible when applied to the case; don't make one of them look like a straw man. After the scenario, walk through what each view says and why, point to the exact feature of the case that drives them apart, and say what happens if you remove or alter that feature. Also, tell me how confident you are that the case works and which bit you're least sure about. Keep the whole response under 700 words.
