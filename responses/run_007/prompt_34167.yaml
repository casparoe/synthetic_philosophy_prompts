answer: |-
  You agree to housesit for a friend solely to water their indoor plants daily while they vacation. You fulfill this exactly, ensuring every plant is hydrated. On your final visit, you notice a single dead leaf on the carpet beneath a pot, naturally shed. Picking it up takes five seconds and spares your friend minor tidying upon return. You have strictly fulfilled the specific agreement to water the plants, and the leaf poses no harm, only a slight aesthetic nuisance.

  On the **cost-first view**, this act is **obligatory**. Since the burden is negligible (five seconds) and the benefit is positive (less work for your friend), morality demands it. The threshold for duty is determined by cost; because the cost is below the "reasonable demand" threshold, the act falls within the realm of duty. To leave the leaf would be morally blameworthy, akin to refusing to hold a door open for someone carrying groceries.

  On the **discharge-first view**, this act is **supererogatory**. Your duty was defined by the specific agreement: water the plants. Once hydrated, that duty is fully discharged. The leaf falls outside the scope of the obligation. Picking it up is morally good and praiseworthy, but not required, because you have already done what was owed. The low cost explains why it *wouldn't be bad* to do it, but it doesn't transform the act into a duty because the duty's boundary was set by the agreement, not merely by cost-benefit analysis.

  The divergence hinges on **the source of the duty's limit**. The cost-first view sees duty as fluid, expanding to cover any low-cost good. The discharge-first view sees duty as structural, bounded by specific commitments or roles. If you alter the case so the leaf is a **tripping hazard**, both views converge on "obligatory" (harm prevention overrides scope). If you alter it so picking up the leaf takes **thirty minutes**, both converge on "supererogatory" (cost exceeds reasonable demand). The disagreement only bites when cost is trivial but the act lies outside the specific scope of the undertaking.

  **Confidence:** I am moderately confident (75%) this case works. It successfully isolates the variables: low cost vs. fulfilled specific duty. The least certain element is whether the cost-first theorist will concede that "specific agreements" can limit general beneficence. They might argue that by agreeing to housesit, you implicitly agreed to "ensure the house is left well," which would swallow the leaf into the duty regardless of cost. However, if they accept that agreements can be limited, the disagreement holds.
