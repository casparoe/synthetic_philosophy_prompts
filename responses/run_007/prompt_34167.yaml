      *   Discharge-First: Supererogatory (agreement fulfilled).

      *Let's go with the "Promise Limit" case.*
      Setup: You promised your neighbor you'd collect their mail while they're away for a week. You do so daily. On the last day, you see one extra flyer stuck in the box that isn't technically mail, just advertising. Grabbing it takes two seconds. You've fulfilled the promise ("collect mail"), but grabbing the flyer helps them slightly more.
      *   Cost-First: 2 seconds is negligible. Morality demands minimizing hassle for others at no cost. Obligatory.
      *   Discharge-First: The duty was defined by the promise ("mail"). That duty is discharged. The flyer is outside the scope. Supererogatory.

      *Wait, is "mail" vs "flyer" too semantic?*
      Let's try: You agree to housesit. Duty: Water plants. You water them. You notice one leaf is dusty. Wiping it takes 10 seconds.
