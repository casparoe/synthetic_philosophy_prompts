      *(Self-Correction during drafting)*: I initially thought about putting cost first. But welfare should be the primary filter, otherwise, it's just a cost-cutting exercise. However, since the CEO wants a *business* decision procedure, Cost/Feasibility must be a hard gate. Let's put Market Driver first (Why are we doing this?), then Welfare Evidence, then Feasibility, then Values.

      *Refining the "Diciest Case":*
      *   Step 1 (Driver): Diciest case is when a sales rep promises a certifier requirement that doesn't actually exist yet.
      *   Step 2 (Evidence): Diciest case is cortisol measurement (stress doesn't always equal poor welfare).
