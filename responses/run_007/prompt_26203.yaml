      *   **Constraints:**
          *   Users are practical (no moral theory).
          *   Stakes are financial (low thousands to low six figures).
          *   Frequency: 4-5 times a year.
          *   Must handle 3 specific test cases: (1) Stunning methods, (2) Structural enrichment, (3) Stocking density reduction.
          *   Must identify the "diciest case" for each step (where it might fail).
