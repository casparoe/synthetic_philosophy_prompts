      *Revised Plan for "Diciest Case":*
      *   Step 1: False Market Signal.
      *   Step 2: Proxy Metric Trap (Cortisol).
      *   Step 3: Unintended Consequences (Enrichment hiding fish).
      *   Step 4: The "Affordability" Trap (Long term vs Short term).
      *   Step 5: The Shrimp Sentience Wall.

  10. **Final Review against Prompt:**
      *   Step-by-step? Yes.
      *   Afternoon timeline? Yes (focused on existing data).
      *   Clear recommendation? Yes (Matrix).
      *   3 Test Cases included? Yes.
      *   Diciest Case per step? Yes.
