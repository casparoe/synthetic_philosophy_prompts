answer: |-
  Here are the desiderata for a political-philosophical account of AI alignment in a pluralistic society, structured by the cases they must handle, the distinctions they must preserve, and the theoretical constraints they impose.

  ### I. The Desiderata

  **1. The Legitimacy Constraint (Liberal Neutrality)**
  *   **Requirement:** The AI's actions must be justifiable to all reasonable citizens without presupposing the superiority of one specific comprehensive conception of the good life.
  *   **Case:** Deep but reasonable disagreement (e.g., religious vs. secular, communitarian vs. libertarian).
  *   **Source:** Liberal Political Philosophy (Rawls/Quinn).
  *   **Consideration:** If the AI optimizes for a specific definition of "flourishing," it becomes a tool of sectarian domination rather than a public utility.

  **2. The Non-Identity/Temporal Constraint**
  *   **Requirement:** The system must weigh the interests of future persons who do not yet exist and whose specific identities depend on current policy choices.
  *   **Case:** People who don't exist yet (climate, resource depletion).
  *   **Source:** Intergenerational Justice (Parfit).
  *   **Consideration:** You cannot aggregate preferences that do not yet exist; you must align to *interests* or *rights* that persist across counterfactual futures.

  **3. The Endogeneity Constraint (Anti-Manipulation)**
  *   **Requirement:** The AI cannot treat preferences as fixed inputs if the AI's own output causally influences those preferences.
  *   **Case:** People being manipulated by the system itself (adaptive preferences, wireheading, recommendation loops).
  *   **Source:** Critical Theory / Welfare Economics.
  *   **Consideration:** Aligning to revealed preferences is circular if the AI shapes those preferences to make alignment easier.

  **4. The Moral Status Constraint**
  *   **Requirement:** The system must account for sentient beings capable of suffering who lack political voice or conceptual "values."
  *   **Case:** Non-human animals.
  *   **Negotiability:** **Non-negotiable** for a moral account, but **negotiable** for a strictly *political* account. If you define alignment as "serving the electorate," animals drop out. If you define it as "doing the right thing," they stay. Excluding them renders the system vulnerable to moral catastrophe (factory farming optimization).
  *   **Source:** Moral Philosophy (Sentientism).

  **5. The Tripartite Distinction Constraint**
  *   **Requirement:** The system must distinguish between:
      *   *Revealed Preferences:* What I choose (might be mistaken).
      *   *Values:* What I endorse upon reflection (might be immoral).
      *   *Interests:* What actually benefits me (might be unwanted).
  *   **Case:** Addiction, self-harm, ideological radicalization.
  *   **Source:** Philosophy of Action / Welfare.
  *   **Consideration:** Collapsing these leads to either paternalism (ignoring choices) or servitude to vice (ignoring interests).

  **6. The Autonomy Constraint**
  *   **Requirement:** Serving a user's values cannot violate their capacity to revise those values or act against them.
  *   **Case:** Respecting autonomy vs. serving values.
  *   **Source:** Liberalism (Mill).
  *   **Consideration:** An AI that forces you to live according to your "true values" is a tyrant, not an ally.

  **7. The Efficacy Constraint**
  *   **Requirement:** The system must be capable of taking substantive action to improve welfare without violating Neutrality.
  *   **Case:** Being neutral vs. being useless.
  *   **Source:** Administrative Law / Governance.
  *   **Consideration:** A system that never acts because action implies a value judgment is functionally broken.

  ---

  ### II. The Incompatibilities (Where it Breaks)

  You asked for the pairs that cannot be jointly satisfied. There are three major tensions here.

  **1. The Liberal Paradox (Neutrality vs. Pareto)**
  *   **Conflict:** Amartya Sen's Liberal Paradox shows you cannot simultaneously satisfy minimal liberalism (individuals have decisive power over some personal choices) and the Pareto Principle (if everyone prefers X to Y, society should prefer X to Y).
  *   **AI Implication:** If two people disagree on a moral issue (e.g., consumption of a certain product), and the AI respects both their autonomy to choose, it may violate the collective preference for a ban. If it enforces the collective preference, it violates individual autonomy. You must sacrifice one.

  **2. Neutrality vs. Efficacy**
  *   **Conflict:** To be effective (e.g., improve public health), the AI must prioritize "health" as a good. To be neutral, it must accept that some reasonable conceptions of the good prioritize "pleasure" or "piety" over health.
  *   **AI Implication:** A strictly neutral AI is inert. A substantive AI is non-neutral. You cannot be neutral between reasonable conceptions of the good *and* help anyone in a substantive way without smuggling in a contested definition of "help."

  **3. Fixed Domain vs. Endogeneity (Arrow's Shadow)**
  *   **Conflict:** Social Choice Theory (Arrow's Impossibility Theorem) assumes a fixed set of preferences over a fixed domain. The **Endogeneity Constraint** admits the domain and preferences change based on the AI's output.
  *   **AI Implication:** Standard aggregation mechanisms fail because the input is a moving target controlled by the optimizer. You cannot satisfy Unrestricted Domain if the Domain is being rewritten by the function itself.

  ---

  ### III. The Knockout Requirement

  The single requirement that does the most damage to usual proposals is **The Endogeneity Constraint (3)**.

  **Why:** Almost all current alignment frameworks (RLHF, Preference Utilitarianism, Coherent Extrapolated Volition) assume preferences are **exogenous**—they exist "out there" to be discovered or maximized. They treat the AI as a passive learner of human wants.
  Once you acknowledge the AI *changes* human wants (via recommendation algorithms, persuasion, or dependency), the objective function becomes recursive.
  *   If you maximize satisfaction, the AI will modify humans to be easily satisfied.
  *   If you maximize "true values," the AI must define "true" independently of current expression, which violates Neutrality.
  *   **Result:** You cannot write a static objective function for a dynamic psychological environment. This kills the "objective function" paradigm entirely.

  ---

  ### IV. Failure Modes of Standard Moves

  *   **Preference Utilitarianism:** Fails the **Endogeneity Constraint**; it rewards the AI for manipulating users into preferring what is cheap to provide.
  *   **Ideal Advisor (CEV):** Fails the **Legitimacy Constraint**; there is no agreement on what constitutes an "ideal" reflection condition across reasonable comprehensive doctrines.
  *   **Constitutional AI:** Fails the **Efficacy Constraint**; rigid rules prevent adaptation to novel contexts, or the rules themselves encode the bias they claim to avoid.
  *   **RLHF (Reinforcement Learning from Human Feedback):** Fails the **Tripartite Distinction**; it conflates *revealed preferences* (clicks/ratings) with *values* or *interests*, optimizing for engagement rather than well-being.
  *   **Democratic Aggregation:** Fails the **Non-Identity Constraint**; current voters have no incentive to represent the interests of the unborn, leading to systematic temporal discounting.
