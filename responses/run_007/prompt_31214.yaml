      *   *Autonomy vs. Alignment:* If I respect autonomy, I might let people harm themselves. If I align to their "true values," I might paternalistically override their current choices.
      *   *Arrow's Theorem:* The classic impossibility. Unrestricted domain, Pareto, Non-dictatorship, IIA. In AI context: You can't satisfy everyone's preferences perfectly without becoming a dictator or violating consistency.
