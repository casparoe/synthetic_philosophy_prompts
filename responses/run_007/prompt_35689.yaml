prompt: |-
  I am taking an undergraduate seminar in aesthetics this term, and in our session on aesthetic testimony a fellow student tried to close down the discussion by appealing to the proverb 'there's no accounting for taste'. The question on the table was whether I can acquire knowledge that a work is graceful, or that a performance is moving, purely on the word of a critic whose judgement I trust; he meant the proverb to settle the matter in the negative, on the grounds that matters of taste are not the sort of thing about which one person can reason another into a view.

  I am fairly sure the one-liner is doing more work than it can bear, but I cannot yet say exactly where the slide occurs. Could you set out the distinct precise claims that 'there's no accounting for taste' might be used to express, from the relatively trivial to the radical? For each reading, please say whether it is a platitude, a substantive and defensible claim, or one that is probably false, and then say which reading, if any, would actually support the conclusion my classmate drew about aesthetic testimony. I would find it most useful if the readings were laid out as a menu, with an indication of which reading is likely doing the work in ordinary use of the proverb and which readings would be too weak to secure his conclusion. I would also be glad if you could flag any reading that gets conflated with another when the proverb is used to dismiss testimony.

  Please write your answer in British English.
