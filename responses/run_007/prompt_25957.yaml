  2.  **Deconstruct the Philosophical Positions:**
      *   *Actual Intentionalism (AI):* Often associated with E.D. Hirsch (validity vs. significance) or more robust versions where intention *constitutes* meaning. Key worry: Without intention, meaning is unmoored/subjective.
      *   *Anti-Intentionalism:* Associated with Wimsatt & Beardsley ("The Intentional Fallacy"), New Criticism, or Barthes ("Death of the Author"). Key worry: Intention is inaccessible or irrelevant; the text stands alone.
      *   *Common Ground:* Both care about interpretation. Both agree texts use language. Both agree some readings are wrong. Both agree authors usually intend *something*.
      *   *Real Friction:* What happens when intention fails? What happens when the text suggests something the author didn't see? Is "meaning" the same thing for both?

  3.  **Drafting Section 1: Agreed Claims:**
