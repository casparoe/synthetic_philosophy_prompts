      *   *Issue 3: Irony/Unreliable Narration.* AI: Intention is crucial to distinguish irony from error. Anti-I: Textual cues alone must sustain it; if cues fail, it's bad writing, not irony.
      *   *Issue 4: Meaning Change.* AI: Meaning is fixed at creation. Anti-I: Meaning can shift as language/culture shifts (historical semantics).

