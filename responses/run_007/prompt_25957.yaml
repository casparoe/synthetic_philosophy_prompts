      *   *Idea 3:* Some interpretations are objectively wrong. (Constrains relativism).
      *   *Idea 4:* Biographical context helps understanding, even if not constitutive of meaning.
      *   *Idea 5:* Paradigm cases align. (e.g., A simple sentence usually means what the author meant *and* what the text says).
