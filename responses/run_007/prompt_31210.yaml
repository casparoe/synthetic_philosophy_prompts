answer: |-
  You have stumbled onto one of the most significant debates in modern decision theory. Your intuition that the conclusion is insane is correct, but your diagnosis of *where* the logic breaks is slightly off.

  The flaw is not in step (1) (assuming you accept Functional Decision Theory), nor is it strictly in step (2). **The flaw is in step (3).**

  Specifically, step (3) conflates **logical correlation** (which exists in the Omega case) with **mere evidential correlation** (which exists in the Stranger case). Your argument follows the logic of *Evidential Decision Theory (EDT)*, which is widely considered flawed in these specific scenarios because it leads to "managing the news." The solution that preserves One-Boxing in Newcomb's Problem while rejecting the Stranger Mugging is *Functional Decision Theory (FDT)*.

  Here is the breakdown of where the argument goes wrong and how to save Newcomb's Problem.

  ### 1. The Core Distinction: Algorithm vs. Action

  In the original Counterfactual Mugging, Omega is not predicting your *action*; Omega is predicting your **decision algorithm**.

  *   **Omega Case:** Omega simulates you. Omega knows that if you are the *type of agent* who pays $100 when asked, Omega predicts "Pay," and you get $10,000. If you are the *type of agent* who refuses, Omega predicts "Refuse," and you get $0. Your decision *now* reveals which algorithm you are running. Because Omega's prediction was based on that same algorithm, there is a **logical dependency** between your current choice and Omega's past prediction. They are both outputs of the same function.
  *   **Stranger Case:** The stranger claims they predicted you. However, unless you have independent evidence that this stranger has access to your source code (or is a perfect predictor), there is no logical link. Your decision *now* does not determine what they did *this morning*.

  In step (3), you assume the structure is identical. It is not. In the Omega case, the correlation is built into the physics/logic of the scenario. In the Stranger case, the correlation relies entirely on the truthfulness and capability of the stranger, which you have no reason to trust.

  ### 2. Why Evidential Decision Theory (EDT) Fails Here

  Your reasoning in steps (1) through (4) is classic Evidential Decision Theory. EDT says: "Choose the action that gives you the best news about the world."

  *   **EDT Logic:** "If I pay, it is more likely that the stranger told the truth and I have $10,000. Therefore, I should pay to make it likely that I have $10,000."
  *   **The Problem:** This is "magical thinking." Paying the stranger does not *cause* the money to be in your account, nor does it logically entail that the money is there. It merely updates your *belief* that the money is there. EDT agents will pay to feel good about their evidence, even if the action has no causal or logical leverage over the outcome.

  This is why step (3) is the failure point. EDT says you should pay the stranger. **Almost all decision theorists agree this is wrong.** You should not pay the stranger because your payment has no leverage over the stranger's past action.

  ### 3. How Functional Decision Theory (FDT) Saves the Day

  Functional Decision Theory (championed by researchers at the Machine Intelligence Research Institute, like Eliezer Yudkowsky and Nate Soares) fixes this by distinguishing between *causal* influence and *logical* influence.

  *   **FDT Rule:** You should act as if you are choosing the output of your decision function. You should ask: "If my decision function outputs 'Pay', what happens? If it outputs 'Don't Pay', what happens?"
  *   **Applied to Omega:** If my function outputs "Pay," Omega (who simulates my function) predicted "Pay," so I have $10,000. If my function outputs "Don't Pay," Omega predicted "Don't Pay," so I have $0. **Logical leverage exists.** I should pay.
  *   **Applied to Stranger:** If my function outputs "Pay," does that change what the stranger did this morning? No. The stranger's action was not a simulation of my function; it was a claim. Unless I have strong prior evidence that the stranger is a predictor, my decision function has no logical grip on their past behavior. **Logical leverage does not exist.** I should not pay.

  This allows you to accept (1) (Pay Omega) while rejecting (3) (Don't Pay Stranger).

  ### 4. What About Newcomb's Problem?

  You asked if this objection rules out One-Boxing. It does not, provided you use FDT (or Timeless Decision Theory) rather than EDT.

  *   **Newcomb's Problem:** Omega puts money in Box B based on a prediction of your choice.
  *   **The Link:** Just like Counterfactual Mugging, Omega's prediction is a simulation of your decision algorithm. Your choice now and Omega's past placement are logically linked.
  *   **The Stranger:** The stranger has no proven link to your algorithm.

  Therefore, you can consistently One-Box in Newcomb's Problem (because the predictor is reliable and the logical link exists) while refusing to pay the Stranger (because the predictor is unverified and the logical link is absent).

  ### 5. Addressing Step (4) and Pascal's Mugging

  Step (4) touches on "Pascal's Mugging": *If there is a nonzero chance the stranger is telling the truth, and the stakes are high enough, shouldn't I pay?*

  This is a problem of **priors**, not decision theory.
  *   In the Omega scenario, the premise *grants* you that Omega is a perfect predictor. You are told to assume it is true.
  *   In the Stranger scenario, you must assign a probability to the claim "I am a perfect predictor." In the real world, this probability is vanishingly small.
  *   Even with high stakes, if the probability is low enough (e.g., $10^{-100}$), the Expected Value remains negative.
  *   However, relying solely on low priors is risky (what if the stakes are $10^{100}$?). The stronger objection is the one above: **Even if you assign a 70% credence that the stranger is telling the truth, you still shouldn't pay.** Why? Because paying doesn't help. If they are a liar, you lose $100. If they are a truth-teller, the money is already there or not; your payment doesn't *make* it be there.

  Wait, if they are a truth-teller, doesn't your payment correlate with the money being there? Yes, but only evidentially. If you adopt FDT, you realize that paying doesn't *secure* the money. The money was secured by your *disposition* before you met the stranger. If you are the type of person who pays, and they are a predictor, they already deposited the money. If you are the type who refuses, they didn't. Your actual action at the moment of meeting is just a readout of your disposition.

  ### Summary of the Flaw

  The mistake is in **Step (3)**.

  The reasoning in (1) works because Omega's prediction and your action share a **common logical cause** (your decision algorithm).
  The reasoning in (3) fails because the Stranger's claim and your action **do not share a logical cause** (unless you have evidence the stranger is Omega-like).

  Your argument treats the Stranger's claim as if it establishes the same logical structure as Omega's setup. It does not. It merely establishes an *evidential* link. Paying the Stranger is "managing the news"—trying to make the world look better by your actions, rather than making the world *be* better.

  **To keep One-Boxing:** Stick to the view that you are choosing for your *algorithm*, not just your *action*. Omega predicts your algorithm; the Stranger does not. Therefore, you have leverage over Omega, but not over the Stranger.
