answer: |-
  ### Part 1: Correspondence Table

  Your colleague's argument rests on a structural mapping between the criminal trial system and the proposed legislative body. Below is the explicit correspondence between the two systems as implied by his argument.

  | Feature | Trial Jury System | Proposed Lottocratic Legislature |
  | :--- | :--- | :--- |
  | **Personnel Source** | Jury Pool (registered voters/drivers license holders). | Adult Residents (The Demos). |
  | **Selection Method** | Random Sortition (with *voir dire* exclusions). | Random Sortition (presumably with similar exclusions). |
  | **Representation Goal** | Fair cross-section of the community. | Fair cross-section of the community. |
  | **The "Judge"** | A trained legal expert who rules on procedure, evidence, and law. | **None.** (Proposal grants "full power to set its own agenda.") |
  | **The "Charge"** | Specific legal questions (e.g., "Did X commit Y?"). | **Self-generated.** (Legislature sets its own agenda.) |
  | **Information Flow** | Strictly controlled evidence rules; no outside research. | Unspecified, but presumably open to lobbying/testimony. |
  | **Deliberation** | Secret, insulated from public pressure, time-limited. | Public (presumably), subject to public pressure, ongoing term. |
  | **Decision Output** | Verdict (Guilty/Not Guilty/Liability). | Ordinances (Laws, Budgets, Zoning). |
  | **Standard of Proof** | Beyond Reasonable Doubt / Preponderance of Evidence. | Simple Majority / Supermajority. |
  | **Review Mechanism** | Judicial review (appeals), mistrial motions. | Judicial review (constitutionality) or Recall? |
  | **Accountability** | Anonymity; jurors cannot be punished for verdicts. | Anonymity? Or public record? (Unclear in proposal). |
  | **Duration** | One case (days to months). | A term (years). |

  ### Part 2: Disanalogies

  To determine if the analogy holds, we must distinguish between superficial differences and structural fractures.

  **Insignificant Disanalogies (Do not undermine the argument)**
  *   **Civil vs. Criminal Stakes:** Whether the jury decides prison time or the legislature decides tax rates is a difference in *domain*, not *cognitive capacity*. If citizens can handle the moral weight of incarceration, they can handle the moral weight of zoning.
  *   **Unanimity vs. Majority:** Juries often require unanimity; legislatures usually operate by majority. This is a procedural tweak, not a fundamental break. Sortition bodies can be required to reach consensus if desired.
  *   **Secrecy:** Jury deliberations are secret; legislative ones are public. While this changes the *pressure* environment, it does not inherently disqualify the competence of the members.

  **Significant Disanalogies (Undermine the argument)**
  *   **Constraint vs. Agency (The "Judge" Problem):** This is the fatal flaw. A jury is **reactive** and **constrained**. They cannot choose *what* to try, *who* to charge, or *what law* to apply. They are sandboxed by the Judge and the Prosecution/Defense. Your colleague's proposal gives the legislature **"full power to set its own agenda."** This removes the "Judge" equivalent entirely. A jury without a judge is a mob; a legislature without agenda constraints is an unchecked power.
  *   **Fact-Finding vs. Value-Creation:** Juries decide *facts* about a *past* event based on *existing* law ("Did he pull the trigger?"). Legislatures decide *values* for the *future* based on *resource allocation* ("Should we build a jail or a school?"). The cognitive task of balancing a budget requires technical literacy and trade-off analysis that binary fact-finding does not.
  *   **Insulation vs. Exposure:** Jurors are sequestered. They are forbidden from reading news or talking to neighbors. Legislators are expected to be responsive to constituents. A lottocratic legislator exposed to lobbyists, media campaigns, and angry neighbors lacks the protective insulation that makes the jury's impartiality possible.
  *   **Episodic vs. Continuous Service:** A juror serves once, then returns to anonymity. This prevents careerism and corruption. A legislator serving a term (even a short one) becomes a target for influence. If they serve multiple terms, they become a distinct class. If they serve one term but are publicly identified, they are vulnerable to retribution or bribery in ways a sequestered juror is not.

  ### Part 3: Quietly Imported Features

  The analogy succeeds rhetorically because it silently imports the **infrastructure of the trial** into the **vision of the legislature.** Your colleague is imagining a lottocratic legislature that behaves like a jury, but he is proposing a body that lacks the mechanisms that *make* a jury behave.

  1.  **The Filter of Admissibility:** In a trial, a judge excludes irrelevant, prejudicial, or hearsay evidence. In the proposed legislature, who filters the "evidence" (lobbyist testimony, expert reports, economic projections)? Without a "Judge" function, the body is vulnerable to information asymmetry and manipulation by those with the resources to produce the most convincing "testimony."
  2.  **The Fixed Law:** Jurors apply existing law; they do not write it. This limits the scope of their discretion. The proposed legislature writes the law. This exponentially increases the complexity of the decision space.
  3.  **The Adversarial Balance:** In a trial, the State and Defense are (theoretically) equally motivated to expose the truth. In a legislature, interest groups are not balanced. One side may have millions in funding; the other, none. The jury system assumes a balanced presentation of information; the legislative environment does not guarantee this.
  4.  **Anonymity as Protection:** Jurors are protected by anonymity *after* the verdict. If the lottocratic legislators are known, they lose the protection against retribution that allows jurors to be truly impartial. If they are anonymous, they lose democratic accountability.

  ### Part 4: Committed Verdict

  **The Verdict:** The analogy **fails** to support your colleague's conclusion.

  The jury analogy does not prove that a lottocratic legislature would be competent and accountable. In fact, when analyzed closely, the jury analogy argues **against** giving a lottocratic body "full power to set its own agenda."

  The jury system works *because* it is hemmed in by judges, rules of evidence, fixed laws, and adversarial balance. It is a system of **constrained discretion.** Your colleague is proposing a system of **unconstrained discretion** staffed by the same personnel. By removing the constraints (the Judge, the fixed charge, the evidence rules) while keeping the personnel (random citizens), he removes the very features that make the jury competent.

  A random citizen is competent to judge a specific fact *when the parameters are set by experts*. A random citizen is not inherently competent to *set the parameters themselves* without expert guidance or structural checks. The analogy carries the argument only as long as you ignore the "Judge" row in the correspondence table. Once you acknowledge that the proposed legislature has no equivalent to the Judge, the claim of "competence and accountability" collapses. The body would likely be highly susceptible to agenda-capture by bureaucrats (who draft the laws) or special interests (who lobby the members), lacking both the expertise to evaluate them and the electoral accountability to punish them.

  ### Part 5: A Better Analogy

  If we wish to salvage the value of sortition without the fatal flaws of the jury analogy, a better analogy is the **Citizens' Assembly** (or a **Planning Commission**).

  **The Correspondence:**
  *   **Selection:** Random sortition (stratified for representation).
  *   **Task:** Deliberate on a *specific question* referred to them by the elected body or constitution (e.g., "Should we adopt this zoning reform?" or "How should we allocate this surplus?").
  *   **Support:** Provided by neutral staff and balanced expert testimony (The "Judge" function is external).
  *   **Output:** A recommendation or a binding vote *within a narrow scope*.
  *   **Accountability:** The process is transparent; the scope is limited; the elected body retains final ratification or veto power.

  **The Conclusion This Analogy Supports:**
  This analogy supports a **hybrid model**, not a replacement. It suggests that randomly selected citizens are excellent at **deliberative judgment on specific values** when insulated from partisan campaigning and supported by neutral expertise.

  **Final Recommendation:**
  Do not replace the elected council. The elected council provides the necessary "Judge" and "Agenda-Setter" functions (accountability for direction). Instead, propose **embedding a sortition-based Citizens' Assembly** within the current system. Give this body the power to review ordinances, set specific agenda items, or break deadlocks, but keep them within the "sandbox" of defined questions and expert support. This captures the jury's impartiality and representation without sacrificing the governance structures required for complex legislative action.
