      *   *Disanalogies:* Focus on *Constraint*, *Time/Complexity*, and *Accountability*.
      *   *Quiet Imports:* The "Judge" function is the big one. The "Evidence Rules" are the second.
      *   *Verdict:* Be firm. The analogy fails to support *replacement* of an elected council. It supports *supplementation*.
      *   *Better Analogy:* A "Zoning Board of Appeals" or "Citizens' Assembly." These are limited scope, advisory or quasi-judicial, not full legislative power.

      *(Self-Correction during drafting)*: I need to make sure I address the "full power to set its own agenda" clause in the prompt. That is the death knell of the jury analogy. Juries *never* set their own agenda. They respond to a charge. If the lottocratic legislature sets its own agenda, it is acting as Prosecutor, Judge, and Jury. That destroys the analogy. I must emphasize this.

