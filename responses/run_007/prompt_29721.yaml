      *   Committed verdict? Yes.
      *   Better analogy? Yes.

      *Tone Check:* Ensure I'm not being dismissive of sortition generally, but critical of *this specific argument* based on *this specific analogy*.

      *Key Insight:* The jury works *because* it is powerless except for the verdict. It is constrained by law, evidence, and the judge. A legislature with "full power to set its own agenda" has none of these constraints. The analogy is actually an argument *against* the colleague's specific proposal.

