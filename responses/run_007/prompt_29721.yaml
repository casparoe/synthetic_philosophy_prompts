      Let's stick with the **Citizens' Assembly** model as the better analogy. It acknowledges the value of sortition but limits the scope to deliberation on specific questions referred to them, preserving the "Judge/Agenda" function elsewhere.

  8.  **Final Polish:** Check against all constraints in the prompt.
