  Peter Singer's *The Expanding Circle* proposes that moral progress is essentially a process of recognition, where reason compels us to extend our ethical concern beyond kin and tribe to encompass all sentient beings. It is an optimistic narrative about the capacity of human rationality to overcome biological selfishness and historical prejudice. When we place Ursula K. Le Guin's "The Ones Who Walk Away from Omelas" alongside this thesis, the story functions as a profound stress test for Singer's framework. Omelas presents a society that has seemingly achieved a high degree of social harmony and cultural sophistication, yet its stability relies entirely on the deliberate exclusion of one sentient being from the circle of moral concern. Reading the story through Singer's lens forces us to ask not just how the circle expands, but how it is actively contracted and maintained through rationalization. In Singer's account, the boundary of the moral circle is often a relic of evolutionary history or ignorance, something that education and reason can erode. However, the citizens of Omelas are not ignorant. They know about the child. They are told about the child. Their exclusion of the child is not a failure of knowledge but a conscious ethical choice grounded in a utilitarian calculus that Singer himself might recognize, albeit one he would reject due to the violation of equal consideration of interests. The story reveals that the mechanisms maintaining a moral boundary are not merely passive habits but active psychological maneuvers. The citizens experience initial shock and disgust, yet they are taught to justify the child's suffering as the necessary cost for their own happiness. This suggests that reason is double-edged; it can be the engine of the expanding circle, as Singer hopes, but it can also be the architect of a prison, constructing elaborate philosophical defenses for cruelty. The Omelasians demonstrate that moral progress is not inevitable simply because beings are sentient; there must be a willingness to accept the costs of inclusion, which Omelas refuses to do.

  This tension leads us to question whether the story suggests a natural limit to the expanding circle. Singer implies the circle should expand indefinitely until it includes all sentient life, driven by the logical inconsistency of excluding beings who share the capacity for suffering. Omelas suggests there is a point where society draws a hard line and says no further. The child represents the absolute limit of their empathy. The social contract is explicit: the circle stops here. This challenges Singer's optimism by showing that a society can be fully aware of the sentient status of an excluded group and choose to maintain that exclusion permanently. It implies that the expanding circle encounters resistance not just from lack of reasoning power, but from a collective commitment to a specific distribution of happiness that relies on exploitation. The limit is not natural but political and psychological. Consequently, the act of walking away becomes the critical variable in this ethical equation. For Singer, the response to an unjust boundary should ideally be to argue, reform, and expand the circle within the system. The ones who walk away, however, offer a different solution. They do not stay to negotiate the terms of the child's imprisonment, nor do they attempt to rescue the child, which would destroy Omelas. They simply leave. Through Singer's lens, this might look like a failure of engagement, but through Le Guin's, it is the only moral response to a system whose foundation is inherently corrupt. This suggests that when the circle is drawn around a fundamental atrocity, expansion is impossible; the only honesty lies in abandonment. It raises the question of whether moral progress requires staying within imperfect systems to improve them or recognizing when a system is beyond redemption.

  Le Guin further complicates the picture in ways that Singer's account does not anticipate, particularly regarding the role of emotion and ambiguity in moral action. Singer's framework is deeply rationalist. He believes that if we understand the logic of equal consideration, we will move toward it. Le Guin complicates this by showing that people can understand the logic and reject it, or accept the horror via logic. Furthermore, the walkers do not leave because they have formulated a new ethical theory; they leave because they cannot bear the reality. Le Guin introduces an element of moral intuition and emotional integrity that sits outside Singer's utilitarian calculus. She also leaves their destination unknown, resisting the urge to provide a teleological endpoint for moral progress. Singer knows where the circle is going, toward universal benevolence; Le Guin does not know where the walkers are going. This ambiguity highlights that moral action sometimes requires stepping into the unknown without a guarantee of a better system, prioritizing personal complicity over systemic optimization. Ultimately, pairing these texts reveals that the expansion of moral concern is not just a logical unfolding but a struggle against the comforts of complicity. Singer provides the map for how we ought to think; Le Guin provides the mirror for how we actually feel when confronted with the cost of that thinking. Together, they suggest that while reason may show us the boundary of the circle, it is often our refusal to accept suffering that determines whether we stay within it or walk away.
