  4.  **Developing the Reasoning/Diagnosis:**
      *   **Distinction from Ordinary Circularity:** Ordinary circularity (begging the question) is usually logical or dialectical (assuming the conclusion in the premises). This is *epistemic*. The premises aren't necessarily the conclusion, but the justification for the premises depends on the reliability of the source whose reliability is being concluded. It's about warrant transmission, not just truth preservation.
      *   **Is it always a mistake?** This is debated. Externalists (like reliabilists) might argue if the source *is* reliable, the belief is justified, even if the subject can't know it without circularity. Internalists usually flag it as a failure of reflective knowledge. Vogel and Cohen argue it's too easy ("Easy Knowledge"). Alston argues it's unavoidable for fundamental sources (like sense perception) but doesn't yield "adequate" justification in a reflective sense.
      *   **The Line:** The line is drawn between *track-record arguments* that rely on independent calibration versus those that rely on self-calibration. A legitimate check requires an independent anchor (e.g., checking a scale against a standard weight defined by physics, not another measurement from the same scale).
      *   **Candidate Concepts:**
