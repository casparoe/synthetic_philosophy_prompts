          *   *Epistemic Circularity:* Fits well (Alston). It's the broader category.
          *   *Bootstrapping:* Fits best (Vogel). It captures the "pulling oneself up by bootstraps" aspect of generating reliability from nothing but the source itself.
          *   *Easy Knowledge:* Fits the consequence (Cohen). It explains why it feels "too cheap."

