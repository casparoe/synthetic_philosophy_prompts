answer: |-
  Subject: Draft handout structure for peer disagreement seminar

  Hi there,

  This is a great idea for a handout, and I think using a decision tree will help students locate their intuitions quickly, though I do have a reservation about the format that I want to flag before you finalize it. Epistemological views on disagreement are often matters of degree rather than binary switches, and a tree risks forcing a sharp distinction between views that actually overlap on specific cases depending on how much evidence is available. For instance, the Total Evidence View and the Right Reasons View can both recommend staying steadfast in your specific clinical trial case, but for very different theoretical reasons that a simple output-based tree might obscure. If you have the space, I would suggest supplementing the tree with a two-dimensional graph where one axis represents how much weight you give to first-order evidence versus higher-order evidence, and the other represents how much you conciliate, as this captures the spectrum of moderate views better than a branching path. However, for a concise handout, the tree works if we are careful about how we phrase the nodes.

  Here is how I would structure the flow using your statistician case. You start students at the top with the scenario where you and your equally competent colleague disagree on the drug's efficacy despite identical data and care. The first branching question should be, "Given that she is just as competent as you, should you significantly reduce your confidence in your conclusion, perhaps even suspending judgment entirely?" If the student answers no, they move to the steadfast branch; if yes, they move to the conciliationist branch. On the steadfast branch, the next question needs to distinguish between those who think they are right because they grasped the reasons correctly and those who think the category of peer disagreement doesn't demand special treatment. So ask, "Do you maintain your belief because you think you actually reasoned correctly about the data, or because you think disagreement is just another piece of evidence that doesn't outweigh the data itself?" If they say the former, they land on the Right Reasons View. If they say the latter, they land on the Deflationary or Total Evidence View, which challenges the idea that peer disagreement is a special epistemic category requiring unique rules. On the conciliationist branch, the second question should be, "Do you reduce your confidence because the symmetry of your peer status makes her judgment cancel out yours, even if you feel sure you reasoned correctly, or do you reduce it simply because disagreement is some evidence of error while still trusting your own reasoning somewhat?" If they say the symmetry cancels out their reasoning, they land on the Equal Weight View. If they say they still trust their reasoning somewhat but shift anyway, they land on a Moderate Conciliationist position.

  I need to point out two logical gaps you should annotate on the handout so students don't get confused. First, there is a logically possible combination of answers that nobody actually defends, which is the position where you should reduce your confidence significantly only if you are actually wrong about the data. You should flag this spot as empty because it offers no usable guidance; since you cannot know independently whether you are wrong before you adjust your belief, this rule cannot be followed in real time. Second, you should note that the tree cannot fully separate the Right Reasons View from the Total Evidence View in this specific case, because both might tell you to stay steadfast here. The distinction lies in what they would say if the data were slightly weaker, so you might add a footnote explaining that the Right Reasons View allows you to rely on your assessment of the reasons even against a peer, whereas the Total Evidence View treats the peer's disagreement as just another input to weigh against the data. Finally, be aware that the Moderate Conciliationist leaf is somewhat fuzzy because there are many ways to be moderate, so you might want to label it as a family of views rather than a single position. I think this structure covers the required positions while keeping the questions grounded in the case rather than theoretical jargon, and if you add the note about the spectrum of belief adjustment, it should mitigate the risk of oversimplification.

  Best,

  [Your Name]
