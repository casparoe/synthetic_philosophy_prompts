  5.  **Final Polish:** Check the Devlin logic again. Devlin says society *may* enforce morality. But he also says the morality must be *shared*. If the local community shares a morality that *permits* the act (protecting elders), then a Devlinist would argue against *external* imposition or even local criminalization if it contradicts the *actual* shared feeling. Wait, if the Association is the "de facto legislature," a Devlinist on the Association would argue against making it a rule *against* the exemption. Yes. The Association *could* ban the exemption. The Devlinist says "Don't ban it, because our shared morality says protect elders." The Hartian says "Ban it, because it hurts firefighters."
      *   *Correction:* The prompt asks for a scenario where a Devlin-style moralist argues *against criminalizing a practice*. So the practice is the "Exemption/Waiver." The Devlinist says "Do not criminalize/ban this waiver." Why? Because the community morality supports it. The Hartian says "Criminalize/ban this waiver." Why? Because it causes harm.
      *   *Wait, one nuance:* Devlin is usually associated with *supporting* criminalization of immorality. Here, he is *opposing* criminalization. This works if the "immorality" (safety violation) is not viewed as immoral by the community. Devlin's thesis is that law follows shared morality. If shared morality says "X is okay," Devlin says "Law should not ban X." This fits the constraint "moralist's restraint must come from Devlin's own limiting factors."
