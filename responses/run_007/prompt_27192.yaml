      *   *The Practice:* Needs to be morally neutral or ambiguous enough that the community doesn't hate it (satisfying Devlin's restraint), but has structural consequences that harm others (satisfying Hart's harm principle).
      *   *Idea 1:* Noise complaints? Too simple.
      *   *Idea 2:* Short-term rentals (Airbnb)?
          *   Devlin: People don't feel *moral indignation* about renting homes, it's commerce. No shared morality violated.
          *   Hart: It causes housing shortages, displaces locals (harm to others).
          *   *Critique:* Is housing shortage "harm" in the Hartian sense? Yes, economic harm. But is it "private conduct"? Yes.
      *   *Idea 3:* A specific social exclusion practice?
          *   Devlin: If the community accepts it as "how things are," no indignation.
          *   Hart: It causes psychological or economic harm.
      *   *Idea 4:* "Silent shunning" or non-disclosure agreements in a neighborhood?
      *   *Idea 5:* A specific type of financial behavior. Predatory lending within the neighborhood?
          *   Devlin: If everyone does it, no indignation.
          *   Hart: Harm to victims.
          *   *Critique:* This looks like fraud, which is already illegal. Needs to be something *not* currently illegal but arguably should be.
      *   *Idea 6:* **The "Quiet Equity" Scenario.** A neighborhood where residents secretly buy up neighboring properties to keep them empty as "investment vehicles" or "privacy buffers," not to live in.
          *   *Devlin:* Is this immoral? Not really. It's property rights. No public indignation. Therefore, don't criminalize.
          *   *Hart:* Does this cause harm? It creates ghost towns, reduces emergency response viability, lowers property values for others, erodes community safety (harm to others).
          *   *Refinement:* Let's make it more interpersonal. A practice of "contractual silence" regarding safety violations.
      *   *Idea 7:* **The "Private Security Settlement" Scenario.** Neighbors agree to privately settle safety violations (e.g., unsafe pools, structural issues) with cash payments rather than reporting them to authorities, keeping the risk hidden from future buyers or renters.
          *   *Devlin:* Does this trigger "intolerable indignation"? Maybe not. It's seen as "keeping it in the family" or "pragmatic." If the community doesn't feel deep moral outrage, Devlin says the law shouldn't intervene. The moral fabric isn't torn because the shared norm *is* privacy/pragmatism.
          *   *Hart:* This creates direct risk of physical harm to third parties (future buyers, renters, emergency workers) who are unaware of the danger. This is preventable harm.
          *   *Check:* Does Devlin allow restraint here? Yes, if the "shared morality" accepts this pragmatism. Devlin argues law follows shared morality, not leads it. If the shared morality is "mind your own business," Devlin says don't legislate.
          *   *Check:* Does Hart allow intervention? Yes, because hidden structural dangers cause physical harm to others (non-consenting third parties).

      *   *Idea 8 (Better):* **The "Exclusive Access Easement" Scenario.** A wealthy enclave where neighbors privately contract to block public access to a coastal path that was historically open, not out of malice, but to reduce liability insurance costs.
          *   *Devlin:* No moral indignation. It's prudent financial management. The community shares a value of risk mitigation. Therefore, no law needed.
          *   *Hart:* This harms the public's established right of way and creates economic/access harm.
          *   *Critique:* This feels like property law, not moral code.

      *   *Idea 9 (Best Fit):* **The "Non-Reporting Pact" regarding minor safety violations.**
