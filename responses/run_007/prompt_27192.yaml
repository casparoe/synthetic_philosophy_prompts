answer: |-
  In the coastal enclave of Seabrook, the Neighborhood Association maintains an unwritten "Heritage Exemption" whereby long-term residents are permitted to bypass modern safety retrofitting codes for historic homes, provided they sign private waivers releasing the association from liability, a practice defended as preserving community character and protecting fixed-income elders from bankruptcy. A Devlin-style moralist on the board argues against codifying a ban on this exemption, contending that the community feels no collective indignation toward protecting its elders and history, and that imposing external safety standards would violate the shared moral understanding that mutual aid outweighs abstract compliance. Conversely, a Hart-style liberal on the board argues for criminalizing the practice at the municipal level, asserting that the waivers create a foreseeable risk of physical injury to emergency responders and future buyers who cannot consent to the structural risks, constituting a direct harm that outweighs the community's moral preference for solidarity.

  ### Analysis of Positions

  **The Devlin-Style Moralist (Against Criminalization)**
  The moralist's restraint stems directly from Devlin's thesis that the criminal law is justified only when it enforces a shared morality held with "intolerable indignation." In this scenario, the community does not view the exemption as immoral; rather, they view it as a virtuous act of solidarity toward vulnerable elders. For Devlin, the law must reflect the actual moral sentiments of the society, not an abstract ideal of safety. If the community feels no disgust or outrage toward the practice, but instead feels a moral duty to sustain it, then criminalizing it would be an act of tyranny rather than moral enforcement. The feature doing the work here is **the absence of shared indignation**. Devlin limits the law's reach to what the community genuinely perceives as a sin; since the community perceives this as a virtue (protecting neighbors), the legal moralist must argue against intervention.

  **The Hart-Style Liberal (For Criminalization)**
  The liberal's support for criminalization relies on the **harm principle**, specifically the protection of non-consenting third parties from physical injury. While the residents signing the waivers consent to the risk, the emergency responders (firefighters, paramedics) and future buyers do not. They are exposed to structural dangers (e.g., collapsing railings, fire hazards) without their knowledge or agreement. For Hart, this is a classic case of preventable harm to others. The feature doing the work here is **non-consensual risk imposition**. The liberal argues that the state's duty to prevent physical harm overrides the community's moral preference for solidarity when that solidarity externalizes danger onto outsiders.

  ### The Hartian Defense Against Redefining Harm

  A critic might accuse the Hart-style liberal of surreptitiously redefining "harm" to include "moral offenses" or "economic instability," thereby smuggling legal moralism back in under the guise of liberalism. A defender of Hart would resist this by drawing a sharp distinction between **setbacks to interests** and **violations of moral codes**.

  The Hartian defense would argue that physical safety is a primary interest essential for any individual to pursue their own conception of the good life. When a homeowner bypasses safety codes, they are not merely violating a moral norm; they are objectively increasing the probability of bodily injury to specific, identifiable classes of people (responders, buyers) who have not agreed to that risk. This is not a "moral harm" (such as the offense Devlin might worry about regarding public decency); it is a tangible setback to welfare and security. Hart allows the law to intervene whenever one person's liberty creates a high probability of physical damage to another's person or property. Therefore, criminalizing the exemption is not about enforcing a moral view that "safety is virtuous," but about preventing the tangible harm of "injury due to negligence." The harm exists independently of the community's moral approval of the practice.
