          *   *Analysis:* The mapping *is* arbitrary in a chemical sense (stereochemistry doesn't strictly dictate it, though there are some physicochemical affinities). The term "genetic code" is standard scientific terminology. However, "convention" implies agreement among agents, which is tricky in evolution.
