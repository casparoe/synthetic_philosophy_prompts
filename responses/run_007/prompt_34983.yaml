          *   *Verdict:* Mostly Right. The mechanism is intrinsic to the system, not the origin story.

      *   **Move 6 (David):** History *does* matter (sand marks example). DNA isn't a message; it's covariation due to selection. 'Code' implies a sender.
          *   *Analysis:* The sand example works for *semantic* meaning (pragmatics), but not necessarily for *syntactic* coding. DNA has a historical origin (replication/inheritance), unlike wind-scratched sand. But David is right that there is no *intentional* sender.
          *   *Verdict:* Mixed. Good point on history/etiology defining function (etiological theory of function), but weak on denying the coding relationship itself.

