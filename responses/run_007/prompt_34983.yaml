      *   **Move 8 (David):** You're shifting senses of 'information' (Shannon vs. Intentional vs. Biological Specification). Blueprint analogy.
          *   *Analysis:* David correctly identifies the equivocation on "information." The blueprint analogy is classic (Mayr, etc.). Blueprints specify but aren't necessarily "codes" (though they use symbolic representation).
