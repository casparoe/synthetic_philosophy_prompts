prompt: |-
  I am a retired computational neuroscientist. For the past few years, after leaving the lab, I have been reading philosophy of action—Bratman, Searle, Margaret Gilbert, and the surrounding literature on collective intentionality—and this semester I find myself teaching an upper-level undergraduate seminar called "Minds, Groups, and Joint Action." I am writing the final exam and I need your help with one question in particular.

  You are an expert philosopher of action who specializes in collective intentionality and joint action. Please think carefully about what I am asking before you write, and produce a polished, rigorous exam question together with a model answer and a detailed marking scheme.

  I want one essay question that separates the students who have genuinely understood the theoretical architecture of the three main accounts we covered—Bratman's planning theory of shared intention, Searle's we-intention account, and Gilbert's joint-commitment account—from those who have merely memorized the labels and can recite summaries. The question should present a novel vignette: a short, realistic case study of two people engaged in coordinated activity that is ambiguous between genuine joint action and mere parallel individual action with coordination. The vignette should target a theoretical pressure point, such as whether the "shared goal" in joint action can be analyzed in purely individualistic terms, or whether the normative structure of joint commitment is essential to joint action, or what happens when the participants have asymmetric attitudes toward the joint activity. The students should be asked to analyze the vignette through the lens of each account, explain why the accounts yield different verdicts (or the same verdict for different reasons), and argue for which account handles the case best.

  Please produce the following three items:

  1. **The essay question itself**, including the vignette. The vignette should be specific enough to apply the theoretical conditions to, realistic rather than obviously contrived, and designed to expose a genuine structural difference between the accounts.

  2. **A model answer of roughly 800 words.** This should demonstrate the analytical moves that distinguish an A-level answer from a B-level answer. It should not merely summarize the three accounts but should use the vignette to expose the structural differences between them, identify where each account's analysis bottoms out (in planning structures, in biological primitives, in normative relations), and offer a reasoned, non-question-begging argument for which account handles the vignette best.

  3. **A marking scheme allocating 25 marks across five criteria.** For each criterion, include a brief note on what distinguishes an A-level answer from a B-level answer. The five criteria should be: (i) accurate reconstruction of each account's conditions for joint action; (ii) correct application of those conditions to the vignette; (iii) identification of the deeper theoretical disagreement the vignette exposes; (iv) quality of argument about which account handles the vignette best and why; and (v) clarity and philosophical precision of writing.

  Before you write the final deliverables, I would like you to think through the logical structure of the three accounts—what each requires for an activity to count as genuinely joint or shared, and what each account takes as primitive or irreducible—and then identify what kind of vignette would most sharply expose their differences. The question should reward the students who have done the hardest thinking, not the ones who have done the most reading.
reasoning: |-
  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **User:** Retired computational neuroscientist teaching an upper-level undergraduate seminar ("Minds, Groups, and Joint Action").
      *   **Task:** Create a final exam essay question, a model answer, and a marking scheme.
      *   **Topic:** Philosophy of Action / Collective Intentionality (Bratman, Searle, Gilbert).
      *   **Goal:** Distinguish students who understand the *theoretical architecture* from those who just memorized labels.
      *   **Requirements:**
          1.  A novel, realistic vignette targeting a theoretical pressure point (e.g., individualism vs. normativity, asymmetric attitudes).
          2.  A model answer (~800 words) showing A-level analysis (structural differences, bottoming out points, reasoned argument).
          3.  A marking scheme (25 marks, 5 criteria) distinguishing A vs. B performance.
      *   **Constraint:** Think through the logical structure of the three accounts first to design the vignette effectively.

  2.  **Deconstruct the Three Accounts (Theoretical Architecture):**
      *   **Michael Bratman (Planning Theory):**
          *   *Core:* Shared intention is a web of interlocking individual intentions.
          *   *Conditions:* I intend that we J; You intend that we J; Mutual knowledge; Meshing subplans; Commitment to mutual support.
          *   *Nature:* Reductive/Individualistic. No new ontological subject. Normativity is derived from norms of individual planning consistency.
          *   *Weakness/Pressure Point:* Can handle cooperation, but struggles with strong normative obligations (you can't really *owe* it to me in a robust sense if it's just my plan) and cases of asymmetric commitment.
      *   **John Searle (We-Intention):**
          *   *Core:* Primitive "we-intentions" in individual heads.
          *   *Conditions:* Individual has a we-intention (I intend that we J) + mutual belief.
          *   *Nature:* Individualistic ontology (it's all in the head) but irreducible content (the "we" is primitive).
          *   *Weakness/Pressure Point:* Doesn't explain the *normative force* of joint action well. It's psychological, not deontic. Struggles with cases where the psychological state exists but the social bond is broken (or vice versa).
      *   **Margaret Gilbert (Joint Commitment):**
          *   *Core:* Joint commitment creates a plural subject.
          *   *Conditions:* Express readiness to commit + common knowledge -> creates normative obligations/entitlements.
          *   *Nature:* Non-reductive/Normative. The obligation is constitutive.
          *   *Weakness/Pressure Point:* Can be too strong (requires explicit agreement?) or too rigid. Distinguishes sharply between mere coordination and joint action based on obligation.

  3.  **Designing the Vignette (The Pressure Point):**
      *   *Goal:* Need a case where individual intentions align, but the *normative status* is ambiguous.
      *   *Idea:* Two people painting a house.
      *   *Twist:* One person thinks they are "helping a friend" (personal goal), the other thinks they are "fulfilling a contract" (obligation). Or, a case where one person defects without warning.
      *   *Better Twist:* A "Flash Mob" style scenario vs. a "Duet" scenario? No, too obvious.
      *   *Selected Scenario:* **The Improvised Rescue.** Two strangers lift a fallen beam to save a trapped cat.
      *   *Why:*
          *   *Bratman:* Do they have interlocking plans? Yes. Do they have meshing subplans? Yes. Is there mutual knowledge? Yes. Verdict: Joint Action.
          *   *Searle:* Do they have we-intentions? Plausibly yes ("We are lifting this"). Verdict: Joint Action.
          *   *Gilbert:* Is there a joint commitment? Did they express readiness to be bound? Probably not. It's spontaneous. Verdict: *Not* Joint Action (or at least, not a robust plural subject).
      *   *Refinement:* Let's make it slightly more sustained to test the "obligation" aspect. **The Community Garden.**
      *   *Scenario:* Alice and Bob agree to water the garden together every Saturday. Alice treats it as a flexible arrangement (if she's tired, she skips). Bob treats it as a binding duty (he gets angry if she skips). They water together for months. Then Alice stops without notice.
      *   *Why this works:*
          *   *Bratman:* Focuses on the *intentions at the time of action*. If they intended "we water" and meshed subplans, it was joint. Alice's later defection might violate norms of stability, but is it a violation of *obligation* to Bob? Bratman says there's a normative element, but it's weak.
          *   *Searle:* Focuses on the psychological state. If they both had "we-intentions," it was joint. Alice's internal change matters.
          *   *Gilbert:* Focuses on the *commitment*. If they didn't explicitly establish a joint commitment (or if Alice didn't grasp the normative force), there is no plural subject. Bob's anger is unjustified if no joint commitment was formed.
      *   *Wait, let's sharpen the asymmetry.* The prompt asks for "asymmetric attitudes."
      *   *Revised Vignette:* **The Silent Duet.** Two musicians, Elena and Marcus, play a duet. They have rehearsed. Elena views it as "expressing our shared art." Marcus views it as "getting paid to play my part alongside her." They perform successfully. Mid-concert, Marcus leaves early because his paid time is up. Elena feels betrayed.
      *   *Analysis:*
          *   Bratman: Shared intention exists (interlocking intentions to play the duet). Marcus's reason (money vs. art) doesn't necessarily negate the shared intention *unless* it disrupts meshing subplans. But his leaving violates the stability required for shared intention.
          *   Searle: Both have we-intentions? Marcus might only have an I-intention that coincides. If Marcus lacks the "we" mode, Searle says no joint action.
          *   Gilbert: Was there a joint commitment? If they just showed up, maybe not. If they agreed to play, yes. The key is the *obligation*. Elena's feeling of betrayal implies she thinks there was an obligation. Gilbert would ask: Was the commitment common knowledge?

      *   *Decision:* Let's go with a **Spontaneous Coordination** case that looks like joint action but lacks the normative glue. **The Heavy Box.**
      *   *Scenario:* Two strangers, Liam and Noah, see a heavy box blocking a ramp. Liam grabs one side, Noah grabs the other. They lift it together smoothly. Liam thinks, "We are moving this." Noah thinks, "I am helping this guy move his load." They set it down. Liam expects Noah to help move a second box. Noah walks away. Liam is annoyed/feels let down.
      *   *Why:*
          *   Bratman: Likely counts as joint action (interlocking intentions, mutual knowledge, meshing subplans during the lift).
          *   Searle: Counts if Noah has a we-intention. If Noah thinks "I am helping him," does that count as a we-intention? Searle requires the "we" mode. If Noah lacks it, it's not joint action.
          *   Gilbert: Likely *not* joint action. No expression of joint commitment. No normative obligation to help with the second box. Liam's annoyance is misplaced.
      *   *This exposes the Individualism (Bratman/Searle) vs. Normativity (Gilbert) split perfectly.*

  4.  **Drafting the Content:**

      *   **Question:** Needs to be precise. Ask for application, divergence, and evaluation.
      *   **Model Answer:** Needs to hit the "bottoming out" points. Bratman bottoms out in planning consistency. Searle in psychological primitives. Gilbert in normative obligations. The argument should favor Gilbert for capturing the *obligation* aspect (Liam's annoyance), or Bratman for capturing the *coordination* aspect. I will argue for Gilbert because the vignette hinges on the *normative expectation* (the second box).
      *   **Marking Scheme:** 25 marks total. 5 marks per criterion. Clear distinction between A (insightful, precise) and B (correct but superficial).

  5.  **Refining the Model Answer (Self-Correction during drafting):**
      *   *Check:* Did I accurately represent Bratman? Bratman does allow for some normativity (mutual obligation arises from reliance), but it's weaker than Gilbert's. I need to make sure the model answer reflects this nuance. Bratman's normativity is based on the norms of planning agency (consistency, stability), whereas Gilbert's is deontic (rights/obligations).
      *   *Check:* Searle. Searle is often criticized for being too individualistic. The model answer should note that for Searle, if Noah lacks the "we-mode," it's not joint action, even if it looks like it.
      *   *Check:* Gilbert. She requires a "pooling of wills." In the spontaneous box case, this is missing.
      *   *Argument:* Why is Gilbert best? Because it explains the *asymmetry of expectation*. Liam feels owed; Noah feels free. Gilbert explains this as a failure to establish the plural subject. Bratman might say they *were* a group for the first box, so why not the second? Gilbert explains the boundary better.

  6.  **Final Review against Constraints:**
      *   Retired neuroscientist audience (needs rigor, no fluff).
      *   Upper-level undergrad (accessible but deep).
      *   Word count for answer (~800).
      *   Marking scheme (25 marks, 5 criteria).

  7.  **Final Polish:** Ensure the tone is academic and the philosophical terminology is precise (e.g., "interlocking intentions," "we-mode," "plural subject").

  *(Self-Correction on Vignette)*: The "Heavy Box" is good, but let's make sure the asymmetry is clear in the text. Liam intends "We move this." Noah intends "I help him." This targets Searle specifically. For Gilbert, the lack of explicit agreement targets the joint commitment. For Bratman, the meshing subplans exist temporarily. This works.

  Let's write.
answer: |-
  ### 1. The Essay Question

  **Question 4: The Case of the Spontaneous Lift (25 Marks)**

  Read the following vignette carefully:

  > Liam and Noah are strangers waiting at a train station. A large, heavy crate slides off a luggage cart, blocking the wheelchair ramp. Liam immediately grabs one handle; seeing this, Noah grabs the other. Without speaking, they lift the crate in perfect synchrony and move it to the side. During the lift, Liam thinks, "We are clearing this ramp." Noah thinks, "I am helping this stranger clear the ramp." Once the crate is moved, Liam nods at Noah and gestures toward a second, smaller bag nearby, expecting Noah to help move that too. Noah, feeling he has done his good deed, turns and walks away. Liam feels annoyed, believing Noah was *obligated* to help further given their successful coordination.

  Write an essay analyzing this case through the frameworks of **Michael Bratman**, **John Searle**, and **Margaret Gilbert**. Your essay must:
  1.  Determine whether Liam and Noah engaged in genuine joint action according to each theorist.
  2.  Explain *why* the accounts yield these verdicts by referencing the specific structural conditions of each theory (e.g., interlocking intentions, we-mode, joint commitment).
  3.  Argue for which account best captures the normative asymmetry in the vignette (specifically, Liam's expectation of obligation vs. Noah's freedom to leave).

  ***

  ### 2. Model Answer

  **Title:** Normativity and Structure in Spontaneous Coordination

  The vignette of Liam and Noah presents a case of high-fidelity behavioral coordination that lacks explicit agreement. It tests whether joint action requires merely interlocking psychological states or a robust normative bond. While Bratman and Searle focus on the cognitive architecture of the participants, Gilbert focuses on the deontic structure created between them. Analyzing the "Spontaneous Lift" reveals that only Gilbert's account adequately explains the asymmetry of obligation felt by Liam.

  For **Michael Bratman**, shared intention is a web of interlocking individual intentions. The conditions require that (1) I intend that we J, (2) you intend that we J, and (3) this is common knowledge, alongside meshing subplans and a commitment to mutual support. In the vignette, Liam satisfies condition (1): he intends "We are clearing this ramp." However, Noah fails condition (2). Noah's thought is "I am helping this stranger," which is an *I-intention* regarding his own contribution, not necessarily a shared intention regarding the joint activity. Bratman requires the content of the intention to be "that we J." If Noah lacks the conceptual grasp of the "we," Bratman's reductive analysis stalls. Even if we charitably interpret Noah's help as implying an intention that they succeed together, Bratman's account grounds normativity in the stability of individual planning. Liam's annoyance at Noah's departure would stem from a violation of the norm of stability required for planning agency. However, since there was no prior plan to move the *second* bag, Bratman struggles to ground an obligation for future action based solely on a momentary coordination.

  **John Searle's** account turns on the primitive nature of the "we-intention." For Searle, joint action exists if the individuals have we-intentions in their heads, causally leading to the action. Unlike Bratman, Searle does not require the intention to be analyzed into interlocking *I-intentions*; the "we" is irreducible. In the vignette, Liam clearly possesses a we-intention. Noah, however, explicitly thinks in terms of "I am helping." For Searle, the mode of the intention is crucial. If Noah lacks the we-mode, there is no collective intentionality, regardless of the behavioral synchrony. Thus, Searle would likely verdict that no joint action occurred, or at best, that it was a fractured case where only one participant was in the collective mode. Searle's account explains the psychological disconnect but, like Bratman, fails to account for the *normative* force of Liam's expectation. Searle's ontology is individualistic; obligations are not constitutive of the we-intention itself but are external social facts.

  **Margaret Gilbert's** theory of joint commitment offers the sharpest distinction. For Gilbert, joint action requires a "plural subject" created by a joint commitment. This commitment arises when parties express readiness to be bound together in a goal, and this is common knowledge. Crucially, this creates *sui generis* obligations: each party is obligated to the other to fulfill the commitment. In the vignette, there was no expression of readiness to be bound. It was a spontaneous, non-verbal coordination. Therefore, Gilbert would argue no joint commitment was formed, and thus no plural subject existed. Consequently, Noah had no obligation to help with the second bag. Gilbert's account uniquely validates Liam's feeling of betrayal as a *misplaced* normative expectation. Liam mistakenly inferred a joint commitment from behavioral meshing. Gilbert explains why Liam feels obligated (he assumes a plural subject) while explaining why Noah is actually free (no commitment was pooled).

  **Evaluation:**
  Gilbert's account handles the vignette best. The crux of the case is not merely whether they coordinated (they did), but whether that coordination generated normative expectations. Bratman and Searle focus on the *conditions of action*, treating normativity as a byproduct of psychological consistency or social context. Gilbert treats normativity as *constitutive*. The vignette highlights a gap between behavioral coordination and normative binding. Liam's annoyance reveals a human tendency to infer Gilbertian commitments from Bratmanian coordination. However, philosophically, Gilbert is correct to deny the obligation. If joint action entails obligation, and Noah never agreed to be bound, then calling it "joint action" in the robust sense is incorrect. Gilbert preserves the distinction between mere parallel action with coordination (which this is) and genuine joint action (which requires the pooling of wills). Therefore, Gilbert provides the most rigorous framework for distinguishing the sociological reality of the lift from the normative absence of a contract.

  ***

  ### 3. Marking Scheme (25 Marks Total)

  | Criterion | Marks | A-Level Performance (20–25) | B-Level Performance (15–19) |
  | :--- | :---: | :--- | :--- |
  | **(i) Reconstruction of Accounts** | 5 | Accurately identifies the core structural conditions for all three theorists (Bratman's interlocking intentions, Searle's primitive we-mode, Gilbert's joint commitment/obligation). Distinguishes reductive vs. non-reductive ontologies. | Correctly summarizes the three accounts but may blur distinctions (e.g., treating Bratman and Searle as identical individualists) or miss key conditions (e.g., omitting "meshing subplans" or "expression of readiness"). |
  | **(ii) Application to Vignette** | 5 | Applies conditions precisely to Liam and Noah's specific mental states. Notes Noah's "I-intention" vs. Liam's "We-intention." Correctly predicts verdicts (e.g., Gilbert = No Joint Action). | Applies theories generally but misses the specific asymmetry in the vignette. May claim all three agree it is joint action, or fails to notice Noah's lack of "we" thought undermines Searle/Bratman. |
  | **(iii) Identification of Theoretical Disagreement** | 5 | Identifies the core pressure point: the relationship between *coordination* and *normativity*. Explains that Bratman/Searle bottom out in psychology, while Gilbert bottoms out in deontic relations. | Identifies that the theorists disagree but describes it superficially (e.g., "they have different definitions") without locating the structural source of the disagreement (individualism vs. normativity). |
  | **(iv) Argumentative Quality** | 5 | Offers a reasoned, non-question-begging argument for one account. Justifies the choice based on how well the theory explains the *normative asymmetry* (Liam's annoyance vs. Noah's freedom). | Argues for a preferred account but relies on assertion or preference (e.g., "Gilbert is best because she is more detailed") rather than philosophical fit with the case's specific problem. |
  | **(v) Clarity and Precision** | 5 | Writing is concise, terminology is used rigorously (e.g., "plural subject," "common knowledge," "reductive"), and the essay is well-structured. | Writing is clear but may use loose terminology or suffer from organizational issues that obscure the philosophical analysis. |

  **Total: 25 Marks**
