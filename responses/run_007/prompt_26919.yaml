  *(Deep Dive on the Logic):*
  Let $S$ be the statement: "Exam on day $d$ AND you don't know $d$ the night before."
  Students assume $K(S)$.
  If $K(S)$, then $S$ is true.
  If $S$ is true, Exam $\neq$ Friday (as per Step 2).
  So students know Exam $\neq$ Friday.
  Now consider Thursday. If Exam = Thursday, do they know it on Wednesday night?
  They know Exam $\in \{Mon, Thu\}$.
  If they assume $K(S)$ still holds, they deduce Exam $\neq$ Thursday.
  But wait. If they deduce Exam $\neq$ Friday, does $S$ remain true?
  $S$ says "You won't know." If they *do* know (via deduction), $S$ is false.
  So they cannot *know* $S$ is true. They can only *believe* it.
  If they only believe it, the deduction fails.
  Therefore, Step (3) fails because it assumes $K(S)$ persists after the first deduction.
