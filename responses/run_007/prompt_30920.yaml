              *   *Okay, they know their type.*
              *   Gold: Signal Cost = 2.
              *   Silver: Signal Cost = 8.
              *   Reward = 10.
              *   Round 1: Cost is 2 for *everyone*. (Pooling).
              *   Round 2: Cost is 2 for Gold, 8 for Silver. (Separating).
              *   *How to enforce hidden costs?* Envelopes.
              *   Each Proposer gets an envelope with their "Cost Card."
              *   Round 1: All cards say "Cost: 2".
              *   Round 2: Gold cards say "Cost: 2". Silver cards say "Cost: 8".
