      3.  *Deflationism:* Truth is disquotational; moral sentences are truth-apt without descriptivism.
      4.  *Motivational Internalism:* Sincere judgment $\rightarrow$ motivation (necessary connection).
      5.  *Quasi-realism:* Earn the right to talk of facts/truth/knowledge within expressivism.
      6.  *Attitude-based Validity:* Validity = incoherence of attitudes (accepting premises + rejecting conclusion).
      7.  *Higher-order Attitudes (H.O.A.) for Embedding:* Solves Frege-Geach by positing attitudes toward attitudes for embedded contexts (e.g., conditionals express disapproval of inconsistent attitudes).

  3.  **Step-by-Step Interaction Analysis (Brainstorming):**

      *   *1 (Expressivism) & 2 (Compositionality):* Standard expressivism struggles here. If "wrong" expresses an attitude in "Lying is wrong," what does it express in "If lying is wrong..."? Commitment 7 tries to solve this. Tension: Can standard compositionality hold if the semantic value shifts from attitude-expression (asserted) to attitude-towards-attitude (embedded)?
      *   *1 (Expressivism) & 3 (Deflationism):* Classic alliance. Deflationism allows expressivists to say "It is true that P" just means "P". Tension: Does deflationism *really* solve the problem of truth-aptitude if the underlying semantics is non-cognitive? (Blackburn's worry vs. Gibbard's).
      *   *1 (Expressivism) & 4 (Internalism):* Classic alliance. Expressivism explains internalism naturally (judgment *is* an attitude). Tension: Internalism is often stated about *judgment/belief*. If expressivism denies moral judgments are beliefs, does Internalism need rephrasing?
      *   *1 (Expressivism) & 5 (Quasi-realism):* Quasi-realism is the project of making 1 look like realism. Tension: Is it a distinct commitment or just the goal of 1+3+6+7?
      *   *2 (Compositionality) & 7 (H.O.A. for Embedding):* **CRITICAL.** Standard compositionality requires a term to have the *same* semantic contribution in all contexts. Commitment 7 says "wrong" in asserted context expresses $A$, but in conditional context contributes to expressing $B$ (attitude toward combination). This looks like a violation of strict compositionality (the "negation problem" or "embedding problem").
      *   *3 (Deflationism) & 6 (Attitude-based Validity):* Deflationism says truth is logical. Validity is truth-preservation. If validity is attitude-incoherence (6), does that clash with truth-preservation (3)? Expressivists usually argue they coincide, but the *explanation* differs.
      *   *4 (Internalism) & 5 (Quasi-realism):* Quasi-realism wants to mimic realism. Realism often allows externalism (judgment without motivation). If Internalism is necessary (4), can Quasi-realism fully mimic realist discourse where people say "He knows it's wrong but doesn't care"?
      *   *6 (Attitude-based Validity) & 7 (H.O.A.):* 7 explains *why* 6 holds. They are tightly coupled. Tension: Does the specific H.O.A. theory (e.g., Blackburn's or Gibbard's) actually deliver the validity conditions required by 6 without explosion or collapse?
      *   *3 (Deflationism) & 7 (H.O.A.):* If truth is just disquotation, why do we need complex H.O.A. semantics for embedding? Deflationism suggests logic works trivially. H.O.A. suggests logic works via psychological consistency. Are these compatible explanations?

  4.  **Identifying Genuine Tensions (Filtering):**

      *   *Apparent:* 1 & 3 (Expressivism + Deflationism is the standard "Quasi-realist" move). 1 & 4 (Expressivism is usually motivated by Internalism). 1 & 5 (Quasi-realism is the label for the successful execution of 1).
      *   *Genuine:*
