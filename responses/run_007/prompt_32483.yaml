  5.  **Ranking Tensions by Severity:**

      *   *Severity 1 (Fatal/Critical):* 2 vs. 7. The "Negation Problem" / Compositionality constraint. If meaning is compositional, "wrong" must contribute the same thing to "Lying is wrong" and "If lying is wrong...". Commitment 7 explicitly posits different semantic roles (expression of attitude vs. expression of higher-order attitude). This is the technical heart of the Frege-Geach problem.
      *   *Severity 2 (Substantial/Theoretical Cost):* 4 vs. 5. The "Amoralist" problem. If you are a quasi-realist, you must be able to make sense of realist discourse *including* their mistakes. If realists think amoralism is possible, and you think it's impossible, can you still say they are talking about the same thing?
      *   *Severity 3 (Explanatory/Integration):* 3 vs. 6. Truth vs. Consistency. Needs a bridge principle.
      *   *Severity 4 (Manageable):* 1 vs. 3. Deflationary truth-aptitude is standard fare for modern expressivists (Gibbard/Blackburn).

  6.  **Drafting the Audit (incorporating the "Professional Philosopher" persona):**

