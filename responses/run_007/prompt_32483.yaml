          *   *Conflict 2: Internalism (4) vs. Quasi-realism (5).* Mechanism: Discursive competence regarding amoralists. Cost: Weaken Internalism to *conceptual* possibility of amoralism or restrict Quasi-realism's mimetic scope.
          *   *Conflict 3: Deflationism (3) vs. Attitude-Validity (6).* Mechanism: Logic defined by truth vs. logic defined by psychology. Cost: Adopt a hybrid logic or argue truth-preservation supervenes on attitude consistency.
      *   *Section 3: Verdict (c).* Is it tenable? Yes, but 7 is doing too much heavy lifting against 2. 4 is potentially too rigid for 5.
      *   *Refinement:* Ensure I distinguish between *blackburnian* projectivism and *gibbardian* norm-expressivism where relevant, as Commitment 7 sounds very Blackburnian (attitudes toward attitudes), while Commitment 3 sounds Gibbardian (truth-aptitude). The mix might be the source of friction.

  7.  **Self-Correction/Refinement during drafting:**
