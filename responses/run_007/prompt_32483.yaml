          *   **3 (Deflationism) vs. 6 (Attitude-based Validity):** Deflationism implies validity is truth-preservation. Expressivism implies validity is attitude-consistency. Bridging these requires a story about why truth-preservation *just is* attitude-consistency in this domain.
