          *   *Prediction A:* Agrees it vanishes, but argues this proves EUT is sensitive to boundary conditions that shouldn't matter for small $a$.
      *   *Case 2: The Improper Prior Limit.* Consider a sequence of proper priors converging to a uniform improper prior.
          *   *Prediction B:* The expectation $E[B|A=a]$ converges to $a$ (indifference), not $1.25a$.
