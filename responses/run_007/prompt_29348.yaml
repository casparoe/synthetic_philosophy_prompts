          *   *Question:* As $N \to \infty$, does the conditional expectation $E[B|A=a]$ approach $1.25a$ or $a$?
          *   *Friend A Prediction:* It approaches $1.25a$ for any fixed $a$ as $N$ grows, demonstrating the intuition is robust even if the limit is improper.
          *   *Friend B Prediction:* It approaches $a$ (or remains undefined at the limit), demonstrating the $1.25a$ calculation is an artifact of truncation error, not a valid expectation.

  7.  **Drafting Section 5: Semantic Disputes:**
