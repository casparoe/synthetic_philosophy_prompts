prompt: |-
  I've spent the last month refereeing an argument between two friends in my probability-and-philosophy reading group about the two-envelope paradox, and it's become personal because I'm the one who has to present the thing next week. One of them thinks the paradox shows there's something genuinely broken in expected-value reasoning when the distribution over the amounts is left unspecified — the always-switch argument is a real decision-theoretic problem, and you need to restrict dominance or expected utility somehow to avoid it. The other thinks it's purely a modeling mistake: the step that says the other envelope is equally likely to be double or half is an illicit uniform prior, and once you write down any proper prior the always-switch argument collapses, with no revision of decision theory needed. Could you draft the joint statement that an adversarial collaboration between those two camps would produce? I'd like: a numbered list of claims both could sign about the paradox and about where the naive switching argument goes wrong; then a disagreements table with the residual disagreement stated in wording each side would accept for itself; then the cruxes — the sub-questions that would actually move at least one of them; and for each crux, a concrete case or argument both would agree bears on it, with each side's prediction written down in advance. If part of their fight is really about words, say wether and which part.
