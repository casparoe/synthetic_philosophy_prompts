  2.  **Deconstruct the Two-Envelope Paradox (TEP):**
      *   *Setup:* Two envelopes, one contains $X$, the other $2X$. You pick one (A). The other is B.
      *   *Naive Argument:* Let $A$ contain amount $a$. $B$ is either $2a$ or $a/2$ with probability $1/2$ each. $E[B] = 0.5(2a) + 0.5(a/2) = 1.25a$. Since $1.25a > a$, switch. But by symmetry, you should switch back. Contradiction.
      *   *Resolution Consensus (Standard):* The step assigning probability $1/2$ to $2a$ and $a/2$ *conditional on observing $a$* is generally invalid for all $a$ simultaneously unless the prior distribution is improper (uniform over positive reals). With a proper prior, $P(B=2a | A=a) \neq 1/2$ generally.
      *   *The Deep Dispute:* Does this resolution require *only* fixing the probability model (Friend B), or does it suggest that EV maximization is dangerous when priors are vague/improper (Friend A)?

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to acknowledge the naive calculation is wrong.
      *   Need to acknowledge the role of the prior.
      *   Need to acknowledge that symmetry implies indifference *before* opening.
      *   Need to acknowledge that "always switch" is impossible.
      *   *Drafting points:*
          1.  The naive expectation calculation ($1.25a$) assumes a specific conditional probability ($1/2$) that cannot hold for all possible values of $a$ under a proper probability distribution.
          2.  Before opening the envelope, symmetry dictates indifference; there is no rational basis to prefer one envelope over the other ex-ante.
          3.  The "always switch" strategy leads to a contradiction (infinite switching) and is therefore irrational.
          4.  Resolving the paradox requires analyzing the underlying probability distribution of the money amounts.
          5.  Standard Expected Utility Theory (EUT) yields consistent results *if* a proper prior distribution is fully specified.

  4.  **Drafting Section 2: Disagreements Table (The Residual Fight):**
      *   *Friend A (DT Skeptic):* Focuses on the *unspecified* case. If the problem doesn't give a prior, EUT gives the wrong answer (switch). Therefore, EUT needs a caveat for "ignorance" cases.
      *   *Friend B (Modeling Purist):* Focuses on the *specified* case. The problem *must* have a prior to be well-posed. If it's not given, the problem is ill-posed, not the theory. EUT is fine; the user input was bad.
      *   *Phrasing:* Needs to be neutral.
      *   *Row 1: Diagnosis.* A: Defect in applying EUT to ignorance. B: Defect in problem formulation.
      *   *Row 2: Remedy.* A: Restrict EUT/Dominance. B: Enforce Proper Priors.
      *   *Row 3: Improper Priors.* A: Sometimes useful but break EUT. B: Mathematically inadmissible for decision making.

  5.  **Drafting Section 3: Cruxes (Moving the Needle):**
