answer: |-
  Colleagues, it is a pleasure to engage with this module design. You have identified the precise tension that makes moral luck so fertile for legal theory: the gap between the metaphysical vulnerability of responsibility and the doctrinal necessity of it. As someone who has spent decades watching philosophers debate Nagel and Williams while legislators draft sentencing guidelines, I offer the following ranking.

  My ranking is determined by four criteria: (1) the **magnitude of the injustice** (how deeply it offends our intuitive sense of fairness); (2) the **tractability of reform** (can a legislature actually write this?); (3) the **risk of unintended consequences** (does the cure kill the patient?); and (4) **doctrinal destabilization** (how many existing rules must be torn up to accommodate the change?).

  Here is the ranking of the four types of moral luck by their practical weight for criminal law reform, from highest to lowest.

  ### 1. Resultant Luck (The Luck of Outcomes)
  **Rank:** First (Highest Practical Weight)
  **Concrete Legal Change:** Abolish the sentencing differential between attempted and completed crimes (e.g., punish attempted murder the same as completed murder).

  **Defense of Ranking:**
  This is the only type of moral luck that offers a clean, high-impact, and legally tractable target. The injustice is visceral: two actors exhibit identical *mens rea* and identical conduct up to the final moment, yet one receives a life sentence and the other ten years because a bird flew in front of the bullet or the victim wore a vest. This violates the retributive principle that punishment should track culpability, not chance.

  *   **Tractability:** High. A legislature can amend sentencing statutes tomorrow to grade attempts at the same level as completions (a move the Model Penal Code gestures toward but doesn't fully embrace).
  *   **Destabilization:** Moderate. It requires reclassifying homicide offenses and adjusting sentencing grids, but it does not threaten the concept of responsibility itself.
  *   **Unintended Consequences:** Low. Critics argue this ignores the harm done to victims, but if punishment is about desert, harm is often a matter of luck.
  *   **Why #1:** It addresses a clear doctrinal inconsistency without collapsing the system. It is the "low-hanging fruit" of moral luck reform.

  ### 2. Constitutive Luck (The Luck of Character)
  **Rank:** Second
  **Concrete Legal Change:** Mandate "background principle" mitigation in sentencing guidelines for defendants with demonstrable disadvantages in character formation (e.g., childhood trauma, neurocognitive deficits, systemic deprivation).

  **Defense of Ranking:**
  Constitutive luck strikes at the idea that we choose our dispositions. If I am impulsive due to genetics or upbringing, is my crime fully "mine"? The law currently treats this as discretionary mitigation. Taking it seriously would make it structural.

  *   **Tractability:** Medium. We already allow mitigation evidence; the reform is making it mandatory and systematic rather than leaving it to judicial discretion.
  *   **Destabilization:** High-Moderate. It risks eroding the presumption of agency. If we mitigate too heavily for character, we risk implying the defendant wasn't responsible at all.
  *   **Unintended Consequences:** There is a risk of paternalism or stigmatization (labeling certain backgrounds as "defective"). However, modern "trauma-informed" sentencing trends suggest this is already happening organically.
  *   **Why #2:** It is highly relevant to modern sentencing debates, but it is ranked below Resultant Luck because the law already has mechanisms to handle it (mitigation), whereas the attempt/completion gap is a hard statutory bar.

  ### 3. Circumstantial Luck (The Luck of Situation)
  **Rank:** Third
  **Concrete Legal Change:** Expand the defense of "necessity" or "duress" to account for systemic coercive circumstances, or conversely, restrict liability for omissions where the defendant lacked the situational capacity to act.

  **Defense of Ranking:**
  This concerns the situations we find ourselves in (e.g., the corrupt official vs. the citizen who never had the chance to be corrupt). The injustice is significant, but the legal translation is messy. The law requires an *actus reus*; you generally cannot punish someone for a crime they lacked the circumstance to commit, nor can you easily punish everyone less because their circumstances were tempting.

  *   **Tractability:** Low. It is difficult to legislate "equal opportunity to be good." Reforms here tend to be vague standards rather than clear rules.
  *   **Destabilization:** High. Aggressive reform here threatens the act requirement. If we excuse too much based on circumstance, we excuse almost everything.
  *   **Unintended Consequences:** High. Broadening circumstantial defenses could create loopholes for organized crime or systemic corruption ("I was just in a corrupt system").
  *   **Why #3:** The philosophical problem is profound (the "Nazi Germany" problem), but the legislative toolset is blunt. We can tweak defenses, but we cannot legislate away situational inequality.

  ### 4. Causal Luck (The Luck of Determinism)
  **Rank:** Fourth (Lowest Practical Weight)
  **Concrete Legal Change:** Replace retributive sentencing with a preventive "quarantine" or public-health model of detention.

  **Defense of Ranking:**
  Causal luck argues that prior causes determine our actions, negating free will. If a legislature took this *fully* seriously, they would abolish retributivism. However, I rank this last for *reform* purposes because it is a category error for a legislature.

  *   **Tractability:** Near Zero. A legislature cannot legislate against causation.
  *   **Destabilization:** Total. This does not reform the criminal law; it abolishes it and replaces it with civil confinement.
  *   **Unintended Consequences:** Extreme. A preventive model risks indefinite detention without desert, potentially violating more rights than it protects.
  *   **Why #4:** While philosophically fundamental, it offers no *practicable* roadmap for a legislature operating within a constitutional framework that presupposes agency. It is a theoretical limit, not a policy prescription.

  ### Flags on Overrated Implications

  I must flag **Causal Luck** as significantly overrated in the context of *legislative reform*. Philosophers often treat the threat of determinism as an urgent call to dismantle retributivism. However, the law operates on a "compatibilist" or practical notion of freedom that functions regardless of metaphysical truth. A legislature cannot wait for physics to solve the free will problem. Pushing this reform is not just impractical; it is dangerous, as it invites preventive detention models that lack the moral constraints of desert.

  I would also flag a specific interpretation of **Constitutive Luck**. Some argue that because character is unchosen, responsibility is impossible. This is overrated. The legal upshot is not the abolition of responsibility, but the refinement of *mitigation*. The argument that constitutive luck destroys responsibility entirely is philosophically sound but legally inert; the argument that it requires *graded* responsibility is where the real reform lies.

  ### Pedagogical Recommendation
  For your seminar, I recommend structuring the three weeks to mirror this ranking. Start with **Resultant Luck** (Week 1) because it gives students immediate doctrinal traction (Attempts). Move to **Constitutive/Circumstantial** (Week 2) to explore sentencing and defenses. End with **Causal Luck** (Week 3) as a "horizon problem" to show the limits of legal theory, ensuring they understand why we don't actually abolish the system based on it.

  \answer{Resultant luck carries the most practical weight for reform because it targets a specific, tractable doctrinal inconsistency (attempt vs. completion) without destabilizing the foundational concept of agency required for the legal system to function.}
