answer: |-
  1. The disagreement restated

  Common priorists, following Aumann and Harsanyi, argue the Common Prior Assumption (CPA) is a rationality requirement. They contend that if agents share common knowledge of their belief-forming mechanisms and the state space is exhaustive, differing priors imply irrationality or missing information. This "Harsanyi doctrine" ensures *ex ante* efficiency and underwrites no-trade theorems; disagreement is purely informational. Divergent priors signal a modeler error, where information asymmetry has been omitted from the state space.

  Subjectivists counter that priors are personal degrees of belief constrained only by coherence. They view CPA as a substantive empirical claim that falsely eliminates legitimate disagreement stemming from different experiences or interpretations. For them, imposing CPA rules out speculative trade by fiat rather than derivation, ignoring how real agents form beliefs.

  A third group, the conventionalists, argue CPA is a modeling choice: any non-common prior model can be redescribed as a common prior model on a richer state space. For them, the assumption is neither true nor false but pragmatic, shifting the debate to tractability and transparency rather than normative force. The disagreement centers on whether CPA is a norm, an empirical hypothesis, or a convention.

  2. Candidate diagnoses

  Candidate 1: Verbal Dispute over "Rationality." One side defines rationality as interpersonal consistency (Aumann), the other as internal coherence (Subjectivists). This fits the normative rhetoric but fails to explain why the formal consequences (like no-trade) remain contested despite agreed mathematics. If it were merely verbal, the modeling implications wouldn't carry such weight. The stakes involve market efficiency, not just definitions.

  Candidate 2: Different Questions (Normative vs. Descriptive). Economists seek predictive tractability; epistemologists seek belief norms. This fits well with the divergence in goals. Common priorists want clean equilibrium concepts; subjectivists want accurate belief representation. However, both sides claim to address rationality, suggesting overlap rather than distinct inquiries. The freeze persists because both claim authority over the same conceptual space.

  Candidate 3: Hidden Formal Question (State Space Completeness). Is the state space logically exhaustive? If yes, CPA is tautological (Side C's view). If no, CPA is substantive (Side B's view). This fits best. It explains why Common Priorists insist on expanding the state space to absorb prior differences, while Subjectivists resist infinite regress. The disagreement hinges on whether "information" can exhaustively explain all belief variance. This captures the technical core of the impasse better than the others.

  3. My diagnosis

  My diagnosis is that the impasse is primarily methodological, rooted in Candidate 3 (State Space Completeness) but driven by Candidate 2 (Different Questions). The genuine disagreement is not about the mathematics but about the *cost* of the redescription required to save CPA. Common Priorists treat the state space as a logical container where all uncertainty must be reduced to information partitions. This makes CPA a tautology of model construction but risks making the model empirically vacuous. Subjectivists treat the state space as empirically bounded; thus, CPA is a false restriction on belief diversity.

  The "verbal" element is real but secondary. The core friction is whether models should prioritize *ex ante* normative ideals (efficiency, no-trade) or *ex post* descriptive fidelity (persistent disagreement). The Common Priorist demands we explain disagreement via information; the Subjectivist allows disagreement as a primitive. This is a genuine divide in explanatory standards. The conventionalists are formally correct but pragmatically naive: redescribing a model to fit CPA often obscures the psychological mechanisms of belief formation. Thus, the debate persists because each side values different theoretical virtues: parsimony of priors versus richness of psychological description. The Common Priorist sacrifices descriptive nuance for normative cleanliness; the Subjectivist sacrifices normative unity for descriptive accuracy. Neither is formally wrong, but they are building different kinds of theories.

  4. What would count as progress

  Progress requires shifting from truth-claims to utility-claims. We need formal results quantifying the complexity cost of redescribing non-CPA models as CPA models. If the state space becomes computationally intractable to save CPA, the assumption loses pragmatic value. Empirically, experiments on belief convergence could test whether real agents behave as if they share priors when information is shared. However, given the diagnosis, the most productive move is distinguishing contexts: CPA for mechanism design (where *ex ante* rules matter) versus subjective priors for asset pricing (where speculation is observed). Accepting pluralism based on modeling purpose would dissolve the normative tension. We should stop asking if CPA is "true" and ask where it is "useful." A formal taxonomy of models where CPA leads to robust predictions versus those where it fails would replace the philosophical stalemate with technical guidance. Complexity penalties on state-space richness could formally adjudicate when the redescription is too costly to be useful.

  5. Residual uncertainty

  My diagnosis is fragile regarding the normative strength of the Common Priorist claim. If logical omniscience is a valid rationality requirement, CPA might be more than a modeling convention. I would change my mind if a robust derivation showed that non-common priors inevitably lead to dynamic inconsistency or Dutch books in interactive settings, beyond simple coherence. Additionally, if the "richer state space" move can be shown to preserve psychological realism without complexity costs, the Subjectivist position weakens. The possibility remains that there is a deeper coherence constraint in interactive reasoning we haven't formalized yet.
