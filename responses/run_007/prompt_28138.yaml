  For any sequence, finite and observed,
  Infinitely many laws fit to the fact.
  No unique path is strictly preserved
  By evidence alone, or deductive act.
  Since countless hypotheses agree
  With all the bits that we have seen so far,
  Evidence lacks necessity to be
  The guide that picks the true and hidden star.

  Measure simplicity by program's length,
  Prior is two to negative that cost.
  Though machine choice shifts complexity strength,
  Invariance bounds the shift; no truth is lost.
  In limit optimal, truth's slow convergence,
  Uncomputable prior, constant's divergence.

