      *   (4) Fixity of the Past. (This is the lever).
      *   The inference from (3) + (4) to (5) is where the equivocation lies.
      *   Specifically, the principle: "If it was true that $p$, then $p$ is unpreventable." This relies on the *Principle of the Necessity of the Past*. But does "It was true that $p$" count as a necessary past fact?
      *   If $S$ is contingent, then "It was true that $S$" is also contingent, even if located in the past.
