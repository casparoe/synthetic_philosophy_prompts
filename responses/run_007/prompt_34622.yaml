prompt: |-
  I have come to hold the following view: that for any consequential forecasting or planning decision, the outside view — anchoring on the distribution of outcomes in a reference class of sufficiently similar past cases — should be one's default epistemic stance, and departures from it toward the inside view (with its case-specific narratives, plans, and details) require a positive justification that the present case is a relevant exception to the base rate. This is not merely the claim that the outside view is a useful corrective to be consulted alongside the inside view; it is the claim that the outside view gets presumptive weight, and that the inside view's track record of systematic overoptimism — from the planning fallacy to megaproject cost overruns to the forecasting literature — means the burden of proof falls on the inside view. I take this to be the central upshot of Kahneman and Tversky, of Bent Flyvbjerg's reference-class forecasting, and of Tetlock's finding that superforecasters are distinguished largely by their use of outside-view reasoning.

  I want to know what would count against this position. I am not asking for the standard objections I already know about (e.g., that reference classes are hard to select, that every case is unique in some respect). I want a map of what would actually have to be true for the position to be wrong, or at least importantly limited. Specifically:

  1. What empirical findings would undermine it? If a well-designed study found that inside-view forecasts outperformed reference-class forecasts in some identifiable domain, what features of that domain would matter — and are there any domains where this has arguably already been shown?

  2. What does the position commit me to in cases where no informative reference class exists — genuinely novel situations, one-off institutional decisions, the first attempt at something? Does the position have anything to say, or does it fall silent exactly where it is most needed?

  3. Is the position itself justified by inside-view reasoning? That is, when I cite the track record of the outside view, am I not making a case-specific argument from the details of that track record — which looks like an inside-view justification for the outside view? If so, is this a regress problem, a consistency problem, or neither?

  4. Has the position been qualified in ways that insulate it from falsification? For instance, if an outside-view forecast fails, one can always say the wrong reference class was chosen, or that the inside-view adjustment was mishandled. Is this a genuine unfalsifiability worry, or is it the ordinary imprecision of a heuristic that we accept because the alternative is worse?

  5. Are there decision-theoretic or ethical contexts where the outside view is the wrong stance even if it is more accurate — for instance, because adopting it undermines the motivation needed to attempt difficult things, or because it treats cases as mere instances of a class in a way that fails to respect what is distinctive about them?

  I want a committed response: take a definite position on each of these, and tell me which challenges you think should move a reasonable defender of the view and which should not. Keep it to no more than 1,000 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User's View:** The outside view (reference class forecasting) should be the *default* epistemic stance for consequential decisions. The inside view requires positive justification to override the base rate. This is stronger than saying "outside view is useful"; it's about presumptive weight and burden of proof.
      *   **Task:** Identify what would count against this position. Map out conditions under which the position is wrong or limited.
      *   **Specific Questions:**
          1.  Empirical findings undermining it (domains where inside view wins).
          2.  Novel situations/no reference class (does it fall silent?).
          3.  Self-justification (is the outside view justified by inside-view reasoning? Regress?).
          4.  Falsifiability (is it insulated from failure by tweaking reference classes?).
          5.  Ethical/Decision-theoretic contexts (accuracy vs. motivation/respect).
      *   **Constraint:** Committed response (take definite positions), keep under 1,000 words.

  2.  **Deconstruct the User's Position:**
      *   Core claim: Outside view = Default/Null Hypothesis. Inside view = Alternative Hypothesis requiring evidence.
      *   Basis: Planning fallacy, Flyvbjerg, Tetlock, Kahneman/Tversky.
      *   Strength: Strong prescriptive epistemology.

  3.  **Drafting Responses to Specific Questions:**

      *   *Q1: Empirical Undermining.*
          *   Need domains where inside view beats outside view.
          *   Candidate: Domains with high causal transparency and low noise. Chess, Go, certain engineering physics problems.
          *   Why? Because the "reference class" is less informative than the specific mechanics.
          *   Also: Domains where the agent *changes* the distribution (self-fulfilling/prophecies). If belief influences outcome, base rates might be misleadingly pessimistic.
          *   *Verdict:* This challenges the *universality* of the default. If causal mechanisms are known better than statistical regularities, inside view wins.

      *   *Q2: Novel Situations.*
          *   If no reference class exists, the outside view is silent.
          *   Does this matter? Yes, often the most consequential decisions are novel (e.g., first nuclear weapon, first AI).
          *   *Verdict:* The position fails here unless it expands "reference class" so broadly it becomes useless (e.g., "all projects"). If it falls silent, it cannot be the *universal* default. It must concede ground to inside view in novelty.

      *   *Q3: Self-Justification (Regress).*
          *   Is claiming "outside view works better" an inside-view claim? Yes, it's a specific argument about the world.
          *   Is this a problem? No, it's not a regress. It's a meta-level empirical claim.
          *   *Verdict:* Not a consistency problem. It's a stable equilibrium: Use outside view object-level because inside-view meta-analysis says so.

      *   *Q4: Falsifiability.*
          *   Risk: "You chose the wrong class."
          *   Mitigation: Pre-registration of reference classes.
          *   *Verdict:* It is vulnerable to unfalsifiability if not disciplined. But this is a implementation risk, not a theoretical flaw. However, if *every* failure is explained away by "wrong class," the heuristic loses predictive power.

      *   *Q5: Ethical/Decision-Theoretic.*
          *   Motivation: Believing you are exceptional might be necessary to succeed (e.g., startups, revolutions).
          *   Ethics: Treating unique human situations as statistics can be dehumanizing.
          *   *Verdict:* Yes, there are pragmatic and ethical costs. Accuracy isn't the only virtue.

  4.  **Synthesizing and Taking a Stand:**
      *   I need to be decisive.
      *   *Stance:* The user's position is robust but not universal. It fails in high-agency/novel contexts and risks unfalsifiability.
      *   *Word Count Check:* Keep it tight.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the strength of the view. It's the best general heuristic. But it's not absolute.
      *   *1. Empirical:* Inside view wins where causal mechanisms are transparent and deterministic (physics, engineering specs) vs. stochastic social systems. Also, where agency alters the base rate (self-fulfilling optimism). If a study showed experts beat base rates in *high-uncertainty* domains using inside details, that would kill the view. Currently, evidence favors outside view in stochastic domains, but not deterministic ones.
      *   *2. Novelty:* The position *does* fall silent on true novelty. This is a major limitation. If you force a reference class for something unique (e.g., "first AGI"), you get garbage-in-garbage-out. The view must concede that in true novelty, the inside view is the only tool, however flawed.
      *   *3. Regress:* Not a problem. It's a meta-claim. "Inside view fails historically" is an outside-view claim about forecasting itself. It's consistent.
      *   *4. Falsifiability:* This is the biggest risk. If "wrong reference class" is always the escape hatch, it's dogma. To be scientific, reference class selection rules must be pre-specified. Without this, it's unfalsifiable.
      *   *5. Ethics/Pragmatics:* Accuracy isn't everything. If outside-view pessimism prevents valuable risks (type II errors), it's normatively wrong. Also, respecting agency requires acknowledging the inside view sometimes.

  6.  **Refining the Argument (Self-Correction):**
      *   Make sure I answer "what would have to be true for the position to be wrong."
      *   For Q1: It would have to be true that detailed causal models outperform statistical baselines in high-noise environments.
      *   For Q2: It would have to be true that novelty is common enough to make the default useless often.
      *   For Q4: It would have to be true that practitioners systematically game the reference class selection.

  7.  **Final Polish:** Check tone (committed, analytical) and word count.

      *   *Drafting thought:* Ensure I don't just say "it's complicated." I need to say "Here is where it breaks."
      *   *Drafting thought:* On Q3, clarify that the justification is an outside view *of forecasting*, not an inside view of the specific case.
      *   *Drafting thought:* On Q5, emphasize the "self-fulfilling prophecy" aspect.

  8.  **Final Word Count Check:** Aiming for ~800-900 words to be safe.

      *(Self-Correction during drafting)*: I need to be careful with Q3. The user asks if citing the track record is inside-view reasoning. It's actually an outside view *of the forecasting process*. I should clarify that distinction.

      *(Self-Correction on Q1)*: Be specific about domains. Chess/Go are bad examples because they have perfect information. Better: Engineering where physics dominates statistics. Or domains where the "inside view" is actually a valid causal model.

      *(Self-Correction on Q2)*: If the view falls silent, is it wrong? It's limited. The prompt asks what would count against it. If it can't handle novelty, it's not a universal default.

      *(Self-Correction on Q4)*: This is the strongest critique. If reference class selection is subjective, the "objective" outside view is illusory.

      *(Self-Correction on Q5)*: Distinguish between epistemic accuracy and pragmatic utility.

      *Let's write.*
answer: |-
  Your position is epistemically robust for stochastic, social, and political domains, but it is not universal. Here is where it breaks.

  **1. Empirical Undermining**
  For your position to be wrong, it would have to be true that detailed causal models consistently outperform statistical baselines in high-noise environments. Currently, the inside view wins in domains where mechanisms are transparent and deterministic. If you are forecasting the load-bearing capacity of a bridge, the inside view (physics equations) trumps the outside view (how many past bridges collapsed). The outside view dominates where hidden variables and complexity obscure causality (politics, economics, construction).
  *Verdict:* A study showing inside-view superiority in *high-uncertainty* domains (e.g., geopolitical forecasting) using specific causal narratives would undermine your view. Tetlock's work suggests this is rare, but if AI-assisted causal modeling begins to beat base rates in stochastic domains, the outside view's presumptive weight evaporates.

  **2. Novelty and Silence**
  In cases of genuine novelty (e.g., the first deployment of superintelligent AI, a unique geopolitical rupture), no informative reference class exists. Your position either falls silent or forces a spurious analogy (e.g., "AGI is like nuclear weapons"). If it falls silent, it cannot be the *universal* default; it is merely a default for *routine* consequential decisions. If it forces analogies, it becomes vulnerable to the very inside-view biases it seeks to avoid, as selecting the analogy is itself an inside-view judgment.
  *Verdict:* This is a hard limit. You must concede that in true one-off scenarios, the outside view offers no guidance. The position is limited to recurrent or structurally similar events.

  **3. The Regress Problem**
  You ask if justifying the outside view via its track record is itself an inside-view argument. It is not. It is an outside view *of the forecasting process itself*. You are treating "forecasting instances" as the reference class. There is no regress here; it is a stable meta-level equilibrium. You use the outside view to evaluate the inside view's performance, and the result mandates using the outside view object-level.
  *Verdict:* This is not a consistency problem. The justification holds.

  **4. Falsifiability and Reference Class Selection**
  This is the greatest vulnerability. If every failure of an outside-view forecast can be explained away by claiming "the wrong reference class was chosen," the heuristic is unfalsifiable. Reference class selection is not algorithmic; it requires judgment. If practitioners can always tweak the class to match their desired outcome, the outside view becomes a camouflage for inside-view bias.
  *Verdict:* To avoid dogma, you must commit to pre-specified rules for reference class selection (e.g., "the narrowest class with at least N instances"). Without this discipline, the position is insulated from falsification in a way that renders it scientifically empty. A reasonable defender must accept that choosing the class is an inside-view act subject to error.

  **5. Ethical and Pragmatic Costs**
  There are contexts where accuracy is not the primary virtue.
  *Pragmatic:* In entrepreneurship or social movements, success often requires delusion. If agents adopt the outside view (e.g., "90% of startups fail"), they may not attempt the venture, ensuring the failure becomes self-fulfilling. Here, the inside view is instrumentally rational even if epistemically inferior.
  *Ethical:* Treating human decisions merely as instances of a class can be dehumanizing. In sentencing, hiring, or medical triage, respecting individual narrative (inside view) may be a moral requirement, even if statistical profiling (outside view) is more accurate.
  *Verdict:* The position is epistemically sound but normatively limited. It should not override agency-respecting or motivation-dependent contexts.

  **Conclusion**
  Your view should stand as the default for *epistemic* assessments in *recurrent*, *high-complexity* domains where accuracy is the sole goal. It fails in deterministic engineering contexts, genuine novelty, and situations where belief influences outcome (self-fulfilling prophecies) or where ethical respect for individuality outweighs predictive precision. A reasonable defender must accept these boundaries; claiming universality invites the falsification that reference class selection is itself a subjective, inside-view vulnerability.
