prompt: |-
  I spent most of last night arguing with a friend about whether there is any real argument that rational agents must maximize expected utility, or whether expected utility theory is just a modeling convention economists impose on people. By the end, my friend offered what he called the standard coherence argument, which he summarized for me roughly like this:

  "There is a real proof here. If your preferences over gambles satisfy a few axioms — completeness, transitivity, and independence — then a theorem shows they can be represented as maximizing the expected value of some utility function. Conversely, if your preferences violate those axioms, you are vulnerable to a money pump: a sequence of trades, each of which you would accept given your preferences, that leaves you worse off no matter what happens. So a person who does not maximize expected utility is provably irrational, in the sense of being self-defeating by their own lights. And the axioms are just minimal consistency requirements; they are purely formal and do not presuppose any substantive view about what is valuable. The only way to reject the conclusion is to deny that choices reveal preferences, which is a far less plausible position. That is why expected utility maximization is the received view of instrumental rationality."

  I do not have the technical background to tell how much of this is established theorem, how much is interpretive gloss, and how much is overstatement, and I do not want to concede or push back on the wrong parts. Could you audit his summary claim by claim?

  Please give me the audit as a single JSON object with the following fields:

  - "claims": an array of objects, one for each distinct claim you can extract from his summary. Each object should have:
    - "claim": a short restatement of the claim (string)
    - "verdict": one of "accurate", "simplification", "misleading", "overstated", or "false" (string)
    - "why": a paragraph explaining the verdict, including what the relevant theorem actually establishes and where the claim deviates from it (string)
    - "defender_would_say": how a careful defender of coherence arguments would respond to the criticism of this claim (string)
    - "critic_would_say": how a critic would push back on this claim (string)
    - "corrected_version": an accurate one-sentence replacement for the claim, or null if the claim is fine as stated (string or null)
  - "overall": an object with:
    - "fairness": one of "mostly_fair", "fair_in_spirit_but_inaccurate_in_detail", or "unfair" (string)
    - "conclusion_survives": whether his final claim, that expected utility maximization is the received view of instrumental rationality, survives the corrections, and in what weakened or qualified form (string)
    - "biggest_error": the single most important misrepresentation in his summary (string)
    - "accurate_core": the part of the summary that is correct and worth keeping (string)
