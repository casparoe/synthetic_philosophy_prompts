answer: |-
  The argument you are describing is famously known as the **Strategy Stealing Argument**.

  It is a cornerstone of combinatorial game theory. While it is a single logical form, it is applied to a specific family of games. Its epistemological status is indeed peculiar: it is a **non-constructive existence proof**. It proves that a winning strategy exists without providing any method to find it, relying on the Law of Excluded Middle (either Player 1 has a winning strategy or Player 2 does; we prove Player 2 cannot, ergo Player 1 must).

  Here is a detailed breakdown of the name, the logical structure, and the precise necessary and sufficient conditions for its validity.

  ### 1. Name and Classification
  *   **Name:** The Strategy Stealing Argument.
  *   **Origin:** It is most famously associated with John Nash, who used it around 1949 to prove that the first player can force a win in the game of **Hex**. It is also standardly applied to **Chomp** and **Gomoku** (on an infinite board or without specific restrictions).
  *   **Classification:** It is a specific type of *proof by contradiction* within the domain of *impartial* or *symmetric partisan* games. It is distinct from Zermelo's Theorem (which proves that one player *must* have a winning or drawing strategy in any finite perfect-information game) because Strategy Stealing identifies *which* player it is (Player 1), whereas Zermelo's theorem is silent on that.

  ### 2. Necessary and Sufficient Conditions
  You listed four plausible conditions: symmetry, no chance, no draws, and the "extra piece" property. To define the exact boundaries, we must refine these into formal game-theoretic properties.

  For the conclusion **"Player 1 has a forced win"** to hold, the following four conditions are jointly necessary and sufficient:

  #### A. Finite, Perfect Information, No Chance
  The game must be a **combinatorial game**.
  *   **Why:** If there is hidden information or randomness (dice/cards), a "strategy" is a probability distribution, not a deterministic guarantee. The contradiction relies on the certainty that if P2 has a winning strategy, it wins *every* time.
  *   **Boundary:** This breaks in games like Poker or Backgammon.

  #### B. Symmetric Rules (Identical Goals and Moves)
  The game must be symmetric with respect to the players.
  *   **Definition:** Both players must have access to the same set of moves from any given board configuration (ignoring whose turn it is), and the winning condition must be identical (e.g., "connect your sides" applies to both).
  *   **Why:** Player 1 needs to be able to adopt Player 2's strategy. If the players have different pieces (like Chess) or different victory conditions, P1 cannot "pretend" to be P2.
  *   **Boundary:** This breaks in Chess (King/Queen asymmetry) or asymmetric scenarios in video games. *Note: The board itself does not need to be geometrically symmetric, provided the rules treat both players identically relative to their starting positions.*

  #### C. Monotonicity of Advantage (The "Extra Piece" Condition)
  This is the most critical and often misunderstood condition. Formally, the game must satisfy **monotonicity**.
  *   **Definition:** For any game state $S$, if it is a winning state for the player to move, then the state $S + \{ \text{one extra piece of that player's color} \}$ must also be a winning state (or at least not a losing one).
  *   **Why:** In the proof, Player 1 makes an arbitrary first move, then ignores it. Effectively, Player 1 is playing Player 2's strategy but with an "extra" piece already on the board. If that extra piece could ever be a liability, the stolen strategy might fail.
  *   **Boundary:** This breaks in games with **Zugzwang**. In Zugzwang, having the obligation to move (or having a piece that limits your own mobility) is a disadvantage. It also breaks in **Go**, where an extra stone can reduce liberties (*damezumari*) or create a heavy shape that is easier to capture. This is why Go requires *Komi* (points compensation) rather than relying on strategy stealing; an extra stone is not strictly monotonic.

  #### D. No Draws (Determined Game)
  *   **Definition:** The game must end in a win for one side; a draw must be impossible.
  *   **Why:** The logic flows: "P2 cannot win $\rightarrow$ P1 must win." If draws are possible, the proof only establishes that **Player 2 cannot force a win.** It implies Player 1 can force a *win or a draw*.
  *   **Boundary:** In **Tic-Tac-Toe**, the strategy stealing argument proves P1 can at least draw (since P2 cannot force a win). It does *not* prove P1 can force a win, because Tic-Tac-Toe allows draws. To get the "P1 Wins" conclusion, you must mathematically eliminate the draw possibility (as in Hex, where the board cannot fill without a connection).

  ### 3. Why the "Arbitrary Move" Works
  You noted the step where P1 makes an arbitrary move if the strategy calls for an occupied square. This relies on a sub-condition of Monotonicity: **Having *two* extra pieces is at least as good as having *one*.**

  When P1 plays the arbitrary move, they now have *two* pieces on the board that P2 (in the hypothetical scenario) does not have. If one extra piece is never harmful, two extra pieces are certainly never harmful. This ensures the "ignoring" step doesn't degrade P1's position below the baseline of the stolen strategy.

  ### 4. Summary of Boundaries
  The argument applies if and only if the game is:
  1.  **Finite** (to ensure termination).
  2.  **Deterministic** (no chance).
  3.  **Symmetric** (same moves/goals for both).
  4.  **Monotonic** (extra pieces never hurt).
  5.  **Drawless** (for the specific conclusion that P1 *wins* rather than *doesn't lose*).

  **Where it breaks:**
  *   **Chess:** Fails Symmetry (pieces are different) and Monotonicity (Zugzwang exists; extra pieces can clutter the board).
  *   **Go:** Fails Monotonicity (extra stones can reduce liberties).
  *   **Tic-Tac-Toe:** Fails "No Draws" (proves P1 doesn't lose, not that P1 wins).
  *   **Nim:** Fails Symmetry/Monotonicity in the standard sense (it's an impartial game, but the "extra piece" logic doesn't apply to pile sizes in the same way; Nim is solved via Sprague-Grundy theorem instead).

  ### 5. Epistemological Status
  You are correct to highlight the non-constructive nature. In constructive mathematics (such as intuitionistic logic), this proof is actually **invalid** because it relies on the Law of Excluded Middle ($P \lor \neg P$). It tells you *that* a path exists through the game tree, but gives you no heuristic to find it.

  For Hex, despite knowing for 70+ years that the first player has a forced win, we still do not know the winning strategy for standard board sizes (e.g., 11x11). The Strategy Stealing Argument remains one of the most frustratingly unhelpful proofs in mathematics: it guarantees victory but offers no advice on how to achieve it.
