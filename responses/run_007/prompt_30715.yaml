answer: |-
  Imagine Mara in two distinct moments of her Tuesday. In the first, she bites into a sun-warmed strawberry; the experience is wet, chemically sweet, localized sharply to her tongue, biologically driven, and requires no training to enjoy. In the second, she hears the final resolving chord of a symphony she has studied for years; the experience is dry, auditory, structurally complex, diffuse across her awareness, culturally learned, and prompts no biological urge. Mara reports that, in that instant, the *goodness* of the strawberry bite and the *goodness* of the resolving chord are exactly equal in intensity, yet she insists there is no overlapping sensation—no "tingle," no "warmth," no "rush"—that exists in both; she is fully attentive in both, not relieved of pain in either, and functionally, one prompts chewing while the other prompts stillness.

  **The Check**

  *   **Felt-Quality Hedonism (The Old View):** This view breaks immediately. It posits a specific phenomenological "tone" or "glow" common to all pleasures. Mara's testimony stipulates this glow is absent. If the theory insists the glow *must* be there despite her report, it becomes unfalsifiable and detached from the actual experience.
  *   **Attitudinal Hedonism (e.g., Feldman):** This view survives best. It argues pleasure isn't a feeling but a pro-attitude (being "pleased that" you are experiencing the strawberry or the chord). Since Mara can hold the same attitude toward two different objects, the heterogeneity vanishes. However, it succeeds only by changing the subject from *feeling good* to *judging good*, which many argue abandons the core intuition of hedonism.
  *   **Functional/Neuroscientific Accounts:** These break. The strawberry engages gustatory and reward pathways (opioid/dopaminergic systems tied to consumption); the chord engages auditory cortex and pattern-recognition networks. There is no single "pleasure center" or unified functional role (one prepares digestion, the other prepares nothing).

  **The Verdict**

  The feature doing the real work is the **stipulation of introspective transparency combined with phenomenological divergence**. You have constructed a subject who is authoritative about her own experience ("I feel no common element") while maintaining the experiences are equally good. If you remove her authority (allowing the theorist to say "You're wrong, there *is* a common feeling you're missing"), the case collapses into a debate about psychology rather than philosophy. If you remove the divergence (allowing them to feel similar), the heterogeneity problem disappears.

  A committed hedonist will attack this by claiming the scenario is **rigged via category error**. They will argue you are conflating the *object* of the pleasure (strawberry vs. chord) with the *manner* of enjoying it. They will insist that if you strip away the sensory details, what remains is a "hedonic lift" or a "desire-satisfaction signal" that *is* identical, and Mara's inability to isolate it is like a colorblind person denying the existence of red. Alternatively, they will simply concede the Felt-Quality view is dead and pivot to Attitudinal Hedonism, arguing that your thought experiment proves *their* point: since the feelings differ, pleasure must be an attitude, not a sensation.
