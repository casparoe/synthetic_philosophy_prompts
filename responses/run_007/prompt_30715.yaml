      *   *Drafting the paragraph:* Needs to be tight.

      *   *Revised Draft:* Imagine two moments in the life of Mara. In the first, she bites into a sun-warmed strawberry; the experience is wet, sweet, chemically immediate, localized to her mouth, and requires no learning. In the second, she hears the final resolving chord of a symphony she has studied for years; the experience is dry, auditory, structurally complex, localized nowhere in particular, and relies entirely on cultural training. Mara reports that, in that instant, the *goodness* of the strawberry bite and the *goodness* of the resolving chord are exactly equal in intensity, yet she insists there is no overlapping sensation—no "tingle," no "warmth," no "rush"—that exists in both. She is fully attentive in both, not relieved of pain in either, and functionally, one prompts chewing while the other prompts stillness.

