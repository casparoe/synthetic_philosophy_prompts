answer: |-
  ### The mapping

  In the biological original, the peacock's tail is the signal; its metabolic cost is the barrier; the peacock is the signaler; the peahen is the receiver; genetic fitness is the quality. Translated to humans: the Super Bowl ad or luxury watch is the signal. The financial expenditure or physical pain is the cost. The corporation or individual is the signaler. The consumer or community is the receiver. The purported quality varies: for firms, it's solvency and market dominance; for individuals, it's resource abundance or group commitment. The core claim is that the cost ensures honesty: only a truly solvent company or committed member can afford the waste, preventing low-quality imposters from mimicking the signal to gain undeserved trust or status. This mapping assumes the cost is relative to capacity, making the waste itself the informative variable rather than the object produced.

  ### Where it holds

  The logic holds when the cost is disproportionately burdensome for low-quality types, creating a separating equilibrium. In luxury markets, a $50,000 watch signals wealth because the marginal utility of that money is negligible to a millionaire but ruinous to a mimic. This ensures only the wealthy buy it. Similarly, brutal initiation rites work because only those truly committed to the group's long-term benefits will endure the pain; opportunists quit early. In advertising, massive spend can signal confidence in future cash flows. If a company expects to collapse, burning millions on a Super Bowl spot is irrational suicide. Therefore, the spend signals confidence in longevity and product quality indirectly. These cases share the biological prerequisite: the signal is too expensive for low-quality actors to fake without incurring unsustainable losses, ensuring the signal remains statistically correlated with the underlying trait. Crucially, the benefit gained from signaling must outweigh the cost only for the high-quality type, stabilizing the system against invasion by cheaters.

  ### Where it breaks

  The analogy fractures when the cost is absolute rather than relative. If a loan can fund the ad, a bankrupt company can fake the signal temporarily, breaking the honesty link. Unlike peahens, human receivers often lack the evolutionary pressure to discern truth; we are susceptible to bluffing because the feedback loop is slow or noisy. In biology, false signaling leads to reproductive failure; in marketing, it might just lead to a quarterly loss protected by limited liability. Furthermore, cultural signals often decouple from utility entirely. A watch tells time regardless of price, but the signal is about status, not function. Biological signals are tightly linked to survival fitness; human signals are often linked to social constructs that can inflate independently of reality, creating bubbles rather than honest assessments. Finally, human signaling is often cooperative collusion rather than adversarial selection; we agree to value the waste together, whereas the peahen is evaluating the peacock against her own genetic interests. Often, the "cost" is merely wasteful expenditure without differential impact, turning the explanation into a post-hoc rationalization for inefficiency rather than a predictive model of honesty.

  ### What the analogy can and can't support

  The analogy supports the claim that waste *can* convey information under strict conditions of differential cost and receiver skepticism. It validates why some rituals persist despite apparent inefficiency, offering a mechanism for trust without verbal guarantees. However, it cannot support the claim that *all* observed waste is adaptive signaling. Just because a behavior is costly doesn't mean it evolved to signal quality; it might be maladaptive inertia, coercion, or simple error. The theory explains the stability of honest signals, not the origin of every expensive habit. It survives as a hypothesis for specific equilibria but fails as a universal law of economics or culture. Smuggled in is the assumption of rationality; humans often signal irrationally, and receivers often fail to penalize fakes. We must distinguish between behaviors that are costly signals and those that are merely costly.

  ### Bottom line

  Verdict: Useful heuristic, dangerous dogma. It explains specific cases of trust-building but justifies too much inefficiency when applied universally. Treat it as a specific mechanism, not a universal law. A better analogy is a cash bond or collateral. You put money down to prove you'll show up; if you flee, you lose it. This captures the stake without implying the waste itself is the benefit. The money isn't the signal; the risk of loss is. This shifts focus from "burning money" to "risking assets," better reflecting the economic reality of signaling without romanticizing waste.
