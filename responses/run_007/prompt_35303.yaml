prompt: |-
  I am working toward a theory of supererogation and I want to start by fixing the criteria of adequacy before I commit to any particular view. Please lay out the desiderata that any satisfactory theory of supererogatory action must meet. For each desideratum, give the case or argument that motivates treating it as a requirement rather than a preference of one theoretical camp.

  At minimum, a theory of supererogation must explain what distinguishes the supererogatory from (a) the obligatory and (b) the merely permissible, and it must account for the core asymmetry that supererogatory acts are praiseworthy to perform but not blameworthy to omit. But I suspect the full list of requirements is longer and more interesting than that. I want to see where the theoretical pressure points are: for instance, whether a theory must handle the continuity between small favors and saintly sacrifices without erasing the distinction, whether it must make sense of the genuine optionality of supererogatory acts without collapsing that optionality into arbitrariness, and whether it must be compatible with the impartiality that characterizes the moral point of view — or whether impartiality is precisely what a theory of supererogation must qualify or reject.

  I am especially interested in the following structure. Identify which desiderata are non-negotiable (no theory that fails them can be taken seriously), which are merely desirable (a theory that fails them is worse but not ruled out), and which are contested (some traditions reject them outright and would not count them as desiderata at all). Then flag any pairs or subsets of the non-negotiable desiderata that appear to be jointly unsatisfiable — that is, where you suspect a no-go result may be lurking, and the list of requirements itself might force a revision of what we thought a theory of supererogation could deliver. Finally, indicate which single desideratum does the most to separate the main existing approaches (consequentialist, Kantian, virtue-ethical, and contractualist treatments of supererogation). A brief scorecard is welcome but the criteria themselves are the deliverable I need.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Theory of Supererogation.
      *   **Task:** Lay out criteria of adequacy (desiderata) for a satisfactory theory.
      *   **Specific Requirements:**
          *   Distinguish supererogatory from obligatory and merely permissible.
          *   Account for the core asymmetry (praiseworthy to do, not blameworthy to omit).
          *   Address specific pressure points (continuity vs. distinction, optionality vs. arbitrariness, impartiality).
          *   **Structure:** Categorize desiderata into Non-Negotiable, Desirable, and Contested.
          *   **Conflict Analysis:** Flag jointly unsatisfiable pairs/subsets (no-go theorems).
          *   **Differentiation:** Identify the single desideratum that best separates main approaches (Consequentialist, Kantian, Virtue, Contractualist).
          *   **Tone:** Philosophical, rigorous, analytical.

  2.  **Deconstruct Supererogation:**
      *   *Definition:* Acts that are "above and beyond the call of duty."
      *   *Classic Example:* The Good Samaritan, risking life to save a stranger, extreme charity.
      *   *Logical Structure:* $S$ does $A$. $A$ is morally good. $S$ is not obligated to do $A$. $S$ is not blameworthy for not doing $A$. $S$ is praiseworthy for doing $A$.
      *   *The Problem:* If morality is about maximizing good (Consequentialism), why isn't the best act obligatory? If morality is about duty (Kant), where does "extra" duty fit?

  3.  **Drafting the Desiderata (Brainstorming):**
      *   1. The Asymmetry Constraint (Praise/No Blame).
      *   2. The Optionality Constraint (Not Obligatory).
      *   3. The Value Constraint (Morally Good).
      *   4. The Distinction Constraint (Not just permissible, but *more*).
      *   5. The Sacrifice/Cost Constraint (Usually involves cost to agent).
      *   6. The Impartiality Constraint (Does it violate agent-neutrality?).
      *   7. The Continuity Constraint (Small favors vs. saintliness).
      *   8. The Rationality Constraint (Is it rational to do it? Is it rational not to?).

  4.  **Categorizing Desiderata:**
      *   *Non-Negotiable:* These define the phenomenon. If you miss these, you aren't talking about supererogation.
          *   Asymmetry (Praise/No Blame).
          *   Optionality (Not Obligatory).
          *   Moral Value (It's good, not neutral).
      *   *Desirable:* Makes the theory robust but some might argue against them.
          *   Continuity (Small vs. Big).
          *   Sacrifice (Must it always be costly?).
          *   Agent-Neutrality (Impartiality).
      *   *Contested:* Some theories reject these outright.
          *   Existence (Supererogation skeptics).
          *   Impartiality (Agent-centered prerogatives).
          *   Maximization (Satisficing vs. Maximizing).

  5.  **Identifying Tensions (No-Go Results):**
      *   *The Paradox of Supererogation:* If an act is the *best* available, why isn't it obligatory? (Consequentialist tension).
      *   *Impartiality vs. Optionality:* If morality is impartial, why can I choose *not* to do the best thing?
      *   *Continuity vs. Distinction:* If there's a spectrum of goodness, where is the sharp cut-off between duty and supererogation? (Sorites problem).

  6.  **Identifying the Key Differentiator:**
      *   What splits Consequentialists from Deontologists/Virtue Ethicists here?
      *   It's usually the **Optimality Constraint** (Must the supererogatory be the *best* act?) vs. **Optionality**.
      *   Actually, a sharper cut is the **Impartiality/Agent-Centered Prerogative** tension. Consequentialists struggle to allow optionality without modifying maximization. Deontologists struggle to explain the *value* without making it duty.
      *   Better candidate: **The Relationship between the Good and the Right.** Does the morally best act automatically become obligatory?
      *   Let's refine: The single desideratum that separates them is **The Maximization Requirement** (or the denial thereof). If you accept "Ought implies Can" and "Ought implies Best," supererogation vanishes. So, the desideratum is **The Separation of Optimality and Obligation.**

  7.  **Fleshing out the Arguments for Each Desideratum:**
      *   *Asymmetry:* Motivated by intuition about the Saint vs. the Sinner.
      *   *Optionality:* Motivated by the concept of "Duty." Duty is mandatory; Supererogation is not.
      *   *Value:* Motivated by the fact that we praise it. We don't praise neutral acts.
      *   *Impartiality:* Motivated by the moral point of view (everyone counts equally).
      *   *Continuity:* Motivated by the lack of a clear line between tipping 20% and 50%.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the project (fixing criteria before theory).
      *   **Section 1: The Non-Negotiables (The Definition).** Asymmetry, Optionality, Moral Value.
      *   **Section 2: The Desirables (The Robustness).** Continuity, Sacrifice, Rationality.
      *   **Section 3: The Contested (The Battlefields).** Impartiality, Existence, Maximization.
      *   **Section 4: The Tension Map (No-Go Theorems).** The "Best Act" Paradox, The Sorites of Duty.
      *   **Section 5: The Key Differentiator.**
      *   **Scorecard:** Summary table.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish "Merely Permissible" from "Supererogatory." Both are optional, but only one is praiseworthy.
      *   *Correction:* Ensure the "Contested" category includes Supererogation Skeptics (e.g., strict Act Utilitarians who deny the category exists).
      *   *Refinement on Tension:* The biggest tension is between **Optionality** and **Optimality**. If morality demands the best, supererogation is impossible. This is the "Maximizing Consequentialist" challenge.
      *   *Refinement on Differentiator:* Is it Maximization? Or is it **Agent-Centered Prerogatives**? Scheffler's work is pivotal here. Let's go with **The Status of the Optimality Principle** (Does 'Best' imply 'Ought'? ).

  10. **Final Review against User Prompt:**
      *   Did I cover (a) obligatory and (b) permissible distinctions? Yes.
      *   Did I cover the asymmetry? Yes.
      *   Did I cover continuity, optionality/arbitrariness, impartiality? Yes.
      *   Did I categorize (Non-negotiable, Desirable, Contested)? Yes.
      *   Did I flag jointly unsatisfiable pairs? Yes.
      *   Did I identify the single differentiator? Yes.
      *   Is there a scorecard? Yes.

  11. **Drafting the text.** (Focus on precise philosophical terminology: *deontic status*, *axiological status*, *agent-neutral*, *prerogatives*, *Sorites*.)

  *(Self-Correction during drafting the "No-Go" section)*: I need to be careful not to say supererogation is *impossible*, but that certain *combinations* of desiderata create the paradox. The "No-Go" is for theories that want to hold *all* of them simultaneously without modification.

  *(Self-Correction on the Differentiator)*: The prompt asks for the desideratum that separates the approaches. Consequentialists usually deny supererogation (or modify maximization). Kantians struggle to fit it in (perfect/imperfect duties). Virtue Ethicists embrace it easily. Contractualists vary. The core split is whether **Moral Goodness Entails Obligation**. I will frame this as the **Entailment Desideratum**.

  12. **Final Polish:** Check tone and clarity. Ensure the distinction between "Desirable" and "Contested" is clear (Desirable = most agree it would be nice to have; Contested = significant schools reject it).

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a rigorous methodological approach. By fixing the criteria of adequacy prior to theory construction, you avoid the common pitfall of defining supererogation in a way that begs the question for a specific normative framework (e.g., defining it so broadly that consequentialism cannot reject it, or so narrowly that virtue ethics cannot accommodate it).

  Below is a structured map of the desiderata for a theory of supererogation, categorized by their modal status (Non-Negotiable, Desirable, Contested), followed by an analysis of the theoretical tension points and the primary differentiator among existing schools.

  ---

  ### I. The Desiderata

  #### A. Non-Negotiable Desiderata
  *These constitute the logical grammar of the concept. A theory that fails these does not explain supererogation; it explains something else.*

  **1. The Deontic Optionality Constraint**
  *   **Requirement:** The act must not be obligatory. The agent is morally free to omit it without violating a duty.
  *   **Motivation:** This distinguishes the supererogatory from the **obligatory**. If an act is required, it is duty, not supererogation. The concept of "above and beyond the call of duty" logically presupposes a "call of duty" that stops short of this act.
  *   **Argument:** If a theory makes the heroic act obligatory (e.g., strict act utilitarianism), it eliminates the category of supererogation entirely. To explain supererogation, one must explain why the *best* act is not always the *required* act.

  **2. The Axiological Value Constraint**
  *   **Requirement:** The act must be morally good (positively valuable), not merely neutral.
  *   **Motivation:** This distinguishes the supererogatory from the **merely permissible**. Tying your shoes is optional, but not supererogatory. Supererogatory acts contribute positively to the moral landscape.
  *   **Argument:** Without this constraint, any trivial optional act would count as supererogatory. The theory must explain why saving a drowning child is supererogatory (in certain contexts) while eating an apple is not, despite both being optional.

  **3. The Praise/Blame Asymmetry**
  *   **Requirement:** Performing the act renders the agent praiseworthy; omitting the act does not render the agent blameworthy.
  *   **Motivation:** This captures the core phenomenological intuition of the "Saint" vs. the "Sinner." We admire the saint; we do not condemn the non-saint for failing to be a saint.
  *   **Argument:** This is the logical consequence of Constraints 1 and 2 combined. If it were blameworthy to omit, it would be obligatory (violating 1). If it were not praiseworthy to perform, it would be merely permissible (violating 2). A theory must account for this normative asymmetry without reducing it to social convention.

  #### B. Desirable Desiderata
  *These are not strictly definitional, but a theory that fails them is less robust, less applicable, or counter-intuitive.*

  **4. The Continuity Constraint**
  *   **Requirement:** The theory must account for the spectrum of supererogation, from small favors (holding a door) to saintly sacrifices (dying for a stranger), without positing a metaphysically sharp boundary where none seems to exist.
  *   **Motivation:** Moral life appears continuous. There is no clear line where a "nice thing to do" becomes a "heroic thing to do."
  *   **Argument:** If a theory requires a specific threshold of cost or value to trigger supererogatory status, it faces a Sorites paradox. A robust theory should explain the gradient without arbitrary cut-offs.

  **5. The Sacrifice/Cost Correlation**
  *   **Requirement:** The theory should explain why supererogatory acts typically involve some cost, risk, or sacrifice to the agent.
  *   **Motivation:** While not logically necessary (one could imagine a costless supererogatory act), intuitively, supererogation is linked to self-denial or going out of one's way.
  *   **Argument:** If supererogation requires no cost, it collapses into "doing what you wanted to do anyway." The moral weight of the act seems tied to the agent's willingness to subordinate their own interests.

  **6. The Rationality Constraint**
  *   **Requirement:** It must be rational (or at least not irrational) to perform the act, and rational to omit it.
  *   **Motivation:** Morality is generally thought to be action-guiding for rational agents. If supererogatory acts are irrational to perform (too costly), they are fanaticism. If they are irrational to omit (too obviously good), they become obligatory.
  *   **Argument:** This prevents the theory from making morality alienating. It ensures the "optionality" is a genuine rational option, not just a deontic loophole.

  #### C. Contested Desiderata
  *These are points of genuine philosophical disagreement. Some traditions reject these outright, viewing them as errors in folk morality rather than requirements for a theory.*

  **7. The Impartiality Constraint**
  *   **Requirement:** The theory must be compatible with agent-neutrality (the moral point of view treats all agents' interests equally).
  *   **Motivation:** Morality is supposed to be objective and universal, not biased toward the agent.
  *   **Rejection:** Many theories of supererogation (e.g., Scheffler's Agent-Centered Prerogatives) argue that supererogation *requires* a departure from strict impartiality. If morality is strictly impartial, the agent's personal costs cannot justify omitting the best act. Thus, to save supererogation, one may have to sacrifice impartiality.

  **8. The Existence Claim**
  *   **Requirement:** The theory must validate that supererogatory acts actually exist.
  *   **Motivation:** Folk morality believes in "going above and beyond."
  *   **Rejection:** Supererogation Skeptics (often strict Maximizing Consequentialists) argue this is a desideratum for *folk morality*, not for *true morality*. They argue a satisfactory theory might prove supererogation is an illusion. For them, "explaining away" the phenomenon is a success, not a failure.

  **9. The Non-Maximization Constraint**
  *   **Requirement:** The theory must allow that an agent can permissibly perform an act that is *not* the optimally best available act.
  *   **Motivation:** Supererogation implies you can choose a "good" act over the "best" act (e.g., donating \$100 instead of \$1000).
  *   **Rejection:** Maximizing theories reject this. They hold that if Act A is better than Act B, Act B is wrong. To accept this desideratum is to reject Maximization.

  ---

  ### II. Theoretical Pressure Points (No-Go Results)

  There are specific combinations of the above desiderata that appear jointly unsatisfiable. A theory cannot hold all of them simultaneously without significant modification of one.

  **1. The Paradox of Optimality (The "Best Act" Tension)**
  *   **Conflict:** *The Axiological Value Constraint* + *The Impartiality Constraint* + *The Deontic Optionality Constraint*.
  *   **The Problem:** If morality is impartial (everyone counts equally) and the act is the *most* morally valuable option available (Axiological Value), why is it not Obligatory?
  *   **The No-Go:** You cannot maintain strict Impartiality and strict Maximization while preserving Optionality.
  *   **Resolution Paths:**
      *   *Reject Impartiality:* Introduce Agent-Centered Prerogatives (Scheffler).
      *   *Reject Maximization:* Adopt Satisficing Consequentialism (Slote).
      *   *Reject Optionality:* Deny Supererogation exists (Act Utilitarianism).

  **2. The Sorites of Duty (The Continuity Tension)**
  *   **Conflict:** *The Continuity Constraint* + *The Deontic Optionality Constraint*.
  *   **The Problem:** If there is a continuum of moral value from small favors to great sacrifices, at what precise point does the "merely permissible" become "obligatory"? If there is no sharp line (Continuity), then obligation becomes vague. If there is a sharp line, it seems arbitrary.
  *   **The No-Go:** It is difficult to maintain a crisp deontic distinction (Obligatory vs. Supererogatory) while acknowledging a smooth axiological continuum (Good vs. Better).
  *   **Resolution Paths:**
      *   *Accept Vagueness:* Moral concepts are inherently vague (Sorensen).
      *   *Contextualism:* The line shifts based on the agent's capacity (Heyd).

  **3. The Rationality Gap**
  *   **Conflict:** *The Rationality Constraint* + *The Sacrifice/Cost Correlation*.
  *   **The Problem:** If supererogatory acts involve significant sacrifice (Cost), standard instrumental rationality suggests omitting them is rational. But if omitting them is rational, why are they *morally* good? If morality and rationality diverge too widely, morality loses its normative force.
  *   **The No-Go:** A theory struggles to explain why it is rational to be a saint if saintliness involves massive self-sacrifice without corresponding benefit.
  *   **Resolution Paths:**
      *   *Expand Rationality:* Include moral reasons as intrinsic rational reasons (Moral Rationalism).
      *   *Dualism:* Accept that morality and rationality can conflict (Prichard).

  ---

  ### III. The Key Differentiator

  If you must identify the single desideratum that separates the main existing approaches (Consequentialist, Kantian, Virtue-Ethical, Contractualist), it is:

  **The Non-Maximization Constraint (Does 'Best' imply 'Ought'?)**

  *   **Consequentialists:** Generally **reject** this desideratum. For a maximizing consequentialist, the best act *is* the obligatory act. To accept supererogation, they must modify their theory (e.g., Satisficing Consequentialism or introducing Prerogatives). This is their primary theoretical pressure point.
  *   **Kantians:** Generally **accept** this desideratum but struggle to locate supererogation. Kant distinguishes Perfect vs. Imperfect duties. Supererogation is often squeezed into "wide duties," but Kant is suspicious of acts that claim to go *beyond* duty, viewing them as potential delusions of merit.
  *   **Virtue Ethicists:** **Embrace** this desideratum most naturally. Since virtue ethics focuses on character rather than rules, an act can be "characteristic of a saint" without being "required of all agents." They separate the *ideal* from the *mandatory*.
  *   **Contractualists:** **Variable.** If the contract sets a baseline of mutual justification, acts beyond that baseline are supererogatory. However, if the contract requires maximizing mutual benefit, the category shrinks.

  **Why this is the differentiator:**
  The question of whether moral value *entails* moral obligation is the fault line.
  *   If you say **Yes** (Best $\rightarrow$ Ought), you are pushed toward Consequentialism and Supererogation Skepticism.
  *   If you say **No** (Best $\nrightarrow$ Ought), you open the door for Supererogation but must explain *why* the moral force of the "best" reason doesn't trigger an obligation. This forces you toward Agent-Centered Prerogatives, Satisficing, or Virtue Ethics.

  ---

  ### IV. Scorecard of Approaches

  | Approach | Non-Maximization? | Impartiality? | Continuity? | Primary Trade-off |
  | :--- | :--- | :--- | :--- | :--- |
  | **Maximizing Consequentialism** | **Rejects** | Accepts | Accepts | **Denies Supererogation.** (Fails Existence Claim). |
  | **Satisficing Consequentialism** | **Accepts** | Accepts | Accepts | **Weakens Rationality.** (Why settle for 'good enough'?). |
  | **Agent-Centered Prerogative** | **Accepts** | **Rejects** | Accepts | **Weakens Impartiality.** (Allows agent bias). |
  | **Kantian (Strict)** | Ambivalent | Accepts | **Rejects** | **Rigid Duty.** (Struggles to fit 'extra' acts). |
  | **Virtue Ethics** | **Accepts** | Ambivalent | **Accepts** | **Vagueness.** (Relies on 'phronesis' rather than rules). |
  | **Contractualism** | **Accepts** | Accepts | Ambivalent | **Baseline Dependency.** (Depends on where contract draws line). |

  ### Summary Recommendation for Your Theory
  To build a robust theory, you should treat **The Non-Maximization Constraint** as your primary battleground. You cannot simply assume it; you must argue for it. If you cannot explain why the *best* act is not *obligatory*, the Asymmetry Constraint collapses, and supererogation vanishes. Your theory will stand or fall on your solution to the **Paradox of Optimality**.
