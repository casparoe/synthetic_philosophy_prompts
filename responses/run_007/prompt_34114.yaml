answer: |-
  This is a sharp question. You have identified the exact friction point where computer vision, cognitive science, and philosophy of mind collide. Bongard Problems (BPs) are not just puzzles; they are a stress test for **symbol grounding** and **data-efficient abduction**.

  Most systems fail because they treat BPs as a classification task (Left vs. Right). They are not. They are a **rule discovery** task where the hypothesis space is open-ended, the data is noisy, and the signal is semantic.

  Here are the full desiderata for a theory of Bongard-style concept induction, categorized by function, followed by the "killer" constraints and the tension analysis you requested.

  ---

  ### I. The Desiderata

  #### 1. Coverage & Expressivity (The "What")
  A theory must define the space of solvable problems.
  *   **The Original 100 (Baseline):** Must solve the canonical set (Mikhail Bongard, 1970). These involve basic geometry, topology, and counting.
  *   **Quantification & Counting:** Must handle "more than," "exactly three," "odd number of." This requires logical operators, not just feature detection.
  *   **Relational Geometry:** Must handle "inside," "touching," "aligned," "parallel." This requires a graph-structured representation of objects, not a bag of features.
  *   **Global vs. Local:** Must distinguish rules about individual shapes (e.g., "all triangles") from rules about the arrangement (e.g., "forms a line") or texture (e.g., "filled vs. empty").
  *   **Negative Evidence:** Must handle cases where the rule is defined by absence (e.g., "no closed loops").

  #### 2. Representational Granularity (The "How")
  This addresses your "Convex vs. Circular" concern. A theory cannot just output a label; it must construct a description.
  *   **Predicate Hierarchy:** The system must know that "Circle" entails "Convex." If the rule is "Convex," hypothesizing "Circle" is an overfit (too specific). If the rule is "Circle," hypothesizing "Convex" is an underfit (too general). The theory needs a **complexity prior** (Minimum Description Length) to select the simplest rule that covers the data.
  *   **Symbol Grounding:** The symbols (e.g., `TRIANGLE`, `INSIDE`) must be derived from pixel data, not pre-supplied. A theory that assumes segmented objects are given as input has punted the hardest part of the problem.
  *   **Compositional Generalization:** If it learns "red" and "circle" separately, it must be able to understand "red circle" without retraining.

  #### 3. Cognitive Consistency (The "Who")
  If the theory claims to model *how anyone does this* (human cognition), it must match psychological data.
  *   **Few-Shot Efficiency:** Must converge on the rule with ≤ 6 examples per side. Standard deep learning requires orders of magnitude more.
  *   **Human-like Error Patterns:** Humans fail on specific BPs (e.g., BP #93 is notoriously hard). A valid theory should find these hard too, for the same reasons (e.g., requiring a specific abstraction level that isn't salient).
  *   **Meta-Learning / Transfer:** Humans get faster at BPs after solving 20 of them. The theory must allow for **prior updating**. Solving BP #1 should adjust the priors for BP #2 (e.g., increasing the prior probability that "counting" is relevant).
  *   **Saliency & Attention:** Humans don't process the whole image equally. The theory needs a mechanism for foveation or attentional selection to explain why we notice the shapes before the background.

  #### 4. Explanatory Power (The "Why")
  *   **Natural Language Generation:** The output must be a human-readable rule (e.g., "Left side contains shapes with holes"), not a vector or a class ID.
  *   **Counterfactual Reasoning:** The system should be able to say, "If this shape on the right were a triangle, it would belong on the left." This proves it has the *rule*, not just a classifier boundary.
  *   **Distinguishing Coincidence from Rule:** It must reject "gerrymandered" rules (e.g., "The shapes on the left are all the specific shades of gray present in pixels 4, 12, and 99"). This is the **Goodman's "Grue" Problem**. The theory needs a bias toward "natural kinds."

  ---

  ### II. The Killer Constraints

  You asked which requirements knock out the most approaches. There are three "Killers." If a theory fails one of these, it is not a theory of Bongard induction; it is a theory of something else.

  | Killer Constraint | Why it Kills | Fails |
  | :--- | :--- | :--- |
  | **1. The Grounding Gap** | Most symbolic AI assumes objects are already segmented and labeled. Most Deep Learning assumes fixed classes. BPs require *creating* the object concepts from pixels *during* the inference. | Classical GOFAI, Standard Supervised CNNs |
  | **2. The Data Efficiency Wall** | If the system requires gradient descent over thousands of examples to learn the concept "triangle," it fails. BPs are **one-shot** or **few-shot** by definition. | Standard Deep Learning (without meta-pretraining) |
  | **3. The "Grue" Filter** | If the system cannot distinguish between a projectable predicate ("Green") and a gerrymandered one ("Green if observed before 2024"), it hasn't solved induction. It has only solved interpolation. | Pure Associationist Models, Kernel Methods |

  **The Single Biggest Killer:** **The Grounding Gap.**
  Almost every classical AI approach dies here. They assume a "perceptual front-end" provides them with a list of objects: `[(triangle, red), (circle, blue)]`. But in many BPs, deciding *what counts as an object* is part of the puzzle. Sometimes the "object" is the white space, not the black shape. Sometimes the "object" is the relationship between two shapes. A theory that takes pre-segmented objects as input is assuming the solution is already half-found.

  ---

  ### III. The Tension: Few-Shot vs. Correctness

  You asked: *If you want the theory to explain how humans can induce a rule from four examples, and you also want it to explain why the rule they induce is usually the "right" one... it seems like those might pull in opposite directions.*

  **This tension is real, but it is not unsatisfiable.** It is the central problem of induction.

  *   **The Conflict:** To learn from 4 examples, you need massive **Inductive Bias** (strong priors). But if your priors are too strong, you become dogmatic and miss novel rules (brittleness). If your priors are too weak, you need more data (inefficiency).
  *   **The Resolution:** The bias cannot be **fixed**; it must be **learnable**.
      *   A theory that hardcodes "Objects are convex" will fail BPs where the rule is about concave shapes.
      *   A theory that starts with *no* priors will never learn from 6 examples.
      *   **The Solution:** The theory must posit a **Meta-Learning Mechanism**. The "priors" are learned over a lifetime of visual experience (or pre-training on a dataset like ARC or ImageNet), but they are **frozen** during the specific BP task.
      *   **Verdict:** A theory is only viable if it explains *where the bias comes from*. If it treats the bias as magic (e.g., "we just hardcoded the primitives"), it fails the "Correctness" desideratum because it can't explain how we handle *novel* concepts not in the hardcoded list.

  **Are they jointly unsatisfiable?**
  No. But they require a **Hierarchical Bayesian** approach or a **Neuro-Symbolic** architecture.
  *   *Level 1:* Low-level priors (edges, continuity) are innate/hardcoded.
  *   *Level 2:* Mid-level priors (objects, containment) are learned early in development.
  *   *Level 3:* High-level rules (the BP solution) are inferred rapidly using Level 2 priors.
  If a theory collapses these levels, it breaks.

  ---

  ### IV. Scoring the Approaches

  Here is how the major frameworks stack up against the desiderata.

  | Desiderata | Classical AI (GOFAI) | Deep Learning (CNN/VLM) | Bayesian Program Learning (BPL) | Neuro-Symbolic |
  | :--- | :--- | :--- | :--- | :--- |
  | **Data Efficiency** | **High** (Logic needs few examples) | **Low** (Needs massive data) | **Very High** (Designed for few-shot) | **High** (Depends on symbol learner) |
  | **Perceptual Grounding** | **Fail** (Assumes pre-segmented input) | **High** (End-to-end pixels) | **Low** (Often assumes sketches/primitives) | **Medium** (Active research area) |
  | **Explainability** | **High** (Outputs logical rules) | **Low** (Black box embeddings) | **High** (Generative programs) | **High** (Symbolic output) |
  | **Handling "Grue"** | **Medium** (Depends on primitive vocabulary) | **Fail** (Fits spurious correlations) | **High** (Simplicity priors penalize complexity) | **Medium** (Depends on constraints) |
  | **Meta-Learning** | **Low** (Static rule sets) | **Medium** (Fine-tuning/Adapters) | **High** (Library of concepts grows) | **High** (Can update symbolic library) |
  | **Relational Reasoning** | **High** (Native to logic) | **Low** (Struggles with systematicity) | **High** (Explicit relations) | **High** (Explicit relations) |
  | **Overall Viability** | **Incomplete** (No eyes) | **Incomplete** (No logic) | **Promising** (Computationally expensive) | **Best Candidate** (Hard to engineer) |

  #### Analysis of the Table:
  1.  **Classical AI:** Fails the **Grounding Gap**. Foundalis' thesis (2006) is the peak of this; it works beautifully *if* you hand-feed it the objects. It doesn't solve vision.
  2.  **Deep Learning (VLMs):** Current SOTA (like GPT-4V) actually does surprisingly well on BPs, but often via **memorization** or **textual leakage** (many BPs are in training data). When tested on *new* BPs (like the "Bongard-LOGO" or "ARC" datasets), performance drops precipitously. They fail the **Data Efficiency** and **Grue** constraints. They classify, they don't induce.
  3.  **Bayesian Program Learning (Tenenbaum et al.):** This is arguably the strongest cognitive model. It treats concepts as probabilistic programs. It handles the **Few-Shot** and **Grue** constraints beautifully via a simplicity prior. However, it struggles with **Perceptual Grounding** (getting from pixels to program inputs) and scaling to complex visual scenes.
  4.  **Neuro-Symbolic:** This is the only category that *could* theoretically satisfy all desiderata. It uses neural nets for grounding (pixels to objects) and symbolic engines for induction (objects to rules). However, there is no unified theory yet; it is a collection of engineering attempts.

  ### V. Final Recommendation for Your Reading

  Before you read the next paper, check it against these three filters. If the paper ignores them, it is likely not solving the core problem:

  1.  **The Input Question:** Does the system take raw pixels, or does it assume pre-extracted shapes? (If the latter, it's not solving perception).
  2.  **The Vocabulary Question:** Where do the primitives (triangle, inside, count) come from? Are they hardcoded, or learned? (If hardcoded, how does it handle novel concepts?)
  3.  **The Generalization Question:** Does it test on *new* Bongard problems that differ structurally from the training set? (If it trains on BPs and tests on BPs, it might just be memorizing the distribution of rules).

  **The "Real" Theory:**
  The most robust theory currently available is likely a variant of **Bayesian Program Learning** coupled with a **Neural Perception Front-end**. It respects the cognitive constraints (few-shot, priors) while acknowledging the engineering reality (pixels are messy).

  If you want to see the tension played out practically, look at **François Chollet's ARC (Abstraction and Reasoning Corpus)**. It is the modern spiritual successor to Bongard Problems. A theory that solves ARC is a theory that solves Bongard. If a paper claims to solve Bongards but fails ARC, be skeptical.
