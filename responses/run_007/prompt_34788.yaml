      *   *Check:* Did I answer the "suspicion" clearly? Yes, need to distinguish between *resolving ambiguity* (code does this) and *discovering truth* (philosophy tries this).
      *   *Check:* Is the residue report honest? Don't say "Philosophy is useless." Say "Philosophy handles the requirements engineering of reality."

  9.  **Structure of the Output:**
