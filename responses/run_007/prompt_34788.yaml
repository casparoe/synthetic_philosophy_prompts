      *   Phase 1: The Mapping Sketch (Table/List).
      *   Phase 2: The Restatement (The Puzzle in Code).
      *   Phase 3: The Residue Report (Successes, Fudges, Failures).
      *   Phase 4: Verdict on the Suspicion.

