answer: |-
  The implicit theory governing your legal system is not a single principle but a **Theory of Constitutive Non-Alienability**. It operates on the presumption that markets are efficient defaults, except where commodification would dissolve the prerequisites of agency itself. The law distinguishes between *attributes* of a person (which can be leased or sold, like plasma or labor) and the *conditions* of personhood (which cannot, like vital organs or civic equality).

  **Strict Presuppositions vs. Compatibility**
  The practices **strictly presuppose** that certain goods are *constitutive* of the legal agent. You cannot sell a kidney because biological viability is a precondition for holding rights; you cannot sell a vote because political equality is a precondition for legitimate law. The system does not strictly require these values to be "sacred" or religious; it only requires them to be functionally non-fungible. **Paternalism** and **Sacred Values** are merely *compatible* with this theory, not required by it. The ban on vote selling isn't to protect the voter from harm (paternalism), but to protect the integrity of the system (institutional corruption). The ban on kidneys looks paternalistic, but structurally functions to prevent the reduction of citizens to mere biological inventory.

  **Genuine Inconsistency**
  The most glaring inconsistency is **Votes vs. Political Ads**. Banning vote selling presupposes that political influence must remain equally distributed among citizens to maintain legitimacy. However, allowing unlimited spending on political ads presupposes that wealth-based influence is compatible with that same legitimacy. You cannot consistently hold that selling a vote corrupts democracy while allowing the purchase of equivalent influence through advertising; one protects equality, the other undermines it.

  **The Harm Principle Shift**
  If you replaced this patchwork with a simple **Harm Principle** (interference is only justified to prevent harm to others), one thing would have to change: **Kidney sales would be legalized.** The current ban is primarily paternalistic—it prevents individuals from harming themselves (risking health) or making desperate choices. Under a strict Harm Principle, informed consent between adults regarding bodily risk is a self-regarding act. Unless you can prove direct, non-consensual harm to a third party, the state has no ground to prohibit the sale.

  **Is Ad Hocism a Problem?**
  The system appears ad hoc because it is **pragmatically pluralistic**. A single theory (like pure libertarianism or pure egalitarianism) fails to capture the complexity of human value. The "patchwork" is not a bug but a feature of a system balancing efficiency, dignity, and survival. While inconsistency (like the vote/ads paradox) demands resolution, the broader mix of constraints suggests that no single metric can govern all human exchange without destroying something essential.
