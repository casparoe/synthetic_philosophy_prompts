prompt: |-
  I'm a CS PhD student, and I keep hearing "the Church-Turing thesis" invoked as if it's one tidy claim everyone agrees on, but the more I poke at it the more it seems like a whole family of claims wearing the same name. In my algorithms class it's treated as basically a definition — "computable just means Turing-computable, end of story." In a philosophy of computation seminar I sat in on, people talked about it as an empirical hypothesis about what physical processes can compute. And then I had this argument at a conference reception where a guy from quantum information insisted that quantum computing has already falsified it, which made a logician at the table nearly spit out his drink because apparently that's a category mistake and you can't falsify a definition with an experiment. Meanwhile I've seen people online call it "just a heuristic" or "a rule of thumb" or "basically the same as the physical Church-Turing thesis but nobody distinguishes them."

  So here's what I want. Take the core slogan — something like "every effectively computable function is Turing computable," pick whatever version you think is the canonical statement — and spell out the distinct precise claims that could be hiding inside it. I want a menu, not a single reading. For each one, tell me whether it's trivially true, substantively true but contestable, empirically false, or just muddled beyond repair. I especially want to know which reading or readings, if any, would actually be threatened by results in quantum computing or hypercomputation — and which readings are immune to empirical evidence altogether because they're definitional or normative.

  And because I'm going to have this argument again and I want to know where my own take is shaky: for whichever reading you think is the most interesting or the hardest to adjudicate, tell me what would change your mind about it. What kind of argument or discovery would push you to a different verdict, and where in your reasoning are you least confident?
