  # JOINT STATEMENT ON THE KNOBE EFFECT
  **Adversarial Collaboration on the Structure of Intentional Action Judgments**

  **Date:** October 26, 2023
  **Signatories:** [Representatives of the Conceptual View] & [Representatives of the Deflationary View]

  ## 1. Agreed-Upon Claims and Constraints

  Both camps affirm the following claims as the baseline for further inquiry. These claims are intended to isolate the phenomenon from theoretical interpretation.

  1.  **Robustness of the Asymmetry:** In the standard Chairman vignette (and close variants), a statistically significant asymmetry exists in intentionality attributions between the Harm and Help conditions among adult English speakers, despite identical descriptions of the agent's belief, desire, and causal contribution regarding the side effect.
  2.  **Constancy of Causal Structure:** Both sides agree that the *causal* relationship between the agent's decision and the side effect is held constant across conditions. The agent does not strive for the side effect in either condition, but foresees it as a certain consequence of striving for profit.
  3.  **The "Not Caring" Clause:** Both sides acknowledge that the standard vignette includes the phrase "I don't care at all about [the side effect]." Both sides agree this phrase is a potential confound, but disagree on whether it is the *source* of the effect or merely a natural expression of the mental state required for the scenario.
  4.  **Relevance of Folk Intuitions:** Both sides agree that systematic patterns in folk judgments are data that any theory of the concept "intentional" must accommodate. A theory that dismisses the asymmetry as mere "noise" without explaining its systematicity is inadequate.
  5.  **Normative Sensitivity:** Both sides agree that normative status (good/bad, right/wrong) correlates with intentionality judgments in these cases. The disagreement is strictly regarding *why* this correlation exists (constitutive vs. performance).
  6.  **Constraint on Adequacy:** Any adequate account must explain why the asymmetry persists even when subjects are explicitly asked to ignore the moral value of the outcome, and why it diminishes or disappears in specific controlled variations (e.g., certain non-moral normative contexts).

  ## 2. Statement of Residual Disagreement

  The disagreement concerns the **locus of normative influence** in the cognitive architecture underlying intentionality judgments.

  *   **The Conceptual View:** Holds that normative considerations are **constitutive** of the folk concept of intentional action. On this view, the truth conditions for applying the predicate "intentionally" include a normative component. To judge an action as intentional is, in part, to evaluate the agent's relationship to normative reasons. Therefore, the asymmetry reveals the semantic structure of the concept itself.
  *   **The Deflationary View:** Holds that normative considerations are **extrinsic** to the concept of intentional action. On this view, the concept is purely descriptive (involving belief, desire, and causation). The asymmetry arises from performance factors, such as conversational pragmatics (e.g., the implicature of "intentionally" suggesting blame), salience of negative outcomes, or the specific pragmatic force of phrases like "I don't care." Therefore, the asymmetry reveals features of the judgment *process*, not the concept *content*.

  **Crucial Distinction:** The Conceptual View predicts that removing normative pressure removes the concept's application conditions. The Deflationary View predicts that removing normative pressure removes the *bias* obscuring the concept's true application conditions.

  ## 3. Disagreements Table (Cruxes and Tests)

  The following table identifies specific empirical cruxes. For each, we specify a test both sides agree is diagnostic, and record pre-registered predictions.

  | Crux | Diagnostic Test / Manipulation | Conceptual View Prediction | Deflationary View Prediction | Falsification Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The "Not Caring" Artifact** | **Manipulation:** Compare the standard vignette ("I don't care") against a neutral phrasing ("I am aware this will happen, though it is not my goal") where the agent expresses indifference without using the emotionally loaded phrase "don't care." | The asymmetry will **persist** with similar magnitude. The phrase merely expresses the mental state; it does not create the effect. | The asymmetry will **significantly diminish or vanish**. The phrase "I don't care" conversationally implicates acceptance of harm in a way it does not for help. | If asymmetry persists in neutral phrasing, Deflationary "Linguistic Artifact" models are falsified. |
  | **2. Non-Moral Norms** | **Manipulation:** Vignettes involving violations of etiquette or arbitrary rules (e.g., wearing a mismatched uniform) rather than moral harm/benefit. | The asymmetry will **persist**. The concept is sensitive to *normative* deviance generally, not just moral blame. | The asymmetry will **diminish or vanish**. Without moral blame or serious consequence, the pragmatic pressure to assign intentionality for negative outcomes is removed. | If asymmetry disappears in non-moral normative cases, the "Normative Concept" view is weakened in favor of a "Moral Blame" performance model. |
  | **3. Cognitive Load** | **Manipulation:** Subjects perform a secondary working-memory task while reading the vignette and making judgments. | The asymmetry will **persist** or increase. If the concept is constitutively normative, automatic processing should retain the link. | The asymmetry will **diminish**. If the effect is a pragmatic inference or bias, cognitive load should disrupt the extra processing required to generate the asymmetry. | If load eliminates the effect, it suggests the asymmetry is a performance artifact rather than a conceptual competence. |
  | **4. Explicit Mental State Attribution** | **Manipulation:** Subjects are forced to attribute Belief and Desire to the agent *before* being asked about Intentionality, with explicit instruction that Intentionality depends *only* on those prior answers. | The asymmetry will **persist**. Intentionality judgments are not fully mediated by belief/desire attributions; normative status acts independently. | The asymmetry will **vanish**. Once the descriptive mental states are fixed and salient, the pragmatic need to use "intentional" to signal blame is bypassed. | If fixing mental state attributions removes the asymmetry, it suggests the concept is descriptive, and the standard effect is due to shifting mental state attributions. |

  ## 4. Note on Verbal Dispute

  We acknowledge that a portion of this dispute is **merely verbal**, specifically regarding the definition of the word "concept."

  *   If "concept" is defined as **classical semantic content** (necessary and sufficient conditions independent of context), the Deflationary View is tautologically true by definition, and the Conceptual View is false.
  *   If "concept" is defined as **psychological categorization criteria** (the actual cognitive rules used by speakers to apply a term in context), the Conceptual View is empirically robust, and the Deflationary View risks dismissing the data as "performance."

  **Resolution:** We agree to treat this not as a semantic debate about the word "concept," but as an empirical debate about **cognitive architecture**. The question is not "What is the definition of 'concept'?" but "Does the cognitive system responsible for applying the word 'intentional' take normative value as an input parameter?"

  If the experimental results in Section 3 show that normative inputs are *necessary* for the standard pattern of judgments even when linguistic artifacts are controlled, the Conceptual View wins on the merits of the cognitive model, regardless of semantic labeling. If the results show the pattern dissolves under controls that isolate descriptive mental states, the Deflationary View wins. We commit to updating our positions based on the outcomes in the table above.
