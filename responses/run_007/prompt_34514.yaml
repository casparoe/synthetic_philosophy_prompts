      *   **(i) + (iii):** Compatible. If selves are just momentary bundles, they exist at specific nodes in the branching structure. No persisting self needed to traverse the branches.
      *   **(ii) + (iii):** Compatible. Borges argues exactly this in *A New Refutation of Time*. If time is static/illusory, the persisting self is also illusory.
      *   **(iii) + (iv):** **Tension.** If the self is an illusion (iii), why does the *experience* of the self making choices matter (iv)? If the self is just a bundle of experiences, who is experiencing the "weight" of decisions? This is the "Hard Problem" of consciousness applied to the self. However, one can argue the *experience* is real even if the *entity* having it is not (Humean view). So it's manageable but needs careful phrasing.
      *   **(iv) + (v):** **Major Tension.** (iv) says the experience of choice/flow matters and is real/important. (v) says regret (a key part of that experience) makes no sense/is confusion. If the phenomenology of choice is real and weighty, then the negative valence of regret should also be real and weighty. Dismissing regret undermines the importance of the phenomenology claimed in (iv).
      *   **(i) + (v):** **Tension.** Just because another branch exists where you chose differently doesn't negate the reality of *this* branch's outcome. Lewisian Modal Realism usually suggests you should care about your actual branch. Saying regret makes *no sense* because other versions exist is a non-sequitur unless you adopt a "God's eye view" which contradicts the embedded phenomenology in (iv).
      *   **(iii) + (v):** **Tension.** If there is no persisting self, regret is indeed strange (who is regretting?). But usually, this leads to compassion or detachment, not necessarily the claim that it "makes no sense." However, the logic holds: if I'm not the same person, why do I care? But combined with (iv), it gets messy.

