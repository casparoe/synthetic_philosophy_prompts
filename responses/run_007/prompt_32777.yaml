answer: |-
  You are absolutely right to be frustrated. The phrase "separate the art from the artist" is a philosophical Swiss Army knife: people pull it out to cut different things, but they pretend it's just one tool. When your friend accuses you of "collapsing ethics into aesthetics," they are using jargon to shield a specific (and contestable) philosophical position.

  Here is the breakdown you need to stop the loop. There are **four distinct claims** hiding under that slogan. Only one of them is obviously true, one is psychologically impossible, and the other two are matters of intense philosophical debate.

  ### 1. The Metaphysical Claim
  **"The work exists independently of the creator."**
  *   **What it means:** Once a film is finished, it is an object in the world. Its lighting, script, acting, and editing are fixed properties regardless of who directed it.
  *   **Plausibility:** **High.** This is trivially true. *Chinatown* is the same sequence of images whether Polanski directed it or an AI did.
  *   **Does it win the argument?** **No.** Just because the film *exists* independently doesn't mean our *engagement* with it is independent. A knife exists independently of whether it was used in a murder, but you might not want to hold it.

  ### 2. The Psychological Claim
  **"You can (and should) bracket out knowledge of the artist to experience the work purely."**
  *   **What it means:** You have the mental capacity to watch the film without thinking about the director's crimes.
  *   **Plausibility:** **Low/Nonsense.** This is what you pushed back on last week. You cannot "un-know" context. Meaning is generated in the collision between the text and the viewer. If a film features a powerful man abusing a young woman, and you know the director was a rapist, the text resonates differently. That isn't a failure of your viewing; it's how interpretation works.
  *   **Does it win the argument?** **No.** If your friend insists you *can* do this, they are denying the reality of how human cognition and context function.

  ### 3. The Normative Claim
  **"You have a duty to evaluate the work on its own merits, regardless of the artist."**
  *   **What it means:** This is the **stronger claim** you suspected people were making. It argues that it is a *category error* to let moral judgment interfere with aesthetic judgment. To let Polanski's crimes lower your rating of *Chinatown* is, in their view, bad criticism.
  *   **Plausibility:** **Contested.** This is the heart of the debate between **Aesthetic Autonomism** (art is its own realm) and **Ethical Criticism** (art is a human act embedded in morality).
  *   **Does it win the argument?** **Not necessarily.** Many philosophers (like Berys Gaut or Noel Carroll) argue for "Moderate Moralism": the idea that ethical flaws *can* be aesthetic flaws if they disrupt the narrative or thematic coherence. If a film asks you to sympathize with a predator, and the director is a predator, the film's moral perspective might feel unearned or sickening, which *is* an aesthetic problem.

  ### 4. The Complicity Claim
  **"Consuming the art does not make you complicit in the artist's crimes."**
  *   **What it means:** Watching *Chinatown* today doesn't fund Polanski or endorse his actions.
  *   **Plausibility:** **Nuanced.** If the artist is dead or not receiving royalties, financial complicity is low. However, "cultural complicity" (keeping their legacy alive, platforming their name) is real.
  *   **Does it win the argument?** **Only partially.** It addresses whether you are *harming* anyone by watching, but it doesn't address why you feel *icky* watching.

  ---

  ### What "Collapsing Ethics into Aesthetics" Actually Means

  When your friend accused you of this, they were invoking a specific debate from the philosophy of art.

  *   **The Charge:** They are claiming you are confusing **Moral Goodness** with **Artistic Goodness**.
  *   **The Logic:** They believe a film can be morally repugnant but aesthetically brilliant (e.g., *Triumph of the Will* is Nazi propaganda, but cinematically groundbreaking). If you say *Chinatown* is "worse art" because Polanski is a criminal, they argue you are committing a logical error. You are judging the *person*, not the *pixels*.
  *   **The Counter-Argument (For You):** You aren't saying the *editing* is worse. You are saying that **art is communication.** If the sender of the message (Polanski) has corrupted the channel through their actions, the message lands differently.
      *   *Chinatown* is about power, corruption, and the violation of innocence. Knowing the director violated innocence in real life doesn't just change your moral view; it changes the **tone** of the film. It can make scenes feel exploitative rather than critical.
      *   Therefore, the ethical defect *becomes* an aesthetic defect because it alters the viewer's engagement with the text. You aren't collapsing the two; you are arguing they are intertwined.

  ### So, Are You Wrong To Feel Icky?

  **No.** Here is why:

  1.  **The "Death of the Author" cuts both ways.** If we accept that the author's *intent* doesn't matter (as Roland Barthes argued), then the author's *biography* shouldn't be worshipped either. But if we accept that context matters, then the context of the creator's morality is part of the work's reception. You cannot have it both ways.
  2.  **Aesthetic Experience is Holistic.** We don't experience films in a vacuum. We experience them as humans with moral frameworks. If a film triggers a moral revulsion that distracts from the narrative immersion, that is a legitimate aesthetic critique. It's like watching a movie with a scratch on the reel; the "itch" in your brain is a disruption of the aesthetic experience.
  3.  **The Normative Claim is a Preference, Not a Law.** Your friends are presenting "Aesthetic Autonomism" as the default setting for film criticism. It isn't. It is just one lens. Ethical Criticism is another valid lens. Using it doesn't make you a bad critic; it makes you a critic who values the human context of art.

  ### How to Break the Loop

  Next time someone says "separate the art from the artist," ask them: **"Which claim are you making?"**

  *   If they mean **"Polanski didn't edit the negatives in the screening room,"** agree, but say it's irrelevant to your experience.
  *   If they mean **"You should be able to ignore his crimes,"** tell them that's psychologically impossible and intellectually dishonest.
  *   If they mean **"Watching this doesn't fund him,"** agree, but clarify that your discomfort isn't about funding, it's about **resonance.**
  *   If they mean **"It's a category error to let ethics affect aesthetic judgment,"** tell them you subscribe to **Moderate Moralism:** when a work's moral perspective is tainted by the creator's actions, it can diminish the work's coherence and power.

  **The Verdict:** The slogan is usually used as a conversation-stopper to protect the canon from discomfort. It relies on the **Normative Claim** (you *ought* to ignore this), which is not a fact, but a preference. You are not wrong to feel icky; you are simply refusing to accept a compartmentalization of art that they find convenient but you find false.
