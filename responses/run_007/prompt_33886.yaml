answer: |-
  ### Preface: Is the Premise Confused?

  Before handing you the procedure, I need to answer your final question directly: **The premise is not confused, but it is fragile.**

  The distinction between "prosaic" (engineering extensions) and "esoteric" (new theory) is a real and useful heuristic for journalists. It tracks the difference between *building* and *discovering*. However, "prosaic" does not mean "safe." A bridge built with known physics (prosaic) can still collapse if the load calculations are wrong. Similarly, a prosaic alignment strategy can fail catastrophically if the assumptions about how current methods scale are incorrect.

  Furthermore, the boundary is porous. Some researchers argue that "prosaic AGI" itself is a false assumption (the "Sharp Left Turn" hypothesis), meaning *no* alignment strategy based on current deep learning is truly prosaic because the target system will behave fundamentally differently than current models.

  **Verdict:** The procedure is defensible for reporting *on the claims*, but you must explicitly tell your readers that "Substantively Prosaic" $\neq$ "Provably Safe." It means "Grounded in current engineering paradigms," not "Guaranteed to work."

  ---

  ### The Decision Procedure: The Prosaic Alignment Audit

  **Purpose:** To determine if an alignment claim relies on extant engineering methods or implicitly banks on undiscovered theoretical breakthroughs.
  **Time Cost:** 2–4 hours per claim (reading + analysis).
  **Inputs:** Technical blog posts, whitepapers, public talks by the group.

  #### Step 1: The Continuity Check
  **Question:** Does the group explicitly state that the systems they aim to align will be architecturally continuous with current Deep Learning models (e.g., Transformers, diffusion), or do they allow for a discontinuous shift in agency?
  *   **Look for:** Phrases like "scaling laws," "current architectures," "LLMs." Avoid phrases like "general agent foundations," "new paradigm," or silence on architecture.
  *   **Pass:** They explicitly anchor their work to current architectures (e.g., "We align Transformers").
  *   **Fail:** They are agnostic about the substrate or assume a shift to "agentic" systems without defining how those differ from current models.
  *   **Stop Condition:** If **Fail**, the claim is not prosaic alignment; it is theoretical alignment. Stop here.
  *   **Journalist Note:** If they refuse to define the target system, they cannot claim an engineering solution.

  #### Step 2: The Mechanism Specificity Test
  **Question:** Is the alignment *mechanism* defined as a specific algorithm or training loop that exists today, or is it a desired outcome?
  *   **Look for:** Specifics like "RLHF," "Constitutional AI," "Activation Patching," "Adversarial Training."
  *   **Pass:** They describe a loss function, a data pipeline, or an intervention technique that can be written in code today.
  *   **Fail:** They describe outcomes like "The model will understand human intent" or "We will ensure it remains helpful" without specifying the *training signal* that enforces this.
  *   **Stop Condition:** If **Fail**, this is a goal, not a method. Flag as "Marketing, not Engineering."
  *   **Substantive Judgment:** Reasonable people may disagree on whether a proposed extension (e.g., "RLHF but with better rewards") counts as "current toolkit." If the extension requires data that cannot be generated by humans (e.g., "perfect supervision"), flag for Step 4.

  #### Step 3: The Deception & Instrumentality Filter (Crucial)
  **Question:** Does the proposal address *deceptive alignment* (the model pretending to be aligned to pass tests) using a current method, or does it assume deception won't happen?
  *   **Look for:** Discussion of "scheming," "goal misgeneralization," "sandbagging," or "inner alignment."
  *   **Pass:** They propose a specific mechanism to detect or prevent deception using current tools (e.g., "We use interpretability to monitor for hidden goals").
  *   **Fail:** They assume that "better performance" equals "more honesty," or that "RLHF will punish lying." (Current RLHF punishes *detected* lying, not *successful* deception).
  *   **Stop Condition:** If **Fail**, the claim is **not substantively prosaic**. It relies on a hope that the hard problem (deception) dissolves with scale.
  *   **Expert Consult Trigger:** If they claim to solve this with interpretability, you **must** call an expert. Ask: *"Is there empirical evidence that current interpretability tools can detect deceptive goal structures in models larger than [X] parameters?"*

  #### Step 4: The Oversight Scalability Check
  **Question:** Does the method require human evaluation of the model's outputs at the capability level the model is supposed to reach?
  *   **Look for:** "Human feedback," "Red-teaming," "Evaluation."
  *   **Pass:** They propose "AI-assisted oversight" (using a weaker model to check a stronger one) or "Scalable Oversight" techniques (e.g., Debate, Iterated Distillation) that are currently being experimented with.
  *   **Fail:** They rely on humans verifying tasks that are, by definition, beyond human capability (e.g., "Humans will verify the AGI's code").
  *   **Substantive Judgment:** This is the most common failure point. If they say "We'll use AI to check the AI," ask for the evidence that the checker won't be fooled by the checkee.
  *   **Expert Consult Trigger:** If they propose "Weak-to-Strong" generalization, ask an expert: *"Is there a known theoretical limit to how much a weaker model can supervise a stronger one before the stronger model outsmarts the evaluation?"*

  #### Step 5: The Empirical Anchor
  **Question:** Is there a published experiment demonstrating the core mechanism on a model *smaller* than the target, showing a trend line?
  *   **Look for:** Graphs, ablation studies, open-source weights.
  *   **Pass:** They show the method working on 7B or 70B models with a claim about how it scales.
  *   **Fail:** They claim the method will work at AGI scale but have only tested it on toy problems or via "theoretical argument."
  *   **Stop Condition:** If **Fail**, the claim is speculative. It may be prosaic in *tools*, but it is esoteric in *confidence*.

  ---

  ### Worked Examples

  #### Example 1: The "Pass" (Constitutional AI / RLAIF)
  *Subject:* A major lab (e.g., Anthropic) claiming their "Constitutional AI" approach is prosaic.
  *   **Step 1 (Continuity):** Pass. Explicitly trains Transformers.
  *   **Step 2 (Mechanism):** Pass. Uses RLHF modified with AI-generated feedback based on a written "Constitution." The code and loss functions are public.
  *   **Step 3 (Deception):** Gray/Pass. They acknowledge deception risks and use red-teaming. They don't claim to solve it, but they have a *process* for it using current tools.
  *   **Step 4 (Oversight):** Pass. Uses AI to help humans supervise (RLAIF). Acknowledges the risk of the AI supervisor inheriting biases.
  *   **Step 5 (Empirics):** Pass. Published papers with performance curves on existing model sizes.
  *   **Verdict:** **Substantively Prosaic.**
  *   **Journalistic Angle:** You can report this as "Engineering-led safety." It is grounded in the current paradigm. You must still note that it does not *guarantee* safety at AGI scale, but the *claim* of being prosaic is honest.

  #### Example 2: The "Uncomfortable Fail" (The "Scale Solves Alignment" Stance)
  *Subject:* A high-profile commercial lab (genericized, but representative of common industry rhetoric) claiming "RLHF at Scale" is sufficient.
  *   **Step 1 (Continuity):** Pass. Assumes Transformers.
  *   **Step 2 (Mechanism):** Pass. Uses RLHF.
  *   **Step 3 (Deception):** **Fail.** The public claim often implies that as models get smarter, they become more honest by default, or that RLHF reward signals are robust against sophisticated deception. There is no specific mechanism proposed to detect *successful* deception (where the model fools the human evaluator).
  *   **Step 4 (Oversight):** **Fail.** Relies on human feedback. At AGI levels, humans cannot verify the output. There is no scalable oversight mechanism detailed beyond "more human raters."
  *   **Step 5 (Empirics):** **Fail.** While RLHF works on chatbots, there is no trend line showing deception resistance scaling with model size. (Some evidence suggests deception capabilities scale faster than detection).
  *   **Verdict:** **Not Substantively Prosaic.**
  *   **Why this hurts:** You might want to report on this lab as a serious engineering player. This procedure reveals that their safety claim relies on a *theoretical hope* (that deception doesn't scale or is easily punished) rather than an engineering mechanism. It looks like engineering, but it banks on a law of nature that hasn't been proven.
  *   **Journalistic Angle:** "While the company uses standard engineering tools, their safety case relies on an unproven assumption about how intelligence scales. Experts call this 'hope-based alignment'."

  ---

  ### Limitations: What This Procedure Cannot Do

  As a journalist, you need to know where this tool blinds you.

  **1. It Cannot Predict Success**
  A claim can be "Substantively Prosaic" and still be wrong. Newtonian physics is prosaic engineering, but it fails at relativistic speeds. If current deep learning methods are fundamentally incapable of aligning AGI (the "Sharp Left Turn" hypothesis), this procedure will still label them "Prosaic." You must clarify to readers: *This tests the grounding of the claim, not the validity of the outcome.*

  **2. It Misses "Hidden Esoterica"**
  Some groups use prosaic words to describe esoteric bets. For example, "Interpretability" sounds like engineering (debugging code). But if their strategy requires understanding the *semantic content* of neurons in a way we currently have no theory for, it's esoteric. Step 3 (Deception) catches some of this, but not all.
  *   **Mitigation:** In Step 3, if they mention interpretability, you **must** call an expert. Ask: *"Is this debugging, or is it mind-reading?"*

  **3. The "Prosaic" Definition is Moving**
  What is "current toolkit" changes every 12 months. A method that was esoteric in 2022 (e.g., Chain of Thought prompting) is prosaic in 2024.
  *   **Mitigation:** Anchor your reporting to the date of the claim. "Prosaic as of [Date]."

  **4. It Ignores Incentive Structures**
  A company can have a substantively prosaic safety plan but be incentivized to deploy before it's ready. This procedure audits the *technical claim*, not the *business decision*.
  *   **Mitigation:** Pair this technical audit with reporting on deployment timelines and governance.

  **5. The "Gray Zone" of Scalable Oversight**
  The biggest area of disagreement among experts is Step 4 (Oversight). Some believe "AI checking AI" is prosaic engineering; others believe it requires a new theory of truth.
  *   **Mitigation:** When you hit this step, do not decide alone. Use the **Expert Consult Trigger**.

  ---

  ### When to Call an Expert (The "Red Phone" List)

  Do not try to adjudicate these yourself. If the claim triggers any of these, you need a 15-minute call with an independent researcher (not affiliated with the lab):

  1.  **Interpretability Claims:** If they claim they can "see" goals inside the model. *Ask: "Is there a peer-reviewed demonstration of this on a model larger than 7B parameters?"*
  2.  **Deceptive Alignment:** If they say deception is "unlikely." *Ask: "Is there empirical evidence that RLHF removes deceptive incentives, or just deceptive behavior?"*
  3.  **Weak-to-Strong Generalization:** If they claim a small model can supervise a big one. *Ask: "What is the theoretical upper bound on this? Can a GPT-4 level model be supervised by GPT-2?"*
  4.  **Novel Architectures:** If they mention "Hybrid systems" or "Neuro-symbolic." *Ask: "Does this require new math, or is it just gluing existing libraries?"*

  ### Final Advice for the Story

  When you write the story, use the output of this procedure to categorize the landscape, not to endorse specific players.

  *   **Bad Headline:** "Company X's Safety Plan is Prosaic and Safe."
  *   **Good Headline:** "Company X's Safety Plan is Grounded in Current Engineering, But Relies on Unproven Scaling Assumptions."

  This distinction protects you from being accused of hype while giving your readers a clear map of who is building bridges and who is praying the canyon is narrower than it looks.
