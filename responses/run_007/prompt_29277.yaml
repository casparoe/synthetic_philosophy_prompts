answer: |-
  The antitrust distinction between "management" (inside the firm) and "conspiracy" (between firms) presents a profound theoretical puzzle, often traced back to Ronald Coase's question in *The Nature of the Firm*: if markets are efficient, why do firms exist? If firms are efficient, why do we need markets? Antitrust doctrine resolves this pragmatically by treating the legal boundary of the corporation as an epistemic and normative firewall. To understand what this implies about economic knowledge, we must reconstruct the implicit theory of information and calculation that underpins the law, evaluate its relationship to the Socialist Calculation Debate (Mises–Hayek vs. Lange), and explore the consequences of shifting that theoretical foundation.

  ### 1. The Implicit Theory of Economic Knowledge

  Antitrust doctrine presupposes a theory of knowledge that is **contingent on property rights and incentive structures**, rather than one based solely on the technical feasibility of information processing.

  **Where Information Lives:**
  The law implicitly assumes that the information required for rational allocation is **localizable** within the firm but **dispersed** across the market. Inside the firm, the doctrine assumes that a central authority (management) can access, aggregate, and act upon the necessary data to allocate resources efficiently. This information is treated as codifiable and transmittable up a hierarchy. Outside the firm, the law assumes knowledge is tacit, private, and dispersed among competitors; no single actor can access a rival's cost structures or demand curves without explicit (and illegal) communication.

  **Who Can Possess It:**
  Possession of allocative knowledge is tied to **residual claimancy**. The doctrine assumes that a manager within a merged firm possesses the *right kind* of knowledge because they bear the financial risk of being wrong. The unity of ownership aligns the incentive to gather information with the incentive to use it efficiently. Conversely, independent manufacturers fixing prices possess the same technical data, but because they retain separate profit centers, the law assumes they will use that knowledge to restrict output and raise prices (rent-seeking) rather than to optimize social welfare.

  **Can Command Reproduce Prices?**
  Antitrust law answers this conditionally. It assumes command *can* reproduce the efficiency of prices **inside** the firm, but only because the firm is disciplined by **external** market prices. The internal transfer prices are valid because the firm as a whole faces a competitive market test. If the firm fails to calculate rationally, it loses money and exits. Therefore, the doctrine presupposes that central direction is a valid substitute for market pricing *only when* the directing entity is subject to the survival pressure of the market. Coordination by agreement among independents is condemned because it insulates the participants from that pressure, allowing them to set prices without the disciplinary feedback loop of competition.

  ### 2. Mises–Hayek vs. Lange: Strict Presuppositions vs. Theoretical Fit

  To determine whether antitrust is committed to the Mises–Hayek view (markets are indispensable for calculation) or compatible with the Lange view (central boards can simulate markets via trial and error), we must distinguish between the law's operational necessities and the economic theories that explain them.

  **Is it Committed to Mises–Hayek?**
  Strictly speaking, **no.** The strong Mises–Hayek position argues that rational economic calculation is *impossible* without market prices because knowledge is inherently dispersed and tacit. If antitrust were strictly committed to this view, it would view internal firm planning with deep suspicion, potentially viewing large corporations as irrational bureaucratic behemoths incapable of efficient allocation. Yet, the law facilitates mergers and protects internal planning rights.
  *However*, the doctrine **fits well** with a moderated Hayekian view: that while internal planning is possible, it is only reliable when disciplined by external competition. Antitrust protects the *process* of competition (the market) rather than the *outcome* of specific prices. It assumes that without the competitive discovery procedure between independent firms, the knowledge inside the firms will be misused.

  **Is it Compatible with Lange?**
  The doctrine is **incompatible** with a consistent Lange-style view. Oskar Lange argued that a central planning board could achieve Pareto efficiency by simulating the market through trial and error (iterative price adjustments). If this were true, a cartel of independent firms acting in concert could theoretically function as a "central board," adjusting prices via trial and error to clear the market.
  Antitrust law rejects this possibility *a priori*. It treats price-fixing among independents as per se illegal (or heavily presumptive), regardless of whether the price set happens to be "competitive." The law assumes that independent entities lack the **unified objective function** of a Lange-style planner. A cartel aims to maximize member profits (monopoly pricing), whereas a Lange board aims to equate price with marginal cost (social welfare).
  *Strict Presupposition:* The law presupposes that **incentive alignment** (via merger/ownership) is a prerequisite for rational calculation. It assumes that without unified ownership, "trial and error" will converge on monopoly prices, not equilibrium prices.

  **Summary of Commitment:**
  Antitrust doctrine is not committed to the epistemic claim that calculation is *impossible* without markets (Mises), nor is it compatible with the claim that calculation is *possible* via agreement without integration (Lange). It is committed to a **Property Rights Theory of Knowledge**: information can be utilized rationally by a central director only when that director internalizes the costs of error through unified ownership.

  ### 3. Consequences of Adopting the Lange-Style View

  If antitrust doctrine were to consistently adopt the Lange-style view—that a central agent (or a group acting as one) can rationally set prices via trial and error to mimic market outcomes—the legal and theoretical landscape would shift dramatically.

  **Changes in Antitrust Doctrine:**
  1.  **End of Per Se Illegality:** Price-fixing would no longer be a criminal offense or per se illegal. Instead, it would be treated as a form of "private regulation."
  2.  **Shift to Rate Regulation:** Courts or regulatory agencies would become the "Lange Board." Their task would not be to prohibit agreements, but to audit them. They would have to determine if the agreed-upon prices were the result of a genuine "trial and error" process that mimicked competitive equilibrium (P = MC) or if they were monopoly prices. Antitrust would transform from a legal prohibition on collusion into a system of **utility-style rate regulation** applied across all industries.
  3.  **Rule of Reason on Steroids:** Every coordination agreement would require a complex economic analysis to verify if the "central planners" (the cartel) were acting benevolently. The legal burden would shift from proving the existence of an agreement to proving the inefficiency of the price set.

  **Changes in the Theory of the Firm:**
  1.  **Dissolution of the Boundary:** The sharp legal line between "firm" and "market" would blur. If independent entities can coordinate as rationally as a merged entity (given the right feedback loops), the legal necessity of merger to achieve efficiency vanishes. The firm becomes merely a node in a network of planned coordination.
  2.  **Incentive Irrelevance:** The Lange view assumes the planner acts in the social interest. Adopting this would require ignoring the incentive problem that antitrust currently prioritizes. The theory of the firm would have to assume that managers of independent companies could be trusted to set prices for social welfare rather than shareholder profit, or that regulators could perfectly constrain them to do so.
  3.  **Calculation Supersedes Competition:** The focus of economic organization would shift from *competitive discovery* (Hayek) to *computational accuracy* (Lange). The market would no longer be seen as a discovery procedure for dispersed knowledge, but as an algorithm that can be run by any sufficiently informed central agent, regardless of ownership structure.

  ### Conclusion

  Antitrust doctrine rests on a hybrid theory: it accepts that central calculation is feasible within the firm (rejecting strong Misesian skepticism) but insists that such calculation is only trustworthy when backed by unified property rights and disciplined by external competition (rejecting Lange-style optimism about agreements). It assumes that knowledge is not just data, but data coupled with the *incentive* to use it correctly. To adopt the Lange view consistently would be to abolish antitrust as we know it, replacing the prohibition of collusion with a regime of pervasive price regulation, and dissolving the legal significance of the firm's boundary.
