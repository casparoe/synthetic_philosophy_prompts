prompt: |-
  I'm giving a paper next month at a workshop that's half philosophers of social science and half evolutionary game theorists. The thesis is that Lewis basically got the content of a convention right — an arbitrary but self-perpetuating equilibrium in a recurring coordination problem — but his mechanism for how conventions get started (precedent, common knowledge, a standing preference for conformity) can't do the origin work, so I add an evolutionary story where norms begin as local regularities that spread by imitation and payoff advantage and only later pick up the common-knowledge structure Lewis describes. My argument sketch: (1) set up a simple 2x2 coordination game with multiple equilibria; (2) argue that the Lewisian selection story already presupposes a history of interaction, so it can't explain the first run; (3) simulate a population under a replicator dynamic with local interaction and show a stable convention emerging without anyone representing the whole equilibrium; (4) claim the resulting regularity counts as a Lewis convention once agents form the relevant expectations; (5) conclude that the evolutionary process is the origin story and Lewis's account is the mature-state description, not the selection mechanism. The room includes two hardcore rational-choice people who think an evolutionary explanation either reduces to individual incentives or changes the subject, and a few modelers who think common knowledge is unfalsifiable and philosophers use the word norm too loosely. Give me a Q&A prep sheet: the objections I'll actually get, in roughly the order they'll come, phrased the way these people would put them, which ones have real force, what I should concede up front, the weakest part of my argument I should prepare to defend rather than hope they miss, and the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Academic philosopher/social scientist giving a paper at a workshop.
      *   **Audience:** Mixed bag: 50% philosophers of social science, 50% evolutionary game theorists (EGT). Specific sub-groups mentioned: two hardcore rational-choice theorists (RCT), several modelers skeptical of common knowledge/norm loose usage.
      *   **Thesis:** Lewis was right about the *structure* of convention (arbitrary, self-perpetuating equilibrium in coordination problems) but wrong about the *origin* (precedent/common knowledge). Evolution (imitation/payoff) explains the origin; Lewis explains the mature state.
      *   **Argument Sketch:** 2x2 game -> Lewis presupposes history -> Replicator dynamic simulation (local interaction) -> Regularity becomes Lewisian once expectations form -> Evolution = origin, Lewis = mature state.
      *   **Task:** Create a Q&A prep sheet. Needs: Objections (in their voice), order, force assessment, concessions, weakest point defense, and the "dreaded question."

  2.  **Deconstruct the Argument & Identify Vulnerabilities:**
      *   *Claim 1: Lewis needs common knowledge/precedent for selection.*
          *   *Vulnerability:* Lewis actually allows for salience and Schelling points which don't strictly require prior *interaction* history, just prior *cognitive* history. RCT folks will pounce on this.
      *   *Claim 2: Evolution explains the origin without representation.*
          *   *Vulnerability:* Is it still a "convention" if agents don't know it's an equilibrium? Modelers might say "that's just a behavioral regularity, not a norm." Philosophers might say "you've changed the definition of convention."
      *   *Claim 3: The transition from evolutionary regularity to Lewisian convention.*
          *   *Vulnerability:* How exactly does the common knowledge snap into place? Is there a phase transition? If agents remain boundedly rational, do they ever achieve the CK required by Lewis?
      *   *Claim 4: Synthesis (Evolution + Lewis).*
          *   *Vulnerability:* The RCT folks might say "Evolution *is* just aggregated rationality over time" (reductionism). Or "If it's evolutionary, it's not rational choice, so you're mixing categories."

  3.  **Drafting the Objections (Voice & Persona):**
      *   *The Hardcore RCT Guy:* Needs to sound precise, focused on incentives, reductionist. "Where are the utilities?" "Isn't this just learning?"
      *   *The EGT Modeler:* Focused on dynamics, stability, definitions. "Replicator dynamic assumptions?" "Basin of attraction?"
      *   *The Philosopher:* Focused on definitions, normativity, common knowledge. "Is it still a norm?" "What counts as expectation?"

  4.  **Ordering the Objections:**
      *   Q1 usually clarifies the setup (Definition creep).
      *   Q2 attacks the core mechanism (RCT reductionism).
      *   Q3 attacks the transition (The "Snap" problem).
      *   Q4 attacks the simulation specifics (Model robustness).
      *   Q5 is the "Dreaded Question" (Normativity/Function).

  5.  **Developing the Content (Iterative refinement):**

      *   *Objection 1 (Definition):* "You're smuggling normativity in." Modelers hate loose uses of "norm."
      *   *Objection 2 (RCT):* "Evolution is just rationality in disguise." The two hardcore guys will argue that replicator dynamics converge to Nash, so it *is* about incentives.
      *   *Objection 3 (The Transition):* "When does the CK kick in?" This is the theoretical gap.
      *   *Objection 4 (Salience):* "Lewis had Salience. You don't need evolution."
      *   *The Dreaded Question:* "Why does this matter? What work does the 'Lewisian' layer do if the behavior is already fixed by evolution?"

  6.  **Refining the Advice (Concessions & Weak Points):**
      *   *Concede:* Lewis's account is idealized. Evolution is messy.
      *   *Weak Point:* The transition from blind imitation to common knowledge expectations. This is the hand-wavy part.
      *   *Strategy:* Don't fight the RCT guys on whether evolution leads to Nash. Fight them on *agency* and *representation*.

  7.  **Final Polish (Tone & Format):**
      *   Make it look like a cheat sheet.
      *   Use bolding for quick scanning.
      *   Ensure the "Voice" matches the specific audience segments described.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "local interaction" part? *Adjustment:* Make sure one objection targets the network structure assumptions.
      *   *Check:* Did I address the "common knowledge is unfalsifiable" crowd? *Adjustment:* Include an objection about operationalizing expectations.
      *   *Check:* Is the distinction between "regularity" and "convention" clear? *Adjustment:* Emphasize this in the "Weakest Point" section.

  9.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Here is a Q&A prep sheet tailored to your specific audience mix and argument structure.

  ### **Q&A Prep Sheet: Lewis + Evolution**

  **Audience Profile:**
  *   **The Rational Choice Hardliners (2):** Want to see individual incentives. Suspicious of "emergence" if it ignores micro-foundations.
  *   **The Modelers:** Care about dynamic stability, basin of attraction, and operational definitions. Hate "norm" being used as a catch-all.
  *   **The Philosophers:** Care about the definition of convention, common knowledge (CK), and normativity.

  ---

  ### **1. The Opening Salvo (Definition Creep)**
  **Who:** A Modeler or Analytic Philosopher.
  **The Question:** "You're simulating a behavioral regularity via replicator dynamics, but then you label it a 'Lewisian Convention' once expectations form. But Lewis requires the *reason* for action to be the expectation of others' conformity. In your simulation, the reason is payoff maximization via imitation. Haven't you just changed the subject? You've explained regularities, not conventions."
  **Force:** **High.** This attacks the core synthesis. If the *reason for action* doesn't change, you haven't added Lewis; you've just replaced him.
  **Your Move:**
  *   **Concede:** "You're right that in the early phase, it's just a regularity, not a full-blooded Lewisian convention."
  *   **Pivot:** "My claim isn't that the evolutionary phase *is* the convention, but that it creates the *conditions* for the Lewisian structure to become cognitively accessible. The 'convention' label applies to the stable state where agents *can* represent the equilibrium, even if they didn't need to to get there."
  *   **Key Phrase:** "I'm distinguishing the *genesis* of the pattern from the *maintenance* of the normativity."

  ### **2. The Rational Choice Reductionist Attack**
  **Who:** One of the Hardcore RCT Guys.
  **The Question:** "This seems like a distinction without a difference. If your evolutionary dynamic converges to a Nash Equilibrium, it's because the incentives drive it there. Evolution is just rationality aggregated over time with noisy agents. Why do we need an 'evolutionary story' distinct from 'individual incentives'? You haven't escaped rational choice; you've just buried the incentives in the fitness function."
  **Force:** **Medium-High.** They want to collapse your mechanism back into standard RCT.
  **Your Move:**
  *   **Do Not Concede:** Do not agree that evolution = rationality.
  *   **Defense:** "Standard RCT assumes agents solve the coordination problem *ex ante* via reasoning. My model shows agents solving it *ex post* via selection without representing the game structure. The 'incentive' exists, but the *agent's access* to that incentive is different. Lewis requires agents to know *why* they are coordinating; evolution doesn't."
  *   **Key Phrase:** "Equilibrium selection via reasoning vs. equilibrium selection via survival."

  ### **3. The "Common Knowledge is Magic" Objection**
  **Who:** A Modeler (skeptical of CK).
  **The Question:** "You say the convention 'picks up' the common knowledge structure later. How? In your simulation, when does the agent go from 'I do this because it worked yesterday' to 'I do this because I know you know I know...' ? Is there a threshold? If CK is unfalsifiable, how do you model the transition point?"
  **Force:** **High.** This targets the hand-wavy part of your sketch (Step 4).
  **Your Move:**
  *   **Concede Up Front:** "I am not modeling the epistemic logic of CK directly in the simulation. That's the philosophical layer I'm superimposing on the stable behavioral output."
  *   **Defense:** "I'm arguing that once the regularity is stable (say, 95% conformity), the *cost* of forming the CK expectation drops to near zero. The evolutionary process does the heavy lifting; the CK is just the cognitive overlay that stabilizes it against small perturbations."
  *   **Key Phrase:** "CK is the *software* that runs on the *hardware* built by evolution."

  ### **4. The Lewis Defense (Salience)**
  **Who:** A Philosopher of Social Science.
  **The Question:** "Lewis already anticipated this. He talks about 'salience' and 'precedent.' He doesn't require infinite common knowledge from day one. He allows for focal points. Why can't Lewis's account handle the origin story with just a salience tweak, without needing the whole evolutionary apparatus?"
  **Force:** **Medium.** Lewisians often argue Salience solves the first-run problem.
  **Your Move:**
  *   **Defense:** "Salience works for one-off games (Drive on the Left vs. Right). It fails for recurring, complex social norms where the 'focal point' isn't obvious until a pattern is established. Evolution explains how a non-salient option *becomes* salient through local clustering."
  *   **Key Phrase:** "Salience explains selection among *obvious* options; Evolution explains how an option *becomes* obvious."

  ### **5. The Normativity Trap**
  **Who:** A Philosopher.
  **The Question:** "If the behavior is fixed by evolutionary pressure, where is the normativity? If I deviate, I lose payoff. That's a constraint, not a norm. Lewisian conventions have a normative force ('I ought to conform'). Your agents just have a survival instinct."
  **Force:** **Medium.** Distinguishes "is" from "ought."
  **Your Move:**
  *   **Defense:** "The normativity emerges when the expectation forms. Once I expect you to conform, and I prefer to coordinate, I *ought* to conform. The evolutionary history explains why the expectation is reliable, but the 'ought' comes from the coordination preference, which I retain in the model."

  ---

  ### **The Weakest Point (Prepare to Defend)**
  **The Transition Mechanism (Step 4).**
  You claim the regularity *becomes* a Lewisian convention once expectations form. You have no model for *how* agents acquire the higher-order beliefs.
  *   **Preparation:** Expect them to grill you on whether boundedly rational imitators are *capable* of Common Knowledge.
  *   **Defense Strategy:** Lower the bar. Argue that "Common Knowledge" in real social science is often just "Mutual Belief up to a high enough order to sustain stability." Don't defend the logic of CK; defend the *functional role* of CK (stability against deviation).

  ### **What to Concede Up Front**
  1.  **Idealization:** Admit your simulation is highly abstract (2x2, specific network topology). Don't claim this explains *all* conventions, just a core class of coordination norms.
  2.  **Lewis's Normativity:** Concede that Lewis's account of the *normative force* is better than the evolutionary account. You are only claiming ownership of the *origin* story.
  3.  **CK Operationalization:** Admit you aren't solving the epistemic logic problem, only the behavioral selection problem.

  ### **The Question You Hope Nobody Asks**
  **"If the evolutionary dynamic stabilizes the behavior and makes deviation costly, what explanatory work is the 'Lewisian' layer actually doing? If the agents are already locked in by payoff and imitation, why do we need to posit that they form Common Knowledge expectations at all? Isn't the Lewisian structure epiphenomenal?"**

  *   **Why it's deadly:** It suggests your synthesis is redundant. If evolution does all the work, Lewis is just a story agents tell themselves.
  *   **Emergency Answer:** "The Lewisian structure explains *resilience* and *transmission*. Evolution explains how we got here; Lewisian expectations explain why we stay here when the payoff structure becomes ambiguous or when we encounter outsiders who don't share the evolutionary history. The CK layer allows for *reasoning* about the norm, which is necessary for teaching and explicit enforcement."

  ---

  ### **Tone Tips for the Room**
  *   **To the RCT Guys:** Use their language. Talk about "basins of attraction," "stochastic stability," and "micro-foundations." Don't sound like you're rejecting rationality, just relaxing the information assumptions.
  *   **To the Modelers:** Be precise about the simulation parameters. Acknowledge limitations of the replicator dynamic (e.g., assumes infinite population or specific matching).
  *   **To the Philosophers:** Keep the distinction between "regularity" and "convention" sharp. Don't let them accuse you of naturalistic fallacy.

  **Good luck. The synthesis is strong, but the "handshake" between the evolutionary phase and the epistemic phase is where they will try to break it.**
