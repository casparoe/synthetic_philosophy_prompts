answer: |-
  # The Weeping at the Matinée

  We buy the ticket for the seat of pain,
  And settle in to watch the murder done.
  We court the sorrow like a summer rain,
  Before the lights restore the common sun.
  Then tell the friend, 'You simply must attend,'
  Though warning them the ending brings a tear.
  'It breaks the heart, I promise, in the end,'
  And urge them near to share the heavy cheer.
  Perhaps a purge to cleanse the swollen vein,
  Or eloquence that makes the sorrow sweet.
  A make-believe that simulates the pain,
  Or joy to find our sympathy complete.
  The puzzle stands: we prize the heavy hour,
  Where art gives pain, and pain becomes the power.
