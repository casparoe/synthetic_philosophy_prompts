  Furthermore, this theory commits the law to token causation. It is not enough to show that the defendant's conduct generally causes such injuries; it must have caused this injury. This creates a commitment to singular causal claims that cannot be reduced to statistical regularities. The legal system demands a story about this specific accident, not just a correlation across a population. However, the practice is underdetermined in how it handles probability. While the strict but-for rule implies determinism, courts sometimes allow probabilistic evidence, such as epidemiological statistics, to meet the burden of proof. This suggests the law isn't fully committed to strict counterfactual dependence but uses it as a heuristic for responsibility. The theory also presupposes that the "world without the cause" is a coherent concept. In complex systems where variables are entangled, subtracting one cause might require rewriting too much history to make the counterfactual meaningful. Yet, the law proceeds as if these isolated comparisons are possible, assuming a modular universe where actions can be surgically removed without collapsing the surrounding context. This assumption of modularity is a strong theoretical commitment, ignoring systemic interdependence in favor of assigning individual blame. Additionally, the binary nature of liability presupposes that causation itself is all-or-nothing, rather than a matter of degree, forcing complex causal contributions into a yes-or-no framework suitable for judgment but potentially misaligned with physical reality. The exceptions for overdetermination reveal the theory's strain, requiring ad-hoc patches when strict counterfactual dependence fails to match moral intuition.

