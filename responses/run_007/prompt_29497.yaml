  1. The two practices, spelled out concretely

  In tort law, causation acts as the bridge between wrongful conduct and legal liability. To hold a defendant responsible for a plaintiff's injury, the court typically applies the "but-for" test. This asks a counterfactual question: would the harm have occurred absent the defendant's conduct? If the answer is no, factual causation is established. If the harm would have happened anyway, the defendant is off the hook. Courts recognize this test fails in overdetermination cases, such as two independent fires merging to burn a house, where either fire alone sufficed. Here, strict logic dictates neither fire is strictly necessary, yet both are treated as causes via special doctrines like substantial factor. Nevertheless, the core framework remains retrospective and individualistic, seeking a binary yes-or-no answer about a specific historical event. The plaintiff bears the burden of proving this link by a preponderance of the evidence, tying liability to a specific narrative of what happened to this specific person. The goal is corrective justice: making the victim whole by identifying the responsible party.

  In contrast, medicine and drug regulation operate prospectively and aggregately. The FDA rarely accepts observational data for efficacy claims, demanding randomized controlled trials (RCTs) instead. In an RCT, researchers actively intervene, randomly assigning subjects to treatment or control groups to isolate the variable's effect while blinding participants to prevent bias. The outcome is not a verdict on a specific patient's recovery but a statistical average across a population, known as the average treatment effect. The gold standard is manipulation: change the input and observe the distribution of outputs. While tort law asks whether this specific act caused this specific injury, regulatory science asks whether this intervention reliably produces this outcome across a class of subjects. The former seeks historical truth about a singular event; the latter seeks predictive reliability about a general phenomenon. This structural difference shapes how each field validates knowledge: one through logical reconstruction of the past, the other through experimental control of the future. The regulatory goal is public health safety, prioritizing false negatives over false positives, whereas tort law prioritizes compensating the injured party.

  2. What the but-for test presupposes about causation

