answer: |-
  Your skepticism touches upon the most potent and enduring critique of Julian Savulescu's Principle of Procreative Beneficence (PPB). You have identified the precise fault line where the theoretical architecture of "liberal eugenics" often fractures under the weight of social reality.

  To answer your specific question: **While a logical boundary can be drawn between PPB and state eugenics, a sociological or cultural boundary is far less stable.** The logic of PPB contains internal mechanisms that make the "spillover" you fear not just possible, but probable.

  Here is an analysis of why that boundary is difficult to maintain, structured around the three core tensions you identified.

  ### 1. The Expressivist Objection: Selection as Judgment
  You ask: *"Does this not entail a judgment that certain genetic profiles are simply less valuable... than others?"*

  In bioethics, this is known as the **Expressivist Objection**. Critics (such as Adrienne Asch and Erik Parens) argue that selecting against a specific trait (e.g., deafness, Down syndrome) expresses a negative judgment about people currently living with that trait. It signals that their lives are not worth starting.

  Savulescu's defense relies on a distinction between **valuing a life** and **valuing a trait**. He argues that one can believe a life with deafness is worth living (and that existing deaf people have equal moral status) while simultaneously believing that a life *without* deafness offers more opportunities for well-being. Therefore, selecting for hearing is not a judgment on the *worth* of deaf people, but a judgment on the *opportunities* available to the future child.

  **The Instability:** This distinction is conceptually coherent but psychologically and socially fragile. When society institutionalizes the selection *against* certain traits, the lived experience of people with those traits often shifts from "different but equal" to "preventable errors." The logic of PPB treats genetic traits as variables in a well-being equation. Once traits are variables to be optimized, the people who embody the "sub-optimal" variables inevitably face a diminished social standing. The logic of optimization does not easily stop at the womb; it tends to color how we treat those who were not "optimized."

  ### 2. From Moral Reason to Social Coercion
  You note that defenders distinguish PPB from state mandates. Savulescu argues this is about **individual moral obligation**, not law.

  **The Instability:** In a liberal society, strong moral obligations often transform into soft coercion. If PPB is accepted as a valid moral principle (that parents *ought* to select the best child), it creates a normative standard.
  *   **Stigma:** Parents who choose not to screen or who select embryos with disabilities may be viewed as morally negligent or selfish.
  *   **Insurance and Economics:** Even without state mandates, private institutions may pick up the logic. If it is "morally reasonable" to select for health, insurance companies might eventually refuse to cover treatments for conditions that could have been screened out, arguing that the parents failed in their moral duty of beneficence.
  *   **The "Tyranny of the Best":** As philosopher Michael Sandel has argued, when we move from accepting the "given" world to mastering it, we lose a sense of solidarity. If health and intelligence become products of parental choice rather than luck, society's willingness to support those who are unlucky (or "poorly designed") may erode.

  The boundary between "individual choice" and "systematic pressure" dissolves when the individual choice is framed as a moral obligation. The "state" does not need to mandate sterilization if social and economic incentives make selecting against certain profiles the only rational choice.

  ### 3. The Definition of "Best"
  PPB relies on selecting the child with the "best expected life prospects." Savulescu defines this broadly as well-being. However, "well-being" is not a neutral metric.

  **The Instability:** Historically, eugenic definitions of "fitness" were never purely about health; they were entangled with economic productivity, social conformity, and racial biases. While Savulescu explicitly rejects this, the logic of selection requires a metric.
  *   Once we accept the premise that we *should* select for "better" genes, the definition of "better" is vulnerable to cultural drift.
  *   Today, "better" might mean "free from disease." Tomorrow, in a hyper-competitive economy, "better" might subtly shift toward "higher cognitive potential" or "greater emotional stability."
  *   This creates the risk of a **genetic caste system**. If the wealthy can afford better selection technologies (PGD, eventually gene editing), and they are morally encouraged to use them to maximize prospects, inequality becomes biological. The "genetically disadvantaged" are no longer just unlucky; they are the result of "irresponsible" reproduction.

  ### Conclusion: Can the Logic be Contained?
  You asked whether the logic of the principle, once set in motion, can be contained.

  **Theoretically, Yes:** One can construct a philosophical system where selecting for well-being does not imply hatred of the disabled, and where individual choice does not imply state coercion. Savulescu's work is rigorous in maintaining these distinctions.

  **Practically, No:** Principles do not exist in a vacuum; they exist in cultures. The logic of PPB normalizes the idea that children are projects to be optimized rather than gifts to be received. It shifts the locus of disability from a social/structural issue to an individual/genetic defect.

  Your intuition that the boundary is unstable is shared by many critics who argue that **liberal eugenics is still eugenics.** It may lack the gas chambers and forced sterilizations of the 20th century, but it achieves a similar homogenization through the aggregation of private choices driven by a moralized imperative to eliminate "sub-optimal" lives.

  The danger is not necessarily that Savulescu intends discrimination, but that his principle provides the **moral vocabulary** for it. Once we agree that some possible lives are objectively better candidates for existence than others based on genetics, we have laid the groundwork for a society that values its members conditionally, based on their genetic endowment. That is a boundary that, once crossed, is exceptionally difficult to redraw.
