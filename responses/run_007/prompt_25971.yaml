  So I'm a backend engineer, I spend my days thinking about database schemas and API contracts and whether a DELETE is really a DELETE or just a soft-delete with a tombstone flag. And I got into this argument with a friend who's doing a philosophy PhD about whether stealing someone's sword in World of Warcraft is, like, actually stealing. He started talking about Chalmers and virtual realism and I kind of zoned out because honestly it sounded like people who've never had to think about what a "thing" is when the thing is just a row in a PostgreSQL database.

