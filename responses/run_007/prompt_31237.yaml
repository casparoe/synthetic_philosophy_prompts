  10. **Final Polish:** Ensure the distinction between "computation" (broad sense) and "Turing/vN computation" (specific sense) is clear, as this is often where the equivocation lies.

  *(Self-Correction Note)*: Wait, I need to be careful about the "Analog" claim. Von Neumann was nuanced. He acknowledged the spike is digital (all-or-none), but the *system* behavior involves analog parameters (frequency, thresholds, chemical states). I must represent this hybrid view accurately.

