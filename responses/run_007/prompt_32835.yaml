answer: |-
  Your diagnosis is astute, and your observation about the stagnation of the literature is widely shared by those currently working on the edges of the field. The debate has indeed calcified around the SSA (Self-Sampling Assumption) vs. SIA (Self-Indication Assumption) dichotomy established in the early 2000s, with refinements but no resolution.

  Here is a structural diagnosis of the disagreement, distinguishing between what is settled and what remains contested, followed by an assessment of what could constitute progress.

  ### 1. The Structure of the Disagreement

  You hypothesized that this is a disagreement about priors or starting intuitions rather than probability theory. This is close, but it requires a slight technical correction. It is not a dispute about **priors** over hypotheses (e.g., the prior probability of a long-lived civilization); both sides generally agree on how to set non-anthropic priors.

  The disagreement is about the **likelihood function for indexical evidence**.

  In standard Bayesianism, you update $P(H)$ by $P(E|H)$. In anthropic reasoning, $E$ includes indexical information like "I am observer number $N$" or "I am experiencing this specific moment."
  *   **SSA proponents** treat indexical information as sampling from a reference class. The likelihood $P(\text{I am } N | H)$ depends on your rank within the total population of $H$.
  *   **SIA proponents** treat indexical information as evidence that you exist. The likelihood $P(\text{I exist} | H)$ is proportional to the total number of observers in $H$.

  Therefore, the disagreement is **foundational and normative**. It is a dispute about the correct logic of **self-locating belief**. It asks: *What is the rational way to update on the fact of one's own existence?*

  Because there is no "view from nowhere" to verify which updating rule corresponds to reality, the debate cannot be settled by empirical data alone. Any data point you gather is itself subject to the anthropic updating rule you are trying to test. This creates a **methodological circularity**.

  ### 2. Settled vs. Contested Claims

  To avoid presenting contested views as consensus, we must separate the formal machinery from the interpretive principles.

  **Settled (Consensus among specialists):**
  *   **Formalism:** Once an anthropic principle (SSA, SIA, etc.) is chosen, the probability calculus is standard Bayesianism. There is no dispute about the math *given* the premises.
  *   **The Paradoxes:** There is agreement on the *consequences* of each view. Everyone agrees that SSA implies the Doomsday Argument (and the "Adam and Eve" paradoxes). Everyone agrees that SIA implies the "Presumptuous Philosopher" problem (favoring hypotheses with vastly more observers regardless of other evidence).
  *   **Reference Class Sensitivity:** It is settled that SSA is highly sensitive to the definition of the reference class, and that there is no non-arbitrary way to select a reference class within the SSA framework.
  *   **Sleeping Beauty:** This is the canonical test case. It is settled that "Halfers" align with SSA-like reasoning and "Thirders" align with SIA-like reasoning. The disagreement persists here exactly as it does for Doomsday.

  **Contested (No Consensus):**
  *   **The Correct Principle:** There is no agreement on whether SSA, SIA, Full Non-indexical Conditioning (FNC), or some other principle is correct.
  *   **The Nature of Indexical Information:** Is "I am here" factual information about the world (SIA) or a random sample from a set (SSA)?
  *   **The Reference Class:** Whether the reference class problem is a fatal flaw for SSA or a manageable parameter.
  *   **Epistemic vs. Instrumental:** Whether anthropic probabilities represent "truth" (epistemic) or are merely tools for decision-making (instrumental).

  ### 3. Diagnosis: What Kind of Disagreement Is This?

  This is not a verbal dispute, nor is it a standard empirical disagreement. It is a **normative dispute about rationality under self-location**.

  However, your hypothesis that it might be "ill-posed" gains significant traction when viewed through the lens of modern decision theory. The stagnation exists because the question "What is the true probability?" may be the wrong question.

  The core issue is that **standard Causal Decision Theory (CDT) + Anthropic Updating** leads to paradoxes regardless of which updating rule you pick.
  *   SSA + CDT $\rightarrow$ Doomsday reasoning (pessimism).
  *   SIA + CDT $\rightarrow$ Presumptuous Philosopher (unjustified optimism).

  The disagreement persists because both sides are trying to save the intuition that "probabilities should guide decisions" while using a decision theory that doesn't account for the correlation between your decision and the existence of other observers (or copies of you).

  ### 4. Pathways to Progress

  If the debate is frozen, what would unfreeze it? There are three potential avenues, ranked by likelihood of impact.

  **A. The Decision-Theoretic Turn (Most Promising)**
  The most significant development since Bostrom's *Anthropic Bias* is the integration of anthropics with **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**.
  *   **The Move:** Instead of asking "What probability should I assign?" and then "What action maximizes utility?", UDT asks "Which *policy* (mapping from observations to actions) maximizes utility?"
  *   **The Result:** In many anthropic problems (like Sleeping Beauty or variants of Doomsday), UDT yields a specific course of action *without* requiring a unique anthropic probability. The probability becomes a derived quantity rather than a foundational one.
  *   **Progress:** If this framework holds, the SSA/SIA debate is dissolved for practical purposes. The question shifts from "Which probability is true?" to "Which decision algorithm is robust?"
  *   **Caveat:** This is not consensus. Many academic philosophers remain committed to CDT and standard epistemic probabilities. However, within the rationalist and some decision-theory circles, this is viewed as the primary way forward.

  **B. Formal Consistency Arguments (Dutch Books)**
  Some researchers attempt to Dutch Book (guarantee a loss for) agents who use specific anthropic principles.
  *   **Status:** Mixed. While there are Dutch Book arguments against certain naive formulations of SSA or SIA, proponents can usually modify their updating rules or decision procedures to evade the book.
  *   **Progress:** A "no-go" theorem showing that *no* combination of standard CDT and anthropic updating can avoid inconsistency in a specific class of problems would be significant. However, since UDT already claims to bypass this, the focus has shifted away from Dutch Books.

  **C. Empirical Discovery (Least Likely)**
  You mentioned encountering other conscious species or simulation forks.
  *   **Status:** While finding other observers would update our reference class, it would not settle the *rule* for updating. If we find aliens, SSA and SIA users will simply plug that data into their respective formulas and continue to disagree about the *future* population.
  *   **Progress:** Only if we found empirical evidence that violates the predictions of one framework in a way the other cannot accommodate. Given that both frameworks can adjust via the reference class, this is unlikely to be decisive.

  ### 5. Conclusion: Is Progress Expected?

  If you view the question as **"What is the objective probability of Doom given my birth rank?"**, no progress should be expected. The question relies on a notion of "objective self-locating probability" that may not exist. The impasse is a feature, not a bug, of trying to apply non-indexical probability theory to indexical problems without adjusting the decision framework.

  If you view the question as **"How should an agent act to maximize utility given self-locating uncertainty?"**, progress is possible and is currently happening via the decision-theoretic turn (UDT/FDT).

  **Summary Diagnosis:**
  The debate is a **foundational dispute over the norms of self-locating belief**, exacerbated by the use of decision theories (CDT) that are ill-suited for anthropic contexts. The stagnation is due to the lack of an external arbiter for indexical truths. Progress will likely not come from a new probability theorem or empirical data, but from a **conceptual reframing** that treats anthropic "probabilities" as instrumental tools within a broader decision theory, rather than as epistemic ends in themselves.

  Until the field broadly accepts that anthropic reasoning is subordinate to decision theory (rather than a precursor to it), the SSA/SIA deadlock will remain.
