answer: |-
  # Desiderata for an Account of the Demos: A Specification for Institutional Appraisal

  ## Introduction
  The boundary problem asks a logically prior question to democratic theory: before a people can rule itself, it must be determined *who* constitutes that people. For a qualifying paper aimed at appraising actually existing institutions rather than constructing ideal theory, the criteria for a solution must be robust enough to handle empirical friction while remaining normatively rigorous. The following five desiderata specify the conditions any adequate account of the *demos* must satisfy. Each is marked as either **Non-Negotiable** (a logical or functional prerequisite for democratic theory) or **Contested** (reflecting specific commitments of cosmopolitan, statist, or other camps).

  ---

  ## 1. Foundational Independence (Non-Circularity)
  **Status:** Non-Negotiable (Logical Prerequisite)

  **The Requirement:**
  The principle used to constitute the *demos* cannot presuppose the existence of a *demos* already empowered to decide its own boundaries. The criterion must be externally justifiable without relying on the democratic procedure it is meant to ground.

  **The Binding Consideration:**
  This addresses the Whelan-Abizadeh paradox. If the *demos* decides its own boundaries, it must already exist to make that decision. If it does not exist, it cannot decide. Therefore, the boundary must be drawn by a principle independent of the democratic will of the group in question.

  **Addressing the Tension (Point 1):**
  You asked whether *Foundational Independence* and the *Democratic Idea* (that a people settles its own boundaries) are jointly satisfiable.
  *   **Verdict:** They are **not jointly satisfiable procedurally**, but they are **jointly satisfiable normatively**.
  *   **Resolution:** The *procedural* claim (the people vote on who is in the people) must give way to the *logical* requirement of Foundational Independence. However, the *normative* claim (the boundary must be justifiable to those included and excluded) remains. An adequate account must provide a moral standard for boundaries that is *democratically justifiable* (consistent with democratic values of equality and liberty) even if it is not *democratically enacted* by the pre-constituted group. The standard must be external to the procedure but internal to democratic morality.

  ---

  ## 2. Extensional Adequacy (Hard Cases)
  **Status:** Non-Negotiable (Functional Prerequisite)

  **The Requirement:**
  The principle must yield inclusion/exclusion judgments that align with considered moral intuitions regarding "hard cases." If a principle produces absurd or morally repugnant results in these cases, it fails as a guide for institutional appraisal.

  **The Binding Consideration:**
  A theory that cannot distinguish between a voter and a random passerby, or that excludes long-term residents from the laws that bind them, lacks the traction necessary to evaluate real-world citizenship regimes.

  **Addressing the Hard Cases (Point 2):**
  *   **Long-term Resident Noncitizens:** **Non-Negotiable Inclusion.** Excluding those subject to permanent coercion without a voice violates the core democratic intuition of non-domination.
  *   **Children & Persons with Severe Cognitive Disabilities:** **Non-Negotiable Inclusion (with proxy/guardianship).** Exclusion based on capacity risks sliding into epistocracy or eugenics; inclusion protects interests.
  *   **Emigrants:** **Contested (Statist vs. Cosmopolitan).** Statists prefer exclusion (no ongoing subjection); Cosmopolitans prefer inclusion (ongoing affectedness/stake). An adequate account must take a clear stance, not remain agnostic.
  *   **Future Persons:** **Contested but Weighty.** Excluding them permits intergenerational tyranny (e.g., climate debt). Including them risks paralyzing present agency. An adequate account must specify *how* their interests are represented, even if not via direct vote.
  *   **Outsiders (Border/Climate Coercion):** **Non-Negotiable Consideration.** If a state's borders or emissions coercively restrict the liberty of outsiders, a democratic theory must account for their standing, even if full membership is impractical.

  ---

  ## 3. Relational Precision and Gradability
  **Status:** Mixed (Precision is Non-Negotiable; Gradability is Contested)

  **The Requirement:**
  The account must specify the precise *relation* that triggers inclusion (e.g., being affected, subjected, coerced, or having a stake) and determine whether inclusion is binary (in/out) or graduated (voice vs. vote).

  **The Binding Consideration:**
  Vague relations lead to arbitrary boundaries. Furthermore, if the relation comes in degrees (e.g., slightly affected vs. deeply coerced), the membership rights should arguably track those degrees.

  **Addressing the Distinctions (Point 3):**
  *   **Affected vs. Subjected vs. Coerced:**
      *   *All-Affected:* Too broad (butterfly effect). **Preference of Cosmopolitans.**
      *   *All-Subjected:* Too narrow (excludes future gens/outsiders). **Preference of Republicans/Statists.**
      *   *Coercion:* A strong middle ground, but requires a robust definition of coercion (legal vs. structural). **Preference of Liberals/Abizadeh.**
      *   *Stakeholder:* Focuses on investment in the community. **Preference of Communitarians.**
      *   *Requirement:* An adequate account must define the chosen relation narrowly enough to be actionable but broadly enough to capture moral obligations.
  *   **Degrees of Inclusion:**
      *   *Binary:* **Preference of Statists.** (You are a citizen or you are not).
      *   *Graduated:* **Preference of Cosmopolitans/Multilevel Governance theorists.** (Residency rights, voting in local but not national elections, proxy representation for future gens).
      *   *Binding Constraint:* If the triggering relation comes in degrees (e.g., intensity of coercion), a binary membership rule is suspect. An adequate account must justify why a continuous moral relation yields a discontinuous political status.

  ---

  ## 4. Institutional Determinacy (Non-Gerrymanderability)
  **Status:** Non-Negotiable (Practical Prerequisite)

  **The Requirement:**
  The criterion must yield a specific, identifiable boundary that cannot be manipulated to predetermine political outcomes. It must be possible to identify the *demos* prior to the vote without knowing how they will vote.

  **The Binding Consideration:**
  If the boundary can be drawn to ensure a specific policy victory (e.g., drawing the *demos* to include only those who favor climate action), the democratic procedure is a sham. This is the problem of "cycling" or manipulation.

  **Addressing Non-Gerrymanderability (Point 4):**
  *   **The Test:** Can an actor manipulate the definition of "affected," "subjected," or "stake" to include allies and exclude opponents?
  *   **The Constraint:** The criterion must be empirically verifiable *ex ante*. For example, "all those affected" is often indeterminate until *after* the policy is passed (we don't know who is affected until we know the policy). This creates a temporal paradox. An adequate account must identify the relevant population *before* the decision is made, based on stable characteristics (residence, subjection to law) rather than contingent outcomes (policy effects).

  ---

  ## 5. The Exclusionary Criterion and Scorecard
  **Status:** Analytical Conclusion

  **The Single Requirement That Does the Most Work:**
  **Institutional Determinacy (Non-Gerrymanderability).**

  **Justification:**
  While *Foundational Independence* rules out the Status Quo (Statist) view, and *Extensional Adequacy* rules out narrow views (All-Subjected), **Institutional Determinacy** is the most exclusionary constraint for *political theory* aiming at *institutional appraisal*.
  Many normatively attractive principles (specifically **All-Affected Interests**) collapse when asked to function as an institutional rule. Because causal chains are infinite and unpredictable, "affectedness" cannot be determined *ex ante* without arbitrary stipulation. If the boundary cannot be drawn without discretion, it can be gerrymandered. This single requirement disqualifies the most popular normative alternative to statism, forcing theorists to choose between moral breadth and institutional feasibility.

  **Scorecard of Leading Principles:**

  | Principle | Foundational Independence | Extensional Adequacy (Hard Cases) | Relational Precision | Institutional Determinacy | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Existing States (Statist)** | **FAIL** (Circular: assumes demos exists) | **FAIL** (Excludes residents/outsiders) | Pass (Clear) | Pass (Clear) | **Rejected** (Logically incoherent) |
  | **All-Affected Interests** | Pass (External standard) | Pass (Includes future/outsiders) | **FAIL** (Vague/Infinite) | **FAIL** (Indeterminate/Gerrymanderable) | **Rejected** (Institutionally unworkable) |
  | **All-Subjected Persons** | Pass (External standard) | **FAIL** (Excludes future gens/outsiders) | Pass (Legal subjection) | Pass (Mostly) | **Contender** (Needs expansion) |
  | **Coercion Principle** | Pass (External standard) | **Mixed** (Depends on def. of coercion) | **Mixed** (Structural vs. Legal) | Pass (Mostly) | **Contender** (Strongest candidate) |
  | **Stakeholder Principle** | Pass (External standard) | **Mixed** (Excludes non-invested) | **FAIL** (What counts as a stake?) | **FAIL** (Subject to manipulation) | **Rejected** (Too vague) |

  **Summary for Appraisal:**
  For the purpose of your qualifying paper, the **Coercion Principle** (specifically a version that accounts for structural coercion and border externalities) currently offers the best balance. It satisfies *Foundational Independence*, maintains sufficient *Institutional Determinacy* (legal/structural coercion is identifiable), and scores highest on *Extensional Adequacy* regarding outsiders and residents, though it struggles with future generations. Use this scorecard not to declare a winner, but to demonstrate why any appraisal of existing institutions must grapple with the trade-off between the moral breadth of *All-Affected* and the institutional stability of *All-Subjected*.
