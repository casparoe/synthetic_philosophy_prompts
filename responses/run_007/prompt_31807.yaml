prompt: |-
  I'm on the board of our town's only shelter. Three winters ago we opened a warming center that, by all accounts, has kept a handful of people from freezing to death each year. Now the same money could fund a street-medicine van that we estimate would save more lives over a winter than the center does. The director is adamant: closing the center would be us causing deaths, because people rely on it now, whereas never starting the van just means we don't prevent deaths. I cant shake the thought that before the center existed, nobody treated not having one as us killing anybody. Both can't be right. We vote in two weeks — what should I actually decide, and is the director's distinction real or just loss aversion?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Board member of a town's only shelter.
      *   **Context:** Three winters ago, opened a warming center. It saves "a handful" of lives/year.
      *   **Dilemma:** Same budget could fund a street-medicine van estimated to save *more* lives/year.
      *   **Director's Stance:** Closing the center = causing deaths (active harm). Not starting the van = not preventing deaths (passive omission). Therefore, keep the center.
      *   **User's Intuition:** Before the center existed, not having it wasn't seen as "killing." Now closing it feels like killing. Both can't be right. Is this loss aversion?
      *   **Timeline:** Vote in two weeks.
      *   **Goal:** Decide what to do and evaluate the ethical distinction.

  2.  **Deconstruct the Ethical Frameworks:**
      *   **Utilitarianism (Consequentialism):** Maximize overall good (lives saved). If the van saves *more* lives, switch to the van. The "cause" of death matters less than the *number* of deaths.
      *   **Deontology (Duty/Rights):** Focus on duties and obligations. Do we have a specific duty to current users of the center? Is there a moral difference between *acting* (closing) and *omitting* (not starting)?
      *   **The Director's Argument (Acts vs. Omissions):** This is a classic ethical distinction. Killing vs. letting die. The director argues closing the center is an *act* that removes a lifeline, whereas not buying the van is an *omission*.
      *   **The User's Counter-Argument (Status Quo Bias):** Before the center, no center = 0 blame. Now, center exists, closing it = blame. This suggests the moral weight is shifting based on expectation/reliance, not objective harm. This points to *Loss Aversion* and the *Endowment Effect*.

  3.  **Evaluate the Director's Distinction (Acts vs. Omissions):**
      *   *Is it real?* In law and some ethical frameworks, yes. There is a difference between pulling a plug and not plugging it in.
      *   *Is it relevant here?* In resource allocation for public health/safety, the distinction often collapses. If you have a fixed budget, allocating \$X to A means \$X is *not* available for B. Choosing A over B is an active choice with consequences.
      *   *The "Reliance" Factor:* The director argues reliance creates a duty. This is valid. People may have stopped seeking other alternatives because the center exists. Suddenly removing it creates a "gap" that didn't exist before.
      *   *The "Opportunity Cost" Factor:* Keeping the center *is* an active choice to not fund the van. If the van saves more people, keeping the center is functionally equivalent to "killing" the extra people the van would have saved.

  4.  **Analyze the "Both Can't Be Right" Intuition:**
      *   The user is correct. It's inconsistent to say "Not having a center in Year 0 was fine" but "Closing it in Year 3 is murder."
      *   *Why does it feel different?* Because of *expectations*. But ethical decision-making for a board should ideally be forward-looking (consequentialist), not backward-looking (sunk cost/expectation).
      *   *Loss Aversion:* Yes, this is a major factor. We hate losing what we have more than we like gaining something new of equal value.

  5.  **Develop a Decision Framework for the Board Member:**
      *   **Verify the Data:** "Estimate" vs. "Accounts." Are the van projections solid? Is the center usage data solid?
      *   **Transition Plan:** Can you do both partially? Can you phase out the center while phasing in the van? This mitigates the "reliance" harm.
      *   **Stakeholder Impact:** Who uses the center? (e.g., elderly, addicted, mentally ill). Who would the van reach? (Maybe different demographics).
      *   **Mission Alignment:** What is the shelter's core mission? Immediate safety (center) or health outreach (van)?

  6.  **Drafting the Response:**
      *   **Validate the User:** Acknowledge the difficulty and the sharpness of their ethical intuition.
      *   **Address the Director's Distinction:** Explain the "Acts vs. Omissions" doctrine but explain why it often fails in budget allocation (Opportunity Cost).
      *   **Address Loss Aversion:** Confirm that psychological bias is likely at play.
      *   **The "Both Can't Be Right" Resolution:** Explain *why* it feels different (reliance) but why the utilitarian math usually wins in public health.
      *   **Actionable Steps:**
          1.  Scrutinize the numbers (lives saved).
          2.  Consider a hybrid/transition (don't just flip a switch).
          3.  Reframe the decision (it's not "close center," it's "allocate resources to max impact").
      *   **Recommendation:** Lean towards the van *if* the data holds, but manage the transition ethically.

  7.  **Refining the Ethics (Self-Correction/Nuance):**
      *   *Wait, is the director totally wrong?* Not entirely. If the center users have *nowhere else to go* and the van users *might* find help elsewhere, the center closure is more lethal. I need to make sure the user checks if the van *actually* reaches the same population.
      *   *Sunk Cost Fallacy:* Don't keep the center just because it exists.
      *   *The "Killing" Label:* Avoid getting bogged down in semantics. Focus on outcomes.

  8.  **Final Polish:** Tone should be empathetic, analytical, and decisive. Avoid preaching, offer a framework. (Structure: Validate -> Analyze the Ethics -> Analyze the Psychology -> Practical Steps -> Recommendation).

  **(Self-Correction during drafting):** I need to make sure I don't just say "Utilitarianism wins." I need to acknowledge the real harm of breaking trust with the homeless population. If they lose trust, they might not use the van either. That's a practical risk, not just ethical.

  9.  **Final Plan:**
      *   Intro: Validate the tension.
      *   Section 1: The Director's Distinction (Acts vs. Omissions & Reliance).
      *   Section 2: The Counter-Argument (Opportunity Cost & Consistency).
      *   Section 3: Loss Aversion & Status Quo Bias.
      *   Section 4: Practical Decision Matrix (Data, Transition, Mission).
      *   Conclusion: Specific advice on how to vote/advocate.

  10. (Reviewing against safety guidelines): No harmful advice. This is an ethical dilemma regarding resource allocation. Safe to discuss.

  11. (Final thought): Emphasize that "doing nothing" (keeping the center) is also an active choice with body counts. That's the crucial pivot point.

