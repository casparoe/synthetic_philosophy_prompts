answer: |-
  ### Session 1 Plan: The Architecture of Aggregation

  **Target:** Master's in Public Policy (1 semester stats background).
  **Time:** 50 Minutes.
  **Core Concept:** Simpson's Paradox (Reversal of association upon conditioning).

  ---

  ### 1. Sequence of Ideas (The Dependency Chain)

  You cannot skip any link in this chain. If students miss the *mechanism*, the paradox remains a magic trick. If they miss the *policy stakes*, it remains a math puzzle.

  1.  **The Policy Question (Minute 0-5):** Establish a binary choice between two interventions (A vs. B) based on an outcome metric.
      *   *Dependency:* Everything rests on the assumption that the students care about picking the "better" option.
  2.  **The Aggregate Evidence (Minute 5-10):** Present the overall success rates. One option clearly wins.
      *   *Dependency:* Students must commit to a preliminary conclusion based on this table.
  3.  **The Disaggregated Evidence (Minute 10-15):** Split the data by a covariate (e.g., Risk Level). The winner flips in *both* subgroups.
      *   *Dependency:* This creates the cognitive conflict. Without the commitment in step 2, there is no paradox.
  4.  **The Arithmetic Mechanism (Minute 15-25):** Demonstrate that the aggregate is a *weighted average* of the subgroups. The reversal is caused by unequal group sizes (composition), not calculation error.
      *   *Dependency:* Students must understand weighted averages. If they view the aggregate as a simple mean of the subgroup rates, the chain breaks here.
  5.  **The Causal Cliffhanger (Minute 25-50):** Ask "Which number is the truth?" Refuse to answer definitively. Frame this as the question for the rest of the module.
      *   *Dependency:* This depends on them accepting that statistics alone cannot resolve the conflict without a model of *how* the data was generated.

  ---

  ### 2. The Single Example: Hospital Survival Rates

  **The Scenario:**
  A state regulator must recommend one of two hospitals (Hospital A vs. Hospital B) for a public insurance network. The metric is 30-day survival rate.

  **The Data:**
  *   **Aggregate:** Hospital B has a higher overall survival rate than Hospital A.
  *   **Disaggregate:** Patients are split by "Admission Condition" (Fair vs. Poor).
  *   **The Twist:** Hospital A has higher survival rates for *Fair* patients AND *Poor* patients.
  *   **The Cause:** Hospital A is a Level 1 Trauma Center; it accepts a much higher proportion of "Poor" condition patients than Hospital B.

  **Why this example rather than Berkeley Admissions?**
  1.  **Causal Clarity:** In the Berkeley case, the confounding variable (Department Choice) is endogenous to the applicant *and* the department, leading to debates about discrimination vs. preference. In the Hospital case, the confounder (Patient Severity) is a pre-existing condition that causally affects the outcome (Survival) and determines selection into the group (Hospital). This isolates the *statistical* paradox from complex *social* causality.
  2.  **Stakes:** Policy students understand triage and risk adjustment. It mirrors "creaming" in job training or risk-selection in insurance, which are core policy problems.
  3.  **Neutrality:** It avoids the immediate defensive reactions gender-based examples can trigger, allowing the class to focus entirely on the structural relationship between variables.

  ---

  ### 3. Predictable Misconceptions & Preemption Points

  **Misconception 1: "The data must be wrong / This is a calculation error."**
  *   **Prediction:** Students will assume you made a mistake when the tables contradict.
  *   **Preemption Point (Minute 15):** Immediately after revealing the subgroup tables.
  *   **Action:** Walk through one row of the arithmetic live on the board. Explicitly state: *"The math is correct. The contradiction is real. If the math is right, our intuition about what the numbers represent must be wrong."*

  **Misconception 2: "Statistics is fundamentally unreliable."** (The suspicion you noted)
  *   **Prediction:** Students conclude that because the numbers flip, quantitative evidence cannot guide policy.
  *   **Preemption Point (Minute 25):** At the start of the "Arithmetic Mechanism" section.
  *   **Action:** Frame the paradox not as a failure of statistics, but as a failure of *naive aggregation*. Say: *"Statistics did not lie to you. You asked a question ('Which hospital is better?') without specifying ('...for whom?'). The paradox punishes imprecise questions, not mathematical reasoning."*

  **Misconception 3: "The Subgroup Table is Always the Truth."**
  *   **Prediction:** Students will decide that disaggregated data is inherently superior and aggregation is always bias.
  *   **Preemption Point (Minute 40):** During the discussion of "Which number to use?"
  *   **Action:** Introduce the concept of a "Collider" briefly (without naming it if it's too technical, or naming it as a teaser). Say: *"Sometimes splitting the data creates bias where none existed. We will learn the rules for when to split and when to aggregate in Session 2. Do not leave today thinking 'smaller groups = more truth'."*

  ---

  ### 4. Check for Understanding (Minute 45)

  **Do not ask:** "Define Simpson's Paradox."
  **Do not ask:** "Calculate the aggregate rate."

  **The Task:** "The Weighted Average Challenge"
  Provide students with a handout containing the **fixed subgroup success rates** for two programs (Program X and Program Y).
  *   *Program X:* High Risk (40% success), Low Risk (90% success).
  *   *Program Y:* High Risk (30% success), Low Risk (85% success).
  *   *(Note: Program X is better in both subgroups).*

  **The Question:**
  "Program X is the superior treatment in both groups. However, in the final report, Program Y appears to have a higher overall success rate.
  **Draw the distribution of patients (N) for Program X and Program Y that would make this reversal possible.**"

  **Why this tests structure:**
  To answer this, they must recognize that for Program Y to win overall, it must be weighted heavily toward the *Low Risk* (high success) group, while Program X must be weighted heavily toward the *High Risk* (low success) group. They must demonstrate that they understand the paradox is driven by **composition weights**, not the rates themselves.

  ---

  ### 5. What to Openly Refuse to Resolve

  You must draw a boundary line. If you try to solve the "Truth" question now, you undermine Sessions 2 and 3.

  **1. The "True Effect" Question**
  *   **The Question:** "So, which hospital should we actually recommend? Is it A or B?"
  *   **The Refusal:** "I will not answer that today. To answer that, we need to know if 'Admission Condition' is a confounder we must control for, or a mediator we should leave alone. That requires causal diagrams (DAGs), which is Session 2."
  *   **Why:** This prevents them from adopting a heuristic rule (e.g., "always disaggregate") which is causally invalid in other contexts.

  **2. The Ecological Inference Problem**
  *   **The Question:** "Can we apply the hospital-level data to individual patient choices?"
  *   **The Refusal:** "We are treating these groups as homogeneous for now. Whether group-level associations hold for individuals is the Ecological Fallacy, which is Session 3."
  *   **Why:** Mixing aggregation paradoxes with ecological fallacies confuses the level-of-analysis problem with the conditioning problem.

  **3. Regression Coefficient Reversal**
  *   **The Question:** "Does this happen in OLS regression?"
  *   **The Refusal:** "Yes, and we will see how a regression coefficient can flip signs when you add a control variable in Session 2. Today we stick to contingency tables to keep the arithmetic visible."
  *   **Why:** Moving to matrices too early obscures the intuitive weighting mechanism.

  ### Summary of the 50-Minute Flow

  *   **00-05:** **Hook.** Two Hospitals. One Choice. Who do you send your mother to?
  *   **05-10:** **Exhibit A.** Aggregate Table. (Hospital B wins). Vote held.
  *   **10-15:** **Exhibit B.** Disaggregated Tables. (Hospital A wins both). Vote shaken.
  *   **15-25:** **The Mechanism.** Whiteboard the weighted average. Show how Hospital A's "excellence" is drowned out by its "caseload severity."
  *   **25-35:** **Misconception Check.** Address "Stats are broken" and "Subgroups are always truth."
  *   **35-45:** **Application.** Students work on the "Weighted Average Challenge" (CFU).
  *   **45-50:** **Wrap.** Collect CFU. Reiterate: "The numbers didn't change. The question did. Next week: How to ask the right question."
