prompt: |-
  I'm designing the first session of a three-week module on aggregation paradoxes for Master's students in public policy. The students have had one semester of statistics — they can read a regression table and compute a conditional probability, but they have never thought systematically about the relationship between within-group and between-group patterns. The concept I need to build the entire session around is Simpson's paradox. Don't explain the paradox to me; plan how I should introduce it to them. I need: the sequence of ideas and what depends on what, so I know what I cannot skip without breaking the chain; the single example that should carry the whole session and why that one rather than the Berkeley admissions case; the misconceptions students predictably form — I suspect at least one will be that the paradox reveals some deep unreliability in statistical reasoning — and the exact point in the fifty-minute sequence where I should preempt each; a check for understanding I can run at minute forty-five that tests whether they have grasped the structure of the paradox rather than merely being able to define it; and what I should openly refuse to resolve in this session because it properly belongs to later sessions on ecological inference and on causal versus non-causal decompositions.
