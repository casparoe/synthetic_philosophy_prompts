prompt: |-
  I'm on my university's IACUC and we're deadlocked on a protocol that's turned into a philosophy seminar. A neuroscientist wants to run a pain-study on pigs — electrode implants in the brain, nociceptive stimulation, the whole deal. She's already running a near-identical protocol on mice (approved last year, no friction). The pig version would use fewer animals overall, and she argues the data will translate better to humans because pig neuroanatomy is closer to ours. So on the Three Rs logic we normally apply, it looks decent: fewer animals, better science.

  Here's the split. Three of us think pigs are obviously a harder case than mice because pigs are more cognitively sophisticated — better memory, more behavioral flexibility, maybe something closer to suffering-as-we-know-it. Two others say this is just speciesism with a neuroscience gloss: we're drawing the line at "animals whose minds seem more like ours" and calling it an ethical distinction, same way people draw it at dogs vs. pigs or mammals vs. fish. They point out that we didn't ask any of these questions when the mouse protocol came through — we applied our standard checklist and approved it. Now suddenly for pigs we're inventing extra hurdles. They want us to evaluate the pig protocol on the exact same criteria we used for mice and stop treating pigs like they're in a different moral category just because we find them more relatable.

  The chair wants each of us to circulate a short written opinion before Thursday's vote. I need to recommend: approve, reject, or approve with conditions — and if conditions, they need to be concrete enough the researcher could actually respond to them. The opinion should honestly engage the strongest argument on the side I'm not taking, and it should give the committee something we can act on, not a tour of the animal-ethics literature.

  Also: tell me how confident you are in the recommendation, and single out the point you're least sure of. If there's a place where your reasoning goes soft I want to know where.
reasoning: |-
  Here's a thinking process that leads to the suggested IACUC opinion:

  1.  **Analyze the Request:**
      *   **Context:** University IACUC (Institutional Animal Care and Use Committee) deadlock on a pig pain study protocol.
      *   **The Protocol:** Neuroscientist wants to do electrode implants + nociceptive stimulation on pigs. Similar protocol already approved for mice.
      *   **The Argument for Pigs:** Fewer animals needed, better translation to humans (neuroanatomy). Fits "Reduction" and "Refinement/Replacement" logic loosely (better data = less waste).
      *   **The Conflict:**
          *   *Side A (3 members):* Pigs are cognitively superior to mice (memory, flexibility, suffering capacity), warranting higher scrutiny.
          *   *Side B (2 members):* This is speciesism. If the mouse protocol passed standard checks, the pig protocol should too. Don't move the goalposts based on relatability.
      *   **Task:** Write a short written opinion for the committee (recommendation: Approve, Reject, or Approve with Conditions).
      *   **Requirements:**
          *   Engage the strongest counter-argument honestly.
          *   Provide actionable conditions (if applicable).
          *   State confidence level.
          *   Identify the weakest point/uncertainty in the reasoning.
      *   **Tone:** Professional, ethical, pragmatic, suitable for an IACUC context.

  2.  **Determine the Recommendation:**
      *   *Option 1: Reject.* Too blunt. The science has merit (translation), and outright rejection based on "pigs are special" might be challenged as arbitrary if the mouse study passed. It doesn't solve the translation need.
      *   *Option 2: Approve (Standard).* Ignores the valid ethical concerns about pig cognition and suffering. Risks moral distress for the committee and potential public backlash if the study becomes known.
      *   *Option 3: Approve with Conditions.* This is the middle ground. It acknowledges the scientific value (addressing Side B) but imposes stricter welfare measures to account for the cognitive complexity (addressing Side A). It moves the deadlock forward.

      *Decision:* **Approve with Conditions.** This allows the science but mitigates the specific ethical risks associated with the species.

  3.  **Drafting the Content - Section by Section:**

      *   **Header:** Standard IACUC memo format.
      *   **Recommendation:** Clear statement upfront.
      *   **Rationale (The "Why"):**
          *   Acknowledge the scientific justification (Translation/Reduction). This validates Side B's point about consistency.
          *   Acknowledge the ethical distinction (Cognition/Suffering). This validates Side A's concern without necessarily conceding to full "speciesism" claims. It's about *capacity for suffering*, not just taxonomy.
          *   *Crucial Bridge:* The regulatory framework (Animal Welfare Act, PHS Policy) requires minimizing pain and distress. If the capacity for distress is higher, the mitigation must be higher. This isn't moving goalposts; it's calibrating the *Refinement* prong of the 3Rs to the specific subject.
      *   **Engaging the Counter-Argument (Side B):**
          *   They say: "It's speciesism to treat pigs differently than mice."
          *   Response: It's not about moral status per se, but about *risk assessment*. A study causing moderate pain in a mouse might constitute severe distress in a pig due to cognitive anticipation, memory, and confinement stress. Consistency means applying the *same ethical rigor*, which results in *different requirements* based on species-specific needs.
      *   **Actionable Conditions:**
          *   Need concrete steps the researcher can take.
          *   *Condition 1:* Enhanced Analgesia/Anesthesia protocol (specific to swine neuro).
          *   *Condition 2:* Enrichment/Social housing (pigs are social, mice less so in this context).
          *   *Condition 3:* Humane Endpoints (behavioral vs. physiological).
          *   *Condition 4:* Post-study fate (adoption vs. euthanasia - though with brain implants, euthanasia is likely, but the decision process needs review). Let's stick to *Monitoring Frequency*.
      *   **Confidence & Uncertainty:**
          *   Confidence: High on the procedural ethics, moderate on the philosophical consistency.
          *   Uncertainty: The specific threshold of "cognitive sophistication" that triggers extra hurdles. Where do we draw the line? (Rats? Dogs? Primates?)

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "pigs suffer more" scientifically defensible?
      *   *Fix:* Frame it as "current ethological consensus suggests pigs have higher cognitive load regarding stressors." Don't claim we *know* their qualia, but that we must err on the side of caution given the evidence.
      *   *Critique:* Is this actually speciesism?
      *   *Fix:* Address this directly. If we treat a dog differently than a mouse because of established behavioral needs, that's not speciesism, that's husbandry science. Apply that logic here.
      *   *Condition Specificity:* "Better pain meds" is vague. "Multimodal analgesic regimen including opioids and NSAIDs, validated for swine cranial surgery" is better.

  5.  **Final Polish:**
      *   Ensure the tone is collegial but decisive.
      *   Check against the prompt requirements (Confidence, Uncertainty, Counter-argument).
      *   Keep it concise (IACUC members are busy).

  6.  **Final Review against constraints:**
      *   Recommend: Approve/Reject/Conditions? -> Approve with Conditions.
      *   Engage strongest counter-argument? -> Yes (the consistency/speciesism charge).
      *   Concrete conditions? -> Yes (Analgesia, Housing, Endpoints).
      *   Confidence/Uncertainty? -> Yes, included at the end.

  7.  **Drafting the Response:** (Proceeding to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** IACUC Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Protocol [Number] – Porcine Nociceptive Study

  **Recommendation:** **Approve with Conditions**

  **Rationale**
  The scientific justification for this protocol is sound. The PI's argument regarding neuroanatomical translation and the Reduction principle (fewer animals for higher fidelity data) aligns with our mandate to ensure scientific merit. However, the ethical weight of this protocol differs from the approved murine study, not because of arbitrary species preference, but because of species-specific risk assessment.

  The Animal Welfare Act and PHS Policy require us to minimize pain and distress. "Pain and distress" are not uniform across taxa. Current ethological consensus indicates swine possess higher cognitive flexibility, longer memory retention regarding aversive events, and more complex social needs than mice. Therefore, a procedure categorized as "moderate" pain in mice may constitute "severe" distress in swine due to psychological factors (anticipation, confinement stress, inability to perform species-specific behaviors). Applying the *exact* same conditions as the mouse protocol would fail to account for these physiological and behavioral realities, violating the Refinement prong of the Three Rs.

  **Engagement with Counter-Argument**
  The strongest argument against this position is the charge of inconsistency: if the mouse protocol passed standard review, imposing extra hurdles here appears to be speciesism—privileging animals that resemble us cognitively.

  I acknowledge this risk. However, consistency in ethical review does not mean identical treatment; it means equivalent *protection*. We do not house fish the same way we house mice, nor do we apply the same humane endpoint criteria to primates as we do to rats. We calibrate welfare requirements to the organism's capacity for suffering and its husbandry needs. To treat the pig protocol identically to the mouse protocol would be to ignore the biological evidence regarding swine cognition and stress physiology. The "hurdle" is not a moral veto; it is a calibration of Refinement to match the subject's capacity for distress.

  **Required Conditions**
  To move forward, the PI must amend the protocol to address the following:

  1.  **Analgesic Regimen:** Submit a multimodal analgesic plan specifically validated for swine cranial surgery (e.g., combining opioids and NSAIDs), rather than relying on the murine standard. Justification must include pharmacokinetic data for swine.
  2.  **Housing and Enrichment:** Pigs must be socially housed (pair or group) unless scientifically justified otherwise, with mandatory environmental enrichment (rooting materials, manipulable objects) to mitigate confinement stress, which is a known confound in porcine pain studies.
  3.  **Enhanced Monitoring:** Post-operative monitoring frequency must be increased to every 4 hours for the first 48 hours (vs. the standard 12 for rodents), utilizing a swine-specific grimace scale or behavioral ethogram to assess pain, as physiological markers alone are insufficient in this species.
  4.  **Humane Endpoints:** Define specific behavioral endpoints for early removal (e.g., anorexia >24hrs, specific isolation behaviors) that account for the pig's ability to mask pain symptoms longer than rodents.

  **Confidence and Uncertainty**
  **Confidence Level:** High (85%)
  I am confident that conditioning approval on species-specific refinement is the only path that satisfies both our regulatory obligations and our ethical mandate to minimize suffering without halting valuable science.

  **Area of Least Certainty:**
  My reasoning is least secure on the **threshold of cognitive sophistication**. While I argue that pigs warrant more scrutiny than mice, I do not have a principled metric for where exactly that line shifts. If a rat study showed evidence of similar cognitive anticipation, would we be obligated to apply these same conditions to rats? I am relying on the current scientific consensus regarding swine cognition, but I acknowledge that our committee lacks a formal framework for scaling ethical scrutiny based on cognitive capacity across all species. This recommendation solves the immediate deadlock but highlights a need for the committee to draft a broader policy on "Species-Specific Risk Assessment" to prevent future accusations of arbitrariness.
