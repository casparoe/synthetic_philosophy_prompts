answer: |-
  This is a sophisticated and well-observed phenomenon. You are correct to reject the dismissive "mere verbal dispute" label in its colloquial sense; in contemporary analytic metaphysics and meta-ontology, this configuration has been studied extensively and possesses a specific structure.

  The most precise diagnosis for this configuration is a **Carnapian Framework Dispute** manifesting as **Quantifier Variance**, often driven by **Pragmatic or Normative Stakes**.

  Here is a detailed account of the terminology, the boundaries you requested, and a workable test for identifying this specific type of disagreement.

  ### 1. The Term of Art and Theoretical Account

  While there is no single noun that captures the entire phenomenon, the constellation of features you describe is best analyzed through the intersection of three concepts:

  **A. Carnap's Internal vs. External Questions**
  Rudolf Carnap (in *Empiricism, Semantics, and Ontology*) distinguished between questions asked *within* a linguistic framework (internal) and questions asked *about* the framework itself (external).
  *   **Internal:** "Is there a white piece of paper on my desk?" (Settled by observation within the 'thing-language'.)
  *   **External:** "Do physical objects really exist?" (Carnap argues this is not a theoretical question but a practical one about whether to adopt the 'thing-language'.)
  *   **Your Case:** Your colleagues agree on all internal facts (budget, employees, bylaws). Their disagreement is an **External Question** masquerading as an Internal one. They are arguing about which linguistic/conceptual framework to adopt for describing the social world, not about the data within that world.

  **B. Quantifier Variance (Eli Hirsch)**
  Eli Hirsch developed this concept to explain how two parties can agree on all physical facts but disagree on ontological claims.
  *   **The Mechanism:** The parties are using the existential quantifier ("there exists") with different meanings. One colleague uses a **restrictive quantifier** (only fundamental particles/individual humans count as "existing"), while the other uses a **permissive quantifier** (collections, institutions, and structures also count as "existing").
  *   **The Illusion:** Because both use the English phrase "really exists," they believe they are contradicting each other. In reality, they are speaking different "ontological dialects." If translated, Colleague A says, "There are only people arranged university-wise," and Colleague B says, "There is a University composed of people." These are compatible claims.

  **C. Pragmatic/Normative Stakes (The "Why")**
  You noted the parties feel the disagreement is substantive. This is because the ontology is doing **normative work**.
  *   If the University *really exists*, it can bear moral responsibility, owe duties, and be harmed (independent of its members).
  *   If it is *only a summary*, responsibility devolves entirely to individuals.
  *   The dispute feels metaphysical because the parties are leveraging metaphysics to settle a **practical/political question** about liability and agency.

  ### 2. Boundaries: Distinguishing the Configuration

  You asked for an account of the boundaries. Here is how this configuration differs from the three alternatives you listed.

  **vs. Ordinary Factual Disagreement**
  *   **Factual:** Parties disagree on the truth value of a proposition within a shared framework (e.g., "Is the budget deficit $1M or $2M?"). Resolution is possible via evidence.
  *   **Framework/Quantifier:** Parties agree on all truth values of atomic propositions (the budget, the hires). The disagreement is about the **interpretation of the logical constants** (specifically 'exists') or the **adoption of the framework**. Evidence is irrelevant because the evidence is already agreed upon.

  **vs. Quiet Semantic Difference**
  *   **Quiet:** Two people use "bank" to mean river-edge and financial institution respectively, but do not realize it. Once pointed out, the disagreement dissolves immediately, and neither feels a loss.
  *   **Framework/Quantifier:** The parties are **aware** of the clash. They do not want to dissolve the disagreement because they are committed to the *utility* of their preferred framework. Colleague A *wants* to say the University doesn't exist because it serves their view of individual responsibility. The resistance to paraphrase is political/philosophical, not cognitive confusion.

  **vs. Substantive Ontological Disagreement**
  *   **Substantive:** A debate where there are theoretical costs and benefits that cannot be paraphrased away (e.g., "Do abstract objects exist?" in a way that impacts mathematical truth). Usually, one side offers better explanatory power, parsimony, or integration with science.
  *   **Framework/Quantifier:** In your examples, the **explanatory power is identical**. Whether you say "The University fired him" or "The Officers of the University fired him," the prediction of future events is the same. If the explanatory power is identical, but the ontological claim differs, it is likely a case of quantifier variance.

  ### 3. A Workable Test

  To diagnose whether a disagreement fits this configuration, you can apply a two-step test.

  **Step 1: The Paraphrase Test (Chalmers/Hirsch)**
  Ask the dissenting party (the one who says the University *doesn't* exist) if they accept the following claim:
  > "It is true that there are people, buildings, and rules coordinated in such a way that, for all practical and legal purposes, they function as a single agent."

  *   **If they say Yes:** Then their denial of "real existence" is likely **Quantifier Variance**. They accept the facts but reject the label. The dispute is verbal/framework-based.
  *   **If they say No:** (e.g., "No, even the coordination is an illusion"), then it is a **Substantive Factual Disagreement**.

  **Step 2: The Consequence Test (Pragmatic)**
  Ask both parties:
  > "If we adopt your ontology, what specific duty, right, or prediction changes that would not change under the other ontology?"

  *   **If they cite Normative Status:** (e.g., "If it exists, *it* owes the debt, not me"), the dispute is **Normative disguised as Ontological**. This confirms the Carnapian diagnosis: they are arguing about which framework yields better moral/legal results, not about the fabric of reality.
  *   **If they cite Causal Power:** (e.g., "If it exists, it can cause effects no individual could"), press for an example. If they cannot provide a causal power that isn't reducible to the coordinated actions of the parts, the dispute remains in the **Framework** category.

  ### 4. Historical Context (For an Early Modernist)

  Since your field is early modern philosophy, you may find it useful to contextualize this as a recurrence of the **Nominalist vs. Realist** debate regarding **Social Universals**.

  *   **The Hobbesian Position:** Your colleague denying the University's existence is taking a Hobbesian nominalist line. For Hobbes, "Universals are but names." A "University" is a *flatus vocis* (breath of voice) unless grounded in the specific covenant of individuals.
  *   **The Scholastic/Reidian Position:** The colleague affirming existence is arguing for a form of institutional realism, akin to Reid's common sense realism or later Hegelian objective spirit.

  The modern diagnosis adds a layer Hobbes lacked: **Meta-ontological deflationism**. We can now say that both colleagues are correct *relative to their chosen linguistic framework*, and the argument is about which framework is more **useful** for the purposes of governance and ethics.

  ### Summary Diagnosis

  The configuration is a **Meta-Ontological Framework Dispute**.

  1.  **Structure:** Agreement on all atomic facts + Agreement on counterfactuals + Disagreement on existential quantification.
  2.  **Cause:** Quantifier Variance (different thresholds for "existence").
  3.  **Persistence:** Driven by Pragmatic/Normative Stakes (assigning responsibility/agency).
  4.  **Resolution:** Cannot be settled by observation. Must be settled by deliberating on which linguistic framework yields better ethical or practical outcomes (a Carnapian pragmatic choice).

  It is not "just words" in the trivial sense, because the choice of words dictates the allocation of moral responsibility. But it is "verbal" in the technical sense that the world does not force one ontology over the other; the choice is ours.
