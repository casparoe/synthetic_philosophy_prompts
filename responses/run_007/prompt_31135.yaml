prompt: |-
  I teach a graduate seminar on collective agency and social ontology, and we have been working through the discursive dilemma—sometimes called the doctrinal paradox—at some length. The standard illustration runs as follows. A three-judge appellate panel must decide a contract dispute that turns on two issues: whether a valid contract was formed, and whether it was breached. The court's doctrine says the plaintiff prevails only if she wins on both. The judges vote:

  - Judge A: valid contract (yes), breach (yes) → plaintiff wins.
  - Judge B: valid contract (yes), breach (no) → plaintiff loses.
  - Judge C: valid contract (no), breach (yes) → plaintiff loses.

  If the panel aggregates votes premise-by-premise, the plaintiff wins on contract 2–1 and on breach 2–1, so she should win the case—yet a majority of the same judges (B and C) would vote to reject her claim if asked for the bottom line directly. The paradox is clean and familiar.

  But real multi-member courts do not, in fact, resolve this by picking one aggregation method and sticking with it. What they do instead—and here I am thinking especially of the U.S. Supreme Court but also of intermediate appellate courts—is let each judge vote on the disposition and then write separately on the reasoning, with the result that we routinely get plurality opinions: a majority converges on the outcome but no single rationale commands majority support. Lower courts are then left to extract binding precedent under something like the Marks rule, which treats the narrowest opinion concurring in the judgment as controlling. That rule has no deep philosophical justification that I have ever seen; it is a practical fix, and a contested one at that.

  I want my students to see that these are not merely procedural accidents. They reflect substantive—and contestable—philosophical commitments about what a collective judgment even is. So here is the question I would like a committed answer to, one that takes a definite position and defends it rather than surveying possibilities. What theory of group judgment does the actual practice of outcome-first voting with separate rationale-voting presuppose? Does it presuppose, for instance, that a collective agent exists only at the level of the verdict and not at the level of the reasons that support it, or that consistency is required of individual judges but not of the court as a body? Is that presupposition defensible? And if we instead insisted that a collective judgment must be consistent all the way down—premises and conclusions alike—what would have to change structurally in how multi-member courts operate? I am less interested in what the case law says than in what the practice implicitly commits us to, philosophically, and whether we should own up to it or revise the practice. Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on collective agency and social ontology.
      *   **Topic:** The Discursive Dilemma (Doctrinal Paradox) in the context of multi-member courts (specifically US Supreme Court/appellate courts).
      *   **Observation:** Real courts don't strictly follow premise-based or conclusion-based aggregation. They use outcome-first voting with separate opinions (plurality opinions), leaving lower courts to decipher precedent (e.g., *Marks* rule).
      *   **Task:** Provide a *committed* answer (not a survey) to a specific question: What theory of group judgment does the actual practice of outcome-first voting with separate rationale-voting presuppose? Is it defensible? What would change if we insisted on consistency all the way down?
      *   **Tone/Style:** American English, philosophical rigor suitable for a graduate seminar, argumentative/defensive of a specific position.

  2.  **Deconstruct the Phenomenon:**
      *   *The Practice:* Judges vote on the outcome (disposition). They write opinions explaining *why*. Often, no single rationale gets a majority. The "holding" is the outcome; the "reasoning" is fragmented.
      *   *The Discursive Dilemma:* Premise-based aggregation (PBA) vs. Conclusion-based aggregation (CBA). PBA leads to logical consistency at the group level but might contradict the majority's desired outcome. CBA respects the majority's desired outcome but might lead to logical inconsistency in the group's reasons.
      *   *The Current US Practice:* It looks like CBA on the outcome (majority rules the disposition) but allows individual PBA on the reasons (each judge justifies their vote individually). The group *as a whole* does not commit to a single set of premises.

  3.  **Formulate the Core Thesis:**
      *   What theory of group judgment does this presuppose? It presupposes a **deflationary or minimalist theory of collective agency**. Specifically, it treats the court as a *decision-making mechanism* rather than a *unified rational agent*.
      *   It prioritizes *authority* (the power to settle disputes) over *rational unity* (logical consistency of the collective mind).
      *   It implies that collective judgment is essentially *performative* (we decide *that* P) rather than *cognitive* (we believe *P because* Q and R).
      *   *Defensibility:* Is this defensible? Yes, under a pragmatic/institutional view of law (law as settlement), but No, under a coherence/view of law as integrity (Dworkin). I need to take a stand.
      *   *Decision:* I will argue that the practice presupposes an **Aggregative Authority Model**, which treats the court as a political settlement device rather than a singular rational mind. I will argue this is *ultimately indefensible* if we take the rule of law seriously, and that we should move toward a more robust collective rationality, even if it requires structural changes.
      *   *Wait, re-reading the prompt:* "Please... take a definite position and defends it rather than surveying possibilities."
      *   *Option A:* Defend the current practice (Pragmatism).
      *   *Option B:* Critique the current practice (Rational Unity).
      *   *Selection:* Option B is usually more stimulating for a graduate seminar on social ontology. It forces students to confront the tension between institutional reality and philosophical ideals. However, Option A might be more faithful to the "actual practice" description. Let's aim for a nuanced critique: The practice presupposes a **fragmented agency** model that is *functionally necessary* but *normatively deficient*.
      *   *Better approach:* Let's take a strong stand. The practice presupposes that **collective agency is merely procedural, not doxastic**. I will argue this is a mistake. The court *ought* to be treated as a singular agent, and the current practice is a failure of collective rationality that undermines the legitimacy of precedent.

      *   *Refined Thesis:* The practice of outcome-first voting with separate rationales presupposes a **Disaggregated Agency Theory**. It assumes the collective exists only to issue commands, not to hold beliefs. I will argue this is **philosophically untenable** for a court whose function is to articulate public reason. If we insisted on consistency all the way down, we would need to move toward a deliberative model that forces premise-aggregation, potentially requiring vote trading or compromise on reasoning *before* the vote.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the discursive dilemma. State the thesis clearly: The current practice presupposes a "Command Theory" of collective judgment (authority without reason), which is ontologically shallow and normatively dangerous.
      *   **The Ontological Commitment:** What does the practice say the court *is*? It says the court is a *vote-counting machine* for outcomes, not a *reason-giving entity*. The "group mind" stops at the verdict. The reasons remain private property of the individual judges. This is a form of **Interpretive Individualism** regarding reasons, combined with **Collective Voluntarism** regarding outcomes.
      *   **Is it Defensible?**
          *   *Pro:* Efficiency, respects judicial independence, avoids forced consensus.
          *   *Con (The Critique):* It violates the "Public Reason" requirement of law. If law is reason, a court that cannot articulate a majority reason is failing its function. It creates the *Marks* rule problem (indeterminacy). It treats precedent as a residue rather than a commitment.
          *   *Verdict:* It is not defensible if we view law as a system of principled coherence (Dworkin/Raz).
      *   **Structural Implications:** If we demand consistency all the way down (Premise-Based Aggregation):
          *   Judges can't just vote outcome. They must vote on the *rule*.
          *   Requires deliberation *before* voting to find a common rationale.
          *   Might require "compromise opinions" where no one gets their perfect rationale but all sign onto a "good enough" one.
          *   Changes the role of concurrences/dissents (they become less about individual expression, more about logical alternatives).
      *   **Conclusion:** Reiterate that the current practice is an evasion of collective responsibility. We should own up to the requirement of collective rationality.

  5.  **Refining the Philosophy:**
      *   Use terms like "Collective Intentionality" (Searle/Tuomela), "Discursive Dilemma" (Pettit/List), "Public Reason" (Rawls/Dworkin).
      *   Distinguish between *distributive* vs. *collective* rationality.
      *   The "Marks Rule" is a band-aid on a broken ontological limb.
      *   Key distinction: The court as a *strategic alliance* vs. the court as a *corporate agent*. The current practice treats it as the former; it should be the latter.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question? "What theory of group judgment does the actual practice... presuppose?" Yes (Disaggregated/Command Theory). "Is that presupposition defensible?" Yes/No (I'll argue No). "What would have to change structurally?" Yes (Deliberative/Premise-based).
      *   *Check:* Is the tone appropriate? Needs to be academic, firm, American English.
      *   *Check:* Avoid surveying. Don't say "Some say X, others say Y." Say "The practice implies X. This is wrong because Y."
      *   *Nuance:* Acknowledge that individual judicial independence is a value, but argue it shouldn't trump collective rationality in a precedent-setting court.

  7.  **Final Polish:** Ensure the distinction between *outcome* (disposition) and *holding* (legal rule) is clear. The paradox arises because the holding is derived from the reasons, but the reasons aren't aggregated.

      *(Self-Correction on the "Defensible" part)*: If I argue it's *not* defensible, I need to be careful not to sound like I'm ignoring the practical constraints of judicial independence. I should frame it as: It is defensible *pragmatically* but indefensible *ontologically/normatively* regarding the nature of law. I will take the stronger normative stance for a graduate seminar context.

      *(Final Plan)*:
      1.  Identify the theory: **Procedural Collectivism / Substantive Individualism**.
      2.  Critique: It fails the test of **Public Justification**.
      3.  Reform: Move to **Premise-Based Aggregation** via deliberation.

  8.  **Drafting the Content:** (Mental outline of the response)
      *   Intro: The practice isn't neutral; it's ontologically loaded.
      *   Theory: It assumes the group is an agent only for *will*, not *intellect*.
      *   Critique: This creates a "reasonless authority." Law requires reason.
      *   Structural Change: Deliberative integration, voting on propositions, not just cases.

  9.  **Final Review against constraints:** American English. Graduate level. Definite position.

      *Let's write.*
answer: |-
  The practice of outcome-first voting coupled with separate rationalities presupposes a specific and contentious theory of collective agency: **Procedural Collectivism combined with Substantive Individualism.** On this view, the court functions as a collective agent only with respect to the *exercise of power* (the disposition of the case), while remaining a mere aggregate of individuals with respect to the *exercise of reason* (the justification for that disposition).

  This is not a neutral procedural default. It is an ontological claim that a multi-member court need not possess a unified "mind" to issue legitimate judgments. It assumes that collective intentionality stops at the verdict. The court *intends* to affirm or reverse, but it does not *believe* the legal propositions that necessitate that outcome. The reasons remain the private property of the individual judges, while the outcome becomes the public property of the institution.

  I argue that this presupposition is **philosophically indefensible** for a court of last resort whose primary function is the articulation of public reason. While it may be pragmatically expedient, it undermines the very possibility of precedent as a constraint on future state action. If we take the rule of law seriously, we must insist that a collective judgment must be consistent all the way down. This requires a structural shift from aggregating votes to aggregating reasons.

  ### The Ontological Commitment: Will Without Intellect

  The current practice treats the court as a **voluntarist entity** rather than a **cognitive entity**. In social ontology terms, it denies the court *corporate doxastic agency*. It allows the court to say "We hold that the plaintiff wins," but it does not require the court to be able to say "We hold that *P* and *Q* entail the plaintiff wins."

  This distinction matters because it changes the nature of the precedent. Under the *Marks* rule and the practice of plurality opinions, the binding force of a decision is extracted post hoc by lower courts trying to find the "narrowest grounds." This implies that the precedent was not actually *created* by the court as a collective agent at the moment of decision. Instead, the precedent is a shadow cast by the overlapping individual rationales.

  This presupposes that the legitimacy of judicial power rests solely on the authority to settle disputes (a Hobbesian view), not on the quality of the reasoning provided (a Kantian or Dworkinian view). It assumes that consistency is a virtue for individual judges—who must write coherent opinions—but not for the court as a body. The court can be logically incoherent as long as the vote count is coherent.

  ### Why This Is Indefensible

  This model fails because it severs the necessary link between **authority** and **justification**. In a legal system predicated on the rule of law, rather than the rule of men, power must be exercised through reason. When a court issues a ruling, it is not merely commanding a result; it is providing a public standard for future conduct.

  If the court cannot articulate a majority rationale, it has failed to provide a public standard. It has issued a command without a rule. This leaves the "law" indeterminate until a lower court interprets the *Marks* rule, effectively delegating the Supreme Court's law-making power to inferior tribunals. This is an abdication of collective agency.

  Furthermore, this practice allows judges to engage in **strategic voting** that obscures their true commitments. A judge might vote to affirm on narrow grounds to secure a majority for the outcome, while privately believing the broader grounds are correct. This creates a "false consensus" on the outcome that masks deep disagreement on the law. The collective judgment becomes a lie: it claims a unity of purpose that does not exist. In social ontology, this prevents the formation of a genuine "we-intention." The judges do not intend the outcome *together* based on shared reasons; they intend the outcome *in parallel* based on divergent reasons. This is not collective agency; it is coincidental convergence.

  ### The Structural Requirement: Premise-Based Aggregation

  If we insist that a collective judgment must be consistent all the way down—that the court must act as a singular rational agent—we must structurally abandon the current practice in favor of **Premise-Based Aggregation (PBA)**. This would require significant changes to how multi-member courts operate:

  1.  **Voting on Propositions, Not Just Dispositions:** The court would need to vote on the legal premises (the "doctrinal issues") before voting on the case outcome. In your contract example, the judges would vote on "Was there a valid contract?" and "Was there a breach?" as distinct propositions. The outcome would then be determined by the logical consequence of the majority votes on those premises, even if that outcome contradicts what a majority of judges would prefer if voting directly on the disposition.
  2.  **Deliberative Compromise:** To avoid the alienation of the minority (which PBA can cause), the court would need to engage in genuine deliberation *before* the vote to craft a single majority opinion that captures the shared reasoning. This means judges would have to compromise on their individual rationales to sign onto a collective rationale. The "separate concurrence" would become a rarity, reserved for fundamental disagreements, rather than a standard tool for preserving individual intellectual purity.
  3.  **The End of the *Marks* Rule:** If the court votes on premises, the holding is explicit. There is no need to extract the "narrowest grounds" from a fractured set of opinions. The precedent is the set of premises that commanded a majority.

  ### The Cost of Rational Unity

  Adopting this model comes at a cost. It constrains judicial independence. It forces judges to subordinate their individual reasoning to the collective logic of the court. It might produce outcomes that no single judge thinks is the "best" result (the discursive dilemma's sting), but it ensures that the *law* announced by the court is coherent.

  However, this cost is necessary. A court that cannot maintain logical consistency between its premises and its conclusions is not acting as a court of law; it is acting as a political council. The discursive dilemma is not a technical glitch to be managed by the *Marks* rule; it is a signal that the court is failing to constitute itself as a unified agent.

  ### Conclusion

  The current practice of outcome-first voting presupposes that collective agency in law is merely a matter of tallying wills, not integrating reasons. It treats the court as a coalition of individuals who happen to agree on a result, rather than a corporate agent capable of holding a belief. This is indefensible for an institution tasked with defining public norms. To restore the integrity of collective judgment, we must structurally commit to premise-based aggregation. We must accept that a court speaks with one voice or it does not speak as a court at all. The discomfort of the discursive dilemma is not a reason to avoid collective rationality; it is the price of having it.
