prompt: |-
  You are a professional philosopher specializing in population ethics and the philosophy of well-being, with practical experience in how abstract normative theories do and do not survive contact with institutional decision-making. Think carefully about what follows, and where your own reasoning is uncertain, flag that uncertainty rather than papering over it.

  I direct the grantmaking program at a mid-sized philanthropic foundation focused on global health and development. Over the last two years our board has become persuaded by something in the neighborhood of lexical threshold negative utilitarianism — roughly, the view that there is a threshold of suffering so severe that no amount of pleasure, flourishing, or other positive goods can compensate for it, and that preventing or relieving suffering above that threshold has lexical priority over promoting happiness or any other positive value. The board has not settled on a precise formulation, and they have no appetite for doing so. They have, however, started asking why our grant portfolio still looks the way it did before they adopted this view.

  I need a decision procedure my team can actually run on each grant proposal we evaluate — something that operationalizes the lexical threshold idea without requiring my program officers to become philosophers or to resolve intramural debates the board itself has avoided. The procedure should be a sequence of questions we ask about a proposal, in order, with guidance on what counts as a sufficient answer at each step, where the procedure stops with a clear recommendation, and where it hands the decision to a person because the question is irreducibly a matter of judgment or values.

  The constraints are these. We allocate roughly $40 million per year. We evaluate about 120 proposals per cycle, four cycles per year. My team has about 30 minutes of structured deliberation time per proposal before they have to write a recommendation. Most of them have backgrounds in public health, development economics, or program evaluation — not philosophy. The procedure has to be something they can learn in a half-day training and apply consistently. It also has to be transparent enough that I can explain to a rejected applicant why they were rejected, in language that does not require quoting the board's philosophical commitments.

  Here are some specific challenges the procedure must handle, and I want you to address each explicitly in the design:

  - What counts as crossing the threshold? We need an operational criterion that a program officer can apply to a proposal's description of the suffering it addresses — not a criterion that just pushes the philosophical problem one step downstream.
  - How do we handle proposals that address suffering whose severity relative to the threshold is genuinely uncertain or contested?
  - How do we handle proposals that prevent future suffering — where the suffering has not yet occurred and its severity and probability are both estimates?
  - How do we compare a proposal that prevents moderate suffering for a very large number of people against one that prevents extreme suffering for a small number? The lexical threshold view seems to imply that if the small-number suffering crosses the threshold and the large-number suffering does not, the former wins regardless of the numbers. Is that really what the procedure should say, and if so, how do we make that administrable and defensible?
  - What do we do with proposals that primarily promote positive goods — joy, flourishing, achievement, community — rather than relieve suffering? Do they get funded only when no suffering-relief proposals are on the table? Or is there some trade-off below the threshold, and if so, how is that trade-off structured?

  Please also build in a step that explicitly checks whether the procedure is about to produce a recommendation that the board or our stakeholders will find unacceptable on grounds that the procedure itself cannot recognize as legitimate — and instructs the program officer to escalate rather than override.

  Once you have designed the procedure, apply it to three hypothetical proposals:

  1. A program to provide palliative pain relief to terminal cancer patients in low-income countries. The suffering is clearly extreme, the intervention is evidence-backed, but the number of beneficiaries is modest relative to the per-patient cost, and the program cannot be scaled easily.

  2. A program to treat depression in adolescents through school-based cognitive behavioral therapy in a middle-income country. The suffering is real and widespread, the intervention is cost-effective by conventional metrics, but it is unclear whether most cases of adolescent depression cross the threshold as the procedure defines it.

  3. A program to fund community festivals, music, and cultural events in refugee camps. The proposal primarily promotes positive goods — joy, social connection, cultural continuity, moments of meaning — rather than relieving suffering, though the target population is undoubtedly suffering in other ways that the proposal does not address.

  For each, walk through the procedure step by step and show what it recommends. The procedure should give a clear answer on proposal 1 and a clear answer on proposal 3. It should honestly flag what it cannot settle about proposal 2 and show exactly where the program officer must exercise judgment.

  Finally, tell me what this procedure cannot do — what kinds of proposals it will systematically mishandle, what philosophical assumptions it bakes in that even a sympathetic board might reasonably reject, and where it is likely to drift in practice as program officers find workarounds for its more demanding requirements.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in population ethics/well-being, with practical institutional experience.
      *   **Task:** Design a practical decision procedure for a philanthropic foundation adopting "lexical threshold negative utilitarianism" (LTNU) without precise philosophical formulation.
      *   **Constraints:** $40M/year, 120 proposals/cycle, 4 cycles/year, 30 mins deliberation/proposal, staff are public health/econ experts (not philosophers), half-day training max, transparent to applicants.
      *   **Specific Challenges to Address:** Defining the threshold, handling uncertainty, handling future suffering, comparing extreme vs. moderate suffering (lexical priority), handling positive goods (flourishing vs. suffering relief).
      *   **Safety Valve:** A step to escalate if the procedure yields an intuitively unacceptable result.
      *   **Application:** Apply to three specific hypothetical proposals (Palliative Care, Adolescent Depression, Refugee Festivals).
      *   **Critique:** Explain limitations, systematic mishandling, baked-in assumptions, and drift risks.
      *   **Tone:** Careful, flagging uncertainty, professional, practical.

  2.  **Deconstruct the Philosophical Core (LTNU):**
      *   *Lexical:* No amount of Good X compensates for Bad Y (if Y is above threshold).
      *   *Threshold:* A specific level of suffering severity.
      *   *Negative Utilitarianism:* Priority on reducing suffering over increasing happiness.
      *   *Institutional Reality:* The board wants the *vibe* of LTNU without the *rigor* of LTNU. They don't want to define the threshold precisely. This creates a tension: How to operationalize a vague lexical threshold?
      *   *Solution:* We need a "Proxy Threshold" based on clinical/empirical markers rather than philosophical ones. We need a "Triage" system.

  3.  **Drafting the Decision Procedure (The "Suffering Priority Protocol" - SPP):**
      *   *Goal:* 30-minute application. 5-7 steps max.
      *   *Step 1: Eligibility (The "Positive Goods" Filter).* LTNU says suffering relief is priority. Do we reject positive goods entirely? The prompt asks about trade-offs. A pure LTNU might reject them unless *no* suffering proposals exist. But a foundation needs to exist year-to-year. *Decision:* Positive goods are "Tier 2." They are only fundable if Tier 1 (Threshold Suffering) is exhausted or if they incidentally reduce threshold suffering.
      *   *Step 2: Threshold Identification (The Core Challenge).* How to define "extreme suffering" without philosophy? Use established medical/humanitarian scales. WHO pain scales, trauma criteria, basic needs deprivation (starvation, torture, untreated terminal pain).
      *   *Step 3: Uncertainty & Probability.* Future suffering is probabilistic. LTNU usually cares about expected value, but lexical views can be tricky with probabilities. *Decision:* Use a "Precautionary Principle" for high-severity/low-probability, but require a minimum probability threshold to avoid funding vaporware.
      *   *Step 4: Lexical Comparison.* If Proposal A crosses threshold and Proposal B doesn't, A wins regardless of numbers. *Decision:* Hard rule. This is the definition of lexical.
      *   *Step 5: Within-Threshold Trade-offs.* If multiple proposals cross the threshold, how to choose? Maximize reduction of threshold-crossing suffering (cost-effectiveness within the lexical tier).
      *   *Step 6: The "Human Sanity Check" (Escalation).* As requested. If the result feels monstrous, escalate.

      *Refining Step 2 (The Threshold):* This is the hardest part. Staff can't philosophize. They need a checklist. Let's create a "Red Flag" list. If a proposal addresses conditions on the Red Flag list, it crosses the threshold.
      *Refining Step 1 (Positive Goods):* If we strictly follow LTNU, Proposal 3 (Festivals) should be rejected if Proposal 1 exists. But the prompt asks for a trade-off structure. Let's make it a "Residual Fund" model. 80-90% of budget reserved for Threshold Suffering. 10-20% for Positive Goods/Moderate Suffering *only if* Threshold bucket is full.

  4.  **Addressing Specific Challenges within the Procedure:**
      *   *Crossing the Threshold:* Use a "Severe Suffering Checklist" (SSC) based on ICD/WHO classifications (e.g., severe physical pain, torture, extreme deprivation).
      *   *Uncertainty:* Require "Best Available Evidence" + "Severity Confidence Score." If severity is uncertain, default to the lower severity classification unless the upside is catastrophic.
      *   *Future Suffering:* Discount by probability. If Probability x Severity > Threshold, it counts.
      *   *Moderate vs. Extreme:* Lexical rule applies. Extreme wins.
      *   *Positive Goods:* Funded only from the "Residual Allocation" after Threshold needs are met.

  5.  **Developing the Three Case Studies:**
      *   *Proposal 1 (Palliative Care):* Clearly crosses threshold (terminal pain). High cost/low scale. LTNU says fund it over moderate suffering. *Verdict:* Fund (from Tier 1 budget).
      *   *Proposal 2 (Adolescent Depression):* Unclear threshold crossing. Depression varies wildly. Some is severe, some moderate. *Verdict:* Flag for Judgment. Needs clinical review to determine % of cases crossing the "Severe" line.
      *   *Proposal 3 (Refugee Festivals):* Positive goods. Refugees suffer, but this doesn't treat the suffering directly. *Verdict:* Reject (or defer to Residual Bucket). If Tier 1 is full, maybe fund. But given the prompt's constraint on clear answers: Reject in favor of Tier 1.

  6.  **Critique and Limitations (The "Philosopher's Disclaimer"):**
      *   *Drift:* Officers will expand the definition of "Severe" to fund pet projects.
      *   *Baked-in Assumptions:* Assumes suffering is measurable and comparable. Ignores rights/justice.
      *   *The "Repugnant Conclusion" variant:* Might ignore huge numbers of moderate suffering for tiny numbers of extreme suffering.
      *   *Uncertainty:* The board didn't define the threshold, so the staff effectively *are* defining it via the Checklist. This is a delegation of philosophical authority disguised as operationalization.

  7.  **Review against Constraints:**
      *   30 mins? Yes, checklist format.
      *   Non-philosophers? Yes, relies on medical/humanitarian metrics.
      *   Transparent? Yes, can explain "Priority on Severe Suffering" without saying "Lexical Negative Utilitarianism."
      *   Escalation step? Included.

  8.  **Final Polish:**
      *   Ensure tone is appropriate (professional, candid about uncertainty).
      *   Make sure the "Uncertainty" flagging is prominent in Proposal 2.
      *   Ensure the "Escalation" step is distinct.
      *   Check the math/logic on the "Lexical" aspect (Extreme always beats Moderate).

      *(Self-Correction during drafting)*: I need to be careful about the "Positive Goods" constraint. The prompt asks: "Do they get funded only when no suffering-relief proposals are on the table?" A strict LTNU says yes. A practical foundation says no (you need to keep donors happy, show visible wins). I will design a "Two-Bucket Budget" to make this administrable. 90% for Threshold Suffering, 10% for Flourishing/Moderate. This operationalizes the *priority* without making the foundation dysfunctional.

      *(Self-Correction on Proposal 2)*: Depression is tricky. Severe melancholia crosses the threshold; mild adjustment disorder does not. The procedure must force the officer to distinguish. I will build a "Severity Segmentation" requirement into Step 2.

      *(Self-Correction on Escalation)*: Make sure this isn't a loophole. It should be for "Reputational/Existential Risk" not just "I don't like this."

  9.  **Finalizing the Output Structure:**
      *   Introduction (acknowledging the tension).
      *   The Decision Procedure (The "Severe Suffering Priority Protocol").
      *   Application to Cases.
      *   Limitations & Risks.

  10. **Writing the Content:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a classic problem in non-ideal theory: translating a high-stakes normative commitment into an administrative algorithm without collapsing into bureaucracy or losing the moral signal. The tension here is acute. Your board wants the *moral force* of lexical threshold negative utilitarianism (LTNU) without the *philosophical precision* required to define the threshold. This means your program officers will effectively be defining the threshold through operational choices, whether they realize it or not.

  My goal in designing this procedure is to minimize the philosophical burden on your staff while maximizing fidelity to the board's directive. We must replace philosophical abstraction with clinical and humanitarian proxies. We must also acknowledge that "lexicality" (the idea that *no* amount of lower-good compensates for higher-bad) is administratively brittle. If applied strictly, it can lead to funding one person's pain relief over a million people's mild misery, which may trigger the "unacceptable result" clause you requested.

  Below is the **Severe Suffering Priority Protocol (SSPP)**. It is designed for a 30-minute deliberation window.

  ***

  # The Severe Suffering Priority Protocol (SSPP)

  **Training Requirement:** Half-day workshop focusing on the "Severe Suffering Checklist" (Appendix A) and the distinction between *relieving suffering* and *promoting flourishing*.
  **Time per Proposal:** 30 Minutes.
  **Decision Authority:** Program Officer (PO) recommends; Program Director approves.

  ### Step 1: The Primary Intent Filter
  **Question:** Is the primary, direct mechanism of this proposal the *prevention or relief* of suffering, or is it the *promotion of positive goods* (joy, culture, achievement, capability)?
  *   **Guidance:** If the proposal metrics focus on happiness, community cohesion, or economic gain without a specific link to a pathology or deprivation, it is "Positive Goods." If it focuses on pain, trauma, starvation, disease, or oppression, it is "Suffering Relief."
  *   **If Positive Goods:** Route to **Tier 2 Pool** (See Step 6). Stop.
  *   **If Suffering Relief:** Proceed to Step 2.

  ### Step 2: The Threshold Classification (The "Red Flag" Test)
  **Question:** Does the suffering addressed meet at least one criterion on the **Severe Suffering Checklist (SSC)**?
  *   **Guidance:** Do not philosophize about "what suffering is." Use the SSC (Appendix A). This list is based on WHO disability weights, trauma criteria, and basic needs thresholds.
  *   **Criteria Examples:** Unmanaged terminal pain; torture or systematic abuse; severe acute malnutrition; untreated psychosis; conditions resulting in >0.8 disability weight.
  *   **If YES (Crosses Threshold):** Classify as **Tier 1**. Proceed to Step 3.
  *   **If NO (Below Threshold):** Classify as **Tier 2**. Proceed to Step 6.
  *   **If UNCERTAIN:** Proceed to Step 3 (Uncertainty Protocol).

  ### Step 3: The Uncertainty & Probability Protocol
  **Question:** Is the severity or probability of the suffering contested or probabilistic (e.g., future prevention)?
  *   **Guidance:**
      *   **Severity Uncertainty:** If clinical evidence is mixed on whether the condition crosses the SSC, apply the **Precautionary Default**. If the condition *could* reasonably be interpreted as meeting the SSC by a competent clinician, classify as Tier 1. *Flag for Director Review.*
      *   **Probability (Future Suffering):** Calculate *Expected Severe Cases* = (Population) × (Probability of Event) × (Probability Intervention Works). If *Expected Severe Cases* > 1, treat as Tier 1.
  *   **Decision:** Assign final Tier (1 or 2).
      *   **If Tier 1:** Proceed to Step 4.
      *   **If Tier 2:** Proceed to Step 6.

  ### Step 4: The Lexical Priority Check
  **Question:** Are there viable Tier 1 proposals in the current cycle that are more cost-effective at reducing *threshold-crossing* suffering?
  *   **Guidance:** This is the lexical rule. A Tier 1 proposal *always* outranks a Tier 2 proposal, regardless of the number of beneficiaries in Tier 2.
  *   **Comparison:** Among Tier 1 proposals, compare **Cost Per Case of Severe Suffering Averted**.
  *   **If this proposal is not competitive within Tier 1:** Reject. (Reason: "Higher priority severe suffering opportunities available.")
  *   **If this proposal is competitive within Tier 1:** Proceed to Step 5.

  ### Step 5: The "Human Sanity" Escalation
  **Question:** Does funding this proposal (or rejecting the alternative) produce a result that creates significant reputational risk, violates legal/ethical norms, or feels intuitively monstrous (e.g., funding one person's pain relief while 10,000 starve)?
  *   **Guidance:** This is not for philosophical disagreement. This is for institutional survival and moral hazard.
  *   **If YES:** **ESCALATE.** Do not write a recommendation. Send to Program Director and Board Ethics Liaison.
  *   **If NO:** **RECOMMEND FOR FUNDING.**

  ### Step 6: The Residual Allocation (Tier 2)
  **Question:** (For Tier 2 proposals only) Has the allocated Tier 1 budget been fully exhausted?
  *   **Guidance:** The Foundation reserves 90% of capital for Tier 1. 10% is available for Tier 2 (Moderate Suffering & Positive Goods).
  *   **If Tier 1 Budget Not Exhausted:** Reject Tier 2 proposals. (Reason: "Priority given to severe suffering relief this cycle.")
  *   **If Tier 1 Budget Exhausted:** Fund Tier 2 proposals based on standard cost-effectiveness (e.g., DALYs averted, well-being scores).

  ***

  # Appendix A: The Severe Suffering Checklist (SSC)
  *Program Officers must check at least one box to classify as Tier 1.*
  1.  **Physical Pain:** Pain rated 7+ on Visual Analog Scale, unmanaged by standard care.
  2.  **Deprivation:** Lack of access to caloric survival needs or safe shelter for >30 days.
  3.  **Psychological Trauma:** Diagnosis of PTSD, Severe Depression (PHQ-9 >20), or Psychosis.
  4.  **Violence:** Exposure to torture, domestic violence, or systematic persecution.
  5.  **Terminality:** End-of-life conditions without palliative support.

  ***

  # Application to Hypothetical Proposals

  ### Proposal 1: Palliative Pain Relief (Terminal Cancer, Low-Income)
  *   **Step 1 (Intent):** Relief of suffering (pain). **Pass.**
  *   **Step 2 (Threshold):** Unmanaged terminal pain is explicitly on the SSC (Box 1 & 5). **Tier 1.**
  *   **Step 3 (Uncertainty):** Evidence-backed intervention. Severity is certain. **Tier 1 Confirmed.**
  *   **Step 4 (Lexical Check):** Cost per patient is high, scale is low. However, under SSPP, Tier 1 always beats Tier 2. We compare only against other Tier 1 proposals. If there are no other Tier 1 proposals that avert *more cases of severe suffering* for the same cost, this wins.
  *   **Step 5 (Escalation):** Does it feel monstrous? Possibly, if the cost is $100k per patient while malaria nets are $5. However, the Board's commitment is to the *threshold*. Unless the cost is absurdly disproportionate (e.g., $1M per patient), this does not trigger escalation.
  *   **Step 6:** N/A.
  *   **Recommendation:** **FUND.**
  *   **Rationale to Applicant:** "Your project addresses a category of severe suffering that aligns with our current highest-priority funding criteria."

  ### Proposal 2: Adolescent Depression (School-Based CBT)
  *   **Step 1 (Intent):** Relief of suffering (mental health). **Pass.**
  *   **Step 2 (Threshold):** *Uncertainty.* Adolescent depression varies. Mild cases do not meet SSC Box 3 (Severe Depression). Severe cases do. The proposal treats a mix.
  *   **Step 3 (Uncertainty Protocol):** The PO must estimate the % of beneficiaries crossing the SSC threshold.
      *   *Scenario A:* If the school screens for severity and only treats PHQ-9 >20, it is **Tier 1**.
      *   *Scenario B:* If it treats all comers, and only 10% are severe, the *Expected Severe Cases* calculation applies.
      *   *Judgment Call:* The PO cannot determine the clinical severity distribution from the proposal alone.
  *   **Action:** **FLAG FOR JUDGMENT.** The PO must request a clinical breakdown of the target population's baseline severity.
  *   **Recommendation:** **PEND.** "We require clarification on the baseline severity of the target population to determine alignment with our Severe Suffering criteria."
  *   **Why:** This is where the procedure honestly admits it cannot settle the philosophical/clinical boundary without more data. The PO cannot guess; they must verify against the SSC.

  ### Proposal 3: Refugee Camp Festivals (Community/Culture)
  *   **Step 1 (Intent):** Promotion of positive goods (joy, connection). While refugees suffer, this intervention does not *treat* the suffering directly (e.g., it is not trauma therapy, it is not food). **Classify as Positive Goods.**
  *   **Step 2:** Route to **Tier 2 Pool**.
  *   **Step 6 (Residual Allocation):** Has the Tier 1 budget (90% of funds) been exhausted?
      *   *Likely Reality:* In global health, there is almost always more Tier 1 demand than supply.
      *   *Decision:* If Tier 1 is not exhausted (which is probable), this proposal is rejected.
  *   **Recommendation:** **REJECT.**
  *   **Rationale to Applicant:** "While we recognize the value of community cohesion, our current funding cycle is prioritized for direct interventions addressing severe physical or psychological pathology. We encourage you to apply when our Tier 2 funding window opens."

  ***

  # Critical Analysis: What This Procedure Cannot Do

  As a philosopher looking at this institutional design, I must flag where this SSPP will fail, drift, or hide ethical costs.

  ### 1. The "Operational Definition" Drift
  The board refused to define the threshold philosophically, so the **Severe Suffering Checklist (SSC)** effectively becomes the definition.
  *   **Risk:** Over time, Program Officers will lobby to expand the SSC to include projects they prefer. For example, they may argue that "social isolation" counts as "Psychological Trauma" to fund community projects.
  *   **Mitigation:** The SSC must be locked by the Board or an external clinical advisory panel, not the program team. If the program team controls the checklist, the lexical priority will evaporate within two cycles.

  ### 2. The "Moderate Suffering" Cliff
  The procedure bakes in a harsh discontinuity.
  *   **Problem:** A proposal preventing 100,000 cases of *moderate* depression (Tier 2) will be rejected in favor of 10 cases of *severe* pain (Tier 1), even if the total well-being loss in the moderate group is higher.
  *   **Philosophical Cost:** This is the intended feature of LTNU, but it is vulnerable to the "Repugnant Conclusion" in reverse. It may lead to a portfolio that looks elitist regarding suffering (helping the worst-off exclusively while ignoring the aggregate).
  *   **Institutional Risk:** This is the most likely trigger for the **Step 5 Escalation**. If a Tier 1 proposal is extremely inefficient (e.g., high cost, very few beneficiaries), the "monstrous" feeling of ignoring cheap Tier 2 gains will pressure staff to game the system.

  ### 3. The Measurement of "Severity"
  The procedure assumes suffering severity is an objective, measurable property (like temperature).
  *   **Uncertainty:** In mental health and chronic conditions, severity is subjective and culturally contingent. The SSC relies on WHO weights, which are themselves controversial averages.
  *   **Failure Mode:** Proposal 2 (Depression) highlights this. The procedure forces a binary classification (Tier 1 vs. Tier 2) on a spectrum. This will lead to "Threshold Gaming," where applicants reframe moderate issues as severe to qualify for Tier 1 funding. Your team will spend increasing time auditing clinical claims rather than evaluating impact.

  ### 4. The Positive Goods Blind Spot
  By relegating Positive Goods to a residual 10% bucket, the procedure assumes suffering relief and flourishing are separable.
  *   **Philosophical Assumption:** It assumes joy does not prevent suffering. (e.g., Does the Refugee Festival prevent suicide? If so, it should be Tier 1).
  *   **Drift:** Savvy applicants will reframe "festivals" as "suicide prevention" to bypass Step 1. Your team will have to become auditors of intent, which erodes trust.
  *   **Long-term:** A foundation that never funds flourishing may find its portfolio grim and its donor base eroding, as humans are motivated by hope as much as harm reduction.

  ### 5. The Escalation Loophole
  Step 5 is necessary, but dangerous.
  *   **Risk:** If used too frequently, it undermines the rule-based system. If Program Officers know they can escalate "uncomfortable" lexical outcomes, they will do so to avoid funding unpopular Tier 1 projects (e.g., palliative care is often less "glamorous" than vaccines).
  *   **Constraint:** Escalation should require a written justification citing specific reputational or ethical risks, not just "intuition."

  ### Final Recommendation to the Director
  This procedure operationalizes the Board's view but does not solve the underlying philosophical vagueness. It shifts the burden from *defining* the threshold to *classifying* against a checklist.

  You must warn the Board: **By refusing to define the threshold, they have delegated that philosophical authority to the authors of the Checklist.** If they want true fidelity to their view, they must approve the Checklist itself. If they do not, the Program Team will inevitably drift toward a more aggregative view (utilitarianism) because it is administratively easier to compare numbers than to defend lexical priorities.

  The SSPP is stable only if the Board is willing to defend the *Checklist* publicly, not just the *Principle*. Without that, the procedure will degrade into standard cost-effectiveness analysis within 18 months.
