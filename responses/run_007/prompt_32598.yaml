answer: |-
  You are right to be suspicious. The summary you encountered is a textbook example of the "vulgar pragmatism" caricature that has plagued secondary literature for a century. For a dissertation on scientific realism, treating Peirce and James as holding variant forms of the same thesis is not just inaccurate; it obscures a fundamental fault line in the history of philosophy of science. Peirce is often claimed by convergent realists, while James is frequently cited by instrumentalists or anti-realists. Conflating them undermines your ability to map the landscape of realism.

  Here is a claim-by-claim analysis, grounded in the primary texts, focusing on how the "useful falsehood" objection lands differently on each figure.

  ### Claim 1: "Peirce and James both held that truth is whatever works."

  **Verdict:** **False for Peirce; Nuanced/Exaggerated for James.**

  *   **Peirce:** This is the specific misreading that led Peirce to rename his doctrine "pragmaticism" in 1905, a name he called "ugly enough to be safe from kidnappers." Peirce distinguished sharply between the **Pragmatic Maxim** (a theory of *meaning*) and a theory of *truth*.
      *   The Maxim states that the meaning of a conception lies in the conceivable practical effects of its object (*How to Make Our Ideas Clear*, 1878).
      *   Peirce explicitly argued that truth is *not* defined by immediate utility. In "What Pragmatism Is" (1905), he writes that pragmatism is not a theory of truth but a method for ascertaining meanings. His theory of truth is separate: it is representationalist and correspondence-adjacent (more on this below).
  *   **James:** James is more responsible for this phrasing. In *Pragmatism* (1907), he famously writes, "The true is the name of whatever proves itself to be good in the way of belief." However, even for James, "works" does not mean "provides immediate psychological comfort." It means "successfully guides us through experience."
      *   **Key Text:** *The Meaning of Truth* (1909), where James attempts to clarify the misunderstandings arising from *Pragmatism*. He insists that true ideas must "agree" with reality, not just satisfy desires.

  **Relevance to Realism:** Peirce's rejection of "truth = utility" makes him a viable partner for scientific realism. James's willingness to link truth to "goodness" makes him more amenable to instrumentalism.

  ### Claim 2: "For Peirce, a belief is true if the scientific community would eventually converge on it after enough investigation."

  **Verdict:** **Mostly Accurate, but missing the metaphysical constraint.**

  *   **The View:** This refers to Peirce's "Final Opinion" theory. In "How to Make Our Ideas Clear," Peirce defines truth as: "The opinion which is fated to be ultimately agreed to by all who investigate."
  *   **The Missing Nuance:** The summary makes this sound like a sociological consensus theory (i.e., truth is whatever scientists *happen* to agree on). For Peirce, convergence is not guaranteed by social dynamics but by the **constraint of Reality**.
      *   Peirce posits an "external permanency" that forces investigators to converge. In *The Fixation of Belief* (1877), he argues that the method of science is the only one that acknowledges something "upon which our thinking has no effect."
      *   Therefore, truth is not *constituted* by agreement; agreement is the *sign* of truth, caused by the independent reality constraining inquiry.
  *   **The "Useful Falsehood" Objection:** This objection **does not stick** to Peirce's formulation. A belief that makes you happy (like the faithful spouse example) will not survive the "end of inquiry." If the spouse is unfaithful, reality will eventually produce a surprise (a contradiction in experience) that forces the belief to be abandoned. For Peirce, "working" means "withstanding the tests of experience indefinitely," not "making you feel good now."

  ### Claim 3: "For James, truth is even more subjective: a belief is true for you if holding it makes your life go better."

  **Verdict:** **Caricature, though it identifies a genuine tension in James.**

  *   **The View:** James does argue that truth is made in the course of experience ("Truth *happens* to an idea," *Pragmatism*, Lecture VI). He allows that different truths can be valid for different people in different contexts (pluralism).
  *   **The Nuance:** James does not think *any* belief that makes life better is true. He maintains a "double obligation" for a true belief:
      1.  It must agree with sensory reality (or previous truths).
      2.  It must satisfy our subjective interests.
      *   In *The Meaning of Truth*, James writes: "To agree with reality... is the fundamental definition of truth." He insists that pragmatic truth must verify, lead, and match.
  *   **The Subjectivity Charge:** Where the summary has a point is James's *Will to Believe* doctrine. In cases where evidence is undecidable (e.g., religious faith, moral commitments), James argues we have the right to adopt the belief that yields a "vital benefit." He is willing to call these beliefs "true" in a pragmatic sense, even without empirical verification.
  *   **The "Useful Falsehood" Objection:** This objection **sticks much harder** to James.
      *   James acknowledges this in *The Meaning of Truth*. He distinguishes between "expediency in the long run" and "expediency in the short run." A lie might work short-term, but it won't work long-term because it will clash with other truths.
      *   *However*, James's allowance for religious belief creates a vulnerability. If a belief in God makes a person's life go better, and there is no empirical evidence to contradict it, James counts it as true. A realist would say this conflates *warranted assertibility* or *psychological benefit* with *truth*.

  ### Claim 4 & 5: "Both versions face the obvious objection... Pragmatists never satisfactorily answered this, which is why the theory collapsed after Russell and Moore attacked it."

  **Verdict:** **Historically and Philosophically Misleading.**

  *   **Differential Impact:** As noted above, treating the objection as applying equally to both obscures the fact that Peirce's theory is designed specifically to avoid it, while James's theory absorbs it as a feature (pluralism).
      *   **Peirce:** The "useful falsehood" is simply a belief that hasn't been tested enough. It is false *because* it won't survive the long run.
      *   **James:** The "useful falsehood" is a challenge to define the "long run." James struggles more here because his definition of truth is tied to human satisfaction, which is variable.
  *   **The "Collapse" Narrative:** The claim that pragmatism "collapsed" after Russell and Moore is analytic propaganda.
      *   Russell's attacks (e.g., in *The Problems of Philosophy*) targeted the Jamesian/Schillerian version of pragmatism, largely ignoring Peirce.
      *   Pragmatism did not vanish; it evolved into the philosophy of C.I. Lewis (conceptual pragmatism), influenced Quine (who naturalized epistemology in a pragmatist vein), and later Rorty (who ironically embraced the "truth is what works" caricature).
      *   For a scientific realist, the "collapse" is less important than the fact that Peirce's specific version of pragmatism was largely ignored by the analytic tradition until the 1980s (Putnam, Apel, etc.), which is why you are seeing these caricatures in general history books.

  ### Summary for Your Dissertation

  For your purposes in scientific realism, the distinction is critical:

  1.  **Peirce is a Convergent Realist:** His theory of truth presupposes a mind-independent reality that constrains inquiry. The "Final Opinion" is not a consensus construct; it is a discovery of how things really are. The "useful falsehood" objection fails because utility is defined by *predictive success over the indefinite long term*, not psychological comfort.
  2.  **James is a Precursor to Instrumentalism/Pluralism:** His theory allows truth to be partially constituted by human interests. While he demands agreement with reality, his expansion of "truth" to include moral/religious beliefs based on their "cash value" opens the door to anti-realist interpretations.

  **Recommendation:**
  When discussing pragmatism in your dissertation, explicitly disavow the "truth is what works" slogan. Cite Peirce's 1905 distinction between Pragmatism and Pragmaticism. Frame Peirce not as offering a *definition* of truth (which he thought was indefinable), but as a *criterion* for recognizing truth (the method of science leading to the final opinion). This insulates your realism from the "useful falsehood" objection that rightly plagues the Jamesian version.

  **Primary Texts to Cite:**
  *   **Peirce:** "How to Make Our Ideas Clear" (1878) for the convergence view; "What Pragmatism Is" (1905) for the rejection of the utility definition.
  *   **James:** *Pragmatism* (1907), Lecture VI ("The Pragmatic Conception of Truth"); *The Meaning of Truth* (1909), Preface and Essay I (for his defense against the "useful falsehood" charge).
  *   **Secondary:** Christopher Hookway's *Peirce* (1985) or Cheryl Misak's *Truth and the End of Inquiry* (1991) are excellent for defending Peirce against the Jamesian conflation.
