answer: |-
  This is a fantastic argument. You and your buddy have independently rediscovered what David Lewis called **"The Big Bad Bug."**

  It is widely considered one of the most important arguments in contemporary metaphysics of chance. The argument is valid. The premises are plausible. The conclusion (that the Principal Principle and Humean Supervenience are incompatible) was actually **accepted by Lewis himself.**

  He did not try to prove your argument wrong. Instead, he conceded that the **Original Principal Principle (1980)** is incompatible with Humeanism, and he proposed a fix: **The New Principal Principle (1994).**

  Here is the breakdown of where the argument breaks, how to fix it, and what it costs.

  ### The Diagnosis: Step (3) is the Problem

  The break occurs in **Step (3)**, specifically in the application of the Principal Principle.

  Your argument uses the **Original Principal Principle (OPP)**:
  $$Cr(A \mid H) = Ch_H(A)$$
  *(Where $Ch_H(A)$ is the chance of $A$ according to the theory $H$.)*

  Under Humeanism, Step (2) is correct: there are "undermining futures."
  *   $H$ says the coin is fair ($Ch(\text{Heads}) = 0.5$).
  *   $F$ is a future of all Heads.
  *   According to the chance function *defined by* $H$, $Ch_H(F) > 0$.
  *   However, if $F$ occurs, $H$ is false (because the best system would change). So $H \to \neg F$.

  The contradiction arises because the OPP tells you to set your credence in $F$ (given $H$) to the *unconditional* chance $Ch_H(F)$, which is $>0$. But logic tells you $Cr(F \mid H)$ must be $0$ because $H$ rules out $F$.

  Lewis's solution was to admit that under Humeanism, **$H$ is not admissible evidence** in the sense required by the Original Principal Principle. Why? Because under Humeanism, the truth of the chance theory $H$ supervenes on the *entire* mosaic, including the future. Therefore, knowing $H$ is true gives you inadmissible information about the future (specifically, it tells you the future will *not* undermine $H$).

  ### The Fix: The New Principal Principle (NPP)

  To save Humeanism, Lewis replaced the OPP with the **New Principal Principle**.

  **Original PP:** $Cr(A \mid H) = Ch_H(A)$
  **New PP:** $Cr(A \mid H) = Ch_H(A \mid H)$

  Notice the difference? The NPP tells you to match your credence to the chance **conditional on the chance theory being true**.

  Let's run your argument again with the NPP:

  1.  **Humeanism:** $H \to \neg F$ (If the theory is true, the undermining future doesn't happen).
  2.  **Calculus:** $Cr(F \mid H) = 0$ (Unchanged).
  3.  **New PP:** $Cr(F \mid H) = Ch_H(F \mid H)$.
  4.  **Calculation:** Since $H \to \neg F$, the chance of $F$ *conditional on* $H$ is also 0. So $Ch_H(F \mid H) = 0$.
  5.  **Result:** $0 = 0$. **No contradiction.**

  The "airtight" contradiction dissolves because we stop equating credence with the *unconditional* chance posited by the theory, and start equating it with the chance *conditionalized on the theory*.

  ### The Cost: What Do You Pay for This Fix?

  You asked what you have to pay to reject Step (3). Lewis paid three main prices:

  **1. Loss of Intuitive Simplicity**
  The Original PP was beautiful because it linked rational belief directly to objective chance. It said: "If you know the objective chance is 50%, believe it to degree 0.5."
  The New PP is clunkier. It says: "If you know the chance theory is $H$, believe $F$ to the degree that $H$ says $F$ would happen, *given that $H$ is true*."
  Since $H$ entails $\neg F$, the NPP tells you to believe $F$ to degree 0, even though the theory $H$ itself says $F$ has positive chance. This feels like we are ignoring the "objective chance" posited by the theory in favor of logical consistency.

  **2. Humean Humility (Quasi-Realism about Chance)**
  The fix highlights that Humean chances are not "robust" modal entities.
  *   **Non-Humean (Propensity):** If chances are physical propensities, an undermining future is impossible. A fair coin *cannot* produce an infinite run of heads that changes its fairness. So $H$ does not entail $\neg F$. The Original PP holds.
  *   **Humean:** Chances are just summaries of patterns. A pattern can be "overturned" by more data.
  By accepting the NPP, you are admitting that Humean chances do not guide credence in the same direct way non-Humean chances do. You have to "filter" them through the condition that the pattern holds. Some critics argue this makes Humean chance a "shadow" of real chance.

  **3. Circularity Worries**
  The NPP defines rational credence in terms of chance conditional on the chance theory. But the chance theory is defined by the best systematization of facts (including future facts). There is a tight loop here between what we should believe and what the chances are. Lewis argued this wasn't viciously circular, but it requires careful handling to ensure we aren't just defining credence in terms of itself.

  ### Alternative: Reject Step (1) Instead

  If you find the cost of the NPP too high (i.e., you want to keep the Original PP), you must reject **Step (1)**: Humean Supervenience.

  If you adopt a **Propensity Theory** or a **Primitivist Theory** of chance:
  *   Chances do *not* supervene on the mosaic of local facts.
  *   The chance fact $Ch(\text{Heads})=0.5$ is a fundamental property of the coin at time $t$.
  *   This fact does *not* entail anything about the future mosaic (it doesn't entail $\neg F$). A fair coin can logically produce an infinite run of heads.
  *   Therefore, $H$ does not entail $\neg F$.
  *   Therefore, $Cr(F \mid H)$ does not have to be 0.
  *   Therefore, the Original PP is safe.

  **The Cost of this Alternative:** You lose Reductionism. You must accept irreducible modal properties in your ontology (spooky "propensities" or "chance makers" that don't supervene on what actually happens). Lewis rejected this because it violated his commitment to Humean Supervenience (the idea that there are no necessary connections between distinct existences).

  ### Summary

  *   **Is the argument valid?** Yes.
  *   **Does it prove Humeanism is false?** No, it proves the *Original Principal Principle* is false *given* Humeanism.
  *   **Which step is bad?** Step (3) assumes the Original PP. You must replace it with the New PP.
  *   **What's the cost?** You have to accept a less intuitive principle (NPP) and acknowledge that Humean chances carry "inadmissible" information about the future (they entail their own non-undermining).

  Lewis's verdict: **Save Humeanism, sacrifice the Original Principal Principle.** Most contemporary Humeans follow him here. If you want to keep the Original PP, you have to become a non-Humean about chance.
