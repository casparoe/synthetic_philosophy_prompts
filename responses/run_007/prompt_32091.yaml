          2.  **Empty Names/Fiction:** Kripke's causal theory struggles here. If a name has no referent, is it rigid? If the novelist's character discovers they *don't exist* or are *fictional*, Kripkean semantics gets sticky.
          3.  **Empirical Psychology of Reference:** If experimental philosophy shows ordinary speakers are descriptivists, the causal theory loses its claim to capturing "our" concept of naming.

