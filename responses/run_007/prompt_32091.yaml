          4.  **Metaphysical Essentialism:** Rigid designation implies essential properties (origin, constitution). If you reject essentialism, rigid designation loses its grip.
          5.  **Vagueness and Transworld Identity:** How do we track an object across worlds if its properties change? Kripke says "stipulate," but that feels like cheating for a novelist exploring identity.

