      *   *Spelling:* Colour, analyse, programme, centre, etc.
      *   *Vocabulary:* Whilst, amongst, reckon, quite, proper.
      *   *Tone:* Intellectual, candid, slightly conversational but rigorous.

  6.  **Addressing the "Insulation" Question:**
