      *   *The Semantic Argument:* Do names really have *no* descriptive content? (Two-dimensional semantics).
      *   *Empty Names:* What about "Santa Claus" or "Vulcan"? Kripke's causal chain breaks if there's no initial baptism of an existing object.
      *   *Cognitive Significance:* If "Hesperus is Phosphorus" is necessary, why is it informative? (Frege's puzzle returns).
      *   *Vagueness/Identity:* What if the object's boundaries are vague? (Ship of Theseus problems applied to rigid designation).
      *   *Empirical Linguistics:* Do speakers actually behave like causal theorists? (Machery, Mallon, Nichols, Stich - Gödel case studies).
      *   *Metaphysical Costs:* Essentialism. If names are rigid, objects must have essential properties. Is this plausible? (Origin essentialism).
      *   *Two-Dimensional Semantics (Chalmers/Jackson):* This is the big gun. It tries to save the necessary a posteriori while restoring a role for primary intensions (descriptions).

  4.  **Select and Rank the Objections:**

      *   *Fatal/Severe:*
