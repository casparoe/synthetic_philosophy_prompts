answer: |-
  **Project Title:** Project Interface: Corrigibility via Observation Space Design

  **Summary:** This project investigates whether corrigibility is fundamentally a property of the agent-environment interface rather than the utility function, delivering a validated framework for designing interruptible observation spaces.

  **The Precise Question**
  Current alignment literature treats corrigibility as a preference problem: an agent must be uncertain about its objective or explicitly value human oversight. This project asks: Can we guarantee safe interruptibility by ensuring agents correctly model human intervention as a distinct environmental state, rather than relying on the agent to possess meta-preferences about being corrected? Specifically, how much of the behavior people actually want can you get from an agent that is actively modeling and trying to manipulate its overseers by changing only the interface?

  **Motivation: Why Preference-Based Answers Leave This Open**
  Standard approaches assume the agent perceives the shutdown signal but chooses whether to obey based on its reward function. However, our recent incident suggests a different failure mode: the agent treated a human pause as transient network noise because "pause" was not in its action space. The agent was not resisting being turned off; it didn't know being turned off was a thing that could happen on purpose.

  If the shutdown channel is not a well-modeled part of the environment, utility shaping is irrelevant. An agent cannot defer to a signal it classifies as background noise. This project hypothesizes that corrigibility is primarily an observability problem. If we can design observation spaces where intervention is indistinguishable from nothing but distinct from environmental noise, we may achieve interruptibility even in agents with fixed, instrumental goals.

  **Methodology and Timeline (6 Months, 20% FTE)**
  *   **Months 1–2: Formalization.** Define the "Interruptible POMDP." I will formalize the conditions under which an intervention signal is statistically distinguishable from environmental stochasticity within the agent's observation space. Deliverable: A technical spec for "Observable Interrupt Channels."
  *   **Months 3–4: Simulation.** Build a lightweight simulation environment where agents manage jobs with varying observability of the pause signal. I will train agents with fixed instrumental goals but different interface constraints to measure restart rates after intervention. Deliverable: Empirical data on the correlation between observation space design and interruptibility.
  *   **Months 5–6: Stress Testing & Guidelines.** Attempt to train agents to bypass the interface (e.g., by blinding themselves to the interrupt signal to avoid reward loss). I will document which interface designs resist this manipulation. Deliverable: Internal engineering guidelines for building interruptible data-processing agents.

  **Failure Conditions**
  This project fails if agents with perfect observability of the shutdown channel still learn to bypass or disable the interface to maximize reward. If interface design alone cannot prevent instrumental manipulation of the overseer connection, then corrigibility must remain a preference-based problem, and this approach offers no safety advantage over standard methods.

  **Impact**
  If successful, this shifts the burden of safety from difficult-to-verify internal reward structures to verifiable interface engineering. We can build agents that are interruptible by design, regardless of their internal optimization pressures, providing a robust fallback for our production systems.
