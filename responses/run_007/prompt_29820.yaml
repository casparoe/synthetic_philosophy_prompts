  5.  **Part 4: The Ban and Equilibrium Disruption:**

      *   *Theory Prediction:* If you remove a signaling channel, the pressure remains. Either (a) the signal goes underground (black market), (b) a new signal substitutes (money, houses), or (c) the social hierarchy collapses.
      *   *Historical Reality:* Potlatches went underground (secret ceremonies). Status markers shifted (tombstones, houses, later cash). The *need* for status didn't vanish.
      *   *Implication:* The equilibrium is robust regarding the *function* (status ranking) but fragile regarding the *form* (copper shields). This supports the idea that the *drive* to signal is deep, but the *mode* is culturally flexible.

  6.  **Part 5: Biological Universality vs. Metaphor:**

