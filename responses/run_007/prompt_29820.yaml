      *   *Conclusion:* Summarize. The potlatch validates the *logic* of CST but requires expanding the definition of "cost" and "fitness."

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to treat "Index" too loosely. In biology, an index is like a roar frequency tied to vocal cord size. In potlatch, is wealth tied to status structurally? Yes, but you can hide wealth. You can't hide a burned blanket. So the *act* makes it honest.
      *   *Nuance on Escalation:* Mention that escalation wasn't always linear. Sometimes it was about specific items (Coppers). Breaking a Copper was a specific move.
      *   *Nuance on Ban:* Mention the "Christmas Potlatch" adaptation. This shows cultural evolution in real-time.

  9.  **Final Polish:** Check tone. Ensure it sounds like a dialogue between scholars, not a lecture. Ensure all parts of the prompt are answered. (The prompt asks for "honest answer" on the theory scope).

  10. **Final Review against constraints:** No specific constraints other than the prompt's detailed requirements. Length should be substantial to match the depth of the query.

