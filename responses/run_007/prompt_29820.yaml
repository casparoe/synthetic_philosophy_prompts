      *   *Theoretical Tension:* Infinite escalation is unstable. It leads to collapse (bankruptcy).
      *   *Resolution:* The system isn't infinite. It's bounded by ecological carrying capacity and social safety valves (e.g., killing slaves vs. giving blankets, or the intervention of elders).
      *   *CST Adaptation:* We need *dynamic* signaling models. "Competitive altruism" or "Runaway selection" (Fisherian). The cost isn't just metabolic; it's opportunity cost. The escalation proves *current* flow, not just stored wealth.
