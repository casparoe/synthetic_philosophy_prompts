      *   *Analysis:* Potlatch looks like a Handicap because you *choose* to destroy wealth. However, is it an Index of *social network strength*? If I give a potlatch, I reveal my network's ability to produce surplus.
      *   *Verdict:* It's likely a hybrid. The destruction is a Handicap (waste), but the ability to gather the goods is an Index of underlying social/economic capacity. The *cost* (destruction) is crucial because mere accumulation isn't visible/verifiable. You must *burn* it to prove you don't need it. So, leans Handicap.

