prompt: |-
  So I'm giving a department colloquium next month defending the view that moral testimony is epistemically second-rate — not that it's worthless, but that there's a genuine asymmetry between learning a fact from testimony and learning a moral truth from testimony. The department I'm visiting is strong in social epistemology and feminist philosophy; several faculty have written about how denigrating testimony is a way of policing who gets to speak, and I expect at least one person will hear my talk as saying that people who arrive at moral views by trusting their community don't really *know* those things.

  My positive argument goes roughly: moral knowledge requires moral understanding, understanding requires grasping the reasons that make the moral claim true, and testimony alone can't give you that grasp — you need to work through the reasons yourself. I'm not saying testimony is useless for morality, just that it can't do the whole job the way it can for ordinary empirical knowledge. I think the view is right but I need to not get shredded in Q&A.

  Draft my Q&A prep sheet: the objections I'll actually get from this crowd, ordered by how likely they are and how hard they hit, phrased the way a social epistemologist or feminist philosopher would phrase them. For each: a two-minute reply, a note on where my reply is softest, and what I should concede up front to take the heat out of the room. Include the question I'm praying nobody asks.
