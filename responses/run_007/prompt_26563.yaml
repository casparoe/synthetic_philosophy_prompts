prompt: |-
  I'm a science journalist and I sit on the advisory board of the Halpern Foundation, which funds "consciousness studies" — historically that's meant philosophy of mind, neuroscience of consciousness, and a bit of contemplative science. We've got a grant proposal that's split the board right down the middle.

  The applicant wants to investigate why humans have the intuition that they're conscious in the first place. The experiments would probe things like: why people find the "hard problem" compelling even when they can't articulate it, why we attribute phenomenal states to ourselves so readily, whether the intuition that there's "something it's like" to be us survives certain kinds of cognitive debiasing, and whether children aquire it gradually or have it from the start. The applicant explicitly frames this as the "meta-problem of consciousness" — explaining our phenomenal intuitions rather than explaining phenomenal consciousness itself.

  Four board members say this is squarely within our remit: it's about consciousness, just studied through the lens of why we *think* we have it. Four others say it's cognitive psychology with a fancy name, and if we fund this we'll have to fund any study on metacognition, self-report bias, or theory of mind. The chair is abstaining and wants a decision memo from the rest of us.

  Draft the memo I'll circulate. It should recommend fund, don't fund, or fund with conditions — with clear reasoning that takes the strongest point on the losing side seriously. The bottom line needs to be something the foundation can actually act on (e.g., "fund but require the applicant to revise the framing" or "reject but invite resubmission to our psychology panel").

  And write it in British English — the foundation's London office gets shirty about American spelling.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science Journalist & Advisory Board Member of the Halpern Foundation.
      *   **Task:** Draft a decision memo regarding a split grant proposal.
      *   **Topic:** "Meta-problem of consciousness" (why humans *think* they are conscious, rather than consciousness itself).
      *   **Conflict:** Board split 4-4.
          *   *Pro:* It's about consciousness (philosophy/neuroscience intersection).
          *   *Con:* It's just cognitive psychology/metacognition with a fancy label (scope creep).
      *   **Requirements:**
          *   Recommend: Fund, Don't Fund, or Fund with Conditions.
          *   Address the strongest point of the losing side seriously.
          *   Actionable bottom line.
          *   **Style:** British English (crucial constraint).
          *   **Tone:** Professional, balanced, persuasive, suitable for an advisory board.

  2.  **Determine the Recommendation:**
      *   *Option A (Fund):* Risks alienating the "cognitive psychology" camp. Might set a precedent that dilutes the foundation's specific focus on consciousness *per se*.
      *   *Option B (Don't Fund):* Risks stifling innovative interdisciplinary work. The "meta-problem" is a significant contemporary philosophical concept (Chalmers et al.). Rejecting it outright might look reactionary.
      *   *Option C (Fund with Conditions):* This is usually the most diplomatic and actionable path in grant scenarios. It acknowledges the merit while addressing the scope concerns. It allows the foundation to support the work without conceding that *all* metacognition falls under "consciousness studies."
      *   *Decision:* **Fund with Conditions.** This bridges the gap. It validates the "consciousness" angle (satisfying the Pro side) but tightens the criteria to ensure it doesn't become generic psychology (satisfying the Con side).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the split vote.
      *   **Summary of Proposal:** Briefly recap the "meta-problem" pitch.
      *   **Analysis of the Split (The "Why"):**
          *   *Pro Side:* It addresses the *intuition* of consciousness, which is a barrier to solving the hard problem. It's philosophically rigorous.
          *   *Con Side (The Strongest Point):* The risk of scope creep. If "why we think we're conscious" counts, does "why we think we're in pain" count? It risks turning the foundation into a general cognitive science funder. *Must treat this seriously.*
      *   **Recommendation:** Fund with Conditions.
      *   **Rationale:** Why this compromises effectively. It keeps the focus on *phenomenal* intuitions specifically, not just general metacognition.
      *   **Conditions:** Specific requirements for the grantee (framing, dissemination, milestones).
      *   **Bottom Line/Action:** Clear instruction for the Chair/Secretariat.
      *   **Language Check:** Ensure British spelling (programme, centre, analyse, labelled, etc.) and tone (shirty, whilst, amongst - though keep it professional, not too colloquial).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Fund with Conditions" too vague?
      *   *Fix:* Make the conditions specific. Require them to explicitly distinguish their work from standard theory of mind research in their methodology section. Require a philosophical co-investigator to keep the conceptual rigour high.
      *   *Critique:* Did I address the "losing side" strongly enough?
      *   *Fix:* Dedicate a specific paragraph to the "Scope Creep" argument. Acknowledge that without guardrails, the Con side is absolutely right.
      *   *Tone Check:* Ensure it sounds like a colleague speaking to colleagues, not a boss giving orders. Use "I recommend" rather than "You must."
      *   *British English:* Check for "z" vs "s" (organise vs organize), "our" vs "or" (colour vs color), "program" vs "programme" (in academic contexts, 'programme' is often preferred in UK, though 'program' is used in computing. Let's stick to standard UK academic convention). *Correction:* In UK grant contexts, "programme" is standard for funding schemes, but "program" is often accepted for software. I will use "programme" for the foundation's work. Words like "labelled", "modelling", "centre".

  5.  **Final Polish:**
      *   Check the "Halpern Foundation" context. It funds consciousness studies.
      *   Ensure the "meta-problem" is explained clearly enough for the memo to stand on its own.
      *   Make sure the actionable item is distinct.

  6.  **Writing the Memo (incorporating British English constraints):**
      *   *Spelling:* Programme, centre, analyse, labelled, modelling, behaviour, honour, favour.
      *   *Vocabulary:* Whilst, amongst, shirty (maybe too informal for the memo itself, but good for the prompt context. I will keep the memo formal), remit, bid.
      *   *Date:* Use Day Month Year format.

  7.  **Final Review against constraints:**
