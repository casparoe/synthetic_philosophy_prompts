  ### The Principle of Communicative Integrity and Entitlement

  **Core Thesis:** The moral wrongness of deception is determined by the **target's entitlement to the truth** multiplied by the **degree of corruption inflicted on the communicative channel.**

  **Clause 1: The Entitlement Override.**
  If the target has no legitimate entitlement to the information (due to safety, privacy, or benign social convention), deception is permissible regardless of whether it is a lie or misleading.
  *   *Motivated by:* **Case 1 (Abusive Ex)** and **Case 5 (Surprise Party).** In both, the target's right to the truth is overridden by harm prevention or relationship maintenance, rendering the method of deception morally neutral.

  **Clause 2: The Fiduciary Corruption Rule.**
  If the agent is acting in a professional or institutional role entrusted to provide a *judgment* or *evaluation* (not merely data), evading that judgment with technically true facts is as morally wrong as falsifying the judgment. This is because it corrupts the institutional mechanism designed to convey expert synthesis.
  *   *Motivated by:* **Case 6 (Reference Letter).** You feel the misleading letter is *equal* to the lie because the form demands a hiring recommendation; providing attendance data instead is a sham compliance that breaks the channel just as effectively as a lie.

  **Clause 3: The Solicitation Asymmetry.**
  In transactional contexts where the target has entitlement to the truth, *volunteering* misleading information is worse than *lying in response* to a direct inquiry. Volunteering creates a "trap" of trust that was not demanded, whereas responding to an inquiry is a defensive protection of interest.
  *   *Motivated by:* **Case 4 (Used Car).** You feel the volunteered misleading truth is worse than a hypothetical lie to a direct question because the buyer did not ask for the information; you weaponized their trust rather than merely resisting their inquiry.

  **Clause 4: The Epistemic Agency Standard.**
  In standard social or adversarial inquiries where entitlement exists (and Clauses 2 and 3 do not apply), lying is worse than misleading. Lying removes the literal truth from the record, denying the listener any chance to deduce the reality; misleading preserves the literal truth, respecting the listener's epistemic agency to interpret your words carefully.
  *   *Motivated by:* **Case 2 (Job Interview)** and **Case 3 (Manuscript).** In these standard inquiries, you feel the lie is worse (or distinctly worse) because it shuts down the possibility of accurate interpretation, whereas the misleading statement leaves a "truth trail."

