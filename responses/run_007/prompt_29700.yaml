          *   Commitment (3) phrases indistinguishability as a *test for sameness of phenomenal character*. If I accept (3), I am pushed towards a Common Kind Theory (or at least a Common Factor view of phenomenology). If V and H have the same phenomenal character (due to 3 & 4), but V's character is constituted by the object (due to 1), then H's character must also be constituted by the object (impossible) OR V's character is not essentially constituted by the object (contradicts 1).
          *   Disjunctivists typically *reject* the inference from "indistinguishable" to "same phenomenal character." They argue indistinguishability is an epistemic notion, not a phenomenological identity claim. Commitment (3) asserts the opposite: it treats indistinguishability as evidence for phenomenological identity.

      *   *Pair (5) + Others:* (5) is basically a defense mechanism for (1) and (2) against physicalist/causal objections. It fits well with Naive Realist Disjunctivism. It doesn't create tension with (3) directly, but it reinforces the idea that the *state* is different, which makes (3)'s claim about *phenomenal character* even more pressing.

