  **1. The question**

  Accuracy-first epistemology proposes that epistemic norms are derived solely from the value of having accurate credences, where accuracy is quantified by strictly proper scoring rules. The programme's flagship result, the accuracy-dominance argument for probabilism, is famously robust: it holds regardless of which strictly proper rule is selected. This robustness is taken to demonstrate that the argument does not depend on a contentious choice of measure. However, it is unclear whether this independence extends to the rest of the epistemic toolkit. This project asks: to what extent do accuracy-based arguments for norms beyond probabilism depend on the specific choice of scoring rule? I will examine three specific norms: the Principal Principle, which connects credence to objective chance; conditionalisation, which governs belief updating; and principles of indifference, which constrain credences in the absence of evidence. These norms are selected because they represent the crucial dynamic and objective constraints required for a complete epistemology. If the accuracy-first programme is to succeed as a monist foundation for rationality, it must support these norms with the same robustness it claims for probabilism. Determining whether the choice of measure re-enters at this stage is essential for evaluating the viability of accuracy monism. Consequently, the research question is not merely technical but strikes at the heart of whether accuracy can serve as the single fundamental epistemic value. If these further norms require specific scoring rules to be derived, the claim that accuracy alone suffices is compromised.

  **2. Why it is open**

  The existing literature handles the choice of scoring rule by emphasising the class of strictly proper rules rather than any specific member. For probabilism, proponents argue that any rule within this class yields the same normative conclusion, thereby insulating the argument from objections regarding the arbitrariness of the measure. This insensitivity is marketed as a major theoretical virtue. However, when the literature moves to justify further norms, this robustness often disappears. Arguments for the Principal Principle or conditionalisation frequently rely on specific measures, such as the Brier score, or introduce additional assumptions that effectively privilege a subset of rules. Standard responses to this sensitivity typically involve defending a single privileged scoring rule from the outset, often on grounds of simplicity or geometric naturalness. Yet, this move leaves a significant gap unresolved. If accuracy is truly the sole fundamental value, the specific way we measure it should not alter the resulting norms unless the measure itself encodes extra normative content. By privileging one rule, the programme risks smuggling in additional values under the guise of measurement. Consequently, it remains an open question whether the sensitivity observed in these further arguments is a benign technical feature or a defect that undermines the monist ambition. The literature has not yet systematically mapped where this sensitivity arises, leaving the foundations of the extended programme unclear. Furthermore, some proponents suggest that while the choice matters, all strictly proper rules converge on the same norms in the limit. This claim requires rigorous testing. Without such testing, the accuracy-first programme rests on an unverified assumption that the robustness of probabilism generalises. The unresolved tension lies between the desire for a unified, measure-independent foundation and the mathematical reality that different proper rules weight errors differently. If different weightings lead to different norms regarding chance or updating, then accuracy is not doing all the normative work. The project must therefore interrogate whether the standard responses adequately secure the norms or merely patch over the instability.

  **3. Method and work plan**

  The project will employ formal modelling combined with a case-by-case philosophical examination of specific norms. This method is superior to the obvious alternative of defending a single privileged scoring rule from the outset. Defending one rule initially would beg the question against the hypothesis that the choice of measure is normatively significant. Instead, by varying the scoring rule across different normative arguments, I can map the extent of the sensitivity without presupposing a solution. The work plan is divided into four quarters over the fellowship year. During the first three months, I will establish the formal framework and review existing proofs for probabilism to set a baseline for robustness. Months four to six will focus on the Principal Principle, reconstructing accuracy-based arguments using a range of strictly proper scoring rules to identify where the choice of measure affects the derivation. Months seven to nine will apply the same methodology to conditionalisation and principles of indifference. The formal modelling will involve constructing dominance arguments and expected accuracy calculations for each norm under different measures, such as the Brier score, logarithmic score, and spherical score. I will analyse whether the conditions required for the norms to hold shift significantly across these measures. Philosophically, I will examine whether the differences in outcomes correspond to distinct epistemic intuitions or mere mathematical artefacts. This dual approach ensures that the technical results are interpreted correctly within the broader epistemological context. Moreover, this method allows for interim presentations of the findings on specific norms, facilitating feedback before the final synthesis. Finally, months ten to twelve will be dedicated to synthesising the findings and drafting the dissertation. This structured progression ensures that the technical modelling remains tied to the philosophical question. By treating the scoring rule as a variable rather than a constant, the method reveals whether the instability is isolated or systemic. This survey approach provides a comprehensive landscape of the programme's dependencies, offering a more honest assessment than attempting to force all norms to fit a single preferred measure. By avoiding premature commitment to a specific rule, the project maintains neutrality, allowing results to dictate whether accuracy monism is viable or requires pluralist supplementation.

  **4. Success and failure**

  A successful outcome would look like a detailed taxonomy of the ways in which the choice of scoring rule enters the arguments for each norm. This taxonomy would categorise norms into those that are robust across all strictly proper rules and those that are sensitive to the choice of measure. Beyond mapping, the project aims to deliver a considered verdict on whether the observed sensitivity is benign or defective. If the sensitivity is benign, it might indicate that accuracy requires supplementary constraints that are independent of the measure. If it is a defect, it suggests that accuracy monism cannot support the full suite of epistemic norms without arbitrary stipulation. Success also entails clarifying whether the robustness of probabilism is an anomaly or a reliable indicator of the programme's strength. Conversely, the project would fail if the formal modelling proves intractable for the selected norms, preventing any general conclusions. Failure would also result if the analysis yields inconclusive results where sensitivity is ubiquitous but unexplainable, leaving the philosophical verdict hanging. Ultimately, success is defined by providing a definitive answer to whether the accuracy-first programme can sustain its monist claims beyond static coherence.

  **5. Scope and risks**

  The primary risk is that the project could become too large for a year due to the mathematical complexity of generalising proofs for arbitrary scoring rules. Deriving norms for continuous belief spaces under varied measures can quickly become unmanageable. To contain this, the project will focus on finite opinion sets where possible, only moving to continuous cases if necessary for the philosophical point. Additionally, there is a risk of scope creep regarding the number of norms examined. I will strictly limit the investigation to the Principal Principle, conditionalisation, and indifference, resisting the temptation to add further norms like reflection or calibration. By keeping the mathematics instrumental to the philosophical inquiry, I will avoid getting lost in technical minutiae that do not bear on the core question of robustness. This containment strategy ensures the dissertation remains focused and completable within the fellowship period.
