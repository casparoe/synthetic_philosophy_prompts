  **INSTITUTIONAL REVIEW BOARD (IRB) DECISION MEMO**

  **TO:** Principal Investigator, Department of Economics
  **FROM:** University IRB Committee
  **DATE:** October 26, 2023
  **SUBJECT:** IRB Determination on Protocol #2024-BEHAV-089 (Pasadena Game Variant)

  **DECISION:** **APPROVAL WITH CONDITIONS**

  **I. SUMMARY OF CONFLICT**
  The Board has reviewed the proposed study examining decision-making under conditions of undefined Expected Value (EV). The protocol involves subjects playing a truncated variant of the Pasadena Game for real monetary stakes.

  A significant division arose during review regarding the ethical permissibility of the study. One faction argues that informed consent is impossible because the gamble lacks a determinate EV, preventing subjects from assessing favorability. The opposing faction argues that ambiguity is a valid object of study and that requiring a defined EV imposes an unrealistic standard of risk clarity not found in real-world decision contexts.

  After deliberation, the Board finds that the study possesses significant scientific value in understanding how agents navigate mathematical ambiguity. However, the concern regarding consent is not dismissed; rather, it requires specific procedural safeguards to ensure that the "undefined" nature of the risk is communicated without becoming deceptive regarding the *actual* financial liability.

  **II. ETHICAL ANALYSIS: THE PHILOSOPHY OF UNDEFINED RISK**

  The core ethical tension here rests on the interpretation of **Respect for Persons**, specifically the capacity for autonomous choice. The objection raised by the Board minority is epistemological: *How can a subject consent to a risk if the magnitude of that risk has no fact of the matter?*

  In standard clinical or behavioral trials, we require that risks be quantifiable so a subject can weigh them against benefits. In the Pasadena Game, the series $\sum \frac{(-1)^{n-1}}{n}$ is conditionally convergent. As the Riemann Rearrangement Theorem demonstrates, the sum depends on the order of terms. In decision-theoretic terms, there is no unique "fair price" for entry.

  The Board rejects the notion that this precludes consent. Informed consent does not require that a risk be *scalar* or *determinate*; it requires that the *structure* of the risk be transparent. A subject is capable of understanding the statement: "Mathematically, this game does not have a stable average payout, even though individual outcomes are finite." This is distinct from *unknown* risk (where parameters are hidden) or *undefined* risk (where the logic itself precludes a mean).

  However, the Board accepts the premise that consent is violated if the subject is misled about the *instantiation* of the game. This leads to the critical distinction between the **theoretical object** (the infinite Pasadena Game) and the **experimental instantiation** (the game as played in the lab).

  **III. THE TRUNCATION PROBLEM AND FINANCIAL INTEGRITY**

  The Board notes a practical contradiction in the original protocol. The Pasadena Game relies on an infinite horizon to generate the undefined EV. However, the University cannot underwrite infinite liability. Therefore, the game *must* be truncated (e.g., a maximum number of flips or a maximum payout cap).

  If the game is truncated, the EV is mathematically defined (it becomes a finite sum). If the researchers tell subjects "The EV is undefined" without disclosing the cap, they are engaging in deception regarding the financial contract. If they disclose the cap, the EV is defined, potentially altering the psychological manipulation.

  To resolve this ethically, we must prioritize truthfulness about the *contract* over the purity of the *mathematical model*. A subject cannot consent to a financial agreement that the institution cannot honor. Therefore, the study may proceed only if the ambiguity is framed as a property of the *theoretical model* being tested, while the *actual payout rules* are explicit and finite.

  **IV. REQUIRED MODIFICATIONS**

  Approval is contingent upon the following modifications to the protocol and consent form:

  1.  **Explicit Financial Capping:**
      The protocol must specify a hard cap on payouts (e.g., maximum $500 or maximum 20 flips). This cap must be determined *a priori* to ensure the University can meet its financial obligations. You cannot offer a gamble you cannot pay.

  2.  **Revised Consent Language (The "Two-Truths" Standard):**
      The consent form must distinguish between the theoretical game and the experimental payment. It should not simply state "The EV is undefined." Instead, it must articulate:
      *   *Theoretical Context:* "This task is based on a mathematical paradox where, in theory, the average payout over infinite plays is undefined."
      *   *Experimental Reality:* "However, for this specific study, payouts are limited to a maximum of $[X]. Within these limits, the possible outcomes are [List Range]."
      This allows you to test the subject's reaction to the *concept* of undefined EV without deceiving them about the *actual* financial risk.

  3.  **Comprehension Check:**
      Given the complexity of the explanation, a mandatory comprehension quiz is required before play begins. Subjects must correctly identify that while the theoretical game is paradoxical, their specific payout is limited and guaranteed by the University up to the cap.

  4.  **Debriefing Requirement:**
      Because the study relies on explaining a mathematical paradox to induce a cognitive state, a thorough debriefing is required. Subjects must be informed after the experiment about why the infinite series creates the paradox and how the truncation resolves it practically. This ensures that no subject leaves believing they engaged in a transaction with truly indeterminate value.

  **V. CONCLUSION**

  The Board concludes that the inability to calculate a standard Expected Value does not render a gamble unethical, provided the ambiguity is not used to obscure the actual terms of exchange. The ethical breach would not lie in offering an undefined-EV gamble, but in failing to clarify that the *instantiated* gamble is necessarily finite.

  By separating the *mathematical explanation* (which creates the psychological stimulus) from the *payment contract* (which creates the ethical obligation), you can preserve the scientific integrity of the behavioral manipulation while satisfying the requirements of informed consent.

  Please submit the revised consent forms and protocol detailing the payout cap within 14 days.

  **Signed,**

  **[Your Name/Chair Name]**
  **Chair, University IRB**
