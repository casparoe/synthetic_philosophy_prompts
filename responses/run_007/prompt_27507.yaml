  Alright, here's something I've been turning over and I want to see it laid out clearly. The problem of future contingents — Aristotle's sea battle — gets introduced in intro courses as a puzzle about bivalence: if it's already true now that there will be a sea battle tomorrow, then it seems like the future is fixed, and that's spooky. So maybe future contingent statements are neither true nor false. Fine. But what I want explained is why this move — giving up bivalence for future contingents — is actually a much bigger deal than it looks. Because once you say some statements about the future lack truth values, you've got to revise your logic. Disjunctions, conditionals, the law of excluded middle — all of it gets weird. Walk me through the logical costs: what exactly breaks in classical logic when you go three-valued for future contingents, what the supervaluationist tries to salvage and at what price, and why someone who just wants to keep classical logic has to either accept fatalism or deny that future contingents are really contingent in the way we thought. I want to come away understanding why this isn't just a cute puzzle about tomorrow's naval battle but a genuine fork in the road for logic and metaphysics. And write it in American English please — I'm grading papers and my brain is in that mode.
