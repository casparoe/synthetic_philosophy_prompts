answer: |-
  # Joint Statement on the Structure of the Death in Damascus Problem

  **To:** The Decision Theory Community  
  **From:** A Causal Decision Theorist (CDT) and an Evidential Decision Theorist (EDT)  
  **Subject:** Clarifying the Substantive Disagreement in the Death in Damascus Scenario  
  **Date:** October 26, 2023

  ### Introduction
  We, the undersigned, acknowledge that discussions regarding the "Death in Damascus" problem often suffer from talking past one another. CDT proponents frequently frame the problem as one of causal fixedness, while EDT proponents frame it as one of evidential correlation. This has led to confusion about whether the theories disagree on the *recommendation* (what to do), the *diagnosis* (why the problem is hard), or the *implications* (what this says about rationality).

  This document represents the outcome of an adversarial collaboration aimed at isolating the precise points of divergence. We do not claim to have resolved the debate. We claim to have mapped it.

  ---

  ### 1. Agreed Claims
  *Both signatories affirm the following substantive claims regarding the problem structure and theoretical commitments.*

  1.  **The Correlation is Perfect:** We agree that within the bounds of the thought experiment, the correlation between the Agent's choice and Death's location is effectively 1.0. If the Agent chooses Damascus, Death is in Damascus. If the Agent chooses Aleppo, Death is in Aleppo.
  2.  **Deliberative Instability:** We agree that for a standard agent using either theory, pure strategies (always choosing Damascus or always choosing Aleppo) lead to **deliberative instability**. If the agent concludes "I will choose Damascus," they update that Death is in Damascus, which gives them reason to choose Aleppo. This loop prevents convergence on a pure strategy without additional theoretical machinery (e.g., mixed strategies or ratification).
  3.  **The Preference Structure:** We agree on the utility ordering: Survival > Death in Damascus > Death in Aleppo. The preference for Damascus is conditional on death being inevitable; survival is always preferred to death.
  4.  **Distinction from Newcomb's Problem:** We agree that while Death in Damascus and Newcomb's Problem share structural similarities (prediction), they are not identical. In Newcomb's, the box content is fixed *before* the choice based on a prediction of the choice. In Damascus, Death's location is fixed *before* the choice based on a prediction of the choice. The payoff structure differs: Newcomb's rewards correlation (One-Boxing); Damascus punishes it (matching leads to death).
  5.  **Convergence on Randomization (Under Standard Assumptions):** We agree that if the Agent can credibly commit to a mixed strategy (randomization) that Death cannot perfectly predict (e.g., a quantum coin flip unknown to Death until the moment of action), both theories recommend randomizing to minimize the probability of death, provided the survival probability outweighs the preference for dying in Damascus.
  6.  **Failure of Naive Maximization:** We agree that a naive application of Expected Utility (calculating $P(Death|Action)$ once and maximizing) fails for both theories because the probability $P(Death|Action)$ is dependent on the Agent's own decision algorithm, which is the variable being optimized.

  ---

  ### 2. Disagreements Table
  *Where we diverge. We have phrased these positions charitably to ensure each signatory recognizes their own view.*

  | Question | Causal Decision Theorist (CDT) | Evidential Decision Theorist (EDT) |
  | :--- | :--- | :--- |
  | **1. What is the primary source of the deliberative instability?** | The instability arises because the Agent treats their own decision as **evidence** of a past event (Death's location) that they cannot causally influence. CDT seeks to screen off this evidence to find the causally dominant act. | The instability arises because the Agent fails to fully internalize that their decision **is** the evidence. The correlation is real and normative; ignoring it (as CDT attempts to) creates a blind spot that manifests as a loop. |
  | **2. Is "Ratification" a necessary condition for rationality?** | **Yes.** A decision is rational only if, upon making it, the Agent does not regret it given the information the decision itself reveals. The instability shows that pure strategies are unratifiable; thus, rationality requires a mixed strategy or a shift in epistemic state. | **Mostly No.** Ratification is a useful diagnostic tool, but it is a patch imported to save CDT from instability. EDT naturally accounts for the evidence of the action without needing a separate "ratification" step; the instability is just the theory correctly reporting that no pure act has high expected utility. |
  | **3. Does the Agent have access to their own decision state (The "Tickle")?** | **Yes (in principle).** If the Agent knows their own mind (their "tickle" or decision state) *before* the action, they can condition on that. Since Death predicted based on that state, knowing the state screens off the action. $P(Death | Action, State) = P(Death | State)$. This dissolves the correlation. | **No.** The prediction is of the *action*, not merely the internal state. Even if I know my inclination, the act of executing the choice provides new evidence that updates the probability of Death's location. The correlation persists through the action. |
  | **4. What is the normative lesson of the problem?** | This problem demonstrates that in environments with perfect predictors of **choice**, agents must obscure their decision process (randomize) to preserve causal autonomy. CDT correctly identifies that you cannot causally move Death by moving yourself. | This problem demonstrates that ignoring evidential correlations leads to deliberative paralysis. EDT correctly identifies that your choice is diagnostic of your fate, and rationality requires managing that diagnostic information (e.g., via randomization) to improve outcomes. |
  | **5. How does this relate to Newcomb's Problem?** | **Disanalogy.** In Newcomb's, Two-Boxing is the correct causal move even if it yields less money. In Damascus, the causal move leads to a loop. CDT treats them differently: Newcomb rewards causal independence; Damascus punishes predictability. | **Analogy.** Both problems hinge on how you treat correlations between your choice and an external variable. If you One-Box in Newcomb (accepting the correlation), you should accept the evidential link in Damascus. Rejecting the link in Damascus while keeping One-Boxing in Newcomb is inconsistent. |

  ---

  ### 3. Cruxes
  *Specific sub-questions where resolving the fact or logic would shift our credences. We agree these are the battlegrounds.*

  #### Crux A: The Viability of the "Tickle Defense"
  *   **Sub-question:** Can an agent access a mental state prior to action that screens off the correlation between Action and Death's Location?
  *   **Test/Argument:** Consider a variant where the Agent is given a full printout of their own brain state *before* choosing.
      *   **CDT Prediction:** Conditioning on this brain state renders the Action probabilistically independent of Death's Location. The loop dissolves. The Agent should go to Damascus (their preferred death site) because they can no longer influence Death's location.
      *   **EDT Prediction:** Conditioning on the brain state does not screen off the correlation because the prediction was of the *final output*, not the intermediate state. The correlation remains $P(Death|Action) \approx 1$. The Agent should still randomize or face the loop.
  *   **Why it matters:** If the Tickle Defense works, CDT avoids the instability without needing mixed strategies. If it fails, CDT requires more complex machinery (ratification) to match EDT's performance.

  #### Crux B: Consistency with Newcomb's Problem
  *   **Sub-question:** Is there a single principled distinction that justifies Two-Boxing in Newcomb's but Randomizing in Damascus?
  *   **Test/Argument:** Construct a "Death in Newcomb" hybrid. Omega predicts your choice. If you One-Box, Omega puts \$1M in Box B. If you Two-Box, Box B is empty. *However*, if you Two-Box, Omega also sends Death to your location.
      *   **CDT Prediction:** The causal impact of Two-Boxing is +\$1000 (Box A). The causal impact on Death is null (Death is already sent). Therefore, CDT recommends Two-Boxing and accepting the risk of Death as a fixed fact.
      *   **EDT Prediction:** Two-Boxing is strong evidence that Box B is empty *and* that Death is coming. The evidential disutility of Death outweighs the \$1000. EDT recommends One-Boxing to avoid the evidence of Death.
  *   **Why it matters:** If CDT recommends Two-Boxing+Death, it looks like it ignores vital information. If EDT recommends One-Boxing, it looks like it treats the prediction as causal. This tests whether the "Causal vs. Evidential" distinction holds up when stakes are asymmetrical.

  #### Crux C: The Definition of "Rationality" in Unwinnable Scenarios
  *   **Sub-question:** In a scenario where Death is a perfect predictor (Survival = 0%), is it rational to choose the preferred death location (Damascus) even if doing so ensures Death finds you there?
  *   **Test/Argument:** Remove the randomization option. You must pick A or D. Death matches you.
      *   **CDT Prediction:** Rationality requires maximizing utility given fixed causal facts. Since Death's location is fixed by the past prediction, my choice cannot change it. I should choose Damascus to secure the +1 utility bonus of dying at home. The fact that this choice *confirms* the prediction is irrelevant to the causal calculation.
      *   **EDT Prediction:** Rationality requires maximizing expected utility conditional on the act. $E[U|Damascus]$ includes the certainty of death. $E[U|Aleppo]$ includes the certainty of death. Since both lead to death, we compare the secondary utility. However, because the choice *confirms* the death, EDT agents may feel a "regret" that CDT agents do not. EDT is more likely to view the scenario as fundamentally broken for decision theory.
  *   **Why it matters:** This isolates whether the disagreement is about *survival* (where we agree on randomization) or about *dignity/preference* in the face of fate.

  ---

  ### 4. Flagged Verbal Disputes
  *We suspect the following disagreements may be partially verbal, though they have substantive downstream effects.*

  **The Definition of "Causal Independence"**
  *   **The Issue:** When the CDT signatory says "My choice does not *cause* Death's location," and the EDT signatory says "My choice is *evidence* of Death's location," we are often using different models of the word "cause."
  *   **Why it's verbal:** The CDTer is using a **counterfactual** definition of cause ("If I were to choose D, would Death *change* location?"). The EDTer is using a **probabilistic** definition ("Does choosing D change the *probability* I assign to Death being in D?").
  *   **Substantive Residue:** Even if we agree on the definitions, we disagree on which definition is normatively relevant for decision-making. The CDTer believes rationality tracks counterfactuals. The EDTer believes rationality tracks conditional probabilities. This is not merely semantic; it dictates the algorithm. However, much of the heat in the debate comes from CDTers accusing EDTers of "magic" (believing choices change the past) and EDTers accusing CDTers of "blindness" (ignoring known correlations). We agree these accusations are uncharitable summaries of the underlying structural disagreement.

  **The Meaning of "Solution"**
  *   **The Issue:** When we say a theory "solves" Death in Damascus, do we mean it outputs a stable action, or that it provides a satisfying explanation of the scenario?
  *   **Why it's verbal:** CDT often "solves" the loop by invoking ratification (a stability condition). EDT "solves" it by accepting the low utility of both options.
  *   **Substantive Residue:** The disagreement is whether the *instability itself* is a bug in the theory (CDT view: the theory shouldn't loop) or a feature of the world (EDT view: the world offers no good options, so the theory should report low utility for everything).

