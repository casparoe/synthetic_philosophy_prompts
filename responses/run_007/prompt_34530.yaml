prompt: |-
  Okay so I've been reading the decision theory sequences for years and there's one thing that still drives me nuts: every time Death in Damascus comes up, the CDT and EDT people just completely talk past each other. They use different examples, different framings, and I can never tell whether they actually disagree on substance or just on how to describe what's happening.

  I want to fix this. You're an expert philosopher who specializes in decision theory and also in adversarial collaboration methodology. Please think carefully about the structure before you write anything — maybe brainstorm the key pressure points first.

  Draft the joint statement that a committed causal decision theorist and a committed evidential decision theorist could both sign after a good-faith adversarial collaboration, focused specifically on the Death in Damascus problem. (Quick refresher: Death is a perfect predictor. You choose between Damascus and Aleppo. If Death predicted Damascus, you die in Damascus; if Death predicted Aleppo, you die in Aleppo. You'd slightly prefer to die in Damascus if you have to die at all, because your family is there.)

  The document should have these sections:

  1. Agreed claims (numbered). Make these substantive — not "we both agree modus ponens is valid" but claims about the problem's structure, about what each theory actually commits to, about what the problem does and doesnt demonstrate. If there are claims about the relationship between this problem and Newcomb's problem or the smoking lesion that both sides accept, include those.

  2. Disagreements table. Columns: the question, the CDT answer (worded so a CDT advocate would say "yep, that's me"), the EDT answer (same standard). No caricatures. If a position has internal variants, pick the most defensible version.

  3. Cruxes. For each one: what's the sub-question, what's a concrete test or argument both sides agree bears on it, and what does each side predict about that test.

  4. If any part of the dispute looks merely verbal to you, flag it and explain why.

  The goal is a document that could actually go on LessWrong and have people from both camps say "finally, someone got my view right." Don't resolve the debate — just make the remaining disagreement as precise as possible.

  Write in American English.
