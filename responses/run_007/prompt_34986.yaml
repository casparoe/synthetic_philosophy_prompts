  # Joint Statement on the Sleeping Beauty Problem
  **Following an Adversarial Collaboration**

  **Signatories:** [Representative of the Halfer Position], [Representative of the Thirder Position]

  ### 1. Agreed Claims

  1.  **Ex Ante Fairness:** Both parties agree that on Sunday, prior to the experiment commencing, Beauty's credence that the coin will land Heads is exactly $1/2$. The coin is fair, and no evidence exists to suggest otherwise.
  2.  **Formalism of Centered Worlds:** Both parties agree that the situation is best modeled using centered worlds (pairs of a possible world and a temporal/individual index) to account for self-locating belief. Both agree that Beauty's uncertainty upon waking is partially self-locating (i.e., "What day is it?" or "Is this my first awakening?").
  3.  **Validity of Betting Arguments:** Both parties agree that Dutch Book arguments are relevant to assessing rational credence but acknowledge that such arguments are sensitive to the counting procedure (e.g., whether bets are settled per experiment or per awakening). Both agree that a Dutch Book can be constructed against either position depending on the assumed betting protocol, and thus no single betting argument is decisive without prior agreement on the protocol.
  4.  **Normative Goal:** Both parties agree that the goal of the debate is to determine the norms of rational belief updating in cases involving memory loss and self-location. A successful resolution must specify whether standard Conditionalization applies, requires modification, or should be replaced by a different updating rule in self-locating contexts.
  5.  **Monday Certainty:** Both parties agree that if Beauty were informed upon waking that it is Monday, her credence in Heads should return to $1/2$. The disagreement concerns solely the inference drawn from the uninformative awakening itself.
  6.  **Decision-Guiding Role:** Both parties agree that credence should guide rational action in standard decision-theoretic scenarios, though they disagree on how to map credence to action when the agent's actions are repeated across centered worlds without memory.

  ### 2. Disagreements Table

  | Point of Disagreement | Halfer Position | Thirder Position |
  | :--- | :--- | :--- |
  | **1. Nature of Evidence** | Upon waking, Beauty gains no new *relevant* evidence about the coin toss. The proposition "I am awake now" is guaranteed to be true in all scenarios under consideration and thus cannot shift the probability of the coin outcome. | Upon waking, Beauty gains new *indexical* evidence. She learns that she is in a specific awakening event. Since there are three possible awakening events (Heads-Monday, Tails-Monday, Tails-Tuesday) and only one involves Heads, this evidence shifts the probability. |
  | **2. Reference Class for Credence** | Credence in Heads refers to the chance that the *coin toss* resulted in Heads. This is a property of the experimental trial, not the awakening. | Credence in Heads refers to the chance that *this current awakening* is associated with a Heads outcome. This is a property of the current subjective experience. |
  | **3. Application of Conditionalization** | Standard Conditionalization applies. Since $P(\text{Awake} | \text{Heads}) = 1$ and $P(\text{Awake} | \text{Tails}) = 1$, the likelihood ratio is 1:1, and the prior ($1/2$) remains unchanged. | Generalized Conditionalization (or the Principle of Indifference over centered worlds) applies. Beauty should distribute credence equally over indistinguishable centered worlds consistent with her evidence. |
  | **4. Long-Run Frequency** | The frequency of Heads *awakenings* (1/3) is distinct from the frequency of Heads *tosses* (1/2). Credence should track the latter. | In self-locating contexts, rational credence should align with the frequency of the observer-moments. If Beauty repeats the experiment many times, 1/3 of her awakenings will be Heads-associated. |

  ### 3. Cruxes

  **Crux 1: The Relevance of Indexical Information**
  *   **The Question:** Does the mere fact of existing in a specific centered world constitute evidence that updates probabilities about uncentered propositions (like the coin flip)?
  *   **Concrete Test:** The "Spectator Variant." A bystander watches the experiment from outside, knowing the protocol but not observing the coin. The bystander is asked for their credence in Heads whenever Beauty is awake.
      *   **Halfer Prediction:** The bystander's credence should be $1/2$. Since Beauty has no information the bystander lacks regarding the coin, Beauty's credence should match the bystander's ($1/2$).
      *   **Thirder Prediction:** The bystander's credence is $1/2$, but Beauty's is $1/3$. Beauty possesses indexical evidence ("I am the one waking up") that the bystander lacks, justifying the divergence.
  *   **Resolution Condition:** If it can be demonstrated that indexical information *never* updates uncentered propositions, Halfers win. If it is shown that rational action diverges between Beauty and the Spectator in identical betting scenarios, Thirders win.

  **Crux 2: Betting Protocols and Utility**
  *   **The Question:** Should rational credence be defined by betting odds in scenarios where bets are offered at every awakening?
  *   **Concrete Test:** The "Scaled Payoff" Case. Beauty is offered a bet upon every awakening: pay \$1 to win \$X if Heads. The bet is settled once per experiment (not per awakening).
      *   **Halfer Prediction:** Beauty should accept the bet if $X > 1$ (reflecting $P=1/2$). Accepting based on $1/3$ would lead to expected loss.
      *   **Thirder Prediction:** Beauty should accept the bet if $X > 2$ (reflecting the effective odds of the awakening). Thirders argue credence ($1/3$) dictates the price, but the payout structure requires adjusting for the number of bets placed.
  *   **Resolution Condition:** Agreement on whether "credence" is defined by the break-even point of the bet *per awakening* or the break-even point of the bet *per experiment*.

  **Crux 3: The Reflection Principle**
  *   **The Question:** Does Beauty violate van Fraassen's Reflection Principle (that current credence should equal expected future credence)?
  *   **Concrete Test:** On Sunday, Beauty calculates her expected credence in Heads upon waking.
      *   **Halfer Prediction:** Beauty violates Reflection, but this is permissible because she knows she will lose information (memory wiping). Violation is a feature, not a bug, of memory loss.
      *   **Thirder Prediction:** Beauty does not violate Reflection. On Sunday, her credence in "Heads given I am awake Monday" is already $1/3$. The proposition believed on Sunday differs subtly from the proposition believed on Monday.
  *   **Resolution Condition:** Determining whether the proposition believed on Sunday is identical to the proposition believed on Monday.

  ### 4. Verbal Dispute Analysis

  We conclude that a **significant portion of the dispute is verbal**, specifically regarding the target proposition of the credence assignment.

  *   **Why:** When Halfers assert "The probability of Heads is $1/2$," they are assigning probability to the uncentered proposition *The coin landed Heads*. When Thirders assert "The probability of Heads is $1/3$," they are assigning probability to the centered proposition *This awakening is associated with a Heads coin toss*.
  *   **Dissolution:** Once these propositions are distinguished, the mathematical calculations of both sides are internally consistent. The Halfer correctly calculates the probability of the coin outcome; the Thirder correctly calculates the probability of the observer-moment type.
  *   **Remaining Substantive Dispute:** A normative disagreement remains regarding which proposition *ought* to guide action and belief in self-locating contexts. Specifically, should rational agents align their degrees of belief with the frequency of events (Tails) or the frequency of experiences (Awakenings)? This normative question is not merely verbal.

  ***

  **Editorial Note:**
  I am moderately confident (approx. 75%) in the accuracy of these formulations as a representation of the current state of the adversarial collaboration literature. The Agreed Claims and Disagreements Table align closely with standard positions found in works by Elga, Lewis, Titelbaum, and Mahtani. I am least sure of the **Verbal Dispute Analysis** section. While many contemporary philosophers (e.g., Groisman, Mahtani) argue for a verbal dissolution, committed participants on both sides often insist the dispute remains substantive regarding normative epistemology. Characterizing it as "significant portion... verbal" might be too conciliatory for hardline proponents on either side who view the definition of credence itself as the substantive battleground.
