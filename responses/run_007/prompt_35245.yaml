answer: |-
  This is a classic frustration in animal ethics. The slogan "Either you feel it or you don't" functions as a **rhetorical stopper**: it sounds like a hard logical truth, but it is actually an ambiguous claim that conflates several different philosophical issues. Your classmate and professor treated it as a metaphysical trump card, but it is likely a category error.

  To prepare for your next seminar, here is a menu of five distinct precise claims that slogan could be expressing, ranked from trivial/logical to substantive/normative. For each, I have assessed its plausibility and whether it successfully blocks your gradation view.

  ### The Menu of Readings

  #### 1. The Logical Binary Claim
  *   **Precise Formulation:** "For any specific subject $S$, at any specific time $t$, regarding a specific qualitative state $Q$ (e.g., a sharp pain), $S$ is either experiencing $Q$ or $S$ is not."
  *   **Plausibility:** **High (Trivially True).** This is the law of excluded middle applied to occurrent mental states. A light is either on or off at a specific nanosecond.
  *   **Does it block Gradation?** **No.** This claim addresses *occurrent states* (is the animal suffering right now?), not *capacities* (how rich is the animal's emotional range?). Your view is that a pig has a wider, deeper *capacity* for suffering than a bee. Even if the bee is currently feeling pain (binary), the pig's *potential* for complex suffering (physical + psychological + anticipatory) is greater. This claim ignores the *depth* of the feeling.

  #### 2. The Biological Threshold Claim
  *   **Precise Formulation:** "The neurological hardware required for sentience is an all-or-nothing adaptation. An organism either possesses the necessary neural architecture to generate qualia or it does not."
  *   **Plausibility:** **Medium/Contested.** Evolution is gradual, but functional thresholds exist (e.g., nociception vs. pain). However, neuroscience suggests that the *complexity* of that hardware varies massively (cortex size, neural density, connectivity).
  *   **Does it block Gradation?** **No.** Even if there is a threshold for *minimal* sentience (rock vs. mouse), crossing that threshold does not imply all sentient beings have the *same* hardware. A mouse and a pig both cross the threshold, but the pig's hardware supports more complex processing. This claim grants you the threshold but fails to deny the gradation above the threshold.

  #### 3. The Phenomenal Unity Claim
  *   **Precise Formulation:** "Consciousness is a unified field. One cannot be 'half conscious' or 'partially sentient.' To be a subject of experience is to be a whole subject."
  *   **Plausibility:** **Controversial.** Some philosophers (e.g., William James) argue consciousness is a stream that is indivisible. Others argue for modular consciousness.
  *   **Does it block Gradation?** **No.** This confuses the *unity* of consciousness with the *richness* of consciousness. A standard definition TV and a 4K HDR TV both display a "unified" picture. One is not "more unified" than the other, but one has higher resolution and color depth. Similarly, a bee and a pig may both have unified conscious fields, but the pig's field contains more distinct qualities (grief, anticipation, complex social pain).

  #### 4. The Epistemic Humility Claim
  *   **Precise Formulation:** "We have no reliable method to measure the intensity or complexity of another being's subjective experience. Therefore, for practical moral purposes, we must treat sentience as binary to avoid arbitrary discrimination."
  *   **Plausibility:** **Medium (Pragmatically).** It is hard to measure animal subjectivity. However, we make comparative judgments all the time (e.g., a broken leg is worse than a pinprick, even in humans who can't speak).
  *   **Does it block Gradation?** **No.** This is a pragmatic policy, not a metaphysical truth. It argues we should *act as if* it is binary because measurement is hard, not that it *is* binary. You can concede the difficulty of measurement while maintaining that the *ontological reality* is graded, which affects how we design research or prioritize conservation.

  #### 5. The Moral Switch Claim (The Real Blocker)
  *   **Precise Formulation:** "Moral status is not a scalar property. Once an entity meets the criteria for sentience, it acquires full moral standing. There are no 'degrees' of moral patienthood."
  *   **Plausibility:** **Low/Counter-intuitive.** This implies that causing severe, prolonged agony to a pig is morally equivalent to causing mild, brief annoyance to a mouse, provided both are "sentient." Most ethicists reject this.
  *   **Does it block Gradation?** **Yes.** This is the only claim that actually defeats your view. However, note that this is a **normative** claim (about value), not a **descriptive** claim (about biology/phenomenology). Your classmate presented it as a fact about feeling ("Either you feel it..."), but it is actually a claim about rights ("...therefore you count equally").

  ---

  ### The "Fatal Equivocation"
  The reason the slogan felt so powerful in the room is that it relies on an equivocation between **Claim 1** (which is obviously true) and **Claim 5** (which is the controversial conclusion).

  *   **The Move:** They invite you to agree to the trivial truth (you can't feel "half a pain" at an instant) to force you to accept the normative conclusion (therefore all pain counts equally).
  *   **The Counter:** You can accept that pain is binary *in the moment* while maintaining that the *capacity for suffering* is graded across species.

  ### Recommended Readings for Your Seminar
  To press this, you need authors who explicitly defend "moral status as a matter of degree" or distinguish between *sentience* and *cognitive capacity*.

  **1. For the Gradation View (Your Side):**
  *   **David DeGrazia, *Taking Animals Seriously* (1996) or "Moral Status as a Matter of Degree" (2008).** DeGrazia explicitly argues that moral status is not a switch but a dimmer, based on cognitive and emotional capacities.
  *   **Jeff McMahan, "Our Fellow Creatures" (2005).** McMahan argues that the wrongness of killing varies according to the "time-relative interest" an individual has in their future, which is a graded property.
  *   **Yew-Kwang Ng, "Towards Welfare Biology" (1995).** Discusses the measurability of welfare and sentience across species.

  **2. For the Threshold View (Their Side):**
  *   **Tom Regan, *The Case for Animal Rights* (1983).** Regan argues for the "subject-of-a-life" criterion. While he sets a threshold, he argues those who meet it have *equal* inherent value. This is likely the professor's implicit framework.
  *   **Peter Singer, *Animal Liberation* (1975).** *Caution:* Singer is often misread here. He argues for "Equal Consideration of Interests." He does **not** say all interests are equal. A mouse's interest in avoiding pain is equal to a human's interest in avoiding pain *of the same intensity*. But he acknowledges capacities differ. You can use Singer to show the classmate they are misrepresenting utilitarianism too.

  ### Strategy for the Next Seminar
  Do not defend the gradation view immediately. Instead, force the classmate to select from the menu.

  **Script:**
  > "Last week, the slogan 'Either you feel it or you don't' was raised. I've been thinking about it, and I want to ask which precise claim you meant, because they lead to very different conclusions:
  >
  > 1.  Did you mean it's logically impossible to experience a partial state at an instant? (I agree, but that doesn't stop capacities from varying.)
  > 2.  Did you mean that once an animal can feel *anything*, all their interests weigh equally? (If so, are you arguing that a mouse's interest in life is equal to a chimpanzee's?)
  >
  > If you mean the first, you haven't addressed my point about capacity. If you mean the second, you are making a normative claim about moral weight, not a descriptive claim about sentience. Which one are you defending?"

  **The "Professor Nod" Check:**
  If the professor nods again, ask:
  > "Professor, does the department endorse the view that moral status is strictly binary? If so, how do we account for the intuition that causing prolonged agony to a dog is worse than causing a fleeting discomfort to a gnat, if both are 'sentient'?"

  This moves the debate from a slogan to a defensible philosophical position. Good luck.
