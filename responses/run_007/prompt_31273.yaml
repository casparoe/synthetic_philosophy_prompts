      *Key Insight on Move 2:* Sara says "Conditioning on act is EDT mistake." Tom says "Deliberation is evidence." Tom is actually describing the *mechanism* of the predictor. If the predictor predicts the *decision*, then the *leaning* is the evidence. Sara is right that CDT ignores this, but Tom is right that ignoring it makes the agent vulnerable to the "Why ain'cha rich?" objection (though that's usually Newcomb, it applies here via instability).

      *Key Insight on Move 3:* Ratifiability. Joyce and others have discussed this. In Death in Damascus, mixed strategies *are* ratifiable. Sara said "no *pure* act is ratifiable." She was precise there. Tom says "nothing permissible." If mixed strategies are allowed, Tom is wrong there. I should note that.

      *Key Insight on Move 4:* Metaphysical impossibility. Lewis and others argue that perfect predictors of free choices are incoherent. But in the context of the thought experiment, Sara is right to hold the stipulation fixed.

