answer: |-
  The Clinton deposition episode exposes no fatal limitation in the Gricean framework but instead confirms its utility by showing how strategic ambiguity arises when the Cooperative Principle is suspended, allowing a speaker to retreat from conversational implicature to literal sentence meaning to evade adversarial scrutiny.

  In the original affidavit, the sentence "There is no sexual relationship" possesses a clear sentence meaning determined by the semantic value of "is" as present tense. However, in a standard cooperative conversation, the *what is said* is merely the base for generating *conversational implicatures* via the Maxim of Quantity (make your contribution as informative as required) and Relation. The reasonable hearer infers not just that no relationship exists at this exact second, but that no relevant sexual relationship exists within the context of the inquiry. Clinton's later defense relies on severing this link, insisting that his *speaker meaning* (what he M-intended to communicate) was identical to the narrow sentence meaning, thereby claiming he did not intend the broader implicature. Gricean theory allows for this distinction, but it typically holds that if a speaker knowingly allows a false implicature to stand uncorrected, they are still responsible for the misleading communication; Clinton's maneuver attempts to immunize himself by claiming the implicature was never part of his M-intentions, only the literal proposition.

  When Clinton later states in the deposition that the truth "depends on what the meaning of the word 'is' is," he performs a meta-linguistic shift that explicitly flouts the Maxim of Manner (avoid ambiguity) and Relation (be relevant). In a Gricean cooperative exchange, such an answer would generate an implicature that the speaker is confused or needs clarification. In the adversarial context of a deposition, however, the Cooperative Principle is not merely flouted but suspended; the participants have divergent goals (extraction of information versus containment of liability). Consequently, the implicature generated is not one of cooperative clarification but of strategic resistance: "I will not provide the binary truth value you seek." The lawyers, recognizing the suspension of cooperation, do not infer confusion but rather evasion, treating the utterance not as a contribution to shared knowledge but as a move in a zero-sum game.

  Regarding the speaker-meaning versus sentence-meaning distinction, Clinton is not claiming he never speaker-meant what the questioner took him to mean; rather, he is retroactively redefining his speaker meaning to align with a technical sentence meaning that contradicts the pragmatic uptake. Grice defines non-natural meaning in terms of the audience's recognition of the speaker's intention. If the audience recognized an intention to deceive (via implicature), then per Grice, that was the meaning, regardless of the literal semantics. Clinton's defense attempts to bypass the audience's recognition condition by appealing to a legalistic standard of truth (literal fidelity) over a pragmatic standard of communication (intended uptake). This creates a tension where the "meaning" is split between the legal record (sentence meaning) and the public sphere (speaker meaning/implicature).

  Ultimately, this episode does not break the Gricean machinery but highlights its boundary conditions regarding institutional speech. Grice assumes a shared goal of effective information exchange, which allows implicatures to function as shortcuts. In adversarial settings, these shortcuts become traps, and the maxims become weapons rather than guides. The framework handles this perfectly well provided one acknowledges that the Cooperative Principle is context-dependent and can be opted out of; the scandal arises not because language fails to work as Grice describes, but because the public expects cooperative norms in a context where the speaker has successfully invoked adversarial privileges. The limitation is not in Grice's account of meaning, but in the assumption that all public discourse operates under the Cooperative Principle.
