answer: |-
  **Activity Title:** The Inventory Audit
  **Class Size:** 14 Students (Two groups of 7)
  **Time:** 80 Minutes

  ### Materials
  1.  **The Scene:** Three identical wooden blocks arranged on a central table. Two blocks are touching (flush against each other); the third is separated by 10cm.
  2.  **Handout A (7 copies):** "Audit Protocol Alpha."
  3.  **Handout B (7 copies):** "Audit Protocol Beta."
  4.  **Whiteboard:** For recording final numbers.

  ### Handout Text
  *Do not label these "Rule Sets." Label them "Official Audit Protocols."*

  **Protocol Alpha:** "An **item** is defined as any single physical block present in the scene. Contact between blocks does not alter item status. Count all blocks."
  **Protocol Beta:** "An **item** is defined as any maximal connected cluster of physical material. If blocks touch, they constitute one item. Count all clusters."

  ### Timeline & Procedure

  **1. Joint Observation (0–10 mins)**
  Place the blocks on the table. Tell the class: "You are all auditors tasked with filing a single inventory report for this scene. Before anything else, you must agree on every physical fact."
  Ask students to describe the scene until consensus is reached (e.g., "Three blocks," "Two touching," "One separate," "Same wood type"). Write these agreed facts on the board. **Crucial:** Ensure no one uses the word "object" or "item" yet, only physical descriptions.

  **2. Secret Assignment (10–15 mins)**
  Divide the class into Group A and Group B. Move them to opposite sides of the room. Distribute Handout A to Group A and Handout B to Group B.
  **Instruction:** "You must follow your Protocol strictly. This is confidential. You cannot show your handout to the other group. Your goal is to convince the other group that your count is the correct one for the inventory report."

  **3. The Negotiation (15–55 mins)**
  Bring groups back together. Appoint one spokesperson per group.
  **Task:** "Produce one signed inventory report with a single number."
  **Constraint:** They may discuss the scene freely but cannot reveal their Protocol text. They must argue for their number based on what is "really there."
  *Facilitator Role:* Intervene only if they compromise (e.g., "Let's say 2.5"). Insist they must agree on an integer that reflects reality. If they stall, ask: "Are you disagreeing about the wood, or the count?"

  **4. The Reveal & Debrief (55–80 mins)**
  Have groups reveal their Protocols. The disagreement will likely dissolve into laughter or confusion ("You were counting clusters?"). Use this transition to introduce technical vocabulary.

  ### Debrief Design

  **1. Mapping the Disagreement (55–65 mins)**
  Ask: "Did anyone lie about the wood?" (No). "Did anyone see different blocks?" (No).
  **Concept:** **First-Order vs. Framework Disagreement.**
  Point to the board. The "Joint Observation" list represents first-order facts (empirical). The Protocols represent **ontological frameworks**. The conflict was not about the world, but about the meaning of "item" (or "object"/"exists").
  **Concept:** **Verbal Dispute.**
  Show how the dispute dissolved once the definitions were shared. This illustrates a *merely verbal dispute*: once meanings are fixed, the factual disagreement vanishes.

  **2. The Special Composition Question (65–70 mins)**
  Ask Group B: "Why count clusters?" (Unity, function). Ask Group A: "Why count blocks?" (Simplicity, fundamentality).
  **Concept:** **Special Composition Question (SCQ).**
  Explain that metaphysics asks: *Under what conditions do some things compose a further thing?* Group A answered "Never" (or only at the atomic level); Group B answered "When touching." The activity staged the SCQ without naming it.

  **3. Metalinguistic Negotiation (70–75 mins)**
  Ask: "Now that you know the rules, does the disagreement disappear completely? Which protocol *should* we use for the official report?"
  Students will argue about utility, precision, or common sense.
  **Concept:** **Metalinguistic Negotiation.**
  Explain that some disputes survive translation. They are no longer about what exists, but about which conceptual framework is *better* for our purposes. This is a negotiation over concepts, not facts.

  **4. Limitations & Troubleshooting (75–80 mins)**
  **Troubleshooting:**
  *   *Premature Revelation:* Students may guess the rules early. *Fix:* Remind them they must argue for the *number*, not the rule.
  *   *Compromise:* They may agree to list both numbers. *Fix:* Insist the form allows only one integer. The tension must remain unresolved until the reveal.
  *   *Confusion:* If Group B struggles to explain "maximal cluster," allow them to draw circles around the touching blocks.

  **Limitations (Instructor Note):**
  Be frank: This activity makes ontological disputes look *merely* verbal. It suggests the choice is purely pragmatic. It cannot reproduce the realist intuition that one framework might **carve nature at its joints**.
  **Closing Point:** "The activity shows how disputes can be verbal. It does not prove they *must* be. Realists argue one count is metaphysically privileged (truth), not just useful (pragmatism). Next week, we ask: Is 'existence' univocal, or do we choose our logic?"

  ### Word Count Check
  Approx. 1,150 words.
  - Ensures no technical terms in activity phase.
  - Forces empirical agreement before conceptual divergence.
  - Debrief explicitly maps activity moments to required distinctions.
  - Includes troubleshooting and limitations as requested.
