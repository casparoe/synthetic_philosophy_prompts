answer: |-
  Dear friend,

  It is completely understandable that you find this tension confusing, as you have stumbled upon the central debate in the economics of climate change. The conflict you perceive between the Ramsey rule and the philosophical demand for equal consideration is not actually a contradiction between mathematics and ethics, but rather a disagreement about how to set the ethical inputs within the mathematical framework. To reconcile these positions, one must distinguish between discounting based on pure time preference and discounting based on expected changes in wealth. The Ramsey rule is essentially an accounting identity derived from optimizing intertemporal welfare, and it states that the social discount rate equals the pure rate of time preference plus the product of the elasticity of marginal utility and the growth rate of consumption. The key to your question lies entirely in the first term, the pure rate of time preference.

  When philosophers argue that the welfare of future people should count exactly as much as the welfare of people alive today, they are making a specific claim about this pure rate of time preference. They are arguing that it should be zero. If you set the pure rate of time preference to zero, you are asserting that the mere passage of time does not diminish the moral value of utility. A unit of welfare experienced in 2100 is morally identical to a unit of welfare experienced today. This satisfies the philosophical demand for equal consideration. However, the Ramsey rule still yields a positive discount rate even if this pure rate is zero, provided that future consumption is expected to grow. This second part of the equation, the product of elasticity and growth, does not reflect a moral devaluation of future lives. Instead, it reflects the economic principle of diminishing marginal utility.

  The logic here is that if we expect future generations to be richer than we are, an extra dollar of consumption will provide them with less additional welfare than it provides us. Therefore, when we evaluate climate damages in monetary terms, we discount those future monetary losses not because the people suffering them matter less, but because we expect them to be wealthier and thus better able to absorb the loss. This is consistent with equal moral weighting of utility while acknowledging different levels of consumption. The confusion often arises because people conflate discounting utility with discounting consumption. The philosophical position demands no discounting of utility across time, which implies a zero pure rate of time preference. The Ramsey rule translates this into a discount rate for consumption values, which will be positive if consumption grows.

  To make the equal-consideration view more than a slogan within this framework, you do not need to reject the Ramsey rule itself. Rather, you must reject the practice of calibrating the pure rate of time preference based on observed market interest rates or individual impatience. Many economists historically set this parameter by looking at current market returns, assuming that revealed preferences should guide social policy. To align with the philosophical view, you must reject this descriptive approach in favor of a normative one. You must argue that individual impatience is ethically irrelevant when dealing with intergenerational transfers, as future people cannot participate in today's markets to express their preferences. This was the core of the controversy between Nicholas Stern and William Nordhaus. Stern adopted a near-zero pure rate of time preference to honor intergenerational equity, resulting in a low discount rate and a high social cost of carbon. Nordhaus used a higher rate based on market observations, resulting in a lower cost of carbon.

  Therefore, the arithmetic of standard welfare economics does not force you to value future welfare less. It only forces you to value future consumption less if you expect future consumption to be higher. If you wish to hold the philosophical position seriously, you must insist that the pure rate of time preference is zero on ethical grounds. You must also be prepared to accept the implications of this choice, which often include much more aggressive immediate abatement policies, because the future damages of climate change are not being shrunk by a high discount rate. The conflict is not between the Ramsey rule and philosophy, but between a normative ethical stance that treats time as morally neutral and a descriptive economic stance that treats time preference as a market fact. By setting the pure rate of time preference to zero, you preserve the Ramsey framework while fully embracing the demand that the welfare of future generations counts equally with our own.

  I hope this helps clarify how the two positions can coexist within the same analytical structure.

  Best regards,

