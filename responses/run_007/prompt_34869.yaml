      *   *Socialization:* The spectator is formed by looking at how *actual* spectators judge us, then abstracting from their passions.
      *   *Potential for Error:* Smith acknowledges the spectator can be corrupted by custom, fashion, and rank. He worries about the admiration of the rich and powerful.
      *   *Correction:* Smith relies on the idea that over time, through broad social interaction and reason, the spectator tends toward propriety. But he admits "custom" can pervert sentiments (e.g., exposure to infanticide or dueling).
      *   *Conscience:* It's the "man within the breast." It requires effort to listen to it over the "man without."

  3.  **Deconstruct Ishiguro's *The Remains of the Day*:**
      *   *Stevens's Spectator:* It is hyper-rigid. It prioritizes "dignity" (defined as professional inhibition of emotion) over human connection.
      *   *The Source:* The spectator is modeled on Lord Darlington and the ideal of the "great butler."
      *   *The Tragedy:* Stevens realizes too late (the pier scene) that his "dignity" cost him love and moral agency.
      *   *The Ending:* Ambiguous. He resolves to practice "bantering." Is this growth or further denial?

  4.  **Synthesize and Engage (Drafting the Argument):**

      *   *Point 1: Confirmation of Smith's Mechanism.*
