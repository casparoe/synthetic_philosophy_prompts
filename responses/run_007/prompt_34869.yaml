          *   *Smith's Blind Spot:* Smith assumes the process of abstraction leads to *universality*. Stevens shows the process of abstraction can lead to *hyper-particularity* disguised as universality. Stevens thinks "dignity" is universal, but it's actually specific to a class and time.

