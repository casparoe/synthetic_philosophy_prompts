      *   *Point 3: Sympathy vs. Duty.*
          *   Smith bases morality on *sympathy* (fellow-feeling). Stevens suppresses sympathy in favor of "dignity."
          *   For Smith, suppressing sympathy *is* the moral failure. Stevens thinks it's the moral success.
