      *   Explain why: Confuses certainty with rationality.
      *   Explain the fix: Comparative assessment of heuristic power.
      *   Explain the cost: Accepts fallibilism in methodology (no algorithm for truth, only for rational preference).

      *(Self-Correction)*: Wait, I should also address (3). The user says "only be judged retrospectively." Lakatos would say the *corroboration* is retrospective, but the *potential* for novel fact is assessable via the positive heuristic. I will combine the rejection of (3)'s absolutism with the rejection of (5)'s inference.

      *Decision:* I will prioritize rejecting **(5)** as the logical non-sequitur, but note that it relies on an overly strong reading of **(3)**.

