  The autumn leaves drifted onto the surface of the river as Elias and Clara walked along the towpath, their collars turned up against the chill. They had been debating the nature of value since leaving the common room, and the crisp air seemed to sharpen rather than dull their disagreement. Elias stopped to watch a rowing boat glide silently past before turning back to his companion.

  "You seem unconvinced by the simplicity of the hedonistic account," Elias said, kicking a pebble into the water. "I maintain that every pleasant experience is valuable for precisely the same reason. Pleasure is a single, unified phenomenon. When we feel pleasure, there is a common qualitative feel, a specific sensation that marks it out. The apparent differences we observe are merely differences in the objects that cause the feeling, or perhaps the intensity of the sensation, rather than differences in the pleasure itself."

  Clara pulled her scarf tighter, nodding slowly to show she had listened. "If I understand you correctly, Elias, you are arguing that there is a distinct phenomenological thread, a sort of bright glow, that runs through every instance of pleasure regardless of context. You claim that because this glow exists, the value derived from it is uniform in kind. However, I hold that what we call pleasure is actually a motley collection of experiences with no common felt character. There is no single sensation that links a warm bath to a mathematical discovery. Consequently, a value theory built on pleasure rests on an unsupported generalisation, grouping together disparate states that share only a name."

  "Surely you exaggerate the disunity," Elias replied, resuming their walk. "Consider the pleasure of a warm bath. It is sensory, passive, and soothing. Now compare it to the pleasure of solving a proof after days of effort. You might say these are different, but I argue that beneath the cognitive engagement of the proof, there is the same fundamental feeling of satisfaction that arises from the bath. The bath stimulates the skin; the proof stimulates the intellect. But the pleasure—the value-bearing component—is the same positive tone."

  "But that is exactly where your position is weakest," Clara countered, her voice firm. "When you solve a proof, the pleasure is often bound up with the relief of tension, the sudden clarity of understanding. It feels active, sharp, and triumphant. The bath feels passive, diffuse, and relaxing. If you strip away the objects—the water and the mathematics—is there anything left that is phenomenologically identical? I suspect you are positing a ghostly sensation that no one can actually isolate. You are forcing a unity where there is only a family resemblance."

  Elias frowned, acknowledging the difficulty. "I concede that isolating the feeling is difficult when the cognitive context is so overwhelming. However, consider relief at escaping danger. You step off the curb just as a car speeds past. The rush you feel is pleasure. It shares the positive valence of the bath. If you deny they are the same kind of state, you must explain why we classify them both under the heading of pleasure unless there is some common ground."

  "We classify them together because they are both states we desire to continue, or states we like," Clara said. "But that is a functional similarity, not a phenomenological one. The feeling of relief is the cessation of pain, whereas the bath is the presence of a positive sensation. To treat them as the same kind of value-bearer is to ignore the structural differences in how they arise. And this leads me to a more troubling case for your view: malicious glee at a rival's failure."

  Elias paused, his hand resting on the rough bark of a willow tree. "Ah, the moral objection. You are about to suggest that such pleasure cannot be valuable."

  "I am suggesting that if your theory holds, it must be," Clara said, turning to face him. "If every pleasant experience is valuable for the same reason, then the sadist's glee is intrinsically good for the sadist, simply because it is pleasure. This seems to ignore the object of the pleasure entirely. You claim the object does not change the nature of the pleasure, but surely the fact that the pleasure is taken in another's suffering changes the evaluative landscape? Here is where I press you hardest: can you really maintain that the value is identical in kind to the bath, simply because the internal feeling might be similar?"

  Elias sighed, looking out over the water. "This is indeed the point where my position requires nuance. I must restate your view to ensure I do not straw-man you: you are arguing that because the objects and contexts differ so radically, the value cannot be grounded solely in the feeling. You believe the heterogeneity of the experience implies a heterogeneity of value. However, I must distinguish between what is good for the experiencer and what is morally good. I maintain that the glee is indeed good for the experiencer in the narrow sense that it contributes to their welfare, even if it is morally reprehensible. The value I speak of is prudential, not moral."

  "But that distinction saves your theory only by making it less plausible," Clara argued. "If the feeling is the same, why do we instinctively rank the aesthetic pleasure above the glee? Which brings me to my final pair of cases. Consider the addict's fix. It is intense, overwhelming, and undeniably pleasant to the addict. Now compare it to aesthetic pleasure, say, listening to a profound symphony. If pleasure is a single unified phenomenon, then the addict's fix could theoretically outweigh the symphony simply by being more intense. Do you really wish to say that a sufficiently intense fix is more valuable than a lifetime of aesthetic appreciation?"

  Elias was silent for a long moment, watching the ripples fade. "You have pressed me at my weakest point, Clara. The purely quantitative view of pleasure struggles to account for our intuition that some pleasures are higher than others. I am willing to make a concession here. I admit that intensity alone may not be the sole determinant of value. It is possible that while the feeling is unified, the capacity to appreciate certain objects enhances the value of the pleasure derived from them. I cannot simply say that more intensity equals more value without regard for the source."

  Clara nodded, seeming pleased with the admission. "That is a significant concession, Elias. It moves you closer to acknowledging that the object matters for the value, not just the cause of the feeling. However, I too must offer a concession. In arguing that there is no common felt character, I may have overstated the fragmentation. While I deny there is a single sensation like a 'bright glow', I concede that there might be a common evaluative ground. Perhaps what binds these experiences is not a raw feel, but a shared attitude of 'liking' or endorsement by the subject. There is a functional unity, even if the phenomenology is heterogeneous."

  "So," Elias said, starting to walk again, "you allow that there is a unifying thread, but you locate it in the attitude rather than the sensation?"

  "Precisely," Clara replied. "And you allow that the source of the pleasure affects its worth, not merely its intensity. We seem to have moved closer, though we still disagree on whether the value is grounded in the feeling or the attitude."

  "Consider the aesthetic pleasure again," Elias mused. "If your view is correct, and there is no common feeling, then the value of the symphony is entirely distinct from the value of the warm bath. But surely there is some sense in which both contribute to a life going well in a similar way? They both make the life better in a way that pain does not."

  "They do," Clara agreed. "But they make it better for different reasons. The bath restores the body; the symphony enriches the mind. To say they are valuable for the 'same reason' is to gloss over the richness of human experience. Your theory seeks a single currency of value, but I suspect the economy of the good is far more complex."

  "Perhaps," Elias said, as they approached the bridge that marked the end of their path. "But without a single currency, how do we make trade-offs? If I must choose between the bath and the symphony, what metric do I use if not some common measure of welfare?"

  "That is the problem we must solve next time," Clara said, stopping at the stone archway. "But today, I think we have established that the heterogeneity problem cannot be wished away by asserting a unity that cannot be felt. You have conceded that quality matters alongside quantity, and I have conceded that there is a functional link between these disparate states. It is a start."

  Elias smiled, tipping his head in acknowledgement. "Indeed. And I have learned that the pleasure of winning an argument is quite distinct from the pleasure of a warm bath, though both are preferable to the pain of being proven wrong."

  Clara laughed, the sound carrying over the water. "Then let us agree that this conversation was valuable, whatever the precise ground of that value may be." They turned back towards the college, the debate unresolved but the understanding between them deepened, leaving the river to flow on beneath the grey sky.
