answer: |-
  ### The Scenario: The Nervous Auditor

  Sarah is a senior forensic auditor at a large accounting firm. She is tasked with verifying the quarterly ledgers of a client, TechCore. Sarah has developed a custom verification script that cross-references every transaction in the ledger against bank records. The script is mathematically exhaustive and has been independently verified as bug-free; if the script outputs "Balanced," the accounts are necessarily balanced. There is no probability involved; the relationship is entailment.

  Sarah runs the script. It outputs "Balanced." Sarah checks the code execution log and confirms there were no errors. At this moment, Sarah possesses a conclusive, factive ground for the proposition that the accounts are balanced. However, two years prior, Sarah manually signed off on a audit that turned out to be fraudulent due to a rare, unforeseeable server glitch that occurred only once in the firm's history. Although the glitch was not her fault, the resulting scandal caused her severe professional trauma.

  Since then, Sarah has developed a specific, localized form of doxastic anxiety. Whenever she confronts a "Balanced" result, she experiences an overwhelming, intrusive sensation that she has missed a variable. This sensation is not based on evidence; she knows the script is perfect. Nevertheless, the feeling prevents her from forming the stable psychological state of conviction. She treats the script's output as an external authority that compels her action and speech, while she internally withholds her own doxastic commitment. She views herself as a mere conduit for the data, not a believer in the conclusion.

  In the board meeting, the CEO asks, "Can you confirm the status of the Q3 ledgers?" Sarah looks at her verified log, suppresses her anxiety, and states flatly, "The Q3 accounts are balanced." She makes this assertion solely on the basis of the script's verification (the grounds of her knowledge), explicitly bypassing her own sense of conviction (which is absent).

  ### The Proposition $p$
  **$p$:** "The Q3 accounts are balanced."

  ### Why the Speaker Counts as Knowing $p$
  Sarah satisfies the standard externalist conditions for knowledge.
  1.  **Truth:** The accounts are, in fact, balanced (guaranteed by the script's output).
  2.  **Justification:** She possesses a conclusive, deductive proof via the verification script. There are no defeaters in the environment; the past server glitch is known to be a singular historical anomaly that does not affect the current system's architecture.
  3.  **Connection:** Her confidence in the truth of $p$ is causally and logically connected to the fact of $p$ via the reliable verification process.
  Her anxiety is an emotional state, not an epistemic defeater. It provides no evidence that $p$ is false. Therefore, her epistemic position is secure enough to constitute knowledge, even if her psychological state is unsettled.

  ### Why She Counts as Not Believing $p$
  Belief is standardly characterized as a dispositional state of taking-to-be-true, often accompanied by a degree of subjective conviction or the willingness to rely on the proposition without external props.
  1.  **Withheld Assent:** If asked privately, "Do you believe the accounts are balanced?" Sarah would answer, "I know the script says they are, but I don't trust my own grasp of the situation enough to believe it."
  2.  **Lack of Integration:** She does not integrate $p$ into her web of belief. She does not feel the "click" of resolution. She treats $p$ as a functional premise for assertion and action (Acceptance) rather than a truth she holds (Belief).
  3.  **Phenomenology:** She experiences active doubt. While she acts *as if* she believes for professional purposes, the internal doxastic attitude is suspended due to her trauma-induced anxiety. She lacks the conviction required for the mental state of belief.

  ### Verdict of the Norms
  *   **Knowledge Norm of Assertion (KNA):** **Satisfied.** The norm requires that one assert $p$ only if one knows $p$. Sarah knows $p$ (via the script and verification), so her assertion is proper according to the KNA.
  *   **Belief Norm of Assertion (BNA):** **Violated.** The norm requires that one assert $p$ only if one believes $p$. Sarah explicitly lacks the belief state (she withholds conviction and feels doubt), so her assertion is improper according to the BNA.

  ### The Prying Feature: Pathological Doxastic Resistance
  The single feature doing the work to prise knowledge and belief apart is **Pathological Doxastic Resistance**. This is a psychological condition where the subject possesses objective, factive justification sufficient for knowledge (externalist condition) but suffers from an internal, emotional block that prevents the formation of the subjective conviction required for belief (internalist condition).

  This feature exploits the gap between **Externalist Epistemology** (where knowledge depends on reliability and truth, compatible with irrational doubt) and **Internalist Psychology** (where belief depends on subjective assent and conviction, incompatible with doubt). The scenario creates a wedge where the speaker is epistemically secure but doxastically insecure.

  ### The Belief Norm Defender's Attack
  A defender of the Belief Norm would likely attack the case by arguing for the **Assertion-Belief Link**. They would claim that if Sarah is willing to assert $p$ flatly in a high-stakes board meeting, she *must* believe $p$, regardless of her reported feelings. They would argue that belief is defined by its functional role in guiding action and speech. Since Sarah's assertion is guided by the verification (which she trusts), she functionally believes $p$. Her reported "doubt" is merely a feeling of anxiety, not a genuine lack of belief. Therefore, the defender would argue that Sarah *does* believe $p$, the BNA is satisfied, and the norms remain extensionally equivalent in this case.

  ### The Case Without the Feature
  If **Pathological Doxastic Resistance** is removed (i.e., Sarah does not have the trauma-induced anxiety), the case collapses into a standard instance of assertion. Sarah verifies the script, feels convinced by the result, integrates the conclusion into her web of belief, and asserts $p$. In this scenario, she both knows $p$ and believes $p$. Both the KNA and the BNA are satisfied, and the divergence disappears. The norms appear extensionally equivalent because the psychological feature that severed the link between reliable justification (knowledge) and subjective conviction (belief) is no longer present.
