answer: |-
  This is a fantastic problem to be stuck on at 2am. You've hit on what is arguably the single most serious challenge to naturalistic theories of content: **The Modal Problem.**

  The worry, as you stated, is that selection history is purely *actual* (what happened in the past), while counterfactual content is *modal* (what could or would happen). How do you get an "ought" (or a "would") from an "is" (or a "did")?

  If you want the strongest defense of teleosemantics here, you need to stop thinking of teleosemantics as a theory about **tracking specific states** and start thinking of it as a theory about **successful guidance of action.**

  Here is the strongest argument that teleosemantics can handle counterfactuals, leaning heavily on why **Millikan's Consumer Semantics** has the resources to solve this where Dretske's Indicator Semantics struggles.

  ### 1. The Core Move: Selection for *Models*, Not Just Indicators

  The initial intuition that trips you up is the idea that evolution selects for a mechanism that indicates *flies*. If that were the whole story, you're right: you could never represent "non-actual flies."

  But teleosemantics (especially in its mature Millikanian form) argues that evolution selects for **cognitive maps**.

  Think about a physical map of London. The map's content is determined by its correspondence to London. But the map doesn't just tell you where you *are*. It tells you where you *would be* if you turned left. It supports counterfactuals ("If I went to Oxford Street, I would be north of the Thames").

  Why does the map support counterfactuals? Not because the map-maker (the surveyor) visited every possible path you *could* take. But because the map captures the **structural relationships** of the city.

  **The Argument:**
  1.  Cognitive mechanisms were selected not merely to trigger reflexes (snap at fly), but to guide complex navigation and planning.
  2.  To guide planning successfully, a representation must encode the structural relationships of the environment, not just current stimuli.
  3.  Representations that encode structural relationships inherently support counterfactual inferences (just like a map).
  4.  Therefore, the proper function of these mechanisms is to produce representations that support counterfactuals.
  5.  Consequently, the content of those representations includes counterfactual truth conditions.

  The selection history is still actual (we survived because we had good maps). But the *content* of the map is modal because the *utility* of the map lies in its ability to project into non-actual scenarios.

  ### 2. Why Millikan (Consumer) Beats Dretske (Indicator) Here

  This is where the distinction you asked about becomes crucial.

  **Dretske's Problem:**
  Dretske grounds content in **nomic covariance** (law-like regularities). A state means *Fire* because it is caused by Fire under law-like conditions.
  *   *The Weakness:* Laws do support counterfactuals ("If this were smoke, there would be fire"). However, Dretske's view is tightly tethered to *causal chains*. It is very hard to find a law-like causal connection between your brain state and the proposition "If I had taken the other job." There is no causal chain from a non-actual job to your current neurons. Dretske risks reducing counterfactuals to dispositions to behave, which loses the truth-conditional aspect.

  **Millikan's Advantage:**
  Millikan grounds content in the **Consumer System**. A representation means *X* because the consumer system has a proper function to use that representation to coordinate action *as if X were the case*.
  *   *The Strength:* This allows for **Offline Planning.**
      *   Imagine a "planning consumer" in your brain. Its proper function is to simulate actions to avoid danger before acting.
      *   To do its job, the planning consumer takes a representation (e.g., "Glass") and runs a simulation ("If dropped → Breaks").
      *   For the planning consumer to succeed (i.e., fulfill its proper function of keeping you safe), the inference "If dropped → Breaks" must be *true*.
      *   Therefore, the content of the belief is fixed by the conditions required for the *planning consumer* to succeed.
      *   Since the planning consumer succeeds by tracking modal facts (what *would* break), the content of the belief is modal.

  In Millikan's framework, you don't need a causal link to the counterfactual world. You need a functional link between the **producer** of the belief and the **consumer** that uses it for simulation. Evolution selected for the *capacity* to simulate. Therefore, it selected for representations with counterfactual truth conditions.

  ### 3. Handling the "Specific Counterfactual" (The Job Example)

  Your friend's sticking point was likely: "Okay, maybe evolution selected for *general* counterfactual capacity. But what fixes the content of *this specific* counterfactual: 'If I had taken the other job...'?" Evolution didn't select for that specific job.

  Here is the teleosemantic reply: **Phylogeny selects the Mechanism; Ontogeny selects the Content.**

  Teleosemantics is often extended to cover learning (ontogenetic selection).
  1.  **Phylogenetic Level:** Evolution selected for a learning mechanism whose proper function is to update a model of the world based on experience.
  2.  **Ontogenetic Level:** Your learning mechanism interacted with actual data (your experience of your current job, your knowledge of the other job, your understanding of happiness).
  3.  **The Fix:** The content of the specific counterfactual is fixed by the **proper function of the learning mechanism** that assembled it.
      *   The mechanism's job is to construct a model that predicts outcomes.
      *   It constructs the proposition "If I took Job B, I'd be happier."
      *   The truth condition is determined by the actual causal structures of the world (the salary of Job B, the stress levels, etc.) that the mechanism was designed to track.

  The *capacity* to think the thought is grounded in evolutionary history. The *specific content* is grounded in the proper function of your learning systems tracking actual variables (salary, commute, stress) which then get combined in a simulation. The counterfactual isn't a magical relation to a non-actual world; it's a **prediction generated by a model built from actual data.**

  ### 4. Dissolving the "Actual vs. Non-Actual" Tension

  The deepest philosophical worry you have is: *How can actual history fix non-actual truth conditions?*

  The teleosemantic answer is: **It doesn't fix the truth conditions directly; it fixes the mechanism that is supposed to track them.**

  Consider a thermometer.
  *   **History:** It was manufactured (selected) to measure temperature.
  *   **Content:** It reads "20°C."
  *   **Counterfactual:** "If the room were hotter, this would read higher."

  The manufacturing history is entirely actual. But the *meaning* of the reading involves counterfactuals about how the device *would* behave in different conditions. Why? Because the device's identity (its proper function) is defined by its reliability across a range of conditions, not just the one it's currently in.

  Similarly, your cognitive mechanism's identity is defined by its reliability across a range of *possible* environments.
  *   If your "glass" concept only applied to *actual* glasses you've seen, you'd die when you encountered a new kind of glass.
  *   Selection favors mechanisms that generalize.
  *   To generalize is to support counterfactuals ("This new thing is glass, so it *would* break").
  *   Therefore, the proper function of the concept "glass" includes applying to non-actual instances that share the relevant causal structure.

  ### 5. The Strongest Formulation (The "Success Condition" Argument)

  If I were to distill this into a single punchline for your friend, it would be this:

  > Teleosemantics does not claim that selection history *is* the content. It claims that selection history determines the **Success Conditions** of the cognitive system.
  >
  > For a planning organism, success requires navigating not just the actual world, but the space of *possible* actions.
  >
  > Therefore, the success conditions of the cognitive system are modal.
  >
  > Since content is determined by success conditions (Millikan), **content is modal.**
  >
  > The fact that the *grounding* (selection) is actual is irrelevant. The *function* selected for was the handling of possibilities. A lock is made of actual metal, but its function is to exclude non-actual keys.

  ### Summary of the Defense

  1.  **Don't reduce counterfactuals to actuals.** Admit the content is modal.
  2.  **Argue that selection favors modal capacity.** Organisms that can simulate "what if" outcompete those that only react to "what is."
  3.  **Use Millikan's Consumer Theory.** The "planning consumer" in the brain requires modal inputs to fulfill its biological function. This fixes the content.
  4.  **Distinguish Mechanism vs. Specific Content.** Evolution gave you the simulator (mechanism); learning gave you the specific scenario (content). Both are naturalized.

  **Verdict:** Teleosemantics doesn't just "handle" counterfactuals; it arguably *explains* why we have them. We have counterfactual thoughts because we are biological machines designed to simulate the future to avoid death. The "non-actual" nature of the content is a feature of the machine's design, grounded in the very actual history of that design's success.

  You can go to sleep now. The frog is safe, and your counterfactuals are grounded.
