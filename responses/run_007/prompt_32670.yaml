answer: |-
  Elena manages logistics for a charity and knows the anonymous benefactor only as Elias while separately coordinating repairs with the contractor known as Mr. Thorne, with strict privacy protocols keeping the roles separate. During a site visit, the project manager states plainly, "Elias is Mr. Thorne." The information allows Elena to explain why the funding arrived precisely when the structural damage was assessed and confirms the benefactor personally inspected the foundation risks previously, integrating two distinct causal chains of finance and labor into one coherent narrative of agency rather than merely noting a clerical correction in the contact database.

  | sentence uttered (the identity statement) | millian truth condition | fregean truth condition | same truth value? |
  | :--- | :--- | :--- | :--- |
  | "Elias is Mr. Thorne." | The object referred to by 'Elias' is identical to the object referred to by 'Mr. Thorne'. | The object referred to by 'Elias' is identical to the object referred to by 'Mr. Thorne'. | Yes |

  (a) **What the protagonist learned:** According to the Fregean, Elena learned a new *proposition* composed of two distinct senses (modes of presentation) linked by identity. According to the Millian, Elena learned the same singular proposition she already implicitly grasped (that the person is self-identical), but she learned it via a new cognitive route.
  (b) **Blocking feature:** The scenario frames the identity as explaining *causal connections* between physical events (funding timing and structural damage inspection). This makes the learning feel like a discovery about worldly agency and physical history, blocking the move that she merely learned a linguistic convention about name co-reference.
  (c) **Best Millian fallback:** A smart Millian would appeal to **Mental Files** or **Guises**. They would argue that while the *proposition* (the worldly truth condition) remains unchanged and trivial, the *cognitive significance* changes because Elena merges two distinct mental files associated with the same object, explaining the feeling of discovery without positing new worldly facts.
