  Subject: Thoughts on your persistence paper setup

  Hi there,

  It sounds like you are building a fairly robust metaphysical framework, and honestly, the cluster of views you have outlined is a recognizable and defensible position in contemporary analytic metaphysics. You are essentially aiming for a version of Eternalist Endurantism that accepts coincident entities and rejects Lewisian modal realism, which puts you in the company of philosophers like E.J. Lowe or Kathrin Koslicki. That said, you are right to pause for a consistency check because there are some friction points here that need to be smoothed over before you build the rest of the argument. I will walk through the tensions I see, rank them by severity, and suggest where you might need to make adjustments.

  The most serious tension in your set, by a significant margin, lies in the triad of your Endurantism, your Eternalism, and your stance on the Problem of Temporary Intrinsics. This is the classic Lewisian objection, and it is the engine that drives most debates on persistence. If you hold that objects are wholly present at every moment they exist and you also hold that past, present, and future times are equally real concrete entities, you are effectively saying an object is wholly located at multiple distinct regions of the block universe. The problem arises when you say the Problem of Temporary Intrinsics is a genuine puzzle. If it is genuine, that means you acknowledge an object cannot simply have the incompatible intrinsic properties of being bent and being straight simpliciter. To maintain consistency here, what has to give is the notion that properties like bentness are simple, non-relational monadic qualities. You cannot have it both ways that properties are intrinsic in the strict sense and that the object is wholly present at multiple times with different properties. The cheapest fix for this, which most eternalist endurantists adopt, is to embrace a relational theory of properties, often called adverbialism or indexicalism. On this view, the object does not instantiate bentness simpliciter but rather instantiates bentness-at-t1 and straightness-at-t2. This preserves your Endurantism and Eternalism while dissolving the contradiction inherent in the Temporary Intrinsics puzzle, though it does come at the cost of denying that ordinary properties are purely intrinsic.

  A secondary, less severe tension exists between your Endurantism and your Constitution View regarding the statue and the clay. The issue here is not logical contradiction but ontological parsimony and the principle of extensionality. If two objects are wholly present in the same place at the same time and share all their material parts, standard mereology suggests they should be identical. By claiming they are distinct, you are rejecting the principle of extensionality for material objects. This is a consistent move, but it opens you up to the "too many thinkers" or "too many objects" objection, where you must explain why we count two objects instead of one when our intuition suggests one. For this tension, what has to give is the extensionality principle. The cheapest fix is to explicitly argue that material constitution is not identity, grounding the distinctness of the statue and the clay in their differing modal properties rather than their spatial parts. This is a standard move in constitution theory, so it is well-trodden ground, but you will need to defend it against charges of arbitrariness.

  Interestingly, your views on modality and transworld identity actually support each other rather than creating tension. Your rejection of Lewisian counterpart theory in favor of strict transworld identity pairs very well with your Constitution View. Because you treat the statue and the clay as distinct objects, they can have different essential properties across possible worlds without violating the indiscernibility of identicals. The statue might essentially be statue-shaped while the clay is not, and since you believe in strict identity, you just need to ensure your essentialism is robust enough to handle these distinctions. The only minor friction here is a methodological one between your Eternalism and your Actualism about modality. Some philosophers argue that if you are willing to accept concrete past and future times, you should by parity of argument accept concrete possible worlds. You avoid this by treating possibilia as abstract, which is fine, but you should be prepared to answer why time gets concrete reality while modality does not. This is not a logical inconsistency, but it is a theoretical cost you will need to justify.

  If you are looking for one revision that would clean up multiple problems at once, the most effective move would be to abandon Eternalism in favor of Presentism. If you become a Presentist, the Problem of Temporary Intrinsics largely dissolves because only one time exists, so the object never simultaneously holds incompatible properties across existing times. This also makes your Endurantism much more intuitive, as being wholly present is easier to digest when there is only one present moment to be present in. Furthermore, Presentism sidesteps the parity argument regarding concrete times versus concrete worlds, aligning your ontology of time with your actualist ontology of modality. However, I know Presentism comes with its own baggage regarding truthmakers for past tensed statements and compatibility with relativity theory, so you would be trading one set of problems for another. If you wish to keep Eternalism, then your best bet is to stick with the relational fix for properties I mentioned earlier, as that allows you to keep the rest of your system intact without requiring a major overhaul of your temporal ontology.

  I hope this helps you tighten up the draft. You have a coherent set of views here, provided you handle the property theory correctly, and it should make for a solid paper.

  Best of luck with the writing.
