  Construct a thought experiment that isolates the role of maxim description in Kant's Formula of Universal Law. The action should be an ordinary, intuitively permissible choice — a consumer, professional, or social decision, not a lifeboat case or a lie to a murderer. State the agent's maxim in a first-personal form that a reflective person might actually give, with no obvious gerrymandering. Under this maxim, universalizing must produce a contradiction in conception: the state of affairs in which everyone acts on it cannot be conceived, because the very practice the agent relies on would become impossible. The contradiction must arise from the impossibility of the social or practical arrangement, not from physical impossibility or a merely verbal stipulation. Then re-describe the same action under a second maxim that is equally natural and no more specific than an agent would need to make the action intelligible, and show that the contradiction disappears and the action passes the Formula of Universal Law.

