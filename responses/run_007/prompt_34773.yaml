  *   Ethical: "People are better off without it." -> (c) Substantive and Dubious. (Depends on theory of well-being. If autonomy is part of well-being, it's false).
  *   Political: "State should restrict it." -> (c) Substantive and Dubious. (Ignores incentive problems).

  *Wait, is there a "Trivially True" reading?*
  "Freedom entails responsibility, which can be stressful." -> (a) Trivially True. But the slogan adds "better off without." That kills the triviality.
  "Most people" makes it empirical.
