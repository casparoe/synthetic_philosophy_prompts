      *   The wasp isn't thinking "I need to get the cricket inside." It's running a script: `IF at threshold THEN check burrow`. It lacks the *concept* of the goal state (cricket inside burrow) as a holistic condition to be achieved. It only knows the *steps*.

  4.  **Identify What's Missing (The "Sphexishness"):**
