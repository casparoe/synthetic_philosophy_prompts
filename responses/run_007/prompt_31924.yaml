  Dear Colleague,

  Having followed our reading group discussions with great interest, I have been reflecting on the expressivist account you have defended, particularly in light of the five positions you have committed yourself to regarding moral language and logic. Your views map strikingly well onto a sophisticated version of Quasi-Realist Expressivism, most closely resembling the semantic program developed by Simon Blackburn. Your insistence that atomic moral sentences are not truth-apt but express disapproval, combined with your treatment of negation as expressing a distinct attitude and conditionals as expressing higher-order attitudes concerning the relationship between those attitudes, constitutes a classic solution to the Frege-Geach problem that preserves logical validity through the consistency of attitudes rather than the preservation of truth. Given this alignment, I can offer a prediction regarding your stance on the disjunction Either stealing is wrong, or the sky is blue, along with an analysis of the semantic nuances that might inform your answer.

  Within the framework of Quasi-Realist Expressivism, there are two candidate interpretations consistent with your five positions that diverge on the status of mixed compounds like the disjunction in question. The first candidate program is what we might call Strict Expressivism. On this view, the non-truth-aptitude of the moral component infects the entire sentence. Since stealing is wrong is not truth-apt, any compound sentence containing it as a main operator or essential component is likewise not truth-apt. This program predicts that the disjunction is not truth-apt and that it expresses a complex, higher-order attitude. Specifically, since the disjunction is logically equivalent to the conditional If stealing is not wrong, then the sky is blue, this program predicts you will say the sentence expresses a state of mind such that one is committed to believing the sky is blue if one holds the attitude that stealing is not wrong. The second candidate program is Deflationary Quasi-Realism. This view holds that while atomic moral sentences lack robust truth conditions, complex sentences earn the right to be called truth-apt in a deflated sense because they function logically like truth-apt sentences. This program predicts that you will say the disjunction is truth-apt, albeit in a deflated sense, while still maintaining that it expresses the same complex attitude described by the strict view.

  My best guess is that you will align with the Strict Expressivist candidate and deny that the disjunction is truth-apt. The primary reason for this prediction lies in your explicit commitment to position one, where you state that an atomic moral sentence is not the kind of sentence that is true or false. While Quasi-Realists often argue that we can earn the right to use truth talk, your formulation suggests a robust denial of truth-aptness to maintain a clear distinction from realism. To concede truth-aptness to the mixed disjunction while denying it to the atomic moral sentence would require a bifurcated semantics that risks undermining the uniformity of logic implied by your fourth position on validity. Furthermore, your third position emphasizes that conditionals express attitudes concerning relationships between attitudes, suggesting that the semantic value of the sentence is exhausted by the attitude expressed, leaving no room for a truth condition even in mixed cases. Therefore, you will likely argue that the disjunction is not truth-apt and that it expresses a higher-order attitude of incompatibility with rejecting both disjuncts, specifically a commitment to believing the sky is blue were one to lack disapproval of stealing.

  To discriminate between the Strict Expressivist and Deflationary Quasi-Realist interpretations of your view, I propose we consider your treatment of the sentence It is true that either stealing is wrong or the sky is blue. If you accept this sentence as coherent and potentially correct, you are signaling a commitment to Deflationary Quasi-Realism, where truth-aptness is earned for logical compounds despite the non-cognitive nature of the moral parts. However, if you reject this sentence as a category mistake, or insist that it must be paraphrased as I accept that either stealing is wrong or the sky is blue, you are confirming the Strict Expressivist reading where truth predicates cannot apply to sentences containing non-truth-apt moral content. This test sentence isolates the question of whether your expressivism allows for the inheritance of truth-aptness in mixed contexts, which is the pivotal unresolved issue in your current set of commitments. I look forward to hearing your analysis next week.

  Sincerely,

  A Fellow Reader
