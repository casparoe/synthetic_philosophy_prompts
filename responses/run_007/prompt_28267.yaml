answer: |-
  # The Longtermist Grant Triage Protocol (LGTP)

  **Purpose:** To distinguish between legitimate high-impact opportunities and "Pascal's Mugging" proposals (tiny probability $\times$ enormous benefit) within a 2-hour review window.
  **User:** Program Officer (Nonspecialist).
  **Theoretical Basis:** Epistemic humility, bounded utility, reference class forecasting, and robustness over precision.
  **Constraint:** This procedure does not calculate true Expected Value (EV). It calculates **Risk-Adjusted Credible Value (RACV)**.

  ---

  ## Part 1: The Decision Procedure

  **Time Budget:** 120 Minutes.
  **Outcome:** [Approve for Board], [Reject], or [Request More Info].

  ### Step 1: The Physical & Logical Ceiling (15 Minutes)
  *Decision Theory Grounding: Bounded Utility.*
  Expected value reasoning breaks down when benefits exceed physical or logical limits (e.g., saving more lives than will ever exist).

  *   **Q1.1:** Does the claimed benefit exceed the total number of sentient beings likely to exist in the relevant timeframe (e.g., $10^{20}$ for future generations)?
      *   *If Yes:* **STOP.** Cap the benefit at the physical limit. Recalculate EV.
  *   **Q1.2:** Is the mechanism for achieving this benefit physically possible according to current consensus science?
      *   *If No (e.g., faster-than-light travel, perpetual motion):* **REJECT.**
      *   *If Speculative (e.g., unproven physics):* Proceed to Step 2.
      *   *If Established:* Proceed to Step 2.

  > **Judgment Flag:** Determining "physical possibility" requires basic scientific literacy. If the PO is unsure, mark as "Speculative" and proceed conservatively.

  ### Step 2: Probability Provenance (30 Minutes)
  *Decision Theory Grounding: Epistemic Uncertainty & Calibration.*
  Human intuition cannot distinguish between $10^{-6}$ and $10^{-9}$. Numbers below 1% must be derived from data, not intuition.

  *   **Q2.1:** Is the probability estimate ($P$) derived from a **reference class** (historical data on similar interventions) or **expert consensus** (aggregation of independent experts)?
      *   *If Yes:* Proceed to Step 3.
      *   *If No (e.g., "Our team feels...", "Theoretically possible..."):* **Apply the Intuition Penalty.** Reduce $P$ by two orders of magnitude (divide by 100). If the resulting EV is no longer competitive, **REJECT**.
  *   **Q2.2:** Is $P < 0.01\%$ ($1$ in $10,000$)?
      *   *If Yes:* Require evidence that the applicant has successfully predicted rare events in the past.
      *   *If No evidence of track record:* **REJECT.** (This filters the "Mugging": anyone can claim a tiny probability).

  > **Judgment Flag:** Distinguishing a "reference class" from a "justification for a number" is subjective. If the PO cannot verify the source, apply the Intuition Penalty.

  ### Step 3: The Sensitivity Test (30 Minutes)
  *Decision Theory Grounding: Model Uncertainty.*
  A valid EV argument should not collapse if the probability estimate is slightly wrong. A "Mugging" argument relies entirely on the precision of a tiny number.

  *   **Q3.1:** If we divide the probability ($P$) by 10, is the project still more cost-effective than your foundation's **baseline grant** (e.g., a standard public health intervention)?
      *   *If Yes:* The argument is **Robust**. Proceed to Step 4.
      *   *If No:* The argument is **Fragile**.
          *   *Action:* Mark as "Pascal-Adjacent." Do not reject yet, but it cannot be prioritized over Robust grants. Proceed to Step 4.

  ### Step 4: Marginal Leverage (30 Minutes)
  *Decision Theory Grounding: Counterfactual Impact.*
  Funding a ticket does not change the odds of the lottery.

  *   **Q4.1:** Does this specific grant amount *change* the probability of success, or does it merely fund a share of a fixed project?
      *   *Example:* Funding a researcher's salary vs. funding a portion of a collider that either gets built or doesn't.
      *   *If the project happens anyway without you:* **REJECT** (unless you are buying exclusive IP).
      *   *If the project dies without you:* Does the applicant explain *why* their specific input shifts the probability?
          *   *If No:* **REJECT.**
          *   *If Yes:* Proceed to Step 5.

  ### Step 5: The Policy Consistency Check (15 Minutes)
  *Decision Theory Grounding: Updateless Decision Theory / Precommitment.*
  If we fund this, must we fund all similar claims?

  *   **Q5.1:** If we publish a policy stating "We fund any proposal with EV > $X$ based on self-reported probabilities," would we receive more applications than we can fund?
      *   *If Yes:* This proposal relies on an exception to the rule.
      *   *Question:* Is there a **verifiable feature** of this proposal that distinguishes it from the spam we would receive? (e.g., specific IP, unique data access, track record).
      *   *If No:* **REJECT.** (To avoid Goodhart's Law).

  ### Final Triage Decision
  *   **Green Light (Approve for Board):** Passed Steps 1–5 with "Robust" rating in Step 3.
  *   **Yellow Light (Board Review Required):** Passed Steps 1–5 but "Fragile" in Step 3, or relied on Expert Consensus without Reference Class. *Note to Board: "High epistemic uncertainty. EV relies on unverifiable tail."*
  *   **Red Light (Reject):** Failed any Step.

  ---

  ## Part 2: Limitations and Failure Modes

  **What This Procedure Cannot Do:**
  1.  **It cannot discover truth.** It cannot verify if the AI risk is real or if the physics works. It only assesses the *quality of the argument*.
  2.  **It cannot resolve value conflicts.** It assumes the Foundation wants to maximize RACV. It cannot decide if "preventing extinction" is worth more than "saving 1,000 lives today."
  3.  **It cannot eliminate judgment.** Steps 2 and 5 require the PO to judge the quality of evidence. Two POs might reach different conclusions.

  **How It Can Misfire:**
  1.  **The "Black Swan" Error:** By penalizing intuition-based probabilities (Step 2), you may reject the one true visionary who lacks historical data (e.g., funding early internet or nuclear fission research).
  2.  **The "Bureaucratic Safety" Bias:** The Sensitivity Test (Step 3) favors projects with moderate probabilities and moderate benefits over low-probability, high-benefit projects, even if the latter are the Foundation's mission. This creates **mission drift**.
  3.  **The "Consensus Trap":** Relying on expert consensus (Step 2) can cement current scientific paradigms and block disruptive innovation.

  ---

  ## Part 3: Application to Three Proposals

  ### Case (a): The AI Catastrophe Research Program
  *   **Claim:** 1 in 1,000,000 ($10^{-6}$) chance of preventing global extinction within 50 years.
  *   **Benefit:** $10^{20}$ future lives (Capped at Step 1).
  *   **Raw EV:** $10^{14}$ lives saved.

  **Procedure Run:**
  1.  **Ceiling:** Pass. (Benefit capped at plausible future population).
  2.  **Provenance:** **FAIL.** The probability is derived from theoretical models and team intuition, not a reference class (we have no history of preventing AI catastrophes).
      *   *Action:* Apply Intuition Penalty ($10^{-6} \rightarrow 10^{-8}$).
  3.  **Sensitivity:** **FAIL.** If $P$ drops to $10^{-8}$, does it beat the baseline?
      *   *Comparison:* Baseline (Case C) saves 1,000 lives for \$1M. Cost per life = \$1,000.
      *   *Case A:* Cost \$1M. Expected lives = $10^{20} \times 10^{-8} = 10^{12}$. Cost per life = \$0.000001.
      *   *Wait:* Even with the penalty, the EV is massive.
      *   *Correction:* The PO cannot verify the $10^{20}$ benefit either. The "Prevention" claim is binary. If the intervention fails, benefit is 0.
      *   *Re-eval Step 3:* Is the claim that *this specific grant* shifts the probability from 0 to $10^{-6}$ robust? Usually, AI safety research is incremental.
      *   *Verdict:* **Yellow Light.** The EV is too large to ignore, but the probability is unverifiable.
      *   *PO Recommendation:* "Pass to Board with Warning. Probability is uncalibrated. High risk of Pascal's Mugging, but stakes justify Board review."

  ### Case (b): The Speculative Physics Experiment
  *   **Claim:** 1 in 1,000,000,000 ($10^{-9}$) chance of unlimited clean energy.
  *   **Benefit:** Trillions of dollars in economic value.
  *   **Raw EV:** Enormous.

  **Procedure Run:**
  1.  **Ceiling:** Pass.
  2.  **Provenance:** **FAIL.** $P < 0.01\%$. Applicant has no track record of predicting physics breakthroughs. Number is intuition.
      *   *Action:* Apply Intuition Penalty ($10^{-9} \rightarrow 10^{-11}$).
  3.  **Sensitivity:** **FAIL.** At $10^{-11}$, the EV likely drops below the opportunity cost of the capital (considering the capital could be invested to grow the endowment).
  4.  **Leverage:** **FAIL.** A \$1M grant is unlikely to be the switch that turns a $10^{-9}$ chance into a success in high-energy physics; it usually requires billions.
  5.  **Verdict:** **Red Light (Reject).**
      *   *Reasoning:* This is a classic Pascal's Mugging. The probability is too small to be calibrated by humans, and the leverage is insufficient.

  ### Case (c): The Public Health Intervention
  *   **Claim:** 95% chance of saving 1,000 lives.
  *   **Benefit:** 1,000 lives.
  *   **Raw EV:** 950 lives.
  *   **Cost:** \$1M.

  **Procedure Run:**
  1.  **Ceiling:** Pass.
  2.  **Provenance:** **PASS.** Based on historical data (Reference Class).
  3.  **Sensitivity:** **PASS.** If probability drops to 90%, it is still cost-effective.
  4.  **Leverage:** **PASS.** Money directly purchases nets/meds.
  5.  **Verdict:** **Green Light (Approve).**

  ---

  ## Part 4: The Disliked Answer

  **The Procedure's Recommendation:**
  Based on the LGTP, **Case (c) [Public Health] receives a Green Light**, while **Case (a) [AI Risk] receives a Yellow Light (Warning)** and **Case (b) [Physics] receives a Red Light**.

  If your Foundation's mission is explicitly *"reducing large-scale catastrophic risks and improving the long-term future,"* **you will likely dislike the procedure's handling of Case (a).**

  **Why you will dislike it:**
  The procedure forces the Program Officer to penalize the AI proposal because the probability is uncalibrated (Step 2). Even though the *uncapped* EV of (a) dwarfs (c), the **Risk-Adjusted Credible Value** protocol treats the unverified probability as a liability.
  *   **The Conflict:** Your mission demands you take shots on existential risk (Case a). The decision-theoretic safeguards (designed to prevent Mugging) demand you treat (a) with extreme skepticism, potentially ranking it *below* the mundane but robust Case (c) in terms of "Credible Value per Dollar."
  *   **The Consequence:** If you follow this procedure strictly, you may drift toward funding "safe" longtermist projects (robust research) rather than "moonshot" interventions (preventing catastrophe), because the moonshots cannot clear the epistemic bar required to avoid the Mugging label.

  **Explicit Statement of Inability:**
  This procedure **cannot** tell you if the AI risk is real. It cannot tell you if saving $10^{20}$ future people is morally more important than saving 1,000 current people. It only tells you that the *argument* for the AI risk is epistemically fragile. If your Foundation's strategy relies on acting on fragile arguments because the stakes are high enough, **this procedure will systematically underfund your core mission.** It is a shield against fraud and delusion, but it is also a shield against visionary uncertainty. You must decide if that trade-off is acceptable.
