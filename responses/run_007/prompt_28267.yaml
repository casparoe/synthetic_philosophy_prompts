  2.  **Deconstruct the Theoretical Background (Pascal's Mugging & EV):**
      *   *Pascal's Mugging:* A threat/request where a tiny probability of a huge payoff dominates the calculation, but the probability is unverifiable and likely manipulated.
      *   *Key Issues:*
          *   Epistemic humility: Can we trust $P=10^{-9}$? Usually no. Human calibration breaks down at extremes.
          *   Bounded Utility: Does saving $10^{100}$ lives actually matter $10^{100}$ times more than saving 1 life? Psychologically and ethically, maybe not (diminishing marginal utility).
          *   Model Uncertainty: The probability estimate itself has error bars. If the error bar is larger than the estimate, the estimate is noise.
          *   Opportunity Cost: Funding this means *not* funding something with robust EV.
          *   Updatelessness/Precommitment: If we fund this, we invite *all* such proposals, draining resources.

  3.  **Drafting the Decision Procedure (The "Longtermist Grant Triage Protocol"):**
      *   *Time Limit:* 2 hours. Needs to be fast.
      *   *Structure:* Gating questions. If you fail one, stop.
      *   *Core Concept:* "Robustness over Precision." Don't fight over whether it's $10^{-6}$ or $10^{-7}$. Fight over whether the *mechanism* is plausible enough to justify the number.
      *   *Step 1: The Sanity Check (Bounded Utility/Scale).* Is the benefit physically possible?
