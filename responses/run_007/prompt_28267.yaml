      *   *Step 4: The "Mugging" Test.* If we funded everyone claiming this EV, would we go bankrupt? (Policy consistency).
      *   *Step 5: The Board Handoff.* If it passes, it goes to the Board with specific caveats.

      *Refining the Steps for a PO:*
      *   Need concrete questions.
      *   Need "Pass/Fail" criteria.
      *   Need to highlight "Judgment Calls."

  4.  **Developing the Application Cases:**
