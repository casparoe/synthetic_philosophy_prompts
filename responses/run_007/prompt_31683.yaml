answer: |-
  # Joint Statement on the Status and Scope of the Frame Problem

  **Date:** October 26, 2023
  **Signatories:**
  *   Representative of the Formal-Methods Camp (FM)
  *   Representative of the Relevance Camp (REL)

  **Context:** This document summarizes the outcomes of an adversarial collaboration regarding the nature, solution, and scope of the "Frame Problem" in artificial intelligence and cognitive science. The parties agree on the technical history and the current capabilities of logical formalisms but disagree on the explanatory priority of those formalisms relative to cognitive architecture.

  ---

  ## I. Agreed Claims

  We jointly affirm the following five claims:

  1.  **Original Formulation and Infeasibility of Enumeration:** We agree that the frame problem was originally formulated by McCarthy and Hayes (1969) within the Situation Calculus as the difficulty of representing that conditions (fluents) persist over time without needing to explicitly state that they do. We agree that a solution requiring a separate "frame axiom" for every action–fluent pair is unacceptable because it scales quadratically ($O(A \times F)$), creating an unmanageable burden for knowledge engineering and rendering inference computationally intractable in complex domains.
  2.  **Distinction Among Related Problems:** We agree that the Frame Problem (what stays the same) is distinct from, though related to, the Qualification Problem (the impossibility of listing all preconditions required for an action to succeed) and the Ramification Problem (the difficulty of representing all indirect consequences of an action). While solutions to one often inform solutions to the others, they address logically distinct aspects of action representation.
  3.  **Accomplishments of Nonmonotonic Logics:** We agree that nonmonotonic formalisms—specifically circumscription, default logic, and predicate completion—successfully address the *representational* aspect of the original frame problem. These formalisms allow a system to infer persistence by default (minimizing change) without explicit frame axioms, thereby achieving representational compactness.
  4.  **The Yale Shooting Problem and Causal Assumptions:** We agree that the Yale Shooting Problem (Hanks & McDermott, 1987) demonstrated that early nonmonotonic formalisms were insufficient because they allowed models where effects vanished spontaneously. We agree that accepted fixes (e.g., chronological minimization, causal ordering, or successor state axioms) resolve the logical ambiguity but do so by importing assumptions about temporal directionality or causal structure that are not contained in the raw logic of change itself.
  5.  **Requirements for Deployed Agents:** We agree that a logically correct representation of persistence is necessary but not sufficient for a deployed, resource-bounded agent. Beyond deriving the correct consequences, a functioning agent must implement search control, indexing mechanisms, and heuristic filters to determine *which* potential inferences to compute within real-time constraints. We agree that standard logical formalisms do not, in themselves, specify these architectural control structures.

  ---

  ## II. Disagreements Table

  The following table outlines the genuine residual disagreements regarding the interpretation and significance of the claims above.

  | Topic | Formal-Methods Camp (FM) Position | Relevance Camp (REL) Position |
  | :--- | :--- | :--- |
  | **1. Scope of the Label** | The term "Frame Problem" properly refers to the technical problem of representational compactness and logical consistency in reasoning about action. The cognitive issues are distinct problems of "search control" or "relevance." | The term "Frame Problem" properly refers to the broader cognitive problem of how a bounded system isolates relevant beliefs from irrelevant ones. The logical representation problem is merely a symptom of this deeper cognitive issue. |
  | **2. Explanatory Priority** | Solving the logical representation of persistence is a prerequisite for solving the cognitive relevance problem. One cannot efficiently filter relevant updates without a formal definition of what constitutes an update. | Solving the logical representation presupposes a solution to the cognitive relevance problem. Circumscription policies require a prior determination of which fluents are *candidates* for change, which is the very relevance problem the logic was meant to solve. |
  | **3. Sufficiency of Formalism** | The transition from monotonic to nonmonotonic logic, combined with computational optimizations (e.g., successor state axioms), contains the seeds of a full solution. The remaining work is engineering optimization. | The formalism masks the cognitive problem by pushing the relevance burden into the "minimization policy" or "causal ordering." A formal account of how that policy is generated dynamically is missing and constitutes the core of the problem. |

  ---

  ## III. Cruxes

  We identify the following sub-questions as cruxes. Settling these would significantly alter the position of at least one camp.

  | Crux | Description | Evidence / Argument Required | FM Prediction | REL Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Tractability of General Circumscription** | Can a general-purpose circumscription engine operate over high-dimensional, unstructured domains without pre-coded relevance indices or causal orderings? | A demonstration of a theorem prover that maintains consistency in a dynamic environment with $N > 10^6$ fluents, without human-engineered frame axioms or pre-defined causal links, within real-time bounds. | **Feasible:** With modern SAT/SMT solving and learning-based heuristic guidance, general minimization will prove tractable without explicit relevance filtering. | **Infeasible:** The system will implicitly learn or require relevance indices equivalent to the cognitive structures REL claims are necessary, proving the logic did not solve the selection problem. |
  | **2. Neuro-Symbolic Mapping** | Does biological cognition implement a logic of persistence that resembles situation calculus, or does it bypass persistence inference entirely? | Neuroscientific evidence showing whether the brain maintains explicit "fluent" representations that are updated via action, or whether it uses associative retrieval that inherently ignores irrelevant changes. | **Logic-like:** Neural activity will show distinct maintenance and update signals corresponding to logical persistence and change detection. | **Associative:** Neural activity will show that "persistence" is a byproduct of lack of activation, not an active inference, implying the logical frame problem is an artifact of symbolic representation. |
  | **3. The "Sleeping Dog" Test** | Can a system be built that ignores irrelevant changes without a relevance metric? | An agent that successfully navigates a novel environment where the rules of causal relevance change dynamically, without retraining its minimization policy. | **Yes:** The agent will adapt by updating its causal theory, which governs the minimization. | **No:** The agent will fail unless it possesses a meta-heuristic for relevance that is independent of its causal theory. |

  ---

  ## IV. Analysis of Verbal vs. Substantive Dispute

  Upon review, we conclude that a portion of our dispute is **verbal**, specifically regarding the application of the label "Frame Problem."

  *   **Verbal Component:** FM uses the label to denote the *logical representation of persistence*. REL uses the label to denote the *cognitive selection of relevance*. If both parties agree to use distinct terms (e.g., "Logical Frame Problem" vs. "Cognitive Frame Problem"), the argument over definition dissolves.
  *   **Substantive Remainder:** Even after terminological disambiguation, a substantive disagreement remains regarding **explanatory dependency**.
      *   **FM** contends that the Logical Frame Problem is *foundational*: you cannot build a cognitive system that handles relevance until you have a formalism that correctly handles persistence without explosion.
      *   **REL** contends that the Cognitive Frame Problem is *foundational*: you cannot implement the logical formalism in a physical system without a prior solution to relevance, meaning the logical solution is not an explanation of intelligence but a description of its output.

  **Resolution Path:** Both sides agree that empirical progress on Crux #1 (Tractability of General Circumscription) is the most promising avenue for resolving the substantive remainder. If general minimization proves tractable without hidden relevance structures, FM's claim of explanatory priority is strengthened. If it proves intractable without them, REL's claim that relevance is prior is strengthened.
