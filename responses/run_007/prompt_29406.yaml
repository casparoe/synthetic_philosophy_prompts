      *Wait, re-reading the prompt:* "The idea also holds that meaning is not stored in the words alone but is spread across those levels..."
      Okay, I will structure the procedure around the three levels explicitly but define them simply.

      *Time Check:* 15 minutes per message. 5 minutes per level? That's tight. The questions need to be rapid-fire.

      *Verdict Expectation:* "I expect the procedure to return at least one verdict we will not like." -> Definitely "We have made a change..." needs to be flagged for rewrite. "Invalid input" is also a classic offender.

      *British English:* Ensure "recognise", "colour", "programme" (if used), "authorise", etc. are correct. Avoid Americanisms like "gotten" or "trash can".

  9.  **Final Polish:** Check the flow. Ensure the "Senior Editor" hand-off is clear. Ensure the limitations section is distinct.

      *(Final thought on the "Invalid Input" verdict)*: The team might think "Invalid input" is fine because it's standard. The procedure should flag it because it lacks specific guidance (Inner) and implies user error bluntly (Outer). I will make sure the verdict is "Rewrite".

