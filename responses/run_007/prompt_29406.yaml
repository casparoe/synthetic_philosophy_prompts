answer: |-
  # The Three-Level Message Protocol (3LMP)

  **Purpose:** To ensure error messages and status alerts are recognised, correctly interpreted, and acted upon.
  **Time Allocation:** 15 minutes per message.
  **Participants:** Technical Writer (TW), Peer Reviewer (PR). Senior Editor (SE) involved only on flags.
  **Theory Basis:** Meaning exists across three levels: **Frame** (noticeability), **Context** (tone/agency), and **Content** (specifics).

  ---

  ## Part 1: The Procedure

  Run through the following three stages in order. You must agree on a 'Pass' or 'Fail' for each question before moving to the next. If you disagree, the item is immediately handed to the Senior Editor.

  ### Stage 1: The Frame (Is it seen?)
  *Focus: Visual and sensory cues that announce a message exists.*

  1.  **Q1:** Does this element visually distinguish itself from standard content (e.g., colour, icon, placement, motion)?
      *   **Satisfactory Answer:** Yes. It uses established UI patterns for alerts (e.g., toast notification, modal, red text for errors).
      *   **Fail Condition:** It looks like static text or standard UI chrome.
      *   **Action:** If Fail → **Rewrite/Redesign**. Do not proceed.

  2.  **Q2:** Will the user notice this at the moment they need to?
      *   **Satisfactory Answer:** Yes. It appears near the point of interaction or in a dedicated notification centre the user checks for this event type.
      *   **Fail Condition:** It is hidden behind a menu, appears too early/late, or is easily scrolled past.
      *   **Action:** If Fail → **Rewrite/Redesign**. Do not proceed.

  ### Stage 2: The Context (How is it felt?)
  *Focus: Tone, agency, and relationship. This decodes the content.*

  3.  **Q3:** Is the source of the message clear?
      *   **Satisfactory Answer:** Yes. The user knows if this is the system, the company, or another user speaking.
      *   **Fail Condition:** Ambiguous agency (e.g., passive voice where the actor is hidden).
      *   **Action:** If Fail → **Flag for Senior Editor**.

  4.  **Q4:** Does the tone match the severity of the situation?
      *   **Satisfactory Answer:** Yes. Critical errors sound urgent; informational status sounds neutral. It does not sound accusatory ("You failed") or overly casual ("Oops!").
      *   **Fail Condition:** Tone mismatch (e.g., cheerful tone for data loss, or aggressive tone for a minor update).
      *   **Action:** If Fail → **Rewrite**.

  ### Stage 3: The Content (What is said?)
  *Focus: The literal text and actionable instruction.*

  5.  **Q5:** Is the technical jargon necessary and understood by our specific user persona?
      *   **Satisfactory Answer:** Yes. Terms like "Input", "Server", or "Token" are known by this user group.
      *   **Fail Condition:** Use of internal engineering terms or vague nouns ("Item", "Thing", "Change").
      *   **Action:** If Fail → **Rewrite**.

  6.  **Q6:** Does the message tell the user what to do next or what to expect?
      *   **Satisfactory Answer:** Yes. It provides a clear path (e.g., "Try again", "Contact support") or a definitive outcome (e.g., "Save completed").
      *   **Fail Condition:** It states a problem without a solution, or a change without a consequence.
      *   **Action:** If Fail → **Rewrite**.

  ### Decision Logic
  *   **Any Stage 1 Fail:** Stop. Redesign the UI/Frame.
  *   **Any Stage 2 or 3 Fail:** Rewrite the copy.
  *   **Any Disagreement between TW and PR:** Stop. Hand to Senior Editor.
  *   **All Pass:** Message is approved for release.

  ---

  ## Part 2: Procedure Application

  Below is the result of running the 3LMP on your three specified messages.

  ### Message 1: "Invalid input"
  *Context: An error appearing below a form field.*

  *   **Stage 1 (Frame):**
      *   Q1 (Visual distinction): **Pass** (Assuming red text or icon).
      *   Q2 (Timing): **Pass** (Appears on submit).
  *   **Stage 2 (Context):**
      *   Q3 (Source): **Pass** (Implied system validation).
      *   Q4 (Tone): **Fail**. "Invalid" is binary and accusatory. It implies the user is wrong rather than the data being mismatched.
  *   **Stage 3 (Content):**
      *   Q5 (Jargon): **Fail**. "Input" is technical. Users think of "answers" or "details".
      *   Q6 (Action): **Fail**. It does not state *why* it is invalid or how to fix it.

  **Verdict:** **REWRITE.**
  *Reasoning:* While the team may view this as standard industry shorthand, the procedure flags it for blaming the user (Context) and lacking actionable advice (Content). It fails the meaningfulness test.

  ### Message 2: "Your data will be deleted in 30 days"
  *Context: A status alert in a dashboard.*

  *   **Stage 1 (Frame):**
      *   Q1 (Visual distinction): **Pass** (Assuming yellow/warning banner).
      *   Q2 (Timing): **Pass** (Visible on login).
  *   **Stage 2 (Context):**
      *   Q3 (Source): **Flag**. Passive voice ("will be deleted"). Who is deleting it? Is it automatic? Is it a threat from the company? This requires human judgement on brand voice.
      *   Q4 (Tone): **Pass** (Neutral/Urgent).
  *   **Stage 3 (Content):**
      *   Q5 (Jargon): **Pass**.
      *   Q6 (Action): **Fail**. It states a consequence but offers no button or link to stop it (e.g., "Renew subscription" or "Download archive").

  **Verdict:** **HAND TO SENIOR EDITOR.**
  *Reasoning:* The lack of agency (Context Q3) creates ambiguity that could be interpreted as a threat or a fact. The Senior Editor must decide if the passive voice is intentional policy or a drafting error. However, Content Q6 suggests a rewrite is likely needed to add an action.

  ### Message 3: "We have made a change to your account"
  *Context: An email subject line or in-app notification.*

  *   **Stage 1 (Frame):**
      *   Q1 (Visual distinction): **Pass**.
      *   Q2 (Timing): **Pass**.
  *   **Stage 2 (Context):**
      *   Q3 (Source): **Pass** ("We").
      *   Q4 (Tone): **Fail**. "We have made a change" asserts dominance. It implies the company acts *upon* the user. Given user anxiety regarding account security, this tone registers as a threat rather than a service update.
  *   **Stage 3 (Content):**
      *   Q5 (Jargon): **Fail**. "Change" is meaningless. Is it a password reset? A price hike? A feature addition?
      *   Q6 (Action): **Fail**. No instruction on what to do with this information.

  **Verdict:** **REWRITE.**
  *Reasoning:* I anticipate this is the verdict you will not like, as you noted the team is fond of this message. However, the procedure identifies it as high-risk. The vagueness of "change" combined with the assertive "We/Your" dynamic triggers security anxiety. It fails Context (Tone) and Content (Specifics).

  ---

  ## Part 3: Limitations and Guarantees

  You asked what this procedure cannot guarantee. Please read this before implementing the 3LMP.

  1.  **It cannot guarantee comprehension.** The procedure checks for *clarity of intent*, not *user reception*. A user who is stressed, distracted, or lacks domain knowledge may still misunderstand a message that passes all six questions.
  2.  **It cannot account for external context.** We cannot mechanically test for what is happening in the user's life. A neutral message like "Login detected" might be reassuring to one user and terrifying to another whose partner is monitoring their device.
  3.  **It cannot replace user testing.** This protocol is a heuristic review. It filters out obvious failures before messages reach real humans. It is not a substitute for A/B testing or usability studies.
  4.  **It relies on the reviewers' empathy.** If the Technical Writer and Peer Reviewer share the same blind spots (e.g., they are both engineers who find "Invalid input" perfectly clear), the procedure will pass a message that users still hate. This is why the Senior Editor hand-off on disagreements is critical; it forces a third perspective.

  **Final Note:** The 3LMP is designed to slow you down just enough to think, not to stop you from shipping. If a message is flagged for rewrite, it is not a failure of writing; it is a success of the protocol preventing a failure of communication.
