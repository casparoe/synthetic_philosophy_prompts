answer: |-
  Here is an argument structured for your piece. It acknowledges the sophistication of the utilitarian reply but demonstrates why it ultimately fails to address the existential core of Williams's critique.

  ***

  ### The Criterion/Procedure Distinction: A Solution in Search of a Problem?

  To understand why the standard utilitarian reply fails, we first have to grant it its due. The distinction between the **criterion of rightness** (what makes an act right) and the **decision procedure** (how an agent deliberates) is not a trivial dodge. It is a sophisticated piece of philosophical engineering designed to save utilitarianism from the charge of being psychologically impossible.

  The utilitarian argues: *Of course* the husband shouldn't be calculating utility while his wife is drowning. That would be absurd. Utilitarianism says the *right* act is the one that maximizes well-being. But human psychology is such that well-being is best maximized when people act on deep, non-calculating commitments like love. Therefore, the utilitarian agent should be disposed to save his wife *because she is his wife*, not because of a calculation. The calculation belongs to the moral theorist evaluating the act, not the agent performing it.

  On the surface, this seems to dissolve Williams's objection. If the husband doesn't have the "one thought" in the moment, where is the alienation?

  The problem is that Williams isn't primarily worried about the husband's cognitive load during the rescue. He is worried about the **normative authority** that hovers over the husband's life. The criterion/decision-procedure distinction solves the problem of *paralysis*, but it leaves the problem of *subordination* entirely intact.

  Here is why Williams's objection cuts deeper than that distinction can capture.

  #### 1. The Problem of Contingency (Love on Probation)
  The criterion/decision-procedure distinction allows the husband to act on love, but it dictates the *terms* under which that love is permitted.

  Under impartial morality, the husband's commitment to his wife is only valid insofar as it does not violate the impartial criterion. It is a delegated authority. The system says, "We will allow you to prioritize your wife, provided that a world where husbands prioritize wives generally produces good outcomes."

  This renders the personal commitment **contingent**. It places the relationship on permanent probation. If the empirical facts shifted—if, for example, saving the stranger happened to produce slightly more utility, or if a specific social arrangement required spouses to be sacrificed for the greater good—the impartial criterion would demand the husband let his wife drown.

  Williams's point is that this contingency is corrosive to the nature of love itself. To love someone is to view them as having a claim on you that is not derived from a general social policy. If I truly love my wife, her claim on me is not a loan granted by the Principle of Utility; it is inherent to the relationship. The criterion/decision-procedure distinction admits that I don't need to *think* about the loan while I'm saving her, but it insists that the loan *exists*. It insists that the ultimate truth of my action is not "I saved her because I love her," but "I saved her because the system allows me to act on love."

  That "one thought too many" isn't necessarily a conscious thought in the moment; it is the **structure of justification** that underwrites the action. Even if I don't think it, the moral theory insists it is the *reason* my action is right. That external validation alienates me from my own life.

  #### 2. Integrity and the "View from Nowhere"
  Williams is deeply concerned with **integrity**. For Williams, integrity is not just honesty; it is the integration of one's actions with one's "ground projects"—the commitments that give life meaning and make you who you are.

  The utilitarian reply treats the agent as a **channel** for value. The value exists "out there" (in the aggregate welfare), and the agent's job is to facilitate it. The decision-procedure distinction just tells the channel to relax and let intuition guide the flow sometimes.

  But Williams argues that we are not just channels; we are **sources** of value. When I save my wife, the value of that act flows *from* my commitment to her. It is not valuable because it fits a pattern; the pattern is valuable (to me) because it includes her.

  The criterion/decision-procedure distinction fails here because it maintains the "View from Nowhere" as the ultimate judge. It demands that I be able to step back from my own life, view my commitments impartially, and endorse them only if they pass the test. Williams argues that this step back is impossible without losing the self that is doing the stepping. If I have to justify my ground projects from an impartial standpoint, I am no longer living *from* those projects; I am managing them.

  The "one thought too many" is the thought that requires me to validate my own identity from the outside. Even if I relegate that validation to "theorist time" (the criterion), it still implies that my identity is subject to external audit.

  #### 3. The Colonization of Deliberation
  Finally, there is a practical psychological reality that the distinction ignores. You cannot neatly compartmentalize the criterion of rightness from the decision procedure in the way utilitarians hope.

  If I genuinely believe that the *truth* about morality is impartial maximization, that belief will inevitably seep into my deliberation, especially in hard cases. The distinction works fine when saving my wife is clearly permissible. But what about the marginal cases? What if saving my wife costs a significant amount of money that could save a life? What if it requires a small lie?

  If I hold the utilitarian criterion as the ultimate truth, I can never fully rest in my personal commitments. There will always be a background hum of suspicion: *Is this still allowed? Am I still within the quota of partiality the system grants me?*

  Williams's objection is that a moral theory should not require us to live with this background hum. A moral theory that makes me feel guilty for loving my wife too much (or not enough, relative to the optimum) is a theory that is hostile to human life. The criterion/decision-procedure distinction tries to silence the hum, but it doesn't turn off the machine.

  #### Conclusion for Your Piece
  The utilitarian reply treats Williams's objection as a complaint about **efficiency** (calculating takes too long) or **psychology** (humans can't calculate like that). It answers: "Don't calculate, just feel."

  But Williams's objection is about **authority**. He is asking: *Who is the boss of my life?* Is it me and my commitments, or is it an impartial system that tolerates my commitments as a useful heuristic?

  The "one thought too many" is not the thought that occurs in the split second before the jump. It is the thought that occurs when we ask, "What makes this action right?" If the answer is anything other than "Because she is my wife," then the impartial system has inserted itself between the husband and the wife. It has inserted a mediator into the most intimate of human relations.

  The criterion/decision-procedure distinction tries to hide the mediator behind a curtain. But Williams insists that knowing the mediator is there—even if he stays behind the curtain—changes the nature of the relationship. It turns a marriage into a franchise. And no amount of philosophical distinction can make that feel like integrity.
