answer: |-
  The single most important thing you should walk away knowing is that **no consistent theory satisfies all intuitive desiderata**; the debate is not about finding the correct solution, but choosing which core moral intuition to sacrifice. The "problem" is actually a proof that our common-sense moral beliefs about existence are logically inconsistent. Any theory your characters adopt will require them to accept a counterintuitive or disturbing conclusion elsewhere.

  ### Desiderata for an Adequate Theory

  **1. The Asymmetry Condition**
  *   **Requirement:** The theory must validate the intuition that we have a strong moral duty *not* to bring a miserable child into existence, but no corresponding duty to bring a happy child into existence.
  *   **Motivating Case:** *The Miserable vs. The Happy.* If you know a child will suffer terribly from a genetic disease, you ought not conceive them. If you know a child will be wonderfully happy, you are not morally obliged to conceive them.
  *   **Why Non-Negotiable?** For many, this is the phenomenon itself. A theory that fails this isn't a theory of the asymmetry; it's a rejection of it.

  **2. The Person-Affecting Restriction**
  *   **Requirement:** Morality must be about making things better or worse *for someone*. An act cannot be wrong unless there is a specific victim who is harmed by it.
  *   **Motivating Case:** *The Victimless Crime.* If an action changes the world but leaves every existing person equally well off, it feels intuitively neutral. We struggle to condemn acts that harm "no one."
  *   **Why Negotiable?** Impersonal views (e.g., Total Utilitarianism) reject this. They argue states of affairs can be better or worse even if no specific individual is worse off than they would otherwise have been.

  **3. The Non-Identity Constraint**
  *   **Requirement:** The theory must explain why certain choices affecting future people are wrong, even when those choices determine *which* people come into existence.
  *   **Motivating Case:** *Parfit's 14-Year-Old Girl.* A 14-year-old chooses to have a child now rather than waiting. The child will have a hard life but a life worth living. If she waited, a *different* child would be born. Since the actual child is not worse off than they would have been (otherwise they wouldn't exist), the Person-Affecting Restriction says she did no wrong. Yet, intuitively, she acted wrongly.
  *   **Why Non-Negotiable?** A theory that cannot condemn clearly reckless procreation in non-identity cases loses contact with intergenerational justice (e.g., climate change policy).

  **4. The Non-Repugnance Condition**
  *   **Requirement:** The theory must not imply that a massive population of lives barely worth living is better than a smaller population of excellent lives.
  *   **Motivating Case:** *The Repugnant Conclusion.* If total happiness is the only metric, adding billions of people with minimal positive welfare eventually outweighs a small group of supremely happy people.
  *   **Why Negotiable?** Classical Utilitarians often bite this bullet, accepting it as the logical cost of maximizing total good. Most other camps view this as a *reductio ad absurdum*.

  **5. The Non-Sadism Condition**
  *   **Requirement:** The theory must not imply that adding people with negative welfare (suffering) is better than adding people with positive welfare (happiness), even if the happy lives are barely worth living.
  *   **Motivating Case:** *The Sadistic Conclusion.* Some theories avoid the Repugnant Conclusion by prioritizing average welfare so strictly that they imply it's better to add suffering people than to dilute the average with barely happy people.
  *   **Why Non-Negotiable?** This is widely viewed as morally abhorrent. A theory yielding this is usually considered broken.

  **6. Existence Neutrality**
  *   **Requirement:** The theory must treat non-existence as a neutral baseline, not a state of deprivation.
  *   **Motivating Case:** *The Unconceived.* We do not mourn the billions of children we *didn't* have as tragedies of deprivation. To say non-existence is "bad" for the non-existent implies a duty to procreate maximally.
  *   **Why Negotiable?** Some religious or strong pro-natalist views reject this, arguing existence is inherently good and non-existence a privation. Secular asymmetry theories usually require neutrality.

  ### Incompatibilities and Trade-Offs

  **1. The Asymmetry vs. The Person-Affecting Restriction (in Non-Identity Cases)**
  *   **The Conflict:** If you hold the **Person-Affecting Restriction** (no victim, no wrong) and **Existence Neutrality** (non-existence isn't bad), you cannot explain why the 14-year-old girl acts wrongly in the **Non-Identity Case**. Her child is not harmed (life is worth living), and the alternative child never exists to be harmed.
  *   **The Cost:** To solve Non-Identity, you must either abandon the Person-Affecting Restriction (accepting impersonal harms) or accept that some clearly reckless procreative acts are not wrong.

  **2. The Asymmetry vs. Impartiality (Logical Consistency)**
  *   **The Conflict:** The **Asymmetry Condition** violates standard logical axioms of goodness. If pain is bad, the absence of pain is good. If pleasure is good, the absence of pleasure is bad. The Asymmetry claims the absence of pain is good (when no one exists) but the absence of pleasure is *not* bad.
  *   **The Cost:** To maintain the Asymmetry, you must adopt a complex, non-standard axiology (like Benatar's) that many philosophers argue is logically unstable or ad hoc. To maintain logical consistency (Impartiality), you must reject the Asymmetry (becoming a Total Utilitarian).

  **3. The Impossibility Theorem (Arrhenius)**
  *   **The Conflict:** Gustaf Arrhenius proved mathematically that no theory can satisfy all adequate conditions simultaneously. Specifically, you cannot jointly satisfy: **The Asymmetry**, **Avoid the Repugnant Conclusion**, **Avoid the Sadistic Conclusion**, and **Maintain Logical Transitivity**.
  *   **The Cost:** Every theory leaks.
      *   **Total Utilitarianism:** Saves logic and Non-Identity, but kills the Asymmetry and accepts the Repugnant Conclusion.
      *   **Person-Affecting Views:** Save the Asymmetry and Existence Neutrality, but fail the Non-Identity Constraint (can't condemn reckless procreation).
      *   **Critical-Level Utilitarianism:** Avoids the Repugnant Conclusion, but risks the Sadistic Conclusion.

  ### Summary for Character Construction

  *   **Non-Negotiable Commitments:** Logical consistency and avoiding the Sadistic Conclusion are the hardest to drop without making a character seem sociopathic or irrational.
  *   **Negotiable Commitments:** The Asymmetry itself is negotiable (a utilitarian character will reject it). The Person-Affecting Restriction is negotiable (an impersonal theorist will drop it). The Repugnant Conclusion is negotiable (a hard-headed utilitarian will accept it).
  *   **The Dramatic Tension:** Your characters should not be arguing about who is "right." They should be arguing about **which intuition to sacrifice**. One character might say, "I'd rather accept that we have no duty to the future than believe a world of suffering masses is better than a happy few." The other might say, "I'd rather accept a duty to create happiness than believe morality is just about avoiding victims." The tragedy is that both are logically coherent only by accepting a moral cost the other finds unacceptable.
