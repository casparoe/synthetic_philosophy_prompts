          3.  Provide a "Residue Report": Analyze what maps cleanly, what requires distorting terms, and what is lost in translation (specifically regarding historical causal processes vs. model fit).
          4.  Evaluate the ledger: Does the statistical vocabulary miss something essential, or does the failed translation reveal philosophical imprecision?
      *   **Tone/Style:** Precise, technical (no hand-holding on stats terms), honest about distortions, philosophically rigorous.

  2.  **Part 1: Translating the Critique (Just-So Stories as Bad Statistics):**
      *   *Core Charge:* Plausible stories for any trait, low risk of being wrong.
      *   *Statistical Translation:*
          *   "Plausible story for any trait" $\rightarrow$ High model flexibility, excessive *free parameters*.
          *   "Low risk of being wrong" $\rightarrow$ Lack of *falsifiability*, effectively infinite *degrees of freedom* relative to data points.
          *   "Survives because not forced to run risk" $\rightarrow$ *Post hoc fitting* (data snooping), lack of *out-of-sample testing*.
          *   "Nearly any trait" $\rightarrow$ *Multiple comparisons* problem (testing many hypotheses until one sticks) or *identifiability* issues (many parameter sets yield the same likelihood).
          *   "Ancestral environment" (unobserved) $\rightarrow$ Latent variables with weak priors.
      *   *Synthesis:* The critique is that EP models are saturated. They maximize likelihood on the training data (current behavior) by adjusting parameters (ancestral pressures) that are unobserved, without penalty (regularization).

  3.  **Part 2: Translating the Defense (Adaptationism as Good Statistics):**
      *   *Core Defense:* Testable predictions, well-specified models, independent evidence.
      *   *Statistical Translation:*
          *   "Well-specified models" $\rightarrow$ Parametric constraints, *regularization* (penalizing complexity), strong priors on ancestral conditions.
          *   "Testable predictions" $\rightarrow$ *Out-of-sample validation*, cross-validation across species or contexts.
          *   "Independent sources of evidence" $\rightarrow$ Using auxiliary data to fix parameters (reducing *degrees of freedom*).
          *   "Pre-specified test" $\rightarrow$ *Pre-registration* of the hypothesis before looking at the specific behavioral data.
          *   "Null model" $\rightarrow$ Drift model, phylogenetic inertia, or a spandrel model (trait exists but $H_0: \beta_{selection} = 0$).
          *   "Not reverse-engineered" $\rightarrow$ Avoiding *circularity* in parameter estimation; the likelihood function shouldn't be defined by the trait it explains.
      *   *Synthesis:* A well-regularized hypothesis restricts the parameter space of ancestral selection pressures *a priori*, allowing for a calculation of AIC/BIC where the adaptation model significantly outperforms the null (drift/constraint) model on *new* data.

  4.  **Part 3: The Residue Report (Mapping and Distortion):**
      *   *Clean Maps:*
          *   Just-So $\leftrightarrow$ Overfitting/Saturated Models.
          *   Testable Predictions $\leftrightarrow$ Out-of-Sample Performance.
          *   Plausibility $\leftrightarrow$ Likelihood Surface.
      *   *Distorted/Problematic Maps:*
          *   *Spandrels vs. Null:* A spandrel isn't just $\beta=0$. It's a specific alternative model (byproduct of selection on Trait B). In stats, the null is usually "noise" or "intercept only." In biology, the null is "different causal structure."
          *   *Adaptation vs. Fit:* Adaptation is a *historical claim* (process), not just a *functional claim* (fit). A model can fit well (high $R^2$) due to exaptation or convergence, not necessarily the specific historical selection pressure posited.
          *   *Ancestral Environment:* In stats, latent variables are estimated. In EP, the "Environment of Evolutionary Adaptedness" (EEA) is often a composite, not a single point estimate, making the likelihood function ill-defined.
      *   *The "Causal Process" Issue:* Statistics deals with correlation/prediction within a dataset. Evolutionary claims are about *genealogy* and *causation* over deep time. $P(Data | Model)$ is accessible; $P(Model | History)$ is not directly estimable without strong assumptions about the fossil/archaeological record (which are often missing).

  5.  **Part 4: The Ledger (Who is at fault?):**
      *   *Option A:* Stats vocabulary is insufficient. (It misses the historical/causal ontology).
