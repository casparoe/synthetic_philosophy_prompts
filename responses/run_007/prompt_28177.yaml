      *   *Refinement:* The statistical translation exposes that many EP claims are *unidentifiable*. No amount of data on current behavior can distinguish between Selection for X, Selection for Y (correlated), or Drift + Constraint, without external priors. If the philosophical debate ignores identifiability, the philosophy is imprecise. If the statistics ignores the causal mechanism, the stats is shallow.
      *   *Decision:* The failed translation shows that the *philosophical defense* often claims more epistemic warrant than the *statistical structure* can support. The "historical causal process" is a latent variable with no direct observables. The stats vocabulary reveals this as an *identifiability problem*. So, the philosophical talk is often less precise than it sounds because it treats unidentifiable parameters as estimated quantities.

  6.  **Drafting the Response (incorporating constraints):**
