answer: |-
  ### I. The Critique: Just-So Stories as Statistical Pathology

  In your vocabulary, the Gould/Lewontin charge against evolutionary psychology (EP) is an accusation of severe **overfitting** driven by unpenalized model complexity.

  The "trait" is the response variable $Y$. The "ancestral selection pressure" constitutes the set of predictors $X$ and the parameter vector $\beta$. The critique asserts that EP practitioners construct saturated models where the number of free parameters (hypothesized pressures, social dynamics, ecological constraints) approaches or exceeds the number of data points (observed behaviors or ethnographic universals). Because the ancestral environment is unobserved, the $X$ matrix is treated as latent, allowing the researcher to impute values for $X$ that maximize the likelihood $P(Y|X, \beta)$ post hoc.

  This is **data snooping**. The hypothesis is generated after inspecting $Y$, meaning the degrees of freedom are consumed in the construction of the model rather than reserved for testing. Consequently, the model achieves low training error (high plausibility) but has high variance and poor **out-of-sample predictive accuracy**.

  Furthermore, the critique highlights an **identifiability** problem. For a given $Y$, there exist multiple distinct configurations of ancestral pressures ($X_1, X_2, ... X_k$) that yield equivalent likelihoods. Without independent constraints on the parameter space, the specific adaptationist story is not identifiable from the behavioral data alone. The "multiple comparisons" problem arises when researchers scan a space of possible ancestral narratives and report only the one that converges, without adjusting the significance threshold for the number of narratives considered.

  Finally, the lack of **pre-registration** is fatal. A just-so story is a model fitted to the training data with no hold-out set. It survives because it is never subjected to **cross-validation** against independent data (e.g., predicting a novel behavioral correlate not used to construct the hypothesis).

  ### II. The Defense: Adaptationism as Regularized Inference

  The adaptationist reply asserts that rigorous EP operates as a **regularized** modeling exercise with strict constraints on degrees of freedom.

  A well-regularized hypothesis fixes the parameter space *a priori*. The "well-specified models of ancestral selection pressures" act as strong **priors** on the latent variables $X$. We do not impute $X$ freely to fit $Y$; rather, we derive $X$ from paleoclimatic or archaeological data independent of $Y$. This reduces the effective degrees of freedom.

  A **pre-specified test** in this context means defining the test statistic and the rejection region before observing the specific behavioral variance in the target population. It requires **out-of-sample testing**: the model derived from one population (or one set of behavioral outputs) must predict variance in a distinct population or a distinct behavioral module without re-estimating parameters.

  The **null model** is not merely "noise." In a phylogenetic context, the null is often a Brownian motion model (drift) or a model of phylogenetic inertia. To claim adaptation, the selection model must demonstrate a significantly better fit (e.g., via AIC/BIC or Likelihood Ratio Test) than the null model of drift or constraint, penalized for complexity.

  To show the hypothesis is not **reverse-engineered**, the defender must demonstrate that the likelihood function is not defined by the trait it explains. This requires **instrumental variables** or auxiliary data that correlate with the ancestral pressure but are causally prior to the specific behavioral trait. If the model predicts $Y$ using parameters estimated solely from $Y$, it is circular. If it predicts $Y$ using parameters estimated from $Z$ (archaeological record, primate comparative data), it is identified.

  ### III. Residue Report: Mapping and Distortion

  Here is where the translation holds and where it fractures.

  **1. Clean Mappings**
  *   **Just-So $\leftrightarrow$ Overfitting:** This maps cleanly. A story that explains everything predicts nothing. High $R^2$ on training data with no cross-validation is precisely the statistical pathology critics identify.
  *   **Independent Evidence $\leftrightarrow$ Out-of-Sample Testing:** The demand for evidence outside the behavioral phenotype maps directly to the requirement for a hold-out set or external validation data to prevent overfitting.
  *   **Plausibility $\leftrightarrow$ Likelihood:** The intuitive "fit" of the story corresponds to the likelihood value. The critique is that likelihood alone, without a penalty for complexity (AIC/BIC), is insufficient for model selection.

  **2. Distorted Mappings**
  *   **Spandrels vs. Null Models:** You suspected this, and the translation confirms it. In statistics, a null model is usually a restriction of the alternative (e.g., $\beta = 0$). A spandrel is not $\beta_{selection} = 0$; it is a *different causal structure* (selection on Trait A $\rightarrow$ correlation $\rightarrow$ Trait B). In model selection terms, a spandrel is a *non-nested competing model*, not a null hypothesis within the same family. Treating spandrels as "nulls" distorts the topological relationship between the models.
  *   **Adaptation vs. Function Fit:** Calling something an adaptation is a claim about a **historical causal process**, not merely that a function fits the trait with low error. In statistics, we select the model with the best predictive accuracy (instrumentalism). In EP, "adaptation" claims ontological truth about the generator of the data (realism). A model can have excellent out-of-sample predictive power due to convergent evolution or exaptation, yet the specific historical parameter $\beta_{ancestral}$ remains misestimated. The stats vocabulary selects the best predictor; the philosophical debate demands the true generator.
  *   **The EEA as Latent Variable:** The "Environment of Evolutionary Adaptedness" is treated in EP as a estimable parameter set. In your vocabulary, this is a latent variable with no direct observables and weak priors. The translation forces us to treat the EEA as a fixed covariate, but in reality, it is a distribution over possible histories. Ignoring this uncertainty leads to overconfident standard errors on the selection parameters.

  **3. What Does Not Survive Translation**
  *   **Deep Time Identifiability:** Standard model selection assumes the data generating process is stationary or that non-stationarity is modeled. Evolutionary claims involve non-stationary processes over deep time where the "data" (fossils, artifacts) are sparse and biased. The statistical vocabulary assumes we *can* estimate parameters if we have enough data. The historical reality is that for many behavioral traits, the parameters are **structurally unidentifiable** regardless of sample size, because the relevant variance occurred in unobservable cognitive states of extinct ancestors.
  *   **Causal Mechanism vs. Correlation:** Statistics deals with $P(Y|X)$. Evolutionary theory claims $X$ *caused* $Y$ via replication and differential survival. The statistical vocabulary can detect association and predictive utility, but it cannot distinguish between selection *for* a trait and selection *of* a correlated trait without strong causal assumptions that are external to the data.

  ### IV. The Ledger

  Which side is doing the work?

  The failed translation reveals that **the philosophical talk is often less precise than it sounds**, specifically regarding epistemic warrant.

  When adaptationists claim they are doing "science" akin to standard empirical inquiry, the statistical translation exposes that they are often attempting to estimate parameters on a model that is **unidentifiable** given the available data. The philosophical defense relies on an equivocation between *predictive adequacy* (which statistics can assess) and *historical truth* (which statistics cannot secure without untestable assumptions about the past).

  However, the statistical vocabulary also misses something the debate genuinely turns on: **the ontology of function.** In statistics, a "good model" is one that minimizes prediction error. In biology, an "adaptation" is a trait present *because* it minimized prediction error (fitness) in the past. The statistical vocabulary is ahistorical; it collapses the distinction between a trait that *currently* contributes to fitness and a trait that was *selected for* fitness. You can have a model that fits perfectly (the trait is functional now) but the historical parameter estimate is wrong (it was a spandrel originally).

  **Verdict:** The statistical vocabulary does not miss the *logic* of the debate; it clarifies it. It shows that the "Just-So" charge is a complaint about **identifiability and regularization**, not merely about storytelling. The residue is not a failure of statistics to capture biology, but a failure of the philosophical defense to acknowledge that claims about historical selection pressures are claims about latent variables with extremely weak priors.

  The translation suggests that much of the "philosophical" defense of EP is an attempt to mask a statistical impossibility (identifying specific historical selection pressures from current behavior) with ontological assertions (the reality of selection). The debate turns on whether one accepts strong priors on the EEA. If one does, the model is identified (Bayesian updating). If one does not, the model is unidentifiable (likelihood surface is flat). The philosophical dispute is often a disguised dispute over the validity of those priors.
