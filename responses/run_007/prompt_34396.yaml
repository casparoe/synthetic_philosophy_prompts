answer: |-
  ### 1. Exam Question

  **Course:** Environmental and Population Ethics (Upper-Level Seminar)
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 words

  **Essay Question:**

  Consider the claim that preserving natural habitat is morally obligatory because it protects wild animals, contrasted with the counter-claim that preserving habitat perpetuates severe suffering and that destruction might reduce net suffering.

  Write an essay evaluating whether habitat destruction could ever be justified as a method to reduce wild animal suffering, and whether the "net welfare of an ecosystem" is a coherent standard for conservation policy. In your analysis, you must address the following four requirements:

  1.  Distinguish clearly between the harm inflicted on currently existing animals (via death, starvation, or displacement) and the prevention of future animals from coming into existence. Explain why the argument that destruction reduces suffering relies primarily on the latter rather than the former.
  2.  Identify the specific empirical assumptions required regarding the distribution of welfare in wild populations to support the claim that destruction reduces suffering. Discuss what kind of evidence would be needed to verify these assumptions.
  3.  Evaluate whether "net ecosystem welfare" can function as a legitimate policy target. Consider the ontological status of ecosystems and the difficulties of aggregating welfare across heterogeneous species and life stages.
  4.  Take a defensible position on what conservation policy should prescribe under conditions of deep uncertainty regarding the sign of net wild animal welfare. Specifically, consider whether less destructive interventions would dominate habitat destruction on either the conservationist or suffering-reduction view.

  Do not simply recite standard conservationist slogans or generic wild-animal-suffering critiques. Your grade will depend on the philosophical precision of your distinctions and the rigor of your evaluation of the empirical and conceptual hurdles involved.

  ***

  ### 2. Model Answer

  The debate over habitat preservation often stalls between the intuition that nature deserves protection and the suspicion that wild life is fraught with suffering. To evaluate whether habitat destruction could reduce suffering, one must first disentangle the interests of existing individuals from those of potential future beings. Destroying a habitat invariably harms currently existing animals; it kills, starves, or displaces them. This is a direct harm to subjects with established interests in continuing their lives. Therefore, the claim that destruction reduces suffering cannot rest on benefiting these individuals. Instead, it depends entirely on the prevention of future lives. If future wild animals would otherwise come into existence and live lives containing more suffering than pleasure, preventing their existence reduces total suffering. This moves the argument from standard harm-based ethics to population ethics, where the moral weight shifts to the value of bringing new sentient beings into a hazardous environment.

  However, this population-ethical claim rests on precarious empirical assumptions. To conclude that destruction reduces suffering, one must assume that the average wild animal life is net negative—that suffering systematically outweighs welfare. This requires evidence not merely that predation or starvation occurs, but that the aggregate phenomenological experience of wild creatures is positive or negative. Establishing this requires robust indicators of welfare across species, such as behavioral preferences, stress hormone levels, and play behavior, rather than anthropomorphic projections. Currently, the evidence is mixed and species-specific. Without conclusive data showing that wild lives are predominantly miserable, the presumption that non-existence is preferable remains speculative. If wild lives are net positive, destruction becomes a double harm: killing existing animals and preventing valuable future lives.

  Even if we could calculate individual welfare, adopting the "net welfare of an ecosystem" as a policy standard introduces conceptual errors. Ecosystems are not welfare subjects; they do not feel pain or pleasure. Treating an ecosystem as a single unit of moral concern commits a category mistake. Welfare resides in individuals, not systems. Consequently, any metric of "ecosystem welfare" is actually an aggregation of individual welfares. This aggregation faces severe hurdles due to heterogeneity. How does one weigh the suffering of a mouse against the welfare of a wolf? How does one compare the brief, high-intensity life of an insect against the long life of a mammal? Without a common currency of welfare or a justified weighting scheme, "net ecosystem welfare" is mathematically and morally undefined. It obscures the distribution of suffering rather than resolving it, potentially justifying the sacrifice of many individuals for a abstract systemic balance.

  Given these conceptual and empirical hurdles, conservation policy must operate under deep uncertainty regarding the sign of net wild animal welfare. Under such uncertainty, a precautionary approach is warranted. If we cannot know whether wild lives are net positive or negative, we should avoid interventions that irreversibly destroy capacity for welfare. Habitat destruction is a blunt instrument that eliminates the possibility of positive welfare entirely. Therefore, policy should favor maintaining habitat while exploring less destructive interventions that address suffering without eliminating populations.

  This leads to the comparison of interventions. Habitat destruction is dominated by alternative strategies on both the conservationist and suffering-reduction views. For the conservationist, destruction is inherently wrong due to biodiversity loss and harm to existing individuals. For the suffering-reductionist, destruction is inefficient and risky; it kills existing animals (increasing immediate suffering) and prevents future welfare that might be positive. Less destructive interventions, such as fertility control, vaccination, or targeted supplementation during famine, allow for the modulation of suffering without the finality of destruction. These interventions preserve the option value of future positive welfare while mitigating obvious sources of intense suffering. Thus, even if one accepts the goal of reducing wild suffering, habitat destruction is rarely the optimal tool. It fails to distinguish between existing and future harms, relies on unproven empirical claims about net negative welfare, misuses the concept of ecosystem agency, and ignores superior alternatives under uncertainty. Conservation policy should therefore reject destruction as a welfare tool, focusing instead on managing specific suffering mechanisms within preserved habitats.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 15 marks

  | Criterion | Marks | Description of First-Class Performance (A) | Characteristic Weakness of Second-Class Answers (B) |
  | :--- | :---: | :--- | :--- |
  | **1. Existing vs. Future Harm** | 5 | Explicitly separates harm to existing individuals from the non-identity problem of future beings; explains why the suffering-reduction claim collapses without the future-life premise. | Conflates killing existing animals with preventing future suffering, or fails to explain why the reduction claim depends on non-existence. |
  | **2. Empirical Assumptions** | 5 | Identifies the need for net-negative welfare data across populations; specifies types of evidence (behavioral, physiological) required to verify the claim. | Asserts wild life is "miserable" or "good" as a premise without discussing the evidentiary burden or distribution of welfare. |
  | **3. Ecosystem Welfare Critique** | 5 | Argues that ecosystems lack sentience and highlights the aggregation problem across heterogeneous species/life stages as a fatal flaw for the standard. | Treats "ecosystem welfare" as a coherent concept or critiques it only on ecological grounds rather than welfare aggregation grounds. |
  | **4. Policy Under Uncertainty** | 5 | Takes a clear position on decision-making under uncertainty (e.g., precautionary principle) and links it to the risk of eliminating positive welfare. | Vaguely suggests "more research is needed" without committing to a policy stance or addressing the risk of irreversible loss. |
  | **5. Alternative Interventions** | 5 | Argues that less destructive interventions (e.g., fertility control) dominate destruction on both ethical views, rendering destruction suboptimal. | Fails to compare destruction with alternatives, or assumes destruction is the only way to impact wild welfare. |
