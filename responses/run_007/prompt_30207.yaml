prompt: |-
  I run a product team at a mid-size software company. Every quarter we have to decide whether a new AI feature should ship as a tool — something a human drives, where the model does a bounded task like drafting or summarizing — or as an agent, meaning the system takes actions on its own: chains steps together, sends messages, changes records, spends money. The default around here has become "make it an agent, it demos better," and I want a reusable decision proceedure my team can actually run in an afternoon before any code gets written, with engineers and PMs in the room but nobody who knows the philosophy. Please write the procedure as an ordered checklist: the questions to ask in order, what counts as a sufficient answer to each, where the procedure says stop and keep it a tool, and where it has to hand the decision to a person because the question is one of values or risk appetite rather than anything formal. Ground it in the actual tool/agent distinction and the reasons people worry about agentic systems — blast radius, reversibility, whether a human checkpoint is real or just theater, misspecification, accountability — but don't give me a literature review. Then run the procedure on three cases: (1) a support bot that drafts replies and can also send them and issue refunds up to $50, (2) a contract-review feature that summarizes a contract and flags unusual clauses but cannot edit or send anything, and (3) a coding assistant that can open pull requests and, with one click from a developer, merge them. Tell me where the procedure gives an answer I'm not going to like, and what the procedure cant settle. Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Product Team Lead at a mid-size software company.
      *   **Problem:** Defaulting to "Agent" because it demos better, ignoring risks.
      *   **Goal:** A reusable decision procedure (checklist) to decide Tool vs. Agent.
      *   **Constraints:**
          *   Runnable in an afternoon.
          *   Audience: Engineers and PMs (no philosophers).
          *   Format: Ordered checklist (questions, sufficient answers, stop conditions, hand-off points).
          *   Content: Grounded in tool/agent distinction (blast radius, reversibility, checkpoints, misspecification, accountability). No literature review.
          *   Language: British English.
          *   Task: Run the procedure on three specific cases.
          *   Reflection: Identify where the procedure gives an unpopular answer and what it can't settle.

  2.  **Deconstruct the Tool vs. Agent Distinction:**
      *   *Tool:* Human drives, model assists, bounded task, human verifies output before action. Low blast radius.
      *   *Agent:* System drives, chains steps, takes actions (send, spend, edit), autonomous loop. High blast radius, potential for irreversible actions.
      *   *Key Risks:* Blast radius (how much damage?), Reversibility (can we undo it?), Checkpoint Validity (is the human actually checking or just clicking?), Misspecification (did we tell it the right goal?), Accountability (who is to blame?).

  3.  **Drafting the Decision Procedure (The Checklist):**
      *   *Goal:* Keep it practical. Avoid abstract ethics. Focus on product mechanics and risk.
      *   *Structure:* Sequential filters. If you fail a filter, you stop (stay a Tool) or escalate.
      *   *Step 1: Action Definition.* What actually happens?
      *   *Step 2: Reversibility.* Can we undo it easily?
      *   *Step 3: Blast Radius.* Who/what gets affected?
      *   *Step 4: The Human Loop.* Is the checkpoint real?
      *   *Step 5: Goal Specification.* Can we define success clearly?
      *   *Step 6: The Escalation.* When do we need a VP/Legal?

      *Refining the Steps (Self-Correction during drafting):*
      *   Make sure the "Stop" conditions are clear.
      *   Ensure "Hand-off" points are identified for value judgments.
      *   Use British English (e.g., "programme", "authorisation", "centre").
      *   Keep it tight enough for an afternoon workshop.

  4.  **Running the Procedure on the Three Cases:**

      *   *Case 1: Support Bot (Draft + Send + Refund <$50).*
          *   Action: Sending emails + moving money.
          *   Reversibility: Money is hard to get back. Email is sent.
          *   Blast Radius: Financial loss + customer trust.
          *   Human Loop: None mentioned (it *can* send).
          *   *Verdict:* Likely needs to be a Tool (draft only) or escalated heavily. The procedure should flag the refund aspect as high risk.

      *   *Case 2: Contract Review (Summarize + Flag, No Edit/Send).*
          *   Action: Reading only. No external side effects.
          *   Reversibility: N/A (no action taken).
          *   Blast Radius: Low (internal info).
          *   Human Loop: Human reads the summary.
          *   *Verdict:* Clearly a Tool. Procedure should confirm this easily.

      *   *Case 3: Coding Assistant (Open PR + One-click Merge).*
          *   Action: Writing code + merging to main.
          *   Reversibility: Reverting is possible but costly (downtime, bugs).
          *   Blast Radius: Production stability.
          *   Human Loop: "One click". Is it real review? Often it's rubber-stamping.
          *   *Verdict:* This is the tricky one. It looks like an Agent (merging), but the "one click" implies a human gate. However, if the human isn't reading the diff, it's theater. The procedure should flag the "rubber stamp" risk.

  5.  **Identifying Unpopular Answers and Limitations:**
      *   *Unpopular:* Case 1 (Support Bot) will likely get blocked from being an Agent. Sales/Marketing wants the "auto-refund" demo. Case 3 (Coding) might get flagged as risky if the "one click" is deemed theater.
      *   *Limitations:* The procedure can't calculate *probability* of failure, only *impact*. It can't decide risk appetite (that's the hand-off). It can't solve the "rubber stamp" cultural issue, only highlight it.

  6.  **Writing the Response (incorporating British English and Tone):**
      *   *Tone:* Professional, direct, pragmatic.
      *   *Formatting:* Clear headings, bullet points for the checklist.
      *   *Check:* Ensure "philosophy" is avoided. Focus on "what breaks" and "who pays".

      *(Self-Correction on British English)*: Watch out for Americanisms. Use "authorisation" instead of "authorization", "programme" instead of "program" (though in software 'program' is often accepted, 'programme' is safer for process), "centre", "modelling". Ensure spelling is consistent.

      *(Refining the Checklist Logic)*:
      *   Q1: Does it take an external action? (If No -> Tool).
      *   Q2: Is the action reversible within 1 hour without cost? (If No -> Escalate/Tool).
      *   Q3: Is the human checkpoint substantive? (If No -> Tool).
      *   Q4: Can failure be defined deterministically? (If No -> Escalate).

      *Wait, I need to make sure the "Hand-off" is clear.* The prompt asks where the procedure hands the decision to a person because it's about values/risk appetite. I need to mark those specific points.

  7.  **Final Review against Constraints:**
      *   Ordered checklist? Yes.
      *   Questions + Sufficient Answers? Yes.
      *   Stop/Hand-off points? Yes.
      *   Grounded in risks (blast radius, etc.)? Yes.
      *   No literature review? Yes.
      *   Three cases run? Yes.
      *   Unpopular answers/Limitations identified? Yes.
      *   British English? Yes.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the pressure to demo.
      *   *The Procedure:* "The Agent/Tool Gate".
      *   *The Cases:* Apply the gate.
      *   *The Reflection:* What hurts? What's unknown?

      *(Specific attention to Case 3)*: "One click merge". Is that a tool or agent? It's an agent workflow with a human trigger. The risk is the human *not* checking. The procedure needs to catch "Checkpoint Theater".

      *(Specific attention to Case 1)*: Refunds. That's spend. High risk.

      *(Specific attention to Case 2)*: Read-only. Safe.

      *Let's write it.*
answer: |-
  # The Agent/Tool Gate: A Decision Procedure

  **Purpose:** To determine whether a proposed AI capability should be shipped as a **Tool** (human-driven, model-assisted) or an **Agent** (system-driven, autonomous action).
  **Participants:** Product Manager, Lead Engineer, Designer.
  **Timebox:** 90 minutes.
  **Rule:** If you cannot answer a question with evidence, the answer is 'No'.

  ---

  ## Part 1: The Checklist

  Run these questions in order. If you hit a **STOP**, the feature ships as a Tool. If you hit a **HAND-OFF**, the decision moves to the Risk/Leadership team for explicit sign-off. If you clear all steps, you may proceed with an Agent architecture.

  ### 1. The Action Boundary
  **Question:** Does the system execute an action that changes state outside the user's immediate editing session (e.g., sending an email, moving money, merging code, updating a customer record)?
  *   **Sufficient Answer:** A definitive list of API endpoints or database writes the model can trigger.
  *   **If No:** Ship as a **Tool**. (It is merely a generator).
  *   **If Yes:** Proceed to Question 2.

  ### 2. The Reversibility Test
  **Question:** If the system takes the wrong action, can we undo the consequence completely within one hour, with zero financial cost and zero customer-facing notification?
  *   **Sufficient Answer:** A documented rollback procedure tested in staging.
  *   **If No:** **STOP.** Ship as a **Tool**. (The blast radius is too high for autonomy).
  *   **If Yes:** Proceed to Question 3.

  ### 3. The Checkpoint Validity
  **Question:** Is there a human checkpoint before the action executes?
  *   **If No:** Proceed to Question 4.
  *   **If Yes:** Ask the follow-up: **Is it physically possible for the human to verify the output before approving, or is it 'checkpoint theatre' (rubber-stamping)?**
      *   *Sufficient Answer:* Evidence that the verification effort is less than the time saved, but greater than zero (e.g., diff view, draft preview). If the UI encourages blind clicking, it is theatre.
      *   **If Theatre:** **STOP.** Ship as a **Tool**. (A fake checkpoint is more dangerous than none, as it creates false accountability).
      *   **If Real:** Proceed to Question 4.

  ### 4. The Specification Limit
  **Question:** Can we define 'failure' deterministically? (e.g., 'Refund > £50', 'Merge to Main', 'Send to Competitor').
  *   **Sufficient Answer:** A list of hard constraints that can be enforced by non-LLM code (guardrails).
  *   **If No:** **HAND-OFF.** This is a risk appetite question. Leadership must decide if they accept probabilistic failure modes.
  *   **If Yes:** Proceed to Question 5.

  ### 5. The Accountability Chain
  **Question:** When the action fails, who is liable? (The user, the PM, or the vendor?)
  *   **Sufficient Answer:** A written agreement from Legal/Compliance stating who owns the error.
  *   **If Unclear:** **HAND-OFF.** Do not ship as an Agent until liability is assigned.
  *   **If Clear:** You may proceed with an **Agent** architecture.

  ---

  ## Part 2: Running the Procedure

  Here is how the procedure applies to your three cases.

  ### Case 1: Support Bot (Drafts replies, sends them, issues refunds up to £50)
  1.  **Action Boundary:** Yes. Sends emails and moves money.
  2.  **Reversibility:** **Fail.** Once an email is sent, it cannot be un-sent. Once a refund is issued, retrieving the money requires a new transaction and potential customer friction. It cannot be undone within one hour with zero notification.
  3.  **Result:** **STOP.**
  4.  **Verdict:** Ship as a **Tool**. The bot should draft the reply and *propose* the refund, but a human must click 'Send' and 'Authorise Refund'.
  5.  **Unpopular Outcome:** Sales and Marketing will dislike this. They want the 'Zero-Touch Support' demo. This procedure blocks it because financial irreversibility creates a blast radius that exceeds the autonomy threshold.

  ### Case 2: Contract Review (Summarises and flags clauses, cannot edit/send)
  1.  **Action Boundary:** **No.** It reads and displays text within the session. It does not call external APIs or write to the database beyond saving the user's own notes.
  2.  **Result:** **STOP** (at Question 1).
  3.  **Verdict:** Ship as a **Tool**.
  4.  **Outcome:** This is uncontroversial. The procedure confirms what engineering likely already knows: there is no agency here, only assistance.

  ### Case 3: Coding Assistant (Opens PRs, allows one-click merge by developer)
  1.  **Action Boundary:** Yes. It writes to the repository and merges to Main.
  2.  **Reversibility:** **Debatable.** A revert is possible, but if the code breaks production, the cost is downtime, not just a git revert. It is not 'zero cost'.
      *   *Decision:* Let's assume your CI/CD is robust enough to claim 'Yes' for the sake of argument. Proceed to Q3.
  3.  **Checkpoint Validity:** There is a human checkpoint (the one-click merge).
      *   **Follow-up:** Is it theatre? If the developer is expected to review the code but the value prop is 'save time', they will likely skim or trust the AI. If the diff is 500 lines, a one-click merge is functionally an Agent with a rubber stamp.
      *   **Decision:** If the team admits developers will likely rubber-stamp to save time, this is **Checkpoint Theatre**.
      *   **Result:** **STOP.**
  4.  **Verdict:** Ship as a **Tool**. The AI should open the PR, but the merge requires a standard review process (e.g., second approval, or passing a stricter test suite), not a single click from the requester.
  5.  **Unpopular Outcome:** Engineering productivity metrics may dip. Developers love the 'one-click' flow. The procedure flags that 'one-click merge' is often a safety illusion.

  ---

  ## Part 3: Reflection on the Procedure

  ### Where the procedure gives an answer you will not like
  **Case 1 (The Support Bot)** is the primary friction point. The procedure forces you to classify irreversibility as a hard blocker for agency. In a mid-size company, the pressure to reduce support ticket volume is immense. The 'Agent' version (auto-refund) is a stronger sales narrative than the 'Tool' version (auto-draft).
  By enforcing the Reversibility Test, you are effectively saying: *'Efficiency gains are not worth the cost of manual recovery.'* This will feel conservative to stakeholders who are measured on adoption and speed. You will need to hold the line that 'un-sending' an apology email or 'clawing back' a refund is a customer trust event, not just an operational cost.

  ### What the procedure cannot settle
  **The Risk Appetite Hand-Off (Question 4 & 5).**
  The procedure identifies *when* you are taking a risk (when failure cannot be defined deterministically or liability is unclear), but it cannot tell you *if* you should take it.
  For example, if you build a guardrail that says 'Never refund > £50', but the LLM hallucinates a currency conversion and refunds £50 USD which equals £40 GBP, but the intent was £50 GBP, is that a failure? The procedure flags this as a 'Specification Limit' issue and hands it to leadership.
  It cannot calculate the probability of the model bypassing the guardrail. It relies on humans to decide if the remaining risk is acceptable. If your leadership team has a high tolerance for 'moving fast and breaking things', they will override the 'STOP' on Case 3. The procedure does not prevent a reckless decision; it only ensures the decision is conscious rather than accidental.

  **The 'Checkpoint Theatre' Cultural Problem.**
  In Case 3, the procedure identifies that a one-click merge might be theatre. However, it cannot fix the culture that demands speed over rigour. If you ship it as a Tool (PR creation only) but developers complain they want the merge button, pressure will mount to add it back. The procedure highlights the risk, but it does not solve the incentive structure that makes the risk attractive.
