answer: |-
  - **Closest existing concepts**

  The phenomenon you describe resonates strongly with Bernard Williams's critique of utilitarianism, specifically his concept of **"One Thought Too Many."** In *Persons, Character, and Morality*, Williams argues that if a man saves his wife from drowning, he should not first calculate that it is permissible because she is his wife; he should simply act because she is his wife. Introducing an impartial moral calculation introduces a alienating distance between the agent and their commitment.

  Secondly, this relates to Michael Stocker's **"Moral Schizophrenia."** Stocker argues that modern ethical theories create a split between the motives that actually move us (love, friendship) and the justifications required to validate those actions (duty, utility). This creates a psychological disconnect where the agent's lived experience is at odds with their moral reasoning.

  Finally, the distinction between **agent-relative and agent-neutral reasons** provides the structural vocabulary for this debate. Agent-relative reasons (e.g., "she is *my* mother") are binding only on specific agents, while agent-neutral reasons (e.g., "maximize well-being") apply to everyone. Your scenario highlights the tension when an agent-relative action is forced into an agent-neutral justificatory framework.

  - **How my phenomenon differs**

  While Williams's "One Thought Too Many" is the closest ancestor, your phenomenon is distinct in its focus on *articulation* rather than *deliberation*. Williams critiques the internal thought process during the action; you are critiquing the post-hoc explanation given to others. The failure isn't necessarily that they calculated before acting, but that they feel compelled to *translate* the personal into the universal to make it intelligible or legitimate. The corruption lies in the communicative act, implying the personal reason wasn't sufficient currency in the moral marketplace.

  Stocker's "Schizophrenia" describes a structural split between motive and justification, but it doesn't necessarily condemn the justification itself as a relational failure. Your case suggests the justification is *performatively self-defeating*: by offering an impartial reason, the agent signals that the personal bond lacks intrinsic normative weight. It is not just a split, but a betrayal.

  Lastly, the agent-relative/neutral distinction is a taxonomy, not a critique. It categorizes reasons but doesn't explain why translating one into the other is a moral error. Your phenomenon identifies a specific pathology within that translation: the implication that personal commitments require impartial ratification to be valid.

  - **Best fit and name**

  Bernard Williams's framework is the strongest philosophical anchor, but it requires refinement to cover the communicative aspect you identified. The phenomenon deserves the name **"Justificatory Alienation."**

  **Definition:** Justificatory Alienation occurs when an agent validates a action grounded in partial commitment (love, friendship) by appealing to impartial principles, thereby implicitly denying the self-sufficiency of that commitment. Unlike Williams's "One Thought Too Many," which focuses on the hesitation in deliberation, Justificatory Alienation focuses on the *retrospective framing* of the act. It marks a failure of integrity where the agent seeks external legitimacy for an internal good, signaling that the relationship itself is not a ultimate source of value. The moral failure is not the action, but the admission that the action requires universal endorsement to be righteous.

  - **Boundary cases and edge questions**

  The boundaries of Justificatory Alienation blur when agents occupy dual roles. If a judge saves their spouse, impartial justification is required because their public role demands it; here, the translation is a duty, not an alienation. The phenomenon applies primarily to private spheres where impartiality is not a structural requirement.

  Another edge case involves sincerity. If an agent genuinely believes their love *is* derived from an impartial principle (e.g., a religious believer seeing all humans as children of God), is it alienation? If the impartial principle is the actual source of the motivation, the justification is honest. Justificatory Alienation specifically targets the *mismatch* where the motive is particular, but the justification is universal. Finally, cultural context matters: in highly communal societies, explaining personal acts via communal good might reinforce rather than alienate the bond, suggesting this phenomenon is partly specific to liberal individualist moral frameworks.
