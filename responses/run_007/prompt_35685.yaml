  2.  **Deconstruct the Objections:**
      *   **Non-Identity Problem (NIP):** If the injustice (e.g., colonization, slavery) was a necessary condition for the existence of the current claimants (because their ancestors wouldn't have met otherwise), then the current claimants cannot claim they were harmed by the injustice, because without it, they wouldn't exist. To claim harm, one must be worse off than they would have been otherwise. But the alternative is non-existence.
      *   **Supersession Objection:** Even if injustice occurred (e.g., land theft), enough time has passed, demographics have changed, and current occupants rely on the land for their livelihoods. Returning the land would create new injustices. The original claim "supersedes" due to changing circumstances.

