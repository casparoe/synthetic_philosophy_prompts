prompt: |-
  I'm putting together a module on reparations for historical injustice and I want a case built to order. Construct a thought experiment where reparations are clearly owed even though both of the standard objections look like they apply at full force: (1) the non-identity problem, where the present claimants wouldnt exist had the original injustice not happened, and (2) the supersession objection, where the stolen thing is land that has since been legitimately settled and cant just be handed back. Constraints: realistic, no cartoon villains, the obligation has to be genuinely backward-looking (not just a general duty to fix current poverty), and the scenario itself should fit in one paragraph. After the scenario, walk me through why each objection initially looks fatal, then show me exactly why the case still supports reparations. Finish by telling me which feature of the case is doing the real work, what happens if you remove it, and how a defender of supersession would attack the case. Commit to a verdict: does the case actually work, or did you have to fudge one of the constraints?
