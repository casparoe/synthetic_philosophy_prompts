      *   Let's stick with the **Unjust Enrichment/Traceable Asset** model. It sidesteps NIP because the obligation lies with the *holder* of the stolen goods, not necessarily based on the specific identity of the victim, but on the continuity of the group.
      *   Wait, I need to commit to a verdict. Did I fudge? The NIP is notoriously difficult. If I rely on Unjust Enrichment, am I fudging the "backward-looking harm" constraint? The prompt says "obligation has to be genuinely backward-looking (not just a general duty to fix current poverty)." Unjust enrichment is backward-looking.
