      *   **NIP:** The claim isn't "we wouldn't exist." It's "we exist *without our inheritance*." The harm is the loss of the specific asset (gold), not the loss of the life they would have had. The identity of the *group* persists even if specific individuals differ. Or, more strongly, the unjust enrichment exists independently of the claimants' identity.
