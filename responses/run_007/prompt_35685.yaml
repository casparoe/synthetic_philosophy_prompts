answer: |-
  In 1890, the Republic of Meridia expropriated the fertile Delta region from the Kaelen people to establish a national capital, relocating the Kaelen to the arid Highlands where they survived as a distinct community; today, the Delta is densely inhabited by innocent citizens whose grandparents purchased plots legally, making land return impossible (supersession), and the current Kaelen claimants owe their specific existence to the displacement-induced marriage patterns that occurred in the Highlands (non-identity). However, during the expropriation, the state seized a specific, portable endowment of Kaelen gold reserves held in trust by their chiefs, deposited it into a sovereign wealth fund explicitly capitalized by that loot, and while the fund grew exponentially separate from the general budget, the Kaelen were legally barred from accessing any state wealth despite the fund comprising 40% of the current national revenue. The claim is not for the land or for existence, but for the divestment of the specific, traceable capital accumulation that remains distinct from the general economy and was derived solely from the initial expropriation.

  ### Analysis of the Objections

  **Why the Objections Look Fatal**
  The **Non-Identity Problem (NIP)** appears fatal because the current Kaelen claimants cannot claim they are "worse off" than they would have been without the injustice. Had the 1890 expropriation not occurred, the specific migration patterns in the Highlands would not have happened, their ancestors would not have met, and these specific claimants would not exist. Since existence is presumed better than non-existence, they cannot claim harm based on a counterfactual comparison. The **Supersession Objection** appears fatal because the original object of the injustice (the Delta land) is now occupied by innocent third parties who built lives there under legitimate legal expectations. Returning the land would violate the rights of the current residents, and the passage of time is thought to dilute the original claim until it vanishes.

  **Why the Case Still Supports Reparations**
  This case bypasses both objections by shifting the normative basis from *compensation for harm* to *disgorgement of unjust enrichment*. The NIP applies to welfare comparisons (harm), but not to property entitlements. Just as an heir inherits a stolen watch even if the theft altered their family's history, the Kaelen inherit the title to the gold regardless of whether the injustice caused their existence; the obligation lies in the state holding property it does not own, not in the specific welfare state of the claimants. The Supersession Objection applies to *land use* and conflicting occupancy rights, but it does not apply to liquid assets held in a sovereign vault. The state can repay the value of the gold without displacing the innocent settlers in the Delta, satisfying the original claim without creating new injustices.

  ### The Key Feature and Vulnerabilities

  **The Real Work:**
  The feature doing the heavy lifting is the **persistence of the traceable asset**. The obligation holds because the stolen value (the gold) was not consumed or dissipated into the general economy but was preserved and identified as a distinct fund.

  **If You Remove It:**
  If the state had spent the gold on immediate consumption (e.g., paying soldiers' salaries or building roads that subsequently decayed), the traceability would vanish. The claim would then collapse into a general demand for poverty alleviation (forward-looking) or a claim against current taxpayers for dissipated harms (vulnerable to both NIP and Supersession), failing the "backward-looking" constraint.

  **The Supersession Defender's Attack:**
  A defender of supersession would argue that the fund's growth wasn't passive; it resulted from the labor and investment decisions of Meridia's citizens (including the innocent settlers) over the last century. They would claim that the current value is a mix of the original stolen principal and the legitimate productivity of the current population, meaning full disgorgement would unjustly enrich the Kaelen at the expense of the settlers' labor.

  ### Verdict

  **The case works, but with a philosophical caveat.**
  I did not fudge the constraints, but I did shift the ground. The case succeeds because it relies on **Unjust Enrichment** rather than **Harm-Based Compensation**. The Non-Identity Problem is generally considered undefeated for harm-based claims (you cannot be harmed by being caused to exist). By framing the obligation as a property right transmission (the gold belongs to the Kaelen *group* continuously) rather than a compensation for individual welfare loss, the NIP is rendered irrelevant rather than solved. If you insist the obligation must be based on *harm to the specific claimants*, the case fails; if you accept *restoration of property rights* as a valid form of backward-looking reparations, the case holds.
