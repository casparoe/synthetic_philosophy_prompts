answer: |-
  # The Price of Rationality: Counterfactual Mugging and XOR Blackmail

  Decision theory attempts to formalize the notion of rational choice. Classically, this has meant choosing the action that causally brings about the best expected outcome. However, a class of problems known as "Newcomblike problems" challenges this causal orthodoxy. In these scenarios, an agent's payoff is tied to a prediction of their behavior or a logical correlation rather than a direct causal consequence. Two prominent examples are the Counterfactual Mugging and the XOR Blackmail. In both, a perfectly predicting agent, Omega, structures a situation where the agent's choice appears to have no causal power over the outcome, yet paying up seems to correlate with a better world state.

  This essay evaluates whether a rational agent should pay in these scenarios. It examines the verdicts of Causal Decision Theory (CDT), Evidential Decision Theory (EDT), and Updateless Decision Theory (UDT). While there is settled agreement on how these theories *calculate* the choices, there is profound contestation regarding which theory correctly defines *rationality*. Ultimately, I argue that if rationality is defined by the success of the agent's decision algorithm rather than local causal leverage, the agent should pay in both cases. However, this verdict rests on philosophical premises that remain actively disputed in the field.

  ### The Theoretical Landscape

  To analyze these problems, we must distinguish between the settled mechanics of the decision theories and the contested normative claims about which theory is correct.

  It is **settled** among decision theorists that CDT, EDT, and UDT yield different recommendations in specific Newcomblike scenarios.
  *   **Causal Decision Theory (CDT)** advises agents to maximize utility based on the causal consequences of their actions. If an action does not causally influence an outcome, CDT ignores correlations with that outcome.
  *   **Evidential Decision Theory (EDT)** advises agents to maximize utility based on the evidence their action provides about the state of the world. It asks, "If I choose X, what is the probability of outcome Y?"
  *   **Updateless Decision Theory (UDT)** (and its cousin, Functional Decision Theory) advises agents to choose the output of a decision algorithm that would have maximized expected utility *before* the agent received specific observational information (i.e., from an "ex-ante" perspective).

  It is **contested** whether "rationality" requires adhering to causal leverage (CDT), managing news (EDT), or optimizing global policy (UDT). Mainstream economics and philosophy often default to CDT, while researchers in artificial intelligence alignment often advocate for UDT. There is no consensus on which framework is normatively superior.

  ### Counterfactual Mugging

  In the Counterfactual Mugging, Omega flips a fair coin. If Heads, Omega gives you $10,000 if it predicted you would pay $100 on Tails. If Tails, Omega asks for $100. You observe Tails.

  **The Causal and Evidential View (Don't Pay)**
  From the perspective of CDT, the verdict is clear and uncontroversial within the framework: do not pay. The coin has already landed Tails. The $10,000 reward in the Heads branch is determined by a prediction made in the past. Your current action of handing over $100 cannot causally reach back in time to change the coin flip or Omega's past prediction. Paying results in a certain loss of $100 with no causal benefit.

  Standard EDT generally agrees with CDT in this specific instance, though for a different reason. EDT relies on conditional probabilities. Once you observe that the coin is Tails, you update your beliefs. The probability of the coin being Heads is now zero. Therefore, your action provides no evidence regarding the Heads branch, because that branch is already ruled out by your observation. Consequently, EDT calculates that paying yields negative expected utility relative to refusing.

  **The Updateless View (Pay)**
  UDT challenges the move of updating on the observation "Tails." It argues that rationality should be evaluated from the perspective of the agent *before* the coin flip. Ex-ante, there is a 50% chance of Heads and 50% chance of Tails.
  *   Policy "Pay if Tails": Expected Value = (0.5 × $10,000) + (0.5 × -$100) = $4,950.
  *   Policy "Refuse if Tails": Expected Value = (0.5 × $0) + (0.5 × $0) = $0.

  UDT proponents argue that a rational agent is the implementation of a decision algorithm. Omega predicts the output of this algorithm. If the algorithm is "Refuse if Tails," Omega predicts this, and you get nothing. If the algorithm is "Pay if Tails," Omega predicts this, and you win big in the Heads world. UDT argues that observing "Tails" is indexical information that should not override the ex-ante optimal policy. To be rational is to be the kind of agent that wins, even if it means paying in a branch where the money is already lost.

  ### XOR Blackmail

  In XOR Blackmail, Omega sends a message: "You receive this iff (Termites XOR Pay)." Termites cost significantly more than the $1,000 blackmail demand. You receive the message.

  **The Causal View (Don't Pay)**
  CDT again advises refusing. The presence of termites is a physical fact about your house that is already settled. Your decision to pay Omega cannot causally exorcise the termites. If you have termites, you pay $1,000 and still have termites (wait—if you have termites, and you pay, do you get the message? Let's trace the logic: Message $\iff$ (Termites $\oplus$ Pay). If Termites=True and Pay=True, then XOR is False, so Message=False. But you *received* the message. Therefore, the state (Termites=True, Pay=True) is impossible given the message was received).
  Actually, CDT reasons simply: The state of the house is fixed. The message is already in your hand. Paying $1,000 is a loss of wealth with no causal mechanism to repair the house.

  **The Evidential View (Pay)**
  XOR Blackmail is a rare case where EDT diverges from CDT. Because you do not know whether you have termites, your action provides evidence about the state of the house.
  Given you received the message, we know (Termites $\oplus$ Pay) is True.
  *   If you Pay, then Termites must be False (to satisfy the XOR).
  *   If you Don't Pay, then Termites must be True.
  Therefore, choosing to Pay is perfect evidence that your house is safe. EDT recommends paying because the conditional expected utility of Paying (Cost $1,000, No Termites) is vastly superior to Not Paying (Cost $0, Huge Termite Damage).

  **The Updateless View (Pay)**
  UDT also recommends paying, but grounds it in policy optimization rather than evidence. Ex-ante, before the message is sent, you want to adopt a policy that ensures you live in a world where you don't have termites and don't pay, or have termites and don't pay? No, you want to adopt a policy that correlates your payment with the absence of termites.
  Omega's mechanism ensures that if your decision algorithm outputs "Pay upon receiving message," Omega will only send the message if there are no termites. If your algorithm outputs "Refuse," Omega sends the message only if there *are* termites. By committing to pay, you logically force the world into the "No Termites" branch. UDT agrees with EDT on the action but disagrees on the reasoning: you are not merely managing news; you are controlling the logical output that determines which world state is compatible with your existence in the scenario.

  ### Comparison and Verdict

  Do these two cases call for the same answer?
  *   **CDT** says **No** to both.
  *   **UDT** says **Yes** to both.
  *   **EDT** says **No** to Mugging, but **Yes** to Blackmail.

  This divergence highlights a critical instability in EDT. In the Mugging, EDT updates on the coin flip and loses the benefit of the correlation. In the Blackmail, EDT cannot update on the termite status (it is unknown) and thus captures the correlation. UDT is consistent across both: it treats the observation of the coin flip and the observation of the message as information that should not disrupt the ex-ante optimal policy.

  **The Verdict**
  I argue that the rational agent should **pay in both cases**. This verdict aligns with UDT. The justification rests on the principle that rationality should be defined by the success of the agent's decision-making procedure, not merely by local causal leverage. In both scenarios, the agent is interacting with a predictor (Omega) that rewards specific decision algorithms. An agent that refuses to pay is an agent that Omega predicts will refuse, resulting in a world with $0 (Mugging) or Termites (Blackmail). An agent that pays is an agent that Omega predicts will pay, resulting in a world with $10,000 (Mugging) or No Termites (Blackmail).

  To refuse payment is to suffer from "time inconsistency": preferring to be a payer before the event, but a refuser after the event. A rational agent should resolve this inconsistency by binding themselves to the policy that maximizes ex-ante expected utility.

  **Settled vs. Contested**
  It is vital to distinguish what is settled from what is contested in reaching this verdict.
  *   **Settled:** It is an objective fact that an agent using CDT will end up with less money and more termites in these specific setups than an agent using UDT. It is also settled that CDT agents are "dynamically inconsistent" in the Mugging case (they would pay for a pre-commitment device before the flip, but discard it after).
  *   **Contested:** It is **not** settled that "winning" is the sole criterion for rationality. Critics of UDT argue that paying in the Mugging is irrational because it involves paying for a benefit that is causally impossible to obtain *at the time of decision*. They argue that rationality is about making the best choice given the current state of the world, not optimizing a hypothetical algorithm from the past. Furthermore, the coherence of "logical counterfactuals" (the math underlying UDT's ability to say "If I output Pay, then Omega predicted Pay") is a subject of ongoing technical debate.

  ### Conclusion

  In both Counterfactual Mugging and XOR Blackmail, the causal consequences of paying are nil. However, the logical correlations are profound. Causal Decision Theory, the standard of classical rationality, dictates refusing payment in both cases, prioritizing causal leverage over correlation. Evidential Decision Theory splits, capturing the correlation in Blackmail but missing it in Mugging. Updateless Decision Theory captures the correlation in both by prioritizing ex-ante policy optimization.

  While there is no consensus in the broader philosophical community that UDT is the correct normative theory, the pragmatic superiority of the UDT agent in these environments is clear. If rationality entails designing an agent that succeeds in a world containing predictors and logical correlations, then the rational verdict is to pay. However, this conclusion remains contingent on accepting the contested premise that an agent's rationality is determined by the global performance of its decision algorithm rather than the local causal efficacy of its immediate actions. Until the field resolves the debate over the definition of rational agency, the "correct" choice remains a matter of theoretical allegiance.
