prompt: |-
  I host a small science-and-ideas podcast and next week I'm interviewing an economist whose spent her whole career defending the revealed-preference line on utility: utility isn't some internal quantity of satisfaction, it's just a numerical shorthand for a pattern in what people choose. I don't want her to restate the position, I want to actually stress-test it. Draft eight to ten questions that go past the intro-level stuff. At least one each on: the tautology worry (if utility is just whatever someone maximizes, then "people maximize utility" doesn't say anything), menu dependence and the weak axiom of revealed preference (how much damage do violations like the decoy effect really do), whether the view can underwrite welfare economics at all (if choice reveals preference, can a policy ever make someone worse off than they chose to be?), and preference reversals from the experimental literature. For each question, include the follow-up I should ask assuming she gives the standard economist's reply. End with a question she can't bat away with "that's just noise" or "people make mistakes." And no "what drew you to economics" filler.
