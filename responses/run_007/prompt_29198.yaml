answer: |-
  Here are ten questions designed to stress-test the revealed-preference framework, moving from methodological concerns to normative implications. Each includes a follow-up tailored to the standard defenses an economist will likely offer.

  ### 1. The Tautology of Rationalization
  **Question:** "Critics often argue that revealed preference theory risks becoming unfalsifiable. If every observed choice can be rationalized by imputing a specific preference or adding a constraint post-hoc, doesn't the statement 'agents maximize utility' lose its predictive power? At what point does 'rationalizing' data become indistinguishable from 'explaining' it?"

  **Follow-up (if she says it's just a modeling assumption):** "If it's purely an *as-if* model, we need to know the boundary conditions. When the cost of adding ad-hoc constraints to save the theory exceeds the cost of assuming a cognitive bias, do you stick with the preference model, or do you concede the mechanism is psychological, not preferential?"

  ### 2. Menu Dependence and WARP
  **Question:** "The Weak Axiom of Revealed Preference assumes that if I choose A over B, adding a third option C shouldn't make me switch to B. Yet, the 'decoy effect' shows this happens systematically. If the *set* of options determines the choice, isn't the preference located in the environment rather than the agent? How can utility be a stable property of the person if it fluctuates with the menu?"

  **Follow-up (if she says violations are rare or small):** "Even if the magnitude is small, the *existence* of the violation breaks the transitivity required for a utility function. If the math doesn't hold, can we still use calculus to optimize policy, or are we essentially doing physics with friction but pretending it's a vacuum?"

  ### 3. Welfare Economics and Paternalism
  **Question:** "If utility is defined strictly by choice, then by definition, a person is never made 'worse off' by a choice they voluntarily made. This seems to make normative welfare economics impossible. How can you justify *any* policy intervention—from seatbelt laws to sin taxes—without implicitly admitting that people sometimes choose things that lower their actual well-being?"

  **Follow-up (if she argues we respect 'long-run' choices):** "But the 'long-run self' is also just a series of choices. If the long-run self chooses to restrict the short-run self, that's just one preference battling another. Without an external metric of well-being (like health or happiness), how do you decide which self's revealed preference counts as 'welfare'?"

  ### 4. Preference Reversals (Choice vs. Pricing)
  **Question:** "Experimental literature shows robust preference reversals where people *choose* Gamble A over B, but *price* Gamble B higher than A. If utility is revealed by choice, pricing is noise. But in markets, pricing *is* the choice. Why should the motor action of choosing a lottery ticket reveal 'true' utility more than the motor action of writing down a dollar value?"

  **Follow-up (if she says pricing tasks are cognitively harder):** "If the elicitation method changes the revelation, then utility isn't a pre-existing state we are uncovering; it's constructed by the question. If preferences are constructed, isn't the economist's job to study the construction process (psychology) rather than mapping the output (choice)?"

  ### 5. Risk and the Allais Paradox
  **Question:** "Under expected utility theory, preferences should remain consistent regardless of how probabilities are scaled. The Allais Paradox shows they aren't. Defenders of revealed preference often treat this as a violation of axioms, but isn't it more accurate to say people value 'certainty' as a distinct good? If so, doesn't that require expanding the definition of utility to include psychological states, which you generally resist?"

  **Follow-up (if she says people misunderstand probabilities):** "If we have to assume people misunderstand probabilities to make the model fit, aren't we smuggling cognitive limitations back into the model? At what point does 'misunderstanding probability' become indistinguishable from 'having a non-expected utility preference'?"

  ### 6. Time Inconsistency and Hyperbolic Discounting
  **Question:** "People systematically discount the near future more heavily than the far future (hyperbolic discounting). This leads to dynamic inconsistency. If I reveal a preference for saving in January, but spending in February, which choice reveals my 'true' utility? If you say both, then I am simultaneously maximizing and not maximizing, which is logically impossible."

  **Follow-up (if she says we model this as multiple 'selves'):** "If we model a person as a sequence of different agents over time, the concept of individual welfare collapses. How do you run a cost-benefit analysis for a policy that helps the 'future self' at the expense of the 'present self' if there is no single 'individual' to hold the utility function?"

  ### 7. Neuroeconomics and Internal States
  **Question:** "Neuroeconomics can now measure dopamine responses and neural correlates of satisfaction. In cases of addiction, neural data often shows high 'wanting' but low 'liking,' or vice versa. If brain data contradicts the revealed choice (e.g., an addict choosing to use while expressing regret), why do you privilege the motor action of the hand over the neural signal of the brain as the true measure of utility?"

  **Follow-up (if she says neural data isn't normative):** "Choice isn't normative either; it's just data. If we have two data streams—hand movement and neural firing—and they conflict, why is the hand movement the 'gold standard' for welfare? Is that a scientific finding or just a philosophical commitment to behaviorism?"

  ### 8. Endogenous Preferences (The "Happy Slave")
  **Question:** "Preferences adapt to constraints. Oppressed groups or those in deprived conditions often report high satisfaction with their lot because they have adjusted their expectations. Revealed preference treats this as efficient satisfaction. Does your framework force you to conclude that a person who adapts their desires to oppression is 'better off' than someone who is frustrated by injustice? Is there a conservative bias built into the theory?"

  **Follow-up (if she says we can't compare utility across people):** "We aren't comparing across people; we are comparing the same person under different information or freedom conditions. If the theory cannot distinguish between 'satisfied' and 'resigned,' isn't it blind to the most important changes in human welfare?"

  ### 9. Information and Fraud
  **Question:** "If I buy a car believing it has a working engine, but the seller lied and it doesn't, revealed preference says I preferred that car at that price. But the law treats this as fraud and voids the contract. Your theory says I got what I wanted; the legal system says I was harmed. How do you reconcile the economic definition of 'harm' with the legal/moral one without admitting that 'informed choice' matters more than 'choice'?"

  **Follow-up (if she says information is just a constraint):** "If information is just a constraint, then a well-informed victim and a deceived victim have different constraints but the same preference structure. But policy treats the deception as the harm. Doesn't this imply that the *process* of choosing matters normatively, not just the *outcome* of the choice?"

  ### 10. The "Killer" Question: Algorithmic Manipulation
  **Question:** "Modern platforms use A/B testing and algorithms to engineer choice architectures that exploit known cognitive biases to maximize engagement or sales (dark patterns). These aren't random errors; they are systematic, profit-driven manipulations of revealed preference. If firms can predictably engineer the choices you claim reveal my 'true' preferences, doesn't that render the concept of 'consumer sovereignty' a fiction? And if sovereignty is a fiction, what is left of the argument that free markets lead to efficient outcomes?"

  **Follow-up (if she says consumers will learn or switch platforms):** "Switching costs and network effects are part of the engineered architecture. If the market equilibrium is one where firms profit by exploiting cognitive bugs rather than satisfying genuine needs, and your theory defines that exploitation as 'satisfaction,' isn't the theory actively obscuring the mechanism of market failure rather than explaining it?"
