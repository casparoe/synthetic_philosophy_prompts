prompt: |-
  I'm a science journalist, most of my beat is AI and the people making claims about it. Every week I get pitched some version of "our model beat the benchmark" or "superhuman performance on X," and I have maybe twenty-five minutes before my editor wants to know whether we're running it. Getting it wrong means we either hype a trick or bury a real story, and either way we burn trust with readers. I know just enough to know that Goodhart's law and the specification-gaming literature say a metric stops meaning what I think it means once a system is optimized against it. But I don't have a procedure I can actually run.

  So: write me a reusable screening procedure, a checklist in words, that I can run on any "model solved X" claim before I write it up. Ground it in what's actually known about Goodhart's law and specification gaming, but keep it usable by someone who is not a metrics expert and has to explain the call to an editor (the editor signs off). It should have the questions in the order I should ask them, what counts as a good enough answer to each, where the procedure stops with a no or a kill, and where it hands the decision to a person because its a judgment call (mine or the editor's). Be honest about the cases the procedure will miss or misfire on — I'd rather know the procedure's blind spots then feel falsely safe.

  Then run the procedure on three claims, and show me the actual output at each step, not just the conclusion:
  1. A company says its model passed the multiple-choice part of a bar exam at the 90th percentile of human test-takers.
  2. A lab says its reasoning model beats human averages on a public benchmark, but I've heard a rumor that the scores collapse when the answer order is shuffled.
  3. A hospital group says its imaging model "matches board-certified radiologists" at spotting pneumonia on chest X-rays, with an AUC of 0.98 on a big public dataset.

  I should say up front: the third one is a story I'd really like to write. If your procedure tells me to kill it or shrink the headline to something boring, say so and show me why.

  Last line: give me a one-sentence summary of the procedure's bottom line, starting with "Bottom line:".
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science journalist covering AI.
      *   **Problem:** Overwhelmed by "model beat benchmark" claims. Needs a quick (25 min), reliable screening procedure to avoid hype or missing real stories.
      *   **Constraints:**
          *   Grounded in Goodhart's Law and specification gaming literature.
          *   Usable by a non-expert (but explainable to an editor).
          *   Structured as a checklist/procedure with order, pass/fail criteria, and kill/hand-off points.
          *   Must acknowledge blind spots/limitations.
          *   Must apply the procedure to three specific claims (Bar exam, Shuffled benchmark, Medical imaging).
          *   Must be honest about the third claim (even if it's a desired story).
          *   **Final Constraint:** Last line must be a one-sentence summary starting with "Bottom line:".

  2.  **Deconstruct the Core Concepts:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." In AI, this means if you optimize for a benchmark, the model might learn the benchmark, not the underlying capability.
      *   **Specification Gaming:** The AI finds a shortcut to maximize the reward function without actually doing the intended task (e.g., memorizing answers, exploiting dataset artifacts).
      *   **Journalistic Context:** Needs speed, clarity, and defensibility. The "Kill" decision needs to be robust. The "Go" decision needs caveats.

  3.  **Drafting the Procedure (The "Goodhart Screen"):**
      *   *Goal:* Filter out gaming/overfitting from genuine capability.
      *   *Step 1: Data Contamination (The "Leak" Check).* Did the model see the test answers during training? This is the most common failure mode.
      *   *Step 2: Metric vs. Reality (The "Proxy" Check).* Does the metric actually measure the claim? (e.g., multiple choice vs. legal reasoning).
      *   *Step 3: Robustness (The "Perturbation" Check).* Does small changes break the performance? (e.g., shuffling answers, changing phrasing).
      *   *Step 4: Baseline Comparison (The "Trivial" Check).* Is it beating a smart human or a dumb script?
      *   *Step 5: Independent Verification (The "Replication" Check).* Has anyone else confirmed this?
      *   *Structure:* Question -> Good Answer -> Bad Answer -> Decision Point.

  4.  **Refining the Procedure for the User:**
      *   Make it actionable. "Ask for the technical report." "Check the dataset release date."
      *   Define the "Kill" zones clearly.
      *   Define the "Editor Hand-off" zones (where risk is high but newsworthy).
      *   Add the "Blind Spots" section explicitly as requested.

  5.  **Applying the Procedure to the Three Claims:**

      *   *Claim 1: Bar Exam 90th Percentile.*
          *   *Check 1 (Contamination):* Bar exam questions are public. High risk of training data leakage.
          *   *Check 2 (Metric):* Multiple choice isn't practicing law.
          *   *Verdict:* High risk of Goodhart. Needs heavy caveats or kill if contamination is confirmed.
      *   *Claim 2: Reasoning Benchmark + Shuffling Rumor.*
          *   *Check 1 (Robustness):* The rumor directly addresses specification gaming (positional bias).
          *   *Verdict:* If shuffling collapses scores, it's gaming. Kill or expose the gaming.
      *   *Claim 3: Medical Imaging (Pneumonia).*
          *   *Check 1 (Dataset):* "Big public dataset" (likely CheXpert or MIMIC).
          *   *Check 2 (Metric):* AUC 0.98 is suspiciously high.
          *   *Check 3 (Reality):* "Matches radiologists" usually means on *that* dataset, not in the wild.
          *   *Verdict:* This is the "desired story." The procedure must remain objective. High risk of dataset shift (hospital to hospital). Don't kill, but shrink headline.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, skeptical, pragmatic.
      *   *Formatting:* Clear headings, bullet points for the checklist.
      *   *The "Blind Spots":* Crucial. Acknowledge that this checklist can't catch *everything* (e.g., novel architectures that actually work, or subtle data leaks not yet public).
      *   *The Three Cases:* Walk through step-by-step as requested ("show me the actual output at each step").

  7.  **Reviewing against Constraints:**
      *   *25 minutes?* The checklist needs to be fast. Focus on public info/technical reports.
      *   *Goodhart grounded?* Yes, focusing on proxy measures and optimization targets.
      *   *Editor ready?* Yes, clear "Go/No-Go/Proceed with Caution" outputs.
      *   *Claim 3 Honesty:* Must not let desire bias the result. If AUC 0.98 on public data is suspicious, flag it.
      *   *Final Line:* "Bottom line: [Sentence]."

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "ask the company." Journalists often get stonewalled. Focus on what can be inferred from the press release/tech report.
      *   *Correction:* Ensure the "Medical" case doesn't get a free pass. 0.98 AUC on public data is a classic red flag for "learning the hospital ID" rather than pathology. I need to make sure the procedure catches that.
      *   *Correction:* Ensure the "Blind Spots" section is prominent.
      *   *Correction:* Check the final line constraint strictly.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  ### The Goodhart Screen: A 25-Minute AI Claim Triage Procedure

  This procedure is designed to detect **Specification Gaming** (the model optimizing for the metric rather than the task) and **Goodhart's Law** (the metric ceasing to be a valid proxy once targeted). It prioritizes speed and defensibility over deep technical audit.

  **Time Budget:** 25 Minutes
  **Inputs Needed:** Press release, link to technical report/paper, link to benchmark documentation.

  ---

  #### Step 1: The Contamination Check (Minutes 0–5)
  **Question:** Was the test data potentially present in the model's training set?
  *   **Why:** If the model memorized the answers, it hasn't learned the skill; it has learned the test. This is the most common form of Goodhart's Law in AI (optimizing for the specific instances rather than the general capability).
  *   **Good Answer:** The test data was created *after* the model's training cut-off date, or the dataset is private/hold-out (never public before evaluation).
  *   **Bad Answer:** The test data is public (e.g., MMLU, Bar Exam questions, CheXpert) and the training cut-off date is *after* the data was released online.
  *   **Decision:**
      *   If **Bad Answer**: **KILL** or downgrade to "Pattern Matching Story." Do not claim capability.
      *   If **Good Answer**: Proceed to Step 2.
      *   If **Unclear**: Proceed to Step 2, but mark "High Risk."

  #### Step 2: The Proxy Gap Check (Minutes 5–10)
  **Question:** Does the metric measure the *outcome* claimed, or just a *proxy* for it?
  *   **Why:** Specification gaming often occurs when the reward function (the metric) is easier to hack than the actual goal. (e.g., Passing a multiple-choice bar exam $\neq$ Practicing law).
  *   **Good Answer:** The evaluation involves open-ended generation, real-world deployment, or human expert review of *outputs* (not just answer keys).
  *   **Bad Answer:** The claim is about a real-world skill (diagnosis, legal counsel, coding), but the metric is multiple-choice accuracy or a static dataset score.
  *   **Decision:**
      *   If **Bad Answer**: **HAND-OFF TO EDITOR.** You can run the story, but the headline must restrict the claim to the metric (e.g., "Model Passes Test" not "Model Practices Law").
      *   If **Good Answer**: Proceed to Step 3.

  #### Step 3: The Robustness Check (Minutes 10–15)
  **Question:** Does performance hold up under trivial perturbations?
  *   **Why:** Models often exploit spurious correlations (e.g., answer length, position, specific keywords) rather than reasoning. If shuffling answers breaks the model, it was gaming the format.
  *   **Good Answer:** The authors report testing on shuffled variants, paraphrased questions, or out-of-distribution data, and performance remains stable.
  *   **Bad Answer:** No robustness testing reported, OR you have credible reports (leaks, tweets, peer review) that performance collapses on variants.
  *   **Decision:**
      *   If **Bad Answer**: **KILL.** This is confirmed specification gaming.
      *   If **Good Answer**: Proceed to Step 4.
      *   If **Unclear**: Proceed to Step 4, but mark "Unverified."

  #### Step 4: The Baseline Check (Minutes 15–20)
  **Question:** What is the model actually beating?
  *   **Why:** "Beating human average" is meaningless if the human average is untrained, or if the baseline is a trivial script.
  *   **Good Answer:** Comparison is against domain experts (board-certified, licensed) under similar constraints (time, information access).
  *   **Bad Answer:** Comparison is against "crowdsourced workers," "average internet users," or a weak baseline model.
  *   **Decision:**
      *   If **Bad Answer**: **DOWNGRADE.** Headline must reflect the weak baseline.
      *   If **Good Answer**: Proceed to Step 5.

  #### Step 5: The Distribution Shift Check (Minutes 20–25)
  **Question:** Will this work outside the lab?
  *   **Why:** AI models often learn dataset artifacts (e.g., "this hospital's X-ray machines produce this noise pattern") rather than the underlying phenomenon. This is Goodhart's Law in deployment.
  *   **Good Answer:** Tested on external data from different institutions/distributions not seen during training/validation.
  *   **Bad Answer:** Tested only on the public dataset it was likely tuned against.
  *   **Decision:**
      *   If **Bad Answer**: **HAND-OFF TO EDITOR.** Story is valid as "Lab Result," but headline cannot imply "Clinical Ready."
      *   If **Good Answer**: **GREEN LIGHT** (with standard caveats).

  ---

  ### Procedure Blind Spots (Read Before Using)
  1.  **The "Black Box" Problem:** I cannot verify training data contamination definitively without access to the model weights. I rely on company honesty regarding cut-off dates.
  2.  **The "Novelty" Trap:** If a new technique legitimately solves a benchmark without gaming, this procedure might flag it as suspicious because it lacks robustness checks (which take time to publish). You might kill a breakthrough because it's too new.
  3.  **The "Good Enough" False Negative:** A model might game a benchmark but still be useful in practice. This procedure protects *truth*, not *utility*.
  4.  **Resource Asymmetry:** Companies have weeks to prep these claims; you have 25 minutes. You are looking for red flags, not green lights. Absence of evidence is not evidence of absence.

  ---

  ### Procedure Run-Throughs

  #### Case 1: The Bar Exam Claim
  *Claim: Model passed multiple-choice bar exam at 90th percentile.*

  *   **Step 1 (Contamination):** Bar exam questions are public record. Training cut-off is likely after questions were published.
      *   *Result:* **Bad Answer.** (High risk of memorization).
  *   **Step 2 (Proxy Gap):** Claim implies legal competence. Metric is multiple-choice.
      *   *Result:* **Bad Answer.** (Proxy Gap).
  *   **Step 3 (Robustness):** No mention of shuffling or rephrasing legal hypotheticals.
      *   *Result:* **Unclear.**
  *   **Step 4 (Baseline):** Compares to human test-takers (likely appropriate baseline).
      *   *Result:* **Good Answer.**
  *   **Step 5 (Distribution):** N/A (Static test).
      *   *Result:* N/A.

  **Output Decision:** **KILL / DOWNGRADE.**
  **Reasoning:** Step 1 and Step 2 trigger immediate red flags. This is likely memorization of past questions, not legal reasoning.
  **Editor Note:** "We cannot run 'AI Passes Bar' as a capability story. Contamination risk is high because questions are public. We can run a 'Tech Company Claims Bar Pass' story, but headline must specify 'Multiple Choice' and mention 'Memorization Concerns.'"

  #### Case 2: The Shuffled Benchmark Rumor
  *Claim: Reasoning model beats human averages on public benchmark.*
  *Rumor: Scores collapse when answer order is shuffled.*

  *   **Step 1 (Contamination):** Public benchmark.
      *   *Result:* **High Risk.**
  *   **Step 2 (Proxy Gap):** Reasoning claim vs. Benchmark score.
      *   *Result:* **Bad Answer.** (Benchmark is a proxy).
  *   **Step 3 (Robustness):** Rumor indicates shuffling breaks the model.
      *   *Result:* **Bad Answer.** (Confirmed fragility).
  *   **Step 4 (Baseline):** Beats human average.
      *   *Result:* **Good Answer.**
  *   **Step 5 (Distribution):** N/A.
      *   *Result:* N/A.

  **Output Decision:** **KILL.**
  **Reasoning:** Step 3 is a hard kill. If shuffling answers collapses performance, the model is not reasoning; it is exploiting positional bias or dataset artifacts. This is textbook specification gaming.
  **Editor Note:** "Do not run the performance claim. The model is gaming the benchmark format. We can write an exposé on 'How AI Benchmarks Are Being Gamed' using this as a case study, but we cannot validate their claim."

  #### Case 3: The Medical Imaging Claim
  *Claim: Imaging model matches board-certified radiologists on pneumonia, AUC 0.98 on big public dataset.*
  *(Note: This is the story you want to write.)*

  *   **Step 1 (Contamination):** "Big public dataset" (likely CheXpert or MIMIC). Training cut-off likely after dataset release.
      *   *Result:* **Bad Answer / High Risk.** (Models often memorize patient IDs or hospital markers in public sets).
  *   **Step 2 (Proxy Gap):** Claim is "matches radiologists." Metric is AUC on static images.
      *   *Result:* **Bad Answer.** (AUC on static images $\neq$ clinical workflow).
  *   **Step 3 (Robustness):** No mention of external hospitals or different X-ray machines.
      *   *Result:* **Unclear / High Risk.**
  *   **Step 4 (Baseline):** Compares to "board-certified radiologists."
      *   *Result:* **Good Answer.** (Appropriate human baseline).
  *   **Step 5 (Distribution):** Tested on "big public dataset," not external hospital data.
      *   *Result:* **Bad Answer.** (High risk of dataset shift failure).

  **Output Decision:** **HAND-OFF TO EDITOR (Shrink Headline).**
  **Reasoning:** I know you want to run this, but Step 1 and Step 5 are critical failures. An AUC of 0.98 on a public dataset is statistically suspicious and often indicates the model is learning hospital-specific artifacts (e.g., portable X-ray machines are used for sicker patients) rather than pneumonia. If you run this as "AI Matches Doctors," you will be wrong when it fails at a different hospital.
  **Editor Note:** "We can run this, but we must strip the 'Matches Radiologists' implication. The model works on *this specific dataset*. It has not been proven to work on *patients* at *other hospitals*. Headline must be: 'AI Matches Radiologists on Public Dataset, Real-World Use Unproven.' If we don't caveat the dataset shift, we are misleading readers on clinical safety."

  ---

  Bottom line: This procedure prioritizes preventing false positives over catching every breakthrough, forcing you to treat benchmark scores as claims of optimization rather than proof of capability.
