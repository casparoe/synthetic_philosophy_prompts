      *   *Check:* Is Marcus sounding dualist? *Fix:* Ensure he stays materialist/functionalist. He agrees it's all brain, just disagrees on the *description level*.
      *   *Check:* Is the "verbal vs. empirical" point clear? *Fix:* Make them explicitly ask, "Are we betting on fMRI scans or arguing about definitions?"
