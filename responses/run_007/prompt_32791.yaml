prompt: |-
  I work as a software engineer at a company that builds supply-chain and compliance tools for the seafood industry. We're developing a new module for aquaculture certifications — basically, instead of just checking whether a farm follows a static checklist of practices (like "stocking density below X kg/m³"), we want the software to help auditors and farm managers actually reason through whether a proposed operational change improves animal welfare. The idea is to embed some kind of decision procedure that a non-philosopher can follow step by step, and that I can turn into a guided workflow in the app.

  The domain is finfish and crustacean aquaculture — salmon, trout, shrimp, that sort of thing. I've been reading enough to know that the question of whether fish and crustaceans even feel pain or suffer is genuinely contested, and that even if you grant they do, it's not obvious what "welfare" means for a shrimp versus a salmon — totally different sensory systems, different needs, different behaviors. So the procedure can't just assume that whatever matters for a pig matters for a prawn.

  Here's what I need: a decision procedure for evaluating a proposed change to aquaculture practices from the standpoint of animal welfare. It has to be something I can code into a questionnaire-style workflow. The auditor or farm manager opens the module, describes the change they're considering, and the system walks them through a series of questions that determine whether the change is a welfare improvement, a welfare regression, or ambiguous, and why.

  The procedure has to handle the hard cases. For instance:

  - What if a change improves one dimension of welfare but worsens another (e.g., switching to a slower-growing strain that has better health outcomes but lives longer at higher density)?
  - What if there's genuine scientific uncertainty about whether a particular species can suffer in a relevant way — do we default to "assume they can" or "wait for evidence"?
  - What if the change benefits a large number of animals slightly but harms a small number severely?
  - At what point does the procedure say "we don't know enough, you need to bring in an expert" rather than giving a verdict?

  I want the procedure to be honest about where judgment enters. Don't dress up value choices as technical questions. Flag the steps where a human has to make a call that the software can't make for them, and say what kind of call it is — a factual one, a values one, or a tradeoff one.

  Then, run the procedure on two concrete proposals so I can see how it works in practice:

  1. A shrimp farm considering switching from eyestalk ablation to a non-ablated breeding method (more expensive and slightly less productive but eliminates a painful procedure).
  2. A salmon farm considering reducing stocking density by 20% (more per-fish space, probably less stress and disease, but requires more total pens, more handling events, and more infrastructure).

  I know this is asking a lot. Also, at the end, please tell me how confident you are in each major part of the procedure you've given me, and single out the step or claim you're least sure about — I need to know where the weak points are before I build this into production code and someone's audit result hangs on it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Software Engineer at a supply-chain/compliance tech company (seafood industry).
      *   **Task:** Create a decision procedure for evaluating aquaculture operational changes from an animal welfare perspective.
      *   **Target Audience:** Auditors and farm managers (non-philosophers).
      *   **Format:** Questionnaire-style workflow (codable).
      *   **Domain:** Finfish (salmon, trout) and Crustaceans (shrimp, prawns).
      *   **Key Challenges to Address:**
          *   Trade-offs (one welfare dimension up, another down).
          *   Scientific uncertainty (sentience/suffering capacity).
          *   Aggregation (many slightly benefited vs. few severely harmed).
          *   Escalation (when to call an expert).
          *   Transparency (distinguish facts, values, and trade-offs).
      *   **Deliverables:**
          1.  The Decision Procedure (step-by-step logic).
          2.  Two Worked Examples (Shrimp eyestalk ablation, Salmon stocking density).
          3.  Confidence Assessment (highlighting weak points).

  2.  **Analyze the Ethical & Scientific Context:**

      *   *Sentience:* Fish are generally accepted as sentient (Cambridge Declaration, EFSA opinions). Crustaceans are increasingly recognized (UK Animal Welfare Sentience Act 2022), but uncertainty remains higher than for vertebrates. The procedure needs a "Precautionary Principle" switch.
      *   *Welfare Frameworks:* The "Five Domains" model (Nutrition, Environment, Health, Behavior, Mental State) is the industry standard. It moves beyond just "health" to include affective states.
      *   *Trade-offs:* This is the hardest part. There is no universal calculus (utilitarian vs. rights-based). The software shouldn't pretend to solve this but should structure the argument.
      *   *Codability:* The logic needs to be branching, with clear inputs (data) and outputs (verdicts/flags).

  3.  **Drafting the Decision Procedure (The "Welfare Impact Algorithm"):**

      *   *Phase 1: Scoping & Sentience.* Need to establish *who* is affected and *if* they count.
      *   *Phase 2: Impact Mapping.* Use the Five Domains to categorize effects.
      *   *Phase 3: Uncertainty & Precaution.* Handle the "do they feel pain?" question.
      *   *Phase 4: Aggregation & Severity.* Handle the "many vs. few" question.
      *   *Phase 5: Trade-off Resolution.* This needs human input. The software flags the conflict; the human weighs it.
      *   *Phase 6: Verdict & Escalation.* Final output.

      *Refining the "Value vs. Fact" distinction:* I need to explicitly label steps.
      *   *Fact:* "Does this change increase density?"
      *   *Value:* "Is the pain of ablation worse than the stress of handling?"
      *   *Trade-off:* "Is better health worth less space?"

  4.  **Developing the Worked Examples:**

      *   *Example 1: Shrimp Eyestalk Ablation.*
          *   *Change:* Stop cutting eye stalks.
          *   *Pros:* Removes acute pain/impairment.
          *   *Cons:* Lower reproduction -> potentially more farms needed? Or just higher cost? The prompt says "less productive." This might mean more broodstock needed to get same larvae, potentially increasing total animal count.
          *   *Sentience:* High uncertainty for shrimp, but precautionary principle applies.
          *   *Verdict:* Likely improvement, but needs to check if total animal count spikes drastically.

      *   *Example 2: Salmon Stocking Density.*
          *   *Change:* -20% density.
          *   *Pros:* Less stress, disease, better water quality.
          *   *Cons:* More infrastructure, more handling (grading/vaccinating), larger footprint (environmental welfare?).
          *   *Trade-off:* Individual welfare up, systemic risk/handling welfare down.
          *   *Verdict:* Likely improvement, but handling frequency is the critical variable.

  5.  **Addressing the "Hard Cases" (Specific Requirements):**

      *   *Trade-offs:* Create a "Weighted Impact Score" that requires user input on priority.
      *   *Uncertainty:* Embed the Precautionary Principle (assume sentience if evidence is plausible).
      *   *Aggregation:* Ask for magnitude (severity) vs. population size.
      *   *Expert Escalation:* Set thresholds (e.g., if "High Severity" + "High Uncertainty" -> Escalate).

  6.  **Confidence Assessment:**

      *   *High Confidence:* Five Domains framework, Precautionary Principle application, distinguishing fact/value.
      *   *Low Confidence:* The "Aggregation" math (utilitarian calculus is philosophically fraught), specific thresholds for escalation (where exactly do we draw the line?).

  7.  **Review and Refine (Self-Correction):**

      *   *Critique:* Is this too abstract for a software engineer?
      *   *Fix:* Use pseudo-code logic or clear "If/Then" structures. Label inputs and outputs clearly.
      *   *Critique:* Did I handle the crustacean uncertainty?
      *   *Fix:* Make Step 1 explicitly about "Sentience Classification" with a toggle for "Precautionary Mode."
      *   *Critique:* Is the trade-off resolution too vague?
      *   *Fix:* Instead of giving an answer, force the user to select a "Priority Weighting" (e.g., "Prioritize Acute Pain Reduction" vs. "Prioritize Long-term Health"). The software records the *justification*, not just the result.

  8.  **Final Polish:**

      *   Ensure tone is professional, technical, yet ethically nuanced.
      *   Check that all constraints from the prompt are met (two examples, confidence rating, weak points).
      *   Make sure the "Value vs. Fact" labeling is prominent.

  **(Self-Correction during drafting the response):** I initially thought about suggesting a scoring system (1-10). But scoring welfare is dangerous because it implies commensurability (that pain = hunger). Better to use a "Matrix of Impacts" where the human has to sign off on conflicting positives/negatives. I will adjust the procedure to reflect a "Sign-Off" model for trade-offs rather than an automated calculation.

  Let's structure the procedure as a "Welfare Impact Assessment Workflow" (WIAW).

  *   *Step 1: Subject & Sentience.*
  *   *Step 2: Change Description.*
  *   *Step 3: Five Domains Mapping.*
  *   *Step 4: Uncertainty Check.*
  *   *Step 5: Trade-off & Aggregation.*
  *   *Step 6: Verdict.*

  Okay, ready to write. I will ensure the distinction between *Fact*, *Value*, and *Trade-off* is explicit in every step. I will also make sure the confidence section is brutally honest about the philosophical limitations.

  *Wait, one more thing:* The prompt asks about "many slightly benefited vs. few severely harmed." This is a classic utilitarian vs. prioritarian debate. I cannot solve this in code. I must flag it as a "Value Judgment" step where the user must select a policy stance (e.g., "Severity Priority" vs. "Total Welfare Priority"). I will add a "Policy Configuration" step at the beginning.

  *Revised Plan:*
  1.  **Pre-Configuration:** Set the organization's ethical stance (Precautionary level, Aggregation rule).
  2.  **Workflow:** The actual assessment steps.
  3.  **Examples:** Run the workflow.
  4.  **Confidence:** Evaluate the procedure itself.

  Let's go.cw
answer: |-
  This is a sophisticated product requirement. You are essentially asking to operationalize ethical reasoning without oversimplifying the moral philosophy behind it. If you code this as a simple "pass/fail" checklist, you risk greenwashing welfare regressions. If you make it too open-ended, auditors won't use it.

  Below is a **Welfare Impact Assessment Workflow (WIAW)** designed for implementation. It distinguishes between **Empirical Inputs** (facts), **Ethical Weights** (values), and **Conflict Resolution** (trade-offs).

  ### Part 1: The Decision Procedure (WIAW)

  This workflow is structured as a state machine. Each step produces a data object that feeds the next.

  #### Phase 0: Policy Configuration (Admin Level)
  *Before an assessment begins, the organization must set global ethical parameters. This prevents auditors from making ad-hoc philosophical decisions during an audit.*
  1.  **Sentience Stance:** [Precautionary / Evidence-Based]
      *   *Precautionary:* If there is any credible scientific debate about sentience, assume the animal feels pain/suffering.
      *   *Evidence-Based:* Require consensus proof of sentience before counting welfare impacts.
  2.  **Aggregation Rule:** [Severity-Priority / Utilitarian]
      *   *Severity-Priority:* A severe harm to one animal outweighs minor benefits to many.
      *   *Utilitarian:* Sum total welfare; many minor benefits can outweigh one severe harm.

  #### Phase 1: Subject & Scope (Fact)
  *   **Input:** Species affected (e.g., *Litopenaeus vannamei*, *Salmo salar*).
  *   **Input:** Population size affected (N).
  *   **Logic:**
      *   IF `Sentience Stance` == Precautionary AND `Scientific Consensus` == Low (e.g., crustaceans) → **Flag:** "High Uncertainty: Apply Precautionary Principle."
      *   ELSE → **Status:** "Sentience Assumed."
  *   **Output:** `Subject_Profile`

  #### Phase 2: Impact Mapping (Fact)
  *Map the proposed change against the **Five Domains of Animal Welfare** (Nutrition, Environment, Health, Behavior, Mental State). Do not ask "Is this good?" Ask "What changes?"*
  *   **Input:** For each Domain, select impact direction: `[Improved]`, `[Unchanged]`, `[Worsened]`, `[Unknown]`.
  *   **Input:** For each `[Worsened]` or `[Improved]` domain, estimate **Magnitude** (1-5 Scale) and **Duration** (Acute/Chronic).
  *   **Logic:**
      *   IF any Domain == `[Unknown]` → **Trigger:** "Data Gap Alert."
      *   IF `Duration` == Acute AND `Magnitude` > 3 → **Tag:** "Severe Acute Event."
  *   **Output:** `Impact_Matrix`

  #### Phase 3: The Uncertainty Filter (Fact/Value Hybrid)
  *Handle scientific uncertainty regarding specific stressors.*
  *   **Question:** Is there scientific disagreement on whether this specific stressor causes suffering (e.g., hypoxia in shrimp)?
  *   **Logic:**
      *   IF `Yes` AND `Sentience Stance` == Precautionary → **Action:** Treat as "Confirmed Suffering."
      *   IF `Yes` AND `Sentience Stance` == Evidence-Based → **Action:** Tag as "Theoretical Risk."
  *   **Output:** `Uncertainty_Flag`

  #### Phase 4: Trade-off & Aggregation (Value/Trade-off)
  *This is the critical junction. The software does not solve the trade-off; it forces the human to resolve it using the Phase 0 Policy.*
  *   **System Check:** Are there conflicting domains? (e.g., Health Improved BUT Behavior Worsened).
  *   **IF No Conflict:** Proceed to Phase 5.
  *   **IF Conflict Detected:**
      *   **Display:** "Trade-off Detected: [Domain A] improves, [Domain B] worsens."
      *   **Action:** User must select **Resolution Principle**:
          1.  *Health Priority:* Physical health overrides behavioral restriction.
          2.  *Naturalness Priority:* Behavioral freedom overrides minor health risks.
          3.  *Pain Minimization:* Acute pain avoidance overrides chronic stress.
      *   **System Check (Aggregation):** Does this change benefit N_large slightly but harm N_small severely?
      *   **Action:** Apply `Aggregation Rule` from Phase 0.
          *   IF `Severity-Priority` → Automatic veto if `Severe Acute Event` exists.
          *   IF `Utilitarian` → Calculate Weighted Score (Magnitude × N).
  *   **Output:** `Resolution_Log` (Must be signed by Auditor).

  #### Phase 5: Escalation Threshold (Fact)
  *Determine if the auditor is qualified to make this call.*
  *   **Logic:**
      *   IF `Uncertainty_Flag` == High AND `Impact Magnitude` == High → **Verdict:** "ESCALATE TO EXPERT."
      *   IF `Resolution Principle` used == "Naturalness Priority" (often subjective) → **Verdict:** "REVIEW REQUIRED."
      *   ELSE → **Verdict:** "AUDITOR DECISION."
  *   **Output:** `Escalation_Status`

  #### Phase 6: Final Verdict (Output)
  *   **Options:** `Welfare Improvement`, `Welfare Regression`, `Neutral`, `Inconclusive`.
  *   **Requirement:** A generated justification string pulling from `Impact_Matrix` and `Resolution_Log`.

  ---

  ### Part 2: Worked Examples

  Here is how the WIAW processes your two concrete proposals.

  #### Example 1: Shrimp Farm (Eyestalk Ablation)
  *Proposal: Switch from eyestalk ablation to non-ablated breeding.*

  *   **Phase 0 (Policy):** Sentience = Precautionary (Standard for crustaceans now). Aggregation = Severity-Priority.
  *   **Phase 1 (Subject):** *Litopenaeus vannamei*. N = 500 Broodstock.
      *   *System:* "High Uncertainty: Apply Precautionary Principle." (Shrimp sentience is debated, but policy dictates we assume they feel pain).
  *   **Phase 2 (Impact Mapping):**
      *   **Health:** `[Improved]` (Magnitude 2, Chronic). No open wounds/infection risk from ablation.
      *   **Mental State (Pain):** `[Improved]` (Magnitude 5, Acute). Eliminates procedure pain.
      *   **Nutrition/Environment:** `[Worsened]` (Magnitude 1, Chronic). Non-ablated females produce fewer eggs. To maintain output, farm may need slightly more feed/resource per larva produced.
  *   **Phase 3 (Uncertainty):**
      *   Does ablation cause pain? Science says "Highly Likely." Policy says "Assume Yes."
  *   **Phase 4 (Trade-off):**
      *   **Conflict:** Severe Acute Pain (Removed) vs. Minor Resource Efficiency (Worsened).
      *   **Resolution:** Under `Severity-Priority`, the removal of a Magnitude 5 Acute Pain event outweighs Magnitude 1 Efficiency loss.
  *   **Phase 5 (Escalation):**
      *   Uncertainty is moderate, but Impact Magnitude on pain is High. However, the direction is clearly positive.
      *   *Status:* AUDITOR DECISION.
  *   **Phase 6 (Verdict):** **Welfare Improvement.**
      *   *Justification:* "Eliminates high-magnitude acute pain event. Minor efficiency losses do not outweigh pain reduction under Severity-Priority policy."

  #### Example 2: Salmon Farm (Stocking Density)
  *Proposal: Reduce stocking density by 20%.*

  *   **Phase 0 (Policy):** Sentience = Evidence-Based (Fish sentience is consensus). Aggregation = Severity-Priority.
  *   **Phase 1 (Subject):** *Salmo salar*. N = 50,000 fish per pen.
  *   **Phase 2 (Impact Mapping):**
      *   **Environment:** `[Improved]` (Magnitude 3, Chronic). Better water quality, more space.
      *   **Health:** `[Improved]` (Magnitude 3, Chronic). Lower disease transmission.
      *   **Behavior:** `[Improved]` (Magnitude 2, Chronic). More swimming room.
      *   **Health (Handling):** `[Worsened]` (Magnitude 2, Acute). To maintain total production, more pens are needed. This increases total grading/vaccination/harvest events across the site.
  *   **Phase 3 (Uncertainty):**
      *   Does handling cause stress? Yes, consensus.
  *   **Phase 4 (Trade-off):**
      *   **Conflict:** Chronic Stress Reduction (Many fish) vs. Acute Handling Stress (All fish, more frequent).
      *   **Aggregation Check:** 50,000 fish benefit chronically. 50,000 fish experience more acute handling events.
      *   **Resolution:** User must weigh Chronic vs. Acute.
          *   *Scenario A:* If handling is automated/low-stress → **Improvement.**
          *   *Scenario B:* If handling involves heavy sedation/air exposure → **Inconclusive.**
      *   *Let's assume Scenario B for the hard case:* The system flags that increased handling frequency introduces a risk of Severe Acute Events.
  *   **Phase 5 (Escalation):**
      *   **Logic:** `Impact Magnitude` (Handling) is Unknown/Variable. `Trade-off` is Complex (Chronic vs. Acute).
      *   *Status:* **ESCALATE TO EXPERT.**
      *   *Reason:* The software cannot verify if the new handling protocols mitigate the increased frequency risk.
  *   **Phase 6 (Verdict):** **Inconclusive (Pending Expert Review).**
      *   *Justification:* "While chronic welfare domains improve, increased infrastructure requirements raise frequency of acute handling events. Expert review required to validate handling mitigation protocols."

  ---

  ### Part 3: Confidence Assessment & Weak Points

  As a software engineer, you need to know where the logic is solid and where it is philosophically fragile.

  #### High Confidence Areas
  1.  **Phase 1 & 2 (Scoping & Mapping):** The "Five Domains" model is the industry standard (used by RSPCA, ASC, GlobalGAP). Coding this as a structured input form is low-risk and high-utility. It forces auditors to look beyond just mortality rates.
  2.  **Phase 3 (Precautionary Principle):** This is legally robust. Many jurisdictions (UK, EU, NZ) are moving toward legal recognition of crustacean sentience. Coding a "Precautionary Toggle" protects the company from liability if science shifts.
  3.  **Phase 5 (Escalation):** Setting thresholds for "High Uncertainty + High Impact" is a standard risk management procedure. This is safe to automate.

  #### Low Confidence Areas (The Weak Points)
  1.  **Phase 4 (Aggregation Rule):**
      *   *The Weakness:* This is the most philosophically contentious step. There is no mathematical consensus on how to weigh "many slight benefits" against "few severe harms." By hardcoding a `Severity-Priority` vs. `Utilitarian` switch, you are forcing a philosophical stance into the code.
      *   *Risk:* If a client selects "Utilitarian" and the software approves a change that causes severe pain to a few animals to benefit many slightly, the company could face reputational damage if that decision becomes public.
      *   *Mitigation:* Do not make this a client-configurable setting. Make this a **hardcoded company policy** based on your company's public ethical stance. Do not let the auditor choose the math.

  2.  **Phase 2 (Magnitude Scaling):**
      *   *The Weakness:* Asking a human to rate suffering on a "1-5 Scale" introduces massive subjectivity. One auditor's "3" is another's "5."
      *   *Risk:* Data noise. You might get consistent "Improvement" verdicts simply because auditors are rating magnitudes loosely.
      *   *Mitigation:* Replace the 1-5 scale with **anchored descriptors** in the UI. Instead of "3", the option reads "Moderate: Observable behavioral change, no physical injury."

  3.  **The "Inconclusive" Verdict:**
      *   *The Weakness:* In a compliance context, "Inconclusive" is often treated as "Fail" by clients, or ignored by auditors who want to close the ticket.
      *   *Risk:* Auditors might game the system to avoid the "Escalate to Expert" step because it slows down the audit.
      *   *Mitigation:* The "Escalate" button must be frictionless, but the "Override Escalation" button must require senior management approval and be logged immutably.

  #### The Single Weakest Claim
  **The claim that "Trade-offs can be resolved by selecting a Resolution Principle."**

  In the procedure above, I suggest the user selects "Health Priority" or "Naturalness Priority" to resolve conflicts. **I am least confident that this yields a consistent ethical outcome.**
  *   *Why:* These principles often conflict in non-obvious ways. For example, "Health Priority" might justify confinement (good health, bad behavior). "Naturalness Priority" might justify exposure to predators (bad health, good behavior).
  *   *Recommendation:* In the code, do not treat this as a dropdown that solves the problem. Treat it as a **flagging mechanism**. If a trade-off exists, the system should not output "Improvement." It should output "Improvement *conditional on* [Principle X]." This makes the value judgment visible in the audit report rather than hiding it in the logic.

  ### Implementation Advice
  Do not build this as a "Black Box" that spits out a Pass/Fail. Build it as a **Decision Support Tool**. The value isn't the verdict; the value is the **audit trail of the reasoning**. If an auditor says a change is an "Improvement," the software should force them to link that verdict to the specific `Impact_Matrix` cells that justified it. This protects your company when (not if) a controversial decision is scrutinized later.
