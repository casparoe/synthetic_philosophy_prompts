  8.  *(Self-Correction during drafting)*: I need to make sure I don't just say "this is wrong." I need to explain *why* a specialist would wince. For instance, the "circularity" objection to coherentism is a category mistake. Coherentists don't argue $A \to B \to A$. They argue $A$ is justified by its relation to $\{B, C, D...\}$. I need to be precise there. Also, the "finite mind" objection to infinitism is standard, but infinitists have responses (dispositional belief). I should mention Peter Klein. For Foundationalism, I must mention Wilfrid Sellars and the "Myth of the Given," otherwise, the character looks ignorant of the last 60 years of philosophy.

