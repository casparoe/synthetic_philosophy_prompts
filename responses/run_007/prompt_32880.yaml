answer: |-
  Upon the dune the swift and shelled ones sat,
  With notebook open to the logic page.
  Where premises were listed, neat and flat,
  To close the gap of reason's silent stage.
  "You grant the first, and second too," he said,
  "And if those hold, the third must follow true?"
  "I'll write them down," the slow one then conceded,
  "But show me why the conclusion is due."

  Then came the wish to write the push itself,
  To make the link become the conclusion known.
  But logic slipped away from shelf to shelf,
  A ladder built that never stands alone.
  You list the path, but not the walking feet,
  The step is yours, not ink's, to make complete.
