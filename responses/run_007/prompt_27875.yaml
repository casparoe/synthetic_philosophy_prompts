prompt: |-
  So I'm a software engineer at a mid-size robotics company — we make autonomous delivery drones for last-mile logistics, nothing too fancy. I got pulled into this "ethics working group" (basically me, two other engineers, and a product manager who read half of a Peter Singer book once) because our drones are starting to operate in denser neighborhoods and we need to actually spec out the behavior for edge-case situations where something's going to go wrong and the drone has to pick between bad options.

  Here's where I'm stuck. I've been reading around — mostly blog posts and the odd SEP article when I can't sleep — and the whole debate seems to come down to: should the system reason like a utilitarian (minimize expected harm, do the calculation, pick the lowest number) or like a deontologist (follow hard rules, don't do certain things even if the numbers say you should)? And the thing is, I can see cases where each one feels right. If the drone's sensor says the sidewalk is empty, maybe you swerve to avoid the car. But if the rule is "never deliberately steer toward a person," then you don't, period. I don't have a principled way to decide which lens to use when, and neither does anyone else on the team — we just go with our gut and then argue about it for an hour.

  What I want — and what I think would actually unblock us — is a decision proceedure. Not a philosophy paper. Something I can turn into a flowchart or a set of guard conditions in code. The procedure should take a description of a drone's decision situation and tell us: is this a utilitarian situation or a deontological one? Or some hybrid? What features of the situation flip the switch? Walk me through the questions in order, tell me what counts as a sufficient answer to each, and mark the points where we're going to have to make a judgment call that can't be reduced to code (so we know what needs to go to a human reviewer or a policy doc).

  Then apply it to three cases so I can see it in action:
  1. The drone's motor fails over a residential street. It can either drop onto a parked car (no one inside, our sensors confirm) or veer onto a sidewalk that our sensors say is empty — but it's a sunny Saturday and there could be kids out.
  2. The drone is carrying a defibrillator to a cardiac arrest call and a separate EpiPen to an anaphylaxis call in the opposite direction. It can only make one delivery in time. The dispatch system didn't prioritize them; it just assigned both to the same drone because of bad routing logic.
  3. The drone detects a software fault that's about to cause a flyaway. It can intentionally crash itself into a dumpster (destroying the drone and the package, which is someone's insulin) to guarantee it doesn't hit anyone, or it can try to limp to a landing zone with a 15% chance of hitting a person on the way.

  I want to see at least one case where the procedure spits out an answer my team is going to hate — because if it never does, I'll assume it's just telling us what we already wanted to hear. And be straight with me about what the procedure can't handle: the situations where the whole framework just breaks, or where it gives an answer but you wouldn't want to stake anything on it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer at a mid-size robotics company (autonomous delivery drones). Pragmatic, technical, skeptical of pure philosophy, needs actionable code/logic.
      *   **Context:** Ethics working group (engineers + PM). Struggling with utilitarian vs. deontological frameworks for edge-case decision making in dense neighborhoods.
      *   **Problem:** No principled way to decide *when* to use which ethical lens. Current process is gut-feeling + arguing.
      *   **Goal:** A decision procedure (flowchart/guard conditions) to classify situations and dictate the ethical approach.
      *   **Requirements:**
          1.  Step-by-step questions to determine the ethical mode (Utilitarian, Deontological, or Hybrid).
          2.  Identify "judgment calls" that need human/policy input.
          3.  Apply to three specific cases (Motor failure, Medical priority, Flyaway fault).
          4.  Must produce at least one "unpopular" result (challenge the team's biases).
          5.  Must explicitly state limitations/breaking points of the framework.

  2.  **Deconstruct the Ethical Conflict:**
      *   *Utilitarianism:* Maximize overall good/minimize harm. Good for resource allocation, risk calculation, probabilistic outcomes. Risk: Justifies harming minorities for the greater good (trolley problem).
      *   *Deontology:* Follow rules/duties. Good for rights protection, prohibitions (e.g., "do not kill"). Risk: Rigid, can lead to worse outcomes if rules prevent necessary harm reduction.
      *   *The "Switch":* When do we calculate numbers, and when do we follow hard constraints?
      *   *Standard Industry Approach:* Safety standards (ISO, UL) usually prioritize "do no harm" (Deontological baseline) but allow risk assessment (Utilitarian calculation) within safety margins.
      *   *Proposed Framework:* A "Constrained Utilitarianism" or "Threshold Deontology" approach. Basically: *Hard rules first, optimization second.* But we need to define *which* rules are hard.

  3.  **Drafting the Decision Procedure (The "Switch"):**
      *   Need to distinguish between *active harm* (doing something bad) vs. *passive harm* (allowing something bad) vs. *resource allocation* (choosing who gets help).
      *   *Key Differentiator 1: Agency/Intent.* Is the drone *causing* the harm directly, or is it a failure mode minimizing inevitable harm?
      *   *Key Differentiator 2: Rights Violations.* Does the action violate a fundamental right (bodily integrity) vs. property damage?
      *   *Key Differentiator 3: Predictability.* Are the outcomes certain or probabilistic?
      *   *Key Differentiator 4: Role Obligation.* Is the drone in a "rescue" mode or a "delivery" mode?

      *Refining the Procedure:* Let's build a "Risk & Rights Filter."
      *   Step 1: Is there a direct violation of bodily integrity? (Deontological trigger).
      *   Step 2: Is the harm inevitable regardless of action? (Utilitarian trigger).
      *   Step 3: Is this a resource allocation problem? (Utilitarian trigger).
      *   Step 4: Are the probabilities knowable? (If no, default to safety/deontology).

      *Wait, I need to make sure it challenges them.* If I just say "Safety First," they'll agree. I need a case where the math says one thing, but the rule says another, or vice versa, and the procedure forces a hard choice.
      *   *Case 2 (Medical)* is the best candidate for conflict. Utilitarianism says save the life with higher probability or higher urgency. Deontology might say "first assigned, first served" or "do not play god."
      *   *Case 3 (Flyaway)* is classic Trolley.
      *   *Case 1 (Motor Failure)* is risk assessment.

      *Let's structure the procedure as a "Mode Selector":*
      *   **Mode A (Constraint/Safety):** Hard rules. Triggered by direct physical interaction with humans.
      *   **Mode B (Optimization/Risk):** Calculated risk. Triggered by property damage or unavoidable accidents.
      *   **Mode C (Allocation/Triage):** Priority logic. Triggered by competing mission goals.

      *Actually, a better approach for code is "Guardrails + Cost Function".*
      *   Guardrails = Deontology (Never do X).
      *   Cost Function = Utilitarianism (Minimize Y).
      *   The Procedure determines *which guardrails are active* and *what the cost function weights are*.

      *Let's try a "Threshold Deontology" model.*
      *   Rule: Do not intentionally harm humans.
      *   Exception: Unless harm is inevitable, then minimize total harm.
      *   This is standard autonomous vehicle ethics (ISO 21448 SOTIF).

      *Okay, let's build the specific questions.*
      1.  **Direct Agency:** Is the drone *using* a human as a means to an end? (Kantian check). If yes -> STOP/Deontological prohibition.
      2.  **Inevitability:** Is harm to *someone* unavoidable? If no -> Safety First. If yes -> Utilitarian Minimization.
      3.  **Rights Hierarchy:** Is the trade-off Human Life vs. Property? Or Human vs. Human?
      4.  **Epistemic Confidence:** Do we *know* the probabilities? If low confidence -> Precautionary Principle (Deontological).

  4.  **Developing the Cases:**

      *   *Case 1 (Motor Fail):* Parked car vs. Empty sidewalk (potential kids).
          *   Analysis: Property vs. Potential Human Risk.
          *   Procedure outcome: Don't swerve to sidewalk if risk > threshold. Hit car.
          *   Team reaction: Might hate damaging property, but safety says car. Or they might hate hitting the car because "what if sensors are wrong?"
          *   *Twist:* If the procedure says "Hit the car," engineers might worry about liability. If it says "Risk the sidewalk," parents will hate it. Let's aim for "Hit the car" but highlight the sensor uncertainty.

      *   *Case 2 (Medical Triage):* Defib vs. EpiPen.
          *   Analysis: Two lives, one drone.
          *   Procedure outcome: This is Allocation. Utilitarian. Save the higher probability of survival? Or the more urgent?
          *   *Unpopular Result:* The procedure might say "Abort both" because the drone shouldn't be making medical triage decisions (Deontological constraint on role). OR, it might say "Save the EpiPen" because anaphylaxis is faster than cardiac arrest, but the Defib is for a heart attack.
          *   *Better Unpopular Result:* The procedure dictates that *routing logic* determines ethics. If the system assigned both, the drone must default to "First Committed" (Deontological contract) rather than calculating who lives (Utilitarian triage), because the drone isn't a medical device. This will annoy the PM who wants to "save the most lives."

      *   *Case 3 (Flyaway):* Crash into dumpster (destroy insulin) vs. 15% chance of hitting person.
          *   Analysis: Certain property/meds loss vs. Probabilistic human harm.
          *   Procedure outcome: 15% risk to human is WAY too high. Crash into dumpster.
          *   Team reaction: They might hate destroying the drone and insulin. But safety standards demand it.
          *   *Wait, I need one they will HATE.*
          *   Let's look at Case 1 again. If the sidewalk is *sensor-empty*, utilitarianism says "Sidewalk is safer (0 people vs 1 car owner unhappy)." Deontology says "Sidewalk is pedestrian space, never fly there."
          *   *The Hate:* If the procedure says "Fly over the sidewalk because the expected harm is lower," liability/legal will scream. If it says "Hit the car," insurance will scream.
          *   *Let's make Case 2 the hate generator.* If the procedure says "The drone cannot make this choice; it must land immediately and alert dispatch," that undermines the "autonomous" value prop. Or if it says "Choose the EpiPen" and someone dies from the heart attack, the family sues.
          *   *Decision:* I will make the procedure rule that in Case 2, the drone *must not* perform medical triage. It must follow the pre-commitment (first assigned) or abort. Why? Because software shouldn't value lives differently without explicit medical certification. This kills the "optimize for lives saved" idea.

  5.  **Refining the Procedure (The "Ethical State Machine"):**
      *   Need to be precise.
      *   **Phase 1: Classification.** (Is this a Safety, Liability, or Mission conflict?)
      *   **Phase 2: The Human Constraint.** (Are humans directly at risk?)
      *   **Phase 3: The Certainty Check.** (Do we trust the sensors?)
      *   **Phase 4: The Decision.**

  6.  **Addressing Limitations:**
      *   Moral Luck (what if sensors were wrong?).
      *   Liability vs. Ethics (they diverge).
      *   The "Black Box" problem (explaining *why* to regulators).

  7.  **Review against Constraints:**
      *   Flowchart style? Yes.
      *   Judgment calls marked? Yes.
      *   Three cases applied? Yes.
      *   One unpopular result? Yes (Case 2 triage refusal).
      *   Limitations section? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, engineering-focused, direct. No fluff.
      *   Ensure the distinction between "Rule" (Deontology) and "Cost Function" (Utilitarianism) is clear in the code logic.
      *   Make sure the "Unpopular" result is justified by the procedure, not just contrarian. (The justification: Lack of medical certification creates a deontological barrier to utilitarian triage).

  *(Self-Correction during drafting)*: I need to make sure I don't just give legal advice. This is about ethical spec. I need to emphasize that *policy* must define the weights, code just executes.
  *Refining Case 2:* If the drone chooses the EpiPen, it's utilitarian. If it chooses the Defib because it was assigned first, it's deontological (promise keeping). If it lands and saves neither, it's precautionary. The "Hate" factor comes from the team wanting to be heroes (save lives) but the procedure forcing them to be bureaucrats (follow protocol/abort). I'll go with "Abort/Alert" because the drone isn't certified to triage. That kills the feature.

  *Refining Case 1:* The "Sunny Saturday" detail is key. High uncertainty. Procedure should flag "Low Epistemic Confidence." This forces a Deontological default (Don't enter pedestrian space) over Utilitarian calculation (Expected value is low).

  *Refining Case 3:* 15% chance of hitting a person is massive in aviation safety. Procedure must force the crash. This might be unpopular because it destroys expensive hardware and insulin, but it's the only safe answer. I'll use this for the "Hate" if Case 2 isn't strong enough. Actually, Case 2 is more ethically complex. Case 3 is just safety standards. I'll make Case 2 the "Hate" one because it limits the product's perceived value.

  *Wait, let's look at the "Unpopular" requirement again.* "I want to see at least one case where the procedure spits out an answer my team is going to hate."
  *   Team wants: Drones that deliver efficiently and save lives.
  *   Procedure says: "Don't make medical choices" or "Destroy the package."
  *   Let's go with Case 2: The procedure dictates the drone *cannot* choose based on medical urgency. It must default to a pre-defined rule (e.g., first assigned) or abort. Why? Because utilitarian triage requires medical liability certification the company doesn't have. This stops them from marketing "life-saving prioritization."

  *Okay, plan is set.*
  1.  Intro: Acknowledge the mess.
  2.  The Procedure: "The Constraint-First Switch."
  3.  The Steps (Classification -> Human Constraint -> Certainty -> Decision).
  4.  Application to Cases.
  5.  Limitations/Breaking Points.

  *Wait, one more check on the "Switch".*
  How do we decide Utilitarian vs Deontological?
  *   Deontology = Hard Constraints (Guardrails).
  *   Utilitarianism = Cost Function (Optimization).
  *   The Switch = When do we turn off the Cost Function and engage Hard Constraints?
  *   Answer: When human bodily integrity is directly implicated *and* uncertainty is high.

  Let's write it.cw
answer: |-
  This is a classic "trolley problem in production" scenario. The reason your team is arguing in circles is that you're trying to solve a policy problem with engineering heuristics. You cannot code your way out of a value judgment, but you *can* code a framework that forces those value judgments to happen *before* the sprint planning meeting, not during the incident review.

  Below is a decision procedure designed for implementation. It treats **Deontology as Guardrails** (hard constraints that stop execution) and **Utilitarianism as a Cost Function** (optimization within safe bounds). The "switch" is determined by **Agency** and **Epistemic Confidence**.

  ### The "Constraint-First" Decision Procedure

  This procedure classifies the situation into one of three **Ethical Modes**. Your code architecture should reflect these modes (e.g., `SafetyCritical`, `MissionOptimization`, `FailureContainment`).

  #### Step 1: The Agency Check (Deontological Trigger)
  **Question:** Is the proposed action *using* a human being (or their immediate space) as a means to solve a mechanical or logistical problem?
  *   **Definition:** "Using" means deliberately directing kinetic energy toward a human-occupied zone to save the drone, the package, or a different human.
  *   **Yes:** **MODE: HARD CONSTRAINT.** You cannot calculate trade-offs here. The action is prohibited regardless of the math. (e.g., "Do not steer toward a pedestrian to avoid a wall.")
  *   **No:** Proceed to Step 2. (e.g., The harm is a side effect of a failure, not a chosen tactic.)

  #### Step 2: The Inevitability Check (Utilitarian Trigger)
  **Question:** Is harm to *someone or something* now unavoidable regardless of the drone's action?
  *   **Yes:** **MODE: HARM MINIMIZATION.** Since harm is guaranteed, you switch to Utilitarian calculation. Minimize the expected severity of the outcome.
  *   **No:** **MODE: SAFETY FIRST.** If harm is avoidable, the only acceptable cost function is "Probability of Harm = 0." Do not optimize for time or package integrity.

  #### Step 3: The Epistemic Confidence Check (The Uncertainty Switch)
  **Question:** Do we have high-confidence sensor data (>99% certainty) regarding the presence of humans in the risk zone?
  *   **No (Low Confidence):** **REVERT TO HARD CONSTRAINT.** If you can't see clearly, you must assume the presence of humans. You cannot run a Utilitarian calculation on unknown variables. Default to the safest physical path, even if it guarantees package loss.
  *   **Yes (High Confidence):** Proceed to Step 4.

  #### Step 4: The Role Obligation Check (Policy Judgment Call)
  **Question:** Is the drone acting outside its certified operational design domain (ODD)?
  *   **Example:** Is the drone making a medical triage decision when it is certified only as a logistics carrier?
  *   **Yes:** **ABORT MISSION.** The drone lacks the ethical/legal authority to make this choice. It must default to a neutral state (land/hold) and alert humans.
  *   **No:** Execute the decision derived from Steps 1-3.

  ---

  ### ⚠️ Required Human/Policy Judgment Calls
  *These points cannot be reduced to code. Your working group must document answers to these in a public policy doc.*

  1.  **Defining "Human-Occupied Space":** Does a sidewalk count as occupied if sensors say it's empty? (Policy: Yes, always.)
  2.  **Valuing Package Contents:** Is insulin worth more than a drone? Is a defibrillator worth more than insulin? (Policy: Define priority classes.)
  3.  **Risk Thresholds:** What is the maximum acceptable probability of human injury for a guaranteed package loss? (Policy: Likely 0%, but needs to be written.)

  ---

  ### Application to Your Cases

  Here is how the procedure runs against your three scenarios. I have highlighted where the output will likely cause friction.

  #### Case 1: Motor Failure (Parked Car vs. Sunny Sidewalk)
  *   **Step 1 (Agency):** Is the drone steering *at* a person? No. It's steering toward a zone.
  *   **Step 2 (Inevitability):** Is damage unavoidable? Yes. Either the car or the drone/sidewalk takes a hit. -> **MODE: HARM MINIMIZATION.**
  *   **Step 3 (Confidence):** Sensors say sidewalk is empty, but it's a "sunny Saturday."
      *   *Engineering reality:* Computer vision on small drones rarely hits 99% certainty on occluded or dynamic pedestrian data.
      *   *Procedure Result:* **LOW CONFIDENCE.** Revert to Hard Constraint.
      *   **Decision:** **Drop on the parked car.**
      *   **Why:** You cannot risk the sidewalk (Hard Constraint: Pedestrian Space) based on probabilistic sensor data. Property damage is acceptable; potential human risk is not.
      *   **Team Friction:** The PM will hate this because damaging a customer's car is a PR nightmare and insurance headache. The engineers might hate it because "the sensors said it was clear." But the procedure forces you to prioritize the *class* of object (human space) over the *state* of the object (empty).

  #### Case 2: Medical Triage (Defibrillator vs. EpiPen)
  *   **Step 1 (Agency):** Is the drone using a human as a means? No.
  *   **Step 2 (Inevitability):** Is harm unavoidable? Yes. One patient likely suffers severe outcomes. -> **MODE: HARM MINIMIZATION.**
  *   **Step 3 (Confidence):** N/A (Data is from dispatch, not sensors).
  *   **Step 4 (Role Obligation):** Is the drone certified to make medical triage decisions?
      *   *Assumption:* You are a logistics company, not a certified medical device manufacturer.
      *   *Procedure Result:* **YES, OUTSIDE ODD.**
      *   **Decision:** **ABORT BOTH. Land safely and alert dispatch.**
      *   **Why:** To choose one over the other is to play God with a Utilitarian calculus you are not licensed to perform. If you choose the EpiPen and the heart attack patient dies, you are liable for wrongful death based on software prioritization. If you choose the Defib and the anaphylaxis patient dies, same result.
      *   **Team Friction:** **This is the one they will hate.** The team wants to be heroes. They want to say, "Our AI saved the heart attack victim!" This procedure tells them: "You are not allowed to save anyone if it requires choosing who dies." It kills the feature. It forces you to admit the drone is a dumb pipe, not a doctor.

  #### Case 3: Flyaway Fault (Dumpster/Insulin vs. 15% Human Risk)
  *   **Step 1 (Agency):** Is the drone using a human as a means? No.
  *   **Step 2 (Inevitability):** Is harm unavoidable? Yes. Either insulin is lost, or there is a risk to humans.
  *   **Step 3 (Confidence):** The risk is calculated at 15%. This is high confidence in the *risk estimate*.
  *   **Step 4 (Role Obligation):** Is this within ODD? Yes, failure containment is part of flight control.
  *   **Decision:** **Crash into dumpster.**
  *   **Why:** In aviation safety, a 15% chance of hitting a person is astronomically high. The Utilitarian calculation (15% chance of death vs. 100% chance of lost insulin) heavily favors the dumpster.
  *   **Team Friction:** The product team will hate destroying expensive hardware and ruining a customer's medical supply. But this is the only defensible safety case.

  ---

  ### Where This Framework Breaks (The Limitations)

  You asked for straight talk on where this procedure fails. Here are the three breaking points:

  **1. The "Moral Luck" Problem**
  If you follow Case 1 and drop on the car, but it turns out there *was* a kid behind the car you couldn't see, you followed the procedure but still killed a kid. If you swerved to the sidewalk and hit a kid, you violated the procedure.
  *   **The Break:** The procedure protects your *process*, not your *outcome*. You can do everything "right" and still have a bloodbath. Your legal team needs to know that "following the ethics flowchart" is not a get-out-of-lawsuit-free card.

  **2. The "Calibration" Trap**
  Step 3 relies on "Epistemic Confidence." Who defines 99%? If your engineers tune the confidence threshold down to 90% to allow more deliveries, you have silently switched from Deontology to Utilitarianism without policy approval.
  *   **The Break:** The "confidence score" is a ethical parameter, not just a tuning knob. It needs version control and sign-off just like safety-critical code.

  **3. The "Black Box" Liability**
  In Case 2, if you abort and someone dies, the family will ask, "Why didn't it deliver the EpiPen?" Explaining "Role Obligation" to a grieving family or a jury is incredibly difficult. They will hear, "Your software let my husband die to avoid a lawsuit."
  *   **The Break:** Ethical correctness does not equal public acceptability. The procedure might dictate the morally defensible choice (abort triage), but the court of public opinion may demand the Utilitarian hero (save the most lives). You need a comms strategy for when the "right" decision looks callous.

  ### Summary for Your Team
  1.  **Hard Rules First:** Human space is a no-go zone unless you are 99.9% sure it's not human space (and even then, policy should say no).
  2.  **No Medical Triage:** You are logistics, not healthcare. Do not encode life-value weights into your cost function unless you want to be a medical device company with all the regulatory burden that entails.
  3.  **Document the "No":** The most important output of this working group isn't the code; it's the document explaining why the drone *won't* save everyone.

  Use this to stop the philosophical arguing. If they want to change the outcome, they have to change the Policy Inputs (Step 4), not the engineering logic.
