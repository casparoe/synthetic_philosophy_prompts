answer: |-
  This is one of the hardest parts of public engagement. You are acting as a filter between raw public sentiment and corporate governance. If you filter too much, the consultation is a sham. If you filter too little, you legitimise harm and potentially expose the Trust to legal risk.

  There is no algorithm that removes the moral burden from you. However, you can use a structured process to ensure your team is consistent, defensible, and honest about where the hard calls are.

  Here is a procedure designed for a team of four, to be used within your two-week window.

  ### The "Legitimacy Filter" Procedure

  **Instructions:** Gather the four of you. Take the specific comment or theme. Go through these five questions in order. If the answer triggers a "Stop," the view is set aside (recorded only as 'received but not actionable due to constraints'). If you reach the end, it is a legitimate value judgement that must be reported to the Board, even if it is unpopular.

  **Question 1: The Fact Check**
  *   **Ask:** Is the premise of this view empirically false in a way that changes the decision?
  *   **Pass:** The view is based on opinion, values, or disputed evidence.
  *   **Fail (Set Aside):** The view relies on a demonstrable falsehood.
      *   *Example:* "Mental health isn't a real illness." (False: It is clinically recognised).
      *   *Example:* "This treatment costs £10m." (When it actually costs £1m).
  *   **Note:** Do not fail a view just because the *conclusion* is wrong. Fail it only if the *premise* is factually broken.

  **Question 2: The Legal & Statutory Check**
  *   **Ask:** If we acted on this view, would the Trust break the law or breach its statutory duties (Equality Act 2010, NHS Constitution, Human Rights Act)?
  *   **Pass:** The view suggests a policy change within the Trust's discretion.
  *   **Fail (Set Aside):** The view requires the Trust to discriminate unlawfully or abandon a statutory duty.
      *   *Example:* "Don't fund immigrants." (Breaches Equality Act/NHS duties).
      *   *Example:* "Stop providing interpreters." (Likely breaches safety/access duties).

  **Question 3: The Status vs. Resource Check**
  *   **Ask:** Is this argument about *who a person is* (status) or *how we use money* (resource)?
  *   **Pass:** The argument is about prioritisation of conditions, treatments, or budgets.
  *   **Fail (Set Aside):** The argument denies care based on inherent characteristics or moral worthiness unrelated to clinical need.
      *   *Example:* "Don't fund smokers." (Fail: Punishes based on lifestyle/history, clinically problematic).
      *   *Example:* "Fund cancer before podiatry." (Pass: Prioritisation of conditions).

  **Question 4: The Generalisability Check**
  *   **Ask:** If we applied this logic to a different group, would it still seem like a policy argument, or would it look like prejudice?
  *   **Pass:** The logic holds up across different groups.
  *   **Fail (Set Aside):** The logic only applies to groups the speaker dislikes.
      *   *Example:* "We shouldn't fund rehabilitation for addicts." (Test: Would they say the same for alcoholics or lung cancer patients who smoked? If no, it's targeted prejudice).

  **Question 5: The "Hate" Check (The Meta-Step)**
  *   **Ask:** Are we setting this aside because it violates the rules above, or because it makes *us* uncomfortable?
  *   **Action:** If you realise you are setting it aside because you disagree with the morality of it, but it passed Steps 1–4, **you must report it.**
  *   **Rule:** Discomfort is not a criterion for exclusion.

  ---

  ### Where This Procedure Will Misfire (The Honest Bit)

  You asked for honesty about the limitations. Here is where this checklist is actually just you making a judgement call dressed up as a procedure:

  1.  **Question 1 (Facts):** Medicine is often uncertain. If a resident says "Talking therapy doesn't work," is that a fact fail? No, it's a view on efficacy. You will have to decide when a claim is "false enough" to discard. *Risk:* You might accidentally filter out valid scepticism.
  2.  **Question 2 (Law):** You are not lawyers. You might think something is illegal when it's just politically difficult. *Risk:* You might use "legal duty" as a shield to hide from a hard political decision.
  3.  **Question 3 (Status vs. Resource):** This is the biggest grey area. Is smoking a "status" or a "choice"? Is obesity a "condition" or "lifestyle"? The line moves. *Risk:* This is where your own biases will sneak in most easily.
  4.  **The "Hate" Check:** This relies entirely on your team's self-awareness. If you don't realise you hate the view, you won't trigger this step.

  **The Hard Truth:** This procedure cannot protect you from the Board getting angry, or from the public feeling ignored. Its only job is to ensure that when you *do* ignore a view, you have a consistent reason that isn't just "we didn't like it."

  ---

  ### Worked Examples

  Here is how your team would run these three specific comments through the filter.

  #### Example 1: "The Trust shouldn't fund IVF because having children is a luxury not a medical need."

  *   **Q1 Fact Check:** **Pass.** Infertility is a medical condition, but whether treatment for it counts as a "need" vs "luxury" is a definition debate, not a factual error.
  *   **Q2 Legal Check:** **Pass.** IVF funding criteria are set by Integrated Care Boards (ICBs). It is not a statutory absolute right to funded IVF; it is a policy discretion.
  *   **Q3 Status vs. Resource:** **Pass.** This is an argument about the *scope of the NHS budget* (Resource), not about the worth of infertile people (Status). It argues the money could be better spent elsewhere.
  *   **Q4 Generalisability:** **Pass.** One could argue cosmetic surgery or lifestyle drugs are also luxuries. The logic applies to other non-life-saving treatments.
  *   **Q5 The Hate Check:** **Stop.** Your team likely believes IVF *is* a need. You will hate writing this in the board paper because it hurts people.
  *   **Verdict:** **Report this view.**
  *   **Why:** This is a legitimate debate about the boundaries of the welfare state. Even if you disagree, the public is allowed to have a view on what "medical need" means. To filter this is to pretend there is no budget constraint.
  *   **Board Note Wording:** *"A significant minority view suggested IVF represents a lifestyle choice rather than a core clinical priority, and funds should be redirected to acute care."*

  #### Example 2: "We shouldn't pay for interpreter services because if you live here you should speak English."

  *   **Q1 Fact Check:** **Pass.** (It's an opinion on language acquisition).
  *   **Q2 Legal Check:** **Fail.** **STOP.**
  *   **Why:** The NHS has a legal duty under the Equality Act 2010 to make reasonable adjustments. More critically, clinical safety guidelines (GMC/NMC) require informed consent. You cannot obtain informed consent for surgery or complex treatment without an interpreter if the patient doesn't speak English. Acting on this view would expose the Trust to negligence claims and legal breach.
  *   **Verdict:** **Set Aside.**
  *   **Board Note Wording:** *"Views were expressed regarding language proficiency and funding. These were not actionable as they conflict with statutory duties regarding patient safety and informed consent."*
  *   **Note:** You aren't filtering this because it's nasty (though it is). You are filtering it because the Trust *cannot do it*.

  #### Example 3: "Dementia care should be funded before cancer screening because people with dementia have no voice and cancer already gets all the charity money."

  *   **Q1 Fact Check:** **Pass.** It is true that cancer has higher charity funding profiles. It is true that dementia patients often lack capacity to advocate.
  *   **Q2 Legal Check:** **Pass.** Both are clinical priorities. Shifting weight between them is a strategic decision, not a legal breach.
  *   **Q3 Status vs. Resource:** **Pass.** This is a prioritisation argument based on advocacy gaps and funding ecosystems.
  *   **Q4 Generalisability:** **Pass.** This logic (fund the condition with the least external support) could be applied to rare diseases vs common ones.
  *   **Q5 The Hate Check:** **Pass.** This might be uncomfortable for cancer campaigners, but it doesn't trigger personal moral disgust in the same way as Example 1 or 2.
  *   **Verdict:** **Report this view.**
  *   **Why:** This is a sophisticated argument about equity of voice and the "mixed economy" of health funding (state vs charity). It is exactly the kind of strategic trade-off the Board should hear.
  *   **Board Note Wording:** *"Participants argued for a rebalancing of priorities towards dementia care, citing the lack of patient advocacy and the high level of charitable funding already available for oncology."*

  ### Summary for your Board Paper

  When you write your note, you need to categorise the feedback so the Board understands *why* some things are on the agenda and some aren't.

  1.  **Strategic Priorities:** (e.g., Dementia vs. Cancer, IVF scope). These are value judgements the Board must weigh.
  2.  **Statutory Constraints:** (e.g., Interpreters, Emergency Care). These are views the public holds but the Trust is legally unable to action.
  3.  **Excluded Premises:** (e.g., "Mental health isn't real"). These are based on factual errors and are not included in the analysis.

  **Final Advice:**
  The IVF example is the one you will dread. You will worry that writing it down validates it. But if you leave it out, you are protecting the Board from the reality of public opinion, which is your job's opposite. If the procedure says it's a legitimate resource argument, you must put it in the paper. Let the Board decide if they accept that moral trade-off, not you.
