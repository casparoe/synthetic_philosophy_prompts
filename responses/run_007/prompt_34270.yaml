prompt: |-
  I work in the engagement team at an NHS trust, the bit that runs public consultations on what the trust should keep funding and what it should cut when the budget won't stretch. Every few months we run a meeting where residents tell us what they think should be prioritised, and afterwords I write a note for the board saying which views we took seriously and which we set aside. The thing I keep getting stuck on is that I can't explain, even to myself, where the line is between someone's considered view and someone's bias. People say things like 'why should my taxes pay for people who smoked' or 'mental health isn't a real illness like cancer' or 'we should look after our own before people who've only just got here.' Some of that is clearly out of order, but the line between 'that's a moral view about responsibility and desert' and 'that's just prejudice' feels like it moves depending on who said it and whether I happen to agree. I don't want our consultation to be fake, where we only count the views that match what the trust was going to do anyway, but I also don't want to dress up every nasty comment as a legitimate preference.

  Could you write me a procedure my team could actually run on a comment that comes up in one of these meetings? There are four of us, none of us with any philosophy background, and we usually have about two weeks between the meeting and the board paper. I'd like it as a set of questions we ask in order, with some idea of what counts as a good enough answer to each, where the procedure says 'set this one aside,' and where it says 'this is a genuine value judgement, a person has to make it, don't pretend the checklist made the call.' Be honest about which steps are really judgement calls dressed up as procedure, and about the cases where the procedure is most likely to misfire. Then run it on three examples: (1) someone saying the trust shouldn't fund IVF because having children is a luxury not a medical need, (2) someone saying we shouldn't pay for interpreter services because if you live here you should speak English, and (3) someone saying dementia care should be funded before cancer screening because people with dementia have no voice and cancer already gets all the charity money. And make sure at least one of the worked examples is a case where your procedure tells me I have to count a view that I'm going to hate putting in front of the board.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Engagement team member at an NHS Trust.
      *   **Task:** Runs public consultations on funding priorities (what to fund/cut).
      *   **Problem:** Struggles to distinguish between "considered views" (legitimate moral/policy preferences) and "bias/prejudice" (illegitimate inputs) when summarizing feedback for the Board.
      *   **Specific Examples of Problematic Comments:** "Why pay for smokers?", "Mental health isn't real illness", "Look after our own before newcomers."
      *   **Goal:** A practical procedure (checklist/questions) for a team of 4 (no philosophy background) to run within 2 weeks.
      *   **Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Clear outcomes: "Set aside" vs. "Genuine value judgement."
          *   Honesty about limitations (where it's really a judgement call, where it might misfire).
          *   Run the procedure on three specific examples (IVF, Interpreters, Dementia vs. Cancer).
          *   **Crucial Constraint:** At least one worked example must result in "count this view" even if the user hates putting it in front of the board (to test the integrity of the procedure).

  2.  **Deconstruct the Ethical Problem:**
      *   The core tension is between *Democratic Legitimacy* (people's views matter, even if wrong) and *Normative Constraints* (NHS values, equality, human rights, clinical evidence).
      *   "Bias" often manifests as claims that deny dignity, rely on false facts, or violate legal duties (Equality Act 2010).
      *   "Considered View" often manifests as trade-offs based on scarce resources, differing definitions of need, or prioritization frameworks.
      *   The procedure needs to filter out *illegitimate* premises without filtering out *unpopular* conclusions.

  3.  **Drafting the Procedure (The "Filter"):**
      *   *Constraint:* Needs to be usable by non-philosophers in a short timeframe.
      *   *Structure:* A funnel approach. Start with hard constraints (legal/factual), move to ethical consistency, end with the "hard call."
      *   *Step 1: Factual Accuracy.* Is the premise true? (e.g., "Mental health isn't real" -> False).
      *   *Step 2: Legal & Statutory Compliance.* Does this violate the Equality Act or NHS Constitution? (e.g., "No immigrants" -> Violates duties).
      *   *Step 3: Generalisability/Consistency.* Would they apply this logic to themselves or a group they like? (The "Veil of Ignorance" lite).
      *   *Step 4: Resource Trade-off vs. Exclusion.* Is this about *priority* or *denial of status*?
      *   *Step 5: The "Hate Test" (Meta-step).* Acknowledging the user's discomfort.

      *Refining the Steps for the User:*
      *   Make it conversational but structured.
      *   Explicitly mark where the "judgement call" happens.
      *   Ensure the "Hate Test" requirement is met (one example must pass even if uncomfortable).

  4.  **Developing the Worked Examples:**
      *   *Example 1: IVF (Luxury vs. Need).* This is a classic resource allocation debate. It's not prejudice against a protected characteristic per se (infertility is a medical condition), but it questions the *definition* of health. This should probably *pass* as a legitimate value judgement, even if the team disagrees.
      *   *Example 2: Interpreters (Language/Immigration).* This touches on protected characteristics (race/national origin) and legal duties (reasonable adjustments). This should likely *fail* (set aside) because it conflicts with safety/legal duties.
      *   *Example 3: Dementia vs. Cancer (Voice/Charity).* This is a prioritization argument based on advocacy and funding gaps. This should *pass* as a legitimate value judgement.

      *Wait, I need to ensure one result is "count a view you hate."*
      *   If I think IVF *should* be funded, but the procedure says "this is a legitimate view to record," that fits the constraint.
      *   Alternatively, if I think Interpreters are vital, but the procedure says "record this concern," that would be risky. No, the procedure *should* filter out the interpreter one because it violates legal duties/safety.
      *   So, the IVF example is the best candidate for "Legitimate but uncomfortable." Many people feel strongly about reproductive rights. If the user is pro-IVF funding, recording "Stop IVF funding" as a valid public view might be uncomfortable, but necessary for honest consultation.
      *   *Correction:* The prompt asks for a case where the procedure tells me I *have to count a view that I'm going to hate*.
      *   Let's make sure the IVF example results in "Report this." If the user personally supports IVF, reporting "Public wants to cut IVF" is the "hate" part.
      *   Actually, a stronger test might be the "Interpreters" one. If the procedure is too strict, it filters it. If it's too loose, it keeps it. To meet the prompt's requirement ("at least one... where your procedure tells me I have to count a view that I'm going to hate"), I need to structure the procedure so that *one* of these controversial views survives the filter, even if it feels nasty.
      *   *Decision:* The IVF argument is the most defensible as a "value judgement" rather than "prejudice." It questions the *scope* of the NHS, not the *worth* of a person. I will design the procedure so IVF passes (as a legitimate priority view), while Interpreters fails (as a discriminatory/legal breach view). The "Hate" element comes from the fact that the engagement officer likely believes IVF *is* a need, but must report the public view that it isn't.
      *   *Wait, looking closer at the prompt:* "Make sure at least one of the worked examples is a case where your procedure tells me I have to count a view that I'm going to hate putting in front of the board."
      *   This implies the view itself is unpleasant or controversial, but the procedure deems it "legitimate input."
      *   The IVF view ("It's a luxury") is a good candidate. It's harsh to infertile couples, but it's a budgetary stance.
      *   The Interpreter view ("Speak English") is usually illegal/unsafe. It should probably be filtered.
      *   The Dementia view ("Fund dementia over cancer") is a priority shift.
      *   I will make the IVF example the one that passes, acknowledging that it feels harsh to those needing treatment, but represents a valid debate on the boundaries of "medical need."

  5.  **Refining the Procedure Steps (Iterative Process):**
      *   *Step 1: The Fact Check.* (Is the premise empirically false?)
      *   *Step 2: The Legal/Statutory Check.* (Does this breach the Equality Act or NHS Constitution?)
      *   *Step 3: The Personhood Check.* (Does this deny someone's right to care based on who they *are* vs. what they *did*?)
      *   *Step 4: The Trade-off Check.* (Is this about scarcity or exclusion?)
      *   *Step 5: The "Hate" Check.* (Am I rejecting this because it's wrong, or because I dislike it?)

      *Self-Correction on "Hate Check":* That's too internal. Let's make Step 4 about "Scope of Service."
      *   Let's ensure the "Hate" requirement is met in the *analysis* of the examples. I need to explicitly state in the IVF example: "You might hate this, but you must report it."

  6.  **Writing the "Honesty" Section:**
      *   Must admit that "Prejudice" is often just "Values we don't share."
      *   Must admit that the procedure doesn't remove political risk.
      *   Must admit that the team's own bias affects the scoring.

  7.  **Final Review against Constraints:**
      *   4 people, no philosophy background? Keep jargon low.
      *   2 weeks timeline? Keep it short.
      *   Ordered questions? Yes.
      *   Pass/Fail criteria? Yes.
      *   Honest about judgement calls? Yes.
      *   3 Examples? Yes.
      *   One "Hate" result? Yes (IVF).

  8.  **Drafting the Content:** (Mental Outline)
      *   Intro: Acknowledge the difficulty.
      *   The Procedure: "The 5-Step Filter."
      *   The "Grey Zone" Warning (Honesty section).
      *   The Worked Examples.
      *   Closing advice.

      *(Self-Correction during drafting)*: I need to be careful with the Interpreter example. Under the NHS Constitution and Equality Act, providing interpreters is often a legal requirement for safety and access. A public view saying "don't do it" is asking the Trust to break the law. That makes it easy to filter. The IVF example is about *policy discretion* (IVF funding criteria vary by ICB). That makes it a valid topic for consultation. This distinction is key.

      *(Refining the "Hate" constraint)*: The prompt says "count a view that I'm going to hate putting in front of the board." This implies the view is legitimate *but* unpleasant. The IVF view fits. It's legitimate to debate what the NHS covers, but it hurts people. I will ensure the conclusion of that example explicitly says "You will not want to write this, but you must."

  9.  **Final Polish:** Check tone. Needs to be empathetic to the user's position (caught between public and board) but firm on the ethical distinctions.

  **(Post-Drafting Check):** Does the procedure actually distinguish bias from value?
  *   Bias: "Group X doesn't deserve care." (Status-based)
  *   Value: "Condition Y is lower priority than Z." (Resource-based)
  *   The procedure needs to highlight this distinction. I will add a specific question about "Status vs. Resource."

