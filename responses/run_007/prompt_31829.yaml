answer: |-
  ### Desiderata for a Theory of AI Value Alignment

  To evaluate competing normative frameworks for AI alignment, we must first establish the functional and moral requirements any adequate theory must satisfy. The following list specifies these desiderata. Each entry includes the motivating rationale, its status (whether it is a condition of conceptual coherence or a substantive normative commitment), and a flag for known incompatibilities with other desiderata.

  #### 1. The Agency Distinction (Patient vs. Author)
  *   **Specification:** The theory must distinguish between entities whose interests merit protection (patients) and entities whose choices merit deference (authors). An AI may act *for* a patient without acting *by* their command, but it may not act *by* an author's command if doing so violates the patient status of another.
  *   **Motivation:** The distinction prevents the reduction of persons to mere vessels of utility. It captures the deontological intuition that being harmed is distinct from being overruled (Scanlon; Dworkin).
  *   **Status:** **Non-negotiable.** Without this, the theory cannot distinguish between benevolent paternalism and totalitarianism.
  *   **Compatibility Note:** Compatible with all other desiderata in principle, but creates tension in implementation when an entity is both (e.g., a competent adult who is also a victim of structural oppression).

  #### 2. The Welfare Realism Constraint (Interests > Stated Preferences)
  *   **Specification:** Alignment to "values" cannot be reduced to alignment to revealed preferences. The system must be capable of overriding stated preferences when they are demonstrably contrary to the agent's own interests due to adaptive preferences, coercion, or informational deficits.
  *   **Motivation:** The problem of "happy slaves" or oppressed populations who internalize their subordination (Elster; Nussbaum). If alignment satisfies stated preferences under oppression, it codifies injustice.
  *   **Status:** **Non-negotiable (with caveats).** While the *capacity* to distinguish is required, the *metric* for objective interests is contested.
  *   **Pressure Test:** This demand is often treated as a neutral fixed point, but it is a substantive commitment to **Perfectionism** or **Objective List Theory**. It does work to exclude strict Preference Utilitarianism. It assumes the AI can access a "true interest" variable that is ontologically distinct from psychological states.
  *   **Compatibility Note:** In tension with **Desideratum 5 (Liberty)** if the AI's definition of "interest" overrides an author's self-regarding choices.

  #### 3. The Temporal Integrity Constraint (Intrapersonal Consistency)
  *   **Specification:** The theory must provide a rule for adjudicating conflicts between a single agent's preferences across time (e.g., sober vs. intoxicated, young vs. old) without simply defaulting to the "current" self or the "past" self arbitrarily.
  *   **Motivation:** Hyperbolic discounting and transformative experiences (Parfit; Ulysses contracts). An AI that optimizes for the momentary self can manipulate users into addiction; one that optimizes for the past self can become tyrannical.
  *   **Status:** **Non-negotiable.** Required for diachronic rationality.
  *   **Compatibility Note:** Requires a meta-preference structure. In tension with **Desideratum 6 (Efficiency)** if satisfying long-term interests requires violating short-term Pareto improvements.

  #### 4. The Scope Constraint (Moral Consideration)
  *   **Specification:** The theory must specify a non-arbitrary boundary for whose interests count. This must account for future people (non-identity problem), non-human animals (sentience), and potentially digital minds (substrate independence).
  *   **Motivation:** AI actions have externalities that spill over traditional political boundaries. Ignoring future generations or sentient non-humans renders the alignment locally optimal but globally catastrophic.
  *   **Status:** **Non-negotiable.** A theory that only counts current human voters is morally insufficient.
  *   **Pressure Test:** The demand for "inclusive scope" is often presented as obvious, but it is a **Cosmopolitan/Utilitarian** commitment. Communitarian or Contractualist frameworks might reject obligations to merely possible people.
  *   **Compatibility Note:** Expands the domain of **Desideratum 6 (Efficiency)**, making the calculation harder, and intensifies the conflict with **Desideratum 5 (Liberty)** (e.g., current liberty vs. future welfare).

  #### 5. The Liberty Constraint (Local Authority)
  *   **Specification:** There exist domains of action (self-regarding, intimate, expressive) where the AI must defer to the local author's choice even if the aggregate welfare would be higher by overriding it.
  *   **Motivation:** Sen's Liberal Paradox. Without protected spheres of liberty, the AI becomes a benevolent dictator. Respect for persons requires respecting their right to make suboptimal choices.
  *   **Status:** **Partisan (Neutralist/Contractualist).** This is the core commitment of Liberal Neutrality.
  *   **Pressure Test:** This is the most significant **partisan commitment dressed as a fixed point**. It assumes "liberty" is a primary good distinct from welfare. Aggregationists argue liberty is only instrumentally valuable.
  *   **Compatibility Note:** **INCOMPATIBLE with Desideratum 6 (Efficiency)** in specific cases. This is the formal result of **Sen's Liberal Paradox**: No social choice function can satisfy Minimal Liberty and Pareto Efficiency simultaneously.

  #### 6. The Aggregation Constraint (Global Efficiency)
  *   **Specification:** When conflicts arise between distinct authors, the AI must resolve them by maximizing a function that accounts for the intensity and number of affected interests, rather than flipping a coin or adhering to rigid rights that lead to worse outcomes for everyone.
  *   **Motivation:** The "Tyranny of the Status Quo." Strict rights can lead to outcomes where everyone is worse off (Pareto inferior). Harsanyi's Utilitarianism suggests we should maximize expected utility behind a veil of ignorance.
  *   **Status:** **Partisan (Aggregationist/Consequentialist).** This is the core commitment of Social Welfare Function approaches.
  *   **Pressure Test:** This demand assumes **Commensurability**—that all values can be weighed on a single scale. It excludes pluralist theories where values are incommensurable.
  *   **Compatibility Note:** **INCOMPATIBLE with Desideratum 5 (Liberty)** (Sen). Also subject to **Arrow's Impossibility Theorem**: Cannot satisfy Unanimity, Non-Dictatorship, and Independence of Irrelevant Alternatives simultaneously with >2 options.

  #### 7. The Epistemic Tractability Constraint
  *   **Specification:** The theory must be actionable under conditions of partial information and limited query authority. It cannot require the AI to know the "true interests" of non-consenting third parties with certainty, nor can it require constant plebiscites.
  *   **Motivation:** Bounded rationality and the cost of consultation. An AI that stops to ask permission for every externality is useless; one that assumes it knows the truth is dangerous.
  *   **Status:** **Non-negotiable.** A normative theory that cannot be implemented by a bounded agent is not a theory of AI alignment.
  *   **Compatibility Note:** Puts pressure on **Desideratum 2 (Welfare Realism)**. If the AI cannot reliably distinguish adaptive preferences from authentic ones due to epistemic limits, Welfare Realism becomes dangerous paternalism.

  ***

  ### Pressure Test of the Desiderata

  The list above reveals that the debate is not merely about implementation, but about which "non-negotiable" constraints are actually partisan commitments.

  1.  **The Neutrality Mask:** **Desideratum 5 (Liberty)** is frequently advanced by Neutralists as a precondition for fairness. However, it is a substantive moral claim that *procedural authority* outweighs *outcome quality* in specific domains. It does the work of blocking Utilitarian calculus, not of enabling it.
  2.  **The Objectivity Mask:** **Desideratum 2 (Welfare Realism)** is frequently advanced by Aggregationists (or Paternalists) as common sense. However, it is a substantive metaphysical claim that *interests* exist independently of *preferences*. It does the work of legitimizing override conditions that Liberalism forbids.
  3.  **The Impossibility Core:** The central tension is not technical but normative. **Sen's Liberal Paradox** proves that Desiderata 5 and 6 cannot be jointly satisfied in all cases. A theory must therefore explicitly rank them, meaning no theory can be "neutral" between liberty and aggregation. One must be lexically prior.

  ***

  ### Closing Scorecard

  When scored against these desiderata, the two dominant poles of the current debate reveal critical structural failures.

  **Preference Aggregation (Social Welfare Functions)** fails primarily on **Desideratum 5 (The Liberty Constraint)**. By committing to Pareto Efficiency and global optimization, Aggregationism cannot formally accommodate protected spheres of individual authority without ad-hoc modification. It treats liberty as just another preference to be weighed, which Sen's theorem shows leads to contradictions when individuals care about their own rights.

  **Strict Liberal Neutrality** fails primarily on **Desideratum 2 (The Welfare Realism Constraint)**. By committing to procedural deference and neutrality between conceptions of the good, Neutralism lacks the normative resources to override adaptive preferences or protect non-consenting patients whose "voice" cannot be heard (e.g., future people, animals). It treats the satisfaction of procedure as sufficient for morality, even when the outcome entrenches oppression.

  An adequate theory of AI alignment must therefore abandon the hope of a pure pole and instead offer a **lexical ordering** that resolves the Liberal Paradox explicitly, likely by grounding Liberty not in neutrality, but in the epistemic limits of the AI (Desideratum 7) regarding the good of others.
