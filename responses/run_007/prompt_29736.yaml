      *   *Pair 1: C1/C3 vs. C4 (The Rationality of Resentment).* This is the hardest hit. If desert is impossible, resentment is irrational.
      *   *Pair 2: C3 vs. C6 (The Meaning of Blame).* "Blameworthy" usually means "deserves blame." C3 says no desert.
      *   *Pair 3: C4 vs. C5 (Attitudes vs. Punishment).* This is the *seeming* tension that isn't real. Explain why (private vs. public).
      *   *Recommendation:* Adopt the "Hard Incompatibilist Revisionist" label. Change "rationally warranted" to "ineliminable/pragmatically justified." Change "blameworthy" to "morally answerable" or specify non-desert blame.

  7.  **Refining the "Cheapest Repair":**
      *   If the user changes C1, they lose the Hard Incompatibilist core.
