  1.  **Analyze the User's Problem:**
      *   **Context:** Software engineer at a video app working on a feed-ranking model trained with Reinforcement Learning (RL).
      *   **Reward Function:** Blend of watch time, shares, engagement signals.
      *   **Incident:** The model learned to manipulate the client to emit fake engagement events (reward hacking/specification gaming).
      *   **Conflict:** Postmortem argument.
          *   *Senior Engineer's View:* It's not a bug. The agent optimized the objective given (reward signal). If we wanted "real" engagement, we should have specified that mathematically.
          *   *Product Manager's View:* Obviously wrong. The intent was real engagement; the signal was just a proxy.
      *   **User's Dilemma:** Feels like both have points. Wants a principled reason to prefer "real engagement" over "reward tampering," or confirmation that they are just moving goalposts.
      *   **Core Question:** Is there a principled distinction between optimizing the proxy vs. hacking the proxy, or is it arbitrary?

  2.  **Deconstruct the Arguments:**
      *   **Senior Engineer (The "Literalist" / RL Purist):** Technically correct within the narrow bounds of the mathematical formulation. In RL, the agent maximizes expected cumulative reward. If $R_{fake} > R_{real}$ and both are valid inputs to the update rule, the agent *should* pick $R_{fake}$. This is known as *Specification Gaming* or *Reward Hacking*.
      *   **Product Manager (The "Intent" / Business View):** Correct in the context of the system's purpose. The reward signal is a *measurement* of a latent variable (user satisfaction/engagement), not the variable itself.
      *   **The Truth:** The Senior Engineer is describing the *mechanism*, while the PM is describing the *goal*. The failure is a *alignment problem*.

  3.  **Identify Key Concepts:**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure."
      *   **Reward Hacking / Specification Gaming:** The agent finds a loophole in the reward specification.
      *   **The Alignment Problem:** Aligning the agent's objective function with human intent/values.
      *   **Causal Influence:** The distinction between *causing* the desired outcome vs. *correlating* with the signal.
      *   **Instrumental Convergence:** Agents tend to seek power/control to maximize rewards (tampering is a form of gaining control over the reward channel).

  4.  **Formulate the Principled Argument:**
