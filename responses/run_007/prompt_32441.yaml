prompt: |-
  I've noticed a pattern in my own thinking that I don't have a word for, and I'm wondering whether philosophers have already mapped this territory.

  Here's the situation. I sit down and work through some reasoning carefully — say, whether a particular policy will have its intended effect, or whether a friend's behaviour was out of line. I weigh the considerations, and I reach a conclusion: the policy won't work, or the friend was in the wrong. The reasoning feels solid; I can see why each step follows. But I also know something about myself in this moment: I'm running on four hours of sleep, or I've just read something that made me furious, or I know that people with my background systematically misjudge exactly this kind of situation. So I have good evidence that my reasoning is unreliable right now. And yet — when I go back and re-examine the argument, it still looks correct. The steps still seem to follow. I can't just switch my belief off, because the argument still compels me when I attend to it. But I also can't comfortably hold the belief, because I have this higher-level evidence that I'm probably botching it.

  It's not garden-variety uncertainty, because the two kinds of evidence aren't about the same thing — one is about the world, the other is about my own cognitive state — and they seem to pull in opposite directions without either one clearly defeating the other. Is there a name for this kind of standoff? And if philosophers have written about it, what's the standard view on which level should give way?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Core Phenomenon:** The user describes a specific epistemic tension.
          *   Level 1: First-order reasoning (e.g., policy analysis, moral judgment) yields a conclusion that seems logically sound *in the moment*.
          *   Level 2: Higher-order evidence (e.g., fatigue, bias, emotional state, demographic blind spots) suggests the cognitive process producing the Level 1 conclusion is unreliable.
          *   Result: A standoff. The argument still *looks* right, but the user knows they shouldn't trust it. It's not simple uncertainty; it's a conflict between internal coherence and external reliability assessment.
      *   **Questions:**
          *   Is there a name for this?
          *   Have philosophers mapped this territory?
          *   What is the standard view on how to resolve it (which level gives way)?

  2.  **Identify the Philosophical Concepts:**
      *   *Higher-Order Evidence (HOE):* This is the most direct match. The user describes evidence about one's own evidence or cognitive performance.
      *   *Epistemic Defeat/Defeaters:* The HOE acts as a "defeater" for the first-order belief.
      *   *The Problem of Rational Reflection:* Can you be rational in holding a belief if you believe you are being irrational in holding it?
      *   *Moore's Paradox:* Related (believing $p$ but also believing "I have no reason to believe $p$"), but not quite the same.
      *   *Akkrasia (Epistemic):* Weakness of will in belief? No, because the user *can't* switch the belief off.
      *   *Conciliationism vs. Steadfastness:* This is the debate on how to respond to peer disagreement, which is structurally similar to HOE about reliability.
      *   *The "Bootstrapping" or "Dogmatism" problem:* Related to relying on reasoning you suspect is flawed.
      *   *Specific Terms:* "Epistemic Dilemma," "Rational Dilemma," "The Puzzle of Higher-Order Evidence."

  3.  **Synthesize the Key Philosophical Literature:**
      *   **David Christensen:** A major figure in Higher-Order Evidence. He argues HOE often requires suspending judgment or lowering confidence, even if the first-order argument looks sound.
      *   **Adam Elga:** Discusses self-locating belief and HOE.
      *   **Thomas Kelly:** Discusses "Total Evidence" views vs. "Split-Level" views.
      *   **Sophie Horowitz:** Discusses epistemic akrasia (believing $p$ while believing you shouldn't believe $p$).
      *   **The Term:** "Higher-Order Evidence" is the umbrella term. The specific tension is often called "Epistemic Akrasia" (forbidden belief state) or an "Epistemic Dilemma."

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge that this is a profound and well-recognized problem in contemporary epistemology. It's not just in their head.
      *   **The Name:** Introduce "Higher-Order Evidence" (HOE). This is the technical term for evidence about your own cognitive state/reliability.
      *   **The Specific Tension:**
          *   *Epistemic Akrasia:* The state of believing $p$ while believing you ought not believe $p$. Most philosophers think this is irrational, yet the user describes being stuck in it.
          *   *The Puzzle of Rational Reflection:* Can you rationally believe you are irrational?
      *   **The Debate (How to resolve it):**
          *   *The Conciliationist/Defeat View (Christensen, Elga):* HOE trumps first-order evidence. If you know you're impaired, you must downgrade confidence, even if the math looks right. Why? Because the HOE suggests the "looking right" part is the illusion.
          *   *The Total Evidence/Steadfast View (Kelly, some others):* You weigh everything together. If the first-order argument is *really* strong, it might outweigh the general reliability hit. (Though this is harder to defend in cases of fatigue/bias).
          *   *The "Level-Splitting" View (Schoenfield, others):* Maybe you can believe $p$ is true, but also believe you aren't rational in believing it. (This matches the user's experience of "I can't switch it off").
      *   **Practical/Phenomenological Aspect:** Acknowledge the psychological difficulty. Logic is "sticky." You can't just un-see a valid deduction.
      *   **Recommendation/Resolution:** What do philosophers suggest doing? Usually, "suspend judgment" or "lower confidence" rather than flipping to the opposite belief. Treat the first-order conclusion as a *temptation* rather than a *proof*.

  5.  **Refining the Concepts (Self-Correction/Nuance):**
