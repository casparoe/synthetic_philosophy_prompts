answer: |-
  You have stumbled directly into one of the most active and difficult debates in contemporary epistemology. You are describing a conflict between **first-order evidence** (the details of the policy or the friend's behavior) and **higher-order evidence** (evidence about your own cognitive reliability).

  There isn't one single word that captures the entire emotional and logical texture of what you describe, but philosophers generally refer to this as the **Problem of Higher-Order Evidence**, and the specific mental state you are stuck in is often called **Epistemic Akrasia**.

  Here is a map of the territory you've found, the names philosophers use, and the current state of the debate on how to resolve it.

  ### 1. The Terminology

  **Higher-Order Evidence (HOE)**
  This is the umbrella term. First-order evidence is about the world (e.g., "The policy lacks funding"). Higher-order evidence is about your relationship to that evidence (e.g., "I am too tired to evaluate funding correctly"). Your scenario is a textbook case of HOE defeating first-order reasoning.

  **Epistemic Akrasia**
  *Akrasia* is weakness of will (doing what you know you shouldn't). *Epistemic Akrasia* is believing what you know you shouldn't believe.
  Philosophers generally hold a principle called the **Akratic Principle**: *It is irrational to believe $p$ while simultaneously believing that believing $p$ is irrational.*
  Your discomfort comes from the fact that you are hovering right on the edge of this principle. You believe the conclusion ($p$), but you also believe your grounds for $p$ are compromised.

  **Epistemic Dilemma**
  Some philosophers argue that situations like yours create a genuine dilemma: you are rationally required to trust your reasoning (because it looks valid), but you are also rationally required to distrust it (because of the HOE). Since you can't do both, you are in a state where rationality seems to demand contradictory things.

  ### 2. The Philosophical Debate: Which Level Gives Way?

  You asked for the "standard view." In philosophy, there is rarely a single standard, but there is a dominant tension between two camps.

  #### Camp A: The Defeatists (HOE Trumps First-Order)
  **Key Figures:** David Christensen, Adam Elga, Sophie Horowitz.
  **The View:** Higher-order evidence acts as a **defeater**. If you have strong evidence that your cognitive faculties are impaired (sleep deprivation, bias, rage), you are rationally required to lower your confidence in the conclusion, *even if the argument still looks sound to you.*

  **The Reasoning:**
  Christensen argues that HOE suggests your "grip" on the logical connection is an illusion. Just because a valid deduction *feels* valid doesn't mean it *is* valid, especially if you know your logic-center is compromised. To ignore the HOE is to be "dogmatic."
  *   **Verdict:** You should suspend judgment or significantly downgrade your confidence. The fact that the argument "still looks correct" is treated as a symptom of the impairment, not a reason to keep the belief.

  #### Camp B: The Total Evidence View (Steadfastness)
  **Key Figures:** Thomas Kelly, some Bayesian epistemologists.
  **The View:** You should weigh all evidence together. Sometimes, first-order evidence is so overwhelming that it survives the hit from higher-order evidence.
  **The Reasoning:**
  If the math is $2+2=4$, knowing you are tired shouldn't make you doubt the sum. If the first-order reasoning is genuinely airtight, the HOE might be irrelevant.
  *   **Verdict:** However, most proponents of this view admit that in "messy" real-world cases (like policy analysis or social judgment, which you described), HOE usually *does* outweigh first-order intuitions. This view is stronger in cases of logical or mathematical certainty than in empirical reasoning.

  #### Camp C: Level-Splitting
  **Key Figures:** Miriam Schoenfield, others.
  **The View:** This view attempts to validate your exact experience. It suggests it can be rational to believe $p$ is true, while simultaneously believing that *you are not rational* in believing $p$.
  **The Reasoning:**
  It distinguishes between *what is true* and *what I am justified in holding.* You can think, "The policy probably won't work (because the argument for that is sound), but I shouldn't be the one betting the house on it right now (because I'm unreliable)."
  *   **Verdict:** This allows you to hold the belief provisionally without endorsing your own reliability.

  ### 3. Why It Feels Like a Standoff

  You noted: *"I can't just switch my belief off, because the argument still compels me when I attend to it."*

  This highlights the difference between **normative epistemology** (what you ought to believe) and **psychology** (what you can believe).
  Philosophers call this the problem of **Cognitive Penetrability**. We cannot simply choose to stop finding a syllogism compelling. If $A \to B$ and $A$, then $B$ *looks* true to a human brain.

  David Christensen uses the analogy of a visual illusion. Even if you measure the lines and know they are equal length, the Müller-Lyer illusion still *looks* like one line is longer. You can't turn off the visual experience. Similarly, you can't turn off the "logical appearance."
  *   **The Solution:** You treat the first-order conclusion like the visual illusion. You acknowledge it *seems* true, but you refuse to *act* on it as if it were known.

  ### 4. The Consensus on Resolution

  While the debate is technical, the practical consensus among epistemologists regarding your specific scenario (fatigue/bias in empirical reasoning) leans toward **Camp A (Defeatism)**.

  The standard advice is **Suspension of Judgment.**
  You should not flip to the opposite belief (that the policy *will* work). You should move to a state of "I don't know." The higher-order evidence doesn't prove the opposite; it merely undermines the warrant for your current conclusion.

  **How to handle the "stickiness" of the belief:**
  Philosophers suggest adopting a **meta-attitude**. You can say:
  > "My cognitive system is outputting 'Policy will fail.' I recognize this output is likely tainted by fatigue. Therefore, I will tag this output as 'Unverified' and refuse to use it for decision-making until I am rested."

  ### Summary for your mental map:
  1.  **The Phenomenon:** Conflict between First-Order Evidence and Higher-Order Evidence.
  2.  **The State:** Epistemic Akrasia (believing while knowing you shouldn't).
  3.  **The Resolution:** Most philosophers argue Higher-Order Evidence defeats First-Order reasoning in empirical matters. You should suspend judgment, even if the conclusion still "feels" right.
  4.  **Key Reading:** If you want to dive deeper, look for **David Christensen's** work on "Disagreement and Defeat" or **Sophie Horowitz's** papers on "Epistemic Akrasia."

  You are not botching it; you are experiencing the friction between being a rational agent and being a biological organism whose machinery is currently degraded. Philosophy validates that friction.
