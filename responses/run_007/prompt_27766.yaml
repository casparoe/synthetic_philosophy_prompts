  1. The primary rule is that obligatory grammatical marking alters non-linguistic cognition while optional lexical marking does not. A competing rule is that perceptual domains are susceptible to influence, whereas epistemic domains are resistant, though a frequency-based rule family also fits the data.
  2. The grammaticalization rule predicts an effect because the marking is obligatory, aligning with studies 1–3. The domain-specificity rule predicts no effect because source memory is epistemic, aligning with studies 4–6.
  3. The best prediction is an effect because the grammaticalization hypothesis offers a clearer mechanistic explanation for attentional habituation than domain resistance. However, the prediction is weakly determined because her prior data perfectly confounds grammatical obligation with perceptual task types.
  4. Study 4 is the closest analog as it also tested evidential source memory, but it used optional lexical markers rather than obligatory grammar. This makes it indecisive because the null result could stem from the lack of grammaticalization rather than the epistemic nature of the task.
  5. The best discriminator is a non-linguistic perceptual task using speakers of a language with only optional lexical categories for that domain. The grammaticalization rule predicts no effect, while the domain-specificity rule predicts an effect.
