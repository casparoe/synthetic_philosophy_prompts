      *   *Aggregators (Utilitarians, Contractualists like Scanlon, etc.):* Saving five is better because five lives > one life. Refusing to aggregate leads to absurdities (e.g., saving one person from a headache over saving another from death if the headache sufferers are numerous enough? No, that's different. Better example: Saving one from death vs. five from death).
