      *   *Better Idea:* Parfit's "Each-We" distinction or Scanlon's Contractualism.
      *   *Scanlon:* We ask what principles no one could reasonably reject. A principle allowing the one to die to save five might be rejectable by the one. But a principle requiring the one to die to save a million?
