  Can someone walk me through Skolem's paradox properly, because every explanation I've found either handwaves at the model theory or just asserts that the paradox dissolves. Heres my understanding so far: the downward Löwenheim–Skolem theorem says any countable first-order theory with an infinite model has a countable model, and ZFC fits the bill since its language is just ∈ plus the usual logical symbols. So take a countable model M of ZFC. Inside M, Cantor's theorem goes through, so M satisfies the sentence that there is an uncountable set — concretely, M thinks the powerset of the naturals is uncountable. But from the outside, M has only countably many elements total, so the thing M calls uncountable is actually countable. The supposed upshot is that uncountability is relative, maybe even that the whole notion is meaningless. I want to know exactly where this reasoning goes wrong, or if it doesn't. Please explain: (1) mechanically, how can a countable model satisfy that some set is uncountable? What happens to the diagonal argument inside M — why doesn't it produce the bijection that the outside perspective sees? (2) What exactly is relative here: the predicate x is uncountable, the notion of there being a bijection between ω and x, the powerset operation, or what? (3) Does the paradox give us any reason to doubt that the real numbers are uncountable in the ordinary mathematical sense, or is it just a fact about the weakness of first-order logic? (4) What did Skolem himself conclude from it, and why do most set theorists treat it as a curiosity rather than a crisis? I care more about the model theory being right than about the philosophical grandstanding, but I want both.
