answer: |-
  The standard resolution is to constrain rational utility functions to be bounded, which mathematically prevents infinitesimal probabilities from dominating decision-making while preserving the expected utility maximization rule. This approach works because the fanatical conclusion only arises when utility is permitted to grow faster than probabilities shrink, a condition eliminated by imposing an upper limit on possible value. The justification for this constraint lies in the requirement that rational preferences be representable by real numbers; if utility were unbounded, scenarios like the St. Petersburg paradox would generate expected values that are undefined or infinite, meaning no finite cost could ever outweigh the gamble and preferences would fail to be complete or continuous. By treating boundedness as a coherence condition necessary for the utility representation theorem to hold, theorists maintain that rejecting fanaticism is a consequence of mathematical consistency rather than an ad hoc moral intuition. Consequently, while some contemporary philosophers argue that rationality permits unbounded utility and thus accepts fanaticism, the classical decision-theoretic consensus avoids the absurdity by defining rational agents as those whose valuations of outcomes remain within finite limits.
