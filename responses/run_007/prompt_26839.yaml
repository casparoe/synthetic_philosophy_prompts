      *   **Core Question:** Downward causation vs. bottom-up determinism (Do symbols push physical substrate, or are they just shadows?).
      *   **Constraints:** 75 minutes. Do *not* explain the Careenium to the user (they know it). Need a plan for *how* to explain it to the group.
      *   **Specific Requirements:**
          *   Prerequisite idea before describing the billiard table.
          *   One central analogy/example to carry the session (what it needs/lacks).
          *   Anticipated misconceptions (epiphenomenalism vs. dualism) and when to head them off.
          *   A final assessment question (understanding vs. repetition).
          *   What to explicitly bracket/refuse to settle (free will, hard problem).

