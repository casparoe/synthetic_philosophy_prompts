      *   *The Tension:* Physics says only atoms/forces interact (bottom-up). Intuition/High-level description says the "balls" collide and cause things (top-down).
      *   *Hofstadter's Point:* Both descriptions are valid, but the high-level one captures *meaning* and *pattern* that the low-level one obscures, even if the low-level one is "physically complete." It's about levels of description, not spooky forces.

