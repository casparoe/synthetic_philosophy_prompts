answer: |-
  There is no single, universally standardized noun phrase in general parlance or common parliamentary procedure that isolates this exact configuration. However, in legal philosophy and constitutional theory, this scenario is the central case study of what is established as the **"Paradox of Self-Amendment."** This term was popularized by the legal philosopher Peter Suber in his seminal work, *The Paradox of Self-Amendment* (1990).

  While "Paradox of Self-Amendment" describes the *logical problem* generated by the configuration, it does not precisely name the *mechanical configuration* itself. To provide the precise account you requested, the specific configuration is best described by the coined term:

  ### **Procedural Self-Displacement**

  **Definition:**
  A **Procedural Self-Displacement** occurs when a rule change is enacted using a specific procedural authority (e.g., a two-thirds vote), where the content of that change abolishes or alters that very procedural authority, creating a temporal ambiguity regarding whether the validity of the enactment relies on the rule as it existed *before* the change or the rule as it exists *after* the change.

  The core feature of Procedural Self-Displacement is that the *ground of validity* shifts simultaneously with the *act of validation*. The objection you described—that the authorization is "pulled out from under" the vote—is the claim that the displacement creates a **Validity Gap**: a moment where the act is no longer supported by the old rule (which is gone) and was not yet supported by the new rule (which didn't exist when the vote occurred).

  ---

  ### **Distinctions from Related Concepts**

  To ensure precision, Procedural Self-Displacement must be distinguished from three common confusions:

  **1. Versus Ordinary Amendment**
  *   **Ordinary Amendment:** A rule is changed using the existing procedure, but the change applies only to *future* actions or to *different* rules.
  *   **Distinction:** In an ordinary amendment, the procedural "ground" remains stable. For example, if a two-thirds vote is used to change a rule about *gameplay duration*, the voting rule itself remains intact to validate the change. In Procedural Self-Displacement, the rule being changed is the *very rule that authorized the change*.

  **2. Versus Retroactive Invalidation**
  *   **Retroactive Invalidation:** A new rule explicitly states that past acts performed under old rules are now void.
  *   **Distinction:** Retroactivity changes the *legal status of the past*. Procedural Self-Displacement does not necessarily claim the past is changed; rather, it claims the *present validity* of the transition is compromised. The objection is not "the new rule makes the old vote illegal," but "the old vote lacks a sustaining legal basis because the basis ceased to exist." It is a challenge to the *continuity of authority*, not a claim of explicit retroactivity.

  **3. Versus Plain Rule Conflict**
  *   **Plain Rule Conflict:** Two rules exist simultaneously and contradict each other (e.g., Rule A says "vote requires 2/3," Rule B says "vote requires 1/2").
  *   **Distinction:** A conflict implies two valid rules fighting for supremacy at the same time. In Procedural Self-Displacement, the dispute is over *which rule was valid at the precise moment of enactment*. It is a temporal/sequential problem (Time A vs. Time B), not a simultaneous contradiction (Time A vs. Time A).

  ---

  ### **Boundary Cases**

  To further define the boundaries of **Procedural Self-Displacement**, consider the following variations:

  *   **Boundary Case A (The "Safe" Self-Amendment):** A rule requires a two-thirds vote to change rules. A proposal passes with 90% of the vote to lower the threshold to a simple majority.
      *   *Analysis:* This is **not** Procedural Self-Displacement in a problematic sense. Because the vote exceeded the old requirement significantly, the validity is robust under the old rule. The displacement occurs, but the "Validity Gap" is not exploitable because the old rule is satisfied unequivocally.
  *   **Boundary Case B (The "Bootstrap" Attempt):** A rule requires a two-thirds vote. A proposal passes with a *simple majority* to lower the threshold to a simple majority.
      *   *Analysis:* This is **not** Procedural Self-Displacement; this is simply an **Invalid Act**. The old rule was not satisfied, so the new rule never comes into force. There is no displacement because the transition failed.
  *   **Boundary Case C (The Exact Configuration):** A rule requires a two-thirds vote. A proposal passes with *exactly* two-thirds to lower the threshold to a simple majority.
      *   *Analysis:* This **is** Procedural Self-Displacement. The vote meets the old threshold minimally. The new rule immediately renders that threshold obsolete. This is the only case where the "Validity Gap" objection is theoretically potent, as the act rests precisely on the line that is being erased.

  ### **Standard Resolution**

  In most legal and parliamentary systems, this configuration is resolved by the **"Old Rule Validates" doctrine** (associated with legal theorist H.L.A. Hart). The consensus is that the validity of the amendment is determined solely by the rules in force *at the moment of voting*. Once the vote is complete, the old rule has served its purpose and may be discarded without undermining the act that just occurred. The new rule applies prospectively to the *next* vote, not retroactively to the *current* one. Under this doctrine, the objection that the authorization was "pulled out from under" the vote is rejected; the ground only needs to exist while you are stepping on it, not after you have stepped off.
