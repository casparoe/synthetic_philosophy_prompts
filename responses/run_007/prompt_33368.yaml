answer: |-
  Your intuitions are remarkably sophisticated. You have independently rediscovered the central debate in legal philosophy between **Legal Positivism** (law is a matter of social fact and source) and **Natural Law** (law must meet certain moral standards to count as law), with a side concern for the **Rule of Law** (law must be capable of guiding conduct).

  Most of your reactions (Cases 1, 2, 4, 5, 6, 8) are Positivist. You believe law is defined by *how it is made* and *whether it comes from authority*, not by whether it is good. However, Cases 3 and 7 introduce a constraint: you feel that if a rule is too arbitrary or too evil, it loses the label "law."

  To make your view coherent, you need a principle that prioritizes **Source and Form** over **Content**, while acknowledging that "Form" includes the ability to function as a rule.

  ### The Principle: Institutional Authority with Functional Constraints

  Here is the principle that best captures the majority of your reactions:

  > **A rule is law if and only if:**
  > 1.  **Pedigree:** It originates from a source recognized by the legal system (e.g., legislature, established custom, or effective sovereign power); **AND**
  > 2.  **Function:** It possesses the formal characteristics necessary to guide human conduct (e.g., it is general, public, intelligible, and non-retroactive).
  >
  > **Corollary:** The moral justice or injustice of the rule's *content* does not determine its validity as law, though it may determine the moral obligation to obey it.

  This is a version of **Soft Positivism** informed by the "Inner Morality of Law" (associated with legal philosopher Lon Fuller). It separates the *existence* of law from its *merit*, but insists that to exist as law, a command must actually be capable of working as a rule.

  ### Application to Your Cases

  Here is how this principle accounts for your reactions, and where it identifies tension:

  *   **Case 1 (Dictatorship Statute):** **Fits.** It has *Pedigree* (enacted by the ruler) and *Function* (citizens could know what was forbidden). Your intuition that it is "monstrous law" is correct under this principle. The court was morally right to punish the woman, but legally dishonest to claim the statute wasn't law.
  *   **Case 2 (Fugitive Slave):** **Fits.** It has *Pedigree* (properly enacted). Its injustice affects the *obligation to obey*, not its status as law. This explains why you can hold both thoughts without strain.
  *   **Case 3 (Extermination Decree):** **Conflict.** Under this principle, this **is law**. It has *Pedigree* (ruler's decree) and *Function* (it is a general rule targeting a class, intelligible to those enforcing it). Your intuition that it is "not law" contradicts Case 1.
  *   **Case 4 (Military Junta):** **Fits.** It has *Pedigree* (effective sovereign power). Positivism recognizes that a new "Rule of Recognition" emerges when a regime effectively controls the state.
  *   **Case 5 (Unsigned Bill):** **Fits.** It fails *Pedigree*. The recognized source (the constitution) requires a signature; without it, the source is incomplete.
  *   **Case 6 (Commercial Custom):** **Fits.** It has *Pedigree*. In many legal systems, long-standing custom enforced by courts is a recognized source of law.
  *   **Case 7 (Vague Statute):** **Fits.** It fails *Function*. A rule that does not define "unpatriotic" cannot guide conduct. It is too arbitrary to function as law (often called "void for vagueness").
  *   **Case 8 (Dead Letter):** **Fits.** It retains *Pedigree*. The *system* must be generally effective (Case 4), but individual laws do not cease to be valid simply because they are currently unenforced.

  ### Three Further Test Cases

  To see if this principle holds, apply it to these new scenarios:

  **Case A: The Secret Regulation**
  A government agency writes a rule forbidding a certain type of trade. They never publish it. When a merchant engages in the trade, they are fined. The agency produces the secret rule in court.
  *   **Principle Verdict:** **Not Law.**
  *   **Reasoning:** It fails the *Function* constraint. A secret rule cannot guide conduct. You cannot obey a rule you cannot know. (This aligns with your reaction to Case 7).

  **Case B: The Retroactive Tax**
  In 2024, the legislature passes a tax law requiring citizens to pay a 50% tax on all income earned in 2020.
  *   **Principle Verdict:** **Not Law (or Defective Law).**
  *   **Reasoning:** It fails the *Function* constraint regarding retroactivity. Citizens could not have guided their conduct in 2020 based on a 2024 rule. While it has *Pedigree*, it violates the formal requirements necessary for law to function.

  **Case C: The Conscientious Judge**
  A judge in a democracy faces a statute requiring the imprisonment of peaceful protesters. The statute is clear and properly enacted. The judge acquits them, stating in open court, "This statute is too unjust to be applied."
  *   **Principle Verdict:** **The Statute is Law; The Judge is Wrong (Legally).**
  *   **Reasoning:** The statute has *Pedigree* and *Function*. The judge is morally justified (like Case 2), but legally incorrect to deny the statute's validity. This mirrors your unease in Case 1.

  ### The Reaction You Must Abandon

  To achieve coherence, you must abandon or significantly revise your reaction to **Case 3 (The Extermination Decree).**

  **Why?**
  Your reaction to Case 3 is the only one that relies on **Content** (how evil the law is) to determine validity. Every other reaction relies on **Source** (Case 1, 2, 4, 5, 8) or **Form** (Case 6, 7).

  If you maintain that the Extermination Decree is *not law* because it is evil, you are forced to admit that the Statute in Case 1 was also *not law*. But you explicitly stated Case 1 *was* law ("monstrous law"). This is a contradiction.

  **Why you should reconsider:**
  It is tempting to say "that was so evil it wasn't law." This is known as the **Radbruch Formula**. However, accepting this creates a dangerous slippery slope. If "evil laws are not laws," then every criminal defendant can argue the law they broke was too unjust to be valid.

  It is safer and more consistent to adopt the view you already hold in Case 1 and Case 2: **Law and Morality are separate.**
  *   Call the Extermination Decree what it is: **Law.**
  *   But recognize that being law does not command moral obedience.
  *   This preserves the distinction between "Is this law?" (a question of fact/source) and "Should I obey this?" (a question of conscience).

  By accepting that Case 3 is *law* (just like Case 1), you preserve the powerful insight from Case 2: that one can acknowledge a rule is legally valid while simultaneously refusing to enforce or obey it on moral grounds. This separates the legal question from the moral question, which seems to be the core of your most stable intuitions.

  ### A Note on the Asymmetry (Case 6 vs. Case 8)
  You noted an asymmetry: Custom creates law (6), but disuse doesn't unmake it (8).
  **Reconciliation:** This is not a contradiction under the principle.
  *   In **Case 6**, the *source* of the law is the custom itself. The practice *creates* the pedigree.
  *   In **Case 8**, the *source* is the legislature. Disuse is not a recognized method for the legislature to repeal a law. Only a new legislative act (or constitutional expiration) can remove the pedigree.
  *   Therefore, practice can *build* pedigree in one system (customary law), but lack of practice cannot *destroy* pedigree in another (statutory law) unless the system's rules say otherwise.

  ### Summary
  Adopt the **Principle of Institutional Authority with Functional Constraints**.
  1.  **Keep** your Positivist intuitions (Cases 1, 2, 4, 5, 6, 8).
  2.  **Keep** your Rule of Law intuitions (Case 7).
  3.  **Abandon** the Natural Law intuition in Case 3. Accept that evil commands from a sovereign are still "law," however much they ought to be resisted. This aligns Case 3 with Case 1 and resolves the tension.
