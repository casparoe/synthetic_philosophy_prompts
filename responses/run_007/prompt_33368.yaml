  6.  **Refining the Principle Statement:**
      Let's call it **"The Principle of Institutional Authority and Functional Form."**
      *   **Clause A (Authority):** A rule is law if it originates from a source recognized by the legal system's ultimate rule of recognition (e.g., legislature, established custom, or effective sovereign power).
      *   **Clause B (Form):** A rule ceases to function as law if it lacks the formal characteristics necessary to guide conduct (e.g., it is secret, retroactive, contradictory, or unintelligible).
