answer: |-
  The stalemate is fundamentally a methodological impasse over the criteria for ethical theory choice, specifically whether systematic coherence or intuitive plausibility and practical action-guidance should take precedence when they conflict. You are correct that both sides agree on the non-normative facts, which indicates that the dispute is not empirical but rather concerns how those facts constrain normative theory. The consequentialist prioritizes systematic unity and the agent-neutral value of outcomes, treating common-sense intuitions as data points that can be revised if they conflict with the theory's explanatory power. The critic prioritizes extensional adequacy and the practical function of morality for bounded agents, treating common-sense intuitions as fixed constraints that any viable theory must accommodate within a framework of reflective equilibrium. This methodological split is driven by a deeper substantive disagreement about the source of normative reasons: whether they are exclusively agent-neutral (derived from the impersonal value of states of affairs) or partially agent-relative (derived from the agent's own standpoint and projects).

  The empirical disagreements you suspect are secondary; while there are facts about psychological sustainability, the core clash is over the normative significance of those facts. For the consequentialist, the fact that a demand is psychologically difficult does not negate its existence, whereas for the critic, a demand that systematically exceeds human motivational capacity fails the "ought implies can" test or renders morality alienating. Progress in this debate will not come from one side finally proving the other wrong, but from shifting the framework of discussion. First, participants should distinguish between optimality and obligatoriness, allowing for a category of the supererogatory where actions are best but not required, which dissolves the sharpness of the demand without abandoning the value of outcomes. Second, the debate should move toward functionalism, asking explicitly what social or personal work morality is supposed to do, rather than assuming a single monistic function. Finally, progress requires empirical collaboration to determine the actual long-term effectiveness of high-sacrifice lifestyles, as evidence that extreme demandingness reduces overall utility would undermine the consequentialist position on its own terms, while evidence of sustainable high-impact giving would weaken the critic's appeal to psychological limits.
