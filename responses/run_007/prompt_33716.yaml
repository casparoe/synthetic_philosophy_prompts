  ok so I had a baby three months ago and somehow that sent me down a rabbit hole about population ethics — I read Parfit on the repugnant conclusion and now I can't stop thinking about whether I did something wrong by bringing a life into existence that's only, like, moderately good. But here's the thing: every paper I read starts from some intuition about a particular puzzle case (the repugnant conclusion, the non-identity problem, the mere addition paradox) and then builds a theory to dodge that one thing, and then someone else points out that the fix creates a worse problem somewhere else. I want to step back.

  Before I even look at another theory, I want to know: what does a theory of population axiology actually have to get right? Give me the full list of desiderata — the cases it has to handle, the distinctions it can't collapse, the formal constraints it has to satisfy — with the reasoning behind each. And then tell me which ones are genuinely non-negotiable and which are just aesthetic preferences of one camp. If there's some subset that can't be jointly satisfied (which I suspect is the whole point of the literature), flag that. I don't need the scorecard for every theory, just the criteria and which one knocks out the most candidates.
