      *   *Better:* "If the 'I' is a strange loop, what happens to the 'I' when the neural firing patterns (the bottom level) stop obeying the symbolic logic (the top level)?"
      *   *Best:* **"In a normal hierarchy, control flows one way (top-down). In a tangled hierarchy, describe specifically how the 'top' level (the thought 'I am hungry') causes changes in the 'bottom' level (neurons), given that the 'top' level is made entirely of the 'bottom' level."**

