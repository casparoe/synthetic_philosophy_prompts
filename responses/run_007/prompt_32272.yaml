      *   *Maria's Position:* Represents the "Revisionist" view (Jeff McMahan is the key figure here). Key concepts: Moral asymmetry based on justice of cause, individual responsibility, analogy to domestic violence/crime.
      *   *Core Conflict:* Does the justice of the cause (*jus ad bellum*) affect the moral permissions of the individual soldier (*jus in bello*)?

  3.  **Evaluate Each Move (Drafting Assessments):**

      *   *(1) David: Moral Equality of Combatants.*
          *   *Strength:* Aligns with International Humanitarian Law (IHL) and practical stability. Prevents total war.
          *   *Weakness:* Philosophically counterintuitive. How can killing for an unjust cause be equal to killing for self-defense?
          *   *Verdict:* Strong pragmatically/legally, weak philosophically. (Mixed/Strong depending on lens). Let's call it *Strong within its framework, but philosophically contestable.*

      *   *(2) Maria: Asymmetry/Aggressor vs. Defender.*
          *   *Strength:* Aligns with basic moral intuition (self-defense is okay, aggression is not).
          *   *Weakness:* Hard to implement. Requires soldiers to judge national policy.
          *   *Verdict:* Strong morally/intuitively.

      *   *(3) David: Epistemic Limitation (Soldiers don't know).*
          *   *Strength:* Realistic. Soldiers aren't philosophers or intelligence analysts.
          *   *Weakness:* Doesn't absolve all responsibility (e.g., manifestly unjust wars like Nazi Germany).
          *   *Verdict:* Strong regarding *blame*, weaker regarding *permission*. (Excuse vs. Justification).

      *   *(4) Maria: Domestic Analogy (Beating someone up).*
          *   *Strength:* Highlights that ignorance doesn't usually justify harm in individual morality.
          *   *Weakness:* War isn't exactly like a street fight (scale, state authority, confusion).
          *   *Verdict:* Strong philosophical point, but maybe disanalogous in practice.

      *   *(5) David: Coercion & Comradeship.*
          *   *Strength:* Acknowledges real pressure (conscription, punishment) and human psychology (protecting friends).
          *   *Weakness:* "Protecting comrades" can justify anything (gang logic). Coercion varies wildly.
          *   *Verdict:* Mixed. Comradeship is a partial excuse, not a justification. Coercion is fact-dependent.

      *   *(6) Maria: Gang Analogy & Volunteers.*
          *   *Strength:* Dismantles the "comradeship" justification effectively. Highlights agency of volunteers.
          *   *Weakness:* Might underestimate the social/psychological coercion even in volunteer armies.
          *   *Verdict:* Strong rebuttal to David's specific points.

      *   *(7) David: Implausible Moral Picture (Too Demanding).*
          *   *Strength:* Appeals to moral common sense. If a theory says most soldiers are murderers, maybe the theory is wrong (or the world is tragic).
          *   *Weakness:* "Is-Ought" problem. Truth isn't determined by comfort.
          *   *Verdict:* Weak as a truth claim, strong as a pragmatic warning.

      *   *(8) Maria: Uncomfortable Truth vs. Pragmatic Lie.*
          *   *Strength:* Philosophically rigorous. Morality shouldn't bend for comfort.
