answer: |-
  # The "Know-How" Intuition Quiz

  **Instructions:** Read each scenario carefully. Choose the answer that best matches your gut reaction. Don't overthink it, and don't worry about philosophical terms—just pick what sounds true to you.

  ---

  ### 1. The Sports Theorist
  Imagine a man who has never played soccer. He has never kicked a ball. However, he has memorized every rule, studied the physics of ball trajectory, and can perfectly explain the optimal strategy for every position on the field.
  **Does this man know how to play soccer?**
  *   **A.** Yes. He possesses all the information and rules required to play.
  *   **B.** No. Until he can actually kick the ball and move on the field, he doesn't *know how*.
  *   **C.** He knows *about* soccer, but "knowing how" requires a mix of his knowledge and some actual practice.

  ### 2. The Natural Prodigy
  A child picks up a violin for the first time and immediately plays a complex concerto perfectly. However, if you ask her, "What finger goes on which string?" or "What is the time signature?", she has no idea. She can't explain what she's doing.
  **Does this child know how to play the violin?**
  *   **A.** Yes. Her ability to play proves she knows how, even if she can't explain it.
  *   **B.** No. To truly know how, she must understand the rules and theory behind the music she is playing.
  *   **C.** She knows how to *produce the sound*, but she doesn't fully know how to *play the instrument* until she understands the theory.

  ### 3. The Amnesia Patient
  A patient suffers brain damage that wipes out their memory of facts (they don't know their name, the year, or what a bike is). However, when you put them on a bicycle, they ride it perfectly without falling.
  **Did the patient retain the knowledge of how to ride a bike?**
  *   **A.** Yes. The ability remained even though the facts were lost.
  *   **B.** No. "Knowing how" is a type of memory. If they don't remember what a bike is, they are just reacting mechanically.
  *   **C.** They retained the *skill*, but lost the *knowledge*. These are two different things in the brain.

  ### 4. The Instruction Manual
  You want to learn how to fix a specific car engine. You memorize the entire 500-page repair manual word-for-word. You can recite every step. But you have never touched a wrench.
  **Do you know how to fix the engine?**
  *   **A.** Yes. You possess all the necessary propositions to guide the action.
  *   **B.** No. You know *that* certain steps need to be taken, but you don't know *how* to take them physically.
  *   **C.** You know the theory of fixing it, but you lack the practical know-how.

  ### 5. The Chess Computer
  An AI program beats the world champion at chess. It calculates millions of moves per second. It does not have a body, feelings, or consciousness.
  **Does the AI know how to play chess?**
  *   **A.** Yes. It successfully navigates the game using information processing.
  *   **B.** No. It is just shuffling symbols. It doesn't "know" anything; it just computes.
  *   **C.** It simulates knowing how, but real know-how requires a living agent.

  ### 6. The Bird's Nest
  A weaverbird builds an incredibly complex, knotted nest. It has never been taught. It cannot explain why it ties the knots the way it does.
  **Does the bird know how to build a nest?**
  *   **A.** Yes. It successfully performs the task reliably.
  *   **B.** No. "Knowing" implies understanding. The bird is just following instinct/genetic programming.
  *   **C.** It has the ability, but attributing "knowledge" to an animal is misleading.

  ### 7. The Broken Leg
  A professional sprinter breaks both legs. She is in a cast for six months and cannot run at all.
  **During the six months in the cast, does she know how to sprint?**
  *   **A.** Yes. She hasn't lost the knowledge; she just lost the physical capacity to exercise it.
  *   **B.** No. "Knowing how" is an ability. If you are unable to do it, you don't know how.
  *   **C.** She retains the *mental* knowledge of how, but temporarily lacks the *physical* know-how.

  ### 8. The Lucky Shot
  A person who has never held a basketball closes their eyes, throws the ball backward over their head, and it goes straight through the hoop. They do it once, but cannot repeat it.
  **Did that person know how to make that shot?**
  *   **A.** No. Knowing how implies reliability. That was just luck.
  *   **B.** Yes. They successfully guided the ball to the hoop, even if by accident.
  *   **C.** They knew how to *throw* the ball, but didn't know how to *make the shot*.

  ### 9. The Hypnotized Pianist
  A master pianist is hypnotized. The hypnotist suggests, "You have forgotten how to play the piano." The pianist sits at the instrument and stares at their hands, unable to move them to play, though their muscles are healthy.
  **Did the hypnosis destroy their knowledge of how to play?**
  *   **A.** Yes. If they cannot access the ability to guide their action, the knowledge is gone.
  *   **B.** No. The knowledge is still there, but there is a blockage preventing them from using it.
  *   **C.** The *propositional* knowledge is there, but the *procedural* access is blocked.

  ### 10. The Translation Test
  Imagine a perfect dictionary existed. It could translate every physical movement and muscle contraction required to swim into written sentences.
  **If you read this dictionary, would you know how to swim?**
  *   **A.** Yes. If the description is perfect enough, reading it is equivalent to knowing how.
  *   **B.** No. You can describe the motion perfectly without ever being able to stay afloat.
  *   **C.** You would know the *theory* of swimming, but not the *practice*.

  ---

  # Scoring Key

  Tally your answers.

  *   **Mostly A's:** The Intellectualist
  *   **Mostly B's:** The Rylean Anti-Intellectualist
  *   **Mostly C's (or a even mix):** The Hybrid/Pluralist

  *(Note: In Questions 3, 7, and 9, Option A and B are the strongest dividers. In Questions 1, 4, and 10, Option A is strongly Intellectualist and B is strongly Rylean.)*

  ## Your Results

  ### (a) The Intellectualist (Mostly A's)
  **View:** Knowing-how is really just a species of knowing-that.
  **What this means:** You believe that skills are fundamentally based on information. To know how to ride a bike is to know, in some way, the facts about how to balance and pedal. If someone can explain the rules perfectly (Question 1), they possess the knowledge, even if their body fails them. You likely view the brain as an information processor where "ability" is just the successful execution of internal data.
  **Philosophical Allies:** Jason Stanley, Timothy Williamson.

  ### (b) The Rylean Anti-Intellectualist (Mostly B's)
  **View:** Knowing-how is a distinct kind of thing (a disposition or ability).
  **What this means:** You believe that intelligence is shown in *doing*, not in reciting facts. You think it is possible to have the skill without having the facts (Question 2), and having the facts without the skill (Question 4). For you, "knowing how" is about being reliably able to succeed under the right conditions. If you can't do it (or explain it via rules), you don't have the knowledge.
  **Philosophical Allies:** Gilbert Ryle, Stephen Hetherington.

  ### (c) The Hybrid/Pluralist (Mostly C's or Mixed)
  **View:** Knowing-how and knowing-that are distinct but deeply interconnected.
  **What this means:** You resist reducing one to the other. You see a difference between "theoretical knowledge" and "practical skill," but you think they often work together. You might believe that animals have abilities but not "knowledge" (Question 6), or that a broken leg disables the *exercise* of knowledge but not the knowledge itself (Question 7). You occupy the middle ground: skills aren't just facts, but they aren't just mindless reflexes either.
  **Philosophical Allies:** John Bengson, Marc Moffett (Moderate Intellectualism), or various Neo-Ryleans.

  ---

  # Instructor's Guide: Philosophical Caveats & Flags

  If you are running this quiz for the club, keep these limitations in mind when discussing the results.

  ### 1. Incoherent or Unexplored Combinations
  **The "Success-Only" View (Question 8, Option B):**
  If a student argues that the "Lucky Shot" counts as knowing how (Q8-B) but also argues that the "Sports Theorist" does *not* know how (Q1-B), they hold a view that is rarely defended.
  *   **Why:** Most philosophers agree that *reliability* is necessary for know-how. If you succeed once by luck, you lack the *ability* or *disposition* to succeed again. Ryleans emphasize disposition; Intellectualists emphasize grasp of truth. Both usually reject luck as knowledge. If a student holds this, ask them: "If I close my eyes and throw a dart and hit the bullseye once, do I know how to play darts?"

  **The "Body-Only" View (Question 3, Option B):**
  If a student claims the Amnesia Patient (Q3) does *not* know how to ride because they lack factual memory, they are taking a very hardline Intellectualist stance that conflicts with standard neuroscience.
  *   **Why:** This view implies that procedural memory (muscle memory) is not a form of knowledge. This is defensible philosophically but requires arguing that "knowledge" requires conscious access to propositions, which is a high bar.

  ### 2. Positions the Quiz Cannot Reliably Separate
  **Strong Intellectualism vs. Tacit Intellectualism:**
  The quiz struggles to distinguish between someone who thinks know-how *is* propositional knowledge (Strong Intellectualism) and someone who thinks know-how *requires* propositional knowledge that the agent cannot articulate (Tacit Intellectualism).
  *   **The Problem:** In Question 2 (The Prodigy), an Intellectualist can choose Option A by arguing, "She possesses the rules tacitly in her brain, even if she can't speak them." A Rylean chooses Option A because "Rules don't matter, ability does." Both pick A, but for different reasons.
  *   **Discussion Tip:** Ask students who picked A on Q2: "Does the child have the rules in her head and just can't say them, or does she not need the rules at all?"

  **Ryleanism vs. Embodied Cognition:**
  The quiz groups "Anti-Intellectualism" under the Rylean label. However, modern "Embodied Cognition" theorists might answer like Ryleans (prioritizing the body) but for different scientific reasons (neural networks vs. dispositions).
  *   **The Problem:** The quiz diagnoses the *intuition* (Ability > Proposition), not the *metaphysical explanation*.
  *   **Discussion Tip:** Clarify that Ryle talked about "dispositions" (behavioral tendencies), while modern cognitive scientists might talk about "neural pathways." The quiz sorts the intuition, not the scientific mechanism.

  ### 3. The "Hybrid" Trap
  Be careful with students who score as Hybrids (Mostly C).
  *   **Risk:** Sometimes "Hybrid" is just a synonym for "I haven't thought about this enough to commit."
  *   **Fix:** In the discussion, press the Hybrid students on Question 10 (The Translation Test). If they say reading the perfect dictionary *would* teach you to swim, they are actually Intellectualists. If they say it *wouldn't*, they lean Rylean. True Hybrids usually say, "It would give you the knowledge-that, but you'd still need to enter the water to get the knowledge-how."

  ### 4. Question 5 (The AI) Ambiguity
  Question 5 is a "poison pill" for the quiz's validity if not moderated.
  *   **Issue:** Answers here often depend on the student's view on *consciousness* or *AI sentience*, not just know-how. A student might say the AI doesn't know how (Option B) because it isn't alive, not because they are Ryleans about knowledge.
  *   **Fix:** Tell students to answer based strictly on the *performance vs. information* aspect. "Ignore whether the robot has a soul. Does its calculation count as knowing the rules, or just following them?"
