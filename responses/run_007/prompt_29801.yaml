prompt: |-
  Two people in my political theory reading group have been arguing for months about whether citizens in a liberal democracy may base their political positions on religious reasons. One is a Rawlsian about public reason: he thinks that on constitutional essentials and matters of basic justice, citizens owe one another reasons they can reasonably be expected to share, and while he has no problem with people also voicing religious reasons, he denies that those can serve as the decisive justification for laws that coerce people who don't share the faith. The other thinks this gets it exactly backward. She says requiring religious citizens to translate their deepest commitments into secular or public vocabulary treats those commitments as second-class, and that a law can be fully legitimate even if the main case for it, made honestly in public, is a religious argument. I finally got them to agree to an adversarial collaboration instead of another year of talking past each other.

  Write the document they should produce. Include: (1) a numbered list of claims about pluralism, coercion, legitimacy, and the role of reasons in politics that both of them can sign, in wording that is not vague enough to paper over anything; (2) a table of the exact remaining disagreements, with each side's position phrased so that side would accept it as accurate rather than a caricature; (3) the cruxes, meaning the sub-questions such that settling one would move at least one of them; and (4) for each crux, a concrete case or kind of evidence both would agree bears on it, with each side's prediction recorded in advance. I suspect one crux is whether the supposedly neutral justifications for the contested cases they actually care about (school vouchers, abortion, immigration) really are freestanding, or whether they always smuggle in a comprehensive doctrine; another is whether public reason demands something asymmetric from religious citizens that it never demands of secular ones. But dont just take my guesses—make the cruxes as sharp as you can. Format it as numbered agreed claims, then a disagreements table, then a cruxes section.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A political theory reading group with two members arguing about the role of religious reasons in liberal democracy (Rawlsian Public Reason vs. Religious Integrity/Inclusivism).
      *   **Task:** Create an "Adversarial Collaboration Document."
      *   **Components:**
          1.  Numbered list of agreed claims (pluralism, coercion, legitimacy, role of reasons) - specific, not vague.
          2.  Table of exact remaining disagreements (phrased charitably/accurately).
          3.  Cruxes (sub-questions where resolution moves the needle).
          4.  Concrete cases/evidence for each crux with advance predictions from both sides.
      *   **Constraint:** Do not just accept the user's guesses about cruxes (neutrality smuggling, asymmetry); make them sharp.
      *   **Format:** Numbered agreed claims -> Disagreements Table -> Cruxes Section.

  2.  **Deconstruct the Positions:**
      *   **Person A (Rawlsian/Public Reason):**
          *   Core: Legitimacy requires public justification on constitutional essentials/basic justice.
          *   Constraint: Religious reasons alone are insufficient for coercive laws affecting non-believers.
          *   Nuance: Religious reasons can be voiced (proviso), but not be the *decisive* justification.
          *   Value: Civic respect, stability, avoiding domination.
      *   **Person B (Inclusivist/Religious Integrity):**
          *   Core: Requiring translation marginalizes religious citizens (second-class status).
          *   Constraint: Laws can be legitimate even if the primary public case is religious.
          *   Value: Authenticity, democratic inclusion, epistemic humility (secular reasons aren't truly neutral).
          *   Critique of A: "Secular" reasons often hide comprehensive doctrines anyway.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground without glossing over the fight. Both are likely liberals/democrats.
      *   *Claim 1 (Pluralism):* Both agree society is deeply pluralistic and this is permanent, not just a historical accident.
      *   *Claim 2 (Coercion):* Both agree state coercion needs justification. It's not enough to say "because we won the vote."
      *   *Claim 3 (Legitimacy):* Both agree legitimacy is distinct from legality. A law can be legal but illegitimate.
      *   *Claim 4 (Rights):* Both agree on basic liberal rights (speech, worship, vote). The fight is about *justification*, not the rights themselves.
      *   *Claim 5 (Civic Duty):* Both agree citizens have a duty to engage respectfully, not just impose will by force.
      *   *Refinement:* Make sure these aren't too fluffy. "Respectfully" needs to be defined carefully so B doesn't feel it implies A's constraints. Let's focus on the *need* for justification rather than the *content*.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the core tension: The *Sufficiency Condition* for Legitimacy.
      *   *Row 1: The Justificatory Requirement.* A: Public reasons necessary. B: Religious reasons sufficient.
      *   *Row 2: The Burden of Translation.* A: Necessary for civic respect. B: Unjust burden/marginalization.
      *   *Row 3: Epistemic Status of Secular Reasons.* A: Accessible/Shareable. B: Often disguised comprehensive doctrines.
      *   *Phrasing:* Ensure B doesn't feel caricatured as a theocrat, and A doesn't feel caricatured as secularist hostile to faith.
      *   *Refinement:* Use terms like "Constitutional Essentials" (Rawlsian term) to be precise.

  5.  **Drafting Section 3 & 4: Cruxes and Evidence/Predictions:**
      *   *User's Guesses:* (1) Are secular reasons truly neutral? (2) Is there asymmetry?
      *   *Critique:* These are good, but need to be sharper "cruxes" (in the CFAR/Arbital sense). A crux is something where if you change your mind on X, you change your mind on the main thesis.
      *   *Crux 1: The "Translation" Feasibility & Integrity.*
          *   Question: Is it actually possible for religious citizens to find public reasons for their positions *without* violating their conscience or diluting the truth?
          *   Case: Abortion (Personhood).
          *   Prediction A: Secular arguments about bodily autonomy/personhood exist and are sufficient.
          *   Prediction B: Secular arguments are thin; the real weight is theological/metaphysical.
      *   *Crux 2: The Stability/Legitimacy Empirical Claim.*
          *   Question: Does allowing religious justifications actually lead to instability/domination, or does excluding them lead to alienation/radicalization?
          *   Case: Civil Rights Movement (King's religious rhetoric).
          *   Prediction A: King succeeded *because* he also offered constitutional arguments; purely religious appeals would have failed/alienated.
          *   Prediction B: King's power came *from* the religious prophetic voice; secularizing it would have weakened the moral force and legitimacy.
      *   *Crux 3: The Asymmetry of "Comprehensive Doctrines".*
          *   Question: Do secular liberal doctrines (e.g., Kantian autonomy, Utilitarianism) demand the same bracketing as Religion?
          *   Case: LGBTQ+ Rights (Equality vs. Religious Liberty).
          *   Prediction A: Liberal equality is a political value, not a comprehensive doctrine; it fits public reason.
          *   Prediction B: Liberal equality is a comprehensive moral view that conflicts with religious views equally; bracketing it is impossible.
      *   *Refinement:* Let's sharpen Crux 3. It's about whether "Public Reason" is itself a comprehensive doctrine.
      *   *Alternative Crux:* The "Decisive" vs. "Supplementary" distinction.
      *   *Let's stick to the prompt's hint but sharpen it.*
      *   *Crux 1 (Epistemic):* Are secular justifications for "Constitutional Essentials" actually freestanding?
      *   *Crux 2 (Civic Status):* Does the duty of civility require bracketing, or does it require honest disclosure?
      *   *Crux 3 (Empirical/Stability):* What causes democratic breakdown?

      *   *Decision:* Let's go with:
          1.  **The Freestanding Claim:** Can core political values be justified without comprehensive doctrines? (Tests A's optimism vs. B's skepticism).
          2.  **The Marginalization Claim:** Does the Public Reason requirement disproportionately burden religious citizens compared to secular comprehensive liberals? (Tests the asymmetry).
          3.  **The Stability Claim:** Which norm better preserves long-term social peace among deep disagreement? (Tests the consequentialist underpinning).

      *   *Concrete Cases:*
          1.  Abortion (Personhood status).
          2.  Civil Rights/MLK (Historical precedent).
          3.  Same-Sex Marriage (Equality vs. Tradition).

  6.  **Review and Refine:**
      *   *Tone:* Academic, precise, collaborative but adversarial.
      *   *Formatting:* Clear headings, tables, numbered lists.
      *   *Check against constraints:* Did I include predictions? Yes. Is the wording vague? Need to ensure Claim 1 isn't just "we like democracy."
      *   *Self-Correction on Agreed Claims:* Make sure they don't accidentally solve the debate. For example, don't agree that "reasons must be shareable" because B denies that. Agree that "coercion requires *some* justification."

  7.  **Final Polish:** Check the "Crux" definition. A crux must be something where if B changed their mind, they would accept A's conclusion (or vice versa).
      *   *Crux 1:* If secular reasons *are* always smuggled comprehensive doctrines, A's distinction collapses.
      *   *Crux 2:* If religious exclusion *does* cause radicalization more than inclusion, A's stability argument weakens.
      *   *Crux 3:* If religious citizens *cannot* separate their faith from their politics without self-betrayal, A's duty is impossible.

      *Let's write it.*

      *(Self-Correction during drafting)*: Make sure the table clearly distinguishes "Public Reason Liberal" (A) and "Inclusivist Democrat" (B). Ensure the predictions are falsifiable or at least clearly distinct.

      *(Refining the Agreed Claims)*:
      1.  Pluralism is permanent.
      2.  Coercion needs justification (not just power).
      3.  Legitimacy > Legality.
      4.  Violence/Force is off the table.
      5.  Constitutional Essentials are the stakes.

      *(Refining the Cruxes)*:
      1.  **The "Secular Mask" Crux:** Are purportedly public reasons actually freestanding?
      2.  **The "Civic Burden" Crux:** Is the translation requirement asymmetric?
      3.  **The "Stability" Crux:** Which approach prevents civil strife?

      *Wait, I need to make sure the predictions are specific.*
      For the "Secular Mask" crux, the case should be a specific policy debate (e.g., Human Dignity in Bioethics).
      For the "Civic Burden," the case should be the psychological experience of the citizen.
      For "Stability," historical examples.

      *Let's finalize the document structure.*

      *Wait, one more check:* The prompt asks for "wording that is not vague enough to paper over anything." I need to be careful not to use words like "reasonable" without defining them, or avoid them if they are contested. Rawls uses "reasonable" technically. B might reject "reasonable" if it implies secular constraints. I will use "mutually acceptable" for A and "honestly offered" for B in the disagreement section, but in the agreement section, stick to "justification."

      *Okay, ready to generate.*
answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** The Role of Religious Reasons in Liberal Democratic Justification
  **Participants:** Proponent of Public Reason (PPR) vs. Proponent of Religious Inclusivism (PRI)
  **Date:** October 26, 2023

  ## I. JOINTLY AFFIRMED CLAIMS
  *The following propositions are accepted by both PPR and PRI. These claims define the boundary of the debate and exclude positions neither party holds (e.g., theocracy or authoritarianism).*

  1.  **Permanent Pluralism:** We agree that modern democratic societies are characterized by a plurality of incompatible yet reasonable comprehensive doctrines (religious, secular, philosophical), and that this pluralism is not a historical accident but a permanent feature of free human reason.
  2.  **The Coercion Principle:** We agree that the use of state coercive power (law, police, imprisonment) requires moral justification beyond mere majority rule or procedural correctness. Might does not make right.
  3.  **Legitimacy vs. Legality:** We agree that a law can be legally enacted yet politically illegitimate if it violates fundamental norms of justification owed to citizens.
  4.  **Scope of Dispute:** We agree this debate concerns **Constitutional Essentials** and **Matters of Basic Justice** (e.g., voting rights, liberty of conscience, basic economic structure), not mundane policy decisions (e.g., zoning laws, highway speed limits).
  5.  **Rejection of Violence:** We agree that regardless of the depth of disagreement, political contestation must remain non-violent and adhere to democratic procedures for transferring power.
  6.  **Civic Respect:** We agree that citizens owe one another a duty of civic respect, which precludes treating political opponents as enemies to be destroyed rather than collaborators in a shared system.
  7.  **The Proviso:** We agree that religious citizens are permitted to introduce religious language into public political discourse, provided it is not the *sole* mechanism for finalizing coercive policy (PPR interpretation) OR provided it is offered honestly as the actual motivation (PRI interpretation). *Note: We agree religious speech is permitted; we disagree on its justificatory weight.*

  ## II. TABLE OF EXACT DISAGREEMENTS
  *The following table isolates the specific points of contention. Each position is phrased to be acceptable to the holder of that view.*

  | Domain | PPR Position (Rawlsian Public Reason) | PRI Position (Religious Inclusivism) |
  | :--- | :--- | :--- |
  | **1. The Sufficiency Condition** | On Constitutional Essentials, religious reasons alone are **insufficient** to legitimize coercive laws. A secular/public justification must be available and decisive. | On Constitutional Essentials, religious reasons can be **sufficient** to legitimize coercive laws, provided they are offered honestly in the public sphere. |
  | **2. The Duty of Translation** | Religious citizens have a moral duty to translate their convictions into "public reasons" (accessible to non-believers) to demonstrate civic respect for those who will be coerced. | Requiring translation imposes an unjust, asymmetric burden that treats religious commitments as second-class compared to secular comprehensive doctrines. |
  | **3. Epistemic Status of Secular Reasons** | Secular/Public reasons (e.g., liberty, equality, order) are **freestanding**; they do not rely on hidden metaphysical or religious assumptions and are shareable by all reasonable persons. | Secular/Public reasons are often **disguised comprehensive doctrines** (e.g., Kantianism, Utilitarianism) that are no more "neutral" than religious views and are not truly shareable by all. |
  | **4. Source of Legitimacy** | Legitimacy derives from the **accessibility** of the justification to the coerced subject. If you cannot understand my reason, I cannot coerce you based on it. | Legitimacy derives from the **integrity and inclusivity** of the process. Excluding deep motivations alienates citizens and undermines the democratic truth-seeking function. |

  ## III. CRUXES AND EVIDENTIARY TESTS
  *A crux is a sub-question such that changing one's mind on it would significantly shift one's position on the main debate. For each crux, we identify a concrete case or type of evidence and record advance predictions.*

  ### Crux 1: The "Freestanding" Empirical Claim
  **Question:** Are the "public reasons" typically offered for Constitutional Essentials actually freestanding, or do they inevitably rely on controversial metaphysical commitments that are functionally equivalent to religious doctrines?

  *   **Why this is a crux:**
      *   **PPR:** If public reasons are *always* smuggled comprehensive doctrines, the distinction between religious and secular justification collapses, and the Public Reason constraint becomes arbitrary.
      *   **PRI:** If public reasons *can* be genuinely freestanding and accessible without metaphysical baggage, the claim that Public Reason is inherently biased loses force.

  *   **Concrete Case:** **The Debate over Human Dignity in Bioethics (e.g., Embryonic Research).**
      *   *Context:* Both sides argue about the moral status of the embryo.
  *   **Advance Predictions:**
      *   **PPR Prediction:** We will find that arguments based on "potentiality" or "human dignity" can be articulated using biological and legal categories accessible to non-religious persons without invoking ensoulment or divine image.
      *   **PRI Prediction:** Analysis will show that "secular" dignity arguments implicitly rely on metaphysical assumptions about personhood that are as contestable and non-universal as religious claims about ensoulment.

  ### Crux 2: The Asymmetry of Burden
  **Question:** Does the duty of Public Reason demand a psychological or moral sacrifice from religious citizens that it does not demand from secular citizens holding comprehensive liberal doctrines (e.g., Kantian autonomy)?

  *   **Why this is a crux:**
      *   **PPR:** If the burden is symmetric (secular liberals also must bracket their deep philosophical commitments), then the charge of discrimination fails.
      *   **PRI:** If the burden is asymmetric (secular liberals' views count as "public" while religious views count as "private"), then Public Reason violates liberal neutrality.

  *   **Concrete Case:** **Same-Sex Marriage and Anti-Discrimination Law.**
      *   *Context:* A secular liberal argues from "autonomy/equality"; a religious citizen argues from "natural law/scripture."
  *   **Advance Predictions:**
      *   **PPR Prediction:** We will find that the secular liberal can justify marriage equality via political values (equal citizenship, legal stability) without invoking their deeper philosophical views on the nature of the good life, whereas the religious citizen relies essentially on doctrine.
      *   **PRI Prediction:** We will find that the secular liberal's concept of "equality" is itself a comprehensive moral vision that conflicts with traditional religious views, yet they are not required to bracket it, while religious citizens are required to bracket their conflicting vision.

  ### Crux 3: The Stability/Strain Consequence
  **Question:** Which normative framework (Public Reason vs. Inclusivism) empirically reduces the risk of democratic breakdown, radicalization, or civil strife in a pluralistic society?

  *   **Why this is a crux:**
      *   **PPR:** If allowing religious justifications for coercion leads to factionalism and domination (e.g., sectarian conflict), then Public Reason is necessary for stability.
      *   **PRI:** If excluding religious reasons leads to alienation, radicalization, and the feeling of being second-class citizens, then Inclusivism is necessary for stability.

  *   **Concrete Case:** **The U.S. Civil Rights Movement (1954–1968).**
      *   *Context:* Martin Luther King Jr.'s use of prophetic religious language vs. the NAACP's legalistic secular arguments.
  *   **Advance Predictions:**
      *   **PPR Prediction:** The Movement succeeded *to the extent* it translated religious claims into Constitutional/Secular language (14th Amendment); purely religious appeals would have failed to secure broad legitimacy among non-believers and risked backlash.
      *   **PRI Prediction:** The Movement's moral force and legitimacy derived *primarily* from its religious prophetic voice; secularizing the rhetoric would have weakened the motivation of the base and failed to challenge the moral complacency of the opposition.

  ---
