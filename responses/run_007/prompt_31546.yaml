answer: |-
  - **The Speech**

  Thank you for that introduction, and thank you to the department for hosting this lecture. // Looking out at this room, I see a map of the very tension we are here to discuss. In the front rows, I see colleagues from the philosophy department who can recite *Political Liberalism* from memory. In the back, I see clergy from my own diocese and others, who know me from the pew. And in between, students who are likely wondering if this lecture counts toward extra credit. //

  I stand before you as a newly elected city councilmember. I also stand before you as a practicing Catholic. These are not hyphenated identities for me; they are integrated. Yet, if you pull the transcripts of our city council meetings from the past six months, you will find a conspicuous absence. You will find arguments about zoning budgets, housing density, and public safety. You will find citations of municipal code, economic data, and constitutional law. // You will not find a single quote from Scripture. You will not find an appeal to Church authority. You will not find an explicit argument from natural law.

  I want to explain why that is. //

  I need to explain this carefully, because there are two ways to misunderstand my silence. To my secular colleagues, specifically those well-versed in public reason liberalism, my silence might look like a prudent compliance with the duty of civility. You might assume I bracket my comprehensive doctrine to ensure legitimacy. To my religious colleagues and parishioners, that same silence might look like cowardice. You might worry I am ashamed of the Gospel, or that I have accepted a secularist framework that relegates faith to the private sphere. //

  If I am honest, I must tell you that neither of those interpretations is quite right. I do not leave my faith at the door of the council chamber. But I do leave its *language* at the door. //

  There is a philosophical reason for this, and I hope it satisfies my colleagues in political theory. It is the reason of efficacy and respect. When I propose a policy to expand affordable housing, I am not asking my colleagues to vote based on my salvation. I am asking them to vote based on our shared commitment to the welfare of this city. If I argue that we must house the homeless because the Book of Leviticus commands care for the stranger, I have invoked an authority that my secular colleagues do not recognize and my Muslim or Jewish colleagues do not share. I have effectively ended the conversation. // I have turned a public debate into a sermon.

  Rawls and Audi teach us that public reason is a constraint of legitimacy. I want to suggest it is also a constraint of love. // To insist on religious premises in a pluralistic legislature is to demand that my neighbor accept my authority to govern their conscience. In a city council, we are co-authors of coercive law. If I cannot explain why a law is good without appealing to a revelation you do not hold, I am not treating you as a free and equal citizen. I am treating you as a subject of my theology.

  But that is only half the answer. // If I stop there, I alienate the believers in this room. You might ask: "Is not truth, truth? If the Church teaches that human dignity is inviolable, why not say so?"

  Here is the theological reason for my silence. // My faith is the engine, not the billboard. The source of my conviction is deeply religious. I care about the poor because I believe every person is made in the *Imago Dei*. I care about justice because I believe in a God who demands it. But the *argument* I make in public must be translatable. This translation is not a betrayal of faith; it is an act of hospitality.

  Think of it like building a bridge. My faith gives me the vision of where the bridge should go. It gives me the moral courage to start building. But the materials I use to build that bridge must be materials everyone can walk on. // If I build the bridge out of sacramental theology, only those who share my sacraments can cross it. If I build it out of public reason—data, shared values, constitutional principles—then everyone can cross.

  Let me give you a concrete example. // Last month, we voted on a measure to increase shelter capacity. In my own mind, the vote was clear because of the Parable of the Sheep and the Goats. I heard Christ's voice in the needs of the unhoused. But in the council chamber, I did not cite the Parable. I cited the reduction in emergency room costs. I cited the stabilization of property values in surrounding neighborhoods. I cited the moral obligation of a wealthy municipality to care for its vulnerable, framed as a civic duty rather than a religious one.

  Did this dilute the truth? // No. It made the truth accessible. My secular colleagues voted for the shelter because the data made sense. My religious colleagues voted for it because their faith compelled them. We arrived at the same destination via different roads. If I had insisted everyone travel my road, we would never have left the station.

  I know this is harder. // It is easier to say "God wills it" than to crunch the numbers on zoning variance. It is more satisfying to quote Isaiah than to draft a budget amendment. But democracy is not designed for satisfaction; it is designed for coexistence. //

  Some might argue that this creates a bifurcated self. That I am one person in the pew and another in the council chamber. I reject that. I am the same person. But I recognize that different rooms require different languages. I speak the language of liturgy at Mass because I am among those who share my covenant. I speak the language of public reason at City Hall because I am among those who share my citizenship. // To confuse the two is to fail at both worship and governance.

  I want to be clear about what I am not saying. // I am not saying religious voices should be silent in the public square. They must be loud. But there is a difference between the public square and the legislative chamber. In the square, we persuade. In the chamber, we decide. When we decide for everyone, we must justify our decisions to everyone. //

  This approach requires humility. It requires me to accept that my religious convictions, while true for me, are not the property of the state. It requires my secular colleagues to accept that my religious motivations are not suspect, even if my arguments are secular. // We meet in the middle ground of the common good.

  So, when you read the transcripts and see no Scripture, do not think I have forgotten my God. // Think that I am respecting my neighbor. Think that I am trying to build a bridge wide enough for all of us to walk across together. // My faith tells me what is right. Public reason helps me make it law for all of us. And in that tension, in that hard work of translation, I find a way to serve both my City and my Lord. //

  Thank you.

  - **Commentary**

  **Philosophical Moves**
  The speech navigates the "public reason" debate by shifting the justification from *legitimacy* (the Rawlsian standard) to *efficacy and hospitality*. By framing public reason as an act of love and bridge-building rather than just a constraint of liberal legitimacy, I aim to satisfy the philosophers' demand for reciprocity without triggering the believers' fear of secular exclusion. I distinguish between the *context of discovery* (faith provides the motivation/vision) and the *context of justification* (public reason provides the argument). This aligns with Robert Audi's "secular rationale" principle without explicitly invoking the technical terminology that might alienate the undergraduates or parishioners.

  **Audience Management**
  For the philosophers, I acknowledge the "duty of civility" and the problem of coercive law, signaling I understand the stakes of political liberalism. For the believers, I use theological language (*Imago Dei*, Parable of the Sheep and Goats) to show my faith is robust, not apologetic. The bridge metaphor serves as a common ground image that simplifies the philosophical tension for the students while remaining robust enough for the faculty. I explicitly validate the religious voice in the "public square" versus the "legislative chamber" to prevent accusations of privatizing faith entirely.

  **Omissions and Critique Points**
  I deliberately avoided the "translation proviso" debate (whether religious reasons are permissible if secular ones are also provided). A strict Rawlsian might press me on whether religious motives should be excluded entirely from deliberation, not just final justification. A theologian (particularly an integralist) might argue that separating the "language" from the "conviction" creates an unsustainable dualism that impoverishes the public square of true moral truth. I also sidestepped specific contentious issues (like abortion or euthanasia) where "translation" is often impossible; a critic would ask if this model holds when secular and religious premises fundamentally diverge on the definition of the good itself. I gestured at this with "coercive law," but left the hard cases unsaid to maintain the speech's unifying tone.
