          *   *Conflict:* Parfit (in *Reasons and Persons*) argues against the "rounding to zero" move in collective cases (e.g., Harmless Torturers). If everyone reasons like (2), democracy fails.
          *   *Nuance:* Parfit distinguishes between "imperfect duties" and "perfect duties," or between cases where the group action is certain vs. probabilistic.
          *   *Verdict:* There is a tension here. If (5) is accepted fully, (2) becomes harder to defend unless the probability is *literally* zero (which it isn't) or the cost of voting is too high (which the user implies is just "annoying").

