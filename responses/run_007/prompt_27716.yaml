      *   **Tension A: (1) & (2) vs. (3) [The Empirical/Quantitative Claim]**
          *   *Physics Mindset:* Is the supply chain actually "lumpy" in a way elections aren't?
          *   *Farming:* Orders are batched. If 10,000 chickens are ordered, buying one might trigger the next batch *if* you are near the margin. Expected utility calculations (like Norcross or Singer) suggest a non-trivial probability of triggering a batch.
          *   *Voting:* Elections *are* threshold-based (winner takes all or electoral college). The threshold is just *much* higher (millions vs. dozens/hundreds).
          *   *Conflict:* If (3) claims elections *aren't* threshold-based, that's empirically false. Elections are the definition of thresholds. The difference is probability, not mechanism.
          *   *Resolution:* (3) needs refinement. It's not that elections lack thresholds, but that the *probability* of hitting the threshold is orders of magnitude lower in voting than in grocery shopping.
