          *   *Verdict:* They are distinct justificatory structures. Holding both is "pluralistic," but risky. If (3) is weakened, (4) carries the load. If (4) is just a backup for (1), it looks suspicious.

      *   **Tension C: (5) vs. (2) [Parfit's Aggregation]**
