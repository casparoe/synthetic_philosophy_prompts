          *   *Verdict:* (3) is empirically shaky as stated, but salvageable if framed as probability density near the margin.

      *   **Tension B: (3) vs. (4) [Consequentialism vs. Deontology]**
          *   *(3)* relies on Expected Utility (Consequentialism). It justifies (1) and (2) based on *outcomes* (harm caused).
          *   *(4)* relies on Complicity (Deontology/Virtue Ethics). It justifies (1) based on *participation*, explicitly stating it matters "independently of causal consequences."
          *   *Conflict:* If (4) is true, do we need (3)? If complicity makes buying chicken wrong, the expected utility calculation is secondary. Conversely, if expected utility makes buying chicken wrong, do we need complicity?
