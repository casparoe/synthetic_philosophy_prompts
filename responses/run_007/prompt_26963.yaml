prompt: |-
  I'm on my university's academic integrity board and we've got a case that's splitting us down the middle. A PhD student in philosophy submitted a paper to a journal that takes a famous argument from the epistemology literature—an argument about when evidence justifies belief revision—and "ports" it wholesale to aesthetics, arguing that the same structure explains how we revise aesthetic judgments. The paper is completely upfront about what it's doing. But when you lay the two texts side by side, the mapping is exhaustive: every theoretical term in the original has a one-to-one replacement in the new paper, every inferential step has a direct analogue, and even the examples are transformed by a systematic substitution rule (scientific experiments become art exhibitions, lab observations become gallery viewings, etc.). The student's advisor says this is legitimate philosophical methodology—you test a conceptual structure by seeing whether it survives translation to a new domain, and the fact that the mapping is so tight is exactly what makes it interesting. The complaining faculty member says it's plagiarism with a find-and-replace function, and that the student contributed nothing of their own beyond the initial hunch to swap domains. Our board needs to decide whether this rises to plagiarism. Draft the decision memo I'll circulate before our meeting, with a clear recommendation and reasoning that genuinely engages the strongest version of the losing side's argument.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's academic integrity board.
      *   **Task:** Draft a decision memo to circulate before a meeting.
      *   **Case:** A PhD philosophy student submitted a paper to a journal. The paper takes a famous epistemology argument and "ports" it to aesthetics.
      *   **Key Facts:**
          *   The mapping is exhaustive (one-to-one term replacement, direct analogues for inferential steps, systematic example substitution).
          *   The student is *completely upfront* about the source and method.
          *   Advisor supports it (legitimate methodology: testing conceptual structure via translation).
          *   Complaining Faculty opposes it (plagiarism/find-and-replace, no original contribution beyond the hunch).
      *   **Requirements:** Clear recommendation, reasoning that engages the strongest version of the *losing* side's argument.

  2.  **Determine the Core Ethical/Academic Issue:**
      *   Is this plagiarism? Plagiarism usually involves presenting someone else's work/ideas as your own *without attribution*. Here, attribution is explicit.
      *   Is it lack of originality/scholarly merit? This is usually a matter for peer review/journal editors, not an integrity board, unless the lack of originality crosses into "salami slicing" or "self-plagiarism" (not applicable here) or misrepresentation of contribution.
      *   Is it "textual plagiarism" vs. "idea appropriation"? The structure is copied, but the domain is changed. In philosophy, structural analogies are common. However, an *exhaustive* mapping suggests a lack of independent derivation.
      *   **The Crux:** The tension between *methodological transparency* (Advisor's view) and *substantive intellectual labor* (Complainant's view).

  3.  **Formulate a Recommendation:**
      *   *Option A (Find Plagiarism):* Hard to sustain because the student was upfront. Plagiarism requires deception regarding source.
      *   *Option B (No Violation):* More defensible. The student cited the source. The act of applying a formal structure to a new domain *is* a philosophical contribution, even if the structure is rigid. The journal should decide on publishability, not the integrity board.
      *   *Decision:* I will recommend **No Violation of Academic Integrity**, but with significant caveats about scholarly standards. This aligns best with the definition of plagiarism (deception/attribution) while acknowledging the faculty member's valid concern about rigor.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the case and the recommendation.
      *   **Case Summary:** Neutrally describe the student's action, the advisor's defense, and the complaint.
      *   **Analysis/Reasoning:**
          *   *Definition of Plagiarism:* Focus on attribution and deception. The student was transparent.
          *   *Nature of Philosophical Work:* Acknowledge that structural mapping is a valid method (formalism).
          *   *Engaging the Losing Side (The Complainant):* This is crucial. I need to validate their concern. It *does* look like minimal effort. It *does* risk trivializing the target domain. I need to explain why, despite this, it doesn't meet the threshold of *misconduct*.
          *   *Jurisdiction:* Distinguish between *integrity* (honesty) and *quality* (scholarly merit). The board polices honesty; peer review polices quality.
      *   **Recommendation:** Clear statement.
      *   **Next Steps/Guidance:** Suggest educational feedback rather than punishment.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* If I say "No Violation," does it look like I'm ignoring the "find-and-replace" accusation?
      *   *Fix:* I need to explicitly address the "find-and-replace" claim. If the student claimed they *derived* the argument independently, it would be plagiarism. Since they claimed they *ported* it, it's a methodological choice.
      *   *Critique:* Is it possible this is "copyright infringement"?
      *   *Fix:* Unlikely in philosophy arguments (ideas aren't copyrightable, expression is). The prompt focuses on academic integrity/plagiarism, not legal copyright. Stick to academic norms.
      *   *Tone:* Needs to be formal, impartial, yet decisive. It's a memo for colleagues, so it should be respectful but firm on policy.

  6.  **Developing the "Strongest Version of the Losing Argument":**
      *   The complainant isn't just whining; they are protecting the value of the PhD. If a PhD can be earned by swapping nouns, what does the degree mean?
      *   I need to acknowledge that *transparency does not automatically equal scholarly sufficiency*.
      *   I need to distinguish between "not plagiarism" and "good philosophy." The board decides the former; the department/journal decides the latter.

  7.  **Final Polish:** Check the constraints.
      *   Clear recommendation? Yes.
      *   Engage strongest losing argument? Yes.
      *   Format? Memo.
      *   Context? University Academic Integrity Board.

  8.  *(Drafting the content based on the above thoughts...)*
      *   *Subject:* Case Review: [Student Name/ID Redacted]
      *   *Opening:* Purpose of memo.
      *   *Facts:* Student ported Epistemology -> Aesthetics. Disclosed source.
      *   *Analysis:* Plagiarism requires misappropriation. This was appropriation *with* credit.
      *   *Counter-argument:* The "hollow scholarship" concern. Valid, but belongs to peer review.
      *   *Conclusion:* No sanction. Advisory note on scholarly depth.

  9.  **Final Review against Safety Guidelines:** Does this promote cheating? No, it analyzes a specific case to determine if cheating occurred. It upholds academic integrity standards by distinguishing between plagiarism and low-originality scholarship.

  10. **Final Output Generation** (Proceed to generate the memo).
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board Members
  **FROM:** [Your Name/Chair], Academic Integrity Board
  **DATE:** October 26, 2023
  **SUBJECT:** Pre-Meeting Brief & Recommendation: Case #2023-PHIL-09 (PhD Candidate Submission)

  **1. Purpose**
  This memo summarizes the facts surrounding Case #2023-PHIL-09 and provides a preliminary recommendation for our upcoming deliberation. The case concerns a PhD candidate in the Department of Philosophy accused of plagiarism regarding a manuscript submitted for publication.

  **2. Case Summary**
  *   **The Allegation:** A faculty member alleges that the student's submitted paper constitutes plagiarism. The paper applies a well-known argument from epistemology (regarding evidence and belief revision) to the domain of aesthetics (regarding aesthetic judgment revision).
  *   **The Evidence:** A comparative analysis shows an exhaustive structural mapping between the source text and the student's paper. Theoretical terms, inferential steps, and illustrative examples correspond one-to-one via a systematic substitution rule (e.g., "scientific experiment" $\rightarrow$ "art exhibition").
  *   **The Defense:** The student and their advisor argue this is a transparent methodological choice. The paper explicitly cites the original epistemological argument and states its intent to test the argument's structural validity by "porting" it to a new domain.
  *   **The Conflict:** The complainant argues the work lacks independent intellectual labor ("find-and-replace scholarship"). The advisor argues that testing the portability of logical structures is a legitimate philosophical method.

  **3. Preliminary Recommendation**
  **I recommend that the Board find NO VIOLATION of academic integrity policies.**

  While the complainant's concerns regarding scholarly rigor are substantive, they do not meet the definition of plagiarism or academic misconduct under our university's code. This matter pertains to *scholarly merit*, which falls under the jurisdiction of peer review and departmental evaluation, rather than *academic integrity*, which governs honesty and attribution.

  **4. Reasoning**

  **A. The Definition of Plagiarism**
  Our policy defines plagiarism as the unacknowledged use of another's ideas, words, or structures, presented as one's own. The critical element is *misrepresentation of origin*.
  In this case, the student was explicitly upfront. The source text is cited; the methodological approach (structural porting) is declared. There is no attempt to deceive the reader regarding the genesis of the argument's structure. Therefore, the technical criteria for plagiarism are not met. To sanction this as plagiarism would require us to expand the definition to include "lack of sufficient transformation," which is a standard of quality, not honesty.

  **B. Engaging the Complainant's Argument (The Strongest Case for Sanction)**
  We must take the complainant's position seriously. Their argument is not merely that the student copied text, but that the student bypassed the *intellectual labor* required for a doctoral contribution.
  *   **The "Hollow Scholarship" Concern:** The complainant argues that if a PhD candidate can generate a paper by swapping nouns within a rigid algorithm, the degree loses its value. They contend that true philosophical application requires re-deriving the logic to fit the nuances of the new domain, not just forcing the new domain to fit the old logic.
  *   **The Risk of Trivialization:** There is a valid concern that an exhaustive mapping might ignore disanalogies between epistemology and aesthetics. If the student ignored friction points where the analogy breaks down to maintain the "perfect map," they may be guilty of intellectual negligence or poor methodology.

  **Why this does not constitute misconduct:**
  While these are valid critiques of the *quality* of the philosophy, they are not evidence of *dishonesty*.
  1.  **Methodological Validity:** In formal philosophy, testing the domain-invariance of an argument is a recognized strategy. If the student hypothesizes that the logical structure is domain-neutral, demonstrating that via a tight mapping is a way of proving that hypothesis.
  2.  **Jurisdictional Boundary:** The Academic Integrity Board is not a peer-review body. We are not equipped to judge whether the "porting" method yields interesting philosophy or whether the student contributed enough original thought to merit publication. That judgment belongs to the journal editors and the department's PhD committee. If the work is trivial, the journal should reject it. If it is insufficient for a dissertation, the department should flag it.
  3.  **Transparency as Cure:** The student's transparency neutralizes the ethical violation. By citing the source and the method, they invite the very critique the complainant is offering. They are effectively saying, "I am testing if this structure holds." If the structure is too rigid, the academic community will critique the *argument*, not the *integrity*.

  **5. Potential Risks of a "Violation" Finding**
  If we rule this as plagiarism, we risk setting a precedent that penalizes structural or formalist methodology in the humanities. We would be effectively ruling that any argument that closely mirrors a previous logical form is suspect unless significantly "transformed." This could stifle legitimate interdisciplinary work where the value lies precisely in the structural similarity.

  **6. Suggested Action Plan**
  I propose the Board take the following steps:
  1.  **Dismiss the Plagiarism Charge:** Formally clear the student of academic misconduct.
  2.  **Issue an Advisory Note:** While not sanctioning the student, the Board Chair should communicate to the Department Graduate Director that while this is not misconduct, the Board notes the concern regarding "scholarly depth." The Department may wish to review whether this paper meets the *quality* standards for the PhD, separate from integrity issues.
  3.  **Educational Opportunity:** Offer the student a voluntary workshop on "Scholarly Contribution vs. Attribution." This reinforces that while they did not steal, the expectation for doctoral work remains high originality, and transparency does not automatically guarantee scholarly sufficiency.

  **7. Conclusion**
  We must distinguish between work that is *dishonest* and work that is *derivative*. This case appears to be the latter. Derivative work is a failure of scholarship, not necessarily a failure of integrity. I look forward to discussing this nuance with you all at the meeting.

  Please review the attached comparative texts prior to our session.

  [Signature]
