answer: |-
  # Joint Position Paper on the Concept of Disease
  **Prepared for the Workshop on the Philosophy of Medicine**
  **By:** [Naturalist Proponent] & [Normativist Proponent]
  **Date:** October 2023

  ## Preamble
  This document is the product of a six-month adversarial collaboration. Our goal was not to reach a consensus on the definition of disease, but to map the topology of our disagreement with sufficient precision that future empirical or philosophical work could adjudicate it. We distinguish below between what we take to be settled ground, the precise loci of our remaining disputes, and areas we suspect are merely verbal.

  ---

  ## Section I: Areas of Agreement (The Common Ground)
  *The undersigned affirm the following claims as jointly acceptable premises for further debate.*

  1.  **Paradigm Cases:** There exists a stable set of paradigm cases that any adequate account of disease must classify correctly. Both parties agree that advanced metastatic cancer, bacterial pneumonia, and cystic fibrosis are diseases. Both parties agree that being taller than average, having green eyes, and pregnancy are not diseases.
  2.  **The Harm Constraint:** A condition cannot be a disease unless it is capable of causing harm, suffering, disability, or increased risk of death to the individual possessing it. A biological anomaly that confers no disadvantage and causes no suffering is not a disease, regardless of its statistical rarity.
  3.  **The Biological Constraint:** Biological facts constrain the classification of disease. Social values alone cannot constitute a disease in the absence of some underlying physiological, anatomical, or psychological mechanism. (i.e., One cannot have a disease solely by social fiat; there must be a "body" involved).
  4.  **Clinical Utility:** The primary pragmatic function of the concept 'disease' is to justify medical intervention, exemption from normal social obligations (the "sick role"), and the allocation of healthcare resources. An account of disease that renders the concept useless for clinical triage is defective.
  5.  **Distinction from Injury:** While related, 'disease' and 'injury' are distinct categories. A broken leg caused by external trauma is an injury; the susceptibility to bone fragility underlying it may be a disease. Both accounts must respect this intuitive distinction.
  6.  **Non-Disputable Features:** We agree that the following features of the world are not in dispute: (a) Human organisms have evolved functional architectures; (b) Statistical distributions of traits vary across populations and environments; (c) Humans have shared goals (survival, reproduction, avoidance of pain) and divergent individual goals (career, specific family planning).
  7.  **The Meta-Goal:** We agree that settling the concept of disease is a **hybrid project**. It requires conceptual analysis to clarify our commitments, scientific inquiry to determine biological facts, and normative reflection to determine the purposes of medicine. We disagree on which of these three is *foundational*, but agree all three are necessary.

  ---

  ## Section II: The Disagreements Table
  *This table isolates the specific propositions where our views diverge, the cruxes upon which those divergences turn, and the concrete cases we will use to test them.*

  | # | Precise Statement of Disagreement | Crux (The Underlying Philosophical Hinge) | Evidence / Case Study & Divergent Predictions |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Value-Dependency Claim**<br><br>**[Nat]:** Disease is a value-free theoretical term referring to a type of biological dysfunction. Values determine *response* to disease, not the *identity* of disease.<br><br>**[Norm]:** Disease is a value-laden normative term. Biological dysfunction is necessary but insufficient; the condition must be *evaluated* as undesirable to count as a disease. | **The Euthyphro Question of Medicine:**<br>Is a condition a disease *because* it is biologically dysfunctional (and we therefore value avoiding it)? OR is it biologically dysfunctional *and* we value avoiding it, which together make it a disease? | **Case: Asymptomatic Hypertension.**<br>Biologically abnormal pressure, no current harm, risk of future harm.<br><br>**[Nat] Prediction:** It is a disease immediately upon detection of the dysfunction, regardless of the patient's valuation of the risk.<br>**[Norm] Prediction:** It is a "risk factor" or "condition," but becomes a disease only when the risk is evaluated as sufficiently harmful to warrant the sick role. |
  | **2** | **The Reference Class Problem**<br><br>**[Nat]:** Statistical normality must be judged against a species-design reference class (e.g., "healthy adult humans"), filtering out environmental variations.<br><br>**[Norm]:** Statistical normality is irrelevant except as a proxy for harm. If a trait is statistically normal for a specific environment but harmful, it can still be a disease. | **The Source of Normativity:**<br>Does the norm come from *evolutionary history* (Naturalist) or *current contextual goals* (Normativist)? | **Case: High-Altitude Pulmonary Edema (HAPE).**<br>Susceptibility is statistically normal for lowlanders at altitude, but harmful.<br><br>**[Nat] Prediction:** Not a disease in the lowlander at altitude; it is an environmental mismatch. The dysfunction lies in the design, not the statistical performance in that context.<br>**[Norm] Prediction:** It is a disease state relative to the goal of survival in that environment, regardless of whether the lowlander's physiology is "species-typical." |
  | **3** | **Controversial Case: Infertility**<br><br>**[Nat]:** Infertility is a dysfunction of the reproductive mechanism. It is a disease regardless of the individual's desire for children.<br><br>**[Norm]:** Infertility is a disease only relative to the individual's life plans. For those not desiring children, it is a biological variation, not a disease. | **The Location of Harm:**<br>Is harm objective (failure of biological goal) or subjective (frustration of personal goal)? | **Case: Voluntary Childlessness.**<br>A person with blocked fallopian tubes who explicitly does not want children.<br><br>**[Nat] Prediction:** This person has a disease (reproductive dysfunction) even if they do not seek treatment.<br>**[Norm] Prediction:** This person has a biological anomaly, but labeling it a 'disease' is a category error because the normative condition (harm/undesirability) is absent. |
  | **4** | **Controversial Case: Aging (Senescence)**<br><br>**[Nat]:** Aging involves cumulative cellular dysfunction and deviation from species-typical survival design. It is theoretically a disease (or cluster of diseases).<br><br>**[Norm]:** Aging is universal and inevitable. Classifying it as a disease medicalizes normal life and dilutes the concept's utility for resource allocation. | **The Universality Constraint:**<br>Can a universal, inevitable process be a disease? Does 'disease' imply 'treatable/avoidable'? | **Case: Cellular Senescence.**<br>The accumulation of senescent cells is harmful and dysfunctional.<br><br>**[Nat] Prediction:** If we can identify the mechanism, aging is a disease state. Calling it 'normal' is a naturalistic fallacy.<br>**[Norm] Prediction:** Even if dysfunctional, aging lacks the *contrast class* required for disease. It is the background condition of existence, not a deviation warranting the 'sick role'. |
  | **5** | **The Boundary Problem**<br><br>**[Nat]:** The boundary between health and disease is sharp in principle (functioning vs. dysfunctioning), though epistemically vague in practice.<br><br>**[Norm]:** The boundary is inherently vague because values and harms exist on a continuum. There is no fact of the matter about the exact threshold. | **Ontic vs. Epistemic Vagueness:**<br>Is the fuzziness in our *knowledge* of the biology, or in the *nature* of the concept itself? | **Case: Pre-Diabetes / Borderline Personality.**<br>Cut-off points for diagnosis are arbitrary.<br><br>**[Nat] Prediction:** The cut-offs are arbitrary measurement tools for a real, underlying binary state (dysfunction present/absent).<br>**[Norm] Prediction:** The cut-offs are arbitrary because the state itself is a gradient of harm. There is no binary fact to discover. |

  ---

  ## Section III: Note on Verbal Disputes
  *Reflections on whether our disagreement is substantive or terminological.*

  After extensive dialogue, we flag the following areas where we suspect our dispute may be merely verbal, or at least less substantive than previously thought:

  1.  **The Label 'Disease' vs. 'Condition':** We agree that the *clinical management* of hypertension, infertility, and aging should be determined by a combination of biological facts and patient values. We suspect our argument is partially over who gets to wield the label 'disease.' The Naturalist wants the label to track biological risk to encourage research; the Normativist wants the label to track eligibility for the sick role to protect resources. If we agree on the *policy implications* for specific cases, the semantic boundary may be less critical than the pragmatic one.
  2.  **The Definition of 'Function':** We recognize that the Naturalist uses 'function' in a historical/etiological sense (what the trait was selected for), while the Normativist often hears 'function' in a causal/goal-oriented sense (what the trait does for the agent). If the Naturalist concedes that 'species design' is a theoretical construct laden with evolutionary values, and the Normativist concedes that 'harm' usually correlates with biological failure, the gap narrows.
  3.  **The Meta-Question Resolution:** We initially thought we disagreed on whether the project was scientific or normative. We now agree it is **both**, but we prioritize the order of operations. The Naturalist prioritizes Science $\rightarrow$ Norms; the Normativist prioritizes Norms $\rightarrow$ Science. This is a substantive methodological disagreement, but not a disagreement about the constituents of reality.

  **Conclusion for the Workshop:**
  We invite workshop participants to challenge the **Cruxes** in Section II. If a participant can demonstrate that biological dysfunction can exist without *any* normative implication (supporting Nat), or that harm can constitute disease without *any* biological mechanism (supporting Norm), the debate will move forward. Until then, we remain in a stable equilibrium of "Harmful Dysfunction."
