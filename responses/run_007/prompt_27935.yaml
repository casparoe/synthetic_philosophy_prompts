      *   Kripke says: No, "Water" is a rigid designator. It points to *this stuff* (ostensive baptism). "H2O" is a rigid designator. It points to *this molecular structure*.
      *   The identity is necessary *once established*. But establishing it requires empirical work.
      *   **Key Distinction:** Fixing the reference vs. Giving the meaning.
