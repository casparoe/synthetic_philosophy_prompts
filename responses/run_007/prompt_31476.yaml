      *   *Fact Check:* Even in *Structure*, Kuhn denies it's *mere* social pressure. He talks about "values" in Chapter X. However, the language is looser. The Postscript clarifies it. But standard teaching of *Structure* includes the "five values." If the course taught *Structure*, the student should know about the values. If they claim it's "subjective preference," they miss the *intersubjective* nature of the values.
