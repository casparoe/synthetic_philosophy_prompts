      *Let's select the top 8 based on the specific mix.*
      1.  Rawlsian (Normative Core): Might makes right.
      2.  Habermasian (Facticity/Validity): Category error.
      3.  CRT (Oppressive Force): Legitimizing violence.
      4.  Hartian (Efficacy vs. Obligation): Sociological vs. Normative.
      5.  Augustinian (Theological Context): Secularizing Pascal.
      6.  Rawlsian (Straw Man): Hypothetical consent covers this.
