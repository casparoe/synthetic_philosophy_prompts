      *Re-evaluating Damage:* The CRT objection is potentially more damaging in a modern colloquium than the Hartian one, because it attacks the *moral* implication rather than just the conceptual distinction. The Rawlsian "Might Makes Right" is the classic philosophical killer. Let's put Rawlsian #1, CRT #2, Habermasian #3.

  4.  **Drafting Replies:**
      *   *Strategy:* Emphasize the "jointly necessary" and "constrain each other" part. Force without justice is tyranny (illegitimate). Justice without force is impotent (not a political order). It's a *biconditional* requirement, not a reduction.
      *   *Weak Points:* Admitting that effectiveness is hard to measure. Admitting Pascal is pessimistic.
      *   *Stance:* Hold ground on the theory, concede on the textual interpretation if needed (for the Augustinian).

  5.  **Drafting the Dreaded Question:**
