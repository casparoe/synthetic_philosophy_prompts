          1.  Text-based Prep Sheet (8 objections, ordered by damage, specific vocab/commitments, 2-min reply, weakest point, stance).
          2.  "Dreaded Question" (the one to avoid).
          3.  JSON Summary (specific schema provided).
      *   **Constraints:** Order by damage (most damaging first). Specific vocab for each objector.

  2.  **Deconstruct the Thesis & Audience Vulnerabilities:**
      *   *Thesis:* Legitimacy = Justice + Force (irreducible, jointly necessary). Liberalism fails because it ignores force/consent problems.
      *   *Rawlsians/Habermasians:* Will worry that adding "force" as a *constitutive* element of legitimacy legitimizes tyranny if it's effective. They believe legitimacy comes from *reasons* (public reason, discourse), not facts about power. They will see this as a category mistake (is/ought problem).
      *   *Legal Positivists (Hart/Kelsen):* Hart separates law and morality but focuses on the "internal point of view." Kelsen focuses on the *Grundnorm*. They might agree force is necessary but disagree that it makes something *legitimate* (vs. merely *valid* or *effective*). They might challenge the definition of legitimacy.
      *   *Augustinian:* Will agree on the fallen nature of power but might argue Pascal's point is theological (original sin), not political-theoretical. Might argue true justice is only in the City of God.
      *   *Critical Race Theorist (CRT):* Will be very interested in "force" and "police power." Might argue that focusing on "effectiveness" legitimizes oppressive state violence. Or, conversely, might appreciate the critique of liberal idealism but worry the "Pascalian repair" doesn't constrain force enough.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big Gun - Rawlsian/Habermasian):* The Is/Ought Problem. If effectiveness counts toward legitimacy, then a successful tyranny is legitimate. This destroys the normative core of the argument.
      *   *Objection 2 (The Definition - Legal Positivist/Hart):* Confusing validity/efficacy with legitimacy. Hart distinguishes efficacy of a system from the obligation to obey.
      *   *Objection 3 (The Consent Counter - Rawlsian):* Hypothetical consent *accounts* for force. We consent to enforcement mechanisms. You're attacking a straw man.
      *   *Objection 4 (The Theological Turn - Augustinian):* Pascal isn't giving a political theory; he's describing a tragic fallen state. You're secularizing a theological pessimism.
      *   *Objection 5 (The CRT/Power Critique):* "Effectively commanding compliance" sounds like legitimizing police brutality. Who defines "effective"?
      *   *Objection 6 (The Habermasian Discourse):* Force should be the *last resort* of discourse, not a co-constituent. Making it co-constituent corrupts the discourse.
      *   *Objection 7 (The Kelsenian):* Legitimacy is about the chain of validity (Grundnorm), not sociological facts about compliance.
      *   *Objection 8 (The Stability Objection - Liberal):* If legitimacy depends on effectiveness, legitimacy becomes unstable. If the state falters, it loses legitimacy instantly.

      *Refining Order by Damage:*
      1.  The "Might Makes Right" charge (Rawlsian). This is the existential threat. If legitimacy tracks effectiveness, Nazis are legitimate.
