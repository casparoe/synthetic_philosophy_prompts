  2.  **Deconstruct the Distinction (Finks vs. Masks):**
      *   *Standard Definition:*
          *   **Fink:** The stimulus causes the disposition to vanish *before* manifestation can occur. (Intrinsic change to the base property).
          *   **Mask:** The disposition remains, but an extrinsic (or intrinsic) interferent prevents the manifestation. (No change to the base property).
      *   *The User's Insight:* The user is actually hitting on a very sophisticated objection often raised in the literature (e.g., by David Lewis, Sungho Choi, or even earlier by Goodman). The "redescription" worry is legitimate.

  3.  **Evaluate the "Redescription" Objection:**
      *   *Can a Mask be described as a Fink?* If I define the "fragile object" as "the glass + wrapping," does it lose fragility? No, usually we say the *glass* is fragile, the *system* is not. But if the disposition belongs to the glass, the wrapping is extrinsic. Finks are typically *intrinsic* changes.
      *   *Can a Fink be described as a Mask?* If the sorcerer changes the molecular structure, is that just blocking the manifestation? If the structure changes, the categorical base is gone. A mask usually leaves the base intact.
      *   *Key Differentiator:* **Intrinsic vs. Extrinsic** and **Base Property Retention**.
          *   **Fink:** The *categorical base* of the disposition is destroyed/removed upon stimulus. (Intrinsic change).
          *   **Mask:** The *categorical base* remains intact, but the causal pathway to manifestation is blocked. (Often extrinsic, but can be intrinsic).

  4.  **Formulate the Principled Distinction:**
      *   It's not just about "object individuation." It's about the *causal history* of the base property.
      *   **Fink:** $S \rightarrow$ ~Base Property. (Stimulus removes the ground of the disposition).
      *   **Mask:** $S +$ Interferent $\rightarrow$ ~Manifestation (while Base Property remains).
      *   *Crucial Point:* Finks make the counterfactual false by making the antecedent true and the disposition false *at the time of manifestation*. Masks make the counterfactual false by keeping the disposition true but breaking the link to the consequent.

  5.  **Address the "Redescription Game":**
