      *   *Mask:* The base is still there.
      *   *Fink:* The base is gone.
      *   *Why the user's "glass + bubble wrap" move fails:* Dispositions are typically intrinsic. Bubble wrap is extrinsic. So the glass *still has* the disposition. The system doesn't, but the system isn't the bearer of *that* specific disposition in the standard metaphysical view.
      *   *Why the user's "sorcerer as mask" move fails:* The sorcerer changes the intrinsic structure. A mask doesn't change the structure; it interferes with the process.

  6.  **Find the "Clean Case" (The Clincher):**
