      *   *Test:* Can we intervene to remove the mask and get manifestation *without* re-installing the disposition? Yes (remove bubble wrap). Can we do that in a Fink case? No (glass is now unfragile, removing the sorcerer won't help unless he reverses the spell).

  7.  **Structure the Response:**
