          *   *Mask as Fink?* If the object = glass + bubble wrap, the disposition seems absent (like a fink).
          *   *Fink as Mask?* If the object = glass simpliciter, the sorcerer's spell just blocks manifestation (like a mask).
      *   **The Core Question:** Is there a principled distinction, or is it just linguistic/conceptual framing? Is there a "clean case" where they genuinely come apart?
