      *   *So the Intrinsic/Extrinsic distinction isn't the defining one.*
      *   *Correction:* The defining distinction is **Retention of the Ground**.
      *   *Fink:* Ground is lost upon stimulus.
      *   *Mask:* Ground is retained upon stimulus.
      *   *User's "Sorcerer as Mask" objection:* If the sorcerer changes the molecular structure, the ground is lost. That's a fink. If the sorcerer puts a forcefield around it, the ground is kept. That's a mask. The *mechanism* matters, not just the outcome.
