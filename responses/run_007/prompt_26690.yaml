answer: |-
  The slogan "you can't put a price on everything" is a philosophical chameleon. It shifts meaning depending on the context, oscillating between descriptive claims about human psychology and normative claims about moral boundaries. In philosophical terms, it conflates *incommensurability* (the inability to compare values) with *impermissibility* (the prohibition against comparing them).

  To help you interrogate your classmate's position, here is a menu of five distinct theses the slogan might be expressing. I have arranged them roughly from the most defensible (but least damaging to the practice in question) to the most contentious (but potentially most damaging if proven).

  ### 1. The Epistemic Claim: "Pricing is too uncertain to be reliable."
  **The Thesis:** This is a claim about knowledge, not morality. It argues that while a price *could* theoretically exist, our methods for calculating it are so prone to error that relying on them is dangerous. We lack the data to know the true social cost of carbon, the long-term psychological impact of surrogacy, or the health risks of organ selling. Therefore, we should act as if they are priceless to avoid catastrophic miscalculation.

  *   **Does it support the ban?** Weakly. It argues for *caution*, not necessarily prohibition. It suggests we should set prices very high or create wide margins of error, not that we should refuse to price at all.
  *   **Does it survive scrutiny?** Partially. In the case of **carbon offsets**, this is a strong argument. Many offsets are notoriously difficult to verify (additionality, leakage). However, this argues for *better* pricing mechanisms or regulation, not the abandonment of pricing. If we cannot price carbon, we cannot compare climate policy against education or healthcare spending, leading to paralysis rather than protection.
  *   **Verdict:** This turns the slogan into a pragmatic warning ("Don't trust the current price") rather than a moral principle ("There can be no price").

  ### 2. The Distributive Claim: "Pricing creates unjust inequality."
  **The Thesis:** This is a claim about justice. It argues that allowing certain goods or duties to be traded for money allows the wealthy to bypass burdens that should be shared equally. If conscription can be bought out, the poor fight and the rich live. If kidneys are sold, the poor become spare parts for the rich. The objection is not to the transaction itself, but to the background inequality that makes the transaction exploitative or unfair.

  *   **Does it support the ban?** Yes, but conditionally. It supports banning the market *under current conditions of inequality*.
  *   **Does it survive scrutiny?** This is a robust argument for **conscription** and **organ markets**. However, it faces a "second-best" problem. If we ban organ sales, the rich still get organs (via travel or black markets), while the poor get nothing. Banning the market might protect the poor from exploitation, but it also denies them a potential source of income and denies the sick access to care. In the case of **carbon offsets**, the argument is that rich nations pollute and pay poor nations to absorb the cost. This is a strong justice claim, but again, it suggests the *revenue* from offsets should be redistributed, not that offsets are inherently invalid.
  *   **Verdict:** This is likely the strongest *practical* objection. However, it implies that if we fixed inequality, the markets might become permissible. Your classmate would need to argue that the inequality is intractable.

  ### 3. The Psychological Claim: "Pricing crowds out moral norms."
  **The Thesis:** Associated with philosophers like Michael Sandel and economists like Bruno Frey, this claims that introducing market norms into non-market spheres changes how we value the good. If you pay children to read books, they read less once the payment stops. If you allow carbon offsets, emitters feel they have "licensed" themselves to pollute, eroding the moral duty to reduce emissions. If you pay for surrogacy, it transforms a gift of life into a service contract, altering the relationship between parent and child.

  *   **Does it support the ban?** Yes. If the market mechanism destroys the underlying value (civic duty, altruism, environmental stewardship), the practice is self-defeating.
  *   **Does it survive scrutiny?** This is an empirical claim, and the evidence is mixed. In some contexts, fines crowd out morals (a day-care center charging for late pickups increased late pickups). In others, pricing signals importance (carbon taxes can signal the severity of the crisis). For **carbon offsets**, the risk of "moral licensing" is real. For **organ markets**, it is less clear if paying donors reduces the societal respect for life.
  *   **Verdict:** This requires empirical evidence. Your classmate cannot simply assert this; they must show that in the specific instance (e.g., offsets), the market mechanism actually degrades the moral norm more than it helps the outcome.

  ### 4. The Deontological Claim: "Commodification violates dignity."
  **The Thesis:** This is a claim about intrinsic wrongness. Certain things belong to the sphere of persons and rights, not the sphere of things and prices. To put a price on them is to treat them as mere means to an end (Kantianism). Selling a kidney treats the body as a warehouse of parts. Selling a draft exemption treats civic duty as a consumer good. This is not about consequences (inequality or crowding out); it is about the nature of the transaction itself.

  *   **Does it support the ban?** Yes, absolutely. If the transaction is inherently degrading, no amount of good consequences (saving lives via organs, reducing CO2 via offsets) justifies it.
  *   **Does it survive scrutiny?** This is highly contentious. Why is money the corrupting factor? If I trade my kidney for a friend's life (barter), is that okay? If I trade it for "social credit," is that okay? The line is often arbitrary. Regarding **carbon offsets**, this claim is weak. Carbon is not a part of human dignity; it is a physical byproduct. A deontological argument against offsets would need to claim that the *atmosphere* has rights or that polluting is inherently a violation of duty that cannot be remedied by compensation. This is a harder sell than with organs.
  *   **Verdict:** This is the "hard line" objection. It is philosophically consistent but requires a robust theory of *why* money specifically corrupts these specific goods. It often succumbs to the "money fetishism" critique (why is money worse than other forms of exchange?).

  ### 5. The Metaphysical Claim: "The values are incommensurable."
  **The Thesis:** This is the literal reading of the slogan. It claims that moral values (life, duty, nature) and economic values (dollars) are of different ontological categories. They are like "asking how many inches are in a pound." There is no common denominator that allows for rational trade-offs.

  *   **Does it support the ban?** Yes. If trade-offs are irrational, then cost-benefit analysis is a category mistake.
  *   **Does it survive scrutiny?** Poorly. We make these trade-offs constantly and rationally. We speed up to get to the hospital faster, risking life for time. We spend money on safety features, implicitly valuing life at a certain dollar amount. To say they are *incommensurable* leads to decision paralysis. If we cannot compare the cost of carbon reduction against the cost of poverty alleviation, we cannot govern.
  *   **Verdict:** This is the weakest thesis philosophically. While some values resist *precise* cardinal comparison, they are not immune to *rough* ordinal comparison (e.g., "preventing extinction is more important than a 1% GDP loss"). Your classmate would struggle to defend the idea that we literally *cannot* compare these values without abandoning all public policy.

  ### Summary for Your Seminar

  When your classmate says, "You can't put a price on everything," you can ask them to locate their objection on this menu:

  1.  **If they mean Epistemic:** Ask if better measurement would solve the problem. (Likely yes).
  2.  **If they mean Distributive:** Ask if they oppose the market only because of inequality, and if redistribution could fix it. (Likely yes).
  3.  **If they mean Psychological:** Ask for empirical evidence that pricing crowds out the specific norm in question. (Debatable).
  4.  **If they mean Deontological:** Ask why money is uniquely corrupting compared to other forms of exchange or sacrifice. (Hard to defend consistently).
  5.  **If they mean Metaphysical:** Ask how we should make policy decisions if we cannot compare values at all. (Leads to paralysis).

  **The "Steel Man" Conclusion:**
  The most defensible version of your classmate's argument is likely a hybrid of the **Distributive** and **Psychological** claims. They are likely arguing that in a world of radical inequality, introducing market mechanisms into spheres of moral duty (climate, health, citizenship) allows the wealthy to evade responsibility while eroding the collective solidarity required to solve the problem.

  However, for the slogan to work as a *knockdown* argument ("the matter is settled"), they would need to defend the **Deontological** or **Metaphysical** claim. Those are the only ones that rule out pricing *in principle*, regardless of how well-regulated or equal the society becomes. Since those claims are the most philosophically vulnerable, the matter is far from settled.
