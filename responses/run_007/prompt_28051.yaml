prompt: |-
  I'm a retired neuroscientist and I've been reading philosophy of mind for a couple years now — the causal exclusion argument is one of those things I keep coming back to. Here's what I don't get. Kim's basic argument has been around since the late 80s, and the main responses — reductive physicalism (bite the bullet), nonreductive physicalism plus overdetermination, the counterfactual approach, Woodward's interventionism — have all been on the table for decades. Nobody seems to move. The same papers cite the same papers and everyone digs in. 

  My working hypothesis is that this isn't really an empirical disagreement at all, even though it looks like one about how the world works. I suspect its actually a disagreement about what we're willing to count as a cause — that the two sides have different standards for causal relevance and neither can argue for their standard without begging the question. But I'm new enough to this that I might be missing something obvious.

  So here's what I want: a diagnosis of why this debate has stalled. Is it verbal, is it substantive, is it a clash of bedrock intuitions, is there a hidden formal result that would break it open? What's actually settled among the people who work on this, and what's genuinely contested? And given your diagnosis, what would count as progress — a new experimental result from neuroscience, a formal result about causation, a conceptual distinction everyone's been missing, or just admitting the question was badly framed? 

  Write it as continuous prose please, no headings or bullet points or anything — just an email-style response.
