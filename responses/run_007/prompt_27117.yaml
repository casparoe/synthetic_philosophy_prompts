answer: |-
  To help your students navigate the complex landscape of debates surrounding the epistemology of conspiracy theories, I have constructed a decision tree designed to sort positions based on underlying philosophical commitments rather than preferred terminology. This instrument begins by asking students to consider the fundamental nature of the category itself before moving into specific evaluations of rationality and evidence. The goal is to allow students to locate their own views by answering questions about cases and claims, ensuring that the resulting taxonomy reflects their actual philosophical stance rather than their familiarity with specific academic labels.

  The first branch of the tree requires students to determine the primary function of the label conspiracy theory. You should ask them whether they believe that classifying a belief as a conspiracy theory is primarily a way of identifying an epistemic problem with the belief itself, or whether it is primarily a social and political action used to marginalize certain viewpoints. If a student answers that the label is primarily a social and political action used to marginalize viewpoints, they arrive at the leaf designated for political or functional critiques. This position holds that the focus on the epistemic status of these beliefs obscures the power dynamics involved in who gets to label whom, suggesting that the category serves to protect official narratives rather than track truth. It is important to note that this branch does not necessarily claim that all conspiracy theories are true, but rather that the debate about their rationality is itself a political tool. There is a logically possible but largely unexplored combination here where one might argue the label is a political action yet also maintains that the beliefs are inherently epistemically defective for non-political reasons. This position is not incoherent, but it is rarely defended because it undermines the critical force of the political critique by conceding the epistemic ground to the generalists.

  If the student answers that the label is primarily a way of identifying an epistemic problem, they proceed to the second branch, which concerns the scope of that problem. Here, the question is whether the label itself settles the question of the belief's rationality, or whether it merely signals a need for further investigation into the specific evidence available. If the student believes the label merely signals a need for further investigation and that the rationality depends on the specific evidence available for each case, they arrive at the leaf for particularism. This view asserts that conspiracy theories are not a natural kind with a shared epistemic status; some may be rational and others irrational, but this is determined by the evidence for the specific claim, such as whistleblower testimony or documentary proof, rather than the fact that it is a conspiracy theory. A logically possible but unoccupied space exists for a student who claims the label identifies an epistemic problem but also believes that every single instance is rational. This position is effectively incoherent, as it contradicts the premise that the label identifies a problem, and thus no serious philosopher defends the view that the category marks an epistemic issue while simultaneously arguing that no instances are epistemically flawed.

  If the student believes that the label itself settles the question of rationality by making the belief less rational than an official account regardless of specific evidence, they move to the third and final branch, which seeks to identify the source of this defect. The question here is whether the problem lies in the content of the claims themselves, such as the inherent improbability of secret malevolent coordination, or whether the problem lies in the reasoning processes typically used by the believers, such as a resistance to counter-evidence or a tendency to see connected patterns where none exist. If the student identifies the content as the source of the defect, they arrive at the leaf for content-based generalism. This position argues that claims about secret plots are inherently less probable than official accounts, creating a higher evidentiary burden that is rarely met. If the student identifies the reasoning processes as the source, they arrive at the leaf for process-based generalism. This position argues that the psychological or methodological approach characteristic of conspiracy theorizing is inherently unreliable, regardless of the specific claim being made.

  It is crucial to flag for your students that while the tree separates content-based and process-based generalism for the sake of clarity, these positions are not mutually exclusive in practice. Many proponents of generalism argue that both the content is inherently improbable and the methods are inherently unreliable, so a student may find themselves occupying both leaves simultaneously. The tree treats them as distinct logical options to clarify the source of the epistemic defect, but in the actual literature, these views often converge. Additionally, there is a potential overlap between particularism and political critiques that the tree separates by the initial question about the function of the label. In practice, many particularists are sympathetic to political critiques, arguing that the label is misused precisely because there is no epistemic justification for treating these beliefs as a class. The tree forces a choice between focusing on the epistemic utility of the category versus the political function of the category, but students should be aware that these views are often allied in their opposition to generalism. Finally, there is a logically possible position where one argues the label identifies an epistemic problem and applies to the class as a whole, but that the defect is neither content-based nor process-based. This space is currently unoccupied and would be difficult to defend, as epistemic defects generally must reside in either the proposition or the believer's relation to it, making such a position theoretically unstable. By following this path, your students will be able to locate their own views within the logical space of the debate, understanding not just what position they hold, but why they hold it based on their answers to these foundational questions.
