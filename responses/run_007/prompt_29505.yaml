  **MEMORANDUM**

  **TO:** Regional Water Agency Advisory Panel
  **FROM:** [Your Name]
  **SUBJECT:** Recommendation on Probabilistic Forecast Reporting Policy
  **DATE:** October 26, 2023

  **Recommendation**

  I recommend that the panel reject the proposal to arbitrarily compress forecast probabilities toward 50 percent. We should publish the modeling group's raw probabilities, contingent upon a concurrent initiative to validate and, if necessary, statistically recalibrate the model's historical calibration.

  This recommendation is not based on abstract appeals to honesty or institutional reputation. It rests on two technical grounds: the mathematical properties of the oversight body's scoring rule, and the decision-theoretic utility of the forecasts for water managers.

  **The Properties of the Scoring Rule**

  The majority faction argues that compressing probabilities (e.g., capping forecasts at 65 percent) protects the agency from harsh penalties under the squared-error (Brier) scoring rule when extreme forecasts fail. This is factually correct regarding *realized* scores in specific instances: a forecast of 82 percent that fails incurs a penalty of $(0.82 - 0)^2 \approx 0.67$, whereas a hedged 65 percent forecast incurs only $(0.65 - 0)^2 \approx 0.42$.

  However, the Brier score is a *proper* scoring rule. This means that the strategy which minimizes the *expected* score over the long run is to report the true subjective probability derived from the evidence. If the model indicates an 82 percent chance of low streamflow, reporting 65 percent mathematically guarantees a higher expected penalty, even if it reduces the variance of those penalties.

  By adopting a compression policy, we would be intentionally degrading our performance metric to manage risk exposure. While risk aversion is rational in financial contexts, in forecasting it amounts to accepting lower accuracy to avoid accountability for uncertainty. If the model is well-calibrated—meaning that events forecast at 82 percent occur roughly 82 percent of the time—compression will systematically worsen our score over time.

  **Decision-Theoretic Utility**

  More critically, our forecasts are not issued to achieve a low score; they are issued to guide action. Water managers and irrigators operate with specific cost-loss ratios. A farmer decides whether to invest in drought-resistant crops based on whether the probability of restriction exceeds their personal threshold.

  If the true risk is 82 percent but we publish 65 percent, we alter the optimal decision for any stakeholder whose cost-loss ratio lies between those two probabilities. We are not merely hedging our bets; we are inducing suboptimal resource allocation. In a water-scarce region, the cost of under-preparation (believing risk is moderate when it is high) typically exceeds the cost of over-preparation. Arbitrary compression biases the information toward inaction, potentially exacerbating the very shortages we aim to mitigate.

  **Addressing the Concern for Overconfidence**

  The strongest consideration for the compression faction is the possibility that the model is overconfident. If the model frequently assigns 82 percent probability to events that only occur 60 percent of the time, then the raw numbers are indeed misleading, and the model—not the published number—is at fault.

  However, the remedy for overconfidence is not arbitrary censoring (e.g., a hard cap at 65 percent). It is statistical recalibration. We should analyze the model's historical reliability. If the data shows systematic overconfidence, we should apply a logistic regression or similar post-processing technique to align the output probabilities with observed frequencies. This preserves the information content of the forecast while correcting for bias.

  Arbitrary compression treats all forecasts as equally unreliable, discarding valuable signal in cases where the model is actually sharp and accurate. It substitutes a policy of ignorance for a process of verification.

  **Path Forward**

  1.  **Publish Raw Probabilities:** Continue issuing the modeling group's output to preserve decision utility and minimize expected scoring loss.
  2.  **Audit Calibration:** Task the modeling group with producing a reliability diagram comparing past forecast probabilities to observed frequencies.
  3.  **Recalibrate if Needed:** If the audit reveals systematic overconfidence, implement statistical post-processing to correct the bias at the source, rather than masking it at the output.

  We serve the region best by providing the most accurate assessment of risk possible, not by managing the appearance of uncertainty.

  Respectfully,

  [Your Name]
  Advisory Panel Member
