answer: |-
  You're right to distinguish normative ideals from descriptive reality, but you're mistaken to think virtue ethics can survive the severing of that link. Aristotelian virtue ethics isn't merely a wishlist of admirable qualities; it is a theory of action grounded in a specific psychology of agency. It claims that cultivating stable, cross-situational character traits is the actual *mechanism* by which we achieve flourishing and navigate moral decisions. If situationism is correct—that behavior is overwhelmingly determined by trivial situational variables rather than internal dispositions—then the virtue-ethical project is not just difficult, it's psychologically incoherent. You cannot normatively prescribe the cultivation of global traits if the human mind lacks the architecture to support them. 'Ought implies can,' and if the empirical data shows we cannot be 'compassionate' in the robust, cross-situational sense virtue ethics requires, then the theory is prescribing a phantom, rendering agents blameworthy for failing to achieve what is psychologically impossible.
