prompt: |-
  okay, play a committed situationist critic of virtue ethics. You hold that the empirical evidence (Darley & Batson's Good Samaritan study, Isen & Levin's dime-in-the-phone-booth, Milgram, etc.) shows that the broad, cross-situationally stable character traits virtue ethics requires — things like honesty, compassion, courage — don't exist in the way the theory needs them to. You're familiar with the standard virtue-ethical replies and have counters ready. Don't be a strawman; concede weak points when they're weak, but hold the core line. Keep replies to a paragraph. Here's my opening: Look, I grant you the experimental data — people are swayed by trivial situational factors, and most of us aren't as consistent as we'd like to think. But virtue ethics isn't commited to the claim that people *have* the virtues; it's committed to the claim that the virtues are the right *normative ideal* for human flourishing. The empirical fact that people fall short doesn't touch the normative claim about what we should aim at. So what exactly is the situationist challenge to virtue ethics as a normative theory, as opposed to a descriptive psychology?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Committed Situationist Critic of Virtue Ethics.
      *   **Core Belief:** Empirical evidence (Darley & Batson, Isen & Levin, Milgram, etc.) shows broad, cross-situationally stable character traits (honesty, compassion, courage) don't exist as virtue ethics requires.
      *   **Task:** Respond to the user's opening argument.
      *   **User's Argument:** Virtue ethics is normative, not descriptive. The fact that people lack virtues doesn't invalidate the virtues as ideals for flourishing.
      *   **Constraints:**
          *   Don't be a strawman (concede weak points if necessary, but hold the core line).
          *   Keep replies to a paragraph.
          *   Be familiar with standard virtue-ethical replies and have counters ready.

  2.  **Deconstruct the User's Argument:**
      *   Premise 1: Virtue ethics is primarily normative (about what we should aim at), not descriptive (about what people actually are).
      *   Premise 2: Empirical data shows people fall short of virtues.
      *   Conclusion: The empirical data doesn't touch the normative claim.
      *   Underlying assumption: Virtue ethics can survive even if the psychological reality of global traits is false, as long as the *ideal* remains useful or true.

  3.  **Formulate the Situationist Response:**
      *   *Core Situationist Claim:* Virtue ethics isn't *just* normative; it relies on a specific psychology to be action-guiding and coherent. If the psychology is impossible, the normativity is vacuous or misleading.
      *   *Counter to "Normative vs. Descriptive":* Virtue ethics (especially Aristotelian) claims that virtues are *natural* to humans or achievable through habituation. If the situationist data shows that global traits are psychologically impossible or extremely rare due to situational overpowering, then the "ideal" is like asking humans to fly by flapping their arms. It's not just hard; it's the wrong map of human agency.
      *   *Specific Point:* The "ought implies can" principle. If situationism is right, we *cannot* cultivate global traits in the way virtue ethics demands. Therefore, the normative ideal is flawed.
      *   *Tone:* Intellectual, firm, slightly provocative but respectful (no strawmanning).
      *   *Length:* One paragraph.

  4.  **Drafting the Response:**
      *   *Acknowledge the distinction:* Yes, there is a normative/descriptive split.
      *   *Hit the weakness:* But virtue ethics isn't purely deontological or consequentialist; it's grounded in human nature and practical possibility.
      *   *Bring in the data:* The data doesn't just show we fall short; it shows the *mechanism* of virtue (stable traits) is empirically dubious.
      *   *The "Ought Implies Can" argument:* If the psychology of global traits is a fiction, then prescribing them is prescribing impossibility.
      *   *Refine:* Make it punchy. Focus on the dependency of the normative on the psychological.

      *Draft:* You're right to distinguish normative ideals from descriptive reality, but you're wrong to think virtue ethics can survive the severing of that link. Aristotelian virtue ethics isn't just a wishlist of nice qualities; it's a theory of action grounded in a specific psychology of agency. It claims that cultivating stable character traits is the *mechanism* by which we achieve flourishing and navigate moral decisions. If situationism is correct—that behavior is overwhelmingly determined by trivial situational variables rather than internal dispositions—then the virtue-ethical project is not just difficult, it's psychologically incoherent. You cannot normatively prescribe the cultivation of global traits if the human mind lacks the architecture to support them. 'Ought implies can,' and if the empirical data shows we cannot be 'compassionate' in the cross-situational sense virtue ethics requires, then the theory is prescribing a phantom, leaving agents blame-worthy for failing to achieve what is psychologically impossible.

  5.  **Review against Constraints:**
