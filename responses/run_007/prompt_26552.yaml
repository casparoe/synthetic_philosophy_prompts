      *   *The Big One:* Calibration + Equalized Odds (Balance) + Non-triviality. (Kleinberg/Chouldechova).
      *   *The Second One:* Individual Fairness (Similarity) + Group Fairness (Demographic Parity) when base rates differ.
      *   *The Third One:* Causal Fairness (No Discrimination) + Statistical Fairness (Predictive Parity) when mediators exist.
      *   *Conclusion:* You cannot have a *universal* metric. Context is king.

  5.  **Structuring the Response:**
