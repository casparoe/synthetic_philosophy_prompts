answer: |-
  This is a sophisticated request that cuts to the core of why the field feels stagnant. The frustration your group is experiencing is not a failure of comprehension; it is a rational response to a domain where **normative pluralism** clashes with **mathematical monism**. The literature often tries to find a single mathematical object (a loss function, a constraint) to capture a multi-dimensional ethical concept.

  Below is a specification of the desiderata for an adequate theory of algorithmic fairness. I have structured this to highlight where the tensions lie, flagging which requirements are non-negotiable and which are modeling choices, and concluding with the specific subsets that are mathematically jointly unsatisfiable.

  ---

  ### I. Scope and Domain Desiderata
  *What contexts must the theory cover, and how must it treat them?*

  **1. Context Sensitivity (The Harm Asymmetry Requirement)**
  *   **Motivation:** A false positive in pretrial detention (locking up an innocent person) is ethically distinct from a false positive in lending (denying a loan to someone who would have repaid). The former involves liberty, the latter opportunity. A theory that treats these error types symmetrically fails to capture moral weight.
  *   **Status:** **Non-Negotiable.**
  *   **Implication:** The theory cannot be a single metric (e.g., "minimize demographic disparity"). It must allow for weighting errors differently based on the domain.

  **2. Base Rate Invariance vs. Sensitivity**
  *   **Motivation:** If Group A has a lower observed repayment rate than Group B due to historical exclusion, should a fair model ignore this (treat them as identical) or respect it (predict risk accurately)? Ignoring it may hurt profitability or safety; respecting it may perpetuate historical bias.
  *   **Status:** **Modeling Choice (but must be explicit).**
  *   **Implication:** A theory must declare whether it aims to reflect the world *as it is* (predictive accuracy) or *as it should be* (constructive fairness).

  **3. Infra-marginality Sensitivity**
  *   **Motivation:** Group-level statistics (e.g., "Group A has a higher default rate") can hide the fact that at the margin of decision (the specific individuals being accepted/rejected), the groups are identical. A theory relying solely on aggregate rates may punish or reward individuals based on group averages rather than individual merit.
  *   **Status:** **Non-Negotiable.**
  *   **Implication:** The theory must be able to distinguish between *average group treatment* and *marginal individual treatment*.

  ---

  ### II. Conceptual Distinctions
  *Which philosophical distinctions must the theory formally respect?*

  **4. The Individual/Group Distinction**
  *   **Motivation:** Anti-discrimination law protects individuals (you cannot be denied a job because of your race), but structural injustice is often group-level (systemic underfunding of schools in certain neighborhoods). A theory that only satisfies Individual Fairness (similar individuals treated similarly) may ignore systemic gaps. A theory that only satisfies Group Fairness (parity across populations) may violate individual merit.
  *   **Status:** **Non-Negotiable (must distinguish), Jointly Unsatisfiable (see Section IV).**
  *   **Implication:** The theory must explicitly prioritize one or provide a mechanism to trade off between them. It cannot claim to maximize both simultaneously without qualification.

  **5. The Process/Outcome Distinction**
  *   **Motivation:** *Procedural fairness* demands the algorithm use only "fair" features (e.g., no race, no proxies). *Substantive fairness* demands the *results* are distributed equitably, regardless of the features used. A process can be fair (blind review) but yield unfair outcomes (due to biased training data).
  *   **Status:** **Modeling Choice.**
  *   **Implication:** The theory must specify if it is evaluating the *mechanism* (causal path) or the *distribution* (statistical output).

  **6. The Predictive/Causal Distinction (Pearl's Ladder)**
  *   **Motivation:** Statistical parity (Predictive) sees that $P(Y|A)$ differs by attribute $A$. Causal fairness asks if $A$ *caused* the outcome. If $A$ causes Education, and Education causes Hiring, is blocking $A$ fair? Or does that block the legitimate pathway?
  *   **Status:** **Non-Negotiable.**
  *   **Implication:** A purely statistical theory is insufficient for causal claims. The theory must specify which rung of the causal ladder (Association, Intervention, Counterfactual) it operates on.

  ---

  ### III. Formal and Logical Desiderata
  *What mathematical properties must the theory hold?*

  **7. Internal Consistency**
  *   **Motivation:** The theory cannot define fairness in a way that contradicts its own axioms.
  *   **Status:** **Non-Negotiable.**

  **8. Monotonicity (The "More is Better" Property)**
  *   **Motivation:** If an individual becomes more qualified (improved credit score, lower risk score), their probability of a positive decision should not decrease.
  *   **Status:** **Non-Negotiable.** (Violating this creates perverse incentives).

  **9. Composition/Closure**
  *   **Motivation:** If Model A is fair and Model B is fair, is the system using both fair? (e.g., a hiring filter followed by a salary negotiator).
  *   **Status:** **Nice to Have (but often impossible).**
  *   **Implication:** Most fairness criteria do not compose. A theory must acknowledge this limitation.

  **10. Compatibility with Impossibility Theorems**
  *   **Motivation:** The theory cannot claim to satisfy conditions proven to be mutually exclusive (e.g., Calibration and Equalized Odds) without relaxing assumptions.
  *   **Status:** **Non-Negotiable.**

  ---

  ### IV. The Inconsistency Map (Jointly Unsatisfiable Subsets)
  *This is the critical section for your reading group. These are the specific clusters of desiderata that cannot be held simultaneously.*

  #### Cluster 1: The Statistical Trilemma (Kleinberg et al., 2016; Chouldechova, 2017)
  *   **The Desiderata:**
      1.  **Calibration:** Within each group, the predicted probability of risk must match the actual observed risk (e.g., if predicted risk is 20%, 20% actually default).
      2.  **Balance for Positive Class (Equalized Odds):** The false positive and false negative rates must be equal across groups.
      3.  **Non-Triviality:** The base rates (prevalence of the outcome) differ between groups.
  *   **The Conflict:** You can satisfy (1) and (2) **only if** base rates are identical across groups. If base rates differ (which they almost always do in real socio-technical systems), satisfying Calibration and Equalized Odds simultaneously is mathematically impossible.
  *   **Resolution:** You must **abandon** either Calibration (accepting that risk scores mean different things for different groups) or Balance (accepting different error rates). You cannot have both.

  #### Cluster 2: Individual vs. Group Fairness (Dwork et al., 2012 vs. Demographic Parity)
  *   **The Desiderata:**
      1.  **Individual Fairness:** Similar individuals (under a metric $d$) receive similar outcomes.
      2.  **Demographic Parity:** The acceptance rate is identical across protected groups.
      3.  **Meritocracy:** Higher qualified individuals are more likely to be accepted.
  *   **The Conflict:** If the distribution of "qualification" differs between groups (due to historical injustice), enforcing Demographic Parity requires treating *dissimilar* individuals similarly (violating Individual Fairness) or treating *similar* individuals differently to hit the quota (violating Meritocracy).
  *   **Resolution:** You must **index to context**. If the goal is reparative justice, prioritize Demographic Parity. If the goal is procedural consistency, prioritize Individual Fairness. You cannot maximize both.

  #### Cluster 3: Causal Fairness vs. Predictive Parity
  *   **The Desiderata:**
      1.  **Counterfactual Fairness:** The decision would not change if the protected attribute were different (holding mediators constant).
      2.  **Predictive Parity:** The positive predictive value (PPV) is equal across groups.
  *   **The Conflict:** If the protected attribute causes the outcome through a legitimate mediator (e.g., Gender $\to$ Career Choice $\to$ Hiring), removing the causal influence of Gender (to satisfy Counterfactual Fairness) may destroy the predictive validity of the model, violating Predictive Parity.
  *   **Resolution:** You must decide which causal pathways are "legitimate." This is a **normative modeling choice**, not a statistical one.

  ---

  ### V. Synthesis: Why the Literature is Stuck
  *Addressing your core question about the structure of the requirements.*

  The literature feels stuck because it is attempting to solve a **normative political problem** using **technical optimization**. The desiderata listed above reveal that "Fairness" is not a single state to be achieved, but a set of competing values to be balanced.

  **The Verdict on the Desiderata:**

  1.  **Abandon Universality:** The desire for a "one-size-fits-all" fairness metric is the primary source of the loop. **Context Sensitivity (Desideratum 1)** is non-negotiable, which implies that **Universality** must be abandoned. A criterion valid for lending is invalid for pretrial detention.
  2.  **Weaken "Fairness" to "Compliance":** Since Cluster 1 (The Statistical Trilemma) proves that perfect statistical fairness is impossible with unequal base rates, the theory must weaken the goal from "achieving fairness" to "managing trade-offs transparently."
  3.  **Index to Political Theory:** The choice between Individual vs. Group fairness (Cluster 2) is not a mathematical choice; it is a choice between Liberalism (individual rights) and Egalitarianism (group outcomes). The theory cannot resolve this; it must expose it.

  **The Only Viable Path Forward:**
  An adequate theory of algorithmic fairness cannot be a *criterion*. It must be a **governance framework**. It must satisfy the following meta-desideratum:

  *   **Transparency of Trade-offs:** The theory must explicitly quantify what is lost when one fairness constraint is prioritized over another (e.g., "To achieve Equalized Odds, we must sacrifice Calibration by X% and reduce overall Accuracy by Y%").

  **Summary for your Reading Group:**
  You are not failing to find the right paper. The right paper does not exist. The impossibility theorems are not obstacles to be overcome; they are **boundary conditions** telling you that you must make a political choice. The next paper you read should not be judged on whether it proposes a "better" metric, but on whether it clearly articulates *which* of the above desiderata it is sacrificing and *why* that sacrifice is justified for its specific context.

  If a paper claims to satisfy Calibration, Equalized Odds, and Accuracy in a setting with unequal base rates, it is mathematically incoherent. If it claims to satisfy Individual and Group fairness simultaneously without addressing base rate differences, it is ethically naive. The "loop" exists because authors keep trying to square these circles. Your group's next step is to stop looking for the circle-squarer and start evaluating the trade-off managers.
