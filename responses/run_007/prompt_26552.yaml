          *   Conclusion on whether to abandon/weaken/index desiderata.
          *   **Goal:** Explain the *structure* of the requirements, specifically highlighting internal inconsistencies to explain why the literature feels stuck.

  2.  **Initial Brainstorming & Categorization:**
      *   The user wants a meta-analysis of fairness criteria, not just a list of criteria.
      *   Key tensions: Group vs. Individual, Statistical vs. Causal, Procedural vs. Substantive, Context-dependence vs. Universality.
      *   Key Impossibility Results: Chouldechova (2017), Kleinberg et al. (2016) (Calibration vs. Balance), Individual Fairness (Dwork et al.) vs. Group Fairness.
