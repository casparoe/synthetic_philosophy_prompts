  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Domain/Scope:* Must handle different contexts (Lending vs. Punishment). *Motivation:* Harm asymmetry. *Status:* Non-negotiable (Context matters).
      *   *Protected Attributes:* Must define what counts as a protected class. *Motivation:* Anti-discrimination law/ethics. *Status:* Modeling choice (which attributes?).
      *   *Individual vs. Group:* Must distinguish similar individuals and protect groups. *Motivation:* Both matter ethically. *Status:* **Tension Point.**
      *   *Process vs. Outcome:* Fair procedure vs. fair distribution. *Motivation:* Deontological vs. Consequentialist. *Status:* **Tension Point.**
      *   *Predictive vs. Causal:* Correlation vs. Mechanism. *Motivation:* Bias in data vs. Bias in mechanism. *Status:* **Tension Point.**
      *   *Formal Properties:* Consistency, Monotonicity, etc. *Motivation:* Mathematical robustness. *Status:* Nice to have (mostly).
      *   *Compatibility:* Must not contradict known impossibility theorems without justification. *Motivation:* Logical coherence. *Status:* Non-negotiable.

  4.  **Refining the "Impossibility" Section (The Core Insight):**
