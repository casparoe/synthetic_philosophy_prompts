answer: |-
  Here are 10 hard-hitting questions designed for a rationalist-adjacent audience, skipping the intro and targeting the structural weak points of Tracking Theory. Each includes a follow-up to block standard defensive maneuvers.

  ### 1. The Deductive Competence Problem
  **Question:** You deny the closure principle: knowing $p$ and knowing $p \to q$ doesn't guarantee knowing $q$. But rational agency seems to rely on chaining deductions. If I know I have hands, and I know hands entail I'm not a brain-in-a-vat, but I *don't* know I'm not a brain-in-a-vat, it implies my deductive competence literally destroys knowledge. How do you model a rational agent who is penalized for performing valid inference?

  **Follow-up:** If you reply that deduction doesn't *generate* knowledge, only preserves it, then aren't you admitting that the tracking conditions are not necessary for knowledge? Because in the BIV case, I have a justified true belief derived via deduction, but you say it's not knowledge. So either deduction breaks knowledge, or your conditions are too strict. Which is it?

  ### 2. Salvaging Restricted Closure
  **Question:** Most defenders of tracking eventually try to salvage a *restricted* closure principle—e.g., closure holds for "nearby" errors but not skeptical ones. Is there a formal restriction on closure compatible with tracking that isn't just a restatement of the sensitivity condition itself?

  **Follow-up:** If the restriction just says "closure holds when the error possibilities are close," aren't you effectively smuggling in a Safety condition? If so, why not just adopt Safety Theory and keep closure, rather than mutilating logic to save Sensitivity?

  ### 3. The Lottery Case (Steelman)
  **Question:** Let's steelman the objection: In a lottery, if my ticket were the winner, I wouldn't believe it was a loser (because I'd see the number). So the belief is sensitive. Tracking seems to imply I *know* my ticket will lose. If you bite this bullet and say "Yes, you do know," how do you handle the Preface Paradox where I know every individual claim in a book is true, but also know the book contains an error?

  **Follow-up:** If you instead say "No, the method is statistical, so it doesn't track," aren't you admitting that the metaphysics of the counterfactual doesn't do the work—the *description of the method* does? That leads us straight to the Generality Problem.

  ### 4. Lottery vs. Ordinary Induction
  **Question:** You want to deny knowledge in lottery cases but grant it in ordinary empirical cases (e.g., "my car is parked outside"). But in both cases, the belief is based on high probability. What is the precise structural difference in the counterfactuals between the lottery case and the car case that allows tracking to distinguish them without appealing to intuition?

  **Follow-up:** If you argue that the "nearest possible world" where the car is stolen is further away than the world where the ticket wins, aren't you making knowledge dependent on the *frequency* of errors in the neighborhood? That sounds like a frequentist reliability constraint, not a counterfactual one.

  ### 5. Method Individuation (The Generality Problem)
  **Question:** Tracking relies heavily on how we individuate the "method" of belief formation to avoid counterexamples. But this inherits the Generality Problem from Reliabilism. How finely do we carve methods? Is "vision" a method, or "vision in daylight," or "vision in daylight while sober"?

  **Follow-up:** If you say the method is "whatever process was actually used," doesn't that make every belief unique? And if every belief has a unique method, don't the tracking conditions become trivially satisfied or unsatisfied based on how we describe the history, rather than the epistemic status?

  ### 6. Ad Hocery and Theory Tuning
  **Question:** Critics argue that tracking theorists adjust the granularity of "methods" and the semantics of "nearest worlds" specifically to get the desired verdict on Gettier and Lottery cases. What independent constraint prevents this from being a theory that is tuned post-hoc to match pre-theoretic intuitions?

  **Follow-up:** If you claim there is a naturalistic constraint on method individuation, can you give me one example where the naturalistic carving of a method yields a verdict that contradicts our intuition, which you are still willing to accept? If not, the theory isn't driving the bus.

  ### 7. The Abominable Conjunction
  **Question:** Keith Cohen called it the "abominable conjunction": You claim I know I have hands, but I don't know I'm not a handless brain-in-a-vat. Since "I have hands" entails "I am not a BIV," doesn't this render the concept of knowledge useless for philosophical argumentation? If I can't use what I know to rule out the skeptical hypothesis, what work is "knowledge" doing?

  **Follow-up:** If you say "Knowledge isn't for closing skeptical arguments, it's for navigating the world," then why does your theory spend so much time analyzing skeptical scenarios? It seems you want to have your cake (solve skepticism) and eat it too (keep ordinary knowledge), even if the conjunction is abominable.

  ### 8. Living as a Tracking Theorist
  **Question:** Let's get practical. Do you, personally, suspend judgment on whether you are a brain-in-a-vat? When you reason about long-term plans, do you literally have to bracket the possibility that you are envatted, since you don't *know* you aren't?

  **Follow-up:** If you say "No, I act as if I know," aren't you endorsing a pragmatic fiction over the truth? And if pragmatism governs your life, why should we care about the technical definition of knowledge that forbids you from claiming it?

  ### 9. Safety vs. Sensitivity
  **Question:** Safety Theory (Sosa, Pritchard) argues that knowledge requires you *couldn't easily have been wrong*. This preserves closure and handles lotteries better than Sensitivity. What is the one specific intuition case where Sensitivity gives the right answer and Safety gives the wrong one, that justifies sticking with Nozick's framework?

  **Follow-up:** If you cite a Gettier case where Safety grants knowledge but Sensitivity denies it, isn't that just a dispute over whether Gettiered beliefs are knowledge? If the rationalist consensus is moving toward Safety because it preserves logical closure, isn't defending Tracking becoming a rearguard action?

  ### 10. The Bayesian Tension
  **Question:** This audience thinks in probabilities, not possible worlds. Tracking is built on binary counterfactuals ("If $p$ were false..."). But evidence is rarely binary; it shifts credences. How does Tracking translate a 99.9% credence shift into a binary "would I believe" condition without losing the nuance of the evidence?

  **Follow-up:** If you say we should just treat high credence as belief, then in the Lottery case, my credence is high enough to believe. So we return to the problem: why does Tracking deny knowledge there? It seems the theory forces a binary map onto a probabilistic territory, and the friction is where the counterexamples live.
