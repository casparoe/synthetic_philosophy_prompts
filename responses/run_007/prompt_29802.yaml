      *(Self-Correction during drafting Thesis 1)*: Is "You can't change the past" logically trivial? If "change" means "make it the case that $P$ and not-$P$ at time $t$," then yes, it's a law of non-contradiction. But if it means "causally influence," it's not. I need to make sure this distinction is the first item on the menu.

      *(Self-Correction during drafting Thesis 4)*: David Lewis's "The Paradoxes of Time Travel" is the canonical text here. I must reference the distinction between "can" relative to certain facts vs. all facts.

