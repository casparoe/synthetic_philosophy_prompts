prompt: |-
  I'm a software engineer at a mid-size company and I end up running the postmortem for most of our production incidents — maybe two or three a month. One thing that keeps coming up is whether the incident was caused by something we didn't do: a check we didn't write, a runbook step that got skipped, an alert threshold we never set, a test that was never added. We write these up as causes or contributing factors, and the wording drives what gets fixed and sometimes who gets blamed; in a couple cases our customer contracts have SLA credits tied to the root-cause wording, so its not just an internal label. I have no philosophy background, but a friend of mine does and he says there's a whole literature on causation by omission — whether absences can be causes at all, whether the right test is counterfactual ('would the incident still have happened if we'd done the thing?'), and whether the answer secretly depends on what we expected somebody to do. He says our postmortem fights are basically that debate with a Jira ticket attached.

  What I want is a reusable decision procedure my team can actually run on an incident report — a checklist or flowchart in words — for deciding when an omission should be listed as a cause of an incident. It has to be something an ordinary engineer can run in maybe 20 minutes during a postmortem, without me in the room to explain the theory. It should say what questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says 'not a cause' or 'contributing factor', and where it has to hand the decision to a person because it's a values call rather than a factual one. Please ground it in whatever the philosophy of causation actually knows about omissions, but translated into language we can use: keep the distinctions that survive the translation, and tell me which ones you dropped and why. Then run the procedure on three anonymized cases from our backlog: (1) a database outage where nobody had set a max-connection limit and a runaway query exhausted the pool; (2) an incident where the on-call engineer skipped a step in the runbook that would have caught a bad config before deploy, but the step had been wrong or misleading for months and everyone who had run it recently had skipped it too; (3) an incident where two independent safeguards were both missing — a validation check and an alert — and either one alone probably would have prevented the customer-facing error. I especially want to see a case where the procedure gives an answer my team won't like, and I want you to be honest about what the procedure cannot do — where it's really a management or blame question dressed up as a causal one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Software Engineer at a mid-size company, runs postmortems.
      *   **Problem:** Struggles with classifying "omissions" (things *not* done) as causes in incident reports. This affects fixes, blame, and SLA credits.
      *   **Input:** Friend (philosopher) mentions "causation by omission," counterfactuals, and expectations.
      *   **Goal:** A reusable decision procedure (checklist/flowchart) for engineers to decide when an omission is a "cause."
      *   **Constraints:** ~20 mins to run, no philosophy jargon (translated), must distinguish factual vs. value judgments.
      *   **Deliverables:**
          1.  The Decision Procedure.
          2.  Explanation of philosophical grounding (what kept/dropped).
          3.  Application to 3 specific cases.
          4.  Honesty about limitations (where it's actually a management/blame question).

  2.  **Philosophical Grounding (Mental Sandbox):**
      *   *Core Issue:* Can absences cause things? (e.g., "The gardener's failure to water caused the plant's death" vs. "The Queen's failure to water caused the plant's death".)
      *   *Key Theories:*
          *   Counterfactual Dependence (Lewis): If $O$ hadn't happened, would $E$ still have happened? (If we *had* done the thing, would the incident stop?)
          *   Normative Expectations (Hart & Honoré): We pick omissions as causes based on duties, norms, or statistical normality. The gardener had a duty; the Queen didn't.
          *   Causal Selection: There are infinite omissions (I didn't water it, the rain didn't come, the sun didn't explode). We select the "relevant" ones based on context.
      *   *Translation for Engineers:*
          *   Counterfactual $\rightarrow$ "The Prevention Test."
          *   Normative Expectations $\rightarrow$ "The Duty/Standard Test."
          *   Causal Selection $\rightarrow$ "The Scope Test" (is this actually our job?).
      *   *What to Drop:* Deep metaphysical debates about "negative facts." We don't need to solve the universe's ontology, just Jira tickets. Focus on *pragmatic* causation.

  3.  **Drafting the Decision Procedure:**
      *   Needs to be step-by-step.
      *   Needs clear "Stop" conditions.
      *   Needs to separate "Could it have prevented it?" (Physics/Logic) from "Should we have done it?" (Policy/Norm).
      *   *Step 1: Counterfactual.* (Did this specific missing thing actually matter?)
      *   *Step 2: Feasibility.* (Was it possible to do at the time?)
      *   *Step 3: Expectation/Duty.* (Was there an agreed-upon rule/norm?)
      *   *Step 4: Selection.* (Is this the *best* omission to track, or just one of many?)

  4.  **Refining the Procedure (Self-Correction):**
      *   *Critique:* If I just say "Counterfactual," engineers will say "If we had built a perfect AI, this wouldn't happen." That's an omission too.
      *   *Fix:* Add a "Reasonable Expectation" filter early on.
      *   *Critique:* The prompt asks for where it hands off to a person for values calls.
      *   *Fix:* Explicitly mark the "Normative Threshold" as a management decision point.

  5.  **Developing the Three Cases:**
      *   *Case 1 (DB Connections):* Missing max-connection limit.
          *   Counterfactual: Yes, would have stopped it.
          *   Expectation: Standard DB hygiene? Or new tech?
          *   Outcome: Likely a Cause.
      *   *Case 2 (Runbook Step):* Skipped step, but step was broken/ignored.
          *   Counterfactual: If followed, maybe caught it (but step was wrong).
          *   Expectation: Duty to follow runbook vs. Duty to fix runbook.
          *   Outcome: Tricky. The *omission* of following the step isn't the cause; the *presence* of a bad runbook is. This is where the procedure should protect the engineer.
      *   *Case 3 (Two Missing Safeguards):* Validation + Alert. Either would work.
          *   Counterfactual: Both pass.
          *   Selection: Which one is the cause? Both?
          *   Outcome: "Overdetermination." Procedure needs to handle this without doubling the blame.

  6.  **Addressing the "Uncomfortable Answer":**
      *   I need a case where the procedure says "This omission is NOT a cause" even though management might want it to be (to assign blame), OR "This IS a cause" even though it implicates leadership (e.g., under-resourcing).
      *   *Idea:* In Case 2, if the procedure says "Skipping the step is not the cause," that might annoy managers who want to blame the on-call.
      *   *Idea:* In Case 3, if the procedure says "Both are causes," it might dilute responsibility.
      *   *Better Idea:* Let's make sure Case 2 highlights that *blaming the omission* is wrong because the norm was broken.
      *   *Actually, the prompt asks for a case where the team won't like the answer.*
      *   *Scenario:* If the procedure determines an omission is *not* a cause because there was no prior duty, but the business wants to claim SLA credit (which requires a "bug/omission"). Or vice versa: The procedure says it *is* a cause (systemic failure), but the team wants to call it "unforeseeable" to avoid blame.
      *   *Decision:* I will use Case 2 to show that blaming the *engineer's omission* is incorrect, which management might dislike. I will use Case 3 to show that picking *one* omission is arbitrary, which engineers might dislike (they want a single root cause).
      *   *Wait, looking closer:* "I especially want to see a case where the procedure gives an answer my team won't like."
      *   *Strategy:* I'll make Case 1 (DB Limit) result in "Not a Cause" if there was no established standard, forcing them to admit it's a *new* requirement, not a failure of an old one. This hurts SLA arguments sometimes. Or, I'll make Case 3 result in "Both are Contributing, Neither is Root," which frustrates the "Single Root Cause" crowd. Let's go with the latter for Case 3, as it challenges the "One Root Cause" dogma.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the friend is right. This is the "Problem of Negative Causation."
      *   **Philosophical Translation:**
          *   Keep: Counterfactuals, Normative Expectations, Causal Selection.
          *   Drop: Metaphysics of "nothingness," infinite regress debates.
          *   Why: Engineers need action, not ontology.
      *   **The Procedure (The "Omission Filter"):**
          *   Phase 1: Physics (Could it have stopped it?)
          *   Phase 2: Norms (Were we supposed to do it?)
          *   Phase 3: Selection (Is this the right one to track?)
          *   Handoff Point: Where "Should" becomes a policy decision.
      *   **Running the Cases:**
          *   Case 1: DB Limit. (Likely Cause).
          *   Case 2: Bad Runbook. (Likely *Not* the Engineer's Omission, but the Runbook's existence).
          *   Case 3: Two Safeguards. (Overdetermination).
      *   **Limitations:** Where causation ends and accountability begins. SLA gaming.

  8.  **Refining the "Uncomfortable Answer":**
      *   In Case 3 (Two safeguards), standard postmortem culture demands *one* Root Cause. The philosophy says both are equally causal (overdetermination). The procedure should force them to list *both* or admit "Systemic Gap" rather than picking one arbitrarily. Engineers hate "Systemic Gap" because it's hard to close a Jira ticket on. That's the uncomfortable part.
      *   In Case 2, the procedure should exonerate the on-call. Management might hate that if they want a scapegoat. I'll highlight this tension.

  9.  **Final Review against Constraints:**
      *   20 mins? Yes, checklist style.
      *   No philosophy jargon? Yes, translated.
      *   Grounded in theory? Yes (Lewis, Hart/Honoré).
      *   Honest about limitations? Yes.

  10. **Writing the Response:** (Iterative drafting to ensure tone is professional, empathetic, and rigorous.) *Self-Correction during drafting:* Make sure the distinction between "Cause" and "Contributing Factor" is clear in the procedure. Usually, "Cause" implies fixable root, "Contributing" implies context. I need to align this with their SLA needs. I will define "Actionable Cause" vs "Contextual Factor."

      *Wait, one nuance:* The prompt mentions SLA credits tied to wording. If an omission is a "cause," does that trigger a credit? Usually, yes (if it's a bug). If it's "operator error," maybe not. I need to be careful not to give legal advice but acknowledge the stake.

      *Let's finalize the Procedure Steps:*
      1.  Counterfactual Test (Would it have prevented?)
      2.  Capability Test (Could we have done it then?)
      3.  Expectation Test (Was it required/standard?)
      4.  Specificity Test (Is this the most direct omission?)

      *Let's refine the "Handoff":* The Expectation Test is where values enter. Who decides what is "standard"?

      *Okay, ready to write.*
answer: |-
  This is a classic problem in both software reliability and metaphysics. Your friend is right: you are fighting over **causation by omission**. In philosophy, this is the debate over whether "nothing" can cause "something."

  If you don't have a rule for this, your postmortems will oscillate between "Everything is a cause because we didn't prevent it" (paralysis) and "Nothing is a cause because we didn't break it" (complacency).

  Below is a decision procedure grounded in the **Counterfactual Theory of Causation** (David Lewis) and **Normative Expectations** (Hart & Honoré), translated into engineering operations.

  ### Part 1: The Philosophical Translation

  To build this tool, I kept three philosophical distinctions and dropped the rest.

  **What I Kept:**
  1.  **Counterfactual Dependence:** *If we had done X, would the incident still have happened?* This is the bedrock of causal reasoning. If the answer is "no," X is causally relevant.
  2.  **Normative Expectations:** *Were we supposed to do X?* An omission is only a cause if there was a duty, norm, or standard to perform the action. (The gardener causes the plant's death by not watering; the passerby does not, even though both didn't water it.)
  3.  **Causal Selection:** *Which omission do we write down?* There are infinite omissions (we didn't test, we didn't hire more staff, we didn't use a different language). We must select the one that is actionable and within our scope.

  **What I Dropped:**
  1.  **Ontological Status of Absences:** Philosophers argue whether "nothing" exists. We don't care. We care about Jira tickets.
  2.  **Preemption vs. Overdetermination Nuance:** While philosophically rich, in engineering, if two safeguards would have both worked, we treat them as redundant layers, not a metaphysical puzzle.
  3.  **Moral Responsibility:** Causation $\neq$ Blame. The procedure isolates *what happened*, not *who pays*.

  ---

  ### Part 2: The Omission Decision Procedure

  **Timebox:** 20 Minutes
  **Who:** Postmortem Facilitator + 2 Engineers involved
  **Output:** A classification for the incident report (Root Cause, Contributing Factor, or Not Causal).

  #### Phase 1: The Physics Check (Counterfactuals)
  *Goal: Determine if the omission is physically/logically relevant.*

  **Q1: The Prevention Test**
  *Question:* "If this specific check/step/limit **had been in place** at the time of the incident, is it >90% certain the incident would have been prevented or significantly mitigated?"
  *   **No:** Stop. This omission is **Not Causal**. (It didn't matter).
  *   **Yes:** Proceed to Q2.

  **Q2: The Feasibility Test**
  *Question:* "Was it technically and operationally possible to implement this check/step **before** the incident occurred, given our knowledge and tools at that time?"
  *   **No:** Stop. This is **Context**, not a Cause. (You can't be blamed for not inventing time travel).
  *   **Yes:** Proceed to Phase 2.

  #### Phase 2: The Norm Check (Expectations)
  *Goal: Determine if the omission violates an agreed-upon standard.*

  **Q3: The Duty Test**
  *Question:* "Was there an explicit rule, documented standard, or widely accepted industry practice requiring this check/step **prior** to the incident?"
  *   *Examples of Yes:* "Our style guide requires input validation," "DBA best practices require connection limits," "The runbook said to check X."
  *   *Examples of No:* "We thought about doing this but never agreed on it," "This is a new type of failure we haven't seen."
  *   **No:** **HANDOFF POINT.** (See "The Management Handoff" below). Do not list as Root Cause. List as "New Requirement Identified."
  *   **Yes:** Proceed to Q4.

  **Q4: The Reliance Test**
  *Question:* "Did the system or team rely on this step being done (or not done) as part of normal operation?"
  *   *Context:* If a runbook step is known to be broken and everyone skips it, the system *actually* relies on the skip, not the step.
  *   **No (System relied on skipping):** The omission is **Not Causal**. The *presence* of the bad step is the cause.
  *   **Yes:** Proceed to Phase 3.

  #### Phase 3: The Selection Check (Scope)
  *Goal: Prevent infinite regression and pick the right ticket.*

  **Q5: The Proximity Test**
  *Question:* "Is this the closest omission to the failure, or is it a higher-level policy failure?"
  *   *Example:* "Engineer didn't type the command" (Close) vs. "Manager didn't train engineer" (Distant).
  *   *Rule:* Prefer the omission closest to the code/config that the engineering team can directly fix.
  *   **Decision:** Select the closest actionable omission. Mark others as **Contributing Factors**.

  **Q6: The Overdetermination Check**
  *Question:* "Were there multiple missing safeguards (e.g., no alert AND no validation) where either one alone would have stopped this?"
  *   **Yes:** List **Both** as Contributing Factors. Do not force a single "Root Cause" if the system failed due to a lack of defense-in-depth. Mark the Root Cause as "Systemic Gap in Defense-in-Depth."
  *   **No:** List the single omission as **Root Cause**.

  ---

  ### Part 3: The Management Handoff

  **Where Phase 2, Q3 fails:**
  If the answer to "Was there a duty?" is **No**, the procedure stops calling it a "Cause."
  *   **Why:** You cannot have a "Root Cause" of "We didn't do something we never promised to do." That is a feature request, not a bug.
  *   **The Conflict:** This is where SLA credits get tricky. If your contract says credits apply for "Service Failures caused by Engineering Omission," but there was no duty to omit, you are in a gray zone.
  *   **Action:** This decision must be escalated to Engineering Management/Legal. They must decide if this incident creates a *new* duty going forward. The postmortem team should not invent duties retroactively to satisfy SLA wording.

  ---

  ### Part 4: Running the Cases

  Here is how the procedure handles your three backlog items.

  #### Case 1: The Database Connection Pool
  *Incident:* Runaway query exhausts pool. No max-connection limit was set.
  *   **Q1 (Prevention):** Yes. A limit would have queued/rejected the runaway query, preserving service for others.
  *   **Q2 (Feasibility):** Yes. DB engines support this; it's a config flag.
  *   **Q3 (Duty):** **Debatable.** Is it "widely accepted industry practice"? For production DBs, yes. Was it in your internal "DB Setup Checklist"? If yes $\rightarrow$ Cause. If no $\rightarrow$ Handoff.
  *   **Q4 (Reliance):** Yes. The system assumed limits were handled or didn't need handling.
  *   **Q5 (Proximity):** The missing config is the closest omission.
  *   **Result:** **Root Cause: Missing Configuration Standard.**
  *   **Team Reaction:** Generally accepted. It's a clear hygiene fix.

  #### Case 2: The Misleading Runbook
  *Incident:* On-call skips a runbook step. That step would have caught the bad config. However, the step has been wrong for months, and everyone skips it.
  *   **Q1 (Prevention):** Yes. If the step were followed *and correct*, it would have caught it.
  *   **Q2 (Feasibility):** Yes.
  *   **Q3 (Duty):** Yes, on paper. Runbooks are mandatory.
  *   **Q4 (Reliance):** **NO.** The procedure asks: *Did the system rely on this step?* Since everyone knew it was broken and skipped it, the *actual* operational norm was "Ignore Step 4."
  *   **Result:** **The On-Call's Omission is NOT a Cause.**
  *   **Real Cause:** The presence of an unmaintained runbook (Commission, not Omission).
  *   **Uncomfortable Truth:** This protects the engineer. Management often wants to list "Human Error: Skipped Step" as the cause to close the ticket. This procedure forbids that. It forces you to fix the runbook process, not blame the runner.

  #### Case 3: The Two Missing Safeguards
  *Incident:* No input validation (code) AND no alert on error rate (ops). Either would have prevented customer impact.
  *   **Q1 (Prevention):** Yes for both.
  *   **Q2 (Feasibility):** Yes for both.
  *   **Q3 (Duty):** Yes for both (Coding standards + Ops monitoring standards).
  *   **Q6 (Overdetermination):** **Yes.** Both were missing.
  *   **Result:** **Root Cause: Systemic Gap in Defense-in-Depth.** Contributing Factors: Missing Validation, Missing Alert.
  *   **Uncomfortable Truth:** Your team likely hates this. Engineers want a single ticket to close ("Add Alert"). Management wants a single owner ("Who owns validation?"). This procedure forces you to admit that *both* teams failed and *both* fixes are required to restore safety. You cannot close the postmortem until both Jira tickets are filed. This slows down the "close the ticket" velocity, which teams dislike.

  ---

  ### Part 5: Limitations & The "Values" Trap

  You asked for honesty about where this procedure cannot save you.

  **1. The SLA Wording Trap**
  If your contract says *"SLA Credit applies if Root Cause is Engineering Negligence,"* but the procedure determines the omission was *"New Requirement Identified"* (Phase 2, Q3 = No), you have a factual finding that contradicts a financial incentive.
  *   **Limit:** The procedure cannot resolve contract ambiguity. If you label a "New Requirement" as a "Cause" to trigger a credit (or avoid one), you are lying about the causation to satisfy finance. The procedure exposes this lie; it doesn't fix it.

  **2. The "Reasonable Person" Standard**
  Phase 2, Q3 relies on "widely accepted industry practice." In a novel stack, nobody knows what that is.
  *   **Limit:** This becomes a values call. Is it "negligent" not to have a chaos engineering program? Some say yes, some say no. The procedure hands this off to management. If management decides "Yes, we should have had that," they are creating a *retroactive duty*. The procedure flags this as a values decision, not a factual one.

  **3. Blame vs. Cause**
  The procedure separates *causal omission* from *blameworthy omission*.
  *   **Example:** An engineer skipped a step because they were handling 3 simultaneous P1s (burnout).
  *   **Procedure:** Q4 (Reliance) might say the omission caused the outage.
  *   **Values:** Is it fair to blame them? No.
  *   **Limit:** The procedure will still list the omission as a causal factor. It cannot account for *excuses*, only *causes*. You need a separate "Blameless Culture" policy to overlay this. Do not use this checklist to decide disciplinary action.

  ### Summary for your Team
  Tell them this: *"This checklist isn't about finding the truth of the universe. It's about stopping us from arguing about metaphysics and starting us on fixing the system. If the checklist says 'Handoff,' that means we need a manager to make a policy decision, not an engineer to make a guess."*
