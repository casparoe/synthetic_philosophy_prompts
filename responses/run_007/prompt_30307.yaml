answer: |-
  The pattern you are describing is the textbook definition of **Goodhart's Law**.

  The most common phrasing of the law is: **"When a measure becomes a target, it ceases to be a good measure."**

  This fits your carving exactly because it specifically isolates the *act of targeting* as the cause of the failure, rather than the metric being wrong from the start or people being inherently dishonest. Here is how it aligns with the details you provided:

  1.  **Initial Alignment:** Goodhart's Law assumes the metric is a valid proxy *before* optimization pressure is applied. You noted, "At first the number tracks the thing fine."
  2.  **The Mechanism:** The breakdown happens because rational agents (your team) optimize for the constraint they are judged on. You noted, "because the number is what people get judged on, people start doing things that move the number."
  3.  **No Fraud Required:** The law covers behavioral adaptation, not data falsification. You noted, "Nobody's lying — the tickets really are closed."
  4.  **ML Connection:** In AI safety, this is often called "reward hacking" or "specification gaming," but it is widely recognized as an instance of Goodhart's Law (specifically *Adversarial Goodhart*).

  There is a close sibling concept called **Campbell's Law**. It is often used interchangeably, but there is a nuanced difference in "carving." Campbell's Law focuses on the **corruption of the social process** itself (e.g., education quality drops because teachers teach to the test). Goodhart's Law focuses on the **loss of informational value** in the metric (e.g., test scores no longer predict actual knowledge). Since you emphasized that the number "stops being informative even to the people who built the dashboard," Goodhart's Law is the slightly more precise fit, though Campbell's Law would also be correct in a sociological context.

