      *   *Reference:* Mention the Stern Review (2006) as it's the canonical UK example of this debate regarding climate change. Stern used a near-zero pure time preference rate.

  6.  **Final Polish:** Check the flow. Ensure the distinction between *descriptive* (how people behave) and *normative* (how we ought to act) is clear. Ensure the distinction between *consumption* and *wellbeing* is maintained as per the prompt.

