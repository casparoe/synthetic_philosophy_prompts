answer: |-
  This is a profound question that strikes at the heart of welfare economics and intergenerational ethics. You are right to sense that the Treasury's methodology is not merely a technical instrument for allocating capital, but a vessel for substantive moral commitments. The tension you identify—between the mathematics of finance and the morality of wellbeing—is the same friction that animated the debate surrounding the Stern Review on the Economics of Climate Change in 2006.

  To address your query, we must disentangle the economic justifications from their ethical implications, and then consider the structural consequences of altering the discount rate.

  ### 1. Efficiency or Moral Substance?

  It is a common defence among practitioners to claim that discounting is strictly a matter of efficiency—a way to ensure public money is not tied up in low-yield projects when it could be invested elsewhere to generate greater wealth for the future. This argument relies on the **opportunity cost of capital**. If the government spends £1 billion on a flood defence today, that is £1 billion not invested in infrastructure or education that might raise future GDP.

  However, this defence collapses when the 'benefit' in question is not financial return but the prevention of irreversible harm, such as loss of life or species extinction. To apply the opportunity cost of capital to human survival is to commit a category error. It treats a life saved as a unit of currency that can be arbitrated against market returns.

  Furthermore, the argument that **future people will be richer** (the growth component of the Ramsey rule) assumes that wellbeing is perfectly substitutable with consumption. It posits that a life saved in a wealthy future is 'worth' less in utility terms than a life saved in a poorer present because the marginal utility of income is lower for the rich. While this may hold for consumer goods, it is ethically tenuous when applied to fundamental rights, health, or existence itself. A carcinogenic chemical poses a threat to life, not merely to consumption smoothing.

  Therefore, the practice is not morally neutral. By applying a positive discount rate to wellbeing, the appraisal framework presupposes a **substantive view**: that the interests of present people outweigh the interests of future people, independent of the nature of those interests.

  ### 2. The Moral Picture: What Commitments are Made?

  If we accept that the discount rate encodes a moral view, what exactly is that view? It is rarely as explicit as 'future lives matter less', but the mechanics imply one of three positions:

  *   **Pure Time Preference:** This suggests that temporal distance itself diminishes moral weight. Frank Ramsey, the Cambridge economist, famously described this as 'ethically indefensible and arising merely from the weakness of the imagination'. If we reject discrimination based on race or geography, consistency demands we reject discrimination based on date.
  *   **Contractualism:** This view holds that we have weaker obligations to people who do not yet exist because they cannot reciprocate or participate in the social contract. This is a political justification rather than a moral one, prioritising the stability of the current polity over the welfare of successors.
  *   **Paternalistic Prioritisation:** This is the most pragmatic but least defensible view: that the living are entitled to prioritise themselves because they are the only ones who can vote, lobby, or suffer the immediate pain of taxation.

  In practice, the Treasury's **Green Book** attempts to mitigate this by using a declining discount rate (starting at 3.5% and falling to 3% for very long-term appraisals). This acknowledges that the standard justification weakens over time. However, even a 3% rate reduces a benefit occurring 100 years hence to roughly 5% of its present value. This commits the department to a form of **intergenerational utilitarianism** where the 'utility' of future generations is heavily truncated. It effectively says: *We will care about your survival, but only insofar as it does not inconvenience us significantly today.*

  ### 3. The Consequences of Near-Zero Discounting

  If you were to recommend a near-zero pure time preference rate for wellbeing (as Stern advocated for climate change), the implications for the appraisal framework would be radical, though not necessarily unworkable.

  **The Mathematical Impact**
  With a near-zero rate, the Present Value (PV) of benefits that persist indefinitely (such as preventing an extinction or stabilising the climate) approaches infinity. In a standard Cost-Benefit Analysis (CBA), any project with a permanent benefit and a finite cost would theoretically yield an infinite Benefit-Cost Ratio.
  *   **Result:** Long-term projects would dominate all short-term considerations. A flood defence scheme lasting 200 years would effortlessly outbid a hospital building programme, regardless of immediate need.

  **Would CBA Become Unworkable?**
  Not necessarily unworkable, but it would cease to be a tool for *trade-offs* and become a tool for *lexicographic ordering*.
  1.  **Budget Constraints:** CBA assumes we can fund all projects with a positive Net Present Value (NPV). If near-zero discounting makes the NPV of all long-term safety projects astronomical, the budget constraint becomes the only binding limitation. We would move from 'which project creates the most value?' to 'which project is most urgent within the fixed budget?'.
  2.  **Uncertainty:** The further into the future we look, the less certain our predictions become. A near-zero discount rate makes the appraisal hyper-sensitive to assumptions about the distant future. A tiny change in the probability of an event 150 years from now could swing the decision. The framework would need to incorporate much more robust sensitivity analysis and real-options reasoning (the value of waiting for more information).
  3.  **Separation of Accounts:** A pragmatic solution, often suggested by philosophers like Henry Shue, is to separate 'consumption' from 'safety'. We might apply a standard discount rate to economic consumption (roads, IT systems) where the 'richer future' argument holds, but apply a near-zero rate to 'basic rights' (life, health, ecosystem integrity). This creates a two-tier appraisal system.

  ### Conclusion

  To answer your specific question: the practice presupposes a substantive moral view. It treats time as a moral cost, implying that our obligations diminish as the temporal horizon recedes. It privileges the concrete suffering of the present over the statistical suffering of the future.

  If you move to a near-zero discount rate for wellbeing, you do not break the machinery of appraisal, but you change its purpose. It stops being a mechanism for balancing competing interests across time and becomes a mechanism for safeguarding minimum thresholds of existence for future generations.

  In your review, you might consider recommending a **dual-rate approach**. Maintain the current discount rate for standard economic consumption, where opportunity costs and growth assumptions are valid. However, for appraisals involving irreversible loss of life, permanent environmental damage, or existential risk, apply a near-zero pure time preference rate. This acknowledges that while a pound next year is worth less than a pound today, a life next year is not worth less than a life today. This would align the Treasury's mathematics with the moral intuition that the government is a trustee for the nation across time, not merely a manager of the current quarter's accounts.
