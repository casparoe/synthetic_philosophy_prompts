answer: |-
  ### Tolstoy vs. The Readymade: A Structural Mapping

  To assess whether Duchamp's *Fountain* refutes Tolstoy or merely bypasses him, we must resist the anachronistic temptation to judge Tolstoy by post-1950s institutional theories of art. Tolstoy's *What Is Art?* (1897) is not an ontological inquiry into what objects *are*; it is a moral and psychological inquiry into what human activities *do*. Duchamp's move, conversely, is largely ontological and linguistic. When we run the 1917 episode through Tolstoy's specific machinery, the results are more complex than the standard "Tolstoy was a reactionary" narrative suggests.

  #### 1. Applying Tolstoy's Criteria to *Fountain* and the Episode

  **The Infection Test and Sincerity**
  Tolstoy defines art as the transmission of feeling from artist to viewer, where "infection" is the success metric. The most critical condition is **sincerity**: the artist must genuinely feel what they transmit.
  *   **Application:** Duchamp claimed the creative act was not in the crafting (he bought the urinal) but in the *choice* and the *presentation*. He described a feeling of "aesthetic indifference" or intellectual pleasure in the selection.
  *   **Tolstoy's Judgment:** Tolstoy would likely rule that *Fountain* fails the infection test. The "feeling" transmitted is not a shared human emotion (joy, sorrow, religious awe) but an intellectual puzzle or a shock. For Tolstoy, intellectualism without emotional infection is counterfeit. Furthermore, because Duchamp's stance was ironic and detached, Tolstoy would flag a lack of **sincerity**. To Tolstoy, irony is often a mask for insincerity, a way for the upper classes to amuse themselves without committing to moral truth.
  *   **Verdict:** Strictly applied, Tolstoy's criteria classify *Fountain* as **non-art**. It does not unite humanity in feeling; it divides them into those "in the know" and those scandalized.

  **The Attack on Upper-Class/Professional Art**
  Tolstoy argues that professionalized art institutions create a closed loop where experts validate each other's work, excluding the common people and producing "counterfeit" art that relies on imitation, obscurity, or technique rather than feeling.
  *   **Application:** The Society of Independent Artists promised "No Jury, No Prizes." Yet, the Board (including Duchamp's own circle) voted to hide *Fountain*.
  *   **Tolstoy's Judgment:** Here, the episode is startlingly Tolstoyan. Tolstoy predicts exactly this behavior from art institutions. He argues that when art becomes a professional guild, it protects its own boundaries against anything that threatens its economic or social capital. The Board's suppression confirms Tolstoy's thesis that "professional art" is a conspiracy of exclusion. The fact that they hid a mass-produced plumbing fixture validates Tolstoy's claim that the art world values status over substance.
  *   **Verdict:** The *episode* (the suppression) confirms Tolstoy's sociological critique of art institutions, even if the *object* fails his definition of art.

  #### 2. What the Theory Explains vs. Where It Fails

  **Explained (The Tolstoyan Predictions)**
  1.  **Institutional Hypocrisy:** Tolstoy's theory predicts that art bodies claiming openness will revert to exclusivity when confronted with objects that undermine their expertise. The Board's panic over *Fountain* fits Tolstoy's model of a protective guild.
  2.  **The Class Divide:** Tolstoy argues upper-class art is incomprehensible to the peasantry. *Fountain* was incomprehensible to the general public (seen as a prank or obscenity) but valorized by a small elite. Tolstoy would cite this as proof of the art world's detachment from universal human life.
  3.  **Counterfeit Labor:** Tolstoy despises art that lacks laborious craft if that lack is disguised as sophistication. He would view the readymade as the ultimate admission that the "art" is in the branding (the signature "R. Mutt"), which aligns with his critique of art as a market commodity rather than a spiritual service.

  **Missed (The Silence and Errors)**
  1.  **Conceptual Transmission:** Tolstoy's theory is silent on the transmission of *ideas* as a valid artistic function. He assumes art is emotional contagion. *Fountain* transmits a philosophical proposition ("Is this art?"). Tolstoy has no category for this; he simply dismisses it as bad communication.
  2.  **The Role of Context:** Tolstoy focuses on the object and the creator's psyche. He does not account for the *institutional theory of art* (which Danto and Dickie later formalized), where the context *makes* the art. Tolstoy assumes the feeling resides in the work; Duchamp showed the status resides in the frame.
  3.  **Productive Negativity:** Tolstoy believes art must unite and affirm Christian consciousness. He cannot account for art that functions through negation, critique, or questioning. To Tolstoy, *Fountain* is destructive; to Duchamp, that destruction is the creative act.

  #### 3. Refutation, Confirmation, or Bypass?

  Does *Fountain* refute Tolstoy? **No, not logically.**
  If you accept Tolstoy's premise that art *must* transmit sincere emotional feeling to unite humanity, *Fountain* is simply not art. It is a philosophical gesture or a prank. For *Fountain* to refute Tolstoy, one must first assume *Fountain* is indisputably "Good Art" and then show it meets Tolstoy's criteria. It does not meet his criteria. Therefore, within Tolstoy's closed system, he remains consistent.

  However, *Fountain* **bypasses** Tolstoy by changing the question.
  Tolstoy asks: "What is the *moral utility* of art?"
  Duchamp asks: "What is the *definitional boundary* of art?"
  *Fountain* shows that Tolstoy's theory is historically situated. It was aimed at the sentimental, bourgeois realism and Wagnerian opera of the late 19th century. It was not designed to handle linguistic-conceptual gestures.

  **Settled vs. Contested Judgments**
  *   **Settled:** Tolstoy's definition requires emotional infection and sincerity. *Fountain* is conceptual and ironic. Therefore, under Tolstoy's definition, *Fountain* is not art. Scholars of Tolstoy agree on this reading of his text.
  *   **Contested:**
      1.  **Duchamp's Intent:** Some scholars (e.g., Thierry de Duve) argue Duchamp was sincere in his aesthetic choice; others argue it was purely nihilistic. If Duchamp *was* sincere about the "pleasure of choice," a charitable Tolstoyan *might* argue there was a feeling transmitted, though this is a minority reading.
      2.  **The Value of the Theory:** Aesthetic philosophers disagree on whether Tolstoy's failure to categorize *Fountain* is a flaw in Tolstoy or a flaw in *Fountain*. Emotionalists (like Tolstoy) still exist; they argue *Fountain* is overvalued. Institutionalists argue Tolstoy is obsolete. There is no consensus on which framework is "correct."
      3.  **The Board's Motivation:** While Tolstoy would attribute the suppression to class protectionism, historical records suggest the Board was also concerned with obscenity laws and the literal functionality of the object. Attributing it solely to "artistic elitism" is a Tolstoyan interpretation, not a settled historical fact.

  ### Conclusion

  *Fountain* does not refute Tolstoy; it renders his specific moral criteria inapplicable to a new genre of artistic practice. However, the *sociological dynamics* of the *Fountain* episode (the exclusion by the committee) serve as a potent confirmation of Tolstoy's critique of art institutions. The theory is not logically broken by the urinal, but it is historically bounded. It explains the *politics* of the episode better than the *ontology* of the object.

