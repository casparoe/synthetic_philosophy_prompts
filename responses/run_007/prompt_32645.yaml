answer: |-
  The United Nations Charter represents a hybrid institutional form that partially instantiates Kant's *Foedus Pacifikum* (pacific federation) while fundamentally violating the moral and structural preconditions Kant deemed necessary for its success. A rigorous mapping reveals that while the UN adopts Kant's external legal prohibitions, it abandons his internal political requirements. Consequently, the UN's operational history does not refute Kant's claim that peace must be instituted through law; rather, it vindicates his deeper, often overlooked contention that external law is inert without the internal republican constitution of the member states. The UN is not a Kantian federation that failed; it is a Concert of Power that succeeded in dressing itself in legal language, thereby demonstrating that "law" without the specific moral anthropology Kant prescribed collapses back into "prudence."

  ### Mapping the Preliminary Articles: Prohibitions and Sovereignty

  The UN Charter aligns closely with Kant's Preliminary Articles regarding the external conduct of states, specifically concerning interference and the monopoly on violence. Kant's prohibition on forcible interference in the constitution or government of another state finds a near-perfect realization in Article 2(4) and Article 2(7) of the Charter. The UN system is built on the principle of sovereign equality and non-intervention, mirroring Kant's insistence that the independence of states must be preserved even within a federation. However, this alignment is complicated by the postwar human rights regime (UDHR, ICCPR). While Kant's cosmopolitan right is limited to conditions of universal hospitality (the right to visit, not to conquer), the modern human rights framework asserts a normative claim on domestic jurisdiction that Kant's strict non-interference clause would likely reject as a violation of state autonomy, unless grounded in the violation of cosmopolitan right itself.

  Regarding standing armies, the mapping is structurally consistent but functionally divergent. Kant calls for the gradual abolition of standing armies to remove the instrument of aggression. The UN possesses no standing army of its own; Article 43's provision for armed forces made available to the Security Council remains stillborn. In this sense, the UN respects Kant's fear of a supranational leviathan with a monopoly on violence. However, Kant's goal was the demilitarization of *states*, whereas the UN system merely demilitarized the *organization* while legitimizing the retention of national armed forces for "self-defence" (Article 51). Thus, the UN realizes Kant's institutional constraint (no UN army) but fails to catalyze his substantive goal (the reduction of state militarism). The provisions on national debts contracted for war purposes fall entirely outside the UN Charter's categories, remaining in the realm of economic institutions like the IMF, which operate on prudential rather than moral-legal grounds.

  ### Mapping the Definitive Articles: The Republican Deficit and the Veto

  The critical fissures appear in the Definitive Articles. Kant's First Definitive Article requires the civil constitution of every state to be republican. The UN Charter makes no such requirement for membership. Article 4 opens membership to all "peace-loving states," a criterion that has historically admitted autocracies, theocracies, and dictatorships without condition. This is a profound departure. For Kant, republicanism is not merely a preference but the causal mechanism for peace, as it requires the consent of citizens who bear the costs of war. By universalizing membership regardless of regime type, the UN severed the link between internal legitimacy and external peace. It attempted to build a *Foedus Pacifikum* among entities Kant would classify as despotic, thereby removing the internal guarantee that the federation would remain pacific rather than becoming an instrument of aggrandizement.

  Kant's Second Definitive Article calls for a federation of free states, explicitly rejecting a world state (*civitas gentium*) which he feared would become a soulless despotism. The UN realizes this distinction successfully; it is a treaty-based organization of sovereigns, not a super-state with direct legislative power over individuals. However, the internal architecture of this federation violates Kant's principle of equality. Kant's federation implies a voluntary association of equals under public law. The Security Council veto power institutionalizes inequality, granting five states the legal right to paralyze the collective will. This is not a Kantian legal order; it is a codification of power asymmetry. In Kantian terms, the veto transforms the "public law" of the federation back into the "state of nature" among the great powers, where might determines right.

  Finally, Kant's Third Definitive Article, cosmopolitan right, is partially realized but extended beyond Kant's intent. The UN refugee regime and the Law of the Sea codify the right to hospitality and commerce. Yet, Kant envisioned this as a right of individuals against foreign states. The UN system largely mediates these rights through the state, reinforcing the very sovereignty that often violates cosmopolitan right. The UN High Commissioner for Refugees operates in the spirit of Kant, but its dependence on state consent highlights the limitation: cosmopolitan right remains subordinate to sovereign prerogative.

  ### Verdict: The Triumph of Prudence over Law

  The episode of the UN tells against the sufficiency of Kant's institutional design *as it is often interpreted*, but ultimately vindicates his philosophical anthropology. If one reads *Perpetual Peace* as a blueprint for an international organization alone, the UN suggests failure: the law exists (the Charter), but peace is not perpetual, and aggression persists where the veto blocks enforcement. However, this reading ignores Kant's First Definitive Article. The UN attempted to institute peace through external law among states that lacked the internal republican constitution Kant identified as the prerequisite for lawful behavior.

  Therefore, the UN is best understood not as a failed Kantian federation, but as an institution that proves Kant's central claim: peace cannot be left to prudence or good will, but neither can it be instituted by law alone if the legislators (the states) are not internally constituted to obey the law. The veto is the smoking gun. It represents the moment where "prudence" (the national interest of the P5) explicitly overrode "law" (the collective security mandate). Kant argued that a federation must bind states to leave the state of nature. The veto allows the most powerful states to remain in the state of nature while forcing weaker states into a legal order. This asymmetry confirms Kant's suspicion that without a republican civil constitution—which aligns the ruler's interest with the ruled's aversion to war—states will treat international law as a tool of policy rather than a constraint on power.

  The UN demonstrates that a *Foedus Pacifikum* composed of non-republics inevitably degrades into a balance-of-power system disguised as a legal order. The persistence of war outside the Council's reach is not a refutation of the need for law, but evidence that the specific *type* of law Kant envisioned (public, binding, egalitarian) was never actually instantiated. The Charter created a legal regime, but the veto ensured it remained a prudential one. Thus, the UN validates Kant's deeper thesis: external peace is impossible without internal political transformation. The UN tried to shortcut the moral development of states through institutional engineering, and the result was a system where law is subordinate to the prudence of the powerful.

  ### The Contestable Mapping

  The most contestable element of this analysis is the interpretation of Kant's "Federation" as requiring strict equality among states. Kant is ambiguous on whether the federation must treat all states as equals in voting power or merely as equals in sovereignty. A defender of the UN might argue that the veto was a historical necessity to secure the participation of great powers, without which the federation would not have formed at all. Kant acknowledges that the establishment of peace is a moral task that must contend with political reality. One could argue that the veto is a transitional "preliminary" measure to ensure the federation's survival, rather than a permanent violation of the definitive articles. If the veto is viewed as a pragmatic concession to secure the *existence* of the federation (which Kant admits is a duty), then the UN remains closer to a Kantian project than this analysis suggests. However, this defense relies on the hope that the veto is temporary, whereas seventy years of operation suggest it is a structural feature that permanently privileges prudence over law, cementing the very inequality Kant's moral law rejects.
