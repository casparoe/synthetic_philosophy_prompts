      *   **User's Skepticism:** Is the analogy doing too much work? Does it imply separability where there isn't any? Does it make the "alarm" seem optional when it might be integral?
      *   **Task:** Audit the analogy (map it, find breaks), evaluate the conclusion based on the audit, and propose better analogies if needed.

