      *   *Where does it break?*
          *   Fire alarms are designed to be separable (you can test the sensor without ringing the bell).
          *   In evolution, pain's *function* is protection. If the alarm doesn't ring, the system is broken, not just modified.
          *   Phenomenology: Is the "ouch" really the same if the "ugh" is gone? Or does the "ugh" constitute part of the "ouch"?
          *   Neurobiology: The pathways aren't strictly serial; they are parallel and recurrent. The insula integrates both.
      *   *Philosophical Implications:* Representationalism vs. Imperativism. Is pain a perception of damage or a command to stop?

  3.  **Structuring the Audit:**
