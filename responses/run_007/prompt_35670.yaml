answer: |-
  **Setting:** *The Saloon Bar of The Old Crown, Oxford. 6:30 PM. The air smells of stale ale and damp wool. Two philosophers, ELENA (Intellectualist) and MARCUS (Neo-Rylean), stand near a high-top table, loosening their conference lanyards. They've just survived a three-hour panel on "The Architecture of Skill."*

  **Marcus:** (Signalings the bartender) I think you won the room, Elena. Though I suspect that's because the majority of the audience are terrified of admitting they don't know the propositional content of their own golf swings.

  **Elena:** (Smiling) And I think you won the intuition pumps. The phenomenology of "just doing it" is always a crowd-pleaser. But intuitions are data, not verdicts. Stanley and Williamson taught us that.

  **Marcus:** S&W. The 2001 paper that launched a thousand footnotes. Look, I'll grant you the linguistic surface. "I know how to ride" *looks* like "I know that the earth is round." The embedding tests work. But you're buying the surface syntax at the cost of the metaphysics.

  **Elena:** I'm buying it because the syntax reflects the structure of the mind. If I say, "I know how to fix the carburetor," I am ascribing a cognitive relation to a way of fixing the carburetor. That relation is knowledge. The relata are propositions. What's the alternative? Magic?

  **Marcus:** Not magic. Disposition. Ryle's point wasn't that skills are mystical; it was that they aren't *ghostly inner transactions*. Let's start with the Regress. It's still the elephant in the room. If knowing-how is merely knowing-that some way *w* is a way to act, then to execute the action, I must first contemplate that proposition.

  **Elena:** We've been over this. S&W explicitly block the regress. To know how to $\phi$ is to stand in the knowledge-relation to a proposition. It does *not* require that I consciously entertain that proposition every time I $\phi$. I can know that Paris is in France without reciting it while I walk.

  **Marcus:** But walking isn't the application of the knowledge. Riding a bike *is* the application. If the knowledge is propositional, applying it requires a rule. "If way *w* is the way to ride, instantiate *w*." But how do I apply *that* rule? Do I need a further piece of knowledge to apply the first piece? If knowing-how is a species of knowing-that, you need a further knowing-how to apply the that.

  **Elena:** You're conflating the *analysis* of the state with the *process* of production. The intellectualist claim is about the nature of the state possessed, not the causal chain of every muscle twitch. When I possess the knowledge, my motor system is tuned to the truth of the proposition. The regress only arises if you think acting requires a prior act of contemplation. I don't think that. I think acting requires a sensitivity to reasons, and propositions are the content of those reasons.

  **Marcus:** "Sensitivity to reasons." There it is. You're smuggling the skill back in under the label "sensitivity." If my motor system is "tuned" to the proposition without me consciously accessing it, what is doing the tuning?

  **Elena:** Practice. Habit. Causal history. None of that contradicts intellectualism.

  **Marcus:** It contradicts the *reduction*. Because if the "tuning" is non-propositional—if it's a bodily calibration that allows me to access the proposition practically—then the heavy lifting is being done by the non-propositional state. The proposition is just a shadow on the wall. Which brings me to your "Practical Mode of Presentation." The PMOP.

  **Elena:** (Takes a sip of wine) The cornerstone of the view.

  **Marcus:** The get-out-of-jail-free card. You say I know *that w is a way to ride*, but I grasp *w* under a "practical mode." My question is simple: What *is* a practical mode of presentation?

  **Elena:** It's a first-personal, egocentric way of thinking about an action. It's the difference between thinking "The arm goes up" (spectator mode) and thinking "I shall raise my arm" (practical mode). It's still representational. It still has satisfaction conditions.

  **Marcus:** But is it propositional? If the PMOP is itself a piece of knowledge-that, we're back at the regress. How do I grasp the PMOP? Do I need a practical mode to grasp the practical mode?

  **Elena:** No. It's a mode of *access*, not a further object of knowledge.

  **Marcus:** Exactly! It's a mode of access. And if that mode of access is distinct from theoretical access—if it's embodied, indexical, immediate—then isn't that mode of access just *knowing-how* in disguise? You've said: "Knowing-how is knowing-that, provided you have the knowing-how to grasp the that."

  **Elena:** (Laughs) That's sharp. But no. I'm saying the *format* of the representation is practical. Think of it like a map. A map is propositional content, but I can use it theoretically (to answer a quiz) or practically (to navigate). The navigation isn't a new kind of knowledge; it's the same content used in a different functional role.

  **Marcus:** But a map is static. Skill is dynamic. Let's pivot. Gradability. This one keeps me up at night, and it should keep you up too.

  **Elena:** Let's hear it.

  **Marcus:** I know how to swim. You know how to swim. Michael Phelps knows how to swim. We all satisfy the predicate. But Phelps knows how to swim *better* than me. Much better. Knowledge-how admits of degrees. Now, take knowledge-that. I know that Paris is the capital of France. Do I know it *better* than you? No. Either I know it, or I don't. Truth is binary. Belief is binary in its success condition. If knowing-how reduces to knowing-that, where do the degrees come from?

  **Elena:** Two responses. First, knowledge-that *is* gradable. I can know a mathematical theorem superficially, or I can know it deeply, understanding its proof, its history, its implications. We say, "She knows the subject better than he does."

  **Marcus:** That's knowledge of a *domain*, not knowledge of a *proposition*. You can't know *that p* to a degree. You can't be 60% pregnant, and you can't 60% know that Paris is the capital.

  **Elena:** Okay, second response. Knowing how to swim isn't knowing a single proposition. It's knowing a vast, complex set of propositions about body positioning, breath control, hydrodynamics. Phelps knows more of them, and he knows them more securely. The gradability comes from the quantity and quality of the propositional cluster.

  **Marcus:** That feels like desperation, Elena. When Phelps cuts through the water, he isn't accessing a cluster of hydrodynamic propositions. He's flowing. If you define the "propositional cluster" loosely enough to cover his fluid adjustments, you've stretched "proposition" until it snaps. You're calling every bodily adjustment a "truth condition."

  **Elena:** Why is that a problem? If his body is tracking the truth of "this angle reduces drag," then his body is tracking a truth.

  **Marcus:** But *tracking truth* isn't *knowing truth*. A thermostat tracks temperature. It doesn't know it. You need an agent to stand in a relation to the content. And if that relation is non-reflective, non-linguistic, and graded... why call it "knowing-that" at all? Why not just admit there are two fundamental categories of knowledge?

  **Elena:** Because parsimony. Because the linguistic evidence suggests a unified verb "to know." Because positing a sui generis "knowing-how" faculty looks like a homunculus. It's a little man inside watching the body do things. I'm trying to naturalize the mind. If I say skill is just propositional attitudes implemented by motor systems, I fit cognition into the standard belief-desire psychology.

  **Marcus:** And I'm trying to naturalize the *agent*. You're fitting action into a cognitive box. Here's where I think we actually bottom out. It's not about linguistics. It's about the direction of fit.

  **Elena:** Go on.

  **Marcus:** For you, the mind is primary. The world is something to be represented correctly. Action is just the output of correct representation. Knowing-how is derivative of Knowing-that because representation is the fundamental job of the brain.

  **Elena:** I'd say representation is necessary for flexible, intelligent action. A reflex isn't knowledge. A skill is intelligent. Intelligence requires content. Content is propositional.

  **Marcus:** But what if the content is *generated* by the action? What if I don't know the proposition "this is the way to ride" until I'm already on the bike, wobbling? The knowing is *in* the doing. It's not a precursor.

  **Elena:** That sounds like anti-realism about the content.

  **Marcus:** It sounds like embodied cognition. Here's the fork, Elena. If you can show me that the "Practical Mode of Presentation" has a structure that is genuinely propositional—subject, predicate, truth conditions, compositional semantics—without just pointing to the *behavior* and saying "see, it acts *as if* it believes," then you win.

  **Elena:** And if I can show you that your "disposition" isn't just a blind reflex—that it involves normative sensitivity, that the agent can be *wrong* in a way that isn't just mechanical failure—then I win. Because normative sensitivity implies a grasp of "how things ought to be," which is propositional.

  **Marcus:** (Nods slowly) So. The deadlock.

  **Elena:** The deadlock.

  **Marcus:** You think the normative dimension of skill proves it's cognitive. I think the cognitive dimension of cognition proves it's skilled.

  **Elena:** Precisely. You think action is the substrate of thought. I think thought is the substrate of action.

  **Marcus:** And the "Practical Mode of Presentation" is the border crossing where we both claim the territory.

  **Elena:** (Raises her glass) To the border crossing.

  **Marcus:** (Clinks glass) May it never be settled. If we solve it, the conference circuit dies.

  **Elena:** Cheers to that.
