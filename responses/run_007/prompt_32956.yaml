answer: |-
  You have stumbled onto one of the most famous and persistent headaches in the philosophy of science: **The Problem of Old Evidence**, formalized by Clark Glymour in 1980. Your friend's argument is a textbook formulation of it.

  You are right to feel that rejecting (3), (4), or (5) is mathematically suicidal. (3) is a theorem, (4) is algebra, and (5) is just the definition of entailment.

  The battle lines are drawn at **(1)** and **(2)**.

  If you want to save Bayesianism *and* the history of science, the standard move is to reject the assumption hiding inside **(2)**. Specifically, you reject the assumption of **Logical Omniscience**.

  Here is the breakdown of the solution, the mechanism, and the price tag.

  ---

  ### The Target: Step (2) and Logical Omniscience

  Step (2) says: *If E is old evidence, you already knew E... so P(E) = 1.*

  This relies on an idealization standard in textbook Bayesianism: **Logical Omniscience.** A perfect Bayesian agent is assumed to know all logical truths and all logical consequences of their beliefs instantly. If you know $H$, and $H$ logically entails $E$, a perfect Bayesian agent *already knows* $E$ is guaranteed by $H$.

  But real scientists (like Einstein) aren't logically omniscient.
  *   In 1900, physicists knew $E$ (Mercury's perihelion). $P(E) \approx 1$.
  *   In 1900, they did *not* know that General Relativity ($H$) entailed $E$. The logical connection itself was unknown.

  **The Solution:** You don't update on $E$ (since $P(E)$ is already 1). **You update on the logical connection.**

  Let $L$ be the proposition: *"Hypothesis H entails Evidence E."*
  Before Einstein finished GR, $P(L)$ was low (maybe he wasn't sure his math would work out). When he finished the derivation, he learned $L$. He didn't learn $E$; he learned that $H \to E$.

  When you conditionalize on $L$ (instead of $E$), the math works out such that $P(H|L) > P(H)$, even if $P(E)=1$.

  ### The Cost: What are you buying?

  If you take this route (often associated with Daniel Garber and Richard Jeffrey), here is what it costs the standard Bayesian picture:

  **1. You abandon the "Ideal Agent" model.**
  Standard Bayesian epistemology is often presented as a logic of consistency for perfect reasoners. By admitting that agents can be uncertain about logical connections ($P(H \to E) < 1$), you are admitting that agents are **not** logically omniscient.
  *   **The Sag:** This makes the formalism much messier. Standard probability theory assumes logical truths have probability 1. If you allow probabilities over logical sentences to vary, you need a more complex framework (often called "non-omniscient Bayesianism" or "hintikka-style epistemic logic").

  **2. You shift the locus of confirmation.**
  Confirmation is no longer just a relationship between a Hypothesis and the World ($H$ and $E$). It becomes a relationship between a Hypothesis, the World, and **our mathematical grasp of them**.
  *   **The Sag:** This makes confirmation partially psychological or sociological. It depends on when *humans* figured out the math, not just on the abstract relationship between theory and data. Some purists hate this; they want confirmation to be timeless, not dependent on when Einstein finished his calculations.

  ### Alternative Option: Reject Step (1)

  If relaxing logical omniscience feels like too much structural damage, the other main camp rejects **(1)**.

  They argue: **Confirmation is not synchronic probability raising.**
  They propose a **Counterfactual Account**: $E$ confirms $H$ if $P(H | E \& K_{-E}) > P(H | K_{-E})$, where $K_{-E}$ is your knowledge base *minus* the knowledge of $E$.

  Basically, you ask: "If I *hadn't* known about Mercury's perihelion, would learning GR make me expect Mercury's perihelion?" If yes, then $E$ confirms $H$.

  **The Cost:**
  *   **Subjectivity:** Reconstructing a "prior prior" (a state of ignorance you never actually inhabited) is highly speculative. There is no unique way to "subtract" evidence from your belief system.
  *   **Fictionalism:** You are basing scientific confirmation on a fictional history (a world where we didn't know the evidence).

  ### Which one should you pick?

  Since you said you want to **keep Bayesianism**, I recommend attacking **(2) via Logical Omniscience**.

  **Why?**
  1.  **It preserves the math:** You don't have to change Bayes' theorem or the definition of conditional probability. You just change what proposition is being updated.
  2.  **It matches scientific practice:** Scientists *do* get excited when a new theory explains old data. The excitement comes from the discovery of the *link*, not the data itself.
  3.  **It's the standard fix:** Most contemporary Bayesians (like Howson, Urbach, and Sprenger) accept that the Problem of Old Evidence proves that standard Bayesianism requires the idealization of logical omniscience to be dropped for real-world applications.

  **The "Exit" for your Discord argument:**
  Tell your friend: *"Step (2) assumes we are logically omniscient. It assumes that as soon as H exists, we instantly know all its consequences. But Einstein didn't know GR entailed Mercury's orbit until he did the math. We update on the discovery of the entailment, not the evidence itself. This saves Bayesianism, but it costs us the idea that Bayesians are perfect logicians."*

  That is the bill. You pay with perfection to save the history of science.
