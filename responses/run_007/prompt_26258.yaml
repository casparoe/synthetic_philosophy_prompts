answer: |-
  This is a sophisticated meta-ethical and structural critique. You are arguing that cluelessness is not a bug but a feature that renders consequentialism practically vacuous or self-undermining. You have correctly identified that standard replies (expected utility with subjective priors, rule-consequentialism, "everyone has this problem") often beg the question by assuming the very probabilistic structure that cluelessness calls into doubt.

  To map the exposure of your view, we must identify what would constitute a *internal* collapse of the argument rather than an external mitigation. Below is an analysis of what would count as a genuine defeater, sorted by the structural commitment it targets.

  ---

  ### 1. What a Successful Consequentialist Reply Must Achieve

  Existing replies fail your test because they are *exogenous*: they import epistemic norms (e.g., "use reasonable priors") or decision procedures (e.g., "follow rules") that are not generated by the consequentialist criterion itself.

  A successful reply—one that would force you to abandon or substantially revise your view—must achieve **Endogenous Guidance**. It must demonstrate that:
  1.  **The Ontology of Value generates the Epistemology of Action:** The theory must show that the nature of "the good" imposes constraints on probability assignments that make long-term calculation tractable *without* importing non-consequentialist epistemic norms.
  2.  **Robustness to Model Specification:** It must show that the ranking of actions is invariant across a wide range of causal models, such that the "ramifying" nature of causation does not lead to chaotic valuation swings.
  3.  **Non-Collapse:** It must achieve this without retreating to a deontological constraint or a virtue-ethical disposition that is only *instrumentally* justified (which you view as collapsing into non-consequentialism).

  **The Defeater:** A formal proof that for a specific class of consequentialist value functions (e.g., hedonistic, preference-based), the expected value of ordinary actions converges or remains stable despite causal ramification, derived *solely* from the axioms of the value theory.

  ### 2. Formal Results and Decision-Theoretic Dissolvers

  You mention expected value with bounded distributions as a standard reply you reject. However, there are more nuanced formal developments that aim to *dissolve* the problem rather than manage it. If these hold, your view loses its structural force.

  **A. The Symmetry Argument (Hilary Greaves)**
  *   **The Claim:** Greaves argues that for "simple" cluelessness (where we don't know the valence of downstream effects), there is often a symmetry between positive and negative unknown outcomes. If the probability distribution of unknown effects is symmetric around zero, their expected value is zero.
  *   **The Defeater:** If it can be formally established that causal ramification is **stochastically symmetric** regarding value, then the "long-run" component drops out of the calculation entirely. We only need to calculate the short-run, traceable effects.
  *   **Why it threatens your view:** It turns cluelessness from a blocker into a nullifier. You wouldn't need to trace consequences; you would know *a priori* that the untraceable ones don't impact the decision.
  *   **Vulnerability:** This relies on the assumption that good and bad outcomes are equally likely in the long run. If the world has a "value drift" (e.g., chaos tends toward entropy/suffering or toward order/flourishing), symmetry fails.

  **B. Imprecise Probabilities and E-Admissibility**
  *   **The Claim:** Standard EV assumes precise probabilities. Imprecise Probability (IP) theory allows for sets of probability functions. A decision is permissible if it is optimal under *at least one* function in the set (E-admissibility) or *all* (Gamma-maximin).
  *   **The Defeater:** If consequentialism is reformulated using IP, it can acknowledge "undefined" expectations without paralysis. It creates a formal space where an action is "right" even if its exact EV is unknown, provided it dominates alternatives across the set of plausible causal models.
  *   **Why it threatens your view:** It shows that the "severing" of rightness and decision procedure is a artifact of requiring *precision*, not a feature of consequentialism itself. A consequentialist can rationally act on imprecise grounds.
  *   **Vulnerability:** IP often leads to indeterminacy (many actions are permissible). If your critique is that consequentialism fails to be *action-guiding* (singular), IP might confirm your view that it fails to pick a unique winner.

  **C. Causal Damping and Discounting**
  *   **The Claim:** In complex systems, causal influence often decays exponentially over time (Lyapunov exponents in chaos theory).
  *   **The Defeater:** If physical causation implies that an agent's causal leverage drops below a threshold of moral significance within a short time horizon, the "long-run" problem is physically bounded, not just epistemically.
  *   **Why it threatens your view:** It attacks your premise about causation. If the "ramifying" effects are real but negligible in magnitude, the calculation becomes tractable.

  ### 3. Load-Bearing Commitments in Your View

  Your argument rests on three specific commitments. If any of these fail, your critique loses its bite.

  **Commitment A: The Guidance Constraint (Internalism)**
  *   *Your View:* A moral theory must provide a decision procedure that reliably tracks the criterion of rightness. If the criterion cannot guide, the theory is defective.
  *   *How it could fail:* **Moral Externalism.** If moral truth is independent of our ability to know it or act on it, consequentialism can be true even if clueless. The theory tells us what *makes* actions right, not necessarily how to *find* them.
  *   *The Defeater:** A compelling meta-ethical argument that "ought implies can" applies to *actions*, but not to *knowledge of consequences*. If you accept that a theory can be a "theory of truth" rather than a "user manual," the structural severance you identify is no longer fatal.

  **Commitment B: The Unity of Criterion and Procedure**
  *   *Your View:* If the decision procedure diverges from the criterion (e.g., "maximize EV" vs. "follow common sense"), the theory has collapsed into something else.
  *   *How it could fail:* **Sophisticated Consequentialism.** If it can be shown that adopting a non-consequentialist decision procedure is the *only* way to satisfy the consequentialist criterion (due to cluelessness), then the divergence is a feature, not a bug.
  *   *The Defeater:* A proof that "Direct Consequentialism" is self-defeating. If following the criterion directly leads to worse outcomes (due to cluelessness errors), then a consequentialist *must* abandon direct tracking. If you insist they must track directly, you are defining consequentialism in a way that ensures its failure (No True Scotsman).

  **Commitment C: The Nature of Causal Uncertainty**
  *   *Your View:* The uncertainty is radical (Knightian), not risk (Bayesian). We cannot assign probabilities.
  *   *How it could fail:* **Objective Bayesianism.** If there are logical principles (e.g., Maximum Entropy, Principle of Indifference) that *compel* specific probability assignments even in the absence of data, then the "undefined" distribution is actually defined by logic.
  *   *The Defeater:* A demonstration that rational agents are *required* by norms of rationality (which consequentialism can adopt) to assign specific priors. This closes the gap you see between "no data" and "no decision."

  ### 4. Post-Lenman Developments to Re-evaluate

  Since James Lenman's "Consequentialism and Cluelessness" (2000), the literature has shifted from "we can't know" to "how much does it matter if we don't?"

  **A. Hilary Greaves' "Cluelessness" (2015)**
  *   Greaves distinguishes between **simple cluelessness** (we don't know if effect X is good or bad) and **complex cluelessness** (we don't know the structural relationship between action and effect).
  *   *Why you might be underestimating it:* She argues simple cluelessness is solvable via symmetry (see above). Complex cluelessness is harder, but she suggests that for *ordinary* actions (not existential risk interventions), complex cluelessness is less prevalent than assumed.
  *   *What would count as a solution:* If Greaves can show that 90% of moral decisions fall under "simple cluelessness" where symmetry applies, your claim that it severs the connection for *ordinary* actions is empirically false.

  **B. Longtermism and Trajectory Changes (MacAskill, Ord)**
  *   Paradoxically, the longtermist literature takes cluelessness most seriously. They argue that while *ordinary* actions are clueless, *trajectory changes* are not.
  *   *Why you might be underestimating it:* They concede your point for ordinary acts but argue consequentialism remains viable because it identifies a *subset* of actions (institutional design, AI safety) where consequences are more traceable.
  *   *What would count as a solution:* If consequentialism is reformulated as a theory primarily for **structural interventions** rather than **ordinary acts**, your critique applies only to a domain consequentialists might willingly cede. This transforms the theory rather than refuting it.

  **C. The "Difference-Making" Approach**
  *   Recent work focuses on **causal contribution** rather than total outcome production.
  *   *What would count as a solution:* If consequentialism shifts to evaluating the *marginal difference* an agent makes (which is often more traceable than the total state of the world), the ramification problem shrinks. The "butterfly effect" applies to total states, but marginal contributions often dampen quickly.

  ### 5. Unfalsifiability and Insulation

  You ask if your view is insulated against counterargument. There is a risk here.

  **The Risk:** Your view approaches a **conceptual truth claim**: "Consequentialism *just is* the view that requires tracking untrackable consequences."
  *   If a consequentialist says, "We use heuristics," you say, "That's not real consequentialism."
  *   If a consequentialist says, "We use expected value," you say, "The probabilities are undefined."
  *   If a consequentialist says, "Morality doesn't need to guide," you say, "Then it's useless."

  **Is this a problem?**
  *   **Yes,** if it prevents engagement with actual consequentialist practice. If every adaptation is ruled "not consequentialist" by fiat, the critique becomes a verbal dispute about the label "consequentialism."
  *   **No,** if you are making a claim about the **logical topology** of the theory. If the core axiom is "Maximize Good," and "Good" is defined by "Causal Consequences," and "Causal Consequences" are "Unknowable," then the theory is practically empty. This is a valid structural critique (like proving a computer program enters an infinite loop).

  **How to test for insulation:**
  Ask yourself: *Is there a version of consequentialism I would accept as non-clueless?*
  *   If the answer is "No, because causation is always ramifying," your view is robust but perhaps too broad (it might prove too much, undermining all forward-looking ethics).
  *   If the answer is "Yes, if they adopt Imprecise Probabilities and Symmetry," then your view is falsifiable. You should update if those formal tools succeed.

  ### Summary: The Map of Exposure

  Your view is most vulnerable in the following order of decisiveness:

  1.  **High Decisiveness:** **The Symmetry Proof.** If it is demonstrated that unknown long-term effects cancel out in expectation for ordinary actions, the "cluelessness" does not affect decision-making. The connection between rightness and procedure is restored without new epistemic norms.
  2.  **Medium Decisiveness:** **Causal Damping.** If physics/complexity theory shows that individual agency's causal footprint decays to negligible levels rapidly, the "long-run" is morally irrelevant, making the calculation tractable.
  3.  **Medium Decisiveness:** **Meta-Ethical Externalism.** If you are convinced that moral theories need not be action-guiding to be true, the "structural severance" ceases to be a fatal flaw and becomes a limitation of human cognition, not the theory.
  4.  **Low Decisiveness:** **Imprecise Probability.** This manages the problem but may confirm your suspicion that consequentialism cannot yield unique answers (indeterminacy).

  **Defenders' Reason to Worry:**
  Consequentialists should be worried if the **Symmetry Argument** fails. If unknown effects are *not* symmetric (e.g., if there is a systematic bias toward suffering or value loss in chaotic systems), then Expected Value is undefined, and standard decision theory breaks. This is the "Black Swan" risk for consequentialism. If Greaves' symmetry defense is refuted, your view moves from "strong critique" to "potentially fatal refutation."

  **Your Reason to Worry:**
  Your view risks being a **motte-and-bailey** regarding the definition of consequentialism. If you define consequentialism strictly as "Direct Maximization of Actual Outcomes," you are attacking a straw man that few sophisticated consequentialists hold. To maintain the force of your argument, you must engage with **Indirect** and **Sophisticated** Consequentialism not as betrayals, but as the theory's best attempt to solve the problem you identify. If those attempts fail *on their own terms* (not just because they aren't "pure" enough), your view stands. If they succeed in providing stable guidance, your claim that the theory is structurally severed is false.
