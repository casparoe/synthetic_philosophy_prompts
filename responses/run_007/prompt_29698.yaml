      *   *Crux 3: Transparency and Endorsement.* Does knowing about the nudge neutralize it?
          *   *Test:* Disclosed nudge effectiveness.
          *   *Prediction:* Defender says transparency maintains legitimacy. Critic says transparency doesn't stop the subconscious influence.

