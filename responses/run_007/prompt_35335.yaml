prompt: |-
  My philosophy of biology reading group has been stuck for weeks on the species problem. We've got a die-hard defender of the Biological Species Concept (Mayr-style: species are reproductively isolated interbreeding populations) and someone who thinks the Phylogenetic Species Concept is obviously correct (species are the smallest diagnosable monophyletic groups). They've been talking past each other and I'm tired of it. I want them to produce an adversarial-collaboration document. Please draft it: a section of claims both can sign onto (about what a species concept needs to do, about hard cases like ring species and asexuals, about what's at stake), then a disagreements table where each row is a specific point of contention phrased so each side would accept the wording of their own position, then the cruxes — the sub-questions where settling them would actually move someone — and for each crux, what evidence or argument both would agree bears on it, with each person's prediction recorded. Don't let them get away with a merely verbal dispute if that's what part of this is, but also don't force a reconciliation where theres a genuine theoretical difference.
