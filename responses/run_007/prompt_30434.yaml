answer: |-
  You have independently rediscovered one of the most significant problems in modern social choice theory and political philosophy.

  The specific name for this phenomenon is the **Discursive Dilemma** (often also called the **Doctrinal Paradox**).

  It was formally identified and named by the philosopher **Philip Pettit** and the logician **Christian List** in the early 2000s, though legal scholars had noticed the "Doctrinal Paradox" version in court decisions slightly earlier.

  Here is the breakdown of what you are seeing, how it relates to Condorcet, and what it implies about group rationality.

  ### 1. The Name and The Mechanism
  Your example is the textbook definition of the Discursive Dilemma. It arises when a group needs to make a collective judgment on a set of logically interconnected propositions.

  *   **Premise 1 ($P$):** Procedure was followed.
  *   **Premise 2 ($U$):** Decision was unfair.
  *   **Conclusion ($C$):** Complaint upheld.
  *   **Logic:** $C$ is true if and only if ($P$ AND $U$) are true.

  The dilemma occurs because there are two legitimate ways to aggregate the votes, and they yield contradictory results:
  1.  **Conclusion-Based Procedure:** Vote directly on the verdict ($C$). Result: **Reject** (2–1).
  2.  **Premise-Based Procedure:** Vote on the reasons ($P$ and $U$), then apply the logic. Result: **Uphold** (Majority says $P$ is true, $U$ is true, therefore $C$ must be true).

  The "paradox" is that if you insist on majority rule for *every* proposition individually, the group ends up holding a set of beliefs ($P$, $U$, and $\text{not-}C$) that is logically inconsistent. No individual member holds this inconsistent set; only the collective does.

  ### 2. Relation to Condorcet's Paradox
  You are correct that it is distinct from Condorcet's paradox, but they are close cousins under the umbrella of **Social Choice Theory**.

  *   **Condorcet's Paradox** deals with **preferences**. It shows that if individuals have transitive preferences (A > B > C), the group majority preference can be *intransitive* (A > B, B > C, but C > A). The group goes in a circle.
  *   **The Discursive Dilemma** deals with **judgments/beliefs**. It shows that if individuals have logically **consistent** beliefs, the group majority judgments can be *inconsistent*. The group contradicts itself.

  Both paradoxes demonstrate the same fundamental theorem: **Majority rule does not preserve rationality properties when aggregating individual inputs into a collective output.** Condorcet shows it fails to preserve transitivity; the Discursive Dilemma shows it fails to preserve logical consistency.

  ### 3. Is the Group "Irrational"?
  This is the core philosophical debate sparked by List and Pettit.

  If a group is to be treated as a **Group Agent** (e.g., "The Committee decided..."), we usually expect it to act rationally. Rationality requires consistency. If the Committee says "The procedure was followed" and "The decision was unfair" but "The complaint is rejected," they are speaking nonsense.

  However, the group is not "stupid." Every member is rational. The irrationality is **structural**. It emerges from the aggregation method, not the individuals.

  This leads to a hard choice for any committee (as you are experiencing):
  *   **Prioritize Consistency (Premise-Based):** You vote on the criteria, accept the logical outcome, and override the direct vote on the verdict. This makes the group look rational, but it might override the specific will of the majority regarding the final outcome (in your example, 2 people wanted to reject, but the complaint is upheld).
  *   **Prioritize Responsiveness (Conclusion-Based):** You vote on the verdict and ignore the inconsistency in the reasoning. This respects the majority's desire for the outcome, but the group's official "reasoning" becomes incoherent.

  ### 4. Standard Examples
  You mentioned recruitment and ethics boards; these are the most common real-world occurrences.
  *   **Legal Courts:** This is where it was first spotted. In a multi-judge panel, judges might agree on the legal rules and the facts, but disagree on how they combine to produce a liability. If the court publishes a majority opinion on the facts and a different majority on the verdict, the precedent set is logically broken.
  *   **Central Banks:** A committee might vote on "Is inflation high?" (Yes) and "Is unemployment high?" (Yes). Logic suggests a specific policy mix. But if they vote directly on "Raise Interest Rates?" the majority might say No. The bank then appears to believe inflation is high but refuses to act on it.
  *   **Legislatures:** A parliament might pass Amendment A and Amendment B, but vote down Bill C, even though Bill C is legally required if A and B are passed.

  ### 5. Is it just an artifact of voting separately?
  You asked: *"Whether this really shows something about groups or is just an artefact of voting on each question separately."*

  It is **not** just an artifact of the voting method; it is a mathematical limit on collective decision-making.

  List and Pettit proved an **Impossibility Theorem** (similar to Arrow's Impossibility Theorem for preferences). They showed that no aggregation function can satisfy all of the following desirable conditions simultaneously:
  1.  **Universal Domain:** It works for any set of individual judgments.
  2.  **Anonymity:** Everyone's vote counts equally.
  3.  **Systematicity:** The method for deciding $P$ is the same as for deciding $C$ (i.e., majority rule).
  4.  **Consistency:** The collective judgments are logically consistent.

  You must break one of these rules to solve the dilemma.
  *   If you want **Consistency**, you must abandon **Systematicity** (e.g., use a premise-based procedure where the verdict is derived, not voted on).
  *   If you want **Systematicity** (vote on everything), you must accept **Inconsistency**.
  *   If you want **Consistency** and **Systematicity**, you must abandon **Anonymity** (make one person the dictator; their logic becomes the group's logic).

  ### 6. The Edges of the Concept
  The dilemma only arises under specific conditions:
  1.  **Logical Connection:** The propositions must be logically linked (like $P \land U \rightarrow C$). If the questions are unrelated, majority rule works fine.
  2.  **Specific Distribution:** It requires a specific split in opinions (like your 2-1 / 2-1 / 1-2 split). If everyone agrees on the premises, the paradox vanishes.
  3.  **Complexity:** It becomes more likely as the number of interconnected propositions increases. In a complex ethics board with five criteria for approval, the chance of a majority supporting the criteria but rejecting the application (or vice versa) skyrockets.

  ### Summary for your Committees
  You are witnessing the **Discursive Dilemma**. It proves that a group of rational individuals can form an irrational collective mind if they use simple majority voting on interconnected issues.

  **Practical Advice:**
  To avoid looking inconsistent, your committee should explicitly choose an aggregation rule *before* voting.
  *   **Option A:** "We will vote on the criteria. If the criteria pass, the complaint is automatically upheld." (Premise-based, ensures consistency).
  *   **Option B:** "We will vote only on the final verdict. The reasons are explanatory only and not subject to binding votes." (Conclusion-based, ensures the verdict matches the majority will, but admits the reasoning might be messy).

  Most robust organizations secretly use **Option A** but pretend to use **Option B**, which is why you are seeing these contradictions in official records. Recognizing it allows you to formalize the process and stop the group from contradicting itself on paper.
