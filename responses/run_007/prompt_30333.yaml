      *   *Proposed Principle:* **The Principle of Normative Reliance and Risk Control.**
          *   An omission is a cause when the agent had *control* over the specific risk and there was a *normative expectation* (based on role, relationship, or prior action) that they would exercise that control.
          *   Key distinction: Causation in this context isn't just physics; it's *responsibility-attributing causation*.

      *   *Refining the Principle:* Let's call it the **Duty of Care and Risk Control Principle**.
          *   Condition 1: **Capability:** The agent could have prevented the harm.
          *   Condition 2: **Normative Anchor:** There is a specific reason *this* person was expected to act (Role, Relationship, Contract, or Creation of Risk).
