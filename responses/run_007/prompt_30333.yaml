answer: |-
  This is a classic problem in philosophy of law and ethics, often framed as the distinction between *factual causation* (but-for causes) and *proximate causation* (legal/moral responsibility). Your intuition is tracking a specific concept: you aren't asking about physics; you are asking about **imputation**. You want to know when we pin the outcome on the person who did nothing.

  Based on your verdicts, here is the principle that best captures your reasoning.

  ### The Principle of Specific Responsibility

  **An omission counts as a cause of harm if and only if the agent had a specific, recognized duty to protect the victim from that specific risk, grounded in one of three anchors:**
  1.  **Role or Contract:** (Lifeguard, Doctor, Mechanic, Drug Company).
  2.  **Relationship or Dependency:** (Parent, Guest in Home).
  3.  **Creation of Risk:** (Digging the hole, Manufacturing the pill).

  If none of these anchors exist, the omission is a *failure to rescue*, but not a *cause* of the harm.

  ### How the Principle Handles Your Cases

  This principle neatly organizes your gut verdicts.

  *   **On-duty Lifeguard:** Anchor #1 (Role). **Verdict: Caused.**
  *   **Tourist:** No anchor. **Verdict: Did not cause.**
  *   **Parent:** Anchor #2 (Relationship). **Verdict: Caused.**
  *   **Doctor/Mechanic:** Anchor #1 (Role/Contract). **Verdict: Caused.**
  *   **Drug Company:** Anchor #1 & #3 (Role/Risk Creation). **Verdict: Caused.**
  *   **Hole Digger:** Anchor #3 (Creation of Risk). Even without a pre-existing law, by digging the hole, you created the hazard, which instantly generates a duty to mitigate it. **Verdict: Caused.**
  *   **Friend (Plants):** Anchor #1 (Voluntary Contract/Promise). By accepting the task, they assumed the role. **Verdict: Caused.**
  *   **Neighbor (Plants):** No anchor. **Verdict: Did not cause.**

  ### The Hard Case: The Off-Duty Lifeguard

  This is where the principle demands a sacrifice. According to the Principle of Specific Responsibility, the off-duty lifeguard **did not cause the death.**

  This feels wrong to you because she had the *capability* and the *knowledge*. However, the principle argues that capability alone is insufficient for causation. If capability were enough, *everyone* on the beach who knew how to swim would be a cause of the death. To preserve the meaning of "cause," we must limit it to those assigned the specific responsibility for that safety.

  The principle forces you to accept that her inaction is *morally blameworthy* (perhaps), but it is not *causally responsible* in the same way the on-duty guard's inaction is. The on-duty guard breached a security expectation; the off-duty guard merely failed to provide a benefit.

  ### The New Cases

  Here is how the principle applies to the scenarios you haven't listed:

  **1. The Smoke Alarm:**
  You forget to replace the battery in your own home. A guest dies in a fire.
  *   **Analysis:** Anchor #2 (Relationship/Implicit Contract). When you invite someone into your home, there is a normative expectation of basic safety maintenance. You control the risk environment.
  *   **Verdict:** You **caused** the death (or at least the fatal injury).

  **2. The Stranger and the Shallow Pond:**
  A stranger sees a child drowning in a shallow pond (the famous Peter Singer example). They do nothing.
  *   **Analysis:** No Role, No Relationship, No Risk Creation (they didn't push the kid in).
  *   **Verdict:** They **did not cause** the death. They failed to prevent it.
  *   **Note:** This is the most controversial application. Many ethicists argue we *should* have a duty here. But under your current verdicts (specifically the Tourist case), consistency demands you say they didn't *cause* it.

  ### Where My Reasoning Is Likely to Fail

  I need to be honest about the weaknesses of this principle. There are two major points of failure.

  **1. The Conflation of Cause and Blame**
  The biggest weakness is that this principle conflates *metaphysical causation* with *moral/legal liability*. In a purely physical sense, the tourist's inaction is just as much a "but-for" cause as the lifeguard's. (If the tourist jumped in, the swimmer lives).
  By saying the tourist "didn't cause it," we are actually saying "we won't *blame* them legally." If you care about physical causation, this principle is false. It only works if you define "cause" as "responsible agent."

  **2. The "Easy Rescue" Threshold**
  The principle struggles when the cost of acting is near zero. In the Pond case, the stranger risks nothing (shallow water, clothes ruinable). My principle says "No Cause." But if the stranger is the *only* person on earth who can save the child, our intuition shifts. We start to feel that unique capability *creates* a duty. If you feel that unique capability creates a duty, my principle fails because it requires a pre-existing anchor.

  ### What Would Change My Mind

  I would abandon the Principle of Specific Responsibility if you could accept a case where **Unique Capability** creates causation without a pre-existing duty.

  **The Argument:** Imagine a world where a specific genetic trait allows only one person in a million to safely administer an antidote. A stranger is poisoned in front of you. You have the trait. You do nothing. They die.
  *   **Current Principle:** You did not cause the death (No duty/role).
  *   **Counter-Intuition:** In this specific scenario, your inaction feels indistinguishable from killing them. Your unique power creates a duty that a random tourist doesn't have.

  If you agree that **Unique Capability + Near-Zero Cost = Duty**, then the Off-Duty Lifeguard *did* cause the death (assuming she was the only one who could help), and the Tourist in the Pond *did* cause the death.

  **The Trade-off:**
  If you accept that argument, you gain moral consistency on "Easy Rescues," but you lose the ability to distinguish between the Lifeguard and the Tourist in standard cases. Everyone becomes a potential cause of every preventable tragedy they witness.

  **My Recommendation:**
  Stick with the **Principle of Specific Responsibility**. It aligns best with your current verdicts (Tourist vs. Lifeguard). It forces you to accept that the Off-Duty Lifeguard is not a *cause*, even if she is a *bad person*. This preserves the legal and social utility of the word "cause" as a tool for assigning specific accountability, rather than general moral failing.
