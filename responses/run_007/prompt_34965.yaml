          *   **Status:** Correct. (Monotonicity).
      *   *Claim 6:* "Third, it converges to 1 as n goes to infinity."
          *   **Status:** Correct. (Asymptotic consistency).
      *   *Claim 7:* "If p < 1/2, the majority's reliability converges to 0 as the group grows, and if p = 1/2, majority rule does no better than a fair coin."
          *   **Status:** Correct. (Standard corollaries).
