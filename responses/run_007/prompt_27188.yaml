      *   *The Core Problem:* The "division of labor" tries to offload normative weight to a procedure. But the procedure itself needs normative justification. If you rig the procedure to get the "right" answer, you've smuggled in direct normativity. If you don't, you might get the "wrong" answer or no answer.
