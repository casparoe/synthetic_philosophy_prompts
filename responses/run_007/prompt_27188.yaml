answer: |-
  ### Research Agenda: Foundations of Indirect Normativity

  The appeal of indirect normativity rests on a precarious division of labor: we outsource the hard work of value specification to a procedure of idealization, hoping to avoid the pitfalls of direct moral realism while retaining normative force. Our committee rejects the standard approach of surveying existing idealization models (e.g., CEV, Ideal Advisor, Reflective Equilibrium). Instead, we fund the structural prerequisites that determine whether *any* such model can coherently function. If the procedure itself smuggles in the values it claims to derive, the division of labor collapses.

  We recommend funding the following three questions, ranked by logical dependence and risk of project collapse.

  ---

  #### 1. The Non-Circularity of Procedural Specification
  **Question:** *Can the conditions of idealization (e.g., "more informed," "more rational," "calmer") be specified in a formal or natural language without presupposing the substantive normative outcomes the procedure is intended to discover?*

  **Priority Defense:** This is logically prior to all other questions. If the definition of "idealization" implicitly relies on a substantive theory of the good (e.g., defining "rational" as "that which maximizes well-being"), then indirect normativity is merely direct normativity in disguise. We cannot ask whether the output binds us (Q2) or what to do if outputs diverge (Q3) if the procedure is already rigged to produce a specific answer. This addresses the prompt's concern about "quietly presupposing a substantive value theory."

  **Tractability & Decisive Result (2 Years):**
  Solving meta-ethical circularity completely is likely impossible in two years. However, a decisive result here is not a solution, but a **Constraint Map**. The team should produce a formal taxonomy of the minimal normative commitments required to define *any* reflection procedure. A "success" is demonstrating exactly where the smuggling occurs (e.g., proving that "coherence" requires a prior value ordering).
  *   *Realistic Goal:* A proof that certain classes of idealization conditions are necessarily value-laden, narrowing the search space for "neutral" procedures.
  *   *Neglectedness:* Highly neglected in alignment contexts. Philosophers analyze "rationality" in isolation, but rarely analyze the normative load of "rationality" *when used as a value-extraction function*.

  #### 2. The Grounds of Authority for Unidealized Agents
  **Question:** *In virtue of what does the output of an idealized process bind the actual, unidealized agent whose psychology served as the input?*

  **Priority Defense:** This is downstream of Q1. Once we know what the procedure *is* (and what normative baggage it carries), we must ask why the result matters. This engages the prompt's question on whether deliverances "have authority over the unidealized agents." If the idealized self is too distant from the actual self (e.g., it values things the actual self finds abhorrent), the claim that it represents the actual self's "true" values breaks down. This is the "authority" fault line: is the authority *constitutive* (it's you, so it binds you) or *epistemic* (it knows better, so you should listen)?

  **Tractability & Decisive Result (2 Years):**
  This is more tractable than Q1 because it relies on existing literature on autonomy and paternalism.
  *   *Realistic Goal:* A typology of authority claims (e.g., Lockean consent vs. Platonic knowledge) mapped against specific idealization distances. A decisive result would be a "Breakage Point": a threshold of idealization beyond which the authority claim necessarily fails (e.g., "If the idealized agent rejects core actual preferences, authority is lost").
  *   *Neglectedness:* Crowded in political philosophy (paternalism), but neglected in the context of *algorithmic* or *global* indirect normativity where the "agent" might be humanity-as-a-whole.

  #### 3. The Treatment of Irreducible Idealized Disagreement
  **Question:** *Should the framework assume convergence of idealized deliberation, and if not, how is persistent disagreement among idealized inputs aggregated without reverting to direct normative weighting?*

  **Priority Defense:** This is the stress test. Q1 and Q2 assume a singleton output or a unified agent. Q3 handles the reality that idealized agents might disagree. If we assume convergence without argument (as many CEV-style proposals do), we risk building on a false premise. If we abandon convergence, we need an aggregation mechanism—but aggregation mechanisms (e.g., voting, weighting) introduce their own normative biases (returning to Q1 problems). This addresses the prompt's query on whether convergence should be "assumed, argued for, or abandoned."

  **Tractability & Decisive Result (2 Years):**
  High tractability relative to Q1. Social choice theory and moral pluralism literature provide tools.
  *   *Realistic Goal:* A formal demonstration of whether a "neutral" aggregation function exists for idealized preferences. A decisive result is showing that handling disagreement *requires* a direct normative commitment (e.g., prioritizing liberty over welfare in tie-breaks), which loops back to constrain Q1.
  *   *Neglectedness:* Often hand-waved. The field tends to hope for convergence rather than planning for divergence.

  ---

  ### Resolution of Conflicting Criteria

  In setting this agenda, we faced a tension between **Importance** and **Tractability**.
  *   **Conflict:** Q1 (Non-Circularity) is the most important but the least tractable. Q3 (Disagreement) is more tractable but less foundational.
  *   **Resolution:** We prioritize Importance/Dependence over Tractability for Q1. If Q1 yields a negative result (i.e., "All procedures smuggle values"), then Q2 and Q3 change from "how to build" to "how to manage the smuggling." Funding Q3 first would be building a roof before checking the foundation. However, to mitigate the risk of Q1 yielding nothing in two years, the grant for Q1 is conditional on producing the "Constraint Map" (negative knowledge is still knowledge). We accept the risk of intractability because the cost of proceeding with a circular definition is total project failure.

  We also weighed **Neglectedness**. Q2 is the most crowded (standard meta-ethics), but it is neglected *in this specific functional context*. Most meta-ethics asks "What is good?" not "When does an idealized version of me override my actual consent?" We fund Q2 not to solve meta-ethics, but to solve the *application* of meta-ethics to procedural authority.

  ### Reordering Condition

  The one development that would cause me to reorder this list is a **formal impossibility proof regarding Q1**.

  If, within the first year, the team working on Q1 demonstrates rigorously that *no* specification of idealization can be free of substantive normative presuppositions (a "No-Go Theorem" for indirect normativity), the agenda must immediately pivot.
  *   **Why:** This would render the search for a "neutral procedure" futile. The ranking would flip: **Q2 (Authority)** would become priority #1. If we *must* smuggle values into the procedure, the central question becomes "Which values are permissible to smuggle, and who authorizes them?" rather than "How do we avoid smuggling them?"
  *   **Consequence:** The research would shift from *foundational conceptual work* (trying to save the division of labor) to *political/ethical governance* (managing the inevitable direct normativity). Q3 (Disagreement) would rise in importance as the primary mechanism for managing the conflict between competing "smuggled" values.

  Until such a proof exists, however, we must test the foundation. We fund Q1 not because we expect it to succeed, but because we cannot proceed until we know exactly how it fails.
