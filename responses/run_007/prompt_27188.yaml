          *   *Question 2 (Authority):* The Bindingness Problem. Even if we define it, why obey it? This depends on Q1.
          *   *Question 3 (Feasibility):* The Convergence/Disagreement Problem. If they don't agree, the procedure yields no output. This depends on Q1 & Q2.

