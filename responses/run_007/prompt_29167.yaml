answer: |-
  ### Editor's Briefing: The Logical Space of Interpretation

  Before presenting the decision tree to your readers, it is useful to map the philosophical terrain that underpins it. The debate over authorial intention is not a single argument but a cluster of disagreements about where meaning "lives." To build this tree, I identified three binary questions that separate the major critical positions.

  **The Three Guiding Questions**
  1.  **The Authority Question:** Is the final authority on meaning the *Author* (their mind/will), the *Text* (the words on the page), or the *Reader* (their experience)?
  2.  **The Evidence Question:** If the Author is the authority, does *private* evidence (diaries, letters) count, or only *public* evidence (the published work, historical context)?
  3.  **The Success Question:** If the Author fails to execute their intention (the text is muddy or botched), does the meaning remain what they *wanted* (Intentionalism) or what they *actually wrote* (Formalism)?

  **Mapping the Combinations**
  *   **Author + Private Evidence:** *Actual Intentionalism.* (Occupied)
  *   **Author + Public Evidence Only:** *Hypothetical Intentionalism.* (Occupied)
  *   **Text + Authorial Will Irrelevant:** *New Criticism / Formalism.* (Occupied)
  *   **Reader + Text/Author Irrelevant:** *Reader-Response Theory.* (Occupied)
  *   **Reader + Author Authority:** *Unoccupied.* (Incoherent: If the author determines meaning, the reader cannot override it.)
  *   **Text + Private Evidence Counts:** *Unoccupied.* (Incoherent: If the text is autonomous, private diaries are external to the object.)

  **Indistinguishable Pairs**
  *   **New Criticism vs. Hypothetical Intentionalism:** In many practical cases, these two yield the same result (the published text rules). They differ only in *why*: New Critics believe the text is an aesthetic object detached from the author; Hypothetical Intentionalists believe the text is the best public evidence of what an author *could* have meant. The tree flags this overlap at the end.

  ***

  ### The Reader's Decision Tree: Where Does Meaning Live?

  *Instructions: Start at the top. Read the scenario, make the choice that matches your intuition, and follow the arrow. At the bottom, you will find the name of the critical position you inhabit—and the awkward consequence that comes with it.*

  #### **START HERE: The Interview**
  You read a novel that ends ambiguously. Most readers, including you, interpret the ending as tragic. Two years later, the author gives an interview and says, "I intended the ending to be hopeful; the tragedy was a mistake in my writing."
  **Does the author's statement change the meaning of the book?**

  *   **YES, the author's word settles it.** → Go to **Node A**.
  *   **NO, the text stands on its own.** → Go to **Node B**.

  ---

  #### **NODE A: The Private Diary**
  *(You believe the author's intention matters.)*
  After the author dies, a private diary is discovered. In it, the author confesses that for a key chapter, they intended a symbol to mean "Redemption," but the text clearly suggests "Guilt" to every reader. The diary was never meant for publication.
  **Does this private confession override what the public text says?**

  *   **YES, the diary reveals the true meaning.**
      *   **POSITION:** **Actual Intentionalism**
      *   **THE AWKWARD COMMITMENT:** "The meaning of a book can change if the author changes their mind, lies, or is simply mistaken about what they wrote."
  *   **NO, we can only judge what the author made public.**
      *   **POSITION:** **Hypothetical Intentionalism**
      *   **THE AWKWARD COMMITMENT:** "We are not interpreting the real human being, but a fictionalized 'Author' constructed from public clues and stereotypes."
      *   *(Note: In practice, this position often looks identical to New Criticism, but for different reasons.)*

  ---

  #### **NODE B: The Editor's Pen**
  *(You believe the text matters more than the author's mind.)*
  A scholar discovers that a famous line in a poem was inserted by an editor without the author's knowledge. The author hated the line, but it has become the most quoted part of the work.
  **Is that line part of the poem's meaning?**

  *   **YES, the published text is the only thing that exists.** → Go to **Node C**.
  *   **NO, that line is a corruption of the author's work.**
      *   **POSITION:** **Moderate Intentionalism** (A hybrid view)
      *   **THE AWKWARD COMMITMENT:** "We must respect the author's will, but only when they successfully manage to enforce it against the world."

  ---

  #### **NODE C: The Disavowed Reading**
  *(You believe the text is autonomous.)*
  A group of modern readers finds a profound political meaning in a classic text. The text supports the reading, but the author explicitly disavowed this politics during their lifetime.
  **Is this political meaning valid?**

  *   **YES, the text supports it, so it is valid.**
      *   **POSITION:** **New Criticism / Formalism**
      *   **THE AWKWARD COMMITMENT:** "The poem is a verbal icon that exists independently of the human who wrote it; the author is a ghost."
  *   **NO, meaning comes from how the text makes *me* feel, regardless of the text's support.**
      *   **POSITION:** **Reader-Response Theory**
      *   **THE AWKWARD COMMITMENT:** "There is no such thing as a misreading, only a reading you didn't have."
      *   *(Note: If you believe the author is irrelevant because culture speaks through them, you are closer to 'The Death of the Author,' which shares this commitment.)*

  ---

  ### Summary of Positions

  | Position | Meaning Lives In... | The Price You Pay |
  | :--- | :--- | :--- |
  | **Actual Intentionalism** | The Author's Mind | You must accept the author's lies or errors as truth. |
  | **Hypothetical Intentionalism** | The Public "Author" | You are analyzing a construct, not a person. |
  | **New Criticism** | The Text Itself | The book is an orphan; its parentage doesn't matter. |
  | **Reader-Response** | The Reader's Experience | Objective error is impossible; all reactions are equal. |
