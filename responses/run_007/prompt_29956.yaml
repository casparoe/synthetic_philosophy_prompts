answer: |-
  The 1973 decision by the American Psychiatric Association (APA) to declassify homosexuality as a mental disorder stands as a pivotal moment in the philosophy of medicine. It provides a rigorous testing ground for the competing metaphysical accounts of disease: Naturalism, exemplified by Christopher Boorse's Biostatistical Theory (BST), and Normativism. By analysing this episode through both lenses, we can assess their explanatory power regarding how medical categories are formed, revised, and justified.

  **1. The Naturalist Perspective: Function and Fact**

  For the thoroughgoing Naturalist, specifically a Boorsean, health is a value-free state of statistically normal species functioning, and disease is a subnormal part-function that reduces survival or reproduction. On this view, whether homosexuality was a disease in 1972 depends entirely on biological facts, not social opinion.

  *Was it a disease before 1973?* According to BST, a condition is a disease only if the underlying physiological mechanisms fail to perform their natural function. If one defines the function of sexual desire strictly as procreation, homosexuality might appear to impair reproductive success. However, Boorse distinguishes between statistical rarity and dysfunction. Homosexuality has been statistically present across history and cultures; it is not a rare anomaly in the population. Furthermore, the physiological mechanisms of sexual arousal and response in homosexual individuals function normally relative to their design; the 'target' of the desire does not necessarily imply a mechanical failure of the reproductive organs themselves. Therefore, a consistent Naturalist should arguably have concluded that homosexuality was *never* a disease, even in 1972, provided they adhered strictly to the data regarding physiological function.

  *Did the APA have scientific grounds for the change?* Here, the Naturalist faces a significant hurdle. If the biological facts regarding homosexuality (its prevalence, its physiological mechanisms) did not fundamentally change between 1972 and 1974, then the reclassification cannot be described as a scientific correction in the strict sense. The APA did not release new longitudinal studies proving homosexual individuals had higher survival rates or normal reproductive functioning than previously thought. The decision was ratified by a vote of the membership, precipitated by activist pressure and testimony regarding social adjustment, not by the presentation of a new biological discovery. For the Naturalist, this implies the 1973 decision was not a triumph of science over superstition, but rather a political intrusion into scientific classification. To maintain coherence, the Naturalist must argue that the pre-1973 classification was a scientific error based on bad data, and the 1973 vote was merely the administrative acceptance of existing but ignored facts.

  **2. The Normativist Perspective: Values and Harm**

  Normativism posits that disease judgements are ineliminably evaluative. A condition counts as a disease only relative to judgements about harm, dysfunction, or the kind of life a person should be able to lead.

  *What was happening in the reclassification?* For the Normativist, the 1973 episode is transparent. Homosexuality was classified as a disorder because it violated social norms and caused social harm (stigma, legal persecution, inability to lead a 'good life'). As social values shifted during the civil rights era, the 'harm' associated with the condition diminished. The reclassification was not a discovery of biological truth, but a revision of a value judgement. The APA effectively acknowledged that homosexuality, in itself, was no longer considered a 'bad thing' to have in the context of a flourishing life.

  *Does the retention of a distress-based category show values were still doing the work?* The creation of the diagnosis 'ego-dystonic homosexuality' (for those distressed by their orientation) is the strongest evidence for Normativism. If disease were purely biological, the distress would be a secondary symptom of the primary disorder (the orientation). By making the distress the primary criterion for diagnosis, the APA admitted that the orientation itself was benign. The 'disease' component was the suffering and the conflict with the individual's self-concept or social environment. This aligns perfectly with the Normativist claim that disease is constituted by harm. However, it also reveals that the 'harm' is contingent on social context; in a fully accepting society, even ego-dystonic homosexuality might vanish, suggesting the medical category is tracking social friction rather than pathology.

  **3. Explanatory Power and Strain**

  Each view explains certain features of the episode well but strains to accommodate others.

  *Naturalism* explains the *aspiration* of the APA. The APA insisted the decision was consistent with medical science, not a surrender to politics. They sought to maintain the demarcation between medicine and morality. Naturalism captures why the APA felt the need to justify the removal in technical terms rather than simply issuing a moral decree. However, Naturalism misdescribes the *mechanism* of change. It struggles to explain why a vote was necessary to settle a matter of fact. If homosexuality was biologically normal, it should have been removed the moment the data was available (much of which existed via Kinsey in the 1940s). The delay suggests the barrier was not epistemic (lack of knowledge) but normative (unwillingness to accept the implication of that knowledge).

  *Normativism* explains the *mechanism* of change beautifully. It accounts for the role of activism, the voting process, and the shift in social mores. It explains why the diagnosis persisted for so long despite contradictory data. However, Normativism strains to explain the *limits* of the change. If disease is purely a value judgement, why did the APA not simply remove all categories? Why retain 'ego-dystonic homosexuality' rather than declaring the matter entirely non-psychiatric? A pure Normativist might suggest this was merely a compromise to save face, but it suggests that psychiatrists still believed there was a 'medical' core to the distress that required professional management, implying a belief in some underlying dysfunction (psychological, if not sexual) that Normativism sometimes downplays. Furthermore, Normativism risks collapsing the distinction between medicine and politics; if the APA can vote a disease out of existence, can they not vote one in?

  **4. Implications for the Debate**

  The episode challenges Simple Naturalism severely. It demonstrates that in psychiatry, the identification of 'dysfunction' is not prior to value judgements but intertwined with them. The 'function' of sexuality is not a brute biological fact but a concept laden with assumptions about what sexuality is *for*. If one assumes it is for procreation, homosexuality is a dysfunction; if for bonding or pleasure, it is not. The 1973 decision shows that the choice of function is itself a normative act.

  However, the episode also reveals a demarcation problem for Normativism. By retaining the distress category, the APA acknowledged that while the *orientation* was not a disease, the *reaction* to it could be. This implies a boundary: medicine treats the distress (the harm), not the deviation (the norm violation). This suggests Normativism must incorporate some constraint to prevent medicine from becoming merely a tool for social comfort. If any deviation causing distress is a disease, then medicine becomes the management of all social maladjustment.

  **Verdict**

  The 1973 APA decision establishes that **Simple Naturalism is descriptively false regarding psychiatric nosology.** It refutes the Boorsean claim that disease classification can be a value-free scientific enterprise. The change in classification was not driven by new biological data but by a shift in the evaluative framework through which existing data was interpreted. The retention of the distress category confirms that 'harm' (a normative concept), not 'dysfunction' (a naturalist concept), was the operative criterion for pathology.

  The strongest objection to this verdict comes from a sophisticated Naturalist. They might argue that the 1973 decision *was* scientific because it corrected a theoretical error about human function. Prior to 1973, psychiatry operated under a false theory that sexual maturity necessitated heterosexual object choice. The 1973 decision represented the acceptance of a better biological/psychological theory of human sexuality, accelerated by activists. The vote was merely the administrative ratification of a scientific paradigm shift, akin to accepting germ theory.

  This objection fails because it conflates the *acceptance* of science with the *production* of science. The relevant data (Kinsey, cross-cultural studies) predated the decision by decades. The 'paradigm shift' was not in the understanding of physiological mechanisms, but in the moral permissibility of accepting those mechanisms as 'normal'. A biological fact does not require a vote to become true. The necessity of the vote indicates that the barrier was not scientific uncertainty, but normative resistance. Therefore, the Naturalist cannot claim the change was purely scientific without ignoring the historical record of why the data was previously rejected.

  My verdict rests on a contestable assumption about **what disease concepts are for.** I have assumed that the purpose of a disease concept is to track a stable reality that guides intervention, and that if the classification changes without a change in the underlying biological reality, the concept must be normative. A Naturalist might reject this, arguing that disease concepts are *theoretical posits* that evolve as our theories evolve, regardless of social pressure. However, given that the 'theory' of sexual function changed solely due to social pressure rather than empirical falsification, the assumption holds. The 1973 episode demonstrates that in psychiatry, the 'normal' is not discovered; it is negotiated. Consequently, any adequate philosophy of medicine must abandon the dream of a value-free Naturalism and accept that normative judgements are constitutive of disease, while seeking rigorous constraints to prevent those judgements from becoming merely instruments of political power.
