  7.  **Final Polish:**

      *   Check word count and flow.
      *   Ensure the "contestable assumption" is clearly flagged.
      *   Verify the strongest objection is addressed robustly.

  *(Self-Correction on the Verdict)*: I need to be careful not to just say "Normativism wins." I need to say what the case *establishes* about the positions. It establishes that Naturalism cannot account for the *change* without admitting external influence. It establishes that Normativism explains the change but struggles with the *limit* of medical authority. I will argue the case favours a Normativist understanding of the *process*, but reveals the danger of that view. Actually, the prompt asks what the case establishes about the *positions*. I will argue it establishes that Naturalism is descriptively false regarding psychiatric history, while Normativism is descriptively true but normatively risky. My definite position will be that the case refutes Simple Naturalism.

  Let's refine the "Definite Position."
  Position: The 1973 decision refutes the claim that disease classification is a value-free scientific discovery. It establishes that psychiatric nosology is ineliminably normative.
  Objection: The Naturalist claim that we simply discovered the truth about human function.
