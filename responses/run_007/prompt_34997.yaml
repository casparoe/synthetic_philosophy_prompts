      *   *Sentence 2 (Naming):* Accurate. IBE is the standard term (Harman, Lipton).
      *   *Sentence 3 (Criteria):* "Most fully, most simply, fewest assumptions." This is the standard layman's definition (loveliness). *Nuance:* Lipton distinguishes "likeliest" vs. "loveliest." Simplicity is contested (what kind of simplicity?).
      *   *Sentence 4 (IBE = Bayesianism):* **Major Red Flag.** This is the core contention.
          *   *Compatibilism:* Okasha, Lipton (later work), Salmon. They think IBE can be mapped onto priors/likelihoods.
          *   *Incompatibilism/Rivalry:* Van Fraassen (constructive empiricism), some Bayesians who think IBE adds nothing or violates conditionalization.
