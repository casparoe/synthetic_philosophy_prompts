answer: |-
  ### Exam Question

  **Question 4: The Philosophy of Adjustment (25 Points)**

  Simpson's Paradox occurs when a trend present in several different groups of data disappears or reverses when these groups are combined. While often taught as a statistical curiosity, it poses a fundamental challenge to empiricist accounts of scientific inference.

  In an essay of approximately 700–800 words, answer the following:

  1.  Explain why Simpson's Paradox cannot be resolved by statistical means alone. Why are both the aggregated and disaggregated associations mathematically "correct," yet potentially misleading for policy?
  2.  Critique the heuristic strategy of "conditioning on everything." Specifically, explain how conditioning on a **mediator** or a **collider** can distort causal inference, distinguishing these from confounders.
  3.  Conclude by discussing the philosophical implication of this paradox: In what sense does the decision to adjust (or not adjust) for a variable represent a "causal commitment" that cannot be derived from the data itself?

  *Note: Do not use the 1973 Berkeley admissions case as your primary example. Focus on the structural logic of the inference.*

  ***

  ### Model Answer

  Simpson's Paradox is frequently mischaracterized as a statistical error or a trick of arithmetic. In reality, it is a philosophical problem regarding the relationship between probability and causality. The paradox arises because association is not causation. Mathematically, both the aggregated and disaggregated statistics are correct calculations of conditional probabilities within the dataset. However, for the purpose of policy or intervention, only one usually represents the true causal effect. The data alone cannot dictate which calculation is the appropriate one because the data does not contain information about the direction of influence between variables.

  To resolve the paradox, one must move beyond the probability calculus into the realm of causal modeling. Consider a treatment $X$, an outcome $Y$, and a third variable $Z$. The paradox shows that $P(Y|do(X))$—the interventional probability—cannot always be equated with $P(Y|X)$, the observational probability. Whether we should look at the aggregated data (ignoring $Z$) or the disaggregated data (conditioning on $Z$) depends entirely on the causal role $Z$ plays. If $Z$ is a confounder (a common cause of $X$ and $Y$), the aggregated data is biased, and we must condition on $Z$ to block the backdoor path. However, if $Z$ is not a confounder, conditioning on it may introduce bias rather than remove it. This is why statistical means alone fail: the same joint probability distribution can be generated by multiple causal structures, some requiring adjustment and others forbidding it.

  This leads to the failure of the "condition on everything" heuristic. In observational studies, there is a temptation to control for every available covariate to ensure robustness. Causal inference demonstrates that this is often dangerous. If $Z$ is a **mediator** (a variable on the causal path from $X$ to $Y$), conditioning on $Z$ blocks the very mechanism by which $X$ affects $Y$. For example, if a drug ($X$) lowers blood pressure ($Z$) which in turn reduces heart attack risk ($Y$), controlling for blood pressure would make the drug appear ineffective. Here, the disaggregated numbers hide the total causal effect.

  More subtly, conditioning on a **collider** can induce spurious correlations where none exist. A collider is a variable caused by both $X$ and $Y$ (or their ancestors). Conditioning on a collider opens a non-causal path between $X$ and $Y$, creating "selection bias." For instance, if we only study hospitalized patients (a collider caused by disease and injury), we might find a negative correlation between disease and injury in the hospital data, even if they are independent in the general population. In the context of Simpson's Paradox, if the grouping variable $Z$ is a collider, disaggregating the data creates a bias that was not present in the aggregated data. Thus, "more control" is not synonymous with "less bias."

  The philosophical crux of Simpson's Paradox is that statistical decisions smuggle in causal commitments. When a researcher chooses to report the aggregated versus the disaggregated table, they are implicitly making a claim about the underlying data-generating process. To claim the disaggregated number is the "real" effect is to assert that $Z$ is a confounder. To claim the aggregated number is the "real" effect is to assert that $Z$ is a mediator or a collider. Since the data cannot distinguish between these roles, this assertion cannot be empirically justified by the numbers alone. It requires extra-statistical information, such as temporal ordering, theoretical mechanisms, or experimental design.

  Consequently, Simpson's Paradox refutes the notion that science can proceed by purely inductive accumulation of data. It demonstrates that data is theory-laden; specifically, it is causal-model-laden. We cannot determine what to do with the data until we have made assumptions that the data cannot verify. Therefore, causal inference is not a subset of statistics, but a distinct logic that combines statistics with structural assumptions. The paradox teaches us that there is no "view from nowhere" in data analysis; every adjustment set is a hypothesis about the world, and without a causal model to justify that hypothesis, policy decisions rest on arbitrary mathematical choices rather than scientific evidence.

  ***

  ### Marking Scheme (25 Points Total)

  **A Range (21–25 Points): Excellent**
  *   **Core Insight (5 pts):** Clearly articulates that both aggregated and disaggregated numbers are mathematically valid but causally distinct. Identifies that data lacks directional information.
  *   **Conditioning Nuance (8 pts):** Explicitly distinguishes between Confounders (adjust), Mediators (do not adjust/blocks path), and Colliders (do not adjust/opens path). Explains *why* "conditioning on everything" fails using these terms.
  *   **Philosophical Implication (5 pts):** Strong conclusion on "causal commitments." Argues that statistical choices imply untestable causal assumptions (anti-empiricist stance).
  *   **Constraints & Clarity (4 pts):** Avoids Berkeley example. Flows logically. Word count within range (700–800 +/- 10%).
  *   **Terminology (3 pts):** Correct use of terms (e.g., backdoor path, interventional probability, selection bias, DAG implications).

  **B Range (16–20 Points): Good**
  *   **Core Insight (4 pts):** Understands data alone doesn't solve the paradox, but explanation is slightly vague on *why* (e.g., says "we need theory" without explaining the underdetermination).
  *   **Conditioning Nuance (5 pts):** Identifies that conditioning can be bad. Mentions mediators or colliders but may conflate them or fail to explain the mechanism (opening vs. blocking paths) clearly.
  *   **Philosophical Implication (4 pts):** Notes that assumptions are needed but misses the stronger point about statistical decisions *being* causal commitments.
  *   **Constraints & Clarity (3 pts):** Follows instructions. Well-written.
  *   **Terminology (2 pts):** Generally correct but may lack precision (e.g., uses "bias" without specifying selection vs. confounding).

  **C Range (11–15 Points): Satisfactory/Basic**
  *   **Core Insight (3 pts):** Defines Simpson's Paradox correctly but treats it mostly as a statistical puzzle rather than a philosophical one.
  *   **Conditioning Nuance (2 pts):** Suggests we should "control for confounders" but fails to address the prompt's specific requirement about the dangers of conditioning on non-confounders (mediators/colliders). May still advocate for "controlling for more variables."
  *   **Philosophical Implication (3 pts):** Generic conclusion (e.g., "correlation isn't causation").
  *   **Constraints & Clarity (2 pts):** May rely on the Berkeley example despite instructions, or word count is significantly off.
  *   **Terminology (1 pt):** Basic usage, some imprecision.

  **D/F Range (0–10 Points): Poor**
  *   **Core Insight (0-2 pts):** Misunderstands the paradox (e.g., thinks one number is mathematically wrong).
  *   **Conditioning Nuance (0-2 pts):** Fails to address colliders/mediators.
  *   **Philosophical Implication (0-2 pts):** Missing or irrelevant.
  *   **Constraints & Clarity (0-2 pts):** Ignores prompt constraints, disorganized, or significantly too short/long.
  *   **Terminology (0-2 pts):** Incorrect usage of causal terms.

  **Specific Penalties:**
  *   **-5 points:** Use of Berkeley admissions case as the primary explanatory vehicle.
  *   **-3 points:** Word count deviates by more than 20% from the target.
  *   **-2 points:** Fails to explicitly mention "colliders" or "mediators" when discussing conditioning risks.
