answer: |-
  **TO:** Provost's Office
  **FROM:** AI Governance Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Guidelines on Anthropomorphic Language in Official AI Communications

  **Executive Summary**

  Recent internal friction regarding a press release describing a large language model (LLM) as "understanding" legal reasoning highlights a critical communication gap. While technical shorthand is common within computer science, public-facing claims of AI cognition carry reputational and legal risks, particularly for an institution engaged in AI liability research. We recommend the university adopt tiered guidelines that restrict intentional or psychological language in public communications while permitting technical shorthand in specialized contexts.

  **Background**

  Last month, Media Relations circulated a release characterizing a CS department project as an AI system that "forms beliefs about case facts." Law faculty objected, citing misleading anthropomorphism and potential institutional hypocrisy given our law school's work on AI accountability. CS faculty responded that terms like "understanding" and "belief" are standard functional descriptors within the field, not literal claims of sentience. The Provost has tasked this Working Group with resolving this tension.

  **The Case for Precision**

  The primary argument for restricting psychological language is stakeholder protection. Official university communications reach donors, policymakers, journalists, and the general public, most of whom lack technical literacy regarding transformer architectures. When a prestigious institution states an AI "understands" or "believes," it reinforces the "black box" mystique that suggests human-like agency.

  This creates two specific risks. First, it invites regulatory scrutiny. If we market a tool as capable of legal reasoning, users may rely on it for actual legal advice, exposing the university to liability if the tool hallucinates. Second, it undermines academic integrity. As a research institution, we must model epistemic humility. Overstating capabilities to secure grant funding or media attention erodes trust in our long-term findings. For a law school actively litigating or analyzing AI liability, using imprecise language in our own marketing creates a contradictory public record.

  **The Counter-Argument: Disciplinary Norms and Efficiency**

  The strongest argument against strict guidelines comes from the Computer Science and Media Relations perspective. In technical literature and industry practice, intentional language is efficient shorthand. When a researcher says a model "attends to" specific tokens or "infers" a pattern, they are describing mathematical weightings, not mental states. Banning this lexicon creates friction for faculty publishing in top-tier venues where this terminology is standard.

  Furthermore, overly rigid policing of language may signal that the university is technologically illiterate or resistant to innovation. If our press releases sound significantly more conservative than those of peer institutions or industry partners, we risk marginalizing our research impact. The CS faculty argue that context usually clarifies the metaphor; experts know the machine has no mind, and requiring constant disclaimers clutters communication without adding substantive value for the intended technical audience.

  **Recommendation**

  We acknowledge the validity of technical shorthand but conclude that the risks of public misinterpretation outweigh the convenience of colloquialism in official channels. We recommend adopting the following **Guidelines on AI Descriptors**:

  1.  **Public-Facing Materials (Press Releases, Websites, Brochures):** Avoid unqualified psychological or intentional verbs (e.g., "knows," "believes," "understands," "reasons"). Instead, use functional descriptions (e.g., "processes," "identifies patterns in," "generates predictions based on"). If intentional language is used for narrative flow, it must be immediately qualified (e.g., "simulates legal reasoning").
  2.  **Technical and Academic Contexts (Grant Proposals, Conference Papers):** Disciplinary shorthand is permitted where the audience is demonstrably expert. However, grant proposals submitted to non-technical government bodies should adhere to public-facing standards to avoid overselling capabilities to program officers.
  3.  **Review Process:** Media Relations should consult with the AI Governance Working Group or a designated faculty reviewer when a press release makes high-stakes claims regarding AI cognitive capabilities.

  **Implementation**

  These guidelines should not be viewed as censorship but as brand protection. We suggest a six-month pilot period where Media Relations and the Working Group collaborate on drafts. This allows us to refine the language without stifling output.

  **Conclusion**

  The university occupies a unique position as both an innovator in AI and a critic of its societal impact. Our communications must reflect that dual responsibility. By distinguishing between technical shorthand and public claims, we protect the institution from liability, maintain academic credibility, and ensure that our public narrative remains aligned with the technical reality of our research. We urge the Provost to approve these guidelines for immediate implementation.
