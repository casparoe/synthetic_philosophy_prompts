answer: |-
  ### 1. The Proposed Principle: The Entitlement and Essence Framework

  To systematize your verdicts while resolving the tensions you identified, I propose the **Entitlement and Essence Framework**. This framework divides the validity of consent into three distinct gates: Capacity, Voluntariness (Coercion), and Informational Integrity (Deception).

  **The Principle:**
  Sexual consent is **invalid** if and only if one of the following three conditions is met:

  1.  **Capacity Deficit:** The agent lacks the cognitive ability to understand the nature of the act or the ability to communicate refusal (e.g., blackout drunkenness).
  2.  **Entitlement Violation (Coercion):** Agreement is secured by a threat to worsen the agent's position relative to their **moral baseline of entitlements**. (An offer that improves their position, even if exploitative, does not invalidate consent).
  3.  **Essential Condition Deception:** Agreement is secured by deception regarding the **physical nature, immediate safety, or agreed boundaries** of the sexual act itself. (Deception regarding collateral social attributes or future consequences does not invalidate consent).

  **How this resolves your tensions:**
  *   **Case 2 (Boss) vs. Case 7 (Tuition):** This relies on the **Entitlement Violation** clause. You are entitled to your job without sexual favors; threatening it violates your baseline. You are *not* entitled to free tuition; offering it expands your options, even if you are vulnerable. The distinction holds because the baseline is defined by *rights*, not *needs*.
  *   **Case 1 (STI) & 8 (Stealthing) vs. Case 5 (Job):** This relies on the **Essential Condition** clause. STIs and condoms concern the immediate physical risk and boundaries of the act. A job title is a social attribute external to the physical interaction.
  *   **Case 6 (Guilt Trip):** Emotional pressure does not threaten a moral entitlement (you are not *entitled* to a partner's unconditional validation), so it fails the Coercion test.

  ---

  ### 2. Which Verdict Gets Overturned?

  To make this principle coherent, **Case 4 (The Undisclosed Marriage) must be overturned.**

  Under the **Essential Condition Deception** clause, consent is only invalidated by lies about the *act itself* (physicality, safety, boundaries) or *capacity*. Marital status is a social/relational attribute, similar to a job title. While it is morally reprehensible and likely a "deal-breaker" for Riley (just as being a paralegal might be for Morgan), it does not change the physical nature of the sex or the immediate risks involved in the way an STI or a removed condom does.

  **Why Case 4 feels different than Case 5:**
  You feel Case 4 is worse because it implicates Riley in a moral wrong (adultery) without their knowledge, whereas Case 5 is merely status inflation. However, from the perspective of *sexual autonomy*, both are deceptions about "who this person is in the world" rather than "what is happening to my body right now." To maintain consistency with Case 5 (which you firmly hold as valid), Case 4 must also be classified as **Valid Consent** (though morally fraudulent). If you hold Case 4 as Invalid, you must logically concede that Case 5 is also Invalid, as both are deceptions in the *inducement* rather than the *factum* (the act itself).

  ---

  ### 3. Application to the Stuck Case (Case 4)

  **Applying the Principle:**
  *   **Test:** Does undisclosed marriage alter the *physical nature* or *immediate safety* of the act?
  *   **Analysis:** No. The biological and physical interaction is identical to that of a single person. Does it violate a moral entitlement? No, Riley is not entitled to Sam's singleness in a casual hookup context unless explicitly contracted.
  *   **Verdict:** **Consent Valid.**
  *   **Reasoning:** While Sam has violated a duty of honesty and potentially exposed Riley to emotional harm or social complication, Riley's autonomy to decide what happens to their body was not compromised in the relevant sense. Riley knew they were having sex with Sam; they merely misunderstood Sam's external commitments. This aligns with the verdict on the Résumé Puff (Case 5).

  ---

  ### 4. Stress-Test Case: The Reproductive Sabotage

  **The Case:**
  Taylor and Casey agree to have sex using a condom, explicitly discussing that neither wants children. Taylor is secretly trying to get pregnant to "secure the relationship." During the act, Taylor pokes microscopic holes in the condom (similar to stealthing, but with the intent of pregnancy rather than sensation). Casey discovers this afterward.

  **Applying the Principle:**
  *   **Capacity:** Intact.
  *   **Coercion:** None (no threat).
  *   **Deception:** This is the crux. Is reproductive risk an **Essential Condition**?
      *   Unlike the Job (Case 5) or Marriage (Case 4), pregnancy is a direct *biological consequence* of the physical act, similar to an STI (Case 1).
      *   Unlike the STI case, pregnancy is not a "harm" in the same pathological sense, but it is a fundamental alteration of the *physical risk profile* agreed upon.
      *   Crucially, this involves **violating an agreed boundary** (the condom), identical to Stealthing (Case 8).
  *   **Verdict:** **Consent Invalid.**
  *   **Why this stresses the principle:** This case sits on the border of "Physical Nature" vs. "Future Consequence." If we say consent is only about the *moment* of sex, pregnancy is a future consequence (like the social fallout of marriage). If we say consent covers the *biological risks inherent to the act*, pregnancy is essential.
  *   **Resolution:** The principle classifies this as **Invalid** because it violates the *agreed physical boundary* (the condom) and alters the *immediate biological risk* of the act. It treats reproductive capacity as part of the "physical nature" of sex, distinct from social attributes like marriage or employment.

  ---

  ### 5. What Would Change My Mind?

  I hold this principle tentatively. Two arguments could lead me to abandon or significantly revise it:

  **1. The "Baseline Injustice" Argument (Threatening Case 7)**
  My distinction between the Boss (Case 2) and the Tuition Offer (Case 7) relies on a "moral baseline." I assume the student is *entitled* to their job but *not entitled* to tuition.
  *   **Counter-argument:** If the student's desperation is caused by systemic injustice (e.g., prohibitive tuition costs that effectively block education without debt), is the "offer" truly voluntary? If the baseline itself is morally corrupted, the Offer/Threat distinction collapses. If I were convinced that **economic necessity functions as coercion** regardless of entitlements (a "substantive" view of consent rather than a "procedural" one), I would have to rule Case 7 as **Invalid**. This would require shifting from an *Entitlement* framework to a *Vulnerability* framework.

  **2. The "Relational Essence" Argument (Threatening Case 4 & 5)**
  My principle assumes sex is primarily a physical act with social context attached (a "modular" view).
  *   **Counter-argument:** If sex is inherently a *communicative* or *relational* act, then the identity of the partner is part of the "Essential Condition." Just as you cannot consent to surgery by Dr. X if Dr. Y performs it (even if the cut is identical), you cannot consent to sex with a "single person" if a "married person" performs it.
  *   **Shift:** If I accepted that **relational status is constitutive of the act itself**, I would have to rule Case 4 (Marriage) as **Invalid**. However, to remain consistent, this would likely force me to rule Case 5 (Job) as **Invalid** as well, since professional status is also part of social identity. This would expand the scope of invalidating deception significantly, moving toward a "Full Disclosure" norm which risks making valid consent nearly impossible.

  **Where My Reasoning is Most Likely to Fail:**
  The weakest point is the definition of **"Essential Condition."** I have drawn the line at *physical risk/boundaries* vs. *social attributes*. But human sexuality is rarely purely physical. The line between "physical risk" (STI/Pregnancy) and "social risk" (Marriage/Reputation) is blurrier than the principle admits. If future analysis shows that people consistently treat relational exclusivity as a *physical safety requirement* (e.g., for emotional security that impacts mental health), the "Essential Condition" clause may need to expand, swallowing Case 4 and potentially Case 5.
