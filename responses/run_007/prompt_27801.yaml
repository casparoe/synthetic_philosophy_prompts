  Hofstadter isn't simply proposing a definition; he's advocating for a shift in valuation. He argues that the "phenomenal subject" is a user-illusion generated by the pattern. Therefore, preserving the pattern *is* preserving the only thing that ever existed. For him, this is substantive because it changes how we face death and morality; if we are patterns, we are already partially immortal and deeply interconnected. The critics argue that without a unified locus of experience, there is no one to *receive* the value, so the pattern is merely a puppet. For them, the substantive claim is that value requires a valuer.

  This explains why empirical data won't settle it. Neuroscience can map the spouse's model perfectly, confirming it behaves like you. But it cannot measure whether that model *is* you, because "is you" is not a physical property; it's a criterion of identity we impose on physics. Similarly, it's not purely verbal because both sides are fighting for the right to anchor the word "self" to the thing that grants moral status and existential comfort. If Hofstadter wins, death is less final (patterns survive). If critics win, death is absolute (phenomenology ends). They are competing for the same emotional real estate.

