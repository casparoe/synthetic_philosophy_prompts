answer: |-
  This is a classic move in tech debates, and you're right to feel like it's doing too much heavy lifting. The slogan "Guns don't kill people, people kill people" is a rhetorical shield. It sounds like common sense, but it relies on a very specific (and often outdated) view of how technology works.

  As a philosopher of technology, I can tell you that this slogan collapses several different arguments into one catchy phrase. To beat it, you need to separate them.

  Here is the "Menu of Claims" hidden inside that slogan. I have categorized them by how true they are and whether they actually help your opponents.

  ### The Menu of Claims

  **1. The Agency Claim**
  *   **The Claim:** "Inanimate objects cannot have moral intent, so they cannot be blamed."
  *   **Status:** **Trivial/True.**
  *   **Analysis:** Obviously, an algorithm doesn't have a soul or a conscience. It can't be "evil."
  *   **Does it help the opponent?** **No.** You aren't trying to put the *algorithm* on trial; you are trying to hold the *company* (the humans who built it) responsible. This claim attacks a straw man.

  **2. The Neutrality Claim**
  *   **The Claim:** "Technology is merely a passive tool, like a hammer. It is equally capable of good or bad, and the outcome depends entirely on the user."
  *   **Status:** **False (in this context).**
  *   **Analysis:** A hammer is neutral; it doesn't care if you build a house or break a window. But recommendation algorithms are *not* neutral. They are actively optimized to maximize specific outcomes (engagement, time on site). They are designed to nudge behavior in a specific direction.
  *   **Does it help the opponent?** **Yes, this is their main engine.** If the app is neutral, the company isn't liable. If you prove the app is *not* neutral, their argument collapses.

  **3. The Causation Claim**
  *   **The Claim:** "The tool does not cause the harm; the user's choice causes the harm. The tool is just the setting where it happens."
  *   **Status:** **Debatable/Weak.**
  *   **Analysis:** This ignores "causal contribution." If I design a car with brakes that fail at 60mph, and you crash, did your driving cause it? Or did my design? In philosophy, we call this "mediation." Technology changes how we perceive the world and what choices seem available to us.
  *   **Does it help the opponent?** **Yes.** They need to sever the link between design and outcome.

  **4. The Autonomy Claim**
  *   **The Claim:** "Users have total free will. No external influence can override a person's ability to choose rationally."
  *   **Status:** **False.**
  *   **Analysis:** This ignores psychology. If a slot machine is designed to exploit dopamine loops, and an algorithm is designed to exploit outrage, human autonomy is compromised. We are not perfectly rational robots; we are susceptible to environmental design.
  *   **Does it help the opponent?** **Yes.** They need to assume users are immune to manipulation.

  **5. The Foreseeability Claim**
  *   **The Claim:** "Designers cannot predict how people will use their tools, so they can't be blamed for unintended consequences."
  *   **Status:** **False.**
  *   **Analysis:** Social media companies have terabytes of data. They know exactly how their algorithms affect behavior. They run A/B tests to see what makes people stay longer. The "extremism" outcome isn't a bug; it's a known side-effect of engagement optimization.
  *   **Does it help the opponent?** **Yes.** If they can convince the judge the harm was unforeseeable, liability disappears.

  ***

  ### Which readings support your opponents?

  To win their side, your opponents *need* you to accept **Claim 2 (Neutrality)** and **Claim 4 (Autonomy)**.

  *   They need the app to be a **passive pipe** (like a telephone wire) rather than an **active editor** (like a newspaper).
  *   They need the user to be **immune to persuasion** rather than **psychologically influenceable**.

  If you accept Claim 1 (Agency), you don't lose. You just clarify that you are blaming the *engineers and executives*, not the code.

  ***

  ### How to Push Back (Debate Strategies)

  Here are three specific ways to dismantle this in your next speech.

  #### 1. Attack the "Passive Tool" Analogy (Refuting Claim 2)
  Your opponents are comparing social media to a gun or a hammer. You need to change the analogy.
  *   **Argument:** "A gun is a passive tool. It sits in a drawer until a human picks it up. But a recommendation algorithm is more like a **casino dealer** or a **salesperson**. It is actively working 24/7 to keep you engaged. It learns your weaknesses and shows you content specifically designed to trigger an emotional response. If a casino rigs the slot machines to be addictive, we don't say 'Gambling doesn't addict people, people addict themselves.' We hold the casino responsible for the design of the game."
  *   **Key Phrase:** "Algorithms are not neutral pipes; they are active editors."

  #### 2. Attack the "Total Autonomy" Assumption (Refuting Claim 4)
  Your opponents assume users are perfectly rational. Use basic psychology against them.
  *   **Argument:** "The 'people kill people' argument assumes humans are perfectly rational robots who are immune to their environment. But we know that's false. If I put poison in your food, I can't say 'You chose to eat it, so it's your fault.' Similarly, if an algorithm is designed to exploit human psychology to push extreme content, the user's 'choice' is manipulated. Responsibility lies with the manipulator, not just the manipulated."
  *   **Key Phrase:** "Freedom of choice doesn't mean freedom from manipulation."

  #### 3. The "Negligent Design" Argument (Refuting Claim 5)
  Even if you accept that tools don't have agency, humans who design dangerous tools do.
  *   **Argument:** "We hold car manufacturers responsible when they design brakes that fail. We don't say 'Cars don't crash, drivers crash.' We say the manufacturer has a duty of care to make the product safe. Social media companies have internal research showing their algorithms radicalize users, yet they keep the algorithm running to maximize profit. That isn't just a tool; that is negligent design."
  *   **Key Phrase:** "You are responsible for the foreseeable consequences of the products you sell."

  ### Summary for your Flow Sheet
  *   **If they say:** "Apps are just tools."
  *   **You say:** "Tools are passive; algorithms are active optimizers designed to exploit psychology."
  *   **If they say:** "Users choose to click."
  *   **You say:** "Choices made in a manipulated environment aren't fully free. Designers create the environment."
  *   **If they say:** "You can't blame the code."
  *   **You say:** "We aren't blaming the code; we are blaming the humans who wrote the code knowing it would cause harm."

  This approach moves the debate away from "Do objects have souls?" (which they win) to "Do designers have a duty of care?" (which you can win). Good luck.
