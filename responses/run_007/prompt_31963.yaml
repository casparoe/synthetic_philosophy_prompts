      *   MLS: Predicts trait spreads if colony extinction rates are high.
      *   GLS: Predicts trait spreads *only if* the gene is shared (kin).
      *   *Critique:* This is the standard sterile worker case. The user wants something novel.

      *Let's try a "Genomic Parasite masquerading as Group Adaptation" case.*
      This creates a divergence in *explanation* primarily, but can lead to different predictions about stability.
      Scenario: A "Medea" element (Maternal-Effect Dominant Embryonic Arrest). Mothers with the gene kill offspring that don't inherit it.
      *   GLS: Loves it. Spreads even if harmful to population.
      *   ILS: Hates it. Reduces individual reproductive output.
      *   MLS: Hates it. Increases group extinction risk.
      *   *Divergence:* GLS says it fixes. ILS/MLS say it shouldn't (or should be suppressed).
      *   *Problem:* This is a known case (Medea elements). User wants a constructed thought experiment, not just citing Medea. I can adapt this.

      *Let's refine the "Toxic Public Good" idea to separate the levels.*
      Organism: A social amoeba (like *Dictyostelium* but sexual/asexual mix).
      Environment: Patches of food that are toxic unless processed.
      Trait: "Processor" allele ($P$).
      Mechanism: $P$ secretes an enzyme.
