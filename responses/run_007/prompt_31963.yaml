      *Wait, I need the three frameworks to disagree.*
      1.  **ILS:** Focuses on the beetle. If the bacteria help the beetle survive *within* the log, the beetle spreads. ILS predicts the trait (having the bacteria) increases in the beetle population *until* the log explodes. It might underestimate the extinction risk because it focuses on relative fitness within the surviving population.
