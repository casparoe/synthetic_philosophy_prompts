  3. The primary cruxes are whether coordinate-dependent simultaneity relations must map onto ontological reality and whether positing an empirically undetectable privileged foliation violates methodological norms of scientific realism.
  4. Both sides accept the Andromeda paradox as a test case for whether distinct simultaneity hyperplanes imply distinct realities, and both agree that a future detection of Lorentz violation would decisively favor Camp B.
  5. Camp A predicts that no future physics will reveal a privileged foliation and that ontology must respect Lorentz symmetry, whereas Camp B predicts that either such a foliation may yet be discovered or that metaphysical truth is not constrained by empirical indistinguishability.
