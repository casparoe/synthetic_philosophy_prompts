prompt: |-
  I'm a novelist, mid-career, and I'm deep in revisions on a political novel set in a near-future where a government agency launders its worst decisions through deliberately soft, bureaucratic language. The problem is I keep worry that my own prose is doing the same thing on the page. I've been rereading Orwells "Politics and the English Language," and the thing that sticks with me is his claim that sloppy, inflated, euphemistic language isn't just an aesthetic failing — its how people and institutions make terrible things sound neutral or even respectable without noticing their doing it. I don't want my narrator to be complicit in the exact thing the book is supposed to be exposing.

  So here's what I'd like: a revision procedure I can actually run on my manuscript, page by page, maybe fifteen minutes per scene. I'm not a philosopher and I don't have time to stop and theorize mid-draft. I want a checklist or a sequence of tests, grounded in Orwell's views about language and political thought, that helps me catch the places where a sentence is drifting into euphemism, dead metaphor, passive constructions that hide who did what, or abstraction that lets the reader (and me) off the hook. It should say what counts as a fail at each step, where the procedure stops with a no, and where it has to hand the decision back to me because it's a matter of voice or art rather than evasion. Then run it on three short passages of the kind I actually write: (1) a sentence about a police killing that I'm tempted to render as "an incident occurred"; (2) a bit of political speech in dialogue that uses words like "pacification" and "collateral damage"; and (3) a paragraph of plain, concrete, honest prose that the procedure might flag anyway — I want to see it give me an answer I won't like. And be honest about what the procedure can't catch: Orwell's rules were written for essays and journalism, and a novel has characters who should talk badly, narrators who should sometimes be unreliable, and prose that's allowed to be strange. Tell me where the procedure will misfire and what I'll still have to decide as a writer.
reasoning: |-
  Here's a thinking process that leads to the suggested revision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Mid-career novelist writing a political novel (near-future, bureaucratic euphemism theme).
      *   **Problem:** Worried their own prose is complicit in the euphemism they are critiquing.
      *   **Inspiration:** Orwell's "Politics and the English Language."
      *   **Goal:** A practical revision procedure (checklist/sequence of tests) runnable page-by-page (approx. 15 mins/scene).
      *   **Requirements:**
          *   Grounded in Orwell's principles.
          *   Clear pass/fail criteria.
          *   Distinguish between evasion (bad) and voice/art (good).
          *   Run the procedure on three specific examples:
              1.  Euphemistic police killing sentence ("an incident occurred").
              2.  Political dialogue ("pacification," "collateral damage").
              3.  Honest prose that might get flagged anyway (false positive).
          *   Honest limitation analysis (where the procedure fails regarding fiction vs. essay).

  2.  **Deconstruct Orwell's "Politics and the English Language":**
      *   *Key Rules:* Never use a metaphor/simile/cliché you are used to seeing in print; never use a long word where a short one will do; if possible cut a word out; never use the passive where you can use the active; never use a foreign phrase/scientific word/jargon if you can think of an everyday English equivalent; break any of these rules sooner than say anything outright barbarous.
      *   *Core Philosophy:* Language influences thought. Sloppy language makes sloppy/evil thought easier. Concrete > Abstract. Agent > Action.

  3.  **Develop the Revision Procedure (The "Orwellian Audit"):**
      *   *Constraint:* Needs to be fast (15 mins/scene). Needs to be actionable.
      *   *Structure:* A step-by-step filter.
      *   *Step 1: The Agent Check (Passive Voice).* Who did it? If unknown, is it *actually* unknown or hidden?
      *   *Step 2: The Abstraction Scan.* Nouns ending in -tion, -ment, -ity. Are they hiding bodies or money?
      *   *Step 3: The Jargon/Euphemism Hunt.* Specific words that sanitize violence or bureaucracy.
      *   *Step 4: The Cliché/Dead Metaphor Check.* Is this automatic writing?
      *   *Step 5: The "Barbarous" Exception.* Does breaking the rules serve the character or theme? (The safety valve).

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Make it visual:* Use bolding, clear "STOP" points.
      *   *Define "Fail":* A fail isn't always "delete." It's "flag for review."
      *   *Define "Hand-off":* When does the writer need to make an artistic choice?

  5.  **Running the Procedure on the Examples:**
      *   *Example 1 (Police Killing):* "An incident occurred involving a civilian casualty."
          *   *Analysis:* Passive, abstract ("incident," "casualty"), hides agent.
          *   *Verdict:* Fail. Needs rewriting to show the violence.
      *   *Example 2 (Political Speech):* "We are committed to the pacification of the zone to minimize collateral damage."
          *   *Analysis:* Jargon ("pacification"), euphemism ("collateral damage").
          *   *Verdict:* *Pass* for dialogue (character voice), *Fail* for narration. Crucial distinction.
      *   *Example 3 (Honest Prose):* "The rain fell on the city like a judgment."
          *   *Analysis:* Metaphor ("like a judgment"). Orwell says avoid ready-made metaphors.
          *   *Verdict:* Flagged, but acceptable as art. Shows the limitation.

  6.  **Addressing Limitations (The "False Positive" Problem):**
      *   Orwell wrote for *essays*. Fiction needs voice.
      *   Unreliable narrators *should* use euphemism sometimes (to show their corruption).
      *   Stylistic variation is okay.
      *   The procedure detects *patterns*, not just single sentences.

  7.  **Refining the Tone:**
      *   Respectful of the user's mid-career status (don't talk down).
      *   Practical, not academic.
      *   Aligned with the user's anxiety (validate the concern, offer a tool).

  8.  **Final Review against Constraints:**
      *   15 mins/scene? Yes, the checklist is short.
      *   Orwell grounded? Yes.
      *   Three examples run? Yes.
      *   Limitations discussed? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make it a software script idea?
      *   *Correction:* No, the user wants a mental/manual procedure they can run *now*. Keep it analog-friendly.
      *   *Initial thought:* Strict ban on passive voice.
      *   *Correction:* Orwell said "never use the passive where you can use the active." Sometimes passive is needed. The test should be "Does the passive hide the agent?"
      *   *Crucial Nuance:* The novel is *about* euphemism. If the narrator is part of the agency, they *should* speak bureaucratically until they break. I need to make sure the procedure distinguishes between *Narrative Voice* and *Character Voice*. I will add a "POV Check" at the start.

  10. **Final Polish:** Ensure the distinction between "Narrative Complicity" (bad) and "Character Realism" (good) is sharp. (This is the core tension of the user's prompt).

  *(Self-Correction on Example 3)*: The prompt asks for "plain, concrete, honest prose that the procedure might flag anyway." A metaphor like "rain fell like a judgment" is a bit cliché. Let's make it something more subtle. Maybe a sentence that uses a slightly Latinate word for rhythm, not evasion. "The silence persisted." vs "The silence lasted." "Persisted" might get flagged as pretentious, but it might be the right rhythm. Let's go with a sentence that uses a metaphor that is vivid but technically "dying." Or better: A sentence that is abstract but emotionally true. "Grief is a heavy thing." Orwell hates "Grief." He wants "She cried." But sometimes you need the abstraction. Let's use: "The weight of the decision settled on him." It's metaphorical and abstract, but honest.

  *(Refining the Procedure Steps)*:
  1. POV Check (Who is speaking?)
  2. The Agent Test (Who did it?)
  3. The Flesh Test (Can you picture it?)
  4. The Jargon Scan.
  5. The Artistic Override.

  Let's write it.cw
answer: |-
  This is a precise and dangerous problem. If your novel critiques bureaucratic obfuscation but your narration relies on it, the book becomes what it hates: a performance of virtue that fails to embody it.

  Orwell's essay is a diagnostic tool, not a style guide. For a novelist, strict adherence kills voice. But for *revision*, it is a metal detector. You don't live with the metal detector; you walk over the ground with it to find the mines.

  Here is a 15-minute revision procedure designed for your specific thematic anxiety. It is not about making your prose "simple"; it is about making it *accountable*.

  ### The Orwellian Audit (Page-by-Page Procedure)

  **Pre-Check: The POV Boundary (1 Minute)**
  Before reading the scene, define the narrative distance.
  *   **Close Third/First (Insider):** If the narrator is part of the system, they *will* use euphemisms. The audit here is not to delete them, but to ensure the *context* exposes them as lies.
  *   **Omniscient/Outside (Observer):** The narration must be clean. If the narrator uses the agency's language without irony, the audit fails.

  **Step 1: The Agent Test (Passive Voice Scan)**
  Scan for forms of *to be* + past participle (was done, were taken, is decided).
  *   **The Question:** Who performed this action?
  *   **The Fail:** The agent is omitted to avoid blame (e.g., "Mistakes were made" vs. "I made mistakes").
  *   **The Hand-off:** If the agent is genuinely unknown to the character, or if the passive creates a specific rhythmic emphasis that isn't about hiding blame, pass it.
  *   **Action:** If it fails, rewrite active. Force a noun or pronoun before the verb.

  **Step 2: The Abstraction Scan (The -TION / -MENT Hunt)**
  Highlight nouns ending in *-tion, -sion, -ment, -ity, -ance*. (e.g., *implementation, utilization, resistance, occurrence*).
  *   **The Question:** Does this noun hide a verb or a body?
  *   **The Fail:** "The implementation of the policy" (hides *who implemented* and *how*). "An occurrence" (hides *what happened*).
  *   **The Hand-off:** If the abstraction refers to a genuine concept the character is grappling with internally (e.g., "His loyalty wavered"), pass it.
  *   **Action:** Turn the noun back into a verb. "They implemented" $\rightarrow$ "They used." "An occurrence" $\rightarrow$ "It happened."

  **Step 3: The Flesh Test (Imagery Check)**
  Read the sentence. Can you take a photograph of it?
  *   **The Question:** Is this concrete or conceptual?
  *   **The Fail:** "The situation escalated." (You cannot photograph "escalation"). "Neutralizing the target." (You cannot photograph "neutralizing").
  *   **The Hand-off:** Internal monologue or thematic summary. Sometimes you must summarize to move time.
  *   **Action:** Replace the concept with the physical reality. "Escalated" $\rightarrow$ "They started shooting." "Neutralizing" $\rightarrow$ "Shooting him."

  **Step 4: The Dying Metaphor Check**
  Highlight idioms or clichés (*toe the line, stand shoulder to shoulder, play into hands*).
  *   **The Question:** Did I write this because I felt the thought, or because the phrase was ready-made?
  *   **The Fail:** You are using a phrase that has lost its visual power and now functions as a placeholder for thinking.
  *   **The Hand-off:** If the character is a cliché-thinker (part of the bureaucracy), keep it to show their intellectual laziness.
  *   **Action:** Delete or rewrite with fresh imagery.

  **Step 5: The Barbarous Override (The Safety Valve)**
  Orwell's final rule: "Break any of these rules sooner than say anything outright barbarous."
  *   **The Question:** Does fixing the prose make the sentence clumsy, awkward, or tonally wrong for *this* book?
  *   **The Decision:** If the "clean" version sounds robotic and the "dirty" version carries the emotional truth, keep the dirty version. Note it in the margin. Move on.

  ***

  ### Running the Audit on Your Passages

  Here is how the procedure handles the three specific scenarios you provided.

  #### Passage 1: The Police Killing
  > *Draft:* "During the operation, an incident occurred resulting in a civilian casualty."

  *   **Step 1 (Agent):** **FAIL.** "An incident occurred." Who acted? The police? The wind? The universe? The passive construction hides the shooter.
  *   **Step 2 (Abstraction):** **FAIL.** "Operation," "incident," "casualty." Three abstract nouns. "Casualty" sanitizes death; it sounds like a spreadsheet error, not a human ending.
  *   **Step 3 (Flesh):** **FAIL.** You cannot photograph "an incident."
  *   **Audit Verdict:** **Complicit.** This sentence is doing the exact work of the agency you are critiquing. It is laundering blood into ink.
  *   **Revision:** "Officer Miller shot the woman in the kitchen." (Active agent, concrete verb, specific noun).

  #### Passage 2: The Political Speech (Dialogue)
  > *Draft:* "We are committed to the pacification of the zone to minimize collateral damage."

  *   **Step 1 (Agent):** **PASS.** "We are committed." The agent is present ("We"), though vague.
  *   **Step 2 (Abstraction):** **FLAG.** "Pacification," "minimize," "collateral damage."
  *   **Step 3 (Flesh):** **FAIL.** "Pacification" hides bombing. "Collateral damage" hides dead children.
  *   **Audit Verdict:** **PASS (with caveat).** This is dialogue. The character *should* speak this way. The audit does not demand you sanitize the villain; it demands you *recognize* the sanitization.
  *   **Writer's Decision:** Do not rewrite this sentence to be more honest. Instead, ensure the *narrative reaction* to this speech exposes the lie. If a character hears this and nods without flinching, the *narration* has failed. If a character hears this and thinks, *He means we're going to bomb the school*, the system is working.

  #### Passage 3: The Honest Prose (False Positive)
  > *Draft:* "The silence in the room was heavy, like a held breath."

  *   **Step 1 (Agent):** **N/A.** Descriptive.
  *   **Step 2 (Abstraction):** **FLAG.** "Silence" is abstract, though sensory.
  *   **Step 4 (Metaphor):** **FLAG.** "Like a held breath." Orwell warns against similes. Is this a dying metaphor? It's common.
  *   **Audit Verdict:** **FLAGGED.** Strictly speaking, Orwell might call this "pretentious" or a "ready-made phrase."
  *   **Writer's Decision:** **OVERRIDE.** This is art, not evasion. The metaphor creates mood, it doesn't hide a crime. The procedure caught it because it is a metaphor, but it is not a *euphemism*. Do not change it. This is where you trust your ear over the checklist.

  ***

  ### Where the Procedure Will Misfire (Limitations)

  You asked for honesty about where this tool breaks. Orwell was writing about political *essays*, where the goal is maximum clarity of fact. You are writing a *novel*, where the goal is maximum resonance of experience.

  **1. The Unreliable Narrator Trap**
  If your protagonist is a true believer in the agency, their internal monologue *must* use euphemisms. If you scrub their thoughts clean using this audit, you destroy their psychology.
  *   *The Fix:* Use the audit on the *gap* between what they say and what happens. If they think "pacification" and the next paragraph describes burning homes, keep the word. It marks their corruption.

  **2. Rhythm and Cadence**
  Orwell prefers short, Anglo-Saxon words. But English prose needs Latinate rhythm to flow. "The utilization of the device" is bad. "The use of the device" is better. But sometimes "utilization" fits the iambic rhythm of the paragraph better.
  *   *The Fix:* If the "clean" word breaks the music of the sentence, use the "dirty" word. Mark it. Move on.

  **3. Atmosphere vs. Evasion**
  Sometimes vagueness is atmospheric, not evasive. "A gloom settled over the city." Who settled it? No one. It's pathetic fallacy. The Agent Test will flag this.
  *   *The Fix:* Distinguish between *moral* vagueness (hiding blame) and *poetic* vagueness (creating mood). The audit cannot tell the difference; only you can.

  **4. The "Barbarous" Clause**
  Orwell's final rule is the most important. Sometimes the precise, concrete description is too clinical. "He shot him in the head" is concrete. "He ended him" is euphemistic. But in a moment of high trauma, a character might dissociate. They *should* use euphemism to protect themselves.
  *   *The Fix:* If the euphemism reveals character psychology (trauma, denial) rather than institutional cover-up, it is valid.

  ### Summary for your Revision Sessions
  1.  **Print the manuscript.** Digital eyes skim; paper eyes catch.
  2.  **Use a yellow highlighter.** Mark every passive verb and abstract noun (-tion, -ment).
  3.  **Ask the "Who?" question.** If you can't answer it, rewrite.
  4.  **Ask the "Photo?" question.** If you can't picture it, rewrite.
  5.  **Stop at the Art.** If the sentence feels true but breaks the rules, write "ORWELL OVERRIDE" in the margin and keep it.

  This procedure will not write the book for you. It will only ensure that when you lie, you are doing it on purpose.
