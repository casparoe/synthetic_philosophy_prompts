      *   *No:* For metaphysical freedom. If the "flexibility" is determined, the hard incompatibilist wins. The analogy hides this by making rigidity look scary and flexibility look like "agency."
      *   *Verdict:* The analogy is rhetorically powerful but metaphysically thin. It shifts the goalposts from "Metaphysical Freedom" to "Practical Agency."

