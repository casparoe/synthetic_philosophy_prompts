      *   **Opponent's Argument:** A group member uses the *Sphex* wasp story to argue that free will isn't about determinism vs. indeterminism, but about "Sphexishness" (rigidity/fixed action patterns) vs. flexibility/revision. If you can notice changes and revise, you have free will (or enough of it). Determinism is a red herring.
      *   **User's Intuition:** Suspicious that the analogy is doing too much work and might be question-begging.
