answer: |-
  Here is a committed reconstruction of the epistemology underpinning scientific thought experiments, followed by a verdict on its coherence.

  ### The Implicit Epistemology: Empirically-Calibrated Rationalism

  The practice of scientific thought experiments presupposes a view of knowledge that I call **Empirically-Calibrated Rationalism**.

  This is not pure Rationalism (which claims we can know truths about the world through reason alone) nor is it strict Empiricism (which claims all knowledge derives directly from sense data). Instead, it treats the human mind as a **simulation engine** that has been calibrated by prior evolutionary and individual experience.

  Here is the breakdown of this epistemological stance:

  **1. Knowledge is Structural, Not Just Data-Driven**
  This view holds that we do not just store raw data points (e.g., "this ball fell at 9.8 m/s²"). We internalize *structural relationships* and *causal regularities* (e.g., "heavier objects do not inherently fall faster," "energy is conserved"). Thought experiments allow scientists to manipulate these internalized structures to see if they hold together under stress. The "knowledge" gained is not new data about the world, but new knowledge about the **consistency and implications of our existing models** of the world.

  **2. The "Armchair" is Furnished**
  The reason you can learn about the physical world from an armchair is that the armchair is not empty. It is furnished with **internalized empirical premises**. When Einstein imagines riding a light beam, he is not conjuring physics out of thin air. He is combining two empirically derived premises that were currently in tension: Maxwell's equations (light speed is constant) and Newtonian mechanics (velocities add up). The thought experiment reveals that these two empirically validated premises are logically incompatible. The "new knowledge" is the realization of that incompatibility.

  **3. Modal Knowledge as Empirical Proxy**
  This epistemology treats **modal knowledge** (knowledge about what is *possible* or *necessary*) as a valid proxy for empirical knowledge. If a thought experiment proves that a certain physical scenario is *impossible* (e.g., a perpetual motion machine of the first kind), that is treated as an empirical fact. The epistemology assumes that the laws of logic, when applied to empirically loaded concepts, map onto the laws of nature.

  ### Addressing the Tension: Why Can't We Do All Physics from the Couch?

  You asked what constrains the practice. If reason can yield empirical insights, why do we need labs?

  **The Constraint is the Empirical Anchor.**
  In this epistemological framework, thought experiments are **conditional**. They take the form: *"IF premises X and Y are true, THEN Z must follow."*
  *   **The Reasoning (The "Then"):** This can be done from the couch. It is rational deduction or simulation.
  *   **The Premises (The "If"):** This cannot be done from the couch. The truth value of the premises must be established by observation.

  You cannot do all physics from the couch because you eventually run out of secure premises. You cannot think your way to the mass of an electron or the value of the cosmological constant. Those are **boundary conditions** that must be measured. Thought experiments can tell you how the mass of an electron *relates* to other variables, or that the cosmological constant *cannot* be infinite, but they cannot give you the number.

  Furthermore, the "simulation engine" of the human mind is fallible. It is calibrated by macroscopic, medium-speed experience (evolutionary history). It is notoriously bad at simulating quantum mechanics or relativistic speeds without mathematical scaffolding. When a thought experiment pushes beyond the range of our calibrated intuition (e.g., Schrödinger's Cat), it often produces paradox rather than knowledge, signaling the need for new empirical data to recalibrate the mind.

  ### The Verdict: Is the Practice Coherent?

  Are scientists running two incompatible theories of knowledge? **No. The practice is coherent, provided you distinguish between the Context of Discovery and the Context of Justification.**

  The charge of incoherence arises if you assume scientists claim thought experiments are the *final arbiter* of truth. They do not.

  1.  **Context of Discovery (Rationalist):** In the generation of hypotheses and the restructuring of theories, scientists act as Rationalists. They use logic, intuition, and consistency checks to navigate the space of possibilities. This is where thought experiments live. They are tools for **theory selection and refinement**.
  2.  **Context of Justification (Empiricist):** In the validation of those theories, scientists act as Empiricists. The output of the thought experiment *must* eventually cash out in a prediction that can be tested by observation.

  **The Coherent Synthesis:**
  The implicit epistemology is that **Reason is the Map, Observation is the Terrain.**
  You can use the map to find a path you hadn't noticed before (the thought experiment). You can deduce that a certain path leads to a cliff (a paradox). But you cannot use the map to tell you what the terrain *is* (empirical constants), nor can you be sure the map is accurate until you walk the path (experiment).

  **Where the Tension Becomes Hypocrisy:**
  The practice becomes incoherent *only* when scientists forget the calibration requirement. This happens when a physicist treats a mathematical elegance or a logical necessity as proof of physical truth without empirical backup (a common critique of modern String Theory). When the "Empirical Anchor" is dropped, and the thought experiment is treated as self-validating, the epistemology collapses into dogmatic Rationalism.

  ### Conclusion

  The epistemology presupposed by scientific thought experiments is **Naturalized Rationalism**. It assumes that human reason is a natural faculty shaped by interaction with the world, capable of extrapolating empirical truths from internalized regularities.

  It is coherent because it does not claim to generate *foundational* empirical knowledge from the armchair. It claims to generate *relational* empirical knowledge. It tells us how the pieces of the universe must fit together, given that we already know what some of the pieces are. The constraint is the necessity of those initial pieces. As long as the thought experiment remains tethered to empirically verified premises and aims for empirically testable conclusions, it is not a contradiction of empiricism, but its highest-order tool.
