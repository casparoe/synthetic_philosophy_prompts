  3.  **Brainstorming Readings (The "Menu"):**

      *   *Reading 1: The Causal/Physical Impact Reading.* Anyone physically impacted.
          *   *Problem:* Everything is connected (butterfly effect). Too broad.
          *   *Verdict:* False/Unworkable.
      *   *Reading 2: The Legal/Juridical Reading.* Anyone bound by the law.
          *   *Problem:* Excludes future gens (they aren't legal subjects yet).
          *   *Verdict:* Substantive but blocks the friend's argument.
      *   *Reading 3: The Vital Interests Reading.* Anyone whose basic rights/welfare are significantly impacted.
          *   *Problem:* How to weigh interests? Who adjudicates?
          *   *Verdict:* Substantive, defensible, but requires institutional innovation (guardianship vs. representation).
      *   *Reading 4: The "Possible People" Reading.* Everyone who *could* exist.
          *   *Problem:* Non-identity problem. Infinite population.
          *   *Verdict:* False/Absurd.
      *   *Reading 5: The "Actual Future People" Reading.* People who will definitely exist.
          *   *Problem:* Epistemic uncertainty.
          *   *Verdict:* Substantive, supports the friend, but hard to implement.
      *   *Reading 6: The "Say as Consideration" Reading.* Interests must be weighed, not necessarily voted on.
          *   *Problem:* Dilutes "democratic say."
          *   *Verdict:* Platitude/Moral truism, doesn't support voting rights.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's intuition (it's a classic debate in democratic theory, e.g., Dahl, Goodin, Beckman). Validate that the slogan is indeed ambiguous.
      *   **The Menu:** Create distinct categories based on the brainstorming above.
      *   **Format per Item:**
          *   Name of Reading.
          *   Definition of "Affected."
          *   Definition of "Say."
          *   Classification (Platitude/Substantive/False).
          *   Does it support the friend? (The Crucial Test).
      *   **Analysis/Conclusion:** Highlight the "Radical but Empty" vs. "Workhorse but Hard" distinction as requested.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining Reading 1 (Causal):* Call it "The Butterfly Effect." If I buy coffee, it affects a farmer in 2050. If *that* counts, democracy is impossible. This is the "False" option.
      *   *Refining Reading 2 (Legal):* Call it "The Subjecthood Principle." Only those bound by law. Future people aren't bound by *our* laws directly, they inherit the consequences. This blocks the friend.
      *   *Refining Reading 3 (Interests):* Call it "The Vital Interests Principle." This is Goodin's version. It's the most common philosophical defense. But does "having a say" mean a *vote*? Usually, it means "interests counted." If it means vote, how? Proxy? This is the "Substantive" one.
      *   *Refining Reading 4 (Say as Voice vs. Vote):* Distinguish between *input* (voting) and *uptake* (consideration). If "say" just means "politicians should think about them," that's a platitude. If it means "seats in parliament," that's radical.

      *   *Wait, I need to make sure I address the "Future Generations" specific angle.*
      *   Let's group them by how they define "Affected."
      *   1. Causal Impact (Too broad).
      *   2. Vital Interests (The standard philosophical move).
      *   3. Coercion/Binding (The standard liberal move).
      *   4. Moral Consideration vs. Political Agency (The "Say" ambiguity).

      *   *Let's try to map the "Radical but Empty" vs. "Substantive but Non-Obvious" request specifically.*
      *   *Radical but Empty:* "All Possible People." Sounds huge, actually meaningless because we can't identify them.
