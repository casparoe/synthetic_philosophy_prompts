prompt: |-
  I lead the model-assessment unit at a public-health agency. Every quarter we choose which of several epidemiological models will underpin planning for vaccination, hospital surge capacity, and travel restrictions, so the choice determines how many ICU beds are planned for, how vaccines are allocated, and whether borders close. None of the candidate models is true: each simplifies transmission, idealizes contact structure, or omits variables we know matter. We nonetheless need to say which is closest to the truth, because the decisions are made downstream of that choice. Our current method is a mix of fit to recent data, institutional pedigree, and the director's instinct, and I want to replace it with something defensible.

  I am aware that philosophers of science have worked on this problem under the name of verisimilitude, or truthlikeness. The obvious proposal — that one false theory is closer to the truth than another when it entails more true statements and fewer false ones — was, as I understand it, shown to collapse for false theories, and later work has tried to build closeness-to-truth out of similarity to the complete true description of the world, with a standing worry about whether such comparisons are stable when the world is redescribed in a different vocabulary. I do not know how to turn any of that into a procedure my unit can run.

  Please write the decision procedure as something we can reuse each quarter. It should be a sequence of questions we ask about each candidate model, in order, with an account of what counts as a sufficient answer to each; it should say where the procedure stops with a no and where it hands the decision to a person because the question is one of values rather than facts. It must be usable in a week by modelers with no philosophical training, and our director will sign off only if the procedure marks clearly which steps are factual, which are conventional, and which are judgment. Then run the procedure on three cases: (1) an influenza model that adds realistic age structure but assumes homogeneous mixing within age groups, against a model without age structure that captures contact heterogeneity better; (2) a model that fits the most recent twelve months of data best but is known to misrepresent the biological mechanism of waning immunity; and (3) a deliberately simple SIR-style model that is false in its assumptions but keeps producing forecasts as good as the others. Include at least one case where the procedure returns a ranking the unit will not like, and close by saying explicitly what the procedure cannot tell us about closeness to the truth.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Lead of a model-assessment unit at a public-health agency.
      *   **Task:** Create a reusable decision procedure for selecting epidemiological models for policy planning (vaccination, ICU, travel).
      *   **Problem:** All models are false (simplifications), but one must be chosen as "closest to truth" for high-stakes decisions. Current method (fit + pedigree + instinct) is indefensible.
      *   **Philosophical Context:** User knows about *verisimilitude* (truthlikeness), Popper's failed definition, and the "language dependence" problem. They want this translated into a practical workflow.
      *   **Requirements:**
          *   Sequence of questions (ordered).
          *   Criteria for sufficient answers.
          *   Stop conditions (when to reject).
          *   Hand-off points (when values/judgment override facts).
          *   Usable by modelers in a week (no philosophy training).
          *   Clear labeling: Factual vs. Conventional vs. Judgment.
          *   Director approval condition (clear marking of step types).
          *   **Application:** Run the procedure on three specific cases.
          *   **Constraint:** Include at least one case where the procedure yields an unpopular ranking.
          *   **Closing:** Explicitly state what the procedure *cannot* tell us about truth.

  2.  **Deconstruct the Philosophical Problem for Practice:**
      *   *Verisimilitude* is theoretically thorny (language dependence, infinite conjunctions). In practice, public health modeling relies on *predictive accuracy*, *structural validity*, and *robustness*.
      *   To make this defensible, I need to bridge the gap between "truthlikeness" and "fitness for purpose." A model isn't "true" in an absolute sense; it's "true enough for decision $D$."
      *   The procedure needs to separate *empirical performance* (Factual), *modeling standards* (Conventional), and *policy priorities* (Judgment/Values).
      *   *Language Dependence:* In modeling, this translates to "variable selection." Are we measuring the right things?
      *   *Popper's Failure:* We can't just count true/false consequences. We need weighted consequences based on policy impact.

  3.  **Drafting the Procedure (The "V-Check" Protocol):**
      *   *Goal:* Make it look like a standard operating procedure (SOP).
      *   *Structure:* Phases.
          *   Phase 1: Sanity Check (Factual/Conventional).
          *   Phase 2: Structural Fidelity (Factual/Judgment).
          *   Phase 3: Decision-Relevance (Judgment/Values).
      *   *Labeling:* Every step needs a tag: [FACT], [CONVENTION], or [JUDGMENT].
      *   *Stop Rules:* If a model fails a [FACT] check, it's out. If it fails a [JUDGMENT] check, it goes to the Director.

      *Refining the Steps:*
      1.  *Data Fit:* Not just $R^2$, but out-of-sample. [FACT]
      2.  *Mechanism Check:* Do the parameters mean what we say they mean? [FACT/CONVENTION]
      3.  *Sensitivity:* Does small change break it? [FACT]
      4.  *Variable Relevance:* Does it include the variables that drive the specific policy? (e.g., Age for vaccines). [JUDGMENT]
      5.  *Error Cost:* Is the error in the direction that hurts most? (e.g., underestimating ICU). [JUDGMENT]

      *Addressing the "Truth" aspect:* The prompt asks for "closeness to truth." I must frame this as "Closeness to the *Causal Structure* relevant to the decision." This avoids the metaphysical trap while satisfying the need for defensibility.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Age vs. Contact):*
          *   Model A: Age structure, homogeneous mixing within age.
          *   Model B: No age, heterogenous contact.
          *   *Policy:* Vaccination (needs age).
          *   *Outcome:* Model A wins on structure, maybe B wins on fit. Procedure should prioritize structure *if* policy is age-targeted.
      *   *Case 2 (Fit vs. Mechanism):*
          *   Model A: Great fit, wrong immunity mechanism.
          *   Model B: Okay fit, right mechanism.
          *   *Policy:* Long-term planning (needs mechanism).
          *   *Outcome:* Procedure should penalize Model A for long-term use, even if fit is better. This might be unpopular if the Director loves fit.
      *   *Case 3 (Simple vs. Complex):*
          *   Model A: Simple SIR, false assumptions, good forecast.
          *   Model B: Complex, "true" assumptions, similar forecast.
          *   *Policy:* Immediate surge.
          *   *Outcome:* Simple wins (instrumentalism). This highlights the limit of "truth."

      *Requirement Check:* "Include at least one case where the procedure returns a ranking the unit will not like."
      *   *Idea:* In Case 2, the unit might prefer the model with the best fit (Model A) because it looks best *now*. The procedure should flag the mechanistic error as a critical risk for *future* planning, forcing a rejection of the "best fit" model. This creates tension.
      *   *Alternative:* In Case 3, the unit might want the complex model because it looks more "scientific." The procedure might select the simple SIR because it's robust and fit-for-purpose. This challenges the "pedigree" instinct. Let's go with this one for the "unpopular" outcome. Modelers love complexity; the procedure might demand simplicity.

  5.  **Refining the Procedure for the Director:**
      *   Needs a clear header.
      *   Needs a legend for [FACT], [CONVENTION], [JUDGMENT].
      *   Needs a "Hand-off" protocol.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the philosophical burden but pivot to "Decision-Relative Verisimilitude."
      *   *The Protocol:* 5 Steps.
          1.  Predictive Adequacy (Out-of-sample).
          2.  Causal/Structural Plausibility.
          3.  Variable Sufficiency (The "Language" problem).
          4.  Error Asymmetry (Value judgment).
          5.  Robustness.
      *   *The Cases:* Apply the steps rigorously.
      *   *The Limitations:* Honest conclusion about metaphysical truth.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Use epidemiological terms (R0, waning, contact matrices) instead of "verisimilitude."
      *   *Critique:* Did I mark the steps clearly?
      *   *Fix:* Use bold tags like **[FACT]**, **[CONVENTION]**, **[JUDGMENT]**.
      *   *Critique:* Did I address the language dependence problem?
      *   *Fix:* Step 3 explicitly asks if the model's vocabulary matches the policy levers.
      *   *Critique:* Is the "unpopular ranking" clear?
      *   *Fix:* In Case 3, explicitly state that the unit prefers the complex model, but the procedure selects the simple one.

  8.  **Final Polish:**
      *   Ensure the tone is professional, authoritative, yet humble about the limits of modeling.
      *   Check that the "Stop" conditions are clear.
      *   Verify the closing statement addresses the "cannot tell us" requirement.

  **(Self-Correction on Case 2):** The prompt asks for a case where the procedure returns a ranking the *unit* will not like.
  *   *Scenario:* The unit loves fit.
  *   *Model A:* Perfect fit, lies about biology.
  *   *Model B:* Good fit, tells truth about biology.
  *   *Procedure:* For *long-term* policy (waning immunity), Mechanism > Fit.
  *   *Result:* Procedure picks B. Unit wants A.
  *   *Decision:* I will use Case 2 for the "unpopular ranking" because prioritizing mechanism over fit is often counter-intuitive to modelers focused on calibration.

  **(Self-Correction on Case 3):** Actually, Case 3 (Simple SIR) is a better candidate for "unpopular" if the unit equates complexity with rigor. But Case 2 is higher stakes (biological truth). Let's make Case 2 the one where the procedure forces a hard truth: "Good fit is not truth."

  Wait, let's look at Case 3 again. "Deliberately simple SIR-style model... false in assumptions." If the procedure selects this, it admits that "truth" (assumptions) matters less than "truthlikeness" (output). If the unit believes "true assumptions = better model," they will dislike the procedure picking the false-assumption model.
  Actually, the prompt asks for *one* case where the ranking is unpopular. I'll make Case 3 the one. Modelers often feel that a model with "false assumptions" is intellectually dishonest, even if it works. The procedure validating it will be contentious.

  Let's refine the "Unpopular" aspect.
  Case 2: Fit vs Mechanism. Unit usually likes Fit. Procedure says Mechanism wins for long term. This is unpopular.
  Case 3: Simple vs Complex. Unit usually likes Complex (pedigree). Procedure says Simple wins for robustness. This is also unpopular.
  I will make Case 2 the "unpopular" one regarding *scientific integrity* (lying about mechanism), and Case 3 the "unpopular" one regarding *sophistication*. I'll focus the "unpopular" note on Case 2 as it's more critical for public health safety.
  *Correction:* I'll stick to the prompt's instruction: "Include at least one case." I will make Case 2 the specific example where the procedure overrides the "best fit" instinct, which is the most common bias.

  9.  **Finalizing the Output Structure:**
      *   Title: Protocol for Model Selection and Verisimilitude Assessment (MSVA).
      *   Legend.
      *   The 5-Step Procedure.
      *   Application to Cases 1, 2, 3.
      *   Limitations Statement.

  10. **Writing the content.** (Mental check: Ensure the distinction between Fact, Convention, and Judgment is sharp.)
      *   Fact: Data, code output, biological consensus.
      *   Convention: Statistical thresholds, peer-review standards.
      *   Judgment: Policy priorities, risk tolerance.

