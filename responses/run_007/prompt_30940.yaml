answer: |-
  # Protocol for Model Selection and Verisimilitude Assessment (MSVA)
  **Version:** 1.0  
  **Authority:** Model-Assessment Unit  
  **Purpose:** To select the epidemiological model with the highest *decision-relevant verisimilitude* (closeness to truth) for quarterly planning.  
  **Constraint:** All candidate models are known to be false simplifications. This protocol identifies which is *least false* regarding the specific policy decision at hand.

  ## Legend: Classification of Steps
  To satisfy the Director's requirement for defensibility, every step is tagged:
  *   **[FACT]:** Empirical claims testable against data or biological consensus. Disagreement here indicates an error in calculation or evidence.
  *   **[CONVENTION]:** Standard modeling practices or statistical thresholds. Disagreement here indicates a deviation from professional norms.
  *   **[JUDGMENT]:** Value-laden choices regarding risk, policy priorities, or resource allocation. Disagreement here must be escalated to the Director.

  ---

  ## The MSVA Procedure

  ### Step 1: Out-of-Sample Predictive Adequacy
  **Question:** Does the model predict data it was not trained on within acceptable error bounds?
  *   **Procedure:** Hold out the most recent 14 days of data. Train on prior data. Compare forecast to held-out data.
  *   **Sufficient Answer:** Mean Absolute Percentage Error (MAPE) < 15% for key metrics (cases, hospitalizations).
  *   **Stop Condition:** If MAPE > 25%, reject model.
  *   **Classification:** **[FACT]** (Calculation) / **[CONVENTION]** (Threshold setting).

  ### Step 2: Structural Plausibility (Mechanism Check)
  **Question:** Do the internal parameters correspond to known biological or social mechanisms?
  *   **Procedure:** Map model parameters (e.g., transmission rate, waning immunity) to current scientific consensus.
  *   **Sufficient Answer:** No parameter contradicts established literature (e.g., immunity waning rate must align with serology studies).
  *   **Stop Condition:** If a parameter is known to be biologically impossible (e.g., negative duration of infection), reject model.
  *   **Classification:** **[FACT]** (Biological consensus).

  ### Step 3: Variable Sufficiency (The "Language" Check)
  **Question:** Does the model's vocabulary include the variables required to simulate the specific policy intervention?
  *   **Procedure:** List the policy levers (e.g., "vaccinate over 65s," "close borders"). Check if the model has state variables corresponding to these levers.
  *   **Sufficient Answer:** Every policy lever maps to a distinct model parameter or state variable without requiring external "patching."
  *   **Stop Condition:** If the policy requires age-targeting and the model lacks age structure, reject model.
  *   **Classification:** **[JUDGMENT]** (Defining policy needs) / **[FACT]** (Checking model structure).

  ### Step 4: Error Asymmetry Analysis
  **Question:** If the model is wrong, in which direction does it err?
  *   **Procedure:** Simulate worst-case parameter uncertainty. Determine if errors tend to underestimate or overestimate burden.
  *   **Sufficient Answer:** Documented bias direction (e.g., "Tends to underestimate peak ICU by 10%").
  *   **Hand-off:** If the model systematically underestimates the metric critical for safety (e.g., ICU beds), the Unit Lead must recommend rejection unless the Director accepts the risk.
  *   **Classification:** **[JUDGMENT]** (Risk tolerance).

  ### Step 5: Robustness to Redescription
  **Question:** Does the model's recommendation hold if we aggregate or disaggregate its population groups?
  *   **Procedure:** Run the model with slightly altered stratification (e.g., combine two age brackets). Check if the policy recommendation changes.
  *   **Sufficient Answer:** Policy recommendation (e.g., "Open borders") remains stable.
  *   **Hand-off:** If recommendations flip based on arbitrary grouping, the model is too sensitive. Escalate to Director as "High Uncertainty."
  *   **Classification:** **[FACT]** (Sensitivity test) / **[JUDGMENT]** (Acceptance of instability).

  ---

  ## Application of MSVA to Quarterly Candidates

  ### Case 1: Age Structure vs. Contact Heterogeneity
  **Context:** Planning for age-targeted vaccination.
  *   **Model A:** Includes 10 age groups, assumes homogeneous mixing within groups.
  *   **Model B:** Single population, includes detailed contact matrices (school, work, home).

  **MSVA Run:**
  1.  **Predictive Adequacy:** Both pass **[FACT]**.
  2.  **Structural Plausibility:** Both pass **[FACT]**.
  3.  **Variable Sufficiency:** Policy is "vaccinate over 65s." Model B cannot distinguish over 65s without external patching. Model A can.
      *   *Result:* Model B fails Step 3 **[JUDGMENT/FACT]**.
  4.  **Error Asymmetry:** Model A might underestimate super-spreading in schools (homogeneous mixing assumption). Model B might underestimate vulnerability in elderly (no age structure).
  5.  **Robustness:** Model A is stable.

  **Ranking:** **Model A is selected.**
  **Rationale:** Despite Model B's superior contact detail, it lacks the *vocabulary* (age) to answer the specific policy question. A model cannot be "close to the truth" of a vaccination campaign if it cannot represent age.
  **Unit Friction:** Modelers may prefer Model B because contact heterogeneity is scientifically "sexier." The procedure overrides this based on policy alignment.

  ### Case 2: Fit vs. Mechanism (The Unpopular Ranking)
  **Context:** Planning for booster shot timing (6-month horizon).
  *   **Model A:** Fits the last 12 months of case data perfectly (MAPE 2%). Mechanism assumes immunity wanes linearly.
  *   **Model B:** Fits the last 12 months well (MAPE 8%). Mechanism assumes immunity wanes exponentially (consistent with immunology).

  **MSVA Run:**
  1.  **Predictive Adequacy:** Model A wins **[FACT]**.
  2.  **Structural Plausibility:** Model A assumes linear waning. Biological consensus is exponential. Model A fails Step 2 **[FACT]**.
  3.  **Variable Sufficiency:** Both pass **[JUDGMENT]**.
  4.  **Error Asymmetry:** Because Model A forces a linear fit to an exponential process, it will drastically overestimate protection at month 6.
  5.  **Robustness:** Model A is brittle to time-horizon changes.

  **Ranking:** **Model B is selected.**
  **Rationale:** Model A is *empirically adequate* but *structurally false*. For a 6-month horizon, the mechanism matters more than the recent fit. Model A is "closer to the past data" but "further from the future truth."
  **Unit Friction:** **This ranking will be unpopular.** The Unit typically prioritizes fit (Step 1) as the primary proxy for truth. This procedure explicitly demotes fit when mechanism is known to be false. The Director must sign off on accepting higher current error (Model B) to avoid catastrophic future error.

  ### Case 3: The "False" Simple Model
  **Context:** Immediate ICU surge capacity (2-week horizon).
  *   **Model A:** Complex Agent-Based Model (ABM). Realistic assumptions. High computational cost.
  *   **Model B:** Simple SIR model. Assumes homogeneous mixing (known false). Low computational cost.
  *   **Performance:** Both produce identical 2-week ICU forecasts.

  **MSVA Run:**
  1.  **Predictive Adequacy:** Tie **[FACT]**.
  2.  **Structural Plausibility:** Model A wins. Model B assumes homogeneous mixing (known false) **[FACT]**.
  3.  **Variable Sufficiency:** Policy is "total ICU beds." Neither requires age or contact detail. Both pass **[JUDGMENT]**.
  4.  **Error Asymmetry:** Model B is more transparent; errors are easier to trace. Model A has hidden emergent behaviors.
  5.  **Robustness:** Model B is mathematically stable. Model A has stochastic variance requiring 1000 runs to average out.

  **Ranking:** **Model B is selected.**
  **Rationale:** For *this specific decision* (total beds, short term), the "false" assumptions of Model B do not impact the output. Model B is *verisimilar enough* for the decision. Model A adds complexity without adding decision-relevant truth.
  **Unit Friction:** Modelers often equate complexity with rigor. Selecting the "false" SIR model over the "realistic" ABM challenges the unit's institutional pedigree instinct.

  ---

  ## Limitations Statement
  **To be appended to all Quarterly Reports:**

  This procedure does not identify which model is *metaphysically true*. All models selected via MSVA remain false simplifications of reality. Specifically, this procedure cannot tell us:

  1.  **The Truth of Unobservables:** We can verify if a model predicts cases, but we cannot verify if the "transmission rate" ($\beta$) inside the model corresponds to the actual biological transmission rate in the population. We select for *predictive isomorphism*, not ontological truth.
  2.  **Stability Under Regime Shift:** If the virus mutates or human behavior changes fundamentally (a change in the "laws" of the system), past structural plausibility (Step 2) offers no guarantee of future validity.
  3.  **Value Neutrality:** Step 4 (Error Asymmetry) explicitly incorporates risk tolerance. A model selected as "closest to truth" for *ICU planning* (where underestimation is fatal) may be rejected for *economic planning* (where overestimation is costly). Truthlikeness is relative to the cost of error.

  **Director Sign-off Required:** By approving the selected model, the Director acknowledges that the choice represents the *best available instrument for the specific decision*, not a statement of scientific fact.
