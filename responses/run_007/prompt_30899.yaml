prompt: |-
  A friend and I argued late into the night about whether Jeffrey conditionalization is a genuine advance over strict conditionalization, and I came away convinced that the formal-epistemology literature has been stuck on this for decades in a way that isn't merely technical. The strict camp says updating is always conditioning on some proposition you come to accept with certainty: if you look at a cloth in dim light and become 0.7 confident it is blue, you can always say you became certain of a proposition about your own experience, such as that you had an experience as of a blue cloth. The Jeffrey camp says that move is a gerrymander, and that the evidence itself is a shift in probabilities across a partition, with no proposition required to go to 1. Both sides seem to accept the same mathematics, and each can simulate the other's formalism, yet neither gives ground. My hypothesis is that the real dispute is about what evidence has to be — a proposition one becomes certain of, or a change in one's degrees of belief — and that no formal result can decide it. Diagnose this impasse: is it a substantive disagreement, a verbal one about the word evidence, a normative-versus-descriptive split, or something else? And given your diagnosis, what would actually count as progress? End with a final line beginning "Diagnosis:" that states in one sentence what kind of disagreement this is.
