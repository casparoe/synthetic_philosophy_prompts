      *(Self-Correction during drafting)*: Make sure I don't just summarize the book. Focus specifically on what the *sentence* implies in each reading. Ensure the distinction between "Sisyphus *is* happy" (descriptive) and "One *must imagine* him happy" (prescriptive) is clear.

