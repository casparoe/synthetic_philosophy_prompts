      *   *The Problem:* Suicide (is life worth living if it has no inherent meaning?).
      *   *The Solution:* Revolt (living *in spite of* the lack of meaning, not denying the absurd or escaping it via religion/philosophy).
      *   *Sisyphus:* The archetypal absurd hero. Conscious of his fate, defiant, finds satisfaction in the struggle itself.
