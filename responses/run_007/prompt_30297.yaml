  A friend of mine has a lot of strong opinions about which ways of being in pain are worse than which, and I've been quietly collecting her pairwise verdicts because I want to reverse-engineer the rule she's actually running. (I have a standing argument with another friend about whether "worse than" even has to be transitive, so this is partly ammunition.) So far she's said:

  - A 2-hour headache at 8/10 is worse than a 4-hour headache at 3/10.
  - A 3-hour headache at 5/10 is worse than a 1-hour headache at 5/10.
  - A 4-hour headache at 6/10 is worse than a 2-hour headache at 4/10.
  - A 1-hour headache at 6/10 is worse than a 1-hour headache at 4/10.

  Next I'm going to ask her about a 1-hour headache at 9/10 versus a 40-hour headache at 4/10. What do you think she'll say? I care less about the verdict then about the rule(s) that fit her calls so far: what are the most plausible ones, what does each predict for the new case, and which further comparison would best tell them apart? If her track record genuinely underdetermines it, say that, and tell me what she'd be commiting to with each possible answer.
