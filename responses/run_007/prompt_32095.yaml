          *   **Meta-Requirement:** State confidence in the philosophical claims and identify the *one step* where I am least sure (the pivot point for alternative theories).

  2.  **Determine the Philosophical Framework:**
      *   The prompt explicitly mentions Nissenbaum (Contextual Integrity). This is the gold standard for "privacy in practice" without being purely libertarian (control-based) or purely utilitarian (harm-based).
      *   *Core Concept:* Privacy is about maintaining appropriate flows of information according to social norms within specific contexts. It's not just secrecy; it's about *trust* and *role expectations*.
      *   *Secondary Concept:* Autonomy/Agency. Users must be able to be themselves without chilling effects.
      *   *Selection:* I will build the procedure around **Contextual Integrity (Nissenbaum)** but simplified for product teams, blended with **Data Minimization (Fair Information Practice Principles)** and **Relational Autonomy**.
      *   *Why?* It fits the health-tech context perfectly. Health data has specific norms (doctor-patient, self-tracking, research) that differ from social media norms.

  3.  **Drafting the Decision Procedure (The "Privacy Stress Test"):**
      *   Needs to be sequential.
      *   Needs to be jargon-light.
      *   Needs clear stop/go signals.
      *   *Step 1: Purpose & Necessity.* (Why do we need this?)
      *   *Step 2: Contextual Expectation.* (Does the user expect this here?)
      *   *Step 3: Power & Asymmetry.* (Can the user say no without losing core function?)
      *   *Step 4: Downstream Flow.* (Where does it go after us?)
      *   *Step 5: The "Creep" Factor.* (Judgment call zone).

  4.  **Refining the Procedure (Adding the Meta-Requirements):**
