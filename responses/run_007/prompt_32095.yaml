answer: |-
  This is one of the most mature questions a product leader can ask. You are correct: compliance is the baseline for *legality*, not the ceiling for *trust*. If you build only to the legal floor, you will eventually build a product people feel compelled to delete, even if they can't prove it broke a law.

  The philosophical framework I recommend grounding this in is **Contextual Integrity**, primarily associated with philosopher Helen Nissenbaum.

  **The Core Idea:** Privacy is not secrecy. Privacy is the appropriate flow of information. Every social context (a doctor's office, a gym, a bedroom, a research lab) has norms about what information should flow, to whom, and for what purpose. Violating privacy isn't just "leaking data"; it's sending data to a place where the social norms don't support it (e.g., your gym trainer selling your heart rate to an insurer).

  Here is a decision procedure built on that framework, translated for a sprint planning room.

  ***

  # The Contextual Integrity & Agency Test (CIAT)

  **Usage:** Apply this to any new data field, sensor, API, or sharing agreement.
  **Participants:** PM, Lead Engineer, Design Rep. (Legal is consulted *after* this, not *during* it).

  ### Step 1: The Necessity Gate (Data Minimization)
  **Question:** Is this specific data point the *least invasive* way to achieve the core value proposition?
  **Sufficient Answer:** "Yes, we cannot achieve [Specific User Benefit] without [Specific Data], and we have ruled out [Less Invasive Alternative]."
  **Hard No:** If the answer is "It would be nice to have" or "We might use it later."
  **Hard No:** If the data can be processed on-device but you plan to send raw data to the cloud.

  ### Step 2: The Expectation Gate (Contextual Fit)
  **Question:** If we explained this collection in one sentence on the box, would the user be surprised?
  **Sufficient Answer:** "No, a reasonable person buying a [Device Type] for [Primary Use] expects this."
  **Hard No:** If the explanation requires the word "but" (e.g., "It tracks sleep, *but* also listens to conversations").
  **Hard No:** If the sensor captures data about *other* people who did not consent (e.g., a camera in a bedroom, a mic in a living room).

  ### Step 3: The Exit Gate (Downstream Flow)
  **Question:** Once we have this data, where can it go that the user cannot see or stop?
  **Sufficient Answer:** "It stays in the user's vault unless they explicitly push it out," OR "It goes to [Partner] strictly for [Purpose] and is contractually barred from [Other Uses]."
  **Hard No:** If the data can be sold, brokered, or used for ad targeting.
  **Hard No:** If the data creates a permanent record the user cannot delete (right to be forgotten).

  ### Step 4: The Agency Gate (Meaningful Consent)
  **Question:** Can the user say "no" to this specific feature without losing the core functionality of the device?
  **Sufficient Answer:** "Yes, this is an opt-in feature," OR "This is core to the device, but we are transparent about it upfront."
  **Hard No:** If saying "no" breaks the device (Coercive Consent), unless the data is physically required for the device to function (e.g., a battery monitor).

  ### Step 5: The Judgment Zone (The "Creep" Factor)
  **Status:** **STOP. Human Judgment Required.**
  **The Question:** Even if we passed Steps 1-4, does this change the relationship between the user and the device from "tool" to "supervisor"?
  **The Task:** The PM and Lead Engineer must write a 3-sentence narrative from the user's perspective: *"I wear this to help me, but now I feel..."*
  **Decision:** If the sentence ends with "...watched," "...judged," or "...anxious," you must escalate to the Ethics Board or Executive Team. This is not a checklist item; it is a values calibration.

  ***

  # Application to Your Proposals

  Here is how your team should run these two specific proposals through the CIAT.

  ### Proposal 1: Passive Audio Sampling for Sleep Apnea
  *The Plan:* Mic samples 30 seconds of ambient audio every hour during sleep to flag respiratory distress.

  *   **Step 1 (Necessity):** **Yellow Flag.** Can apnea be detected via SpO2 and motion alone? If yes, audio fails. If audio is significantly more accurate, it passes, *but* only if processed on-device. Sending raw audio to the cloud fails immediately.
  *   **Step 2 (Expectation):** **Hard No.** A wearable on the wrist is expected to measure *you*. A microphone in a bedroom measures *the environment*. This violates the context of the "bedroom" (intimate space) and the context of the "wearable" (bodily metric). Even if you disclose it, the surprise factor is too high.
  *   **Step 3 (Exit):** **Risk.** Audio is high-risk for re-identification and capturing third parties (partners, children).
  *   **Step 4 (Agency):** **Risk.** If apnea detection is a "safety feature," users may feel coerced into enabling the mic.
  *   **Step 5 (Judgment):** **Fail.** Narrative: *"I wear this to sleep better, but now I feel like there is a wiretap in my bed."*
  *   **Verdict:** **Do not build as proposed.**
      *   *Pivot:* Build a dedicated snore-detection algorithm that processes audio locally on the device, discards the raw audio immediately, and transmits only a binary "distress event" metadata tag. Even then, this requires explicit, separate opt-in consent that is not bundled with general setup.

  ### Proposal 2: Sharing De-identified HRV/Sleep Trends for Long COVID Research
  *The Plan:* Share aggregated, de-identified trends with an academic group.

  *   **Step 1 (Necessity):** **Pass.** You aren't collecting *new* data; you are re-using existing data for a high-value health purpose.
  *   **Step 2 (Expectation):** **Pass.** Users generally accept that health data contributes to medical research, provided it is for public good, not commercial gain.
  *   **Step 3 (Exit):** **Conditional Pass.** Depends entirely on the Data Use Agreement (DUA). The academics must be contractually barred from attempting re-identification or sharing with third parties.
  *   **Step 4 (Agency):** **Pass.** Must be Opt-In. Cannot be pre-checked.
  *   **Step 5 (Judgment):** **Pass.** Narrative: *"I wear this to manage my health, and I feel good knowing my data might help others recover from illness."*
  *   **Verdict:** **Proceed, with guardrails.**
      *   *Requirement:* The consent flow must name the specific research institution and the specific study goal. "Sharing with partners" is too vague. "Sharing with [University X] for Long COVID respiratory analysis" is acceptable.

  ***

  # Meta-Analysis: Confidence & Uncertainty

  You asked for transparency on the philosophical grounding of this procedure.

  **Confidence Level:** **High (85%)**
  I am highly confident in the **Contextual Integrity** framework (Steps 2 & 3). It is the most robust non-legal framework for privacy currently available in tech ethics. It moves beyond the binary of "public vs. private" and acknowledges that data flow is normal and necessary, provided it respects the norms of the specific context (health vs. marketing vs. research). This aligns well with user intuition, which is what builds trust.

  **The Point of Least Confidence: Step 5 (The Judgment Zone)**
  This is the pivot point where a different philosophical theory would dismantle this checklist.

  *   **Why I'm unsure:** Step 5 relies on a **Relational Autonomy** view—that we should avoid designs that make users feel surveilled or anxious, even if they "consented."
  *   **The Alternative View (Utilitarian/Consequentialist):** A strict Utilitarian would argue Step 5 is unnecessary bloat. If the passive audio (Proposal 1) saves lives by detecting apnea early, the "creepiness" is irrelevant. The aggregate good (lives saved) outweighs the individual discomfort (feeling watched). A Utilitarian checklist would replace Step 5 with a **Risk/Benefit Calculation**: *If (Probability of Detection × Severity of Condition) > (Probability of Harm × Severity of Privacy Violation), then Proceed.*
  *   **Why I reject the Alternative for you:** In consumer health tech, trust is your currency. A Utilitarian calculation might justify a feature that saves 100 lives but causes 10,000 users to delete the app because they feel violated. That kills the company. However, if your startup is in "crisis mode" or building for a clinical setting (hospital) rather than consumer wellness, the Utilitarian scale might weigh heavier.
  *   **The Risk:** Step 5 is subjective. Two PMs can write two different narratives. This is why I mandated that Step 5 requires escalation. It acknowledges that the checklist has ended and *leadership* must begin.

  **Summary for your Team:**
  Use Steps 1-4 as your automated gates. If you fail those, the answer is No. If you pass those, you hit Step 5. If Step 5 makes you hesitate, do not treat that hesitation as a bug to be engineered away. Treat it as a signal that you are approaching the boundary of your users' trust. That is where product strategy becomes moral strategy.
