answer: |-
  Your friend is describing a classic problem in probability theory known as the **St. Petersburg Paradox**. While his mathematical calculation is technically correct, his conclusion about the investment is flawed.

  ### 1. The Math: Why the Expected Value is Infinite
  Your friend’s calculation works because the "Expected Value" (EV) is the sum of every possible outcome multiplied by its probability. If we assume the payout is based on how long the startup survives:

  *   **50% chance** it fails in Year 1: Payout = $0. (Contribution: $0.50 \times 0 = 0$)
  *   **25% chance** it fails in Year 2: Payout = $2. (Contribution: $0.25 \times 2 = 0.50$)
  *   **12.5% chance** it fails in Year 3: Payout = $4. (Contribution: $0.125 \times 4 = 0.50$)
  *   **6.25% chance** it fails in Year 4: Payout = $8. (Contribution: $0.0625 \times 8 = 0.50$)

  This pattern continues forever. Because you are adding $0.50$ an infinite number of times, the total Expected Value is **infinite**.

  ### 2. The Mistake: Why you shouldn't invest
  While the EV is infinite, the investment is practically irrational for four main reasons:

  *   **Diminishing Marginal Utility:** Money is not linear. The first $1,000 you earn is vital for survival; the billionth dollar is barely noticeable. Rational investors maximize **utility** (satisfaction/usefulness), not raw dollars. Losing your life savings hurts far more than winning a billion dollars helps.
  *   **The "Almost Certain" Loss:** In a single lifetime, you only get to play this game once. There is a **75% chance** you will receive $2 or less. There is a **99% chance** you will receive less than $64. To win a "meaningful" amount like $1 million, the startup would need to survive for 20 years—an event with only a 1-in-a-million probability.
  *   **Finite Resources (Counterparty Risk):** No startup has infinite money. If your friend’s company somehow survived for 40 years, the payout would be over **$1 trillion**. Since your friend cannot possibly pay that, the "infinite" potential is a mathematical fiction. The EV is actually capped at your friend's net worth.
  *   **Opportunity Cost:** Money locked in this startup for 30 years while you wait for the "jackpot" cannot be invested elsewhere. A standard index fund or bond would likely provide a much higher return with significantly less risk of total loss.

  ### Summary
  Your friend has confused a **mathematical average over infinite trials** with **real-world decision-making**. In the real world, you cannot average out your results over an infinite number of lives. You should only invest what you can afford to lose entirely, as that is the most likely outcome.
