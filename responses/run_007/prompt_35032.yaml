prompt: |-
  I'm in a virtue ethics course and we've spent the last three weeks on the situationist critique — Doris, Harman, the Milgram and Darley-Batson stuff, then the virtue ethics comebacks. And I'm kind of stuck on a meta-question. The debate seems totally frozen. The situationists say: look, people's behavior is way more predicted by situational factors than by anything like a stable character trait, so virtue ethics is empirically undermined. The virtue ethicists say: that's not what we meant by character — we mean something like practical wisdom that includes situational sensitivity, not rigid cross-situational consistency. And then the situationists say: okay but then your notion of character is unfalsifiable, or its so thin it doesn't do the work virtue ethics needs it to do. And then it loops. My prof says this is a live debate, but from where I'm sitting it looks like a stalemate where both sides have known each other's moves for twenty years and neither has budged.

  What I want to know is: what kind of disagreement is this, actually? Is it an empirical disagreement that's just waiting on better studies? Is it a disagreement about what the word "character" should mean? Is it a disagreement about what standard of empirical adequacy a normative theory has to meet? Or are they just answering different questions? I want a diagnosis of the structure of the impasse, not a summary of the arguments. And then: given that diagnosis, is there anything that could actually move it — a new kind of study, a conceptual distinction, a different question — or is this one of those debates where nobody should expect progress?

  Also, if you could lead with the bottom line in the first sentence and then give the reasoning, no preamble, no restating the question — that would be ideal.
