answer: |-
  This stalemate is not an empirical deadlock waiting on better data, but a methodological clash over what psychological commitments a normative theory must entail to remain substantive, meaning progress depends on shifting from trait existence debates to models of moral skill acquisition.

  The core structure of the impasse is a disagreement about **theoretical entailment**. Situationists operate under the assumption that for virtue ethics to be viable, it must posit the existence of global, cross-situational character traits as a descriptive hypothesis about human psychology. Virtue ethicists counter that their theory is normative and aspirational, positing capacities (like *phronesis*) that may not be fully realized in the population yet, or that function as local sensitivities rather than global consistencies. Because the situationists define "virtue" in a way that makes it empirically falsifiable (global consistency) and the virtue ethicists define it in a way that makes it empirically resilient (dynamic capacity), the empirical data from Milgram or Darley-Batson cannot settle the dispute. The data refutes the situationist's straw man of virtue, but the virtue ethicist's revised definition often looks like a moving goalpost to the situationist. Consequently, the debate loops because one side is demanding descriptive accuracy of current behavior while the other is offering a normative model of potential agency.

  The charge that the virtue ethicist's conception is "unfalsifiable" or "too thin" highlights a secondary conflict about **normative utility**. Situationists argue that if character is so sensitive to situation that it doesn't predict behavior, it cannot serve the explanatory or guiding function virtue ethics promises. Virtue ethicists respond that the function isn't prediction, but cultivation and evaluation. This is where the debate becomes sticky: if virtues are merely local habits, do they retain the unity and stability required to ground a moral theory? This is not a question psychology can answer; it is a philosophical question about the necessary conditions for moral responsibility and integrity. The impasse persists because both sides are talking past each other's criteria for success—one values predictive power, the other values normative guidance.

  Progress is possible, but only if the debate shifts terrain from the **existence of traits** to the **mechanics of moral development**. New empirical work on "local" traits, interactionist models (person × situation), and dual-process theories of cognition could bridge the gap by showing how stable dispositions interact with situational cues without requiring global consistency. For example, research on moral expertise or skill acquisition models treats virtue as a learned competency rather than a fixed trait, which accommodates situational variability without abandoning stability. Additionally, focusing on "moral ecology"—how agents modify their environments to support virtue—sidesteps the internal trait debate entirely. If the question changes from "Do virtues exist?" to "How do we construct reliable moral agents given situational fragility?", the stalemate dissolves into a collaborative project between psychology and ethics.

  Ultimately, this is not a dead-end debate, but it is an exhausted one in its current formulation. Expecting progress from standard social psychology studies on consistency is futile because the virtue ethicists have already conceded that point. The breakthrough will come from philosophical psychology that integrates empirical findings into a nuanced model of agency, or from virtue ethicists who specify exactly what psychological mechanisms underwrite *phronesis* in a way that is testable but not vulnerable to the globalist critique. Until the question shifts from metaphysical existence to functional cultivation, the loop will continue.
