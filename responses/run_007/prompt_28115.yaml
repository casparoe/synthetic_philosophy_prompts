  ok so i've been reading about this thing called money pumps and whether its irrational to change your mind over time and i have all these verdicts on different cases but they dont seem to add up to anything coherent. can you help me find a principle? please answer in british english.

  case 1: my friend alice says she prefers tea to coffee, coffee to hot chocolate, but hot chocolate to tea. i point out that if she has tea, she'd pay a penny to swap to hot chocolate, then a penny to swap to coffee, then a penny to swap back to tea — and she'd be down three pence with the same drink. this seems obviously irrational to me, like she's made a mistake somewhere.

  case 2: bob decides at 20 he wants to be a doctor. at 25, after shadowing doctors and realising he hates hospitals, he switches to teaching. that doesnt seem irrational at all. his preferences changed because he learned stuff.

  case 3: carol sets up a direct debit to a savings account specifically because she knows her future self will want to blow her paycheck on stupid things. this seems not just rational but wise. shes constraining her future choices and thats... good?

  case 4: dave is offered a bet on a coinflip for £5 and takes it. after losing, he's offered the exact same bet again and refuses, saying hes not feeling lucky anymore. this feels irrational to me even though nothing about the objective odds changed. his mood shifted but so what?

  case 5: emma is offered a trade: her apple for a pear, plus 1p. she accepts. then shes offered her original apple back for the pear, plus 1p. she accepts that too. now she has the apple and is down 2p. this feels like shes been exploited but is she irrational or just inattentive?

  case 6: frank has been vegetarian for years. after reading peter singer he decides eating meat is actually fine (he has some complicated view about replaceability). he genuinely reflected on it. i dont think hes irrational even though his preference changed dramatically.

  my question: is there a single principle that tells me which preference changes over time are rationally okay and which arent? and which of my verdicts does it force me to give up, if any? also what would the principle say about someone who makes a new years resolution to go to the gym and then doesnt go in february — are they irrational or just weak-willed, and is there even a difference?
