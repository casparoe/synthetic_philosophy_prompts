answer: |-
  ### Exam Question: Program Equilibrium and Löbian Cooperation
  **Time Allowed:** 45 minutes  
  **Total Marks:** 16

  **Question 1**

  Consider the standard Program Equilibrium setup where agents submit source code that can read the opponent's source code. Let $A(B)$ denote the action of program $A$ against program $B$. Let $\square \phi$ denote "$\phi$ is provable in Peano Arithmetic (PA)."

  Define two agents:
  1.  **NaiveBot:** $Naive(B) = C \iff \square (B(Naive) = C)$. Otherwise $D$.
  2.  **FairBot:** $Fair(B) = C \iff \square (B(Fair) = C)$. Otherwise $D$.

  (a) Explain why $NaiveBot$ playing against itself ($Naive$ vs. $Naive$) fails to guarantee cooperation, despite both agents seeking proof of cooperation. Specifically, identify the logical regress that occurs. (6 marks)

  (b) Construct the logical argument for why $FairBot$ cooperates with itself ($Fair$ vs. $Fair$). Your answer must explicitly state the proposition $P$ being evaluated, show how the source code of $FairBot$ generates a specific conditional involving $\square$, and explain precisely how Löb's Theorem is applied to resolve the regress identified in part (a). (10 marks)

  ***

  ### Model Answer

  **Part (a): The Failure of NaiveBot**
  The failure of $NaiveBot$ stems from an infinite regress of proof requirements. For $Naive$ to cooperate against $Naive$, it must find a proof in PA that $Naive(Naive) = C$. However, by the definition of $NaiveBot$, the statement $Naive(Naive) = C$ is logically equivalent to the statement $\square (Naive(Naive) = C)$.

  Therefore, for $Naive$ to cooperate, PA must prove $\square (Naive(Naive) = C)$. But for PA to prove a statement of the form $\square \phi$, it generally requires a proof of $\phi$ itself (subject to derivability conditions). This creates a circular dependency: $Naive$ waits for a proof that a proof exists. Without a mechanism to collapse this hierarchy, the agents are stuck in a loop where each requires the other to have already completed a proof that depends on the first proof being completed. In modal logic terms, $Naive$ requires $\square P$ to be true to output $C$, but $P$ is defined as $\square P$. PA cannot prove $\square P \leftrightarrow P$ generally; it cannot validate its own soundness. Thus, no proof is found, and both defect.

  **Part (b): Löbian Cooperation in FairBot**
  For $FairBot$ vs. $FairBot$, let $P$ be the proposition $Fair(Fair) = C$. By the definition of $FairBot$, we have the biconditional:
  $$ P \iff \square P $$
  However, this equivalence holds at the semantic level. Inside the proof system, $FairBot$'s source code ensures that PA can prove the implication:
  $$ \vdash (\square P \to P) $$
  This is because $FairBot$ is constructed such that if PA proves the opponent cooperates, $FairBot$ *will* cooperate. Since the opponent is also $FairBot$, PA can verify that if a proof of $P$ exists, $FairBot$ executes $C$. Thus, PA proves "If $P$ is provable, then $P$ is true."

  This is the precise antecedent required for Löb's Theorem. Löb's Theorem states that for any sentence $P$, if $\vdash (\square P \to P)$, then $\vdash P$.

  In the $NaiveBot$ case, the agents required $\square P$ as a precondition for action, creating a demand for $\square \square P$, and so on. In the $FairBot$ case, the source code creates a conditional promise: "If I am provable, I happen." Because PA can verify this conditional relationship between provability and truth (the derivability conditions), Löb's Theorem allows the system to bypass the infinite regress. The theorem guarantees that $P$ is provable ($\vdash P$). Since $\vdash P$, $FairBot$ finds the proof it requires and outputs $C$. Consequently, mutual cooperation is a program equilibrium. The mechanism works not because the agents trust each other, but because the logical structure of their source code creates a fixed point that Löb's Theorem resolves.

  ***

  ### Marking Scheme

  **Total Marks: 16**

  **Part (a): NaiveBot Failure (6 Marks)**
  *   **2 marks:** Identifies that $Naive$ requires a proof of cooperation ($\square P$) to cooperate.
  *   **2 marks:** Identifies that $P$ is equivalent to $\square P$ in this context, creating a self-referential loop.
  *   **2 marks:** Explicitly states the regress (e.g., needing a proof of a proof, or $\square \square P$) or notes PA cannot prove its own soundness ($\square P \to P$) generally.
      *   *Common Pitfall:* Students claim NaiveBot defects because it "doesn't trust" the other, rather than identifying the proof-theoretic regress.

  **Part (b): FairBot and Löb's Theorem (10 Marks)**
  *   **2 marks:** Correctly defines $P$ as $Fair(Fair) = C$.
  *   **3 marks:** Derives or states the crucial conditional: $\vdash (\square P \to P)$. Must show this comes from the source code definition (if provable, then act).
  *   **3 marks:** Correctly states Löb's Theorem: If $\vdash (\square P \to P)$, then $\vdash P$.
  *   **2 marks:** Concludes that since $\vdash P$, the bot finds the proof and cooperates.
      *   *Common Pitfall:* Students state Löb's Theorem as "$\square P \to P$" without the outer turnstile, or claim Löb's Theorem proves consistency.

  **Grading Boundaries**
  *   **A Grade (14–16 marks):** Must secure all marks in Part (b). Specifically, must distinguish between the object-level implication and the provability of that implication ($\vdash (\square P \to P)$). Must clearly articulate that Löb's Theorem collapses the regress by validating the soundness of the specific self-referential conditional.
  *   **B Grade (10–13 marks):** Understands the general flow (FairBot uses Löb, NaiveBot fails) but is sloppy with notation. Typical B errors: Writing Löb's theorem as $\square P \to P$ (missing the provability of the implication); failing to explain *why* FairBot generates $\square P \to P$ while NaiveBot does not; confusing truth with provability in the conclusion.
  *   **C Grade (6–9 marks):** Identifies that FairBot cooperates and NaiveBot defects but relies on hand-waving about "recursion" without invoking the provability predicate $\square$ or the specific structure of Löb's Theorem.
  *   **D/F (0–5 marks):** Fundamental confusion between Nash Equilibrium and Program Equilibrium, or claims cooperation is impossible in one-shot PD regardless of source code access.

  **Specific A vs. B Differentiator:**
  An **A** answer treats $\square$ as a modal operator and respects the distinction between $P$ being true and $\vdash P$. A **B** answer often treats $\square$ as merely "the bot thinks" and misses the formal requirement that PA must prove the conditional $\square P \to P$ before Löb applies.
