  1. Patients often describe their post-op life as phenomenologically continuous with their pre-op life. If a second subject emerged during surgery, why does the reporting hemisphere never testify to the sudden appearance of a new, independent agent sharing its head?
  Follow-up: You will likely say the left hemisphere "interprets" for both. But if it is interpreting for two distinct minds, why doesn't it report the *effort* of managing a separate will, just as it reports the effort of managing a rebellious limb?

  2. In the lab, the hands conflict; in the wild, they cooperate. If these are truly two distinct wills with separate survival interests, what motivates the right hemisphere to consistently defer to the left outside the controlled environment?
  Follow-up: If you argue subcortical pathways facilitate this cooperation, doesn't that imply those pathways are sufficient for shared agency? And if they are sufficient for shared agency, why aren't they sufficient for shared consciousness?

  3. You claim the corpus callosum is the bridge between subjects. But within a single hemisphere, visual and auditory processing are modular and separated by significant transmission delays. What specific feature binds *those* modules into one subject rather than many?
  Follow-up: If you answer "dense connectivity," are you reducing subjecthood to a matter of bandwidth? If so, isn't the difference between one subject and two a matter of degree, rather than the countable integer your view requires?

  4. If subjecthood depends on information integration, where exactly is the threshold? If we gradually sever the callosum fiber by fiber, at which specific cut does one subject become two?
  Follow-up: If you posit a sharp metaphysical boundary despite continuous physical degradation, aren't you committing to a form of dualism where consciousness snaps apart independently of the biology?

  5. If hemispheres are separate subjects when severed, does it follow that intact brains house two suppressed subjects constantly vying for control, merely synchronized by the callosum?
  Follow-up: You might say the callosum *fuses* them into one. But does it fuse them ontologically, or just functionally? If functionally, aren't we all permanently co-habiting with a twin we simply can't detect due to high-speed communication?
