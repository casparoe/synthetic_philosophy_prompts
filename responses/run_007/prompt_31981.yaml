      *   *Check:* Did I distinguish Average vs. Marginal cost? *Correction:* Make this a specific desideratum. It's the most common point of confusion.
      *   *Check:* Is the "Killer" requirement clearly identified? *Yes, Differential/Marginal Cost.*
      *   *Check:* Did I address the "jointly unsatisfiable" prompt? *Yes, Honesty vs. Efficiency is the big one.*

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note on Aposematism)*: Aposematism is tricky. Is the coloration costly? Sometimes it's metabolic. Sometimes it's increased detection by naive predators. The theory needs to account for why the signal isn't just a cue of the toxin. I will frame the desideratum to require an explanation of *why* the signal form is maintained, not just the underlying trait.

  *(Self-Correction on "Non-negotiable")*: Be careful. Some things are "non-negotiable for a game-theoretic model" but "debatable for a broad biological heuristic." I will frame them as non-negotiable for a *formal theory of costly signaling*.

  *(Final check on the "Killer")*: The prompt asks for the single requirement that knocks out "honest because expensive." That is definitely the **Differential Cost Condition**. Absolute cost allows cheating if benefits are high enough. Differential cost makes cheating *net negative* for low types.

