answer: |-
  Here is the specification for an adequate theory of Costly Signaling. This is structured as a requirements document: functional goals, structural constraints, and evolutionary stability conditions.

  ### I. Functional Desiderata (What the system must do)

  **1. Uncertainty Reduction (Information Transfer)**
  *   **Requirement:** The signal must alter the receiver's probability distribution over the sender's hidden state (quality, intent, resource holding potential).
  *   **Case:** A stotting gazelle changes the predator's belief about the likelihood of a successful chase. A potlatch changes the community's belief about the leader's surplus capacity.
  *   **Status:** **Non-negotiable.** If no information is transferred, it is noise, not signaling.
  *   **Consideration:** This rules out "signals" that are ignored or that convey no new information (e.g., a signal that is sent by all types equally in a pooling equilibrium conveys zero information about type, though it may convey information about *presence*).

  **2. Receiver Benefit (Attendability)**
  *   **Requirement:** Receivers must gain a net fitness (or utility) benefit from attending to the signal and acting on it, compared to ignoring it.
  *   **Case:** A female bird gains genetic benefits by choosing a male with a large ornament. A predator gains energy efficiency by ignoring a stotting gazelle.
  *   **Status:** **Non-negotiable.** If receivers do not benefit, selection will favor receivers who ignore the signal, causing the signaling system to collapse.
  *   **Consideration:** This distinguishes signaling from manipulation. In manipulation, the sender benefits at the receiver's expense. In stable signaling, the correlation between signal and state must be useful enough to offset the cost of processing the signal.

  **3. Sender Benefit (Conditional)**
  *   **Requirement:** Senders must gain a net benefit from signaling *relative to not signaling*, conditional on their type.
  *   **Case:** A high-quality male gains mates; a low-quality male saves energy by not signaling (or dies trying).
  *   **Status:** **Non-negotiable.** Traits that reduce net fitness without compensation cannot evolve or be maintained.
  *   **Consideration:** This does not mean *all* senders benefit equally. In a separating equilibrium, low-quality types may be forced to signal at a loss to mimic high types, or (more commonly) they opt out entirely. The *system* must provide an incentive for the relevant types to participate.

  ---

  ### II. Structural Desiderata (The mechanics of cost and honesty)

  **4. The Differential Cost Condition (Marginal Cost)**
  *   **Requirement:** The *marginal* cost of increasing signal intensity must be higher for low-quality senders than for high-quality senders.
  *   **Case:** Growing a long tail is metabolically and aerodynamically harder for a parasite-ridden bird than a healthy one. Burning wealth is easier for a rich leader than a poor one.
  *   **Status:** **Non-negotiable.** This is the core mechanism.
  *   **Consideration:** This is the specific requirement that kills the "honest because expensive" fallacy. Absolute cost does not ensure honesty (a liar can pay a high cost if the benefit is higher). Only *differential* cost makes lying unprofitable for the low type while remaining profitable for the high type.

  **5. Signal vs. Cue Distinction**
  *   **Requirement:** The theory must distinguish between traits evolved *for* communication (signals) and traits that convey information incidentally (cues).
  *   **Case:** A limp is a cue of injury (unavoidable). A stag's roar is a signal of strength (could be faked, but cost prevents it). Aposematic coloration is a signal (evolved to be conspicuous); the toxin is the underlying state.
  *   **Status:** **Non-negotiable.** Conflating them leads to incorrect evolutionary predictions. Cues do not require receiver benefits to persist; signals do.
  *   **Consideration:** A theory of costly signaling is specifically about *signals*. If a trait is an index (physically constrained cue, like voice pitch correlating with body size), costly signaling theory may not apply, or applies differently.

  **6. Evolved Cost vs. Physical Constraint**
  *   **Requirement:** The theory must distinguish between costs that are biologically engineered (handicaps) and costs that are physical inevitabilities (indices).
  *   **Case:** A peacock's tail is an evolved handicap (survival risk). The frequency of a croak is an index (physics of vocal cords).
  *   **Status:** **Non-negotiable.** Handicaps require an explanation for why the cost was *added* or *maintained* despite survival penalties. Indices require an explanation of why the correlation cannot be broken.
  *   **Consideration:** Sloppy theories treat all costs as handicaps. A rigorous theory identifies whether the cost is the *mechanism of honesty* (handicap) or a *byproduct of production* (index).

  **7. Honesty at Equilibrium vs. Honesty as Mechanism**
  *   **Requirement:** The theory must specify whether honesty is a dynamic outcome of selection (equilibrium) or a hard constraint on production.
  *   **Case:** In game theory, honesty is an ESS (Evolutionarily Stable Strategy); cheaters *could* exist but are selected against. In index signaling, cheaters *cannot* exist physically.
  *   **Status:** **Non-negotiable.** Costly signaling theory specifically addresses the former (honesty at equilibrium).
  *   **Consideration:** If honesty is physically guaranteed, no "costly signaling" model is needed. The theory must explain how honesty persists *despite* the possibility of deception.

  ---

  ### III. Evolutionary Desiderata (Stability and Dynamics)

  **8. Invasion Resistance (ESS)**
  *   **Requirement:** The signaling strategy must be stable against invasion by "silent" mutants (senders who don't pay the cost) and "liar" mutants (low-quality senders who fake the signal).
  *   **Case:** If a low-quality male can grow a large tail cheaply, he invades. If females stop looking at tails, tail-growing males lose fitness.
  *   **Status:** **Non-negotiable.** Without stability, the phenomenon is transient and not an adaptation.
  *   **Consideration:** This requires a game-theoretic formulation. Simple optimization models (single-agent) are insufficient because fitness depends on the receiver's response.

  **9. Cost Efficiency (The Waste Question)**
  *   **Requirement:** The theory must account for the net social/fitness cost of the signaling system.
  *   **Case:** Potlatch destroys wealth. Stotting wastes energy. Peacock tails increase predation risk.
  *   **Status:** **Camp Preference / Tension Point.**
      *   *Zahavi's View:* Waste is the point. The cost *is* the signal.
      *   *Game Theory View:* Cost is a necessary evil to maintain separation; models often seek the *minimum* cost required to maintain honesty.
  *   **Consideration:** A complete theory should predict *how much* cost is evolved. Is it the maximum affordable (Zahavi) or the minimum necessary for separation (Grafen/Godfray)?

  **10. Cross-Domain Generality**
  *   **Requirement:** The logic must hold across biological, psychological, and cultural domains without category errors.
  *   **Case:** The math governing a gazelle's stotting should be structurally isomorphic to a human's risky public sacrifice, even if the currency changes (calories vs. capital).
  *   **Status:** **Preference.** While biological CST is the root, a robust theory should not break when applied to cultural evolution, provided "fitness" is defined appropriately (e.g., status, reproductive access).
  *   **Consideration:** Failing this leads to "just-so stories" in human behavioral ecology that don't map onto the formal biology.

  ---

  ### IV. Tensions and Joint Unsatisfiability

  Here is where the spec gets difficult. You cannot maximize all desiderata simultaneously.

  **1. Perfect Honesty vs. System Efficiency**
  *   **The Tension:** A fully separating equilibrium (perfect honesty, where every quality level has a unique signal) usually requires significant aggregate cost (waste). A pooling equilibrium (everyone sends the same signal) is efficient (no waste) but conveys no information.
  *   **Unsatisfiability:** You generally cannot have **Perfect Information Transfer** and **Zero Waste**.
  *   **Resolution:** Adequate theories must predict a *partial* pooling or a specific level of cost that balances the marginal benefit of information against the marginal cost of production. If a theory claims perfect honesty with zero cost, it is likely describing an Index, not a Costly Signal.

  **2. Sender Optimality vs. Receiver Optimality**
  *   **The Tension:** Senders prefer to signal less (save cost) or exaggerate (gain benefit). Receivers prefer signals to be cheaper (easier to assess) or more honest (better decisions).
  *   **Unsatisfiability:** You cannot satisfy **Sender Fitness Maximization** and **Receiver Fitness Maximization** simultaneously in a conflict-of-interest scenario.
  *   **Resolution:** The theory must solve for an **Evolutionarily Stable Strategy (ESS)** where neither party can unilaterally deviate to improve their position. This is rarely "optimal" for either party in a vacuum; it is a stable compromise.

  **3. The "Handicap" vs. "Index" Boundary**
  *   **The Tension:** Many traits thought to be handicaps (e.g., deep voice, muscle mass) have strong physical constraint components (indices).
  *   **Unsatisfiability:** It is often empirically impossible to strictly categorize a trait as **Pure Handicap** or **Pure Index**.
  *   **Resolution:** An adequate theory must allow for a continuum. Insisting on a binary classification is a category error. The requirement is to identify the *marginal* contribution of cost to honesty, regardless of the physical substrate.

  ---

  ### V. The "Killer" Requirement

  If you only remember one thing to knock out the sloppy versions of the Handicap Principle ("It's honest because it's expensive"), it is this:

  **The Differential Cost Condition (Requirement #4)**

  **Why it kills the sloppy version:**
  The sloppy version argues: *Signal Cost > Benefit of Lying.*
  This is false. If the benefit of being perceived as high-quality (e.g., mating with 10 females) is massive, a low-quality individual will happily pay a high cost (e.g., reduced survival) to get it. Absolute expense does not stop cheating.

  The rigorous requirement argues: *Marginal Cost (Low Type) > Marginal Benefit > Marginal Cost (High Type).*
  The cost must be **conditionally prohibitive**. It's not that the signal is expensive; it's that it is *disproportionately* expensive for the liar compared to the truth-teller.

  **Example:**
  *   **Sloppy:** "Burning money is honest because money is valuable." (Wrong. A broke person could burn their rent money to fake wealth).
  *   **Rigorous:** "Burning money is honest because the marginal utility of that money is higher for the broke person than the rich person." (The rich person loses status utility; the broke person loses survival utility).

  **Verdict:** Any model that relies on **Average Cost** rather than **Marginal/Differential Cost** is theoretically bankrupt. It cannot explain stability. It cannot explain why the low-quality type doesn't just "pay the price."

  ### Summary Scorecard for Your Reading
  When you read the literature, check the models against **Requirement #4**.
  *   If they model cost as a fixed parameter for all agents: **Reject.**
  *   If they model cost as a function of quality (interaction term): **Keep.**
  *   If they claim honesty is maintained by "punishment" without differential cost: **Scrutinize** (this moves into policing/enforcement models, not pure signaling).
  *   If they claim the signal is an Index (physically constrained): **Note** (this is a different mechanism, though often grouped under CST).

  This spec gives you the filter to separate the game-theoretic rigor from the biological hand-waving.
