prompt: |-
  i'm trying to get my head around costly signaling theory and the handicap principle before i read any more of it, and i'd rather start from the spec than from whatever the latest model happens to do. so write me the desiderata. what does a theory of costly signaling actually have to get right to count as adequate? give me the full list of requirements, with the case or consideration behind each. i want the cases covered: mate-choice ornaments, aposematic displays, stotting and other pursuit-deterrence stuff, aggressive displays that let animals settle contests without fighting, maybe human things like potlatch or risky public sacrifice. i also want the distinctions a theory can't collapse: signal vs cue, honest at equilibrium vs honest as a mechanism, average cost vs marginal or differential cost, and signals that evolved to be costly vs signals that are costly because they're physically constrained. for each requirement say why it's a requirement and whether it's non-negotiable or just a camp preference. then the part i most want: tell me if any subset of these desiderata is jointly unsatisfiable or at least in tension—like honesty, no incentive to cheat, and not being systematically wasteful; or a fully separating equilibrium and sender/receiver optimality. and say which single requirement does the most work in knocking out the sloppy versions of the handicap principle, the ones that just say "it's honest because it's expensive" and leave it there. keep the scorecard of existing theories brief or skip it, the criteria are what i'm after.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Costly Signaling Theory (CST) and the Handicap Principle.
      *   **Goal:** Define the *desiderata* (requirements/criteria) for an adequate theory *before* diving into specific models.
      *   **Scope:** Must cover various cases (mate choice, aposematism, pursuit deterrence, contest settlement, human ritual/potlatch).
      *   **Distinctions:** Must maintain key conceptual distinctions (signal vs. cue, honest at equilibrium vs. mechanism, average vs. marginal cost, evolved cost vs. physical constraint).
      *   **Structure:** For each requirement, explain *what* it is, *why* it's required, and its status (non-negotiable vs. camp preference).
      *   **Critical Analysis:** Identify tensions or joint unsatisfiability among desiderata (e.g., honesty vs. efficiency).
      *   **Key Insight:** Identify the *single* requirement that does the most work in ruling out sloppy "expensive = honest" explanations.
      *   **Constraint:** Keep scorecards of existing theories brief or skip them; focus on criteria.
      *   **Tone:** Rigorous, analytical, "from the spec," avoiding hand-wavy biology.

  2.  **Deconstruct the Core Concepts:**
      *   *Costly Signaling:* Signals are traits/actions that convey information and incur a fitness cost.
      *   *Handicap Principle (Zahavi):* Signals must be costly to be reliable.
      *   *Game Theory (Grafen, Godfray, etc.):* Formalizing the stability of signaling systems (ESS, Separating Equilibrium).
      *   *The "Sloppy" Version:* "It's expensive, therefore it's true." (Needs to be killed).
      *   *The "Rigorous" Version:* "The cost structure makes cheating unprofitable relative to the benefit."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Information Content.* A signal must reduce uncertainty. If it doesn't change the receiver's behavior probabilistically, it's noise.
      *   *Req 2: Cost Structure (The Core).* It's not just "high cost." It's *differential* cost. Low quality types must pay more (marginally) than high quality types.
      *   *Req 3: Stability/Equilibrium.* The system must be evolutionarily stable. Cheaters can't invade.
      *   *Req 4: Signal vs. Cue.* Cues are incidental; signals are evolved for communication. The theory must distinguish adaptation from byproduct.
      *   *Req 5: Receiver Response.* Signaling is a game. Receivers must benefit (on average) from attending. If receivers ignore it, the signal dies.
      *   *Req 6: Efficiency/Waste.* Zahavi emphasized waste. Modern theory asks: is the cost *necessary* waste or just a side effect? This is a tension point.
      *   *Req 7: Scope.* Must apply to biological (stotting) and cultural (potlatch) contexts without category errors.

      *Refining the Distinctions:*
      *   *Honesty:* Is it honest because of the mechanism (cost) or just at equilibrium?
      *   *Cost:* Average vs. Marginal. This is crucial. A signal can be cheap for a high-quality individual but expensive for a low-quality one.
      *   *Constraint:* Is the cost evolved (handicap) or physical (index)?

  4.  **Addressing the Tensions (The "Hard Part"):**
      *   *Honesty vs. Efficiency:* If a signal is perfectly honest, does it *have* to be wasteful? Grafen says yes (costly equilibrium). Some argue for "low-cost pooling" or "index signals."
      *   *Separating Equilibrium vs. Optimality:* A fully separating equilibrium (perfect honesty) often requires high costs that reduce total population fitness. Is a "good" theory one that maximizes honesty or fitness?
      *   *Sender vs. Receiver Interest:* They often conflict. Senders want to exaggerate; receivers want truth. The theory must resolve this conflict.

  5.  **Identifying the "Killer" Requirement:**
      *   What kills "It's honest because it's expensive"?
      *   Answer: **Differential Cost (Marginal Cost Condition).**
      *   Why? Because absolute expense doesn't stop cheating if the benefit outweighs the cost for *everyone*. It only works if the cost is *prohibitive* for the liar but *affordable* for the truth-teller.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the "from the spec" approach.
      *   **Section 1: The Desiderata List.** Grouped logically (Functional, Structural, Evolutionary).
      *   **Section 2: The Conceptual Distinctions.** Explicitly handling the user's list (Cue vs. Signal, etc.).
      *   **Section 3: Tensions and Trade-offs.** The "jointly unsatisfiable" part.
      *   **Section 4: The "Killer" Criterion.** The single most important requirement.
      *   **Conclusion:** Brief wrap-up.

