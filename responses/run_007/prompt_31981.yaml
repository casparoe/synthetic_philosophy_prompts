      *   *Stotting:* Pursuit deterrence. "I am fit, don't chase me." Cost is energy/time.
      *   *Potlatch:* Burning wealth. Cost is economic. Benefit is status/alliance.
      *   *Distinction:* Signal vs. Cue. A limp is a cue of injury. A stag roaring is a signal of strength (could be faked, but cost prevents it).
      *   *Distinction:* Evolved Cost vs. Constraint. An index (voice pitch) is physically constrained. A handicap (tail length) is evolved to be costly.
      *   *Tension:* Zahavi wanted waste. Game theorists want stability. Sometimes stability implies less waste than Zahavi thought.
      *   *The "Sloppy" Killer:* The **Marginal Cost of Signaling** must be inversely related to Quality.

  8.  **Refining the Tone:**
      *   Avoid overly dense math jargon but keep the logic rigorous.
      *   Be decisive on "Non-negotiable" vs. "Preference."
      *   Ensure the "Tensions" section is honest about where the theory struggles.

