answer: |-
  **Exam Question**

  **Question 1:**
  Max Black's symmetrical universe is often taken as a counterexample to the Principle of the Identity of Indiscernibles (PII). A standard defense of PII appeals to the distinct relational properties of the two spheres (e.g., sphere *a* has the property 'being two miles from sphere *b*'). However, critics argue this move is question-begging. Evaluate this charge. In your answer, discuss whether the viability of PII depends on what we require a principle of individuation to achieve (e.g., providing epistemic access vs. ontological grounding).

  *(Suggested time: 45 minutes)*

  ***

  **Model Answer**

  Max Black's thought experiment posits a universe containing only two qualitatively identical iron spheres, separated by a distance of two miles. Since they share all intrinsic properties, Black argues they are numerically distinct yet qualitatively indiscernible, falsifying the Principle of the Identity of Indiscernibles (PII). A common rebuttal invokes relational properties: sphere *a* possesses the property "being two miles from *b*," which *b* lacks (since *b* is "being two miles from *a*"). Thus, they are discernible after all. However, this defense faces a serious charge of circularity, revealing a deeper ambiguity regarding the purpose of individuation.

  The circularity charge asserts that invoking relational properties presupposes the very numerical diversity PII is meant to explain. To ascribe the property "being two miles from *b*" to *a*, one must already be able to identify and refer to *b* as a distinct entity. If the spheres are truly qualitatively identical, there is no non-circular way to label one '*a*' and the other '*b*' prior to establishing their distinctness. As Black himself noted, saying *a* differs from *b* because it stands in a relation to *b* assumes *b* is already distinct from *a*. If PII is intended as an ontological principle—explaining *in virtue of what* two things are numerically distinct—then appealing to relations that presuppose numerical distinctness is viciously circular. It treats the consequence of diversity (the ability to stand in unique relations) as the ground of diversity.

  However, the force of this objection depends on what work we expect PII to do. If PII is viewed as an ontological grounding principle, the relational defense fails. We cannot ground the numerical difference of *a* and *b* on properties that logically require *a* and *b* to already be numerically different. In this context, Black's spheres remain a potent counterexample: without haecceities or substrata, there is nothing to "hold" the relation other than the spheres themselves, which are ex hypothesi identical in quality.

  Conversely, if PII is construed as a logical or epistemic principle concerning reference and description, the relational defense gains traction. One might argue that we do not need to ontologically ground the distinctness prior to description; rather, the distinctness is constituted by the logical possibility of asymmetric descriptions. From a Quinean perspective, to be is to be the value of a bound variable. If we can quantify over two variables ($\exists x \exists y (x \neq y)$) that satisfy different relational predicates, we have satisfied the logical requirements for distinctness. Here, the "circularity" is not vicious but structural: identity and distinctness are primitive logical notions, and PII merely ensures that distinct objects occupy distinct logical spaces via their properties.

  Yet, even this epistemic retreat faces difficulties. If the universe is perfectly symmetrical, an observer within it could not epistemically distinguish the spheres. If PII is meant to guarantee that distinct objects are distinguishable in principle, Black's universe suggests it fails. If it is merely a logical constraint on language, it becomes trivial, telling us nothing about the metaphysics of objects.

  Ultimately, the debate over Black's spheres reveals that PII cannot simultaneously serve as a robust ontological ground for individuation and a non-circular logical principle. The relational property defense saves PII only by weakening its metaphysical ambition. If we require individuation to explain *what makes* an object this one rather than that one (ontological grounding), Black wins: relations presuppose the relata. If we require individuation only to license distinct reference (epistemic/logical), the relational defense holds, but at the cost of making PII a feature of our discourse rather than the world. Therefore, the viability of PII rests not on the ingenuity of property-listing, but on a prior commitment to whether metaphysics should explain the ground of being or the structure of thought.

  ***

  **Marking Scheme**

  **Common Mistake Flag:**
  *   **The "Relational Fix" Fallacy:** A significant number of students will argue that invoking relational properties (e.g., "being 2 miles from *b*") definitively refutes Black and saves PII. Answers that assert this without addressing the circularity charge (i.e., that identifying *b* presupposes distinctness) cannot score above a Lower-Second (50–59), regardless of writing quality.

  **First-Class (70–100)**
  *   **Circularity Analysis:** Explicitly and accurately explains *why* the relational defense is potentially question-begging (i.e., it presupposes the numerical distinctness of the relata to define the properties).
  *   **Function of Individuation:** Clearly distinguishes between PII as an *ontological grounding* principle vs. an *epistemic/logical* principle. Explains how the success of the relational defense hinges on this distinction.
  *   **Critical Engagement:** Does not merely report the debate but evaluates the trade-offs. Acknowledges that saving PII via relations may require abandoning its role as an ontological ground.
  *   **Structure:** Argument is tight, concise, and directly answers the prompt without unnecessary biographical or historical filler.

  **Upper-Second (60–69)**
  *   **Understanding:** Correctly outlines Black's thought experiment and the relational property defense.
  *   **Circularity:** Identifies the circularity charge but may not fully unpack *why* it threatens the ontological status of PII. Might treat it as a minor logical hurdle rather than a metaphysical block.
  *   **Function of Individuation:** Mentions the distinction between epistemic and ontological roles but may not fully integrate this into the conclusion. The connection between the "purpose" of PII and the success of the counter-argument is present but less developed.
  *   **Avoids Common Mistake:** Does not claim relational properties settle the matter effortlessly; acknowledges the controversy.

  **Lower-Second (50–59)**
  *   **Descriptive Focus:** Accurately describes Black's spheres and the PII principle.
  *   **The Common Mistake:** Falls into the trap of arguing that relational properties successfully refute Black without adequately addressing the circularity objection. Treats the relational defense as a straightforward solution.
  *   **Depth:** Fails to engage with the "purpose of individuation" aspect of the question. Treats PII as a monolithic principle without distinguishing between logical and ontological interpretations.
  *   **Conclusion:** Concludes that PII is either clearly true or clearly false based on the presence of relational properties, missing the nuance of the debate.

  **Fail (<50)**
  *   **Misunderstanding:** Confuses PII with the Indiscernibility of Identicals.
  *   **Irrelevance:** Discusses general metaphysics without focusing on Black's specific argument or the relational property objection.
  *   **Regurgitation:** Clearly reproduces standard introductory definitions (SEP style) without engaging with the specific philosophical problem of circularity or the function of individuation.
