          1.  **The Judge is also a Model:** In class, the teacher (usually) understands the math. In PRM, the judge is *another neural net*. If the policy can hack the ORM, it can likely hack the PRM (Goodhart's Law applies to both).
          2.  **Ground Truth Availability:** In math class, there is a canonical "correct working." In open-ended tasks (writing, coding, strategy), there is no single "correct" reasoning path. PRMs require dense labels which are expensive/ambiguous.
          3.  **Causal Connection:** A student showing work *demonstrates* understanding (hopefully). A model generating "reasoning tokens" is just predicting the next token. It can generate plausible-sounding but causally inert reasoning (chain-of-thought hallucination).
