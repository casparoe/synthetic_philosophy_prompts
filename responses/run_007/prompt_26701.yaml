      *   *The Philosophy:* Is learning steps *actually* more robust than learning outcomes? In education, "teaching to the test" happens even with step-grading (memorizing templates). In AI, optimizing for "looks like a good step" might lead to sycophancy or verbose nonsense that *looks* like reasoning (simulacra).
      *   *Key Disanalogy:* Students have internal understanding (maybe); models do not. Students have intrinsic motivation; models don't. Teachers have semantic understanding of steps; PRMs are just another model judging steps.

  3.  **Drafting the Correspondence Table:**
      *   Student $\rightarrow$ Policy Model (the LLM being trained).
