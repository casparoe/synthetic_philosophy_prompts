prompt: |-
  I'm taking a philosophy of ML course and we've been on RLHF, reward hacking, and the push toward process reward models. My lecturer keeps using the same analogy: training an model on only the final answer is like grading a student only on the final answer and never looking at the working, so of course you get test-gaming, and of course the fix is to grade the working. From this he concludes that process-based supervision is pretty much the obvious fix for reward hacking and hallucination, and that outcome-only training is just the cruder version of the same thing.

  I want to be able to push back properly. You're an expert in AI alignment with a decent grip on philosophy of education — think carefully and brainstorm a bit before committing. Audit the analogy for me: give the correspondence table (what's the student, the working, the grade, the teacher?), then separate the disanalogies that matter for his conclusion from the ones that don't, and say what hidden assumptions the education picture imports. Then tell me whether the conclusion survives once the disanalogies are on the table, and if there's a better analogy, what it is.
