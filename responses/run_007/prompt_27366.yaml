answer: |-
  This is a classic move in the free will debate, and your frustration is well-founded. The phrase "could have done otherwise" is the most equivocal sentence in modern philosophy. When your opponent uses it as a trump card, they are usually smuggling in a specific, loaded definition without arguing for it.

  To arm yourself for the next meetup, here is a "menu" of the distinct meanings of that phrase. You can use this to force your opponent to specify which claim they are making. I have categorized them by **Compatibilist Verdict** (Accept/Reject) and **Status** (Trivial/Substantive).

  ### 1. The "Exact Rewind" Reading (The Incompatibilist Standard)
  *   **Definition:** Holding the **exact past** and the **exact laws of nature** fixed up to the moment of choice, is it metaphysically possible for you to choose differently?
  *   **The Claim:** If determinism is true, the answer is "No." Therefore, no free will.
  *   **Compatibilist Verdict:** **REJECT** (as a requirement for free will).
  *   **Status:** **Substantive.**
  *   **Why:** Compatibilists argue this sets the bar too high. We don't need the universe to be indeterminate to have agency; we need our actions to flow from our desires and reasoning. If you accept determinism, this version of "could" is impossible for *everyone*, so it cannot be the definition of free will.
  *   **Counter-Question:** "Why does free will require the ability to break the laws of physics or change the past? Are you saying free will is a form of magic?"

  ### 2. The "Conditional" Reading (Classic Compatibilism)
  *   **Definition:** "I could have done otherwise" means "If I had **chosen** (or wanted) to do otherwise, I **would have**."
  *   **The Claim:** Free will is about the absence of external constraints (chains, coercion, paralysis), not the absence of causal determination.
  *   **Compatibilist Verdict:** **ACCEPT.**
  *   **Status:** **Substantive.**
  *   **Why:** This was the stance of Hume and G.E. Moore. It captures what we care about in moral responsibility: did the action reflect the agent's will? If I chose coffee but *would have* chosen tea if I wanted tea, I have free will in the sense that matters.
  *   **Counter-Question:** "Are you claiming that 'could' means 'would if I wanted to'? Because if so, I can have that even in a determined world."

  ### 3. The "Dispositional/Capacities" Reading (Modern Compatibilism)
  *   **Definition:** Does the agent possess the **internal machinery** to produce different outputs given different inputs?
  *   **The Claim:** A thermostat doesn't have free will because it has one setting. A human has free will because their decision-making architecture is robust and responsive to reasons.
  *   **Compatibilist Verdict:** **ACCEPT.**
  *   **Status:** **Substantive.**
  *   **Why:** This shifts the focus from the *universe's* history to the *agent's* capabilities. Even if the past determined you to choose X, you still possess the *capacity* for Y, which is why we hold you responsible.
  *   **Counter-Question:** "Isn't free will about having a complex decision-making system that responds to reasons, rather than having a metaphysical escape hatch from causality?"

  ### 4. The "Closest Possible World" Reading (Lewisian)
  *   **Definition:** In the **closest possible world** where you do otherwise, do you do otherwise? (This usually implies a slightly different past or a tiny "miracle" divergence).
  *   **The Claim:** Counterfactuals are true if they hold in nearby worlds, even if they aren't true in the *actual* world with its fixed past.
  *   **Compatibilist Verdict:** **ACCEPT.**
  *   **Status:** **Technical/Substantive.**
  *   **Why:** This is how we evaluate almost all "could" statements in daily life. "I could have caught that train" is true even if, given the exact state of the universe, I was destined to miss it. It means there is a very similar world where I caught it.
  *   **Counter-Question:** "When you say 'I could have taken the left turn,' do you mean 'In a nearly identical scenario, I take the left turn,' or do you mean 'In this exact scenario, I magically branch off'?"

  ### 5. The "Epistemic" Reading
  *   **Definition:** For all we **know**, could the agent have done otherwise?
  *   **The Claim:** Since we aren't omniscient, we must treat agents as if they could have done otherwise.
  *   **Compatibilist Verdict:** **ACCEPT** (but finds it insufficient).
  *   **Status:** **TRIVIAL.**
  *   **Why:** Everyone accepts this except an omniscient god. It doesn't solve the metaphysical problem, but it explains why we *practice* blame and praise.
  *   **Counter-Question:** "Are you just saying we don't know what was determined? That's an argument about ignorance, not free will."

  ---

  ### The "Nuclear Option": Frankfurt Cases
  If your opponent insists that **Option 1 (Exact Rewind)** is the *only* valid definition, you can deploy the **Frankfurt Case** argument (named after Harry Frankfurt). This attacks the premise that "could have done otherwise" is required for responsibility *at all*.

  *   **The Scenario:** Imagine a neuroscientist (Black) is monitoring your brain. If you are about to choose A, Black does nothing. If you are about to choose B, Black intervenes and forces you to choose A. As it happens, you choose A on your own. Black never intervenes.
  *   **The Result:** You **could not have done otherwise** (because Black would have stopped you). Yet, you seem morally responsible because Black *didn't* actually make you do it; you did it yourself.
  *   **The Point:** This suggests that **Alternate Possibilities (PAP)** are not necessary for moral responsibility.
  *   **Compatibilist Verdict:** **ACCEPT** (This leads to *Semicompatibilism*).
  *   **Status:** **Substantive.**

  ---

  ### Strategy for the Meetup

  When your opponent says, "You can't have free will if you couldn't have done otherwise," do not argue immediately. Instead, run this diagnostic:

  1.  **Isolate the Modal:** "When you say 'could,' are you talking about **conditional ability** (if I wanted to) or **metaphysical ability** (same past, same laws)?"
  2.  **If they say Metaphysical (Option 1):** Ask, "Why is that the definition? That definition makes free will incompatible with physics by stipulation. Are you defining free will as 'the ability to break causality'?"
  3.  **If they insist PAP is required:** Bring up **Frankfurt Cases**. "If a person chooses to murder on their own, but a failsafe existed that would have forced them to murder if they hesitated, they couldn't have done otherwise. Are they not responsible?"
  4.  **The "So What?" Move:** "Even if I grant you that I couldn't have done otherwise in the 'Exact Rewind' sense, why does that negate my capacity to reason, respond to incentives, and act on my desires? Which of those did determinism remove?"

  **Summary for your notes:**
  *   **Trivial:** Epistemic possibility (Everyone accepts).
  *   **Substantive & Accepted:** Conditional ability, Dispositional capacity, Closest Possible World.
  *   **Substantive & Rejected:** Exact Rewind (Same Past/Laws).
  *   **Game Changer:** Frankfurt Cases (You don't need "could have" to be responsible).

  Your opponent is likely treating the "Exact Rewind" reading as a self-evident truth rather than a contentious philosophical stipulation. Your job is to expose that stipulation. Good luck.
