prompt: |-
  i'm teaching a political philosophy unit and want to use shakespeare's julius caesar to get at aquinas's views on tyrannicide. the thing is, aquinas seems to have this careful position where overthrowing a tyrant is sometimes justified, but he puts all these conditions on it — like it should be done by public authority, not a private citizen, and you should exhaust legal remedies first, and the remedy shouldn't be worse than the disease. meanwhile the play is basically about a group of private citizens (well, senators, but they're not the public authority in aquinas's sense) who decide caesar has to go and do it themselves.

  what i want is a reading of the play through aquinas's lens that takes both seriously. where does brutus line up with aquinas's conditions and where does he violate them? does the play's aftermath — the civil war, the chaos — function as a kind of dramatic argument for aquinas's caution about the remedy being worse? and here's the thing i'm really stuck on: the play doesnt give us a clear verdict on whether the assassination was right. it's famously ambiguous. does that ambiguity itself make a philosophical point that aquinas's neat categories miss? like, maybe the real problem is that you can never know in advance whether the conditions are met, and the play dramatizes that epistemic problem rather than the moral one?

  i'd love something i can use with undergrads who've read the play and the relevant aquinas passages but haven't put them together yet.
