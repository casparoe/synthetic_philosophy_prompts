  It must assert the ceiling is not more,
  Nor less, than where the shadow now abides.
  For every change, a legion must attest
  To all the things that did not change at all.
  The axioms bloom like weeds within the test,
  Until the logic hits a static wall.

  But how to choose what matters to the mind?
  The rule for choosing must be chosen first.
  No neutral lens for leaving things behind,
  Unless the thirst for relevance is cursed.
  You act, and cannot prove the ignored part,
  Was not the key that ruled the whole from start.

  ***

