          *   *Tier:* A. It makes specific predictions about timing and diet that hold up well, even if mechanism is hard to isolate.

      *   **Grandmother Hypothesis:**
          *   *Claim:* Menopause allows investment in grandchildren.
          *   *Strengths:* Demographic data from hunter-gatherers (Hadza), modeling supports it.
