  Here is a sorting of those claims based on their empirical robustness and resistance to the "just-so story" critique.

  **S Tier**
  *   **The Cinderella effect:** This relies on massive, cross-cultural homicide and abuse datasets that show a stark statistical reality difficult to explain away by socioeconomic confounds alone.

  **A Tier**
  *   **Pregnancy sickness as adaptation:** This generates specific, risky predictions about which foods become aversive and exactly when during gestation, which aligns closely with embryonic vulnerability windows.
  *   **The grandmother hypothesis:** Demographic modeling and hunter-gatherer data consistently show that post-reproductive women significantly boost grandchild survival, supporting the investment trade-off.
  *   **The cheater-detection claim:** While the existence of a specific neural module is debated, the core prediction that social framing drastically improves logical performance has been robustly replicated in experiments.

  **B Tier**
  *   **The jealousy sex-difference claim:** The effect often disappears or shrinks significantly when researchers move from forced-choice surveys to more nuanced physiological or continuous measures.

  **C Tier**
  *   **The waist-to-hip ratio claim:** Initial claims of a universal preference failed to hold up across diverse cultures and body mass indices, making it look more like a Western aesthetic projected as biology.
