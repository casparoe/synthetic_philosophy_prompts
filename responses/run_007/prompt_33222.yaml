          *   *Tier:* B or C. Let's go B because there is *some* signal, but the "universal 0.7" claim is largely discredited/nuanced now. Actually, given the "just-so" critique, this is a prime example of one. Let's lean towards C or low B. Let's settle on C because the universality claim failed.

      *   **Jealousy Sex-Difference:**
          *   *Claim:* Men = sexual, Women = emotional infidelity.
