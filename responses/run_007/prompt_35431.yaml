answer: |-
  ### 1. Agreed Claims

  1.  **Phenomenological Reality:** Self-deception is a genuine, observable phenomenon where agents maintain beliefs that appear contradicted by evidence they possess, driven by motivational states like fear or desire. Both camps agree these cases are not merely rhetorical flourishes but reflect distinct psychological states requiring explanation. The phenomenon is robust across cultures and contexts, manifesting in relationships, politics, and self-assessment.
  2.  **Rejection of Simple Lying:** The static model of self-deception—where an agent consciously believes $p$ and simultaneously consciously asserts not-$p$ to themselves—is psychologically impossible and rejected by both camps as a literal description. Neither side defends the notion of a homogeneous self performing a simultaneous contradictory act. The puzzle arises only if one assumes belief is all-or-nothing and consciousness is unitary.
  3.  **Motivational Primacy:** Motivation is ineliminable; without the influence of desire or aversion on cognitive processing, the resulting false belief constitutes mere error or ignorance, not self-deception. The causal link between what the agent wants and what the agent believes is the defining feature of the phenomenon. This distinguishes it from cold cognitive biases unrelated to emotional needs.
  4.  **Distinction from Other-Deception:** Unlike deceiving another person, self-deception does not require overt communicative intent or a conscious plan to mislead, though it often results in similar epistemic outcomes. The agent is not typically aware of misleading themselves at the moment of belief formation. There is no explicit contract of falsehood between agent and self.
  5.  **Responsibility and Stability:** An adequate account must explain why the agent bears some responsibility for the belief and why the belief remains stable despite exposure to counter-evidence. The process must be robust enough to withstand scrutiny yet opaque enough to avoid conscious detection. This explains why we blame people for self-deception but not for simple mistakes.
  6.  **Paradox Avoidance:** Both camps agree the logical paradox of simultaneously knowing and not knowing is avoided either by temporalizing the belief formation or by acknowledging functional subdivisions within the cognitive architecture. The appearance of impossibility stems from an oversimplified model of belief attribution, not the phenomenon itself. Both seek a naturalistic explanation compatible with cognitive science.

  ### 2. Disagreements

  | Point at Issue | Divided-Mind Camp | Biased-Processing Camp | Joint Sign-off |
  | :--- | :--- | :--- | :--- |
  | **Intention** | Self-deception involves a subpersonal intention to avoid unwelcome truths; it is something the mind *does*. | Self-deception involves no intention, even subpersonally; it is something that *happens* to the mind via bias. | Both agree standard conscious intention is absent; dispute concerns whether goal-directed mechanisms constitute intention. |
  | **Simultaneous Belief** | The agent simultaneously holds the true belief (in one subsystem) and the false belief (in another). | The agent never holds the true belief consciously; the false belief replaces the true one via biased weighting. | Both agree the conscious mind holds only the false belief; dispute concerns the status of unconscious information. |
  | **Paradox Status** | The paradox is genuine but solved by subdividing the subject into distinct epistemic agents. | The paradox is an artifact of assuming the mind is unitary; it dissolves upon correcting the model of belief. | Both agree the paradox vanishes under their respective models; dispute concerns which model is ontologically correct. |
  | **Mind Structure** | The mind is architecturally partitioned into modules capable of information hiding and independent aims. | The mind is functionally unified; partitions are metaphorical descriptions of competing cognitive pressures. | Both agree the mind has complex structure; dispute concerns whether partitions are rigid enough to sustain separate beliefs. |
  | **Unity of Phenomenon** | Self-deception is a specific kind of strategic process distinct from ordinary bias. | Self-deception is merely a label for motivationally biased processing found on a continuum with ordinary error. | Both agree motivation biases belief; dispute concerns whether self-deception is a distinct natural kind or a gradient. |

  ### 3. Cruxes

  1.  **Architectural Partitioning:** Is the mind modular enough to hide information from itself structurally, or is information flow merely probabilistic? If settled against Divided-Mind, they must abandon the claim that subsystems hold contradictory beliefs simultaneously. If settled against Biased-Processing, they must admit that some cognitive states are functionally isolated from conscious access.
  2.  **Status of Unconscious Information:** Does unconsciously held truth count as "knowing" for the purposes of the paradox? If settled against Divided-Mind, they must concede that self-deception does not involve knowing the truth in any robust sense. If settled against Biased-Processing, they must accept that agents "know" truths they cannot articulate or act upon consciously.
  3.  **Scope of Intentionality:** Can subpersonal processes be described as intentional acts? If settled against Divided-Mind, they must describe self-deception as a non-agential process. If settled against Biased-Processing, they must expand the definition of intention to include non-conscious goal pursuit.

  ### 4. Tests and Predictions

  1.  **The Strong Evidence Case:** A spouse finds definitive proof of infidelity (e.g., videos) but maintains belief in fidelity.
      *   **Divided-Mind Prediction:** We will observe behavioral leakage (e.g., anxiety, avoidance) indicating the unconscious subsystem knows the truth.
      *   **Biased-Processing Prediction:** We will observe reinterpretation strategies (e.g., claiming the video is fake) without behavioral leakage indicating hidden knowledge.
      *   **Differentiation:** If leakage is absent despite strong evidence, Biased-Processing is favored. If leakage persists despite sincere denial, Divided-Mind is favored.
  2.  **The Unwelcome Belief Case:** A defensive pessimist motivates themselves to believe they will fail to reduce anxiety.
      *   **Divided-Mind Prediction:** This requires a strategic split where one part knows success is likely but hides it to motivate the other.
      *   **Biased-Processing Prediction:** Motivation biases evidence weighting toward negative outcomes without needing strategic hiding of positive evidence.
      *   **Differentiation:** If the agent shows signs of knowing they will succeed while claiming failure, Divided-Mind wins. If they genuinely expect failure, Biased-Processing wins.
  3.  **Cognitive Load Test:** Agents perform self-deceptive tasks under high cognitive load.
      *   **Divided-Mind Prediction:** Load disrupts the active suppression mechanism, causing the truth to surface.
      *   **Biased-Processing Prediction:** Load exacerbates bias, making the false belief stronger as corrective reasoning fails.
      *   **Differentiation:** Surface of truth favors Divided-Mind; strengthening of false belief favors Biased-Processing.

  ### 5. Verbal or Substantive

   Portions of this dispute are verbal, specifically regarding the definition of "intention." If "intention" requires consciousness, Biased-Processing wins by definition; if it includes goal-directed subpersonal processes, Divided-Mind wins. However, the dispute over architectural partitioning is substantive. Even with a fixed vocabulary, the camps disagree on whether the mind contains opaque modules capable of holding independent beliefs. This ontological disagreement regarding cognitive structure would survive any terminological stipulation.
