      *   *Inner Speech View (Vygotsky/Privatized Speech):* Thought *is* internalized speech. Language constitutes thought. This *is* a competing view (Whorfian/Sapir-Whorf influences, or Vygotskian internalization).
      *   *Reconciliation:* They operate at different levels. LOTH is about the *format* of representation in the cognitive architecture. Inner speech is about the *phenomenology* or the *vehicle* of conscious access.
