      *   *Alternative/Complementary Views:* Peter Carruthers (dispositionalism), Elisabeth Camp (metaphorical thinking), but LOTH is the direct hit for "underlying representational system."

  4.  **Address Question 2: Relation to Inner Speech:**
      *   Are they competing? Not necessarily.
