prompt: |-
  I've been running a small philosophy discussion group for a couple of years — just people who read on their own, no one with formal training, meeting in my living room. We've done some Plato, some Descartes, a bit of Nagel, and now I want to spend a session on Zhuangzi's butterfly dream. I've read the passage many times and I think I understand what makes it different from the standard skeptical arguments the group has already seen, but I'm less confident about how to structure the discussion so that difference actually comes through.

  I'm not asking you to explain the butterfly dream to me. What I need is a plan for how to lead the group to the insight. Here's what I'm after.

  First, what idea needs to be in place before the passage even makes sense as a philosophical challenge? The group has encountered Descartes' dream argument, but I suspect that's not quite the right foundation, and I want to know what is — and what depends on it.

  Second, what's the one example or scenario I should use to carry the whole discussion? If the obvious answer is to draw a comparison with Descartes' evil demon or the Brain in a Vat, tell me why that might actually be the wrong move for getting at what is distinctive about Zhuangzi, and what should replace it.

  Third, what misconceptions will this group predictably form? I'm not worried about historical misunderstandings — I'm worried about philosophical ones. I can already hear someone saying "but you can tell you're awake because you can pinch yourself" or "so the point is that nothing is real." I need to know the three or four most likely misreadings and, crucially, at exactly what point in the sequence I should head each one off before it hardens into a position someone wants to defend.

  Fourth, what should I leave out? This is one session, maybe an hour and a half. What's the tempting digression that I should openly name and set aside?

  Finally, what's one question I can ask near the end that would tell me whether they've grasped the distinctively Zhuangzian move — not just the generic skeptical worry that we might be dreaming, but the specific thing the butterfly dream does that Descartes does not?
