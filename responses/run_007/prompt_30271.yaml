  #### 1. The Normative Authority of Planning ($Q_1$)
  *   **Question:** Does the *ex ante* perspective (before the drive begins) have normative sovereignty over the *ex interim* perspective (at the exit)? In other words, is rationality defined by the best achievable plan given the constraints, or by the best local calculation at the moment of choice?
  *   **My Probability ($P_1$):** **0.90**
  *   **Weight ($w_1$):** **0.50**
  *   **Rationale:** This is the foundational meta-ethical question. If rationality is about maximizing expected utility across the whole timeline (which standard decision theory assumes), the *ex ante* calculation is sovereign. Deviating at the node constitutes a dynamic inconsistency, which is generally viewed as a defect in rationality unless new information is received.

  #### 2. The Identity of Decision Nodes ($Q_2$)
  *   **Question:** Does the agent recognize that their mental state at Exit 1 is identical to their mental state at Exit 2, thereby logically constraining them to the same action probability ($p$) at both?
  *   **My Probability ($P_2$):** **0.95**
  *   **Weight ($w_2$):** **0.20**
  *   **Rationale:** This is almost tautological given the problem setup ("absent-minded"). If the agent cannot distinguish the nodes, they cannot condition their strategy on the node index. They must choose a single policy $p$. Most disagreements here are semantic rather than substantive.

  #### 3. The Admissibility of Self-Locating Updates ($Q_3$)
  *   **Question:** Does the realization "I am currently at an exit" constitute new evidence that licenses updating the probability of being at Exit 1 vs. Exit 2 in a way that changes the optimal action?
