answer: |-
  This is a classic case of a philosophical "deep cut" being weaponized as a party trick. Your friend is using a 2,300-year-old logical paradox to win arguments about sandwich taxonomy, which is both impressive and deeply annoying.

  The phrase comes from **Gongsun Long**, a philosopher of the **School of Names (Ming Jia)** in ancient China. His text is called the *White Horse Dialogue*. It is not a biological claim; it is a semantic and metaphysical one.

  Here is the breakdown you can bring to your friend. It separates the possible meanings of "A white horse is not a horse" from the boring to the radical, evaluates their truth, and then analyzes whether his "trump card" actually works.

  ### Part 1: The Spectrum of Claims
  *What does "A white horse is not a horse" actually mean?*

  **1. The Literal Biological Claim**
  *   **The Claim:** An animal with white fur and horse biology is not a member of the species *Equus ferus caballus*.
  *   **Verdict:** **False.**
  *   **Why:** Biologically, a white horse is a subset of horses. If this were true, you could not ride a white horse to get to a destination that requires a horse.
  *   **Use for your friend:** He cannot be using this one unless he denies reality.

  **2. The Linguistic Synonymy Claim**
  *   **The Claim:** The *phrase* "white horse" does not mean the exact same thing as the *phrase* "horse."
  *   **Verdict:** **Trivially True.**
  *   **Why:** "White horse" has more information than "horse." They are not synonyms. If I say "I want a horse," and you bring a white one, you have satisfied the request. If I say "I want a white horse," and you bring a brown one, you have not. Because the conditions of satisfaction differ, the terms are not identical.
  *   **Use for your friend:** This is boring. It just means "words have different definitions." It doesn't prove a veggie burger isn't a burger; it just proves the words are different.

  **3. The Set Theory Claim**
  *   **The Claim:** The *set* of white horses is not identical to the *set* of all horses.
  *   **Verdict:** **True (but misleading).**
  *   **Why:** In logic, Set A (White Horses) is a *subset* of Set B (Horses). Set A is not *equal* to Set B. However, every member of A is still a member of B.
  *   **Use for your friend:** He might be hiding behind this. He is confusing "is not identical to" with "is not a member of." A subset is not the whole set, but it is still *part* of the set.

  **4. The "Compound Concept" Claim (Gongsun Long's Actual Argument)**
  *   **The Claim:** The concept of "White" + the concept of "Horse" creates a new, specific entity that is distinct from the universal concept of "Horse."
  *   **Verdict:** **Interesting and Philosophically Defensible.**
  *   **Why:** Gongsun Long argued that "Horse" refers to the *shape/form*, while "White" refers to the *color*. When you combine them, you are referring to a specific composite reality. The universal "Horseness" exists without color specification. The specific "White-Horseness" requires color. Therefore, the *identity* of the specific thing is not the *identity* of the universal thing.
  *   **Use for your friend:** This is the only version that has intellectual weight. It argues that adding a modifier changes the *essence* of the thing being named.

  **5. The Radical Nominalist Claim**
  *   **The Claim:** Categories don't really exist; only specific individuals do. Therefore, calling a white horse a "horse" is a lazy approximation that obscures the truth.
  *   **Verdict:** **Radical/Debatable.**
  *   **Why:** This suggests language is always lying to us because it groups unique things into buckets.
  *   **Use for your friend:** If he uses this, he can't call *anything* anything. He can't call a veggie burger a "veggie burger" because that's also a category. He undermines his own ability to speak.

  ---

  ### Part 2: Does this support your friend's "Trump Card"?

  Your friend is using the sentence to support a general rule: **"If you add an adjective (X) to a noun (Y), the result (XY) is not a Y."**
  *(e.g., White + Horse ≠ Horse; therefore Veggie + Burger ≠ Burger)*

  Here is why his move fails, based on the claims above.

  **1. He is confusing "Is" (Identity) with "Is" (Membership)**
  In English, "is" does two jobs.
  *   **Identity:** "Clark Kent *is* Superman." (They are the same thing).
  *   **Membership:** "A poodle *is* a dog." (It is a member of the dog group).
  Gongsun Long is arguing about **Identity** (The concept "White Horse" is not identical to the concept "Horse").
  Your friend is arguing about **Membership** (A veggie burger is not a *member* of the burger category).
  *   **The Counter:** You can tell him: *"Gongsun Long is arguing that the concepts aren't identical. I am arguing that a veggie burger is a member of the burger category. You are answering a membership question with an identity argument."*

  **2. The "Yellow Horse" Test**
  In the original text, Gongsun Long admits that if you ask for a "horse," a yellow or black horse will do. If you ask for a "white horse," a yellow or black one will not.
  *   **The Counter:** Ask your friend: *"If I go to a restaurant and order a 'burger,' and they bring me a 'veggie burger,' have they fulfilled the order?"*
      *   If he says **Yes**: Then a veggie burger *is* a burger in practice, and his argument fails.
      *   If he says **No**: Then he is arguing about social convention (menu labels), not metaphysics. Gongsun Long wasn't arguing about restaurant menus; he was arguing about the nature of reference.

  **3. The Modifier Problem**
  Gongsun Long's argument works because "White" describes a physical property of the horse that limits the reference.
  *   **The Counter:** Does "Veggie" describe a property of a burger, or does it change the fundamental definition?
      *   A "white horse" is still a horse biologically.
      *   A "toy car" is *not* a car (it doesn't drive).
      *   A "hot dog" *is* a sandwich (by structural definition).
      *   A "veggie burger" is a burger (by structural/culinary definition).
      *   **The Point:** You cannot universally apply "White Horse" logic to every adjective-noun pair. Sometimes "X Y" is not a "Y" (Toy Car), and sometimes "X Y" is a "Y" (White Horse, Veggie Burger). You have to argue the specific case, not use a universal rule.

  ### Part 3: Your Cheat Sheet for the Argument

  Next time he plays the "White Horse" card, hand him this list of three questions. He will not be able to answer them without admitting he is misusing the philosophy.

  1.  **"Are you talking about words or things?"**
      *   If he says **Words**: Then he is right that "Veggie Burger" isn't the same word as "Burger." But that doesn't mean the food isn't a burger. (Claim #2 above).
      *   If he says **Things**: Then he is claiming a veggie burger biologically/structurally isn't a burger. "White Horse" doesn't help him there, because a white horse *is* biologically a horse. (Claim #1 above).

  2.  **"Does your rule apply to 'Toy Car'?"**
      *   A "Toy Car" is not a "Car." A "White Horse" *is* a "Horse."
      *   Tell him: *"You need to explain why 'Veggie' works like 'Toy' but not like 'White.' You can't just quote Gongsun Long; you have to prove the modifier changes the category."*

  3.  **"Are you willing to accept the consequence?"**
      *   If "White Horse is not Horse" means "Modified Noun is not Noun," then:
      *   "A sliced loaf is not bread."
      *   "A grilled cheese is not a sandwich."
      *   "A female actor is not an actor."
      *   Tell him: *"If you win this argument, you break language. Are you prepared to stop using compound words entirely?"*

  ### The Bottom Line
  Your friend is using a **metaphysical puzzle about identity** to win a **sociological argument about classification.**

  Gongsun Long wanted to show that language is imprecise. Your friend wants to show that his definition of "burger" is superior. The "White Horse" paradox actually supports *your* side more than his: it highlights that we need to be precise about what we mean by "is."

  If he says "A white horse is not a horse," reply: **"Correct. The concept is not identical. But the animal is still a member of the species. Now, is a veggie burger a member of the burger category, or are we just arguing about the menu?"**
