      *Outcome:* **Hand to Vote.** The protocol refuses to solve this. It identifies the conflict as ethical, not functional. The council must vote based on conscience, not procedure.

      **2. Abolishing the Fellowship Publication Requirement**
      *Step 1:* Function is ensuring quality and supporting the society journal's impact factor.
      *Step 2:* Proposer argues it restricts diversity of thought. Evidence provided is anecdotal.
      *Step 3:* Replacement is open submission criteria.
      *Step 4:* No. This is operational.
      *Step 5:* Burden Check. Proposer failed Step 2 (no measurable harm proven) and Step 1 (underestimated journal support function).
      *Outcome:* **Recommendation Against Change.**
      *Council Reaction:* Likely negative. The council feels the rule is elitist and wants to modernize. The protocol protects the status quo because the reformer did not quantify the harm of exclusion versus the benefit of journal support.

      **3. Ending the Printed Proceedings**
      *Step 1:* Function was archival permanence. Current function is negligible; digital archive exists.
      *Step 2:* Harm is financial cost ($15k/year) and environmental waste.
      *Step 3:* Replacement is digital-only access.
      *Step 4:* No. Operational.
      *Step 5:* Burden Check. Steps 1–3 satisfied. No hidden function identified.
      *Outcome:* **Recommendation for Change.** Abolish the print volume.

      ***

      **Limitations and Misfires**

      This procedure is not truth; it is a heuristic. Users must recognize where judgment is dressed as checklist logic.

      **1. Judgment Calls Disguised as Facts**
      Step 1 (Function) is the weakest link. Determining the "true" function of a ritual is subjective. A member might claim the Publication Requirement ensures quality; another might claim it ensures cronyism. The procedure treats the proposer's failure to prove harm as a win for the status quo, but this biases heavily toward inertia. In the Publication Requirement case, the protocol assumes the journal *needs* forced submissions. If that assumption is false, the procedure protects a harmful inefficiency.

      **2. Where the Procedure Misfires**
      The protocol misfires on moral harms that are hard to quantify. In the Medal case, the procedure correctly hands off the vote, but in cases like the Publication Requirement, it treats "exclusion" as a harm that must be measured financially or numerically. If the harm is cultural stagnation, Step 2 filters it out as insufficient evidence. This is a Burkean bias: it assumes existing structures are beneficial until proven otherwise. Sometimes, existing structures are merely surviving fossils.

      **3. The "Unlikeable" Outcome**
      In Case 2, the procedure recommends keeping the publication rule. The council, wishing to appear inclusive and modern, will dislike this. They may feel the burden of proof should shift to the defenders of exclusion. The protocol explicitly rejects this shift. It forces the council to admit they are making a values choice (inclusivity vs. tradition) rather than a factual one, or else accept the inertia.

      **4. Time Constraint**
      For a two-hour meeting, Step 1 research often requires deferral. If the council rushes Step 1, the procedure becomes a rubber stamp for whoever speaks loudest about "function."

      **Conclusion**
      Use the Fence Protocol to slow down rash changes, not to prevent necessary ones. When it returns a result the council dislikes, recognize that the disagreement is likely about values (Step 4) or the definition of harm (Step 2), not the logic of the checklist.

