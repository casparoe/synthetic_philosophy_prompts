  *Fail:* Proposer states "tradition" or "we don't know."
  *Action:* If Fail, **Deferral**. Research required. Do not vote.

  **Step 2: Harm Demonstration**
  *Question:* What specific, measurable harm does the current practice cause today?
  *Pass:* Proposer provides evidence of active damage (financial loss, exclusion, reputational risk).
  *Fail:* Proposer argues "it is outdated" or "it seems unnecessary."
  *Action:* If Fail, **Recommendation Against Change**. Status quo prevails.

  **Step 3: Replacement Viability**
  *Question:* What mechanism replaces the function identified in Step 1?
  *Pass:* A concrete alternative exists that fulfills the function without the harm in Step 2.
  *Fail:* No replacement or vague promise of "modernization."
  *Action:* If Fail, **Recommendation Against Change**.

  **Step 4: The Value Filter**
  *Question:* Is the primary function symbolic or moral rather than functional?
  *Yes:* **Hand to Vote**. The procedure stops. This is a values question, not a factual one.
  *No:* Proceed to Step 5.

  **Step 5: Final Burden Check**
  *Question:* Have Steps 1–3 been satisfied conclusively?
  *Yes:* **Recommendation for Change**.
  *No:* **Recommendation Against Change**.

  ***

  **Application to Current Proposals**

  **1. Renaming the Founders' Medal**
  *Step 1:* Function is symbolic recognition of contribution.
  *Step 2:* Harm is reputational damage due to founder's eugenic views.
  *Step 3:* Replacement is a new name retaining the prize's prestige.
  *Step 4:* **Yes.** The core issue is moral symbolism, not operational utility.
  *Outcome:* **Hand to Vote.** The protocol refuses to solve this. It identifies the conflict as ethical, not functional. The council must vote based on conscience, not procedure.

  **2. Abolishing the Fellowship Publication Requirement**
  *Step 1:* Function is ensuring quality and supporting the society journal's impact factor.
  *Step 2:* Proposer argues it restricts diversity of thought. Evidence provided is anecdotal.
  *Step 3:* Replacement is open submission criteria.
  *Step 4:* No. This is operational.
  *Step 5:* Burden Check. Proposer failed Step 2 (no measurable harm proven) and Step 1 (underestimated journal support function).
  *Outcome:* **Recommendation Against Change.**
  *Council Reaction:* Likely negative. The council feels the rule is elitist and wants to modernize. The protocol protects the status quo because the reformer did not quantify the harm of exclusion versus the benefit of journal support.

  **3. Ending the Printed Proceedings**
  *Step 1:* Function was archival permanence. Current function is negligible; digital archive exists.
  *Step 2:* Harm is financial cost ($15k/year) and environmental waste.
