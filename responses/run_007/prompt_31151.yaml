      **The Fence Protocol: A Decision Procedure for Council**

      **Purpose:** To prevent unintended consequences when altering established practices. The burden of proof lies entirely with the proposer of change.

      **Step 1: Function Identification**
      *Question:* What specific function did this practice serve when created, and what function does it serve now?
      *Pass:* Proposer articulates a clear, current utility (e.g., revenue, quality control, cohesion).
      *Fail:* Proposer states "tradition" or "we don't know."
      *Action:* If Fail, **Deferral**. Research required. Do not vote.

      **Step 2: Harm Demonstration**
      *Question:* What specific, measurable harm does the current practice cause today?
      *Pass:* Proposer provides evidence of active damage (financial loss, exclusion, reputational risk).
      *Fail:* Proposer argues "it is outdated" or "it seems unnecessary."
      *Action:* If Fail, **Recommendation Against Change**. Status quo prevails.

      **Step 3: Replacement Viability**
      *Question:* What mechanism replaces the function identified in Step 1?
      *Pass:* A concrete alternative exists that fulfills the function without the harm in Step 2.
      *Fail:* No replacement or vague promise of "modernization."
      *Action:* If Fail, **Recommendation Against Change**.

      **Step 4: The Value Filter**
      *Question:* Is the primary function symbolic or moral rather than functional?
      *Yes:* **Hand to Vote**. The procedure stops. This is a values question, not a factual one.
      *No:* Proceed to Step 5.

      **Step 5: Final Burden Check**
      *Question:* Have Steps 1–3 been satisfied conclusively?
      *Yes:* **Recommendation for Change**.
      *No:* **Recommendation Against Change**.

