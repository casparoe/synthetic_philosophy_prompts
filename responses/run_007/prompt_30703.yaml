      *   *Apparent Tensions:* (7) fits well with (2) and (3). (4) fits with (2) if time-horizons differ.
      *   *Single Best Revision:* Modifying (1). If (1) is softened to "SI is the ideal for *truth-seeking* but not necessarily *safe action*," then (6) becomes a necessary safety patch rather than a contradiction. This also helps resolve (3) vs (5) (epistemic vs instrumental).

