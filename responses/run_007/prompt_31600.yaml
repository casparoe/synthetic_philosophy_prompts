      *   If $A$ is past, is the proposition $Ch(A)=x$ admissible?
      *   If $A$ is past, $Ch(A)$ is 0 or 1. So $Ch(A)=0.3$ is false.
      *   The protagonist says "I know the chance is 0 or 1". So he is conditioning on $Ch(A) \in \{0,1\}$.
      *   PP doesn't tell you what to do if you condition on a disjunction of chance values. It tells you what to do if you condition on a *specific* value.
      *   So the error is indeed treating PP as a constraint on disjunctions of chance hypotheses.
