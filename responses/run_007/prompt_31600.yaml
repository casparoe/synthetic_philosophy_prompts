      *   (3) Claim about Knowledge of Chances: We know $Ch(A) \in \{0, 1\}$ for past events.
      *   (4) Inference: Therefore, $Cr(A)$ should be 0 or 1.
      *   (5) Observation: We aren't certain about past contingent events (e.g., rain on birth day).
