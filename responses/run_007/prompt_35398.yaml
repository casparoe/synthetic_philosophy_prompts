  # The Liberalism-Communitarianism Decision Tree

  This handout is designed to help you locate your own intuitions within the logical space of the debate. Do not worry about the names of the philosophers yet. Read each scenario and choose the claim that best matches your judgment. Follow the arrows to see which philosophical position aligns with your answers.

  ## Part 1: The Tree of Questions

  ### **Branch 1: The Apostate's Right (Individual vs. Community)**
  *Imagine a young adult born into a tight-knit religious community. They wish to leave the faith, stop attending services, and pursue a secular career. The community leaders argue that allowing this will erode their shared way of life and hurt the remaining members.*

  *   **A.** The individual's right to leave and choose their own path must be protected, even if it harms the community's survival. **(Go to Branch 2)**
  *   **B.** The community's interest in preserving its way of life can sometimes limit the individual's choices; leaving is not just a right but a potential betrayal of who they are. **(Go to Branch 5)**

  ---

  ### **Branch 2: The Opera Tax (State Neutrality)**
  *Assuming you chose A (Individual Rights are Paramount): The government proposes raising taxes to fund opera houses and art museums, arguing these make citizens' lives "better." Some citizens prefer to spend that money on video games or church.*

  *   **A.** The government must remain neutral. It is unjust to tax citizens to promote one vision of the "good life" over another. **(Go to Branch 3)**
  *   **B.** The government should promote valuable lifestyles. Neutrality is impossible or undesirable; the state should encourage autonomy and well-being. **(Go to Branch 4)**

  ---

  ### **Branch 3: The Possibility of Neutrality (The "Disguised Doctrine" Test)**
  *Assuming you chose 2A (Government Must Be Neutral): Critics argue that "neutrality" secretly favors individualistic, secular lifestyles over communal, religious ones.*

  *   **A.** Neutrality is possible. We can design political rules that are "freestanding" and do not favor any specific comprehensive doctrine. **(Leaf 1)**
  *   **B.** Neutrality is impossible. Any framework will inevitably favor some ways of life over others. **(Leaf 7: Unoccupied/Incoherent)**

  ---

  ### **Branch 4: The Language Law (Universal Autonomy vs. Cultural Context)**
  *Assuming you chose 2B (Government Should Promote Good): Should the state promote "autonomy" generally, or should it specifically protect the national culture that makes choice meaningful?*

  *   **A.** Focus on Autonomy. The state should ensure individuals have a wide range of good options, regardless of national culture. **(Leaf 2)**
  *   **B.** Focus on Culture. Individuals need a stable "societal culture" (language, history) to make meaningful choices. The state must protect this context. **(Leaf 3)**

  ---

  ### **Branch 5: The Goal of Politics (Virtue vs. Recognition)**
  *Assuming you chose 1B (Community Priority): If the community is central, what is the primary goal of political life?*

  *   **A.** Shared Virtue. Politics should cultivate a common civic identity and moral truth shared by all citizens. **(Leaf 4)**
  *   **B.** Identity Recognition. Politics should acknowledge and accommodate the distinct identities of different groups, not just merge them into one. **(Leaf 5)**

  ---

  ### **Branch 6: Internal Restrictions (The Limits of Group Rights)**
  *Assuming you chose 1B (Community Priority): Can a cultural group restrict the basic liberties of its own members (e.g., limiting children's education) to ensure the group survives?*

  *   **A.** No. Even if the community is prior, internal restrictions on basic liberties are unjust. **(Leaf 6: Unoccupied in this debate)**
  *   **B.** Yes. The survival of the culture trumps the individual rights of members. **(Leaf 8)**

  ---

  ## Part 2: The Leaves (Philosophical Positions)

  Locate your final leaf below to see which philosopher's position matches your logical path.

  | Leaf | Your Path | Philosophical Position | Key Thinker |
  | :--- | :--- | :--- | :--- |
  | **1** | Individual → Neutral → Neutrality Possible | **Political Liberalism** | **John Rawls** |
  | **2** | Individual → Promote Good → Universal Autonomy | **Perfectionist Liberalism** | **Joseph Raz** |
  | **3** | Individual → Promote Good → Cultural Context | **Liberal Nationalism** | **Will Kymlicka** |
  | **4** | Community → Shared Virtue | **Civic Republicanism / Communitarianism** | **Michael Sandel** |
  | **5** | Community → Identity Recognition | **Expressivist Communitarianism** | **Charles Taylor** |
  | **6** | Community → No Internal Restrictions | **Liberal Communitarianism** | *(Most liberals argue this, but few communitarians do)* |
  | **7** | Individual → Neutral → Neutrality Impossible | **Skeptical Liberalism** | *(Incoherent: If neutrality is impossible, why insist on it?)* |
  | **8** | Community → Yes Internal Restrictions | **Strong Multicultural Relativism** | *(Generally rejected as incoherent with human rights)* |

  ---

  ## Part 3: Instructor Notes on Logical Space

  ### **Empty or Unoccupied Leaves**
  *   **Leaf 7 (Skeptical Liberalism):** This combination is logically unstable. If a student believes the state *must* be neutral (Branch 2A) but also believes neutrality is *impossible* (Branch 3B), they have no coherent policy prescription. This position is usually a stepping stone to Perfectionism (Leaf 2/3) or Communitarianism (Leaf 4/5).
  *   **Leaf 8 (Strong Multicultural Relativism):** This view holds that cultural survival justifies violating the basic rights of group members (e.g., denying girls education). While some anthropological relativists might hold this, it is largely unoccupied in *normative political philosophy* because it conflicts with fundamental human rights commitments. Even Kymlicka (Leaf 3) explicitly rejects "internal restrictions."

  ### **Overlapping Leaves (The "Fuzzy" Boundary)**
  *   **Leaf 2 (Raz) and Leaf 3 (Kymlicka):** The tree cannot cleanly separate these two positions on the question of **State Promotion**. Both agree that liberal neutrality is impossible and that the state should promote the good.
      *   *The Distinction:* The split relies on whether "the good" is defined as *individual autonomy* (Raz) or *cultural membership* (Kymlicka). In practice, Raz acknowledges culture matters, and Kymlicka argues culture matters *for* autonomy. Students who land here may find they agree with both; the distinction is one of emphasis rather than kind.

  ### **Concrete Cases Explained**
  *   **The Apostate's Right:** Tests the "Encumbered Self" vs. "Unencumbered Self" debate without using jargon. Sandel and Taylor view the self as constituted by ends (Branch 1B); Rawls and Raz view the self as prior to its ends (Branch 1A).
  *   **The Opera Tax:** Tests "Neutrality" vs. "Perfectionism." Rawls argues for neutrality (Branch 2A); Raz and Communitarians argue the state cannot help but promote some values (Branch 2B).
  *   **The Possibility of Neutrality:** Tests the "Disguised Doctrine" critique. Sandel and Taylor argue neutrality favors the individualist "good" (Branch 3B). Rawls argues political liberalism is "freestanding" (Branch 3A).
  *   **The Language Law:** Distinguishes standard Perfectionism from Liberal Nationalism. Raz focuses on autonomous choice; Kymlicka focuses on the *context* of choice (societal culture).
  *   **The Goal of Politics:** Distinguishes Sandel from Taylor. Sandel emphasizes a *common* good (Branch 5A); Taylor emphasizes the *recognition* of distinct goods (Branch 5B).
