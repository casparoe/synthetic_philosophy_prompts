      *   Proposer writes: "If $A$ and $B$, then $Z$." (Card $C$).
      *   Verifier: "I accept $A, B, C$. But I still don't see $Z$. Write down the connection between $A, B, C$ and $Z$."
      *   Proposer writes: "If $A, B, C$, then $Z$." (Card $D$).
      *   *Stop Condition:* Time limit or 5 rounds.
