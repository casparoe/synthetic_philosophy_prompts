answer: |-
  You have put your finger on one of the most persistent and damaging objections to the standard model of moral uncertainty. In the literature on **normative uncertainty** (or moral uncertainty), this is widely known as the **Problem of Theory Individuation** (sometimes the *Individuation Problem* or the *Problem of Theory Counting*).

  You are correct that it is structurally analogous to **partition dependence** in decision theory, but as you suspect, the normative context makes it significantly more intractable. Here is a breakdown of the phenomenon, its relation to decision theory, and why the standard "fixes" often fail to address the metaphysical depth of the problem.

  ### 1. The Name and the Mechanism
  The standard framework you are describing is **Maximizing Expected Choice-worthiness (MEC)**, championed notably by William MacAskill (in *Normative Uncertainty*, 2014) and Toby Ord. MEC treats moral theories like empirical hypotheses: you assign a credence $C(T_i)$ to each theory $T_i$, calculate the choice-worthiness $CW(T_i, A)$ of an action $A$ under that theory, and maximize $\sum C(T_i) \times CW(T_i, A)$.

  The **Individuation Problem** arises because there is no canonical metric for what counts as a distinct $T_i$.
  *   **Empirical Uncertainty:** The state space is usually fixed by the world. "It rains" and "It does not rain" are mutually exclusive and exhaustive. If you split "It rains" into "It rains lightly" and "It rains heavily," you must adjust probabilities accordingly to sum to 1. The physics dictates the partition.
  *   **Normative Uncertainty:** There is no "moral physics" to dictate the partition. Is "Kantianism" one theory? Or is it a family containing the Formula of Universal Law, the Formula of Humanity, and the Kingdom of Ends formulations? Is Act Utilitarianism one theory, or is every possible utility function a distinct theory?

  If you treat every specific formulation as a distinct theory and distribute credence uniformly over *formulations* rather than *families*, you artificially inflate the voting power of the more fragmented family. This is exactly the seminar artifact you observed.

  ### 2. Relation to Decision Theory Concepts
  You noted that this seems different from standard partition dependence. You are right. In decision theory, partition dependence is often viewed as a rationality failure (e.g., the description invariance principle). If two descriptions refer to the same state of affairs, a rational agent should assign them the same probability mass.

  However, in moral uncertainty, the problem is not just descriptive; it is **ontological**.
  *   **In Empirical Cases:** There is a fact of the matter about the state space. We can be wrong about how we carve it up.
  *   **In Normative Cases:** There is no fact of the matter about the "distance" between moral theories. There is no objective geometry of the moral landscape that tells us whether Rule Utilitarianism is "closer" to Act Utilitarianism than it is to Rossian Deontology.

  This means the problem isn't just that agents are bad at math; it's that the input required for the math (a discrete set of mutually exclusive, exhaustive theories) may not exist. Jacob Ross has referred to this as the **"Problem of Posing"**: the outcome depends on how the question is posed, but there is no neutral way to pose it.

  ### 3. Is "Don't Double-Count" a Band-Aid?
  You asked if the standard response is just "don't double-count near-duplicate theories." In the literature, this is often handled by suggesting agents assign credences to **theory families** rather than specific iterations.

  However, you are correct to suspect this is a band-aid. It pushes the problem back one step without solving it.
  *   **The Regress:** How do you individuate the families? Is "Consequentialism" one family? Or do you separate "Welfarist Consequentialism" from "Perfectionist Consequentialism"? If you separate them, you are back to the original problem. If you lump them, you might be ignoring crucial normative disagreements.
  *   **The Continuum Problem:** Hilary Greaves and others have pointed out that moral theories often vary by continuous parameters (e.g., the discount rate for future welfare, or the weight given to autonomy vs. welfare). If the space of moral theories is continuous rather than discrete, a uniform distribution over the space is impossible (you can't have a uniform distribution over an infinite continuous set). Any weighting scheme requires an arbitrary density function.

  This suggests the problem is not merely technical but points to a category error in applying MEC. MEC assumes moral theories are **hypotheses about a single normative reality**. If moral pluralism is true (i.e., there is no single true theory, but rather incommensurable values), then treating them as competing hypotheses is metaphysically mistaken.

  ### 4. Where It Breaks Down: Three Deep Issues
  The Individuation Problem breaks the MEC framework in three specific ways that are relevant to your work in political theory:

  **A. The Lack of a Common Scale (Inter-theoretic Comparison)**
  Even if you solve individuation, MEC requires you to compare choice-worthiness *across* theories. How many "Kantian units" equal one "Utilitarian unit"? The individuation problem exacerbates this. If you have 12 versions of deontology, do they all share the same scale? If not, weighting them equally is nonsense. If they do, why are they distinct theories?

  **B. The "My Favorite Theory" Alternative**
  Because of these issues, some philosophers (like Andrew Sepielli) suggest retreating to **My Favorite Theory (MFT)**: just follow the theory you find most probable. But MFT has its own problems (it ignores the stakes; if you are 51% sure of a theory that permits genocide and 49% sure of one that forbids it, MFT might permit genocide). The Individuation Problem is essentially the argument that MEC is too unstable to improve on MFT.

  **C. The Shift to "Claims" or "Principles"**
  A more sophisticated response, advocated by MacAskill and Christian Tarsney, is to stop assigning credence to *theories* and start assigning credence to *normative claims* or *principles*.
  *   Instead of credence in "Utilitarianism," you have credence in "Pain is bad" and "Everyone counts equally."
  *   You then aggregate the verdicts of the *claims* rather than the *theories*.
  *   **Why this helps:** It dissolves the individuation problem because claims are (arguably) more atomic than theories.
  *   **Why it might not:** It assumes moral theories are just bundles of independent claims. Many theorists argue theories are holistic; the meaning of a claim depends on the theoretical structure supporting it.

  ### 5. A Political Theory Angle
  Since you are in political theory, you might find it useful to view this through the lens of **Social Choice Theory**.
  *   The MEC aggregator is essentially a **social welfare function** where the "voters" are moral theories and the "weight" is your credence.
  *   The Individuation Problem is analogous to the **independence of irrelevant alternatives** or agenda-setting problems in voting. If you can split a "voter" (a theory family) into multiple "voters" (specific formulations), you can rig the election.
  *   This connects to **Value Pluralism** (Berlin, Gray). If the moral landscape is not a single dimension to be discovered but a plurality of incommensurable values, then the search for a "correct" weighting is a category error. The sensitivity to individuation isn't a bug in the calculation; it's a feature of the normative reality.

  ### Summary
  *   **Name:** The Problem of Theory Individuation (within Moral/Normative Uncertainty).
  *   **Decision Theory Link:** It is a radical form of Partition Dependence, worsened by the lack of an objective state space.
  *   **The Verdict:** The instruction to "avoid double-counting" is indeed a band-aid. The deeper problem is that **moral theories do not constitute a discrete, countable set.**
  *   **Current State of Play:** The field is currently splitting between those trying to refine MEC (by moving to credences over *claims* rather than *theories*) and those moving toward **stochastic dominance** approaches (which avoid cardinal weighting entirely) or accepting a form of **normative pluralism** that rejects the idea of a single rational decision procedure under uncertainty.

  If you want to read further, look at **William MacAskill's *Normative Uncertainty* (2014)** for the setup, **Jacob Ross's "The Problem of Posing"** for the individuation critique, and **Hilary Greaves** on the continuous nature of the theory space. **Christian Tarsney's** work on "axiological uncertainty" also tackles the aggregation issue directly.
