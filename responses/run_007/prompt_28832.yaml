      *   *Sarah:* Needs to emphasize the "quotational" nature of phenomenal concepts (e.g., thinking of pain *as this*).
      *   *The Clash:* The core is whether the PCS *dissolves* the hard problem or *embodies* it.

  7.  **Final Polish:** Check pacing. Ensure the train metaphor lands at the end. (The train moving implies progress, or just the illusion of it?)

  *(Self-Correction during final review)*: Make sure Sarah doesn't slip into Type-A materialism (denying conceivability). She must admit zombies are conceivable. Make sure Elias doesn't slip into substance dualism; he's likely a naturalistic dualist or panpsychist.

