  I've been going around in circles on this and I need a fresh pair of eyes. I was trying to figure out whether "better than" is transitive — you know, if A is better than B and B is better than C, then A has to be better than C. Seems obvious, right? But I started playing with this thought experiment and now I think I've proved something impossible, and I cant find the exit.

