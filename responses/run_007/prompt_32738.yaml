answer: |-
  You have identified a genuine and historically significant problem in the philosophy of probability and decision theory. Your intuition that "the number is identical, but the second claim is somehow thinner" is not merely a rhetorical impression; it corresponds to formal distinctions that have been debated for over a century.

  You are describing **two distinct conceptual dimensions** that are frequently collapsed in practice. The first concerns the **source** of the probability (frequency vs. judgment); the second concerns the **reliability** or **evidential support** for that probability assignment.

  Below is an analysis of the established concepts that map onto your observations, distinguishing between settled consensus and genuine contention, followed by a synthesis of how best to characterize the phenomenon in your committee context.

  ---

  ### 1. The Distinction in Source: Risk vs. Uncertainty
  **The Concept:** *Knightian Uncertainty*
  **Primary Source:** Frank Knight, *Risk, Uncertainty, and Profit* (1921)

  This maps onto your observation of committees converting "radically different situations into a single 'risk' framework."

  *   **Risk:** Situations where the probability distribution is known or knowable via frequentist data (your "long run of comparable cases"). These are insurable and mathematically tractable.
  *   **Uncertainty (Knightian):** Situations where the probability distribution is unknown because the event is unique, novel, or lacks a reference class (your "unprecedented public-health measure").

  **Settled vs. Contested:**
  *   **Settled:** It is empirically settled that human agents treat these two situations differently (see *Ellsberg Paradox* below). It is also settled that standard Expected Utility Theory (EUT) struggles to model this distinction without modification.
  *   **Contested:** Among Bayesians and mainstream economists, there is a strong tradition (following Savage, 1954) that rejects Knight's distinction as theoretically unnecessary. They argue that a rational agent *must* assign a subjective probability to any proposition, regardless of evidence. From this view, "Uncertainty" is just "Risk" with a very wide prior. Conversely, Post-Keynesians and decision theorists working on *Ambiguity* argue that Knight was right: some uncertainties are fundamentally non-probabilizable.

  **Fit for your case:** This concept best describes the **category error** your committee is making. They are treating *Uncertainty* as if it were *Risk*.

  ### 2. The Distinction in Evidential Support: Probability vs. Weight
  **The Concept:** *The Weight of Evidence*
  **Primary Source:** John Maynard Keynes, *A Treatise on Probability* (1921)

  This maps onto your observation that the "80 percent" figure is "thinner" in the second case. For Keynes, probability ($P$) and the weight of evidence ($V$) are independent variables.

  *   **Probability ($P$):** The balance of argument favoring a conclusion (e.g., 0.8).
  *   **Weight ($V$):** The amount of relevant evidence upon which that probability is based.

  Keynes argued that you can have a high probability based on very little evidence (high $P$, low $V$) and a moderate probability based on massive evidence (moderate $P$, high $V$). In your committee, the "80%" is the $P$, but the "thinness" you perceive is the low $V$.

  **Settled vs. Contested:**
  *   **Settled:** In philosophy of science and epistemology, it is widely accepted that the *reliability* of a probability estimate is distinct from the *value* of the estimate.
  *   **Contested:** There is no consensus on how to formalize "Weight" mathematically. Some propose **Second-Order Probability** (a probability distribution over the first probability), while others propose **Imprecise Probability** (representing belief as an interval, e.g., [0.6, 0.9], rather than a point). Keynes himself eventually became skeptical that "Weight" could be easily quantified.

  **Fit for your case:** This concept best describes the **epistemic quality** of the claim. It gives you the vocabulary to say, "The probability is high, but the weight is low."

  ### 3. The Modern Technical Distinction: Aleatory vs. Epistemic
  **The Concept:** *Types of Uncertainty*
  **Primary Source:** Risk Analysis and Engineering Literature (e.g., Aven, 2010)

  In contemporary risk science, the distinction is often drawn between:

  *   **Aleatory Uncertainty:** Inherent randomness in a system (e.g., radioactive decay, dice rolls). This corresponds to your "stable frequencies." It is generally considered irreducible.
  *   **Epistemic Uncertainty:** Uncertainty due to lack of knowledge, model error, or data scarcity (e.g., your "novel financial instrument"). This is theoretically reducible with more information.

  **Settled vs. Contested:**
  *   **Settled:** This terminology is standard in engineering, safety science, and regulatory impact assessments. It is useful for determining whether spending money on more data (reducing epistemic uncertainty) will help.
  *   **Contested:** Philosophers of probability debate whether "aleatory" uncertainty is truly ontological (the world is random) or merely epistemic (we lack the data to predict the coin toss). However, for practical committee work, this distinction is less contentious than the Knight/Keynes distinctions.

  **Fit for your case:** This is the most pragmatic vocabulary for a planning committee. It avoids the metaphysical baggage of "Knightian Uncertainty" while preserving the operational difference.

  ### 4. The Behavioral Validation: Ambiguity
  **The Concept:** *Ambiguity Aversion*
  **Primary Source:** Daniel Ellsberg, *Risk, Ambiguity, and the Savage Axioms* (1961)

  Ellsberg demonstrated that people prefer betting on an urn with known proportions (Risk) over an urn with unknown proportions (Uncertainty/Ambiguity), even if the mathematical expected value is identical.

  *   **Ambiguity:** The quality of the "thin" probability.
  *   **Ambiguity Aversion:** The rational (or at least robust) preference for the "thick" probability.

  **Settled vs. Contested:**
  *   **Settled:** It is an empirical fact that humans exhibit ambiguity aversion.
  *   **Contested:** Is ambiguity aversion *rational*? Standard Bayesianism says no (it violates the Sure Thing Principle). Decision theorists who develop *Ambiguity Models* (e.g., Gilboa & Schmeidler, 1989) argue that it is rational to prefer known risks over unknown uncertainties.

  **Fit for your case:** This validates your intuition that the committee *should* treat the two "80%" figures differently.

  ---

  ### Synthesis: One Concept or Two?

  You asked whether you have described one concept or two. Based on the literature, you have described **two distinct dimensions that are often conflated**:

  1.  **The Ontological/Methodological Dimension (Knight/Aleatory-Epistemic):** This concerns *how the number was generated*. Is it derived from a reference class (Risk/Aleatory) or from judgment/modeling (Uncertainty/Epistemic)?
  2.  **The Evidential Dimension (Keynes/Weight):** This concerns *how robust the number is*. Even if two numbers are both derived from judgment, one may rest on a deep model and the other on a guess.

  **Why this matters:**
  *   You can have **High Risk / High Weight**: (e.g., "80% chance of rain" based on 100 years of meteorological data).
  *   You can have **High Uncertainty / High Weight**: (e.g., "80% chance this bridge holds" based on exhaustive engineering simulation, even though it's a unique bridge).
  *   You can have **High Uncertainty / Low Weight**: (e.g., "80% chance this new policy works" based on one expert's hunch).

  Your committee is collapsing all three into "Risk."

  ### Recommendation for Vocabulary

  Since you are in a university committee setting, you need terms that are precise but not overly esoteric.

  **1. For the Conflation (Risk vs. Uncertainty):**
  Use **Knightian Uncertainty**.
  *   *Usage:* "We are treating this as a **Risk** problem when it is actually a **Knightian Uncertainty** problem. We lack the reference class required for actuarial calculation."
  *   *Why:* It is the standard term in economics and political economy for "unmeasurable uncertainty."

  **2. For the Thinness (Probability vs. Weight):**
  Use **Weight of Evidence** or **Confidence in the Estimate**.
  *   *Usage:* "We need to distinguish the **Probability** of the outcome from the **Weight of Evidence** supporting that probability. The number is 80%, but the weight is low."
  *   *Note:* Be careful with the word "Confidence." In statistics, "Confidence Interval" has a specific frequentist meaning. In common parlance (and your committee), "Confidence" is used as you described. To avoid confusion, **"Evidential Weight"** is philosophically safer.

  **3. For the Practical Framework:**
  Use **Aleatory vs. Epistemic Uncertainty**.
  *   *Usage:* "This is **Epistemic Uncertainty**. Buying more data or consulting more experts might reduce it, whereas **Aleatory Uncertainty** is inherent to the system."
  *   *Why:* This is the most actionable distinction for planning. It tells the committee whether "doing more homework" will help.

  ### If Nothing Established Fits (A Proposal)

  The established terms *do* fit, but they are fragmented across economics (Knight), philosophy (Keynes), and engineering (Aleatory/Epistemic). If you require a single, unified term to critique the committee's practice that bridges these gaps, I propose:

  **Term:** **Pseudo-Quantification**
  **Definition:** The assignment of a precise numerical probability to a proposition where the evidential weight is insufficient to support numerical precision, thereby masking Knightian Uncertainty as Risk.
  **Boundary Cases:**
  *   *Not Pseudo-Quantification:* Assigning a probability range (e.g., "60-90%") to acknowledge low weight.
  *   *Not Pseudo-Quantification:* Using a number for internal modeling while explicitly flagging it as "expert judgment" with low confidence.
  *   *Is Pseudo-Quantification:* Presenting a singular "80%" derived from a single analogy as equivalent to an "80%" derived from frequency data.

  ### Summary of Consensus vs. Contention

  | Concept | Settled Consensus | Genuine Contention |
  | :--- | :--- | :--- |
  | **Risk vs. Uncertainty** | Agents treat them differently (Ellsberg). | Whether rational agents *should* treat them differently (Bayesian orthodoxy says no). |
  | **Probability vs. Weight** | Evidential support is distinct from probability value. | How (or if) to mathematically represent "Weight" (Second-order probability vs. Imprecise probability). |
  | **Aleatory vs. Epistemic** | Useful for risk management strategies. | Whether "Aleatory" is truly ontological or just unresolved Epistemic uncertainty. |
  | **Your Committee's Practice** | It is a category error to treat unique events as frequentist risks. | Whether this error is "irrational" or simply a necessary heuristic for bureaucratic decision-making. |

  ### Final Advice for the Committee

  As a philosopher, your strongest intervention is to invoke **Keynes's Weight of Evidence**.

  When a colleague presents a "novel" risk with a precise number, ask: *"What is the weight of evidence behind this estimate?"*

  If they reply with the probability itself ("Well, it's 80%"), you can reply: *"That is the probability. I am asking about the weight. Is this based on a frequency distribution (High Weight) or a singular judgment (Low Weight)? Because if the weight is low, we should not treat this 80% as equivalent to an actuarial 80%."*

  This forces the committee to acknowledge the "thinness" you have identified without requiring them to abandon probabilistic language entirely.
