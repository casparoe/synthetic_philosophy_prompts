answer: |-
  This is a sophisticated objection that cuts to the heart of the "Reference Class Problem" for Evidential Decision Theory (EDT). You have effectively reconstructed a version of the "tickle defense" or the "problem of spurious correlations" adapted for Evidential Cooperation in Large Worlds (ECL).

  Your argument is valid, but I believe it is unsound. The flaw lies primarily in **Premise (4)**, with a secondary issue in how **Premise (7)** interprets the relationship between causal facts and decision rules.

  Here is the breakdown of why you should reject (4), what that commits you to, and why it saves ECL from collapsing into emptiness or Causal Decision Theory (CDT).

  ### 1. The Diagnosis: Reject Premise (4)

  **Premise (4):** *The choice of reference class is not fixed by the decision problem itself, nor by EDT, nor by any obvious normative principle. It seems to be a free parameter.*

  **Why reject it:** This premise treats the reference class as a **normative choice** available to the agent to optimize expected utility, rather than an **epistemic constraint** determined by the agent's model of the world.

  In standard Bayesian EDT, an agent does not "choose" a conditional probability $P(O|A)$ or a reference class to make an action look good. The agent possesses a credence function (a joint probability distribution over states of the world and actions). The "reference class" is not a parameter the agent tunes; it is implicit in the correlations already present in their credence function.

  *   **The Epistemic View:** When you ask, "How correlated am I with that agent over there?", you are asking an empirical or logical question, not a normative one. You are asking, "Given my evidence, what is the probability that our decision algorithms output the same result?"
  *   **The Constraint:** You are not free to *decide* you are correlated with everyone (which would make cooperation easy but beliefs false) nor *decide* you are correlated with no one (which would make beliefs safe but cooperation impossible). You are constrained by the evidence you have about the similarity of your decision algorithms, your common origins, or the logical structure of the situation.

  If you treat the reference class as a free parameter to be optimized, you are no longer doing EDT; you are doing a form of "Magic Decision Theory" where you can wish correlations into existence. ECL proponents (like Oesterheld) argue that the correlations are **facts** (often logical or mechanistic facts) that the agent must *discover*, not create.

  ### 2. Addressing Premise (3): The Continuum of Correlation

  **Premise (3):** *A narrow reference class... makes your choice uninformative... A broad reference class... makes your choice highly informative.*

  This premise presents a false dichotomy. In ECL, correlation is not a binary switch determined by class membership; it is a continuous variable determined by **degree of similarity**.

  *   **Similarity Metrics:** ECL relies on a metric of similarity (often cashed out in terms of algorithmic similarity or logical counterfactuals). If another agent is 99% similar to you, your action gives strong evidence about theirs. If they are 10% similar, it gives weak evidence.
  *   **The Task:** The agent's job is not to *pick* a class, but to *estimate* the degree of correlation based on available evidence. This is difficult (the "problem of induction"), but it is not *arbitrary* in the sense of being unconstrained by rationality. A rational agent cannot arbitrarily assign high correlation to dissimilar agents without violating norms of inductive inference.

  ### 3. Addressing Premise (7): The "Collapse into CDT" Worry

  **Premise (7):** *...it implicitly relies on causal or metaphysical constraints on reference classes... which would mean the view collapses into causal decision theory after all.*

  This is the second major flaw. It conflates the **source of the correlation** with the **decision rule**.

  *   **Causal Facts vs. Causal Decision Theory:** ECL absolutely relies on causal/metaphysical facts to establish *that* a correlation exists. For example, "We are correlated because we both run the same source code" or "We are correlated because we were trained on the same data." These are causal/mechanical facts.
  *   **The Divergence:**
      *   **CDT** says: "Even if you are correlated, your action does not *cause* their action. Therefore, ignore the correlation when calculating expected utility."
      *   **ECL/EDT** says: "Because you are correlated (due to those causal/logical facts), your action is *evidence* of their action. Therefore, condition on it when calculating expected utility."

  Acknowledging that correlations have causal/logical explanations does not make you a Causal Decision Theorist. CDT is defined by its refusal to condition on non-causal evidence (or evidence of common causes) in the utility calculation. ECL accepts the causal explanation for the correlation but insists on using that correlation evidentially. Therefore, it does not collapse into CDT.

  ### 4. The Cost of Rejecting (4)

  If you reject Premise (4), you commit yourself to the following:

  1.  **Robust Epistemology of Similarity:** You must accept that there are objectively better or worse ways to judge similarity between decision agents. This pushes the problem back from decision theory to epistemology/philosophy of science (the "New Riddle of Induction" or "Grue" problem). You are admitting that ECL is only as good as your theory of inductive inference.
  2.  **Computational/Informational Burden:** You concede that applying ECL is incredibly demanding. To know the "correct" reference class, you need a detailed model of the other agents' decision processes. In a "large world" where agents are opaque, you may often have to act under deep uncertainty about the degree of correlation.
  3.  **Subjectivity of Priors:** You must accept that different agents with different priors about similarity may legitimately reach different ECL verdicts. ECL does not guarantee convergence on a single action for all agents, only that *given* a credence function, the agent should maximize conditional expected utility.

  ### 5. A Note on "Logical" vs. "Statistical" ECL

  It is worth noting that Caspar Oesterheld and colleagues often frame ECL not just in terms of statistical EDT, but in terms of **Logical Decision Theory (LDT)** or **Functional Decision Theory (FDT)**.

  *   **Statistical EDT:** Relies on observed frequencies. (Vulnerable to your reference class objection).
  *   **Logical ECL:** Relies on the fact that if two agents run the same *algorithm*, they must output the same result. The "reference class" is defined by **algorithmic identity**.

  If your reading group is discussing the stronger version of the view (Logical ECL), Premise (3) fails even harder. The reference class is not "agents who are similar," but "agents who instantiate the same function." This is not a free parameter; it is a mathematical fact (either the code is the same or it isn't). The uncertainty lies only in *whether* the other agent is running that code, which is an empirical question, not a normative loophole.

  ### Summary Recommendation

  **Reject Premise (4).**

  The reference class is not a free parameter for the agent to optimize; it is a feature of the agent's epistemic model of the world. While determining the correct degree of correlation is epistemically difficult (and perhaps sometimes indeterminate due to the problem of induction), it is not *normatively arbitrary*.

  **The Cost:** You must concede that ECL does not solve the problem of induction. It inherits the difficulties of determining similarity and correlation from general epistemology. However, this does not make the decision theory empty; it simply means the inputs to the decision theory are sometimes uncertain.

  **Suggestion for your group:** Ask the proponents how they cash out "similarity." If they rely on vague statistical similarity, your objection stands as a practical limitation. If they rely on **algorithmic similarity** or **logical counterfactuals**, press them on how an agent verifies algorithmic identity in an opaque large world. This moves the discussion from "ECL is arbitrary" to "ECL requires a specific theory of logical correlation," which is where the actual philosophical work is being done.
