answer: |-
  Here are ten questions organized into five pairs. Each pair addresses one of your required topics, with the second question designed as a follow-up that anticipates her standard defensive moves. The final question addresses falsifiability, serving as the follow-up to the "Strength of Conclusion" topic to keep the count at ten.

  **1. Topic: The Flicker-of-Freedom Strategy**
  **Q1:** In your Frankfurt cases, you argue the agent lacks robust alternatives. But even in your preferred examples, the agent typically retains the ability to *begin* to choose otherwise before the intervener acts. Doesn't this "flicker" preserve a revised Principle of Alternative Possibilities (PAP), suggesting we should refine PAP rather than reject it entirely?
  **Q2 (Follow-up):** You'll likely reply that this flicker is too morally thin to ground responsibility. But if the flicker involves the voluntary *onset* of a decision, why is that insufficient for *some* degree of responsibility? If the agent is responsible for the onset, haven't you preserved the core intuition behind PAP rather than defeating it?

  **2. Topic: The Dilemma Defense**
  **Q3:** For the intervener to know when to act, there must be a prior sign of the agent's choice. Is this sign a deterministic cause of the action, or merely a reliable indicator? If it's deterministic, you've begged the question against the incompatibilist; if it's merely reliable, the agent could have falsified the indicator. Which horn are you taking?
  **Q4 (Follow-up):** *[If she picks "reliable indicator":]* If it's only a reliable indicator, then it remains possible for the agent to choose otherwise without the intervener acting. How do you block the inference that this possibility is sufficient to satisfy the incompatibilist's demand for alternative possibilities? *[If she picks "deterministic":]* If the sign deterministically guarantees the action, aren't you simply assuming determinism is compatible with responsibility to prove that determinism is compatible with responsibility?

  **3. Topic: The Prior-Sign/Bypass Worry**
  **Q5:** If the prior sign is sufficient to trigger the intervener, it seems the sign itself settles what will happen before the agent decides. In the actual sequence where the agent decides on their own, isn't their decision causally preempted by the existence of the sign, rendering the agent a bystander in their own action?
  **Q6 (Follow-up):** You will likely insist the agent decides normally in the actual sequence. But if the sign and the decision are distinct events, what metaphysical link ensures the decision wasn't bypassed? If there is no link, the agent isn't the cause; if there is a link, doesn't the sign simply become a prior cause, returning us to standard determinism?

  **4. Topic: Sourcehood**
  **Q7:** Many incompatibilists now argue that sourcehood, not alternative possibilities, is the necessary condition for responsibility. Your cases attack PAP, but do they positively establish that the agent is the *source* of the action in the required sense, or do they merely remove one obstacle?
  **Q8 (Follow-up):** If you concede the cases show nothing about sourcehood, then you haven't proven agents *are* responsible in these cases, only that PAP is false. Doesn't this shrink your conclusion from "responsibility exists without alternatives" to merely "PAP is not the correct principle," leaving the actual status of responsibility unresolved?

  **5. Topic: Strength of Conclusion & Falsifiability**
  **Q9:** You suggest these cases basically settle the debate. Do you claim that *no* version of alternative possibilities is ever necessary for moral responsibility, or only that the specific formulation of PAP you target is false? If it's the latter, isn't your rhetoric about "settling the debate" overblown?
  **Q10 (Follow-up):** If you maintain the stronger claim that alternatives are never necessary, what kind of case or argument would count as evidence against that view? Is there any conceivable discovery that would make you abandon the Frankfurt strategy, or is the view unfalsifiable in practice?
