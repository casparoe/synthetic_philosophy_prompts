          3.  **The Oversight Problem (1 vs 5):** Human ability to judge superhuman subtasks.
          4.  **The Strategic Bet (4 vs 5):** Why bet on a fragile mechanism?
      *   **Revisions/Costs:** For each, suggest what needs to change and the intellectual cost.
      *   **Conclusion:** Summary of the "strain."

  7.  **Drafting the Content (Iterative refinement):**
      *   *Refining Tension 1 (3 vs 4):* Claim 3 is optimistic about coverage. Claim 4 is pessimistic about generalization. The tension is: How do you know you have a "broad distribution" if you can't anticipate the novel inputs?
      *   *Refining Tension 2 (2 vs 4):* Claim 2 is the "IDA" promise. Claim 4 is the "mesa-optimization" or "OOD failure" worry. If subtasks are aligned but the *plan* is novel, does alignment hold?
      *   *Refining Tension 3 (1 vs 5):* If the AI is smarter, can the human *actually* judge the subtask? (e.g., code that looks safe but has a backdoor).
      *   *Revisions:*
