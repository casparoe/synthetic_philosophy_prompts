          *   To fix 1 vs 5: Need "AI-assisted oversight." Cost: Recursion problem (who aligns the assistant?).

  8.  **Final Review against User Prompt:**
      *   Did I rank by severity? Yes.
      *   Did I say what would have to give? Yes.
      *   Did I say what the cheapest revision would cost? Yes.
      *   Is the tone appropriate? Yes, analytical and respectful.

  9.  **Final Polish:** Ensure terms like "distribution," "OOD," and "composition" are used clearly in the context of IAD. (Self-correction: Make sure to explicitly mention that Claim 2 is the most controversial theoretical leap in the IAD literature).

  *(Self-Correction during drafting)*: I should emphasize that Claim 2 is often the most criticized part of IAD by external researchers. Claim 3 & 4 is more of an internal tension within the user's specific model of ML capabilities. I will prioritize the ML capability tension (3 vs 4) as the most immediate logical contradiction, but note that (2) is the most fragile *theoretical* assumption. Actually, looking closer, (3) and (4) are directly contradictory regarding the *nature of imitation*. (3) says it works if distribution is broad. (4) says it fails on novel inputs. The tension is whether "broad distribution" can ever cover "novel inputs." This is the core.

