answer: |-
  **Project Title:** The Architecture of Agony: Commensurability and the Lexical Threshold in Negative Utilitarianism

  **Project Summary**
  Suffering-focused ethics has gained significant traction in contemporary normative theory as a response to the counterintuitive implications of classical utilitarianism. A prominent variant is Lexical Threshold Negative Utilitarianism (LTNU), which posits that while mild pains and pleasures are commensurable, suffering above a specific threshold possesses lexical priority; no amount of positive value can outweigh it. While LTNU avoids the "world-destruction" objection leveled at strict Negative Utilitarianism, it faces a structural challenge: the commensurability problem. This project asks whether LTNU offers a coherent, unified axiology or merely conceals a dualistic theory behind an arbitrary border. Over the course of one semester, I will analyze the metaphysical and axiological commitments required to sustain the lexical threshold, determining whether the view can survive without collapsing into ordinary Negative Utilitarianism or an ad hoc patchwork of incommensurable scales.

  **Research Question**
  The central research question is determinate: *Can Lexical Threshold Negative Utilitarianism provide a unified account of value commensurability that explains the transition across the threshold, or does the view necessarily rely on a discontinuous, arbitrary bifurcation of value scales?*

  Specifically, the project investigates whether the "threshold" functions as a genuine axiological feature (a discontinuity in the magnitude of disvalue) or a conceptual stopgap (a shift from comparability to incomparability). If the latter, LTNU fails to solve the commensurability problems it was designed to address; it merely relocates them to the boundary condition.

  **Background and Significance**
  Negative Utilitarianism (NU) is often rejected because it implies that a sufficiently large number of minor harms could outweigh catastrophic suffering, or conversely, that the prevention of minor suffering justifies the destruction of all positive value. LTNU is the standard remedy (see, e.g., work by [Author] and [Author]). However, existing discussions focus primarily on the *extensional* adequacy of LTNU (i.e., does it yield the right verdicts in thought experiments?) rather than its *intensional* coherence.

  Simultaneously, the literature on value incommensurability (e.g., [Author], [Author]) distinguishes between parity, incomparability, and lexical superiority. Yet, these discussions rarely apply these distinctions to the specific architecture of suffering-focused views. There is a gap in the literature regarding whether the "lexical" move in LTNU is compatible with a hedonistic or welfarist monism. If pains below the threshold are measured in "hedons" and pains above the threshold are measured in "lexical units," the theory is not a form of utilitarianism at all, but a hybrid view that lacks a principled justification for the conversion rate between the two. This project bridges the gap between normative ethics (suffering-focused views) and metaethics (the structure of value).

  **Methodology and Work Plan**
  The project will proceed through three phases over the semester:

  1.  **Conceptual Taxonomy (Weeks 1–4):** I will distinguish three interpretations of "lexical priority" within LTNU:
      *   *Magnitude Discontinuity:* The disvalue scale is continuous but infinite at the threshold (a vertical asymptote).
      *   *Deontic Constraint:* The threshold marks a shift from consequentialist calculation to side-constraints.
      *   *Qualitative Incomparability:* Pains above the threshold belong to a different ontological category than those below.
      I will argue that only the first preserves the utilitarian structure, while the latter two collapse LTNU into a non-utilitarian hybrid.

  2.  **Hard Case Analysis (Weeks 5–10):** I will test these interpretations against three specific problems:
      *   *The Aggregation Problem:* One excruciating pain vs. any number of mildly pleasant experiences. Does the view hold if the mild pleasures are sufficiently vast?
      *   *The Hierarchy of Horrors:* Comparing two pains both above the threshold (e.g., torture vs. severe torture). If they are lexically prior to pleasure, are they commensurable with *each other*? If not, the view loses action-guiding power in high-stakes contexts.
      *   *The Sorites of Suffering:* Is the threshold sharp or vague? If sharp, the view faces arbitrariness objections; if vague, it faces indeterminacy objections that undermine the lexical claim.

  3.  **Synthesis and Evaluation (Weeks 11–14):** I will determine which combination of views can handle these cases without collapsing back into ordinary NU or becoming an ad hoc threshold. I will draft a manuscript suitable for submission to a top-tier journal in ethics (e.g., *Ethics*, *Philosophical Studies*, or *Utilitas*).

  **Success and Failure Conditions**
  *   **Success:** The project yields a definitive argument that LTNU is either (a) coherent only if it adopts a specific, non-standard account of value magnitude (which I will articulate), or (b) incoherent, requiring proponents to abandon the utilitarian framework in favor of a pluralistic deontology. A successful outcome provides a clear "dilemma" for proponents of suffering-focused ethics to address.
  *   **Failure:** The project fails if the analysis reveals that the distinctions drawn are merely terminological without substantive impact on normative verdicts, or if the scope expands beyond a single semester (e.g., requiring empirical data on pain perception). If the result is merely that "more work is needed" without narrowing the philosophical options, the project will not have met its determinate goal.

  **Feasibility**
  This project is purely conceptual and requires no empirical research or travel. It builds directly on my existing expertise in normative ethics and value theory. A semester of course release provides sufficient time to complete the conceptual analysis and produce a 10,000-word article. The scope is tightly focused on the internal coherence of a single view, ensuring completion within the timeframe.

  **Conclusion**
  Lexical Threshold Negative Utilitarianism is a leading candidate for a plausible suffering-focused ethics. However, its reliance on a threshold invites the charge of arbitrariness. By rigorously examining the commensurability conditions across this threshold, this project will clarify whether LTNU is a stable ethical theory or a temporary resting place for those unwilling to accept the implications of strict Negative Utilitarianism.
