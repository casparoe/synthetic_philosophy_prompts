  The principle that unifies your verdicts is what I will call the **Epistemic Certainty and Inductive Depth Principle**. It states that the "genuine paradox" feeling arises only when two conditions are met simultaneously: (1) the announcement is treated as **certain knowledge** (not merely probable), and (2) the timeline allows for a **multi-step backward induction** that obscures the immediate self-reference.

  Here is how this principle handles your cases:

  *   **Cases A, B, and F (Paradoxical):** These meet both conditions. The teacher's authority makes the announcement certain knowledge, and the multi-day timeline creates a chain of reasoning (Friday → Thursday → Wednesday...) that feels "airtight" because the contradiction is deferred through several steps of elimination.
  *   **Case C (Not Paradoxical):** This fails the **Inductive Depth** condition. The contradiction is immediate (one-step). The reasoning "If I know it's tomorrow, it's not a surprise" collapses instantly, making the flaw "obvious" rather than paradoxical. Your intuition here is validated: the lack of a chain prevents the "airtight" feeling.
