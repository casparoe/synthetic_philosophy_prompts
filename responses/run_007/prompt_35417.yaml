answer: |-
  Your hypothesis that the impasse is methodological is correct, but it requires sharpening. The disagreement is not merely about "explanatory norms" in a general sense; it is a specific clash over the **metaphysics of probability** and the **ontology of identity**. The stalemate persists because the opposing camps are effectively talking past one another about what the word "probability" refers to in a deterministic, branching universe.

  Here is a diagnosis of the disagreement, followed by an assessment of what would constitute genuine progress.

  ### Diagnosis: A Tripartite Clash

  The debate is not primarily empirical (all camps accept the Schrödinger equation) nor purely formal (the math of decoherence is settled). It is a **meta-philosophical dispute** with three interlocking layers.

  **1. The Metaphysical Layer: Chance vs. Determinism**
  The root tension is that standard probability implies **objective chance**—the idea that, given the exact same past, multiple futures are possible, and only one becomes actual. MWI denies this. In MWI, all futures become actual.
  *   **The Derivers (Decision-Theoretic/Envariance):** They adopt a **functionalist** view of probability. They argue that if an agent's rational behavior, betting preferences, and expectations align with the Born rule, then probability *exists* in the only sense that matters. They are trying to reduce probability to rational bookkeeping in a deterministic multiverse.
  *   **The Postulators and Incoherence Critics:** They hold a **primitivist** or **propensity** view. They argue that probability requires genuine uncertainty about what *will* happen. If everything happens, there is no uncertainty, only self-location. They contend that you cannot derive "chance" from "certainty of all outcomes" without smuggling in a new primitive.

  **2. The Semantic Layer: Credence vs. Frequency vs. Measure**
  The camps are using "probability" to denote different things, and the branching structure blurs the distinctions.
  *   **Frequentists** look for relative frequencies across branches. But branches are not discrete, countable atoms; they are emergent structures defined by decoherence. You cannot "count" branches to get frequencies because the granularity of branching is arbitrary. The Derivers use this to argue that amplitude-squared is the only robust "measure" of a branch.
  *   **Bayesians (Subjectivists)** look for degrees of belief (credence). The Derivers argue credence is all there is. The Critics argue credence needs to track something objective (truth or chance), and if all branches are equally real, why should credence track amplitude rather than branch count?
  *   **The Verbal Disagreement:** When a Critic says, "Probability is incoherent here," they mean *objective chance*. When a Deriver says, "Probability is recovered," they mean *subjective credence constrained by symmetry*. They are solving different problems.

  **3. The Methodological Layer: Reductionism vs. Pragmatism**
  This confirms your hypothesis.
  *   **The Reductionists (Derivers):** For them, MWI's value proposition is ontological parsimony (Wavefunction + Unitary Dynamics). Adding a probability postulate is a "theoretical sin" that ruins the purity of the interpretation. They are willing to stretch the definition of probability to save the reductionism.
  *   **The Pragmatists (Postulators):** They argue that a physical theory must connect to observation. If the connection requires a bridge principle (the Born rule), so be it. They view the Derivers' struggle as a "free lunch" attempt—trying to get empirical content from pure ontology without paying the conceptual cost.

  ### What Would Count as Progress?

  Given this diagnosis, an experimental result is useless. MWI with the Born rule and Copenhagen with the Born rule make identical empirical predictions. If MWI without the Born rule made different predictions, the theory would likely be falsified, not fixed. Therefore, progress must be conceptual or formal-philosophical.

  **1. A Theorem with Uncontroversial Axioms (Unlikely)**
  A new mathematical derivation would only help if the axioms were accepted by all camps. Currently, the axioms of decision theory (e.g., "diachronic consistency" or "branching indifference") are rejected by critics as disguised Born rules. A theorem that relies on weaker, purely structural assumptions about the Hilbert space (perhaps extending Zurek's envariance) could help, but it is unlikely to silence the metaphysical objection that *structure does not entail chance*.

  **2. A Conceptual Distinction that Dissolves the Tension (Most Promising)**
  Progress would look like a rigorous account of **self-locating uncertainty** that decouples probability from objective chance.
  *   If it can be demonstrated that an observer *prior* to a measurement (but after the branching interaction has begun decoherently) is genuinely uncertain about which branch they will inhabit—and that this uncertainty is *quantitatively constrained* by the geometry of the state space without assuming the Born rule—the Incoherence objection collapses.
  *   This requires a clear ontology of **personal identity** in MWI. If "I" am the pre-branching observer, and "I" split into successors, do I survive as both? If yes, where is the uncertainty? If no, which one am I? A consensus on the metaphysics of fission would force a consensus on the probability problem.

  **3. An Honest Acknowledgment of Category Error (The "Dissolution")**
  It is possible the debate is permanently stalled because the question is ill-posed. Progress might be the widespread acceptance that **probability is an emergent, approximate phenomenon** in MWI, not a fundamental law.
  *   Just as "temperature" is not a fundamental property of a single molecule but emerges from statistical mechanics, "probability" might not apply to the fundamental wavefunction but only to observers embedded within it.
  *   If the community accepts that the Born rule is a **rule of thumb for embedded observers** rather than a fundamental derivation from the wavefunction, the demand for a strict derivation vanishes. This satisfies the Pragmatists (it's a rule we use) and the Reductionists (it's not a fundamental postulate).

  ### Why the Debate May Be Permanently Stalled

  Despite the paths above, there is a strong case that this debate will not converge. The stalemate is sustained by **divergent philosophical priors** that are not resolvable by physics alone.

  1.  **Humean vs. Non-Humean Views of Laws:** Derivers tend to treat laws (including probability) as descriptions of regularities (Humean). Critics often treat them as prescriptive or causal powers (Non-Humean). You cannot prove one metaphysical stance correct using a theory that both accept as formally valid.
  2.  **The Circularity Charge is Resilient:** As long as probability is defined by rational action, critics can always argue that "rationality" is being defined to fit the desired outcome. This is a philosophical skepticism that no amount of formal tweaking can fully assuage.
  3.  **The "Measure vs. Count" Intuition:** The intuition that "two branches should be twice as likely as one" is deep-seated. MWI requires accepting that branches have *weights* (amplitudes) rather than *counts*. Until there is a consensus that branches are not countable individuals but rather regions of a continuous measure space, the "why squared amplitude?" question will feel like a gap to many.

  ### Conclusion

  Your diagnosis is largely correct: this is a clash of explanatory norms rooted in the metaphysics of probability. The Derivers seek a **functionalist reduction** to preserve ontological purity; the Critics demand a **primitivist link** to preserve the concept of chance.

  Progress will not come from a new experiment or a more complex theorem. It will come from either:
  1.  A consensus on the **metaphysics of identity** (resolving self-locating uncertainty); or
  2.  A **dissolution** of the problem by reclassifying probability as an emergent, observer-relative phenomenon rather than a fundamental feature of the wavefunction.

  Without one of these shifts, the debate will remain a proxy war between reductionists who prioritize mathematical purity and realists who prioritize conceptual clarity about chance. The impasse is not a failure of physics, but a reflection of the fact that "probability" is a philosophical concept that physics alone cannot fully ground.
