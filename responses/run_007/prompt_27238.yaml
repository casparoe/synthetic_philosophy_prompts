prompt: |-
  I'm a PhD student in philosophy of mind and I've been asked to run a reading group session on Clark and Chalmers' extended mind thesis for a mixed audience — mostly grad students from other departments (psych, neuroscience, anthropology) who are philosophically curious but haven't read much philosophy of mind. I've got about forty minutes and a whiteboard.

  Don't explain the thesis to me — I know it. I need a plan for how to teach it: the order the ideas have to go in, the one example that should carry the whole thing, and especially the misconceptions I should expect. I've seen smart people walk away from this material thinking it's just the boring claim that we use tools, or that it's a thesis about group cognition, or that Clark and Chalmers are saying your iPhone is literally conscious. I want to head those off before they take root.

  So: what depends on what? Where do I put the parity principle relative to the Otto case? Should I start with internalist assumptions and then undermine them, or lead with the positive view? What's the best carrying example — is Otto still the right one, or has something better emerged in the literature? Which misconceptions should I pre-empt and at exactly which points in the sequence? And what should I openly say we're not going to settle (e.g. the mark of the cognitive, whether consciousness extends) so they dont think I'm dodging?

  Also, please separate what's basically settled among people working on this from what's genuinely contested — I don't want to present a live debate as if it's resolved. And write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of mind.
      *   **Task:** Run a 40-minute reading group session on Clark & Chalmers' Extended Mind Thesis (EMT).
      *   **Audience:** Mixed grad students (psych, neuroscience, anthropology), philosophically curious but novices in philosophy of mind.
      *   **Constraints:** 40 minutes, whiteboard available.
      *   **Requirements:**
          *   Do *not* explain the thesis to the user (they know it).
          *   Provide a teaching plan (order of ideas).
          *   Select *one* carrying example.
          *   Identify and pre-empt specific misconceptions (tools, group cognition, iPhone consciousness).
          *   Clarify dependencies (what depends on what).
          *   Positioning of the Parity Principle vs. Otto case.
          *   Structure (Internalist start vs. Positive view).
          *   Demarcate settled vs. contested claims.
          *   Acknowledge unresolved issues (mark of the cognitive, consciousness).
          *   **Tone/Style:** British English.

  2.  **Determine the Pedagogical Strategy:**
      *   *Time:* 40 minutes is tight. Need to be punchy. No long historical preamble.
      *   *Audience:* Interdisciplinary. Need to bridge the gap between functionalist philosophy and empirical science (psych/neuro) and social context (anthro).
      *   *Core Challenge:* EMT is often misunderstood as trivial ("of course we use tools") or wild ("my phone is conscious"). The goal is to land in the middle: it's about the *location* of cognitive processes, not just tool use or consciousness.
      *   *Structure:*
          1.  Hook/Problem (5 mins)
          2.  The Argument/Parity Principle (10 mins)
          3.  The Carrying Example (10 mins)
          4.  Objections/Misconceptions (10 mins)
          5.  Scope & Limits (5 mins)

  3.  **Select the Carrying Example:**
      *   *Option A:* Otto and his notebook (Classic).
      *   *Option B:* Tetris rotation (Clark's later work).
      *   *Option C:* Smartphone calculator (Modern).
      *   *Decision:* Stick with **Otto and the Notebook**. Why? It's the canonical text. Deviating confuses readers who might check the paper later. It isolates *memory* specifically, which is easier to grasp than perception or action. *However*, it needs to be presented carefully to avoid the "tool" misconception. I need to emphasise the *dispositional belief* aspect, not just the lookup.

  4.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-5 mins):**
          *   Don't start with "Today we discuss EMT." Start with a question about boundaries.
          *   Set the stage: Where does the mind stop?
          *   *Misconception Pre-emption:* Explicitly state what we are *not* talking about (consciousness, group minds).

      *   **The Argumentative Core (5-15 mins):**
          *   Start with Internalist Intuition (Inga).
          *   Introduce Parity Principle *before* Otto? No, Parity is the engine, Otto is the vehicle. Introduce Parity *through* the comparison.
          *   Actually, better flow: Inga (internal) -> Otto (external) -> Parity (the rule linking them).
          *   *Whiteboard:* Draw the brain/skull boundary vs. the functional boundary.

      *   **The Otto Case (15-25 mins):**
          *   Flesh out Otto. Crucial detail: The notebook must be *reliably available* and *automatically endorsed*.
          *   *Misconception Pre-emption:* This isn't just "using a tool." It's about the *status of the information*.
          *   *Dependency:* The conclusion (EMT) depends on Functionalism. Need to make that clear. If they reject functionalism, EMT falls.

      *   **Objections & Misconceptions (25-35 mins):**
          *   Address the "Triviality" objection (We know we use tools).
          *   Address the "Consciousness" objection (Phone isn't conscious).
          *   Address the "Coupling-Constitution" fallacy (Adams & Aizawa).
          *   *Settled vs. Contested:* Distinguish between "cognitive processes extend" (contested) vs. "cognitive systems couple" (settled/trivial).

      *   **Conclusion & Scope (35-40 mins):**
          *   What's left open? Consciousness (phenomenology). The Mark of the Cognitive.
          *   Why does it matter? (Methodology for psych/neuro/anthro).

  5.  **Refining the Content (Self-Correction/Polishing):**
      *   *British English:* Check spelling (programme, realise, centre, etc.) and idiom.
      *   *Settled vs. Contested:* This is crucial. Many think EMT is proven fact. It's a live debate. Adams & Aizawa are key critics. Need to mention the Coupling-Constitution fallacy explicitly as the main counter-argument.
      *   *The "One Example":* Stick rigidly to Otto. Don't dilute with Tetris or smartphones unless as a quick aside. Otto is the philosophical anchor.
      *   *Parity Principle Placement:* It works best *after* presenting Inga and Otto side-by-side. It justifies the move from "they behave the same" to "they are the same kind of process."
      *   *Misconceptions:*
          1.  *Triviality:* "It's just tool use." -> Counter: It's about belief attribution, not causal aid.
          2.  *Consciousness:* "Is the notebook conscious?" -> Counter: EMT is about processing/belief, not qualia (mostly).
          3.  *Group Cognition:* "Is the group the mind?" -> Counter: EMT is individualistic (usually), just extended spatially.

  6.  **Final Review against Constraints:**
      *   40 mins? Yes, the timing looks tight but feasible if disciplined.
      *   Whiteboard usage? Included in the plan.
      *   British English? Will ensure throughout.
      *   No explanation of thesis to user? Checked.
      *   Settled vs. Contested? Will add a specific section for this.

  7.  **Writing the Response:** (Mental check of tone: Collegial, precise, pedagogical.)
      *   *Opening:* Acknowledge the difficulty.
      *   *Structure:* Use clear headings.
      *   *Whiteboard:* Give specific instructions on what to draw.
      *   *Misconceptions:* Integrate them into the flow, not just a list at the end.
      *   *Settled/Contested:* Make a distinct table or list.

      *(Self-Correction during drafting)*: I initially thought about putting the Parity Principle first. But for a mixed audience, it's too abstract. Start with the *case* (Inga/Otto), then derive the *principle*. It's more inductive and engaging for scientists.
      *Wait, the prompt asks: "Where do I put the parity principle relative to the Otto case?"*
      *Decision:* Present Inga/Otto first to generate the intuition, *then* formalise it with Parity. This prevents them from treating Parity as an arbitrary axiom.

      *Another check:* "What depends on what?"
      *Dependency:* EMT depends on Functionalism. If mental states are defined by causal role, and the notebook plays the same role as biological memory, then it is a mental state. Must make this conditional clear.

      *Misconception timing:*
      *   "Tool use" -> Pre-empt during Otto setup (emphasise dispositional belief).
      *   "Consciousness" -> Pre-empt in the Scope/Limits section.
      *   "Coupling-Constitution" -> During Objections.

      *Settled vs. Contested:*
      *   Settled: Coupling is ubiquitous.
      *   Contested: Whether coupling implies constitution.

      *Let's assemble.*

  8.  **Final Polish:** Ensure British spelling (realise, programme, centre, modelling, etc.). Ensure tone is appropriate for a PhD student advising a peer.

      *(Final thought on the "One Example")*: The prompt asks for "the one example that should carry the whole thing". Otto is the only choice for a reading group on *Clark and Chalmers*. Using Tetris might be clearer cognitively, but it betrays the text they are supposed to be discussing. Stick to Otto but explain *why* Otto works (the belief attribution).

      *(Final thought on "Settled")*: Be careful. Nothing is truly "settled" in philosophy. Use "Working Consensus" or "Common Ground" instead of "Settled".

      *Okay, ready to write.*
answer: |-
  Here is a structured plan for your 40-minute session. It is designed to maximise engagement from non-philosophers while maintaining argumentative rigour.

  ### 1. The Strategic Overview

  **The Goal:** Move the audience from 'skin-skull internalism' to 'functionalism', then show how functionalism + reliability = extension.
  **The Dependency:** The Extended Mind Thesis (EMT) *depends entirely* on Functionalism. If your audience rejects functionalism (e.g., they are biological naturalists), EMT will not stick. You must make this conditional clear early.
  **The Carrying Example:** Stick with **Otto and his Notebook**. Do not switch to Tetris or smartphones. Otto is the canonical case; using something else invites confusion when they read the paper. However, you must present it carefully to avoid the 'tool' misconception.
  **Whiteboard Strategy:** Use the board to map *functional roles*, not just physical locations.

  ---

  ### 2. The Session Plan (40 Minutes)

  #### Phase 1: The Hook & The Boundary (0–5 mins)
  *   **Action:** Draw a head on the board. Draw a line at the skull.
  *   **Prompt:** Ask the room: "Why does the mind stop here?"
  *   **The Trap:** Most will say 'because the brain stops here'.
  *   **The Move:** Challenge the 'biological boundary' assumption. Suggest that if we define the mind by *what it does* (function) rather than *what it's made of* (substrate), the boundary might move.
  *   **Pre-empting Misconception (Consciousness):** State clearly now: "We are talking about *cognitive processing* and *belief attribution*. We are **not** asking if the notebook has feelings or qualia. If you're waiting for the argument that the notebook is conscious, you can relax. That is not the claim."

  #### Phase 2: The Inga/Otto Contrast (5–15 mins)
  *   **Narrative:** Tell the story of Inga and Otto.
      *   **Inga:** Hears of an exhibition at MoMA. Thinks. Recalls from biological memory. Walks there.
      *   **Otto:** Has Alzheimer's. Uses a notebook. Hears of exhibition. Consults notebook. Walks there.
  *   **Crucial Detail:** Emphasise the *dispositional* nature of Otto's belief. The information isn't just 'stored'; it is *reliably available* and *automatically endorsed*. He doesn't deliberate on whether to trust the notebook; it functions as memory does.
  *   **Whiteboard:** Draw two boxes.
      *   Box A (Inga): Stimulus -> Biological Memory -> Action.
      *   Box B (Otto): Stimulus -> Notebook -> Action.
  *   **The Question:** "Is there a *cognitive* difference between Box A and Box B?"
  *   **Pre-empting Misconception (Trivial Tool Use):** Anticipate the objection: "But the notebook is just a tool, like a cane."
      *   **Response:** "A cane extends your *reach*. EMT claims the notebook extends your *belief*. If Inga believes the museum is on 53rd Street before she leaves, does Otto believe it before he checks the book? Clark & Chalmers say yes. If you say no, you are privileging biology over function without a reason."

  #### Phase 3: The Parity Principle (15–20 mins)
  *   **Definition:** Now introduce the Parity Principle formally. *'If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognising as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process.'*
  *   **Placement:** Note that you introduced the *case* before the *principle*. This is vital. If you start with the principle, it sounds like an arbitrary rule. If you derive it from Inga/Otto, it looks like the best explanation of the case.
  *   **The Dependency:** Reiterate: This principle only holds if you accept **Functionalism**. If mental states are defined by their causal role, and the notebook plays the same causal role as biological memory, then it is part of the mind.
  *   **Whiteboard:** Erase the skull line. Draw a new boundary around Head + Notebook. Label it 'The Cognitive System'.

  #### Phase 4: Objections & The Coupling-Constitution Fallacy (20–30 mins)
  *   **The Heavy Hitter:** This is where you address the serious philosophical pushback, specifically Adams & Aizawa.
  *   **The Objection:** Just because two things are *coupled* (working together) doesn't mean they constitute the same thing.
      *   *Example:* A waiter couples with a tray to carry drinks. The tray does not become part of the waiter's digestive system or agency.
  *   **The Debate:** Clark & Chalmers argue Otto's notebook is *more* than coupled; it is integrated in a way that mimics internal memory (glue and trust conditions). Adams & Aizawa argue there is a 'mark of the cognitive' (e.g., intrinsic intentionality) that notebooks lack.
  *   **Audience Engagement:** Ask the neuroscientists/psychologists: "In your models, does it matter where the memory is stored, or only how the information is retrieved and used?"
  *   **Pre-empting Misconception (Group Cognition):** Someone from Anthropology might ask: "Does this mean the group is the mind?"
      *   **Response:** "Not necessarily. EMT is primarily about the *individual* cognitive system extending into the environment. Social extension is a further step (distributed cognition), but don't conflate the two here. Otto's mind is Otto's, even if part of it is in a book."

  #### Phase 5: Scope, Limits & Conclusion (30–40 mins)
  *   **What is Settled vs. Contested:** (See table below).
  *   **What We Are Not Settling:**
      1.  **The Mark of the Cognitive:** We don't agree on what makes something 'cognitive' vs 'non-cognitive'. EMT assumes a functional mark; critics assume a biological one.
      2.  **Consciousness:** EMT is about access and processing. It is neutral on whether phenomenology extends (though some argue it does).
      3.  **Normativity:** Does extending the mind change our ethical responsibilities? (Leave this as a teaser).
  *   **Closing:** "The value of EMT isn't necessarily that it's 'true' in a metaphysical sense, but that it forces us to stop assuming the skull is the default boundary for scientific explanation."

  ---

  ### 3. Settled vs. Contested (For your reference/board)

  You should explicitly draw this distinction on the board during Phase 5. It prevents students from thinking EMT is a proven fact or a mere metaphor.

  | **Working Consensus (Mostly Settled)** | **Genuinely Contested (Live Debate)** |
  | :--- | :--- |
  | **Coupling:** Cognitive agents rely heavily on environmental resources (tools, notes, devices). | **Constitution:** Does this reliance make the resources *part* of the mind, or just *causes* of mental states? |
  | **Functionalism:** Many cognitive processes are best described by their causal role, not their substrate. | **The Mark of the Cognitive:** Is there a intrinsic property (e.g., non-derived intentionality) that only biological brains possess? |
  | **Methodology:** Explanations in psych/neuro should account for environmental scaffolding. | **Consciousness:** Does the 'extended' part have phenomenological status? (Clark is sceptical; others differ). |
  | **Otto's Beliefs:** Otto is epistemically responsible for the notebook's content (it's not a guess). | **The Coupling-Constitution Fallacy:** Is EMT committing a category error by confusing causal connection with ontological constitution? |

  ---

  ### 4. Specific Misconception Management

  Here is exactly when to deploy the counters to the specific errors you mentioned:

  **1. "It's just the boring claim that we use tools."**
  *   **When:** Phase 2 (during Otto).
  *   **How:** Distinguish between *causal aid* and *constitutive part*. A calculator helps me do maths (aid). If I know the result is reliable and I endorse it without second-guessing, the storage of that number functions as *memory* (constitutive). The claim is about the *location of the belief*, not the utility of the tool.

  **2. "Clark and Chalmers are saying your iPhone is literally conscious."**
  *   **When:** Phase 1 (Introduction).
  *   **How:** Be blunt. "EMT is a thesis about the *vehicle* of cognition, not the *experience* of cognition. A camera extends my visual access, but the camera does not 'see'. Similarly, the notebook extends my memory, but it does not 'remember' in the phenomenological sense. We are discussing functional architecture, not qualia."

  **3. "This is a thesis about group cognition / anthropology."**
  *   **When:** Phase 4 (Objections).
  *   **How:** Clarify the unit of analysis. "EMT is methodologically individualistic. It claims *Otto's* mind extends. It does not claim the 'group' is a super-agent. That is 'Distributed Cognition' or 'Socially Extended Mind', which are related but distinct debates. Don't let the two blur."

  ### 5. Whiteboard Layout Guide

  1.  **Left Side:** Draw Inga (Brain) and Otto (Brain + Book). Map the causal chain: *Question -> Retrieval -> Answer*. Show they are isomorphic.
  2.  **Centre:** The Parity Principle. Write it out. Underline "were it done in the head".
  3.  **Right Side:** The "Coupling vs. Constitution" distinction. Draw a magnet and a paperclip (coupled) vs. a merged alloy (constituted). Ask: "Which one is Otto and the Book?"
  4.  **Bottom:** The "Not To Do" list. (No consciousness claims, no group mind conflation, no trivial tool use).

  ### 6. Final Advice for the Facilitator

  *   **Don't defend Functionalism too hard:** If a neuroscientist says, "But biology matters," acknowledge it. Say, "If you reject functionalism, EMT fails. But if you accept functionalism, you must accept EMT. The debate is really about Functionalism." This shows philosophical sophistication.
  *   **Watch the Clock:** The Coupling-Constitution objection can eat 20 minutes. Cut it off at 30 minutes to ensure you cover the 'Scope & Limits'.
  *   **British English:** Ensure you spell 'realise', 'programme', 'centre', 'modelling' correctly in any handouts or board notes. Use "whilst" sparingly but naturally.

  Good luck. It's a classic paper, but it requires careful handling to stop it from sounding either trivial or insane.
