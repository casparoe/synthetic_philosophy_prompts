  7.  **The Causal Lever:** We intervene on a specific neuron cluster, changing the system's "belief" about rain, altering its behavior.
      A: This proves the belief was real.
      B: This proves only causal leverage, not content.
      C: This proves nothing about belief.

  8.  **The Evolutionary Analog:** A robot evolved via genetic algorithms avoids fire.
      A: It fears fire functionally.
      B: It avoids fire mechanistically.
