  This instrument sorts your intuitions about whether artificial systems literally possess mental states or whether such attributions are merely explanatory tools.

  **Instructions:** For each scenario, select the option that best reflects your judgment. Answer instinctively; consistency matters more than correctness. There are no right answers, only consistent profiles.

