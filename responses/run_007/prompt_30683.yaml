      *   *Wait, Claim (4)* relies on (3). If I change (3) to be about robustness, (4) still holds (trust less because less robust). So modifying (3) is the efficient path.

      *   *Wait, let's look at (2).* "they genuinely believe." If (3) says their content is indeterminate, does that negate "genuine"? (1) says if stance works, they believe. (2) says stance works. So (2) follows (1). (3) adds a property to the belief.
      *   The conflict is definitely (1)'s anti-realism vs (3)'s realism about grounding.

