      *   *Revision:* Rewrite (3) to be consistent with Dennett. "Human belief attribution is more robust because our causal contact allows the intentional stance to remain predictive across a wider range of novel situations involving physical objects, whereas LLMs are limited to the textual manifold." This removes the "indeterminate content" metaphysical claim and replaces it with a "predictive robustness" claim, which fits (1).

