      *   **Secondary Tension:** (2) vs. (4). If they genuinely believe (2), why trust less (4)? (Resolved by 3, but 3 is problematic).
      *   **Ranking:** (1)/(3) is Critical. Others are derivative.
      *   **Revision:** Modify (3) to align with (1)'s instrumentalism. Focus on *predictive robustness* rather than *metaphysical determinacy*.
      *   **Mind-Changer:** Evidence of LLMs having causal coupling (multimodal, robotics) or evidence that human content is equally indeterminate.

  8.  **Refining the "Mind-Changer":**
      *   What would make me say they *are* consistent?
