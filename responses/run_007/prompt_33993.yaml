answer: |-
  This is a classic philosophical deadlock, and your frustration is well-founded. You have stumbled upon one of the central impasses in analytic aesthetics, often framed as the debate between **Aesthetic Empiricism** (your position) and **Historical/Contextualism** (your friend's position).

  Your working hypothesis—that you are answering different questions—is partially correct, but it is not deep enough. The disagreement is not merely about which *question* to ask (intrinsic properties vs. fittingness of attitudes); it is a disagreement about the **ontology of the artwork** and the **supervenience base of aesthetic properties**.

  Here is a diagnosis of the structure of this debate, why it freezes, and whether it can be broken.

  ### 1. The Ontological Disagreement: Object vs. Action
  The first layer of the impasse is that you and your friend are not evaluating the same entity, despite pointing at the same canvas.

  *   **Your Position (The Object View):** You treat the artwork as a **physical particular** (or a structure of visual properties). On this view, the artwork is essentially the generated surface. If the surface is identical, the work is identical. This aligns with a formalist tradition (akin to Clive Bell's "Significant Form" or early Monroe Beardsley), where the aesthetic object is defined by its capacity to generate a specific kind of experience.
  *   **Your Friend's Position (The Action View):** Your friend treats the artwork as an **artifact of a specific generative action**. This aligns with Arthur Danto's "Artworld" theory and Jerrold Levinson's "Historical Definition of Art." For them, a work of art is not just a thing; it is a thing *plus* a specific history of creation (who made it, when, and in relation to what prior art).

  **The Diagnosis:** When you say "the object's intrinsic properties are unchanged," you are assuming the work *is* the object. When your friend says "it is not the achievement it appeared to be," they are asserting the work *is* the achievement.
  *   If the work is the *object*, the forgery is the same work (or an indiscernible duplicate), and value should hold.
  *   If the work is the *action*, the forgery is a fundamentally different work (a 1992 act of copying vs. a 1660s act of creation), and value collapses because the object of evaluation has changed.

  You are talking past each other because you are disagreeing on the **identity conditions** of the artwork before you even get to the value judgment.

  ### 2. The Supervenience Disagreement: Intrinsic vs. Relational Properties
  Even if we grant that you are both talking about "value," you disagree on what aesthetic properties *are*. This is the debate over **supervenience**.

  *   **Your Claim (Aesthetic Empiricism):** Aesthetic properties (beauty, balance, power) supervene **only** on the intrinsic, perceptual properties of the object. If two objects are perceptually indistinguishable, they must possess the same aesthetic properties. Therefore, they must have the same aesthetic value.
  *   **Your Friend's Claim (Goodmanian Contextualism):** Following Nelson Goodman (*Languages of Art*), your friend argues that aesthetic properties are **relational**. A property like "being vigorous" or "being derivative" does not supervene on the paint alone; it supervenes on the paint *plus* its history of production.

  Goodman argues that knowing the history of production is not an external addition to the experience; it determines which aesthetic properties the object actually possesses. A brushstroke is "bold" if it was a risk taken by a pioneer; it is "mimetic" if it was a calculated replication by a copyist.

  **The Diagnosis:** You believe history is *external* to the aesthetic property (affecting only price or prestige). Your friend believes history is *constitutive* of the aesthetic property (affecting the description of the work itself). You cannot resolve this by pointing to the photons, because your friend denies that aesthetic properties are reducible to photon patterns.

  ### 3. The Empirical Red Herring
  You asked: *If we could show that learning an object is a forgery alters perceptual experience itself... would that settle the debate?*

  The answer is **no**, and this is where many attempts to solve the puzzle fail. This is the contribution of **Kendall Walton** ("Categories of Art").

  Walton argues that knowing the history (e.g., that this is a painting, not a relief sculpture; or that it is a 1992 forgery, not a 1660 original) changes the **category** under which we perceive the work. Changing the category changes the perception itself. A painting that looks "static" under the category of *photograph* might look "dynamic" under the category of *painting*.

  *   **If empirical psychology shows perception changes:** Your friend says, "I told you so; the aesthetic experience is different." You reply, "That is a cognitive bias, not a rational aesthetic judgment. The *ideal* observer should be able to strip away that knowledge."
  *   **If empirical psychology shows perception stays the same:** You say, "I told you so; the experience is identical." Your friend replies, "The experience is irrelevant; the *status* of the achievement is what we value."

  **The Diagnosis:** Empirical data cannot bridge the **Normative Gap**. Even if provenance *does* alter perception (fact), the question remains: *Ought* it to? (value).
  *   You argue the *ideal* aesthetic judgment should ignore provenance (Pure Perception).
  *   Your friend argues the *correct* aesthetic judgment must include provenance (Informed Perception).
  This is a clash of norms, not facts. No fMRI scan can tell us whether we *should* value achievement over experience.

  ### 4. The Core Conflict: Two Concepts of "Value"
  The stalemate persists because the word "Value" (or "Good") is doing double duty. You are debating without distinguishing between two distinct normative frameworks:

  1.  **Phenomenological Value:** The capacity of the object to generate a rich, rewarding sensory or emotional experience. (Your domain).
  2.  **Art-Historical Value:** The capacity of the object to stand as a significant node in the narrative of human creative achievement. (Your friend's domain).

  **Why the Impasse is Permanent:**
  The debate is frozen because it is ultimately a disagreement about the **Function of Art**.
  *   **Your Framework:** Art is a **technology of experience**. Its purpose is to deliver a specific quality of consciousness to the viewer. If the delivery mechanism works, the source code (provenance) is irrelevant.
  *   **Your Friend's Framework:** Art is a **form of communication/action**. Its purpose is to connect the viewer to the agency of the creator. If the connection is severed (because the creator is not who we thought), the communication is a lie, and the value is void.

  Neither side can win because neither can prove the other's definition of "Art's Function" is wrong. It is a clash of bedrock intuitions.

  ### 5. Is There a Move That Breaks the Stalemate?
  There is one philosophical move that does not "solve" the problem but dissolves the confusion enough to allow progress. It comes from distinguishing **Aesthetic Properties** from **Artistic Properties**, a distinction championed by philosophers like **Frank Sibley** and refined by **Nick Zangwill**.

  *   **Aesthetic Properties:** (e.g., delicate, garish, balanced). These *might* supervene on intrinsic properties. You are right that these may not change.
  *   **Artistic Properties:** (e.g., original, derivative, influential, pioneering). These *necessarily* supervene on historical context. Your friend is right that these change drastically.

  **The Reframing:**
  The stalemate breaks if you concede that **Artistic Value** has collapsed while maintaining that **Aesthetic Value** remains intact.
  *   **You concede:** The painting is no longer *artistically* great. It is not a masterpiece of innovation or historical significance. It is a derivative work.
  *   **Friend concedes:** The painting remains *aesthetically* pleasing. It still provides a sublime visual experience.

  **Why this doesn't fully satisfy:**
  Your friend will likely resist this distinction. They will argue that in the context of *Art* (capital A), Artistic Value swallows Aesthetic Value. A beautiful forgery is aesthetically pleasing but artistically null, and since we are in a museum (an institution of Art), we are judging Artistic Value.
  You will resist because you feel this devalues the actual experience of looking, reducing the museum to a history lesson rather than a place of contemplation.

  ### Conclusion: What the Impasse Tells Us
  The impasse is permanent because it reveals that "Art" is not a natural kind with a single function. It is a cluster concept holding together two competing human interests:
  1.  The interest in **sensory richness** (which favors your view).
  2.  The interest in **human agency and narrative** (which favors your friend's view).

  **The Diagnosis:** You are not talking past each other; you are fighting over which interest gets to define the institution of Art.
  *   If Art is primarily about **Experience**, you win.
  *   If Art is primarily about **Achievement**, your friend wins.

  **The Challenge:**
  To move forward, you must stop arguing about the *painting* and start arguing about the *museum*. Ask your friend: "If we stripped this museum of all labels and history, and just hung the canvases, would the experience be impoverished?"
  *   If they say **No**, they are secretly an Empiricist (like you), and their insistence on provenance is merely about financial/historical categorization, not aesthetic value.
  *   If they say **Yes**, they are a Contextualist, and you must accept that for them, art is inherently cognitive/historical, not purely perceptual.

  The debate freezes because both sides assume their definition of Art is the *only* definition. The stalemate only lifts when you acknowledge that you are advocating for two different, incompatible, yet equally human ways of valuing objects. The tragedy of the forgery is not that the value is lost, but that it reveals we cannot decide which value matters more.
