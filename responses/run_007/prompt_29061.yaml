answer: |-
  This is a classic "grown-up" problem in the free will debate, and your frustration is well-placed. You have correctly identified that the traditional metaphysical levers (determinism, sourcehood, alternate possibilities) have been pulled until they broke, yet the policy conclusions remain divergent.

  Your hypothesis about "fixed points" is insightful, but I think it underestimates the normative stakes. If this were merely a methodological disagreement about reflective equilibrium, we could resolve it by agreeing on a method. The reason you can't find the disagreement is that it is **overdetermined**. It is a hybrid dispute masquerading as a metaphysical one.

  Here is a diagnosis of the impasse, followed by concrete paths for progress that might actually move the needle for a dissertation.

  ### 1. The Diagnosis: A Three-Layered Disagreement

  The debate feels stuck because Dennett and Caruso are talking past each other on three distinct levels, while pretending to argue on one.

  **Layer 1: The Semantic Stipulation (The Verbal Dispute)**
  You suspected this, and you're right, but it's more specific than just "desert."
  *   **Dennett** is engaging in **Conceptual Revisionism/Engineering**. He is arguing that the *concept* of desert we should use is the functional one. He is willing to sacrifice the "ultimate" metaphysical grounding to save the *practice*. For Dennett, "desert" just means "eligibility for reactive attitudes within a functional system."
  *   **Caruso** is engaging in **Conceptual Abolitionism** regarding *Basic Desert*. He insists that if a concept of desert lacks a specific metaphysical grounding (control/origination), it is morally toxic and should be discarded, even if we keep a functional analogue of responsibility.
  *   **The Impasse:** Dennett says, "I've saved the concept." Caruso says, "You've saved the word, but killed the thing that matters (the moral justification for retribution)." This is verbal, but it has substantive consequences because the *label* "desert" carries rhetorical and legal weight.

  **Layer 2: The Hidden Empirical Bet (The Psychological Dispute)**
  This is the layer most often ignored. Both claim to be pragmatic, but they rely on opposing empirical predictions about human psychology.
  *   **Dennett's Bet:** The *phenomenology* of blame and desert is a necessary feature of the social technology. If you tell people "no one deserves punishment," the deterrent and rehabilitative efficacy of the system collapses. The *sting* of blame is a feature, not a bug.
  *   **Caruso's Bet:** We can decouple the *consequences* (quarantine/safety) from the *condemnation* (blame). He believes a public health model can maintain social order without the retributive rhetoric, and that removing the retributive element reduces recidivism and social alienation.
  *   **The Impasse:** They aren't arguing facts; they are arguing **counterfactuals about social engineering**. Neither has definitive proof that their preferred linguistic framework yields better societal outcomes.

  **Layer 3: The Axiological Clash (The Normative Dispute)**
  This is the bedrock. Even if you settled the semantics and the empirical psychology, they prioritize different moral goods.
  *   **Dennett** prioritizes **Social Cohesion and Efficacy**. He is a Humean pragmatist. If the practice of holding responsible sustains the "manifest image" and allows society to function, it is justified. The harm of punishing someone who "couldn't do otherwise" is outweighed by the harm of a society that cannot hold anyone accountable.
  *   **Caruso** prioritizes **Fairness and Protection from Luck**. He is more Kantian/Rawlsian here. It is fundamentally unjust to inflict hard treatment (stigma, prison) based on factors outside control (genetics, environment), regardless of social utility. The harm of punishing the "luckily determined" outweighs the risk of social friction.

  ### 2. Why the "Fixed Points" Hypothesis wasn't Enough
  You suggested Dennett treats practices as data and Caruso treats them as the *explanandum* to be explained away. That's close, but Caruso also treats practices as data—he just thinks the data shows the practices are harmful.
  The real methodological split is **Conservatism vs. Revisionism**. Dennett applies a presumption of innocence to our folk practices (innocent until proven dysfunctional). Caruso applies a presumption of guilt to our folk practices (guilty of relying on magic thinking until proven otherwise).

  ### 3. Paths for Progress (How to Unstick Your Dissertation)

  Since the metaphysical route is exhausted, your contribution needs to come from one of the three layers above. Here are three specific avenues for progress:

  **A. The Conceptual Engineering Route (Addressing Layer 1)**
  Stop asking "Who is right about desert?" and ask "Which concept is more *useful*?"
  *   **The Project:** Adopt the Carnapian/Haslanger framework. Don't ask if Dennett's definition is *true*. Ask if it is *fit for purpose*.
  *   **The Move:** Argue that Caruso is right that "Basic Desert" is incoherent, but Dennett is right that we need the *practice*. Can we engineer a new term? "Forward-looking Accountability"?
  *   **The Contribution:** Show that the *word* "desert" is the poison. If Dennett dropped "desert" and kept "accountability," would Caruso still object? If yes, the dispute is purely normative. If no, it's semantic. Your job is to map the boundary where the semantic shift fails to satisfy the normative concern.

  **B. The Empirical Turn (Addressing Layer 2)**
  This is the riskiest but most high-reward path. You need to interrogate the **Efficacy of Stigma**.
  *   **The Project:** Look at the literature on "free will skepticism and behavior" (Vohs, Schooler, Baumeister, etc.).
  *   **The Move:** Design a thought experiment or literature review that isolates the *rhetoric* of desert from the *consequence* of punishment. Does a judge saying "You deserve this" change the outcome compared to "You are dangerous and need containment"?
  *   **The Contribution:** If you can show that the *retributive rhetoric* is causally inert (i.e., people obey the law because of the threat of loss of liberty, not the moral condemnation), Dennett's pragmatic defense crumbles. If you show that removing condemnation leads to chaos, Caruso's public health model crumbles. Most PhDs wave hands here; if you can rigorously analyze the empirical claims, you break the stalemate.

  **C. The Political Legitimacy Route (Addressing Layer 3)**
  Move the debate from Metaphysics to Political Philosophy.
  *   **The Project:** Frame punishment not as "what the offender deserves" but as "what the state is permitted to do."
  *   **The Move:** Use a legitimacy framework (like R.A. Duff or Matt Matravers). Even if Caruso is right that no one *deserves* pain, does the state have a right to defend itself using the *language* of desert?
  *   **The Contribution:** Argue that Dennett is actually making a **Political** claim disguised as a Metaphysical one. He is arguing that the *State* needs the concept of desert to maintain legitimacy in the eyes of the populace (the victims, the voters). Caruso is arguing from the perspective of the *Accused*.
  *   **The Resolution:** The impasse dissolves if you admit they are solving different problems. Dennett: "How do we keep society together?" Caruso: "How do we protect the individual from state violence?" Your thesis could argue that a complete theory requires solving the tension between these two political goals, not the metaphysics of free will.

  ### 4. Is the Impasse the Conclusion?
  It might be. But that's a publishable result.
  If you can rigorously demonstrate that the Dennett/Caruso debate is **not resolvable via argument** because it rests on a fundamental trade-off between **Social Utility (Dennett)** and **Individual Fairness (Caruso)**, you have made a significant contribution.
  You would be showing that the "Free Will" debate has exhausted its explanatory power and has morphed into a **Political Theory** debate about the limits of state coercion.

  **My Recommendation:**
  Go with **Option C (Political Legitimacy)** with a dash of **Option A (Conceptual Engineering)**.
  1.  Grant Caruso that Basic Desert is dead (metaphysically).
  2.  Grant Dennett that the Practice is necessary (sociologically).
  3.  Argue that the conflict is about **Legitimacy Conditions**. Under what conditions is it permissible for the State to use the *fiction* of desert (Dennett) to achieve safety, knowing it violates the *truth* of control (Caruso)?

  This moves you out of the "compatibilism vs. skepticism" trench warfare and into fresh territory regarding the ethics of social regulation. That is where the philosophy is moving, and that is where your dissertation will have traction.
