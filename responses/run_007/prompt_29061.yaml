      *Refining the "Fixed Points" point:* Dennett uses a Wide Reflective Equilibrium (keep practices, tweak theory). Caruso uses a Narrower one or an Error Theory (theory dictates practice change). But actually, Caruso is also pragmatic (Public Health). So both are pragmatic. The difference is *which harms count*. Dennett counts the harm of *losing the practice*. Caruso counts the harm of *unjust punishment*.

