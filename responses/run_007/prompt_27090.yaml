answer: |-
  # Seminar Plan: The "Sheep in the Field" Simulation
  **Course:** Upper-Level Epistemology  
  **Time:** 80 Minutes  
  **Students:** 14  
  **Goal:** Induce a Gettier intuition (Justified True Belief without Knowledge) through lived experience before introducing the terminology.

  ## I. Design Choices & Rationale
  1.  **The Case:** I am using a visual variant of the classic **Sheep in the Field** case (Chisholm/Gettier).
      *   *Why:* It separates the *object of perception* (the fake sheep) from the *truth-maker* (the real sheep) cleanly. It avoids the complexities of testimony or memory which introduce confounding variables about trust.
  2.  **The Mechanic:** A **Token Wager**. Students must stake "Epistemic Credits" on the truth of a proposition.
      *   *Why:* Passive observation allows students to remain detached. Betting forces *commitment*. If they lose tokens, they feel the injustice of the "win."
  3.  **The Proposition:** Existential, not specific. "There is at least one sheep in this image."
      *   *Why:* If the proposition were "That object is a sheep," the belief would be *false*. By making it existential ("Is there a sheep?"), the belief becomes *true* (because of the hidden real sheep), but the justification remains tied to the fake one.
  4.  **The Limitation:** I am explicitly flagging in the debrief that *frustration* is not identical to *epistemic luck*. The game simulates the structural gap, not the internal phenomenological state of a Gettiered subject (who usually feels no luck involved).

  ## II. Materials to Prep
  1.  **The Images (Projected):**
      *   **Image A (The Evidence):** A high-res photo of a grassy field. In the foreground, a Shetland sheepdog groomed to look exactly like a sheep. In the background, behind a small rise/hill, the top half of a *real* sheep is visible but easily missed (looks like a white blur).
      *   **Image B (The Reveal):** The same photo, but with arrows. Arrow 1 points to the dog: "Fake (Dog)." Arrow 2 points to the blur: "Real (Sheep)."
  2.  **The Tokens:** 10 poker chips (or printed paper slips) per student.
  3.  **The Betting Sheet:** A simple half-sheet handout with two columns: **TRUE** / **FALSE**. Students must circle one and sign it.
  4.  **The Proposition Handout:** A slip that reads: *Proposition P: "There exists at least one sheep in Image A."*

  ## III. Minute-by-Minute Timeline

  ### Phase 1: Setup & Stakes (0:00 – 0:10)
  *   **0:00–0:05:** Distribute tokens (10 per student) and Betting Sheets. Do not mention epistemology, knowledge, or justification.
  *   **0:05–0:10:** Explain the game. "You are visual auditors. I will show you an image. You must determine the truth value of Proposition P. If you bet correctly, you double your wager. If incorrectly, you lose it. You must wager at least 5 tokens. You have 2 minutes to decide once the image is shown."

  ### Phase 2: The Evidence & Commitment (0:10 – 0:25)
  *   **0:10–0:12:** Project **Image A**. Give them 60 seconds of silent observation.
      *   *Instructor Script:* "Look closely. Assess the evidence available to you."
  *   **0:12–0:15:** Hand out **Proposition P**. "There exists at least one sheep in Image A."
  *   **0:15–0:20:** **Forced Choice.** Students must mark their Betting Sheet (TRUE/FALSE) and stack their tokens (5–10) in the center of their desk.
      *   *Constraint:* No talking. Collect the sheets immediately after time is called.
  *   **0:20–0:25:** Gather the sheets. Build tension. "Most of you seem confident. Let's verify the truth."

  ### Phase 3: The Reveal & The Twist (0:25 – 0:35)
  *   **0:25–0:27:** Project **Image B** (The Reveal).
      *   Show that the foreground object is a dog (Fake).
      *   Show that the background object is a real sheep (True).
  *   **0:27–0:30:** Announce the Result. "The Proposition was **TRUE**. There is a sheep in the image. Everyone who bet TRUE wins."
  *   **0:30–0:35:** **The Discomfort.** Return the tokens. Do not explain *why* it feels weird yet. Ask them to write down one sentence on a sticky note: *"Why does this win feel unsatisfying?"* Collect the notes.

  ### Phase 4: Small Group Processing (0:35 – 0:50)
  *   Break into 7 pairs.
  *   **Prompt 1:** "Did you *know* there was a sheep? Or did you just get lucky?"
  *   **Prompt 2:** "What piece of information, if you had it *before* betting, would have changed your wager?" (Target answer: "That the thing I saw was a dog.")
  *   **Prompt 3:** "Was your belief justified? Why/Why not?"
  *   *Instructor Role:* Circulate. Listen for phrases like "accident," "wrong reasons," "misleading evidence." Do not correct them.

  ### Phase 5: The Debrief & Theory Mapping (0:50 – 1:20)
  *   **0:50–1:00:** **Naming the Beast.**
      *   Write **JTB** on the board.
      *   Map the game:
          *   **Belief:** You bet TRUE.
          *   **Truth:** There was a sheep (background).
          *   **Justification:** Visual evidence (foreground looked like a sheep).
      *   Introduce the term **Gettier Problem**. "You had JTB. Did you have Knowledge?" (Consensus: No).
  *   **1:00–1:10:** **Diagnosis 1: The No-False-Lemma Condition.**
      *   Ask: "What assumption did you make to get from 'I see a sheep-shape' to 'There is a sheep'?"
      *   Target: "I assumed the object I was looking at was a sheep."
      *   Explain: This is a **False Lemma**. Your reasoning chain was: *1. I see an object. 2. That object is a sheep. 3. Therefore, there is a sheep in the field.* Premise 2 was false.
      *   *Theory:* Some philosophers argue Knowledge = JTB + **No False Lemmas**.
  *   **1:10–1:15:** **Diagnosis 2: The Defeater Condition.**
      *   Ask: "If I had told you 'The foreground object is a dog' *before* you bet, would you have kept your wager?" (Most will say No/Unsure).
      *   Explain: That information is a **Defeater**. It destroys your justification.
      *   *Theory:* Other philosophers argue Knowledge = JTB + **No Undefeated Defeaters**. Your justification was "defeated" by the fact of the dog, even if you didn't know about the dog.
  *   **1:15–1:20:** **Limitations & Closing.**
      *   Address the "Felt Difference." "In this game, you felt tricked by me. In a real Gettier case, the subject doesn't feel tricked; they just lack knowledge. The game simulates the *structure* of the error, not the *feeling* of the agent."
      *   Assign reading (Gettier's 1963 paper) to formalize what they just lived.

  ## IV. Predictable Failure Modes & Handling

  **Failure Mode 1: "My belief wasn't justified."**
  *   *Student:* "I shouldn't have trusted a photo. That's not real justification."
  *   *Handle:* "Fair. But in epistemology, perceptual evidence is usually prima facie justified. If you look at a chair, you're justified in believing it's a chair. If we lower the bar for justification too much, skepticism wins. For the sake of the argument, accept that seeing a sheep-shape is *normally* good enough evidence. Does that make the discomfort go away?"
  *   *Goal:* Force them to accept the Justification condition to isolate the Gettier problem.

  **Failure Mode 2: "I didn't believe *that* sheep, I believed *this* sheep."**
  *   *Student:* "The proposition was 'There is a sheep.' I meant the one in the front. Since that one doesn't exist, my belief was false."
  *   *Handle:* "You are gerrymandering the content of the belief. The proposition on the sheet was existential: 'At least one.' If we allow you to change the proposition after the fact to save your intuition, we're protecting the theory by changing the data. Stick to the proposition as written."
  *   *Goal:* Prevent them from dissolving the problem by redefining the belief.

  **Failure Mode 3: "I knew it was a trick."**
  *   *Student:* "I suspected you were lying, so I bet TRUE just to win tokens."
  *   *Handle:* "Check your sticky note. Did you write 'I suspected a trick' as your reason for dissatisfaction? If you bet on a hunch that I was rigging the game, that's a different kind of luck. But most of you bet based on the image. We're analyzing the majority case."
  *   *Goal:* Isolate the epistemic agents who acted in good faith.

  ## V. The One Thing The Game Can't Reproduce
  **The Phenomenology of Luck.**
  In the simulation, the students know they were Gettiered *after the fact*. They feel the luck because I revealed the mechanism. In a real-world Gettier case, the subject *never finds out* they were Gettiered. They walk around thinking they have knowledge.
  *   **Compensation:** I must explicitly state this in the closing (1:15–1:20). "The discomfort you feel is the *philosopher's* discomfort, not the *agent's*. The agent in a Gettier case feels perfectly rational. The problem is that *we*, looking at their state, deny them knowledge. You are currently in the position of the philosopher judging the case, not the subject living it."

  ## VI. Instructor Checklist for Rigging
  1.  **Photoshop:** Ensure the "real sheep" in the background is visible enough to be truth, but obscure enough to be missed. If it's too obvious, they'll claim they saw it (Justification becomes valid). If it's too hidden, they'll claim the Truth is dubious. *Test this on a colleague first.*
  2.  **Token Collection:** Collect the Betting Sheets *before* the Reveal. If they hold onto them, they might change their marks when they see Image B.
  3.  **Authority:** Maintain a neutral "Auditor" persona during the game. Do not hint at the trick. The betrayal must feel institutional, not personal.

  ## VII. Why This Design Works
  *   **No Lecture:** The theory emerges from the complaint.
  *   **Forced Choice:** The token bet prevents "I didn't really believe it" hedging.
  *   **Two Diagnoses:** The visual nature makes the "False Lemma" (That's a sheep) and the "Defeater" (It's actually a dog) intuitively accessible without dense logic notation.
  *   **Scalable:** Works for 14 or 40 students with the same projection setup.

  This plan turns the abstract "Gettier Problem" into a concrete "Wait, I won but I shouldn't have" moment, anchoring the subsequent theory in a shared emotional experience.
