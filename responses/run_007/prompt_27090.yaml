  *   **Evidence:** A GPS Log printout showing Agent K's phone in Building A at 10:00 AM.
  *   **Truth:** Agent K *is* in Building A at 10:00 AM. (Verified by Agent K walking in or a live video feed).
  *   **Twist:** The GPS Log is from *yesterday*. (False Lemma). Agent K happens to be in the same spot today.
  *   *Wait, getting Agent K to be in the exact spot is hard.*
  *   *Let's go back to the Parking Receipt but make it about a generic "Professor."*
  *   *Actually, the most robust Gettier for a classroom is the "Sheep/Fake Sheep" visual.*
  *   *Let's try to make the Visual work for 14 people.*
  *   *Handout:* A photo of a field. "Is there a sheep in this field?"
  *   *Rig:* The photo shows a dog that looks like a sheep. (So belief "There is a sheep" is based on seeing the dog).
  *   *Truth:* There *is* a sheep behind the dog (revealed in a second photo).
  *   *This is the classic Chisholm/Gettier sheep case.*
  *   *Why I hesitated:* Students might say "I believed there was a sheep *there* (pointing to dog)."
  *   *Fix:* The question is "Is there *at least one* sheep in the field?"
  *   *Justification:* "I see a sheep-shaped object."
  *   *Truth:* Yes, there is one (hidden).
  *   *False Lemma:* "The object I see is a sheep."
  *   *This is the cleanest philosophically.* I will build the lesson around this visual case but gamify it with tokens.

