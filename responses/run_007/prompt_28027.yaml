prompt: |-
  I teach an upper-level undergraduate seminar called "Rationality and Social Knowledge" — about 18 students, mostly philosophy and economics majors, meeting for 75 minutes. I want to run an in-class game that makes them experience an information cascade: the situation where each person, observing the choices of those who acted before them, rationally decides to ignore their own private information and follow the crowd, even though the crowd's choices rest on remarkably little evidence.

  Design the activity in full. Include the setup (what materials, what the students know and do not know about the state of the world), the rules (who moves in what order, what each person observes before deciding), a payoff scheme that does not require real money, and a timeline that fits a 75-minute session with multiple rounds. The activity should be structured so that cascades form naturally from the students' own reasoning — they should feel the pull of the inference themselves before anyone names it, and ideally they should be surprised, on reflection, at how little information the group's consensus actually rested on.

  Then provide a debrief plan. It should map specific moments in the activity onto the formal structure: private signals, the Bayesian updating rule that a rational agent would use, the point at which the accumulated public information overwhelms any single private signal, and why a rational agent at that point should disregard their own signal even if it points the other way. Also address the following:

  (a) What predictably goes wrong the first time someone runs this — students who try to be contrarian for its own sake, students who do not understand the probabilistic reasoning and treat it as a guessing game, cascades that form too quickly or never break — and how to handle each.

  (b) What the activity cannot reproduce about real-world information cascades, so that I know what I will need to supply in discussion rather than expecting the game to teach it.

  (c) How to use the debrief to distinguish information cascades sharply from related but distinct phenomena — conformity, reputation-based herding, and groupthink — so that students leave with a precise sense of what makes an information cascade specifically an information cascade, and why the rationality of the individual decisions is part of what makes the phenomenon unsettling.
reasoning: |-
  Here's a thinking process that leads to the suggested activity and debrief plan:

  1.  **Analyze the Request:**
      *   **Course:** Upper-level undergraduate seminar ("Rationality and Social Knowledge").
      *   **Students:** ~18 students, Philosophy & Economics majors.
      *   **Time:** 75 minutes.
      *   **Goal:** Run an in-class game demonstrating an *information cascade*.
      *   **Key Requirements:**
          *   Full activity design (setup, rules, payoffs, timeline).
          *   Cascades must form naturally from rational reasoning.
          *   Debrief plan mapping activity to formal theory (Bayesian updating, signal overwhelming).
          *   Address potential pitfalls (contrarians, confusion, cascade timing).
          *   Address limitations (what the game *doesn't* teach).
          *   Distinguish cascades from conformity/reputation/groupthink.

  2.  **Deconstruct the Information Cascade Model (Bikhchandani, Hirshleifer, Welch - BHW):**
      *   **State of World:** Binary (e.g., Urn A vs. Urn B, or Good vs. Bad Investment).
      *   **Private Signal:** Each agent gets a noisy signal correlated with the state (e.g., draw a ball, flip a biased coin).
      *   **Public Action:** Each agent announces a decision based on private signal + previous public actions.
      *   **Rationality:** Agents maximize expected utility (accuracy).
      *   **The Cascade:** At some point, the weight of public actions outweighs the weight of one private signal. Agent $n$ ignores their signal and follows the crowd. Agent $n+1$ sees this, realizes $n$ ignored their signal, so $n$'s action adds no *new* information, but the public history remains dominant. The cascade continues.

  3.  **Designing the Activity:**
      *   **Materials:** Need a way to generate private signals secretly. Colored chips in an urn is the classic BHW setup.
      *   **State:** Two urns. Urn A (2/3 Red, 1/3 Blue), Urn B (1/3 Red, 2/3 Blue). Or simpler: A "Good" state (High probability of 'a') vs. "Bad" state (High probability of 'b'). Let's use Urns for tangibility.
      *   **Payoffs:** Needs to incentivize accuracy, not contrarianism. Points toward a grade bonus or just bragging rights. Since it's upper-level, intellectual satisfaction + small tangible reward (candy/stickers) works. Let's use a "Course Credit Point" system (e.g., top scorers get a small homework pass or extra credit point). *Correction:* To avoid ethical issues with grading, use a "Prize Pool" (candy/chocolate) for the best performers.
      *   **Sequence:** 18 students is perfect. One round takes about 3-5 minutes. We can do 3-4 rounds.
      *   **Visibility:** Students need to see previous decisions. Whiteboard or projected sheet.
      *   **Privacy:** Crucial. They must draw privately and decide privately before announcing.

  4.  **Drafting the Procedure:**
      *   *Setup:* Explain the Urns. Show the contents.
      *   *Round 1:* Student 1 draws, looks, announces "A" or "B". Student 2 draws, looks, sees S1's announcement, decides...
      *   *Reveal:* After the chain, reveal the actual Urn.
      *   *Payoff:* Points for correct guess.
      *   *Timeline:*
          *   0-10: Intro & Rules.
          *   10-40: Game Rounds (3 rounds x 10 mins).
          *   40-75: Debrief & Theory.

  5.  **Refining the "Rationality" Aspect:**
      *   To ensure they act rationally, I need to emphasize that the goal is *accuracy*, not "breaking the game."
      *   I need to make sure they understand the probabilities (2/3 vs 1/3).
      *   *Critical tweak:* In the classic BHW model, the cascade starts after two identical signals (e.g., A, A). If S3 draws 'b' (signal for B), they should still choose A because P(Urn=A | History=AA, Signal=b) > P(Urn=B | ...). I need to make sure the math holds up in their heads.
      *   *Instruction:* Explicitly tell them: "You are rational Bayesian updaters. Your goal is to maximize the probability of being correct."

  6.  **Developing the Debrief:**
      *   **Mapping:**
          *   Private Signal = The chip drawn.
          *   Public History = The sequence of guesses on the board.
          *   The Tipping Point = When the count of (A - B) guesses $\ge 2$.
      *   **Bayesian Math:** Keep it intuitive but rigorous enough for Phil/Econ majors. Likelihood ratios.
      *   **Pitfalls (a):**
          *   *Contrarians:* Address in rules ("You lose points for being wrong, even if you were 'interesting'").
          *   *Confusion:* Use a cheat sheet for probabilities.
          *   *Cascade Timing:* If it doesn't happen, run more rounds. If it happens too fast (S1, S2), that's actually correct theory.
      *   **Limitations (b):**
          *   Real world has continuous signals, varying credibility, reputational costs, and communication. The game is too clean.
      *   **Distinctions (c):**
          *   *Conformity:* Psychological pressure vs. Informational inference.
          *   *Reputation:* Caring what others think of *you* vs. caring about the *truth*.
          *   *Groupthink:* Suppression of dissent vs. Rational ignoring of information.

  7.  **Review against Constraints:**
      *   75 minutes? Yes, the timeline fits.
      *   18 students? Yes, sequential order works.
      *   No real money? Yes, use candy/points.
      *   Upper-level? Yes, the debrief goes into Bayesian formalism.

  8.  **Final Polish:**
      *   Make the instructions crystal clear.
      *   Ensure the "Surprise" element is highlighted (the reveal that the cascade was wrong).
      *   Structure the debrief to lead *them* to the conclusion, then formalize it.

  *(Self-Correction during drafting)*: Wait, if I just say "Guess Urn A or B", they might treat it as a vote. I need to frame it as "Based on your draw and the history, which Urn is more likely?"
  Also, 18 students in one chain might take too long if everyone thinks hard. Better to split into two chains of 9? No, one chain of 18 is more dramatic for the cascade. But 18 decisions might take 20 minutes. Let's aim for 2 rounds of 18, or 3 rounds of 12 (if some opt out). Actually, 18 is manageable if the instructor facilitates briskly. Let's stick to one chain per round to maximize the "long tail" of the cascade.
  *Wait, better idea:* To save time and increase data, run two simultaneous chains (Left side of room vs. Right side). This allows comparison. But it complicates the "public observation." Let's stick to one chain for clarity, but keep the pace tight. 5 minutes per round is tight. Let's plan for 2 full rounds and maybe a partial 3rd.
  *Actually, 18 students x 3 rounds = 54 decisions.* If each takes 30 seconds to decide + announce, that's 27 minutes just for announcing. Plus drawing. It might be tight.
  *Optimization:* Use "Decision Cards." Students write down their decision secretly, then reveal in order. No, they need to see previous decisions *before* deciding.
  *Solution:* The instructor walks down the row. Student 1 decides aloud. Student 2 decides aloud. It's fast.
  *Revised Timeline:*
  0-15: Setup & Instructions.
  15-45: 3 Rounds (10 mins each).
  45-75: Debrief.

  *Payoff:* To ensure rationality, the payoff must be for *individual accuracy*, not group accuracy. If the group gets it wrong but you followed the cascade rationally, you should still feel you did the "right" thing epistemically, even if you lost the point. I will award points for individual correctness.

  *Let's refine the "Contrarian" issue.* If a student knows the theory, they might try to "teach" the class by breaking the cascade. I need to forbid communication. "No talking except announcing your decision."

  *Let's refine the Math for the Debrief.*
  Prior: 0.5
  Signal Likelihood: 2/3 for correct, 1/3 for incorrect.
  Likelihood Ratio: 2:1.
  After 1 'A': Posterior = 2/3.
  After 2 'A's: Posterior = 4/5.
  If S3 gets 'b' signal: Likelihood of 'b' given A is 1/3. Likelihood of 'b' given B is 2/3.
  Combined: P(A|AA,b) vs P(B|AA,b).
  P(A|AA,b) $\propto$ P(A) * P(a|A) * P(a|A) * P(b|A) = 0.5 * (2/3)*(2/3)*(1/3) = 4/54.
  P(B|AA,b) $\propto$ P(B) * P(a|B) * P(a|B) * P(b|B) = 0.5 * (1/3)*(1/3)*(2/3) = 2/54.
  So even with a 'b' signal, A is twice as likely. Rational to choose A.
  This is the core math to present.

  *Okay, ready to write.*
answer: |-
  # Activity Design: The Urn Cascade

  ## 1. Learning Objective
  To demonstrate that rational Bayesian agents, acting sequentially to maximize individual accuracy, can generate a collective outcome that ignores a significant portion of the group's private information. Students will experience the epistemic tension between private evidence and public consensus.

  ## 2. Materials
  *   **Two Opaque Urns (or boxes/bags):**
      *   **Urn A:** 2 Red chips, 1 Blue chip.
      *   **Urn B:** 1 Red chip, 2 Blue chips.
  *   **Chips:** Enough to refill the urns after every draw (or simply replace the chip after each draw to maintain probabilities).
  *   **Whiteboard/Projector:** To record the sequence of decisions (e.g., S1: A, S2: A, S3: A...).
  *   **Payoff Tokens:** Chocolate coins, high-quality candies, or "Homework Pass" coupons (one per student who ends the game with the highest accuracy score).
  *   **Decision Sheet (Optional):** A small card for students to write their decision before announcing, to prevent hesitation.

  ## 3. Setup & Rules (10 Minutes)
  1.  **The State of the World:** Explain that for each round, the instructor will flip a fair coin to select either Urn A or Urn B. The students do not know which urn was selected.
  2.  **The Signal:** Each student will privately draw one chip from the *selected* urn, look at it, and replace it.
      *   If Urn A is selected: 2/3 chance of Red, 1/3 chance of Blue.
      *   If Urn B is selected: 1/3 chance of Red, 2/3 chance of Blue.
      *   *Red is a signal for A; Blue is a signal for B.*
  3.  **The Task:** Students are arranged in a fixed order (1 to 18). Student 1 draws, observes their chip, and announces publicly: **"I guess Urn A"** or **"I guess Urn B."**
      *   They do *not* reveal the color of their chip.
      *   They do *not* explain their reasoning.
  4.  **Information Flow:** Student $n$ observes the guesses of Students $1$ through $n-1$, draws their own chip, and then announces their guess.
  5.  **Payoffs:** The goal is **individual accuracy**.
      *   +1 Point for guessing the actual urn correctly.
      *   0 Points for guessing incorrectly.
      *   *Incentive:* The 3 students with the highest total points across all rounds win a prize. (This ensures they care about being right, not about being interesting or contrarian).
  6.  **Constraint:** No communication other than the official guess. No meta-commentary ("I'm breaking the cascade!").

  ## 4. Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Instructions** | Verify understanding of probabilities. Emphasize *individual* accuracy payoff. |
  | **10-20** | **Round 1** | Full chain (Students 1–18). Record guesses on board. Reveal Urn. Tally scores. |
  | **20-30** | **Round 2** | Full chain. *Crucial:* Ensure a different student starts as #1 if possible, or reshuffle seats to change order. Reveal Urn. |
  | **30-40** | **Round 3 (Optional/Partial)** | Run until a cascade clearly forms (e.g., up to Student 10). Stop early to begin debrief while the tension is fresh. |
  | **40-75** | **Debrief & Theory** | Map experience to Bayesian formalism. Discuss limitations and distinctions. |

  ## 5. Running the Game (Instructor Notes)
  *   **Pacing:** Keep it brisk. Hand the urn to Student 1 immediately. As soon as they speak, write it on the board and pass the urn to Student 2.
  *   **The "Aha" Moment:** In Round 1 or 2, a cascade will likely trigger around Student 3 or 4. Watch for the body language of Student 5 or 6—they will look at their chip, look at the board, hesitate, and then speak against their chip. **Do not comment on this.** Let it happen.
  *   **The Reveal:** When revealing the true Urn at the end of a round, highlight if the cascade was *wrong*. (e.g., "The Urn was B, but everyone guessed A. This means Students 5 through 18 ignored correct private information.")

  ---

  # Debrief Plan

  ## Part 1: Mapping the Experience to the Model (15 Minutes)
  *Goal: Translate the felt experience into the formal structure without immediately lecturing.*

  1.  **Reconstruct the History:** Pick a round where a cascade occurred (e.g., guesses were A, A, A, A, A...).
  2.  **Identify the Signals:** Ask the first two students what they drew.
      *   *Scenario:* S1 drew Red (Guessed A). S2 drew Red (Guessed A).
      *   *Scenario:* S3 drew Blue. Ask S3: "Why did you guess A?"
      *   *Expected Answer:* "Because two people before me guessed A. It seemed more likely."
  3.  **The Bayesian Calculation (Board Work):**
      *   Write the Likelihood Ratio on the board.
      *   Prior: $P(A) = P(B) = 0.5$.
      *   Signal Strength: $P(Red|A) = 2/3$, $P(Red|B) = 1/3$. Ratio = 2:1.
      *   **Step 1 (Student 1):** Sees Red. Posterior odds = 2:1 in favor of A. Guesses A.
      *   **Step 2 (Student 2):** Sees Red. Updates on S1's action (which reveals S1 saw Red) + Own Red. Posterior odds = 4:1 in favor of A. Guesses A.
      *   **Step 3 (Student 3):** Sees Blue (Signal for B).
          *   If S3 follows signal: Evidence is (Red, Red, Blue). Net signals: +1 for A.
          *   If S3 follows history: History implies (Red, Red).
          *   *Calculation:* $P(A | \text{History=AA, Signal=b}) \propto 0.5 \times (2/3)^2 \times (1/3) = 4/54$.
          *   $P(B | \text{History=AA, Signal=b}) \propto 0.5 \times (1/3)^2 \times (2/3) = 2/54$.
          *   **Result:** Urn A is still **twice as likely** as Urn B.
      *   **Conclusion:** A rational agent *must* ignore their private signal.

  ## Part 2: Addressing Pitfalls (10 Minutes)
  *Goal: Troubleshoot the activity's execution and validity.*

  **(a) Predictable Problems & Solutions**
  *   **The Contrarian:** A student guesses against the crowd to "teach a lesson" or "add information."
      *   *Diagnosis:* They are maximizing *social utility* (being helpful) rather than *epistemic utility* (being right).
      *   *Fix:* Reiterate the payoff structure. "You are not responsible for the group's knowledge; you are responsible for your own score." In the debrief, classify this as irrational behavior *within the constraints of the game*, even if morally virtuous.
  *   **The Confused Guesser:** Students treat it as a "majority vote" rather than probabilistic inference.
      *   *Diagnosis:* They don't grasp that S1's action *reveals* S1's signal.
      *   *Fix:* In the debrief, ask: "What does S1's guess tell you about S1's chip?" Establish that Action = Signal in the first step.
  *   **Cascade Timing:**
      *   *Too Fast:* If S1 and S2 match, S3 cascades. This is correct theory, but feels anticlimactic.
      *   *Too Slow/Never:* If signals alternate (R, B, R, B), no cascade forms.
      *   *Fix:* Run multiple rounds. The law of large numbers ensures at least one round will produce a run of identical signals early on.

  **(b) Limitations of the Activity**
  *   **Discrete vs. Continuous:** Real-world signals are rarely binary (Red/Blue). They are continuous and varying in quality.
  *   **Common Priors:** The game assumes everyone knows the urn probabilities. In reality, agents disagree about the reliability of sources (the "urn" itself).
  *   **No Reputation:** In the game, you are anonymous. In reality, being the person who breaks a cascade carries social risk, and being the person who blindly follows carries competence risk.
  *   **Simultaneity:** Real cascades often happen in near-simultaneity (stock markets), not strict sequential order.

  ## Part 3: Distinguishing Phenomena (15 Minutes)
  *Goal: Precision in terminology. Why is this specifically an "Information Cascade"?*

  Draw a 2x2 matrix on the board: **Motivation** (Truth vs. Social) x **Mechanism** (Inference vs. Pressure).

  | | **Motivation: Accuracy (Truth)** | **Motivation: Social (Reward/Punishment)** |
  | :--- | :--- | :--- |
  | **Mechanism: Inference (Informational)** | **Information Cascade** (Today's Game) | **Reputational Herding** (Keynesian Beauty Contest) |
  | **Mechanism: Pressure (Normative)** | **Groupthink** (Self-Censorship) | **Conformity** (Asch Experiments) |

  1.  **Information Cascade vs. Conformity:**
      *   *Conformity (Asch):* You know the line lengths are different, but you say they are the same to avoid social awkwardness. You *know* you are lying.
      *   *Cascade:* You look at your chip (Blue), but you genuinely believe the Urn is likely A based on the math. You are *not* lying; you are updating.
      *   *Test Question:* "Did Student 5 feel they were lying when they guessed against their chip?" (Usually, they say "No, I thought A was more likely.")

  2.  **Information Cascade vs. Reputation-Based Herding:**
      *   *Reputation:* An investment analyst follows the crowd because if they are wrong alone, they get fired. If they are wrong with the crowd, they are safe.
      *   *Cascade:* An analyst follows the crowd because they believe the crowd knows something they don't.
      *   *Distinction:* In the game, your payoff depended only on the Urn, not on what others thought of your intelligence.

  3.  **Information Cascade vs. Groupthink:**
      *   *Groupthink:* Dissent is actively suppressed; members talk themselves into a consensus to maintain cohesion.
      *   *Cascade:* Dissent is mathematically irrelevant. Even if Student 5 shouted "I have a Blue chip!", Student 6 should still ignore it because Student 5's *action* (Guess A) was the rational choice given the history. The private signal is "priced out" of the market.

  ## Closing Thought (5 Minutes)
  End with the unsettling implication: **Rationality can be collectively self-defeating.**
  *   Individually, every student did the right thing (maximized expected accuracy).
  *   Collectively, the group wasted the private information of Students 3 through 18.
  *   *Discussion Question:* "If you knew a cascade had started, is it rational to try to break it? Or does that just introduce noise?" (This sets up future discussions on normative epistemology vs. descriptive game theory).

  ---

  # Instructor Cheat Sheet: The Math of the Tipping Point

  Use this to answer student challenges during the debrief.

  **Assumptions:**
  *   $P(A) = P(B) = 0.5$
  *   $P(\text{Red}|A) = P(\text{Blue}|B) = q$ (where $q > 0.5$, in game $q=2/3$)
  *   $P(\text{Red}|B) = P(\text{Blue}|A) = 1-q$

  **The Rule:**
  A cascade begins when the difference between the number of A-guesses and B-guesses reaches **2**.
  *   If History is (A): Net +1. S2 follows signal.
  *   If History is (A, A): Net +2. S3 ignores signal.
      *   Why? One 'b' signal cancels one 'a' signal. But there are two 'a' signals in the history. The net evidence is still +1 for A.
  *   If History is (A, B): Net 0. S3 follows signal.

  **Why is it unsettling?**
  Once the cascade starts (e.g., at S3), S3's action provides **zero information** to S4. S4 knows S3 ignored their signal. Therefore, S4 is in the exact same position as S3, facing the same history. S4 also ignores their signal. The cascade becomes self-sustaining on negligible evidence (just the first two signals).
