answer: |-
  **Title:** Decomposing the Continuum: A Three-Axis Framework for Graded Moral Status

  **Statement of the Question**
  Contemporary debates regarding moral status often assume a single scalar value: an entity's "moral weight." This value is typically derived by multiplying the probability of sentience by an estimated range of welfare capacity. This model generates a continuum from simple systems (thermostats) to complex animals (humans). However, this approach creates a structural vulnerability at the lower bound: if moral weight is a continuous scalar, then sufficiently numerous low-probability entities (thermostats) can theoretically outweigh high-probability entities (humans), resulting in a Pascal's-mugging scenario where the conclusion is driven entirely by arbitrary priors.

  This paper asks: **Does separating the assessment of moral status into three distinct axes—(1) the probability of sentience, (2) the magnitude of welfare conditional on sentience, and (3) the metaphysical unity of the subject—dissolve the Pascal's-mugging problem and clarify the disagreement between insect welfare advocates and skeptics?**

  **Why Existing Positions Leave This Open**
  Current literature generally treats moral status as a function of cognitive capacity or behavioral complexity, aggregated into a single metric of "moral considerability."
  1.  **The Aggregation Error:** By multiplying probability by welfare range, existing models conflate the *existence* of a subject with the *intensity* of that subject's experience. This allows a vanishingly small probability of sentience to be compensated for by vast numbers of entities, forcing theorists to rely on ad-hoc priors to avoid absurd conclusions (e.g., that we must prioritize thermostats over humans).
  2.  **The Subjecthood Gap:** Discussions of insect sentience often oscillate between whether insects *feel* (phenomenology) and whether there is *someone* who feels (subjecthood). Skeptics argue insects are "philosophical zombies" driven by nociception without a unified subject; advocates argue behavioral complexity implies welfare. Both sides talk past each other because they are answering different questions within the same framework.
  3.  **False Dichotomies:** The current binary-or-scalar debate forces a choice between "insects matter immensely" and "insects matter not at all." This obscures the possibility that insects might possess welfare intensity but lack the diachronic unity required for certain types of harm, or vice versa.

  **Proposed Approach**
  I propose constructing a **Three-Axis Framework** for moral status, treating the variables as orthogonal rather than multiplicative.

  1.  **Axis 1: Credence in Phenomenology.** This retains the probabilistic element (how likely is it that there is "something it is like" to be this system?) but decouples it from moral weight calculation.
  2.  **Axis 2: Welfare Capacity.** This measures the range of positive and negative experience *conditional* on Axis 1 being satisfied.
  3.  **Axis 3: Subject Unity.** This is a threshold or gradient variable assessing whether the system constitutes a unified bearer of welfare over time.

  **Why This Approach?**
  The obvious alternative is to refine the priors on sentience probabilities (e.g., arguing thermostats have zero probability). However, this relies on contentious metaphysical claims about panpsychism or information theory that cannot be settled in a term paper. Another alternative is to adopt a binary threshold (sentient or not), but this ignores the graded nature of cognitive complexity that motivates the debate in the first place.

  My approach is superior for a term-paper scope because it is **structural rather than ontological.** I do not need to prove that insects lack subject unity; I only need to demonstrate that *if* we treat subject unity as a distinct variable from welfare capacity, the Pascal's-mugging problem dissolves. If Axis 3 (Subject Unity) acts as a gatekeeper for moral aggregation, then a thermostat cannot accumulate moral weight through numbers, regardless of Axis 1 or 2. This forces proponents of insect welfare to argue for subject unity specifically, rather than hiding it behind welfare intensity.

  **Expected Results and Failure Conditions**
  **Success:** A successful paper will produce a formalized model showing that when Axis 3 is treated as a necessary condition for the aggregation of welfare across populations, the "thermostat mugging" vanishes without requiring arbitrary priors. Furthermore, it should show that the disagreement between insect welfare advocates and skeptics can be mapped onto specific disagreements about Axis 2 (intensity) versus Axis 3 (unity), rather than a general dispute about "mattering."

  **Failure:** The project fails if the three axes inevitably collapse back into a single scalar during application. For example, if "Subject Unity" turns out to be just another way of measuring "Welfare Capacity," the framework adds complexity without solving the prior-dependence problem. The project also fails if I cannot articulate a principled reason why Subject Unity should act as a gatekeeper rather than just another multiplier.

  **Scope and Feasibility (One Semester)**
  In one semester, I cannot provide a definitive metaphysical account of subjecthood or a neuroscientific assessment of insect consciousness. Therefore, the scope will be limited to **conceptual analysis and model testing.**

  1.  **Weeks 1-4:** Formalize the Three-Axis Framework and contrast it with the standard Expected Value model.
  2.  **Weeks 5-8:** Apply the framework to three test cases: the thermostat (low on all axes), the honeybee (high on welfare, contested on unity), and the human (high on all axes).
  3.  **Weeks 9-12:** Demonstrate how the framework handles the aggregation problem (Pascal's Mugging) and map existing literature onto the three axes to show where previous debates conflated variables.
  4.  **Weeks 13-15:** Refine the argument, address counter-arguments regarding the "gatekeeper" status of subjecthood, and finalize the paper.

  The goal is not to solve the hard problem of consciousness, but to show that the *structure* of our moral calculations is currently flawed in a way that generates pseudo-problems. By the end of the term, I aim to have a working philosophical tool that clarifies what is actually at stake when we claim a honeybee matters more than a thermostat.
