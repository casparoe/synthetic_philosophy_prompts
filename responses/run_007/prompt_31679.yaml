prompt: |-
  A friend of mine sent me a blog post that summarizes Dennett's stuff on the three stances and real patterns, and I have a feeling its off but I can't say exactly where. The post says:

  'Dennett distinguishes three ways of predicting a system. The physical stance predicts from its physical constitution, the design stance from what the system was designed to do, and the intentional stance treats the system as a rational agent with beliefs and desires. His controversial claim is that beliefs and desires aren't internal states we can locate in the brain; they're real patterns in behavior that only show up when you take the intentional stance. But since taking the stance is just a predictive strategy, Dennett is happy to say a thermostat literally believes the room is too cold and wants it warmer — any system has beliefs and desires as long as the intentional stance works on it. So his view is a kind of instrumentalism: mental states are useful fictions, not real things. That's also why he says consciousness is an illusion.'

  I'd always heard Dennett described as a realist about real patterns who denies being an instrumentalist, so this summary seems like it's sliding into something else. Can you go through it and tell me which bits are fair, which are common simplifications, and wich a Dennett defender would reject? And does the last line about consciousness actually follow from the accurate parts, or is it bolted on?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Source Material:** A short blog post summary of Daniel Dennett's views (Three Stances, Real Patterns, Instrumentalism vs. Realism, Consciousness).
      *   **User's Intuition:** The user feels the summary is "off," specifically regarding Dennett's realism vs. instrumentalism and the connection to consciousness.
      *   **Task:** Evaluate the accuracy of the summary, distinguishing between fair representations, common simplifications, and points a Dennett defender would reject. Specifically address the "instrumentalism" claim and the "consciousness is an illusion" conclusion.

  2.  **Deconstruct the Blog Post (Sentence by Sentence):**

      *   *Sentence 1:* "Dennett distinguishes three ways of predicting a system."
          *   **Assessment:** Accurate. This is the core of *The Intentional Stance*.
      *   *Sentence 2:* "The physical stance predicts from its physical constitution, the design stance from what the system was designed to do, and the intentional stance treats the system as a rational agent with beliefs and desires."
          *   **Assessment:** Accurate summary of the definitions.
      *   *Sentence 3:* "His controversial claim is that beliefs and desires aren't internal states we can locate in the brain; they're real patterns in behavior that only show up when you take the intentional stance."
          *   **Assessment:** Mostly accurate, but nuanced. Dennett denies *Cartesian Materialism* (little men in the head), but he insists they are *real patterns*, not just behavioristic regularities. The "only show up when you take the intentional stance" part is tricky but generally aligns with his view that the pattern is stance-relative but objective.
      *   *Sentence 4:* "But since taking the stance is just a predictive strategy, Dennett is happy to say a thermostat literally believes the room is too cold and wants it warmer — any system has beliefs and desires as long as the intentional stance works on it."
          *   **Assessment:** This is the danger zone. Dennett *does* say the intentional stance can apply to thermostats, but he usually qualifies this heavily to avoid trivializing belief. He distinguishes between "true believers" (humans/animals) and simple systems based on complexity and evolutionary history. Saying he is "happy to say a thermostat *literally* believes" is a common caricature (often attacked by Searle). Dennett prefers to say it has a "derived" intentionality or that the attribution is true but shallow.
      *   *Sentence 5:* "So his view is a kind of instrumentalism: mental states are useful fictions, not real things."
          *   **Assessment:** **Major Red Flag.** This is the core of the user's suspicion. Dennett explicitly argues *against* being labeled an instrumentalist. He argues for "Real Patterns." To him, if a pattern is robustly predictive and objective (from that stance), it is *real*. Calling them "useful fictions" is exactly what he denies. He is a *realist* about patterns, even if those patterns are stance-relative.
      *   *Sentence 6:* "That's also why he says consciousness is an illusion."
          *   **Assessment:** **Misleading/Context Missing.** Dennett does say consciousness is an "illusion," but *not* in the sense that it doesn't exist (eliminativism). He means the *folk theoretical conception* of consciousness (Cartesian Theater, qualia as intrinsic ineffable properties) is an illusion. The *phenomenon* is real, but our intuition about *what it is* is wrong. Connecting this directly to the instrumentalism claim in Sentence 5 is a non-sequitur or at least a muddling of distinct arguments.

  3.  **Synthesize the Critique:**

      *   **The Good:** The definitions of the three stances are correct. The idea that beliefs aren't little neural sentences is correct.
      *   **The Simplifications:** The thermostat example is the classic "reductio" that Dennett tries to navigate carefully. The blog post presents it more bluntly than Dennett usually does.
      *   **The Wrong (The "Instrumentalism" Charge):** This is the big one. Dennett's "Real Patterns" paper is specifically an argument *against* instrumentalism. He wants to save the reality of the mental without resorting to Cartesian materialism. The blog post claims he thinks they are "not real things." Dennett says they are real *as patterns*.
      *   **The Consciousness Claim:** It's bolted on and relies on a specific definition of "illusion." It doesn't follow logically from the instrumentalist premise (which Dennett rejects anyway).

  4.  **Drafting the Response (Iterative refinement):**

