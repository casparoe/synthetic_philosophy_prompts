answer: |-
  First, let me say that your confusion is a sign that you are reading the text exactly as carefully as it demands. You have put your finger on the precise nerve of one of the most enduring debates in twentieth-century meta-ethics. It is a subtle distinction, and it is entirely understandable that a mind trained in empirical precision would find the philosophical boundary here slippery.

  You are asking the right question: **Why can't the expressivist simply adopt Frege's distinction between *content* and *force*, but substitute "attitude" for "thought"?**

  To answer this, we need to look closely at what Frege is doing in "The Thought" (Der Gedanke), and why the "ontology" (the kind of thing that exists) of a Fregean Thought is fundamentally different from the ontology of an Expressivist Attitude.

  ### 1. Frege's Setup: The Thought as an Abstract Object
  In the passage you are reading, Frege is trying to save logic from psychology. Before Frege, many logicians thought logic was about how humans *actually think*. Frege argued that logic is about the relationships between **Thoughts** (Gedanken).

  For Frege, a "Thought" is not a mental occurrence. It is not something happening in your brain. It is an abstract object, much like a number.
  *   **The Thought:** The content of the sentence (e.g., *that the accused was in Rome*). This exists independently of anyone believing it. It is capable of being True or False.
  *   **The Assertion:** The act of claiming that this Thought is True.

  When Frege analyzes the conditional ("If the accused was in Rome..."), he notes that the *Thought* contained in the antecedent is the **very same object** as the Thought contained in a standalone assertion. The only difference is the "assertoric force."

  **Crucially:** Because the Thought is a truth-apt abstract object, it can enter into logical relations (like implication) regardless of whether anyone is currently asserting it. Logic is the study of how Truth is preserved from Thoughts to Thoughts.

  ### 2. The Expressivist Position
  Now, let's look at the classic expressivist (like A.J. Ayer or C.L. Stevenson, whom Geach was targeting). They argue that moral sentences do not describe facts and do not express Fregean Thoughts.
  *   **The Claim:** "Lying is wrong" does not state a truth-apt proposition.
  *   **The Meaning:** It expresses a non-cognitive attitude (e.g., disapproval, or "Boo lying!").

  ### 3. The Clash (The Frege-Geach Problem)
  Here is where your proposed solution meets the wall. You suggested: *Why can't the expressivist say the attitude is expressed without being held, just as Frege says the Thought is expressed without being asserted?*

  There are two major hurdles here, one semantic and one logical.

  #### A. The Semantic Hurdle: What is the "Content"?
  For Frege, the "Thought" exists even when unasserted. It is a stable object.
  For the classic expressivist, the **meaning of the sentence is the attitude itself.**

  If I say, "Lying is wrong," I am expressing disapproval.
  If I say, "If lying is wrong, then..." I am **not** expressing disapproval. I am merely considering a hypothesis.

  If the meaning of "Lying is wrong" *is* the expression of disapproval, then in the conditional context, where no disapproval is expressed, the phrase "Lying is wrong" **loses its meaning.** It becomes an empty shell.

  For Frege, the shell is never empty because the "Thought" is there regardless of the force. For the expressivist, if you remove the psychological state (the force/attitude), there is nothing left to be the content. To make your move work, the expressivist would have to admit there is a "content" distinct from the "attitude." But if they admit that, they are no longer pure expressivists; they are admitting there is a proposition-like entity after all.

  #### B. The Logical Hurdle: Truth Preservation
  This is the deeper issue, and it relates to your background in the lab. You are used to measurements yielding consistent data regardless of who measures them. Frege's logic is similar: it tracks **Truth**.

  Valid arguments (like *Modus Ponens*) work because they preserve Truth.
  1.  P (True)
  2.  If P, then Q (True)
  3.  Therefore, Q (Must be True)

  Frege's "Thoughts" have truth values. That is why they fit into the slots of P and Q.
  Expressivist "Attitudes" (Boo/Hooray) do **not** have truth values. You cannot say an attitude is "True" or "False."

  If the expressivist tries to run your proposed move, the argument looks like this:
  1.  Boo Lying! (Attitude expressed)
  2.  If [Boo Lying!], then Boo Getting Brother to Lie!
  3.  Therefore, Boo Getting Brother to Lie!

  This is not a valid logical inference. It looks like a psychological contagion, not a logical deduction. Logic requires truth-apt contents to operate. Because Frege's "Thought" is defined by its capacity to be True or False, it fits into logic. Because the Expressivist's "Attitude" is defined by its capacity to motivate or emote, it does not fit into logic *unless* it can mimic truth-apt content.

  ### 4. Why Your Intuition is Actually Ahead of Its Time
  You asked: *"Why isn't that a perfectly adequate response?"*

  Here is the fascinating part: **Modern expressivists agree with you.**

  Philosophers like Simon Blackburn (Quasi-Realism) and Allan Gibbard (Norm-Expressivism) have spent the last 40 years doing exactly what you suggested. They are trying to construct a theory where moral attitudes can function *as if* they were Fregean Thoughts. They try to explain how we can have "moral truth" and "moral logic" even if the underlying metaphysics is just about attitudes.

  They would say: "We can distinguish the *commitment* to the attitude from the *having* of the attitude in a specific context."

  However, they have to build immense, complex philosophical machinery to make this work. They have to explain how an attitude can be "correct" or "incorrect" (mimicking truth) without actually being a description of the world. Frege didn't have to build that machinery because he simply posited the "Thought" as a primitive, truth-apt object. The expressivist has to earn the right to use logical connectives; Frege is given that right by definition.

  ### 5. Summary: Where the Passage Does the Work
  To answer your specific question about the passage in "The Thought":

  The passage blocks the expressivist's move because Frege defines the "Thought" as **the bearer of truth values.**
  1.  Frege: Content = Thought (Truth-apt). Force = Assertion.
  2.  Expressivist: Content = Attitude (Not truth-apt). Force = Expression.

  When you embed the sentence in a conditional, Frege still has a Truth-apt Thought to operate on. The Expressivist has an Attitude that is not being held, and therefore (on the classic view) no meaning to operate on, and no truth value to preserve.

  You are not missing anything; you have identified the exact point where the expressivist must either collapse or evolve. The "Frege-Geach Problem" is essentially Geach pointing at Frege's distinction and saying to the expressivist: *"You want to use logic? Then you need contents that behave like Frege's Thoughts. But your theory says you don't have those contents."*

  Your instinct that the expressivist *should* be able to make a similar distinction is the driving force behind contemporary meta-ethics. The debate today is largely about whether they have succeeded in making that distinction without contradicting their own core premises.

  So, your grey matter is ticking over perfectly. You have halted on the precise fault line between the philosophy of logic and the philosophy of value.
