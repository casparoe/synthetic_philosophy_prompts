      *   *What is it?* Proposed by David Chalmers. It distinguishes the "Hard Problem" (why is there experience?) from the "Meta-Problem" (why do we *think* there is a hard problem? Why do we report having experiences?).
      *   *Core Claim:* Even if we solve the functional/behavioural aspects (why we say "I see red"), the Hard Problem might remain. However, solving the Meta-Problem explains the *intuition* of the Hard Problem.
      *   *Key Components:* Problem reports (verbal/written claims about consciousness), problem intuitions (the feeling that consciousness is mysterious), physical/functional explanations of those reports/intuitions.

  3.  **Translate to Predictive Processing (PP) / Active Inference (AI):**
      *   *Generative Model:* The brain models the world and itself.
      *   *Prediction Error (PE):* Discrepancy between expectation and input.
      *   *Precision Weighting:* Confidence in predictions vs. sensory data.
      *   *Self-Modelling:* The model includes a model of the self (the "I").
      *   *Active Inference:* Acting to minimise expected free energy (fulfilling predictions).
      *   *Translation Strategy:*
          *   "Problem reports" $\rightarrow$ Linguistic actions generated to minimise PE regarding social/interrogative cues.
          *   "Problem intuitions" $\rightarrow$ High-level priors about the nature of the self-model or sensory precision that resist integration with physicalist priors.
