      *   *Precision & Priors:* The intuition arises from how precision is allocated to interoceptive/proprioceptive signals vs. exteroceptive models. Maybe a "transparent" self-model (looking *through* it rather than *at* it) creates the illusion of non-physicality.
      *   *Active Inference:* We act (speak) to align our social environment with our internal model. If the model posits a "ghost in the machine," we speak accordingly.
      *   *Crucial Nuance:* I must ensure I don't say "PP solves consciousness." I must say "PP explains the *reporting* of consciousness." This aligns with the meta-problem's goal.

  5.  **Drafting the Residue Report (Task 2):**
      *   *Clean Mappings:* Behavioural reports, the generation of intuitions as model states, the functional role of "mystery."
      *   *Distorted/Reduced:* The *normative* force of the intuition. Philosophers care about *truth*, PP cares about *utility* (free energy minimisation). The "feel" of the intuition might be reduced to precision weighting.
      *   *No Expression:* The ontological status of the experience itself (the Hard Problem proper). PP is functionalist/representationalist. It doesn't speak to *why* there is something it is like to be the model, only that the model exists.
      *   *Evaluation:* Is the residue a bug or a feature?
