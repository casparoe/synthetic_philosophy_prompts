prompt: |-
  I'm a researcher in computational neuroscience, specifically working on predictive processing and active inference models of brain function. A philosopher colleague keeps telling me that the 'meta-problem of consciousness' is something I ought to engage with, but everything I have read on it is written in a philosophical idiom I find impenetrable.

  Restate the meta-problem of consciousness — the challenge of explaining why we have the intuition that there is a hard problem of consciousness, and why we produce the reports and behaviours that express that intuition — in the vocabulary of predictive processing: hierarchical generative models, prediction error minimisation, precision weighting, top-down priors, self-modelling, active inference, and so on. Be as faithful as you can to the philosophical claims, and do not simply declare that my framework dissolves the problem and call that a translation.

  Then give me a residue report. Which claims in the philosophical debate map cleanly onto my framework? Which need to be distorted or reduced to fit? Which have no expression in my vocabulary at all? And is the residue a sign that my framework is missing something important, or that some of the philosophical claims are less clear than they appear? I want to know whether the meta-problem is a genuine challenge for predictive processing or whether it points to explanatory work that predictive processing is not equipped to do. Please write the answer in British English.
