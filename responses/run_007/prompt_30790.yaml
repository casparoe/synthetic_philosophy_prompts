      *   *Confusion Check:* The user asks for *the* specification. There isn't one canonical engineering spec because the technology doesn't exist yet. However, there are logical constraints imposed by the definition of suffering, the nature of sentience, and evolutionary biology. The request isn't confused in seeking clarity, but it might be expecting a level of technical precision that is currently philosophical rather than empirical. I need to address this nuance without dismissing the query. The core tension is between the *ethical goal* (no suffering) and the *functional role* of pain/suffering in survival and learning.
      *   *Decision:* I should not say the premise is entirely confused, but I must clarify that HI is a *direction* rather than a fixed blueprint. The "desiderata" are largely derived from the internal logic of the argument itself and external biological constraints. I will treat the request as valid but frame the answer as an exploration of the necessary conditions for coherence rather than a finalized technical manual.

