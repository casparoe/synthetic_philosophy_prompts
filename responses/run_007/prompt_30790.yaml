      *   **Goal:** A specification of desiderata: cases any proposal must handle, distinctions it cannot collapse (nociception vs. suffering, suffering vs. motivation), neuroscience/evolutionary biology constraints, non-negotiable requirements vs. preferences, and identification of any incompatible requirements (trade-offs) that rule out popular versions.
