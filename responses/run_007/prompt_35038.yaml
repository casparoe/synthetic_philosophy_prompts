answer: |-
  Here is a structural analysis of the desiderata for a theory of market boundaries. This framework is designed not to advocate for a specific conclusion (e.g., "markets should be limited"), but to define the conditions under which a theory of limits counts as theoretically adequate.

  ### I. The Desiderata

  An adequate theory of market boundaries must satisfy the following six structural requirements.

  **1. The Consent/Harm Gap Requirement**
  *   **The Requirement:** The theory must provide a normative ground for objection that is independent of non-consent and independent of net welfare loss. It must explain why a transaction can be morally problematic even if it is Pareto-improving (by the participants' own lights) and fully consensual.
  *   **Motivating Case:** *Kidney Sales and Price Gouging.* In a kidney sale, the seller prefers money to the kidney, and the buyer prefers the kidney to the money; both consent. In price gouging (e.g., selling water after a hurricane), the buyer prefers water at \$50 to dehydration, and the seller prefers \$50 to holding the water. A theory that relies solely on coercion or welfare reduction cannot explain the residual moral unease in these cases without redefining "coercion" so broadly it loses meaning or "welfare" so subjectively it becomes tautological.

  **2. The Moral/Legal Distinction Requirement**
  *   **The Requirement:** The theory must distinguish between the claim that a market is *morally objectionable* and the claim that it ought to be *legally prohibited*. It must provide criteria for when moral objection translates into state enforcement and when it does not.
  *   **Motivating Case:** *Black Markets and Enforcement Costs.* Consider a market for surrogacy or drugs. A theory might judge the market as degrading (moral objection) but acknowledge that prohibition drives the market underground, increasing danger to participants (legal permission). A theory that conflates "wrong" with "illegal" (strong paternalism) fails to account for second-order harms of enforcement. Conversely, a theory that says "if it's not illegal, it's morally fine" (legal positivism) fails to capture the normative work of social critique.

  **3. The Corruption/Degradation Mechanism Requirement**
  *   **The Requirement:** The theory must specify the mechanism by which market exchange alters the *meaning* or *value* of the good being exchanged. It cannot simply assert that "commodification is bad"; it must explain why market norms displace non-market norms in some contexts but not others. It must handle the intuition of incommensurability without merely asserting it as a brute fact.
  *   **Motivating Case:** *Surrogacy vs. Paid Childcare; Blood vs. Plasma.* We pay nannies and doctors, yet often object to paying surrogate mothers. We accept paid plasma but often valorize voluntary blood donation. If the theory claims all goods are commensurable, it must explain the persistence of the intuition that some goods are "degraded" by price without dismissing the intuition as false consciousness. If the theory claims some goods are inherently non-marketable, it must explain why similar goods (childcare vs. surrogacy) are treated differently.

  **4. The Motivational Specificity Requirement (Crowding-Out)**
  *   **The Requirement:** The theory must account for the empirical phenomenon of motivational crowding-out (where extrinsic incentives undermine intrinsic motivation) but must specify the *conditions* under which this occurs. It cannot posit crowding-out as a universal law of market interaction.
  *   **Motivating Case:** *Blood Donation and Civic Duty.* Titmuss argued paying for blood reduces supply and quality by crowding out altruism. However, empirical studies (e.g., Gneezy) show incentives sometimes *increase* pro-social behavior or have no effect. An adequate theory must predict *when* money signals "greed" versus when it signals "appreciation" or "compensation." A theory that assumes markets *always* corrupt motivation is empirically falsifiable and likely false; a theory that ignores the mechanism is explanatorily empty.

  **5. The Object/Context Sensitivity Requirement**
  *   **The Requirement:** The theory must distinguish between objections based on the *nature of the good* (object-based) and objections based on the *background conditions of the exchange* (context-based). Crucially, it must explain how these two interact.
  *   **Motivating Case:** *Pollution Permits and Carbon Offsets.* Is a market in pollution rights objectionable because pollution is a "bad" that shouldn't be traded (object), or because wealthy firms can buy the right to harm poor communities (context)? A theory that focuses only on the object cannot explain why we might accept pollution trading in a perfectly egalitarian society. A theory that focuses only on context cannot explain why we might object to selling babies even in a utopia of equality. The theory must handle the interaction (e.g., where background inequality makes the object's trade uniquely pernicious).

  **6. The Empirical Accountability Requirement**
  *   **The Requirement:** The theory's normative claims must be tethered to testable empirical predictions. It must state what evidence would count against its claims.
  *   **Motivating Case:** *Falsifiability of Corruption.* If a theory claims markets degrade friendship, it must be possible to observe a degradation of friendship in marketized contexts. If the theory retreats to "the degradation is spiritual/hidden" whenever empirical data shows no harm, it becomes unfalsifiable. The theory must allow for the possibility that empirical evidence (e.g., showing no crowding-out in a specific sector) could force a revision of the normative boundary.

  ---

  ### II. Tensions and Incompatibilities

  There are genuine tensions between these desiderata. A single theory may struggle to satisfy all of them simultaneously without significant theoretical cost.

  **The Trilemma of Corruption, Equality, and Liberty**
  There is a tension between **Desideratum 3 (Corruption Mechanism)**, **Desideratum 5 (Object/Context Sensitivity)**, and **Desideratum 2 (Moral/Legal Distinction)**.

  1.  **The Conflict:** If you argue strongly for **Desideratum 3** (that certain goods are *inherently* degraded by markets, like surrogacy), you lean toward an object-based view. This makes **Desideratum 5** hard to satisfy, because if the good is inherently corrupted, background equality shouldn't matter; the market should be banned even in a utopia.
  2.  **The Counter-Conflict:** If you argue strongly for **Desideratum 5** (that markets are only wrong due to background inequality/coercion), you undermine **Desideratum 3**. If the problem is purely inequality, then there is no *inherent* corruption, only unfairness. This collapses the "limits of markets" debate into a "distributive justice" debate.
  3.  **The Legal Friction:** If you satisfy **Desideratum 3** (inherent corruption), you create pressure to violate **Desideratum 2**. If a market inherently degrades human dignity, why *wouldn't* you ban it legally? To maintain the Moral/Legal distinction while holding a strong Corruption view requires a complex account of state overreach that many comprehensive moral theories reject.

  **The Empirical/Normative Gap (Desideratum 4 vs. 6)**
  There is a tension between **Desideratum 4 (Motivational Specificity)** and **Desideratum 6 (Empirical Accountability)**.
  *   Normative theories often rely on "meaning" or "dignity" which are resistant to empirical measurement. To satisfy **Desideratum 6**, the theory must operationalize "degradation" or "crowding-out" in measurable terms. However, doing so risks reducing rich normative concepts to behavioral metrics (e.g., "crowding out" becomes merely "reduced supply"), which may miss the moral point (e.g., "changed relationship"). A theory that is empirically precise may become normatively shallow; a theory that is normatively deep may become empirically vacuous.

  ---

  ### III. The Exclusionary Requirement

  **The Single Requirement:** **Desideratum 3 (The Corruption/Degradation Mechanism Requirement).**

  **Why it excludes the most views:**
  This requirement acts as the strongest filter against the major existing paradigms in economics, political philosophy, and law.

  1.  **Excludes Neoclassical Economics:** Standard economic theory treats goods as commensurable via price. It generally views "corruption" as an externality or preference, not a structural change in the good's nature caused by the exchange mechanism itself. It fails to explain the surrogacy/childcare distinction without ad-hoc preference adjustments.
  2.  **Excludes Libertarianism:** Libertarian theories focus on procedural justice (consent/rights). They struggle to explain why a consensual exchange of a specific good (a kidney) is qualitatively different from a consensual exchange of labor, unless they appeal to inalienable rights which often lack the granular mechanism required here.
  3.  **Excludes Simple Utilitarianism:** Utilitarianism aggregates welfare. Unless "dignity" or "meaning" is quantified as a utility input (which often begs the question), utilitarianism cannot explain why we object to a transaction that increases net welfare and involves consent.
  4.  **Excludes Radical Commodification Critiques:** Conversely, this requirement also excludes theories that claim *all* market exchange is alienating (e.g., some Marxist interpretations). Because Desideratum 3 demands an explanation of *why some goods* are corrupted while *others are not* (e.g., plasma vs. blood, or childcare vs. surrogacy), a blanket "markets are bad" theory fails the specificity test.

  **What would change my mind:**
  I would revise this judgment if a **Reductionist Argument** succeeded. If a theorist could demonstrate convincingly that *all* plausible cases of "corruption" or "degradation" are reducible entirely to **Desideratum 5 (Background Conditions/Inequality)** plus information asymmetries, then Desideratum 3 is not an independent requirement but a derivative one.
  *   *Example:* If it were proven that objections to surrogacy vanish completely in conditions of perfect economic equality and perfect information, then the "corruption" was actually just "coercion" in disguise. If that reduction holds, Desideratum 5 does the heavy lifting, and Desideratum 3 is redundant. Currently, I judge this reduction unlikely (as many object to surrogacy even in hypothetical egalitarian societies), but if the empirical evidence shifted to support full reduction, Desideratum 3 would cease to be a primary filter.

  ---

  ### IV. Non-Negotiable vs. Theoretically Committed

  It is crucial to distinguish which desiderata are prerequisites for *any* plausible theory, and which reflect a specific commitment to a "Semiotic/Psychological" approach to market boundaries.

  **Non-Negotiable (Universal Requirements):**
  *   **Desideratum 1 (Consent/Harm Gap):** Any theory of *limits* must explain why we limit markets where standard market justifications (efficiency/consent) are present. If a theory cannot clear this bar, it is not a theory of limits; it is a theory of market failure.
  *   **Desideratum 6 (Empirical Accountability):** In the 21st century, a normative theory of social institutions that is immune to empirical evidence is untenable. While the *values* are normative, the *claims about how markets function* must be falsifiable.

  **Theoretically Committed (Contestable Requirements):**
  *   **Desideratum 3 (Corruption Mechanism) & Desideratum 4 (Crowding-Out):** These reflect a commitment to the view that markets have *expressive* or *constitutive* effects on social goods. A rival theorist (e.g., a strict Egalitarian) could reasonably reject these. They might argue: "There is no corruption. There is only injustice. Fix inequality, and all markets become permissible."
      *   *Why I include them anyway:* Even if the Egalitarian is right, their theory *must address* the intuition of corruption to explain why people *believe* markets are wrong. Thus, the theory must handle the distinction (as noted in the prompt), even if it ultimately argues the distinction is morally irrelevant. However, the *mechanism* requirement assumes there is a mechanism to find. An Egalitarian might deny this.
  *   **Desideratum 2 (Moral/Legal Distinction):** A comprehensive moral theory (e.g., certain forms of Kantianism or Theocracy) might reject this, arguing that if something is morally impermissible, the state has a duty to prohibit it. I include it as a desideratum because I assume a liberal pluralist framework where the state's coercive power requires a higher bar than moral wrongness. A non-liberal theory could reject this.

  ### V. What Would Restructure the Desiderata?

  The entire list rests on the assumption that "The Market" is a coherent category that can be bounded.

  **The Argument That Would Change My Mind:**
  If a convincing **Pragmatist/Institutionalist** argument demonstrated that "The Market" is not a distinct mechanism with boundaries, but rather a spectrum of governance structures all the way down, I would have to discard **Desideratum 3 (Corruption Mechanism)**.
  *   *The Consideration:* If every exchange involves rules, norms, and property rights (i.e., there is no "free market" vs. "regulated market," only different regulatory frameworks), then the question is not "Should this be a market?" but "What rules should govern this exchange?"
  *   *The Consequence:* This shifts the project from "Market Boundaries" to "Institutional Design." The desiderata would change from "When is a market impermissible?" to "Which governance structure best preserves the relevant values?" This would collapse the distinction between "market" and "non-market" exchange, rendering the search for a boundary (and thus Desiderata 1, 3, and 5) category errors.

  Until that ontological shift is proven, however, the six desiderata above represent the structural minimum for a theory that takes the "limits of markets" question seriously.
