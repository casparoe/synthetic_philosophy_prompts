  *(Refining Rousseau)*: Rousseau's letter to Voltaire is key. He argues that if people lived dispersed in nature, the quake would hurt few. So the *concentration* of population is the cause. This aligns with Leibniz's idea that moral evil (human choices) compounds physical evil. But does it excuse God? Only if human error is a necessary price of free will.

