answer: |-
  You have hit on exactly the most famous and persistent criticism of David Lewis's account. In philosophical circles, this is often called the **"Arbitrariness Objection."**

  You are absolutely right that, on Lewis's model, the *selection* of a convention is accidental (history could have gone the other way), and the *reason* we follow it is purely instrumental (to coordinate).

  However, whether this means normative force is an "illusion" depends on what kind of "force" you think norms are supposed to have. Here is a breakdown of why Lewis thinks he's safe, where he might be vulnerable, and how other philosophers have tried to fix the problem you've identified.

  ### 1. Lewis's Defense: Instrumental Rationality
  Lewis was a Humean. He didn't believe in "categorical imperatives" (rules you must follow regardless of your desires). He believed reasons for action always stem from desires and beliefs.

  For Lewis, the "normative force" of a convention isn't an illusion, but it is **hypothetical**, not categorical.
  *   **The Logic:** "I ought to drive on the right" translates to "If I want to avoid crashing and get to my destination, and I know everyone else is driving on the right, then I ought to drive on the right."
  *   **The Force:** The force comes from the penalty of coordination failure. If you deviate, you crash. That is a very real, non-illusory reason to conform.

  So, for Lewis, you aren't rationalizing an accident; you are engaging in **instrumental rationality**. The fact that we *could* have driven on the left doesn't mean driving on the right is irrational *now*. Given the current equilibrium, deviating is irrational.

  ### 2. The Problem: Conventions vs. Moral Norms
  Your worry kicks in when we move from traffic laws to social norms that feel moral (e.g., "don't interrupt people," "shake hands," or even "keep promises").

  If Lewis is right, then "keeping a promise" is just a coordination equilibrium. We keep promises because we expect others to, and we prefer a world where promises are kept. But if everyone suddenly stopped expecting promises to be kept, the obligation would vanish.

  **The Critique:** Many philosophers argue this strips norms of their **obligatory** character.
  *   If I break a convention (drive on the left in the US), I am *irrational* or *reckless*.
  *   If I break a norm (betray a friend), I am *wrong*.
  *   Lewis's account explains the recklessness, but it struggles to explain the *wrongness*. It reduces "ought" to "is expedient."

  ### 3. How Philosophers Have Tried to Fix It
  Because of the exact worry you have, several philosophers have tried to modify Lewis's account to restore "genuine" normative force.

  **A. Margaret Gilbert (Joint Commitment)**
  Gilbert argues that Lewis focuses too much on individual preferences. She suggests that conventions create a **"joint commitment."** When we establish a convention, we aren't just aligning our expectations; we are forming a social group bound by a pledge to uphold the rule.
  *   **Why this helps:** It creates a genuine obligation. If you violate the convention, you aren't just being imprudent; you are violating a commitment you made to the group. This restores the "normative force" Lewis lacks.

  **B. Andrei Marmor (Constitutive Conventions)**
  Marmor distinguishes between **coordination conventions** (driving) and **constitutive conventions** (the rules of chess or etiquette).
  *   **Why this helps:** In chess, you can't just decide to move the Knight diagonally because it's an "equilibrium." The rules *constitute* the game. Marmor argues that many social norms are constitutive of our social practices. They aren't arbitrary solutions to pre-existing problems; they create the very reasons for action. This makes the normativity internal to the practice, not just a historical accident.

  **C. Ruth Millikan (Proper Functions)**
  Millikan looks at conventions through an evolutionary lens. Conventions persist because they have a "proper function" that aids survival or social cohesion.
  *   **Why this helps:** The normativity comes from the *function*. We ought to follow the convention because it serves a vital purpose for the community, regardless of whether we individually prefer to coordinate at this specific moment.

  ### 4. Is the Force an Illusion?
  To answer your specific question: **No, it's not an illusion, but it is contingent.**

  If you accept Lewis's framework:
  1.  **The Selection is Arbitrary:** Yes. We drive on the right only because we happened to start doing that.
  2.  **The Adherence is Rational:** Yes. Given that we are doing that, you have a very strong reason to continue.
  3.  **The Normativity is Local:** The "ought" only exists relative to the desire to coordinate.

  **The Verdict:**
  If you are looking for a philosophical foundation that says norms have **objective, mind-independent moral weight**, Lewis will disappoint you. He is a reductionist; he wants to show how norms emerge from self-interested agents without needing mystical "social glue."

  However, if you view norms as **tools for social cooperation**, Lewis is incredibly powerful. He shows that you don't need a "genuine force" beyond the practical necessity of getting along with others. The "force" is the reality of social consequences.

  **Summary:** You are right that Lewis makes the *origin* of norms accidental. But he argues the *reason to follow them* is not an illusion—it's the pragmatic necessity of avoiding social collision. Whether that counts as "genuine normativity" depends on whether you think morality requires something more than pragmatism. (Many philosophers, like Gilbert, say yes.)
