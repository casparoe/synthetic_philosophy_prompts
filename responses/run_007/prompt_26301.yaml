prompt: |-
  ok so I've been reading about David Lewis's account of convention and I'm stuck on something. The way I understand it, a convention is basically just one equilibrium among many in a coordination game — like driving on the right vs. the left, neither is better, it's just arbitrary which one we settled on. But if that's the model for how all conventions and social norms work, then doesn't that mean norms are ultimately arbitrary and there's no actual reason to follow them? Like, if we'd happened to settle on a different equilibrium, we'd take *that* as normative instead. So isn't the whole idea of norms having genuine force just an illusion — we're basically just conforming to whatever accident of history we happened to land on and then rationalizing it after the fact?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** David Lewis's account of convention (from *Convention: A Philosophical Study*).
      *   **User's Understanding:** Conventions are equilibria in coordination games (e.g., driving left vs. right). They are arbitrary (either works, just need agreement).
      *   **User's Worry/Objection:** If norms are just arbitrary equilibria, do they have genuine normative force? Or is it just historical accident + rationalization? Does this reduce norms to mere conformity without *reason*?
      *   **Core Philosophical Tension:** The "Arbitrariness Objection" to Lewisian conventionalism. If $X$ is conventional, why *ought* I do $X$ rather than $Y$? Is the "ought" just hypothetical (if you want to coordinate) or categorical (you should do $X$)?

  2.  **Deconstruct Lewis's Account:**
      *   **Definition:** A regularity $R$ in population $P$ in circumstance $C$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform.
          3.  Everyone prefers to conform *on the condition that* others conform (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the problem just as well.
          5.  These facts are mutual knowledge.
      *   **Key Feature:** Arbitrariness. $R$ is arbitrary because $R'$ would have worked too.
      *   **Normativity:** Lewis is often read as reducing normativity to expectations and preferences. It's a *practical* reason, not necessarily a *moral* one.

  3.  **Address the User's Worry (The "Normative Force" Issue):**
      *   *Is the force an illusion?* Not exactly an illusion, but it is *conditional*.
      *   *Why follow it?* Because deviating leads to coordination failure (crashing cars, misunderstood language).
      *   *Is it just history?* Yes, the *selection* is historical/accidental. But the *reason to follow* the selected one is pragmatic.
      *   *Distinction:* Conventions vs. Moral Norms. Lewis's account fits traffic laws and language well. It fits "don't murder" less well (unless you think murder is just a coordination failure, which is controversial).

  4.  **Identify Key Counter-Arguments/Refinements (Philosophical Context):**
      *   **Margaret Gilbert:** Criticizes Lewis for missing the "joint commitment." For Gilbert, conventions create obligations, not just expectations. This addresses the "genuine force" worry.
      *   **Ruth Millikan:** Teleological account. Conventions exist because they serve a function.
      *   **Andrei Marmor:** Social conventions vs. constitutive conventions. Some conventions create the very activity they govern (like chess rules), making them non-arbitrary in a sense.
      *   **Lewis's Own View:** He was a Humean. He didn't believe in categorical imperatives. Reasons for action stem from desires. So, for Lewis, the "force" *is* the desire to coordinate.

  5.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge that the user has hit on the central criticism of Lewis. This is the "Arbitrariness Objection."
      *   *Clarify Lewis's Position:* Lewis isn't trying to ground *moral* normativity. He's explaining *social* regularity. The "reason" to follow is instrumental (to avoid crashing).
      *   *The "Why" Question:* Distinguish between "Why this rule?" (History/Arbitrary) and "Why follow the rule?" (Pragmatics/Coordination).
      *   *The Normative Force:* Is it an illusion?
          *   *Lewisian Answer:* No, it's a hypothetical imperative. *If* you want to speak/drive safely, you must follow the convention.
          *   *Critique:* But what if I don't care? (The free-rider problem).
      *   *Alternative Accounts (To broaden the horizon):*
          *   Gilbert (Joint Commitment): Adds genuine obligation.
          *   Marmor (Constitutive): Some norms aren't arbitrary because they define the practice.
      *   *Conclusion:* The user is right that Lewis's account makes the *selection* arbitrary, but the *adherence* rational. Whether that counts as "genuine normative force" depends on your meta-ethics.

