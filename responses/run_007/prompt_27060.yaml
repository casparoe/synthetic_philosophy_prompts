  9.  **Constructing the Output:** I will provide a detailed essay outline with argumentative beats, followed by a discussion of the specific philosophical points requested (narrative fiat, free will, contribution to literature). This will give the user a robust framework to write the actual essay.

  *(Self-Correction during drafting)*: I need to make sure I don't just summarize the plot. Every plot point must serve the RCP argument. For instance, the "ball rolling down the hill" scene isn't just about destiny; it's about initial conditions defining the reference class. If you nudge the ball (intervention), you change the class.

