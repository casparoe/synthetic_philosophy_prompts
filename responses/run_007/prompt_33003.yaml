answer: |-
  **MEMORANDUM**

  **TO:** Academic Technology Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation: AI Integration and Epistemic Integrity in Undergraduate Coursework

  **Introduction**

  As we draft policy for the upcoming semester, we face a tension between technological adaptation and educational integrity. The prevailing discourse often frames Generative AI as a plagiarism engine or a productivity booster. Both frames are insufficient. This memo recommends a policy of **Process-Verified Integration**. We must move beyond policing output and toward auditing the cognitive process. Our position is that AI use is permissible only when the student can demonstrate independent verification and reasoning regarding the AI's contribution. We cannot ban the tool without rendering students obsolete, but we cannot accept the tool without rendering students intellectually hollow.

  **The Philosophical Stakes: Understanding vs. Output**

  We must engage seriously with the concern that AI fundamentally alters the nature of "understanding." Traditional academic assessment often conflates the *product* of thinking (an essay, a code block, a solution) with the *process* of thinking. A philosophy colleague recently argued that understanding constitutes the ability to trace reasons—to see *why* something is the case. When a student offloads reasoning to a model, they acquire the product without the process. They possess the answer, but not the justification.

  This is not merely a semantic distinction. If education aims to cultivate cognitive agency, then outsourcing the reasoning step is catastrophic, even if the output is perfect. Unlike a calculator, which automates arithmetic (a mechanical step) but leaves the formulation of the equation to the student, Large Language Models automate the formulation of the argument itself. If we allow students to submit AI-generated reasoning as their own, we are certifying competence they do not possess. Therefore, our policy cannot simply focus on citation; it must focus on *validation*.

  **Addressing Counterarguments**

  Two common objections arise. First, the "Calculator Analogy": critics argue we adapted to calculators and Google, so we will adapt to AI. This ignores the qualitative difference between computational aid and reasoning substitution. Calculators did not write the math proofs; AI writes the essay. Adapting to AI requires more than acceptance; it requires a restructuring of how we assess reasoning.

  Second, the "Workforce Readiness" argument suggests that banning AI leaves students unprepared for a future where AI is ubiquitous. This is valid. However, workforce readiness does not mean uncritical reliance. In professional contexts, liability rests with the human, not the tool. A lawyer using AI for case law is liable for hallucinations; an engineer using AI for code is liable for structural failures. Therefore, "readiness" means cultivating the expertise to audit AI, not just the prompt engineering skills to generate output. A policy that allows unchecked AI use fails to prepare students for the responsibility they will bear in the workforce.

  **Policy Recommendation: The "Human-in-the-Loop" Mandate**

  For the next semester, we recommend a tiered policy that shifts the burden of proof from the instructor to the student. We propose the **Human-in-the-Loop (HITL) Standard**.

  1.  **Mandatory Disclosure Logs:** Any submission utilizing AI must include a standardized appendix detailing the prompts used, the model version, and a brief reflection on how the output was modified. Undeclared AI use constitutes academic dishonesty, regardless of quality.
  2.  **Process Verification:** Faculty are encouraged to redesign assessments to verify the reasoning trace. This includes:
      *   **In-Class Defenses:** A portion of the grade for take-home assignments should be contingent on a brief oral explanation or in-class quiz regarding the core concepts of the submission. If a student cannot explain the reasoning behind their AI-assisted answer, the grade is capped.
      *   **Iterative Drafting:** Require submission of early outlines or reasoning maps generated *before* AI consultation, to establish the student's baseline conceptual framework.
  3.  **AI-Critique Assignments:** Rather than banning generation, assign tasks where the primary work is critiquing, correcting, or expanding upon AI-generated content. This forces the student into the role of expert editor, requiring them to understand the material well enough to identify errors or gaps in the model's reasoning.

  **Implementation Strategy**

  To make this actionable for faculty next semester, the Committee will provide:

  *   **Syllabus Language:** Standardized clauses defining permitted AI tiers (e.g., "Editing only," "Brainstorming allowed," "Full generation permitted with audit").
  *   **Assessment Templates:** Rubrics that allocate points specifically for the "Verification" component, ensuring students are graded on their understanding of the tool's output, not just the output itself.
  *   **Workshops:** Quick-turnaround faculty development sessions focused on designing "AI-Resistant" assessments that prioritize oral defense and in-process reasoning over final product submission.

  **Conclusion**

  We must reject the false choice between prohibition and permissiveness. The goal of undergraduate education is not the production of correct answers, but the cultivation of minds capable of deriving them. By adopting the Human-in-the-Loop Standard, we acknowledge the reality of AI while insisting that the cognitive work of reasoning remains a human responsibility. We prepare students for the future not by letting the machine think for them, but by training them to think harder than the machine.

  **Recommendation:** Adopt the HITL Standard as the default framework for undergraduate AI policy for the upcoming semester.
