      *   **Topic:** Philosophy of pain (specifically the nature of pain's "badness" or unpleasantness) vs. Neuroscience of pain (sensory-discriminative vs. affective-motivational pathways).
      *   **Task:**
          1.  Restate main philosophical positions on the badness of pain using neuroscientific vocabulary.
          2.  Provide a "residue report" (mapping fidelity: what maps cleanly, what requires fudging, what has no counterpart).
