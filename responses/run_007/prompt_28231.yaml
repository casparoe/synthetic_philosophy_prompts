  The idea in one paragraph
  This activity forces the group to allocate scarce rewards using only numerical bids, revealing that numbers mask subjective intensity. Participants distribute prizes based on desire scores, finding outcomes conflict depending on aggregation method. Withholding theoretical labels ensures frustration arises from the mechanics of decision-making itself. Participants feel the tension between needing to compare values to decide fairly and the impossibility of verifying those comparisons. The conflict emerges when two valid counting methods yield different winners, proving numbers alone cannot resolve the moral weight of the decision. This grounds the philosophical problem in immediate practical failure. Structured confusion makes the abstract problem of interpersonal comparison a tangible obstacle they must navigate.

  Setup and materials
  Arrange tables in a hollow square so everyone faces inward. You need 15 minutes for setup, 60 for activity, 15 for debrief. Materials include: five distinct prizes (three $10 coffee gift cards, one box of high-quality chocolates, one plush seat cushion), printed bidding sheets (one per person), pens, a whiteboard or flipchart, and a calculator. The stakes must be desirable but not life-changing; ensure the chocolates are visibly premium and the cushion is comfortable. Prepare two distinct scoring rules on separate cards for the facilitator: Rule A (Highest Total Score) and Rule B (Highest Average Score). Print large number cards (0-10) for each participant to hold up if needed, though written bids are primary. Ensure the room has enough writing surface. Have a timer visible. The key is that the prizes are heterogeneous enough that preferences will vary wildly, ensuring some people care deeply about specific items while others are indifferent, creating the necessary variance in bidding behavior. Allow participants to bid zero to signal indifference, which is crucial for the later conflict.

  The activity, step by step
  Begin by displaying the five prizes prominently on a central table. Ensure the chocolates are unwrapped slightly so the scent is visible. Read aloud: "We must allocate these items today. We cannot vote. We cannot discuss preferences yet. You will privately write a number from 0 to 10 for each item, representing how much you want it. 10 means 'I really want this,' 0 means 'I do not care.' You may rate each independently. Honesty is required for this to work. If you want nothing, write 0." Distribute bidding sheets and pens. Allow 15 minutes for private bidding. Walk around to ensure no collaboration. If asked about strategy, say only: "Write what you feel." At minute 10, announce "Five minutes remaining" to create urgency. Collect sheets anonymously into a box.

  While participants chat, calculate Allocation 1 using Rule A: For each item, identify the highest bidder. If there is a tie, flip a coin publicly. Announce the winners clearly. Place the items in front of them. Ask: "Does everyone accept this outcome based on the numbers? Raise your hand if you feel this is fair." Wait for objections. Usually, someone with a 9 who lost to a 10 will question the intensity. If no one objects, point to a specific close call and ask, "What about this tie? Is a 10 always better than a 9?" Note body language; if a winner looks uncomfortable, mark this for later.

  Then say: "Let's try a different reasonable method using the same numbers. This method values focus over total desire." Calculate Allocation 2 using Rule B: Calculate each person's "Intensity Ratio" (highest bid divided by total bids). Prioritize those with high ratios, indicating focused desire rather than general greed. Reassign the items. Announce the new winners. Note that some people lost prizes they previously won. Ask: "Which method is fairer? Why did the winners change?"

  Allow 20 minutes for open discussion. Do not intervene unless rules are broken. Watch for participants claiming their scale is different. If the group reaches consensus too quickly, introduce a tie-breaker that favors a different person. If they argue about the math, correct them gently. Write conflicting arguments on the whiteboard without resolving them. If participants start negotiating trades, allow it for five minutes, then stop. After 20 minutes, stop the debate. Say: "We cannot decide. Keep this tension. We will discuss why this happened now." Collect the prizes back without distributing them yet. Ensure no one leaves with goods until the session ends. Remind them that the numbers were the only data used.

  Debrief
  Start by asking, "Why did the winners change when we changed the math, even though your numbers stayed the same?" Listen for answers about fairness. Write their answers on the board. Then ask, "What does a '10' actually measure? Is it the same for everyone?" Guide them to see that the numbers are private languages. Map the conflict moment to the core problem: we needed to compare values to decide, but the tool broke during comparison. If the group accepts the first result without question, ask: "If Person A's 10 is a mild preference, and Person B's 8 is a desperate need, did we choose correctly?" This forces the realization that the scale lacks a common zero point or unit.

  Finally, name the problem: "Interpersonal Comparison of Utility." Explain that economics and ethics struggle with this exact issue. Confirm that their frustration was the point: the numbers promised objectivity but delivered ambiguity. Ensure everyone understands that this isn't about cheating, but about the limits of measurement. Ask: "Did anyone feel tempted to inflate their numbers?" Use this to discuss strategic voting versus honest reporting. Connect the modest stakes to real life: "If this were a housing unit or medical resource, would the numbers work better?" The answer should be no. Conclude by validating their confusion as a sophisticated insight into social choice theory. You must explicitly state that no algorithm solves this without assuming a common scale. Ask participants to reflect on how they rate things in daily life. Do they assume others feel pain or joy similarly? This connects the game to their personal intuition. Remind them that policy often ignores this gap.

  What will predictably go wrong
  Participants may inflate bids (all 10s) to game the system. If this happens, proceed without commenting; the resulting noise makes the comparison even harder, reinforcing the point. Someone might dominate the debrief; gently redirect by asking quieter members, "Did your numbers mean the same as theirs?" The math might accidentally produce identical winners for both methods. If so, manually adjust one tie during calculation to ensure a conflict occurs; you need the divergence to prove the scale's instability. Participants may blame you for the confusion. Accept this; say, "The rules are just math; the problem is in the numbers you wrote." Do not explain the theory early to fix their frustration. Another risk is apathy; if stakes feel too low, bids will be random. Ensure the prizes are visible and desirable throughout. If someone claims their need is objectively greater, acknowledge it but return to the numbers: "The sheet doesn't show that, though." This highlights the information loss.

  What the activity cannot reproduce
  This game cannot reproduce the weight of long-term relationships or true desperation. In real life, trust and history inform how we interpret others' claims, whereas here everyone is a stranger with a sheet of paper. The activity also cannot show how societies build institutions to manage this problem over time; it only shows the immediate breakdown. You must supply the context that philosophers and economists have debated this for centuries without consensus. The game creates the feeling of the problem, but you must provide the vocabulary to discuss it afterward. Finally, the game assumes static preferences; real desires change during negotiation. You will need to explain that the common measuring stick issue persists even when people talk, though conversation helps calibrate the scales slightly. You must also clarify that this isn't a solvable puzzle but a structural feature of group decision-making.
