answer: |-
  You are right to be annoyed. "The will of the people" is one of the most potent pieces of political rhetoric precisely because it is semantically unstable. It functions as a **motte-and-bailey doctrine**: when challenged, the speaker retreats to a boring, defensible definition (e.g., "people voted"), but when unchallenged, they advance to a radical, undefended one (e.g., "this vote overrides all rights and institutions").

  In the specific context of **Referendum vs. Court**, the phrase is doing heavy lifting to bridge the gap between *majoritarianism* (what most people want) and *constitutionalism* (what the law allows).

  Here is a menu of five distinct readings of the claim, ranked from trivial to radical, with verdicts and specific pushback strategies for each.

  ---

  ### 1. The Empirical Headcount
  **The Claim:** "A majority of voters currently prefer Policy X."
  **The Nature:** Purely factual/descriptive.
  **The Verdict:** **Defensible but insufficient.**
  This is the weakest version. It makes no claim about whether the preference *should* be enacted, only that it exists. In a referendum context, this is usually true by definition (if the referendum passed). However, it fails to settle the argument because democracy is not just about counting heads; it is about what those heads are allowed to decide.
  **The Pushback:**
  > "I agree that a majority voted for this. But 'is' does not equal 'ought.' A majority might want to restrict free speech or seize property. Does the 'will of the people' mean the majority gets to do literally anything, or are there guardrails?"

  ### 2. The Procedural Mandate
  **The Claim:** "A legitimate democratic process produced Result X, so the government is authorized to enact it."
  **The Nature:** Institutional/Procedural.
  **The Verdict:** **Strong, but conditional.**
  This is the standard liberal-democratic reading. It respects the mechanism of voting. However, in a constitutional democracy, procedures are layered. A referendum is one procedure; judicial review is another. This reading assumes the referendum is the *highest* procedure, which is exactly what is in dispute when courts are involved.
  **The Pushback:**
  > "We agree on respecting procedures. But we have multiple procedures. We have the referendum procedure *and* the constitutional review procedure. If the court says the referendum violates the higher-order rules (the Constitution), why does the lower procedure trump the higher one?"

  ### 3. The "General Will" (Rousseauian)
  **The Claim:** "The vote reveals the true, long-term interest of the community, even if it conflicts with individual rights or short-term preferences."
  **The Nature:** Normative/Philosophical.
  **The Verdict:** **Confused and Dangerous.**
  This reading suggests "The People" is an entity with a singular interest distinct from the sum of individual voters. It implies that the referendum didn't just count preferences, it discovered a moral truth. This is often used to dismiss minority objections as "selfish" against the "common good." It is philosophically incoherent because "the people" are not a single agent with a single mind.
  **The Pushback:**
  > "That treats 'the people' like a single person with one mind. But society is made of competing groups. When you say 'the will of the people,' are you actually saying 'the will of the 51%'? If so, why does their long-term interest automatically outweigh the legal rights of the 49%?"

  ### 4. The Sovereign Trump Card (Schmittian)
  **The Claim:** "The People are the ultimate Sovereign; therefore, their direct expression overrides all intermediaries (courts, legislatures, constitutions)."
  **The Nature:** Radical/Political Theological.
  **The Verdict:** **Radical and Anti-Liberal.**
  This is the reading usually doing the work when someone tries to end a debate about courts. It posits that the "constituent power" (the people) is always superior to the "constituted power" (the institutions). While theoretically interesting, accepting this effectively ends constitutional democracy. It means rights are only privileges granted by the majority and can be revoked by them at any time.
  **The Pushback:**
  > "If the will of the people overrides the Constitution, then we don't have a rule of law; we have mob rule. The whole point of courts is to protect the rules *against* temporary majorities. Are you arguing that we should abolish judicial review entirely?"

  ### 5. The Metaphysical Fiction (Populist)
  **The Claim:** "There is a mystical, homogeneous 'People' whose will is being blocked by elites (judges), and only I/we can interpret it."
  **The Nature:** Rhetorical/Mythic.
  **The Verdict:** **Intellectually Bankrupt.**
  This is the version you identified as "mystical." It assumes that anyone who opposes the referendum result is, by definition, *not* part of "the people." It creates a binary: The Real People vs. The Corrupt Elite. It is unfalsifiable because it redefines "the people" to exclude anyone who disagrees.
  **The Pushback:**
  > "Which people? 48% of the country voted the other way. Are they not part of 'the people'? When you use that phrase, it sounds like you're defining 'the people' as only those who agree with you. That's not democracy; that's sectarianism."

  ---

  ### Why It Works as a Conversation-Ender
  The phrase works rhetorically because it conflates **Legitimacy** (the right to rule) with **Infallibility** (the right to be unchallenged).

  When your opponent says, "We must respect the will of the people," they are trying to move the goalposts from **Legality** (Is this constitutional?) to **Legitimacy** (Is this democratic?). In a liberal democracy, these two things are in constant tension. A court ruling against a referendum is *undemocratic* by definition (it stops the majority), but it is *legal* by design (it protects the framework).

  ### How to Deploy This in Argument
  Next time, do not attack the phrase directly. Instead, force them to select from the menu. This prevents them from sliding between definitions.

  **Step 1: The Clarification Trap**
  > "When you say 'will of the people,' do you mean the raw vote count, or do you mean the majority should have unlimited power to ignore the Constitution?"

  **Step 2: The Minority Check**
  > "If the 'will of the people' is the highest authority, what protections exist for the minority if the 'will' turns against them? If the answer is 'none,' then we aren't talking about a liberal democracy."

  **Step 3: The Institutional Reality**
  > "In our system, the 'will of the people' is expressed through *multiple* channels: the ballot box, yes, but also the Constitution they ratified earlier. Why is the will of the people expressed *today* more sacred than the will of the people expressed when they wrote the laws?"

  ### Summary Verdict
  *   **Readings 1 & 2 (Headcount/Procedure):** Defensible, but do not justify overriding courts.
  *   **Reading 3 (General Will):** Confused; assumes a collective mind that doesn't exist.
  *   **Reading 4 (Sovereign Trump):** Coherent, but requires abandoning constitutional liberalism.
  *   **Reading 5 (Metaphysical):** Propaganda; designed to silence dissent.

  If they insist the phrase "settles it," they are implicitly arguing for **Reading 4 or 5**. You can then accurately reply: *"So your position is that democratic majorities should have absolute power without constitutional checks. That is a coherent position, but it is not the system we currently live in."*

  This moves the argument from "You disrespect the people" (emotional) to "You want to change the constitutional order" (structural), which is a much better place to debate.
