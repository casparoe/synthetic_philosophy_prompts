  You are right that there is no external criterion to spare us the risk—that is precisely why faith is a trial rather than a calculation—but you are wrong to assume the internal topology of the act is identical. The ethical *is* universally binding, which is why Abraham suffers such profound anguish; if it weren't, there would be no suspension, only indifference. The lunatic acts from immediacy or pathology, negating the ethical entirely because he sees no obligation there, whereas Abraham acts from a conscious, agonizing relation to the Absolute, feeling the full weight of the ethical demand even as he suspends it. Abraham knows he is not a fanatic not through objective certainty, but through the intensity of the temptation and the specific hope of return: the fanatic destroys Isaac and loses him, whereas Abraham sacrifices Isaac while believing, by virtue of the absurd, that he will receive him back. This isn't a loophole; it's a different category of existence where the individual is higher than the universal, not because he ignores duty, but because his duty to God transforms the meaning of the act from murder to sacrifice. You cannot verify this from the outside, but that doesn't mean the distinction isn't real; it means the verification belongs to the subject before God, not the crowd.
