  In the AI lab where I work, a senior researcher has started using Turing's line from *Computing Machinery and Intelligence* (1950) to settle arguments about research direction: "Instead of trying to produce a programme to simulate the adult mind, why not rather try to produce one which simulates the child's? If this were then subjected to an appropriate course of education one would obtain the adult brain." He deploys it to dismiss any approach that tries to build sophisticated reasoning into a model from the start, insisting we should only build minimal learning architectures and let them "grow up" through interaction. Something about the way the quote gets used as a conversation-ender bothers me, but I can't articulate exactly what's wrong or right about it. I want to go into our next meeting with a clear map of the different precise claims that slogan could be making, so I can ask which one he intends and whether it actually supports the methodological conclusion he draws. Please lay out the distinct readings of Turing's child-machine slogan — from the most literal to the most metaphorical — and for each, say whether it is an empirical claim about development, a design heuristic, a claim about the sufficiency of a certain kind of initial state, or something else. Then indicate which readings, if any, actually license the inference "therefore we should not directly engineer adult-like capacities," and which readings would be compatible with doing exactly that. Keep the response to at most 600 words.
