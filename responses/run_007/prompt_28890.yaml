prompt: |-
  I've been reading about how psychology experiments get approved and something's bugging me. My uni's research ethics committee makes researchers get informed consent before a study: participants are told what they're signing up for and sign a form. But the same committee also approves studies that involve deception — researchers lie about the purpose of the study, give fake feedback, or plant a confederate who pretends to be another participant. The participant signs a form saying they agree to be deceived, but they're obviously not told what the deception will actually be, becuase that would ruin the study. At most they're told in vague terms that they might be misled at some point. What theory of valid consent does this practice presuppose? Does it treat consent as a one-off thing at the start rather than something ongoing, and is it coherent to consent to being deceived when you don't know what you're agreeing to? And what about the fact that most participants are students earning course credit — does the committee's practice quietly presuppose that mild inducements don't undermine voluntariness? I want to know what this institutional practice implies about how deception, coercion, and competence each bear on consent, whether the practice is internally consistent, and what would have to change if the committee instead held that any deception at all invalidates consent. Lead with your bottom line in the first sentence, then give the reasoning. No preamble and no restating of the question. And write in British English please.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Research ethics, specifically informed consent vs. deception in psychology experiments.
      *   **Key Questions:** What theory of valid consent does this practice presuppose? Is it coherent to consent to unknown deception? Does it treat consent as one-off? What about inducements (course credit)? What does this imply about deception, coercion, and competence? Is it internally consistent? What would change if deception invalidated consent?
      *   **Constraints:**
          *   Lead with the bottom line in the first sentence.
          *   Give the reasoning after the bottom line.
          *   No preamble.
          *   No restating of the question.
          *   Write in British English.

  2.  **Determine the Bottom Line:**
      *   The core tension is between autonomy (informed consent) and scientific validity (deception). The institutional practice presupposes a *procedural* or *authorisation-based* theory of consent rather than a strictly *information-based* one, prioritising welfare and debriefing over full initial transparency.
      *   *Draft Bottom Line:* The institutional practice presupposes a procedural theory of consent that prioritises welfare and post-study debriefing over full initial transparency, treating consent as an authorisation to participate within regulated bounds rather than a fully informed agreement to specific procedures.
      *   *Refinement for punchiness:* The committee's practice presupposes a procedural theory of consent that treats authorisation as valid provided welfare safeguards exist, rather than demanding full informational transparency at the outset.

  3.  **Develop the Reasoning:**
      *   **Theory of Consent:** It's not the standard medical model (full disclosure). It's more akin to "consent to be managed" or "blanket consent" within limits. It relies on the ethical justification that the deception is necessary and harmless (minimal risk).
      *   **One-off vs. Ongoing:** It treats consent largely as one-off at the start, but mitigates this with debriefing (retrospective consent). The "consent to be deceived" clause is a meta-consent.
      *   **Coherence:** Is it coherent? Philosophically, it's shaky (can you consent to X if you don't know X?). Practically, it's justified by utilitarian outcomes (greater good of knowledge) and harm reduction.
      *   **Inducements (Course Credit):** It presupposes that mild inducements don't undermine voluntariness (undue influence vs. fair compensation). It assumes students are competent enough to weigh credit against discomfort.
      *   **Deception, Coercion, Competence:**
          *   *Deception:* Valid if necessary, minimal risk, and debriefed.
          *   *Coercion:* Assumes course credit is not coercive (undue inducement).
          *   *Competence:* Assumes adults/students can understand the *possibility* of deception even if not the *content*.
      *   **Internal Consistency:** It's consistent within a framework of "principled exception" (Belmont Report principles: Respect for Persons, Beneficence, Justice). It balances autonomy with beneficence.
      *   **If Deception Invalidated Consent:** Most social psychology would vanish. Studies would need naturalistic observation (no consent) or full disclosure (demand characteristics).

  4.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Behaviour, programme, centre, authorised, etc.
      *   *Tone:* Academic, analytical, direct.

      *   *Drafting the Bottom Line:* The committee's practice presupposes a procedural theory of consent that treats authorisation as valid provided welfare safeguards exist, rather than demanding full informational transparency at the outset.

      *   *Drafting the Reasoning:*
          *   Explain the "meta-consent" aspect. Participants consent to the *process*, not the specific *content* of the lie.
          *   Address the "one-off" nature. It is one-off, but rectified by debriefing (retrospective consent/withdrawal of data).
          *   Address coherence. It relies on a utilitarian calculus where the value of knowledge outweighs the temporary autonomy violation, provided no harm occurs.
          *   Address inducements. It assumes "undue influence" threshold is not met by course credit; it treats credit as compensation rather than coercion.
          *   Address the "what if" scenario. If deception invalidated consent, social psychology would collapse or shift to non-experimental methods.

