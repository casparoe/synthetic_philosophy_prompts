prompt: |-
  I'm a blockchain dev who's been deep in the weeds of consensus mechanisms for years. I keep hearing evolutionary biologists say that the handicap principle (Zahavi's thing, peacocks' tails, costly signaling) is basicaly the same idea as proof-of-work — that wasting resources proves you're not faking it. I want you to restate the whole costly signaling framework in the vocabulary of crypto and distributed systems: miners, hashpower, difficulty adjustment, Sybil resistance, honest majority, block rewards, forks, nothing-at-stake, the whole lot. Do it systematically.

  Then give me the residue report. What maps cleanly? What did you have to fudge? And what in the biologists' theory has no counterpart at all in how I think about PoW?

  I'm especially interested in one thing. In PoW, every miner faces the same cost per hash — the asymmetry is between the attacker and the honest majority, not between "high-quality" and "low-quality" signalers. But in the handicap principle, the whole point is that the signal has to be differentially costly: it has to hurt a low-quality individual more than a high-quality one, otherwise it doesn't carry information. Does that difference survive the translation, or does it collapse? And if it doesn't survive, is that because my vocabulary is missing something real, or because the biologists' claim is vaguer than it looks?

  Also, write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** Blockchain developer, expert in consensus mechanisms (deep knowledge of PoW, Sybil resistance, etc.).
      *   **Task:** Restate the biological "Handicap Principle" (Zahavi) using crypto/distributed systems vocabulary.
      *   **Requirements:**
          1.  Systematic translation of concepts (Miners, Hashpower, Difficulty, etc.).
          2.  "Residue Report": What maps well, what was fudged, what has no counterpart.
          3.  **Crucial Deep Dive:** Address the specific tension regarding *differential cost* (high-quality vs. low-quality signalers in biology vs. uniform cost per hash in PoW). Does this difference collapse the analogy?
          4.  **Tone/Style:** American English, technical, precise, no fluff.

  2.  **Deconstruct the Handicap Principle (Biology):**
      *   *Core Idea:* Signals are honest because they are costly.
      *   *Mechanism:* The cost must be *differential*. A high-quality individual (healthy peacock) can afford the tail (handicap) easier than a low-quality individual (sick peacock).
      *   *Goal:* Convey private information (genetic fitness) to a receiver (mate/predator) to influence behavior.
      *   *Equilibrium:* Only high-quality types signal because the marginal cost for low-quality types exceeds the marginal benefit.

  3.  **Deconstruct Proof-of-Work (Crypto):**
      *   *Core Idea:* Consensus is achieved because producing blocks is costly.
      *   *Mechanism:* Cost is computational work (electricity + hardware).
      *   *Goal:* Prevent Sybil attacks, establish longest chain as truth, order transactions.
      *   *Equilibrium:* Honest mining is profitable if the majority is honest; attacking is unprofitable if the attacker < 51%.

  4.  **Drafting the Translation (Systematic Mapping):**
      *   *Signaler* -> Miner/Validator.
      *   *Receiver* -> Network Nodes/Full Nodes.
      *   *Signal* -> Valid Block (with valid PoW).
      *   *Handicap/Cost* -> Electricity + Hardware Depreciation (OpEx + CapEx).
      *   *Quality/Fitness* -> Hashrate Efficiency / Access to Cheap Energy / Capital Reserve.
      *   *Benefit* -> Block Reward + Fees.
      *   *Sybil Resistance* -> The barrier to entry created by the cost.
      *   *Honest Majority* -> The equilibrium state where following protocol yields higher ROI than attacking.

  5.  **Addressing the "Residue Report" (Mapping Quality):**
      *   *Clean Maps:* Cost as a barrier to entry, burning resources to prove commitment, the idea that "faking is too expensive."
      *   *Fudged Maps:* "Quality" in biology is intrinsic (genes); "Quality" in mining is extrinsic (capital/energy access). Biology signals *to a mate*; PoW signals *to a network* for consensus, not reputation (mostly).
      *   *No Counterpart:* Biological signaling is often continuous or graded (tail size); PoW is binary (valid/invalid block). Biological fitness is about survival/reproduction; Miner fitness is about profit.

  6.  **Tackling the Crucial Question (Differential Cost):**
      *   *The Tension:* Biology requires $Cost(Low Quality) > Cost(High Quality)$ for the *same signal*. PoW has $Cost(Hash) \approx Constant$ for everyone (at the margin).
      *   *Analysis:* In PoW, the "quality" isn't about who can produce *a* hash cheaper (though efficiency matters), it's about who can sustain the *aggregate* cost.
      *   *Re-framing:* The "differential" in PoW isn't per hash, it's per *unit of capital efficiency*. An inefficient miner (low quality) bleeds margin faster than an efficient miner (high quality).
      *   *The Collapse:* The analogy *does* strain here. In biology, the signal proves *identity/quality*. In PoW, the signal proves *work done*, not *who did it*. PoW is anonymous. Biology is identity-bound.
      *   *Conclusion:* The biologists are metaphorically right (costly = honest) but mechanically distinct. The "differential cost" in PoW maps to *economic sustainability*, not *signal validity*. A low-efficiency miner can still produce a valid block, they just go bankrupt sooner. A low-fitness peacock *cannot* grow the tail without dying.
      *   *Verdict:* The biologist's claim is vaguer. They focus on the *existence* of cost. Crypto focuses on the *verification* of cost. The differential aspect is about *survival of the miner*, not *validity of the block*.

  7.  **Refining the Output (Iterative Polishing):**
      *   *Tone Check:* Ensure it sounds like a dev talking to a dev. Use terms like "marginal cost," "equilibrium," "Sybil attack," "game theoretic."
      *   *American English:* Check spelling (behavior, color, etc.) and idioms.
      *   *Structure:*
          1.  Introduction (acknowledge the analogy).
          2.  The Translation Layer (Glossary).
          3.  The Mechanism (How it runs).
          4.  The Residue Report (Clean, Fudged, Missing).
          5.  The Deep Dive (The Differential Cost Question).
          6.  Conclusion.

  8.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* I initially thought about mapping "Quality" to "Hashrate." But hashrate is just volume. "Quality" in biology is *fitness*. In mining, *fitness* is profit margin. I need to make sure that distinction is clear.
      *   *Nuance:* In PoW, the network doesn't care *who* mined the block. In biology, the female cares *who* the male is. This is a huge divergence. PoW is about *state*, Biology is about *mate selection*. I need to highlight this in the "Missing" section.
      *   *The "Differential" point:* This is the core. I need to be very precise. In PoW, the difficulty adjusts so the *network* faces a constant time cost. The individual miner faces a constant *per-hash* cost. The differential is in the *break-even point*. Low quality miners drop out (bankruptcy). Low quality peacocks die (mortality). So the differential exists in *sustainability*, not *verification*.

  9.  **Final Review against constraints:**
