      *   *Nuance:* Hurwicz actually worked on this! He formalized the SCD. I should mention Hurwicz. He showed Lange's mechanism is informationally efficient *if* incentives are ignored. This validates the user's feeling that incentives are the missing piece for Mises, but information is the missing piece for Hayek.
      *   *Bluntness:* The user asked to be blunt. I need to say where MD is limited. MD is a "physics of social systems" that assumes particles (agents) have defined properties. Austrian econ argues the particles change properties through interaction.

  7.  **Final Structure:**
      *   **Introduction:** Acknowledge the translation validity (Hurwicz did this).
      *   **Part 1: The MD Restatement:** Formalize Lange (Iterative Gradient Ascent), Mises (IC Failure), Hayek (Message Space Dimensionality + Codifiability).
      *   **Part 2: The Residue Report:**
