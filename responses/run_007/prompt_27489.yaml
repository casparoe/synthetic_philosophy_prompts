      *   **Part 3: Testing the Prior:** Validate the user's intuition. Hayek is about *generation* of information, not transmission. Lange is about *agency*, not speed.
      *   **Conclusion:** MD is a powerful lens but assumes a fixed universe. SCD is about an evolving universe.

  8.  **Drafting the Content (incorporating technical terms):**
