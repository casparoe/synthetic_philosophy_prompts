      *   Reference Hurwicz (1960, 1972).
      *   Distinguish between *parameterized* information (MD) and *tacit* information (Hayek).
      *   Distinguish between *allocation* (MD) and *discovery* (SCD).

  9.  **Final Review against constraints:**
      *   Did I use the vocab? Yes (types, messages, IC, etc.).
