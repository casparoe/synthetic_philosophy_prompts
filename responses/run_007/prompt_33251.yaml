          *   *Claim:* Whether simplicity wins depends on the UTM and the world. If the world is complex (relative to the UTM), Anti-Occam might win. No guarantee simplicity wins in finite samples.
          *   *Assessment:* This is the "No Free Lunch" theorem territory. Without assumptions about the environment (that it is simple relative to your UTM), you cannot guarantee a simplicity prior outperforms others.
          *   *Verdict:* Mira is right. There is no *a priori* guarantee that the universe is simple relative to *your* chosen UTM.

