answer: |-
  Your suspicion is well-founded. Your friend's summary is a classic example of "Gödelianism"—the tendency to take precise mathematical results and stretch them into vague philosophical metaphors. While the first half of the summary is technically close to correct, the second half (the implications) is largely rejected by logicians and philosophers of mathematics.

  Here is a breakdown of the summary, followed by answers to your specific questions.

  ### Part 1: Line-by-Line Analysis

  **1. "Gödel showed that any consistent formal system strong enough to do basic arithmetic will contain a true sentence that it can't prove..."**
  *   **Logician's Verdict:** **Accept with a wince.**
  *   **Why:** This is the First Incompleteness Theorem. However, the word "true" is tricky. In logic, truth is relative to a *model*. The Gödel sentence is unprovable within the system. We say it is "true" because, assuming the system is consistent, the sentence asserts its own unprovability, which turns out to be a fact about the system. But strictly speaking, Gödel showed the sentence is *undecidable* (neither provable nor disprovable). Calling it "true" relies on a Platonist view of mathematics that not all logicians share.

  **2. "...and that no such system can prove its own consistency."**
  *   **Logician's Verdict:** **Accept.**
  *   **Why:** This is an accurate summary of the Second Incompleteness Theorem. If a system (like Peano Arithmetic) could prove its own consistency, it would actually be inconsistent.

  **3. "So the consistency of mathematics can't be established, full stop — there's no workaround."**
  *   **Logician's Verdict:** **Wrong.**
  *   **Why:** This is the most dangerous error in the summary. Gödel showed a system cannot prove *its own* consistency. He did *not* show that consistency cannot be proved *at all*. We can prove the consistency of a system using a *stronger* meta-system. (See section (a) below).

  **4. "That's also why the theorems supposedly apply to everything: a legal code or a bureaucracy is itself a formal system of rules, so it will have undecidable cases of its own."**
  *   **Logician's Verdict:** **Wrong.**
  *   **Why:** This is a category error. Gödel's theorems apply only to systems that are (1) consistent, (2) effectively axiomatizable (computable), and (3) expressive enough to encode basic arithmetic. Legal codes fail on all three counts (they contain contradictions, are written in ambiguous natural language, and do not encode arithmetic). (See section (b) below).

  **5. "The general lesson is that any closed system of rules, mathematical or not, is necessarily incomplete."**
  *   **Logician's Verdict:** **Wrong.**
  *   **Why:** There are many formal systems that are both complete and consistent. For example, Euclidean geometry and Presburger arithmetic (arithmetic without multiplication) are complete. Incompleteness is a specific feature of systems complex enough to model number theory, not a universal property of "rules."

  ---

  ### Part 2: Specific Questions

  #### (a) Can the consistency of mathematics be established somehow?
  **Yes.** The claim that consistency cannot be established "full stop" is false.

  Gödel's Second Theorem states that System $S$ cannot prove $Con(S)$ (the statement that $S$ is consistent). However, System $S + 1$ (a stronger system) *can* prove $Con(S)$.
  *   **Example:** In 1936, Gerhard Gentzen proved the consistency of Peano Arithmetic (the standard formalization of basic math). He did this using a meta-system that included "transfinite induction up to epsilon-naught."
  *   **The Catch:** This leads to an infinite regress. To prove the stronger system is consistent, you need an even stronger system. We cannot get an "absolute" proof of consistency from nowhere (foundationalism), but we *can* establish consistency relative to assumptions we find intuitively obvious. Mathematics is not left in a state of unknown consistency; we have very strong evidence for it, just not a self-contained proof.

  #### (b) Do the theorems apply to non-mathematical systems of rules (law, bureaucracy)?
  **No.** Applying Gödel to law or bureaucracy is a popular science myth.

  For Gödel's theorems to apply, a system must be able to represent **recursive functions** and **basic arithmetic** (specifically, it must be able to talk about its own syntax via numbering, known as Gödel numbering).
  *   **Ambiguity:** Legal systems rely on natural language, which is inherently vague. Gödel's theorems require precise, formal syntax.
  *   **Interpretation:** Laws are not algorithmic. They require judges to interpret intent, context, and precedent. A "gap" in the law is not a logical undecidability; it is a call for judicial discretion or legislative amendment.
  *   **Inconsistency:** Gödel's theorems assume the system is *consistent*. Legal systems frequently contain contradictory laws (which are resolved by hierarchy or courts). If a system is inconsistent, Gödel's theorems don't apply (because in classical logic, an inconsistent system proves *everything*, so it is "complete" in a trivial, useless way).

  The idea that "any closed system of rules" is incomplete is a philosophical extrapolation, not a mathematical result.

  ---

  ### Part 3: Confidence and Uncertainty

  **Confidence Level:** **Very High (95%+)**
  The technical distinctions I have outlined above (the conditions for Gödel's theorems, the status of Gentzen's proof, and the category error regarding legal systems) represent the standard consensus among mathematical logicians and philosophers of mathematics. The friend's summary reflects common pop-science misconceptions that are routinely corrected in introductory logic courses.

  **Point of Least Certainty:**
  My only hesitation lies in the philosophical interpretation of the **First Theorem's "truth" claim**.
  I stated above that logicians "wince" at calling the Gödel sentence "true." While most working mathematicians accept the Gödel sentence as true (because it asserts its own unprovability, and it *is* unprovable), this relies on the assumption that the standard model of arithmetic is the "correct" one. There are non-standard models of arithmetic where the Gödel sentence is false. Therefore, saying the sentence is absolutely "true" depends on one's philosophy of mathematics (Platonism vs. Formalism). While this doesn't change the mathematical proof, it is the one area where reasonable experts might debate the wording more than the other points I've raised.
