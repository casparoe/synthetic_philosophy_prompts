answer: |-
  This is one of the oldest and most persistent problems in moral psychology and philosophy. You are describing **akrasia** (weakness of will), and your friend is articulating a version of **Humean desire-based theory** mixed with **revealed preference theory** from economics.

  While your friend's advice on *how to fix it* (commitment devices) is practical and sound, his philosophical explanation of *what is happening* is flawed. You are right to feel that something important is being missed. If your friend were entirely right, the phenomenon of regret would be unintelligible.

  Here is a breakdown of why your intuition is correct, where your friend's logic fails, and exactly what kind of irrationality is occurring.

  ### 1. The Friend's Error: Conflating "Action" with "Endorsement"
  Your friend's argument rests on a principle from economics called **Revealed Preference**: the idea that the only way to know what someone prefers is to look at what they actually choose. If you choose sleep over exercise, you revealed a preference for sleep.

  The problem is that this works for buying apples vs. oranges, but it fails for internal conflicts. It collapses the distinction between an **impulse** and a **judgment**.

  *   **First-Order Desires:** "I want to sleep right now." (The morning self)
  *   **Second-Order Volitions:** "I want to be the kind of person who exercises." (The night self)

  The philosopher Harry Frankfurt argued that what makes us distinct agents is not just having desires, but having desires *about* our desires. When you set the alarm, you are expressing a second-order volition. When you turn it off, you are succumbing to a first-order desire.

  If your friend is right, then a heroin addict who desperately wants to quit but relapses has no conflict. They simply "preferred" the heroin in that moment. This renders the concept of addiction (and resolution, and regret) meaningless. You feel regret precisely because your first-order desire (sleep) violated your second-order volition (health/discipline). That gap is real, not a story.

  ### 2. The Nature of the Irrationality: Time Inconsistency
  You mentioned that your preferences shift based on temporal proximity. In behavioral economics, this is called **Hyperbolic Discounting**, and it is mathematically demonstrable as irrational.

  A "rational" agent discounts the future exponentially.
  *   Would you take \$100 today or \$110 tomorrow? Many people take \$100 today.
  *   Would you take \$100 in 30 days or \$110 in 31 days? Most people wait for the \$110.

  Notice the inconsistency? In both cases, the delay is exactly one day. But when the reward is *immediate*, the value spikes disproportionately. This is a violation of **transitivity** in preferences.

  If you prefer A over B today, and the conditions haven't changed fundamentally, you should prefer A over B tomorrow. But in your case:
  *   **Night Self:** Prefers Exercise (at 6 AM) > Sleep (at 6 AM).
  *   **Morning Self:** Prefers Sleep (at 6 AM) > Exercise (at 6 AM).

  Nothing about the *value* of exercise changed between 10 PM and 6 AM. Only your proximity to the discomfort changed. Your friend says this is just a "preference shift." But if preferences flip-flop solely based on proximity to the stimulus, you can be "money-pumped" (exploited) indefinitely. That is the definition of irrationality in decision theory. You are not just changing your mind; you are violating your own prior constraints without new information.

  ### 3. The "True Self" isn't Magic, it's Information
  Your friend mocks the idea of a "truer self," implying it's some mystical soul. But we can define the "true self" functionally without metaphysics.

  The **Night Self** has:
  *   More cognitive bandwidth (not tired).
  *   Less emotional noise (not facing the comfort of the warm bed).
  *   Access to long-term consequences (health, career, finances).

  The **Morning Self** has:
  *   High cognitive load (grogginess).
  *   High emotional salience of immediate comfort.
  *   Tunnel vision on the immediate cost (leaving the bed).

  It is rational to trust the judgment of the agent with more information and less noise. When you drink alcohol, your "drunk self" might prefer to drive home. We don't say, "Well, that's what he preferred in the moment." We say his capacity for rational judgment was impaired.

  Sleepiness, hunger, and stress are mild forms of impairment. The "Night Self" isn't a different person; it's the **same person with better executive function.** To say there is no difference between the two states is to ignore the biology of decision-making.

  ### 4. Why the Diagnosis Matters
  You might ask: "Even if he's wrong philosophically, isn't his advice right? Just use commitment devices."

  Practically, yes. But the *diagnosis* matters for your psychological well-being.

  *   **If your friend is right:** You are simply a person who likes sleep more than fitness. Every time you fail, you are just being honest. But then why do you feel guilt? If you accept his view, you must also accept that your regret is irrational. This leads to cynicism or resignation.
  *   **If you are right:** You are a unified agent experiencing a systematic cognitive bias (present bias). The regret is a signal from your long-term planning system that your short-term execution system hijacked the controls.

  Recognizing this allows you to stop viewing it as a **moral failure** ("I am lazy") and start viewing it as an **engineering problem** ("My hot state overrides my cool state").

  ### 5. Conclusion: Who is Right?
  You are right that something genuinely irrational is going on.

  1.  **It is not a neutral preference shift:** It is a **time-inconsistent preference reversal**, which violates standard axioms of rationality.
  2.  **It is not just a story:** The regret is evidence that your "all-things-considered judgment" (Night) was overruled by a "local impulse" (Morning).
  3.  **The "True Self":** You don't need a soul to have a "true self." You just need to acknowledge that the self capable of long-term planning is a more reliable arbiter of your welfare than the self in the grip of immediate temptation.

  **The Verdict:** Your friend is offering a **therapeutic deflation** of the problem (stop worrying, just hack your behavior), which is useful, but his **ontological claim** (there is no weakness of will, only shifting preferences) is false.

  The irrationality lies in allowing a temporary state (fatigue/comfort) to veto a permanent value (health/discipline). Acknowledging this doesn't mean you should beat yourself up; it means you should respect your Night Self enough to build the barriers your Morning Self cannot cross. That isn't self-betrayal; it's self-governance.
