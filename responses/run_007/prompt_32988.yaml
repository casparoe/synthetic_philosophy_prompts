answer: |-
  This is a fantastic set of questions. You are right to push back against your roommate's reading. The common caricature of Du Bois is that he wanted Black artists to paint literal pictures of lynching or voting booths. But in "Criteria of Negro Art," his argument is ontological, not just thematic. He argues that because Black people are *misrepresented* in the public imagination, any art created by Black people that asserts their humanity, complexity, or beauty is inherently political, regardless of its subject matter.

  To reconstruct how Du Bois might analyze these modern phenomena, we need to isolate the core tensions in his philosophy. He wasn't a monolith; his thinking evolved from a focus on the "Talented Tenth" to a more radical, Pan-African socialism. However, three consistent principles from the "Criteria" era can help us navigate your three cases:

  1.  **The Triad:** Art must strive for **Truth** (accurate representation of Black life), **Beauty** (aesthetic excellence is non-negotiable), and **Goodness** (moral utility/advancement of the race).
  2.  **The Audience:** Art is a bridge. It must appeal to Black people to build pride, *and* it must appeal to white people to dismantle prejudice. (This creates a constant tension).
  3.  **The Teleology:** The ultimate end of Black art is the liberation and full humanity of Black people. If the art serves a different master (capital, the state, an algorithm), it fails.

  Here is how those principles might apply to your three scenarios, highlighting where Du Bois's own criteria might conflict.

  ### 1. Corporate DEI Campaigns
  *The Scenario:* A multinational corporation commissions a Black artist for an ad campaign to signal inclusivity.

  **The Du Boisian Analysis:**
  Du Bois would likely view this with deep suspicion, though he would acknowledge the economic necessity for the artist.

  *   **The Conflict of "Goodness":** For Du Bois, propaganda must serve the *race*, not the *market*. In "Criteria," he writes, "I do not care a damn for any art that is not used for propaganda." But the key is *whose* propaganda? If a corporation uses Black aesthetics to sell products while engaging in exploitative labor practices (perhaps even in the Global South), Du Bois would argue this art is serving the wrong god. It creates a "Truth" that suggests racial harmony within a capitalist structure he increasingly viewed as inherently racist.
  *   **The Tension:** Du Bois understood Black artists needed to eat. He spent years fundraising for *The Crisis*. He might concede that if the commission allows the artist to survive to create more independent work, it has utility. However, he would likely critique the *content* if it sanitizes Blackness to make it palatable for white consumption.
  *   **Verdict:** He would likely see this as **co-opted propaganda**. It has the *form* of Black art, but it lacks the *teleology* of Black liberation. It advances the corporation's brand, not the Black community's standing.

  ### 2. AI Image Generators
  *The Scenario:* Algorithms trained on Black artists' portfolios generate images "in the style of" Black artists without consent or compensation.

  **The Du Boisian Analysis:**
  This might be the scenario where Du Bois is most unequivocally hostile, based on his later economic views and his philosophy of art as proof of humanity.

  *   **Art as Proof of Soul:** For Du Bois, art was not just a product; it was evidence of the humanity of a people who were being treated as subhuman. To strip the art from the artist—to extract the "style" (the Beauty) without the "struggle" (the Truth) or the compensation (the Goodness)—is a form of dehumanization. It turns Black cultural production into raw data.
  *   **The "Truth" Criterion:** AI generates a simulacrum. It can mimic the brushstrokes of a Jacob Lawrence, but it cannot mimic the lived experience of the Great Migration that informed the art. Du Bois insisted on Truth. AI art, in this context, is a lie. It presents Black aesthetics without Black humanity.
  *   **Verdict:** He would likely view this as **extractionist**. It violates the principle that the creator must benefit from the creation. It separates the "Beauty" from the "Goodness." For Du Bois, you cannot have true Beauty if the process of its creation is unjust.

  ### 3. Viral Political Art on Social Media
  *The Scenario:* A protest mural or digital illustration goes viral globally in hours, mobilizing opinion but often stripped of context.

  **The Du Boisian Analysis:**
  This is the most complex case because it fulfills Du Bois's dream of reach while violating his standards for depth.

  *   **The Fulfillment:** Du Bois wanted Black art to pierce the veil and show the white world the reality of Black suffering and joy. A viral image of a protest does this instantly. It forces a global audience to confront a specific injustice. In terms of pure "propaganda" (shaping public opinion), this is the most efficient machine ever built. Du Bois would marvel at the speed.
  *   **The Critique:** Du Bois was an educator first. He believed in *The Crisis* as a magazine of record, with long-form journalism and curated art. He valued sustained engagement over fleeting attention. He might argue that viral art encourages "spectatorship" rather than "action." If a user shares an image but does not organize, has the "Goodness" been achieved?
  *   **The Decontextualization:** Du Bois was careful about how Black suffering was portrayed. He didn't want to titillate white audiences with images of pain; he wanted to evoke empathy that led to justice. Social media often turns trauma into content. Du Bois might worry that viral protest art becomes aestheticized suffering—consumed for the emotional rush rather than the political lesson.
  *   **Verdict:** He would see this as **powerful but dangerous**. It achieves the *reach* he desired but risks losing the *depth* and *curation* he deemed necessary for true education.

  ### The Underlying Tension: The "Double Audience" Problem
  To really get at your roommate's point about abstract art: Du Bois's principles pull in two directions.

  1.  **Internal:** Art must build race pride (which allows for abstraction, spirituality, and joy).
  2.  **External:** Art must counter white racism (which often demands representational "proof" of humanity).

  If a Black artist today makes abstract expressionist paintings that reference nothing racial:
  *   **Locke** says: "This is freedom. We are humans who can do abstraction."
  *   **Du Bois** asks: "In a world that denies Black humanity, does this abstraction assert that humanity?"

  If the abstraction is so obscure that it fails to communicate *anything* to the white world, Du Bois might find it ineffective as propaganda. But if the abstraction asserts a complex, interior Black life that refuses to be categorized by white gaze, he might endorse it as a high form of Truth.

  **Summary for your argument:**
  Your roommate thinks Du Bois wanted **didactic realism** (art that teaches a literal lesson). You are correct that Du Bois wanted **strategic humanism** (art that forces the world to recognize Black humanity).

  *   **DEI:** Fails because it serves Capital, not Humanity.
  *   **AI:** Fails because it severs Art from the Human Creator.
  *   **Social Media:** Succeeds in Reach, fails in Depth/Education.

  Du Bois wouldn't necessarily hate modern forms, but he would ruthlessly audit them: *Who owns this? Who benefits? Does this tell the Truth about us, or does it tell a lie that makes others comfortable?* If the answer is the latter, it doesn't matter how beautiful it is—it's not doing the work.
