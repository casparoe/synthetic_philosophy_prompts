      *   *Nuance:* He doesn't mean "crude political messaging." He means art inevitably shapes perception. If Black art doesn't counter racist propaganda, it defaults to reinforcing it.
      *   *The Three Criteria:* Truth (showing Black life accurately), Beauty (aesthetic excellence is non-negotiable), Goodness (moral utility/advancement of the race).
      *   *Tension:* He insists on Beauty *alongside* Propaganda. "I do not care a damn for any art that is not used for propaganda." BUT "I do not care if the propaganda is there as long as the art is good."
      *   *Goal:* The advancement of the Negro people (social, political, economic).
      *   *View on "Art for Art's Sake":* He sees it as a privilege of the secure. When a group is under attack, neutrality is complicity.

  3.  **Analyze Case 1: Corporate DEI Campaigns:**
      *   *Surface:* Black art used to sell products/improve brand image.
      *   *Du Boisian Lens:* Is this "Truth"? Is it "Goodness"?
      *   *Potential Endorsement:* It puts Black art in front of white audiences (breaking the color line). It provides economic support to Black artists.
      *   *Potential Critique:* Is it *true* propaganda for the race, or propaganda *for the corporation* using the race? Does it sanitize Black struggle to make it palatable for consumption?
      *   *Tension:* Economic survival vs. Integrity of the message. Du Bois was a socialist later in life; he was skeptical of capitalism. He might see this as co-optation.
      *   *Principle:* *Who controls the narrative?* If the art advances the *corporation's* interest rather than the *race's* interest, it fails the "Goodness" test, even if it has "Beauty."

  4.  **Analyze Case 2: AI Image Generators:**
