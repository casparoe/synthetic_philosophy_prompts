      *   *Du Boisian Lens:* This is about labor, ownership, and representation.
      *   *Potential Critique:* This is extraction. It takes the "Beauty" created by Black labor and strips the "Goodness" (benefit to the artist/community). It creates a simulacrum of Black art without Black humanity.
      *   *Nuance:* Du Bois valued the *universal* human experience expressed through the particular. AI strips the particular human experience.
      *   *Principle:* *Art as Human Expression.* Du Bois believed art proves humanity. AI generation without consent dehumanizes the creator. It turns culture into raw material. This violates the "Truth" criterion (it's a fake style without the lived experience).

  5.  **Analyze Case 3: Viral Political Art on Social Media:**
      *   *Surface:* Rapid spread of protest art (e.g., George Floyd murals).
