          1.  Corporate DEI campaigns commissioning Black artists.
          2.  AI image generators trained on Black artists' work without consent.
          3.  Viral political art on social media.
      *   **Constraint/Goal:** Avoid simple "for/against" binaries. Reconstruct underlying principles. Highlight tensions/contradictions within those principles.

