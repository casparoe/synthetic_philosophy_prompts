prompt: |-
  I'm teaching a philosophy of cognitive science course, and I've just received a short-answer exam response that I need to grade. I have my own view of the material, but I want to make sure I'm not missing anything — the student writes confidently and gets the broad strokes right, so I want to be careful about where exactly the points come off.

  Here's the question I set:

  "Explain the relationship between the free energy principle and predictive processing. Is the free energy principle best understood as a theory of brain function, a principle of self-organization, or something else?"

  And here's the student's answer (word limit was 400 words, they came in at about 380):

  "The free energy principle (FEP), developed by Karl Friston, is a theory of brain function that says the brain minimizes free energy, which is essentially prediction error. The idea comes from predictive processing, which holds that the brain builds hierarchical generative models of the world and constantly tries to predict its own sensory input. When predictions don't match incoming signals, prediction errors propagate up the cortical hierarchy, and the brain updates its internal models to reduce those errors. This process of minimizing prediction error just is what the FEP calls minimizing free energy. Action is explained the same way: through active inference, the brain changes the world to match its predictions rather than the other way around, which is another route to minimizing prediction error. So the FEP unifies perception and action under a single imperative: minimize prediction error. Because the FEP shows that everything the brain does reduces to prediction error minimization, it's best understood as a complete theory of brain function. It also explains why we have the specific neural architectures we do: the hierarchical structure of cortex maps onto hierarchical generative models, the distinction between feedforward and feedback connections maps onto prediction errors versus predictions, and even dopamine signaling can be understood as encoding precision-weighted prediction errors. The FEP thus provides a unified account of perception, action, learning, and attention under one mathematical framework."

  I'd like you to grade this answer. Give it a letter grade (A through F, with plus/minus distinctions) and then provide the specific, point-by-point comments that justify that grade. I want the comments to identify exactly what the student got right and exactly what they got wrong — especially any conflations, overstatements, or misattributions that a quick read might miss. Don't just give me a general impression; I need to be able to hand this feedback to the student along with the grade.

  Please lead with the grade in the first sentence and then give your reasoning, with no preamble and no restating of the question.
