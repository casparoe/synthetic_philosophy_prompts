answer: |-
  You are not being pedantic, and you definitely didn't just imagine it. You and your friend accidentally stumbled directly into one of the most famous problems in the philosophy of language and epistemology.

  The statement your friend made—"**My dissertation is going to be fine, but I don't believe it's going to be fine**"—is a classic example of **Moore's Paradox**.

  Named after the philosopher G.E. Moore, this paradox highlights sentences that are not logically contradictory but are pragmatically absurd to assert. Here is the breakdown of who was right, who was wrong, and why the sentence feels so "broken."

  ### 1. The Logical Level (Where your friend has a point)
  Logically, there is no contradiction in the *content* of the sentence.
  *   **Fact**: The dissertation will be fine.
  *   **Mental State**: I do not believe the dissertation will be fine.

  It is entirely possible for both of those to be true simultaneously. People are wrong about their beliefs all the time. You can be in a state of affairs where $P$ is true, but you lack belief in $P$. So, strictly speaking, your friend is describing a possible reality. He isn't saying "A and not-A" (e.g., "It is raining and it is not raining"). He is saying "P is true, and I don't think P is true."

  ### 2. The Linguistic/Pragmatic Level (Where you are right)
  The problem arises when you **say** it out loud. This is where you were correct to feel that something was incoherent.

  According to the standard norms of assertion (championed by philosophers like Ludwig Wittgenstein and later Timothy Williamson), **to assert a proposition is to represent yourself as believing it**.

  When you say, "The dissertation is going to be fine," you are implicitly signaling to the listener: *"I believe this."*
  When you immediately follow it with, "...but I don't believe it," you are taking that signal back.

  It creates a pragmatic contradiction. It's like saying, "I am speaking to you, but I am not speaking to you." The first half of the sentence performs an action (asserting a belief), and the second half denies that you are performing that action. This is why it made you want to pull your hair out. It undermines the very authority required to make the statement.

  ### 3. The Friend's Defense (and why it fails)
  Your friend argued that he was distinguishing between **objective evidence** and **subjective belief**. He's psychologically correct that these two things can diverge (this is basically the definition of Imposter Syndrome or high-functioning anxiety).

  However, his train analogy ("The train leaves at 8, but I don't believe it leaves at 8") actually proves your point, not his.
  *   If he says, "The train leaves at 8," he is claiming knowledge.
  *   If he adds, "but I don't believe it," he is telling you not to trust the claim he just made.

  If he wants to be accurate, he should say: "The *schedule says* the train leaves at 8, but I don't believe it." By removing the "schedule says" qualifier, he claims the fact as his own, which makes the lack of belief paradoxical.

  ### 4. Why it feels "broken" to you
  You mentioned that asserting the first part "commits you to something that the second part directly undercuts." **That is exactly the philosophical argument**.

  You intuitively grasped the **Norm of Assertion**. In conversation, we operate under a contract: if you tell me $P$, I assume you believe $P$. If you tell me you don't believe $P$, I assume you shouldn't have told me $P$. Doing both violates the contract of communication. It renders the statement "unassertable," even if it is technically "true."

  ### The Verdict
  *   **You are right** about the language. The sentence is linguistically incoherent. It cannot be sincerely asserted.
  *   **He is right** about the psychology. It is possible to hold evidence for a conclusion while emotionally failing to internalize that belief.

  **How to settle the bet**:
  Tell him he fell victim to **Moore's Paradox**. He can validly say:
  > *"All the evidence suggests my dissertation will be fine, but I can't bring myself to believe it."*

  That sentence is perfectly coherent. It attributes the "fineness" to the *evidence* (external) rather than asserting it as his own knowledge (internal), which allows him to withhold belief without contradicting himself.

  So, you aren't being pedantic. You recognized a breach in the logic of conversation. But, for the sake of the friendship (and his PhD stress), you might want to acknowledge that while his *grammar* was broken, his *feelings* were valid. Buy him a drink, explain Moore's Paradox, and tell him to rephrase.
