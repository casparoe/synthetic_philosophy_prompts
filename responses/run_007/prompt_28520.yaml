prompt: |-
  So my friend and I got into this massive argument last night — we were at a bar and it went on for like two hours, the bartender definitely hated us — and I'm still turning it over in my head. Basically, he's been really stressed about his PhD, and at some point he said, completely seriously, "My dissertation is going to be fine, but I don't believe it's going to be fine." I just stared at him. I was like, dude, you can't say that. That's nonsense. And he got weirdly defensive and said it's not nonsense at all — it's just a description of his mental state. The dissertation will objectively be fine (his advisor said so, the data is solid, etc.), but subjectively he can't bring himself to believe it. He said it's no different from saying "The train leaves at 8, but I don't believe it leaves at 8" when you've been given bad info before and you're skeptical.

  I kept pushing and said no, there's something more fundamentally broken about it — like, the act of asserting the first part commits you to something that the second part directly undercuts. He said I was conflating assertion with belief, and that you can assert something for practical purposes (like, this is what the evidence says) without actually endorsing it as your belief. The argument got pretty heated and we ended up going in circles. I feel like I'm right that there's something incoherent about what he said, but every time I try to pin it down I end up just saying "it sounds wrong" which isn't exactly a argument. What's actually going on with statements like that? Is there a real philosophical problem here or am I just being pedantic?
