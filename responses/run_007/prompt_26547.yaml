      *   No stipulating verdicts? Intuitive.
      *   Object lacks D before/during/after? Yes.
      *   Intrinsic nature unchanged? Yes.
      *   Truth owed to external factor? Yes.
      *   Mimic not reverse fink? Yes.

      *   *One small worry:* Is "Magnetism" a disposition? Yes, often treated as one (disposition to attract iron).
      *   *Another worry:* "During the stimulus." If the sensor activates the magnet, is the magnet part of the object? No, "concealed electromagnet hidden directly behind it." It's external.
      *   *Another worry:* "Truth of counterfactual... owed entirely to external factor." Yes.

      *   *Let's write it.*
answer: |-
  Consider a solid wooden block, intrinsically non-magnetic and devoid of any ferromagnetic material, placed on a display stand equipped with a proximity sensor and a concealed electromagnet hidden directly behind it. Whenever the block is brought near iron filings (the stimulus), the sensor instantly activates the electromagnet, causing the filings to leap toward and stick to the block's surface (the manifestation). Although the counterfactual "if the block were brought near iron filings, they would be attracted" is true, the block itself possesses no magnetic disposition, as the attraction is produced entirely by the external electromagnet triggered by the movement, leaving the wood's intrinsic non-magnetic nature unchanged before, during, and after the interaction.

  (1) **Object:** The wooden block. **Disposition D:** Magnetism (the disposition to attract iron). **Stimulus S:** Being brought near iron filings. **Manifestation M:** The attraction of the iron filings (they leap toward and stick to the object).

  (2) The counterfactual is true because the setup guarantees that any instance of $S$ triggers the sensor, which activates the hidden electromagnet, physically pulling the filings toward the block. The causal route is: Block moves near filings $\rightarrow$ Sensor detects proximity $\rightarrow$ Electromagnet powers on $\rightarrow$ Magnetic field exerts force on filings $\rightarrow$ Filings move toward block ($M$).

  (3) The object lacks $D$ because wood lacks the intrinsic causal basis required for magnetism (e.g., aligned magnetic domains or ferromagnetic composition). The criterion used is the **Intrinsic Basis Criterion**: an object has a disposition only if it possesses the intrinsic properties responsible for producing the manifestation upon stimulation. Alternatively, using the **Removal Test**: if the external factor (the electromagnet/sensor rig) were removed, the object would not manifest $M$ given $S$, proving the disposition was not in the object.

  (4) This is a **mimic** because the counterfactual is true while the disposition is absent; the manifestation occurs due to an external intervention that mimics the disposition's effect. It is not a **reverse fink** because the stimulus does not cause the object to *acquire* the disposition (the wood remains non-magnetic); instead, the stimulus triggers an external cause. It is not a **fink** because a fink involves the presence of the disposition with a false counterfactual (here, the counterfactual is true). It is not a **mask** because a mask involves the presence of the disposition with a false counterfactual due to interference (here, the disposition is absent).

  (5) The feature doing the work is the **external causal override** (the sensor-activated electromagnet). If this feature is removed, the counterfactual becomes false (the wood would not attract the filings), and the verdict of the simple conditional analysis would correctly align with intuition (no disposition, false counterfactual). The mismatch arises solely because the external factor decouples the truth of the counterfactual from the object's intrinsic nature.

  (6) A defender of the simple conditional analysis would amend the analysis to require that the manifestation occur **in virtue of the object's intrinsic nature** (or that the counterfactual holds *because* of the object's properties). This amendment successfully rules out the mimic case, as the attraction here is not in virtue of the wood's nature. However, this amendment does not resolve the standard **fink** and **mask** problems. In **mask** cases, the object has the intrinsic basis, but the counterfactual is still false (due to external prevention), so the amended analysis still incorrectly denies the disposition. In **fink** cases, the intrinsic basis is removed upon stimulation, so specifying "in virtue of intrinsic nature" requires further clarification about which time-slice of the nature counts (leading to Lewis's suggestion to hold the basis fixed), meaning the simple conditional analysis cannot be saved by this amendment alone without evolving into a more complex causal basis analysis.
