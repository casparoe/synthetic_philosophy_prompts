      *   **Candidate Principle 3 (The Strongest Candidate): The "Spheres of Justice/Domain Appropriateness" Principle.**
          *   Drawing on Walzer/Anderson. Goods have social meanings. Markets corrupt goods that belong to other spheres (Civic, Intimate, Survival).
          *   *Criteria:*
              1.  **Civic/Political Sphere:** No markets (Votes, DMV).
              2.  **Bodily Integrity Sphere:** No permanent/constitutive parts (Kidney), but renewable fluids okay (Plasma).
              3.  **Emergency/Survival Sphere:** No price gouging on essentials (Water), but market services okay (Uber).
