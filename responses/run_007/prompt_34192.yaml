      *   *Candidate E: The "Renewability & Integrity of the Self" Principle.* (Specific to Body cases).
          *   Fits 1 vs 2. Kidney = permanent loss/integrity violation. Plasma = renewable.
          *   Doesn't explain pricing cases.

      *   *Candidate F: A Hybrid Principle (The "Civic/Infrastructure vs. Private Luxury" + "Bodily Integrity" mix).*
          *   Let's try to synthesize. The user seems to draw lines based on:
              1.  **Civic Equality:** Things required for equal citizenship (Votes, DMV access) shouldn't be marketized.
              2.  **Bodily Integrity (Permanent vs. Temporary):** Permanent bodily loss is off-limits; renewable/fluid is okay.
              3.  **Essential Infrastructure in Crisis:** Basic survival goods in disasters are off-limits; transport services are more negotiable.

  5.  **Select the Best Candidate Principle:**
      *   I need to construct a principle that unifies these. Let's call it the **"Equality of Status and Basic Security" Principle.**
      *   *Core Idea:* Markets are impermissible when they undermine equal civic status OR when they threaten basic physical security in contexts of non-substitutable need. Markets are permissible when they involve renewable bodily contributions, private luxuries, or labor risks undertaken with consent for non-essential ends.
      *   *Refinement:* Let's look at the "Queue" cases (7 vs 8). FastPass is private entertainment. DMV is public administration. This suggests a **Public/Civic vs. Private** distinction is strong.
      *   Let's look at "Body" cases (1 vs 2). Kidney is organ loss (permanent damage risk); Plasma is fluid (regenerates). This suggests a **Bodily Integrity/Harm** distinction.
      *   Let's look at "Pricing" cases (3 vs 4). Water/Generators = Survival. Uber = Mobility/Comfort (though in snow, mobility is safety). Why the difference? Maybe *Monopoly/Competition*? Hardware store might be the only game in town. Uber has competitors/alternatives? Or maybe *Social Obligation*? We expect neighbors to share water in disaster; we don't expect neighbors to drive us for free.
      *   *Actually, a stronger unifying thread might be "Corruption of Social Roles" vs. "Economic Exchange".*
