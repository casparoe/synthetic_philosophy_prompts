          *   Fails: 9 (Surrogacy often argued to degrade motherhood, but user says Yes), 2 (Plasma vs Kidney distinction is tricky here).

      *   *Candidate D: The "Vulnerability & Coercion" Principle.* Markets are bad when the seller is so vulnerable that consent is compromised, or the buyer exploits a desperate need.
