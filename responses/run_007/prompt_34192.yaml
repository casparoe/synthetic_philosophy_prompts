      *   *Proposed Principle:* **The "Civic Equality and Non-Substitutable Need" Principle.**
          *   Markets are forbidden when:
              1.  They compromise equal civic standing (Votes, DMV).
              2.  They exploit non-substitutable needs for survival in emergencies (Water/Generators).
              3.  They involve permanent, non-regenerative bodily sacrifice (Kidney).
          *   Markets are allowed when:
              1.  They involve renewable bodily contributions (Plasma).
              2.  They involve labor/risk with consent (Welder, Drug Trial).
              3.  They involve private luxuries/convenience (FastPass, Uber).
              4.  They involve intimate labor with regulation (Surrogacy).

      *   *Critique of this Principle:* It's a bit of a list. Can I unify it?
      *   *Try: "The Baseline Security Principle."* Markets cannot operate where they threaten the baseline conditions required for persons to function as free and equal citizens.
          *   Votes/DMV: Required for political/legal equality.
          *   Kidney: Required for bodily integrity/health baseline.
          *   Hurricane Water: Required for physical survival baseline.
          *   Plasma/Uber/FastPass/Welder/Trial/Surrogacy: Do not threaten the *baseline* status of the participant (assuming regulation).
      *   *Problem:* Uber in snow *can* be survival. But maybe the user sees it as "transport" vs "life support."
      *   *Problem:* Surrogacy. Does it threaten baseline? User says "fine with unease."
      *   *Problem:* Drug Trial. Risk of serious side effects. Does that threaten baseline health? User says "fine." Why? Because it's *chosen risk* for social good, whereas Kidney is *chosen loss* for individual gain?

      *   *Let's try a Sandel-inspired "Corruption of Meaning" + "Fairness" hybrid.*
      *   Actually, the most robust philosophical framework for these specific intuitions is often found in **Elizabeth Anderson's "Ethical Limitations of Markets"** or **Michael Sandel's "What Money Can't Buy."**
      *   Anderson distinguishes between goods appropriate for different modes of valuation (market, gift, civic, etc.).
      *   Let's formulate a principle based on **Domain Appropriateness**.
      *   *Principle:* **The "Domain Integrity" Principle.** Markets are appropriate only when the good in question belongs to the economic domain. They are inappropriate when the good belongs to the civic domain (votes, public queues), the domain of intimate bodily integrity (organs), or the domain of emergency survival (where market norms crowd out communal obligations).
      *   *Refining the 3 vs 4 tension:* Why is Uber okay? Because ride-sharing is understood as a *service contract*, whereas disaster relief water is often understood as a *communal resource*. Also, Uber pricing *incentivizes supply* (more drivers), whereas hoarding water doesn't necessarily create more water immediately.
      *   *Refining the 1 vs 2 tension:* Kidney = Organ (constitutive of self). Plasma = Fluid (secretion).
      *   *Refining the 7 vs 8 tension:* Amusement Park = Private pleasure. DMV = Public right.

  6.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate that these tensions are classic in the literature (Sandel, Anderson, Radin).
      *   **Candidate Principle 1: The "Harm/Coercion" Principle (Libertarian/Utilitarian lean).**
          *   Focus on consent and harm.
          *   *Success:* 6, 10, 2.
          *   *Failure:* 1, 3, 5, 8. (Why is vote selling bad if consensual? Why is water gouging bad if voluntary exchange?)
      *   **Candidate Principle 2: The "Civic Equality" Principle (Republican/Egalitarian).**
