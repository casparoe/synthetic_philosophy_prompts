answer: |-
  This is a classic pedagogical predicament. In the literature on commodification—from Michael Sandel's *What Money Can't Buy* to Elizabeth Anderson's *Value in Ethics and Economics*—these exact tensions arise. Your intuitions are not "messy"; they are nuanced. You are likely operating with a **pluralistic** moral framework rather than a monistic one (like pure utilitarianism or strict libertarianism). You seem to believe that different *types* of goods belong to different *spheres* of human life, and markets are appropriate in some spheres but corrupting in others.

  Let's test three candidate principles to see which one best systematizes your ten verdicts.

  ### Candidate Principle 1: The "Harm and Coercion" Principle
  *Definition:* Markets are permissible provided the transaction is voluntary (informed consent) and does not cause direct, irreversible physical harm to the seller or buyer.

  *   **Where it succeeds:** It handles your labor and risk cases well. It explains **Case 6** (Welder) and **Case 10** (Drug Trial) because the workers consent to the risk. It explains **Case 2** (Plasma) because the harm is minimal and reversible.
  *   **Where it fails:** It cannot explain your prohibitions.
      *   **Case 1 (Kidney):** If consent is informed and the system is regulated (as you stipulated), why is it forbidden? The seller consents.
      *   **Case 3 (Price Gouging):** The buyer consents to the high price. If they didn't want to pay, they wouldn't.
      *   **Case 5 (Votes):** A vote seller consents.
      *   **The Pairs:** It fails to distinguish **1 vs. 2** (both involve consent and bodily risk) or **7 vs. 8** (both involve voluntary exchange of time).
  *   **Verdict:** This principle is too thin. It captures your permissive cases but fails to capture your restrictive ones.

  ### Candidate Principle 2: The "Civic Equality" Principle
  *Definition:* Markets are impermissible when they undermine the equal status of citizens or the integrity of democratic institutions.

  *   **Where it succeeds:** It handles the civic cases perfectly.
      *   **Case 5 (Votes):** Selling votes creates political inequality.
      *   **Case 8 (DMV):** Public services should be distributed by need or queue, not wealth, to ensure equal standing before the law.
      *   **Case 3 (Hurricane):** In a disaster, survival goods become a matter of basic rights; allowing wealth to determine survival undermines the idea that all lives have equal value.
  *   **Where it fails:** It struggles with the bodily and private cases.
      *   **Case 1 vs. 2:** Why does selling a kidney undermine civic equality more than plasma? Both are bodily.
      *   **Case 7 (FastPass):** This is private, so the principle says "fine," which matches your verdict, but it doesn't explain *why* you are okay with **Case 9 (Surrogacy)**. Surrogacy is often argued to undermine the equality of women or the dignity of reproduction, yet you find it permissible.
      *   **Case 4 (Uber):** If civic equality is the standard, surge pricing in a snowstorm (where transport might be essential for safety) looks suspicious.
  *   **Verdict:** This explains your "No" verdicts on civic grounds (3, 5, 8) but leaves your "Yes" verdicts on bodily/labor grounds (2, 6, 9, 10) somewhat ungrounded.

  ### Candidate Principle 3: The "Domain Appropriateness" Principle (The Best Fit)
  *Definition:* Goods belong to specific social spheres (Civic, Intimate/Bodily, Economic, Survival). Markets are appropriate in the Economic sphere but become corrupting when they invade the Civic sphere (undermining equality), the Survival sphere (exploiting desperation), or the Constitutive Bodily sphere (treating the self as a tool).

  *   **How it handles your pairs:**
      *   **1 (Kidney) vs. 2 (Plasma):** This principle distinguishes between *constitutive* parts of the self and *renewable* secretions. A kidney is a permanent loss of bodily integrity (Constitutive Sphere); plasma regenerates (borderline Economic/Bodily). Your intuition suggests the market can touch fluids, but not organs.
      *   **3 (Water) vs. 4 (Uber):** This distinguishes between *static scarcity* and *dynamic supply*. In a hurricane, water is a fixed survival resource; price hikes only ration existing stock (Survival Sphere). Uber surge pricing incentivizes *more drivers* to enter the market (Economic Sphere), increasing supply when it is needed most. You view transport as a service responsive to incentives, whereas water in a disaster is a basic right.
      *   **7 (FastPass) vs. 8 (DMV):** This distinguishes *private luxury* from *public entitlement*. An amusement park is a private good; the DMV is a public service required for legal citizenship (Civic Sphere). Wealth can buy comfort, but it cannot buy equal access to the state.

  *   **Where it succeeds:** It captures 9 out of 10 of your verdicts comfortably.
      *   **Case 9 (Surrogacy):** You marked this "Fine" with unease. This principle explains the unease: it borders on the Intimate Sphere. But if framed as "labor" (gestational service) rather than "selling a baby," it fits the Economic sphere with regulation.
      *   **Case 10 (Drug Trials):** This fits the Economic sphere (labor/risk) provided it doesn't violate bodily integrity permanently.

  *   **Where it struggles:** **Case 4 (Uber)** is the weakest link. If the snowstorm is severe enough, transport becomes a survival need, not just a service. If you are consistent with Case 3, you might need to view essential transport during a state of emergency as part of the Survival Sphere.

  ### Achieving Consistency: Recommended Revisions

  To make your moral framework fully coherent under the **Domain Appropriateness Principle**, I recommend you consider revising two verdicts.

  **1. Revisit Case 4 (Uber Surge Pricing)**
  *   **Current Verdict:** Fine.
  *   **Revision:** **Not Fine (in extreme emergencies).**
  *   **Why:** If you condemn price gouging on water because it exploits a desperate need for survival/safety, you must condemn surge pricing when the "need" is equally urgent (e.g., getting to a hospital or escaping a dangerous zone in a blizzard). The distinction between "essential good" and "essential service" collapses in an emergency.
  *   **Pedagogical Value:** This forces you to articulate *when* a market service becomes public infrastructure. It creates a teachable moment about "essentiality."

  **2. Revisit Case 9 (Surrogacy)**
  *   **Current Verdict:** Fine (with unease).
  *   **Revision:** **Lean into the unease.** Either declare it **Not Fine** (because reproduction belongs to the Intimate Sphere, not the Market) or clarify that the payment is strictly for *labor and medical burden*, not the *child*.
  *   **Why:** Your unease suggests you sense a boundary crossing. If the kidney is off-limits because it is part of the self, is the womb off-limits for similar reasons? To be consistent with Case 1, you might argue that reproductive capacity is constitutive of the self in a way plasma is not. However, many philosophers (like Anderson) argue surrogacy is permissible if it doesn't treat the child as a commodity.
  *   **Recommendation:** Keep it as "Fine" *only if* you explicitly categorize it as **Labor** (like Case 6) rather than **Body Part Sale** (like Case 1). If you view it as labor, it fits. If you view it as organ use, it conflicts with Case 1.

  ### Application: The New Case
  **Case 11: The sale of admission slots at elite universities.**
  *(e.g., A wealthy donor pays $5 million to secure a spot for their child, displacing a more qualified applicant.)*

  **Applying the Domain Appropriateness Principle:**
  1.  **Identify the Sphere:** Higher education, particularly at elite institutions that act as gatekeepers to social mobility, belongs to the **Civic/Meritocratic Sphere**. It is a public good designed to sort talent and opportunity based on achievement and potential, not wealth.
  2.  **Assess the Corruption:** Selling slots converts a merit-based good into a commodity. This undermines the integrity of the institution (the degree means less if bought) and undermines civic equality (wealthy children bypass the rules of fair competition).
  3.  **Compare to Precedents:**
      *   It is structurally identical to **Case 5 (Votes)**: It allows wealth to purchase political/social standing.
      *   It is structurally identical to **Case 8 (DMV)**: It allows wealth to bypass the queue for a public/semi-public entitlement.
      *   It is distinct from **Case 7 (FastPass)**: Because education is not a mere luxury; it is a determinant of life chances.

  **Verdict:** **Not Fine.**

  **Does this fit your pattern?**
  Yes. This verdict aligns perfectly with your prohibitions on Vote Selling (5) and DMV Queue Jumping (8). All three involve goods that determine **status and opportunity** within a society. If you allow markets here, you allow wealth to translate directly into status, which violates the "Civic Equality" component of your principle.

  **Would this force you to reconsider something?**
  It might pressure your view on **Case 7 (FastPass)**. If you argue that education is too important to be bought, is an amusement park ride *truly* distinct? The distinction rests on **consequence**. A FastPass buys comfort; a University Slot buys life trajectory. If you accept the University verdict, you must maintain a robust distinction between "Luxuries" (market appropriate) and "Opportunity Goods" (market inappropriate).

  ### Summary for Your Seminar
  You are not operating with a mess; you are operating with a **Walzerian Spheres of Justice** framework. You believe:
  1.  **Bodily Integrity:** Markets can touch renewable fluids (plasma) but not constitutive organs (kidneys).
  2.  **Civic Equality:** Markets cannot buy access to the state (DMV, Votes) or essential opportunity (University).
  3.  **Emergency Survival:** Markets cannot ration static survival goods (water) but can incentivize services (Uber)—*unless* that service becomes essential for survival.

  Your "messiness" is actually a sophisticated sensitivity to context. In class, you can present this not as a contradiction, but as a **typology of goods**. The question for your students isn't "Are markets good or bad?" but "What *kind* of good is this, and what sphere does it belong to?"
