answer: |-
  Molinism's explanatory power hinges on Counterfactuals of Creaturely Freedom (CCFs). While coherent, three tiers of objection pressure the view, ranked by severity.

  **1. The Grounding Objection (Potentially Fatal)**
  Truth requires an ontological ground (truthmaker). CCFs are true prior to creation. What grounds them? Not God (would violate freedom), not creatures (non-existent). Molinists (Plantinga, Craig) posit them as brute facts or grounded in abstract essences. Critics (Adams, Hasker) argue this makes truth metaphysically unmoored, violating the principle of bivalence for contingent truths. If CCFs lack truth values, Molinism collapses. Molinists take this seriously; it remains the central contested issue in philosophy of religion. Some concede grounding isn't needed for counterfactuals, but critics deem this ad hoc. This is the strongest philosophical pressure point.

  **2. The Feasibility Constraint (Serious/Contested)**
  Your friend's determinism charge is mostly a misunderstanding—Molinists agree CCFs don't *cause* choices. They dismiss this as a category error. However, a refined version sticks: God cannot actualize a world where you freely do X if the CCF says you would freely do Y. This limits God's providential control and implies "transworld depravity." It's not causal determinism, but it restricts freedom's scope regarding which worlds are *feasible*. Molinists worry about this limitation on sovereignty. This touches the Principle of Conditional Excluded Middle (PCEM). If PCEM fails, Molinism fails. Many philosophers reject PCEM for free actions, arguing future contingents are neither true nor false.

  **3. The Problem of Evil (Awkward/Survivable)**
  Molinism claims God actualizes the "best feasible world." If evil exists, either no better world was feasible or God failed His moral obligation. This forces Molinists into skeptical theism or claiming this is objectively the best possible world (hard to swallow). It's survivable but requires heavy lifting on why specific horrors were necessary in the *best feasible* set. It risks making God a maximizer rather than a sovereign.

  **Settled vs. Contested**
  Nothing is settled. The Grounding Objection is the standard bearer for anti-Molinists. Proponents argue grounding is unnecessary for counterfactuals. The debate is live, technical, and unresolved. Analytic philosophers remain split, often along theological lines. Misunderstandings (causal determinism) are dismissed by both sides; real disagreements (metaphysical grounding, PCEM) persist. There is no professional consensus on the coherence of Middle Knowledge. Recent literature shows no trend toward resolution; it remains a stalemate between metaphysical intuitions about truth and freedom.
