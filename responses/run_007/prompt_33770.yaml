answer: |-
  This is a profound puzzle, and you are in excellent company. Your intuitions map almost perfectly onto the philosophical problem of **Moral Luck** as framed by Thomas Nagel and Bernard Williams in the 1970s. They argued that our moral practices rely on a "Control Principle" (we are only responsible for what we control), yet almost every judgment we make is infected by luck (constitutive, circumstantial, and resultant).

  You are experiencing the friction between that Control Principle and the reality of human psychology.

  Here is an analysis of your verdicts, a proposed unifying principle, and a resolution for the case that keeps you up at night.

  ### 1. Mapping Your Verdicts

  To find a principle, we first need to categorize the types of luck you are accepting or rejecting in your cases:

  *   **Case 1 (Drivers): Rejects Result Luck.** You judge the *choice* (glancing at the phone), not the *outcome* (hitting the child). The external world shouldn't dictate moral status.
  *   **Case 2 (Racism), Case 3 (Alcoholism), Case 5 (Plagiarism): Accepts Constitutive/Circumstantial Luck for Mitigation.** You acknowledge that internal capacity (genetics, memory) and formative circumstances (upbringing) constrain the "Control Principle." If your capacity to choose well was damaged by luck, blame is reduced.
  *   **Case 4 (Soldiers): Accepts Circumstantial Luck for Grading Blame.** Even though neither chose the war, the *objective moral quality* of the act differs. Killing for aggression is worse than killing for defense, regardless of intent.
  *   **Case 6 (Nazi Counterfactual): Rejects Counterfactual Blame.** You refuse to judge someone on a path they didn't walk.

  ### 2. The Unifying Principle: "Actualized Capacity"

  There is a principle that captures almost all of these verdicts without contradiction. Let's call it the **Principle of Actualized Capacity**.

  > **We are judged only on actions we actually take, but the weight of that judgment is scaled by the capacity we had to do otherwise.**

  Here is how it handles your cases:
  *   **Drivers:** Both had equal capacity to look at the road. Both took the same action (glancing). Equal blame. (Outcome is irrelevant).
  *   **Racist/Alcoholic:** They took a bad action, but their *capacity* to do otherwise was compromised by luck (upbringing/genetics). Blame is scaled down.
  *   **Soldiers:** Both took the action (killing), but the *moral weight* of the action differs based on the objective reality of the war. The unjust soldier violates a deeper moral law, even if his subjective confusion is the same.
  *   **Nazi Counterfactual:** No action was taken. Therefore, no blame is assigned.

  This principle distinguishes between **Grounding Blame** (requires an actual act) and **Modulating Blame** (allows luck to reduce the severity).

  ### 3. The Conflict: Mitigation vs. Grounding

  You asked: *Is there a principled distinction between using luck to mitigate blame and using it to ground blame?*

  **Yes.** The distinction lies in **Agency.**

  *   **Mitigation (Cases 2, 3, 5):** When you use luck to *reduce* blame, you are acknowledging that the agent's **agency was impaired.** You are saying, "You did this, but you were less of a free agent in this instance due to factors outside your control." This preserves the Control Principle.
  *   **Grounding (The Fear in Case 6):** If you used luck to *ground* blame (e.g., "You are blameworthy because you *would* have been a Nazi"), you are punishing someone for **lacking agency.** You are punishing them for their constitution or circumstances rather than their choices.

  Your intuition is correct: It is consistent to allow luck to *excuse* (because it limits control) while refusing to let luck *condemn* (because condemnation requires the exercise of control).

  ### 4. Solving the "Nazi Collaborator" Case

  This is the case that bothers you because it threatens your self-conception. If your decency is just luck (being born in 1970s England), can you take pride in it? And if you would have been a monster in 1930s Germany, do you deserve to feel contempt for those who were?

  Here is the hard truth your intuition is circling: **You must give up the Pride, not the Verdict.**

  Your verdict on the collaborator is correct (no blame for counterfactuals). But your feeling of pride in your own decency is the problematic element.

  **The Principle of Fragile Virtue:**
  Virtue is not a solid substance inside you; it is a relationship between your character and your circumstances.
  *   **On Pride:** You cannot claim moral *merit* for passing a test you never took. You can feel *gratitude* that you weren't tested, and *satisfaction* that you have resisted the smaller temptations of your actual life. But the specific pride of "I am not a Nazi" is unearned if the only reason is that you weren't in 1930s Germany.
  *   **On Contempt:** This is the dangerous part. If you feel contempt for actual Nazis, you are judging their *actual* harms. That is justified. But if you feel contempt for their *souls* while believing you would have had the same soul in their shoes, that is hypocrisy.

  **The Resolution:**
  You should adopt a stance of **Moral Humility.**
  1.  **Verdict:** The 1970s person is not blameworthy for the 1930s counterfactual. (Keep this).
  2.  **Self-Assessment:** The 1970s person cannot claim moral superiority over the 1930s collaborator based on *constitution*, only based on *actual record*.
  3.  **The Unease:** That "bothered" feeling you have? That is the correct moral emotion. It is the recognition that your goodness is fragile.

  ### 5. Advice for the Novelist

  Since you write novels, this tension is more valuable to you than a solved philosophical equation. A character who knows they are good only by luck is infinitely more interesting than a saint.

  If you need a rule to apply to your characters (and yourself) to resolve the inconsistency, I suggest you adjust **Case 4 (The Soldiers)** or **The Pride in Case 6**.

  **Option A: Adjust Case 4 (The Hard Line)**
  If you want to be a strict Kantian about Control: The soldiers are *equally* blameworthy. Neither chose the war. Their internal deliberation was identical. The "justness" of the war is result luck.
  *   *Cost:* This feels cold. Most people feel killing for Hitler is worse than killing for Churchill, even if conscripted.
  *   *Verdict:* Don't do this. Your intuition on Case 4 is morally robust.

  **Option B: Adjust The Pride (The Humble Line)**
  Accept that your verdicts on Cases 1–5 are correct, but acknowledge that they dissolve the foundation for **Moral Pride.**
  *   *The Principle:* **"Luck excuses, but it does not justify."**
  *   Luck can explain why someone was bad (mitigating blame).
  *   Luck cannot explain why someone is good (grounding pride).
  *   Why? Because when luck makes you *bad*, we look for the *residual choice* you still had. When luck makes you *good*, we often find there was *no choice required*.

  ### Summary Recommendation

  Keep your verdicts on the Drivers, the Racist, the Alcoholic, and the Soldiers. They form a coherent system of **Capacity-Constrained Actualism.**

  For the Nazi Collaborator case:
  1.  **Maintain** that the 1970s person is not blameworthy for the counterfactual.
  2.  **Surrender** the feeling that you are inherently "better" than the collaborator. You are *luckier*.
  3.  **Reframe the Contempt:** Feel contempt for the *harm* they caused, not the *potential* they harbored. Recognize that had the dice rolled differently, you might be the object of that contempt.

  This doesn't solve the metaphysical problem of moral luck, but it solves the *psychological* problem. It allows you to judge actions fairly while remaining humble about your own character. For a novelist, that humility is where the best characters are born.
