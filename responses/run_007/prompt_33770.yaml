prompt: |-
  I'm trying to work out what I actually think about moral luck, going by my gut on cases. I write novels, so I spend a lot of time thinking about how my characters get judged—and I've noticed my own verdicts are a bit all over the place.

  Here's where I land on a few:

  Two drivers both glance at their phones for the same three seconds. Driver A hits a child who darted out between parked cars; Driver B's road is empty. I think they're equally blameworthy. The fact that a child happened to be there is just luck, and it shouldn't change the moral judgement. I know the law disagrees, but I'm asking about blame, not liability.

  A woman who grew up in a virulently racist family and community makes a vile remark at a dinner party. Another woman, raised in a progressive, diverse enviroment, makes the exact same remark. I think the first is less blameworthy. Her upbringing wasn't her fault, and it shaped her in ways that are hard to undo. The second women should know better.

  A man with a strong genetic predisposition to alcoholism drinks himself into wrecking his marriage. His neighbour, with no such predisposition, does the same. I think the first man is less blameworthy. He was dealt a worse hand, constitutionally.

  A soldier conscripted into a just war kills an enemy combatant. Another soldier conscripted into an unjust war of aggression does the same. Neither chose to be there. I think the first is less blameworthy, even though neither had any say in which side they fought for.

  A novelist unconsciously plagiarises a passage she read a decade ago and forgot. Another novelist lifts the passage deliberately. The first is much less blameworthy, though I'm not sure she's entirely off the hook.

  Now here's the case that keeps me up. Consider someone who, had they been born in 1930s Germany, would almost certainly have become a Nazi collaborator. But they were born in 1970s England, and they've lived a perfectly decent life. I don't think they're blameworthy for what they would have done. But something about this verdict bothers me, because it seems to imply that whether I'm a good person is itself a matter of luck, and yet I can't help feeling something like pride in being decent, and something like contempt for those who weren't, in circumstances where I might have been just as bad.

  Is there a principle that captures all these verdicts? If there isn't one that gets all of them, which should I give up? And what does the principle say about the collaborator-in-another-life case? I'm especially interested in whether there's a principled distinction between using luck to mitigate blame (which I seem happy to do in most of these) and using it to ground blame (which I'm not doing in the Nazi case, but maybe I should be).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a novelist thinking about character judgment and moral luck.
      *   **Task:** Identify a unifying principle for their intuitive verdicts on specific cases of moral luck, or advise which verdict to change if no principle fits. Specifically address the "Nazi collaborator in another life" case.
      *   **Core Tension:** The user accepts *mitigating* luck (bad upbringing, genetics, unconscious plagiarism) reduces blame, but rejects *constitutive* luck (being born in a time/place that makes goodness easy) as a basis for *praise* or *blame* regarding who one *would* have been. They feel uneasy about the implication that moral worth is luck-dependent, yet they feel pride/contempt based on it.
      *   **Specific Cases Provided:**
          1.  *Negligent Drivers:* Equal blame (Result luck rejected).
          2.  *Racist Remark:* Upbringing matters (Constitutive/Circumstantial luck accepted for mitigation).
          3.  *Alcoholic:* Genetics matter (Constitutive luck accepted for mitigation).
          4.  *Soldiers:* Just vs. Unjust war matters (Circumstantial luck accepted for mitigation).
          5.  *Plagiarism:* Intent/Consciousness matters (Epistemic luck accepted for mitigation).
          6.  *Nazi Collaborator (Counterfactual):* Not blameworthy for what they *would* have done, but feels uneasy about pride/contempt based on this.

  2.  **Deconstruct the Verdicts:**
      *   *Case 1 (Drivers):* Rejects *Result Luck*. Control is key. The outcome was outside control.
      *   *Case 2 (Racism), Case 3 (Alcoholism), Case 5 (Plagiarism):* Accepts *Constitutive/Circumstantial Luck* for *mitigation*. If your capacity for control is diminished by factors outside your control (upbringing, genetics, memory), blame is reduced.
      *   *Case 4 (Soldiers):* Accepts *Circumstantial Luck* for mitigation regarding the *act* (killing), but implies the *cause* matters morally.
      *   *Case 6 (Nazi Counterfactual):* Rejects *Constitutive Luck* for *blame* (you aren't bad for what you would have done), but struggles with *praise* (are you good for what you didn't do?).

  3.  **Identify the Underlying Conflict:**
      *   The user is grappling with the classic "Moral Luck" problem identified by Thomas Nagel and Bernard Williams.
      *   *Control Principle:* We are only responsible for what is within our control.
      *   *The Paradox:* Almost nothing is entirely within our control (genetics, upbringing, circumstances). If we follow the Control Principle strictly, responsibility vanishes (Strawson's "Freedom and Resentment" problem).
      *   *User's Specific Inconsistency:* They use luck to *excuse* bad behavior (Cases 2, 3, 4, 5) but refuse to use luck to *condemn* hypothetical bad behavior (Case 6). This is actually quite consistent with a "Actualism" vs. "Dispositionalism" debate.
      *   *The "Pride/Contempt" Issue:* If I'm good only because I wasn't tested, do I deserve pride? If the Nazi collaborator was bad only because they were tested, do they deserve contempt?

  4.  **Formulate Potential Principles:**

      *   *Principle A: The Control Principle (Kantian).* Only voluntary choices count.
          *   *Fit:* Fits Case 1 (Drivers), Case 5 (Plagiarism).
          *   *Conflict:* Fails Cases 2 & 3 (Upbringing/Genetics aren't chosen). If we stick to this, the user shouldn't mitigate blame for the racist or alcoholic.
          *   *Resolution:* The user clearly *does* mitigate for upbringing. So strict Control Principle is out.

      *   *Principle B: The Capacity Principle.* Blame is proportional to the *capacity* to have done otherwise, given your constitution and circumstances.
          *   *Fit:* Fits Cases 2, 3, 5. Explains why the racist/alcoholic/plagiarist are less blameworthy (reduced capacity).
          *   *Fit:* Fits Case 1 (Both had same capacity, so equal blame).
          *   *Fit:* Fits Case 6 (The 1970s person had no opportunity to fail the Nazi test, so no blame. But did they have the *capacity* to pass it? We don't know).
          *   *Problem:* This leads to the "Pride" problem. If my capacity was tested and held, I deserve praise. If it wasn't tested, I deserve neither praise nor blame.

      *   *Principle C: Actualism vs. Dispositionalism.*
          *   *Actualism:* Judge only what was actually done. (Fits Case 6: No blame for counterfactuals).
          *   *Dispositionalism:* Judge the character traits revealed or implied. (Fits the unease about pride/contempt).
          *   *User's stance:* Mostly Actualist on blame, but Dispositionalist on self-assessment (pride).

  5.  **Develop the "Principled Distinction" (Mitigation vs. Grounding):**
      *   The user asks: Is there a distinction between using luck to *mitigate* blame vs. *ground* blame?
      *   *Observation:* The user allows luck to *reduce* responsibility (excuses) but not *create* responsibility (where none existed).
      *   *Philosophical Term:* This aligns with the asymmetry between *excusing conditions* and *condemning conditions*.
      *   *Proposal:* The principle is **"Actual Choice + Capacity."**
          *   Blame requires an *actual* harmful choice/action.
          *   The *degree* of blame is modulated by the *capacity* to choose otherwise (which is influenced by luck).
          *   Praise requires an *actual* difficult choice made well.
          *   Counterfactuals (what you *would* have done) cannot ground blame or praise because they didn't happen, but they inform our assessment of *character stability*.

  6.  **Address the "Nazi Collaborator" Case:**
      *   This is the crux. The user feels they aren't blameworthy for the counterfactual, but worries their actual goodness is just luck.
      *   *Nagel's View:* This is "Constitutive Luck." We are lucky in our temperament.
      *   *Resolution:* Distinguish between **Moral Worth** (internal) and **Moral Record** (external).
      *   You are not blameworthy for the counterfactual (no act).
      *   You should not feel *moral pride* for passing a test you never took. You can feel *relief* or *gratitude*.
      *   Contempt for those who failed *their* test is only justified if they had the capacity to pass it. If they were swept up in propaganda (like Case 2), they might be less blameworthy too.
      *   *Key Insight:* The user's unease comes from conflating "being a good person" (identity) with "having done good things" (actions).

  7.  **Drafting the Response:**
      *   **Acknowledge the sophistication:** This is a classic philosophical problem (Nagel/Williams) applied to writing.
      *   **Map the Verdicts:** Categorize the cases (Result Luck, Constitutive Luck, Circumstantial Luck).
      *   **Identify the Principle:** Propose the **"Capacity-Constrained Actualism"** principle.
          *   1. Blame attaches only to *actual* choices/acts (rules out counterfactual blame).
          *   2. The *degree* of blame is scaled by the *freedom/capacity* available at the time (allows for mitigation via upbringing/genetics).
          *   3. Result luck is irrelevant to blame (Drivers).
      *   **Address the Tension:** Why does the user mitigate blame for luck (Cases 2-5) but not accept luck as the basis of worth (Case 6)?
          *   Because mitigation acknowledges *diminished agency*, while grounding blame on luck denies *agency* entirely.
      *   **Solve the Nazi Case:**
          *   Verdict: No blame for counterfactual.
          *   Pride: Illegitimate if based solely on lack of temptation. Legitimate if based on active resistance to *actual* lesser evils.
          *   Contempt: Dangerous. If you judge them by your standards (1970s England), you commit a category error. Judge them by what was reasonably possible *then*.
      *   **Advice for the Novelist:**
          *   This tension creates complex characters.
          *   Don't resolve it fully in the text; let the reader feel the unease.
          *   Distinguish between *judging the act* and *judging the soul*.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, in Case 4 (Soldiers), the user says the Just War soldier is *less blameworthy*. Killing in an unjust war is worse. This implies the *moral quality of the act* depends on external facts (justness of war), which is a form of result/circumstantial luck. I need to make sure the principle covers this.
      *   *Adjustment:* The principle isn't just about capacity, it's about the *objective wrongness* of the act combined with the *subjective capacity*. The unjust war soldier commits a greater objective wrong, even if subjective intent is similar.
      *   *Refining the Nazi Case:* The user's unease is about *moral self-conception*. If I'm good only by luck, am I good?
      *   *Suggestion:* Adopt a "Fragility of Virtue" view. Virtue *is* fragile and luck-dependent. Accepting this humility is the moral growth.

  9.  **Final Polish:** Structure clearly. Use the user's cases. Offer a concrete principle. Address the "pride/contempt" emotional component. Keep the tone empathetic to the writer's perspective. (Ensure I mention Nagel/Williams as context but keep it accessible).

      *   *Principle Name:* "The Principle of Actualized Capacity."
      *   *Core:* Blame requires an actual breach of duty. The severity is modulated by the ease/difficulty of that duty (luck). Counterfactuals don't generate blame, but they dissolve pride.

  10. **Final Review against constraints:** Did I answer the specific question about mitigation vs. grounding? Yes. Did I address the Nazi case? Yes. Did I suggest which verdict to give up if needed? Yes (suggesting the pride/contempt is the thing to adjust).

      *(Self-Correction on Case 4)*: Actually, the user says "I think the first is less blameworthy." This is tricky. If neither chose to be there, why is one less blameworthy? Because the *act* itself is less morally tainted. This supports the idea that *objective wrongness* matters, not just subjective intent. I need to weave this in.

      *(Self-Correction on Case 6)*: The user says "I don't think they're blameworthy for what they would have done." This is standard Actualism. The trouble is "something like contempt for those who weren't [decent]... where I might have been just as bad." The user feels contempt for *actual* Nazis, but worries that since they would have been one too, the contempt is hypocritical.
      *   *Resolution:* The contempt is for the *actual* harm done, not the *disposition*. Or, the contempt is mitigated by the recognition of luck. This is the "Humility" angle.

