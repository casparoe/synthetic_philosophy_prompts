          *   *Verdict:* Dan lands a punch, but Mira's parry is philosophically valid. It shows *action* should be 1/3-ish, but doesn't prove *belief* is 1/3.
      *   *Move 2: "Today is an awakening day" (New Info).*
          *   *Critique:* This is the core Thirder epistemic claim. $P(\text{Wake} | H) = 1$, $P(\text{Wake} | T) = 1$? No, that's not right. It's about self-locating belief. "I am awake now."
