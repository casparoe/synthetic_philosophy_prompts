answer: |-
  You have hit on one of the most persistent and contentious puzzles in the metaphysics of causation. Your observation is precise, and philosophers have indeed carved this out as a distinct, high-stakes topic.

  The specific label for this cluster of issues is **The Problem of Causation by Omission** (sometimes called **Negative Causation** or **Absences as Causes**).

  The tension you identified—between the physical identity of the omission (nothing happened) and the normative distinction (duty vs. no duty)—is the exact fault line where the debate rages. Here is the landscape of the live debate, the main positions, and why your observation about "switching" in policy debates is philosophically significant.

  ### 1. The Core Metaphysical Problem
  The debate starts with a metaphysical worry. If causation is a physical relation in the world (like one billiard ball hitting another), how can *nothing* cause *something*?
  *   **The Physicalist Intuition:** In the physical world, the gardener's not-watering and the passerby's not-watering are identical states of affairs: $H_2O$ was not applied to the soil. If one is a cause and the other isn't, then causation isn't purely physical; it depends on human expectations.
  *   **The Moral/Legal Intuition:** Yet, our legal and moral systems collapse without omissive causation. Homicide includes "letting die" (e.g., starving a dependent). If omissions aren't causes, many crimes and moral failures vanish.

  ### 2. The Three Main Philosophical Positions

  Philosophers generally fall into three camps regarding whether omissions are *genuine* causes.

  #### A. The Counterfactualists (The "Yes" Camp)
  **Key Proponent:** David Lewis.
  **The View:** Causation is about counterfactual dependence. If $C$ had not occurred, $E$ would not have occurred.
  *   **Application to Omissions:** If the gardener *had* watered the plants, they would not have died. Therefore, the not-watering caused the death.
  *   **The Problem:** This leads to **Profligate Causation**. As you noted, the passerby also didn't water the plants. Counterfactually, if the passerby *had* watered them, they wouldn't have died. So, under a strict counterfactual view, the passerby *also* caused the death.
  *   **The Fix:** Counterfactualists usually have to graft a pragmatic filter on top. They admit omissions are causes but argue we only *talk* about the gardener because of "contextual salience." This validates your suspicion that the "cause" label is being applied subjectively.

  #### B. The Process/Mechanistic Realists (The "No" Camp)
  **Key Proponents:** Phil Dowe, Helen Beebee.
  **The View:** Causation requires a physical process or transmission of a conserved quantity (energy, momentum).
  *   **Application to Omissions:** An omission is the *absence* of a process. Therefore, **omissions are not causes.**
  *   **The Explanation:** When we say the gardener "caused" the death, we are speaking loosely. What really happened is: (1) The plants died due to physiological processes (lack of turgor pressure, etc.), and (2) The gardener is *responsible* for not preventing it.
  *   **The Advantage:** This solves your "physical world" bug. It keeps causation objective.
  *   **The Cost:** It requires rewriting a lot of legal and moral language. They argue we should say the gardener is *responsible* for the death, but not that he *caused* it in the strict metaphysical sense.

  #### C. The Normativists / Pragmatists (The "It Depends" Camp)
  **Key Proponents:** H.L.A. Hart & Tony Honoré (*Causation in the Law*), and recently, Experimental Philosophers like Joshua Knobe.
  **The View:** This position aligns most closely with your observation. They argue that causal attribution is inherently sensitive to norms, duties, and "default vs. deviant" distinctions.
  *   **Hart & Honoré:** They argued that in common sense and law, we distinguish between a **condition** (background factors) and a **cause** (interventions). An omission is only a cause if it violates a norm or expectation. The passerby's inaction is a "mere condition" of the world; the gardener's inaction is a "deviation" from his role.
  *   **Experimental Philosophy (X-Phi):** Recent empirical studies show that ordinary people *do* judge causation differently based on moral norms. If an agent *ought* to have acted, people are significantly more likely to say their omission *caused* the outcome compared to an agent who had no duty.
  *   **Implication:** This suggests causation isn't purely "out there" in the physics; it is a cognitive tool we use to navigate a social world.

  ### 3. The "Switching" Phenomenon: Causal Selection
  You noticed people treating omissions as causes in policy debates ("budget cuts caused deaths") but denying it when defending themselves ("I didn't kill them, I just didn't fund it").

  Philosophers call this **Causal Selection**.
  Even if there are thousands of necessary conditions for an event (oxygen, gravity, lack of water, budget cuts), we select *one* or *two* to label "The Cause."
  *   **The Fault Line:** Is this selection arbitrary?
      *   **Objectivists** say we are trying to find the *most significant* physical factor.
      *   **Pragmatists** (like your observation suggests) say we select causes based on **manipulability** and **blame**. We call budget cuts the "cause" because it is a lever we can pull to change the future, or because we want to assign blame.
  *   **The Cynical View:** Some philosophers of social science argue that causal claims in policy are almost always **Interest-Relative**. The "cause" is whatever factor the speaker wants to highlight to justify an intervention. This makes causation in social contexts deeply political.

  ### 4. Is There a Live Debate?
  Yes, and it is currently very active, particularly at the intersection of metaphysics and cognitive science.

  1.  **The Metaphysical Fight:** Process theorists (Beebee/Dowe) are still fighting Counterfactualists (Lewisians) over whether omissions need to be "real" causes to support moral responsibility.
  2.  **The Cognitive Turn:** The most exciting new front is **Experimental Philosophy**. Researchers are testing whether the "normative sensitivity" you noticed is a bug in human reasoning or a feature of our concept of causation. If our brains are hardwired to link "duty" with "causation," then the Normativist view might be psychologically true even if it is metaphysically messy.
  3.  **Legal Theory:** There is a constant struggle in tort law and criminal law to define the "duty of care" precisely so that the "causation by omission" doesn't become infinite. (e.g., Do I cause a famine in Africa by not donating my lunch money?)

  ### Summary of the Fault Lines
  *   **Metaphysics:** Is causation a physical relation (No omissions) or a counterfactual relation (Yes omissions)?
  *   **Semantics:** Is the word "cause" descriptive (what happened) or normative (what should have happened)?
  *   **Psychology:** Is our tendency to link duty and causation a cognitive bias or a rational heuristic?

  ### Recommended Reading
  If you want to dive deeper, these are the canonical texts that map directly to your intuition:
  *   **H.L.A. Hart & Tony Honoré, *Causation in the Law* (1959):** This is the classic source for the "gardener vs. passerby" distinction. They argue causation in law is inherently normative.
  *   **Helen Beebee, "Causation and Nothingness" (2004):** The definitive argument for why omissions are *not* real causes (The "No" Camp).
  *   **David Lewis, "Causation as Influence" (2000):** The definitive argument for why they *are* causes (The "Yes" Camp).
  *   **Joshua Knobe & Benjamin Fraser, "Causal Judgment and Moral Judgment" (2008):** Explores the psychological link you noticed between blame and causal attribution.

  Your intuition that this makes causation "weirdly subjective" is shared by many metaphysicians who prefer a physicalist account. However, the Normativists would argue that causation *is* a human concept used for assigning responsibility, so it *should* track norms. The debate remains unresolved.
