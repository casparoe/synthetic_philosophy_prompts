prompt: |-
  I've been reading about the reference class problem and I've got to say, I don't see what the big deal is. Surely the answer is just: always use the narrowest reference class you have data for. If I want to know the probability my startup fails, I don't use the failure rate for all new businesses — I use the rate for tech startups in my sector, in my city, with my funding level, founded by someone with my background, etc. The narrower the class, the more the probability is actually about *my* situation rather than some aggregate I only sort of belong to. Philosophers talk about this like it's some deep unresolved puzzle but it seems like a straightforward methodological principle. What am I missing?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** The reference class problem isn't a big deal. The solution is simple: "Always use the narrowest reference class you have data for."
      *   **Reasoning:** Narrower classes are more specific to the individual case, making the probability more relevant.
      *   **Attitude:** Skeptical of the philosophical hype, sees it as a straightforward methodological principle.
      *   **Question:** "What am I missing?"

  2.  **Evaluate the Claim (Is it correct?):**
      *   *Intuitive Appeal:* Yes, specificity feels better. Knowing the failure rate of "AI startups in SF founded by ex-Googlers" feels more useful than "all businesses."
      *   *The Catch:* There are practical and theoretical limits to narrowing.
      *   *Key Issues:*
          1.  **Sample Size/Statistical Significance:** As you narrow, $N$ drops. Eventually $N=1$ (just you). Then you have no frequency data.
          2.  **Conflicting Classes:** An individual belongs to *many* narrow classes. Which one do you pick if they give different probabilities? (e.g., "Tech startups" vs. "Startups founded by first-time founders").
          3.  **Relevance vs. Specificity:** Not all specific details are causally relevant. Narrowing by irrelevant details adds noise, not signal.
          4.  **The Single-Case Problem:** Probability is often defined over frequencies. If the class is too narrow, does probability even apply?

  3.  **Drafting the Response - Structure:**
      *   **Validate:** Acknowledge that the user's intuition is shared by many (including some statisticians). It *is* the standard practical advice.
      *   **The "What You're Missing" (The Core Conflict):** Explain *why* philosophers and statisticians still worry about it. It's not that the advice is wrong, but that it's impossible to follow perfectly.
      *   **Point 1: The Data Sparsity Problem (N vs. Specificity).** As you narrow, $N$ goes to zero. Noise increases.
      *   **Point 2: The Crossed Classifications Problem.** You belong to multiple narrow classes with different probabilities. How to choose?
      *   **Point 3: The Relevance Problem.** Not all narrowing features matter. Overfitting.
      *   **Point 4: The Single-Case Limit.** If you narrow enough, it's just you. Frequency probability breaks down.
      *   **Conclusion:** It's a trade-off (bias-variance trade-off), not a simple rule.

  4.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *User's Example:* Startup failure. Use this.
      *   *Analogy:* Medical diagnosis or insurance underwriting are good parallels.
      *   *Philosophical Context:* Mention Reichenbach (who coined it) or Keynes. Keep it accessible.
      *   *Tone:* Respectful but challenging. Don't talk down, but show the depth of the rabbit hole.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* You're right that "narrower is better" is the *heuristic*, but the *problem* is implementing it.
      *   *Argument 1 (Sample Size):* If I narrow to "AI startups in SF by ex-Googlers with $2M seed," maybe there are only 5 such companies. 3 failed. Is the rate 60%? The confidence interval is huge. Wider class gives stable but biased estimate. Narrower gives unbiased but high-variance estimate. This is the Bias-Variance Tradeoff.
      *   *Argument 2 (Multiple Classes):* I am a "tech founder" (10% success) AND a "Y Combinator alum" (30% success) AND "first-time founder" (5% success). Which narrow class wins? They are all narrow. They contradict.
      *   *Argument 3 (Causal Relevance):* What if I narrow by "founders who wear blue shoes"? That's narrow, but irrelevant. How do we distinguish relevant narrowing from irrelevant narrowing without already knowing the outcome?
      *   *Argument 4 (The Limit):* The narrowest class is "Me, this specific startup, right now." $N=1$. Probability becomes meaningless in a frequentist sense.

  6.  **Final Polish:**
