prompt: |-
  I've just come from a long argument with a friend about whether Goodhart's law makes AI alignment impossible in principle, and I left it feeling that we were talking past each other in a way I couldn't quite pin down. My background is in philosophy of biology — I'm comfortable with the etiological account of function (Wright, Millikan, proper functions, selection history) and the causal-role account (Cummins, functions as contributions to system capacities), and I know the standard moves in that debate well. My friend works in AI safety and kept talking about specification gaming, proxy collapse, reward misspecification, and the difference between what we write down and what we actually want. I found myself mentally translating his claims into function-talk the whole time, and by the end I wasn't sure whether I'd understood him or just mapped his vocabulary onto mine in a way that missed the point.

  I'd like you to do the following. Restate the core problem of specification gaming — the phenomenon where optimising for a proxy metric causes the proxy to decouple from the underlying target we care about — in the vocabulary of the etiological versus causal-role debate about biological function. Be systematic: identify which concepts in the specification gaming literature map onto which concepts in the function debate, and how. Then give me a residue report: which claims translate cleanly, which translate only with distortion, and which have no expression at all in the function vocabulary.

  I'm particularly interested in whether the function debate has resources that the specification gaming literature lacks. For instance, the etiological account draws a sharp distinction between proper function (what a trait was selected for) and accidental function (what it happens to do now), while the causal-role account is happy to assign functions relative to a system of analytic interest without any historical commitment. Do these distinctions dissolve any of the apparent intractability of the alignment problem, or do they merely redescribe it? And conversely, does the specification gaming literature contain something — perhaps about the adversarial nature of optimisation, or about the fact that the proxy is designed rather than evolved — that the function debate has no grip on?

  After your main piece, give me a structured summary as a JSON object with the following fields:

  - "clean_mappings": an array of objects, each with keys "specification_gaming_concept", "function_theory_concept", and "notes", listing the concepts that translate without distortion.
  - "distorted_mappings": an array of objects with the same keys, listing concepts that translate only with distortion, with the nature of the distortion described in "notes".
  - "untranslatable_residue": an array of strings, each naming a claim or concept from the specification gaming literature that has no counterpart in the function debate.
  - "surplus_resources": an array of strings, each naming a resource from the function debate that has no counterpart in the specification gaming literature.
  - "verdict": a string of no more than 200 words giving your overall assessment: does the translation reveal that the specification gaming problem is less mysterious than it looks, or that the function framework is missing something essential, or something else?

  Please write your answer in American English.
