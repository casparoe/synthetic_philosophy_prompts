answer: |-
  Your suspicion is well-founded. Your friend has given you the "standard undergraduate objection" to Moore, which captures the surface-level structure of the argument but misses the philosophical engine driving it. While the friend isn't entirely wrong about the *limitations* of Moore's proof, the characterization of it as "bluster" ignores why Moore is still studied seriously nearly a century later.

  Here is a piece-by-piece breakdown of your friend's summary, separating the accurate observations from the conflations, followed by a verdict on the "bluster" claim.

  ### 1. The Setup: "Moore held up his hands..."
  *   **Friend's Claim:** Moore held up his hands and pointed out that he had one hand here and another hand here.
  *   **Verdict:** **Accurate.**
  *   **Context:** In his 1939 paper *Proof of an External World*, G.E. Moore literally gestured with his hands. He formulated the argument as:
      1.  Here is a hand.
      2.  Here is another hand.
      3.  Hands are external objects.
      4.  Therefore, external objects exist.
      Your friend has the historical facts right.

  ### 2. The Logic: "The argument is logically valid..."
  *   **Friend's Claim:** The argument is logically valid.
  *   **Verdict:** **Accurate.**
  *   **Context:** In logic, "valid" means *if* the premises are true, the conclusion *must* follow. Moore explicitly set out three criteria for a rigorous proof:
      1.  The premises must be different from the conclusion.
      2.  The premises must be known to be true.
      3.  The conclusion must follow from the premises.
      Moore argues his argument meets all three. If you grant that he has hands, and that hands are external things, it is inescapable that external things exist. Your friend is right that the logic holds.

  ### 3. The Objection: "...but it's totally question-begging."
  *   **Friend's Claim:** It begs the question because the debate is whether we can trust our senses, and Moore just assumes he knows he has hands.
  *   **Verdict:** **Partially Accurate, but misses Moore's counter-move.**
  *   **The Nuance:** This is the most common objection to Moore (often called the "problem of transmission of warrant"). The skeptic argues: *You can only know you have a hand if you already know the external world exists. So you can't use the hand to prove the world.*
  *   **Moore's Reply:** Moore doesn't deny that the skeptic *wouldn't accept* his premise. His point is that **certainty works both ways.**
      *   The Skeptic says: "My argument that you might be dreaming is more certain than your claim that you have a hand."
      *   Moore says: "No. My knowledge that I have a hand is *more certain* than the premises of your skeptical argument."
      Moore isn't trying to play by the skeptic's rules (where you must prove you aren't dreaming before you can trust your eyes). He is flipping the script. He argues that if a philosophical theory (skepticism) contradicts a common-sense fact (I have hands), it is the *theory* that should be rejected, not the fact.
      *   **Correction:** It isn't that he "assumes" he knows; he claims it is a piece of knowledge so fundamental that rejecting it is more absurd than accepting the conclusion.

  ### 4. The Conflation: "He even admits he can't prove he has hands..."
  *   **Friend's Claim:** Moore admits he can't prove he has hands, so his proof rests on an unproven premise.
  *   **Verdict:** **Subtly Wrong / Conflated.**
  *   **The Nuance:** This conflates **Knowledge** with **Proof**.
      *   Moore claims he *knows* he has hands. He does not think this premise is "unproven" in the sense of being a guess.
      *   What Moore *does* admit is that he cannot prove he is not dreaming *independently* of his sensory experience. If a skeptic says, "Prove you aren't dreaming without using your hands," Moore admits he can't do that.
      *   **However,** Moore argues that **not everything we know needs to be capable of being proven to a skeptic.** He distinguishes between *having a proof* and *knowing a premise is true.* He argues we often know things (like "I have hands") without being able to produce a philosophical argument that rules out every possible doubt.
      *   **Correction:** Moore doesn't say the premise is unproven; he says the premise is *known directly*, and that this knowledge is more secure than the skeptic's demand for a specific type of proof.

  ### 5. The Verdict: "...commonsense bluster rather than a serious answer."
  *   **Friend's Claim:** The whole thing is famous mostly as a bit of English commonsense bluster.
  *   **Verdict:** **Unfair.**
  *   **Why it's not bluster:** If Moore were just saying "Nah, you're wrong, look at my hand," that would be bluster. But Moore is making a serious methodological point about **epistemic priority** (what counts as more certain).
      *   **Shift in Burden:** Moore shifted the burden of proof onto the skeptic. Before Moore, the default was "You must prove the world exists." After Moore, the question became "Why is your skeptical hypothesis more certain than my everyday experience?"
      *   **Influence:** This wasn't dismissed as bluster by his peers. Ludwig Wittgenstein, one of the greatest philosophers of the 20th century, spent the last years of his life writing *On Certainty*, which was essentially a deep engagement with Moore's argument. Wittgenstein didn't think it was bluster; he thought Moore was onto something about how "hinge propositions" (things we don't doubt, like 'I have hands') function in our language games, even if Moore explained it slightly wrongly.
      *   **The "Serious Answer":** Moore's proof is not a "serious answer" if you expect it to silence a skeptic who refuses to trust their eyes. But it *is* a serious answer to the question: "Is skepticism a reasonable position?" Moore argues that skepticism is less reasonable than common sense. That is a substantive philosophical claim, not just bluster.

  ### Summary for Your Friend
  You can tell your friend they have the **structure** right but the **point** wrong.

  1.  **Right:** The argument is valid, and it doesn't convince a radical skeptic who demands proof that they aren't dreaming.
  2.  **Wrong:** Moore isn't trying to convince that specific skeptic on their own terms. He is arguing that the skeptic's terms are unreasonable.
  3.  **Correction:** Moore claims we *know* we have hands. He admits he can't prove he's not dreaming *without* relying on that knowledge, but he argues that knowledge doesn't require that kind of proof.
  4.  **Verdict:** It isn't bluster; it's a challenge to the hierarchy of certainty. It forces the skeptic to explain why "I might be dreaming" is more certain than "Here is a hand."

  Moore's proof is famous not because it ended skepticism (it didn't), but because it changed the way philosophers argue about it. That makes it a serious contribution, not just English stubbornness.
