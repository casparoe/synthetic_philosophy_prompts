          2.  Here is another hand.
          3.  Hands are external objects.
          4.  Therefore, external objects exist.
      *   *Moore's Conditions for a Rigorous Proof:*
          1.  Premises different from conclusion.
          2.  Premises known to be true.
          3.  Conclusion follows from premises.
      *   *Moore's Stance on Skepticism:* He thinks we *do* know we have hands. He thinks it's more certain that he has hands than the premises of skeptical arguments (e.g., "you might be dreaming").
      *   *The "Can't Prove" Nuance:* Moore distinguishes between *knowing* something and being able to *prove* it to a skeptic who demands direct evidence against skepticism. He admits he can't prove he's not dreaming *directly*, but he argues he knows he's not dreaming because he knows he has hands.
