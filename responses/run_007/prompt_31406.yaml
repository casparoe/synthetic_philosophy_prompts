prompt: |-
  I'm doing a project for my physics class on Gödel's rotating universe, and I've ended up with a list of things I think I believe, and I'd like someone to tell me whether they actually fit together before I write any of it up. Here's where I've got to:

  (1) Time genuinely passes: there is an objective difference between past, present and future, and the present is not just a trick of how my brain organises memories. (2) Gödel's rotating universe is a legitimate solution to Einstein's field equations, and in that universe there are closed timelike curves, so a spaceship could follow a path and end up in its own past. (3) If a solution is allowed by our best theory of space and time, then I should treat it as a real possibility, not just a bit of mathematics. (4) The past cannot be changed: if time travel happens, it has to be the self-consistent kind where whatever you did in the past was already part of how things went, so you couldn't kill your grandfather. (5) Causes come before their effects, in any possible world worth taking seriously.

  I know Gödel drew a stronger conclusion from his own solution, but I don't want to just copy his conclusion. Are all five jointly consistent? If not, which pairs are actually in tension, how severe is each tension, what is the cheapest thing to drop or weaken, and which single revision would clean up the most? Also, are any of the apparent conflicts just apparent once you look carefully? I keep going round in circles on this, so a proper audit would help alot.
