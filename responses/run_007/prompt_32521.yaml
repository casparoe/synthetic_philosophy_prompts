prompt: |-
  I've been part of a philosophy of probability reading group this semester, and we've been working through Hájek's case against frequentism. One of the participants, a statistician by training, keeps insisting that the reference class problem is overblown — that in practice, you always have a natural reference class given by the experimental design or the problem context, and that the philosophical hand-wringing about it is just philosophers refusing to get their hands dirty with actual statistical practice. I'm not so sure. I've read Hájek's "Fifteen Arguments Against Hypothetical Frequentism" and Reichenbach's attempt to fix the reference class via the narrowest class for which we have reliable statistics, and I can't shake the feeling that the problem cuts deeper than my friend thinks.

  I want to pin down my own view, and I'd like your help decomposing it. Here is the proposition: *The reference class problem alone is fatal to frequentism as a general philosophical interpretation of probability — that is, no version of frequentism that stakes its account on the idea that probabilities are relative frequencies in a reference class can survive the problem, and the problem admits of no fully satisfactory solution.* What is your credence in this proposition? Please decompose it: how much of your credence rides on whether the reference class problem is genuinely insoluble (as opposed to merely pragmatically messy), how much on whether hypothetical or limiting frequentism can circumvent it, how much on whether there are other fatal problems for frequentism that would do the job even if the reference class problem were somehow resolved, and any other factors you think are relevant. Give me a number and a brief justification for each term, and show how they combine to your overall credence. Then tell me which term you are least confident about and what evidence or argument would most shift your credence on that term — ideally, tell me what you would need to see to move it by at least twenty points.
