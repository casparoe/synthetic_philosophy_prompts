      *   The Translation Audit (Clean, Stretched, Missing).
      *   The Residue Report (The "Mouthpiece" Problem & The Nature of Character).
      *   Closing thought.

  *(Self-Correction Note)*: Be careful not to dismiss Dostoevsky. The point isn't that he's wrong, but that his *mode of argument* (philosophical poem) operates differently than *mode of creation* (novelistic realism). The tension between the two is the insight.

  10. **Drafting the Content:** (Mental outline of the specific metaphors)
      *   Christ = The "Write what you know" / "Let the character speak" approach.
      *   Inquisitor = The "Plot Outline" / "Commercial Viability" / "Protect the Reader" approach.
      *   Freedom = The terrifying open draft.
      *   Bread = The satisfying trope.

      *Wait, better analogy:*
      *   Christ = Giving the character full agency.
      *   Inquisitor = The Author taking control to ensure a "happy" ending.
      *   The Masses = The characters themselves (who prefer being puppets).

      *Let's go with the Character Arc analogy.*
