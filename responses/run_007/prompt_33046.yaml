      *   *Check:* Did I address the "earned choice"? Yes, the Inquisitor says earned choices are too heavy.
      *   *Check:* Is the distinction between "Want" and "Need" clear? Yes, Want = Bread, Need = Freedom.
      *   *Make sure:* The Residue Report hits the "mouthpiece" concern hard. That's the user's specific worry.

