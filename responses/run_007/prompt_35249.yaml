          *   We prevent pain *for the sake of the person who will exist*. If we decide they won't exist, there is no "sake."
      *   **The "Non-Comparability" Objection:** You can't compare "Existing with pain/pleasure" to "Not Existing." One is a state of affairs involving a subject; the other is the absence of a subject. "Better off" implies a subject who is better off.
      *   **Confidence Rating:**
