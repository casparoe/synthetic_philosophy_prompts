answer: |-
  # Seminar Handout: Mapping the Logical Terrain of Supererogation

  ## Introduction
  This taxonomy is designed to help you locate your own theoretical commitments regarding acts that are morally good but not morally required. Do not look for the label "supererogation" in the diagnostic questions. Instead, answer based on your intuitions about blame, praise, sacrifice, and duty. Follow the branches that correspond to your answers to find your position.

  ---

  ## The Taxonomy Tree

  ### **START: The Praise/Blame Symmetry Test**
  **Question:** Consider an act that is morally beneficial (e.g., keeping a promise, saving a life at low cost). Is it logically possible for an agent to be **morally blameworthy** for *failing* to perform this act, yet **not morally praiseworthy** for *performing* it?
  *(In other words: Is there a category of "Bare Duty" where doing what is required earns no credit, but failing earns blame?)*

  *   **YES:** ──► **Leaf 1: The Asymmetric Duty View**
      *   *Status:* **Logically Possible but Largely Unoccupied.**
      *   *Note:* Few defend this. It is unattractive because it severs the link between moral credit and moral requirement. It suggests morality is purely punitive. Some strict deontological interpretations might flirt with this (duty is just "not violating"), but most agree that fulfilling duty warrants at least minimal positive assessment.
  *   **NO:** ──► *Proceed to Node 2.* (Standard view: If it's required, doing it is credit-worthy; if it's not required, omitting it is blameless.)

  ### **NODE 2: The Exhaustiveness Claim**
  **Question:** Is it possible for an agent to perform an act that makes the world morally better, where performing the act is **morally praiseworthy**, but *failing* to perform it is **not morally blameworthy**?
  *(Is there a gap between the "Forbidden" and the "Required"?)*

  *   **NO:** ──► **Leaf (a): The Exhaustive Dualist View**
      *   *Description:* All morally significant acts are binary. If an act produces the most good (or conforms to rational law), it is required. If not, it is forbidden or indifferent. There is no "extra" credit for going above and beyond because morality demands the best.
      *   *Typical Defenders:* Act Utilitarians (on some readings), strict Rationalists.
  *   **YES:** ──► *Proceed to Node 3.* (You accept there is a "third category" of action.)

  ### **NODE 3: The Scope of Requirement**
  **Question:** For the acts identified in Node 2 (praiseworthy to do, blameless to omit), is the agent's permission to omit them grounded in the fact that **they have no moral requirement to promote this value at all**, OR is it grounded in the fact that **they have a general requirement to promote this value, but discretion over when and how?**
  *(Is the omission allowed because the act is optional, or because the duty is "wide"?)*

  *   **General Requirement with Discretion:** ──► **Leaf (d): The Imperfect Duty View**
      *   *Description:* The act is not required *here and now*, but the agent is under a standing obligation to adopt the relevant end (e.g., beneficence). The "supererogatory" act is simply a fulfillment of this wide duty beyond the minimum threshold. Supererogation is not a category independent of duty, but a mode of fulfilling imperfect duty.
      *   *Typical Defenders:* Kantian interpreters, some Virtue Ethicists.
  *   **No Moral Requirement at All:** ──► *Proceed to Node 4.* (You view the act as truly optional, not just discretionarily required.)

  ### **NODE 4: The Grounds of Excess**
  **Question:** Consider two acts that fit the description in Node 2 (praiseworthy, not required).
  *   **Case 1:** A hero jumps on a grenade to save comrades (High Cost).
  *   **Case 2:** A musician spends years composing a symphony that brings profound joy to thousands, at no risk or cost to themselves, but requiring rare talent (High Value/Ideal).
  **Do both cases share the same moral status, or is only Case 1 in the special "third category"?**
  *(Is the special status derived from **Sacrifice** or from the **Pursuit of Ideals**?)*

  *   **Only Case 1 (High Cost) is in the category:** ──► **Leaf (b): The Sacrifice View**
      *   *Description:* An act is only in the "third category" if it involves significant cost, risk, or sacrifice to the agent that exceeds what morality can demand. If it costs nothing, it might be good, but it isn't *supererogatory* in the strict sense. The boundary is drawn by the burden on the agent.
      *   *Typical Defenders:* David Heyd, standard analytic accounts.
  *   **Both Cases share the status:** ──► **Leaf (c): The Ideal View**
      *   *Description:* The "third category" is defined by the pursuit of moral ideals or excellence that go beyond the baseline of duty, regardless of cost. Sacrifice is often present but not essential. The boundary is drawn by the *content* of the value pursued, not just the burden on the agent.
      *   *Typical Defenders:* John Rawls (regarding saintliness), Susan Wolf, some Perfectionists.

  ---

  ## Analytical Notes for Discussion

  ### 1. Unoccupied Logical Space
  **Leaf 1 (The Asymmetric Duty View)** is the primary unoccupied space in this taxonomy.
  *   **Why Unoccupied?** It is logically consistent to hold that duty is purely negative (avoid blame) without positive credit. However, it is rarely defended because it conflicts with the intuition that moral agency involves striving for the good, not merely avoiding the bad. It renders moral community purely coercive.
  *   **Diagnostic Utility:** If you find yourself attracted to Leaf 1, ask yourself: *Do I view morality as a system of constraints or a system of values?*

  ### 2. Indistinguishable Leaves: (b) vs. (c)
  **Leaf (b) (Sacrifice View)** and **Leaf (c) (Ideal View)** are notoriously difficult to separate in practice.
  *   **The Problem:** Most "Ideals" (Case 2 in Node 4) implicitly require some "Sacrifice" (Case 1). To pursue the ideal of the saint or the hero usually *involves* cost. Conversely, high sacrifice is often taken as evidence of high idealistic commitment.
  *   **Why the Distinction Matters:** The distinction determines the *boundary* of the category.
      *   If **(b)** is true, a wealthy person donating 10% of their income is not in the third category if it costs them nothing (no change in lifestyle).
      *   If **(c)** is true, that same donation *is* in the third category because it pursues an ideal of beneficence beyond the baseline, even if painless.
  *   **Additional Question Needed to Distinguish:** "If an agent performs a massively beneficial act that requires **zero** subjective sacrifice (e.g., they enjoy it immensely, or it costs them nothing they value), is it still morally 'above and beyond' duty, or is it merely what any rational agent would do?"
      *   *Answer: "It's just what they should do"* → Leans toward **(b)**.
      *   *Answer: "It's still exceptional/optional"* → Leans toward **(c)**.

  ### 3. The Status of Leaf (d)
  **Leaf (d) (Imperfect Duty View)** is often treated as a denial of supererogation by proponents of (a), (b), and (c).
  *   **The Conflict:** If you land on (d), do you believe supererogation *exists*?
      *   Proponents of (d) say: "Yes, but it's a species of duty."
      *   Proponents of (b)/(c) say: "No, if it's a duty (even imperfect), it's not supererogatory."
  *   **Diagnostic Tip:** To resolve this, ask: "Does the agent have a right to claim they have 'done enough' once a minimum threshold of the imperfect duty is met?"
      *   If **Yes**: It functions like supererogation (Leaf d/boundary dispute).
      *   If **No**: It is a continuous duty (Leaf a).

  ### 4. Instructions for Use
  1.  Read the **Start** question. Mark your answer.
  2.  Follow the branch to the next Node or Leaf.
  3.  Once you reach a Leaf, read the description. Does it match your considered judgment?
  4.  If you feel "stuck" between Node 4 options, consult the **Indistinguishable Leaves** note.
  5.  Be prepared to defend why you rejected the **Unoccupied** Leaf 1.
