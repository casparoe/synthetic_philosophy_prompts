answer: |-
  # JOINT STATEMENT ON THE ETHICS OF HUMAN INTERVENTION
  **Signed by the Committee on Biological Norms and Moral Boundaries**

  ### I. AGREED CLAIMS

  We, the undersigned representatives of the Boundary and Continuum positions, having engaged in adversarial collaboration, affirm the following substantive claims as the foundation for further inquiry:

  1.  **Paradigm Cases:** We agree on the classification of central cases. Interventions that repair a broken limb, cure an infection, or restore lost memory following trauma are paradigmatic instances of *therapy*. Interventions that increase memory capacity beyond the species-typical maximum, alter pigmentation for aesthetic preference, or extend lifespan indefinitely in the absence of pathology are paradigmatic instances of *enhancement*. Disagreement lies in the moral significance of this classification, not the classification itself.
  2.  **Primary Moral Considerations:** Both camps agree that safety, informed consent, and distributive justice are morally relevant in *all* cases of biological intervention. The Boundary Camp does not claim therapy is risk-free or mandatory; the Continuum Camp does not claim enhancement is inherently just. We disagree only on whether the therapy/enhancement label adds *independent* moral weight beyond these factors.
  3.  **Rejection of Naturalism:** Both camps disown any argument that relies solely on the premise that "natural is good" or "unnatural is bad." We accept that medicine is inherently an interference with natural states. Appeals to the "givenness" of the human body must be grounded in harms or goods, not mere deviation from a statistical or evolutionary norm.
  4.  **Medicalization Costs:** We agree that labeling a condition "medical" or an intervention "therapeutic" carries significant social power. It affects insurance coverage, legal exemptions, and social stigma. Both camps agree that expanding the category of "therapy" too broadly risks pathologizing normal variation and straining public resources.
  5.  **Self-Authorship:** We agree that individuals have a legitimate interest in shaping their own biological and psychological capacities (self-authorship). We disagree on whether this interest is stronger when restoring a lost capacity versus acquiring a new one.

  ### II. DISAGREEMENTS TABLE

  The following table locates our residual disputes. We have moved past the question "Does the distinction exist?" to specific questions about its structure and moral force.

  | Question at Issue | Boundary Camp Position (First-Person) | Continuum Camp Position (First-Person) |
  | :--- | :--- | :--- |
  | **1. Specification of Function:** Can we specify "species-typical functioning" without smuggling in evaluative judgments about what makes a life good? | **Yes.** I hold that biological function can be objectively identified by reference to the design of the organism (e.g., the eye is for seeing). We can distinguish a *defect* from a *variation* using biological facts prior to social valuation. | **No.** I hold that any claim about "function" already presupposes a goal. Calling the eye "for seeing" implies we value sight. In a different environment, a different trait might be functional. The "baseline" is always a social choice. |
  | **2. Moral Weight of Vagueness:** If the line between therapy and enhancement is vague (e.g., restoring function to 110% of baseline), does it still bear moral weight? | **Yes.** Like the distinction between "child" and "adult," a vague boundary can still mark a morally significant transition. We can identify clear cases on either side, and the gray area does not negate the duty to treat the clear cases of pathology. | **No.** If the line is vague, it cannot support binary policy decisions (e.g., covered vs. not covered). Relying on a vague boundary invites arbitrariness. We should regulate based on the gradient of risk and benefit, not a binary category. |
  | **3. Source of Obligation:** Does society have a stronger obligation to fund/provide interventions labeled "therapy" solely because of that label? | **Yes.** Justice requires restoring citizens to the normal range of opportunity. It does not require giving everyone the best possible traits. The label signals a claim of need, not just desire. | **No.** Obligation depends on the magnitude of the benefit and the cost, not the label. If an "enhancement" provides a massive benefit at low cost, it may be more obligatory than a costly "therapy" with marginal gain. |
  | **4. Identity of Intervention:** Does the moral status of a specific technology change depending on who receives it (sick vs. healthy)? | **Yes.** The same drug is therapeutic in a diseased body and enhancing in a healthy one. The moral status is relational to the patient's baseline, not intrinsic to the technology. | **No.** The technology's risk profile and social impact are identical regardless of the user. Treating the same molecule differently based on the user's status is inconsistent regulation. |

  ### III. CRUXES AND PREDICTIONS

  We identify two specific sub-questions where empirical or conceptual clarification would force one or both camps to revise their position. We record our predictions here prior to further adjudication.

  **Crux 1: The Identical Mechanism Test**
  *   **The Case:** Consider a cognitive stimulant (e.g., Compound X). In Patient A (diagnosed with a deficit), it restores working memory to the statistical average. In Patient B (healthy), it raises working memory to the same statistical average that Patient A achieves. The physiological mechanism, side-effect profile, and long-term risks are identical.
  *   **The Question:** Is the moral permission to use Compound X significantly different for A than for B?
  *   **Boundary Camp Prediction:** We predict that moral intuition will remain divided. We assert that Patient A has a *claim of justice* to Compound X that Patient B does not, because A is being restored to the fair equality of opportunity baseline, while B is seeking an advantage. The identical mechanism does not erase the difference in baseline need.
  *   **Continuum Camp Prediction:** We predict that if the outcomes and risks are identical, the moral distinction will collapse under scrutiny. If Compound B is safe enough for the sick, banning it for the healthy is paternalistic. If it is too risky for the healthy, allowing it for the sick requires a justification based on desperate need, not a categorical distinction. We expect the "need" argument to reduce to a cost/benefit analysis, not a boundary rule.

  **Crux 2: The Baseline Drift Test**
  *   **The Case:** An intervention (e.g., neural implant) starts as an enhancement used by 5% of the population. Over time, it becomes a prerequisite for employment in most high-skill sectors. It is now "normal" to have it.
  *   **The Question:** Does the intervention morally transform from an enhancement into a therapy (or a requirement of justice) as the social baseline shifts?
  *   **Boundary Camp Prediction:** We predict the category remains stable. Even if everyone has it, it remains an enhancement if it exceeds the species-typical biological design. Justice might require *access* to it to prevent a caste system, but that is a matter of fairness, not a reclassification of the intervention as medical therapy. The biological baseline does not move with social trends.
  *   **Continuum Camp Prediction:** We predict the category will shift. If lacking the implant constitutes a disability in the current social environment, then providing it becomes a matter of restoring "normal functioning" relative to that environment. We expect the Boundary Camp to eventually concede that "function" is context-dependent, effectively merging the therapy/enhancement distinction into a question of social accommodation.

  ### IV. CLOSING NOTE ON THE NATURE OF THE DISPUTE

  After reviewing our positions, we conclude that a portion of our disagreement is **verbal**, but a significant core remains **genuine**.

  The **verbal dispute** concerns the definition of "function." The Boundary Camp uses a biological/historical definition (what the system was selected to do), while the Continuum Camp uses a contextual/goal-relative definition (what allows the agent to succeed here). If we standardized our terminology, we would agree that "biological defect" and "social disadvantage" are distinct concepts.

  The **genuine dispute** concerns **allocative justice**. Even if we agree on definitions, the Boundary Camp insists that the *source* of the disadvantage (internal pathology vs. external competition) dictates the *source* of the remedy (medical obligation vs. market choice). The Continuum Camp insists that the *severity* of the disadvantage dictates the remedy, regardless of source.

  We agree to test Crux 1 and Crux 2 in the coming year. If the Boundary Camp finds that social baseline drift forces them to fund enhancements as therapy, they will concede the boundary is socially constructed. If the Continuum Camp finds that they cannot justify denying Compound X to Patient B without appealing to a notion of "need" that looks suspiciously like a boundary, they will concede the distinction has instrumental moral weight.

  **Signed,**
  *Representative, Boundary Camp*
  *Representative, Continuum Camp*
