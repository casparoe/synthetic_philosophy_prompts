answer: |-
  This is a classic sticking point, and since you're in decision theory, I'll skip the introductory fluff and go straight to the Bayesian mechanics. You are correct that the standard "EV is undefined" answer is often unsatisfying because it feels like it dodges the conditional question.

  The short answer to your specific block is: **No, seeing the $10$ does not pin the conditional probabilities at $0.5/0.5$.**

  Your intuition relies on a hidden assumption: that the prior probability of the pair being $(5, 10)$ is exactly equal to the prior probability of the pair being $(10, 20)$. There is no symmetry principle that guarantees this.

  Here is the breakdown of where the reasoning goes wrong, formalized for a decision theorist.

  ### 1. The Symmetry Error
  You argue: *"There are only two possibilities [5 or 20], and by symmetry they should get equal probability."*

  This conflates two different symmetries:
  1.  **Envelope Symmetry:** Before opening, $P(\text{you hold smaller}) = P(\text{you hold larger}) = 0.5$. This is true by the setup of the experiment.
  2.  **Value Symmetry:** After observing $X=x$, $P(\text{you hold smaller} \mid X=x) = P(\text{you hold larger} \mid X=x) = 0.5$. **This is not guaranteed.**

  The "symmetry" of the problem setup applies to the *selection mechanism* (you pick an envelope at random), not the *distribution of values* generated by the host. Once you condition on the value $X=10$, you are effectively asking: "Is it more likely that the host generated the pair $(5,10)$ or the pair $(10,20)$?"

  ### 2. The Bayesian Update
  Let $S$ be the random variable for the smaller amount in the pair. The pair is $(S, 2S)$. Let $p(s) = P(S=s)$ be the prior probability mass function.
  You observe $X=10$. There are two ways this happens:
  1.  The pair is $(5, 10)$, so $S=5$, and you picked the larger envelope.
  2.  The pair is $(10, 20)$, so $S=10$, and you picked the smaller envelope.

  Using Bayes' theorem, the probability that you are holding the smaller amount (meaning the other is $20$) is:

  $$
  P(\text{smaller} \mid X=10) = \frac{P(X=10 \mid \text{smaller}) P(\text{smaller})}{P(X=10)}
  $$

  Since you pick envelopes randomly, $P(X=10 \mid \text{smaller}) = 0.5$ (if the pair is $10,20$, you have a 50% chance of picking the 10). Similarly for the larger case. The $0.5$ factors cancel out in the ratio. We get:

  $$
  P(\text{other is } 20 \mid X=10) = \frac{p(10)}{p(10) + p(5)}
  $$

  $$
  P(\text{other is } 5 \mid X=10) = \frac{p(5)}{p(10) + p(5)}
  $$

  For your calculation to hold ($0.5/0.5$), you require **$p(10) = p(5)$**.

  ### 3. The Impossibility of the Required Prior
  Your argument implies that for *any* amount $x$ you might open, the conditional probability should be $0.5$. This requires:
  $$ p(x) = p(x/2) \quad \text{for all } x $$
  By induction, this implies $p(x) = p(x/2) = p(x/4) = \dots = p(x/2^k)$.
  As $k \to \infty$, $x/2^k \to 0$. This implies the probability mass is constant all the way down to zero. If we consider the upward direction, $p(x) = p(2x) = p(4x) \dots$, implying constant mass all the way to infinity.

  This describes a **uniform prior over $(0, \infty)$**.
  As you know, no proper probability distribution exists that is uniform over an infinite range. $\sum p(s)$ would diverge.

  Therefore, for any **proper** prior (where $\sum p(s) = 1$), there *must* be values of $x$ where $p(x) \neq p(x/2)$.
  *   If $p(10) < p(5)$ (smaller amounts are more common), then $P(\text{other is } 5 \mid X=10) > 0.5$. You should **not** switch.
  *   If $p(10) > p(5)$ (larger amounts are more common locally), then $P(\text{other is } 20 \mid X=10) > 0.5$. You **should** switch.

  ### 4. Why it *Feels* Like a Fact
  The psychological trap is that once you see the $10$, the state space collapses to $\{5, 20\}$. It feels like a coin flip. But probability is not about the number of logical possibilities; it is about the measure assigned to those possibilities by the generating process.

  Think of it this way: Suppose you know the host is a miser who never puts more than $15 in an envelope.
  *   You open an envelope and see $10$.
  *   Possibilities: Other is $5$ or $20$.
  *   But you know $20$ is impossible.
  *   Probability other is $5$ is $1.0$. Probability other is $20$ is $0$.
  *   Your expected value for switching is $5$. You lose.

  In this bounded case, seeing the $10$ clearly does *not* imply $50/50$. The paradox relies on you ignoring the bounds (the prior). In the unbounded case, you are implicitly assuming a prior that decays so slowly it looks flat locally, but mathematically, if it decays at all, the $50/50$ assumption fails somewhere.

  ### 5. The Decision Theoretic Contradiction
  Since you're a PhD student, the cleanest way to kill the paradox is via the law of iterated expectations.
  Let $A$ be the amount in your hand, $B$ be the amount in the other.
  By symmetry of the envelopes, $A$ and $B$ are identically distributed. Thus $E[A] = E[B]$.
  If switching were always rational, then $E[B \mid A=x] > x$ for all $x$.
  Taking the expectation over $X$:
  $$ E[B] = E_X [ E[B \mid A=X] ] > E_X [ X ] = E[A] $$
  So $E[B] > E[A]$.
  But we established $E[B] = E[A]$. Contradiction.

  Therefore, the inequality $E[B \mid A=x] > x$ cannot hold for all $x$. There must be some values $x$ where $E[B \mid A=x] < x$. Those are the values where $p(x) < p(x/2)$.

  ### Summary
  Your friend is right. Seeing the $10$ does not force the probabilities to be $50/50$. It forces them to be proportional to the prior density of the pairs $(5,10)$ and $(10,20)$. Assuming they are $50/50$ is equivalent to assuming an impossible improper prior. Without a specified prior, the conditional expectation $E[B \mid A=10]$ is undefined, not $12.50$.

  The "fact" isn't just that the other envelope contains $5$ or $20$; the fact is that the *likelihood* of those two states depends on how the money was put in the envelopes in the first place.
