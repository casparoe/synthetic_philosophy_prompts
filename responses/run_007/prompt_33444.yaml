prompt: |-
  I'm a novelist, so I've spent a lot of time thinking about what happens to a sentence when its translated—and I keep running into the same stalled arguement about machine translation. One side, Hofstadter and the people who take him seriously, says a statistical system is brilliant but shallow: it can produce grammatically gorgeous output and still garble who did what, flatten a metaphor, lose irony, and translate a whole passage without any sense of the scene it describes. The other side says this is just mysterianism about the word "understand"—if the system reliably renders sense across huge ranges of text, then that is understanding in the only testable sense, and demanding some extra inner glow is unfalsifiable. Both sides have been saying these same things for years and neither moves. My working theory is that it's mostly a verbal fight over the word "understand," but I'm not sure.

  Act as a professional philosopher of mind and language, and think carefully. I want a diagnosis, not a verdict on whether machine translation understands. Is this a verbal dispute, a genuine factual disagreement about what the systems do internally, two different questions—behavior vs. semantics vs. consciousness—being fought under one heading, or something else? Brainstorm a few possible diagnoses before settling on one, and then tell me what would actually count as progress—a distinction, an experiment, a formal result, a better question—or whether we should expect the argument to stay stalled. Write in American English.
reasoning: |-
