answer: |-
  You have put your finger on one of the most persistent and frustrating structural flaws in popular animal ethics. You are right to feel that "speciesism" is too blunt a tool here, and that "naturalistic fallacy" misses the specific inconsistency you're spotting.

  There is no single, universally recognized dictionary word for this specific rhetorical slide (like "ad hominem" or "straw man"). However, in moral philosophy and bioethics, this move has a precise diagnosis. It is best understood as a combination of a logical fallacy and a failure of a specific ethical principle.

  Here is the breakdown of what the move is, what it isn't, and how to label it precisely.

  ### 1. The Logical Name: Special Pleading
  At the level of formal logic, this is a classic case of **Special Pleading**.
  Special Pleading occurs when someone applies a general rule to all cases *except* a specific case they care about, without providing a relevant justification for the exception.

  *   **The Rule:** Moral status is determined by cognitive capacity (e.g., cortical neurons, encephalization).
  *   **The Application:** The pig has fewer neurons $\rightarrow$ the pig has lower status.
  *   **The Exception:** The human infant (or cognitively impaired human) has fewer neurons $\rightarrow$ the human has full status.
  *   **The Flaw:** When challenged, the arguer does not defend why the rule shouldn't apply to the human; they simply insist the human is exempt.

  If they cannot name a *relevant difference* between the pig and the human infant other than "species membership," the logic collapses into Special Pleading.

  ### 2. The Ethical Name: Inconsistent Application of the Cognitive Criterion
  In ethics, this is often described as a failure of the **Principle of Relevant Similarity**. This principle states: *If two beings share the relevant characteristics that ground a moral right, they must be afforded that right, unless a morally relevant difference can be demonstrated.*

  The move you are describing is **Inconsistent Application of the Cognitive Criterion**.
  *   **Step 1:** The arguer establishes cognitive capacity as the *relevant characteristic* for moral worth (to exclude the animal).
  *   **Step 2:** When that characteristic is absent in a human, the arguer silently swaps the relevant characteristic to "species membership" (to include the human).

  This is distinct from plain speciesism because it attempts to use a universal metric (brain science) to appear objective, only to abandon that metric when it produces an unwanted result.

  ### 3. How to Distinguish It from Nearby Concepts

  You asked specifically how to separate this from speciesism and the naturalistic fallacy. Here is the differentiation:

  **vs. Speciesism**
  *   **Speciesism** is the *bias* itself: "Humans matter more because they are human." It is a bare assertion.
  *   **The Move You Described** is a *rationalization* of speciesism that tries to hide behind science. It says, "Humans matter more because of *neurons*."
  *   **Why the distinction matters:** If you accuse them of speciesism, they will deny it and point to the brain scans. They will say, "I'm not biased; I'm following the data!" Your counter-argument isn't that they are biased, but that they are **inconsistent**. They are using the data selectively.

  **vs. The Naturalistic Fallacy**
  *   **The Naturalistic Fallacy** is deriving an "ought" from an "is" (e.g., "Predators kill in nature, so we ought to kill").
  *   **The Move You Described** *does* commit the naturalistic fallacy (assuming brain size *ought* to determine worth), but that isn't its primary weakness.
  *   **Why the distinction matters:** Even if we granted that brain size *should* determine worth (bridging the is-ought gap), the argument still fails because of the **human exemption**. You don't need to solve the is-ought problem to defeat this move; you only need to point out the inconsistency.

  ### 4. The Counter-Move: The Argument from Marginal Cases
  You should know the name of the standard philosophical rebuttal to this move, because it gives you the vocabulary to describe the error. It is called **The Argument from Marginal Cases** (sometimes "The Argument from Overlap").

  This argument highlights that there is an overlap in cognitive capacity between some non-human animals and some humans (infants, the severely cognitively impaired, the senile).
  *   If the proponent says, "Brain size matters," the Argument from Marginal Cases forces them to either:
      1.  Accept that marginal humans have low moral status (which they refuse to do).
      2.  Accept that animals with similar brains have high moral status (which they refuse to do).
      3.  Admit that brain size isn't the actual criterion (which undermines their original argument).

  ### 5. What to Call It (If You Need a Label)
  Since there is no single word, if you want to name this move in conversation or writing, I recommend one of the following descriptive labels. These are precise enough to prevent the arguer from sliding away:

  **Option A: "Cognitive Criterion Shifting"**
  This highlights that they are moving the goalposts. They use cognitive criteria to exclude animals, then shift to membership criteria to include humans.

  **Option B: "Inconsistent Cerebralism"**
  "Cerebralism" is the belief that cognitive capacity is the sole determinant of moral worth. By adding "Inconsistent," you pinpoint that they only hold this belief when it suits their desired hierarchy.

  **Option C: "The Species-Norm Loophole"**
  Often, when pressed, these arguers will retreat to a defense called **"The Argument from Species Normality."** They will say, "We judge humans by the standard of a *normal* adult human, not by their individual capacity."
  Calling this a "loophole" accurately describes it: it is an ad-hoc exception created solely to protect humans from the consequences of the rule they just applied to animals.

  ### Summary for Deployment
  If you encounter this in the wild, here is the most precise way to articulate the error:

  > "You are engaging in **Special Pleading on Cognitive Capacity**. You are using neural metrics to downgrade the moral status of the animal, but you are refusing to apply those same metrics to humans with similar neural capacity. Unless you can identify a *morally relevant difference* between a pig and a human infant other than species membership, you are not applying a consistent ethical criterion; you are just shifting the goalposts to protect human exceptionalism."

  This formulation avoids accusing them of hate (speciesism) and avoids getting bogged down in metaphysics (naturalistic fallacy), focusing instead on the **structural inconsistency** that you correctly identified.
