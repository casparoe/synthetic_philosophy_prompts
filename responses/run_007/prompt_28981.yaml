prompt: |-
  I'm a high school student writing a paper for an advanced seminar on evolutionary biology, and I'm trying to understand the Gould–Lewontin spandrels critique by applying it to a real scientific controversy. I've chosen the debate over the evolution of the human chin. As I understand it, the chin — that bony protrusion at the front of the mandible — is unique to Homo sapiens and has no agreed-upon function. Adaptationist proposals include resisting mechanical stress during chewing, aiding speech production, or serving as a sexually selected signal. But others argue it is a spandrel: a non-adaptive byproduct of the evolutionary reduction of the face and tooth row during hominin evolution, which left the chin as a leftover structural consequence of a shrinking jaw.

  Please take the role of an evolutionary biologist who is also well-versed in the philosophy of biology. Think carefully and begin by brainstorming what the spandrels critique really demands of an adaptationist explanation — what counts as evidence, what counts as a just-so story, and where the burden of proof lies.

  Then, analyze the human chin debate through the lens of Gould and Lewontin's spandrels argument. Your response should be exactly five numbered points, each a sentence or two, with no introduction and no conclusion. For each point, identify one specific way the chin case tests, illustrates, or complicates the spandrels framework — for instance, a feature of the debate the framework handles well, a feature it struggles with, or a lesson it teaches about how adaptationist reasoning operates in practice.
