          *   Why entropy? Why not Euclidean distance? Why not something else? The choice of metric is extra-Bayesian.
          *   In JBP, MaxEnt implies that learning about the *internal structure* of Red Territory changes the probability of *being* in Red Territory. This feels counterintuitive to many (the "irrelevance" intuition).
      *   **Point 3: Generalization Beyond Paratroopers.**
