          *   Example: A doctor says, "If you have symptom X, the chance of disease Y is 90%." How does that change your prior belief that you have symptom X?
          *   Example: Machine Learning. Constraints on conditional probabilities are common (fairness constraints, etc.). How do we update the joint distribution?
          *   If the framework can't handle this without ad-hoc principles, it's incomplete for general reasoning.
      *   **Point 4: The "Principled Way" Vacuum.**
          *   Bayesianism claims to be a logic of partial belief. Logic should be deductive.
          *   If $P_{old}$ + Constraint $\nrightarrow P_{new}$ uniquely, then it's not a logic. It's a heuristic.
          *   The "extra assumptions" the user mentioned are precisely the principles of indifference or entropy maximization, which are notorious for being context-dependent.

