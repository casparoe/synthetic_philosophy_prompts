  I'm applying for a six-month postdoctoral fellowship and need a three-page research proposal. My half-formed idea concerns program equilibrium. Standard results show that if players in a one-shot Prisoner's Dilemma submit programs that can read each other's source code, mutual cooperation becomes an equilibrium — for instance, via a program that outputs "cooperate" if the other program would output "cooperate" given my source code. But these results assume the programs are written in a shared language with equivalent expressive power. I want to ask: what happens when the two programs are written in different formal languages or face asymmetric computational bounds — say, one is a finite-state automaton and the other a Turing machine — such that the usual diagonal arguments for cooperation may not go through symmetrically? Does the cooperative equilibrium survive under some translation scheme, or does it require something like a common semantic framework? And if the result is fragile, does that undermine the philosophical claim that program equilibrium shows cooperation is rational in one-shot interactions, or does it just show that the rationality of cooperation is sensitive to the agents' representational capacities? Turn this into a proposal with a crisp question, an argument that existing work leaves it open, a month-by-month plan, and an honest statement of what would count as failure. I will add citations.
