  9.  **Final Polish:** Ensure the transition from the Logical Map to the Diagnosis is smooth. Make sure the voice sounds like a philosopher of language/aesthetics (use terms like "extension," "intension," "normative force," "ontological commitment").

  *(Self-Correction Note)*: I need to make sure I don't just say "it's verbal." That's too dismissive. I need to explain *why* it feels metaphysical to the participants. It feels metaphysical because they are arguing about the *source of authority*.

  10. **Final Review against constraints:**
      *   Map logical space? Yes.
      *   Diagnosis on 4 points? Yes.
      *   No verdict on who wins? Yes.
      *   Tone appropriate? Yes.

