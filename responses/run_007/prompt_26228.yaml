answer: |-
  ### I. Mapping the Logical Space of the Disagreement

  To diagnose the impasse, we must first delineate the boundaries of the contention. The debate is often presented as a binary opposition, but the shared commitments you have identified suggest a more complex topology.

  **1. The Core Claims**
  *   **The Intentionalist:** Holds that a text is essentially a *trace of agency*. Meaning is a relational property between an author's mind and a reader's reconstruction. The text is a means to an end (communication). Therefore, the identity of the work is tied to the generative act.
  *   **The Anti-Intentionalist:** Holds that a text is essentially a *public artifact*. Meaning is a functional property of the sign-system within a specific cultural matrix. The text is an end in itself (an aesthetic object). Therefore, the identity of the work is tied to its structural coherence and reception.

  **2. The Zone of Concession (The Overlap)**
  As you note, the extensional agreement is high. Both sides agree that:
  *   Biographical context aids interpretation.
  *   Authors can fail (the "gap" between intent and execution).
  *   Inaccessible intent necessitates reliance on public convention.
  *   Anachronistic or impossible readings are defective.

  **3. The Point of Tension (The Intension)**
  The disagreement lies not in the *practice* of interpretation, but in the *explanation* of that practice.
  *   **For the Intentionalist:** The reason an anachronistic reading is "bad" is that it is *false*. It misidentifies the communicative act.
  *   **For the Anti-Intentionalist:** The reason an anachronistic reading is "bad" is that it is *unfaithful* or *incoherent*. It imposes a structure the text cannot support, regardless of whether it matches a hypothetical intent.

  The tension is located in the **status of the "bad reading."** Is the defect truth-conditional (metaphysical) or pragmatic/aesthetic (normative)? The impasse persists because both sides claim to be describing the *same* phenomenon ("meaning") while relying on incompatible criteria for verification.

  ***

  ### II. A Diagnosis of the Disagreement

  Here is my analysis of the nature of this stalemate, addressing your four specific queries.

  #### (1) Is this a substantive metaphysical dispute or a verbal dispute?

  It is a **deep verbal dispute masquerading as a metaphysical one.**

  In a trivial verbal dispute, parties agree on the facts but use words differently (e.g., "Is a tomato a fruit?"). Here, the dispute feels substantive because the participants are not merely arguing over a definition; they are arguing over **ontological authority**. They are fighting for the right to decide what kind of *object* a literary text is.

  However, if we look at the "Zone of Concession," we see that the *extensions* of their claims largely overlap. In 90% of cases, what the words convey (Anti-Intentionalist) aligns with what the author intended (Intentionalist). The dispute only ignites in the marginalia: unconscious meaning, failed execution, and posthumous reception.

  Why has this not been obvious? Because "meaning" is a **cluster concept**. It bundles together semantic content, speaker significance, emotional effect, and cultural value.
  *   The Intentionalist privileges the *communicative vector* (Sender → Message).
  *   The Anti-Intentionalist privileges the *receptive vector* (Message → Receiver).

  Both claim the label "meaning" for their preferred vector because, in ordinary communication, these vectors are usually co-located. The dispute feels metaphysical because each side believes their vector is the *essence* of the phenomenon, while the other is merely accidental. In reality, they are isolating different dimensions of a single complex practice. The "meaning" of a text is not a singular entity to be located; it is a relational event that spans author, text, and context. By reifying "meaning" as a static object to be found either in the mind or on the page, both sides create a false dichotomy.

  #### (2) Is this a disagreement about norms?

  **Yes, primarily.** This is the engine driving the metaphysical posturing.

  The debate is fundamentally axiological (about value) rather than ontological (about being). When the Intentionalist says, "Meaning is intention," they are implicitly arguing: *"We ought to respect the autonomy of the other."* Reading is an ethical encounter with another consciousness; to ignore intention is to colonize the text.

  When the Anti-Intentionalist says, "Meaning is public convention," they are implicitly arguing: *"We ought to respect the autonomy of the work."* Reading is an engagement with a cultural artifact that transcends its creator; to restrict it to intent is to impoverish its potential significance.

  The reason the debate feels intractable is that **normative disagreements are resistant to empirical falsification.** You cannot prove that one *ought* to value authorial respect over textual potentiality. Both are valid hermeneutic virtues. The Intentionalist values *fidelity*; the Anti-Intentionalist values *vitality*.

  The "bad reading" agreement you noted confirms this. Both agree certain readings are defective, but they justify this defect differently because they are protecting different norms. The Intentionalist protects the norm of *historical truth*; the Anti-Intentionalist protects the norm of *textual coherence*. The impasse is a clash of hermeneutic ethics disguised as a clash of facts.

  #### (3) Could there be a hidden empirical question here?

  **No, not one that would resolve the philosophical impasse.**

  One might suggest that psycholinguistics could settle this: Do human brains process text by simulating the author's mind (Theory of Mind) or by decoding semantic structures?
  *   If research showed we *always* simulate intent, the Intentionalist would claim victory.
  *   If research showed we *always* process syntax independently, the Anti-Intentionalist would claim victory.

  However, this commits the **naturalistic fallacy**. Even if empirical study revealed that human beings *cannot* help but interpret texts intentionally (or non-intentionally), this would not tell us how we *ought* to interpret literature critically. Literary interpretation is a specialized, reflective practice, not merely a cognitive reflex.

  Furthermore, the "ordinary language" usage of "means" is already split.
  *   "What did he *mean* by that letter?" (Intentional)
  *   "What does this red light *mean*?" (Conventional)
  *   "What does this poem *mean* to you?" (Significance/Effect)

  Empirical data on usage would likely reveal this same polysemy. It would show that "meaning" is context-dependent, which supports the diagnosis that the debate is verbal/conceptual, not empirical. An empirical result would not break the impasse because the impasse is not caused by a lack of data, but by a conflict of values regarding what aspect of that data matters most.

  #### (4) What would count as progress?

  Given the diagnosis that this is a **normative dispute obscured by a reified metaphysical concept**, progress will not come from a verdict, but from **dissolution and differentiation.**

  **A. A New Conceptual Distinction**
  Progress requires abandoning the monistic search for *The Meaning*. We should adopt a pluralistic taxonomy, distinguishing:
  1.  **Semantic Content:** What the words conventionally signify (Anti-Intentionalist domain).
  2.  **Utterance Meaning:** What the author intended to communicate (Intentionalist domain).
  3.  **Significance:** The value or effect generated in a specific context (Reader-Response domain).

  Once we admit that a text can possess (1) without (2), or (2) without successful (1), the question "But what does it *really* mean?" loses its grip. We replace it with: "Which layer of meaning is relevant to our current critical purpose?"

  **B. A Change of Question**
  We must shift from "What is the nature of meaning?" to "What is the goal of this interpretation?"
  *   If the goal is **historical reconstruction**, Intentionalism is the correct normative framework.
  *   If the goal is **aesthetic appreciation** or **cultural critique**, Anti-Intentionalism is the correct normative framework.

  **C. Is the lack of progress a problem?**
  The persistence of the debate is not a failure of philosophy, but a symptom of the richness of the object. Literature is both a communicative act (implying an agent) and an aesthetic object (implying autonomy). To demand a single metaphysical ground for both is to misunderstand the hybrid nature of art.

  Therefore, the "impasse" is actually a stable equilibrium. It signals that we are dealing with a **dialectical tension** inherent to the practice of reading itself. Progress would look like recognizing that the tension is productive rather than pathological. We should stop trying to win the debate and start mapping the conditions under which each framework yields the most insight. The "problem" is only a problem if we insist on monism. If we accept pluralism, the debate dissolves into a toolkit.

  **Summary Diagnosis:**
  The debate is a **normative conflict over hermeneutic authority**, sustained by a **verbal confusion** regarding the polysemous concept of "meaning." It cannot be solved empirically or metaphysically because it is not a factual dispute. Progress lies in dissolving the demand for a single definition of meaning and replacing it with a pragmatic contextualism that acknowledges the legitimacy of both intention and convention depending on the critical aim.
