  2.  **Map the Logical Space (Pre-Diagnosis):**
      *   *Intentionalist (Actual/Hypothetical):* Meaning = Intention. Text is a vehicle for agency. Failure of execution = failure of meaning (or at least, meaning is what was aimed at).
      *   *Anti-Intentionalist (New Criticism/Structuralism/Reader-Response):* Meaning = Public Conventions/Effect. Text is an autonomous object. Failure of execution = text says something else (the "heresy of paraphrase" or "death of the author").
      *   *Common Ground:* Biographical evidence is useful. Authors fail (gap between intent and text). Inaccessible intent forces reliance on text. Anachronistic readings are "bad."
      *   *Tension Point:* The *status* of that "badness." Is it truth-conditional (meaning is wrong) or pragmatic/aesthetic (interpretation is uninteresting/unfaithful)?

  3.  **Address Question (1): Metaphysical vs. Verbal:**
      *   *Initial thought:* It looks metaphysical ("What *is* meaning?").
      *   *Deeper look:* If both agree on the *extensions* (in most cases, intended meaning and conveyed meaning overlap), is it just a definition fight?
      *   *Problem:* They disagree on the *hard cases* (unconscious meaning, failed execution). So it's not purely verbal in the trivial sense.
      *   *Nuance:* It might be a "deep verbal" dispute where the underlying concepts (agency vs. structure) are in conflict. They are using "meaning" to track different *values*.
      *   *Conclusion:* It's not *merely* verbal, but the metaphysical stakes are inflated by a conflation of distinct concepts (semantic content vs. communicative significance).

  4.  **Address Question (2): Normative Disagreement:**
      *   *Observation:* Both sides agree on what makes a "good" reading in practice (coherence, historical fit).
      *   *Shift:* The debate is often about *authority*. Who governs the text? The creator or the community of users?
      *   *Diagnosis:* This is strongly normative. It's about the *ethics* of reading. Is reading an act of recovery (respecting the Other) or creation (engaging with the object)?
      *   *Implication:* The "impasse" persists because they are advocating for different *practices* disguised as ontological claims.

  5.  **Address Question (3): Hidden Empirical Question:**
      *   *Possibility:* Psycholinguistics? How do brains process text?
      *   *Limitation:* Is/Ought gap. Even if brains process text without accessing authorial intent, does that mean they *should*?
      *   *Linguistic Intuitions:* Ordinary language use of "mean." "What did he mean by that?" vs. "What does this sign mean?"
      *   *Verdict:* Empirical data might clarify the *mechanism* of interpretation, but it won't settle the *normative* status of literary meaning. It's a category error to expect empirical data to solve a conceptual/normative standoff.

  6.  **Address Question (4): Path to Progress:**
      *   *Current State:* Stalemate.
      *   *Solution:* Dissolution or Reframing.
      *   *Idea:* Distinguish "Semantic Meaning" (conventional) from "Utterance Meaning" (intentional) vs. "Significance" (value to reader).
      *   *Better Idea:* Shift from "What is the meaning?" to "What is the interpretation *for*?"
      *   *Progress:* Not a winner, but a pluralistic framework. Recognizing that "meaning" is a cluster concept.
      *   *Is lack of progress a problem?* Yes, it indicates a category mistake. We are asking an ontological question about a normative practice.

