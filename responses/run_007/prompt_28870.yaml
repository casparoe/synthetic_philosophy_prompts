prompt: |-
  I've recently taken a position on the risk committee of an environmental regulatory agency. I review quantitative risk assessments that inform permitting decisions for hazardous facilities, and I keep running into the same foundational problem. Different analysts assign wildly different probabilities to the same event — a catastrophic failure, an extreme flood, a contamination plume reaching an aquifer — and when I press them, the disagreement isn't about the data. It's about what a probability claim is in the first place. One analyst treats it as a long-run frequency and worries endlessly about which reference class the event belongs to. Another treats it as a rational degree of belief given the evidence and updates it whenever new information arrives. A third talks about the physical propensity of the system, as if probability were a property like mass. I need to get this straight before I can judge whose numbers to trust.

  Write me the desiderata for an interpretation of probability: what any adequate account of what probability means must deliver. Give me the list of requirements, each with the case or phenomenon that makes it a requirement, and distinguish which are non-negotiable constraints on any interpretation and which are parochial demands of one camp that another can reasonably set aside.

  Make sure the list wrestles with at least these fault lines: how an interpretation handles unique, non-repeatable events (this particular dam, this particular watershed under this climate scenario) versus its obligation to explain why probabilities are constrained by observed frequencies; how it accounts for the role of probability in guiding action under uncertainty versus its role in scientific explanation; and how it makes room for the fact that reasonable people with the same evidence can disagree about a probability without either of them being obviously irrational, while also making room for the fact that some probability assignments are flatly wrong.

  I want a committed answer. Tell me which requirements you think are mandatory, whether any subset of them can't be jointly satisfied, and which single requirement does the most work in excluding the leading interpretations. A table for the scorecard is fine, but the weight should be on the reasoning behind each entry on the list — why it earns its place and what it costs to drop it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Member of a risk committee at an environmental regulatory agency.
      *   **Task:** Define desiderata (requirements) for an interpretation of probability.
      *   **Context:** Reviewing quantitative risk assessments (QRAs) for hazardous facilities. Analysts disagree on probabilities due to foundational philosophical differences (Frequentist vs. Bayesian/Subjective vs. Propensity).
      *   **Specific Constraints:**
          *   List requirements with cases/phenomena motivating them.
          *   Distinguish non-negotiable constraints vs. parochial demands.
          *   Address specific fault lines: Unique events vs. frequencies, Action-guiding vs. Explanatory, Reasonable disagreement vs. Objective wrongness.
          *   Provide a committed answer (mandatory requirements, incompatibilities, the "killer" requirement).
          *   Format: Reasoning-heavy, table optional but secondary to argument.
      *   **Tone:** Professional, rigorous, philosophical but practical (regulatory context).

  2.  **Deconstruct the Problem:**
      *   The core issue is the *Interpretation of Probability*.
      *   Major interpretations:
          *   *Frequentism:* Probability = Long-run relative frequency. (Good for repeatable, bad for unique events).
          *   *Subjective/Bayesian:* Probability = Degree of belief. (Good for unique events/action, bad for objective truth claims).
          *   *Propensity:* Probability = Physical disposition. (Good for explanation, bad for epistemology/measurement).
          *   *Logical/Evidential:* Probability = Relation between evidence and hypothesis. (Good for rationality, bad for physical connection).
      *   The user needs a framework to evaluate *which* interpretation serves regulatory risk assessment best, or at least what features *any* working interpretation must have.

  3.  **Drafting the Desiderata (Brainstorming):**
      *   *Requirement 1: Math.* Must obey Kolmogorov axioms. (Non-negotiable).
      *   *Requirement 2: Unique Events.* Must handle "this dam breaking in 2030." (Frequentists struggle here).
      *   *Requirement 3: Frequency Connection.* If I flip a coin 1000 times, heads should be ~50%. (Subjectivists struggle to explain *why* without ad hoc arguments).
      *   *Requirement 4: Action Guidance.* If P(risk) > threshold, regulate. (All need this, but Subjectivists excel).
      *   *Requirement 5: Objectivity/Constraint.* Not just "anything goes." Some assessments are wrong. (Propensity/Frequentist excel, Subjectivists struggle).
      *   *Requirement 6: Evidence Sensitivity.* New data changes probability. (Bayesians excel).

  4.  **Refining and Categorizing (The "Committed Answer"):**
      *   I need to take a stance. A purely neutral list isn't helpful for a regulator who needs to *judge*.
      *   *Stance:* Regulatory risk assessment requires a *pluralistic* but *constrained* approach. However, for the purpose of *defining* probability in this context, a "Hybrid Evidential-Propensity" or a "Principal Principle" approach is usually best. But the prompt asks for desiderata for *an* interpretation.
      *   *Decision:* I will argue that **Action-Guidance under Unique Events** and **Constraint by Physical Reality** are the two non-negotiable pillars. This creates tension.
      *   *The "Killer" Requirement:* The connection between probability and frequency (Calibration). This kills pure subjective accounts that ignore calibration and pure frequentist accounts that can't handle single cases.
      *   *Incompatibility:* You cannot have strict Frequentism (requires infinite repeatability) AND applicability to unique catastrophic events (one-off). One must yield.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. This isn't just philosophy; it's public safety.
      *   **The Desiderata List:** Grouped by function.
          *   Formal Coherence (Math).
          *   Applicability (Unique events).
          *   Empirical Anchor (Frequencies).
          *   Normative Force (Action/Regulation).
          *   Epistemic Constraint (Right/Wrong).
      *   **Analysis of Trade-offs:** Which are non-negotiable? Which are parochial?
      *   **The Committed Verdict:** What fails? What works? The "Killer" constraint.
      *   **Scorecard/Table:** To summarize the performance of the three main camps (Frequentist, Subjective, Propensity).

  6.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the user's observation. This is the "Interpretational Problem."
      *   *Desideratum 1: Formal Coherence.* Must act like math. (Non-negotiable).
      *   *Desideratum 2: Single-Case Applicability.* The "Dam Problem." (Non-negotiable for regulation).
      *   *Desideratum 3: Empirical Calibration.* The "Coin Flip Problem." (Non-negotiable for science).
      *   *Desideratum 4: Action-Guiding.* The "Decision Problem." (Non-negotiable for policy).
      *   *Desideratum 5: Rational Constraint.* The "Wrongness Problem." (Non-negotiable for accountability).
      *   *Distinguishing Parochial:* E.g., "Objectivity as mind-independence" is parochial to Realists. "Updating via Bayes Rule" is parochial to Bayesians (though widely accepted).
      *   *The Conflict:* Unique events (Req 2) vs. Frequencies (Req 3). Frequentists fail 2. Pure Subjectivists fail 3 & 5. Propensities fail measurement.
      *   *The Verdict:* I need to recommend a path. A "Best System" or "Principal Principle" approach (Lewis) often bridges the gap. Or simply admit that for regulation, *Evidential Probability* (Logical) constrained by *Physical Models* is the only workable solution.
      *   *The "Killer" Requirement:* **Single-Case Applicability.** Why? Because regulation *always* deals with specific facilities. If an interpretation can't assign a probability to *this* dam, it is useless for permitting, regardless of its mathematical elegance. This excludes strict Frequentism.
      *   *The Second Killer:* **Empirical Constraint.** If I say P(failure) = 0.9 and it doesn't fail across 100 similar dams, I was wrong. This excludes radical Subjectivism.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Single-Case Applicability" truly non-negotiable? Frequentists argue you *can* do it by defining a reference class.
      *   *Counter:* But the reference class is arbitrary (The "Reference Class Problem"). This makes the probability unstable. For a regulator, instability = legal vulnerability. So yes, for *this* user, it's non-negotiable.
      *   *Critique:* Is "Empirical Constraint" non-negotiable? Subjectivists say "I was calibrated poorly, but my belief was rational."
      *   *Counter:* In regulation, "rational belief" that leads to catastrophic underestimation is negligence. So yes, empirical constraint is non-negotiable.
      *   *Conclusion:* The user needs an interpretation that satisfies both. This points toward **Bayesianism with Objective Priors** or **Propensity interpreted Evidentially**. I should recommend a *functional* synthesis rather than a pure philosophical camp.

  8.  **Final Polish:**
      *   Ensure the tone is authoritative but respectful of the complexity.
      *   Check all constraints from the prompt (unique events, frequencies, action, disagreement vs. wrongness).
      *   Make sure the "Committed Answer" is clear.

  9.  **Final Review against Prompt:**
      *   Desiderata list? Yes.
      *   Case/Phenomenon for each? Yes.
      *   Non-negotiable vs. Parochial? Yes.
      *   Fault lines addressed? Yes.
      *   Committed answer (mandatory, incompatibilities, killer requirement)? Yes.
      *   Table? Yes.

