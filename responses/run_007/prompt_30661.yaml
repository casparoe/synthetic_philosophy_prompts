          *   *Verdict:* Lean towards *no split* for management purposes, or flag as "Evolutionary Significant Unit" rather than species.
      *   *Case 2 (Fish Management Unit):* Isolated, locally adapted, compatible.
          *   *Analysis:* Distinct? Yes (adaptation). Causal? Selection + isolation. Inductive? High (temp tolerance matters for management). Floodgates? Contained (specific watershed).
