      *   *Homeostatic Property Clusters (HPC):* Boyd's idea. Properties cluster together because of underlying causal mechanisms (genes, development, ecology). If the cluster is stable, it's a kind.
      *   *Inductive Potential:* If I know $X$ is in Group $A$, can I predict unseen properties of $X$? (Quine's "kindness"). If splitting doesn't improve prediction, why split?
      *   *Individuals vs. Kinds:* Ghiselin/Hull. Species are individuals (historical entities), not classes. But for management, we often treat them as kinds (generalizable units). Need to balance historical uniqueness vs. generalizable properties.
      *   *The "Slippery Slope" (Sorites):* If we recognize this population, do we have to recognize every distinct population? Where is the cutoff?
      *   *Process vs. Pattern:* Is the divergence ongoing (process) or stable (pattern)?
      *   *Management Relevance:* Does the classification change the outcome? (The "So What?" test).
      *   *Value Judgments:* Science tells us about divergence; policy tells us if that divergence matters for conservation/law. The procedure must flag where science ends and policy begins.

  3.  **Developing the Decision Procedure:**
