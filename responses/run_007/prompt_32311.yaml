answer: |-
  **Setting:** *A diner booth, 8:30 PM. Marcus is still in his work boots, a worn notebook open on the table next to a cup of coffee. Elena sits opposite him, scrolling through a tablet.*

  **Marcus:** Look at this entry from last November. "Confidence: 90%. The Henderson job will be done by Friday." I wrote that on a Tuesday. I was fresh, had all the parts, and the foreman had just told me the schedule was clear.

  **Elena:** And?

  **Marcus:** And I didn't finish until the following Wednesday. Hidden junction box, corroded wiring, the usual nightmare. But look at the confidence. I was *sure*. Now, reading it, I'm 100% sure I was wrong. The question is: Should *Tuesday-Marcus* have listened to *Friday-Marcus*? If Tuesday-Marcus could have known that Friday-Marcus would be looking at a finished job and shaking his head, should he have lowered his confidence right then?

  **Elena:** That's the Reflection Principle, Marcus. Roughly: your current confidence in a claim, given that your future self will be 80% confident, should be 80%. You should treat your future self as an expert.

  **Marcus:** An expert? Elena, Friday-Marcus was exhausted. He'd been arguing with the client for three hours. He was hungry and just wanted to go home. Why should I defer to a version of me that's operating on fumes?

  **Elena:** Because Friday-Marcus has information Tuesday-Marcus doesn't. He knows if the wires were corroded. He knows if the foreman lied. Time brings evidence. If you ignore the beliefs your future self will hold, you're essentially saying, "I know better than the person who has seen the evidence." That's epistemic arrogance.

  **Marcus:** It's not arrogance if I know the mechanism of the error. If I know I'm going to be drunk at a party tomorrow, and I know Drunk-Marcus will be convinced he can drive home safely, I don't defer to him. I lock his keys away tonight. Reflection says I should be 80% confident I can drive if I expect Drunk-Marcus to be 80% confident. That's not rationality; that's suicide.

  **Elena:** You're conflating the principle with a blanket rule. Van Fraassen wasn't saying you must defer to *any* future state. He's talking about a rational agent updating on new information. The principle assumes you don't expect your future self to be irrational, impaired, or manipulated. If you *know* you'll be drunk, the condition changes. You aren't conditioning on "Future Me believes X"; you're conditioning on "Future Me believes X *while drunk*."

  **Marcus:** Okay, so we add a clause. "Defer to your future self, provided they are rational and informed." But here's the trap: How do I know *now* whether Future Me will be rational?

  **Elena:** You use your current judgment.

  **Marcus:** Exactly. If I use my current judgment to decide whether Future Me is trustworthy, I'm not actually deferring to him. I'm deferring to my current assessment of him. If I think he's going to be tired and grumpy, I discount him. If I think he'll be rested, I trust him. But that means the authority isn't in the *future belief*; it's in my *current prediction* of the conditions. The Reflection Principle becomes redundant. It just tells me to trust my current judgment about the future, which I'm already doing.

  **Elena:** It's not redundant because it's a coherence constraint. It stops you from making plans that your future self will inevitably undo. Think of it like a Dutch Book. If you believe X now, but you know for a fact that tomorrow you'll believe Not-X without expecting any new evidence, you're incoherent. You're setting yourself up to bet against yourself. Reflection forces you to align your trajectory. If you think you'll change your mind, you should ask *why*. If there's no new evidence, why the change?

  **Marcus:** But sometimes the "evidence" is internal. Let's go back to the notebook. Sometimes I write down a prediction after talking to a friend who's very persuasive. In the moment, I'm swept up. I feel certain. Six months later, the feeling is gone, and I see the logic was flawed. Should Present-Marcus defer to Persuaded-Marcus?

  **Elena:** If you *know* now that the persuasion is manipulative, then no. You condition on the manipulation. But what if you don't know? What if you genuinely can't tell the difference between good persuasion and manipulation until later?

  **Marcus:** Then I'm stuck. If I defer, I might be walking into a trap. If I don't, I might be ignoring genuine insight.

  **Elena:** And that's why the default has to be deference. Think about the alternative. If you give yourself a standing license to ignore your future self whenever you suspect you might be wrong, you've built a firewall against learning. You can say, "Oh, Future Me will only believe this because I'll be tired/emotional/manipulated," whenever the evidence gets uncomfortable. It's a way to immunize your current beliefs from revision.

  **Marcus:** That's a fair charge. Stubbornness is a risk. But look at the risk on your side. Reflection encourages "belief laundering." I can take a belief I hold for bad reasons, project it into the future, and say, "Well, Future Me will hold this, so I'm justified in holding it now." It gives a veneer of rationality to whatever I happen to feel strongly about.

  **Elena:** Only if you're lying about the conditions.

  **Marcus:** But who checks? It's all inside my head. The principle relies on me being honest about whether I expect my future self to be rational. But if I'm biased now, I'll probably think my future biased self is rational. The principle assumes I have a clear view of my own cognitive trajectory. I don't. I'm an electrician, not a clairvoyant. I know how to wire a panel. I don't know how my brain will process grief or fatigue three months from now.

  **Elena:** I get that. But consider the alternative view: The Present Self as King. If you reject Reflection, you're saying the present moment has a privileged epistemic status. Why? Why is *now* the golden hour of rationality? Usually, it's the opposite. You're the one who wrote that your future self is often more confident.

  **Marcus:** More confident, yes. More reliable? Not always. Here's the distinction: Information vs. Processing. Future Me usually has more *information* (the job is done, the wires are visible). But Future Me might have worse *processing* (fatigue, grief, bias). Reflection treats time as purely additive for information. It ignores that time can be subtractive for cognitive capacity.

  **Elena:** So you want a weighted average? Defer to the future on facts, defer to the present on processing?

  **Marcus:** I want to say that deference is earned, not granted by timestamp. If I expect Future Me to have seen the finished job, I defer on the timeline. If I expect Future Me to be grieving a loss, I don't defer on life decisions.

  **Elena:** But that requires you to know *which* beliefs are affected by the grief and which by the facts.

  **Marcus:** Right. And that's hard. But isn't it better to struggle with that distinction than to blindly follow a rule that says "Trust Future You"?

  **Elena:** It's not blind. It's a baseline. Look, the hard part isn't the obvious cases. We agree on the drunk driver. We agree on the finished job. The hard part is the middle ground. The "persuasive friend." The "gut feeling after a long shift." In those cases, you don't know if it's impairment or insight. Reflection says: if you expect to believe it later, believe it now. Your view says: wait until you're sure the processing is clean.

  **Marcus:** My view says: update on evidence, not on prophecies. If I have evidence the wiring is corroded, I believe it. I don't need to check what I'll believe on Friday.

  **Elena:** But you often don't have the evidence yet! That's the point of the notebook. You're making decisions *now* based on what you expect to know *later*. If you're buying materials for the Henderson job, you're betting on Tuesday-Marcus's prediction. If you truly believed Friday-Marcus would disagree, you wouldn't buy the materials. You'd wait. Your actions already reflect Reflection. You act as if your future beliefs matter. The principle just asks you to make your beliefs match your actions.

  **Marcus:** That's a strong point. I do act like I trust him. I buy the wire. But I also build in contingencies. I buy extra wire. I leave time in the schedule. That's me hedging against Future-Marcus being wrong.

  **Elena:** Hedging isn't rejecting. You're still using his predicted belief as the anchor. You're just adding a margin of error. That's compatible with Reflection. You can be 80% confident and still carry a backup fuse.

  **Marcus:** Okay, but let's push it. What if I know I'm prone to optimism bias? I know that every time I start a job, I think it'll go fast. I have historical data in this notebook proving I'm wrong. Should I defer to Optimistic-Marcus?

  **Elena:** No. Because you have *current* evidence that Optimistic-Marcus is unreliable. You're conditioning on "Future Me believes X *and* has a history of being wrong about X." In that case, your current confidence should be lower than his. Reflection handles this. It only demands alignment when you view your future self as a reliable updater.

  **Marcus:** So the principle survives only by retreating. It applies only when I already trust my future self. But if I already trust him, I don't need the principle to tell me to listen to him. And if I don't trust him, the principle tells me to ignore him. So it's either redundant or irrelevant.

  **Elena:** It's not irrelevant because it catches the cases where you *think* you shouldn't trust him, but you're wrong. It challenges your present arrogance. When you say, "I won't defer because I'll be tired," Reflection asks: "Are you sure tiredness makes you wrong? Or are you just afraid of changing your mind?" It forces you to justify the discount rate you apply to your future self.

  **Marcus:** And my counter is: It forces you to justify *trusting* him. It creates a presumption of authority for a ghost. A future self that doesn't exist yet. Why does he get the benefit of the doubt?

  **Elena:** Because he's you. He has your values, your goals, and—crucially—he has the results. To reject him is to fragment yourself over time. It makes you a series of strangers rather than a single agent. If you can't trust yourself tomorrow, how can you plan for next year?

  **Marcus:** I can plan by expecting myself to be fallible. I trust my *process*, not my *predictions*. I trust that I'll check the voltage, not that I'll guess the load correctly.

  **Elena:** But your confidence levels *are* part of the process. If you systematically overestimate your confidence, your process is broken. Reflection is the mirror that shows you the break.

  **Marcus:** Maybe. But a mirror can distort, too. If I stare at it too long, I start thinking the reflection is real and I'm the illusion. I worry that if I defer to Future Me too much, I stop living in the present. I stop saying "This feels wrong now" because I tell myself "It won't feel wrong later."

  **Elena:** That's the risk. But the alternative is stagnation. Believing that the only truth is what you can hold in your head *right now*, without regard for where that thought leads. That's a small world, Marcus.

  **Marcus:** It's a safe one.

  **Elena:** Is it? Or is it just a comfortable one?

  **Marcus:** *(Closes the notebook)* I don't know. That's the problem. If I knew whether Future Me was wiser or just more tired, I wouldn't need to ask you.

  **Elena:** Exactly. And until you know, you have to decide: do you treat time as a teacher, or as a corruptor?

  **Marcus:** Maybe it's both.

  **Elena:** Then the hard work isn't choosing a principle. It's figuring out which one applies today.

  **Marcus:** *(Picks up his coffee)* Yeah. But I'm not betting on what I'll think about that tomorrow.

  **Elena:** *(Smiles)* See? You're already updating.

  **Marcus:** Or I'm just tired.

  **Elena:** How do you tell the difference?

  **Marcus:** *(Pauses)* I guess I'll write it down and check in six months.

  **Elena:** And then you'll have to decide whether to trust the guy who wrote it.

  **Marcus:** Don't remind me.
