answer: |-
  # Desiderata for an Adequate Solution to the Frege-Geach Problem

  The following specification outlines the requirements for a solution to the Frege-Geach problem that preserves the core insights of expressivism while accounting for the logical and linguistic behavior of moral discourse.

  ## I. Linguistic Phenomena (Embedding and Usage)

  **D1. The Embedding Requirement**
  *   **Specification:** The solution must assign a semantic content or functional role to moral sentences that remains constant whether the sentence is asserted categorically or embedded in unasserted contexts. Specifically, it must account for:
      *   Conditionals (e.g., "If stealing is wrong...")
      *   Negation (e.g., "Stealing is not wrong")
      *   Disjunction (e.g., "Stealing is wrong or lying is wrong")
      *   Questions (e.g., "Is stealing wrong?")
      *   Propositional Attitude Reports (e.g., "Alice believes that stealing is wrong")
  *   **Rationale:** Moral sentences exhibit syntactic compositionality identical to descriptive sentences. If the meaning of "stealing is wrong" changed fundamentally when moved from an assertion to a conditional antecedent, valid inferences involving both would commit the fallacy of equivocation.
  *   **Status:** **Non-negotiable.** Any theory denying this fails to account for the basic data of natural language.

  **D2. The Uniformity Constraint**
  *   **Specification:** The semantic mechanism used to explain moral embedding should, ceteris paribus, align with the semantics of non-moral language. We should not posit a radically distinct logic for moral operators unless forced by the data.
  *   **Rationale:** Positing a sui generis "moral logic" isolates moral discourse from general reasoning, making moral inference inexplicable to agents who understand standard logic. It risks making moral reasoning look like a systematic error.
  *   **Status:** **Non-negotiable** (Methodological). Violating this is an admission of theoretical cost, though not strictly fatal if no other option exists.

  ## II. Inferences and Logic

  **D3. The Validity Requirement**
  *   **Specification:** The solution must validate standard moral inferences (e.g., Modus Ponens: $P$; If $P$ then $Q$; Therefore $Q$) without relying on truth-conditions that imply moral realism (unless adopting quasi-realism). It must explain *why* the inference is valid, not merely stipulate that it is.
  *   **Rationale:** Moral reasoning is pervasive and appears normatively binding. If expressivism renders moral arguments invalid (the "logical problem"), it implies moral agents are systematically irrational when reasoning morally.
  *   **Status:** **Non-negotiable.** A solution that cannot validate Modus Ponens for moral sentences fails as a logic of moral discourse.

  **D4. The Inconsistency Requirement**
  *   **Specification:** The solution must distinguish between *inconsistency* (holding incompatible attitudes) and mere *difference* (holding distinct attitudes). It must explain why accepting "Stealing is wrong" and "Stealing is not wrong" is a mistake of rationality, not just a clash of preferences.
  *   **Rationale:** Moral disagreement involves a claim to correctness. If expressivism reduces disagreement to "Boo!" vs. "Hooray!", it cannot explain the normative force of logical contradiction in ethics.
  *   **Status:** **Non-negotiable.** This is the core of the "Negation Problem" (Schroeder).

  ## III. Distinctions in Mental States

  **D5. The Negation Distinction**
  *   **Specification:** The solution must distinguish between *withholding acceptance* of a moral claim (agnosticism) and *accepting the negation* of a moral claim (denial).
  *   **Rationale:** In standard logic, $\neg P$ is distinct from the absence of belief in $P$. If an expressivist analysis collapses these (e.g., if both are merely the absence of a "Boo!" attitude), it cannot account for the logical behavior of negation.
  *   **Status:** **Non-negotiable.** Failure here renders the logic of moral sentences incoherent.

  **D6. Mental State Specification (No "Black Box" Semantics)**
  *   **Specification:** The solution must identify the specific state of mind expressed by complex moral sentences. It cannot merely assign formal semantic values (e.g., sets of worlds or abstract functions) that make the inferences work; it must say what *attitude* a speaker holds when uttering a conditional moral sentence.
  *   **Rationale:** Expressivism is a thesis about the *psychology* of moral judgment, not just formal semantics. A solution that maps sentences to abstracta without psychological grounding collapses into a form of realism or error theory.
  *   **Status:** **Non-negotiable** (for Expressivism).

  ## IV. Constraints from Adjacent Theory

  **D7. Compositionality**
  *   **Specification:** The content of a complex moral sentence must be determined by the contents of its parts and their mode of combination.
  *   **Rationale:** Language is productive. We understand novel moral sentences we have never heard before. This requires a compositional semantic theory.
  *   **Status:** **Non-negotiable.**

  **D8. Truth-Aptness (The Quasi-Realist Constraint)**
  *   **Specification:** The solution must clarify whether moral sentences are truth-apt.
      *   *Strict Expressivism:* Denies truth-aptness; must explain validity without truth-preservation.
      *   *Quasi-Realism:* Accepts deflationary truth-aptness; explains validity via truth-preservation.
  *   **Rationale:** Standard logic is defined via truth-preservation. If moral sentences aren't truth-apt, the definition of validity must be altered or "earned."
  *   **Status:** **Camp-Specific Commitment.** Strict non-cognitivists reject this; quasi-realists accept a deflationary version. Realists accept a robust version.

  **D9. Motivational Internalism**
  *   **Specification:** The solution should maintain a necessary connection between moral judgment and motivation (or at least a rational requirement for motivation).
  *   **Rationale:** This is the primary motivation for adopting expressivism over realism. If the solution severs the link between judgment and motivation entirely, it loses its explanatory advantage regarding moral action.
  *   **Status:** **Core Expressivist Commitment** (but degree varies). Some hybrid views weaken this to a defeasible tendency.

  ---

  ## V. Analysis of Joint Unsatisfiability

  I suspect the following subset of desiderata is **jointly unsatisfiable** without significant theoretical revision or "creeping minimalism":

  **The Trilemma:**
  1.  **Strict Non-Cognitivism** (Moral sentences express *only* non-cognitive attitudes and are not truth-apt).
  2.  **Classical Validity** (Validity is defined as truth-preservation across standard logical operators).
  3.  **Psychological Transparency** (The semantic value must correspond to a identifiable, distinct mental state for every complex sentence).

  **Why:**
  If moral sentences are not truth-apt (1), they cannot participate in truth-preserving inference (2). To save validity, the expressivist must either redefine validity (e.g., as consistency of attitudes) or argue that moral sentences *are* truth-apt in a deflationary sense (abandoning 1).
  Furthermore, if we demand Psychological Transparency (3), we face the "Negation Problem." It is difficult to identify a distinct non-cognitive attitude corresponding to "If stealing is wrong, then..." that is not simply a cognitive belief about the relationship of attitudes. If the attitude for the conditional is a belief about attitudes, the view risks collapsing into a cognitive theory (Realism) or becoming so complex that it violates the spirit of Expressivism.
  Therefore, a solution usually satisfies (1) and (3) by sacrificing (2) (adopting a non-classical logic), or satisfies (2) and (3) by sacrificing (1) (Quasi-Realism/Hybrid views), or satisfies (1) and (2) by sacrificing (3) (Formalism that lacks psychological grounding).

  ---

  ## VI. Scorecard of Proposed Solutions

  | Family of Solution | Performance on Desiderata | Key Weakness |
  | :--- | :--- | :--- |
  | **Classical Prescriptivism (Hare)** | **Embedding:** Poor. Struggles with conditionals and belief reports. <br> **Validity:** Good (Imperative logic). <br> **Internalism:** Strong. | Fails **D1** and **D6**. Cannot adequately explain the meaning of unasserted moral sentences without collapsing into commands. |
  | **Hyperplan-Based (Gibbard)** | **Embedding:** Good. <br> **Validity:** Good (Consistency of planning). <br> **Inconsistency:** Good. | **D6** Risk. The notion of "accepting a norm" is complex; risks intellectualizing moral judgment beyond recognition. |
  | **Quasi-Realist Projectivism (Blackburn)** | **Embedding:** Good (Earns truth-talk). <br> **Validity:** Good (Deflationary truth). <br> **Uniformity:** Excellent. | **D9** Risk. "Creeping Minimalism." If moral sentences behave exactly like truth-apt descriptions, the distinction from Realism vanishes. |
  | **Single-Attitude Semantics (Schroeder)** | **Embedding:** Good (Technical fix). <br> **Negation:** Good (Solves D5). <br> **Compositionality:** Good. | **D6** Risk. The specific attitude (e.g., "being for") can appear ad hoc or stipulative rather than phenomenologically accurate. |
  | **Hybrid Expressivism** | **Embedding:** Excellent (Cognitive content handles logic). <br> **Validity:** Excellent. <br> **Truth-Aptness:** Yes. | **D9** Risk. By adding cognitive content to handle logic, it weakens the Internalist link that motivated Expressivism initially. |
