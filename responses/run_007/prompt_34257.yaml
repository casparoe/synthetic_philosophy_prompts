      *   *Distinctions:*
          *   *Negation:* Not believing $p$ vs. believing not-$p$. (The "Negation Problem" or "Schroeder's Problem").
          *   *Inconsistency:* Disagreeing with someone vs. just having different tastes. Expressivism needs to capture the *clash* inherent in moral disagreement.
      *   *Constraints:*
          *   *Compositionality:* Meaning of complex sentences must be built from parts.
          *   *Uniformity:* Moral and non-moral language shouldn't work on totally different logical principles (unless necessary).
          *   *Psychological Reality:* It shouldn't just be a formal trick; it must say what mental state is actually involved.
      *   *Status:* Distinguish between what *any* expressivist needs vs. what only *strict* expressivists need (e.g., truth-aptness).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *D1: Embedding.* Must handle conditionals, negation, etc. Rationale: Moral language is used this way. Status: Non-negotiable.
