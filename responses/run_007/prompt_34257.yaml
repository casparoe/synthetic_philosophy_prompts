      *   *Linguistic Phenomena:* Expressivism starts with the idea that moral sentences express non-cognitive attitudes (like "Boo stealing!"). But moral sentences appear in places where we aren't expressing attitudes (e.g., "If stealing is wrong, then..."). A solution must explain how the meaning persists in these embeddings.
