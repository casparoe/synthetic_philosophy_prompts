      *   *D3: The Negation Problem.* Distinguish $A$ doesn't accept $p$ from $A$ accepts not-$p$. Rationale: Logical distinction. Status: Non-negotiable (for a logical solution).
      *   *D4: Disagreement/Inconsistency.* Explain why holding $p$ and not-$p$ is irrational/inconsistent, not just different. Rationale: Normativity of logic/ethics. Status: Non-negotiable.
      *   *D5: Compositionality.* Semantic value of complex sentences derived from parts. Rationale: Productivity of language. Status: Non-negotiable (linguistic constraint).
      *   *D6: Mental State Specification.* Must identify the actual attitude, not just assign values. Rationale: Expressivism is a philosophy of mind/language link. Status: Non-negotiable (for *expressivism* specifically).
      *   *D7: Truth-Aptness.* (Camp specific). Can moral sentences be true? Strict expressivists say no; Quasi-realists say yes (deflationary). Status: Camp-specific.
      *   *D8: Internalism.* (Camp specific). Must moral judgment motivate? Status: Camp-specific.

  4.  **Analyzing Joint Unsatisfiability:**
