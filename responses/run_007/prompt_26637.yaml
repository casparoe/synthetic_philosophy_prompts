      *   **Multiple Selves Model:** The idea that a person isn't a single, static agent but a sequence of temporal selves (Planner vs. Doer).
      *   **Rationality:** In classical economics, preference reversal is irrational. In behavioral economics/philosophy, it's a recognized cognitive bias. Acknowledging it and mitigating it can be seen as *second-order* rationality.
