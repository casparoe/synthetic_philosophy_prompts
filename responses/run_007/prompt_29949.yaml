answer: |-
  Use this hour-long audit to reject explanations that smuggle in complexity as skyhooks or erase it via greedy reductionism, while accepting legitimate mechanistic cranes even when their details remain under construction.

  ### The Dennettian Audit Procedure

  **Time Allocation:** 60 minutes total.
  **Objective:** Categorise the central claim as Legitimate Crane, Skyhook, Greedy Reductionism, or Crane-under-Construction.

  #### Phase 1: Extraction (10 minutes)
  Read the proposal and sample chapters to isolate the *Explanandum* (what is being explained) and the *Explanans* (the thing doing the explaining).
  *   **Action:** Write down one sentence for each.
  *   **Sufficient Answer:** 'The manuscript explains [Explanandum] using [Explanans].'
  *   **Judgement Call Alert:** *You are deciding what the 'central claim' actually is, which authors often obscure with qualifying clauses. If you extract the wrong claim, the audit fails.*

  #### Phase 2: The Skyhook Test (15 minutes)
  Ask: Does the *Explanans* possess the very complexity, intelligence, or design it is supposed to generate in the *Explanandum*, without explaining how the *Explanans* acquired those traits?
  *   **Question 1:** Is the explaining mechanism itself unexplained complexity? (e.g., explaining design with a designer).
  *   **Question 2:** Does the text use metaphors of agency, purpose, or information processing without defining the physical substrate that carries them?
  *   **Sufficient Answer for Crane:** The mechanism is simpler than the outcome (e.g., natural selection explaining design).
  *   **Sufficient Answer for Skyhook:** The mechanism is as complex as the outcome (e.g., consciousness explaining consciousness).
  *   **Stop Rule:** If 'Yes' to Question 1 or 2 without adequate physical grounding, categorise as **Skyhook** and **Decline**.
  *   **Judgement Call Alert:** *Distinguishing a useful metaphor from a substantive skyhook requires intuition. You are judging whether the author knows it is a metaphor.*

  #### Phase 3: The Greedy Reductionism Test (15 minutes)
  Ask: Does the explanation skip intermediate levels of organisation, thereby explaining away the phenomenon rather than accounting for it?
  *   **Question 1:** Are there recognized intermediate levels (e.g., psychology between biology and culture) that are ignored?
  *   **Question 2:** Does the author claim the higher-level phenomenon is 'nothing but' the lower-level process, rather than 'composed of' it?
  *   **Sufficient Answer for Legitimate Reduction:** The text acknowledges higher-level patterns are real and emergent, even if grounded in lower levels.
  *   **Sufficient Answer for Greedy Reductionism:** The text denies the reality or causal power of the higher level.
  *   **Stop Rule:** If 'Yes' to Question 2, categorise as **Greedy Reductionism** and **Decline**.
  *   **Judgement Call Alert:** *You are deciding which levels of organisation are 'real' enough to require accounting. This is ontological prejudice disguised as methodological rigour.*

  #### Phase 4: The Crane-under-Construction Test (15 minutes)
  If the mechanism is bottom-up (not a Skyhook) but lacks detailed pathways (potential Greedy Reductionism), ask: Is the gap bridgeable by known physics/biology, or does it require a miracle?
  *   **Question 1:** Are the missing steps plausible extensions of current science, or do they require new laws of nature?
  *   **Question 2:** Does the author acknowledge the gap as a problem to be solved (promissory note) or treat it as solved?
  *   **Sufficient Answer for Crane-under-Construction:** The gaps are acknowledged, and the proposed bridges are consistent with established science.
  *   **Sufficient Answer for Skyhook (disguised):** The gaps are filled with hand-waving or mystical concepts.
  *   **Stop Rule:** If bridges are plausible, categorise as **Crane-under-Construction**. If bridges are magical, revert to **Skyhook**.
  *   **Judgement Call Alert:** *You are assessing 'plausibility' based on your general scientific literacy, not expert review. This is where you might reject a revolutionary truth because it sounds too strange.*

  #### Phase 5: Decision and Escalation (5 minutes)
  *   **Legitimate Crane:** **Accept** (proceed to acquisitions).
  *   **Crane-under-Construction:** **Accept** (if author is credible) or **Escalate** (if high risk).
  *   **Skyhook / Greedy Reductionism:** **Decline**.
  *   **Escalation Protocol:** You may only escalate if the manuscript passes Phase 2 and 3 but fails Phase 4 (i.e., it looks like a Crane but the physics/biology is beyond your ken). This counts towards your 1-in-10 limit.
  *   **Judgement Call Alert:** *Deciding whether a risk is 'commercially viable' despite scientific ambiguity is a business judgement, not a philosophical one.*

  ---

  ### Application to Cases

  **Case 1: The Physicist's Information Manuscript**
  *   **Phase 1:** *Explanandum:* Life, mind, society. *Explanans:* Information as a fundamental feature organising matter.
  *   **Phase 2 (Skyhook Test):** Risk is high. If 'information' is treated as a physical force without a clear substrate (energy/matter), it is a Skyhook. Does information organise matter, or do physical processes instantiate information? If the former, it imports 'organisation' without explaining its origin.
  *   **Phase 3 (Greedy Test):** Not obviously greedy; it attempts to build up, not reduce away.
  *   **Phase 4 (Construction):** Are the steps from 'information' to 'society' detailed? Usually, in such bestsellers, they are not. They are often asserted.
  *   **Verdict:** **Crane-under-Construction bordering on Skyhook.**
  *   **Action:** **Escalate.** This uses your 1-in-10 token. The distinction between 'information is physical' (Crane) and 'information is a mystical organiser' (Skyhook) requires a expert physicist/philosopher of physics. Do not sign based on commercial pressure alone; if it is a Skyhook, it will embarrass the list.

  **Case 2: Inclusive-Fitness Culture**
  *   **Phase 1:** *Explanandum:* Human culture (art, religion, law). *Explanans:* Inclusive-fitness maximisation.
  *   **Phase 2 (Skyhook Test):** Passes. Fitness is a mechanistic concept.
  *   **Phase 3 (Greedy Test):** Fails. The manuscript offers 'no account of intermediate social, cognitive, and historical mechanisms.' It claims culture is the *direct* expression of fitness. This skips psychology, sociology, and history. It explains away the complexity of culture rather than building it.
  *   **Verdict:** **Greedy Reductionism.**
  *   **Action:** **Decline.** It violates the requirement to account for higher-level regularities. It is scientificallyembarrassing because it ignores decades of work in cultural evolution and psychology.

  **Case 3: Evolutionary Morality**
  *   **Phase 1:** *Explanandum:* Moral emotions and punishment. *Explanans:* Iterated interactions, reputation, costly signalling.
  *   **Phase 2 (Skyhook Test):** Passes. No moral truth is imported to explain morality; mechanisms are bottom-up.
  *   **Phase 3 (Greedy Test):** Passes. It accounts for the phenomena (cooperation problems) without denying the reality of the emotions, merely explaining their origin.
  *   **Phase 4 (Construction):** Passes. These are established models in evolutionary game theory.
  *   **Verdict:** **Legitimate Crane.**
  *   **Action:** **Accept.** Your personal dislike is irrelevant to the explanatory structure. The procedure identifies this as sound science, even if the philosophical implications (morality is not 'true') are uncomfortable.

  ---

  ### Limitations of the Procedure

  This procedure cannot determine whether a manuscript is **true**. A Skyhook can be accidentally correct in its predictions while being explanatorily void; a Legitimate Crane can be meticulously structured yet empirically false. The audit tests the *structure of explanation*, not the *facts of the world*.

  Secondly, it cannot account for **market viability** independent of scientific rigour. Case 1 might sell brilliantly despite being a Skyhook; the procedure advises escalation or decline, which may conflict with commercial targets. You must weigh the reputational risk against the revenue potential outside this audit.

  Thirdly, it cannot resolve **value conflicts** like those in Case 3. The procedure identifies the explanation as valid, but it cannot tell you if publishing a book that undermines moral realism aligns with your publisher's brand ethics or your personal conscience. That remains a human decision masked as an acquisitions meeting vote.

  Finally, the procedure relies on your **implicit knowledge** of what counts as a 'recognized intermediate level' (Phase 3). If your own understanding of science is outdated, you may misclassify a legitimate new reduction as greedy, or miss a Skyhook because the terminology sounds modern. The audit is only as good as the editor's baseline literacy.
