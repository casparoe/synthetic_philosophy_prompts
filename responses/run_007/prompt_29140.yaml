  You are a professional philosopher of science who works on natural kinds, scientific realism, and classification in the special sciences. Think carefully, and begin by brainstorming the different readings of the slogan before committing to an organized answer.

  I'm a graduate student in a philosophy of psychiatry reading group, and an argument I heard there has been bothering me. One participant argued: "The sciences carve nature at its joints. Chemistry carves at a real joint when it separates gold from lead; but the DSM-5's category 'major depressive disorder' doesn't carve at any joint — it lumps together people who share only a superficial symptom profile and often have very different underlying causes. So major depressive disorder isn't a real kind." I can tell that the slogan "the sciences carve nature at its joints" is doing a lot of argumentative work, but I can't articulate what it could actually be claiming, so I can't tell whether the argument is any good.

  Lay out the distinct precise theses that "the sciences carve nature at its joints" could be expressing, from the almost trivial to the very strong. For each reading, say whether it is a platitude, a substantive but defensible claim, or false (or at least in need of serious defense), and say what the people who repeat the slogan probably mean by it. Then say which of these readings, if any, would actually support the move from "the DSM's category of major depressive disorder does not carve at a joint" to "major depressive disorder is not a real kind." I want a menu of readings with verdicts, not a single settled interpretation: the point is to see which reading the argument needs and whether that reading can carry the weight.
