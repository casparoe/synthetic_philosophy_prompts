  I'm taking a course called "The Ethics of Quantification" that examines how metrics and numerical targets reshape the institutions they're supposed to serve, and in last week's seminar someone invoked Goodhart's law to shut down a discussion about whether GDP per capita is a defensible proxy for national well-being. The line they kept repeating was "When a measure becomes a target, it ceases to be a good measure." They said it as though it were self-evident and settled the matter — that once governments start explicitly aiming to raise GDP, GDP stops telling us anything useful about welfare. But I've seen versions of this slogan used in radically different contexts: to criticize standardized testing in schools, to argue against setting numerical arrest quotas for police departments, to explain why search engine optimization degrades search results, and in AI alignment discussions about reward hacking. It can't possibly mean exactly the same thing in all of those cases, and I'm not convinced it's always true.

  I want to go back to that seminar with a clearer sense of what I'm even disagreeing with. Can you take that one sentence — "When a measure becomes a target, it ceases to be a good measure" — and lay out the distinct precise claims it could be making? For each reading, tell me whether it's a trivial observation, a substantive and defensible empirical claim, or something that's probably false, and say which reading actually does the work in the GDP-versus-welfare argument my classmate was making. I'd like the bottom line up front in the first sentence, then the reasoning, with no preamble and no restating of the question.
