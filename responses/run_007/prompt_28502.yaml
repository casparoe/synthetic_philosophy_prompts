answer: |-
  Bottom line: You are largely correct. The stagnation stems from a category error wherein proponents treat a multi-layered cognitive phenomenon as a single-variable dispute about the semantics of 'intentionally'. The effect is robust, but the theoretical landscape is suffering from equifinality: distinct models (blame, norms, deep self) predict the same vignette outcomes. Progress will not come from further survey studies but from process-tracing data, formal cognitive modelling, or a conceptual dissolution that accepts folk intentionality as a hybrid construct serving moral evaluation rather than metaphysical description.

  Reasoning

  Your 'three debates in one trenchcoat' hypothesis accurately diagnoses the impasse. The literature has fractured because participants are answering different questions while pretending to address the same one.

  First, there is the semantic debate. Early experimental philosophy assumed folk concepts were stable and unitary. Knobe's later work suggests moral considerations penetrate the concept itself. However, pragmatic accounts (e.g., Adams and Steadman) argue the concept remains stable, but its application is guided by conversational norms. Vignette studies cannot distinguish between a shift in meaning and a shift in usage. Unless researchers measure processing time, neural activation, or use forced-choice paradigms that separate semantic commitment from pragmatic appropriateness, this thread will remain tangled.

  Second, there is the psychological debate regarding blame. Alicke's culpable control model and others posit that intentionality is a post-hoc rationalisation for blame assignments. Conversely, norm-violation accounts (e.g., Guglielmo and Malle) suggest it is about deviation from expected behaviour, not necessarily moral blame. The problem is that in standard vignettes, moral badness, norm violation, and blame are perfectly confounded. Without decoupling these variables—perhaps through scenarios involving non-moral norm violations or neutral side effects with varying valence—the data will continue to support whichever theory the interpreter favours.

  Third, there is the methodological debate about experimental philosophy's purpose. If the goal is to inform metaphysics, the Knobe effect suggests folk intuitions are unreliable guides to the nature of intention. If the goal is moral psychology, the effect is a goldmine regarding how we assign responsibility. The field has struggled to decide whether it is doing conceptual analysis or empirical psychology. This ambiguity allows theorists to retreat to comfortable positions when counter-evidence arises.

  Regarding progress, accumulating more vignette variations is diminishing returns. We have reached a ceiling where competing theories are flexible enough to accommodate new data points ad hoc. Genuine progress requires one of three shifts:

  1.  **Process Data:** Move beyond output (the judgment) to input and processing (reaction times, eye-tracking, fMRI). If blame drives intentionality, neural markers of affective processing should precede those of cognitive attribution.
  2.  **Formal Modelling:** Construct computational models of the competing accounts. If the 'norm violation' model cannot quantitatively predict the magnitude of the asymmetry as well as the 'blame' model across diverse datasets, one may be falsified.
  3.  **Conceptual Dissolution:** Accept that 'intentionality' in folk psychology is not a natural kind waiting to be defined. It is a functional tool for social regulation. The question then shifts from 'what does intentionally mean?' to 'what work does this attribution do in social coordination?'

  Until the field abandons the quest for a single, unified theory of the word and focuses on the underlying cognitive architecture, the debate will remain a stalemate of mutually unintelligible frameworks. You are right to suspect the trenchcoat is hiding multiple bodies.
