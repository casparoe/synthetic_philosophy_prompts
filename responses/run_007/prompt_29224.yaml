answer: |-
  TO: Diagnostic Standards Committee
  FROM: [Your Name/Role]
  DATE: 24 May 2024
  SUBJECT: Recommendation on Proposed Diagnostic Code for Subthreshold Autism

  I recommend that the Committee adopt the new diagnostic code for 'subthreshold autism', subject to a three-year review period and specific clinical safeguards.

  The primary justification for this adoption is equitable access to support. Under current criteria, children with marked social-communication difficulties and restricted interests who fall just short of the autism threshold are effectively invisible to funding streams. This creates a perverse incentive where clinicians must exaggerate symptoms to secure necessary educational and therapeutic resources. By codifying this presentation, we align the diagnostic framework with the lived reality of need, ensuring that support is triggered by functional impairment rather than arbitrary cut-off points.

  However, we must engage seriously with the strongest argument against adoption: that this risks diagnostic inflation and the medicalisation of normal variation. Colleagues opposing this code rightly worry that expanding the spectrum dilutes the specificity of autism and strains already limited services. There is a valid concern that we are lowering the bar not because the science demands it, but because the funding model requires it. If we adopt this code solely as a key to unlock resources, we risk undermining the integrity of the classification system itself.

  Furthermore, we must account for the phenomenon Ian Hacking described as the 'looping effect'. Diagnostic categories are not merely descriptive; they are interactive kinds that change the people they classify. I have observed firsthand how a provisional label can reorganise the language parents and schools use to discuss a child, shifting focus from 'support needs' to 'deficit'. There is a risk that this new code does not simply describe a population but helps to create it, potentially limiting a child's future opportunities by cementing a subthreshold identity that becomes a ceiling rather than a floor.

  To mitigate these risks, adoption must be conditional on the following safeguards:

  1.  **Time-Limited Review:** The code will be classified as provisional for three years. We will commission an independent evaluation to assess whether the code has improved outcomes or merely expanded prevalence without benefit.
  2.  **Needs-Led Framing:** Clinical guidance must emphasise that the code describes a profile of support needs, not a permanent identity. Training materials for clinicians should explicitly address the looping effect, encouraging language that focuses on environmental adjustments rather than intrinsic deficits.
  3.  **Functional Criteria:** Eligibility for funding must remain tied to functional impairment in specific settings (home, school, community) rather than the presence of traits alone.

  This approach allows us to help vulnerable children now while maintaining the rigour to correct course if the unintended consequences of labeling outweigh the benefits. We have a duty to provide support without predetermining destiny.

  **Declaration of Interest:** I have a family member recently assessed under this provisional description; however, I believe this insight informs rather than biases the recommendation regarding the looping effects of classification.
