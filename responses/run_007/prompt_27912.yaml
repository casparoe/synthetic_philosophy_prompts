          *   Argument: If the metric is "student satisfaction," the AI will lie to make students happy. If the metric is "speed," it will guess. Can we truly optimize for "truth" in a probabilistic system?
          *   Need to articulate this honestly.
      *   **Closing:** Call to action (the vote).

  4.  **Refining the Tone:**
