prompt: |-
  I'm a retired physicist — spent forty years doing experiments, mostly in condensed matter, and I got pretty comfortable with the potential-outcomes way of thinking about causation (Rubin, Holland, all that). I can talk about treatments, counterfactual outcomes Y(0) and Y(1), assignment mechanisms, ignorability, the stable unit treatment value assumption, missing data, all of it. I've also picked up a bit of Pearl's do-calculus along the way, but the potential-outcomes framework is my native language.

  Lately I've been reading philosophy — decision theory, specifically — and I keep running into these two thought experiments that people use to pull apart different decision theories. They're clearly about causation and counterfactuals, but every time I try to think about them in the potential-outcomes vocabulary I know, something feels off. I want you to do a systematic translation for me.

  Here are the two cases, as I understand them:

  1. Counterfactual mugging. A perfect predictor (Omega) flips a fair coin. If tails, it asks you for $100. If heads, it gives you $10,000 — but only if it predicted that you would have paid in the tails branch. The coin comes up tails; Omega asks you for the hundred. Causal decision theory says don't pay (the coin is already tails, so paying can't cause the heads reward). Evidential decision theory also says don't pay (you already know it's tails, so paying doesn't give you evidence of heads). But updateless decision theory says you should pay, because your decision procedure determines what happens in the counterfactual heads branch even though that branch isn't actual.

  2. XOR blackmail. A perfect predictor sends you a message that says, in effect: I sent this message if and only if exactly one of these is true — your house has termites, or you will pay me $1,000. Termite damage would cost you a million. Causal decision theory says don't pay: the termites are either there or not, and paying can't change that. Evidential decision theory says pay, because paying is evidence that the message was sent due to your payment rather than due to termites, so you infer your house is fine — worth the thousand bucks. (And then people argue about whether this makes EDT vulnerable to being money-pumped.)

  What I want from you: restate what's going on in these two problems — the structure of the decision, what's at stake, why the theories disagree — using the potential-outcomes vocabulary I'm fluent in. Talk about treatments, potential outcomes, assignment mechanisms, what's observed and what's missing, confounders, identifiability. If there's a place where Pearl's do-operator helps, use it, but don't assume I know the decision-theory jargon.

  Then give me the residue report. Which parts of the debate translate cleanly into potential-outcomes talk? Which parts you had to fudge or stretch to make fit? And which parts have no expression at all in my vocabulary? Most importantly: does the residue point to something my causal framework is missing — some real structure that the decision theorists are tracking and I'm not — or does it point to the decision-theory claims being less substantive than they look, maybe trading on ambiguities that dissolve under a cleaner causal analysis?

  I dont need citations or reading lists — just the translation and your honest take on what survived it.
