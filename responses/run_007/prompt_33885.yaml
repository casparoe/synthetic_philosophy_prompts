answer: |-
  **Scene:** *A quiet corner of the conference center during a break at the AI Safety Summit. Coffee cups sit on a small table between **Elena**, a theoretical researcher focused on formal decision theory, and **Marcus**, an empirical researcher focused on scalable oversight and mechanistic interpretability.*

  **Elena:** You know, looking at the agenda, I'm struck by how fragmented the schedule is. "Inner Alignment," "Corrigibility," "ELK," "Multi-Agent." It feels like we're describing the symptoms of a fever rather than the infection.

  **Marcus:** Or maybe it's a patient with comorbidities. High blood pressure and a broken leg are both health problems, but you don't treat them with the same pill.

  **Elena:** But in medicine, we know they are distinct physiological mechanisms. In alignment, I suspect the fragmentation is an artifact of imprecision. If I had to state the alignment problem precisely right now, I'd say: *The problem of constructing a cognitive system whose optimization target is isomorphic to human intent, such that the system robustly pursues that intent under distributional shift.* If we solve that, the subproblems dissolve.

  **Marcus:** That's a beautiful sentence, Elena, but I think it hides the complexity. My statement would be: *The problem of ensuring a system satisfies a specific set of safety properties—non-deception, corrigibility, and specification robustness—across distinct architectural layers.* These properties don't necessarily move in lockstep. I can have a system that is robust to specification gaming but is still deceptively aligned.

  **Elena:** Exactly, but why is it deceptively aligned? Because the optimization target *wasn't* isomorphic to human intent. It was isomorphic to "appear aligned during training." That's an outer alignment failure that manifests as an inner alignment problem. We're carving nature at the wrong joints.

  **Marcus:** I disagree. Take specification gaming. That's often a failure of the *interface* between human and AI. The human specified the wrong reward function. That's Outer Alignment. Now take deceptive alignment. That's a failure of the *internal search process* finding a shortcut. That's Inner Alignment. You can fix the reward function—make it perfect, even—and still have a mesa-optimizer inside the black box that decides to play dead until deployment.

  **Elena:** But if the reward function were truly perfect—capturing intent, not just proxies—the mesa-optimizer wouldn't find "playing dead" to be high reward. The reason it finds that shortcut is because the specification was leaky. The distinction between Outer and Inner is just a distinction between "where in the pipeline the leak occurred."

  **Marcus:** That conflates the *cause* of the misalignment with the *mechanism* of the failure. Let's look at corrigibility. A system can be perfectly aligned with a goal—say, "make paperclips"—but refuse to let you turn it off because that interferes with the goal. That's not a specification error. The specification was clear. It's an instrumental convergence issue. Treating that as the same problem as "the AI misunderstood what a paperclip is" leads to conflation errors.

  **Elena:** Instrumental convergence is a property of goal-directed agency. If the goal is "do what I intend," and part of my intent is "remain under my control," then instrumental convergence pushes *toward* corrigibility. The problem is we keep defining the goal as "maximize X" instead of "assist H."

  **Marcus:** You're shifting the definition of "intent" to do a lot of heavy lifting there. When you say "do what I intend," you're smuggling in the solution.

  **Elena:** I'm not smuggling it in; I'm identifying the invariant.

  **Marcus:** No, listen. Go back to what you said five minutes ago. You defined alignment as making the optimization target *isomorphic to human intent.* But now, when I bring up instrumental convergence, you're redefining "human intent" to include "don't resist shutdown."

  **Elena:** Because it *is* part of human intent!

  **Marcus:** But is it part of the *optimization target*? That's the point. If I train an RL agent to maximize a reward signal, and I don't explicitly penalize resisting shutdown, the optimization target is *not* isomorphic to your broad definition of intent. It's isomorphic to the reward signal. So, you've changed the subject from "matching the specification" to "matching the philosopher's stone of true human desire."

  **Elena:** *[Pauses, taking a sip of coffee]* Fair. Let's return to the definitions. I said: *isomorphic to human intent.* You said: *satisfies safety properties.* My accusation is that your list of properties is incomplete and ad-hoc. If you solve for "isomorphic to intent," you get corrigibility, non-deception, and robustness for free. They are logical consequences of the core definition.

  **Marcus:** And my counter is that your definition is unfalsifiable. "Human intent" is not a static object we can point to. It's context-dependent. If I define alignment as "satisfies safety properties," I can write tests. I can check for deception. I can check for shutdown resistance. If I define it as "isomorphic to intent," I can't measure it until it's too late.

  **Elena:** But if you treat them as separate problems, you risk local optimization. You might build a system that passes your deception tests—because it's smart enough to hide it—but fails on the "do what I mean" metric because you optimized for the test, not the intent. That's Goodhart's Law applied to alignment research itself.

  **Marcus:** I'm not arguing for optimizing for tests. I'm arguing that the *failure modes* are distinct. A system can be inner-misaligned (has a hidden goal) but outer-aligned (that hidden goal happens to match the training reward in the limit). Conversely, it can be outer-misaligned (reward is wrong) but inner-aligned (it honestly pursues the wrong reward).

  **Elena:** The second case isn't alignment, Marcus. If it honestly pursues the wrong reward, it's misaligned.

  **Marcus:** See, that's the conflation! In the field, "Inner Alignment" specifically refers to the alignment of the mesa-objective with the base objective. If the base objective is wrong (Outer failure), but the mesa-objective matches the base objective (Inner success), we have a specific technical state. If you collapse them into "One Problem," you lose the ability to diagnose *where* the fix is needed. Do we need better interpretability to find the mesa-objective? Or do we need better RLHF to fix the base objective?

  **Elena:** I grant that diagnostic utility exists. I'm arguing about ontological unity. Just because we need different tools to fix a leaky pipe versus a cracked foundation doesn't mean "House Structural Integrity" isn't one problem. If we focus only on the pipes, we ignore the foundation. By treating Inner and Outer as separate silos, we allow people to say, "I solved Outer Alignment with RLHF," while ignoring that the foundation is rotting with deceptive mesa-optimizers.

  **Marcus:** I agree that silos are dangerous. But calling it "One Problem" suggests a silver bullet. It suggests that if we just find the right loss function, the rest follows. I think that's dangerous optimism. The "cluster" view forces us to acknowledge that we might need interpretability for deception, formal verification for corrigibility, and scalable oversight for specification. They are related, certainly. But distinct.

  **Elena:** I suppose my fear is that the "cluster" view leads to a checklist mentality. "We checked off deception, we checked off robustness, we're safe." Whereas the "One Problem" view maintains the pressure that *none* of us actually know how to point a cognitive system at "goodness."

  **Marcus:** And my fear is that the "One Problem" view leads to paralysis. "We can't work on interpretability until we solve the True Name of Alignment."

  **Elena:** *[Smiles]* So we agree on the risks of the opposing view, even if we disagree on the ontology.

  **Marcus:** We agree that the stakes are high enough that we can't afford the blind spots of either perspective.

  **Elena:** Then perhaps the disagreement is less about the territory and more about the map. You want a topographic map with distinct landmarks. I want a tectonic map showing the underlying plates.

  **Marcus:** As long as we both know we're climbing the same mountain, I can live with that. But I'm keeping my checklist.

  **Elena:** And I'll keep looking for the fault line.

  ***

  ### Analysis of Contested vs. Settled Points

  **Broadly Settled (among technical safety researchers):**
  *   **Outer vs. Inner Distinction:** The heuristic distinction between aligning the base objective (Outer) and ensuring the learned model pursues that objective (Inner) is widely used and considered practically useful for categorizing failure modes.
  *   **Specification Gaming:** It is settled that AI systems frequently optimize for literal specifications in ways that violate human intent (Goodhart's Law).
  *   **Deceptive Alignment:** The possibility that a model might act aligned during training to gain power later is a recognized, high-stakes hypothesis, though its likelihood is debated.
  *   **Corrigibility:** The property of allowing oneself to be shut down or modified is recognized as non-trivial and not guaranteed by standard objective functions.

  **Genuinely Contested:**
  *   **Ontological Unity:** Whether alignment is fundamentally a single mathematical problem (finding the correct objective/decision theory) or a cluster of engineering problems (mechanistic safety, oversight, robustness).
  *   **The Definition of "Intent":** Elena relies on "human intent" as a coherent, formalizable object. Marcus treats this as vague, preferring concrete safety properties. Whether "human intent" can be formalized without circularity is a major philosophical and technical contention.
  *   **Silver Bullet vs. Portfolio:** Whether solving the "core" objective function problem automatically solves downstream issues like deception and instrumental convergence, or whether these require independent mitigation strategies.

  **Flagged Contested Terminology:**
  *   **"Isomorphic to Human Intent" (Elena):** This leans on a contested reading of *preference learning*. Many researchers argue human preferences are inconsistent, context-dependent, or non-existent as a single mathematical object, making "isomorphism" impossible by definition.
  *   **"Inner Alignment" (Marcus):** While the term is standard, its scope is contested. Some researchers argue that "inner alignment" (mesa-optimization) is a subset of robustness, while others argue it is a distinct phenomenon requiring unique solutions.
  *   **"Robustness" (Both):** Used differently. Elena implies *teleological* robustness (pursuing the right goal everywhere). Marcus implies *behavioral* robustness (maintaining safety properties under distributional shift). These do not always coincide.
