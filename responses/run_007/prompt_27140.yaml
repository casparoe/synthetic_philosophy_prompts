      *   *Tone:* Keep it analytical but engaging. Use American English spelling (e.g., *defense*, *program*).
      *   *Nuance:* Make sure not to say Parfit *supports* nuclear war. He uses the hitchhiker to discuss morality and rationality. The application to nuclear war is the user's prompt, so I must bridge that carefully. Parfit is interested in *why* we bind ourselves. Strangelove is interested in *winning* (or not losing).

