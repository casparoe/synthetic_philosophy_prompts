prompt: |-
  Ok here's the thing. I'm a data scientist — I live in DAGs, backdoor paths, selection bias, identifiability — and I have basically no formal philosophy. I've been trying to read up on the evolutionary debunking argument in metaethics, and its honestly starting to sound to me like a fight about whether the truth of our moral beliefs is d-separated from those beliefs. The rough shape as I understand it: the debunker says natural selection shaped our moral beliefs for reproductive fitness, not for tracking moral facts, so any correlation between what we believe and what's actually right is a selection effect, not evidence of tracking. The realist answers that a third factor could do the work — the same thing that made the belief fitness-enhancing also made it true — so reliability doesn't require a direct tracking relation. Somewhere in there is also the Darwinian dilemma for realists, the distinction between the adaptive link account and the tracking account, and the worry that debunking overgeneralises to all our beliefs, including the belief in evolution itself.

  Act as someone who is genuinely expert in both metaethics and causal modeling. I want a systematic translation, not an analogy: take the debunker's argument, the tracking account, the adaptive link account, the third-factor replies, and the overgeneralization worry, and restate each one in the language of DAGs, confounders, instruments, estimands and identification as faithfully as you can. If you had to actually write the causal model down, what are the nodes, what are the edges, what's the treatment and what's the outcome, where are the backdoor paths, and what estimand would even correspond to "our moral beliefs track moral facts"? Then give me the residue report: which moves translate cleanly, which ones you had to fudge, and which have no counterpart in the causal-inference vocabulary at all — I'm already suspicious that "justification" and "moral truth standing outside the causal order" are going to be problems. And say what you think the residue shows: is my vocabulary just too impoverished to say what the philosophers are saying, or is part of their disagreement less substantive than it sounds once you strip the rhetoric and draw the graph? Be explicit about every place you're imposing a causal structure that the original arguments didn't commit to; I don't want you smuggling in assumptions and calling it translation. Start with a short brainstorm about what the nodes and causal ordering would have to be before you commit to a graph.
