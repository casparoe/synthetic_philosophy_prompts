      *   *Addressing Case 6 (The Chair):* This is likely a mix of economic value (provenance) and aesthetic/historical value. If viewed as a functional object, it's fine. If viewed as a historical artifact, the lie breaks the historical witness.

  6.  **Review and Refine Verdicts:**
      *   *Case 1 (Vermeer):* Keep. (Forgery breaks historical witness).
