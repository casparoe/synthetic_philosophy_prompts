  5.  **Develop the Unifying Principle:**
      *   The principle should revolve around **Ontological Category** (Artifact vs. Instance) and **Historical Provenance**.
      *   *Proposed Principle:* **The "Historical-Generative" Principle.**
          *   For *singular artifacts* (paintings, unique vases, buildings), aesthetic value is tied to the specific history of their creation (the specific act by the specific agent at the specific time). Breaking this chain (forgery, reconstruction) diminishes value because the object is no longer a witness to that specific historical moment.
          *   For *multiple-instance works* (music, literature, digital files), the work is defined by a structure (score, code, text). Any instance that correctly instantiates that structure carries the full aesthetic weight. The history of *this specific file* matters less than the history of the *work's structure*.
