  4.  **Evaluate Potential Principles:**
      *   *Theory A: Scarcity.* (Originals are rare). Doesn't explain why the *experience* is diminished in Case 1, only the price. User specifically said "experience of looking at it is genuinely diminished."
      *   *Theory B: Nelson Goodman's Autographic vs. Allographic.*
          *   Autographic: History of production matters (Painting, Sculpture). Forgery is possible.
          *   Allographic: Notation defines the work (Music, Literature, Digital). Forgery is impossible (if it matches the notation).
          *   *Fit:* Explains Cases 1, 3, 4 well.
          *   *Problem:* Case 2 (Vase) and Case 5 (House). A vase is usually autographic. Why is the assistant okay? A house is autographic. Why is the rebuild bad? (Goodman fits here).
      *   *Theory C: Walter Benjamin's "Aura".* The unique presence in time and space.
