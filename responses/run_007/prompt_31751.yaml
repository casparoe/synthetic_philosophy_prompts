      *   *Case 3 (Digital Photo):* Verdict = No aesthetic inferiority. Reason = Bit-for-bit identical. (Aligns with "allographic" art or digital ontology).
      *   *Case 4 (Beethoven Performance):* Verdict = Performance value lies in interpretation, not composer presence. (Music is allographic; the score is the work, not the manuscript).
      *   *Case 5 (Rebuilt House):* Verdict = Replica, not the same experience. Something lost. (Historical continuity matters for architecture/artifacts).
      *   *Case 6 (Antique Chair):* Verdict = Uncertain. Is it value or deceit? (Functional object vs. art object; provenance vs. utility).

  3.  **Identify the Tension/Problem:**
