      *   *Theory E: Historical Continuity/Causal Chain.* (Levinson, Danto). The object must stand in the right causal relation to the artist's act.
          *   *Fit:* Explains Case 1 (Broken chain), Case 5 (Broken chain), Case 3 (Digital allows perfect causal replication without loss).
