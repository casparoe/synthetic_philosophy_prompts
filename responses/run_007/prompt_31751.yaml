      *   *Key Philosophical References (implicit or explicit):* Goodman (Autographic/Allographic), Benjamin (Aura), Levinson (Historical Definition of Art). I will lean on Goodman's distinction but refine it with the "Historical Witness" concept to handle the Vase case better.

  9.  **Self-Correction/Refinement during drafting:**
