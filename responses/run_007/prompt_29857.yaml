answer: |-
  It is entirely understandable that you find this passage challenging. It contains one of the most famous and frequently debated formulations in the history of ethics, often referred to as the 'Doctrine of Double Effect'. The tension you identify—between causing death lawfully without intending it, versus the public authority's licence to intend death—is the precise hinge upon which Aquinas's argument turns.

  To assist you, I shall break this down into three parts: the distinction between intention and foresight, the distinction between private and public authority, and the interaction between proportion and intention. I shall conclude with a concrete case study to illustrate how these principles apply in practice.

  ### 1. Intention versus Foresight

  Your primary difficulty lies here: *'If I strike an assailant with a weapon I know is likely to kill him... in what sense is his death not intended?'*

  For Aquinas, 'intention' is not merely about what you foresee or expect to happen. It refers to the **object of the will**. It is what you are aiming at as your end, or what you are choosing as a means to that end.

  *   **The Private Person:** Your end is self-preservation. The means you choose is 'stopping the attack'. If the aggressor dies, this is a foreseen consequence, but it is not part of your plan. You do not need him dead to be safe; you need him *incapacitated* or *driven off*.
      *   *The Test:* If, by some miracle, the aggressor were rendered unconscious without dying the moment you struck him, would you be satisfied? If the answer is 'yes', then you did not intend his death. You intended to stop the threat; death was a side-effect (*praeter intentionem*).
      *   *Hope:* It is not necessary that you positively *hope* he survives in an emotional sense (you may be terrified and angry). Rather, your will must not *choose* his death as a good to be achieved. You must be prepared to stop the violence the moment the threat is neutralised. If you continue to strike after he is incapacitated, your intention shifts from defence to killing.

  *   **The Soldier or Judge's Officer:** Their end is the protection of the common good (the state or the legal order). In this context, the death of the enemy or the resisting criminal can be chosen as a **means** to that end. The soldier does not merely seek to incapacitate the enemy combatant; he seeks to eliminate the threat the combatant poses to the state, which often entails killing. Because he acts under public authority, he is permitted to make the death itself part of his intentional plan.

  Therefore, the difference is not necessarily in the physical act (both may fire a gun), nor even in the foresight (both know death is likely). The difference lies in the **structure of the choice**. The private citizen chooses 'stopping force'; the public agent chooses 'eliminating the threat', which includes the authority to intend death.

  ### 2. Private versus Public Authority

  You ask how a private person's state of mind is meant to differ from a soldier's. Aquinas's reasoning here is political and theological, not merely psychological.

  For Aquinas, human life is sacred and belongs to God. Consequently, no private individual has dominion over another's life to take it intentionally, even in self-defence. A private person acts for a **private good** (their own survival). It is never permissible to intentionally kill a man for a private good.

  However, the State (public authority) acts for the **common good**. Aquinas argues that just as a physician may amputate a diseased limb to save the body, the public authority may remove a dangerous member (a killer or enemy combatant) to save the social body.
  *   **Private Person:** May use force to protect the 'limb' (oneself), but may not amputate the 'other limb' (the aggressor). Hence, death must be accidental.
  *   **Public Authority:** May amputate the 'diseased limb' for the health of the whole. Hence, death may be intended.

  This is why Aquinas states that a private person sins if they intend to kill, even in self-defence. They are usurping a judgement that belongs to God and the public authority.

  ### 3. Proportion versus Intention

  You ask how the 'proportion' condition interacts with the 'intention' condition, and whether one can be met while the other is violated. They are two distinct filters; **both** must be passed for the act to be lawful.

  1.  **Intention Filter:** Is the death intended?
      *   If **Yes** (Private person): Unlawful (usurping authority).
      *   If **No** (Death is foreseen only): Proceed to filter 2.
  2.  **Proportion Filter:** Is the force moderate/necessary?
      *   If **No** (Excessive violence): Unlawful (murder/manslaughter).
      *   If **Yes** (Moderate violence): Lawful.

  **Can force be proportionate yet the intention illicit?**
  Yes. Suppose a man is attacked and he repels the attacker with moderate force, but he does so *out of revenge*. He thinks, 'He hurt me, so I will kill him,' rather than 'I must stop him.' Even if the force used was objectively necessary to stop the attack, the act is morally corrupted because the *intention* was killing (private animosity), not defence. Aquinas explicitly notes this at the end of the passage: public agents sin if moved by private animosity.

  **Can the intention be good yet the force disproportionate?**
  Yes. Suppose a man wishes only to save his life (good intention) but responds to an unarmed slap by shooting the attacker with a rifle. The death is beside his intention (he only wanted to stop the slap), but the act is unlawful because it is 'out of proportion to the end'. The violence exceeded what was necessary to secure safety.

  ### 4. A Concrete Walkthrough

  Let us apply this to a specific scenario to see where the line is drawn.

  **The Scenario:**
  An intruder breaks into your home at night. He is armed with a knife and advancing towards you. You possess a firearm.

  **Case A: The Private Citizen (Lawful)**
  *   **Mindset:** 'I must stop this man from reaching me. I will fire to wound or to make him halt.'
  *   **Action:** You fire one shot at the centre of mass, as is standard training, because it is the only way to reliably stop the threat.
  *   **Outcome:** The intruder dies.
  *   **Analysis:** Did you intend the death? In Aquinas's view, if your will was set on *stopping the advance*, and you would have been content had he merely fallen wounded, the death is *beside the intention*. You foresaw it, but you did not choose it as your end. Provided you did not fire *after* he fell (moderation), the act is lawful.

  **Case B: The Private Citizen (Unlawful - Intention)**
  *   **Mindset:** 'I am not letting him leave here alive. He threatened me, so I will kill him.'
  *   **Action:** You fire to kill.
  *   **Outcome:** The intruder dies.
  *   **Analysis:** Here, the death is intended. You have made his death the means of your security. As a private person, you lack the authority to intend this. The act is unlawful, regardless of proportion.

  **Case C: The Private Citizen (Unlawful - Proportion)**
  *   **Mindset:** 'I need to stop him.'
  *   **Action:** The intruder trips and drops his knife. He is on the floor, unarmed. You shoot him in the head.
  *   **Outcome:** The intruder dies.
  *   **Analysis:** Your original intention may have been defence, but by shooting an incapacitated man, the force is no longer moderate. It is out of proportion to the end (saving your life), as there was no longer a threat. The act becomes unlawful.

  **Case D: The Soldier (Lawful)**
  *   **Mindset:** 'That is an enemy combatant. To protect my unit and the mission, I must eliminate him.'
  *   **Action:** He shoots to kill.
  *   **Outcome:** The enemy dies.
  *   **Analysis:** Because the soldier acts under public authority for the common good, he is permitted to intend the death of the aggressor as a means to peace/security. He does not need to frame it as 'stopping force' in the same way a private citizen must; he may frame it as 'neutralising the enemy'.

  ### Summary of the Distinction

  To answer your specific question on where Aquinas draws the line:

  1.  **The Line of Intention:** It is drawn at the point where the death of the aggressor becomes part of your **plan** rather than a **consequence**. If you would accept the aggressor's survival provided he was stopped, the death is unintended. If you require his death to feel safe, or if you act out of vengeance, the death is intended.
  2.  **The Line of Authority:** It is drawn between acting for **private good** (where you cannot intend death) and **common good** (where you can).
  3.  **The Line of Proportion:** It is drawn at the point where the violence exceeds what is **necessary** to secure safety.

  In practice, Aquinas requires the private defender to maintain a specific orientation of the will: 'I do this to save myself, not to kill him.' While modern psychology might suggest this is a subtle mental distinction, for Aquinas, it is a moral reality that determines whether the act is one of preservation or execution.

  I hope this walkthrough clarifies how these distinctions function within the text. It is a rigorous framework, demanding that one scrutinise not only the outcome of one's actions but the very purpose for which they are undertaken.
