prompt: |-
  I am working through Aquinas's treatment of self-defence in the Summa Theologiae (II-II, Q. 64, A. 7) and find myself stuck on the central passage, which I reproduce below. I would be grateful for help understanding it.

  Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention. Now moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental as explained above (Q[43], A[3]; FS, Q[12], A[1]). Accordingly the act of self-defense may have two effects, one is the saving of one's life, the other is the slaying of the aggressor. Therefore this act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in "being," as far as possible. And yet, though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end. Wherefore if a man, in self-defense, uses more than necessary violence, it will be unlawful: whereas if he repel force with moderation his defense will be lawful, because according to the jurists, "it is lawful to repel force by force, provided one does not exceed the limits of a blameless defense." Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man, since one is bound to take more care of one's own life than of another's. But as it is unlawful to take a man's life, except for the public authority acting for the common good, as stated above (A[3]), it is not lawful for a man to intend killing a man in self-defense, except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good, as in the case of a soldier fighting against the foe, and in the minister of the judge struggling with robbers, although even these sin if they be moved by private animosity.

  What troubles me is the following. Aquinas maintains that a private person may lawfully perform an act of self-defence that results in the aggressor's death, so long as the death is "beside the intention" and the force used is moderate. Yet he immediately adds that it is not lawful for a private person to intend killing a man in self-defence—only those with public authority may do so. I cannot grasp how, in practice, a private person's state of mind is meant to differ from a soldier's or a judge's officer's. If I strike an assailant with a weapon I know is likely to kill him, and I do so because I judge that nothing short of that will stop him, in what sense is his death not intended? Is the idea that I must positively hope he survives, or merely that I must be prepared to stop the moment he is incapacitated? And how does the "proportion" condition—the requirement that the act not be "out of proportion to the end"—interact with the intention condition? Could a use of force be proportionate yet still involve an illicit intention, or vice versa? I would appreciate a careful walkthrough of how these distinctions are meant to apply to a concrete case, and where exactly Aquinas draws the line between an intended death and one that is merely foreseen.

  Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Topic:** Aquinas's treatment of self-defence in *Summa Theologiae* (II-II, Q. 64, A. 7).
      *   **Core Problem:** The user is struggling with the distinction between *intended* death and *foreseen but unintended* death in the context of private self-defence versus public authority.
      *   **Specific Questions:**
          *   How does a private person's state of mind differ from a soldier's/judge's officer's?
          *   If I strike to stop an assailant knowing it might kill, isn't the death intended?
          *   Does one need to *hope* the aggressor survives, or just be ready to stop?
          *   How do "proportion" and "intention" interact? Can force be proportionate but intention illicit (or vice versa)?
          *   Request for a concrete walkthrough of the distinctions.
      *   **Constraint:** Write in British English.

  2.  **Deconstruct Aquinas's Text (II-II, Q. 64, A. 7):**
      *   *Double Effect:* One act, two effects (saving self, killing aggressor). Only the intended effect determines the moral species.
      *   *Intention:* The intention must be self-preservation. Killing is *praeter intentionem* (beside the intention).
      *   *Proportionality:* Force must be moderate. Excessive violence makes it unlawful regardless of intention.
      *   *Duty:* One is bound to take more care of one's own life than another's.
      *   *Authority:* Private individuals cannot *intend* to kill. Public authority (soldiers, judges) can intend to kill *for the common good*.
      *   *Private Animosity:* Even public authority sins if motivated by private hate.

  3.  **Address the Core Philosophical Tension (Intention vs. Foreseeability):**
      *   This is the classic "Doctrine of Double Effect" (DDE) problem.
      *   *Key Distinction:* Intention is about the *end* (goal) and the *means* chosen to achieve it. Foreseeability is about consequences anticipated but not chosen as part of the plan.
      *   *The User's Confusion:* "If I know it will kill him, how is it not intended?"
      *   *Aquinas's Answer:* You choose the act of *stopping the attack*. Death is a side effect. If you could stop the attack *without* killing, you would (in theory). The soldier, however, chooses killing as a means to protect the state.
      *   *Nuance:* It's not about "hoping" he survives (emotional state), but about the *structure of the will*. Would you be satisfied if he were merely incapacitated? Yes = unintended death. No = intended death.

  4.  **Address the Public vs. Private Authority Distinction:**
      *   Why can a soldier intend to kill but a private citizen cannot?
      *   *Aquinas's View:* Killing is generally reserved for the common good. Private self-defence is a private good. Therefore, a private person cannot make the *death* of another a tool for their private good. They can only use force to stop the threat.
      *   *Public Authority:* Acts for the common good. Eliminating a threat (even lethally) can be a direct means to the common good.
      *   *Practical Difference:* A soldier on patrol sees an enemy combatant. He shoots to kill because that neutralises the threat to the state. A private citizen is attacked. He shoots to *stop the attack*. If the attacker dies, so be it, but that wasn't the goal.

  5.  **Address Proportionality vs. Intention:**
      *   *Interaction:* They are separate conditions. Both must be met.
      *   *Scenario A (Good Intention, Bad Proportion):* I want to save myself, but I use a cannon to stop a slap. Unlawful.
      *   *Scenario B (Bad Intention, Good Proportion):* I use moderate force, but I do it *because* I want him dead (revenge), not to save myself. Unlawful.
      *   *Scenario C (Good Intention, Good Proportion):* I use necessary force to stop the attack. Death occurs. Lawful.

  6.  **Develop a Concrete Walkthrough:**
      *   *Case:* Home invasion. Assailant with a knife.
      *   *Private Person:* Grabs a bat. Swings to disable the arm/stop the advance. Assailant dies from blow.
          *   *Intention:* Stop attack.
          *   *Foreseen:* Death possible.
          *   *Verdict:* Lawful (if force moderate).
      *   *Soldier:* Sees enemy combatant.
          *   *Intention:* Eliminate threat to state (which entails killing).
          *   *Verdict:* Lawful (under authority).
      *   *Vigilante (Private intending death):* Sees known criminal. Shoots to kill to "clean up the streets."
          *   *Intention:* Kill.
          *   *Authority:* None.
          *   *Verdict:* Unlawful (usurping public authority).

  7.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Scholarly, clear, respectful, analytical.
      *   *Spelling/Grammar:* "Defence" (not defense), "honour", "analyse", "centre", etc.
      *   *Structure:*
          1.  Introduction acknowledging the difficulty (it is a famous crux).
          2.  The Doctrine of Double Effect (Intention vs. Foreseeability).
          3.  The Public vs. Private Authority distinction (The Common Good).
          4.  Proportionality vs. Intention (The two filters).
          5.  Concrete Case Study.
          6.  Conclusion.

  8.  **Refining the "Intention" Explanation:**
      *   Need to be careful not to make it sound like a mental trick. It's about the *object of the act*.
      *   Use the "stop when incapacitated" test. If the attacker falls and you keep going, you intended death/harm beyond defence.
      *   Clarify that "knowing" $\neq$ "intending". (I know walking on the grass kills microbes, I don't intend it).

  9.  **Refining the "Public Authority" Explanation:**
      *   This is often the hardest part for modern readers. Why can't I intend to kill to save my life?
      *   Aquinas sees life as God's gift. Only the governor of the community (acting for the whole) can decide to remove a member for the health of the body. A private individual acts for a part (themselves). They can protect the part, but not excise the other part (the attacker) by *intending* their death.
      *   *Correction/Nuance:* Actually, Aquinas says the private person *can* cause death, just not *intend* it. The public person *can* intend it. Why? Because the public person acts for the *common good*, where the death of a aggressor might be a necessary means. The private person acts for *private good*, where death is never a necessary means, only stopping the force is.

  10. **Review against Constraints:**
      *   British English check: "Defence", "analyse", "colour", "favour", "licence" (if used), "whilst".
      *   Address all specific questions raised by the user.

  11. **Final Polish:** Ensure the distinction between *means* and *side-effect* is crystal clear, as this is the heart of the user's confusion. (Self-Correction: Make sure to emphasize that 'moderation' is an objective standard, not just subjective belief).

  *(Self-Correction during drafting)*: I need to be careful with the soldier example. Aquinas says the soldier intends to kill *in self-defence* referring it to the public good. Modern Just War theory might distinguish combatants differently, but I must stick to Aquinas's text. For Aquinas, the soldier killing an enemy combatant is akin to the judge's minister killing a robber *resisting arrest*. It is the *authority* that licenses the intention.

