      *   *Step 3: Evaluate the "Analogous Effect."* Does the English version feel like the same *kind* of struggle/play/music as the French? Or does it feel forced?
      *   *Step 4: Check Register/Tone.* Did the voice change (e.g., solemn to silly)?
      *   *Decision Nodes:* Reject if form is ornamental but meaning is gutted. Revise if tone is off. Accept (for review) if form is constitutive and the "spirit" survives.
