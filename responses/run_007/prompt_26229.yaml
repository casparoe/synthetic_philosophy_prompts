      *   *Key Distinction 2:* Constitutive vs. Ornamental. What makes *this* poem *this* poem? Is the rhyme scheme the point (e.g., a villanelle), or is it just decoration on a semantic core?
      *   *Key Distinction 3:* The "Triangle of Translation." Form, Meaning, Tone/Register. You can't keep all three perfectly. Sacrifices must be justified by preserving the *holistic effect*.
      *   *Key Distinction 4:* "Faithfulness" to the author's intent vs. faithfulness to the text's surface. Hofstadter favors the "spirit" (the *ton beau*) over the "letter."
      *   *Simplification for Editors:* We need to strip the philosophical fluff but keep the heuristic value. Focus on *function* of form and *integrity* of voice.

