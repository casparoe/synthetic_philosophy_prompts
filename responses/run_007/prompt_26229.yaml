      *   *Case 2 (Unrhymed Sonnet):* Form (rhyme) is often constitutive of a sonnet, but sometimes the argument structure is more important. If it's semantically close but drops rhyme, is it a translation or a paraphrase? Hofstadter values the "music." Dropping rhyme might be a "betrayal" of the *ton*, unless the rhyme was impossible without destroying meaning.
