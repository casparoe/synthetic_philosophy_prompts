answer: |-
  ### The Hofstadter Form-Fidelity Protocol (HFFP)

  **Purpose:** To evaluate poetry translations that prioritize formal constraints (rhyme, meter, structure) over literal semantic fidelity.
  **Time Required:** ~20 minutes per submission.
  **Prerequisites:** The original text, a literal "crib" (prose translation), and the submitted translation.
  **Philosophical Grounding:** Based on Douglas Hofstadter's *Le Ton beau de Marot*. It distinguishes between *mechanical copying* (preserving surface features at the cost of the poem's soul) and *recreating the constraint* (preserving the poem's essence through analogous formal struggle). It prioritizes the "constitutive" features of a poem over "ornamental" ones.

  ---

  #### Step 1: The Constitutive Constraint Audit (5 Minutes)
  **Question:** Is the formal feature being preserved (e.g., rhyme scheme, meter, fixed form like a villanelle) *constitutive* of the poem's identity, or is it *ornamental*?
  *   **Constitutive:** The form generates the meaning (e.g., the refrains of a villanelle create the obsession; the sonnet's volta creates the argument).
  *   **Ornamental:** The form is decorative music laid over a semantic core that could exist without it.
  *   **Sufficient Answer:** Identify the primary formal constraint. Mark it "Constitutive" if removing it changes the genre or the poem's central mechanism. Mark it "Ornamental" if the poem functions primarily as a statement of meaning.
  *   **Decision Node:**
      *   If **Ornamental** and semantic fidelity is low: **REJECT**. (Hofstadter argues against preserving decoration while gutting meaning.)
      *   If **Constitutive**: Proceed to Step 2.
      *   *Human Hand-off:* If editors disagree on whether the form is constitutive, flag for senior discussion.

  #### Step 2: The Semantic Cost Assessment (5 Minutes)
  **Question:** To preserve the constitutive constraint, what specific semantic ground was sacrificed?
  *   **Action:** Compare the crib to the submission. List the top three images or ideas that were altered, dropped, or added to force the rhyme/meter.
  *   **Sufficient Answer:** A list of specific deviations.
  *   **Evaluation:** Do these deviations distort the *emotional logic* of the poem, or do they merely swap equivalent symbols?
      *   *Hofstadterian Distinction:* Is this a "rubber stamp" distortion (forcing a word that makes no sense just to rhyme) or a "creative recreation" (finding a new image that evokes the same feeling)?
  *   **Decision Node:**
      *   If deviations break the emotional logic (e.g., turning grief into anger to find a rhyme): **REVISE**.
      *   If deviations are symbolic swaps that maintain emotional logic: Proceed to Step 3.

  #### Step 3: The Register and Tone Check (5 Minutes)
  **Question:** Does the translation maintain the original's *register* (level of formality) and *tone* (emotional attitude)?
  *   **Action:** Read the submission aloud. Does it sound like the same "person" speaking as in the original?
  *   **Sufficient Answer:** A judgment on whether the voice is consistent (e.g., solemn vs. jokey, archaic vs. contemporary).
  *   **Decision Node:**
      *   If Register/Tone shifts significantly (e.g., ceremonious becomes colloquial): **REJECT**. (For Hofstadter, the *ton beau* is the soul of the piece; a tone shift is a soul transplant.)
      *   If Register/Tone is consistent: Proceed to Step 4.

  #### Step 4: The "Soul" Test (5 Minutes)
  **Question:** If you did not know the original, would this poem feel like a complete, coherent artistic object in English that justifies its formal constraints?
  *   **Action:** Read the submission as a standalone English poem.
  *   **Sufficient Answer:** A binary judgment: Does the form feel earned or forced?
  *   **Decision Node:**
      *   If the form feels mechanical/forced (the "translationese" of rhyme): **REVISE**.
      *   If the form feels organic to the English text: **ACCEPT FOR REVIEW**.
      *   *Human Hand-off:* This step is inherently subjective. If the editor feels a "resonance" but cannot articulate why, pass to senior editors with a note citing "successful analogous constraint."

  ---

  ### Application to Hypothetical Submissions

  #### Case 1: The Villanelle with Shifted Images
  *   **Submission:** A French villanelle translated into English. Keeps the 19-line structure, two rhymes, and refrains. However, to make the rhymes work, the translator changes the image of a "dying swan" to a "singing bird" and a "dark forest" to a "deep sea."
  *   **Procedure Run:**
      1.  **Constraint Audit:** The villanelle form (refrains/rhyme) is **Constitutive**. A villanelle without refrains is not a villanelle. (Pass)
      2.  **Semantic Cost:** Images changed (swan→bird, forest→sea). Do these distort emotional logic? If the swan represents grace in death and the bird represents general song, there is a loss. However, if the *feeling* of loss remains, Hofstadter allows "isomorphic" mapping (swapping symbols that hold the same structural weight). (Pass, with note).
      3.  **Register/Tone:** Assuming the tone remains elegiac. (Pass).
      4.  **Soul Test:** Does the English poem work as a villanelle? Yes.
  *   **Output:** **ACCEPT FOR REVIEW**.
  *   **Why:** Hofstadter argues that in fixed forms, the structure *is* part of the meaning. Sacrificing specific images to save the structure is permissible if the "essence" (the emotional impact of the form) is preserved. The constraint is constitutive, so the sacrifice is justified.

  #### Case 2: The Unrhymed Sonnet
  *   **Submission:** A Petrarchan sonnet translated into English blank verse (iambic pentameter, no rhyme). Semantically very close to the original.
  *   **Procedure Run:**
      1.  **Constraint Audit:** Is the rhyme scheme constitutive? For a Petrarchan sonnet, the rhyme scheme drives the octave/sestet division. Dropping rhyme makes it a "sonnet-shaped argument" rather than a sonnet. Mark as **Constitutive**.
      2.  **Semantic Cost:** Low semantic loss.
      3.  **Register/Tone:** Consistent.
      4.  **Soul Test:** As an English poem, it reads well. But it fails the "recreating the constraint" test. It avoided the struggle rather than recreating it.
  *   **Output:** **REVISE**.
  *   **Why:** While semantically faithful, this is a "betrayal" of the *ton* in Hofstadter's sense because it removes the musical constraint that defines the genre. Unless the translator provides a note proving rhyme was impossible without destroying meaning (a "feasibility" defense), the procedure flags this as abandoning the constitutive constraint. It is a paraphrase, not a form-preserving translation.

  #### Case 3: The Jokey/Colloquial Version
  *   **Submission:** A grave, ceremonious French ode translated into rhyming, metered English slang. It reads beautifully and is very witty, but the original was solemn.
  *   **Procedure Run:**
      1.  **Constraint Audit:** Meter/Rhyme are **Constitutive** to the ode's musicality. (Pass).
      2.  **Semantic Cost:** Meaning is preserved, but context shifted.
      3.  **Register/Tone:** **FAIL**. Original is grave; translation is jokey/colloquial.
      4.  **Soul Test:** It works as an English poem, but it is a *different* poem.
  *   **Output:** **REJECT**.
  *   **Why:** This triggers the hard stop at Step 3. For Hofstadter, the "tone" (*le ton*) is the most critical element of the "beau." A grave poem turned jokey is a "soul transplant." Even if it reads beautifully, it is a betrayal of the original's identity. Readability alone does not justify a tonal violation.

  ---

  ### Limitations and the Return of Taste

  This procedure cannot settle disputes where the "essence" of the poem is ambiguous. Hofstadter's central insight is that meaning is not a static nugget to be carried over, but a fluid effect created in the reader. Therefore:

  1.  **The "Essence" Problem:** Step 2 requires judging whether an image swap preserves "emotional logic." Two editors might disagree on whether a "swan" and a "bird" carry the same weight. The procedure identifies the disagreement but cannot resolve it.
  2.  **The Feasibility Defense:** The procedure assumes constraints *can* be met. It cannot adjudicate when a translator claims, "Rhyme is impossible here without lying." That requires a bilingual editor's intuition about the target language's affordances.
  3.  **The Aesthetic Leap:** Step 4 (The Soul Test) is ultimately a judgment of taste. The procedure can flag *where* to look, but it cannot measure *beauty*. A translation might pass all checks and still feel dead; another might fail Step 2 and feel alive.

  Ultimately, the HFFP filters out mechanical failures and tonal betrayals, but it cannot replace the editor's responsibility to recognize when a translation has successfully "reincarnated" the poem rather than merely "embalmed" it.

  \answer{Accept form-preserving translations only when the form is constitutive of the poem's identity, the semantic sacrifices do not break the emotional logic, and the original tone remains intact.}
