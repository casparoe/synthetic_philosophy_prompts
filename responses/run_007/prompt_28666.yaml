  This assumes manipulation is costless, but moving a market price requires absorbing liquidity, and to flip a governance decision you must push the price far enough to overcome the spread and depth provided by informed speculators and subsidized liquidity providers. Even if principal is returned upon voiding, the manipulator incurs transaction fees, bid-ask slippage, and the significant opportunity cost of locked collateral required to sustain the price distortion until the decision is finalized. Market makers will anticipate this risk and widen spreads on the counterfactual branch, raising the cost of entry, while we can further design fee structures that penalize withdrawn liquidity to disincentivize bluffing. While the counterfactual settlement issue is a technical friction we must engineer around, it does not invalidate the core epistemic advantage: separating values from beliefs ensures that our welfare metrics are democratically chosen while our expectations are disciplined by money rather than rhetoric. Voting on beliefs aggregates ignorance and incentivizes demagoguery, whereas futarchy forces participants to put capital behind their claims, creating a feedback loop that voting fundamentally lacks.
