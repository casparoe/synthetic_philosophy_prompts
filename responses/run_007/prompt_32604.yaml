answer: |-
  First off, welcome to the seminar. It is genuinely refreshing to hear from someone who actually read the primary text eight times instead of relying on the "Hume's Law" bumper sticker. To answer your main question immediately: **No, you are not reading it wrong.** In fact, you are reading it *better* than most introductory philosophy courses teach it.

  Your intuition is spot on: the "strong" reading (that it is *logically impossible* to derive an ought from an is) is largely a 20th-century invention projected back onto Hume. What Hume is doing in that paragraph is more specific, more psychological, and frankly, more interesting for your situation with your brother.

  Here is the breakdown of why your reading is correct, where "Hume's Law" came from, and how this actually helps unstick your vegetarian debate.

  ### 1. The Textual Evidence: Skepticism vs. Impossibility
  You noticed the key phrases. Hume says the transition is "inconceivable" and that authors need to "give a reason."

  If Hume were asserting a logical law (like "you cannot square a circle"), he wouldn't ask authors to explain *how* they did it; he would simply point out that they *couldn't* have done it. By asking for an explanation ("a reason should be given"), he is treating the move from *is* to *ought* as a gap in *argumentation*, not necessarily a gap in *logic*.

  He is criticizing the moralists of his day (mostly Rationalists like Samuel Clarke) who claimed morality was a matter of fact, discoverable by reason alone, just like geometry. Hume's point is: "You guys are listing facts about the world (God exists, humans are social), and then suddenly you're making moral claims, but you haven't shown me the mental mechanism that gets you from one to the other."

  When he says explaining this would "subvert all the vulgar systems of morality," he implies that those systems *rely* on the confusion. If someone *could* explain the link, the systems might survive. But he bets they can't, because he thinks morality comes from **sentiment**, not reason.

  ### 2. Where Did "Hume's Law" Come From?
  You asked if later philosophers read this back into him. Yes, absolutely.

  *   **G.E. Moore (1903):** In *Principia Ethica*, Moore argued for the "Naturalistic Fallacy." He claimed you can't define "good" using natural properties (like "pleasure" or "evolutionary fitness"). This hardened Hume's skepticism into a rule about definitions.
  *   **Logical Positivists (1930s-50s):** Philosophers like A.J. Ayer were obsessed with the verification principle (statements are only meaningful if empirically verifiable or tautological). They loved Hume's paragraph because it seemed to prove that moral statements aren't "facts" and therefore aren't truth-apt. They turned Hume's psychological observation into a rigid logical barrier.
  *   **Arthur Prior (1960):** He actually mocked this. He showed you can derive an ought from an is trivially (e.g., "Tea drinking is common in England; therefore, tea drinking is common in England or everyone ought to die"). This proved that strictly logically, the barrier is leaky.

  So, when your professor says "You can't derive an ought from an is," they are teaching you 20th-century metaethics using Hume's name. Hume himself was making a point about **moral psychology**.

  ### 3. What This Means for Your Brother (and the Vegetarian Debate)
  This is where it gets practical for you. If you accept the "Strong Hume's Law," your brother's argument is dead on arrival. He shows you facts (suffering *is* happening), and you say, "That doesn't logically entail I *ought* to stop." The conversation ends.

  But if you use **Hume's actual argument**, the conversation changes.

  Hume argues that reason is the "slave of the passions." Reason can tell you what *is* (e.g., "This pig is in pain," "Eating this causes that pain"). But reason alone cannot motivate action. Only a **sentiment** (a desire, a feeling of approval/disapproval) can motivate action.

  So, the "ought" doesn't come from the facts; it comes from your **capacity to care about the facts.**

  **How to unstick the debate:**
  Instead of arguing about logic, argue about sentiments.
  *   **The Brother's Mistake:** He thinks showing you the *facts* (the *is*) should automatically compel you. Hume would say: No, the facts only matter if you already have a sentiment that cares about animal suffering.
  *   **Your Move:** You aren't logically inconsistent for acknowledging the facts but not changing your diet. You are just lacking the specific sentiment that bridges the gap.
  *   **The Real Question:** The debate shouldn't be "Do the facts entail the obligation?" (Hume says no). The debate should be: "Given these facts, should a normal human sentiment of sympathy be triggered?"

  Hume believes most humans *do* have a natural sentiment of sympathy. So, if your brother shows you the *Dominion* clips, he isn't trying to win a logic puzzle; he is trying to **activate your sentiment.** He is trying to make the *is* painful enough that your natural *ought* (don't cause pain) kicks in.

  ### 4. Why This Matters for Biology
  As a biology major, you're trained to look at causal mechanisms. Hume is basically asking for the mechanism of morality.
  *   **Rationalists:** Morality is like math. (Input: Facts → Process: Reason → Output: Duty).
  *   **Hume:** Morality is like biology/psychology. (Input: Facts → Process: Sentiment/Passion → Output: Action).

  If you treat morality like math, the "Is-Ought" gap is a crisis. If you treat it like biology (as Hume essentially does), the "gap" is just the space where human nature lives.

  ### Summary
  1.  **You are right:** The text does not support the "logically impossible" reading. It supports a "you haven't explained the psychological mechanism" reading.
  2.  **The Strong Law is later:** It comes from Moore and the Positivists, not Hume.
  3.  **For your seminar:** Point out that Hume is attacking Rationalist moralists, not establishing formal logic. Your professor might push back (because "Hume's Law" is standard curriculum), but you have the text on your side.
  4.  **For your brother:** Stop arguing about whether the facts *force* you to be vegetarian. Argue about whether the facts *should* trigger your sympathy. That's where the actual ethical work is happening.

  You're doing philosophy correctly by questioning the received wisdom. Keep reading the text; usually, the "laws" named after philosophers are the things they were most nuanced about.
