prompt: |-
  Ok so I'm taking this ethics seminar — well, auditing it, I'm actually in the biology department but my roommate's a philosophy major and dragged me along — and we've been doing metaethics for two weeks now which is basically just different ways of asking whether moral claims can be true or false. I got into a whole thing with my brother over winter break about going vegetarian (he's been sending me Dominion clips, and look, the facts about factory farming are genuinely awful, but every time I try to pin down whether the awfulness means we're obligated to do something, the conversation just goes in circles). So I thought, fine, let me actually read the source material instead of arguing from YouTube summaries.

  Anyway we got assigned the famous is-ought paragraph from Hume's Treatise (Book III, Part I, Section I) and I've read it like eight times now and I'm genuinely confused about what Hume is claiming. Here's the passage:

  In every system of morality, which I have hitherto met with, I have always remarked, that the author proceeds for some time in the ordinary way of reasoning, and establishes the being of a God, or makes observations concerning human affairs; when of a sudden I am surprised to find, that instead of the usual copulations of propositions, is, and is not, I meet with no proposition that is not connected with an ought, or an ought not. This change is imperceptible; but is, however, of the last consequence. For as this ought, or ought not, expresses some new relation or affirmation, it's necessary that it should be observed and explained; and at the same time that a reason should be given, for what seems altogether inconceivable, how this new relation can be a deduction from others, which are entirely different from it. But as authors do not commonly use this precaution, I shall presume to recommend it to the readers; and am persuaded, that this small attention would subvert all the vulgar systems of morality, and let us see, that the distinction of vice and virtue is not founded merely on the relations of objects, nor is perceived by reason.

  Here's my problem. Everyone — including my professor — talks about this as "Hume's Law" or "the is-ought gap," meaning you simply cannot derive an ought from an is. Full stop. But when I read the actual text, Hume says the change "is imperceptible" and "of the last consequence," and he says it's "altogether inconceivable" how the deduction works — but then he also says authors should "give a reason" for how it's done, and that they should "observe and explain" the shift. That phrasing — "give a reason" — seems to leave the door open, like he's saying: if you're gonna do this, you better have an account of how, and right now nobody does. But he doesn't seem to be saying it's logically impossible in principle. Am I reading this wrong? Is the strong "no ought from is" reading actually in the text, or is that something later philosophers (Moore? the logical positivists?) read back into Hume? And if the strong reading isn't there, does that change anything about how we should use the is-ought gap in arguments today?
