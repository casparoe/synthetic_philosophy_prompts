  3.  **Evaluate the "Strong" vs. "Weak" Reading:**
      *   *Strong Reading (Hume's Law):* Logical impossibility. No set of descriptive premises can entail a normative conclusion without a normative premise. (Popularized by Prior, Moore, Logical Positivists).
      *   *Weak/Textual Reading:* Hume is criticizing *contemporary moralists* (like Clarke, Wollaston) for failing to explain the transition. He is skeptical ("inconceivable"), but his prescription is to "give a reason," implying that *if* one could be given, the system might stand (though he doubts it will be).
      *   *Scholarly Consensus:* Most Hume scholars agree the user is onto something. The "Strong Law" is an anachronistic projection onto Hume. Hume is making a point about moral psychology and the limits of *reason*, not formal logic per se.

