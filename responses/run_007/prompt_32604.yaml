      *   **The Core Question:** Is the standard interpretation of Hume's "Is-Ought" paragraph (the "Hume's Law" strong reading: *logically impossible* to derive ought from is) actually supported by the text? Or is Hume making a weaker claim (authors *fail* to explain the transition, but maybe it could be done)?
      *   **Secondary Question:** If the strong reading isn't there, does it matter for modern arguments (like the vegetarian one)?
