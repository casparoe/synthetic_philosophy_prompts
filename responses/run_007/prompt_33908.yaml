      *   *Derek's Strength:* Captures the logical/grammatical solution. The regress *does* stop if you understand practice vs. proposition.
      *   *The Conflict:* They are talking past each other slightly. Derek is solving the *Regress Problem* (how to stop the infinite chain). Mira is highlighting the *Justification Problem* (how to validate the starting point).
      *   *Resolution:* Both are right about different things. The regress is a category mistake (Derek), but the normativity of logic is not externally justifiable (Mira).
      *   *Missing Perspectives:*
