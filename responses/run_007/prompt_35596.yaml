          *   *Inner vs. Outer Alignment:* Explain the distinction. The passage talks about Outer (specifying the goal). Inner is about what the model actually wants.
      *   *Section 4: Near-term vs. Long-term.* The passage focuses only on Superintelligence (x-risk). Mention that alignment also covers current harms (bias, lies).
