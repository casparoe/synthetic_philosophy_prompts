  6.  **Refining the "Strict Presupposition" vs. "Fits":**
      *   *Fits:* Dark Forest.
      *   *Strictly Presupposes:* That the marginal increase in existential risk caused by METI (over baseline leakage + SETI) is unacceptable relative to the expected benefit. It presupposes a **lexical priority of survival over knowledge**. It presupposes that **agency matters** (causing risk is worse than allowing risk).

