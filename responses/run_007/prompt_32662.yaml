          *   **Listening:** Would still be encouraged (low cost, high info).
          *   *Conflict:* A pure CBA might actually demand *more* listening to reduce uncertainty before messaging. But if the question implies replacing the "precautionary veto" with "optimistic CBA," then Active Messaging becomes obligatory.
      *   *Abandon Listening?* No. Listening is low cost.
