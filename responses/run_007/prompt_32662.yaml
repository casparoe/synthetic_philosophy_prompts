answer: |-
  The asymmetry between listening (SETI) and transmitting (METI) in radio astronomy is not merely a matter of funding or technology; it is a decision-theoretic stance taken under conditions of radical ignorance. To understand it, we must dissect the implicit logic governing existential risk.

  ### 1. The Implicit Theory of Rational Choice

  The practice of listening while refusing to transmit strictly presupposes a **Maximin decision rule under deep uncertainty with lexically ordered preferences.**

  It does **not** strictly presuppose the **Dark Forest hypothesis**. The Dark Forest is a specific empirical claim: that the universe is filled with hostile civilizations that *necessarily* destroy competitors. The current practice does not require astronomers to believe this is true, only that the *probability* is non-zero and the *consequence* is unbounded (extinction). The practice is compatible with a benevolent universe, a silent universe, or a dangerous one. It merely requires that the downside risk of transmission cannot be quantified or bounded.

  Instead, the practice relies on three specific theoretical pillars:

  1.  **Asymmetric Payoff Structure:** The potential benefit of contact (knowledge, technology) is finite, whereas the potential cost (civilizational collapse or extinction) is effectively infinite. In an Expected Utility calculation, if $Cost \to \infty$, then any non-zero probability of risk renders the Expected Utility of transmission negative, regardless of the benefit.
  2.  **The Precautionary Principle (Strong Version):** When an action raises a threat of irreversible harm, the burden of proof lies on those proposing the action to demonstrate safety. Since safety cannot be demonstrated (we cannot know alien intentions), the default is inaction.
  3.  **Moral Asymmetry of Agency (Doing vs. Allowing):** There is a normative distinction between *creating* a risk and *accepting* a background risk. Listening is treated as passive information gathering that does not alter the causal state of the universe regarding our visibility. Transmitting is an intervention that actively changes our status from "potentially detectable" to "explicitly targeted."

  **Strict Presupposition vs. Mere Fit:**
  *   **Fits:** The Dark Forest hypothesis fits the data perfectly, but the practice does not presuppose it.
  *   **Strictly Presupposes:** That the marginal increase in existential risk caused by *deliberate, high-gain transmission* exceeds a threshold of tolerability that *passive listening* and *radio leakage* do not. It presupposes that **survival is a lexical priority** over scientific discovery (i.e., no amount of knowledge is worth a non-zero chance of extinction).

  ### 2. Assessment of Internal Coherence

  The coherence of this practice rests on two vulnerable points: the nature of listening and the reality of radio leakage.

  **Is Listening Reckless?**
  The ban on transmitting is coherent regarding listening *if* one accepts that information gathering does not increase vulnerability. Listening does not broadcast our location; it attempts to detect theirs. However, a strict coherence check reveals a minor technical flaw: radio telescopes use local oscillators that can leak faint signals. Yet, compared to a targeted METI broadcast, this leakage is negligible.
  *   *Verdict:* Coherent. Listening is epistemically active but causally passive regarding our own visibility. It does not reduce the distance to potential threats; it only reduces our ignorance of them.

  **The Problem of Radio Leakage**
  The stronger challenge to coherence is "radio leakage" (TV, radar, military comms). Humanity has been "shouting" unintentionally for a century. If transmission is reckless because it reveals us, why is leakage permissible?
  *   *The Defense:* Proponents of the ban argue that leakage is omnidirectional, low-gain, and decays rapidly (inverse-square law). It creates a "bubble" of detectability only ~100 light-years deep. METI involves high-gain antennas targeting specific stars, boosting signal strength by orders of magnitude, making it detectable across the galaxy.
  *   *The Incoherence:* This defense relies on a threshold assumption: that a weak signal is safe while a strong one is fatal. If a hostile civilization exists within 100 light-years, leakage has already condemned us; a METI ban is futile. If no hostile civilization exists within 100 light-years, METI might be safe.
  *   *Verdict:* The practice is **conditionally coherent**. It holds only if one believes that signal strength and directionality are the primary determinants of risk. If one believes *any* electromagnetic signature invites destruction (the strict Dark Forest view), the ban is incoherent because leakage has already violated it. The community implicitly assumes a "security through obscurity" model where we are hidden in the noise, and METI would be the act of stepping into the spotlight.

  ### 3. The Practice Under Straightforward Cost-Benefit Analysis

  If we replaced the Maximin/Precautionary framework with a standard **Expected Utility (Cost-Benefit) Analysis**, the practice would change fundamentally. Standard CBA requires assigning probabilities to outcomes rather than vetoing actions based on unbounded downside.

  **The Calculation:**
  $$EU(Action) = [P(Benefit) \times Value(Benefit)] - [P(Risk) \times Cost(Risk)]$$

  *   **Value(Benefit):** High (technological salvation, philosophical resolution, cultural expansion).
  *   **Cost(Risk):** High (subjugation or destruction), but treated as a finite negative value rather than an infinite veto.
  *   **Probabilities:** Under deep uncertainty, a CBA approach would likely use a "principle of indifference" or Bayesian priors based on the Fermi Paradox.

  **Consequences for Practice:**
  1.  **Active Messaging:** A CBA approach would likely **mandate active messaging**. Because the potential upside of contact (e.g., solving energy scarcity, disease) is so vast, even a low probability of success outweighs a finite cost of risk, provided $P(Risk)$ is not assessed as overwhelmingly high. The "burden of proof" would shift: we would transmit unless we had positive evidence of hostility, rather than remaining silent unless we had positive evidence of safety.
  2.  **Listening:** We would **not abandon listening**. In a CBA framework, listening is a "low cost, high information" activity. It reduces the uncertainty ($P$) in the equation above. Before transmitting, a rational agent under CBA would invest heavily in listening to refine the probability estimates of risk.
  3.  **Leakage:** We would likely attempt to **minimize leakage** more than we do now. If risk is a calculable cost, then unnecessary leakage is "wasted risk expenditure." We would shield our noise while deliberately beaming messages we control.

  **Conclusion:**
  Replacing the precautionary veto with cost-benefit analysis would force us to **begin active messaging** while **continuing (and perhaps intensifying) listening**. The current asymmetry would vanish, replaced by a strategy of "cautious engagement": listen to assess the threat, then transmit to claim the benefit. The current ban survives only because the astronomical community treats existential risk as a trump card that cannot be played in a game of averages.
