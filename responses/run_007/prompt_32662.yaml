          *   Constraint: Be precise about what is *strictly presupposed* vs. what merely *fits*.
      *   **Task 2: Assess Internal Coherence.**
          *   If transmitting is reckless because it reveals us, why isn't listening reckless (does listening imply vulnerability or just passivity)?
