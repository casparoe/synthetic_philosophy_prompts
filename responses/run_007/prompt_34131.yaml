prompt: |-
  I'm a couple years into a philosophy PhD and I've got properly obsessed with costly signalling theory — the Zahavi / Grafen line about how signals can be honest precisely because they're expensive to produce, and all the philosophical tangles that come with applying it to human behaviour. But I'm at the point where I need to narrow down to a specific project, and I'm worried about picking something that turns out to be a dead end.

  What do you think are the three or four most important open conceptual questions on the philosophical side of costly signalling right now? I don't mean empirical biology — I mean things like: whether the handicap principle actually explains human linguistic communication, or moral signalling, or religious ritual; whether there's a principled way to distinguish costly signals from other routes to honest communication; whether the framework breaks down once you've got agents who can reflect on and game signalling systems; whether costly signalling theory says anything interesting about the evolution of norms or institutions.

  I want you to rank your picks and defend the ordering. For each: why is it philosophically deep rather than just an empirical question waiting for more data? How tractable is it for someone with three years and a philosophy background (not a biology lab)? And what would you need to see in the next year or two to decide it was more or less promising than you initially thought? If there's a question everyone talks about that you think is overrated, I'd love to hear that too.
