          *   *Conceptual point:* The demand for transitivity isn't the villain. The villain is the simultaneous acceptance of two principles that generate contradictory directives. Relaxing transitivity is a technical patch that admits society can be irrational. But the *moral* irrationality remains.
          *   *Conclusion on (2):* Giving up transitivity saves the SWF but admits social inconsistency. It doesn't resolve the normative clash between liberty and efficiency.

      *   **Section 3: Deep Tension within Liberalism:**
          *   Is it a deep tension? Yes.
