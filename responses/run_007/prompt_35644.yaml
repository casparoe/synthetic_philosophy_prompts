          *   *Sen's counter:* If I have a right to paint my house green, and everyone (including me) prefers I paint it blue due to some externality, Pareto says blue. If my right is decisive, it's green. If my right is a constraint, blue isn't an option. But why isn't it an option? Because my choice makes it so. This brings us back to decisiveness.
          *   *Conclusion on (1):* Modelling as decisiveness captures the *value* of liberty (control over outcomes). Modelling as constraints hides the conflict by changing the domain of evaluation.

      *   **Section 2: Transitivity and Ordering:**
