      *   Bob's frame ($S'$): $E$ has a $t'$-coordinate $> 0$ (assuming he moves towards $E$). $E$ is future.
      *   *Entitlement:* Alice is physically justified in calling $E$ "present." Bob is physically justified in calling $E$ "future." Neither can signal the other to verify this *now*. This is standard SR.

  5.  **Drafting the Inference and Extra Premise (Section 3):**
      *   *The Inference:*
          1.  $E$ is present for Alice.
          2.  $E$ is future for Bob.
          3.  (Premise) If an event is present for an observer, it is real.
          4.  (Premise) If an event is real for one observer, it is real for all (Reality is not frame-dependent).
          5.  Therefore, $E$ is real *now* (at $O$).
          6.  But $E$ is future for Bob. So the future is real.
          7.  Generalize: Past, Present, Future all exist.
      *   *The Extra Premise:* The crucial link is usually the "Principle of No Privileged Observer" applied to *ontology* rather than *physics*. Or, specifically, the transitivity of co-reality ("If $x$ is real for $O_1$, and $O_1$ is real for $O_2$, then $x$ is real for $O_2$"). Let's pinpoint the specific assumption: **"Ontological Parity of Simultaneity"** or **"The Reality of the Present."** The prompt asks to identify the *extra premise*. It's the claim that *simultaneity determines reality*.

  6.  **Drafting the Metaphysical Work (Section 4):**
      *   *Feature:* The identification of "being present" with "being real" (or "determinate").
      *   *Weakening:* If we decouple existence from simultaneity (e.g., Presentism where "now" is privileged but undetectable, or Relativistic Presentism where "now" is local), the argument fails. If reality is not transitive across frames, it fails.

  7.  **Drafting the Presentist Reply (Section 5):**
