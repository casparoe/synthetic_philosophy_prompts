      *   *Refinement:* To make it the *strongest* case, let's use the standard RP setup: Alice and Bob cross paths. There is a distant event $E$. For Alice, $E$ is happening *now*. For Bob, $E$ is in the *future*.
      *   *Wait, constraint check:* "One pair of spacelike-separated events." Let's define the pair as ($O$, $E$). $O$ is the meeting point. $E$ is the distant event. They are spacelike separated.
