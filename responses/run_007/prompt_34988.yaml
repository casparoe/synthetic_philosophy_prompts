      *   *Extra Premise:* "The Principle of Ontological Supervenience on Simultaneity" (If simultaneous with a real event, an event is real) + "Non-Relativity of Existence" (Existence isn't frame-relative).
      *   *Presentist Reply:* Deny that simultaneity dictates existence. Assert a privileged "now" that doesn't align with Alice's plane.
