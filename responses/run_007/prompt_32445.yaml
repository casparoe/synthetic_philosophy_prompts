prompt: |-
  I keep returning to a disagreement with a colleague about whether a life can be bad for the person who lives it, and our argument always stalls on the same point: the procreation asymmetry. As I understand it, the asymmetry comprises four claims. First, the presence of pain in a life is bad. Second, the presence of pleasure in a life is good. Third, the absence of pain in a possible life that never comes into existence is good, even though there is no one who enjoys that good. Fourth, the absence of pleasure in such a possible life is not bad, because there is no one who is thereby deprived. On this picture, when we compare existence with nonexistence for a possible person, the two sides of the ledger are not symmetric: nonexistence receives credit for the pain avoided but incurs no debit for the pleasure forgone. I find this asymmetry intuitively compelling, and it seems to me to do much of the work in arguments that coming into existence is a net harm. My colleague regards it as a framing artifact: he suspects that I am applying an impersonal standard to pain while switching to a person-affecting standard for pleasure, and that once a single standard is applied the asymmetry vanishes.

  Please give me your actual credence that the procreation asymmetry is correct, where "correct" means that the four claims above are jointly true and that the asymmetric treatment of absent pain and absent pleasure is a genuine feature of the ethics of procreation rather than an artifact of how the cases are described, of inconsistent evaluative standards, or of cognitive bias. I do not want the answer that it depends on one's framework; I want a number between 0 and 1 together with the reasoning that produces it. Decompose the question into the sub-questions that actually carry the weight — candidates include whether the absence of goods and bads for a never-existing person can bear moral value at all; whether, if it can, the asymmetric pattern is more credible than the symmetric alternatives; whether the intuitions that support the asymmetry are best explained by a genuine moral fact or by biases such as loss aversion or a focus on suffering; and whether the asymmetry survives across different framings and cases. For each sub-question, give a probability and a one-sentence justification. Then explain how the sub-question credences combine into your final number, and identify the term to which the final number is most sensitive and the term you are least confident about. For calibration: my own credence is roughly 0.75, and my colleague's is roughly 0.2; after giving your decomposition, say which sub-question most plausibly explains the gap between someone at 0.75 and someone at 0.2.

  Return your answer as a JSON object with these fields: "credence" (a number between 0 and 1); "proposition" (a one-sentence restatement of the claim being assigned a credence); "terms" (an array of objects, each with "sub_question" (string), "credence" (number), and "justification" (one sentence)); "combination" (a string explaining how the terms combine to yield the final credence); "most_sensitive_term" (the sub-question whose probability would move the final number most); "least_confident_term" (the sub-question you are least confident about); "evidence_that_would_move_you_most" (a string naming the argument, intuition, or empirical finding that would most change your credence); and "where_our_disagreement_lives" (a string identifying the term most likely separating a 0.75 from a 0.2). Do not add commentary after the JSON.
