      *   Need to establish limits (doesn't prove body, doesn't prove God yet).
      *   *Drafting thought:* Avoid saying "a self exists" (Event camp rejects) or "no self exists" (Self camp rejects). Focus on the *act* of affirmation.
      *   *Claim 1:* Context of radical doubt.
      *   *Claim 2:* The indubitability of the occurrence of thinking.
      *   *Claim 3:* The inference to existence is immediate/intuitive, not syllogistic (Descartes' own view).
