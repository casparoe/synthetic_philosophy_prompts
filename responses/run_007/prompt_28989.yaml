      *   **Argument:**
          *   *Conative Case:* We lack a pre-existing framework for distinguishing reason types. The "constitutive aim" move feels necessary and puzzling here.
          *   *Doxastic Case:* We *already* have epistemology. The distinction between epistemic (truth-tracking) and pragmatic (benefit-tracking) reasons is well-established. WKR just collapses into this older debate.
          *   *Conclusion:* Unified solutions (Scanlon, Hieronymi) risk being false about belief (ignoring epistemology) or too vague to be useful about conation.
