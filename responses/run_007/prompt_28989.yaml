      *   *The "Guise of the Good/True":* Unified theories often rely on the idea that attitudes represent their objects under a specific guise. If the WKR literature is trying to solve the *meta-normative* question (what makes a reason a reason *for* an attitude?), then the distinction between epistemology and value theory might be superficial.
      *   *Hieronymi's Specific Contribution:* Hieronymi ("The Wrong Kind of Reason") argues that WKR are not reasons *for* the attitude, but reasons *for wanting to have* the attitude. This applies to belief *and* admiration. Does the user's objection defeat this? The user says epistemology already handles belief. But Hieronymi is arguing that pragmatic reasons aren't reasons for belief *at all*. Evidentialists agree, but *why*? Hieronymi offers an account.
