answer: |-
  # The Threshold & Aggregate Cap Protocol (TACP)

  **Purpose:** To provide a consistent, documentable decision framework for trade-offs between widespread trivial harms (friction, delay) and concentrated severe harms (harassment, security breaches).
  **Time Budget:** 45–60 minutes.
  **Owners:** Trust & Safety Lead, Product Manager, Legal Counsel.
  **Philosophical Basis:** *Threshold Prioritarianism* with an *Aggregate Cap*. This framework accepts that severe harms generally trump trivial ones (rejecting pure utilitarian aggregation of "dust specks"), but acknowledges that trivial harms imposed on a massive scale can coalesce into a collective harm that outweighs specific benefits (the "Death by a Thousand Cuts" limitation).

  ---

  ## Phase 1: Severity Classification (15 Minutes)
  *Goal: Determine if the harm prevented is lexically superior to the harm inflicted.*

  **Step 1.1: Classify the Harm Prevented (HP)**
  Assign the primary harm prevented to one of three buckets.
  *   **Level 3 (Critical):** Threats to physical safety, life, liberty, or livelihood (e.g., doxxing of activists, account takeover of journalists leading to loss of platform/income).
  *   **Level 2 (Significant):** Financial loss, severe reputational damage, sustained psychological distress (e.g., targeted harassment campaigns, fraud).
  *   **Level 1 (Moderate/Minor):** Nuisance, temporary annoyance, mild confusion (e.g., spam comments, generic abuse).

  **Step 1.2: Classify the Harm Inflicted (HI)**
  Assign the friction/cost imposed on the user base to one of three buckets.
  *   **Level A (Negligible):** < 10 seconds of time, no cognitive load, no financial cost (e.g., one extra click).
  *   **Level B (Moderate):** 10 seconds – 2 minutes, minor cognitive load, workflow interruption (e.g., waiting for a comment to post, SMS verification).
  *   **Level C (Significant):** > 2 minutes, high cognitive load, barrier to access (e.g., ID upload, complex CAPTCHA).

  > **⚠️ JUDGMENT CALL FLAG:** Assigning a Level is not purely factual. A 10-second delay for a user in a hurry is different than for a user browsing casually. *Requirement:* Document the "Worst Reasonable User" assumption used to assign the level.

  **Step 1.3: The Lexical Check**
  *   If **HP is Level 3** and **HI is Level A**: Proceed to Phase 2. (Severe harm prevention trumps negligible friction *prima facie*).
  *   If **HP is Level 1** and **HI is Level B or C**: **STOP. DECISION: NO SHIP.** (Do not impose moderate/significant friction for minor benefits).
  *   *All other combinations:* Proceed to Phase 2.

  ---

  ## Phase 2: The Aggregate Cap Check (20 Minutes)
  *Goal: Determine if the scale of trivial harm converts it into a collective severe harm.*

  **Step 2.1: Calculate Total Human Time Cost (THTC)**
  *   Formula: `(Monthly Active Users Affected) × (Time Cost per User in Hours) × (Frequency per Month)`
  *   *Example:* 100M users × (5 secs / 3600) × 30 logins = ~41,666 hours/month.

  **Step 2.2: Apply the Population Cap**
  Even if HI is Level A (Negligible), it cannot be imposed on the entire user base without limit.
  *   **Threshold:** If `Users Affected` > 50% of Total Monthly Active Users (MAU) **AND** `THTC` > 10,000 hours/month.
  *   **Action:** If Threshold is met, the "Negligible" classification is upgraded to **Level B (Moderate)** for the purpose of this decision.

  > **⚠️ JUDGMENT CALL FLAG:** The 10,000-hour threshold is arbitrary. It represents a philosophical judgment that *collective waste of human autonomy* becomes a moral harm at scale, even if no individual notices. This number must be ratified by Leadership once, then treated as fixed policy.

  **Step 2.3: Re-run Lexical Check**
  *   If HI was upgraded from A to B in Step 2.2, re-evaluate against HP.
  *   If **HP is Level 3** and **HI is now Level B**: Proceed to Phase 3.
  *   If **HP is Level 2** and **HI is now Level B**: **STOP. DECISION: NO SHIP.** (Significant aggregate burden cannot be imposed for non-Critical harm prevention).

  ---

  ## Phase 3: Distributive Justice & Hand-Off (15 Minutes)
  *Goal: Identify if the burden falls unfairly on vulnerable groups.*

  **Step 3.1: Burden Concentration Check**
  *   Question: Does the friction disproportionately affect users in low-bandwidth regions, users with disabilities, or marginalized political groups?
  *   *Metric:* Compare friction completion rates by region/device type (if available) or estimate based on technical requirements (e.g., SMS verification fails in sanctioned countries).
  *   **Condition:** If estimated failure/exclusion rate > 5% for any protected demographic group.
  *   **Action:** **HAND-OFF TO ETHICS/LEGAL REVIEW.** Do not proceed.

  **Step 3.2: Final Weighing (The "Residual" Judgment)**
  *   If the procedure has not returned a Yes/No by now, the decision rests on a value judgment not capturable by metrics.
  *   **Question:** "Is the specific nature of the Harm Prevented worth the *Collective Autonomy Cost* calculated in Phase 2?"
  *   **Action:** This requires a vote. T&S Lead (1 vote), Product Lead (1 vote), Legal (1 vote). Majority wins. Document the dissenting opinion.

  ---

  # Procedure Run: Case Studies

  ## Case 1: Mandatory Verification Login
  *   **Proposal:** 5-second verification for all 100M MAU at every login.
  *   **Goal:** Prevent Account Takeover (ATO) for ~2,000 high-risk journalists/activists.
  *   **Frequency:** Avg user logs in 30 times/month.

  **Phase 1: Severity**
  *   **HP:** ATO for activists/journalists. Can lead to loss of livelihood, safety, voice. **Level 3 (Critical).**
  *   **HI:** 5 seconds friction. **Level A (Negligible).**
  *   **Lexical Check:** Level 3 vs Level A. **Pass.** Proceed to Phase 2.

  **Phase 2: Aggregate Cap**
  *   **THTC:** 100,000,000 users × (5/3600 hours) × 30 logins = **~4,166,666 hours/month.**
  *   **Population Cap:** Users Affected (100%) > 50% MAU. THTC (4.1M) > 10,000 hours.
  *   **Upgrade:** HI is upgraded from **Level A** to **Level B (Moderate).**
  *   **Re-run Lexical:** HP (Level 3) vs HI (Level B). **Pass.** Proceed to Phase 3.

  **Phase 3: Distributive Justice**
  *   **Burden:** SMS/Verification often fails in Global South or for privacy-focused users. Assume 2% failure rate generally, but potentially higher for specific at-risk regions.
  *   **Check:** Is >5% exclusion for a protected group? Likely borderline. Assume <5% for this exercise.
  *   **Final Weighing:** Vote required.
      *   *T&S:* Vote YES (Safety Critical).
      *   *Product:* Vote NO (4 million hours of user time is a massive engagement killer).
      *   *Legal:* Vote NO (Risk of accessibility lawsuits).
  *   **Result:** **NO SHIP.** (2-1 Vote).

  **Outcome Analysis:**
  The team will likely dislike this. T&S views ATO prevention as non-negotiable. However, the procedure flags that 4 million hours of human time per month is a *collective harm* that requires more than a simple "Safety Trumps All" heuristic. The scale of the "dust specks" here is so large it becomes a boulder.

  ---

  ## Case 2: First-Time Commenter Delay
  *   **Proposal:** 10-minute hold on first comment for new accounts.
  *   **Goal:** Prevent flood of abusive replies to ~500 public figures.
  *   **Scope:** Affects ~2 million new commenters/month (not all MAU).

  **Phase 1: Severity**
  *   **HP:** Flood of abuse on public figures. Psychological distress, reputational noise. **Level 2 (Significant).** (Note: Unless threats are physical, public figure abuse is often classified Level 2, not Level 3 like activists).
  *   **HI:** 10-minute delay. **Level B (Moderate).**
  *   **Lexical Check:** Level 2 vs Level B. **Proceed to Phase 2.** (No automatic trump).

  **Phase 2: Aggregate Cap**
  *   **THTC:** 2,000,000 users × (10/60 hours) × 1 time = **~333,333 hours/month.**
  *   **Population Cap:** Users Affected (2M) is < 50% of 100M MAU.
  *   **Upgrade:** HI remains **Level B.**
  *   **Re-run Lexical:** HP (Level 2) vs HI (Level B).
  *   **Rule:** Significant aggregate burden (Level B) cannot be imposed for Non-Critical harm (Level 2) *unless* Final Weighing overrides.
  *   **Status:** Proceed to Phase 3.

  **Phase 3: Distributive Justice**
  *   **Burden:** Falls on new users. Could disproportionately affect marginalized voices trying to enter the conversation (chilling effect).
  *   **Check:** Hard to measure exclusion rate immediately. Flag as risk.
  *   **Final Weighing:** Vote required.
      *   *T&S:* Vote YES (Reduces mod load, protects targets).
      *   *Product:* Vote YES (Low impact on core retention, high safety signal).
      *   *Legal:* Vote YES (Low liability).
  *   **Result:** **SHIP.** (3-0 Vote).

  **Outcome Analysis:**
  This result is acceptable to most, but note the philosophical inconsistency: In Case 1, we blocked a safety measure because the *aggregate time* was too high. In Case 2, we approved a safety measure despite *individual friction* being higher (10 mins vs 5 secs). The differentiator was **Population Scope**. The procedure prioritizes protecting the *collective user base's time* over the *individual user's patience*.

  ---

  # Limitations & Philosophical Failure Modes

  This procedure is a tool, not a moral oracle. It will systematically misdecide in the following areas:

  **1. The "Chilling Effect" Blind Spot**
  The procedure measures *time* and *exclusion rates*. It cannot measure *self-censorship*.
  *   *Failure Mode:* In Case 2, a 10-minute delay might not stop a user from posting, but it might break the "flow" of conversation, causing them to leave the platform entirely. The procedure counts the 10 minutes; it misses the lost speech.
  *   *Philosophical Gap:* This is the difference between *Negative Liberty* (freedom from interference) and *Positive Liberty* (capacity to act). The procedure measures interference, not capacity.

  **2. The "Arbitrary Threshold" Problem**
  The 10,000-hour Aggregate Cap (Phase 2.2) is a "Fake Factual."
  *   *Failure Mode:* If the THTC is 9,999 hours, the friction is Level A (Ship). If it is 10,001 hours, it is Level B (Review/Block). A change of 2 hours flips the moral logic.
  *   *Philosophical Gap:* This is the **Sorites Paradox** (The Heap). The procedure forces a sharp line on a vague concept to make it actionable. You must accept this artificial precision as a cost of doing business.

  **3. Incommensurability of Harms**
  The procedure assumes we can compare "Human Hours" against "Safety Incidents."
  *   *Failure Mode:* If the Harm Prevented is *torture* or *death*, no amount of aggregate friction should theoretically stop it (Lexical Priority). But if the friction is so high it breaks the platform, the platform ceases to exist to provide safety.
  *   *Philosophical Gap:* The procedure punts this to the "Final Weighing" vote. It cannot solve the **Non-Aggregationist vs. Aggregationist** debate; it merely schedules the argument for the end of the meeting.

  **4. Precedent and Normative Shifts**
  The procedure evaluates decisions in isolation.
  *   *Failure Mode:* Shipping Case 2 normalizes delay. Next quarter, the proposal is "30-minute delay for all low-trust users." The procedure might approve that too, as each step seems reasonable.
  *   *Philosophical Gap:* This is the **Slippery Slope** argument. The procedure lacks a "Memory" function to track how the Overton Window of friction is shifting over time.

  **Recommendation:** Run this procedure for one quarter. Then, hold a retrospective specifically on the "Fake Factual" flags. Adjust the thresholds (e.g., the 10,000-hour cap) based on the team's moral comfort, not just new data. The numbers are not truth; they are anchors for your values.
