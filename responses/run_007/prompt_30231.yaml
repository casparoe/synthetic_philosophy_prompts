    "cannot_reproduce": "The simulation cannot reproduce the actual harm of exclusion. In this classroom, being 'excluded' from the vote is a low-stakes academic exercise. In reality, being outside the demos means being subject to coercive laws without representation, often involving violence, border enforcement, or systemic disenfranchisement. The participants feel the logical paradox, but not the moral weight of actual political exclusion."
  }
