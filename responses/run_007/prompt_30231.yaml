        "facilitator_question": "The Residents argued they are 'bound' by the law. But the Neighbors are also bound by the noise, just not the fine. Is coercion only legal punishment, or any constraint on freedom?"
      },
      {
        "moment": "The initial distribution of Role Cards",
        "concept": "Arbitrary Exclusion",
        "facilitator_question": "I decided the 12 of you were in the room. In the real world, borders and citizenship often function like my decision: pre-democratic facts that determine democratic outcomes."
