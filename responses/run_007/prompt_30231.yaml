        "Timer"
      ]
    },
    "scenario": "The University District is implementing a new 'Quiet Zone' policy. Violations result in heavy fines for residents and potential eviction for tenants. The policy also restricts street usage for non-residents during night hours. The class acts as a 'Provisional Constitutional Convention.' Their task is not to vote on the policy itself, but to decide WHO is eligible to vote on the policy. However, to decide the eligibility rules, they must vote. The facilitator will not provide the initial voting rules for the convention itself.",
    "roles": [
      {
        "role": "Dorm Resident (4 participants)",
        "information": "You live in the zone. You are subject to fines and eviction (Coercion). You are disturbed by noise (Affected).",
        "objective": "Ensure the voting body includes those who live in the zone to protect property values and peace."
      },
      {
        "role": "Nearby Neighbor (4 participants)",
        "information": "You live next to the zone. You are disturbed by noise (Affected). You cannot be fined by the University (Not Coerced).",
        "objective": "Ensure the voting body includes anyone impacted by noise, regardless of university status."
      },
      {
        "role": "Commuter Student (2 participants)",
        "information": "You study in the zone but live elsewhere. You are restricted from using streets at night (Coercion). Noise affects your study (Affected).",
        "objective": "Argue that physical presence during the day should grant voting rights."
      },
      {
        "role": "University Admin (2 participants)",
        "information": "You enforce the rules. You are not disturbed by noise (Not Affected). You are not fined (Not Coerced).",
        "objective": "Argue that only those with legal jurisdiction should decide."
      }
    ],
    "phases": [
      {
        "phase": "Setup and Role Assignment",
        "minutes": 5,
        "instructions": "Distribute Role Cards. Tell participants: 'You are a Convention tasked with setting the voting eligibility for the Quiet Zone Policy. You must produce a written rule defining who gets a vote. You have 15 minutes.' Do not specify how the Convention itself makes decisions. Place the 20 Stakeholder Profile Cards on a side table (includes profiles like 'Future Student', 'Local Business Owner', 'City Councilor')."
      },
      {
        "phase": "The Boundary Struggle",
        "minutes": 15,
        "instructions": "Participants will attempt to draft the eligibility rule. When they propose a vote to adopt a rule, the Facilitator must ask: 'Who is entitled to vote on this rule?' If they say 'Everyone here,' ask 'Why these 12 people?' If they say 'Only residents,' ask 'Who decided that?' If they try to include outsiders from the Profile Cards, ask 'By what authority do you invite them?' The goal is to induce frustration regarding the source of their own authority."
      },
      {
        "phase": "The Principle Clash",
        "minutes": 10,
        "instructions": "Guide them to test two specific criteria against the Role Cards. 1. 'All Affected Interests' (AAI): Ask Neighbors if they are affected. (Yes). Ask Admin if they are affected. (No). 2. 'All Subject to Coercion' (ASC): Ask Dorm Residents if they are coerced. (Yes). Ask Neighbors if they are coerced. (No). Highlight that these two principles yield different voter lists. Force a vote on which principle to use, triggering the circularity again (who votes on the principle?)."
      },
      {
        "phase": "Debrief and Theory Mapping",
        "minutes": 15,
        "instructions": "Stop the simulation. Move to whiteboard. Map their frustrations to democratic theory. Ask the specific debrief questions listed in the 'debrief' field. Reveal that the 12 of them were arbitrarily selected by the professor, mirroring the 'arbitrary' nature of historical boundaries."
      }
    ],
    "debrief": [
      {
        "moment": "When participants asked 'Who decides the rules?'",
        "concept": "The Circularity Problem (Whelan)",
        "facilitator_question": "When you asked me who had the right to vote on the eligibility rule, I refused to answer. Why was that question impossible to answer democratically without assuming the answer?"
      },
      {
        "moment": "When Neighbors claimed a vote based on noise",
        "concept": "All Affected Interests (AAI)",
        "facilitator_question": "The Neighbors argued they were 'affected.' If we include everyone affected, do we include the families of the neighbors? The businesses that sell earplugs? Where does the chain of effect stop?"
