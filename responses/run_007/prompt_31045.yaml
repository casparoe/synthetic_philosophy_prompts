  This case isolates the variable of *Length* without changing the *Depth* tier, forcing her to reveal where the "tipping point" for intransitivity actually lies.

  ### 5. Framing the View for Your Piece
  **The Strongest Consideration to Change Your Mind:**
  The **"Money Pump" Argument**. If she truly believes $Y > X > Z > Y$ (local intransitivity), she must accept that a rational agent could be exploited. (e.g., Pay $1 to switch Z to Y, pay $1 to switch Y to X, pay $1 to switch X to Z... ending up where you started but poorer).
