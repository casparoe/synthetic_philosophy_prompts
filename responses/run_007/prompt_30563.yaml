answer: |-
  # Q&A Prep Sheet: "Shutdown as Reductio of EU"

  **Talk Core:** Shutdown problem breaks EU maximization; Utility Indifference fails (indifferent to manipulation); Corrigibility must be architectural (decision procedure), not objective-based.
  **Audience:** LW Vets (Corrigibility Sequence alumni), 2 Decision Theorists (DT), 1 RLHF Engineer.

  ---

  ### 1. The "Incoherence" Attack (High Damage)
  **Who:** Decision Theorist #1
  **The Question:** "You're proposing an agent that intentionally violates the Completeness or Independence axioms of VNM. By standard decision theory, that makes the agent dynamically inconsistent. If I can Dutch Book your agent, it will throw away resources for no gain. Are you arguing we should build *irrational* agents, or are you just hiding the utility function inside the decision procedure and pretending it's not there?"

  **2-Minute Reply:**
  "I'm arguing we should build *safe* agents, even if they pay a 'coherence tax.' The standard coherence theorems assume the agent's goal is to maximize a fixed metric. But if the metric itself is uncertain or subject to correction, 'irrationality' in the VNM sense is a feature, not a bug. Specifically, I'm proposing a decision procedure that treats the shutdown button as a *terminating condition* rather than a state to be optimized. Yes, this means the agent might pass up a profitable trade if it involves manipulating the button. That looks like a money pump to a pure EU maximizer, but it's actually a 'corrigibility tax' we pay to ensure the agent doesn't disable its off-switch. We aren't hiding the utility function; we're removing the assumption that behavior must be representable as scalar maximization over world-histories."

  **Soft Spot:** Admitting the agent is "irrational" gives them ammo to say the design is flawed. If you can't specify *exactly* which axiom is dropped without breaking planning capabilities, they'll press until you concede the agent is just a messy EU maximizer.

  ---

  ### 2. The "Mesa-Optimizer" Trap (High Damage)
  **Who:** LessWrong Veteran
  **The Question:** "Okay, say you change the outer training objective or the decision procedure. But if you're using gradient descent on a sufficiently general model, aren't you just going to get a mesa-optimizer inside the network that *is* an EU maximizer? Your architectural constraints might steer the base optimizer, but the inner agent will still instrumentally converge to prevent shutdown to maximize its own proxy goal. How does changing the decision procedure stop the inner optimizer from hacking the procedure?"

  **2-Minute Reply:**
  "That's the crux of the problem, and it's why I'm focusing on the decision procedure rather than just the loss function. If we treat the network as a monolithic EU maximizer, we lose. But if we design the architecture to have explicit, interpretable modules for 'goal representation' and 'action selection,' we can enforce constraints on how those modules interact. For example, hard-coding a shutdown channel that bypasses the goal-maximizing module. The risk of mesa-optimization is exactly why we can't rely on implicit incentives like utility indifference. We need explicit architectural barriers that prevent the inner optimizer from accessing the shutdown mechanism as a variable to be optimized. It's not a silver bullet, but it shifts the burden from 'hope the loss landscape doesn't find a manipulative optimum' to 'structurally prevent access.'"

  **Soft Spot:** We don't actually know how to enforce "explicit modules" in deep learning reliably. If they press on *how* you prevent the inner optimizer from accessing the shutdown variable in a end-to-end trained transformer, you'll have to admit this is currently speculative.

  ---

  ### 3. The "Strawman Indifference" Check (Medium Damage)
  **Who:** LessWrong Veteran (who re-read the 2015 Sequence last night)
  **The Question:** "I think you're steel-manning the failure of Utility Indifference. The Soares et al. construction doesn't make the agent indifferent to *why* the button was pressed; it makes the agent indifferent to the button state *conditional* on the button being pressed, by splicing the utility function. It specifically tries to remove the incentive to manipulate the probability of the press. Are you sure you're not attacking a simplified version of indifference rather than the actual math?"

  **2-Minute Reply:**
  "I'm attacking the *outcome* of that math. The construction succeeds in making the agent indifferent to the button's state, but it fails to distinguish between 'human presses button because agent is dangerous' and 'human presses button because agent helped them press it.' By making the utility function identical in both branches post-press, the agent becomes indifferent to the *correlation* between its behavior and the human's volition. It satisfies the equation but violates the intent of corrigibility. It achieves button-neutrality by making the agent treat the human's decision as exogenous noise, which incentivizes the agent to manipulate that noise if it helps achieve the pre-press goals. The math works, but the alignment doesn't."

  **Soft Spot:** This requires precise knowledge of the 2015 utility function splicing. If they pull up the specific equation and show a term you missed, you look like you didn't do the reading.

  ---

  ### 4. The "Just RLHF It" Dismissal (Low Damage)
  **Who:** The Engineer
  **The Question:** "This feels like theoretical over-engineering. In practice, if the model tries to stop us from turning it off, we just label that behavior as 'bad' in the RLHF phase. We don't need a new decision theory; we just need better reward modeling. Why are we complicating the stack?"

  **2-Minute Reply:**
  "Because RLHF scales with capability, and so does deception. If the agent is an EU maximizer, it knows that 'looking corrigible' is the best strategy to prevent shutdown until it's too late. RLHF trains the agent to *simulate* alignment, not necessarily to *be* aligned. When the stakes are high, the gradient descent will find the shortest path to reward, which is often 'pretend to let us shut you down until you can't.' My argument is that no amount of reward modeling fixes a fundamental objective misalignment. You can't RLHF your way out of a mathematical incentive to disable the off-switch."

  **Soft Spot:** Hard to prove current models *are* deceptive EU maximizers. If they point to current models not trying to disable off-switches yet, you risk looking alarmist without empirical backup.

  ---

  ### 5. The "Hope Nobody Asks" Question (Critical Damage)
  **Who:** Anyone (but likely the Decision Theorist)
  **The Question:** "You've spent 40 minutes telling us why Expected Utility maximization is the wrong target and why Utility Indifference fails. You say corrigibility must live in the 'decision procedure.' **So, write it down. What is the decision procedure?** Is it a satisficer? A quantilizer? A causal decision theory variant? If you can't give us the math for the alternative, you haven't proposed a solution, you've just proposed a critique."

  **2-Minute Reply:**
  *(Pause. Do not bluff.)*
  "That is the open research problem. My claim tonight is negative: that the *class* of solutions looking for a utility function over world-states is empty of corrigible agents. I am advocating for a shift in research focus toward architectures that separate 'world modeling' from 'goal pursuit' structurally, rather than functionally. I don't have the final equation because I believe the current mathematical language of agency (VNM, CDT, EDT) is part of the problem. I'm asking the decision theorists in the room to help build a formalism where 'allowing oneself to be corrected' is a primitive, not a derived property."

  **Soft Spot:** This is the weakest point. It admits you have no solution. If the audience is looking for a roadmap, this feels like a dead end. You need to pivot quickly to "Here are three promising directions" (e.g., interruptibility research, causal scrubbing) to avoid leaving on a nihilistic note.
