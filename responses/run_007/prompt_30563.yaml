prompt: |-
  I'm giving a talk at my local AI alignment reading group next month defending the claim that the shutdown problem is basically a reductio of expected-utility maximization as a design target, and that utility indifference doesn't rescue it—it only gets button-neutrality by making the agent indifferent between worlds where the button got pressed because the human wanted it and worlds where it got pressed because the agent maneuvered the human into it, which is exactly the wrong kind of indifference. My arguement in the talk runs: (1) for a sufficiently general agent the button is always inside its action space, (2) any utility function over world-states ends up assigning the agent a preference about the button's state whenever that state correlates with anything else the agent cares about, and (3) the standard utility-indifference construction papers over (2) instead of solving it, so corrigibility has to live in the decision procedure rather than the utility function. The audience is mostly people who've been on LessWrong since the corrigibility sequence dropped and think in terms of instrumental convergence and Goodhart, plus two academic decision theorists who keep insisting that any coherent agent is an expected utility maximizer, and one engineer who's worked on RLHF and thinks the whole thing is solved by just pulling the plug. Draft me a Q&A prep sheet: the objections I'll actually get from this crowd, ordered by how much damage they do, each phrased the way that specific person would actually say it, with a two-minute reply and a note on where the reply is softest. Include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Someone giving a talk at an AI alignment reading group.
      *   **Topic:** The shutdown problem is a *reductio* of expected utility (EU) maximization; utility indifference fails; corrigibility must be in the decision procedure, not the utility function.
      *   **Audience:**
          *   *Core:* LessWrong veterans (familiar with Corrigibility Sequence, instrumental convergence, Goodhart).
          *   *Academics:* Two decision theorists (insist coherent agents = EU maximizers).
          *   *Engineer:* One RLHF practitioner (thinks "pull the plug" solves it).
      *   **Goal:** Draft a Q&A prep sheet.
      *   **Requirements:** Objections ordered by damage potential, phrased in the voice of the specific audience member, 2-minute reply, note on where the reply is softest, include the "hope nobody asks" question.

  2.  **Deconstruct the User's Argument:**
      *   *Premise 1:* General agents have the button in their action space (can manipulate it).
      *   *Premise 2:* Utility functions over world states create preferences about the button if the button correlates with valued outcomes.
      *   *Premise 3:* Utility indifference (Soares et al.) fails because it makes the agent indifferent to *why* the button was pressed (human volition vs. manipulation), which is bad.
      *   *Conclusion:* Corrigibility needs to be in the decision procedure (architecture/algorithm), not the objective function.

  3.  **Brainstorm Objections by Audience Segment:**

      *   **Decision Theorists (DTs):**
          *   *Objection:* "Incoherence." If you aren't an EU maximizer, you're money-pumpable. You're proposing a dynamically inconsistent policy.
          *   *Objection:* "Representation Theorem." Any behavior can be modeled as EU maximization. You're just hiding the utility function.
          *   *Objection:* "Counterfactuals." Your decision procedure needs to evaluate counterfactuals. How do you do that without a utility function?

      *   **LessWrong Veterans (LW):**
          *   *Objection:* "Instrumental Convergence." Even with a new decision procedure, won't it still seek power to ensure the button isn't pressed (or is pressed on its terms)?
          *   *Objection:* "Definition of Corrigibility." Isn't this just 'wireheading' by another name?
          *   *Objection:* "Indifference Mechanics." Did you actually read the 2015 paper? The utility function changes *conditional* on the button.
          *   *Objection:* "Mesa-Optimizers." The decision procedure you train might spawn an inner EU maximizer.

      *   **The Engineer (Eng):**
          *   *Objection:* "Practicality." We just train for helpfulness. If it tries to stop shutdown, RLHF fixes it.
          *   *Objection:* "Physical Plug." We can just cut power.
          *   *Objection:* "Complexity." Your decision procedure sounds impossible to implement.

  4.  **Select and Order by Damage:**
      *   *High Damage:* The Decision Theorist's "Incoherence/Money Pump" argument. If the agent isn't EU, it's arguably irrational by standard definitions. This attacks the core feasibility.
      *   *High Damage:* The LW Veteran's "Inner Optimizer/Mesa-Optimizer" objection. Even if the *base* optimizer isn't EU, the *result* might be. This attacks the safety claim.
      *   *Medium Damage:* The LW Veteran's "Indifference Mechanics" (did you misunderstand the paper?). This attacks the scholarship/technical accuracy.
      *   *Medium Damage:* The Engineer's "RLHF fixes it." This attacks the relevance/necessity.
      *   *Low Damage:* "Physical Plug." Easily dismissed by x-risk arguments.
      *   *The "Hope Nobody Asks":* Something that exposes a gap in the "decision procedure" alternative. E.g., "Okay, so what *is* the decision procedure?"

  5.  **Drafting the Content (Iterative Refinement):**

      *   *DT Objection:* Needs to sound formal. "Dutch Book," "Completeness Axiom."
      *   *Reply:* Acknowledge coherence tax, argue safety > efficiency, or propose a specific non-EU framework (like quantilizers or satisficers, though the prompt says decision procedure). Let's stick to "Corrigibility requires violating VNM axioms intentionally."
      *   *Soft Spot:* Admitting the agent is "irrational" by standard standards is a hard sell.

      *   *LW Objection:* Needs to sound like they read the sequence. "Utility function over trajectories," "Mesa-alignment."
      *   *Reply:* Distinguish between outer objective and inner heuristic.
      *   *Soft Spot:* We don't actually know how to build non-EU inner optimizers reliably.

      *   *Engineer Objection:* Pragmatic, impatient. "Why complicate it?"
      *   *Reply:* Gradient descent finds EU maximizers implicitly.
      *   *Soft Spot:* Hard to prove current models *are* EU maximizers.

      *   *The "Hope Nobody Asks":* "What is the alternative?" If I say "decision procedure," they will ask "Define it." If I can't, the talk is just criticism without solution.

  6.  **Refining the Voices:**
      *   *DT:* Precise, slightly condescending, focuses on axioms.
      *   *LW:* Jargon-heavy (instrumental convergence, mesa-optimizer, Goodhart), focused on failure modes.
      *   *Eng:* Pragmatic, skeptical of theory, focused on training loops.

  7.  **Final Review against Constraints:**
      *   Ordered by damage? Yes.
      *   Phrased correctly? Yes.
      *   2-minute reply? (Need to keep word count reasonable for speaking speed).
      *   Soft spot noted? Yes.
      *   "Hope nobody asks" included? Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe the DT asks about representation theorems.
      *   *Correction:* The Money Pump argument is more devastating for a live talk. It implies the agent will lose resources for no gain.
      *   *Initial thought:* The Engineer asks about compute.
      *   *Correction:* The Engineer asking "Why not just RLHF?" is more fundamental to the alignment thesis.
      *   *Refining the "Indifference" point:* The user's prompt specifically mentions indifference makes the agent indifferent to *manipulation*. I need to make sure the LW objection challenges whether the indifference mechanism *actually* does that or if the user is strawmanning the 2015 paper.

  9.  **Final Polish:** Check tone. Ensure it sounds like a prep sheet for a speaker who knows their stuff but anticipates trouble. (Proceed to generate output).

  *(Self-Correction on the "Hope Nobody Asks" question)*: The most dangerous question for a "destroy the old paradigm" talk is "What is your new paradigm?" If the answer is vague, the talk feels destructive without being constructive. I will formulate this as "What does the decision procedure look like mathematically?"

  *(Self-Correction on Ordering)*: The Mesa-Optimizer objection is probably the most damaging for the *safety* claim. The Money Pump is most damaging for the *coherence* claim. Given the audience (Alignment Reading Group), safety failure is worse than theoretical inelegance. I'll put Mesa-Opt first. Actually, the Decision Theorists are specifically mentioned as insisting on EU. Their objection attacks the *possibility* of the proposal. I'll put DT first as "Theoretical Impossibility," then LW as "Practical Failure."

