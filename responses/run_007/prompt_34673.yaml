answer: |-
  Your intuition is spot-on. The passage you quoted is a classic example of an introductory text presenting a *dialectical objection* as if it were a *settled verdict*. It accurately describes the challenge as it stood in the late 1960s and 70s, but it fails to account for the last 50 years of metaethical development, specifically the rise of **quasi-realism** and **norm-expressivism**.

  Here is an accuracy audit of the passage, broken down by your three questions.

  ### (a) What an expressivist would accept as fair

  An expressivist (even a sophisticated one like Blackburn or Gibbard) would agree with the structural setup of the problem. They would endorse the following claims in the passage:

  1.  **The Definition of Expressivism:** The statement that expressivists view moral sentences as expressing non-cognitive attitudes rather than describing facts is standard. (Though Gibbard might nuance "attitude" to "plan" or "norm-acceptance," the non-descriptive core is correct.)
  2.  **The Data of Embedded Contexts:** The observation that moral sentences appear in conditionals, questions, and negations ("If lying is wrong...") is the correct starting point. Expressivists agree that any adequate semantics must account for this.
  3.  **The Requirement of Compositionality:** The claim that "any minimally adequate semantic theory must be compositional" is widely accepted. Expressivists do not want to deny compositionality; they want to show how their theory satisfies it.
  4.  **The Link to Logic:** The passage correctly identifies that the stakes involve logical validity. If the meaning of "wrong" shifts between asserted contexts ("Lying is wrong") and embedded contexts ("If lying is wrong..."), then standard logical inferences (like *modus ponens*) appear to commit the fallacy of equivocation. Expressivists agree this is the hurdle they must clear.

  In short, the passage accurately states the **constraints** that the Frege–Geach problem imposes on expressivism.

  ### (b) Subtle mischaracterizations and conflations

  This is where the passage becomes "too tidy." It conflates the *initial formulation* of the problem with the *current state* of the theory. A defender of modern expressivism would push back on the following:

  **1. "Expressivism... offers no account of what the very same words contribute... when they appear in an embedded position."**
  *   **The Pushback:** This is historically false regarding contemporary expressivism. It might have been true of A.J. Ayer's emotivism in the 1930s, but it is not true of Simon Blackburn's *quasi-realism* or Allan Gibbard's *norm-expressivism*.
  *   **The Detail:** Blackburn explicitly developed a logic of attitudes to show how moral terms function in complex sentences without referring to facts. Gibbard developed a semantics based on "consistency of planning" rather than truth-conditions. To say expressivism "offers no account" ignores the primary philosophical work these figures have done. The passage treats the *challenge* as if it were a *demonstrated failure*.

  **2. "Expressivists cannot explain the compositional semantics of moral language."**
  *   **The Pushback:** This presents a contested philosophical claim as a settled fact. Many metaethicists believe Blackburn and Gibbard *have* provided viable (if controversial) compositional semantics.
  *   **The Detail:** The passage assumes a truth-conditional semantics is the *only* kind of compositional semantics. Expressivists argue that we can have a compositional semantics based on **assertibility conditions**, **commitment**, or **consistency** rather than truth. By assuming truth-conditionalism is the only game in town, the passage stacks the deck against expressivism.

  **3. "Because expressivists cannot explain... how moral arguments can be logically valid..."**
  *   **The Pushback:** This conflates the *problem* with the *result*. The Frege–Geach problem argues that expressivists *struggle* to explain validity (specifically, the "validity problem" or "inconsistency problem"). However, quasi-realists argue they can "earn the right" to talk about truth and validity within their framework.
  *   **The Detail:** Blackburn argues that we can project our attitudes into a "realist-sounding" discourse. We can say an argument is "valid" not because it preserves truth (since there are no moral truths), but because it preserves **consistency of attitude**. Whether this is fully successful is debated, but to say they "cannot explain" it is to dismiss the quasi-realist project prematurely.

  ### (c) Does the conclusion ("expressivism simply collapses") follow?

  **No, the conclusion does not follow from the accurate parts of the summary.** It depends entirely on the questionable claims identified in section (b).

  Here is the logical structure of the passage's argument:
  1.  **Premise 1:** Moral language appears in embedded contexts. (True)
  2.  **Premise 2:** Expressivism defines moral language as expressing attitudes in asserted contexts. (True)
  3.  **Premise 3:** Expressivism *cannot* explain how those attitudes function in embedded contexts without losing compositionality/logic. (**Contested/False**)
  4.  **Premise 4:** Any theory that fails compositionality/logic collapses. (True)
  5.  **Conclusion:** Expressivism collapses.

  The argument is valid, but **Premise 3 is the point of contention**. The passage asserts Premise 3 as a fact, but in the actual philosophical landscape, Premise 3 is the *subject of the debate*, not the *premise of the refutation*.

  If you replace Premise 3 with a more accurate formulation—*"Expressivism faces a significant challenge in explaining how those attitudes function in embedded contexts"*—the conclusion changes to: *"Expressivism must solve this challenge to remain viable."*

  That is precisely why you heard that F-G is now viewed as a **research program**. It is a constraint that expressivists must satisfy, not a tombstone that has already been placed on the theory.

  ### Summary for your Seminar

  If you bring this up in class, here is the most precise way to frame your critique of the textbook:

  > "The passage accurately describes the **Frege–Geach objection**, but it presents it as a **refutation**. It conflates the difficulties faced by *classical* emotivism (like Ayer's) with the capabilities of *sophisticated* expressivism (like Blackburn's quasi-realism). While the problem requires expressivists to develop a non-truth-conditional compositional semantics, figures like Blackburn and Gibbard argue they have done exactly that. Therefore, the claim that expressivism 'simply collapses' is an overstatement that ignores the last half-century of metaethical literature."

  Your instructor will likely appreciate this distinction. It shows you aren't just memorizing the "standard objection," but you understand the dialectic between the objection and the sophisticated responses it provoked.
