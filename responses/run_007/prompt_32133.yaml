prompt: |-
  I'm a software engineer with no formal philosophy background, so please define any technical terms you use. Lately I keep running into the phrase "gender is a social construct" in online arguments. Sometimes it's used to shut down someone who points to biological sex differences; other times I see "race is a social construct" used to say racial categories don't carve nature at the joints; and "money is a social construct" shows up when people want to say its value is just a matter of collective belief. I've also seen the comeback "well, everything is socially constructed, so what?" which seems to annoy the person who said it, and I get the sense the same three words are doing different jobs depending on who says them, and I can't seperate out what it actually claims.

  Could you act as a professional philosopher working in social ontology and metaphysics, and help me pull apart the slogan "X is a social construct" (with race, gender, and money as the main fillings)? I want a menu of the distinct precise claims that slogan could be making, from the boring or trivial readings to the strong or radical ones. For each reading, tell me whether it's plausible, false, or contested, and whether it actually supports the argumentative work people are trying to get out of it — e.g. "so biological sex differences don't matter", "so racial categories are made up and we should drop them", "so money has no value beyond our attitudes". Be concrete about what "construct" might mean: a classification scheme, a causal feedback loop, mind-dependence, an institutional fact, something that exists only because we treat it as existing, and so on.

  Think carefully and brainstorm several candidate readings before you settle on the final list. Don't just pick one reading and explain it — I need the disambiguation, with verdicts. Please write the whole answer in British English. And I don't need citations or reading lists, just the analysis itself.
