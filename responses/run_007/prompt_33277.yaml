answer: |-
  ### Tier 1: Existential Threats (The "Fatal" Risks)
  *These arguments threaten the coherence or viability of the project itself. Defenders cannot dismiss these as mere intuition pumps; they require substantive theoretical concessions.*

  **1. Curry's Paradox and Structural Weakening**
  *   **The Challenge:** Unlike the Liar, Curry's paradox does not rely on negation. It relies on the conditional, modus ponens (MP), and contraction. A standard paraconsistent logic like LP (Logic of Paradox) blocks explosion but retains MP and contraction; therefore, LP is insufficient to block Curry. To solve Curry while maintaining a naive truth theory, you must weaken the conditional (e.g., to a relevant or fuzzy conditional) or abandon structural rules like contraction.
  *   **The Cost:** This forces a retreat from the "minimal mutilation" claim. If you must abandon contraction or restrict MP to save the view, you are mutilating the logic of *conditionals* and *deduction* far more than the Liar alone forces.
  *   **Defender's Concession:** Prominent dialetheists (e.g., Beall, Priest in later work) concede this. They acknowledge that a uniform solution to all paradoxes requires a non-contractive logic or a very weak conditional.
  *   **Assessment:** This is the strongest technical defeater. If the logic becomes too weak to support standard mathematical reasoning (e.g., naive set theory becomes unusable), the view loses its utility. The insulation here is **risky**: if the "fix" for Curry renders the logic too impoverished for science or math, the view collapses into a purely philosophical curiosity.

  **2. The Slide to Trivialism**
  *   **The Challenge:** If some contradictions are true, what prevents *all* contradictions from being true? The dialetheist must draw a non-arbitrary boundary between "true contradictions" (Liar) and "false contradictions" (1 = 0). In classical logic, explosion enforces this boundary automatically. In paraconsistent logic, you need a separate criterion (e.g., "normal worlds," "closure conditions," or "empirical adequacy").
  *   **The Cost:** You lose the *automatic* guarantee of consistency. You must provide a positive theory of why the world is *mostly* consistent without relying on the logical law of non-contradiction.
  *   **Defender's Concession:** Defenders admit they cannot prove trivialism false (since proving it false would imply consistency). They argue trivialism is "unmotivated" or "empirically inadequate."
  *   **Assessment:** This is not a logical refutation but a burden of proof shift. It is **fatal only if** the dialetheist cannot provide a principled distinction between true and false contradictions that doesn't implicitly rely on classical consistency. Currently, the distinction often rests on pragmatic or semantic grounds which critics argue are unstable.

  ---

  ### Tier 2: Substantive Concessions (Theoretical Costs)
  *These are arguments that defenders acknowledge count against the view but argue are worth the cost. They represent a loss of expressive or inferential power.*

  **3. The Strengthened Liar and Expressive Limitations**
  *   **The Challenge:** Can the dialetheist express the proposition "This sentence is false only"? In LP, the standard exclusion negation is not available. If you introduce a new operator (e.g., "determinately false" or "exclusion negation") to express this, you risk generating a new revenge paradox using that very operator.
  *   **The Cost:** The dialetheist may be unable to express their own central distinction (glut vs. gap vs. classical) within the object language. They must retreat to the meta-language to say what they mean.
  *   **Defender's Concession:** Priest admits LP lacks an expressive exclusion operator. He argues this is a limitation of the *language*, not the *ontology*, and that we can communicate the distinction pragmatically.
  *   **Assessment:** This is a **significant theoretical cost**. If a semantic theory cannot express the semantic status of its own sentences, it faces a pragmatic self-defeat. However, it is not fatal if the meta-language is sufficient for theory construction.

  **4. Minimal Mutilation vs. Paracomplete Alternatives**
  *   **The Challenge:** Paracomplete views (e.g., Kripke, Field) reject the Law of Excluded Middle (LEM) but keep Disjunctive Syllogism (DS). Dialetheism keeps LEM but rejects DS. In standard mathematical and scientific practice, DS ($A \lor B, \neg A \vdash B$) is used constantly; LEM is less frequently invoked as an inference rule.
  *   **The Cost:** Dialetheism invalidates a more "useful" classically valid inference (DS) than paracomplete views do (LEM). Field argues that losing DS makes reasoning about cases (proof by cases) much harder.
  *   **Defender's Concession:** Defenders concede DS is invalid in LP. They argue DS is "classically valid but not universally valid" and that we can recover it for "consistent domains."
  *   **Assessment:** This weighs **against** dialetheism in the "minimal mutilation" contest. Paracomplete approaches preserve more standard inference patterns relevant to daily reasoning. The dialetheist must argue that preserving LEM is more important than preserving DS, which is a hard sell outside of specific metaphysical commitments.

  ---

  ### Tier 3: Pragmatic and Conceptual Friction (Awkward but Manageable)
  *These arguments create friction in the account of rationality and communication but do not threaten the formal core.*

  **5. Rejection, Denial, and Rational Belief**
  *   **The Challenge:** If $A$ and $\neg A$ are both true, can I rationally reject $A$? If belief aims at truth, and $A$ is true, shouldn't I believe it? But if I believe $A$ and $\neg A$, how do I disagree with a trivialist? Priest introduces "denial" as a primitive speech act distinct from "asserting negation."
  *   **The Cost:** It splits the link between truth and belief, and between negation and disagreement. It requires a dual-normative system (acceptance/rejection) that doesn't map 1:1 onto truth/falsity.
  *   **Defender's Dismissal:** Defenders argue this is a feature, not a bug. They claim classical logic conflates negation with denial. They concede it is "awkward" but argue it is the only way to make sense of rational disagreement in a glutty world.
  *   **Assessment:** This is **awkward but survivable**. It makes the normativity of logic more complex, but not incoherent. It counts against the *simplicity* of the view, not its truth.

  **6. The "Verbal Variant" Charge**
  *   **The Challenge:** Is dialetheism just a consistent theory (e.g., Kripke's fixed point) described using different words? If the dialetheist says "The Liar is true and false," but treats it differently than "2+2=4 and 2+2=5," aren't they implicitly relying on a consistent meta-theory to distinguish the two?
  *   **The Cost:** The view risks becoming a "consistent dialetheism," where the contradictions are only true *within* the model, but the model itself is consistently described.
  *   **Defender's Dismissal:** Defenders insist the contradiction is in the world/language, not just the model. They argue the meta-theory can also be paraconsistent.
  *   **Assessment:** This is a **methodological warning**. If the dialetheist uses classical logic to prove the soundness of their paraconsistent system, the view collapses into a consistent instrumentalism. To avoid this, they must practice what they preach at the meta-level, which is difficult to formalize.

  ---

  ### Tier 4: Dismissible Objections (Question-Begging)
  *These arguments should be set aside. They assume the falsity of dialetheism to prove it false.*

  **7. "Contradictions Cannot Be True" (Intuition)**
  *   **Assessment:** **Dismiss.** This is the *explanandum*, not a defeater. Citing the Law of Non-Contradiction as a premise against dialetheism begs the question.
  **8. "It Makes Rational Debate Impossible"**
  *   **Assessment:** **Dismiss.** As long as the dialetheist has an account of denial (see Tier 3), debate is possible. This objection assumes explosion or classical norms of assertion without argument.
  **9. "It Violates Classical Logic"**
  *   **Assessment:** **Dismiss.** This is the definition of the view. It only counts if one assumes classical logic is the only correct logic, which is the point in dispute.

  ---

  ### Assessment of Insulation and Qualifications

  **Has the view been insulated by qualifications?**
  Yes. The modern dialetheist program (particularly the "Canberra Plan" style of Beall and Priest) has developed a robust "protective belt" of qualifications:
  1.  **Denial** is primitive (insulates against normative collapse).
  2.  **Contraction** is restricted (insulates against Curry).
  3.  **Truth** is non-exhaustive (allows for gaps *and* gluts, insulating against forced choices).
  4.  **Validity** is defined as preservation of non-falsity rather than truth (insulates against DS counterexamples).

  **Is this insulation a problem?**
  *   **The Risk:** It risks degenerating into a Lakatosian "degenerating research program" where every counterexample is met with a new distinction (e.g., "that's not *real* denial," "that conditional isn't *real* implication"). If every failure of classical intuition is explained away by a new technical qualification, the view becomes unfalsifiable.
  *   **The Defense:** The qualifications are not *ad hoc* if they have independent motivation. For example, independent reasons for rejecting contraction (from resource sensitivity or relevance) strengthen the Curry reply. Independent pragmatic reasons for distinguishing assertion and denial strengthen the normativity reply.
  *   **Honest Verdict:** The insulation is **currently stable but costly**. The view has not collapsed, but it has moved far from the simple slogan "Some contradictions are true." It is now a complex system of non-classical semantics, pragmatics, and structural logic. The cost is that the view is no longer a simple "fix" for paradoxes but a comprehensive revision of logic, semantics, and epistemology.

  **Summary Map for the Dialetheist:**
  *   **Worry most about:** Curry (structural costs) and Trivialism (boundary maintenance).
  *   **Accept as costs:** Loss of DS, expressive limitations regarding "false only."
  *   **Manage via pragmatics:** Rejection/Denial norms.
  *   **Ignore:** Appeals to classical intuition or LNC.
  *   **Monitor:** Whether the protective qualifications are gaining independent support or merely patching holes. If the latter, the view is in trouble.
