      *   *Future Credence ($C_{t+1}(P)$):* Model's predicted probability after an update step (online learning, fine-tuning, or just context window progression).
      *   *Rationality/Calibration:* Expected Calibration Error (ECE), Proper Scoring Rules (Brier, Log Loss).
      *   *Martingale:* The sequence of predictions forms a martingale with respect to the filtration of information. $E[\hat{y}_{t+1} | \mathcal{F}_t] = \hat{y}_t$.
      *   *Sleeping Pill:* Distribution shift, adversarial perturbation, corrupted update rule, RLHF reward hacking.
      *   *Expert Deference:* Distillation, ensemble weighting, teacher-student models.

  4.  **Drafting the Restatement (Section 1):**
      *   *The Principle:* Define it as a martingale property of the model's confidence scores over time. If the model is well-calibrated and updates optimally, today's probability should be the expectation of tomorrow's probability.
      *   *The "Expert" Frame:* Treat the future checkpoint (or future inference state) as a "teacher" model.
      *   *Dutch Book:* Arbitrage. If the martingale property fails, you can construct a betting strategy (or loss function) that exploits the inconsistency between $t$ and $t+1$.
      *   *The Sleeping Pill:* This is "known distribution shift" or "anticipated model degradation." If I know the next update step uses poisoned data (RLHF reward hacking), I shouldn't trust the next checkpoint's confidence.
