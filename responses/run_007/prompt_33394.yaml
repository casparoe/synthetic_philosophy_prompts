      *   *Simplified:* $E_t[C_{t+1}(P)] = C_t(P)$. Current credence is the expectation of future credence.
      *   *Core Intuition:* Treat future self as an expert.
      *   *Counterexamples:* Sleeping pill (future self irrational), forgetting (loss of information), self-fulfilling prophecies (belief causes truth).

  3.  **Map to ML Vocabulary:**
