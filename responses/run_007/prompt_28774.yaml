      *   *Addressing the Prompt:* Make sure all four sub-questions are answered explicitly.
      *   *Self-Correction during drafting:* I initially thought about focusing heavily on Duff. I should mention him, but keep Strawson central since the friend named him. I need to make sure I don't dismiss the equity concern; it's a strong objection to the theory's application.

  5.  **Final Review against constraints:**
      *   Did I reconstruct the theory? Yes (Communicative/Strawsonian).
      *   Is it coherent? Yes, with caveats.
      *   Do rival theories work? Yes (Consequentialism, Classic Retributivism).
      *   What changes under consequentialism? Yes (Risk assessment over performance).

