          2.  *The Translational Code (The Codon Table):* Specific mapping between triplets and amino acids. Mediated by tRNA/ribosomes. Literal in a biochemical sense, but local (protein synthesis only).
          3.  *Semantic Information (Dretske/Maynard Smith):* DNA carries "meaning" about the environment or phenotype. Requires a function/evolutionary history.
          4.  *The Blueprint/Program (Determinism):* DNA contains the *whole* plan. This is the strong claim critics attack.
      *   **Addressing the "Literal vs. Metaphor" Conclusion:**
