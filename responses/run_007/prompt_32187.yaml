      *   What is their objection? It's not that DNA *doesn't* carry information in a Shannon sense. It's that calling it "information" implies a sender/receiver, intentionality, or causal privilege that isn't biologically justified.
      *   Does "DNA is a code" settle this?
          *   If "code" = Level 1 or 2, no. It doesn't imply semantic content or causal supremacy.
          *   If "code" = Level 3 or 4, yes, but those claims require justification beyond the existence of the codon table.
      *   *The Equivocation:* The slide happens between Level 2 (codon table exists) and Level 4 (DNA determines traits/organism).

