      *   *Nuance:* Be careful with "Excluded Middle." Supervaluationists *keep* $P \lor \neg P$ as super-true, even though neither $P$ nor $\neg P$ is super-true. This is a weird but crucial distinction. Epistemicists find this weird.
      *   *Emphasis:* Highlight that for the Epistemicist, the boundary is *real* (semantic fact), whereas for the Supervaluationist, the boundary is *absent*. This isn't just labeling; it's ontology.

