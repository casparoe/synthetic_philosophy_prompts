answer: |-
  This is an exceptionally sharp question. You have put your finger on the exact friction point that makes the vagueness debate so enduring. It often feels as though the Epistemicist and the Supervaluationist are describing the same landscape but arguing over the map legend.

  However, the disagreement is not merely verbal. While both views agree on the *phenomenology* (we can't find the line) and the *practical outcomes* (we don't topple civilization by arguing about heaps), they diverge significantly on **truth conditions**, **modal claims**, and **higher-order vagueness**.

  Here is a breakdown of the substantive differences, why the logic trade-off matters, and what actually tips the scales for philosophers on either side.

  ### 1. The Substantive Difference: Existential Claims
  The most concrete divergence lies in how the two views handle specific existential statements.

  Consider the statement:
  > **(S)** "There exists a specific number $n$ such that a collection of $n$ grains is a heap, but $n-1$ grains is not."

  *   **The Epistemicist says (S) is TRUE.**
      For the epistemicist (like Timothy Williamson), the extension of the word "heap" is a precise set of numbers. There *is* a fact of the matter. The boundary is a semantic reality, even if it is cognitively inaccessible.
  *   **The Supervaluationist says (S) is FALSE (or not super-true).**
      For the supervaluationist (like Kit Fine), "heap" is semantically incomplete. There are many admissible ways to make "heap" precise (precisifications). On one precisification, the cut-off is at 5,000 grains; on another, it's at 5,050. Since there is no *single* $n$ that serves as the cut-off across *all* admissible precisifications, the existential claim fails.

  This is not a verbal dispute. It is a disagreement about whether a specific semantic fact obtains. If you are a supervaluationist, you deny the existence of the sharp boundary. If you are an epistemicist, you affirm it.

  ### 2. The Logic Trade-off: Bivalence vs. Excluded Middle
  You asked why preserving classical logic is worth the price of "magic" boundaries. The answer lies in the specific costs of modifying logic.

  **Supervaluationism** tries to have its cake and eat it too. It wants to say borderline sentences lack a truth value (rejecting **Bivalence**) but still wants to say "Either this is a heap or it isn't" is true (preserving **Excluded Middle**).
  *   *The Cost:* This creates a gap between truth and assertibility. A supervaluationist must accept that $P \lor \neg P$ is true, even though neither $P$ nor $\neg P$ is true. This breaks the link between truth and disjunction that classical logic relies on. It complicates the theory of probability (what is the probability of a borderline claim?) and conditionals.

  **Epistemicism** keeps classical logic intact.
  *   *The Cost:* It forces us to accept that for any borderline case, one of the contradictory claims is strictly true and the other strictly false, we just can't know which.

  **Why Epistemicists think their cost is lower:**
  Williamson argues that classical logic is not just a tool; it is constitutive of meaning itself. To change logic is to change the subject. If we abandon Bivalence, we have to rewrite large swathes of semantics, probability theory, and inference rules that work perfectly well in mathematics and science. The epistemicist argues it is less theoretically damaging to posit one "weird" semantic fact (an unknowable boundary) than to fracture the logical framework we use to evaluate *all* facts.

  ### 3. The Knockdown Argument: Higher-Order Vagueness
  This is often the tipping point for many philosophers.

  Vagueness doesn't just happen once. We have clear heaps, clear non-heaps, and borderline cases. But the boundary between "clear heap" and "borderline case" is *also* vague. This is **higher-order vagueness**.

  *   **Supervaluationism struggles here.** To model higher-order vagueness, you need "precisifications of precisifications." This leads to a complex hierarchy that many find unintelligible. If the boundary is indeterminate, is the *location* of that indeterminacy determinate? Supervaluationism often collapses into saying there is a sharp boundary between the "definitely true" and the "indeterminate," which reintroduces the sharp cut-off problem it tried to solve.
  *   **Epistemicism handles this naturally.** For the epistemicist, higher-order vagueness is just **higher-order ignorance**.
      *   We don't know where the heap boundary is.
      *   We also don't know where the boundary of "knowing where the heap boundary is" lies.
      *   There is no need for new logic or semantic structures; it's just ignorance all the way down.

  For many, the elegance with which epistemicism handles higher-order vagueness outweighs the counter-intuitiveness of the sharp boundary.

  ### 4. Williamson's Positive Argument: Semantic Plasticity
  You mentioned that the epistemicist's main move seems to be "saving logic." While true, Timothy Williamson offers a positive argument for *why* the boundary is unknowable, which moves beyond mere logical conservation.

  It relies on the **Safety Condition on Knowledge**: To know $P$, your belief that $P$ must not be easily false in nearby possible worlds.

  1.  **Semantic Plasticity:** The meaning of vague terms shifts slightly across close possible worlds. In a world very similar to ours, the usage of "heap" might shift by one grain due to minor differences in linguistic history.
  2.  **The Margin for Error:** If you claim to *know* that $n$ grains is a heap, but in a very close possible world (where the meaning has shifted slightly) $n$ grains is *not* a heap, then your belief in the actual world is not "safe."
  3.  **Conclusion:** Because meanings are plastic in nearby worlds, you cannot form a safe belief about the exact cut-off in the actual world.

  This provides a *mechanism* for the ignorance. It's not just "we can't know"; it's "knowledge requires safety, and semantic facts are too unstable across close worlds to allow safety at the boundary." This makes epistemicism a theory of the *interface between knowledge and semantics*, not just a logical stipulation.

  ### 5. Is it just a Clash of Temperaments?
  To answer your final question: **Yes, but a structured one.**

  There is no empirical experiment that can settle this. You cannot go out and count grains to prove the epistemicist right, because the epistemicist admits you can't know the number. You cannot point to the "gap" to prove the supervaluationist right, because the gap is a semantic absence.

  The debate settles on **theoretical virtues**:

  1.  **Ontological Parsimony vs. Logical Conservatism:**
      *   The **Supervaluationist** prioritizes intuitive semantics. "It feels wrong to say there's a sharp line, so I will modify logic to match the intuition."
      *   The **Epistemicist** prioritizes logical and metaphysical uniformity. "It feels wrong to modify logic, so I will accept the counter-intuitive semantic fact."

  2.  **The Nature of Vagueness:**
      *   Is vagueness a feature of **representation** (Supervaluationism: our words are incomplete)?
      *   Is vagueness a feature of **ignorance** (Epistemicism: the world/meaning is precise, we are blind)?

  ### Summary
  The dispute is substantive because:
  1.  They disagree on the truth value of existential claims about boundaries.
  2.  They disagree on the validity of Bivalence.
  3.  Epistemicism offers a smoother account of higher-order vagueness.
  4.  Epistemicism offers a positive epistemological explanation (safety/plasticity) for the ignorance, rather than just positing indeterminacy.

  However, you are right that it "peters out" in the sense that neither side can produce a "gotcha" proof. The choice ultimately depends on whether you view Classical Logic as a non-negotiable framework for thought (favoring Epistemicism) or whether you view the intuitive lack of a sharp boundary as a datum that logic must accommodate (favoring Supervaluationism).

  It is a clash of temperaments, but it is a clash over which foundational commitments of philosophy are expendable and which are sacred.
