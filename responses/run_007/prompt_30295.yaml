  # Joint Statement on the Interpretation and Utility of Aumann's Agreement Theorem

  **Date:** October 26, 2023
  **Signed:** The Convergence Camp (Camp A) & The Triviality Camp (Camp B)

  Following a period of adversarial collaboration, we issue this joint statement to clarify our shared understanding of Robert Aumann's 1976 "Agreeing to Disagree" theorem, delineate our remaining substantive disagreements, and identify the empirical and philosophical cruxes that resolve them. We acknowledge that while the mathematics is settled, the epistemological application remains contested.

  ### 1. Shared Acceptances
  *We agree on the following claims regarding the formal setup, the proof's scope, and its limitations:*

  1.  **Mathematical Validity:** Under the strict assumptions of the model (Common Prior, Partitioned Information, and Common Knowledge of Posteriors), the conclusion (equality of posteriors) is a mathematical necessity. We do not dispute the proof.
  2.  **Necessity of Assumptions:** We agree that all three assumptions are necessary. If the Common Prior assumption is dropped, agents can agree to disagree. If Common Knowledge of Posteriors is dropped (even if information is shared), agents can agree to disagree.
  3.  **Descriptive Inaccuracy:** We agree that human beings do not literally satisfy the assumptions of the theorem. Humans do not have explicitly defined priors, our information structures are not perfect partitions, and we rarely achieve infinite levels of mutual knowledge ("I know that you know that I know...").
  4.  **Normative vs. Descriptive:** We agree the theorem is primarily a normative claim about ideal rationality, not a descriptive claim about human psychology. It defines a constraint on *ideal* Bayesian agents.
  5.  **Diagnostic Ambiguity:** We agree that observing persistent disagreement in the real world implies that *at least one* assumption of the theorem has been violated, but the theorem itself does not identify *which* assumption (Common Prior, Rationality, or Common Knowledge) is the culprit.
  6.  **Communication Costs:** We agree that achieving "Common Knowledge of Posteriors" requires significant communication. In real-world settings with time limits or bandwidth constraints, the conditions for the theorem will not be met.

  ### 2. Residual Disagreements
  *While we agree on the math, we disagree on the philosophical weight and practical utility of the theorem. The table below summarizes our divergent interpretations.*

  | Feature | Camp A (Convergence) Position | Camp B (Triviality) Position |
  | :--- | :--- | :--- |
  | **Primary Utility** | The theorem is a **diagnostic tool**. It forces disputants to categorize the source of disagreement (Priors vs. Information vs. Rationality). | The theorem is a **logical curiosity**. Because its conditions are impossibly strict, using it to diagnose real arguments generates false positives. |
  | **The "Common Prior"** | The Common Prior assumption is a **regulative ideal** (The Harsanyi Doctrine). Rational agents *ought* to have common priors; differing priors are a form of irrationality. | The Common Prior assumption is **substantively false**. Agents have different histories and cognitive structures; differing priors are a brute fact, not a failure of rationality. |
  | **Idealization Status** | The assumptions are like **frictionless planes** in physics. They are false but useful approximations that guide reasoning toward truth. | The assumptions are like **assuming everyone is 10 feet tall**. They are structural distortions that make the model inapplicable to the target domain. |
  | **Implication of Disagreement** | Persistent disagreement after honest discussion is **presumptive evidence** of irrationality or bias in at least one party. | Persistent disagreement is **expected** even among honest, rational agents due to the fragility of "common knowledge." |

  ### 3. The Cruxes
  *We have identified three specific sub-questions where resolving the uncertainty would cause at least one camp to revise their position. We flag one of these as potentially verbal.*

  **Crux 1: The Status of "Different Priors" (Potentially Verbal)**
  *   **Question:** Is labeling a disagreement as "different priors" a substantive explanation, or merely a label for "brute disagreement"?
  *   **Why it matters:** If "different priors" is just a synonym for "we disagree fundamentally," Camp A's claim that the theorem is diagnostic loses force (it just says "you disagree because you disagree"). If "different priors" refers to identifiable, correctable cognitive biases, Camp B's objection weakens.
  *   **Resolution Condition:** Camp A moves if it is shown that "different priors" cannot be operationalized distinct from "different information." Camp B moves if it is shown that priors can be objectively calibrated to a standard.

  **Crux 2: Continuity of Agreement (The "Approximate Common Knowledge" Crux)**
  *   **Question:** Does *approximate* common knowledge (e.g., mutual knowledge up to 5 levels instead of infinity) yield *approximate* agreement (posteriors within $\epsilon$ of each other)?
  *   **Why it matters:** Camp B argues the theorem breaks because infinity is impossible. If the theorem is "continuous" (Monderer & Samet, 1989), then Camp A can argue it still applies to real life. If the theorem is "discontinuous" (Rubinstein's Email Game), Camp B is right that the idealization breaks the model.
  *   **Resolution Condition:** Camp A moves if small deviations from common knowledge allow for massive divergence in posteriors. Camp B moves if small deviations guarantee close posteriors.

  **Crux 3: The Normative Force of the Common Prior**
  *   **Question:** Is the Common Prior Assumption (CPA) a requirement of rationality, or a constraint on the modeler?
  *   **Why it matters:** Camp A treats CPA as a duty of the agent. Camp B treats CPA as a constraint on the theorist.
  *   **Resolution Condition:** Camp A moves if it is accepted that rational agents can start with different probability distributions without error. Camp B moves if it is accepted that differing priors imply a failure to account for shared objective reality.

  ### 4. Concrete Cases and Pre-Recorded Predictions
  *For each crux, we propose a concrete case or argument. We record our predictions now to update later.*

  #### Case for Crux 1 (The Nature of Priors)
  *   **Scenario:** Two medical experts, one trained in School X and one in School Y, evaluate the same new patient data. They disagree on the diagnosis. School X and Y teach different "heuristic starting points" for rare diseases.
  *   **Camp A Prediction:** If we fully explicate their training as "information," their posteriors should converge. If they still disagree, one school is teaching irrational priors (bias). **Prediction:** Convergence is possible if they fully share their "priors as data."
  *   **Camp B Prediction:** The "heuristic starting points" *are* the priors. They are not reducible to information. Disagreement will persist even with full information sharing. **Prediction:** Persistent disagreement is rational given distinct training histories.

  #### Case for Crux 2 (Continuity/Approximation)
  *   **Scenario:** The "Email Game" (Rubinstein, 1989). Two agents try to coordinate but messages are lost with small probability. They have high levels of mutual knowledge (e.g., 10 levels), but not common knowledge (infinity).
  *   **Camp A Prediction:** With 10 levels of mutual knowledge, their behavior/beliefs should be very close to the Common Knowledge case. **Prediction:** High correlation in action/belief.
  *   **Camp B Prediction:** Without true common knowledge, the equilibrium breaks completely, regardless of how high the finite level is. **Prediction:** Wild divergence in action/belief despite high mutual knowledge.
      *(Note: The literature generally supports Camp B here, which Camp A acknowledges as a significant challenge to their "diagnostic" view.)*

  #### Case for Crux 3 (Normative Force)
  *   **Scenario:** A theist and an atheist discuss the fine-tuning argument. Both claim to be Bayesian.
  *   **Camp A Prediction:** One of them is violating the Harsanyi Doctrine. They should be able to identify a "super-prior" they would have shared before knowing their upbringing. **Prediction:** They can identify a shared reference class that forces convergence.
  *   **Camp B Prediction:** Their priors are constituted by their upbringing. There is no "before upbringing" agent. Demanding a common prior is demanding they be different people. **Prediction:** No shared reference class exists; disagreement is rationally permissible.

