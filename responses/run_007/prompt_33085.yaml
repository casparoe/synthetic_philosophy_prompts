answer: |-
  As a philosopher working on moral responsibility, I encounter this phrase constantly. It is one of the most philosophically loaded idioms in the English language, yet it is almost always used as a conversation-stopper rather than a premise. Your intuition is correct: the argument lives or dies on which metaphysical or ethical claim your cousin is actually making.

  In the literature, this specific problem is known as **Resultant Moral Luck**. It was famously categorized by Thomas Nagel in his 1979 paper *Moral Luck*. The core tension is between the **Control Principle** (we are only responsible for what we control) and our **Intuitive Practices** (we blame people more when bad things happen).

  Here is a menu of five distinct readings of your cousin's claim, ranging from the banal to the radical.

  ### 1. The Banal Empathy Reading
  *   **The Claim:** "I am human and fallible. Under similar circumstances (stress, fatigue, poor judgment), I am capable of making the same bad choice (drinking and driving) that this driver made."
  *   **Philosophical Status:** **True but Irrelevant.** This is a claim about human psychology and fallibility. It asserts that the cousin is not morally *perfect*, not that the driver is not morally *culpable*.
  *   **Verdict:** **Banal.**
  *   **Does it support the cousin's conclusion?** **No.** Admitting "I could have done that" does not logically entail "Therefore, the person who did that shouldn't be punished." I could admit I am capable of murder without concluding that murderers shouldn't go to prison. This reading expresses humility, not exculpation.

  ### 2. The Constitutive Luck Reading
  *   **The Claim:** "My character is not actually better than his. The fact that I am a sober, cautious person is largely due to luck (upbringing, genetics, environment), not my own virtuous effort. Therefore, I am not morally superior to him."
  *   **Philosophical Status:** **Plausible but Limited.** This draws on Nagel's concept of *Constitutive Luck*. It challenges the idea that the cousin is a "better person" than the driver. It suggests moral character is partly a matter of chance.
  *   **Verdict:** **Plausible.**
  *   **Does it support the cousin's conclusion?** **Weakly.** This undermines the cousin's *moral superiority*, but it does not necessarily undermine the *driver's guilt*. Even if we are equally flawed, if the driver acted on that flaw and killed someone, the state may still intervene. This supports the idea that the cousin shouldn't *judge* the driver's soul, but not necessarily that the state shouldn't punish the driver's actions.

  ### 3. The Resultant Luck Reading (The Core Argument)
  *   **The Claim:** "The driver's moral blameworthiness is identical to every other drunk driver who got home safely. The only difference is luck (a pedestrian happened to be there). Since luck is not a valid basis for moral judgment, he is not more blameworthy than the lucky drunk drivers."
  *   **Philosophical Status:** **Philosophically Robust.** This is the standard argument against moral luck. It relies strictly on the **Control Principle**: You cannot control where pedestrians are standing; therefore, you cannot be more morally culpable for hitting one than for missing one.
  *   **Verdict:** **Plausible (Theoretically), Counter-Intuitive (Practically).**
  *   **Does it support the cousin's conclusion?** **Yes.** This is the only reading that directly attacks the *severity* of the blame based on the outcome. If your cousin holds this view, he is arguing that the driver should be punished for *drunk driving*, but not punished *more severely* for *killing someone*, since the death was a matter of luck.

  ### 4. The Retributive Proportionality Reading
  *   **The Claim:** "Legal punishment should track the *risk* created, not the *harm* caused. Since the driver created the same risk as a drunk driver who kills no one, his sentence should be the same as theirs."
  *   **Philosophical Status:** **Debatable.** This moves from moral philosophy to legal theory. Many legal theorists argue the law *should* punish outcomes (to deter negligence and acknowledge victimhood), while others argue it should punish only the culpable mental state (recklessness).
  *   **Verdict:** **Contingent.** It depends on your theory of law.
  *   **Does it support the cousin's conclusion?** **Yes, specifically regarding sentencing.** This reading allows that the driver is guilty, but argues the *magnitude* of the punishment is unjust because it is inflated by a lucky/unlucky outcome.

  ### 5. The Hard Determinist / Fatalist Reading
  *   **The Claim:** "None of us have free will. The driver was determined to swerve by prior causes (alcohol, neurology, physics). 'Grace of God' implies divine or causal determination. Therefore, no one deserves punishment, ever."
  *   **Philosophical Status:** **Radical.** This denies the existence of moral responsibility entirely. It treats "grace of God" not as a metaphor for luck, but as a statement about causality.
  *   **Verdict:** **Controversial/Unproven.**
  *   **Does it support the cousin's conclusion?** **Yes, but it's a 'Nuclear Option'.** If this is his argument, he isn't just defending this driver; he is arguing that *no one* deserves punishment for *anything*. If he still believes thieves should go to jail, he is being inconsistent.

  ***

  ### How to Diagnose Your Cousin
  To figure out which argument he is actually making, you need to press him on the distinction between **Moral Status** (is he a bad person?) and **Legal Liability** (should he go to prison?).

  **Ask him this:**
  > "If we caught this driver *before* he hit the pedestrian, while he was swerving drunk, would you punish him the same as we punish him now that he has killed someone?"

  *   **If he says YES:** He is making **Reading 3 or 4** (Resultant Luck/Proportionality). He believes the death shouldn't add to the penalty. This is a coherent, defensible philosophical position (held by philosophers like Simester and Duff in certain contexts), though it contradicts most legal systems.
  *   **If he says NO:** He is likely making **Reading 1 or 6** (Empathy/Deflection). He is expressing personal discomfort with judging others, but he doesn't actually have a theory of justice that supports letting the driver off the hook. He is using a philosophical phrase to mask an emotional reaction.
  *   **If he says "No one should be punished":** He is making **Reading 5** (Determinism). You can then ask him if he thinks a premeditated murderer should be punished. If he says yes, his argument collapses into inconsistency.

  ### My Professional Assessment
  Your cousin is likely conflating **Reading 2** (I am not a better person than him) with **Reading 3** (Therefore he shouldn't be punished).

  This is a common error. Even if we grant that the cousin and the driver are *morally equivalent* in terms of character (Reading 2), it does not follow that the *consequences* of their actions should be treated identically by the law (Reading 3). The law often punishes based on harm done, not just internal wickedness, for practical reasons (deterrence, restitution to victims).

  **Verdict:** The phrase "There but for the grace of God go I" is a **platitude** regarding human fallibility (Reading 1), but your cousin is trying to use it as a **premise** for a radical claim about moral luck (Reading 3). Without explicitly defending the rejection of resultant moral luck, his argument is a non-sequitur. He is using a truth about *human nature* to try to prove a point about *legal justice*, and those two things do not necessarily align.
