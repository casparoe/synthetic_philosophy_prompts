prompt: |-
  I'm organizing a small workshop on anthropic reasoning and decision theory, and I want one of the sessions to model what a serious adversarial collaboration between proponents of the self-sampling assumption (SSA) and the self-indication assumption (SIA) would actually look like. I've recruited two participants — one who has defended SSA in print and one who has defended SIA — and I've asked them to produce a joint document they can both sign. I'd like you to draft that document for them, as a starting point for their discussion. The structure should be as follows. First, a numbered list of claims that both sides agree on: about the formal setup, about what the problem is, about which thought experiments are centrally relevant, about what would constitute a resolution, and about what both sides are committed to rejecting (for instance, both reject the idea that anthropic reasoning is meaningless or that one can simply ignore indexical uncertainty). Second, a table of disagreements: each row should state the point of disagreement in neutral terms, then give the SSA-side formulation of their own view and the SIA-side formulation of theirs, each phrased in a way that its own proponents would accept as accurate and fair. Third, a list of cruxes — the sub-questions on which the dispute turns, such that if they were settled, at least one side would change its view. For each crux, I want: what both sides agree would count as evidence bearing on it, and what each side predicts about that evidence. The presumptuous philosopher thought experiment should feature prominently, since it is a case where the two views diverge so starkly that it forces the issue. But I would also like the document to address the doomsday argument, the sleeping beauty problem, the self-sampling assumption's handling of reference classes, and the question of whether anthropic probabilities should be thought of as epistemic or as something more like objective chances. Finally, I want the document to include a short section at the end where each side states, in their own words, what they take to be the strongest argument for the other side — the thing that gives them the most pause about their own view. The goal is a document that is genuinely constructive, that neither side would feel misrepresents them, and that sharpens the disagreement rather than papering it over.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a joint document for an adversarial collaboration workshop on anthropic reasoning (SSA vs. SIA).
      *   **Participants:** One SSA proponent, one SIA proponent.
      *   **Structure:**
          1.  Numbered list of agreed claims (setup, problem, thought experiments, resolution criteria, rejections).
          2.  Table of disagreements (neutral statement, SSA formulation, SIA formulation).
          3.  List of cruxes (sub-questions, agreed evidence, SSA prediction, SIA prediction).
          4.  Section on strongest opposing arguments (each side stating the other's best point).
      *   **Key Content:** Must feature the Presumptuous Philosopher, Doomsday Argument, Sleeping Beauty, Reference Classes, and the nature of anthropic probabilities (epistemic vs. objective).
      *   **Tone:** Constructive, accurate, fair, sharpening disagreement without misrepresentation.

  2.  **Deconstruct the Subject Matter (SSA vs. SIA):**
      *   *SSA (Self-Sampling Assumption):* Reason as if you are a random sample from the set of actually existing observers in your reference class. Tends to favor smaller worlds (Doomsday Argument).
      *   *SIA (Self-Indication Assumption):* Reason as if you are a random sample from the set of *possible* observers, weighted by the probability of those worlds existing. Tends to favor larger worlds (Presumptuous Philosopher).
      *   *Sleeping Beauty:* SSA $\rightarrow$ Halfer (usually), SIA $\rightarrow$ Thirder (usually).
      *   *Reference Class:* SSA's Achilles' heel (how to define the class?). SIA avoids this somewhat but has other issues.
      *   *Presumptuous Philosopher:* The big divergence. SIA says you should bet on the universe with more observers even without empirical evidence. SSA says no.
      *   *Nature of Probabilities:* Are they about belief updating (Bayesian) or about physical frequencies/indexical facts?

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to establish common ground. Both sides agree anthropics matters. Both agree on standard probability theory (Bayesianism). Both agree specific thought experiments are the testing ground.
      *   *Drafting points:* Formal framework (Bayes), relevance of indexical information, rejection of solipsism/meaninglessness, agreement on specific cases (Sleeping Beauty, Doomsday, Presumptuous Philosopher), goal is decision-theoretic coherence.

  4.  **Drafting - Section 2: Table of Disagreements:**
      *   Need neutral labels.
      *   *Row 1: Core Principle.* SSA: Sample from actuals. SIA: Sample from possibles.
      *   *Row 2: World Size Bias.* SSA: No prior bias toward populous worlds. SIA: Prior bias toward populous worlds.
      *   *Row 3: Reference Class.* SSA: Crucial and problematic. SIA: Less crucial (all observers).
      *   *Row 4: Doomsday Argument.* SSA: Valid. SIA: Invalid (cancels out).
      *   *Row 5: Presumptuous Philosopher.* SSA: Absurd result. SIA: Correct result.
      *   *Row 6: Sleeping Beauty.* SSA: 1/2. SIA: 1/3.
      *   *Row 7: Probability Nature.* SSA: Often epistemic/subjective. SIA: Often treated as objective likelihoods of existence. (Need to be careful here, nuances vary).

  5.  **Drafting - Section 3: Cruxes:**
      *   What would change minds?
      *   *Crux 1: The Intuition Pump of Presumptuous Philosopher.* Is it truly absurd to bet on the larger universe?
      *   *Crux 2: Reference Class Arbitrariness.* Can SSA define a non-arbitrary class?
      *   *Crux 3: Decision-Theoretic Money Pumps.* Which view loses money in repeated scenarios?
      *   *Crux 4: The Nature of "I".* Is "I" a physical indexical or a logical pointer?
      *   *Evidence:* Formal decision theory models, consensus on intuition pumps, derivation from non-anthropic principles.

  6.  **Drafting - Section 4: Strongest Opposing Arguments:**
      *   *SSA admitting SIA's strength:* SIA handles the "reference class" problem much more cleanly and avoids the Doomsday conclusion which feels like cheating.
      *   *SIA admitting SSA's strength:* The Presumptuous Philosopher result is deeply counterintuitive and seems to allow armchair discovery of physical facts.

  7.  **Review and Refine:**
      *   *Check Constraints:* Did I include Doomsday? Yes. Sleeping Beauty? Yes. Presumptuous Philosopher? Yes. Reference Classes? Yes. Epistemic vs. Objective? Yes.
      *   *Tone Check:* Is it neutral? Yes. Does it sound like a joint document? Yes.
      *   *Accuracy Check:* Ensure SSA isn't conflated with SSTA (Strong Self-Sampling) unnecessarily, but keep it general. Ensure SIA isn't conflated with UDASSA unless necessary (keep it standard SIA).
      *   *Formatting:* Use Markdown for lists and tables.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Agreed Claims" section doesn't accidentally resolve the debate. Keep it meta-level.
      *   *Correction:* In the Cruxes section, ensure the "Evidence" column is something they actually agree *would* be evidence, even if they disagree on the current status of it.
      *   *Correction:* Ensure the "Strongest Argument" section sounds personal ("In my view...").

  9.  **Final Output Generation:** (Proceeding to generate the response based on these steps.)
answer: |-
  # Joint Working Document: Adversarial Collaboration on Anthropics (SSA vs. SIA)

  **Date:** October 26, 2023
  **Participants:** Proponent of the Self-Sampling Assumption (SSA) | Proponent of the Self-Indication Assumption (SIA)
  **Purpose:** To map the landscape of disagreement, identify empirical and theoretical cruxes, and establish a framework for resolving the dispute between SSA and SIA regarding anthropic reasoning.

  ---

  ## I. Points of Agreement

  Both parties affirm the following claims as the common ground for this collaboration. We agree that these premises are necessary for the debate to be substantive rather than verbal.

  1.  **Formal Framework:** Anthropics must be modeled within standard Bayesian probability theory. We agree that anthropic updates are a matter of conditionalizing on indexical information (e.g., "I exist" or "I am observing X").
  2.  **Meaningfulness:** We reject the claim that anthropic reasoning is meaningless, incoherent, or that indexical uncertainty can be ignored. The fact of our own existence provides evidence that must be accounted for in cosmological and decision-theoretic models.
  3.  **Centrality of Thought Experiments:** We agree that the following thought experiments constitute the primary testing ground for our theories:
      *   The Sleeping Beauty Problem
      *   The Doomsday Argument
      *   The Presumptuous Philosopher
      *   The Incubator/Dungeon scenarios
  4.  **Decision-Theoretic Accountability:** A viable anthropic theory must not lead to dominated strategies (e.g., losing money in Dutch books or money pumps) in standard decision scenarios involving self-locating belief.
  5.  **Rejection of Solipsism:** We assume a realist ontology where other observers exist independently of our observation of them. We are not debating the existence of the external world, but how to reason from within it.
  6.  **Criteria for Resolution:** A resolution would require either:
      *   A demonstration that one view leads to systematic decision-theoretic failure.
      *   A derivation of one assumption from more fundamental, non-anthropic principles of rationality.
      *   A consensus that one view yields significantly more counterintuitive results in high-stakes scenarios without compensatory theoretical benefits.

  ---

  ## II. Map of Disagreements

  The following table outlines the core divergences. The "Neutral Statement" describes the issue without bias. The "SSA Formulation" and "SIA Formulation" are drafted to be acceptable to their respective proponents.

  | # | Neutral Statement of Disagreement | SSA Formulation (Self-Sampling Assumption) | SIA Formulation (Self-Indication Assumption) |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Core Probabilistic Rule** | Reason as if you are a random sample from the set of *actually existing* observers in your reference class. | Reason as if you are a random sample from the set of *possible* observers, weighted by the prior probability of their world existing. |
  | **2** | **Bias Toward World Size** | Does the mere fact of your existence favor hypotheses with more observers? | No. Existence is a precondition for observation, not evidence for populous worlds. Priors should remain unchanged by existence alone. | Yes. Hypotheses that predict more observers like you receive a likelihood boost proportional to the number of such observers. |
  | **3** | **The Reference Class Problem** | How is the set of observers you could be defined? | This is a critical, unresolved parameter. The reference class must be restricted (e.g., "observers with my evidence") to avoid absurdity, but the boundary is vague. | This is largely dissolved. The reference class is "all possible observers." Ambiguity is minimized because the assumption applies to all subjectively indistinguishable centers. |
  | **4** | **The Doomsday Argument** | Does your birth rank imply humanity is likely to end sooner rather than later? | Valid. Finding yourself early in the sequence of humans is evidence that the total sequence is short, assuming a uniform sample from actual humans. | Invalid. The likelihood boost for a long-lived humanity (more total humans) exactly cancels the likelihood penalty of having a low birth rank. |
  | **5** | **The Presumptuous Philosopher** | Should you bet on a universe being larger solely because it contains more observers? | No. This allows "armchair cosmology." It is absurd to reject a physical theory with equal prior probability simply because it predicts fewer observers. | Yes. If Theory A predicts $10^{20}$ observers and Theory B predicts $10^{10}$, you should be $10^{10}$ times more confident in A, all else equal. |
  | **6** | **Sleeping Beauty** | Upon waking, what is your credence that the coin landed Heads? | **1/2 (Halfer).** You knew you would wake up regardless. No new non-indexical information is gained. The sample is from actual awakenings. | **1/3 (Thirder).** There are three possible observer-moments (Heads-Mon, Tails-Mon, Tails-Tue). You are a random sample from these possibilities. |
  | **7** | **Nature of Probabilities** | Are anthropic probabilities epistemic or objective? | Primarily epistemic. They reflect rational degrees of belief given indexical uncertainty, not physical chances of "being" someone. | Often treated as objective likelihoods. The "chance" of being a specific observer is proportional to the measure of that observer in the multiverse/world. |

  ---

  ## III. Cruxes and Evidence

  We identify the following sub-questions as cruxes. If these were settled, at least one of us would be compelled to update our position.

  ### Crux 1: The Intuition of the Presumptuous Philosopher
  *   **The Issue:** Is it rational to favor a theory solely because it predicts more observers, absent empirical data?
  *   **Agreed Evidence:** A formalized betting scenario where the stakes are clear (e.g., survival of the universe or allocation of resources) and the intuitions of neutral third parties regarding "absurdity."
  *   **SSA Prediction:** Neutral agents will reject the SIA bet as irrational hubris. The SIA proponent will concede that "armchair cosmology" is a fatal flaw.
  *   **SIA Prediction:** Neutral agents will accept the SIA bet as mathematically necessary to avoid betting against the odds of their own existence. The SSA proponent will concede that rejecting the bet leads to Dutch books in multiverse scenarios.

  ### Crux 2: Reference Class Arbitrariness
  *   **The Issue:** Can SSA define a reference class that is neither too narrow (making the theory trivial) nor too broad (recreating SIA results)?
  *   **Agreed Evidence:** A principled, non-ad-hoc definition of "reference class" derived from cognitive science or decision theory that successfully resolves the Doomsday Argument without collapsing into SIA.
  *   **SSA Prediction:** Such a definition can be found (e.g., "observers with identical subjective experiences"). The SIA proponent will admit SSA is more flexible than assumed.
  *   **SIA Prediction:** No such definition exists without arbitrary cutoffs. The SSA proponent will admit that reference class sensitivity renders the theory unstable.

  ### Crux 3: Decision-Theoretic Coherence (Money Pumps)
  *   **The Issue:** Which assumption leads to dominated strategies in repeated anthropic games?
  *   **Agreed Evidence:** A constructed game (e.g., a repeated Sleeping Beauty or Incubator variant) where one assumption guarantees a loss of utility over time.
  *   **SSA Prediction:** SIA leads to over-betting on high-population worlds, resulting in expected utility loss when the world turns out to be small.
  *   **SIA Prediction:** SSA leads to under-betting on high-population worlds, resulting in expected utility loss when the world turns out to be large (the "Self-Indication Assumption: The Decision-Theoretic Case" argument).

  ### Crux 4: The Nature of "I" (Indexicality)
  *   **The Issue:** Is "I" a physical pointer to a specific brain, or a logical index pointing to a subjective experience?
  *   **Agreed Evidence:** Consensus on a metaphysical account of personal identity that integrates with physics (e.g., via functionalism or physical continuity).
  *   **SSA Prediction:** "I" refers to a specific physical instance. Therefore, probabilities should not weight by mere possibility.
  *   **SIA Prediction:** "I" refers to a subjective perspective. Therefore, the measure of possible perspectives matters more than physical instantiation.

  ---

  ## IV. Strongest Opposing Arguments

  *In this section, each proponent states the argument from the other side that they find most difficult to refute.*

  ### From the SSA Proponent (Regarding SIA)
  > "The strongest argument for SIA is its elegance in handling the **Reference Class Problem**. My view requires me to draw a boundary around 'observers like me,' and every boundary I draw seems either arbitrary or suspiciously convenient for avoiding the Doomsday conclusion. SIA simply says 'all possible observers,' which dissolves the arbitrariness. Furthermore, SIA's ability to cancel out the Doomsday Argument feels like a feature, not a bug; the idea that I can predict the end of humanity solely based on my birth rank feels like a reductio ad absurdum of SSA, and SIA is the only clean escape route that doesn't involve tinkering with the reference class mid-argument."

  ### From the SIA Proponent (Regarding SSA)
  > "The strongest argument for SSA is the **Presumptuous Philosopher Objection**. It is genuinely difficult for me to explain why it is rational to be a billion times more confident in a theory simply because it posits a billion times more people, without ever looking through a telescope. It feels like magic. SSA captures the deep intuition that physical theories should be tested by physical evidence, not by counting how many observers they happen to produce. If SIA implies I should bet against a physical theory that has equal prior support just because it predicts a sparse universe, then SIA seems to violate the principle that physics should be empirical. This keeps me up at night."

  ---

  **Signatures:**

  _________________________ (SSA Proponent)

  _________________________ (SIA Proponent)
