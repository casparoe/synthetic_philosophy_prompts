      *   Clarify the difference between the St. Petersburg paradox (diverges to infinity) and Pasadena (oscillates/conditionally converges).

  7.  **Final Logic Check:**
      *   *User premise:* Series converges conditionally -> rearrangement possible -> expectation undefined. (True).
      *   *User inference:* EUT unreliable? (Debatable, but "incomplete" is better).
      *   *User inference:* Need different rule for *every* option? (False, need a better general rule).

      *(Self-Correction during drafting)*: Make sure to emphasize that "unbounded payoffs" are the root cause. If payoffs are bounded, absolute convergence is guaranteed.

