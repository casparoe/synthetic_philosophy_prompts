      *   **Problem:** The standard objection (act/content distinction) is routinely taught and accepted by students, but the professor suspects it's not as decisive as commonly believed. They suspect it relies on a specific, contestable theory of mental representation.
      *   **Task:** Argue forcefully and carefully that the standard objection to Berkeley's Master Argument fails (or at least is much weaker than assumed). Show what assumptions it relies on and why they are optional/question-begging.
