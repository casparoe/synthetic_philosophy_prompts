prompt: |-
  I'm running a philosophy of probability reading group and we've been going back and forth on the Sleeping Beauty problem for weeks. The halfers and thirders in the group are talking past each other and I'm getting tired of it. I want them to produce an adversarial-collaboration document — the kind of thing where both sides sit down and actually hash out what they agree on, where exactly they part ways, and what would change their minds.

  Can you draft that document? It should have:
  - A numbered list of claims both sides can sign (about the setup, about what Beauty knows when, about what the question is even asking)
  - A table of disagreements, with each position stated in wording its own defenders would accept
  - The cruxes — the sub-questions where if you settled them, at least one side would have to budge
  - For each crux, some test case or argument both sides agree bears on it, with each side's prediction about what it shows

  Don't just summarize the debate — actually try to produce the document they could both put their names on. If you think some of the dispute is verbal, say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** A philosophy of probability reading group stuck on the Sleeping Beauty problem (Halfers vs. Thirders).
      *   **Goal:** Create an "adversarial-collaboration document."
      *   **Requirements:**
          *   Numbered list of agreed-upon claims (setup, knowledge, question).
          *   Table of disagreements (stated charitably/in own words).
          *   Identification of "cruxes" (sub-questions that resolve the debate).
          *   Test cases/arguments for each crux with predictions from both sides.
          *   Tone: Practical, actionable, ready for signatures (not just a summary).
          *   Specific instruction: Identify verbal disputes if present.

  2.  **Deconstruct the Sleeping Beauty Problem:**
      *   *Setup:* Coin flip (Heads/Tails). Heads -> Wake Monday only. Tails -> Wake Monday & Tuesday (amnesia in between). Ask upon waking: "What is your credence that the coin landed Heads?"
      *   *Halfer Position:* $P(Heads) = 1/2$. (Prior is 1/2, no new relevant info upon waking).
      *   *Thirder Position:* $P(Heads) = 1/3$. (Long-run frequency of Heads-wakings is 1/3, or self-locating belief update).
      *   *Key Tensions:* Self-locating belief, reference classes, conditioning on "today is an awakening," betting arguments, principle of indifference.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to ensure both sides accept the physical setup.
      *   Need to agree on what Beauty knows *before* the experiment.
      *   Need to agree on what Beauty knows *upon waking* (excluding the coin outcome).
      *   Need to agree on the definition of "credence" (operationalized via betting or just subjective probability).
      *   *Drafting thought:* Keep it neutral. Avoid loading terms like "new information" or "self-locating" here if possible, or define them neutrally.
      *   *Key agreement:* The coin is fair. The protocol is known. Amnesia is perfect.

  4.  **Drafting Section 2: Table of Disagreements:**
      *   Need to state the Halfer view in a way a Halfer likes (e.g., focusing on the coin chance).
      *   Need to state the Thirder view in a way a Thirder likes (e.g., focusing on the waking experience).
      *   *Core Disagreement:* The value of $P(Heads)$ upon waking.
      *   *Secondary Disagreement:* Whether waking constitutes "new evidence."
      *   *Secondary Disagreement:* How to apply the Principle of Indifference (to coins or to wakings?).

  5.  **Drafting Section 3: The Cruxes (The "Moveable Parts"):**
      *   What actually drives the difference?
      *   *Crux 1: The Reference Class.* Are we sampling coins or wakings?
      *   *Crux 2: New Information.* Does "I am awake now" update the probability?
      *   *Crux 3: Betting/Dutch Book.* If Beauty bets every awakening, what odds avoid a sure loss? (Note: Halfers often argue about bet counting, Thirders about total payout).
      *   *Crux 4: Self-Locating Belief.* Is $P(Heads | Monday)$ different from $P(Heads)$?

  6.  **Drafting Section 4: Test Cases/Arguments:**
      *   Need scenarios that stress-test the cruxes.
      *   *Test Case 1: The Sailor's Child / Incubator variant.* (Removes amnesia, focuses on existence).
      *   *Test Case 2: The Betting Argument.* (Standard Dutch Book).
      *   *Test Case 3: The Technicolor Beauty.* (Gives distinct evidence on Mon/Tue).
      *   *Test Case 4: The Extreme Version.* (Tails = 1,000,000 wakings).
      *   *Selection:* Let's pick the *Extreme Version* (intuition pump), the *Betting Scenario* (pragmatic), and the *Specific Evidence* case (Technicolor) to see if updating happens.

  7.  **Refining the "Verbal Dispute" Aspect:**
      *   Is it just verbal? Often, it boils down to what "probability" means in this context (chance of coin vs. proportion of true beliefs). I need to highlight this in the analysis section.

  8.  **Review and Polish:**
      *   *Tone Check:* Is it formal enough for a reading group but clear enough to stop the bickering?
      *   *Constraint Check:* Did I include numbered claims? Yes. Table? Yes. Cruxes? Yes. Test cases? Yes.
      *   *Fairness:* Ensure Thirders aren't painted as frequentists only and Halfers aren't painted as ignoring evidence.
      *   *Formatting:* Use Markdown for clarity (bolding, tables, lists).

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe include the "Double Halfer" position.
      *   *Correction:* No, keep it binary (Halfer vs. Thirder) for the sake of the document, or acknowledge Double Halfers in the notes. Let's stick to the main two to keep the document signable.
      *   *Initial thought:* Define credence as betting odds.
      *   *Correction:* Some philosophers resist operationalism. Define it as "degree of belief warranting action" but acknowledge the betting link in the test cases.
      *   *Crucial Detail:* Make sure the "New Information" crux is precise. Halfers say "I knew I'd be woken." Thirders say "I didn't know *this* waking was happening now."

  10. **Final Polish:** Check against the prompt's request for "what would change their minds." This fits into the Cruxes section.

  *(Self-Correction on the "Agreed Claims"):* Make sure to explicitly state that the coin is fair *ex ante*. That's usually not disputed.
  *(Self-Correction on "Cruxes"):* Ensure the "Test Case" includes *predictions*. Halfer prediction: X. Thirder prediction: Y.

  Let's assemble the document.
answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: THE SLEEPING BEAUTY PROBLEM

  **Date:** [Insert Date]
  **Participants:** The Halfer Cohort & The Thirder Cohort
  **Facilitator:** [Your Name/Group Lead]

  ## PREAMBLE
  This document is intended to halt circular debate by isolating the precise points of divergence between the Halfer and Thirder positions regarding the Sleeping Beauty problem. Signatories agree that the definitions and setup below are accurate. Disagreement is restricted to the sections marked "Disputed."

  ---

  ## PART I: AGREED FOUNDATIONS
  *Both sides sign below to affirm that the following claims accurately describe the experimental setup and the epistemic situation.*

  1.  **The Coin:** A fair coin is tossed on Sunday. The objective chance of Heads ($H$) is $1/2$, and Tails ($T$) is $1/2$.
  2.  **The Protocol:**
      *   If $H$: Beauty is awakened on Monday only.
      *   If $T$: Beauty is awakened on Monday and Tuesday.
  3.  **Amnesia:** Between awakenings (if $T$), Beauty is given an amnesia-inducing drug that eliminates memory of the previous awakening. She cannot distinguish Monday from Tuesday upon waking.
  4.  **The Question:** Upon each awakening, Beauty is asked: *"What is your credence now that the coin landed Heads?"*
  5.  **Epistemic State:** Upon waking, Beauty knows the protocol (1–4) but does not know the coin outcome, the day of the week, or whether this is her first or second awakening.
  6.  **Credence Definition:** "Credence" refers to a subjective degree of belief that guides rational action (e.g., betting behavior), satisfying the axioms of probability.
  7.  **No External Info:** Beauty receives no information from the external world during the awakening other than the fact that she is awake and being interviewed.

  **Signatures:**
  Halfer Rep: ___________________ | Thirder Rep: ___________________

  ---

  ## PART II: TABLE OF DISAGREEMENTS
  *Each position is stated in terms its own defenders find most charitable.*

  | Feature | The Halfer Position | The Thirder Position |
  | :--- | :--- | :--- |
  | **The Answer** | Upon waking, Beauty's credence in Heads should remain **1/2**. | Upon waking, Beauty's credence in Heads should be **1/3**. |
  | **New Information** | Waking provides **no new relevant evidence**. Beauty knew on Sunday she would be woken at least once. | Waking provides **self-locating evidence**. Beauty learns "I am awake now," which is more likely under Tails (2 wakings) than Heads (1 waking). |
  | **Reference Class** | Probability attaches to the **coin toss event**. There is only one toss. | Probability attaches to the **centered proposition** ("This awakening is a Heads-awakening"). There are three possible awakenings. |
  | **Principle of Indifference** | Apply indifference to the **coin outcomes** ($H$ vs $T$). | Apply indifference to the **indistinguishable awakenings** (Mon-H, Mon-T, Tue-T). |
  | **Betting** | If offered a bet every awakening, Beauty should account for the **number of bets** placed, not just the odds. | If offered a bet every awakening, Beauty should treat each bet as an independent opportunity to win/lose. |

  ---

  ## PART III: THE CRUXES
  *These are the specific sub-questions where, if resolved, one side would be forced to update their position. Signatories must identify which crux they believe is decisive.*

  ### Crux 1: The Nature of "New Evidence"
  **Question:** Does the statement "I am awake now" constitute evidence that updates the prior probability of $1/2$?
  *   **Halfer View:** No. The probability of "I am awake" is 1 under both Heads and Tails. $P(E|H) = P(E|T) = 1$. Therefore, by Bayes' Theorem, the posterior equals the prior.
  *   **Thirder View:** Yes. While she knew she would wake *sometime*, she did not know she would wake *now*. The indexical fact "this is an awakening" is sampled from a set of possible awakenings, which is larger under Tails.

  ### Crux 2: The Betting Dutch Book
  **Question:** If Beauty accepts a bet every time she wakes, what odds prevent a sure loss (Dutch Book) across the experiment?
  *   **Halfer View:** A Halfer can avoid a Dutch Book if she recognizes that under Tails, she is making **two** identical bets. She should calculate expected value based on the *experiment*, not the *awakening*.
  *   **Thirder View:** A Thirder avoids a Dutch Book by betting at 1:2 odds (credence 1/3) on every awakening. If she bets at 1:1 (credence 1/2), she will lose money in the long run across repeated experiments.

  ### Crux 3: The "Extreme Tails" Intuition Pump
  **Question:** If Tails resulted in 1,000,000 awakenings and Heads in 1, does credence shift?
  *   **Halfer View:** No. The coin is still fair. No matter how many times you wake me, a fair coin is a fair coin. To think otherwise is the Gambler's Fallacy.
  *   **Thirder View:** Yes. If you wake up and know Tails implies 1,000,000 wakings and Heads implies 1, it is overwhelmingly likely you are in a Tails-world. Credence in Heads should drop to $\approx 0$.

  ---

  ## PART IV: TEST CASES & PREDICTIONS
  *For each Crux, we propose a specific variant or argument. Both sides must record what their theory predicts.*

  ### Test Case A: The "Technicolor Beauty" Variant
  **Setup:** Same as original, but on Monday the room is Red. On Tuesday (if Tails), the room is Blue. Beauty sees Red upon waking.
  *   **Relevance:** Tests whether specific self-locating evidence triggers updating.
  *   **Halfer Prediction:** Credence in Heads remains **1/2**. Seeing Red confirms it is Monday, but $P(Heads|Monday) = 1/2$ because the coin toss determines the day structure.
  *   **Thirder Prediction:** Credence in Heads becomes **1/2**. (Agreement!) *Wait, check:* If she sees Red, she knows it's Monday. On Monday, the coin is fair.
      *   *Correction for Document:* This case often forces Halfers to admit updating is possible if the evidence distinguishes days.
      *   **Revised Thirder Prediction:** Credence is **1/2** (because $P(H|Mon) = 1/2$).
      *   **Revised Halfer Prediction:** Credence is **1/2**.
      *   *Note:* This case is often used to show that Halfers *can* update on self-locating info, so the dispute is whether "waking" alone counts as such info.
      *   **Better Test:** **The "Random Sample" Case.** A third party selects one of Beauty's awakenings at random and asks her.
      *   **Halfer Prediction:** 1/2. (The coin was still fair).
      *   **Thirder Prediction:** 1/3. (The sampling method selects from the set of awakenings).

  ### Test Case B: The Betting Scenario (Operational)
  **Setup:** Beauty wins \$1 if she guesses correctly. She is paid for *every* correct guess.
  *   **Relevance:** Tests the link between credence and rational action.
  *   **Halfer Prediction:** Beauty should guess **Heads**. (Expected value per experiment: Heads = \$1, Tails = \$2. Wait, if she guesses Tails she gets \$2. If she guesses Heads she gets \$1. She should guess Tails to maximize winnings, but her *credence* remains 1/2).
      *   *Clarification:* Halfer claim: You can maximize utility by guessing Tails while maintaining credence 1/2 because the *payoff structure* is skewed, not the probability.
  *   **Thirder Prediction:** Beauty should guess **Tails** because her credence is 1/3 for Heads. Credence and optimal action align directly.

  ### Test Case C: The "Sunday Question"
  **Setup:** On Sunday, Beauty is asked: "When you are woken tomorrow, what will your credence be?"
  *   **Relevance:** Tests diachronic coherence (Reflection Principle).
  *   **Halfer Prediction:** She answers **1/2**. She expects to remain rational and know the coin is fair.
  *   **Thirder Prediction:** She answers **1/3**. She knows she will lose information (what day it is) and gain self-locating evidence.
  *   **Conflict:** If Halfer says 1/2 on Sunday, but Thirder says 1/3 on Monday, who violates the Reflection Principle?

  ---

  ## PART V: VERBAL DISPUTE DIAGNOSIS
  *Signatories must indicate the extent to which they believe the disagreement is merely verbal.*

  **Option A: Substantive Disagreement**
  We disagree about how the world works (specifically, how self-locating beliefs update probabilities).
  *   [ ] Halfer Check
  *   [ ] Thirder Check

  **Option B: Verbal Disagreement (Ambiguity of "Credence")**
  We agree on the facts, but define "credence" differently.
  *   **Halfer Definition:** Credence = Confidence in the **chance setup** (the coin toss).
  *   **Thirder Definition:** Credence = Confidence in the **truth of the proposition** relative to my current situation (the awakening).
  *   *If this box is checked:* Both sides agree that if you ask "What is the chance the coin is Heads?" the answer is 1/2. If you ask "What proportion of wakings are Heads-wakings?" the answer is 1/3. The fight is over which question the prompt asks.

  **Option C: Verbal Disagreement (Ambiguity of "New Information")**
  We disagree on the definition of evidence.
  *   **Halfer Definition:** Evidence must rule out a possible world (Tails is not ruled out).
  *   **Thirder Definition:** Evidence can shift weights within possible worlds (Tails world gets more weight because it contains more "now" moments).

  ---

  ## PART VI: COMMITMENT TO UPDATE
  *By signing below, each side agrees to update their position if the following conditions are met:*

  1.  **Halfer Commitment:** I will move toward 1/3 if it is demonstrated that refusing to update on "I am awake now" leads to a Dutch Book *even when bet-counting is controlled for*, OR if I accept that credence tracks long-run frequency of true beliefs in self-locating contexts.
  2.  **Thirder Commitment:** I will move toward 1/2 if it is demonstrated that the "1/3" answer requires violating the Principle of Reflection without a loss of information, OR if I accept that probability must attach solely to the stochastic chance process (the coin) and not the observer's trajectory.

  **Halfer Signatories:** ___________________
  **Thirder Signatories:** ___________________
  **Date:** ___________________
