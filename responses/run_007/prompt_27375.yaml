answer: |-
  1. An expert electrician, knowing a circuit is active from a schematic, inspects a junction box where a faint spark is physically present but near the threshold of visibility.
  2. Her knowledge penetrates vision by lowering the contrast threshold, making the spark phenomenally brighter than it would appear to a novice who lacks the schematic context.
  3. She forms the perceptual belief that the wire is arcing, which is more accurate than the novice's belief that the box is dark because the penetration unlocks sub-threshold sensory data.
  4. A skeptic might claim she merely attends to the location, but this fails because she cannot locate the spark to attend to it until the expectation alters its visible contrast.
  5. Perceptual learning from training does the epistemic work, and without it the data remains inaccessible, yet the worry survives that such top-down tuning risks confirming biases when the physical signal is absent.
