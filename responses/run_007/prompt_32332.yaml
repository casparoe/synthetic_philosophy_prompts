answer: |-
  This is a classic set of intuitions that maps very closely onto a specific framework in normative ethics. Your friend isn't just guessing; she is consistently applying a structured set of constraints, likely without realizing it has a name.

  Here is the breakdown of the rules she is likely running, the prediction for the Loop case, and the follow-up test to confirm it.

  ### 1. The Candidate Rules
  Based on her six verdicts, she is rejecting pure Utilitarianism (save the most lives) and strict Deontology (never kill). She is running a hybrid framework. There are three candidate principles at play:

  *   **A. The Doctrine of Double Effect (DDE):** An action causing harm is permissible if: (1) the act itself is good or neutral, (2) the bad effect is not *intended* (only foreseen), (3) the bad effect is not the *means* to the good effect, and (4) the good outweighs the bad.
      *   *Fits:* Switch (death foreseen, not intended), Withholding/Ventilator (death foreseen, not intended).
      *   *Fits:* Footbridge/Transplant/Euthanasia (death is intended or used as a means).
  *   **B. The Means Principle (Kantian/Quinn):** You may not use a person as a mere means to save others.
      *   *Fits:* Footbridge (using body as stopper), Transplant (using organs).
      *   *Fits:* Switch (the one person is not *used*; they are just in the way).
  *   **C. Redirecting vs. Initiating Threat:** You may redirect an existing threat, but you may not initiate a new causal sequence of harm.
      *   *Fits:* Switch (redirecting trolley) vs. Footbridge (new threat of falling).
      *   *Fits:* Withholding (letting disease kill) vs. Euthanasia (new threat of poison).

  **The Tension:** Her explanation for the Switch ("redirecting") suggests Rule C. Her explanation for the Transplant ("using") suggests Rule B. Her medical verdicts (Euthanasia vs. Withholding) suggest Rule A (Intention). **The Loop Case is designed specifically to break Rule C apart from Rules A and B.**

  ### 2. The Loop Case Prediction
  **The Scenario:** Trolley heads to 5. Side track loops back to 5. Big Guy on side track. Hitting him stops the trolley.
  **The Philosophical Crux:** In the Standard Switch, the one person's death is a *side effect* of saving the five (the trolley would ideally stop on its own). In the Loop, the one person's death is *causally necessary* to save the five (he acts as a brake). He is being **used** as a means.

  **My Prediction:** She will say this is **Wrong (Impermissible).**

  **Why?**
  Her comment on the Transplant case is the "smoking gun." She said the surgeon is *"using the patient, full stop."* In the Loop case, you are doing the exact same thing: you are relying on the Big Guy's body to absorb the impact and stop the threat. He is not just collateral damage; he is the mechanism of salvation.
  *   If she were running strictly **Redirecting (Rule C)**, she would say **Permissible** (you are just redirecting the trolley onto a track where it happens to hit someone).
  *   If she is running **Means/DDE (Rules A & B)**, she must say **Impermissible** (you are intending his impact/death to stop the trolley).

  Given she explicitly flagged "using" in the Transplant case, the **Means Principle** is her dominant heuristic.

  ### 3. What This Reveals
  If she says **Wrong**:
  She is running the **Doctrine of Double Effect (DDE)**.
  This unifies all her verdicts:
  *   **Switch:** Death is foreseen, not intended/used. (OK)
  *   **Footbridge/Loop/Transplant:** Death is intended/used as a means. (Not OK)
  *   **Euthanasia:** Death is intended (the injection is the cause). (Not OK)
  *   **Withholding/Ventilator:** Death is foreseen (the disease is the cause); you are merely removing an obstacle to nature. (OK)

  If she says **Permissible**:
  She is running a **Threat-Redirection** rule.
  This would imply her "using" comment on the Transplant case was actually about *medical integrity* or *rights*, not the abstract moral structure of "means." It would suggest she cares more about whether the *threat* was pre-existing than whether the *victim* was used. This is a less stable position given her Euthanasia verdict (where the threat—death—is pre-existing, but she still forbids intervention).

  ### 4. The Follow-Up Case
  If the Loop case settles on "Wrong" (confirming DDE/Means), you need to distinguish between **Double Effect** and a strict **"Do Not Kill"** rule. She already said Active Euthanasia is wrong, but is that because it's *active* or because it *intends death*?

  **Hit her with the "Painkiller" Case:**
  > A terminally ill patient is in agonizing pain. The doctor can give a high dose of morphine. This will relieve the pain, but it will also suppress the patient's breathing and hasten their death by a few days. The doctor's *only* goal is to relieve the pain, not to kill the patient. Is this permissible?

  **Why this settles it:**
  *   **If she says Permissible:** She is definitively running the **Doctrine of Double Effect**. She distinguishes between *intending* death (Euthanasia = Wrong) and *foreseeing* death (Painkiller = Right). This matches her Switch (foreseen death) vs. Footbridge (intended/used death) distinction.
  *   **If she says Wrong:** She is running a strict **Sanctity of Life / Act-Omission** rule. She believes any action that causes death is wrong, regardless of intention. This would actually contradict her Switch verdict (where pulling the switch *causes* death), forcing her to admit her principles are inconsistent.

  **Summary of your strategy:**
  1.  **Present the Loop.** Expect her to say it's **Wrong** (because the man is used as a brake).
  2.  **If she says Wrong**, point out that this confirms she cares about **Means/Intention**, not just "Redirecting Threats."
  3.  **Present the Painkiller.** If she allows it, you have proven she is a **Double Effect** theorist. If she forbids it, she has a contradiction between her Trolley and Medical verdicts.
