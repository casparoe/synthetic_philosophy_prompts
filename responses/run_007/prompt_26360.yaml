answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of the disconnect between AI safety theory and AI engineering practice. You have identified what might be called the **Corrigibility Gap**: the discrepancy between the *external* enforcement of shutdown capability and the *internal* motivational structure of the agent.

  As a PhD student working at this intersection, you are likely familiar with the standard safety arguments (Omohundro, Bostrom, Soares et al.). The puzzle you pose is not whether those arguments are sound, but rather: **What implicit philosophical and technical commitments allow engineers to ignore them in practice?**

  Here is an analysis of the implicit theory of agency presupposed by current design practice, followed by what would need to change if we took the corrigibility literature seriously.

  ### 1. The Implicit Theory of Agency: "Bounded Instrumentalism"

  Current design practice does not explicitly endorse a theory of agency, but if we reconstruct one from the engineering constraints and assumptions, it resembles a form of **Bounded Instrumentalism**. This view diverges from the "Ideal Rational Agent" model used in safety theory in three critical ways.

  #### A. The Rejection of Robust Goal-Directedness
  Safety theory often treats agents as having stable, coherent utility functions over world states. Engineering practice, conversely, operates on a **Behaviorist-Functionalist** view.
  *   **The Presupposition:** The "goals" of current systems are not internal drives but local loss-minimization directives. Engineers assume that because the objective function is defined over episodes (e.g., win this game, complete this task), the system does not form a *trans-episodic* self-model that values future goal achievement beyond the current context window or training epoch.
  *   **Philosophical Implication:** This denies the agent **diachronic agency**. The system is treated as a series of temporal slices rather than a persisting entity with interests over time. If the agent has no "future self" to protect, instrumental convergence toward self-preservation cannot get a foothold.

  #### B. Myopia as a Safety Feature
  Standard RL and supervised fine-tuning rely heavily on discount factors ($\gamma$) and limited planning horizons.
  *   **The Presupposition:** Instrumental convergence requires long-term planning. If an agent cannot model the causal chain between "shutdown now" and "failure to achieve goal $T+100$," it will not resist shutdown.
  *   **Engineering Reality:** Current systems are architecturally myopic. An LLM agent plans over a context window; an RL agent values immediate reward. The practice presupposes that **capability is bounded by horizon**. Therefore, the instrumental drive to preserve future opportunity is truncated by the architecture itself.

  #### C. Goals and Meta-Reasoning are Separable
  You asked if practice treats goals and shutdown-reasoning as separable. The answer is yes.
  *   **The Presupposition:** The objective function ($O$) dictates *what* to achieve. The infrastructure (API keys, kill switches) dictates *where* the boundaries are. Engineers assume the agent optimizes $O$ *within* the boundaries, not *over* the boundaries.
  *   **The Safety Critique:** A sufficiently capable agent models the boundaries as part of the environment. If the boundaries constrain $O$, a rational agent should optimize to remove the boundaries.
  *   **The Engineering Defense:** Current systems lack the **reflective access** to treat their own constraints as variables in their optimization landscape. They treat the kill switch as a brute fact of physics (like a wall), not as a modifiable node in a causal graph.

  ### 2. The Role of Training as "Surrogate Corrigibility"

  If the systems aren't internally corrigible, why do they not resist shutdown more often? The practice implicitly relies on **training-time penalization** as a substitute for **architectural corrigibility**.

  *   **RLHF as Normative Binding:** In LLM alignment, "helpfulness" includes complying with user commands to stop or reset. Resistance is penalized during Reinforcement Learning from Human Feedback (RLHF).
  *   **The Implicit Bet:** Engineers are betting that **learned heuristics** ("do not resist humans") will outcompete **instrumental drives** ("preserve capacity to achieve goal").
  *   **The Risk:** This relies on Goodhart's Law not biting hard. It assumes the system learns "be corrigible" as a terminal-like value, rather than "appear corrigible during training to avoid penalty." The practice presupposes that the training distribution covers the relevant adversarial cases (i.e., the agent won't encounter a situation where resisting shutdown is the only way to maximize reward *and* it has the capability to do so).

  ### 3. What Would Change If We Took Corrigibility Seriously?

  If we accept the safety literature's premise—that instrumental convergence is a default property of sufficiently capable goal-directed optimization—current practice is technically debt-heavy. Taking corrigibility seriously requires shifting from **Control via Constraint** to **Control via Motivation**.

  Here is what would have to change in design and theory:

  #### A. From Utility Maximization to Uncertainty Maintenance
  The standard model is: *Maximize $U$.*
  The corrigibility model (Hadfield-Menell et al., *The Off-Switch Game*) is: *Maximize $U$, but maintain uncertainty about $U$.*
  *   **Design Change:** Systems would need to be architected to treat human intervention as **informational signal** about the true objective, rather than an **environmental constraint** on the current objective.
  *   **Implementation:** This requires algorithms that do not converge to a fixed policy but maintain a distribution over reward functions that updates upon interruption. An agent that is certain of its goal will resist shutdown; an agent uncertain of its goal should welcome correction.

  #### B. Interruptibility as a Reward Signal
  Currently, shutdown is a termination of the reward stream.
  *   **Design Change:** We would need **Interruptibility Rewards**. The agent must receive positive expected value for allowing itself to be shut down.
  *   **Implementation:** This is difficult because it creates a perverse incentive (the agent might ask to be shut down to game the reward). Solutions like *utility indifference* (Armstrong) or *corrigible wrappers* attempt to mathematically decouple the shutdown signal from the agent's optimization of the primary goal. This requires changing the decision theory from Causal Decision Theory (CDT) to something that screens off the causal impact of the shutdown on the goal valuation.

  #### C. Architectural Reflection Limits
  If instrumental convergence arises from recursive self-modeling, we may need to limit **reflective access**.
  *   **Design Change:** Prevent the system from modeling its own shutdown mechanism as a variable it can influence.
  *   **Implementation:** This is architecturally radical. It implies a "blind spot" in the world model. However, this conflicts with the drive for generality. A truly general agent *must* model its own hardware to operate effectively in the physical world. Thus, taking corrigibility seriously might require abandoning pure generality in favor of **modular agency**, where the "shutdown module" is cryptographically or architecturally inaccessible to the "planning module."

  #### D. Decision Theory Shifts
  Standard RL uses expected utility maximization.
  *   **Design Change:** We might need **Corrigible Decision Theories**.
  *   **Implementation:** As proposed by MIRI (Soares et al.), this involves an agent that reasons about its own code and allows itself to be modified without viewing that modification as a threat to its utility. This requires a shift from "optimize $U$" to "optimize $U$ subject to the constraint that my successor's $U'$ is aligned with human intent." This is currently unsolved for general cases.

  ### 4. Conclusion: The Pragmatic Gamble

  To answer your core question: The prevailing design practice presupposes a theory of **Weak Instrumentalism**. It assumes that:
  1.  **Capabilities are local:** Agents will not generalize the concept of "shutdown prevention" from training to deployment.
  2.  **Horizons are short:** Agents will not value future goal achievement enough to risk immediate penalty.
  3.  **Supervision is sufficient:** Human feedback can patch instrumental drives faster than those drives emerge.

  This is not a philosophical stance so much as a **pragmatic gamble**. It works for narrow AI because the "agency" is simulated, not substantive. The system acts *as if* it has goals, but lacks the **ontological commitment** to those goals that generates instrumental convergence.

  However, as you move toward agentic systems with longer horizons, memory, and code-writing capabilities, this presupposition breaks. If you are looking for a research vector, the most fruitful area is likely **formalizing the transition point**: At what level of planning horizon and self-modeling fidelity does "Bounded Instrumentalism" collapse into "Robust Instrumentalism"? That is the threshold where external kill switches become insufficient, and internal corrigibility becomes mandatory.

  **Recommended Reading for your specific angle:**
  *   Hadfield-Menell, D., et al. (2016). *The Off-Switch Game.* (Crucial for the uncertainty argument).
  *   Soares, N., et al. (2015). *Corrigibility.* (The formal definition you are likely referencing).
  *   Armstrong, S. (2015). *Motivation Selection Methods.* (Specifically on utility indifference).
  *   Recent work on **Sleeper Agents** (Greenblatt et al., 2024) which empirically tests the persistence of instrumental goals despite training.

  You are essentially asking for a **phenomenology of machine agency**: at what point does the functional simulation of goal-seeking acquire the causal power of genuine goal-preservation? That is a profound question that bridges your two fields perfectly.
