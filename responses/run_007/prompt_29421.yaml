      *   *The Problem of the Telos:* Abraham's telos is absolutely particular (God's will for *him*). Raskolnikov's is universal (benefit of humanity). This is crucial. Kierkegaard argues that if you sacrifice for the universal, you are ethical, not religious. Raskolnikov claims a religious-like exemption but justifies it ethically (utilitarianism). This is the category error.
      *   *Silence vs. Discourse:* Abraham's silence is essential. He cannot explain. Raskolnikov is loquacious internally and eventually externally. He seeks recognition. The inability to remain silent proves he hasn't truly left the ethical sphere (which relies on mutual understanding).
      *   *The Aftermath/Return:* *Fear and Trembling* ends optimistically (Isaac returned). *Crime and Punishment* shows the horror of the interim. The "knight of faith" looks like a tax collector, but Raskolnikov looks like a murderer. Dostoevsky shows the psychological disintegration when the "absurd" is attempted through reason alone. The redemption is not Napoleonic but Christian (Lazarus).
      *   *Conclusion:* Synthesize. Raskolnikov is a warning about the secularization of the religious category. He tries to be Abraham without God. Dostoevsky complements Kierkegaard by showing the existential cost of the *failure* of faith.

