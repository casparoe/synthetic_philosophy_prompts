answer: |-
  This is a sophisticated methodological challenge. You are correct that the literature is plagued by equivocation, particularly regarding the scope of 'ought' (prima facie vs. all-things-considered) and the nature of the impossibility (physical vs. normative). A dissertation that begins by clarifying the *conditions of adequacy* for a theory of dilemmas will be significantly stronger than one that merely catalogs arguments.

  Below is a specification of the conceptual terrain. I have structured this to distinguish between **Explanatory Desiderata** (data points a theory must account for, even if by explaining them away) and **Substantive Desiderata** (theoretical commitments a theory might adopt). I have also highlighted the "Impossible Tetralogy"—the set of commitments that appears jointly unsatisfiable, which is the engine of the debate.

  ### I. Preliminary Definition: The Target Phenomenon
  To avoid the "talking past" problem, we must define the target. A **Genuine Moral Dilemma (GMD)** exists if and only if:
  1.  An agent is under a moral obligation to do $A$.
  2.  The agent is under a moral obligation to do $B$.
  3.  The agent cannot do both $A$ and $B$.
  4.  Neither obligation overrides or cancels the other (no *prima facie* escape).
  5.  The obligations are all-things-considered (ATC), not merely pro tanto.

  *Note:* Much of the debate hinges on whether (5) is possible. Sceptics argue conflicts only exist at the *pro tanto* level; Proponents argue they reach the ATC level.

  ---

  ### II. The Desiderata Specification

  The following table outlines the requirements for a satisfactory theory. I have distinguished between **Non-Negotiable** (any theory ignoring these fails to engage the phenomenon) and **Contestable** (theories may reasonably reject these to preserve other commitments).

  | # | Desideratum | Motivating Case / Consideration | Cost of Abandonment | Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **Phenomenological Adequacy** | **The Experience of Tragedy:** Agents in situations like *Sophie's Choice* or Williams's *Jim and the Indians* report inescapable moral distress, not merely epistemic uncertainty. <br>*(Motivation: Williams, Nussbaum)* | If ignored, the theory becomes revisionary to the point of irrelevance. It describes a rational agent, not a human moral agent. | **Non-Negotiable** (Must *account* for it, even if as illusion) |
  | **D2** | **Deontic Consistency** | **The Logic of Obligation:** Standard Deontic Logic (SDL) assumes consistency. If $OA$ and $OB$, then $O(A \land B)$. If $\neg \diamond(A \land B)$, then $\neg (OA \land OB)$. <br>*(Motivation: Lemmon, Brink)* | If abandoned, morality risks becoming logically incoherent. If contradictions are permitted, 'ought' loses its action-guiding force. | **Contestable** (Paraconsistent logics exist, but are costly) |
  | **D3** | **Action Guidance (Rational Resolvability)** | **The Function of Normativity:** Morality tells us what to do. If dilemmas are genuine, the agent faces a situation where morality demands the impossible. <br>*(Motivation: Kant, Brink)* | If abandoned, morality ceases to be a guide for choice and becomes a source of inevitable failure. | **Non-Negotiable** (Must explain how choice is possible) |
  | **D4** | **Moral Residue (Remainders)** | **The Persistence of Guilt:** After choosing $A$ over $B$ in a conflict, agents feel appropriate guilt/regret regarding $B$, even if $A$ was the right choice. <br>*(Motivation: Williams, Foot)* | If abandoned, we cannot distinguish dilemmas from simple override cases. It erases the "tragic" element. | **Non-Negotiable** (Must explain the residue) |
  | **D5** | **'Ought Implies Can' (OIC)** | **Metaphysical Fairness:** It is unjust to obligate an agent to do what is impossible. If I can't do $A$ and $B$, I cannot be obliged to do both. <br>*(Motivation: Kant, contemporary metaethics)* | If abandoned, obligation becomes detached from agency. It threatens the link between responsibility and control. | **Contestable** (Some argue OIC applies to ATC only, or not at all) |
  | **D6** | **Ontological Objectivity** | **Mind-Independence:** Are dilemmas features of the world (Marcus) or features of our normative systems (Sceptics)? A theory should locate the conflict. <br>*(Motivation: Marcus vs. Hare)* | If ignored, the theory conflates epistemic limitations with ontological conflicts. | **Non-Negotiable** (Must take a stance) |

  ---

  ### III. The "Impossible Tetralogy": Jointly Unsatisfiable Desiderata

  This is the substantive result you requested. The literature suggests that the following four commitments form an inconsistent set. A theory can hold any three, but must abandon the fourth. This tension is not merely a dispute between authors; it is a structural feature of the conceptual space.

  1.  **Genuine Conflict:** ATC obligations can conflict ($OA \land OB \land \neg \diamond(A \land B)$).
  2.  **Deontic Agglomeration:** If $OA$ and $OB$, then $O(A \land B)$. (Standard Logic).
  3.  **Ought Implies Can:** If $O(A \land B)$, then $\diamond(A \land B)$.
  4.  **No Moral Glitches:** Morality is a consistent, rational system that does not demand impossibilities.

  **The Tension:**
  *   **The Sceptic (e.g., Brink):** Denies (1). Preserves Logic, OIC, and Rationality. *Cost:* Must explain away Phenomenology (D1) and Residue (D4) as irrational or non-moral.
  *   **The Tragic Realist (e.g., Williams/Marcus):** Denies (4) (and often (2)). Accepts Conflict, preserves Phenomenology and Residue. *Cost:* Morality becomes inconsistent or irrational; Action Guidance (D3) is compromised.
  *   **The OIC Absolutist:** Denies (1) or (5). If I can't do both, I ought to do neither, or the 'oughts' dissolve. *Cost:* Counter-intuitive in cases of unavoidable harm.
  *   **The Paraconsistent Logician:** Denies (2). Accepts Conflict and OIC but rejects Agglomeration. *Cost:* High technical cost; requires non-classical logic for normativity.

  **Dissertation Insight:** Your chapter should argue that the debate is not primarily about *whether* dilemmas exist, but about **which horn of this tetralogy is least costly to abandon.**

  ---

  ### IV. Map of Consensus vs. Contested Terrain

  To ensure you do not present live disputes as settled, use this distinction in your chapter.

  #### A. Genuinely Settled (Methodological Consensus)
  *   **Distinction between Epistemic and Ontological Dilemmas:** All parties agree that an agent *believing* they face a dilemma is different from *actually* facing one. The debate is about the latter.
  *   **Pro Tanto vs. All-Things-Considered:** Everyone agrees conflicts exist at the *pro tanto* level (e.g., promise-keeping vs. harm-prevention). The debate is strictly about whether these conflicts survive to the ATC level.
  *   **The Existence of Moral Residue:** Everyone agrees agents *feel* residue. The dispute is about what this feeling *signifies* (evidence of past obligation vs. psychological artifact).

  #### B. Deeply Contested (The Live Disputes)
  *   **The Scope of OIC:** Does 'Ought' imply 'Can' for *prima facie* duties, ATC duties, or neither? (Walter Sinnott-Armstrong vs. Kantians).
  *   **The Nature of 'Ought':** Is 'ought' univocal? Sceptics often argue dilemmas arise from equivocation (e.g., 'ought' relative to system X vs. system Y). Proponents argue for a univocal ATC 'ought'.
  *   **Rationality of Regret:** Is agent-regret in a dilemma rational (Williams) or a sign of irrationality/confusion (Stocker/Brink)?
  *   **Deontic Logic Applicability:** Is Standard Deontic Logic the correct tool for moral theory, or does it impose artificial consistency on a messy normative reality?

  ---

  ### V. Strategic Advice for Your Chapter

  1.  **Avoid the "Definition Trap":** Do not spend too long defining "dilemma." Instead, present the **Impossible Tetralogy** early. Frame the positions not as "Pro-Dilemma" vs. "Anti-Dilemma," but as "Which constraint do you relax?"
      *   *Brink* relaxes Conflict (D1).
      *   *Marcus* relaxes Consistency (D2).
      *   *Williams* relaxes Rational Resolvability (D3).
  2.  **Handle 'Ought Implies Can' with Care:** This is the most common pivot point. If you treat OIC as a fixed premise, you rig the game against the Pro-Dilemma side. If you treat it as contingent, you must explain why. Place OIC in the **Contestable** category in your analysis.
  3.  **The "Residue" Argument:** This is your strongest lever for the Pro-Dilemma side. The sceptic must explain why I feel guilty for violating an obligation I *didn't actually have* (because it was overridden). If the sceptic says "you feel guilty because you *thought* you had an obligation," they risk patronizing the phenomenology. If they say "you feel guilty because you failed a *pro tanto* duty," they must explain why failing a overridden duty generates guilt (usually, overridden duties don't generate blame).
  4.  **Distinguish 'Blame' from 'Guilt':** A nuanced theory allows that an agent in a dilemma is not *blameworthy* (externally sanctioned) but may rightly feel *guilt* (internally registered). This helps satisfy D3 (Action Guidance/Blame) while keeping D4 (Residue).

  ### VI. Summary of Requirements for Your Theory

  If you are evaluating existing theories or proposing your own, a satisfactory account must:

  1.  **Explicitly state its position on the Tetralogy.** (Which of the four commitments does it reject?)
  2.  **Provide an error theory for the opposing intuition.** (If you deny dilemmas, why do they feel so real? If you affirm them, why does logic seem to forbid them?)
  3.  **Clarify the 'Ought'.** (Is it objective, subjective, pro tanto, or ATC?)
  4.  **Account for the "Remainder."** (What happens after the choice?)

  By structuring your chapter around these desiderata and the tensions between them, you will move beyond a survey of arguments into a meta-ethical analysis of *why* the arguments stall. This demonstrates the senior-level grasp of the material you are aiming for.
