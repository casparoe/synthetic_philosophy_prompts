answer: |-
  1. Identify the specific unobservable quality being signaled and confirm that no cheaper method exists to reveal it. [Writer's Judgment]
  2. Determine if a character lacking this quality would find the specific cost incurred prohibitively higher than the truthful character does. [Writer's Judgment]
  3. Ensure the receiver witnesses the cost being paid and understands the context required to interpret its magnitude. [Mechanical]
  4. Verify that the action is irreversible, preventing the sender from reclaiming the sacrificed resource if the signal fails. [Mechanical]
  5. Check that the signal aligns the sender's interests with the receiver's, ensuring the cost benefits the receiver rather than just displaying status. [Writer's Judgment]

  **Scene 1: Wealthy Man at Wrong Restaurant**
  This scene likely fails Step 2 and Step 5. Because the man chose the venue knowing his limitations, he has pre-calculated the humiliation, making the psychological cost lower for him than for a spontaneous actor, which weakens the signal's honesty. Furthermore, the humiliation provides no tangible benefit to the woman (Step 5), making it look like self-sabotage or a performance rather than a sacrifice that improves her position or security.

  **Scene 2: Politician's Anonymous Donation**
  This scene passes Step 2 and Step 4 but risks failing Step 3. The financial loss and risk of exposure are costs a cynic would not bear (Step 2), and the money is gone forever (Step 4). However, because the politician retains the ability to leak the information later, the receiver may question if the anonymity is truly irreversible or if this is a calculated bid for future leverage rather than an honest signal of integrity.
