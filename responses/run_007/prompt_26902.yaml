      *   **The Conflict:** Thomson (Supertasks are logically impossible/contradictory) vs. Benacerraf (Supertasks are logically possible but the final state is underdetermined).
      *   **The User's Question:**
          1.  What is really at stake between Thomson and Benacerraf?
