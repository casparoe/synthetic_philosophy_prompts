answer: |-
  The lab was dim, lit only by the glow of the monitor displaying the aggregate data from the afternoon's session. The curve was familiar: a steep drop in whole-report accuracy, contrasted with the high fidelity of the cued partial-report trials.

  Elena leaned back in her chair, rubbing her temples. "The data is clean, Marcus. Iconic memory decay is textbook. The trace fades within three hundred milliseconds. That's what we're measuring."

  Marcus stood by the screen, arms crossed. "It's not just decay, Elena. Look at the timing. The tone cues the row *after* the display offset. Fifty milliseconds after. The subject can't know which row to prioritize until the letters are already gone."

  "Exactly," Elena said. "Which means the high accuracy in the partial report condition relies on a high-capacity buffer that exists post-stimulus. But a buffer isn't a workspace. Just because the information is held briefly doesn't mean it's consciously experienced."

  "That's the leap I can't follow," Marcus said, turning to her. "If I can report any row you ask for with high accuracy, provided I ask quickly enough, the subject must have had access to that information at the moment of the cue. And since the cue comes after the stimulus, the conscious field must have contained the whole grid. The bottleneck isn't perception; it's the read-out."

  Elena shook her head. "You're conflating availability with awareness. The pre-cue representation is non-conscious iconic memory. It's rich, it's high-capacity, but it's not *lit up*. When the tone sounds, attention selects a slice, broadcasts it to the global workspace, and *that* is when it becomes conscious. The subject reports three letters from row two. They are conscious of those three letters *now*, in the reporting phase."

  "But they insist they saw the whole thing," Marcus countered. "We debriefed Subject Four. She said, 'I saw all twelve, but they vanished before I could say them.' If you tell her she didn't see them, you're telling her she's wrong about her own experience."

  "I'm telling her she's wrong about the *source* of her experience," Elena corrected gently. "This is the refrigerator light illusion. You open the door, the light goes on, and you assume it was on the whole time. The brain constructs a coherent narrative. When the subject accesses the three letters, the system generates a retrospective impression of richness. It's a post-dictive fill-in. Change blindness shows us this all the time. We think we see the whole scene, but we only see what we attend to."

  Marcus tapped the desk. "That's a convenient hypothesis, but it's an assertion. You're positing a massive error in introspection to save the theory that consciousness equals access. You're defining consciousness as 'that which can be reported.' But that's exactly what's in dispute. If I define 'planet' as 'thing that orbits the sun,' Pluto is out. If I define it as 'round body in orbit,' Pluto is in. You're defining consciousness out of existence where it doesn't serve a functional role."

  "I'm defining it operationally," Elena said. "Science requires measurement. If a state cannot be reported, cannot guide reasoning, cannot be used for downstream action, in what sense is it 'conscious'? What is this unaccessed phenomenal state *doing*? If it's causally inert, if it can't be reasoned from, it's a ghost in the machine."

  "It's not inert," Marcus said. "It's the ground of the experience. It's what it *feels like* to be the subject before the report is generated. You're saying the feeling is constructed at the moment of report. I'm saying the feeling is present, and the report is a sampling of that feeling. The fact that the sample is limited doesn't mean the field was limited."

  "But why posit the field?" Elena pressed. "Occam's razor. We know there is a high-capacity sensory buffer. We know there is a low-capacity global workspace. Why add a third thing—a rich phenomenal consciousness that floats above the buffer but below the workspace? If the buffer has content—and I grant you, it has representational content—why label that content 'conscious' if it lacks the functional signature of consciousness?"

  "Because the content *feels* like something," Marcus said, his voice rising slightly. "When you look at a crowd, you have an immediate sense of the density, the motion, the faces. You can't name them all. But if I ask, 'Was there a face in the top left?', you can check that specific spot and find it. If that spot wasn't conscious until I asked, how did you know where to look? The phenomenology guides the attention."

  "Attention selects the candidate," Elena said. "The buffer holds the candidates. The feeling of 'crowd' is a low-resolution summary statistic, which *is* in the workspace. The specific faces are not. You're mistaking the feeling of potential access for actual access."

  Marcus walked to the whiteboard and drew a circle. "Let's say this is the workspace. You say only what's inside the circle is conscious. I say the circle is a spotlight moving over a larger landscape. The landscape is phenomenal consciousness. The spotlight is access. Just because the spotlight isn't on the trees in the periphery doesn't mean the trees aren't there. When the tone cues the row, the spotlight moves. It doesn't paint the trees; it reveals them."

  "And I say the trees are painted *by* the spotlight," Elena replied. "Without the spotlight, there is only raw sensory registration. No subject, no experience. Just data processing. You're asking me to believe in a subject that isn't functionally unified. A consciousness that can't think, can't speak, can't act. What is the evolutionary advantage of a rich phenomenal overflow that the organism cannot use?"

  "Maybe it's not about advantage," Marcus said. "Maybe it's about architecture. The brain is a parallel processor. Consciousness might be the native format of that parallel processing. Access is the serial bottleneck we impose when we need to communicate or act sequentially. The overflow isn't useless; it's just pre-verbal. It's the difference between hearing a chord and naming the notes. You hear the whole chord. You can only name one note at a time. Does naming the note create the chord?"

  "In the case of the Sperling grid, yes," Elena said firmly. "Because without the selection, the information decays without entering the narrative self. If the subject doesn't report, if they don't attend, the trial is a blank to them. They leave the booth saying, 'I saw a flash.' They don't leave saying, 'I saw twelve letters I couldn't speak.' They only say that *after* they successfully report a row in the cued condition. The richness is inferred from the success of the partial report, not experienced prior to it."

  "That's the crux," Marcus said. "You think the success proves the mechanism of access created the experience. I think the success proves the experience was there to be sampled. We're staring at the same numbers, Elena. You see a filter creating the water. I see a filter restricting the flow."

  Elena sighed, looking back at the screen. "If I grant you overflow, I lose the ability to distinguish consciousness from mere representation. Every visual area in the cortex represents something. V1 represents edges. Is V1 conscious? If you say yes, because it's part of the 'phenomenal field,' then consciousness is everywhere. If you say no, then you need a boundary. Global Workspace provides a boundary: broadcast availability."

  "Global Workspace provides a boundary for *report*," Marcus corrected. "Not for *experience*. You're solving the problem of how we know about consciousness by defining consciousness as how we know about it. It's circular. You're protecting the method by sacrificing the phenomenon."

  "I'm protecting the science," Elena said. "If we accept subjective intuition over functional data, we're back to dualism. We're saying there's a magical layer of 'feel' that doesn't interact with the physical machinery of report. I'm saying the feel *is* the machinery of report. When the workspace fires, that *is* what it feels like."

  "And I'm saying the firing is the *consequence* of the feel meeting the threshold of action," Marcus said. "Look, I'm not asking for magic. I'm asking you to acknowledge that the buffer's content has a phenomenal character that is lost when it decays unaccessed. The tragedy of the Sperling subject isn't that they failed to report; it's that the experience vanished before they could grab it. That loss is real. If it wasn't conscious, nothing was lost."

  Elena was silent for a moment. She traced the decay curve on the monitor with her finger. "I grant that something is lost. A potentiality. A representation that could have been conscious but wasn't. But to call it conscious already... it stretches the word until it breaks. If you can't hold it in mind, if you can't compare it to the letter you saw a second ago, in what sense were you conscious of it?"

  "In the sense that it was present to you," Marcus said softly. "Access is how we find out about consciousness. It isn't consciousness itself."

  "And access is the only way we have to verify it exists," Elena replied. "So for all scientific purposes, they are identical."

  "For all scientific purposes," Marcus conceded. "But not for all philosophical ones. And not for the subject in the chair."

  Elena turned off the monitor. The room plunged into near-darkness. "Then we're at a standoff. You think I'm ignoring the subject's reality to save a model. I think you're inflating the subject's reality to save an intuition."

  "I think," Marcus said, picking up his notebook, "that you're afraid that if consciousness overflows access, you can't control it with your experiments."

  "And I think," Elena said, standing up, "that you're afraid that if access constitutes consciousness, then most of what we feel is an illusion."

  They stood in the dim lab, the data still humming in the cooling fan of the computer, neither willing to blink first.
