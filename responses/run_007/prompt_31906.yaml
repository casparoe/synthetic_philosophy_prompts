answer: |-
  This is a profound juxtaposition. Reading *Omelas* through the lens of moral trade does not merely illustrate a philosophical point; it stress-tests the structural assumptions of the moral-trade framework itself.

  The literature on moral trade (championed by philosophers like William MacAskill, Gustaf Arrhenius, and others) generally operates within a meta-ethical framework that assumes **commensurability** and **agent-neutrality**. It posits that moral values can be weighted, that concessions can be quantified, and that the goal is to maximize expected moral value across a distribution of credences.

  *Omelas*, however, presents a scenario that functions as a *reductio ad absurdum* of unconstrained moral trading. It suggests that the moral-trade framework lacks a theory of **boundaries**. Below, I outline three specific limits that the story reveals, arguing that the "walkers-away" are not suffering from emotional bias, but are instead responding to structural flaws in the trading model regarding consent, incommensurability, and integrity.

  ### 1. The Problem of Non-Consensual Stakeholders
  The most immediate friction between moral trade and *Omelas* concerns who sits at the bargaining table.

  In standard moral trade scenarios, the agents trading are the owners of the values being swapped. If I care about animals and you care about poverty, I concede some animal welfare *that I would have otherwise produced*, and you concede some poverty relief *you would have otherwise produced*. We are trading our own resources and moral capital.

  In Omelas, the citizens are not trading their own suffering. They are trading the child's. The child is a stakeholder in the moral equation—the one bearing the cost—but is excluded from the bargaining process. From the perspective of moral trade theory, this looks like an **externality** that has been improperly internalized.

  A sophisticated moral-trade theorist might argue that the citizens *are* trading with each other: "I will suppress my revulsion if you suppress yours, so we can both enjoy the utopia." But this reveals a limit in the framework: **Moral trade cannot legitimize the violation of rights held by non-participants.** If the "currency" of the trade is the bodily integrity of a non-consenting third party, the trade is not a moral exchange; it is a conspiracy to commit harm.

  The walkers-away recognize this structural exclusion. They do not try to renegotiate the terms (e.g., "Can we torture the child less?") because they recognize that the child has no price. To the moral-trade theorist, the walkers signal that **some agents possess veto power** that cannot be overridden by aggregate gain. This suggests that moral trade requires a prior deontological framework to determine *what* is tradable. Without side-constraints, moral trade collapses into utilitarianism with extra steps.

  ### 2. Incommensurability vs. Exchange Rates
  The moral-trade framework relies on the ability to assign exchange rates. It asks: *How much animal suffering is equivalent to how much human poverty alleviation?* It assumes a common currency of "moral value" or "expected choiceworthiness."

  *Omelas* dramatizes the breakdown of this assumption. The story presents two values: the innocence of the child and the flourishing of the city. The citizens accept an exchange rate (1 child's misery for 100,000 people's joy). The walkers reject the existence of an exchange rate entirely.

  This points to the philosophical concept of **lexical priority**. Some values are not just "heavier" than others; they operate on a different plane. If innocence is lexically prior to happiness, no amount of happiness can offset its violation. The moral-trade model treats all values as continuous variables that can be dialed up or down. *Omelas* suggests some values are binary or threshold-based: once the threshold of "fundamental injustice" is crossed, the function returns `null`, not a negative number.

  Is this emotional vividness masking a bias? It could be argued that the walkers are simply suffering from "scope neglect"—they focus on the vivid suffering of one while ignoring the abstract happiness of many. However, the story counters this by describing the city's joy as real, tangible, and immense. The walkers know the math. They are not bad at arithmetic; they reject the algebra. They reveal that the moral-trade framework may be **category-mistaken** when it attempts to quantify dignity. If values are truly incommensurable, the "trade" is an illusion; it is actually a surrender of one value to another, disguised as a transaction.

  ### 3. Agent-Relative Integrity vs. Agent-Neutral Optimization
  Moral trade is typically agent-neutral. It asks, "How do we maximize the good?" The walkers-away are responding to an agent-relative concern: "What does participating in this system do to *me*?"

  This is the problem of **complicity**. In the moral-trade model, if the net outcome is positive, the action is justified. But the walkers suggest that there is a cost to the *trader* that the model ignores. By accepting the bargain, the citizens of Omelas become complicit in the torture. They integrate the suffering into their own moral identity.

  The walkers refuse to let their moral integrity be a variable in the equation. They prioritize **moral cleanliness** over **moral impact**. A strict moral-trade theorist might label this irrational or selfish (refusing to save 100,000 people to keep one's own hands clean). But this misses the point of the walkers' action. They are not trying to maximize the good; they are refusing to be the *kind of agent* for whom such a trade is possible.

  This reveals a limit in the moral-trade framework's psychology. It assumes agents are flexible vessels for moral value. *Omelas* suggests agents have boundaries of integrity that, if crossed, destroy their capacity to value anything at all. The walkers go "into the darkness," implying they are leaving the system of value calculation entirely. They are not optimizing; they are exiting the game. In game theory terms, they are rejecting the payoff matrix.

  ### What Should the Moral-Trade Theorist Say?
  If we take the story seriously, the moral-trade theorist cannot simply dismiss the walkers as irrational. To do so would be to admit that the theory cannot account for deep-seated moral intuitions about justice and rights. Instead, the theorist should integrate the lesson of Omelas in three ways:

  1.  **Define the Permissible Set:** Moral trade must operate within a "permissible set" of actions defined by rights or side-constraints. Trades involving non-consenting victims are off the table, regardless of the exchange rate. The child in Omelas is not a resource to be allocated; she is a right-holder whose veto was ignored.
  2.  **Acknowledge Incommensurability:** The theory must allow for "trading halts." When two values are lexically ordered or fundamentally incommensurable, bargaining should stop. The model needs a mechanism to detect when an exchange rate is spurious.
  3.  **Value Integrity:** The framework should account for agent-relative constraints. If participating in a trade corrupts the agent's future moral capacity or violates their integrity, that is a genuine cost to be weighed, not just a bias to be corrected.

  ### Conclusion
  *Omelas* does not merely trade on emotional vividness. It dramatizes a genuine structural objection to the moral-trade framework: **without prior constraints on what can be traded, moral trade becomes moral laundering.**

  The citizens of Omelas are the ultimate moral traders. They have weighed the credences, calculated the expected value, and struck the deal. The walkers-away represent the recognition that some equations should not be solved. They are not irrational; they are operating on a meta-level that the trading model presupposes but does not articulate. They remind us that before we can bargain about *how much* suffering is acceptable, we must agree on *whose* suffering is up for negotiation. The walkers refuse to negotiate the child, and in doing so, they expose the boundary where trade ends and tyranny begins.
