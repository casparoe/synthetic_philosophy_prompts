answer: |-
  To begin constructing a job description for the species category, one must first acknowledge that the concept is asked to carry a heavy theoretical load within evolutionary and systematic biology. It is not merely a label for convenience but is expected to carve nature at its joints. Consequently, the first and perhaps most fundamental desideratum is ontological objectivity. The theory must posit that species are real entities existing independently of human classification, rather than arbitrary segments of a continuum. This is motivated by the scientific realist intuition that successful biology discovers structures in the world rather than imposing them upon it. For most evolutionary biologists, this is non-negotiable, though instrumentalists might argue it is merely a preference for a particular metaphysical stance. Closely linked to this is the requirement that the concept explains phenotypic and genetic cohesion. We observe that members of a group resemble one another more than they resemble outsiders, and an adequate theory must account for the causal mechanism maintaining this similarity, typically through gene flow or common descent. This is largely non-negotiable, as a concept that fails to explain why organisms look and act alike would be biologically vacuous.

  Furthermore, the concept must identify species as the primary units of evolution. This means they must be entities that persist through time, accumulate changes, and potentially go extinct, serving as the relata in macroevolutionary explanations. This requirement is motivated by the need to bridge microevolutionary processes with the broader patterns of the tree of life and is considered non-negotiable for any theory claiming to be evolutionary in nature. However, this theoretical role must be balanced against a pragmatic epistemic requirement: diagnosability. Systematists and field biologists must be able to identify species boundaries using available evidence, whether morphological, molecular, or ecological. While a preference for some camps, this is practically non-negotiable for the discipline of taxonomy, for a species concept that renders species unidentifiable is operationally useless. Additionally, the theory must accommodate the full diversity of life. It cannot be restricted solely to sexually reproducing animals but must extend to asexual organisms, plants, and microbes. This universality is often treated as non-negotiable for a general theory of biology, though some argue it is a category error to expect one concept to cover all life forms. The concept must also respect the results of population genetics, specifically regarding hybridization and introgression. It cannot contradict the empirical finding that distinct lineages often exchange genes without collapsing into a single homogenous mass. This is non-negotiable, as it contradicts established genetic data to insist on absolute reproductive isolation. Finally, there is a preference for temporal stability. Taxonomists prefer that species names remain stable over time, yet this is merely a preference, as evolutionary reality is often dynamic and messy.

  Having laid out these requirements, one must confront the uncomfortable truth that several of these desiderata appear to be mutually exclusive, creating a tension that no single concept can fully resolve. The most significant incompatibility lies between universality and mechanistic specificity. If one demands a causal mechanism like interbreeding to explain cohesion, one satisfies the explanatory power for animals but fails the universality requirement for asexual taxa. Conversely, if one adopts a pattern-based definition like monophyly to ensure universality, one often loses the causal explanation for why the group holds together in the present moment. A second tension exists between ontological reality and epistemic access. It is entirely possible that real evolutionary lineages exist that are cryptic and indistinguishable by any current diagnostic method. Insisting on diagnosability as a non-negotiable criterion risks conflating our knowledge of species with the species themselves, potentially denying the existence of real but indistinguishable lineages. A third conflict arises between the requirement for species to be stable units of evolution and the empirical reality of speciation as a gradual process. If species are discrete units, there must be a moment of birth, yet evolutionary biology suggests speciation is often a protracted continuum. Demanding sharp boundaries contradicts the gradualist nature of evolution, while accepting fuzziness undermines the utility of species as discrete counts of biodiversity. These trade-offs suggest that the job description contains internal contradictions that no single candidate can perfectly satisfy.

  When we briefly assess the leading candidates against this demanding list, the Biological Species Concept fares well on cohesion and explanatory power for sexual organisms, as it grounds the species in the concrete mechanism of reproductive isolation. However, it fails the universality requirement completely, as it cannot accommodate asexual lineages or fossils, and it struggles with the non-negotiable need to accommodate frequent hybridization in nature. The Phylogenetic Species Concept, by contrast, secures the requirement for evolutionary independence and universality by defining species as the smallest diagnosable monophyletic groups. It satisfies the systematist's need for diagnosability and applies to all life, but it risks violating the preference for stability by oversplitting populations into trivial units and often fails to explain the causal maintenance of cohesion, focusing instead on historical pattern. Finally, a version of pluralism, which suggests different concepts are appropriate for different biological contexts, effectively dissolves the incompatibilities by accepting that no single concept can satisfy all desiderata simultaneously. It respects the non-negotiable constraints of genetics and diversity by allowing flexibility, but it sacrifices the theoretical unity and ontological simplicity that many biologists desire, effectively admitting that the job description is too contradictory for a single employee. Thus, the choice of a species concept ultimately depends on which of these conflicting desiderata one prioritises, as the perfect theory remains elusive.
