prompt: |-
  I'm writing a paper on what a species concept is actually supposed to do for us, and before I assess any particular candidate I want the job description laid out clearly. Please write out the desiderata that any adequate theory of what a species is must satisfy, for the purposes of evolutionary biology and systematic biology. I want the full list: the phenomena it must explain or accommodate, the cases it must get right, the distinctions it must respect, the results from evolutionary biology it cannot contradict, and the pragmatic or epistemic roles it is supposed to play. For each requirement, give the case or consideration that motivates it, and say whether it is non-negotiable or merely a preference of one camp. Then flag any pair of desiderata that you suspect cannot be jointly satisfied — that is the part I most want to see. Finally, sketch very briefly how the biological species concept, the phylogenetic species concept, and one version of pluralism fare against the list, but keep the weight on the criteria themselves rather than on the scoring. Please write in British English, and in continuous prose with no headings, bullet points, bold text, or tables — the way you would write a letter or an essay.
