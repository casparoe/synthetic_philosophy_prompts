      *   **Contingent vs. Necessary:** The reliability challenge is hardest for contingent beliefs. Math is necessary. Does the challenge apply the same way? (Shapiro, Hale).
      *   **Pre-established Harmony/Conceptual Truth:** Alternatives to FBP. Maybe math is true in virtue of concepts (Kantian/Carnapian echoes) or structuralism.
      *   **Naturalism:** The dilemma assumes methodological naturalism. If one rejects naturalism, the dilemma dissolves (but at a cost).
      *   **Evolutionary Debunking:** The reliability challenge is often linked to evolutionary explanations of belief.

