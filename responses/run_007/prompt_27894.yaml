      *   *Round 1 (Maya vs. Eli on Causal Theory):* Eli is right that the causal theory is dated. Maya is right that the original argument used it. *Verdict:* Eli wins on the state of play, Maya wins on exegesis of 1973.
      *   *Round 2 (Reliability Challenge):* Maya is right that this is the core issue. The "coincidence" worry is the modern formulation.
      *   *Round 3 (Full-Blooded Platonism):* Eli is right that FBP solves reliability. Maya is right that it creates new problems (uniqueness/reference). FBP is a high-cost solution.
      *   *Round 4 (Explanatory Demand):* Eli raises a deep meta-philosophical point. Is naturalism required? This is the "Gödelian Rationalist" escape route.
