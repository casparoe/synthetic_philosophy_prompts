      *   *Animal/Baby Consciousness:* Do they have concepts? If not, are they unconscious zombies? (Very Serious).
      *   *Temporal Lag/Libet:* Does the HOT come after the FOS? If so, is the experience retroactively conscious? (Serious/Empirical).
