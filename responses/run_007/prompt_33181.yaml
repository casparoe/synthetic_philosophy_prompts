      *   *Section 1: The Sapir-Whorf Divergence.* Hofstadter sees language as a *lens*; *Arrival* sees it as *surgery*. Hofstadter believes the "self" is robust across languages. Louise's "self" becomes distributed across time. This is where the film departs from Hofstadter.
