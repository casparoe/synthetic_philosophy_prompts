  1.  **Analyze the User's Request:**
      *   **Context:** Upper-division epistemology course.
      *   **Topic:** Epistemic closure vs. Nozick's tracking theory (sensitivity).
      *   **Core Question:** What *kind* of disagreement is this? (Substantive, intuitive clash, methodological, verbal, etc.)
