      *   *Closure Defenders:* Knowledge *must* be closed under known entailment. Sacrificing closure leads to "abominable conjunctions" (Hawthorne) and makes deduction useless for extending knowledge. They often prefer Safety (Sosa, Pritchard) or Contextualism (DeRose, Lewis) to save closure.
      *   *The Stalemate:* Both sides have strong intuitions. Ordinary ascriptions suggest closure; skeptical pressure suggests we need to distinguish ordinary from skeptical contexts.

  3.  **Brainstorming the "Kind of Disagreement":**
      *   *Is it verbal?* Unlikely. Both care about the normative status of belief, justification, and truth. It's not just about the label "knowledge."
