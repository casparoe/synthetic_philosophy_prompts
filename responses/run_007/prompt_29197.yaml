answer: |-
  The short answer is that physics has established nothing regarding the unity of consciousness. While Schrödinger's personal metaphysics were indeed deeply Vedantic, the subsequent development of quantum mechanics has not provided empirical support for the idea that consciousness is a single, undivided substrate. In fact, technical developments in quantum foundations over the last fifty years have largely severed the conceptual link Schrödinger saw between the wave function and a universal mind.

  Here is the state of the evidence as it stands today, broken down by the relevant physical and philosophical developments.

  ### 1. The Schrödinger Equation and Consciousness
  It is important to clarify a category error that often arises in this discussion. The Schrödinger equation describes the time evolution of a quantum state (the wave function). It contains no variable for consciousness, observation, or subjectivity.

  Schrödinger's argument was not that the equation *proved* non-duality, but that the *epistemological implications* of quantum mechanics resonated with Vedanta. He noted that in quantum measurement, the distinction between the observer and the observed becomes blurred. He extrapolated from this blurring to the metaphysical conclusion that the plurality of minds is an illusion.

  However, modern physics treats the "observer" in the Schrödinger equation not as a conscious mind, but as a measuring apparatus or an environment. There is no mathematical requirement in the formalism for the observer to be conscious, let alone for all observers to share a single consciousness.

  ### 2. Decoherence and the Measurement Problem
  The most significant development since Schrödinger's death is the theory of **quantum decoherence**.

  *   **What it does:** Decoherence explains how quantum systems interact with their environment, causing superpositions to effectively vanish from the local perspective. It explains why macroscopic objects (like cats or brains) appear to have definite states rather than existing in superpositions.
  *   **Impact on the "Unity" Hypothesis:** Decoherence weakens the case for a special role for consciousness in physics. In the early days of quantum mechanics (the von Neumann–Wigner interpretation), some suggested that consciousness was required to "collapse" the wave function. Schrödinger leaned into this ambiguity. Decoherence shows that environmental interaction alone is sufficient to produce classical behavior without invoking a conscious observer.
  *   **The Measurement Problem:** While decoherence explains the *appearance* of collapse, it does not technically solve the measurement problem (why one specific outcome occurs). However, the leading solutions to this problem do not require a unified consciousness.
      *   **Many-Worlds (Everettian):** This interpretation suggests all outcomes occur in branching universes. While this implies a kind of universal wave function, it does not imply a unified *consciousness*. It implies a multiplicity of observer states, not a singularity.
      *   **Objective Collapse Theories:** These suggest physical mechanisms cause collapse, independent of minds.
      *   **QBism (Quantum Bayesianism):** This treats the wave function as a tool for an agent's expectations. It centers the agent but explicitly rejects the idea that the wave function describes an objective reality shared by a single mind.

  ### 3. The "Warm, Wet" Brain Argument
  A major physical objection to linking quantum mechanics with consciousness (let alone a unified quantum consciousness) is the issue of thermal noise.

  In 2000, physicist Max Tegmark published a seminal paper calculating the decoherence time of superpositions in the brain. He concluded that the brain is too "warm, wet, and noisy" to sustain quantum coherence over the timescales relevant to neural processing (milliseconds). Quantum states in the brain would decohere in roughly $10^{-13}$ seconds.

  *   **The Evidence:** This calculation suggests that the brain operates classically, not quantum mechanically. If the brain is a classical system, there is no physical mechanism via standard quantum mechanics to link individual brains into a single non-local field of consciousness.
  *   **Counter-arguments:** Physicists Roger Penrose and anesthesiologist Stuart Hameroff have argued (in the Orch-OR theory) that quantum coherence occurs inside microtubules within neurons, protected from decoherence. However, this remains a fringe hypothesis with no empirical verification. Furthermore, even if Orch-OR were true, it would explain the *mechanism* of individual consciousness, not the Vedantic claim that all consciousness is numerically one.

  ### 4. Current Consensus Among Physicists
  You asked if physicists today take this idea seriously *as physics*. The consensus is overwhelmingly negative.

  *   **Mainstream Physics:** The prevailing view is that consciousness is an emergent property of complex information processing (neuroscience/computational theory), not a fundamental field described by quantum mechanics. Prominent physicists like Sean Carroll, David Deutsch, and Steven Weinberg have explicitly rejected the idea that quantum mechanics provides evidence for spiritual or Vedantic metaphysics.
  *   **Philosophy of Mind:** The idea of a single substrate of consciousness has migrated almost entirely to the domain of philosophy, specifically under the banner of **Analytic Idealism** (championed by philosophers like Bernardo Kastrup). While Kastrup uses analogies from physics, he acknowledges that this is a metaphysical interpretation, not a physical derivation.
  *   **The "Hard Problem":** Physics has made no progress on the "Hard Problem" of consciousness (how objective matter gives rise to subjective experience). Because physics cannot yet explain how *one* brain produces consciousness, it certainly cannot establish that *all* brains share *one* consciousness.

  ### 5. Conclusion: Stronger or Weaker?
  To answer your specific question: Developments in quantum foundations have made the case for a single substrate of consciousness **weaker** from a physical standpoint.

  1.  **Decoherence** removed the necessity of a conscious observer for quantum transitions.
  2.  **Thermal calculations** suggest the brain is not a quantum-coherent system capable of non-local unity.
  3.  **Interpretations** like Many-Worlds or Bohmian Mechanics provide ontologies that do not require mental monism.

  Schrödinger's view remains a profound philosophical stance, and his intuition about the subject-object relationship was prescient regarding the limitations of classical objectivity. However, there is no empirical evidence in modern physics to support the claim that consciousness is a single, undivided reality. The Schrödinger equation governs probability amplitudes, not the unity of the self. Today, the proposition that "Atman is Brahman" is treated as a metaphysical axiom, not a physical theorem.
