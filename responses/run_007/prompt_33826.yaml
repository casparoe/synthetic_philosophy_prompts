answer: |-
  # Q&A Prep Sheet: Eternalist Endurantism & Adverbialism

  **Context:** Metaphysics Workshop (20 attendees).
  **Core Thesis:** Endurance is compatible with Eternalism via Adverbialism; Perdurantism's advantages are epistemic, not metaphysical.

  ---

  ### 1. The "Notational Variant" Objection (Stage Theorist)
  **Likelihood:** Certain | **Damage:** High
  **Question:** "You claim adverbialism is ontologically distinct from temporal parts. But if I say 'the stage at *t* is F' and you say 'the object is F-ly at *t*,' aren't you just renaming 'temporal part' to 'adverbial mode'? You've kept the formal structure of perdurantism but pretended to change the ontology. What work is 'wholly present' actually doing here?"

  **Reply (2 mins):**
  "It's a fair challenge, but the ontological commitment differs crucially. The stage theorist commits to a plurality of entities: the object is a class of stages, none of which are identical to the whole. I commit to one entity: the object itself. When I say 'F-ly at *t*,' I am modifying the *instantiation relation*, not the *subject* of instantiation.
  Think of it like spatial variation. You don't say the top-part of the ball is red and the bottom-part is blue to explain color variation; you say the ball is red *here* and blue *there*. The 'here' modifies the instantiation, it doesn't carve the ball into parts. I'm treating time analogously. The 'work' being done by 'wholly present' is ensuring that the subject of the property is the *entire* object, not a slice. This matters for identity: if I survive, *I* am there, not a counterpart or a stage. The notation looks similar because we agree on the logical form of temporal predication, but we disagree on what bears the property."

  **Candid Weakness:**
  It is notoriously difficult to explain the difference between a "temporal part" and a "time-indexed mode" without sounding like you are just stipulating a difference. If the truth conditions are identical, the ontological distinction can feel empty.

  ### 2. The Special Relativity Objection (Philosophers of Physics)
  **Likelihood:** High | **Damage:** Critical
  **Question:** "You're an eternalist endurantist. In Special Relativity, simultaneity is frame-relative. If an object is 'wholly present' at a time, which time? Which foliation of spacetime? If you say it's wholly present relative to a frame, you make existence frame-dependent. If you say it's wholly present at a spacetime point, you've basically admitted perdurantism."

  **Reply (2 mins):**
  "I accept that 'wholly present' must be relativized to a frame of reference, but I deny this makes *existence* frame-dependent in a problematic way. Existence is spacetime-relative; endurance is about *how* an object occupies spacetime.
  My view is that the object is wholly present at each point of its worldline, instantiating properties *at* that point. We don't need a global 'now' slice for the object to endure; we just need the object to be fully located at each point along its path, rather than having parts spread out. This avoids the need for a privileged simultaneity slice. The object doesn't extend *through* time by having parts; it extends by being fully present at each coordinate of its history. This is compatible with Minkowski spacetime so long as we treat 'location' as a relation between the object and spacetime points, not regions."

  **Candid Weakness:**
  This is the hardest technical hurdle. Many physicists and metaphysicians believe "wholly present" logically requires a spacelike hypersurface (a "now"). Denying this risks redefining "endurance" so much that it loses its intuitive appeal.

  ### 3. The "Intrinsic Nature" Objection (Lewis-style Perdurantists)
  **Likelihood:** High | **Damage:** High
  **Question:** "Lewis argued that adverbialism turns temporary intrinsics into extrinsics. If I am bent *at t*, then bent-ness is a relation to *t*. But shape is supposed to be intrinsic. You've solved the problem of temporary intrinsics by denying they are intrinsic. Isn't that a huge cost?"

  **Reply (2 mins):**
  "I reject the dichotomy that forces us to choose between 'intrinsic simpliciter' and 'extrinsic relation.' I argue that instantiation is fundamentally a triadic relation: Object, Property, Time.
  Being 'bent' isn't a relation to time in the sense that 'being a brother' is a relation to a sibling. Time is a parameter of the instantiation, not a relatum that changes the nature of the property. The property itself remains qualitative and non-relational. We only need to index the *having* of the property, not the property itself. This preserves the intuition that shape is about the object's own nature, while acknowledging that natures are manifested in time. We shouldn't let a pre-relativistic notion of 'intrinsic' dictate our ontology."

  **Candid Weakness:**
  Lewis's argument is very sticky. Many find it unintelligible how a property can be intrinsic if it can only be possessed relative to a time. This reply risks sounding like a verbal fix.

  ### 4. The "Account of Change" Objection (General Metaphysicians)
  **Likelihood:** Medium | **Damage:** Medium
  **Question:** "You've explained how an object can have incompatible properties without contradiction. But have you explained *change*? If I am bent-ly at t1 and straight-ly at t2, that's just a distribution of properties. Where is the *passage* or the *tension* that constitutes genuine change?"

  **Reply (2 mins):**
  "Change doesn't require a 'tension' or a metaphysical flow. Change is simply the instantiation of incompatible properties by the *numerically identical* subject at different times.
  Perdurantism actually struggles more here: on the worm view, the whole worm doesn't change shape; it just has a bent part and a straight part. Only the stage view allows change, but then the subject of change doesn't persist. My view secures the subject: *I* am the thing that is bent, and *I* am the thing that becomes straight. That is the robust sense of change we care about. The 'distribution' you mention is the history of the change, but the change itself is the fact that the same enduring substance takes on different modes."

  **Candid Weakness:**
  This relies on the audience accepting that "numerical identity + incompatible properties" is sufficient for change. Some may argue this is just "replacement" of properties, not genuine alteration.

  ### 5. The "Fission/Fusion" Objection (Perdurantists)
  **Likelihood:** Medium | **Damage:** Medium
  **Question:** "You say perdurantism gets a 'free ride' on intuitiveness. But what about fission cases? If a person splits into two, perdurantism handles the identity conditions cleanly. Endurantism seems forced to say identity is indeterminate or that one candidate is the original. Doesn't this show temporal parts are metaphysically necessary, not just epistemically convenient?"

  **Reply (2 mins):**
  "Fission cases are puzzles about *identity conditions*, not persistence *per se*. Perdurantism handles them by relaxing identity (cohabitation), but at the cost of saying 'I' am not the whole person, but a stage.
  Endurantism can handle fission by accepting that identity is not what matters in survival, or by adopting a conventionalist stance on boundary cases. The point of my paper is that we shouldn't adopt a radical ontology (temporal parts) for *all* objects just to solve edge cases like fission. We should solve the general case of persistence first. Perdurantists use fission to motivate temporal parts for ordinary objects (like chairs), which is the 'free ride' I'm contesting. We shouldn't let the tail wag the dog."

  **Candid Weakness:**
  Fission is a genuine strength of perdurantism. Dismissing it as an "edge case" might seem like dodging a bullet that actually hits the target.

  ### 6. The "Grounding" Objection (Metaphysicians)
  **Likelihood:** Medium | **Damage:** High
  **Question:** "What *grounds* the fact that you instantiate a property *t-ly*? If it's not grounded in a temporal part, what makes it the case that the instantiation holds at *t* and not *t*? If you say 'the object just does,' aren't you positing a brute fact?"

  **Reply (2 mins):**
  "I am willing to accept that instantiation-at-a-time is a fundamental fact. Not everything needs a further ground in terms of parts.
  Why is a sphere round? We don't say it has round parts; we say it's just round. Similarly, why does the object instantiate bent-ness at *t*? Because that is how the object is at *t*. The temporal dimension is a primitive feature of reality. Adding temporal parts doesn't actually *explain* this; it just pushes the question back to why the temporal part has the property. I'm saving us from an infinite regress of parts by stopping at the enduring substance."

  **Candid Weakness:**
  Appealing to brute facts is always a last resort. Perdurantists will argue their brute facts (temporal parts have properties simpliciter) are more intelligible than adverbial brute facts.

  ### 7. The "Epistemic/Metaphysical Distinction" Objection (Generalists)
  **Likelihood:** Low | **Damage:** Critical
  **Question:** "Your whole argument rests on separating how we reidentify objects (epistemic) from what persistence is (metaphysical). But isn't our concept of 'object' tied to how we track it? If we can't make sense of tracking an enduring object without implicitly using temporal parts, is your metaphysical view even coherent?"

  **Reply (2 mins):**
  "We must distinguish the *concept* of an object from the *criteria* for applying it. We track cars by their license plates, but a car isn't *made of* license plates. Similarly, we might track persistence through continuity of properties (which looks like parts), but that doesn't mean the ontology *is* parts.
  My claim is that the epistemic difficulty of tracking enduring objects through time doesn't prove they don't exist. It just proves time is hard to navigate. We shouldn't let our cognitive limitations dictate the fundamental structure of reality. The metaphysics should explain the possibility of the epistemology, not be reduced to it."

  **Candid Weakness:**
  This is the core methodological vulnerability. If the audience is Quinean or Neo-Carnapian, they may reject the idea that we can ontologically commit to things we cannot epistemically access or distinguish.

  ---

  ### The "Prayer Question"
  **The Question:** "If adverbialism is just the claim that instantiation is a triadic relation (Object, Property, Time), why do we need the object to be 'wholly present' at all? Why not just say the object is a spacetime worm, and the triadic relation holds between the worm, the property, and the time? What substantive work is 'Endurance' doing if the formalism is identical to Perdurantism?"

  **Why this is dangerous:** It exposes the risk that your view is a "perdurantism in disguise." If you can't pinpoint a truth-maker difference that isn't just verbal, the view lacks ontological parsimony or explanatory power.

  **Handling Strategy:**
  1.  **Don't Panic:** Acknowledge the formal similarity.
  2.  **Pivot to Identity:** "The formalism handles *predication*, but the ontology handles *identity*. If I am a worm, 'I' am a 4D entity. If I endure, 'I' am a 3D entity. This matters for moral responsibility and survival. If I am a worm, my death is just the end of my temporal extension. If I endure, my death is the cessation of *me*. The 'wholly present' clause preserves the intuition that *I* am the subject of my life, not just a segment of it."
  3.  **Concede Partial Ground:** "If you strip away the intuition of the 'subject of experience,' the views converge. But since we *are* subjects of experience, the distinction is substantive." (This appeals to the phenomenology of persistence).
