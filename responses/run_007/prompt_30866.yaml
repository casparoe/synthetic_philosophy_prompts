prompt: |-
  I'm supposed to lead a discussion section for a metaethics course on the Frege–Geach problem for expressivism. The students are advanced undergrads who've done a bit of philosophy of language (they know what compositionality is and they've seen truth-conditional semantics) but this is their first metaethics unit. I've got fifty minutes.

  Don't explain the problem to me — I get it. I need a teaching plan. What has to go first, what's the one example that carries the whole thing, and why that example rather than some other one? What misconceptions are they going to form (I'm guessing at least one is "oh so expressivism just can't handle logic, easy refutation then") and exactly where in the sequence should I head each one off? What do I deliberately leave out and say so? And give me one question I can ask near the end to check whether they've actually understood the problem rather than just memorized the moves.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a teaching plan for a 50-minute discussion section on the Frege-Geach (F-G) problem for expressivism.
      *   **Audience:** Advanced undergrads. Background: Philosophy of language (compositionality, truth-conditional semantics), but new to metaethics.
      *   **Constraint:** Do *not* explain the problem to the instructor (they know it). Focus on pedagogy: sequence, key example, misconceptions, omissions, and a comprehension check question.
      *   **Time:** 50 minutes.

  2.  **Determine the Goal:**
      *   The goal isn't just to state the problem (they can read that). The goal is to make them *feel* the tension between expressivism's core commitment (non-cognitivism) and the logical behavior of moral language. They need to see *why* it's a problem for *meaning*, not just a problem for "truth."

  3.  **Select the Key Example:**
      *   *Option A:* "Stealing is wrong. If stealing is wrong, then getting your little brother to steal is wrong. Therefore..." (Standard Geach).
      *   *Option B:* "Murder is wrong." vs. "Is murder wrong?" vs. "Don't murder."
      *   *Option C:* "Lying is wrong. If lying is wrong, then getting your little brother to lie is wrong."
      *   *Decision:* The standard conditional example (Option A/C) is best because it directly targets modus ponens, which relies on univocality. However, to make it stick for students who know truth-conditional semantics, I need to highlight the *embedding* context specifically. Let's stick with the classic "Stealing is wrong" + Modus Ponens structure, but ensure the focus is on the *meaning* of "wrong" in the antecedent vs. the assertion.
      *   *Why?* It's the cleanest logical form. It forces the issue of univocality. Other examples (questions, negations) are good, but the conditional is the hammer.

  4.  **Structure the 50 Minutes:**
      *   **0-5 min:** Warm-up/Recall. Establish the Expressivist stance clearly.
      *   **5-20 min:** The Setup & The Problem. Introduce the example. Walk through the logic.
      *   **20-35 min:** The "Easy Refutation" Misconception. Address the "just use a different logic" or "it's just about truth" objection. This is crucial for advanced undergrads who might think they can solve it easily.
      *   **35-45 min:** Solutions/Responses (Briefly). Quasi-realism/Blackburn/Gibbard. Don't solve it, just show the landscape.
      *   **45-50 min:** Comprehension Check & Wrap-up.

  5.  **Address Misconceptions:**
      *   *Misconception 1:* "Expressivism denies moral truth, so logic doesn't apply." (The "Easy Refutation" trap).
      *   *Correction:* Logic applies to *meaning* and *consistency*, not just truth. If "wrong" means different things in premise 1 and 2, it's equivocation.
      *   *Misconception 2:* "It's just about embedded contexts."
      *   *Correction:* It's about the *connection* between embedded and asserted contexts. The expressivist needs to explain how the attitude in the assertion relates to the content in the antecedent.

  6.  **Decide on Omissions:**
      *   *Omit:* Deep dive into specific solutions (e.g., Gibbard's norm-expressivism details, Blackburn's quasiaassertion). It's a discussion section, not a lecture on solutions.
      *   *Omit:* Historical exegesis (Frege vs. Geach vs. Searle). Focus on the argument.
      *   *Omit:* Complex logic notation beyond basic Modus Ponens. Keep it accessible.
      *   *Why:* Time. The goal is understanding the *problem*, not evaluating the *solutions*.

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Need to lock in the Expressivist definition. "Wrong" = "Boo!"
      *   *The Example:* Use "Stealing is wrong."
      *   *The Pivot:* Ask them to parse the conditional. What does "If stealing is wrong..." mean if "wrong" is just an attitude? You can't have an attitude inside an "if."
      *   *The Misconception:* Students will say "So expressivism is false." I need to stop them. "Why is this a *semantic* problem and not just a 'oops'?" Focus on *univocality*.
      *   *The Check Question:* Needs to test if they understand *why* univocality is hard for expressivists, not just *that* it is.

  8.  **Refining the "One Question":**
      *   Bad: "What is the Frege-Geach problem?" (Recall)
      *   Bad: "Is expressivism true?" (Opinion)
      *   Good: "If an expressivist says 'wrong' expresses an attitude in assertions, what *kind of thing* is it expressing in the antecedent of a conditional, and why can't it be the same thing?" (Forces them to articulate the univocality gap).

  9.  **Final Review against Constraints:**
      *   50 mins? Yes.
      *   Advanced undergrads? Yes (assume logic knowledge).
      *   No explaining the problem to me? Yes.
      *   Teaching plan format? Yes.

  10. **Polishing the Tone:** Keep it directive, practical, and focused on classroom dynamics. (Self-Correction: Make sure to emphasize *why* the example matters. The conditional is key because it strips the speech act.)

  11. **Final Polish:** Check the "Misconception" section. The big one is thinking logic requires truth. Expressivists want to save logic without truth. I need to make sure the plan highlights that tension. (Added specific note on "Logic without Truth").

  12. **Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a 50-minute teaching plan designed for advanced undergraduates. It prioritizes the *structural* tension of the argument over historical exegesis or evaluating specific solutions.

  ### **The Core Strategy**
  **The One Example:** The Modus Ponens Conditional.
  *   *P1:* Stealing is wrong.
  *   *P2:* If stealing is wrong, then getting your little brother to steal is wrong.
  *   *C:* Therefore, getting your little brother to steal is wrong.

  **Why this example?**
  It is the minimal logical unit required to force the issue of **univocality**. Unlike negation ("Stealing is not wrong") or questions ("Is stealing wrong?"), the conditional antecedent strips the moral term of its assertoric force *without* changing its syntactic role. It forces students to see that for the argument to be valid, "wrong" must mean the same thing in P1 and P2. If expressivism says "wrong" means "Boo!" in P1, what does it mean in P2? You cannot say "Boo!" inside an "If."

  ---

  ### **The 50-Minute Plan**

  #### **0:00–0:05 | Warm-up: Locking the Expressivist Commitment**
  Do not start with the problem. Start with the theory they are attacking.
  *   **Activity:** Write "Stealing is wrong" on the board. Ask a student to give the expressivist translation.
  *   **Target:** Get them to commit to: "This sentence does not describe a fact; it expresses a non-cognitive attitude (e.g., disapproval)."
  *   **Crucial Constraint:** Make them write it as a semantic claim, not a psychological one. It's not "When I say this, I feel boo." It is "The *meaning* of 'wrong' is to express boo."
  *   **Why:** If they treat expressivism as merely a claim about what happens in the speaker's head, the F-G problem dissolves into psychology. It must be about *meaning*.

  #### **0:05–0:20 | The Setup: The Logic Trap**
  Introduce the Modus Ponens example (above).
  *   **Step 1 (Validity):** Ask: "Is this argument valid?" (They will say yes. It's standard MP).
  *   **Step 2 (The Condition for Validity):** Ask: "What condition must be met for this argument to be valid?"
      *   *Prompt:* Guide them to **univocality**. The term "wrong" must have the same meaning in P1 and P2. If it's equivocal, the argument fails (fallacy of four terms).
  *   **Step 3 (The Conflict):** Ask: "What is the meaning of 'wrong' in P1 according to expressivism?" (Expressing an attitude).
  *   **Step 4 (The Squeeze):** Ask: "What is the meaning of 'wrong' in P2?"
      *   *The Trap:* If they say "Expressing an attitude," ask: "Are you expressing an attitude toward stealing *inside* the antecedent of a conditional? Are you actually disapproving of stealing right now while hypothesizing?" (No).
      *   *The Result:* If the meaning in P2 isn't the attitude, then "wrong" means two different things. The argument is invalid. Expressivism seems to make moral logic impossible.

  #### **0:20–0:35 | Heading Off the "Easy Refutation" Misconception**
  **The Misconception:** "So, expressivism just denies moral truth, and therefore logic doesn't apply. Problem solved by changing the logic."
  **Why they form it:** They know truth-conditional semantics. They assume logic *requires* truth conditions. They think the expressivist can just say, "We don't play the truth game."

  **Where to head it off:** Immediately after Step 4 above.
  *   **Intervention:** "Some of you are thinking: 'Expressivists don't believe in moral truth, so why do they care about validity?' Why is that not a viable escape route?"
  *   **Discussion Point:** Logic is about *consistency of commitment*, not just truth preservation.
      *   *Analogy:* If I say "I dislike stealing" and "If I dislike stealing, I dislike getting my brother to steal," but then I say "I don't dislike getting my brother to steal," I am being inconsistent.
      *   *The Hard Part:* The expressivist needs to explain *why* it is inconsistent without appealing to truth conditions. If "wrong" just means "Boo!", why is "Boo! + If Boo! then Boo! + Not Boo!" a contradiction?
      *   **Goal:** Make them see that the problem isn't that expressivism lacks *truth*, it's that it lacks **compositionality**. They need to explain how the complex sentence (the conditional) is built from the parts if the parts are speech acts.

  #### **0:35–0:45 | The Landscape of Responses (Brief)**
  Do not teach the solutions. Teach the *cost* of the solutions.
  *   **Option A (Bite the Bullet):** Moral arguments aren't logically valid in the standard sense; they are valid in a special "moral logic." (Cost: Isolates moral discourse from general reasoning).
  *   **Option B (Quasi-Realism/Blackburn):** We *simulate* truth conditions. We talk *as if* there are moral facts to preserve logic. (Cost: Is this just pretending? Does it solve the semantic problem or just hide it?)
  *   **Option C (Hybrid Views):** Moral sentences have *both* descriptive and expressive content. (Cost: Abandons pure expressivism).
  *   **Instruction:** Spend 2 minutes on each. The point is to show that the F-G problem isn't a "gotcha" that kills the theory instantly, but a tax the theory must pay.

  #### **0:45–0:50 | The Comprehension Check & Wrap**
  **The Question:**
  > "Imagine an expressivist claims that in the sentence 'If stealing is wrong,' the word 'wrong' still expresses an attitude, but it's a *hypothetical* attitude rather than an *actual* one. Why does this fail to solve the Frege-Geach problem regarding **univocality**?"

  **What to listen for:**
  *   **Bad Answer:** "Because hypothetical attitudes aren't real." (Misses the point).
  *   **Good Answer:** "Because then 'wrong' means 'Actual Disapproval' in P1 and 'Hypothetical Disapproval' in P2. That is equivocation. The argument becomes invalid because the term shifted meaning."
  *   **Why this works:** It tests if they understand that the problem is about the *sameness of meaning* required for logical validity, not just about whether attitudes can be hypothetical.

  ---

  ### **What to Deliberately Leave Out (And Say So)**
  1.  **Negation and Questions:** Do not spend time on "Is stealing wrong?" or "Stealing is not wrong."
      *   *Say So:* "We are focusing only on the conditional. If you understand why the conditional breaks univocality, you can apply that to negation on your own. The conditional is the hardest case for the expressivist."
  2.  **Gibbard vs. Blackburn Details:** Do not distinguish between norm-expressivism and quasi-realism in depth.
      *   *Say So:* "There are sophisticated versions of expressivism (like Gibbard's) that try to solve this. We are treating 'Expressivism' as a monolith today to see the pressure point. Don't assume Blackburn would agree with everything we said."
  3.  **The "Truth-Aptness" Debate:** Do not get bogged down in minimalism about truth.
      *   *Say So:* "Expressivists can accept that moral sentences are truth-apt in a minimalist sense. The F-G problem survives even if they do, because the problem is about the *content* of the attitude, not the grammatical ability to say 'It is true that...'"

  ### **Board Plan Visual**
  Keep the board divided into three columns to track the equivocation visually.

  | **Standard Realist** | **Expressivist (P1)** | **Expressivist (P2)** |
  | :--- | :--- | :--- |
  | "Wrong" = Property W | "Wrong" = Attitude A | "Wrong" = ??? |
  | P1: Has Property W | P1: Expresses Attitude A | P2: Expresses Attitude A? |
  | P2: If Has Property W... | | (Can't express attitude in 'If') |
  | **Valid (Univocal)** | **Invalid (Equivocal?)** | |

  This visual reinforces the univocality constraint immediately.
