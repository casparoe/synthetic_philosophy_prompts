      *   Did I reconstruct the implicit theory? Yes (Use-Novelty/IBE hybrid).
      *   Did I distinguish presupposition vs. fit? Yes.
      *   Did I discuss strict Bayesian changes? Yes.
      *   Did I address underdetermination? Yes.

  *(Self-Correction during drafting)*: I should explicitly mention the "Use-New" distinction (Worrall) as it directly addresses the "constructed to fit" vs. "predicts" tension regarding old data. This is the bridge between the Bayesian worry and the scientific practice.

  7.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a profound question that cuts to the heart of the philosophy of science. You have identified the classic **Problem of Old Evidence**, but you have sharpened it by highlighting a specific tension in scientific practice: the simultaneous valuation of explaining old anomalies and the suspicion of post-hoc accommodation.

  The short answer is that scientific practice does not presuppose strict, naive Bayesianism. Instead, it presupposes a **hybrid account of confirmation** that blends probabilistic reasoning with **Inference to the Best Explanation (IBE)** and a specific constraint known as **Use-Novelty**. The practice is not incoherent, but it relies on distinctions that standard Bayesianism often ignores.

  Here is a reconstruction of the implicit theory, an analysis of its coherence, and an examination of the underdetermination you suspect.

  ---

  ### 1. Reconstructing the Implicit Theory of Confirmation

  Scientific practice operates on a theory of confirmation that is **contrastive** and **structural**, rather than purely probabilistic. We can reconstruct the implicit norms as follows:

  **A. Confirmation is Contrastive (Theory vs. Predecessor)**
  Scientists do not evaluate a hypothesis $H$ in isolation against evidence $E$. They evaluate $H$ against a rival $H_{old}$.
  *   **Old Evidence Rule:** If $E$ was known, but $H_{old}$ could not explain $E$ (or required ad-hoc patches to do so), and $H_{new}$ explains $E$ naturally, $H_{new}$ is confirmed *relative to* $H_{old}$.
  *   **Implication:** The confirmation comes not from raising the probability of $E$ (which is already 1), but from increasing the *likelihood ratio* $P(E|H_{new}) / P(E|H_{old})$. Since $P(E|H_{old})$ is low (due to the anomaly) and $P(E|H_{new})$ is high, the support is strong.

  **B. The Use-Novelty Constraint (The "Post-Hoc" Filter)**
  This resolves the tension between "old evidence counts" and "post-hoc is suspicious."
  *   **Definition:** Evidence $E$ confirms $H$ only if $E$ was not **used** in the construction of $H$.
  *   **Application:** If a theorist looks at a specific anomaly (e.g., the perihelion of Mercury) and tweaks their equations *specifically* to fit that number, the evidence is "used." It provides little confirmation (overfitting).
  *   **Application:** If a theorist derives $H$ from fundamental principles (e.g., general covariance) without looking at the Mercury data, and $H$ *then* entails the Mercury data, the evidence is "use-novel" even if it is "temporally old."
  *   **Practice:** Scientists praise the latter (Einstein) and suspect the former (curve-fitting).

  **C. Explanatory Coherence over Probabilistic Lift**
  The practice presupposes that evidence supports a theory by making the world **intelligible**, not just statistically likely.
  *   **Unification:** A theory gets "enormous credit" for old evidence if it unifies that evidence with disparate phenomena (e.g., Newton unifying terrestrial gravity and planetary orbits).
  *   **Anomaly Resolution:** Resolving a "long-standing anomaly" is weighted heavier than fitting routine data because anomalies represent a failure of the background knowledge system. Fixing them restores coherence.

  **Summary of the Implicit Theory:**
  > *Evidence $E$ supports Hypothesis $H$ if $H$ entails $E$ without having been constructed specifically to entail $E$, and if $H$ provides a more coherent/unified explanation of $E$ than the available rivals.*

  ---

  ### 2. Presupposition vs. Fit: What is Essential?

  To determine if the practice is incoherent, we must distinguish what is logically required by the practice versus what is merely correlated.

  **What the Practice Strictly Presupposes:**
  1.  **Logical Independence:** There must be a distinction between *deriving* evidence from principles and *fitting* parameters to data. Without this, the suspicion of post-hoc accommodation is irrational.
  2.  **Comparative Evaluation:** Confirmation is inherently comparative. You cannot confirm a theory against old evidence unless there was a prior state of ignorance or anomaly to compare it against.
  3.  **Risk:** The theory must have been "risky." It must have been possible for the theory to be true and the evidence false (logically), even if the evidence is empirically certain.

  **What Merely "Fits Well" (Contingent Correlations):**
  1.  **Temporal Novelty:** Scientists often use "new prediction" as a proxy for "use-novelty." This fits well because it is hard to prove whether a theorist looked at old data during construction. Temporal novelty is an *heuristic* for use-novelty, not a logical requirement. (This is why explaining old anomalies is sometimes *more* impressive than new predictions: it proves the theory didn't need the new data to be built).
  2.  **Certainty of Evidence:** Practice treats old evidence as "certain." Strictly, all evidence is fallible. The practice presupposes certainty for pragmatic reasons, not epistemic ones.

  **Is the Practice Incoherent?**
  No. The tension you feel arises from applying a **temporal** distinction (old vs. new) to a problem that is actually **logical** (used vs. unused).
  *   When scientists say "post-hoc is suspicious," they mean "constructed to fit."
  *   When they say "explaining old anomalies is great," they mean "derived from independent principles."
  *   These are compatible. The incoherence vanishes once you switch from a temporal metric to a **constructional metric**.

  ---

  ### 3. If Scientists Adopted a Strict Bayesian View

  If the community adopted the "standard probabilistic account" you described (where $P(E)=1 \rightarrow$ no confirmation), scientific discourse would have to change radically.

  **A. Changes in Description**
  *   **Ban on "Explaining" Old Data:** Scientists could not claim a theory is *confirmed* by Mercury's perihelion. They would have to say, "The theory is consistent with Mercury," or "The theory has high prior probability, and Mercury does not falsify it."
  *   **Shift to "Logical Discovery":** To salvage Bayesianism, they would have to adopt Richard Garber's solution: The evidence is not $E$ (Mercury's orbit), but $L$ (the fact that $H$ entails $E$). They would have to say, "I am updating my belief in $H$ based on the new logical insight that $H \rightarrow E$," rather than "I am updating based on $E$."
  *   **Prior Probability Focus:** Since likelihoods $P(E|H)$ become irrelevant for old $E$, all weight shifts to Priors $P(H)$. Discourse would shift to debating the "intrinsic plausibility" or "simplicity" of theories rather than their empirical fit.

  **B. Practical Consequences**
  *   **Loss of Heuristics:** The "old anomaly" heuristic would be abandoned. This might make it harder to distinguish deep theories from ad-hoc ones, as Bayesianism struggles to penalize complexity without explicit priors on model structure.
  *   **Undervaluing Unification:** A strict Bayesian view focuses on specific $E-H$ pairs. It struggles to account for the "systematic power" scientists value (one theory explaining *many* old things).

  ---

  ### 4. Underdetermination: Which Theory is Right?

  You asked if the practice is underdetermined. **Yes, it is.** Multiple philosophical frameworks can license current scientific practice.

  **Candidate 1: Inference to the Best Explanation (IBE)**
  *   **Account:** We accept the hypothesis that *best explains* the evidence.
  *   **Fit:** Perfectly handles old evidence. Explanation is a logical relation, not a temporal one. An old fact can be newly explained.
  *   **Weakness:** "Best" is vague. Is it simplicity? Scope? Mechanism?

  **Candidate 2: Modified Bayesianism (Garber/Christensen)**
  *   **Account:** We conditionalize on the *logical relation* ($H \vdash E$), not $E$ itself.
  *   **Fit:** Mathematically rigorous. Preserves the Bayesian framework while allowing old evidence to update probabilities.
  *   **Weakness:** Computationally unrealistic for scientists. Requires assigning probabilities to logical truths.

  **Candidate 3: Methodology of Scientific Research Programmes (Lakatos)**
  *   **Account:** Theories are part of "programmes." A programme is progressive if it predicts *novel* facts; it is degenerating if it only accommodates old facts via ad-hoc adjustments.
  *   **Fit:** Captures the "suspicion of post-hoc" perfectly. Distinguishes between "theoretical progress" (explaining anomalies) and "empirical progress" (predicting new data).
  *   **Weakness:** Historically retrospective. Hard to apply in real-time.

  **What Would Settle It?**
  Since these frameworks are philosophically distinct but pragmatically similar, empirical or pragmatic criteria must settle the choice:

  1.  **Cognitive Science of Science:** Do scientists actually reason by updating probabilities (Bayes) or by comparing explanatory narratives (IBE)? Studies suggest the latter. If human cognition is inherently explanatory, IBE is the "true" description of the practice, and Bayesianism is merely a normative idealization.
  2.  **Track Record of Theory Choice:** Which framework better identifies *successful* theories? If we look at history, does the theory that "explained old anomalies best" (IBE) win more often than the theory that "made the riskiest novel prediction" (Strict Popper/Bayes)?
      *   *Example:* General Relativity won on both (Mercury + Eclipse).
      *   *Example:* Plate Tectonics won largely on explaining old anomalies (fit of continents, fossil distribution) before it made many novel predictions.
      *   *Verdict:* The success of Plate Tectonics suggests that **Explanatory Coherence (IBE/Use-Novelty)** is a more accurate description of what actually drives acceptance than strict Novel Prediction.

  ### Conclusion

  The tension you perceive is real but resolvable. Scientific practice presupposes a **Use-Novelty** account of confirmation grounded in **Explanatory Coherence**, not a strict temporal Bayesian account.

  *   **It is not incoherent:** It distinguishes between *fitting* data (suspicious) and *deriving* data from independent principles (praiseworthy), regardless of when the data was found.
  *   **Strict Bayesianism would break it:** It would force scientists to ignore the confirmatory value of resolving anomalies, unless they redefined "evidence" to mean "logical insight."
  *   **Underdetermination:** Both IBE and Modified Bayesianism license the practice. However, the historical success of theories that prioritized unifying old anomalies (like Plate Tectonics) suggests that **Explanatory Power** is the primary engine of confirmation in practice, with probability serving as a secondary check on consistency.

  Scientists are not failed Bayesians; they are intuitive Inference-to-the-Best-Explainers who use temporal novelty as a rough proxy for logical independence.
