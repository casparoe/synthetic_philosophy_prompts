prompt: |-
  I have been trying to understand how working scientists actually evaluate theories, and I keep running into a tension I cannot resolve. On the one hand, the standard probabilistic account of confirmation — the Bayesian picture, roughly — says that a piece of evidence supports a hypothesis only if the hypothesis makes that evidence more likely than it would otherwise have been. But evidence that is already known, and known with certainty, cannot have its probability raised by anything: it is already as likely as it can be. On that picture, a theory gets no confirmatory credit at all from observations that were collected and accepted before the theory was even formulated. On the other hand, scientists in many fields routinely give a theory enormous credit for exactly this. A new theory is praised for explaining a long-standing anomaly in measurements that everyone had in hand for years; reviewers, textbooks, and funding panels treat the fact that the theory makes sense of previously puzzling data as a major point in its favor, sometimes more impressive than a novel prediction. The same fields, meanwhile, often treat post hoc explanation as suspicious and insist that hypotheses be tested against data they were not constructed to fit. So the practice seems to say both that already-known evidence confirms a theory and that accommodating old data is second-rate.

  What theory of confirmation, or of evidence, does this scientific practice presuppose? Is the practice incoherent, or does it presuppose a non-standard account of what it is for evidence to support a theory? Reconstruct the implicit theory as precisely as you can, distinguish what the practice strictly presupposes from what it merely fits well with, and say what would have to change in how scientists and reviewers describe evidence if they adopted a strictly Bayesian view instead. I am especially interested in whether the practice is underdetermined: whether several different theories of confirmation could license it, and what would settle which one is right.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Problem:** The tension between the Bayesian "Problem of Old Evidence" (old evidence can't confirm because $P(E) = 1$) and actual scientific practice (theories are praised for explaining old anomalies, yet post-hoc fitting is sometimes viewed suspiciously).
      *   **Key Questions:**
          1.  What theory of confirmation/evidence does this practice presuppose?
          2.  Is the practice incoherent, or does it rely on a non-standard account?
          3.  Reconstruct the implicit theory precisely.
          4.  Distinguish what is *presupposed* vs. what merely *fits well*.
          5.  What would change if scientists adopted a *strict* Bayesian view?
          6.  Is the practice underdetermined (could multiple theories license it)? What would settle which is right?

  2.  **Initial Analysis & Philosophical Context:**

      *   *The Problem of Old Evidence:* This is a classic issue in philosophy of science (Glymour, Earman, etc.). Standard Bayesianism says $P(H|E) = P(H)$ if $P(E)=1$. So $E$ doesn't confirm $H$.
      *   *Scientific Practice:* Scientists *do* value explanatory power regarding old data (e.g., General Relativity explaining Mercury's perihelion). But they also value novel predictions (e.g., Eddington's eclipse). There's a nuance: explaining an *anomaly* vs. merely fitting *routine* data.
      *   *The Tension:* The user notes a seeming contradiction: "Old data counts" vs. "Post-hoc accommodation is suspicious."
      *   *Goal:* I need to articulate a framework that resolves this tension without dismissing scientific practice as irrational or forcing a strict Bayesianism that contradicts practice.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Identify it as the "Problem of Old Evidence" but note the added layer of the "Novelty vs. Accommodation" debate. State the thesis: The practice is not incoherent but presupposes a *hybrid* or *pluralistic* account of confirmation, likely leaning towards *Inference to the Best Explanation (IBE)* or a *modified Bayesianism* that accounts for *logical* rather than *temporal* novelty.

      *   **Section 1: Diagnosing the Tension (Bayesianism vs. Practice):**
          *   Explain the strict Bayesian constraint ($P(E)=1 \rightarrow$ no confirmation).
          *   Explain the scientific reality (Mercury's perihelion, Balmer series).
          *   Highlight the "Post-hoc suspicion" (ad hocery, overfitting).
          *   *Crucial Distinction:* It's not about *when* the data was found, but whether the theory was *constructed to fit* that specific data point vs. deriving it from independent principles.

      *   **Section 2: Reconstructing the Implicit Theory:**
          *   It's not strict Bayesianism. It's closer to **Explanatory Coherence** or **IBE**.
          *   *Key Concept:* **Systematic Power / Unification.** A theory gets credit for old evidence if it *unifies* that evidence with other things, or resolves a *anomaly* without ad hoc adjustments.
          *   *Key Concept:* **Use-Novelty.** The evidence confirms if the theory didn't *use* that evidence in its construction. (Zahar, Worrall).
          *   *Reconstruction:* Confirmation $\approx$ (Explanatory Scope + Coherence + Riskiness) - (Ad Hoc Adjustments).
          *   *Presupposition:* Evidence supports theory if the theory makes the evidence *intelligible* within a broader framework, not just probabilistically likely.

      *   **Section 3: Presupposed vs. Fits Well:**
          *   *Presupposed:* Theories must be risky (could have been wrong). Explanations must be non-ad-hoc.
          *   *Fits Well:* The temporal distinction (new vs. old) is often a proxy for "use-novelty." It fits well but isn't the core logical requirement.
          *   *Incoherence?* No, provided we distinguish between *accommodation* (fitting) and *explanation* (deriving from independent principles).

      *   **Section 4: What if they adopted Strict Bayesianism?**
          *   They would have to stop praising theories for explaining old anomalies (unless they treat the old evidence as uncertain, which is weird).
          *   They would have to focus exclusively on *novel predictions* for confirmation.
          *   Language change: "Explains" $\rightarrow$ "Is consistent with." "Confirmed by" $\rightarrow$ "Has high posterior given."
          *   They would need to model the *discovery* of the logical connection as the evidence, not the data itself (Garber's solution).

      *   **Section 5: Underdetermination & Settling the Matter:**
          *   *Underdetermination:* Yes. IBE, Falsificationism (Lakatos), and Modified Bayesianism (Garber/Christensen) can all account for the practice.
          *   *IBE:* Values explanatory power.
          *   *Lakatos:* Research programmes protecting a hard core vs. ad hoc auxiliary hypotheses.
          *   *Modified Bayesian:* Conditionalizing on the *logical relation* ($H \vdash E$) rather than $E$ itself.
          *   *Settling it:* Empirical study of scientific reasoning (cognitive science) or pragmatic success (which framework leads to better theory choice?). Likely pragmatic.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful not to say Bayesianism *can't* solve old evidence. It can (Garber, Jeffrey). But the *strict* simple version cannot. The user asks about the "standard probabilistic account." I should acknowledge the sophisticated Bayesian responses but maintain the distinction the user drew.
      *   *Nuance on "Post-hoc":* Why is post-hoc suspicious? Because of *overfitting* or *parameter tuning*. If I tweak 10 parameters to fit 10 old data points, that's bad. If I derive 10 old data points from 1 principle, that's good. The practice distinguishes these. Strict Bayesianism struggles with the "tweaking" aspect without priors on complexity.
      *   *The "Anomaly" Factor:* The user mentions "long-standing anomaly." This is key. Old *routine* data might not confirm much. Old *anomalous* data confirms a lot if resolved. This suggests a *contrastive* account of confirmation (why this theory vs. the old one that failed).

  5.  **Final Polish:**

      *   Ensure the tone is analytical and philosophical but accessible.
      *   Make sure to answer the specific prompt requirements (Reconstruct, Distinguish, Changes, Underdetermination).
      *   Structure with clear headings.

  6.  **Final Review against constraints:**
