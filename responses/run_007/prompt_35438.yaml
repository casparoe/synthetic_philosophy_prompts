prompt: |-
  A couple friends of mine got into it at a bar last weekend and I've been turning it over in my head since. The thing that set it off was that Lena's roommate had given her this whole speech about how she needs to be more considerate about noise late at night—which, fair, Lena does stay up late. But the roommate is constantly having people over till 2 a.m. on weeknights, and Lena pointed this out. The roommate said "that doesn't make what I'm saying wrong." And Lena said no, but it does mean you don't get to be the one saying it.

  So Lena's telling this story and my friend Devin jumps in and says the roommate is being a hypocrite and therefore her criticism has no force. My other friend Amir says that's completely irrational—either the noise is a problem or it isn't, and the roommate's own behavior has zero bearing on whether Lena should be more considerate. Devin says that's only true if criticism is just about stating facts, but it's not: it's about holding someone accountable, and you can't hold someone to a norm you flout yourself. Amir says okay, but then it's not the criticism that's wrong, it's just the roommate being annoying, and Lena is still on the hook for being noisy. Devin says no, the hypocrite's blame is defective as blame—it doesn't just make the blamer irritating, it actually fails as an instance of blame. Amir says that's mysterian: what exactly is supposed to be missing? The propositional content is true, the roommate believes it, she's sincere. What other ingredient is there? Devin says the ingredient is that the blamer has to be implicated in the norm she's invoking—she has to be in a position to say "we don't do that," which she isn't if she does it herself. Amir says that just moves the bump: what does "we" do here? If the norm is "people shouldn't be noisy late at night," the roommate believes it and can state it. Devin says the norm that's actually being invoked is "you shouldn't be noisy while I get to be noisy," which is inconsistent and that's the real problem. Amir says that's a different norm entirely, and no one is claiming that one—the roommate is claiming the universal norm, and the fact that she violates it makes her a bad person, not a bad arguer. They went back and forth for a while and I honestly couldn't tell who was winning.

  Can you walk through this exchange and say where each person is right and where they go wrong? And at the end, tell me how confident you are about each of the main points you make, and pick out the one thing you're least sure about in your own analysis.
