answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Chair, Finance and Capital Projects Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Federal Research Center Bid

  **Recommendation**
  After reviewing the financial exposure and strategic risks associated with the fourth round of bidding for the Federal Research Center, the Finance and Capital Projects Subcommittee recommends that the University **decline the fourth round of commitments and formally withdraw from the selection process.**

  We propose the Board authorize the Administration to notify the funding agency of our withdrawal prior to the deadline next Tuesday. This decision allows us to cap our financial exposure at the current $4.3 million and redirect institutional focus toward opportunities with a positive return on investment.

  **Financial Context**
  The current status of the bid is as follows:
  *   **Committed Expenditures (Sunk):** $4.3 million.
  *   **Requested Additional Commitment:** $1.8 million.
  *   **Total Project Cost (if won):** $6.1 million.
  *   **Estimated Net Value of Center:** $5.0 million.

  **The Case for Continuing**
  The Administration argues that withdrawing now renders the initial $4.3 million expenditure a total loss. Their position is that approving the additional $1.8 million keeps the University in contention for a $5.0 million asset. From a narrow, forward-looking perspective, spending $1.8 million to potentially secure $5.0 million in value appears rational, provided the probability of winning exceeds roughly 36 percent. The Administration contends that our peer competitor faces the same arithmetic and may also withdraw, potentially increasing our odds of success if we remain.

  **The Case for Withdrawal**
  The Subcommittee acknowledges the strength of the Administration's marginal analysis. However, fiduciary duty requires us to evaluate the *total* viability of the project, not merely the next transaction.

  1.  **Aggregate Stewardship:** Even if we win the bid, the University will have spent $6.1 million to acquire an asset valued at $5.0 million. While continuing the bid might reduce the *magnitude* of our loss compared to withdrawing, it guarantees the project remains net-negative. Approving a capital project where total costs demonstrably exceed total value sets a difficult precedent for future governance and external audits.
  2.  **Uncertainty of Outcome:** The Administration's case relies on a probability of winning that cannot be guaranteed. If we commit the additional $1.8 million and lose, our total loss increases to $6.1 million. We are being asked to risk *more* capital to mitigate a past loss, without a certainty of recovery.
  3.  **Auction Dynamics:** The selection process has evolved into a competitive bidding war where both finalists are making non-recoverable investments without a guarantee of return. This structure incentivizes escalation beyond the asset's intrinsic value. By withdrawing, we signal that the University will not participate in processes that demand expenditures exceeding the prudent value of the prize.

  **Conclusion**
  Stopping now is painful; it requires accepting a $4.3 million loss without the reputational gain of hosting the center. However, authorizing the fourth round risks deepening that loss and validating a decision-making pattern where past expenditures dictate future risks.

  The Subcommittee moves that the Board direct the President and Provost to withdraw from the competition immediately. We further recommend the Administration conduct a post-mortem on the bidding process to establish stricter caps on pre-award spending for future capital projects.

  **Action Required**
  Please vote to **approve the withdrawal** from the Federal Research Center selection process.
