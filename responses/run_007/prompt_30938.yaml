  A guy at a meetup gave me what he claimed was a steelman of Dennett's intentional stance as applied to chatbots, and I've been turning it over ever since. He said, roughly: "Dennett's view is that when a system is too complicated to predict from its parts, you adopt the intentional stance — you treat it as a rational agent with beliefs and desires. This isn't a claim about what's going on inside; it's just a useful fiction, like treating a chess engine as wanting to capture your queen. So for Dennett, the question 'does the chatbot literally have beliefs?' is the wrong question to ask. The stance works, and in the only sense that matters, it does have beliefs and desires. By the same reasoning, a thermostat literally wants the room warm."

  This feels maybe 80% right, but the thermostat move and the word 'literally' are setting off alarms and I cant articulate why. I'd like an accuracy audit: go claim by claim and tell me what Dennett would actually endorse, what he'd wince at, and wether the jump from "the stance works" to "it literally has beliefs, same as a thermostat" follows from anything Dennett holds. If I want to push back next meetup, what's the sharpest version of the disagreement?
