      *   *Challenge to Dennett:* The *affective weight* of the novel suggests a victim. If the self is just a fiction, who is the victim of the fiction? The phenomenology of regret implies a continuous subject that *could have been otherwise*. Dennett's view might be too cool/clinical to capture the *cost* of the narrative.
