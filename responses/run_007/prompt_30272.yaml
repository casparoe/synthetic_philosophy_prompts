      *   **Key Constraints:**
          *   Do not soften Newton into a deist or proto-modern scientist.
          *   Do not recruit him for present-day science/religion arguments.
          *   Make the audience feel *why* the manuscripts matter.
          *   Remain honest about the limits of inferring character from ideas.
          *   **Structural Core:** The distinction between God as *first cause* (clockmaker) vs. God as *continuing ruler* (active Lord) must drive the structure, assertions, qualifications, and turns of the speech.
          *   No fabricated verbatim quotations (paraphrase only).

  2.  **Determine the Structure based on the Core Distinction:**
      *   *Introduction:* Acknowledge the setting, the audience, and the common image of Newton (the clockwork universe). Introduce the tension between the public physicist and the private theologian.
      *   *Section 1 (God as First Cause):* Address the familiar Newton—the mechanist. Acknowledge the specialists' caution (don't overstate the link). This is the "safe" Newton.
      *   *Section 2 (The Turn/The Manuscripts):* Introduce the theological manuscripts. The shock value (Arianism/anti-Trinitarianism). Why did he write them? Not just hobbyism.
      *   *Section 3 (God as Continuing Ruler):* The core theological insight. Space and time as sensors of God. Gravity as active will. This connects the theology to the physics without claiming simple causality.
      *   *Section 4 (The Human Element/Limits):* Acknowledge the novelist's role vs. the historian's role. We can't know his heart, only his words. The danger of making him too coherent.
      *   *Conclusion:* The value of the exhibition. Not to solve the mystery, but to hold the tension.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Welcome everyone. Acknowledge the novelist background (6 years ago). Set the scene: the quiet of the library vs. the noise of history.
      *   *The Familiar Image:* Everyone knows the *Principia*. The clockwork universe. God as the artisan who winds it up. This is the "First Cause" God. It's comfortable. It fits the modern view.
      *   *The Discomfort:* But these manuscripts exist. Millions of words. Prophecy, alchemy, church history. He hid this. Why? Because Trinity denial was dangerous (loss of chair).
      *   *The Structural Pivot (First Cause vs. Continuing Ruler):* Here is where the distinction comes in. If God is just the First Cause, theology is separate from physics. But Newton didn't think that. He thought space was God's sensorium. He thought gravity needed active maintenance.
      *   *Addressing the Specialists:* I know some of you think I (and others) overstate the link. I must qualify: I am not saying theology *caused* the math. I am saying the *disposition* was shared. The desire for absolute dominion.
      *   *Addressing the Clergy/Donors:* He was not orthodox. He rejected the Trinity. We cannot sanitize this. But we can understand it as devotion, not heresy in his mind.
      *   *Addressing the Public:* Why care? Because it shows a mind seeking unity not just in equations but in existence.
      *   *The Limits:* I am a novelist. I make characters coherent. History is messier. We cannot know if he prayed over these drafts or just analyzed them. We must resist making him a hero for either side (science vs. religion).
      *   *Closing:* The manuscripts are not answers. They are a record of struggle. The exhibition invites us to stand where he stood.

  4.  **Refining the Tone and Constraints:**
      *   *Check:* Did I make him a deist? No, emphasize the *active* God.
      *   *Check:* Did I recruit him for modern arguments? No, emphasize the historical distance.
      *   *Check:* Is the First Cause/Continuing Ruler distinction structural? Yes, use it to move from the "public" Newton to the "private" Newton.
