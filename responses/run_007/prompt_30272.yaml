answer: |-
  Distinguished colleagues, members of the clergy, donors, students, and friends of the library:

  It is a humbling thing to stand before the physical remnants of a mind that changed how we understand the universe. Six years ago, I attempted to imagine my way into that mind through the medium of fiction. I wrote a novel about Isaac Newton's later years, trying to navigate the strange dual citizenship he held in the realms of matter and spirit. Today, standing before the actual manuscripts—the ink, the corrections, the private confessions rather than my invented scenes—I am reminded of the distance between a story told for coherence and a life lived in complexity.

  We all know the Newton of popular memory. He is the man who saw the apple fall and understood the moon's descent. He is the architect of the clockwork universe. In this familiar portrait, God is the divine watchmaker. He designs the mechanism, winds the spring, sets the hands in motion, and then steps back to let the laws of nature do the work. This is God as *First Cause*. It is a comforting theology for the modern age because it creates a clean boundary. On one side, there is physics, which deals with what moves; on the other, theology, which deals with why it was made. They do not interfere with one another.

  If Newton were merely a proponent of this view, these manuscripts behind me would be curiosities. They would be the hobbyism of a genius who needed a distraction from the rigors of calculus. We could file them away as private eccentricities, safe and separate from the *Principia*.

  But they are not separate. And Newton was not a deist.

  To understand why these papers matter, we have to dismantle that clockwork image. We have to move from God as the First Cause to God as the *Continuing Ruler*. This distinction is not merely theological hair-splitting; it is the key to unlocking why a man who could calculate the orbits of comets would spend decades decoding the prophecies of Daniel and rewriting the history of the early Church.

  For Newton, space was not an empty container. Time was not merely a measurement of duration. They were, in his view, the sensors of a living God. He wrote that space is God's sensorium—a place where God perceives and acts. If God is only the First Cause, gravity is a law that runs on its own. But Newton was deeply uneasy with the idea of action at a distance. He could describe gravity mathematically, but he could not explain how it worked mechanically. For many of his contemporaries, that was a problem to be solved by better physics. For Newton, it was evidence of a different kind of presence.

  He suspected that the stability of the solar system required active maintenance. He believed that the world would drift into chaos without a continuous, governing will. This is the God of the manuscripts: not the architect who leaves the building, but the King who never abdicates.

  This is where I must speak carefully, particularly to the specialists in this room whose work I admire. There is a temptation, one I succumbed to in my novel, to draw a straight line from Newton's theology to his physics. We want to say his Arianism *caused* his theory of gravity. That is too simple. It risks turning Newton into a puzzle where every piece fits perfectly. History is rarely so neat. I do not stand here to claim that his rejection of the Trinity mathematically necessitated his laws of motion.

  However, I do assert that these manuscripts reveal a shared disposition. The same mind that refused to accept the Trinity as a logical contradiction of divine unity was the same mind that refused to accept a universe that operated without a unified, sovereign will. He sought dominion in heaven and on earth. He wanted a physics that described not just how things move, but how they are held in being. When we read these drafts, we are not looking at a scientist taking a break to pray. We are looking at a man who believed that to study nature was to study the habits of God's power.

  This brings me to a delicate matter, one relevant to the clergy and donors here, and indeed to anyone who values religious tradition. We cannot sanitize Newton for this exhibition. We cannot soften him into a proto-modern believer who fits comfortably in a contemporary pew. Newton was an anti-Trinitarian. He believed the doctrine of the Trinity was a corruption of the early church, a historical error introduced by later centuries. He held this view while holding the Lucasian Chair at Cambridge, a position that required subscription to the Thirty-Nine Articles.

  He lived a double life not because he was irreligious, but because he was too religious to accept the orthodoxy of his time. He feared the label of heretic not because he doubted God, but because he believed he was defending the true monotheism of the scriptures against philosophical corruption. To hide this was a burden he carried for decades. When we look at these manuscripts, we are looking at the output of a man who felt he could not speak the truth of his conscience without losing his place in the world. There is a profound loneliness in these pages. They remind us that intellectual integrity often comes at a steep personal cost.

  Why does this matter to the students and members of the public who know Newton only as the man who explained the planets?

  It matters because these manuscripts challenge the story we tell ourselves about progress. We like to think that history moves from superstition to reason, from theology to science. Newton complicates that timeline. He is arguably the first modern scientist, yet he is deeply immersed in what we might call ancient concerns. He did not see a conflict between decoding prophecy and decoding light. He saw them as two forms of deciphering the same divine language.

  If we treat these documents as merely the errors of a great man, we miss the point. They are not errors; they are a different map of reality. They remind us that the drive to understand the universe is not purely secular. The desire to know *why* there is something rather than nothing, and *who* sustains it, is part of the same impulse that drives us to calculate *how* it moves.

  However, I must offer a caution, one that speaks to my own role as a novelist. There is a danger in looking at these manuscripts and seeing too much coherence. When I wrote my book, I needed Newton to make sense. I needed his theology to illuminate his physics in a way that satisfied a reader's desire for narrative arc. But a life is not a novel.

  We must remain honest about how little we can infer about the man from the coherence of his ideas. We have the words, but we do not have the heartbeat. We know what he wrote about the corruption of the church, but we do not know if he wept over those pages. We know he calculated the dimensions of the Temple of Solomon, but we do not know if he felt closer to God while doing so, or if it was merely an intellectual exercise in reconstruction.

  There is a risk in this exhibition that we will try to recruit Newton for our present-day arguments. Those who wish to separate science and religion will point to his successes in physics and treat his theology as a footnote. Those who wish to unite them will point to these manuscripts and claim Newton as a witness for faith. Both sides would be using him.

  Newton does not belong to us. He belongs to his own time, a time of intense religious upheaval, of political danger, of alchemical secrecy, and of revolutionary mathematics. He was not fighting our battles. He was not trying to validate modern fundamentalism, nor was he trying to secure a space for secular atheism. He was trying to serve a God who was actively ruling a creation that was fragile and dependent.

  So, what are we to do with these papers?

  We are to look at them as evidence of a struggle. The distinction between God as First Cause and God as Continuing Ruler is not just a theological concept; it is a measure of Newton's anxiety. The First Cause God is safe; He is distant. The Continuing Ruler God is demanding; He is everywhere. Newton chose the harder path. He chose a universe that required constant attention, both from God and from the natural philosopher who sought to understand Him.

  As you walk through this exhibition, I invite you to resist the urge to solve Newton. Do not try to make him entirely rational by our standards, and do not try to make him entirely pious by ours. Let him remain somewhat opaque. Let the manuscripts stand as they are: dense, difficult, sometimes contradictory, and utterly consuming.

  They show us a mind that refused to be partitioned. In an age where we often compartmentalize our lives—work here, faith there, private self elsewhere—Newton offers a startling example of total integration. It was an integration that caused him immense trouble, that forced him into secrecy, and that perhaps kept him from publishing even more than he did. But it was honest to his own vision.

  These manuscripts matter because they preserve the texture of that vision. They remind us that the scientific revolution was not merely a mechanical process of discovering laws. It was a human endeavor, driven by people who had stakes in the outcome, who feared for their souls, and who looked at the stars and saw not just data, but dominion.

  Thank you for preserving these documents. Thank you for making them accessible. And thank you for inviting us to stand before them, not as judges who know better, but as witnesses to a mind that sought to hold the heavens and the scriptures in a single grasp. May we have the courage to look at them with the same seriousness with which they were written.
