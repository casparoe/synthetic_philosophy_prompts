answer: |-
  Dear Colleague,

  It sounds like you have a compelling and timely argument for the seminar, and given the interdisciplinary mix of the audience, you should prepare for a lively discussion that cuts across theoretical divides. Since you requested a Q&A prep sheet in continuous prose without any formatting distractions, I have woven the eight most likely objections into this letter, ordered by a combination of their probability and the potential damage they could inflict on your thesis. Each objection is phrased as you might hear it in the room, followed by a suggested response that should take about two minutes to deliver, and a candid note on where that response is most vulnerable.

  The first objection will likely come from the evolutionary ecologists in the room, who might ask, I measure selection gradients for a living, so tell me practically how this changes what I do on Monday morning, because this sounds like a dispute about rhetoric among people who do not collect data. Your reply should emphasize that your proposal is methodological rather than purely philosophical, arguing that symmetric burden of proof prevents premature closure of inquiry. You should explain that currently, many ecologists might stop investigating a trait once a plausible adaptive story is told, or conversely, dismiss a trait as a byproduct without testing constraints. By demanding evidence for both adaptation and constraint, you are asking them to expand their toolkit to include developmental data and genetic correlation matrices, not just selection gradients. This shifts their work from merely measuring current utility to reconstructing historical origins, which enriches the data they collect. The weakness here is that it might sound like you are asking field biologists to do lab work or modeling that is outside their expertise, and they may resent the implication that their current methods are insufficient without you offering a concrete, easy alternative.

  The second challenge will come from the evo-devo researchers, who will probably say, You claim the critique is overextended, but adaptationism is still the dominant explanatory mode in most journals, so isn't spandrel-talk an underused tool rather than an overused one? You should acknowledge that adaptationist papers are still common but distinguish between publication frequency and rhetorical force. Argue that while adaptationist hypotheses are common, the spandrel label is often used as a conversation-stopper in peer review without positive evidence for constraint, which creates a asymmetrical barrier to publication. You want to clarify that you are not defending adaptationism but defending a symmetric standard of evidence, which would actually help evo-devo researchers if they provided data on constraints rather than just invoking the metaphor. The weak point in this reply is that it is empirically difficult to prove that spandrel-talk is overused compared to adaptationism, as you are fighting against their lived experience of seeing adaptationist papers published constantly.

  The third objection will arise from the evolutionary psychologists, who may press you by asking, Why stop at symmetry? Isn't the adaptationist program basically correct for human cognition, and aren't you conceding too much to the critics by validating the spandrel concept at all? You need to hold your line that symmetry protects science, not just their specific research program. Explain that if they want their adaptations to be taken seriously, they benefit from a culture where all claims require evidence, because otherwise their opponents can dismiss their work with unchecked byproduct hypotheses. You should argue that validating the spandrel concept as a legitimate conclusion, rather than an assumption, actually strengthens their position because it forces critics to do the hard work of demonstrating constraint. The vulnerability here is that this audience might feel you are not being a strong enough ally, and you risk alienating them if you seem too willing to validate the critiques they spend their careers fighting.

  The fourth question will be historical, likely phrased as, Isn't it unfair to critique Gould and Lewontin for how later people used their words, since you are judging 1979 by 2024 standards? Your response should be that ideas have consequences independent of authorial intent, and that the legacy of a paper is defined by how it is used in subsequent science. You should argue that while the original paper was a necessary corrective, the scientific community has since fossilized the metaphor into a dogma that hinders progress, and it is our responsibility to correct the usage regardless of the original authors' nuances. You can acknowledge their historical contribution while insisting on updating our methodological norms. The weakness is that this can sound dismissive of intellectual history, and a historian of science in the room might correctly point out that you are attacking a straw man version of the original paper rather than the text itself.

  The fifth objection will focus on the risk of unfalsifiable stories, with someone asking, Without the spandrels critique as a check, wouldn't we just end up with more unfalsifiable just-so stories about adaptation? You should reply that symmetric burden of proof actually reduces just-so stories on both sides, because it requires evidence for adaptation and evidence for constraint. Explain that currently, a just-so story can be countered by a just-so spandrel, and neither advances knowledge. By demanding evidence for both, you force researchers to move beyond storytelling into testing. You should emphasize that your proposal is not to remove the critique but to rigorize it. The weak spot is that proving a negative or proving a constraint is often harder than telling an adaptive story, so critics might argue you are setting a bar for byproducts that is impossible to clear, effectively restoring adaptationism by default.

  The sixth challenge will be technical, regarding the metaphor itself, such as, You are misusing the architectural metaphor because spandrels are not just byproducts but necessary structural consequences, so are you attacking a definition nobody uses? You should agree that the architectural metaphor is often abused and that this supports your point. Argue that because the term is used so loosely to mean any non-adaptive trait, it has lost its specific meaning regarding structural constraints, and reclaiming it requires the evidentiary standards you propose. You can use this to pivot back to your main thesis that the term is used as a label rather than an argument. The vulnerability is that you might get bogged down in architectural semantics rather than biological evidence, and an architect or careful reader might correct you on the actual definition of a spandrel, distracting from your biological argument.

  The seventh question will ask for clarification on terminology, specifically, Are you conflating exaptation with spandrels, since a trait can be a byproduct originally and adaptive now? You need to clearly distinguish between origin and current utility, stating that your argument concerns the explanation of origin. Reply that while exaptation is a valid concept, it is often used to smuggle in adaptationist assumptions about current utility to explain historical origin, and your symmetric burden applies to the historical claim. You should insist that demonstrating current utility does not prove historical adaptation, nor does it prove historical byproduct status without further evidence. The weakness here is terminological nitpicking, and you risk losing the audience in a maze of definitions if you do not keep the focus on the evidentiary standard rather than the labels.

  The eighth and final question is the one you should be most afraid of, because it targets the core feasibility of your proposal, and it will likely be phrased as, If the burden of proof is symmetric, what constitutes evidence for a spandrel that isn't just we couldn't find a function, since proving a negative is impossible? This is the most dangerous question because if you cannot answer it, your proposal for symmetry collapses into adaptationism by default. You must reply that evidence for a spandrel requires positive evidence of developmental constraint, genetic correlation, or phylogenetic inertia, not merely the absence of function. You should cite examples where developmental pathways dictate form regardless of utility, arguing that this is positive evidence of constraint. However, you must candidly acknowledge that this is the weakest part of your position, because demonstrating specific historical constraints is notoriously difficult and often relies on negative evidence itself, so your demand for symmetry might be theoretically sound but practically unachievable in many cases.

  I hope this breakdown helps you navigate the seminar, and I would pay particular attention to sharpening your answer to that final question, as it is the hinge upon which your entire thesis turns. Good luck with the talk.

  Sincerely,

  Your Colleague
