prompt: |-
  I'm a retired physicist (cosmology) who's gotten into philosophy the last few years, and I'm thinking of applying for one of those small independant scholar grants — maybe $5k for a summer project. My half-formed idea is about Boltzmann brains.

  Here's what I'm chewing on: the standard argument says Boltzmann brains are a reductio of certain cosmological models, because if the universe is infinite in space or time, random fluctuations should produce vastly more disembodied brains having fake experiences than ordinary embodied observers like us. Therefore any model that predicts we're probably Boltzmann brains is self-undermining. But I keep wondering whether the argument actually goes through if you're careful about the reference class problem — who exactly is "we" in "we are probably Boltzmann brains"? The argument seems to need a principle of indifference that picks out observers in a certain way, and I'm not sure the standard presentations nail this down.

  I want to turn this into a tight little research proposal: state the question precisely, explain why the existing literature leaves it open, lay out what I'd actually do month by month, and say what would count as the project failing. You're a professional philosopher of physics — start by brainstorming the possible angles on this, then think carefully and draft me the proposal. Don't bother with citations, I'll fill those in. And be honest: if this is too big for a summer or the question is ill-posed, tell me.
reasoning: |-
  Here's a thinking process that leads to the suggested proposal:

  1.  **Analyze the User and Request:**
      *   **User:** Retired cosmologist/physicist, recently interested in philosophy. This means they have strong technical background in the physics (inflation, entropy, thermal fluctuations) but might need guidance on the philosophical framing (epistemology, reference classes, self-locating belief).
      *   **Goal:** Apply for a small independent scholar grant ($\approx$5k for a summer).
      *   **Topic:** Boltzmann Brains (BBs) and the Reference Class Problem.
      *   **Task:** Brainstorm angles, then draft a tight research proposal (Question, Literature Gap, Methodology/Timeline, Failure Conditions).
      *   **Tone:** Professional philosopher of physics (collegial, rigorous, honest about feasibility).
      *   **Constraint:** No citations (user will fill them in).
      *   **Critical Check:** Is this feasible for a summer? Is the question ill-posed?

  2.  **Initial Assessment & Feasibility Check:**
      *   *Is the topic viable?* Yes. The BB problem is a staple in philosophy of cosmology. The connection to the reference class problem (RCP) is well-trodden but never fully settled. There's always room for a fresh look, especially from someone with physics chops who can spot where the physics assumptions drive the philosophical conclusions.
      *   *Is it too big?* The *general* BB problem is huge. Narrowing it to the *specific role of the reference class in the self-undermining argument* makes it manageable for a summer.
      *   *Is it ill-posed?* No, but it risks becoming a verbal dispute about "observers." The proposal needs to anchor "observer" in physical terms to avoid pure semantics.
      *   *Honesty:* I need to warn the user that "solving" the BB problem is unlikely. The goal should be clarifying the *structure* of the argument, not necessarily resolving the cosmological crisis.

  3.  **Brainstorming Angles:**
      *   *Angle 1: The Epistemic Angle.* Focus on self-locating belief (Elga, Lewis). How do we update credences when we don't know *where* we are in the multiverse?
      *   *Angle 2: The Physicalist Angle.* What counts as a "brain"? Is functionalism required? If a BB is a random fluctuation, does it have *content*? (This might be too linguistic/semantic for a summer).
      *   *Angle 3: The Measure Problem.* In eternal inflation, how do we count? This is more physics-heavy. The user has the background, but is it philosophy enough?
      *   *Angle 4: The Reference Class Specifics.* This is the user's intuition. Focus on *why* we group ourselves with BBs. Is the class "all conscious states," "all human-like cognitive structures," or "all physical systems with entropy $X$"?
      *   *Selection:* Angle 4 is the sweet spot. It bridges the physics (what exists) and the philosophy (how we reason about what exists). It fits the user's hunch.

  4.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "Self-Locating Uncertainty and the Boltzmann Brain Paradox."
      *   **Project Summary:** Hook the reviewer. BBs threaten cosmological models. The threat depends on how we count observers. I will analyze the Reference Class Problem (RCP) within this context.
      *   **Research Question:** Make it specific. Not "Are BBs real?" but "Does the RCP block the self-undermining argument?"
      *   **Literature Gap:** Acknowledge the standard view (BBs are bad). Point out that philosophers (Bostrom, Srednicki, etc.) and physicists (Carroll, Boddy) treat the reference class differently. The gap is a systematic analysis of *which* reference class principles validate or invalidate the BB reductio.
      *   **Methodology/Work Plan:** Break it down by month (June, July, August).
          *   June: Lit review & Taxonomy of Reference Classes.
          *   July: Formalizing the Argument (Bayesian framework).
          *   August: Testing against Cosmological Models & Writing.
      *   **Deliverables:** A paper (draft), maybe a blog post or workshop presentation.
      *   **Failure Conditions:** Crucial for a grant. What if the argument is just a mess? What if the conclusion is "it depends"? (Actually, "it depends" might be a success in philosophy). I need to define failure as *getting stuck on definitions* or *finding the distinction physically irrelevant*.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is $5k enough? Yes, for a summer stipend/buyout for an independent scholar.
      *   *Critique:* The user is a physicist. I should encourage them to use that strength. Don't just do armchair philosophy; use the phase space arguments.
      *   *Critique:* The "Failure" section needs to be realistic. In philosophy, a negative result is still a result. Failure should be defined as *inability to produce a coherent manuscript* or *realizing the distinction makes no probabilistic difference*.
      *   *Tone Check:* Ensure I'm not talking down. Treat them as a peer entering a new subfield. Acknowledge their physics expertise as an asset.

  6.  **Final Polish:**
