answer: |-
  **Simple Principle:** Consent is invalid if obtained through coercion, incapacity, deception regarding personal identity, or deception regarding material physical risks (health, pregnancy).

  **Complex Principle:** Consent is invalid if obtained through coercion, incapacity, deception regarding identity, or deception regarding facts that fundamentally alter the nature of the act, including physical risks and agreed-upon terms of sexual exclusivity or commitment status.

  **Accommodation and Conflicts:**
  The Simple Principle captures most of your verdicts (2–11) but forces you to overturn **Case 1** (Marriage). Lying about marital status is not a direct physical risk like an STD, yet you deem consent invalid. The Complex Principle accommodates Case 1 by recognizing that marriage implies specific terms of exclusivity and commitment that, when lied about, fundamentally change the agreement. Both principles correctly validate Case 4 (Job) and Case 11 (Love) as non-material deceptions regarding prestige or internal emotion.

  **Application to the Dating App Case:**
  *   **Under the Simple Principle:** Consent is **valid**. Lying about wanting a relationship is deception regarding future intent or emotion, similar to Case 11 (lying about love). It does not involve immediate physical risk or identity.
  *   **Under the Complex Principle:** Consent is **invalid**. Your verdict on Case 1 suggests you view deception about commitment status (marriage) as invalidating. Claiming to seek a "serious relationship" misrepresents the terms of exclusivity and commitment, fundamentally altering the nature of the sexual agreement just as the marriage lie did.

  **Recommendation:**
  Your intuition on Case 1 indicates you hold the Complex Principle. You distinguish between lies about *who someone is/what they offer socially* (Job, Love) and lies about *the framework of the sexual agreement* (Marriage, exclusivity). Adopting the Complex Principle provides consistency but requires you to accept that lying about relationship intent invalidates consent. This creates a difficult boundary: you must distinguish "looking for a relationship" (invalidating) from "I love you" (validating), perhaps by treating the former as a claim about external status/behavior and the latter as internal emotion.
