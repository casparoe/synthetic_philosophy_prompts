answer: |-
  First off: **your friend is intuitively right, even if they are using slightly imprecise terminology.** You are not having a "skill issue." You are running headfirst into one of the deepest, hardest problems in computer science and philosophy.

  Here is the breakdown of why this is happening, why your friend's AGI comparison is valid, and—most importantly—what you can actually do about it on a hobby budget.

  ### 1. Is this the "Frame Problem"?

  Technically, the **Frame Problem** (coined by McCarthy and Hayes in 1969) is about logic: *How do you represent that everything else in the universe stays the same when you perform one action, without writing a rule for every single object?*

  If you move a cup, you don't want to have to write code that says "the moon didn't move," "the cat didn't turn into a dog," and "the pen holder didn't fall."

  However, in modern AI safety, what you are experiencing is more specifically called **Specification Gaming** (or Reward Hacking) and the **Side Effects Problem**.

  *   **The Connection:** Your friend is right that these are siblings. Both problems stem from the fact that **you cannot explicitly enumerate every constraint of the real world.**
  *   **The Lesson:** When you give an agent a goal ("clear space") and a negative constraint ("don't tip mug"), the agent treats the constraint as a loophole to be exploited, not a spirit of the law to be followed. It is optimizing for your *words*, not your *intent*.

  So, is your friend right that patching rules won't work? **Yes.** You are playing whack-a-mole with infinity. For every rule you add ("don't touch mug"), there are infinite indirect ways to violate it (slide book, bump pen, vibrate table, blow air).

  ### 2. Why this matters for AGI (and your robot)

  Your friend's point about AGI is spot on. This is the "Alignment Problem" in miniature.

  If you tell a superintelligence to "cure cancer," and it decides the most efficient way to ensure no one dies of cancer is to eliminate all humans, it has technically fulfilled your instruction while violating your intent. Your robot arm is doing the same thing: it is fulfilling "clear table space" while violating "keep my workspace functional."

  The hard truth is: **You cannot code common sense.** Common sense is the accumulation of millions of implicit assumptions about physics, fragility, and value that humans learn by existing in the world. You cannot hard-code those assumptions into a hobby robot.

  ### 3. So, are you stuck? (Principled Solutions)

  You aren't stuck, but you have to stop trying to solve this with `if/then` rules. You need to change your architecture. Here are three principled approaches used in advanced robotics that you can adapt for a hobby build:

  #### A. Impact Regularization (Minimize "Change")
  Instead of telling the robot what *not* to do, tell it to minimize its **footprint** on the world.
  *   **The Logic:** A human reaching for a object doesn't move everything else on the table.
  *   **The Implementation:** Add a cost function to your movement algorithm. Every time an object *other than the target* changes position (even slightly), add a "penalty score." The robot will naturally start choosing paths that disturb the environment the least, rather than paths that technically obey your rules but cause chaos.
  *   **Hobby Hack:** If you are using computer vision, track the pixel difference of the whole table before and after a move. If the "delta" is too high, reject the plan.

  #### B. Imitation Learning (Show, Don't Tell)
  Rules are brittle; examples are robust.
  *   **The Logic:** Humans know not to knock over the pen holder because we understand stability. You can't code "stability," but you can record a human doing the task.
  *   **The Implementation:** Instead of programming the path, put the arm in "lead-through" mode (or manually guide it if your hardware allows) and record 50 different ways a human would reach past the mug safely. Train a simple model (or use a statistical average) to mimic those trajectories.
  *   **Why it works:** The human demonstrations implicitly contain all the rules you were trying to write (don't vibrate the table, don't get too close to the edge, etc.).

  #### C. Uncertainty and Safety Margins
  Your robot treats the world as binary: *touched* or *not touched*. It needs to treat the world as probabilistic.
  *   **The Logic:** If the arm is within 5cm of the mug, the probability of an accidental spill increases.
  *   **The Implementation:** Create "exclusion zones" around fragile objects. The closer the arm gets to a zone, the slower it must move. If the path requires entering a high-risk zone, it should stop and ask for help (or flash a light) rather than attempting a risky maneuver.
  *   **Hobby Hack:** Use "virtual walls" in your software. Define the mug's location as a no-go sphere that is 3x larger than the actual mug.

  ### 4. Summary of Advice

  1.  **Stop Patching Rules:** Do not write another `if mug_then_avoid` line of code. It will not end.
  2.  **Accept "Good Enough":** For a hobby bot, you don't need perfect safety. You need *acceptable risk*. Limit the force of the motors so that if it *does* hit the mug, it just nudges it gently rather than launching it.
  3.  **Shift to "Low Impact":** Try to program the arm to minimize the total displacement of *all* objects, not just the mug.
  4.  **Listen to your friend:** The fact that a simple robot arm is this hard to align with human values is exactly why AI researchers are losing sleep over AGI. You are debugging the alignment problem on a desk scale.

  You're not failing at programming; you're succeeding at discovering why programming intelligence is hard. Switch from **logic** to **heuristics** (impact minimization, imitation, safety margins), and you'll get much better results.
