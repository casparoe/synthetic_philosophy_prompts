answer: |-
  You have correctly identified a significant conceptual muddle in the literature. As a philosopher of biology, you are well-positioned to see that "costly signaling" is often used as a catch-all term for at least three distinct theoretical claims, ranging from a trivial observation about energy budgets to a specific game-theoretic equilibrium condition.

  The umbrella term is **Signaling Theory** (specifically within evolutionary biology and human behavioral ecology). However, to get the "carving" you are looking for, you need to distinguish between the **phenomenon** (honesty), the **mechanism** (cost), and the **specific mathematical condition** (differential marginal cost).

  Here is a taxonomy of the positions, moving from the weakest claim to the strongest, followed by the alternative mechanisms that handle your edge cases.

  ### 1. The Taxonomy of Cost Claims

  #### Level 1: Honest Signaling (The Phenomenon)
  *   **Claim:** The signal correlates reliably with the underlying quality of the sender (e.g., health, strength, intent).
  *   **Role of Cost:** None required by definition.
  *   **Status:** This is the *explanandum*. The literature often conflates this with the *explanans*. A signal can be honest without being costly (see "Indices" below).

  #### Level 2: Costly Signaling (The General Mechanism)
  *   **Claim:** The signal involves a net fitness cost (or resource expenditure) to the sender, and this cost contributes to reliability.
  *   **Role of Cost:** Cost acts as a barrier to entry.
  *   **Weakness:** This is often empirically true but theoretically insufficient. If a signal is costly, but *equally* costly for both high-quality and low-quality individuals, a low-quality individual might still fake it if the benefit of deception exceeds the cost.
  *   **Literature Confusion:** Many anthropological papers stop here. They argue that because a ritual is painful, it is honest. But pain alone does not guarantee honesty unless the pain is *differentially* burdensome.

  #### Level 3: The Handicap Principle (The Strong Claim)
  *   **Claim:** The signal is reliable *because* it is costly, specifically because the cost is **condition-dependent** (differential marginal cost).
  *   **Role of Cost:** Cost is the *mechanism of stability*.
  *   **Technical Specification:** Formalized by Alan Grafen (1990), building on Amotz Zahavi's intuition. For a signaling equilibrium to be evolutionarily stable, the marginal cost of signaling must be higher for low-quality individuals than for high-quality individuals.
  *   **Why it matters:** A peacock's tail is not just "expensive"; it is *disproportionately* dangerous for a sick/weak peacock to carry. A healthy peacock absorbs the cost easily; a weak one dies. This prevents the weak from mimicking the strong.
  *   **Status:** This is the "strongest version" you suspected. It is an empirical claim about specific signals, not a definitional truth about all signals.

  ### 2. The Crucial Distinction: Absolute vs. Differential Cost

  This is the primary place where the literature runs together.

  *   **Absolute Cost:** "This signal burns 100 calories."
  *   **Differential Cost:** "This signal burns 100 calories, which represents 1% of a high-quality agent's budget but 50% of a low-quality agent's budget."

  **The Carving:**
  If you read a paper claiming "Cost ensures honesty," ask: **Do they mean absolute cost or differential cost?**
  *   If **Absolute**: The argument is usually flawed (unless the cost exceeds the maximum possible benefit of deception for *all* types, which is rare).
  *   If **Differential**: They are invoking the Handicap Principle.

  ### 3. Alternative Mechanisms (The Edge Cases)

  You asked about signals that aren't costly or where costs fall differently. Signaling theory has specific names for these. They are distinct from Handicaps.

  #### A. Indices (or Assessment Signals)
  *   **Definition:** Signals that cannot be faked due to physical or physiological constraints, regardless of cost.
  *   **Cost:** May be low or zero.
  *   **Mechanism:** Physical linkage. You cannot produce a low-frequency roar without large vocal cords; you cannot "stot" if your legs are broken.
  *   **Edge Case Fit:** *Signals that can't be faked but aren't costly.*
  *   **Example:** The depth of a deer's roar correlates with body size. It is not "wasteful"; it is a byproduct of the anatomy.
  *   **Philosophical Note:** Indices are often conflated with Handicaps. In a Handicap, the sender *could* fake the signal but chooses not to because it's too expensive. In an Index, the sender *cannot* fake the signal.

  #### B. Conventional Signals
  *   **Definition:** Signals where the form is arbitrary, but honesty is maintained by social punishment or retaliation.
  *   **Cost:** The cost is not in production, but in the consequence of cheating.
  *   **Mechanism:** Receiver aggression. If you signal "I am strong" but you are weak, the receiver attacks you and you lose more than if you hadn't signaled.
  *   **Edge Case Fit:** *Signals where someone other than the signaler pays the cost* (partially). Actually, here the cost is imposed by the receiver upon detection of a lie.
  *   **Example:** Many threat displays in birds or wolves.

  #### C. Sunk Cost / Commitment Signals (Human Specific)
  *   **Definition:** Signals where past cost guarantees future behavior.
  *   **Mechanism:** The cost is irrecoverable, aligning the sender's future interests with the signal.
  *   **Edge Case Fit:** *Initiation rituals.*
  *   **Note:** In human behavioral ecology (HBE), this is often lumped under Costly Signaling Theory (CST), but strictly speaking, it relies on the logic of **commitment** rather than immediate quality advertisement.

  ### 4. Direct Answers to Your Edge Cases

  | Edge Case | Classification | Why? |
  | :--- | :--- | :--- |
  | **Unfakeable but not costly** | **Index** | Reliability comes from physical constraint, not economic cost. (e.g., body size revealed by voice pitch). |
  | **Costly but not differential** | **Unstable / Inefficient** | If cost is equal, low-types will mimic if Benefit > Cost. This does not sustain an honest equilibrium under standard models. |
  | **Costly & Differential** | **Handicap** | The Zahavi/Grafen model. Reliability comes from the *difference* in marginal cost. |
  | **Third-party pays cost** | **Social Sanction / Punishment** | Not a standard biological signal. Reliability is enforced by the group (e.g., gossip, ostracism), not by the signal's production cost. |
  | **Wasteful goods (Veblen)** | **Handicap (Human CST)** | In Human Behavioral Ecology, this is treated as a Handicap. The "waste" proves surplus resources. |

  ### 5. Recommended "Carving" for Your Work

  If you are writing on this, I recommend distinguishing these three concepts explicitly:

  1.  **Signal Honesty:** The correlation between signal and state.
  2.  **Costly Signaling (Broad):** Any signal where production reduces fitness/resources.
  3.  **The Handicap Principle (Narrow):** The specific hypothesis that honesty is *maintained* by differential marginal costs.

  **Where the literature fails:**
  Anthropological literature often treats **Costly Signaling (Broad)** as sufficient for **Honesty**. They argue: "The ritual is painful, therefore it is honest."
  Biological literature (post-Grafen) argues: "The ritual is painful *and* more painful for the uncommitted, therefore it is honest."

  **Key References for the Distinctions:**
  *   **Zahavi, A. (1975).** *Mate selection—a selection for a handicap.* (The original intuition).
  *   **Grafen, A. (1990).** *Biological signals as handicaps.* (The mathematical formalization of differential cost).
  *   **Searcy, W. A., & Nowicki, S. (2005).** *The Evolution of Animal Communication.* (Excellent philosophical/biological breakdown of Index vs. Handicap).
  *   **Maynard Smith, J., & Harper, D. (2003).** *Animal Signals.* (Distinguishes Indices, Handicaps, and Conventional signals clearly).
  *   **Bliege Bird, R., & Smith, E. A. (2005).** *Signaling Theory, Strategic Interaction, and Symbolic Action.* (For the anthropological/HBE application).

  ### Summary
  The pattern you noticed is **Costly Signaling Theory**, but the literature conflates the **Handicap Principle** (differential cost guarantees honesty) with the broader observation that **signals often have costs**.

  *   **Minimal Claim:** Signals often cost energy. (Trivial)
  *   **Intermediate Claim:** Costs help maintain honesty. (Generally true, but vague)
  *   **Strong Claim:** Honesty *requires* differential marginal costs (Handicap Principle). (Contested; Indices exist).

  Your intuition that "expense is what the signal consists in" aligns with the **Handicap Principle**, where the waste *is* the message. Your intuition about "unfakeable but not costly" aligns with **Indices**. Keeping these distinct will allow you to critique the anthropological literature where they often treat all costly behaviors as Handicaps without testing for differential marginal costs.
