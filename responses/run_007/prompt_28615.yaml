answer: |-
  1. "The room"
  The professor believes pragmatic coherence *constitutes* rationality; if you're exploitable, you're irrational, full stop. She'll attack your distinction between prices and epistemic states. The objective Bayesians are anxious about normativity; without Conditionalization, they fear epistemology collapses into arbitrariness. They'll press you on what replaces the rule. The stats PhD cares about utility, not justification; they'll dismiss the problem as irrelevant to practice. The quiet decision theorist knows the Reflection Principle; he'll argue that planning consistency requires the commitment you deny. Your job isn't to convert them, but to show the *argument* fails, not necessarily the *norm*.

  2. "The objections, in the order they'll actually come"

  **1. The Professor (Pragmatic Vindication)**
  "You're drawing a line between pragmatic vulnerability and epistemic irrationality that doesn't exist. If an agent's commitments guarantee a sure loss, that agent is defective. It doesn't matter if the defect is 'epistemic' or 'pragmatic'; rationality is unified. Why should we care about a norm that doesn't protect us from sure loss?"
  *Damage: 5/5.* This hits your core distinction.
  *Reply:* "Sure loss shows inconsistency in preferences, not error in belief. I can be consistent in my beliefs but have weird betting dispositions. The DB argument assumes beliefs *just are* betting dispositions. That's the premise I'm denying."
  *Soft Spot:* You need an account of belief that isn't dispositional, or you look like you're ignoring the link entirely.

  **2. The Quiet Guy (Reflection Principle)**
  "If you reject the commitment to your future credences, you violate van Fraassen's Reflection Principle. If you know now that you'll update on E, but don't set your current credence to match, you're dynamically inconsistent. Isn't that irrational planning?"
  *Damage: 4/5.* Hard to dodge without looking resolute-stubborn.
  *Reply:* "Reflection assumes you trust your future self. But the DB argument is supposed to *establish* that trust via Conditionalization. Using Reflection to prove Conditionalization presupposes the rationality of the update you're trying to prove."
  *Soft Spot:* If you deny Reflection, you look like an epistemic time-slicer, which has its own costs.

  **3. Objective Bayesian 1 (The Normative Vacuum)**
  "Okay, suppose the DB argument fails. What's your positive account? If Conditionalization isn't required, can I update by flipping a coin? If not, why? You're tearing down the bridge without building a new one."
  *Damage: 4/5.* Makes you look destructive rather than critical.
  *Reply:* "I'm critiquing the justification, not the rule. Conditionalization might be right, but DB doesn't prove it. We need a justification that doesn't beg the question about future commitment."
  *Soft Spot:* They will press: "If DB doesn't prove it, what does?" Have a backup (e.g., accuracy) or admit uncertainty.

  **4. Stats PhD (The Engineering Objection)**
  "This feels like navel-gazing. In practice, we conditionalize because it works. It minimizes loss over time. If the argument is circular but the result is optimal, why does the circularity matter?"
  *Damage: 3/5.* Easy to dismiss as missing the point, but persuasive to the room.
  *Reply:* "Because we're doing epistemology, not engineering. We want to know what we *ought* to believe, not just what pays off. A successful scam pays off, but isn't rational."
  *Soft Spot:* Can sound overly purist. Acknowledge utility but distinguish it from normativity.

  **5. The Professor (Synchronic Spill-over)**
  "If your bridge principle critique works for Diachronic DB, it works for Synchronic DB. Why does avoiding a sure loss package now establish probabilistic coherence, but avoiding it over time doesn't establish Conditionalization?"
  *Damage: 5/5.* If you lose synchronic coherence, you lose the seminar.
  *Reply:* "Synchronic DB shows static consistency among current prices. Diachronic DB requires a norm linking *different* times. The bridge principle is needed only for the temporal link, not the static snapshot."
  *Soft Spot:* You must maintain that static coherence is constitutive, while dynamic norms are not.

  **6. Objective Bayesian 2 (Accuracy Arguments)**
  "Even if DB fails, Joyce's accuracy arguments show Conditionalization minimizes expected inaccuracy. Are you rejecting those too? If not, why focus on DB?"
  *Damage: 3/5.* Sidesteps your specific claim.
  *Reply:* "I'm not rejecting Conditionalization, only the DB proof. Accuracy arguments rely on different premises about verisimilitude. My target is the pragmatic vindication specifically."
  *Soft Spot:* Makes your presentation seem narrow. Clarify that DB is the standard textbook justification you're targeting.

  3. "Concede this up front"
  Concede that Conditionalization is likely the correct update rule and that violating it is usually disastrous. State clearly: "I am not arguing we should stop conditionalizing. I am arguing that the Dutch Book argument fails to *justify* it as a rational norm." This disarms the Objective Bayesians' fear of arbitrariness and the Stats PhD's impatience. It frames your talk as a critique of *proof*, not *practice*. If you don't do this, the room will spend the Q&A trying to save the rule rather than listening to your critique of the argument.

  4. "The reply that has to land"
  "The Diachronic Dutch Book argument assumes what it tries to prove: that my current self is rationally bound by my future self's betting dispositions. It treats a policy choice as a logical constraint. To get from 'this policy avoids loss' to 'you are irrational if you don't adopt this policy,' you need a bridge principle linking pragmatic safety to epistemic obligation. The standard argument doesn't supply this bridge; it assumes the rationality of the update to prove the update is rational. Without that bridge, all the DB shows is that Conditionalization is a prudent betting strategy, not an epistemic requirement."

  5. "The question I'm hoping nobody asks"
  "If the Dutch Book argument fails to establish epistemic norms because betting prices aren't beliefs, doesn't that also destroy the Synchronic Dutch Book argument for Probabilistic Coherence? Are you secretly arguing against Probabilism?"
  *Reply:* "No. Synchronic coherence is a condition on holding simultaneous beliefs; Diachronic coherence is a condition on changing them. The latter requires a normative link across time that the former does not."
