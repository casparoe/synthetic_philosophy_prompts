answer: |-
  This case meets the specification by isolating the combinatorial burden of explicit persistence proofs as the load-bearing feature, forcing a trade-off between logical completeness and temporal relevance. In a cluttered workshop containing ten thousand distinct tools, each tracked by position and integrity fluents in a complete world model, a rising coolant leak threatens a specific critical wrench. Agent Alpha, employing explicit frame axioms, attempts to verify that moving the wrench alters no other fluent before acting, drowning in proofs of persistence for the irrelevant screwdrivers and hammers, and thus freezes until the coolant submerges the target. Agent Beta, using a relevance heuristic, assumes only the wrench and its immediate path matter, grabs the tool in time, and succeeds. In a minimal variation where the workshop contains only fifty items but the wrench is magnetically linked to a nearby pressure valve, Beta's heuristic ignores the valve's state fluent and triggers an explosion, whereas Alpha's exhaustive verification detects the coupling axiom and safely selects an insulated gripper.

  Agent Alpha's reasoning follows the textbook situation calculus: for the chosen action $a$ and every fluent $f$ in the set of $10,000$ modeled properties, it must derive the frame axiom $f(t+1) \leftrightarrow (Effect(a, f) \lor (f(t) \land \neg Effect(a, f)))$. Since the world model is complete, Alpha cannot assume persistence; it must prove $\neg Effect(a, f)$ for each irrelevant tool, creating a computational load proportional to the total number of fluents rather than the number of actual effects. Agent Beta bypasses this by restricting its inference to a subset of fluents deemed salient by a heuristic, reducing the load to a constant time operation independent of the workshop's clutter. The load-bearing feature doing the work is the requirement for explicit, individual verification of non-change for every represented fluent in a dense world model, which converts the sparsity of real-world causality into a computational bottleneck. A defender of explicit frame axioms would push back by arguing that the failure lies in the knowledge representation granularity, not the logic itself; they would contend that a rational agent should not instantiate fluents for every screwdriver unless there is prima facie evidence of relevance, thereby dissolving the philosophical frame problem into an engineering constraint on model construction.
