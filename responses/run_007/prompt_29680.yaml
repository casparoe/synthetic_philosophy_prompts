answer: |-
  The advance directive framework presupposes a biological view of personal identity combined with a theory of precedent autonomy that prioritizes the competent self's critical interests and narrative integrity over the incapacitated self's current experiential well-being.

  This position, most famously articulated by Ronald Dworkin, rests on two distinct philosophical pillars that explain why the practice differs from contract law or marriage. First, regarding **personal identity**, the law and standard bioethics operate on a biological or "numerical" identity model: as long as the human organism survives, it is the same person, regardless of psychological discontinuity. When you sign a directive, you are making a decision for this biological entity's future states. This rejects the "psychological continuity" view (championed by philosophers like Rebecca Dresser), which argues that severe dementia severs the psychological connections that constitute personhood, effectively creating a "new" person whose current interests should trump the "dead" predecessor's wishes. If the practice adopted the psychological view, your demented patient would be a different moral entity than the one who signed the form, and the form would hold no more weight than a stranger's opinion.

  Second, regarding **authority**, the framework relies on **precedent autonomy** rather than current consent. This distinguishes medical directives from contracts or marriage vows. In contract law, the state enforces promises to protect reliance interests and economic stability, but it allows exit clauses (breach penalties, divorce) because the obligation is primarily external. In medicine, the authority stems from the right to bodily integrity and freedom from trespass (battery). The philosophical claim is that autonomy is not just about moment-to-moment choice but about shaping the narrative arc of a whole life. Dworkin distinguishes between **experiential interests** (pleasure, avoiding pain, enjoying pudding) and **critical interests** (values, dignity, how one's life story ends). The advance directive system assumes your competent self was the only one capable of weighing critical interests, and that losing capacity does not forfeit the right to have those critical interests respected. The "drunk or temporary impairment" analogy fails here because the legal trigger for an advance directive is the *permanent* loss of the capacity to revise one's views; the drunk person retains the theoretical capacity to sober up and change their mind, whereas the advanced dementia patient, under this framework, does not.

  If we swapped this presupposed view for the **psychological continuity/current interests model**, the practical changes in your ward would be drastic. Advance directives for dementia would shift from binding instructions to advisory documents. You would no longer be ethically or legally obligated to withhold antibiotics from a happy, demented patient solely based on a prior signature; instead, you would default to a "best interests" standard based on the patient's current observable well-being. The burden of proof would flip: rather than requiring evidence that the patient *changed* their mind (which is impossible if they lack capacity), you would need evidence that the current self's interests aligned with the prior directive. This would likely lead to more aggressive treatment of demented patients, as their current enjoyment of life would outweigh the abstract dignity concerns of their past selves.

  However, the current system maintains the biological/precedent autonomy view primarily for **epistemic and stability reasons**, not just metaphysical ones. Clinicians and courts are skeptical of their ability to accurately assess the "quality of life" of a non-communicative patient without projecting their own biases. The prior directive provides a concrete evidentiary anchor. Furthermore, respecting precedent autonomy encourages people to plan and trust the medical system; if people believed their future demented selves could override their deepest values, they might avoid planning or seek premature euthanasia while still competent. So, while the tension you feel is philosophically valid—and many bioethicists argue we should move toward a more flexible, best-interests model for dementia specifically—the current practice is committed to the view that you are the steward of your biological life's narrative, and that stewardship does not end when the narrative voice goes silent.
