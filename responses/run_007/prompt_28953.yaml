      *   *Contested (Metaphysics of Taste):* Are taste properties (e.g., "harsh," "flat") objective features of the coffee or subjective projections? Is there a "fact of the matter" about the coffee's taste independent of the taster?
      *   *Contested (Normativity):* Can one be *wrong* about their own experience? (First-person authority).

