answer: |-
  Yes, there is an established philosophical framework that matches your fourfold distinction almost exactly. It comes from the **Nyaya school of Indian Philosophy** (c. 2nd century CE onwards), which developed a sophisticated theory of knowledge called **Pramana Shastra**.

  The Nyaya philosophers identified four irreducible means of valid knowledge (*pramanas*). They famously argued against other schools (such as Buddhism or Charvaka) that attempted to reduce testimony or analogy to inference. Their debates mirror your team's procedural struggles: they insisted that trusting a reliable speaker (*Śabda*) is a fundamental way of knowing, not merely a calculated inference about the speaker's honesty, and that comparison (*Upamāna*) yields knowledge that pure logic cannot.

  Below is the detailed mapping of your observations to the Nyaya framework, followed by an analysis of where the fit is strong and where you should expect friction.

  ### The Framework: Nyaya Pramana Theory

  In Nyaya epistemology, a *pramana* is an instrument or source of knowledge that yields a true cognition (*prama*). The standard Nyaya system accepts four:

  1.  **Pratyakṣa (Perception):** Knowledge generated by the contact of the senses with an object.
      *   **Your Kind 1:** This aligns with your "firsthand perception." For Nyaya, this includes not just raw sensory data but "determinate perception" where the mind recognizes the object (e.g., seeing a document and recognizing it as a contract).
      *   **Irreducibility:** Nyaya argues this is the foundation; you cannot infer what you do not first perceive.

  2.  **Anumāna (Inference):** Knowledge derived from a mark or sign (*linga*) based on a universal relation (*vyapti*).
      *   **Your Kind 2:** This aligns with your "reasoning from established facts." It involves a logical structure: "Where there is smoke, there is fire; there is smoke here; therefore, fire." In your context: "Where there is fraud, there are altered logs; these logs are altered; therefore, fraud."
      *   **Irreducibility:** This is distinct from perception because it relies on a middle term to bridge the gap between known and unknown.

  3.  **Śabda (Verbal Testimony):** Knowledge derived from the statement of a reliable person (*apta*).
      *   **Your Kind 3:** This aligns with your "acceptance on the word of a person."
      *   **Irreducibility:** This is the critical match for your procedural problem. Reductionists (like Hume in the West, or Buddhists in India) argue testimony is just inference ("I infer he is telling the truth because he has been reliable before"). Nyaya argues *Śabda* is *sui generis*: if the source is competent and honest, the knowledge is immediate and distinct from calculating their reliability. Your intuition that forcing this into "inference" obscures the actual cognitive act is philosophically vindicated here.

  4.  **Upamāna (Comparison/Analogy):** Knowledge of the relation between a name and an object based on similarity.
      *   **Your Kind 4:** This aligns with your "pattern recognition." Classically, *Upamāna* is described as learning what a "gavaya" (wild cow) is by being told it is like a domestic cow, and then recognizing one in the forest.
      *   **Irreducibility:** Nyaya argues this is not just inference because the recognition of similarity precedes the logical formulation. This matches your observation that "recognition reliably arrives before the articulation does."

  ### Alignment and Divergence

  **Where it Aligns:**
  The structural isomorphism is striking. Your frustration with the "direct vs. circumstantial" binary is a known limitation in Western legal epistemology, which often collapses Testimony into Hearsay (a subset of inference/reliability) and Analogy into "propensity evidence" (often discouraged). The Nyaya framework validates your intuition that these are four distinct cognitive operations requiring different validation protocols.

  **Where it Diverges:**
  1.  **The Definition of Analogy (*Upamāna*):** In strict Nyaya logic, *Upamāna* is primarily about semantic extension (learning a new term via similarity). Your use of Kind 4 is broader: it includes evidentiary weighting based on precedent ("this looks like the Henderson matter"). While this falls under the *spirit* of analogy, modern epistemology might classify your Kind 4 as "Case-Based Reasoning." However, *Upamāna* remains the best classical label for the *epistemic warrant* of similarity.
  2.  **Memory:** Nyaya typically treats memory as a reproduction of past knowledge, not a *new* pramana. In investigations, "recall" is huge. You may need to decide if memory is a sub-category of Perception (re-experiencing) or Testimony (self-testimony).
  3.  **Documents:** Your Kind 1 includes "holding the document and reading it." Nyaya might classify reading a document as *Śabda* (the document is a silent speaker) unless you are examining the physical ink/paper (*Pratyakṣa*). This is a boundary dispute you will face.

  ### Operationalizing This for Your Team

  You do not need to use Sanskrit terms, but adopting the *structure* of the Nyaya view will help you diagnose errors.

  *   **For Kind 3 (Testimony):** Stop asking investigators to prove reliability *before* accepting the claim as a working hypothesis. Treat the testimony as a distinct warrant that *shifts the burden of proof*, rather than a conclusion that requires prior inductive support.
  *   **For Kind 4 (Analogy):** Legitimize "pattern recognition" as a formal step. Require investigators to articulate the *dimensions of similarity* (the "relevant respects") after the intuition arises, rather than dismissing the intuition because it isn't yet articulated.

  ### Boundary Disputes to Anticipate

  1.  **Theory-Laden Perception:** An investigator "sees" misconduct (Kind 1), but is that actually an inference (Kind 2) based on their training? (e.g., "I see a forged signature" vs. "I see ink on paper").
  2.  **The Reduction of Testimony:** Skeptics will argue Kind 3 is always Kind 2 ("I only believe the whistleblower because I infer they have no motive to lie"). You must enforce the rule that credibility is a *condition* for Testimony, not the *source* of the warrant.
  3.  **Analogy vs. Induction:** Kind 4 will be attacked as "weak Kind 2." You must distinguish between statistical generalization (Induction) and structural similarity (Analogy).

