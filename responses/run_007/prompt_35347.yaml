answer: |-
  You have identified two of the most famous and structurally significant problems in the contemporary metaphysics of dispositions. These are not merely puzzles you have stumbled upon; they are the central counterexamples that dismantled the **Simple Conditional Analysis (SCA)** of dispositions in the 1990s and reshaped the field.

  To answer your primary question: **Yes, these patterns have established names, and yes, they are treated as distinct problems,** although they share the same logical consequence (both make the conditional analysis yield a "false negative").

  Here is the breakdown of the terminology, the distinction between them, and how philosophers navigate the boundary.

  ### 1. The Names and Origins

  **Pattern 1: The Glass/Sensor Case**
  *   **Name:** **Finkish Dispositions** (or simply **Finks**).
  *   **Origin:** Coined by the Australian philosopher **C.B. Martin** in his seminal 1994 paper, *"Dispositions and Conditionals."*
  *   **The Logic:** A disposition is *finkish* if the stimulus that is supposed to trigger the manifestation instead causes the disposition to vanish *before* the manifestation can occur.
  *   **Why it breaks the SCA:** The Simple Conditional Analysis says: *$x$ is disposed to $M$ in response to $S$ iff if $S$ were to happen, $M$ would happen.*
      *   In your glass case, the glass *is* fragile (it has the crystalline structure of fragile glass).
      *   But the conditional "If struck, it breaks" is **false** (because it turns soft and doesn't break).
      *   Therefore, the SCA incorrectly implies the glass is not fragile.

  **Pattern 2: The Cyanide/Antidote Case**
  *   **Name:** **Masking** (or **Masks**).
  *   **Origin:** Also discussed by Martin, but significantly developed by **David Lewis** (1997) and **Mark Johnston** (1992).
  *   **The Logic:** A disposition is *masked* if the disposition remains intact and the stimulus occurs, but an extrinsic factor interferes with the causal process leading to the manifestation.
  *   **Why it breaks the SCA:**
      *   The cyanide *is* lethal (it retains its toxic chemical structure).
      *   The stimulus occurs (ingestion).
      *   But the conditional "If ingested, death results" is **false** (because the antidote blocks the effect).
      *   Therefore, the SCA incorrectly implies the cyanide is not lethal.

  ### 2. Are They Distinct or Variants?

  They are treated as **distinct mechanisms** that produce the same logical error. While both are "False Negative" counterexamples (the object has the property, but the conditional fails), the metaphysics of *why* the conditional fails differs.

  | Feature | **Finkish Dispositions** | **Masking** |
  | :--- | :--- | :--- |
  | **Status of Disposition** | The disposition is **lost** or removed upon stimulation. | The disposition is **retained** throughout the process. |
  | **Target of Interference** | The interference targets the **categorical basis** (the intrinsic property grounding the disposition). | The interference targets the **causal pathway** to the manifestation. |
  | **Timing** | The removal of the disposition is usually simultaneous with or triggered by the stimulus. | The blocking factor often exists *prior* to the stimulus (e.g., antidote taken beforehand). |
  | **Intrinsic/Extrinsic** | Often involves an intrinsic change (glass structure changes), though can be extrinsic (a wizard zapping the glass). | Typically involves extrinsic circumstances (the presence of an antidote, a safety net, a vacuum). |

  **The Philosophical Consensus:**
  Philosophers generally agree that a solution to Finks does not automatically solve Masks, and vice versa.
  *   **David Lewis's Solution:** In his *"Reformed Conditional Analysis" (1997)*, Lewis tried to solve both by adding a clause: the object must retain its "causal basis" throughout the stimulus. This handles Finks well (the basis doesn't stay), but struggles with Masks (the basis *does* stay, yet the manifestation fails).
  *   **Causal Theories:** Many philosophers (like Sungho Choi or Alexander Bird) argue that dispositions should not be analyzed via conditionals at all, but rather as **causal powers**. In a causal power view, the cyanide *exercises* its power, but the effect is prevented. This handles Masks better than Finks.

  ### 3. The Boundary and Ambiguous Cases

  You asked where the edge lies and whether cases can be ambiguous. This is a live debate in the literature. The boundary rests on **what happens to the categorical basis.**

  **The Clear Boundary:**
  *   **Fink:** The intrinsic property that *makes* the object fragile/toxic is altered or removed.
  *   **Mask:** The intrinsic property remains, but the environment prevents it from completing its job.

  **The Ambiguous Zone: Chemical Neutralization**
  Consider a variation of your cyanide case.
  *   *Case A:* The victim takes an antidote that binds to the cyanide molecules in the stomach, preventing them from entering the bloodstream. The cyanide molecules remain chemically toxic, but they are physically blocked. **Verdict: Mask.**
  *   *Case B:* The victim takes a substance that instantly reacts with the cyanide upon ingestion, changing its molecular structure into a harmless salt. The cyanide ceases to be cyanide. **Verdict: Fink.**

  In Case B, the disposition (lethality) is destroyed because its basis (the specific chemical structure) is destroyed by the stimulus (ingestion + neutralizer). In Case A, the basis remains, but the pathway is blocked.

  **Why the Ambiguity Matters:**
  Some philosophers argue that *all* masks are really finks, or vice versa.
  *   **The "All Masks are Finks" view:** If an antidote prevents death, one could argue the cyanide-in-that-context is no longer lethal. The disposition is context-sensitive. If so, the disposition *was* lost (Finkish).
  *   **The "All Finks are Masks" view:** One could argue the glass never truly loses its fragility; the "softening mechanism" is just a very strong mask that prevents the breaking.

  However, the dominant view (championed by **Choi 2006**, **Gundersen 2002**) maintains the distinction. They argue that Finks involve the *absence* of the disposition at the time of manifestation, whereas Masks involve the *presence* of the disposition with a frustrated outcome.

  ### 4. A Third Pattern (For Context)

  To fully understand the landscape, you should know there is a third pattern that creates the opposite logical problem (False Positives).
  *   **Name:** **Mimics** (or **Simulated Dispositions**).
  *   **Case:** An object is *not* fragile, but if struck, a hidden explosive charge detonates, shattering it.
  *   **Result:** The conditional "If struck, it breaks" is **True**, but the object is **Not Fragile**.
  *   **Significance:** If Finks and Masks show that having a disposition doesn't guarantee the conditional is true, Mimics show that the conditional being true doesn't guarantee having a disposition.

  ### 5. Summary of the Philosophical Landscape

  When you read current literature on dispositions (metaphysics of powers, causal modalities), you will find these terms used as shorthand for specific structural failures of conditional analyses.

  1.  **Finkish Dispositions:** The stimulus kills the disposition. (Martin's primary contribution).
  2.  **Masking:** The environment blocks the manifestation. (Lewis/Johnston's primary focus).
  3.  **Mimics:** The stimulus triggers a fake manifestation. (The counter-counterexample).

  **Recommendation for Further Reading:**
  If you want to trace the analysis of the boundary you asked about, look for:
  *   **C.B. Martin,** *"Dispositions and Conditionals"* (1994) – The origin of the Fink.
  *   **David Lewis,** *"Finkish Dispositions"* (1997) – The attempt to reform the analysis.
  *   **Sungho Choi,** *"The Conditional Analysis of Dispositions"* (2006) or *"Dispositions and Mimics"* – Choi has written extensively on distinguishing Finks from Masks rigorously.
  *   **Alexander Bird,** *"Nature's Metaphysics"* (2007) – Argues for a causal power view that dissolves these problems by rejecting conditionals entirely.

  **In short:** You have correctly identified **Finks** and **Masks**. They are distinct problems requiring distinct metaphysical explanations, centering on whether the *basis* of the property is removed (Fink) or whether the *process* of manifestation is obstructed (Mask).
