prompt: |-
  ok so I'm teaching a grad seminar on moral worth next term and I want to start the first real session by putting the cart before the horse — before we read any of the usual suspects (Kant, Arpaly, Markovits, etc.), I want us to figure out what we're actually asking of a theory here. So: write me the desiderata. What does a theory of moral worth — of what it takes for an action to be not just right but done for the right reasons, such that the agent deserves credit — have to get right to count as adequate?

  For each requirement, give me the case or consideration that motivates it. Then flag which ones you think are non-negotiable (any theory that fails here is just not talking about the same thing) and which are more like theoretical preferences or demands from one camp that another camp might reasonably reject. If any pair of desiderata can't be jointly satisfied, I especially want to know that — that's the part I most want to see, actually.

  And then, because I'm going to ask this in class anyway: which single requirement does the most work in knocking out the most popular views? Don't do a full scorecard — just tell me which one is the real bottleneck and why.

  Some things I definitely want on the list: the Huck Finn / inverse akrasia problem, the "right kind of reasons" problem (not just any ol' reason that happens to cause the right act counts), and the overdetermination / mixed motives problem. But don't just list those three — I want the full set of genuine constraints, and I want you to tell me if some of the things people treat as constraints are actually just baggage from one particular view that the rest of us don't have to accept.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Grad seminar on moral worth (next term).
      *   **Goal:** Create a list of *desiderata* (requirements/constraints) for a theory of moral worth *before* reading the standard texts (Kant, Arpaly, Markovits, etc.).
      *   **Specific Instructions:**
          *   For each desideratum: Provide the motivating case/consideration.
          *   Classify each as "Non-negotiable" (constitutive of the concept) or "Theoretical Preference" (camp-specific).
          *   Identify incompatibilities/tensions between desiderata (crucial part).
          *   Identify the "Bottleneck" requirement (the one that knocks out the most popular views).
          *   Include specific required topics: Huck Finn/Inverse Akrasia, Right Kind of Reasons, Overdetermination/Mixed Motives.
          *   Tone: Philosophical, rigorous, suitable for a grad seminar, slightly provocative (to spark discussion).

  2.  **Deconstruct "Moral Worth":**
      *   What is it? It's not just rightness (consequences/rules). It's about the *agent's relation* to the rightness. It's about credit, praiseworthiness, dignity, or moral standing.
      *   Key intuition: Two agents do the right thing. One deserves credit; the other doesn't (or deserves less). Why?

  3.  **Brainstorming Desiderata:**
      *   *Right Action:* You can't have moral worth for doing the wrong thing (usually).
      *   *Motivation:* It has to be done *because* it's right (or for the right reasons).
      *   *Knowledge:* Do you need to know it's right? (Huck Finn says no).
      *   *Counterfactuals:* Would you have done it if it weren't right? (Markovits).
      *   *Difficulty/Effort:* Does struggling add worth? (Kant vs. Aristotelian virtue).
      *   *Luck:* Moral luck shouldn't determine worth too much.
      *   *Overdetermination:* What if I do it for duty *and* inclination?
      *   *Fetishism:* Caring too much about "moral worth" itself can be narcissistic (Arpaly/Smith).

  4.  **Developing the List (incorporating required topics):**

      *   *Desideratum 1: The Non-Accidentality Constraint.* (Right Kind of Reasons). The action shouldn't be right by luck.
      *   *Desideratum 2: The Opacity of Virtue (Huck Finn).* You can have worth without believing the act is right. (Inverse Akrasia).
      *   *Desideratum 3: The Purity/Mixed Motives Constraint.* (Overdetermination). Can you have worth if you also want a cookie?
      *   *Desideratum 4: The Counterfactual Sensitivity Constraint.* (Markovits). Would you do it if it weren't right?
      *   *Desideratum 5: The Non-Fetishism Constraint.* (Arpaly). Caring about "deontology" directly can be alienating.
      *   *Desideratum 6: The Difficulty/Effort Constraint.* Does struggle matter?

  5.  **Classifying (Non-negotiable vs. Preference):**
      *   *Non-negotiable:* Non-Accidentality (otherwise it's just luck), Right Action (usually, though supererogation complicates this).
      *   *Preference:* Difficulty (Kantians love it, Virtue Ethicists hate it), Purity (Kant says yes, others say mixed motives are fine), Opacity (Kant says no, Arpaly says yes).

  6.  **Identifying Tensions/Incompatibilities:**
      *   *Huck Finn vs. Right Kind of Reasons:* If Huck doesn't think he's doing right, how is he responding to the *right reason*?
      *   *Purity vs. Psychological Realism:* Demanding pure motives might make moral worth impossible for normal humans.
      *   *Counterfactuals vs. Opacity:* If Huck doesn't believe it's right, how do we test counterfactuals about "if it weren't right"?

  7.  **Identifying the Bottleneck:**
      *   What kills the most theories?
      *   *Candidate:* The "Right Kind of Reasons" vs. "Huck Finn" tension.
      *   *Better Candidate:* **The Non-Accidentality Constraint (specifically the "Because" relation).**
      *   *Why?* It kills consequentialism (too much luck), simple Kantianism (Huck Finn problem), and simple Virtue Ethics (situationist challenge). Actually, the *real* bottleneck is often **The Connection between Belief and Truth.** (i.e., Do you need to know it's right to do it for the right reason?)
      *   *Refinement:* Let's look at the "Right Kind of Reasons" constraint. It's the engine that drives the debate. If you define "Right Reason" too narrowly (Kant), you lose Huck. If you define it too broadly (Arpaly), you risk accidentality.
      *   *Decision:* The **"Because" Relation (Non-Accidentality)** is the bottleneck. Every theory tries to solve *what it means to act because it is right*.

  8.  **Drafting the Content (Iterative refinement for tone and precision):**

      *   *Intro:* Set the stage. This is about mapping the logical space.
      *   *The List:*
          1.  **The Non-Accidentality Constraint.** (Motivation: The Shopkeeper). Status: Non-negotiable.
          2.  **The Inverse Akrasia Constraint.** (Motivation: Huck Finn). Status: Non-negotiable (mostly).
          3.  **The Motive Purity Constraint.** (Motivation: Kant's Shopkeeper vs. Sympathetic person). Status: Theoretical Preference.
          4.  **The Counterfactual Sensitivity Constraint.** (Motivation: Markovits). Status: Theoretical Preference (but strong).
          5.  **The Non-Fetishism Constraint.** (Motivation: Stocker/Arpaly). Status: Non-negotiable (for many).
          6.  **The Cognitive Access Constraint.** (Motivation: Do you need moral concepts?). Status: Theoretical Preference.
      *   *Tensions:* Highlight the Huck Finn vs. Non-Accidentality clash. Highlight Purity vs. Psychological Reality.
      *   *The Bottleneck:* The **"Because" Relation (Non-Accidentality)**. It's the hardest to cash out without running into regress or excluding clear cases.

  9.  **Review against Constraints:**
      *   Did I include Huck Finn? Yes.
      *   Right Kind of Reasons? Yes (Non-Accidentality).
      *   Overdetermination? Yes (Motive Purity).
      *   Non-negotiable vs. Preference? Yes.
      *   Tensions highlighted? Yes.
      *   Bottleneck identified? Yes.
      *   Tone appropriate? Yes, academic but direct.

  10. **Final Polish:** Ensure the distinction between "Moral Worth" and "Praiseworthiness" is clear (they often overlap but can diverge). Make sure the "Bottleneck" argument is punchy. (Self-Correction: Make sure to emphasize that *Inverse Akrasia* is the specific wedge that breaks the link between Moral Belief and Moral Worth).

  11. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a set of desiderata for a theory of moral worth, designed to structure your first seminar session. I have organized them by the constraint they impose, the case that motivates them, and their status (non-negotiable vs. theoretical preference). I have also highlighted the tensions between them and identified the bottleneck.

  ### The Desiderata List

  #### 1. The Non-Accidentality Constraint
  *   **The Requirement:** The rightness of the action must not be a matter of luck or coincidence. The agent's motivation must explain *why* the action was right, not merely cause the action to occur.
  *   **The Case:** **Kant's Honest Shopkeeper.** The shopkeeper charges the child the correct price. If he does so only because he fears bad publicity, the action is right, but he gets no moral credit. If the lighting is bad and he accidentally hands back the correct change thinking it's the wrong amount, he gets no credit.
  *   **Status:** **Non-Negotiable.** If a theory allows accidental rightness to count as moral worth, it is no longer a theory of *worth*; it is a theory of *outcome*.
  *   **The Problem:** Cash out the "because." Does it require a specific mental state? A counterfactual dependency? A metaphysical grounding?

  #### 2. The Inverse Akrasia Constraint (The Huck Finn Constraint)
  *   **The Requirement:** An agent can possess moral worth even if they believe (or explicitly judge) that what they are doing is wrong, provided they are responding to the actual normative features of the situation.
  *   **The Case:** **Huck Finn.** Huck helps Jim escape slavery. He believes he is committing a mortal sin (stealing property). He acts on sympathy/loyalty, not a duty to anti-slavery. Intuitively, Huck is morally better than a slave-catcher who does their "duty."
  *   **Status:** **Non-Negotiable (with caveats).** Most contemporary philosophers treat this as a fixed point. A theory that requires *correct moral belief* for moral worth is dead on arrival for most modern audiences.
  *   **The Problem:** If the agent thinks the act is wrong, in what sense are they doing it *for the right reason*? This puts immense pressure on the "Right Kind of Reasons" constraint.

  #### 3. The Motive Purity Constraint (The Overdetermination Problem)
  *   **The Requirement:** This specifies whether competing motives dilute or destroy moral worth.
  *   **The Case:** **The Sympathetic Philanthropist.** Agent A gives to charity solely from duty. Agent B gives to charity from duty *and* because they love helping people (inclination). Does Agent B have less worth? Equal worth? More?
  *   **Status:** **Theoretical Preference.**
      *   *Kantians* often lean toward Purity (inclination contaminates duty).
      *   *Aristotelians/Virtue Ethicists* reject Purity (inclination should align with duty; doing the right thing grudgingly is inferior).
      *   *Compatibilists* argue overdetermination is fine as long as the right reason is *sufficient*.
  *   **The Problem:** If you demand purity, moral worth becomes impossibly rare. If you reject it, you risk violating Non-Accidentality (what if the inclination was the actual driver?).

  #### 4. The Counterfactual Sensitivity Constraint
  *   **The Requirement:** The agent must be disposed to do the right thing across a range of relevantly similar possible worlds. The motivation must track the rightness, not just the specific instance.
  *   **The Case:** **Markovits's Nazi.** A Nazi helps a Jew because "she is my neighbor." This is a good reason, but if the neighbor were not a Jew (and the Nazi policy didn't forbid helping non-Jews), he would help. But if the policy *did* forbid it, he wouldn't. His motivation isn't sensitive to the *moral* feature (humanity/rights), only the contingent feature (neighborhood).
  *   **Status:** **Theoretical Preference (but strong).** This is the primary weapon against "particularist" or "naive virtue" accounts. However, strict counterfactuals can be too demanding (we aren't sensitive to *all* moral features all the time).
  *   **The Problem:** How wide must the range of counterfactuals be? If too wide, no human passes. If too narrow, it collapses into Non-Accidentality.

  #### 5. The Non-Fetishism Constraint
  *   **The Requirement:** The agent's motivation should not be a direct, de dicto desire to "do the right thing" or "have moral worth."
  *   **The Case:** **The Moral Pervert (Stocker/Arpaly).** An agent who visits a friend in the hospital solely because "it is my duty" or "to maximize the good," without caring about the friend's health *per se*, seems alienated or narcissistic. They care more about their own moral record than the value at stake.
  *   **Status:** **Non-Negotiable.** A theory that awards highest worth to the moral fetishist is counterintuitive and psychologically unhealthy.
  *   **The Problem:** This conflicts with a literal reading of Kant. If I must act *from duty*, am I not thinking about duty? How do we distinguish "respect for the law" from "moral fetishism"?

  #### 6. The Cognitive Access Constraint
  *   **The Requirement:** This specifies the level of moral conceptualization required. Must the agent possess the concept "morally right"?
  *   **The Case:** **The Child or the Uncultured.** A child shares a toy because "it makes him sad otherwise," lacking the concept of "justice." Do they have moral worth?
  *   **Status:** **Theoretical Preference.** Intellectualists say yes (need concepts); Externalists say no (need only respond to features).
  *   **The Problem:** If you require concepts, you exclude Huck Finn (who lacks the right concepts). If you don't, you risk including animals or robots who respond to features without understanding.

  ---

  ### The Tensions (Where the Theory Breaks)

  You should put these three conflicts on the board immediately. They show why this is a hard problem.

  **1. The Huck Finn vs. Non-Accidentality Tension**
  *   **The Clash:** Non-Accidentality demands the action be right *because* of the motivation. Huck's motivation (sympathy) is not *conceptually* linked to the rightness (justice/freedom). He thinks he's doing wrong.
  *   **The Dilemma:** To save Huck, you must loosen the link between motivation and rightness. But if you loosen it too much, you let in the Shopkeeper (who acts on inclination that happens to align with duty). How do you distinguish Huck's "good inclination" from the Shopkeeper's "lucky inclination" without appealing to moral belief (which Huck lacks)?

  **2. The Purity vs. Psychological Realism Tension**
  *   **The Clash:** If you demand Motive Purity (only duty, no inclination), you satisfy Non-Accidentality but violate Non-Fetishism (you make the agent a cold calculator) and Psychological Realism (humans rarely have single motives).
  *   **The Dilemma:** If you allow Mixed Motives, you need a story about which motive is "in charge." But if the inclination is strong enough to cause the act, how do you prove the duty was the operative reason?

  **3. The Counterfactual vs. Opacity Tension**
  *   **The Clash:** Counterfactual Sensitivity asks: "Would you do this if it weren't right?" But for agents like Huck or the Child (Cognitive Access), they *don't know* what is right.
  *   **The Dilemma:** You cannot run counterfactual tests on the agent's representation of rightness if they don't have that representation. You have to run the test on the *features* (e.g., "Would you help if he weren't suffering?"). But then you risk making moral worth too easy (anyone who hates suffering passes).

  ---

  ### The Bottleneck: The "Because" Relation (Non-Accidentality)

  If you want to know which single requirement does the most work in knocking out popular views, it is **The Non-Accidentality Constraint**, specifically the difficulty of defining the **"Because."**

  **Why it's the bottleneck:**
  Every major theory collapses when trying to specify the causal/explanatory link between the *right-making features* and the *motivation* without triggering one of the other failures.

  1.  **Kantianism:** Fails **Inverse Akrasia**. By tying the "because" to the *concept* of duty, it excludes Huck.
  2.  **Naive Consequentialism:** Fails **Non-Accidentality**. It cannot distinguish the right act done for the right reason from the right act done for luck (Shopkeeper).
  3.  **Arpaly-style Externalism:** Risks failing **Counterfactual Sensitivity**. If worth is just "responding to right-making features," how do we distinguish the virtuous agent from the lucky agent who happens to respond to those features but would fail in slightly different circumstances?
  4.  **Markovits-style Counterfactuals:** Risks failing **Psychological Realism**. The demand for sensitivity across possible worlds is so high it makes moral worth vanishingly rare for finite beings.
  5.  **Virtue Ethics:** Risks failing **Non-Fetishism** or **Cognitive Access**. If worth comes from character, does the agent need to know they are virtuous? If yes, exclude children/Huck. If no, how is it distinct from instinct?

  **The Seminar Hook:**
  Tell your students: *"The entire literature on moral worth is just a series of attempts to solve the 'Because' problem. Everyone agrees the action must be right *because* it is right. The moment you try to define 'because,' you either exclude Huck Finn, include the Shopkeeper, or turn the agent into a moral monster. Your job this term is to see who manages this trade-off best."*
