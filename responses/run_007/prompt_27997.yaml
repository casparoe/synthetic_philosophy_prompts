answer: |-
  Your intuition is spot on. In fact, the passage you quoted contains one of the most notorious errors in the history of psychology. While the first part of the summary is a simplification, the final conclusion regarding group differences is logically invalid and is explicitly rejected by the vast majority of behavioral geneticists and psychometricians.

  Here is a breakdown of what a behavioral geneticist would accept, what they would push back on, and why the conclusions in your textbook do not follow.

  ### 1. The Definition: "Proportion of a trait" vs. "Proportion of variance"
  **Textbook Claim:** *"Heritability tells you what proportion of a trait is determined by genes... 60% of a person's IQ is due to their genes."*

  **Behavioral Geneticist's View:** **Incorrect.**
  This is the most common misconception about heritability. Heritability ($h^2$) is a population statistic, not an individual one. It describes the proportion of **variance** (differences) in a trait within a specific population that can be attributed to genetic variance.

  *   **The Error:** You cannot partition an *individual's* score into percentages. It makes no sense to say "60% of *your* IQ is genetic."
  *   **The Analogy:** Consider height. Height is highly heritable (around .80). Does that mean 80% of *your* height is due to genes and 20% due to food? No. Without genes, you have no height. Without food, you have no height. They interact to produce the trait.
  *   **The Correction:** A heritability of .60 means that, in the specific population studied, 60% of the **differences** between people are associated with genetic differences. The other 40% of the **differences** are associated with environmental differences.

  ### 2. The Logical Leap: Within-Group vs. Between-Group
  **Textbook Claim:** *"Because heritability estimates for IQ are quite high... group differences in IQ scores—like the black-white gap—are likely rooted in genetics rather than environment."*

  **Behavioral Geneticist's View:** **Logically Invalid (Lewontin's Fallacy).**
  This is the critical error. High heritability **within** groups tells you absolutely nothing about the cause of differences **between** groups.

  *   **The Logic:** Heritability is calculated by looking at why Person A differs from Person B *within the same environment*. It does not account for systematic environmental differences *between* groups.
  *   **The Classic Analogy (Jensen's Seeds):**
      *   Imagine you have a bag of corn seeds with high genetic variation.
      *   You plant half in Field A (rich soil, perfect sun) and half in Field B (poor soil, drought).
      *   **Within Field A:** The differences in corn height will be highly heritable (because the environment is constant, so the remaining differences must be genetic).
      *   **Within Field B:** The differences in corn height will also be highly heritable.
      *   **Between Fields:** The average height difference between Field A and Field B is **100% environmental** (soil quality), even though heritability *within* each field is 1.0.
  *   **Application to IQ:** Even if IQ is 70% heritable within White populations and 70% heritable within Black populations, the *average difference* between the two groups could be entirely environmental (due to systemic factors like education, nutrition, stereotype threat, socioeconomic status, etc.). The within-group statistic cannot explain the between-group mean difference.

  ### 3. The Stability of Heritability
  **Textbook Claim:** Implies heritability is a fixed property of the trait (e.g., "IQ is .6 heritable").

  **Behavioral Geneticist's View:** **Misleading.**
  Heritability is not a fixed constant like the speed of light. It is specific to the population and environment at that time.

  *   **Environmental Variance:** Heritability is a ratio: $\frac{\text{Genetic Variance}}{\text{Total Variance (Genetic + Environmental)}}$.
  *   **The Implication:** If you equalize the environment (give everyone the same nutrition and schooling), environmental variance drops, and heritability goes **up**. If you introduce massive environmental inequality, environmental variance rises, and heritability can go **down**.
  *   **The Flynn Effect:** IQ scores have risen dramatically across the globe over the last century (too fast for genetics to be the cause). This proves that environmental changes can shift average IQ significantly, regardless of how heritable IQ is within a generation.

  ### Summary: What Would a Behavioral Geneticist Sign Off On?

  If you showed that textbook paragraph to a mainstream behavioral geneticist (like Robert Plomin, Eric Turkheimer, or Richard Nisbett), here is how they would annotate it:

  | Textbook Statement | Verdict | Explanation |
  | :--- | :--- | :--- |
  | "Heritability tells you what proportion of a trait is determined by genes." | **Reject** | It refers to variance in a population, not determination of a trait. |
  | "60% of a person's IQ is due to their genes." | **Reject** | You cannot apply population statistics to an individual's development. |
  | "Genetic differences explain most of the variation in intelligence between people." | **Accept (with caveats)** | Within the specific Western populations studied, genetic variance accounts for a large chunk of the *differences* between individuals. |
  | "Group differences... are likely rooted in genetics rather than environment." | **Strongly Reject** | This is a logical fallacy. Within-group heritability does not predict between-group causes. There is no direct genetic evidence for this claim. |

  ### Why is this in a textbook?
  It is frustrating that this appears in an introductory text. This specific line of reasoning (high within-group heritability $\rightarrow$ genetic between-group differences) was popularized by Arthur Jensen in 1969. It was rigorously debunked by geneticists and statisticians (most famously by Richard Lewontin in 1970) shortly thereafter.

  Modern, rigorous textbooks usually include a "warning box" specifically stating that **heritability does not explain group differences.** The fact that your textbook presents this as a settled conclusion suggests it may be relying on outdated simplifications.

  ### The Bottom Line
  Your "gut feeling" that something was off is correct.
  1.  **Heritability is about populations, not individuals.**
  2.  **Heritability within groups does not explain differences between groups.**

  The textbook is correct that IQ is heritable within populations, but it is scientifically incorrect to use that fact to infer the cause of racial or group gaps. That conclusion requires direct evidence of genetic differences between groups regarding intelligence, which does not currently exist.
