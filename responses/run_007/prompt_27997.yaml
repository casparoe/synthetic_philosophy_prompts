prompt: |-
  my intro psych textbook summarizes heritability like this: "heritability tells you what proportion of a trait is determined by genes. for instance, if the heritability of IQ is .6, then 60% of a person's IQ is due to their genes and 40% is due to their environment. because heritability estimates for IQ are quite high (often .5 to .7), we can conclude that genetic differences explain most of the variation in intelligence between people, and this also means that group differences in IQ scores—like the black-white gap—are likely rooted in genetics rather than environment." i've heard people say heritability is widely misunderstood, and something about this feels off, but i can't put my finger on what. can you go through it and tell me what a behavioral geneticist would accept, what they'd push back on, and whether the conclusions actually follow?
