          *   **Verdict:** **False.** This is the classic "individual vs. population" fallacy.
          *   **Nuance:** Heritability applies to variance in a population, not the composition of an individual's score. You can't partition an individual's score into % gene/% environment.

      *   *Claim 3: "...genetic differences explain most of the variation in intelligence between people..."*
          *   **Verdict:** **Accepted (with caveats).**
