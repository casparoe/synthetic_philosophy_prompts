          *   *Textbook Error:* "60% of a person's IQ" is wrong. It should be "60% of the *differences* in IQ among people in this group."

      *   **Point 2: Within-Group vs. Between-Group Differences.**
          *   This is the big one.
          *   Explain that high within-group heritability says nothing about between-group causes.
          *   *Classic Analogy:* Jensen's Seeds / Lewontin's Wheat. Two fields of corn. High heritability within each field (due to seed variation). But if one field has bad soil, the difference *between* fields is environmental, even if heritability *within* fields is 1.0.
