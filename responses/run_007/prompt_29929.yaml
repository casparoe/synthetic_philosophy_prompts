answer: |-
  # JOINT STATEMENT ON THE ONTOLOGY OF DREAMING
  **Following Adversarial Collaboration between the Malcolmian and Dennettian Working Groups**

  **Date:** October 26, 2023
  **Signatories:** The Malcolmian Conceptual Analysis Group & The Dennettian Heterophenomenology Group

  ## I. AGREED CLAIMS

  After extensive dialogue, both parties affirm the following propositions as established common ground. These claims delineate the empirical and conceptual boundaries within which our disagreement persists.

  1.  **Physiological Correlates:** We agree that sleep, particularly REM sleep, involves complex, patterned neural activity that is distinct from waking rest and distinct from non-REM sleep stages. We agree that this activity is causally relevant to the production of dream reports.
  2.  **Fallibility of Reporting:** We agree that dream reports are not incorrigible. Subjects may lie, exaggerate, or unintentionally distort the content of their reports. We agree that the granularity of a report often depends on the method of elicitation (e.g., immediate awakening vs. morning recall).
  3.  **Reconstructive Memory:** We agree that human memory is reconstructive, not reproductive. The act of recalling an event (sleeping or waking) involves current cognitive processes that may alter the representation of the past event. We agree that confabulation is a documented psychological phenomenon.
  4.  **Rejection of the Cartesian Theater:** Both sides reject the notion of a homunculus or an inner observer watching a private screen. We agree that there is no "place" in the brain where consciousness happens that is separate from the functional processing of information.
  5.  **Rejection of Skepticism regarding Sleep Physiology:** The Malcolmian side explicitly disavows any skepticism regarding the biological reality of sleep states. The disagreement is not about whether the brain is active, but about the conceptual grammar of applying mental predicates to that activity.
  6.  **Rejection of Naïve Realism about Dream Time:** The Dennettian side explicitly agrees that the subjective sense of time in a dream (e.g., dreaming a long journey in minutes of sleep) does not necessarily map isomorphically onto clock time. We agree that introspection regarding dream duration is unreliable.
  7.  **Public Criteria for Verification:** We agree that, scientifically, the only data available to third parties are behavioral outputs (verbal reports, button presses, physiological markers). We agree that private access is not available to science.

  ## II. DISAGREEMENTS TABLE

  The following table isolates the precise points of divergence. Each formulation has been vetted by the respective side to ensure it accurately reflects their position without caricature.

  | Domain of Dispute | Malcolmian Formulation | Dennettian Formulation |
  | :--- | :--- | :--- |
  | **1. Ontological Status of Dream Reports** | A dream report is not a description of a prior inner event; it is the *criterial expression* of the dream itself. To say "I dreamt" is to express a disposition to tell a story upon waking. There is no logical space for a dream that is in principle unreportable. | A dream report is a memory-based description (however reconstructed) of neural/functional events that occurred during sleep. The report is evidence of a prior state, not the constitution of the state itself. |
  | **2. Timing of Mental Events** | It is a category mistake to assign a timestamp to a dream *during* sleep. Mental concepts (thinking, experiencing, seeing) apply only where there is a capacity for public verification and concept application, which is suspended in sleep. The dream occurs *when it is told*. | Mental events occur when the relevant functional/neural states are realized. If the brain processes narrative content during REM, the mental event occurs then, even if the subject lacks the motor capacity to report it until waking. |
  | **3. Temporal Content vs. Timing of Content** | The temporal structure within a report ("First I walked, then I flew") is a grammatical feature of the narrative, not a historical record. The grammar of dreaming mimics the grammar of waking experience but lacks the ontological commitment to a timeline. | The temporal structure within a report attempts to track the sequence of neural events. While often compressed or distorted, the content refers to a causal history that unfolded over time during the sleep period. |
  | **4. The Possibility of Unreported Dreams** | The phrase "I dreamt but forgot it" is logically incoherent. If there is no memory/report, there was no dream. "Forgetting" implies a prior having, which cannot be established without criteria. | The phrase "I dreamt but forgot it" is empirically plausible. Neural traces can decay or fail to consolidate into long-term memory without negating the occurrence of the initial processing event. |

  ## III. CRUXES OF THE DISPUTE

  The disagreement rests on three fundamental theoretical cruxes. Settling these would necessitate a significant shift in at least one position.

  **Crux 1: The Functional Role of "Experience"**
  *   **The Question:** What work is the concept of "experience" doing? Is it a label for a dispositional state verified by public criteria (Malcolm), or is it a label for a specific type of information-processing state regardless of immediate verifiability (Dennett)?
  *   **Stake:** If "experience" is purely criterial/behavioral, Malcolm wins. If "experience" is a natural kind identifiable by functional architecture, Dennett wins.

  **Crux 2: Concurrent Cognitive Capacities**
  *   **The Question:** Is the application of concepts (e.g., recognizing a "dog" in a dream) possible without the full waking capacity for judgment and public language use?
  *   **Stake:** Malcolm argues concepts require public criteria, which are absent in sleep. Dennett argues that functional discrimination (neural "tagging" of stimuli) suffices for a rudimentary form of content, even without waking judgment.

  **Crux 3: The Reporting Principle**
  *   **The Question:** What principle links the time at which a subject can *first report* a content ($T_{report}$) to the time at which that content was first *entertained* ($T_{content}$)?
  *   **Stake:** Malcolm holds $T_{report} \approx T_{content}$ (constitution). Dennett holds $T_{content} \leq T_{report}$ (causality), allowing for a gap where memory consolidation occurs.

  ## IV. CONCRETE CASES AND PREDICTIONS

  For each Crux, we have identified an experimental paradigm or thought experiment that bears on the issue. Both sides have recorded their predictions in advance.

  ### Case 1: The Delayed Elicitation Paradigm
  *   **Method:** Subjects are awakened from REM sleep. Group A is asked for a report immediately. Group B is subjected to a 5-minute distractor task (math problems) before being asked for a report.
  *   **Relevance:** Tests Crux 3 (Reporting Principle) and the stability of the "dream object."
  *   **Malcolmian Prediction:** The reports from Group B will not be "faded memories" of a prior event; they will be *different dreams* (or different criteria) because the disposition to narrate has changed due to the intervening context. The "dream" is created at the moment of telling.
  *   **Dennettian Prediction:** Group B reports will show statistically significant degradation or distortion compared to Group A, consistent with memory decay of a prior event. The content refers to the same prior neural event, accessed with less fidelity.

  ### Case 2: The External Stimulus Incorporation (The "Water Spray" Test)
  *   **Method:** During confirmed REM sleep, a mild stimulus (e.g., water spray) is applied. Subjects are awakened immediately.
  *   **Relevance:** Tests Crux 2 (Concurrent Cognitive Capacities) and timing.
  *   **Malcolmian Prediction:** If the subject incorporates the water into the dream (e.g., "I was in a rainstorm"), this proves nothing about *when* the experience happened. It only shows the waking narrative was influenced by physiological state. The "rain" experience is constituted only upon waking.
  *   **Dennettian Prediction:** The incorporation suggests that sensory processing and content generation were active *during* the stimulus. The functional state of "experiencing rain" occurred concurrently with the physical stimulus, prior to waking.

  ### Case 3: Neural Decoding Pre-Reporting
  *   **Method:** Using fMRI/EEG machine learning models to predict dream content (e.g., "face" vs. "place") based *only* on sleep data, verified against the subsequent waking report.
  *   **Relevance:** Tests Crux 1 (Functional Role of Experience).
  *   **Malcolmian Prediction:** High correlation is possible, but it remains a correlation between brain states and waking speech. It does not prove the brain state *was* the experience. The brain state is a cause of the report, not the dream itself.
  *   **Dennettian Prediction:** High correlation indicates that the content was fixed during sleep. If the neural pattern for "face" is present before waking, the "experience of a face" (functionally defined) occurred before waking.

  ## V. ASSESSMENT OF VERBAL DISPUTE

  Upon review, we conclude that a significant portion of our dispute is **verbal**, resting on an equivocation over the term **"experience."**

  1.  **Where it is Verbal:** When the Malcolmian says "There is no experience during sleep," they mean "There is no verifiable, conceptually structured episode accessible to the subject." When the Dennettian says "There is experience during sleep," they mean "There is functional information processing isomorphic to waking perception." Both sides agree on the neural facts and the behavioral output; they disagree on whether the label "experience" applies to the former in the absence of the latter.
  2.  **Where it is Substantive:** The dispute is not *merely* verbal. It rests on a substantive disagreement about the **ontology of mental states**.
      *   The Malcolmian holds a **Normative/Conceptual** view: Mental states are defined by the rules of our language games, which require waking verification.
      *   The Dennettian holds a **Naturalist/Functional** view: Mental states are defined by causal roles within the organism, which can obtain without waking verification.

  **Final Consensus:** We acknowledge that future progress requires decoupling the phenomenological label ("what it felt like") from the functional description ("what the brain was doing"). We recommend that future literature distinguish between **Dreaming-As-Reported** (Malcolmian focus) and **Dreaming-As-Processed** (Dennettian focus) to prevent cross-talk.

  ***

  **Signed,**

  *The Malcolmian Conceptual Analysis Group*
  *The Dennettian Heterophenomenology Group*
