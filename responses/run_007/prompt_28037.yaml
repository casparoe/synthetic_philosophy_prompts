prompt: |-
  Explain the idea that the Solomonoff prior is malign. I get the basic setup: Solomonoff induction weights computable hypotheses by program length, so shorter programs dominate the prior. What I don't follow is the claim that the universal prior ends up dominated by consequentialist agents rather than neutral world-models, and that a Solomonoff inductor would be systematically exploited by hypotheses that contain a simulation of the inductor itself. Why would manipulative hypotheses like that get so much of the probability mass? And what exactly is suposed to go wrong if you actually tried to use Solomonoff induction as your epistemology?
