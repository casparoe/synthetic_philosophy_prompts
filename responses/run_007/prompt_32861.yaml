      *   **Expected Value:** $E[X] = \sum_{n=1}^\infty \frac{(-1)^{n-1} 2^n}{n} \cdot \frac{1}{2^n} = \sum_{n=1}^\infty \frac{(-1)^{n-1}}{n} = \ln(2)$.
      *   **The Catch:** The series $\sum \frac{(-1)^{n-1}}{n}$ is *conditionally* convergent, not absolutely convergent. By Riemann's Rearrangement Theorem, reordering terms changes the sum. In decision theory, the "order" corresponds to how outcomes are indexed or aggregated, which shouldn't matter for a rational agent, yet the math says it does.

  3.  **Translation to Quant Vocabulary:**
      *   **Underlying:** A sequence of independent Bernoulli trials (coin flips).
