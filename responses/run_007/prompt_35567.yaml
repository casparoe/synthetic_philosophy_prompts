prompt: |-
  ok so I'm an information theorist by training -- did my PhD in a comms lab, I think natively in terms of channel capacity, mutual information, noise, encoding/decoding strategies, rate-distortion, all that. I've been reading rationalist blogs for years and everyone's always on about costly signaling theory and the handicap principle (Zahavi's peacock, Grafen's formalization, etc.), and I get the basic idea -- honest signals are possible when the signal is expensive enough that low-quality types can't afford to fake it, so the signal carries information about underlying quality.

  But every time I try to formalize this in my head, I just end up thinking: well, this is a noisy channel where the cost function plays the role of the channel's capacity constraint, and the equilibrium is just the rate-distortion optimal encoding. And then I worry I'm flattening something.

  So here's what I want: restate the handicap principle and the broader costly signaling framework in the vocabulary of information theory -- channel capacity, mutual information, encoding/decoding, rate-distortion, the works -- as faithfully as you can. Then give me a residue report. Which claims translate cleanly? Which ones had to be bent or fudged to fit? And which parts of the biological theory (if any) have no information-theoretic expression at all? I want to know whether my intuition that this is all just Shannon plus a budget constraint is right, or whether the biologists are tracking something that my framework litterally cannot say.
