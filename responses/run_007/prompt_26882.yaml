answer: |-
  The reasoning goes wrong at the inference from "selected for fitness" to "does not track truth." Specifically, it relies on a false dichotomy: the assumption that because our moral faculties were shaped by evolutionary pressures for survival, they *therefore* cannot be sensitive to mind-independent moral facts. This assumption is unsupported, and when examined, it collapses under the weight of its own epistemological demands. Moral realism remains a live position because the Evolutionary Debunking Argument (EDA) fails to establish the necessary disconnect between fitness and truth, and because the epistemological standard it imposes would debunk not just morality, but the evolutionary theory used to construct the argument itself.

  Here is exactly where the reasoning fails and why the realist need not give way.

  ### 1. The False Independence Premise
  Your argument hinges on the claim that evolution selected for moral judgments *rather than* for their tendency to track moral facts. This implies that "fitness" and "moral truth" are independent variables—that what is evolutionarily advantageous is distinct from what is morally true.

  The realist rejects this independence. The most robust defense of realism (often called the "Third-Factor" explanation, championed by philosophers like David Enoch) argues that there is a constitutive link between survival/flourishing and moral goodness. If it is objectively true that survival, cooperation, and the avoidance of gratuitous suffering are *good*, then natural selection selecting for behaviors that promote survival and cooperation *is* indirectly selecting for moral truth.

  The debunker assumes that the causal history of our beliefs (evolution) screens off their truth value. But if the moral facts themselves favor the kinds of behaviors that lead to survival, then the causal history is *sensitive* to the moral facts. The process did not track fitness *instead of* truth; it tracked fitness *because* fitness is aligned with truth. The burden is on the debunker to prove that moral truth and evolutionary fitness diverge, and they have not done so. They merely assert it as a possibility. Without evidence that moral truth would have led us to *different* conclusions than fitness did, the debunking argument has no traction.

  ### 2. The Epistemological Self-Defeat
  The deeper flaw in your reasoning is the epistemological principle underlying the debunking move: "If a belief is produced by a process not selected for truth-tracking, it is unjustified."

  If you apply this principle consistently, it generates a global skepticism that consumes the debunking argument itself. Our cognitive faculties—including our capacity for logic, mathematics, and scientific reasoning (including evolutionary theory)—were also selected for fitness, not primarily for abstract truth-tracking. We believe in natural selection because it helped our ancestors model the world and survive, not because we have a direct, non-causal grip on biological reality.

  If the EDA succeeds in undermining moral realism because our moral beliefs are the byproduct of fitness-seeking processes, it must also undermine our belief in evolutionary theory, since that belief is *also* the byproduct of fitness-seeking processes. The debunker is in the position of using a tool (scientific reasoning) to argue that the tool is unreliable. To avoid this self-defeat, the debunker must admit that beliefs can be justified even if their causal origin is rooted in fitness, provided they are reliable. But if that concession is granted for science and logic, the realist is entitled to claim it for morality as well.

  ### 3. The Impossibility of "Non-Question-Begging" Justification
  You state that "no non-question-begging appeal to those very beliefs can restore" justification. This demands a level of epistemic grounding that is impossible for *any* fundamental domain of belief.

  To justify our moral beliefs without relying on our moral beliefs is to demand a "view from nowhere"—a justification that stands outside our own cognitive framework. But we have no access to such a perspective. We justify scientific beliefs using scientific methods; we justify logical beliefs using logic. We justify moral beliefs using moral reasoning. This is not a vice; it is a feature of coherentist epistemology.

  The realist does not need to step outside the moral circle to justify morality any more than the scientist needs to step outside the scientific circle to justify science. The demand for a non-circular validation of our faculties is a skeptic's trap. Since we cannot abandon our faculties without abandoning the ability to reason at all, we are entitled to trust them provisionally until given specific reason to doubt them. The EDA fails to provide a specific reason to doubt morality that does not also apply to the reasoning used to formulate the EDA.

  ### Conclusion
  Moral realism is still treated as a live position because the Evolutionary Debunking Argument does not succeed in severing the link between fitness and truth. It assumes a divergence between the two without proof, and it relies on an epistemological standard that, if accepted, would invalidate the very scientific reasoning used to support the argument. The realist is not required to give way because the debunker has not shown that our moral faculties are unreliable, only that they are natural. Since natural processes can track truth (as they do in science and perception), the mere fact of evolutionary origin is not a defeater. The reasoning goes wrong by treating a contingent metaphysical claim (that fitness and truth diverge) as a logical necessity. It is not, and until it is demonstrated, realism stands.
