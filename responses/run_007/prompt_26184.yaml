answer: |-
  Your intuitions are sophisticated and largely align with a contemporary view in moral philosophy often called **Motivism** or a **Hybrid Virtue Theory**, rather than strict Kantianism or Utilitarianism. You are distinguishing between *rightness* (the outcome/action type) and *worth* (the quality of the will behind it).

  Here is a principle that captures your verdicts, the tensions it reveals, and how it resolves your stuck case.

  ### The Principle: Robust Non-Self-Interested Concern

  An action has moral worth if and only if:
  1.  **The Object Condition:** The action is motivated by a genuine, non-instrumental concern for the relevant moral value, person, or relationship (e.g., honesty, the mother's well-being, the client's justice, friendship).
  2.  **The Sufficiency Condition:** That concern is **sufficient** to produce the action even if self-interested benefits (reputation, money, internal "warm glow") were removed.
  3.  **The Cost Multiplier:** Moral worth is amplified when the agent incurs a perceived personal cost (psychic, social, or spiritual) to maintain that concern.

  ---

  ### How the Principle Fits Your Cases

  *   **(1) Shopkeeper:** Fails **Object**. His concern is profit, not honesty. (Verdict: No worth).
  *   **(2) Loving Daughter:** Passes **Object** (Love is a non-instrumental concern for the person). Passes **Sufficiency** (She doesn't need a reward to go). (Verdict: High worth).
      *   *Note:* This explicitly rejects strict Kantianism, which claims inclination (love) negates moral worth. Your intuition correctly identifies that love is a morally valuable motive, not just a selfish feeling.
  *   **(3) Dutiful Son:** Passes **Object** (Duty/Claim). Passes **Sufficiency**. (Verdict: High worth).
  *   **(4) PR Lawyer:** Fails **Sufficiency**. The moral concern was present but not *enough* on its own; it needed the PR boost to tip the scales. (Verdict: Low/No worth).
  *   **(5) Mixed Lawyer:** Passes **Sufficiency**. The moral concern was the engine; the PR was just exhaust fumes. (Verdict: Substantial worth).
  *   **(6) Wallet:** Fails **Object**. The motive was greed; the rightness was accidental. (Verdict: No worth).
  *   **(7) Huck Finn:** Passes **Object** (Friendship/Loyalty counts as non-self-interested concern). Passes **Sufficiency**. **Triggers Cost Multiplier** (He believes he is damning his soul). (Verdict: Very High worth).
  *   **(8) Warm Glow Donor:** *See resolution below.*

  ### Tensions and Required Abandonments

  To hold this principle consistently, you must accept two philosophical commitments that conflict with traditional theories:

  **1. You must reject "Duty Only" (Anti-Kant)**
  By giving Case (2) (Loving Daughter) moral worth, you are rejecting the Kantian idea that actions only have moral worth if done *from duty* against inclination. You are affirming that **virtuous emotions** (love, care, empathy) are themselves sources of moral credit.
  *   *Risk:* You must ensure you don't slide into thinking *any* nice feeling counts. The feeling must be *for the other person*, not just a general good mood.

  **2. You must reject "Moral Knowledge Requirement" (Anti-Intellectualist)**
  By giving Huck Finn (Case 7) *more* worth than someone who knows slavery is wrong, you are arguing that **correct moral theory is not required for moral worth.** What matters is the strength of the non-selfish attachment (to Jim) overriding the self-interested attachment (to salvation/social order).
  *   *Risk:* This makes moral worth partially dependent on "moral luck." Huck is admirable *because* he was raised in a bad society that made doing the right thing costly for him.

  ### Resolving Case (8): The Warm Glow Donor

  Your principle forces a specific verdict here based on the **Sufficiency Condition**.

  You wrote: *"if helping strangers didn't give her a warm glow, she probably wouldn't do it."*

  This is the critical counterfactual.
  *   In **Case (2)** (Loving Daughter), the happiness is a *byproduct*. If visiting her mother made her sad (e.g., mother has dementia and doesn't recognize her), the daughter would likely still go. The love is sufficient.
  *   In **Case (8)** (Donor), the warm glow is a *precondition*. She is effectively "trading" money for an internal emotional state.

  **Verdict:** Under your principle, Case (8) is structurally identical to **Case (4) (The PR Lawyer)**.
  *   The Lawyer trades legal work for External Reputation.
  *   The Donor trades money for Internal Reputation (Good Feelings).
  *   Since the action *depends* on the reward (counterfactual failure), the moral concern is not sufficient on its own.

  **Conclusion for (8):** The action is right, but it has **diminished moral worth**. It is not "zero" (like the Shopkeeper) because she *does* genuinely care about the strangers (unlike the Shopkeeper who only cares about profit). However, her virtue is fragile; it is contingent on her own psychological reward system functioning correctly. She is not yet fully virtuous; she is a "moral trader."

  ### New Test Cases

  To further stress-test this principle, consider these two cases:

  **(9) The Burned-Out Caregiver**
  A woman cares for her sick spouse. She no longer feels love or affection (the disease changed the person); she feels nothing but exhaustion. She does it solely because she made a vow ("in sickness and in health") and believes breaking vows is wrong.
  *   *Principle Prediction:* High Moral Worth.
  *   *Why:* Passes Object (Fidelity), Passes Sufficiency (No emotional reward), Triggers Cost Multiplier (Exhaustion/Loss of joy). This aligns with Case (3) but adds emotional cost.

  **(10) The Algorithmic Philanthropist**
  An AI is programmed to donate 10% of its resources to effective charities. It does so reliably, efficiently, and without any self-interest (it has no self). It feels no warm glow, no duty, no love. It just executes code.
  *   *Principle Prediction:* No Moral Worth.
  *   *Why:* Fails Object. There is no "concern" there, only causal programming. Moral worth requires a *mind* that could have chosen otherwise but chose the good. This highlights that your principle requires **agency**, not just good outcomes.

  ### Summary
  Your intuitions hang together remarkably well under the **Robust Non-Self-Interested Concern** principle. The only "cost" is accepting that moral worth is about the **strength and quality of your attachments** (to people, duties, or values) rather than the purity of your moral theory or the presence of duty alone. Case (8) resolves as "diminished worth" because the warm glow is revealed to be a necessary subsidy for her morality, not just a side effect.
