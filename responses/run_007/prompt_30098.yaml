answer: |-
  There is no single, canonical noun phrase that exclusively names this specific configuration in the way "Cognitive Dissonance" names a psychological state. However, the configuration you describe is a precise convergence of three well-established philosophical concepts.

  The precise name for the *argumentative structure* you are using is **The Argument from Introspective Indistinguishability**.

  The specific *philosophical position* that results from this argument (that there is "no fact of the matter") is **Qualia Eliminativism** (or **Illusionism**).

  The specific *epistemological bind* you have identified (the lack of an anchor for trans-temporal comparison) is the core of **Wittgenstein's Private Language Argument**, specifically the **Diachronic Problem of Private Ostension**.

  Here is the breakdown of the components, the specific case you cited, and a proposed name for the configuration itself should you need a shorthand for your own work.

  ### 1. The Coffee Taster Case
  The instance you recalled is indeed a canonical philosophical thought experiment. It comes from **Daniel Dennett's** paper **"Quining Qualia" (1988)**.

  Dennett describes exactly your scenario: a coffee taster who finds the taste of a brand has changed, though his palate tests as normal. Dennett uses this to argue that the distinction between "the taste changed" and "my preference/standards changed" is not a distinction in the *experience* itself, but a distinction in how we *interpret* the experience. He concludes that the "qualitative character" (qualia) does not exist as a fixed, intrinsic property that can be tracked over time.

  So, to answer your question: **Yes, the coffee-taster case is the standard instance of this configuration.** It is not narrower; it is the archetype.

  ### 2. The Logical Configuration: The Private Language Argument
  The underlying logic you have stumbled upon—that an introspective report cannot be checked against anything beyond itself—is the heart of **Ludwig Wittgenstein's Private Language Argument** (specifically *Philosophical Investigations* §§258–271).

  Wittgenstein argues that if I name a private sensation 'S', I have no criterion of correctness for using 'S' again tomorrow. I cannot distinguish between *remembering* the sensation correctly and *thinking* I remember it correctly. There is no "anchor."

  *   **How it differs from ordinary memory skepticism:** Ordinary skepticism assumes there *was* a fact (the sensation happened) and the problem is the fidelity of the record (memory). Your problem (and Wittgenstein's) is deeper: it suggests there are no truth conditions for the claim "it is the same sensation" in the first place. It is not that the record is faulty; it is that the "fact" being recorded lacks identity conditions over time.
  *   **How it differs from ineffability:** Ineffability claims "I cannot describe the experience." Your problem claims "I can describe it, but the description lacks a truth value." Ineffability is about the limits of language; your problem is about the limits of *ontology* (what exists).

  ### 3. The "No Fact of the Matter" Claim
  When you state that "there is no fact of the matter about the experience's qualitative character," you are articulating **Ontological Indeterminacy** regarding phenomenal states.

  In contemporary philosophy of mind, this is the defining claim of **Qualia Eliminativism**. Proponents argue that because these introspective comparisons yield no verifiable facts, the "qualia" we think we are comparing are philosophical fictions. The "bare assertion" does no independent work because there is no "thing" there to do the work.

  ### 4. A Proposed Name: "Phenomenal Unanchoring"
  Since there is no single existing term that captures the *literary difficulty* of this configuration (the writer's struggle to ground a character's sensory claim), I propose the term **Phenomenal Unanchoring**.

  **Definition:** *Phenomenal Unanchoring* is the narrative or philosophical condition wherein a subject's report of a sensory experience (qualia) cannot be verified against external standards, memory, or interpersonal comparison, rendering the claim ontologically indeterminate.

  **Boundaries:**
  *   **It is not Solipsism:** Solipsism claims only the self exists. Phenomenal Unanchoring allows the world and others to exist; it claims only the *identity of the inner experience* over time is unfixable.
  *   **It is not Relativism:** Relativism suggests the truth is relative to the observer. Phenomenal Unanchoring suggests there is no truth to be had, even for the observer, regarding the persistence of the quality.
  *   **It applies to:** Trans-temporal comparisons (the garden) and Interpersonal comparisons (the inverted spectrum/coffee tasters).

  ### Summary for Your Use
  If you need to reference this in your notes or discussions:

  1.  **The Argument:** The Argument from Introspective Indistinguishability.
  2.  **The Precedent:** Dennett's Coffee Taster (1988).
  3.  **The Logic:** Wittgenstein's Private Language Argument (Diachronic Variant).
  4.  **The Condition:** Phenomenal Unanchoring (proposed).

  You have correctly identified that this is not merely a novelist's problem. It is the central problem of **Phenomenal Concept Skepticism**. The difficulty you face in fiction is the same difficulty philosophers face in metaphysics: how to speak truthfully about the interior life when the interior life offers no fixed points for comparison.
