  Subject: Seminar Handout for Next Week: Mapping the Logical Space of Interpersonal Comparisons

  Dear Students,

  For our session next week on interpersonal utility comparisons, I have drafted a conceptual map to help us navigate the competing positions we will be discussing. I want you to think of this not as a history of ideas but as a decision tree built from the logical space of the problem itself. We begin at the root with a concrete question you can answer without knowing any technical labels. Imagine a starving person and a millionaire. Can you say, as a factual matter and not just a value judgement, that the starving person is worse off than the millionaire? If your answer is a firm no, because you believe science must be value-free and utility is strictly ordinal and unique to each individual, then you land on the first leaf, which is Robbinsian ordinalism. This position holds that interpersonal comparisons are meaningless pseudo-statements because there is no common unit of measurement between minds.

  If you answer yes to that initial question, believing such comparisons are meaningful, we move to the next branch which asks about the currency of well-being. Is what you are comparing a felt experience, an achieved functioning, or a preference satisfaction? If you believe the only thing that matters is the quality of conscious experience, whether measured by a classical hedonimeter or modern neural imaging of reward centers, you arrive at the hedonistic or neural-currency view. This leaf assumes that mental states are cardinal and fully comparable across persons because the biological or phenomenological substrate is shared.

  If instead you believe well-being is about what people are actually able to do and be, rather than how they feel or what they want, you follow the branch toward objective functionings. Here we encounter a split based on precision. If you argue that we can only rank people's advantage partially or ordinally without precise units, you land on the Sen-style partial comparability grounded in capabilities. However, if you argue that we should compare the all-purpose means people have to pursue their own ends, such as income and liberty, rather than the ends themselves, you land on a Rawlsian primary goods view. I must flag that these last two leaves are not cleanly separated by the tree, as in practice the distinction between means and ends often blurs, and both rely on an objective list that avoids subjective mental states.

  Returning to the currency question, if you believe well-being is about preference satisfaction, we must ask whose preferences count. If you think we should look at the actual choices people make, often calibrated by their willingness to pay or revealed preference in markets, you arrive at the revealed-preference or willingness-to-pay comparability leaf. This position often implicitly assumes cardinality through income but relies on observed behavior rather than introspection. Alternatively, if you believe we should compare what an impartial observer would prefer if they had an equal chance of being any of the people involved, you land on the Harsanyi-style extended or empathetic preferences leaf. This approach cardinalizes utility through the rationality constraints of the impartial observer.

  There is one logical combination that this tree generates but which remains largely uninhabited by serious theorists. If you answer that comparisons are meaningful, that the currency is preference satisfaction, but that the comparisons are only ordinal and not cardinal, you land on a leaf of ordinal interpersonal comparability of preferences. Almost no one occupies this position because it is generally considered incoherent or unattractive for policy purposes; without cardinality or at least unit comparability, you cannot make trade-offs to resolve conflicts between individuals, causing the view to collapse back into Robbinsian ordinalism or push forward toward Harsanyi-style cardinality. I hope this map helps you locate your own intuitions before we debate the merits of each position in class.

  Best regards,

  Professor
