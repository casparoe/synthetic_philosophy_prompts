answer: |-
  You have put your finger on one of the most active fault lines in contemporary epistemology. You are observing the tension between the **Principle of Epistemic Closure** and the problem of **Logical Omniscience**, filtered through the specific requirement of **Competent Deduction**.

  There isn't one single proper noun for the "selective, obviousness-gated" version (like "The Gettier Problem"), but there is a standard vocabulary for describing exactly what is happening. If you want to write about this precisely, you need to distinguish between two different phenomena that your classmates are conflating: **cognitive limitations** (the Peano case) and **warrant transmission failure** (the Brain-in-a-Vat case).

  Here is the breakdown of the terminology, the coherence of the position, and where the boundaries lie.

  ### 1. The Name of the Principle
  The standard principle your classmates are intuitively modifying is **Closure Under Known Entailment**:
  > If $S$ knows $P$, and $S$ knows that $P$ entails $Q$, then $S$ knows $Q$.

  The "selective" version you are describing is standardly referred to as **Closure Under Competent Deduction**.
  > If $S$ knows $P$, and $S$ knows that $P$ entails $Q$, and **$S$ competently deduces $Q$ from $P$**, then $S$ knows $Q$.

  The "selector" you noticed (obviousness, length, surveyability) is the debate over what counts as **competent deduction**.
  *   **The Label:** In your paper, you can refer to this as **"Restricted Closure"** or **"Feasible Closure."** However, the most academically precise way to describe it is **"Closure subject to a Competent Deduction constraint."**
  *   **The Underlying Problem:** The reason this restriction exists is to avoid **Logical Omniscience**. If closure were unrestricted, anyone who knew the Peano axioms would automatically know every theorem provable from them (including Fermat's Last Theorem before it was proved). Since humans aren't logically omniscient, epistemologists add the "competent deduction" clause to save the principle from absurdity.

  ### 2. Distinguishing the Two Cases
  Your classmates are treating the "Peano" case and the "Brain-in-a-Vat" (BIV) case as the same phenomenon, but epistemologists usually treat them differently.

  **Case A: The Peano Axioms (Cognitive Limitation)**
  *   **The Intuition:** "I know the axioms, I grant the theorem follows, but I haven't done the math, so I don't *know* the theorem."
  *   **The Diagnosis:** This is a distinction between **Implicit** and **Explicit Knowledge**.
      *   You have *implicit* knowledge of the theorem (it is contained in what you know).
      *   You lack *explicit* knowledge (you haven't performed the cognitive act to unlock it).
  *   **The Boundary:** The boundary here is **cognitive feasibility**. The "selectivity" is based on computational complexity. If the derivation is 5 steps, it's competent deduction. If it's 5,000 steps, it requires a proof, not just deduction.
  *   **Coherence:** This is generally considered coherent. It acknowledges human bounded rationality.

  **Case B: Hands $\rightarrow$ Not a Brain-in-a-Vat (Warrant Transmission)**
  *   **The Intuition:** "I know I have hands, I grant hands entail ~BIV, but I don't know ~BIV."
  *   **The Diagnosis:** This is not just about cognitive load; the deduction is actually quite short. This is usually analyzed as **Transmission Failure** (a term coined by **Crispin Wright**).
      *   Wright argues that while the *entailment* holds, the **warrant** (justification) for believing you have hands *presupposes* that you are not a BIV. Therefore, you cannot use your hands to *prove* you aren't a BIV; that would be circular.
      *   **Dretske** and **Nozick** (whom you mentioned) handle this by denying Closure entirely (Relevant Alternatives / Tracking Theory).
      *   **Contextualists** (like **Keith DeRose**) argue that mentioning the BIV raises the "epistemic standards," making it so you no longer know you have hands in that context.
  *   **Coherence:** Your classmates are likely sensing Transmission Failure without knowing the term. They feel the deduction is "too weird" because the conclusion (~BIV) is a **presupposition** of the premise (Hands), not a new discovery.

  ### 3. Is the Selectivity Coherent?
  You asked if this "obviousness-gated" selectivity is coherent or just an unstable compromise.

  **The Argument for Coherence:**
  It is coherent if framed as a **Basing Requirement**. To know $Q$ via deduction, your belief in $Q$ must be *based* on the deduction from $P$.
  *   In the "Tuesday" case, you can easily base your belief on the deduction.
  *   In the "Peano" case, you cannot base your belief on the deduction because you can't hold all the steps in your head.
  *   In the "BIV" case, you cannot base your belief on the deduction because the warrant doesn't transmit (Wright).
  On this view, the "selectivity" isn't arbitrary; it tracks whether a **proper basing relation** is psychologically and structurally possible.

  **The Argument Against Coherence (The Sorites Problem):**
  The main objection is the **Sorites Paradox** (the Heap).
  *   If a 1-step deduction yields knowledge, and a 2-step deduction yields knowledge, at what number of steps does knowledge vanish?
  *   If the boundary is just "obviousness," that is subjective. What is obvious to a math major isn't obvious to a freshman.
  *   If knowledge depends on how "hard" the deduction is, then knowledge becomes relative to cognitive processing speed, which seems to confuse *psychology* with *epistemology*.
  *   **Timothy Williamson** and **John Hawthorne** have defended robust Closure principles, arguing that we should bite the bullet: if you truly know the axioms, you *do* know the theorem, you just don't know *that you know it* (you lack higher-order knowledge), or you lack the ability to *use* that knowledge.

  ### 4. How to Frame This in Your Paper
  If you want to avoid gesturing, use this structure:

  1.  **Identify the Principle:** State that your classmates are accepting **Closure Under Competent Deduction** but rejecting **Unrestricted Closure** (to avoid Logical Omniscience).
  2.  **Name the Constraint:** Call the selector the **Feasibility Constraint** or the **Surveyability Condition**. (The term "surveyable" is often used in philosophy of math for proofs we can actually grasp).
  3.  **Distinguish the Cases:**
      *   For the Math case, argue this is about **Explicit vs. Implicit Knowledge**.
      *   For the BIV case, argue this is likely about **Transmission of Warrant** (cite Crispin Wright) or **Contextual Shifts** (cite Keith DeRose), rather than just "length of derivation."
  4.  **Critique the Boundary:** Point out that while the distinction saves us from Logical Omniscience, it introduces a **Sorites Vulnerability**. There is no non-arbitrary line between a "long but competent" deduction and a "too long" deduction.

  ### Summary of Terms to Use
  *   **Principle of Epistemic Closure:** The general rule.
  *   **Closure Under Competent Deduction:** The version your classmates accept.
  *   **Logical Omniscience:** The problem they are trying to avoid.
  *   **Implicit vs. Explicit Knowledge:** The solution for the math case.
  *   **Transmission of Warrant / Transmission Failure:** The solution for the skepticism (BIV) case.
  *   **Basing Relation:** The requirement that the belief in $Q$ must be causally/rationally held *because* of $P$.

  **Recommendation:**
  Don't try to find a single proper noun name like "The Smith Principle." Instead, characterize it descriptively: *"A restricted closure principle gated by feasible competent deduction."* This shows you understand that the "selectivity" isn't a bug, but a feature required to make closure compatible with human cognitive limits.

  If you need a specific citation for the "obviousness" constraint, look into **Feldman's** work on **Epistemic Obligations** (what we are required to deduce) or **Christensen's** work on **Logical Ignorance**. But for a class paper, distinguishing between **Implicit Knowledge** (Math) and **Transmission Failure** (Skepticism) will get you the most credit.
