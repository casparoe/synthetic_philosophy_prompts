          *   *Detail:* If you reject Independence (Point 1) to allow Allais preferences, you open yourself up to dynamic inconsistency, which *can* lead to money pumps (specifically "dynamic money pumps" involving sequential choices).
          *   *Detail:* If you allow Ambiguity Aversion (Point 2), you violate the Sure Thing Principle. This can also lead to Dutch Book scenarios depending on how beliefs are updated.
