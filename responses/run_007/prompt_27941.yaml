          *   *Resolution:* There are *non-expected utility* theories (like Rank-Dependent Utility or Maxmin Expected Utility) that accommodate 1 & 2 *without* being money-pumpable *if* formulated carefully (e.g., by restricting dynamic choice rules). But simply saying "Independence is false" + "No money pumps" requires a sophisticated defense. The character needs to know *how* to avoid the pump while keeping the preferences.

