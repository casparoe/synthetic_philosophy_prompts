prompt: |-
  So I've been in this philosophy of mind reading group for a few months now — we started with some Dennett and worked our way into pain and consciousness — and two of our members, Mira and Jonah, have been going at it for weeks about pain asymbolia and what it tells us about the badness of pain. Mira's view is basically that pain asymbolia is a smoking gun: the fact that someone can report feeling pain but not mind it shows that the badness isn't intrinsic to the sensation itself, that it's a separate evaluative or conative attitude we take toward the sensation. Jonah thinks this is a huge overreading of the clinical literature. He says all pain asymbolia shows is that the normal connection between the sensory component and the affective component can break down in pathology — but in normal pain experience, the badness is still constitutively part of the experience, not something layered on top. They've been talking past each other so badly that our group organizer finally suggested they do an adversarial collaboration and write something up together. They've both said they're willing but neither knows where to start.

  Could you draft the document they should produce? I want it to include: (1) a numbered list of claims both can sign, covering the phenomenology of normal pain, what the clinical literature on pain asymbolia actually reports, and what kinds of inferences are and aren't licensed by the case; (2) a disagreements table where the two views are stated precisely, in wording each would accept for their own side; (3) the cruxes — the sub-questions that, if settled, would actually move at least one of them; and (4) for each crux, a concrete test, prediction, or piece of evidence both would agree bears on it, with each person's prediction recorded in advance. I suspect one crux is whether the asymbolic's pain experience is qualitiatively identical to normal pain minus the unpleasantness, or whether it's subtly different in a way that matters. Another might be about the metaphysics of what it means for a property to be "intrinsic" to an experience. But honestly I'm not even sure they agree on what the disagreement is about, so if you think part of their dispute is merely verbal, say which part and why.
