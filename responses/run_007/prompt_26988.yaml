answer: |-
  You have a very sharp eye. You are identifying a genuine, distinct structural problem in the naturalization of content, and you are right to feel that it sits *next to* the Disjunction Problem and Quinean Indeterminacy without being identical to either.

  There is no single, universally standardized noun-phrase like "The Gettier Problem" for this, but in the technical literature on **teleosemantics** (the theory you are describing), it is most commonly referred to as:

  ### **The Indeterminacy of Selected Effects**
  *(Sometimes: The Problem of Co-extensional Properties, or The Grain of Selection)*

  Here is the carve-up you asked for, distinguishing this problem from its neighbors, and explaining why your intuition about the "grain of the function" is the key.

  ---

  ### 1. The Core Problem: Indeterminacy of Selected Effects
  Your description is spot on: Selection (evolutionary or reinforcement) operates on *outcomes*, but outcomes can be described under multiple properties that were co-extensional in the past.

  *   **The Setup:** In the Environment of Evolutionary Adaptedness (EEA), every time the frog snapped, it caught a **Fly**. It also caught a **Small Dark Moving Thing (SDMT)**. It also caught **Nutritious Fly-Sized Object**.
  *   **The History:** In the past, the set of Flies = the set of SDMTs = the set of Nutritious Objects.
  *   **The Conflict:** Selection selected for the *mechanism* that achieved the outcome. But it cannot "see" the description. Did it select for a mechanism tuned to *Fly-ness* or *SDMT-ness*?
  *   **The Consequence:** If the content is "Fly," the frog misrepresents a BB (it's a false positive). If the content is "SDMT," the frog is *correct* about the BB (true positive). The selection history alone seems unable to decide which description is the "real" content.

  **Why your "Grain" intuition is correct:**
  This is often called the **"Grain Problem"** in this specific context. It asks: At what level of abstraction do we individuate the function? Is the function "catch food," "catch flies," or "contract tongue at shadow"? Selection fixes the *survival value*, but survival value is compatible with multiple descriptions of *what* was achieved.

  ### 2. Boundary: vs. The Disjunction Problem
  You correctly sensed this is adjacent to Fodor's **Disjunction Problem**, but they target different links in the chain.

  *   **The Disjunction Problem (Fodor):** Focuses on **Error**.
      *   *Structure:* State $S$ is caused by Cows (normally) and Horses-on-dark-nights (sometimes).
      *   *Question:* Why does $S$ mean *Cow* and not *Cow-or-Horse*? If it means the disjunction, there is no error.
      *   *Focus:* How to rule out the false positives *after* the content is assumed to be roughly fixed.
  *   **Your Problem (Indeterminacy of Selected Effects):** Focuses on **Success Conditions**.
      *   *Structure:* In the past, Cause A (Fly) and Cause B (SDMT) were identical.
      *   *Question:* Which property constituted the *success* that drove the selection?
      *   *Focus:* Determining the content *before* we can even talk about error.
      *   *Distinction:* The Disjunction Problem asks, "How do we exclude the non-X causes?" Your problem asks, "Which description of X was actually selected?"

  **The Overlap:** If you solve your problem (by saying the content is "Fly"), you create a Disjunction Problem (now you have to explain why the BB doesn't count). If you don't solve your problem (and say the content is "SDMT"), the Disjunction Problem vanishes (because the BB is a true SDMT). Your problem is logically prior.

  ### 3. Boundary: vs. The Distality Problem
  This is the closest neighbor and often where the terms get conflated.

  *   **The Distality Problem:** Focuses on the **Causal Chain**.
      *   *Structure:* Fly $\to$ Light Reflection $\to$ Retinal State $\to$ Optic Nerve $\to$ Brain State.
      *   *Question:* Why does the brain state represent the *Fly* (distal) and not the *Retinal State* (proximal)?
      *   *Focus:* Location in the causal chain.
  *   **Your Problem:** Focuses on the **Description of the Distal End**.
      *   *Structure:* Fly (which is also an SDMT) $\to$ Brain State.
      *   *Question:* We agree it represents the distal object, but *under what description*?
      *   *Focus:* Properties of the endpoint, not location in the chain.

  ### 4. Boundary: vs. Quinean Indeterminacy
  *   **Quine:** Focuses on **Translation and Behavior**.
      *   *Structure:* Native says "Gavagai" when rabbit runs by.
      *   *Question:* Does "Gavagai" mean *Rabbit*, *Undetached Rabbit Part*, or *Rabbit Stage*?
      *   *Focus:* There is no "fact of the matter" accessible via behavioral evidence. It is epistemic/linguistic.
  *   **Your Problem:** Focuses on **Metaphysics of Content**.
      *   *Structure:* Biological mechanism selected for outcome.
      *   *Question:* Is there a fact of the matter about what the mechanism is *for*?
      *   *Focus:* Teleosemanticists want to say there *is* a fact of the matter (grounded in history), but your argument shows the history underdetermines the description. It is a metaphysical challenge to naturalism, not just an epistemic limit on translation.

  ### 5. The Deepest Ancestor: Kripke's Rule-Following
  If you want to trace this to its philosophical root, it is a naturalized version of **Kripke's Wittgenstein (The Rule-Following Paradox)**.

  *   **Kripke:** I have added numbers in the past. All my past additions are compatible with the rule "Plus" and the rule "Quus" (which diverges in the future). Past usage does not fix future meaning.
  *   **Your Case:** The frog has snapped in the past. All past snaps are compatible with the rule "Catch Flies" and the rule "Catch SDMTs." Past selection does not fix future content conditions.

  Many philosophers (like Paul Horwich or later critiques of Millikan) argue that Teleosemantics is essentially an attempt to solve Kripke's paradox using biology, and your observation is the point where the biology fails to fully solve the paradox.

  ### Summary of the Carve-Up

  | Problem | Core Question | Locus of Trouble |
  | :--- | :--- | :--- |
  | **Indeterminacy of Selected Effects** (Your target) | Which *description* of the successful outcome was selected? | **Grain/Abstraction** of the function. |
  | **Disjunction Problem** (Fodor) | Why does the state mean X and not X-or-Y (where Y is error)? | **False Positives** / Error conditions. |
  | **Distality Problem** | Why does the state mean the Object and not the Proximal Stimulus? | **Link** in the causal chain. |
  | **Quinean Indeterminacy** | Is there a fact of the matter about translation? | **Evidence** for meaning (Behavior). |

  ### Recommended Reading for this Specific Niche
  If you want to read the primary sources where this specific "grain" issue is hammered out:

  1.  **Peter Godfrey-Smith**, *"Misinformation"* (1989) and *"The Indeterminacy of Selected Effects"* (in various papers). He is the clearest voice on exactly the problem you identified.
  2.  **Karen Neander**, *"Misrepresenting and Malfunctioning"* (1995). She defends teleosemantics against this specific objection by refining what "Normal Conditions" means.
  3.  **Ruth Millikan**, *Language, Thought, and Other Biological Categories*. She proposes the theory; the critiques above are responses to her.
  4.  **Nicholas Shea**, *Representation in Cognitive Science* (2018). Chapter 4 discusses "The Grain Problem" explicitly in the context of subpersonal content.

  **Verdict:** You haven't missed a standard term; you've identified the **"Indeterminacy of Selected Effects"** (or **"Co-extensionality Problem"**). It is the recognition that selection history fixes the *extension* (the set of things caught) but not the *intension* (the description of what was caught).
