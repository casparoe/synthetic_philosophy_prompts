answer: |-
  The view, sharpened
  You hold a hybrid moral position: human beings are protected by Nozickian side constraints that forbid using them as mere means regardless of aggregate benefit, while animals are treated as utilitarian loci of welfare whose interests can be aggregated and traded off. The critical ambiguity lies in the grounding of this split: is the inviolability of humans based on species membership, moral agency, or a specific cognitive capacity, and if the latter, where exactly is the threshold set such that it includes all humans but excludes all animals?

  Where it is exposed
  The view is most exposed at the junction where biological continuity meets moral discontinuity. If side constraints protect beings capable of shaping their lives according to a conception of the good, you must explain why humans with severe cognitive disabilities qualify while nonhumans with comparable or superior cognitive capacities do not. The exposure is not merely in the edge cases but in the structural lack of a scalable metric; you have constructed a moral cliff where nature provides a slope, requiring a justification for why the binary switch flips exactly at the species boundary rather than at a threshold of capacity.

  It is also exposed in the practical application of aggregation to animals. If an animal's suffering is fully fungible, there is theoretically no limit to the harm inflicted on one individual for the sake of the many, provided the sum is positive. This clashes with the intuition that individuals matter distinctively—an intuition you rely on to protect humans but suspend for animals. If you feel residual wrongness when sacrificing a specific animal for the herd, your moral phenomenology suggests the utilitarian model is descriptively false about the value of individual animal lives, even if you maintain it normatively.

  The defeaters, ranked
  1. **Empirical finding that humans with severe cognitive disabilities lack the capacities typically cited for side constraints (e.g., autonomy, rationality).** Rating: Fatal to capacity-based justifications; absorbable only by appealing to species membership at the cost of admitting arbitrary speciesism.
  2. **Confirmation that some nonhumans possess narrative self-awareness and long-term planning comparable to average humans.** Rating: Fatal to consistency; absorbable only by arbitrarily raising the threshold for personhood, which undermines the justification for human protection.
  3. **Evidence that side constraints themselves cannot be grounded without appealing to the very utilitarian calculations they are meant to forbid.** Rating: Theoretically fatal; absorbable only by asserting rights as brute facts, which costs explanatory power.
  4. **Persistent moral distress in the practitioner when sacrificing individual animals for the group.** Rating: Merely awkward; absorbable as emotional residue, but costs confidence in the utilitarian calculus.

  What a defender concedes
  A committed defender must concede that the boundary is not perfectly correlated with individual cognitive capacity but relies on a "kind-based" membership or relational status, admitting that some humans are protected by association rather than individual merit. They would likely concede that some animals deserve stronger protections than others based on cognitive complexity, creating a gradient of welfare weight, but they must maintain a binary distinction for inviolability to avoid collapsing into full utilitarianism or full rights theory.

  Insulation check
  The view is heavily insulated because the criteria for "personhood" or "moral status" can be retroactively adjusted to exclude any animal while including all humans via potentiality, species norms, or relational standing. This insulation is a vice rather than a neutral feature of normative positions because it renders the position unfalsifiable; if every empirical discovery of animal cognition is met by moving the goalposts just enough to maintain human exceptionality, the view functions as a rationalization for human priority rather than a derived moral truth.

  Bottom line
  I am highly confident that this hybrid view faces severe stability issues regarding the marginal cases and the grounding of the human/animal split, as these are the points where the internal logic contradicts empirical reality. The one point I am least sure of is whether side constraints are coherent for *any* being, human or animal, since if rights are themselves unjustifiable, the problem dissolves into a debate about degrees of welfare rather than a split in moral grammar.
