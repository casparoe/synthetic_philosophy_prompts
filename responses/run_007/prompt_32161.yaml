answer: |-
  This specification document outlines the adequacy conditions for any theory of conversational implicature (CI). Given your background in formal semantics, the focus here is on the interface conditions: how pragmatic inferences interact with semantic content, logical operators, and cognitive architecture.

  The desiderata are divided into four categories. For each, I provide the motivating consideration, the specific requirement, and an evaluation of its negotiability. The final section addresses the joint satisfiability of these constraints.

  ---

  ### I. Diagnostic Desiderata
  *These criteria distinguish conversational implicatures from entailments and conventional implicatures.*

  #### 1. Cancelability (Defeasibility)
  *   **Motivating Case:** "Some of the students passed. In fact, all of them did." The second sentence denies the scalar implicature ("not all") without creating a contradiction. Entailments cannot be cancelled this way.
  *   **Requirement:** The theory must explain why CIs do not contribute to the truth-conditional content of the utterance in a way that generates logical contradiction when denied.
  *   **Status:** **Non-negotiable.** If an inference cannot be cancelled without contradiction, it is arguably part of the truth-conditional content (entailment) or a conventional implicature (which are often non-cancelable in the same way). A theory that renders CIs non-cancelable ceases to be a theory of *conversational* implicature.

  #### 2. Calculability
  *   **Motivating Case:** The inference from "It's cold in here" to "Close the window" relies on the assumption that the speaker is being cooperative/relevant.
  *   **Requirement:** The theory must provide a derivational path from the semantic content + context + communicative principles to the implicated content. It cannot be arbitrary.
  *   **Status:** **Negotiable (with caveats).** Gricean/Neo-Gricean theories treat this as non-negotiable (reasoning from maxims). However, **Grammatical Theories** (e.g., Chierchia, Fox) argue CIs are derived via syntactic exhaustification operators ($O$). They retain a form of calculability (algorithmic derivation) but reject the idea that it is *pragmatic reasoning*. A theory can argue calculability is syntactic, not rational-pragmatic.

  #### 3. Non-detachability
  *   **Motivating Case:** "He stopped the car" and "He halted the car" implicate the same things (e.g., it was moving before). The implicature attaches to the semantic content, not the specific lexical item.
  *   **Requirement:** Substituting synonymous expressions should not alter the CI, unless the substitution changes the semantic content or information structure (focus).
  *   **Status:** **Mostly Non-negotiable.** Exceptions exist for *M-implicatures* (Horn), where the marked form implicates the marked situation (e.g., "caused to die" vs. "killed"). A theory must account for why most CIs are content-based, while allowing for form-based inferences in marked cases.

  #### 4. Reinforceability
  *   **Motivating Case:** "Some of the students passed, but not all." Adding the implicature explicitly does not sound redundant (unlike "All passed, and in fact all passed").
  *   **Requirement:** The theory must distinguish the implicated content from the explicit content such that stating both is informative, not tautologous.
  *   **Status:** **Non-negotiable.** This is the flip side of the Said/Implicated distinction. If reinforcing an CI creates redundancy, the theory has collapsed the distinction between saying and implicating.

  ---

  ### II. Taxonomic Desiderata
  *These criteria require the theory to map the landscape of meaning correctly.*

  #### 5. The Said/Implicated Boundary
  *   **Motivating Case:** Truth conditions. If I say "I ate some cookies" and I ate all of them, did I lie? Intuitively, no (implicature violated), whereas if I ate none, I lied (entailment violated).
  *   **Requirement:** The theory must delineate which inferences contribute to the proposition expressed (what is said) and which are secondary.
  *   **Status:** **Non-negotiable (as a distinction), Negotiable (as a boundary).** Every theory needs this distinction to handle truth conditions. However, **Relevance Theory** argues for "Explicature," where pragmatic enrichment *does* contribute to the proposition (e.g., reference resolution, free enrichment). A theory can argue the boundary is shifted, but it cannot deny the need to distinguish truth-conditional from non-truth-conditional content.

  #### 6. PCI vs. GCI (Particularized vs. Generalized)
  *   **Motivating Case:** "There is a garage around the corner" implies "You can buy petrol there" only in a specific context (PCI). "Some" implies "Not all" in almost any context (GCI).
  *   **Requirement:** The theory must explain why some CIs arise context-independently (defaults) while others require specific premises.
  *   **Status:** **Negotiable.** **Defaultism** (Levinson) treats GCIs as presumptive meanings. **Contextualism** (Griceans/Relevance) argues *all* CIs are particularized; GCIs just arise in very common contexts. A theory can deny the existence of a distinct *mechanism* for GCIs, provided it explains the frequency data.

  #### 7. Conversational vs. Conventional Implicature
  *   **Motivating Case:** "She is poor but she is honest." "But" contributes a contrastive inference that is not truth-conditional but is attached to the word "but."
  *   **Requirement:** The theory must distinguish inferences arising from the cooperative principle (conversational) from those encoded lexically (conventional).
  *   **Status:** **Non-negotiable.** The behavior of "but," "therefore," and expressives differs fundamentally from scalar implicatures regarding cancelability and projection. A unified theory that conflates them fails to capture the data.

  ---

  ### III. Structural and Embedding Desiderata
  *These criteria test the interaction of implicature with logical operators.*

  #### 8. Global Projection (The Vanishing Act)
  *   **Motivating Case:** "It is not the case that John ate some of the cookies." This does not implicate "John didn't eat all of them." In fact, it is compatible with him eating all of them. Implicatures typically do not project through negation, conditionals, or questions.
  *   **Requirement:** The theory must explain why CIs generally take wide scope over logical operators (or are computed only on the root assertion).
  *   **Status:** **Non-negotiable Data, Negotiable Mechanism.** The data is robust. However, *why* this happens is the battleground. Pragmatic theories say it's because CIs are computed on the output of semantics. Grammatical theories must explain why the exhaustification operator $O$ is usually inserted at the root.

  #### 9. Local Embedding (The Stress Test)
  *   **Motivating Case:** "If John ate some of the cookies, he will be in trouble." In certain contexts, this implies "If John ate some *but not all*..." Similarly with disjunctions and restrictors of quantifiers.
  *   **Requirement:** The theory must account for environments where implicatures *do* seem to interact with operators (local enrichment), without losing the ability to explain Desideratum #8 (Global Projection).
  *   **Status:** **Non-negotiable.** Any theory that claims CIs *never* embed is empirically falsified. Any theory that claims they *always* embed is falsified by negation data. The theory must predict *when* embedding occurs.

  #### 10. Downward Entailing (DE) Environments
  *   **Motivating Case:** "I doubt that John ate some of the cookies." Scalar implicatures are typically suppressed in DE environments.
  *   **Requirement:** The theory must explain the correlation between DE contexts and the suspension of scalar implicatures.
  *   **Status:** **Non-negotiable.** This is a strong correlation that any semantic/pragmatic interface theory must capture. Grammatical theories often link this to the distribution of the exhaustification operator in DE contexts.

  ---

  ### IV. Psycholinguistic Desiderata
  *Modern theories cannot ignore the cognitive reality of the inferences.*

  #### 11. Processing Latency
  *   **Motivating Case:** Eye-tracking and self-paced reading studies generally show that processing sentences with implicatures takes longer than sentences without them (e.g., "some" vs. "all" contexts).
  *   **Requirement:** The theory must align with the temporal profile of inference generation.
  *   **Status:** **Non-negotiable (increasingly).** Older theories ignored this. Modern theories must account for the cost. This creates tension for Defaultist theories (see Section V).

  #### 12. Acquisition Trajectory
  *   **Motivating Case:** Children up to age 5-7 often accept "Some" as compatible with "All" (they act like logicians). They acquire the adult-like scalar implicature later.
  *   **Requirement:** The theory must explain why CIs are not present at the initial state of language acquisition.
  *   **Status:** **Non-negotiable.** If CIs were lexical or hard-wired defaults, children should have them early. The delay suggests a pragmatic or complex computational cost.

  ---

  ### V. The Incompatibility Matrix: Jointly Unsatisfiable Desiderata

  This is the critical section for your evaluation. There are subsets of desiderata that appear to pull in opposite directions, forcing theoretical trade-offs.

  #### Tension 1: Embedding (9) vs. Cancelability (1) & Pragmatic Nature
  *   **The Conflict:**
      *   To satisfy **Embedding (9)** (local enrichment), the implicature must be available *before* the logical operator (e.g., negation or conditional) applies. This suggests the implicature is part of the semantic composition (Grammatical View).
      *   To satisfy **Cancelability (1)** and the standard **Pragmatic View**, the implicature must be computed *after* the semantic proposition is built, based on speaker intentions. If it is computed post-semantically, it cannot logically embed inside a conditional antecedent.
  *   **The Trade-off:**
      *   **Grammatical Theories** satisfy Embedding easily but struggle with **Cancelability**. If an exhaustification operator is in the syntax, denying it should be a contradiction (like denying an entailment). They must posit "silent" operators that can be optionally omitted, which risks overgeneration.
      *   **Pragmatic Theories** satisfy Cancelability easily but struggle with Embedding. They must posit complex mechanisms (e.g., "local pragmatic enrichment" or recursion of pragmatic principles) to explain how an inference computed on the whole utterance ends up inside a conditional.
  *   **Verdict:** You likely cannot maximize both without significant theoretical machinery. A theory that fully embraces local embedding risks making implicatures truth-conditional (violating Cancelability).

  #### Tension 2: Generalized Implicature (6) vs. Processing/Acquisition (11 & 12)
  *   **The Conflict:**
      *   **Defaultism (Levinson):** GCIs are default presumptive meanings. They should be processed *fast* (like lexical access) and acquired *early*.
      *   **Data:** Processing data shows **Latency (11)** (implicatures are slower than entailments). Acquisition data shows **Delay (12)** (children are "logical").
  *   **The Trade-off:**
      *   If you maintain **GCI Defaultism**, you must argue against the psycholinguistic data (e.g., claim the tasks are flawed) or posit a complex "defeasibility check" that slows down the default.
      *   If you accept **Processing/Acquisition data**, you must abandon strong Defaultism. You must treat even "generalized" implicatures as context-dependent pragmatic inferences (Contextualism/Relevance Theory), which sacrifices the elegant taxonomy of GCIs vs. PCIs.
  *   **Verdict:** Strong Defaultism is largely incompatible with current psycholinguistic desiderata.

  #### Tension 3: Said/Implicated Boundary (5) vs. Embedding (9)
  *   **The Conflict:**
      *   To maintain a strict **Said/Implicated Boundary**, "What is Said" must be the input to pragmatic inference.
      *   However, in cases of **Local Embedding**, the "implicated" content seems to affect the truth conditions of the complex sentence (e.g., "If you eat some of the cookies [implicature: not all], you get a reward"). If the implicature affects the truth conditions of the conditional, is it still "implicated"?
  *   **The Trade-off:**
      *   **Relevance Theory** dissolves this by expanding "Explicature" (pragmatically enriched truth-conditional content). This satisfies Embedding but blurs the Said/Implicated boundary.
      *   **Gricean/Neo-Gricean** theories keep the boundary strict but struggle to explain how non-truth-conditional content drives truth-conditional evaluation in embedded contexts.
  *   **Verdict:** You cannot have a strict Gricean boundary *and* a robust account of local embedding without significant modification to one or the other.

  ---

  ### VI. Conclusion: Do the Desiderata Force a Choice?

  **Yes, they do.** There is no coherent position that satisfies all desiderata in their strongest forms without cost. The desiderata force a choice between **Semantic/Structural** accounts and **Pragmatic/Inferential** accounts.

  1.  **If you prioritize Embedding and Compositionality:** You are pushed toward **Grammatical Theories** (Chierchia, Fox).
      *   *Cost:* You must weaken **Cancelability** (making it a matter of optional operator insertion) and explain away **Acquisition Delay** (why don't kids use the $O$ operator?).
  2.  **If you prioritize Cancelability and Acquisition:** You are pushed toward **Contextualist/Pragmatic Theories** (Grice, Relevance Theory).
      *   *Cost:* You must complicate the mechanism for **Embedding** (posulating recursive pragmatic derivation) and abandon **GCI Defaultism** (treating all CIs as context-driven).
  3.  **If you prioritize Processing Speed (for GCIs):** You are pushed toward **Defaultism**.
      *   *Cost:* You conflict with **Acquisition** and much **Processing Latency** data.

  **The "Coherent Position":**
  The most viable coherent position currently is a **Hybrid Grammatical-Pragmatic approach**.
  *   *Mechanism:* Implicatures are derived via a grammatical operator ($O$), satisfying **Embedding**.
  *   *Constraint:* The insertion of $O$ is regulated by pragmatic principles (e.g., "Be Informative"), satisfying **Cancelability** (you simply don't insert $O$ if it violates maxims).
  *   *Acquisition:* The delay is explained by the computational cost of checking the pragmatic constraints on $O$, satisfying **Acquisition/Processing**.

  However, even this hybrid must concede that the **Said/Implicated boundary** is permeable (since $O$ affects truth conditions). If maintaining a strict Gricean boundary is a non-negotiable requirement for your evaluation, **no current theory satisfies all desiderata.** You will have to decide which desideratum is the "exception that proves the rule."
