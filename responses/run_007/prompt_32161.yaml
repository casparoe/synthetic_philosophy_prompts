      *   **User:** Works in formal semantics.
      *   **Topic:** Theories of conversational implicature (neo-Gricean, relevance-theoretic, grammatical).
      *   **Goal:** Wants a specification of desiderata (criteria for adequacy) to evaluate these theories *before* looking at the theories themselves.
      *   **Required Content:**
          *   Standard diagnostics (calculability, cancelability, non-detachability, reinforceability).
          *   Key distinctions (conventional vs. conversational, particularized vs. generalized, said vs. implicated).
          *   Embedding facts (negation, conditionals, downward-entailing environments).
          *   Acquisition and processing data.
          *   For each desideratum: Motivating case/consideration + Status (Non-negotiable vs. Negotiable).
          *   Crucial Constraint: Flag jointly unsatisfiable subsets (tensions/trade-offs).
      *   **Ultimate Question:** Do the desiderata force a theoretical choice, or is there a coherent position satisfying all?

  2.  **Deconstruct the Desiderata:**

      *   *Diagnostics:*
          *   Cancelability: Implicatures can be denied without contradiction. (Motivation: They aren't truth-conditional content).
          *   Calculability: Implicatures must be derivable from the saying + maxims/principles. (Motivation: They are rational inferences, not lexical).
          *   Non-detachability: Changing the form (synonyms) shouldn't kill the implicature unless the meaning changes. (Motivation: It's about the message, not the words).
          *   Reinforceability: You can state the implicature explicitly without redundancy. (Motivation: It's distinct from what is said).

      *   *Distinctions:*
          *   Conventional vs. Conversational: "But" vs. "And". (Motivation: Some inferences are lexical, some pragmatic).
          *   Particularized (PCI) vs. Generalized (GCI): Context-dependent vs. default. (Motivation: Some inferences arise almost always, others need specific context).
          *   What is Said vs. What is Implicated: Truth-conditional content vs. pragmatic overlay. (Motivation: Truth conditions need to be stable).

      *   *Embedding (The "Projection Problem" for Implicature):*
          *   Disappearance under negation, conditionals, DE contexts. (Motivation: Implicatures usually don't scope logically like entailments).
          *   *Challenge:* Sometimes they *do* seem to embed (local implicatures).

      *   *Psycholinguistic Data:*
          *   Acquisition: Kids get entailments before implicatures.
          *   Processing: Implicatures take longer to compute than entailments (usually).
          *   *Challenge:* Defaultist theories predict GCIs should be fast (like entailments).

  3.  **Identify Tensions/Trade-offs (The "Jointly Unsatisfiable" part):**
      *   *Embedding vs. Cancelability/Standard View:* If implicatures are pragmatic post-processing, why do they sometimes interact with logical operators (local enrichment)? If they are grammatical (Chierchia/Fox), do they lose cancelability?
      *   *GCIs vs. Processing:* If GCIs are default, why does processing data often show a delay compared to literal meaning? (Relevance Theory vs. Defaultism).
      *   *Said vs. Implicated:* The boundary is blurry (e.g., "I ate some" -> "not all". Is "not all" part of the truth conditions?).
      *   *Calculability vs. Grammaticalization:* If it's grammatical, is it still "calculable" in the Gricean sense?

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's expertise level. Set the stage (the "Specification Document").
      *   **Section 1: The Core Diagnostics.** Go through Cancelability, Calculability, Non-detachability, Reinforceability.
          *   *Status:* Mostly non-negotiable for *conversational* implicature, but Grammatical theories might tweak Calculability.
      *   **Section 2: The Taxonomy of Meaning.** Said vs. Implicated, Conv vs. Conv, PCI vs. GCI.
          *   *Status:* Said/Implicated is crucial. PCI/GCI is the battleground (Defaultism vs. Contextualism).
      *   **Section 3: Embedding and Projection.** The big hurdle.
          *   *Status:* Non-negotiable data, but negotiable explanation. Local implicatures are the stress test.
      *   **Section 4: Psycholinguistics.** Acquisition and Processing.
          *   *Status:* Increasingly non-negotiable in modern semantics/pragmatics interface.
      *   **Section 5: The Incompatibility Matrix (Crucial Step).**
          *   Highlight the tension between *Embedding* (requires structural access) and *Cancelability/Pragmatic Nature* (requires post-propositional flexibility).
          *   Highlight the tension between *GCI Defaultism* and *Processing Latency*.
      *   **Conclusion:** Answer the ultimate question. Is there a coherent position? (Likely "No single theory satisfies *all* without cost," but some hybridize).

  5.  **Refining the Tone:**
      *   Must be technical (formal semantics audience).
      *   Avoid oversimplification.
      *   Use standard terminology (DE environments, scalar implicature, local enrichment, etc.).
      *   Be critical (don't just list them, evaluate their negotiability).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include "Reinforceability"? Yes.
      *   *Check:* Did I address Downward Entailing environments specifically? Yes, need to mention that implicatures typically vanish there.
      *   *Check:* Did I address the "Jointly Unsatisfiable" constraint strongly enough? I need to make sure I explicitly state *which* subsets clash.
      *   *Refinement on Embedding:* The "Embedding" desideratum is tricky. The *data* is non-negotiable, but the *requirement that they disappear* is what theories struggle with (because sometimes they don't). I need to phrase this carefully: The theory must account for *both* global cancellation and local embedding.
      *   *Refinement on Calculability:* Grammatical theories (Chierchia, Fox) argue implicatures are derived via exhaustification operators in the syntax. This challenges the "Calculability" desideratum if defined strictly as Gricean reasoning. I should note that "Calculability" might need redefinition for grammatical accounts.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Non-negotiable/Negotiable" verdict is clear for each. Make the "Tensions" section prominent. (Proceed to generate output based on this structure).

  8.  *(Self-Correction on the "Jointly Unsatisfiable" prompt requirement)*: The prompt asks to "flag any subsets of the desiderata that appear jointly unsatisfiable." I need to be explicit here. The classic tension is between **Embedding** (structural) and **Cancelability** (pragmatic/post-semantic). If it embeds, it looks semantic. If it's semantic, can it be cancelled? Also **GCI** vs **Processing**.

  9.  *(Final check on "Said vs Implicated")*: This is the "Semantic/Pragmatic Boundary" problem. Relevance theorists blur this (Explicature). Griceans keep it strict. I need to mention this tension.

  10. *(Final check on "Acquisition")*: Children are "logical" (fail to derive SI) for a long time. This supports pragmatic views over grammatical default views.

