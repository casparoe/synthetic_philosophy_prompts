      *   *The Philosophical Crunch:* The "Then-Self" said "If I don't know them, I'm not me/Life not worth living." The "Now-Self" is content.
      *   *Procedure Outcome:* If the procedure prioritizes the "Then-Self's" critical interests (Dworkin), we withhold surgery. If it prioritizes "Now-Self's" experiential interests (Dresser), we treat.
