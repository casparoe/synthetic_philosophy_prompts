      *   Professional, clinical, yet philosophically grounded.
      *   Avoid jargon like "diachronic identity" but use concepts like "continuity of values."
      *   Acknowledge the user's personal stake (the father story) implicitly by being rigorous.

  10. **Final Polish of the Procedure:**
      *   Make sure the "Handoff" is clear. Ethics committees usually *recommend*. The legal decision lies with the surrogate/physician. The procedure must clarify when the committee says "The AD is binding" vs "The Surrogate must weigh this."
      *   *Correction:* The prompt asks the procedure to "hand the decision to a person because the question is one of values." So, if the procedure hits a value wall, it stops and says "Surrogate decides."
      *   *Philosophical Translation:* The "Value Wall" is the point where we ask "Is a life without memory worth living?" That is a value judgment, not a fact. The procedure should identify *when* that question is being asked.

      *(Self-Correction during drafting)*: I need to be careful not to make the procedure *too* rigid. It needs to allow for the "Unforeseen Well-Being" exception (the "happy dementia" paradox).
      *   *Step 4:* "Assessment of Unforeseen Experiential Interest."
