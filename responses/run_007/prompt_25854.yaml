      *   *Okay, let's settle on a "Presumption of Authority" model.* The AD is binding unless there is clear evidence of *revocation* or *unforeseen benefit*.
      *   *Case (b) Outcome:* The procedure should likely recommend *honoring the AD* (withholding surgery). This is uncomfortable because the patient is calm and the wife wants treatment. It prioritizes the "dead" self over the "living" self.

  7.  **Drafting the Limitations Section:**
      *   What can't this do? It can't solve the metaphysical question of identity. It can't account for family guilt. It can't predict future regret. It relies on subjective interpretation of "distress."

  8.  **Review against Constraints:**
      *   Step-by-step? Yes.
      *   Questions in order? Yes.
