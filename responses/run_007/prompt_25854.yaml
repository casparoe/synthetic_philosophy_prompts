      *   **Requirements:**
          *   Specify questions in order.
          *   Define sufficient answers.
          *   Indicate where the procedure stops with a recommendation.
          *   Indicate where it must hand off to a value judgment (surrogate/family).
          *   Apply to two specific cases (a) and (b).
          *   Flag an uncomfortable outcome in at least one case.
          *   Explain limitations (what the procedure *cannot* do).

  2.  **Deconstruct the Philosophical Core:**
      *   *The Problem:* Does the "then-self" (who wrote the AD) have authority over the "now-self" (who is demented)?
      *   *Critical Interests (Dworkin):* The then-self's overarching life narrative and values matter most.
      *   *Experiential Interests (Dresser):* The now-self's current capacity for pleasure/pain matters most.
      *   *The Threshold:* When does the "now-self" become a different moral patient than the "then-self"?
      *   *Operationalizing this:* We need to assess *capacity* (legal/clinical), *consistency* (values), and *harm/benefit* (current experience). We need to distinguish between a *change of mind* (valid revocation) and *inability to understand* (invalid revocation).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Make it actionable, not theoretical.
      *   *Step 1: Capacity Assessment.* Can the patient currently understand the specific decision? If yes, current wish trumps AD. (Standard bioethics).
      *   *Step 2: Assessing the "Now-Self's" Objection.* If they lack capacity, are they expressing distress or mere reflex? This addresses the "experiential interest."
      *   *Step 3: Assessing the "Then-Self's" Intent.* Was the AD specific to *this* condition? This addresses the "critical interest."
      *   *Step 4: The "Continuity of Self" Check.* This is the tricky philosophical part made practical. Did the patient anticipate *this* level of happiness? If the current self is content, does the AD still apply?
