          2.  Evaluate Current Suffering vs. Benefit.
          3.  Evaluate Specificity of the Directive.
          4.  Evaluate the "Window of Contentment" (The Philosophical Crux).
          5.  Final Recommendation vs. Surrogate Handoff.

