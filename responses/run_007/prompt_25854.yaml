      *   *Case (b):* "No recognition." He has "no recognition." This is a factual match. The conflict is moral.
      *   *Okay, I will make Case (b) the uncomfortable one.* The procedure will recommend honoring the AD (withholding surgery), despite the patient's calmness. This upholds the "Critical Interest" (Dworkin) over the "Experiential Interest" (Dresser). This is the philosophically "hard" line that protects the institution of ADs but feels cold in the room.

