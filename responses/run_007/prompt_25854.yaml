      *   *Step 1 (Capacity):* Standard clinical assessment. If they have capacity, AD is void.
      *   *Step 2 (Current Objection):* Is the "no" consistent? Is it fear-based?
      *   *Step 3 (Directive Specificity):* Does the AD actually cover this? (The "severe impairment" vs. "moderate" issue).
      *   *Step 4 (The "Self" Question):* This needs to be the operationalization of personal identity. *Question:* "Does the patient's current state represent a fundamental break from the values in the AD, or merely a different experience of the same life?" Better: "Is the patient capable of experiencing well-being that the prior self would have valued?"
      *   *Actually, let's look at the "Authority" question:* The core tension is: Does the AD stand if the patient is happy?
      *   *Revised Step 4:* "The Benefit/Burden Assessment relative to the AD's intent."
      *   *Let's try to capture the 'Then-Self vs. Now-Self' authority:*
          *   Q: Is the current behavior a *revocation* or a *symptom*?
          *   Q: Does honoring the AD cause *current* harm that outweighs the *prior* value?
      *   *Decision Point:* If the patient is content and treatment is low-burden, favor treatment *unless* the AD was explicitly about *dignity* independent of suffering.

      *   *Let's formalize the "Handoff":* The procedure must admit where it ends. Ethics committees advise; they don't usually decide (legally). But the prompt asks for a procedure that yields a recommendation or hands to a person.
      *   *Key Philosophical Translation:* The "Authority of the Past Self" lapses if the "Current Self" has distinct experiential interests that were not foreseen.
      *   *Step 4 (The Philosophical Pivot):* "Assessment of Unforeseen Well-Being." Did the prior self anticipate *this* specific quality of life?

