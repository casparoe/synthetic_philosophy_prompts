answer: |-
  To the Team,

  This memo outlines the decision procedure we will use when clients ask us to build commitment devices into their products. We are often approached with the observation that users set goals and fail to meet them, and the immediate instinct is to tighten constraints. However, behavioral economics teaches us that not all goal failure is a result of akrasia or time inconsistency, and imposing hard constraints where they are not warranted can reduce user welfare and damage trust. The following procedure is grounded in the theory of hyperbolic discounting, which posits that agents value immediate rewards disproportionately more than future rewards, leading to preference reversal over time. Our job is to distinguish between genuine preference reversal, where a commitment device can restore agency to the long-term self, and legitimate preference change or learning, where a commitment device would merely lock the user into a mistake. You should run this sequence of questions in order for every request. If any step yields a negative result, you stop and recommend against a hard commitment device. If the sequence is completed but reveals a conflict between ex-ante and ex-post welfare that cannot be resolved by facts alone, you hand the decision to human review for ethical consideration.

  We begin by asking whether there is evidence of a conflict between the user's ex-ante and ex-post preferences specifically driven by the proximity of the temptation. A simple failure to meet a goal is not enough. We need to see that the user planned to act one way when the action was distant in time, but planned to act differently when the action was immediate. A sufficient answer here requires data showing that users express intent to pursue the long-term goal during cool states, such as during onboarding or monthly planning, but systematically deviate during hot states, such as when a purchase is one click away or a workout is imminent. If the deviation occurs because the user acquired new information, such as a genuine emergency or a discovery that the goal is physically impossible, then this is not hyperbolic discounting but rational updating. In that case, the procedure stops and we advise the client not to build a commitment device, because locking the user in would prevent them from responding rationally to their environment.

  If we establish that there is a proximity-driven preference reversal, the second question is whether the long-term preference is stable across multiple cycles. We need to know if the user returns to the original goal after the temptation passes. A sufficient answer requires evidence that users re-engage with the long-term goal after the short-term impulse has faded, such as resetting a savings target the following month or expressing renewed intent to exercise after a period of inactivity. If the user abandons the goal permanently after the first deviation, this suggests the initial goal was an error or a fantasy, not a stable long-term preference. In this scenario, the procedure stops and we recommend against a commitment device, because there is no consistent long-term self to protect. We must also flag here that the theory is ambiguous regarding learning. If a user fails repeatedly and then stops trying, a hyperbolic model might call this weakness, but a learning model calls this rational discovery of costs. If the data cannot distinguish between giving up due to weakness and giving up due to learned impossibility, you must flag this ambiguity and move to the next step with caution.

  The third question asks whether the user expresses ex-post regret about the deviation or about the constraint. This is the most critical welfare check. We need survey or behavioral data indicating that when users fail, they wish they had been stopped, versus data indicating that when users are stopped, they wish they had been allowed to choose. A sufficient answer for building a hard commitment device is if users report regretting their failure to stick to the plan. If users report regretting the constraint itself, such as feeling trapped or financially stressed by a lock they cannot escape, the procedure stops. We do not build devices that users explicitly report as welfare-reducing after the fact. However, if the data shows users regret the failure but still lack the ability to bind themselves, we proceed to the final check. This final step is a values handoff. If the user's ex-ante self wants the constraint and the ex-post self hates it, and both preferences are stable over cycles, facts cannot resolve whose welfare counts more. You must hand this to human review. Our procedure cannot adjudicate between the sovereignty of the planning self and the experiencing self.

  You should also be aware of where this procedure might misfire systematically. It relies on the assumption that the ex-ante preference is the normative benchmark for welfare. This is standard in behavioral economics but philosophically contested. If a user's preferences are evolving because they are genuinely changing their values rather than succumbing to temptation, our procedure will incorrectly classify this as akrasia. For example, a user might stop saving not because they want a toy now, but because they have realized they value experiences over assets. The procedure cannot easily distinguish value evolution from impulse. Additionally, the procedure assumes sophistication. If users are naive about their own time inconsistency, they may not request commitment devices even when they need them, or they may request devices that are too weak. We cannot rely solely on stated preference; we must look for revealed preference in the cycling behavior. Finally, this procedure cannot account for external harms. If a commitment device causes severe financial distress or psychological harm even if it achieves the goal, the procedure might still give a green light unless you explicitly weigh those costs in the third step. You must treat the welfare check as inclusive of mental health and financial stability, not just goal attainment.

  To illustrate how this works in practice, consider the first case regarding the savings app where users set aggressive monthly targets and disable automatic transfers partway through the month for non-emergency purchases. We start with the first question about proximity-driven preference reversal. The behavior fits the pattern: users plan to save when the money is distant, but spend when the money is accessible. This passes the first step. We move to the second question regarding stability. The prompt indicates users keep setting goals and abandoning them, which implies a cycle of re-engagement. This suggests the long-term preference for savings is stable across months, so we pass the second step. However, we must pause on the ambiguity of learning. It is possible users are learning that their budget is too tight, but the description that the purchase is something they just want now points more strongly to hyperbolic discounting than budget discovery. We proceed to the third question on regret. Here is where the procedure turns. The prompt states users disable the transfer because they want the money now, but it does not state that they regret disabling it. In fact, the act of disabling is a revealed preference for liquidity over savings in that moment. Without evidence that they regret the abandonment ex-post, we cannot assume the long-term self is the welfare-maximizer. If we build a hard lock that prevents disabling, we are overriding a revealed preference without proof of regret. Therefore, the procedure stops here. We tell the client not to build a hard commitment device. The lack of expressed regret suggests the users are not experiencing akrasia severe enough to warrant coercion, or they value the option value of liquidity more than the savings goal. Building a hard lock would likely increase churn and support tickets without improving welfare. We should recommend a soft nudge instead, such as a delay or a confirmation dialog, which respects the user's immediate agency while signaling the conflict.

  Now consider the second case involving the fitness app where users purchase a six-month commitment, stop attending after three weeks, report regretting the commitment when surveyed, but then six months later purchase the same commitment again. We begin with the first question on preference reversal. There is a clear conflict between the ex-ante purchase and the ex-post non-attendance, driven by the proximity of the effort required to go to the gym. This passes the first step. The second question asks about stability. The users rebuy the commitment six months later, indicating the long-term preference for fitness is stable across cycles. This passes the second step. We move to the third question on regret. The prompt explicitly states users report regretting the commitment when surveyed. This is a critical failure condition for our procedure. The regret is not just about failing to go; it is about the commitment itself. This means the device is causing welfare loss, likely through sunk cost stress or financial pain from unused services. Even though they rebuy later, suggesting optimism bias, the ex-post experience is negative. The procedure stops here. We tell the client not to build a harder commitment mechanism, such as making the contract non-refundable or adding penalties. Doing so would amplify the regret and potential harm. The problem is not a lack of binding power; it is unrealistic goal setting fueled by optimism bias. The users are paying for a fantasy self. A harder lock would not make them go to the gym; it would just make them feel worse about not going. The recommendation is to intervene at the goal-setting stage, perhaps by encouraging monthly commitments instead of six-month blocks, aligning the contract length with the user's actual demonstrated consistency. This reduces the magnitude of the regret cycle without removing agency.

  In both cases, the procedure leads to a recommendation against the hard commitment device the client likely expects. In the savings case, the missing evidence of regret prevents us from justifying paternalism. In the fitness case, the presence of regret about the constraint itself warns us that the device is harmful. You must be prepared to deliver this news firmly. Clients often equate behavioral design with restriction, but our ethical obligation is to user welfare, not just goal completion. If the theory suggests the user is rationalizing a preference change or suffering from the constraint, building the feature is malpractice. There are times when the procedure will hand off to human review, specifically when users beg for a lock but hate it once locked. In those instances, do not make the call yourself. Escalate it. But in the two cases above, the data provided is sufficient to make a call. Do not build the hard locks. Offer friction in the savings app and offer better calibration in the fitness app. This maintains our integrity as consultants who understand the difference between helping users help themselves and simply locking them into contracts they will resent. If the client pushes back, remind them that a commitment device only works if the user wants to be committed more than they want to escape. In the savings case, they escape. In the fitness case, they resent the cage. Neither is a foundation for a sustainable product feature.

  There is one final limitation you must keep in mind when presenting these findings. This procedure assumes the product team can accurately measure regret and preference stability. In reality, survey data on regret is noisy, and behavioral cycles can take months to observe. If the client does not have the data to answer these questions, you cannot run the procedure. You must tell them to gather the data first. Do not guess. Building commitment devices on assumptions about user psychology is how we end up with dark patterns that exploit vulnerability rather than alleviating it. If you cannot verify the preference reversal or the welfare impact, the default position must be no commitment device. It is better to leave a user free to fail than to bind them to a path we cannot verify is their own. This concludes the procedure and its application to the current cases. Follow this logic for all future requests and escalate any ambiguities regarding values rather than facts.
