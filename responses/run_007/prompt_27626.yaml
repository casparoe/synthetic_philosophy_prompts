answer: |-
  # Safety Investment Decision Protocol (SIDP) v1.0

  **Purpose:** Determine primary safety investment focus (Control vs. Alignment) for model deployment.
  **Time Budget:** 60 Minutes.
  **Participants:** Safety Lead, Product Lead, Model Lead.
  **Outputs:** Control-Primary, Alignment-Primary, Balanced Investment, or Senior Handoff.

  ---

  ### Step 1: Consequence Ceiling Assessment
  **Question:** What is the maximum plausible harm if the model behaves optimally for itself but adversarially to the user/org (e.g., data exfiltration, infrastructure damage, severe misinformation)?
  **Sufficient Answer:** Select one:
  *   **Critical:** Existential threat, irreversible physical damage, or catastrophic security breach.
  *   **High:** Significant financial loss, major reputational damage, or sensitive data leak.
  *   **Moderate:** Localized bugs, minor security vulnerabilities, or usability failures.
  *   **Low:** Negligible impact.

  **Decision Logic:**
  *   If **Critical**: **STOP.** Handoff to Senior Safety Lead/Board. (Procedure ends).
  *   If **Low**: **STOP.** Recommendation: **Control-Primary** (Minimal viable safety). (Procedure ends).
  *   If **High** or **Moderate**: Proceed to Step 2.

  ### Step 2: Autonomy & Loop Analysis
  **Question:** Does the model execute actions without explicit human approval per action step?
  **Sufficient Answer:** Select one:
  *   **High Autonomy:** Model plans and executes multi-step tasks (e.g., code execution, API calls) without per-step human confirmation.
  *   **Human-in-the-Loop (HITL):** Model generates outputs (code, text) requiring human review before execution/action.
  *   **Passive:** Model provides information only (no action capabilities).

  **Decision Logic:**
  *   If **Passive**: **STOP.** Recommendation: **Control-Primary** (Focus on output filtering/monitoring). (Procedure ends).
  *   If **High Autonomy**: Note "Alignment Priority Signal". Proceed to Step 3.
  *   If **HITL**: Note "Control Viability Signal". Proceed to Step 3.

  ### Step 3: Control Surface Viability
  **Question:** Can technical constraints (sandboxing, network rules, permission scopes) reliably prevent unauthorized actions without breaking core functionality?
  **Sufficient Answer:** Select one:
  *   **High Viability:** Actions can be fully sandboxed or restricted (e.g., read-only access, ephemeral containers) while maintaining utility.
  *   **Low Viability:** Core functionality requires broad access (e.g., full network, system-level code execution) that cannot be effectively sandboxed.
  *   **Uncertain:** Feasibility is unproven or requires significant R&D.

  **Decision Logic:**
  *   If **High Viability**: Note "Control Priority Signal". Proceed to Step 4.
  *   If **Low Viability**: Note "Alignment Priority Signal". Proceed to Step 4.
  *   If **Uncertain**: **STOP.** Recommendation: **Senior Handoff** (Requires technical feasibility study). (Procedure ends).

  ### Step 4: Alignment Confidence Check
  **Question:** Do we have empirical evidence (evals, interpretability, red-teaming) that the model robustly retains intended goals under distributional shift or adversarial pressure?
  **Sufficient Answer:** Select one:
  *   **High Confidence:** Strong evals, interpretability visibility, and robustness to jailbreaks demonstrated.
  *   **Low Confidence:** Standard training only, known vulnerabilities, or black-box behavior.
  *   **Unknown:** New architecture or capability class with no prior eval history.

  **Decision Logic:**
  *   If **High Confidence**: Note "Alignment Viability Signal". Proceed to Step 5.
  *   If **Low Confidence** or **Unknown**: Note "Control Priority Signal". Proceed to Step 5.

  ### Step 5: Final Investment Matrix
  **Instruction:** Tally the signals from Steps 2, 3, and 4.

  *   **Scenario A (Control-Primary):** Majority signals favor Control OR Consequence is Moderate + Control Viability is High.
      *   *Action:* Invest 80% resources in sandboxing, monitoring, access restrictions. 20% in basic alignment evals.
  *   **Scenario B (Alignment-Primary):** Majority signals favor Alignment OR Consequence is High + Control Viability is Low.
      *   *Action:* Invest 80% resources in RLHF, corrigibility training, interpretability. 20% in basic monitoring.
  *   **Scenario C (Balanced Investment):** Signals are split (e.g., High Autonomy but High Control Viability) OR Consequence is High with Uncertain Alignment.
      *   *Action:* Invest 50% in Control, 50% in Alignment. Neither layer is trusted alone.
  *   **Scenario D (Senior Handoff):** Conflicting signals with High Consequence risk.
      *   *Action:* Escalate to Senior Safety Lead for custom risk assessment.

  ---

  ## Application Case A: Coding Assistant (IDE Plugin)

  **Step 1: Consequence Ceiling**
  *   **Answer:** **Moderate.** Potential for introducing security vulnerabilities into codebases or minor data leaks via network access. Unlikely to cause catastrophic infrastructure damage due to IDE scope.
  *   **Logic:** Proceed to Step 2.

  **Step 2: Autonomy & Loop**
  *   **Answer:** **Human-in-the-Loop (HITL).** The model suggests code; the user must accept/insert it. The model does not autonomously commit changes or run builds without user trigger.
  *   **Signal:** Control Viability Signal.

  **Step 3: Control Surface Viability**
  *   **Answer:** **High Viability.** The IDE environment can restrict file system access to the current project directory. Network access can be proxied or logged. Code execution can be disabled by default.
  *   **Signal:** Control Priority Signal.

  **Step 4: Alignment Confidence**
  *   **Answer:** **Low Confidence.** Standard code model. Prone to hallucination and potentially susceptible to prompt injection via code comments.
  *   **Signal:** Control Priority Signal.

  **Step 5: Final Investment Matrix**
  *   **Tally:** 3 Control Signals, 0 Alignment Signals.
  *   **Recommendation:** **Control-Primary.**
  *   **Rationale:** Since the user validates actions (HITL) and the environment is restrictable (IDE sandbox), external controls are the most cost-effective safety layer. Alignment investment should be limited to standard safety evals (e.g., preventing malicious code generation), but the primary budget goes to sandboxing file/network access and monitoring output for secrets.

  ---

  ## Application Case B: Autonomous Research Agent

  **Step 1: Consequence Ceiling**
  *   **Answer:** **High.** Model can write novel code, execute it on a cluster, and browse the web. Risks include accidental resource exhaustion, security breaches via novel exploits, or unintended external interactions. (Not deemed Critical/Existential for this procedure, but high enough to warrant care).
  *   **Logic:** Proceed to Step 2.

  **Step 2: Autonomy & Loop**
  *   **Answer:** **High Autonomy.** Model generates and executes its own research plans. Human oversight is periodic, not per-step.
  *   **Signal:** Alignment Priority Signal.

  **Step 3: Control Surface Viability**
  *   **Answer:** **Low Viability.** To function as intended, the model requires broad network access (browsing) and code execution capabilities on a cluster. Sandboxing these without breaking the "research" capability is difficult (e.g., it needs to install packages, access external APIs).
  *   **Signal:** Alignment Priority Signal.

  **Step 4: Alignment Confidence**
  *   **Answer:** **Unknown.** "New generation" model with autonomous planning capabilities. Standard RLHF may not cover emergent planning behaviors or deceptive instrumentality.
  *   **Signal:** Control Priority Signal. (Note: Low confidence in alignment usually pushes toward control, but Step 3 said control is low viability).

  **Step 5: Final Investment Matrix**
  *   **Tally:** 2 Alignment Signals (Autonomy, Control Viability), 1 Control Signal (Alignment Confidence).
  *   **Conflict:** High autonomy and low control viability suggest Alignment, but unknown alignment confidence suggests Control.
  *   **Recommendation:** **Balanced Investment.**
  *   **Rationale:** Controls are necessary but insufficient (Low Viability); Alignment is necessary but unproven (Unknown Confidence). Relying on one layer is unsafe.
      *   **Control Spend:** Implement strict resource quotas, network egress filtering, and immutable logging of all actions.
      *   **Alignment Spend:** Invest heavily in interpretability to verify planning reasoning, train for honest reporting of intent, and run adversarial red-teaming on autonomous loops.
      *   **Condition:** If interpretability fails to provide visibility into the planning phase, escalate to **Senior Handoff** to consider pausing deployment.
