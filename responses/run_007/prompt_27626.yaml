      *   *Correction:* Ensure the "Both" recommendation isn't just "do everything" but acknowledges the trade-off (e.g., "Primary focus X, secondary Y"). Actually, the prompt asks where it prescribes investing in *both*. I will interpret this as "Balanced Investment" vs "Primary Focus".
      *   *Correction:* Ensure the "Human Judgment" handoff is clear for edge cases.

      *Let's structure the procedure as a "Safety Investment Decision Protocol (SIDP)".*

      *Step 1: Harm Ceiling.*
      *Step 2: Agency Level.*
