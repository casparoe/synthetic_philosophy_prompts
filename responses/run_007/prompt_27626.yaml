      *   **Role:** Safety team lead at a mid-sized AI lab.
      *   **Task:** Create a reusable decision procedure (roughly 1-hour execution time) to decide between investing primarily in *Control Measures* (sandboxing, monitoring, restrictions, filtering) vs. *Alignment Measures* (training for corrigibility, honesty, values, interpretability).
      *   **Requirements:**
          *   Specify questions to ask in order.
          *   Define what counts as a sufficient answer at each step.
          *   Define stop conditions with clear recommendations (Control, Alignment, Both, or Human Judgment).
          *   Apply the procedure to two specific cases:
              *   (a) Coding assistant in IDE (file-system/network access).
              *   (b) Autonomous research agent (self-planning, code execution, web browsing).
          *   **Constraint:** Begin with the procedure itself, with *no preface or commentary*.

  2.  **Deconstruct the Decision Problem:**
      *   **Control Measures:** External constraints. Good for limiting immediate harm, containing capabilities, preventing unauthorized actions. Failure mode: Bypass/jailbreak, unforeseen loopholes, usability friction.
      *   **Alignment Measures:** Internal constraints. Good for ensuring intent matches user intent, robustness to distributional shift, honest reporting. Failure mode: Deceptive alignment, specification gaming, slow progress/uncertainty.
      *   **Key Factors:** Capability level, autonomy level, access level, stakes of failure, feasibility of control, feasibility of alignment.
      *   **Time Constraint:** ~1 hour. This means the procedure must be high-level, checklist-style, not deep technical audit.

  3.  **Drafting the Procedure:**
      *   *Step 1: Risk & Stakes Assessment.* How bad is it if things go wrong? (High stakes -> need both/alignment).
      *   *Step 2: Autonomy & Loop.* Is the model acting alone or with human-in-the-loop? (High autonomy -> need alignment).
      *   *Step 3: Control Feasibility.* Can we effectively sandbox/monitor? (Low feasibility -> need alignment).
      *   *Step 4: Alignment Feasibility.* Do we have confidence in the training methods? (Low confidence -> need control).
      *   *Step 5: Decision Matrix.* Combine answers to recommend Control, Alignment, Both, or Escalate.

      *Refining the Steps for Speed & Clarity:*
