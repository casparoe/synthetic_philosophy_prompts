      *   Procedure first? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop conditions/recommendations? Yes.
      *   Handoff points? Yes.
      *   Apply to Case A & B? Yes.

  7.  **Writing the Content:** (Self-Correction during drafting)
