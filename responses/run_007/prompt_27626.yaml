      *   **Case B (Auto Researcher):** Self-planning, execution, web. Human-out-of-loop potentially. Stakes: High (unbounded actions, novel code). Control: Hard (needs access to function). Alignment: Critical (intent must be robust).

  5.  **Refining the Procedure for the "1 Hour" Constraint:**
      *   Keep questions binary or ternary (High/Med/Low).
      *   Ensure the logic flows quickly.
      *   Explicitly state when to stop.

  6.  **Final Review against Constraints:**
