  ### 1. The Specific Issue: "The Problem of Disparate Harms"
  While the broad field is **The Aggregation Problem**, the specific sub-problem you are describing is often referred to as **The Problem of Disparate Harms** or **The Aggregation of Trivial Harms**.

  In technical terms, the question is about **Commensurability**.
  *   **Commensurability:** The idea that different values (or harms) can be measured on a single scale and traded off against one another.
  *   **Incommensurability:** The view that certain values (like life vs. minor inconvenience) are of such different *kinds* that they cannot be measured on the same scale, no matter how many of the smaller ones you add up.

  When you ask about the "eligibility" of harms to be aggregated, you are asking about the **Conditions of Commensurability**. Your intuition is that harms are only commensurable (and thus eligible for aggregation) if they are **relevantly similar** in magnitude and kind.

  ### 2. The View: "The Individualist Restriction" & "Lexical Thresholds"
  You asked if there is a name for the view that you can only aggregate claims of the same kind and magnitude. There are two main labels for this position:

  **A. The Individualist Restriction (T.M. Scanlon)**
  The most famous formulation of your intuition comes from the philosopher **T.M. Scanlon** in his book *What We Owe to Each Other* (1998).
  *   **The View:** Scanlon argues that we should evaluate moral principles by asking if any individual could "reasonably reject" them.
  *   **The Restriction:** He proposes an **Individualist Restriction on Aggregation**. This rule states that you cannot aggregate the smaller complaints of many people to override the single, significantly stronger complaint of one person.
  *   **Application:** In your insurance example, the one employee facing a lack of treatment has a "stronger complaint" than any individual employee facing a $3 cost. Under Scanlon's view, the million small complaints do not sum up to outweigh the one big complaint. However, in the Trolley Problem (5 deaths vs. 1 death), the complaints are of the *same magnitude* (death), so aggregation is permitted.

  **B. Lexical Thresholds (or Discontinuous Value)**
  In decision theory and value theory, this is called a **Lexical View** or **Lexical Priority**.
  *   **The Concept:** Inspired by Rawls, this view holds that certain values have "lexical priority" over others. No amount of a lower-order good (slight blurriness) can ever outweigh a higher-order good (preventing blindness).
  *   **The Threshold:** This implies a **Threshold Constraint** on aggregation. Harms are eligible to aggregate only if they are above a certain threshold of severity relative to the competing harm. Below that threshold, they are morally "invisible" in the face of the catastrophic harm.

  ### 3. The "Eligibility" Condition: The Relevance View
  You specifically asked about the conditions that make harms "eligible." In recent literature (work by philosophers like **Frances Kamm**, **Michael Otsuka**, and **Alex Voorhoeve**), this is often discussed under the banner of **Relevance**.

  *   **The Relevance Constraint:** This position holds that for claims to be aggregated, they must be *relevantly comparable*. A claim is only relevant to a competing claim if it is of a similar type and magnitude.
  *   **Frances Kamm:** In her work (e.g., *Intricate Ethics*), Kamm argues that we must look at the **balance of claims**. She suggests that "irrelevant" utilities (like saving a penny for a million people) cannot be used to justify violating a significant right or interest of one person. She distinguishes between **aggregation** (summing up similar claims) and **balancing** (weighing different claims), arguing that aggregation is only permissible within the former category.

  ### 4. The Counter-Problem: "The Continuum Problem"
  There is a reason this debate is still unresolved. If you adopt the view that "tiny harms don't aggregate against catastrophic harms," you immediately face a logical puzzle known as **The Continuum Problem** (or the **Ethical Sorites**).

  *   **The Puzzle:** If 1 million headaches don't outweigh 1 death, do 1 billion? If not, do 1 trillion? At what specific number does the aggregation become permissible?
  *   **The Challenge:** If you say "never," you seem implausible (surely *enough* headaches justify saving a life). If you say "there is a number," you have to explain where the line is drawn and why *that* specific number matters. This is the main weapon used by **Aggregative Consequentialists** (like **Alastair Norcross**) against the view you hold. Norcross famously argues in *Comparing Harms: Headaches and Human Lives* that refusing to aggregate is irrational because it implies a "magical" threshold where value suddenly jumps.

