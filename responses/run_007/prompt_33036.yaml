      *   It's a non-constructive existence proof.
      *   It applies to symmetric, finite, perfect information, no-draw games (usually).

  3.  **Deconstruct the Argument (The "Carving"):**
      *   *What does it prove?* It proves that the first player (P1) has a winning strategy (or at least cannot lose). It does *not* tell you what the move is.
      *   *What are the necessary conditions?*
          1.  **Finite Game:** Must end (no infinite loops).
          2.  **Perfect Information:** No hidden cards/dice.
          3.  **No Draws:** The game must end in a win for one side. (Or, P1 can force at least a draw).
          4.  **Symmetry (of available moves/board):** P2's potential moves must be a subset of P1's potential moves after P1's extra move.
          5.  **Monotonicity (The "Harmless Move" condition):** Having an extra piece on the board is never a disadvantage. This is the crucial, often implicit assumption.

  4.  **Analyze the "Harmless Move" Condition (Monotonicity):**
      *   In Hex: Having an extra stone is always good (connects things). You can't block yourself.
      *   In Chomp: Eating an extra square is always good (reduces the poison options). You can't un-eat a square.
      *   In Chess: Having an extra piece *can* be bad (self-block, zugzwang). Moving a pawn might open a line for the opponent.
      *   In Go: Having an extra stone can be bad (liberties, capturing races, ko threats).
      *   *Key Term:* **Monotonicity** or **Non-interference**. The extra move doesn't restrict future options in a way that helps the opponent more than it helps you.

  5.  **Address Specific User Questions:**
      *   *Name:* Strategy-Stealing Argument.
      *   *Condition doing the real work:* Monotonicity (extra move is never a disadvantage).
