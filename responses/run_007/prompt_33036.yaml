answer: |-
  The argument you are describing is known in combinatorial game theory as the **Strategy-Stealing Argument**.

  You have correctly intuited the shape of the logic and its limitations. It is one of the most elegant non-constructive proofs in mathematics, but its applicability is indeed bounded by specific structural properties of the game.

  Here is the carving you are looking for: what the argument proves, the specific condition that does the heavy lifting, and where it breaks.

  ### 1. The Name and The Proof
  **Name:** The Strategy-Stealing Argument.
  **Status:** Non-constructive existence proof.

  It proves that **a winning strategy exists for the first player**, but it provides absolutely no information about *what* that strategy is. In the case of Hex, we know with mathematical certainty that the first player has a forced win on any board size, but for a $19 \times 19$ board, we have no idea what the opening move should be.

  ### 2. The Crucial Condition: Monotonicity
  You suspected the argument depends on the opening move being "harmless or beneficial." In technical terms, this condition is called **Monotonicity** (or sometimes **Non-Interference**).

  For the strategy-stealing argument to hold, **having an extra piece on the board must never be a disadvantage.**

  Here is why this is the load-bearing wall:
  1.  Player 1 (P1) makes an arbitrary opening move $m$.
  2.  P1 pretends to be Player 2 (P2) and attempts to execute P2's hypothetical winning strategy $S$.
  3.  If $S$ calls for a move $x$, and $x$ is empty, P1 plays $x$.
  4.  **The Critical Step:** If $S$ calls for a move $x$, and $x$ is *already occupied* by P1's opening move $m$, P1 makes an arbitrary move $y$ instead.

  This logic only holds if having a piece at $x$ (from the opening move) plus a piece at $y$ (the arbitrary substitute) is **at least as good** as having a piece only at $y$ (as the strategy intended).

  *   **In Hex:** Stones only help connect chains. An extra stone is never an obstacle. The game is monotonic.
  *   **In Chomp:** Eating a square removes options. Having already eaten a square (the opening move) only reduces the board further, which is always in the direction of winning. The game is monotonic.
  *   **In Chess/Go:** Pieces can block lines of sight, reduce liberties, or create self-blockades. An extra piece can be a liability. The game is **not** monotonic.

  ### 3. Why It Fails for Chess and Go
  The argument fails in Chess and Go precisely because of **Zugzwang** and **Obstruction**.

  *   **Obstruction:** In Go, placing a stone reduces the liberties of your own group. If your strategy requires a liberty to be open, your "extra" opening stone might have closed it, rendering the stolen strategy invalid.
  *   **Zugzwang:** In Chess, there are positions where the obligation to move is a disadvantage. If P1 makes an arbitrary opening move, they might force themselves into a zugzwang state that P2 (in the hypothetical scenario) would not have been in. Because P1 cannot "pass," the extra move changes the fundamental value of the position in a way that isn't strictly positive.

  **Simplest Failure Case (Toy Game):**
  Imagine a game played on a $3 \times 3$ grid.
  *   **Rule:** Players place a token on an empty square.
  *   **Win Condition:** The first player to complete a row of 3 tokens **loses** (Misère Tic-Tac-Toe).
  *   **Why Strategy-Stealing Fails:** If P1 places a token in the center, they have restricted their own future options. In Misère games, having "more pieces on the board" is often a disadvantage because it brings you closer to the losing condition. The monotonicity assumption is inverted.

  ### 4. Draws and Misère Play
  You asked how the argument behaves under draws or misère conditions.

  **Draws:**
  If the game allows for draws, the strategy-stealing argument **cannot prove a forced win.** It can only prove that **the first player cannot lose.**
  *   *Logic:* If P2 had a forced *win*, P1 could steal it. Therefore, P2 does not have a forced win. This leaves two possibilities: P1 has a forced win, or both players can force a draw.
  *   *Example:* Tic-Tac-Toe. Strategy stealing proves P1 can force at least a draw. (We know from analysis that optimal play leads to a draw, so the argument hits its ceiling here).

  **Misère Play:**
  The argument generally **collapses completely** in misère play (where the last player to move loses).
  *   *Logic:* The argument relies on the extra move being an asset. In misère play, moves are liabilities (you want to run out of moves). Making an "arbitrary" opening move puts you closer to losing.
  *   *Example:* Nim. In normal play, the strategy is well-defined. In misère Nim, the strategy changes fundamentally near the end of the game. A strategy-stealing argument would incorrectly suggest P1 always wins, which is false.

  ### 5. Summary of the Boundary
  To determine if the strategy-stealing argument applies, check these three boxes:

  1.  **Finite, Perfect Information, No Chance:** (Standard for combinatorial games).
  2.  **Symmetric Availability:** P1 must have access to the same set of moves as P2 (after the first turn).
  3.  **Monotonicity (The Real Work):**
      *   Does having an extra piece on the board ever restrict your legal moves? (If Yes $\rightarrow$ Fails, e.g., Chess/Go).
      *   Does having an extra piece on the board ever bring you closer to a losing condition? (If Yes $\rightarrow$ Fails, e.g., Misère play).
      *   Is a draw impossible? (If No $\rightarrow$ Weakens to "P1 cannot lose").

  ### 6. Constructive vs. Existential
  It is worth emphasizing your suspicion that this yields "merely an existence proof." This is a feature, not a bug. The argument is logically equivalent to a proof by contradiction that relies on the Law of Excluded Middle. It tells us the solution space is not empty, but it gives no coordinates for the solution.

  In computational complexity terms, the strategy-stealing argument places the game in a class where we know the outcome class (First-player win) without knowing the complexity of finding the move. For Hex, finding the actual winning move is PSPACE-complete, despite us knowing one exists for all board sizes.

  ### The "Carving" in a Nutshell
  The argument works when **the set of available moves is symmetric** and **the value of a position is monotonic with respect to piece count.**

  It stops applying the moment **a piece can act as an obstacle** or **a move can be a liability.** That is the precise boundary between Hex/Chomp and Chess/Go.
