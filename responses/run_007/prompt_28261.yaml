      *   *Haynes/fMRI studies:* Decoding decisions seconds before awareness. (Similar logic to Libet but different modality).
      *   *Status:* Schurger is a strong challenge but not universally accepted as the final word. Veto power is empirically hard to test (how do you measure an action *not* taken?).

