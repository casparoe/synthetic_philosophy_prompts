      *   *Measurements:* EMG (movement onset), EEG (Readiness Potential), Subjective report (W-time, using a clock).
      *   *Key Finding:* RP onset (~550ms before movement) precedes W-time (~200ms before movement).
      *   *Status:* This is the settled empirical data (with caveats about measurement error).

  3.  **Address Part (a): The Readiness Potential (RP) and Epiphenomenalism:**
      *   *What is it?* Slow negative shift in EEG over motor cortex (SMA/pre-SMA).
      *   *Early vs. Late:* Early RP (Type I) is bilateral/non-specific. Late RP (Type II) is lateralized/specific to the hand moving.
      *   *Significance:* If early RP is just noise/fluctuation, it doesn't imply a specific decision yet. If it's a specific preparation, it implies unconscious initiation.
      *   *Epiphenomenalism:* The claim that consciousness causes nothing. Libet's data suggests the *initiation* is unconscious. But does it rule out *veto*?
      *   *Distinction:* Empirical fact = RP precedes W. Interpretation = Unconscious causation. Contested = Whether RP *is* a decision.

  4.  **Address Part (b): Assumptions of the Standard Interpretation:**
      *   *Timing Accuracy:* Can subjects report W-time accurately? (Libet argued yes, validation studies exist, but memory/reconstruction biases are possible).
