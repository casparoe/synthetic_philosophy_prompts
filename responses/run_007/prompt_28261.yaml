      *   *Spontaneity:* Is a random wrist flick a model for meaningful free will? (Ecological validity).
      *   *Status:* These are philosophical/interpretative assumptions, not empirical facts.

  5.  **Address Part (c): Later Findings and Reinterpretations:**
      *   *Schurger et al. (2012):* RP might be accumulation of neural noise to a threshold, not a specific command. This undermines the "unconscious decision" claim.
