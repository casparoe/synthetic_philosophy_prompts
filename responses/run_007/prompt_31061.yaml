answer: |-
  I am much obliged to you for this clarification; it is indeed a most elegant distinction you draw between a *proposition* and a *license*. It sounds very profound, and I have no doubt it satisfies many minds. But you know I am a little slow of apprehension, and I require everything to be set down clearly in my notebook before I can feel quite easy about it.

  You say that Modus Ponens is built into the very meaning of "if... then." That is to say, you assert as a fact that *anyone who understands the conditional accepts the inference.* Is that correct?

  Very well. Let us write that down as a new proposition. Let us call it **(C)**: *"If one understands the conditional, one accepts Modus Ponens."*

  Now, look at what we have in the notebook:
  **(A)** Things that are equal to the same are equal to each other. (Or whatever premises you like.)
  **(B)** If A is true, then Z is true.
  **(C)** If one understands the conditional, one accepts Modus Ponens.

  I am willing to accept (C) as true, since you say it is constitutive of meaning. But I must ask you: now that I have accepted (A), (B), and (C), am I logically forced to accept **(Z)**?

  You see, I might say, "I understand the conditional, I accept (A) and (B), and I accept (C) as a true statement about language... but I still do not see why I must write down (Z)." I have the license, as you call it, described in proposition (C), but I do not see the *act* of licensing taking place.

  If you say that (A), (B), and (C) together *do* force me to accept (Z), then surely there must be some connection between those three propositions and the conclusion? And if that connection is not itself a proposition, but another "license," then pray, why was the first license allowed to be written down as (C), but this second one remains invisible?

  If it is a truth that "(A), (B), and (C) imply Z," must I not write *that* down as well, before I can move? I am eager to learn, but I cannot step forward until the path is written.
