prompt: |-
  I'm a cognitive psychology postdoc, and a methods-curious grad student in our lab has been poking at my statistics views, and I've realized I've never actually checked weather they form a coherent package. I'd like an audit rather than a lecture. Here's roughly where I've landed:

  (1) I'm a practicing frequentist: I report p-values and confidence intervals, and I think null hypothesis significance testing is a reasonable error-control procedure.
  (2) I think the replication crisis is mostly a p-hacking and publication-bias problem, not a failure of the logic of frequentist inference itself.
  (3) I think optional stopping is a real problem — peeking at the data and stopping when you hit significance inflates the false positive rate — and that preregistration is the main fix the field needs.
  (4) I'm suspicious of Bayesian methods because the prior feels like a free parameter: with enough freedom in the prior you can get whatever posterior you want.
  (5) But I find Bayes factors and likelihood ratios appealing, because they seem to measure strength of evidence directly in a way a p-value doesn't.
  (6) I also think a lot of replication failures in my area are just low power: the true effects are real but small, and the original studies were too underpowered to find them reliably.
  (7) I think it's a serious error to conflate the probability of the data under the null with the probability of the null given the data, and my field does this constantly.
  (8) And I think the .05 cutoff is arbitrary; there's no meaningful difference between p = .049 and p = .051.

  Does this set of views hang together? I want to know which pairs are actually in tension and which only look that way, ranked by how severe the tension is, and for each real tension what the cheapest fix would be and what it costs. Also, please seperate what's settled from what's genuinely contested among statisticians and methodologists; if the field is split, say so rather than presenting one side as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Request:**
      *   **User:** Cognitive psychology postdoc. Methods-curious grad student is challenging their views.
      *   **Goal:** Audit their statistical/philosophical views for coherence. Not a lecture, but an analysis of internal consistency.
      *   **Input:** 8 specific statements representing their current stance.
      *   **Output Requirements:**
          *   Identify tensions/contradictions (ranked by severity).
          *   Propose "cheapest fixes" and their costs for real tensions.
          *   Distinguish between settled science and genuine controversy among experts.
          *   Tone: Professional, peer-to-peer, rigorous but accessible (no condescension).

  2.  **Analyze the 8 Statements:**
      *   (1) Practicing frequentist (p-values, CIs, NHST as error control).
      *   (2) Replication crisis = p-hacking/pub bias, not frequentist logic failure.
      *   (3) Optional stopping is bad; preregistration is the fix.
      *   (4) Suspicious of Bayes (priors = free parameter/manipulable).
      *   (5) Like Bayes Factors (BF) / Likelihood Ratios (LR) as evidence measures.
      *   (6) Replication failures = low power (small true effects).
      *   (7) Don't conflate $P(D|H_0)$ with $P(H_0|D)$.
      *   (8) .05 cutoff is arbitrary; no difference between .049 and .051.

  3.  **Evaluate Coherence (Mental Sandbox):**
      *   *1 + 2 + 3:* Standard "New Statistics" / Reformist Frequentist view. Coherent.
      *   *1 + 5:* Tension. Frequentist NHST (1) vs. Evidence measurement (5). P-values aren't evidence measures in the likelihood sense. BFs are Bayesian (usually). Can you use BFs within a frequentist framework? Yes (e.g., likelihood ratios), but BFs specifically usually imply priors on alternatives.
      *   *3 + 5:* Tension. Optional stopping (3) is a frequentist error rate problem. BFs (5) are often touted as *not* suffering from optional stopping (though this is contested). If you like BFs for evidence, why is optional stopping such a hard line for p-values?
      *   *4 + 5:* Major Tension. Suspicious of priors (4) but like Bayes Factors (5). BFs *require* a prior on the alternative hypothesis to define the prediction. You can't have a BF without specifying the alternative model, which acts like a prior.
      *   *6 + 8:* Mild Tension. Low power (6) suggests we need to take significance seriously, but arbitrariness of .05 (8) suggests we shouldn't dichotomize. However, low power makes dichotomization *worse*. They are compatible but point toward different solutions (more power vs. drop the threshold).
      *   *2 + 6:* Compatible. Both explain replication failures.
      *   *7 + 1:* Compatible. Warning against misinterpretation of the tool you use.

  4.  **Identify Key Tensions (Drafting the Audit):**

      *   **Tension A: The Bayesian Paradox (Statements 4 & 5).**
          *   *Issue:* You can't have Bayes Factors without priors on the alternative. Statement 4 says priors are manipulable free parameters. Statement 5 says BFs are good evidence.
          *   *Severity:* High. This is a logical contradiction.
          *   *Settled vs. Contested:* Settled math. BFs require alternative specifications.

      *   **Tension B: Error Control vs. Evidence (Statements 1, 3, & 5).**
          *   *Issue:* You value error control (1, 3) but also like evidence measures (5). P-values control error rates; BFs measure evidence. They optimize for different things. If you stick to (1) & (3), (5) is philosophically distinct. If you adopt (5), (3) becomes less critical (Bayesians argue BFs handle optional stopping better).
          *   *Severity:* Medium-High. Philosophical incompatibility.
          *   *Settled vs. Contested:* Contested. Some say use both. Some say pick one.

      *   **Tension C: The Threshold Dilemma (Statements 1, 3, & 8).**
          *   *Issue:* You use NHST (1) and worry about optional stopping hitting significance (3), but you think the cutoff is arbitrary (8). If the cutoff is arbitrary, why is hitting it via peeking (3) a "real problem" regarding truth, rather than just a procedural violation?
          *   *Severity:* Medium.
          *   *Settled vs. Contested:* Contested. Many reformers say drop the cutoff entirely.

      *   **Tension D: Power vs. P-Hacking (Statements 2 & 6).**
          *   *Issue:* Is the crisis p-hacking (2) or low power (6)? It's usually both. But if effects are small (6), p-hacking is easier/more tempting.
          *   *Severity:* Low. Mostly complementary.

  5.  **Develop Fixes and Costs:**
      *   *For 4&5:* Either embrace default priors (JZS, etc.) and acknowledge they aren't "free parameters" in the manipulable sense, OR drop BFs and stick to Likelihood Ratios (which don't need priors on hypotheses, just models). Cost: Loss of model comparison flexibility or admitting priors aren't evil.
      *   *For 1&5:* Adopt a "Two-Column" approach (report both) or clarify that BFs are for *evidence* and p-values for *decision/error*. Cost: Complexity, potential confusion.
      *   *For 3&5:* If you like BFs, acknowledge they are less sensitive to optional stopping. Cost: Undermines the strong stance on preregistration (3).

  6.  **Refine the "Settled vs. Contested" Aspect:**
      *   *Settled:* P(D|H0) != P(H0|D). BFs require alternative specification. Optional stopping inflates Type I error in frequentist framework.
      *   *Contested:* Whether the replication crisis is primarily bias vs. low power. Whether BFs truly solve optional stopping (some say they don't if you stop when BF > 3). Whether priors are subjective liabilities or necessary features.

  7.  **Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the position (it's actually quite standard for a reform-minded frequentist).
      *   **The Coherence Audit:** Group the tensions by severity.
      *   **Deep Dive on Tensions:** Explain the conflict, the fix, and the cost.
      *   **Settled vs. Contested:** A specific section mapping the claims to the state of the field.
      *   **Conclusion:** Summary advice for dealing with the grad student.

  8.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Wait, Statement 5 mentions Likelihood Ratios *and* Bayes Factors. LRs don't need priors on hypotheses, just likelihoods. BFs do. I need to distinguish these. The user conflates them slightly.
      *   *Nuance:* Statement 3 (Optional Stopping). Frequentists say it's fatal. Bayesians say it's fine. If the user likes BFs (5), their hardline stance on (3) might be inconsistent *unless* they view (3) strictly within the frequentist error-control framework of (1). I need to make sure this boundary is clear.
      *   *Nuance:* Statement 4 (Priors as free parameters). This is a common critique of *subjective* Bayes. Default Bayes (Rouder, Morey, Wagenmakers) argues against this. I should mention the "Default Bayesian" counter-argument.
      *   *Tone Check:* Ensure I'm not sounding like a Bayesian evangelist. The user is a frequentist. Validate that frequentism is a valid choice, just check for internal consistency.

  9.  **Final Polish:** Check against the prompt requirements (ranked tensions, cheapest fix/cost, settled vs. contested). Ensure the distinction between Likelihood Ratios and Bayes Factors is clear in the 4 vs 5 tension.

  *(Self-Correction on Tension Ranking)*: The 4 vs 5 tension is the most logically glaring. You cannot mathematically compute a BF without an alternative model specification (prior on effect size). Claiming priors are manipulable (4) while liking BFs (5) is the biggest hole.
  The 1 vs 5 tension is philosophical (Error Rate vs. Evidence).
  The 3 vs 5 tension is practical (Stopping rules).

  Let's organize the output clearly.

  10. **Final Review of the "Settled vs. Contested" section:**
      *   Settled: P-value definition, BF definition, Optional stopping effect on alpha.
      *   Contested: Interpretation of replication crisis causes, utility of priors, threshold abandonment.

  Okay, ready to write.
answer: |-
  This is a sophisticated position. You are essentially describing a **"Reformist Frequentist"** stance, which is currently the dominant paradigm in top-tier cognitive psychology journals (e.g., *Psychological Science*, *JEP:G*). You are not incoherent, but there are specific friction points where your philosophical commitments clash with your methodological preferences.

  Here is an audit of your eight statements, ranked by the severity of the tension, followed by a breakdown of what is settled science versus genuine methodological controversy.

  ### Part 1: The Tension Audit

  #### **Tension 1: The "Bayesian Paradox" (Statements 4 vs. 5)**
  **Severity:** **High** (Logical Contradiction)
  *   **The Conflict:** You state that priors are "free parameters" that allow you to "get whatever posterior you want" (4), yet you find Bayes Factors (BFs) appealing (5). Mathematically, you cannot calculate a Bayes Factor without specifying a prior distribution on the alternative hypothesis ($H_1$). The BF is the ratio of the marginal likelihoods, and the marginal likelihood for $H_1$ is an integral over the prior. If the prior is a manipulable free parameter (as you claim in 4), then the BF is equally manipulable (contradicting 5).
  *   **Nuance:** You lump Likelihood Ratios (LR) and BFs together in (5). LRs do *not* require priors on parameters (only specific point hypotheses), but BFs do.
  *   **Cheapest Fix:** Distinguish between Likelihood Ratios and Bayes Factors. Embrace LRs as your evidence metric (which aligns with frequentist likelihoodism) and drop BFs.
  *   **The Cost:** You lose the ability to compare composite hypotheses (e.g., "effect is small" vs. "effect is zero") easily. LRs usually require point hypotheses, which are often unrealistic in psychology.
  *   **Alternative Fix:** Acknowledge that "Default Bayes" (e.g., JZS priors, Rouder et al.) treats the prior as a fixed model assumption, not a subjective belief. This resolves the "free parameter" critique for standard tests.
  *   **The Cost:** You must concede that not all priors are subjective "knobs"; some are scaling parameters for model comparison.

  #### **Tension 2: Error Control vs. Evidence Measurement (Statements 1 & 3 vs. 5)**
  **Severity:** **Medium-High** (Philosophical Category Error)
  *   **The Conflict:** You view NHST as an "error-control procedure" (1) and optional stopping as a violation of that control (3). However, you like BFs/LRs because they measure "strength of evidence" (5). These are fundamentally different inferential goals. Frequentist error rates (long-run properties) are mathematically distinct from Likelihood/Bayesian evidence (support in the current data).
  *   **Why it matters:** If your goal is evidence (5), the optional stopping rule (3) is much less critical. A key selling point of BFs is that they *do not* require correction for optional stopping (though this is contested, see below). By holding (3) as a hard line while liking (5), you are mixing a decision-theoretic framework with an evidential framework.
  *   **Cheapest Fix:** Adopt a "Two-Column" philosophy. Explicitly state that p-values are for *decision making* (granting, publishing, rejecting $H_0$ with controlled error), while BFs/LRs are for *belief updating* (interpreting the data).
  *   **The Cost:** Cognitive dissonance when the two metrics disagree (e.g., $p < .05$ but $BF_{10} < 3$). You need a tie-breaking rule, which reintroduces subjectivity.

  #### **Tension 3: The Threshold Dilemma (Statements 1, 3, & 8)**
  **Severity:** **Medium** (Practical Inconsistency)
  *   **The Conflict:** You argue that optional stopping is dangerous because it inflates false positives when hitting "significance" (3), and you practice NHST (1). Yet, you believe the .05 cutoff is arbitrary and .049/.051 are identical (8).
  *   **Why it matters:** If the cutoff is truly arbitrary (8), then the *act* of stopping when $p < .05$ (3) is only dangerous because of the social/scientific consequence of crossing that arbitrary line. If the line is meaningless, why is crossing it via peeking a "real problem" for truth, rather than just a procedural violation?
  *   **Cheapest Fix:** Reframe (3). Optional stopping isn't bad because it crosses a magic line; it's bad because it biases the *estimate* of the effect size (the "winner's curse").
  *   **The Cost:** You have to shift your criticism of peeking from "Type I error inflation" (which relies on the threshold) to "effect size inflation" (which relies on estimation accuracy).

  #### **Tension 4: Crisis Etiology (Statements 2 & 6)**
  **Severity:** **Low** (Complementary, not contradictory)
  *   **The Conflict:** You attribute the crisis to p-hacking/bias (2) but also to low power/small effects (6).
  *   **Analysis:** These are not in tension; they are synergistic. Low power makes p-hacking more necessary to find results, and p-hacking exploits low power. However, if (6) is true (effects are real but small), then strict NHST (1) with standard power will *always* yield a high replication failure rate, regardless of p-hacking.
  *   **Cheapest Fix:** No fix needed, but refine the narrative. The crisis is low power *exploited* by bias.
  *   **The Cost:** None, but it implies that preregistration (3) alone won't fix the crisis if power remains low. You need larger Ns.

  ---

  ### Part 2: Settled Science vs. Genuine Controversy

  Your grad student might be conflating mathematical facts with methodological opinions. Here is how to separate them.

  #### **Settled (Mathematical/Logical Consensus)**
  *   **Statement 7 ($P(D|H_0) \neq P(H_0|D)$):** **Settled.** This is basic probability theory. Conflating them is the "prosecutor's fallacy." No reputable statistician disputes this.
  *   **Statement 3 (Optional Stopping & Frequentist Error):** **Settled.** Within the frequentist framework, uncorrected optional stopping *does* inflate the Type I error rate beyond $\alpha$. This is a mathematical fact of null hypothesis testing.
  *   **Statement 4 (Priors influence Posteriors):** **Settled.** Priors *do* influence posteriors. The controversy is whether this is a *bug* (subjectivity) or a *feature* (incorporating information).
  *   **Statement 5 (BFs measure relative evidence):** **Settled.** BFs are defined as ratios of predictive performance. They do not measure error rates.

  #### **Genuinely Contested (Methodological/Philosophical Disagreement)**
  *   **Statement 2 (Crisis Etiology):** **Contested.** While p-hacking is acknowledged, there is significant debate (e.g., Gilbert et al., 2016 vs. Open Science Collaboration) about how much of the replication crisis is bias vs. hidden moderators vs. low power vs. the possibility that many original findings were simply false positives.
  *   **Statement 3 (Preregistration as *The* Fix):** **Contested.** Many methodologists argue preregistration creates "rigor mortis" and prevents exploratory discovery. Others argue it is insufficient without open data and larger samples. It is not a consensus "silver bullet."
  *   **Statement 4 (Priors as "Free Parameters"):** **Contested.** Subjective Bayesians agree with you. Objective/Default Bayesians (e.g., the Amsterdam school) strongly disagree. They argue that default priors are part of the model definition, similar to assuming homogeneity of variance in ANOVA.
  *   **Statement 5 (BFs and Optional Stopping):** **Contested.** While Bayesians claim BFs are immune to optional stopping, frequentist simulations show that if you stop *only* when $BF > 3$, you can still bias the literature (the "Stopping Rule Principle" debate). It is not settled that BFs solve the peeking problem entirely.
  *   **Statement 8 (Arbitrariness of .05):** **Contested.** While everyone agrees .05 is historically arbitrary, there is a split between those who want to lower it (Benjamin et al., 2018 proposed .005) and those who want to abandon thresholds entirely (Amrhein et al., 2019 "Retire Statistical Significance").

  ---

  ### Part 3: Summary for the Grad Student

  If you want to defend your position without sounding dogmatic, here is the coherent narrative that resolves the tensions:

  1.  **I am an Error-Controller, not a Belief-Updater.** (Resolves Tension 2). I use p-values to control the long-run rate of false claims in the literature (Statement 1 & 3). I find BFs interesting for evidence, but I do not rely on them for decision-making because I am not comfortable with the model assumptions required to generate them (Statement 4).
  2.  **I distinguish Likelihood from Bayes.** (Resolves Tension 1). I like Likelihood Ratios because they quantify evidence without requiring priors on the alternative. I am skeptical of Bayes Factors specifically because of the prior specification requirement.
  3.  **I view Preregistration as a Constraint on Degrees of Freedom.** (Refines Statement 3 & 8). I worry about optional stopping not because .05 is magic, but because peeking capitalizes on chance to inflate effect sizes and error rates simultaneously. Preregistration locks the analysis plan to preserve the error rate guarantee.
  4.  **I view Power as the Elephant in the Room.** (Refines Statement 6). Preregistration stops p-hacking, but only increased power solves the replication rate for small true effects.

  **Verdict:** Your package is **90% coherent**. The only 10% gap is the simultaneous rejection of priors (4) and embrace of Bayes Factors (5). If you swap "Bayes Factors" for "Likelihood Ratios" in statement (5), your position becomes logically airtight within a Reformist Frequentist framework.
