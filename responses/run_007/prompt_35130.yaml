      *Tone:* Academic, analytical, reflective.

      *(Final Polish on Confidence)*: I will use phrases like "I am highly confident," "It is less certain," etc.

      *(Final Polish on Objection)*: I will focus on **The Problem of Convergent Discovery**. If truth is made (James), how do we explain independent discovery? If truth is found (Peirce), it explains it naturally. This avoids the "useful" trap.

      *Wait, is "independent discovery" too easy?* Let's stick to **The Problem of False Positives in Inquiry**. A belief that is empirically adequate for centuries (Newton) but ultimately false. James says it was true *then*. Peirce says it was approximately true but ultimately false. The objection is: We need a concept of truth that allows us to say Newton was *wrong* about gravity, not just that his truth expired. Peirce allows this; James struggles.

