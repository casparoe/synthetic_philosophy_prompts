answer: |-
  ### Higher-Level Stand: The False Dichotomy

  Before prioritizing specific questions, I must take a stand on the framing dilemma: **Is the priority refining the formal model or designing institutional remedies?**

  My position is that **this distinction breaks down under scrutiny.** The Unilateralist's Curse (UC) is not merely a mathematical curiosity; it is a mechanism design problem under epistemic uncertainty. A formal model that relaxes assumptions (e.g., allowing for signal correlation) *is* an institutional analysis, because it tells us whether we need to build institutions that enforce correlation (e.g., shared intelligence) or institutions that restrict action (e.g., veto powers). Conversely, proposing an institutional remedy without understanding the epistemic topology (e.g., how independent actors' signals really are) is policy malpractice.

  Therefore, the highest-leverage use of 5 person-years is **Epistemic Institutional Design**. The goal should not be to make the model "more realistic" for its own sake, nor to propose governance structures in a vacuum. The goal is to map specific epistemic conditions (signal independence, prior divergence, observability) to the *minimal* institutional constraints required to neutralize the curse. This approach ensures that every theoretical refinement directly informs a policy lever.

  ---

  ### Research Priority 1: Epistemic Robustness and Signal Correlation

  **The Question:** *Under what conditions of signal correlation and prior divergence does the Unilateralist's Curse vanish or become negligible?*

  The original Bostrom et al. (2016) model assumes independent signals and a common prior. In reality, actors in domains like AI or biosecurity read the same papers, attend the same conferences, and hire from the same pool. If signals are highly correlated, the probability that *only* the optimistic outliers act drops precipitously. Conversely, if priors diverge radically (e.g., ideological disagreement on risk), the curse may persist even with correlated signals.

  **1. Why is this upstream?**
  This is the "existence proof" question. If empirical or theoretical analysis shows that natural signal correlation in high-stakes domains is already sufficient to suppress the curse, then heavy-handed institutional intervention (like international treaties) may be unnecessary or even counterproductive (by stifling beneficial innovation). If, however, the curse persists under high correlation due to prior divergence, we know we must focus on *mediating priors* (deliberative forums) rather than just *pooling data*. The answer dictates whether we invest in intelligence sharing or normative alignment.

  **2. Tractability:**
  **High.** This requires extending the existing Bayesian framework to include correlated signals (e.g., using a common value component plus idiosyncratic noise) and heterogeneous priors. Tools from global games and information economics are readily available. The math is challenging but well-trodden; the innovation lies in parameterizing it for specific domains (e.g., estimating signal noise in AI capability forecasting).

  **3. Update Conditions:**
  *   **Move Up:** If a preliminary empirical survey of a domain (e.g., gain-of-function research) reveals that actors operate with near-zero information overlap (low correlation), this becomes the bottleneck. The theoretical work must immediately pivot to modeling extreme independence.
  *   **Move Down:** If the model demonstrates that even modest correlation ($\rho > 0.5$) reduces the risk of harmful unilateralism to acceptable levels, the team should deprioritize further formal refinement and shift resources to encouraging natural correlation (e.g., funding shared safety benchmarks).

  ---

  ### Research Priority 2: Incentive-Compatible Information Pooling

  **The Question:** *Can we design pre-action "clearinghouse" mechanisms where revealing private risk assessments is a dominant strategy?*

  Assuming the curse remains a threat (Priority 1 confirms it), the first line of defense is not banning action, but improving the information set. The UC arises because actors act on private information. If actors could credibly share their risk assessments before acting, they could aggregate signals and reach a consensus. However, actors have incentives to lie (e.g., to delay competitors or to rush ahead). We need a mechanism where truth-telling is optimal.

  **1. Why is this upstream?**
  This determines the *type* of institution we build. If a cheap, voluntary information-pooling mechanism works, we avoid the need for coercive enforcement (which is politically difficult and slow). If truth-telling cannot be incentivized without external enforcement, we know immediately that voluntary norms will fail and we must design verification/regulation regimes. It shifts the policy goal from "coordination" to "enforcement."

  **2. Tractability:**
  **Medium.** This is a classic mechanism design problem (specifically, Bayesian persuasion or cheap talk with verification). The difficulty lies in modeling the "action payoff" accurately. If the benefit of acting first (first-mover advantage) is too high, no information mechanism will work. The team would need to model the trade-off between the value of information and the value of speed.

  **3. Update Conditions:**
  *   **Move Up:** If theoretical results show that even small first-mover advantages break all voluntary pooling mechanisms, the team must immediately pivot to Priority 3 (enforcement). This is a critical "go/no-go" signal for voluntary governance.
  *   **Move Down:** If a specific mechanism (e.g., a "commitment to delay" in exchange for data access) proves robust in simulation, the team should move to prototyping this with real-world partners, effectively exiting pure theoretical work.

  ---

  ### Research Priority 3: Dynamic Thresholds vs. Veto Powers

  **The Question:** *In a sequential game where actors arrive over time, do $k$-out-of-$n$ threshold rules outperform unilateral veto powers?*

  If information pooling fails, we must restrict action. The literature often suggests "threshold rules" (e.g., 5 out of 10 labs must agree it is safe). However, in a dynamic setting, early actors might race to lock in a decision before later actors arrive, or later actors might free-ride on early safety testing. Alternatively, should any single actor have a veto? This question compares institutional topologies under dynamic pressure.

  **1. Why is this upstream?**
  This is the specific policy prescription. It moves from "we need coordination" to "we need a 70% supermajority rule" or "we need a unilateral veto." It addresses the temporal dimension of the curse, which is often ignored in static models. In AI, for example, capabilities arrive sequentially; a static rule might be bypassed by a latecomer. The answer dictates the voting rules of any new governance body.

  **2. Tractability:**
  **Medium-High.** This requires modeling sequential games with incomplete information. Social choice theory provides tools for threshold analysis, but combining it with the UC's epistemic constraints and dynamic entry is novel. It is more complex than Priority 1 but more concrete than Priority 2.

  **3. Update Conditions:**
  *   **Move Up:** If a real-world incident occurs where a "threshold" agreement was bypassed by a non-signatory (e.g., a state actor or non-lab entity), the model must be updated to account for open entry. This would make the theoretical work urgently relevant to closing loopholes.
  *   **Move Down:** If the field matures to a point where a central regulator is established (e.g., an international atomic energy-style agency for AI), the question shifts from "which rule among peers" to "how to regulate the regulator," changing the scope of the work.

  ---

  ### Summary of Strategy

  With 5 person-years, the team cannot solve all three fully. The recommended allocation is:

  1.  **Years 1-2 (Priority 1):** Establish the **Epistemic Boundary**. Prove whether the curse is a catastrophic risk or a manageable nuisance under realistic correlation assumptions. *Output: A robustness paper.*
  2.  **Years 2-3 (Priority 2):** Test the **Voluntary Solution**. Determine if information pooling can solve the problem without coercion. *Output: A mechanism design paper.*
  3.  **Years 4-5 (Priority 3):** Design the **Fallback Institution**. If voluntary pooling fails, specify the optimal threshold/veto rule. *Output: A policy framework.*

  This sequence ensures that if the problem dissolves at Step 1, you don't waste resources on Steps 2 and 3. If Step 2 works, you avoid the political cost of Step 3. It is a **minimax regret** strategy for research allocation, aligning theoretical rigor with practical policy leverage.
