answer: |-
  ### 1. The Cases

  An adequate theory must classify canonical hard cases without yielding absurd or contradictory verdicts. It cannot simply assert intuition; it must provide a principled rule that generates specific outcomes.

  First, regarding **private consensual conduct between adults**, the theory must adjudicate statutes like a *Recreational Drug Privacy Act* (decriminalizing use) versus a *Sodomy Prohibition* (criminalizing sex). A minimally adequate theory cannot permit the latter while forbidding the former without identifying a relevant difference beyond majority disgust. It must explain why *Lawrence v. Texas* was correctly decided while *Gonzales v. Raich* might stand, or vice versa. Regarding **assisted dying**, a *Right to Die Statute* must be evaluated against a *Preservation of Life Act*. The theory must specify whether autonomy overrides the state's interest in life when no third party is harmed.

  Second, for **consensual activities risking serious self-harm**, the theory must handle *Mandatory Helmet Laws* and *Ban on Dangerous Sports*. If the theory bans all self-harm, it becomes totalitarian; if it bans none, it cannot justify seatbelt laws. It must articulate a threshold of competence or social cost. For instance, it must explain why we criminalize suicide pacts but allow boxing. A statute banning *Consensual Dueling* must be justified differently than one banning *Reckless Driving*, even if the physical risk is identical.

  Third, concerning **harmless acts that offend or desecrate**, the theory must distinguish *Flag-Burning Protections* from *Corpse Desecration Bans*. Both involve symbolic acts causing emotional distress without physical harm. A theory that criminalizes flag burning must also criminalize blasphemy, which violates pluralism. Conversely, a theory that permits *Consensual Cannibalism of the Dead* (eating a corpse provided by the deceased) must explain why this differs from necrophilia or medical use of cadavers. The verdict cannot rest solely on "yuck factor"; it must identify a public order interest.

  Fourth, regarding **consensual exploitation**, the theory must reconcile *Organ Sale Prohibitions* with *Minimum Wage Laws*. Both restrict voluntary contracts to prevent exploitation. If a *Kidney Sales Act* is permissible to prevent commodification of the body, why is a *Low Wage Contract* permissible? The theory must define the boundary of inalienable rights. It cannot forbid selling organs for money while allowing selling labor for money without a coherent account of bodily integrity versus economic liberty.

  Finally, for **aggregate or message-based harm**, the theory must evaluate *Pollution Caps* versus *Prostitution Zoning*. Cumulative physical harm (pollution) is distinct from cumulative moral harm (normalization of vice). A statute banning *Public Prostitution* to prevent "moral decay" fails if the theory cannot distinguish empirical social costs from symbolic disapproval. An adequate theory must forbid criminalization based solely on the message an act sends unless that message directly incites imminent lawless action. It cannot hold that conduct is criminal because it "cheapens" a social institution unless that cheapening results in tangible harm to non-consenting others.

  ### 2. The Distinctions

  A robust theory must maintain conceptual boundaries that, if collapsed, destroy the legitimacy of criminal law in a pluralistic society.

  **Harm to Others versus Harm to Self:** This is the boundary of sovereignty. If a theory collapses these, it justifies full paternalism. A statute mandating *Daily Vitamin Intake* becomes as legitimate as one banning *Assault*. Losing this distinction means the citizen is a ward of the state, not an agent. The theory must explain why the state owns the citizen's safety but not their choices.

  **Harm versus Offense:** Harm involves setback to interests; offense involves transient psychological distress. Collapsing these allows a *Heckler's Veto Statute*, where any unpopular speech is criminalized because it upsets listeners. If offense equals harm, *Blasphemy Laws* become indistinguishable from *Harassment Laws*. The theory must require a higher threshold of severity and unavoidability for offense to justify coercion.

  **Wrongdoing versus Harm:** Criminal law implies blame, not just cost-spreading. If collapsed, criminal law becomes tort law with prison. A *Strict Liability Negligence Statute* punishing accidental harm without culpability would be indistinguishable from *Intentional Murder*. The theory must account for *mens rea*; punishment without moral wrongdoing is mere administration of pain.

  **Shared Positive Morality versus Minimum Conditions:** Devlin's error was conflating the morality that holds society together (minimum conditions like prohibitions on violence) with the society's preferred way of life (positive morality like religious observance). Collapsing these justifies a *State Religion Enforcement Act*. The theory must distinguish between rules necessary for cooperation and rules preferred for salvation.

  **Private versus Public:** Context determines legitimacy. A *Public Nudity Ban* may be valid while a *Private Nudity Ban* is not. Collapsing these erases the sphere of liberty. The theory must explain why location transforms the moral quality of the act, likely through the lens of non-consenting observers or public order maintenance.

  ### 3. The Fixed Points

  Any theory of criminalization must be consistent with certain empirical and conceptual facts about the modern legal landscape. Ignoring these renders the theory utopian or irrelevant.

  First, **criminal law is coercive and stigmatizing**. Unlike a tax or a fine, a conviction brands the offender. A theory must justify not just the restriction of liberty, but the imposition of shame. A *Drug Possession Statute* that treats users as patients differs morally from one that treats them as criminals. The theory must explain why punishment, with its expressive function of condemnation, is necessary rather than civil regulation.

  Second, **the society is pluralistic about the good**. Citizens disagree on religion, sexuality, and the meaning of life. A theory presupposing a single conception of virtue, like Aquinas's, fails this test. It must allow a *Pluralistic Coexistence Statute* where conflicting life plans are permitted provided they do not intersect destructively. It cannot criminalize conduct solely because it violates a specific comprehensive doctrine.

  Third, **any legal system presupposes a shared moral minimum**. Anarchy is not a valid baseline. There must be a *Core Crimes Code* (murder, theft, fraud) that is not up for debate. A theory that suggests even these are contingent on utility calculations fails to capture the non-negotiable nature of basic rights. The theory must acknowledge that some moral agreement is a precondition for law itself.

  Fourth, **existing legal systems draw lines a theory must explain**. Concepts like **consent**, **de minimis harm**, and **public order** are already operative. A *Consent Defense* validates surgery but invalidates dueling. A theory cannot simply assert these lines are wrong; it must explain why consent transforms the moral nature of physical contact in one case but not the other. It must account for the *De Minimis Statute* which ignores trivial harms, acknowledging that law has limited resources and moral gravity.

  ### 4. Negotiable and Non-negotiable

  To evaluate theories fairly, we must separate genuine requirements from ideological preferences.

  **Non-negotiable requirements** are structural. Any adequate theory must: (1) Account for the stigma of punishment (not just cost); (2) Be compatible with factual pluralism (not assume everyone agrees on the Good); (3) Be internally consistent (not forbid X and permit Y without a relevant difference); and (4) Explain existing legal distinctions like consent and *mens rea*. If a theory fails these, it is descriptively false or logically incoherent.

  **Negotiable preferences** are substantive. A liberal might prefer "no paternalism," but a theory allowing *Seatbelt Laws* is not automatically inadequate. A conservative might prefer "enforce tradition," but a theory allowing *Same-Sex Marriage* is not automatically inadequate. These are inputs for the theory, not tests of its validity. We can negotiate the extent of paternalism or the weight of tradition, provided the theory justifies them consistently.

  The **single requirement that does the most work** in excluding candidate theories is the **justification of stigma in a pluralistic society**. This is the "killer constraint." Many theories can justify regulation (e.g., utilitarianism), but few can justify *condemnation* without presupposing a shared moral truth that pluralism denies. A theory that criminalizes conduct based solely on majority disgust (Devlin) fails because it cannot justify the stigma to the minority without begging the question. A theory that criminalizes solely on harm (Hart) struggles to justify the stigma of "victimless" crimes that nonetheless degrade social norms. The requirement to explain why the state may *blame* rather than merely *manage* citizens excludes pure cost-benefit analyses and pure moralistic assertions alike.

  ### 5. Conflicts

  Some desiderata appear jointly unsatisfiable, creating tension that any working theory must resolve.

  The primary conflict is between **respecting individual liberty in hard cases** and **acknowledging that a legal system presupposes a shared moral order**. If we prioritize absolute liberty, we risk eroding the shared norms (e.g., truth-telling, fidelity) that make legal cooperation possible. If we prioritize the shared moral order, we risk tyrannizing minorities who do not share those norms. For example, a *Ban on Lying in Private Relationships* would enforce moral order but destroy liberty. A *Permit All Consensual Acts* rule protects liberty but might allow contracts into slavery, undermining the moral status of persons required for law.

  Something has to give. Specifically, **absolute sovereignty over the self** must yield to the **minimum conditions of social life**. We cannot have a right to sell ourselves into slavery because that destroys the moral agency required to have rights. Conversely, **absolute enforcement of shared morality** must yield to **pluralism**. We cannot criminalize blasphemy because that denies the equal standing of citizens with different gods.

  The resolution lies in distinguishing **constitutive norms** from **preferential norms**. Constitutive norms (no violence, keep contracts) are non-negotiable prerequisites for a legal system. Preferential norms (how to worship, how to have sex) are negotiable. The conflict is unsatisfiable only if one insists that preferential norms are constitutive. A theory must accept that some social fragmentation is the price of liberty. We accept the risk that some may live "immorally" (by some lights) to ensure no one is oppressed by the moral lights of others. The theory must prioritize the *procedure* of coexistence over the *substance* of the good life.

  ### 6. Scorecard

  We can now briefly score the three major approaches against these desiderata.

  **Hart's Harm Principle:**
  *   *Fit:* High on pluralism and liberty. It correctly classifies *Sodomy Prohibitions* as impermissible.
  *   *Gap:* Struggles with **paternalism** (cannot easily justify *Helmet Laws* without ad-hoc exceptions) and **harmless wrongdoing** (cannot explain the intuition behind *Corpse Desecration Bans* where no sentient being is harmed). It often reduces stigma to management, failing the "fixed point" of condemnation.

  **Devlin's Legal Moralism:**
  *   *Fit:* High on **shared moral minimum** and **social cohesion**. It explains why *Core Crimes* feel different than torts.
  *   *Gap:* Fails the **pluralism** fixed point catastrophically. It cannot distinguish between *Murder Bans* (constitutive) and *Blasphemy Bans* (preferential) without circularity. It collapses the **private/public** distinction, permitting intrusion into the bedroom based on public disgust.

  **Feinberg's Offense Principle:**
  *   *Fit:* Bridges the gap between harm and morality. It handles *Public Nudity* better than Hart by acknowledging **offense** as a valid constraint.
  *   *Gap:* Struggles with the **objective standard** in a pluralistic society. What counts as "serious offense" varies by culture. It risks collapsing **harm versus offense** if the threshold is set too low, potentially validating *Heckler's Veto Statutes*. It also struggles with **private consensual exploitation** (e.g., *Organ Sales*), where offense is minimal but moral hesitation remains.

  None score perfectly. Hart protects the citizen but under-protects the social fabric. Devlin protects the fabric but under-protects the citizen. Feinberg offers a middle ground but lacks a sharp knife for cutting through cultural subjectivity. An adequate theory must likely synthesize these, retaining Hart's protection of private liberty, Devlin's insistence on a moral minimum for public order, and Feinberg's nuance on offense, while rigorously policing the boundaries between them.
