  2. It severs the link between agency and consequence, absolving the truth-teller of complicity in foreseeable evils they could have prevented through deception, which undermines secular notions of responsibility.
  3. By locating wrongness entirely in the will's mismatch rather than social harm, the theory risks reducing ethics to a solipsistic hygiene of the soul rather than a framework for interpersonal flourishing.
  4. The proponent dismisses harm-based objections as question-begging consequentialism but concedes that the rule demands heroic virtue, admitting the position is practically burdensome even if theoretically sound.
  5. The view risks unfalsifiability by classifying deceptive silences as truth-telling, but this is a structural feature of act-based deontology rather than a logical failure unique to this view.
