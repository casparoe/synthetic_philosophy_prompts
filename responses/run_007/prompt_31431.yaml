prompt: |-
  I'm putting together a syllabus for a grad seminar on social norms and I want to pair Lewis's Convention with Golding's Lord of the Flies. The idea is to treat the island as a kind of uncontrolled experiment: you've got a group of children with no shared history (well, some from school) who have to build social order from scratch, and we get to watch both the construction and the collapse.

  Here's the specific thing I'm stuck on. Lewis's account says a convention is a regularity in behavior that solves a recurrent coordination problem, where everyone prefers to conform conditional on others conforming, and there's an alternative regularity that would also work. The conch rule is a textbook case — it's arbitrary (you could use a stick, a raised hand), it solves a coordination problem (who speaks when), and everyone does better following it than talking over each other.

  But the novel also shows something that doesnt fit neatly: the conventions become normative really fast. When Jack smashes the conch, it's not just that coordination fails — it's that something sacred has been violated. The boys treat the rules as having a kind of weight that goes beyond "this is the equilibrium we happen to be in." And the breakdown isn't a shift to a different equilibrium; it's a descent into something that isn't governed by convention at all — fear, hunting, the lord of the flies.

  So here's what I want to know: can a Lewisian framework handle the normative dimension of the boys' conventions — the way the rules feel binding, not just useful? Lewis does talk about conventions becoming norms when supported by sanctions, but that seems to miss the phenomenology: the boys don't follow the conch rule because they're afraid of punishment, at least not at first. They follow it because it feels like the right thing to do, and when it breaks, something breaks in them too. Is Lewis just leaving out the moral psychology, or is there a deeper problem — that his account of convention can't explain why we ever come to treat arbitrary coordination solutions as anything more than that?

  And the second thing: the collapse. In Lewis's picture, conventions are self-enforcing as long as the underlying preferences hold. But in the novel, the preferences themselves seem to shift — not because the coordination problem changes, but because fear and hunger and the sheer absence of adult authority change what the boys care about. Does Lewis's theory have the resources to explain how conventions can be undermined by changes in the broader motivational landscape, or does it assume a kind of stability in preferences that the novel shows we can't count on?

  I guess I'm asking for a reading of the novel that takes Lewis seriously but also lets the novel talk back — where does it confirm the theory, where does it complicate it, and what would Lewis have to add to his account to make sense of what happens on the island?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Grad seminar syllabus on social norms.
      *   **Pairing:** David Lewis's *Convention* (1969) and William Golding's *Lord of the Flies* (1954).
      *   **Core Idea:** Treat the island as an uncontrolled experiment in building/collapsing social order.
      *   **Specific Problem 1 (Normativity):** Lewis defines conventions as arbitrary regularities solving coordination problems (equilibria). But in *LotF*, rules (like the conch) quickly become *normative* (sacred, binding) rather than just useful. Lewis mentions sanctions, but the boys follow rules because they feel *right*, not just out of fear. Does Lewis miss the moral psychology? Can his framework explain why arbitrary solutions gain moral weight?
      *   **Specific Problem 2 (Collapse/Preferences):** Lewis assumes conventions are self-enforcing as long as preferences hold. In *LotF*, preferences shift (fear, hunger, savagery) without the coordination problem changing. The collapse isn't a shift to a *new* equilibrium; it's a descent into chaos/violence. Does Lewis assume too much stability in preferences?
      *   **Goal:** A reading that takes Lewis seriously but lets the novel critique/expand the theory. Where do they align? Where do they diverge? What would Lewis need to add?

  2.  **Deconstruct Problem 1: The Normative Dimension (The "Ought" from the "Is")**
      *   *Lewis's View:* Conventions are descriptive regularities. They become normative only instrumentally ("I ought to do X if I want Y"). Lewis explicitly tries to avoid moralizing convention. He distinguishes convention from promise/contract.
      *   *LotF's View:* The conch becomes a totem. It represents civilization, order, and "home." Breaking it is sacrilege.
      *   *The Gap:* Lewis explains *compliance* via expectations and preferences. He doesn't fully explain *internalization* (the feeling of obligation).
      *   *Potential Bridge:* Lewis acknowledges "normative pressure" via sanctions (disapproval). But the user is right: the boys feel an internal pull before sanctions are applied.
      *   *Theoretical Expansion:* Need to bring in someone who bridges Lewis and normativity. Maybe Bicchieri (empirical vs. normative expectations)? Or Hume (Lewis's inspiration)? Hume sees justice as artificial but felt as natural.
      *   *Seminar Angle:* Use *LotF* to show that conventions *generate* their own normativity through symbolic embedding. The conch isn't just a signal; it's a symbol of the *agreement itself*.

  3.  **Deconstruct Problem 2: The Collapse (Preference Stability)**
      *   *Lewis's View:* Conventions persist as long as the coordination problem exists and preferences remain constant (everyone prefers coordination to non-coordination).
      *   *LotF's View:* The coordination problem (who speaks) remains, but the *preference for coordination* evaporates. Jack prefers domination/hunting over orderly discussion. The "game" changes from Coordination to Prisoner's Dilemma or even War of All Against All.
      *   *The Gap:* Lewis assumes rational agents with stable preferences for order. Golding suggests preferences are fragile and susceptible to primal drives (fear, bloodlust).
      *   *Theoretical Expansion:* Lewis's framework is static regarding preferences. It needs a dynamic account of preference formation. The "Beast" changes the payoff matrix.
      *   *Seminar Angle:* The collapse isn't a failure of convention *per se*, but a failure of the *preconditions* for convention (trust, shared interest in survival via order).

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Validate the pairing. It's brilliant because *LotF* dramatizes the fragility of the assumptions Lewis makes.
      *   **Section 1: The Normative Weight (The Conch as Totem).**
          *   Acknowledge Lewis's limitation (instrumental rationality).
          *   Argue that *LotF* shows conventions *morphing* into norms.
          *   Introduce the concept of "symbolic encapsulation." The conch stops being a tool and becomes the *embodiment* of the group.
          *   Suggest pairing with Cristina Bicchieri (normative expectations) or Jon Elster to flesh out the psychology Lewis skips.
      *   **Section 2: The Collapse (Shifting Preferences).**
          *   Lewis assumes stable preferences for coordination.
          *   *LotF* shows preferences are endogenous (shaped by fear, hunger, power).
          *   The shift from Coordination Game to Prisoner's Dilemma/Deadlock.
          *   The "Beast" as an external shock that alters payoff structures.
      *   **Section 3: What Lewis Would Say (Defense & Revision).**
          *   Lewis might say the convention *did* work until the common knowledge broke down.
          *   But he'd need to admit that "common interest" is not a given.
          *   Proposal: Conventions require a "moral substrate" or "trust" that Lewis treats as exogenous but Golding shows is endogenous.
      *   **Section 4: Seminar Discussion Questions.**
          *   Practical takeaways for the class.

  5.  **Refine the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just bash Lewis. He knew he was doing game theory, not moral psychology. Frame it as "Lewis provides the skeleton; Golding provides the flesh and blood."
      *   *Nuance:* The conch isn't just a coordination device; it's a *focal point* (Schelling). Lewis builds on Schelling. The destruction of the focal point destroys the ability to coordinate *at all*, not just on *this* rule.
      *   *Key Insight:* The transition from "Convention" to "Norm." Lewis distinguishes them. *LotF* shows the transition process. That's the teaching moment.
      *   *Key Insight 2:* The collapse. It's not just preference change; it's the emergence of a *rival* convention (Jack's tribe) based on different coordination (hunting/defense) which is incompatible with Ralph's convention (rescue/speech).

  6.  **Final Polish:**
      *   Ensure tone is academic but engaging (suitable for a grad seminar proposal/discussion).
      *   Check specific references (Lewis's conditions, specific scenes in *LotF*).
      *   Make sure to answer the specific questions: Can Lewis handle normativity? Can he handle preference shifts?

