answer: |-
  This is a fantastic pairing. It's rare to find a literary text that dramatizes the specific philosophical assumptions of a game-theoretic account as clearly as *Lord of the Flies* does for Lewis. You are right to identify the tension: Lewis provides the *logic* of social order, while Golding provides the *psychology* and *fragility* of it.

  Here is a reading of the novel that takes Lewis seriously but uses the text to expose the boundaries of his framework, structured around your two main problems: normativity and preference stability.

  ### 1. The Normative Dimension: From Equilibrium to Totem

  **The Lewisian Baseline:**
  For Lewis, a convention is a solution to a recurrent coordination problem. It is arbitrary (we could drive on the left or right), self-enforcing (I follow it because I expect you to, and vice versa), and instrumental (I follow it because it serves my interest to coordinate). Lewis is careful to distinguish conventions from *norms* or *promises*. He explicitly wants to avoid moralizing convention. For Lewis, the "ought" of convention is hypothetical: "If you want to coordinate, you ought to follow the rule."

  **The Golding Complication:**
  As you note, the conch rule quickly transcends instrumental utility. When Piggy holds the conch, he isn't just signaling "I want to speak"; he is invoking the *authority of the assembly*. When Jack smashes the conch, the narration treats it as a metaphysical break ("the explosion broke the silence... the taboo of the old life"). The boys don't just lose a mechanism for turn-taking; they lose the *binding force* of civilization.

  **Where Lewis Falls Short:**
  Lewis's account is thin on *internalization*. He explains compliance via expectations and sanctions (disapproval). But in *LotF*, the boys follow the conch rule initially because it connects them to the world they lost (the adult world, school, home). The convention carries a **symbolic weight** that Lewis's game theory doesn't capture. Lewis treats the regularity as the end; Golding shows the regularity becoming a *sacred object*.

  **How to Bridge the Gap (For the Seminar):**
  You can argue that Lewis describes the *skeleton* of the norm, but Golding shows the *fleshing out*.
  *   **Symbolic Encapsulation:** The conch stops being a mere signal and becomes the *physical embodiment of the agreement itself*. In Lewisian terms, it becomes a **focal point** (Schelling) that is so robust it acquires moral gravity.
  *   **The Transition from Convention to Norm:** Use the novel to teach the distinction. Lewis defines *convention*; *LotF* shows the moment a convention mutates into a *social norm* (in the sense of Cristina Bicchieri). Bicchieri argues norms rely on *normative expectations* (I believe others think I *should* do this), not just empirical expectations (I believe others *will* do this).
  *   **The Lesson:** Lewis assumes agents are rational coordinators. Golding shows that for coordination to hold, the convention must be *mythologized*. The "normative weight" isn't a bug; it's a feature required to sustain the convention when instrumental incentives waver. Lewis leaves out the moral psychology because he assumes rationality is enough; Golding shows rationality is not enough without the myth.

  ### 2. The Collapse: Preference Stability and the "Beast"

  **The Lewisian Baseline:**
  Lewisian conventions are stable as long as the underlying preferences remain constant. Everyone prefers (Coordination on X) > (No Coordination). If the convention collapses, it's usually because a better equilibrium was found, or common knowledge broke down. Lewis assumes a certain stability in the agents' desire to coordinate.

  **The Golding Complication:**
  The collapse on the island isn't a shift to a *better* equilibrium (like driving on the left instead of the right). It is a dissolution of the *preference for coordination itself*.
  *   **Endogenous Preferences:** In Lewis's model, preferences are exogenous inputs. In *LotF*, preferences are endogenous—they change based on the environment. Fear of the "Beast," the thrill of the hunt, and hunger alter the payoff matrix.
  *   **The Shift in Game Type:** Initially, the boys are playing a **Coordination Game** (Rescue is best for all; order helps rescue). Under Jack, the game shifts to a **Prisoner's Dilemma** (Defecting/Hunting gives me meat/safety now, even if it hurts the group long-term) and finally to a **War of All Against All**.
  *   **The "Beast" as Shock:** The Beast isn't just a monster; it's an informational shock that changes what the boys value. Survival via *rescue* (Ralph's convention) is replaced by survival via *protection/tribalism* (Jack's convention).

  **Where Lewis Falls Short:**
  Lewis's theory is static. It cannot easily model a situation where the agents stop caring about the coordination problem because their fundamental desires have mutated. Lewis assumes we are always trying to solve the coordination problem; Golding shows us that sometimes we decide the problem isn't worth solving, or we'd rather dominate than coordinate.

  **How to Bridge the Gap (For the Seminar):**
  *   **Common Interest is Not Given:** Lewis assumes a "common interest" in coordination. *LotF* demonstrates that common interest is fragile. It requires a shared conception of the good (Rescue/Civilization). When that conception fractures (Hunting/Survival), the Lewisian convention has no ground to stand on.
  *   **Rival Conventions:** Jack doesn't just create anarchy; he creates a *rival convention*. The face paint, the chants, the hunting rituals—these are also regularities, arbitrary solutions to coordination problems (who hunts, who guards). The tragedy is that Jack's conventions are incompatible with Ralph's. Lewis allows for multiple equilibria, but he doesn't fully account for *violent competition between equilibria*.
  *   **The Lesson:** Conventions require a **substrate of trust** that Lewis treats as a precondition but Golding treats as a variable. You can't have a Lewisian convention without a prior agreement on *what is valuable*.

  ### 3. Synthesis: What Would Lewis Add?

  If Lewis were forced to respond to Golding, he would likely argue that he was never trying to explain *why* people value order, only *how* they sustain it once they do. However, to make his account robust enough for your seminar, you might propose three amendments based on the novel:

  1.  **The Emotional Substrate:** Conventions require emotional reinforcement (ritual, symbolism) to survive preference shocks. The conch needed to be treated as sacred to survive the fear of the Beast. Purely instrumental conventions are too fragile.
  2.  **The Fragility of Common Knowledge:** Lewis relies heavily on "common knowledge" (I know that you know that I know...). *LotF* shows how easily common knowledge degrades into suspicion. Once the boys suspect others are defecting (or worshipping the Beast), the Lewisian equilibrium unravels instantly.
  3.  **Power Asymmetry:** Lewis's model is somewhat egalitarian (we all agree to this). *LotF* shows that conventions often harden into power structures. Jack enforces his new "conventions" with violence. Lewis mentions sanctions, but Golding shows that sanctions can become the *point* of the convention (domination rather than coordination).

  ### 4. Seminar Discussion Questions

  To make this concrete for your students, here are three discussion prompts derived from this tension:

  1.  **The Conch as Focal Point:** Lewis argues conventions are arbitrary. If the conch is arbitrary, why does its destruction signal the end of *all* order, rather than just the need to pick a new object (like a stick)? Does this suggest that some conventions cease to be arbitrary and become constitutive of the group's identity?
  2.  **Preference Shocks:** Lewis assumes agents prefer coordination to non-coordination. At what point in the novel do the boys stop preferring coordination? Is it when they fear the Beast, or when they taste blood? Does Lewis's theory have resources to explain why an agent would choose a lower-payoff equilibrium (chaos/violence) over a higher-payoff one (rescue)?
  3.  **The Role of the Adult:** Lewis's conventions rely on common knowledge and shared history. The boys lack shared history but share a "memory" of adult norms. To what extent is the Lewisian framework dependent on an external enforcer (the "adult world") that is merely absent in the novel, rather than truly internalized?

  ### Summary for the Syllabus Blurb
  You might frame the pairing like this:
  *"Lewis provides the logic of social order: how arbitrary rules become self-enforcing equilibria. Golding provides the pathology: what happens when the psychological preconditions for those equilibria—trust, shared interest, and the valuation of order itself—decay. We will ask whether Lewis's rationalist framework can survive the island, or if the novel reveals that convention is always underwritten by a violence it cannot explain."*

  This approach validates Lewis (he's right about how the conch *works*) while using Golding to show the limits of his theory (he's wrong about why it *holds* and what happens when it *breaks*). It turns the seminar into an investigation of the boundary between rational choice and moral psychology.
