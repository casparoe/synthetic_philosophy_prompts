answer: |-
  Here is a 50-minute section plan designed to make the students feel the tension of the paradox without getting bogged down in graduate-level semantics.

  **A Note on Terminology:** In the literature, the scenario you described is usually called the **Peer Disagreement Problem** (associated with Feldman, Christensen, Elga). "The Dogmatism Paradox" often refers to a different puzzle by Gilbert Harman (about ignoring future evidence). Since your students will likely encounter the term "Peer Disagreement" in readings, I recommend you introduce it as "The Problem of Peer Disagreement (sometimes called the Dogmatism Paradox)" so they can connect the dots later. The plan below follows your description.

  ### 1. The Dependency Structure
  You cannot present the dilemma immediately. If you do, students will dodge the bullet before they feel it. You must build the trap in this specific order:

  1.  **Symmetry of Evidence:** They must accept that you and the other person have access to the *same* information. If one of you has more data, the paradox dissolves.
  2.  **Equality of Competence:** They must accept that you and the other person are *equally good* at processing that information. If one of you is smarter or more sober, the paradox dissolves.
  3.  **The "Peer" Definition:** Combine 1 and 2 into the definition of an **Epistemic Peer**.
  4.  **The Exhaustive Choice:** Establish that there are only two rational moves: **Stick** (maintain confidence) or **Budge** (lower confidence/suspend judgment).
  5.  **The Cost of Sticking:** Show that Sticking violates #2 (it implies you think you're better than your peer without evidence).
  6.  **The Cost of Budging:** Show that Budging leads to skepticism (since peers disagree on almost everything).

  **Why this order?** If you introduce the "Cost of Sticking" before defining "Peer," students will say, "Well, I'm probably smarter." If you introduce the "Cost of Budging" before establishing "Symmetry," they will say, "I'll just get more evidence." You must close the escape routes before springing the trap.

  ---

  ### 2. The Concrete Example: The Lost Hikers
  **Do not use the Restaurant Bill.**
  *Why?* The bill implies a calculable, objective answer reachable by re-doing the math. It invites the "check your work" response. It treats belief as a calculation error rather than an interpretation of evidence.

  **Use The Lost Hikers.**
  *Scenario:* You and a friend are hiking in dense fog. You both have the exact same map (Symmetry). You both have 20/20 vision, are equally sober, and have equal experience reading maps (Competence). You are trying to find the trail back to the car. You look at the map and the terrain and become 90% confident the trail is **Left**. Your friend looks at the *same* map and terrain and becomes 90% confident the trail is **Right**. You talk for five minutes, share your reasoning, and realize you still disagree.

  *Why this works:*
  1.  **High Stakes:** Getting it wrong matters (raises tension).
  2.  **No "Re-calc":** Unlike the bill, you can't just "do the math again." You've already looked. The evidence is ambiguous.
  3.  **Binary Outcome:** The trail is either Left or Right. This blocks the Relativist dodge (see below).

  ---

  ### 3. The 50-Minute Plan

  #### **0:00–0:10: Setup & Blocking the "Check Again" Dodge**
  *   **Activity:** Tell the Hiker story. Ask: "What do you do?"
  *   **Predictable Misconception #1:** "I'd ask them to show me their reasoning again," or "I'd look at the map one more time."
  *   **The Block:** Stop this immediately. Stipulate: "You have done that. You have pooled all your evidence. You know *why* they think it's Right, and they know *why* you think it's Left. You are at an impasse. You cannot get new evidence before nightfall. You must decide *now* how confident to be in 'Left'."
  *   **Goal:** Force them to realize this is about **current rationality**, not future investigation.

  #### **0:10–0:20: Horn 1 — The Dogmatism Charge (Sticking to your guns)**
  *   **Question:** "If you stay 90% confident it's Left, what does that imply about your friend?"
  *   **Discussion:** Guide them to see that if you stick, you are effectively saying, "Despite having the same eyes and map, my brain processed it correctly and theirs didn't."
  *   **The Trap:** But you have no *independent* reason to think your brain is working better right now. To assume you are right *because* it is you is circular.
  *   **Takeaway:** Sticking seems arrogant (dogmatic) because it breaks the symmetry of competence without evidence.

  #### **0:20–0:30: Horn 2 — The Skepticism Charge (Budging)**
  *   **Question:** "Okay, so you should budge. You drop your confidence to 50% (suspend judgment). Now apply this to real life."
  *   **Activity:** Ask them to list beliefs they hold that smart people disagree about (Politics, Climate Policy, Philosophy, Religion).
  *   **The Trap:** If you must budge *every* time a peer disagrees, you must suspend judgment on almost everything interesting. You become a philosophical zombie with no opinions on important matters.
  *   **Takeaway:** Budging seems spineless (skeptical) because it makes rational belief impossible in a pluralistic world.

  #### **0:30–0:40: Misconception Check — Relativism & "My Truth"**
  *   **Predictable Misconception #2:** "Maybe the trail is Left for me and Right for them. Both are right."
  *   **The Block:** Return to the Hiker. "If you go Left and they go Right, only one of you finds the car. The other sleeps in the cold. Truth isn't relative here."
  *   **Timing:** Address this *after* they feel the pressure of the two horns. If you say this too early, they won't feel the paradox. They need to *want* relativism to be true to escape the pain of the dilemma.
  *   **Goal:** Show that the paradox exists *because* we assume there is one truth, but we can't access it uniquely.

  #### **0:40–0:47: The "So What?" — Managing the Unresolved**
  *   **What to Refuse to Resolve:** Do not tell them whether the **Steadfast View** (stick to your guns) or the **Conciliatory View** (budge) is correct. Philosophers still fight about this.
  *   **What to Affirm:** The value of the paradox is **Intellectual Humility**. Even if you stick to your belief, the paradox forces you to acknowledge: "I know a peer disagrees, so I must admit I could easily be wrong." It changes the *attitude* with which you hold the belief, even if you keep the belief.
  *   **Message:** Epistemology isn't about finding a rule that lets you ignore disagreement. It's about understanding how disagreement changes your justification.

  #### **0:47–0:50: The Exit Ticket (Assessment)**
  *   **The Question:** Write this on the board. They must answer on a slip of paper to leave.
      > "In the Hiker case, if you choose to stay confident the trail is Left, you are implicitly making a claim about your friend's mental state. What is that claim, and why is making that claim without new evidence epistemically suspicious?"
  *   **Why this question?**
      *   If they answer "I claim they are wrong," they missed the point (too shallow).
      *   If they answer "I claim my brain is processing the evidence better than theirs," they understand the **Symmetry** requirement.
      *   If they add "It's suspicious because I have no proof I'm processing it better," they understand the **Dogmatism** charge.
      *   This confirms they see the *structure* of the paradox, not just the story.

  ---

  ### 4. TA Cheat Sheet: Handling Pushback

  | Student Objection | Where it happens | Your Response |
  | :--- | :--- | :--- |
  | **"I trust my gut more."** | During Horn 1 | "That's allowed in real life, but in this thought experiment, 'gut' is part of the evidence. If your gut is a reliable tool, theirs is too (by definition of Peer). Why is your tool working and theirs isn't?" |
  | **"I'd just flip a coin."** | During Horn 2 | "Flipping a coin decides *action*, but the paradox is about *belief*. Do you *believe* it's Left 90%? Or do you believe it's 50/50? The coin doesn't change your belief." |
  | **"This is just relativism."** | During Misconception Check | "If truth were relative, there's no paradox. The paradox hurts *because* we think one of you is actually wrong. Don't solve the puzzle by denying the rules." |
  | **"I'd just follow the expert."** | During Setup | "What if you are both students? What if you are both experts? The paradox applies to peers. If one is an expert, the symmetry is broken, and the paradox disappears." |

  ### 5. Final Advice for the TA
  Your goal is not to solve the paradox. Your goal is to make them uncomfortable. If they leave the room feeling like it's slightly harder to be confident in their own righteousness than when they walked in, you have succeeded. The paradox is a tool for humility, not a logic puzzle with a clean answer key. Acknowledge the tension, validate that smart philosophers disagree on the solution, and emphasize that recognizing the tension is the mark of a critical thinker.
