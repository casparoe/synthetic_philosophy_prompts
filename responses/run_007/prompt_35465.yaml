      *   Timing? Yes.
      *   Unresolved? Yes (Steadfast vs. Conciliatory).

  10. **Final Polish:** Ensure tone is supportive for a TA. Make sure the distinction between Harman's Dogmatism Paradox and Peer Disagreement is handled gently (I will stick to the user's description but treat it as the Peer Disagreement problem, as that's clearly what they mean). *Self-Correction:* I should explicitly note that this is often called the "Peer Disagreement" problem in literature so they don't get confused reading textbooks, but I will use their label for the section to avoid confusion in class.

      *Wait, one nuance:* The user called it "The Dogmatism Paradox." In some contexts (like the Stanford Encyclopedia), "The Dogmatism Paradox" is Harman's. But the *description* is Peer Disagreement. If I correct them too hard, it might undermine their confidence. I will gently note the terminology distinction in the "Prep Notes" but build the lesson on their description. The core logic is the same: How to maintain belief in the face of counter-indications.

      *Let's finalize the Example:* The Hiker example is classic (Kelly, Christensen). It works best.
      *Let's finalize the Exit Question:* Needs to be punchy. "If you stick to your belief, what are you accusing your peer of, without evidence?"

      *Let's finalize the Dependency:*
      1. Symmetry of Evidence (The Setup)
      2. Definition of Peer (The Constraint)
