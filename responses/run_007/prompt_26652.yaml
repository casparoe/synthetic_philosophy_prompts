  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the tension. Validate the user's observation (it's a known and critical debate). State the thesis: The labs rely on a *pragmatic/functional* theory of agency, distinct from the *formal/ML* definition, to maintain coherence.
