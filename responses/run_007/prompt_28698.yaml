      *   **Side A (Transitivists):** "Better than" *must* be transitive for rational choice theory to work. If $A \succ B$ and $B \succ C$, then $A \succ C$. If the spectrum suggests otherwise, our intuitions about the steps or the endpoints are flawed (e.g., vagueness, small differences below the threshold of discrimination).
      *   **Side B (Intransitivists):** The spectrum cases reveal that "better than" is genuinely intransitive in some contexts (especially regarding value aggregation). Temkin is the big name here (*Rethinking the Good*).
