  The Condorcet Jury Theorem (CJT) is seductive because it turns democracy into math. But your instinct to audit the analogy is correct. The theorem rests on three pillars: binary choice, individual competence (>50%), and conditional independence. When you map these onto real institutions, the structure creaks.

  **The Mapping**
  *   **Juries:** Vote = Guilty/Not. Truth = Factual guilt. Competence = Evidence evaluation.
  *   **Elections:** Vote = Candidate A/B. Truth = "Better" leader (normative, not factual). Competence = Voter knowledge.
  *   **Peer Review:** Vote = Accept/Reject. Truth = Scientific validity. Competence = Expertise.
  *   **Prediction Markets:** Vote = Buy/Sell. Truth = Future outcome. Competence = Information possession.

  **Where It Breaks**
  The "Truth" assumption fails immediately in elections (no objective "correct" candidate) and often in science (where truth is provisional). But your worry about **Independence** is the critical fracture. CJT requires errors to be uncorrelated conditional on the truth. If voters share a biased news source, a common cultural heuristic, or deliberate before voting, their errors correlate. 

  Is this fatal? **Yes.** Mathematically, correlated errors prevent convergence. The group doesn't become smarter; it becomes confidently wrong together. In peer review, if all reviewers hail from the same paradigm, they reject innovation collectively. In elections, polarization ensures errors are systematic, not random. Prediction markets mitigate this via pricing mechanisms that weight confidence, but they still suffer from common information shocks.

  Furthermore, the **Competence** threshold ($p > 0.5$) is fragile. If the average voter is slightly worse than random on complex policy, adding more voters converges on *wrongness*, not truth.

  **Verdict: Insight or Just-So Story?**
  It is not a descriptive law of reality; the conditions rarely hold perfectly outside a classroom. Calling an institution a "Condorcet Jury" is often rhetorical armor used to shield it from criticism.

  However, it survives as a **normative insight**. It explains *why* diversity and independence are valuable. It tells us that collective intelligence isn't magic; it's an engineering problem requiring uncorrelated signals. If you want the CJT benefit, you must design institutions that enforce independence (e.g., secret ballots, blinded review) and diversity of information sources.

  So, don't treat CJT as proof that your institution is reliable. Treat it as a warning: without independence and genuine competence, the math works against you. It's a design target, not a description of success.
