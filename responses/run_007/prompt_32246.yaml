answer: |-
  # Which position on logical uncertainty do you actually hold?

  You are invited to take a diagnostic quiz on the nature of uncertainty regarding mathematical and logical claims. This quiz is designed for readers familiar with basic probability and computability theory. There are no "correct" answers; the goal is to locate your intuitive commitments within the landscape of philosophical positions.

  Answer each question by selecting the option that best matches your view. At the end, use the scoring key to identify which cluster of views your answers resemble.

  ### Question 1: The Pending Derivation (Case A)
  A computer is running a proof-checker on a complex conjecture. The derivation is purely deductive and deterministic, but it will take a week to finish. You are offered a bet today on whether the output will be "True" or "False."

  *   **A.** I should not accept the bet at any odds other than 0 or 1. The truth value is already fixed; my uncertainty is merely a reflection of my ignorance, not a feature of the world.
  *   **B.** I should assign a probability based on my current evidence (e.g., partial checks, heuristics). This probability is rational and actionable, even though the truth is fixed.
  *   **C.** I should assign a probability based on the likelihood that the physical computer will output "True" (e.g., accounting for hardware failure), not on the truth of the math itself.
  *   **D.** I can assign a probability, but only if I treat this exactly like a bet on a chaotic physical system, such as a coin flip.

  ### Question 2: Goldbach's Conjecture (Case B)
  Consider the statement: "Every even integer greater than 2 is the sum of two primes." You currently assign a credence of 0.7 to this statement. What is the status of this number?

  *   **A.** It is a category mistake. The statement is either true (probability 1) or false (probability 0). Assigning 0.7 is literally nonsensical.
  *   **B.** It is a useful fiction. Ideally, I should believe 0 or 1, but given my bounded mind, 0.7 is the best approximation of my ignorance.
  *   **C.** It is a genuine degree of belief. Mathematical truth is fixed, but rational agents can hold non-extremal beliefs about fixed truths.
  *   **D.** It is a measure of my confidence in the physical process of verifying the claim, not the claim itself.

  ### Question 3: P versus NP (Case C)
  You must assign a prior probability to the statement "P = NP" before seeing any expert opinion or empirical evidence about algorithm performance. How do you determine this?

  *   **A.** There is no unique rational prior. Any assignment is permissible as long as I remain coherent and update on evidence.
  *   **B.** I should assign 0.5. By symmetry, "P = NP" and "P ≠ NP" are the only two options, and I have no reason to favor one.
  *   **C.** I should weight the options by their descriptive complexity. The simpler formulation receives higher prior probability.
  *   **D.** I should not assign a prior at all. I should only form beliefs as I encounter specific computational evidence.

  ### Question 4: The Long-Running Program (Case D)
  A specific Turing machine $M$ has been running for $10^{100}$ steps. You do not know if it halts. What does it mean to say "There is a 30% chance $M$ halts"?

  *   **A.** It means 30% of similar machines in a reference class halt.
  *   **B.** It means that if I were to run $M$ on a physical device, there is a 30% chance the device reports halting (due to noise/error).
  *   **C.** It means that given my current logical knowledge, the rational degree of belief in the proposition "$M$ halts" is 0.3.
  *   **D.** It is shorthand for "I don't know," but strictly speaking, the chance is either 0 or 1.

  ### Question 5: Chaotic Physics (Case E)
  Consider a double pendulum in a vacuum. Its motion is deterministic but computationally intractable to predict beyond a short horizon. How does uncertainty about its position compare to uncertainty about Goldbach's Conjecture?

  *   **A.** They are fundamentally different. One is empirical (physics), the other is logical (math).
  *   **B.** They are the same in kind. Both represent limits on my ability to compute consequences of fixed facts.
  *   **C.** The physics case is the only real probability. The math case is just ignorance of a static truth.
  *   **D.** The math case is the only real probability (logical probability). The physics case reduces to logical probability plus initial condition uncertainty.

  ### Question 6: Symmetry vs. Simplicity (Discriminator: OB vs. AP)
  Consider two unproven statements about prime numbers. Statement $X$ is very short to describe (e.g., "There are no primes of form..."). Statement $Y$ is its negation, which requires a much longer description to specify fully in your formal language. If you have no specific evidence for either:

  *   **A.** I must assign them equal probability (0.5 each) due to symmetry of ignorance.
  *   **B.** I should assign higher probability to $X$ because it is simpler to describe.
  *   **C.** I should assign higher probability to $Y$ because negations of universal claims are often easier to satisfy.
  *   **D.** The question is ill-posed; I cannot assign probabilities without a specific model of how the primes are generated.

  ### Question 7: The Efficient Trader (Discriminator: LI vs. SBC)
  Imagine you publish a sequence of probabilities for mathematical statements over time. A trader knows your update algorithm and has unlimited computational power, but is restricted to making trades that can be *computed* in polynomial time.

  *   **A.** As long as my probabilities are coherent at each time step, the trader cannot exploit me.
  *   **B.** I am required to update my prices fast enough that no polynomial-time trader can make a guaranteed profit against me.
  *   **C.** If the trader has unlimited power, they will eventually exploit me unless my probabilities are already correct (0 or 1).
  *   **D.** This scenario is irrelevant. My probabilities reflect my internal state, not my vulnerability to traders.

  ### Question 8: The 0.7 Credence (Discriminator: LO vs. NP)
  Returning to your 0.7 credence in Goldbach's Conjecture: If you were ideally rational and had infinite time, what would your credence be?

  *   **A.** It would be exactly 1 or exactly 0. The 0.7 is a defect of my boundedness.
  *   **B.** It would remain 0.7. Even an ideal agent might have non-extremal beliefs about undecidable or unproven statements.
  *   **C.** The question is meaningless. An ideal agent would not have "credences" about logic, only knowledge.
  *   **D.** It would depend on the agent's prior. Different ideal agents could hold different stable credences.

  ### Question 9: Computability of the Prior (Discriminator: LI vs. OB/AP)
  Is the "correct" prior probability distribution over mathematical sentences computable by a Turing machine?

  *   **A.** Yes. Rationality requires that I can actually calculate my beliefs.
  *   **B.** No. The ideal prior is uncomputable (e.g., involves halting oracles), but serves as a limit for approximation.
  *   **C.** It doesn't matter. There is no single "correct" prior to be computable or uncomputable.
  *   **D.** The prior is computable, but only approximately, within some error bound that shrinks over time.

  ***

  ## Scoring Key

  To determine your position, compare your pattern of answers to the seven profiles below. Each profile represents a cluster in the space of possible answer combinations. You do not need to match every single option perfectly; look for the cluster where the majority of your answers align.

  **Construction of the Key:**
  The answer space is divided by three primary dimensions derived from the questions:
  1.  **Ontology (Questions 1, 2, 4, 5, 8):** Is logical probability real, an error, a physical proxy, or nonsense?
  2.  **Normativity (Questions 3, 6, 9):** Is there a unique prior? If so, is it based on symmetry, complexity, or computability?
  3.  **Constraints (Questions 7, 9):** Does rationality require resistance to efficient trading or mere coherence?

  **The Seven Clusters:**

  **Cluster 1: The Idealist (Answers: 1A, 2B, 4D, 5C, 8A)**
  *   **Profile:** You believe logical truths are fixed (0 or 1). Probability is only for empirical events. Logical uncertainty is a measure of human ignorance, not a distinct phenomenon.
  *   **Position:** **The Logical-Omniscience Idealization.**

  **Cluster 2: The Purist (Answers: 1A, 2A, 4D, 5C, 8C)**
  *   **Profile:** You believe logical truths are fixed. You further believe that assigning non-extremal probabilities to them is not just an approximation, but a category error.
  *   **Position:** **No-Probabilities-over-Logic.**

  **Cluster 3: The Empiricist (Answers: 1C, 2D, 4B, 5B, 8D)**
  *   **Profile:** You treat logical uncertainty as uncertainty about physical outputs (computers, brains). There is no "math probability," only probability about what a physical system will report.
  *   **Position:** **Logical Uncertainty as Ordinary Empirical/Computational Uncertainty.**

  **Cluster 4: The Libertarian (Answers: 1B, 2C, 3A, 4C, 7A, 9C)**
  *   **Profile:** You believe non-extremal logical beliefs are real and permissible. There is no unique "correct" prior; coherence is the only constraint. Computational limits are practical, not normative.
  *   **Position:** **Subjective Bayesianism with Computational Constraints.**

  **Cluster 5: The Symmetrist (Answers: 1B, 2C, 3B, 4C, 6A, 9B)**
  *   **Profile:** You believe there is a unique rational prior. This prior is determined by invariance or symmetry (e.g., indifference between a statement and its negation) rather than complexity. You accept that this prior may be uncomputable.
  *   **Position:** **Objective Bayesianism / Logical Probability.**

  **Cluster 6: The Minimalist (Answers: 1B, 2C, 3D, 4C, 6B, 7B, 9A/D)**
  *   **Profile:** You believe logical beliefs should be non-extremal. You reject a unique static prior. Instead, the standard is dynamic: your beliefs must be computable and resistant to efficient exploitation (Dutch booking) by traders.
  *   **Position:** **Logical Induction.**

  **Cluster 7: The Algorithmist (Answers: 1B, 2C, 3C, 4C, 6B, 9B)**
  *   **Profile:** You believe there is a unique rational prior. This prior is determined by descriptive complexity (shorter programs = higher probability). You accept this prior is likely uncomputable but serves as the gold standard.
  *   **Position:** **Algorithmic Probability.**

  ***

  ## Diagnostic Note

  **(i) Unseparable Pairs**
  The quiz cannot cleanly separate **Objective Bayesianism (Cluster 5)** and **Algorithmic Probability (Cluster 6)** in cases where symmetry and program length align. For example, if the simplest description of a problem is also the most symmetric one, both views yield the same probabilities. Separation relies on Question 6, where symmetry and complexity pull in opposite directions. If a respondent feels these considerations always coincide, the quiz will group them with Algorithmic Probability by default, as symmetry is often viewed as a special case of invariance which can be encoded algorithmically.

  Additionally, **Logical Omniscience (Cluster 1)** and **No-Probabilities-over-Logic (Cluster 2)** are separated only by the *status* of the credence (approximation vs. mistake), not by the truth value of the math. A respondent who believes 0.7 is "pragmatically useful but strictly false" may oscillate between these clusters. The quiz forces a choice in Question 2 and 8, but in practice, these views share the same ontological core.

  **(ii) Coherent but Unnamed Combinations**
  A coherent answer combination exists that has no named defender in the literature: **Subjective Bayesianism with a Computable Unique Prior.** This view would hold that any prior is permissible (Subjective) but also that there is a specific computable prior we should all use (Unique + Computable). This is internally tense: if the prior is uniquely rational, it is not subjective; if it is computable, Logical Induction proponents argue it cannot be a "correct" prior for all logical sentences due to Gödelian constraints. This position is likely empty because it is unattractive: it combines the arbitrariness of subjective Bayesianism with the dogmatism of objective Bayesianism without the theoretical justification for either.

  **(iii) Logical Induction vs. Algorithmic Probability**
  These are better treated as **answers to different questions** rather than direct rivals. Algorithmic Probability (Solomonoff Induction) answers the question: "What is the ideal, uncomputable prior for a superintelligence with infinite resources?" Logical Induction answers the question: "What is the rational standard for a bounded, computable agent operating in real time?"
  Algorithmic Probability provides the *limit* that Logical Induction attempts to *approximate*. A respondent who selects Algorithmic Probability acknowledges the ideal; a respondent who selects Logical Induction acknowledges the constraint. They are rivals only if one insists that the uncomputable ideal is the *only* standard of rationality, rendering bounded agents inherently irrational.
