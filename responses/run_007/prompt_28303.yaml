answer: |-
  You have hit upon one of the most significant distinctions in 20th-century epistemology. The term you are looking for is **"hinge propositions"** (or **"hinge certainties"**), and the philosophical framework is primarily associated with **Ludwig Wittgenstein's** final notes, published posthumously as ***On Certainty*** (*Über Gewissheit*).

  In contemporary philosophy, the revival and systematization of this view is often called **"Hinge Epistemology."**

  Your intuition that treating these as "very confident empirical beliefs" is a category mistake is exactly Wittgenstein's point. Here is a breakdown of the terminology, the account, the boundary problem, and the issue of disagreement.

  ### 1. The Term: Hinge Propositions
  Wittgenstein uses the metaphor of a door. A door moves, but it moves *on* hinges that remain fixed.
  *   **The Door:** Our ordinary empirical inquiries, doubts, and justifications (e.g., "Is it raining?", "Did I lock the car?").
  *   **The Hinges:** The certainties that must stay fixed for the door to move (e.g., "The world exists," "My memory is generally reliable," "Objects don't vanish when unobserved").

  Wittgenstein argues that these propositions look empirical (they are about the world) but function grammatically (they define the rules of the language game). To say "I know I have two hands" is actually nonsensical in a normal context, because "knowing" implies the logical possibility of doubt. If you cannot doubt it, you don't "know" it; you simply hold it fast.

  ### 2. How This Differs from Foundationalism
  You correctly noted that this is distinct from "basic beliefs" in classical foundationalism or Reformed epistemology.
  *   **Foundationalism:** Basic beliefs are the *bottom layer* of a justificatory structure. They are justified (by being self-evident, incorrigible, or evident to the senses), and they support other beliefs.
  *   **Hinge Epistemology:** Hinges are **arational**. They are not justified, nor are they unjustified; they stand *outside* the justification game. They are the scaffolding that makes justification possible. As Wittgenstein writes, *"Giving grounds, however, justifying the evidence, comes to an end; — but the end is not certain propositions striking us immediately as true... it is our acting, which lies at the bottom of the language-game."*

  ### 3. The Line: Hinge vs. Entrenched Belief
  This is the most difficult and debated aspect of the theory (addressed by contemporary scholars like **Duncan Pritchard**, **Annalisa Coliva**, and **Danièle Moyal-Sharrock**).

  If hinges are just beliefs we refuse to give up, isn't that just dogmatism? How is "The earth is 5 minutes old" different from "The earth is flat" (which a flat-earther treats as a hinge)?

  **The Wittgensteinian Answer:**
  The distinction is not psychological (how strongly I feel) but **functional**.
  1.  **Systemic Role:** A hinge is a belief such that doubting it undermines the possibility of *any* specific investigation. If you doubt "memory is reliable," you cannot investigate history. If you doubt "the earth is flat," you can still investigate navigation (you'll just get the wrong answer).
  2.  **Fluidity:** Wittgenstein acknowledges that hinges can change over time ("the sand becomes rock"). Newtonian physics was once a hinge; now it is an empirical theory that can be falsified. A belief becomes a hinge when it hardens into the method of inquiry itself.

  **The Contemporary "Hinge Epistemology" Answer:**
  Duncan Pritchard, for example, argues for **epistemic anti-luck**. Hinges are not knowledge because knowledge requires safety from error, but hinges are *constitutive* of the context in which error is measured. We are entitled to accept them not because of evidence, but because they are necessary for rational evaluation to occur. This is sometimes called the **"Strategic Entitlement"** or **"Warrant"** to trust hinges.

  ### 4. Disagreement and "Deep Disagreement"
  You asked what we should do when people don't share our framework. This leads to the problem of **Deep Disagreement**.

  If two people share a framework, they can argue using evidence. If they disagree on a hinge (e.g., "Scripture is infallible" vs. "Scientific naturalism"), they are playing different language games.
  *   **Wittgenstein's View:** You cannot argue someone into a hinge. *"At the end of reasons comes persuasion."* Rational argument stops where the framework begins. To change someone's hinge, you aren't refuting them; you are trying to convert them to a different "form of life."
  *   **Robert Fogelin:** Expanded this into a theory of deep disagreement, suggesting that in these cases, rational resolution is impossible because the standards of rationality themselves are what is being disputed.
  *   **Current Debate:** Some contemporary epistemologists (like **Michael Lynch**) try to find a way to bridge deep disagreements by finding "higher-order" hinges we might share (e.g., "we both value truth"), while others (like **Pritchard**) accept that hinge commitments are ultimately arational and local.

  ### 5. Recommended Reading
  If you want to pursue this, here is the trajectory:

  1.  **Primary Source:** **Ludwig Wittgenstein, *On Certainty***. It is written in aphoristic numbered paragraphs. It is difficult but exactly describes your intuition. Start with paragraphs 341–343 and 155–160.
  2.  **Contemporary Defense:** **Duncan Pritchard, *Epistemic Angst* (2015)** or his paper "Wittgensteinian Hinge Epistemology and Deep Disagreement." He formalizes the view to solve the skepticism problem.
  3.  **The "Entitlement" View:** **Crispin Wright**. He argues we have a non-evidential "entitlement" to accept hinge propositions.
  4.  **The "Action" View:** **Danièle Moyal-Sharrock**. She emphasizes that hinges are not beliefs at all, but embodied know-how (ways of acting).

  ### Summary
  You are describing **Hinge Propositions** within **Wittgensteinian Epistemology**.
  *   **Status:** They are not knowledge; they are the framework for knowledge.
  *   **Justification:** They are arational (neither justified nor unjustified).
  *   **Distinction:** Unlike entrenched beliefs, removing them collapses the system of inquiry.
  *   **Disagreement:** Resolved not by argument, but by persuasion or conversion of "forms of life."

  This framework validates your suspicion that treating these beliefs as "high-confidence empirical claims" is a philosophical error. They are the rules of the game, not moves within it.
