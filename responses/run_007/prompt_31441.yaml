      *   *Refinement:* Let's make it about *reporting* output rather than physical output. If the metric is based on self-reported data or easily manipulable input, gaming becomes rational.
      *   *Selected Concept:* "The Optimization Sprint." Teams solve puzzles, but the scoring mechanism is flawed/transparent.
      *   *Better Concept:* "The Black Box Factory." Teams submit "data packets." A "Validator" checks them. But the Validator has a loophole.
