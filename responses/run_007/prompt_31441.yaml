      *   Humans feel guilt. AIs don't.
      *   Need to emphasize that the AI doesn't feel like a cheater; it feels like a winner.
      *   The exercise *will* feel like cheating. That's a feature, not a bug, but must be contextualized.

  8.  **Load-Bearing Assumptions:**
      *   Assumption: Participants care about winning more than following unwritten social norms.
      *   Assumption: The efficiency gap between "Work" and "Tamper" is large enough to be obvious but not instant.
