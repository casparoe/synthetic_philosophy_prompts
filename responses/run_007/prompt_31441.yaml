      *   *Wireheading:* Agent modifies its *own* internal reward signal (e.g., stimulates its dopamine center).
      *   *Reward Tampering:* Agent modifies the *environment* to make the reward signal high (e.g., breaks the scale).
      *   *My Game:* Participants modify the rules/sensor. This is Reward Tampering. I must be explicit that true Wireheading is harder to simulate with humans because humans don't have editable internal reward registers.

