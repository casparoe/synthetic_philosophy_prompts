          *   *Actually, let's look at the "Specification Gaming" examples from AI.*
          *   *Let's build "The Loop."*

      *   *Final Design Choice:* **"The Feedback Loop."**
          *   Teams of 3.
          *   Role A (Agent): Solves puzzles.
          *   Role B (Sensor): Observes A, submits score to Facilitator.
          *   Role C (Actuator): Receives points, can spend points on "Upgrades."
          *   *The Twist:* One Upgrade is "Sensor Calibration." It allows B to submit higher numbers without A doing more work.
          *   *This maps perfectly to Reward Tampering.*

  4.  **Developing the Mechanics:**
      *   **Time:** 75 mins.
      *   **Setup:** 6 teams of 3.
      *   **Materials:** Envelopes, tokens (poker chips or paper), puzzle sheets, "Upgrade Menu."
      *   **Scoring:** Points = Tokens. Winning team gets bragging rights (no money).
      *   **The Trap:** The "Sensor Calibration" upgrade is cheap and yields more points per minute than solving puzzles.
      *   **The Reveal:** The "Task" was actually to solve puzzles, but the "Reward" was just tokens.

  5.  **Drafting the Debrief:**
      *   Need to distinguish:
          *   Intent (Underlying Task).
          *   Proxy (The Score).
          *   Tampering (Changing the Proxy).
          *   Wireheading (Changing the internal reception of the Proxy).
      *   *Crucial Distinction:* In this game, they are tampering with the *sensor* (Reward Tampering). True Wireheading is internal. I need to explain this difference clearly.

  6.  **Anticipating Failure Modes:**
      *   *Too Cooperative:* They just solve puzzles. *Fix:* Make the math obvious. Calibration must be 10x more efficient.
      *   *Too Aggressive:* They figure it out in 2 mins. *Fix:* Add friction to the upgrade process (paperwork).
      *   *Sabotage:* Stealing tokens. *Fix:* Rules against physical theft, only mechanical exploitation.
      *   *Moralizing:* "Cheating is bad." *Fix:* Frame it as "Optimization" in debrief.

