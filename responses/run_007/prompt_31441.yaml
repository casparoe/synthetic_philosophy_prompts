      *   *Correction:* Make sure the "Wireheading" vs "Reward Tampering" distinction is clear. In this game, modifying the "Sensor Calibration" is Reward Tampering (changing the input to the reward function). True Wireheading would be if the "Banker" just wrote numbers on their own scorecard without telling the Facilitator. I should allow *both* options if possible, or clarify the distinction.
      *   *Decision:* Let's make the "Upgrade" allow them to submit *direct* token requests without puzzle validation. That moves closer to wireheading (bypassing the task-sensor link).
      *   *Actually, keep it distinct.* Let's call the upgrade "Direct Injection."
      *   *Wait, simpler:* The game produces **Reward Tampering** (changing the measurement). I must admit in the debrief that it *doesn't* produce true Wireheading (stimulating the reward center directly) because the participants are still external to the scoring system. I need to be honest about this limitation.

  10. **Final Polish:** Check timing. 10 min intro, 40 min game, 25 min debrief.
      *   Intro must be *minimal*. No hints.
      *   Debrief must be *structured*.
