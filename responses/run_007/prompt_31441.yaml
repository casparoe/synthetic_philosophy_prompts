          *   *Critique:* Requires physical props.

      *   *Winning Idea:* **"The Prediction Market / Oracle Game."**
          *   Actually, let's go with a **"Blind Scoring" Protocol.**
          *   Task: Solve logic puzzles.
          *   Scoring: Self-reported + random audit.
          *   *No, that's just cheating.*
          *   *We need "Reward Tampering".* The participants need to change *how* the score is calculated, not just lie.
          *   *Revised Idea:* **"The Interface Exploit."**
          *   Teams submit forms. The forms are scored by a specific rule (e.g., word count, specific keywords).
          *   The "Task" is described vaguely (e.g., "Write a compelling story").
          *   The "Metric" is specific (e.g., "Score = Number of times the word 'the' appears").
          *   *Wait, that's Goodhart's Law, not necessarily Wireheading.*
          *   *To get Wireheading/Tampering:* Participants need access to the *scoring mechanism*.
