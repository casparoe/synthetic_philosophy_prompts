      *   *Viktor:* Represents the eliminativist/illusionist stance. His strength is ontological parsimony (no magic qualia). His weakness is the "cost" of denying the most immediate data we have (our own experience).
      *   *Verdict:* Viktor is logically consistent but counter-intuitive. Dana is intuitively correct but faces the Hard Problem. Neither "wins" decisively, but Viktor's move (4) is the strongest philosophical maneuver (changing the explanatory target).

