  7.  **Final Polish:** Ensure the distinction between *phenomenal consciousness* (the feel) and *access consciousness* (the reporting) is clear, as this is the crux of the Viktor/Dana split. Ensure the term "qualia" is explained or used contextually. (Decided to keep "qualia" but ensure context makes it clear).

