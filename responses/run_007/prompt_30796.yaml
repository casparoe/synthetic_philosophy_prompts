          *   *Assessment:* This is the classic "phenomenal concept" objection. It relies on the intuition that the appearance of consciousness *is* consciousness.
          *   *Weakness:* It assumes what it tries to prove (that the "feel" is irreducible).

      *   **(2) Viktor's Reply:** Illusionists deny the "qualitative glow" (qualia), not the experience itself. Illusion = misrepresentation. Misrepresentation doesn't need qualia (e.g., smoke detector).
          *   *Assessment:* Standard illusionist defence (Frankish, Dennett). Distinguishes between *access consciousness* (reporting/processing) and *phenomenal consciousness* (the 'what it's like').
          *   *Weakness:* The smoke detector analogy is weak because it lacks the "conviction" or "seeming" that humans have.

      *   **(3) Dana's Counter:** Smoke detectors don't *feel* misled. The Hard Problem is about the "something it's like." Relocating the mystery doesn't solve it. The *conviction* itself is conscious.
          *   *Assessment:* Strong point. The "seeming" is the target. If the seeming is real, consciousness is real.
          *   *Weakness:* Assumes the "seeming" can't be a functional state.

      *   **(4) Viktor's Concession/Reframe:** Relocation is progress if tractable. New problem: Why do cognitive systems produce "phenomenal glosses"? This is cognitive science, not metaphysics.
