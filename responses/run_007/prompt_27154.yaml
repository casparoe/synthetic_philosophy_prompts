          *   Status: False for humans, true for ideal agents.
          *   Semantics: Supported by standard Kripke frames (transitive/closed sets of worlds).
          *   Problem: It *is* the problem of logical omniscience. It doesn't solve it; it asserts it as a feature.

      *   *Option 2: Normative/Idealisation (The Student's First Claim).*
