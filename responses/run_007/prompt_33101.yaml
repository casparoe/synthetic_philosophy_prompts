answer: |-
  **Title:** Two Problems, One Label? Distinguishing Compositional and Attitudinal Demands in the Frege-Geach Problem

  **Research Question**
  Does a compositional semantics for normative embeddings necessarily secure the requisite relations of psychological inconsistency between normative attitudes? Specifically, I will argue that the standard Frege-Geach (F-G) challenge conflates two distinct demands: the *Compositional Demand* (assigning semantic values to sentences in embedded contexts to preserve validity) and the *Attitudinal Demand* (explaining why the mental states expressed by inconsistent sentences are genuinely inconsistent). My central hypothesis is that satisfying the Compositional Demand does not entail satisfying the Attitudinal Demand, and that prominent expressivist solutions often rely on this equivocation.

  **Motivation and Existing Literature**
  The F-G problem is typically presented as a single hurdle: explain how normative sentences function in logic. However, logical validity (a semantic property) and psychological inconsistency (a property of mental states) are distinct categories. Expressivists must bridge this gap.
  *   **Blackburn (Quasi-Realism):** Focuses heavily on the Compositional Demand, mimicking truth-conditional logic via higher-order attitudes. I will examine whether this mimicry sufficiently explains the *nature* of the inconsistency in the Attitudinal Demand, or merely its structure.
  *   **Gibbard (Norm-Expressivism/Planning):** Solves compositionality via consistency of planning states. However, it remains under-specified whether the logical consistency of plans maps one-to-one onto the psychological inconsistency required by the negation problem.
  *   **Schroeder (Being-For):** Explicitly targets the Attitudinal Demand (the Negation Problem). Yet, his critique assumes that previous views failed the Attitudinal Demand *because* they failed the Compositional one. I will challenge this dependency.
  *   **Hybrid Views:** Often posit dual semantic values. I will assess whether the descriptive component solves Compositionality while the normative component solves Attitudinality, and if so, whether the link between them is justified.

  Current literature treats a solution to logic as a proxy for a solution to psychology. This project isolates the inference to test its validity.

  **Methodology**
  The paper will proceed via conceptual analysis supported by a lightweight formal framework. I will not construct a full model-theoretic semantics. Instead, I will utilize a simplified propositional schema to map:
  1.  Semantic values assigned to $P$ and $\neg P$ in embedded contexts (Compositional).
  2.  The taxonomy of mental states expressed by $P$ and $\neg P$ (Attitudinal).

  I will construct a "gap argument": I will demonstrate a possible world (or theoretical model) where a view satisfies (1) — preserving validity in modus ponens and negation — but fails (2) — allowing an agent to hold both states without rational conflict. If such a model is coherent, the inference from Compositionality to Attitudinality is broken.

  **Expected Results and Success Conditions**
  A successful project will produce a taxonomy of expressivist strategies, categorizing them by whether they prioritize Compositionality, Attitudinality, or the link between them. The determinate conclusion will be that the Compositional Demand is necessary but not sufficient for the Attitudinal Demand. I will argue that expressivists require an independent constraint on attitude taxonomy (beyond logical structure) to solve the F-G problem fully.

  **Failure Conditions**
  The project would fail if: (1) it turns out that standard compositional solutions *logically entail* the correct attitude relations (making the distinction illusory); or (2) the distinction is so fine-grained that it cannot be meaningfully discussed within 6000 words without collapsing back into standard F-G exegesis.

  **Feasibility**
  The scope is limited to the *relationship* between the two demands, not a novel solution to F-G itself. The formal work is restricted to propositional schemas, avoiding complex predicate logic or possible worlds semantics. This ensures completion within one semester.
