prompt: |-
  ok so i've been going down a rabbit hole on information cascades and rational herding because everyone in my friend group is suddenly moving to the same city and i can't tell if they know something i don't or if theyre all just following each other. i've ended up with a bunch of views and i want to know if theyre actually consistent before i make a fool of myself. here's roughly where i've landed:

  1. rational people with private information can end up in an information cascade where later people rationally ignore their own signal and copy earlier people, and the cascade can settle on the wrong action.
  2. if i'm unsure and a lot of people around me seem to be doing the same thing, i should usually go along, because that behavior probably encodes a bunch of private information i don't have.
  3. cascades are fragile: a small amount of public information or one credible contrarian can shatter them.
  4. i also think markets and prediction markets are usually pretty good at aggregating dispersed information, and that's a big part of why i trust prices.
  5. but i also think cascades explain real bubbles and bank runs, where rational people pile into or out of something that's come unmoored from fundamentals.
  6. being a contrarian for its own sake is irrational; if i have no private signal, going against the crowd is just noise.

  are these consistent? i can sort of feel that some of them pull against each other but i don't trust my sense of which ones. go through them and tell me which pairs are actually in tension and which only look like they are, and rank the real tensions by severity. then tell me what the cheapest fix would be for each, and which single revision would clean up the most.
