answer: |-
  You have correctly identified that the stalemate is not arithmetic; it is metaphysical, causal, and normative. If both sides accept $h^2 \approx 0.6$ for adult IQ in developed nations, the persistence of the fight indicates that heritability estimates are functioning as **Rorschach tests for causal models of human development.**

  Here is a diagnosis of what kind of disagreement this is, followed by a proposal for how (and whether) it can be unstuck.

  ### 1. The Diagnosis: Three Layers of Disagreement

  This is not merely a verbal dispute about the definition of heritability, nor is it purely a political proxy war. It is a **modal disagreement** (about possibility and necessity) wrapped in a **causal disagreement** (about mechanisms), fueled by **divergent priors** on human plasticity.

  #### A. The Modal Disagreement: Essence vs. Trajectory
  *   **Side A (Hereditarian-leaning):** Treats high heritability as evidence of a **fixed essence**. In this model, genes provide a blueprint or a ceiling. The environment is merely the noise that prevents the blueprint from being perfectly read. If $h^2$ is high, the "true" signal is genetic, and the environmental noise is diminishing.
  *   **Side B (Environmental-leaning):** Treats high heritability as evidence of a **canalized trajectory**. In this model, genes are switches that respond to environmental inputs. High heritability in a stable environment just means everyone is on a similar track. It implies nothing about what happens if the track changes.
  *   **The Clash:** Side A sees the statistic as describing the *limit* of change; Side B sees it as describing the *current stability* of the system.

  #### B. The Counterfactual Disagreement: Stability of $h^2$
  This is the technical core of the stalemate. Heritability is specific to the population and environment in which it is measured.
  *   **The Hereditarian Prior:** Assumes the current range of environments in developed nations is the "normal" or "relevant" range. Therefore, the $h^2$ estimate is robust and travels well.
  *   **The Environmentalist Prior:** Assumes the current range of environments is arbitrary or suboptimal. They argue that $h^2$ is not stable across environmental shifts. If you change the environment (e.g., universal high-quality preschool, nutrition, toxin removal), the variance attributed to genes could plummet because the environmental variance has been equalized or optimized.
  *   **The Clash:** Side A asks, "What predicts differences *here and now*?" Side B asks, "What would predict differences *if we changed the system*?" Heritability answers the first; Policy requires the second.

  #### C. The Normative Disagreement: Prediction vs. Intervention
  *   **Prediction:** High $h^2$ is useful for predicting outcomes within the current status quo (e.g., educational tracking). Side A emphasizes this utility.
  *   **Intervention:** High $h^2$ is logically irrelevant to the success of an intervention. (Example: Phenylketonuria is 100% heritable, but 100% treatable by diet). Side B emphasizes this logical gap.
  *   **The Clash:** The fight persists because Side A often uses $h^2$ to argue against the *efficacy* of intervention (a causal claim), while Side B uses the *potential* for intervention to argue against the *importance* of $h^2$ (a normative claim).

  ### 2. Why Technical Knowledge Doesn't Solve It

  You noted that experts know the definitions but still disagree. This is because the disagreement has shifted from **statistics** to **biology**.

  Even if everyone agrees on the formula $V_P = V_G + V_E + V_{GxE}$, they disagree on the magnitude of $V_{GxE}$ (Gene-Environment Interaction).
  *   If $V_{GxE}$ is small, heritability is stable, and the Hereditarian view holds more water.
  *   If $V_{GxE}$ is large (e.g., the **Scarr-Rowe hypothesis**, where heritability is lower in low-SES environments because deprivation suppresses genetic potential), then the Environmentalist view holds: changing the environment changes the heritability.

  Current behavioral genetics suggests $V_{GxE}$ exists but is complex. Because we cannot ethically run the controlled experiments required to map the full "reaction norm" of IQ across all possible environments, both sides are filling the empirical gap with priors about human nature.

  ### 3. Can It Be Unstuck?

  There is no "silver bullet" that will satisfy the political motivations on both sides. However, the scientific debate can be unsticky if we change the **unit of analysis**.

  #### The Move: Abandon Variance Partitioning for Causal Mechanisms
  The fight stalls because "heritability" is a variance statistic, not a causal mechanism. It tells you how much variation is associated with genetic variation *in a specific context*. It does not tell you *how* the genes build the trait.

  **To unstick the debate, shift the question from "How much?" to "How?"**

  1.  **Focus on the Flynn Effect as a Proof of Concept:**
      The secular rise in IQ (Flynn Effect) proves that population-level IQ can shift dramatically in timeframes too short for genetic evolution. This validates the Environmentalist claim that $h^2$ estimates are not destiny. However, it does not validate the claim that *individual differences* within a generation are primarily environmental. Acknowledging both truths simultaneously dissolves the binary.

  2.  **Adopt the "Reaction Norm" Framework:**
      Stop asking "Is IQ heritable?" and start asking "What is the **reaction norm** of IQ?"
      *   A reaction norm plots the phenotypic expression of a genotype across a range of environments.
      *   If the lines are parallel, $h^2$ is stable. If they cross (interaction), $h^2$ changes.
      *   **The Unsticking Move:** Admit that we do not know the full reaction norm for IQ. Therefore, *any* claim that high $h^2$ limits intervention is scientifically unsupported. Conversely, admit that *within* the current reaction norm, genetic differences are the dominant predictor of variance.
      *   This forces Side A to admit intervention is possible (we just don't know the bounds) and Side B to admit prediction is currently genetic-dominated.

  3.  **Separate "Cause of Variation" from "Cause of Level":**
      This is the most critical philosophical distinction.
      *   Heritability explains the **cause of variation** (why John differs from Jane).
      *   Environment often explains the **cause of the level** (why John and Jane are smarter than their grandparents).
      *   **The Move:** Explicitly state that high heritability of *differences* is compatible with environmental control of the *mean*. Once this is accepted as a non-contradictory baseline, the "destiny" argument loses its footing, and the "hereditarianism is racist" argument loses its scientific footing.

  ### 4. Conclusion: A Permanent Tension?

  Ultimately, this disagreement is **polysemous**. It is a scientific debate that has been conscripted into a moral one.

  *   **Scientifically:** The move to unstick it is to treat heritability as a **local parameter** (like air pressure) rather than a **universal constant** (like gravity). It applies only to the specific environment measured.
  *   **Politically:** The fight will not end because it is a proxy for the **Equality of Opportunity vs. Equality of Outcome** debate.
      *   If IQ is highly malleable, inequality suggests systemic failure (requiring redistribution/reform).
      *   If IQ is largely fixed, inequality suggests natural sorting (requiring acceptance/management).

  **The Verdict:** The disagreement is substantive regarding **causal stability** (will $h^2$ hold if we change schools?), but it is verbal/normative regarding **implication** (does $h^2$ matter for justice?).

  The only move that unsticks the *science* is to stop using heritability estimates to make policy claims. Heritability describes the status quo; policy aims to change it. Using a statistic of the status quo to argue against changing the status quo is a **naturalistic fallacy**. Pointing this out doesn't end the political fight, but it removes the scientific camouflage from it.
