answer: |-
  # Seminar Handout: Mapping the Wager
  **Philosophy of Religion | Graduate Seminar**

  ## 1. Purpose and Starting Point
  This decision tree is designed to sort your position on Pascal's Wager based on your underlying philosophical commitments rather than historical labels. We begin with a baseline commitment regarding the legitimacy of pragmatic reasons in religious contexts.

  **Starting Commitment:**
  > *"I accept that, when the evidence does not settle whether God exists, considerations about how one's life would go — including what one risks gaining or losing — may legitimately bear on whether to commit oneself to a theistic way of life."*

  **Instructions:**
  Follow the branch questions below. Answer based on your genuine philosophical intuition, even if it requires modifying the Starting Commitment. Technical terms are defined in the glossary at the end.

  ---

  ## 2. The Decision Tree

  **Q1. Scope of Pragmatic Reasons**
  Does this legitimacy hold even if the epistemic evidence slightly *favors* non-belief, provided the evidence is not conclusive?
  *   **No:** Pragmatic reasons are only permissible when evidence is perfectly balanced (epistemic parity). → **Go to Q5**
  *   **No:** Pragmatic reasons are never permissible for belief formation; only evidence counts. → **Leaf A: Evidentialist Rejection**
  *   **Yes:** Pragmatic reasons can override or supplement inconclusive evidence. → **Go to Q2**

  **Q2. Direct Doxastic Control**
  Can a human agent directly choose to believe a proposition simply by willing it, without further evidence?
  *   **Yes:** Belief is under direct voluntary control. → **Leaf B: Direct Voluntarism**
  *   **No:** Belief is not directly under voluntary control. → **Go to Q3**

  **Q3. Indirect Doxastic Control**
  Can an agent indirectly cultivate belief by choosing actions (e.g., attending worship, taking holy water) that causally produce belief over time?
  *   **No:** One cannot influence belief formation voluntarily at all; one can only act *as if* one believes. → **Leaf C: Involuntarist Pretense**
  *   **Yes:** Belief can be cultivated indirectly through habit and practice. → **Go to Q4**

  **Q4. The Goal of Cultivation**
  If belief is cultivated indirectly, is the primary rational justification the *internal benefit of having the belief* (e.g., psychological stability, moral character) or the *external payoff* contingent on the belief being true (e.g., salvation)?
  *   **Internal Benefit:** The value lies in the state of belief itself. → **Leaf D: Indirect Voluntarist Pragmatism**
  *   **External Payoff:** The value lies in the consequence if theism is true. → **Go to Q6**

  **Q5. Probability Assignment (For Q1 "Parity" Answers)**
  Must the probability of God's existence be quantifiable (e.g., 50%) to warrant a wager, or is it enough that the hypothesis is "live" (psychologically possible)?
  *   **Quantifiable:** We need specific probabilities. → **Leaf E: Restricted Parity Wager**
  *   **Live Option:** Any non-zero possibility suffices in forced, momentous choices. → **Leaf F: Jamesian Pragmatism**

  **Q6. Coherence of Infinite Utility**
  Does the concept of an "infinite reward" (eternal bliss) function coherently in a rational calculation, or does it break the mathematics of decision theory?
  *   **Breaks Math:** Infinite values cannot be compared or calculated (e.g., problems with mixed strategies). → **Leaf G: Decision-Theoretic Critique**
  *   **Coherent:** Infinite value can be used in calculation. → **Go to Q7**

  **Q7. Hypothesis Multiplicity**
  Must we assign probability to exactly one specific God (e.g., the Christian God), or must we divide probability among many competing deity hypotheses?
  *   **One Live Hypothesis:** Only one specific god is culturally/intellectually "live." → **Go to Q9**
  *   **Many Hypotheses:** We must account for many competing gods. → **Go to Q8**

  **Q8. Symmetry of Hypotheses**
  Can these many god-hypotheses be grouped into a generic category (e.g., "Rewarding Deity" vs. "Punishing Deity") that preserves the wager's logic?
  *   **No:** The requirements of different gods are mutually exclusive and symmetrical (e.g., one rewards belief, another punishes it). → **Leaf H: Many-Gods Objection**
  *   **Yes:** We can wager on a generic theism that covers most rewarding deities. → **Leaf I: Retreat to Generic Theism**

  **Q9. Divine Sensitivity to Motive**
  Would a God worthy of worship reward a commitment made primarily to avoid hell or gain heaven (self-interested faith)?
  *   **No:** Self-interested faith is insincere and would be rejected or punished by God. → **Leaf J: Anti-Wager Theism**
  *   **Yes:** God rewards the risk/commitment regardless of the initial motive. → **Leaf K: Classical Pascalian Wager**

  ---

  ## 3. Logical Space and Position Location

  ### Glossary of Technical Terms
  *   **Expected Utility:** The sum of possible outcomes of a decision, each weighted by its probability and value (Probability × Payoff).
  *   **Dominance:** A decision rule where one option is chosen because it yields a better outcome than alternatives in *every* possible state of the world, regardless of probability.
  *   **Infinite Value:** A magnitude greater than any finite number. In decision theory, adding any finite cost to an infinite gain still results in an infinite gain.
  *   **Doxastic Voluntarism:** The view that beliefs are subject to the will (either directly or indirectly).

  ### Map of Positions
  The following table locates the required positions within the tree structure above.

  | Leaf Label | Position Name | Path Summary |
  | :--- | :--- | :--- |
  | **Leaf A** | **Evidentialist Rejection** | Q1 (Never permissible). |
  | **Leaf B** | **Direct Voluntarism** | Q1 (Yes) → Q2 (Yes). |
  | **Leaf C** | **Involuntarist Pretense** | Q1 (Yes) → Q2 (No) → Q3 (No). |
  | **Leaf D** | **Indirect Voluntarist Pragmatism** | Q1 (Yes) → Q2 (No) → Q3 (Yes) → Q4 (Internal). |
  | **Leaf E** | **Restricted Parity Wager** | Q1 (Parity) → Q5 (Quantifiable). |
  | **Leaf F** | **Jamesian Pragmatism** | Q1 (Parity) → Q5 (Live Option). |
  | **Leaf G** | **Decision-Theoretic Critique** | Q1 (Yes) → ... → Q4 (External) → Q6 (Breaks Math). |
  | **Leaf H** | **Many-Gods Objection** | Q1 (Yes) → ... → Q6 (Coherent) → Q7 (Many) → Q8 (No). |
  | **Leaf I** | **Retreat to Generic Theism** | Q1 (Yes) → ... → Q6 (Coherent) → Q7 (Many) → Q8 (Yes). |
  | **Leaf J** | **Anti-Wager Theism** | Q1 (Yes) → ... → Q7 (One) → Q9 (No). |
  | **Leaf K** | **Classical Pascalian Wager** | Q1 (Yes) → ... → Q7 (One) → Q9 (Yes). |

  ### Diagnosis of Unoccupied or Unstable Combinations
  *   **Leaf B (Direct Voluntarism):** This position is largely unoccupied in contemporary philosophy. *Diagnosis:* Most philosophers find the psychological claim that one can believe "at will" phenomenologically implausible, rendering this logical space empty despite being conceptually possible.
  *   **Leaf E (Restricted Parity Wager):** This position is rarely defended as a terminal view. *Diagnosis:* If one requires quantifiable probability for parity, one usually slides into the Classical Wager (using Dominance to bypass probability) or the Jamesian view (rejecting the need for quantification); insisting on precise parity without infinite payoffs makes the wager mathematically weak.

  ### Flagged Pairs: Difficult Distinctions
  The tree cannot cleanly separate the following pairs, as they rely on nuanced interpretations of the same commitment:
  1.  **Leaf D (Indirect Voluntarist) vs. Leaf K (Classical Wager):** Both accept indirect belief cultivation. The distinction rests on whether the *ultimate* justification is the internal good of belief (D) or the external reward of salvation (K). In practice, proponents of K often argue for D as the *mechanism*, making these views complementary rather than mutually exclusive.
  2.  **Leaf I (Generic Theism) vs. Leaf K (Classical Wager):** Both accept the wager's logic. The distinction rests on whether "Generic Theism" counts as a successful defense of the wager or a concession that the specific Pascal-style wager failed. The tree treats them as distinct outcomes, but argumentatively, Generic Theism is often a *modification* of the Classical Wager rather than a rejection.

  ---

  ## 4. Tutor's Note on Usage
  When discussing your position in seminar, refer to the **Leaf Label** or **Position Name** from the table. If you find yourself oscillating between two leaves (e.g., between **Generic Theism** and **Many-Gods**), identify which branch question is the source of tension (e.g., Q8 on Symmetry). This will help us target the specific philosophical fault line rather than debating historical interpretations of Pascal.
