          *   However, libertarians might argue for agent-causation or non-physical mental states that evade physical prediction.
          *   But generally, the physicalist framing is standard in contemporary analytic metaphysics of free will.
      *   **Critique/Refinement of the Essay:**
          *   The argument assumes the *infallibility* of the sign is required for the *actual* responsibility. Frankfurtians deny this. They say: In the actual world, Jones acts freely. The sign is only relevant in the *nearest possible world* where Jones tries to do otherwise.
          *   The user's point about "Causal Non-Sufficiency" is the crux. If the sign is sufficient, it's deterministic. If not, how is it reliable?
