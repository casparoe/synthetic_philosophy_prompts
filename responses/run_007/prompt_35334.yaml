          *   Explain the Frankfurtian reply: *Actual Sequence*. The reliability of the sign matters for the *counterfactual* scenario, but in the *actual* scenario (where Jones chooses on his own), the sign's causal power is irrelevant to responsibility. The sign is just a "backup."
          *   Mention "Blockage Cases" as a way to bypass the sign problem entirely.
      *   **Addressing Question 2 (Literature):**
          *   Direct hit: **David Widerker** ("Libertarianism and Frankfurt's Attack on the Principle of Alternative Possibilities", 1995). This is the "Dilemma Defense."
          *   **Robert Kane** (The Significance of Free Will).
          *   **John Fischer & Mark Ravizza** (Responsibility and Control). They shift focus to "guidance control" and actual sequences.
