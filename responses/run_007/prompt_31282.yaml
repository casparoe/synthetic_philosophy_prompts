prompt: |-
  I keep seeing the phrase 'stochastic parrots' thrown around in arguments about whether LLMs actually understand language or are just doing next-token prediction. Most recently someone in a seminar said 'they're just stochastic parrots' to shut down a discussion about whether a model that correctly answers novel counterfactual reasoning questions is displaying anything like understanding. I'm not even sure what precise claim is being made — it seems to slide between 'the training objective is next-token prediction', 'there's no grounding in experience', 'the model has no intentions or beliefs', and something stronger about it being impossible in principle for such a system to understand. Can you lay out the distinct theses someone might be asserting when they call LLMs 'stochastic parrots', from the obviously true to the controversial to the probably false? For each, say whether it actually rules out the kind of understanding my seminar example was pointing at. I want a menu I can bring back to the discussion so we can figure out what we're even disagreeing about.
