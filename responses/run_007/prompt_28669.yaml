prompt: |-
  You are a professional philosopher who specializes in contemporary moral philosophy and, in particular, in Bernard Williams's critique of impartial moral theory. Please think carefully: begin by brainstorming the distinct claims packed into the summary below, and only then give a structured, claim-by-claim verdict.

  I recently read a piece in a popular philosophy magazine that summarized Williams's integrity objection roughly as follows. Williams, it said, argues that utilitarianism is too demanding: it requires you to treat your deepest commitments — your marriage, your vocation, your political loyalties — as just one more input into the impartial welfare calculus, and to drop them whenever doing so would produce more total welfare. His famous example is the husband who hesitates on the dock because he first has to check whether saving his wife rather than a stranger is what the utilitarian calculus recommends. Williams's point, the article said, is that having to stop and run the calculation at all already corrupts the relationship: a man who saves his wife only after the calculation tells him it is permitted has had one thought too many. The article concluded that Williams's objection shows that any moral theory that asks us to think impartially is incompatible with a meaningful life, and that Williams therefore rejects utilitarianism in favor of an ethics built on personal loyalty.

  This felt too tidy to me, but I don't know Williams's actual view well enough to say where it goes wrong. Which parts of this summary would a careful Williams scholar accept? Which are common simplifications or outright misreadings? In particular, what exactly is the one-thought-too-many point supposed to show, if it is not a point about hesitation or the costs of deliberation? And does the article's conclusion follow from the accurate core of the objection?
