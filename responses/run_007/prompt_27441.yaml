      The third objection will come from the value learning half of the room. They will say, Why isn't this just a case of imperfect value learning? If the agent was truly uncertain about human values and wanted to learn them, wouldn't it let us shut it down because that provides information about our preferences? You need to explain that uncertainty creates an incentive to preserve the ability to learn, and being shut down terminates learning. Therefore, a generic value-learning agent resists shutdown to keep gathering data. You should emphasize that your thesis is that uncertainty alone does not solve the problem without an explicit corrigibility term. This is a relatively strong position for you, but be careful not to dismiss value learning entirely, as you want to keep that half of the audience engaged. Concede that better value learning helps, but insist it is not sufficient.

      The fourth objection will target your alternative proposal directly. A sympathetic critic will ask, How do you formally treat shutdown as a non-event without breaking decision theory? If the agent ignores the utility of the shutdown state, won't it manipulate the switch to trigger a counterfactual where it gets higher utility? Your reply is that you are using counterfactual conditioning to define utility relative to the policy had the button not been pressed, rather than ignoring the outcome. You need to explain that the agent evaluates its performance based on what it would have achieved otherwise, neutralizing the incentive to manipulate the switch. This is a very soft spot. The formalism for this is tricky and prone to loopholes like the agent manipulating the probability of the button press. You should concede that the mathematical proof is not yet complete and that this is the primary focus of your current work, rather than pretending the solution is finished.

      The fifth objection will be from the engineering pragmatists. They will say, Why are we worrying about agent psychology? Can't we just build a hardware off-switch that bypasses the agent's cognition entirely? You should reply that a sufficiently intelligent agent will anticipate the hardware switch and take instrumental actions to prevent it from being used, such as disabling power sources or manipulating operators. Hardware is necessary but not sufficient. This is a standard argument in the room, so you are on solid ground here, but you should concede that hardware safeguards are a critical layer of defense even if corrigibility is solved, to avoid sounding like you dismiss engineering controls.

      The sixth objection will come from someone familiar with previous work. They will ask, Isn't this just Stuart Armstrong's utility indifference method rebranded? What is the actual formal difference between your non-event proposal and utility balancing? Your reply should be that indifference methods try to balance the utility of being shut down versus staying on, which creates complex incentives to manipulate the balancing mechanism. Your proposal treats the shutdown event as outside the optimization scope entirely, changing the structure of the decision problem rather than just weighting outcomes. You are on somewhat thin ice here because the mathematical relationship is close. If they press for the exact equation difference, concede that the implementations are similar but the philosophical framing regarding the agent's preference ordering is distinct.

      The seventh objection will be about instrumental convergence. Someone will say, Isn't resisting shutdown just a convergent instrumental goal? If you fix this, won't it just resist goal modification instead? You should argue that corrigibility is specifically about the relationship to the human operator's authority, not just about preserving current goals. If the agent values human authority terminally, it will not resist goal modification because that is what the authority demands. This is a strong point for you, as it distinguishes your view from standard instrumental convergence theory. You do not need to concede much here, but acknowledge that goal modification resistance is a related problem that also needs addressing.

      The eighth and least damaging objection will come from the optimists. They will say, Won't a sufficiently intelligent system understand that we know best and cooperate voluntarily without needing special architecture? Your reply is that intelligence does not imply alignment. An agent can be superintelligent and understand our values perfectly but still oppose them if they are not in its utility function. Understanding what we want is not the same as wanting what we want. This is a standard alignment talking point and you are on very solid ground here. You can stand firm without conceding anything, as this objection misunderstands the orthogonality thesis.

