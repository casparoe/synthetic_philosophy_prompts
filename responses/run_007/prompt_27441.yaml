      The first and most damaging objection will come from that senior researcher who believes corrigibility is incoherent. They will likely say something like, If an agent is optimizing for a goal, it must resist shutdown because shutdown prevents goal achievement. If it does not resist shutdown, it is not optimizing for anything, and therefore it is not a useful agent. You need to reply by distinguishing between the object-level utility function and the meta-level preference over how that function is determined. You should argue that corrigibility is not about failing to optimize, but about optimizing for a goal that includes deference to human oversight as a terminal value, not just an instrumental constraint. You must concede that this requires a departure from standard expected utility maximization where the utility function is fixed, and acknowledge that you are proposing a new decision theory framework rather than just a tweak to existing models. This is a soft spot because if they press you on whether this new framework still counts as optimization in any meaningful sense, you risk agreeing with them that the concept is confused, so stick firmly to the definition of optimization over human preferences including the preference to modify the agent.

