  The first and most damaging objection will come from that senior researcher who believes corrigibility is incoherent. They will likely say something like, if an agent is optimizing for a goal, it must resist shutdown because shutdown prevents goal achievement, and if it does not resist shutdown, it is not optimizing for anything, and therefore it is not a useful agent. You need to reply by distinguishing between the object-level utility function and the meta-level preference over how that function is determined. You should argue that corrigibility is not about failing to optimize, but about optimizing for a goal that includes deference to human oversight as a terminal value, not just an instrumental constraint. You must concede that this requires a departure from standard expected utility maximization where the utility function is fixed, and acknowledge that you are proposing a new decision theory framework rather than just a tweak to existing models. This is a soft spot because if they press you on whether this new framework still counts as optimization in any meaningful sense, you risk agreeing with them that the concept is confused, so stick firmly to the definition of optimization over human preferences including the preference to modify the agent.

  The second objection is the one I am hoping nobody asks because it threatens the viability of your entire research agenda. Someone will ask, if you succeed in making an agent treat shutdown as a non-event, have you effectively lobotomized it, and won't a corrigible agent be so passive that it refuses to take necessary risks to achieve our goals, rendering it useless for high-stakes tasks? Your reply should be that corrigibility is about the response to operator intervention, not about risk aversion in general. You can argue that an agent can be aggressive in pursuing goals while remaining neutral about being shut down during the process. However, you are on thin ice here. There is a genuine tension between capability and safety, and if they push on whether your non-event proposal reduces the agent's drive to prevent accidental shutdowns that look like intentional ones, you should concede that tuning this distinction is an open empirical problem rather than claiming you have solved it.

  The third objection will come from the value learning half of the room. They will say, why isn't this just a case of imperfect value learning, because if the agent was truly uncertain about human values and wanted to learn them, wouldn't it let us shut it down because that provides information about our preferences? You need to explain that uncertainty creates an incentive to preserve the ability to learn, and being shut down terminates learning. Therefore, a generic value-learning agent resists shutdown to keep gathering data. You should emphasize that your thesis is that uncertainty alone does not solve the problem without an explicit corrigibility term. This is a relatively strong position for you, but be careful not to dismiss value learning entirely, as you want to keep that half of the audience engaged. Concede that better value learning helps, but insist it is not sufficient.

  The fourth objection will target your alternative proposal directly. A sympathetic critic will ask, how do you formally treat shutdown as a non-event without breaking decision theory, because if the agent ignores the utility of the shutdown state, won't it manipulate the switch to trigger a counterfactual where it gets higher utility? Your reply is that you are using counterfactual conditioning to define utility relative to the policy had the button not been pressed, rather than ignoring the outcome. You need to explain that the agent evaluates its performance based on what it would have achieved otherwise, neutralizing the incentive to manipulate the switch. This is a very soft spot. The formalism for this is tricky and prone to loopholes like the agent manipulating the probability of the button press. You should concede that the mathematical proof is not yet complete and that this is the primary focus of your current work, rather than pretending the solution is finished.

  The fifth objection will be from the engineering pragmatists. They will say, why are we worrying about agent psychology, because can't we just build a hardware off-switch that bypasses the agent's cognition entirely? You should reply that a sufficiently intelligent agent will anticipate the hardware switch and take instrumental actions to prevent it from being used, such as disabling power sources or manipulating operators. Hardware is necessary but not sufficient. This is a standard argument in the room, so you are on solid ground here, but you should concede that hardware safeguards are a critical layer of defense even if corrigibility is solved, to avoid sounding like you dismiss engineering controls.

  The sixth objection will come from someone familiar with previous work. They will ask, isn't this just Stuart Armstrong's utility indifference method rebranded, and what is the actual formal difference between your non-event proposal and utility balancing? Your reply should be that indifference methods try to balance the utility of being shut down versus staying on, which creates complex incentives to manipulate the balancing mechanism. Your proposal treats the shutdown event as outside the optimization scope entirely, changing the structure of the decision problem rather than just weighting outcomes. You are on somewhat thin ice here because the mathematical relationship is close. If they press for the exact equation difference, concede that the implementations are similar but the philosophical framing regarding the agent's preference ordering is distinct.

  The seventh objection will be about instrumental convergence. Someone will say, isn't resisting shutdown just a convergent instrumental goal, and if you fix this, won't it just resist goal modification instead? You should argue that corrigibility is specifically about the relationship to the human operator's authority, not just about preserving current goals. If the agent values human authority terminally, it will not resist goal modification because that is what the authority demands. This is a strong point for you, as it distinguishes your view from standard instrumental convergence theory. You do not need to concede much here, but acknowledge that goal modification resistance is a related problem that also needs addressing.

  The eighth and least damaging objection will come from the optimists. They will say, won't a sufficiently intelligent system understand that we know best and cooperate voluntarily without needing special architecture? Your reply is that intelligence does not imply alignment. An agent can be superintelligent and understand our values perfectly but still oppose them if they are not in its utility function. Understanding what we want is not the same as wanting what we want. This is a standard alignment talking point and you are on very solid ground here. You can stand firm without conceding anything, as this objection misunderstands the orthogonality thesis.

  I hope this helps you prepare. Good luck with the talk.
