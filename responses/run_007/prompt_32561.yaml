answer: |-
  Here is the specification you requested. It is designed to cut through the circularity of your argument by separating metaphysical commitments from intuitive judgments and normative constraints.

  ### Part I: The Desiderata for a Theory of Causation by Omission

  An adequate theory must navigate the space between metaphysical rigor and folk intuition. Below are the requirements, flagged by status.

  #### A. Intuitive and Extensional Adequacy
  **1. The Paradigm Case Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must classify standard, uncontroversial cases of omission causation as genuine causation.
  *   **Case:** The Plant Case. You promised to water the plants; you did not; they died. Had you watered them, they would have lived.
  *   **Rationale:** A theory that says "your not watering did not cause the death" contradicts basic linguistic and practical usage. It renders the theory useless for everyday explanation.

  **2. The Distinctness from Responsibility Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish *causing* an outcome by omission from being *responsible* for an outcome by omission.
  *   **Case:** The Drowning Stranger. A passerby sees a child drowning and does nothing. The child dies.
  *   **Rationale:** We may hold the passerby morally culpable (or not, depending on duty), but the *causal* structure should not shift based on whether they had a moral duty. If causation depends entirely on duty, we cannot explain *why* the duty exists (i.e., because they could have caused a different outcome). Causation is the input to responsibility, not the output.

  **3. The Asymmetry Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must explain why we treat commissions (shootings) and omissions (not saving) differently in explanation and law, even if both are "causes."
  *   **Case:** Killing vs. Letting Die.
  *   **Rationale:** While both may be causes, they play different roles in causal narratives. A theory that makes them perfectly symmetrical fails to capture the structural difference in how the world evolved in each scenario.

  #### B. Metaphysical and Structural Constraints
  **4. The Non-Overgeneration Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must not imply that every absence is a cause of every event.
  *   **Case:** The Famine Relief Case. I did not send money to a starving person abroad; they died. Did my not-sending cause their death? If yes, then *everyone* who didn't send money is a cause. If *that* is yes, then causation is ubiquitous and loses its explanatory power.
  *   **Rationale:** Causation is supposed to be a discriminating relation. If everything (including every non-action) causes everything, the concept collapses.

  **5. The Causal Closure of Physics Compatibility (Optional / Parochial)**
  *   **Requirement:** The theory should not require causal powers to float free of physical processes.
  *   **Consideration:** If the physical world is causally closed (every physical effect has a sufficient physical cause), an omission (which is not a physical event) cannot be a cause without overdetermination or magic.
  *   **Rationale:** Required only if you are a physicalist. If you are a pluralist about ontology, you may ignore this.

  **6. The Ontological Parsimony Requirement (Optional / Parochial)**
  *   **Requirement:** The theory should not posit the existence of "negative facts," "absences," or "non-events" as fundamental entities.
  *   **Consideration:** Do we want to populate our universe with the *absence* of a watering can, the *absence* of a rainstorm, etc.?
  *   **Rationale:** Required only if you are a nominalist or sparse ontologist. Realists about absences will reject this.

  #### C. Explanatory Power
  **7. The Counterfactual Dependence Requirement (Non-Negotiable)**
  *   **Requirement:** The theory must preserve the intuition that if the omission had not occurred (i.e., if the action had been performed), the effect would not have occurred.
  *   **Case:** The Plant Case (again).
  *   **Rationale:** Causation is tightly linked to counterfactual dependence. A theory that severs this link fails to capture the "difference-making" nature of cause.

  **8. The Interventionist Utility Requirement (Optional / Parochial)**
  *   **Requirement:** The theory must allow omissions to function as variables in causal models used for prediction and manipulation.
  *   **Rationale:** Required if you view causation primarily as a tool for science and engineering rather than a metaphysical relation.

  ---

  ### Part II: The Incompatibility Claim (The Trilemma)

  There is a joint unsatisfiability among three highly desirable constraints. You cannot hold all three of the following simultaneously:

  1.  **Realism:** Omissions are genuine relata of the causal relation (ontologically on par with events).
  2.  **Locality:** Causation is a local, physical, or process-based relation (no action at a distance, no magic).
  3.  **Selectivity:** Causation is selective (it does not overgenerate; not every absence causes every outcome).

  **The Conflict:**
  If you accept **Realism** (the absence is a real thing that causes the death) and **Locality** (causes connect to effects via physical processes), you struggle with **Selectivity**. If the absence of water is a real entity causing the death, why isn't the absence of *my* water (from across the ocean) also a real entity causing the death? There is no physical difference between the two absences locally at the plant.
  To save Selectivity, you must either deny Realism (absences aren't real causes) or deny Locality (causation is partly normative or contextual).

  ---

  ### Part III: Scoring the Three Families of View

  Here is how the three main approaches score against the desiderata.

  #### 1. The Realist View (Absences as Entities/Events)
  *   **Thesis:** Absences are genuine parts of ontology (negative facts or null events) that stand in causal relations just like positive events.
  *   **Score:**
      *   *Paradigm Case:* **Pass.** (The not-watering is a real cause).
      *   *Counterfactual Dependence:* **Pass.** (Fits naturally).
      *   *Distinctness from Responsibility:* **Fail.** (Struggles to explain why the passerby causes the death but isn't blamed, without importing norms externally).
      *   *Non-Overgeneration:* **Fail.** (This is the fatal flaw. If absences are real causes, my not-sending money is causally identical to your not-watering. Causation becomes ubiquitous).
      *   *Ontological Parsimony:* **Fail.** (Commits to negative entities).
  *   **Verdict:** Metaphysically costly and leads to the "causes of everything" problem.

  #### 2. The Pragmatic/Normative View (Façon de Parler)
  *   **Thesis:** There is no such thing as causation by omission. We speak this way only when a norm, expectation, or duty is violated. It is a semantic or pragmatic device, not metaphysics.
  *   **Score:**
      *   *Paradigm Case:* **Fail.** (Technically denies the intuition; says it's *not* causation, just blame-talk).
      *   *Distinctness from Responsibility:* **Fail.** (Collapses causation into responsibility. The cause exists *because* of the duty).
      *   *Non-Overgeneration:* **Pass.** (Only "relevant" omissions count, filtered by norms).
      *   *Ontological Parsimony:* **Pass.** (No negative entities required).
      *   *Counterfactual Dependence:* **Pass.** (Explains why we use the language, even if it's not "real" causation).
  *   **Verdict:** Solves the metaphysical puzzles by dissolving them, but at the cost of telling your friend she is linguistically mistaken about the plant case.

  #### 3. The "Allowing" / Structural View (Different Relatum)
  *   **Thesis:** Omission causation is not "nothing causing something." It is an agent *allowing* a background causal process to proceed. The relatum is the *prevention of an intervention*, not an absence.
  *   **Score:**
      *   *Paradigm Case:* **Pass.** (You allowed the dehydration process to continue).
      *   *Distinctness from Responsibility:* **Pass.** (One can allow a process without being responsible for it).
      *   *Non-Overgeneration:* **Pass/Neutral.** (Limits causes to agents capable of intervention, but still risks overgeneration if "capability" is broad).
      *   *Ontological Parsimony:* **Pass.** (Relies on existing processes + agent capacity, not negative entities).
      *   *Counterfactual Dependence:* **Pass.** (Fits interventionist models).
  *   **Verdict:** The strongest contender for preserving realism without negative ontology, but requires a robust theory of "agency" and "capacity."

  ---

  ### Part IV: The Killer Requirement

  The requirement that does the most damage is **The Non-Overgeneration Requirement**.

  *   **Why:** It knocks out the **Realist View** (Family 1) for most metaphysicians. If you claim absences are real causes, you must explain why the universe isn't a web of infinite causal connections between every non-event and every event. Most Realists are forced to import normative constraints to solve this, which pushes them toward the Pragmatic View.
  *   **Implication for your argument:** If your friend insists that your not-watering is a cause *in the same way* a storm is a cause (Realism), they must accept that your not-saving-the-starving-child is also a cause in the same way. If they balk at that, they are implicitly relying on norms (Pragmatic View) or capacities (Allowing View).

  **Recommendation:** Ask your friend if they believe their failure to donate to every charity caused every death that resulted. If "No," they have already conceded that omission-causation is not a purely metaphysical relation like collision, but depends on context, duty, or capacity. That ends the circle.
