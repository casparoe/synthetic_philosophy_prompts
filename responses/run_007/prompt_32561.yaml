prompt: |-
  I just spent two hours arguing with a friend about whether my failure to water her plants while she was away counts as a cause of their dying, and I realized we were going in circles because we never stopped to ask what we were even asking of a theory of causation by omission. So before I go back to that argument, I want the full specification.

  Write the desiderata: what any adequate theory of causation by omission has to deliver. I want the list of requirements — the cases it must get right, the distinctions it must respect or explain (or explain away), the results from metaphysics and moral psychology it can't contradict, the puzzles it must dissolve or at least acknowledge as genuine — with the case or consideration behind each requirement. Flag which requirements are non-negotiable and which are optional or parochial (e.g., requirements that only matter if you're doing moral theory with the results, or only if you're a realist about absences). If any pair of requirements is jointly unsatisfiable, say so — that's the part I most want to see.

  Then, briefly, score the three main families of view against the list: the view that omissions are genuine events (negative facts, absences as entities), the view that omission-talk is just a façon de parler we use when a norm or expectation is violated and doesn't track real causation, and the view that omission causation is ordinary event-causation but with a different relatum (an agent's allowing something to happen, rather than an absence). If one requirement does the most to knock out whole families, call that out.

  I don't need a bibliography. I'll add the references myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Causation by Omission (CBO).
      *   **Task:** Write the *desiderata* (requirements) for an adequate theory of CBO.
      *   **Specifics:** List requirements, cases to get right, distinctions to respect, metaphysical/moral constraints, puzzles to dissolve. Flag non-negotiable vs. optional/parochial. Identify joint unsatisfiability (tensions).
      *   **Second Task:** Score three main families of views against the list (Absences as Entities/Events, Pragmatic/Normative Accounts, Allowing/Prevention Accounts).
      *   **Constraint:** Identify the "killer requirement" if one exists. No bibliography.
      *   **Tone:** Philosophical, precise, analytical, helpful for resolving an argument.

  2.  **Deconstruct Causation by Omission:**
      *   What is the core problem? We say "not watering caused the plants to die." But "not watering" isn't an event in the same way "throwing a rock" is. It's the absence of an action.
      *   Why is it hard? Metaphysics (do absences exist?), Causation (is it a relation between events?), Morality (does causation imply blame?).
      *   Key tensions: Overgeneration (everything causes everything if we count omissions) vs. Undergeneration (failing to count obvious cases like the plants).

  3.  **Drafting the Desiderata (The List):**
      *   *Requirement 1: The Intuitive Verdicts (The Plant Case).* Must capture standard cases where we intuitively say omission caused outcome. (Non-negotiable for folk adequacy).
      *   *Requirement 2: The Problem of Overgeneration (The Famine Case).* If I don't send money to a famine victim, did I cause their death? If yes, causation is everywhere. Theory must limit scope. (Non-negotiable for metaphysical plausibility).
      *   *Requirement 3: Metaphysical Parsimony.* Shouldn't require weird ontology (like "negative facts") unless necessary. (Optional/Parochial depending on metaphysical stance).
      *   *Requirement 4: Moral/Legal Distinction.* Causation $\neq$ Responsibility. Must distinguish causing death by shooting vs. causing death by not saving. (Non-negotiable for moral theory integration).
      *   *Requirement 5: Symmetry/Asymmetry.* Is omission causation symmetric to commission? (Optional/Debated).
      *   *Requirement 6: Counterfactual Dependence.* Must align with counterfactual intuition (if I *had* watered, they wouldn't have died). (Non-negotiable for most causal theories).
      *   *Requirement 7: The "No-Action" Problem.* Can nothing do something? (Metaphysical constraint).

      *Refining the Tensions:* The big tension is between *Intuitive Verdicts* (Plants) and *Overgeneration* (Famine/Starving Artist). If you say omissions are causes, you risk saying everyone causes everything. If you say they aren't, you lose the plant case.

  4.  **Categorizing Requirements:**
      *   *Non-Negotiable:* Intuitive verdicts on paradigm cases, Avoidance of Overgeneration, Distinction from Responsibility.
      *   *Optional/Parochial:* Ontological parsimony (depends on realism), Symmetry with commission.

  5.  **Identifying Joint Unsatisfiability:**
      *   The "Trilemma": (1) Omissions are causes, (2) Causation is a local physical relation, (3) Causation is not ubiquitous. You can't have all three.
      *   Specifically: *Robust Realism* vs. *Non-Overgeneration*. If absences are real entities standing in causal relations, why doesn't *every* absence cause *every* outcome? (The "Causes of Everything" problem).

  6.  **Scoring the Three Families:**
      *   *View 1: Absences as Entities/Events (Realism).* (e.g., Beebee, some readings of Lewis).
          *   Pros: Gets the plant case right easily. Counterfactuals work.
          *   Cons: Fails Overgeneration (everything causes everything). Ontologically costly.
      *   *View 2: Pragmatic/Normative (Quasi-Causation).* (e.g., Hart & Honoré, Moore).
          *   Pros: Solves Overgeneration (only "relevant" omissions count). Distinguishes moral blame.
          *   Cons: Denies real causation (semantics only). Might fail the "Non-Negotiable" intuition that it *is* causation, not just blame.
      *   *View 3: Allowing/Prevention (Process/Interventionist).* (e.g., Woodward, Schaffer).
          *   Pros: Handles counterfactuals well. Distinguishes via causal models.
          *   Cons: Can still struggle with Overgeneration without normative input.

      *The Killer Requirement:* The **Problem of Overgeneration (Ubiquity)**. This is the hardest hurdle. Realist views crash here. Pragmatic views solve it by denying the premise.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Acknowledge the friend's argument. Set the stage.
      *   *Section 1: Desiderata.* Group them logically (Metaphysical, Intuitive, Ethical). Use clear labels (Non-Negotiable vs. Optional).
      *   *Section 2: Tensions.* Explicitly state the incompatibility.
      *   *Section 3: Scoring the Views.* Apply the list.
      *   *Section 4: The Killer.* Identify Overgeneration.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* a requirement is non-negotiable? Yes, usually because it contradicts basic intuition or logic.
      *   *Check:* Did I distinguish between "causation" and "responsibility"? Crucial for CBO.
      *   *Check:* Is the distinction between the three views clear?
          *   View 1: Ontological Realism about absences.
          *   View 2: Pragmatic/Normative (it's not *real* causation).
          *   View 3: Causal Models/Interventionism (it's real but structural).
      *   *Refinement on View 3:* Actually, View 3 is often lumped with View 1 or View 2 depending on interpretation. Let's clarify: View 3 should be "Causal Modeling/Counterfactual Dependence without Negative Ontology" (e.g., Woodward). Or perhaps "Prevention as Primary." Let's stick to the prompt's suggestion: "ordinary event-causation but with a different relatum (an agent's allowing...)." This sounds like a specific metaphysical move (e.g., Dowe's conserved quantity or similar). I will interpret the third view as *Interventionist/Structural* as that's the modern contender, or stick closer to the prompt's phrasing "allowing something to happen." Let's align with the prompt's specific phrasing for the third view: *Allowing/Prevention as a distinct causal relation.*

      *Wait, re-reading the prompt's third view:* "the view that omission causation is ordinary event-causation but with a different relatum (an agent's allowing something to happen, rather than an absence)." This sounds like the "Prevention/Allowing" view (e.g., Dowe or Koons). I need to make sure I score *that* specific view.

      *Re-evaluating the "Killer":* The prompt asks: "If any pair of requirements is jointly unsatisfiable, say so." The tension between *Metaphysical Parsimony* and *Intuitive Verdicts* is classic. But the tension between *Non-Overgeneration* and *Realism about Absences* is the technical killer.

  9.  **Final Polish:** Ensure tone is authoritative but neutral. No bibliography. Clear headings.

      *(Self-Correction on Desiderata)*: Make sure to include the "Distinctness from Responsibility" requirement. That's where the friend's argument likely stalled (conflating blame with cause).

      *(Self-Correction on Tensions)*: The "Causal Completeness of Physics" is a major constraint. If physics is causally closed, where does the omission fit?

      *(Final Plan)*:
