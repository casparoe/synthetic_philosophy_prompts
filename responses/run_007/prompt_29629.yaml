prompt: |-
  I'm on my university's IRB and we're stuck on a weird one. A cognitive psychology lab wants to run a study testing whether people can reliably distinguish genuine from faked emotional expressions in short video clips. Here's the thing: they're screening participants by having them do exactly that task — watch a batch of clips, judge genuine vs. fake — and they'll only enroll participants who score in the top quartile. The researchers call this standard screening to reduce noise and say the main task uses different stimuli so there's no contamination.

  But one of our reviewers filed a sharp dissent arguing the design is epistemically circular in a way that tracks the bootstrapping problem: if the screening task actually measures what it claims to (ability to detect genuine emotion), then the study's main question is already settled in the affirmative — you've just identified a group of people who can do it. And if the screening doesn't measure that ability, then the whole selection procedure is invalid and the results are uninterpretable either way. The reviewer says you can't use a putative measure of X to select subjects and then use those subjects to test whether the measure tracks X — that's bootstrapping, and the different stimuli don't escape the circle because the ability is supposed to be the same ability.

  Half the board thinks this is a genuinely deep objection and we should reject or require a major redesign. The other half thinks it's crankish — "by that logic you could never use any pre-test to screen participants for anything" — and wants to approve as-is. I need to draft the decision memo for the full board: approve, reject, or approve with conditions. It needs to take the circularity objection seriously (not just dismiss it) and give reasons the researchers could actually respond to. Keep it under 500 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** IRB Board Member drafting a decision memo.
      *   **Task:** Draft a memo for the full board regarding a specific study proposal.
      *   **Study:** Cognitive psychology lab testing ability to distinguish genuine vs. faked emotional expressions.
      *   **Methodology:** Screening participants using the same task (judge clips), enrolling only top quartile scorers. Main task uses different stimuli.
      *   **Conflict:** Half the board sees a deep epistemic circularity/bootstrapping problem (reviewer's dissent). Half sees it as standard screening.
      *   **Requirement:** Take the circularity objection seriously (don't dismiss it), provide actionable reasons/conditions for researchers, keep under 500 words.
      *   **Decision:** Approve, Reject, or Approve with Conditions. (Given the prompt's nuance, "Approve with Conditions" is usually the most constructive path for an IRB memo that needs to address methodological concerns without necessarily killing the study if ethically sound, though the objection is epistemic rather than ethical. However, IRBs primarily care about ethics, not science quality *unless* poor science implies unethical use of subjects. The prompt asks me to draft the decision memo *for the board*, implying I need to take a stance. The prompt says "I need to draft the decision memo... approve, reject, or approve with conditions." I should choose the one that best addresses the concern while moving forward. "Approve with Conditions" allows addressing the methodological flaw which risks making the study useless (unethical waste of resources/participant time).)
      *   **Constraint:** Under 500 words.

  2.  **Evaluate the Objection:**
      *   The reviewer's point is about *validity*, not directly about *risk*. However, IRBs are mandated to ensure that risks are minimized and justified by potential benefits. If the study design is fundamentally flawed (epistemically circular), the scientific value is zero, making any risk (even minimal) unjustified. Therefore, the IRB *does* have standing to question this.
      *   The objection: Selecting on the dependent variable (or a proxy of it) biases the sample such that the result is guaranteed or uninterpretable.
      *   Counter-argument: Screening for ability is common (e.g., selecting musicians for a music study). The key is whether the screening *assumes* the truth of the hypothesis.
      *   Resolution: The study isn't testing *if* people can do it (since they selected those who can), but perhaps *how* they do it, or the screening needs to be independent. Actually, the hypothesis is "whether people can reliably distinguish..." If you select only those who can, you confirm "some people can," but you can't generalize to "people" (population). The study claims to test the ability, but pre-selects for it. This biases the prevalence estimate.
      *   Best Path: Approve with Conditions. Require the researchers to clarify the hypothesis (is it existence vs. prevalence?) or remove the selection bias if the goal is generalizability. Or, require them to justify why this isn't circular in the protocol.

  3.  **Drafting - Section by Section:**
      *   **Header:** To, From, Date, Subject.
      *   **Decision:** Approved with Conditions.
      *   **Rationale:** Acknowledge the dissent. Explain that while screening is common, the specific circularity risk threatens scientific validity, which impacts ethical justification (waste of resources/participant time).
      *   **Conditions:** Require a revised analysis plan or hypothesis clarification. They must explain how they avoid confirming their own selection criteria. They need to include a control group (non-screened) or clarify that the claim is limited to "high-performers" not "people generally."
      *   **Tone:** Professional, balanced, decisive.

  4.  **Refining the Argument (Self-Correction):**
      *   Wait, IRBs generally don't judge scientific merit unless it impacts ethics. But "unethical to conduct useless research" is a valid IRB stance. I need to frame the epistemic circularity as an *ethical* issue (respect for persons, beneficence). If the data is uninterpretable, participants' time is wasted.
      *   The prompt asks me to take the objection seriously. I shouldn't just say "fix the science." I should say "fix the science because bad science is unethical here."
      *   The condition should be: Justify the selection criteria relative to the specific hypothesis. If the hypothesis is "Can humans distinguish...", selecting top performers begs the question. If the hypothesis is "Do top performers use different cues...", that's different.
      *   Let's aim for "Approved with Conditions" requiring a modification to the design or analysis to address the generalizability issue.

  5.  **Drafting - Word Count Check:**
      *   Need to be concise.
      *   Focus on the intersection of validity and ethics.

  6.  **Final Polish:**
      *   Ensure the circularity objection is explicitly mentioned and addressed.
      *   Ensure the conditions are actionable.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm doing the science for them, but setting the bar for ethical approval. The key is that if the design is circular, the study yields no knowledge, violating the principle of beneficence (maximizing benefit).

  *Draft Plan:*
  1. Decision: Approved with Conditions.
  2. Acknowledge the dissent regarding epistemic circularity.
  3. Frame validity as an ethical requirement (waste of resources).
  4. Stipulate conditions: Clarify hypothesis (existence vs. prevalence) OR add a random control group.
  5. Require explicit acknowledgment of limitations regarding generalizability.

  *Let's write.*

  **MEMORANDUM**

  **TO:** Full IRB Board
  **FROM:** [My Name/Chair]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo – Protocol #2023-COG-45 (Emotional Expression Discrimination)

  **DECISION:** Approved with Conditions

  **RATIONALE:**
  The Board is divided regarding the methodological validity of the participant screening procedure. While the IRB typically defers to researchers on scientific design, we are ethically mandated to ensure that risks to participants are justified by potential scientific value. If the study design is epistemically circular, the resulting data may be uninterpretable, rendering participant involvement an unjustified use of time and resources. Therefore, the dissenting view regarding bootstrapping must be addressed to satisfy ethical standards of beneficence.

  The concern is that selecting participants based on performance on the target task (even with different stimuli) pre-determines the outcome if the research question is whether "people" possess this ability. This selection bias threatens external validity and risks confirming the hypothesis by definition rather than observation.

  **CONDITIONS FOR APPROVAL:**
  To proceed, the Principal Investigator must submit a modified protocol addressing the following:

  1.  **Hypothesis Clarification:** The researchers must explicitly state whether the primary hypothesis concerns the *existence* of the ability in a specific subgroup or the *prevalence* of the ability in the general population. If the latter, the current screening design is invalid. The study must either remove the performance-based enrollment criterion or include a non-screened control cohort to establish a baseline prevalence rate.
  2.  **Validity Justification:** If screening is retained, the protocol must include a justification explaining why using a proxy measure of the dependent variable to select subjects does not constitute circular reasoning in this specific context. This should reference methodological literature supporting this screening approach for this specific construct.
  3.  **Consent Language:** The consent form must be updated to inform participants that enrollment is contingent upon performance on a preliminary task, ensuring transparency regarding the selection process.

  **NEXT STEPS:**
  These modifications should be submitted as a amendment within 14 days. Upon verification that the design no longer risks rendering the study scientifically useless (and thus ethically questionable), the protocol will receive full approval.

  This approach respects the dissenting reviewer's epistemic concern while allowing the study to proceed if the researchers can demonstrate that their design yields interpretable, generalizable knowledge worthy of participant contribution.

  **[End of Memo]**

  *Word Count Check:* ~230 words. Well under the 500 limit. I can expand slightly to ensure the nuance of the circularity is fully respected. I want to make sure I don't sound like I'm rejecting the science outright but demanding ethical justification for the design.

  *Revised Plan:* Expand on why the circularity matters ethically. Ensure the tone is balanced.

  *Final Polish:*
  The draft looks good. It addresses the prompt's requirement to take the objection seriously (by linking validity to ethics) and provides actionable conditions. I will finalize this version.cw
