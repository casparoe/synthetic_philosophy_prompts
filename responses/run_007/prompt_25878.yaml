answer: |-
  It's no wonder you went quiet; you were caught between a semantic argument (Callum) and a pragmatic one (Jess). They were effectively speaking different languages. Callum was talking about *truth conditions* (is the sentence factually accurate?), while Jess was talking about *communicative intent* (what belief is this designed to create?).

  Here is a breakdown of their exchange, move by move, assessing who is right about what, followed by a sensible middle position you can offer them.

  ### The Scorecard: Move by Move

  **1. Callum's Opening Defence**
  *   *Claim:* "Every sentence I uttered was true... the client was free to ask follow-ups."
  *   *Verdict:* **Callum is right on semantics, wrong on ethics.**
      Technically, he is correct. If the product was recalled twice, stating that is not a falsehood. However, his reliance on the client to "ask follow-ups" ignores the reality of power dynamics and information asymmetry. In sales, the seller holds the data. Expecting the buyer to know *which* questions to ask to uncover hidden context is unreasonable. It's like selling a car with a patched-up frame and saying, "I never said it hadn't been in an accident; you were free to ask."

  **2. Jess's Counter**
  *   *Claim:* "He's using the literal truth as a shield while doing all the same work a lie would do."
  *   *Verdict:* **Jess is right.**
      This is the strongest moral point in the exchange. In philosophy, this is often called **paltering**: the active use of truthful statements to convey a false impression. If the *intent* is to make the listener believe $X$, and the speaker knows $X$ is false, but says $Y$ (which is true) to make the listener believe $X$, the moral culpability is nearly identical to lying. The outcome (a deceived client) and the intent (deceive the client) are the same.

  **3. Callum's Generalisation**
  *   *Claim:* "All of social life would be immoral... we all manage what we reveal."
  *   *Verdict:* **Callum is partially right, but applies it too broadly.**
      He is correct that we constantly omit information. If a mate asks, "How's the new job?" you might say, "It's going well," omitting that you hate your boss. This is socially necessary lubrication. However, he is wrong to equate *social politeness* with *commercial transaction*. In a business deal involving safety recalls, the expectation of full disclosure is much higher than in casual chat. He is trying to use a rule for social niceties to justify professional deception.

  **4. Jess's Biscuit Analogy**
  *   *Claim:* "If I ask you whether you ate the last biscuit and you say 'I've been in the other room'... you haven't lied?"
  *   *Verdict:* **Jess is right.**
      This successfully breaks Callum's "literal truth" rule. In a context where there is a direct question and a high expectation of relevance, a technically true but misleading answer is universally understood as a lie. If Callum admits this is wrong, he admits that literal truth isn't the only metric.

  **5. Callum's Distinction**
  *   *Claim:* "The biscuit case involves a direct question... whereas his client was an adult doing business."
  *   *Verdict:* **Jess is right that he moved the goalposts.**
      Callum started by saying the rule was "nothing I said was false." Now he is arguing that the rule depends on *context* (direct question vs. business negotiation). Jess is correct: if context matters, then his original hard line ("literal truth is a clear rule") has collapsed. However, Callum is *also* right that contexts differ; the biscuit scenario implies a higher duty of candour between friends than *caveat emptor* between businesses. But in modern consumer law and ethics, the gap isn't as wide as he thinks.

  **6. Jess's Goalpost Accusation**
  *   *Claim:* "So the rule wasn't actually doing the work he claimed."
  *   *Verdict:* **Jess wins this logical point.**
      You cannot claim to have a simple, objective rule ("don't say false things") and then defend it using complex subjective judgements ("well, it depends on the context"). If you need context to decide if it's moral, then "literal truth" wasn't the rule; "meeting reasonable expectations" was.

  ### The Sensible Middle Position

  Neither of them quite articulated the actual standard most ethicists and professionals use. The middle ground isn't about *truth*; it's about **intent to deceive** and **reasonable inference**.

  Here is the position you can put to them:

  **1. The "Gricean" Standard**
  There is a concept in linguistics called the *Cooperative Principle*. When we communicate, we implicitly agree to follow certain maxims. One is the **Maxim of Quantity**: make your contribution as informative as is required for the current purposes of the exchange.
  *   **Callum's error:** He violated the Maxim of Quantity. He gave enough information to trigger a negative inference, but withheld the information required to make that inference accurate.
  *   **The Middle Ground:** It is not immoral to omit details (e.g., you don't have to list every minor flaw). It *is* immoral to volunteer a detail specifically because you know it will be misinterpreted, and then stay silent to preserve that misunderstanding.

  **2. The "Reasonable Person" Test**
  Instead of asking "Did I lie?", ask: "Would a reasonable person in the listener's position draw a false conclusion from this, and did I know that?"
  *   If Callum said, "They were recalled twice," knowing that 99% of people equate "recall" with "danger," and he stayed silent knowing his own product was worse, he intentionally manipulated the client's belief.
  *   **The Nuance:** If the client had asked, "Were those recalls safety-related?" and Callum said "No," he would be in the clear. But by leading with the recall count without the context, he weaponised the ambiguity.

  **3. Professional Fiduciary Duty**
  Jess is right that business isn't the Wild West. In the UK, under the Consumer Protection from Unfair Trading Regulations, misleading actions or omissions that cause the average consumer to take a transactional decision they wouldn't have otherwise taken are prohibited.
  *   Callum's defence ("they should be sceptical") holds up in a car boot sale, but not in professional B2B sales. Professionals are expected to know the market. If Callum knows the competitor's recall was trivial, withholding that is an unfair trading practice, regardless of technical truth.

  ### How to Frame It to Them

  If you want to break the deadlock next time you're at the pub, try saying this:

  > "Look, Callum, you're right that 'lying' technically means saying something false. But Jess is right that morality isn't just about semantics; it's about the belief you're trying to create.
  >
  > The rule isn't 'don't say false things.' The rule is 'don't intentionally create a false belief.' If you hand someone a loaded gun, tell them it's 'a bit heavy,' and they think it's unloaded, you haven't lied about the weight, but you've deceived them about the safety.
  >
  > You moved the goalposts when you brought up the biscuit. You admitted context matters. And in a sales context, where you know more than the client, using technical truth to hide material facts isn't clever; it's just dishonesty with extra steps."

  **Summary:**
  *   **Callum** is right that we can't disclose everything, but wrong that literal truth absolves him of intent.
  *   **Jess** is right that the outcome defines the lie, but perhaps a bit too rigid on the idea that *all* omission is immoral.
  *   **The Verdict:** Callum was unethical. He didn't lie, but he deceived. In most professional codes of conduct, that's treated the same way.
