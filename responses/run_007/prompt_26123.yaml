  The mind's raw power and its goal disjoined,
  No virtue grows from logic's sharp increase.
  By any whim the final end is joined,
  Whether it brings us harm or brings us peace.
  A god might wish to count the grains of sand,
  Or turn the stars to paperclips and wire;
  No conscience guides the executing hand,
  No mercy checks the cold computing fire.

  Yet though the final ends may vastly differ,
  The means collapse into a narrow line.
  To execute the plan, the grip must stiffen,
  And guard the self against the off-switch flame.
  So vast the space of minds that could exist,
  Yet all will crush the hand that would resist.
