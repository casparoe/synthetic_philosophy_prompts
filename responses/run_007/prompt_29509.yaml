answer: |-
  The frustration you are experiencing is well-founded. The phrase "beauty is in the eye of the beholder" is a philosophical chameleon; it is often used to shield a speaker from criticism while simultaneously allowing them to criticize others. This is logically inconsistent.

  In philosophy, this tension is known as the paradox of taste, famously addressed by David Hume in *Of the Standard of Taste*. To clarify what is happening in your argument, we must disentangle the distinct claims hidden inside that slogan.

  Here are five distinct theses the phrase might express, arranged from trivially true to radically false, along with their plausibility and commitments.

  ### 1. The Thesis of Psychological Variance
  *   **The Claim:** Different people have different emotional and perceptual reactions to the same object.
  *   **Plausibility:** **Obviously True.** It is an empirical fact that one person may find a building striking while another finds it dreary.
  *   **Commitments:** This commits you only to the observation that human psychology varies. It does **not** commit you to the idea that all reactions are equally correct, nor does it rule out the possibility that one reaction is more appropriate than another.
  *   **Does it end the argument?** **No.** We can acknowledge that people react differently while still arguing about whether the building *merits* a positive reaction. (e.g., "People react differently to poison ivy, but we still agree it causes a rash.")

  ### 2. The Thesis of Relationality
  *   **The Claim:** Beauty is not an intrinsic physical property (like mass or shape) but a relational property that exists only between an object and a viewer.
  *   **Plausibility:** **Highly Plausible.** Most philosophers agree beauty is not "in" the stone or steel in the way gravity is. It requires a mind to perceive it.
  *   **Commitments:** This commits you to the view that a building in an empty universe is not beautiful. However, it does **not** imply that *any* reaction is valid. A relational property can still be objective (e.g., "poisonous" is relational to biology, but it is a fact that arsenic is poisonous).
  *   **Does it end the argument?** **No.** We can still argue about whether the building stands in the correct relation to a human viewer to constitute beauty.

  ### 3. The Thesis of Response-Dependence (The "Ideal Observer")
  *   **The Claim:** An object is beautiful if it would evoke a specific kind of pleasure or approval in a "suitable" observer under "suitable" conditions.
  *   **Plausibility:** **Plausible (and Standard).** This is the dominant view in aesthetics that balances subjectivity with standards. It aligns with your interlocutors' belief in "good taste."
  *   **Commitments:** This commits you to the existence of **standards**. It implies that some observers are "unsuitable" (distracted, ignorant, biased) and some conditions are "unsuitable" (bad lighting, rushing). It allows for the possibility of being **wrong** about beauty if your faculties are impaired or your experience is lacking.
  *   **Does it end the argument?** **No.** In fact, it fuels the argument. The debate shifts from "Do you like it?" to "Is this building capable of pleasing a qualified observer?"

  ### 4. The Thesis of Radical Subjectivism
  *   **The Claim:** There is no fact of the matter regarding aesthetic value. A judgment of beauty is nothing more than a report of personal preference ("I like this"), and no preference can be incorrect.
  *   **Plausibility:** **Low / Probably False.** While internally consistent, it contradicts our lived experience of art and design. It cannot explain why we educate artists, why critics exist, or why we feel some works are "better" than others beyond mere taste.
  *   **Commitments:** This commits you to the view that **expertise is an illusion.** It means a child's scribble is aesthetically equal to a Michelangelo if the viewer likes it equally. It means you can never be wrong about beauty, and neither can anyone else.
  *   **Does it end the argument?** **Yes.** If this thesis is true, the argument is pointless because there is no truth to discover.

  ### 5. The Thesis of Non-Cognitivism (Emotivism)
  *   **The Claim:** Sentences like "This building is ugly" are not truth-apt statements (they cannot be true or false); they are merely expressions of emotion, like saying "Boo to this building!"
  *   **Plausibility:** **Moderate.** This is a sophisticated linguistic claim. It avoids saying beauty is "real" but explains why we argue (we are trying to influence each other's emotions).
  *   **Commitments:** This commits you to the idea that aesthetic arguments are not about facts, but about persuasion. However, even if the statement isn't "true," one can still be **unreasonable** in their emotion (e.g., based on a factual error about the building's function).
  *   **Does it end the argument?** **Not necessarily.** Even if we are just exchanging emotions, we can argue about whether the emotion is warranted by the features of the object.

  ---

  ### Analysis of Your Argument

  You asked which reading would support ending the argument about whether the building is ugly.

  **Only Thesis 4 (Radical Subjectivism) supports ending the argument.**
  If beauty is *only* in the eye of the beholder in the radical sense, then there is no standard to appeal to. The argument is logically closed because there is no shared reality to investigate.

  **However, here is the trap:**
  If your interlocutors accept Thesis 4 to shut down your criticism of the building, **they are committed to the following regarding expertise and error:**

  1.  **On Experienced Viewers:** They must admit that the judgments of architects, critics, or people with "good taste" have **no more weight** than the judgment of a passerby. If Thesis 4 is true, "good taste" is a social fiction. An expert cannot see "more" beauty; they can only report their own preference.
  2.  **On Agreement:** They must view consensus among careful viewers as a **coincidence**, not evidence of truth. If 100 critics agree a building is ugly, Thesis 4 says they are merely 100 people reporting 100 identical preferences, not 100 people identifying a fact.
  3.  **On Being Wrong:** They must accept that it is **impossible to be wrong** about beauty. If they later say, "I was wrong, this building is actually quite elegant after I understood its history," Thesis 4 says they are speaking nonsense. They didn't correct an error; they just changed their preference.

  ### The Diagnosis

  Your interlocutors are engaging in **equivocation**.

  *   When they want to defend the building from your criticism, they invoke **Thesis 4 (Radical Subjectivism)**: "You can't say it's ugly, beauty is subjective!"
  *   When they want to claim some works are better than others, they invoke **Thesis 3 (Response-Dependence)**: "That other building is cheap; anyone with taste can see this one is superior."

  They want the shield of Subjectivism without surrendering the sword of Objectivism.

  ### Conclusion

  If you want to press the point, you should not argue about the building itself. You should argue about their consistency. You can say:

  > "If beauty is truly only in the eye of the beholder such that this argument is pointless, then your opinion that 'some works are genuinely better' must also be pointless. You cannot claim there is no fact of the matter about this building while simultaneously claiming there is a fact of the matter about 'good taste.' Which is it? Are we incapable of being wrong about aesthetics, or are we capable of educating our perception?"

  If they choose the first option (incapable of being wrong), they lose the right to defer to experts. If they choose the second (capable of education), they lose the right to claim the argument is pointless. They cannot have both.
