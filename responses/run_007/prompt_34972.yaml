answer: |-
  You have identified a robust and philosophically significant structural pattern. While there is no single, universally standardized term that functions as a proper noun for this specific cross-domain phenomenon (like "the Turing Test" or "the Veil of Ignorance"), it is widely recognized under a few overlapping banners.

  The most precise technical label for the general pattern is **Ideal Advisor Theory** (or the **Idealized Agent Model**). In meta-ethics and value theory, this is often categorized under **Response-Dependence** or **Judgment-Dependence**. In the context of AI and decision theory, it is frequently called **Indirect Normativity**.

  However, simply applying a label does not answer your deeper question: is the similarity deep or shallow? The consensus among philosophers who work across these boundaries is that the similarity is **structurally deep but metaphysically fragile.**

  Here is an analysis of the unity of this phenomenon, its boundaries, and where the classification is most vulnerable.

  ### 1. The Unified Phenomenon: Procedural Response-Dependence

  The deep connection between your four examples is that they all reject **Direct Realism** in favor of **Procedural Response-Dependence**.

  *   **Direct Realism:** There is a fact of the matter (moral, epistemic, or prudential) independent of our judgment, and our goal is to align our current judgment with that fact.
  *   **Procedural Response-Dependence:** The "fact of the matter" is *defined* (or accessed) by the output of a specific deliberative procedure under specific conditions.

  In all four cases you listed, the normativity (what you *ought* to believe/do) is cashed out in terms of a **counterfactual subjective state**. The structure is:
  $$X \text{ is right/true} \iff \text{Agent } S \text{ would judge } X \text{ under Conditions } C.$$

  This unifies the cases under the umbrella of **Idealization Strategies**. The "thing" you are noticing is the shift from asking "What is true?" to asking "What would I endorse if I were better?"

  **Key Philosophical Anchors:**
  *   **Ethics:** Michael Smith's *The Moral Problem* (what we would desire if fully rational); Roderick Firth's *Ideal Observer Theory*.
  *   **Practical Reason:** Harry Frankfurt's *Second-Order Volitions* (identifying with the desires you want to have); Christine Korsgaard's *Procedural Realism*.
  *   **Epistemology:** The "Ideal Rational Agent" in Bayesian epistemology (what credence would maximize accuracy given the evidence).
  *   **AI:** Paul Christiano's *Iterated Distillation and Amplification* or Eliezer Yudkowsky's *Coherent Extrapolated Volition (CEV)*.

  ### 2. Deep Similarity vs. Shallow Resemblance

  The similarity is **deep** in terms of *functional role*. In all four domains, the move serves to solve the problem of **current cognitive limitation** without abandoning **subjective authority**. It allows the agent to maintain that the answer comes from "within" (their own values/reason) while acknowledging that their current "within" is corrupted by fatigue, bias, or ignorance.

  However, the similarity is **shallow** (and potentially misleading) regarding **epistemic access** and **metaphysical status**.

  #### A. The Access Problem (Epistemic Gap)
  *   **In Everyday Reasoning (Case 2):** You have empirical evidence about your future self. You know that sleep improves your mood and cognitive function. Deferring to "sleepy me" is a heuristic based on past data.
  *   **In Moral Philosophy (Case 1):** You have no empirical access to the "fully informed spectator." This is a conceptual tool, not a prediction. You cannot ask them; you must simulate them.
  *   **In AI (Case 4):** This is a computational challenge. The system must *calculate* the extrapolation.

  **The Divide:** In Case 2, the idealized self is a **prediction**. In Cases 1, 3, and 4, the idealized self is a **construction**. If you treat the moral philosopher's "ideal observer" as a prediction (like the tired worker), you commit a category error.

  #### B. The Definition of "Better" (Teleology)
  *   **Epistemology (Case 3):** "Better" is defined teleologically: a better believer is one who believes more truths. The idealization is defined by the goal.
  *   **Ethics (Case 1):** "Better" is often defined procedurally (impartial, consistent). But if you ask *why* impartiality is better, you often need a prior moral truth.
  *   **Vulnerability:** If "better conditions" are defined as "conditions that lead to the truth," the idealization is redundant (you might as well just seek the truth). If "better conditions" are defined independently (e.g., "more calm"), there is no guarantee they lead to the truth.

  ### 3. Where the Classification is Most Vulnerable

  The most principled way to carve these cases apart—and the point where your unified analysis is most vulnerable—is the distinction between **Constitutive Idealization** and **Heuristic Idealization**.

  #### The Distinction
  1.  **Constitutive (Metaphysical):** The judgment of the idealized self *makes* the proposition true. There is no independent fact of the matter. (Common in Constructivist Ethics and some AI alignment views).
      *   *Example:* "X is good *because* my ideal self would choose it."
  2.  **Heuristic (Epistemic):** The judgment of the idealized self is the best *evidence* for an independent truth. (Common in Everyday Reasoning and Scientific Realism).
      *   *Example:* "X is true. My ideal self is more likely to see X is true, so I will defer to them."

  #### The Vulnerability
  Your unified pattern breaks down if it turns out that **Case 2 (Everyday Reasoning)** is Heuristic, while **Case 1 (Ethics)** is Constitutive.

  *   **Why this shifts the analysis:** If I defer to my rested self because they are smarter (Heuristic), I am treating them as an expert. If I defer to the Ideal Observer because their approval *constitutes* morality (Constitutive), I am treating them as a creator of value.
  *   **The Critical Consideration:** The **Alienation Objection** (famously raised by Bernard Williams).
      *   If the idealization is merely heuristic, I can reject the idealized self's conclusion if I have independent reason to think they are wrong.
      *   If the idealization is constitutive, I *cannot* reject it without abandoning the normative framework.
      *   **The Shift:** If you discover that the "idealized self" in a specific domain would endorse values the current self finds abhorrent (e.g., the fully informed spectator approves of slavery), the Heuristic user says "Then the idealization is flawed." The Constitutive user says "Then slavery is good."

  If your pattern holds as a *unified phenomenon*, it must be able to explain why we feel bound by the idealized self's judgment even when it alienates us from our current desires. If the justification varies (sometimes bound, sometimes not), the unity is superficial.

  ### 4. Alternative Boundary Drawing

  If the central cases differ in the important respect identified above, the most plausible alternative classification is not by domain (Ethics vs. AI vs. Epistemology), but by **Direction of Fit**.

  1.  **Mind-to-World Deference (Epistemic/Heuristic):**
      *   *Domains:* Everyday reasoning, Science, some Epistemology.
      *   *Logic:* "My future self will see the world more clearly."
      *   *Boundary:* The idealized agent is a **tool** for tracking independent truth.
  2.  **World-to-Mind Deference (Constitutive/Constructivist):**
      *   *Domains:* Constructivist Ethics, AI Indirect Normativity (sometimes).
      *   *Logic:* "The world of value is shaped by what my mind would settle on."
      *   *Boundary:* The idealized agent is the **source** of normativity.

  **What would shift the analysis?**
  The consideration most likely to shift the analysis is the **possibility of error**.
  *   Ask: *Can the idealized self be wrong?*
  *   If **Yes**: You are in the Mind-to-World cluster (Heuristic). The unity with Constitutive ethics is shallow.
  *   If **No**: You are in the World-to-Mind cluster (Constitutive). The unity with Everyday Reasoning (where you can wake up and still feel you were wrong despite being rested) is shallow.

  ### Summary

  You have correctly identified a **structural isomorphism** known variously as **Ideal Advisor Theory**, **Response-Dependence**, or **Indirect Normativity**.

  *   **Is it a unified phenomenon?** Yes, functionally. It is a strategy for managing normative uncertainty by projecting authority onto a counterfactual version of the agent.
  *   **Is the similarity deep?** Yes, in that it reveals a shared human (and artificial) reluctance to ground normativity in the "here and now," preferring instead to ground it in a "there and then."
  *   **Where is it vulnerable?** The classification collapses if the **metaphysical status** of the idealized judgment differs. If in some domains the ideal self *tracks* truth and in others it *creates* truth, the pattern is merely a shared cognitive heuristic rather than a unified philosophical principle. The "Alienation Objection" is the stress test that reveals this crack.
