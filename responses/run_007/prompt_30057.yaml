prompt: |-
  Last night a friend ended an argument by saying "there's no accounting for taste." The argument was about whether you can be justified in believing a film is good because someone whose judgment you trust told you so, without having seen it yourself — which I now realize is basically the aesthetic testimony question. I want to go back at him with more than a vibe, but the sentence could be doing a bunch of different jobs. Lay out the distinct precise claims that proverb could be making, from trivially true observations about disagreement to substantive claims about whether aesthetic judgments are truth-apt or whether first-hand experience is required for aesthetic knowledge. For each, say whether it's a platitude, a defensible substantive claim, or just false. Then say which reading(s) would actually support him shutting down the testimony question, and which ones wouldn't.
