answer: |-
  Your friend deployed a philosophical nuclear option disguised as a casual cliché. *De gustibus non est disputandum* ("there is no accounting for taste") is one of those phrases that sounds like a conversation-ender but actually conceals a dense cluster of conflicting meta-aesthetic theories.

  To counter this effectively, you need to separate the **psychological observation** (people differ) from the **epistemic claim** (you can't know via testimony) and the **metaphysical claim** (there is no fact of the matter).

  Here are five distinct precise claims the proverb could be making, evaluated by their philosophical strength and their ability to support your friend's position.

  ### 1. The Psychological Platitude
  *   **The Claim:** Human beings have divergent subjective responses to the same stimuli due to complex, opaque causal histories (upbringing, biology, mood). Therefore, we cannot fully *explain* why Person A likes X and Person B dislikes X.
  *   **Evaluation:** **Platitude.** This is trivially true. We know preferences vary and the causal chain is often murky.
  *   **Does it support your friend?** **No.** This explains *disagreement*, but it does not rule out *testimony*. If our psychological makeups are similar enough, your trust in my judgment is a reliable heuristic for what you will like. This reading admits that I might like the film *because* you told me to, even if we can't trace the causal psychology. It doesn't justify shutting down the argument; it just explains why we might differ.

  ### 2. The Pragmatic Truce
  *   **The Claim:** Aesthetic arguments are socially costly and rarely result in convergence. Therefore, normative rules of conversation dictate that we should stop arguing about taste to preserve friendship or peace.
  *   **Evaluation:** **Defensible Substantive Claim.** This is a claim about conversational ethics, not truth. It is defensible as a pragmatic rule of thumb.
  *   **Does it support your friend?** **Yes, but only conversationally.** This supports your friend's right to *end the conversation*, but it does not support his claim that your position (believing via testimony) is unjustified. It admits you might be right philosophically, but asserts that continuing the debate is annoying. This is a "let's agree to disagree" move, not a "you are wrong" move.

  ### 3. The Non-Cognitivist Claim
  *   **The Claim:** Aesthetic judgments (e.g., "This film is good") are not truth-apt propositions. They are merely expressions of emotion (like saying "Yay film!"). Therefore, they cannot be believed, known, or transmitted via testimony.
  *   **Evaluation:** **Substantive Claim (Highly Controversial).** This is a meta-ethical stance (expressivism/emotivism applied to aesthetics). Many philosophers reject this because we reason about art using logic and evidence, which suggests there *are* truth conditions.
  *   **Does it support your friend?** **Yes, decisively.** If "The film is good" isn't a fact that can be true or false, then you literally *cannot* be justified in believing it via testimony, because there is no "it" to believe. However, this is a heavy philosophical burden to carry. If he's not prepared to defend non-cognitivism, he's borrowing capital he doesn't have.

  ### 4. The Acquaintance Principle (The Epistemic Claim)
  *   **The Claim:** Aesthetic knowledge requires first-hand experience. One cannot form a justified aesthetic judgment solely on the basis of testimony, even from a trusted source. To judge the value, you must perceive the object.
  *   **Evaluation:** **Defensible Substantive Claim (The "Pessimist" View).** This is the core of the contemporary "aesthetic testimony" debate. "Pessimists" argue that aesthetic value is response-dependent and requires your own emotional/cognitive engagement. "Optimists" argue that if you trust the critic, you can know the film is good without seeing it.
  *   **Does it support your friend?** **Yes, directly.** This is the only reading that addresses your specific argument about justification. If the Acquaintance Principle holds, your friend is right: you cannot be justified in believing the film is good without seeing it. However, this is not a settled fact; it is the exact point you were debating. Citing the proverb doesn't prove the Acquaintance Principle; it just asserts it.

  ### 5. The Reason-Skeptic Claim
  *   **The Claim:** There are no objective reasons that support aesthetic judgments. Preferences are brute facts with no rational grounding.
  *   **Evaluation:** **False (or Philosophically Vulnerable).** We give reasons for aesthetic judgments constantly ("The pacing was slow," "The lighting was evocative"). If reasons exist, they can be communicated. If they can be communicated, testimony is possible.
  *   **Does it support your friend?** **Yes, but it's easily refuted.** If there are no reasons, then testimony is impossible (since testimony transmits reasons/evidence). But if you can point to *any* reason why the film is good, you falsify this claim.

  ---

  ### How to Go Back At Him

  Your friend used the proverb to conflate **Reading 1** (which is true but irrelevant) with **Reading 4** (which is relevant but unproven). He wants the undeniable truth of "people like different things" to smuggle in the controversial claim that "you can't know via testimony."

  **The Counter-Move:**
  Point out that the proverb is ambiguous between a **causal explanation** and an **epistemic rule**.

  You can say something like:
  > "When you say 'there's no accounting for taste,' you could mean two things.
  >
  > 1.  **Descriptive:** We just happen to like different things. (True, but irrelevant. If I trust your taste, I can still bet on what I'll like).
  > 2.  **Epistemic:** It's impossible to know a film is good without seeing it. (This is the 'Acquaintance Principle').
  >
  > If you mean #1, you haven't answered my point about testimony. If you mean #2, you're making a substantive philosophical claim that isn't self-evident. You can't use the platitude of #1 to prove the epistemic rule of #2. Are you arguing that aesthetic judgments aren't truth-apt, or just that you don't want to talk about it?"

  **Summary of Leverage:**
  *   **Readings 1 & 2** let him end the *conversation*, but concede the *philosophical point*.
  *   **Readings 3, 4, & 5** support his *philosophical point*, but require him to defend controversial theories he likely hasn't thought through.

  If he insists the proverb is obviously true, press him on **Reading 4**. Ask him: *"If I trust you completely, and you tell me the acting is superb, why am I irrational for believing the acting is superb before I see it?"* If he says "Because you haven't seen it," he is defending the Acquaintance Principle, not stating a tautology. And that is a debate worth having.
