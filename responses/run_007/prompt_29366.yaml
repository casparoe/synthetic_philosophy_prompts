      *Constraint Check:* Empty spaces. Is there a "No object in illusion" + "Different Kind" + "Veridical is internal copy"? That's weird. That would be a Disjunctive Intentionalism? Actually, that's standard Disjunctivism.
      What about "Object in illusion" + "Different Kind"? That would be: Hallucination creates sense-data, Veridical perception is direct contact with world. This is rarely defended (Why posit sense-data for hallucination if veridical doesn't need them? Occam's razor). I should flag this.

  6.  **Structuring the Handout:**
      *   **Introduction:** Instructions (Answer intuitively).
      *   **The Quiz:** 8 Questions, 3 options each (A, B, C).
      *   **The Logic (For the Tutor/Key):** The decision tree.
      *   **The Outcomes:** Mapping answers to theories.
      *   **The "Empty Seats":** Logical possibilities no one takes.
      *   **The "Blind Spots":** Where the quiz can't distinguish (NR vs MD).

