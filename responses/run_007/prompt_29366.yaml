      *Drafting Q5 (Hallucination vs. Perception - Common Kind):*
      *   Option A: The mental state is the same, the cause is different.
      *   Option B: The mental state is different because one involves the world and the other doesn't.

      *Drafting Q6 (Veridical Perception - Constitution):*
      *   Option A: The world itself is part of your experience.
      *   Option B: Your experience is an internal copy of the world.
      *   Option C: Your experience tells you about the world.

      *Drafting Q7 (Indistinguishability):*
      *   Option A: If they feel the same, they are the same kind of mental thing.
      *   Option B: They can feel the same but be different kinds of mental things.

      *Drafting Q8 (Knowledge/ED):*
      *   Option A: In the real case, you can know there's a hand. In the fake case, you can't.
      *   Option B: Your evidence is the same in both, so you can't know for sure in either.

      *Refining for "No Jargon":*
      Need to ensure "mental state," "visual field," "representation" are avoided or phrased naturally.
      Instead of "mental state," use "what is going on in your mind."
      Instead of "representation," use "story your brain tells you." (Too colloquial?) $\rightarrow$ "Your mind is telling you X is there."

  5.  **Mapping Answers to Theories:**

      *   **SDT:** Says "Yes" to objects in illusion (Q1, Q2, Q4). Says "Same Kind" for Hallucination/Perception (Q5).
