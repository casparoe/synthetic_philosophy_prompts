answer: |-
  # Handout: The Perception Sorting Quiz
  **Module:** Philosophy of Perception (Year 2)  
  **Topic:** The Argument from Illusion & Disjunctivism

  ## Instructions
  This is not a test of what you remember from the readings. It is a diagnostic of your pre-theoretical intuitions. For each scenario, choose the option that sounds most like what you would actually say if you were pressed to explain what is happening. Do not worry about technical terms; answer based on what seems true to you about the case.

  ---

  ## The Quiz

  **1. The Bent Stick**
  You dip a straight stick into water. It looks bent. You know it is straight. When you look at the bent appearance, is there *anything* in your experience that literally has a bend in it?
  *   **A.** Yes. There is a visual item (an image or appearance) that is actually bent.
  *   **B.** No. Nothing is bent. Your mind is simply presenting the straight stick in a distorted way.
  *   **C.** No. There is no "thing" that is bent. You are just sensing in a "bent-ish" manner.

  **2. The Afterimage**
  You stare at a bright light, then close your eyes. You see a colored patch floating in the dark. Where is that patch?
  *   **A.** It is a real object of awareness, located in your visual field (in your mind).
  *   **B.** It isn't an object. It is your visual system misfiring, creating the impression of a patch.
  *   **C.** It isn't an object. You are simply undergoing a specific type of visual sensation.

  **3. Double Vision**
  You press your finger against your eyeball and see two fingers. How many fingers are you visually aware of?
  *   **A.** Two. There are two visual items present to your mind.
  *   **B.** One. You are aware of one real finger, but your experience represents it twice.
  *   **C.** Neither. You are having a single experience that is qualitatively like seeing two fingers.

  **4. The Perfect Hallucination**
  A scientist stimulates your brain so that you have an experience of a red dagger. There is no dagger. In this scenario, is there *anything* red and dagger-shaped present to your mind?
  *   **A.** Yes. A mental dagger (an appearance) is present to you.
  *   **B.** No. Your mind is in a state that claims a dagger is there, but nothing dagger-shaped exists.
  *   **C.** No. You are simply experiencing in a "dagger-like" way.

  **5. Hallucination vs. Real Perception**
  Compare the hallucination (Q4) to a case where you actually see a real red dagger. Is the fundamental thing happening in your mind the *same kind* of event in both cases?
  *   **A.** Yes. In both cases, you are in the same kind of mental state; only the cause differs.
  *   **B.** No. In the real case, the world is involved in your experience. In the hallucination, it is not. They are fundamentally different kinds of events.

  **6. Successful Seeing**
  When you successfully see a real tomato on the table, what makes your experience have the character it does (red, round, bulging)?
  *   **A.** An internal image or copy that matches the tomato.
  *   **B.** A representation or story your brain generates that matches the tomato.
  *   **C.** The tomato itself. The actual object is a constituent part of your experience.

  **7. Indistinguishability**
  Suppose the hallucination and the real perception feel exactly the same from the inside. Does this mean they must be the same kind of mental state?
  *   **A.** Yes. If you can't tell them apart introspectively, they must be the same kind of thing.
  *   **B.** No. Two things can feel the same to the subject but be different kinds of states (like a real diamond vs. a perfect fake).

  **8. Knowledge and Reasons**
  In the real case, you believe there is a tomato. In the hallucination, you believe there is a tomato. Do you have the same reason or evidence for your belief in both cases?
  *   **A.** Yes. Since they feel the same, your evidence is the same. You can't know for sure in either case.
  *   **B.** No. In the real case, you see the fact itself. In the hallucination, you are merely guessing. You can know in the real case.

  ---

  ## Instructor's Key: Logical Space & Scoring

  ### 1. The Diagnostic Dimensions
  To sort the theories, we are not asking students to identify labels, but to commit to claims across four logical dimensions. The quiz questions map onto these dimensions as follows:

  *   **Dimension 1: Ontology of Illusion (Q1, Q2, Q3, Q4)**
      *   *Object View:* There is a mental object (image/sense-datum) that has the properties things look to have. (Selecting **A** consistently).
      *   *Adverbial View:* There is no object; the subject is simply modified (sensing "redly"). (Selecting **C** consistently).
      *   *Intentional/Relational View:* There is no object; the experience is about the world (accurately or inaccurately). (Selecting **B** consistently).
  *   **Dimension 2: The Common Kind Assumption (Q5, Q7)**
      *   *Common Factor:* Veridical perception and hallucination share the same fundamental mental nature. (Selecting **A** in Q5, **A** in Q7).
      *   *Disjunctivism:* They are fundamentally different kinds of mental events. (Selecting **B** in Q5, **B** in Q7).
  *   **Dimension 3: Constitution of Veridical Perception (Q6)**
      *   *Internalist/Mediated:* Experience is constituted by internal states (images/representations). (Selecting **A** or **B**).
      *   *Externalist/Naive:* Experience is constituted by the external object itself. (Selecting **C**).
  *   **Dimension 4: Epistemology (Q8)**
      *   *Internalist Warrant:* Evidence is determined by how things seem. (Selecting **A**).
      *   *Externalist/Disjunctive Warrant:* Evidence is determined by the fact perceived. (Selecting **B**).

  ### 2. Mapping Answers to Theories

  | Theory | Q1-4 (Illusion Ontology) | Q5 & Q7 (Common Kind) | Q6 (Veridical Constitution) | Q8 (Epistemology) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Sense-Datum Theory** | **A** (Mental Object) | **A** (Same Kind) | **A** (Internal Image) | **A** (Same Warrant) |
  | **Adverbialism** | **C** (Mode of Sensing) | **A** (Same Kind) | **A/B** (Internal State) | **A** (Same Warrant) |
  | **Intentionalism** | **B** (False Representation)| **A** (Same Kind) | **B** (Representation) | **A** (Same Warrant) |
  | **Naive Realism** | **B/C** (No Object) | **B** (Diff Kind)* | **C** (Object Constitutes) | **A** or **B** |
  | **Metaphysical Disjunctivism** | **B/C** (No Object) | **B** (Diff Kind) | *Compatible with NR or Int* | *Compatible with Any* |
  | **Epistemological Disjunctivism**| *Compatible with Any* | *Compatible with Any* | *Compatible with Any* | **B** (Diff Warrant) |

  *\*Note: Naive Realists typically accept Disjunctivism to protect the claim that veridical perception is a relation to the world.*

  ### 3. Empty Seats (Unexplored or Incoherent Combinations)

  There is one logically possible combination of answers that has almost no defenders in the literature:

  *   **The "Asymmetrical Ontology" Seat:**
      *   *Answers:* **A** in Q1-4 (Illusion involves a mental object/sense-datum) **BUT** **B** in Q5/Q7 (Veridical perception is a *different kind* of state, e.g., direct contact with the world).
      *   *Why it's empty:* This view posits sense-data for hallucinations but denies them for veridical perception. This is theoretically unstable. If you admit sense-data in the hallucination to explain the phenomenology, the Argument from Illusion pressures you to admit them in the veridical case too (to maintain the Common Kind). If you reject the Common Kind (Disjunctivism), you have no need to posit sense-data in the hallucination to explain the phenomenology—you can simply say the hallucination is a different kind of state that *mimics* seeing. Positing sense-data only for the bad case incurs an ontological cost without gaining the explanatory benefit of a unified theory of mind.

  ### 4. Blind Spots (Indistinguishable Leaves)

  This quiz cannot cleanly separate the following pairs based solely on case intuitions:

  *   **Naive Realism (NR) vs. Metaphysical Disjunctivism (MD):**
      *   *The Issue:* NR is a claim about the *good case* (it is constituted by the object). MD is a claim about the *relationship between cases* (they share no fundamental kind).
      *   *Overlap:* Almost all Naive Realists are Metaphysical Disjunctivists. However, one could theoretically be a Metaphysical Disjunctivist without being a Naive Realist (e.g., an *Intentional Disjunctivist* who holds that veridical perception is a successful representational state, while hallucination is a different, non-representational kind of state).
      *   *Quiz Limitation:* Q6 attempts to separate them (NR says **C**, Intentional Disjunctivist says **B**), but students often conflate "the object is part of the experience" with "the experience is about the object." If a student selects **B** on Q6 and **B** on Q5, they are an Intentional Disjunctivist, but the quiz might lump them with standard Intentionalists unless Q5 is weighted heavily.
  *   **Metaphysical Disjunctivism (MD) vs. Epistemological Disjunctivism (ED):**
      *   *The Issue:* MD is about ontology (what the state *is*). ED is about epistemology (what *reasons* you have).
      *   *Overlap:* McDowell argues ED entails MD, but one could logically hold MD (states are different) while denying ED (I still can't tell them apart, so my warrant is the same).
      *   *Quiz Limitation:* Q8 separates ED, but a student could be a Metaphysical Disjunctivist (Q5=**B**) who remains an Internalist about warrant (Q8=**A**). The quiz classifies them as "Disjunctivist" generally, but the specific *flavor* (Metaphysical vs. Epistemological) depends entirely on Q8.

  ### 5. Pedagogical Note: The "Common Kind" Trap
  The point of this sorting exercise is to reveal the **Common Kind Assumption (CKA)**.
  *   Students who select **A** on Q5 (Same Kind) are committed to the CKA.
  *   Once committed to CKA, they *must* answer Q1-4 consistently for both illusion and veridical perception.
  *   If they say "Nothing is bent" in the illusion (Q1=B) but "The object makes the experience red" in veridical perception (Q6=C), they have created a contradiction *if* they also said Q5=A.
  *   **The Lesson:** The Argument from Illusion only works if you accept the CKA. Disjunctivism (Q5=B) blocks the argument by denying the premise that the two cases must be explained by the same ontology.
