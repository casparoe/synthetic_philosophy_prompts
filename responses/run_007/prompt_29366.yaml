      *   **Intentionalism:** Says "No object" in illusion (Q1, Q2). Describes it as a false claim/story. Says "Same Kind" (Q5).
      *   **Naive Realism:** Says Veridical is direct contact (Q6). Usually says Hallucination is different kind (Q5).
      *   **Metaphysical Disjunctivism:** Says Hallucination/Perception are different fundamental kinds (Q5).
      *   **Epistemological Disjunctivism:** Says Knowledge/Warrant differs despite indistinguishability (Q8).

