answer: |-
  Subject: Re: Gongsun Long and the white horse paradox

  Hey there,

  It is completely understandable that you are frustrated with that Discord discussion because invoking Gongsun Long to support the idea that conceptual categories are arbitrary is almost certainly a misreading of the text, and honestly, it might be the exact opposite of what he was arguing. I have spent some time with the School of Names literature and I can walk you through the distinct claims hidden in that sentence, evaluate them, and then give you my firm take on what Gongsun Long actually meant versus what is worth defending today.

  To make sense of this, we have to separate the possible logical claims from the metaphysical ones. The most charitable but trivial reading is purely semantic and extensional. On this view, the sentence means the extension of the concept white horse is not identical to the extension of the concept horse. Since the set of white horses is a proper subset of the set of all horses, the two concepts are not interchangeable. This claim is technically true but philosophically boring. It simply means that adding a modifier narrows the scope of a term. This does not support the idea that categories are arbitrary. In fact, it supports the idea that categories have precise boundaries and logical rules governing their combination. If categories were truly arbitrary, you could swap them without logical consequence, but Gongsun Long is insisting you cannot swap them.

  A second reading is metaphysical, focusing on the nature of universals or attributes. Here, the claim is that the compound universal whiteness-plus-horseness is not identical to the simple universal horseness. This relies on a realist ontology where properties exist independently or at least have distinct identity conditions. If you accept that properties are real components of reality, then a complex object possessing multiple properties is not identical to an object defined by only one of those properties. This is also defensible, but again, it argues for a rigid structure of reality, not an arbitrary one. It suggests that reality is composed of specific combinations of attributes that must be named precisely. This reading actually undermines the Discord person's argument because it implies there is a fact of the matter about how properties combine, rather than it being a matter of linguistic convention.

  There is also the linguistic or translation-based reading, which suggests the paradox arises because classical Chinese does not function like English. In classical Chinese, the word fei is used where we might use is not, but it often functions more like is not equivalent to or fails to match rather than strict numerical identity. Furthermore, classical Chinese nouns do not always distinguish between mass and count in the way English does, so horse might mean horseness or the class of horses or a specific horse depending on context. While it is true that translation artifacts exaggerate the paradox, dismissing it entirely as a linguistic glitch is too easy. Gongsun Long was aware of how language worked in his context and was deliberately exploiting these features to make a point about precision. So while the linguistic structure enables the paradox, it does not dissolve the philosophical intent.

  Then we have the reading your Discord friend is likely relying on, which is a form of nominalism or conventionalism. This view holds that Gongsun Long is showing that the link between names and realities is broken, implying that we impose categories like horse arbitrarily onto a flux of experience. This is where I have to commit to saying this interpretation is false based on the historical context. Gongsun Long was part of the School of Names, and their primary project was often aligned with the Confucian idea of the Rectification of Names. The goal was to ensure that names matched realities precisely so that social and political order could be maintained. If names were arbitrary, rectification would be impossible. Gongsun Long was arguing that we must be extremely careful with our categories because they correspond to distinct realities, not that the categories are meaningless conventions. He was likely a realist about names, arguing that if you say white horse, you are invoking a specific compound reality that is distinct from the reality invoked by horse. To confuse them is an error in mapping language to the world, not proof that the map is arbitrary.

  So regarding what Gongsun Long actually intended, I am committed to the view that he was making a realist argument about the specificity of reference. He intended to show that compound names refer to compound realities that are not reducible to their parts. When you ask for a white horse, you cannot be satisfied with a yellow horse, even though a yellow horse is a horse. Therefore, the demand for a white horse is not the same as the demand for a horse. This was likely a logical exercise to train thinkers to avoid equivocation and to understand that adding attributes changes the identity conditions of the subject. He was pushing for greater precision in language to reflect the complexity of reality, not to dissolve reality into linguistic convention.

  As for which reading is philosophically worth defending today, I believe the most valuable takeaway is not the paradox itself but the underlying logic of compound concepts. We should defend the idea that identity conditions for concepts are sensitive to modification. In modern terms, this touches on the intensionality of contexts. The concept of a white horse has different truth conditions than the concept of a horse, and treating them as identical leads to logical errors. This is worth defending because it counters the sloppy thinking that often happens in contemporary discourse where categories are treated as fluid when precision is required. However, we should not defend the idea that this proves categories are arbitrary. Instead, we should defend the idea that categories are structured and that ignoring that structure leads to falsehoods. The Discord person is trying to use a text about precision to argue for vagueness, which is ironic.

  In summary, the sentence can be read as a trivial set-theoretic truth, a metaphysical claim about compound universals, or a linguistic observation about classical grammar, all of which are defensible to varying degrees. However, the claim that it proves categories are arbitrary is false both historically and philosophically. Gongsun Long meant to show that names must match realities with high fidelity, and the philosophically useful lesson is that we must respect the logical structure of our concepts rather than assuming they are interchangeable. I hope this helps you push back in that server because you are right to suspect that something was off about their interpretation.

  Best,

  Your Philosophy Friend
