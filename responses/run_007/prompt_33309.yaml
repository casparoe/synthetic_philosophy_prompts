  There is no single principle that captures all your verdicts exactly as stated, because your set of intuitions contains a logical contradiction. Specifically, your desire to say there is "one, not two" objects on the shelf (Verdict 3) conflicts with your assertion that the statue and the lump have different persistence conditions (Verdicts 1, 2, 4, and 7). If the statue and the lump were truly one and the same object, they would have to share all properties, including the property of surviving squashing (by Leibniz's Law). Since you say one survives and the other does not, they cannot be numerically identical.

  To resolve this, you must give up Verdict 3 (the "one object" intuition). This is the correct verdict to drop because it is a pre-theoretical counting intuition, whereas the persistence conditions (Verdicts 4 and 7) reflect deep conceptual commitments about what kinds of things statues and lumps *are*. It is less costly to revise how we count coincident entities than to deny that artifacts depend on form while matter depends on continuity.

  The principle that captures your remaining, consistent verdicts is the **Principle of Sortal Individuation**.

  **The Principle of Sortal Individuation:**
  1.  **Matter Persistence:** A portion of matter persists through changes of shape and arrangement so long as the matter itself is not scattered or destroyed. (Motivated by your verdict that the lump survives molding and squashing).
  2.  **Artifact Dependence:** An artifact exists only when a portion of matter is arranged with a specific form and constitutive intention, and it ceases to exist if that form or function is lost. (Motivated by your verdict that the statue begins on Tuesday, does not exist in the landslide, and is destroyed by squashing or reworking).
  3.  **Coincidental Distinctness:** If two sortals (e.g., 'Lump' and 'Statue') applied to the same matter at the same time dictate different persistence conditions, they individuate numerically distinct objects that are spatially coincident. (Motivated by the necessity of distinguishing the statue from the lump to avoid contradiction in the squashing case).

  **Predictions for Unlisted Cases:**

  *   **A flag and the piece of cloth:** The principle predicts **two distinct objects**. The cloth survives being cut into rags; the flag is destroyed because it loses its functional shape. They coincide while the flag is flying, but they are not identical.
  *   **A person and their body:** The principle predicts **two distinct objects** (assuming a Lockean view of personhood). The body (an organism) persists through total loss of psychological continuity (e.g., permanent vegetative state); the person (defined by psychological capacities) ceases to exist in that state. Conversely, if psychological continuity could be transferred to a new substrate, the person might survive where the body does not.
  *   **A bronze statue whose bronze is gradually replaced:** The principle predicts **the statue persists, but the original bronze portion does not**. The sortal 'Statue' allows for gradual replacement of parts (Ship of Theseus), preserving identity through form and history. The sortal 'Portion of Bronze' requires the persistence of the specific matter; once the atoms are replaced, that specific portion of bronze is gone.
  *   **A smashed statue whose pieces are later reassembled:** The principle predicts **the clay persists, but the statue's survival is contingent**. The clay survives because the matter is gathered back together. The statue survives only if the sortal 'Statue' permits interruption of existence (gappy existence); if the sortal requires continuous form, the original statue is destroyed and a new one created upon reassembly.

  You should adopt this principle because it respects the modal differences you rightly identified while providing a coherent ontology that explains why the "one object" intuition feels compelling (spatial coincidence) without succumbing to logical contradiction.

  Verdict: Numerical identity requires shared persistence conditions, so spatially coincident matter and artifacts constituted by it are numerically distinct objects governed by their respective sortals.
