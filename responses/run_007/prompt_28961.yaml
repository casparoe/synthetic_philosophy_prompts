  7.  **Final Assessment Question:**
      *   Needs to distinguish "people changed" from "the kind changed."
      *   *Draft:* "If we stopped diagnosing MPD tomorrow, would the phenomenon disappear?" (Too simple).
      *   *Better:* "If we went back to 1890 with our current classification, would we find the same people?"
      *   *Best:* Ask them to predict what happens to the *statistics* of the condition if the classification remains static.

