      *   *Candidate 4: Child Abuse / Battered Woman Syndrome.*
          *   *Pros:* Hacking discusses this. Shows how naming creates a space for action.
          *   *Cons:* Emotionally heavy.
      *   *Candidate 5: Homosexuality (Pathologization to De-pathologization).*
          *   *Pros:* Clear classification shift, strong reaction from the classified.
          *   *Cons:* Political weight might overshadow the metaphysical point.

      *   *Selection:* **Multiple Personality Disorder (MPD) / Dissociative Identity Disorder (DID).**
