  2.  **Deconstruct Hacking's Looping Effect:**
      *   *Core distinction:* Indifferent kinds (electrons) vs. Interactive kinds (people).
      *   *The Mechanism:* Classification $\rightarrow$ Awareness/Adoption $\rightarrow$ Behavior Change $\rightarrow$ Statistical/Conceptual Shift $\rightarrow*   *The Deep Claim:* It's not just that the *extension* changes (more people fit the label), but the *intension* or the *phenomenon itself* changes. The "moving target."
      *   *The Danger:* Confusing this with self-fulfilling prophecies or stigma. It's about ontology, not just sociology.

  3.  **Brainstorming Examples:**
      *   *Candidate 1: Multiple Personality Disorder (Dissociative Identity Disorder).* Hacking's favorite.
          *   *Pros:* Rich historical data, clear feedback loop between patients and therapists.
          *   *Cons:* Psychiatrists in the room might get defensive or bogged down in clinical specifics. Might feel too niche.
      *   *Candidate 2: Autism Spectrum.*
          *   *Pros:* Very relevant, huge cultural shift.
          *   *Cons:* Highly charged emotionally. Might drift into advocacy rather than metaphysics. Hard to separate diagnostic criteria changes from population changes.
      *   *Candidate 3: The "Teenager".*
          *   *Pros:* Sociological, clear historical emergence (mid-20th century).
