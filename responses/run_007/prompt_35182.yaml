      *   *The Dilemma Defense (Widerker 1995, "Libertarianism and Frankfurt's Attack"):* This is exactly Mira's argument. If the prior sign is indeterministic, the intervener can't predict. If it's deterministic, the agent isn't free (in the libertarian sense).
