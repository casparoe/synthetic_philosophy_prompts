answer: |-
  # Activity: The Blind Protocol

  **Objective:** To physically simulate the gap between authorial intent and textual reception, forcing students to confront the limits of their control over meaning.
  **Materials:** 
  *   16 small envelopes (or folded slips of paper).
  *   16 "Directive Cards" (see below).
  *   Timer.
  *   Whiteboard/Chalkboard.
  *   Paper/pens for all students.

  **The Directive Cards:**
  Prepare 16 cards. Each contains the same writing prompt, but a different **Secret Directive**.
  *   *Prompt:* "Write 150 words. A character enters a room and looks at a chair."
  *   *Directives (assign one per student):* 
      1. The chair represents **Safety**.
      2. The chair represents **Threat**.
      3. The chair represents **Lost Love**.
      4. The chair represents **Boredom**.
      5. The chair represents **Power**.
      6. The chair represents **Guilt**.
      7. The chair represents **A Memory of Childhood**.
      8. The chair represents **A Trap**.
      9. The chair represents **Rest**.
      10. The chair represents **Judgment**.
      11. The chair represents **Hope**.
      12. The chair represents **Decay**.
      13. The chair represents **Authority**.
      14. The chair represents **Loneliness**.
      15. The chair represents **Secret Knowledge**.
      16. The chair represents **Nothing (It is just a chair).**

  *(Note: Ensure the "Nothing" card is included. It is the control variable.)*

  ---

  ## Minute-by-Minute Timeline (120 Minutes)

  ### 0:00 – 0:10 | Setup & Distribution
  *   **Action:** Hand out the envelopes. Tell students **not** to open them yet.
  *   **Script:** "Inside is a prompt and a secret instruction. You are the Author. Your goal is to execute the instruction using *only* the text. You cannot state the instruction explicitly (e.g., if your card says 'Fear,' you cannot write the word 'fear' or 'afraid'). You have 25 minutes. Go."
  *   **Rule:** No talking. No showing cards.

  ### 0:10 – 0:35 | Phase 1: Composition (The Author)
  *   **Action:** Students write their 150-word micro-scenes.
  *   **Instructor Role:** Circulate. If a student asks, "Is this clear?" answer only: "I am not allowed to know what you are trying to do."
  *   **Collection:** At 0:35, collect the texts. Keep the envelopes/cards with the authors.

  ### 0:35 – 0:55 | Phase 2: Interpretation (The Reader)
  *   **Action:** Redistribute the texts randomly. Ensure no one gets their own.
  *   **Instruction:** "You are now the Reader. Read the text in front of you. On a fresh sheet, answer one question: **What does the chair signify to the character?** You must commit to a single interpretation. You cannot ask the author. You have 15 minutes."
  *   **Constraint:** They must write a brief justification citing specific words from the text (e.g., "The word 'loomed' suggests threat").

  ### 0:55 – 1:25 | Phase 3: The Collision (Pair Share)
  *   **Action:** Pair students up (Author + Reader).
  *   **Step 1 (5 mins):** The Reader reads their interpretation aloud. The Author listens silently. No reaction.
  *   **Step 2 (5 mins):** The Author reveals their Secret Directive card.
  *   **Step 3 (15 mins):** Discussion. The pair must answer three questions together:
      1.  Did the text match the intent? (Yes/No)
      2.  If No: Is the text "broken," or is the meaning just different?
      3.  If Yes: Was it luck or craft?
  *   **Instructor Role:** Listen. Do not intervene. Watch for moments of defensiveness ("But I wrote...") vs. acceptance ("I see why you read it that way").

  ### 1:25 – 1:55 | Phase 4: The Debrief (Mapping the Theory)
  *   **Action:** Bring the room together. Draw three columns on the board: **The Author**, **The Text**, **The Reader**.
  *   **Discussion:** Ask pairs to report one "Collision" (where Intent ≠ Interpretation).
  *   **Mapping (See Debrief Guide below):** As they speak, place their comments into the three columns to reveal the theoretical positions without using jargon until the end.

  ### 1:55 – 2:00 | Closing
  *   **Action:** Summarize the practical takeaway.
  *   **Script:** "You cannot control the Reader. You can only tune the Text. Your intention is the target; the text is the arrow; the reader is the wind. Write for the wind."

  ---

  ## Debrief Guide: Mapping Moments to Theory

  Do not lecture. Use the students' friction points to introduce the concepts.

  **1. When a student says: "But I *meant* it to be scary, so it *is* scary."**
  *   **Map to:** **Intentionalism.**
  *   **Board Column:** Under **The Author**, write "Sovereignty."
  *   **Concept:** This is the belief that meaning originates in the creator's mind. If the intent is clear to the author, the text is a vessel for that mind.
  *   **Practical Counter:** Ask the Reader in that pair: "Did you feel scared?" If they say no, ask the Author: "Does your feeling of scare change their experience?"
  *   **Takeaway:** Intention is invisible to the audience. It has no power unless encoded.

  **2. When a student says: "The word 'shadow' is on the page. That creates fear, regardless of what you wanted."**
  *   **Map to:** **Formalism / New Criticism.**
  *   **Board Column:** Under **The Text**, write "Evidence."
  *   **Concept:** The text is an autonomous object. Meaning is found in the structure, diction, and imagery, not the biography of the writer.
  *   **Practical Counter:** Ask the Author: "If you meant 'Safety' but used the word 'shadow,' who is at fault?"
  *   **Takeaway:** The text is the only evidence the reader has. If the code is broken, the message is lost.

  **3. When a student says: "I read it as 'Loneliness' and that felt true to me. It doesn't matter that you wanted 'Power'."**
  *   **Map to:** **Reader-Response Theory.**
  *   **Board Column:** Under **The Reader**, write "Construction."
  *   **Concept:** Meaning is an event that happens during reading. The reader brings their own history, mood, and associations to the text.
  *   **Practical Counter:** Ask the Author: "Can you stop them from feeling that?"
  *   **Takeaway:** You cannot police the reader's brain.

  **4. The Synthesis (The Novelist's Truth)**
  *   **Action:** Circle the space *between* the columns.
  *   **Script:** "In this room, we treat 'Meaning' as a handshake. It requires two parties. As novelists, we live in the **Text** column. We cannot live in the **Author** column (no one sees your brain) and we cannot live in the **Reader** column (you aren't in their head). You control the *probability* of meaning, not the *certainty*."

  ---

  ## Predictable Failures (First Run)

  **1. The "Clueless Author" Failure**
  *   **What happens:** A student gets the "Nothing (Just a chair)" card and writes a neutral description. The Reader inevitably projects meaning onto it (e.g., "The emptiness signifies loss").
  *   **Why it matters:** This proves the Reader-Response point most violently. The text *will* mean something, even if the author intended nothing.
  *   **Mitigation:** Highlight this specific pair in the debrief. It is your strongest evidence against pure Intentionalism.

  **2. The "Polite Reader" Failure**
  *   **What happens:** During the Collision phase, the Reader says, "Oh, I see what you meant now," and retroactively adjusts their interpretation to match the Author.
  *   **Why it matters:** This erases the data. It comforts the Author but hides the craft problem.
  *   **Mitigation:** In the Phase 3 instructions, explicitly say: "Do not change your interpretation after the reveal. If the text didn't match, admit the mismatch. We are studying the gap, not fixing the story."

  **3. The "Time Creep"**
  *   **What happens:** 150 words takes longer than expected for perfectionists.
  *   **Mitigation:** Call out time checks aggressively. "50 words remaining!" "30 seconds!" The pressure forces instinctual choices, which reveals their default coding better than polished prose.

  **4. The "Gotcha" Dynamic**
  *   **What happens:** Readers feel smug about "catching" the Author failing; Authors feel defensive.
  *   **Mitigation:** Frame the mismatch as a *discovery*, not a failure. "If the meaning slipped, that is where the interesting work is."

  ---

  ## Limitations: What This Activity Cannot Do

  Be honest with yourself about where this simulation falls short so you can supplement it verbally.

  **1. It cannot reproduce "Better Misreadings."**
  *   **The Limit:** The activity frames a gap between Intent and Interpretation as a problem to be solved (a communication error). In high art, sometimes the reader's interpretation is *more valuable* than the author's intent (e.g., allegories the author didn't plan).
  *   **Your Fix:** In the debrief, mention: "Sometimes the wind blows the arrow into a better target than you aimed for. That is when you let the text stand, even against your own intent."

  **2. It isolates the text from Culture.**
  *   **The Limit:** The activity assumes a vacuum. In reality, "Chair" carries cultural weight (throne, electric chair, waiting room) that the Author and Reader share (or don't share) based on society, not just the text.
  *   **Your Fix:** Acknowledge that "Codes are cultural." If everyone reads 'shadow' as 'fear,' it's because we share a culture of horror movies, not because 'shadow' inherently means fear.

  **3. It simplifies "Meaning" to "Symbol."**
  *   **The Limit:** We reduced meaning to "What does the chair signify?" Real fiction meaning is cumulative, emotional, and thematic.
  *   **Your Fix:** Clarify that this was a microcosm. "In a novel, you have 80,000 words to correct the wind. In 150 words, you are at the mercy of the gust. But the principle is the same."

  **4. It removes the Author's Revision Power.**
  *   **The Limit:** In real life, if a beta reader misses the point, the author revises. Here, the text is frozen.
  *   **Your Fix:** End with the practical application: "This is why you have beta readers. Not to tell you what you wrote, but to tell you what you *did*. This activity is your beta reading simulation."
