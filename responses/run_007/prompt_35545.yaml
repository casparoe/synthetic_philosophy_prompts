prompt: |-
  I'm a working novelist who teaches an advanced fiction workshop: sixteen undergraduates, one two-hour session. I want a single runnable activity that makes them feel the force of the question whether an author's intention should govern the meaning of a text, and leave with a precise sense of what a writer can and cannot control about what a story means. The stakes should be practical rather than scholarly. The problem should emerge from the rules rather than from any framing: have participants produce or interpret a short passage under constraints, commit to an interpretation before learning the author's stated intention, and only then face the question of whether that intention changes what the text means. No lecture up front; the theoretical labels should appear only in the debrief. Give me the rules, materials, and a minute-by-minute timeline, then a debrief that maps the moments of the activity onto the main positions — that the text means what the author intended, that it means something independent of intention, and that the reader constructs the meaning — without requiring any prior reading. Also tell me what will predictably go wrong the first time I run it, and be honest about which feature of the debate the activity cannot reproduce and I will have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** 16 undergraduates (advanced fiction workshop).
      *   **Instructor:** Working novelist (practical focus, not purely academic).
      *   **Format:** One 2-hour session.
      *   **Goal:** Make students *feel* the tension between authorial intention and textual meaning (Death of the Author vs. Intentionalism vs. Reader-Response).
      *   **Constraint 1:** Single runnable activity.
      *   **Constraint 2:** No lecture up front (theory comes in debrief).
      *   **Constraint 3:** Problem must emerge from rules/constraints.
      *   **Constraint 4:** Participants must commit to an interpretation *before* knowing the author's intent.
      *   **Constraint 5:** Practical stakes (writing craft), not just scholarly.
      *   **Deliverables:** Rules, Materials, Minute-by-Minute Timeline, Debrief (mapping activity to theory), Predictable Failures, Limitations of the Activity.

  2.  **Deconstruct the Core Problem:**
      *   How do I simulate the gap between *what I meant* and *what you read* in a classroom setting?
      *   Standard workshop critique does this implicitly ("I thought you meant X" vs. "I meant Y"), but it often resolves too easily with "Okay, I'll fix it." I need to freeze that moment of conflict.
      *   I need a mechanism where the "Author" is separated from the "Text" and the "Reader."
      *   *Idea:* A "Black Box" writing exercise. Authors write with a secret constraint/intent. Readers interpret without knowing it. Then compare.
      *   *Refinement:* To make it about *meaning* rather than just *clarity*, the intent needs to be thematic or emotional, not just plot-based.
      *   *Refinement 2:* To make it practical for novelists, the takeaway must be about *control*. What can I control? What slips away?

  3.  **Develop the Activity: "The Blind Protocol"**
      *   **Phase 1: Writing (The Author).** Students write a micro-scene based on a prompt, but they are given a *Secret Directive* (the intention) that they must embed but not state.
      *   **Phase 2: Reading (The Reader).** Students swap texts. They analyze the text for meaning/theme without knowing the directive.
      *   **Phase 3: The Collision.** Reveal the directive. Discuss the gap.
      *   **Constraint:** The Secret Directive should be something subtle, like "Make the reader feel the protagonist is lying" vs. "Make the reader feel the protagonist is terrified." Or better: "The object on the table represents death."
      *   *Better Idea:* Let's use specific *emotional outcomes* vs. *literal actions*.
      *   *Best Idea:* "The Ambiguous Object."
      *   *Wait, let's make it more rigorous.* Let's split the room. Half Authors, Half Readers? No, 16 students is small enough for everyone to do both.
      *   *Mechanism:* Envelopes.
      *   **The Prompt:** Write 150 words. A character enters a room and looks at an object.
      *   **The Secret Intent:** Each author gets a card defining what the object *means* to the character (e.g., "Guilt," "Hope," "A Weapon," "A Memory of Home"). They cannot name the concept.
      *   **The Reader's Task:** Read the text. Write down what the object signifies to the character based *only* on the text.
      *   **The Reveal:** Author tells Reader their intent.
      *   **The Judgment:** Does the text succeed? If the Reader guessed wrong, is the text "wrong" or just "different"?

  4.  **Drafting the Timeline (120 Minutes):**
      *   0-10: Setup & Rules (No theory).
      *   10-30: Writing Phase (with Secret Intents).
      *   30-50: Reading/Interpreting Phase (Blind).
      *   50-80: Pair Share & The Reveal (The Conflict).
      *   80-110: Group Debrief (Theory Mapping).
      *   110-120: Closing/Wrap.

  5.  **Refining the "Practical Stakes":**
      *   Why does this matter to a novelist? Because you can't be in the room with every reader. You need to know if your tools (words) carry the weight you think they do.
      *   The "Verdict": If the reader misses the intent, is it a failure of craft or a success of ambiguity?

  6.  **Developing the Debrief (Theory Mapping):**
      *   *Intentionalism:* "The text failed because it didn't match my card."
      *   *New Criticism/Formalism:* "The text stands alone. If the words say 'fear,' it's fear, regardless of your card."
      *   *Reader-Response:* "My experience of the text is the meaning. Your card is irrelevant history."
      *   *Practical Synthesis:* Intention is the target; Text is the arrow; Reader is the wind.

  7.  **Identifying Predictable Failures:**
      *   Students will cheat (write the word on the card).
      *   Students will be too nice ("Oh, I see what you meant now").
      *   Time management (writing takes longer than expected).
      *   The "Right Answer" bias (students think there is one correct interpretation).

  8.  **Identifying Limitations:**
      *   This activity simulates *communication*, not *artistic value*. It doesn't address whether a "misreading" creates a *better* poem. It focuses on efficacy.
      *   It doesn't account for cultural context (shared codes).
      *   It simplifies "meaning" to "symbolic definition."

  9.  **Review against Constraints:**
      *   Single activity? Yes (The Envelope Exchange).
      *   No lecture up front? Yes.
      *   Commit before knowing intent? Yes.
      *   Practical stakes? Yes (Craft control).
      *   Debrief maps theory? Yes.
      *   Predictable failures included? Yes.
      *   Limitations included? Yes.

  10. **Final Polish:**
      *   Make the instructions crisp.
      *   Ensure the "Secret Directive" cards are varied enough to cause conflict.
      *   Tone: Professional, workshop-focused, respectful of the students' intelligence.

  *(Self-Correction during drafting)*: I initially thought about having them write different genres. No, keep the prompt identical so the variable is *only* the intention vs. execution.
  *Correction on Time:* 20 mins writing might be tight for 150 words + thinking. Let's make it 25 mins. 16 students means 8 pairs. Pair share needs enough time. 30 mins for pair share/reveal is good.
  *Debrief:* Needs to be very structured so the instructor doesn't just lecture. Use board work.

  *Final check on the "Practical Stakes":* The prompt asks for "what a writer can and cannot control." The debrief must explicitly answer this.
  *Can control:* Word choice, pacing, imagery.
  *Cannot control:* The reader's brain, associations, mood, cultural background.
  *The Gap:* This is where the work lives.

