answer: |-
  # Activity Design: "The Slippage Workshop"

  ## 1. Full Setup

  **Materials:**
  *   **Mini-whiteboards & Markers:** One per student (or per pair if resources are tight, but individual is better for the "confrontation" moment).
  *   **Worksheet Packets:** One per student. Each packet contains 4 pages, labeled "Problem 1" through "Problem 4." Each page has two fields: **Answer** and **Rule Description** (e.g., "I changed the ______ to its ______").
  *   **Projector/Slides:** To display the source/target pairs simultaneously for the whole room.
  *   **Timer:** Visible to you (not necessarily the students).

  **Grouping:**
  *   Arrange the 16 students into 4 pods of 4 students each.
  *   Within pods, students sit in a cluster to facilitate discussion during specific phases, but they must write their own answers individually first.

  **Facilitator Instructions (Start of Class):**
  > "Welcome. Today is not about finding the 'correct' answer. In fact, if everyone agrees on the answer too quickly, I will consider the activity a failure.
  >
  > You will be presented with letter-string analogies. For each one, you must do two things on your worksheet:
  > 1. Write the resulting string (the Answer).
  > 2. Write the Rule you used to get there in natural language (e.g., 'Replace the last letter with its successor').
  >
  > **Crucial Constraint:** You are not allowed to discuss your answers with your pod mates until I explicitly tell you to 'Compare.' Until then, work in silence. When I say 'Compare,' discuss your Rules, not just your Answers. If you have different answers, see if you used the same Rule. If you have the same answer, see if you used different Rules.
  >
  > We are studying how human concepts bend. Let's begin."

  ---

  ## 2. Problem Sequence

  | Problem | Source Case | Target Case | Expected Answers | Concept Under Pressure | Stage |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | `abc` | `abd` | `ijk` → `ijl` | **Successor:** Rigid, alphabetic, single-letter. | Confidence |
  | **2** | `aaa` | `bbb` | `ccc` → `ddd` | **Objecthood:** Is the object a 'letter' or a 'group'? (Here they align). | Confidence |
  | **3** | `abc` | `abd` | `xyz` → `xya` OR `xyy` OR "None" | **Boundary:** What is the successor of 'z'? Does the alphabet wrap? | Tension |
  | **4** | `abc` | `abd` | `mrrjjj` → `mrrkkk` OR `mrrjjjj` | **Description:** What is the "rightmost object"? (Letter 'j' vs. Group 'jjj' vs. Length '3'). | Confrontation |

  **Notes on Problem 4 (The Confrontation):**
  *   **Answer A (`mrrkkk`):** Rule = "Replace the rightmost *letter group* with its successor letter." (Slippage: `c` → `d` is letter successor; `jjj` → `kkk` is letter successor applied to group).
  *   **Answer B (`mrrjjjj`):** Rule = "Replace the rightmost *group* with its successor *group*." (Slippage: `c` is a group of length 1. `jjj` is a group of length 3. Successor of length 3 is length 4).
  *   **The Trap:** Both groups will claim they followed the rule "Change the rightmost object to its successor."

  ---

  ## 3. Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Introduction** | Distribute materials. Explain the "Rule Description" constraint. Emphasize silence during writing. |
  | **00:10 – 00:25** | **Phase 1: Calibration** | **Problems 1 & 2.** Project pairs. 3 mins writing per problem. 2 mins pod discussion. <br>*Goal:* Establish a baseline of agreement. Most will get `ijl` and `ddd`. |
  | **00:25 – 00:45** | **Phase 2: Pressure** | **Problem 3 (`xyz`).** 5 mins writing. 5 mins pod discussion. 5 mins Class-wide poll (hold up boards). <br>*Goal:* Surface disagreement. Ask: "Who changed the rule when you hit 'z'?" |
  | **00:45 – 01:05** | **Phase 3: Confrontation** | **Problem 4 (`mrrjjj`).** 5 mins writing (Silence strictly enforced). 10 mins Pod Discussion. 5 mins Class Confrontation. <br>*Goal:* Find two students with different answers who claim the *same rule*. |
  | **01:05 – 01:20** | **Debrief** | Connect experience to Copycat theory (see script below). |

  ---

  ## 4. Debrief Script

  *(Stand at the front. Do not erase the boards yet. Point to the divergence in Problem 4.)*

  **Facilitator:** "Look at Problem 4. I see `mrrkkk` on this side, and `mrrjjjj` on this side. Can I get a show of hands for who wrote the rule: *'Replace the rightmost object with its successor'*?"

  *(Wait for hands. Ideally, both camps raise their hands.)*

  **Facilitator:** "This is the phenomenon we are here to study. You used the same words—'object,' 'successor,' 'rightmost'—but you meant different things.
  *   For Group A, an 'object' was a **letter type**. The successor of 'j' is 'k'.
  *   For Group B, an 'object' was a **group size**. The successor of '3' is '4'.

  **Theoretical Mapping:**
  1.  **Conceptual Slippage:** In Problem 1, 'successor' felt rigid. By Problem 4, the context (`mrrjjj`) exerted **pressure**. The concept of 'successor' slipped from 'alphabetic next' to 'numerical next.' This isn't an error; it's flexibility.
  2.  **Object Description:** In the **Workspace** of your mind, you built a description of the string. Was `jjj` described as "three j's" or "a group of length 3"? Copycat argues that descriptions are not fixed; they compete.
  3.  **No "Right" Concept:** There is no Platonic 'Successor.' There is a family of successor concepts activated by context. If the string was `111222333`, you'd likely say `111222444` (number successor). If it was `abc`, you say `abd` (letter successor). The *domain* dictates the *concept*.
  4.  **The 'Aha' Moment:** When you realized your rule broke on `xyz` (Problem 3), you felt **pressure**. You had to relax a constraint (wrapping the alphabet) or change the operation (going backward). That feeling of tension is the engine of fluid cognition.

  **Closing:** "In the reading for next week (Hofstadter & Mitchell), you will see how the Copycat architecture models this. It doesn't hard-code rules. It builds a workspace where these descriptions compete. Today, you *were* the workspace."

  ---

  ## 5. Failure Modes & Remedies

  | What Happens | Why It Happens | Remedy |
  | :--- | :--- | :--- |
  | **Students demand the "Correct" Answer.** | Academic conditioning; discomfort with ambiguity. | **Pre-empt:** State in the intro that "Correctness is secondary to Rule Consistency." **During:** Ask, "Correct according to which rule?" |
  | **Everyone gets Problem 4 wrong (confusion).** | `mrrjjj` is cognitively dense; students might not see the grouping. | **Scaffold:** If silence persists >2 mins, say: "Look at the *structure* of the groups, not just the letters." |
  | **One student dominates the pod discussion.** | Social dynamics; confidence gaps. | **Structure:** Enforce the "Write alone first" rule strictly. During discussion, say: "Go around the table. Everyone must read their Rule aloud before debating." |
  | **Problem 3 (`xyz`) kills momentum.** | Students get stuck on the boundary condition and refuse to move on. | **Timebox:** Hard stop at 5 minutes. Say: "Lock in your best guess. The tension is the data point." |
  | **No divergence in Problem 4.** | Homogeneous group thinking (e.g., all CS majors see code patterns). | **Pivot:** Ask: "What if the rule was 'Make the string longer'? How would that change your answer?" Force the slippage manually. |

  ---

  ## 6. Unreproducible Features of Copycat

  *Note for your mini-lecture:* This activity is a phenomenological demonstration, not a computational model. You must clarify these limitations afterward.

  1.  **Parallel Terraced Scan:** Students process problems serially (one rule at a time). Copycat explores multiple rules simultaneously at different speeds.
  2.  **Sub-symbolic Codelets:** Students use conscious, verbalizable rules ("Replace rightmost"). Copycat uses tiny, sub-cognitive "codelets" that build structures without a central executive.
  3.  **Temperature Mechanism:** Students cannot consciously simulate "randomness" or "frustration." In Copycat, as the system gets stuck, "temperature" rises, allowing riskier slippages. You cannot force a student to take a "riskier" conceptual leap on command.
  4.  **Fuzzy Boundaries:** In the activity, a student commits to a rule. In Copycat, node activations are probabilistic and overlapping; a concept can be "partially active."

  ---

  ## JSON Summary

