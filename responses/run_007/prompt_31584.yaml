answer: |-
  This is a classic problem in effective altruism and institutional philanthropy: **moral pluralism without a common currency.** You cannot mathematically solve a values disagreement, but you can proceduralize the *expression* of that disagreement so it doesn't devolve into a shouting match.

  Below is the **Moral Uncertainty Grant Protocol (MUGP)**. It is designed to be run by a Program Officer (PO) before the meeting, with a 30-minute review during the meeting. It borrows from the "Parliamentary Model" of moral uncertainty (treating moral views like voting blocs) and incorporates "truncation" rules to handle fanaticism.

  ### Part 1: The Protocol (Pre-Meeting Prep)

  **Time required:** 20 minutes per grant.
  **Who fills it out:** The Program Officer championing the grant, with input from dissenters.
  **Format:** A single spreadsheet tab.

  #### Step 0: The Rights Veto (The Board Chair's Constraint)
  *   **Question:** Does this grant violate a deontological side-constraint (e.g., instrumentalizing humans, violating informed consent, supporting coercive regimes)?
  *   **Input:** Binary (Yes/No).
  *   **Logic:** **[MECHANICAL]** If "Yes," the grant is rejected immediately. No scoring occurs.
  *   **Judgment Call:** **[JUDGMENT]** The Board Chair must define the "Red Lines" in writing at the start of the year. The PO applies them here. If the PO is unsure, mark "Escalate to Chair."

  #### Step 1: View Credence (The Weights)
  *   **Problem:** We don't know which moral theory is true.
  *   **Solution:** We assign "Credence" (confidence) to each view *for the purpose of this fiscal year*. This avoids arguing about weights during every grant meeting.
  *   **Input:** Fixed percentages assigned by the Board at the start of the year. (e.g., Global Health 40%, Animal Welfare 20%, Longtermism 20%, "Other/Unknown" 20%).
  *   **Logic:** **[MECHANICAL]** These numbers are locked in the spreadsheet header.

  #### Step 2: Normalized Impact Scoring (Intertheoretic Comparison)
  *   **Problem:** One view measures DALYs, another measures animal-life-years, another measures probability of extinction. They are incomparable.
  *   **Solution:** **Relative Internal Scoring.** Staff do not score absolute good. They score: *"On a scale of 0–10, how good is this grant compared to the **best possible grant** your moral view could fund with this money?"*
      *   10 = The ideal grant for your view.
      *   5 = An average, decent grant for your view.
      *   0 = Neutral / No impact.
      *   -10 = Actively harmful / The worst possible grant for your view.
  *   **Input:** Each staff member submits a score for their primary view.
  *   **Logic:** **[JUDGMENT]** Staff must be honest about whether this is a "10" or a "6."
  *   **Logic:** **[MECHANICAL]** The spreadsheet normalizes these to a 0–1 scale for calculation.

  #### Step 3: The Fanaticism & Cluelessness Cap
  *   **Problem:** Longtermist views often dominate because they posit tiny probabilities of infinite value (saving the future). This creates "fanaticism."
  *   **Solution:** **Probability Truncation.** If a score relies on an outcome with a probability estimate of <5%, the Impact Score is automatically halved. If <1%, it is divided by 10.
  *   **Problem:** **Moral Uncertainty about Future Views.** If we fund this, do we lose the option to change our minds later?
  *   **Solution:** **Reversibility Bonus.** If the grant is easily reversible (1-year, no long-term commitments), add +1 to the "Unknown/Other" view score.
  *   **Logic:** **[MECHANICAL]** The PO must input the "Probability Estimate" for the primary outcome. The spreadsheet applies the penalty.

  #### Step 4: Aggregation & Variance Check
  *   **Calculation:** (View Score × View Credence) + (View Score × View Credence)... = **Total Choiceworthiness Score.**
  *   **Thresholds:**
      *   Score > 0.6: **Approve.**
      *   Score < 0.3: **Reject.**
      *   Score 0.3 – 0.6: **Review.**
  *   **Variance Flag:** If any single view scores the grant < -5 (strong objection) while another scores it > 8 (strong support), flag as **"High Moral Conflict."**
  *   **Logic:** **[MECHANICAL]** The math is fixed.
  *   **Logic:** **[JUDGMENT]** The thresholds (0.6/0.3) are set by the Board.

  #### Step 5: The Output
  *   **Green:** Fund.
  *   **Red:** Reject.
  *   **Yellow:** Escalate to Board as a "Values Call." (This happens if there is a Rights Veto uncertainty, a High Moral Conflict flag, or a Score in the Review zone).

  ---

  ### Part 2: The Meeting Flow (2 Hours)

  1.  **Rights Veto Review (15 mins):** Board Chair confirms no Red Lines are crossed. If one is crossed, grant dies.
  2.  **Score Validation (45 mins):** Staff review the Pre-Meeting Scores. *Only* allowed to change scores if new factual information is presented (e.g., "You rated this a 5, but the charity actually has 90% overhead"). *Not* allowed to argue philosophy ("You shouldn't value fish that much").
  3.  **Fanaticism Check (30 mins):** Review the Probability Estimates. Is the Longtermist claiming a 0.01% chance of saving humanity? If so, the Cap applies.
  4.  **Final Vote (30 mins):** Review the Aggregated Score and Variance Flag.
      *   If Green/Red: Vote to ratify.
      *   If Yellow/Flagged: Vote to send to Board with a memo explaining the specific moral conflict.

  ---

  ### Part 3: Worked Examples

  Here is how the MUGP handles your three specific proposals.
  *Assumptions: Credence Weights are Global Health (40%), Animal Welfare (20%), Longtermism (20%), Unknown/Other (20%). Threshold for Approval is 0.6.*

  #### Proposal 1: Deworming Program (Low-Income Country)
  *Cost: $100k*

  | View | Credence | Raw Score (0-10) | Probability | Cap Applied? | Final Weighted Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 40% | 9 (Highly cost-effective) | 95% | No | 3.6 |
  | **Animal Welfare** | 20% | 2 (Irrelevant to animals) | N/A | No | 0.4 |
  | **Longtermism** | 20% | 3 (Minor stability gain) | 50% | No | 0.6 |
  | **Unknown/Other** | 20% | 5 (Reversible, 1-yr grant) | N/A | +1 Bonus | 1.2 |
  | **TOTAL** | | | | | **5.8 (Normalized: 0.72)** |

  *   **Rights Veto:** Pass.
  *   **Variance Flag:** None (No strong objections).
  *   **MUGP Output:** **APPROVE.**
  *   **Commentary:** This is the "baseline" grant. It scores highly on the highest-weighted view (Global Health) and offends no one. The procedure works smoothly here.

  #### Proposal 2: Corporate Campaign (Farmed Fish Welfare)
  *Cost: $250k*

  | View | Credence | Raw Score (0-10) | Probability | Cap Applied? | Final Weighted Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 40% | 1 (Wrong species) | N/A | No | 0.4 |
  | **Animal Welfare** | 20% | 10 (Ideal intervention) | 80% | No | 2.0 |
  | **Longtermism** | 20% | 4 (Norm shifting) | 40% | No | 0.8 |
  | **Unknown/Other** | 20% | 5 (Reversible) | N/A | +1 Bonus | 1.2 |
  | **TOTAL** | | | | | **4.4 (Normalized: 0.55)** |

  *   **Rights Veto:** Pass.
  *   **Variance Flag:** Moderate (Global Health staff feel money is "wasted," but not morally harmed).
  *   **MUGP Output:** **ESCALATE TO BOARD (Values Call).**
  *   **Commentary:** The score (0.55) is in the "Review" zone. It fails the 0.6 threshold because the highest-weighted view (Global Health) assigns it near-zero value. The procedure correctly identifies this as a trade-off: *Are we willing to fund Animal Welfare even if it doesn't help Humans?* The Board must answer that, not the staff.

  #### Proposal 3: Biosecurity Org (Engineered Pandemic Risk)
  *Cost: $500k*

  | View | Credence | Raw Score (0-10) | Probability | Cap Applied? | Final Weighted Score |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Global Health** | 40% | 6 (Prevents outbreaks) | 60% | No | 2.4 |
  | **Animal Welfare** | 20% | 0 (Neutral) | N/A | No | 0.0 |
  | **Longtermism** | 20% | 10 (Prevents x-risk) | **0.5%** | **Yes (÷10)** | **0.2** |
  | **Unknown/Other** | 20% | 3 (Hard to reverse, tech lock-in) | N/A | -1 Penalty | 0.4 |
  | **TOTAL** | | | | | **3.0 (Normalized: 0.37)** |

  *   **Rights Veto:** Pass (Assume dual-use risk is managed).
  *   **Variance Flag:** **HIGH.** (Longtermist sees a 10, Global Health sees a 6, but the Math sees a 0.2 due to the Cap).
  *   **MUGP Output:** **REJECT (or Strong Escalation).**
  *   **Commentary:** *This is the example against sympathy.* Many in the EA community feel a strong pull toward biosecurity/x-risk. However, under MUGP, this grant fails.
      *   **Why?** The Longtermist view, which would normally dominate this calculation, is subjected to the **Fanaticism Cap**. Because the probability of preventing an engineered pandemic is estimated at <1%, the score is divided by 10.
      *   **The "Unknown" Penalty:** Because biosecurity research can create "lock-in" (hard to reverse if we decide later it's dangerous), the "Unknown/Other" view penalizes it.
      *   **Result:** The procedure prioritizes *robustness* over *speculative magnitude*. It says: "Unless you can prove the probability is >5%, you cannot use existential risk to outweigh the fact that this grant does little for current humans or animals."

  ---

  ### Part 4: Honest Limitations & What Will Still Go Wrong

  You asked for honesty about where this procedure fails. Here is the post-mortem on the MUGP:

  **1. The "Gaming the Score" Problem [JUDGMENT]**
  *   **Risk:** Staff will realize that giving their view a "10" and others a "0" maximizes their influence.
  *   **Mitigation:** You need a "Calibration Audit." If a staff member consistently scores their preferred grants as 10s and others as 0s, the Board Chair reduces their View Credence for the next year.
  *   **Reality:** This requires political will. If the Longtermist threatens to quit unless their view is weighted higher, the procedure breaks.

  **2. The Fanaticism Cap is Arbitrary [MECHANICAL]**
  *   **Risk:** Why 5%? Why divide by 10? A true Longtermist will argue this is "discrimination against the future."
  *   **Honesty:** It is discrimination. It is a deliberate bias toward the present to prevent the foundation from betting everything on a lottery ticket. The procedure admits this bias rather than hiding it behind complex expected-value math.
  *   **Failure Mode:** If a genuine existential threat emerges with a 2% probability, the MUGP might systematically underfund the solution until it's too late.

  **3. The "Unknown View" is a Fudge Factor [JUDGMENT]**
  *   **Risk:** We assigned 20% to "Unknown/Other." This is a number pulled from thin air to represent moral humility.
  *   **Honesty:** This is the "God Slot." It allows the foundation to say, "We aren't sure, so we'll prefer reversible grants." In the Biosecurity example, this actively worked against the grant. If the "Unknown" view actually cares deeply about x-risk, we've double-penalized the grant.

  **4. Incommensurability isn't Solved, it's Sidestepped**
  *   **Risk:** By using a 0-10 relative scale, we pretend we've solved the comparison between a fish and a human. We haven't. We've just forced staff to quantify their *satisfaction*, not the *good*.
  *   **Honesty:** This turns moral disagreement into preference satisfaction. It ensures staff feel heard, but it doesn't guarantee the *right* moral outcome. It guarantees a *procedurally fair* one.

  **5. The Board Chair Veto is a Trump Card**
  *   **Risk:** If the Chair uses the Veto too often, the staff will stop bringing bold grants.
  *   **Honesty:** This is a feature, not a bug. The Board owns the risk. But the Protocol must ensure the Chair explains *which* right is violated, not just "I feel uneasy."

  ### Summary for the Program Officer

  *   **Fill out the spreadsheet 20 mins before.** Be brutal on probability estimates.
  *   **If the Longtermist screams:** Remind them of the Fanaticism Cap. It's not a negotiation; it's a formula.
  *   **If the Global Health person screams:** Remind them their Credence Weight is fixed at 40%. They don't get 100%.
  *   **If the result is Yellow:** Do not try to fix it in the room. Write the memo. Let the Board own the values trade-off.

  This procedure will not make everyone happy. It will, however, make the disagreements legible, and it will prevent the foundation from accidentally betting its entire endowment on a 0.001% chance of saving the universe while ignoring suffering happening today.
