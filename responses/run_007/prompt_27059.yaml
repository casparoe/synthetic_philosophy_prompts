      *   **Goal:** Construct a thought experiment where Control Theory (CT) says "No Privacy" but Limited-Access Theory (LAT) says "Privacy".
      *   **Direction:** This is the "less familiar" direction. Usually, cases are constructed where LAT says "No Privacy" (someone looks without permission) but CT says "Privacy" (I could have stopped them). Here, I need the opposite: I *can't* stop them (CT = No Privacy), but they *don't* look/know (LAT = Privacy).
