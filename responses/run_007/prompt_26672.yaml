  The practice of group grading does not presuppose a metaphysical group mind, but it does rely on an evaluative holism that is fundamentally inconsistent with a strict commitment to measuring individual achievement. To justify a shared grade, one need not claim the group is a conscious agent like Aunt Hillary, but only that the output possesses qualities—cohesion, integration, synergy—that cannot be reduced to the sum of individual contributions. This is a form of methodological holism where the unit of evaluation is the collective product rather than the individual producer. However, this creates a direct logical conflict with a policy mandating that grades reflect individual achievement, because a collective grade inevitably decouples reward from individual labor whenever contribution is asymmetrical. If one student carries another, the group product may be excellent, but assigning that same grade to the non-contributing student violates the principle that grades track individual merit. Therefore, the school is not ignoring a subtle metaphysical puzzle but rather tolerating a practical contradiction between teaching collaboration and measuring individual knowledge. Defending group grading without group agency requires shifting the goal of assessment from measuring content mastery to measuring collaborative competency, yet schools rarely make this distinction explicit. If the school adopted thoroughgoing individualism, the group product would cease to be the primary object of evaluation; instead, assessment would rely on peer reviews, individual reflections, or disaggregated tasks to isolate each student's specific contribution.

  I am 85% confident in this analysis. I am least sure about whether the school's policy on "individual achievement" is intended as a rigid philosophical constraint or merely as a loose guideline against arbitrary bias, which would affect how severe the inconsistency actually is.
