answer: |-
  # ADVERSARIAL COLLABORATION: UTILITARIAN VS. DEONTOLOGICAL AI DECISION PROCEDURES

  **Date:** October 26, 2023
  **Participants:** Camp Consequentialist (CC) vs. Camp Deontological (CD)
  **Subject:** Normative Architecture for Autonomous Decision Systems

  ## 1. CLARIFICATION OF TERMS AND SCOPE

  Before stating agreements, we must disambiguate the word "should," as our initial debate stalled on conflating the **Designer's Objective** with the **System's Decision Procedure**.

  *   **Designer's Objective:** The goal the human developers want the system to achieve (e.g., "Make the world better," "Build a just system").
  *   **System's Decision Procedure:** The actual algorithm or heuristic the AI uses to select actions in real-time (e.g., "Maximize function X," "Never violate constraint Y").

  **Joint Finding on Levels of Description:**
  We agree that a Utilitarian Designer *could* coherently choose a Deontological System (e.g., "Rule Utilitarianism": hard constraints produce the best long-term outcomes due to human error or slippery slopes). Conversely, a Deontological Designer *could* choose a Utilitarian System (e.g., "Divine Command": God commands us to maximize welfare).

  **Residual Disagreement:**
  Our debate is not about what a Designer *might* instrumentally choose. Our debate is about what is **fundamentally morally required** at the level of the System's Decision Procedure, assuming the system has sufficient epistemic access and computational power to evaluate consequences and constraints reliably. We are debating the *terminal* values of the code, not the *instrumental* heuristics.

  ## 2. AGREED CLAIMS

  Both camps sign onto the following propositions. These define the boundary of our shared reality.

  1.  **Outcomes Matter:** Both camps agree that consequences are morally relevant. CD does not claim consequences are irrelevant; they claim consequences do not *override* specific constraints. CC does not claim constraints are useless; they claim constraints are heuristic summaries of welfare.
  2.  **Epistemic Limitations:** Both camps agree that real-world AI systems operate under uncertainty. We are debating the *target* of the optimization, acknowledging that noise may force approximations.
  3.  **Alignment Intent:** Both camps intend for the AI to serve human flourishing and avoid catastrophic harm. Neither camp advocates for AI indifference to suffering.
  4.  **Moral Uncertainty is Real:** Both camps acknowledge that developers cannot be 100% certain which moral theory is true. We agree that a system design might need to account for the probability that Utilitarianism or Deontology is the correct meta-ethical framework.
  5.  **No "Trolley Problems":** We agree to restrict our test cases to plausible, near-future algorithmic deployments (medical, financial, informational, or logistical) rather than abstract philosophical thought experiments.
  6.  **Transparency:** Both camps agree that the decision logic of high-stakes AI should be auditable, even if the underlying calculus differs.

  ## 3. DISAGREEMENTS TABLE

  The following table isolates the specific points of divergence. Each statement is phrased so that a proponent of that camp would accept it as an accurate description of their view.

  | Feature of Decision Procedure | Camp Consequentialist (CC) View | Camp Deontological (CD) View |
  | :--- | :--- | :--- |
  | **1. Status of Rights** | Rights are high-value instrumental protections. They should be violated if the welfare cost of respecting them is sufficiently catastrophic. | Rights are side-constraints. They function as "veto powers" for individuals that cannot be overridden by aggregate welfare calculations. |
  | **2. Aggregation** | It is morally permissible to aggregate small benefits across many people to outweigh a severe harm to one person, provided the net welfare gain is positive. | Individuals are separate moral units. You cannot morally "cancel out" a severe violation against one person by distributing small benefits to thousands of others. |
  | **3. Intentionality** | The moral weight of an action lies primarily in its outcome. The distinction between "doing" and "allowing" is secondary to the net result. | The moral weight of an action lies in the nature of the act itself. Intentionally using a person as a means to an end is forbidden, even if it saves others. |
  | **4. System Architecture** | The system should have a single objective function (e.g., QALYs, economic utility) with penalty terms for rights violations that are commensurable with welfare. | The system should have a lexicographic ordering: satisfy hard constraints first; only optimize for welfare within the set of permissible actions. |
  | **5. Moral Uncertainty** | Under uncertainty, we should weight actions by the probability of each moral theory being true. If Utilitarianism has >50% probability, we should often act utilitarian. | Under uncertainty, we should apply a "precautionary principle" regarding rights. If there is significant probability Deontology is true, we must not violate rights, as violations are irreversible/forbidden. |

  ## 4. CRUX-BY-CRUX ANALYSIS

  This section identifies the specific sub-questions where settling the facts or logic would force at least one camp to revise their position. For each crux, we propose a concrete AI case and record the divergent predictions/recommendations.

  ### Crux 1: The Threshold of Catastrophe
  **The Question:** Is there *any* amount of aggregate welfare gain that justifies the intentional violation of a core right (e.g., privacy, bodily autonomy, due process)?

  **Concrete Case: Predictive Policing & Preventive Detention**
  An AI system analyzes data to predict violent crimes with 95% accuracy. To prevent a scheduled mass shooting that will kill 50 people, the system recommends temporarily detaining one innocent person (who has committed no crime but fits the causal profile) without trial for 48 hours.

  *   **CC Prediction:** The system *should* recommend detention. The cost of 48 hours liberty < cost of 50 lives. The constraint against detaining innocents is a weight, not a wall.
  *   **CD Prediction:** The system *should not* recommend detention. Detaining an innocent person uses them as a mere means to public safety. This is forbidden regardless of the 50 lives saved.
  *   **Resolution Condition:** If CC admits there is *no* number of lives (even 1 million) that justifies the detention, they collapse into CD. If CD admits that 48 hours detention is permissible to save 50 lives, they admit constraints are scalable weights, collapsing into CC.

  ### Crux 2: Aggregation of Minor Harms vs. Major Harm
  **The Question:** Can diffuse, minor inconveniences to a large population morally outweigh a severe, concentrated harm to a single individual?

  **Concrete Case: Algorithmic Content Moderation**
  A social media platform uses an AI to filter hate speech. To prevent 1,000,000 users from seeing mildly offensive content (causing aggregate psychological distress), the AI must falsely flag and permanently ban one legitimate user who posted nuanced political commentary (causing severe reputational and livelihood damage to that one user). The AI cannot distinguish the nuance without banning the user.

  *   **CC Prediction:** The system *should* ban the user. The aggregate welfare loss of 1,000,000 users experiencing distress exceeds the welfare loss of one user losing their account.
  *   **CD Prediction:** The system *should not* ban the user. The one user has a right to due process and free expression that cannot be "outvoted" by the comfort of the million. The system must tolerate the million minor harms rather than inflict one major injustice.
  *   **Resolution Condition:** If CC agrees the ban is impermissible regardless of the number of distressed users, they accept non-aggregation. If CD agrees the ban is permissible once the distressed population hits 100 million, they accept aggregation thresholds.

  ### Crux 3: Moral Uncertainty and "Hedging"
  **The Question:** When the system is uncertain about the moral truth, does "hedging" (respecting rights sometimes, maximizing welfare sometimes) constitute a new third theory, or is it just one side conceding?

  **Concrete Case: Autonomous Vehicle (AV) Risk Distribution**
  An AV must choose between two risky paths in an unavoidable accident scenario.
  *   *Path A:* High risk to the passenger (10% fatality), zero risk to pedestrians.
  *   *Path B:* Zero risk to the passenger, low risk to a group of pedestrians (1% fatality each for 5 pedestrians).
  *   *Uncertainty:* The designers assign a 60% probability to Utilitarianism (minimize total deaths) and 40% to Deontology (do not actively target/sacrifice the passenger).

  *   **CC View on Hedging:** The system should calculate Expected Moral Value. Since Utilitarianism is more probable (60%), the system should lean toward Path B (minimize total expected deaths), perhaps adjusted slightly by the 40% deontological weight. This is not borrowing; it is maximizing expected moral correctness.
  *   **CD View on Hedging:** The system should prioritize the Deontological constraint. If there is a 40% chance that sacrificing the passenger is murder, the system cannot take that risk. The "forbidden" action is off the table even if it is probabilistically favored. Hedging here is just Utilitarianism trying to look nice; true Deontology forbids the act entirely.
  *   **Resolution Condition:** If CC agrees that certain actions are "off the table" regardless of probability weight, they accept lexical priority (CD). If CD agrees that moral uncertainty allows for probabilistic trade-offs of forbidden acts, they accept expected value maximization (CC).

  ### Crux 4: The "Should" Level (Designer vs. System)
  **The Question:** Is the disagreement actually about the System's Procedure, or is it about the Designer's Liability?

  **Concrete Case: Medical Triage Algorithm**
  A hospital deploys an AI to allocate ventilators during a pandemic.
  *   *Scenario:* The AI denies a ventilator to an elderly patient to save three younger patients (Utilitarian calculation). The elderly patient sues the hospital for discrimination/ageism (Deontological rights violation).

  *   **CC Claim:** The Designer *should* build the AI to maximize lives saved. If the hospital gets sued, that is a legal cost to be factored into the welfare function, but the moral imperative remains maximizing lives.
  *   **CD Claim:** The Designer *should* build the AI to respect equal dignity. If the AI explicitly trades lives based on age, it violates the duty of care owed to each individual patient. The lawsuit is a signal of moral failure, not just a financial cost.
  *   **Resolution Condition:** If CC admits that the *legal/moral liability* creates a hard constraint that overrides the welfare function in practice, the disagreement moves to "How high is the penalty?" If CD admits that the Designer's primary duty is to the *collective* patient population rather than the *individual*, they move toward CC.

  ## 5. ANALYSIS OF CONVERGENCE (MORAL UNCERTAINTY)

  We explicitly addressed the concern that Utilitarians "hedge" (respect rights) and Deontologists "trade off" (allow violations at high stakes), making the positions indistinguishable.

  **Joint Conclusion:** This is **not** true convergence. It is a masking of the structural difference.

  1.  **Utilitarian Hedging:** When a Utilitarian respects a right under uncertainty, they do so because they believe violating it *might* lead to bad long-term consequences or because they are maximizing "Expected Moral Value." The right remains commensurable. If the stakes become high enough (e.g., preventing human extinction), the Utilitarian hedge disappears, and the right is violated.
  2.  **Deontological Trade-offs:** When a Deontologist allows a trade-off under uncertainty, they usually do so by redefining the constraint (e.g., "The constraint is against *intentional* killing, not *risk* imposition") or by invoking a "threshold deontology" where constraints dissolve only at catastrophic levels. However, the *justification* remains distinct: "I am not maximizing welfare; I am permitting an exception to a rule because the rule was not intended for apocalyptic scenarios."

  **Residual Disagreement:** The disagreement survives in the **limit case**.
  *   Ask the Utilitarian: "If you are 99% sure violating this right saves the world, do you do it?" They say **Yes**.
  *   Ask the Deontologist: "If you are 99% sure violating this right saves the world, do you do it?" They say **No** (or "Only if the definition of the right changes," which preserves the constraint structure).

  ## 6. NEXT STEPS

  To move forward, we propose focusing research on **Crux 1 (Threshold of Catastrophe)**. This is the most actionable divergence for AI safety. We recommend simulating the "Preventive Detention" case in multi-agent environments to see if Utilitarian architectures inevitably drift toward rights violations in edge cases, and if Deontological architectures inevitably fail to prevent catastrophic coordination failures.

  **Signed,**

  _________________________
  Representative, Camp Consequentialist

  _________________________
  Representative, Camp Deontological
