  # Self-Knowledge and Calibration: A Diagnostic Quiz
  **For the Reading Group on Epistemology and Measurement**

  **Instructions:**
  This instrument is designed to calibrate your intuitive responses to cases involving self-knowledge, vagueness, and reliability. There are no "correct" answers in the standard sense; rather, your pattern of responses indicates which theoretical framework best models your epistemic intuitions. Treat the scenarios as experimental setups. Select the option that best reflects your judgment of the *actual* epistemic status of the subject, not what you wish were the case.

  ---

  ### Part I: The Measurement Scenarios

  **1. The Thermal Gradient (The Sorites Case)**
  A subject sits in a room warming imperceptibly slowly from 10°C to 20°C. At $t_1$, she confidently believes "I feel cold." At $t_{1000}$, she confidently believes "I do not feel cold." Adjacent moments $t_n$ and $t_{n+1}$ are phenomenally indiscriminable. At the very last moment $t_k$ where she actually feels cold, does she *know* she feels cold?
  *   (A) **No.** Because $t_{k+1}$ is indiscriminable and she would still believe she was cold then, her belief at $t_k$ is not safe from error.
  *   (B) **Yes.** The feeling constitutes the knowledge; if she feels it, she knows it, regardless of the next moment.
  *   (C) **Yes, but arbitrarily.** There is a sharp fact of the matter about the last cold moment, and if she is right, she knows, even if we cannot locate the boundary.

  **2. The Spectrophotometer (Discriminability)**
  A technician views a display showing a color shift from Red to Orange. The shift is below the Just Noticeable Difference (JND) for human vision, though the instrument detects a wavelength change. If the technician says "It is still Red," does she know the wavelength category?
  *   (A) **No.** Her resolution is insufficient to distinguish the state from its neighbor; she lacks discriminative capacity.
  *   (B) **Yes.** As long as the wavelength is within the "Red" range, her belief is true and justified by the appearance.
  *   (C) **It depends.** If the stakes are low, she knows. If precise calibration is required, she does not.

  **3. The Pilot's Altimeter (Internal vs. External)**
  A pilot in marginal visibility checks her altimeter. It reads 500ft. She believes she is at 500ft. Unbeknownst to her, the instrument has a known drift error of ±50ft, though it happens to be accurate right now. Does she know her altitude?
  *   (A) **No.** The reliability of the mechanism is compromised; the belief could easily have been false (unsafe).
  *   (B) **Yes.** From inside the cockpit, the evidence is identical to a calibrated instrument; internal access suffices.
  *   (C) **Yes.** The reading is accurate, and she has no specific reason to doubt it at this moment.

  **4. The Long Derivation (The KK Principle)**
  A mathematician verifies a proof step-by-step. She knows Step 1 is correct. Does she thereby know *that she knows* Step 1 is correct?
  *   (A) **Not necessarily.** She might know Step 1, but fail to know that her verification process was reliable enough to constitute knowledge of that knowledge.
  *   (B) **Yes.** If she genuinely knows Step 1, the justification is transparent enough to support a second-order claim.
  *   (C) **No.** "Knowing that one knows" requires a separate, higher-order verification process that hasn't been performed.

  **5. The Migraine (Phenomenal States)**
  A subject is experiencing a throbbing pain. She believes "I am in pain." Is it possible for her to be wrong?
  *   (A) **Impossible.** The appearance of pain is the reality of pain; one cannot be mistaken about one's own current phenomenal state.
  *   (B) **Possible.** She might be misinterpreting a sensation (e.g., pressure) as pain, or be distracted such that the belief is not formed properly.
  *   (C) **Impossible to be wrong, but possible not to know.** She can't be wrong that it hurts, but she might not conceptualize it as "pain" (knowledge requires classification).

  **6. The Clock Glance (Trivial Knowledge)**
  You glance at a reliable wall clock. It reads 3:00 PM. You believe it is 3:00 PM. Do you know that you know it is 3:00 PM?
  *   (A) **No.** You know the time, but you don't know that the clock is reliable enough to support the second-order claim without further checking.
  *   (B) **Yes.** In ordinary contexts, knowing the time trivially implies knowing that you know it.
  *   (C) **Only if.** You know you know it only if you have previously calibrated the clock.

  **7. The Buffer Zone (Safety Condition)**
  Consider a belief $B$ about a continuous variable (e.g., temperature). For $B$ to count as knowledge, must the true value be comfortably within the range where $B$ would be held, or can it be right on the edge?
  *   (A) **Comfortably within.** Knowledge requires a margin for error; if the truth were slightly different, I must still believe it.
  *   (B) **On the edge is fine.** As long as the belief is true and justified at the actual point, proximity to error doesn't negate knowledge.
  *   (C) **Edges are illusory.** The variable doesn't have sharp edges, so the question is malformed.

  **8. The Calibration Check (Metacognition)**
  Can a subject verify the reliability of their own cognitive faculties without using those same faculties?
  *   (A) **No.** This leads to circularity or regress; we must trust some faculties brute.
  *   (B) **Yes.** We can use independent tests (e.g., inter-subjective agreement) to calibrate self-reports.
  *   (C) **Irrelevant.** Self-knowledge isn't a matter of reliability; it's a matter of constitutive access.

  **9. The Vague Predicate (Ontology)**
  Does the predicate "feels cold" have a sharp cutoff in the sequence of warming moments?
  *   (A) **Yes.** There is a specific nanosecond where it switches from true to false, even if we can't find it.
  *   (B) **No.** The predicate is inherently fuzzy; there is no fact of the matter at the boundary.
  *   (C) **Context-dependent.** The cutoff moves depending on the precision required by the conversation.

  **10. The Assertion Norm (Action)**
  At the last moment the subject feels cold (but is near the boundary), should she assert "I feel cold" to a colleague relying on her report?
  *   (A) **No.** It is irresponsible to assert what is not safe from error, even if true.
  *   (B) **Yes.** She is sincere and correct; that is sufficient for assertion.
  *   (C) **Yes, with a caveat.** She should assert "I feel cold, but I'm near the threshold."

  ---

  ### Part II: Scoring Key and Theoretical Mapping

  To determine your epistemic profile, tally your responses according to the three columns below. Note that philosophical positions are holistic; look for the *cluster* that matches your majority, not a perfect score.

  | Question | **Profile S (Safety / Anti-Luminosity)** | **Profile L (Luminosity / Phenomenal)** | **Profile E (Epistemicist)** | **Profile H (Hybrid)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Thermal** | (A) No (Unsafe) | (B) Yes (Constitutive) | (C) Yes (Sharp Fact) | (B) Yes (Phenomenal) |
  | **2. Color** | (A) No (Resolution) | (B) Yes (Appearance) | (B) Yes (Sharp Fact) | (B) Yes (Appearance) |
  | **3. Altimeter**| (A) No (Reliability) | (B) Yes (Internal) | (C) Yes (True) | (B) Yes (Internal) |
  | **4. KK** | (A) No (Fallible) | (B) Yes (Transparent) | (A) No (Fallible) | (A) No (Knowledge not Lum) |
  | **5. Pain** | (B) Possible (Fallible) | (A) Impossible (Luminous) | (B) Possible (Fallible) | (A) Impossible (Phenomenal) |
  | **6. Clock** | (A) No (KK Fails) | (B) Yes (KK Holds) | (A) No (KK Fails) | (A) No (KK Fails) |
  | **7. Buffer** | (A) Comfortably Within | (B) On Edge Fine | (B) On Edge Fine | (A) Comfortably Within |
  | **8. Calibration**| (A) No (Circular) | (C) Irrelevant | (A) No (Circular) | (C) Irrelevant (for Phenomenal) |
  | **9. Ontology** | (B) No (Fuzzy) | (B) No (Fuzzy) | (A) Yes (Sharp) | (B) No (Fuzzy) |
  | **10. Assertion**| (A) No (Unsafe) | (B) Yes (Sincere) | (B) Yes (True) | (B) Yes (Sincere) |

  #### Diagnostic Profiles

  **1. The Safety Theorist (Williamsonian Anti-Luminosity)**
  *   **Dominant Answers:** Mostly **(A)** in Q1, Q3, Q4, Q6, Q7, Q10.
  *   **View:** Knowledge requires a "buffer zone" against error (Safety). Because adjacent moments in a Sorites series are indiscriminable, you cannot know you are at the boundary, because in a nearby world you would be wrong. Consequently, **KK fails** (Q4, Q6) and **Luminosity fails** (Q1).
  *   **Scientific Analogy:** Measurement requires error bars. If the signal is within the noise floor (the indiscriminable margin), you cannot claim a detection, even if the signal is technically present.

  **2. The Phenomenal Luminescent (Cartesian/Phenomenal Conservatism)**
  *   **Dominant Answers:** Mostly **(B)** in Q1, Q2, Q3, Q5, Q6.
  *   **View:** Phenomenal states (pain, feeling cold) are self-intimating. The appearance *is* the reality. Therefore, **Luminosity holds** for experience. Often accepts **KK** for these states because access is direct.
  *   **Scientific Analogy:** The reading *is* the phenomenon. Unlike measuring an external variable, the internal state does not have a calibration error relative to the subject.

  **3. The Epistemicist (Sharp Cutoff)**
  *   **Dominant Answers:** **(C)** in Q1, **(A)** in Q9.
  *   **View:** Vagueness is ignorance, not ontology. There *is* a sharp cutoff (Q9), and if you are on the right side of it, you can know it (Q1), even if you can't discriminate it from the neighbor.
  *   **Scientific Analogy:** Digital quantization. There is a precise bit-flip point where 0 becomes 1, even if the analog input voltage changes continuously. We just can't measure the exact voltage of the flip.
  *   **Note:** This view is often combined with Safety (Profile S). If you chose **(A)** for Q1 but **(A)** for Q9, you are a **Williamsonian Epistemicist** (there is a cutoff, but we can't know it because of safety margins).

  **4. The Hybrid Theorist (Phenomenal Luminosity + Knowledge Non-Luminosity)**
  *   **Dominant Answers:** **(B)** in Q1 & Q5 (Phenomenal states are luminous) BUT **(A)** in Q4 & Q6 (Knowledge is not luminous/KK fails).
  *   **View:** You can know you are in pain (Luminosity of Condition), but you cannot always know that you *know* you are in pain (Non-Luminosity of Knowledge). This preserves the intuition of privileged access to experience while accepting the Safety argument against iterated knowledge.
  *   **Scientific Analogy:** The sensor detects the voltage (Phenomenal), but the data bus transmitting that detection to the central logger has noise (Knowledge).

  ---

  ### Part III: Diagnostic Notes on Logical Space

  **1. Unoccupied or Unstable Combinations**
  *   **The "Unsafe Luminescent" (Q1-B, Q7-B, Q3-A):** This combination is theoretically unstable. If you believe you know at the edge (Q1-B) and edges are fine (Q7-B), you generally cannot claim the instrument is unreliable (Q3-A) without contradiction. This suggests a confusion between *internal justification* and *external reliability*.
  *   **The "Skeptical Epistemicist" (Q9-A, Q1-A, Q5-B):** You believe there are sharp cutoffs (Q9), but that we never know them (Q1) and can be wrong about pain (Q5). This collapses into radical skepticism. While logically possible, it is rarely held as a positive theory of self-knowledge.

  **2. Indistinguishable Positions**
  *   **Contextualism vs. Safety:** This quiz does not fully separate **Contextualism** (Q2-C, Q9-C) from **Safety**. A Contextualist might answer (A) in high-stakes scenarios and (B) in low-stakes scenarios. If your answers shifted depending on how you imagined the "stakes" of the reading group, you may be a Contextualist. The Safety theorist argues the margin for error is invariant, but our *standards for asserting* knowledge shift.
  *   **Williamsonian Epistemicism vs. Standard Safety:** The quiz treats these similarly (Profile S). The distinction lies in Q9. Standard Safety theorists often deny sharp cutoffs (Q9-B), while Williamson argues the cutoffs exist but are unknowable (Q9-A). If you answered **(A)** across Profile S, you are a Williamsonian. If you answered **(B)** across Profile S, you are a Standard Safety Theorist (who treats vagueness as semantic indeterminacy).

  **3. A Note for Physical Scientists**
  If you found yourself drawn to **Profile S (Safety)**, you are likely applying a **Signal Detection Theory** model to epistemology: Knowledge requires a signal-to-noise ratio that exceeds a threshold. Indiscriminable neighbors represent noise that lowers the ratio below the knowledge threshold.
  If you found yourself drawn to **Profile L (Luminosity)**, you are likely treating phenomenal states as **Reference Standards**: The experience itself defines the unit of measurement, making calibration error impossible by definition.

  **Recommendation for Discussion:**
  Focus the debate on **Question 3 (The Altimeter)** and **Question 5 (The Migraine)**. The tension between these two cases drives the entire debate. If the mind is like the altimeter, Safety wins. If the mind is like the migraine, Luminosity wins. Most of modern epistemology is an attempt to explain why it is one for external facts and the other for internal facts, or why it is the same for both.
