answer: |-
  - **The positions**

  There are three primary camps, though boundaries blur. First, the **Illusionists** (Dennett, Keith Frankish). They argue the Cartesian Theater is a coherent mistake. There is no "what it is like" beyond functional reporting capacities. Qualia, as intrinsic, private properties, do not exist; they are "judgments" the brain makes about itself. Dennett's Multiple Drafts model suggests consciousness is a distributed narrative process without a final edit.

  Second, the **Qualia Realists** (Ned Block, David Chalmers, John Searle). They argue Dennett explains *access* to information but eliminates *phenomenal consciousness* itself. Block distinguishes A-consciousness (access) from P-consciousness (phenomenal). They insist the "redness of red" is a datum that any theory must accommodate, not explain away. For them, Dennett commits a "phenomenal concept mistake," denying the very thing that needs explaining.

  Third, the **Embodied/Enactive Critics** (Evan Thompson, Francisco Varela). They reject the computational representationalism shared by both Dennett and Realists. They argue the debate assumes consciousness is internal information processing waiting to be presented. Instead, consciousness is enacted through sensorimotor coupling with the environment. For this camp, both Dennett and the Realists are stuck in the same internalist framework, merely arguing over the furniture of a room that doesn't exist.

  - **What the debate looks like it's about vs. what it's really about**

  On the surface, this debate appears to be a dispute over cognitive architecture. The question seems to be: *Is there a specific neural locus or temporal moment where unconscious processing becomes conscious?* Dennett says no (distributed, asynchronous); Realists often imply yes (a threshold where qualia emerge). The arguments frequently utilize thought experiments involving timing (e.g., the color phi phenomenon) to prove whether there is a "finish line" for experience.

  However, the deeper conflict is metaphysical and methodological, not architectural. It is really about **authority over the data**. Dennett's heterophenomenology treats first-person reports as text to be interpreted by third-person science. If science says the experience is impossible, the report is revised. Realists treat first-person reports as incorrigible data; if science contradicts the experience, science is incomplete. This is a clash over whether the subjective perspective has veto power over objective theory.

  Furthermore, the debate is about the **criteria for existence**. Dennett operates with a strict physicalist ontology: if something doesn't have causal powers distinct from its physical substrate, it isn't real. Realists operate with a phenomenological ontology: if it appears in experience, it is real data requiring explanation. Consequently, they talk past each other. Dennett says, "I've explained the functions you care about." Realists reply, "You've explained everything except the consciousness." The stalemate persists because they disagree on what "consciousness" refers to before the explanation begins. It is not a puzzle to be solved but a tension between two incompatible frameworks for validating reality.

  - **What kind of disagreement each strand is**

  The first strand is a **verbal/semantic dispute**. When Realists say "qualia exist," they refer to intrinsic, non-representational properties. When Dennett says "qualia don't exist," he refers to intrinsic, non-representational properties. They agree on the definition but disagree on the instantiation. However, it often slips into talking past each other: Realists accuse Dennett of redefining consciousness as mere function, while Dennett accuses Realists of reifying judgments into properties. This strand is resolvable only by stipulating precise terminology, though doing so rarely satisfies the underlying intuition.

  The second strand is a **methodological disagreement** about data status. This is not verbal; it is a clash of epistemic norms. Is introspection a window into reality or a behavior to be causalized? Dennett treats introspection as fallible behavior; Realists treat it as the primary evidence. This is unresolvable without agreeing on a meta-methodology, which neither side accepts because it would concede the core point.

  The third strand is a **metaphysical disagreement** about physicalism. This is a substantive clash of intuitions. Can functional organization exhaust phenomenal character? Realists say no (zombie arguments); Dennett says yes. This is not empirical because both sides accept the same neuroscience but interpret its sufficiency differently. It is a clash of starting intuitions: the intuition of transparency (experience is just function) versus the intuition of excess (experience is more than function). Unless one side's intuition is undermined by a paradigm shift, this strand remains a brute disagreement.

  - **What would count as progress**

  Given the diagnosis, empirical experiments alone cannot resolve the metaphysical strand. Finding the neural correlate of consciousness (NCC) tells us where function happens, not whether qualia are intrinsic. Progress requires **conceptual dissolution** rather than solution. We must stop treating "consciousness" as a single natural kind. If we decompose consciousness into specific capacities (attention, memory, self-reporting, sensory integration), Dennett's model explains most of them. The residual "phenomenal feel" can then be isolated as a specific philosophical problem, not a scientific blocker.

  Progress would also look like a **methodological truce**. Adopting a pluralistic framework where first-person data is treated as constrained evidence—not incorrigible truth, but not mere behavior—could bridge the gap. This is attempted in neurophenomenology, but it lacks traction.

  Honestly, some strands are likely unresolvable. The metaphysical gap (why physical processing feels like anything) may be a brute fact or a cognitive limit. If the disagreement is rooted in fundamental intuitions about existence, no argument will compel a change of mind. The most productive move is to abandon the quest for a unified theory of "consciousness" and pursue specific mechanisms of reporting and regulation, accepting that the "hard problem" may be a pseudo-problem generated by language, or a permanent mystery.

  - **Confidence and caveats**

  My diagnosis assumes the debate is primarily philosophical, but I may be underweighting recent empirical shifts. Global Neuronal Workspace Theory (GNW) and Integrated Information Theory (IIT) are attempting to adjudicate these claims empirically. If IIT proves correct, it suggests consciousness is intrinsic to structure, favoring Realists. If GNW wins, it favors a functionalist view closer to Dennett. I am less confident that empirical data won't shift the metaphysical intuitions here.

  Additionally, your framing is sharp, but the terminology has evolved. "Cartesian Theater" is now often subsumed under the "Hard Problem" vs. "Illusionism" debate. A specialist might argue the Multiple Drafts model is less central now than Dennett's Illusionism. Finally, I may be too dismissive of the Enactivist camp; they argue the entire debate is misguided, which could be the most accurate diagnosis of all, though it remains a minority view.
