answer: |-
  You are asking one of the classic, most important questions in the philosophy of science. You aren't missing something obvious, and your professor is likely not being inconsistent. Rather, you are bumping up against a distinction that trips up almost everyone when they first encounter it: the difference between **ontological reductionism** and **explanatory (or eliminative) reductionism.**

  Here is how you can be a reductionist without thinking chemistry is a "useful fiction."

  ### 1. Two Types of Reductionism
  The confusion usually stems from using the word "reductionism" to mean two different things at once.

  *   **Ontological Reductionism:** This is the claim about what *exists*. It says that ultimately, everything in the universe is made of physical stuff (particles, fields, etc.). There is no "chemical soul" or "magic vital force" in addition to the physics. **Your professor accepts this.** When they say "chemical facts are fixed by physical facts," they are endorsing ontological reductionism (often called *supervenience*).
  *   **Explanatory (or Eliminative) Reductionism:** This is the claim about how we *explain* things. It says that because chemistry is just physics, we should eventually replace chemical terms (like "bond," "acid," "valence") with physical terms (like "wave function," "electromagnetic force"), and that chemical explanations are inferior or false. **Your professor is rejecting this.**

  You can consistently hold that **chemistry is physically grounded** (ontological reductionism) while also believing that **chemical explanations are indispensable and real** (anti-eliminativism).

  ### 2. The "Pixel" Analogy
  Imagine a digital image on your screen.
  *   **Ontologically:** The image is *nothing but* a grid of red, green, and blue pixels. If you change the pixels, you change the image. The image is "fixed by" the pixels.
  *   **Explanatorily:** If I ask, "Why does this image look like a smiley face?" is it a good answer to say, "Because pixel 4,521 is hex code #FFFF00"?

  Technically, yes. But it misses the **pattern**. The "smiley face" is a real feature of the world, even though it is made of pixels. If you tried to explain the image *only* using pixel coordinates, you would lose the actual object of study (the face).

  Your professor is arguing that chemical properties (like acidity) are like the smiley face. They are real patterns constituted by physics, but they are not *eliminated* by physics.

  ### 3. "Real Patterns" vs. "Useful Fictions"
  You wrote: *"Chemical explanations are just approximations... They're not getting at anything real about the world."*

  This is the crux of the disagreement. Many philosophers (like Daniel Dennett or Jaegwon Kim, though they differ on specifics) argue that higher-level sciences track **stable patterns** that exist regardless of the microscopic details.

  Consider water boiling.
  *   **Physics description:** Describes the mean kinetic energy of $H_2O$ molecules overcoming intermolecular forces.
  *   **Chemistry description:** Describes a phase transition at 100°C at 1 atm.

  If you say the chemistry is just a "fiction," you imply that "boiling" isn't real. But "boiling" captures a **causal power**. Water boils at 100°C whether the quantum state of every electron is slightly different or not. The chemical property is **robust**. It remains stable across many different underlying physical micro-states.

  Because chemical properties are stable and have causal power (acid burns skin *because* it is an acid), they are discovering **real things**, not just approximating physics.

  ### 4. Why We Can't Just "Replace" Chemistry
  If reductionism were eliminative, we would expect physics to eventually make chemistry obsolete. But that hasn't happened, and many philosophers argue it *can't* happen, for two reasons:

  1.  **Complexity/Computational Intractability:** Even if we *could* derive chemistry from physics in principle, the equations are too hard to solve. But this isn't just about human ignorance. It's about the fact that the physical description is often the *wrong level of abstraction* to understand the phenomenon.
  2.  **Multiple Realizability:** A chemical kind (like "gold") might be defined by its atomic number (79 protons). But functional chemical properties (like "catalyst") can be realized by many different physical structures. Physics cares about the specific structure; chemistry cares about the function. If you reduce chemistry to physics, you lose the ability to group things that act the same way but are physically distinct.

  ### 5. So, what is your professor's position?
  Your professor is likely advocating for **Non-Eliminative Reductionism** (sometimes called *Explanatory Pluralism*).

  The position looks like this:
  1.  **Yes,** the world is physically closed (no magic).
  2.  **Yes,** chemical facts depend on physical facts.
  3.  **BUT,** chemical explanations capture causal relationships and patterns that physical explanations obscure or miss entirely.
  4.  **THEREFORE,** chemistry is a genuine science discovering real properties, not just a shortcut for lazy physicists.

  ### Summary
  You feel like you have to pick one because you are assuming that **dependence implies elimination.**
  *   *Your assumption:* If A depends on B, then A is just a shorthand for B.
  *   *Philosophical consensus:* If A depends on B, A can still have its own distinct laws, reality, and explanatory power.

  Your professor isn't being inconsistent; they are inviting you to see that "reduction" doesn't have to mean "erasure." You can believe chemistry is grounded in physics without believing chemistry is fake.

  **Recommendation:** If you want to read more on this specific tension, look up **"Special Sciences"** by Jerry Fodor (1974). It is the classic paper arguing exactly what your professor is saying: that higher-level sciences (like chemistry/psychology) are autonomous and real, even if the world is physically constituted.
