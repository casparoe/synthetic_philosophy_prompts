      *   *Dennett & Kinsbourne's Dichotomy:*
          *   *Stalinesque:* Delay experience, edit it, then present it. (Consciousness is later than stimulus).
          *   *Orwellian:* Experience happens, then memory is falsified. (Consciousness is earlier, report is later).
