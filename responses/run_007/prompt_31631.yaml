      *   **Topic:** The Color Phi Phenomenon and the Dennett & Kinsbourne (1992) debate (Orwellian vs. Stalinesque).
      *   **User's Hypothesis:** The debate is stuck because it assumes a "Cartesian Theater" (a place/time where consciousness happens independently of report/memory). The user suspects it might be a pseudo-question.
