prompt: |-
  I'm hosting a philosophy podcast and next month's episode is on Berkeley's economic writings — not the stuff everyone knows, but specifically The Querist and his monetary theory. My guest is a scholar who's just put out a book arguing that Berkeley's views on money aren't just a quirky side project but actually follow from his immaterialist metaphysics in a pretty direct way. The core idea is that if material substance doesn't exist, then gold and silver can't have intrinsic value, so money has to be something else — a ticket, a counter, a record of claims. And that's what leads him to advocate for a paper currency for Ireland in the 1730s.

  I want interview questions that go beyond "so tell us about Berkeley and money." I'm looking for eight or nine questions that really dig into the philosophical architecture here. Specifically, I want: (1) a question on exactly how the metaphysics is supposed to underwrite the monetary theory — like, walk me through the inference from "no material substance" to "money is a counter"; (2) a question on whether the policy proposal actually needs the metaphysics, or whether Berkeley's paper-currency argument could stand on its own as pragmatic economics and the immaterialism is just window dressing; (3) a question about Berkeley's relationship to what we'd now call chartalism or state theory of money, since he seems to think the sovereign's stamp is what makes something count as currency; (4) a question about what Berkeley thought real wealth consisted in, given that he keeps saying in The Querist that the wealth of a nation is the industry of its people, not its gold reserves; and (5) a question that presses on a tension I've always found weird — if the whole physical world is just ideas in minds, why does it matter at all whether Ireland uses paper or gold? Like, isn't the entire monetary system just another set of ideas either way? What's the practical difference supposed to be?

  For each question, give me the follow-up I should use when the guest gives their most likely answer — I don't want to get stuck nodding along when they say something predictable. And for the last question about the tension, write a follow-up that's hard to deflect. Also, I'd love at least one question that brings in the fact that Berkeley was an Anglican bishop — does his theology do any work in the monetary theory, or is that a seperate thing entirely?

  Keep the whole thing under 850 words — I need it on one or two pages while I'm recording, I can't be flipping through a novel.
