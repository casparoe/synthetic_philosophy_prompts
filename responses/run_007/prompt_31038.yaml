answer: |-
  **Podcast Interview Guide: Berkeley's Monetary Metaphysics**

  **1. The Inference**
  Your book argues immaterialism drives Berkeley's monetary theory. Walk us through the inference: how does denying material substance specifically entail that money is a "counter" rather than a commodity?
  *Follow-up:* If gold lacks intrinsic value ontologically, why did contemporaries insist it held value? Was Berkeley correcting a philosophical error or merely proposing a useful fiction?

  **2. Necessity**
  Could Berkeley's paper currency argument stand on pragmatic grounds alone? Is the immaterialism essential architecture or just philosophical window dressing for a policy proposal?
  *Follow-up:* If it's window dressing, why does he embed these economic queries within his broader philosophical project rather than treating them separately?

  **3. Chartalism**
  Berkeley seems to anticipate chartalism: the sovereign's stamp creates currency. Is this authority divine, political, or social in his view?
  *Follow-up:* Does this make money a tool of state power primarily, or a facilitator of private industry?

  **4. Wealth**
  He claims national wealth is industry, not gold. If wealth is activity, not objects, how does this reshape the ontological status of the economy itself?
  *Follow-up:* Does this imply poverty is a failure of imagination or will, rather than a lack of resources?

  **5. Theology**
  As an Anglican Bishop, does Berkeley's theology do work here? Is the circulation of money analogous to divine grace or order in his system?
  *Follow-up:* If money is a ticket, who is the ultimate issuer—the King or God?

  **6. The Tension**
  If the physical world is just ideas, why does the material composition of currency (paper vs. gold) matter practically? Isn't both just ideas either way?
  *Follow-up (Hard):* If both are ideas, preferring paper implies one idea constrains flourishing less than another. But if matter doesn't exist, what is doing the constraining? Is the barrier psychological, or is there a normative structure in God's will that makes gold idolatry?

  **7. Method**
  *The Querist* is written in questions. Was this method chosen to provoke active industry in the reader, mirroring his economic thesis?
  *Follow-up:* Does the form itself perform the economic activity he advocates?

  **8. Context**
  How much of this was driven by Ireland's specific poverty versus universal theory? Was this therapy for a specific nation?
  *Follow-up:* Can this theory export to wealthy nations, or is it strictly developmental?

  **9. Legacy**
  Keynes admired Berkeley. Where do they diverge? Is Berkeley's idealism compatible with modern macroeconomic modeling?
  *Follow-up:* What would Berkeley say about cryptocurrency today? A pure counter or a new idol?
