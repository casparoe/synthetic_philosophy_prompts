answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Normative Status of the Common Prior Assumption
  **Workshop:** Formal Epistemology and the Foundations of Game Theory
  **Date:** 24 May 2024

  **Signatories:**
  **Participant A** (Defending the Common Prior Assumption)
  **Participant B** (Defending Permissivism)

  ***

  ### 1. Agreed Claims

  We, the undersigned, hereby record the following technical and conceptual claims as matters of settled agreement. These claims form the shared background against which our residual disagreement is situated.

  1.  **Aumann's Agreement Theorem:** We agree that Aumann's (1976) theorem establishes that if two agents possess a **common prior** and their posterior probabilities for a given event are **common knowledge**, then those posterior probabilities must be identical. Consequently, rational agents with a common prior cannot 'agree to disagree'.
  2.  **Conditional Status:** We agree that the Agreement Theorem is a conditional result. It demonstrates that *given* a common prior and common knowledge of posteriors, disagreement is impossible. It does not, in itself, prove that rationality *requires* a common prior *ex ante*, nor does it prove that agents who disagree must necessarily be irrational, as the conditions (particularly common knowledge) may fail to obtain.
  3.  **The Demanding Nature of Common Knowledge:** We concur that the assumption of common knowledge (an infinite hierarchy of mutual knowledge: *I know that you know that I know...*) is exceptionally demanding. In most realistic strategic or epistemic interactions, this condition is not met, limiting the direct descriptive applicability of the Agreement Theorem to non-ideal agents.
  4.  **Coherence and Dutch Books:** We agree that probabilistic coherence (satisfaction of the Kolmogorov axioms) is a necessary condition for ideal rationality. Both sides accept the Dutch Book argument: an agent whose credences violate the probability calculus is susceptible to a sure loss in a series of bets, which constitutes a pragmatic defect.
  5.  **Accuracy and Scoring Rules:** We agree that credences are subject to accuracy norms. Specifically, we concur that using a proper scoring rule incentivises an agent to report their true credences and that minimising expected inaccuracy is a rational goal. However, we reserve judgement on whether these accuracy arguments uniquely determine a single permissible prior distribution.
  6.  **Bayesian Conditionalisation:** We agree that, upon receiving new evidence, ideal rationality requires agents to update their beliefs via Bayesian conditionalisation (or a recognised generalisation thereof, such as Jeffrey conditionalisation), provided the evidence is certain (or appropriately weighted).

  ***

  ### 2. Residual Disagreement

  While we share the technical framework outlined above, we diverge on the normative interpretation of these tools regarding the formation of priors. The following table delineates our respective positions.

  | Issue | Participant A (Common Prior Camp) | Participant B (Permissivist Camp) |
  | :--- | :--- | :--- |
  | **The Normative Status of Priors** | Ideal rationality imposes constraints on priors sufficient to ensure uniqueness (or near-uniqueness). Two agents with identical information *ought* to hold identical credences. | Probabilistic coherence licences a wide range of priors. Rationality constrains the *structure* of belief, but not the specific *content* of the initial prior, allowing for reasonable disagreement. |
  | **Explanation of Persistent Disagreement** | Persistent disagreement between agents with shared evidence indicates a failure of rationality (e.g., failure to update correctly) or a failure to achieve the common prior requirement. | Persistent disagreement may arise even between ideally rational agents due to differing initial priors. Such disagreement is not inherently epistemically blameworthy. |
  | **The Harsanyi Doctrine** | The Common Prior Assumption (CPA) is a normative requirement for game-theoretic models of rational interaction. Without it, equilibrium concepts lack a unified epistemic foundation. | The CPA is a useful modelling simplification or an empirical hypothesis about specific populations, but it should not be elevated to a universal norm of rationality. |
  | **Imprecise Credences** | Apparent cases for imprecise credences can be modelled by a set of precise priors, but a fully rational agent should ideally possess a precise credence function (potentially derived from a 'hyper-prior'). | Imprecise credences (representors) are a legitimate and sometimes required representation of rational belief, particularly when evidence is sparse or ambiguous. |

  ***

  ### 3. Cruxes and Adjudication

  To move this dispute forward, we have identified specific sub-questions ('cruxes') where a settled answer would compel at least one of us to revise our position. For each crux, we specify the formal result, theorem, or concrete case that would bear on the issue, and record our current predictions.

  #### Crux 1: The Extension of Coherence Arguments to Uniqueness
  *   **Question:** Do diachronic Dutch Book arguments or Accuracy arguments entail a unique rational prior (e.g., via the Principle of Indifference or Maximum Entropy)?
  *   **Adjudicating Evidence:** A formal proof demonstrating that violating a specific prior constraint (such as Maximum Entropy) renders an agent susceptible to a diachronic Dutch Book *even if* they update via conditionalisation.
  *   **Participant A Prediction:** Such a proof exists or is derivable. Coherence is not merely synchronic; rational learning rules constrain the starting point.
  *   **Participant B Prediction:** No such proof exists. Coherence arguments underdetermine the prior; multiple priors can satisfy all diachronic coherence constraints.

  #### Crux 2: The Normative Interpretation of Aumann's Result
  *   **Question:** Should the impossibility of 'agreeing to disagree' be interpreted as a *reductio ad absurdum* of differing priors, or as a limit on the applicability of common knowledge?
  *   **Adjudicating Evidence:** Analysis of 'Approximate Common Knowledge' models (e.g., Monderer and Samet, 1989). If agents can agree to disagree under slight relaxations of common knowledge while retaining common priors, does this weaken the normative force of the strict theorem?
  *   **Participant A Prediction:** Even with approximate common knowledge, the pressure towards consensus remains strong. Significant persistent disagreement still signals a prior divergence that is rationally suspect.
  *   **Participant B Prediction:** The fragility of the theorem under relaxation shows that the 'no disagreement' result is a mathematical artefact of an unrealistic idealisation, not a deep norm of rationality.

  #### Crux 3: The Status of Imprecise Credences in Decision Theory
  *   **Question:** Are imprecise credences rationally permissible or required in cases of severe uncertainty (e.g., Ellsberg Paradox scenarios)?
  *   **Adjudicating Evidence:** A decision-theoretic framework that resolves the Ellsberg Paradox without violating dominance principles, comparing a precise prior approach (e.g., risk-weighted expected utility) against an imprecise credence approach.
  *   **Participant A Prediction:** A precise prior model (perhaps augmented with risk attitudes) can explain Ellsberg-type behaviour without abandoning precise credences. Imprecise credences are unnecessary complexity.
  *   **Participant B Prediction:** Only a model allowing for imprecise credences can capture the rationality of the choices in Ellsberg cases without labelling the agents as irrational.

  #### Crux 4: Verbal vs. Substantive Dispute
  *   **Question:** Is the disagreement merely about the definition of 'ideal rationality'?
  *   **Adjudicating Evidence:** A consensus definition of 'ideal rationality'. If Participant A defines it as 'coherence + unique prior' and Participant B defines it as 'coherence + any prior', the dispute may be verbal.
  *   **Resolution:** We agree the dispute is **substantive**. It concerns the *normative force* of epistemic norms. Participant A claims there is a fact of the matter regarding what credence one *ought* to have given evidence $E$. Participant B claims there is a range of credences one *permissibly may* have given evidence $E$. This is a disagreement about the nature of epistemic justification, not merely terminology.

  ***

  **Signed:**

  _________________________
  **Participant A**

  _________________________
  **Participant B**
