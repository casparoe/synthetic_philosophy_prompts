prompt: |-
  So I'm in this ethics study group, and two of the members got into it last week over something the professor called "the paradox of deontology." I wasn't in the argument myself but I've been thinking about it ever since and I honestly can't figure out who was right.

  The argument started when Marcus brought up the standard ticking-bomb case in the context of deontology — you know, terrorist has a bomb, won't talk, do you torture him. He said a deontologist would say no, you can't torture someone even to save lives, because torture violates dignity and rights. Then Jenna said okay, but what if we change the scenario: the terrorist isn't just planting a bomb, he's currently torturing ten hostages, and the only way to stop him is to torture him. She said if you really believe torture is wrong because it violates rights, then you should be willing to violate one person's rights to prevent ten identical rights violations. Otherwise you're basically saying your own moral purity matters more than ten people being tortured.

  Marcus pushed back and said deontology is about agent-relativity — you're responsible for what *you* do, not for preventing all the bad things other people do. Jenna said that's exactly her point: treating your own causal role as weightier than the suffering of actual victims makes deontology look like dressed-up selfishness. Marcus said no, it's about the structure of moral reasons, not about keeping your hands clean. Jenna said that's a distinction without a difference unless he can explain *why* his doing the torturing is so much worse than his allowing ten tortures to happen. Marcus brought up the doing/allowing distinction and Jenna said that's just giving the problem a label, not solving it. At that point they both got frustrated and someone changed the subject.

  I've been turning this over in my head all week. Can you go through their exchange step by step and say who has the better argument at each move? I'm not asking who "wins" overall — I want to know whether Jenna's objection is as serious as it sounded, or whether Marcus was right that she was missing something basic about deontology that he couldnt articulate in the moment. And if deontology actually has a good response to this, I'd like to understand what it is.
