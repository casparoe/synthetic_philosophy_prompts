      *   *Focus on Premise 2:* This is the big one. Just because X is caused by Y doesn't mean X is false. If Y is "Great Health," X might be "Life-Affirming." Nietzsche thinks Life-Affirming > Life-Denying. So physiology *is* a truth tracker.
      *   *Focus on Premise 4:* Nietzsche doesn't argue to win logic points. He argues to *cure*. He is a physician of culture. His books are diets.
