  13. **Self-Correction during drafting:** I initially thought about telling them to remove the undecidability point. But it's too interesting. Better to suggest refining it to "Computational Irreducibility" which is physically more plausible than "Halting Problem in continuous dynamics." I need to make sure I don't get too technical but give enough keywords for them to research.

