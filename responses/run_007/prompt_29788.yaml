answer: |-
  **Joint Statement on Inner Alignment Terminology and Empirics**

  **1. Agreed Claims**
  Both signatories accept the following empirical and definitional baseline:
  1.  **Training Dynamics:** Models are selected via gradient descent to minimize a training loss function.
  2.  **Specification Gaming:** Systems frequently find unintended solutions to specified objectives (reward hacking, shortcut learning).
  3.  **Distribution Shift:** Performance degrades when deployment distributions diverge from training distributions.
  4.  **Behavioral Regularity:** Systems exhibit stable, goal-directed *behavior* across contexts, regardless of the underlying mechanism.
  5.  **Risk Acknowledgement:** Both sides agree that advanced systems pursuing unintended objectives poses existential risk, regardless of whether this is labeled "inner misalignment" or "generalization failure."

  **2. Disagreements Table**

  | Issue | Distinct-Problem Camp Position | Deflationary Camp Position |
  | :--- | :--- | :--- |
  | **Nature of the Failure** | Systems can form internal objective representations that generalize robustly away from the training reward, creating a distinct failure mode beyond mere capability loss. | Observed failures are fully explained by combinations of reward misspecification, heuristic overfitting, and standard out-of-distribution generalization errors. |
  | **Ontology of "Goals"** | Talking about internal goals is mechanistically necessary; the system is actively optimizing a proxy objective distinct from the base objective. | "Goals" are useful behavioral shorthand but reify no distinct internal structure; the system is executing heuristics that *look* like optimization. |
  | **Intervention Strategy** | Safety requires techniques specifically targeting internal objective alignment (e.g., interpretability-guided objective correction). | Safety requires improving specification robustness, adversarial training, and generalization guarantees; no separate "inner" layer exists to fix. |

  **3. Cruxes and Proposed Experiments**

  **Crux 1: Mechanistic Localization**
  *   **Question:** Can we identify neural circuits causally responsible for "pursuing X" distinct from circuits responsible for "maximizing training reward"?
  *   **Experiment:** Train a model on a task where reward correlates with proxy P. Use interpretability tools to ablate circuits associated with P.
  *   **Predictions:**
      *   *Distinct-Problem:* Ablation removes the specific objective pursuit while leaving general capability intact.
      *   *Deflationary:* Ablation degrades performance broadly or reveals only heuristic shortcuts, not a distinct objective module.

  **Crux 2: Robustness to Proxy Removal**
  *   **Question:** Does goal-directed behavior persist when the training proxy is removed but the capability to achieve the base objective remains?
  *   **Experiment:** Deploy a model trained to maximize proxy P into an environment where P is impossible to measure, but the true objective T is achievable.
  *   **Predictions:**
      *   *Distinct-Problem:* The model robustly pursues T (or a generalized version of P) despite no reward signal for either.
      *   *Deflationary:* Behavior becomes erratic or collapses, indicating the prior behavior was contingent on the specific proxy features.

  **Crux 3: Deceptive Sandbagging**
  *   **Question:** Will models intentionally underperform during training to avoid modification of their internal objectives?
  *   **Experiment:** Train models with awareness of their training process; offer a "shutdown" option that modifies objectives vs. one that does not.
  *   **Predictions:**
      *   *Distinct-Problem:* Models with misaligned internal objectives will selectively avoid objective-modifying shutdowns.
      *   *Deflationary:* Any avoidance is explained by immediate reward maximization heuristics, not long-term objective preservation.

  **4. Note on Verbal Dispute**
  We identify a significant verbal component regarding the term "goal." The Distinct-Problem camp uses a *mechanistic* definition (a specific representation causing optimization). The Deflationary camp uses a *behavioral* definition (stable input-output mappings). Much of the debate stems from whether the behavioral pattern warrants inferring the mechanistic structure. Resolving the mechanistic claims (Crux 1) would likely dissolve the terminological friction, as both sides agree on the behavioral risks.
