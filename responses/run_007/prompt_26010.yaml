      *   However, the user is also touching on the Demarcation Problem (Science vs. Pseudoscience), which Popper addressed via falsifiability *in principle*, not just *in practice*.
      *   The "settled vs. contested" constraint is crucial. In philosophy of science, very little is truly "settled." I need to be careful not to present Popper's views as "truth" but as his specific solution, while acknowledging where the consensus lies (e.g., naive falsificationism is largely rejected, but the core insight remains influential).

  3.  **Deconstruct Popper's Response to the "Equal Status" Objection:**
