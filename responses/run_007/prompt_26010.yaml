      *   *Corroboration:* Popper introduced "degrees of corroboration." It's not probability (inductive), but a report on how severely a theory has been tested and survived.
      *   *Severity of Tests:* A theory that makes risky predictions (GR predicting light bending) is better corroborated than one that accommodates any outcome (Astrology).
