          *   Leaves must include specific positions: Bioconservative, Normal-Function/Disease-based, Welfarist, Transhumanist/Permissive, Deflationary.
          *   Must identify empty/incoherent boxes.
          *   Must flag indistinguishable leaves.
          *   Audience: Non-philosophers (clinicians, chaplain, lawyer).
          *   Timeframe: Usable in ~20 minutes.
          *   Cases: Growth Hormone (GH), Cochlear Implant (CI), Modafinil.
          *   Language: British English (spellings, idioms).
          *   Tone: Practical, honest about the messiness, not overly academic.

  2.  **Deconstruct the Therapy/Enhancement Distinction:**
      *   Why do people disagree?
          *   *Definition of Normal:* Is it statistical? Functional? Species-typical?
          *   *Goal:* Restoring vs. Improving?
          *   *Harm/Benefit:* Is suffering required for intervention to be justified?
          *   *Identity/Culture:* Does the condition constitute a culture (Deaf community)?
          *   *Safety/Fairness:* Is it about risk or justice?
          *   *Nature:* Is "natural" inherently better?

  3.  **Drafting the Branch Nodes (The Questions):**
      *   Need to avoid leading questions.
