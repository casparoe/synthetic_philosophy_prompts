      *   *Question 1: The Baseline.* Is the current state "diseased" or just "variable"? (Captures Normal-Function vs. others).
      *   *Question 2: The Goal.* Are we fixing a deficit or adding a surplus? (Captures Therapy vs. Enhancement logic).
      *   *Question 3: The Harm/Suffering.* Is there present/future suffering? (Captures Welfarist).
      *   *Question 4: Social/Identity.* Does the intervention erase a valued identity? (Captures Disability Rights/CI issue).
      *   *Question 5: The Limit.* Is there *any* upper bound on improvement? (Captures Transhumanist vs. Bioconservative).

      *Refining for a 20-minute tool:* Five questions might be too many for a quick sort. Let's group them logically.
      *   *Node 1: Status of the Condition.* (Disease/Deficit vs. Variation).
      *   *Node 2: Role of Suffering.* (Necessary vs. Irrelevant).
      *   *Node 3: Naturalness/Identity.* (Preservation vs. Optimization).
      *   *Node 4: Utility of the Distinction.* (Keep it vs. Drop it).

      *Wait, the prompt asks for a taxonomy of positions built from questions.* It needs to look like a flowchart or a structured guide. Let's create a "Diagnostic Tool" format.

  4.  **Developing the Leaves (The Positions):**
      *   *Bioconservative:* Natural functioning has value. Intervention only to cure disease, wary of altering human nature.
      *   *Normal-Function (Daniels/Boorse):* Therapy restores species-typical function. Enhancement exceeds it.
      *   *Welfarist (Savulescu et al.):* Therapy/Enhancement doesn't matter; wellbeing/suffering matters.
      *   *Transhumanist/Permissive:* Enhancement is good. No hard limit.
      *   *Deflationary:* The distinction is useless; look at risk/benefit/justice directly.

  5.  **Addressing the "Empty Boxes" and "Indistinguishable Leaves":**
      *   *Empty Box:* Someone who says "Enhancement is okay, but Therapy is forbidden" (Incoherent). Or "Only natural interventions are allowed" (Homeopathy? Unlikely in hospital setting).
