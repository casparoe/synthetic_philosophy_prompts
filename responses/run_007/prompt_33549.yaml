answer: |-
  # The Therapy/Enhancement Diagnostic Tool
  **For Clinical Ethics Committee Use**

  **Purpose:** To clarify *why* committee members disagree on specific cases, without getting bogged down in philosophical labels.
  **Time Required:** 15–20 minutes.
  **Format:** A branching questionnaire followed by a position map.

  ---

  ## Part 1: The Anchor Cases
  *Keep these in mind as you work through the questions. Do not decide the cases yet; use them to test your intuitions.*

  1.  **The Growth Hormone (GH) Case:** A 14-year-old boy is healthy but significantly shorter than average (bottom 1st percentile). He is distressed by his height. Parents request GH to bring him to the mid-range.
      *   *Key tension:* Is shortness a disease or a variation? Is height restoration therapy or enhancement?
  2.  **The Cochlear Implant (CI) Case:** A deaf child (born to Deaf parents) is offered a cochlear implant. The Deaf community argues this destroys a linguistic minority culture; the medical team argues it restores hearing function.
      *   *Key tension:* Is deafness a disability to be cured or an identity to be preserved?
  3.  **The Modafinil Case:** A medical student with no sleep disorder wants a prescription for modafinil to improve concentration during exams.
      *   *Key tension:* Is cognitive improvement for a healthy person permissible if it reduces stress and improves grades?

  ---

  ## Part 2: The Decision Tree
  *Answer the following five questions. There are no 'correct' answers, only consistent ones. Tick the box that best reflects your view.*

  ### Node 1: The Baseline
  **What determines whether an intervention is morally prioritised?**
  *   [ ] **A.** Whether the patient falls outside 'species-typical' or 'normal' physiological functioning. (e.g., If the organ works as designed for humans, we shouldn't interfere).
  *   [ ] **B.** Whether the patient is suffering or their wellbeing is compromised, regardless of whether their physiology is 'normal'. (e.g., If they are distressed, it matters less if they are statistically average).
  *   [ ] **C.** Whether the intervention respects the patient's future autonomy and opportunities, regardless of physiology or current suffering.

  ### Node 2: The Goal
  **When we intervene, what are we trying to achieve?**
  *   [ ] **A.** To restore a capacity that has been lost or failed to develop due to pathology.
  *   [ ] **B.** To improve a capacity beyond what is currently typical, if it benefits the person.
  *   [ ] **C.** To allow the patient to choose their own trajectory, provided it does not harm others.

  ### Node 3: The Identity & Social Context
  **How do we weigh social or cultural objections (e.g., the Deaf community's view on CIs)?**
  *   [ ] **A.** Medical function trumps cultural identity; hearing is objectively better than deafness.
  *   [ ] **B.** Cultural identity trumps medical function; removing deafness may be a harm, not a benefit.
  *   [ ] **C.** This is irrelevant to the clinical ethics decision; we treat the individual patient in front of us.

  ### Node 4: The Ceiling
  **Is there a moral limit to human improvement?**
  *   [ ] **A.** Yes. There is a 'natural' range of functioning we should not exceed (e.g., 'better than well' is suspect).
  *   [ ] **B.** No. If it is safe and effective, 'better than well' is morally neutral or positive.
  *   [ ] **C.** The limit is practical (safety/cost), not moral.

  ### Node 5: The Utility of the Distinction
  **Does the label 'enhancement' vs. 'therapy' do any useful work in this committee?**
  *   [ ] **A.** Yes. It helps us prioritise resources and define the limits of medicine.
  *   [ ] **B.** No. It is a distraction. We should talk directly about risk, benefit, justice, and autonomy.

  ---

  ## Part 3: Mapping Your Position
  *Count your ticks and find your profile below. This tells you which ethical 'leaf' you occupy.*

  ### 1. The Normal-Function Position (Mostly Node 1A, 2A, 4A, 5A)
  *   **Core View:** Medicine's goal is to restore or maintain species-typical functioning.
  *   **Verdict on Cases:**
      *   **GH:** Likely **No** (unless shortness is defined as a pathology). It exceeds normal function.
      *   **CI:** Likely **Yes**. Restores species-typical hearing.
      *   **Modafinil:** **No**. The brain is functioning normally; this is enhancement.
  *   **Strengths:** Clear boundaries; aligns with traditional insurance/NHS funding models.
  *   **Weaknesses:** Struggles with conditions that are 'normal' but disabling (e.g., severe dysmenorrhoea) or variations that cause distress (e.g., the short teen).

  ### 2. The Welfarist Position (Mostly Node 1B, 2B, 4B, 5A)
  *   **Core View:** The distinction between therapy and enhancement is less important than wellbeing. If it reduces suffering or increases opportunity, it is justified.
  *   **Verdict on Cases:**
      *   **GH:** **Yes**, if the distress is significant.
      *   **CI:** **Yes**, assuming the child will have more opportunities (though may weigh parental views).
      *   **Modafinil:** **Yes**, if it reduces exam anxiety and improves career prospects without undue risk.
  *   **Strengths:** Patient-centred; flexible.
  *   **Weaknesses:** Could justify expensive interventions for minor gains; risks medicalising normal unhappiness.

  ### 3. The Bioconservative Position (Mostly Node 1A, 2A, 4A, 3A)
  *   **Core View:** Natural functioning has intrinsic value. We should not alter human nature or 'play God'.
  *   **Verdict on Cases:**
      *   **GH:** **No**. Acceptance of self is preferable to chemical alteration.
      *   **CI:** **Debatable**, but wary if it implies deaf people are 'broken'.
      *   **Modafinil:** **No**. Undermines authentic achievement and alters the self.
  *   **Strengths:** Protects against societal pressure to enhance; values human diversity.
  *   **Weaknesses:** Can seem paternalistic; 'nature' is hard to define (is glasses 'natural'?).

  ### 4. The Transhumanist / Permissive Position (Mostly Node 2B, 4B, 3C)
  *   **Core View:** Humans have a moral obligation to improve themselves and their offspring where possible.
  *   **Verdict on Cases:**
      *   **GH:** **Yes**.
      *   **CI:** **Yes**.
      *   **Modafinil:** **Yes**.
  *   **Strengths:** Embraces technological progress; maximises autonomy.
  *   **Weaknesses:** Risks exacerbating inequality; may underestimate social coercion.

  ### 5. The Deflationary Position (Mostly Node 5B)
  *   **Core View:** The therapy/enhancement distinction is incoherent. All medical interventions 'enhance' function (even antibiotics).
  *   **Verdict on Cases:**
      *   **All Cases:** Ignore the label. Ask: Is it safe? Is it effective? Is it just? Can we afford it?
  *   **Strengths:** Cuts through semantic deadlock.
  *   **Weaknesses:** Removes a useful heuristic for rationing; doesn't solve the underlying moral conflict.

  ---

  ## Part 4: Empty Boxes & Overlaps
  *Be aware of these structural issues when discussing the results.*

  ### 1. The Incoherent Box: "Anti-Therapy / Pro-Enhancement"
  *   **Description:** A position that forbids restoring normal function but permits exceeding it.
  *   **Status:** **No Defenders.**
  *   **Reason:** Incoherent. If restoring function is morally wrong, improving upon it is almost certainly wronger in every ethical framework (except perhaps a niche aesthetic view that 'brokenness' is superior). You will not find this in a hospital committee.

  ### 2. The Indistinguishable Pair: Welfarist vs. Transhumanist
  *   **Description:** In a clinical setting, these two often vote the same way (Permissive).
  *   **Status:** **Hard to Separate.**
  *   **Reason:** Both permit enhancement. The difference is *why* (Welfarist: reduces suffering; Transhumanist: moral duty to improve). For committee voting purposes, they are allies. Distinguish them only if discussing long-term societal implications.

  ### 3. The Indistinguishable Pair: Deflationary vs. Welfarist
  *   **Description:** Both tend to approve interventions based on outcome rather than category.
  *   **Status:** **Procedurally Similar.**
  *   **Reason:** The Deflationist says "Drop the label, look at benefit." The Welfarist says "The label doesn't matter, benefit is king." They arrive at the same recommendation via slightly different routes.

  ### 4. The 'Deafness' Anomaly
  *   **Description:** The Cochlear Implant case splits the **Normal-Function** group.
  *   **Status:** **Critical Fault Line.**
  *   **Reason:** Some Normal-Function proponents see deafness as a physiological deficit (Therapy). Others accept the social model of disability and view it as a cultural identity (Enhancement/Identity Loss). *Do not assume everyone who ticks Node 1A agrees on the CI case.*

  ---

  ## Part 5: Facilitator's Guide (20 Minutes)

  1.  **Distribution (2 mins):** Hand out the sheet. Ask members to read the three cases quickly.
  2.  **Silent Voting (5 mins):** Ask members to tick the boxes in Part 2 individually. No discussion yet.
  3.  **Mapping (5 mins):** Ask members to identify their Position (Part 3). Ask for a show of hands for each Position.
      *   *Note:* You will likely find a split between **Normal-Function** (often medical staff) and **Welfarist/Deflationary** (often ethics/legal/chaplaincy).
  4.  **Targeted Discussion (8 mins):** Do not discuss the cases generally. Discuss the *splits*.
      *   *Ask the Normal-Function group:* "On the GH case, does 'species-typical' mean the average, or the range where life is possible?"
      *   *Ask the Welfarist group:* "If we fund GH for distress, do we fund cosmetic surgery for distress? Where is the line?"
      *   *Ask the Deflationists:* "If we drop the word 'enhancement', what word stops us from offering everything to everyone?"

  **Final Note for the Chair:**
  If the room is deadlocked, it is usually because half the room is answering Node 1 (Baseline) differently from the other half. Acknowledge this. You cannot vote on a case until you agree on whether you are prioritising *physiology* or *wellbeing*. This tool forces that admission before you vote.

  ---

  *Prepared for Clinical Ethics Committee Use. UK English spelling convention applied.*
