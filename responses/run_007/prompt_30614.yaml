answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** The Value of Equality vs. Priority (The Leveling-Down Objection)  
  **Participants:** Prioritarian Representative (P) | Telic Egalitarian Representative (E)  
  **Date:** October 26, 2023  
  **Status:** Pending Empirical/Intuitive Testing  

  ---

  ## I. JOINT STATEMENT OF AGREED CLAIMS
  *We, the undersigned, agree to the following propositions as the baseline for our continued debate. These claims are accepted by both sides as true, regardless of our theoretical divergences.*

  1.  **The Leveling-Down Scenario:** We agree on the factual description of the "Leveling-Down" case: A change occurs where the better-off group is made worse off, the worse-off group remains unchanged, and no one benefits.
  2.  **All-Things-Considered Judgment:** We agree that in the Leveling-Down scenario, the resulting state of affairs is **not better all-things-considered**. Both sides agree it would be irrational to enact Leveling-Down if given the choice.
  3.  **Welfare Matters:** We agree that individual welfare (well-being, utility, or quality of life) is a constituent part of what makes an outcome good. A world where everyone suffers is not a good world.
  4.  **Priority Intuition:** We agree that, ceteris paribus, a benefit to a worse-off person is morally more urgent or valuable than an identical benefit to a better-off person.
  5.  **Definition of "Improvement":** We agree that for a change to count as an "improvement" *simpliciter*, it must make the world better all-things-considered.
  6.  **The "In Some Respect" Distinction:** We agree that a change can be bad all-things-considered while still possessing some positive feature (e.g., a painful surgery is bad overall due to pain, but good in the respect of health). We disagree on whether Leveling-Down possesses *any* such positive feature.

  ---

  ## II. TABLE OF DISAGREEMENTS
  *Where we diverge. Each statement is phrased in the voice of the respective theorist.*

  | Topic | Prioritarian View (P) | Telic Egalitarian View (E) |
  | :--- | :--- | :--- |
  | **1. The Value of Leveling-Down** | "Leveling-Down contains **no value whatsoever**. It is a pure loss. To say it is 'good in any respect' implies there is a reason to welcome it, and there is no reason to welcome a change that helps no one." | "Leveling-Down is bad overall, but it is **good in one specific respect**: the reduction of inequality. The world is more fair, even if it is poorer. We should regret that we cannot achieve equality without loss, but the equality itself is a gain." |
  | **2. Source of Value** | "Value comes from **people**. If no person is better off, no value has been created. 'Equality' is just a mathematical relation between people; relations cannot feel joy or suffer pain, so they cannot hold intrinsic value." | "Value comes from **states of affairs**. A state of affairs where people relate as equals is intrinsically better than one where they relate as unequals, independent of the sum of welfare. Justice is a feature of the pattern, not just the individuals." |
  | **3. Interpretation of Priority** | "We care about the worse off because **marginal utility matters**. A dollar (or unit of welfare) does more moral work when someone is desperate. We don't need 'equality' to explain why we help the poor; we just need 'priority'." | "We care about the worse off because **inequality is objectionable**. The reason a benefit to the poor matters more is that it closes the gap. If equality didn't matter, we would be utilitarians. Priority is just egalitarianism in disguise." |
  | **4. The Word 'Better'** | "When we say a world is 'better,' we mean there is **more good in it**. Since Leveling-Down adds no good to anyone, calling it 'better in any respect' is misleading language that invites error." | "When we say a world is 'better in a respect,' we mean it **instantiates a relevant value**. Equality is a relevant value. Therefore, the world is better in that respect, even if the total 'goodness' score drops due to welfare loss." |

  ---

  ## III. CRUXES AND TEST CASES
  *We have identified two fundamental cruxes. For each, we propose a specific thought experiment or line of reasoning that bears on the truth of the matter. We have recorded our predictions in advance.*

  ### Crux 1: The Intrinsic Value of Patterns
  **The Question:** Can a pattern of distribution (equality) have value even if no individual within that pattern benefits from it?

  **The Test Case: "Separate Worlds" (Parfit)**
  *Imagine two possible worlds that never interact.*
  *   **World A:** 1,000 people live on Planet X. Everyone has welfare level 100. (Perfect Equality)
  *   **World B:** 1,000 people live on Planet Y. Everyone has welfare level 100. (Perfect Equality)
  *   **World C:** 1,000 people live on Planet X (Welfare 100). 1,000 people live on Planet Y (Welfare 50). (Inequality exists between planets, though no one knows about the other planet).

  **The Question:** Is World C intrinsically worse than World A + World B combined, simply because of the inequality between the planets, even though no one is envious and no one knows about the disparity?

  | Side | Prediction / Stance |
  | :--- | :--- |
  | **Prioritarian (P)** | **No Difference.** World C is not worse. Inequality requires a relationship or comparison that matters to the people involved. If the groups are isolated, the "inequality" is a fiction of the observer. There is no person for whom World C is worse. |
  | **Egalitarian (E)** | **World C is Worse.** Even if they never meet, it is objectively less fair that one group has more than the other through no fault of their own. The pattern of the universe is less just. We should prefer A+B over C, even if total welfare is identical. |

  ### Crux 2: The "In Some Respect" Claim
  **The Question:** Does admitting that Leveling-Down is "good in one respect" commit us to irrational action, or is it a necessary nuance of moral reasoning?

  **The Test Case: "The Sadist's Gain"**
  *Imagine a change where a sadist gains immense pleasure from torturing a victim, but the victim suffers slightly more than the sadist gains (Net Negative Welfare).*
  *   **Prioritarian Analogy:** "This is bad all-things-considered. Is it 'good in the respect' that the sadist is happier? Yes. Is that a *moral* good? No."
  *   **Egalitarian Analogy:** "In Leveling-Down, equality is a *moral* good, unlike the sadist's pleasure. It counts toward the moral score, even if it loses to welfare."

  **The Question:** If we ask, "Is there *any* moral reason to favor the Leveling-Down outcome over the status quo?" does the answer change our theory?

  | Side | Prediction / Stance |
  | :--- | :--- |
  | **Prioritarian (P)** | **No Moral Reason.** There is zero moral weight in favor of Leveling-Down. To say there is a "moral reason" to make people worse off for no gain is incoherent. The "respect" is illusory. |
  | **Egalitarian (E)** | **One Moral Reason.** There is a *pro tanto* moral reason (fairness) that is simply outweighed by the moral reason against harming the rich. The tragedy is that the reasons conflict. If we could level down without harming anyone, that reason would become decisive. |

  ---

  ## IV. ANALYSIS OF VERBAL DISPUTES
  *We have analyzed whether our disagreement is substantive or merely semantic. We conclude the following:*

  **1. The Definition of "Equality"**
  *   **Dispute:** P argues E is reifying a mathematical relation. E argues P is ignoring a moral relation.
  *   **Resolution:** This is **substantive**. We agree on the definition of equality (same welfare levels), but we disagree on whether that definition maps onto a value property. Clarifying the word "equality" will not solve this; we disagree on the *axiology* of equality.

  **2. The Meaning of "Better"**
  *   **Dispute:** P uses "better" to mean "more welfare-weighted value." E uses "better" to mean "more virtue/fairness instantiated."
  *   **Resolution:** This is **partially verbal**. We have resolved this in Section I (Claim 6) by distinguishing "all-things-considered better" from "better in a respect." However, the fight remains over whether the "respect" exists. If E admits the "respect" has no weight in decision-making, P argues the distinction is useless. E argues the distinction is necessary for moral accuracy.

  **3. The Label "Egalitarian"**
  *   **Dispute:** P claims E is actually a Prioritarian who uses different words. E claims P is an Egalitarian who is afraid to admit it.
  *   **Resolution:** **Substantive.** This is a fight about the *explanation* of our shared intuitions. We both want to help the poor. P says we do it because they are low (absolute status). E says we do it because others are high (relative status). The "Separate Worlds" test case (Crux 1) is designed to settle this.

  ---

  ## V. NEXT STEPS
  1.  **Polling:** We will present the "Separate Worlds" case to 50 neutral third parties to see if the intuition of "intrinsic badness" holds when envy is removed.
  2.  **Weighting:** E will attempt to quantify how much welfare should be sacrificed for a unit of equality to determine if the "intrinsic value" is trivial or significant.
  3.  **Review:** We will reconvene in two weeks to review the polling data. If neutrals overwhelmingly side with P on Separate Worlds, E agrees to modify the theory to "Relational Egalitarianism." If neutrals side with E, P agrees to acknowledge a pluralist value theory.

  **Signed,**

  _________________________  
  *Prioritarian Representative*

  _________________________  
  *Telic Egalitarian Representative*
