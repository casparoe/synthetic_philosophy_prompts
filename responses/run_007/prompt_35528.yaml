  ### Summary of Commitments

  To maintain a consistent, principled decision theory that handles self-locating belief:

  1.  **Adopt EAPO:** Rationality is about choosing the best policy from the start, not the best action at the node.
  2.  **Overturn Verdict (5):** You cannot ignore informative signals. A noisy note is better than no note. You must condition your exit probability on the note's content.
  3.  **Affirm Verdict (8):** The Twin case is structurally identical to the Classic AMD. Stick with $p=2/3$.

  This framework gives you a robust lecture narrative: The "puzzle" in all these cases arises from trying to reason from inside the uncertainty (the action stage). The solution is to reason from outside it (the planning stage), treating your future selves (or twins, or wakings) as logical extensions of your current policy.
