answer: |-
  What you are describing is a fascinating and increasingly discussed phenomenon in contemporary moral and political philosophy. While it shares DNA with standard bargaining, the specific configuration you have identified—where the 'currency' of the trade is moral compliance across incommensurable value systems—has a specific name in the literature.

  The most precise label currently in use is **"Moral Trade"** (sometimes referred to as **"Moral Bargaining"**).

  The concept was explicitly formalised by the philosopher Toby Ord in his 2014 paper, *The Moral Trade*, and has since been taken up by figures in the Effective Altruism movement, such as William MacAskill. However, the structural dynamics touch upon much older debates regarding compromise, integrity, and incommensurability.

  Here is an analysis of the concept, its distinctions from related ideas, and the philosophical coherence of the 'gain' involved.

  ### 1. The Mechanism: Comparative Moral Advantage

  To understand why this is distinct from ordinary compromise, it helps to look at the economic logic underpinning it. In standard trade, parties exchange goods based on **comparative advantage**. I make bread, you make cheese; we both value both, but I am better at bread and you at cheese.

  In your example, the 'goods' are not products, but **moral compliance**.
  *   **Agent A** places a high moral disvalue on meat-eating and a low disvalue on flying.
  *   **Agent B** places a high moral disvalue on flying and a low disvalue on meat-eating.

  Ord argues that this creates a opportunity for a **Pareto improvement**. A Pareto improvement occurs when at least one party is made better off without making anyone else worse off. In this scenario, *both* parties are made better off relative to their own moral utility functions.
  *   **A's perspective:** She sacrifices a low-value preference (flying) to secure a high-value outcome (B not eating meat).
  *   **B's perspective:** He sacrifices a low-value preference (meat) to secure a high-value outcome (A not flying).

  Crucially, they do not need to agree on *why* the actions are wrong. They only need to agree on the *behavioural swap*. This bypasses the need for an "overlapping consensus" (to use Rawls's term) regarding the *truth* of the matter, requiring only an overlap in *willingness to act*.

  ### 2. Distinction from Log-Rolling

  You rightly sensed that this is not quite standard political log-rolling. While the mechanism is identical (quid pro quo), the normative texture differs in three key ways:

  *   **Prudential vs. Moral:** Log-rolling is typically understood as prudential or self-interested. A politician votes for a bridge in another constituency not because they value the bridge, but because they want the vote for their own hospital. In Moral Trade, the motivation is explicitly moral. A wants B to stop eating meat *because A believes it is wrong*, not because it benefits A materially.
  *   **The Integrity Constraint:** In log-rolling, no one claims the bridge is 'evil'. In Moral Trade, each party believes the other's default behaviour is morally reprehensible. This raises the stakes regarding **integrity**. As Bernard Williams argued, there is a limit to how far one can negotiate on projects and attitudes that constitute one's moral identity. Log-rolling rarely threatens integrity; Moral Trade potentially does.
  *   **Public vs. Private:** Log-rolling is an institutional mechanism within a legislature. Moral Trade is often informal and interpersonal, occurring in the absence of a shared enforcement framework.

  ### 3. Is the 'Gain' Coherent?

  This is the crux of your philosophical worry. If A believes meat-eating is akin to murder, can she coherently claim a 'gain' from a deal that implies murder is a negotiable commodity?

  There are two ways to analyse the coherence of the gain:

  **A. The Subjective Coherence (Internal Rationality)**
  From the perspective of rational choice theory, the gain is perfectly coherent. Each agent maximises their expected moral value. If A assigns 100 'badness points' to meat and 1 'badness point' to flying, reducing global meat consumption by one unit is a net win, even if it requires tolerating (or engaging in) a trade. The 'gain' is the reduction of the specific badness they prioritise.

  **B. The Objective Coherence (Moral Truth)**
  Here, the waters muddy. If moral truths are agent-neutral (i.e., meat-eating is objectively wrong, regardless of who is looking), then A is essentially accepting a world where B continues to think meat-eating is permissible, provided B doesn't do it.
  *   **The Complicity Objection:** Critics argue that by entering the trade, A legitimises B's framework. It suggests that moral duties are conditional on reciprocity. If A believes "One ought not eat meat" is a categorical imperative, trading on it converts it into a hypothetical imperative ("One ought not eat meat *if* others don't fly").
  *   **The Defence:** Proponents of Moral Trade argue that the *outcome* (less suffering/emissions) matters more than the *purity* of the principle. If the goal is to reduce badness in the world, and trade achieves that more effectively than unilateral abstention, the gain is objectively real in terms of consequences, even if the deontological landscape remains messy.

  ### 4. Relation to *Modus Vivendi*

  You might encounter the term **Modus Vivendi** in your reading. This is a close cousin but distinct. A *Modus Vivendi* is a political arrangement that allows conflicting groups to coexist peacefully despite deep disagreement (e.g., a peace treaty between warring factions).
  *   **Modus Vivendi:** "I won't stop you from doing X, if you don't stop me from doing Y." (Mutual non-interference).
  *   **Moral Trade:** "I will stop doing X, if you stop doing Y." (Mutual restraint).

  Moral Trade is more demanding than a *Modus Vivendi* because it requires active self-sacrifice rather than mere tolerance.

  ### 5. Key Literature and Concepts for Your Module

  To flesh this out in your essays, you should look at the following concepts and authors:

  *   **Toby Ord, 'The Moral Trade' (2014):** This is the primary source for the exact example you gave. He argues that moral trade is not only permissible but often obligatory for consequentialists.
  *   **Amy Gutmann and Dennis Thompson, *The Spirit of Compromise* (2012):** They distinguish between 'bargaining' (splitting differences) and 'principled compromise'. Your example challenges their framework because it looks like bargaining but is driven by principle.
  *   **Incommensurability:** Look at the work of **Joseph Raz** or **Isaiah Berlin**. The trade relies on the fact that values are incommensurable (you can't measure 'animal suffering' against 'carbon emissions' on a single scale), yet trade is still possible.
  *   **Integrity:** **Bernard Williams'** critique of utilitarianism is relevant here. He argues that making an agent responsible for the actions of others (via trade) can violate their personal integrity.

  ### Summary

  The move you have identified is **Moral Trade**. It differs from log-rolling because the currency is moral compliance rather than political favour, and it differs from standard compromise because it does not require a shared metric of value.

  It is coherent to call it a 'gain' if you accept a **consequentialist** framework where the reduction of specific bads (meat/flying) outweighs the procedural bad of negotiating on principles. However, it faces serious challenges from **deontological** perspectives regarding integrity and complicity. It essentially asks whether we value the *purity* of our own moral hands more than the *outcome* of the world when others are involved.

  In British political philosophy, this often lands in the debate between **ideal theory** (what we should do in a just world) and **non-ideal theory** (what we should do in this unjust world). Moral Trade is a quintessential non-ideal theory solution: it accepts that we cannot convince each other of the truth, so we settle for reducing the harm.
