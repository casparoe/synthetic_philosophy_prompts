prompt: |-
  Hi — I'm in a third-year political philosophy module and we've just done a unit on compromise between people with very different value systems. I keep noticing a move I don't have a word for, and I want to know if it has a name and how it relates to the stuff we've covered.

  The setup: two people each think the other is doing something seriously wrong, but each also has some practice the other condemns that they themselves think is basically fine. Example from a seminar: A is a vegetarian who thinks factory farming is an atrocity but doesn't see flying as a big deal; B thinks aviation emissions are the real moral emergency but dosen't see what's wrong with eating meat. They make a deal: A won't fly home for a year, and B goes vegetarian for the same year. By A's lights she's given up something nearly worthless and gained something she cares about enormously (B not eating meat); by B's lights he's done the same in reverse. So both walk away thinking the world is morally better than before, even though they still think each other's underlying values are wrong.

  I've seen this pattern described as a kind of trade or compromise, but it's not exactly either, because there's no shared currency: A thinks B's concession is worth a lot, but B thinks that very same concession is worth almost nothing, and vice versa. Is there an established name for this specific configuration, what are the nearest concepts in the literature, and how does it differ from ordinary political log-rolling or from the worry that moral commitments shouldn't be up for barter? I'm not just after a label — I want to know exactly what the thing is, where its edges are, and whether it's even coherent to call it a 'gain' for both sides.

  Could you answer in British English?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Third-year political philosophy module, unit on compromise between conflicting value systems.
      *   **The Phenomenon:** Two agents (A and B) disagree on fundamental values. Each condemns a practice the other engages in. However, each engages in a practice the other condemns. They swap concessions: A stops doing X (which B hates but A doesn't care much about) and B stops doing Y (which A hates but B doesn't care much about).
      *   **Key Feature:** No shared currency of value. A values B's concession highly, B values A's concession highly. Each thinks they gained more than they lost *according to their own value system*, even though they reject the other's value system.
      *   **Questions:** Is there a name for this? What are the nearest concepts in the literature? How does it differ from log-rolling? Is it coherent to call it a 'gain' for both?
      *   **Constraint:** Answer in British English.

  2.  **Initial Brainstorming & Concept Identification:**
      *   *Log-rolling:* This is the closest political science term. It involves trading votes or support. "I'll support your bill if you support mine." Usually implies self-interest or constituency interest, not necessarily deep moral disagreement. The user specifically asks how this *differs* from log-rolling.
      *   *Compromise:* The user says it's "not exactly either." Standard compromise usually implies meeting in the middle on a shared scale (e.g., splitting the difference on a budget). Here, the scales are different.
      *   *Pareto Improvement:* In economics, a situation where at least one party is better off and no one is worse off. Here, both think they are better off *by their own lights*. This is a strong candidate for the structural description.
      *   *Modus Vivendi:* A political arrangement allowing coexistence despite disagreement. Usually implies tolerance rather than active swapping of behaviours.
      *   *Reciprocal Altruism / Trade:* Too economic/biological.
      *   *Moral Trade:* This seems to be the specific term gaining traction in effective altruism and moral philosophy circles (e.g., Toby Ord, William MacAskill).
      *   *Value Disagreement / Incommensurability:* The core philosophical problem. The values are incommensurable, yet trade happens.
      *   *The "Gain" Problem:* If A thinks meat-eating is murder, is it coherent to say A "gained" by B stopping murder? Yes. But is it coherent to say B "gained" by A stopping flying if B thinks flying is climate suicide? Yes. The coherence issue revolves around whether moral obligations are agent-relative or agent-neutral.

  3.  **Literature Search (Mental Simulation):**
      *   *Toby Ord:* Wrote a paper called "The Moral Trade" (or similar concepts in *The Precipice* / EA forums). He explicitly discusses this vegetarian/flying example.
      *   *William MacAskill:* Discusses "moral trade" in the context of effective altruism.
      *   *David Gauthier:* *Morals by Agreement*. Focuses on rational choice and bargaining, but usually assumes shared rationality constraints.
      *   *John Rawls / Overlapping Consensus:* Not quite. That's about public reason, not private swapping of moral violations.
      *   *Gutmann & Thompson:* *The Spirit of Compromise*. Distinguishes between principled compromise and bargaining.
      *   *Simon May:* *The Power of Compromise*.
      *   *Key Distinction:* Log-rolling is usually prudential (I get a road, you get a bridge). This is *moral* log-rolling.

  4.  **Synthesizing the Answer:**

      *   **The Label:** The most precise contemporary term is **"Moral Trade"** (sometimes "Moral Bargaining"). Toby Ord is the key reference here.
      *   **The Structure:** It relies on **divergent marginal rates of substitution** across different moral frameworks. In economics, trade happens because I value apples more than oranges, and you value oranges more than apples. Here, the "goods" are moral compliance.
      *   **Comparison to Log-rolling:** Log-rolling is typically prudential/self-interested. This is moral. Log-rolling often happens within a shared institutional framework. This happens across moral frameworks.
      *   **The "Gain" Question (Coherence):** This is the philosophical meat.
          *   *Subjective Gain:* Yes, both are better off relative to their own utility functions/moral weightings.
          *   *Objective Gain:* Problematic. If A thinks meat is murder, A cannot logically say "The world is better" unless B's action reduces objective badness. But if B thinks flying is the real badness, they disagree on the *ontology* of the bad.
          *   *Resolution:* It works if we accept **agent-relative permissions** or if we view it as a **Pareto improvement over the status quo** relative to each agent's moral credence.
      *   **Objections:**
          *   *Integrity:* Williams' objection. Compromising on core values might violate integrity.
          *   *Complicity:* By accepting the trade, do I validate the other's immoral framework?
          *   *Enforcement:* How do you police this without a state?

  5.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Academic, precise, slightly conversational but rigorous (suitable for a 3rd-year student).
      *   *Spelling:* Organisation, behaviour, colour, programme, etc.
      *   *Structure:*
          1.  Identify the term ("Moral Trade").
          2.  Explain the economic/philosophical mechanism (comparative advantage in moral compliance).
          3.  Distinguish from Log-rolling.
          4.  Address the "Gain" coherence (Pareto, agent-relativity).
          5.  Discuss objections (Integrity, Complicity).
          6.  Key References (Ord, MacAskill, Gutmann/Thompson).

  6.  **Refining the "Gain" Argument:**
      *   Need to be careful here. If A thinks eating meat is *wrong*, A wants B to stop. If B stops, A is happy. If B thinks flying is *wrong*, B wants A to stop. If A stops, B is happy.
      *   The "gain" is that the total amount of "wrongness" (as perceived by the aggregate of their specific concerns) is reduced.
      *   Wait, is it? If A thinks meat is 100 units of bad, and flying is 1 unit. B thinks flying is 100 units, meat is 1 unit.
      *   Status Quo: 101 bad units each (by their own lights). Total subjective badness: 202.
      *   Trade: A stops flying (cost 1), B stops meat (cost 1).
      *   A's view: Gained 100 (no meat), Lost 1 (no fly). Net +99.
      *   B's view: Gained 100 (no fly), Lost 1 (no meat). Net +99.
      *   So yes, it is a Pareto improvement relative to their subjective moral weightings.
      *   *Crucial nuance:* This only works if they care more about the *outcome* (less meat/flying) than the *principle* (not negotiating on moral truths).

  7.  **Checking British English:**
      *   "Programme" not "program".
      *   "Behaviour" not "behavior".
      *   "Analysing" not "analyzing".
      *   "Centre" not "center".
      *   Vocabulary: "Whilst", " amongst", "favour".

  8.  **Final Review against User Query:**
      *   Did I give a name? Yes (Moral Trade).
      *   Nearest concepts? Yes (Log-rolling, Modus Vivendi, Pareto).
      *   Difference from log-rolling? Yes (Moral vs Prudential).
      *   Coherence of 'gain'? Yes (Subjective vs Objective).
      *   British English? Yes.

  9.  **Self-Correction during drafting:** I initially thought of *Modus Vivendi*. I should mention it but clarify why it's not quite right. *Modus Vivendi* is usually about non-aggression or tolerance (I won't stop you, you won't stop me). This scenario is active cooperation (I will stop *for* you). I need to make sure that distinction is clear. Also, ensure I reference Toby Ord specifically, as he coined/popularised the specific term "Moral Trade" with this exact example.

  10. **Final Polish:** Ensure the distinction between *principled compromise* and *bargaining* is clear, as that's often covered in 3rd-year modules (Gutmann & Thompson).

