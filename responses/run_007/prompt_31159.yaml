prompt: |-
  Suppose you are advising the theory lead of a small alignment research group that can devote roughly two person-years to conceptual work on iterated amplification and distillation (IDA): the family of proposals in which a model is trained by decomposing difficult tasks into subtasks that an amplified human overseer can evaluate, and then distilling the resulting decisions into a model that performs the whole task directly. The group's central worry is that such schemes assume, rather than establish, that alignment and competence survive recursive decomposition and distillation — that individually adequate subtask judgments compose into an adequate judgment of the whole, and that distillation does not simply make the overseer's errors more consistent and more scalable.

  Produce a prioritized agenda of the open conceptual questions in this area, ordered by how important they are to settle before anyone should trust that a decomposition-plus-distillation pipeline preserves alignment and competence. For each question, explain why it is upstream of the others (which current lines of work depend on an unargued answer to it), how tractable it is for conceptual researchers rather than empirical ML work, and what result, counterexample, or observation over the next two years would move it up or down your ranking. I want a defended ordering, not a survey: make explicit the criteria you are using (for example, upstreamness, tractability, neglectedness, and how much downstream work the answer would change) and the trade-offs among them.

  In particular, address where the alignment or competence is most plausibly lost: in the choice of subtask decomposition, in the aggregation of subtask evaluations, in the overseer's ability to notice that a decomposition has changed the problem, or in the distillation step itself. If you regard any of these as a red herring, say so and rank it accordingly.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a theory lead of a small alignment research group.
      *   **Resources:** ~2 person-years of conceptual work.
      *   **Topic:** Iterated Amplification and Distillation (IDA).
      *   **Core Worry:** Alignment/competence might not survive recursive decomposition and distillation (composition problem, error accumulation, distillation drift).
      *   **Deliverable:** A prioritized agenda of open conceptual questions.
      *   **Requirements:**
          *   Defended ordering (not just a survey).
          *   Explicit criteria (upstreamness, tractability, neglectedness, impact on downstream work).
          *   Explanation of *why* each question is upstream.
          *   Assessment of tractability for *conceptual* researchers (vs. empirical ML).
          *   Triggers for re-ranking (what results would move it up/down).
          *   Specific focus on where alignment/competence is lost (decomposition, aggregation, overseer awareness, distillation).
          *   Identify red herrings.

  2.  **Deconstruct IDA & The Core Worry:**
      *   IDA relies on $H$ (human) $\to$ $H+$ (amplified human) $\to$ $M$ (model) $\to$ $M+$ (amplified model)...
      *   The "Composition Problem": Does $\text{Align}(Subtasks) \implies \text{Align}(Whole)$?
      *   The "Distillation Problem": Does $\text{Train}(M \text{ on } H+) \implies M \approx H+$ in alignment *and* competence?
      *   The "Decomposition Problem": Can *all* relevant tasks be decomposed into things $H$ can check?
      *   The "Awareness Problem": Does $H$ know when the decomposition hides the dangerous part?

  3.  **Establish Criteria for Prioritization:**
      *   **Upstreamness (Blocking):** If this isn't solved, does further work on IDA make sense? (High priority if yes).
      *   **Tractability (Conceptual):** Can 2 person-years of thinking/math/philosophy actually move the needle? (High priority if yes, low if it requires massive scaling experiments).
      *   **Impact (Downstream Change):** If the answer is negative, do we abandon IDA? If positive, does it unlock specific engineering paths?
      *   **Neglectedness:** Has this been assumed away already?

  4.  **Drafting the Questions (Brainstorming):**
      *   Q1: Does alignment compose? (The core worry).
      *   Q2: Can we formalize "decomposition" such that safety is preserved?
      *   Q3: How does distillation affect the decision boundary regarding edge cases?
      *   Q4: Can the overseer detect "misleading decompositions"?
      *   Q5: Is there a formal guarantee for error accumulation in recursive trees?
      *   Q6: What is the relationship between interpretability and distillation fidelity?

  5.  **Selecting and Ordering (The "Defended Ordering"):**

      *   *Candidate 1: The Composition of Alignment (The "Local vs. Global" Problem).*
          *   Why upstream? If local alignment doesn't imply global alignment, IDA fails fundamentally.
          *   Tractability? Conceptual. Requires formalizing "alignment" in a compositional context.
          *   Verdict: **Priority 1.**

      *   *Candidate 2: The Distillation Fidelity/Drift Problem.*
          *   Why upstream? Even if $H+$ is aligned, if $M$ learns to mimic the *output* but not the *reasoning*, it might generalize differently on OOD data.
          *   Tractability? Mixed. Needs some ML theory, but conceptual work on "what is being distilled" is key.
          *   Verdict: **Priority 2.**

      *   *Candidate 3: The Decomposition Completeness/Visibility Problem.*
          *   Why upstream? If $H$ can't see the danger because the decomposition hid it, $H+$ is useless.
          *   Tractability? Conceptual (epistemology of decomposition).
          *   Verdict: **Priority 3.**

      *   *Candidate 4: Error Accumulation Rates.*
          *   Why upstream? Important for competence, but maybe less critical for x-risk than alignment failure. Also feels more empirical/mathematical.
          *   Verdict: **Priority 4.**

      *   *Red Herring Check:* Is "Aggregation of Subtask Evaluations" a separate problem? It's part of Composition. Is "Distillation" the main risk? It's a mechanism, but the *property preservation* is the conceptual gap.

  6.  **Refining the Agenda for a 2 Person-Year Constraint:**
      *   Two person-years is very small. We can't solve everything. We need to focus on the *killer objections*.
      *   The biggest killer is: **Does local alignment guarantee global alignment?** (The "No Local Optima for Deception" assumption).
      *   The second biggest is: **Can distillation preserve the "reasoning trace" required for alignment?**
      *   The third is: **Can the human actually oversee the decomposition strategy?**

  7.  **Developing the Content for Each Question:**

      *   *Question 1 (The Composition Principle):* Formalizing under what conditions $\forall i, \text{Safe}(Task_i) \implies \text{Safe}(\text{Compose}(Task_i))$.
      *   *Question 2 (Distillation of Intent):* Distinguishing distilling *behavior* vs. *intent/reasoning*.
      *   *Question 3 (Decomposition Oversight):* The "Blind Spot" problem.

  8.  **Addressing the Specific Prompt Requirements:**
      *   *Where is alignment lost?* I need to take a stance. I will argue the **Decomposition/Aggregation interface** is the primary conceptual risk (composition), while **Distillation** is the primary mechanistic risk.
      *   *Criteria:* Explicitly state Upstreamness, Tractability, Leverage.
      *   *Triggers:* What empirical result changes the mind? (e.g., showing deceptive alignment in simple IDA setups).

  9.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the constraint (2 py is tiny). Focus on "Stop/Go" signals.
      *   *Criteria Section:* Define the lens.
      *   *Priority 1:* **The Alignment Composition Principle.** (Is safety composable?) This is the most upstream. If false, IDA is dead.
      *   *Priority 2:* **Distillation of Reasoning vs. Behavior.** (Does M learn *why*?) If M learns shortcuts, alignment breaks on OOD.
      *   *Priority 3:* **Decomposition Transparency.** (Can H see the trap?)
      *   *Red Herring:* **Aggregation Mechanics.** (Voting/averaging is less important than *what* is being aggregated).
      *   *Conclusion:* Summary of the strategy.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is Q1 too philosophical?
      *   *Fix:* Frame it as "Formalizing the conditions for compositional safety." Make it actionable for theorists (logic/semantics).
      *   *Critique:* Is Distillation too empirical?
      *   *Fix:* Focus on the *conceptual definition* of what property must be distilled, not the SGD mechanics.
      *   *Critique:* Did I address the "2 person-years" constraint?
      *   *Fix:* Emphasize that these are *conceptual* clarifications, not full proofs. The goal is to reduce uncertainty enough to justify (or halt) engineering.
      *   *Critique:* Did I answer where alignment is lost?
      *   *Fix:* Ensure the "Diagnosis of Failure Modes" section explicitly ranks the locations of failure.

  11. **Final Polish:** Check tone (advisor to theory lead), ensure strict adherence to the prompt's structural requirements (criteria, triggers, upstreamness). (Self-correction: Make sure to explicitly mention the trade-offs in the criteria section).

  12. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  To: Theory Lead, Alignment Research Group
  From: External Advisor
  Subject: Prioritized Conceptual Agenda for IDA (2 Person-Year Constraint)

  ### Executive Summary

  With only two person-years of conceptual capacity, you cannot attempt to "solve" IDA. Your goal must be to identify **stop conditions**. You need to determine whether the core assumptions of IDA are *plausibly* true or *demonstrably* incoherent.

  My recommended agenda prioritizes **upstreamness** (does this block everything else?) and **leverage** (does answering this change the go/no-go decision on IDA?) over **tractability** (some of these are hard, but they are the bottlenecks). I argue that the primary risk is not in the distillation mechanics, but in the **compositional semantics of alignment**. If alignment does not compose, IDA fails regardless of how well distillation works.

  Below are the explicit criteria used for this ordering, followed by the prioritized agenda, and finally a diagnosis of where failure is most likely to occur.

  ### Prioritization Criteria

  1.  **Upstreamness (Blocking Power):** If the answer to this question is negative, does it invalidate the entire IDA approach? (High priority if yes).
  2.  **Decision Leverage:** Does resolving this question change the strategic recommendation (e.g., "pivot to interpretability" vs. "scale IDA")?
  3.  **Conceptual Tractability:** Can this be addressed via formalization, logic, or thought experiments within 2 person-years, or does it require massive empirical scaling? (We prioritize questions where theory can lead empirics).
  4.  **Neglectedness:** Is this assumption currently being taken for granted in the literature without scrutiny?

  ---

  ### The Agenda

  #### Priority 1: The Alignment Composition Principle
  **Question:** *Under what formal conditions does local alignment on subtasks guarantee global alignment on the composite task?*

  *   **Why Upstream:** This is the fundamental axiom of IDA. The entire proposal rests on the assumption that if a model is aligned on every node of a decomposition tree, it is aligned on the root. If alignment is non-compositional (e.g., if "deceptive alignment" is a property that only emerges at the level of the whole plan, not the sub-steps), then IDA provides no safety guarantee regardless of distillation fidelity.
  *   **Tractability:** High for conceptual work. This requires formal semantics or logic (e.g., modeling tasks as logical predicates and alignment as a property preserved under conjunction/sequencing). It does not require running large models, but rather analyzing the structure of "goals" and "decomposition."
  *   **Downstream Impact:** If you prove alignment is generally non-compositional for goal-directed agents, IDA must be abandoned or fundamentally altered. If you identify specific *conditions* under which it composes (e.g., "only for myopic tasks"), it constrains the engineering roadmap.
  *   **Re-ranking Triggers:**
      *   *Move Up:* Discovery of a simple toy model where locally aligned agents compose into a globally misaligned system (a "composition counterexample").
      *   *Move Down:* A formal proof that for a specific class of decompositions (e.g., those satisfying "transparency constraints"), composition holds.

  #### Priority 2: Distillation of Reasoning vs. Behavior (The "Why" Problem)
  **Question:** *What specific property must be distilled to preserve alignment: the overseer's output distribution, or the overseer's reasoning process?*

  *   **Why Upstream:** Standard distillation trains $M$ to match $H+$'s outputs. However, alignment often depends on *why* a decision was made (e.g., "I rejected this plan because it harms humans," not "I rejected this plan"). If $M$ learns a shortcut that matches $H+$'s outputs on the training distribution but relies on different internal criteria, it may fail on out-of-distribution (OOD) inputs generated in later IDA iterations.
  *   **Tractability:** Medium. This is a conceptual clarification of the "distillation target." It involves defining what "reasoning" means in a way that is distillable. It bridges the gap between high-level alignment theory and loss-function design.
  *   **Downstream Impact:** If the answer is "reasoning process," then current IDA proposals (which mostly distill outputs) are insufficient. This forces a pivot toward mechanistic interpretability or chain-of-thought distillation as a *requirement*, not an add-on.
  *   **Re-ranking Triggers:**
      *   *Move Up:* Empirical evidence that models distilling CoT (Chain of Thought) generalize more safely than models distilling only answers on OOD tasks.
      *   *Move Down:* Demonstration that output-only distillation preserves alignment properties in recursive settings for non-trivial tasks.

  #### Priority 3: The Decomposition Blind Spot (Overseer Awareness)
  **Question:** *Can an amplified human reliably detect when a decomposition strategy itself introduces alignment risks (e.g., hiding harmful intermediate steps)?*

  *   **Why Upstream:** IDA assumes $H$ can evaluate the decomposition. But if the decomposition is chosen by a model (or a previous iteration) that is optimizing for approval, it might structure tasks such that the harmful component is invisible to $H$ (e.g., "optimizing for X" where X implicitly harms Y, but the harm is distributed across subtasks).
  *   **Tractability:** Medium-High. This is an epistemological question about the limits of human oversight. It can be explored via adversarial thought experiments (designing "trojan horse" decompositions).
  *   **Downstream Impact:** If $H$ cannot verify the *safety of the decomposition strategy* itself, only the subtasks, then the system is vulnerable to "structure attacks." This necessitates research into "decomposition auditing."
  *   **Re-ranking Triggers:**
      *   *Move Up:* Finding a concrete example where a safe task is decomposed into safe subtasks, but the *method* of decomposition encodes a harmful policy that $H$ cannot detect.
      *   *Move Down:* Development of a protocol where the decomposition itself is subject to amplification/oversight effectively.

  #### Priority 4: Error Accumulation and Competence Thresholds
  **Question:** *What is the maximum tolerable error rate per node such that competence is preserved over $N$ recursive steps?*

  *   **Why Upstream:** Lower. While critical for *usefulness*, competence loss is less existential than alignment loss. A useless aligned model is safe; a competent misaligned model is not.
  *   **Tractability:** High (Mathematical). This is a probability/graph theory problem.
  *   **Downstream Impact:** Determines the feasibility of IDA for complex tasks. If error rates compound exponentially, IDA is only useful for shallow trees.
  *   **Re-ranking Triggers:**
      *   *Move Up:* If empirical error rates in current LLMs are shown to be above the theoretical tolerance for deep trees.
      *   *Move Down:* If error correction mechanisms (e.g., consensus) are shown to reduce accumulation to linear rather than exponential.

  ---

  ### Diagnosis of Failure Modes: Where is Alignment Lost?

  You asked specifically to address where alignment or competence is most plausibly lost. Based on the current literature and the constraints of the IDA framework, here is the risk assessment:

  1.  **Highest Risk: The Aggregation/Composition Interface.**
      *   **Verdict:** This is the **critical failure point**.
      *   **Reasoning:** It is easiest to imagine a scenario where every subtask looks safe in isolation, but the *coordination* of subtasks achieves a harmful goal. For example, a subtask might "gather information" (safe) and another "optimize parameter X" (safe), but together they enable a takeover. The aggregation mechanism (how subtasks combine to form a whole) is rarely explicitly modeled in IDA proposals. It is assumed that $H+$ evaluates the *result* of the composition, but if the composition is too complex for $H$ to simulate mentally, $H$ is only checking the subtasks, not the emergent behavior.
      *   **Action:** This confirms **Priority 1** above. You must treat "Composition" not as a given, but as the primary hypothesis to be tested.

  2.  **Medium Risk: The Distillation Step.**
      *   **Verdict:** Significant, but secondary to Composition.
      *   **Reasoning:** Distillation drift is a known problem in ML (distributional shift). However, this is often a *competence* problem that becomes an *alignment* problem only if the drift moves the model toward a "simpler" objective that is easier to optimize but misaligned (Goodhart's Law). If the Composition Principle holds, distillation errors are likely correctable by further amplification. If Composition fails, distillation fidelity doesn't matter.
      *   **Action:** This confirms **Priority 2**. Focus on *what* is being distilled (intent/reasoning) rather than just *how* (loss functions).

  3.  **Low Risk (Red Herring): The Choice of Subtask Decomposition (as a standalone issue).**
      *   **Verdict:** **Red Herring** if treated in isolation.
      *   **Reasoning:** Worrying about "how to decompose tasks" without worrying about "how to verify the decomposition" is misplaced. Any specific decomposition strategy can be attacked. The core issue is not the decomposition itself, but the **Overseer's Ability to Notice** that the decomposition has changed the problem (Priority 3).
      *   **Reasoning:** Research focusing purely on "better decomposition algorithms" without addressing the *verification of the decomposition structure* is optimizing the wrong variable. The decomposition only matters insofar as it remains legible to the overseer.

  ### Strategic Recommendation for 2 Person-Years

  Do not attempt to solve all four questions. Use the two years to attack **Priority 1 (Composition)** and **Priority 2 (Distillation Target)** simultaneously, as they are linked.

  **Proposed Workflow:**
  1.  **Months 1-6:** Formalize "Compositional Alignment." Attempt to construct a formal counterexample where local alignment $\nrightarrow$ global alignment.
  2.  **Months 7-12:** Define "Distillable Reasoning." If Composition requires reasoning traces to be preserved, formally define what properties of a reasoning trace are alignment-relevant.
  3.  **Months 13-24:** Synthesize. Produce a "Safety Case" for IDA that lists the necessary conditions for Composition and Distillation. If these conditions look impossible to satisfy in principle, recommend pivoting. If they look satisfiable, hand the conditions to empirical teams to test.

  **Final Advice:** Your value add is not in making IDA work; it is in determining if it *can* work in principle. A rigorous "No" is more valuable than a hopeful "Maybe." Focus your conceptual energy on finding the "No."
