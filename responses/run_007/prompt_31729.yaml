      *   *Is the "Mark of the Cognitive" section fair?* A&A argue cognitive processes are *intrinsically* different. EMT says they are defined by *function*. This is a clash of definitions.
      *   *What about the "Insulation" charge?* This is crucial. Has EMT been refined so much (trust, glue, endorsement) that Otto is the *only* case? If so, it's weak.

