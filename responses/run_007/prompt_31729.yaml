          *   *Assessment:* Not fatal, but requires robust functionalist commitments.

      *   **2. The "Mark of the Cognitive" (Adams & Aizawa):**
          *   *Argument:* Cognitive processes involve non-derived content. Notebooks have derived content. Therefore, notebooks aren't cognitive.
          *   *Severity:* High (Conceptual).
          *   *Defender Response:* Reject the "mark." Argue content externalism (Putnam/Burge) already blurs this. Or argue that the *process* is cognitive even if the *storage* medium differs.
          *   *Assessment:* If A&A are right about the mark, EMT is dead. But the existence of a unique "mark" is highly contested.

      *   **3. Empirical/Neuroimaging Differences:**
