          *   Fatal: Proof that PP is circular (destroys the argument).
          *   Awkward but survivable: Social extension (just a bullet to bite).
          *   Awkward but survivable: Empirical differences (functionalism handles this).
          *   Methodological Danger: Triviality/Insulation.
      *   *Addressing the Defender's Stance:* Need to channel Clark/Chalmers/Hutchinson/etc. accurately. They usually rely on Functionalism. If you attack EMT, you are often attacking Functionalism.
      *   *Addressing the User's "Personal Persuasion":* Focus heavily on the Parity Principle section.

