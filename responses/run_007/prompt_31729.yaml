  8.  *(Post-Drafting Review)*: Did I answer the specific question about "what would count against this view"? Yes. Did I rank them? Yes. Did I address the defender's likely concession? Yes. Did I address the falsifiability concern? Yes.

      *One key addition:* Make sure to mention the *explanatory power* argument. If EMT doesn't explain anything better than internalism, it violates parsimony (Ockham's Razor). This is a strong "awkward" point.

