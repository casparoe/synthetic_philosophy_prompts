  1. The stalemate arises because researchers confuse levels of explanation, treating the perceptual variability of the letter 'a' as a problem of static storage rather than one of dynamic recognition processes.
  2. Categorization is not a unitary cognitive function but a flexible toolkit, meaning the search for a single "mental representation" is akin to looking for one enzyme to explain all metabolism.
  3. Current experiments fail to settle the debate because they isolate contexts where one strategy dominates, rather than mapping the transition zones where the brain switches between exemplar and prototype processing.
  4. Moving forward requires treating categories as dynamic trajectories in high-dimensional neural state space rather than as fixed checklists or averaged prototypes waiting to be retrieved.
  5. Resolution will come from converging evidence where computational models predict neural activity patterns during categorization tasks with the same precision as structural biology predicts protein folding.
