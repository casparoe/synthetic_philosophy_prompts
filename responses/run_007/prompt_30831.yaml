prompt: |-
  I work in the compliance office of a mid-sized city government. Our office is now required to review and sign off on every vendor-supplied algorithmic tool used in a public service before a contract can proceed: pretrial risk scores, benefits eligibility triage, school assignment, and a model that decides which properties to inspect for housing code violations. The vendors' fairness documentation is typically a few pages claiming the tool is "unbiased," "equally accurate across groups," or "fair by design," without saying what those terms mean or what was traded off to achieve them. We review several such tools a year, the stakes are high, and the reviewers are lawyers and policy analysts, not statisticians: they can read a base rate and a confusion matrix, but they cannot follow the theorems.

  I understand the rough shape of the impossibility results in algorithmic fairness: a risk score cannot simultaneously be calibrated, have equal false positive rates across groups, and have equal false negative rates across groups unless the outcome is equally common in the groups or the prediction is perfect. But I need that result converted into something my office can actually run when a vendor is across the table.

  Please write a reusable audit procedure for evaluating the fairness claims of a proposed algorithmic decision tool. The procedure should be written for a reviewer with no graduate-level statistics. For each step, specify the question to ask, what counts as a sufficient answer, whether an insufficient answer stops the review or merely flags the tool, and where the procedure hands the decision to a person because the remaining question is one of values rather than facts. The procedure should do at least the following: (1) translate vague fairness language into a small set of defined criteria — at minimum demographic parity, equalized odds, equal opportunity, predictive parity, and calibration — using questions the reviewer can put to a vendor about its validation data; (2) check the vendor's claimed criteria for the combinations the impossibility results rule out, and require the vendor to state which criterion it actually optimized and which it knowingly sacrificed; (3) distinguish cases where the impossibility genuinely bites, because base rates differ materially and the tool is imperfect, from cases where it does not, so that the office does not cry "impossible" on every proposal; and (4) produce a short sign-off sheet recording the chosen criterion, the measured tradeoff, and the value judgment that selected it.

  Then run the procedure on three concrete proposals. (a) A pretrial risk score whose vendor claims the score is calibrated and also reports equal false positive rates and equal false negative rates across racial groups; the base rate of the predicted outcome differs materially between the groups, and the tool is known not to be perfect. (b) A benefits eligibility triage tool whose vendor claims both equal positive predictive value across groups and equalized odds; again, the underlying outcome is substantially more common in one group. (c) A housing code inspection model whose vendor claims calibration and equalized odds, but the two neighborhoods it scores have nearly identical base rates and the office wants a single threshold. For each, state what the procedure concludes, what documentation or changes it requires, and where it hands the decision to a person. At least one case should end in a conclusion the office will not like — for example, rejecting a favored vendor or being told that no technical fix can deliver everything the public wants.

  Finally, say plainly what the procedure cannot do: which fairness conflicts it cannot detect, which claims it must take on trust, and where the impossibility results leave open a choice that no procedure can close.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure and case studies:

  1.  **Analyze the Request:**
      *   **User:** Compliance officer in a mid-sized city government.
      *   **Audience:** Lawyers and policy analysts (not statisticians). Can read base rates/confusion matrices, but not theorems.
      *   **Task:** Create a reusable audit procedure for evaluating vendor algorithmic fairness claims.
      *   **Key Requirements:**
          1.  Translate vague fairness language into defined criteria (Demographic Parity, Equalized Odds, Equal Opportunity, Predictive Parity, Calibration).
          2.  Check for impossibility result conflicts (require vendors to state trade-offs).
          3.  Distinguish when impossibility actually applies (base rate differences vs. similarity).
          4.  Produce a sign-off sheet.
          5.  Run the procedure on three specific cases (Pretrial, Benefits, Housing).
          6.  Include an "unliked" conclusion (e.g., rejection or "no technical fix").
          7.  Explicitly state limitations (what the procedure *cannot* do).

  2.  **Deconstruct the Impossibility Theorem (Chouldechova / Kleinberg et al.):**
      *   *Core Concept:* You generally cannot have Calibration + Equalized Odds (Equal FPR & Equal FNR) across groups *unless* Base Rates are equal or Accuracy is perfect.
      *   *Simplified for Non-Stats:* If Group A has a higher rate of the bad outcome than Group B, and the tool makes mistakes, you can't treat them exactly the same way regarding errors *and* meaning of scores simultaneously.
      *   *Application:* The audit needs to force the vendor to pick *one* primary definition of fairness and admit what they are violating.

  3.  **Drafting the Audit Procedure (The "Algorithmic Fairness Intake & Triage Protocol"):**
      *   *Tone:* Bureaucratic but clear. Action-oriented.
      *   *Structure:* Step-by-step workflow.
      *   *Step 1: Define the Outcome.* (What are we predicting?)
      *   *Step 2: Check Base Rates.* (The trigger for impossibility.)
      *   *Step 3: Map Vendor Claims.* (Translate marketing to metrics.)
      *   *Step 4: The Impossibility Check.* (The core logic gate.)
      *   *Step 5: Trade-off Declaration.* (Vendor must admit sacrifice.)
      *   *Step 6: Value Judgment.* (Where humans decide.)
      *   *Sign-off Sheet:* A template for the final record.

  4.  **Developing the Three Case Studies:**
      *   *Case A (Pretrial):* Vendor claims Calibration + Equal FPR + Equal FNR. Base rates differ. Tool imperfect.
          *   *Analysis:* This violates the impossibility theorem directly.
          *   *Conclusion:* Vendor is lying or mistaken. Stop review until they pick one. (This is the "unliked" conclusion - stopping a high-profile tool).
      *   *Case B (Benefits):* Vendor claims Predictive Parity (PPV) + Equalized Odds. Base rates differ.
          *   *Analysis:* Also a conflict. PPV + Equalized Odds usually implies Calibration + Equalized Odds (roughly), which conflicts with differing base rates.
          *   *Conclusion:* Flag for trade-off. Force choice.
      *   *Case C (Housing):* Vendor claims Calibration + Equalized Odds. Base rates *identical*.
          *   *Analysis:* Impossibility theorem *does not* bite here because base rates are equal.
          *   *Conclusion:* Technically feasible. Move to value judgment on threshold.

  5.  **Refining the "Unliked Conclusion":**
      *   Case A is the strongest candidate. Pretrial risk assessment is controversial. If the vendor claims mathematical impossibility, the city cannot sign off. This forces a hard "No" or "Fix this" which vendors hate.

  6.  **Addressing Limitations:**
      *   What can't this do?
      *   It can't check if the *data* is biased (garbage in, garbage out).
      *   It can't decide *which* fairness metric is morally right (that's policy).
      *   It can't detect proxy discrimination (redlining via zip code).
      *   It relies on vendor honesty regarding the validation data.

  7.  **Drafting the Content (Iterative refinement for clarity):**
      *   *Self-Correction on Stats:* Make sure I don't use jargon without defining it in the "Glossary" section of the procedure. Ensure "Calibration" is explained as "A score of 50% means 50% risk for everyone."
      *   *Self-Correction on Impossibility:* Be precise. It's not *all* combinations, but specifically Calibration + Equalized Odds with unequal base rates. Also Predictive Parity + Equalized Odds with unequal base rates.
      *   *Formatting:* Use bolding, boxes, and clear headers to make it look like a manual.

  8.  **Final Review against Constraints:**
      *   Reusable audit procedure? Yes.
      *   No grad-level stats? Yes, defined terms simply.
      *   Specific steps (Question, Sufficient Answer, Stop/Flag, Value Handoff)? Yes.
      *   Three cases run? Yes.
      *   One unliked conclusion? Yes (Case A rejection).
      *   Limitations section? Yes.

  9.  **Final Polish:** Check tone. It needs to be authoritative but humble about the limits of math. (Proceed to generate output).

  *(Self-Correction during drafting Case A)*: I need to make sure I don't just say "Math says no." I need to say "Vendor must provide validation data showing these metrics. If they claim all three, the math won't add up." The audit procedure should catch the inconsistency in the *numbers* provided, not just the claim.
  *(Refinement)*: The prompt asks for a procedure to *ask* the vendor. So the procedure is a checklist for the reviewer to interrogate the vendor.

  *(Refinement on Case C)*: If base rates are identical, Calibration + Equalized Odds *is* possible. This is a crucial distinction to show the procedure isn't just a blanket "No."

  *(Refinement on Limitations)*: Be honest about "Construct Validity." The procedure checks internal consistency, not whether the outcome *should* be predicted.

  10. **Final Output Generation** (incorporating all thoughts).
answer: |-
  # Algorithmic Fairness Intake & Triage Protocol (AFIT-P)
  **Version:** 1.0  
  **Office:** City Compliance & Ethics  
  **Audience:** Legal Counsel, Policy Analysts, Procurement Officers  
  **Purpose:** To evaluate vendor claims of fairness in algorithmic decision tools and identify mathematically impossible promises before contract signing.

  ---

  ## Part 1: The Audit Procedure

  ### Glossary of Terms (For Reviewers)
  *   **Base Rate:** How common the outcome is in a group (e.g., % of Group A that misses court vs. % of Group B).
  *   **Calibration:** If the tool says "10% risk," does 10% of *every* group actually experience the outcome?
  *   **False Positive Rate (FPR):** Of the people who *would not* have done the bad thing, how many did the tool flag as high risk?
  *   **False Negative Rate (FNR):** Of the people who *would* have done the bad thing, how many did the tool miss?
  *   **Equalized Odds:** Both FPR and FNR are equal across groups.
  *   **Predictive Parity:** If the tool flags someone as high risk, is the chance they actually do the bad thing the same across groups? (Also called Precision).

  ---

  ### Step 1: Define the Outcome and Groups
  **Question to Vendor:** "What is the specific target variable you are predicting (e.g., 'failure to appear'), and which protected demographic groups (e.g., Race, Gender) have you validated the tool against?"
  *   **Sufficient Answer:** A clear definition of the "positive" outcome and a breakdown of performance metrics by specific demographic groups.
  *   **Insufficient Answer:** Vague terms like "public safety risk" without operational definition, or refusal to break down data by demographics.
  *   **Action:** **STOP.** Do not proceed until the outcome and groups are defined.
  *   **Value Handoff:** None. This is factual clarity.

  ### Step 2: Check Base Rates
  **Question to Vendor:** "What is the base rate of the outcome for each group in your validation dataset?"
  *   **Sufficient Answer:** Specific percentages (e.g., Group A: 15%, Group B: 5%).
  *   **Insufficient Answer:** "We don't track that," or "The rates are similar."
  *   **Action:** **FLAG.** If base rates differ by more than 5 percentage points, proceed to Step 3 (Impossibility Check). If they are nearly identical, the impossibility results likely do not apply.
  *   **Value Handoff:** None. This is a mathematical trigger.

  ### Step 3: Map Fairness Claims to Metrics
  **Question to Vendor:** "You claim the tool is 'fair.' Which specific statistical criteria does it meet? Select from: Calibration, Equalized Odds (Equal FPR & FNR), Equal Opportunity (Equal FNR only), or Predictive Parity."
  *   **Sufficient Answer:** Vendor selects specific metrics and provides the numbers (e.g., "We optimized for Calibration. FPR differs by group.").
  *   **Insufficient Answer:** "It is fair by design," "It meets all standards," or "It is unbiased."
  *   **Action:** **FLAG.** "Fair by design" is not a metric. Require specific metric selection.
  *   **Value Handoff:** None.

  ### Step 4: The Impossibility Check (The "Triangle" Rule)
  **Instruction to Reviewer:** Compare the Vendor's Claims (Step 3) against the Base Rates (Step 2).
  *   **Rule:** If Base Rates differ materially **AND** the tool is not 100% accurate:
      *   The tool **CANNOT** simultaneously have: **Calibration + Equalized Odds.**
      *   The tool **CANNOT** simultaneously have: **Predictive Parity + Equalized Odds.**
  *   **Question to Vendor:** "Your validation shows different base rates. You claim [Metric X] and [Metric Y]. These are mathematically incompatible. Which one is the primary optimization goal, and which one are you allowing to vary?"
  *   **Sufficient Answer:** "We prioritized Calibration. Consequently, False Positive Rates are higher for Group B. Here is the table showing the trade-off."
  *   **Insufficient Answer:** Insisting both metrics are met without showing perfect accuracy or equal base rates.
  *   **Action:** **STOP.** If the vendor insists on incompatible metrics, the validation data is flawed or the claim is false. The contract cannot proceed until the claim is corrected.
  *   **Value Handoff:** **YES.** Once the vendor admits the trade-off (e.g., "We chose Calibration over Equal Error Rates"), the review hands the decision to the City. The City must decide if that trade-off is acceptable policy.

  ### Step 5: Threshold & Deployment Review
  **Question to Vendor:** "Given the trade-off identified in Step 4, what decision threshold are you recommending? Does this threshold result in a higher selection rate for one group over another?"
  *   **Sufficient Answer:** A specific cutoff score and the resulting % of each group selected/flagged.
  *   **Insufficient Answer:** "The algorithm decides the threshold."
  *   **Action:** **FLAG.** Record the disparate impact of the threshold.
  *   **Value Handoff:** **YES.** The City must decide if the disparate impact of the chosen threshold is legally and ethically defensible.

  ---

  ### Sign-Off Sheet (To be completed by Compliance Officer)

  | Field | Entry |
  | :--- | :--- |
  | **Vendor/Tool Name** | |
  | **Outcome Predicted** | |
  | **Base Rate Difference?** | [ ] Yes (Impossibility applies) [ ] No (Impossibility does not apply) |
  | **Primary Fairness Metric** | (e.g., Calibration) |
  | **Sacrificed Metric** | (e.g., Equal False Positive Rate) |
  | **Vendor Acknowledgement** | [ ] Vendor has signed off that they cannot optimize both metrics simultaneously. |
  | **Policy Decision Required** | Does the City accept [Sacrificed Metric] variance to achieve [Primary Metric]? |
  | **Final Recommendation** | [ ] Approve [ ] Approve with Conditions [ ] Reject |
  | **Reviewer Signature** | |

  ---

  ## Part 2: Case Studies

  ### Case A: Pretrial Risk Assessment
  **Context:** Vendor claims the score is **Calibrated** (a score of 5 means 5% risk for everyone) AND reports **Equal False Positive Rates** and **Equal False Negative Rates** across Black and White defendants.
  **Data:** Base rate of failure to appear is 12% for Group A and 6% for Group B. Tool accuracy is not perfect.

  **Procedure Run:**
  1.  **Step 1 (Outcome):** Defined (Failure to Appear). **Pass.**
  2.  **Step 2 (Base Rates):** 12% vs 6%. Material difference. **Trigger Impossibility Check.**
  3.  **Step 3 (Claims):** Vendor claims Calibration + Equalized Odds (Equal FPR & FNR).
  4.  **Step 4 (Impossibility Check):**
      *   *Logic:* With unequal base rates and imperfect accuracy, Calibration + Equalized Odds is mathematically impossible.
      *   *Interrogation:* Reviewer asks vendor to reconcile the claim.
      *   *Vendor Response:* Vendor insists their validation study shows both are true within "statistical noise."
      *   *Reviewer Analysis:* The gap (12% vs 6%) is too large for "noise." The math does not hold.
  5.  **Conclusion:** **STOP.** The vendor's technical documentation is factually inconsistent.
  6.  **Required Documentation:** Vendor must re-run validation and admit which metric is actually being met (likely Calibration, with unequal error rates, or vice versa).
  7.  **Value Handoff:** None yet. This is a factual failure, not a policy choice.
  8.  **Final Recommendation:** **REJECT.** The office cannot sign off on a tool claiming mathematical impossibility. The vendor must return with honest metrics.
      *   *Note:* This is the "unliked" conclusion. The department wants the tool, but the math says the vendor is lying or incompetent.

  ### Case B: Benefits Eligibility Triage
  **Context:** Tool prioritizes applications for expedited review. Vendor claims **Equal Positive Predictive Value (Predictive Parity)** (if flagged, likelihood of eligibility is same) AND **Equalized Odds** (error rates equal).
  **Data:** Eligibility is substantially more common in Group A (30%) than Group B (10%).

  **Procedure Run:**
  1.  **Step 1 (Outcome):** Defined (Eligibility). **Pass.**
  2.  **Step 2 (Base Rates):** 30% vs 10%. Material difference. **Trigger Impossibility Check.**
  3.  **Step 3 (Claims):** Vendor claims Predictive Parity + Equalized Odds.
  4.  **Step 4 (Impossibility Check):**
      *   *Logic:* Predictive Parity + Equalized Odds is also incompatible with unequal base rates (unless perfect accuracy).
      *   *Interrogation:* Reviewer asks vendor to choose.
      *   *Vendor Response:* Vendor admits they optimized for Predictive Parity to ensure budget efficiency. Equalized Odds were not met; Group B has a higher False Negative Rate (more eligible people missed).
  5.  **Conclusion:** **FLAG.** The claim is now consistent, but reveals a trade-off.
  6.  **Required Documentation:** Vendor must submit a "Trade-off Impact Statement" quantifying how many more eligible Group B applicants are missed compared to Group A.
  7.  **Value Handoff:** **HIGH.** The Compliance Office cannot decide if missing eligible Group B applicants is acceptable to ensure budget efficiency.
  8.  **Final Recommendation:** **HAND TO POLICY MAKER.** The sign-off sheet records: "Vendor optimized Predictive Parity. Sacrificed Equal Opportunity. City must decide if higher miss-rate for Group B is acceptable."

  ### Case C: Housing Code Inspection Model
  **Context:** Model predicts likelihood of severe code violations to prioritize inspections. Vendor claims **Calibration** and **Equalized Odds**.
  **Data:** The tool scores two neighborhoods. Base rates of severe violations are nearly identical (8.1% vs 8.2%). Office wants a single threshold for both.

  **Procedure Run:**
  1.  **Step 1 (Outcome):** Defined (Severe Violation). **Pass.**
  2.  **Step 2 (Base Rates):** 8.1% vs 8.2%. **No Material Difference.**
  3.  **Step 3 (Claims):** Calibration + Equalized Odds.
  4.  **Step 4 (Impossibility Check):**
      *   *Logic:* Because base rates are effectively equal, the impossibility theorem **does not bite.** It is mathematically possible to have both metrics here.
  5.  **Conclusion:** **PASS (Technical).** The vendor's claim is not mathematically suspect.
  6.  **Required Documentation:** Standard validation report confirming the metrics hold in the specific deployment context.
  7.  **Value Handoff:** **LOW.** The technical conflict is resolved. The decision rests on whether the *outcome* (inspections) is the right use of resources, not the fairness math.
  8.  **Final Recommendation:** **APPROVE (Technical).** The fairness metrics are compatible. Proceed to legal review of privacy/data usage.

  ---

  ## Part 3: Limitations of This Procedure

  As Compliance Officers, we must be plain about what this audit **cannot** do. Signing this sheet does not absolve the city of risk in the following areas:

  1.  **Construct Validity (The "Right Question" Problem):**
      *   This procedure checks if the math is consistent. It does **not** check if the outcome being predicted is appropriate.
      *   *Example:* In Case A (Pretrial), the tool might be perfectly "Calibrated" at predicting "Failure to Appear." But if "Failure to Appear" is used as a proxy for "Dangerousness," the tool is valid mathematically but invalid policy-wise. This procedure cannot detect that conceptual error.

  2.  **Proxy Discrimination:**
      *   We check metrics by reported demographic groups (Race, Gender). We **cannot** detect if the model uses other variables (e.g., Zip Code, Phone Type, Shopping History) to reconstruct those groups and discriminate without triggering our group-based metrics.

  3.  **Data Integrity Trust:**
      *   We must take the vendor's validation data on trust. If the vendor trained on biased historical data (e.g., arrest records rather than crime occurrence) and validated on the same, the metrics will look "consistent" but will encode historical injustice. This procedure checks internal consistency, not external truth.

  4.  **The "Which Fairness?" Choice:**
      *   The impossibility results prove we cannot have it all. This procedure forces the vendor to admit what they sacrificed. **It does not tell us which sacrifice is morally right.**
      *   *Example:* In Case B, choosing Predictive Parity over Equal Opportunity is a political choice about whether we value budget efficiency (not wasting checks on ineligible people) or equity (making sure eligible people get help). No audit procedure can solve that; it only ensures the choice is made consciously rather than accidentally.

  5.  **Dynamic Feedback Loops:**
      *   This audit is a snapshot in time. It cannot predict how the tool will change the world once deployed. (e.g., If we inspect Neighborhood C more often because the model says so, we will find more violations there, which makes the model predict more violations there next year). This procedure cannot detect self-fulfilling prophecies.

  **Final Note to Reviewers:**
  Your job is not to prove the tool is "fair" in an absolute sense. Your job is to ensure the vendor is not selling magic, that the trade-offs are visible, and that the elected officials or department heads are the ones making the value judgments, not the software. If the vendor says "The algorithm decided," use this procedure to reply: "The algorithm cannot decide values. Humans must."
