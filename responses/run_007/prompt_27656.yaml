prompt: |-
  I serve on the Governance Committee of my university's Faculty Senate. We are in the midst of a comprehensive revision of the Senate's bylaws, and we have hit a procedural puzzle that has split the committee into three camps.

  The current bylaws include Article XII, which reads: "These bylaws may be amended by a majority vote of the Senate." One of the revision proposals would replace Article XII with a new provision requiring a two-thirds supermajority for any future amendment. The proposal's advocates argue that the bylaws are presently too easy to alter and that a higher threshold would lend stability to the Senate's governance structure. The proposal has considerable support, and we expect it to reach the Senate floor.

  The puzzle is this: under what voting threshold should the Senate itself vote on this proposal? If we apply the existing majority-vote rule, then a bare majority could enact a supermajority requirement — which appears to let a transient majority entrench a rule that future majorities cannot undo. If we instead require a two-thirds vote to adopt the proposal (on the grounds that the proposal concerns the amendment rule itself), we are applying a rule that has not yet been adopted, which seems circular. A third faction argues that Article XII cannot be amended at all — that the amendment rule is in some sense unrevisable — but the bylaws contain no entrenchment clause to that effect, and it is unclear where such a prohibition would come from.

  The Committee Chair has asked me to draft a short written opinion, to be circulated before our next meeting, recommending how to resolve this. The opinion should propose a concrete procedure for the Senate to follow, explain the reasoning behind it, and address the strongest considerations on the losing sides. Please draft this memo.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Governance Committee of a university's Faculty Senate.
      *   **Task:** Draft a short written opinion (memo) to the Committee Chair.
      *   **Context:** Comprehensive revision of Senate bylaws.
      *   **The Problem:** A proposal to change the amendment threshold from a simple majority (Article XII) to a two-thirds supermajority.
      *   **The Puzzle:** What voting threshold applies *to the vote on this specific proposal*?
          *   Option A: Simple Majority (current rule). Risk: Entrenchment by a transient majority.
          *   Option B: Two-Thirds (proposed rule). Risk: Circularity/Applying a rule not yet in force.
          *   Option C: Unamendable. Risk: No textual basis, undemocratic.
      *   **Requirements:** Propose a concrete procedure, explain reasoning, address counterarguments from the other two camps.
      *   **Tone:** Professional, legalistic but accessible, persuasive, neutral/objective (as an advisor), decisive.

  2.  **Deconstruct the Legal/Procedural Issue:**
      *   This is a classic problem in constitutional theory and parliamentary procedure (often called the "paradox of amendment" or "self-embracing sovereignty").
      *   *Key Principle:* The procedure for changing a rule is governed by the rule *currently in effect*, not the rule being proposed.
      *   *Analogy:* Changing the speed limit. You don't need to drive at the new speed limit to vote for it; you follow the current legislative process to enact the new limit.
      *   *Entrenchment Concern:* Yes, a simple majority *can* bind future majorities. This is a feature, not a bug, of most amendment clauses unless explicitly prohibited. Stability often requires making changes harder than enactment.
      *   *Circularity:* Requiring 2/3 to pass a 2/3 rule is logically flawed because the 2/3 requirement doesn't exist yet.
      *   *Unamendability:* Unless there's a "eternity clause" (rare in private org bylaws), the amendment power usually includes the power to amend the amendment power.

  3.  **Determine the Recommendation:**
      *   **Recommendation:** Vote under the *current* Article XII (Simple Majority).
      *   **Why?** It's the only legally coherent path. The existing bylaws are the binding contract/procedure until changed. To require 2/3 now is to act without authority. To say it's unamendable is to ignore the text.
      *   **Mitigation:** Acknowledge the "entrenchment" concern but frame it as a policy choice for the Senate to weigh, not a procedural bar.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on voting threshold for Article XII revision).
      *   **Recommendation:** Be direct. The vote should proceed under the existing simple majority rule.
      *   **Reasoning (The "Why"):**
          *   *Validity of Existing Rules:* The current bylaws are the operative law. Article XII governs *all* amendments, including itself.
          *   *Logical Consistency:* You can't apply a rule that doesn't exist yet (circularity).
          *   *Precedent/General Practice:* Parliamentary procedure (Robert's Rules) and constitutional theory generally support the "current rule applies" view.
      *   **Addressing Counterarguments (The "Three Camps"):**
          *   *Camp 1 (Supermajority for this vote):* Address the circularity. If we need 2/3 to pass a 2/3 rule, did we need 3/4 to pass that? Infinite regress.
          *   *Camp 2 (Unamendable):* Address the text. No "eternity clause." Limiting the Senate's power to govern itself is dangerous.
          *   *Camp 3 (The Entrenchment Worry - Majority binding Future Majority):* Acknowledge this is the strongest policy concern. However, it's a substantive argument against the *merits* of the change, not a procedural bar to the *vote*. The Senate can reject the proposal if they dislike the outcome, but the threshold to decide is still majority.
      *   **Conclusion:** Reiterate the path forward.

  5.  **Refining the Tone:**
      *   Needs to sound like a Governance Committee member speaking to colleagues.
      *   Avoid overly dense legalese, but use precise terms (e.g., "operative," "procedural validity," "substantive merits").
      *   Ensure the distinction between *procedure* (how we vote) and *policy* (what we vote on) is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the entrenchment argument dismissed too easily?
      *   *Fix:* Strengthen the section on entrenchment. Acknowledge that while procedurally valid, the Senate should debate the *wisdom* of entrenchment vigorously. The procedure allows the vote; the debate determines the outcome.
      *   *Critique:* Is the memo too long?
      *   *Fix:* Keep it tight. Use headings.
      *   *Critique:* Did I answer the specific prompt?
      *   *Fix:* Check against requirements: Concrete procedure? Yes. Reasoning? Yes. Address losing sides? Yes.

  7.  **Final Polish:** Check for clarity and flow. (The resulting draft matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee Chair
  **FROM:** [Your Name], Governance Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Recommendation Regarding Amendment of Article XII

  **Introduction**

  The Committee faces a threshold question regarding the proposed revision to Article XII of the Faculty Senate Bylaws. The proposal seeks to raise the amendment threshold from a simple majority to a two-thirds supermajority. The Committee is divided on what voting threshold should apply to the adoption of this proposal itself.

  This memo recommends that the Senate vote on the proposal under the **existing simple majority standard** set forth in the current Article XII. While the policy implications of entrenchment are significant, they relate to the *merits* of the proposal, not the *procedure* for voting on it.

  **Recommendation**

  The Senate should proceed under the rule currently in force. Therefore, the proposal to amend Article XII requires only a **simple majority vote** for adoption. Once adopted, the new two-thirds requirement would apply to all *subsequent* amendments.

  **Reasoning**

  This recommendation rests on three pillars of procedural logic and parliamentary authority:

  1.  **Operative Authority:** Until a bylaw is amended, the existing text constitutes the binding procedural law of the Senate. Current Article XII states unequivocally: "These bylaws may be amended by a majority vote of the Senate." It does not exempt itself from this provision. To require a different threshold for this specific vote would be to act without textual authority.
  2.  **Avoidance of Circularity:** Requiring a two-thirds vote to adopt a two-thirds rule creates a logical paradox. If the new rule must be satisfied to bring itself into existence, the Senate would effectively need to satisfy a rule that is not yet law. This leads to an infinite regress (e.g., if we require the proposed standard to pass the proposal, would we need a new standard to pass *that* standard?). Procedural validity requires that the "rules of the game" in effect at the time of the vote govern the vote.
  3.  **Amendability of Amendment Clauses:** In the absence of an explicit "eternity clause" (a provision stating the amendment rule itself cannot be changed), standard parliamentary interpretation holds that the power to amend includes the power to modify the amendment process. To declare Article XII unamendable would be to judicially legislate a restriction the Senate did not write, thereby limiting the Senate's sovereign authority to govern its own procedures.

  **Addressing Counterarguments**

  I recognize the Committee is split into three camps. While I recommend the path above, the concerns of the other factions warrant specific address:

  *   **To those arguing for a Two-Thirds Vote on this Proposal:**
      Your concern is likely one of fairness: a rule making future changes harder should itself be hard to pass. However, this conflates the *substantive weight* of the change with the *procedural mechanism* to enact it. If the Senate believes this change is significant enough to warrant broad consensus, the remedy is to persuade more members to vote "yes," not to alter the counting rule mid-stream. Applying the proposed rule before it is adopted sets a dangerous precedent where any proposal could claim its own requirements apply to its passage.

  *   **To those arguing Article XII is Unamendable:**
      Your concern is the protection of minority rights against transient majorities. However, declaring the amendment clause unamendable lacks textual basis. Furthermore, freezing the amendment process could render the bylaws brittle and unable to adapt to future exigencies. The safeguard against rash entrenchment is not procedural prohibition, but robust debate on the Senate floor regarding the wisdom of the change.

  *   **To those concerned about "Entrenchment" (The Majority Binding the Future):**
      This is the strongest policy objection. It is true that a simple majority today could restrict the power of a simple majority tomorrow. However, this is a feature of most constitutional systems, designed to promote stability. The procedural question is *how* we decide; the policy question is *what* we decide. If the Senate believes entrenchment is undesirable, they should vote down the proposal. But they must be allowed to make that decision using the only valid voting mechanism we currently possess: the simple majority.

  **Conclusion**

  To ensure the legal validity of our bylaws and avoid procedural contradictions, the Committee should advise the Senate that the vote on the Article XII revision must be conducted under the current simple majority rule. This approach respects the text as it stands, avoids logical circularity, and preserves the Senate's authority to determine its own governance structure.

  I am available to discuss this reasoning further at our next meeting.
