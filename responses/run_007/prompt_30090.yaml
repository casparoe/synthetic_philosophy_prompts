      *   *Critique:* Make sure to address "eternity clauses" specifically, not just rigid constitutions.
      *   *Correction:* Eternity clauses are the hard case. They explicitly deny the future's right to choose. This leans heavily on the "Collective Agent" or "Objective Morality" justification.
      *   *Tone:* Keep it analytical, philosophical, and legal-theoretical. Avoid taking a normative stance on whether eternity clauses are *good*, focus on whether they are *coherent*.

  5.  **Final Polish:** Check for flow, clarity, and ensure all parts of the prompt are addressed. (The resulting essay should follow the structure developed in step 3).

