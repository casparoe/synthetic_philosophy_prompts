answer: |-
  # A Taxonomy of Responses to the Paradox of Deontology

  The following tree maps the logical space of responses to Samuel Scheffler's paradox. It begins with the fundamental metaphysical question of whether the tension is real, then branches into structural and justificatory commitments.

  ### **Root Question: Does the paradox reveal a genuine theoretical defect in deontology, or merely an apparent one?**

  *   **BRANCH 1: It is merely an apparent problem (The tension dissolves).**
      *   **Diagnostic Question:** *Does the dissolution require abandoning deontological constraints or modifying them?*
          *   **Path A: Abandon Constraints.**
              *   **Position:** **Consequentialist Dissolution**
              *   **The Bullet to Bite:** We must accept that the distinction between "doing" and "allowing" has no intrinsic moral significance, even if it violates deep-seated intuitions.
          *   **Path B: Modify Constraints.**
              *   **Position:** **Agent-Centered Prerogatives (Scheffler's Hybrid)**
              *   **The Bullet to Bite:** We must grant agents a permission to act sub-optimally (letting more violations occur) without a corresponding duty to prevent those violations, which risks making morality seem self-indulgent.

  *   **BRANCH 2: It is a genuine problem (The tension requires substantive justification).**
      *   **Diagnostic Question:** *Do deontological constraints admit of exceptions when the aggregate violation of rights becomes sufficiently large?*
          *   **Path A: Yes, constraints have thresholds.**
              *   **Position:** **Threshold Deontology**
              *   **The Bullet to Bite:** We must identify a non-arbitrary number of victims (e.g., 1,000 vs. 1) at which absolute rights suddenly collapse into a consequentialist calculus.
              *   *[Note: Logically Possible but Unoccupied]* **The "Sliding Scale" View:** A view where the strength of the constraint diminishes gradually with each additional life saved rather than hitting a hard threshold. *Why Unoccupied:* This is rarely defended because it effectively collapses into consequentialism; if the constraint weakens with every additional life, there is no distinctively deontological "stop" point, making the view unstable.
          *   **Path B: No, constraints are absolute.**
              *   **Diagnostic Question:** *Is the primary value grounding the constraint located in the **agent's** moral integrity or the **patient's** inviolable status?*
                  *   **Path B1: The Agent's Integrity (Agent-Relative Focus).**
                      *   **Position:** **Integrity-Based Deontology (Williams)**
                      *   **The Bullet to Bite:** We must accept that an agent is not responsible for minimizing badness in the world if doing so requires them to compromise their own deepest projects and commitments.
                  *   **Path B2: The Patient's Status (Agent-Neutral/Inviolability Focus).**
                      *   **Position:** **The Inviolability or Status View (Kamm/Nozick)**
                      *   **The Bullet to Bite:** We must accept that it is better for five people to die than for one person to be used, because the world is morally better when persons are "inviolable" even if that inviolability leads to more deaths.
                      *   *[Note: Logically Possible but Unoccupied]* **Agent-Neutral Absolute Constraints:** A view claiming rights are agent-neutral values but forbid aggregation without reference to status or integrity. *Why Unoccupied:* This is generally considered incoherent; if the value of rights is truly agent-neutral (everyone counts equally from a god's-eye view), rationality seems to demand minimizing violations, pushing the view back toward consequentialism unless "status" is added.

  ---

  ### **Notes on Indistinguishable Positions**

  **The Pair:** *The Inviolability/Status View (Kamm)* and *The Contractualist Response (Scanlon)*.

  **The Problem:** In the context of the paradox, these two positions often yield identical practical verdicts (forbid killing the one to save the five) and both rely on a non-consequentialist valuation of persons. In a standard tree structure, they often occupy the same leaf under "Patient-Focused Absolute Constraints."

  **The Distinguishing Diagnostic Question:** *Is the constraint grounded in the **metaphysical nature** of persons (their inherent worth) or the **terms of social cooperation** (what no one could reasonably reject)?*

  *   **Why this matters:** The Inviolability View suggests the constraint exists even on a desert island with no possibility of cooperation; the Contractualist Response suggests the constraint is binding because it is a principle required for mutual recognition among rational agents. Without this question, the tree conflates a metaphysical claim with a political/moral-constructivist claim.

  ### **Guide for Discussion Leaders**

  *   **For the "Apparent" Branch:** Push students on whether Scheffler's Hybrid view actually solves the paradox or just sidesteps it. Does giving a *prerogative* to save oneself explain why one has a *duty* not to kill the one to save the five?
  *   **For the "Threshold" Branch:** Ask students to propose a threshold. If they suggest "one million lives," ask what happens at 999,999. This highlights the "Bullet to Bite" regarding arbitrariness.
  *   **For the "Inviolability" Leaf:** This is often the hardest for undergraduates. Press them on Kamm's claim that a world where rights are violated less often is not necessarily a "better" world if the violations that do occur are intentional transgressions of status.
