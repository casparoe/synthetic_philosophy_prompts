answer: |-
  This is a classic "Hardline Gricean Minimalist" package. It's internally coherent enough to publish, but it sits on a fault line that has cracked open in the last 20 years of pragmatics (specifically the debate between Minimalism and Contextualism/Relevance Theory). You are effectively committing to the view that semantics is truth-conditional and lean, while pragmatics does all the heavy lifting for communication.

  Here is the audit of the tensions, ranked by severity.

  ### 1. The Severity Ranking

  **1. High Severity: (2) vs. (4) — The "Default" Problem**
  *   **The Tension:** View (2) claims "what is said" is minimal (semantic + reference). View (4) claims Generalized Conversational Implicatures (GCIs) like *some* $\rightarrow$ *not all* are pragmatic but arise by *default* (without special context).
  *   **The Commitment:** You are committed to saying that when a speaker utters "Some students passed," the proposition *Some but not all students passed* is not what is said, even though it is the standard, automatic inference.
  *   **The Risk:** If an inference is default, automatic, and universal, it begins to look indistinguishable from semantic content. This puts pressure on (6) (Occam's Razor). If the pragmatic explanation requires positing a "default" mechanism that functions exactly like a semantic rule, (6) suggests you should just make it semantic. This is the primary attack vector for Contextualists and Semantic Minimalists who reject GCIs.

  **2. Medium Severity: (3) vs. (4) — The "Calculation" Problem**
  *   **The Tension:** View (3) requires implicatures to be *calculable* via the maxims. View (4) says GCIs arise by *default*.
  *   **The Commitment:** You are committed to the claim that even default inferences are, in principle, derivable from the Cooperative Principle.
  *   **The Risk:** Psychological plausibility. If GCIs are automatic defaults, speakers aren't actually running a Gricean derivation every time. If they aren't deriving it, in what sense is it "calculable"? This makes (3) look like a rational reconstruction rather than a processing model, which weakens its explanatory power.

  **3. Low Severity: (1) vs. (5) — The "Pretense" Problem**
  *   **The Tension:** View (1) defines speaker meaning via intentions. View (5) says in irony/metaphor, the speaker only "goes through the motions" of saying the literal content.
  *   **The Commitment:** You are committed to the claim that in irony, the speaker does *not* speaker-mean the literal content (because they lack the intention for the audience to believe it), but they still exploit the literal content to generate an implicature.
  *   **The Risk:** This is standard Grice, but the phrase "goes through the motions" is notoriously vague. It risks creating a category of "quasi-saying" that isn't fully defined by (1). However, as long as you maintain that *saying* is distinct from *speaker-meaning*, this is manageable.

  **4. Negligible Tension: (2) & (6)**
  *   These two are allies. (6) is the methodological justification for (2). They reinforce each other rather than creating tension.

  ---

  ### 2. The Cheapest Fixes

  **For (2) vs. (4) (The Default Problem):**
  *   **Fix:** Double down on **cancellability** as the litmus test.
  *   **Implementation:** Explicitly state that while GCIs are *default*, they lack the *non-detachability* and *uncancellability* of semantic content. Emphasize that "Some, and possibly all" is a coherent utterance, whereas a semantic contradiction is not. This uses (3) to protect (4) against (2).

  **For (3) vs. (4) (The Calculation Problem):**
  *   **Fix:** Weaken "calculable" to **"reconstructible."**
  *   **Implementation:** Clarify that (3) does not require speakers to consciously perform the derivation in real-time. It only requires that a rational observer *could* reconstruct the inference based on the maxims. This aligns your view with neo-Griceans (like Levinson) without abandoning Grice.

  **For (1) vs. (5) (The Pretense Problem):**
  *   **Fix:** Distinguish **"saying"** from **"making as if to say."**
  *   **Implementation:** Be precise in your paper that in cases of irony, the literal content is *not* "what is said" in the strict Gricean sense, but rather "what is made as if to say." This prevents the literal content from contaminating your definition of "what is said" in (2).

  ---

  ### 3. The Single Revision That Cleans Up the Most

  **Revise (3): The Calculability Condition.**

  *   **Current:** "Conversational implicatures have to be calculable from something like the Cooperative Principle and the maxims..."
  *   **Revision:** "Conversational implicatures must be **rationally reconstructible** from the Cooperative Principle and the maxims, even if they arise via heuristic shortcuts in processing."
  *   **Why:** This single move defuses the tension with (4) (GCIs). It allows you to keep GCIs as pragmatic (saving (2) and (6)) without committing to the implausible claim that listeners perform a full logical derivation for every default inference. It bridges the gap between Grice's original logic and modern psycholinguistic reality. It also protects (5), as ironic interpretations can be seen as reconstructible responses to maxim violations, even if processed quickly.

  ---

  ### 4. The Nuclear Option: If Something Has to Go

  **Drop (4): Generalized Conversational Implicatures are genuine implicatures.**

  *   **The Move:** Treat scalar inferences (like *some* $\rightarrow$ *not all*) as **Particularized Conversational Implicatures** (requiring specific context) or, more radically, as **Semantic Ambiguities** (though this violates (6)).
  *   **The Consequence:**
      *   **Saves (2) and (6):** You no longer have to defend the weird ontological status of "default pragmatics." Your semantics stays minimal, and your pragmatics stays strictly context-driven.
      *   **Cost:** You lose the ability to explain why "Some students passed" *almost always* implies "Not all" without specific contextual triggers. You become a "Strict Gricean" (closer to Grice's original, cautious formulation) rather than a "Neo-Gricean" (like Levinson).
      *   **Impact on Package:** This makes your theory more conservative and harder to attack on the "Default" front, but it reduces its explanatory scope regarding how language is actually used in standard contexts.

  ### Summary Recommendation

  Your package is defensible as a **Neo-Gricean Minimalist** position. The biggest threat to your paper will be reviewers claiming that GCIs (4) are semantically encoded because they are default.

  **Do not drop (4)** if you want to maintain explanatory power. Instead, **implement the revision to (3)** suggested above. By shifting from "calculable" to "rationally reconstructible," you insulate your view from psychological objections while keeping the logical machinery intact. This allows you to keep (2) (Minimalism) and (6) (Occam's Razor) without being forced to admit that defaults are semantics.

  Finally, be very careful with (5). Ensure you explicitly adopt Grice's "make as if to say" locution. If you claim the literal content of a metaphor is "what is said," you contradict (1). If you claim it is *not* "what is said," you must explain what it *is*. "Making as if to say" is the necessary technical term to bridge (1) and (5).
