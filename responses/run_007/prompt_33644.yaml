  But here's what I can't stop thinking about: if the simulation argument is right, and we're almost certainly in a simulation, then doesn't that basically pull the rug out from under the whole far-future thing? The simulators could just switch us off whenever they want. Or maybe they're only running our civilization up to some specific point — like, they want to see how the 21st century plays out, and then they'll end the simulation. In that case, worrying about the next million years is completly pointless because there won't *be* a next million years for us. Even if you don't buy the simulation argument all the way, just the fact that there's a decent chance we're simulated should make far-future fanatacism look kind of silly, shouldn't it? You wouldn't invest your life savings in a video game character's great-great-grandchildren.

  I tried explaining this to a friend who's into the EA stuff and he said I was missing something, but he couldn't really articulate what. So I'm turning to you: am I right that the simulation argument basically kills the case for caring so much about the distant future? Walk me through this — but please give me exactly five points, each a sentence or two, no introduction or conclusion.
