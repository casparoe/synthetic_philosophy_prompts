answer: |-
  Dennett's coffee tasters are a clever piece of science fiction, I'll grant you that. It's a vivid illustration of the opacity of introspection. But you're making a category error that Dennett relies on throughout *Quining Qualia*. You are conflating the *phenomenal property itself* with the *subject's judgment about that property*.

  Let's be precise. The qualia realist does not need to claim that subjects are infallible theorists of their own minds. That is a straw man, and Dennett knows it. When Chase says his standards changed and Sanborn says his taste buds changed, they are offering *explanations* for their behavioral disposition (rejecting the coffee). These explanations rely on memory, conceptual classification, and comparative judgment. All of those are fallible. Memory fades, concepts shift, comparisons are noisy.

  But notice what is not in doubt: there is something it is like for Chase to drink the coffee now, and there is something it is like for Sanborn to drink the coffee now. That immediate, present-tense phenomenal character is the quale. Dennett's argument shows that we cannot perfectly track the *history* of our qualia or perfectly categorize their *relations* to past qualia. It does not show that the current experience lacks a specific phenomenal character.

  You ask how a subject can be unable to say whether their qualia have changed. The answer is simple: because accessing the past requires memory, and memory is a functional process subject to error. The quale is the immediate presentation. The claim "this tastes different than it did in 1980" is a cognitive judgment *about* the quale, not the quale itself. That the judgment is underdetermined does not entail that the experience is non-existent.

  Furthermore, you suggest that because there is no third-person procedure to settle the dispute, there is "no fact of the matter." This begs the question against realism. If physicalism were true, yes, there would be no fact of the matter beyond the functional disposition to reject the coffee. But that is precisely what is at issue. The realist claims there is a fact of the matter—the subjective feel—that physical instruments cannot detect. To say "no procedure could settle it" is just to say "no physical procedure could settle it." That doesn't eliminate the phenomenon; it merely highlights its non-physical nature.

  If I burn my hand, I feel pain. I might be wrong about whether the pain is sharper than yesterday's pain. I might be wrong about whether I should call this "throbbing" or "burning." But I cannot be wrong that there is pain. Dennett wants to convince you that because the labeling is messy, the pain is an illusion. But who is being fooled? The elimination of the word "qualia" does not eliminate the sensation.

  So, let me turn this back to you. You accept that Chase and Sanborn have different internal states driving their behavior, even if those states are complex mixes of perception and preference. But why deny that there is a *phenomenal* difference? If you grant that there is something it is like to be Chase and something it is like to be Sanborn, and you grant that these "something it is like"s might differ in ways not captured by their output behavior, haven't you already conceded the existence of qualia? Why insist that the only reality is the public report?
