answer: |-
  # Desiderata for an Adequate Answer to the Special Composition Question

  The Special Composition Question (SCQ) asks: Under what conditions do some things, the $xs$, compose a further thing, $y$? To evaluate candidate answers in this seminar, we must first establish the criteria of adequacy. We are not looking for a linguistic analysis of the word "object," nor a pragmatic guide for daily life. We are seeking a serious metaphysical principle that describes the structure of reality.

  Below are the constraints any such theory must address. I have categorized them by the philosophical pressure that generates them. For each, I specify the reasoning, the illustrative cases, and its status as either a non-negotiable requirement for a *metaphysical* theory or a negotiable preference often tied to specific camps (e.g., common-sense realism vs. revisionism).

  ### I. Constraints on Extension and Intension

  **1. The Common Sense Vindication Constraint**
  *   **Reasoning:** A metaphysical theory of the material world should, ceteris paribus, align with our pre-theoretical commitments about what exists. If a theory entails that tables do not exist, or that scattered fusions of trout and turkeys do exist, it incurs a high revisionary cost. The theory must explain why we are right about the table and wrong about the trout-turkey (or vice versa).
  *   **Illustrative Cases:** The assembled table (should compose); the trout-turkey (should not compose); the heap of sand (intuitively borderline).
  *   **Status:** *Negotiable/Preferred.* While highly desirable for a theory aimed at vindicating ordinary discourse, strict metaphysical rigor may force revision. However, a theory that violates this without a compelling error theory is deficient.

  **2. The Non-Arbitrariness Constraint**
  *   **Reasoning:** If composition is restricted (i.e., if not all pluralities compose and not no pluralities compose), there must be a principled reason why composition occurs in some cases and not others. A boundary drawn without a underlying metaphysical naturalness is brute and suspect. We cannot simply say "composition happens here but not one micron further" without a relevant difference in the $xs$.
  *   **Illustrative Cases:** The limiting answers (Nihilism and Universalism) satisfy this easily by drawing no boundary. Restricted views must explain why the cells composing an organism yield a whole, but the cells composing a heap do not, without appealing to human interest.
  *   **Status:** *Non-Negotiable* for any restricted view. A restricted view without a non-arbitrary principle is merely a stipulation.

  **3. The Precision Constraint**
  *   **Reasoning:** Composition cannot be a vague relation. If it were vague whether the $xs$ compose a $y$, then it would be vague how many objects exist. But existence and number are not vague; reality is determinate in its ontological inventory. Therefore, the conditions for composition must be sharp.
  *   **Illustrative Cases:** The heap of sand. As grains are removed, there must be a specific grain whose removal stops composition. If there is no such grain, composition is vague, and the theory fails this constraint.
  *   **Status:** *Non-Negotiable* for standard analytic metaphysics. (Note: Some epistemicists or ontic vagueness proponents may contest this, but for the purposes of a classical SCQ framework, this is a hard constraint).

  ### II. Constraints on Ontological Commitment

  **4. The Ontological Innocence vs. Addition Constraint**
  *   **Reasoning:** The theory must clarify the relationship between the composite and its parts. Is the composite something *over and above* the parts arranged thusly, or is it nothing but the parts? If it is something over and above, the theory incurs an ontological cost that needs justification. If it is nothing but the parts, the theory must explain how identity works (e.g., one thing vs. many).
  *   **Illustrative Cases:** The table and its legs. Is the table a new entity added to the universe, or just the legs and top standing in a relation?
  *   **Status:** *Non-Negotiable.* The theory need not take a specific side (monism vs. pluralism), but it cannot remain neutral on the *consequences* of composition. It must specify whether composition generates new being.

  **5. The Constitution Distinction Constraint**
  *   **Reasoning:** The theory must account for the relationship between a composite object and the matter that constitutes it. If a statue is composed of a lump of clay, does the statue = the lump? If yes, how do we handle modal differences (the lump could survive being squashed, the statue could not)? If no, how do we avoid double-counting objects in the same place?
  *   **Illustrative Cases:** The statue and the lump of clay.
  *   **Status:** *Negotiable.* A theory of composition can technically prescind from constitution (treating composition as strictly mereological), but an adequate *metaphysical* account of material objects usually cannot ignore the modal profiles of the constituted objects.

  ### III. Constraints on Boundary and Identity

  **6. The Uniqueness Constraint (Problem of the Many)**
  *   **Reasoning:** For any given plurality of parts that composes an object, there should be a unique composite. If there are many overlapping candidates (e.g., many slightly different collections of water droplets) that equally satisfy the conditions for composing a cloud, the theory must explain why one is the cloud, or why there are many clouds, or why there is no cloud. It cannot leave the number of objects indeterminate.
  *   **Illustrative Cases:** A cloud and its candidate boundaries (droplets on the periphery).
  *   **Status:** *Non-Negotiable.* Reality contains a specific number of objects. A theory that implies a swarm of co-located objects for every ordinary item without an error theory fails to describe the world accurately.

  **7. The Epistemic Accessibility Constraint**
  *   **Reasoning:** If composition occurs based on objective metaphysical facts, those facts should not be utterly unknowable. If the boundary between composition and non-composition is sharp but epistemically inaccessible, we are left with skepticism about ordinary objects. The theory should explain how we know when composition occurs.
  *   **Illustrative Cases:** Knowing that a table exists but a "trout-turkey" does not.
  *   **Status:** *Preferred.* While metaphysical facts can outstrip knowledge, a theory that renders all ordinary existence claims unknowable is pragmatically and theoretically costly.

  ---

  ### Analysis of Joint Satisfiability

  **The Inconsistency Flag**
  I must flag a critical tension in the list above. I suspect that the following subset of desiderata **cannot be jointly satisfied**:

  1.  **Common Sense Vindication** (Tables exist; Trout-Turkeys do not; Heaps are borderline).
  2.  **The Precision Constraint** (Composition is never vague; there is a sharp cutoff).
  3.  **The Non-Arbitrariness Constraint** (The sharp cutoff must correspond to a metaphysically natural joint, not a brute fact).

  **The Reasoning:**
  If you satisfy **Precision** and **Non-Arbitrariness**, you are pushed toward the limiting answers (Nihilism or Universalism).
  *   **Universalism** posits a sharp, non-arbitrary rule: *always* compose. This satisfies Precision and Non-Arbitrariness but violates **Common Sense Vindication** (by validating the trout-turkey).
  *   **Nihilism** posits a sharp, non-arbitrary rule: *never* compose. This satisfies Precision and Non-Arbitrariness but violates **Common Sense Vindication** (by eliminating the table).

  If you attempt to satisfy **Common Sense Vindication** via a Restricted View (e.g., "composition occurs when $xs$ are fastened together" or "when $xs$ are caught in a life"), you inevitably run afoul of **Precision** or **Non-Arbitrariness**.
  *   **Violation of Precision:** Most restricted conditions (contact, bonding, life) admit of borderline cases. Is a slightly loose screw "fastened"? Is a virus "alive"? If composition tracks these, composition becomes vague.
  *   **Violation of Non-Arbitrariness:** To save Precision, the restricted theorist must posit a sharp cutoff in the continuous spectrum of bonding or life. But nature rarely provides sharp cutoffs that align with our concept of "object." Positing a sharp cutoff where the physical properties vary continuously looks metaphysically arbitrary.

  **The Single Exclusionary Requirement**
  The single requirement that does the most to exclude the main contenders is **The Non-Arbitrariness Constraint** (when coupled with the demand for Restricted Composition).
  *   It excludes **Restricted Views** that rely on vague predicates (like "contact" or "function") because they cannot locate a natural joint.
  *   It effectively forces a choice between Nihilism and Universalism unless one can identify a perfectly sharp, metaphysically natural relation that coincides exactly with our ordinary concept of "object" (which seems unlikely).
  *   However, if one treats **Common Sense Vindication** as non-negotiable, then **The Precision Constraint** becomes the exclusionary requirement, as it rules out any view that accepts the vagueness inherent in ordinary language and perception.

  **Conclusion on Consistency:**
  The standard list is **inconsistent**. Every answer must violate at least one plausible requirement.
  *   To save Common Sense, you likely sacrifice Precision or Non-Arbitrariness.
  *   To save Precision and Non-Arbitrariness, you likely sacrifice Common Sense.
  *   The task of the seminar is not to find the theory that satisfies all desiderata (for there is none), but to decide which desideratum is the least defensible and must be jettisoned.

  ---

  ### Scorecard of Candidate Positions

  Here is how the three primary contenders fare against the desiderata list.

  | Desideratum | **Nihilism** (Nothing composes) | **Universalism** (Anything composes) | **Moderate Restriction** (e.g., "Life" View) |
  | :--- | :--- | :--- | :--- |
  | **Common Sense Vindication** | **FAIL.** Denies existence of tables, organisms, etc. High revisionary cost. | **FAIL.** Validates trout-turkeys and arbitrary fusions. High revisionary cost. | **PASS (Mostly).** Validates tables and organisms; denies trout-turkeys. |
  | **Non-Arbitrariness** | **PASS.** "Never" is a principled, non-arbitrary rule. | **PASS.** "Always" is a principled, non-arbitrary rule. | **FAIL/STRUGGLE.** Must explain why "life" or "bonding" is the non-arbitrary cutoff without begging the question. |
  | **Precision** | **PASS.** No vague composition; composition never happens. | **PASS.** No vague composition; composition always happens. | **FAIL/STRUGGLE.** Life and bonding admit of borderline cases, threatening vagueness in existence. |
  | **Ontological Commitment** | **PASS (Parsimonious).** Only simples exist. | **FAIL (Expansive).** Infinite proliferation of objects. | **MIXED.** Depends on whether composites are "over and above" parts. |
  | **Problem of the Many** | **DISSOLVES.** No clouds exist, so no problem. | **INHERITS.** Many overlapping fusions exist; must explain why we refer to one. | **INHERITS.** Must explain why one specific plurality of cells is *the* organism. |
  | **Epistemic Accessibility** | **PASS.** We know nothing composes (theoretically). | **PASS.** We know everything composes (theoretically). | **FAIL.** If boundaries are sharp but naturalistic, they may be unknowable. |

  **Summary:**
  *   **Nihilism** and **Universalism** are the theoretically "clean" options. They satisfy the logical and metaphysical constraints (Precision, Non-Arbitrariness) but at the steep price of Common Sense.
  *   **Moderate Restriction** (like the "Life" view) pays the theoretical price (struggling with Precision and Non-Arbitrariness) to save Common Sense.
  *   The choice of theory is therefore a choice of which desideratum to violate.
