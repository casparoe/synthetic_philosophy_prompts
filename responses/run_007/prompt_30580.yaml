prompt: |-
  I've been going back and forth with a friend who's into wild animal welfare, and they keep reaching for a version of the scale argument that feels like a lottery ticket to me. Their line, roughly, is: even if you think each individual insect has only a tiny chance of being sentient — say one in a thousand, or one in a million — there are something like a quintillion of them alive at any moment, plus maybe a trillion more being farmed for food or feed each year. So the expected number of sentient beings is still astronomical. They say it's like holding millions of lottery tickets: each ticket almost certainly loses, but with that many tickets you should act as if you've got plenty of winners, so we should start treating insect suffering as a serious moral issue, maybe comparable to the suffering of farmed mammals.

  I can't tell how much work the lottery-ticket analogy is doing. You're an expert on moral uncertainty and animal ethics; please think carefully, and start by brainstorming before you commit. Audit the analogy for me: give a correspondence table (the ticket, the draw, the prize, the cost, the number of tickets), then seperate the disanalogies that matter from the ones that don't — for instance, whether the probabilities are independent, whether 'expected number of sentient beings' is even the right quantity, whether the analogy quietly imports risk-neutrality or a known probability, and how the tiny-probability-of-huge-numbers issue plays out. Then say whether my friend's conclusion survives once the disanalogies are on the table, and if not, what a better analogy would be. Please write in British English.
