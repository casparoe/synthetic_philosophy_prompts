      *   *Counter:* The definition of "substantivalism" is contested. Is it about *points* or about *spacetime as a substance*?
      *   *Counter:* The indeterminism is "haecceitistic" (about *which* point is which), not qualitative. Does that count as real indeterminism?

  4.  **Explain "Sophisticated Substantivalism" (The "Epicycles" Charge):**
      *   It's not just saying "points aren't real." It's saying "points are real, but their *identity* is tied to the fields."
