      *   **Option A: Reject (2) - Relations are essentially relating.** (The Russell/Armstrong approach). Relations aren't inert objects; their nature is to relate.
      *   **Option B: Reject (1) - Instantiation is not a relation.** (The Strawson/Bergmann approach). It's a "non-relational tie" or a category mistake to treat it as a universal.
