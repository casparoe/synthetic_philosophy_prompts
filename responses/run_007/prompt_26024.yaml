      *   Key figure: F.H. Bradley (*Appearance and Reality*, 1893).
      *   Core issue: The problem of unity (how do constituents form a whole?).

  3.  **Evaluate the Premises (The "Break Points"):**

      *   **Premise (1): "For a particular a to have a property F, a and F must stand in some relation — call it instantiation."**
