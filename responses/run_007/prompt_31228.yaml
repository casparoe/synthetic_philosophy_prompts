      *   Ensure the "bracketing" is the pivot. HP says "We bracket the reality of the peripheral qualia." FP says "We treat the report of peripheral qualia as real."
      *   *Wait, one nuance:* Dennett often argues there is *no* fact of the matter about the experience until the judgment is made. So HP says "There is no peripheral qualia to bracket." FP says "There is, and you're ignoring it."
      *   *Adjustment:* The prompt asks for a case where bracketing throws away data. So I must frame it such that FP treats the report as evidence of a specific phenomenal state, while HP treats it as evidence of a doxastic state.
      *   *Case:* **The "Filling-In" of the Blind Spot (again, but refined).**
      *   *Why?* Because in the Blind Spot, there is *physiologically* no input.
      *   *Report:* "I see a continuous line."
      *   *HP:* "You believe the line is continuous. Your experience is actually gappy, but you judge it continuous." (Or: "The experience of continuity is real, but the content 'line in blind spot' is a belief.") *Actually, Dennett usually concedes the experience of continuity is real, but denies the content corresponds to reality.*
      *   *I need a case where they disagree on the **Conscious Content**.*
      *   *Okay, the **Rich/Sparse (Overflow)** debate is definitely the strongest fit.*
      *   *Let's use a specific variant: **The "Fringe" of Consciousness in Change Blindness.**.*
      *   *Scenario:* A scene flashes. Subject reports "I saw the whole scene." Change occurs. Subject misses it.
      *   *HP:* Subject has a belief "I saw the whole scene." Actual consciousness was limited to the focus.
      *   *FP:* Subject had a conscious experience of the whole scene (phenomenally rich), but lacked access/reportability for the changed item.
      *   *This creates the divergence:* HP says Consciousness = Access (Sparse). FP says Consciousness > Access (Rich).
      *   *The "Bracketing":* HP brackets the "felt richness" as a cognitive illusion. FP accepts "felt richness" as a phenomenal fact.

  7.  **Finalizing the Thought Experiment:**
      *   **Name:** The "Peripheral Determinacy" Case.
      *   **Setup:** Rapid Serial Visual Presentation (RSVP) or Gabor patch array.
      *   **Report:** "The periphery looked sharp/determinate."
      *   **Data:** Performance at chance in periphery.
      *   **HP:** Report = Belief. Experience = Indeterminate.
      *   **FP:** Report = Experience. Experience = Determinate (phenomenally).
      *   **Scientific Consequence:** Neural correlates. If FP is right, we look for high-res encoding in periphery that isn't accessed. If HP is right, we look for a "belief" module.

