answer: |-
  **Title:** The Illusion of Diachronic Coherence: A Case Against the Normative Force of Van Fraassen's Reflection Principle

  **Abstract**
  Van Fraassen's Reflection Principle is frequently touted as a cornerstone of Bayesian rationality, purportedly securing diachronic coherence alongside the synchronic constraints of the probability calculus. The principle dictates that an agent's current credence in a proposition ought to match their expected future credence. While intuitively appealing as a mandate to treat one's future self as an epistemic expert, this paper argues that Reflection fails as a fundamental normative requirement. I contend that the standard justifications for Reflection—specifically Dutch book arguments and the 'foreseeable shift' objection—either beg the question or collapse under the weight of anticipated epistemic decay. Furthermore, I demonstrate that attempts to salvage the principle via restriction render it trivial, stripping it of the normative bite required to function as a genuine constraint on rationality.

  ***

  ### 1. Introduction

  In the landscape of formal epistemology, few principles have generated as much friction as Bas van Fraassen's Reflection Principle. Formally, it states that for any proposition $A$ and any future time $t$, your current credence function $C_0$ ought to satisfy:

  $$C_0(A \mid C_t(A) = x) = x$$

  In plain English: if you are certain that your future credence in $A$ will be $x$, your current credence in $A$ should already be $x$. The intuition is seductive. It posits a form of diachronic solidarity, suggesting that to disagree with your future self is to imply that either you are right now, or they will be wrong later. Since rationality presumably aims at truth, and we generally expect our future selves to possess more evidence, deference seems the only coherent stance.

  My supervisor, along with a significant cohort of Bayesians, regards Reflection as axiomatic—a diachronic analogue to the Kolmogorov axioms. Violating it is said to invite a Dutch book, rendering the agent susceptible to a sure loss. However, from the perspective of cognitive science, where agents are situated in time, subject to memory decay, and vulnerable to physiological compromise, Reflection looks less like a law of logic and more like a fragile heuristic.

  This essay argues that Reflection is not a fundamental requirement of rationality. I will demonstrate that the principle fails to account for anticipated epistemic decay, that its primary justification (the Dutch book argument) is circular, and that any attempt to restrict the principle to save it from counter-examples renders it vacuous. If Reflection is to be saved, it must be demoted from a constitutive norm of rationality to a contingent rule of thumb.

  ### 2. The Problem of Anticipated Epistemic Decay

  The most immediate objection to Reflection is the phenomenon of anticipated epistemic decay. As you noted in your preliminary observations, there are mundane scenarios where a rational agent expects their future self to be *less* reliable than their current self.

  Consider the case of the all-nighter. Suppose I am working on a complex data analysis at 2:00 AM. I am tired, but currently lucid. I know with high confidence that by 6:00 AM, sleep deprivation will degrade my cognitive faculties. Specifically, I foresee that at 6:00 AM, I will become overconfident in a flawed hypothesis ($H$) due to exhaustion-induced patternicity. At 2:00 AM, my credence in $H$ is 0.3. I predict that at 6:00 AM, my credence $C_{6am}(H)$ will be 0.9.

  Reflection demands that, conditional on this prediction, my current credence $C_{2am}(H)$ should be 0.9. To do otherwise is labelled diachronically incoherent. Yet, intuitively, maintaining the 0.3 credence is the *only* rational move. To update to 0.9 now would be to incorporate the error of my future self into my current belief state. It would be to treat a known cognitive malfunction as evidence.

  Van Fraassen himself acknowledged this, suggesting that Reflection applies only when the agent expects to remain rational. However, this concession is fatal to the principle's status as a fundamental norm. If the applicability of Reflection depends on a prior assessment of the future self's rationality, then Reflection is not doing the normative work; the assessment of rationality is.

  In cognitive science terms, we model agents as having varying reliability functions over time. A normative theory of belief should accommodate the fact that $Reliability_{t+1}$ can be less than $Reliability_{t}$. Reflection, by contrast, imposes a flat prior on the reliability of the future self. It assumes that the mere passage of time confers epistemic authority. This is empirically false. Time brings evidence, yes, but it also brings forgetting, fatigue, and bias. A principle that cannot distinguish between learning new data and losing old data cannot be a fundamental law of rationality.

  ### 3. The Failure of the Dutch Book Argument

  Proponents of Reflection often retreat to pragmatic justification: violating Reflection makes you susceptible to a Dutch book. The argument, roughly, is that if your current credence differs from your expected future credence, a bookie can sell you a bet now and buy it back later (or vice versa) in a way that guarantees you a loss regardless of the truth of the proposition.

  This argument, however, relies on a hidden premise that begs the question. For the Dutch book to stick, the bookie must be able to force the transaction at time $t$ based on the credence $C_t$. But why *must* the agent accept bets at time $t$ at those odds? The Dutch book argument assumes that the agent is committed to acting on their future credences in a specific way.

  More critically, as David Christensen (1991) has argued, the Dutch book argument for Reflection presupposes that the change in credence from $t_0$ to $t$ is driven by *conditionalisation* on new evidence. If the shift in credence is due to conditionalisation, then the agent is already bound by the rules of Bayesian updating. If the shift is *not* due to conditionalisation (as in the sleep deprivation case, or cases of forgetting), the Dutch book loses its normative force.

  If I know I will forget evidence $E$ by tomorrow, my credence will drop. A bookie could exploit the difference between my current high credence (based on $E$) and my future low credence (without $E$). But does this exploitation prove I am irrational *now*? No. It proves I am vulnerable to memory loss. The Dutch book shows a vulnerability, but not necessarily a rational failing. To claim it shows a rational failing is to assume that avoiding sure losses is more important than tracking evidence. But if the sure loss arises because I know I will lose evidence, avoiding the loss would require me to ignore my current evidence. That is arguably the greater irrationality.

  Therefore, the Dutch book argument does not establish Reflection as a standalone norm. It merely shows that if you violate Reflection, you are vulnerable *provided* you are also committed to acting on your future credences in a specific market context. It is a pragmatic constraint on betting behaviour, not a constitutive constraint on belief.

  ### 4. The 'Foreseeable Shift' Dilemma

  A second defence of Reflection is the 'foreseeable shift' argument. It runs as follows: If you know now that you will believe $x$ later, why wait? If the shift is rational, you should make it now. If you don't make it now, you are admitting that your future belief will be unjustified.

  This argument conflates the *outcome* of a process with the *process* itself. Rationality is often procedural. In many cognitive contexts, we cannot update on evidence until we possess it. More subtly, we sometimes cannot update until we have performed a computation or a reflection that takes time.

  Consider a mathematician who is certain they will prove a theorem tomorrow. They know their future credence in the theorem's truth will be 1.0. Reflection says their current credence should be 1.0. But this is absurd. Until the proof is actually grasped, the mathematician does not have the justification required for credence 1.0. The value lies in the *derivation*, not just the destination. To assign 1.0 now is to claim knowledge one does not yet possess.

  This is particularly relevant for cognitive scientists. We know that belief formation is a resource-intensive process. 'Waiting' for the future credence is not passive; it is the time required for cognitive processing. Reflection treats the agent as a timeless logic gate rather than a temporal processor. It demands that we collapse the temporal gap of learning into a single instant. This violates the very nature of diachronic agency. We are not merely containers for credences; we are processors of information. The gap between $C_0$ and $C_t$ is often where the work of reasoning happens. To demand they be equal is to demand the work is already done.

  ### 5. The Triviality of Restricted Reflection

  At this point, a defender of Reflection might propose a restricted version, akin to the suggestion you raised: *'You should defer to your future self only when you are confident they will be at least as epistemically virtuous as you are now.'*

  Let us call this Restricted Reflection (RR). RR avoids the counter-examples of drunkenness and forgetfulness. If I know I will be drunk, RR does not apply. If I know I will be sober and better informed, RR applies.

  However, this restriction guts the principle of its normative utility. To apply RR, I must first determine whether my future self will be 'epistemically virtuous'. But how do I make that determination? I must assess whether my future credences will be well-calibrated to the evidence. But if I can already assess what the well-calibrated credence is, I do not need Reflection to tell me what to believe. I can simply update on that assessment directly.

  Reflection was meant to be a heuristic for when we *don't* know exactly what evidence we will get, but we trust the process. But if the restriction requires us to verify the quality of the future process before deferring, the principle becomes circular. It says: 'Defer to your future self if your future self is right.' This is tautological. It offers no guidance on *how* to identify when the future self is right, other than by already knowing what the right credence is.

  Furthermore, in the context of cognitive science, 'epistemic virtue' is often opaque to the agent. I may not know if a specific cognitive shift is due to insight or bias. If Reflection requires me to know this to apply the principle, it places a demand of meta-cognitive omniscience on the agent that is psychologically unrealistic. A normative principle that requires agents to have perfect knowledge of their own future reliability conditions is not a guide for finite minds.

  Consequently, Restricted Reflection is too weak to do the work Van Fraassen intended. It cannot serve as a foundation for diachronic coherence because it collapses into the very judgements it was supposed to ground. It becomes a description of what rational agents do (they defer to reliable sources, including future selves), rather than a prescription for how they ought to calculate credences.

  ### 6. Conclusion

  Van Fraassen's Reflection Principle possesses an aesthetic elegance that appeals to the formalist. It promises a unified theory of belief across time, binding the agent to their future incarnation. However, upon closer inspection, this unity is purchased at the cost of psychological realism and normative force.

  The principle fails as a fundamental requirement of rationality because it cannot accommodate the reality of epistemic decay without collapsing into triviality. The Dutch book arguments used to defend it presuppose the very updating rules they aim to justify, and the 'foreseeable shift' defence ignores the procedural nature of reasoning. When restricted to avoid obvious counter-examples, the principle becomes vacuous, offering no guidance that the agent could not derive from first principles.

  For the cognitive scientist, this should be liberating. It suggests that diachronic coherence is not a hard constraint like the probability calculus, but a soft goal that must be balanced against memory limitations, processing costs, and physiological states. We should not treat our future selves as infallible experts by default. We should treat them as we treat any other source of information: with a critical eye, calibrated by our understanding of their reliability.

  Reflection is not a law of thought. It is, at best, a rule of thumb for idealised agents in idealised conditions. Since neither exist, we ought to retire it from the core canon of rational norms.

  ***

  **References**

  Christensen, D. (1991). 'Rational Reflection'. *Philosophical Perspectives*, 5, 121–140.

  Van Fraassen, B. C. (1984). 'Belief and the Will'. *The Journal of Philosophy*, 81(5), 235–256.

  Briggs, R. (2009). 'Distorted Reflection'. *The Philosophical Review*, 118(1), 59–85.

  Schoenfield, M. (2015). 'A Dilemma for Calibrationism'. *Philosophy and Phenomenological Research*, 91(2), 425–455.
