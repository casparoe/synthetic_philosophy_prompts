  4.  **Refining the Questions for Undergraduates:**
      *   Avoid jargon like "aggregation," "contractualism," "teleology."
      *   Use scenarios and intuitive probes.
      *   Ensure the logic flows cleanly.

      *   *Drafting the Tree Structure:*
          *   **Start:** The 1 vs. 5 Case.
