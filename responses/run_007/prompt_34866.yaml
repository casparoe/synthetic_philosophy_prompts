      *   Let's try: "Do the five strangers have a *joint* claim that is stronger than the single stranger's claim?"
          *   Yes -> Aggregation.
          *   No -> Contractualism (or similar).

      *   *Wait, one nuance:* Weighted Lottery. Do they think claims aggregate? Usually no. They think each individual has an equal claim to a *chance*.
      *   So, Q1 must separate "Deterministic Save" from "Lottery".
      *   If "Lottery", Q2 separates Taurek (50/50 groups) from Weighted (1/6 vs 5/6).
