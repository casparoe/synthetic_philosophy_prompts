answer: |-
  # HANDOUT: Mapping the Moral Terrain of "1 vs. 5"
  **Module:** Ethics, Numbers, and Conflict  
  **Topic:** Taurek's *Should the Numbers Count?* (1977)  
  **Purpose:** To diagnose your underlying ethical commitments regarding the rescue case.

  ---

  ## Instructions for Study Groups
  Do not look at the "Position" labels at the end of the branches until you have answered the questions. Read the **Scenario** aloud, then move through the **Decision Tree**. 

  **The Core Scenario:**  
  You are walking past a shallow pond. On the left, one stranger (A) is drowning. On the right, five strangers (B, C, D, E, F) are drowning. You have time to save *either* A *or* the group of five, but not both. All six are strangers to you; all will die if not saved; all have equal life expectancy and no special ties to you.

  ---

  ## The Decision Tree

  ### START: The Choice of Action
  **Question 1:** In this scenario, are you **morally required** to save the five strangers, or is it permissible (or required) to give the single stranger a significant chance of survival via a randomizing procedure (like a coin flip)?

  *   **(A)** I am morally required to save the five. (Go to **Question 2**)
  *   **(B)** I must (or strongly should) use a randomizing procedure; it is wrong to simply choose the five. (Go to **Question 3**)

  ---

  ### BRANCH A: "Save the Five" (Deterministic)
  *You believe the five should be saved without a lottery.*

  **Question 2:** Imagine the single stranger (A) could speak to you before dying. They ask: *"Why was my life not saved? Was my claim to life weaker than the claims of the others?"* What is your honest answer?

  *   **(A1)** "Yes, in this situation, the combined moral weight of the five outweighs your individual claim. The total loss of five lives is a greater tragedy than the loss of one."  
      👉 **LEAF 1: Straightforward Aggregation**
  *   **(A2)** "No, your claim is equal to that of any *one* of the five. However, since we cannot save everyone, and you have no specific complaint against saving any *individual* member of the other group, we save the greater number as a tie-breaker."  
      👉 **LEAF 2: Pairwise Comparison / Contractualism**
  *   **(A3)** "Your claim is equal, but the numbers simply tip the scale without needing to compare claims."  
      👉 **LEAF 3: Numbers as Tie-Breakers** *(See Diagnostic Limits below)*

  ---

  ### BRANCH B: "Use a Lottery" (Randomized)
  *You believe saving the five deterministically violates the single stranger's rights or equality.*

  **Question 3:** If you use a lottery, how do you set the odds?

  *   **(B1)** "I flip a fair coin between the **groups**. The single person gets a 50% chance; the group of five gets a 50% chance."  
      👉 **LEAF 4: Taurek's Equal-Respect View**
  *   **(B2)** "I assign equal chances to each **individual**. The single person gets a 1/6 chance; the group of five gets a 5/6 chance."  
      👉 **LEAF 5: The Weighted-Lottery Proposal**
  *   **(B3)** "I use a lottery, but the odds should favor the five even more than their headcount (e.g., 90/10) to reflect the greater tragedy."  
      👉 **FLAG: Unexplored/Unstable** *(See Analysis below)*

  ---

  ## Position Definitions (The Leaves)

  ### 1. Straightforward Aggregation
  *   **Core Idea:** Moral claims can be summed. The claim of five people *jointly* is stronger than the claim of one.
  *   **Why save the five?** Because minimizing total loss of life is the primary moral demand.
  *   **Typical Proponents:** Classical Utilitarians, some Consequentialists.

  ### 2. Pairwise Comparison / Contractualism
  *   **Core Idea:** Claims do *not* aggregate. You cannot add Person B's claim to Person C's claim to make a "super-claim."
  *   **Why save the five?** Because if you compare Person A against Person B, A has no complaint if B is saved. Since this holds for A vs. B, A vs. C, etc., and you must save someone, saving the five is the only option no one can reasonably reject.
  *   **Typical Proponents:** T.M. Scanlon, Michael Otsuka.

  ### 3. Numbers as Tie-Breakers
  *   **Core Idea:** Claims are equal and non-aggregating. Numbers do not add weight, but they break the deadlock when claims conflict.
  *   **Why save the five?** Not because 5 > 1 in weight, but because when claims are equal, the larger group provides a non-arbitrary reason to choose.
  *   **Typical Proponents:** Derek Parfit (in some readings), John Harris.

  ### 4. Taurek's Equal-Respect View
  *   **Core Idea:** To respect each person as an individual, you must give each *person's fate* equal weight, not each *group's outcome*.
  *   **Why the 50/50 coin?** Giving the group of five a 50% chance and the one a 50% chance ensures that *you* (the agent) are not deciding who lives based on numbers. Each individual has a 50% chance of being saved (if in the group of five, you share the 50% group chance, but Taurek argues the relevant metric is the group's chance). *Note: Taurek's view is often interpreted as giving the individual a 50% chance against the group.*
  *   **Typical Proponents:** John Taurek.

  ### 5. The Weighted-Lottery Proposal
  *   **Core Idea:** Each individual has an equal claim to a *chance* of rescue.
  *   **Why 1/6 vs 5/6?** Because there are six individuals. To treat them equally, each gets one "ticket" in the lottery. The group of five holds 5 tickets; the single person holds 1.
  *   **Typical Proponents:** John Broome, Alex Voorhoeve.

  ---

  ## Diagnostic Flags & Limits

  ### ⚠️ Logically Possible but Undefended Combinations
  *   **The "B3" Branch (Super-Weighted Lottery):**  
      *Combination:* You require a lottery, but the odds should exceed the headcount ratio (e.g., 90% for the five, 10% for the one).  
      *Status:* **Unattractive/Unexplored.**  
      *Reasoning:* If you believe a lottery is required, it is usually because you think deterministic saving violates equality. If you then skew the odds beyond headcount, you are implicitly aggregating value *within* a lottery framework. Most philosophers who aggregate simply save the five (Leaf 1). Most who lottery stick to individual equality (Leaf 5).
  *   **The "Save Five + Taurek's Reasoning" Combo:**  
      *Combination:* You save the five deterministically, but argue that "Numbers don't count, each claim is equal."  
      *Status:* **Incoherent.**  
      *Reasoning:* If claims are truly equal and numbers don't count, you lack a justification for breaking the tie in favor of the five without a randomizer. This position collapses into Leaf 4 (Taurek) or requires a "Tie-Breaker" story (Leaf 3).

  ### ⚠️ Diagnostic Limits (Where the Tree Cannot Separate)
  *   **Leaf 2 (Contractualism) vs. Leaf 3 (Tie-Breakers):**  
      *Problem:* Both views deny aggregation (Question 2, Option A2/A3) and both result in saving the five. In the simple 1 vs. 5 case, they yield identical advice.  
      *Resolution:* To separate them, you need a **Trade-Off Case**. Ask: *"What if saving the five requires breaking the single person's arm, rather than letting them die?"*  
      *   **Contractualists** often say you cannot break the arm (individual rights block aggregation).  
      *   **Tie-Breakers** might allow the injury if the "tie-break" logic extends to lesser harms.
  *   **Leaf 1 (Aggregation) vs. Leaf 5 (Weighted Lottery):**  
      *Problem:* Some Aggregationists accept Weighted Lotteries as a *procedure* to achieve the best outcome over time, or to maintain social trust.  
      *Resolution:* Ask about **Obligation**. *"Is it morally **wrong** to save the five without flipping a coin?"*  
      *   **Leaf 1 (Aggregationist):** Usually says "No, saving the five is the duty; a lottery is optional or unnecessary."  
      *   **Leaf 5 (Weighted Lottery):** Usually says "Yes (or ideally), a lottery is required to respect individual claims to a chance."

  ---

  ## Study Group Discussion Prompts
  1.  **The "Hidden Aggregationist":** Did anyone in your group answer **Question 2 (A1)** but thought they were respecting individual rights? Discuss why "total tragedy" might conflict with "individual equality."
  2.  **The "Taurek Intuition":** For those who landed on **Leaf 4**, does this view hold if the numbers change to 1 vs. 1,000? If you change your mind at 1,000, at what number did "equality" stop mattering?
  3.  **The "Lottery Tension":** For those on **Leaf 5**, if the lottery results in the one person being saved (the 1/6 outcome), are the five dead people "unlucky" or "wronged"? How does this differ from Leaf 1?

  ---
  *Prepared for 'Ethics, Numbers, and Conflict' | Based on Taurek (1977), Scanlon (1998), Parfit (2011), and Broome (1998).*
