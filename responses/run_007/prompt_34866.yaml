              *   Yes (Save the five) -> Go to Q3.

      *   *Branch "Must Randomize" (Taurek vs. Weighted Lottery):*
          *   *Q2:* If you must randomize, how do you set the odds?
              *   Option A: 50/50 between the *groups* (The One gets 50%, The Five get 50%). -> **Taurek's Equal Respect.**
              *   Option B: Proportional to headcount (The One gets 1/6, The Five get 5/6). -> **Weighted Lottery.**
              *   *Check:* Are there other views here? Some might say "Flip for individuals" but think it's *required* rather than *permissible*. Taurek thinks saving the 5 deterministically is *wrong*. Weighted Lottery proponents often think saving the 5 deterministically is *wrong* too (or at least that a lottery is *better*). Let's refine Q1 to capture the "Deterministic Save" vs "Lottery" split better.
              *   *Revised Q1:* Is it morally *required* to give the single person a 50% chance of being saved (e.g., a fair coin flip between the two groups)?
