              *   *Flag:* Is there a view that says "Lottery but odds don't match individuals"? Maybe, but rare. Let's stick to the prompt's requirements.

      *   *Branch "Save the 5" (Q3 - The "Why"):*
          *   This is where Aggregation and Contractualism split.
          *   *Q3:* Why save the five? Is it because the *total amount of suffering/death* is less if you save them?
