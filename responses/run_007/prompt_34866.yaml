      *(Self-Correction during drafting)*: Make sure to capture the "Weighted Lottery" nuance. Some aggregationists accept weighted lotteries as a *procedure* but believe the *reason* is aggregation. Some non-aggregationists accept weighted lotteries because of equal respect for individuals.
