          *   *Unexplored:* "Weighted Lottery" but "Claims don't aggregate" (Actually, this is a common middle ground, need to be careful).
          *   *Indistinguishable:* Contractualism vs. "Numbers as Tie-Breaker" (Parfit's view). Both save the 5, both deny aggregation. Need a specific question about *why* the numbers break the tie.

  5.  **Finalizing the Content:**
      *   Title: Diagnostic Decision Tree.
      *   Introduction: Contextualize Taurek.
      *   The Tree: Visual representation (text-based).
      *   The Leaves: Definitions.
      *   The Flags: Incoherence/Indistinguishability notes.
