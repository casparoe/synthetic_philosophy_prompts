                  *   No -> Go to Q2.

      *   *Branch "No 50% Requirement" (Aggregation, Contractualism, Weighted Lottery):*
          *   Wait, Weighted Lottery proponents usually say you *should* lottery, just not 50/50. Aggregationists say you *must* save the 5. Contractualists say you *must* save the 5.
          *   So, Q1 needs to distinguish between "Save the 5" and "Lottery".
          *   *Revised Q1:* In the standard case, are you *permitted* to save the five without using a lottery?
              *   No (Must Lottery) -> Go to Q2 (Type of Lottery).
              *   Yes (Save the 5) -> Go to Q3 (Why?).

      *   *Branch "Must Lottery" (Q2):*
          *   *Q2:* How are the odds determined?
