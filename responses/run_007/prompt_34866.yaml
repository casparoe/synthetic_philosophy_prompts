              *   No (Total badness isn't the primary reason) -> Go to Q4.
          *   *Refinement:* Contractualists deny aggregation. They focus on complaints.
          *   *Q3:* Imagine the single person complains: "Why did you let me die to save them?" Is the answer: "Because their combined need was greater than yours"?
              *   Yes -> **Straightforward Aggregation.**
              *   No -> Go to Q4.

      *   *Branch "Save the 5 (Non-Aggregative)" (Q4):*
          *   *Q4:* If not combined need, what justifies it? Is it that the single person cannot reasonably reject a rule that saves the greater number in a tie-break?
              *   Yes -> **Pairwise Comparison / Contractualism.**
              *   *Alternative:* Maybe they think numbers count as a "tie-breaker" only?
              *   Let's make Q3 more diagnostic about the *mechanism*.
              *   *Q3:* Does the moral force to save the five come from adding up the strength of their individual claims?
                  *   Yes -> **Straightforward Aggregation.**
                  *   No -> **Pairwise Comparison / Contractualism.**

      *   *Reviewing the "Flags":*
          *   Need to identify incoherent paths.
          *   Example: Saying "Save the 5" but "Numbers don't matter at all" without a contractualist story is incoherent.
