      *   *Q3:* If the single person asks, "Why wasn't my life worth as much as theirs?", is the answer "Your life was worth just as much, but there were more of them" (Contractualism/Tie-break) OR "The total loss of five lives is worse than the loss of one" (Aggregation)?
