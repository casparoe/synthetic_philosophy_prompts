      *   *Question:* "Imagine the five are not in a group, but scattered in five different locations, and you can only reach one location which happens to contain one person, or another location with five. Does the logic change?" (Tests grouping).
      *   Let's stick to the prompt's request: "Start from the basic rescue case."
      *   Okay, I will add a "Diagnostic Limits" section to handle the indistinguishability.

  6.  **Writing the Handout:**
      *   Tone: Academic but accessible (3rd year UG).
      *   Format: Clear hierarchy.
