prompt: |-
  During my career as a research physicist, I was a fairly unreflective realist about my subject matter. I assumed that when our theories said things about electrons or quarks, those things existed more or less as described. Since retiring, I have been reading the philosophy of science literature, and I have become convinced by the structural realist position: roughly, that what survives theory change and what we should be realist about is not the posited entities themselves but the mathematical structure — the relations, the equations, the symmetries. But I have discovered that structural realism splits into two camps, and I have been going back and forth between them. On one side, epistemic structural realists hold that we can know only the relational structure of the world, while remaining agnostic about whether there is something more — some intrinsic nature of the relata — that we cannot access. On the other side, ontic structural realists hold that there is nothing more: reality is structure all the way down, and the relata are either eliminated or reconceived as nodes whose identity is exhausted by their place in the relational network.

  I have now spent a year reading both sides, and I find that each camp sometimes talks past the other. Epistemic structural realists accuse ontic structural realists of eliminating the very things that do the relating, as if one could have a network of relations with nothing standing in the relata positions — a formal framework, they say, not an ontology. Ontic structural realists reply that epistemic structural realism is an unstable halfway house: it concedes that we never grasp the intrinsic natures of objects, yet insists those natures exist anyway, somewhere beyond the reach of our theories, a kind of residual Kantian thing-in-itself held onto for no good reason. I would like to see what a genuine adversarial collaboration between a committed epistemic structural realist and a committed ontic structural realist would produce: a document both could sign. I want the claims they agree on about the history and the arguments — the no-miracles argument, the pessimistic meta-induction, the role of Ramsey sentences, the significance of quantum entanglement and gauge theories for the debate; the precise formulations of their disagreement, each phrased so its own side would accept the wording; the cruxes — the sub-questions that, if settled, would move at least one side; and, for each crux, the case, argument, or empirical finding both would agree bears on it, with each side's prediction recorded in advance. Please format this as a numbered agreed-claims section followed by a disagreements table. And if you conclude that part of the dispute is verbal rather than substantive, say which part and why.
