  **JOINT STATEMENT ON STRUCTURAL REALISM**
  **A Collaborative Document by Proponents of Epistemic and Ontic Structural Realism**

  **Preface**
  We, the undersigned representatives of Epistemic Structural Realism (ESR) and Ontic Structural Realism (OSR), acknowledge the inquirer's request for clarity. We recognize that while we share a common enemy in naive entity realism and a common foundation in the history of physics, our divergence on the ultimate nature of reality remains sharp. This document isolates our common ground, precisely formulates our disagreement, and identifies the empirical and theoretical cruxes that could resolve the debate.

  ### I. AGREED CLAIMS
  *The following propositions are accepted by both ESR and OSR as the shared foundation of the structural realist framework.*

  1.  **The Failure of Entity Realism:** The history of science demonstrates that specific ontological posits regarding the intrinsic nature of theoretical entities (e.g., the luminiferous ether as a mechanical medium, the caloric fluid) are frequently discarded during theory change. Therefore, a realism that commits to the literal existence of posited *objects* as described by current theories is untenable.
  2.  **Structural Continuity (The Worrall Constraint):** Despite the discard of entities, mathematical structure is often preserved across radical theory change. The prime example is the transition from Fresnel's ether-based optics to Maxwell's electromagnetic field theory; the equations (structure) were retained while the ontology (ether) was abandoned. This continuity explains the predictive success of predecessor theories without requiring the truth of their ontological commitments.
  3.  **The No-Miracles Argument (NMA) Restriction:** The NMA supports realism about the *structure* of the world, not necessarily the *objects*. It would be a miracle if our mathematical relations mapped onto worldly relations without some genuine correspondence, but it is not miraculous if the "things" related turn out to be different than posited.
  4.  **The Pessimistic Meta-Induction (PMI) Limitation:** The PMI successfully undermines belief in specific unobservable entities but fails to undermine belief in structural relations. The inductive risk lies in the nature of the *relata*, not the *relations*.
  5.  **The Role of Ramsey Sentences:** The structural content of a theory can be adequately captured by a Ramsey sentence (replacing theoretical terms with existentially quantified variables). Both sides agree this formalism successfully isolates the empirical/structural content of a theory from its specific semantic interpretation.
  6.  **Quantum Mechanics and Individuality:** Both sides agree that standard Quantum Mechanics (specifically the indistinguishability of particles and permutation invariance) undermines the classical notion of "objects" as individuals possessing haecceity (this-ness). Physics does not require, and often forbids, the labeling of fundamental particles as distinct individuals independent of their state.
  7.  **Gauge Symmetries:** Both sides agree that gauge symmetries in modern field theories (like the Standard Model) indicate a redundancy in the description of "local objects." The physical reality lies in the gauge-invariant relations, not in the gauge-dependent potentials or local field values taken in isolation.
  8.  **Rejection of the "God's Eye View":** Both sides reject the notion that we can access a theory-independent reality that is not structurally mediated. All access to the world is via the structural interface of our best theories.

  ***

  ### II. TABLE OF DISAGREEMENTS
  *The following table isolates the precise points of divergence. Each formulation is phrased to be acceptable to the respective camp.*

  | Domain | Epistemic Structural Realist (ESR) Formulation | Ontic Structural Realist (OSR) Formulation | Shared Empirical/Theoretical Bearing |
  | :--- | :--- | :--- | :--- |
  | **1. The Relata** | **Agnostic Realism:** We must remain agnostic about the intrinsic nature of the *relata* (the things related). Structure implies a relation *between* somethings. To deny the existence of the relata is to make structure a free-floating abstraction. | **Eliminativism:** The *relata* are not prior to the relations. Objects are derivative nodes constituted entirely by the structural network. To posit intrinsic natures beyond the structure is to posit unknowable Kantian noumena. | **Quantum Entanglement:** Does entanglement describe a relation between two distinct substances (ESR) or a single non-separable structural state where "two substances" is a misleading approximation (OSR)? |
  | **2. Modality** | **Descriptive:** Structure describes how unknown intrinsic natures interact. The laws of physics describe the behavior of the underlying stuff, even if we only know the behavior and not the stuff. | **Constitutive:** Structure is not merely descriptive; it is ontologically fundamental. The laws of physics do not describe how things behave; they constitute what exists. | **Symmetry Breaking:** Does Spontaneous Symmetry Breaking reveal a hidden intrinsic state (ESR) or is it a purely structural phase transition with no underlying "chooser" (OSR)? |
  | **3. Ramsey Sentence Interpretation** | **Existential Commitment:** The existential quantifiers in the Ramsey sentence range over *something* with intrinsic nature, even if that nature is unspecified. $\exists x$ implies "there is a thing." | **Structural Commitment:** The existential quantifiers range over positions in a structure. $\exists x$ implies "there is a structural node," not "there is a substance." | **Mathematical Ontology:** If a physical theory is isomorphic to a pure mathematical structure, is there a "physical residue" left over (ESR) or is the physics identical to the math (OSR)? |
  | **4. The "Dance without a Dancer"** | **Objection:** OSR commits a category error. Relations require relata. A network without nodes is logically incoherent, like a dance without a dancer. | **Reply:** This intuition relies on classical substance metaphysics. In graph theory and category theory, nodes are defined entirely by their edges. The "dancer" is just the intersection of the "dance moves." | **General Relativity:** In GR, spacetime points have no identity independent of the metric field. Is the metric field a property of spacetime (ESR) or is spacetime just the metric field (OSR)? |

  ***

  ### III. CRUXES AND PREDICTIONS
  *These are the sub-questions where further physical or philosophical work could shift the consensus. For each, we record the empirical/theoretical finding both sides agree is relevant, and their respective predictions.*

  **Crux 1: The Coherence of Non-Separable States**
  *   **The Issue:** Can physical reality be fundamentally non-separable without contradiction?
  *   **Agreed Bearing:** Results from Bell's Theorem and experimental violations of Bell inequalities, specifically regarding holism.
  *   **ESR Prediction:** Future theory will likely restore a form of separability or identify a deeper level of "stuff" that grounds the non-separable relations. Non-separability is an epistemic limit, not an ontological finality.
  *   **OSR Prediction:** Future theory will deepen non-separability (e.g., via AdS/CFT correspondence or Quantum Gravity). The universe is a single structural whole; "parts" are emergent approximations.

  **Crux 2: The Status of Spacetime in Quantum Gravity**
  *   **The Issue:** Does spacetime exist fundamentally, or is it emergent?
  *   **Agreed Bearing:** Progress in Loop Quantum Gravity or String Theory regarding the emergence of spacetime geometry from non-spatiotemporal degrees of freedom.
  *   **ESR Prediction:** Even if spacetime is emergent, the underlying degrees of freedom (strings, loops) will possess intrinsic properties distinct from their structural roles. There will always be a "substrate."
  *   **OSR Prediction:** The underlying degrees of freedom will be purely structural (e.g., spin networks, algebraic relations) with no intrinsic properties. Spacetime emergence will be shown to be structure emerging from deeper structure, with no "stuff" at the bottom.

  **Crux 3: The Interpretation of Gauge Redundancy**
  *   **The Issue:** Are gauge degrees of freedom merely mathematical artifacts, or do they hint at hidden ontology?
  *   **Agreed Bearing:** The resolution of the "Hole Argument" in General Relativity and the interpretation of BRST symmetry in QFT.
  *   **ESR Prediction:** Gauge redundancy indicates our current language is imperfect. A future theory will eliminate the redundancy by identifying the true intrinsic variables (the "physical" observables).
  *   **OSR Prediction:** Gauge redundancy is a feature, not a bug. It reveals that "local variables" are not real. Reality is the gauge-invariant structure itself; seeking "true variables" is a category mistake.

  ***

  ### IV. META-ANALYSIS: IS THE DISPUTE VERBAL?

  **Conclusion:** The dispute is **partially verbal, but substantively consequential.**

  **1. The Verbal Component:**
  A significant portion of the disagreement stems from the definition of the word **"object"** (or "entity").
  *   The **ESR** uses a classical definition: an object is a bearer of properties that exists independently of those properties. By this definition, OSR obviously has "no objects."
  *   The **OSR** uses a structural definition: an object is a node in a graph defined by its invariants. By this definition, OSR *does* have objects, but they are "thin."
  *   *Resolution:* If both sides agreed to define "object" as "a locus of causal powers defined structurally," the ESR's worry about "relations without relata" would diminish, as the relata would be understood as structural loci rather than substantial substrates.

  **2. The Substantive Component:**
  However, the dispute is not *merely* verbal because it entails different **modal commitments** regarding future physics.
  *   **ESR** commits the physicist to searching for the "underlying stuff" (e.g., hidden variables, sub-quantum media) when structural descriptions seem incomplete. It preserves a place for intrinsic qualities in the final theory.
  *   **OSR** commits the physicist to accepting structural completeness. If a theory is structurally complete, OSR forbids asking "what is the field made of?" as a meaningful question.
  *   **Why it matters to you:** As a physicist, if you adopt ESR, you keep a mental reservation that the wave function might describe *something's* behavior. If you adopt OSR, you accept the wave function (or the density matrix) as the exhaustive description of reality. This changes how you interpret measurement problems and the search for Quantum Gravity.

  **Signed,**
  *The Epistemic Structural Realist Camp*
  *The Ontic Structural Realist Camp*
