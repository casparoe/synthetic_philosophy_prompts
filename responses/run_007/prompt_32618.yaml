  1.  **Analyze the User's Problem:**
      *   **Core Issue:** The user is struggling with Expected Value (EV) reasoning, specifically when probabilities become very small and stakes become very large (Pascal's Mugging territory).
      *   **Input:** Seven specific cases with intuitive verdicts that seem inconsistent with strict EV maximization.
