answer: |-
  You have stumbled upon one of the deepest problems in decision theory. Your intuitions are not erratic; they are actually shared by most philosophers and economists who have wrestled with these paradoxes. The tension you feel arises because "Expected Value" (EV) is often presented as a single, monolithic rule, when in practice, rational decision-making requires layering several distinct principles.

  There isn't one single principle that solves all seven cases without modification. However, there is a **coherent framework** composed of three distinct adjustments to naive EV maximization. If you adopt this framework, you can keep most of your intuitions without being "irrational."

  Here is the breakdown of the framework, how it applies to your cases, and which verdicts you might need to adjust.

  ---

  ### 1. Bounded Utility (Solves Cases 2 & 3)
  **The Principle:** Value does not scale linearly forever.
  Naive EV assumes that $1 billion is exactly 1,000 times better than $1 million. But for a human agent, utility is bounded. Once you have enough money to secure everything you value, more money adds negligible utility. Similarly, "infinite bliss" may be conceptually possible, but your capacity to experience or value it is finite.

  *   **Application:**
      *   **Case 2 (St. Petersburg):** The monetary payout is infinite, but the *utility* of that payout converges. If you use a log-utility function (diminishing returns), the EV of the game becomes finite (usually quite small). Your refusal to pay >$20 is rational under bounded utility.
      *   **Case 3 (Pascal's Mugging):** Even if the promise is "infinite bliss," your utility function caps out. Therefore, the EV is not infinite; it is (Tiny Probability × Max Utility). This finite number is easily outweighed by the certain disutility of losing $10.
  *   **Verdict:** You do not need to abandon your intuition here. Naive EV is the error, not your refusal.

  ### 2. Epistemic Discounting (Solves Cases 5 & 6)
  **The Principle:** Distinguish between *aleatory* uncertainty (randomness in the world) and *epistemic* uncertainty (uncertainty about your model).
  When probabilities are tiny, the probability that your calculation is wrong often exceeds the probability of the event itself. This is the "credibility threshold."

  *   **Application:**
      *   **Case 6 (Nuclear Risk):** The mechanism (nuclear war) is well-understood physics and history. The probability estimate (1/1,000,000) comes from robust models. The epistemic uncertainty is low. Therefore, you trust the EV calculation.
      *   **Case 5 (Astronomical Stakes):** The mechanism (ending all suffering forever via a specific charity with 1/10^30 odds) relies on speculative chains of reasoning. The chance that the charity's model is flawed is vastly higher than 1/10^30. When $P(event) < P(your\ model\ is\ wrong)$, you should discount the EV to effectively zero.
  *   **Verdict:** This justifies treating Case 6 seriously while rejecting Case 5. It is not ad hoc; it is a meta-probabilistic correction for model reliability.

  ### 3. Ergodicity and Repetition (Solves Cases 1, 4, & 7)
  **The Principle:** EV describes the average outcome over *many* trials (ensemble average), not necessarily the outcome of a *single* life (time average).
  If a gamble is non-repeatable, risking ruin for high EV can be irrational. If it is repeatable, EV dominates.

  *   **Application:**
      *   **Case 7 (Repeated St. Petersburg):** You feel better about paying because the Law of Large Numbers kicks in. The "time average" growth rate converges to the expectation. This is the domain where naive EV works best.
      *   **Case 1 (Standard Gamble):** The risk is low, and you likely face many financial decisions in life. It approximates a repeatable scenario.
      *   **Case 4 (Saving Lives):** This is a one-shot (or few-shot) scenario for you. Because you cannot "average out" the risk of saving zero lives over 10,000 donations if you only have one donation to make, risk aversion is rational. Many ethicists argue for "risk-weighted utilitarianism" here: saving 1 life for sure is often preferred to a gamble on 100,000, because the marginal value of the *first* life saved is higher than the statistical aggregate.
  *   **Verdict:** Your hesitation in Case 4 is justified by the non-ergodic nature of the decision. Your willingness in Case 7 is justified by the ergodic nature.

  ---

  ### The Principled Line
  To answer your core question: **Is there a principled line?**
  Yes. The line is drawn at **Epistemic Stability** and **Utility Bounds.**

  1.  **If the utility is unbounded:** You must accept Pascal's Mugging. (Most people reject this, implying utility is bounded).
  2.  **If the probability is epistemically unstable:** You must discount the EV. (This separates Nuclear Risk from Astronomical Mugging).
  3.  **If the trial is non-repeatable:** You are permitted to be risk-averse. (This separates Single Life Saving from Repeated Gambling).

  ### Which Verdicts Must You Abandon?
  You generally do not need to abandon your gut verdicts, but you do need to abandon the **justification** that you are a "pure EV maximizer."

  *   **Abandon:** The idea that EV is the *sole* metric for single-shot, high-stakes, epistemically uncertain decisions.
  *   **Keep:** Your refusal of Pascal's Mugging (Case 3) and Astronomical Stakes (Case 5). These are features of rationality, not bugs. A decision theory that forces you to accept Case 5 is generally considered broken (this is why "Pascal's Mugging" is a reductio ad absurdum of naive EV).
  *   **Refine:** Case 4 (Saving Lives). If you were making this decision 1,000 times (e.g., you run a large foundation), you should switch to the probabilistic high-stakes option. If it is a one-off personal donation, your preference for certainty is acceptable risk aversion.

  ### Is "Messy" Ad Hoc?
  You asked if having different rules for different probability ranges is ad hoc.
  **No.** It is analogous to physics.
  *   Newtonian mechanics works for medium speeds.
  *   Relativity works for high speeds.
  *   Quantum mechanics works for small scales.

  We don't say physics is "ad hoc" for using different models at different scales; we say it is **domain-specific.**
  *   **Naive EV** works for **Casino/Gambling** (known odds, repeatable, bounded stakes).
  *   **Bounded Utility + Epistemic Discounting** works for **Existential/Philosophical** choices (unknown odds, one-shot, unbounded claims).

  ### Summary Recommendation
  You can resolve your tension by adopting **Risk-Weighted Expected Utility with Epistemic Discounting.**

  1.  **Cap your utility function.** (Money and bliss have diminishing returns).
  2.  **Discount probabilities** that rely on fragile chains of reasoning (Case 5) more than those based on robust models (Case 6).
  3.  **Allow risk aversion** for one-off decisions involving vital goods (like lives), but push toward EV maximization for repeatable financial decisions.

  Your intuitions are tracking these deeper principles better than the naive EV formula is. Trust the framework, not the raw math.
