answer: |-
  Here is a teaching plan designed for a 90-minute session with US first-year med students. It prioritizes clinical intuition over philosophical history and uses scaffolding to prevent common conceptual collapses.

  ### 1. Sequence of Ideas (The Scaffolding)
  Do not start with the labels "Naturalism" and "Normativism." If you lead with the taxonomy, they will treat it as vocabulary to memorize rather than a tool for reasoning. You need to generate the *problem* before offering the *solution*.

  **The Order:**
  1.  **The "Fact" Intuition:** Start with a clear biological abnormality (e.g., a broken femur). Get them to agree this is a disease regardless of what the patient values. This validates their current "textbook" mindset.
  2.  **The "Threshold" Problem:** Introduce a continuum where the biology is real, but the line for "disease" is not. (This is where your carrying example comes in). Ask: *"At what exact number does this become a disease?"*
  3.  **The "Harm" Condition:** Ask: *"If we find this abnormality, but it never causes symptoms or shortens life, is it still a disease?"* This separates biological dysfunction from negative value.
  4.  **The Labels (Naturalism vs. Normativism):** *Now* introduce the terms. Explain that Naturalism tries to solve step 2 using only biology/statistics, while Normativism argues step 3 (values/harm) is required to draw the line.
  5.  **The Synthesis:** Show that clinical practice requires both. You need the biology (Naturalism) to identify the candidate, and the values (Normativism) to decide if it warrants the label "disease" and intervention.

  ### 2. The Carrying Example
  **Recommendation: Osteoporosis (specifically the T-Score cutoff).**

  **Why this works:**
  *   **It's Pathology-Adjacent:** They are learning about bone density and structure. It feels "real" and biological, satisfying the Naturalist intuition.
  *   **The Line is Arbitrary:** The WHO definition of osteoporosis is a T-score of -2.5. This was not discovered in nature; it was chosen by a committee to predict fracture risk relative to treatment cost/side effects.
  *   **It Avoids Stigma:** Unlike obesity or hypertension, osteoporosis doesn't carry immediate baggage about lifestyle choices or socioeconomic status, keeping the focus on the *definition*.
  *   **It Allows Both Sides:**
      *   *Naturalist:* "Bone density is an objective physical fact. Below a certain point, the mechanical function fails."
      *   *Normativist:* "Why -2.5? Why not -2.0? That choice depends on how much we value fracture prevention vs. the cost/side effects of bisphosphonates. The 'disease' status changes if the treatment changes."

  **How to run it:**
  Show a DXA scan report. Show two patients: Patient A (T-score -2.4) and Patient B (T-score -2.6). Ask: *"Biologically, is the difference between these two patients qualitative or quantitative?"* (Answer: Quantitative). *"So why is one 'healthy' and one 'diseased'?"* This forces them to admit a normative judgment created the category.

  ### 3. Anticipated Misconceptions & Preemption
  There are two major conceptual collapses you need to head off.

  **Misconception 1: "If values are involved, the disease isn't real." (The Social Constructionist Slide)**
  *   **When it pops up:** Immediately after you introduce Normativism. Students will hear "values" and think "opinion" or "fake."
  *   **How to preempt:** When introducing Normativism (Minute 45), use this phrasing: *"Saying a concept is value-laden does not mean the underlying biology is fake. Blood in the stool is a biological fact. Deciding that 'blood in the stool' counts as 'disease' rather than 'normal variation' involves a judgment about harm. The judgment is normative; the blood is real."*
  *   **Activity:** Ask them: *"Is 'emergency' a real concept?"* (Yes). *"Does it depend on values?"* (Yes, we value saving lives). *"Does that make emergencies fake?"* (No). Use this analogy to decouple "value-laden" from "unreal."

  **Misconception 2: "Naturalism means we don't need to consider patient goals."**
  *   **When it pops up:** During the Osteoporosis discussion. They might argue that if the bone density is low, you must treat.
  *   **How to preempt:** During the "Harm" condition step (Minute 30), ask: *"If an 85-year-old patient with a T-score of -2.6 says they do not care about fracture risk and do not want medication, do they still have a disease that requires management?"* This forces them to see that even if the biology is "natural," the *medicalization* is normative.

  ### 4. The Assessment Question
  Do not ask them to define the terms. Ask them to apply the distinction to a novel case where the biology is clear but the "disease" status is contested.

  **The Question:**
  > "Consider **Sarcopenia** (age-related muscle loss). We can measure muscle mass objectively (Naturalist). However, it happens to everyone as they age, and not everyone wants to treat it with hormones or exercise.
  >
  > **If you take a Naturalist stance, is Sarcopenia a disease? If you take a Normativist stance, is it a disease? Explain why your answers might differ.**"

  **What to look for:**
  *   **Surface-level understanding:** They just define the terms.
  *   **Deep understanding:** They note that the Naturalist *might* call it a dysfunction of the musculoskeletal system regardless of age, while the Normativist would argue that if it's "normal aging" and the patient doesn't value muscle mass over other goals, labeling it a "disease" is a category error or an unwarranted medicalization.

  ### 5. What to Explicitly Leave Out
  To keep this to 90 minutes and prevent glazing over, put these on a "Parking Lot" slide at the end and tell them these are advanced topics they can explore later:

  1.  **Metaethical Underpinnings:** Do not discuss cognitivism vs. non-cognitivism or whether moral truths exist. Keep it on *clinical* values (harm, function, goals).
  2.  **Boorse's Reference Class Problem:** Do not get into the weeds of how to define "species-typical function" (e.g., is a 90-year-old's function compared to a 20-year-old's?). Just acknowledge that "normal" is statistical, not absolute.
  3.  **Foucault/Power Dynamics:** While relevant to normativism, bringing in power structures often makes med students defensive ("Are you saying my profession is just social control?"). Keep the focus on *clinical decision-making*, not political critique.

  ---

  ### Suggested Run-of-Show (90 Minutes)

  **0:00 – 0:15 | The Hook: "The Normal Lab Range"**
  *   **Activity:** Project a standard CBC lab report with reference ranges.
  *   **Ask:** "Who decided these numbers? If your white blood cell count is 4.4 and the cutoff is 4.5, are you sick?"
  *   **Point:** Establish that medicine already uses lines that aren't found in nature.

  **0:15 – 0:45 | The Case: Osteoporosis (Small Groups)**
  *   **Handout:** A one-pager on Osteoporosis definitions (WHO T-score -2.5) and fracture risk data.
  *   **Task:** In groups of 3, answer: "Is the -2.5 cutoff a discovery or a decision? If a new drug came out that was cheaper and safer, should we move the line to -2.0? Does moving the line change the *biology* or the *disease*?"
  *   **Debrief:** Get answers on the board. Highlight the tension between "bone reality" and "treatment threshold."

  **0:45 – 1:05 | The Framework: Naming the Intuitions**
  *   **Lecture (Interactive):** Introduce Naturalism (Disease = Biological Dysfunction) vs. Normativism (Disease = Biological Dysfunction + Bad Outcome/Value Judgment).
  *   **Map it:** Map their Osteoporosis comments to the theories. "When you said 'the bone is weak,' that was Naturalism. When you said 'but we only care if it breaks,' that was Normativism."
  *   **Preempt Misconceptions:** Use the "Emergency" analogy here to ensure they don't think Normativism = "It's all in your head."

  **1:05 – 1:20 | Stress Test: Infertility or Sarcopenia**
  *   **Activity:** Briefly present **Infertility** (defined as 1 year of unprotected intercourse without conception).
  *   **Ask:** "Why one year? Why not 6 months? Why not 2 years? Is the 'disease' present at month 11?"
  *   **Goal:** Show how time-bound goals (values) create disease categories even when biology is static.

  **1:20 – 1:30 | Wrap & Assessment**
  *   **Individual Writing:** Pose the **Sarcopenia Question** (see above). Have them write for 5 minutes.
  *   **Collection:** Collect these as "exit tickets" to gauge understanding.
  *   **Closing:** "You don't need to be philosophers to practice medicine. But knowing *why* you call something a disease helps you know *when* to treat it."
