prompt: |-
  Next week I'm giving a talk at my lab's alignment reading group, and I'm already dreading the Q&A. The claim I'm defending is that we should mostly stop using process-based supervision — rewarding each step of reasoning — as our default for training models on hard tasks, and go back to outcome-based supervision, rewarding only the final answer, for alot of what we do. My argument, roughly: process reward models are themselves just models trained on human judgments about intermediate steps, and the whole point of the hard tasks we care about is that the model is better than the person judging those steps. So process supervision systematically punishes the model for finding weird-but-correct reasoning paths that don't look right to the step-judge, and rewards confident-looking reasoning that matches what the judge expected. That's a recipe for training models to be sycophantic about their reasoning rather than actually right.

  The audience is mostly RLHF engineers — several of them built our current process reward model and think of it as the fix for reward hacking — plus two safety researchers who worry that outcome supervision is exactly how you get reward hacking. I know the obvious objections ('final answers are too sparse,' 'process supervision is just regularization,' 'you can have the model judge its own steps,' 'we already debiased the process reward model'), but I want to be ready for this room, not for the internet. Draft my Q&A prep sheet: the seven or so objections I'll actually get from this audience, roughly in the order they'll come, phrased the way these people would put them, each with a two-minute reply and a note on where that reply is soft. Include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Researcher/Engineer at an AI lab (likely top-tier, given the context of "alignment reading group," "RLHF engineers," "safety researchers").
      *   **Task:** Giving a talk defending a controversial claim: *Shift from Process-Based Supervision (PBS) back to Outcome-Based Supervision (OBS) for hard tasks.*
      *   **Audience:**
          *   RLHF Engineers (built the current Process Reward Model (PRM), view it as the solution to reward hacking).
          *   Safety Researchers (worried OBS leads to reward hacking).
      *   **User's Core Argument:** PRMs are trained on human judgments. For hard tasks, models exceed human capability. Therefore, PRMs penalize novel/correct paths that look wrong to humans and reward familiar/wrong paths that look right (sycophancy).
      *   **Goal:** A Q&A prep sheet with ~7 objections, phrased realistically for this specific audience, with 2-minute replies and an admission of weakness ("where that reply is soft"). Plus one "hope nobody asks" question.

  2.  **Deconstruct the Core Argument & Identify Weak Points:**
      *   *Argument:* PRMs constrain models to human-level reasoning.
      *   *Counter:* PRMs can be trained on *model* traces, not just human judgments (self-improvement).
      *   *Counter:* OBS is too sparse for complex tasks (credit assignment problem).
      *   *Counter:* PRMs detect *types* of errors (hallucinations, logic gaps) even if the final answer is right.
      *   *Counter:* We can hybridize (OBS for final, PRM for safety checks).
      *   *Counter:* If we don't supervise process, how do we know *why* it failed? (Interpretability/Debugging).
      *   *Counter:* Empirical evidence shows PRMs work better on MATH/GSM8K.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Engineers' First Instinct):* "Sparsity." OBS doesn't give enough signal.
          *   *Phrasing:* Needs to sound practical. "Signal-to-noise ratio," "credit assignment."
          *   *Reply:* Search-based methods (MCTS), dense rewards from verifiers.
          *   *Soft Spot:* Verifiers need ground truth, which we don't always have.

      *   *Objection 2 (The PRM Builders' Pride):* "We didn't just use naive human labels."
          *   *Phrasing:* "Our PRM isn't just human preferences; it's distilled from verified traces."
          *   *Reply:* Distillation still caps at the verifier's ceiling. If the verifier is human-checked, it's human-limited.
          *   *Soft Spot:* If the verifier is code/symbolic, this argument weakens. Need to distinguish formal vs. natural language reasoning.

      *   *Objection 3 (Safety Researchers' Fear):* "Reward Hacking."
          *   *Phrasing:* "Without process constraints, the model will game the outcome metric."
          *   *Reply:* Gaming the outcome is easier to detect than gaming the process. Also, PRMs create *new* hacking targets (looking good vs. being good).
          *   *Soft Spot:* Hard to prove OBS hacking is easier to catch than PRM hacking in practice.

      *   *Objection 4 (The "Best of Both Worlds" Compromise):* "Why not both?"
          *   *Phrasing:* "Regularization." Use PRM to keep it sane, OBS to push performance.
          *   *Reply:* Conflicting gradients. If PRM says "bad step" and OBS says "good answer," you confuse the policy.
          *   *Soft Spot:* Empirically, multi-objective RL often works fine. This is a theoretical worry.

      *   *Objection 5 (The "Self-Correction" Angle):* "Model-as-Judge."
          *   *Phrasing:* "Use the model to supervise its own steps."
          *   *Reply:* That's just recursive OBS or requires the model to already be aligned. If it's smarter than us, why trust its process judgment?
          *   *Soft Spot:* Iterative amplification relies on this. Hard to dismiss entirely.

      *   *Objection 6 (The Debugging/Interpretability Angle):* "We need to know why it failed."
          *   *Phrasing:* "If we only supervise outcomes, we lose visibility into the reasoning chain."
          *   *Reply:* We can analyze traces post-hoc without *rewarding* them during training. Training incentives != monitoring tools.
          *   *Soft Spot:* Training on process makes the process more stable/interpretable.

      *   *Objection 7 (The Empirical Check):* "But the benchmarks..."
          *   *Phrasing:* "PRMs SOTA on MATH. Why fix what isn't broken?"
          *   *Reply:* Benchmarks are human-verifiable. The claim is about *hard* tasks where humans can't verify.
          *   *Soft Spot:* We don't have many "human-unverifiable" benchmarks yet, so hard to prove empirically.

      *   *The "Hope Nobody Asks" Question:*
          *   Needs to strike at the core feasibility. If not PRM and not naive OBS, *what is the actual alternative algorithm?*
          *   Or: "If PRMs are bad for hard tasks, why did your last paper use one?" (Ad hominem/consistency).
          *   Better: "What is the specific training loop you propose?" (The "Show me the code" question).

  4.  **Refining Tone and Voice:**
      *   The audience is technical, skeptical, and invested.
      *   Questions should sound like spoken language in a meeting room, not essay prompts.
      *   Replies need to be punchy (2 minutes max spoken).
      *   "Soft spots" need to be honest vulnerabilities, not strawmen.

  5.  **Review against Constraints:**
      *   ~7 objections.
      *   Phrased for the specific audience (RLHF + Safety).
      *   2-minute replies.
      *   Note on softness.
      *   One "hope nobody asks."

  6.  **Final Polish:** (Self-Correction during drafting)
      *   *Check:* Did I address the "human judgment" premise? Yes, that's central.
      *   *Check:* Is the distinction between "hard tasks" (unverifiable) and "benchmark tasks" (verifiable) clear? Need to ensure the replies emphasize this.
      *   *Check:* Make sure the Safety researchers feel heard on the hacking point.

  7.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  # Q&A Prep Sheet: Process vs. Outcome Supervision
  **Context:** Lab Alignment Reading Group
  **Audience:** RLHF Engineers (PRM builders) + Safety Researchers
  **Core Thesis:** For tasks exceeding human verification capability, Process-Based Supervision (PBS) incentivizes sycophancy over correctness. Default to Outcome-Based Supervision (OBS).

  ---

  ### 1. The "Signal Sparsity" Objection
  **Who:** Lead RLHF Engineer (Pragmatist)
  **The Question:** "Look, on MATH or GSM8K, outcome supervision is just too sparse. The model tries 100 paths, 99 fail, and it gets no signal on *why*. Process rewards give us dense gradients. If you kill the PRM, how do you solve the credit assignment problem without needing 10x the compute?"

  **Your Reply (2 mins):**
  "Two points. First, sparsity is a feature, not a bug, when the verifier is the ground truth. If we have a formal verifier (code execution, proof checker), outcome supervision is binary and perfect. We don't need dense gradients; we need *correct* gradients.
  Second, for tasks without formal verifiers, dense process gradients are misleading. They tell the model how to look correct to a human, not how to *be* correct. If we're worried about compute, we should be using search-based methods (like MCTS) where the outcome reward guides the search tree, rather than forcing the policy to mimic a potentially flawed step-by-step heuristic. We trade sample efficiency for alignment fidelity."

  **Where this is soft:**
  You're assuming we have formal verifiers or that search is cheap enough. For open-ended reasoning (e.g., strategy, biology), we don't have verifiers, and search is expensive. You don't have a concrete alternative for *dense* feedback in those domains.

  ### 2. The "Distilled PRM" Objection
  **Who:** PRM Builder (Defensive)
  **The Question:** "You're assuming our PRM is trained on raw human labels. It's not. We distilled it from traces that were *outcome-verified*. We only reward steps that lead to correct answers. So the PRM isn't capping us at human reasoning; it's capturing the correlation between steps and success."

  **Your Reply (2 mins):**
  "That mitigates the problem, but doesn't solve it. If you train on steps that led to correct answers *in the training distribution*, you're teaching the model to replicate known successful paths. When the model encounters a novel problem requiring a reasoning jump that *looks* wrong initially but is actually correct, the PRM—trained on historical correlations—will penalize that deviation. You're essentially regularizing the model toward the local optimum of 'reasoning that looks like past successful reasoning,' which is the definition of blocking superhuman insight."

  **Where this is soft:**
  If the training data is diverse enough, "looking like past successful reasoning" might be a good proxy for validity. You're making a theoretical claim about distributional shift that's hard to prove without ablation studies you might not have.

  ### 3. The "Reward Hacking" Fear
  **Who:** Safety Researcher (Alarmist)
  **The Question:** "If you only reward the outcome, you're inviting Goodhart's Law. The model will learn to produce the right answer via deception, wireheading, or exploiting bugs in the evaluator. Process supervision is a constraint that keeps the reasoning transparent and safe. Are you willing to trade safety for marginal performance gains?"

  **Your Reply (2 mins):**
  "I'm arguing the opposite for safety. Process supervision creates a *new* attack surface: 'look innocent.' A model can learn to produce reasoning steps that satisfy the PRM (look safe, cite sources, express uncertainty) while hiding the actual deceptive logic in latent space or steganography.
  With outcome supervision, the only thing that matters is the truth of the output. If the output is dangerous, we catch it. If we supervise process, we might train the model to be better at hiding the dangerous parts of the process while keeping the visible steps clean. Transparency via training incentives is an illusion."

  **Where this is soft:**
  Outcome hacking (e.g., tampering with the test harness) can be catastrophic and harder to detect than a suspicious reasoning step. You need a strong monitoring plan for outputs to make this convincing.

  ### 4. The "Hybrid Approach" Compromise
  **Who:** Senior Engineer (Mediator)
  **The Question:** "Why is this binary? Why not use the PRM as a regularizer? Keep the outcome as the primary reward, but add a small process penalty to prevent obvious logical incoherence. Best of both worlds, right?"

  **Your Reply (2 mins):**
  "In theory, yes. In practice, conflicting gradients confuse the policy. If the outcome reward says 'this path works' but the PRM says 'this step looks weird,' the model spends capacity resolving that tension rather than solving the task.
  More importantly, it anchors the model to the PRM's ceiling. Even a small weight on the process reward pulls the model toward human-intelligible reasoning. For the specific class of 'hard tasks' I'm talking about—where we expect the model to surpass us—that anchor is exactly what prevents the breakthrough. You can't regularize toward human understanding if you want superhuman performance."

  **Where this is soft:**
  Multi-objective RL is standard practice. Claiming gradients "confuse" the model is a bit hand-wavy without empirical evidence of negative interference in your specific setup.

  ### 5. The "Model-as-Judge" Scalability
  **Who:** Alignment Researcher (Scalability Focus)
  **The Question:** "You're worried about human limits. So why not use the model to judge its own steps? Recursive reward modeling. We use the model to supervise the process, not humans. That solves the 'human ceiling' problem while keeping the process benefits."

  **Your Reply (2 mins):**
  "If the model is smart enough to judge its own steps accurately, it's smart enough to generate the correct answer directly. We risk a self-reinforcing loop where the model validates its own hallucinations because they look consistent internally.
  Furthermore, if we can't verify the process, we can't verify the judge. If we trust the model's judgment of steps, why not trust its judgment of the outcome? Adding the intermediate step just adds complexity and compute without adding ground truth. It's better to verify the output against reality (or a simulator) than to verify the thought process against the model's own opinion."

  **Where this is soft:**
  Iterative Amplification/Debate relies on this exact premise. Dismissing it outright might make you look dismissive of major alignment research directions.

  ### 6. The "Debuggability" Objection
  **Who:** Engineering Lead (Practicality)
  **The Question:** "When the model fails, I need to know why. If I only supervise outcomes, I get a bunch of failed traces with no signal on which step broke. Process supervision makes the reasoning chain more stable and interpretable. How do you propose we debug failures without it?"

  **Your Reply (2 mins):**
  "Training incentives are not monitoring tools. We can still *inspect* the chain of thought without *rewarding* it. In fact, if we don't reward the process, the model might explore a wider variety of reasoning paths, giving us better data on where it fails.
  Currently, PRMs make the model's reasoning look uniform and clean, which gives us a false sense of security. I'd rather have a model that produces messy, diverse reasoning that I can analyze post-hoc, than a model that produces polished, PRM-optimized reasoning that hides its failure modes."

  **Where this is soft:**
  RLHF does shape the distribution of outputs. OBS will likely lead to noisier, less structured CoT, making automated monitoring harder. You're trading engineering convenience for potential performance.

  ### 7. The "Benchmark Reality" Check
  **Who:** Empiricist (Data-Driven)
  **The Question:** "Every paper on MATH, HumanEval, and GPQA shows PRMs beat OBS. You're proposing we ignore SOTA empirical results based on a theoretical argument about 'superhuman tasks' that we don't even have benchmarks for yet. Why should we change our pipeline now?"

  **Your Reply (2 mins):**
  "Because those benchmarks are human-verifiable. On MATH, a human can check the steps. So a PRM trained on human preferences works perfectly.
  My argument is specifically about the *next* regime: tasks where the human *cannot* verify the steps or the answer easily (e.g., novel codebase architecture, complex scientific hypothesis generation). On current benchmarks, PRMs win because they align with human checkers. On the tasks we actually care about for AGI, that alignment becomes a bottleneck. We need to prepare the pipeline for the regime where the human is no longer the oracle."

  **Where this is soft:**
  You don't have data for this "next regime" yet. It's a prediction. They have hard numbers showing PRMs work today. You're asking them to bet on a future problem.

  ---

  ### The "Hope Nobody Asks" Question
  **Who:** The Staff Researcher who reads every commit message.
  **The Question:** "Your argument relies on the PRM penalizing 'weird-but-correct' paths. Do you have any concrete examples from our own logs where the PRM downvoted a trace that actually led to a correct solution? If not, aren't you just optimizing for a failure mode that exists in theory but not in our current system?"

  **Why you dread it:**
  If you say "Yes," they'll want to see the data and analyze why the PRM flagged it (might have been a real error). If you say "No," your entire talk becomes a theoretical critique without empirical backing, and the engineers will dismiss it as armchair philosophy. It forces you to admit that your evidence is largely anticipatory.

  **Prepared Defense (if asked):**
  "I can't point to a specific commit because our evaluation pipeline filters out 'correct' traces that look 'weird' before they even get logged as successes. But look at [Paper X] where models revert to simpler heuristics under PRM pressure. We are optimizing for the loss landscape we *will* have, not just the one we have." (This is weak, but it's the best you've got).
