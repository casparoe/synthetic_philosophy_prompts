prompt: |-
  I'm a handling editor at an evolutionary biology journal, and I have a problem that won't go away. A large fraction of our submissions follow the same template: identify a trait, propose a selective regime that would have favored it, present comparative or experimental evidence consistent with that story, and conclude the trait is an adaptation for that function. The Gould–Lewontin spandrels paper is now over forty years old, and every author cites it in the introduction, but in practice our reviewers still evaluate adaptationist manuscripts by asking whether the evidence is consistent with the author's story rather than whether the alternatives have been seriously ruled out. I want to stop this at the editorial level.

  Please write me a reviewer rubric — a decision procedure that a referee (and I, as handling editor) can use when evaluating a paper that claims trait T is an adaptation for function F. The procedure should be a sequence of questions or checks, ordered so that a paper can be rejected or sent back for major revision at an early step when it fails a basic burden. For each step, specify what counts as a sufficient answer and what merely looks like one, and distinguish the failures that are fatal from those that can be addressed with more data. Flag the points where the reviewer has to make a judgment call rather than apply a clear criterion, and be explicit about which steps are grounded in the spandrels critique specifically — the problem of treating an organism as an atomized collection of separately optimized traits, the failure to consider structural and developmental constraints, the conflation of current utility with historical origin, and the neglect of drift and allometry — as opposed to general scientific skepticism that would apply to any causal claim. The procedure needs to be usable by a typical working evolutionary biologist who knows the empirical literature but hasn't read the philosophy.

  Then walk the procedure through three hypothetical submissions (summarize the paper, don't fabricate data): (1) a comparative study claiming the human chin evolved as mechanical reinforcement against masticatory stress, (2) a paper arguing that a particular bird song variant functions as an honest signal of condition in mate choice, and (3) a paper revisiting the panda's thumb and arguing, against Gould, that the enlarged radial sesamoid is in fact a bona fide adaptation for bamboo stripping rather than a structurally constrained exaptation. For at least one of these, the procedure should return an answer the authors will not like — and explain why.

  Finally, tell me where the procedure will systematically misfire: what kinds of adaptive claims it is structurally blind to, what forms of evidence it cannot assess (and therefore what kinds of papers it would unfairly penalize), and whether relying on it would bias the literature toward or away from any particular kind of evolutionary explanation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Handling editor at an evolutionary biology journal.
      *   **Problem:** Persistent "adaptationist programme" (Gould & Lewontin, 1979) despite citations. Reviewers accept "consistent with" evidence rather than demanding alternatives be ruled out.
      *   **Task:** Create a reviewer rubric/decision procedure for evaluating adaptationist claims (Trait $T$ is an adaptation for Function $F$).
      *   **Requirements:**
          *   Sequential steps (early rejection possible).
          *   Distinguish sufficient vs. superficial answers.
          *   Distinguish fatal flaws vs. fixable issues.
          *   Flag judgment calls.
          *   Explicitly link steps to *Spandrels* critiques (constraints, atomization, history vs. utility, drift/allometry) vs. general skepticism.
          *   Usable by working biologists (not philosophers).
          *   Apply to three hypothetical cases (Human chin, Bird song, Panda's thumb).
          *   At least one case must result in a negative outcome with explanation.
          *   Critique the rubric itself (blind spots, biases).

  2.  **Deconstruct the "Spandrels" Critique:**
      *   What did Gould & Lewontin actually argue?
          *   Organisms are integrated wholes, not collections of independent traits (atomization).
          *   Traits may be byproducts (spandrels) of other adaptations or structural constraints (developmental/physical).
          *   Current utility $\neq$ historical origin (exaptation).
          *   Null hypotheses (drift, allometry) are often ignored.
          *   "Just-so stories" are easy to construct but hard to verify.
      *   *Goal:* Translate these philosophical points into actionable checklist items for a reviewer.

  3.  **Drafting the Rubric (The Decision Procedure):**
      *   *Structure:* Needs to be a funnel. Start with the easiest/hardest constraints.
      *   *Step 1: Variation & Heritability.* (Basic evolutionary requirement). If no variation, no selection.
      *   *Step 2: The Null Model (Drift/Allometry).* This is core *Spandrels*. Did they test against drift? Is it just size scaling?
      *   *Step 3: Constraints & Integration.* (Core *Spandrels*). Is $T$ independent? Could it be a byproduct of $X$?
      *   *Step 4: History vs. Utility.* (Core *Spandrels*). Did it evolve *for* $F$, or was it co-opted? Phylogenetic reconstruction needed.
      *   *Step 5: Comparative/Experimental Rigor.* (General science). Is the evidence actually distinguishing $F$ from $G$?
      *   *Step 6: Optimality.* (Core *Spandrels*). Is it actually "good" at $F$, or just "good enough"?

      *Refining the Steps for the Prompt:*
      *   Need to make sure the *Spandrels* specific points are highlighted.
      *   Need to define "Fatal" vs. "Fixable."
      *   Need to identify "Judgment Calls."

  4.  **Developing the Hypothetical Cases:**
      *   *Case 1: Human Chin (Mechanical Reinforcement).*
          *   *Context:* Classic debate. Many think it's a spandrel of facial reduction.
          *   *Application:* Does the paper address facial reduction (constraint/byproduct)? Does it address phylogeny (only humans have it)?
          *   *Outcome:* Likely rejection if it ignores the developmental constraint argument.
      *   *Case 2: Bird Song (Honest Signal).*
          *   *Context:* Sexual selection is rampant with adaptationist stories.
          *   *Application:* Is it drift? Is it a byproduct of body size? Is current utility proven as historical origin?
          *   *Outcome:* Could pass if experimental manipulation exists, but risky on history.
      *   *Case 3: Panda's Thumb (Adaptation vs. Exaptation).*
          *   *Context:* The *iconic* Spandrels example. Gould argued it's a modified sesamoid (constraint), not a true digit.
          *   *Application:* To argue it *is* an adaptation, one must show selection acted on the sesamoid specifically for bamboo, not just that it works now.
          *   *Outcome:* High bar. If they just show it works for bamboo, that's utility, not origin. This should be the one the authors won't like.

  5.  **Critiquing the Rubric (The "Systematic Misfire" Section):**
      *   What does this rubric bias against?
      *   It might bias against *plausible* adaptive hypotheses that are hard to test historically (deep time).
      *   It might favor null hypotheses too strongly (Type II error).
      *   It might penalize natural history/observational studies in favor of heavy phylogenetic/experimental work.
      *   It assumes we *can* distinguish constraint from selection, which is sometimes impossible.

  6.  **Writing - Tone and Style:**
      *   Professional, authoritative, yet practical.
      *   Address the editor directly.
      *   Ensure the distinction between "Spandrels-specific" and "General Skepticism" is clear.

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Check:* Did I explicitly flag the *Spandrels* points? *Correction:* Add a column or bold text indicating [S] for Spandrels-critical steps.
      *   *Check:* Is the sequence logical? *Correction:* Put the Null Model (Drift/Allometry) early. If it's just allometry, stop there.
      *   *Check:* Are the hypothetical summaries realistic? *Correction:* Ensure they sound like actual abstracts.
      *   *Check:* Did I explain *why* the authors won't like the outcome? *Correction:* Be specific about the "Utility vs. Origin" trap.

  8.  **Final Polish:** Check against all constraints in the prompt. (Sequence, sufficient vs. superficial, fatal vs. fixable, judgment calls, Spandrels vs. General, 3 cases, critique of rubric).

  *(Self-Correction on Case 3)*: The Panda's thumb is a very specific historical argument. If a new paper claims it's an adaptation, they need phylogenetic evidence that the sesamoid enlargement correlates with bamboo eating *across* ursids, not just that pandas use it. I need to make sure the rubric catches the "current utility" fallacy here.

  *(Self-Correction on Rubric Structure)*: Make it look like a form or a checklist for usability.

  *(Final thought on Bias)*: Acknowledge that strict adherence might stifle hypothesis generation. The rubric is for *testing*, not *generating*.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  To: Handling Editor
  From: Evolutionary Theory Consultant
  Subject: Adaptationist Rubric and Decision Procedure

  Below is a decision procedure designed to operationalize the Gould–Lewontin (1979) critique for peer review. It is structured as a funnel: early steps address fundamental logical errors (fatal flaws), while later steps address evidentiary weight (fixable issues).

  ### The "Spandrels" Adaptationist Rubric (SAR)

  **Instruction to Reviewers:** Proceed sequentially. If a submission fails a step marked **FATAL**, recommend rejection. If it fails a step marked **FIXABLE**, recommend Major Revision. Steps marked **[S]** specifically address the *Spandrels* critique (constraints, atomization, history vs. utility, drift); unmarked steps are general scientific rigor.

  ---

  #### Step 1: Variation and Heritability [General]
  **Question:** Is there evidence that Trait $T$ varies within the ancestral population and that this variation is heritable?
  *   **Sufficient Answer:** Quantitative genetic estimates ($h^2$), or clear phenotypic variation in the fossil/extant record linked to lineage splitting.
  *   **Superficial Answer:** "The trait varies among species" (confuses phylogenetic difference with population variation).
  *   **Failure Mode:** **FATAL.** If $T$ is invariant or purely developmental noise, selection cannot act.
  *   **Judgment Call:** Low.

  #### Step 2: The Null Model (Drift and Allometry) [S]
  **Question:** Has the authors explicitly tested Trait $T$ against a null model of neutral drift or allometric scaling?
  *   **Sufficient Answer:** Phylogenetic comparative methods (e.g., PGLS) showing $T$ evolves faster than neutral markers, or residuals from body-size scaling are significantly correlated with Function $F$.
  *   **Superficial Answer:** "The trait is too complex to be drift" or "The correlation with size is weak, so we ignored it."
  *   **Failure Mode:** **FATAL.** If $T$ scales isometrically with body size, it may be a structural consequence of size, not a specific adaptation for $F$. If $T$ fits a Brownian motion model better than an Ornstein-Uhlenbeck model, drift is the better explanation.
  *   **Judgment Call:** Moderate (choice of null model).
  *   **Spandrels Link:** Neglect of drift and allometry.

  #### Step 3: Independence and Integration [S]
  **Question:** Is Trait $T$ treated as an independent unit, or is its developmental/structural integration with other traits accounted for?
  *   **Sufficient Answer:** Analysis of genetic covariance matrices ($G$-matrix) or developmental pathways showing $T$ can vary independently of Trait $X$ (which might be the actual target of selection).
  *   **Superficial Answer:** "We measured $T$ in isolation."
  *   **Failure Mode:** **FIXABLE.** If $T$ is a necessary byproduct of selecting for $X$ (a spandrel), claiming $T$ is an adaptation is false. Authors must reframe $T$ as a correlate or demonstrate decoupling.
  *   **Judgment Call:** High (requires knowledge of evo-devo constraints).
  *   **Spandrels Link:** Atomization of the organism; structural/developmental constraints.

  #### Step 4: History vs. Current Utility [S]
  **Question:** Does the evidence distinguish the *historical origin* of $T$ from its *current utility*?
  *   **Sufficient Answer:** Phylogenetic reconstruction showing $T$ arose concurrently with the ecological pressure for $F$, or experimental evolution showing $T$ evolves *de novo* under pressure $F$.
  *   **Superficial Answer:** "The trait performs $F$ well now, therefore it evolved for $F$."
  *   **Failure Mode:** **FIXABLE.** This is the Exaptation trap. If $T$ existed before pressure $F$, it is an exaptation. Authors must change language from "adaptation for" to "co-opted for."
  *   **Judgment Call:** Moderate (depends on fossil/phylogenetic resolution).
  *   **Spandrels Link:** Conflation of current utility with historical origin.

  #### Step 5: Comparative Specificity [General]
  **Question:** Does the evidence rule out alternative functions ($G$, $H$, $I$)?
  *   **Sufficient Answer:** Experimental manipulation or comparative data showing $T$ correlates with $F$ but *not* with plausible alternatives (e.g., thermoregulation, predator defense).
  *   **Superficial Answer:** "We can't think of another function."
  *   **Failure Mode:** **FIXABLE.** "Consistent with" is not "diagnostic of." Authors need to test competing adaptive hypotheses.
  *   **Judgment Call:** Low.

  #### Step 6: Optimality and Design [S]
  **Question:** Is Trait $T$ actually well-designed for $F$, or merely "good enough"?
  *   **Sufficient Answer:** Engineering analysis or cost-benefit modeling showing $T$ approaches a local optimum for $F$ given constraints.
  *   **Superficial Answer:** "It works."
  *   **Failure Mode:** **FIXABLE.** If $T$ performs $F$ poorly compared to known alternatives (e.g., a "thumb" that is clumsy compared to a true digit), it suggests constraint rather than optimization.
  *   **Judgment Call:** High (defining "optimal" is theoretically fraught).
  *   **Spandrels Link:** Organism as an optimized collection of traits.

  ---

  ### Application to Hypothetical Submissions

  #### Case 1: The Human Chin (Mechanical Reinforcement)
  **Summary:** The authors use Finite Element Analysis (FEA) on human and chimpanzee mandibles. They simulate masticatory stress and show that the human chin reduces strain in the symphysis during chewing. They conclude the chin is an adaptation for processing tough foods.
  **Rubric Walkthrough:**
  *   **Step 1 (Variation):** Pass. Chins vary.
  *   **Step 2 (Null/Allometry):** **FAIL (FATAL).** The authors compare humans to chimps but do not control for overall facial reduction. As hominins evolved smaller faces, the mandible may have buckled, requiring a bony keel (the chin) simply to maintain structural integrity as a byproduct of size reduction, not specific selection for chewing tough food. The paper treats the chin as an independent module rather than a structural consequence of facial retraction.
  *   **Step 3 (Integration):** **FAIL (FATAL).** The chin is developmentally linked to the entire mandibular symphysis. The authors treat it as an atomized trait added to the jaw.
  *   **Outcome:** **Reject.**
  *   **Why authors won't like it:** They provided functional evidence (FEA shows it *works*). The rubric rejects this because *working* (utility) is not *origin* (history/constraint). The chin is likely a spandrel of facial reduction, not a direct target of selection for chewing.

  #### Case 2: Bird Song Variant (Honest Signal)
  **Summary:** A study on a passerine shows males with a specific trill variant have higher parasite resistance. Females prefer the variant. The authors argue the trill evolved via sexual selection as an honest signal of condition.
  **Rubric Walkthrough:**
  *   **Step 1 (Variation):** Pass.
  *   **Step 2 (Null/Allometry):** Pass. They control for body size (which affects frequency).
  *   **Step 3 (Integration):** Pass. Song learning allows decoupling from morphology.
  *   **Step 4 (History vs. Utility):** **FAIL (FIXABLE).** The paper shows current correlation between the trill and health. It does not show the trill *originated* for this purpose. It could be a sensory bias exaptation.
  *   **Step 5 (Specificity):** Pass. They rule out territorial defense as the primary driver.
  *   **Outcome:** **Major Revision.**
  *   **Requirement:** Authors must temper claims. Change "evolved as an honest signal" to "currently functions as an honest signal." Unless they have phylogenetic data showing the trill arose coincident with parasite load pressure, they cannot claim historical adaptation.

  #### Case 3: The Panda's Thumb (Revisited)
  **Summary:** The authors argue the enlarged radial sesamoid in *Ailuropoda melanoleuca* is a bona fide adaptation for bamboo stripping, not a constraint. They show pandas strip bamboo faster with the sesamoid than without (simulated), and that the sesamoid is larger in pandas than in other bears.
  **Rubric Walkthrough:**
  *   **Step 1 (Variation):** Pass.
  *   **Step 2 (Null/Allometry):** Pass.
  *   **Step 3 (Integration):** **FAIL (FIXABLE).** The sesamoid is a wrist bone co-opted as a digit. The authors must address why a true digit did not evolve (developmental constraint).
  *   **Step 4 (History vs. Utility):** **FAIL (FATAL).** This is the critical step. The paper demonstrates *current utility* (it strips bamboo well). It does not demonstrate *historical origin*. To prove adaptation, they must show that selection acted on the sesamoid *specifically* to lengthen it for bamboo, rather than the sesamoid lengthening for other wrist-stability reasons and then being used for bamboo.
  *   **Step 6 (Optimality):** **FAIL (FIXABLE).** The "thumb" is clumsy compared to a true opposable digit. It is a "good enough" solution constrained by the bear limb plan, not an optimal design.
  *   **Outcome:** **Reject.**
  *   **Why authors won't like it:** This is the quintessential *Spandrels* example. The authors will argue "But it *is* adaptive now!" The rubric forces the distinction: Being useful now does not make it an adaptation *for* that use. It is likely an exaptation constrained by the carnivoran wrist. Accepting this paper would validate the exact "just-so story" logic Gould warned against.

  ---

  ### Systematic Misfires and Biases of the Rubric

  As an editor, you must recognize that this rubric is not neutral. It encodes specific epistemological preferences that will shape your journal's content.

  **1. Structural Blindness to Deep Time:**
  The rubric heavily penalizes claims about historical origin (Step 4). For many taxa (e.g., extinct lineages, microbes with poor fossil records), reconstructing the *order* of trait emergence vs. ecological pressure is impossible.
  *   **Bias:** This will systematically favor studies on recent radiations (cichlids, Darwin's finches) where phylogenies are resolved, and penalize paleobiology or deep-time macroevolution. You may reject true adaptive explanations simply because the history is obscured.

  **2. The "Null Hypothesis" Trap:**
  Step 2 demands rigorous null modeling (drift/allometry). However, statistical power to distinguish selection from drift is often low, especially with small sample sizes common in rare species.
  *   **Bias:** This biases the literature toward "null results." You will publish more papers saying "Trait $T$ is likely drift" and fewer saying "Trait $T$ is adaptation," even if adaptation is true. It increases Type II errors (false negatives regarding adaptation).

  **3. Constraint vs. Selection Dichotomy:**
  The rubric treats "constraint" and "selection" as distinct categories (Step 3 & 6). In reality, selection acts *through* constraints. A trait can be both constrained *and* adaptively optimized within those bounds.
  *   **Bias:** By forcing authors to choose, you may penalize nuanced papers that argue for "constrained optimization." The rubric favors clean stories over messy biological reality.

  **4. Experimental vs. Observational:**
  The rubric rewards experimental manipulation (Step 5) and phylogenetic reconstruction (Step 4).
  *   **Bias:** This disadvantages natural history and descriptive morphology. A brilliant observational naturalist who identifies a functional link but cannot manipulate the trait or resolve the phylogeny will be rejected. This accelerates the shift of evolutionary biology away from field naturalism toward lab/phylo-quantitative methods.

  **5. The "Adaptationist" Paradox:**
  By making it harder to publish adaptationist claims, you may inadvertently stifle the generation of adaptive hypotheses. Scientists may stop proposing adaptive functions for fear of the rubric, leading to a literature that describes *patterns* without explaining *processes*.
  *   **Recommendation:** Use this rubric for **Claims of Proof**, not **Claims of Hypothesis**. If a paper says "We hypothesize $T$ is for $F$," be lenient. If a paper says "We demonstrate $T$ is an adaptation for $F$," apply the rubric strictly.

  **Final Advice:**
  The *Spandrels* paper was not a call to stop studying adaptation; it was a call to study it rigorously. This rubric enforces that rigor. However, be prepared for pushback. Authors rejected under Step 4 (History vs. Utility) will argue that current utility is the best proxy we have for history. They are not wrong, but they are not meeting the burden of proof for *adaptation* specifically. Your journal's brand will become "The place that stops just-so stories," which is valuable, but ensure you don't become "The place that publishes nothing but null models."
