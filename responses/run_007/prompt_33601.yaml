answer: |-
  This is a fascinating debugging problem. Your friend isn't running a simple "Fake = Bad" script; she's running a context-dependent ontology checker. She distinguishes between objects where *history is a feature* (paintings, texts) and objects where *history is metadata* (songs, functional items).

  Here is the breakdown of the candidate rules, the prediction for the inheritance case, and the test to confirm it.

  ### The Candidate Rules Table

  | Candidate Rule | One-Sentence Summary | Case 1 (Vermeer) | Case 2 (Dylan) | Case 3 (Plagiarism) | Case 4 (Rosetta) | Case 5 (Jazz) | Case 6 (Bag) | Consistent? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Moral Contamination Heuristic** | If deception was involved in the creation, the object is tainted; otherwise, it's fine. | **Fail** (Tainted) | **Pass** (No deception) | **Fail** (Tainted) | **Pass** (Labeled replica) | **Pass** (Tribute) | **Fail** (Counterfeit is deceptive, but she says quality is same) | **No** (Fails Case 6) |
  | **2. The Medium-Dependent Aura** | For static art (painting/text), origin is part of the work; for performance/function (music/bags), physical experience rules. | **Pass** (Origin matters) | **Pass** (Sound matters) | **Pass** (Author matters) | **Pass** (Visual data matters) | **Pass** (Performance matters) | **Pass** (Function matters) | **Yes** |
  | **3. The Constitutive Narrative** | For certain media, the story of creation is a literal ingredient in the object's identity; changing the story changes the object. | **Pass** (Story changed -> Object worse) | **Pass** (Story changed -> Object same) | **Pass** (Story changed -> Object ruined) | **Pass** (Story irrelevant -> Object same) | **Pass** (Story changed -> Object different) | **Pass** (Story irrelevant -> Object same) | **Yes** |
  | **4. The Directional Asymmetry** | Discovering something is fake ruins it, but discovering something is real doesn't enhance it (it was always good). | **Pass** (Got worse) | **Pass** (Stayed good) | **Pass** (Got worse) | **Pass** (Stayed same) | **Pass** (Stayed different) | **Pass** (Stayed same) | **Maybe** (Contradicts Case 1's phrasing) |

  ### Analysis of the Rules

  *   **Rule 1 (Moral Contamination)** is eliminated by **Case 6**. If deception alone ruined the object, the counterfeit bag would be "worse quality." She explicitly rejects this, calling it "brand mythology."
  *   **Rule 4 (Directional Asymmetry)** is the strongest competitor to the winning theory. It suggests that "bad news" changes the object, but "good news" just reveals it. However, **Case 1** is the key: she didn't say "They were always bad, we were just fooled." She said they are "*worse paintings now*." This implies an ontological shift, not just a correction of error.
  *   **Rule 2 (Medium-Dependent Aura)** and **Rule 3 (Constitutive Narrative)** are very similar. Rule 2 describes *where* the rule applies; Rule 3 describes *why*. Rule 3 is the deeper algorithm. She treats the "story" of a painting as code that compiles the aesthetic experience. If you change the code (the provenance), the output (the painting) changes.

  ### The Prediction

  **Verdict:** She will say the painting **genuinely became a better painting** when she learned the truth.

  **Reasoning:**
  Based on **Case 1**, she believes that for static visual art, provenance is constitutive.
  *   In Case 1: `Status: Original` → `Status: Fake` = `Quality: High` → `Quality: Low`.
  *   In the New Case: `Status: Copy` → `Status: Original` = `Quality: Competent` → `Quality: Masterpiece`.

  If she believed the physical paint held the value (like the Bag in Case 6), she would say, "It was always a great painting, I just didn't know it." But because she subscribed to the "Vermeer Verdict" (that the discovery *changed what they are*), she must logically accept that this discovery changes what the inheritance is. The "family copy" narrative constrained the painting's aesthetic potential; the "lost original" narrative unlocks it. The paint didn't change, but the *work of art* did.

  ### The Tie-Breaker Case

  There is still a slight ambiguity between **Rule 3 (Constitutive Narrative)** and a subtle variation of **Rule 4 (Psychological Block)**. Does the object *actually* change, or does her *access* to the object change?

  To break this tie, present her with **The "Re-Forged Vermeer" Case**:

  > "Imagine we take one of the Van Meegeren fakes (Case 1). We burn all the records. We convince the entire world, including experts, that it is a genuine Vermeer again. No one knows it's a fake anymore.
  >
  > **Question:** Is it a *good painting* again? Or is it still a *bad painting* that everyone is mistaken about?"

  *   **If she says "It's a good painting again":** She is running **Rule 3 (Constitutive Narrative)**. The story *makes* the art. If the story is restored, the art is restored. This confirms she will say your friend's inheritance *became* better.
  *   **If she says "It's still a bad painting, the world is just wrong":** She is running a **Moral/Objective Hybrid**. The "sin" of the forgery permanently stained the object regardless of current knowledge. If this is true, she might say your friend's inheritance *was always* a masterpiece, and the "copy" story was just a period of blindness.

  **My bet:** She says it's a good painting again. Her algorithm is about the *current relationship between viewer and object*, not an eternal moral stain. Therefore, the inheritance painting has genuinely upgraded.
