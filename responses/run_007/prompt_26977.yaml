answer: |-
  The behavior you are describing is one of the most famous anecdotes in ethology and cognitive science. The wasp is typically a species of **digger wasp (genus *Sphex*)**, and the behavior is a classic example of a **Fixed Action Pattern (FAP)**.

  However, the specific philosophical concept you are reaching for—the idea of a system that *appears* to have agency or understanding but is actually running a rigid script—is most famously termed **"Sphexishness."**

  This term was coined by Douglas Hofstadter in *Gödel, Escher, Bach* (1979). He used the wasp story to illustrate the difference between genuine flexibility and mechanical routine.

  Here is a breakdown of the concepts, how they apply to software, and the philosophical boundary you asked about.

  ### 1. The Labels and What They Cover

  There are three layers of terminology here, ranging from biology to philosophy to engineering.

  **A. Biological: Fixed Action Pattern (FAP)**
  *   **What it is:** An instinctive behavioral sequence that is relatively invariant within the species and almost inevitably runs to completion. It is triggered by a specific "sign stimulus" (in the wasp's case, the presence of the cricket at the threshold).
  *   **What it covers:** It explains *why* the wasp can't adapt. The neural circuitry is hard-wired. The "check" isn't a cognitive inspection; it is a mandatory step in the motor program triggered by leaving the prey.
  *   **What it doesn't cover:** It doesn't easily apply to software or non-biological systems without metaphor.

  **B. Philosophical/Cognitive: Sphexishness**
  *   **What it is:** The property of a system that gives the *illusion* of purposeful, flexible behavior but collapses into repetition when faced with a perturbation outside its narrow scripting.
  *   **What it covers:** It is the perfect label for your software observation. It describes systems that pass the "Turing Test" for a while until you push a specific button that reveals the lack of an internal model.
  *   **What it doesn't cover:** It is a pejorative metaphor, not a rigorous engineering metric. You can't measure "degrees of Sphexishness" easily.

  **C. Engineering/Control Theory: Open-Loop Control (masquerading as Closed-Loop)**
  *   **What it is:** In control theory, a **closed-loop** system uses feedback to adjust its actions (e.g., a thermostat measures temperature *while* heating). An **open-loop** system executes a command regardless of the outcome (e.g., a toaster runs for 3 minutes regardless of whether the bread is burnt).
  *   **The Wasps' Glitch:** The wasp *appears* to be closed-loop (drag, check, drag). In reality, it is open-loop. The "check" step does not actually sample the state of the burrow to decide the next action; the act of entering the burrow simply triggers a timer or a state flag that says "now drag the cricket."
  *   **Software Equivalent:** This is often called **Brittleness**. The system works on the "Happy Path" (the assumed normal case) but enters a deadlock or infinite loop when an invariant is violated.

  ### 2. The Software Analogy

  You mentioned seeing this shape in software. In engineering, this is often the result of **State Machines without Error Recovery** or **Hard-Coded Invariants.**

  *   **The Script:** `If (cricket_at_door) { enter_burrow(); if (burrow_ok) { drag_cricket(); } }`
  *   **The Bug:** The condition `burrow_ok` is never actually re-evaluated against the *current* position of the cricket. It is evaluated against the *memory* of the cricket being at the door.
  *   **The Result:** When you move the cricket, you break the invariant. The system doesn't have a branch for `cricket_moved_during_check`. It defaults to the start of the loop.

  This is distinct from a system that is merely complex. A complex system can still be Sphexish if it lacks **feedback integration**.

  ### 3. Is There a Real Line? (The Philosophical Core)

  Your second question is the deeper one: *Does a system stop counting as rigid once its script has enough branches and triggers?*

  There is no consensus, but there are three main frameworks for drawing the line:

  **A. The Behaviorist View (No Line)**
  *   **Argument:** If the output is indistinguishable from flexibility, it *is* flexibility. If you add enough `if/else` statements to cover every possible perturbation (moving the cricket 1 inch, 2 inches, 100 inches; moving it left, right, up), the wasp *would* succeed.
  *   **Implication:** Intelligence is just a very large lookup table.
  *   **Counter-argument:** This fails the **Generalization Test**. A script handles known perturbations. Intelligence handles *unknown* perturbations. You cannot script every possible state of the universe (The Frame Problem).

  **B. The Cognitive/Representational View (Yes, There is a Line)**
  *   **Argument:** The line is drawn at **Internal Modeling**.
  *   **Sphexish System:** Reacts to stimuli directly (Stimulus → Response).
  *   **Flexible System:** Creates an internal representation of the world (Stimulus → Model → Plan → Response).
  *   **Why it matters:** If the wasp had a model, it would realize, "I remember leaving the cricket here, but my sensors now say it is there. Therefore, the world changed." The Sphex wasp has no "therefore." It just has "If cricket at door, then enter."
  *   **In Software:** This is the difference between a script and an AI agent with a world model. The script checks variables; the agent understands *relationships* between variables.

  **C. The Control Theory View (The Feedback Depth)**
  *   **Argument:** The line is defined by the **latency and depth of the feedback loop**.
  *   **Sphexish:** The feedback is superficial. The "check" is a ritual, not a measurement.
  *   **Flexible:** The feedback actually modulates the motor output continuously.
  *   **In Software:** This is the difference between **Retry Logic** (Sphexish: "It failed, try the exact same thing again") and **Adaptive Control** (Flexible: "It failed, analyze why, change parameters, try again").

  ### 4. Summary: How to Use the Concept

  If you want to use this concept to describe software or systems behavior, **"Sphexishness"** is the most evocative term, while **"Brittleness due to Open-Loop Logic"** is the most precise engineering description.

  **It covers:**
  *   Systems that rely on environmental invariants without verifying them.
  *   Behaviors that look teleological (purpose-driven) but are actually stimulus-bound.
  *   Infinite loops triggered by edge cases that the system interprets as "start over."

  **It does not cover:**
  *   Systems that fail due to resource exhaustion (running out of memory is not Sphexishness).
  *   Systems that make a mistake once and stop (Sphexishness implies the *repetition* of the futile act).
  *   Genuine learning systems that update their weights/scripts based on the failure.

  **The Verdict on the "Line":**
  The line is real, but it is not about the *size* of the script. It is about the **architecture of the feedback.**
  *   If the system adds branches to handle specific exceptions (`if cricket_moved_1_inch`), it is still Sphexish. It is just a bigger script.
  *   If the system adds a mechanism to *detect novelty* and *generate a new plan* (`if cricket_position != expected_position { search(); }`), it has crossed the line into flexibility.

  The wasp fails because it cannot distinguish between "The burrow is safe" and "I have completed the ritual of checking the burrow." In software, this is the difference between **checking a status code** and **validating the system state.**
