answer: |-
  The map

  Your position is a hybrid theory that selectively adopts verdicts from Evidential Decision Theory (EDT), Causal Decision Theory (CDT), and Functional Decision Theory (FDT). In Newcomb's problem, you one-box using EDT reasoning, treating your choice as evidence of the predictor's past action. In XOR blackmail, you pay using FDT-style reasoning, selecting a policy that optimizes across predictions. However, in Counterfactual Mugging, you refuse to pay using CDT reasoning, treating the coin flip as a fixed causal past that your current action cannot influence.

  To bind these verdicts together, you rely on two meta-principles: unity and evidential leverage. You claim decision theory should be timeless (4), yet you justify your Mugging refusal by updating on the coin result (2). You attempt to resolve this by asserting a principled distinction (5): that Mugging offers no evidential leverage once the coin lands, whereas Newcomb and XOR do. This creates a framework where you are updateless when it helps you (XOR), updateful when it saves you money (Mugging), and evidential when it makes you rich (Newcomb).

  Tensions that aren't

  You worry that your verdicts on Newcomb (1) and XOR blackmail (3) are inconsistent because they seem to rely on different logics. However, this tension dissolves if you recognize that both verdicts are actually compatible with Functional Decision Theory. FDT one-boxes in Newcomb's problem not because of evidence, but because your decision procedure logically correlates with the predictor's simulation. Similarly, FDT pays in XOR blackmail because your policy determines the blackmailer's prediction. The conflict is only in your stated justification for (1), not in the verdicts themselves; you can hold both positions consistently if you shift your Newcomb reasoning from EDT to FDT.

  You also suspect that the structural difference between a coin flip (Mugging) and a predictor (Newcomb/XOR) might save your view from inconsistency. While intuitively compelling, this distinction does not create a tension between (1) and (3); rather, it highlights why (2) is the outlier. Both Newcomb and XOR involve a logical correlation between your algorithm and an external fact (the box content or the blackmail letter). The coin flip in Mugging is irrelevant to the decision theoretic structure because Omega's payout depends on your counterfactual behavior, not the coin itself. Thus, treating Newcomb and XOR similarly is theoretically sound, provided you treat Mugging the same way.

  Genuine tensions, ranked by severity

  The most severe conflict is between your unity principle (4) and your Mugging verdict (2). You claim the right answer shouldn't depend on when you deliberate, which is the core definition of updatelessness. However, your refusal to pay in Mugging is explicitly based on updating on the coin toss ("once I know the coin is tails"). If you were truly updateless, you would decide whether to pay before knowing the coin result, which forces you to pay to secure the counterfactual heads payout. You cannot claim decision theory is timeless while simultaneously refusing to honor pre-commitments because you have learned new information.

  The second severity is the contradiction between your Newcomb reasoning (1) and your Mugging verdict (2). You justify one-boxing by saying your choice is evidence about which world you are in. In Counterfactual Mugging, your choice is also evidence about which world you are in—specifically, whether you are the type of agent who pays. If you pay, you are the type who would have paid in the heads world, meaning Omega would have given you the $10,000. By refusing to pay, you confirm you are the type who doesn't pay, proving you never would have gotten the money anyway. Your evidential reasoning in (1) logically compels you to pay in (2), making your current position internally incoherent.

  The third tension lies between your XOR verdict (3) and your Mugging verdict (2). In XOR blackmail, you pay because you want to be the "type of agent" who pays, ensuring the blackmailer doesn't send the letter. This is policy-based reasoning. In Mugging, you refuse because you focus on the specific act in the actual world. These are incompatible modes of deliberation. If you are the type of agent who pays in XOR to manipulate a prediction, you are necessarily the type of agent who pays in Mugging to manipulate Omega's counterfactual generosity. You cannot be a policy-selector in one case and an act-maximizer in the other without arbitrary discrimination.

  Finally, your distinction claim (5) is factually incorrect regarding evidential leverage. You assert that in Mugging, your action gives no evidence about anything you care about. This is false under the evidential framework you endorse for Newcomb. Your action gives evidence about your own decision algorithm, which determines the counterfactual payout. By claiming there is no evidential link in Mugging but there is one in Newcomb, you are mischaracterizing the structure of the Mugging problem to fit your desired verdict. The evidence exists; you are simply choosing to ignore it in this specific instance to avoid the cost.

  What each fix costs

  To resolve these tensions by aligning with your Newcomb and XOR views, you must adopt Functional Decision Theory and pay in Counterfactual Mugging. The cost here is intuitive: you must accept paying $100 for a payout that is causally impossible to receive. You lose the comfort of "causal sanity," where you only pay for effects you can physically cause. However, you gain a unified, updateless theory that makes you richer in Newcomb, XOR, and Mugging scenarios, preserving your commitment to unity (4) and correcting your evidential analysis (5).

  Alternatively, you could align with your Mugging view by adopting Causal Decision Theory across the board. This would require you to two-box in Newcomb's problem and refuse payment in XOR blackmail. The cost here is monetary and strategic: you leave money on the table in Newcomb and suffer blackmail in XOR. You gain the comfort of knowing your actions only affect the causal future, but you violate your unity principle (4) less than your current view (since CDT is consistently updateful), though you still fail to maximize utility in prediction-heavy environments.

  Bottom line

  The single revision that cleans up the most mess is to change your verdict on Counterfactual Mugging to "Pay." This aligns your Mugging view with your Newcomb and XOR verdicts under the umbrella of Functional Decision Theory, resolves the contradiction between your unity principle and your updating behavior, and corrects your false claim about evidential leverage. The resulting package is still recognizably yours—it keeps your preferred outcomes in the high-stakes prediction problems—but it requires you to accept that rational agents sometimes pay for counterfactuals to maintain the integrity of their decision algorithm.
