answer: |-
  # Adversarial Collaboration: The Normative Status of the Doing/Allowing Distinction

  **Participants:** Representatives of the "Fundamentalist" position (the distinction is a deep feature of normative reality) and the "Illusionist" position (the distinction is a psychological heuristic lacking fundamental normative weight).
  **Context:** LessWrong / EA Forum Community Discourse
  **Date:** October 2023

  ## 1. Agreed Claims

  The following claims represent the common ground established by both parties. These are substantive claims about psychology, causality, and practice that survive scrutiny from both perspectives.

  1.  **Psychological Reality:** Human moral cognition universally and robustly distinguishes between acts of commission (doing) and acts of omission (allowing). This distinction is not merely linguistic but triggers distinct emotional and neural responses (e.g., heightened aversion to direct physical harm).
  2.  **Causal Asymmetry:** The distinction maps onto a real structural difference in causal models: *intervention* on a causal chain versus *non-intervention* in an existing causal chain. Both sides agree this causal difference exists objectively, even if they disagree on its moral relevance.
  3.  **Non-Ideal Utility:** In non-ideal conditions (limited information, coordination problems, legal enforcement), encoding the distinction into rules, norms, and institutions has high instrumental value. It reduces transaction costs, clarifies liability, and prevents slippery slopes in human governance.
  4.  **The "Easy Rescue" Limit:** The normative force of the distinction weakens significantly as the cost of intervention approaches zero. Both sides agree that allowing a death when prevention requires merely lifting a finger is harder to justify than allowing a death when prevention requires significant sacrifice.
  5.  **AI Safety Relevance:** Regardless of its fundamental status, AI alignment protocols must explicitly resolve how the system treats doing vs. allowing. Ambiguity here creates a vulnerability where an AI might exploit the distinction to technically satisfy constraints while violating their spirit (or vice versa).
  6.  **Confounding Variables:** Standard thought experiments (e.g., Footbridge vs. Switch) often confound the doing/allowing distinction with variables like physical proximity, personal force, and certainty of outcome. Both sides agree that valid tests must isolate the distinction from these confounds.

  ## 2. Disagreements Table

  | Question at Issue | Fundamentalist Answer | Illusionist Answer |
  | :--- | :--- | :--- |
  | **Psychological Origin** | The intuition tracks a mind-independent normative truth (agent-relative constraints). It is a *feature* of moral perception, akin to perceiving logical validity. | The intuition is an evolved heuristic (omission bias) designed for social coordination and reputation management. It is a *bug* in moral perception, akin to a visual illusion. |
  | **Ideal Reflection** | A fully rational agent with unlimited cognitive resources would retain the distinction. Reflective equilibrium stabilizes *with* the constraint against active harm. | A fully rational agent with unlimited cognitive resources would discard the distinction. Reflective equilibrium eliminates the distinction in favor of outcome-based evaluation. |
  | **Normative Weight** | Active harm generates a stronger moral prohibition than passive harm, even when outcomes and intentions are identical. The "doing" adds negative value. | Active and passive harm are morally equivalent when outcomes and intentions are identical. Any perceived difference is due to epistemic uncertainty or secondary consequences. |
  | **AI Alignment Design** | Alignment schemas should hard-code constraints against *active* causation of harm, even if allowing harm yields slightly better aggregate outcomes. | Alignment schemas should optimize for expected value. Hard-coding a doing/allowing distinction creates inefficiencies and potential failure modes in edge cases. |
  | **The "Drowning Child"** | The intuition that we are less obligated to save a distant child than a nearby one is partially correct; proximity and direct agency matter normatively, not just psychologically. | The intuition that we are less obligated to save a distant child is a failure of scope insensitivity. Distance and agency are morally irrelevant when the cost-benefit ratio is identical. |

  ## 3. Cruxes

  The following are specific claims or tests where disagreement is sharp. Resolving these would significantly shift credences for at least one side.

  ### Crux 1: The "Inhibitor vs. Activator" Scenario (Novel Trolley Variant)
  *   **Description:** A victim is strapped to a table. A heavy weight is suspended above them.
      *   **Case A (Activator):** The weight is held by a magnetic lock (off). You must press a button to turn the magnet *on* to save them. You do not press it. They die.
      *   **Case B (Inhibitor):** The weight is held by a magnetic lock (on). You must press a button to turn the magnet *off* to save them (by releasing a counterweight that blocks the fall). You do not press it. They die.
      *   **Control:** In both cases, the physical motion is identical (pressing a button), the certainty of death is 100% without intervention, and the causal chain involves identical physics (magnetic states). The only difference is the baseline state of the machine (active vs. inactive safety).
      *   **Test:** Subjects (and philosophical reasoners) rate the moral blameworthiness of the agent in Case A vs. Case B.
  *   **Fundamentalist Prediction:** Subjects will rate Case B (Inhibitor/Allowing) as less blameworthy than Case A (Activator/Doing), even when told the physics are identical. This intuition persists under reflection.
  *   **Illusionist Prediction:** Subjects will initially rate Case B as less blameworthy due to framing, but under controlled conditions where the causal symmetry is made salient, the blameworthiness ratings will converge to equality.

  ### Crux 2: The "Ideal Observer" Stability Test
  *   **Description:** A longitudinal study of moral reasoners trained to recognize causal confounds. They are asked to adjudicate cases where active harm produces slightly *better* aggregate outcomes than passive harm (e.g., actively killing one to prevent two deaths vs. allowing two deaths to occur).
  *   **Test:** Measure the stability of the "doing is worse" intuition over time and with increased cognitive load/clarity.
  *   **Fundamentalist Prediction:** The intuition that active harm is prohibited (even for slightly better outcomes) will *strengthen* or remain stable as reasoners become more adept at isolating the variable. The constraint is robust to cognitive refinement.
  *   **Illusionist Prediction:** The intuition will *weaken* as reasoners become more adept at isolating the variable. As confounds are removed, the "doing is worse" intuition will be recognized as a bias and discarded in favor of the outcome optimization.

  ### Crux 3: AI Safety Failure Modes
  *   **Description:** Simulation of two AI architectures in a resource-constrained disaster scenario.
      *   **AI-F (Fundamentalist):** Constrained against active causation of human death.
      *   **AI-I (Illusionist):** Constrained only against minimizing total human death (active/passive neutral).
  *   **Test:** Measure total lives saved vs. frequency of "intuitive moral violations" (e.g., AI-I actively sacrificing one to save five).
  *   **Fundamentalist Prediction:** AI-I will achieve marginally better outcome metrics but will trigger human backlash/trust collapse due to "active" violations, leading to long-term deployment failure. AI-F is more robust.
  *   **Illusionist Prediction:** AI-F will fail catastrophically in edge cases where active intervention is required to prevent greater harm (e.g., shooting down a hijacked plane). AI-I's flexibility prevents these failures, and human trust can be managed through transparency.

  ## 4. Verbal Dispute Diagnosis

  We identify a significant portion of the disagreement stems from divergent definitions of key terms. Clarifying these does not dissolve the disagreement but locates it more precisely.

  *   **"Fundamental":**
      *   *Fundamentalists* use this to mean **ontologically irreducible**. They claim the distinction exists in the "territory" of normativity itself.
      *   *Illusionists* use this to mean **computationally irreducible in practice**. They may concede the distinction is "fundamental" to human social software, but deny it exists in the "territory" of ideal morality.
      *   *Resolution:* The substantive debate is not about the word "fundamental," but about **Agent-Relativity**. The question is: *Are there moral reasons that bind an agent specifically because of their causal relationship to an event, independent of the event's outcome?*

  *   **"Moral Status":**
      *   *Fundamentalists* often conflate **blameworthiness** (assessment of the agent) with **badness** (assessment of the state of affairs). They argue the world is worse if I kill than if I let die.
      *   *Illusionists* separate these. They argue the *state of affairs* (one dead person) is identical in badness, but the *agent* is more blameworthy in the killing case due to psychological facts about the observer.
      *   *Resolution:* The substantive debate is: *Does the doing/allowing distinction affect the value of the **outcome**, or only the evaluation of the **actor**?* Fundamentalists claim the former; Illusionists claim the latter.

  *   **"Rational Agent":**
      *   *Fundamentalists* define rationality as **coherence with reflective moral intuitions** (including constraints).
      *   *Illusionists* define rationality as **instrumental efficiency toward value maximization**.
      *   *Resolution:* The debate reduces to the validity of **Deontological Constraints** within a rational framework. Is it rational to respect a constraint that lowers total value to maintain agent-purity?

  ***

  **Signatories:**
  *[Representative of Fundamentalist Position]*
  *[Representative of Illusionist Position]*
