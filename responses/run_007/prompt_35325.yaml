  My mum and I got into it last night about the assisted dying bill. She kept saying 'there's a moral difference between killing and letting die' as if that just ends the discussion — that a doctor who administers a lethal injection is a killer, but a doctor who withdraws life support is just 'letting nature take its course'. I'm not convinced the distinction does the work she thinks it does, but I couldn't articulate why in the moment. Can you lay out the different precise claims that slogan might be making, from the obviously true to the controversial, and tell me which ones would actually support her position and which wouldn't? I want a menu of readings I can think through properly. At the very end, give me a one-sentence summary as the last line, starting 'Bottom line:'.
