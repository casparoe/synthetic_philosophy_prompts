answer: |-
  You have stumbled directly into one of the most persistent and debated problems in formal epistemology and statistics. You are absolutely right that the machinery gets "wobbly" here. Standard Bayesian conditionalization is designed for learning that a proposition is *true* (probability 1). It is not uniquely defined for learning that a *probability relation* holds.

  Here is the breakdown of the name, the competing solutions, and the state of the debate.

  ### 1. What is this called?

  The specific puzzle you described (updating on a conditional probability statement) is canonically known as **The Judy Benjamin Problem**.

  It was introduced by the philosopher Bas van Fraassen in 1981. The broader field of study regarding how to update probabilities when you don't learn a certainty is called **Probability Kinematics** or **Generalized Conditionalization**.

  When the constraints are more general (inequalities, correlations, expected values), the problem is often discussed under the heading of **Constraint-Based Bayesian Updating** or **The Principle of Minimum Relative Entropy**.

  ### 2. The Core Conflict: Two Updating Rules

  You mentioned that you can write down two different updating rules that both seem reasonable. In the literature, these correspond to the two main rivals: **Jeffrey Conditionalization** and **Minimum Relative Entropy (MinEnt)**.

  #### A. Jeffrey Conditionalization (Preserving Odds)
  Proposed by Richard Jeffrey (1983). This rule is designed for when you learn the new probabilities of a *partition* of possibilities (e.g., you learn $P(\text{Paris}) = 0.8$, $P(\text{Not Paris}) = 0.2$).
  *   **The Rule:** Update the probabilities of the partition elements directly, but **preserve the prior odds ratios** of all other propositions conditional on those elements.
  *   **The Intuition:** "Shift the weight where the evidence tells you, but don't mess with the relative relationships of things the evidence didn't mention."
  *   **In your example:** If you treat "Paris" vs. "London/Berlin" as the partition, Jeffrey conditionalization says: Set $P(\text{Paris}) = 0.8$. Then, distribute the remaining 0.2 between London and Berlin such that their *ratio* remains the same as it was in the prior. Since your prior was 1/3 vs 1/3 (ratio 1:1), they remain equal (0.1 each).
  *   **The Problem:** Jeffrey's rule breaks down when the evidence is a *conditional* probability (like Judy Benjamin) rather than a direct probability on a partition. It doesn't tell you uniquely how to shift the mass of the "unmentioned" worlds when the constraint links them to the "mentioned" worlds.

  #### B. Minimum Relative Entropy (MinEnt) / Maximum Entropy
  Proposed by Shore and Johnson (1980) and others. This comes from information theory.
  *   **The Rule:** Choose the new probability distribution that satisfies the new constraint but **minimizes the Kullback-Leibler (KL) divergence** from the prior distribution.
  *   **The Intuition:** "Make the smallest possible change to your beliefs (in terms of information gain) necessary to accommodate the new news." It is the most conservative update possible.
  *   **In your example:** MinEnt asks: "What distribution where $P(\text{Paris})=0.8$ is closest to the uniform distribution?" The answer is also $P(\text{London})=0.1, P(\text{Berlin})=0.1$.
  *   **The Divergence:** In your specific symmetric example, Jeffrey and MinEnt agree. **However**, they disagree violently in asymmetric cases or when the constraint is conditional (e.g., "If I am in Paris or London, the chance of Paris is 80%").
      *   **Jeffrey** tends to preserve prior odds of the "unconstrained" options against the "constrained" set.
      *   **MinEnt** tends to shift the odds of the "unconstrained" options to maintain independence where possible.

  ### 3. The Judy Benjamin Problem (Where they fight)

  To see why you felt the "wobbly machinery," consider the classic Judy Benjamin case, which is a slight tweak of your city example:

  *   **Prior:** You are in Sector 1, 2, or 3 (1/3 each).
  *   **Evidence:** "If you are in Sector 1 or 2, the probability you are in Sector 1 is 3/4."
  *   **Question:** What is your new probability for Sector 3?

  **The Conflict:**
  1.  **Jeffrey-style intuition:** The news was only about Sectors 1 and 2. It said nothing about Sector 3. Therefore, the probability of Sector 3 should remain unchanged (1/3). The remaining 2/3 mass is split between 1 and 2 according to the 3:1 ratio.
  2.  **MinEnt intuition:** Learning a relation between 1 and 2 gives you information about the *total space*. To minimize information gain (KL divergence), you must adjust Sector 3 as well. MinEnt typically yields a new probability for Sector 3 that is *higher* than 1/3 (roughly 0.4 in some formulations).

  **Why?** The MinEnt camp argues that if you keep Sector 3 fixed at 1/3, you are implicitly assuming a specific dependency structure between Sector 3 and the {1,2} pair that wasn't justified. The Jeffrey camp argues that changing Sector 3 violates the idea that you only learned about {1,2}.

  ### 4. Who Wins? (The State of the Debate)

  There is no universal consensus, but there is a strong divergence between disciplines:

  *   **Statistics, Physics, and Engineering:** **MinEnt (Maximum Entropy) is the winner.** It is axiomatized by Shore and Johnson (1980), who showed that if you want an updating rule that is consistent (order of processing constraints doesn't matter) and coordinate invariant, MinEnt is the unique solution. It is the standard tool for inverse problems and machine learning.
  *   **Philosophy:** **It is still debated.** Bas van Fraassen (who posed the problem) actually argued *against* MinEnt. He proposed that there is no single rational rule for this kind of update; it depends on *why* you learned the constraint (the context of the information). If you learned the conditional probability from a reliable frequency report, MinEnt might be right. If you learned it from a logical deduction, maybe not.
  *   **Computer Science (AI):** **Pearl's Virtual Evidence.** Judea Pearl developed a method for updating on likelihood ratios (which can encode conditional constraints) within Bayesian Networks. This is practically very popular but mathematically aligns more closely with MinEnt in the limit.

  ### 5. Why your specific example felt ambiguous

  In your Paris/London/Berlin example, you noted: *"It says nothing, directly, about how my London and Berlin credences should relate to each other afterwards. Should they stay equal?"*

  Mathematically, if your prior is symmetric ($L=B$) and the constraint is symmetric with respect to $L$ and $B$ (the constraint only mentions Paris), **symmetry dictates they must stay equal.** Any rule that made $L \neq B$ would be introducing a distinction without a difference, which violates the Principle of Indifference.

  The "wobble" you feel is likely because you are intuitively sensing that **conditional constraints change the geometry of the probability space.**
  *   Standard Bayesian updating is a projection onto the subspace where $E$ is true.
  *   Updating on $P(A|B) = x$ is a projection onto a manifold defined by that equation.
  *   There are many ways to project a point onto a manifold.
      *   Project along the "odds" lines? (Jeffrey)
      *   Project along the "perpendicular" (information geometric) line? (MinEnt)

  ### 6. Key References for Further Reading

  If you want to dive into the literature, these are the seminal papers:

  1.  **Van Fraassen, B. (1981).** "A Problem for Relative Information Minimizers." *British Journal for the Philosophy of Science*. (This defines the Judy Benjamin problem).
  2.  **Jeffrey, R. (1983).** *The Logic of Decision*. (The bible of Probability Kinematics).
  3.  **Shore, J. E., & Johnson, R. W. (1980).** "Axiomatic derivation of the principle of maximum entropy and the principle of minimum cross-entropy." *IEEE Transactions on Information Theory*. (The argument for MinEnt).
  4.  **Williams, P. M. (1980).** "Bayesian Conditionalisation and the Principle of Minimum Information." *British Journal for the Philosophy of Science*.
  5.  **Grove, A., & Halpern, J. Y. (1998).** "Updating probabilities." *Journal of Artificial Intelligence Research*. (A good computer science perspective).

  ### Summary

  *   **Name:** The Judy Benjamin Problem (subset of Probability Kinematics).
  *   **The Rivals:** Jeffrey Conditionalization (preserve odds) vs. Minimum Relative Entropy (minimize information distance).
  *   **The Verdict:** MinEnt is the standard in science/engineering because it is mathematically consistent for general constraints. Philosophy remains split on whether "rationality" dictates a unique rule for conditional constraints.
  *   **Advice:** If you need a working rule for applications, use **Minimum Relative Entropy**. It handles inequalities, correlations, and conditional probabilities robustly. If you are doing philosophy, acknowledge that the "correct" answer may depend on the *causal process* by which you received the constraint.
