answer: |-
  You have put your finger on one of the most persistent, unacknowledged fault lines in cognitive science. This is not merely language policing; it is the **Demarcation Problem** for mental content.

  Neuroscientists and ethologists are operating with an implicit theory that is distinct from both pure causal-informational accounts and strict philosophical teleosemantics. It is best reconstructed as **Bio-Computational Functionalism**.

  Here is the reconstruction of the theory presupposed by that practice, an analysis of its consistency regarding your "lab task" objection, and what would happen if the theory collapsed.

  ### 1. The Implicit Theory: Bio-Computational Functionalism

  If you reconstruct the theory from the practice (ignoring what they say in philosophy sections and looking at what they do in discussion sections), three criteria must be met for a state to count as a "representation" rather than mere "information":

  1.  **Organismic Boundary:** The state must exist within a system that maintains its own boundaries (homeostasis/autopoiesis). This excludes tree rings and thermostats immediately. The system must be an *agent*, not an object.
  2.  **Decoupling/Mediation:** The state must stand between input and output in a way that allows for variable processing. A thermostat has a fixed input-output mapping (temp $\rightarrow$ switch). A place cell allows the rat to use that location data for sleeping, fleeing, eating, or planning. The state is *consumed* by other parts of the system for various ends.
  3.  **Functional Role:** The state is treated as a variable in a control equation. The scientist assumes the downstream neurons "read" the upstream neurons.

  **Why this excludes the thermostat:**
  Under this implicit view, the thermostat's bimetallic strip *carries information* about temperature, but it does not *represent* it because the system does not *interpret* it. The strip *is* the mechanism. In the brain, the firing pattern is distinct from the mechanism that reads it. The practice presupposes a **sender/receiver architecture** within the organism.

  **Why this includes the waggle dance:**
  Even though the dance is external, it is treated as part of the extended cognitive system of the hive. It satisfies the sender/receiver architecture (dancer $\rightarrow$ observer) and serves a homeostatic goal (food acquisition).

  ### 2. Teleosemantics vs. Causal-Informational

  You asked if the practice needs teleosemantics. The answer is: **It needs "Soft" Teleosemantics.**

  *   **Pure Causal-Informational (e.g., Dretske):** This fails the thermostat test. If representation is just reliable covariation, the thermostat represents temperature. Neuroscientists reject this. They need a normative element (the state can *misrepresent*). A place cell can fire in the wrong place (noise/error); a thermostat strip cannot "error," it just reacts.
  *   **Strict Teleosemantics (e.g., Millikan):** This requires the specific content to be fixed by evolutionary selection history. This runs into your "lab task" problem. A rat in a novel linear track has place cells mapping that specific track. The rat was not selected to navigate *that* specific lab track.

  **How the field resolves this (The "Mechanism" Loophole):**
  When neuroscientists attribute content to lab-trained neurons, they are implicitly relying on the **selected function of the plasticity mechanism**, not the specific content.
  *   *Theory:* The hippocampus was selected to form spatial maps (function).
  *   *Practice:* Therefore, whatever specific map it forms in the lab inherits that representational status.
  *   *Result:* They get to keep teleosemantics for the *capacity* while allowing causal covariation to fix the *specific content*.

  So, the practice is underdetermined. It uses teleosemantics to draw the boundary around the *organism* (vs. the thermostat) and causal-informational theory to fill in the specific *contents* (vs. strict evolutionary history).

  ### 3. Is the Practice Internally Consistent?

  You identified a potential contradiction: **The Lab Task Objection.**
  *   *Premise A:* Representation requires evolutionary function (to exclude thermostats).
  *   *Premise B:* Lab neurons represent task variables (standard practice).
  *   *Premise C:* Lab tasks have no evolutionary function.

  **The Consistency Defense:**
  The field remains consistent by shifting the locus of "function." They do not claim the *specific tuning* of the neuron was evolved. They claim the **computational architecture** was evolved.
  *   If a thermostat were reprogrammed via neural nets to navigate a maze, neuroscientists would likely *still* hesitate to call its states "representations" because it lacks the biological history of homeostasis.
  *   If a rat's visual cortex is trained to respond to auditory stimuli (ferret studies), scientists call it "representing sound" because the *tissue* has the biological function of sensory processing, even if the modality is swapped.

  **The Inconsistency Risk:**
  The inconsistency arises when they study **novel cognitive niches**. If a crow bends a wire to make a hook to get food, does the neural state representing the "hook shape" have content?
  *   If they say **yes**, they are leaning toward a causal/computational view (the system uses it as a variable).
  *   If they say **no** (or waffle), they are leaning toward strict teleosemantics.
  *   *Current Practice:* They say **yes**. This suggests that in day-to-day work, **Computational Functionalism** is actually doing the heavy lifting, and Teleosemantics is just a rhetorical shield used to keep philosophers and thermostats out of the room.

  ### 4. What if the Presupposed Theory is False?

  This is the most revealing question. If the "Bio-Computational Functionalist" view is wrong (e.g., if Radical Enactivism or Predictive Processing critics are right, and there are no internal representations), how would the talk change?

  Currently, the language is **Realist**:
  > "The population vector **encodes** reach direction."
  > "The waggle dance **communicates** distance."
  > "The alarm call **means** leopard."

  If the theory collapsed (i.e., if we decided these are just dynamic couplings without semantic content), the language would shift to **Relational/Dispositional**:

  1.  **Loss of "Aboutness":**
      *   *Current:* "The cell represents the location."
      *   *New:* "The cell's firing is **tuned to** the location." / "The cell **covaries with** the location."
  2.  **Loss of "Error":**
      *   *Current:* "The rat misremembered the platform location."
      *   *New:* "The rat's search distribution **diverged from** the platform location." (You cannot misremember if you don't have a memory representation; you just behave differently).
  3.  **Loss of "Reading/Decoding":**
      *   *Current:* "Downstream neurons read the population code."
      *   *New:* "Downstream neurons are **driven by** the population activity."

  **Concrete Example:**
  Imagine a paper on the waggle dance.
  *   *Representational View:* "The dancer transmits a proposition about nectar location to the observer."
  *   *Non-Representational View:* "The dancer's movement modulates the observer's flight vector parameters."

  The latter is clunkier, which is why the field resists it. But notice what is lost: the ability to explain **misrepresentation**. If the dance is wrong (no nectar there), the representationalist says "False Content." The non-representationalist must say "Maladaptive Coupling." The fact that neuroscientists want to talk about *error* (noise, false positives, illusions) suggests they are committed to a representational theory, because only representations can be false. Thermostats can't be false; they just are.

  ### Summary

  The practice presupposes a hybrid theory: **Teleo-Functional Computationalism.**
  1.  **Teleo:** To exclude thermostats (requires an agent with goals/history).
  2.  **Computational:** To allow lab tasks (requires internal variables used for control).

  It is internally consistent *only if* you accept that the evolutionary history of the *mechanism* confers representational status on the *learned content*.

  If this theory turned out to be false (e.g., if cognition is direct perception-action coupling without internal models), the field would have to stop talking about "codes," "maps," and "meaning," and start talking exclusively about "sensitivities," "couplings," and "behavioral affordances." The resistance to making this shift indicates how deeply the representational hypothesis is embedded in the methodology, not just the rhetoric.
