prompt: |-
  Something I keep tripping over when I read neuroscience and animal-cognition papers, and I can't tell if it's a real question or just language policing. The authors will say, flatly, that a population of place cells represents the rat's location, that a honeybee waggle dance says where the nectar is, that a vervet alarm call means leopard — no scare quotes. But the same authors will bend over backwards to avoid saying a thermostat represents the room temperature or that tree rings represent a past drought; that's 'just information' or metaphor. So the field seems to draw a line between an organism's states and ordinary physical covariation, and treat only the first as literally contentful.

  I've seen 'teleosemantics' thrown around in blog comments, but I don't trust my handle on it, so I want the implicit theory reconstructed from the practice rather than the label. What theory of mental content does that practice presuppose? Does it need teleosemantics (content fixed by evolved function), or would a causal-informational account also license the line, or is the practice underdetermined by several theories? And is the practice internally consistent: they'll attribute content to a neural ensemble trained on an arbitrary lab task, which has no evolutionary function — that looks like it breaks the teleosemantics reading, but if they fall back to 'it carries information' then the thermostat gets back in. What would have to change in how the field talks if the presuppossed theory turned out false?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Observation:** Neuroscience/animal cognition authors attribute "representation" or "meaning" to biological states (place cells, waggle dance, alarm calls) without scare quotes. They *deny* this status to non-biological covarying states (thermostats, tree rings), calling those mere "information" or metaphor.
      *   **Question 1:** What theory of mental content does this practice presuppose? (Reconstruct from practice, not just labels).
      *   **Question 2:** Does it need teleosemantics (evolved function), or would causal-informational accounts work? Is the practice underdetermined?
      *   **Question 3:** Is the practice internally consistent? (Specifically: neural ensembles trained on arbitrary lab tasks lack evolutionary history, yet get content attributions. If they fall back to "information," thermostats return. If they stick to "function," lab tasks break it).
      *   **Question 4:** What would change in the field's talk if the presupposed theory turned out false?

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *The Phenomenon:* The user has identified the "Mark of the Cognitive" or the "Boundary Problem" in representational theories. It's the distinction between *mere correlation* and *genuine representation*.
      *   *Candidate Theories:*
          *   **Causal/Informational (Dretske, Fodor):** $X$ represents $Y$ if $X$ covaries with $Y$ under certain conditions. Problem: Thermostats covary with temperature. Why are they excluded? Usually, informational theories add a "function" clause or an "organism" clause.
          *   **Teleosemantics (Millikan, Papineau):** $X$ represents $Y$ if $X$ has the *function* of indicating $Y$, derived from evolutionary history (selection). Problem: Lab-trained neurons (neuroplasticity) don't have evolutionary history for the specific task.
          *   **Computational/Functional Role:** $X$ represents $Y$ if $X$ plays a specific role in the system's control architecture.
          *   **Pragmatic/Instrumentalist:** Scientists talk this way because it's useful, not because it's metaphysically deep.
      *   *The Tension:* The user spots a crack: Lab-trained neurons vs. Evolutionary history. If content requires evolution, lab neurons shouldn't have it. If content requires only covariation/function within the system, thermostats might qualify.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's observation. It's a real philosophical tension, not just language policing. It's the "Naturalization of Content" problem.
      *   **Reconstructing the Implicit Theory:**
          *   It's not *just* causal/informational (too broad).
          *   It's not *strict* Teleosemantics (too narrow for lab tasks).
          *   It looks like a hybrid: **Bio-functional Computationalism**. The system must be an *agent* (homeostatic, goal-directed), and the state must play a *control role* within that agent.
          *   Key distinction: *Derived* vs. *Original* Intentionality (Dennett/Searle), though neuroscientists rarely use these terms. They treat the brain as an "interpreter" that *uses* the information, whereas the thermostat is passive.
      *   **Addressing Teleosemantics vs. Causal:**
          *   Pure Causal: Fails (thermostat problem).
          *   Pure Teleo: Fails (lab task problem).
          *   The Practice: Uses a "Soft Teleosemantics." The *capacity* to represent is evolved, even if the specific content (lab task) is learned. The *mechanism* has a function, even if the specific mapping is new.
      *   **Internal Consistency (The Lab Task Problem):**
          *   This is the crux. How do they justify place cells in a novel maze?
          *   *Solution:* They appeal to the *mechanism's* proper function (spatial navigation) even if the specific map is new.
          *   *Alternative:* They switch to "information-bearing structure" (Gallistel) which is more computational.
          *   *Inconsistency:* Yes, there is a wobble. Sometimes they mean "evolved signal," sometimes "task-relevant variable."
      *   **What if the Theory is False? (The Counterfactual):**
          *   If representationalism is wrong (e.g., Radical Enactivism/Embodied Cognition - Hutto & Myin), how would talk change?
          *   No more "encoding," "representing," "map."
          *   Instead: "Covaries with," "modulates," "is sensitive to."
          *   Example: "Place cells fire when the rat is here" instead of "Place cells represent location."
      *   **Synthesis/Conclusion:** The practice is a pragmatic mix. It assumes the brain is a *controller* using internal states to guide action, distinguishing it from passive physical indicators. It's underdetermined but stable enough for work.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say neuroscientists *are* philosophers. They are pragmatists. Their "theory" is often implicit.
      *   *Nuance on Teleosemantics:* It's not just "evolutionary history." It's "selected effect." A lab-trained neuron uses a plasticity mechanism that *was* selected. So teleosemantics can survive the lab task objection if framed correctly (selected mechanism vs. selected content).
      *   *Nuance on Thermostats:* Why are thermostats excluded? Because they don't have *multiple* potential actions based on the state. They have one fixed reflex. Brains decouple input from output. This is the "Mediation" criterion.
      *   *Terminology:* Use "Vehicle" vs. "Content." Use "Homuncular Functionalism."

  5.  **Final Polish:**

