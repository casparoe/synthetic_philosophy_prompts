answer: |-
  ### Exam Question

  **Question 4 (Essay):**
  Bostrom's "Presumptuous Philosopher" scenario is frequently deployed as a *reductio ad absurdum* against the Self-Indication Assumption (SIA). 
  1. Explain precisely why the Presumptuous Philosopher scenario creates a probabilistic crisis for SIA but not for the Self-Sampling Assumption (SSA). 
  2. Identify the problem facing SSA that is *structurally analogous* to the Presumptuous Philosopher objection. 
  3. Articulate the strongest defense an SIA proponent can offer against the Presumptuous Philosopher charge, and explain the specific theoretical cost incurred by adopting this defense. 

  *(Recommended length: 500–700 words)*

  ***

  ### Model Answer

  The Presumptuous Philosopher (PP) scenario posits two theories about the universe: $T_1$ predicts a billion observers, while $T_2$ predicts a trillion. Both are equally plausible based on physical evidence. The Philosopher argues that $T_2$ is overwhelmingly more likely simply because they exist. This creates a crisis for the Self-Indication Assumption (SIA) because SIA dictates that an observer should reason as if they are a random sample from the set of *all possible* observers. Consequently, SIA weights the probability of a world by the number of observers it contains. In the PP scenario, SIA compels the agent to assign a probability of roughly 99.9% to $T_2$, effectively allowing armchair reasoning to override empirical priors regarding physical laws. This is deemed "presumptuous" because it grants existence alone too much evidentiary weight.

  SSA avoids this specific crisis because it treats the observer as a random sample from the set of observers in the *actual* world, not possible worlds. SSA does not shift the prior probability of the world itself based on observer count; it only shifts the likelihood of the observer's specific indexical location within that world. Therefore, under SSA, the Philosopher cannot claim $T_2$ is more likely *ex ante*; they can only reason about their location assuming one theory is true.

  However, SSA faces a structurally analogous problem: the Doomsday Argument. While SIA is accused of being presumptuous about the *size* of the population (favoring larger worlds), SSA is presumptuous about the *duration* of the population (favoring smaller worlds). The Doomsday Argument relies on the principle of mediocrity inherent in SSA: if I am a random sample of all humans who will ever live, and I find myself among the first 100 billion, it is statistically unlikely that there will be trillions more. Thus, SSA compels the agent to downgrade theories predicting long-lived civilizations. Like the PP objection, this allows anthropic reasoning to override empirical expectations about population growth. Both objections highlight the danger of anthropic principles generating strong conclusions about population magnitudes from weak indexical data.

  An SIA proponent's strongest defense is to bite the bullet and argue that the intuition driving the PP objection is mistaken. Proponents like Ken Olum argue that we *should* update our credences based on the fact of our existence. If existence is more likely in a world with more observers, ignoring that fact is irrational Bayesian updating. They argue that the "presumptuousness" is actually a feature, not a bug, as it correctly accounts for selection effects that SSA ignores (such as solving the Sleeping Beauty problem in favor of the "thirder" position).

  The theoretical cost of this defense is the "Infinite Observer" problem, particularly in cosmology. If SIA dictates that we should always favor worlds with more observers, then in an eternal inflation multiverse where some theories predict infinite observers, SIA assigns probability 1 to those theories regardless of physical evidence. This renders empirical science impotent; any physical theory predicting a finite universe is ruled out *a priori* by any theory predicting an infinite one. Thus, to save SIA from the charge of presumptuousness, the defender must accept that anthropic reasoning can completely dominate physical priors, potentially leading to a solipsistic or empirically unmoored cosmology. The SIA defender escapes the PP charge only by accepting that existence is a trump card over physics, a high price for theoretical coherence.

  ***

  ### Marking Scheme

  **A Grade (Excellent: 85–100%)**
  *   **Mechanism:** Clearly explains that SIA weights world probabilities by observer count ($P(World) \times N$), whereas SSA conditions on the world first. Explicitly states why this forces the SIA agent to favor $T_2$ in the PP scenario.
  *   **Analogy:** Correctly identifies the **Doomsday Argument** as the SSA analog. Crucially, explains the *structural symmetry*: both arguments use anthropic reasoning to derive population facts (SIA = "World must be big"; SSA = "World must be small") that seem to override empirical priors.
  *   **Defense & Cost:** Articulates a specific defense (e.g., "existence is evidence," or "intuitions are biased"). Identifies a specific, high-stakes cost (e.g., the **Infinite Observer/Measure Problem**, or the inability to falsify cosmological theories predicting infinite populations).
  *   **Clarity:** Argument is tight, terminology is precise, and word count is within limits.

  **B Grade (Good: 70–84%)**
  *   **Mechanism:** Correctly defines SIA and SSA and notes that SIA favors the larger world in the PP scenario. May lack precision on *why* SSA avoids this (e.g., fails to mention SSA conditions on the actual world).
  *   **Analogy:** Identifies the Doomsday Argument but treats it merely as "another problem" rather than explaining the structural symmetry regarding population estimation.
  *   **Defense & Cost:** Mentions a defense (e.g., "biting the bullet") but the explanation of the cost is vague (e.g., "it makes science hard" without specifying the infinite observer issue or prior domination).
  *   **Clarity:** Generally clear but may wander or lack philosophical precision in the second half.

  **C Grade (Satisfactory/Fail: 50–69%)**
  *   **Mechanism:** Defines SIA and SSA correctly but struggles to apply them to the PP scenario. May claim SSA also favors the larger world.
  *   **Analogy:** Fails to identify the Doomsday Argument, or identifies an unrelated problem (e.g., "Adam & Eve" without explaining the population link). Fails to establish the analogy.
  *   **Defense & Cost:** Vaguely mentions that SIA has "problems" but offers no specific defense or cost. May confuse the Sleeping Beauty problem as a "cost" rather than a motivation.
  *   **Clarity:** Disorganized, significant definitional errors, or significantly under/over the word limit.
