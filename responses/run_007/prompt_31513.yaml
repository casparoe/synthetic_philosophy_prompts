  1. The theory must distinguish supererogatory acts from merely permissible ones using cases like donating a kidney versus eating a salad, where both are optional but only the former earns moral praise. This is non-negotiable because collapsing the distinction eliminates the phenomenon entirely.
  2. It must dissolve the paradox of why an agent isn't blameworthy for skipping the morally best option, typically by rejecting the principle that 'ought' always tracks the 'best'. This is non-negotiable for any theory claiming to save supererogation from consequentialist collapse.
  3. The theory must explain or deny the asymmetry between going beyond duty (praiseworthy) and falling short of perfection (blameworthy), such as why heroism is optional but cowardice is often not. Whether this asymmetry is real is a preference of non-consequentialist camps, while consequentialists must deny it.
  4. It must account for psychological constraints where viewing an act as optional undermines the motive required to make it good, like saving a child only because you calculated it wasn't duty. This is a preference of virtue-ethical camps, as strict deontologists might deny motive affects moral status.
  5. I am moderately confident this list captures the core tensions, though satisfying the 'ought' paradox dissolution and the psychological constraints simultaneously may be impossible. I am least sure the asymmetry requirement is genuine, as some coherent theories simply deny suberogation exists.
