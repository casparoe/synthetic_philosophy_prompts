answer: |-
  This is an exceptionally sharp observation. You have put your finger on a structural tension that runs through much of contemporary population ethics, animal ethics, and the effective altruism (EA) rationalist sphere. It is a tension between **axiological gradience** (how value *is*) and **decision-theoretic binarism** (how we *act*).

  As a philosopher working in this area, I can tell you that while there isn't one single canonical phrase for exactly this phenomenon, we can carve it up using existing distinctions in metaethics and decision theory. The pattern you are seeing is a slide from **Moral Gradualism** into **Decision-Theoretic Thresholding**, often driven by a confusion between **Epistemic Uncertainty** and **Ontic Degree**.

  Here is the breakdown of the terminology, the philosophical mechanics of the collapse, and what a consistent graded view would actually look like.

  ### 1. Naming the Views

  **The Graded View: Moral Gradualism (or Scalar Moral Status)**
  The view that moral status is not an on/off switch but a continuous variable is standardly called **Moral Gradualism**.
  *   **Key Proponents:** Jeff McMahan (*The Ethics of Killings*), Shelly Kagan (*How to Count Animals*), and to a lesser extent, Peter Singer (who often speaks of "equal consideration of interests" but admits interests vary by capacity).
  *   **The Claim:** The wrongness of killing or causing suffering is a function of the psychological richness of the subject. A chimpanzee has a stronger interest in continuing to live than a mouse; a mouse more than a gnat.

  **The Collapse: Decision-Theoretic Thresholding (or Lexical Discontinuity)**
  There isn't a single settled name for the move you described, but in decision theory and normative ethics, it resembles **Threshold Deontology** or **Lexical Priority**.
  *   **The Move:** Acknowledging the gradient ontologically, but imposing a binary cutoff for the sake of action-guidance.
  *   **Why it happens:** It is often a heuristic to solve computational complexity or risk management. "I can't calculate the exact moral weight of a bee, so I will treat it as zero to save cognitive resources," or "If there is *any* chance this digital mind is sentient, the risk of infinite suffering outweighs the cost of helping, so I treat it as 'in'."

  ### 2. The Carving: Why the Collapse Happens

  You asked for the carving of how this relates to marginal cases, sorites, and expected value. The collapse usually happens because people are conflating three distinct variables. When you separate them, the "collapse" looks less like a contradiction and more like a (perhaps unjustified) simplification.

  #### A. Ontic Degree vs. Epistemic Probability
  This is the most critical distinction.
  1.  **Ontic Degree:** How much does the being matter *if* it is sentient? (Pig > Shrimp).
  2.  **Epistemic Probability:** How likely is it that the being is sentient *at all*? (Mammal > Insect > Rock).

  **The Confusion:** In EA/LessWrong discussions about digital minds or insects, these get mashed together into "Expected Moral Weight."
  *   *The Gradualist Claim:* "A shrimp has 0.01 the moral weight of a pig."
  *   *The Collapse:* "There is a 1% chance the shrimp is sentient."
  *   *The Error:* People often treat the **Epistemic Probability** as a binary switch. If $P(\text{sentience}) > 0$, they act as if the **Ontic Degree** is 1.0 (Full Status). This is a form of **Pascalian Reasoning**. They fear the "moral mugging" of ignoring a potentially sentient being, so they upgrade any nonzero probability to full inclusion.

  #### B. The Sorites and the Marginal Cases
  *   **Marginal Cases:** The argument that if we grant rights to humans with low cognitive capacity, we must grant them to animals with similar capacity. **Moral Gradualism** is actually the *solution* to the Marginal Cases argument. It says, "Yes, the severely cognitively impaired human and the pig have similar status, and that status is lower than a typical adult human."
  *   **The Sorites (Vagueness):** If status is graded, where is the line? The Gradualist says, "There is no line."
  *   **The Collapse:** When the EA practitioner draws a line (e.g., "We work on vertebrates, not invertebrates"), they are **re-instating the Sorites problem** they claimed to have solved. They are admitting that for *practical purposes*, they need a sharp boundary, even if they deny one exists *metaphysically*.
  *   **Why?** Because of **Cause Prioritization**. EA is fundamentally about resource allocation. You cannot allocate 0.003% of your career to shrimp, 0.004% to bees, and 0.005% to nematodes. You must pick a cause. This forces a binary choice (Work on X / Do not work on X) onto a graded reality.

  #### C. Expected Value (EV) Reasoning
  Standard EV reasoning handles gradients naturally: $EV = P(\text{sentience}) \times \text{Intensity}(\text{suffering}) \times \text{Number}(\text{beings})$.
  *   **The Consistent View:** If a shrimp has 1/100th the capacity for suffering of a cow, you should be willing to save 100 shrimp to save 1 cow (ceteris paribus).
  *   **The Collapse:** The "collapse" occurs when people treat the output of the EV calculation as a **Veto** or a **Mandate**.
      *   *Veto:* "If $EV > 0$, we must not risk it." (Treats nonzero as binary 'Do Not Harm').
      *   *Mandate:* "If $EV < \text{Threshold}$, we ignore it." (Treats small nonzero as binary 'Zero').

  ### 3. What Would a Consistent Graded View Look Like?

  You asked what a view looks like that keeps the grading "all the way down," without exploding into "everything counts equally" or bottoming out at "zero."

  This view exists in the literature, often under the banner of **Weighted Aggregation** or **Proportional Consideration**. Here is how it functions without collapsing:

  **1. Exchange Rates, Not Thresholds**
  Instead of asking "Is this being in the moral circle?", you establish exchange rates.
  *   *View:* Saving one pig is morally equivalent to saving 500 shrimp.
  *   *Action:* If you have resources to save 1 pig OR 600 shrimp, you save the shrimp. If you can save 1 pig OR 400 shrimp, you save the pig.
  *   *No Collapse:* There is no point where the shrimp value becomes zero. It just becomes outweighed by higher-weight beings when resources are constrained.

  **2. Diminishing Marginal Utility of Intervention**
  A consistent gradualist acknowledges that helping beings with lower moral weight might be *cheaper*.
  *   If shrimp suffer less than pigs, but it costs 1/1000th as much to alleviate shrimp suffering, the "Expected Value" might still favor the shrimp, even if their moral weight is lower.
  *   *The Collapse:* The binary thinker says "Shrimp don't count, so cost doesn't matter." The Gradualist says "Shrimp count less, but they are also cheaper to help, so here is the optimal ratio."

  **3. Risk-Weighted Gradualism (Handling Uncertainty)**
  To handle the digital mind/insect uncertainty without collapsing into Pascal's Mugging:
  *   Instead of "If $P > 0$, treat as 1," use **Risk-Weighted Expected Value**.
  *   You discount the moral weight by the probability, but you do not round up to 1.
  *   *Crucially:* You accept that some things will have such low expected moral weight that they will *never* win in a trade-off against high-weight beings, **not because they are zero**, but because the numbers don't add up.
  *   *Distinction:* This is different from saying they are zero. It means they are *trumped*, not *excluded*. If you had infinite resources, you would still help the thermostat (if $P > 0$), whereas the binary thinker would never help the thermostat.

  ### 4. Why Careful People Do This (The Charitable Interpretation)

  You noted that careful people do this while aware they are doing it. Why?

  1.  **Rights vs. Interests:** Many philosophers hold a hybrid view. **Interests** are graded (suffering matters by degree), but **Rights** are binary (you either have a right not to be killed or you don't). If the discourse shifts from "suffering" to "rights" (common in legal or policy contexts), the binary returns.
  2.  **Tractability and Neglectedness:** In EA, "Cause Prioritization" requires comparing buckets. It is psychologically and organizationally difficult to maintain a fluid gradient across a global movement. "Focus on Factory Farming" is a binary slogan that hides a graded justification.
  3.  **The "Moral Hazard" of Gradients:** There is a fear that if we admit moral status is graded, people will use it to justify ignoring the "lower" grades entirely. By setting a binary floor ("Everything with a nervous system counts fully"), they hope to protect the vulnerable from being mathed out.

  ### 5. Summary of the Distinction

  To answer your specific request for the carving:

  *   **The Problem:** The slide from **Axiological Gradualism** (Value is continuous) to **Deontic Binarism** (Obligation is binary).
  *   **The Driver:** Usually **Epistemic Risk Aversion** (fear of missing a sentient being) or **Organizational Constraint** (need to pick one cause to fund).
  *   **The Consistent Alternative:** **Proportional Trade-Off View**.
      *   *Sorites:* Dissolved. No sharp line, just shifting exchange rates.
      *   *Marginal Cases:* Solved. Humans and animals are placed on the same scale.
      *   *Expected Value:* Applied literally. $P \times V$ is never rounded to 0 or 1.
      *   *The Cost:* It requires accepting that in a resource-constrained world, beings with very low moral weight will effectively receive no help, not because they lack status, but because they are outbid by beings with higher status.

  The frustration you feel is justified. It is the frustration of watching someone use a high-resolution map (Gradualism) to navigate, but then drive as if the roads are either "Highway" or "Cliff" (Binarism). They are using the gradient to justify their moral sophistication, but using the binary to make their decisions tractable. A truly consistent view requires the courage to say, "This being matters, but not enough to save right now," which is emotionally and rhetorically much harder than saying, "This being is outside the moral circle."
