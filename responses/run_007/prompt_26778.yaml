      *   *The Philosophy:* *Begriffsschrift* (1879), *Grundlagen* (1884), "On Sense and Reference" (1892). Core tenets: Logicism (math reduces to logic), Anti-psychologism (logic is objective, not mental), Platonism (thoughts exist in a "third realm").
