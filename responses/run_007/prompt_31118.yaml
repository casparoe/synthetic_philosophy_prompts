  ### Grading Rubric

  | Criterion | Marks Available | Description |
  | :--- | :---: | :--- |
  | **Explanation of the Master Argument** | 6 | Accuracy in reconstructing the *conceivability* move (trying to conceive of an unperceived object). |
  | **Distinction from Other Arguments** | 6 | Ability to separate the Master Argument from Berkeley's other lines of reasoning (e.g., perceptual relativity). |
  | **Assessment of Scope/Strength** | 5 | Evaluation of what the argument establishes *on its own* (e.g., logical impossibility vs. epistemic limitation; independence from theological premises). |
  | **Clarity & Structure** | 3 | Coherence, readability, and directness in addressing the prompt. |
