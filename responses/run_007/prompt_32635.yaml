  *(Final Plan)*:
  1. Acknowledge the sophistication of the query.
  2. Define the "Exposure Map" (The conditions for falsification).
  3. Analyze the Cognitive Science threat (The biggest empirical risk).
  4. Analyze the Normativity threat (The biggest philosophical risk).
