answer: |-
  This is a classic frustration in behavioral genetics debates. The phrase "Heritability is not destiny" is a slogan, not a scientific argument. It functions as a semantic shield that can hide several very different claims, ranging from profound statistical truths to trivial tautologies to outright falsehoods.

  To help you untangle your argument, here is a breakdown of the five distinct claims your friend might be making behind that slogan. I have categorized them by **validity** (is the science right?) and **relevance** (does it actually address your point about education policy and gaps?).

  ### 1. The Malleability Claim
  **The Claim:** *"High heritability does not mean a trait is immutable. Environmental interventions can still change the phenotype significantly."*
  *   **Validity:** **True.** This is the standard textbook definition. Height is highly heritable (~0.8), yet average height increased by inches over the 20th century due to nutrition and healthcare. Phenylketonuria (PKU) is 100% genetic, but a dietary intervention prevents the cognitive damage.
  *   **Relevance to Your Point:** **High.** This directly engages your claim that gaps are "hard to close with schooling." She is arguing that even if IQ is 70% heritable, the remaining 30% (plus Gene-Environment interaction) allows for significant movement.
  *   **Verdict:** This is the strongest version of her argument. If this is what she means, she is scientifically correct, though it doesn't guarantee *specific* schooling interventions will work, only that *some* environmental change could.

  ### 2. The "Within vs. Between" Claim (The Lewontin Argument)
  **The Claim:** *"High heritability within a group tells us nothing about the cause of differences between groups."*
  *   **Validity:** **True.** This is a fundamental statistical principle. If you plant genetically identical seeds in poor soil and rich soil, the variation *within* the poor soil group is 100% environmental (0% heritable), and the variation *within* the rich soil group is 100% environmental. Yet the *gap between* the two groups is entirely environmental. Conversely, high heritability within Group A and Group B does not prove that the average difference between A and B is genetic.
  *   **Relevance to Your Point:** **Critical.** You mentioned "performance gaps." If you are implying that because IQ is heritable, the gaps between schools, socioeconomic classes, or demographics must be genetic (or hard to close genetically), this claim demolishes that inference.
  *   **Verdict:** If she is gesturing at this, she is making a sophisticated statistical point that invalidates the leap from "IQ is heritable" to "Gaps are genetic/hard to close."

  ### 3. The Context-Dependence Claim (GxE Interaction)
  **The Claim:** *"Heritability estimates are not fixed constants; they change depending on the environment."*
  *   **Validity:** **True.** Heritability ($h^2$) is a ratio of genetic variance to total variance. If you equalize the environment (reduce environmental variance), heritability goes up. If you introduce a powerful new environmental intervention (like a massive improvement in schooling), you increase environmental variance, which can lower heritability and shift the mean.
  *   **Relevance to Your Point:** **Medium-High.** This suggests that the 0.6–0.8 number you cited applies to *current* environments. In a radically different education system, that number might change, and the mean IQ could shift.
  *   **Verdict:** This supports her side by suggesting your data (current heritability estimates) might not apply to the *proposed* policy interventions.

  ### 4. The Normative Claim
  **The Claim:** *"Even if a gap is genetic or hard to close, we have a moral obligation to try to mitigate it."*
  *   **Validity:** **True (Ethically), N/A (Empirically).** This is a value judgment, not a scientific fact.
  *   **Relevance to Your Point:** **Low.** This is a rhetorical dodge. You are making an empirical claim ("interventions won't work well"), and she is responding with a normative claim ("we should try anyway").
  *   **Verdict:** This is a "conversation stopper." It doesn't engage with your point about efficacy; it changes the subject to morality.

  ### 5. The Denial Claim
  **The Claim:** *"The heritability numbers you are citing (0.6–0.8) are wrong or exaggerated."*
  *   **Validity:** **False/Debatable.** Twin and adoption studies consistently show adult IQ heritability in that range. While there is debate about the exact mechanisms (e.g., epigenetics, assortative mating), denying the statistical estimate outright is generally not supported by the consensus data.
  *   **Relevance to Your Point:** **High.** If this is what she means, she is attacking your premise.
  *   **Verdict:** If she is arguing this, she is likely fighting the data rather than the interpretation. This is the weakest version of her argument unless she has specific methodological critiques.

  ---

  ### Summary: Which is she actually making?

  In my experience, when people say "Heritability is not destiny" in a policy debate, they are usually mixing **Claim 1 (Malleability)** and **Claim 2 (Within/Between)**.

  **Here is how to diagnose which one she means:**
  *   **If she talks about the Flynn Effect** (IQ scores rising over time despite genetics): She is making **Claim 1**. She is arguing that environmental shifts *can* move the needle.
  *   **If she talks about inequality or demographics:** She is making **Claim 2**. She is arguing that you cannot use within-group heritability to justify between-group gaps.
  *   **If she talks about fairness or effort:** She is making **Claim 4**. She is dodging the efficacy question.

  ### How to engage her (The "Steel Man" Approach)

  To move past the slogan, you need to force specificity. You can say:

  > "I agree that heritability isn't destiny. I'm not saying IQ is immutable. My point is specifically about **effect sizes**. Given that adult heritability is high, the *remaining variance* available for schools to affect is smaller. Are you arguing that schools can overcome that genetic constraint easily, or are you arguing that the gaps we see aren't genetic to begin with?"

  **The Breakdown for your next talk:**
  1.  **If she argues Malleability:** Ask for evidence of *sustained* IQ gains from schooling interventions. (Many raise test scores temporarily but don't raise $g$-factor long-term).
  2.  **If she argues Within/Between:** Concede the point. It's statistically true. But clarify that your argument is about *individual* potential and the limits of intervention for *any* given child, not just group gaps.
  3.  **If she argues Normative:** Acknowledge it. "I agree we should try, but we should be realistic about the expected return on investment so we don't waste resources."

  **The Bottom Line:**
  Your friend is likely right that **high heritability does not preclude environmental change** (Claim 1), and she is definitely right that **within-group heritability does not explain between-group gaps** (Claim 2). However, you are also right that **high heritability implies that environmental interventions face diminishing returns** compared to traits with low heritability.

  The slogan "Heritability is not destiny" is **true**, but it is often used to imply "Environment is just as powerful as genetics," which is **false**. High heritability means genetics is the *dominant* source of variance in the current environment. Closing gaps is possible, but your intuition that it is "hard" is statistically supported. Her slogan doesn't refute the difficulty; it just refutes the impossibility.
