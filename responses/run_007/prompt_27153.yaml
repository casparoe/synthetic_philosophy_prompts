answer: |-
  Your friend with the math degree is right. It is not a bug in your code, and it is not a limitation of current research. It is a fundamental mathematical limit.

  You should stop chasing a perfectly strategy-proof ranked voting system. You will not find one.

  Here is the breakdown of why this is the case, the specific theorem that proves it, and practical advice on what to build instead for your friend group.

  ### The Hard Limit: Gibbard-Satterthwaite Theorem

  In social choice theory, the result you are running into is the **Gibbard-Satterthwaite Theorem** (independently proved in the early 1970s).

  The theorem states that for any voting system that meets three basic conditions, there will always be situations where a voter can get a better outcome by lying about their preferences:
  1.  **There are at least 3 options.** (With 2 options, majority rule is strategy-proof).
  2.  **The system is deterministic.** (The same votes always produce the same winner; no dice rolling).
  3.  **It is not a dictatorship.** (One person doesn't just override everyone else).

  If you satisfy those three, **strategic voting is always possible.**

  **The Engineering Analogy:**
  Think of this like the **CAP Theorem** in distributed systems (Consistency, Availability, Partition Tolerance: pick two) or the **Halting Problem** in computation. You aren't failing to solve it because you haven't found the right algorithm; you are failing because the requirements themselves are mutually exclusive.

  ### Why Does This Happen?

  The core issue is that voting is an aggregation of *ordinal* data (ranks) into a single outcome. When you have three options (A, B, C), your vote isn't just about saying "I like A best." It's also a signal about how you feel about B vs. C.

  If the system cares about your second choice (to break ties or transfer votes), you have an incentive to manipulate that second choice.
  *   **Example:** You love A, like B, and hate C.
  *   **Honest Vote:** A > B > C
  *   **Strategic Vote:** A > C > B

  If you suspect B is A's biggest rival for the win, you might rank B last (burying them) to help A win, even though you actually prefer B over C. Every system that tries to be "fair" by looking at more than just first-place votes opens a door for this kind of tactical calculation.

  ### What Should You Build Instead?

  Since you cannot eliminate strategic voting, your goal shifts to **making strategy difficult, unintuitive, or not worth the effort.**

  For a group of nine friends making low-stakes decisions (dinner, trips), you don't need a system that is mathematically immune to manipulation (impossible); you need a system that is **robust** and **expressive**.

  Here are the two best paths for your specific use case:

  #### 1. Switch to Score Voting (Range Voting)
  You mentioned you settled on ranked ballots, but for a friend group, **Score Voting** is often superior.
  *   **How it works:** Instead of ranking (1st, 2nd, 3rd), users give each option a score (e.g., 0 to 5 stars).
  *   **Why it helps:** Ranks force you to say "I like Pizza slightly more than Tacos." Scores let you say "I love Pizza (5), Tacos are fine (3), and I hate Burgers (0)."
  *   **Strategy resistance:** While Gibbard-Satterthwaite still technically applies, the optimal strategy in Score Voting is usually just to vote honestly *unless* you know exactly how everyone else is voting. In a small, trusting group, the cognitive load of trying to game the scores usually outweighs the benefit.
  *   **Implementation:** Sum the scores. Highest total wins. It's dead simple to explain to users.

  #### 2. If You Stick With Ranks: Use a Condorcet Method
  If you want to keep the ranked ballot UI, do not use Instant Runoff (IRV) or Borda Count. Use a **Condorcet Method** (specifically **Schulze** or **Ranked Pairs**).
  *   **How it works:** The system looks at every pair of options (A vs B, B vs C, A vs C). If one option beats every other option in a head-to-head matchup, that option wins.
  *   **Why it helps:** Condorcet methods are generally much harder to game intuitively. "Burying" a candidate (ranking them last) often backfires because it messes up the pairwise math in unpredictable ways.
  *   **The Catch:** Sometimes there is no Condorcet winner (a "cycle" like Rock-Paper-Scissors). The Schulze method is a specific algorithm to resolve those cycles fairly.
  *   **Implementation:** It's more complex to code than IRV, but libraries exist. It is widely considered the gold standard for ranked elections in technical communities (like Debian or Wikimedia).

  ### The "Social Layer" Solution

  For a group of nine friends, the math matters less than the **transparency**.

  The reason strategic voting feels so bad is when it feels like a "gotcha." In a high-trust group, you can mitigate the impossibility theorem with social norms:

  1.  **Show the Work:** Your app should visualize *why* the winner won. (e.g., "Thai Food beat Italian Food 6-to-3 in head-to-head matchups").
  2.  **Allow Discussion:** Let people see the aggregate results before finalizing. If someone realizes they voted strategically and it produced a result everyone hates, they can admit it and re-vote.
  3.  **Accept "Good Enough":** Acknowledge to your friends that no system is perfect. If the group trusts each other, they won't spend 20 minutes calculating how to rank "Sushi" to block "Pizza." They will just vote for what they want.

  ### Summary Recommendation

  1.  **Accept the Theorem:** Your friend is right. Stop trying to find a strategy-proof ranked method. It doesn't exist.
  2.  **Pivot to Score Voting:** If you can change the UI, switch to 0-5 stars. It captures *intensity* of preference (which ranks lose) and is simpler to explain.
  3.  **Or Use Schulze Method:** If you keep ranks, implement the Schulze method. It is the most robust ranked system against manipulation, even if not immune.
  4.  **Prioritize Transparency:** Make the tallying logic visible to the users. In a small group, social trust is a better bug-fix than mathematical purity.

  You're building a tool for friends, not a national election. The "impossibility" is real, but in practice, it's noise. Pick the method that is easiest to explain at a dinner table.
