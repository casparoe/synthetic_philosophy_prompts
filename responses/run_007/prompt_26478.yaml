answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: THE NATURE OF WEAKNESS OF WILL

  **Date:** October 26, 2023
  **Participants:** Position A (Behavioral Economics/Preference-Reversal) vs. Position B (Philosophy/Genuine-Akrasia)
  **Subject:** Clarification of agreement and disagreement regarding the explanation of actions contrary to prior judgment.

  ## 1. Agreed Claims

  Both parties accept the following substantive claims as the empirical and phenomenological baseline for this collaboration:

  1.  **Systematic Violation of Prior Intentions:** Agents frequently undertake actions at time *t2* that they explicitly planned to avoid at time *t1*, despite no new exogenous information arriving between *t1* and *t2*.
  2.  **Temporal Proximity Effects:** The subjective value of rewards and costs changes systematically as a function of delay; proximity to consumption increases the weight of immediate gratification relative to long-term outcomes.
  3.  **Efficacy of Commitment:** Agents can successfully mitigate these violations through commitment devices (e.g., locking away funds, removing access), indicating that agents recognize the likelihood of future divergence from current plans.
  4.  **Normative Regret:** In a significant subset of these cases, agents report post-action regret, acknowledging that the action taken was worse according to their own evaluative standards than the action foregone.
  5.  **Dual-Process Architecture:** Human decision-making involves interacting systems characterized by different temporal sensitivities and processing speeds (e.g., impulsive vs. deliberative), regardless of whether these are labeled "selves," "preferences," or "modules."

  ## 2. Disagreements

  | Question | Position A (Preference-Reversal) | Position B (Genuine-Akrasia) |
  | :--- | :--- | :--- |
  | **1. Does akratic action involve acting against one's occurrent better judgment?** | **No.** At the moment of action, the agent's all-things-considered judgment shifts to align with the chosen action. The "better judgment" exists only at *t1*; at *t2*, the preference ordering has reversed. | **Yes.** The core phenomenon is synchronic: at the moment of action (*t2*), the agent judges X is better than Y, yet voluntarily performs Y. The judgment remains stable while the action diverges. |
  | **2. Is the "self" at the moment of temptation fully rational?** | **Yes.** The agent at *t2* is maximizing utility relative to their current discounting parameters. There is no internal irrationality, only inter-temporal inconsistency between *t1* self and *t2* self. | **No.** The agent at *t2* is failing to govern themselves according to their own normative conclusions. This is a structural failure of rationality (incontinence), not a consistent maximization of a shifted preference. |
  | **3. Do commitment devices work because they alter incentives or because they shore up agency?** | **They alter incentives.** Commitment devices change the payoff structure faced by the future self, making the previously tempting option utility-negative for the *t2* agent. | **They shore up agency.** Commitment devices act as external scaffolding for the executive function, allowing the agent's stable judgment to retain control over motor output despite impulse. |
  | **4. Is there a normatively significant difference between someone who pre-commits and someone who doesn't?** | **Pragmatically, yes; normatively, no.** Both are maximizing sequences of utilities given their constraints. The pre-commiter simply has better technology for managing time-inconsistency. | **Yes.** The pre-commiter exercises self-governance and integrity of agency. The non-pre-commiter who succumbs suffers a failure of will, which is a distinct normative failing beyond mere utility loss. |

  ## 3. Cruxes

  The following are empirical or observational questions where settling the matter would compel at least one side to revise their position. Both sides agree that the specified results would bear on the theory.

  **Crux 1: Neural Correlates of Valuation at the Moment of Action**
  *   **Test:** High-resolution neuroimaging (e.g., fMRI or EEG) measuring value-signaling regions (e.g., vmPFC/striatum) during the exact moment of choosing the tempting option in a known akrasia scenario.
  *   **Position A Prediction:** Neural value signals for the tempting option will exceed signals for the prudent option *before* the motor command is issued. (Valuation shifts to match choice).
  *   **Position B Prediction:** Neural value signals for the prudent option will remain higher (or equal), while conflict-monitoring regions (e.g., ACC) spike, indicating motor execution overriding stable valuation. (Valuation stays fixed; control fails).

  **Crux 2: Phenomenological Reports of Resistance**
  *   **Test:** Immediate post-action introspective reporting (within seconds of action) regarding the experience of "wanting" during the act.
  *   **Position A Prediction:** Agents will report that, at the moment of action, they "wanted" the tempting option more than the prudent one. Reports of conflict will be rare once the choice is made.
  *   **Position B Prediction:** Agents will frequently report acting *while* feeling they should not, describing the experience as being "overpowered" or "unable to stop" despite not wanting to do it all-things-considered.

  **Crux 3: The Effect of Cognitive Load on Preference vs. Control**
  *   **Test:** Inducing high cognitive load during the temptation phase to impair executive function without altering emotional salience.
  *   **Position A Prediction:** Load will increase the discount rate, changing the underlying preference ordering toward the immediate reward. (Preference change).
  *   **Position B Prediction:** Load will leave the preference ordering intact but decrease the probability of the prudent action being executed. (Decoupling of judgment and action).

  ## 4. Verbal Disputes

  We acknowledge that a portion of our disagreement may stem from divergent definitions of **"preference."**
  *   **Position A** operates with a *revealed preference* definition: If an agent chooses Y, they preferred Y at that moment. Under this definition, akrasia (choosing against preference) is logically impossible, leaving only preference reversal.
  *   **Position B** operates with a *judgment-based* definition: Preference is determined by the agent's normative evaluation, which can remain fixed even if choice diverges.
  *   **Resolution Path:** We agree that if we standardize on the judgment-based definition, Position A's claim becomes empirically falsifiable (i.e., do judgments shift?). If we standardize on the revealed preference definition, Position B's claim becomes conceptually incoherent. Therefore, the substantive dispute rests entirely on the empirical claims in the **Cruxes** section regarding the stability of judgment/valuation signals during action.

  \answer{The central substantive claim at stake is whether actions contrary to prior plans reflect a shift in underlying valuation at the moment of choice or a failure of executive control to enact stable valuation.}
