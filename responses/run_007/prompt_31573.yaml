answer: |-
  This is a profound question that strikes at the heart of how modern states govern time. You are quite right to sense that a technical parameter is doing heavy moral lifting. In the philosophy of economics, this is often described as the distinction between *positive* economics (what is) and *normative* economics (what ought to be). The discount rate is ostensibly a tool of the former, but it is fundamentally a commitment to the latter.

  To assist with your scene and your understanding, I shall reconstruct the philosophical commitments of the Treasury's practice, specifically within the British context, where HM Treasury's *Green Book* guides these appraisals.

  ### 1. The Anatomy of the Rate

  To understand the moral carving, we must first separate the two ingredients you identified. Economists often express the social discount rate ($r$) using the Ramsey formula:

  $$r = \rho + \eta g$$

  *   **$\eta g$ (The Wealth Effect):** This is the expectation that future people will be richer ($g$) combined with the idea that an extra pound matters less to a rich person than a poor one ($\eta$). This is not controversial philosophically. It relies on the principle of diminishing marginal utility. It does not say future *lives* are worth less; it says future *consumption* is less urgent because they will have more of it.
  *   **$\rho$ (The Pure Rate of Time Preference):** This is the ingredient that puzzles you. It discounts the future simply because it is the future.

  When your Treasury official speaks of the discount rate, if they are defending $\rho > 0$, they are defending the proposition that the welfare of a person born in 2125 is intrinsically less weighty than the welfare of a person born in 2025, solely due to their location in time.

  ### 2. The Philosophical Presupposition

  What theory of justice does a positive $\rho$ presuppose?

  **The Rejection of Temporal Neutrality**
  Most moral philosophers, from Sidgwick to Rawls, argue for a principle of *temporal neutrality*. Just as it is unjust to favour people because they live in London rather than Leeds, it is unjust to favour people because they live in 2025 rather than 2125. Frank Ramsey, the Cambridge mathematician who devised this formula in 1928, famously described the pure rate of time preference as 'ethically indefensible and arising merely from the weakness of the imagination'.

  Therefore, a positive $\rho$ presupposes a **presentist bias**. It commits the government to a form of *intergenerational utilitarianism* where the utility of future agents is weighted less than current agents. It is not merely a bookkeeping convention; it is a moral assertion that the current generation has a stronger claim on resources than its successors.

  **The Official's Defence: Is it merely technical?**
  Your official might claim this is not a moral stance but a reflection of reality. They might offer three justifications. You should know how thin they are:

  1.  **Uncertainty of Existence:** 'We discount because there is a chance humanity won't exist in 2125.'
      *   *The Philosophical Counter:* While existential risk is real, standard discount rates are constant (e.g., 3.5% per annum). This implies a constant probability of extinction every year, which is demographically implausible. Furthermore, if we are discussing climate change, the policy *itself* affects the probability of existence. Using extinction risk to justify inaction on extinction risks is circular.
  2.  **Opportunity Cost of Capital:** 'Money spent on climate now could be invested to grow the economy, making future people richer.'
      *   *The Philosophical Counter:* This assumes that manufactured capital (machines, money) is a perfect substitute for natural capital (a stable climate). If the climate collapses, the money is worthless. This justification hides a gamble on substitutability inside a rate of interest.
  3.  **Descriptive Myopia:** 'People naturally prefer present goods. The state should reflect the preferences of its citizens.'
      *   *The Philosophical Counter:* This conflates *is* with *ought*. Citizens may be myopic, but the Treasury is supposed to act as a trustee for the long term. To codify human impatience into state policy is to institutionalise a moral failing.

  ### 3. Consistency with Rhetoric and Rights

  You ask if this practice is consistent with the way governments speak of future generations in treaties and preambles. The short answer is: no.

  When a government signs a declaration on the 'Rights of Future Generations', it is employing a **deontological** framework. It suggests that future people have rights that impose duties on us, regardless of the cost-benefit analysis. A right is a trump card; it is not something to be traded off against present GDP.

  However, the discounting practice employs a **consequentialist** framework. It treats future harms as costs to be weighed against present benefits.

  If a death in 2125 is discounted to a negligible present value, the 'right to life' for that future person is effectively rendered void in the arithmetic. The Treasury's practice is therefore in direct tension with the rhetorical commitments of the state. In your novel, this hypocrisy is a rich vein. The official is speaking the language of rights to the public, but the language of accounting to the spreadsheet. In the spreadsheet, rights do not exist; only utilities do, and they shrink with time.

  ### 4. Temporal Egalitarianism: Collapse or Change?

  If the Treasury adopted strict temporal egalitarianism (setting $\rho$ to zero), what would happen?

  **The Arithmetic**
  The practice would not collapse mathematically. Cost-benefit analysis can function with a zero discount rate. However, the *results* would change radically. Harms occurring in 100 years would retain almost their full weight in present calculations. This would make almost any expenditure on climate mitigation appear 'cost-effective' today, no matter how expensive, because the avoided future damage is catastrophic.

  **The Political Economy**
  Here is where the practice might 'collapse' in a practical sense. A zero discount rate implies that the current generation should sacrifice significantly for the future, potentially reducing their own standard of living to a degree that is politically unsustainable.

  The positive discount rate acts as a **political stabiliser**. It ensures that the demands of the future do not overwhelm the needs of the present voters who actually elect the government. In this light, the discount rate is not just a moral theory; it is a mechanism of democratic self-preservation. It ensures the state remains responsive to the living rather than the unborn.

  ### 5. Guidance for Your Scene

  For your scene between the Treasury official and the activist, the tension lies in whether the official believes they are describing a law of nature or enforcing a political choice.

  **The Official's Perspective**
  The official should not sound like a villain who hates children. They should sound like a fiduciary of the present. Their argument is that the government is a trust established by the *living*. To bankrupt the present for the sake of the future is to violate the contract with current citizens. They might say:

  > 'You speak of justice as if it were a timeless geometry. But the Treasury does not govern time; it governs the British people as they exist today. If I value your grandchildren's comfort exactly equal to your own, I must tax you until you have nothing left to give. Is that justice, or is it martyrdom? The rate is not a measure of their worth. It is a measure of our capacity to pay.'

  **The Activist's Counter**
  The activist's leverage is the inconsistency you noted. The government claims to be a steward for the nation's future, yet its arithmetic treats that future as a foreign country with a weak currency.

  > 'You say it's about capacity to pay. But you're using that rate to justify burning the house down. If you truly believed my grandchildren were richer, you wouldn't need to discount their pain; you'd acknowledge they inherit a ruin. You aren't measuring their wealth, sir. You're measuring your own convenience.'

  **The "Carving" to Reveal**
  The crucial revelation for your reader should be this: The discount rate is a **boundary line**. It defines where the moral community ends. By setting a positive rate, the Treasury is drawing a circle around the present generation and saying, 'Inside this circle, we are brothers. Outside it, we are strangers.'

  In the UK, HM Treasury actually uses a *declining* discount rate for long-term projects (3.5% for the first 30 years, dropping to 1% thereafter). This is a tacit admission of the moral problem you have identified. They know a constant rate is indefensible over centuries. In your near-future setting, you might imagine this compromise has failed, or that the rate has been hardened again due to economic pressure.

  ### Summary of Commitments

  To answer your specific questions directly:

  1.  **What theory of justice?** It presupposes a weighted utilitarianism that privileges the present. It rejects the principle of temporal neutrality.
  2.  **Does it presuppose later people matter less?** Yes, intrinsically. Justifications regarding uncertainty or opportunity cost are often post-hoc rationalisations for this core preference.
  3.  **Is it consistent with rights rhetoric?** No. It is fundamentally inconsistent. The rhetoric is deontological (rights-based); the arithmetic is consequentialist (outcome-based) with a time bias.
  4.  **Would strict egalitarianism collapse the practice?** It would not break the mathematics, but it would break the political consensus. It would demand sacrifices from the present that liberal democracies have historically been unwilling to make.

  The moral content is indeed hidden inside the rate. It is a silent vote on how much the present owes the future. In your novel, the controversy should not be about the maths, but about who has the authority to cast that vote.
