  ### The state of play

  The debate over the norm of assertion is deeply entrenched. Since Williamson proposed the Knowledge Norm (KNA)—assert $p$ only if you know $p$—rivals have championed Truth, Belief, and Reasonable Belief norms. The dialectic is cyclic and familiar: KNAs explain Moore-paradoxical assertions ("$p$, but I don't know $p$") effectively but stumble on lottery propositions, where assertion seems improper despite high probability lacking knowledge. Truth norms handle lotteries but fail to explain why sincere falsehoods are criticized differently than lies. Belief norms accommodate sincere error but cannot explain why we challenge assertions with "How do you know?" rather than "Do you believe that?" Each theory handles a subset of cases while requiring ad hoc adjustments for others. Intuitions about Gettiered assertions or true guesses remain contested and theory-laden. Consequently, no consensus emerges. Theories are judged by their ability to survive counterexamples, but since intuitions vary and cases are engineered to target specific weaknesses, the result is a stalemate. Each side defends its norm as constitutive, viewing opposing data as performance errors or context shifts. The field is saturated with cases, yet the fundamental question remains unresolved, suggesting the impasse lies deeper than mere counterexample management. The literature has become a defensive trench warfare where no ground is gained. Recent attempts to synthesize these norms have largely failed to gain traction. This exhaustion suggests a structural flaw in the inquiry.

  ### Diagnosis

  Your hypothesis that the debate is ill-framed is the most promising diagnosis. The stall likely stems from a category mistake: treating "assertion" as a univocal natural kind with a single constitutive rule. In reality, assertion is a hybrid practice serving multiple functions within our form of life. The Knowledge Norm captures the *epistemic authority* aspect, explaining why assertions invite challenges regarding evidence and warrant. The Truth Norm captures the *representational* goal, reflecting the aim of mapping reality accurately regardless of the speaker's state. The Belief Norm captures *sincerity* and *cooperative* conditions, focusing on the speaker's mental state and accountability. When theorists argue, they are often prioritizing different functions of the speech act without acknowledging the plurality. Williamson focuses on the distinctive feature separating assertion from guessing; others focus on the moral propriety or conversational utility.

  Is it genuinely hard underdetermination? If the data simply underdetermined the theory, we might expect agnosticism or a proliferation of equally viable models. Instead, we see dogmatism. This suggests theorists are latching onto different real features of a complex practice and mistaking a part for the whole. Is there a hidden empirical disagreement? Partially. Experimental philosophy shows intuitions vary by context, culture, and stakes, suggesting there isn't a single folk concept of assertion being uncovered. However, the core issue is conceptual pluralism masked as monism. The debate assumes a monistic norm for a pluralistic practice. This explains why every norm feels partially right: each isolates a necessary condition for a *successful* assertion in certain contexts, but mistakes it for the *constitutive* rule governing the act universally.

  The disagreement isn't just about data; it's about the telos of assertion. Is it to transmit knowledge? To coordinate action? To express belief? Until this is disentangled, the debate remains a stalemate of competing priorities. Furthermore, there is confusion between constitutive rules (what makes an act an assertion) and regulative norms (how to do it well). A knowledge norm might be evaluative (good assertion) rather than constitutive (counts as assertion). The "norm" is actually a cluster of norms regulating different dimensions of the act. Recognizing this dissolves the pressure to choose one, revealing the debate as a conflict over which dimension is most philosophically significant, rather than which rule is strictly correct. The stall persists because participants refuse to concede that their rival's norm captures a genuine, albeit non-exclusive, constraint on assertion. One side defines success as knowledge transmission, the other as truthful representation. Without agreeing on the primary function, the norm debate is merely a proxy war for a deeper disagreement about the purpose of communication itself.

  ### What to do about it

  Progress requires abandoning the search for the "One True Norm." Instead, we should adopt a pluralistic framework. We need to distinguish between *constitutive* norms (what makes it an assertion), *evaluative* norms (what makes it a good assertion), and *prescriptive* norms (what one ought to do). A multi-dimensional model would allow knowledge to be the standard for criticism, truth for correctness, and belief for sincerity. This accepts your hypothesis that different norms capture different activities. New data should come from contextual variation: when do we excuse ignorance? When do we demand truth regardless of belief? Experimental philosophy should shift from testing intuitions about cases to mapping the pragmatic contexts where different norms dominate. Studies distinguishing perceptions of blamelessness versus incorrectness could clarify whether norms are moral or constitutive, but current studies often conflate these.

  Alternatively, we might dissolve the question entirely. If "assertion" is merely a label for a cluster of overlapping practices, seeking a single norm is like seeking the single norm of "game." Progress looks like mapping the ecology of assertion rather than legislating its constitution. We stop asking "What is the norm?" and start asking "Which norm governs this context?" This shifts the field from metaphysics of speech acts to pragmatics of communication. Giving up on the monistic question is not defeat; it is dissolution. Theories should compete on explanatory power regarding specific contexts rather than universal coverage. A contextualist approach acknowledges that high-stakes environments demand knowledge, while casual conversation may only require belief. This approach also resolves the tension between internalist and externalist intuitions. Internalists care about belief/justification; externalists care about knowledge/truth. A pluralistic model accommodates both by assigning them to different evaluative dimensions. The goal is not to declare a winner but to develop a taxonomy of assertoric practices. Until theorists accept that assertion is a cluster concept regulated by a vector of norms, the debate will remain a stalemate. The path forward is not better counterexamples, but a better taxonomy. This moves the debate from epistemology into the philosophy of language and social practice, acknowledging that the "norm" is a function of the social game being played, not a metaphysical essence of the act itself. Ultimately, the question may be verbal.
