answer: |-
  This is an exceptionally sharp question that cuts to the core of the philosophy of macroeconomics. You have identified what Alan Kirman (1992) famously called the "representation problem," a tension that has been debated in the philosophy of economics for forty years but often remains implicit in economic practice.

  Your intuition is correct: there is a significant gap between the *rhetoric* of microfoundations (which invokes methodological individualism) and the *practice* of representative agent (RA) modeling (which invokes a form of holism or functionalism).

  Here is a reconstruction of the implicit social ontology presupposed by modern macroeconomics, structured around your four questions.

  ---

  ### 1. Disambiguating "Microfoundations"

  To understand the tension, we must distinguish three distinct claims often conflated under the label "microfoundations."

  **A. The Metaphysical Thesis (Ontological Individualism)**
  *   **Claim:** Social entities (the economy, the market) do not exist independently of individuals. Social facts *supervene* on individual facts. There is no "economy" over and above the interactions of agents.
  *   **Implication:** To explain a social phenomenon, one must ultimately refer to the properties and actions of the constituent individuals.

  **B. The Explanatory Norm (Mechanistic Explanation)**
  *   **Claim:** A good explanation shows the *mechanism* by which individual actions aggregate to produce social outcomes. It must account for interaction, coordination, and potential conflict.
  *   **Implication:** Simply asserting an aggregate relationship is insufficient; one must show the "transmission belt" from micro to macro.

  **C. The Pragmatic/Epistemic Constraint (The Lucas Critique)**
  *   **Claim:** Aggregate relationships (e.g., Phillips Curve) are not structural; they shift when policy changes because they depend on agents' expectations. To evaluate policy, models must be built on "deep parameters" (preferences, technology, constraints) that are invariant to policy changes.
  *   **Implication:** "Microfoundations" here is code for **structural invariance**. It does not strictly require literal individuals, only that the model's equations represent stable behavioral rules rather than historical correlations.

  **The Conflict:** The Lucas Critique (C) is the historical driver of the microfoundations revolution. However, it is usually justified using the language of Metaphysical Individualism (A). This conflation is the source of the philosophical confusion you have detected.

  ### 2. Does the Representative Agent Satisfy These Requirements?

  The Representative Agent (RA) framework treats the aggregate economy as a single optimizing entity. Here is how it scores against the three definitions above:

  *   **Against Metaphysical Individualism (A): FAIL.**
      The RA is not an individual. It is a mathematical construct. In many RA models, the "representative" agent has preferences that no actual individual possesses (e.g., specific discount rates required to match aggregate data). If the ontology requires the social to be constituted by *many* interacting individuals, the RA model violates this by positing *one* individual. It is, ontologically, a form of holism (the economy is a unitary actor) disguised as individualism.

  *   **Against Explanatory Norms (B): FAIL.**
      The RA model does not explain *how* individual decisions aggregate. It assumes away the aggregation problem via **Gorman Aggregation Conditions**. It presupposes that distribution does not matter (e.g., a transfer of wealth from rich to poor does not change aggregate consumption). By assuming the result (perfect aggregation) rather than deriving it from interaction, it bypasses the mechanism of social explanation. It explains the macro by *eliminating* the micro.

  *   **Against the Pragmatic Constraint (C): PASS (Technically).**
      This is why the practice persists. The RA model *does* provide "deep parameters" (utility functions, production technologies). If you believe preferences are stable, the RA model satisfies the Lucas Critique. It allows for counterfactual policy analysis because the optimization problem is structural. It achieves epistemic stability without ontological realism.

  ### 3. Is the Practice Internally Consistent?

  **The Short Answer:** No, not if taken literally as Methodological Individualism.
  **The Nuanced Answer:** It is consistent if viewed as **Instrumental Individualism.**

  The implicit ontology of modern macroeconomics is not actually Methodological Individualism. It is **Structuralism dressed in Individualist clothing.**

  When macroeconomists demand microfoundations, they are usually demanding *invariance*. When they deploy the Representative Agent, they are acknowledging that modeling $N$ interacting agents is computationally intractable and empirically unidentifiable.

  **The Implicit Ontological Presupposition:**
  The practice presupposes that the **systemic logic of optimization** is more fundamental than the **plurality of agents.**
  1.  **Optimization is Universal:** The core "law" of the social world is not "individuals interact," but "constrained optimization occurs."
  2.  **Isomorphism:** It presupposes an isomorphism between the individual and the aggregate. It assumes the social whole behaves *as if* it were a rational individual.
  3.  **Distributional Neutrality:** It presupposes that distributional conflicts (who gains/loses) are secondary to efficiency problems (total size of the pie).

  **The Inconsistency:**
  The inconsistency arises when macroeconomists claim their models are "grounded in individual behavior" (invoking A) while simultaneously ignoring heterogeneity and interaction (violating A). As Kirman argued, the Representative Agent often behaves in ways that *none* of the actual individuals in the economy behave. For example, in an overlapping generations model, the aggregate savings rate might imply a discount factor that no actual generation possesses. The "microfoundation" is thus a fiction; the model is not founded on the micro, it is founded on the macro properties *attributed* to a fictional micro entity.

  ### 4. Reforming the Practice: Three Paths

  If macroeconomics were to align its ontology with its methodology, one of three things would have to change.

  **Option A: Take Methodological Individualism Seriously (Heterogeneous Agent Models)**
  *   **The Change:** Abandon the RA. Move to HANK (Heterogeneous Agent New Keynesian) models or Agent-Based Modeling (ABM).
  *   **Ontological Commitment:** The economy is a complex system of diverse actors. Distribution matters. Aggregation is a problem to be solved, not assumed.
  *   **Cost:** Massive computational complexity. Loss of analytical tractability. Difficulty in identifying "deep parameters" for diverse groups.
  *   **Status:** This is currently happening at the frontier of research (e.g., Kaplan, Moll, Violante), but the RA remains the pedagogical and policy standard.

  **Option B: Take the Lucas Critique Seriously, Drop Individualism (Structural VARs / Reduced Form)**
  *   **The Change:** Admit that "microfoundations" was just a proxy for "invariance." If we can find invariant relationships at the aggregate level (e.g., through institutional structures rather than preferences), we don't need individuals.
  *   **Ontological Commitment:** Social structures/institutions have causal powers independent of specific individual psychologies. (A more sociological ontology).
  *   **Cost:** Risks returning to the pre-Lucas era where policy regimes shifted parameters unexpectedly. Hard to justify *why* a relationship is invariant without a behavioral story.

  **Option C: The "Third Way" (Explicit Aggregation Theory)**
  *   **The Change:** Retain the RA but treat it explicitly as a **limiting case** rather than the default. Make the *conditions for aggregation* the primary object of study.
  *   **Ontological Commitment:** The economy is a multi-agent system that *sometimes* behaves like a single agent under specific institutional constraints (e.g., complete markets, perfect insurance).
  *   **Reform:** Models would explicitly state: "This RA result holds *only if* distributional effects are negligible." When policy changes distribution (e.g., tax cuts for the wealthy), the RA model is declared invalid.
  *   **Benefit:** This preserves the tractability of RA models while admitting their ontological limitations. It turns the "aggregation problem" from a hidden assumption into a visible research question.

  ### Summary: The Implicit Ontology

  To answer your core request directly: The practice presupposes a **Functionalist Ontology of Optimization.**

  It does not believe the economy *is* an individual (Metaphysical Individualism). Nor does it believe the model is *merely* a fiction with no truth value (Instrumentalism).

  Rather, it presupposes that **rationality is a systemic property.** The "individual" in the model is not a human being; it is a placeholder for the *logic of the system*. When macroeconomists say "microfoundations," they mean "foundations in the logic of choice." They assume that the logic of choice scales perfectly from the human mind to the aggregate economy.

  **For your work in political science:**
  This suggests that the "microfoundations" norm in economics is not actually a commitment to Methodological Individualism in the sense used by political scientists (e.g., Weber, Elster). It is a commitment to **formal consistency.**

  If you wish to critique it, do not attack it for lacking "realistic individuals." Attack it for **illicit aggregation.** The philosophical vulnerability is not that the agent is fake, but that the move from *many* to *one* erases power, distribution, and conflict—the very stuff of politics. By presupposing the Representative Agent, macroeconomics ontologically excludes politics (conflict over distribution) in favor of administration (optimization of the whole).

  **Recommended Reading for your Project:**
  1.  **Alan Kirman (1992):** "Whom or What Does the Representative Individual Represent?" (*Journal of Economic Perspectives*). The seminal critique.
  2.  **Kevin Hoover (2001):** *Causality in Macroeconomics.* Discusses the ontological status of macro variables.
  3.  **Uskali Mäki (2009):** "MISSing the World." On models as isolations.
  4.  **Nancy Cartwright:** On the capacity of economic models to represent capacities vs. realities.
  5.  **Recent HANK literature:** Look for papers discussing the "representative agent fallacy" in the context of inequality.

  This tension you've identified is the fault line where economics meets political science. The RA model assumes politics is solved (distribution is optimal or irrelevant); political science assumes economics is embedded in politics (distribution is contested).
