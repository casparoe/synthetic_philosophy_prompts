prompt: |-
  I'm a biostatistician — I design and analyze clinical trials, so I spend my days thinking about prior distributions, likelihood ratios, posterior probabilities, null and alternative hypotheses, and where the burden of proof ought to sit. Recently I've been reading some epistemology on the side, and I've become fascinated by G.E. Moore's proof of an external world. As I understand it, Moore holds up his hands during a lecture and says, in effect: here is one hand, and here is another; therefore, there exists an external world. The argument seems to be that his perceptual experience of his hands provides immediate warrant for the belief that mind-independent objects exist, and that this warrant is stronger than any warrant the skeptic can muster for the claim that he might be dreaming or a brain in a vat. The skeptic then complains that the argument begs the question, because the premise that he has hands already presupposes the very external world it is meant to prove. Moore's response, as I read it, is that the skeptic has the dialectical situation backwards: the ordinary belief is more certain than any philosophical premise that could be used to challenge it, and it is the skeptic, not Moore, who is being unreasonable in demanding a proof that does not rely on the very things we are most confident about.

  I want you to restate this entire dialectic — Moore's move, the skeptic's objection, and the Moorean inversion of the burden of proof — in the vocabulary I actually work with. Treat Moore's ordinary belief (that he has hands, that there is an external world) and the skeptic's hypothesis (that he is a brain in a vat, or dreaming, or deceived by a demon) as competing statistical hypotheses. Use the concepts I reach for daily: priors, likelihoods, posteriors, Bayes factors, null and alternative hypotheses, Type I and Type II error rates, the distinction between statistical and practical significance, and the idea that in some settings you need extraordinary evidence for extraordinary claims. Translate each move in the dialectic as precisely as you can.

  Then give me the residue report: what translated cleanly, what you had to distort or fudge, and what has no counterpart at all in my statistical vocabulary. I am especially interested in whether Moore's claim that some beliefs are more certain than any premise that could be used to doubt them has a natural Bayesian expression — is it just a very high prior, or is it something else? — and whether the skeptic's complaint about question-begging is merely a complaint about circular reasoning (which a Bayesian might dismiss as a problem of logical form rather than evidential support) or whether it points to something the Bayesian framework genuinely cannot capture. I want to know whether my statistical toolkit lets me see the debate more clearly, or whether it obscures something important.
