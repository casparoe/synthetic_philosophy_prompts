  3.  **Map to Biostatistical Vocabulary:**
      *   *Hypotheses:*
          *   $H_0$ (Null/Status Quo): Realism (External World exists, hands exist). *Note: Usually $H_0$ is the "no effect" case, but in Bayesian model comparison, we compare $M_1$ vs $M_2$. Let's frame Realism as the working model ($M_R$) and Skepticism as the alternative/challenge model ($M_S$).*
          *   $H_1$ (Alternative/Challenge): Skepticism (Brain-in-a-Vat, Dream).
      *   *Data:* Perceptual experience (seeing hands).
      *   *Likelihood:* $P(\text{Data} | \text{Model})$.
