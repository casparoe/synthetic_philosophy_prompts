answer: |-
  I reject step (4). It assumes that because suffering is deserved, third parties are barred from alleviating it. This conflates cosmic causal justice with human ethical duty.

  **Why it looked plausible:**
  It mirrors retributive justice intuitions. If a criminal deserves prison, releasing them seems unjust. We assume the universe's moral accounting should not be interfered with by human hands. It treats karma as a closed system where human intervention constitutes a moral error. It also relies on the intuition that desert negates claim-rights; if you deserve pain, you cannot claim help.

  **Why reject it:**
  In South Asian traditions, karma is often causal law, not divine punishment administered by humans. While the sufferer may deserve the consequence causally, the observer's duty is determined by *dharma* or *karuna* (compassion), not the sufferer's ledger. Alleviating suffering generates good karma for the helper. The "desert" applies to the experience of the suffering, not the isolation of the sufferer.

  **Costs of rejecting (4):**
  1.  **Dual Ethics:** You must maintain two parallel ethical tracks: one explaining why suffering occurs (karmic desert) and one dictating how to respond (compassionate duty). This creates tension between metaphysical explanation and ethical action.
  2.  **Interference Justification:** You must explain why interfering with "cosmic justice" is permissible. You must argue that the human role is compassion, not judgment, effectively limiting the scope of karma's normative force on bystanders.
  3.  **Epistemic Humility:** Since we cannot know others' karma, we must act assuming suffering should be relieved, rendering karma practically irrelevant for public policy while retaining it as metaphysical background.
  4.  **Complexity:** It prevents karma from being a simple "blame the victim" tool, requiring nuanced moral reasoning about when to help versus when to let lessons ripen.

  This preserves karma's explanatory power while avoiding the monstrosity of indifference.
