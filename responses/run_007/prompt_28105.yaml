      *   *Requirement 6: Biological Consistency/Co-evolution.* (Addresses Relationship to Bio Evo).
          *   *Motivation:* Humans are biological organisms. Brains evolved.
          *   *Status:* Non-negotiable (consistency), Preference (strong co-evolutionary modeling).

  3.  **Refining the Specific Concerns within the Desiderata:**

      *   *Replicator Problem:* I need to be careful here. Dawkins wants replicators. Sperber (CAT) says reconstructive transmission is enough. The desideratum shouldn't be "must have replicators" but "must explain high-fidelity transmission."
      *   *Lamarckian:* The key is that Darwinian algorithms work *even if* variation is biased, provided there is still differential retention based on consequences (or proxy consequences).
      *   *Adaptationism:* Need to distinguish "adaptive for individuals," "adaptive for groups," or "selfish meme."

  4.  **Analyzing Tensions (Hardest Pair & Most Exclusionary):**

      *   *Hardest Pair:* High-fidelity transmission (Replicator) vs. Reconstructive/Transformative transmission (Attractor). It's hard to explain how reconstruction yields stability *and* how stability allows for the flexibility needed for cumulative culture without positing a rigid replicator. Actually, a better tension is **Cumulative Culture vs. Biological Consistency**. Cumulative culture implies open-endedness; biological consistency implies cognitive constraints. How do constrained brains produce open-ended culture?
      *   *Most Exclusionary:* **Cumulative Culture.** Many theories explain stability (traditions) or bias (epidemiology), but few rigorously model the *ratchet* where complexity increases beyond individual cognitive capacity.

  5.  **Drafting the Scorecard:**

