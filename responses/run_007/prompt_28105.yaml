          *   *Motivation:* Evolution requires retention of information over time. Without stability, no selection.
          *   *Status:* Non-negotiable (but the *mechanism* of stability is debated).
          *   *Nuance:* Don't demand "genes," demand "high-enough fidelity for selection to act."

      *   *Requirement 2: Variation & Selection Mechanisms.* (Addresses Lamarckian Challenge).
          *   *Motivation:* Darwinism needs variation and differential retention. Lamarckism (directed variation) changes the *source* of variation, not the logic of selection.
          *   *Status:* Non-negotiable (must account for directed variation without collapsing into pure intentionalism).

      *   *Requirement 3: Explanation of Cumulative Complexity.* (Addresses Cumulative Culture).
          *   *Motivation:* This is the "smoking gun" of cultural evolution. Why do we have smartphones and chimps don't?
          *   *Status:* Non-negotiable.

      *   *Requirement 4: Micro-Macro Linkage.* (Addresses Micro-Macro Mapping).
          *   *Motivation:* Culture isn't magic; it's implemented in minds and interactions.
