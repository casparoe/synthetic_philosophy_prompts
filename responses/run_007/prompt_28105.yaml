answer: |-
  Here is a set of desiderata for an adequate Darwinian theory of cultural evolution, structured to address your specific concerns while establishing general criteria for theoretical adequacy.

  ### Desiderata for a Darwinian Theory of Cultural Evolution

  #### 1. The Fidelity-Stability Requirement (The Replicator Problem)
  **Requirement:** The theory must explain how cultural information maintains sufficient stability over time and across transmission events to allow for differential retention (selection) to act, without necessarily positing a discrete, gene-like "replicator."
  **Motivation:** Evolution by selection requires that variants persist long enough for their frequency to change due to their properties. If transmission is purely reconstructive with high noise, lineages dissolve, and selection cannot accumulate changes. However, demanding a physical or discrete informational unit (a "meme" analogous to a gene) may impose biological constraints that do not fit cognitive reality.
  **Status:** **Non-negotiable** (Stability is required); **Preference** (Discrete replicators are a specific mechanistic hypothesis, not a logical necessity).
  **Addressing Concern #1:** The existence of a *cultural replicator* is not a genuine desideratum; it is a prejudice of the Memetic research program. The genuine desideratum is **transmission fidelity**. A theory must specify the mechanism of fidelity (e.g., copying errors, reconstructive attractors, institutional enforcement). If a theory claims reconstruction is the norm, it must demonstrate how attractor basins are narrow enough to preserve lineage identity over generations.

  #### 2. The Variation-Source Requirement (The Lamarckian Challenge)
  **Requirement:** The theory must accommodate "directed variation" (intentional innovation, problem-solving) without collapsing into a theory of pure rational choice or intentional design. It must show how differential retention operates *downstream* of variation, even if variation is biased.
  **Motivation:** In biology, variation is typically blind relative to fitness. In culture, agents often modify traits *to* improve fitness (Lamarckism). If all change is intentional optimization, evolution is unnecessary; rational choice theory suffices. A Darwinian theory must show that despite intentional tweaking, outcomes are still subject to population-level filters (drift, bias, ecological fit) that no individual intends.
  **Status:** **Non-negotiable.**
  **Addressing Concern #2:** This is non-negotiable. The theory does not need to deny Lamarckian inheritance; it needs to subsume it. The requirement is that the theory distinguishes between *individual learning* (within lifetime) and *cultural evolution* (population level). Even if variation is directed, if the spread of that variation depends on social transmission biases (prestige, conformity) rather than solely on its functional efficacy, evolutionary dynamics apply.

  #### 3. The Cumulative Complexity Requirement (The Ratchet Effect)
  **Requirement:** The theory must explain how cultural traits can increase in complexity and functionality over generations beyond the cognitive capacity of any single individual to invent or understand de novo.
  **Motivation:** This is the distinctively human phenomenon. Tool technologies, institutions, and languages exhibit design complexity that exceeds individual engineering. A theory that explains stability (traditions) but not complexity growth (progress/ratcheting) fails to explain the human niche.
  **Status:** **Non-negotiable.**
  **Addressing Concern #4:** Adequate explanation requires more than stating "copying happens." It must identify the specific feedback loops (e.g., prestige bias favoring complex skills, institutional scaffolding) that prevent the degradation of complex information. It must explain why the "ratchet" doesn't slip back due to reconstruction errors or loss of utility.

  #### 4. The Micro-Macro Linkage Requirement
  **Requirement:** The theory must provide a plausible, empirically supported mechanism linking individual cognitive processes (learning biases, memory constraints) to population-level statistical patterns (distributions, trends, equilibria).
  **Motivation:** Culture is not a force floating above humans; it is implemented in human minds and interactions. A theory that posits population laws without cognitive grounding is black-box sociology. Conversely, a theory of cognition that doesn't scale to population patterns is psychology, not cultural evolution.
  **Status:** **Non-negotiable.**
  **Addressing Concern #5:** It is **not** enough to show that biases *could* produce patterns under *some* parameter values (existence proofs). The theory must demonstrate that the required parameter values are psychologically realistic and that the predicted patterns match historical or ethnographic data. Quantitative prediction is preferred, but qualitative robustness is the minimum.

  #### 5. The Adaptation-Distinction Requirement
  **Requirement:** The theory must provide criteria for distinguishing between traits that are adaptations (selected for functional benefits), exaptations (co-opted traits), drift (random fluctuations), and parasitic traits (spread despite harming the host).
  **Motivation:** Adaptationism is a sin in biology if unchecked; it is equally dangerous in culture. Not all widespread traits are useful (e.g., smoking, viral conspiracy theories). A theory that assumes all stable culture is adaptive fails to explain maladaptive epidemics.
  **Status:** **Non-negotiable.**
  **Addressing Concern #3:** The theory must allow for **multi-level selection analysis**. It must distinguish between traits adaptive for the *individual* (learning a skill), the *group* (norms enforcing cooperation), or the *trait itself* (self-replicating memes that harm hosts). It must also account for frequency-dependent equilibria where a trait is stable not because it is "good," but because it is common.

  #### 6. The Biological Consistency Requirement
  **Requirement:** The theory must be consistent with established facts about human cognitive evolution and genetics, and ideally model the feedback loops between cultural and biological change.
  **Motivation:** Humans are biological organisms. Our capacity for culture is a product of biological evolution. A theory of culture that requires cognitive capacities we did not evolve (e.g., perfect copying) is false.
  **Status:** **Non-negotiable** (Consistency); **Preference** (Integrated Co-evolutionary Dynamics).
  **Addressing Concern #6:** Mere consistency (not contradicting biology) is the non-negotiable floor. However, strong **Gene-Culture Co-evolution** is a preference. While a theory *could* treat the brain as a static background, the most adequate theory will acknowledge that cultural pressures (e.g., dairy farming) alter biological selection pressures (lactase persistence), and vice versa.

  ---

  ### Analysis of Tensions and Exclusion

  #### Which pair of desiderata is hardest to satisfy jointly?
  **The Fidelity-Stability Requirement (#1) and The Biological Consistency Requirement (#6).**

  *   **The Tension:** To get cumulative culture (#3) and stability (#1), you need high-fidelity transmission. In biology, high fidelity is achieved via digital replication (DNA). In human cognition (biological consistency), transmission is reconstructive, noisy, and transformative (we remember gist, not data).
  *   **The Conflict:** Memetics solves #1 by positing gene-like replicators but often violates #6 (human memory doesn't work like DNA). Cultural Attractor Theory respects #6 (reconstructive memory) but struggles to explain how reconstruction yields the high fidelity required for #1 and #3 over long timeframes without positing mysterious "attractors." Reconciling noisy biological reconstruction with high-fidelity cultural stability is the central technical hurdle.

  #### Which single requirement excludes the largest number of candidate theories?
  **The Cumulative Complexity Requirement (#3).**

  *   **Reasoning:** Many theories can explain the spread of fads, the stability of simple traditions, or the impact of cognitive biases on belief formation. However, very few theories offer a rigorous, mechanistic account of the **ratchet effect**.
  *   **Exclusions:**
      *   Pure **Rational Choice** models fail here because they cannot explain complexity beyond individual design.
      *   Simple **Contagion/Epidemiological** models often fail because they treat traits as viruses that spread, not as building blocks that accumulate complexity.
      *   Some versions of **Cultural Attractor Theory** struggle here, as attractors often explain why culture converges on stable *simples* (universals) rather than accumulating complex *historicals*.
      *   Only theories that explicitly model **iterated learning** and **scaffolding** (like certain strands of Dual-Inheritance Theory) currently meet this bar robustly.

  ---

  ### Brief Scorecard of Main Frameworks

  | Framework | Fidelity/Stability (#1) | Lamarckian/variation (#2) | Cumulative Culture (#3) | Micro-Macro (#4) | Adaptation Distinction (#5) | Bio Consistency (#6) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Memetics** | **Strong** (Posits replicators) | Weak (Often treats variation as blind mutation) | Moderate (Relies on replicator fidelity) | Weak (Often ignores cognitive mechanism) | Moderate (Allows parasitic memes) | **Weak** (Often biologically implausible copying) |
  | **Dual-Inheritance (DIT)** | Moderate (Population equations) | **Strong** (Models biased transmission) | **Strong** (Explicit models of ratcheting) | Moderate (Good pop, vague psych) | **Strong** (Multi-level selection) | **Strong** (Explicit co-evolution) |
  | **Cultural Attractor (CAT)** | Weak (Reconstruction implies noise) | **Strong** (Transformation is central) | Weak (Focuses on convergence, not accumulation) | **Strong** (Grounded in cognitive psych) | Moderate (Focus on cognitive fit) | **Strong** (Ecological/ Cognitive fit) |
  | **Cultural Epidemiology** | Weak (Similar to CAT) | **Strong** (Focus on cognitive uptake) | Weak | **Strong** | Moderate | **Strong** |

  ---

  ### Confidence Assessment

  **Overall Confidence:** High.
  The list is derived from the consensus literature in evolutionary anthropology, philosophy of biology, and cultural evolution theory (e.g., works by Boyd, Richerson, Henrich, Sperber, Godfrey-Smith, and Lewens). The tensions identified (specifically Fidelity vs. Reconstruction) represent the current frontier of debate in the field.

  **Least Sure Point:**
  I am least certain about the specific threshold for **The Cumulative Complexity Requirement (#3)**.
  *   **Uncertainty:** There is ongoing debate about whether "cumulative culture" is a binary switch (humans have it, chimps don't) or a gradient. Some recent primatology suggests limited cumulative effects in non-humans. Furthermore, some theories argue that what looks like cumulative *design* is actually cumulative *selection* on simple elements, which changes the explanatory burden. If the definition of "cumulative culture" shifts from "complexity beyond individual capacity" to "modifications over time," the desideratum becomes easier to satisfy but less explanatory of human uniqueness. I have stuck to the stronger definition (complexity beyond individual capacity) as it is the more rigorous test for a theory of *human* cultural evolution.
