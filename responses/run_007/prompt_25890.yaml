answer: |-
  # Seminar Handout: Mapping the Logical Space of Peer Disagreement

  **Course:** Epistemology Seminar (Upper-Level)  
  **Topic:** The Epistemology of Disagreement  
  **Instructions:** Use this decision tree to locate your intuitive response to peer disagreement within the current philosophical landscape. Answer the questions based on the **Math Proof Scenario** provided. Do not worry about matching a specific philosopher yet; follow your epistemic intuitions.

  ### The Core Scenario (The Math Proof)
  > You have just worked through a complex mathematical proof. You have checked it carefully and are 95% confident in your conclusion ($C$). You then learn that a colleague, whom you regard as an **epistemic peer** (same training, same access to axioms, same level of diligence), has worked through the same proof and is 95% confident in $\text{not-}C$.

  ---

  ### The Decision Tree

  **Q1. The Immediate Reaction (The "Independence" Intuition)**
  Upon learning of your peer's dissent, *before* you re-examine the proof or their work, are you rationally required to significantly lower your confidence in $C$?
  *   **YES:** Go to **Q2**. (Conciliationist Branch)
  *   **NO:** Go to **Q4**. (Steadfast/Total Evidence Branch)

  **Q2. The Degree of Revision**
  If you must lower your confidence, are you required to reduce it to the point of **suspension of judgment** (i.e., treating $C$ and $\text{not-}C$ as equally likely), or merely to **lower it somewhat** (e.g., from 95% to 70%)?
  *   **Suspend Judgment:** Go to **Q3**.
  *   **Lower Somewhat:** $\rightarrow$ **Leaf A: Moderate Conciliationism**

  **Q3. The Symmetry Requirement**
  In a persistent stalemate (where neither of you can find a specific error in the other's reasoning), must you treat your peer's conclusion as carrying *exactly* the same weight as your own, regardless of the specific content of your reasoning?
  *   **YES (Exact Symmetry):** $\rightarrow$ **Leaf B: Equal Weight View**
  *   **NO (Asymmetric Weight):** $\rightarrow$ **Leaf C: Asymmetric Conciliationism** *(Unoccupied Region)*

  **Q4. The Re-Evaluation (The "Right Reasons" Intuition)**
  Suppose you re-examine the proof carefully and find no error in your own reasoning. Can you legitimately return to your original high confidence (95%) solely on the basis that your reasoning appears sound to you?
  *   **YES:** Go to **Q5**.
  *   **NO:** $\rightarrow$ **Leaf D: Total Evidence View**

  **Q5. The Status of the Disagreement**
  If you return to high confidence because your reasoning is sound, does the peer's disagreement cease to be evidence against you entirely, or does it remain evidence that is simply outweighed?
  *   **Ceases to be Evidence (Silenced):** $\rightarrow$ **Leaf E: Right Reasons View**
  *   **Remains Evidence (Outweighed/Defeated):** Go to **Q6**.

  **Q6. The Defeater Question**
  If the disagreement remains evidence against you, can your strong first-order evidence (the clarity of the proof) *defeat* the higher-order evidence (the fact of disagreement), rendering it rationally inert?
  *   **YES (First-Order Defeats Higher-Order):** $\rightarrow$ **Leaf F: Defeasible Higher-Order View**
  *   **NO (Higher-Order is Resilient):** $\rightarrow$ **Leaf G: Resilient Conciliationism** *(Unoccupied Region)*

  **Q7. The Dogmatist Check (Alternative Path from Q1)**
  *(If you answered NO to Q1 because you think peer disagreement never requires revision)*
  Do you maintain your original confidence regardless of how many peers disagree with you, provided you see no error in your own work?
  *   **YES:** $\rightarrow$ **Leaf H: Epistemic Egoism** *(Unoccupied Region)*
  *   **NO:** (Return to Q4).

  ---

  ### The Leaves: Positions in the Logical Space

  | Leaf | Position Name | Core Commitment | Key Proponent |
  | :--- | :--- | :--- | :--- |
  | **A** | **Moderate Conciliationism** | Peer disagreement requires a reduction in confidence, but not necessarily to the point of suspension. | Christensen (2007) |
  | **B** | **Equal Weight View** | In cases of peer disagreement, one must give equal weight to the peer's opinion and one's own, typically leading to suspension. | Elga (2007) |
  | **C** | **Asymmetric Conciliationism** | *Diagnosis:* **Unoccupied/Incoherent.** This view requires revision but denies symmetry; it is generally rejected because it violates the definition of "peer" (if they are truly peers, why is their weight lower?). | N/A |
  | **D** | **Total Evidence View** | One should weigh the first-order evidence (the proof) and the higher-order evidence (the disagreement) together; sometimes the total supports staying steadfast. | Kelly (2005) |
  | **E** | **Right Reasons View** | If you have correctly assessed the first-order evidence, the peer's disagreement provides no additional reason to revise, as they are by definition mistaken. | Lackey (2010) |
  | **F** | **Defeasible Higher-Order View** | Disagreement provides higher-order evidence, but this evidence can be defeated by sufficiently strong first-order evidence. | Sliwa & Horowitz (2015) |
  | **G** | **Resilient Conciliationism** | *Diagnosis:* **Unexplored/Unattractive.** This view holds that disagreement is evidence that cannot be defeated by first-order clarity; it leads to skepticism in hard cases and is rarely defended explicitly. | N/A |
  | **H** | **Epistemic Egoism** | *Diagnosis:* **Unattractive.** This view holds that one should never revise on the basis of disagreement alone; it is typically rejected as dogmatic and incompatible with the fallibilism required for peerhood. | N/A |

  ---

  ### Important Overlaps and Collapses

  **1. The Total Evidence vs. Defeasible Higher-Order Collapse**
  You may notice that **Leaf D (Total Evidence View)** and **Leaf F (Defeasible Higher-Order View)** are difficult to distinguish in practice. Both allow you to remain steadfast if your first-order evidence is strong enough.
  *   **Why they overlap:** Both views agree that first-order evidence can neutralize the force of disagreement.
  *   **The Distinction:** Theoretically, **TEV** treats disagreement as just another piece of evidence in the "total pot," whereas the **Defeasible View** treats disagreement as a specific *higher-order defeater* that can be *defeated* by first-order evidence. In the logical space of this tree, they occupy adjacent regions that often yield the same verdict.

  **2. The Equal Weight vs. Moderate Conciliationism Gradient**
  **Leaf B (EWV)** and **Leaf A (Moderate Conciliationism)** are both conciliationist.
  *   **Why they overlap:** Both require revision upon learning of disagreement.
  *   **The Distinction:** The tree separates them based on the *degree* of revision (Suspension vs. Lowering). However, some proponents of EWV argue that "equal weight" doesn't *always* mean 50/50 suspension if prior probabilities differ, which can blur the line with Moderate Conciliationism.

  ---

  ### Structural Limitations of This Map

  **1. The Definition of "Peer"**
  This tree treats "epistemic peerhood" as a fixed input (as defined in the Scenario). However, a significant portion of the debate (e.g., **Kelly 2010**) turns on *how* we identify peers. Some views argue you cannot know someone is a peer *until* you have assessed the evidence, which would collapse the "Conciliationist" branch (Q1) into the "Steadfast" branch, as you couldn't answer Q1 without already answering Q4.

  **2. Content-Specific Distinctions**
  This tree assumes a uniform response to disagreement. It does not capture **Contextualist** or **Domain-Specific** views (e.g., views that require conciliation in politics but not in mathematics). A student who answers "Yes" to Q1 for moral cases but "No" for math cases has no single leaf in this tree.

  **3. The Nature of Justification**
  The tree focuses on *confidence levels* (credences). It does not distinguish between views that focus on *belief* (binary) versus *credence* (graded). Some versions of the Right Reasons View apply only to binary belief, allowing credence to shift, which this tree does not explicitly separate.
