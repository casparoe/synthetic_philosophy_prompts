      *   *The Counter:* The Self-Indication Assumption (SIA). You should reason as if you are a random sample from the set of *possible* observers. Worlds with more observers are more likely to contain *you*. This cancels the DA effect.
      *   *The Stalemate:* SSA proponents (like John Leslie, Richard Gott) think SIA leads to absurdities (e.g., the Presumptuous Philosopher). SIA proponents (like Nick Bostrom, though he tries to navigate a middle ground with SSA+SIA in specific frameworks, or Ken Olum) think SSA leads to unacceptable doom-mongering or solipsistic implications.
