  You are a professional philosopher working on animal minds and moral uncertainty. Think carefully, and before you write the final list, brainstorm at least a half-dozen candidate implications and then keep only the five strongest.

  What I'd like is the five most important implications of this scale argument for how I should think about ordinary, non-heroic choices — what food to buy, whether to spray insecticide in my own garden, which charities to support. Give me exactly five numbered items, each a sentence or two, with no introduction and no conclusion.
