answer: |-
  In a climate-controlled studio in Chelsea, master copyist Elena Vance spends six months creating two replicas of Edward Hopper's *Nighthawks*, using the same pigments, canvases, and brushes to ensure both are perceptually indistinguishable from the original and from each other. The first canvas is chemically aged, signed with Hopper's name, and consigned to an auction house with fabricated provenance intended to pass it off as the lost 1942 original; the second is signed "Vance," labeled "Study after Hopper," and displayed in her gallery as an exercise in technical homage. To the naked eye and under spectral analysis, the brushwork, color saturation, and texture of the deceptive forgery and the open study are identical, yet the intent governing the application of every stroke differs solely in its aim to mislead regarding authorship.

  **The Verdicts**

  For the **aesthetic empiricist**, aesthetic value is exhausted by the object's perceivable properties—its lines, colors, and composition—and the sensory experience they afford. Because the forgery and the study are perceptually identical, they offer the exact same potential for aesthetic experience to any viewer. The history of the object's production is external to the object itself; therefore, the empiricist must conclude that the two copies possess exactly equal aesthetic value. To claim otherwise would be to value something outside the aesthetic realm, such as morality or rarity.

  For the **origin-sensitive, achievement-based view**, aesthetic value is partly constituted by the nature of the artistic achievement involved in the work's creation. Art is understood as a communicative act between maker and viewer, grounded in a specific history of intention. The open study represents an achievement of technical mastery and honest interpretation; the artist successfully communicates her skill and her relationship to the source material. The forgery, however, represents an achievement of erasure and deception; the artist successfully hides her own agency to mimic another's. Because the deceptive copy corrupts the communicative contract essential to art—presenting itself as an expression of Hopper when it is an expression of Vance—it constitutes a lesser artistic achievement. Consequently, this view assigns the deceptive copy lower aesthetic value than the open study, as the deception is a defect in the work's status as a genuine aesthetic object, not merely a moral failing.

  **The Working Feature**

  The feature doing the work here is the **artist's intention regarding authorship**, specifically the transparency of the creative act. The empiricist treats this as irrelevant context, while the achievement theorist treats it as constitutive of the work's identity. If you remove this feature—if you imagine a scenario where the intention to deceive is absent from both, or where intention is deemed irrelevant to the work's history—the case collapses back into the familiar "perfect copy" problem. Without the variable of deception, the two objects become historically and physically identical, and the debate reverts to the standard standoff between the Original and the Copy, rather than distinguishing between two types of copies.

  **The Strongest Empiricist Reply**

  The strongest reply an aesthetic empiricist can offer is the **Argument from the Ideal Observer**. They would argue that if aesthetic value is truly about the capacity of an object to reward attention, then a difference in value must manifest as a difference in experience. If we imagine an ideal critic who is fully informed about the history of both paintings yet views them in isolation, their *aesthetic experience* of the brushwork remains identical in both cases. To claim the forgery is aesthetically worse is to conflate aesthetic value with ethical judgment; the deception may make the *artist* worse, or the *transaction* immoral, but it does not change the beauty of the stroke. If the deception is undetectable even to the informed expert, then the "defect" exists nowhere in the aesthetic encounter, and therefore cannot be an aesthetic defect.
