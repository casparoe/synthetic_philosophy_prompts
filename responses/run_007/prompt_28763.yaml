answer: |-
  To: Feature Editor
  From: Moral Philosophy Desk
  Re: Specification for a Theory of Standing in Public Argument

  You have asked for the specification before the position. This is the correct methodological move. In the literature on blame, we often rush to solve the problem (e.g., "Standing is just about relationships") before we agree on what the problem *is*. In the context of public moral argument—where blame is not just a private sanction but a speech act with political and social consequences—the stakes for getting the criteria right are higher.

  Below is the work we need to do before evaluating specific theories. I have broken this into two phases: first, a brainstorming map of the raw intuitions and cases we need to capture; second, the pruned list of formal desiderata that any adequate theory must satisfy.

  ### Phase 1: Brainstorming the Landscape
  *Raw materials, candidate requirements, and intuitive pressure points.*

  Before we can prune, we must acknowledge the full range of phenomena. A theory of standing is a theory of **entitlement**, not truth. It answers "Who are *you* to say that?" not "Is *that* true?"

  **1. The Case Map (Who is blaming whom?)**
  *   **The Hypocrite:** Condemns smoking while smoking. *Intuition:* They lack standing. *Candidate Req:* Consistency between conduct and criticism.
  *   **The Complicit Party:** Didn't smoke, but sold the cigarettes or lobbied against regulation. *Intuition:* Diminished or null standing. *Candidate Req:* Non-participation in the structural wrong.
  *   **The Wholly Uninvolved Third Party:** A foreign observer criticizing domestic policy. *Intuition:* Mixed. Sometimes "meddling," sometimes "solidarity." *Candidate Req:* Universal moral concern vs. local jurisdiction.
  *   **The Victim:** The person harmed by the smoking (second-hand smoke). *Intuition:* High standing, even if they drink too much alcohol (unrelated vice). *Candidate Req:* Standing derives from harm suffered, not moral perfection.
  *   **The Repentant Wrongdoer:** Smoked, quit, apologized. Now criticizes smokers. *Intuition:* Standing restored? *Candidate Req:* Possibility of rehabilitation.

  **2. The Distinction Map (What are we measuring?)**
  *   **Warrant vs. Entitlement:** The blame can be *true* (the act was wrong) but the blamer *unentitled* to voice it.
  *   **Standing vs. Manner:** A blamer can have standing but exercise it poorly (too harshly, publicly shaming when private correction was needed). We must not conflate "you can't say this" with "you shouldn't say it *that way*."
  *   **Record vs. Relationship:** Does standing come from my own moral ledger (Clean Hands) or my connection to the event/agent (Relationship/Authority)?

  **3. The Public Context Constraint**
  *   Unlike private blame, public blame functions as **norm articulation**. It tells the community what the rules are. Therefore, a theory of standing must explain not just interpersonal rights, but **discursive authority**. If we silence all imperfect people, public morality dies. If we allow everyone to speak, noise drowns out signal.

  ---

  ### Phase 2: The Pruned Desiderata
  *The formal requirements for an adequate theory.*

  I have distilled the brainstorming above into six core requirements. I have marked each as **Non-Negotiable (NN)**—meaning a theory failing this is fundamentally defective for our purposes—or **Camp Preference (CP)**—meaning reasonable philosophers disagree, and the theory must at least acknowledge the trade-off.

  **1. The Separation Condition**
  *   **Requirement:** The theory must strictly distinguish the *warrant* of the blame (was the act wrong?) from the *standing* of the blamer (are they entitled to voice it?).
  *   **Motivating Case:** The Hypocrite. When we say "You're a hypocrite," we usually concede the act was wrong but deny the blamer's right to judge.
  *   **Status:** **NN**. Without this, the concept of standing collapses into general moral truth.

  **2. The Victim's Immunity**
  *   **Requirement:** The theory must explain why a victim retains standing to blame their violator even if the victim is morally imperfect in other respects.
  *   **Motivating Case:** The Victim. A spouse cheated on retains standing to blame the cheater, even if the spouse is sometimes rude to waiters.
  *   **Status:** **NN**. Any theory that strips victims of standing due to general moral imperfection is morally untenable in public discourse.

  **3. The Relevance Constraint**
  *   **Requirement:** The theory must specify *which* inconsistencies undermine standing. Not all wrongdoing removes standing; only wrongdoing relevantly similar to the target of blame (or structurally connected to it).
  *   **Motivating Case:** The Hypocrite vs. The Victim. This solves the tension between Req 1 and Req 2. It explains why the hypocrite loses standing (relevant similarity) while the rude victim does not (irrelevant imperfection).
  *   **Status:** **NN**. Without this, we fall into the trap where only sinners can blame sinners, or no one can blame anyone.

  **4. The Complicity Threshold**
  *   **Requirement:** The theory must account for the intuition that benefiting from or enabling a wrong diminishes standing to condemn that wrong, even without direct perpetration.
  *   **Motivating Case:** The Complicit Party. The corporate lobbyist cannot easily condemn the corruption they funded.
  *   **Status:** **CP**. "Clean Hands" advocates say this removes standing entirely. "Relationship" advocates say it merely weakens the force of the blame. An adequate theory must take a position, but the *requirement* is merely to address it explicitly.

  **5. The Anti-Meddling Clause**
  *   **Requirement:** The theory must provide a basis for third parties to intervene in injustice without licensing moral meddling in permissible but unpopular conduct.
  *   **Motivating Case:** The Wholly Uninvolved Third Party. We want standing for human rights observers; we do not want standing for busybodies criticizing lifestyle choices.
  *   **Status:** **NN**. In public argument, this distinguishes political critique from harassment.

  **6. The Rehabilitation Possibility**
  *   **Requirement:** The theory must determine if and how standing can be regained after loss.
  *   **Motivating Case:** The Repentant Wrongdoer. Can the reformed smoker criticize smoking?
  *   **Status:** **CP**. Some accounts view standing as permanently stained (stigma); others view it as functional (restored via repentance). The theory must choose, but must not ignore the possibility.

  ---

  ### Phase 3: Tensions and Incompatibilities

  You asked me to flag where the requirements might fight each other. There is one major fault line.

  **The Tension: The Victim's Immunity vs. The Clean Hands Intuition**
  There is a genuine risk that **Requirement 3 (Relevance)** and **Requirement 4 (Complicity)** cannot be jointly satisfied with a strict "Clean Hands" metric.
  *   If standing requires "Clean Hands" regarding the specific wrong (to handle the Hypocrite), we risk catching the Victim in the net. (e.g., A victim who previously consented to a lesser version of the harm, or who benefited from the system that produced the harm).
  *   If standing requires only "Relationship" (to protect the Victim), we risk granting standing to the Hypocrite (who has a relationship to the norm they are violating).
  *   **The Philosophical Task:** The theory must explain *why* the victim's involvement differs in kind from the hypocrite's involvement, despite both having "dirty hands" relative to the norm.

  ### Phase 4: The Exclusionary Requirement

  If I had to identify the single requirement that does the most to exclude otherwise attractive accounts, it is **Requirement 2: The Victim's Immunity.**

  **Why?**
  The most intellectually tidy theory of standing is the **"Clean Hands" Account** (you must be innocent of the specific wrong to blame it). It handles the Hypocrite perfectly. It handles the Complicit Party perfectly. It is simple and elegant.
  *However*, it fails Requirement 2. In the real world, victims are rarely morally perfect. They may have lied, cheated, or enabled other harms. A strict Clean Hands theory would silence victims whenever they are imperfect, which is morally abhorrent and practically paralyzing for public discourse. Any theory that cannot protect the victim's right to speak despite their own moral record is inadmissible for this feature.

  ### Phase 5: Scorecard of Main Views

  Here is how the leading contenders stack up against your needs for a public argument feature:

  | View | Core Mechanism | Strengths | Weaknesses (Relative to Desiderata) |
  | :--- | :--- | :--- | :--- |
  | **Standing as Victim's Exclusive Right** | Only the harmed party has standing. | Protects victims; avoids meddling. | Fails **Anti-Meddling Clause** (silences allies/third parties in systemic injustice). Makes morality purely private. |
  | **Standing as Blamer's Record (Clean Hands)** | Only the morally innocent have standing. | Handles Hypocrites & Complicity well. | Fails **Victim's Immunity**. Silences imperfect victims. Leads to moral silence in public sphere. |
  | **Standing as Relationship (Communicative)** | Standing depends on the normative relationship between blamer, blamed, and community. | Nuanced; handles Third Parties & Repentance well. | Vague boundaries. Can struggle to explain the visceral force of the **Hypocrite** objection without borrowing from Clean Hands. |

  **Recommendation for the Feature:**
  Focus on the tension between **Record** and **Relationship**. The most robust theories for public argument are currently hybrid views: they ground standing in a shared commitment to norms (Relationship) but argue that hypocrisy severs the communicative link necessary to enforce those norms. This protects the Victim (who is committed to the norm despite failure) while checking the Hypocrite (who rejects the norm by violating it).

  Let me know if you wish to proceed to the position phase, where I would argue for a specific hybrid account.
