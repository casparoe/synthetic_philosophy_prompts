answer: |-
  The plate tectonics revolution is often cited as the quintessential Kuhnian paradigm shift, but a close examination reveals it fits the *structure* of Kuhn's model better than the *sociology*. To map this carefully, we must move beyond the "Wegener was right, everyone else was wrong" narrative and look at the epistemic ecosystem of mid-20th-century Earth science.

  ### 1. The Pre-Revolutionary Normal Science: The Fixist Paradigm

  Before the 1960s, the relevant scientific community was not a monolith. It was bifurcated into **descriptive geologists** (fieldworkers, stratigraphers, paleontologists) and **geophysicists** (physicists studying Earth's gravity, magnetism, and seismology).

  **Normal Science Problems:**
  For the descriptive geologists, the dominant paradigm was **Permanentism** (or Fixism), operationalized through **Geosynclinal Theory**.
  *   **The Commitment:** Continents (sial) and ocean basins (sima) were permanent, fixed features. Vertical motion (uplift/subsidence) was possible; horizontal motion was not.
  *   **The Puzzle:** How do mountains form? The answer was the geosyncline: a trough where sediment accumulated, sank under weight, was compressed, heated, and uplifted *in situ*.
  *   **The Puzzle:** How do you explain identical fossils on separated continents? The answer was **Land Bridges** (now submerged) or **Isthmian Links**.

  **Why Drift Seemed Absurd:**
  Wegener's continental drift (1912) was not rejected because of bias, but because it violated the background commitments of the *geophysicists*, who held the prestige of "hard physics."
  *   **The Mechanism Problem:** Wegener proposed tidal forces and pole fleeing. Geophysicists (led by Harold Jeffreys) calculated the viscosity of the mantle. It was too rigid for continents to plow through oceanic crust without shattering.
  *   **The Energy Problem:** There was no known energy source sufficient to move continents.
  *   **The Professional Boundary:** Wegener was a meteorologist. To geologists, he was an outsider ignoring stratigraphic nuance; to geophysicists, he was violating laws of mechanics.

  In Kuhnian terms, drift was not an anomaly; it was a *failed hypothesis*. The data supporting it (fossil matches, continental fit) were treated as **puzzles** solvable within the Fixist paradigm via land bridges.

  ### 2. Anomalies vs. Puzzles: Why the Crisis Was Delayed

  Kuhn distinguishes between a puzzle (a problem the paradigm expects to solve) and an anomaly (a violation of paradigm expectations that resists solution). In the drift debate, the classification of data shifted over decades.

  *   **The Continental Fit:** Known since Bacon (1620). Not an anomaly. It was a curiosity, easily dismissed as coincidence because the mechanism was impossible.
  *   **Paleoclimate Data:** Evidence of glaciation in tropical regions (India, Africa). Fixists explained this via **True Polar Wander** (the whole Earth tilted) or global climate change. This preserved the "fixed continent" commitment. It remained a puzzle, not an anomaly.
  *   **Paleomagnetism (The True Anomaly):** In the 1950s, Keith Runcorn and others measured remnant magnetism in rocks. The data indicated that the magnetic pole had wandered wildly over time.
      *   *Fixist Interpretation:* The pole moved (True Polar Wander).
      *   *Mobilist Interpretation:* The continent moved.
      *   *Why it became a Crisis:* Initially, the data was noisy. Different labs got different results. It was only when measurement techniques standardized (mid-1950s) that the "Polar Wander Paths" for different continents diverged. If the pole is one, it cannot wander two paths. This was a logical contradiction within the Fixist paradigm. It turned a puzzle into an anomaly.

  *   **Mid-Ocean Ridges & Heat Flow:** High heat flow at ridges was known in the 1950s. Fixists interpreted this as local volcanism. It did not trigger a crisis because it could be accommodated: "The crust is thin here, so heat escapes." It only became an anomaly when linked to **Seafloor Spreading** (Hess, 1962).

  *   **Vine-Matthews-Morley Stripes (1963):** This was the coup de grâce. The magnetic stripes on the seafloor were symmetric around ridges.
      *   *Why this broke the dam:* It provided a *mechanism* (convection/spreading) and a *record* (paleomagnetism) simultaneously. It rendered the "Land Bridge" hypothesis physically impossible (oceanic crust was too young to have ever supported bridges).

  **Why the delay?** Anomalies only produce crisis when they are *precise* and *unavoidable*. Paleomagnetic data was too messy in the 1930s-40s to force a crisis. It required new instrumentation (sensitive magnetometers) to turn vague noise into a sharp contradiction.

  ### 3. Incommensurability: Ontology vs. Semantics

  Kuhn argues that competing paradigms are incommensurable—proponents practice their trades in different worlds and mean different things by their terms.

  **Did terms change meaning?**
  *   **"Continent":**
      *   *Fixist:* A permanent block of sialic rock.
      *   *Mobilist:* A passive passenger embedded in a lithospheric plate, which can split, merge, or rotate.
  *   **"Geosyncline":**
      *   *Fixist:* A sinking trough within a continent.
      *   *Mobilist:* A convergent plate margin (subduction zone).
  *   **"Crust":**
      *   *Fixist:* Divided chemically (Sial vs. Sima).
      *   *Mobilist:* Divided mechanically (Lithosphere vs. Asthenosphere).

  **Honest Assessment:**
  Was this *true* incommensurability? Largely, no. The disagreement was not that they couldn't understand each other's sentences; it was that they disagreed on the **weight of evidence**.
  *   When a Fixist said "Land Bridge," they meant a physical connection that sank. When a Mobilist said "Impossible," they meant "Oceanic crust is basaltic and too young."
  *   They were arguing about the same objects, but the Mobilists had re-categorized the *properties* of those objects based on new data (age of seafloor).
  *   The "incommensurability" was mostly professional: Geologists spoke in stratigraphy; Geophysicists spoke in vectors. The revolution occurred when geophysicists took over the explanatory power of geology. It was a shift in **authority**, not just language.

  ### 4. Where Kuhn's Model Strains

  The plate tectonics episode exposes three specific tensions in Kuhn's *Structure*.

  **A. The Speed of the Shift (Crisis vs. Payoff)**
  Kuhn implies a prolonged period of crisis where confidence erodes. The plate tectonics shift was explosive. Between 1965 (Vine-Matthews confirmation) and 1968 (Le Pichon's global plate model), the field flipped.
  *   *Kuhnian Expectation:* Resistance, desperation, ad-hoc modifications.
  *   *Reality:* Once the seafloor spreading mechanism was linked to magnetic stripes, resistance collapsed.
  *   *Implication:* This looks less like a "crisis of faith" and more like **normal science paying off**. The new paradigm solved puzzles (location of earthquakes, age of seafloor, mountain building) that the old one struggled with. It was a decisive empirical victory, not a gestalt switch born of despair.

  **B. The Generational Die-Off**
  Kuhn famously suggests science advances "one funeral at a time" (Planck's Principle).
  *   *Reality:* While some older giants (like Harold Jeffreys) never accepted drift, many senior scientists converted rapidly. Harry Hess and Robert Dietz were older geologists who proposed seafloor spreading. Tuzo Wilson was mid-career.
  *   *Conversion:* The conversion was not purely sociological. The data (magnetic stripes) was visually compelling. A geologist could look at a map of the Atlantic stripes and "see" the spreading. It didn't require a new generation to be socialized; it required the old generation to look at new maps.

  **C. One Revolution or Many?**
  Kuhn treats the shift as singular. In reality, plate tectonics was a **synthesis of sub-revolutions**.
  1.  Paleomagnetism (continents move).
  2.  Seafloor Spreading (ocean floor moves).
  3.  Transform Faults (geometry of motion).
  4.  Subduction (destruction of crust).
  These happened in rapid succession (1960–1968). Kuhn's model struggles with **convergent revolutions**, where multiple anomalies from different sub-fields coalesce into a single solution.

  ### 5. Conclusion: Poster Child or Overextension?

  Plate tectonics is the **poster child for the *outcome* of a Kuhnian revolution, but a counter-example for the *process*.**

  *   **Validates Kuhn:** It demonstrates a clear paradigm shift where the ontology of the Earth changed (from static to dynamic), old concepts (geosynclines) were redefined, and the textbook was rewritten overnight.
  *   **Strains Kuhn:** It suggests that "crisis" is not a necessary precondition for revolution. The shift was driven by **technological innovation** (magnetometers, deep-sea drilling) that unlocked new data, rather than a philosophical breakdown of the old paradigm. The old paradigm didn't fail because it ran out of tricks; it was rendered obsolete by a new observational domain (the deep seafloor) it couldn't access.

  Ultimately, the episode suggests that Kuhn's concept of "paradigm" does too much work. It lumps together *theory* (drift), *method* (paleomagnetism), and *ontology* (lithosphere). The plate tectonics revolution shows that science can change radically through the accumulation of precise, technological answers to specific puzzles, without requiring the prolonged, quasi-religious crisis Kuhn described. It was less a conversion experience and more a lock clicking open.
