answer: |-
  The phenomenon you are describing is formally known as Pascal's Mugging.

  This problem arises from a structural tension between three plausible premises: expected utility maximization, unbounded utility functions, and the assignment of non-zero prior probabilities to empirically possible claims. Unlike Pascal's Wager, which relies on infinite utility (salvation) to dominate any finite cost, Pascal's Mugging demonstrates that even with strictly finite utilities and probabilities, an unbounded utility function allows any small probability to be swamped by a sufficiently large promised payoff. The "mugging" occurs because an agent maximizing expected value is forced to accept any deal where $P \times U > \text{Cost}$; if $U$ can grow without limit, a manipulator can always posit a larger $U$ to overcome your skepticism about $P$.

  The core diagnosis is that the problem is primarily about **unbounded utilities**, not merely about tiny probabilities or the decision rule itself. If your utility function is bounded—meaning there is a maximum possible value any outcome can have—then there exists a probability threshold below which the expected value of any payoff cannot exceed a fixed cost. Consequently, the most mathematically robust solution is to reject unbounded utility functions, arguing that human value saturates or that coherent agents cannot prefer a lottery with infinite expected utility over a guaranteed finite outcome (as seen in related paradoxes like the St. Petersburg paradox).

  However, if you wish to retain unbounded utilities (perhaps for ethical reasons regarding population aggregation), the problem shifts to **epistemology**. Robin Hanson and others argue that the prior probability assigned to a claim must decrease at least as fast as the promised utility increases. This is often formalized via a complexity penalty: the more complex the mechanism required to deliver the payoff (e.g., a "Matrix Lord" controlling reality), the lower the prior probability. If your epistemic framework penalizes extraordinary claims sufficiently, the product $P \times U$ remains bounded regardless of how large $U$ grows, neutralizing the mugging without bounding utility.

  The edges of this phenomenon are defined by the presence or absence of evidence. Pascal's Mugging applies specifically to **bare claims** where the only evidence for the payoff is the claimant's assertion. It does not apply to legitimate low-probability, high-impact interventions (such as asteroid deflection or pandemic prevention) where the probability estimate is derived from empirical models rather than arbitrary assertion. In empirical cases, the probability $P$ does not vanish arbitrarily as the payoff $U$ increases; rather, $P$ is constrained by physical models, preventing the $P \times U$ product from exploding. Therefore, the phenomenon marks the boundary where decision theory intersects with the epistemology of extraordinary claims, highlighting that expected value maximization requires priors that are sensitive to the magnitude of the claim being made.
