  I'm working through decision theory on my own and I keep running into a pattern I don't have a label for. Here is the shape of it: someone offers you a deal — pay a small but definite cost now, and in exchange you get a vanishingly tiny probability of an astronomically large payoff. Expected value says take it; the payoff is so enormous that it swamps the near-zero probability. But if you take it, you seem committed to accepting an endless parade of similar offers from anyone who claims, without evidence, that they can deliver an even bigger payoff at an even smaller probability. Yet rejecting the deal seems to mean rejecting expected value reasoning, which is the backbone of the whole framework. I know this is adjacent to Pascal's wager and to puzzles about infinite utilities, but the cases I am seeing all involve finite probabilities and finite payoffs — the numbers are just absurdly lopsided. Does this configuration have an established name? And more importantly, what exactly is the problem here: is it about how we should treat tiny probabilities, about whether utilities can be unbounded, about the epistemology of low-credence claims, or about the decision rule itself? I want the carving — what the phenomenon is, what it is not, and where its edges are — not just a label.

  Take the role of an expert on formal epistemology and decision theory. Think through the diagnosis carefully. Then lead with the bottom line: name the phenomenon (or the nearest established concept) in your first sentence, and follow with your analysis. No preamble and no restating of the question.
