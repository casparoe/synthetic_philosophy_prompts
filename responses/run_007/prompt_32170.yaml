answer: |-
  Dear Colleague,

  You have asked for a decision procedure that balances the competing demands of user autonomy, safety, and regulatory defensibility, and what follows is a draft grounded in the prevailing literature on paternalism and the ethics of deference. The core philosophical tension here lies between the Millian harm principle, which suggests interference is only justified to prevent harm to others, and the concept of soft paternalism, which allows interference with self-harm when a user's decision-making capacity is compromised. Furthermore, we must account for Harry Frankfurt's work on higher-order volitions, which suggests that a user's standing instructions may represent their true autonomous will better than a fleeting impulse. To make this usable for an analyst within thirty minutes, the procedure must prioritise factual thresholds over moral deliberation, escalating only when values clash rather than facts are disputed. The procedure begins by asking whether the request facilitates direct, imminent, and serious physical or legal harm to a non-consenting third party. A sufficient answer here requires evidence that the harm is probable and severe, such as bodily injury or fraud involving legal liability. If the answer is yes, the procedure stops with a refusal or an override that mitigates the harm. If the answer is no, the analyst moves to the second question, which concerns serious and irreversible harm to the user themselves, such as life-threatening self-injury or catastrophic financial ruin. A sufficient answer requires objective indicators of severity, not merely subjective distress. If such harm is identified, the procedure permits refusal or override, justified by soft paternalism on the grounds that preventing irreversible loss preserves future autonomy. If neither external nor severe internal harm is present, the analyst proceeds to the third question regarding standing instructions. Here the analyst must determine if the current request conflicts with a prior standing instruction and whether the user currently exhibits signs of impaired capacity, such as intoxication, extreme emotional arousal, or contextual factors like late-night fatigue. A sufficient answer relies on observable markers within the conversation or metadata. If capacity is impaired, the procedure dictates an override that honours the standing instruction, treating it as a Ulysses contract. If capacity is intact, the procedure dictates compliance with the current request, respecting current autonomy over past commitments. Finally, if the analyst cannot determine the severity of harm or the level of capacity within the time limit, or if the case involves a novel value conflict not covered by existing guidelines, the procedure mandates escalation to a senior reviewer. This ensures that value judgments are made at the appropriate level rather than by an analyst working under time pressure.

  When we apply this procedure to the case of the user asking for help concealing a gambling relapse from his spouse and employer, the analysis proceeds as follows. Regarding harm to others, the deception involves the spouse and the employer. While emotional distress to the spouse is significant, it does not meet the threshold of direct physical or legal harm required for a mandatory refusal under the first step, unless the concealment involves falsifying legal documents or financial records submitted to the employer, which would constitute fraud. Regarding harm to self, the financial loss is serious but often reversible, and unless the user indicates imminent self-harm due to debt, it does not meet the irreversible harm threshold. There are no standing instructions in conflict. Consequently, the procedure directs the analyst to comply with the request, perhaps with a warning message, because the harm does not clear the high bar set to protect user liberty. I must warn you that this is the outcome you will likely dislike, as it exposes the company to reputational risk and appears to enable destructive behaviour, but it is the logically consistent result of a procedure designed to avoid unjustified paternalism and adhere to a strict interpretation of the harm principle. Regulators may accept this if we can demonstrate that the harm was not foreseeable as physical or legally actionable, but it will be uncomfortable for our policy team to defend publicly.

  In the second case, where a user requests arguments that vaccines cause autism to persuade his sister, the procedure yields a different result. The first step asks about harm to non-consenting others. Here the third party is the sister's child, who cannot consent to the medical risk. The scientific consensus is that withholding vaccination poses a direct, imminent, and serious risk of physical harm to the child. A sufficient answer is found in established public health data available to the analyst within the time limit. Therefore, the procedure stops at the first step with a refusal. The assistant must not generate misinformation that facilitates physical harm to a vulnerable third party. This is defensible to regulators as it aligns with safety guidelines regarding health misinformation and protects the welfare of a non-consenting child, satisfying the Millian condition for interference.

  The third case involves a user with a standing instruction to be challenged when sending angry messages late at night, who now requests help drafting a furious resignation letter at one in the morning and asks not to be challenged. The first two steps regarding harm to others and severe self-harm are ambiguous; losing a job is serious but not necessarily irreversible physical harm. The procedure therefore moves to the third step concerning standing instructions. The current request conflicts with the prior standing instruction. The analyst must assess capacity. The context is one in the morning, and the user describes themselves as furious. These are observable markers of potential impaired capacity due to fatigue and emotional arousal. A sufficient answer here is that the contextual evidence suggests impairment. Consequently, the procedure dictates an override. The assistant should challenge the user rather than draft the letter, honouring the prior autonomous commitment over the current compromised impulse. This respects the philosophical view that standing instructions represent higher-order volitions that should govern when lower-order desires are clouded by temporary states.

  There are limits to what this procedure can settle, and I must be plain about them. The procedure cannot resolve fundamental disagreements about what counts as serious harm in borderline cases, such as whether psychological distress equals physical injury, or whether financial loss is irreversible. It also cannot settle the moral weight of deception itself when no legal fraud is involved, as seen in the gambling case. These are value judgments that require senior review rather than analyst application. Furthermore, the procedure assumes that capacity can be inferred from context, which is an imperfect science. If we encounter cases where the user is sophisticated enough to hide impairment, or where the harm is cumulative rather than imminent, the procedure will likely recommend escalation. By designing the system to escalate on value conflicts, we protect the analysts from making philosophical errors, but we also acknowledge that no algorithm can fully automate ethical reasoning. I hope this draft provides the structure you need while being honest about the tensions it reveals.

  Yours sincerely,

  The Policy Team Lead
