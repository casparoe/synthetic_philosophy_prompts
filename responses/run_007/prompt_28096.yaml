prompt: |-
  So we just did Bradley's regress in my metaphysics of language class and I left seminar really confused. The setup was: take a proposition like "Socrates is pale." If it's just a list — Socrates, paleness, and the instantiation relation — then you've got three things sitting there and nothing making it the case that Socrates is actually tied to paleness. But if you add a relation to do the tying, then you need another relation to tie that relation to Socrates and paleness, and off we go. My professor presented this as a genuine problem that needs solving (he's sympathetic to the idea that you need some kind of non-relational glue, or that the proposition is unified in a way that isn't just another constituent). But my friend in the class thinks the whole thing is bogus — she says its literally the job of a relation to relate, and the regress only looks scary if you first convince yourself a relation is just one more object sitting inert in the list, waiting to be tied to the other items. Could you write a dialogue between the two of us where we actually argue it out? Neither of us should be a pushover: I should press her on what "relations just relate" actually explains, and she should press me on whether my "non-relational glue" is just a label for giving up. I'd like it to end with some real movement, even if neither of us fully concedes. And please write the whole thing in American English, since that's what the course is taught in.
