answer: |-
  This is one of the most intellectually honest frustrations a biologist can have, and you have articulated the philosophical structure of the problem with remarkable clarity. You are describing the tension between the *unity of a folk concept* and the *heterogeneity of biological reality*.

  To answer your specific question: There is no single, universally agreed-upon "noun" for this exact dynamic (e.g., "the [X] effect"). However, in the philosophy of biology and general philosophy of science, this phenomenon is analyzed under a cluster of related concepts. The most precise characterization of what you are experiencing is **Divergent Explication leading to Ontological Pluralism.**

  Here is a breakdown of the relevant literature, the specific terms that fit your description, and how to distinguish this from Kuhnian incommensurability or mere disagreement.

  ### 1. The Core Concept: Species Pluralism (and Promiscuous Realism)

  The standard label for the *state* you have arrived at is **Species Pluralism**. This is most famously associated with the philosopher of biology **Marc Ereshefsky** (particularly in *The Poverty of the Linnaean Hierarchy*).

  *   **The View:** Pluralists argue that "species" is not a single natural kind. There is no single property (reproductive isolation, monophyly, ecological niche) that all species share. Instead, there are multiple, equally legitimate classes of entities that we call "species," each governed by different causal processes.
  *   **Why it fits:** It accepts your observation that different definitions yield different answers and that *none is obviously right*. It posits that the fragmentation isn't a failure of our science, but a reflection of the fact that evolution produces different kinds of lineages (sexual, asexual, hybridizing, clonal) that cannot be captured by one concept.

  Closely related is **John Dupré's Promiscuous Realism** (from *The Disorder of Things*).
  *   **The View:** Dupré argues that the world is causally complex and does not come pre-packaged into a single hierarchical taxonomy. Our classifications reflect human interests and the specific causal structures we are investigating.
  *   **Why it fits:** This captures the "incompatible but reasonable" aspect. If you care about gene flow, the BSC is real. If you care about diagnostic traits, the PSC is real. Both are "real" relative to the causal structure being interrogated.

  ### 2. The Dynamic: Divergent Explication

  You asked specifically about the *process*: "trying to precisify a folk concept... causes it to fragment." In philosophy of science, the project of replacing a vague folk concept with a rigorous scientific one is called **Explication** (following Rudolf Carnap).

  *   **Standard Explication:** Ideally, you take a vague concept (the *explicandum*) and replace it with a precise one (the *explicatum*). We usually expect **Convergent Explication**: as science advances, multiple definitions should converge on the single "true" underlying structure.
  *   **Your Experience:** You are experiencing **Divergent Explication**. As empirical detail increases, the single folk concept splinters into multiple scientific concepts that do not map onto each other extensionally (they don't group the same organisms together).

  This is a recognized pattern in other fields. For example:
  *   **"Gene":** In the early 20th century, "gene" was a unit of heredity. As molecular biology advanced, the concept splintered (structural gene, regulatory gene, pseudogene, overlapping genes). There is no longer a single rigorous definition of "gene" that covers all cases; the concept fragmented under empirical pressure.
  *   **"Memory":** In cognitive science, the folk concept of "memory" splintered into working memory, episodic memory, procedural memory, etc., which rely on distinct neural substrates.

  So, if you need a term for the *dynamic*, **"Conceptual Fragmentation under Explication"** or **"Divergent Explication"** is the most accurate technical description.

  ### 3. Distinguishing from Kuhn and Disagreement

  You asked to distinguish this from ordinary disagreement and Kuhnian incommensurability. This is crucial for your peace of mind.

  **Vs. Ordinary Disagreement:**
  *   **Disagreement:** Assumes there is a single fact of the matter we haven't found yet. (e.g., "Is the speed of light 299,792,458 m/s or 299,792,459 m/s?")
  *   **Your Case:** The evidence suggests there *is no single fact of the matter*. The biological processes (reproduction, ancestry, ecology) are decoupled. It is not that we lack data; it's that the data pulls in orthogonal directions. This is an **ontological** issue, not just an epistemic one.

  **Vs. Kuhnian Incommensurability:**
  *   **Kuhn:** Incommensurability is usually *diachronic* (over time). Paradigm A is replaced by Paradigm B, and they cannot talk to each other.
  *   **Your Case:** This is *synchronic* (at the same time). Evolutionary biologists use the BSC, PSC, and ESC simultaneously in the same papers, often acknowledging the conflict. We are not waiting for a revolution to eliminate the old concepts; we are maintaining a **stable pluralism**. The concepts are commensurable (we can translate between them), but they are not co-extensive.

  ### 4. Is it the World or the Concept?

  You asked: *"Is this a feature of the world, a feature of our concepts, or a feature of the process of trying to operationalize folk categories?"*

  The consensus among philosophers of biology (like Ereshefsky, Dupré, and Mishler) is that it is **a feature of the world that renders the folk concept inadequate.**

  *   **Folk Concepts** tend to be essentialist. We assume "species" is a box that an organism is either inside or outside of.
  *   **Evolutionary Reality** is process-based and multidimensional. Speciation is a process, not an event. Lineages diverge at different rates in different traits (genetics vs. morphology vs. ecology).
  *   **The Mismatch:** When you try to impose a discrete, essentialist category (the folk concept) onto a continuous, multidimensional process (evolution), the category *must* fragment. You are essentially trying to slice a cloud with a knife; the harder you press (the more rigorous you get), the more the cloud dissipates into mist.

  ### 5. Recommendation: How to Think About This

  If I were supervising your thesis, I would advise you to adopt the stance of **Pragmatic Pluralism**.

  1.  **Stop looking for "The Species":** Accept that "species" is a **cluster concept** (a la Wittgenstein). There is no single thread running through all cases, but a overlapping network of similarities.
  2.  **Operationalize by Question:** Don't ask "Is this a species?" Ask "Is this a species *with respect to* gene flow?" or "Is this a species *with respect to* ecological function?"
  3.  **The Term to Use:** In your writing, if you need to name this phenomenon, I recommend **"Conceptual Pluralism driven by Ontological Heterogeneity."**
      *   *Conceptual Pluralism:* We use multiple definitions.
      *   *Ontological Heterogeneity:* Because the biological reality consists of different types of lineages (sexual, asexual, hybrid) that don't align.

  ### Summary

  You are not doing bad science; you are doing good philosophy without realizing it. The pattern you noticed has a name in the literature: it is the failure of **Convergent Explication** resulting in **Ontological Pluralism**.

  The "Species Problem" isn't a problem to be solved; it's a phenomenon to be described. The fragmentation you see is the sound of a folk category breaking against the complexity of evolutionary history. Embrace the splintering. It means you're looking closely enough to see the cracks in the map, which is the first step toward drawing a better one.

  **Key References for your rabbit hole:**
  *   **Marc Ereshefsky**, *The Poverty of the Linnaean Hierarchy* (1998) - The definitive text on species pluralism.
  *   **John Dupré**, *The Disorder of Things* (1993) - For "Promiscuous Realism."
  *   **Richard Boyd**, "Homeostasis, Species, and Higher Taxa" (1999) - For the "HPC" view (an attempt to save natural kinds, useful for contrast).
  *   **Kevin de Queiroz**, "The General Lineage Concept of Species" (2007) - An attempt to unify the concepts (worth reading to see why you might still feel unsatisfied).
  *   **Mishler & Wilkins**, "The Species Problem" (various papers) - For the argument that species are not natural kinds at all.
