      *   *Where does it go wrong?* The most likely culprit is the inference from (2) to (3) and (4). Specifically, the assumption that *metaphysical* accounts of aesthetic properties directly dictate *epistemic* access conditions in a straightforward way.
      *   There is a third option often missed in this specific formulation: The *Acquaintance Principle*. This principle suggests that aesthetic judgments require first-hand experience *not* because of the metaphysics of the property, but because of the nature of the *judgment* or the *value* involved.
      *   Another potential flaw: Equating "knowledge that p" with "appreciation/understanding of p."
