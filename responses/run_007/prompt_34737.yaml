answer: |-
  ### Diagnostic Phase: Brainstorming the Hard Cases

  Before drafting the spec sheet, we need to isolate the specific friction points where existing theories tend to break. The heterogeneity problem is the engine, but the following cases are the gears that grind:

  1.  **The Tight Shoe Case (Relief vs. Pleasure):** You wear shoes that are slightly too small all day. Taking them off feels amazing. Is this a positive hedonic gain, or merely the cessation of a negative? If it's the latter, is all "pleasure" just pain avoidance? Hedonism needs positive value, not just the absence of negative.
  2.  **The Addiction Case (Liking vs. Wanting):** An opioid addict injects heroin. They *want* it desperately (craving), but due to tolerance, they get no "high" (liking). Conversely, in "flow" states, one might be having a great time but not actively monitoring a feeling. Hedonism must track what is *good for* the subject, not just what moves them.
  3.  **The Schadenfreude Case (Object Independence):** You take genuine delight in a rival's failure. The *object* of your state is morally bad. But for hedonism, is the *experience itself* prudentially good for you? If the theory says "no" because the object is bad, it ceases to be pure hedonism and becomes a perfectionist or objective list theory.
  4.  **The Proof Case (Bodily vs. Intellectual):** The sensation of a back scratch and the satisfaction of solving a topology proof feel radically different. One is localized sensation; the other is cognitive resolution. If hedonism claims they both add to welfare, they must be tokens of the same type. If they aren't, how do we trade them off?
  5.  **The Distracted Driver Case (Phenomenal Presence):** You are driving home on autopilot, listening to music you enjoy, but thinking about work. You weren't consciously attending to the pleasure of the music. Did you consume welfare? If pleasure requires conscious feeling, much of our "good life" vanishes. If it doesn't, what distinguishes it from mere preference satisfaction?

  ***

  # Spec Sheet: Adequacy Conditions for a Theory of Pleasure
  **Target:** A theory of pleasure intended to serve as the primitive for Classical Hedonism (the view that pleasure is the sole intrinsic prudential good).

  ## I. The Desiderata

  ### 1. The Commensurability Requirement (Solving Heterogeneity)
  *   **The Demand:** The theory must identify a single property or structural feature shared by all instances of pleasure (from back scratches to mathematical insights) that allows them to be summed, compared, and traded off against one another.
  *   **Forcing Case:** *The Proof vs. The Scratch.* If the pleasure of thinking and the pleasure of sensing are fundamentally different *kinds* of things, hedonism cannot calculate a "net balance" of welfare. They must be convertible into a single currency.
  *   **Status:** **Non-Negotiable.** Without this, hedonism loses its utilitarian calculus structure.

  ### 2. The Valence Asymmetry Requirement (Pleasure vs. Relief)
  *   **The Demand:** The theory must distinguish between positive hedonic tone (pleasure) and the mere cessation of hedonic pain (relief). It must allow for the possibility of a neutral state that is neither painful nor pleasant.
  *   **Forcing Case:** *The Tight Shoe.* If all pleasure is just pain-removal, the theory collapses into Negative Hedonism (where the only good is the absence of pain). A robust hedonism needs positive goods that are not defined merely by the negation of bads.
  *   **Status:** **Non-Negotiable.** Essential for distinguishing classical hedonism from negative utilitarianism.

  ### 3. The Hedonic/Motivational Distinction (Liking vs. Wanting)
  *   **The Demand:** The theory must decouple the *hedonic impact* of an experience (how good it feels) from the *conative drive* toward it (how much it is desired).
  *   **Forcing Case:** *The Addiction Case.* If pleasure is defined by what is desired, the addict's injection counts as welfare-enhancing even if they feel nothing. If pleasure is defined by what is liked, the injection counts as neutral or negative. Hedonism is a theory of *feeling good*, not *getting what you want*.
  *   **Status:** **Non-Negotiable.** Failure here collapses hedonism into Desire Satisfactionism.

  ### 4. The Intentional Independence Requirement (Object Neutrality)
  *   **The Demand:** The prudential value of the pleasure must be independent of the truth, morality, or metaphysical status of its object.
  *   **Forcing Case:** *The Schadenfreude Case.* If the theory says taking pleasure in evil is not "true pleasure" or has no prudential value because the object is bad, the theory has smuggled in non-hedonic values (virtue, truth). For the hedonist, the feeling is good for the subject, even if the act is vile.
  *   **Status:** **Camp Loyalty.** (Pure hedonists require this; "impure" or perfectionist hedonists may reject it).

  ### 5. The Phenomenal Presence Requirement (Felt Quality)
  *   **The Demand:** The theory must specify whether pleasure requires a distinct phenomenological "feel" or if it can be dispositional/unconscious.
  *   **Forcing Case:** *The Distracted Driver.* If pleasure must be a felt quality, we lose welfare in moments of unreflective enjoyment. If it need not be felt, we risk making pleasure indistinguishable from a disposition to behave or judge.
  *   **Status:** **Camp Loyalty.** (Sensory theorists require this; Attitudinal theorists reject it).

  ### 6. The Unity of Kind Requirement (Bodily vs. Intellectual)
  *   **The Demand:** The theory must explain how bodily sensations and cognitive states can both be instances of "pleasure" without reducing one to the other.
  *   **Forcing Case:** *Mill's Higher/Lower.* If intellectual pleasures are just "different in kind" and not "higher in quality," hedonism is purely quantitative. If they are different in kind, Commensurability (Desideratum 1) is threatened. The theory must thread the needle: different phenomenology, same axiological category.
  *   **Status:** **Non-Negotiable.** Required to handle the full range of human experience.

  ***

  ## II. The Tensions (The "Result")

  This is the critical section for your seminar. The spec sheet above is not a menu where you can order everything. There are deep structural incompatibilities between these desiderata. A theory of pleasure will likely have to sacrifice one to save the others.

  ### Tension A: Commensurability vs. Phenomenal Presence
  *   **The Conflict:** If you insist that pleasure must have a distinct **Phenomenal Presence** (Desideratum 5), you struggle to meet **Commensurability** (Desideratum 1).
  *   **Why:** As the heterogeneity problem highlights, the "feel" of a back scratch and a math proof are phenomenologically distinct. If pleasure *is* the feel, there is no common feel. If you posit a common "hedonic tone" (a raw feel), it seems empirically false (we don't experience a generic "tingle" alongside the math).
  *   **The Cost:** To save Commensurability, you usually have to abandon the idea that pleasure is a specific *sensation*. This pushes you toward Attitudinalism.

  ### Tension B: Intentional Independence vs. Unity of Kind
  *   **The Conflict:** If you insist on **Intentional Independence** (Desideratum 4)—that pleasure is just a raw feel regardless of object—you struggle to explain **Unity of Kind** (Desideratum 6) across bodily and intellectual domains.
  *   **Why:** Bodily pleasures seem non-intentional (a tingle is just a tingle). Intellectual pleasures seem essentially intentional (you are pleased *that* the proof works). If pleasure is object-independent, intellectual pleasure looks like it must be reduced to a bodily sensation (which feels wrong). If pleasure is object-dependent, you risk violating Independence (if the object is false, is the pleasure fake?).
  *   **The Cost:** To save Unity, you often have to make pleasure a propositional attitude. But this threatens Independence (is pleasure in a false proposition less valuable?).

  ### Tension C: Valence Asymmetry vs. Phenomenal Presence
  *   **The Conflict:** Distinguishing **Relief from Pleasure** (Desideratum 2) is notoriously difficult if you rely solely on **Phenomenal Presence** (Desideratum 5).
  *   **Why:** Phenomenologically, the relief of pain often *feels* exactly like positive pleasure. If the theory relies on "what it feels like," it cannot distinguish the cessation of pain from the onset of gain.
  *   **The Cost:** To distinguish them, you often need a functional or causal story (e.g., relief restores homeostasis, pleasure exceeds it). This moves the theory away from pure phenomenology toward functionalism.

  ### The "Trilemma" Conclusion
  It is highly probable that no theory can satisfy **Phenomenal Presence**, **Commensurability**, and **Intentional Independence** simultaneously.
  1.  **Felt-Quality Views** keep Presence but lose Commensurability (Heterogeneity wins).
  2.  **Attitudinal Views** keep Commensurability and Unity but lose Presence (Pleasure becomes a judgment, not a feel).
  3.  **Desire-Based Views** keep Motivation but lose the Liking/Wanting distinction (Collapses into Satisfactionism).

  ***

  ## III. Theory Scorecard

  Here is how the three major camps fare against the non-negotiables.

  | Criterion | **Felt-Quality (Sensory)** | **Attitudinal (Propositional)** | **Desire-Based (Conative)** |
  | :--- | :--- | :--- | :--- |
  | **Commensurability** | **FAIL.** Cannot find a common "feel" across heterogeneous cases. | **PASS.** All pleasures are the same attitude (enjoyment) toward different contents. | **PASS.** All desires are comparable in strength. |
  | **Relief vs. Pleasure** | **FAIL.** Phenomenology of relief mimics pleasure. | **PASS.** Can distinguish being glad pain stopped vs. glad something good started. | **FAIL.** Desire satisfaction often *is* relief of craving. |
  | **Liking vs. Wanting** | **PASS.** Focuses on the feeling, not the drive. | **PASS.** Focuses on the attitude, not the urge. | **FAIL.** Collapses liking into wanting (Definitionally unstable for hedonism). |
  | **Phenomenal Presence** | **PASS.** This is its definition. | **FAIL.** Allows for unconscious pleasure (e.g., enjoying a drive while distracted). | **N/A.** Irrelevant to desire satisfaction. |
  | **Object Independence** | **PASS.** A sensation is a sensation, regardless of cause. | **MIXED.** Depends on if the attitude requires truth of content. | **PASS.** Satisfaction is satisfaction, even if based on false belief. |

  **Instructor's Note:** The Attitudinal view (e.g., Feldman, Heathwood) is currently the front-runner for satisfying the *axiological* needs of hedonism (Commensurability, Unity), but it pays the price of alienating the *phenomenological* intuition that pleasure is something we *feel*. The Felt-Quality view (e.g., Kagan, traditional Bentham) keeps the intuition but breaks the calculus. Your seminar should focus on whether "welfare" requires a *feeling* or a *successful attitude*.
