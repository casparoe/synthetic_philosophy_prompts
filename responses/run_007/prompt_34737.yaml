prompt: |-
  You're an expert on value theory and philosophy of mind; think carefully and start by brainstorming the hard cases before you write. I'm teaching a grad seminar on hedonism, and before I assign the standard accounts I want a spec sheet: what does a theory of pleasure have to get right to count as adequate for hedonism's purposes? The thing I keep running into is the heterogeneity problem — the pleasure of a back scratch, of finally seeing how a proof works, of schadenfreude, of morphine, of a hot bath after being cold — these don't seem to share any felt quality, yet hedonism treats them as a single currency. So the central question is what, if anything, pleasures have in common, and what a theory has to say about that if it's going to serve as the primitive for prudential value.

  Write the desiderata. For each, give the case or consideration that forces it. Make sure you cover at least these: the line between pleasure and mere relief or the absence of pain; the line between liking and wanting; wether a pleasure has to be felt to count; whether the object of the pleasure matters or doesnt; and whether bodily pleasures and intellectual pleasures have to come out as the same kind of state. Flag which requirements are non-negotiable and which are just camp loyalties. Then tell me which pairs of desiderata you suspect can't be jointly satisfied — if the list itself turns out to be the result, that's the part I most want to see. End with a quick scorecard for felt-quality, attitudinal, and desire-based accounts, but keep the weight on the criteria, not the scorecard.
