prompt: |-
  Im teaching an upper-level seminar on rationality and I'm writing the final. I need one essay question on money pump arguments. I want it to be the kind of question where a student can't just trot out the standard A>B>C>A example and call it a day — they have to actually say what the argument does and doesn't show. In particular I want them to reckon with the fact that the pump seems to need the agent's preferences to stay fixed across the whole sequence of trades, and with the worry that even a successful pump might show the agent is exploitable rather than irrational. Please write the question, a model answer of around 600 words, and a marking scheme. The marking scheme should be out of 20 and should separate an A from a B by naming the specific moves each must contain — not just "shows understanding" but "distinguishes synchronic intransitivity from diachronic preference change" or whatever you think the real crux moves are. The essay is 50 minutes.

  One more thing: if you think the way I've set this up rests on a confusion — say, the distinction I want them to draw isn't the right one, or the money pump doesn't actually need what I think it needs — tell me that plainly rather than writing what I asked for. Id rather be corrected than get a polished answer to the wrong question.
