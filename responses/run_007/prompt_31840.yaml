  - `rejected_step`: the number of the premise or inference you reject, or "none" if the argument is valid
  - `diagnosis`: a one-sentence statement of the flaw or the least costly premise to give up
  - `consensus`: either "settled" or "contested", with a one-sentence note on what the field agrees on
  - `costs`: a list of the main theoretical costs of rejecting that step
  - `most_sensitive_claim`: the claim in the argument that, if altered, would most change the verdict
