  Here is the diagnosis.

  ### Diagnosis

  You should reject **Premise 2**.

  Premise 2 asserts that the dependence in Counterfactual Mugging (CM) and XOR Blackmail is relevantly identical, differing only in what the action is informative about. This is the claim FDT proponents (such as Soares and Yudkowsky) explicitly deny. While both cases involve a predictor simulating your decision function, the *structural relationship* between the agent's observation and the logical dependency differs crucially.

  In **Counterfactual Mugging**, the agent is asked to decide in the "Tails" branch. The "Heads" branch is a counterfactual world that is *not observed*. The agent's decision function logically controls the output in the Heads branch because the agent is optimizing the policy *across* both branches (effectively reasoning from behind a veil of ignorance regarding the coin flip). There is no observation in the Heads branch to screen off the logical link.

  In **XOR Blackmail**, the agent has *already observed the letter*. This observation is a fixed fact. In FDT, logical dependencies are evaluated conditional on the agent's observations. Once you condition on "I have received the letter," the logical link between your current decision and the predictor's past action (sending the letter) is screened off. Your decision can no longer logically control whether the letter was sent, because the letter's existence is now a fixed constraint. You only control the payment. In CM, you are not conditioning on the coin flip in the counterfactual branch, so the logical control over the payoff remains active.

  **Why Premise 2 looked plausible:**
  It relies on the intuition that "logical correlation is logical correlation." If my source code determines the prediction in both cases, why does one count as control and the other as mere evidence? The intuition ignores the role of *conditioning on observations*. FDT argues that logical control only generates normative force when the dependent variable is not already fixed by observation. In XOR, the letter is fixed; in CM, the counterfactual payoff is not fixed by observation (because it is counterfactual).

  **The Cost:**
  Rejecting Premise 2 requires FDT to provide a rigorous semantics for "logical counterfactuals" that explains exactly when an observation screens off logical control. This is technically difficult; the formal theory of logical induction and counterfactuals is still under development. It also exposes FDT to the charge that the distinction is ad hoc—tuned specifically to yield "Pay" in CM and "Don't Pay" in XOR—unless the screening-off criterion can be derived from first principles.

  **Consensus Status:**
  This is **contested**. While FDT proponents claim this distinction resolves the issue, the broader decision theory community (including CDT and EDT theorists) remains unconvinced that FDT's handling of logical counterfactuals is coherent. The XOR Blackmail case is widely regarded as the strongest objection to FDT, and whether FDT successfully avoids the money pump without abandoning the CM verdict is an open technical question.

