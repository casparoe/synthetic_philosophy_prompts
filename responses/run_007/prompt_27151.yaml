answer: |-
  You have stumbled into one of the deepest rabbit holes in decision theory. The argument you outlined is indeed known as **Superrationality**, popularized by Douglas Hofstadter in the 1980s. It challenges the standard Nash Equilibrium solution to the Prisoner's Dilemma.

  The short answer to your question is: **No, it is not cheating** to treat identical copies differently from rational strangers. There is a principled way to distinguish them, but it requires adopting a specific framework for how decisions work.

  Here is the breakdown of where the argument breaks, how to distinguish the cases, and what you have to give up.

  ### 1. The Battleground: Decision Theory
  The conflict isn't really about game theory; it's about **Decision Theory**. Specifically, it is a fight between **Causal Decision Theory (CDT)** and **Functional/Evidential Decision Theory (FDT/EDT)**.

  *   **Causal Decision Theory (Standard Game Theory):** You should choose the action that *causes* the best outcome. My choice cannot causally influence a stranger's choice in a one-shot game. Therefore, I defect.
  *   **Functional Decision Theory (Superrationality):** You should choose the output of the decision *function* that yields the best outcome. If my partner is running the same function, then choosing my output *logically determines* theirs. Therefore, I cooperate.

  ### 2. Which Step Do You Reject?
  To maintain standard game theory for strangers while allowing cooperation for copies, you reject the inference from **Step (2) to Step (5)**.

  **Step (2)** says: *If two perfectly rational people are in exactly the same situation... they'll pick the same move.*
  **Step (5)** says: *So I should think: if I stay quiet, my partner will too...*

  **The Rejection:**
  For **strangers**, Step (2) might be true as a *prediction* (we will likely do the same thing), but it is false as a *control mechanism*.
  *   **Standard View:** Even if we are identical rational agents, my decision process happens in my head, and yours happens in yours. There is no magical wire connecting our brains. If I decide to cooperate, that does not *force* you to cooperate. It merely makes it *probable* that you did the same reasoning.
  *   **The Flaw in (5):** Step (5) treats the correlation as if it were causation. It assumes that by choosing my action, I am *selecting* the symmetric outcome. Standard game theory says you only select *your* action. The other person's action is already fixed (or determined by their own separate process) regardless of what you do.

  For **copies/code**, Step (5) becomes valid. Why? Because you aren't two agents anymore; you are one algorithm running in two places. If the code outputs "Cooperate" on Instance A, it *must* output "Cooperate" on Instance B, provided the inputs are identical. Here, your choice *logically necessitates* their choice.

  ### 3. The Principled Distinction: Logical vs. Causal
  You asked if keeping (2) for copies but not strangers is cheating. It is not, because the nature of the link between the players is fundamentally different.

  **Case A: Rational Strangers**
  *   **Connection:** Psychological/Statistical.
  *   **Mechanism:** We both happen to use similar reasoning.
  *   **Counterfactual:** If I were to magically switch my choice to "Cooperate" (while keeping my rationality the same), would the other person switch? **No.** Their brain is separate. My change would imply I am not who they thought I was, but it wouldn't reach across the table and change their mind.
  *   **Verdict:** Defect. (Causal Decision Theory)

  **Case B: Identical Code / Clones**
  *   **Connection:** Logical/Mathematical.
  *   **Mechanism:** We are the same function $f(input)$.
  *   **Counterfactual:** If the function $f$ outputs "Cooperate", then both instances output "Cooperate". There is no possible world where $f(x) = \text{Cooperate}$ for me and $f(x) = \text{Defect}$ for you, because $f$ is the same function.
  *   **Verdict:** Cooperate. (Functional Decision Theory)

  The distinction relies on **Logical Counterfactuals**. With strangers, I can imagine a world where I cooperate and they defect (I am irrational, or they are). With copies, a world where I cooperate and they defect is a logical contradiction, like a world where $2+2=4$ here and $2+2=5$ there.

  ### 4. What Does Rejecting Superrationality Cost?
  If you reject the superrational argument for strangers (which most economists and game theorists do), you have to accept a somewhat unpleasant conclusion:

  **Rational agents can be forced into Pareto-inferior outcomes.**
  You have to accept that "Rationality" does not mean "Getting the best possible result." It means "Maximizing your payoff given that you cannot control others."
  *   **Cost:** You admit that two perfectly rational people can look at a situation where both could win big, and yet, *because* they are rational and cannot trust each other, they will both choose to lose.
  *   **Benefit:** You avoid the "Magic" problem. If you accept superrationality for strangers, you have to explain *how* my choice influences yours without communication. If my choice influences yours, does that mean I have free will? If we are both "superrational," do we just magically coordinate on every symmetric game? It opens the door to paradoxes where rationality requires you to play dominated strategies in other contexts (like Newcomb's Problem).

  ### 5. Summary: How to Hold Your Ground
  You can tell your friend:

  1.  **I accept Step (2) only for logical duplicates.** For strangers, "same situation" is false because of **indexical information**. I know *I am Me*. They know *They are Them*. That difference breaks the symmetry required for logical determination.
  2.  **I reject Step (5) for strangers.** Correlation is not control. Just because we *will* do the same thing doesn't mean I can *make* us do the good thing by choosing it. My choice is a symptom of the outcome, not the cause of theirs.
  3.  **I accept Step (5) for copies.** If we are running the same source code, my decision *is* the decision of the code. There is no distinction between "my choice" and "the algorithm's output."

  **The Principled Line:**
  You cooperate when the correlation is **logical** (copies, source code, perfect predictors).
  You defect when the correlation is **causal/statistical** (strangers, similar psychology).

  This isn't cheating; it's recognizing that **Decision Theory depends on the structure of the counterfactuals.** In the stranger case, the counterfactual "If I cooperate, they cooperate" is false. In the copy case, the counterfactual "If I cooperate, they cooperate" is logically true.

  ### Recommendation
  If you want to read more about this specific distinction, look up **Functional Decision Theory (FDT)** by Eliezer Yudkowsky and Nate Soares. It formalizes exactly what you are looking for: a system that cooperates in the Prisoner's Dilemma against a copy of itself, but defects against a standard Causal Decision Theorist, without being inconsistent.

  It validates your intuition: You don't have to cooperate with strangers just because they are rational. You only cooperate when your decision is *logically entangled* with theirs.
