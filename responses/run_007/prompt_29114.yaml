      *   **Target Audience:** Philosophers/students familiar with basic terms but not necessarily the specific labels/positions yet.
      *   **Leaves (Positions):** Mereological Nihilism, Universalism, van Inwagen's Organicism (Life), Markosian's Brutalism, at least one Moderate (Contact/Fastening). Composition as Identity (CAI) needs handling (branch or cross-cutting?).
      *   **Nodes (Questions):** Must be case-based/intuitive, not doctrinal. Examples given: Hammer (handle+head), Handle+Mars Pebble, Cat (alive vs. dead particles), Statable principle acceptable?, Borderline cases possible?
      *   **Structure:** Build from logical space first, then map positions. Identify empty combinations. Flag indistinguishable leaves.
      *   **Constraints:** Fit on 1-2 pages. Distinguish settled vs. contested claims (e.g., Contact is unpopular, vagueness argument status is contested).
      *   **Tone:** Academic, clear, handout-ready.

  2.  **Deconstruct the Special Composition Question (SCQ):**
      *   SCQ: Under what conditions do some things compose a further thing?
      *   Key Dimensions:
          1.  *Restrictiveness:* Do *any* things compose? Do *all* things compose? Or only *some*?
          2.  *Principle:* Is there a non-trivial condition (Contact, Fastening, Life)? Or no condition (Brutalism)? Or trivial conditions (None/Always)?
          3.  *Vagueness:* Can composition be vague? (Lewis's argument says no).
          4.  *Identity:* Is composition a kind of identity? (CAI).

  3.  **Drafting the Nodes (The "Logical Space"):**
      *   I need questions that force choices between the target positions.
      *   *Question 1 (Universalism vs. Restricted/Nihilism):* Do *any* arbitrary things compose? (e.g., Handle + Mars Pebble).
          *   Yes -> Universalism path.
          *   No -> Restricted/Nihilism path.
      *   *Question 2 (Nihilism vs. Restricted):* Do *any* things compose? (e.g., Hammer parts).
          *   No -> Nihilism.
          *   Yes -> Restricted path.
      *   *Question 3 (The Restriction Principle):* If restricted, is there a *non-trivial, statable condition*?
          *   No -> Brutalism.
          *   Yes -> Moderate/Organicism path.
      *   *Question 4 (The Specific Condition):* If statable, is it *biological life*?
          *   Yes -> Organicism.
          *   No (e.g., Contact/Fastening) -> Moderate path.
      *   *Question 5 (Vagueness):* Are there borderline cases of composition? (This is crucial for separating Moderates from others given Lewis's argument).
      *   *Question 6 (CAI):* This cuts across. It's an account of *what* composition is, not just *when*. I should note it as a cross-cutting modifier.

  4.  **Refining the Questions for the Handout:**
      *   Need to make them concrete, as requested.
      *   *Q1:* "Consider the handle of this hammer and a random pebble on Mars. Do they compose a single object?" (Tests Universalism).
      *   *Q2:* "Consider the head and handle of this hammer. Do they compose a single object?" (Tests Nihilism).
      *   *Q3:* "Is there a precise, non-trivial rule that explains *why* the hammer parts compose something but the handle/pebble do not?" (Tests Brutalism vs. Principled).
      *   *Q4:* "Does the rule turn on biological life?" (Tests Organicism vs. Contact/Fastening).
      *   *Q5:* "Could there be a borderline case where it's neither true nor false that composition occurs?" (Tests Vagueness/Lewis's Objection).

  5.  **Mapping Positions to Leaves:**
      *   *Universalism:* Q1=Yes.
      *   *Nihilism:* Q1=No, Q2=No.
      *   *Organicism:* Q1=No, Q2=Yes, Q3=Yes, Q4=Yes.
      *   *Contact/Fastening:* Q1=No, Q2=Yes, Q3=Yes, Q4=No.
      *   *Brutalism:* Q1=No, Q2=Yes, Q3=No.
      *   *CAI:* Cross-cutting (usually aligns with Universalism, but can be adapted).

  6.  **Addressing "Empty Combinations" & "Indistinguishable Leaves":**
      *   *Empty:* A view that says "No arbitrary composition" but "No principled difference" *and* "No vagueness" is hard to sustain (Lewis's argument). Brutalism accepts the lack of principle but usually has to deal with vagueness or accept brute facts.
      *   *Indistinguishable:* Contact and Fastening are often lumped as "Moderate Restricted Views." The tree might not separate them without a specific question about "physical bonding vs. spatial adjacency." I should flag this.
      *   *CAI:* It's an account of the *nature* of composition, not just the *conditions*. It fits best as a sidebar or a "Meta-Question."

  7.  **Addressing Settled vs. Contested:**
      *   *Settled:* Contact is widely rejected (too vague, counterexamples like glued objects vs. loose contact).
      *   *Contested:* Lewis's Vagueness Argument (does it kill all restricted views? Markosian says no).
      *   *Contested:* CAI's coherence.

