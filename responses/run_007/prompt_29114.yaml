answer: |-
  # Handout: Mapping the Special Composition Question
  **Reading Group:** *Material Beings* (van Inwagen)  
  **Goal:** Locate your intuitive judgments within the logical space of mereological positions.

  ### Instructions
  Start at **Q1**. Follow the path dictated by your intuitive answer to the concrete case. The **Bold Terms** at the end are the standard philosophical labels. Read the **Commentary** for nuances and contested claims.

  ---

  ### The Decision Tree

  **Q1. The Arbitrary Sum:**  
  Consider the handle of this hammer and a random pebble on Mars. Do they currently compose a single, distinct object?
  *   **YES** → Go to **Universalism**.
  *   **NO** → Go to **Q2**.

  **Q2. The Familiar Object:**  
  Consider the head and handle of this hammer. Do they currently compose a single, distinct object?
  *   **NO** → Go to **Nihilism**.
  *   **YES** → Go to **Q3**.

  **Q3. The Principle:**  
  Is there a non-trivial, statable rule (other than "it just happens") that explains *why* the hammer parts compose something but the handle/pebble do not?
  *   **NO** (It is a brute fact) → Go to **Brutalism**.
  *   **YES** (There is a condition) → Go to **Q4**.

  **Q4. The Condition:**  
  Is the required condition specifically that the activities of the parts constitute a **biological life**?
  *   **YES** → Go to **Organicism**.
  *   **NO** (e.g., contact, fastening, bonding) → Go to **Moderate Restricted Views**.

  ---

  ### The Positions (Leaves)

  **Universalism** (Q1=Yes)  
  *View:* Any plurality of objects composes a further object.  
  *Commitment:* There exists an object composed of the hammer handle and the Mars pebble.  
  *Note:* Often paired with **Composition as Identity** (see below).

  **Mereological Nihilism** (Q1=No, Q2=No)  
  *View:* No plurality of objects ever composes a further object.  
  *Commitment:* There are no hammers, only "simples arranged hammerwise."  
  *Note:* Avoids vagueness problems but denies ordinary objects.

  **Brutalism** (Q1=No, Q2=Yes, Q3=No)  
  *View:* Composition occurs, but there is no informative condition for when it occurs.  
  *Commitment:* Composition is a primitive, unanalyzable fact.  
  *Note:* Defended by Ned Markosian to avoid vagueness arguments against restricted views.

  **Organicism** (Q1=No, Q2=Yes, Q3=Yes, Q4=Yes)  
  *View:* Composition occurs only when the activities of the parts constitute a life.  
  *Commitment:* Cats exist; statues do not (they are simples arranged statuewise).  
  *Note:* Van Inwagen's position. Denies existence of non-living composites.

  **Moderate Restricted Views** (Q1=No, Q2=Yes, Q3=Yes, Q4=No)  
  *View:* Composition occurs under physical conditions like **Contact** or **Fastening**.  
  *Commitment:* Hammers and tables exist; handle/pebble sums do not.  
  *Note:* Historically common, currently unpopular (see *Commentary*).

  ---

  ### Cross-Cutting Issues

  **1. The Vagueness Pressure Point**  
  *Question:* Could there be a borderline case where it is neither true nor false that composition occurs (e.g., a heap losing grains)?  
  *   **If YES:** You accept vague existence. (Many find this metaphysically impossible).  
  *   **If NO:** You face **Lewis's Vagueness Argument**. Lewis argues that if composition is never vague, you cannot stop at a Restricted View (Organicism/Moderate); you must be a Universalist or Nihilist.  
  *   *Status:* **Contested.** Markosian argues restricted views can avoid vagueness without collapsing into Universalism/Nihilism.

  **2. Composition as Identity (CAI)**  
  *Question:* Is the whole *identical* to its parts taken together?  
  *   *Status:* **Cross-Cutting.** This is a claim about *what* composition is, not just *when* it happens.  
  *   *Alignment:* Most naturally fits **Universalism** (if composition is identity, any parts identify a whole).  
  *   *Conflict:* Hard to reconcile with Organicism or Moderate views (is the cat *identical* to its cells?).

  ---

  ### Commentary: Settled vs. Contested

  | Position | Dialectical Status | Key Objection |
  | :--- | :--- | :--- |
  | **Contact/Fastening** | **Mostly Rejected** | Too vague (how close is contact?) & counterexamples (glued objects vs. loose contact). |
  | **Nihilism** | **Live Option** | Saves logic/vagueness, but costs common sense (no tables/chairs). |
  | **Universalism** | **Live Option** | Saves logic/vagueness, but costs common sense (too many objects). |
  | **Organicism** | **Live Option** | Saves living things, but denies artifacts (no ships/tables). |
  | **Brutalism** | **Contested** | Accused of giving up on explanation; defended as the only way to save restricted composition. |
  | **Vagueness Arg.** | **Highly Contested** | Does it kill all restricted views? Consensus: It is the main hurdle, but not necessarily fatal. |

  ### Logical Gaps & Indistinguishabilities

  *   **Indistinguishable Leaves:** The tree groups **Contact** and **Fastening** together. To split them, add: *"If two parts touch but aren't bonded, do they compose?"* (Contact=Yes, Fastening=No).
  *   **Empty/Unstable Combo:** **Restricted + No Principle + No Vagueness.** If you say composition is restricted but brute (Brutalism), you usually must accept some vagueness or face Lewis's argument that "brute" restrictions are unintelligible without a principle.
  *   **The "Life" Boundary:** Organicism relies on a sharp distinction between biological life and non-life. If you think *viruses* or *flames* are borderline lives, you face the Vagueness Pressure Point again.

  ---
  *Prepared for the Metaphysics Reading Group. Consult van Inwagen (1990), Lewis (1986), & Markosian (1998).*
