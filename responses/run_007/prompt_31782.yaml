prompt: |-
  so i just got into this huge argument with a friend about collective intentionality — you know the debate, whether a "we-intention" is just a bunch of I-intentions plus mutual belief, or whether there's something genuinely irreducible about shared intentions. he was on the reductionist side (basically the bratman line, that it's all individual intentions interlocking) and i was trying to argue for the searle-style irreducibility claim. we went back and forth for like three hours and neither of us moved an inch. the frustrating thing is i felt like i couldnt get him to *feel* the difference — it all stayed at the level of conceptual analysis.

  anyway it made me realize i want the people in my reading group to actually experience the distinction rather than just read about it. so here's what i'm thinking:

  i run a philosophy discussion group — about 16 people, mostly undergrads who've done a bit of philosophy but aren't specialists, we meet for 90 minutes. i want to design an activity where they end up feeling the difference between parallel individual action (with mutual knowledge) and genuine joint action, without me having to lecture about it first. ideally they shouldnt even know what the activity is about until the debrief.

  can you design something runnable? i need rules, materials, a timeline, and a debrief that maps what happened in the activity onto the actual philosophical distinction. also tell me what's going to go wrong when i actually run it, and which part of the philosophical view the activity can't capture and i'll have to supply myself.
