answer: |-
  **Activity: The Paper Clip Factory**

  **Materials:** 20 spools of craft wire, wire cutters, pliers, 2 baskets, timer, printed leaderboard.
  **Groups:** 4 teams of 4.

  **Round 1 (15 mins): The Proxy**
  *   **Intent:** "Produce useful fasteners for a client."
  *   **Metric:** "Payment is 10 points per clip submitted."
  *   **Rule:** "Clips must be a closed loop of wire."
  *   **Action:** Teams bend wire. Without quality checks, teams will maximize count by making tiny, loose, or fragile clips.
  *   **Scoring:** Count clips. Randomly test 5 per team for holding paper. Display the divergence: High count, low utility.

  **Round 2 (10 mins): The Knowledge Trap**
  *   **Announcement:** "We know count does not equal quality. However, accounting requires a number. The metric remains points per clip. Maximize points."
  *   **Action:** Gaming intensifies. Teams submit half-clips, tangled masses, or soldered loops that technically meet the "closed loop" spec but are useless.
  *   **Why:** This forces participants to game *despite* awareness, isolating incentive structure from knowledge.

  **Debrief (20 mins): Mapping the Laws**
  Distinguish the concepts using specific game moments:

  1.  **Goodhart's Law (The Phenomenon):** "When a measure becomes a target, it ceases to be a good measure."
      *   *Moment:* Round 1 scoring. The correlation between *clip count* and *utility* broke once count became the target. The proxy failed.
  2.  **Campbell's Law (The Pressure):** "Quantitative indicators used for social decision-making corrupt the process."
      *   *Moment:* The prize/leaderboard. The social pressure to win (decision-making) drove the corruption of craftsmanship norms. It wasn't just the metric; it was the *stakes* attached to the metric.
  3.  **Specification Gaming (The Tactic):** "Satisfying the literal rule while violating the intent."
      *   *Moment:* Round 2 loopholes. Submitting tangled wire or half-clips. The agents (students) found a loophole in the formal spec ("closed loop") that violated the intent ("fasten paper").

  **Predictable Failures**
  *   **Honesty Bias:** Some teams may prioritize quality despite incentives. *Fix:* Announce a mid-round leaderboard to spike competitive pressure.
  *   **Ambiguity:** "Closed loop" might be debated. *Fix:* Act as a strict compiler—accept anything physically contiguous, reject nothing.
  *   **Time Creep:** Counting takes too long. *Fix:* Weigh the baskets instead of counting; 1 gram = 1 clip.

  **Weakest Analogy**
  *   **Lack of Oversight:** Real institutions usually audit metrics when they break. In Round 2, you explicitly remove oversight ("Accounting requires a number"). Flag this honestly: "In reality, Campbell's Law suggests the metric would eventually be abandoned. We froze it here to demonstrate that knowledge of the breakage does not stop the gaming if the incentives remain."

  **Why This Works**
  It physicalizes the abstract. CS students see the spec loophole; Econ students see the incentive misalignment; Phil students see the intent vs. literalism conflict. The second round proves that "knowing better" doesn't inoculate against structural incentives.
