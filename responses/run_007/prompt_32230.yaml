answer: |-
  ### Essay Question

  Scheffler contends that the 'Afterlife Conjecture' reveals a structural dependency between our present valuing and the existence of future generations. Reconstruct the inferential step that moves from the intuitive reactions in the 'Doomsday' and 'Infertility' scenarios to the claim that human extinction undermines value in a way that transcends the sum of individual deaths. Critically assess whether this psychological dependency successfully grounds a normative conclusion about the badness of extinction.

  ***

  ### Model Answer

  Samuel Scheffler's *Death and the Afterlife* challenges the egocentric assumption that our reasons for valuing things are grounded primarily in our own survival or the survival of those we love. His "Afterlife Conjecture" posits instead that the confidence that humanity will continue after our deaths is a pervasive background condition for finding value in our current activities. To justify this, Scheffler employs two thought experiments: the Doomsday scenario (humanity ends 30 days after your death) and the Infertility scenario (no new humans are born, but the current population lives out natural lifespans). The argumentative structure does not rest on the scenarios themselves, but on the specific *variation* they isolate.

  In reconstructing the argument, one must note that Scheffler holds the subject's personal survival constant while varying the collective future. In both scenarios, the agent lives a normal life and dies a natural death. In standard person-affecting views, the badness of extinction is exhausted by the harm done to those who die. However, in the Infertility scenario, no one dies prematurely; the harm is purely the cessation of the lineage. Scheffler observes that agents in these scenarios experience a profound loss of motivation to engage in valuable projects (e.g., scientific research, art, justice). The inferential step moves from this psychological observation to a normative claim: if the absence of a collective afterlife drains our current activities of meaning, then the existence of that afterlife must be a constitutive element of that meaning. Therefore, extinction is bad not merely because it harms existing people (who die anyway), but because it negates the background condition required for their lives to matter.

  This structure attempts to bypass the Non-Identity Problem and standard person-affecting restrictions. If value depends on a future we will not see, then the badness of extinction is not reducible to the sum of individual deaths. It is a holistic badness attached to the termination of the human form of life itself. Scheffler argues that we care more about the collective afterlife than our own personal afterlife, suggesting that our "reasons for living" are implicitly social and trans-generational.

  However, assessing whether this psychological dependency grounds a normative conclusion requires scrutinizing the bridge between *what we value* and *what is valuable*. Scheffler's argument risks committing a version of the naturalistic fallacy. Even if it is true that we *would* feel our lives are meaningless without a future humanity, it does not automatically follow that our lives *would be* meaningless, or that extinction is objectively worse than the sum of individual deaths. It is possible that our reactive attitudes are biased by a "conservatism" instinct—an evolutionary or cultural predisposition to prefer the status quo of the species. If the loss of meaning is merely a psychological glitch rather than a rational response to value, the normative weight of the argument collapses.

  Furthermore, one must consider the scope of the dependency. Scheffler suggests the afterlife is a background condition for *most* of our values. A critic might argue this overstates the case. Many activities possess immanent value (e.g., enjoying a meal, comforting a friend) that seems intelligible even if humanity ends tomorrow. If only *some* projects (like curing cancer) depend on the afterlife, the claim that extinction is uniquely bad "beyond the sum of deaths" is weakened. It becomes a claim about specific long-term projects rather than the structure of valuing itself.

  Ultimately, Scheffler successfully demonstrates that our intuitive judgments about extinction are not fully captured by person-affecting views. The thought experiments effectively isolate the variable of the collective future. However, the move from the phenomenology of valuing to the metaphysics of value remains precarious. The argument proves that we *take* the afterlife to be important, but it requires additional premises to prove that we are *right* to take it as such. Without defending the rationality of this dependency against charges of species-conservatism, the Afterlife Conjecture remains a powerful description of our moral psychology, but an incomplete justification for the normative badness of extinction.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Function of the Thought Experiments (4 Marks)**
  *   **Requirement:** Must explain that the scenarios function as controls to isolate the variable of the *collective future* while holding *personal survival* constant.
  *   **Common Mishandling:** Students merely narrate the plot of the Doomsday/Infertility scenarios (e.g., "an asteroid hits") without explaining *why* Scheffler uses them to test the source of value.

  **2. The "Background Condition" Claim (4 Marks)**
  *   **Requirement:** Must articulate that Scheffler argues the collective afterlife is not just a desired outcome, but a precondition for current activities to have meaning.
  *   **Common Mishandling:** Students treat the afterlife as just another "good thing" we want (like happiness), rather than a structural background condition that enables valuing.

  **3. Distinction from Person-Affecting Views (4 Marks)**
  *   **Requirement:** Must clarify that the argument claims extinction is worse than the sum of individual deaths because it negates value for those who *do* live, not just those who *don't* exist.
  *   **Common Mishandling:** Students conflate Scheffler's view with standard harm-based accounts (e.g., "it's bad because people die") or confuse it with the Non-Identity Problem without distinguishing Scheffler's specific contribution.

  **4. The Psychological-Normative Bridge (5 Marks)**
  *   **Requirement:** Must identify the core inferential leap: moving from "we *feel* loss of meaning" (psychology) to "extinction *is* bad/meaningless" (normativity).
  *   **Common Mishandling:** Students assume the psychological reaction proves the normative claim automatically, failing to identify the gap between descriptive psychology and normative ethics.

  **5. Objection: Conservatism or Is-Ought Gap (4 Marks)**
  *   **Requirement:** Must raise a critical objection regarding the rationality of the dependency (e.g., evolutionary bias, status quo conservatism, or the naturalistic fallacy).
  *   **Common Mishandling:** Students offer generic objections unrelated to the argument's structure (e.g., "overpopulation is good") or fail to link the objection to the psychological-normative bridge.

  **6. Objection: Scope of Valuing (4 Marks)**
  *   **Requirement:** Must question whether *all* or *most* values depend on the afterlife, or if only specific "legacy" projects do.
  *   **Common Mishandling:** Students accept Scheffler's claim that *all* value depends on the afterlife without questioning the scope, or they argue that *no* value depends on it, missing the nuance of "background condition."
