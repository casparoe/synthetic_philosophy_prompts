answer: |-
  ### Desiderata for an Adequate Contractualist Account of Aggregation

  Given the fixed core of Scanlonian contractualism—that wrongness is determined by principles no one could reasonably reject, where grounds for rejection are individual reasons rather than aggregate value—the following criteria specify the problem space for aggregation. These desiderata outline what a successful theory must achieve to remain contractualist while avoiding implausible moral conclusions.

  #### 1. The Numbers Intuition (Simple Rescue)
  *   **Specification:** In cases where an agent must choose between saving one stranger or five strangers, and the burden to each is identical (e.g., death), the principle must permit (and require) saving the five.
  *   **Consideration:** A moral theory that mandates flipping a coin between one life and five lives, ceteris paribus, is extensionally inadequate. It fails to capture the moral significance of the fact that there are more people to be saved.
  *   **Status:** **Non-negotiable.** While some strict deontologists resist this, any contractualist account claiming to be a plausible general morality must accommodate the intuition that numbers count in identical-claim cases.

  #### 2. The Gravity Threshold (Unequal Trade-off)
  *   **Specification:** There must be a point at which a single individual's severe burden (e.g., death or permanent disability) cannot be outweighed by the aggregated minor burdens of a large number of others (e.g., mild headaches or inconvenience), regardless of the number of others.
  *   **Consideration:** This distinguishes contractualism from utilitarianism. It protects the individual from being sacrificed merely because the sum of others' gains exceeds their loss. It preserves the "separateness of persons" by acknowledging that some harms are non-fungible.
  *   **Status:** **Non-negotiable.** Without this, the view collapses into a form of consequentialism it was designed to replace.

  #### 3. The Intrapersonal/Interpersonal Asymmetry
  *   **Specification:** The theory must explain why it is permissible to aggregate burdens within a single life (e.g., enduring a painful surgery now to avoid greater pain later) but restricts or prohibits aggregating burdens across different lives (e.g., imposing pain on A to avoid greater pain on B and C).
  *   **Consideration:** This captures the "separateness of persons." A single life constitutes a locus of compensation and trade-off that does not exist between distinct persons.
  *   **Status:** **Non-negotiable.** This is the metaphysical foundation of the individualist restriction.

  #### 4. The Individualist Restriction (Justifiability to the Loser)
  *   **Specification:** Any principle that permits a person to suffer a burden for the sake of others must be justifiable *to that person* using reasons that apply to her situation. She cannot be asked to accept a loss merely because the sum of benefits to others is greater.
  *   **Consideration:** This is the core contractualist commitment. It ensures that moral justification is relational and respectful of individual standing, rather than treating persons as vessels for value.
  *   **Status:** **Non-negotiable (by definition).** This is fixed by the prompt's core specification of the view.

  #### 5. The Ex Post Constraint
  *   **Specification:** The strength of a complaint for the purpose of rejecting a principle should be determined by the burden a person *actually* suffers (ex post), not merely by the risk they faced before the outcome was resolved (ex ante).
  *   **Consideration:** Orthodox Scanlonianism holds that what matters is whether a principle can be justified to those who actually end up worst off. If we justify principles solely by ex ante risk reduction, we might permit a principle that actually kills one person to slightly lower the risk for many, which seems to violate the Individualist Restriction.
  *   **Status:** **Camp Preference (Orthodox Scanlonian).** Revisionist contractualists often argue this must be weakened to an Ex Ante standard to solve aggregation problems. An adequate account must take a stance, but it is a point of contention within the view.

  #### 6. The Complaint Hierarchy (Pairwise Comparison)
  *   **Specification:** When comparing principles, we must compare the strongest individual complaint against a principle with the strongest individual complaint against its alternative. A stronger individual complaint generally trumps a weaker one.
  *   **Consideration:** This prevents the "tyranny of the majority" where many weak complaints automatically override one strong complaint. It operationalizes the Individualist Restriction.
  *   **Status:** **Non-negotiable (Structural).** This is the mechanism of contractualist deliberation. However, *how* complaints are grouped or compared is where the aggregation debate lies.

  ---

  ### Incompatibility Analysis

  There is a subset of these requirements that cannot be jointly satisfied under their strictest interpretations. This is the **Contractualist Trilemma**:

  1.  **The Numbers Intuition** (Save the five in Simple Rescue).
  2.  **The Individualist Restriction** (Reasons must be particular to individuals; no summing of distinct persons).
  3.  **Strict Pairwise Comparison** (Compare the strongest complaint of the losers against the strongest complaint of the winners, one-by-one).

  **The Conflict:**
  If we adhere to **Strict Pairwise Comparison** and the **Individualist Restriction**, we compare the one person's complaint (death) against one of the five people's complaints (death). Since the complaints are identical, the single person's complaint blocks the rescue of the others. The other four people's complaints cannot "add up" to outweigh the one, because that would violate the **Individualist Restriction** (summing across persons). Thus, we fail the **Numbers Intuition**.

  **Resolution:**
  The right response is to **weaken Strict Pairwise Comparison**.
  We must allow for a mechanism where the presence of additional people with identical complaints changes the justificatory landscape without resorting to simple summation. Proposals often do this by:
  *   **Relevant Groups:** Allowing individuals to complain as members of a group facing the same burden, where the size of the group matters to the strength of the complaint.
  *   **Ex Ante Shift:** Moving toward the **Ex Ante** preference (Desideratum 5) to argue that everyone has a reason to prefer a principle that maximizes their chance of survival, which naturally accounts for numbers without summing actual burdens.

  Rejecting the **Numbers Intuition** is too high a cost for adequacy. Rejecting the **Individualist Restriction** abandons contractualism. Therefore, the mechanical constraint of *how* we compare complaints (Strict Pairwise) must be the variable that yields.

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most to exclude otherwise attractive proposals is **The Individualist Restriction (Desideratum 4)**.

  **Reasoning:**
  While the **Gravity Threshold** excludes Utilitarianism, the **Individualist Restriction** is the deeper structural barrier. It excludes not only Utilitarianism but also any "moderate aggregative" view that attempts to solve the Trilemma by simply assigning weights to persons and summing them.

  More critically, within the space of contractualist solutions, the Individualist Restriction excludes the most technically promising solution to the aggregation problem: **Ex Ante Contractualism**.
  *   **Why it excludes Ex Ante proposals:** Ex Ante views solve the Numbers Intuition easily (everyone prefers a principle that gives them a 5/6 chance of survival over a 1/6 chance). However, strict adherence to the Individualist Restriction (interpreted Ex Post) demands that the one person who *actually dies* must be able to accept the principle. If the principle was chosen solely because it benefited the *statistical* expectations of the group, the actual loser can reasonably reject it: "I was sacrificed for the sake of others' expectations."
  *   **Why it excludes Utilitarianism:** Obviously, it forbids the core utilitarian move of summing welfare.

  The Individualist Restriction forces the theory into a narrow corridor: it must find a way for numbers to matter (to save the five) without those numbers functioning as a sum of value (to protect the one). This tension is the engine of the entire debate. Any proposal that solves aggregation by smoothing over the distinctness of individual reasons (e.g., by treating the group as a single entity for the sake of calculation) is immediately ruled out by this requirement. It is the constraint that makes aggregation a *problem* for contractualism rather than a simple calculation.
