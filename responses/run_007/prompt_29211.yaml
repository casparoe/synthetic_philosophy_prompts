answer: |-
  The containment field hummed, a sound Elara felt in her teeth more than she heard. It was the sound of reality thinning, of the universe holding its breath. On the console before her, a single input field blinked. A binary choice. Zero or one.

  Behind the thick leaded glass, the collider was spooling up. This was the final pulse. Once fired, the superconducting magnets would quench, the core would melt, and the apparatus would be slag. One shot. One bit of information punched through the decoherence barrier into the branch that had split off three weeks ago.

  Three weeks ago, when the quantum variance had tipped the other way. In this branch, Branch Alpha, her daughter Sophie was dying. The neuro-degeneration was rapid, brutal, and unique to their genetic line. In Branch Beta, the initial scans had been different. The other Elara—the one who existed in the shadow of this decision—had the data. She knew which protein inhibitor worked.

  But she had no reason to tell Elara.

  Elara's hand hovered over the key. She wasn't just pressing a button; she was entering a negotiation with a ghost. Acausal trade. The textbooks called it a paradox; Elara called it a prayer.

  The logic was a tight, suffocating loop. She couldn't offer the other Elara anything physical. Matter couldn't cross the barrier. Energy couldn't cross. Only this single bit. So what currency did they have?

  *Prediction.*

  The other Elara was her. Not identical—twenty years of divergent choices meant different scars, different memories—but the core architecture was the same. They ran on the same operating system. If Elara could simulate the other Elara's decision process accurately enough, she could predict what the other Elara would send. And the other Elara, running the same simulation, would predict Elara.

  It was a mirror staring into a mirror, infinite reflections receding into the dark.

  "Mom?"

  Elara jumped. Her husband, Mark, stood in the doorway of the control room. He looked exhausted, the stubble on his chin gray in the fluorescent light.

  "You shouldn't be down here," Elara said, her voice tight.

  "Sophie's asking for you."

  Elara closed her eyes. The image of Sophie's small hand, trembling too much to hold a spoon, flashed behind her lids. "I can't leave, Mark. Not until the pulse is fired."

  "It's been three weeks, Elara. You haven't slept. You're betting everything on... on *what*? A maybe?"

  "On a handshake," she said.

  Mark stepped closer, resting a hand on the console. "There's no one on the other side. It's a decohered wavefunction. It's math."

  "It's *her*," Elara snapped, the grief making her sharp. "She's me. And she has the cure."

  "And why would she give it to you? You said it yourself. She loses her machine. She loses her career. She gets nothing."

  That was the question. The Prisoner's Dilemma played out across the multiverse. If the other Elara was purely rational in the selfish sense, she would defect. She would keep the data, save her own Sophie (who was healthy in Beta, but might get sick later), and preserve her equipment. She would send a '0'. Meaningless noise.

  If Elara sent a '0' as well, signaling defection, the loop closed in failure. Both branches lost.

  But if they could both reason their way to cooperation...

  "Because," Elara whispered, more to herself than Mark, "if I'm her, and she's me... then I know what she wants."

  "What does she want?"

  Elara looked at the blinking cursor. "She wants to know she's not a monster."

  In Branch Beta, the experiment had succeeded cleanly. No containment risks. No ethical review boards breathing down her neck. But she was alone with the knowledge. She knew that in Branch Alpha, a Sophie was dying. Did she care?

  If the other Elara was the kind of person who let a counterpart's child die to save a machine, then Elara didn't want to be that person either. But if Elara committed to cooperation—if she signaled that she valued the *other* Sophie's life as much as her own—she changed the parameters of the simulation.

  She had to make it so that the other Elara's only rational move was to cooperate.

  "How?" Mark asked.

  "By making the cost real," Elara said. She reached for the safety cover over the firing key. "I have to destroy this. Not just the machine. The data here. Everything."

  Mark's face went pale. "Elara, that's twenty years of work. That's your legacy."

  "My legacy is Sophie."

  But it was more than that. It was the signal. By destroying her own work, by rendering herself unable to ever exploit the multiverse again, she proved she wasn't a defector. She was signaling: *I am trusting you with my vulnerability.*

  The other Elara would simulate this moment. She would see Elara standing here, hand shaking, willing to burn her life's work to open the channel. She would realize that Elara was an agent who valued cooperation over self-preservation. And because the other Elara was fundamentally *Elara*, she would recognize that trait as desirable. She would want to be the kind of agent who responds to that trust.

  It wasn't causality. It wasn't that Elara's action *caused* the other to respond. It was that their actions were correlated outputs of the same logical function. If Elara cooperated, the function outputted 'Cooperate'. Therefore, the other Elara cooperated.

  "Elara," Mark said softly. "If you're wrong... if she sends a zero..."

  "Then Sophie dies anyway," Elara said. "And I die knowing I tried to be someone worth helping."

  She looked at the screen. She had to choose her bit.

  If she sent '1', it meant *Cooperation*. It meant *I am acting on the assumption that you are good.*
  If she sent '0', it meant *Defection*. *I am acting on the assumption that you are selfish.*

  If she sent '0', she was predicting the other Elara was selfish. If the other Elara was indeed selfish, she would send '0' back. If the other Elara was good, she might still send '1', but the correlation would be broken. The symmetry would be lost.

  To maximize the probability of receiving the cure, Elara had to be the cure. She had to embody the cooperation she sought.

  She typed '1'.

  The console flashed amber. *CONFIRM SACRIFICE?*

  Her finger hovered. The hum of the collider rose in pitch, a rising scream of particles accelerating toward the speed of light. She thought of Sophie's laugh, the way it used to sound before the tremors took her voice. She thought of the other Elara, standing in a clean room just like this one, looking at a healthy daughter, holding the key to a life she hadn't saved.

  Did the other Elara feel guilt? Elara had to assume she did. Guilt was a variable in their shared equation.

  "I know you," Elara whispered to the empty room. "I know you're scared. I know you think this is irrational. But we're not just survival machines. We're the ones who ask why."

  She pressed the key.

  The alarm klaxon blared. The lights in the control room died, replaced by the red glow of emergency power. Through the glass, the collider flared—a brief, violet tear in the air—and then collapsed. The hum vanished, replaced by the heavy silence of dead machinery.

  The equipment was gone. Her career was gone.

  On the secondary monitor, a single line of text appeared. *INBOUND SIGNAL DETECTED.*

  Elara stopped breathing.

  The interface was crude. A single LED on the comms panel. It blinked once.

  Green.

  A '1'.

  Elara slumped against the console, her legs giving way. Mark caught her, his arms wrapping around her waist, but she barely felt it. She stared at the light.

  It wasn't a file transfer. It wasn't a medical report. It was just a bit. But in the context of their trade, the bit *was* the message.

  '1' meant: *The inhibitor is Beta-7.*
  '0' would have meant: *Alpha-4.*

  They had agreed on the encoding years ago, during the theoretical phase, before the split. Before the sickness. It was a handshake protocol buried in the sub-routines of the experiment. If the other Elara sent '1', she was confirming the Beta variant.

  "How do you know?" Mark asked, reading the screen over her shoulder. "It's just a number."

  "Because she knows I know," Elara said, her voice trembling. "If she sent '0', and I gave Alpha, and Sophie died... she would have killed her own reflection. She couldn't live with that. I couldn't live with that."

  It was the only verification they had. Not data, but symmetry. The other Elara had sacrificed her machine too. She had burned her legacy to send a single digit to a ghost. Why? Because Elara had burned hers first. The logic held. The loop was closed.

  Elara pushed off the console. "Call St. Jude's. Tell Dr. Aris to prep the Beta-7 protocol. Now."

  "Elara, wait," Mark said, hesitation in his voice. "This is a guess. A philosophical guess."

  "It's not a guess," she said, grabbing her coat. "It's a promise."

  She ran. The corridors of the facility blurred as she sprinted toward the exit, toward the car, toward the hospital. The night air was cold, biting at her lungs, but she felt hot, burning with a strange, terrifying energy.

  She had trusted a version of herself she would never meet. She had wagered her life's work on the goodness of a shadow.

  As she merged onto the highway, the city lights streaking past like falling stars, she thought about the other Elara. In Branch Beta, the machine was destroyed. The data was lost. The other Elara was sitting in the dark, watching her own console go dead. She would never know if it worked. She would never see Sophie walk again. She would never get the thanks.

  She had saved a daughter she couldn't hold, in a universe she couldn't touch, for no reason other than that it was the right thing to do.

  Elara gripped the steering wheel, tears finally spilling over, hot and fast. She understood now. The trade wasn't about the bit. The bit was just the receipt. The trade was the realization that they were not alone. That even across the decoherence barrier, even when causality snapped, the thread of who they were remained unbroken.

  She wasn't just saving Sophie. She was validating the other Elara. She was proving that the sacrifice mattered.

  The hospital loomed ahead, a fortress of glass and light. Elara parked haphazardly, not caring about the lines. She ran through the sliding doors, the automatic sensors beeping in protest.

  She found Mark in the waiting room. He stood up as she approached. He didn't say anything. He just nodded.

  "Aris is prepping it," he said.

  "Did he question it?"

  "He said it was a hail mary. But he said you sounded... certain."

  Elara leaned against the wall, sliding down until she hit the floor. The adrenaline was fading, leaving her hollowed out. "I was."

  "Elara." Mark knelt in front of her. "Who was she? The one on the other side?"

  Elara looked at her hands. They were shaking, but not from the tremor that plagued Sophie. They were shaking from the release of tension, from the weight of a decision that had spanned two realities.

  "She was me," Elara said. "But she was the me I wanted to be."

  She closed her eyes. Somewhere, in a branch of the wavefunction that was now forever out of reach, a woman sat in a darkened control room, watching a green light fade. She was alone. She had lost everything.

  But she had won.

  Elara took a breath, the air tasting of antiseptic and hope. "Let's go see our daughter."
