answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain streaks the window. Elena (Endurantist) stirs her tea; Peter (Perdurantist) sketches a timeline on a napkin.*

  **Elena:** You're drawing a worm again, Peter. I can tell by the jagged line.

  **Peter:** It's a space-time worm, Elena. And it's the only way to make sense of this cup without contradicting myself. Look. Here is the cup at $t_1$, clean. Here it is at $t_2$, stained. If the cup is wholly present at $t_1$ and wholly present at $t_2$, then the *very same object* is both clean and stained. That's a contradiction.

  **Elena:** Only if you strip the time index from the properties. I don't say the cup is "clean" simpliciter and "stained" simpliciter. I say it is clean-at-$t_1$ and stained-at-$t_2$. The object remains the same; the properties are indexed to the times at which it possesses them.

  **Peter:** That's the Problem of Temporary Intrinsics, and I'm afraid indexing doesn't save you. Lewis put it best. Shape is an intrinsic property. To say the cup is "bent-at-$t_1$" and "straight-at-$t_2$" is to turn shape into a relation between the object and a time. But a cup's shape isn't a relation to a date. It's a matter of how the cup is in itself. By relativizing the property, you've saved the object from contradiction by sacrificing the intrinsicality of its properties.

  **Elena:** I'd argue I'm not making shape a relation like "to the left of." I'm saying the object *has* the property in a certain way. It has the property of bent-ness *temporally*. But let's turn the table. Your worm. You say the cup is a 4D entity composed of temporal parts. The $t_1$-part is clean; the $t_2$-part is stained. But tell me, Peter: which part is drinking the tea?

  **Peter:** The whole worm drinks the tea, in the sense that the drinking event is a part of the worm's history.

  **Elena:** No, really. *I* am drinking tea. *Now*. I am not a long snake stretching back to my birth. If I am wholly present now, I can act now. If I am merely a temporal slice of a 4D worm, then "I" don't persist. You haven't explained change; you've analyzed it away. You have variation across parts, like a road that is paved in the city and unpaved in the country. We don't say the road *changes* from paved to unpaved. We say it has different parts. If you're right, nothing ever really changes. Things just have different temporal decorations.

  **Peter:** That's a powerful intuition, Elena, I'll concede that. The phenomenology of change feels like a single subject undergoing alteration. Your view captures the "feeling" of persistence better. It aligns with how we speak: "I was tired yesterday, but I am alert today."

  **Elena:** Thank you. It aligns with reality, not just speech.

  **Peter:** But does it? Consider the cost. To avoid the contradiction of temporary intrinsics, you must accept that "being bent" is really "being bent-at-$t$." You are committed to saying that intrinsic properties are actually relations to times. I find that ontologically costly. I'd rather accept that I am extended in time, just as I am extended in space. My foot is here, my head is there. My 1990-part is young, my 2024-part is older. There is no contradiction because the young part and the old part are numerically distinct.

  **Elena:** But they are parts of *you*.

  **Peter:** Exactly. Just as your head and foot are parts of you.

  **Elena:** Disanalogy. I can lose my foot and remain me. I cannot lose my 1990-part and remain me, because that part *is* me in the past. If I cut off my foot, I change. If I "cut off" my past, I cease to exist. Look, let's test this on something harder. Coincidence.

  **Peter:** The Statue and the Lump?

  **Elena:** Precisely. I have a lump of clay. On Monday, I shape it into a statue. On Tuesday, I squash it. The lump survives the squashing; the statue does not. Therefore, by Leibniz's Law, they have different modal properties. They are distinct objects. Yet, on Monday, they occupy the exact same space.

  **Peter:** And there you have two distinct, wholly present objects in the same place at the same time. That violates the impenetrability of matter. It's ontologically profligate.

  **Elena:** Is it? Or is it just recognizing that constitution is not identity? The lump constitutes the statue. They are distinct things that share matter.

  **Peter:** I'll concede something here, Elena. Your view handles the modal difference very neatly. The statue *could not* survive being squashed; the lump *could*. On my view, the Statue and the Lump are distinct 4D worms. They share all their temporal parts up until Tuesday. They overlap. But to explain why we count them as two, I have to say there are two worms occupying the same region of space-time at $t_1$.

  **Elena:** So you have coincidence too!

  **Peter:** Yes, temporal coincidence of worms. But it feels less paradoxical to me than spatial coincidence of 3D objects. However, I admit, your account of *why* they are different is more direct. You appeal to their identity conditions directly. I have to appeal to their different temporal extensions. It's a bit technical. I grant you, the Endurantist story of the Statue and the Lump is more intuitive regarding their modal profiles.

  **Elena:** I appreciate that. But your view solves the "how many objects" problem in a way mine struggles with. If I say they are distinct, people ask, "How many things are on the pedestal?" I say "Two." They say, "But I only see one." You can say, "One region of space-time is occupied by two overlapping worms." It's weird, but it's consistent. My worry is that if I accept your 4D view to save intrinsics, I lose the subject of experience.

  **Peter:** And my worry is that if I accept your 3D view to save the subject, I lose the coherence of properties.

  **Elena:** So we are at an impasse of intuitions. You prioritize logical consistency regarding properties; I prioritize the unity of the subject.

  **Peter:** It seems so. To converge, one of us has to bite a bullet we find poisonous.

  **Elena:** For me to become a Perdurantist, I would have to accept that "I" am not literally the thing thinking this thought right now. Rather, a temporal stage of me is thinking it, and "I" am the aggregate of those stages. I would have to give up the idea that I am *wholly* here. That feels like a denial of my own existence.

  **Peter:** And for me to become an Endurantist, I would have to accept that properties like shape and color are not monadic. I would have to accept that "being spherical" is actually a relation to a time. That feels like a denial of the nature of properties. It makes the world less qualitative and more relational than it appears.

  **Elena:** Perhaps. Or perhaps it just means time is a special dimension, unlike space. You treat time like space. I treat it as the mode of existence.

  **Peter:** And I treat existence as a quantifier over space-time.

  **Elena:** *(Sips tea)* Well, the tea is hot now. On your view, the hot-stage of the tea exists. On mine, the tea is hot.

  **Peter:** And in five minutes, the cold-stage will exist.

  **Elena:** And in five minutes, the tea will be cold.

  **Peter:** We agree on the prediction, at least.

  **Elena:** We do. We just disagree on who—or what—is doing the drinking.

  **Peter:** *(Folds the napkin worm)* Then I suppose we'll just have to persist through this disagreement in our own ways.

  **Elena:** Wholly.

  **Peter:** Or in parts.

  *(They both smile, and the rain continues to fall against the glass.)*
