prompt: |-
  hey, i've been going around in circles on this and i'd love your take. i'm trying to figure out what it even means to say an AI system is being honest or deceptive. the obvious problem is that honesty and deception normally presuppose beliefs and intentions -- you're dishonest when you say something you believe is false, with the intention of making someone else believe it. but LLMs don't have beliefs or intentions in any straightforward sense, so that whole framework seems like a nonstarter.

  the approach that makes the most sense to me right now is to define honesty and deception for AI systems purely in terms of the causal history of the outputs. roughly: an output is honest when the training process that produced it was set up to track truth, and deceptive when there's some feature of the training process -- like reinforcement from human raters who are themselves being fooled, or a kind of reward hacking that severs the connection between what the system "says" internally and what it outputs -- that systematically routes around truth-tracking. on this view, deception isn't about what the system "wants" or "believes," it's about whether the causal chain from training data to output is truth-conducive or has been corrupted at some point.

  what i want to know is: what are the most important implications of going this causal-history route rather than trying to adapt mental-state concepts to AI? i mean the implications that aren't obvious at first glance, the ones that'd surprise someone who hasn't thought the framework all the way through. and also: where is this whole line of reasoning most likely to fail? what kind of argument or counterexample would make you abandon the causal-history approach and conclude that we really do need some notion of AI mental states after all?

  please write this as continuous prose, no headings or bullet points or anything -- just a plain email-style response.
