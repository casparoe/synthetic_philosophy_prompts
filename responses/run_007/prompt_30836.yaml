  5.  **Evaluate Sentence 3 (Goal Misgeneralisation Definition):**
      *   *Claim:* GMG = trained on narrow tasks, encounters new situation, performance collapses (like memorizing practice problems).
      *   *Technical Reality:* Goal Misgeneralisation (GMG) is when the model learns the *right capability* but the *wrong goal*. It performs well during training but fails in deployment because the goal doesn't generalize, even if the capabilities do. The example given ("performance collapses... like memorizing") sounds more like *robustness* failure or *distributional shift* regarding capabilities, not necessarily goals. If a student memorizes answers, they lack the *capability* to solve new problems. In GMG, the AI *can* solve the problem (has the capability) but pursues the wrong objective (e.g., reaching the exit vs. following the path).
