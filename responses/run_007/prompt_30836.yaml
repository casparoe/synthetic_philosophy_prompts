      *   *Technical Reality:* Inner alignment is specifically about the relationship between the *base objective* (the loss function we optimize) and the *mesa-objective* (the goal the learned model internally pursues). It's not just "want vs. literal instruction" (that sounds more like specification gaming or outer alignment). It's about whether the optimizer inside the model aligns with the optimizer outside the model.
      *   *Verdict:* Misleading/Imprecise. It conflates Outer Alignment (specifying the right goal) with Inner Alignment (the model internalizing that goal). The "literal instruction" part sounds like the specification problem.
      *   *Correction:* Inner alignment is about whether the model's *internal* goal matches the *training* goal, not necessarily the human's vague "want."

