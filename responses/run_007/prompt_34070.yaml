prompt: |-
  Please argue that Wittgenstein's account of religious belief, as developed in his later work, cannot accommodate genuine disagreement between a religious believer and a non-believer — and that this is a serious defect, not a feature. Your argument should engage with the likely Wittgensteinian reply (that the apparent contradiction is an illusion generated by assimilating religious language to factual discourse) and explain why that reply fails. Take a definite position and defend it.
