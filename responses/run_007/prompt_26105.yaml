answer: |-
  The procreation asymmetry is one of the most persistent and vexing puzzles in population ethics. It posits a structural imbalance in how we value potential lives: we generally agree that bringing into existence a person whose life would be net-miserable is morally wrong (the presence of pain is bad), but we do not typically agree that failing to bring into existence a person whose life would be net-happy is morally wrong (the absence of pleasure is not bad). Yet, once a person exists, their pain and pleasure count equally. This raises a metaphysical and ethical question: is this asymmetry a genuine feature of the axiological landscape, or is it a cognitive illusion born of confused reasoning?

  While the asymmetry captures a profound moral intuition regarding the priority of suffering, it is ultimately a **conceptual confusion**. It relies on an inconsistent shifting between impersonal and person-affecting standards of value. The asymmetry cannot survive rigorous logical formulation because it requires the absence of pain to be a "good" without a subject to experience that good, while simultaneously demanding a subject for pleasure to count as a "good." However, rejecting the asymmetry as a logical truth does not require us to abandon the moral insight that motivates it. The intuition is genuine, but its explanation lies not in the structure of value, but in the **asymmetry of moral urgency**.

  To understand why the asymmetry feels so compelling, we must look at its strongest defenses. The most prominent attempt to ground the asymmetry is the **Person-Affecting View**. This view holds that an act can only be good or bad if it makes some particular person better or worse off. On this account, creating a miserable child makes that child worse off than they would have been (non-existent), so it is bad. However, failing to create a happy child does not make anyone worse off, because the "child" who is never conceived does not exist to be deprived. Therefore, it is not bad.

  David Benatar offers a more metaphysical grounding. He argues that while pain is intrinsically bad, pleasure is only good *for* someone. Consequently, the absence of pain is good even if there is no one to enjoy that good, but the absence of pleasure is not bad unless there is someone deprived of it. This aligns with deep-seated intuitions: we feel guilt for bringing a suffering child into the world, but we do not feel guilt for every healthy child we *didn't* conceive. If the asymmetry were false, we might be obligated to procreate as much as possible to maximize happiness, leading to the "Repugnant Conclusion" or an exhausting duty to populate the universe. The asymmetry seems to save us from moral absurdity.

  However, these defenses crumble when subjected to the "Good for Whom?" test. The central confusion of the asymmetry is that it treats the two sides of the equation differently. In the case of the miserable child, the asymmetry implicitly relies on an **impersonal** standard: the world is worse because there is suffering in it. In the case of the happy child, it relies on a **personal** standard: the world is not worse because no specific person was harmed.

  If we apply the impersonal standard consistently, the absence of a happy life is a loss of value to the universe, making non-procreation bad. If we apply the person-affecting standard consistently, the creation of a miserable child is not bad *for* the child, because non-existence is not a state of well-being that can be compared to existence. You cannot be "worse off" existing than not existing, because "not existing" is not a state you occupy. To say the miserable child is harmed is to say they are worse off than they would have been in the state of non-existence. But if non-existence is a state with zero value (neither good nor bad), then existence with net pain is indeed worse. But by the same token, existence with net pleasure is better than zero. If we can compare existence to non-existence to find harm, we must be able to compare them to find benefit. To deny the comparison in one direction but allow it in the other is arbitrary.

  This leads to the real sticking point of the debate: **the comparability of existence and non-existence.** For the asymmetry to be a genuine feature of value, proponents must show that "non-existence" can serve as a baseline for harm but not for benefit. They must demonstrate that the absence of pain has positive value *simpliciter*, independent of a subject. This is metaphysically dubious. Value is typically understood as a relation between a state of affairs and a valuer. To claim that a universe without pain is "good" even if no conscious beings exist to experience it is to posit a form of Platonism about suffering that many find unintelligible.

  Conversely, for the debunkers to win, they must show that we can make sense of "benefit" and "harm" relative to non-existence without falling into the trap of obligatory procreation. The sticking point is not just logical; it is practical. If we reject the asymmetry, do we condemn ourselves to a duty to maximize population? Not necessarily. We can reject the asymmetry as a feature of *value* while maintaining it as a feature of *obligation*. We can acknowledge that creating a happy person adds value to the world (rejecting the asymmetry) without claiming we are morally required to do so (avoiding the absurd duty). This distinction allows us to classify procreation as **supererogatory**—good to do, but not wrong to omit.

  So, why does the confusion persist? If the logic is flawed, why is the intuition so robust? The answer lies in evolutionary psychology and the **priority of suffering**. From an evolutionary standpoint, avoiding harm is more urgent than seeking gain. A predator represents an immediate threat to survival; a missed meal is a deferred cost. This heuristic bleeds into our ethics. Suffering makes a claim on us that happiness does not. Pain demands relief; pleasure merely invites appreciation.

  The procreation asymmetry mistakes this **asymmetry of urgency** for an **asymmetry of value**. We feel that preventing misery is mandatory because suffering is an active affront to well-being, whereas failing to create happiness is a passive omission. The "confusion" arises when we try to codify this urgency into a static axiological rule. We say "the absence of pain is good" when we really mean "the presence of pain is urgently bad." We say "the absence of pleasure is not bad" when we really mean "we have no duty to create pleasure." By conflating the *value* of a state with the *obligation* to bring it about, the asymmetry creates a logical monster that cannot be sustained.

  Furthermore, the asymmetry fails to account for the interests of the parents and society, which are often the actual drivers of these intuitions. When we say it is wrong to create a miserable child, we are often acknowledging the burden placed on the community and the parents, not just the metaphysical status of the child's non-existence. When we say it is not wrong to fail to create a happy child, we are acknowledging parental autonomy. The asymmetry attempts to locate these social and practical constraints within the value of the potential life itself, which is a category error.

  In conclusion, the procreation asymmetry is not a genuine feature of value but a **confusion of categories**. It attempts to ground a practical heuristic (suffering takes priority over happiness) in a metaphysical claim (pain and pleasure have different ontological statuses regarding non-existence). This claim fails because it applies inconsistent standards of comparison to existence and non-existence. To defend the asymmetry, one would need to prove that "good" can exist without a subject in the case of pain, but not in the case of pleasure—a burden of proof that remains unmet.

  However, dismissing the asymmetry as a confusion does not render it useless. It points toward a **prioritarian ethic** where the relief of suffering weighs more heavily than the creation of happiness. We should reject the asymmetry as a logical law of the universe, but we should retain it as a rule of thumb for human action. We are not obligated to create all possible happy people, not because their potential happiness lacks value, but because moral agency is bounded by autonomy and resources. But we are obligated to avoid creating suffering, because harm imposes a debt that non-existence cannot repay. The asymmetry is false as metaphysics, but true as a map of our moral priorities.
