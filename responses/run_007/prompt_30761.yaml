answer: |-
  This is a classic piece of modal metaphysics, often circulating in seminars as a "quick kill" for Transworld Identity (TWI). Your friend is effectively presenting a version of the **Modal Argument for Essentialism**, which David Lewis famously used to motivate Counterpart Theory (CT).

  The short answer is: **You do not need to abandon Transworld Identity.** The argument is valid only if you accept a hidden premise about the nature of predication that most TWI theorists explicitly reject. The failure point is in **Step (5)**, specifically in its application of the Indiscernibility of Identicals (Leibniz's Law) across modal contexts without preserving the world-parameter.

  Here is the detailed diagnosis, the landscape of options, and the costs associated with each.

  ### 1. The Diagnosis: Where the Argument Breaks

  The argument relies on an equivocation regarding **world-relativity**.

  *   **Step (4)** correctly states that in $w$, the plumber is identical to you.
  *   **Step (5)** invokes Leibniz's Law: $\forall x \forall y (x = y \rightarrow (Fx \leftrightarrow Fy))$.
      *   The argument infers: Since the plumber-in-$w$ has the property *being a plumber*, and the plumber-in-$w$ is you, you have the property *being a plumber*.
      *   **The Error:** It drops the world-index. The valid inference is: "Since the plumber-in-$w$ has the property *being a plumber* **in $w$**, and he is identical to you, you have the property *being a plumber* **in $w$**."
  *   **Step (6)** asserts: "Being a plumber is not true of me."
      *   This is true only if qualified: "Being a plumber is not true of me **in the actual world**."

  **The Contradiction is Illusory:**
  There is no contradiction between:
  1.  I have the property *being a plumber* relative to $w$.
  2.  I have the property *not being a plumber* relative to $w_{actual}$.

  To generate the contradiction, the argument requires a hidden premise: **Absolutism about Predication**. This is the claim that if an object has a property, it has it *simpliciter*, not relative to a world. If properties are held *simpliciter*, then TWI indeed leads to the conclusion that all properties are essential (Necessitism).

  **Why it looked fine:**
  In natural language, we suppress the world-parameter. We say "I am a plumber" rather than "I am a plumber at $w$." The argument exploits this linguistic ellipsis to make it seem like "being a plumber in $w$" transfers to "being a plumber" (unqualified), which then clashes with actuality.

  ### 2. How to Save Transworld Identity

  To keep TWI and (1), you must reject the unqualified formulation of Leibniz's Law used in (5). You have two main technical ways to do this, corresponding to the two main flavors of Actualist TWI.

  #### Option A: World-Relative Predication (Kripke/Adams style)
  On this view, instantiation is a three-place relation: $Instantiates(Object, Property, World)$.
  *   **Fix:** Leibniz's Law holds *within* a world, but properties do not transfer across worlds without the world parameter.
  *   **Cost:** You must provide a metaphysical account of how an object can "stand in" to a world other than the one it is actual in. For Kripke, this is often primitive. For Robert Adams, it involves "thisness" (haecceities) that exist in other worlds even if the concrete object does not.
  *   **Semantics:** You retain standard Quantified Modal Logic (QML). $x=y \rightarrow \Box(x=y)$ holds, but $\Box Fx$ does not follow from $Fx$ at a specific world.

  #### Option B: World-Indexed Properties (Plantinga style)
  On this view, objects have vast arrays of world-indexed properties.
  *   **Fix:** In $w$, you have the property *being-a-plumber-in-$w$*. In actuality, you have the property *being-a-plumber-in-$w$* (because you are identical to the guy in $w$). You *also* have the property *not-being-a-plumber-in-$w_{actual}$*. These are distinct, compatible properties.
  *   **Cost:** **Property Proliferation.** For every world and every property, you have a new property. This strikes some as ontologically bloated. It also leans heavily on **Haecceitism** (the view that there are primitive individual essences that distinguish qualitatively identical worlds).
  *   **Benefit:** It preserves the intuition that *you* are in $w$, not just a counterpart.

  ### 3. The Counterpart Theory Alternative (Your Friend's View)

  Your friend argues that TWI forces Essentialism, so we must choose CT. Lewis agrees with your friend's argument entirely. Lewis thinks that if you accept TWI, you *cannot* satisfactorily relativize predication without it collapsing into CT anyway.

  *   **The Move:** Reject Step (4). The plumber in $w$ is **not** identical to you. He is your *counterpart*.
  *   **How it avoids the contradiction:** Leibniz's Law applies only to strict identity. Since you $\neq$ the plumber, his properties do not transfer to you. You have the property *having a counterpart who is a plumber*.
  *   **The Cost (The Humphrey Objection):** As you noted, this seems to miss the point of modality. When I say "I could have been a plumber," I care about *me*, not some distinct individual in another universe who resembles me. CT makes modal claims *about me* true in virtue of facts about *others*.
  *   **Logical Cost:** CT requires revising standard QML. The Barcan Formula and standard necessitation rules often fail or require complex translation schemes.

  ### 4. Are These the Only Two Options?

  No. Your worry that "denying [TWI] just is counterpart theory" is false. You can deny the *argument* without denying TWI. However, there is a third landscape position worth knowing:

  **Strict Actualism / Abstractism (e.g., Linsky & Zalta):**
  Some argue that the distinction between TWI and CT is less sharp than it appears. If "existing in a world" just means "having a property at that world," then the concrete/abstract distinction does the heavy lifting.
  *   **View:** You exist *actually* (concretely). In $w$, you exist *abstractly* (as an individual essence).
  *   **Diagnosis of Argument:** Step (2) is ambiguous. Does "I am in $w$" mean I am concretely present? If no, then the plumber in $w$ is an abstract proxy of me. If yes, we are back to World-Relative Predication.
  *   **Cost:** This requires a robust theory of abstract objects (e.g., Encoding vs. Exemplifying).

  ### 5. Summary of Costs

  | View | Response to Argument | Metaphysical Cost | Logical Cost |
  | :--- | :--- | :--- | :--- |
  | **Transworld Identity (Kripke)** | Reject Step (5). Predication is world-relative. | Primitive modality / Haecceities. | None (Standard QML). |
  | **Transworld Identity (Plantinga)** | Reject Step (6). I have the world-indexed property. | Proliferation of properties / Haecceitism. | None (Standard QML). |
  | **Counterpart Theory (Lewis)** | Reject Step (4). No identity across worlds. | Humphrey Objection (loss of *de re* directness). | Revision of QML (no standard Barcan). |
  | **Modal Essentialism** | Accept Conclusion. Everything is necessary. | Contradicts basic modal intuitions (Contingency). | None. |

  ### 6. Recommendation for Your Seminar

  You should not concede that TWI is false. The argument your friend presents is essentially **Lewis's argument for CT**, and it is question-begging against the TWI theorist because it assumes **Absolute Predication**.

  **Your Reply:**
  1.  **Grant (1) and (2).**
  2.  **Challenge (5).** State clearly: "Leibniz's Law applies to properties had *simpliciter* or properties had *at a specific world*. It does not allow the transfer of a property held *at $w$* to a property held *at actuality* without a bridge principle."
  3.  **Demand the Bridge Principle.** Ask your friend to justify the move from "True of me in $w$" to "True of me (simpliciter)."
  4.  **Point out the Cost.** If they insist on that bridge principle, they are committed to **Modal Essentialism** (the view that everything you are is essential to you). Since they likely reject Essentialism (they probably think *they* could have been a plumber too), they must reject the bridge principle.
  5.  **Conclusion:** Once the bridge principle is rejected, TWI is consistent with contingency. The choice between TWI and CT then rests on other grounds (e.g., the Humphrey Objection vs. Haecceitism), not on this reductio.

  **Final Verdict:** The argument does not have a clean failure point *if* you assume Absolute Predication. But since Absolute Predication is incompatible with the very possibility of contingency (for anyone, TWI or CT), it is a premise no modal realist should accept. The failure is in the **unqualified formulation of predication** in Step (5) and (6). You can keep TWI, keep (1), and keep Leibniz's Law (properly qualified), without sliding into Counterpart Theory.
