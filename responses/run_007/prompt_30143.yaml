prompt: |-
  A podcast I listen to sumarized the Gibbard–Satterthwaite theorem like this: "In the 1970s, Gibbard and Satterthwaite proved that once you have at least three candidates, every possible voting system is vulnerable to strategic voting. The only way to make a voting rule completely immune to manipulation is to hand all the power to a single voter — a dictator — and nobody accepts that. So Arrow's dream of a fair voting method is mathematically impossible: any real election is, at bottom, a game where voters have to bluff about their true preferences instead of just honestly saying what they want." I already knew this wasn't quite the same as Arrow's theorem, and I have a nagging memory that the theorem only bites under certain conditions — something about ranked ballots and single-winner elections — but I can't reconstruct the details. Can you go through the summary and tell me which parts a social choice theorist would accept, which are overstatements or conflations, and whether the final claim about real elections being a bluffing game actually follows from the accurate parts? I'd also like to know what the theorem does and doesn't rule out: are there voting methods that escape it, and does "strategy-proof" mean what the podcast seems to think it means?
