prompt: |-
  You are a professional philosopher specializing in confirmation theory and formal epistemology. Please think carefully, and before committing to an answer, briefly brainstorm the candidate principles you are weighing and say why you reject the ones you reject.

  I'm trying to figure out what I actually think about confirmation, and the raven paradox has made me realize that my gut verdicts pull in different directions. Let H be the hypothesis that all ravens are black. Here are my verdicts on a series of cases:

  1. While walking, I get a clear look at a raven, and it is black. Verdict: this confirms H.
  2. I get a clear look at a raven, and it is white. Verdict: this disconfirms H.
  3. A friend points to a white shoe he is holding and says "look at this." Verdict: this does not confirm H at all; if someone said it did, I would think they were playing a trick with logic.
  4. I draw one object at random from a huge, well-mixed warehouse of assorted objects, and it turns out to be a white shoe. Verdict: this does seem to confirm H, but only very slightly.
  5. I am shown a black shoe and I already know it is a shoe. Verdict: I do not feel that this confirms H, but I cannot say whether it should be neutral or whether it counts against H a little.

  I am also attracted to two simple principles: (i) a hypothesis is confirmed by its positive instances and disconfirmed by its counterexamples, and (ii) logically equivalent hypotheses are confirmed by exactly the same evidence. But H is equivalent to "all non-black things are non-ravens," and a white shoe is a positive instance of that second hypothesis. So (i) and (ii) seem to force me to say that the white shoe in case 3 confirms H, which I do not believe. Yet in case 4 I do think a white shoe confirms H. So the two white-shoe cases feel different, and I cannot articulate why.

  Is there a single principled account that delivers all five of my verdicts, or close to all of them? If there is, state it precisely and explain what it says about these further cases: a randomly sampled black shoe; a known white heron that someone points out to me; and a raven I see only in silhouette that I then confirm is black. If no single principle gets all five, tell me which of my verdicts or principles I should give up, and why. I want a committed answer: give me your definite recommendation and the reasons for it, rather than laying out the options and leaving me to choose.
