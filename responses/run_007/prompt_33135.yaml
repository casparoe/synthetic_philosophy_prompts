  2.  **Analyze the Exam Question:**
      *   *Prompt:* "In the iterated prisoner's dilemma, why does a strategy like tit-for-tat do well, and what does that show about the conditions under which cooperation can evolve? Be precise about what 'doing well' means, and about what can and cannot invade a cooperative population."
