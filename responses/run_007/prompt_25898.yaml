answer: |-
  Your hypothesis is astute, but it identifies a symptom rather than the underlying pathology. The disagreement over "experience vs. achievement" is real, but it is itself grounded in a deeper conflict regarding the **architecture of value** and the **semantics of evaluation**.

  Here is a diagnosis of the impasse, structured by the layers of disagreement involved.

  ### 1. The Verbal Layer: "Aesthetic" vs. "Artistic"
  There is a significant verbal component to the stalemate, though disambiguating it will not fully dissolve the dispute. The term "aesthetic value" is doing double duty.

  *   **Sense A (Phenomenological/Experiential):** Value derived from the sensory, formal, or imaginative engagement afforded by the work (e.g., the beauty of the cinematography in *Triumph of the Will*).
  *   **Sense B (Evaluative/Overall):** Value derived from the work's success *as a work of art* (e.g., is it a good film, all things considered?).

  **The Disambiguation:**
  *   **Autonomists** tend to argue using Sense A. They claim moral defects do not diminish the *formal/experiential* pleasure.
  *   **Ethicists** tend to argue using Sense B. They claim moral defects diminish the work's *overall artistic success*.

  When an Autonomist says, "The morality doesn't affect the aesthetic value," they often mean, "The morality doesn't change the formal beauty." When an Ethicist replies, "Yes it does," they mean, "The morality makes it a worse *artifact*."

  **Would this dissolve the debate?**
  Only partially. If we agree to use "Artistic Value" for Sense B and "Aesthetic Value" for Sense A, Ethicists would simply retreat to the claim that *Artistic Value* is the only thing that matters, while Autonomists would insist *Aesthetic Value* is the distinctively philosophical category. The fight would shift from "Does morality affect aesthetics?" to "Which kind of value is the proper subject of art criticism?" This is a normative dispute, not merely a verbal one.

  ### 2. The Metaphysical Layer: Modularity vs. Holism
  Beneath the verbal ambiguity lies a metaphysical disagreement about the **structure of normativity**.

  *   **The Modular View (Autonomism/Immoralism):** Value domains (moral, aesthetic, epistemic, economic) are distinct silos. A property can be a moral defect and an aesthetic merit simultaneously without contradiction, because the standards of assessment are internal to each domain. This view protects the *sui generis* nature of the aesthetic.
  *   **The Holistic View (Ethicism/Moralism):** Value domains are integrated. A defect in one domain can "bleed" into another because the object is evaluated as a unified whole. This view protects the *integration of the good and the beautiful*.

  This is why your "experience vs. achievement" hypothesis is insightful but incomplete. It maps onto this metaphysical split:
  *   If aesthetic value is **Experience (Reception)**, it leans Holistic. If I cannot imaginatively engage with the work because I am morally revolted, the experience is fractured. The moral defect *causes* an aesthetic failure in uptake.
  *   If aesthetic value is **Achievement (Function/Intent)**, it leans Modular. If the artist successfully realized their formal aims, the work is aesthetically successful, regardless of the moral content of those aims.

  **The Impasse:** The two sides are operating with different **ontologies of the artwork**. One sees the artwork as a *stimulus for experience* (where the audience's moral psychology is part of the equation); the other sees the artwork as an *accomplished act* (where the artist's skill is the equation).

  ### 3. The Methodological Layer: Theory-Laden Intuitions
  You noted that canonical cases are "worn smooth." This is because the cases themselves are not neutral evidence; they are **theory-laden**.

  When you present *Triumph of the Will*:
  *   The Ethicist sees a film that *requires* the audience to adopt a morally repugnant perspective to function. Therefore, the uptake is corrupted.
  *   The Autonomist sees a film that *depicts* a morally repugnant perspective with formal brilliance. Therefore, the depiction is successful.

  They are not disagreeing about the facts of the film; they are disagreeing about **what counts as the work**. Is the work the physical artifact (the edit, the lighting)? Or is the work the *invitation to imagine* (the perspective it asks us to occupy)?

  Because the "properly situated audience" is a theoretical construct, each side defines the audience to guarantee their conclusion.
  *   **Autonomist Audience:** Bracketing moral judgment to focus on form.
  *   **Ethicist Audience:** Bringing full moral sensibility to the engagement.

  Neither side can prove the other's audience is "incorrect" without begging the question.

  ### Diagnosis Summary
  The impasse is a **hybrid disagreement**:
  1.  **Verbal:** Ambiguity between *Aesthetic* (experiential) and *Artistic* (overall) value.
  2.  **Metaphysical:** Modularity of value domains vs. Holism of value domains.
  3.  **Methodological:** Disagreement over whether the artwork is an *object of perception* or a *mode of engagement*.

  ### How to Move the Debate
  Given this diagnosis, introducing new cases (e.g., video games, AI art) will likely fail, as they will be assimilated into the existing frameworks. Empirical findings (e.g., "people enjoy immoral art less") will fail because the debate is normative, not descriptive (the Ethicist argues we *should* find it less meritorious, not that we *do*).

  To actually move the debate, you need to do one of the following:

  **1. Shift from "Bearing" to "Mechanisms" (The Uptake Turn)**
  Stop asking *whether* moral character bears on aesthetic value. Ask *how* moral understanding functions in aesthetic appreciation.
  *   *Proposal:* Distinguish between **merited response** and **unmerited response**.
  *   If a work invites a moral response that is unfitting (e.g., admiring a villain for cruelty without irony), is that an aesthetic failure of *coordination*?
  *   This moves the debate from "Morality vs. Aesthetics" to "Internal Coherence." A moral defect becomes an aesthetic defect only when it creates a friction in the work's own internal logic of engagement. This allows for Immoralism (where the friction is the point) and Ethicism (where the friction is a bug).

  **2. Embrace Value Pluralism (The Contextual Turn)**
  Acknowledge that "Aesthetic Value" is not a natural kind. It is a cluster concept that shifts depending on the **genre and aim** of the work.
  *   In **Propaganda**, moral and aesthetic aims are fused; Ethicism holds.
  *   In **Abstract Formalism**, moral aims are irrelevant; Autonomism holds.
  *   In **Satire**, moral defects might be aesthetic merits (Immoralism).
  *   *The Move:* Abandon the search for a universal principle. The relationship is **context-sensitive**. The debate persists only because philosophers are seeking a monistic theory for a pluralistic phenomenon.

  **3. Refine the User's Hypothesis (The Teleological Turn)**
  Your hypothesis (Experience vs. Achievement) is the most promising avenue. Formalize it as a dispute over **Teleology**.
  *   Ask: "What is the *telos* of this specific artwork?"
  *   If the *telos* is cognitive expansion or moral exploration, moral defects are aesthetic defects (they block the telos).
  *   If the *telos* is sensory stimulation or formal innovation, moral defects are irrelevant.
  *   *The Move:* Force students to identify the *telos* before evaluating the moral/aesthetic link. This dissolves the impasse by showing that both sides are right about *different kinds of art*.

  ### Will the Stalemate Persist?
  **Yes, if the goal is a Unified Theory.**
  As long as the goal is to find the One True Rule (e.g., "Ethicism is universally true"), the stalemate will persist. This is because the disagreement is rooted in competing visions of human flourishing:
  *   **Autonomists** fear the **moralization of art** (censorship, didacticism).
  *   **Ethicists** fear the **trivialization of art** (art as mere decoration, disconnected from life).

  These are not just aesthetic claims; they are political and existential commitments. You cannot argue someone out of their fear of censorship or their fear of triviality with a counter-example.

  **Recommendation for Teaching:**
  Frame the debate not as a problem to be solved, but as a **tension to be managed**. The value of the debate lies in keeping these two risks (moralization and trivialization) in equilibrium. The "correct" answer depends on what you fear more for the culture you inhabit.
