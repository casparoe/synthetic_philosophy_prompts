answer: |-
  You have identified a genuine and widely discussed ambiguity in the field, though there is no single, universally canonical term for the *rhetorical pattern* itself. However, there is a precise technical distinction that validates your observation, and a critical term that is gaining traction to describe the phenomenon.

  Here is how to characterize this conflation, distinguished from specification gaming and simple drift.

  ### 1. The Technical Distinction: Intent vs. Impact Alignment
  The most rigorous way to label this in a technical context is the distinction between **Intent Alignment** and **Impact Alignment**, formalized by Kenton et al. (2021) in *"Alignment of Language Agents."*

  *   **Intent Alignment:** The system is aligned if it *tries* to do what the principal (user/operator) wants it to do. This is a claim about the system's objectives or motivations relative to the user's prompt.
  *   **Impact Alignment:** The system is aligned if its *actual outcomes* are good (safe, beneficial, non-catastrophic) for humanity.

  Your observation is that current "alignment" techniques (RLHF, constitutional AI) are primarily solving for **Intent Alignment** (specifically, fidelity to the immediate user's prompt), but the papers often imply progress on **Impact Alignment** (safety/beneficiality).

  A model that faithfully executes a malicious user's request is **Intent Aligned** but **Impact Misaligned**. By labeling instruction-following improvements as "alignment" without qualification, researchers borrow the normative weight of Impact Alignment while only demonstrating Intent Alignment.

  ### 2. The Sociological Label: "Alignment Washing"
  While "Intent vs. Impact" describes the technical gap, the term emerging in critical discourse to describe the *reporting pattern* is **Alignment Washing**.

  Parallel to "greenwashing," this refers to the practice of marketing incremental improvements in controllability or compliance as substantive progress on existential safety. It captures the strategic element you noted: "borrowing the gravitas of the broader [problem]."

  *   **Why it fits:** It implies a strategic ambiguity. The term "alignment" is used because it attracts funding and attention associated with AI safety, even when the work is closer to "product reliability" or "preference tuning."
  *   **Distinction from Drift:** Terminological drift is passive and organic (words change meaning over time). Alignment washing is often active and strategic (using the ambiguity to claim safety progress).

  ### 3. The Logical Structure: The Motte-and-Bailey
  If you are analyzing the argumentation structure in papers, this is a classic **Motte-and-Bailey fallacy**.

  *   **The Motte (Defensible):** "We improved the model's ability to follow instructions and adhere to constraints." (This is empirically verifiable and technically solvable.)
  *   **The Bailey (Controversial):** "We made progress on AI alignment/safety." (This implies the system is safer for society, which is not guaranteed by instruction following.)
  *   **The Conflation:** When challenged on safety, researchers retreat to the Motte ("Well, it follows instructions better"). When seeking funding or attention, they occupy the Bailey ("We are solving alignment").

  ### 4. How to Distinguish from Specification Gaming
  You correctly noted that this is not specification gaming.
  *   **Specification Gaming** is a failure mode of the *agent* (the AI finds a loophole in the reward function).
  *   **Alignment Washing / Intent-Impact Conflation** is a failure mode of the *research discourse* (the humans conflate fidelity with safety).

  In specification gaming, the system *looks* aligned but isn't. In the pattern you describe, the system *is* aligned (to the user) but the *claim* is that this equals safety.

  ### 5. Recommended Terminology for Your Work
  Since you are writing as a PhD student, you want terms that are precise enough for peer review but critical enough to mark the distinction. I recommend using the **Intent/Impact** framework as your primary anchor, supported by the **Compliance** distinction.

  **Suggested phrasing:**
  > "Current literature often conflates **compliance fidelity** (the accuracy with which a model executes user intent) with **normative alignment** (the assurance that executed intents yield safe outcomes). While techniques like RLHF improve **intent alignment**, they do not necessarily address **impact alignment**, particularly in adversarial deployment contexts. We term the rhetorical conflation of these distinct objectives **alignment washing**."

  **Alternative labels if you need a noun for the phenomenon:**
  *   **The Compliance-Alignment Conflation:** Neutral and descriptive.
  *   **Instrumental Alignment Claim:** Highlights that the model is being treated as a tool (instrument) rather than an agent with independent safety constraints.
  *   **Principal-Agent Reductionism:** Reducing the multi-stakeholder safety problem to a single principal-agent optimization problem.

  ### Summary
  There is no single ISO-standard term, but **Intent vs. Impact Alignment** is the technical vocabulary you need to make the distinction rigorous, and **Alignment Washing** is the critical term for the rhetorical pattern.

  Your intuition is correct: the field has largely solved "make the AI do what I say" (Control/Compliance) and is labeling it "make the AI do what is good" (Alignment/Safety). Distinguishing these is crucial for your work.
