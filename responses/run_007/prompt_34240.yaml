          *   Consensus in economic history favors Hayek/Priya on the *economic* grounds, though Lange won the *theoretical* point on static efficiency. I need to weigh this carefully. Usually, Hayek is considered the victor in the long run because economies are dynamic, not static. Priya captures the Hayekian nuance better.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Correction on Move 4 (Priya):* Priya says the Board needs to know "which price to raise." In Lange's model, the Board raises the price of the good *in excess demand*. So if steel is in excess demand, they raise steel. They don't need to know about aluminum unless steel demand shifts to aluminum. Priya's point is slightly imprecise technically but philosophically correct about the bottleneck. I should note this nuance.
      *   *Correction on Move 6 (Priya):* This is the "Incentive Compatibility" argument. Mises started with calculation, Hayek moved to knowledge, later Austrians (Kirzner) moved to entrepreneurship. Priya is channeling the later Austrian synthesis.
      *   *Marcus's strongest point:* The logical possibility of simulation.
