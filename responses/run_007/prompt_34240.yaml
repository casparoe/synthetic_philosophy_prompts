          *   Right: Lange's mechanism (trial and error, $P=MC$).
          *   Mistaken/Overstated: Assumes the mechanism works frictionlessly. Ignores the *source* of the price adjustment.
      *   *Round 1 (Priya):*
          *   Right: Hayek's knowledge problem (tacit, dispersed). Inventory isn't enough.
          *   Missing: Lange's model *does* use inventory signals, so it's not purely guesswork.
      *   *Round 2 (Marcus):*
          *   Right: Prices compress information in both systems.
          *   Mistaken: Equates the *adjustment mechanism*. In markets, owners adjust; in Lange, bureaucrats adjust.
      *   *Round 2 (Priya):*
          *   Right: Decentralized vs. Centralized adjustment. The "which price" problem.
          *   Missing: The CPB in Lange's model reacts to *aggregate* excess demand, so it doesn't need to know *why*, just *that* there is excess demand. (Though Priya argues knowing *which* price is the issue).
      *   *Round 3 (Marcus):*
          *   Right: Markets involve uncertainty too.
          *   Mistaken: Ignores the residual claimant issue.
      *   *Round 3 (Priya):*
          *   Right: Incentives and entrepreneurship. The P&L test is crucial for *discovery*, not just allocation.
          *   Missing: Lange did propose incentives, but they aren't the same as ownership.

      *   *What both miss:*
          *   The role of *entrepreneurship* (Kirzner).
          *   The dynamic nature of the economy (change vs. static equilibrium).
          *   The political economy aspect (can the CPB remain neutral?).
          *   Modern context (Big Data/AI arguments).

      *   *Conclusion:* Who is more right?
          *   Marcus is right on the *logic* of the model (Lange showed calculation is logically possible).
