  We're doing the Qiwulun chapter in my Chinese philosophy module and I keep getting stuck on the butterfly passage, especially the ending. We're using the Watson translation:

  "Once Chuang Chou dreamt he was a butterfly, a butterfly flitting and fluttering around, happy with himself and doing as he pleased. He didn't know he was Chuang Chou. Suddenly he woke up and there he was, solid and unmistakable Chuang Chou. But he didn't know if he was Chuang Chou who had dreamt he was a butterfly, or a butterfly dreaming he was a Chuang Chou. Between Chuang Chou and a butterfly there must be some distinction! This is called the Transformation of Things."

  My lecturer said the last two sentences are doing a lot of work, and that its a mistake to read this as just the same as Descartes' dream argument. I sort of see why it's not the same but I can't articulate it. The "distinction" line confuses me: right before it he's said he can't tell which one he is, and then he says between Chuang Chou and a butterfly there must be some distinction. Also I thought the "transformation of things" was about boundaries between things dissolving, so isnt the last line contradicting that? Could you help me work through what those last two sentences are doing, and how Zhuangzi's worry differs from the standard skeptical worry about not being able to tell whether you're dreaming?

  Oh and could you answer in British English please? Thanks!
