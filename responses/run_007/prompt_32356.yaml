answer: |-
  Here is the plain truth upfront: **The project of constructing a single, complete, consistent ethical theory for infinite populations that satisfies all standard intuitive axioms is mathematically impossible.**

  If you are looking for a framework that functions like standard utilitarianism (a complete ordering satisfying Pareto and Anonymity), you are looking for something that cannot exist. The impossibility theorems are not minor technical glitches; they are structural features of infinity interacting with aggregation.

  Therefore, listing desiderata is not a menu of features to be implemented. It is a map of a minefield. Any adequate framework must explicitly state which desiderata it is *violating* and why. Below are the standard desiderata, the cases they aim to resolve, and the specific points of collapse.

  ---

  ### I. Formal Constraints (The Logic of Choice)
  These are requirements for the evaluation system to function as a decision procedure.

  **1. Transitivity**
  *   **Requirement:** If Outcome A is better than B, and B is better than C, then A must be better than C.
  *   **Argument:** Without transitivity, money-pump arguments apply. You could be induced to trade A for B, B for C, and C for A, ending up where you started but worse off (or simply acting incoherently).
  *   **Status:** **Non-negotiable** for almost all camps. Giving this up essentially abandons rational choice theory.

  **2. Completeness**
  *   **Requirement:** For any two outcomes A and B, the theory must say either A > B, B > A, or A ~ B. No "undefined" comparisons.
  *   **Argument:** If a theory is incomplete, it cannot guide choice in all scenarios. If you face an undefined comparison, you have no rational basis to choose.
  *   **Status:** **Highly Contested.** This is the first major casualty. Many infinite ethicists (e.g., Bostrom, Beckstead & Thomas) accept *partial orderings*. They admit that some infinite worlds are simply incomparable. If you demand completeness, you force the theory to make arbitrary distinctions.

  **3. Representability (Real-Valued Function)**
  *   **Requirement:** There exists a function $W$ mapping outcomes to real numbers such that $A > B \iff W(A) > W(B)$.
  *   **Argument:** We want to do math. We want to maximize expected value.
  *   **Status:** **Often Sacrificed.** Due to impossibility results (Basu & Mitra), you often cannot map infinite utility streams to real numbers while preserving Pareto and Anonymity. Some propose using hyperreal numbers (surreal utilities) to restore this, but this introduces its own metaphysical baggage.

  ---

  ### II. Ethical Axioms (The Moral Intuitions)
  These are requirements for the theory to align with basic moral judgments.

  **4. Strong Pareto**
  *   **Requirement:** If every individual in Outcome A has utility $\ge$ their utility in B, and at least one has strictly $>$, then A > B.
  *   **Argument:** It is hard to defend a theory that says making everyone better off (and someone strictly better off) is not an improvement.
  *   **Status:** **Non-negotiable for most,** but technically incompatible with Anonymity + Completeness in infinite settings.

  **5. Weak Pareto**
  *   **Requirement:** If every individual is strictly better off in A than in B, then A > B.
  *   **Argument:** A weaker version of Strong Pareto.
  *   **Status:** **Non-negotiable.** Giving this up is tantamount to abandoning welfarism.

  **6. Anonymity (Permutation Invariance)**
  *   **Requirement:** The value of an outcome depends only on the *set* of utility levels, not *who* holds them. Swapping utilities between individuals (finite or infinite permutations) should not change the value.
  *   **Argument:** Moral arbitrariness. Why does person #1 matter more than person #1,000,000?
  *   **Status:** **Contested.** To avoid impossibility results, some theories restrict Anonymity to *finite* permutations only. Others (like "Rank-Discounted Utilitarianism") explicitly violate it to make sums converge.

  **7. Separability (Independence of Irrelevant Alternatives / Locality)**
  *   **Requirement:** If two outcomes differ only in a finite subset of individuals, the ranking should depend only on those individuals. Alternatively, adding a constant to all utilities shouldn't flip rankings.
  *   **Argument:** Distant changes shouldn't dictate local ethics. If I can save a life here, whether there are infinite people suffering in a distant galaxy shouldn't negate that good.
  *   **Status:** **Contested.** In infinite settings, "local" changes can have global summation effects (e.g., shifting a sequence).

  ---

  ### III. Test Cases (The Phenomena to Explain)
  A theory must deliver verdicts on these specific scenarios. If it returns "undefined" too often, it is useless. If it returns counter-intuitive verdicts, it is rejected.

  **8. The "Paradise vs. Hell" Case (Cardinality)**
  *   **Case:** World A has $\aleph_0$ people at utility +10. World B has $\aleph_0$ people at utility -10.
  *   **Desideratum:** A > B.
  *   **Problem:** Standard sum-utilitarianism says $+\infty$ and $-\infty$ are both undefined or equal depending on limits.
  *   **Requirement:** The theory must distinguish equal cardinalities with different average/integral values.

  **9. The "Shifting" Case (Spatial/Temporal Translation)**
  *   **Case:**
      *   World A: Utilities (1, 2, 3, 4, 5...)
      *   World B: Utilities (2, 3, 4, 5, 6...)
  *   **Desideratum:** B > A (Everyone in B is better off than their counterpart in A).
  *   **Problem:** If you map individuals by index, Strong Pareto says B > A. But if you permute indices (Anonymity), the sets of utilities are identical ({1, 2, 3...}), so A ~ B.
  *   **Requirement:** The theory must resolve the tension between Pareto and Anonymity.

  **10. The "Overtaking" Case (Growth)**
  *   **Case:**
      *   World A: (1, 1, 1, 1...)
      *   World B: (0, 0, 0, 0... 100, 100, 100...) where the 100s start at some finite point $N$.
  *   **Desideratum:** B > A eventually.
  *   **Requirement:** The theory must handle limits. The "Overtaking Criterion" is the standard solution here (B is better if there exists an $N$ such that for all $n > N$, sum(B) > sum(A)).
  *   **Constraint:** This creates incompleteness. Some sequences oscillate and never overtake.

  ---

  ### IV. The Impossibility Results (The Hard Constraints)
  This is the section that answers your demand to flag jointly unsatisfiable subsets. You cannot have all of the above.

  **1. The Basu & Mitra Theorem (2003)**
  *   **Conflict:** **Strong Pareto + Anonymity + Completeness (Real-valued representation).**
  *   **Result:** There is no social welfare function on infinite utility streams that satisfies Strong Pareto and Anonymity (even for finite permutations) and is representable by a real-valued function.
  *   **Implication:** You must drop Completeness (accept partial orders), drop Strong Pareto, drop Anonymity, or move to Hyperreals.

  **2. The Zame Theorem (2007)**
  *   **Conflict:** **Strong Pareto + Anonymity + Continuity.**
  *   **Result:** You cannot have a continuous social welfare relation that satisfies Pareto and Anonymity.
  *   **Implication:** Infinite ethics is inherently "jumpy." Small changes in the utility stream can cause discontinuous flips in value.

  **3. The "Egalitarianism Impossibility" (Lauwers, Valkonen)**
  *   **Conflict:** **Equity + Pareto + Finite Anonymity.**
  *   **Result:** Certain definitions of intergenerational equity are logically incompatible with the Pareto principle in infinite horizons.
  *   **Implication:** You cannot be strictly Paretian and strictly Egalitarian over infinite time.

  ---

  ### V. The Verdict: What to Keep and What to Kill

  If you are evaluating a proposal, check where it sits on these trade-offs. There is no "correct" spot, only different philosophical costs.

  | Requirement | Camp A: The Aggregativists (e.g., Hyperreal Utilitarians) | Camp B: The Partial Order Theorists (e.g., Beckstead & Thomas) | Camp C: The Finitists / Discounters |
  | :--- | :--- | :--- | :--- |
  | **Completeness** | **Keep.** (Use Hyperreals/Surreals to force comparisons). | **Drop.** (Accept incomparability). | **Keep.** (By making the infinite finite via discounting). |
  | **Strong Pareto** | **Keep.** | **Keep.** | **Keep.** |
  | **Anonymity** | **Keep.** | **Keep.** | **Drop.** (Discounting privileges the present/near). |
  | **Real-Valuedness** | **Drop.** (Use Hyperreals). | **Drop.** (No function needed). | **Keep.** (Discounting restores convergence). |
  | **Main Cost** | Metaphysical baggage of Hyperreals; non-unique extensions. | Theory often fails to guide action (too many "undefined" cases). | Discriminates against future generations arbitrarily. |

  ### VI. The Meta-Critique: Is the Project Itself Flawed?

  You asked to say it plainly if the idea of laying out desiderata is the problem. **It is.**

  The lesson of the impossibility results is not that we haven't found the right theory yet. The lesson is that **the structure of "rational choice under a single ordering" is incompatible with the structure of "infinite populations."**

  1.  **Aggregation is the Culprit:** The desire to sum utilities (aggregationism) is what breaks when $N \to \infty$. If you insist on aggregation, you must accept Hyperreals (which lack standard Archimedean properties) or Incompleteness.
  2.  **The "Theory" Might Be a Heuristic:** An adequate framework might not be a *theory* in the sense of a function $f(outcome) = value$. It might be a set of dominance rules (e.g., "If A Pareto-dominates B, choose A; otherwise, no fact of the matter").
  3.  **Context Dependence:** It is possible that infinite ethics requires contextual rules. Anonymity might hold for spatial infinities but not temporal ones (due to causality). A single universal theory might be the wrong goal.

  **Conclusion:**
  Do not look for a proposal that satisfies all the desiderata above. It does not exist. When reading the next proposal, do not ask "Does this solve infinite ethics?" Ask **"Which impossibility theorem does this bypass, and which intuitive axiom did it sacrifice to do so?"**

  If a proposal claims to satisfy Strong Pareto, Anonymity, and Completeness using standard real numbers, it contains a mathematical error. If it satisfies them using Hyperreals, ask if you accept the metaphysics of infinitesimals. If it accepts Incompleteness, ask if you can live with a moral theory that sometimes says "there is no right answer."

  The desiderata are not a checklist for success; they are a diagnostic tool for identifying a theory's philosophical cost.
