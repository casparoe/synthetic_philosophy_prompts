answer: |-
  Yes, the logical mechanism you're describing is called **Backward Induction**, and the contradiction between its predictions and actual human behavior is most famously encapsulated by the **Centipede Game Paradox**.

  The logic you outlined is the exact definition of **Backward Induction**: you start at the final node of a decision tree, determine the rational move there, and work backward to the present to find the optimal strategy at every step. In game theory, this leads to a **Subgame Perfect Equilibrium**, which dictates that in any finite game with a known end where defection is dominant at the last step, rational players should defect immediately at the first step. This theoretical collapse is often referred to as the **Unraveling Result**. Your chip bag scenario is a variant of the **Centipede Game** (invented by Robert Rosenthal in 1981), while the group project and summer plan examples align with the **Finite Repeated Prisoner's Dilemma**.

  The "puzzle" you're noticing—why the unraveling doesn't happen in practice—is a core topic in **Behavioral Game Theory**. There are three main explanations for the gap between the logic and the behavior:

  1.  **Uncertainty About Rationality (Reputation Models):** This is the most robust theoretical explanation. If players believe there is even a tiny chance their opponent is *not* a purely rational maximizer (e.g., they might be altruistic or vindictive), it becomes rational to cooperate early on to build a reputation or test the other person. This breaks the backward induction chain because the second-to-last person isn't *certain* the last person will defect.
  2.  **Social Preferences:** Standard game theory assumes people only care about their own payoff. In reality, people have preferences for fairness, reciprocity, and altruism. If taking the whole bag causes guilt or social shame, the "payoff" structure changes, and passing the bag becomes the rational choice.
  3.  **Bounded Rationality:** Backward induction requires significant cognitive effort, especially in long chains. Most people don't actually compute 20 steps ahead; they use heuristics like "cooperate until the very end," which yields better results than immediate defection.

  While **Centipede Game Paradox** is the specific name for the chip-style scenario, there are closely related terms depending on the context. The **Chainstore Paradox** (proposed by Reinhard Selten) applies this same logic to market competition and deterrence. The **Endgame Effect** is the empirical observation that cooperation tends to drop off as the end approaches, even if it doesn't unravel completely from step one. Finally, **Unraveling** is used more broadly in economics (like in labor markets or insurance) to describe situations where asymmetric information causes a market to collapse from the top down, though the logical structure is similar.
