  **MEMORANDUM**

  **TO:** Investment Advisory Committee
  **FROM:** Graduate Representative (Decision Theory)
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on "Pasadena Note" Proposal

  **Recommendation**
  I recommend the Committee vote to reject the contract in its current form at Thursday's meeting, authorizing negotiation only if a hard liability cap is implemented to render the expected value well-defined.

  **Settled Mathematics**
  We agree on the underlying mathematics: the payoff structure generates the alternating harmonic series. It is settled that this series is conditionally convergent, not absolutely convergent. Consequently, the Lebesgue integral (standard expected value) is undefined, and by the Riemann Rearrangement Theorem, the sum depends on the order of terms. It is also settled that the magnitude of payoffs ($2^n/n$) grows exponentially, quickly exceeding the liquidity of any plausible counterparty or the University itself.

  **Contested Decision Principles**
  The disagreement lies in how to act given the undefined expectation.
  1.  **Weak Expectation (Principal Value):** Proponents of acceptance rely on the limit of partial sums in natural order ($\ln 2 \approx 0.69$). *Alternative:* This summation method is contested because the sample mean of repeated trials does not converge to this value almost surely; relying on it assumes a decision rule (Weak Expectation) that is not standard in fiduciary finance.
  2.  **Fiduciary Prudence:** Proponents of rejection argue that undefined risk precludes rational pricing. *Alternative:* Some theorists argue that undefined expectations can still be managed via utility bounds, though this requires consensus on a specific utility function which we lack.

  **Analysis of Counterparty Incentives**
  We must address the strongest consideration from the group urging immediate acceptance: that the Weak Expectation ($\ln 2$) plus the fee ($0.90) yields a clear positive value ($1.59). While mathematically coherent under the Principal Value rule, this view ignores the financial reality of the tails. The counterparty is offering a fee to take the opposite side of a gamble with undefined downside. This suggests they are pricing in the University's inability to settle large negative obligations (default risk). If the coin lands on a high even number $n$, the University owes quintillions; we will default, and the counterparty collects the fee without paying the positive tails that balance the ledger. Accepting based on Weak Expectation ignores this asymmetric default risk.

  **Path Forward**
  A hard cap on maximum payment (e.g., $1 million per note) converts the series into a finite sum, making the expectation well-defined and calculable under standard theory. This satisfies the fiduciary requirement for defined risk while allowing us to evaluate the fee against a real number. Without this cap, we are effectively selling the University's credit rating on a tail event we cannot model.

  ***

