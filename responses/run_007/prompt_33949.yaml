      *   *The "Request" Argument in Code:* If I have a function `acceptHorse(Horse h)`, I can pass `new WhiteHorse()`. If I have `acceptWhiteHorse(WhiteHorse wh)`, I cannot pass `new BlackHorse()`. Gongsun Long focuses on the fact that `acceptHorse` accepts *more* than `acceptWhiteHorse`, so the *requirements* (the types themselves) are not identical.

