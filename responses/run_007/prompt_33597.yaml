      *   *Indicatives in Narrative:* "If he is in the room, he is hiding." This is epistemic (what the character knows).
      *   *Advice:* The philosophical stalemate doesn't break the *utility* of conditionals. In fact, the *tension* between the two types is a narrative tool. (e.g., A character believes an indicative "If I go, she'll be there," but the reality is a counterfactual "If I had gone, she would have been there").
