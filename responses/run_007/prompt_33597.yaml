      *   *Diagnosis:* It's a *hybrid* impasse. Partly metatheoretical (what is meaning?), partly formal (mathematical constraints on probability), and partly psychological (how do humans process these?).
      *   *Key Reason:* The "Triviality Results" (Lewis, Gibbard). If you try to make indicatives truth-conditional *and* match their probability to conditional probability, you get a contradiction. So you *must* give up one. Either meaning isn't truth conditions, or meaning isn't conditional probability. This makes it look empirical/psychological, but it's actually a formal constraint on the *model*.

