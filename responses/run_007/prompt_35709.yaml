  # Risk Preference Sorting Quiz

  **Instructions:** For each question, select the option you genuinely prefer. Assume all payments are real, immediate, and in cash. There are no "right" answers, only consistent ones.

  **Q1.** Choose between:
  *   **A:** $1,000,000 for sure.
  *   **B:** 89% chance of $1,000,000, 10% chance of $5,000,000, 1% chance of $0.

  **Q2.** Choose between:
  *   **A:** 11% chance of $1,000,000, 89% chance of $0.
  *   **B:** 10% chance of $5,000,000, 90% chance of $0.

  **Q3.** Choose between:
  *   **A:** $3,000 for sure.
  *   **B:** 80% chance of $4,000, 20% chance of $0.

  **Q4.** Choose between:
  *   **A:** 25% chance of $3,000, 75% chance of $0.
  *   **B:** 20% chance of $4,000, 80% chance of $0.

  **Q5.** Choose between:
  *   **A:** A fair coin toss: Heads you win $150, Tails you lose $100.
  *   **B:** Do nothing ($0).

  **Q6.** Imagine you must choose between **X** (50% $1,000, 50% $0) and **Y** (100% $450).
  *Condition:* You will receive your payoff, but you will **never** be told what the unchosen option would have paid.
  *   **A:** Choose X.
  *   **B:** Choose Y.

  **Q7.** Imagine you must choose between **X** (50% $1,000, 50% $0) and **Y** (100% $450).
  *Condition:* You will receive your payoff, and you **will be told** exactly what the unchosen option would have paid.
  *   **A:** Choose X.
  *   **B:** Choose Y.

  **Q8.** Choose between:
  *   **A:** 50% chance of $100, 50% chance of $50.
  *   **B:** 50% chance of $100, 50% chance of $40.

  **Q9.** Consider three options: **P** ($50 sure), **Q** (50% $100, 50% $0), **R** (50% $105, 50% $0).
  *   **9a:** Choose between **P** and **Q**.
  *   **9b:** Choose between **Q** and **R**.
  *   **9c:** Choose between **P** and **R**.

  **Q10.** Choose between:
  *   **A:** 50% chance of $100, 50% chance of $0.
  *   **B:** 100% chance of $45.
  *(Note: This pair is designed to test local utility curvature.)*

  ***

  # Scoring Key

  Record your answers as a string (e.g., 1A, 2B, 3A...). Follow the decision tree below to find your leaf.

  **Step 1: Check for Dominance and Transitivity Violations**
  *   If you chose **8B**: You violated First-Order Stochastic Dominance (FSD).
  *   If you chose **9a: P**, **9b: R**, and **9c: P**: You violated Transitivity (P > Q, R > Q, but P > R implies P > R, but if you picked R in 9b you prefer R to Q... wait, let's simplify).
      *   *Correction for Key:* If 9a=P, 9b=R, 9c=P. (P>Q, R>Q, P>R). This is transitive.
      *   *Cycle:* 9a=Q (Q>P), 9b=R (R>Q), 9c=P (P>R).
  *   **If FSD or Transitivity is violated:** → **Leaf: Residual ("No Stable Model")**.
  *   **Otherwise:** Proceed to Step 2.

  **Step 2: Check for Regret/Feedback Sensitivity**
  *   Compare **Q6** and **Q7**.
  *   If **Q6 ≠ Q7**: Your choice depends on feedback about foregone outcomes.
      *   → **Leaf: Regret Theory**.
  *   If **Q6 = Q7**: Your choice is outcome-based. Proceed to Step 3.

  **Step 3: Check for Loss Aversion (Mixed Prospects)**
  *   Look at **Q5**.
  *   If **Q5 = B** (Reject positive EV gamble): You exhibit Loss Aversion.
      *   → Proceed to Step 4A.
  *   If **Q5 = A** (Accept positive EV gamble): You do not exhibit strong Loss Aversion.
      *   → Proceed to Step 4B.

  **Step 4A: Loss Aversion Branch (CPT vs. Ref-Dependent EU)**
  *   Look at **Q1 & Q2** (Allais).
  *   If **1A & 2B** (Allais Paradox): → **Leaf: Cumulative Prospect Theory (CPT)**.
  *   If **1A & 2A** or **1B & 2B** (Independence): → **Leaf: CPT** (Note: You fit Reference-Dependent EU, which CPT nests).
  *   *Rationale:* CPT is the dominant descriptive model for agents with loss aversion + probability weighting.

  **Step 4B: No Loss Aversion Branch (EU vs. RDU vs. Machina)**
  *   Look at **Q1 & Q2** (Allais) and **Q3 & Q4** (Common Ratio).
  *   **Pattern 1 (Independence):** (1A & 2A) OR (1B & 2B) **AND** (3A & 4A) OR (3B & 4B).
      *   → **Leaf: Expected Utility (EU)**.
  *   **Pattern 2 (Allais Paradox + Subproportionality):** (1A & 2B) **AND** (3A & 4B).
      *   Look at **Q10**.
      *   If **Q10 = A** (Risk Seeking in this domain) or shows specific fanning patterns: → **Leaf: Machina/GEU** (See Notes on Inseparability).
      *   If **Q10 = B** (Standard Risk Averse): → **Leaf: Rank-Dependent Utility (RDU)**.
      *   *(Default to RDU if unsure; Q10 is weakly diagnostic).*
  *   **Pattern 3 (Inconsistent):** (1A & 2A) but (3A & 4B), or vice versa.
      *   → **Leaf: Residual ("No Stable Model")**.

  ***

  # Notes on Empty Cells and Inseparability

  ### 1. The Machina/GEU Leaf and Inseparability
  I have assigned a leaf to **Machina-style Generalized Expected Utility (Fanning Out)**, but I must flag a significant limitation: **This quiz cannot reliably separate Machina GEU from RDU.**
  *   **Why:** Both RDU (Quiggin) and Machina GEU predict violations of the Independence Axiom (Allais patterns). Separating them requires testing the *direction* of the violation across the Marschak-Machina triangle (specifically, whether indifference curves fan out or twist). Q10 attempts to probe this, but without a full triangle design (varying the common consequence across multiple levels), Q10 choices are consistent with both a specific RDU weighting function and a Machina local utility function.
  *   **Recommendation:** If you land on the RDU leaf, assume you could equally be a Machina agent. To separate them, you would need a follow-up quiz using Machina's "Reflection Example" (comparing preferences in the lower vs. upper triangle of the probability simplex).

  ### 2. Empty Cells in the Logical Space
  The scoring key maps specific answer patterns to models. Several logically possible patterns are left unmapped (sorted to **Residual**). Here is why those cells are empty:
  *   **Allais Consistency + Ratio Violation (e.g., 1A/2A but 3A/4B):** This implies you respect the Independence Axiom when a common *consequence* is added, but violate it when probabilities are scaled by a common *ratio*. While theoretically possible, this is behaviorally unattractive and rarely observed. It suggests noise rather than a structural preference model.
  *   **Allais Violation + Ratio Consistency (e.g., 1A/2B but 3A/4A):** This implies you are sensitive to common consequences but not common ratios. Most non-EU models (RDU, CPT) generate violations in *both* due to the non-linearity of the probability weighting function $w(p)$. A model that generates one without the other requires ad-hoc parameterization and is generally considered incoherent in the literature.
  *   **Loss Aversion + EU Independence (Reject Q5, but 1A/2A & 3A/4A):** This cell is technically occupied by **Reference-Dependent Expected Utility**. However, I have mapped this to the **CPT** leaf. Why? Because CPT nests Reference-Dependent EU. If you have loss aversion but linear probability weighting, you are a special case of a CPT agent (where $\gamma = \delta = 1$). There is no need for a separate leaf for a nested special case.

  ### 3. Regret Theory Separation
  The quiz separates Regret Theory via **Q6 vs. Q7**.
  *   **The Logic:** Outcome-based models (EU, RDU, CPT) assume utility is a function of the received payoff $u(x)$. Regret Theory assumes utility is a function of the payoff *and* the foregone payoff $u(x, y)$.
  *   **The Test:** If your preference flips solely because you will be *told* the foregone outcome, outcome-based models are falsified.
  *   **Caveat:** Some "Disappointment" models (Loomes 1987) also predict feedback sensitivity if expectations are updated. However, standard RDU/CPT do not. This quiz lumps all "feedback-sensitive" models under the **Regret Theory** leaf for simplicity.

  ### 4. Transitivity and FSD
  *   **FSD (Q8):** Violating First-Order Stochastic Dominance (choosing B in Q8) is a "hard" error. No standard descriptive model (EU, RDU, CPT, Regret) predicts this. It indicates confusion or lexicographic preferences not captured by risk models.
  *   **Transitivity (Q9):** Intransitivity (preferring P>Q, Q>R, but R>P) violates the definition of a preference ordering. While some non-transitive models exist (e.g., Tversky's Elimination by Aspects), they are not standard "risk preference" models in the von Neumann-Morgenstern tradition. Violators are sorted to **Residual**.

  ### 5. What This Quiz Misses
  *   **Ambiguity Aversion:** All lotteries here have known probabilities. To sort for Maxmin Expected Utility (Gilboa-Schmeidler), you would need Ellsberg-style urn questions.
  *   **Time Preference:** All payoffs are immediate. To separate Hyperbolic Discounting from Exponential, you need intertemporal choices.
  *   **Social Preferences:** All payoffs are private. To sort for Inequity Aversion (Fehr-Schmidt), you need allocation tasks.
