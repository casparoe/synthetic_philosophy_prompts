      *   **Opponent:** A friend who is a "universalist." The friend argues variation is noise (translation, expertise, etc.) or that we should just filter for universal intuitions.
      *   **Goal:** The user wants to be moved by the *strongest* version of the universalist case. They want a "map of exposure" for the variationist position.
