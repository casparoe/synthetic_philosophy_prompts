      *   Path 1: The Epistemic Objection (Attack Premise 5/7). We don't know enough.
      *   Path 2: The Axiological Objection (Attack Premise 7). Wildness has value.
      *   Path 3: The Empirical Objection (Attack Premise 2). Lives might be net positive.
      *   Path 4: The Agency Objection (Attack Premise 6). Distinction between doing/allowing.
      *   Conclusion: Recommendation on where to cut the knot.

