answer: |-
  Here is a structured plan for the hour, designed to move from static definitions to dynamic consequences while pre-empting the specific conceptual pitfalls your students will encounter.

  ### Phase 1: Static Foundations (0–15 minutes)
  **Goal:** Fix the notion of "standing preference" and the norm of transitivity before introducing time or trade.

  1.  **Define Preference as Disposition (0–5 mins):**
      *   Establish that for the purpose of this session, a "preference" is not a fleeting desire but a *stable disposition to choose* $X$ over $Y$ when both are available and costless.
      *   **Dependency:** You must fix this *before* describing the trades. If preferences are allowed to fluctuate randomly during the session, the money pump argument collapses into a story about changing one's mind.
      *   **Instruction:** Explicitly state: "We are assuming the agent's ranking of outcomes is fixed at $t_0$. We are testing whether that fixed ranking is compatible with rational agency over time."

  2.  **The Norm of Transitivity (5–10 mins):**
      *   Remind them of the standard axiom: If $A \succ B$ and $B \succ C$, then $A \succ C$.
      *   Ask them *why* this is required in intermediate micro. (Answer: To ensure a utility function exists).
      *   **Pivot:** Tell them today you are not worried about representing preferences with a function, but about *protecting the agent from exploitation*. This shifts the focus from mathematical convenience to normative force.

  3.  **Distinguishing "Loss" from "Pump" (10–15 mins):**
      *   **Dependency:** Before showing the cycle, you must distinguish a money pump from bad luck.
      *   **Instruction:** Draw a distinction on the board:
          *   *Risk:* Paying \$5 for a lottery ticket that yields \$0. (Outcome uncertain).
          *   *Bad Trade:* Paying \$5 for a widget worth \$3. (Error in valuation).
          *   *Money Pump:* Paying to swap $A \to B$, then $B \to C$, then $C \to A$, ending with $A$ and less money. (Outcome certain, valuation consistent).
      *   **Point to make:** "A pump is not a loss due to uncertainty or mistake. It is a loss generated entirely by the structure of the preferences themselves."

  ### Phase 2: The Worked Case (15–35 minutes)
  **Goal:** Run the cycle without it appearing as a "conjuring trick."

  **The Case Requirements:**
  *   **What it must contain:** Three distinct bundles (e.g., Job Offers, Apartments, or Gamble Bundles) where intransitivity arises from a plausible heuristic (e.g., majority rule on attributes).
      *   *Example:* Bundle A (High Salary, Med Location, Low Prestige), Bundle B (Low Salary, High Location, Med Prestige), Bundle C (Med Salary, Low Location, High Prestige).
      *   The agent prefers A to B (wins on 2 attributes), B to C (wins on 2), C to A (wins on 2).
  *   **What it must avoid:**
      *   **Hidden Costs:** The transaction cost to switch must be explicit and small (e.g., \$10 administrative fee).
      *   **Deception:** The agent must know they are allowed to trade.
      *   **Coercion:** The agent must *want* to make each trade at the moment they make it.
      *   **Changing Goods:** The bundles cannot degrade over time.

  **Sequence of Delivery:**
  1.  **Present the Bundles (15–20 mins):** Describe A, B, and C. Elicit the intransitive ranking from the students based on the "majority of attributes" rule. Confirm they agree this ranking is psychologically plausible.
  2.  **Introduce the Endowment and Sequence (20–25 mins):**
      *   The agent starts with A.
      *   At $t_1$, they are offered B for A + \$10. (They prefer B to A, so they trade).
      *   At $t_2$, they are offered C for B + \$10. (They prefer C to B, so they trade).
      *   At $t_3$, they are offered A for C + \$10. (They prefer A to C, so they trade).
  3.  **The Result (25–30 mins):**
      *   The agent holds A (where they started) but is \$30 poorer.
      *   **Crucial Check:** Ask the class: "At any single step $t_1, t_2, t_3$, did the agent violate their own preferences?" (Answer: No). "Did they violate the norm of transitivity?" (Answer: Yes, structurally).

  ### Phase 3: Addressing Misconceptions (30–50 minutes)
  **Goal:** Head off the two major objections that undermine the normative force of the argument.

  1.  **The "Just Refuse" Objection (30–40 mins):**
      *   **Misconception:** "The agent is stupid. At $t_3$, they should realize they started with A and just say no."
      *   **When to head it off:** Immediately after running the cycle.
      *   **The Counter:** Explain that the Money Pump Argument is a *reductio ad absurdum* targeting **myopic** agents.
      *   **Instruction:** Say: "If the agent can foresee the cycle, they are no longer myopic; they are 'sophisticated.' If they are sophisticated, they wouldn't make the first trade. But if they wouldn't make the first trade, it implies their preference for B over A at $t_1$ was not unconditional. The argument shows that *if* you have intransitive preferences *and* you choose myopically, you are irrational. It forces you to abandon either intransitivity or myopia."
      *   **Key Distinction:** The irrationality lies in the *combination* of the preference structure and the inability to bind one's future self.

  2.  **The "Unwise vs. Irrational" Objection (40–50 mins):**
      *   **Misconception:** "This just shows the trades are unwise (costly), not that the preferences are irrational. Maybe they just like losing money."
      *   **When to head it off:** After addressing the "Refuse" objection.
      *   **The Counter:** Distinguish between *content* and *form*.
      *   **Instruction:** "If I prefer burning money, that is a strange preference, but formally consistent. Here, the agent does *not* prefer losing money. At every step, they prefer the new bundle. The loss is a side effect they did not choose. Rationality requires that our choices effectively serve our ends. If my preferences guarantee I frustrate my own ends (having less money for the same good), the fault is in the *architecture* of the preferences, not the specific outcome."

  ### Phase 4: Boundaries and Assessment (50–60 minutes)
  **Goal:** Define the scope and test understanding.

  1.  **Explicitly Set Aside (50–55 mins):**
      *   Tell the students you are **not** solving the problem today.
      *   **Exclude:**
          *   **Sophisticated Choice:** (Backward induction to avoid the pump).
          *   **Resolute Choice:** (Binding oneself at $t_0$ to ignore $t_3$ preferences).
          *   **Regret Theory:** (Modifying utility to account for anticipated regret).
      *   **Reason:** "These are solutions to the problem. Today is about establishing that there *is* a problem that needs solving. If we jump to solutions, you will miss why the intransitivity is the root cause."

  2.  **The Diagnostic Question (55–60 mins):**
      *   Do not ask them to define a money pump. Do not ask them to draw the cycle.
      *   **Ask this:**
          > "Suppose an agent knows at $t_0$ that they will be offered this sequence of trades. They know their own preferences are intransitive. They claim they will take the first trade but refuse the last one. Why does the money pump argument suggest this plan is dynamically inconsistent, and what does that imply about the rationality of their $t_0$ preference ranking?"
      *   **What to listen for:**
          *   *Failure:* They talk about the agent changing their mind or losing money.
          *   *Success:* They identify that if the agent refuses the last trade, their preference for A over C at $t_3$ is being overruled. This means their preference at $t_0$ (to start the chain) relied on a prediction that their future preferences would be violated. This implies the $t_0$ preference ranking cannot be represented as a coherent plan of action. They should recognize that diachronic rationality requires the preferences held at $t_0$ to be compatible with the choices made at $t_n$.

  ### Summary of Dependencies for your Board Plan
  1.  **Fixed Preferences** (Must be established before Trade).
  2.  **Myopia** (Must be assumed to run the pump; must be challenged to test sophistication).
  3.  **Sure Loss** (Must be distinguished from Risk before claiming exploitation).
  4.  **Structural Irrationality** (Must be distinguished from Bad Outcomes to establish normative force).
