prompt: |-
  I'm leading a two-hour reading group for political science grad students next month on the Gibbard–Satterthwaite theorem, and I don't want to just walk them through the proof until everyone's eyes glaze over. Most of them have seen Arrow's theorem but have never thought about strategy-proofness as a property of a voting rule. Don't explain the theorem to me — plan how I should teach it. What has to go on the board first, and what depends on what: do I need them to have a clean notion of a social choice function before I can even say what misreporting is, or does the manipulation idea come first and motivate the formalism? I'd like the one carrying example for the whole session — I was thinking three candidates with a spoiler, but tell me what the example has to have and what it has to lack, and if plurality-with-a-spoiler isn't the right vehicle, say why and give me a better one.

  Then the misconceptions I should expect: people thinking strategy-proofness means nobody has an incentive to lie after the outcome is known, or that the theorem says all voting is a sham, or that single-peakedness is just a technical patch, or that a dictatorial rule is only bad because the dictator is selfish. Where in the sequence should I head each of these off? And what should I openly refuse to cover at this level — the full proof? ties, weak preferences, incomplete information? Finally, give me one question I can ask in the last ten minutes that will tell me whether they've actually got the theorem's content, as opposed to just being able to restate it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Political Science Grad Students (likely have some formal theory background, know Arrow's Theorem, but new to mechanism design/strategy-proofness).
      *   **Topic:** Gibbard–Satterthwaite (GS) Theorem.
      *   **Time:** 2 Hours.
      *   **Goal:** Avoid "proof walking" (glazed eyes). Focus on intuition, motivation, and implications.
      *   **Specific Constraints:**
          *   Don't explain the theorem to me (I know it).
          *   Plan the teaching sequence (what goes on the board first?).
          *   Formalism vs. Motivation (Social Choice Function vs. Manipulation).
          *   Single Carrying Example (evaluate Plurality-with-Spoiler vs. alternatives).
          *   Address Specific Misconceptions (ex-post incentives, "all voting is sham," single-peakedness, dictatorship nature).
          *   Scope Boundaries (what *not* to cover).
          *   Final Assessment Question (testing deep understanding).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Trap:* GS is often taught as a math theorem. For PolSci grads, it needs to be taught as a *political* theorem about institutions and incentives.
      *   *The Flow:* Motivation $\rightarrow$ Formalism $\rightarrow$ The Impossibility $\rightarrow$ Escape Routes $\rightarrow$ Implications.
      *   *The Example:* Needs to be simple enough to calculate utilities on the fly but rich enough to show manipulation. Plurality is good, but Borda or Rank-Order might show manipulation more clearly without needing "spoiler" dynamics which confuse the issue (spoilers are about entry/exit, GS is about preference revelation). Actually, a simple 3-candidate, 3-voter scenario with a specific voting rule is best.
      *   *Formalism:* You can't define manipulation without defining the function. But you can't motivate the function without the idea of lying. It's a dance. Start with the *act* of lying, then formalize the *rule* being lied to.

  3.  **Drafting the Plan - Section by Section:**

      *   **Introduction (0-20 mins):** Hook them. Arrow is about aggregation consistency; GS is about *incentives*.
      *   **The Example (20-50 mins):** Needs to be the backbone.
          *   *Critique of Plurality-with-Spoiler:* The prompt asks about this. Plurality is susceptible, but "spoiler" implies candidate entry/exit (independence of irrelevant alternatives context). GS is about *voter* misreporting given a fixed set of candidates. A better example is a specific profile where truthful voting leads to Outcome A, but lying leads to Outcome B (which the voter prefers).
          *   *Selection:* 3 Voters, 3 Candidates ($a, b, c$). Rule: Borda Count or Plurality with Runoff. Let's stick to **Plurality** but focus on *tactical voting* (burying a rival), not spoilers. Actually, **Borda** is often clearer for GS because it's strictly rank-based and non-dictatorial, making the impossibility starker. But PolSci students know Plurality best. Let's use **Plurality** but ensure the example shows *preference misreporting*, not just "wasted vote."
          *   *Refinement:* The prompt asks what the example *must have*. It must have: $\ge 3$ alternatives, unrestricted domain, non-dictatorial. It must *lack*: single-peakedness (initially), ties (keep it simple).
      *   **Formalism (50-80 mins):** Now define SCF and Strategy-Proofness.
          *   Board work: Define $f$, define $P_i$, define Manipulation.
          *   Connect back to the example.
      *   **The Theorem & Misconceptions (80-100 mins):** State GS. Address the misconceptions here.
          *   "All voting is a sham": No, just unrestricted domain.
          *   "Dictator is selfish": No, dictator is a structural term.
          *   "Single-peakedness is a patch": It's a domain restriction, a substantive political assumption.
      *   **Wrap-up & Assessment (100-120 mins):** The "Killer Question."

  4.  **Refining the "Carrying Example":**
      *   *Prompt:* "I was thinking three candidates with a spoiler."
      *   *My Verdict:* Reject "Spoiler." Spoilers relate to IIA (Arrow). GS relates to Strategy-Proofness. A spoiler changes the choice set. GS assumes a fixed choice set.
      *   *Better:* **The "Compromise Candidate" Scenario.**
      *   *Setup:* 3 Voters (Left, Center, Right). 3 Candidates (L, C, R).
      *   *Rule:* Plurality.
      *   *Truth:* Left votes L, Center votes C, Right votes R. Tie or C wins?
      *   *Manipulation:* Left prefers C over R. Sees R is surging. Votes C to stop R.
      *   *Why this works:* It shows that even with fixed candidates, incentives exist. It distinguishes GS from Arrow.

  5.  **Addressing the Formalism Sequence:**
      *   Do we need SCF before Manipulation? Yes, technically. But pedagogically? Start with the *story* of lying. "I want X, but if I say I want X, I get Y. So I say I want Z." *Then* say "Let's write down the rule that made you do that."
      *   *Board Order:*
          1.  The Story (Example).
          2.  The Definition of the Rule (SCF).
          3.  The Definition of Lying (Strategy-Proofness).
          4.  The Theorem.

  6.  **Addressing Misconceptions:**
      *   *Ex-post incentives:* GS is ex-ante (before knowing others' votes). Address this when defining manipulation.
      *   *All voting is sham:* Address when discussing domain restrictions (Single-peaked).
      *   *Dictator:* Address when stating the theorem's conclusion.
      *   *Single-peakedness:* Address in the "Escape Routes" section.

  7.  **Scope Boundaries (What to cut):**
      *   Full Proof (obviously).
      *   Ties (assume strict preferences for clarity).
      *   Weak preferences (assume strict).
      *   Incomplete Information (GS is dominant strategy, no beliefs needed). *Crucial distinction.*
      *   Social Welfare Functions vs. Choice Functions (Stick to Choice).

  8.  **The Final Question:**
      *   Needs to test application, not recall.
      *   Idea: Give them a restricted domain and ask if GS applies. Or give a mechanism and ask if it violates GS conditions.
      *   *Best:* A scenario where a rule *seems* manipulable but isn't, or vice versa, or asking about the *dictator* condition.
      *   *Selected:* A "Random Dictator" scenario. It's non-dictatorial in the GS sense (ex-ante), but is it strategy-proof? Yes. Does it violate GS? No, because GS requires deterministic. Wait, GS is for deterministic SCFs.
      *   *Better:* Ask them to identify *which condition* fails in a specific context (e.g., Median Voter Theorem context).
      *   *Winner:* "Construct a preference profile where the Median Voter Theorem saves us from GS, and explain exactly which axiom of GS is being violated."

  9.  **Review and Refine:**
      *   *Tone:* Professional, pedagogical, respectful of their time/intelligence.
      *   *Structure:* Clear time blocks.
      *   *Board Work:* Specific instructions on what goes where.
      *   *Example:* Ensure the distinction between Spoiler (IIA) and Strategy (GS) is sharp.

  10. **Final Polish:** Check against all constraints in the prompt.
      *   Plan teaching? Yes.
      *   Board order? Yes.
      *   Example critique? Yes.
      *   Misconceptions placement? Yes.
      *   Scope boundaries? Yes.
      *   Final question? Yes.

  *(Self-Correction during drafting)*: I initially thought about suggesting Borda count for the example. But PolSci grads live and die by Plurality. Let's use Plurality but make sure the manipulation is about *ranking* vs *voting*. Wait, Plurality asks for a top choice. Manipulation is voting for a non-top choice. That works.
  *Correction on "Spoiler":* I need to be very clear why "Spoiler" is the wrong frame. Spoilers are about the *set of alternatives* changing. GS is about *reporting* on a fixed set. I must emphasize this distinction to prevent conflation with Arrow.

  *Final check on the "Final Question":* It needs to distinguish content from restatement. Asking about the Median Voter Theorem is good because it connects to their existing knowledge (Black's theorem) and forces them to identify the *domain restriction* loophole.

