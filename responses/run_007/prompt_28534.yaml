answer: |-
  Here is a teaching plan designed for a two-hour session with political science grad students. It prioritizes institutional intuition over algebraic derivation, using the Gibbard–Satterthwaite (GS) theorem as a bridge between social choice theory and strategic behavior.

  ### 1. The Carrying Example: Ditch the "Spoiler"
  **Verdict:** Do not use a "spoiler" example.
  **Why:** A spoiler dynamic (e.g., Nader in 2000) is fundamentally about **Independence of Irrelevant Alternatives (Arrow's Theorem)**. It involves the *entry or exit* of a candidate changing the winner between two others. GS is about **Strategy-Proofness**. It assumes the set of candidates is *fixed* and asks if a voter has an incentive to misreport their ranking of that fixed set. Using a spoiler example will conflate GS with Arrow in their minds permanently.

  **The Better Vehicle: The "Compromise Squeeze"**
  Use a **3-Voter, 3-Candidate Plurality** scenario.
  *   **Candidates:** $L$ (Left), $C$ (Center), $R$ (Right).
  *   **Voters:** $v_1$ (Leftist), $v_2$ (Centrist), $v_3$ (Rightist).
  *   **True Preferences:**
      *   $v_1$: $L \succ C \succ R$
      *   $v_2$: $C \succ L \succ R$
      *   $v_3$: $R \succ C \succ L$
  *   **The Setup:** If everyone votes truthfully (Plurality = top choice), $L$ gets 1, $C$ gets 1, $R$ gets 1. Assume a tie-breaking rule favors $R$ (or $R$ has a slight polling lead).
  *   **The Manipulation:** $v_1$ prefers $C$ over $R$. Knowing $L$ cannot win, $v_1$ votes for $C$. $C$ wins (2 votes). $v_1$ is better off lying.

  **What this example must have:**
  1.  **At least 3 alternatives:** GS collapses with 2.
  2.  **Unrestricted Domain:** The voters' preferences can be any ordering (no single-peaked assumption yet).
  3.  **Deterministic Rule:** The outcome is certain given the votes.
  4.  **Non-Dictatorial:** No single voter dictates the outcome.

  **What this example must lack:**
  1.  **Candidate Entry/Exit:** Keep the candidate set fixed to isolate *voter* incentives.
  2.  **Probabilistic Outcomes:** Keep it deterministic to avoid discussing expected utility.

  ---

  ### 2. Board Sequence & Formalism Flow
  **Philosophy:** Do not start with definitions. Start with the *behavior*. If you define a Social Choice Function (SCF) first, they will treat it as a math object. If you start with the lie, they treat it as a political problem.

  **Hour 1: Intuition and Definitions**

  **0:00 – 0:20 | The Hook (No Board Yet)**
  *   Remind them of Arrow: "Arrow told us we can't aggregate preferences consistently."
  *   Pivot: "GS tells us we can't aggregate preferences *honestly*."
  *   Ask: "How many of you have ever voted tactically?" (Show of hands).
  *   Thesis: GS isn't just a theorem; it's a formalization of tactical voting.

  **0:20 – 0:50 | The Example (Left Board)**
  *   Write the **Compromise Squeeze** profile (above).
  *   Walk through the truthful outcome ($R$ wins).
  *   Walk through the strategic outcome ($v_1$ votes $C$, $C$ wins).
  *   **Key Board Note:** Explicitly write: *Set of Candidates Fixed.* *Preferences Fixed.* *Only the Report Changed.*
  *   **Transition:** "We need a formal way to describe the machine that turns reports into outcomes."

  **0:50 – 1:10 | The Formalism (Center Board)**
  *   Now define the **Social Choice Function (SCF)**.
      *   $f: \mathcal{P}^n \rightarrow A$
      *   Inputs: Profile of preferences (reports).
      *   Output: Single winner.
  *   Define **Strategy-Proofness**.
      *   "For all voters $i$, for all true preferences $P_i$, for all reported preferences $P'_i$, for all other voters' reports $P_{-i}$..."
      *   $f(P_i, P_{-i}) \succeq_i f(P'_i, P_{-i})$
  *   **Crucial Distinction:** Emphasize that this must hold for *all* $P_{-i}$. This is **Dominant Strategy** implementation. It does not depend on knowing how others vote (unlike Bayesian Nash Equilibrium).
  *   *Connect back to Example:* Show how Plurality violates this definition using the $v_1$ calculation you just did.

  **Hour 2: The Theorem, Misconceptions, and Escape Routes**

  **1:10 – 1:30 | The Theorem Statement (Right Board)**
  *   Write the theorem clearly:
      *   *If* Domain is Unrestricted ($\ge 3$ alternatives),
      *   *And* SCF is Deterministic,
      *   *And* SCF is Surjective (onto),
      *   *Then* Strategy-Proofness $\implies$ Dictatorship.
  *   **Define Dictatorship Carefully:** A dictator is a voter $i$ such that for any profile, the outcome is $i$'s top choice. It is a structural property, not a behavioral one.

  **1:30 – 1:50 | Misconceptions & Escape Routes**
  *   *This is where you intercept the misconceptions.*

  | Misconception | When to Head It Off | How to Address It |
  | :--- | :--- | :--- |
  | **"Strategy-proof means no one lies after the fact."** | During Definition (1:00) | Emphasize **Ex-Ante**. It means you never *need* to lie, regardless of what others do. It's about dominant strategies, not regret minimization. |
  | **"All voting is a sham."** | During Theorem Statement (1:20) | GS applies to *unrestricted* domains. If the political space is structured (e.g., 1D left-right), we might escape. |
  | **"Single-peakedness is just a technical patch."** | During Escape Routes (1:40) | Frame it as a **substantive political assumption**. It means politics is about redistribution/ideology, not multidimensional culture wars. It's a claim about the world, not a math trick. |
  | **"Dictator is bad because they are selfish."** | During Theorem Statement (1:20) | A GS Dictator might be benevolent. The problem is **institutional**. If the rule is dictatorial, the other voters' preferences *literally do not enter the function*. Their voice is structurally nullified. |

  **1:50 – 2:00 | Scope Boundaries (What You Refuse to Cover)**
  *   Be explicit: "We are not doing the proof. It involves pivotal voting logic and induction that won't help you apply the theorem."
  *   "We are assuming **strict preferences**. Ties complicate the definition of manipulation but don't change the result."
  *   "We are assuming **Complete Information**. GS is about dominant strategies. If you need to guess how others vote, you are in Bayesian Mechanism Design, which is a different class."
  *   "We are looking at **Social Choice Functions** (who wins), not Social Welfare Functions (full ranking). GS is the 'choice' counterpart to Arrow."

  ---

  ### 3. The Final Assessment Question
  **Goal:** Distinguish between memorizing the statement and understanding the *conditions* under which the theorem applies.

  **The Question (Last 10 Minutes):**
  > "Consider a committee choosing a budget level on a one-dimensional line from \$0 to \$100. There are 5 members. They use the **Median Voter Rule** (everyone reports their peak, the median peak is chosen).
  >
  > 1. Is this rule manipulable?
  > 2. Does this violate the Gibbard–Satterthwaite theorem?
  > 3. If not, exactly which condition of the theorem is not met, and what does that imply about the political context required for honesty to be possible?"

  **What to look for in their answers:**
  *   **Correct:** 1. No, it is strategy-proof (under single-peaked prefs). 2. No violation. 3. **Domain Restriction.** The preferences are Single-Peaked, not Unrestricted.
  *   **Deep Understanding:** They should note that GS assumes *any* preference ordering is possible. The Median Voter Theorem works because we assume a specific *structure* of political conflict (one dimension). If preferences were not single-peaked (e.g., a voter wants \$0 or \$100 but not \$50), the Median Rule becomes manipulable, and GS kicks back in.
  *   **Failure:** If they say "GS only applies to elections, not budgets" or "The Median Rule is dictatorial."

  ### 4. Summary of Board Layout
  *   **Left:** The "Compromise Squeeze" Example (Preferences, Truthful Vote, Strategic Vote). Keep this visible the whole time.
  *   **Center:** Formal Definitions (SCF, Strategy-Proofness condition).
  *   **Right:** The Theorem (Conditions $\rightarrow$ Conclusion) + The "Escape Routes" (Domain Restrictions, Randomization).

  ### 5. Instructor's Note on Tone
  Since they are PolSci grads, they care about *institutions*. Frame GS not as "math says democracy is impossible," but as "math says institutional design requires trade-offs." If you want honesty, you must restrict the agenda (domain) or accept randomness. If you want a deterministic winner on any issue, you must accept that people will game the system. This shifts the conversation from "voting is broken" to "how do we structure agendas to minimize manipulation?" which is where their research likely lives.
