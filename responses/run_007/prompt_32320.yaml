      *   *Tension 3: Consciousness vs. Function.* Do beliefs require "what it is like"? (Blindsight suggests no, but some philosophers say yes).

  5.  **Selecting the "Committed View":**

      *   I need to pick *one* desideratum that does the most exclusionary work.
      *   *Option A: Grounding.* Excludes LLMs immediately. (Too Searle-an? Maybe too biological chauvinist).
