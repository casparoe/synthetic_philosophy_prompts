      *   *Option C: The "Action-Guiding" Constraint.* Beliefs must be able to drive *novel* action, not just text generation.
      *   *Selection:* **The Coherence/Integration Constraint (Systematicity).** This hits the "Stochastic Parrot" hardest while allowing for potential AI belief (unlike biological chauvinism). It addresses the "next-token prediction" critique directly.

  6.  **Drafting the Content (Section by Section):**

