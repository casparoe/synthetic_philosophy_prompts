          *   Specify consistency with cognitive science/philosophy (blindsight, access vs. phenomenal consciousness, Chinese Room).
          *   For each desideratum: Provide the motivating case/consideration and flag status (Non-negotiable vs. Parochial/ Camp-specific).
          *   Identify tensions between desiderata (e.g., folk-psychology vs. empirical tractability, instrumentalism vs. realism).
          *   **Crucial:** Provide *my own committed view* on which single desideratum does the most work to exclude popular positions and defend it.

