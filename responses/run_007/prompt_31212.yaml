answer: |-
  **Exam Question**

  Buddhist epistemologists deny that testimony (*śabda*) is an independent means of valid knowledge (*pramāṇa*), arguing instead that it is reducible to inference (*anumāna*). Reconstruct this reductionist argument, specifically explaining how accepting a report functions as an inference from the speaker's trustworthiness. Then, articulate the Nyāya defense that testimony and inference differ in their internal causal structure, focusing on the distinction between invariable concomitance (*vyāpti*) and linguistic convention. Finally, explain what this debate reveals about the Nyāya criteria for individuating distinct instruments of knowledge.

  ***

  **Model Answer**

  The debate over the status of testimony (*śabda*) centers on whether verbal reports generate knowledge through a unique mechanism or merely through a derivative process. Buddhist epistemologists, particularly following Dignāga and Dharmakīrti, argue that *śabda* is not an independent *pramāṇa*. Instead, they reduce it to inference (*anumāna*). Their reconstruction begins with the observation that when a listener accepts a statement, they do not grasp the truth of the object directly from the words alone. Words are merely sounds; their connection to reality is mediated by the speaker. Therefore, accepting a report involves a cognitive chain: the listener perceives the utterance, recognizes the speaker as reliable (*āpta*), and infers that the content of the speech must be true because a trustworthy person would not speak falsely. On this view, the knowledge arises not from the words themselves, but from the inference based on the mark (*liṅga*) of the speaker's credibility. The structure is strictly inferential: "The speaker says X; the speaker is trustworthy; therefore, X is true." Because the final cognition depends on a logical connection between the speaker's character and the truth of the statement, Buddhists contend that no separate epistemic instrument is required. Inference suffices.

  The Nyāya school rejects this reduction by highlighting a fundamental structural difference in the causal conditions (*karaṇa*) required for inference versus testimony. In a standard inference, the knower must personally know the invariable concomitance (*vyāpti*) between the probans (the mark) and the probandum (the thing to be proved). For example, to infer fire from smoke, the inferer must have previously established that smoke is universally associated with fire. In the Buddhist reduction of testimony, the listener would need to know the *vyāpti* between "this person speaking" and "the truth of the content." Nyāya argues this is phenomenologically and structurally incorrect. In testimony, the listener does not infer the truth based on a perceived natural pervasion; rather, they understand the content through linguistic convention (*śakti*). The relation between a word and its object is not natural but stipulated by human agreement. When a competent speaker utters a sentence, and the listener understands the meaning, the knowledge arises immediately from the understanding of the convention, provided the speaker is reliable. The warrant runs through the words themselves, not through a separate inference about the speaker's psychology. Furthermore, testimony essentially relies on another person's cognition (*parataḥ*), whereas inference is generated internally (*svataḥ*) based on the knower's own observation of pervasion. Because the causal mechanism generating the cognition differs—one relies on observed natural relations, the other on learned linguistic relations—they cannot be the same instrument.

  This defense reveals that Nyāya individuates instruments of knowledge based on the distinctness of their instrumental causes (*karaṇa*). For Nyāya, a *pramāṇa* is defined by the specific causal factor that produces a veridical cognition. If the causal chain differs in kind, the *pramāṇa* is distinct. Since the cause of inferential knowledge is the knowledge of *vyāpti*, and the cause of testimonial knowledge is the understanding of word-meaning relations (*śakti*) combined with a reliable source, they constitute separate categories. To reduce testimony to inference would be to ignore the unique role of language as a conveyer of knowledge that bypasses the need for the listener to independently verify universal relations. Consequently, the Nyāya commitment to *śabda* as independent is not merely a defense of tradition but a logical consequence of their causal theory of knowledge. Distinct causes yield distinct instruments, and because language operates via convention rather than natural pervasion, testimony remains epistemically sui generis.

  ***

  **Marking Scheme (20 Points)**

  **1. Reconstruction of the Buddhist Reduction (5 points)**
  *   **A Level (5 pts):** Explicitly states that Buddhists view testimony as an inference based on the speaker's trustworthiness (*āptatva*). Explains the logical structure: Utterance + Trustworthiness → Truth of Content. Identifies that the warrant comes from the relation between speaker and truth, not the words themselves.
  *   **B Level (3–4 pts):** Mentions Buddhists reduce testimony to inference but fails to specify the role of speaker trustworthiness. Describes the reduction generally without reconstructing the inferential chain.
  *   **C/F Level (0–2 pts):** Merely lists *pramāṇas* or claims Buddhists dislike testimony without explaining the inferential mechanism.

  **2. Nyāya Structural Defense (5 points)**
  *   **A Level (5 pts):** Clearly distinguishes *anumāna* (requires knower's knowledge of *vyāpti*/natural pervasion) from *śabda* (requires knowledge of linguistic convention/*śakti*). Notes the distinction between knowledge generated from another's cognition versus one's own observation of pervasion.
  *   **B Level (3–4 pts):** States Nyāya disagrees but offers a vague distinction (e.g., "words are different from signs"). Misses the specific contrast between *vyāpti* and convention.
  *   **C/F Level (0–2 pts):** Confuses *vyāpti* with linguistic convention or claims Nyāya rejects inference entirely.

  **3. Criteria for Individuating *Pramāṇas* (5 points)**
  *   **A Level (5 pts):** Explicitly identifies the causal instrument (*karaṇa*) as the criterion for individuation. Explains that distinct causal mechanisms (natural pervasion vs. linguistic convention) necessitate distinct *pramāṇas*.
  *   **B Level (3–4 pts):** Mentions that they are "different tools" but fails to ground this in the causal theory of knowledge (*karaṇa*).
  *   **C/F Level (0–2 pts):** Suggests individuation is based on the object known or the result alone, ignoring the instrumental cause.

  **4. Clarity, Structure, and Constraints (5 points)**
  *   **A Level (5 pts):** Essay is approximately 700 words (±10%). American English spelling. Logical flow between sections. No citations or bibliography included.
  *   **B Level (3–4 pts):** Significant deviation from word count (too short to develop argument or too long). Minor structural issues.
  *   **C/F Level (0–2 pts):** Disorganized, includes forbidden citations, or significantly under length (<500 words).

  **Specific Deductions:**
  *   -2 points for using British spelling (e.g., "colour," "defence").
  *   -3 points for including a bibliography or citations.
  *   -5 points for failing to address the individuation criteria (maximum score possible becomes 15).
