      *   *Definition:* Probability = degree of rational belief based on evidence ($P(h|e)$). Weight = amount/relevance of evidence ($e$ itself).
      *   *Key Insight:* Probability can remain constant while weight increases (adding more evidence that confirms the same ratio). Weight *always* increases with more relevant evidence, whereas probability can go up or down.
      *   *The "Pull":* High probability + Low Weight vs. Moderate Probability + High Weight. Which is better for action?

  3.  **Address Question 1 & 2: Separate Dimension vs. Diagnostic Signal & Action:**
      *   *Analysis:* Keynes explicitly treats weight as distinct from probability. It's not just "the probability might be wrong." It's about the *substance* of the relation between evidence and hypothesis.
      *   *Action:* Keynes suggests weight *does* influence action. In Chapter VI, he links weight to "confidence." Later economists (like Shackle or Ellsberg) pick this up as "ambiguity aversion."
      *   *Justification:* It's not that the probability number is "fragile" (though it might be), but that rational action depends on the *security* of the premise. If the foundation is thin, even a high probability calculation is risky.
      *   *Nuance:* Is it a separate normative consideration? Yes. It modifies the *utility* of acting on that probability.

  4.  **Address Question 3: Unmeasurability (Pragmatic vs. Principled):**
      *   *Analysis:* Keynes was a logicist about probability (relations between propositions). He struggled to quantify probability itself in many cases (non-numerical probabilities).
      *   *Weight:* He explicitly states weight *increases* with more evidence, but he cannot find a formula to measure it *independently* of the evidence itself.
      *   *Verdict:* It leans towards principled. Weight is about the *completeness* of the evidence set. Since the set of all possible relevant evidence is often indefinite or open-ended, measuring "completeness" is logically problematic. It's not just "I haven't found the math yet"; it's that "completeness" isn't a scalar quantity in the same way frequency is.
