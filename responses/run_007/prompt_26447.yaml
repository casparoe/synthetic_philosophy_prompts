      *   Avoid "some say, others say." Use "The record shows..." or "This is incorrect because..."
      *   Ensure the distinction between "Darwinism as a general worldview" vs. "Darwinism as a specific genetic model" is clear, as that was Popper's actual pivot.

  6.  **Final Review against Constraints:**
      *   Sentence-by-sentence audit? Yes.
      *   Committed take? Yes (Professor is oversimplifying/projecting).
      *   No "on the one hand"? Yes.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Wait, did Popper call it circular?* Yes, he did use the tautology argument in "Unended Quest." So the professor isn't lying there. But the *implication* that this invalidates the theory is where the professor is sloppy. Popper thought metaphysical programs were *useful*, just not empirical. The professor implies Popper thought it was bogus science.
      *   *Biologist consensus:* I need to be careful not to say *no* biologists agree. Some might. But the *consensus* in philosophy of biology (Sober, etc.) is that the tautology objection was dissolved decades ago. I will stand firm that the professor's claim about "a lot of biologists" is anecdotal and contradicts the mainstream literature.

