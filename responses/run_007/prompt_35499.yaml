answer: |-
  Your working hypothesis is close, but it misses the specific philosophical category error that sustained the stalemate. The disagreement was not primarily about explanatory goals (entities vs. frequencies) nor strictly about empirical fidelity. It was a **confusion between ontological commitment and modeling abstraction.**

  Here is the structural diagnosis of the disagreement, why it stalled, and how it stands today.

  ### 1. The Core Diagnosis: Three Distinct Projects Under One Label
  The reason the participants talked past each other is that "Memetics" and "Cultural Evolution" were labels applied to three fundamentally different intellectual projects that shared a vocabulary but not a logic.

  *   **Project A (Dawkins/Dennett): The Ontological Project.**
      *   **Goal:** To prove that Darwinism is a universal algorithm that applies to *any* substrate.
      *   **Requirement:** To make this claim stick, they needed to identify a cultural analogue to the *gene* (the replicator).
      *   **Stance:** Realism. Memes must exist as discrete, countable, causal units for the theory to be true. If you can't find the meme, you haven't found the mechanism.
  *   **Project B (Boyd/Richerson/Henrich): The Population Dynamics Project.**
      *   **Goal:** To explain macro-scale cultural patterns (why do some societies sustain cooperation? why do technologies accumulate?).
      *   **Requirement:** To make this work, they needed inheritance mechanisms that generate statistical regularities.
      *   **Stance:** Instrumentalism. It does not matter if "traits" are discrete entities in the mind or the world, provided they can be tracked as frequencies across generations. The "unit" is a modeling convenience, not a discovered entity.
  *   **Project C (Sperber/Atran): The Cognitive Project.**
      *   **Goal:** To explain how culture interfaces with human psychology.
      *   **Requirement:** To make this work, they needed fidelity to how memory and inference actually function.
      *   **Stance:** Psychological Realism. Since minds reconstruct information rather than copy it, the "replicator" is a fiction. The causal chain is a chain of transformations, not lineages.

  **The Diagnosis:** The debate looked empirical ("Do high-fidelity replicators exist?") but was actually metaphysical ("What counts as a valid Darwinian explanation?"). Dawkins argued that without Project A's ontology, you don't have Darwinism. Boyd and Richerson argued that you *do* have Darwinism with just Project B's math. Sperber argued that neither matters if Project C shows the mechanism is impossible.

  ### 2. The "Fidelity" Red Herring
  You mentioned the empirical question of copying fidelity. This was the proxy war, not the real battle.

  *   **Memeticists** argued that without high-fidelity copying, selection cannot accumulate adaptations. Therefore, if culture evolves, high-fidelity units *must* exist (even if we haven't found them yet).
  *   **Cultural Evolutionists** argued that low-fidelity copying is sufficient *if* there are biased transmission rules (e.g., conformist bias, prestige bias).
  *   **Sperberians** argued that fidelity is the wrong metric entirely; "attraction" to certain concepts matters more than copying.

  **Why this didn't settle the debate:** You cannot empirically falsify a modeling assumption. If a Memeticist says, "There must be a unit here," and a Cultural Evolutionist says, "I can model the frequency change without defining the unit," both can fit the same data. The Memeticist claims the CE model is missing the *cause*; the CE theorist claims the Memeticist is reifying a *phantom*.

  ### 3. What Would Have Counted as Progress (circa 2005)?
  For this debate to have been resolved scientifically rather than philosophically, one of two things needed to happen:

  1.  **Predictive Divergence:** One framework needed to generate a specific prediction that the others explicitly ruled out, which was then empirically verified.
      *   *Example:* If Memetics predicted that cultural traits should show discrete phylogenetic branching patterns (like genes) while CE theory predicted reticulate networks, and data decisively showed one or the other. (In reality, cultural data shows both, depending on the scale, which kept the debate alive).
  2.  **Formal Proof of Necessity:** A mathematical proof demonstrating that Darwinian population dynamics *require* discrete replicators to produce cumulative adaptation.
      *   If it could be proven that "biased transmission" (Project B) mathematically collapses into "replicator dynamics" (Project A) under certain conditions, the ontological fight would have been rendered moot.
      *   Conversely, if it were proven that cumulative adaptation is *impossible* without discrete replicators, Sperber and the CE theorists would have been forced to find the units or abandon the Darwinian label.

  Neither happened. The math (specifically the Price Equation) showed that you can have selection without discrete replicators, provided there is covariance between traits and fitness. This mathematically vindicated Project B and undercut Project A's necessity, but it didn't stop Project A's proponents from insisting on the ontology.

  ### 4. Is the Question Badly Posed?
  **Yes.** The question "Are memes real?" is a category error similar to asking "Are economic markets real?"

  *   **Markets:** You can point to a stock exchange floor, but "The Market" is an emergent statistical phenomenon, not a discrete object. You can model it with agents (ontological) or with aggregate flows (instrumental). Both work for different purposes.
  *   **Memes:** Culture is an emergent property of interacting minds and artifacts. Insisting on a discrete "unit" of culture is like insisting on a discrete "unit" of an economy. Sometimes a "trade" is a clear unit; sometimes it's a blurry continuum of obligation and gift.

  The "Meme" was trying to do two jobs, as you suspected, but the conflict wasn't just between science and pop-culture. It was between **Reductionism** (culture must be built of cultural atoms) and **Emergentism** (culture is a population-level pattern that doesn't require cultural atoms).

  ### 5. Current Status: Pragmatic Dissolution
  The field has not "settled" the debate via discovery; it has dissolved it via **pragmatism**.

  Modern Cultural Evolution (Henrich et al.) largely ignores the "meme" ontology. They speak of "cultural traits" or "variants," which are operationally defined by the measurement tool (e.g., "pot rim diameter," "belief in witchcraft," "knot-tying technique").
  *   If the trait behaves like a replicator in the model, they treat it as one.
  *   If it behaves like a reconstructed representation, they model the transformation rules.

  **The Verdict:**
  The Memeticists (Project A) lost the scientific argument but won the public relations war. The term "meme" survived because it is a powerful *intuition pump*, not because it is a robust *scientific construct*.

  The Cultural Evolutionists (Project B) won the scientific utility argument by showing you can do the work without the ontological baggage.
  The Sperberians (Project C) were absorbed; their insights on reconstruction are now standardly included in "transmission bias" parameters within CE models.

  **Summary Diagnosis:**
  The disagreement was a **methodological incommensurability**.
  *   Dawkins demanded a **mechanistic explanation** (show me the engine).
  *   Boyd/Richerson offered a **kinematic explanation** (show me the trajectory).
  *   Sperber demanded a **psychological explanation** (show me the driver).

  All three are valid levels of analysis, but they were arguing as if they were competing theories at the *same* level. Progress occurred only when the field accepted that you can model the trajectory (CE) without agreeing on the engine (Memes) or the driver (Psychology), provided the model predicts the trajectory accurately. The question "Are memes real?" is now understood as "Are discrete replicator models useful for this specific dataset?" rather than a universal claim about the nature of culture.
