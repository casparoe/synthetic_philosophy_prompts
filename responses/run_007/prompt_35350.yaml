  Here is a 90-minute lesson plan designed specifically for non-metaphysicians. Since your group is composed of ethicists, political philosophers, and historians, the pedagogy should emphasize *methodology* and *conceptual frameworks* rather than the specific metaphysical stakes.

  ### 1. The Sequence: Distinction First, Ontology Second
  You are correct: **Start with the distinction, not the ontology.**

  If you open with "Do tables exist?", ethicists and political philosophers will immediately try to solve the metaphysical problem using their own tools (e.g., "Well, it depends on what we need tables for..."). You want them to step back and analyze the *structure of the disagreement*, not the subject matter.

  *   **Minutes 0–20:** The General Distinction. Use a trivial, non-metaphysical example to define "substantive" vs. "merely verbal." Get them to agree on the criteria for a verbal dispute (e.g., both parties agree on all the non-semantic facts, but disagree on how to apply a word).
  *   **Minutes 20–50:** The Carrying Example (Transition to Ontology). Apply that distinction to an ontological case.
  *   **Minutes 50–70:** Carnap, Quine, and Quantifier Variance. Now that they see the *problem*, introduce the technical machinery as the *solution* (or dissolution).
  *   **Minutes 70–85:** Misconceptions and Discussion.
  *   **Minutes 85–90:** The Check Question.

  ### 2. The Carrying Example: "The Case of the Team"
  Do not use the Ship of Theseus (too puzzle-focused) or Holes (too abstract). Use **"The Case of the Team."**

  *   **Why this works for this audience:**
      *   **Political Philosophers:** It mirrors the debate between methodological individualism vs. holism (Does the State exist over and above its citizens?).
      *   **Ethicists:** It mirrors debates about collective moral agency (Can a corporation be blameworthy?).
      *   **Historians:** It handles diachronic identity (Is the 2024 Yankees the same "object" as the 1927 Yankees?).
  *   **How to run it:**
      1.  Present the scenario: The players leave, the coach leaves, the stadium changes, but the name and franchise records remain.
      2.  Ask: "Does the team *exist* over and above the players?"
      3.  **The Metaphysical Move:** Show how one student (the Nihilist) says, "There are only players arranged team-wise," and the other (the Realist) says, "No, there is literally a team."
      4.  **The Meta-Level Point:** Ask the group: "If you both agree on where the players are, what the contract says, and the history of the franchise, what is left to disagree about?" This forces them to see the dispute as potentially verbal (about the word "exist" or "object") rather than factual.

  ### 3. Anticipated Misconceptions
  Since these are PhD students, they won't misunderstand the definitions, but they will misunderstand the *implications*. Head these off explicitly:

  *   **Misconception 1: "Merely Verbal" = "Trivial/Unimportant."**
      *   *The Fix:* Emphasize that verbal disputes can have massive practical stakes. (e.g., "Is a fetus a 'person'?" or "Is a corporation a 'citizen'?" are largely verbal disputes about conceptual boundaries, but they determine law and policy). A dispute can be verbal and yet vital.
  *   **Misconception 2: "Merely Verbal" = "Easy to Resolve."**
      *   *The Fix:* Explain that parties often refuse to change their language because their conceptual scheme is tied to their theoretical goals. An ethicist might *need* "collective agency" to be real to make their theory work, so they won't easily concede the verbal point.
  *   **Misconception 3: Metaontology = Anti-Realism.**
      *   *The Fix:* Clarify that one can be a robust realist about the world and still think ontological debates are verbal. The claim is about our *description* of the world, not the world itself.

  ### 4. Timing Carnap, Quine, and Quantifier Variance
  Introduce these **after** the "Team" example has created the tension. They need to feel the problem before you give them the technical tools.

  *   **Carnap (Minutes 50–60):** Use Carnap to formalize the "Team" intuition.
      *   *Internal Question:* "Is there a team?" (Asked within the framework of sports talk → Answer: Yes).
      *   *External Question:* "Does the framework of 'teams' correspond to reality?" (Asked outside the framework → Answer: Meaningless or pragmatic).
      *   *Goal:* Show how Carnap dissolves the tension by relativizing existence to a linguistic framework.
  *   **Quine (Minutes 60–65):** Briefly present Quine as the counter-move.
      *   "To be is to be the value of a variable."
      *   If we say "There exists a team...", Quine says you are committed to the team. You can't just say it's "framework relative" without explaining the logic.
  *   **Quantifier Variance (Minutes 65–70):** This is the synthesis.
      *   Explain QV as the way to save the "verbal dispute" intuition against Quine.
      *   The Realist and Nihilist aren't using the same quantifier. The Realist's "∃x" ranges over teams; the Nihilist's "∃x" ranges only over simples. They aren't disagreeing about the world; they are speaking different "ontological languages."

  ### 5. What to Explicitly Refuse to Get Into
  You have 90 minutes. If you drift into these topics, you will lose the non-metaphysicians. Put these on a "Parking Lot" board and refuse to engage:

  *   **Specific Mereological Theories:** Do not let them debate Universalism vs. Nihilism vs. Restrictivism. Whether composition *actually* occurs is irrelevant to whether the *debate about it* is verbal.
  *   **Grounding:** Do not introduce metaphysical grounding. It complicates the verbal/substantive distinction unnecessarily for this level.
  *   **Modal Realism:** Keep the discussion actual. Possible worlds will distract from the quantifier point.
  *   **The "Right" Answer:** Do not let the session become a vote on whether Quantifier Variance is true. The goal is to understand the *concept* of a verbal dispute, not to solve metaontology.

  ### 6. The Final Check Question
  Do not ask them to define "quantifier variance." Ask them to diagnose a new case using the tools.

  **The Question:**
  > "Imagine two political philosophers arguing about whether 'The State' exists. Philosopher A says, 'The State exists and has rights.' Philosopher B says, 'Only individual citizens exist; The State is a fiction.' They agree on all the facts about laws, borders, and citizens' behaviors.
  >
  > **Using the Carnap/Quine framework we discussed: What specific question would you ask them to determine if this is a substantive dispute or a merely verbal one?**"

  **What you're looking for:**
  You want them to identify that the students need to check if they are using the quantifier ("exists") in the same way, or if they are operating within different linguistic frameworks (internal vs. external). If they say "Ask them if they disagree on any non-semantic facts," that also works. If they try to answer whether the State *actually* exists, they missed the point.
