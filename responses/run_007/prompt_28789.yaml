      *   *D7: The Finality Constraint.* Knowledge is finally valuable, not just instrumentally. (Controversial, maybe camp-specific).

      *Refining the "Non-Negotiable" vs. "Camp-Specific":*
      *   The *Meno* intuition is the starting point. If a theory says TB = K in value, it fails the assignment.
      *   The Swamping Problem is the technical hurdle. It's not a "camp" view; it's a logical challenge to instrumentalism.
      *   Trivial truths are a major tension. If K is always valuable, why do we ignore trivial K?
      *   Gettier cases: K is distinct from lucky TB.

  4.  **Identifying Tensions and Impossibility Results:**
      *   *The Swamping Tension:* If Truth is the *only* fundamental epistemic value, and the third condition (justification/reliability) is *only* instrumentally valuable for truth, then K cannot be more valuable than TB. This rules out simple instrumentalist accounts.
      *   *The Triviality Tension:* If K is *always* more valuable than TB, we face the problem of trivial truths (knowing the phone book). If we say K is only valuable when the truth is valuable, we weaken the *Meno* intuition (it becomes conditional).
      *   *The Stability vs. Truth Tension:* Some argue K is valuable because it's stable (durable). But stability might not always track truth value.

  5.  **Identifying the "Killer Constraint":**
      *   The **Swamping Problem** is the big one. It forced a shift from simple reliabilism to virtue epistemology (credit view) or knowledge-first (primitivism). It attacks the *structure* of the analysis of knowledge.

