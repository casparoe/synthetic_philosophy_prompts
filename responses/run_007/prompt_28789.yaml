  *(Refining the Swamping explanation):* It's not just that instrumental value is swamped. It's that if the *only* reason to value the process is the product, having the product makes the process's value redundant *in that instance*.

  *(Refining the Triviality tension):* If K is more valuable than TB *ceteris paribus*, does that hold for trivial truths? If I truly believe there are 1,452 grains of sand vs. know it. Is the knowledge *significantly* better? If yes, why do we not care? If no, does K lose its general superiority?

  *(Final check on Scorecard):* Keep it brief as requested, focus on how they handle the Swamping/Triviality tensions.

