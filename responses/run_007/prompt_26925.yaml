answer: |-
  This is a profound question that cuts to the heart of epistemology, aesthetics, and the methodology of the humanities. The asymmetry you identify between art history and general history is a concrete instantiation of the philosophical "puzzle of aesthetic testimony."

  Here is an analysis of what theory this practice presupposes, alternative explanations for the norm, and the implications of rejecting it.

  ### 1. The Presupposed Theory: The Acquaintance Principle

  At the most direct level, the norm that an art historian must view the Rothko paintings presupposes a version of the **Acquaintance Principle (AP)**.

  Formulated famously by Richard Wollheim, the AP states that aesthetic judgments must be based on first-hand experience of the object. If this principle holds, then aesthetic knowledge is fundamentally different from historical or scientific knowledge.
  *   **General History:** Deals with *propositional knowledge* (e.g., "The Bastille was stormed on July 14, 1789"). This information is transmissible via testimony because the truth conditions do not depend on the subject's sensory experience.
  *   **Art History:** Deals with *aesthetic properties* (e.g., "The painting exudes a melancholic tranquility"). If the AP is true, these properties are response-dependent. To know the painting is melancholic, you must not only believe it but *feel* or *perceive* that melancholy yourself.

  Under this view, the art history department is acting as an epistemic gatekeeper. They are enforcing the rule that **aesthetic justification is non-transmissible.** A doctoral student relying on written descriptions is committing a category error: they are trying to acquire experiential knowledge through propositional means. The discipline assumes that without the sensory encounter, the student possesses, at best, "empty" beliefs—they have the words, but not the warrant.

  ### 2. Alternative Explanations: Beyond Strict Acquaintance

  However, we need not commit to a hard metaphysical claim that aesthetic knowledge *cannot* be transmitted to explain this norm. There are softer, pragmatic, and pedagogical interpretations that make sense of the asymmetry without ruling out aesthetic testimony entirely.

  **A. The "Understanding vs. Belief" Distinction**
  Philosopher Matthew Kieran argues that while we might be able to acquire aesthetic *beliefs* via testimony (I can believe a critic who says a song is beautiful), we cannot acquire aesthetic *understanding*.
  *   **Application:** A history student understands the French Revolution by grasping causal links between documents. An art student understands a Rothko by grasping how color, scale, and texture interact to produce an effect.
  *   **The Norm:** The PhD requirement isn't just about forming true beliefs; it is about cultivating a deep, explanatory understanding of *why* the work affects us. Testimony gives you the conclusion; viewing the work allows you to trace the reasoning. The norm ensures the historian can explain the aesthetic impact, not just report it.

  **B. Skill Acquisition and Connoisseurship**
  Art history is partly a training of perception. Viewing art is a skill (connoisseurship) that must be practiced.
  *   **Analogy:** A wine critic cannot rely solely on other critics' notes; they must train their palate.
  *   **The Norm:** If a student relies on testimony, they fail to develop the perceptual faculties required to evaluate *other* works independently. The requirement to see the Rothko is not just about knowing *that* Rothko; it is about becoming the *kind of knower* who can validate future aesthetic claims. The discipline prioritizes the development of the subject's capacity over the accumulation of facts.

  **C. The Materiality of Evidence**
  There is a distinction between relying on *testimony* (words) and relying on *reproductions* (images). The prompt mentions both, but they are different.
  *   **The Constraint:** A Rothko is about scale, surface texture, and the viewer's bodily relationship to the canvas. A photograph (even a high-res one) destroys this data.
  *   **The Norm:** In this light, the norm isn't strictly about testimony; it's about **evidentiary integrity.** A historian of the Revolution relies on documents because the documents *are* the primary evidence. An art historian relies on the painting because the painting *is* the primary evidence. Reproductions are secondary evidence that filter out aesthetically relevant properties. The norm demands engagement with the primary evidence, which happens to be perceptual.

  ### 3. If We Rejected the View: Implications for Pedagogy

  If we were to adopt an "Optimist" view of aesthetic testimony (arguing that aesthetic knowledge *can* be transmitted just like factual knowledge), art history pedagogy would undergo a radical transformation.

  **A. Democratization and Accessibility**
  *   **Change:** Requirements for travel, museum access, and study abroad would vanish.
  *   **Impact:** This would make the discipline significantly more inclusive. Currently, art history favors those with the funding and physical ability to travel to specific archives or museums. Accepting testimony would allow scholars with disabilities or financial constraints to participate fully. Digital humanities would become the dominant methodology.

  **B. Shift from Perception to Discourse**
  *   **Change:** Curriculum would shift from "visual analysis" to "discourse analysis."
  *   **Impact:** Students would spend less time in galleries and more time analyzing the *language* used by critics and predecessors. The discipline would look more like literature or philosophy. The object itself would become secondary to the textual tradition surrounding it.

  **C. The Loss of "The Critical Eye"**
  *   **Change:** Assessment would no longer test a student's ability to notice visual details, but their ability to synthesize existing critical opinions.
  *   **Impact:** This risks creating a discipline of "echo chambers." If aesthetic knowledge is transmissible, authority becomes centralized. We would rely on "expert testifiers." The diversity of interpretation that comes from thousands of individuals having unique sensory encounters with a work would diminish. The discipline might become more efficient, but less innovative.

  **D. Redefining the Object of Study**
  *   **Change:** We would have to admit that the "art" is not the physical object, but the *concept* or the *cultural fact* of the object.
  *   **Impact:** This aligns with some conceptual art practices, but contradicts the formalist tradition. It would force a reconciliation between art history and cultural studies, where the social reception of the work matters more than its sensory presence.

  ### Conclusion

  The asymmetry between the art historian and the general historian presupposes that **aesthetic properties are epistemically special.** It suggests that the "truth" of an artwork is not merely a fact to be recorded, but an experience to be undergone.

  However, the discipline does not necessarily need to claim that aesthetic testimony is *impossible*. It can maintain the norm on the grounds that **testimony is insufficient for the specific goals of the discipline:** namely, the cultivation of perceptual skill, the achievement of deep understanding, and the verification of material evidence.

  If we rejected this, art history would cease to be a study of *visual culture* in a literal sense and would become a study of *verbal culture about visual objects.* While this would make the field more accessible, it would fundamentally alter what we think art history is *for*. The current pedagogy suggests that the value of the discipline lies not just in knowing what was said about the art, but in sustaining the practice of looking itself.
