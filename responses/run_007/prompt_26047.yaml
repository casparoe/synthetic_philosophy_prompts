  Consider Elena, a manager advocating for her subordinate, Mark, to receive a promotion. She knows he deserves it, but the final decision rests with senior leadership.

  **Classical Framework:** Epictetus draws a sharp line. The promotion is an external—it is not up to Elena. Her only concern is her own *prohairesis* (moral choice): advocating justly and diligently. She must categorize the promotion as a "preferred indifferent." While she may act to secure it, she must withhold emotional investment from the outcome. If Mark is rejected, Elena's tranquility must remain unbroken. To feel disappointment is to erroneously judge an external as good.

  **Modern Framework:** Contemporary Stoics (like William Irvine) suggest a trichotomy, introducing a third category: things partially up to us. The promotion fits here. Elena should internalize her goal: "I will advocate as effectively as possible," rather than "I will secure the promotion." However, she is permitted to prefer the outcome and feel mild disappointment if it fails, provided she doesn't catastrophize.

  **The Divergence:** The advice diverges on emotional permission. The modern view validates Elena's desire for Mark's success as natural, provided it doesn't consume her. The classical view demands she extinguish the desire itself. To a normal person, the classical recommendation feels callous. If Elena truly doesn't care whether Mark succeeds, does she truly care about Mark? It suggests a detachment incompatible with deep professional loyalty or friendship. It makes her virtue look like indifference to another's welfare. The modern view allows her to be disappointed *for* Mark; the classical view says being disappointed *is* the error.

  **Structural Feature:** The separation hinges on the status of "preferred indifferents." Classical Stoicism insists externals contribute nothing to flourishing (*eudaimonia*). Modern Stoicism treats them as legitimate aims, merely not ultimate ones. The classical view requires a radical revaluation of what counts as "good," whereas the modern view adjusts the *attachment* to the good, not the valuation.

  **Classical Defense:** A defender would argue this isn't callousness, but resilience. If Elena's well-being depends on leadership's decision, she is enslaved to them. By remaining indifferent to the outcome, she ensures her capacity to help Mark remains stable regardless of corporate whims. Her care is demonstrated through her virtuous action (advocacy), not her emotional volatility. To demand she suffer if Mark fails is to demand she compromise her own rational nature for something outside her control. The classical Stoic cares *more* about Mark because their support is unconditional, not contingent on a specific external reward. Furthermore, if she is devastated by the loss, she becomes less useful to Mark in the future. True benevolence requires a stable mind. The ancient Stoic believes that by refusing to be harmed by externals, they remain a reliable instrument of justice for others.
