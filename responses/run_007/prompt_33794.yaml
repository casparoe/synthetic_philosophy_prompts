answer: |-
  Your hypothesis is astute and aligns with the most rigorous developments in the field over the last two decades, particularly the work surrounding Gustaf Arrhenus's impossibility theorems. The impasse in population axiology is not merely a stalemate of competing intuitions; it is a structural inconsistency within the set of adequacy conditions that theorists demand a satisfactory axiology must meet.

  Here is a diagnosis of the structure of the impasse, followed by an account of what constitutes genuine progress given that diagnosis.

  ### I. Diagnosis: The Structure of the Impasse

  You ask whether the parties are answering different questions, treating different cases as data, or resting on bedrock intuitions. The answer is **all three**, but they are unified by a deeper structural problem: **The Inconsistency of Adequacy Conditions.**

  **1. Treating Different Cases as "Fixed Points" (Data)**
  Theories in population ethics are typically constructed via a method of reflective equilibrium. Theorists start with specific cases (intuition pumps) and treat their judgments about them as data points that a theory must fit.
  *   **Total View proponents** treat the intuition that "more happy lives are better, ceteris paribus" as a hard data point. They are willing to let go of intuitions about inequality or the "quality" of the masses to preserve this.
  *   **Average/Critical-Level proponents** treat the Repugnant Conclusion (a vast population of lives barely worth living is better than a small population of excellent lives) as a *reductio ad absurdum*. They treat the negative intuition about the Repugnant Conclusion as a harder data point than the intuition behind the Total View.
  *   **Person-Affecting proponents** treat the Non-Identity Problem cases as the primary data, prioritizing the intuition that an act cannot be wrong if it harms no particular existing or future person.

  The impasse arises because these data points are **mutually inconsistent**. You cannot satisfy the intuition driving the Total View, the intuition driving the Repugnant Conclusion rejection, and the intuition driving Person-Affecting views simultaneously. Parties are not just disagreeing on the theory; they are disagreeing on which intuitive judgments are inviolable.

  **2. Resting on Bedrock Adequacy Conditions**
  As you hypothesized, the disagreement is about formal constraints. Arrhenus's Impossibility Theorems demonstrate that no axiology can satisfy a set of seemingly weak and plausible adequacy conditions (e.g., Dominance, Non-Elitism, Weak Quality Addition, etc.) simultaneously.
  *   **Total Utilitarianism** prioritizes *Dominance* and *Positive Expansion* (adding a good life makes things better).
  *   **Average Utilitarianism** prioritizes *Quality Sensitivity* (average welfare matters).
  *   **Person-Affecting Views** prioritize *Neutrality* or *Existence Independence* (the value of an outcome shouldn't depend on the identity of the people in it, or vice versa).

  The impasse is structural because each side treats their preferred adequacy conditions as axiomatic. When a theory violates a condition (e.g., Total View violates Non-Elitism via the Repugnant Conclusion), the proponent of that theory often argues the condition is flawed, while the opponent argues the theory is flawed. They are talking past each other because they have different "axiomatic bases."

  **3. Answering Different Questions**
  There is a subtle divergence in the *telos* of the inquiry.
  *   Some theorists are asking: "What is the **value ranking** of outcomes?" (Impersonal axiology).
  *   Others are asking: "What are our **moral obligations** regarding creation?" (Deontic ethics).
  *   Others are asking: "How should we make **decisions under uncertainty**?" (Population decision theory).

  The Repugnant Conclusion is devastating for the first question but might be less relevant for the second (we may never be in a position to choose the repugnant population) or the third (uncertainty might block the path to the repugnant conclusion). The impasse persists because theorists often assume that solving the axiological ranking automatically solves the deontic or decision-theoretic problems, which may not be true.

  ### II. What Counts as Progress?

  If the impasse is caused by an inconsistent set of adequacy conditions, then "progress" cannot mean finding a theory that satisfies *all* our pre-theoretic intuitions. That is mathematically impossible. Progress must instead be defined as **clarifying the cost of consistency.**

  Here are three specific avenues for progress:

  **1. Mapping the Trade-Offs (The "Cost-Benefit" of Axioms)**
  Progress consists of explicitly cataloging which adequacy conditions must be violated to satisfy others. Instead of hiding counter-intuitive results (like the Sadistic Conclusion or the Repugnant Conclusion) as "bullets to bite," theorists should quantify the "moral cost" of biting them.
  *   *Example:* A theory that avoids the Repugnant Conclusion might imply the **Sadistic Conclusion** (it is better to add lives of suffering than lives of low positive welfare). Progress is made when we admit that avoiding the Repugnant Conclusion *requires* accepting the Sadistic Conclusion (or some equivalent violation), and then debate which violation is less costly.
  *   *Metric:* Progress is achieved when the debate shifts from "My theory avoids X" to "My theory avoids X at the cost of Y, and Y is more palatable than X."

  **2. Embracing Incompleteness and Vagueness**
  A major source of the impasse is the assumption that the "better than" relation must be a **complete ordering** (for any two populations A and B, either A > B, B > A, or A = B).
  *   *Progress:* Accepting that population value might be **incomplete** or **vague**. If some populations are incomparable (neither better, worse, nor equal), many impossibility theorems lose their grip. Parfit suggested this with "Imprecise Equality."
  *   *Shift:* Moving from "Which population is better?" to "Are these populations comparable?" This dissolves the forced choice that generates the Repugnant Conclusion. If the vast, barely happy population is *incomparable* to the small, happy one, the Repugnant Conclusion vanishes.

  **3. Shifting from Axiology to Decision Theory**
  The standard impasse assumes we are ranking outcomes from a "God's eye view." However, human agents act under uncertainty and with limited agency.
  *   *Progress:* Developing **Ex Ante** population ethics. Instead of asking "Which outcome has more value?", ask "Which choice is rational given the uncertainty about who will exist and what their lives will be?"
  *   *Result:* Some paradoxes (like the Non-Identity Problem) dissolve when viewed through the lens of risk and expectation rather than outcome comparison. If progress is defined as "action-guiding capacity," then a theory that fails to rank all outcomes but successfully guides policy is superior to a complete axiology that yields repugnant prescriptions.

  ### III. Conclusion: Should We Expect Progress?

  We should not expect progress in the form of a **Grand Unified Theory** that restores all our pre-theoretic intuitions. That is a chimera ruled out by impossibility theorems.

  However, we should expect **therapeutic progress**. The field is currently in a state where theorists hope to find a loophole that saves their preferred intuitions. Progress will look like a collective acceptance that:
  1.  **Moral Mathematics has Limits:** Our intuitive concepts of "betterness" may not apply cleanly to variable populations.
  2.  **Revision is Necessary:** We must revise either our formal constraints or our specific case intuitions; we cannot keep both.
  3.  **Pluralism is Likely:** There may be no single "value" metric for populations, but rather a cluster of values (total welfare, average welfare, equality, rights) that trade off against one another without a strict lexical ordering.

  The impasse will break not when someone proves the Total View right, but when the community agrees on which adequacy conditions are expendable. Until then, the disagreement remains a clash of bedrock constraints, disguised as a search for factual moral truth.
