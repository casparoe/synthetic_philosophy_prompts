answer: |-
  **Seminar Handout: The Consciousness Decision Tree**
  **Course:** Phil 304 – The Hard Problem
  **Instructor:** [Your Name]

  Hey everyone. 

  For next week, I want you to stop trying to memorize who believes what. Instead, I want you to find out what *you* believe. 

  Below is a decision tree. It starts with a single intuition about the "explanatory gap" (you know, Mary in the black-and-white room, zombies, all that). Follow the arrows based on your honest gut reaction to the questions. Don't try to game it to land on a famous philosopher's name. If you end up at a leaf that says "Type-B Physicalism," great. If you end up at a box that says "Nobody Really Believes This," also great—that's philosophy.

  Print this out, circle your path, and bring it to class. We'll use it to map the room.

  ***

  ### THE TREE

  **START HERE:**
  **Q1. Imagine you know every single physical fact about the human brain. Does it still feel like there's a "further fact" left over about what it's *like* to be you?**
  *(i.e., Is there an Explanatory Gap?)*

  *   **NO:** It feels like if you know the physics, you've explained the experience. Nothing is left out.
      *   **Q2. Is that subjective feeling real?**
          *   **No:** It's an illusion or a mistake in how we talk. 
              *   👉 **TYPE-A PHYSICALISM (Illusionism / Eliminativism)**
              *   *(e.g., Dennett, Frankish)*
          *   **Yes:** It's real, but it's just a brain state.
              *   👉 **REDUCTIVE PHYSICALISM (Identity Theory)**
              *   *(Note: Often grouped with Type-A in this context)*

  *   **YES:** It feels like the physical facts leave something out. There is a Gap.
      *   **Q3. Is this gap solvable in principle? Could *any* intelligence figure it out?**
          *   **No:** We are cognitively closed. It's like a dog trying to do calculus.
              *   👉 **MYSTERIANISM**
              *   *(e.g., McGinn)*
          *   **Yes:** It's solvable, at least in principle.
              *   **Q4. Is the physical description of the world the *complete* description of reality?**
                  *   **YES:** Physics tells us all the "stuff" that exists.
                      *   **Q5. Will we close the gap by discovering new concepts, or is the gap just a brute fact about our current concepts?**
                          *   **New Concepts:** We need a conceptual revolution to derive experience from physics.
                              *   👉 **TYPE-C PHYSICALISM**
                              *   *(e.g., Alter, Coleman)*
                          *   **Brute Fact:** The link is real but unexplainable; we just have to accept the identity.
                              *   👉 **TYPE-B PHYSICALISM**
                              *   *(e.g., Papineau, Loar)*
                  
                  *   **NO:** Physics leaves out some fundamental features of reality.
                      *   **Q6. Does this non-physical mental stuff have causal powers? (Can it make your arm move?)**
                          *   **No:** It's a shadow. It happens, but it doesn't *do* anything.
                              *   👉 **EPIPHENOMENALISM**
                              *   *(e.g., Huxley, Chalmers [sometimes])*
                          *   **Yes:** It affects the physical world.
                              *   **Q7. Is consciousness a *separate* thing added to matter, or is it what matter *is* deep down?**
                                  *   **Separate:** Mind and Matter are two distinct substances.
                                      *   👉 **INTERACTIONIST DUALISM**
                                      *   *(e.g., Descartes, Popper)*
                                  *   **What Matter Is:** Consciousness is the intrinsic nature of physical stuff.
                                      *   👉 **PANPSYCHISM / RUSSELLIAN MONISM**
                                      *   *(e.g., Goff, Strawson)*

  ***

  ### INSTRUCTOR NOTES (Don't distribute this part)

  Okay, here's the meta-stuff you need to know to run the seminar. The tree works, but logical space is messier than flowcharts. Here are the glitches.

  **1. The "Searle Problem" (Outliers)**
  John Searle (Biological Naturalism) is going to hate this tree. He thinks consciousness is causal (so not Epi), irreducible (so not Type-A), but also purely biological/physical (so not Dualism). He basically sits on the branch between **Type-B** and **Interactionist Dualism** but insists he's a physicalist. If a student lands there and says "Searle," let them argue it. It's a good fight.

  **2. Indistinguishable Leaves (Panpsychism vs. Idealism)**
  You'll notice the tree ends at Panpsychism/Russellian Monism. But what about **Idealism** (everything is mind)? On this tree, they end up in the same spot. Why? Because to separate them, you'd have to ask "Does matter exist independently of mind?" which requires metaphysical baggage undergrads don't have yet. For the purposes of the Hard Problem, they function similarly (consciousness is fundamental). I'd flag this in class: "If you ended up here, would you be bothered if I called you an Idealist instead?"

  **3. Unoccupied Branches (The Graveyard of Ideas)**
  There are logically possible paths nobody takes. Point these out to show why we reject them:
  *   **The "Magic Physicalist" Branch:** If a student answers "Physics is complete" (Q4=Yes) but also "Mind causes physical things" (implied in Q6), they are positing systematic overdetermination. If physics is complete, there's no room for mind to push atoms around without breaking physics. Nobody really defends this because it violates conservation of energy.
  *   **The "Gap Nihilist":** If they say "There is a Gap" (Q1=Yes) but "Experience isn't real" (Q2=No). This is incoherent. You can't have a gap to something that doesn't exist. That's why Type-Aists usually deny the Gap exists in the first place.

  **4. Type-B vs. Type-C**
  This is the hairiest split. Type-B says the gap is permanent but epistemic. Type-C says the gap is ontological but *closable* with new concepts. In practice, these look very similar. The question at Q5 tries to separate them, but students might wobble. That's fine. It shows the boundary is fuzzy.

  **5. A Typo?**
  I left a comma splice in Q3 on purpose. Or maybe I didn't. Check the PDF before printing. Actually, leave it, keeps them on their toes.

  **6. Why start with the Gap?**
  You asked if there was a better starting question. You could start with "Is consciousness physical?" but students don't know what "physical" means yet. Starting with the *feeling* of the Gap (Mary's Room) is better because it relies on their intuition, not their vocabulary. It forces them to admit if they feel the pull of dualism before we tell them dualism is "unscientific."

  See you next term. Read the Chalmers paper, pages 1-10 only. Don't burn out yet.
