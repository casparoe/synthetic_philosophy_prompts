          2.  (If Yes) Is it solvable by humans? (No = Mysterianism).
          3.  (If Yes) Is physics the whole story of reality? (Yes = Type-B/C, No = Dualism/Panpsychism).
          4.  (If Physics Whole Story) Is it a conceptual limitation or can we fix it? (Fix = Type-C, Limit = Type-B).
          5.  (If Physics Not Whole Story) Does mind cause action? (No = Epiphenomenalism, Yes = Dualism/Panpsychism).
          6.  (If Mind Causes) Is mind separate from matter or inside it? (Separate = Dualism, Inside = Panpsychism).
      *   *Commentary Section:* This is crucial for the "flagging" requirement.
          *   Searle problem.
          *   Idealism/Panpsychism blur.
          *   Unoccupied branch: "Physics complete + Mind causes things" (Overdetermination).
          *   Unoccupied branch: "Gap exists + Physics incomplete + Mind doesn't exist" (Contradiction).

  6.  **Tone Check:**
      *   Casual. "Hey," "Look," "Here's the thing."
