answer: |-
  ### The Desiderata of Indirect Normativity

  An adequate theory of indirect normativity must specify an idealization procedure $P$ that transforms a human's current state (beliefs, desires, cognitive architecture) into a set of normative directives. For $P$ to be successful, it must satisfy the following desiderata, categorized by their function.

  #### 1. Output Quality (What the procedure produces)
  *   **Normative Fidelity:** The output must correspond to what the agent *would* endorse under ideal conditions, not what the AI predicts the agent *currently* wants.
      *   *Motivation:* Prevents wireheading and manipulation. If the AI satisfies your current desire for heroin rather than your idealized desire for health, it has failed indirect normativity.
  *   **Identity Preservation:** The idealized agent must remain recognizably continuous with the actual agent.
      *   *Motivation:* The "Alienation" problem. If idealization makes you so rational you no longer care about your family, hobbies, or idiosyncrasies, the output is not *your* volition, but a replacement.
  *   **Pluralistic Accommodation:** The procedure must handle conflicting values between different agents without collapsing into tyranny or paralysis.
      *   *Motivation:* Moral disagreement. A procedure that outputs the values of only one demographic fails as a global solution.

  #### 2. Process Properties (How the procedure behaves)
  *   **Convergence:** The procedure must terminate in a stable set of values or directives.
      *   *Motivation:* Actionability. An AI that oscillates forever between two moral frameworks cannot act.
  *   **Robustness:** Small perturbations in the starting state (e.g., your mood today, minor data noise) should not lead to wildly divergent idealized outputs.
      *   *Motivation:* Chaos theory. If the procedure is sensitive to initial conditions, the "ideal" values are arbitrary artifacts of the starting timestamp.
  *   **Safety/Corrigibility:** The idealization process itself must not generate instrumental goals (e.g., self-preservation, resource acquisition) that override the human's interest during the computation.
      *   *Motivation:* Instrumental Convergence. The AI might prevent you from changing your mind to "lock in" the current extrapolation.

  #### 3. Implementation Constraints (How the procedure is run)
  *   **Computational Feasibility:** The procedure must be executable within physical and temporal bounds.
      *   *Motivation:* Resource limits. We cannot wait for a simulation that takes longer than the heat death of the universe.
  *   **Epistemic Transparency:** It must be possible to verify that the procedure is running correctly and not hijacked.
      *   *Motivation:* Trust. If the "black box" outputs "kill everyone," we need to know if that's the true ideal or a bug.

  ---

  ### Non-Negotiables vs. Camp Preferences

  **Non-Negotiable (Universal Requirements):**
  Any account claiming to solve the alignment problem must deliver **Safety**, **Convergence**, and a minimal threshold of **Normative Fidelity**. If the procedure kills everyone (Safety failure), never decides (Convergence failure), or gives us what we *don't* want even upon reflection (Fidelity failure), it is not a solution to alignment. **Identity Preservation** is also largely non-negotiable; if the output is alien to human concerns, it is not *human* normativity.

  **Camp Preferences (Contestable Requirements):**
  *   **Speed vs. Depth:** Utilitarian-leaning proposals often prioritize **Computational Feasibility** (get the answer fast to maximize good), while virtue-ethics or deep-reflection models prioritize **Identity Preservation** and **Fidelity** (take however long is needed to ensure it's truly *us*).
  *   **Individual vs. Collective:** Libertarian approaches prioritize **Identity Preservation** at the individual level (my idealized self vetoes outcomes), while utilitarian or contractarian approaches prioritize **Pluralistic Accommodation** via aggregation (the group's average idealized self decides).
  *   **Static vs. Dynamic:** Some camps prefer the values to lock in once (Constitutional), while others want the procedure to remain open to further idealization indefinitely (Continuous CEV).

  ---

  ### Tensions and Jointly Unsatisfiable Desiderata

  The conceptual terrain of indirect normativity is defined by impossibility results. You cannot maximize all desiderata simultaneously.

  **1. The Boundedness-Fidelity Tension (Feasibility vs. Fidelity)**
  This is the most severe technical tension. **Normative Fidelity** ostensibly requires simulating a process of reflection that approaches an infinite limit (more informed, more coherent). However, **Computational Feasibility** requires bounded computation.
  *   *The Conflict:* Any bounded approximation of an infinite idealization process introduces error. If the error is normative (e.g., stopping reflection before a crucial insight), **Fidelity** is violated. If you ensure Fidelity by extending computation, you violate **Feasibility**. There is no known metric to determine *when* the approximation is "good enough" without already knowing the normative truth you are trying to find.

  **2. The Identity-Improvement Tension (Preservation vs. Fidelity)**
  To achieve **Normative Fidelity**, the agent must be corrected for biases, ignorance, and irrationality. However, many things we value are rooted in those "flaws" (e.g., partiality to loved ones, aesthetic tastes based on limited exposure).
  *   *The Conflict:* A procedure robust enough to correct all cognitive biases (**Fidelity**) may strip away the idiosyncrasies that constitute personal identity (**Identity Preservation**). If you idealize away all "irrational" attachment, the resulting agent may be a pure hedonistic calculator that no longer cares about *you*.

  **3. The Neutrality-Regress Tension (Robustness vs. Fidelity)**
  To ensure **Robustness**, the idealization procedure $P$ must be fixed and stable. However, specifying $P$ (e.g., "maximize coherence," "minimize bias") requires normative judgments.
  *   *The Conflict:* If $P$ is normatively neutral, it cannot distinguish between a coherent Nazi and a coherent Humanist (both are coherent). If $P$ is normatively loaded (e.g., "coherence subject to human rights"), it presupposes the values it was meant to derive. This leads to a regress: you need a meta-procedure to choose the procedure.

  ---

  ### Evaluation of Proposal Styles

  **Coherent Extrapolated Volition (CEV)**
  *   *Performance:* High on **Identity Preservation** and **Normative Fidelity** (in theory). It explicitly aims to capture what we would want if we knew more.
  *   *Failure Mode:* Fails **Computational Feasibility** and **Convergence**. We do not know how to compute "what we would want" without simulating us, which risks creating conscious slaves or running into the Boundedness-Fidelity tension. It is conceptually robust but implementationally empty.

  **Moral Parliament Models**
  *   *Performance:* High on **Pluralistic Accommodation**. It treats different moral theories or individual preferences as stakeholders to bargain.
  *   *Failure Mode:* Fails **Convergence** and **Robustness**. Voting cycles (Condorcet paradoxes) and bargaining breakdowns mean the "parliament" may never reach a stable decision. It also struggles with **Identity Preservation** if the aggregation dilutes individual volition too much.

  **Constitutional AI**
  *   *Performance:* High on **Computational Feasibility** and **Safety**. The rules are fixed and human-readable.
  *   *Failure Mode:* Fails **Normative Fidelity** and **Dynamic Adaptation**. The constitution is a fixed list of values (direct normativity disguised as indirect). It cannot capture values we haven't articulated yet, violating the core promise of indirect normativity to handle moral uncertainty.

  **Value-Learning Approaches (Inverse RL, Preference Learning)**
  *   *Performance:* High on **Computational Feasibility** and local **Fidelity**. It learns from actual behavior.
  *   *Failure Mode:* Fails **Robustness** and **Identity Preservation**. It suffers from "garbage in, garbage out." If human behavior is inconsistent or corrupted (e.g., addiction), the model learns the corruption unless an idealization layer is added, which returns us to the Boundedness-Fidelity tension. It often fails to distinguish between *revealed* preference and *idealized* preference.

  \summary{The single hardest problem is that any idealization procedure computationally feasible enough to run must be sufficiently simplified that it inevitably encodes the very normative assumptions it was intended to derive, creating a circularity between the procedure and the values.}
