  ## 1. Claims Both Parties Accept

  We, the undersigned, having engaged in decades of independent research and recent adversarial collaboration, hereby record the following points of agreement regarding the formal structure of the two-person cooperative bargaining problem.

  1.  **The Setting:** We agree that the canonical bargaining problem is defined by a pair $(S, d)$, where $S \subset \mathbb{R}^2$ is the feasible set of utility pairs and $d \in S$ is the disagreement point. We accept the standard regularity conditions: $S$ is compact, convex, and comprehensive (if $x \in S$ and $y \leq x$, then $y \in S$), and there exists at least one $x \in S$ such that $x > d$.
  2.  **Shared Axioms:** We agree that any valid bargaining solution $f(S, d)$ must satisfy the following three axioms:
      *   **Pareto Efficiency:** $f(S, d)$ must lie on the Pareto frontier of $S$.
      *   **Symmetry:** If $S$ is symmetric about the line $x_1 = x_2$ and $d_1 = d_2$, then $f_1(S, d) = f_2(S, d)$.
      *   **Invariance to Affine Transformations:** The solution must be invariant under positive linear transformations of the players' utility functions.
  3.  **Conditions for Coincidence:** We acknowledge that the Nash Bargaining Solution (NBS) and the Kalai–Smorodinsky Solution (KSS) yield identical outcomes in specific classes of problems, most notably when the feasible set is symmetric and the Pareto frontier is linear (or symmetrically curved such that the ray to the utopia point intersects the frontier at the point maximizing the product of gains).
  4.  **Normative Intent:** We agree that both solution concepts aim to formalize the notion of a "rational agreement" derived from the structure of the problem itself, rather than from procedural details of the bargaining process. We differ not on the goal, but on which structural features of $(S, d)$ are morally and rationally relevant.

  ## 2. Disagreements Table

  The following table summarizes the precise technical and philosophical divergences between our positions. Each statement is phrased to be acceptable to the proponent of that view.

  | Point of Divergence | The Nash Position (Proponent of NBS) | The Kalai–Smorodinsky Position (Proponent of KSS) |
  | :--- | :--- | :--- |
  | **Core Axiom** | **Independence of Irrelevant Alternatives (IIA):** If $T \subset S$ and $f(S, d) \in T$, then $f(T, d) = f(S, d)$. Removing feasible options that were not selected should not alter the agreement. | **Individual Monotonicity (IM):** If $T \subset S$ and the utopia point for player $i$ decreases while the other's remains constant, then $f_i(T, d) \leq f_i(S, d)$. A reduction in a player's maximum potential must not benefit them. |
  | **Relevance of Utopia** | The utopia point (the vector of maximum feasible utilities) is not a fundamental parameter. Only the local geometry of the frontier at the solution matters. | The utopia point is a fundamental reference point representing bargaining power. The solution must lie on the line segment connecting $d$ to the utopia point. |
  | **Interpretation of "Irrelevant"** | An alternative is irrelevant if it is not chosen. Its mere existence in the feasible set cannot command a concession. | An alternative is relevant if it defines the bounds of possibility. Changing the bounds changes the relative claims of the parties, even if the previous solution remains feasible. |
  | **Verbal Disagreement** | *None identified.* We agree on the definitions of the axioms. | *None identified.* We agree that IIA and IM are logically incompatible in the general convex case. |

  ## 3. Cruxes

  The persistence of our disagreement rests on two sub-questions. Settling either would compel one of us to revise our position.

  1.  **The Stability Crux:** Is the stability of the agreement under the contraction of the feasible set (IIA) more valuable than the responsiveness of the agreement to changes in bargaining power (IM)?
      *   *Resolution Condition:* A demonstration that IIA permits a player to benefit from a reduction in their own maximum feasible utility, or that IM forces an agreement to shift when the removed options were genuinely irrelevant to the parties' claims.
  2.  **The Information Crux:** Does the rational bargainer know only the local gradient of the frontier at the solution (favoring NBS), or do they know the global extent of the feasible set including the utopia point (favoring KSS)?
      *   *Resolution Condition:* A consensus on whether the "utopia point" constitutes private information available to the agents during the derivation of the solution.

  ## 4. Numerical Specifications and Falsification Conditions

  For each Crux, we specify a concrete bargaining problem $(S, d)$ and a subset $(T, d)$ with $d = (0,0)$. We record our divergent predictions and the conditions under which we would concede error.

  ### Crux 1: Stability vs. Responsiveness (IIA vs. IM)

  **The Problem:**
  *   **Set $S$:** The convex hull of $(0,0)$, $(0,1)$, and $(1, 0.5)$.
      *   Pareto Frontier: The line segment connecting $(0,1)$ and $(1, 0.5)$. Equation: $y = 1 - 0.5x$.
      *   Utopia Point $u(S)$: $(1, 1)$.
  *   **Set $T$:** The convex hull of $(0,0)$, $(0, 0.8)$, and $(1, 0.5)$.
      *   Note: $T \subset S$. The point $(1, 0.5)$ is in both.
      *   Pareto Frontier: The line segment connecting $(0, 0.8)$ and $(1, 0.5)$. Equation: $y = 0.8 - 0.3x$.
      *   Utopia Point $u(T)$: $(1, 0.8)$.

  **Predictions:**

  | Position | Predicted Solution for $S$ | Predicted Solution for $T$ | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Nash (NBS)** | $(1, 0.5)$ | $(1, 0.5)$ | The product of gains $x_1 x_2$ is maximized at $(1, 0.5)$ in both sets. Since the solution to $S$ is available in $T$, IIA dictates the solution remains unchanged. |
  | **Kalai–Smorodinsky (KSS)** | $(2/3, 2/3) \approx (0.67, 0.67)$ | $(8/11, 6.4/11) \approx (0.73, 0.58)$ | In $S$, the ray to $(1,1)$ intersects $y=1-0.5x$ at $x=2/3$. In $T$, the ray to $(1, 0.8)$ intersects $y=0.8-0.3x$ at $x=8/11$. Player 2's payoff drops because their utopia payoff dropped from $1$ to $0.8$. |

  **Falsification Conditions:**
  *   **For the Nash Position:** We would concede if it is demonstrated that holding Player 2's payoff constant at $0.5$ while their maximum potential drops from $1.0$ to $0.8$ violates a fundamental principle of fairness regarding relative gains. Specifically, if Player 2 can credibly claim that the removal of the region between $y=0.8$ and $y=1$ weakens their bargaining position, the invariance of their payoff is indefensible.
  *   **For the Kalai–Smorodinsky Position:** We would concede if it is demonstrated that the shift from $(0.67, 0.67)$ to $(0.73, 0.58)$ rewards Player 1 for the removal of options they never intended to claim. If the options removed were "irrelevant" to the initial agreement, changing the outcome implies the solution is manipulated by the structure of the set rather than the merits of the claim.

  ### Crux 2: The Information Crux (Local vs. Global)

  **The Problem:**
  *   **Set $S$:** The convex hull of $(0,0)$, $(0,1)$, and $(1, 0)$. (Standard Symmetric Triangle).
      *   Utopia Point $u(S)$: $(1, 1)$.
  *   **Set $S_{mod}$:** Identical to $S$ in the neighborhood of the solution $(0.5, 0.5)$, but truncated such that the utopia point becomes $(1, 0.6)$.
      *   Constructed as the convex hull of $(0,0)$, $(0, 0.6)$, and $(1, 0)$.
      *   Note: The local gradient at $(0.5, 0.5)$ is unchanged in the relevant region for Nash, but the utopia point shifts.

  **Predictions:**

  | Position | Predicted Solution for $S$ | Predicted Solution for $S_{mod}$ | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Nash (NBS)** | $(0.5, 0.5)$ | $(0.5, 0.5)$ | The local geometry maximizing the product of gains is unchanged. The reduction in Player 2's maximum potential is irrelevant provided the optimal point remains feasible. |
  | **Kalai–Smorodinsky (KSS)** | $(0.5, 0.5)$ | $(0.625, 0.375)$ | In $S$, the ray to $(1,1)$ yields $(0.5, 0.5)$. In $S_{mod}$, the ray to $(1, 0.6)$ is $y=0.6x$. Intersecting $x+y=1$ yields $1.6x=1 \Rightarrow x=0.625$. Player 1 gains because Player 2's potential shrunk. |

  **Falsification Conditions:**
  *   **For the Nash Position:** We would concede if it is accepted that bargaining power is inherently defined by the ratio of maximum possible gains. If the "threat" of walking away is modulated by how much one *could* have gained, ignoring the utopia point ignores a key component of leverage.
  *   **For the Kalai–Smorodinsky Position:** We would concede if it is accepted that rational agents do not condition their agreements on hypothetical maxima that are unreachable. If the utopia point is merely a theoretical bound rather than a credible claim, anchoring the solution to it introduces noise rather than clarity.

