answer: |-
  The framing you describe isn't "off"—it is the central tension in bioethics (often framed as Ronald Dworkin's "precedent autonomy" vs. Rebecca Dresser's "current interests"). However, the debate often stalls because both sides assume a stable definition of "personhood" that the situation itself destroys. The real argument isn't just about which self wins; it's about whether a human life is a *narrative to be completed* or a *series of experiences to be endured*.

  Here is a dialogue that attempts to push past the stalemate into that metaphysical discomfort.

  ***

  **Setting:** *A quiet corner of a university library, late evening. Two philosophy professors, MARA (M) and ROBERT (R), are packing up their books. They have clearly been talking for a while.*

  **Mara:** You keep using the word "stranger." That's the emotional hook, Robert, but it doesn't do the metaphysical work. You say the woman in the bed is a stranger to the woman who signed the directive. Fine. But she is the *continuation* of that woman's biology, her history, her social footprint. If I write a will, I am disposing of property I won't live to touch. Why is disposing of my body different?

  **Robert:** Because a will disposes of objects. An advance directive disposes of a subject. When you sign that paper, you are projecting a bridge across a chasm you haven't seen yet. You're saying, "If I become X, treat me as Y." But if you become X, *you* are gone. The entity in the bed isn't crossing the bridge; the bridge ended halfway across.

  **Mara:** That's too clean. It suggests a sudden snap. "You" are gone. But identity isn't binary. It's a fading signal. If I have early-stage dementia, I'm still me. If I have late-stage, I'm less me. Where is the cutoff where my signature loses its moral weight? If you say "when she becomes happy," you're making her welfare the only metric. But human beings value things other than happiness. We value integrity.

  **Robert:** *Integrity* is a narrative concept. It requires a narrator. The woman in the bed cannot narrate. She can only experience. You're privileging the *story* of the life over the *life* itself. Imagine she is listening to music she loves. She is clapping. She is safe. To turn off the music, to withdraw care, because the "ancestor" decided this state was undignified… that feels like a sacrifice. You are sacrificing a living, breathing creature to a ghost's idea of purity.

  **Mara:** But whose purity? That's where you're smuggling in a value judgment. You assume the present self's joy is the only real currency. But the earlier self made a judgment about what makes a life *human*. If I said, "If I cannot recognize my children, do not keep me alive," I wasn't just saying "I won't be happy." I was saying, "That state is incompatible with the values that defined me." If we ignore that, we aren't respecting the person; we are keeping a biological pet.

  **Robert:** A biological pet? That's harsh.

  **Mara:** It's accurate. If we override the directive because "she seems content," we are saying her capacity for reflection was irrelevant. We are saying the only thing that mattered was the dopamine. But we don't treat people that way when they are competent. If a competent Jehovah's Witness refuses a blood transfusion, we don't say, "But you'll be so much happier alive!" We respect the refusal because we respect the *agency*, not the outcome.

  **Robert:** But the competent Witness is still *there*. She can weigh the trade-off. She can say, "I accept death to maintain my faith." The demented patient cannot weigh anything. She cannot accept the trade-off. So *who* is accepting it? You are. I am. The family is. We are imposing the earlier self's values on a being who can no longer consent to them. That's not autonomy. That's necrocracy. Rule by the dead.

  **Mara:** "Rule by the dead." That sounds dramatic, but isn't that what culture is? We are bound by promises, contracts, and vows made by our past selves all the time. If I vow to marry you, my future self is bound even if I fall out of love. Why is the vow to die different?

  **Robert:** Because marriage affects another person. This directive is unilateral. And the "falling out of love" analogy fails because you still *remember* the vow. You can feel the tension between your past promise and your present desire. The demented patient doesn't feel the tension. She doesn't know she's breaking a vow. She doesn't know she has a self that *had* vows. To enforce the vow is to introduce a conflict she is incapable of holding. You're tormenting a consciousness that doesn't know it's supposed to be tormented.

  **Mara:** But isn't the alternative worse? If we say the directive doesn't hold, we are telling every competent person: "You cannot plan for your end. Your worst moment will overwrite your best judgment." That creates a profound anxiety. It means I am never truly the author of my life, because the final chapter can be rewritten by a version of me I don't recognize.

  **Robert:** Or… it means we acknowledge that life is fragile and authorship is an illusion. You want to be the author of the whole book. But you can't write the last chapter. You lose the pen. Why is it better to force a ghost to hold the pen and scribble over the hands of the living writer?

  **Mara:** Because without that authority, the "living writer" isn't writing a human story anymore. She's just reacting to stimuli. You're reducing the human being to a vessel of sensation. I'm arguing for the continuity of *character*. Even if the memory is gone, the trajectory matters.

  **Robert:** Trajectory implies a destination. What if the destination changed? Look, Mara, let's get specific. Suppose the directive says "no antibiotics for pneumonia." She gets pneumonia. She's confused but smiling. If we follow the directive, she dies. If we break it, she lives for six months, eating ice cream, watching sunsets.
  Now, who is harmed? The woman in the bed? She doesn't know she's dying. She doesn't fear death. She just experiences the sunset.
  The earlier self? She's dead. She feels no betrayal.
  So whose interest is actually being served by following the directive?

  **Mara:** The interest of the *life as a whole*.

  **Robert:** A "life as a whole" is a concept for the observers. The family. The doctors. You. It's not a thing the patient possesses. When you say "the life as a whole," you really mean "the story we tell about her." You're protecting the survivors from the dissonance of seeing her like this.

  **Mara:** That's cynical.

  **Robert:** Is it? Or is it possible that advance directives are often less about the patient's future and more about the past self's fear of loss of control? The earlier self is terrified of becoming dependent, messy, childish. So she legislates against it. But when she actually *becomes* that messy, childish thing, that thing has a right to exist. The earlier self's fear shouldn't be a death sentence for the later self's existence.

  **Mara:** But if the earlier self's fear is based on a coherent value system—say, that dependency is degrading—why should we discard that? We don't discard a person's religious beliefs just because they get sick.

  **Robert:** Because religion is practiced by a mind that can interpret it. Dementia destroys the interpreter. Here is the hard question, Mara: If psychological continuity is broken—if she doesn't remember her name, her values, her children—is it the *same person*? If it's not the same person, then the directive is a contract signed by Person A to kill Person B.

  **Mara:** I reject the premise that personhood is purely psychological. I am my body. I am my history. Even if the memory is gone, the causal chain is unbroken.

  **Robert:** Causal chain isn't enough. A stone rolling down a hill has a causal chain. We care about persons because of the inner light. The capacity to value. When that capacity shifts fundamentally, the moral status shifts. If the later self can experience joy, and cannot experience the "violation" of the directive, the harm is theoretical. The benefit of life is actual.

  **Mara:** The harm isn't to the *moment*. It's to the *trust*. If society says, "Your prior wishes only count as long as you remain the person you were," then advance directives are useless. They only work in the exact scenario you're describing: when you are no longer you. If we invalidate them there, we destroy the tool entirely. We leave people at the mercy of their future degradation.

  **Robert:** Maybe the tool is flawed. Maybe the idea that we can control our future selves is the arrogance. We can control our property. We can control our finances. But we cannot control our consciousness. Why do we insist we have the right to?

  **Mara:** Because without that right, we are not agents. We are passengers.

  **Robert:** And if insisting on being the agent requires sacrificing the passenger?

  *(Silence stretches between them. The library lights flicker, signaling closing time.)*

  **Mara:** I think… I think the hardest part isn't the philosophy. It's the witnessing.

  **Robert:** How so?

  **Mara:** If I follow the directive, I am actively ending the life of someone who is smiling at me. That is a trauma for *me*. For the witness. But if I ignore the directive, I am betraying the person I loved, the person who trusted me to protect her dignity. I am betraying the trust of the dead to comfort the living.

  **Robert:** So it's not about which self has authority. It's about which betrayal is more bearable.

  **Mara:** It's about whether we think a human life is defined by its coherence or its duration.

  **Robert:** And whether we have the right to decide that for someone who can no longer decide for herself.

  **Mara:** We have to decide, Robert. She can't.

  **Robert:** I know. That's the tragedy. Not that there's a right answer we can't find. But that the question itself proves the "self" we're trying to protect has already fractured. We're arguing over who owns the shards.

  **Mara:** Then perhaps the directive shouldn't be a command. It should be a testimony. "This is what I feared. This is what I valued." And the proxy has to weigh that testimony against the reality of the person in front of them.

  **Robert:** That gives the proxy too much power.

  **Mara:** We already have that power. We just hide it behind the "binding authority" of the paper to absolve ourselves of the guilt.

  **Robert:** *(Packs his bag slowly)* So we're back to where you started. The argument isn't about the patient. It's about us.

  **Mara:** It's always been about us. The patient is just the mirror.

  *(They stand, turning off the lamps. The room goes dark, leaving the question suspended in the space between them.)*
