answer: |-
  Here is a specification of the desiderata for a theory of decision-making under the unilateralist's curse. This framework distinguishes between the functional requirements necessary to solve the coordination problem and the normative commitments that remain contested.

  ### I. The Desiderata and Their Motivating Cases

  An adequate account must satisfy the following five requirements. Each is motivated by a specific failure mode or case class.

  #### 1. The Anti-Curse Condition (Systematic Reliability)
  **Requirement:** The decision rule must prevent the probability of action from approaching 1 as the number of capable agents ($N$) increases, provided the true expected value of the action is negative.
  **Motivating Failure Mode:** *The Aggregation of Error.*
  In the standard unilateralist model, agents act if their private estimate $E[U] > 0$. Even if the true $E[U]$ is negative, statistical noise ensures some agents will overestimate the value. If $N$ is large enough, it becomes near-certain that at least one agent will receive a positive signal and act.
  **Case:** *Geoengineering Injection.* One climate scientist, convinced by their private model that sulfur injection will cool the planet, releases aerosols. Ninety-nine other scientists disagree, but lack the unilateral capacity to stop the first. The group outcome reflects the outlier, not the consensus.

  #### 2. The Emergency Exception (Responsiveness)
  **Requirement:** The decision rule must permit immediate action when the expected value is overwhelmingly positive and the cost of delay is catastrophic.
  **Motivating Failure Mode:** *Bureaucratic Paralysis.*
  If a rule requires consensus or high thresholds to avoid the curse, it risks creating a "unilateralist's paralysis," where clearly beneficial actions are forgone due to coordination costs.
  **Case:** *The Bystander and the Ambulance.* A single bystander sees a pedestrian struck by a car. Calling emergency services is a unilateral action affecting the group (traffic, resources), but requiring consensus would result in death. The theory must explain why this is permissible while the geoengineering case is not.

  #### 3. The Epistemic Pooling Constraint
  **Requirement:** Agents must treat the inaction of other capable agents as evidence against the value of the action.
  **Motivating Failure Mode:** *The Isolationist Fallacy.*
  Individual rationality fails in this context because agents treat their private signal as the only data point. A robust theory requires agents to update their priors based on the fact that others, who presumably have access to similar information and capabilities, have chosen *not* to act.
  **Case:** *The AI Lab Race.* Five labs are capable of deploying a risky AGI architecture. Four have paused. The fifth lab cannot rationally proceed simply because their internal safety audit passed; they must update on the fact that four peer audits presumably found reasons to pause. Ignoring this is epistemically irrational.

  #### 4. Reversibility Sensitivity
  **Requirement:** The threshold for unilateral action must scale inversely with the reversibility of the initiative.
  **Motivating Failure Mode:** *The Ratchet Effect.*
  Treating reversible and irreversible actions identically leads to excessive risk-taking on hard-to-undo initiatives.
  **Case:** *Software Deployment vs. Viral Release.* A developer unilaterally pushing a code update that can be rolled back in five minutes is distinct from a developer unilaterally releasing a self-replicating biological agent. A theory that applies the same threshold to both fails to account for the asymmetry in error costs.

  #### 5. Action/Inaction Symmetry (The Neutrality Constraint)
  **Requirement:** The decision rule should not inherently privilege the status quo (inaction) over initiative (action) solely based on the distinction between commission and omission.
  **Motivating Failure Mode:** *Status Quo Bias.*
  Many proposed fixes to the unilateralist's curse implicitly assume that "doing nothing" is the safe default. However, in some contexts, inaction is the high-risk choice.
  **Case:** *The Trolley Problem Variant.* If a unilateralist can pull a lever to stop a runaway train (action) but chooses not to because of a "consensus required" rule, they are effectively voting for the train to hit the victims. A theory that makes inaction the default safe harbor fails when the status quo is catastrophic.

  ---

  ### II. Classification of Requirements

  #### Non-Negotiable (Core Functional Requirements)
  These are conditions without which the theory fails to address the structural problem of the curse.
  1.  **The Anti-Curse Condition:** If the theory allows the curse to persist, it is not a solution.
  2.  **The Emergency Exception:** If the theory prohibits clearly life-saving unilateral acts, it is morally untenable and practically useless.
  3.  **Epistemic Pooling:** Without this, the agents are not acting as a collective; they are merely acting as isolated individuals, which is the definition of the problem.

  #### Contested or Parochial (Normative Commitments)
  These depend on the specific ethical or political framework of the group.
  1.  **Action/Inaction Symmetry:** Libertarians or deontologists may argue that commission *is* morally weightier than omission, regardless of consequences. A theory requiring symmetry is parochial to consequentialist frameworks.
  2.  **Reversibility Sensitivity:** While pragmatic, defining "reversibility" is contested. Is a cultural shift reversible? Is a nuclear treaty? Groups may disagree on the metric of reversibility.

  ---

  ### III. The Fundamental Tension (Joint Unsatisfiability)

  There is a tension between **The Anti-Curse Condition**, **The Emergency Exception**, and **Decentralized Autonomy**. These three cannot be jointly maximized in high-stakes environments.

  **The Trilemma:**
  1.  **Safety (Anti-Curse):** To ensure a risky action isn't taken by an outlier, you need a high threshold (consensus or near-consensus).
  2.  **Efficiency (Emergency):** To ensure a vital action *is* taken when time is short, you need a low threshold (unilateral permission).
  3.  **Autonomy (Decentralization):** To allow agents to use their private judgment without a central authority dictating moves, you need distributed decision rights.

  **Why they are jointly unsatisfiable:**
  If you prioritize **Safety** and **Autonomy**, you fail **Efficiency** (agents defer to each other indefinitely, leading to paralysis in emergencies).
  If you prioritize **Efficiency** and **Autonomy**, you fail **Safety** (the unilateralist's curse manifests; outliers trigger catastrophe).
  If you prioritize **Safety** and **Efficiency**, you fail **Autonomy** (you must install a central authority to distinguish between "emergency" and "curse" cases, removing unilateral initiative entirely).

  **The Specific Tension:**
  The most acute tension lies between **Epistemic Pooling** and **Responsiveness**.
  *   To satisfy *Epistemic Pooling*, an agent must wait to see if others act. If everyone waits to see if others act, no one acts (a coordination failure similar to the Nash Equilibrium in a stag hunt).
  *   To satisfy *Responsiveness*, an agent must act on their private signal when it is strong. But if everyone acts on strong private signals, the *Anti-Curse Condition* is violated.
  *   **Conclusion:** No static rule satisfies all desiderata across all contexts. An adequate theory must be **context-sensitive**, dynamically adjusting the threshold based on the estimated variance of private signals and the cost of error.

  ---

  ### IV. Brief Scorecard of Main Responses

  | Response | Mechanism | Satisfies Anti-Curse? | Satisfies Emergency? | Notes on Tension |
  | :--- | :--- | :--- | :--- | :--- |
  | **Principle of Conformity** (Bostrom et al.) | Do not act if you believe others would disagree upon full information. | **Yes** | **No** | Fails Emergency Exception; relies on counterfactuals that are hard to compute. |
  | **Moral Trade / Compensation** | Unilateralist compensates those who oppose the action. | **Partial** | **Yes** | Fails on incommensurable values (e.g., existential risk cannot be compensated). |
  | **Deference to Authority** | Designate a specific agent or committee to decide. | **Yes** | **Yes** | Fails Autonomy; creates a single point of failure/corruption. |
  | **Stochastic Restraint** | Agents act with probability $p < 1$ even if $E[U] > 0$. | **Yes** | **Partial** | Reduces curse probability but introduces randomness into high-stakes decisions. |
  | **Contextual Thresholds** | Threshold scales with $N$ and Reversibility. | **Yes** | **Yes** | **Best Fit.** Requires complex meta-coordination to agree on the thresholds themselves. |

  **Summary:** The "Contextual Thresholds" approach is the only one that attempts to navigate the trilemma, but it requires the group to agree on the *meta-rule* for setting thresholds, which itself risks a higher-order unilateralist's curse.
