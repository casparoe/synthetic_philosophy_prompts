answer: |-
  The phenomenon you have identified has an established name in social choice theory and political philosophy. It is called the **Discursive Dilemma** (sometimes referred to as the **Doctrinal Paradox**).

  While the Doctrinal Paradox was the original legal observation (Kornhauser & Sager, 1986), the Discursive Dilemma is the generalized formalization (List & Pettit, 2002). It describes exactly what you saw: a situation where proposition-wise majority voting leads to a collectively inconsistent set of judgments, even when every individual is consistent.

  Here is the breakdown of what this is, how it differs from the paradoxes you mentioned, and a verdict on its severity.

  ### 1. The Anatomy of the Discursive Dilemma

  To define it precisely so you can distinguish it from other voting anomalies, three conditions must be met:

  1.  **Logical Interconnection:** The issues voted on are not independent. They are connected by a logical constraint (e.g., $A \land B \leftrightarrow C$). In your example, "Qualified" ($A$) AND "Good Fit" ($B$) implies "Hire" ($C$).
  2.  **Individual Rationality:** Every voter submits a set of judgments that satisfies the logical constraint. No voter says "Yes, Yes, No."
  3.  **Collective Irrationality:** When you aggregate the votes by simple majority on each proposition independently, the collective result violates the logical constraint. (Majority says Yes to $A$, Yes to $B$, but No to $C$).

  **The Edge Cases:**
  *   **Not just "Mixed Reasons":** In a standard "mixed reasons" scenario, everyone agrees on the conclusion (Hire), but some vote Yes on $A$ and No on $B$, while others do the reverse. The Discursive Dilemma is distinct because the group *disagrees on the conclusion* depending on the procedure used.
  *   **Not just "Independence":** If the questions were independent (e.g., "Should we buy a desk?" and "Should we buy a chair?"), there is no paradox. The paradox *requires* a logical dependency that the aggregation rule ignores.
  *   **Procedure Sensitivity:** The dilemma highlights a conflict between two decision procedures:
      *   **Premise-Based Procedure:** Vote on $A$ and $B$, then derive $C$ logically. (Result: Hire).
      *   **Conclusion-Based Procedure:** Vote directly on $C$. (Result: Do Not Hire).
      *   The paradox is that both procedures are democratic, but they yield opposite outcomes.

  ### 2. Distinction from Other Paradoxes

  You were right to sense it wasn't Condorcet or Simpson. Here is the structural difference:

  *   **Vs. Condorcet's Paradox:** Condorcet involves **preferences over alternatives** (Candidate X vs. Y vs. Z) creating a cycle ($X > Y > Z > X$). The Discursive Dilemma involves **truth-values of propositions** creating a contradiction ($A$ is True, $B$ is True, but $A \land B \to C$ is False). Condorcet is about intransitive preferences; Discursive Dilemma is about inconsistent judgments.
  *   **Vs. Simpson's Paradox:** Simpson's is a **statistical** phenomenon regarding conditional probabilities and subgroup sizes. The Discursive Dilemma is a **logical** phenomenon regarding truth-functional connectives. Simpson's disappears if you control for the variable; the Discursive Dilemma persists even with full information and discussion because it is about aggregating *values/judgments*, not uncovering hidden data.
  *   **Vs. Vote Trading (Logrolling):** In logrolling, I vote for your issue if you vote for mine. In the Discursive Dilemma, voters are not trading; they are voting sincerely according to their consistent views. The inconsistency emerges from the math of aggregation, not strategic behavior.

  ### 3. Verdict: Is it a Real Problem or an Arithmetic Quirk?

  **Verdict: It is a Real Problem.**

  It is not merely an arithmetic quirk; it is a fundamental impossibility theorem regarding **collective rationality**. Christian List and Philip Pettit proved (in *Group Agency*, 2011) that no aggregation method can simultaneously satisfy a few minimal conditions (Universal Domain, Anonymity, Systematicity, and Collective Rationality) for any non-trivial logical connection.

  **Why it is serious:**
  1.  **Accountability:** If a court or committee decides based on the Conclusion (Don't Hire), but the public sees the Premises (Qualified + Fit), the decision looks arbitrary or hypocritical. If they decide based on Premises (Hire), they are overriding the direct vote on the outcome.
  2.  **Instability:** As you noted, the outcome flips based on the order of voting. This allows agenda-setters to manipulate the result simply by choosing whether to vote on the criteria first or the outcome first, without changing any minds.
  3.  **Group Agency:** If we treat committees, courts, or legislatures as "agents" capable of bearing responsibility, they must be rational. An agent that believes $A$, believes $B$, believes $A \land B \to C$, but denies $C$ is incoherent. The Discursive Dilemma proves that majority rule prevents groups from being rational agents in the same way individuals are.

  ### 4. What Would Change My Mind?

  You asked what consideration would flip the verdict from "Real Problem" to "Harmless Artifact" (or vice versa).

  **To flip from "Real Problem" to "Harmless Artifact":**
  I would need to be convinced that **Collective Rationality is not a normative goal.**
  If the only function of a committee is to produce *a* decision to resolve coordination, and nobody cares if the *reasons* for the decision hold together logically, the dilemma is harmless.
  *   *Specific Condition:* If empirical study showed that in high-stakes environments (Supreme Courts, Central Banks), institutions *never* use premise-based voting and strictly enforce conclusion-based voting, the dilemma becomes a theoretical curiosity with no practical bite. If the "rules of the game" forbid voting on premises, the inconsistency cannot manifest.

  **To flip from "Harmless" to "Real Problem" (Reinforcing the current verdict):**
  The severity increases if **Transparency is required for Legitimacy.**
  *   *Specific Condition:* If a committee is required to publish a written justification for its decision (like a judicial opinion or a policy white paper), the Discursive Dilemma becomes critical. You cannot write a coherent justification if the collective premises do not support the collective conclusion.
  *   *The "Flip" Trigger:* If we discover that premise-based voting is actually *more* common than conclusion-based voting in real-world deliberative bodies (because people want to vote on specific criteria), then the inconsistency is not a edge case, but a chronic source of policy incoherence. Given that legislative bodies often vote on amendments (premises) before final bills (conclusions), this condition is frequently met, cementing the verdict that this is a serious structural flaw.

  ### Summary
  You have discovered the **Discursive Dilemma**. It is distinct from Condorcet (preferences vs. logic) and Simpson (statistics vs. logic). It is a serious problem because it demonstrates that **majority rule is incompatible with collective rationality** whenever decisions rely on interconnected reasons. It is not a quirk of arithmetic; it is a limit on the possibility of democratic group agency.
