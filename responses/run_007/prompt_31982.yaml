answer: |-
  Here is the translation of two-dimensional semantics into programming languages vocabulary, followed by the residue report and the verdict you asked for.

  ### The Translation

  In your vocabulary, **Two-Dimensional Semantics (2D)** is a proposal to treat expression evaluation as a function of two distinct environment parameters rather than one. Standard semantics usually assumes a single environment (the "current state"). 2D semantics argues you need to distinguish the environment where **binding** happens from the environment where **evaluation** happens.

  | Philosophical Term | PL Vocabulary Translation |
  | :--- | :--- |
  | **Possible World** | A **Heap State** or **Environment Map** ($\Sigma$). A total mapping of identifiers to values/locations. |
  | **Actual World** | The **Initial Runtime Environment** ($\Sigma_{actual}$). The specific heap state at the moment of program instantiation or module load. |
  | **Counterfactual World** | A **Hypothetical Heap State** ($\Sigma_{hyp}$). A modified version of $\Sigma_{actual}$ used for invariant checking or branching. |
  | **Context of Utterance** | **Binding Site / Declaration Scope**. The lexical context and environment ($\Sigma_{actual}$) active when a name is introduced. |
  | **Context of Evaluation** | **Evaluation Site / Usage Scope**. The environment ($\Sigma_{hyp}$) active when an expression is reduced. |
  | **Primary Intension** | A **Closure** or **Thunk**. A function $\lambda \Sigma. \text{lookup}(\text{name}, \Sigma)$. It captures the *rule* for resolving a name relative to whatever environment is passed to it. |
  | **Secondary Intension** | A **Rigid Value**. The result of applying the Primary Intension to $\Sigma_{actual}$. Once computed, this value (e.g., a heap object ID) is constant across all $\Sigma_{hyp}$. |
  | **Necessary Truth** | An **Invariant**. A proposition that evaluates to `true` in all valid $\Sigma_{hyp}$ reachable from $\Sigma_{actual}$, given fixed rigid values. |
  | **Contingent Truth** | A **State-Dependent Assertion**. True in $\Sigma_{actual}$, but `false` in some valid $\Sigma_{hyp}$. |
  | **A Priori** | **Statically Verifiable / Compile-Time**. Knowable from the type structure or binding rules without inspecting $\Sigma_{actual}$. |
  | **A Posteriori** | **Dynamically Verified / Runtime**. Requires inspecting the values in $\Sigma_{actual}$ to determine truth. |

  #### The Hesperus/Phosphorus Case in PL
  Imagine two lookup functions that search the heap based on descriptive properties.

  ```haskell
  -- Primary Intensions (The Lookup Rules)
  hesperus_rule = \sigma -> find_object_satisfying(sigma, "visible_in_evening")
  phosphorus_rule = \sigma -> find_object_satisfying(sigma, "visible_in_morning")

  -- Context of Utterance (The Actual World)
  sigma_actual = load_universe()

  -- Binding (Fixing the Secondary Intensions)
  -- We run the rules on the actual heap to get rigid references (pointers/IDs)
  let hesperus_ref = hesperus_rule(sigma_actual)
  let phosphorus_ref = phosphorus_rule(sigma_actual)

  -- The Claim: "Hesperus is Phosphorus"
  -- Secondary Intension Evaluation (Counterfactual)
  -- In any hypothetical heap sigma_hyp where these object IDs persist:
  assert(hesperus_ref == phosphorus_ref) 
  ```

  *   **Why it's A Posteriori:** You cannot know `hesperus_ref == phosphorus_ref` from the code alone. You must execute `load_universe()` (inspect $\Sigma_{actual}$).
  *   **Why it's Necessary:** Once bound, `hesperus_ref` and `phosphorus_ref` are the same Object ID. In any counterfactual heap $\Sigma_{hyp}$ where you preserve object identity, they remain equal. The *lookup rules* (Primary) might diverge in $\Sigma_{hyp}$ (e.g., in a world where two different stars appear), but the *values* (Secondary) remain locked to the objects found in $\Sigma_{actual}$.

  #### The "Meter Stick" Case (Contingent A Priori)
  ```haskell
  -- Context of Utterance
  sigma_actual = load_universe()
  stick_S = sigma_actual["Stick_S"]

  -- Stipulative Binding (Defining the meter)
  let meter = stick_S.length() 

  -- The Claim: "Stick S is one meter long"
  -- This is true by definition in this scope (A Priori)
  assert(stick_S.length() == meter) 

  -- But it is Contingent:
  -- In a hypothetical heap sigma_hyp where thermal expansion occurs:
  if sigma_hyp["Stick_S"].length() != meter then 
      -- The assertion fails in the counterfactual evaluation
      -- even though it was true by definition in the actual binding.
  ```

  ---

  ### Residue Report

  Here is where the translation holds, where it strains, and where it breaks.

  #### 1. Clean Translations
  *   **Binding vs. Evaluation:** The core distinction between *where* a name gets its value (Context of Utterance) and *where* it is used (Context of Evaluation) maps perfectly to **Static Binding (Closures)** vs. **Dynamic Evaluation**.
  *   **Rigidity:** Kripkean rigid designators map cleanly to **Object Identity / Pointers**. Once you have the pointer, it points to the same memory location regardless of how the variables describing it change.
  *   **The Matrix:** The 2D matrix (World of Utterance $\times$ World of Evaluation) is structurally identical to a function signature `eval(expr, env_binding, env_execution)`. Most PLs fix `env_binding` to compile-time; 2D semantics allows it to vary.

  #### 2. The Fudges (Where I had to stretch)
  *   **"Worlds" vs. "Heaps":** In PL, a heap is partial and mutable. In philosophy, a "Possible World" is a maximal, consistent state of affairs. I treated worlds as heaps, but philosophers mean something more like "complete models of reality." In PL, we can have a heap where `x == y` and another where `x != y` easily. In philosophy, changing `x` might require changing the laws of physics to remain "consistent."
  *   **A Priori vs. Static:** I mapped *A Priori* to *Compile-Time/Statically Verifiable*. This is close, but not exact. In PL, something is static because the compiler can see it. In philosophy, something is *a priori* because it is knowable by reason alone. You can have runtime constants that are *a priori* (logical truths computed at runtime). The PL distinction is about *mechanism*; the philosophical distinction is about *justification*.
  *   **Privilege of the Actual:** In PL, $\Sigma_{actual}$ is just the current pointer. It has no metaphysical privilege. In 2D semantics, the "Actual World" is indexically privileged. It's the "here and now." PL handles this with `this` or `current_env`, but we don't treat it as ontologically special, just practically convenient.

  #### 3. No Counterpart (The Gap)
  *   **Cognitive Significance (Fregean Sense):** This is the biggest missing piece. In PL, `x = 5` and `y = 5` are semantically interchangeable if `x` and `y` are values. In 2D semantics, "Hesperus" and "Phosphorus" have the same reference (Secondary Intension) but different **cognitive roles**. PL optimizes this away (common subexpression elimination). Philosophy keeps it because it explains why `Hesperus == Phosphorus` is informative while `Hesperus == Hesperus` is not. PL has no native type for "informativeness."
  *   **Conceivability:** Philosophers use "conceivable" to probe possibility (if I can conceive it, it's a possible world). PL uses "type safety" or "reachability." There are heaps that are type-safe but physically inconceivable, and vice versa. The bridge between *epistemic possibility* (what I can imagine) and *metaphysical possibility* (what can exist) has no direct analog in type theory.

  ---

  ### The Verdict

  You asked: *Is the part that doesn't translate a sign that my vocabulary is missing something, or that the philosophers' distinction is doing less work than it looks like?*

  **It is both.**

  **1. Where your vocabulary is missing something:**
  PL semantics is designed for **implementation**, not **cognition**. You strip away "modes of presentation" because they are irrelevant to the machine. Two-dimensional semantics is trying to formalize the *user's* perspective of the code, not just the machine's execution.
  The "Primary Intension" is essentially a **dependency graph** or a **symbolic execution trace** that PLs usually discard after compilation. If you want to build systems that explain *why* a result occurred (explainable AI, debugging, provenance), your current vocabulary is insufficient. You need a way to represent the *rule* that produced a value, not just the value itself. 2D semantics captures that distinction rigorously.

  **2. Where the philosophy is doing less work than it looks:**
  A significant chunk of 2D semantics is indeed **dynamic scoping vs. static scoping** dressed in metaphysical robes.
  *   **Secondary Intension** = Static Binding (Lexical Scope).
  *   **Primary Intension** = Dynamic Binding (Dynamic Scope / Late Binding).

  When philosophers agonize over whether "Water is H2O" is necessary a posteriori, they are often wrestling with a **late-binding problem**. They are asking: "Do we bind the symbol 'Water' to the description 'clear liquid' (dynamic/primary) or to the microstructure 'H2O' (static/secondary)?"
  PL solved this in the 1960s with Algol 60 (lexical scope) and later with modules/interfaces. We decide at design time whether a name is an interface (Primary/Description) or a concrete implementation (Secondary/Rigid).

  **Conclusion:**
  The core machinery of 2D semantics is **environment passing**. It is not magic. However, the *motivation* (tracking epistemic status and cognitive significance) points to a layer of abstraction that PL theory typically ignores.
  If you are building a compiler, 2D semantics is overhead; your intuition that it's "scope machinery dressed up" is correct.
  If you are building a **knowledge representation system**, a **logic for security policies**, or **formal verification of requirements**, the distinction is vital. You need to know if a property holds because of how you defined your terms (Primary/A Priori) or because of how the universe happens to be configured (Secondary/A Posteriori).

  **Straight answer:** The untranslatable residue is **Epistemology**. PL handles *Truth*; 2D semantics tries to handle *Knowledge of Truth*. If your type system doesn't model the *agent's knowledge state*, 2D semantics will always look like you're passing extra environment parameters for no reason. If you add an epistemic modality to your types, the translation becomes exact.
