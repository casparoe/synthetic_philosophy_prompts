answer: |-
  Darwin would likely have received Gould and Lewontin's paper with a mixture of vindication and irritation. Your intuition is correct: he was never the naive Panglossian that the 'spandrels' critique often presupposes. Had he read their argument, he would have recognised in it a familiar tension he navigated throughout his career, specifically between the power of natural selection and the laws of variation.

  On the matter of non-adaptive traits, Darwin would have found himself in substantial agreement with the central thesis. In the *Origin*, he devoted considerable space to what he termed 'correlation of growth'. He acknowledged that organisms are integrated wholes, such that a variation in one part often necessitates changes in another, regardless of utility. He cited examples such as the correlation between blue eyes and deafness in white cats, or the way that distinct varieties of plants might share peculiarities of structure not due to selection. He understood that some features are merely the necessary geometric or developmental consequences of other changes. In this sense, the spandrel analogy would have resonated with him; he knew that architecture constrains ornamentation. He explicitly warned against assuming every detail of structure was separately selected, noting that some traits might be preserved simply because they were linked to advantageous features.

  However, Darwin would have balked at the implication that this observation undermines the primary explanatory power of natural selection. For Darwin, selection was not merely one tool among many; it was the 'power' that domineered over the laws of variation. While he conceded that laws of growth played a role, he consistently argued that natural selection could accumulate variations arising from those laws if they proved useful. He viewed structural constraints as the raw material upon which selection acted, rather than as a rival hypothesis that displaced selection. He would likely have argued that Gould and Lewontin, in their zeal to correct adaptationist excesses, risked swinging the pendulum too far towards internalism. He spent much of his later career defending selection against critics who attributed too much to direct environmental effects or internal laws of variation, and he might have viewed the spandrels paper as a sophisticated resurrection of those older, less potent explanations.

  Regarding the charge of 'just-so stories', Darwin's reaction would have been nuanced. He was certainly aware of the danger of speculative reasoning. He frequently cautioned that we must not assume every trait is adaptive without evidence, and he admitted that our ignorance of the laws of variation often forces us into conjecture. Yet, he also defended the use of plausible hypotheses as a starting point for inquiry. He would likely have conceded that some of his successors had indeed indulged in the fanciful storytelling Gould and Lewontin lampooned, turning heuristic devices into dogmas. He might have accepted that the 'adaptationist programme' had become rigid in ways he did not intend.

  Nevertheless, Darwin would probably have felt that characterising the tradition he founded as inherently blind to constraints was unfair to his own work. He did not treat selection as a magic wand that could produce any conceivable trait; he was acutely aware of historical contingency and structural limitation. He would likely have argued that the error lies not in seeking adaptive explanations, but in failing to test them against alternative hypotheses involving correlation and development.

  Ultimately, Darwin would have viewed the spandrels argument as a necessary corrective rather than a revolution. He would have agreed that not every trait is an adaptation, but he would have insisted that the preponderance of complex design still demands a selectionist explanation. He would have seen Gould and Lewontin as allies in cautioning against excess, but opponents in their reluctance to acknowledge selection as the chief architect of the organic world. The debate, he might have suggested, is not whether spandrels exist, but whether the dome itself could stand without them.
