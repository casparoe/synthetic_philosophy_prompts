answer: |-
  You have diagnosed the state of the dialectic with remarkable precision. Your working hypothesis is not only correct; it aligns with the meta-philosophical consensus among those who have stepped back from the technical trenches to look at the war as a whole.

  The Frege–Geach (F-G) problem has ceased to be a "refutation" and has become a "constraint." As you note, the technical machinery exists to solve the embedding problem (via commitment semantics, plan-laden contents, bipartite states, etc.). The persistence of the debate is not due to a lack of formal ingenuity, but because the dispute has shifted from **"Can expressivism handle logic?"** to **"At what theoretical cost, and does the solution preserve the distinctiveness of the view?"**

  Here is a breakdown of why your diagnosis holds, where the substantive residue lies, and what (if anything) could move the needle.

  ### 1. The Individuation Problem (You are right)
  The core of the current stalemate is indeed about **individuation conditions**.

  *   **The Realist/Constraint:** For the critic (often a realist or a cognitivist), a semantic theory is individuated by its truth-conditions. If your expressivist semantics assigns contents that behave exactly like truth-conditions in a model (e.g., they have satisfaction conditions, they entail one another, they are negatable), then you are doing truth-conditional semantics. If you are doing truth-conditional semantics, you aren't really an expressivist anymore; you're a realist who likes to talk about "plans."
  *   **The Expressivist/Constraint:** For the expressivist, the theory is individuated by the *psychological state* expressed. As long as the fundamental semantic value is a non-cognitive state (a plan, a norm-acceptance, a commitment), the view remains expressivist, even if the *logic* mirrors classical logic.

  The critics argue that if the "attitude" does all the work of a "belief" (specifically, if it plays the functional role of a proposition in reasoning), the distinction between attitude and belief collapses. This is Dreier's **"Creeping Minimalism"** problem. If quasi-realism succeeds too well—if it earns the right to say moral sentences are "true," "factual," and "representational" in a deflationary sense—then there is no longer a substantive disagreement between the realist and the expressivist. They are merely using different metaphors for the same semantic structure.

  So, when a critic says, "You've smuggled in truth conditions," they aren't making a technical error claim; they are making a **taxonomic claim**. They are arguing that the expressivist has paid the F-G tax by surrendering the very territory that defined their view.

  ### 2. Is there a Substantive Dispute Left?
  While the F-G debate is largely methodological now, there is a substantive residue regarding **explanatory priority**.

  Even if an expressivist like Schroeder provides a formal system where moral sentences have logical relations, the *explanation* for those relations differs.
  *   **Realist:** Moral sentences have logical relations *because* they represent reality (or robust normative reality) and logic tracks representational consistency.
  *   **Expressivist:** Moral sentences have logical relations *because* inconsistency in attitudes/plans is irrational (or practically impossible), and logic tracks rational consistency of states of mind.

  The substantive dispute is: **Which explanation is better?**
  *   Realists argue the expressivist explanation is convoluted. Why explain the inconsistency of "Murder is wrong" and "Murder is not wrong" via the clash of attitudes, when a simple contradiction in truth-values suffices?
  *   Expressivists argue the realist explanation fails to capture the **internalist connection** to motivation. If moral judgments are just beliefs about properties, why do they necessarily (or normally) motivate?

  The F-G problem is the proxy war for this deeper battle. The critic uses F-G to say, "Your explanation of logic is too costly." The expressivist uses their solution to say, "My explanation of logic preserves my explanation of motivation."

  ### 3. What Would Move Things Forward?
  You ask whether a formal result or an agreement on adequacy conditions would resolve this.

  **A. Formal Equivalence Results: Unlikely to Help**
  A formal proof showing that expressivist semantics is isomorphic to truth-conditional semantics under certain conditions would likely deepen the rift, not close it.
  *   **Realists** would say: "See? It's just truth-conditions in disguise. Give up the ghost."
  *   **Expressivists** would say: "See? We can get all the logical benefits without positing ontologically queer properties. We win on parsimony."
  Philosophy is rarely settled by translation manuals. The dispute is about *interpretation*, not model theory.

  **B. Agreement on Adequacy Conditions: The Real Bottleneck**
  This is the more promising avenue, but it is difficult because adequacy conditions are theory-laden.
  *   To demand that a solution not "smuggle in truth-conditions" is to beg the question against expressivists who adopt deflationary theories of truth (like Blackburn or Gibbard). They *want* to say moral claims are true; they just mean something different by "true."
  *   To demand that a solution preserve the "action-guiding" nature of moral claims is to beg the question against realists who think motivation is external to judgment.

  **C. The Actual Path Forward: Explanatory Virtues & Pragmatics**
  The debate is most likely to evolve (if not dissolve) in two directions:

  1.  **Shift to Explanatory Virtues:** The field needs to stop asking "Is this *really* expressivism?" and start asking "Which framework offers the best total package of explanatory virtues?"
      *   Does the expressivist account of logic introduce too much complexity (e.g., Schroeder's *Being For* is technically impressive but ontologically/psychologically heavy)?
      *   Does the realist account of motivation require too many ad-hoc additions (e.g., desire-independent reasons, externalist motivation)?
      *   The winner isn't the one who solves F-G, but the one who solves F-G *while best explaining the action-guiding nature of morality*.

  2.  **Pragmatic Dissolution (Inferentialism):**
      Some philosophers (e.g., Matthew Chrisman, Huw Price, and to some extent Brandom) suggest the F-G problem arises from a shared **representationalist assumption** about semantics. Both sides assume semantics must be about "content" that is either "representational" (realist) or "expressive of attitude" (expressivist).
      *   An **inferentialist** approach argues that the meaning of moral terms is constituted by their role in inference, not by what they represent or express. This dissolves the F-G problem because it doesn't try to build complex attitudes out of simple ones; it treats the inferential role as primitive.
      *   This moves the debate away from "What state of mind is expressed?" to "What norms govern the use of these terms?"

  ### Conclusion
  You are right. The F-G dialectic is a clash of background commitments about **semantic individuation** and **explanatory priority**.

  The reason it "will not die" is that it is the primary checkpoint for the viability of non-cognitivism. As long as non-cognitivism is a live option, F-G will be the test it must pass. However, the nature of the test has changed. It is no longer "Can you do it?" but "Is the cost of doing it worth the benefit of maintaining the view?"

  To move the debate, your reading group might try shifting the question from **"Is this solution expressivist enough?"** to **"Does this solution preserve the explanatory advantage expressivism was supposed to have over realism?"** If the solution to F-G makes expressivism just as ontologically committed or psychologically complex as realism, then the realist wins by default, not because the logic failed, but because the *motivation* for expressivism vanished.

  That is the substantive stake hiding behind the methodological quarrel.
