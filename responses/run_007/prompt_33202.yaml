answer: |-
  This is a profound question, and it strikes at the epistemological heart of climate science communication. It is rare to find someone who has lived inside the IPCC process *and* is now interrogating it through the lens of Keynes's *Treatise*. You have identified a genuine tension between the pragmatic needs of policy and the logical rigor of probability theory.

  To answer your question directly: The IPCC's calibrated language presupposes a theory of **operational Bayesianism**, but it leans heavily on a frequentist *aesthetic* to gain authority. It is only partially compatible with Keynes, and where it diverges, it risks what Keynes would call "spurious precision."

  Here is a breakdown of the theoretical underpinnings, the conflict with Keynes, and what a Keynesian reform might look like.

  ### 1. What Theory of Uncertainty Does the IPCC Presuppose?

  The IPCC does not explicitly state its philosophical foundations in the Summary for Policymakers (SPM), but the *Guidance Note for Lead Authors* (Mastrandrea et al., 2010) reveals the machinery.

  **The Two-Metric System**
  The IPCC actually uses two distinct scales, which is crucial for your analysis:
  1.  **Confidence:** Qualitative (Very Low to Very High). This is based on the *type, amount, quality, and consistency* of evidence and the *degree of agreement* among experts.
  2.  **Likelihood:** Quantitative (the percentages you listed). This is based on statistical analysis of observations or model results.

  **The Implicit Ontology**
  By assigning a numerical range to "Likelihood" (e.g., 90–100% for "Very Likely"), the IPCC implicitly assumes that the probability space is **well-defined**.
  *   **It is not Frequentist:** As you noted, we have $N=1$ Earth. We cannot repeat the Cretaceous-Paleogene boundary or the Anthropocene to generate a frequency distribution.
  *   **It is Operational Bayesian:** The numbers represent a constrained degree of belief. When the IPCC says "90–100%," they effectively mean: *"Given the current ensemble of models, paleoclimate data, and physical understanding, a rational agent should hold a degree of belief in this proposition between 0.9 and 1.0."*

  However, to get there, they treat the multi-model ensemble (e.g., CMIP6) as a proxy for a probability distribution. They assume that the spread of models captures the spread of physical possibility. **This is the weak link.** As a physicist, you know that model spread often reflects structural choices and parameterizations, not necessarily the true uncertainty of the physical system.

  ### 2. Is This Compatible with Keynes?

  Keynes's *Treatise* argues two main points that challenge the IPCC practice:
  1.  **Non-Numerical Probabilities:** Not all logical relations between evidence ($h$) and conclusion ($a$) are measurable by numbers. Some are only comparable (Ordering), and some are not even comparable.
  2.  **The Weight of Argument:** Probability is the *balance* of evidence, but there is also the *weight* of evidence. New evidence can increase the weight (making the judgment more secure) without changing the probability.

  **Where they align:**
  The IPCC's **Confidence** metric is a direct, albeit unnamed, acknowledgment of Keynes's **Weight of Argument**. When the IPCC says "High Confidence," they are saying, "The weight of evidence is heavy," even if the likelihood is only "About as likely as not." This is a very Keynesian move. It admits that a 50% probability based on robust theory is epistemically different from a 50% probability based on sparse data.

  **Where they clash:**
  The clash occurs in the **Likelihood** metric. Keynes would argue that for deep structural uncertainties (e.g., cloud feedbacks, AMOC collapse, ice sheet disintegration), the logical relation between evidence and conclusion is **non-numerical**.
  *   **The Category Error:** By forcing a number (66–100%) onto a structural uncertainty, the IPCC assumes comparability where Keynes argues there is none. You cannot logically compare the probability of a tipping point (based on incomplete mechanistic understanding) with the probability of temperature rise (based on radiative physics) on a single linear scale.
  *   **The Principle of Indifference:** To generate numbers from model ensembles, the IPCC often implicitly relies on a version of the Principle of Indifference (treating the model outcomes as equally probable samples). Keynes devoted a significant portion of the *Treatise* to dismantling the unjustified use of this principle. He would argue that without a known physical basis for the distribution of model outcomes, assigning a numerical probability is logically invalid.

  ### 3. If Keynes is Right, Does the Practice Collapse?

  It does not collapse, but it would require a radical simplification and a shift in what is communicated. If we accept Keynes's view that genuine uncertainty (in his sense) is non-numerical, the IPCC's communication would need to change in three specific ways.

  #### A. Abandon Numerical Likelihood for Structural Uncertainties
  For variables governed by well-understood physics (e.g., the warming effect of CO2 concentration in isolation), numerical probability is fine (Keynes's "risk").
  For variables governed by complex, non-linear feedbacks (e.g., specific regional precipitation changes, timing of tipping points), the Likelihood scale should be retired.
  *   **Current:** "It is *very likely* that the AMOC will weaken." (Implies 90%+).
  *   **Keynesian:** "There is *substantial evidence* suggesting AMOC weakening, but the probability is *non-measurable* due to structural model limitations."

  #### B. Elevate "Weight" over "Probability"
  Currently, policymakers fixate on the "Likelihood" (the number) because it looks actionable. A Keynesian reform would make the **Confidence (Weight)** the primary metric.
  Keynes argued that in decisions under uncertainty, the *weight* of the argument matters more than the calculated probability. A high-probability event based on low-weight evidence (thin data, conflicting models) should be treated with more caution than a moderate-probability event based on high-weight evidence (robust theory, consistent data).
  *   **Reform:** The SPM should not lead with "90% chance." It should lead with "High Confidence in the direction of change, Low Confidence in the magnitude."

  #### C. Introduce "Incomparability"
  The IPCC assumes all risks can be weighed on a single cost-benefit scale (Integrated Assessment Models). Keynes argued that some probabilities are incomparable.
  *   **Reform:** Acknowledge that the uncertainty surrounding a 3°C world is *logically different in kind* from the uncertainty surrounding a 1.5°C world, not just a matter of degree. You cannot simply integrate over the probability density function (PDF) to get expected damage if the tails of the PDF are based on non-numerical logical relations. This undermines the economic cost-benefit analyses that rely on those PDFs.

  ### 4. A Proposed Keynesian Calibration

  If the IPCC were to adopt a Keynesian framework without losing consistency, they might adopt a tripartite system instead of the current bipartite one:

  1.  **Demonstrated (Risk):** Frequencies or physical laws allow numerical probability. (e.g., Radiative forcing). *Use the 0–100% scale.*
  2.  **Supported (Uncertainty):** Evidence supports the conclusion, but numerical measurement is invalid. (e.g., Specific feedback loops). *Use qualitative logical relations: "Strongly Supported," "Weakly Supported," "Contested."*
  3.  **Unknown (Ignorance):** We lack the evidence to establish a logical relation. (e.g., Specific social tipping points). *Label as "Indeterminate."*

  ### 5. Why They Don't Do This (The Policy Constraint)

  You know the IPCC process. The reason they don't do this is not ignorance of the philosophy; it is the demand from policymakers for **decision-ready information**.
  *   Policymakers want to plug numbers into models.
  *   "Non-numerical logical relation" is not an input for an economic optimization model.
  *   Keynes's approach forces the decision-maker to take responsibility for the judgment call. The IPCC's current approach subtly shifts the burden to the scientists ("We calculated the risk").

  ### Conclusion

  Your intuition is correct. The IPCC's calibrated language implicitly assumes that all uncertainties are, in principle, quantifiable (measurable logical relations). This is a pragmatic fiction.

  Keynes would argue that by assigning numbers to deep uncertainties, the IPCC creates an **illusion of knowledge**. It comforts policymakers but obscures the true nature of the risk. A Keynesian IPCC would be less precise but more honest. It would tell policymakers: *"Here is what we know (Risk), here is what we have good reason to believe but cannot number (Uncertainty), and here is where we are truly in the dark (Ignorance)."*

  The tragedy, from a Keynesian perspective, is that the middle category—where most of climate science actually lives—is forced into the first category to satisfy the demands of the third (policy action).

  Given your background, you are uniquely positioned to write on this. There is a literature on "Knightian Uncertainty" in climate economics (e.g., Weitzman's Dismal Theorem), but fewer physicists have engaged with the *logical* foundations of the IPCC's probability language through the *Treatise*. It is a gap worth filling.
