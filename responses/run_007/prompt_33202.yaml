      *   *The Underlying Philosophy:* The IPCC generally operates under a Bayesian-ish framework, though often disguised as frequentist. They treat probabilities as degrees of belief constrained by models and data. They explicitly acknowledge "deep uncertainty" but try to quantify it where possible.
