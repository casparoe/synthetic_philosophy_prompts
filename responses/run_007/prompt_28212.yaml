      *   *Key Point 2: Explanatory Power in Adaptationism.* Biologists ask "Why is this trait here?" Causal-role answers "What does it do now?" Etiological answers "Why was it retained?" This matches the "Why" questions of evolutionary biology.
      *   *Key Point 3: Avoiding Promiscuity.* The liver makes bile, stores glycogen, filters blood, and makes noise when hit with a hammer. Causal-role says all are functions if relevant to a system. Etiological says only the selected effects are functions. This matches biological practice.
      *   *Tone Check:* Acknowledge the user's intuition ("too promiscuous") and validate it philosophically.

