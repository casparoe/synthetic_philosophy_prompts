answer: |-
  # Specification for an Adequate Theory of the Boundary Problem

  The boundary problem is logically prior to the procedural problem. Before we can ask "how should the *demos* decide?" we must answer "who constitutes the *demos*?" An adequate theory cannot simply gesture at intuition; it must provide a principled mechanism for inclusion and exclusion that satisfies the following desiderata.

  Below is the spec. Requirements are flagged as **[Non-Negotiable]** (logical or moral prerequisites for a democratic theory) or **[Contested]** (normative commitments specific to certain camps).

  ---

  ## I. Extensional Adequacy (Case Classification)
  A theory must yield determinate verdicts on paradigmatic edge cases. It need not match your pre-theoretic intuitions on every case, but it must offer a *principle* for the classification that does not rely on ad-hocery.

  1.  **Long-Term Noncitizen Residents:**
      *   **Requirement:** The theory must distinguish between *presence* and *membership*.
      *   **Reason:** If mere presence grants membership, tourists qualify (see below). If citizenship alone grants membership, permanent residents are subject to coercion without representation (violating the anti-tyranny constraint).
      *   **Verdict Needed:** Are they members of the *demos*? If yes, by what metric (duration, tax contribution, social ties)?

  2.  **Citizens Abroad (Expats):**
      *   **Requirement:** The theory must distinguish between *legal status* and *ongoing stake*.
      *   **Reason:** If citizenship is sufficient, a citizen who has lived abroad for 40 years with no intent to return counts equally with a resident. If residence is required, they are excluded.
      *   **Verdict Needed:** Does the *demos* track the legal nation or the lived community?

  3.  **Children:**
      *   **Requirement:** The theory must distinguish between *interests* and *agency*.
      *   **Reason:** Children are profoundly affected and subject to laws. Excluding them requires a justification other than "they don't count."
      *   **Verdict Needed:** Are they members of the *demos* who lack capacity to vote (requiring guardianship), or non-members?

  4.  **Convicted Felons:**
      *   **Requirement:** The theory must distinguish between *punishment* and *civic death*.
      *   **Reason:** Democratic theory generally rejects the idea that rights are forfeited permanently.
      *   **Verdict Needed:** Does incarceration suspend membership or terminate it? If suspend, when is it restored?

  5.  **Tourists:**
      *   **Requirement:** The theory must exclude temporary sojourners without collapsing into nationalism.
      *   **Reason:** Tourists are subject to local laws and affected by local decisions (e.g., transit strikes). Including them makes the *demos* unstable and transient.
      *   **Verdict Needed:** What is the temporal threshold for inclusion?

  6.  **Future People:**
      *   **Requirement:** The theory must account for intergenerational impact without dissolving the current *demos*.
      *   **Reason:** Current decisions (climate, debt) radically affect the future. If "affectedness" grants membership, the unborn must be represented.
      *   **Verdict Needed:** Do they have standing in the *demos* (via proxies) or are they merely moral patients outside the political boundary?

  7.  **Stateless People:**
      *   **Requirement:** The theory must address persons with no state protection.
      *   **Reason:** If the *demos* is tied to state citizenship, stateless persons fall into a normative void.
      *   **Verdict Needed:** Does human rights law grant them automatic membership in the host *demos*, or does it highlight a failure of the state system?

  8.  **External Affected (Environmental Spillover):**
      *   **Requirement:** The theory must handle cross-border causal chains.
      *   **Reason:** Pollution, war, and economic policy cross borders. If a factory poisons a neighbor's water, the neighbor is affected but not subject to the factory's state's laws.
      *   **Verdict Needed:** Does the *demos* expand to the scope of the harm, or does the harm create a claim to membership in the harming state?

  ---

  ## II. Conceptual Distinctions
  A theory must not collapse the following categories. Conflating them leads to category errors that render the theory incoherent.

  1.  **Affected vs. Subject vs. Stake:**
      *   **Distinction:**
          *   *Affected:* Causal impact (I lose money because your state devalues currency).
          *   *Subject:* Coercive jurisdiction (I am arrested by your police).
          *   *Stake:* Long-term interest in the polity's flourishing (I plan to die here).
      *   **Constraint:** **[Non-Negotiable]** A theory must specify which of these triggers membership. You cannot slide between them to save the theory from counterexamples. (e.g., You can't use "Subjected" to exclude tourists, then switch to "Affected" to include residents).

  2.  **Inclusion in the Demos vs. Weight of Voice:**
      *   **Distinction:** Being a member of the *demos* is not identical to having one vote.
      *   **Constraint:** **[Non-Negotiable]** A theory can classify children as *demos* members while denying them the franchise based on capacity. It must clarify if the boundary problem is about *who belongs* or *who votes*. (Standard view: It is about belonging; voting is a derivative procedural rule).

  3.  **Constituting the Demos vs. Decision Rule:**
      *   **Distinction:** The boundary question (Who is in?) is prior to the aggregation question (How do we count?).
      *   **Constraint:** **[Non-Negotiable]** You cannot solve the boundary problem by saying "the majority decides." That presupposes a majority of *whom*?

  ---

  ## III. Normative Constraints
  These are the values the theory must respect to remain recognizably *democratic*.

  1.  **Non-Arbitrariness:**
      *   **Constraint:** **[Non-Negotiable]** Boundaries cannot be drawn based on race, caste, or divine right. There must be a public, accessible rationale.

  2.  **Reciprocity:**
      *   **Constraint:** **[Contested]** (Strong among Republicans/Liberals). Those who are expected to obey the laws and contribute to the scheme should have a say in their formulation. This is the core engine of the All-Subjected Principle.

  3.  **Equality of Moral Worth:**
      *   **Constraint:** **[Non-Negotiable]** The theory cannot presuppose that some humans are naturally rulers and others naturally ruled. Exclusion must be justified by circumstance or capacity, not ontology.

  4.  **Feasibility (Institutional Stability):**
      *   **Constraint:** **[Non-Negotiable]** The *demos* must be stable enough to sustain institutions. If the membership changes with every ballot issue (based on who is affected by *that* issue), no enduring polity can exist.

  ---

  ## IV. Incompatibilities and The "Killer" Constraint

  This is where standard theories break. You cannot satisfy all desiderata simultaneously.

  ### 1. The Determinacy vs. All-Affected Incompatibility
  *   **The Conflict:** The **All-Affected Principle** (AAP) states that anyone affected by a decision should be in the *demos*. The **Determinacy Constraint** requires that the *demos* be a stable, identifiable group prior to decision-making.
  *   **The Argument:** Causal chains are infinite and retrospective. To know who is affected, you must know the decision. To know the decision, you must know the *demos*.
      *   *Example:* A state raises interest rates. This affects global investors, borrowers in other nations, and future generations. If AAP is strict, the *demos* for this decision is "everyone on earth plus the unborn."
      *   *Result:* If you enforce AAP strictly, you violate Determinacy (the *demos* shifts constantly). If you enforce Determinacy (fixed citizenship), you violate AAP (excluding affected outsiders).
  *   **Verdict:** **[Non-Negotiable Incompatibility]** You must sacrifice the purity of AAP to save the possibility of a polity. A theory that insists on pure AAP fails the Feasibility constraint.

  ### 2. The "Killer" Requirement: Non-Circularity
  *   **The Requirement:** The principle used to draw the boundary cannot presuppose the boundary it is trying to draw.
  *   **Why it rules out standard principles:**
      *   *Majority Rule:* Fails. (Who votes on the boundary?)
      *   *Constitutional Law:* Fails. (Who authored the constitution?)
      *   *Historical Continuity:* Fails. (Why does past coercion bind future members?)
  *   **Verdict:** This is the single requirement that does the most work. It forces the theory to find an *external* normative anchor (e.g., moral personhood, coercion, stake) rather than an *internal* procedural one.

  ---

  ## V. The Bootstrapping Worry
  *Is it a real constraint that a theory can't say "the demos decides its own boundaries"?*

  *   **The Worry:** It is viciously circular. To authorize the boundary decision, you need a *demos*. But the *demos* is what is being decided.
  *   **Assessment:** It is **not overblown**, but it is often misunderstood.
      *   *Logical Circularity:* Yes, it is logically circular to say "the people decide who the people are."
      *   *Performative Necessity:* However, all political foundations are ultimately performative. At some point, a group *acts* as a *demos* to constitute itself.
  *   **The Constraint:** A theory cannot *stop* at "the demos decides." That is an abdication of theory. A theory must provide the **normative criteria** for when a self-constituting act is legitimate.
      *   *Example:* A theory can say, "A group may constitute itself as a demos *if and only if* it includes all coerced subjects." This uses an external norm (anti-coercion) to validate the internal act (self-constitution).
      *   **Requirement:** **[Non-Negotiable]** The theory must provide the *external normative standard* that validates the bootstrapping act. Pure self-authorization is tyranny.

  ---

  ## VI. Nonhuman Animals: Same Question or Different?
  *Does the theory owe an answer about animals?*

  *   **Verdict:** **Different Question.**
  *   **Reasoning:** The boundary problem is a problem of **political agency**, not **moral patienthood**.
      *   *Moral Patienthood:* Who counts morally? (Includes animals, ecosystems, etc.)
      *   *Political Agency:* Who can exercise collective self-rule?
  *   **Constraint:** A democratic theory can acknowledge that animals have moral rights (protecting them from harm) without including them in the *demos*. Including them in the *demos* requires a theory of how they exercise agency (vote, speak, deliberate).
  *   **Exception:** If your definition of *demos* is purely "all affected interests," animals force a collapse. But this confirms that "all affected interests" is a moral principle, not a democratic boundary principle.
  *   **Requirement:** **[Contested]** A theory must explicitly state whether it is defining the *moral community* or the *political citizenry*. Conflating the two renders the boundary problem unsolvable.

  ---

  ## Summary for Seminar Discussion
  When evaluating any text on the boundary problem, ask:
  1.  **Does it distinguish Affected, Subject, and Stake?** (If not, it will fail the Tourist/Resident test).
  2.  **Does it sacrifice Determinacy to save All-Affected?** (If yes, it describes a moral ideal, not a political institution).
  3.  **Does it solve Bootstrapping with an external norm?** (If no, it is circular).
  4.  **Does it classify Children as Members or Non-Members?** (This reveals if they view democracy as about *interests* or *capacity*).

  The goal of the seminar is not to find a theory that passes all these tests (none do), but to see which constraint each theorist chooses to violate, and what they sacrifice to save their core principle.
