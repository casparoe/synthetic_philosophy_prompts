prompt: |-
  I help run a tenants' union in my city, and we've developed this informal practice that I'm starting to find philosophically puzzling. When we're planning a campaign — say, pressuring a landlord to fix a building-wide heating problem — we debate strategy and tactics. If someone who owns a rental property themselves (even a small one they inherited) tries to argue for a more moderate approach, they get shut down pretty fast. "You're a landlord, you don't get to tell us how hard to push." The criticism isn't engaged with on its merits; it's dismissed because of who said it. But a few weeks ago, a city councilmember who's been genuinly helpful to us proposed the exact same moderate strategy, and we took it serious, debated it, and ended up adopting parts of it. When I pointed out the inconsistency, the response was: "it's different — the councilmember isn't a hypocrite, she's just making a tactical argument. The landlord is telling us to go easy on landlords."

  So the practice seems to be: we filter criticism through the identity and commitments of the speaker, and we treat hypocrisy as a defeater for someone's standing to even be heard. But we don't have a worked-out theory of when exactly someone loses standing, or whether the standing question is about sincerity, epistemic reliability, or something else. I want to understand what theory of standing to blame (or standing to criticize, or moral standing — I'm not sure of the right term) this practice presupposes. Does it commit us to the view that blame is a kind of speech act that requires the speaker to be in a particular normative relation to the content — that you can't invoke a norm you yourself violate? Or could it be grounded in something more pragmatic, like the idea that a hypocrite's criticism is unreliable as a signal of genuine problem-detection? And is the practice stable — can we really have a norm that says "arguments from hypocrites get less weight" without sliding into "arguments from people we don't like get less weight"?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user runs a tenants' union.
      *   **The Practice:** They dismiss strategic advice/criticism from members who are landlords (even small/inherited ones) based on their identity/status ("You're a landlord"). However, they accept similar advice from a city councilmember.
      *   **The Justification:** The union claims the landlord is being hypocritical ("telling us to go easy on landlords"), whereas the councilmember is making a "tactical argument."
      *   **The Philosophical Puzzle:** The user wants to understand the underlying theory of *standing* (moral standing, standing to criticize/blame).
      *   **Key Questions:**
          1.  What theory of standing does this practice presuppose?
          2.  Is it about normative relations (you can't invoke a norm you violate)?
          3.  Is it pragmatic (hypocrites are unreliable signals)?
          4.  Is the practice stable (does it slide into ad hominem/tribalism)?

  2.  **Initial Philosophical Mapping:**

      *   *Standing to Blame:* This is the core concept. In moral philosophy, standing usually refers to the authority or right to hold someone accountable.
      *   *Hypocrisy:* The classic defeater for standing. If I do X, I can't blame you for doing X.
      *   *Ad Hominem:* The risk of dismissing arguments based on the speaker rather than the content.
      *   *Epistemic vs. Moral:* Is the issue that the landlord *can't* know the truth (epistemic) or that they *shouldn't* be allowed to speak (moral/political)?
      *   *Interest/Conflict of Interest:* The landlord has a material interest in the outcome (less pressure on landlords = good for them). The councilmember has a political interest but arguably less direct material conflict regarding *this specific* building.

  3.  **Analyzing the Specific Case:**

      *   **The Landlord:** Owns rental property. Advises moderation. Union sees this as protecting their own class interest.
      *   **The Councilmember:** Politician. Advises moderation. Union sees this as tactical wisdom.
      *   **The Distinction:** The union claims the landlord is "hypocritical." But is it hypocrisy? Hypocrisy usually means violating the norm you are enforcing. If the norm is "Landlords must provide heat," the landlord *should* provide heat. If they advise tenants *not* to pressure them too hard, are they violating a norm? Or are they acting in self-interest?
      *   *Correction:* It's not strictly *hypocrisy* in the moral sense (doing what you condemn). It's more like *conflict of interest* or *bias*. The union *calls* it hypocrisy ("telling us to go easy on landlords"), but philosophically, it looks more like a challenge to *motivational sincerity*.

  4.  **Developing the Theoretical Frameworks:**

      *   **Theory 1: The Moral Authority Model (The "Clean Hands" Doctrine).**
          *   Idea: You need moral purity to demand action.
          *   Problem: Too rigid. Almost no one has clean hands.
          *   Fit: The union seems to lean this way ("You're a landlord").
      *   **Theory 2: The Epistemic/Reliability Model.**
          *   Idea: Biased speakers give bad advice.
          *   Problem: A biased speaker can still be right. The councilmember might be biased too (wants peace, not disruption).
          *   Fit: This explains the "unreliable signal" intuition.
      *   **Theory 3: The Political/Power Model (Standpoint Theory).**
          *   Idea: Oppressed groups have epistemic privilege; oppressors distort reality to maintain power.
          *   Fit: This fits a tenants' union perfectly. Landlords are the "oppressor class" in this dynamic. Their advice is structurally suspect.
      *   **Theory 4: The Conversational/Conversational Contract Model.**
          *   Idea: Certain spaces are for certain voices.
          *   Fit: "This is a tenants' union, not a landlords' association."

  5.  **Addressing the Stability/Slippery Slope:**

      *   The user asks: Does this slide into "arguments from people we don't like get less weight"?
      *   Yes, it's a real risk.
      *   Mitigation: Need clear criteria for *relevant* interests vs. *general* identity.
      *   The Councilmember distinction: Why is she okay? Because her interest is (presumably) electoral/structural, not direct profit from the specific exploitation being fought. She is an *ally*, not a *party to the conflict*.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate that this is a real philosophical tension (Standing vs. Truth).
      *   *Section 1: Diagnosing the "Standing" Claim.* It's not exactly "standing to blame." It's closer to "standing to advise on strategy." It's about *conflict of interest* masquerading as hypocrisy.
      *   *Section 2: Three Potential Theoretical Groundings.*
          1.  *Moral Hypocrisy (The Tu Quoque).* Explain why this doesn't quite fit (the landlord isn't necessarily saying "I shouldn't fix heat," they are saying "Don't push me too hard").
          2.  *Epistemic Distortion (Standpoint Epistemology).* This is the strongest fit. Landlords have a material interest that clouds judgment.
          3.  *Conversational Jurisdiction.* The union is a space *for tenants*. Landlords are the *target*, not the *constituency*.
      *   *Section 3: The Councilmember Distinction.* Why is she different? She lacks the *direct material stake*. She is a third party.
      *   *Section 4: Stability and Risks.* Address the slippery slope.
          *   Risk: Echo chambers.
          *   Risk: Purity spirals.
          *   Solution: Focus on *interests* rather than *identity*. (Is the advice aligned with their wallet or our goal?)
      *   *Conclusion:* Summarize. The practice is defensible but needs refinement to avoid tribalism.

  7.  **Refining the Philosophical Terminology:**

      *   Use "Standing to Blame" (MacNamar, Bell, Fritz).
      *   Use "Standpoint Epistemology" (Harding, Hartsock).
      *   Use "Ad Hominem Circumstantial."
      *   Distinguish between *Hypocrisy* (violating a norm) and *Conflict of Interest* (having a stake in the outcome). The union is conflating them, which is the source of the user's puzzle.

  8.  **Self-Correction/Critique during drafting:**
      *   *Critique:* I need to make sure I don't just tell them what to do. They asked for philosophical analysis.
      *   *Adjustment:* Keep the tone analytical. Offer the frameworks, let them decide which fits their values.
      *   *Nuance:* The user says the landlord is called a "hypocrite." I need to point out that this might be a category error. A landlord advocating for moderate tenant pressure isn't necessarily violating a moral norm they claim to uphold; they are advocating for their class interest. Calling it hypocrisy might be rhetorically useful but philosophically imprecise.

  9.  **Final Polish:** Check against the user's specific questions.
      *   Theory of standing? (Covered: Moral vs. Epistemic vs. Political).
      *   Normative relation? (Covered: Clean hands).
      *   Pragmatic signal? (Covered: Reliability/Bias).
      *   Stability? (Covered: Risks of tribalism).

