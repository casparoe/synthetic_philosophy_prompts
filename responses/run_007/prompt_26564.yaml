answer: |-
  This is a fascinating case study in applied political philosophy. You are grappling with the tension between **truth-tracking** (is the argument sound?) and **positionality** (who is speaking, and from what interest?).

  Your intuition is correct: the practice your union has adopted isn't just a casual heuristic; it presupposes a specific, albeit unarticulated, theory of **normative standing**. However, the justification your colleagues offered ("hypocrisy") might be the wrong philosophical label for what is actually happening.

  Here is an analysis of the theoretical frameworks your practice might be relying on, the distinction between the landlord and the councilmember, and the stability risks you identified.

  ### 1. Diagnosing the Theory of Standing

  In moral philosophy, "standing to blame" usually refers to the authority one must possess to hold another accountable. The classic defeater for standing is **hypocrisy** (the *tu quoque*): if you violate the norm you are invoking, you lose the right to enforce it against others.

  However, your case is slightly different. The landlord member isn't necessarily saying, "I won't fix the heat, so you can't ask me to." They are saying, "The *strategy* to fix the heat should be moderate."

  There are three competing theories of standing that could explain your union's practice. You need to decide which one you actually hold, because they have different implications.

  #### A. The Moral Purity Model (The "Clean Hands" Doctrine)
  *   **The Theory:** One cannot advocate for a normative constraint on a class to which one belongs if that constraint harms one's own material interest. To do so is hypocritical.
  *   **The Logic:** If you are a landlord, you benefit from low regulation. If you argue for low regulation, you are acting consistently. If you argue for *high* regulation, you are virtuous. But if you argue for *moderation* in a tenant struggle, you are suspected of protecting your class interest while pretending to help.
  *   **The Problem:** This creates a "purity spiral." If only those with "clean hands" can speak, you lose valuable information. It also conflates *interest* with *hypocrisy*. A landlord arguing for moderation isn't necessarily violating a moral norm; they might just be prioritizing stability over maximalist gains.

  #### B. The Epistemic Distortion Model (Standpoint Epistemology)
  *   **The Theory:** A speaker's material position shapes their perception of reality. Landlords, by virtue of their class position, have a structural blind spot regarding tenant suffering.
  *   **The Logic:** It's not that the landlord *can't* speak; it's that their advice is **epistemically unreliable**. Their "moderation" isn't a neutral tactical assessment; it is a distortion caused by their desire to protect their asset.
  *   **The Fit:** This fits your councilmember distinction perfectly. The councilmember does not own the building. She has no direct profit motive to minimize the pressure on *this specific* landlord. Therefore, her assessment of "moderation" is more likely to be a genuine tactical calculation (e.g., "if you push too hard, you lose public support") rather than a class-defense mechanism.
  *   **The Risk:** This can slide into strong relativism (only tenants can know tenant truth), which might blind the union to strategic errors that an outsider could spot.

  #### C. The Conversational Jurisdiction Model
  *   **The Theory:** Political organizations are not public squares; they are private associations with specific teleological goals. Standing is determined by alignment with the *goal*, not just the argument.
  *   **The Logic:** A tenants' union is a vehicle for *tenant power*. A landlord, by definition, holds a position of power *over* tenants. Allowing a landlord to dictate the intensity of tenant pressure is like allowing a defendant to dictate the prosecution's strategy.
  *   **The Fit:** This explains why the councilmember is heard. She is an external ally (a third party), whereas the landlord is the **counter-party** in the conflict.
  *   **The Strength:** This is the most stable justification. It doesn't claim the landlord is "wrong" or "hypocritical" in a moral sense; it claims they are a **conflicted party** in a negotiation.

  ### 2. Hypocrisy vs. Conflict of Interest

  Your colleagues are using the word "hypocrite," but philosophically, they are identifying a **Conflict of Interest**.

  *   **Hypocrisy:** "I demand you tell the truth, but I lie." (Violation of the norm).
  *   **Conflict of Interest:** "I am judging this dispute, but I stand to profit from one outcome." (Bias in the process).

  When the landlord says "go moderate," the union hears: "Protect my profit margins." When the councilmember says "go moderate," the union hears: "Protect the campaign's longevity."

  If you ground your practice in **Hypocrisy**, you are vulnerable to the charge of ad hominem attacks. (e.g., "Just because he owns a unit doesn't mean his tactical analysis is wrong.")

  If you ground your practice in **Conflict of Interest**, the practice becomes much more robust. You are not dismissing the *truth value* of the claim; you are dismissing the *weight* of the claim because the speaker has a vested interest in the outcome that opposes the union's maximalist goals.

  ### 3. Is the Practice Stable?

  You asked: *Can we really have a norm that says "arguments from hypocrites get less weight" without sliding into "arguments from people we don't like get less weight"?*

  This is the central risk. Here is how that slide happens, and how to prevent it.

  #### The Instability Risk: The Genetic Fallacy
  If you routinely reject arguments based on the *source* rather than the *content*, you risk the **Genetic Fallacy**. Over time, "conflict of interest" can expand to mean "anyone who disagrees with us."
  *   *Example:* A tenant who argues for moderation might be accused of "thinking like a landlord."
  *   *Example:* A donor who suggests caution might be dismissed as "buying influence."

  This creates an echo chamber where the only "safe" advice is the advice that aligns with the group's current emotional temperature. This is strategically dangerous for a union, which needs cold tactical assessment.

  #### How to Stabilize the Norm
  To keep this practice philosophically defensible and strategically useful, you need to shift the criterion from **Identity** ("You are a landlord") to **Material Interest** ("You profit from the outcome we are debating").

  1.  **Define the Relevant Interest:** The landlord is silenced not because they are a "bad person" or even strictly a "hypocrite," but because they are a **counter-party**. In a labor strike, management doesn't get a vote on strike strategy. In a tenant union, landlords don't get a vote on pressure tactics.
  2.  **The Councilmember Exception:** The councilmember is acceptable because she is a **third party**. She does not profit from the rent. Her interest is political capital, which is distinct from the material exploitation being fought.
  3.  **The "Tenant-Landlord" Member:** What about the union member who inherited a unit? They are a member of the union (tenant elsewhere?) but also a landlord. The stable norm says: *They retain standing as a tenant, but recuse themselves from strategy regarding landlord pressure.* They can speak to the experience of being a tenant, but their advice on how hard to squeeze landlords is structurally compromised.

  ### 4. Recommendation for Your Union

  You don't need to abandon the practice, but you should refine the *theory* you use to justify it.

  **Don't say:** "You're a hypocrite, so your argument is false."
  **Do say:** "You have a direct material conflict of interest in this specific tactic, so your advice carries a presumption of bias that we cannot afford to weigh heavily."

  This achieves three things:
  1.  **It avoids moralizing:** It doesn't attack the landlord's character (which makes them defensive); it attacks their structural position (which is undeniable).
  2.  **It protects against the slippery slope:** It limits the exclusion to those with *direct material stakes* in the outcome, not just people with unpopular opinions.
  3.  **It clarifies the Councilmember distinction:** It makes clear why the politician is heard (no direct rent profit) while the landlord is not (direct rent profit).

  **Conclusion:**
  Your practice presupposes a **Political Conflict of Interest** model of standing, but you are justifying it with **Moral Hypocrisy** language. The latter is unstable and prone to tribalism. The former is a standard feature of negotiation and organizing (e.g., management doesn't vote on union strategy). By shifting your vocabulary from "hypocrisy" to "conflicted counter-party," you can maintain the boundary without compromising your commitment to sound strategy.
