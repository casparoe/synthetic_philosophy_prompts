answer: |-
  Here is a diagnosis of the moral luck debate, structured according to your constraints.

  ### Diagnosis: Functional Equivocation Between Normative Frameworks

  I diagnose this disagreement not as a verbal dispute, nor purely as a clash of bedrock intuitions, but as a **structural conflict between two distinct normative frameworks that are competing for the same conceptual territory.**

  Both sides are using the word "blame" (and "responsibility"), but they are indexing it to different functional roles within our moral lives.
  1.  **The Control Side** is operating within a **Retributive/Deontological Framework**. Here, the function of blame is to assess the moral quality of the *will*. It is backward-looking and agent-centered. In this framework, luck is irrelevant by definition because the object of evaluation is internal autonomy.
  2.  **The Outcome Side** is operating within a **Liability/Expressivist Framework**. Here, the function of blame is to regulate social relationships and respond to *harm*. It is partly forward-looking (deterrence, repair) and patient-centered. In this framework, luck is relevant because the object of evaluation includes the impact of the agent on the world.

  The stalemate persists because both frameworks are indispensable. We cannot abandon the Control Principle without undermining human dignity and autonomy (making us mere vessels of causality). We cannot abandon Outcome Sensitivity without undermining the significance of action and the reality of harm (making morality solipsistic). The debate feels unresolvable because participants are arguing over which framework gets to define the *single* word "blame," when in fact we need both concepts for different purposes.

  **Confidence in this diagnosis: 90%**
  This explains why arguments talk past each other: one side offers a metaphysical constraint on agency, and the other offers a phenomenological report on moral practice. Neither defeats the other because they are answering different functional questions.

  ### Evaluation of Alternative Diagnoses

  **1. Is it a clash of bedrock intuitions?**
  *Verdict: Partially, but insufficient.*
  While both sides appeal to deep intuitions, calling them "bedrock" implies they are brute facts that cannot be analyzed. However, we *can* explain the genealogy of these intuitions. The control intuition stems from the requirement for fairness; the outcome intuition stems from the requirement for significance. Identifying the source of the intuitions allows us to see they serve different masters (fairness vs. significance), which moves us beyond a mere stalemate of "I feel X, you feel Y."
  **Confidence: 85%**

  **2. Is it a verbal dispute?**
  *Verdict: No, not merely.*
  If this were purely verbal, we could solve it by saying, "Let's call one 'moral worth' and the other 'social liability,' and now we agree." But the dispute is normative, not just semantic. The question remains: *Which* practice should govern our legal systems, our interpersonal relationships, and our self-conception? Even if we distinguish the terms, the tension remains about which practice is *appropriate* in which context.
  **Confidence: 80%**

  **3. Is there a hidden empirical question?**
  *Verdict: Unlikely to resolve the core conflict.*
  Empirical findings (e.g., about the psychological costs of outcome-based blame) could influence which framework we *prefer* pragmatically, but they cannot settle the normative validity of either. You cannot derive an "ought" (control is required for blame) from an "is" (people feel more blame when outcomes are bad). Empirical data might force a compromise, but it cannot dissolve the philosophical tension.
  **Confidence: 70% (This is the point I am least sure of; see below).**

  **4. Are they answering different normative questions?**
  *Verdict: Yes, this is the core of my diagnosis.*
  One side asks, "What does this action reveal about the agent's character/volition?" The other asks, "What is the appropriate social response to this event?" Conflating these questions creates the paradox of moral luck.
  **Confidence: 90%**

  ### What Counts as Genuine Progress?

  Given this diagnosis, genuine progress will not come from a new argument that proves one side right. It will come from **conceptual fragmentation and functional mapping.**

  Progress looks like:
  1.  **Abandoning the monolithic concept:** We stop asking "Is there moral luck?" as a yes/no question.
  2.  **Taxonomizing Practices:** We explicitly map which domains of responsibility require the Control Framework (e.g., moral worth, sin, ultimate desert) and which require the Liability Framework (e.g., tort law, compensation, relational repair).
  3.  **Justifying the Boundaries:** We develop criteria for when it is permissible to switch frameworks. For example, we might argue that *legal punishment* must adhere to the Control Framework, while *civil liability* may admit Outcome Luck.

  A successful resolution would look like a "periodic table" of responsibility practices, where moral luck is accepted in some cells and rejected in others, with clear principled reasons for the distinction.

  **Confidence in this path to progress: 80%**
  This approach has already begun in contemporary work (distinguishing "appraisal" from "accountability"), but it has not yet fully displaced the traditional debate format.

  ### Explicit Confidence and Uncertainty

  *   **Diagnosis (Functional Equivocation):** 90% Confident.
  *   **Progress (Conceptual Fragmentation):** 80% Confident.
  *   **Empirical Irrelevance:** 70% Confident.

  **The Point I Am Least Sure Of:**
  I am least sure about my assessment that **empirical findings cannot settle the debate (70% confidence).**

  *Reasoning:* While empirical data cannot solve metaphysical questions, the debate about moral luck is increasingly pragmatic. If empirical psychology demonstrated that withholding outcome-sensitive blame causes significant social dysfunction (e.g., inability to process grief or loss) *or* that enforcing it causes intolerable psychological distress, this could function as a "normative defeater." If one framework is shown to be psychologically impossible or socially catastrophic to implement, the normative force of that framework weakens. I am discounting this slightly because "feasibility" does not equal "truth," but in moral philosophy, pragmatic impossibility often functions as a form of falsification. Therefore, I leave open the possibility that a hard empirical constraint could force a resolution more effectively than conceptual analysis.
