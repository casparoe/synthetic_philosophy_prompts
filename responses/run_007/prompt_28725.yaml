          *   Future Model $M_{t+1} = V + \epsilon$.
          *   If I know $M_{t+1} = x$, and I know $\epsilon$ is mean zero, then $E[V|M_{t+1}=x] = x$. Reflection holds.
          *   If I know $\epsilon$ is positive (overreaction), then $E[V|M_{t+1}=x] < x$. Reflection fails.
          *   Does Martingale hold? $E_t[M_{t+1}]$. If I expect overreaction, my current price shouldn't be the expectation of the future *model* price, it should be the expectation of *value*.
          *   Actually, usually Martingale refers to the *belief* process. $P_t(A) = E_t[P_{t+1}(A)]$. This holds by law of iterated expectations *if* $P_{t+1}$ is generated by Bayesian updating on $P_t$.
