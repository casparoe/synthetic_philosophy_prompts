      *   *Key Insight:* Reflection assumes you are certain you will update via Bayes Rule. If you assign probability $<1$ to "I will update via Bayes Rule," Reflection fails. This is "Model Risk on the Updating Process."

  9.  **Final Polish:** Ensure the "Residue Report" directly answers the "gap vs. sign" question. The feeling is tracking something real: Reflection assumes away model risk on the learning algorithm itself.

  **(Self-Correction on Martingale vs Reflection):**
