prompt: |-
  I chair my university's academic policy committee, and we've been watching something unfold that I can only describe as a slow-motion race to the bottom. Over the past decade, departments have been quietly reducing their major requirements — dropping prerequisites, cutting the number of required courses, making capstones optional, inflating grades — because students shop for majors partly based on how heavy the workload looks, and departments are under enrollment pressure from the provosts office. Each individual decision to lower a requirement makes perfect sense given the incentives. But the aggregate effect is that our degrees are getting hollowed out, and everyone on the committee knows it, including the people who voted for their own department's reductions last year.

  We're meeting next week to vote on whether to impose a college-wide floor on major requirements: minimum credit hours, a required capstone, and a cap on the percentage of A's a department can award. The opposition falls roughly into two camps: some think this is a real problem but that a central mandate is the wrong fix (departments should control their own curricula, and if students want lighter majors maybe that's legitimate information about what they value), and others think we're overstating the problem entirely.

  Draft the memo I'll circulate before the vote. It should recommend a concrete decision, but more importantly it should frame the problem clearly enough that people can't just vote their department's short-term interest. Engage seriously with the autonomy objection — that departments know their own disciplines best and a one-size-fits-all floor is a crude instrument. And if you think the multipolar trap framing is right, explain why voluntary coordination won't solve it, because that's the argument I keep hearing: "can't we just agree to stop, without a rule?"
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the University's Academic Policy Committee.
      *   **Audience:** Committee members (faculty representatives from various departments, administrators).
      *   **Context:** A "slow-motion race to the bottom" regarding academic rigor (reduced requirements, grade inflation) driven by enrollment pressures and student preferences.
      *   **Upcoming Action:** A vote on imposing college-wide floors (minimum credits, required capstone, grade caps).
      *   **Opposition:**
          1.  *Autonomy Argument:* Departments know best; central mandates are crude; student preference for lighter loads is valid market data.
          2.  *Denial Argument:* The problem is overstated.
          3.  *Voluntary Coordination Argument:* "Can't we just agree to stop without a rule?"
      *   **Goal:** Draft a pre-vote memo recommending a concrete decision (supporting the floors) while framing the problem to overcome short-term departmental self-interest. It must seriously engage with the autonomy objection and explain why voluntary coordination fails (the multipolar trap).
      *   **Tone:** Professional, persuasive, principled, analytical, not accusatory but firm.

  2.  **Determine the Core Argument & Framing:**
      *   *The Problem:* It's a collective action problem (Prisoner's Dilemma/Multipolar Trap). Individual rationality leads to collective ruin.
      *   *The Stakes:* The value of the degree (signaling power), institutional reputation, and ultimately student learning outcomes.
      *   *The Solution:* Binding standards (floors) are necessary because voluntary agreements lack enforcement and trust in a competitive environment.
      *   *Addressing Autonomy:* Acknowledge departmental expertise but distinguish between *curricular content* (what is taught) and *structural rigor* (how much is required/expected). Autonomy shouldn't extend to devaluing the common currency of the degree.
      *   *Addressing "Market Demand":* Students shopping for easy A's is a market failure, not a valid preference signal. They lack perfect information about long-term value.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose of the memo and the gravity of the upcoming vote. Acknowledge the tension.
      *   **Framing the Problem (The "Race to the Bottom"):** Use the user's "multipolar trap" insight. Explain *why* individual decisions make sense but aggregate outcomes are harmful. Use the "currency" metaphor (a degree is a shared signal).
      *   **Addressing the "Voluntary Coordination" Objection:** This is crucial. Why won't a handshake deal work? Because incentives remain. If Dept A holds the line and Dept B lowers it, Dept B wins enrollment. Dept A is punished for integrity. Binding rules protect the virtuous.
      *   **Addressing the "Departmental Autonomy" Objection:** This needs nuance. Don't say "you don't know your subject." Say "rigor standards are not subject-specific." A capstone is a pedagogical tool, not a content prescription. Distinguish *what* from *how much*.
      *   **Addressing the "Student Choice" Objection:** Students are customers, but also products. Short-term comfort $\neq$ long-term success. We have a fiduciary duty to the value of the credential.
      *   **The Recommendation:** Be specific. Support the floors.
      *   **Closing:** Call to action. Focus on legacy and institutional mission.

  4.  **Refining the Tone:**
      *   *Avoid:* Blame, accusation ("you sold out"), bureaucratic jargon.
      *   *Include:* Empathy ("I understand the pressure"), logic ("game theory"), shared mission ("we are guardians of the degree").
      *   *Key Phrase:* "The currency of our credential." "Protecting departments from the pressure to compete on ease."

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the grade cap too controversial?
      *   *Fix:* Acknowledge it's the most sensitive part but frame it as necessary for the signal to hold.
      *   *Critique:* Is the autonomy argument dismissed too easily?
      *   *Fix:* Strengthen the concession. Admit that *content* should remain local. The floor is about *structure*, not *syllabus*.
      *   *Critique:* Is the "multipolar trap" language too academic?
      *   *Fix:* Explain it simply. "Individual rationality leading to collective harm."

  6.  **Final Polish:** Check for clarity, flow, and persuasive impact. Ensure the "voluntary coordination" rebuttal is sharp, as requested. (The prompt specifically asks to explain why voluntary coordination won't solve the multipolar trap).

  7.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Policy Committee
  **FROM:** [Your Name], Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Upcoming Vote: College-Wide Standards for Major Requirements

  Colleagues,

  At our meeting next week, we will vote on a proposal to establish college-wide minimum standards for undergraduate majors. Specifically, we are considering floors on credit hours, a requirement for a culminating capstone experience, and guidelines to mitigate grade inflation.

  I am circulating this memo beforehand because the decision we face is not merely procedural. It goes to the heart of what our degree signifies, both to our students and to the world. I know there is significant disagreement on the committee, and I want to ensure that our debate focuses on the long-term health of the institution rather than the short-term enrollment pressures facing individual departments.

  I intend to vote in favor of the proposal. I offer this framing not to preempt discussion, but to clarify the stakes as I see them.

  ### The Nature of the Problem: A Collective Action Trap

  We must be honest about the dynamics driving the changes we have witnessed over the last decade. When a single department reduces its requirements, it is often a rational response to immediate incentives. They are responding to student demand for flexibility, managing enrollment targets set by the Provost, and competing for majors in a crowded marketplace. In isolation, each decision is defensible.

  However, when every department acts on this same logic, we enter a "race to the bottom." This is a classic collective action problem (sometimes called a multipolar trap). Individual rationality is producing collective ruin.

  As requirements drift downward and grades drift upward across the board, the signaling value of our degree diminishes. A degree is a shared currency. If one issuer devalues the currency, it hurts everyone holding it. But if *all* issuers devalue it simultaneously, the currency becomes worthless. We are currently watching the purchasing power of our credential erode.

  ### Why Voluntary Coordination Will Not Work

  The most persistent counter-argument I have heard is: *"Can't we simply agree to hold the line without a mandate? Why do we need a rule?"*

  I wish it were that simple. But voluntary coordination fails in this environment for two reasons:

  1.  **The Incentive to Defect:** Even if every Department Chair sincerely agrees that rigor matters, the enrollment pressure remains. If Department A maintains high standards and Department B lowers them, Department B will likely see an uptick in majors. Department A is then punished for its integrity with lower enrollment, potentially threatening its staffing or budget. A voluntary agreement offers no protection to the departments that try to do the right thing.
  2.  **The Turnover Problem:** Even if we secure a handshake agreement today, leadership changes. A new Chair in three years facing enrollment targets will not feel bound by the informal commitments of their predecessor.

  A binding policy is not an expression of distrust in our colleagues. Rather, it is a mechanism to *protect* departments from the pressure to compete on ease. It allows a Department Chair to say to a student, or to the Provost, "I cannot lower that requirement; the College policy forbids it." It externalizes the constraint so that no single unit is disadvantaged for maintaining rigor.

  ### Addressing Departmental Autonomy

  The second major objection concerns autonomy. The argument is that departments know their disciplines best and that a "one-size-fits-all" floor is a crude instrument that may not fit every field.

  I take this objection seriously. Faculty expertise regarding *curricular content* must remain paramount. The Committee should never dictate what goes into a syllabus or which theories are central to a discipline.

  However, there is a distinction between *content* and *structural rigor*.
  *   **Content:** What topics are covered? (Department Autonomy)
  *   **Structure:** Does the major require sufficient depth to demonstrate mastery? (Institutional Responsibility)

  Requiring a minimum credit threshold or a capstone project does not tell a department *how* to teach. It asserts that a degree from this institution represents a certain level of sustained engagement and synthesis. Autonomy should not extend to the unilateral devaluation of the common credential we all share. We are not micromanaging curricula; we are safeguarding the baseline integrity of the degree itself.

  ### The "Student Choice" Argument

  Finally, some argue that if students prefer lighter majors, that is legitimate market information we should respect.

  Students are our primary stakeholders, but they are not always the best judges of long-term educational value. They are often shopping under constraints of time, cost, and anxiety. If we optimize our majors solely for short-term student comfort, we may be failing in our fiduciary duty to their long-term success. Employers and graduate schools expect a certain level of resilience and synthesis from our graduates. If we remove the friction that produces those qualities, we are not serving students; we are merely accommodating them.

  ### Recommendation

  We are at a tipping point. We can continue to manage the decline, adjusting our standards downward until our degree is indistinguishable from a participation trophy, or we can establish a floor.

  I recommend we **vote in favor** of the proposal.

  This is not about punishing departments that have already reduced requirements; those decisions were made under the current incentive structure. This is about changing the structure so that the next decade looks different from the last one.

  A mandate is the only way to solve a collective action problem. It ensures that rigor is not a competitive disadvantage. It protects faculty who want to challenge their students. And most importantly, it ensures that when a student graduates from this university, the name on their diploma still means something specific, something earned, and something valuable.

  I look forward to a robust discussion on Tuesday.

  Best regards,

  [Your Name]
  Chair, Academic Policy Committee
