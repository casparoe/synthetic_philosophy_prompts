  10. **Finalizing the Argument:** The impasse is a **category error regarding the locus of agency**. UDT locates agency at the source code (timeless). CDT/EDT locates agency at the time-slice (temporal). Until we agree on where the "self" is in a physicalist universe, we can't agree on the decision theory. This is the "Embedded Agency" point.

