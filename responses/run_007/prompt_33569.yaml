answer: |-
  This is one of the most sophisticated open problems in the rationalist ecosystem, and your diagnosis of the stalemate is accurate. You have correctly identified that the surface-level arguments (about money in boxes) are proxies for something deeper.

  To answer your question directly: The impasse is not primarily a hidden formal disagreement, nor is it merely a verbal dispute about which question to ask. **It is a foundational clash regarding the ontology of the agent.**

  Specifically, it is a conflict between **Cartesian** models of agency (which underpin CDT, EDT, and even the critics' intuition) and **Physicalist/Embedded** models of agency (which UDT attempts to inhabit but struggles to formalize).

  Here is the diagnosis of the impasse, layered from the surface down to the bedrock.

  ### 1. The Formal Layer: Logical Counterfactuals as a Placeholder
  You asked if a precise definition would settle things. The honest answer is: **No, not entirely.**

  While it is true that UDT currently lacks a canonical formalism for "logical counterfactuals" (how to evaluate $P(O | \text{do}(A))$ when $A$ is a logical fact about your source code), this is often used as a shield. UDT proponents say, "Once we solve logical uncertainty, UDT will work." Critics say, "The fact that it relies on this undefined magic suggests the approach is wrong."

  Even if we had a perfect theory of logical counterfactuals (e.g., a completed version of *Logical Induction* applied to decision theory), the normative disagreements would remain. We could perfectly calculate the expected utility of a policy, and critics would still argue: *"Why should I maximize that quantity? That quantity includes worlds I know I am not in."*

  So, the lack of formalism is a **symptom** of the impasse, not the cause. It persists because we don't agree on what variables belong in the equation.

  ### 2. The Conceptual Layer: The Locus of Agency
  This is the core of the disagreement. You framed it as "Policy vs. Action," but it is more accurately **"Source Code vs. Time-Slice."**

  *   **The CDT/EDT/Critic View (Cartesian):** The agent is a time-slice entity located *here and now*. It receives sense data, updates its beliefs, and acts. The past is fixed; the future is open. To ignore your current evidence (as UDT does in Counterfactual Mugging) is epistemic insanity. It violates the **Principal Principle**: you should act on your current credences.
  *   **The UDT View (Physicalist/Functionalist):** The agent is an input-output function (source code) instantiated across time and space. "You" are not the time-slice; "you" are the algorithm. Therefore, the decision is made "once" at the logical level, not "now" at the temporal level.

  The impasse exists because standard epistemology assumes a **Cartesian Boundary**. It assumes there is a clean separation between the "mind" and the "world," and that the mind receives data from the world. UDT attempts to dissolve this boundary (since Omega predicts you, your mind is partly in Omega's simulation), but it often falls back on Cartesian language ("choose a policy," "prior").

  Critics feel UDT is asking them to pretend they don't know what they know. Proponents feel Critics are pretending they have free will in a way that physics doesn't support. They are arguing past each other because they have different **metaphysics of the self**.

  ### 3. The Normative Layer: Winning vs. Sanity
  This is the bedrock intuition clash you suspected.

  *   **UDT Axiom:** Rationality is **Reflective Consistency**. If you would have pre-committed to a strategy before the problem started, you should stick to it. If you deviate because you "updated," you are time-inconsistent and exploitable (e.g., via dynamic inconsistency). The terminal value is **Winning** (utility maximization across the multiverse/logical space).
  *   **Critic Axiom:** Rationality is **Epistemic Integrity**. You must act on the information you actually possess. To act as if you don't know the box is empty (in Newcomb) or that the coin landed tails (in Mugging) is a form of self-deception. The terminal value is **Sanity** (correct reasoning given current state).

  The reason this doesn't resolve is that "Winning" and "Sanity" usually correlate. In the real world, acting on evidence works. UDT only pulls ahead in "Newcomblike" problems where the environment correlates with your decision algorithm. Critics argue that these problems are **ontologically suspicious**—they require the universe to "know" your decision in a way that feels like cheating. UDT proponents argue that these problems are **inevitable** for embedded agents (other humans, markets, AI predictors will model you).

  ### The Real Bottleneck: Embedded Agency
  The debate is stuck because both sides are using tools designed for **Dualistic Agency** to solve **Embedded Agency** problems.

  *   CDT/EDT assume the agent is outside the causal graph.
  *   UDT assumes the agent can step outside time to choose a policy.

  Neither fully captures an agent that is *part* of the environment, running on hardware that can be read, predicted, and simulated by other parts of the environment.

  The "Extortion" critique (e.g., the *Benign World* or *Roko's Basilisk* variants) is where the impasse is currently bleeding. UDT seems to imply you should pay acausal blackmailers if you knew ex-ante that paying was the optimal policy to prevent them from existing. Critics say this is absurd; UDT proponents say it's the bitter pill of reflective consistency. This specific knot hasn't been untied because we lack a theory of **counterfactuals for embedded agents** that distinguishes between "correlation" and "control" without relying on a Cartesian free will.

  ### What Could Move the Debate Forward?
  You asked for an honest assessment. Here is the hierarchy of what could break the stalemate:

  1.  **A Formalism for Embedded Counterfactuals (High Impact):**
      We need a mathematical framework that defines "what would happen if I did X" for an agent that is *inside* the environment, without assuming a clean causal cut. Work on **Finite Factored Sets** (Scott Garrabrant) or advances in **Logical Induction Decision Theory** are attempts at this. If someone can derive UDT-like results *without* invoking a "magical prior" but instead deriving the "updateless" behavior from the structural constraints of embeddedness, critics would lose the "epistemic insanity" objection.

  2.  **A "No-Go" Theorem (Medium Impact):**
      A proof showing that no decision theory can satisfy a set of seemingly reasonable axioms (e.g., Reflective Consistency + Epistemic Responsiveness + No-Blackmail). This would force the community to admit that one of our bedrock intuitions must be sacrificed. We currently suspect this is true (analogous to Arrow's Impossibility Theorem), but we don't have the theorem for decision theory yet.

  3.  **Dissolving the "Self" (Conceptual Shift):**
      The debate might not be "solved" but "dissolved." If we develop a robust theory of **indexical uncertainty** and **self-locating beliefs** that treats the agent as a pattern rather than a substance, the question "Should I update?" might transform. It might turn out that "updating" is the wrong abstraction for how information affects policy selection in a deterministic universe.

  ### Verdict: Will it stay stuck?
  **Yes, for the near future.**

  The impasse will persist until we have a better ontology of **Embedded Agency**. As long as we argue about "policies" and "priors" using language inherited from Cartesian dualism, UDT will feel like magic to critics and CDT will feel like suicide to UDT proponents.

  The path forward isn't a new thought experiment (we have enough of those); it's a **new formal language** for agency. Until we can mathematically describe an agent that is strictly part of the universe, without special "decision" primitives, we will keep cycling through the same intuitions. The disagreement is not about decision theory; it is about **metaphysics**.

  If you are looking for where to watch for movement, ignore the decision theory papers and watch the work on **ontology of agents** (MIRI's embedded agency sequence, Garrabrant's factored sets, etc.). That is where the actual disagreement is being fought, even if it doesn't look like decision theory on the surface.
