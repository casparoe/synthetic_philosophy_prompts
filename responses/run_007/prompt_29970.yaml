  # Seminar Handout: Mapping Responses to the Dogmatism Paradox

  **Instructions:** This decision tree sorts epistemological positions based on your intuitions about specific cases, not on theoretical labels. Read the three cases below. Start at **Question 1** and follow the branches until you reach a leaf. Record your path and your resulting position.

  ### The Diagnostic Cases

  1.  **The Defense Lawyer:** A lawyer knows her client is innocent based on definitive DNA evidence. She then receives a sealed envelope containing a witness statement placing the client at the scene. She has not read the statement.
  2.  **The Physician:** A doctor knows a patient has Condition A based on a conclusive Gold-Standard test. She is then informed that a less reliable Rapid Test has come back positive for Condition B (which is incompatible with A). She has not seen the Rapid Test data.
  3.  **The Juror (for Question 5 only):** A juror knows the defendant is guilty based on overwhelming video evidence. She realizes that if the defendant is guilty, the alibi witness must be lying. She has not yet heard the witness testify.

  ---

  ### The Decision Tree

  **Q1. In the *Defense Lawyer* case, is it ever rationally permissible for the lawyer to discard the sealed envelope without reading it?**
  *   **YES:** Go to **Q2**.
  *   **NO:** Go to **Q3**.

  **Q2. (If YES) Is it permissible even if the envelope comes from a generally reliable source (e.g., a court clerk)?**
  *   **YES:** → **Leaf A**
  *   **NO:** → **Leaf B**

  **Q3. (If NO) In the *Physician* case, does the mere announcement of the conflicting Rapid Test result destroy the doctor's *knowledge* that the patient has Condition A?**
  *   **YES:** Go to **Q4**.
  *   **NO:** Go to **Q5**.

  **Q4. (If Knowledge Destroyed) Suppose the Rapid Test is later proven to be a machine glitch. During the time the doctor was aware of the conflict, did she *know* the diagnosis all along?**
  *   **YES:** → **Leaf C**
  *   **NO:** → **Leaf D**

  **Q5. (If Knowledge Retained) In the *Juror* case, does the juror *know* the witness is lying before hearing the testimony?**
  *   **NO:** → **Leaf E**
  *   **YES:** Go to **Q6**.

  **Q6. (If She Knows) If the juror knows the witness is lying, must she *give up* that belief to be rational, or can she keep the belief but simply refrain from ignoring the testimony?**
  *   **Must Give Up Belief:** → **Leaf F**
  *   **Keep Belief, Refrain from Ignoring:** → **Leaf G**

  ---

  ### The Positions (Leaves)

  | Leaf | Standard Label | View Statement | Most Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **A** | **Hard Dogmatism** | In cases of definitive evidence, you are permitted to ignore counter-evidence unread, regardless of the source. | You must accept that intellectual closed-mindedness is sometimes a rational virtue. |
  | **B** | **Externalist Dogmatism** | You may ignore counter-evidence only if your evidence is definitive *and* the new source is known to be unreliable. | Permissibility depends on facts about reliability external to the agent's current perspective. |
  | **C** | **Epistemic Contextualism** | The word "knows" changes meaning; you "knew" all along, but the standards for saying so rose when the conflict appeared. | Truth values of knowledge claims change without any change in the subject's mental state or evidence. |
  | **D** | **Defeasibility Theory** | The existence of counter-evidence (even misleading) defeats knowledge claims, so you temporarily lose knowledge. | You can lose knowledge due to facts you are unaware of or that turn out to be false. |
  | **E** | **Closure Denial** | Knowledge does not transmit from a proposition to the conclusion that counter-evidence against it is misleading. | You can know $P$ and know $P \to Q$, yet fail to know $Q$. |
  | **F** | **Higher-Order Evidence** | The presence of counter-evidence makes it irrational to believe your inference that the evidence is misleading. | You are in a state of rational tension where you know $P$ but shouldn't trust the reasoning that confirms it. |
  | **G** | **Propositional Justification** | You have justification to believe the evidence is misleading, but lack the doxastic justification to act on that belief. | You possess a truth you are rationally forbidden to use for practical decision-making. |

  ---

  ### Instructor's Analysis & Meta-Commentary

  **1. Indistinguishable Leaves**
  The tree struggles to cleanly separate **Leaf F (Higher-Order Evidence)** and **Leaf G (Propositional Justification)**. Both views agree that you retain knowledge of $P$ but cannot ignore the evidence. The distinction rests on whether you are forbidden from *believing* the evidence is misleading (F) or merely forbidden from *acting* on that belief (G). In practice, many proponents of F argue that the irrationality of the belief leads to a loss of knowledge anyway, which would push them back to **Q3 (YES)**. To separate these definitively, one would need a question asking: *"Is the belief that the evidence is misleading itself irrational, or only the action of ignoring the file?"*

  **2. Empty Combinations**
  *   **Hard Dogmatism (Leaf A) + Closure Denial (Leaf E):** This combination is **incoherent**. Hard Dogmatism relies on the inference: "I know $P$, $P$ implies evidence is misleading, therefore I know evidence is misleading and can ignore it." If you deny Closure (Leaf E), you cannot make that inference, undermining the license to ignore.
  *   **Contextualism (Leaf C) + Hard Dogmatism (Leaf A):** This combination is **merely unattractive/unstable**. Contextualism usually explains away the dogmatism intuition by saying "knows" becomes harder to satisfy. Hard Dogmatism embraces the intuition that you *do* know and *can* ignore. Holding both requires saying standards shift but you still meet the higher standards, which removes the motivation for Contextualism.

  **3. The "Heavy Lifting" Question**
  **Question 1** ("Is it ever permissible... to discard the sealed envelope?") does the most classificatory work.
  *   **Fairness Assessment:** The wording is **fair** to a student who has not yet taken a side. It asks for a pre-theoretical intuition about a concrete action (discarding an envelope) rather than a theoretical commitment (e.g., "Does knowledge close?"). However, it risks priming students toward anti-dogmatism, as "discarding evidence" sounds negligent in a legal context. A more neutral phrasing might be: *"Is the lawyer rationally required to open the envelope?"* but the current phrasing is more direct for a decision tree.

  **4. Collapsed Distinctions**
  **Leaf F (Higher-Order Evidence)** often collapses into **Leaf D (Defeasibility Theory)**. Many Higher-Order Evidence theorists argue that if it is irrational to believe your evidence is misleading, you no longer *know* the original proposition $P$. If a student answers **YES** to **Q3** (Knowledge Destroyed) but wants to cite Higher-Order Evidence as the *reason*, they belong in Leaf D for the purposes of this tree, as Leaf F is reserved for "Level-Splitting" views that maintain Knowledge despite the irrationality.
