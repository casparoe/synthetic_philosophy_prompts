      This is a really compelling project and you are definitely tackling the right set of objections. The move to focus on rational residue is the standard and most promising way to defend the reality of moral dilemmas, but you are right to be worried about whether it actually engages the ought implies can proponent or just talks past them. The core issue is that the dilemma-denier usually grants that you will feel bad, but they insist that this feeling is merely psychological, not normative. They will say that once you have done what you ought to do all-things-considered, there is no normative ground left for the guilt to stand on. So your central task is to show that the guilt is fitting, which implies that the violated obligation still has normative force even though it was overridden.

      You asked if you are changing the subject from obligation to emotion, and the honest answer is that you risk doing so unless you build a very tight bridge between the two. If you just say people feel regret, the denier will say so what. You need to argue that the regret is a form of moral recognition. Bernard Williams is great for this, specifically his distinction between agent-regret and ordinary regret. Agent-regret is tied to the agent's own involvement in the outcome, and it suggests that something of value was lost through their agency, not just that the world is in a suboptimal state. If you can show that an agent who felt no regret in a case like Sophie's Choice would be morally deficient, then you have made progress toward showing the regret is rational. It becomes a test case for moral understanding. If the absence of regret constitutes a failure of moral perception, then the regret itself must be tracking something real about the moral situation, namely that a genuine obligation was violated.

      Regarding the ought implies can principle, you need to decide whether you want to reject it outright or argue that it is compatible with dilemmas. Some philosophers argue that ought implies can only applies to all-things-considered obligations, meaning you cannot be obligated to do the impossible overall, but you can have conflicting prima facie obligations that retain their force. Ruth Barcan Marcus's point is crucial here because she argues that the principles themselves are consistent even if they cannot all be satisfied in a particular world. The contradiction is in the world, not in the logic of the moral code. If you take this route, you can concede ought implies can for the final action but insist that the conflicting obligations were both real prior to the choice and leave a trace afterward. The denier will try to collapse all obligations into the final all-things-considered verdict, so you must argue that moral life is not just about maximizing the good or following the final rule, but about honoring multiple values that can tragically conflict.

      There are stronger versions of the dilemma-denier's position that you should anticipate. One is the idea of prima facie duties where the overridden duty is completely cancelled. You need to argue that cancellation is not the same as overriding. Another strong objection is that the regret is about the situation, not the action. They will say you regret that you had to choose, not that you chose wrongly. To counter this, you need to emphasize that the regret is specifically about the action taken, even if it was the best available option. You might also encounter the argument that admitting dilemmas makes morality too demanding or irrational. If morality requires impossible things, it loses its action-guiding force. You can respond that morality is sometimes tragic and that acknowledging this preserves the seriousness of moral commitments rather than sanitizing them.

      To make the step that regret is rationally required, you should use a counterfactual argument. Ask your reader to imagine an agent who makes the tragic choice but feels absolutely no remorse or guilt, perhaps even feeling satisfied that they minimized the damage. Would we consider this agent morally ideal? Most people intuitively feel that such an agent is cold or lacks moral depth. This intuition suggests that the regret is not just a psychological side effect but a warranted response to a moral violation. If the regret is warranted, then the violation was real, which means the obligation was real. This moves the argument from phenomenology to normative ethics. You are using the emotion as evidence for the underlying normative structure.

      Finally, make sure you clarify what you mean by genuine moral dilemmas. Are you arguing that there are cases where you ought to do A and ought to do B and cannot do both, or are you arguing that you ought to do A and ought to do B and doing A is still wrong? The latter is harder to defend but more interesting. If you argue that the chosen action was still wrong in some respect, you need to explain how an action can be right all-things-considered but still wrong. This is where the notion of moral residues comes in again. The action is justified but not blameless. This distinction is key to surviving the ought implies can objection without abandoning the principle entirely. You are arguing that justification does not erase the wrongness of the violated claim. Good luck with the paper, it sounds like you have a solid grasp of the literature and the stakes involved.

