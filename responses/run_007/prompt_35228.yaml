answer: |-
  This is a sharp methodological worry, and the fact that it nags at you suggests you are sensing a real distinction in the *logic* of these cases, not just a difference in rhetorical flair. The inconsistency you feel between Mary and Zombies is the key to unlocking the principle you are looking for.

  Based on the pattern of your verdicts, I propose that the principle sorting your cases is **The Compatibility Criterion**, supported by a constraint on **Level of Description**.

  Here is the breakdown of the principle, how it resolves your Mary/Zombie tension, and what it implies for your other verdicts (including Swampman).

  ### 1. The Principle: The Compatibility Criterion

  A thought experiment is methodologically legitimate (i.e., not merely a question-begging intuition pump) if **a proponent of the target theory can accept the *possibility of the scenario* without contradicting their core theoretical commitments.**

  In other words:
  *   **Legitimate:** The target theorist can say, "Okay, I grant that scenario is possible/describable. Now let's argue about what it *means* or what follows from it."
  *   **Illegitimate (Intuition Pump):** The target theorist must say, "That scenario is impossible according to my theory, so you cannot use it as a premise to refute my theory."

  This distinguishes between **testing a theory** (legitimate) and **assuming the falsity of a theory** (illegitimate).

  ### 2. Resolving the Mary vs. Zombie Tension

  This criterion explains exactly why your intuitions diverge on Jackson and Chalmers, even though they target the same view.

  *   **Jackson's Mary (Legitimate):**
      *   **The Setup:** Mary knows all physical facts but has never seen red. She sees red.
      *   **Physicalist Compatibility:** A physicalist *can* grant this scenario. It does not violate physical laws. It does not posit a non-physical substance. It is an epistemic scenario.
      *   **The Work:** It forces the physicalist to explain *what* is learned. The physicalist can accommodate the intuition by refining their theory (e.g., The Phenomenal Concept Strategy: she learns a new mode of access to the same physical fact).
      *   **Verdict:** The scenario is compatible with physicalism; the *implication* (that physicalism is false) is what is contested. This makes it a fair test.

  *   **Chalmers' Zombies (Not Legitimate):**
      *   **The Setup:** A being physically identical to you but lacking consciousness.
      *   **Physicalist Compatibility:** A type-A physicalist (or even a robust type-B physicalist) *cannot* grant this scenario. If physicalism is true, fixing the physical facts *necessitates* fixing the phenomenal facts. To assert the zombie is *possible* is to assert that physicalism is false.
      *   **The Work:** The thought experiment *is* the argument. It asks you to accept a modal intuition (conceivability entails possibility) that directly contradicts the necessitation claim of physicalism.
      *   **Verdict:** The scenario is incompatible with the target theory. Using it to refute physicalism begs the question.

  **The Principle:** Mary isolates an *epistemic* gap that physicalism must explain; Zombies posit an *ontological* gap that physicalism denies is possible. Mary allows for theoretical refinement; Zombies demand theoretical surrender.

  ### 3. Applying the Principle to Your Other Verdicts

  This criterion validates most of your existing list but suggests a revision on **Block's Chinese Nation**.

  *   **Thomson (Violinist/People-Seeds) & Nozick (Experience Machine):**
      *   **Compatible?** Yes. A utilitarian or a pro-life advocate can grant the scenario. They don't have to deny the violinist is attached or that the machine exists. They dispute the *moral valuation* of the outcome.
      *   **Verdict:** Legitimate. They isolate variables (autonomy, reality) without presupposing the moral conclusion.

  *   **Searle's Chinese Room:**
      *   **Compatible?** No. Searle describes the man as manipulating "syntax without semantics." A functionalist/strong AI proponent rejects this description. They argue that if the system passes the Turing Test, semantics *is* present (by definition of their theory). Searle's description presupposes that syntax $\neq$ semantics, which is the very point in dispute.
      *   **Verdict:** Not Legitimate. It rigs the description to ensure the desired output.

  *   **Block's Chinese Nation (Revision Suggested):**
      *   **Your Verdict:** Back and forth.
      *   **Analysis:** This is the Chinese Room scaled up. However, it is *harder* to dismiss via the "Systems Reply." In the Room, you can say "the man doesn't know, but the system does." In the Nation, the system is the people. If the people don't feel pain, where is the pain?
      *   **Application of Criterion:** Can a functionalist grant the scenario? Yes, they can grant the nation acts isomorphically to a brain. Do they have to grant the *conclusion* (no consciousness)? No. They can argue consciousness *is* that functional organization, even if it feels counterintuitive.
      *   **Recommendation:** If you mark the Chinese Room as "Not Legitimate" because it ignores the Systems Reply, you should arguably mark the Chinese Nation as **Legitimate** (or at least *more* legitimate). The Nation makes the Systems Reply harder to sustain, turning it from a "trick" into a genuine stress test of functionalism. It forces the functionalist to bite a harder bullet. If the Room is a pump, the Nation is a pressure test.

  ### 4. The Case of Davidson's Swampman

  This is the test case for the principle.

  *   **The Scenario:** Lightning strikes a swamp and creates a molecule-for-molecule duplicate of Davidson.
  *   **The Question:** Does Swampman have thoughts/meanings?
  *   **Target Theory:** Internalism (meanings are in the head) vs. Externalism (meanings depend on causal history).
  *   **Compatibility:**
      *   **Internalist:** Can grant the scenario. Concludes Swampman *does* think.
      *   **Externalist (Davidson):** Can grant the scenario. Concludes Swampman *does not* think (initially).
  *   **Verdict:** **Legitimate.**
      *   Unlike Zombies, the scenario does not violate the laws of nature or the core tenets of Internalism. It is a possible world (nomologically).
      *   Unlike the Chinese Room, the description doesn't smuggle in the conclusion. It doesn't describe Swampman as "lacking meaning"; it describes him as "lacking history." The lack of meaning is the *inference*, not the setup.
      *   **Function:** Like Mary, it is **Diagnostic**. It reveals where you stand on the necessity of causal history for content. It doesn't prove Externalism; it forces the Internalist to explain why history doesn't matter.

  ### 5. Summary of Criteria for Your Reading Group

  To formalize this for your group, you can propose that a Thought Experiment avoids being a pejorative "Intuition Pump" if it satisfies three conditions:

  1.  **Premise Acceptability:** Can the opponent accept the *possibility* of the scenario without self-contradiction? (Rules out Zombies).
  2.  **Descriptive Neutrality:** Is the scenario described in terms neutral to the dispute, or does the description load the dice? (Rules out Chinese Room).
  3.  **Accommodability:** Does the scenario allow the opponent to refine their theory to meet the intuition, or does it demand they abandon the theory's core axiom? (Mary allows refinement; Zombies demand abandonment).

  **Suggested Revisions to Your List:**
  *   **Keep:** Mary (Legitimate), Zombies (Illegitimate), Violinist/Seeds (Legitimate), Experience Machine (Legitimate), Chinese Room (Illegitimate).
  *   **Revise:** **Chinese Nation.** Move toward "Legitimate." It is a stronger case than the Room because it resists the "level of analysis" objection. It is a genuine challenge to functionalism, even if functionalists can ultimately resist it.
  *   **New:** **Swampman.** Verdict: **Legitimate.** It functions like Mary (diagnostic of commitments regarding history vs. intrinsic properties) rather than like Zombies (asserting an impossibility).

  This framework preserves your core insight (that Mary and Zombies are methodologically distinct) while giving you a consistent tool to evaluate future cases. It shifts the focus from "Does this intuition feel strong?" to "Is this intuition allowed to play in the game?"
