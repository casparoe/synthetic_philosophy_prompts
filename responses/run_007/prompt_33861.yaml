prompt: |-
  I serve on my city's licensing commission. This week we vote on a permit for a business whose operations are lawful, adult, and fully consensual, but which a neighborhood association opposes as morally degrading; the opponents concede that they can point to no specific harm — no crime, no nuisance, no blight, no measurable effect on property values — only to their own strong moral revulsion. Our enabling ordinance says a license may be denied if the proposed use would be "injurious to public morals." Last night I had a long argument with a friend about whether the law may ever enforce a community's moral code as such, and I came away less certain how I should vote, not more. Please draft the short written opinion I will circulate before the vote. It should recommend granting or denying the permit, give reasons the commission can actually act on, and engage seriously with the strongest consideration on the losing side. I would also like the opinion to address an inconsistency that bothers me: this same commission routinely licenses liquor stores, casinos, and payday lenders over moral objections, and regulates them only for concrete harms such as underage sales, noise, or predatory loan terms. If moral revulsion alone is a legitimate ground here, why is it not a legitimate ground there; and if it is not, what is the principle that actually distinguishes the cases, and what does that principle commit the commission to going forward?
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a city licensing commission.
      *   **Task:** Draft a short written opinion to circulate before a vote.
      *   **Subject:** A permit for a lawful, adult, consensual business (implied adult entertainment or similar) opposed by a neighborhood association solely on moral grounds ("morally degrading," "moral revulsion").
      *   **Key Constraint 1 (Legal/Regulatory):** The enabling ordinance allows denial if the use is "injurious to public morals."
      *   **Key Constraint 2 (Factual):** Opponents concede no specific harm (no crime, nuisance, blight, property value impact).
      *   **Key Constraint 3 (Consistency):** The commission routinely licenses liquor stores, casinos, and payday lenders over moral objections, regulating them only for concrete harms.
      *   **Goal:** Recommend granting or denying the permit.
      *   **Requirements:** Give actionable reasons, engage seriously with the strongest counter-argument, and address the inconsistency regarding other "vice" industries.
      *   **Tone:** Professional, legalistic but accessible, reasoned, principled.

  2.  **Determine the Recommendation:**
      *   *Option A (Deny):* Upholds the "public morals" clause literally. Risks hypocrisy given the treatment of liquor/casinos. Risks legal challenge (vagueness, First Amendment if expressive).
      *   *Option B (Grant):* Aligns with the commission's recent precedent of requiring concrete harms. Respects individual liberty in a pluralistic society. Avoids the hypocrisy trap.
      *   *Decision:* **Grant the permit.** This allows for a stronger principled stand on the "inconsistency" issue. It forces the commission to define "public morals" in a way that doesn't collapse into mere majoritarian disgust, which is legally and ethically precarious.

  3.  **Address the Core Legal/Philosophical Tension:**
      *   *The "Public Morals" Clause:* It exists, but how is it interpreted?
      *   *The Harm Principle (Mill):* State power is only justified to prevent harm to others, not to enforce morality for its own sake.
      *   *The Inconsistency:* Why treat this business differently from liquor/casinos?
      *   *Resolution:* Distinguish between *inherent immorality* (which is subjective and volatile) and *demonstrable secondary effects* (which are objective and manageable). The commission's precedent has already shifted toward the latter. To vote "no" here would be an arbitrary departure from that precedent.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the recommendation clearly (Grant). Acknowledge the difficulty of the vote.
      *   **The Legal Standard ("Injurious to Public Morals"):** Interpret this phrase. It cannot mean "whatever makes some people uncomfortable." It needs an objective standard.
      *   **Addressing the Inconsistency (The Crux):** This is the user's specific worry.
          *   *Observation:* We license liquor, casinos, payday lenders.
          *   *Reasoning:* We regulate them based on *secondary effects* (crime, noise, predation), not the *inherent nature* of the activity.
          *   *Principle:* The commission operates on a "harm-based" regulatory model, not a "virtue-based" one.
          *   *Application:* If we deny this permit based *only* on moral revulsion, we break our own model. We must be consistent.
      *   **Engaging the Counter-Argument (The Strongest Case for Denial):**
          *   *Argument:* Community character matters. "Public morals" implies a shared standard of decency. Ignoring this erodes social fabric.
          *   *Rebuttal:* In a diverse city, whose morals count? Without concrete harm, "morals" becomes a veto for the loudest group. The ordinance shouldn't be a weapon for neighborhood exclusion.
      *   **Conclusion/Commitment:** What does this commit us to?
          *   Future standard: Concrete evidence of secondary effects.
          *   Fairness: Equal treatment under the law.
      *   **Final Vote:** Grant.

  5.  **Refining the Tone and Language:**
      *   Avoid overly academic jargon (like "legal positivism" or "perfectionism") but keep the reasoning rigorous.
      *   Ensure the distinction between "moral revulsion" and "public harm" is sharp.
      *   Make sure the "inconsistency" point is the pivot of the argument, as requested.
      *   *Self-Correction during drafting:* I need to make sure I don't ignore the ordinance. The ordinance *says* "injurious to public morals." I can't say "ignore the ordinance." I must interpret it. Interpretation: "Public morals" in a modern, pluralistic licensing context implies the *public order and welfare*, not private theological or philosophical objections.

  6.  **Final Review against Constraints:**
      *   Recommend Grant/Deny? Yes (Grant).
      *   Actionable reasons? Yes (Evidence of harm vs. assertion of morals).
      *   Engage strongest losing side? Yes (Community character/shared morality).
      *   Address inconsistency (liquor/casinos)? Yes (Harm principle vs. Moralism).
      *   Short written opinion? Yes (Keep it under ~800-1000 words).

  7.  **Final Polish:** Check for clarity and impact. (The resulting draft looks solid. It frames the "inconsistency" not as a weakness, but as an established precedent that demands consistency.)

  *(Self-Correction Note)*: I should ensure I don't sound like I'm lecturing the commission. It needs to be a colleague speaking to colleagues. Use "we" and "our commission."

  8.  **Final Output Generation** (Proceed to generate the memo).
answer: |-
  **MEMORANDUM**

  **TO:** City Licensing Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding Permit Application [Number] – [Business Name]

  **Recommendation**
  I recommend that the Commission **GRANT** the permit.

  While I acknowledge the sincere objections raised by the neighborhood association, our decision must rest on a consistent, enforceable standard. The applicants propose a business that is lawful, adult, and consensual. The opposition concedes there is no evidence of specific harm: no increase in crime, no nuisance, no blight, and no negative impact on property values. The objection rests solely on moral revulsion.

  To deny this permit on that basis alone would be inconsistent with our commission's established precedent and would set a dangerous regulatory standard for the future.

  **The Inconsistency of "Moral" Regulation**
  The most pressing consideration before us is not the nature of this specific business, but the integrity of our own regulatory framework. This Commission routinely licenses enterprises that many citizens find morally objectionable: liquor stores, casinos, and payday lenders. These industries have historically been associated with vice, addiction, and moral decay.

  Yet, in those cases, we do not deny permits based on the *inherent* morality of the activity. We do not ban liquor because drinking is a sin, nor payday lenders because usury is wrong. Instead, we license them and regulate them for *concrete, secondary harms*: underage sales, noise, loitering, or predatory loan terms. We have effectively adopted a "harm principle" model of regulation. We govern conduct based on its measurable impact on public welfare, not its alignment with a specific moral code.

  If we deny this permit based solely on moral revulsion, we break that model. We would be asserting that "moral offensiveness" is a sufficient ground for exclusion in this case, but not for liquor or gambling. This creates arbitrary enforcement. It suggests that a business may operate if its immorality is familiar to us (alcohol), but not if it is unfamiliar or culturally distinct (adult entertainment). To maintain the rule of law, we must apply the same standard to all applicants. If moral revulsion alone is not enough to close a casino, it cannot be enough to close this business.

  **Interpreting "Injurious to Public Morals"**
  Our enabling ordinance allows denial if a use is "injurious to public morals." I understand my colleagues may feel this language mandates a vote to deny. However, in a pluralistic city, "public morals" cannot mean the subjective preferences of a specific neighborhood. If it did, any neighborhood could veto any lawful business simply by declaring it offensive.

  We must interpret "injurious to public morals" in a way that is objective and actionable. The most coherent interpretation is that a business injures public morals only when it demonstrably degrades the *public order* or causes *harm to third parties*. Without evidence of crime, nuisance, or blight, there is no injury to the public realm. There is only private disagreement. The ordinance empowers us to protect the community's welfare, not to enforce a specific code of virtue.

  **The Strongest Case for Denial**
  I take seriously the argument that a community is more than a collection of individuals; it is a shared space with a character worth protecting. The opponents argue that allowing this business signals a communal endorsement of its values, eroding the social fabric regardless of measurable crime. They contend that "public morals" implies a shared standard of decency, and that the Commission has a duty to uphold that standard even absent specific nuisance complaints.

  This is a valid philosophical position. However, as a regulatory body, we lack the tools to adjudicate competing visions of the "good life." Whose morals define the public standard? In the past, similar language was used to exclude businesses based on the race, religion, or orientation of their owners. While this case is different, the risk remains: if "moral injury" requires no proof of harm, it becomes a blank check for exclusion. We cannot manage a diverse city by licensing only those businesses that offend no one's conscience.

  **Conclusion and Commitment**
  Granting this permit commits the Commission to a clear principle going forward: **We regulate based on evidence of harm, not assertions of virtue.**

  This does not mean we are powerless. If this business generates noise, attracts crime, or creates a nuisance, we have ample authority to revoke the permit based on those concrete violations. We are not surrendering our oversight; we are grounding it in objective reality.

  By voting to grant, we affirm that in this city, the law governs what we *do* to one another, not what we *think* of one another. I urge my colleagues to vote accordingly.
