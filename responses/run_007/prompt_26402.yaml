answer: |-
  This is an exceptionally sharp diagnosis of a classic impasse in axiology. You have correctly identified that the debate over the heterogeneity of pleasure often masquerades as a phenomenological dispute while functioning as something deeper.

  To answer your question directly: **This is primarily a theoretical and metaphysical disagreement about the grounds of value, disguised as a phenomenological dispute.** It is only secondarily verbal, and it is unlikely to be settled by "better" introspection or neuroscience alone.

  Here is a breakdown of why the debate stalls, what kind of disagreement it actually is, and how you might frame it to your seminar to push past the stalemate.

  ### 1. Why Introspection Fails (The Theory-Ladenness of Phenomenology)
  You noted that both sides agree on first-order facts (a backrub feels different from a proof) but disagree on the existence of a second-order "hedonic tone." The reason introspection cannot settle this is that **introspection is theory-laden.**

  When a hedonist (like Henry Sidgwick or Roger Crisp) introspects, they are looking *for* a common quality. They are primed to find a "glow" or a "tingle" that constitutes the goodness. When an anti-hedonist (like G.E. Moore or Stephen Katz) introspects, they are looking for a *distinct* quality to separate the sensation from the evaluation.

  If I ask you to introspect on the "redness" of a red apple, you find it. If I ask you to introspect on the "existence" of the apple, you might not find a specific quality called "existence" alongside the redness and roundness. The hedonist claims pleasure is like the redness (a detectable qualia); the anti-hedonist claims it is like the existence (a mode of the experience or a judgment about it). No amount of staring at the apple will settle whether "existence" is a visible property.

  Therefore, this is **not a factual disagreement** that better methods will solve. It is a disagreement about the **categorization of mental states.**

  ### 2. The Three Layers of the Disagreement
  To move the seminar forward, it helps to disentangle the three distinct arguments happening simultaneously.

  #### A. The Verbal Disagreement (Sensory vs. Attitudinal)
  This is the easiest to resolve. Much of the heterogeneity problem dissolves if we distinguish between **Sensory Hedonism** (pleasure is a specific feeling) and **Attitudinal Hedonism** (pleasure is a pro-attitude toward a state of affairs).
  *   **Fred Feldman's Move:** In *Pleasure and the Good Life*, Feldman argues that if we define pleasure attitudinally (e.g., "being pleased that p"), the heterogeneity problem loses its bite. I can be "pleased that" I solved the proof and "pleased that" I am getting a backrub. The *object* differs, but the *attitude* (counting it as good/welcome) is uniform.
  *   **The Cost:** Critics argue this turns hedonism into a version of desire-satisfaction theory. If "pleasure" just means "intrinsically desiring a state of affairs," have we really preserved the hedonistic intuition that *feeling* good is what matters?

  #### B. The Phenomenological Disagreement (Tone vs. Adverbial)
  If we stick to sensory hedonism, the disagreement is about the metaphysics of experience.
  *   **The Tone Theory:** Pleasure is a distinct ingredient added to the experience (like sugar in coffee). The anti-hedonist says: "I taste the coffee, I taste the sugar, but in the case of solving a proof, there is no sugar."
  *   **The Adverbial Theory:** Pleasure is not an ingredient; it is a *way* of experiencing something. (Inspired by Ryle or Chisholm). To enjoy a proof is not to have a proof-sensation plus a pleasure-sensation; it is to experience the proof *enjoyably*.
  *   **The Stalemate:** The anti-hedonist says, "If it's just a way of experiencing, then 'enjoyably' is just a placeholder for 'prudentially valuable,' and your theory is circular." The hedonist says, "No, it's a real phenomenological mode." This is where the burden of proof debate kicks in.

  #### C. The Normative/Metaphysical Disagreement (The Real Engine)
  This is the core. The debate is actually about **Natural Kind vs. Normative Kind.**
  *   **The Anti-Hedonist View:** "Pleasure" is a descriptive, psychological natural kind. If you can't point to the shared physical or phenomenal property, the kind doesn't exist.
  *   **The Hedonist View (Primitivism):** Some modern hedonists (like Chris Heathwood) argue that pleasure is a **normative natural kind**. We identify pleasure *by* its role in well-being.
      *   *Analogy:* We define "water" as H2O, not by its wetness. Similarly, perhaps "pleasure" is the mental state that *actually* constitutes well-being, whatever its phenomenology turns out to be.
      *   *The Consequence:* If this is the view, the heterogeneity objection misses the point. It doesn't matter if the phenomenology is heterogeneous; if neuroscience or normative theory identifies a unified functional role that grounds value, *that* is pleasure.

  ### 3. How to Move the Debate Forward (Seminar Strategy)
  If you want to break the three-week cycle, I suggest shifting the terrain from "What does pleasure feel like?" to "What work is the concept doing?"

  **Strategy 1: The "Open Question" Pivot**
  Ask the class: *If we found a common phenomenological thread, would that settle the normative question?*
  *   Suppose neuroscience finds a specific "hedonic neural signature" present in backrubs and proofs.
  *   **Question:** Is it good *because* it has that signature, or does it have that signature *because* it is good?
  *   If the former, we are biological hedonists. If the latter, the phenomenology is incidental. This forces the anti-hedonist to admit that even if there is no shared feeling, there might be a shared *value-making property*.

  **Strategy 2: The "Paradigm Case" Concession**
  Have the hedonist concede the hard cases.
  *   Admit that "the pleasure of reading a sentence" might not share a quality with "sexual pleasure."
  *   Argue that Hedonism only needs to cover the **paradigm cases** of intrinsic value.
  *   **Counter:** The anti-hedonist will say this reduces hedonism to a partial theory. But it moves the debate from "Is there a universal quality?" to "How much of well-being can phenomenology explain?"

  **Strategy 3: Focus on the "Felt Goodness"**
  Distinguish between **liking** (phenomenal) and **wanting** (motivational).
  *   Kent Berridge's neuroscience research distinguishes "liking" (hedonic impact) from "wanting" (incentive salience).
  *   Propose that the "common quality" is not a sensation (like warmth) but a **valence**.
  *   **The Trap:** The anti-hedonist will say "Valence is just a technical word for 'goodness'."
  *   **The Move:** If the hedonist accepts this, they are admitting that "pleasure" is defined by its normative role. This transforms the theory into **Normative Primitivism**. The debate then becomes: "Is there a primitive normative property of experiences?" which is a meta-ethical question, not a phenomenological one.

  ### 4. Diagnosis: Is it a Stalemate?
  Yes, **if** the debate remains framed as "Can we isolate a specific qualia?"
  No, **if** the debate shifts to "What is the relationship between phenomenology and prudential value?"

  The reason it feels like a stalemate is that classical hedonism tries to derive an *ought* (this is good) from an *is* (this feels like X). The heterogeneity problem exposes the gap: there is no single *is* that covers all the *oughts*.

  **Recommendation for the Seminar:**
  Tell your students that the heterogeneity problem is the reason why **Sensory Hedonism is largely dead in contemporary philosophy.** Most modern hedonists are either:
  1.  **Attitudinal Hedonists** (Feldman): Solves heterogeneity by changing the definition of pleasure.
  2.  **Primitivists** (Heathwood): Solves it by claiming pleasure is indefinable but directly known via intuition.
  3.  **Functionalists:** Solves it by claiming pleasure is whatever plays the "reward" role in the cognitive architecture.

  If you force the class to choose between these three modern iterations, the "backrub vs. proof" phenomenological stalemate dissolves, because each theory handles the heterogeneity differently. The debate then becomes about which *revision* of hedonism is most plausible, rather than whether the classical definition is phenomenologically accurate.

  **Summary:** The disagreement is theoretical. The anti-hedonist demands a **descriptive unity**; the hedonist needs a **normative unity**. They talk past each other until the hedonist admits they are offering a theory of value, not a theory of psychology. Once that admission is made, the phenomenological objection loses its fatal bite, though it retains its critical force.
