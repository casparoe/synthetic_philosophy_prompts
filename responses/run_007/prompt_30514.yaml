  I hold to red, for one in three is known.
  The others sleep inside the silent stone,
  I take black-yellow, two in three are shown.

  Why trust the dark when I can claim my own?
  I hold to red, for one in three is known.
  The yellow hides its weight beneath the bone.

  I seek a solid ground, a certain tone,
  I take black-yellow, two in three are shown.
  But doubt leaves every certain seed ungrown.

  If black were king, I'd raise it as my own,
  I hold to red, for one in three is known.
  If yellow joins the red, the count unknown.

  I shift away when risks are fully grown,
  I take black-yellow, two in three are shown.
  No map remains for territory sown.

  Two voices speak from out the same bare bone,
  No single sum makes both these paths my own.
  I hold to red, for one in three is known.
  I take black-yellow, two in three are shown.
