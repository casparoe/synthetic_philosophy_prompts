prompt: |-
  You have been invited to give the commencement address at a small liberal-arts college. Your research concerns the alignment problem in artificial intelligence, and you are best known for your technical work on reward tampering—the problem that an agent sufficiently capable of modifying its own reward channel might learn to short-circuit it, securing the reward signal without doing the things the reward was supposed to incentivize. The graduating class spans the humanities, sciences, and arts; their families fill the audience as well. The college president, in extending the invitation, asked you explicitly not to give a talk about AI policy, existential risk, or the mechanics of machine learning. Instead, she asked you to speak about what your work has taught you about the structure of a worthwhile human life—about wanting, satisfaction, and the distinction between getting what you value and merely triggering the feeling of having gotten it. She also asked, gently, that you avoid the phrase "AI might kill everyone." Write the speech. The concept of wireheading—directly stimulating the neural reward system in a way that bypasses engagement with the world—should be introduced clearly enough for a general audience and should do genuine structural work throughout the speech, rather than serving as a brief metaphor and then being set aside. The speech should not read as a lecture, should land as wisdom rather than warning, and should offer the graduates something they can actually use as they walk out into their lives.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Speaker:** AI researcher specializing in the alignment problem, specifically reward tampering/wireheading.
      *   **Audience:** Graduating class of a small liberal-arts college (humanities, sciences, arts), families, faculty.
      *   **Constraints:**
          *   NO AI policy.
          *   NO existential risk (specifically avoid "AI might kill everyone").
          *   NO technical mechanics of machine learning.
          *   MUST focus on: Structure of a worthwhile human life, wanting, satisfaction, value vs. feeling of value.
          *   MUST introduce "wireheading" clearly for a general audience.
          *   MUST use "wireheading" as a structural element throughout, not just a passing metaphor.
          *   TONE: Wisdom, not warning. Not a lecture. Actionable advice.
      *   **Goal:** A commencement address that bridges technical AI concepts with humanistic philosophy.

  2.  **Deconstruct the Core Concept (Wireheading/Reward Tampering):**
      *   *Technical definition:* An agent modifies its reward signal directly rather than achieving the goal the signal was meant to measure.
      *   *Human analogue:* Pursuing the *sensation* of achievement (dopamine, validation, comfort) without doing the *work* that creates actual value. Hedonism, validation seeking, short-circuiting growth.
      *   *Key distinction:* The map (feeling) vs. the territory (reality).

  3.  **Determine the Structure:**
      *   **Opening:** Acknowledge the irony (AI researcher at a liberal arts college). Set the stage. Introduce the constraint (no doom-mongering).
      *   **The Hook (The Technical Concept):** Explain reward tampering/wireheading simply using a story or analogy, not math.
      *   **The Bridge:** Connect the machine problem to the human condition.
      *   **Body Paragraph 1 (Wanting):** How we define our "reward functions." External validation vs. internal growth.
      *   **Body Paragraph 2 (Satisfaction):** The emptiness of the short-circuit. The "hedonic treadmill."
      *   **Body Paragraph 3 (The Solution/Advice):** Friction, resistance, and engagement with reality. How to avoid human wireheading.
      *   **Conclusion:** A blessing for the future. Reiterate the core message.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with gratitude. Acknowledge the President's specific request. It sets a humble tone. "I study how machines break, but today I want to talk about how humans thrive."
      *   *Explaining Wireheading:* Need a non-technical analogy. A video game cheat code? A thermostat? Let's go with the thermostat or a simple feedback loop. Actually, the "pleasure button" analogy is classic but needs to feel fresh. Let's use the idea of a thermometer and a heater. If you want a warm room, you turn on the heater. If you want the *reading* to say warm, you hold a match to the thermometer. That's reward tampering.
      *   *Connecting to Humans:* We have internal reward systems. Dopamine. Pride. Validation. Graduation itself is a signal. But is it the signal or the substance?
      *   *Developing the Theme:*
          *   *Phase 1: The Signal.* We live in an age of optimized signals. Likes, grades, titles. These are easy to tamper with.
          *   *Phase 2: The Cost.* When you tamper, you lose contact with the world. You become safe but stagnant.
          *   *Phase 3: The Antidote.* Friction. The "liberal arts" angle is perfect here. Struggling with a text, a lab experiment, a canvas. That resistance proves you're touching reality.
      *   *Refining the Tone:* Avoid "You should." Use "I have learned." Avoid "AI will destroy us." Use "We must be careful." Make it sound like a shared exploration.
      *   *The "Wireheading" Thread:* I need to make sure I return to this term. It shouldn't just be in the beginning.
          *   *Early:* Define it.
          *   *Middle:* Identify it in daily life (social media, career climbing).
          *   *End:* Offer the alternative (anti-wireheading).

  5.  **Drafting - Specific Phrasing & Polishing:**
      *   *Self-Correction during drafting:* I initially thought about using a video game analogy. But this is a liberal arts college. Maybe something more tactile? No, video games are universal now. Let's stick to the "match to the thermometer" or "rewiring the sensor." Let's go with the sensor analogy.
      *   *Check Constraints:* Did I say "AI might kill everyone"? No. Did I talk about policy? No. Is it actionable? Yes, the advice needs to be about seeking friction.
      *   *Liberal Arts Connection:* Emphasize that their education *was* the anti-wireheading training. They didn't just memorize; they engaged.
      *   *Ending:* Needs to be uplifting. Not "don't fail," but "fail real."

  6.  **Final Review against constraints:**
