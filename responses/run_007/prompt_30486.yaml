answer: |-
  **Q&A Prep: Genuine Moral Dilemmas**
  **Audience:** Kantian Constructivists (majority), 2 Act-Utilitarians, 1 Deontic Logician.
  **Goal:** Defend conflicting ATC obligations + surviving moral remainder.

  **1. The Kantian: "Ought Implies Can"**
  *Objection:* "Kant's principle isn't a slogan; it's a constitutive constraint on practical reason. If you literally cannot do A and B, reason cannot command both. You're describing psychological conflict, not normative reality."
  *Reply:* Distinguish individual possibility from conjunctive impossibility. I can do A, and I can do B, just not both. 'Ought' applies to the individual acts, not the conjunction.
  *Weakest Point:* Kantians deny 'ought' applies to individual acts if the conjunction is impossible; they view reason as unified.

  **2. The Logician: "Deontic Consistency"**
  *Objection:* "In Standard Deontic Logic, $OA \land OB \to O(A \land B)$. If $\neg \Diamond (A \land B)$, you generate a contradiction. Are you rejecting aggregation? If so, how do you avoid triviality?"
  *Reply:* Reject aggregation for conflicting obligations. Logic must model normative reality, not dictate it. We need a non-aggregating deontic logic, not fewer dilemmas.
  *Weakest Point:* Looks ad hoc; requires abandoning standard logical tools they rely on.

  **3. The Utilitarian: "Maximization Resolves It"**
  *Objection:* "One option must produce more utility. That's the obligation. The other is merely suboptimal. Your 'remainder' is just regret over lost utility, not a surviving duty."
  *Reply:* Regret doesn't demand compensation; guilt over violated obligation does. The phenomenology of apology implies a debt, not just a loss of value.
  *Weakest Point:* Hard to prove phenomenological distinction empirically; utilitarians reduce all residues to utility calculations.

  **4. The Constructivist: "Rational Choice"**
  *Objection:* "If both are all-things-considered wrong, rational choice is impossible. You render agency unintelligible. Constructivism requires a single correct answer for reason to function."
  *Reply:* Reason functions by recognizing tragedy, not resolving it. Agency survives even when tainted; rationality isn't always clean.
  *Weakest Point:* Threatens the normative force of 'ought' as action-guiding; makes reason seem defective.

  **5. The Skeptic: "Pro Tanto Reasons"**
  *Objection:* "Why posit conflicting ATC obligations? Isn't this just two strong pro tanto reasons where one outweighs the other? The 'remainder' is the weight of the defeated reason."
  *Reply:* Defeated reasons disappear; obligations leave residues. You don't apologize for failing a defeated reason, only for violating an obligation.
  *Weakest Point:* Some argue we do apologize for overridden reasons (e.g., breaking a promise to save a life), blurring the line.

  **6. [HOPE NOBODY ASKS] The Action-Guidance Killer**
  *Objection:* "If whatever I do is wrong, why do anything? You destroy action-guidance. If 'ought' doesn't pick a winner, it's useless for deliberation."
  *Reply:* **[CONCEDE THIS]** Concede that 'ought' loses its standard action-guiding force in dilemmas, but retains its evaluative force. It tells the agent they are tainted, not what to pick.
  *Weakest Point:* Admitting this undermines the practical utility of your theory; makes 'ought' seem inert.

  **Strategy Note:**
  *   **Concession:** Do not defend that 'ought' remains action-guiding in dilemmas. Concede that in genuine dilemmas, practical reason offers no "correct" choice, only unavoidable wrongness. Pivot to the *post-action* significance (remainder) as the real data point.
  *   **Tone:** Respect the logician's consistency constraint but frame it as a limitation of SDL, not morality. Acknowledge the Kantian desire for consistency but frame tragedy as a feature of the world, not reason.
  *   **Focus:** Hammer the "moral remainder" (apology/compensation). This is your strongest phenomenological evidence against the "defeated reason" model.
