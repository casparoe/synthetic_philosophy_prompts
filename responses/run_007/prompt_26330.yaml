  *   **Probability:** $10^{-2}$ is well above the $10^{-5}$ threshold.
  *   **Payoff:** $10^8$ is well above the $10^7$ cap.
  *   **EV:** $10^6$ (1 million).

  **Verdicts:**
  *   **Rule 1 (Probability Threshold):** The probability is sufficient ($10^{-2} > 10^{-5}$). The payoff is counted. EV (1,000,000) > Sure (1).
      *   **Prediction:** **Endorse the Gamble.**
  *   **Rule 2 (Payoff Cap):** The payoff exceeds the limit ($10^8 > 10^7$). The outcome is treated as impossible or unweighable.
      *   **Prediction:** **Save the 1 Life.**

  If your advisor endorses the gamble in this new test case, it confirms she is tracking probability thresholds (anti-fanaticism via discounting). If she saves the 1 life, it suggests she is tracking payoff magnitudes (anti-fanaticism via capping). Given the literature, the former is significantly more likely.
