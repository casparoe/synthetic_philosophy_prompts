  - **Case A:** Certainly save 1 life vs. a 1% chance of saving 1,000 lives. → She endorses the gamble.
  - **Case B:** Certainly save 1 life vs. a 0.01% (10⁻⁴) chance of saving 1,000,000 lives. → She endorses the gamble.
  - **Case C:** Certainly save 100 lives vs. a 50% chance of saving 300 lives. → She endorses the gamble.
  - **Case D:** Certainly save 1 life vs. a 10⁻¹⁰ chance of saving 10²⁰ lives. → She says you should save the 1 life.
  - **Case E:** Certainly save 1 life vs. a 10⁻⁶ chance of saving 10⁹ lives. → She says you should save the 1 life.

  Now consider this new case, on which she hasn't yet commented:

  - **New case:** Certainly save 1 life vs. a 10⁻⁵ chance of saving 10⁷ lives.

  Please do the following:

  (a) Identify at least two candidate rules that are consistent with all five of her existing verdicts. State each rule precisely.

  (b) For each candidate rule, say what verdict it predicts on the new case.

  (c) Give your best guess about what her verdict will be, and explain which candidate rule strikes you as the most plausible reconstruction of her reasoning — and why the alternatives are less plausible.

  (d) Propose a further case (specifying both the probability and the stakes) that would cleanly discriminate between the candidate rules that your best-guess rule doesn't already rule out. Explain what each rule would say about it.
