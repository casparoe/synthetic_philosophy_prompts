answer: |-
  ### The Constitution Scorecard

  **I. The Cases (Phenomena to Save)**
  *   **The Statue and the Lump (Goliath/Lumpl):** [Fixed] The theory must explain why we intuitively count one object (statue) but acknowledge the matter (clay) persists through shape change.
  *   **The Ship of Theseus:** [Fixed] The theory must handle diachronic identity when parts are gradually replaced versus when they are reassembled.
  *   **Tibbles the Cat:** [Fixed] The theory must address vagueness and survival when parts (tails, cells) are gained or lost.
  *   **The Person and the Body:** [Taste] Some theories must accommodate the intuition that persons have different persistence conditions than their biological organisms (e.g., brain transplants).

  **II. The Distinctions (Concepts to Keep Separate)**
  *   **Constitution vs. Identity:** [Fixed] "Is made of" cannot be trivially reduced to "is" without explaining away modal differences.
  *   **Sortal vs. Non-Sortal Concepts:** [Fixed] The account must explain why kind-terms (statue, lump) dictate persistence conditions while bare descriptions do not.
  *   **Parthood vs. Constitution:** [Fixed] The clay is not merely a *part* of the statue; it is the *whole* material base, requiring a relation distinct from proper parthood.

  **III. The Logical Constraints (Non-Negotiables)**
  *   **Leibniz's Law (Indiscernibility of Identicals):** [Fixed] If $x=y$, $x$ and $y$ must share all properties; this is the engine of the modal argument.
  *   **Necessity of Identity:** [Fixed] If $x=y$, then necessarily $x=y$ (Kripke); this blocks contingent identity solutions.
  *   **Transitivity of Identity:** [Fixed] If $x=y$ and $y=z$, then $x=z$; required to prevent logical fragmentation.

  **IV. The Standing Arguments (Threats to Absorb)**
  *   **The Modal Argument:** [Fixed] The statue could survive squashing; the lump could not; therefore, they differ in properties.
  *   **The Problem of the Many:** [Taste] The theory should ideally avoid proliferating infinite overlapping objects due to vague boundaries.
  *   **The Arbitrariness Intuition:** [Taste] The theory should explain why *this* specific lump constitutes the statue and not a slightly overlapping rival.

  **V. Theoretical Taste (Controversial Commitments)**
  *   **Anti-Coincidence:** [Taste] The claim that two distinct material objects cannot occupy the exact same spatial region at the same time.
  *   **Extensional Mereology:** [Taste] The claim that objects with the same parts at the same time are identical (Uniqueness of Composition).
  *   **Endurantism:** [Taste] The claim that objects are wholly present at each moment, rather than having temporal parts.

  ***

  ### The Analysis

  **The Workhorse Requirement**
  **Leibniz's Law** does the most work. It is the logical lever that converts the intuitive modal difference (statue survives squashing, lump does not) into a metaphysical necessity that the statue and lump are **not identical**. Any view that wants to maintain they *are* identical must either deny the modal intuition (Eliminativism) or restrict Leibniz's Law (Relative Identity), both of which are high-cost moves.

  **The Inconsistency (The Main Thing)**
  Yes, a subset of these requirements cannot be jointly satisfied. This is the **Inconsistent Triad of Material Constitution**:
  1.  **Existence:** The statue and the lump both exist.
  2.  **Distinctness:** The statue and the lump are not identical (entailed by **Leibniz's Law** + **Modal Argument**).
  3.  **Anti-Coincidence:** Two distinct material objects cannot occupy the same place at the same time.

  **You must drop one.**
  *   Drop (1): **Eliminativism** (There are no statues, only lumps).
  *   Drop (2): **Identity Theory** (Statue = Lump, deny modal differences or restrict LL).
  *   Drop (3): **Constitutionalism** (Statue $\neq$ Lump, but they coincide spatially).

  Most literature is just scholars choosing which horn of this triad to impale themselves on while claiming the others are "taste."
