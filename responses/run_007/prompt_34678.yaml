answer: |-
  1. In this framing, scarce resources and technological coefficients map to the constraint set, consumer preferences form the objective function, and prices act as the shadow values or Lagrange multipliers guiding the iterative search for equilibrium.
  2. The mapping breaks down because the optimization model treats preferences and production possibilities as fixed, known data, whereas in reality this information is tacit, dispersed, and discovered only through the competitive process itself.
  3. This analogy quietly imports the assumption of static data from mathematical optimization, ignoring that the economy is a dynamic process where the act of calculation alters the underlying facts faster than any central solver can converge.
  4. Hayek's objection survives because his critique was epistemological rather than arithmetic, arguing that the relevant data does not exist to be computed until agents interact within the institutional framework of private property.
  5. A better analogy is a distributed neural network or evolutionary ecosystem, where coordination emerges from local interactions without any single node possessing or processing the global state.
