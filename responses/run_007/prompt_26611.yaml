      *   *Refinement on Verbal Dispute:* The biggest fight is often "What is Bayesianism?" (Normative ideal vs. Practical guide). I need to capture that in the Disagreements table.
      *   *Refinement on Cruxes:* Make sure the predictions are distinct. If both predict the same outcome, it's not a crux.
