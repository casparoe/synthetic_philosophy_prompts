answer: |-
  # Joint Statement on the Problem of Old Evidence
  **Signed by:** The Logical-Learning Working Group (LLWG) & The Deflationary Bayesian Working Group (DBWG)
  **Date:** October 26, 2023
  **Subject:** Consensus, Dissensus, and Empirical Cruxes regarding Glymour's Problem

  Following a five-day adversarial collaboration, the undersigned parties submit this joint statement. We acknowledge that while significant verbal disputes regarding the definition of "confirmation" remain, a residual substantive disagreement persists concerning the formal modeling of non-omniscient agents and the normative status of synchronic probability assignments.

  ## 1. Points of Consensus
  *We agree on the following formal and substantive claims:*

  1.  **The Formal Block:** In standard subjective Bayesianism, if an agent assigns $P(E) = 1$ at time $t_0$, then for any theory $T$ proposed at $t_1$, $P(T|E) = P(T)$. Standard conditionalization cannot model an increase in belief in $T$ due to $E$ if $E$ is treated as certain.
  2.  **The Phenomenon:** There exist historical cases (e.g., General Relativity and the perihelion of Mercury) where a theory is widely regarded as confirmed by evidence known prior to the theory's formulation. Any adequate epistemology must account for the rationality of this confidence boost.
  3.  **Ahistoricity Principle:** The confirmatory power of evidence $E$ for theory $T$ should not depend *essentially* on the chronological order of discovery. If $E$ supports $T$ when discovered after $T$, it should support $T$ when discovered before $T$, ceteris paribus.
  4.  **Logical Omniscience is an Idealization:** Standard Bayesianism assumes agents know all logical consequences of their beliefs. Both sides agree this is descriptively false for human agents and potentially problematic for normative models of scientific reasoning involving complex derivations.
  5.  **Inadequacy of "Naive" Deflation:** It is insufficient to simply say "assign $P(E) < 1$." A justification is required for why a known fact should be treated as uncertain in the relevant probability space without rendering the probability assignment arbitrary.
  6.  **Inadequacy of "Naive" Logical Learning:** Merely adding a proposition $(T \vdash E)$ to the algebra is not sufficient without constraints on how probability mass is redistributed upon learning that relation.

  ## 2. Table of Disagreements
  *Where we diverge. Each statement is phrased to be acceptable to the signatories of that column.*

  | Topic | Logical-Learning Bayesian (LLB) Position | Deflationary Bayesian (DB) Position |
  | :--- | :--- | :--- |
  | **Source of the Error** | The problem arises from the **assumption of logical omniscience**. Standard Bayesianism forbids learning logical relations, which is the actual cognitive event in POE cases. | The problem arises from **conflating diachronic updating with synchronic support**. Confirmation is a relation between $T$ and $E$ relative to a background $K$, not a historical update rule. |
  | **The Role of $P(E)$** | For known evidence, $P(E)$ **ought to be 1**. The error is not in setting $P(E)=1$, but in failing to allow $P(T \to E)$ to vary. | For confirmation assessments, $P(E)$ **need not be 1**, even if known. We evaluate support relative to a counterfactual state where $E$ is not part of the background $K$. |
  | **Formal Solution** | Enrich the algebra to include **logical propositions** (e.g., $L: T \models E$). Update on $L$, not $E$. $P_{new}(T) = P_{old}(T | L)$. | Retain the standard algebra. Use **counterfactual priors** or **objective Bayesian constraints** to determine $P(T|E \land K)$ where $E \notin K$. |
  | **Normative Status** | Bayesianism is a model of **rational learning**. If it cannot model learning a derivation, it is incomplete and requires structural repair. | Bayesianism is a model of **coherent belief**. It constrains states, not transitions. The "problem" is a category error regarding the function of the probability function. |

  ## 3. Verbal Disputes vs. Substantive Disagreement
  *We flag the following terminological friction but agree it does not exhaust the debate.*

  *   **"Confirmation":** The DB tends to use "confirmation" to mean *synchronic probabilistic support* ($P(T|E) > P(T)$). The LLB tends to use "confirmation" to mean *rational belief revision* ($P_{new}(T) > P_{old}(T)$).
  *   **Resolution:** We agree that even if we standardize on "synchronic support," the LLB insists the probability function *itself* must be capable of representing uncertainty about logical connections, whereas the DB insists the probability function represents uncertainty about the world, and logical connections are handled by shifting the background knowledge set $K$.

  **Residual Substantive Disagreement:** Even granting the synchronic definition, the LLB claims the probability algebra *must* contain logical propositions to capture the agent's state accurately. The DB claims adding logical propositions is redundant if the agent's subjective degrees of belief are properly calibrated against a restricted background $K$. The fight is about **ontology of the probability space**, not just the definition of confirmation.

  ## 4. Cruxes and Pre-Registered Predictions
  *We identify three sub-questions (Cruxes) where resolution would force one side to concede. For each, we propose a concrete case and record our divergent predictions.*

  ### Crux 1: The Tractability of Logical Uncertainty
  **Question:** Can a Bayesian agent model uncertainty about logical implications ($T \vdash E$) without violating the axioms of probability or requiring infinite computational resources?

  *   **Concrete Case:** A mathematician holds a conjecture $C$. She knows data $D$. She does not know if $C \vdash D$. She spends time proving the lemma.
  *   **LLB Prediction:** A formal model that assigns $P(C \to D) < 1$ will successfully track the mathematician's confidence boost in $C$ upon proving the lemma, without needing to lower $P(D)$.
  *   **DB Prediction:** Any model assigning $P(C \to D) < 1$ is either incoherent (violates logical axioms) or implicitly relies on a counterfactual background where $D$ was unknown. The confidence boost is best modeled by comparing $P(C | D \land K)$ vs $P(C | K)$, where $K$ excludes $D$.
  *   **Settlement Condition:** If a coherent, computationally bounded probability space can be constructed where $P(D)=1$ but $P(C \to D)$ updates, LLB wins. If all such models collapse into counterfactual $P(D)<1$ assessments, DB wins.

  ### Crux 2: Constraints on Counterfactual Priors
  **Question:** If we use the DB's counterfactual method (removing $E$ from background knowledge $K$), are there objective constraints on the resulting prior $P(T | K - \{E\})$, or is it arbitrary?

  *   **Concrete Case:** Re-evaluating General Relativity today. We know Mercury's perihelion ($E$). We want to assess confirmation. We must imagine a state where we don't know $E$.
  *   **LLB Prediction:** The counterfactual prior $P(T | K - \{E\})$ is **under-constrained**. Different scientists will imagine different "ignorance states," leading to subjective, non-comparable confirmation values. This makes the DB solution scientifically unrigorous.
  *   **DB Prediction:** The counterfactual prior is **constrained by causal structure**. We remove $E$ but keep the causal laws linking $T$ to $E$. The resulting probability is robust across agents who understand the causal model, making it scientifically rigorous.
  *   **Settlement Condition:** If surveys of experts reconstructing "ignorance states" yield high variance in $P(T)$, LLB wins (arbitrariness charge upheld). If variance is low given shared causal models, DB wins.

  ### Crux 3: The Function of Confirmation in Theory Choice
  **Question:** Is the primary role of confirmation to guide *updating* (LLB) or to rank *explanatory coherence* (DB)?

  *   **Concrete Case:** A computer simulation of two competing theories, $T_1$ and $T_2$. Both entail old evidence $E$. $T_1$ entails $E$ via a simple derivation; $T_2$ entails $E$ via a complex, ad-hoc adjustment.
  *   **LLB Prediction:** The agent should update more on $T_1$ because learning $(T_1 \vdash E)$ is more surprising/informative than learning $(T_2 \vdash E)$. The "logical learning" probability shift will be larger for $T_1$.
  *   **DB Prediction:** The agent should rank $T_1$ higher because the counterfactual prior $P(T_1 | K - \{E\})$ is higher than $P(T_2 | K - \{E\})$ due to simplicity constraints, not because of the learning event itself.
  *   **Settlement Condition:** If the confirmation boost correlates with the *complexity of the derivation* (LLB), the logical structure matters directly. If it correlates with the *prior simplicity of the theory* independent of derivation (DB), the logical relation is secondary to prior weighting.

