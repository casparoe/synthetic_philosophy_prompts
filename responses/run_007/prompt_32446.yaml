answer: |-
  # Unit Handout: Adequacy Conditions for a Theory of Intention
  ## Focus: Kavka's Toxin Puzzle and the Architecture of Practical Rationality

  ### I. The Case Spectrum
  An adequate theory cannot treat the Toxin Puzzle in isolation. It must navigate the following topological map of cases. If a theory solves the basic puzzle but fails the variants, it is ad hoc.

  1.  **The Basic Toxin Case:** Reward ($1M) for *intending* at $t_1$ to drink at $t_2$. Reward received at $t_{1.5}$. Drinking is painful but harmless. No external enforcement.
      *   *Data Point:* Intuition says intention is impossible.
  2.  **The Enforcement Variant:** Same as above, but a third party will shoot you at $t_2$ if you haven't drunk.
      *   *Data Point:* Intention is now possible (and rational).
  3.  **The Precommitment (Ulysses) Variant:** You can bind yourself at $t_1$ (e.g., lock the keys) such that drinking at $t_2$ becomes the path of least resistance or the only option.
      *   *Data Point:* Intention is possible and rational, *but* the mechanism differs from Enforcement.
  4.  **The Belief-Contingent Variant:** Reward is contingent on *believing* at $t_1$ that you will drink, rather than intending.
      *   *Data Point:* Intention might be impossible, but belief is *strictly* impossible (Doxastic Involuntarism). A theory of intention must not collapse into a theory of belief here.
  5.  **The Normative Oath Variant:** The drink is harmless/painless, but you have sworn a sacred oath never to drink it. The reward is offered for intending to break the oath.
      *   *Data Point:* Tests whether the barrier to intention is *prudential* (pain) or *normative* (consistency/oath).

  ---

  ### II. Conceptual Distinctions (Non-Collapse Clause)
  A theory fails if it reduces intention to any of the following. The Toxin Puzzle specifically exploits the gaps between these states.

  | Distinction | Why It Must Hold | What Breaks If Collapsed |
  | :--- | :--- | :--- |
  | **Intending vs. Wanting** | You can intend what you do not want (duty, prudence). In Toxin, you want the money, not the pain. | If Intention = Strongest Desire, you *should* be able to intend (desire for money > pain). This contradicts the core intuition that you can't. |
  | **Intending vs. Predicting** | Intention involves agency; prediction involves observation. | If Intention = Prediction, you simply predict you won't drink (since it's irrational ex post). But this fails to explain why Precommitment *changes* the prediction. |
  | **Intending vs. Being Disposed** | A disposition is a state; intention is a commitment. | If Intention = Disposition (Gauthier), you can cultivate a disposition to drink. This solves Toxin but risks "magical" rationality (see Section IV). |
  | **Intending vs. Hoping** | Hope lacks the conduct-control component. | You can hope to drink (to get the money) without intending. A theory must explain why hope doesn't trigger the reward. |

  ---

  ### III. The Requirements List
  Below are the conditions any theory must satisfy. They are categorized by their status: **Non-Negotiable** (violating these makes the theory empirically or phenomenologically false) or **Camp Prejudice** (theoretical commitments specific to schools of thought).

  #### 1. The Ex Post Rationality Constraint
  *   **Spec:** An agent cannot form an intention to $\phi$ at $t_1$ if they know for certain that at $t_2$, performing $\phi$ will be irrational (i.e., unsupported by reasons available at $t_2$).
  *   **Why it's a requirement:** Intention implies a commitment to act. To commit to an act known to be irrational is a form of practical insanity. This explains the Basic Toxin intuition.
  *   **Status:** **Non-Negotiable** (Folk Psychology & Standard Rationality).
  *   **What breaks if dropped:** The distinction between planning and wishful thinking vanishes. You could intend to jump off a cliff just because you wanted to win a bet on your intention.

  #### 2. The Incentive Sensitivity Constraint
  *   **Spec:** Intentions must be responsive to ex ante incentives. If the reward for intending is high enough, it must be *possible* for some mechanism to capture it (e.g., via Precommitment).
  *   **Why it's a requirement:** Denying this makes strategic rationality (Ulysses pacts, contracts, deterrence) impossible. We *do* successfully precommit.
  *   **Status:** **Non-Negotiable** (Practical Experience).
  *   **What breaks if dropped:** The theory cannot account for the stability of social contracts or personal long-term planning.

  #### 3. The No-Bootstrapping Constraint
  *   **Spec:** The act of intending cannot *itself* generate a new reason to perform the intended action that did not exist prior to the intention.
  *   **Why it's a requirement:** To avoid "magical thinking." If intending created a reason, you could make any irrational act rational simply by intending it. In Toxin, intending does not make the pain worth suffering.
  *   **Status:** **Non-Negotiable** (Decision Theory).
  *   **What breaks if dropped:** Rationality becomes unmoored from value. Any action could be justified by the mere mental act of intending it.

  #### 4. The Belief-Intention Consistency Constraint
  *   **Spec:** One cannot intend to $\phi$ while believing one will not $\phi$. (Stronger: One cannot intend to $\phi$ while believing one *ought not* $\phi$).
  *   **Why it's a requirement:** Moore's Paradox for action ("I intend to drink, but I won't").
  *   **Status:** **Camp Prejudice (Belief-First / Velleman)**.
      *   *Note:* Planning theorists (Bratman) accept a weaker version (intention involves a belief that one *probably* will). Radical Voluntarists reject it entirely.
  *   **What breaks if dropped:** The link between mind and world loosens; intention becomes purely volitional without cognitive anchor.

  #### 5. The Distinctness Constraint
  *   **Spec:** Intention must be a mental state distinct from the conjunction of Belief + Desire.
  *   **Why it's a requirement:** To explain the specific functional role of intention (e.g., screening off further deliberation, coordinating future action).
  *   **Status:** **Camp Prejudice (Planning Theory / Anti-Reductivist)**.
      *   *Note:* Humeans reject this, viewing intention as just a strong desire.
  *   **What breaks if dropped:** Intention loses its specific explanatory power in the philosophy of action.

  #### 6. The Doxastic Voluntarism Limit
  *   **Spec:** A theory of intention must not rely on the ability to directly will beliefs (to solve the Belief-Contingent Variant).
  *   **Why it's a requirement:** We cannot believe at will. If a theory solves Toxin by saying "Just believe you'll drink," it fails the Belief-Contingent Variant.
  *   **Status:** **Non-Negotiable** (Epistemology).
  *   **What breaks if dropped:** The theory conflicts with basic epistemic norms regarding truth and evidence.

  ---

  ### IV. Incompatibilities and Tensions
  This is where theories live or die. The Toxin Puzzle is not just a problem; it is a demonstration of tension between the requirements above.

  #### Tension A: Ex Post Rationality (Req 1) vs. Incentive Sensitivity (Req 2)
  *   **The Conflict:** If you cannot intend to do what is ex post irrational (Req 1), how can you ever capture the Toxin reward? Yet, we know precommitment works (Req 2).
  *   **The Crash:**
      *   **Standard CDT (Causal Decision Theory):** Satisfies Req 1 strictly. **Fails Req 2.** It says you cannot intend in Toxin, but it also struggles to explain why Precommitment is rational if the act itself remains ex post irrational. It often implies precommitment is irrational unless it physically removes the option.
      *   **Constrained Maximization (Gauthier):** Satisfies Req 2. **Fails Req 1 & 3.** It argues you can intend because being the *kind of person* who intends is rational. Critics argue this violates No-Bootstrapping (Req 3) by allowing the disposition to create a reason for the act.

  #### Tension B: Belief-Intention Consistency (Req 4) vs. Incentive Sensitivity (Req 2)
  *   **The Conflict:** If I know I won't drink (because it's painful and the money is already in the bank), I believe I won't drink. If Intention requires Belief (Req 4), I cannot intend. But if the incentive is high enough, surely I *could* intend (Req 2)?
  *   **The Crash:**
      *   **Belief-First Accounts:** Must argue that in Toxin, you literally cannot intend. They risk making agency too fragile.
      *   **Voluntarist Accounts:** Allow you to intend despite belief. They risk making intention indistinguishable from fantasy.

  #### Tension C: Distinctness (Req 5) vs. No-Bootstrapping (Req 3)
  *   **The Conflict:** If Intention is distinct from Desire (Req 5), it has its own normative weight. Does that weight count as a "reason"? If yes, it violates No-Bootstrapping (Req 3). If no, why is it distinct?
  *   **The Crash:**
      *   **Planning Theory (Bratman):** Navigates this by saying intention provides a *framework* for reasoning, not a *reason* itself. This is the narrowest tightrope walk in the field.

  ---

  ### V. The "Killer" Requirement
  If there is one requirement that knocks out the most popular accounts, it is:

  **The Ex Post Rationality Constraint (without external enforcement).**
  *(Requirement #1 above)*

  *   **Who it kills:**
      1.  **Simple Humeanism:** If intention is just desire, and I desire the $1M more than I dislike the pain, I *should* be able to intend. The fact that I intuitively feel I *can't* kills the reduction of intention to desire.
      2.  **Constrained Maximization (Gauthier):** This view argues you *can* intend in the Toxin case because it is rational to be a trustee. The Ex Post Rationality Constraint says this is impossible because at the moment of drinking, the reason (money) is gone. Accepting Gauthier requires rejecting the intuition that you can't intend to do what you know you won't do.
      3.  **Simple Voluntarism:** If will is free, why can't I just intend? The constraint shows the will is bound by perceived rationality.

  *   **Why it's the Killer:** It preserves the core phenomenological data (I can't intend the irrational) but makes the explanation of Precommitment (Req 2) extremely difficult. Most theories sacrifice either the intuition (saying you *can* intend) or the possibility of strategy (saying precommitment is magic).

  ---

  ### VI. Theory Scorecard

  | Theory | Basic Toxin (Can't Intend) | Precommitment (Can Intend) | No-Bootstrapping | Distinctness | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Causal Decision Theory** | **Pass** (Correctly says No) | **Fail** (Struggles to justify) | **Pass** | N/A (Neutral) | **Too Conservative.** Denies strategic rationality. |
  | **Gauthier (Constrained Max)** | **Fail** (Says Yes) | **Pass** | **Fail** (Bootstraps reasons) | **Pass** | **Revisionist.** Solves puzzle by changing intuition. |
  | **Bratman (Planning)** | **Pass** (Correctly says No) | **Pass** (Via stability norms) | **Pass** (Carefully) | **Pass** | **Current Leader.** But relies on complex norm architecture. |
  | **Humean (Desire-Based)** | **Fail** (Says Yes) | **Pass** | **Pass** | **Fail** (Reduces intention) | **Eliminated.** Collapses intention into desire. |
  | **Velleman (Belief-Based)** | **Pass** (Correctly says No) | **Mixed** (Depends on self-knowledge) | **Pass** | **Fail** (Reduces intention) | **Eliminated.** Collapses intention into prediction. |
  | **Voluntarist** | **Fail** (Says Yes) | **Pass** | **Fail** (Allows magic) | **Pass** | **Eliminated.** Violates rationality constraints. |

  ### VII. Instruction for Students
  When evaluating a theory in your essays, do not ask "Does it solve the Toxin Puzzle?" Ask: **"Which requirement did it sacrifice to solve the Toxin Puzzle?"**
  *   If it says you *can* intend, it likely violates **Ex Post Rationality**.
  *   If it says you *can't* intend, it likely threatens **Incentive Sensitivity** (Precommitment).
  *   If it distinguishes the two, check if it violates **No-Bootstrapping**.

  The goal of this unit is not to find the theory that gets everything right (there may be none), but to identify which cost is philosophically acceptable.
