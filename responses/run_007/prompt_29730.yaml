prompt: |-
  I work on a small investment team at a family office — three of us, and I'm the one who has to sign off on most trades. Several times a week somebody brings us a trade: a broker pitching a block, a founder who wants to sell us secondary shares, a counterparty who suddenly wants to put on a swap or buy back a bond we hold. I've read enough rationalist-adjacent economics to have internalized the no-trade theorem and the Aumann agreeing-to-disagree result, and I basically buy the Groucho Marx point that if a sophisticated counterparty is eager to trade with me, that eagerness is itself evidence. But I don't have a procedure for turning that into an actual decision. Half the time I either refuse everything out of paranoia or talk myself into the trade with a story about why this time its different. The individual trades won't blow up the firm, but being wrong a few times a month will show up in the returns, and my boss will ask me to justify the decision in two sentences.

  So: turn the no-trade theorem and the market-epistemology stuff (prices aggregating information, adverse selection, the paradox that if prices already reflected everything nobody would be paid to gather information) into a checklist I can actually run in about twenty minutes before I decide whether to take the other side. I want the questions in the order I should ask them, what counts as a good-enough answer to each, where the procedure says stop with a no, and where it hands the decision to a person because it's a judgment call rather than a fact. I get that the theorem assumes common priors, so build in a step for 'is this trade just a difference in priors' — when is that a legitimate reason to trade and when is it exactly the moment I should walk away? Also tell me what to do when I cant get a good-enough answer in the time I have: default no, or escalate? Then run the procedure on two or three cases: a block of a liquid stock offered at a small discount, a founder of a company we already own who wants to sell us more of her own shares in a secondary, and one case where you expect the procedure to tell me not to do a trade I'd otherwise be excited about. Be honest about what the procedure can't catch — like when the counterparty isn't informed, just wrong — and which steps are really judgment calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested trading checklist and analysis:

  1.  **Deconstruct the Request:**
      *   **User:** Investment professional at a small family office (3 people), final sign-off on trades.
      *   **Problem:** Struggles with the "No-Trade Theorem" / Groucho Marx paradox (if someone wants to trade with me, they probably know something I don't). Oscillates between paranoia and overconfidence. Needs a concrete procedure/checklist.
      *   **Constraints:** ~20 minutes to run, justify decision in two sentences to boss, small team (no huge compliance dept).
      *   **Requirements:**
          *   Checklist based on market epistemology (No-Trade Theorem, Aumann, information aggregation).
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Stop/No-Go triggers.
          *   Judgment call vs. Fact markers.
          *   Handling "difference in priors."
          *   Default action when info is missing (No or Escalate?).
          *   Run the procedure on 3 specific cases (Liquid block, Founder secondary, "Exciting" trade that fails).
          *   Honesty about limitations (uninformed but wrong counterparties, judgment calls disguised as procedure).

  2.  **Theoretical Foundation (The "Why"):**
      *   *No-Trade Theorem (Milgrom & Stokey):* If markets are efficient and agents are rational, speculative trade shouldn't happen because the offer itself reveals information.
      *   *Groucho Marx:* "I don't care to belong to any club that will have me as a member." (Adverse Selection).
      *   *Grossman-Stiglitz Paradox:* If prices are perfectly informative, no one gathers info. So prices *aren't* perfectly informative. There *must* be noise traders or liquidity needs to justify informed trading.
      *   *Key Insight:* To trade, you must identify *why* the counterparty is trading that isn't based on superior information about alpha. Usually: Liquidity need, Regulatory constraint, Hedging, or Behavioral bias (not rational inference).

  3.  **Drafting the Checklist (The "How"):**
      *   *Time Limit:* 20 minutes means max 5-7 questions. Deep dive is impossible.
      *   *Flow:*
          1.  Liquidity/Motive (The most common valid reason).
          2.  Information Asymmetry (Do they know more?).
          3.  Price vs. Value (Is the discount big enough to cover the risk?).
          4.  Priors (Why do we disagree?).
          5.  The "Two Sentence" Test (Can I articulate the edge?).
      *   *Defaults:* If info is missing, default to **No**. Preservation of capital > FOMO.
      *   *Escalation:* Since it's a 3-person team, "Escalate" means "Discuss with the other two." But the prompt implies *I* decide. So default to No if I can't verify.

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1: The Counterparty's Constraint.* Why *must* they sell/buy now? (Liquidity, Fund lifecycle, Regulation).
      *   *Step 2: The Information Gap.* Do they have operational info I don't? (Insider access).
      *   *Step 3: The Price Buffer.* Is the discount large enough to absorb the "lemon" risk? (Margin of Safety).
      *   *Step 4: The Prior Disagreement.* Is this a model difference or an info difference? (Legitimate vs. Suspicious).
      *   *Step 5: The Reversal Test.* If I held this asset, would I buy more at this price? (Consistency).

  5.  **Developing the Cases:**
      *   *Case 1: Liquid Stock Block.* High info efficiency. Discount must be purely liquidity-driven.
      *   *Case 2: Founder Secondary.* High info asymmetry. Insider selling is a huge red flag unless explained (diversification, tax, divorce).
      *   *Case 3: The "Exciting" Trade.* Maybe a complex derivative or a distressed bond where the story is too good. The checklist should catch the "too good to be true" aspect (e.g., counterparty motive is vague).

  6.  **Addressing Specific Prompt Requirements:**
      *   *Difference in Priors:* Need a specific section on when this is okay (e.g., different time horizons, different utility functions) vs. when it's dangerous (different info sets).
      *   *Missing Info:* Default No.
      *   *Limitations:* Acknowledge that sometimes the counterparty is just dumb (noise trader), but you can't rely on that. Acknowledge that the checklist is a heuristic, not a proof.

  7.  **Writing the Response (Tone and Structure):**
      *   *Tone:* Professional, direct, slightly quantitative but pragmatic. Acknowledge the intellectual framework (Rationalist/Econ) but ground it in practice.
      *   *Structure:*
          1.  Introduction (Validating the premise).
          2.  The 20-Minute "Adverse Selection Filter" (The Checklist).
          3.  Decision Rules (Stop/Go/Escalate).
          4.  Case Studies (Applying the filter).
          5.  Limitations & Meta-Commentary (What the checklist misses).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is 20 minutes realistic for due diligence?
      *   *Fix:* Clarify this is *pre-trade* epistemological check, not full fundamental DD. Fundamental DD happens before this stage. This is the "Should we take the other side?" check.
      *   *Critique:* The "Two Sentence" justification needs to be part of the output.
      *   *Fix:* Make the final step of the checklist drafting that sentence. If you can't draft it, you can't trade.
      *   *Critique:* Priors are hard to quantify.
      *   *Fix:* Frame it as "Model vs. Info." If we disagree on the *model* (e.g., DCF assumptions), that's okay. If we disagree on *facts* (e.g., next quarter's revenue), and they know the facts, walk away.

  9.  **Final Polish:** Check against the "No-Trade Theorem" logic. Ensure the distinction between liquidity-motivated trade and information-motivated trade is clear. (This is the core resolution to the paradox).

  *(Self-Correction on the "Escalate" point)*: The user says "I'm the one who has to sign off." Escalating to the boss might look like indecision. Better to default to "No" if the checklist fails, as "No" is the safe fiduciary default. I will recommend "Default No" for missing info.

  10. **Final Review against constraints:** 20 mins? Yes. Checklist order? Yes. Stop/Go criteria? Yes. Priors handled? Yes. 3 Cases? Yes. Limitations? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a classic application of market microstructure theory to private decision-making. The No-Trade Theorem holds that if markets are efficient and agents are rational, trade only occurs due to exogenous liquidity shocks or differences in risk tolerance/utility, not differences in information. If you suspect the trade is information-driven, you are the liquidity, not the alpha.

  Here is a 20-minute **Adverse Selection Filter** designed to operationalize that theorem. It assumes you have already done the fundamental analysis (you know what the asset is worth); this checklist determines whether *this specific opportunity* is a trap.

  ### The 20-Minute Adverse Selection Filter

  **Time Allocation:** 3 minutes per question. 5 minutes to draft the justification.
  **Default Rule:** If you cannot answer a question satisfactorily within the time limit, the decision is **NO**. Do not escalate; escalation signals to your boss that you haven't done the work. A "No" is a fiduciary success (capital preservation); a "Yes" requires proof.

  #### Step 1: The Liquidity Constraint (The "Why Now?")
  **Question:** What exogenous constraint forces this counterparty to trade *now* rather than *later*?
  *   **Valid Answers:** Fund lifecycle (closing a vintage), regulatory capital requirement, margin call, rebalancing mandate, personal liquidity event (tax/divorce known publicly), index inclusion/exclusion.
  *   **Invalid Answers:** "They think it's fully valued," "They want to rotate into cash," "Market conditions are uncertain." (These are views, not constraints).
  *   **Stop Condition:** If the motive is purely discretionary based on market view, **STOP**. This is information-driven trade. You are the exit liquidity.

  #### Step 2: The Information Asymmetry Audit
  **Question:** Does the counterparty have access to material non-public information (MNPI) or operational data that I fundamentally cannot verify in 20 minutes?
  *   **Valid Answers:** No. Or, "Yes, but the trade structure isolates us from that risk (e.g., we are buying senior debt, they are selling equity)."
  *   **Invalid Answers:** "They are the founder," "They are the underwriter," "They say there's nothing bad."
  *   **Stop Condition:** If they are an insider (founder, management) selling equity, and you cannot verify the *liquidity constraint* from Step 1 with external evidence (e.g., a known secondary program), **STOP**. Insiders only sell stock for two reasons: diversification (valid) or they know the stock is overvalued (lemon). You cannot distinguish these quickly.

  #### Step 3: The Compensation for Ignorance (The Discount)
  **Question:** Is the price discount large enough to compensate me for the probability that the counterparty is informed and I am not?
  *   **Valid Answers:** The discount exceeds the historical volatility + a "lemon premium" (e.g., >2 standard deviations, or >15% below intrinsic value).
  *   **Invalid Answers:** "It's fair value," "It's a small discount," "It's priced at the market."
  *   **Stop Condition:** If the price is "fair" or only slightly discounted, **STOP**. Efficient markets do not pay you to take the other side of a trade without a margin of safety for adverse selection. You need to be paid to be the market maker.

  #### Step 4: The Priors Check (Model vs. Info)
  **Question:** Is our disagreement based on a difference in *models/priors* or a difference in *data*?
  *   **Valid Answers (Trade Allowed):** Difference in models. (e.g., "They have a 2-year horizon; I have a 10-year horizon." OR "They use a multiples exit; I use a DCF.")
  *   **Invalid Answers (Trade Forbidden):** Difference in data. (e.g., "They know the Q3 numbers; I am estimating them.")
  *   **Judgment Call:** This is the hardest step. If the counterparty claims they are selling because of "macro headwinds" (a model/view) but they have access to internal data, you must assume it's data.
  *   **Rule:** If the counterparty is an operational insider, assume any "view" is actually "data." If they are a financial intermediary (broker), assume it's a "view."

  #### Step 5: The Reversal Test (Consistency)
  **Question:** If I already held this position, would I buy *more* at this price right now, knowing someone is trying to dump it?
  *   **Valid Answers:** "Yes, I would double down."
  *   **Invalid Answers:** "I would hold, but taking new risk is different."
  *   **Stop Condition:** If you wouldn't add to the position, do not initiate it. This filters out "story" investing where you like the asset but not at the price given the flow.

  #### Step 6: The Two-Sentence Justification
  **Task:** Write the justification for your boss.
  *   **Format:** "We are taking the other side because [Counterparty] is forced to sell due to [Constraint], not information. The [X]% discount compensates for the risk that they know something we don't."
  *   **Stop Condition:** If you cannot write this sentence without using words like "think," "believe," "opportunity," or "story," **STOP**. You are speculating, not providing liquidity.

  ---

  ### Case Studies

  #### Case 1: Liquid Stock Block (Small Discount)
  *   **Scenario:** A broker offers you a 5% block of a large-cap tech stock at a 1.5% discount to market. The seller is a hedge fund.
  *   **Run the Filter:**
      1.  *Liquidity:* Broker says "Fund is rebalancing." (Weak. Rebalancing is discretionary).
      2.  *Info:* No MNPI likely (large cap).
      3.  *Discount:* 1.5% is within bid-ask spread noise. Not enough to cover "lemon" risk.
      4.  *Priors:* Irrelevant.
      5.  *Reversal:* Would you buy more? Maybe, but not because of this flow.
      6.  *Justification:* "We are buying because a fund is rebalancing." (Fails the constraint test).
  *   **Decision:** **NO.**
  *   **Why:** The discount is too small to compensate for the possibility that the fund knows something about an upcoming earnings miss or regulatory issue. In liquid markets, a 1.5% discount is not a liquidity premium; it's a trap. You are picking up pennies in front of a steamroller.

  #### Case 2: Founder Secondary (Private Company)
  *   **Scenario:** You own 10% of a Series C startup. The Founder wants to sell you 2% of her personal holdings at the last round's valuation.
  *   **Run the Filter:**
      1.  *Liquidity:* Founder says "I want to buy a house/diversify." (Hard to verify).
      2.  *Info:* **CRITICAL FAIL.** Founder has maximum information asymmetry.
      3.  *Discount:* None (at last round valuation).
      4.  *Priors:* You disagree on the exit timeline? She knows the real timeline.
      5.  *Reversal:* If you wouldn't write a new primary check at this valuation, why buy secondary?
      6.  *Justification:* "Founder wants liquidity." (Fails the Info Audit).
  *   **Decision:** **NO.**
  *   **Why:** This is the quintessential Groucho Marx trade. A founder selling shares is the strongest possible signal of overvaluation or stalled momentum. Unless the sale is part of a structured, board-approved tender offer where *all* shareholders can sell (pro-rata), a bespoke secondary from a founder is toxic. The lack of discount confirms she doesn't *need* to sell; she *chooses* to.

  #### Case 3: The "Exciting" Distressed Bond
  *   **Scenario:** A counterparty wants to sell you a corporate bond at 60 cents on the dollar. They say "We can't hold distressed assets in this mandate." You think the company will survive and the bond goes to par. You are excited about the 60% upside.
  *   **Run the Filter:**
      1.  *Liquidity:* "Mandate restriction." (Plausible. Many funds have hard constraints).
      2.  *Info:* **STOP.** The counterparty is likely the lead lender or a sophisticated distressed fund. If they are dumping at 60, they likely know recovery value is 40.
      3.  *Discount:* Price is 60. You think value is 100. Is 40 points enough buffer? Maybe.
      4.  *Priors:* You think they are selling due to mandate (Model). They might be selling due to recovery analysis (Data).
      5.  *Reversal:* Would you buy more if you heard another fund was dumping it?
      6.  *Justification:* "They are forced sellers due to mandate."
  *   **Decision:** **NO.** (Despite the excitement).
  *   **Why:** This is where the procedure saves you. In distressed situations, "mandate constraints" are the most common lie told to hide "we did the work and this is going to zero." Unless you can verify the mandate restriction (e.g., you know the fund's docs) or the price is 20 cents (deep enough to absorb total loss), you are assuming you are smarter than a distressed specialist. The No-Trade Theorem says you probably aren't. The excitement is the danger signal.

  ---

  ### Limitations & Meta-Commentary

  **1. What the Procedure Can't Catch: The "Noise" Trader**
  The No-Trade Theorem assumes rational counterparties. Sometimes, the person selling you the block is just wrong, emotional, or incompetent. They aren't informed; they are noisy.
  *   *The Trap:* You cannot *know* they are noisy until after the trade.
  *   *The Fix:* The checklist assumes they are informed. If they turn out to be noisy, that's alpha luck, not process. Do not optimize your process for catching falling knives from idiots; optimize for avoiding swords from experts.

  **2. Judgment Calls Dressed as Procedure**
  *   **Step 4 (Priors)** is the weakest link. Distinguishing between a "difference in model" and a "difference in data" is often impossible.
      *   *Heuristic:* If the counterparty makes money by knowing things (hedge fund, insider), assume it's data. If they make money by moving capital (pension fund, endowment), assume it's model/constraint.
  *   **Step 3 (Discount)** requires you to know intrinsic value. If your valuation is wrong, the "margin of safety" is an illusion. The checklist protects you from *informational* disadvantage, not *analytical* incompetence.

  **3. The "Default No" Friction**
  Your boss might ask, "Why did we pass on X? It went up 20%."
  *   **Your Answer:** "The counterparty motive was unverified. We do not pay for the option to be the informed trader's exit liquidity."
  *   If you follow this checklist, you will trade less. Your returns will be less volatile. You will miss some winners. You will avoid catastrophic adverse selection. In a family office, survival is the primary constraint.

  **4. When to Escalate**
  I advised "Default No" earlier, but there is one exception: **Step 1 (Liquidity Constraint).**
  If the trade is size-significant (e.g., >5% of AUM) and the liquidity story is *plausible* but unverified (e.g., "Rumor is the fund is blowing up"), do not decide alone. Escalate to the other two team members to see if they have intel. If the team can't verify the constraint in 24 hours, the answer remains No.

  ### Summary for your Boss (The Two Sentences)
  When you sign off on a trade, attach this note:
  > "We are executing this trade because the counterparty is constrained by [Verified Liquidity Need], not information advantage. The [X]% discount provides sufficient margin of safety should our information set be inferior to theirs."

  If you can't write that, don't sign.
