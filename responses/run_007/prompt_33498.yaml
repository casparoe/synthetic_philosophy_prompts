answer: |-
  You are grappling with the core of G.E. Moore's *Principia Ethica*, specifically his doctrine of **Organic Unities** and his often-overlooked emphasis on **Truth** as a component of intrinsic value.

  Your intuitions are remarkably Moorean. In fact, they are so aligned that you are likely not just "smuggling" his theory, but rather recognizing that his theory was constructed to codify exactly this cluster of intuitions (specifically against Hedonism and simple Realism).

  Here is the principle that unifies your verdicts, an analysis of whether you need to drop any of them, and a Moorean resolution to your "stumper" case.

  ### 1. The Unifying Principle: Truth-Conditioned Organic Unities

  The principle that gets all your cases (or close to all) is this:

  > **Intrinsic value resides in complex wholes (organic unities) composed of a conscious attitude directed toward an object. The value of the whole is maximized when the attitude is appropriate (e.g., love for virtue, not humiliation) and the object is real (true).**

  Moore argues that value is not additive. You cannot simply sum the value of "pleasure" + "beauty." Instead, the *consciousness of beauty* is a distinct whole that is vastly more valuable than the sum of its parts. Crucially, Moore adds a cognitive condition: **Truth matters.** A conscious state directed at a false object is intrinsically less valuable than the same conscious state directed at a real object.

  Here is how your cases map onto this principle:

  *   **The Coastline:**
      *   *Unseen:* Has value because Beauty is an intrinsic good (Object alone).
      *   *Seen:* Has vastly more value because Consciousness + Real Object > Object alone (Organic Unity).
      *   *Hallucinated:* Has less value than *Seen* because the Object is not real. The "Truth Condition" is failed.
  *   **True Friendship:**
      *   Love/Admiration (Attitude) + Real Virtues (Real Object) = High Value Organic Unity.
  *   **False Friendship:**
      *   Love/Admiration (Attitude) + Non-existent Virtues (False Object) = Low Value. The attitude is "misdirected." The warmth is real, but the cognitive element is false, degrading the whole.
  *   **Schadenfreude:**
      *   Pleasure (Attitude) + Humiliation/Pain (Evil Object) = Negative Value. The attitude is *inappropriate* to the object.
  *   **The Play (Copy vs. Original):**
      *   This is the litmus test. If you were a Hedonist, you would say the value is identical because the enjoyment is identical.
      *   Your verdict (Copy < Original) aligns with Moore. The "Original" carries historical truth and intentional reality that the Copy lacks. Enjoying the Copy while believing it is the Original involves a **false belief**. For Moore, a whole containing false belief is less valuable than a whole containing true belief, even if the emotional tone is identical.

  ### 2. Do You Have to Drop Any Verdicts?

  **No.** Your verdicts are internally consistent within a Moorean framework. However, holding this view forces you to accept a specific metaphysical commitment that many find counter-intuitive: **Epistemic Realism about Value.**

  You are committed to the view that facts *outside* the phenomenological experience (i.e., whether the coastline is real, whether the virtues exist, whether the play is a copy) alter the *intrinsic* value of the experience.

  *   **The Tension Point:** The only potential friction is between the **Unseen Coastline** and **The Play**.
      *   In the Coastline case, you grant value to the *object* independent of consciousness.
      *   In the Play case, you grant disvalue to the *experience* based on the history of the object, even if the sensory properties are identical.
      *   **Resolution:** This is not a contradiction, but it requires you to accept that "Value" is sensitive to **historical/relational properties**, not just intrinsic sensory properties. If you are comfortable saying that the *provenance* of an object is part of its "reality," your verdicts stand. If you think only the immediate sensory data matters, you would have to drop the Play verdict (and side with the Hedonist). Given your prompt, you seem willing to accept the Moorean view that truth/provenance matters.

  ### 3. The Stumper: The Relationship Based on a False Origin

  **The Case:** Two people love each other; the virtues they love are real; but the relationship rests on a false belief about *how they met* (e.g., they think they met by fate, but it was engineered; or they think they met in Paris, but it was London).

  **The Moorean Verdict:**
  This relationship is **less valuable than a counterpart with a true origin story, but still a significant good.**

  Here is the breakdown:

  1.  **It is not "False Friendship" (Case 3):** In Case 3, the *object of admiration* (the virtues) was fake. Here, the *object of love* (the person and their character) is real. The core organic unity (Love + Real Person) is intact.
  2.  **It is not "The Play" (Case 5) exactly:** In the Play case, the aesthetic object itself was a copy. Here, the *relationship* is real, but the *narrative context* is false.
  3.  **The Truth Condition:** Moore argues that for the *highest* goods, truth is a necessary constituent. He writes in *Principia Ethica* that a world where everyone is happy because they believe false things is less valuable than a world where they are happy because of true things.

  **The Diagnosis:**
  The false belief introduces an element of **unreality** into the complex whole.
  *   If the belief is **incidental** (e.g., "We met at the coffee shop" vs. "We met at the bakery"), the diminution of value is negligible. It is a trivial falsehood.
  *   If the belief is **constitutive** (e.g., "We are soulmates destined by the stars" vs. "We were introduced by a dating algorithm"), the diminution is greater. Why? Because the *meaning* they attach to the relationship relies on a falsehood.

  **Conclusion:**
  You do not have to declare the relationship worthless (like the False Friendship). You must judge it as **imperfectly good.** It suffers from "epistemic impurity."

  If you discovered the truth, would the love vanish?
  *   **If Yes:** Then the love was actually directed at the *story*, not the person. This collapses into Case 3 (False Friendship).
  *   **If No:** Then the love is directed at the person. The false belief is a parasitic element that slightly lowers the total value of the whole (because it contains falsehood), but does not negate the real good (the love of real virtues).

  **Summary Advice:**
  Your intuitions are robustly Moorean. You are not smuggling the theory; you are recognizing that Moore successfully articulated the structure of your own value judgments. The principle you are looking for is that **value requires an appropriate fit between mind and reality.** Where reality is absent (hallucination, fake virtues, copies, lies), value leaks away, even if the feeling remains.
