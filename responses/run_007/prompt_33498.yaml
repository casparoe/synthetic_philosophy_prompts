      *   *The Play:* Moore discusses the "sham" vs. "real." He argues that if you believe a real thing is a sham, you lose value. If you believe a sham is real, do you lose value? Moore suggests that the *truth* of the object matters. If the object is a copy, the aesthetic properties might be identical, but the historical/intentional properties differ. The user's intuition that it's less valuable fits Moore's emphasis on truth.
