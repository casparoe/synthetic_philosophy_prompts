      *   *Key Philosophers:* Derek Parfit (Reasons and Persons), Rebecca Dresser (critique of advance directives), Ronald Dworkin (integrity vs. experiential interests), Jeff McMahan, Marya Schechtman.
      *   *Core Concepts:* Personal Identity (Psychological Continuity vs. Biological Continuity), Autonomy (Critical Interests vs. Experiential Interests), The "Then Self" vs. The "Now Self."

  3.  **Deconstruct the Tensions:**
      *   **Tension 1: Identity.** Is the 62-year-old mom (writing the directive) the *same person* as the 74-year-old mom (in the bed)?
          *   If yes (Lockean psychological continuity is mostly intact, or biological view), the directive holds weight.
          *   If no (Parfitian reductionism, or significant psychological break), the directive might be a command from a stranger.
      *   **Tension 2: Interests.**
          *   *Critical Interests (Dworkin):* Values, life narrative, integrity. (The directive protects this).
          *   *Experiential Interests:* Moment-to-moment pleasure/pain. (The current self cares about this).
      *   **Tension 3: Authority.** Why should the past self rule the future self? Is it like a contract? A will? Or is it a protective measure for a vulnerable future self?

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. Validate the paralysis. Set the philosophical stage without being overly academic. Establish that there is no "easy" answer because the question cuts to the core of what a person *is*.

      *   **Section 1: The Metaphysics of the Self (Who is she?):**
