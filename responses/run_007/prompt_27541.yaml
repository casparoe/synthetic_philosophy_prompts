      *   **Core Question:** When the past self (directive) and present self (current expression) conflict, who gets authority? What does this imply about personal identity?
      *   **Key Details:** Mom (74), moderate dementia (recognizes family sometimes, enjoys life), advance directive (12 years ago, post-grandmother's decline, refuses life-extending treatment if severe dementia), current situation (kidney infection, needs antibiotics to live, casually expressed desire to live). Siblings split (Brother: Directive is sacred; Sister: Present self is happy/wants to live).

  2.  **Initial Philosophical Mapping:**
