          *   Apply it: Does dementia break the chain? Moderate dementia suggests *some* break, but not total. She still recognizes grandkids.
          *   Introduce the "Narrative Self" (Schechtman). The 62-year-old was writing a chapter for the 74-year-old.
          *   *The Philosophical Pivot:* If we say they are different people, we risk devaluing the elderly/disabled. If we say they are the same, we risk ignoring current suffering/joy.

      *   **Section 2: The Nature of Autonomy (Which wish counts?):**
          *   Distinguish between *Precedent Autonomy* (Past) and *Current Autonomy* (Present).
          *   Bring in Ronald Dworkin's distinction: *Critical Interests* (what makes a life good overall) vs. *Experiential Interests* (what feels good now).
          *   The Brother's view aligns with Critical Interests/Integrity.
          *   The Sister's view aligns with Experiential Interests/Current Welfare.
          *   *The Tension:* Dworkin argues Critical Interests usually survive incompetence. But Dresser argues you can't sacrifice a happy conscious being for the values of a "ghost."

      *   **Section 3: The Authority of the Past (Why listen to the ghost?):**
          *   Why do we honor wills? Because property rights extend past death. Does *bodily* rights extend past "psychological death"?
          *   The "Ulysses Contract" analogy. She tied herself to the mast.
          *   Counter-argument: Ulysses wanted to hear the song but not act. Did Mom want to live but not *be* demented? Or did she not want to live *at all* if demented? The nuance matters.

      *   **Section 4: Working Through the Specific Case (Application):**
