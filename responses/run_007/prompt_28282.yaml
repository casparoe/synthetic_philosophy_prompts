  **3. Cruxes and Test Cases**
  **Crux A: The Constitutive Role of Capacity**
  *Case:* The Injured Pianist. A virtuoso suffers permanent motor paralysis but retains theoretical understanding.
  *Question:* Is capacity constitutive of the knowledge itself?
  *Prediction (Int):* They retain know-how (propositional knowledge remains intact despite motor loss).
  *Prediction (Anti):* They lose know-how (capacity is constitutive; without ability, there is no knowledge).

  **Crux B: The Scope of the Propositional**
