  *Question:* Can know-how exist without linguistic capacity?
  *Prediction (Int):* Attributing know-how is metaphorical unless they grasp propositions.
  *Prediction (Anti):* Animals genuinely possess know-how via capacity alone.

  **4. Assessment of Verbal Disputes**
  We conclude that the disagreement regarding inarticulate skill is largely verbal. It hinges on whether "proposition" encompasses non-linguistic practical modes of presentation. If the Intellectualist accepts this broad definition, the Anti-Intellectualist's objection regarding inarticulacy loses force. However, the disagreement regarding the Injured Pianist remains substantive: it concerns whether knowledge is essentially tied to ability or merely correlated. The regress argument also remains a substantive logical challenge for the Intellectualist regarding the necessity of conscious contemplation during action.
