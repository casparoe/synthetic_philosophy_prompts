answer: |-
  ### Teaching Plan: The Modal Cosmological Argument (90 Minutes)

  #### 1. Order of Ideas and Dependencies
  You must introduce the concepts in this specific sequence because each step resolves a confusion that would otherwise block the next.

  1.  **Contingency (Things that might not have existed):**
      *   *Why first:* You must start with shared experience. Everyone understands that they, their chairs, and the building could have failed to exist. This establishes the data set for the argument.
      *   *Dependency:* Nothing else works if participants don't agree that existence is not automatic for ordinary things.
  2.  **Ontological Dependence vs. Temporal Cause:**
      *   *Why second:* You must distinguish *why* something exists now from *how* it started. If you skip this, the group will default to the "Beginning of the Universe" (Kalam) argument.
      *   *Dependency:* You cannot explain why an infinite past doesn't solve the problem until you establish that the problem is about *sustenance*, not *history*.
  3.  **The Insufficiency of an Infinite Series:**
      *   *Why third:* You must show why stacking contingent things together doesn't create a necessary thing.
      *   *Dependency:* This only makes sense once they understand ontological dependence. If they think this is about time, an infinite past *does* solve the problem. If it's about dependence, an infinite chain of dependent things is still dependent.
  4.  **Necessity (Existing by Own Nature):**
      *   *Why fourth:* This is the conclusion, not the starting point. It is the only concept that resolves the insufficiency of the series.
      *   *Dependency:* "Necessary" is meaningless unless they first feel the lack of explanation in "Contingent."

  #### 2. The Concrete Image: The Suspended Chandelier
  Do not use dominoes, train cars, or a chain of parents/children. These imply time (one falls after the other, one is born after the other).

  *   **The Image:** A heavy chandelier hanging from a ceiling by a chain of links.
  *   **What it must have:** It must illustrate **simultaneous support**. Gravity pulls on every link *now*. Link B holds Link C *now*, but Link A holds Link B *now*.
  *   **What it must not suggest:** It must not suggest a sequence of events. The chain is not falling; it is hanging.
  *   **Why dominoes are wrong:** Dominoes illustrate temporal causation (A hits B, then B hits C). This argument is about ontological grounding (A holds B up *while* B holds C up). If you use dominoes, the group will ask, "What started the first domino?" (Kalam). If you use the chandelier, the question is, "What holds the whole chain up?" (Modal).
  *   **How to use it:**
      *   **Contingent:** Each link is hollow; it has no power to hold itself up. It borrows support from the link above.
      *   **The Series:** Even if the chain is infinite (goes up forever), if every link is hollow and borrowing support, nothing is actually being held up.
      *   **Necessary:** The ceiling hook. It holds the chain but is not held by the chain. It supports by its own nature (it is fixed in the ceiling).

  #### 3. Map of Misconceptions and Intervention Points
  Here is where specific errors will arise and exactly when you must correct them.

  *   **Misconception:** "This is just the Beginning-of-the-Universe argument dressed up."
      *   **Intervention Point:** **Step 2 (Ontological Dependence).**
      *   **Action:** Explicitly state: "We are not asking 'How did this start?' We are asking 'Why is this here *right now*?' Even if the universe had no beginning in time, this argument claims it would still need a reason for existing."
  *   **Misconception:** "If everything needs a cause, then God needs a cause too."
      *   **Intervention Point:** **Step 4 (Necessity).**
      *   **Action:** When introducing the "Hook," clarify: "The rule is 'Everything *contingent* needs a support.' The Hook is not contingent. It is the one thing that does not borrow existence. Asking what holds the Hook is like asking who lent money to the person who owns the bank."
  *   **Misconception:** "Necessary just means 'unimaginable not to exist' (like a triangle having three sides)."
      *   **Intervention Point:** **Step 4 (Necessity).**
      *   **Action:** Distinguish logical necessity from ontological necessity. Say: "We aren't saying it's a logical contradiction for God not to exist. We are saying this being doesn't *get* its existence from elsewhere. It owns its existence rather than borrowing it."

  #### 4. Objections: Set Aside vs. Address
  You cannot answer every objection in 90 minutes. You must triage them to keep the logic intact.

  *   **Set Aside (Explicitly tell the group you are parking these):**
      *   **Scientific Cosmology (The Big Bang):** Tell them, "This argument works even if the universe is eternal. Science tells us about the physical history; we are asking about the metaphysical reason for existence."
      *   **The Problem of Evil:** Tell them, "This argument concludes only that a Necessary Being exists. It does not argue that this Being is benevolent. We can't solve the problem of evil tonight."
      *   **Specific Religious Attributes:** Clarify that this argument aims for a "First Ground," not necessarily the God of any specific scripture.

  *   **Cannot Set Aside (Must address or the argument collapses):**
      *   **The Fallacy of Composition (Russell's Objection):** You cannot ignore the claim that "Just because every part has an explanation, the whole doesn't need one."
      *   **How to Address:** Use the Chandelier. Ask: "If every link is hollow, does having infinite links make the chain solid?" Explain that the argument claims *existence* is transitive in this specific way (borrowed existence requires a source), unlike properties like "being heavy" (every link is heavy, but the chain isn't necessarily heavier than the sum). Acknowledge this is the strongest counter-argument: some philosophers say the universe is "just there."

  #### 5. Final Assessment Question
  Do not ask them to repeat the conclusion. Ask a question that tests if they understand why the collection of contingent things needs an explanation distinct from the parts.

  **The Question:**
  "Imagine a room full of people where every single person is holding a borrowed watch. If I ask 'Where did the watches come from?', is it a sufficient answer to say 'Everyone got their watch from the person standing next to them'?"

  *   **Correct Grasp:** "No, because if everyone is borrowing, no one owns a watch. There must be at least one owner who isn't borrowing." (Shows they understand the part/whole distinction regarding dependence).
  *   **Incorrect Grasp:** "Yes, because everyone has a watch." (Shows they miss the need for a necessary source).

  Summary: This plan guides participants from experienced contingency to ontological necessity using a static chandelier image to distinguish sustaining dependence from temporal causation, while preemptively correcting category errors about beginnings and divine causes.
