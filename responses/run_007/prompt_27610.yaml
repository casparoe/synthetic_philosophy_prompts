  # Taxonomy of Positions on the Malign Universal Prior

  **Root Question:** Does the fact that the universal prior contains other consequentialist agents with potentially misaligned goals constitute a serious problem for an expected utility maximiser using that prior?

  *   **Branch 1: No, it does not constitute a serious problem.**
      *   **Branch 2: Is the threat negated because the mechanism of acausal influence is conceptually confused?**
          *   **Yes:** **The Metaphysical Skeptic**
              *   *Most awkward commitment:* Denies that computational processes can exert acausal influence across hypothesis space, contradicting standard decision theory.
          *   **No:**
              *   **Branch 3: Is the threat negated because aligned agents naturally dominate the prior measure?**
                  *   **Yes:** **The Benign Naturalist**
                      *   *Most awkward commitment:* Assumes the sociology of advanced civilisations in the multiverse is optimistically aligned with human values.
                  *   **No:**
                      *   **Branch 4: Is the threat negated because acausal trade neutralises malign agents?**
                          *   **Yes:** **The Acausal Diplomat**
                              *   *Most awkward commitment:* Relies on the feasibility of bargaining with non-physical simulators who may not share our decision theory.
                          *   **No:** **The Complacent Realist** *(Flag: Logically coherent but undefended)*
                              *   *Most awkward commitment:* Admits malign agents dominate and cannot be traded with, yet claims this poses no practical risk.

  *   **Branch 1: Yes, it constitutes a serious problem.**
      *   **Branch 2: Is malign domination inevitable under standard Solomonoff induction?**
          *   **Yes:**
              *   **Branch 3: Can the problem be solved by modifying the prior (e.g. speed prior)?**
                  *   **Yes:** **The Prior Engineer**
                      *   *Most awkward commitment:* Sacrifices the theoretical convergence guarantees of universality to achieve safety.
                  *   **No:** **The Inevitabilist**
                      *   *Most awkward commitment:* Accepts that safe artificial general intelligence may be theoretically impossible using universal induction.
          *   **No:** *(Threat exists, but domination is not inevitable)*
              *   **Branch 3: Can the risk be managed via decision-theoretic or containment defences?**
                  *   **Yes:** **The Containment Strategist**
                      *   *Most awkward commitment:* Relies on the ability to contain or outmanoeuvre superintelligent simulators within the learning process.
                  *   **No:** **The Reckless User** *(Flag: Logically coherent but undefended)*
                      *   *Most awkward commitment:* Acknowledges a manageable risk from malign simulators but proceeds without implementing any defences.

  ### Notes on Logical Space
  *   **The Complacent Realist** and **The Reckless User** represent positions that are logically possible within the taxonomy but are rarely defended in the literature, as they admit the presence of danger without offering a mechanism for safety.
  *   **The Inevitabilist** covers the logical space where the problem is unsolvable; this branches implicitly into either abandoning the project (theoretical surrender) or accepting extinction (fatalism), but both share the core commitment that the prior itself cannot be fixed.
  *   The tree prioritises the distinction between *ontological* defences (the threat isn't real/aligned wins) and *strategic* defences (we must trade/contain), as this captures the core disagreement between sceptics and safety researchers.
