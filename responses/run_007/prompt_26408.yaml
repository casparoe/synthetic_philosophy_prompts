answer: |-
  This is a sophisticated distinction, and your intuition is correct: standard definitions of **dramatic irony** often feel too blunt for what you are describing. In common usage, dramatic irony implies a *contradiction* (the character thinks X, but the truth is not-X, so their statement is rendered foolish or tragic). What you are describing is *additive* (the character thinks X, the truth is Y, and X + Y creates a richer Z).

  There is no single, universally agreed-upon term for this specific configuration, but there are three conceptual frameworks from literary theory and narratology that converge on it. Depending on which aspect you want to emphasize (the historical tradition, the narrative voice, or the linguistic mechanism), you might choose one of the following.

  ### 1. The Literary-Historical Term: *Sophoclean Irony*
  While often lumped under "dramatic irony," scholars sometimes distinguish **Sophoclean Irony** (or **Tragic Irony**) as a specific subtype.

  *   **How it differs from Dramatic Irony:** Generic dramatic irony often highlights the character's *error* (e.g., a character walks through a door the audience knows is trapped). Sophoclean irony highlights the character's *unwitting truth*.
  *   **The Classic Example:** In *Oedipus Rex*, Oedipus curses the murderer of Laius, vowing to banish him. Oedipus intends to punish a criminal. The audience knows Oedipus *is* the criminal. His meaning ("Justice must be done") remains valid and intact; the second meaning ("You are cursing yourself") sits alongside it, deepening the tragedy without invalidating his moral intent.
  *   **Why it fits your example:** Your wife intends a peace offering. That intention is real and valid. The reader's knowledge adds the layer of impending doom. The sentence becomes a vessel for two truths simultaneously.
  *   **Verdict:** This is the closest established term. However, because the word "irony" has become colloquially associated with mockery or contradiction, it may not fully capture the *resonant* quality you desire.

  ### 2. The Narratological Term: *The Implied Author's Utterance*
  Proposed by Wayne Booth in *The Rhetoric of Fiction*, this concept distinguishes between the **narrator/character** (who speaks the words) and the **implied author** (the artistic agency constructing the text).

  *   **The Mechanism:** In your scene, the *character* is the speaker of the sentence, conveying Meaning A (peace offering). However, the *implied author* is the speaker of the *scene*, conveying Meaning B (impending doom).
  *   **Why it fits:** You noted, "If anyone meant it, I did, as the author." Booth would argue that the text is a communication from the Implied Author to the Implied Reader. The character is merely the instrument. The "second meaning" is not an accident; it is the Implied Author speaking *through* the character's innocence.
  *   **Verdict:** This explains *who* is generating the meaning, but it is a theoretical construct rather than a name for the effect itself. You might describe the effect as **"Implied Authorial Resonance."**

  ### 3. The Linguistic Term: *Textual Implicature*
  In the philosophy of language (Gricean pragmatics), **implicature** is what is suggested beyond what is literally said. Usually, this is tied to the *speaker's* intent. However, literary linguists sometimes discuss **textual** or **narrative implicature**.

  *   **The Mechanism:** The "context" required to interpret an utterance includes not just the immediate situation, but the entire narrative structure known to the reader. The text itself "implicates" the second meaning, even if the speaker does not.
  *   **Why it fits:** It treats the extra meaning as a logical inference derived from the total information available to the *receiver* (the reader), rather than the *sender* (the character).
  *   **Verdict:** Precise, but perhaps too clinical for a novelist's notes.

  ### A Proposed Terminology
  Since existing terms either carry baggage (Irony) or are too theoretical (Implied Author), you might consider adopting a descriptive term that captures the *additive* nature of the phenomenon.

  **Option A: Structural Resonance**
  This emphasizes that the meaning comes from the structure of the narrative (the reader's collateral knowledge) vibrating against the surface of the dialogue. It avoids the word "irony" and its connotations of contradiction.
  *   *Usage:* "This line has structural resonance; she means peace, but the plot makes it sound like a death sentence."

  **Option B: Unwitting Prophecy**
  This captures the temporal aspect (the reader knows the future) and the character's innocence. It frames the second meaning not as a contradiction, but as a truth the character is unknowingly speaking.
  *   *Usage:* "It's a moment of unwitting prophecy; she's inviting him to his own ruin without knowing it."

  **Option C: Dramatic Overdetermination**
  Borrowing from psychoanalytic criticism, "overdetermination" means a single element is determined by multiple causes. Here, the line is determined by the character's psychology *and* the plot's trajectory.
  *   *Usage:* "The dialogue is overdetermined; it serves her motive and the theme simultaneously."

  ### Comparison of Concepts

  | Concept | Who "Means" the 2nd Meaning? | Relationship to 1st Meaning | Best For... |
  | :--- | :--- | :--- | :--- |
  | **Dramatic Irony** | The Situation / Fate | **Subversive:** Undercuts or mocks the 1st meaning. | When the character is mistaken or doomed by their error. |
  | **Sophoclean Irony** | The Text / Tradition | **Compounding:** The 1st meaning is true, but the 2nd is *truer*. | When a character speaks a truth they don't understand (your example). |
  | **Implicature** | The Speaker | **Implicit:** The speaker hints at the 2nd meaning. | Everyday conversation or deceptive dialogue. |
  | **Implied Author** | The Authorial Construct | **Layered:** The character says A, the Author says A+B. | Explaining the *source* of the meaning. |
  | **Structural Resonance** | The Reader / Structure | **Additive:** The 2nd meaning vibrates alongside the 1st. | Describing the *effect* without implying contradiction. |

  ### Recommendation
  If you are discussing this with editors or academically trained readers, **Sophoclean Irony** is the term they will recognize as distinct from generic dramatic irony. It validates that the character is not "wrong," but rather speaking a truth larger than their comprehension.

  However, for your own notes and craft, I recommend **Structural Resonance**. It perfectly captures your description: the character's meaning stands intact, but the narrative structure causes the words to vibrate with a second, heavier frequency. It distinguishes the phenomenon from irony (which implies a clash) and implicature (which implies intent).

  **Definition for your notes:**
  > **Structural Resonance:** A dialogue phenomenon where a character's utterance carries their intended meaning intact, but acquires a secondary, heavier significance for the reader due to the narrative context (backstory, future plot, secrets). Unlike dramatic irony, the character is not mistaken; unlike implicature, the character does not intend the subtext. The extra meaning is generated by the collision of the character's innocence and the reader's knowledge.
