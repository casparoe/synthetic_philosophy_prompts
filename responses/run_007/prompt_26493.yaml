prompt: |-
  I'm the arts editor at a monthly magazine — we run about eight reviews per issue across books, film, visual art, theater, music. Small staff, lots of freelancers. Here's the thing: I can't possibly read every book or see every show we review. I have to trust my critics. But I took a philosophy of art course back in grad school and I remember there's this whole debate about aesthetic testimony — whether you can legitimately form aesthetic judgments based on what someone else tells you. The pessimists say no, you basically have to experience it yourself to have a genuine aesthetic belief; the optimists say testimony works fine for aesthetics like it does for anything else.

  I need a decision procedure I can actually use at my desk. When I'm editing a review, when can I trust the critic's verdict without having consumed the work myself? When do I need to go see the damn thing before we publish? And when is the right move to get a second critic rather than either trusting or checking?

  The procedure has to be something I can run in about fifteen minutes per review. It should flag where the pessimist is clearly right and I'm fooling myself if I think I can judge from the critic's writeup alone. It should also flag where the optimist is right and I'm being precious — where testimony is perfectly adequate for the editorial decision I'm actually making. And be honest about where the philosophy doesn't settle it and I'm just making a call.

  Then run it on three cases: (1) a review of a new novel by a big-name author where the critic loved it but I've seen mixed chatter online, (2) a review of an experimental theater piece where the critic hated it but their description makes it sound genuinely interesting to me, and (3) a review of a museum retrospective where the critic is positive but the review is mostly biographical context and barely describes the work itself.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Arts Editor at a monthly magazine.
      *   **Context:** Small staff, many freelancers, ~8 reviews/issue (books, film, art, theater, music).
      *   **Constraint:** Cannot consume every work reviewed. Must rely on critics (testimony).
      *   **Problem:** Philosophical tension regarding *aesthetic testimony* (Pessimism vs. Optimism). Needs a practical decision procedure to know when to trust, when to verify, and when to seek a second opinion.
      *   **Requirements:**
          *   Actionable decision procedure (runnable in ~15 mins/review).
          *   Must distinguish between cases where pessimism applies (need direct experience) vs. optimism (testimony suffices).
          *   Must acknowledge where philosophy doesn't help (editorial judgment call).
          *   Apply the procedure to three specific cases.

  2.  **Deconstruct the Philosophy (Aesthetic Testimony):**
      *   *Pessimism (e.g., Kant, Kivy):* Aesthetic judgment requires first-hand experience. Testimony gives you *knowledge that* someone liked it, but not *knowledge of* the value itself. You can't truly claim "This is good" based on say-so.
      *   *Optimism (e.g., Hume, contemporary epistemologists):* Testimony is a valid source of aesthetic knowledge. Experts can convey value through description and analysis.
      *   *Editorial Reality:* The editor isn't making the *aesthetic judgment* for the reader; they are making an *editorial judgment* about the review's quality and reliability. The goal isn't "Is this art good?" but "Is this review trustworthy and useful?"

  3.  **Develop the Decision Procedure (The "15-Minute Audit"):**
      *   *Goal:* Bridge the gap between philosophical theory and editorial workflow.
      *   *Structure:* Needs to be a checklist or flow. Let's make it a 3-Step Filter.
      *   *Step 1: The Descriptive Density Check (Optimist Filter).* Does the review provide enough evidence for me to simulate the experience? If yes, testimony works.
      *   *Step 2: The Stakes & Novelty Check (Pessimist Filter).* Is the claim radical? Is the work obscure? If the verdict contradicts consensus or relies on subtle nuance, direct verification or second opinion is needed.
      *   *Step 3: The Critic's Track Record (Trust Filter).* Has this critic earned epistemic credit?
      *   *Output:* Three buckets: Green (Publish), Yellow (Second Opinion), Red (Editor Verification/kill).

  4.  **Refine the Procedure for the User's Constraints:**
      *   *Time:* 15 minutes max.
      *   *Action:* Editing a review, not just deciding to assign.
      *   *Nuance:* Acknowledge that the editor's job is *curatorial*, not necessarily *aesthetic*. The editor validates the *argument*, not the *art*.
      *   *Philosophical Integration:* Explicitly label where Pessimism/Optimism applies.

  5.  **Drafting the Procedure (Iterative Process):**
      *   *Draft 1 Idea:* Read review. If good, publish. If bad, check. (Too vague).
      *   *Draft 2 Idea:* Check if critic describes the work. If yes, trust. If no, don't. (Too simple).
      *   *Draft 3 (Final):* Create the "Aesthetic Testimony Audit."
          *   Phase 1: Evidentiary Support (Can I see what they saw?) -> Optimist zone.
          *   Phase 2: Divergence & Risk (Is this claim risky?) -> Pessimist zone.
          *   Phase 3: Critic Calibration (Do I trust the witness?) -> Hybrid.
      *   *Decision Matrix:* Map results to actions (Trust, Verify, Second Opinion).

  6.  **Developing the Case Studies:**
      *   *Case 1: Big-name novel, critic loves, online chatter mixed.*
          *   Analysis: High visibility, divergent testimony. Pessimism warns against relying on one voice against the grain. Optimism says if the review argues well, it stands.
          *   Verdict: Likely "Second Opinion" or "Trust with Caveats" depending on review quality. Let's lean towards checking the *argument* closely. If the review addresses the criticism, trust. If it ignores it, second opinion.
      *   *Case 2: Experimental theater, critic hates, sounds interesting to editor.*
          *   Analysis: Editor's intuition clashes with critic. Pessimism says editor shouldn't judge without seeing. But editor senses a mismatch in *criteria*.
          *   Verdict: This is a "Criteria Mismatch." The critic might be judging by wrong standards. Needs a second opinion (someone who likes experimental work) rather than editor seeing it (too time-consuming).
      *   *Case 3: Museum retrospective, positive, mostly biography.*
          *   Analysis: Lack of descriptive density. Optimism fails because there's no aesthetic evidence. Pessimism wins: you can't judge the art from the biography.
          *   Verdict: Red flag. Send back for revision. Needs more description of the *work*.

  7.  **Review and Refine:**
      *   *Tone:* Professional, pragmatic, respectful of the philosophy but grounded in publishing reality.
      *   *Clarity:* Ensure the 15-minute limit is respected.
      *   *Philosophy Check:* Did I accurately represent the Pessimist/Optimist tension? Yes, by framing it as "Evidence vs. Authority."
      *   *Self-Correction on Case 2:* The editor says "sounds interesting to me." This implies the editor *is* forming an aesthetic belief based on testimony. The procedure needs to flag this as dangerous (Pessimist warning) but offer a practical workaround (get a critic who aligns with that interest).

  8.  **Final Polish:** Organize with clear headings. Ensure the "Decision Matrix" is easy to scan. Make sure the case studies apply the matrix explicitly. (Self-correction: Ensure I explicitly state when philosophy *doesn't* solve it).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a practical decision procedure designed for your workflow, grounded in the aesthetics debate but built for the 15-minute editorial window.

  ### The Aesthetic Testimony Audit (15-Minute Protocol)

  **The Philosophical Premise:**
  *   **Optimist Zone:** Testimony is valid when the critic provides *transmissible evidence* (description, analysis, context) that allows you to simulate the experience.
  *   **Pessimist Zone:** Testimony fails when the judgment relies on *ineffable qualities* (emotional resonance, subtle nuance) that cannot be conveyed in text, or when the stakes of being wrong are high (reputation damage).
  *   **The Editorial Reality:** You are not judging the *art*; you are judging the *reliability of the witness*.

  **The Procedure:**
  Run these three filters sequentially. If a filter triggers a "Stop," move to the corresponding Action.

  #### Filter 1: Descriptive Density (The Optimist Test)
  *Time: 5 Minutes*
  Scan the review for concrete evidence. Highlight sentences that describe the *work itself* (not the plot summary, but the aesthetic execution).
  *   **Green Light:** The critic quotes specific passages, describes camera angles, details brushstrokes, or analyzes specific musical transitions. They explain *how* the effect was achieved.
  *   **Red Light:** The review relies on adjectives of conclusion ("stunning," "tedious," "masterful") without adjectives of process. It focuses on the artist's biography, the audience's reaction, or the cultural moment rather than the object.
  *   **Philosophical Signal:** If **Green**, the Optimist is right: the testimony carries the aesthetic data. If **Red**, the Pessimist is right: you are being asked to trust authority without evidence.

  #### Filter 2: Consensus Divergence (The Pessimist Test)
  *Time: 5 Minutes*
  Check the "epistemic environment." Quick Google search or internal knowledge.
  *   **Green Light:** The critic's verdict aligns with general consensus, OR it diverges but explicitly acknowledges and argues against the prevailing view.
  *   **Red Light:** The verdict is a radical outlier (e.g., hating a beloved classic, loving a notorious flop) *and* the review treats its view as the only obvious truth.
  *   **Philosophical Signal:** If **Red**, the Pessimist is right: aesthetic testimony is weakest when it contradicts the "community of sense." You cannot verify this from your desk.

  #### Filter 3: Critic Calibration (The Trust Test)
  *Time: 5 Minutes*
  Check your history with this freelancer.
  *   **Green Light:** They have a track record with you. Their past reviews have matched your own experiences of works you *did* consume. They have a defined "lens" you understand (e.g., "They always focus on sound design").
  *   **Red Light:** New freelancer, or a past pattern of hyperbole that required heavy editing.
  *   **Philosophical Signal:** This is where philosophy bows out. This is pure editorial risk management.

  ---

  ### The Decision Matrix

  | Filter Results | Action | Rationale |
  | :--- | :--- | :--- |
  | **All Green** | **Trust & Publish** | Optimism wins. The review provides enough data for the reader to form their own judgment, even if you haven't seen the work. |
  | **Filter 1 Red** (No Description) | **Return for Revision** | The review is philosophically empty. It asks for blind faith. Demand evidence of the work. |
  | **Filter 2 Red** (Radical Outlier) | **Get Second Opinion** | Pessimism wins. One witness is insufficient for a contrarian claim. Assign a short "counter-view" sidebar or hold for a second read. |
  | **Filter 3 Red** (Unproven Critic) + **Any Red** | **Editor Verification** | If the critic is unproven *and* the review lacks evidence or diverges wildly, you must consume the work (or a significant sample) before publishing. |

  ---

  ### Case Studies

  Here is the Audit applied to your three scenarios.

  #### Case 1: The Big-Name Novel
  *Scenario: Critic loved it. Online chatter is mixed. Critic is established.*

  *   **Filter 1 (Density):** Assume the review quotes the prose and analyzes the structure. **(Green)**
  *   **Filter 2 (Divergence):** Online chatter is mixed, not universally negative, but the critic's love is enthusiastic. Does the review acknowledge the criticisms (e.g., "Some may find the pacing slow, but...")?
      *   *If Yes:* **(Green)**. They are engaging with the community of sense.
      *   *If No:* **(Red)**. They are ignoring the counter-testimony.
  *   **Filter 3 (Calibration):** Established critic. **(Green)**

  **Verdict:**
  *   **If Filter 2 is Green:** **Trust & Publish.** The Optimist view holds. The critic has provided enough textual evidence that the reader can decide if *they* like the style, regardless of the online chatter. Your job is to ensure the argument is clear, not to validate the taste.
  *   **If Filter 2 is Red:** **Get Second Opinion.** The Pessimist view holds. A singular, unacknowledged contrarian view on a high-profile work risks your magazine's credibility. Commission a short "dissenting view" box to run alongside it.

  #### Case 2: The Experimental Theater
  *Scenario: Critic hated it. Description makes it sound interesting to you.*

  *   **Filter 1 (Density):** The description makes it sound interesting, meaning the critic *did* describe the work well enough for you to visualize it. **(Green)**
  *   **Filter 2 (Divergence):** Experimental work often polarizes. A "hate" review isn't necessarily an outlier, but your intuition suggests a mismatch.
  *   **Filter 3 (Calibration):** **Crucial Check.** Does this critic usually hate experimental work?
      *   *If Yes:* **(Red Flag on Criteria).** The testimony is reliable *for that critic*, but not for your audience.
      *   *If No:* **(Green).**

  **Verdict:** **Get Second Opinion.**
  *   **Why:** This is a "Criteria Mismatch." The Pessimist is right that you cannot judge the *experience* from the desk, but the Optimist is right that the description conveys the *concept*.
  *   **The Move:** Do not go see it yourself (too time-consuming). The issue isn't whether the play is "good," it's whether the critic is the *right witness*. If the critic hates experimentation on principle, their testimony is biased. Assign a second, shorter review to a critic known for championing experimental work. Run them as "Perspectives." This acknowledges that aesthetic testimony is subjective without requiring you to be the arbiter of truth.

  #### Case 3: The Museum Retrospective
  *Scenario: Critic is positive. Review is mostly biography. Barely describes work.*

  *   **Filter 1 (Density):** **(RED LIGHT).** This is the dealbreaker.
  *   **Filter 2 (Divergence):** Irrelevant.
  *   **Filter 3 (Calibration):** Irrelevant.

  **Verdict:** **Return for Revision (Do Not Publish as is).**
  *   **Why:** This is the clearest case for the Pessimist. Aesthetic testimony requires the transmission of aesthetic properties. A biography transmits historical facts, not aesthetic value. If you publish this, you are not publishing a review; you are publishing a profile.
  *   **The Move:** Send it back. Tell the critic: "You have argued the *artist* is important, but you haven't provided the testimony required for me to believe the *art* is good. I need 300 words describing specific canvases/installations."
  *   **Philosophical Note:** Here, philosophy settles it completely. You cannot form an aesthetic judgment on biographical testimony. It is category error.

  ### Where Philosophy Doesn't Settle It (The Honest Call)

  There will be times when the Audit comes back **All Green**, but your gut still says "No."

  *   **The Scenario:** The review is well-argued, the critic is trusted, the description is vivid, but the verdict feels "off" to your specific editorial vision for the issue.
  *   **The Reality:** This is not an epistemological problem; it is a **curatorial problem**.
  *   **The Call:** Philosophy cannot tell you if a review "fits" your magazine's voice. In these instances, you are allowed to override the Audit. You are not a passive vessel for aesthetic truth; you are an editor. If the review is philosophically sound (Optimist criteria met) but tonally wrong, you kill it or edit it for voice, not truth.

  **Summary for your desk:**
  1.  **No Description?** Send back. (Pessimist wins).
  2.  **Radical Outlier?** Get a second voice. (Pessimist wins).
  3.  **Solid Evidence + Trusted Critic?** Publish. (Optimist wins).
  4.  **Just feels wrong?** Edit for voice. (Editor wins).
