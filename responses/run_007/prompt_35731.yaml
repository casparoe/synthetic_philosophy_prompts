answer: |-
  The hum of the server rack was the only sound in the consultation room. It wasn't a mechanical whir, but a deep, resonant vibration that Leo felt in his sternum. He sat on the edge of the examination table, his hands resting on his knees. They looked like his hands—freckled, the nail on the thumb bitten down—but the neurologist, Dr. Vance, was looking at them as if they were already obsolete hardware.

  "Stage one begins next Tuesday," Vance said, tapping the holographic display floating between them. A brain rotated slowly, glowing blue. Red patches bloomed across the temporal lobe like mold. "We replace approximately four million neurons per day. Synthetic analogues. They integrate with the biological dendrites instantly. You won't feel a thing."

  "Won't feel a thing," Leo repeated. "Including the thinking?"

  "Especially the thinking," Vance said, smiling the tight, reassuring smile of a salesman closing a deal on a car with a known engine fault. "Cognitive continuity is the selling point, Leo. You'll be here. You'll be talking to me. You'll be eating lunch. By month three, when the last biological cluster is retired, you'll simply be… more stable."

  Leo looked at the red mold on the hologram. *Neuro-Synaptic Decay.* It wasn't painful, not yet. It was just a erasing. First the names of secondary school friends, then how to tie a tie, then how to swallow.

  "And if I don't?" Leo asked.

  "Then the decay continues," Vance said softly. "Biological entropy is not negotiable. The substrate is failing. We are offering to migrate the software."

  *Software.* Leo looked toward the glass partition. Elena was waiting in the corridor, pacing. She had been crying in the car park, but she had wiped her face before coming in. She wanted him to do this. She needed him to do this.

  "Can I speak to my partner?"

  "Of course. Take your time. The consent form doesn't expire." Vance tapped the air, dismissing the hologram, and left the room. The hum of the servers grew louder in the silence.

  Elena came in and didn't sit. She stood between his knees and took his face in her hands. Her thumbs traced his cheekbones. Her touch was warm, biological, messy.

  "You heard him," she said. "It's the only way."

  "He called it migration," Leo said. "He talks like I'm a file."

  "He talks like a doctor who wants you to live," Elena said. She leaned her forehead against his. "I don't care about the neurons, Leo. I care about *you*. The you that laughs at my terrible cooking. The you that knows why I hate the colour yellow. That's not in the cells. It's in the pattern. As long as the pattern stays, you stay."

  Leo closed his eyes. This was the thing that had been gnawing at him since the diagnosis, a splinter in his mind he couldn't reach. Everyone treated the procedure as a rescue mission. To Vance, it was a repair. To Elena, it was a preservation. But to Leo, sitting in his own skin, it felt like a succession.

  "If the pattern stays," Leo said, his voice low, "then why do I feel like I'm planning my own funeral?"

  Elena pulled back, frowning. "Don't. Don't do that. That's the fear talking. That's the decay starting early."

  "Is it?" Leo looked at her. "When I come out of this, six months from now… you'll look at me. You'll see the synthetic eyes. You'll hear the synthetic voice. And you'll say, 'There he is.' But will you be saying it to me? Or will you be saying it to the thing that replaced me?"

  "I'll be saying it to *us*," she insisted. Her grip tightened. "I'm not losing you, Leo. I refuse to."

  There it was. The revelation hit him with a quiet, cold clarity. She had already decided. In her mind, the post-procedure entity *was* Leo. Her certainty wasn't based on metaphysics; it was based on necessity. She needed a partner, and this machine promised to fill the shape of the one she was losing. Her theory of personhood was pragmatic: *If it acts like Leo and loves me like Leo, it is Leo.*

  But that theory didn't comfort the Leo sitting here now. It threatened him. It suggested he was expendable, provided the replacement was convincing enough.

  "I need a minute," Leo said.

  "Leo—"

  "Please."

  She hesitated, then nodded, stepping back. She waited in the corridor, visible through the glass. She was checking her phone, perhaps looking up support groups, perhaps messaging her mother to say *he's doing it.* She was already mourning the biological man and bonding with the synthetic prospect.

  Leo stood up and walked to the sink in the corner of the room. He turned on the tap and splashed water on his face. He looked up into the mirror.

  The face staring back was pale, eyes wide. This was the biological Leo.

  He imagined the timeline splitting right here, at the sink.

  In one branch, he walks out. He tells Vance no. He goes home with Elena. They spend the next year dealing with the decline. He forgets her name. He chokes on his dinner. He dies. In that timeline, the 'I' that is looking in the mirror now experiences the end of consciousness. The story stops.

  In the other branch, he signs. He undergoes the replacement. Day by day, the red patches on the hologram turn blue. He feels fine. He remembers everything. Six months later, he walks out of the clinic. He goes home with Elena. He laughs at her cooking. He lives for forty more years.

  But who is the 'I' in that second timeline?

  The Leo at the sink knows that if he walks out, he dies. If he stays, the *entity* that leaves the clinic survives. But is that entity him? It has his memories of standing at this sink. It has his memory of deciding to stay. But the Leo who *refused* also has the memory of deciding to refuse, right up until the lights go out.

  The decision itself was the trap.

  The 'I' that makes the choice is the biological 'I'. If the biological 'I' ceases to exist, does it matter that a copy continues? To the copy, it feels like survival. To the original, it feels like execution.

  Yet, everyone around him acted as if this distinction was pedantic. Vance saw it as maintenance. Elena saw it as continuity. They were projecting their own desire for continuity onto him. They wanted the story to go on. They didn't care about the narrator, only the plot.

  Leo dried his face. He looked at the towel. Cotton. Rough texture. He could feel it. For now.

  He walked back to the desk where the tablet waited. The consent form was simple. *I acknowledge the risks. I acknowledge the nature of the substrate transfer.*

  Vance came back in. He didn't look at Leo's eyes; he looked at the tablet. "Have you come to a conclusion?"

  "Elena thinks I'll be me," Leo said.

  Vance nodded, picking up a stylus. "She's right. Functionally."

  "And if I say no?"

  "Then you're you until you aren't," Vance said, shrugging. "And then you're nothing. Look, Leo, I understand the existential vertigo. It's common. But consider this: You change your cells constantly anyway. You aren't the same collection of atoms you were seven years ago. This is just… accelerating the natural turnover. Replacing wood with steel, plank by plank, while the ship stays afloat."

  "The Ship of Theseus," Leo said.

  "If you like," Vance said. "But the ship doesn't care what it's made of. It cares about sailing."

  "And if the ship wonders if it's still the same ship?"

  Vance paused. For a second, the clinical mask slipped, and Leo saw a flicker of something human. Pity, maybe. Or recognition.

  "Then it's a very anxious ship," Vance said gently. "But it's still sailing."

  Leo looked through the glass again. Elena was watching him. She mouthed, *I love you.*

  He realized then that her love was the anchor, but it was also the weight. She loved the pattern. She would love the synthetic version just as fiercely. That meant the synthetic version would be happy. It would have a life. It would hold her hand and feel the warmth of her skin, processed through sensors instead of nerves.

  If he refused, he protected the sanctity of his current biological self, but he condemned the future entity to non-existence. He would be the guardian of a flame that was about to go out, refusing to pass the torch because the new torch was made of different metal.

  But if he agreed, he was sentencing *this* Leo to death. The Leo at the sink would never see the four-year mark. He would be the foundation that got built over.

  There was no objective fact waiting to be discovered. Vance didn't know. Elena didn't know. Philosophy wouldn't save him. The universe didn't care if there was a soul or a pattern. There was only the choice, and the memory of the choice.

  If he signed, the future Leo would remember signing. He would remember the fear at the sink. He would justify it. He would say, *I had to survive.*

  If he walked away, the dying Leo would remember walking away. He would remember the fear. He would justify that, too. *I had to be real.*

  Both versions of him would feel they were the true heir. Both would feel the continuity of memory up to the divergence. The only difference was what happened after.

  Leo picked up the stylus. It felt heavy, cold.

  "You know," Leo said, not looking up. "When I sign this, I'm not doing it for me."

  Vance tilted his head. "Who else is there?"

  Leo looked at Elena through the glass. She was smiling now, a fragile, hopeful thing. She saw a future. She saw *him* in that future.

  "I'm doing it for her," Leo said. "She needs the pattern to hold."

  "And you?" Vance asked. "What do you need?"

  Leo thought about the silence of the grave versus the hum of the server. He thought about the Leo who would walk out of here in six months, who would never know the difference, who would live a full life. That Leo deserved to exist.

  "I need the story to make sense," Leo said.

  He touched the stylus to the screen. The signature flowed out, digital ink.

  *Leo J. Kaelin.*

  It looked like his handwriting. It was perfect.

  "Welcome to the continuum," Vance said.

  Leo put the stylus down. He felt a strange lightness, as if he had just stepped off a curb he hadn't seen. He was still here. He was still biological. But he had just authorized his own replacement. He was the last of his kind, and he was sitting in a chair waiting for the executioner to bring the first plank of the new ship.

  He walked to the door and opened it. Elena rushed in and hugged him, burying her face in his neck. She was shaking.

  "It's okay," she whispered. "You're going to be okay."

  Leo rested his chin on her head. He breathed in the scent of her hair. He committed it to memory. He knew, with a terrifying certainty, that the person who walked out of this clinic in six months would remember this hug. That person would feel this love.

  But the person feeling it right now knew he was the only one who would ever know the difference between the memory and the reality.

  "I know," Leo lied.

  He held her tight, anchoring himself to the biology that was already, in the eyes of everyone he loved, obsolete. The servers hummed behind them, a chorus waiting for its soloist to join in. Leo closed his eyes and listened to the hum, wondering if, one day, he would be the one making the sound.
