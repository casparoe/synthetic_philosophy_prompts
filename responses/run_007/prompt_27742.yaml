      *   *Parfit's Hitchhiker:* Found in *Reasons and Persons* (1984). It's a classic Newcomb-like problem / coordination problem involving *predictors*.
      *   *Standard Decision Theory:* Usually refers to Causal Decision Theory (CDT). CDT says: At the moment of payment, the ride is done. Paying costs \$100, not paying costs \$0. Causal impact of paying on being rescued is zero (it's in the past). So CDT says *don't pay*.
      *   *The Problem:* If the driver knows you use CDT, you die. If you use a different theory (like Evidential Decision Theory - EDT, or Functional Decision Theory - FDT, or have a disposition), you live.
      *   *The "Rationality requires Irrationality" claim:* This is a specific interpretation. Parfit argues that *self-interest* (or rationality defined as maximizing self-interest) sometimes requires having dispositions that violate immediate self-interest. But does it require *being* irrational? Or does it require a *different definition* of rationality?
      *   *Decision Theory Incompleteness:* Many philosophers (Lewis, Joyce, Ahmed, etc.) debate this. CDT proponents often bite the bullet (you die, but you were rational). Others (like Parfit, Gauthier, Arntzenius) argue CDT is flawed. So saying it *shows* incompleteness is a strong claim, but a defensible one in certain circles.

