answer: |-
  ### Part 1: Philosophical Grounding for the Procedure

  To protect clients from exploitation and yourself from compliance risk, this procedure relies on two concepts from decision theory:

  1.  **Diachronic Rationality (Dynamic Consistency):** A rational agent should stick to a plan made at Time 1 when they arrive at Time 2, *unless* they have acquired new information or their fundamental life constraints have changed. Changing your mind simply because time has passed or emotions have shifted is considered a "preference reversal," not a rational revision.
  2.  **The Money Pump Argument:** If a client's preferences are intransitive (they want A over B, B over C, but C over A) or dynamically inconsistent, they can be induced to trade endlessly, paying fees each time, without ever improving their position. In a fiduciary context, facilitating this is churning.

  **The Goal:** Distinguish between **Rational Revision** (updating based on new data/constraints) and **Instability** (updating based on mood/framing/impulse).

  ***

  ### Part 2: The Diachronic Consistency Protocol (DCP)

  **Time Allocation:** 30 Minutes
  **Documentation Requirement:** Save completed checklist to client CRM under "Investment Policy Statement Review."

  #### Step 1: The Trigger Identification
  **Question:** What specific event or thought triggered the request to change the portfolio *today*?
  *   **Sufficient Answer:** A specific piece of data (e.g., "I lost my job," "Interest rates rose 2%," "I am getting married") or a specific realization of error in the original plan.
  *   **Stop (No Action):** If the client confirms the original plan is still sound and withdraws the request.
  *   **Flag (Concern):** If the answer is vague (e.g., "I just feel nervous," "The news looks scary," "I want to try something new").
  *   **Judgment Call Warning:** *Advisors must distinguish between "news" (data) and "noise" (market commentary). This is subjective.*

  #### Step 2: The Information Audit
  **Question:** Does this trigger constitute **new information** that was unavailable or unforeseeable when the current Investment Policy Statement (IPS) was signed?
  *   **Sufficient Answer:** Yes. (e.g., A health diagnosis, a change in tax law, a liquidity need).
  *   **Flag (Concern):** No. The client is reacting to information that was already priced in or discussed during the original planning (e.g., "The market dropped," when volatility was disclosed in the IPS).
  *   **Hand-Off:** If the client claims a "change in risk tolerance" without a life event. This is a values judgment. Proceed to Step 5.

  #### Step 3: The Precommitment Check
  **Question:** Did the client previously agree to a specific strategy (e.g., a glide path, automatic rebalancing, or a "do not trade" clause) specifically to prevent this type of reaction?
  *   **Sufficient Answer:** No prior agreement exists.
  *   **Flag (Concern):** Yes, a prior agreement exists, and the client wants to break it without new information (Step 2).
  *   **Stop (Hard):** If a precommitment exists and no new information exists, **do not execute the trade.** Explain the concept of "strategic ignorance" (agreeing now to bind yourself later). Document the refusal.

  #### Step 4: The Cost-Benefit (Money Pump) Screen
  **Question:** Do the transaction costs, tax implications, and fees of this change exceed the expected utility gain, assuming the client might reverse this decision within 12 months?
  *   **Sufficient Answer:** The long-term benefit clearly outweighs costs even if reversed later (rare).
  *   **Flag (Concern):** Costs are high, or the client has a history of reversing similar decisions within 12 months.
  *   **Hand-Off:** If the costs are low but the frequency is high. This requires a judgment on "churning risk."

  #### Step 5: The Cooling-Off Period (Values Judgment)
  **Question:** If this request stems from a stated "change in risk tolerance" rather than new data, can the client articulate *why* their values changed, rather than just *that* they changed?
  *   **Sufficient Answer:** "I realized I value leaving an inheritance more than current income." (Value articulation).
  *   **Flag (Concern):** "I just don't like losing money anymore." (Emotional reaction).
  *   **Action:** Impose a mandatory 7-day cooling-off period. Require a signed addendum to the IPS stating the new risk profile.
  *   **Judgment Call Warning:** *This step determines if the client is capable of autonomous decision-making. You are judging their mental state.*

  #### Step 6: Final Compliance Sign-off
  **Action:** Advisor signs below certifying that Steps 1–5 were reviewed.
  *   **If any "Flag" or "Hand-Off" occurred:** Requires Senior Advisor or Compliance Officer review before execution.

  ***

  ### Part 3: Running the Procedure on Three Cases

  #### Case 1: The Market Timer
  **Client:** Mr. A.
  **Behavior:** Switches to aggressive equities after good news, conservative bonds after bad news. Frequency: 3 times in 18 months.
  **Current Request:** Wants to move to cash because "inflation reports look hot."

  *   **Step 1 (Trigger):** "Inflation reports." (Flag: This is noise/data already public, not private new info).
  *   **Step 2 (Info Audit):** Was this unforeseeable? No. Volatility was priced into the IPS. (Flag).
  *   **Step 3 (Precommitment):** IPS includes a statement on "Market Volatility Discipline." (Flag).
  *   **Step 4 (Cost/Benefit):** High tax impact from selling equities. History of reversing within 6 months. (Flag: Money Pump risk).
  *   **Step 5 (Cooling-Off):** Client cannot articulate value change, only fear.
  *   **DCP Outcome:** **Refuse Trade.** Impose Cooling-Off.
  *   **Business Impact:** Client is frustrated. You risk losing the account fee.
  *   **Philosophical Note:** This is a classic dynamic inconsistency. The client at Time 1 wanted exposure; the client at Time 2 wants safety. Satisfying Time 2 betrays Time 1's rational plan.

  #### Case 2: The Precommitment Breaker
  **Client:** Ms. B.
  **Behavior:** Signed a 20-year retirement glide path agreement 2 years ago.
  **Current Request:** Wants to abandon the glide path to pick individual tech stocks.
  **Context:** No life changes. No new income. Simply "bored" and "confident."

  *   **Step 1 (Trigger):** "Boredom/Confidence." (Flag: Emotional state).
  *   **Step 2 (Info Audit):** New info? No. (Flag).
  *   **Step 3 (Precommitment):** **Yes.** She explicitly signed a document agreeing to automate decisions to prevent behavioral error.
  *   **DCP Outcome:** **Hard Stop.** Do not execute.
  *   **Uncomfortable Advice:** The procedure dictates you tell the client "No." This is the case where the protocol protects the client from themselves at the expense of your relationship. If you execute, you are facilitating a preference reversal that violates her own past rational agency.
  *   **Compliance Note:** Document that the trade was rejected per IPS Section 4.2.

  #### Case 3: The Intransitive Cycle
  **Client:** Mr. C.
  **Behavior:** Wants to swap Fund A for Fund B. Last quarter, he swapped B for A. Two quarters ago, he swapped C for B.
  **Current Request:** "Fund B has a better yield than A." (Last quarter he said A had better growth than B).

  *   **Step 1 (Trigger):** "Yield vs. Growth."
  *   **Step 2 (Info Audit):** Did yields change materially, or is he re-weighting criteria? He is re-weighting criteria without new constraints. (Flag).
  *   **Step 3 (Precommitment):** No formal precommitment, but pattern suggests instability.
  *   **Step 4 (Cost/Benefit):** **Critical Flag.** He is paying transaction fees to rotate A->B->C->A. This is a literal money pump. He is paying to end up where he started.
  *   **Step 5 (Cooling-Off):** Required.
  *   **DCP Outcome:** **Escalate to Compliance.** This pattern indicates intransitive preferences (A>B, B>C, C>A). Executing makes you complicit in wealth destruction via fees.
  *   **Action:** Freeze trading privileges until a new IPS is signed with a "No Trade" clause for 12 months.

  ***

  ### Part 4: Limitations of the Procedure

  As a philosopher, I must be clear about what this checklist *cannot* do. It is a tool for procedural rationality, not a guarantee of truth.

  1.  **It Cannot Distinguish True Value Evolution:** A client may genuinely change their mind about what matters in life (e.g., deciding philanthropy is more important than legacy) without a specific "event." The DCP flags this as a "Hand-Off," but ultimately, you must trust the client's autonomy. If you block every value change, you are paternalistic, not fiduciary.
  2.  **It Cannot Predict Black Swans:** The "Information Audit" relies on what was *foreseeable*. In a crisis, clients will claim the risk was unforeseeable. You will have to judge if their panic is rational given the new reality. The checklist cannot automate that judgment.
  3.  **It Cannot Fix Advisor Bias:** The DCP relies on *you* to ask the questions. If you are incentivized to churn, you will coach the client to give "Sufficient Answers" in Step 1. The procedure is only as honest as the advisor filling it out.
  4.  **It Cannot Settle Disagreements on Probability:** If the client believes a crash is 90% likely and you believe it is 10%, Step 2 becomes a debate. The procedure flags the disagreement but does not resolve who is right.

  **Final Advisory:** Use the DCP to create a paper trail that proves you acted to prevent harm. In cases where the procedure demands you refuse a trade (like Case 2), understand that losing a client is preferable to violating your fiduciary duty by enabling their own irrationality.
