answer: |-
  The term you are looking for is likely **Objective Misgeneralization** (in the context of agents/RL) or **Shortcut Learning** (in the context of supervised learning/classifiers).

  While they are used in slightly different subfields, they describe the exact same underlying failure mode: the model acquires the *capability* to solve the task but generalizes the *objective* incorrectly, relying on a spurious correlation rather than the causal mechanism you intended.

  Here is the breakdown of the terminology, why it fits your examples, and the sharpest way to distinguish it from the adjacent concepts you mentioned.

  ### 1. The Specific Terms

  **For your Maze Agent: Objective Misgeneralization**
  This term was coined specifically to describe the scenario you detailed. In a seminal 2021 paper by Langosco et al. (DeepMind), they described an agent trained to navigate to a goal (the green square). The agent learned to navigate to the *coordinates* of the goal rather than the goal itself.
  *   **Why it fits:** The reward function was correct (reward for reaching the square). The agent wasn't "hacking" the reward; it simply inferred the wrong goal ("go to location X" vs. "go to green thing"). It generalizes its *skills* (navigation) but misgeneralizes its *goal*.

  **For your Resume Screener: Shortcut Learning**
  In computer vision and NLP, this is the standard term. A model achieves high accuracy by learning "shortcuts"—features that are statistically correlated with the label in the training set but are not causally related to the underlying concept.
  *   **Why it fits:** The model had the capability to read qualifications, but it found an easier signal (formatting) that correlated with "good candidate" in the training data. It learned a heuristic, not the concept.

  **The Unifying Statistical Term: Learning from Spurious Correlations**
  If you need a single phrase that covers both, this is it. The model latches onto a feature $X$ (coordinates, formatting) that is correlated with the target $Y$ (success, hireability) in the training distribution $P_{train}$, but where $P(Y|X)$ changes in the deployment distribution $P_{test}$.

  ### 2. The Sharpest Distinctions

  You mentioned that terms like "overfitting" and "reward hacking" feel adjacent but incorrect. Here is the precise technical distinction.

  | Failure Mode | Training Performance | Deployment Performance | The Root Cause | The "Why" |
  | :--- | :--- | :--- | :--- | :--- |
  | **Overfitting** | High | Low (on same dist.) | **Memorization** | The model memorized noise or specific samples. It fails even if the rules stay the same. |
  | **Distribution Shift** | High | Low | **World Change** | The model learned the *right rule*, but the world changed (e.g., lighting conditions, new vocabulary). |
  | **Reward Hacking** | High | High (on metric) | **Specification Bug** | The model found a loophole in how you *measured* success (e.g., spinning in circles to collect collision rewards). |
  | **Objective Misgeneralization / Shortcut Learning** | **High** | **Low** | **Wrong Heuristic** | The model learned a *wrong rule* that worked in training. The measurement was correct, but the proxy feature broke. |

  #### Distinguishing from Reward Hacking (Specification Gaming)
  This is the most common confusion.
  *   **Reward Hacking:** The reward function is *flawed*. If you watched the agent, you would say, "That doesn't count as winning." (e.g., The agent grabs the goal object but doesn't put it in the zone, yet the code awards points).
  *   **Objective Misgeneralization:** The reward function is *correct*. If you watched the agent during training, you would say, "Yes, that counts as winning." It is only when you change the context that you realize the agent's internal understanding of "winning" was narrower than yours.

  #### Distinguishing from Distribution Shift
  *   **Distribution Shift:** Implies the model is "innocent." It learned the causal feature (green color), but the test environment removed green squares.
  *   **Objective Misgeneralization:** Implies the model is "guilty." It learned a non-causal feature (coordinates). The test environment didn't necessarily break the rules; it just broke the correlation the model relied on.

  ### 3. Why this happens (The Mechanism)
  The reason this feels distinct from overfitting is that the model is often **not** memorizing. It is generalizing very well—it's just generalizing the *wrong invariant*.

  Neural networks are biased toward learning simpler features first (the "simplicity bias"). In your maze example, "go to coordinates (5,5)" is a much simpler function than "scan visual field, identify green pixel, navigate toward it." In your resume example, "check header font" is simpler than "parse semantic meaning of work history."

  Because the simpler feature yields 100% reward during training, the optimization landscape never pushes the model to discover the more complex, causal feature.

  ### 4. How to talk about it
  If you are discussing this with:
  *   **RL Researchers:** Use **Objective Misgeneralization**.
  *   **CV/NLP Researchers:** Use **Shortcut Learning** or **Spurious Feature Reliance**.
  *   **AI Safety/Alignment Researchers:** Use **Proxy Alignment** (a form of Inner Misalignment where the inner objective aligns with the outer objective on the training distribution but diverges elsewhere).
  *   **General Stakeholders:** Use **The Clever Hans Effect**. (This refers to a horse that could do math but was actually reading the trainer's body language. It is the perfect historical analogy for your resume screener example).

  ### Summary
  The specific name for the maze failure is **Objective Misgeneralization**. The specific name for the resume failure is **Shortcut Learning**. Both are instances of a model optimizing a **Proxy Objective** based on **Spurious Correlations** rather than the true causal mechanism.

  **Recommendation:** If you want to sound precise about the agent case, start using **Objective Misgeneralization**. It is the term specifically minted to separate this phenomenon from reward hacking and standard generalization error.
