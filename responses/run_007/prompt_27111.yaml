answer: |-
  ### Exam Question

  **Kripke argues that we must reject dispositional accounts of meaning because they cannot accommodate the *normativity* of intention (the distinction between what I *will* do and what I *ought* to do). However, his own 'skeptical solution' grounds meaning claims in communal agreement rather than truth-conditions.**

  **Critically evaluate whether the skeptical solution successfully restores the normativity that dispositionalism lacked. Does appealing to the community merely relocate the problem, turning normativity into a matter of sociological regularity, or does the shift to 'assertibility-conditions' fundamentally change the nature of the normativity requirement?**

  ***

  ### Model Answer

  The central tension in Kripke's *Wittgenstein on Rules and Private Language* lies not in the skeptical paradox itself, but in whether the proposed cure is worse than the disease. Kripke motivates the paradox by demanding that any fact constituting meaning must be normative: it must justify my future applications of a rule, distinguishing correct use from incorrect use. He rejects dispositionalism because it collapses this normativity into regularity; if meaning is merely how I am disposed to act, I cannot make a mistake, only act differently. The question remains whether the skeptical solution escapes this collapse.

  The skeptical solution abandons the search for truth-conditions for meaning claims. Since no fact constitutes my meaning addition by '+', statements like "Jones means addition" are not true or false in a robust sense. Instead, they have *assertibility-conditions*. We are licensed to attribute meaning to an individual only if their responses align with those of the community. If Jones says '125' to '68+57', and the community agrees, the claim "Jones means addition" is assertible. If he says '5', it is not.

  At first glance, this appears to restore normativity. There is now an external standard against which Jones is judged. He *ought* to say '125' because that is what licenses his inclusion in the linguistic practice. However, a deeper analysis suggests this may merely be dispositionalism writ large. If the community's agreement is itself nothing more than a convergence of dispositions, then the "ought" is still derived from an "is." The community does not judge Jones by a Platonic standard of correctness; they judge him by their own inclinations. If the entire community were disposed to say '5' for '68+57', then '5' would be assertible. In this scenario, the distinction between "correct" and "incorrect" dissolves into "agreed upon" and "disagreed upon."

  Proponents of the skeptical solution argue this misunderstands the shift. By moving to assertibility-conditions, Kripke changes the game. We are no longer asking for a metaphysical justification for meaning (which the paradox proves impossible), but a pragmatic account of how language functions. The normativity preserved here is not robust or metaphysical, but *social*. It is sufficient to sustain the practice of correction and instruction. When a teacher corrects a student, they are not appealing to a transcendent fact, but enforcing the conditions of entry into the community. This social pressure creates a genuine "ought" relative to the goal of communication.

  However, this concession admits that the normativity is hypothetical: "If you want to be understood, you ought to say '125'." This differs from the original intuition that meaning carries a categorical normativity—that I ought to say '125' simply because that is what I *meant*. The skeptical solution saves the practice of rule-following from skepticism but at the cost of deflating the nature of meaning. It saves the *appearance* of normativity required for social coordination, but it cannot vindicate the intuition that my past meaning *forces* a specific future outcome independent of communal validation.

  Ultimately, the skeptical solution does not restore the robust normativity that motivated the rejection of dispositionalism. Instead, it argues that such normativity was a philosophical illusion. It replaces the "ought" of metaphysical correctness with the "ought" of social licensing. Whether this is a successful solution depends on whether one believes language requires metaphysical grounding or merely pragmatic utility. Kripke's Wittgenstein chooses the latter, leaving us with a stable practice but a deflated conception of meaning.

  ***

  ### Marking Scheme

  **Grade Band A (Excellent/Distinction):**
  *   **Move 1: Precise Normativity Objection.** Clearly articulates *why* dispositionalism failed (the inability to distinguish mistake from deviation/is-ought gap).
      *   *Common Error:* Vaguely stating dispositionalism is "wrong" without explaining the lack of normative force.
  *   **Move 2: Assertibility vs. Truth.** Explicitly distinguishes truth-conditions from assertibility-conditions as the mechanism of the solution.
      *   *Common Error:* Treating the community agreement as a new "truth-maker" rather than a condition for assertion.
  *   **Move 3: The "Super-Disposition" Critique.** Identifies the core tension: if the community is just a set of dispositions, has normativity really returned? (The "Quus" worry applied to the group).
      *   *Common Error:* Assuming the community solves the problem automatically without probing the status of communal dispositions.
  *   **Move 4: Deflationary Conclusion.** Recognizes that the solution likely changes the *type* of normativity (from categorical to hypothetical/pragmatic) rather than restoring the original robust version.
      *   *Common Error:* Concluding definitively that the solution "works" or "fails" without acknowledging the trade-off in the conception of meaning.

  **Grade Band B (Good/Pass):**
  *   **Move 1:** Summarizes the paradox and the rejection of dispositionalism adequately.
      *   *Common Error:* Spending too much time on the paradox setup rather than the solution's evaluation.
  *   **Move 2:** Explains the role of the community in the skeptical solution.
      *   *Common Error:* Describing the community as an "authority" rather than a condition of assertibility.
  *   **Move 3:** Attempts to discuss normativity but treats it as a binary (either it exists or it doesn't).
      *   *Common Error:* Fails to see that the *nature* of the normativity might have shifted (pragmatic vs. metaphysical).
  *   **Move 4:** Provides a conclusion, but it relies on summary rather than critical synthesis.
      *   *Common Error:* Restating the prompt's options without adjudicating the tension between them.

  **Grade Band C (Fail/Weak):**
  *   Recites the skeptical paradox without engaging the specific question about normativity.
  *   Confuses Kripke's view with Wittgenstein's own (or fails to distinguish "Kripkenstein").
  *   Claims the community "decides" what is true without discussing assertibility-conditions.
  *   *Common Error:* Treating the essay as a history report rather than a philosophical argument.
