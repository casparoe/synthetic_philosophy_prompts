  I teach an upper-level undergraduate seminar on rule-following and want a final exam essay question on Kripkenstein. It should be unanswerable by reciting the skeptical paradox and then summarizing the skeptical solution. I want the question to force students into the hardest remaining problem: whether the skeptical solution can preserve the normativity of meaning that originally motivated rejecting dispositionalism.

