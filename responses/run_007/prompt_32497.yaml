answer: |-
  **The argument's strongest link**

  Step (4) is the hardest link to resist because it grounds the philosophical abstraction in undeniable empirical reality. Regardless of one's meta-ethical commitments, the factual claim that a unit of resources (time or money) held by a wealthy agent can produce significantly more welfare if transferred to someone in extreme poverty is robust and widely supported by development economics and effective altruism research. If one accepts that morality is sensitive to the consequences of our actions, this empirical premise creates an inescapable pressure: as long as the marginal utility of resources remains higher for the recipient than the donor, the moral pressure to transfer them persists. This step gives the argument its teeth, transforming the demandingness objection from a theoretical worry about "maximization" into a practical crisis about global inequality that any plausible moral theory must address.

  **Candidate breaking points**

  The primary vulnerability lies in Step (3), which asserts that any moral theory with an impartial duty of beneficence necessarily lacks principled limits on sacrifice. This conflates *impartiality* (everyone's welfare counts) with *unlimited obligation* (I must secure everyone's welfare). Most moderate deontological, contractualist, or pluralist theories explicitly build limits into the structure of the duty itself, often distinguishing between "perfect" and "imperfect" duties. For example, a Kantian or Rossian view might posit a duty of beneficence that is impartial in scope but limited in intensity, requiring agents to adopt the ends of others without requiring them to abandon their own permissible projects. By claiming these theories lack "principled limits," the argument ignores the architectural differences between maximizing consequentialism and duty-based ethics that allow for agent-centered prerogatives.

  A secondary breaking point is Step (2), which identifies the source of the demandingness problem as the combination of impartiality and the absence of limits. This overlooks the possibility that the extreme demand is generated specifically by the *maximizing* structure of consequentialism, rather than impartial beneficence alone. A non-consequentialist theory can acknowledge that everyone's welfare matters (impartiality) while simultaneously holding that an agent's primary responsibility is to manage their own life and relationships, provided they meet a threshold of aid to others. If the demandingness objection is actually an objection to *maximization* rather than *impartiality*, then Step (5) fails, because moderate theories do not require agents to produce the *best* possible state of affairs, only a *good enough* one that respects moral constraints and personal integrity.

  **What each fix costs**

  Rejecting Step (3) saves moderate theories from the demandingness objection, but it forces the defender of those theories to solve the "line-drawing problem." If you assert that morality requires significant sacrifice but not *total* sacrifice, you must explain where the cutoff lies and why it is not arbitrary. Consequentialism avoids this by having a clear metric: keep giving until the marginal utility equals the marginal cost to the agent. A deontologist who says "give 10% but not 11%" risks appearing to gerrymander the theory to protect personal comfort. The cost here is theoretical elegance; you must defend a threshold of obligation that is principled rather than convenient, likely relying on contested notions of "reasonable sacrifice" or "fair share" that lack the precision of utility calculations.

  Rejecting Step (2) preserves the distinction between consequentialism and its critics, but it requires a deeper meta-ethical concession: that morality is not fundamentally about making the world as good as possible. To claim that the demandingness problem is unique to consequentialism is to admit that there are moral values (like personal integrity, special obligations, or agency) that can legitimately trump the production of good outcomes. This costs the simplicity of the moral point of view; it requires explaining why we are permitted to let preventable suffering occur simply because alleviating it would interfere with our personal projects. You save your theory from being too demanding, but only by accepting that morality is sometimes inefficient and that agents are not merely vessels for the creation of value.

  **Your overall diagnosis**

  The argument goes wrong at Step (3). It presents a false dilemma by assuming that any theory acknowledging the moral weight of distant strangers must inevitably collapse into the same demanding structure as act-consequentialism. This is a category error that ignores the diverse ways non-consequentialist theories limit obligations through concepts like imperfect duties, fair shares, or agent-centered prerogatives. The grad student's argument is a valid *reductio* against any theory that tries to combine impartial beneficence with a lack of limits, but since most plausible non-consequentialist theories explicitly include such limits, the demandingness objection does not generalize as claimed. We should reject Step (3) and accept the cost of defining a non-arbitrary threshold of sacrifice, rather than abandoning the distinction between maximizing and moderate moralities.
