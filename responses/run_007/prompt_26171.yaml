prompt: |-
  My friend was telling me about this thing called Parfit's hitchhiker. As he described it: you're a hitchhiker stranded in the desert, a driver comes along, you promise to pay him once you reach the city, but the driver realizes that once you're there you'll have no reason to actually pay—so he drives off. My friend says the lesson is that being rational can screw you over, and the only way out is to somehow make yourself irrational—to genuinely become the kind of person who pays even when it doesn't benefit you. He says this shows that rational self-interest is a broken ideal and that game theory gets human cooperation wrong at a fundamental level. I'm curious whether this is actually what the puzzle is meant to show. Is his summary fair? And does the "make yourself irrational" part really follow, or is there a way to make sense of the situation without giving up on rationality?
