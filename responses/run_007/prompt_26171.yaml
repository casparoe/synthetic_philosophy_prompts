      *   **Decision Theories:**
          *   *Causal Decision Theory (CDT):* Fails here.
          *   *Evidential Decision Theory (EDT):* Might help (paying is evidence you were picked up), but controversial.
          *   *Functional Decision Theory (FDT) / Timeless Decision Theory (TDT):* Solves it by treating the decision as an output of an algorithm. If the algorithm says "don't pay," the driver predicts that and doesn't drive. If the algorithm says "pay," the driver predicts that and drives. Therefore, the rational algorithm is "pay."

