      *   **Round 5: Skeptic responds.** Acknowledges the "certainty" point but reframes it as "perspectival limitation."
      *   **Round 6: Transformationist refines.** It's not about limitation, it's about flow.
      *   **Closing:** Summarize the refined positions.

  4.  **Refining the Argument (Self-Correction during drafting):**
