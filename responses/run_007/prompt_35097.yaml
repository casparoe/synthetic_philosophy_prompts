          *   *Participant 1 (Skeptic):* Reads it as dream skepticism (similar to Descartes, but pre-Cartesian). Focuses on the inability to distinguish waking from dreaming.
          *   *Participant 2 (Transformationist):* Reads it as ontological/existential transformation. Focuses on *wuhua* (transformation of things). Rejects the epistemological agenda.
      *   **Constraints:**
          *   Dialogue format.
          *   Each must press the other on the *weakest point* of their interpretation.
          *   Each must respond to the objections *actually raised* (no strawmanning).
