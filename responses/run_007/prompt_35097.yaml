      *   **Round 2: The Transformationist's Rebuttal.** David attacks the "epistemological import." He points to the closing line (*wuhua*).
      *   **Round 3: Skeptic presses the Weak Point (The Distinction).** Elena asks: If it's just transformation, why does Zhuangzi say there *is* a distinction (*fen*)? Skepticism accounts for the confusion; Transformationism struggles with the boundary.
