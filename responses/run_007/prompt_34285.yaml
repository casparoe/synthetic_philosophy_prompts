  2.  **Deconstruct the Gricean Framework:**
      *   *Cooperative Principle (CP):* "Make your conversational contribution such as is required, at the stage at which it occurs, by the accepted purpose or direction of the talk exchange."
      *   *Maxims:*
          *   Quantity: Make contribution as informative as required; do not make it more informative than required.
          *   Quality: Do not say what you believe to be false; do not say that for which you lack adequate evidence.
          *   Relation: Be relevant.
          *   Manner: Be perspicuous (avoid obscurity, ambiguity, be brief, orderly).
      *   *What is Said:* The literal propositional content, disambiguated and referenced.
      *   *Implicature:* What is suggested or conveyed beyond what is said, derived via the CP and maxims.
      *   *Speaker Meaning:* What the speaker intends to convey (can include both said and implicated).
      *   *Cancellability:* Implicatures can be cancelled without contradiction; what is said cannot.

  3.  **Analyse the Clinton Testimony (The "Case Study"):**
      *   *The Context:* A deposition/grand jury. Legally adversarial, but linguistically a Q&A format.
      *   *The Key Move:* Defining "sexual relations" narrowly (e.g., specific acts excluding oral sex, or the 'present tense' quibble regarding "is").
      *   *The Effect:* Listeners infer "No affair occurred."
