prompt: |-
  One of the episodes that's always stuck with me is Bill Clinton's grand jury testimony in 1998 during the Lewinsky affair. I'm not a lawyer and I don't care about the constitutional side, but the philosophically interesting thing is how much of it turns on the gap between what he literally said and what he allowed people to understand. As I remember it, the key moment wasn't a flat denial but a series of carefully worded answers: he had earlier denied sexual relations with Lewinsky in a deposition, and in the grand jury he defended that denial as literally true under a narrow definition of sexual relations that had been put before him, while at another point he appeared to quibble over whether the word is meant only the present tense or something continuing. Ordinary listeners plainly took him to be denying an affair, and his later defence was that he had been technically truthful.

  Treat the testimony as a case study in Grice on speaker meaning and implicature. In Gricean terms, what was said, what was implicated, and what did Clinton speaker-mean on the exchanges that matter? The interesting version of the lying charge is that he misled without saying something false, so work through whether the machinery — the cooperative principle, the maxims, especially quantity and manner, calculability and cancellability — can explain what he was doing, and whether his later defence is best understood as an appeal to cancellability, to a special sense of the terms, or to a change in the purpose of the exchange. Then say where the theory strains: legal testimony is adversarial, with a judge's definitions and a specific question on the record, not ordinary cooperative conversation, so how much of the framework carries over? Finally, what does the episode show about Grice — does it show that speaker meaning works fine and the real problem is lying versus misleading, or does it show that the framework quietly assumes a cooperative conversational purpose that testimony lacks? I'm less interested in a verdict on Clinton than in a careful mapping. Keep the legal and the conversational seperate in your analysis, please. Also, I'd like you to say how confident you are in the claims you make and to single out the one point you are least sure of. And write in British English.
