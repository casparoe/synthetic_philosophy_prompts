      *   *The 1976 Quote (Unended Quest):* "Darwinism is not a testable scientific theory, but a metaphysical research programme."
      *   *The 1978 Quote (Darwin Lecture):* "I have changed my mind... I am glad to have an opportunity to make a recantation."
      *   *Key Distinction:* Popper distinguishes between *logical status* (is it falsifiable in principle?) and *methodological status* (how is it used?). He also distinguishes between the *fact* of evolution, the *mechanism* of natural selection, and the *tautological* risk of "survival of the fittest."
      *   *Metaphysical Research Programme:* In Popper's view, metaphysics isn't necessarily "bad." It can be a heuristic framework that *generates* testable theories. It's pre-scientific or proto-scientific, not necessarily pseudoscientific.

  3.  **Drafting the Distinct Theses (The "Menu"):**
      *   *Thesis 1: The Tautology Problem.* Natural selection is defined by survival of the fittest, but "fitness" is defined by survival. Therefore, it's logically irrefutable (circular).
      *   *Thesis 2: The Historical/Unrepeatable Problem.* Evolution deals with unique historical events, not universal laws. Therefore, it's not testable like physics.
      *   *Thesis 3: The Heuristic/Framework Problem.* Darwinism provides a lens to look at biology, but specific claims (e.g., about specific adaptations) are the testable parts, not the general principle itself.
      *   *Thesis 4: The Pseudoscience Problem.* Darwinism is meaningless or dogmatic nonsense (strong creationist reading).

  4.  **Evaluating Each Thesis (a, b, c):**

      *   *Thesis 1 (Tautology):*
          *   (a) Plausible? Superficially, yes, if defined poorly.
          *   (b) Popper held it? Yes, he worried about the tautological nature of "fitness."
          *   (c) Recanted? Yes, he acknowledged that fitness can be defined independently of survival (e.g., physiological traits).

      *   *Thesis 2 (Historical Science):*
          *   (a) Plausible? Debatable, but a common critique of historical sciences.
