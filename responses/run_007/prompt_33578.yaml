prompt: |-
  In recent debates about AI, a prominent philosopher has argued that large language models and other systems that mimic human conversation are best understood as counterfeit people — analogous to counterfeit money. The analogy runs: just as counterfeit currency is designed to pass as legal tender while lacking the backing of a treasury and the guarantees that come with it, AI systems that pass as human interlocutors are designed to mimic the outward signs of personhood — intelligent speech, emotional expression, moral reasoning — while lacking the backing of genuine consciousness, intentionality, and moral responsibility. And just as we rightly criminalize the circulation of counterfeit money and require genuine currency to be distinguishable from it, we should require AI systems to be clearly marked as non-persons, and we should treat the deliberate deployment of undisclosed AI interlocutors as a serious wrong.

  I want to know how far this analogy actually holds. Please give me a systematic audit:

  1. A table of correspondences: what feature of counterfeit money maps to what feature of AI interlocutors, and what plays the role of the treasury, the criminal passer, the duped recipient, the genuine currency, and the legal tender laws.
  2. An analysis of where the mapping breaks. Which disanalogies are merely cosmetic, and which matter for the normative conclusions the analogy is meant to support?
  3. A verdict on whether the analogy's conclusions — mandatory disclosure, and the wrongfulness of passing AI off as human — survive once the disanalogies are on the table, or whether the analogy was doing more argumentative work than it can bear.

  Keep the entire response to 600 words or fewer. Take a definite position; don't just lay out considerations on both sides.
