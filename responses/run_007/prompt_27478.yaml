prompt: |-
  ok so I've been going back and forth on the realism debate in mechanistic interpretability and I think I need to step back and get clear on what the criteria even are before I pick a side. 

  the question is basically: when we find a feature or a direction in a neural network using some interpretability method (SAEs, probes, whatever), are we discovering a representation that's really "in" the network, or are we just imposing structure that's useful for us to talk about the network but doesn't correspond to anything the network itself is doing?

  I want the desiderata. What does an adequate theory of neural network representations have to deliver? Not a theory itself — I want the spec that any candidate theory has to meet before I even evaluate it. 

  Specifically I want:

  - The cases it has to handle. Like, a single neuron that fires for multiple unrelated concepts (polysemanticity), features that only show up in superposition, the case where a probe finds something but ablation doesn't change behavior, the case where two different methods find incompatible features and both seem well-supported. What are all the awkward cases the theory can't just wave away?

  - The distinctions it has to respect. For example, the difference between "this feature predicts behavior" and "the network actually uses this feature." Or the difference between a representation being real versus being useful to talk about. What distinctions does the theory collapse at its peril?

  - What counts as evidence for or against realism here? If I say "yes, the features are real representations," what kind of thing would prove me wrong? And if I say "no, they're just our projections," what would prove me wrong? A theory that can't be wrong isn't a theory.

  - Which of these desiderata are negotiable and which aren't. I suspect some of what people demand from a theory of representations is actually just their favorite interpretability method's assumptions dressed up as requirements. Flag those.

  - And the big one: are any pairs of these requirements jointly unsatisfiable? If the list itself contains a contradiction, I want to know that before I spend six months trying to satisfy all of it.

  Don't score existing views against the list — I'll do that myself. I just want the list, with the case or argument behind each item, and a clear statement of which ones would actually rule out which kinds of positions.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for a theory of neural network representations:

  1.  **Deconstruct the Request:**
      *   **Topic:** Realism vs. Anti-Realism in Mechanistic Interpretability (MI).
      *   **Goal:** Define the *desiderata* (criteria/specifications) for an adequate theory of neural network representations, *not* evaluate existing theories.
      *   **Specific Requirements:**
          *   Cases to handle (polysemanticity, superposition, probe/ablation mismatches, incompatible methods).
          *   Distinctions to respect (prediction vs. usage, real vs. useful).
          *   Falsifiability conditions (what counts as evidence for/against).
          *   Negotiable vs. Non-negotiable items (flagging methodological biases).
          *   Consistency check (are any requirements jointly unsatisfiable?).
      *   **Tone:** Philosophical rigor, technical precision, neutral (don't score existing views).

  2.  **Initial Brainstorming & Categorization:**
      *   The core tension is Ontological (do features exist?) vs. Epistemological (can we find them?) vs. Pragmatic (are they useful?).
      *   I need to structure this logically. Maybe start with the "Hard Cases" (phenomena to explain), then move to "Conceptual Distinctions" (definitions), then "Empirical Constraints" (evidence), and finally "Meta-Constraints" (negotiability/consistency).
      *   *Key tension:* The "Rashomon Effect" in MI (multiple valid explanations) vs. the desire for a "Ground Truth."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Phenomenological Coverage (The Cases)*
          *   Need to address Polysemanticity. A theory can't just say "neurons = features."
          *   Need to address Superposition. Features > Dimensions.
          *   Need to address the Probe/Ablation gap. Correlation vs. Causation.
          *   Need to address Method Pluralism. SAEs vs. Linear Probes vs. Causal Tracing. If they disagree, what does the theory say?
          *   *Refinement:* Make sure these aren't just "explain this phenomenon" but "explain this phenomenon *without breaking the definition of representation*."

      *   *Category 2: Conceptual Distinctions (The Boundaries)*
          *   Predictive Power vs. Causal Role. (The "Epiphenomenon" problem).
          *   Ontological Status vs. Explanatory Utility. (Real vs. Useful).
          *   Local vs. Global. (Is a feature real in one context but not another?)
          *   *Refinement:* The theory must define "representation" such that it doesn't collapse into "anything that correlates."

      *   *Category 3: Falsifiability (The Evidence)*
          *   Realism: What would show features *aren't* real? (e.g., perfect adversarial scrambling that keeps behavior but destroys features).
          *   Anti-Realism: What would show features *are* real? (e.g., finding the *same* feature across architectures without coordination).
          *   *Refinement:* Need specific empirical tests, not just philosophical musings.

      *   *Category 4: Negotiability (The Bias Check)*
          *   "Composability" is often demanded but might be too strong.
          *   "Human Interpretability" is definitely negotiable (networks might think in alien concepts).
          *   "Uniqueness" (one true basis) is highly contested.
          *   *Refinement:* Explicitly label which ones are methodological preferences vs. logical necessities.

      *   *Category 5: Consistency Check (The Impossibility Theorem)*
          *   Is there a tension between "Method Pluralism" and "Unique Ground Truth"? Yes.
          *   Is there a tension between "Causal Necessity" and "Distributed Robustness"? Yes.
          *   *Refinement:* Highlight the "Trilemma" of Interpretability.

  4.  **Fleshing out the Details (incorporating specific MI terminology):**
      *   Use terms like "superposition," "polysemanticity," "ablation," "null space," "basis."
      *   Ensure the distinction between *discovery* (finding what's there) and *stipulation* (imposing a basis) is clear.
      *   Address the "Rashomon" problem explicitly.

  5.  **Review against Constraints:**
      *   *Did I score existing views?* No.
      *   *Did I list cases?* Yes (Polysemanticity, Superposition, Probe/Ablation, Method Conflict).
      *   *Did I list distinctions?* Yes (Prediction/Causation, Real/Useful).
      *   *Did I list falsifiers?* Yes.
      *   *Did I flag negotiables?* Yes.
      *   *Did I check for contradictions?* Yes.

  6.  **Polishing the Argument:**
      *   Make the "Consistency Check" punchy. This is often the most valuable part for a researcher.
      *   Ensure the tone is analytical and structured.
      *   *Self-Correction during drafting:* I initially thought about putting "Human Interpretability" as a hard constraint. But the prompt asks for a theory of *representations*, not necessarily *interpretable* ones. I should flag that as negotiable.
      *   *Self-Correction on Realism:* Be careful not to define realism as "neurons." Realism can be about subspaces or directions. The theory needs to accommodate non-local features.

  7.  **Final Structure:**
      *   Introduction (Setting the stage).
      *   I. Phenomenological Coverage (The Hard Cases).
      *   II. Conceptual Distinctions (The Boundaries).
      *   III. Empirical Falsifiers (The Evidence).
      *   IV. Negotiable vs. Non-Negotiable (The Bias Filter).
      *   V. The Consistency Check (The Impossibility Results).
