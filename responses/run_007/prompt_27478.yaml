  8.  *(Final Polish)*: Ensure the distinction between "ontological realism" (features exist independently) and "functional realism" (features are the causal units) is clear in the distinctions section.

  9.  **Generate Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a specification document for a theory of neural network representations. It is designed to be theory-agnostic. It does not advocate for realism or anti-realism; it defines the conditions under which either position becomes tenable.

  Here are the desiderata.

  ---

  ### I. Phenomenological Coverage (The Hard Cases)
  *A theory of representations must account for these empirical phenomena without redefining them away. If a theory cannot accommodate these cases, it is empirically inadequate.*

  **1. The Polysemanticity Constraint**
  *   **The Case:** A single neuron (or direction) activates reliably for semantically unrelated inputs (e.g., a neuron firing for both "cat images" and "text about politics").
  *   **Requirement:** The theory must explain how a single physical substrate can constitute multiple representations, or explain why this is not a representation at all. It cannot simply assert "neurons = features" and ignore the overlap.
  *   **Failure Mode:** A theory that claims features must be 1-to-1 with neurons is falsified by standard MLP observations.

  **2. The Superposition Constraint**
  *   **The Case:** Networks represent more features than they have dimensions (e.g., 10,000 features in a 512-dimensional residual stream).
  *   **Requirement:** The theory must define what a "feature" is in a space where features are not orthogonal basis vectors. It must specify the conditions under which overlapping vectors count as distinct representations rather than noise.
  *   **Failure Mode:** A theory that requires features to be linearly independent is falsified by the existence of superposition.

  **3. The Probe/Ablation Mismatch**
  *   **The Case:** A linear probe can read out a concept with 99% accuracy from a layer, but ablating that direction (or zeroing the neurons) does not change the model's output behavior.
  *   **Requirement:** The theory must distinguish between *information present* and *information used*. It must specify whether a representation that is readable but causally inert counts as a "real representation of the network" or merely a "real representation in the data that the network preserves."
  *   **Failure Mode:** A theory that equates readout accuracy with causal existence collapses this distinction.

  **4. The Method Pluralism (Rashomon) Case**
  *   **The Case:** Sparse Autoencoders (SAEs) find Feature A; Causal Tracing finds Circuit B; Linear Probes find Direction C. They overlap partially but are not isomorphic. Both methods show predictive and causal validity within their own frameworks.
  *   **Requirement:** The theory must state whether there is a "ground truth" basis that these methods are approximating with varying error, or whether multiple incompatible bases are equally real (ontological pluralism).
  *   **Failure Mode:** A theory that insists on a single unique basis without a mechanism for resolving method conflict is inadequate.

  ---

  ### II. Conceptual Distinctions (The Boundaries)
  *A theory must maintain these distinctions. Collapsing them renders the theory trivial or category-mistaken.*

  **5. The Correlation vs. Mechanism Distinction**
  *   **The Distinction:** "This vector predicts the output" vs. "The network computes via this vector."
  *   **Requirement:** The theory must provide a criterion for *causal participation*. A representation cannot be defined solely by statistical correlation with inputs or outputs (epiphenomenalism).
  *   **Risk:** Collapsing this leads to "pan-computationalism," where any correlation counts as a representation, making the concept of representation meaningless.

  **6. The Ontological vs. Pragmatic Distinction**
  *   **The Distinction:** "This feature exists in the weights" vs. "This feature is useful for humans to describe the weights."
  *   **Requirement:** The theory must specify if representations are mind-independent properties of the network (like mass) or mind-dependent descriptions (like constellations).
  *   **Risk:** Collapsing this makes the realism debate purely semantic. If "real" just means "useful to humans," realism is trivially true but ontologically empty.

  **7. The Local vs. Global Distinction**
  *   **The Distinction:** "This feature exists in this specific activation context" vs. "This feature is a stable property of the learned function."
  *   **Requirement:** The theory must define the *scope* of a representation. Is a feature real only when it fires, or is it a permanent structure in the weights that is sometimes idle?
  *   **Risk:** If features are only real when active, the network has no stable structure. If they are only real in the weights, they may not correspond to dynamic computation.

  ---

  ### III. Empirical Falsifiers (The Evidence)
  *A theory must be vulnerable. Here is what would count as evidence against the two main poles.*

  **8. Falsifiers for Realism (Features are "In There")**
  *   **The "Null Space" Test:** If you can rotate the activation space arbitrarily (preserving the function) and destroy all interpretable features without changing loss or behavior, realism is weakened. (Note: This is hard because rotation usually breaks ReLU sparsity, but a theory must address *why* sparsity matters).
  *   **The "Alien Basis" Test:** If two identical models trained on identical data converge to solutions where no feature mapping can be found between them (no permutation/rotation aligns them), this suggests features are not attractors of the optimization landscape, weakening the claim that they are "natural kinds."
  *   **The "Scrambling" Test:** If you can scramble the internal representations (e.g., via random linear transforms layer-by-layer) and retrain only the heads to recover performance *without* restoring the original feature structure, it suggests the specific features were not necessary for the computation.

  **9. Falsifiers for Anti-Realism (Features are "Imposed")**
  *   **The "Convergent Discovery" Test:** If completely different methods (e.g., SAEs, clustering, causal intervention) independently converge on the *exact* same feature boundaries without being tuned to do so, anti-realism is weakened. It suggests a latent structure is constraining the methods.
  *   **The "Cross-Architecture" Test:** If the same semantic feature (e.g., "is_honest") appears in the same geometric configuration across different architectures (Transformer vs. Mamba) trained on different data, it suggests the representation is dictated by the task/computation, not the implementer's choice of basis.
  *   **The "Intervention Precision" Test:** If you can surgically edit a specific concept (e.g., change "France" to "Italy" in a fact) without affecting any other concept, this implies a modular structure that anti-realism struggles to explain as mere projection.

  ---

  ### IV. Negotiable vs. Non-Negotiable (The Bias Filter)
  *Many "requirements" are actually methodological preferences. These must be flagged.*

  **10. Non-Negotiable (Logical Necessities)**
  *   **Consistency:** The theory cannot claim a feature is "real" in one context and "noise" in an identical context without a specified boundary condition.
  *   **Causal Closure:** The theory must explain how representations translate to outputs. You cannot have a theory of representation that does not link to behavior.
  *   **Finite Complexity:** The theory cannot posit an infinite number of features to explain finite behavior (Occam's razor constraint).

  **11. Negotiable (Methodological Preferences)**
  *   **Human Interpretability:** *Flag:* Often treated as a requirement, but networks may represent concepts humans cannot name. A theory should allow for "real but unintelligible" features.
  *   **Linearity:** *Flag:* Many methods assume features are linear directions. A theory should allow for non-linear manifolds as valid representations.
  *   **Sparsity:** *Flag:* SAEs assume sparsity. A theory should not mandate sparsity as a condition for reality, though it may be an empirical fact.
  *   **Uniqueness:** *Flag:* The demand for a "single true basis" is a metaphysical preference. A theory could allow for multiple valid decompositions (ontological pluralism).

  ---

  ### V. The Consistency Check (Impossibility Results)
  *Before adopting a theory, check if it attempts to satisfy jointly unsatisfiable constraints.*

  **12. The Trilemma of Interpretability**
  You likely cannot satisfy all three of the following simultaneously. A theory must explicitly sacrifice one:
  1.  **Faithfulness:** The representation accurately reflects the actual causal mechanism of the network.
  2.  **Completeness:** The representation accounts for 100% of the network's behavior (no residual).
  3.  **Human-Intelligibility:** The representation is understandable to humans (e.g., sparse, semantic, linear).
      *   *Conflict:* If the network uses high-dimensional superposition to compute (Faithfulness + Completeness), the features will likely look like noise to humans (violating Intelligibility). If you force Human-Intelligibility (e.g., via strong sparsity constraints in SAEs), you likely lose Faithfulness or Completeness.

  **13. The Stability vs. Sensitivity Tension**
  *   **Constraint A:** Representations must be stable (the "dog" feature is the same vector across different dog images).
  *   **Constraint B:** Representations must be sensitive to context (the "dog" feature interacts differently with "bite" vs. "pet").
  *   **Conflict:** If a feature is a fixed direction (Stability), it is hard to explain how it performs context-dependent computation without invoking non-linear interactions that break the "fixed direction" definition. A theory must define how a static vector encodes dynamic logic.

  **14. The Ground Truth vs. Method Dependence Paradox**
  *   **Constraint A:** There is a fact of the matter about what features exist (Realism).
  *   **Constraint B:** Features are only identifiable relative to a specific method/objective function (e.g., an SAE with a specific sparsity penalty).
  *   **Conflict:** If the features change when you change the sparsity penalty of the SAE, in what sense are they "real" properties of the *network* rather than properties of the *SAE*? A realist theory must explain why different penalties reveal the *same* underlying structure rather than *different* structures.

  ---

  ### Summary of Use
  *   **To rule out Naive Realism:** Use Desiderata 1 (Polysemanticity) and 2 (Superposition). If the theory insists on 1-neuron-1-feature, it fails.
  *   **To rule out Naive Anti-Realism:** Use Desiderata 9 (Convergent Discovery) and 5 (Correlation vs. Mechanism). If the theory cannot explain why interventions work, it fails.
  *   **To rule out Instrumentalism:** Use Desiderata 6 (Ontological vs. Pragmatic). If the theory says "nothing is real, only useful," ask it to explain Desiderata 3 (Probe/Ablation Mismatch) without referencing utility.
  *   **To check your own bias:** Review Section IV. If you find yourself treating "Human Interpretability" as a Non-Negotiable, you are doing philosophy of mind, not mechanistic interpretability.

  This spec does not tell you which side to pick. It tells you when you are allowed to stop picking and start building.
