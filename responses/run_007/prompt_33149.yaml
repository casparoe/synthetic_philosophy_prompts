answer: |-
  # Activity: The Function Finder

  ### Setup
  **Room:** Four clusters of tables (4 students per group). Mix biology and philosophy majors evenly.
  **Time:** First 90 minutes of the 3-hour session (before break).
  **Framing:** Tell students: "Evolutionary biology often asks 'What is this trait for?' Today, you are adaptationist detectives. Your task is to identify the selective pressure that shaped specific traits. Assume natural selection is the primary architect."

  ### Rules & Group Structure
  1.  **Collaborative Storytelling:** Groups must agree on a single narrative per trait.
  2.  **Confidence Requirement:** For each trait, assign a "Confidence Score" (1–10) regarding the certainty that the trait is a direct adaptation.
  3.  **Evidence Standard:** You must propose a specific survival/reproductive advantage. "It just happened" is not permitted during the generation phase.
  4.  **Silence:** No consulting phones or texts. Rely on existing knowledge and reasoning.

  ### Materials: The Trait Deck
  Prepare four identical envelopes per group. Each contains six trait cards (mixed categories unknown to students).
  *   **Adaptations:** Peppered moth melanism (industrial revolution), Cactus spines (water conservation/herbivory), Nectar guides in flowers (pollinator efficiency).
  *   **Byproducts (Spandrels):** Male nipples (developmental constraint), Red color of blood (chemical necessity of iron), Whiteness of bones (calcium phosphate physics).
  *   **Disputed/Exaptations:** Human chin (sexual selection vs. structural buttress), Bird feathers (originally insulation vs. flight), Human language capacity (module vs. general intelligence).

  ### Timeline
  *   **0:00–0:10:** Introduction and grouping. Distribute envelopes.
  *   **0:10–0:50:** Group work. Students draft explanations and assign confidence scores.
  *   **0:50–1:20:** Presentations. Each group presents one trait from each category (randomly selected by you). They must state the function and their confidence score.
  *   **1:20–1:35:** **Break.** (Crucial: Let the confidence sit).
  *   **1:35–2:30:** The Reveal and Debrief.

  ### The Reveal
  Do not simply give answers. Hand each group a "Key" envelope.
  1.  **Color Code:** Traits are marked Green (Consensus Adaptation), Yellow (Disputed/Exaptation), Red (Byproduct/Constraint).
  2.  **Comparison:** Ask groups to compare their Confidence Scores against the Color Code.
  3.  **The Shock:** Highlight cases where Confidence was high (8–10) for Red traits (e.g., "We were 9/10 sure male nipples were for bonding/nursing support, but this is a developmental byproduct of female breast formation").

  ### Structured Debrief
  Guide the discussion using the following mappings. Do not lecture; ask questions that lead to these terms.

  1.  **The Panglossian Paradigm:** Ask, "Why was it so easy to generate a story for the red traits?" Introduce Gould & Lewontin's term for the assumption that every trait is an optimal adaptation.
  2.  **Adaptation vs. Spandrel:** Define *adaptation* (selected for) vs. *spandrel* (necessary byproduct of architecture, like the arches in San Marco). Ask: "Did anyone consider that nipples might be architectural necessities rather than selected traits?"
  3.  **Exaptation:** For the Yellow traits (feathers), introduce *exaptation*: traits selected for one use (insulation) later co-opted for another (flight).
  4.  **Burden of Proof:** Ask, "Who had to prove what?" In your groups, the default was 'function exists.' G&L argue the burden of proof lies on the adaptationist to rule out spandrels.
  5.  **"How Come?" vs. "What For?":** Distinguish causal history (how did this arise?) from current utility (what does this do now?). A spandrel may have utility now but wasn't selected *for* that utility.

  ### Limitations & Distortions
  Explicitly tell students what the activity simplified:
  *   **Pre-Classified Cases:** In real biology, the "Key" doesn't exist. Classifying traits is the actual work of science, not a reveal.
  *   **Binary Choices:** Real traits exist on a continuum. A trait can be partly adaptive and partly structural.
  *   **Time Pressure:** Real evolutionary hypothesis testing requires comparative data and phylogenies, not just plausibility stories.

  ### Predictable Resistance & Handling
  **Resistance 1: The "Ultimate Function" Argument.**
  *   *Who:* Strong biology majors.
  *   *Claim:* "Even if nipples are byproducts, they must be maintained by selection now, or they'd disappear. So they're adaptive."
  *   *Handling:* Acknowledge the logic (current utility) but distinguish *origin* from *maintenance*. Ask: "Does current utility explain the *origin*? If not, is calling it an adaptation historically accurate?"

  **Resistance 2: The "Just Wait" Argument.**
  *   *Who:* Students uncomfortable with uncertainty.
  *   *Claim:* "We just don't know the function of the chin yet. Future science will find it."
  *   *Handling:* Validate curiosity but pivot to evidence. Ask: "At what point does 'we haven't found it yet' become a faith statement rather than a hypothesis? How much negative evidence is required before we consider structural constraints?"

  **Resistance 3: The "Philosophical Skepticism" Dismissal.**
  *   *Who:* Some philosophy majors.
  *   *Claim:* "This just shows we can't know anything about evolution."
  *   *Handling:* Correct the record. G&L are not skeptics; they are better naturalists. They want *more* rigorous evidence, not less. Ask: "Does rejecting a bad story weaken biology, or strengthen it by removing noise?"

  **Closing:** Assign Gould & Lewontin for next session. Tell them: "Bring your frustration from today. Read the paper to see how formalizes what you just felt."
