prompt: |-
  I'm a distributed systems engineer — consensus protocols, replication, gossip, failure detectors, that kind of thing — and I don't have any philosophy background. I keep seeing Aumann's agreement theorem waved at as if it explains why nodes in a system end up agreeing on a value, but when I actually read the theorem stated informally, it's all about agents with common priors and posteriors and common knowledge of each other's rationality — roughly, two agents who start from the same prior can't end up with different posterior probabilities for an event if those posteriors are common knowledge.

  Restate Aumann's agreement theorem in the vocabulary I actually use: processes with local state, message passing, common knowledge in the distributed-systems sense (everyone knows, everyone knows everyone knows, and so on), consensus, quorums, synchrony and asynchrony, crash faults. Don't explain the theorem to me first; do the translation, and be honest about where my vocabulary has to be stretched. Then give me the residue report: which parts translate cleanly, which parts you had to fudge, and which parts have no counterpart at all in anything I'd build.

  In particular I want to know wether the theorem's "agreement" is the same thing as consensus in my world, or whether its a much thinner claim dressed up as one. And tell me whether the parts that don't survive are a gap in my vocabulary — something real I'm missing — or a sign that the theorem's assumptions (the common prior, the common knowledge of posteriors) are doing so much work that the result doesn't say what people claim it says about disagreement between actual reasoners.
