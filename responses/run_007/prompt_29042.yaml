          *   Step-by-step procedure (questions, order, sufficiency, flagging judgment calls).
          *   Handle conflicting studies.
          *   Determine when to recommend restriction vs. "we don't know."
          *   Run the procedure on three specific cases (Pesticide, Food Additive, Too Thin Evidence).
          *   Specific sections: The Procedure (~800 words), Why This Works (~400 words), Worked Cases (~1200 words), What This Can't Do (~300 words).
          *   Tone: Practical, accessible to non-statisticians/philosophers, honest about uncertainty.

  2.  **Deconstruct "Imprecise Probabilities" for this Context:**
      *   Instead of $P(Harm) = 0.7$, use $P(Harm) \in [0.3, 0.8]$.
      *   In regulatory terms, this translates to bounding the risk estimate based on study quality and consistency.
      *   Key concept: *Dilation* or *Interval Valued Probability*. If evidence conflicts, the interval widens. If evidence is strong and consistent, it narrows.
      *   Decision rule: If the *lower bound* of the risk interval exceeds a safety threshold, act. If the *upper bound* is below the threshold, don't act. If the threshold falls *within* the interval, uncertainty is too high (might need more data or precautionary principle depending on mandate).
      *   Need to translate this mathematical concept into a workflow for toxicologists.

  3.  **Drafting - Section 1: The Procedure (~800 words)**
