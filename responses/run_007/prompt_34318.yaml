      *   Check for clarity on the "Extrinsicness" objection (crucial for Step 4).
      *   Check for clarity on the "Sleep" worry (crucial for Step 1 rejection).

      *(Self-Correction during drafting)*: I need to make sure I don't just summarize Parfit. The student *knows* Parfit. They need to know where the *argument* as formulated is vulnerable. The vulnerability is often in the move from "Identity doesn't matter in fission" to "Identity doesn't exist in normal cases." Some argue Identity *does* exist in normal cases because the *conditions* (non-branching) are met. So Step 4 is the most contentious metaphysical leap. Step 5 is the most contentious ethical leap.

      *Decision:* I will structure the response by validating the argument (it's Parfit's), then offering three distinct "exit ramps" corresponding to major positions in the literature, analyzing the cost of each as requested. I will specifically address the sleep worry under the Animalist option.

