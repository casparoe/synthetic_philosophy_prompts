      *Drafting Item 3:* Third, consider whether the accuser holds a specific role-based duty to uphold the norm in question, such as a project lead ensuring meeting etiquette. If such a duty exists, their professional standing may persist despite personal flaws, though you must coach them on delivering feedback humbly. This step acknowledges that organizational roles confer authority that personal morality does not negate, but it cannot resolve deep-seated trust deficits without further mediation.

