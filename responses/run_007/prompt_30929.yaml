          *   Management context adds a layer of *role responsibility*. A manager might have standing even if personally flawed, because it's their job.
          *   Reform matters: Past hypocrisy vs. current pattern.
          *   Relevance: Is the hypocrisy relevant to the specific norm violated?

  3.  **Drafting the Decision Procedure (Items 1-3):**
      *   *Goal:* Screen out clear cases, flag discretion points.
      *   *Step 1: Verify the Norm and Violation.* Before assessing standing, is there actually a violation? If no, stop. If yes, proceed.
      *   *Step 2: Assess Relevance and Pattern.* Is the accuser's past behavior identical and ongoing? If they are currently violating the same norm, their standing is compromised (hypocrisy). If past/reformed, standing may remain.
      *   *Step 3: Role and Duty.* Does the accuser have a professional duty to enforce this norm? Role-based standing can override personal hypocrisy, but delivery matters.
      *   *Constraint Check:* Each item 2-4 sentences.

