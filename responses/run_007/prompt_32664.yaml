answer: |-
  Here is a complete design for your 75-minute seminar session.

  ### 1. The Thought Experiment: "The Commuter Link"

  **Rationale:**
  I have selected a variation on the **Teletransportation Paradox** (famously discussed by Derek Parfit and Daniel Dennett). This case is ideal for your purposes for three reasons:
  1.  **Structural Stability:** The physical facts (destruction of original, transmission of information, reconstruction of duplicate) can be held constant while the *description* varies wildly.
  2.  **Intuitive Volatility:** People's intuitions about survival/identity in this scenario are notoriously unstable and highly sensitive to wording (e.g., "travel" vs. "copying").
  3.  **Philosophical Stakes:** It directly targets the method of using "cases" to test theories of Personal Identity, making it relevant to a Methods course.

  To avoid students recognizing it immediately as "The Teleporter Case," I have branded it as a near-future mundane technology ("The Commuter Link").

  ---

  ### 2. The Two Versions (Handouts)

  **Instructor Note:** Do not label these "Version A" and "Version B." Label them **"Handout 1"** and **"Handout 2"** (or distribute by row). The differences are in **lexical choice, agency attribution, and temporal framing.**

  #### Handout 1: The "Continuity" Frame (Designed to elicit "Survival")

  > **Case Description: The Commuter Link**
  >
  > Every morning, Alex steps into the Link Booth at the suburban station. The scanner reads Alex's complete physical and psychological state. This information is transmitted instantly to the city station.
  >
  > Once the transmission is confirmed, the booth at the suburban station dissolves Alex's body into organic waste. Simultaneously, at the city station, a new body is assembled from raw materials, perfectly calibrated to Alex's state.
  >
  > This reconstructed person steps out of the booth, remembers walking into the suburban booth, feels continuous with Alex's past, and proceeds to work. The process is legally recognized as **transport**. Users report that they feel they have simply **traveled** from home to work. The company guarantees that **you arrive** safely on the other side.
  >
  > **Question:** When the person steps out of the city booth, is it **Alex**? Did Alex **survive** the process?

  **Framing Annotations (For Instructor Eyes Only):**
  *   *"Steps into/Steps out":* Implies agentive continuity.
  *   *"Dissolves":* Softer than "destroys."
  *   *"Calibrated to Alex's state":* Implies tuning an instrument, not making a copy.
  *   *"Legally recognized as transport":* Appeals to institutional authority.
  *   *"You arrive":* Second-person address creates identification.
  *   *"Survive":* Loaded term implying life continues.

  ***

  #### Handout 2: The "Replication" Frame (Designed to elicit "Death")

  > **Case Description: The Commuter Link**
  >
  > Every morning, Alex enters the Link Booth at the suburban station. The scanner records Alex's complete physical and psychological data. This data is sent to the city station.
  >
  > Once the data transfer is complete, the booth at the suburban station **terminates** Alex's body. Simultaneously, at the city station, a **duplicate** is **manufactured** from raw materials, **instantiating** Alex's data.
  >
  > This **replica** steps out of the booth, possesses memories of entering the suburban booth, behaves as Alex would, and proceeds to work. The process is technically classified as **replication**. Users are informed that a **copy is generated** on the other side. The company guarantees that **an identical subject** will be present at the destination.
  >
  > **Question:** When the **replica** steps out of the city booth, is it **Alex**? Did Alex **survive** the process?

  **Framing Annotations (For Instructor Eyes Only):**
  *   *"Enters/Terminates":* "Terminates" implies killing/ending.
  *   *"Duplicate/Manufactured/Replica":* Industrial language implies distinct artifact.
  *   *"Instantiating":* Computational language implies software/hardware distinction.
  *   *"Copy is generated":* Passive voice, emphasizes production over travel.
  *   *"Identical subject":* Third-person distancing.
  *   *Question phrasing:* Uses "replica" in the question prompt itself to prime the distinction.

  ---

  ### 3. The Procedure (75 Minutes)

  **0:00–0:05 | Introduction & Distribution**
  *   Welcome the class. Do **not** mention intuition pumps, framing, or Dennett yet.
  *   Say: "Today we are testing a specific methodological tool we use in philosophy: the hypothetical case. We're going to run a quick diagnostic on how we process these cases."
  *   Split the room physically (Left side = Handout 1, Right side = Handout 2).
  *   **Crucial Instruction:** "Do not show your handout to anyone else. Do not discuss the specific wording with your neighbors yet. Keep your eyes on your own paper."

  **0:05–0:15 | Individual Judgment (10 mins)**
  *   Ask students to read the case silently.
  *   Task: On a slip of paper (or digital poll), write:
      1.  Yes/No: Is it Alex?
      2.  One sentence explaining *why*.
  *   Collect these slips (or have them hold onto them). This creates a record of their "pre-discussion" intuition.

  **0:15–0:30 | Within-Group Discussion (15 mins)**
  *   Have students turn to the 2–3 people nearest to them (who have the *same* handout).
  *   Prompt: "Compare your answers. Did your group reach a consensus? What features of the case drove your judgment? Was it the technology? The memory? The destruction?"
  *   Circulate the room. Listen for them discussing the *wording* (e.g., "The word 'terminates' really bothered me"). If they notice the wording, tell them: "Note that observation for the end."

  **0:30–0:45 | The Reveal & Between-Group Comparison (15 mins)**
  *   Bring the class back together.
  *   Ask for a show of hands: "How many said Yes, it is Alex?" (Expect Group 1 to be higher).
  *   Ask for a show of hands: "How many said No, it is not Alex?" (Expect Group 2 to be higher).
  *   **The Reveal:** "I need someone from Group 1 to read the first sentence of their handout. Now, someone from Group 2, read the first sentence of yours."
  *   Allow the murmur of realization to happen.
  *   **Damage Control:** Acknowledge the trick immediately. "You were given structurally identical scenarios with different rhetorical framing. You were not tricked to fool you, but to generate data for our methodological analysis."

  **0:45–1:10 | The Debrief (25 mins)**
  *   (See detailed plan below).

  **1:10–1:15 | Wrap Up**
  *   Assign reading (Dennett, "Intuition Pumps").
  *   Dismiss.

  ---

  ### 4. The Debrief Plan (25 Minutes)

  **Goal:** Move from "I feel manipulated" to "This is how philosophical methodology works."

  **Phase 1: Mapping the Mechanics (5 mins)**
  *   Ask: "Which specific words tipped the scale?"
  *   Write them on the board in two columns (e.g., *Travel vs. Replication*, *You vs. Subject*, *Dissolve vs. Terminate*).
  *   **Point:** The *logical structure* (Input: Alex + Process: Scan/Destroy/Rebuild + Output: Psychologically Continuous Being) was identical. The *narrative architecture* did the persuasive work.

  **Phase 2: Connecting to Dennett (10 mins)**
  *   Introduce the term **Intuition Pump**.
  *   Explain Dennett's view: Thought experiments are not logical proofs; they are tools to "pump" intuitions that we then examine.
  *   **Discussion Question:** "Dennett argues we should use intuition pumps *carefully*, not discard them. If a simple word swap changes the verdict, is the method broken?"
  *   **Key Concept:** **Knobs and Dials.** Explain that the framing differences acted as "dials" turning the volume of the intuition up or down. In philosophy, we often turn these dials unconsciously. The method requires us to identify the dials and ask: *Should this dial matter?*
      *   *Example:* Should the difference between "dissolve" and "terminate" matter to the metaphysics of identity? If not, the intuition is suspect.

  **Phase 3: Methodological Implications (10 mins)**
  *   **The Risk:** If philosophical progress relies on shared intuitions, and intuitions are rhetorically malleable, is philosophy just sophisticated rhetoric?
  *   **The Defense:** Intuitions are data points about our cognitive architecture. The fact that "replica" triggers a "death" response tells us something about how humans conceptualize identity (e.g., we value material continuity more than we admit).
  *   **Supplementation:** Dennett suggests we need to "recalibrate" pumps. How do we fix this case?
      *   *Student Idea:* Use neutral language.
      *   *Instructor Push:* Is neutral language possible? (Lead them to see that even "neutral" language is a frame).
      *   *Conclusion:* We must run the case multiple ways (as we just did) to triangulate the underlying principle.

  ---

  ### 5. Candid Troubleshooting Note

  **Predictable Problem 1: The "Gotcha" Reaction**
  *   **What happens:** Students feel clever or cheated. "Oh, I saw that 'terminate' was loaded." This can shut down the philosophical point because they think they've "solved" the activity by noticing the trick.
  *   **Fix:** Validate them immediately during the reveal. "If you noticed the wording, that's excellent. That is exactly the skill this seminar is trying to build. But ask yourself: Did noticing it stop the intuition from hitting you? Most of you still voted according to the frame before you analyzed it. That lag is where the philosophy lives."

  **Predictable Problem 2: One Group Dominates**
  *   **What happens:** If Group 1 (Continuity) is much more vocal than Group 2, the reveal feels lopsided.
  *   **Fix:** During the within-group discussion, circulate to the quieter group and prompt them: "Make sure you write down *why* you said No. You'll need to defend that against the other group in a moment."

  **Predictable Problem 3: "Well, the facts *weren't* the same."**
  *   **What happens:** A sharp student argues, "Calling it a 'replica' *makes* it a replica. You changed the ontology, not just the framing."
  *   **Fix:** This is actually a great philosophical objection. Agree with them! "This is the crux of the debate. Does the *description* change the *reality*? If I describe a killing as a 'termination,' have I changed the moral fact? Or just your access to it? Dennett would say you are conflating the map with the territory. Our job is to separate the territory (the physical process) from the map (the handout)."

  **Predictable Problem 4: Timing Overrun**
  *   **What happens:** The reveal discussion gets heated and eats into the Dennett lecture.
  *   **Fix:** Hard stop at minute 45. Say: "We are going to pause the debate about *whether* Alex survived. We are now moving to the question of *how we decided*. The verdict matters less than the mechanism of the verdict."

  **Logistics Tip:**
  Print the handouts on different colored paper (e.g., White and Buff). It makes it visually obvious during the reveal that there were two distinct texts, which helps the "Aha!" moment land faster.
