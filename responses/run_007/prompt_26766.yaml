answer: |-
  Your intuition touches on one of the deepest problems in decision theory and moral philosophy, often discussed alongside Newcomb's Problem and the Prisoner's Dilemma. You are asking whether the distinction between rational and irrational collapses if we can always justify an "irrational" act by pointing to a "rational" prior decision to adopt the disposition that caused it.

  The argument does not go wrong, but your worry highlights a need to distinguish between different **levels** and **times** of evaluation. The distinction between rational and irrational does not dissolve; rather, it becomes multi-layered.

  First, we must distinguish between **act-evaluation** and **disposition-evaluation**. In the Hitchhiker case, the *act* of paying the driver once you are safely in town is locally irrational relative to your immediate self-interest. At that specific moment, you have the money, you are safe, and paying you nothing yields a better immediate outcome for you. If "rationality" means "maximizing utility at the current node," the act is irrational. However, the *disposition* to keep promises is globally rational. Having that psychological trait makes you the kind of person drivers trust, which secures the ride in the first place. The word "irrational" is still doing work because it accurately describes the action's relationship to your *immediate* incentives, distinguishing it from actions that are beneficial in the moment.

  Second, we must distinguish between **ex-ante** (before the ride) and **ex-post** (after the ride) rationality. It is rational *ex-ante* to bind your future self to pay, because that binding is the only way to get rescued. It is irrational *ex-post* to pay, because the rescue has already happened and the binding no longer serves a causal function regarding the rescue. The tension you feel arises because standard Self-Interest Theory assumes rationality must be consistent across time, but Parfit uses this case to show that strict adherence to immediate self-interest at every moment (naive maximization) is self-defeating.

  Therefore, the distinction holds because "rational" and "irrational" are not monolithic labels but depend on whether we are evaluating a long-term strategy or a specific move within that strategy. The "irrationality" of the payment is the price of admission for the "rationality" of the survival strategy; if the payment were locally rational (i.e., if you wanted to pay for its own sake), you wouldn't need a special disposition to do it, and the driver wouldn't need to test your character.

  \answer{The distinction remains valid because instrumental rationality applies to the strategic selection of dispositions, whereas local irrationality describes an action's deviation from immediate self-interest at the moment of choice.}
