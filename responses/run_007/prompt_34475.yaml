      *   **Diagnose the Error:** The argument relies on an inference from "External Determination" to "Introspective Opacity." This is the **Transmission Principle** or a specific view on **Privileged Access**.
      *   **Target Step 3 (and consequently 5):** This is the most common externalist defense (Compatibilism).
      *   **Explain the Defense:**
          *   *Individuation vs. Access:* Externalism tells us what *makes* a thought the thought it is. Introspection tells us *what* thought we are having. These are compatible.
          *   *Example:* I know I'm thinking about my mother. I don't need to know her DNA to know I'm thinking about *her*. Similarly, I know I'm thinking about water. I don't need to know it's H2O to know I'm thinking about *water*.
      *   **Address the Pain Case (Step 6):** Pain is special. It's phenomenal. Externalism usually applies to *broad content* (reference), not *narrow content* or phenomenal character. One can be an externalist about 'water' but an internalist about 'pain'. (Burge's distinction).
      *   **Theoretical Price Tag:**
