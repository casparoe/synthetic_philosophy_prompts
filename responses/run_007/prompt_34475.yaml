      *   *Step 3:* The crucial inference. Does externalism entail *opacity* of meaning to the subject? Externalists usually deny this. They argue for "compatibilism."
      *   *Step 4:* Assumes a Language of Thought (LOT) framework. Not all externalists accept LOT, but many do (Fodor, though Fodor is tricky on externalism). Even without LOT, the issue applies to propositional attitudes.
