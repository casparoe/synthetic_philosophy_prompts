prompt: |-
  So my friend in phil language built this argument and I've been stuck on it for a week. It seems to show that semantic externalism — the Twin Earth stuff — collapses into something nobody would accept, and I can't find the step that's wrong.

  (1) The meaning of 'water' is fixed by the actual stuff in the enviroment (Putnam's Twin Earth: Oscar on Earth means H2O, Twin Oscar on Twin Earth means XYZ, even though they're molecule-for-molecule identical).

  (2) So meaning is not determined by what's in the head. Two people in the same brain state can mean different things.

  (3) If meaning isn't determined by what's in the head, then what you mean by a word isn't transparent to introspection. You can't tell just by reflecting what 'water' means for you — you'd have to check the environment.

  (4) Now apply this to the language of thought. If believing is tokening mentalese sentences with meanings, then what you believe depends on what your mentalese words mean. And if (3) is right, then what your mentalese words mean isn't transparent to introspection either.

  (5) So you can't know what you believe just by introspection. You might think you believe that water is wet, but you could be wrong about what WATER* means in your own mentalese.

  (6) Now take the concept PAIN*. Surely you can know by introspection whether you believe you're in pain. In fact, if you're in pain, you know it, and you know you believe it. First-person authority about pain is about as basic as it gets.

  (7) But (5) says you can't know what you believe by introspection, PAIN* beliefs included. So (5) and (6) contradict.

  (8) (5) came from applying externalism to mentalese. So either externalism doesn't apply to mentalese (but why wouldn't it?), or externalism is false, or first-person authority about pain isn't what we think it is.

  She says the argument shows externalism is self-defeating because it forces you to give up first-person authority about your own pain, which is a non-starter. I want to keep both externalism AND first-person authority about pain, but I don't see how. Which step do I reject, and what's the theoretical price tag? And tell me what would change your mind about your diagnosis — like, what argument or consideration would make you switch to a different step.
