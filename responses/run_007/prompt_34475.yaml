      *   *The Compatibilist Strategy:* Externalism is about *individuation* of content, not *access* to content. I can know *that* I am thinking about water without knowing the microstructural essence of water.
      *   *The Distinction:* Distinguish between knowing the *content* (I am thinking that water is wet) and knowing the *conditions that individuate* that content (that water is H2O).
