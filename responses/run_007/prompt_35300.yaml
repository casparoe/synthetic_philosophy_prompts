answer: |-
  The Rietdijk–Putnam argument compels a block universe only if you accept the hidden metaphysical premise that ontological reality must be an absolute, frame-independent property rather than a relation relative to an observer.

  The physics portion of the argument is uncontroversial and consists of two claims derived from Special Relativity. First, simultaneity is relative: there is no unique, frame-independent way to slice spacetime into "past," "present," and "future." Second, for any event E spacelike-separated from your current location, there exists some inertial reference frame in which E is simultaneous with your current "now." These premises establish only a geometric relationship between coordinates; they do not, on their own, dictate what exists.

  The philosophical work is done entirely by the metaphysical premises layered on top of this geometry. The first metaphysical premise is the Principle of Reality: if an event is simultaneous with your "now," it is real. The second metaphysical premise is the Principle of No Privileged Observers: if an event is real for one observer, it is real for all observers. Putnam combines these by imagining a passing observer O for whom your future event E is simultaneous with their "now." Since O is real (they are passing you), and E is simultaneous for O, E must be real for O. By the Principle of No Privileged Observers, if E is real for O, it must be real for you, absolutely. This forces the conclusion that your future is already real, creating the block universe.

  The gap you identified is precisely the second metaphysical premise, and your intuition that reality could be frame-relative is the standard philosophical counter-argument known as relativized presentism. You are suggesting that "exists" is not a monadic predicate (something is either real or not) but a dyadic relation (something is real *relative to* a frame). If you adopt this view, the argument stalls at the step where Putnam moves from "E is real for O" to "E is real simpliciter." You can accept the physics entirely while maintaining that E is real for O but not yet real for you, without contradiction, provided you abandon the idea of a single, frame-independent ontology.

  Putnam attempts to block your move by arguing that making reality frame-relative renders the concept of "existence" trivial, akin to "visibility." He contends that if what exists depends on your state of motion, then there is no shared world, only private worlds, which violates the spirit of realism. However, this defense relies on a prior commitment to absolute existence rather than proving it. To resist the block universe conclusion, you must dig in exactly here: deny that "real" must be transitive across reference frames and accept that ontological status is as relative as simultaneity itself.
