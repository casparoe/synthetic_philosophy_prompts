      *(Self-Correction on Tier 1)*: Manheim & Garrabrant actually categorize Goodhart into 4 types. Regressional, Extremal, Causal, Adversarial. The user's view conflates them. Pointing out that *Causal Goodhart* is distinct and less severe is a strong formal defeater.

      *(Self-Correction on Tier 3)*: The user says fixes "move the gaming up a level." The counter is that moving it up a level increases the *energy* required to game. If the energy required exceeds the optimizer's capacity, gaming doesn't happen. This breaks the "default behavior" claim.

