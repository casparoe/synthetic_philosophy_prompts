answer: |-
  # Diagnostic Quiz: Which Theory of Material Constitution Do You Actually Hold?

  **Instructions:** For each scenario below, select the option that best matches your intuitive verdict about what exists, what survives, or what goes out of existence. Do not worry about philosophical labels; answer based on what you think is actually happening in the case.

  ### Case 1: The Bronze Statue
  *A sculptor takes a specific piece of bronze and casts it into the shape of a statue. Later, the statue is squashed flat by a heavy weight.*

  **1. At the moment the bronze cools into the shape of the statue, how many material objects occupy that space?**
  A. Zero. There are only particles arranged statuewise.
  B. One. Both "the statue" and "the piece of bronze" refer to this single object.
  C. One. "The statue" refers to this object, but "the piece of bronze" does not refer to an object at this time.
  D. Two. A statue and a piece of bronze are both present.

  **2. After the statue is squashed flat, does the object that was the statue still exist?**
  A. No. It went out of existence.
  B. Yes. It is now a lump of bronze.

  **3. After the statue is squashed flat, does the object that was the piece of bronze still exist?**
  A. No. It went out of existence.
  B. Yes. It is now a lump of bronze.
  C. This question is mistaken; that object never existed in the first place.

  ### Case 2: Tibbles the Cat
  *Tibbles is a cat sitting on a mat. Tibbles has a tail. Let "Tib" name the proper part of Tibbles consisting of the whole cat except the tail.*

  **4. Before the tail is removed, how many cats are on the mat?**
  A. Zero. There are only particles arranged catwise.
  B. One. Tibbles is the only cat.
  C. Two. Tibbles is a cat, and Tib is also a cat.

  **5. If the tail is surgically removed and destroyed, does Tibbles survive?**
  A. No. Tibbles goes out of existence.
  B. Yes. Tibbles is now tailless.

  ### Case 3: The Ship of Theseus
  *A wooden ship is docked. Over ten years, every single plank is replaced one by one with new planks. The old planks are stored in a warehouse. At the end of ten years, the old planks are reassembled into a ship.*

  **6. Regarding the ship in the dock (with all new planks): Is it the same object as the original ship?**
  A. No. The original object went out of existence as planks were replaced.
  B. Yes. It is the same object.

  **7. Regarding the ship in the warehouse (reassembled from old planks): Is it the same object as the original ship?**
  A. No. It is a new object made of old parts.
  B. Yes. It is the original object.
  C. Both ships have an equal claim, or the question has no determinate answer.

  ### Case 4: The Toy Tower
  *A child builds a tower out of six distinct blocks. The child then knocks the tower over, leaving the blocks in a pile.*

  **8. When the tower is knocked over, does the object "the tower" go out of existence?**
  A. Yes. The tower ceases to exist; only the blocks remain.
  B. No. The tower still exists, it is just disassembled.
  C. The tower never existed to begin with.

  ### General Ontology
  *These questions ask about the nature of the objects in the cases above.*

  **9. Consider the statue while it is standing. Is it more fundamental to say "a statue exists here" or "particles are arranged statuewise here"?**
  A. "A statue exists here" is the fundamental truth.
  B. "Particles are arranged statuewise here" is the fundamental truth; "statue" is just a shorthand.

  **10. Consider the statue's existence from the moment it is cast to the moment it is squashed. Is the whole statue present at every single moment it exists, or is the statue spread out across time like a movie reel?**
  A. The whole statue is present at every moment it exists.
  B. The statue is spread out across time; only a temporal stage is present at any moment.

  ***

  # Scoring Key & Logical Space Analysis

  ## 1. The Logical Space of Answers
  The quiz maps responses across three dimensions: **Ontological Count** (How many objects?), **Survival Conditions** (What persists through change?), and **Temporal Mode** (How do objects exist in time?).

  *   **Dimension 1 (Existence Count):** Derived primarily from Q1, Q4, Q8.
      *   *Nihilist:* 0 composite objects (A answers).
      *   *Monist:* 1 composite object (B or C answers).
      *   *Pluralist:* 2+ coincident objects (D/C answers).
  *   **Dimension 2 (Sortal/Material Priority):** Derived from Q1, Q3, Q6, Q7.
      *   *Matter-Neutral:* The object survives loss of form (Q2=B).
      *   *Form-Essential:* The object dies when form is lost (Q2=A).
      *   *Sortal-Sensitive:* Only the dominant kind exists (Q1=C).
  *   **Dimension 3 (Temporal Location):** Derived from Q10.
      *   *Endurantist:* Wholly present (A).
      *   *Perdurantist:* Temporal parts (B).

  ## 2. Locating the Five Positions

  | View | Q1 (Count) | Q2/Q3 (Survival) | Q10 (Time) | Profile |
  | :--- | :--- | :--- | :--- | :--- |
  | **Eliminativism** | A (Zero) | A (No) | A or B | Denies composites entirely. Particles survive, objects do not. |
  | **Dominant Kind** | C (One, Statue) | Q2=A (Statue dies), Q3=C (Piece N/A) | A (Wholly) | Only the statue exists. The "piece" description fails to refer while the statue exists. |
  | **One-Object** | B (One, Both) | Q2=A (Statue dies), Q3=A (Piece dies) | A (Wholly) | Statue = Piece. They share a fate. If the statue is destroyed, the piece (as identified) is destroyed. |
  | **Constitution** | D (Two) | Q2=A (Statue dies), Q3=B (Piece survives) | A (Wholly) | Two distinct objects coincide. Different modal properties allow one to survive where the other perishes. |
  | **Four-Dimensionalism**| D (Two) | Q2=A (Statue dies), Q3=B (Piece survives) | B (Temporal Parts) | Two distinct space-time worms share a temporal part. |

  ## 3. Separating the Views

  **The Constitution vs. Four-Dimensionalism Split**
  These two views occupy the same coordinates on existence counts and survival conditions (Pluralist + Form-Essential for Statues). They are separated **exclusively by Question 10**.
  *   **Residual Test:** If a respondent scores as Constitution on Q1–Q9 but selects **10B**, they are a Four-Dimensionalist. If they select **10A**, they are a Constitution theorist (Endurantist). This is the *only* item on this key that separates them.

  **The One-Object vs. Dominant Kind Split**
  These views are separated primarily by **Question 1** and **Question 3**.
  *   **One-Object:** Claims *both* terms refer to the one thing (Q1=B). Consequently, the "piece" is destroyed when the statue is (Q3=A).
  *   **Dominant Kind:** Claims the "piece" term fails to refer while the statue exists (Q1=C). Consequently, the "piece" cannot survive because it didn't exist (Q3=C).

  **The Eliminativism Split**
  Eliminativism is isolated by **Question 9** and the "Zero" options in Q1, Q4, Q8. If a respondent consistently chooses "particles arranged X-wise" over "X exists," they are sorted here regardless of survival intuitions.

  ## 4. Unstable or Unoccupied Combinations

  *   **The "Brute Coincidence" Combo:** (Q1=D "Two Objects" + Q2/Q3 "Identical Survival").
      *   *Diagnosis:* **Unattractive.** This posits two distinct objects that nonetheless share all the same matter, location, and survival conditions. It incurs the ontological cost of pluralism without the explanatory benefit of solving modal puzzles (like the squashing case).
  *   **The "Ghost Piece" Combo:** (Q1=B "One Object/Both Refer" + Q3=B "Piece Survives Squashing").
      *   *Diagnosis:* **Incoherent.** If the statue and piece are one object (Q1=B), they cannot have different fates. If the piece survives squashing but the statue does not, they must be distinct (Constitution) or the statue description failed (Dominant Kind).
  *   **The "Disassembled Tower" Combo:** (Q8=B "Tower Survives" + Q1=A "Zero Objects").
      *   *Diagnosis:* **Incoherent.** One cannot claim composite objects do not exist (Eliminativism) while simultaneously claiming a specific composite object (the tower) survives destruction of its arrangement.

  ## 5. Most Awkward Commitments

  *   **One-Object View:** You must claim that when the statue is squashed, the *piece of bronze* is destroyed, even though the exact same bronze matter is sitting right there in front of you.
  *   **Constitution View:** You must claim that two material objects are in the exact same place at the exact same time, sharing all their atoms, without merging into one.
  *   **Dominant Kind View:** You must claim that the "piece of bronze" pops out of existence when the statue is cast and pops back into existence when the statue is melted.
  *   **Eliminativism:** You must claim that strictly speaking, you are not reading this quiz; only particles arranged "reader-wise" are doing so.
  *   **Four-Dimensionalism:** You must claim that you are not wholly present right now; only a thin time-slice of you is here, while the rest of you is spread out across the past and future.
