      1.  **Epistemic Limitation:** Author is the source, but we can't always reach them. (Least concessive).
      2.  **Semantic Autonomy (New Criticism):** Author is the source, but the text is an independent object.
      3.  **Hermeneutic Dialogue:** Author provides a horizon, but reader brings another. Meaning is the fusion.
      4.  **Interpretive Community (Fish):** Author is a member of a community, but the community dictates validity.
      5.  **The Author-Function (Foucault/Barthes):** The biographical author is irrelevant to the "scriptor."
      6.  **Radical Plurality (Vulgar Barthes):** Authorial intent is a constraint to be shattered; meaning is infinite. (Most concessive).

