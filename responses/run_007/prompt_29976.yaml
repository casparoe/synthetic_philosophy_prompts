      I will build these distinctions into the Theses.

      *Verdicts:*
      1.  Inaccessible: Platitude (sometimes).
      2.  Irrelevant to Validity (New Criticism): Substantive/Defensible.
      3.  Constituted by Reader: Substantive/Defensible.
      4.  Author Does Not Exist (Ontologically): Substantive (as function), False (as person).
      5.  No Authority/Infinite Meaning: Self-undermining.

