          *   *Analysis:* This is a classic objection to the strict economic view. Schelling did discuss pre-commitment. However, is it *honoring the sunk cost* or is it *using the payment as a signal/device*?
          *   *Nuance:* In strict decision theory, the money is gone. The rationality comes from the *pre-commitment strategy* chosen *ex-ante* (before paying), not the *ex-post* decision (after paying). Once the money is paid, it *is* sunk. If I decide to go to the gym *today* solely because "I already paid," strictly speaking, that's still fallacious reasoning *at the moment of decision* unless the psychological utility of not wasting money is counted as a current benefit.
