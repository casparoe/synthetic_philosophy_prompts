      *   Cup: water -> coffee dregs -> stain -> same sip -> water -> water -> cup (envoi).
      *   Key: house -> lock thought -> iron -> same lock -> weight -> swallow -> turn (envoi).
      *   Shoe: bare foot -> walk again -> laces -> leather -> wear -> left -> shoe (envoi).
      *   Lamp: hum -> filament -> circle -> judgment -> flickers -> glare -> lamp (envoi).
      *   Phone: silent -> smash -> dial -> blank face -> signal -> silence -> phone (envoi).
      *   Dust: settling -> throat -> grit -> surface -> ash -> cloud -> dust (envoi).
      *   This works well.

      *   Let's assemble.
answer: |-
  The water settles in the clear cup,
  cold as the metal of the house key.
  I stand with one bare foot, one shoe,
  frozen beneath the hum of the lamp.
  No vibration shakes the black phone,
  only the air thick with settling dust.

  It coats the throat, this invisible dust,
  I drain the dregs of the coffee cup.
  Should I smash the screen of the phone?
  Or lock the thought away with the key?
  The filament trembles in the lamp,
  forced to walk again in the same shoe.

  Tightening the laces on the shoe,
  grinding the grit of accumulated dust.
  The circle of light from the lamp,
  matches the stain on the ceramic cup.
  Is there a turn for this iron key,
  or just a number to dial on the phone?

  I stare at the blank face of the phone,
  recalling the wear on the leather shoe.
  Every lock opened by the same key,
  every surface returning to dust.
  The same sip from the same cup,
  under the judgment of the hanging lamp.

  The bulb flickers inside the lamp,
  begging for a signal from the phone.
  Would I drink the water from the cup,
  just to keep the wear on the shoe?
  Let the stars turn to ash and dust,
  if I hold the weight of the key.

  Do I swallow the iron key?
  Or dance in the glare of the lamp?
  The demon laughs in a cloud of dust.
  Silence returns to the phone.
  I slide into the left shoe,
  and lift the water cup.

  If I turn the key beneath the lamp,
  will the silence of the phone break the cup,
  or bless the shoe and the dust?
