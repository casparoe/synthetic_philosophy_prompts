answer: |-
  Here is your Q&A prep sheet. I have ordered these by the likelihood of the question combined with the potential damage to your core thesis. The phrasing mimics the specific dialectical style of the colleagues you described.

  ### 1. The "New Coat" Charge (Kripkean)
  **Who:** One of the two Kripkeans.
  **The Question:** "You insist primary intensions aren't descriptive reference-fixers. But if I present you with a counterfactual scenario and ask, 'Is there water here?', you use the primary intension to answer. That looks exactly like satisfying a description (e.g., 'clear, drinkable liquid'). If the primary intension determines the extension across scenarios, in what robust sense is it *not* a description fixing the reference? You seem to be distinguishing 'epistemic connection' from 'descriptivism' merely verbally."

  **The Reply:** "The distinction is not verbal; it's about the *direction of fit*. A descriptivist theory claims the description *makes* the term refer to what it does in the actual world. My claim is that the reference is fixed causally or historically, but the primary intension models how we *identify* that reference given incomplete information. Think of it as a map, not the terrain. The description theory says the map draws the terrain. I say the terrain exists independently, but we need the map to navigate epistemic space. The primary intension captures the conditions under which we would *judge* a reference to be successful, not the metaphysical mechanism that *constitutes* the reference. That's why 'Water is H2O' is necessary (metaphysical mechanism) but a posteriori (the map didn't tell us the terrain's chemical makeup until we investigated)."

  **Candid Note:** This is your strongest ground, but it's soft if they press on *how* the identification works without descriptions. If they ask, "What is the cash value of 'judging reference' if not applying a descriptive condition?", you risk circularity. Hope they move on to the mind-body case.

  ### 2. The Zombie Trap (Type-B Physicalist)
  **Who:** The Philosopher of Mind.
  **The Question:** "You say primary intensions underwrite a priori entailments from the physical to the phenomenal. But you also want to remain neutral on whether conceivability entails possibility. If I can conceive of a zombie—a physical duplicate without consciousness—doesn't your framework grant that scenario a primary intension? If it has a primary intension, it's epistemically possible. If it's epistemically possible but metaphysically impossible, you're a Type-B physicalist. But if the physical entails the phenomenal a priori, zombies shouldn't be epistemically possible. Which is it? Are zombies conceivable on your view or not?"

  **The Reply:** "On my view, zombies are *prima facie* conceivable but not *ideally* conceivable. The primary intension models our current epistemic connections, which are imperfect. The a priori entailment holds for an ideal reasoner who fully grasps the concepts. The fact that we can currently conceive of zombies reflects a limitation in our cognitive grasp, not a gap in the world. So, I am not committed to zombies being genuinely epistemically possible in the ideal limit. This allows me to maintain the a priori entailment without forcing me to claim that every current intuition tracks metaphysical possibility. The primary intension tracks conceptual competence, not infallible modal access."

  **Candid Note:** This is dangerous. You are essentially conceding that our current epistemic access is flawed while claiming the framework explains a priori entailment. If they press, "Then what work is the primary intension doing *now* if it doesn't track our actual conceivability?", you look like you're retreating to an idealization that doesn't match the data.

  ### 3. The Content vs. Significance Distinction (Soames-style)
  **Who:** The Millian Critic.
  **The Question:** "Why posit a two-dimensional semantic apparatus at all? You admit primary intensions aren't truth-conditional in the standard sense. All the work you're doing—explaining cognitive significance, informativeness of identity statements—can be done by positing a single Millian content plus a separate theory of cognitive psychology or pragmatics. You're reifying a psychological mode of presentation into a semantic 'intension.' Why multiply semantic values beyond necessity?"

  **The Reply:** "Because pragmatics and psychology are too unstructured to explain the *systematic* nature of a priori entailment. If the link between the physical and the phenomenal were merely pragmatic, it would be contingent and defeasible. But these entailments feel necessary and structural. We need a formal model to capture why 'P implies Q' holds in virtue of meaning alone, even when P and Q refer to the same things. The primary intension isn't a second *content*; it's a formal model of the *access conditions* to that content. Without it, you can't explain why the inference is valid a priori rather than just psychologically compelling."

  **Candid Note:** The soft spot is "formal model." If they ask for the formal rules of these access conditions and you can't provide a logic, you look like you're hand-waving. Hope they don't ask for the axioms.

  ### 4. The Stalnakerian Challenge (Context vs. Epistemology)
  **Who:** The Stalnaker-style Metasemanticist.
  **The Question:** "I'm sympathetic to two-dimensionalism, but I use it to model context sets and assertion. You're using it to model a priori knowledge. But if the primary intension is sensitive to how the world turns out, isn't it just a diagonal proposition relative to a context? Why think this diagonal tracks *epistemic* priority rather than just the constraints on rational assertion in a given context? You seem to be smuggling metaphysics into what should be a pragmatic tool."

  **The Reply:** "The diagonal proposition is a byproduct of the framework, not the foundation. I'm not deriving epistemology from the diagonal; I'm using the two-dimensional structure to show why the diagonal *matters*. The constraint on rational assertion exists *because* there are epistemic connections between concepts. My view grounds the pragmatic tool in the epistemic reality, rather than reducing the epistemic reality to the pragmatic tool. If we treat it only as assertion conditions, we lose the explanation for why certain assertions are a priori justified across all contexts."

  **Candid Note:** This is a turf war. You are claiming priority for epistemology over pragmatics. If they press, "How do you distinguish an epistemic connection from a conversational norm without circularity?", you have no clean answer.

  ### 5. The Idealization Worry (Epistemologist)
  **Who:** One of the Internalist Epistemologists.
  **The Question:** "You rely heavily on 'a priori entailment' and 'ideal reasoners.' But our evidence is finite and our rationality bounded. If the primary intension only yields these entailments for an ideal reasoner, what relevance does it have for actual human knowledge? Are you offering a theory of *our* epistemic situation, or a theory of a god's eye view? If the latter, why call it epistemic at all?"

  **The Reply:** "It's a theory of our epistemic *commitments*, not necessarily our psychological processing. Just as logic norms our reasoning even when we make fallacies, primary intensions norm our conceptual connections even when we fail to see them. The 'ideal reasoner' is a limit concept that defines the structure of our concepts. It explains why, when we discover a mistake in reasoning, we say we 'should have known.' That 'should' is cashed out by the primary intension structure, even if we don't always inhabit it."

  **Candid Note:** This is standard rationalist defense. It's solid, but if they press on *access*—"How do we know what the ideal reasoner would think without already knowing the answer?"—you risk making the theory untestable.

  ### 6. The Compositionality Worry (Kripkean)
  **Who:** The Second Kripkean.
  **The Question:** "If primary intensions aren't standard truth-conditions, how do they compose? If 'Water' has a primary intension and 'H2O' has a primary intension, does 'Water is H2O' get its primary intension functionally from the parts? If not, your semantics is non-compositional. If so, how do you handle opaque contexts without collapsing back into Fregean senses?"

  **The Reply:** "They compose, but they compose over epistemic scenarios rather than metaphysical worlds. The primary intension of a sentence is a function from scenarios to truth values, derived from the primary intensions of the parts. This preserves compositionality. The difference from Frege is that these scenarios aren't modes of presentation inherent to the words; they are hypothetical epistemic states of the speaker. This allows compositionality without committing to a multitude of senses for every term."

  **Candid Note:** This is technical and dry. If they ask for a specific example of a complex sentence where this compositionality fails or looks weird (e.g., modal operators), you might stumble. Keep it high-level.

  ### 7. The "Floating" Possibility Worry (Epistemologist)
  **Who:** The Second Epistemologist.
  **The Question:** "You say primary intensions define epistemic possibility. But what constrains these possibilities? If I can imagine a world where water isn't H2O without contradiction, isn't that epistemically possible on your view? What stops epistemic possibility from floating free of evidence and becoming just 'anything I can imagine'?"

  **The Reply:** "Epistemic possibility isn't 'imaginability.' It's constrained by conceptual competence. You can imagine water isn't H2O, but if you understand the concepts fully, you see that the scenario describes a different substance, not water. The constraints come from the public norms of language use and conceptual role, not private imagination. The primary intension models those public norms, not individual whim."

  **Candid Note:** This relies on a robust notion of "conceptual competence." If they are Quineans or skeptics about analyticity, they will eat this alive. Hope they are friendly to the a priori.

  ### 8. The Metaphysical Idleness Worry (General)
  **Who:** A Senior Faculty member (Generalist).
  **The Question:** "Let's say you're right. Primary intensions model epistemic connections, not metaphysics. You remain neutral on conceivability entailing possibility. Then what metaphysical work is this doing? If the primary intension doesn't tell us what is possible, and the secondary intension just tells us what is actual, why should metaphysicians care? Isn't this just psychology with extra steps?"

  **The Reply:** "It tells us what is *rationally necessary*. Even if it doesn't map directly to metaphysical modality, it maps to the structure of rational thought. That constrains metaphysical theories. A metaphysics that requires us to be systematically irrational to accept it is suspect. The framework doesn't solve metaphysics directly, but it clears the ground by separating epistemic puzzles from metaphysical ones, preventing us from inferring possibility merely from our current ignorance."

  **Candid Note:** This is the "So What?" question. It's damaging if you can't show a concrete payoff. The reply is a bit defensive.

  ***

  ### The Dangerous Question (Hope nobody asks this)

  **The Question:** "If primary intensions are not semantic values and do not determine metaphysical possibility, but merely model 'epistemic connections,' what determines *which* connections count as the primary intension? Isn't the selection of the primary intension itself a pragmatic choice based on what we *want* to count as a priori? If so, isn't the whole distinction relative to our theoretical interests, rather than a feature of language or mind?"

  **Why it is dangerous:** This attacks the objectivity of your entire framework. If the primary intension is just a tool we choose for convenience, it loses its normative force to explain a priori entailment. It reduces your thesis to instrumentalism. You claim PIs explain *why* water is H2O is informative; if the PI is just a choice we made to make it look informative, you've explained nothing. There is no good answer to this that doesn't concede that the framework is somewhat pragmatic, which undermines your claim that it's not "descriptivism in a new coat" (since descriptivism is often chosen for theoretical convenience).

  ***

  ### Pre-emptive Concession Strategy

  In your talk, you must concede the following point during the section on the mind-body problem to preempt the Type-B Physicalist and the "Floating Possibility" objections:

  **Concede:** "I am not claiming that primary intensions provide an infallible guide to what is genuinely possible for finite agents like us. I am claiming they model the *structure* of our concepts. There will be cases where our epistemic intuitions (conceivability) outstrip our conceptual competence."

  **Why:** By admitting that *current* conceivability can be flawed, you inoculate yourself against the Zombie objection. You can argue that the zombie intuition is a failure of competence, not a success of the primary intension. This prevents the Type-Ber from trapping you into saying zombies are genuinely epistemically possible. It also answers the Epistemologist's worry about idealization—you are explicitly distinguishing the model from the messy psychological reality. This makes you look modest and precise, rather than dogmatic about rational reflection.
