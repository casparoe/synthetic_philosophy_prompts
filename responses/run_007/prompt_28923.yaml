  Give me a probability for each of those (and any others you think I've missed), a line or two justifying each, and how you combine them into your overall number. Then tell me which sub-question your credence is shakiest on, and what evidence — an empirical study, a thought experiment, whatever — would most shift your overall number. And if you think I've framed the proposition badly or missed a crucial distinction, say so before you give the numbers.
