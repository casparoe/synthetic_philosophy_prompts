answer: |-
  **Joint Statement on the Normativity of Promising**
  **Signatories:** Practice Theorist (PT), Assurance Theorist (AT)

  **1. Substantive Agreements**
  Both parties affirm the following:
  1.  **Distinctiveness:** Promissory obligations are distinct from general moral duties (e.g., beneficence or non-maleficence).
  2.  **Normative Force:** Breaking a promise is *pro tanto* wrong, even if breaking it yields slightly better aggregate consequences.
  3.  **Empirical Role of Practice:** Social practices of promising exist, are valuable, and significantly strengthen promissory obligations in actual societies.
  4.  **Intentionality:** Invoking a convention (or equivalent signal) is necessary; mere prediction of behavior does not constitute a promise.
  5.  **Value of Reliance:** Reliance by the promisee is a central reason why promising is valuable, even if not the sole source of obligation.

  **2. Remaining Disagreements**

  | Issue | Practice Theorist (PT) | Assurance Theorist (AT) |
  | :--- | :--- | :--- |
  | **Source of Obligation** | Obligation derives from the fairness of participating in a mutually beneficial institution (principle of fairness). | Obligation derives from the wrong of manipulating another's expectations via voluntary assurance (principle of fidelity). |
  | **Primary Wrong of Breach** | Wrong is primarily free-riding on the practice (owed to community/participants). | Wrong is primarily betrayal of the promisee (owed to the individual). |

  **3. Cruxes**
  Settling these questions would shift the balance toward one view:
  1.  **Necessity of Practice:** Can full promissory obligation exist absent a pre-existing social practice?
  2.  **Direction of Wrong:** Is it possible to wrong the practice without wronging the promisee (or vice versa)?

  **4. Test Cases and Predictions**

  *   **Case A: The Isolates**
      *   *Scenario:* Two humans share no culture or language. One signals "I will do X" to induce reliance; the other relies. The signaler breaks the promise.
      *   *PT Prediction:* No promissory obligation exists. Without a constitutive rule system, there is only disappointment, not a moral breach specific to promising.
      *   *AT Prediction:* Obligation exists. The voluntary inducement of reliance creates the duty regardless of institutional background.

  *   **Case B: The Victimless Breach**
      *   *Scenario:* A promise is made where breach is undetectable, causes no reliance harm, and yields net benefit, but violates the promissory rule.
      *   *PT Prediction:* Still wrong. Breach undermines the integrity of the practice regardless of immediate consequences.
      *   *AT Prediction:* Not wrong (or less wrong). Without harm to the promisee's expectations or interests, the core assurance wrong is absent.

  **5. Verbal Dispute Flag**
  We suspect partial verbal disagreement regarding the definition of "practice." PT uses "practice" to mean a *constitutive rule system* (necessary for the act to exist). AT uses "practice" to mean a *customary tool* (instrumental for the act's success). If PT admits rules can be interpersonal rather than societal, and AT admits assurance usually requires normative scaffolding, the gap narrows significantly.

  ***

  **Notes for the Reading Group:**
  This document isolates the metaphysical source of the obligation (institution vs. interpersonal act) from the phenomenological experience (which both agree involves reliance and rules). The "Isolates" case is the strongest discriminator: if you intuit obligation there, lean Assurance; if you intuit only regret, lean Practice. The "Victimless Breach" tests whether you view promising as fundamentally about social cooperation or individual respect.

  We recommend focusing discussion on Case A. If PT concedes that isolated agents can create obligations, the Practice view collapses into a weak Assurance view. If AT concedes that practices are constitutive, the Assurance view becomes institutional.

