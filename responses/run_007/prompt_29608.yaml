answer: |-
  Here is a structured breakdown of the desiderata for a theory of causation by omission, mapped out with the tensions you're worried about.

  ### Part 1: The Desiderata List

  I've categorized these into **Core Desiderata** (things almost everyone agrees a theory needs to handle to be viable) and **Contested Desiderata** (things that depend on your broader metaphysical or ethical commitments).

  #### 1. The Discrimination Constraint (Selection Problem)
  *   **The Requirement:** The theory must distinguish between *causally relevant* omissions and *causally irrelevant* omissions.
  *   **The Case:** The Gardener vs. The Queen. Both failed to water the plant. Only the Gardener's failure is cited as the cause.
  *   **Status:** **Core.** If a theory says the Queen's omission caused the death just as much as the Gardener's, it violates basic intuition and utility. A theory that generates infinite causes (everyone who didn't water the plant) is practically useless.
  *   **The Trap:** Solving this usually requires appealing to expectations, duties, or normality.

  #### 2. The Logical Robustness Constraint (Preemption & Overdetermination)
  *   **The Requirement:** The theory must yield consistent verdicts in complex counterfactual scenarios (preemption, overdetermination, late cutting).
  *   **The Case:** The Two Lifeguards. Guard A sleeps. Guard B sleeps. If A had woken, B would still have slept, and the swimmer would have died (because A was too far away, or B blocked A, etc.). Does A's omission cause the death?
  *   **Status:** **Core.** A theory of causation must handle the logic of dependence. If your theory says A caused the death in a simple case but not in a preemptive case, you need a principled reason why.
  *   **The Trap:** Simple counterfactual dependence fails here (the death doesn't depend on A's omission if B was also sleeping).

  #### 3. The Ontological Clarity Constraint (Metaphysics Question)
  *   **The Requirement:** The theory must specify what kind of entity an "omission" is.
  *   **The Case:** The Rock and the Boulder. A rock fails to stop a boulder. There is no duty, no expectation. Is this an omission?
  *   **Status:** **Core.** You cannot have a relation without relata. If omissions are "nothing," how do they enter causal relations?
  *   **The Trap:** If you say omissions are real "negative entities," you invite spooky metaphysics. If you say they are fictional, you have to explain why the talk is useful.

  #### 4. The Baseline Specification Constraint
  *   **The Requirement:** The theory must define how the "default" behavior is established against which an omission is measured.
  *   **The Case:** A doctor doesn't administer a rare experimental drug. Is this an omission? Only if the baseline includes "trying every possible cure." If the baseline is "standard of care," it is not.
  *   **Status:** **Core.** Without a baseline, "omission" is undefined.
  *   **The Trap:** Is the baseline statistical (what usually happens), counterfactual (what would have happened), or normative (what should have happened)?

  #### 5. The Normative Neutrality Constraint (Moral Entanglement)
  *   **The Requirement:** The theory should not define causation *in terms of* moral or legal duty.
  *   **The Case:** Legal Liability. We often argue: "You are liable because your failure caused the harm." If "failure" is defined as "breach of duty," the argument becomes circular: "You are liable because you breached a duty which caused the harm."
  *   **Status:** **Contested.** Naturalists demand this. Normativists reject it.
  *   **The Trap:** If you satisfy the Discrimination Constraint (Gardener vs. Queen) using norms, you likely violate this constraint.

  #### 6. The Theoretical Unity Constraint (Consistency)
  *   **The Requirement:** The theory of omission causation should align with the theory of positive (commission) causation.
  *   **The Case:** A pushes B (positive) vs. A doesn't catch B (omission). Both result in B falling.
  *   **Status:** **Contested.** Process theorists struggle here (no physical process in omission). Counterfactual theorists find it easier.
  *   **The Trap:** To unify them, you might have to adopt a very abstract theory of positive causation that loses grip on physical reality.

  ---

  ### Part 2: The Tension Map (Tradeoffs)

  This is the crucial part for your paper. You generally cannot maximize all desiderata simultaneously. You have to pick which ones to sacrifice.

  **Tension A: Discrimination vs. Normative Neutrality**
  *   **The Conflict:** The best way to stop the "Queen of England" problem (Discrimination) is to say the Gardener had a *duty* or *expectation* to water the plant, and the Queen did not.
  *   **The Cost:** If you build "duty" into the definition of causation, you violate Normative Neutrality. You can no longer use causal claims to *ground* moral responsibility, because the causal claim already presupposes moral responsibility.
  *   **The Tradeoff:** Do you want a theory that matches intuition (Gardener yes, Queen no) or a theory that keeps facts and values separate?

  **Tension B: Theoretical Unity vs. Ontological Clarity**
  *   **The Conflict:** If you want Unity (omission causation is just like positive causation), you usually have to adopt a Counterfactual Theory. But if you want Ontological Clarity (causation is physical process), omissions look nothing like positive causes.
  *   **The Cost:** Process theorists often have to treat omission causation as a fundamentally different relation (pluralism) to maintain Ontological Clarity. Counterfactual theorists maintain Unity but make causation less "physical."
  *   **The Tradeoff:** Do you prioritize a unified logic of causation or a robust physical metaphysics?

  **Tension C: Baseline Specification vs. Moral Entanglement**
  *   **The Conflict:** To set a Baseline, you often appeal to "normal conditions." But "normal" can be statistical (what usually happens) or prescriptive (what should happen).
  *   **The Cost:** If you use statistical baselines, you get weird results (if everyone usually murders, not murdering isn't an omission?). If you use prescriptive baselines, you risk Moral Entanglement again.
  *   **The Tradeoff:** Is the baseline a matter of fact or a matter of rule?

  ---

  ### Part 3: How the Three Camps Score

  Here is how the main contenders handle the list above.

  **1. The Counterfactual View (e.g., Lewis, Schaffer)**
  *   **Gist:** A's omission caused E iff, had A occurred, E would not have occurred.
  *   **Score:** Aces **Theoretical Unity** and **Logical Robustness** (with tweaks for preemption). Fails **Discrimination** spectacularly (the Queen's omission is just as much a cause as the Gardener's unless you add context). Generally maintains **Normative Neutrality** but pays for it with too many causes.
  *   **Verdict:** Metaphysically thin, logically strong, pragmatically weak.

  **2. The Norm-Based View (e.g., Hart & Honoré, Moore)**
  *   **Gist:** An omission is a cause only relative to a normative duty or expectation.
  *   **Score:** Aces **Discrimination** (Gardener yes, Queen no) and **Baseline Specification**. Fails **Normative Neutrality** (causation depends on duty). Struggles with **Theoretical Unity** (positive causation doesn't require duties).
  *   **Verdict:** Pragmatically useful for law/ethics, but risks circularity and fractures the concept of causation.

  **3. The Eliminativist / Paraphrase View (e.g., Dowe, Beebee)**
  *   **Gist:** Omissions are not causes. Talk of "omission causation" is just a shorthand for explaining why we hold people responsible or why a positive process was interrupted.
  *   **Score:** Aces **Ontological Clarity** (no spooky absences) and **Normative Neutrality** (causation is purely physical). Fails **Theoretical Unity** (in the sense that ordinary language is wrong) and struggles to explain why omission talk is so persistent without admitting it tracks *something* real.
  *   **Verdict:** Metaphysically safest, but requires rewriting large chunks of legal and ordinary discourse.

  ### Summary for your Paper
  If you want to write a strong paper, don't try to solve all of these. Pick a tension. For example: *"I argue that satisfying the Discrimination Constraint is more important than Normative Neutrality, so we should accept a hybrid normative-causal theory."* Or: *"I argue that the cost of Normative Entanglement is too high, so we must accept the Counterfactual view's proliferation of causes and handle the selection problem pragmatically, not metaphysically."*

  The "success" of your theory depends on which desideratum you prioritize.
