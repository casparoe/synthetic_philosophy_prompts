      *(Self-Correction on the Thesis)*: I need to be careful. Some philosophers (like Horowitz) argue akrasia *is* sometimes rational. Others (like Wedgwood) say it's never rational. I need to pick a lane. For a general audience, arguing that "Akrasia is a symptom of error, not a stable state" is compelling. I will argue that while the *feeling* of akrasia is common, the *state* of holding contradictory levels is irrational. The rational move is to let the higher-order defeat the first-order.

