answer: |-
  You are right to be frustrated. The literature on aggregation is currently in a state of "reflective equilibrium breakdown." We have strong intuitions that contradict each other, and formal proofs showing you cannot satisfy all the logical constraints we want.

  The specific problem you are referencing (Torture vs. Dust Specks) is a variant of the **Spectrum Arguments** analyzed deeply by Larry Temkin (*Rethinking the Good*) and Gustaf Arrhenius (*Population Ethics*).

  Here is the terrain map you asked for: the data, the constraints, the impossibility results, and the scorecard.

  ---

  ### 1. The Phenomenological Data (The Cases)
  A theory of aggregation must deliver verdicts on these specific configurations. If your theory ignores one, it is incomplete.

  *   **The Binary Choice (Parfit/Guerro):**
      *   *Option A:* One person is tortured for a year.
      *   *Option B:* $N$ people get a dust speck in their eye.
      *   *Intuition:* For sufficiently large $N$, many feel B is worse (Aggregation). Others feel A is always worse (Non-Aggregation/Lexicality).
  *   **The Continuum (The Sorites):**
      *   A spectrum of harms: Speck $\to$ Mild Headache $\to$ Migraine $\to$ Broken Arm $\to$ Torture.
      *   Each step is *barely* worse than the previous one.
      *   *Constraint:* If A is worse than B, and B is worse than C, Transitivity demands A is worse than C. But if "barely worse" allows aggregation, does Torture become worse than a zillion specks?
  *   **Intrapersonal vs. Interpersonal:**
      *   *Case 1 (Intrapersonal):* One person gets $N$ dust specks over a lifetime vs. One person gets tortured. (Almost everyone agrees Torture is worse).
      *   *Case 2 (Interpersonal):* $N$ people get 1 speck each vs. One person gets tortured.
      *   *The Hinge:* Does the *distribution* across persons block aggregation? If you treat Case 1 and Case 2 differently, you need a principled reason why "person-boundaries" matter morally.
  *   **The Rescue Case (Taurek):**
      *   Save 1 person from death vs. Save 5 people from death.
      *   Does the number count? (Most say yes).
      *   If yes, why does it stop counting when the harm becomes trivial (specks) or extreme (torture)?

  ### 2. Formal Constraints (The Logic)
  These are the structural properties we want our moral ordering to have.

  *   **Transitivity:** If Outcome X is better than Y, and Y is better than Z, then X is better than Z.
      *   *Status:* Essential for rational choice. Dropping this leads to "money pumps" (cycling preferences).
  *   **Continuity (Archimedean Property):** For any three outcomes A > B > C, there is some probability mix or quantity of C that makes it equivalent to B.
      *   *Status:* Required for standard utilitarianism. **Dropping this allows Lexical Views** (e.g., "No amount of specks equals one torture").
  *   **Separability (Independence of Irrelevant Alternatives):** The ranking of X vs. Y should not depend on the presence of Z.
      *   *Status:* Highly contested. Some holistic views reject this.
  *   **Impartiality (Person-Neutrality):** Who suffers the harm does not matter, only the harm itself.
      *   *Status:* Hard to deny without appealing to special obligations.
  *   **Pareto:** If everyone is at least as well off in X as in Y, and someone is better off, X is better.
      *   *Status:* Almost universally accepted.
  *   **Non-Elitism:** We cannot ignore the welfare of the worst-off.
      *   *Status:* Required to avoid "Sadistic Conclusions."

  ### 3. The Impossibility Results (The Bad News)
  This is the section you most wanted. **There are formal proofs that you cannot satisfy all the desiderata above.**

  **A. Temkin's Intransitivity Result**
  Larry Temkin argues that to preserve the intuition that "Torture is worse than Dust Specks" *and* "A Migraine is worse than a Speck" *and* "Numbers count," you must violate **Transitivity**.
  *   *The Logic:* If a Migraine is only *slightly* worse than a Speck, enough Specks outweigh one Migraine. If Torture is only *slightly* worse than a Migraine (in a long chain), enough Migraines outweigh Torture. By transitivity, enough Specks outweigh Torture.
  *   *The Trade-off:* Keep Transitivity $\rightarrow$ Accept that enough Specks outweigh Torture (Utilitarianism). OR Keep the Intuition $\rightarrow$ Reject Transitivity (Temkin's view).

  **B. Arrhenius's Impossibility Theorems**
  Gustaf Arrhenius has proven multiple theorems showing that no population ethic (which includes aggregation) can satisfy a set of adequate conditions (including Pareto, Non-Elitism, and Non-Sadism) simultaneously.
  *   *The Trade-off:* You must choose which condition to violate. Most theories violate **Non-Elitism** (ignoring the worst off in favor of total sum) or **Continuity** (introducing lexical thresholds).

  **C. The "No Difference" Challenge (Harsanyi / Broome)**
  If you claim Interpersonal Aggregation is wrong (Torture > $N$ Specks across people) but Intrapersonal Aggregation is right (Torture > $N$ Specks in one person), you face the **Reductionist Challenge**.
  *   *The Logic:* If personhood is just a psychological continuity relation, why does the boundary of a "person" block aggregation?
  *   *The Trade-off:* You must either accept **Metaphysical Personhood** as a moral brute fact (Contractualism) or accept that Intrapersonal and Interpersonal aggregation stand or fall together.

  ### 4. Distinctions You Cannot Afford to Collapse
  If you collapse these, your theory becomes vulnerable to *reductio ad absurdum*.

  1.  **Claims vs. Outcomes:**
      *   *Outcome View:* Minimize total badness.
      *   *Claim View:* Respect individual claims not to be used.
      *   *Why keep distinct:* Contractualists (Scanlon) argue aggregation violates the *claim* of the torture victim, even if the *outcome* is better. Collapsing these eliminates the deontological constraint.
  2.  **Thresholds vs. Slopes:**
      *   Is there a specific point where aggregation stops working (a threshold)?
      *   *Why keep distinct:* If you posit a threshold (e.g., "Aggregation works for headaches, not for broken arms"), you face the **Arbitrariness Objection**. Why *there*? If you deny thresholds, you face the **Continuum Objection**.
  3.  **Ex Ante vs. Ex Post:**
      *   *Ex Ante:* Everyone had a 1/N risk of torture.
      *   *Ex Post:* One person actually got tortured.
      *   *Why keep distinct:* Some theories (Harsanyi) aggregate based on expected utility (Ex Ante). Others (Broome) look at actual outcomes (Ex Post). They yield different verdicts in risk cases.

  ### 5. Scorecard of Main Views
  Here is how the major contenders score against the desiderata.

  | View | Transitivity | Continuity | Aggregates Specks > Torture? | Respects Person-Boundaries? | Cost / Bullet Bitten |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Total Utilitarianism** | ✅ Yes | ✅ Yes | ✅ Yes | ❌ No | **The Repugnant Conclusion:** Accepts that enough specks outweigh torture. |
  | **Lexical Prioritarianism** | ✅ Yes | ❌ No (Lexical) | ❌ No | ⚠️ Mixed | **Arbitrariness:** Must define where the "lexical" threshold lies. Violates Continuity. |
  | **Contractualism (Scanlon)** | ✅ Yes | ❌ No | ❌ No | ✅ Yes | **Numbers Don't Count:** Struggles to justify saving 5 over 1 in rescue cases without ad-hoc fixes. |
  | **Temkin's Intransitivism**| ❌ No | ✅ Yes | ❌ No | ⚠️ Mixed | **Rationality:** Rejects Transitivity. Accepts that "Better Than" is not a transitive relation. |
  | **Threshold Prioritarianism**| ✅ Yes | ❌ No | ⚠️ Depends | ⚠️ Mixed | **Precision:** Requires a non-arbitrary cutoff for when aggregation stops. |
  | **Weighted Aggregation** | ✅ Yes | ✅ Yes | ⚠️ Mitigated | ❌ No | **Complexity:** Harms to worse-off people count for more. Still risks aggregation at extreme N. |

  ### Summary of the Trade-Off
  The central inconsistency you are looking for is this triad. **You can only pick two:**

  1.  **Transitivity** (Rational ordering).
  2.  **Continuity** (No lexical gaps; small differences add up).
  3.  **The Anti-Repugnant Intuition** (Torture is never worse than dust specks, regardless of N).

  *   **Utilitarians** pick 1 & 2. (They accept the specks win).
  *   **Lexical Theorists** pick 1 & 3. (They reject Continuity).
  *   **Temkin** picks 2 & 3. (He rejects Transitivity).

  ### Recommended Next Steps
  If you want to stop reading papers that "pick an intuition," read the meta-ethics of the problem itself:
  1.  **Larry Temkin, *Rethinking the Good*:** The definitive argument for why Transitivity might have to go.
  2.  **Gustaf Arrhenius, *Population Ethics: The Challenge of Future Generations*:** The definitive formal proof of the impossibility results.
  3.  **Alex Guerro, "The Logic of the Torture vs. Dust Specks":** Specifically addresses the aggregation mechanics.
  4.  **John Broome, *Weighing Goods*:** For the rigorous decision-theoretic constraints.

  The terrain is not a smooth slope; it is a minefield of impossibility theorems. Any theory you build will have to explicitly state which formal constraint it is willing to violate.
