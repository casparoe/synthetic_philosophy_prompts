      *   *Virtue Ethics:* Argues that virtues are stable dispositions. They might be rare, developmental, or context-sensitive, but the situationist critique relies on an overly rigid conception of traits or misinterprets the data.
      *   *Key Data Points:* Milgram (obedience), Darley & Batson (Good Samaritan/time pressure), Isen & Levin (phone booth/dime helping).
      *   *Key Concepts:* Cross-situational consistency, correlation coefficients (0.3-0.4), local vs. global traits, fragmentation of character, metaphysics of dispositions.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to go beyond "situations matter."
      *   *Concession 1 (Situationists):* Acknowledge that the data doesn't prove *no* consistency, just less than folk psychology expects. Acknowledge local traits are real.
      *   *Concession 2 (Virtue Ethicists):* Acknowledge that global traits are rarer than assumed. Acknowledge the "power of the situation" is robust. Acknowledge that the 0.3 correlation is a real constraint to explain.
      *   *Experiments:* Agree on what they show (specific situational pressures override disposition in *those* contexts) and what they don't show (they don't track individuals over long periods across diverse moral domains).
      *   *Drafting thought:* Ensure the distinction between "global" (broad) and "local" (narrow) is central.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Question 1: The 0.3 Correlation.*
