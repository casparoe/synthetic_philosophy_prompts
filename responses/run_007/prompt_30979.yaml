          *   Sit: It indicates the absence of the robust global traits required for Aristotelian virtue.
      *   *Question 2: Behavioral Consistency.*
          *   VE: Consistency is required across *relevantly similar* situations, not all situations. Virtue involves practical wisdom (phronesis), not robotic repetition.
          *   Sit: Virtue ethics traditionally implies consistency across a wide range of morally salient situations; the data shows fragmentation.
      *   *Question 3: Burden of Proof.*
          *   VE: Situationists claim virtues *don't* exist; they bear the burden of proving the negative or redefining virtue out of existence.
          *   Sit: Virtue ethicists posit robust psychological entities; they bear the burden of providing empirical evidence for them.

  5.  **Drafting Section 3: Cruxes:**
      *   Need specific studies/arguments.
      *   *Crux 1 (Metaphysics):* The "All-Things-Considered" condition. Do virtues require acting rightly *even* under extreme duress (Milgram levels) or only under normal conditions?
          *   *Test:* Longitudinal study of moral exemplars under varying stress.
          *   *Predictions:* VE expects high consistency in exemplars; Sit expects situational override even in exemplars.
      *   *Crux 2 (Experimental Paradigm):* The "Good Samaritan" interpretation. Is it about character or cognitive load?
          *   *Test:* Replication with priming for identity vs. time pressure.
          *   *Predictions:* VE thinks identity priming restores consistency; Sit thinks time pressure overrides identity.
      *   *Crux 3 (Fragmentation vs. Integration):* Is character fragmented or integrated?
          *   *Test:* Network analysis of trait attribution.
          *   *Predictions:* VE sees clusters; Sit sees isolated nodes.

      *Refining Cruxes for the Prompt:* The prompt asks for *concrete* empirical study or argument.
      *   *Crux 1 (Metaphysics of Dispositions):* The "Threshold of Robustness." What level of consistency defines a trait?
          *   *Study:* Meta-analysis defining the correlation threshold required for "trait" attribution in other domains (intelligence, athletics) vs. morality.
      *   *Crux 2 (Experimental):* The "Moral Exemplar" Study.
          *   *Study:* Tracking recognized moral exemplars (e.g., rescue workers, activists) across diverse situational pressures.
          *   *Prediction:* VE says they show >0.5 consistency; Sit says they show <0.4 consistency similar to general population.

  6.  **Drafting Section 4: Verbal Disputes:**
      *   Often, the fight is about the definition of "virtue."
      *   Situationists attack "global, robust" traits.
      *   Virtue Ethicists defend "phronetic, developed" traits.
      *   If VE accepts virtues are rare and local-ish, and Sit accepts local traits exist, the gap narrows. The verbal dispute lies in whether "Virtue" *must* imply global robustness.

