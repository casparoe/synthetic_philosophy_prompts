      *   **Topic:** The standoff between Social Psychology Situationism (e.g., Doris, Harman) and Neo-Aristotelian Virtue Ethics (e.g., Kamtekar, Snow, Miller).
      *   **Format:** A formal collaborative document signed by both representatives, facilitated by a metaphysician.
      *   **Components:**
          1.  Numbered list of agreed claims (substantive concessions, distinguishing local/global traits, interpreting experiments).
