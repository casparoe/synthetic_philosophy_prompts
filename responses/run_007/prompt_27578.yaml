answer: |-
  Dear Student,

  It is completely understandable that you are trying to map the underlying logic of your professor's rulings, especially when they seem to prioritize certain intuitions over others. Based on the four cases you have described, the professor is almost certainly operating within the framework of libertarian entitlement theory, most famously associated with Robert Nozick. Her verdicts consistently prioritize historical processes over end-state patterns. In the case of the farmer, the emphasis is on just acquisition through labor on unowned resources. With the athlete, the focus shifts to just transfer, where the voluntariness of the exchange validates the holding regardless of the resulting inequality. The fraud case confirms that consent is the boundary condition for valid transfer, and the taxation case explicitly rejects patterned principles of justice, such as equality or need, as sufficient grounds to override property rights. Taken together, these rulings suggest that for her, justice is not about how wealth is distributed at any given moment, but about how it came to be held.

  Given this framework, you should expect her to rule that the singer is entitled to the wealth. The critical factor in her previous reasoning regarding the athlete was not the years of training, but the fact that the fans and sponsors gave their money voluntarily. While the athlete's training might make the entitlement feel more intuitive to us, the philosophical work in her verdict was done by the validity of the transaction, not the moral worthiness of the recipient. Since the singer's concerts and recordings also involve voluntary exchanges, the lack of training or the luck of being born with a good voice does not invalidate the transaction. On this view, as long as the singer did not violate anyone's rights in acquiring her voice or in selling her performances, the resulting distribution is just, even if it arises from what Rawls would call the natural lottery.

  This leads directly to your nagging worry about whether entitlement implies desert. The distinction here is crucial and allows for the view that the singer is entitled to the money without deserving the voice. In this philosophical tradition, entitlement is a historical and procedural concept, whereas desert is a moral and often patterned concept. You can be entitled to something simply because you acquired it through a chain of just steps, much like you are entitled to a gift given to you by a friend even if you did nothing to earn it. The justice lies in the freedom of the giver and the absence of coercion, not in the moral virtue or effort of the receiver. Therefore, the professor can consistently maintain that the singer's voice is a matter of luck and thus undeserved, while simultaneously arguing that the money is justly held because the process of acquiring it respected everyone's rights. To tax the singer to correct for the undeserved luck of her vocal cords would, on this view, violate her self-ownership and the voluntary choices of her fans, which are treated as inviolable side-constraints.

  To test the limits of this view and separate it from competing interpretations, the cleanest further case to propose would be the monopoly over the only water supply in a desert. While an inheritance case would test whether labor is required for entitlement, the singer case already largely settles that by removing the labor variable while keeping the voluntary transfer. The water monopoly, however, tests the principle of just acquisition itself, which underpins the farmer case. The farmer cleared unowned land, presumably leaving enough and as good for others, but a water monopolist in a desert leaves nothing for others. If the professor says the monopolist is entitled to charge whatever they wish, she is committed to a strict absolute property rights view. If she says the monopolist must share or price reasonably, she is admitting a Lockean proviso that limits acquisition when it harms others' survival. This case cleanly separates a strict entitlement theory from one that accepts constraints on acquisition, which is the most significant remaining ambiguity in her previous rulings.

  I hope this helps you prepare for the seminar. It is a rigorous framework, and seeing where the boundaries lie is the best way to understand its implications.

  Best wishes
