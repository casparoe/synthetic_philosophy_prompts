answer: |-
  # Handout: What Do You Mean by "Utility"?
  **Course:** Philosophy & Economics | **Unit:** Welfare and Choice

  ### Instructions
  Below are eight scenarios involving choices, feelings, and well-being. For each case, read the description and select the **one** statement that best matches your intuition. Do not worry about technical economic or philosophical terms; just pick the answer that sounds most correct to you.

  There are no right or wrong answers yet. At the end of class, we will tally your responses to see which theoretical framework you have been implicitly using.

  ---

  ### 1. The Smoker
  Elena says she desperately wants to quit smoking because she values her long-term health. However, every evening after work, she buys a pack of cigarettes and smokes.
  *   **A.** In the moment of buying, she preferred smoking to quitting. Her actions show her true preference.
  *   **B.** She preferred quitting, but her willpower failed. Her actions were a mistake, not her true preference.
  *   **C.** Regardless of what she preferred, smoking makes her worse off. Her well-being is determined by her health, not her choices.

  ### 2. The Framed Choice
  At a cafeteria, Mark chooses an apple over a cookie when the sign says "Healthy Snack." Later, at a different cafeteria, he chooses a cookie over an apple when the sign says "Treat." The apples and cookies are identical.
  *   **A.** Mark's preference changed because the context changed. Choice is always relative to the situation.
  *   **B.** Mark has one stable preference, but the signs tricked him. One of these choices was an error.
  *   **C.** The "choice" doesn't tell us enough. We need to know if the context helped him function better or worse as a person.

  ### 3. The Principled Sacrifice
  Sarah turns down a high-paying job she would have enjoyed because she believes the company harms the environment. She takes a lower-paying job she finds less enjoyable to work for a non-profit.
  *   **A.** She revealed that she preferred the non-profit job. The money didn't matter as much as she thought.
  *   **B.** She sacrificed her personal preference for a moral principle. She did what she thought was right, not what she wanted.
  *   **C.** She is less happy, but she has more "agency." Doing the right thing adds to her welfare even if it reduces her happiness.

  ### 4. The Ignorant Tourist
  David buys a ticket for a tour because he believes it includes a lunch buffet. It turns out the buffet was canceled, but David doesn't find out until he gets home. He had a great time anyway.
  *   **A.** David got what he chose. His preference was satisfied because he chose the tour freely.
  *   **B.** David didn't get what he wanted. He wanted a tour *with lunch*. His preference was not actually satisfied.
  *   **C.** David's welfare is high because he felt happy during the tour. The facts about the lunch don't matter, only his experience does.

  ### 5. The Contented Worker
  Maria works in a factory with poor conditions. When asked, she says she is perfectly happy and wouldn't want a different job, because she doesn't believe anything better is possible for someone like her.
  *   **A.** Her welfare is high. She says she is satisfied, so we must accept her assessment of her own life.
  *   **B.** Her welfare is low. She has adapted her desires to bad circumstances. We cannot judge welfare by her stated satisfaction alone.
  *   **C.** Her welfare is neutral. As long as she is not suffering physically, her mental attitude is her own business.

  ### 6. The Policy Trade-off
  A policymaker is considering a project that will give Paul a gain of $1,000 but cost Peter a loss of $1,000. Both are equally wealthy.
  *   **A.** We cannot compare their welfare. We can only say Paul chose the gain and Peter chose to keep his money.
  *   **B.** We can compare them. If Paul's happiness increases more than Peter's decreases, total welfare goes up.
  *   **C.** We can compare them, but not just by money or happiness. We must ask who has more freedom or capability to live the life they value.

  ### 7. The Bored Heir
  James inherits millions and spends his days playing video games and eating gourmet food. He reports feeling constant pleasure. He contributes nothing to society and learns nothing new.
  *   **A.** James has high welfare. He is getting exactly what he prefers (leisure and food).
  *   **B.** James has high welfare. He feels constant pleasure, which is the only thing that ultimately matters.
  *   **C.** James has low welfare. A life of passive consumption is not a good human life, regardless of his pleasure or preferences.

  ### 8. The Impulsive Shopper
  On Friday, Lisa plans to save her bonus on Monday. On Monday, she sees a handbag and spends the bonus immediately. On Tuesday, she regrets it.
  *   **A.** On Monday, she preferred the bag. On Friday and Tuesday, she preferred savings. Preferences change over time.
  *   **B.** Her Monday choice was a mistake. Her "true" preference was the savings plan she made when calm.
  *   **C.** The regret shows she harmed her future self. Welfare involves caring for your future self, not just satisfying current impulses.

  ---
  *(End of Student Handout)*

  ***

  # Instructor Key & Scoring Logic

  ### Scoring the Positions
  Tally the student's answers. While few students will be pure types, the majority pattern indicates their implicit theoretical commitment.

  | Question | **Revealed Preference (Samuelson)** | **Mentalist Preference** | **Pref-Satisfaction Welfarism** | **Hedonism (Experienced Utility)** | **Sen (Capabilities/Normative)** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **1. Smoker** | **A** | **B** | A or B | C | **C** |
  | **2. Framing** | **A** | **B** | A | A or B | **C** |
  | **3. Principle** | **A** | **B** | **A** | C (Lower welfare) | **C** |
  | **4. Tourist** | **A** | **B** | **A** | **C** | B |
  | **5. Worker** | **A** | B | **A** | C (If happy) | **B** |
  | **6. Policy** | **A** | B | B | **B** | **C** |
  | **7. Heir** | **A** | A | **A** | **B** | **C** |
  | **8. Shopper** | **A** | **B** | A | C | **C** |

  *Note: Some cells allow for overlap (e.g., Hedonism and Sen might agree on the Smoker case but for different reasons). The "Bold" indicates the strongest diagnostic answer for that position.*

  ### Position Profiles

  1.  **The Behaviorist (Revealed Preference):** Mostly **A**s.
      *   *Core View:* Preference is defined by choice. If you chose it, you preferred it. Welfare is typically treated as ordinal and based on these choices. Internal states (regret, pain) are irrelevant to the economic model.
  2.  **The Psychologist (Mentalist):** Mostly **B**s.
      *   *Core View:* Preference is a real brain state. Choice is just evidence, and sometimes bad evidence (due to weakness of will, framing, or ignorance).
  3.  **The Satisfaction Theorist (Pref-Satisfaction Welfarism):** Mix of **A**s and **B**s on preference, but **A** on Welfare questions (Q4, Q5, Q7).
      *   *Core View:* Welfare consists in getting what you want. It doesn't matter if what you want is shallow (The Heir) or based on ignorance (The Tourist), as long as the preference is satisfied.
  4.  **The Hedonist (Experienced Utility):** Mostly **C** on Welfare questions (Q1, Q4, Q7), **B** on Preference questions.
      *   *Core View:* Welfare is about feelings (pleasure/pain). You can prefer things that make you miserable (Principle) or be happy about things that aren't true (Tourist).
  5.  **The Pluralist (Sen/Capabilities):** Mostly **C**s.
      *   *Core View:* Welfare is objective and plural (health, agency, freedom). Choices can be "adaptive" (The Worker) or "unfree." We need normative judgment to assess welfare, not just data.

  ### Limitations & Incoherent Patterns

  **1. Positions This Quiz Cannot Cleanly Separate:**
  *   **Revealed Preference vs. Preference-Satisfaction:** In standard microeconomics, these often travel together. A student might believe choice *defines* preference (RP) and that satisfying those choices *is* welfare (Pref-Sat). This quiz separates them slightly in Q4 (Tourist) and Q7 (Heir), but a student who answers **A** on both could hold either view. To separate them, you would need to ask: "Is utility a number we assign to choices to predict behavior (RP), or is it a measure of how good a life is (Welfarism)?"
  *   **Mentalist vs. Hedonist:** A student might believe preferences are mental states (Mentalist) and *also* believe those mental states are just desires for pleasure (Hedonist). Q3 (Principle) is the best separator here. If they say the principled person is worse off (Hedonist) vs. satisfying a preference (Mentalist/Pref-Sat), you can distinguish them.

  **2. Potentially Incoherent Patterns:**
  *   **RP on Preference + Sen on Welfare:** A student who answers **A** (Choice defines preference) on Q1/Q2 but **C** (Normative judgment on welfare) on Q5/Q7 is theoretically consistent (Positive vs. Normative distinction), but often indicates a student who hasn't realized the tension. If choice defines preference, how can choice be "wrong" for welfare? This is a great teaching moment for the "Is/Ought" gap in welfare economics.
  *   **Mentalist on Preference + RP on Welfare:** If a student says "She preferred quitting but chose smoking" (Mentalist) but "Her welfare is high because she chose smoking" (RP/Welfarist), they hold an incoherent view of *why* welfare matters. Usually, Mentalists believe welfare tracks the *mental* preference, not the *chosen* action. This pattern suggests confusion between "what I want" and "what I do."
  *   **The "Empty" Cell:** It is rare to find a pure **Hedonist** who is also a **Revealed Preference** theorist. Hedonism requires access to internal feelings (which RP rejects as unobservable). If a student scores high on both, they likely misunderstand one of the definitions (e.g., thinking "utility" just means "happiness" without realizing RP forbids measuring happiness).

  **3. Why Nobody Lands on "Pure Hedonist + Revealed Preference":**
  *   Revealed Preference explicitly banishes discussion of psychological states (pleasure/pain) from the definition of utility, treating it as a mathematical ordering of choices. Hedonism explicitly defines utility *as* a psychological state. A student cannot consistently hold that utility is *only* choice data AND *only* pleasure sensations. If they score here, they are likely using the word "utility" colloquially rather than technically.

  ### Pedagogical Note
  Use the "Incoherent Patterns" section to drive the first lecture. If a student says the Smoker "preferred quitting" (Mentalist) but is "better off smoking" (Objective/Strange), ask them to justify the metric. This forces them to realize that **Welfare Economics requires a commitment to what counts as a "good,"** not just how to measure choice.
