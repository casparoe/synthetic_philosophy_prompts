      *   *Scenario:* Elena discovers fraud. She knows she might get cold feet due to fear. Six months ago, she set up an automated system: if she doesn't enter a specific code by 5 PM today, the evidence gets sent to the press. She arrives at 5 PM, hesitates, but then freely decides to hit "send" herself. The backup mechanism remains inactive.
      *   *Refining for constraints:* Ensure it sounds like a Frankfurt case (counterfactual intervener). In standard FSCs, the intervener monitors and intervenes *if* the agent shows signs of doing otherwise. Here, the "intervener" is the past self's setup.
