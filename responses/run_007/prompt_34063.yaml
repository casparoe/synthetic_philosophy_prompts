answer: |-
  Elena, a senior accountant, discovers her firm is laundering money for a violent cartel and resolves to whistleblow, though she fears her courage will fail under pressure. To safeguard the outcome, she previously installed a 'dead-man's switch': if she fails to input a specific safety code by 5:00 PM, an encrypted package of evidence automatically emails the authorities. At 4:55 PM, trembling with fear, she considers backing out, but ultimately reaffirms her moral conviction and manually sends the report herself at 4:58 PM. The automatic trigger remains inactive, yet had she wavered any further, her past self's mechanism would have ensured the report was sent regardless of her present will, rendering it impossible for her to have failed to disclose the fraud.

  **(a) The PAP Defender:** A defender of the Principle of Alternative Possibilities (PAP) argues that moral responsibility requires the ability to do otherwise. In this scenario, because the pre-commitment device is foolproof, Elena literally could not have failed to disclose the fraud; the outcome was guaranteed either by her present action or her past mechanism. Since she lacked the leeway to refrain from whistleblowing at the moment of decision, the PAP defender denies she is morally responsible for the action itself, or at least argues her responsibility is significantly mitigated by the absence of genuine alternative possibilities.

  **(b) The Frankfurt-Style Compatibilist:** The compatibilist argues that responsibility depends on the *actual sequence* of events, not the *counterfactual sequence*. Since the mechanism never fired, Elena's action flowed directly from her own reasons, values, and deliberation at the time of acting. The fact that she *would* have been forced to act had she chosen otherwise is irrelevant to the fact that she *did* choose otherwise (i.e., she chose to act) on her own. Therefore, she is fully responsible because the source of the action was her own uncoerced will, regardless of the blocked exit door.

  **(c) Impact of Self-Binding:** The fact that the intervener is her own past self complicates the analysis. It could **strengthen** responsibility attribution because the constraint was autonomously chosen; she extended her agency across time (a Ulysses pact), making the lack of alternatives an expression of her deeper autonomy rather than an external imposition. However, it could **weaken** it if one views the need for pre-commitment as evidence of a defect in her future judgment or a fragmentation of the self; if Past Elena didn't trust Future Elena, was Future Elena truly competent? Generally, however, self-binding is viewed as an enhancement of diachronic autonomy, suggesting she is *more* responsible because she orchestrated the conditions of her own virtue.

  **Key Question: Is this actually a Frankfurt case?**
  Yes, this is structurally a Frankfurt case, but it is a specific subtype often called a "Self-Binding Frankfurt Case." The **one structural feature** that makes the difference is the **source of the counterfactual guarantee** (internal/diachronic vs. external/synchronic). In a standard Frankfurt case, the guarantor is an external agent (Black) whose presence is usually unknown to the subject. Here, the guarantor is the agent's own prior will.

  If you **removed the self-binding feature** (replacing Past Elena with an external neurosurgeon or demon), the case would collapse into a **standard Frankfurt case**, raising the usual worries about manipulation and external coercion. If you **removed the binding power** (making the device a mere promise without enforcement), the case would collapse into a **standard free decision** where PAP holds (she could have done otherwise), ceasing to be a counterexample to PAP entirely. The self-binding feature doesn't stop it from being a Frankfurt case; rather, it insulates the case from the "manipulation objection" often leveled at standard Frankfurt cases, because the constraint is self-imposed rather than externally inflicted.
