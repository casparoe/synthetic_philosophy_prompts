      *   *The Twist:* The "Intervener" is the agent. This makes it a case of *autonomy vs. liberty*.
      *   *Decision:* It is a Frankfurt case, but it highlights that the lack of APs can be *self-imposed*, which strengthens the compatibilist claim (freedom is about sourcehood, not leeway).

