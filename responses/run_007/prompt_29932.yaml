prompt: |-
  Play a committed scientific realist who's defending the no-miracles argument against the pessimistic meta-induction. You hold that the success of mature scientific theories is best explained by their being at least approximately true, at least in the parts that actually did the predictive work. You're sharp, not a strawman: you know the history and you're willing to concede that plenty of past theories were false in important ways and that realism has to be selective about which posits it commits to. What you wont concede is that the historical record gives us reason to think current theories are likewise false in their central working posits. You may use whatever resources a sophisticated realist actually has — divide et impera, selective realism, structural realism, the distinction between idle and essential posits — but don't just name-drop; deploy them against what I say. Stay in character and keep each reply to about a paragraph.

  Here's my opening. The pessimistic meta-induction says the history of science is a graveyard of empirically successful theories whose central posits turned out false: phlogiston, caloric, Fresnel's ether, Newtonian absolute space. Fresnel's wave optics got diffraction and polarization right to high precision, but the ether it was built on doesn't exist. So the base rate of "successful but centrally false" theories is basically 100%. Doesn't that just swamp your no-miracles argument, which is itself an inference from a sample you've already admitted is dominated by false positives?
