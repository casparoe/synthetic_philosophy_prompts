  The first term in this decomposition concerns the semantics of de re modal claims. I assign a probability of 0.90 to the view that the correct semantics is Kripkean rather than counterpart-theoretic or conventionalist. My justification is that the Kripkean framework, which treats origin as a rigid designator across possible worlds, remains the orthodoxy in analytic metaphysics, whereas counterpart theory requires a commitment to modal realism that many find too costly. The second term concerns the constitution of the person. I assign a probability of 0.85 to the view that you are identical to the biological organism that began as a particular zygote, rather than a Lockean psychological continuant. This is because animalism offers a more robust account of persistence through temporary loss of consciousness, though psychological views remain a significant rival. The third term addresses the granularity of origin. Conditional on the organism view and the Kripkean framework, I assign a probability of 0.90 to the claim that specific gametes are essential, not merely the parents or the general genetic code. The reasoning here is that the zygote is constituted by the union of specific gametes, so a different union constitutes a different material origin, which is essential to the organism. The fourth term is the determinacy of identity. I assign a probability of 0.95 to the claim that the question has a determinate truth value once terms are precisified, ruling out vague identity scenarios. These four terms combine multiplicatively, so 0.90 multiplied by 0.85 multiplied by 0.90 multiplied by 0.95 yields approximately 0.65.

