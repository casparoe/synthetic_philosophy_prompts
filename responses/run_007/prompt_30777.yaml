  8.  **Final Polish:** Ensure the distinction between "The mind is inconsistent" and "We cannot know the mind is consistent" is clear. The computationalist doesn't need to claim the mind is inconsistent, only that we cannot *establish* consistency from the inside.

  **(Self-Correction during drafting):** I should make sure to mention that even if Alice looks at Bob, she can't necessarily formulate $F_B$. The "specifiability" problem is also relevant, but the consistency problem is the logical killer for the specific argument provided. I will focus on consistency as the primary logical slip, but mention specifiability as a secondary practical barrier.

