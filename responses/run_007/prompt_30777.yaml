          *   (5) The Critical Failure. Assumes Mind knows $Con(F_M)$. Violates Gödel 2.
          *   (6) The *Reductio*. Shows why (5) is impossible intersubjectively and intrasubjectively.
      *   **The Core Philosophical Issue:** Soundness vs. Consistency. The gap between *being* consistent and *knowing* one is consistent.
      *   **Implications:** What this means for Lucas-Penrose. It shifts the burden from "Machines can't do X" to "Humans can't know they do X."
      *   **Conclusion:** The argument doesn't refute computationalism; it refutes *knowable* soundness.

  7.  **Self-Correction/Nuance Check:**
