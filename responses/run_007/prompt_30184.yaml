      *Decision:* A hybrid of "Bookie" and "Physical Prop." Let's call it **"The Wager Workshop."** It needs distinct rounds corresponding to the three targets.

  3.  **Developing the Three Rounds:**

      *   **Round 1: Frequency (The Urn/Dice).**
          *   *Goal:* Show that past data stabilizes belief.
          *   *Mechanic:* A bag with known (to the house, not students) but discoverable ratios of colored chips. Or better, a die roll history. Let's go with a physical "Black Box" that dispenses outcomes.
          *   *Twist:* Students bet on the *next* outcome, but they are given a history log.
          *   *Payoff:* If they bet according to the frequency, they win in the long run. If they bet on "gambler's fallacy," they lose.
          *   *Philosophical Hook:* Why do you trust the history?

      *   **Round 2: Single Case (The Unique Event).**
          *   *Goal:* Show the discomfort of no reference class.
          *   *Mechanic:* Something unique. "Will the instructor drop this marker?" "Will it rain tomorrow?" "Will a specific student get an A?"
          *   *Problem:* If it's too random, it feels like frequency. If it's too personal, it feels like pure guesswork.
          *   *Selection:* "Will the *next* coin flip (which I will flip right now) be heads?" Wait, that's frequency.
          *   *Better:* "Will the President veto the bill?" (Too political).
          *   *Best:* A physical single-case setup. I have a weird, weighted object. I will drop it *once*. Students must price it. There is no history.
          *   *Philosophical Hook:* What are you pricing? Your confidence? The object's nature?

      *   **Round 3: Coherence (The Dutch Book).**
          *   *Goal:* Show that inconsistent probabilities lead to guaranteed loss.
          *   *Mechanic:* Students set odds on a set of mutually exclusive/exhaustive events (e.g., Die rolls 1-6, or Red/Blue/Green).
          *   *Twist:* Another student (or the House) gets to choose which side of the bet to take *after* seeing the odds.
          *   *Payoff:* If odds sum to >100% (or <100%), the House can construct a portfolio that guarantees profit regardless of outcome.
          *   *Philosophical Hook:* Probability as logical consistency, not just world-matching.

