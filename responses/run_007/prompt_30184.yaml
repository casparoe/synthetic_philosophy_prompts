prompt: |-
  You're a philosophy of science instructor who teaches the interpretations of probability to undergrads, and I want you to think carefully and brainstorm a few possible designs before committing. I need a 75-minute in-class game for a seminar of about 15 students (some have had a stats course, most haven't) that makes them feel the pull of frequentism, subjectivism, and the propensity view before any lecture, and ideally before they hear those names. The game should force them to price or bet on at least three things: a repeatable event where a stable frequency is available, a single-case event with no obvious reference class, and a set of odds they post themselves so that another student can clean them out if their odds are incoherent. Give me rules, materials, a payoff scheme that doesn't use real money, and a debrief that maps each moment onto one of the three interpretations. Be honest about what the activity cant settle — I'm worried the students will walk out thinking the single-case round just proves propensity is correct. Also tell me what will predictably go wrong the first time I run it and how to handle it. One more thing: the idea should hit them through the rules and the payoffs, not through anything the facilitator says afterwards.
