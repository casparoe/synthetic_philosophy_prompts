          *   *Status:* Parochial. Is Agreement a feature or a bug?
          *   *Tension:* No Agree-to-Disagree vs. Plausible Disagreement (Real agents disagree).

      *   *Topic 7: Generation of CK.*
          *   *Issue:* How do we get CK? Public announcements?
          *   *Desideratum:* **Generativity.** The theory must explain how CK arises from physical events.
