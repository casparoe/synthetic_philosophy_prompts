          *   Address specific topics: Coordinated Attack/Lewis, Rubinstein's Email Game, Infinite Hierarchy vs. Finite Agents, CK vs. Common Belief (CB), CK of Rationality & Equilibrium, Aumann Agreement Theorem, Generation of CK.
          *   **Crucial:** Flag tensions/incompatibilities between desiderata. The user *expects* and *wants* to see these tensions.

  2.  **Deconstruct the Topics & Identify Desiderata:**

      *   *Topic 1: Coordinated Attack / Lewis.*
