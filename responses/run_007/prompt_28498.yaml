          *   *Desideratum:* **Robustness / Continuity.** Predictions shouldn't explode with tiny perturbations. OR **Precision.** CK must be exact to sustain specific equilibria.
          *   *Tension:* Robustness vs. Precision. Rubinstein shows exact CK is fragile.
          *   *Status:* Robustness is desirable for application; Precision is required for the standard definition. This is a major tension point.

      *   *Topic 3: Infinite Hierarchy vs. Finite Agents.*
          *   *Issue:* Humans can't hold infinite beliefs.
          *   *Desideratum:* **Finite Representability.** Agents must be able to possess CK without infinite cognitive load.
          *   *Status:* Non-negotiable for psychological plausibility, but Parochial for standard semantic models (which treat it as a state constraint, not a mental list).
          *   *Tension:* Finite Representability vs. Coordination Sufficiency (usually requires the infinite structure).

      *   *Topic 4: CK vs. Common Belief.*
          *   *Issue:* Agents are rarely certain.
          *   *Desideratum:* **Probabilistic Coherence.** The theory should handle uncertainty (Common $p$-Belief).
