  5.  **Identifying the Core Tensions (The "Meat"):**
      *   *Tension 1: The Lewis-Rubinstein Conflict.* CK is needed for coordination (Lewis), but CK is fragile/non-robust (Rubinstein). You can't have Coordination Sufficiency and Approximation Stability simultaneously in the standard framework.
      *   *Tension 2: The Cognitive Limit.* Infinite Hierarchy vs. Finite Minds. Semantic models hide this, but syntactic models expose it.
      *   *Tension 3: Agreement vs. Reality.* Aumann's theorem is mathematically elegant but empirically suspect.
      *   *Tension 4: Generation vs. Certainty.* Public signals generate CK, but real signals are noisy. Noisy signals $\to$ Common Belief, not CK. If you switch to CB, you lose Aumann/Nash guarantees.

  6.  **Final Review against User Prompt:**
      *   Did I cover Coordinated Attack? Yes.
