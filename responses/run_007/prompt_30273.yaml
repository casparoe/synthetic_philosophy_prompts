answer: |-
  Yes, this assumption has a standard name. In the literature on game theory, formal epistemology, and the economics of information, it is called the **Common Prior Assumption (CPA)**.

  In more philosophical circles, particularly when discussing the normative implications of the assumption, it is sometimes referred to as **Harsanyi's Doctrine** (a term coined by Faruk Gul in 1998, referencing John Harsanyi's work on Bayesian games in the late 1960s).

  Here is a breakdown of how to handle this on your syllabus and in your seminar, addressing your specific questions about its status, its relation to the agreement theorem, and its distinction from other principles.

  ### 1. The Name and the Label
  For your syllabus, **The Common Prior Assumption** is the most precise and recognizable term. It distinguishes the *starting point* (the prior) from the *process* (updating) and the *epistemic state* (common knowledge).

  If you want to capture the normative weight you described—the idea that differing priors constitute a kind of rational failure—you might annotate it as:
  > **The Common Prior Assumption (Harsanyi's Doctrine)**

  This signals to students that while it is a modeling assumption, it carries a philosophical claim about the nature of rationality.

  ### 2. Rationality Requirement vs. Modeling Convenience
  This is one of the major fault lines in the literature.

  *   **The "Rationality" View (Harsanyi/Aumann):** The argument here is that all differences in belief must ultimately be traceable to differences in information. If two agents have different priors, that difference must be due to some past informational asymmetry (genetics, upbringing, past observations). If you trace the history back far enough (to the "beginning of time" or a state of total ignorance), rational agents *must* converge on the same probability distribution. On this view, differing priors are indeed a sign of irrationality (or at least, the model treats them as outside the scope of rational discourse).
  *   **The "Subjective" View (Savage/Keynes):** In classical decision theory (e.g., Savage's *Foundations of Statistics*), priors are subjective. Two agents can be perfectly rational, adhere to all axioms of coherence and Bayesian updating, and still start with different priors. On this view, the CPA is merely a **modeling convenience**. It is imposed to make the math tractable and to allow for strong theorems (like Aumann's), but it is not a requirement of rationality itself.

  In your seminar, you can frame the CPA as the point where formal epistemology often diverges from subjective Bayesianism. The formal disagreement literature generally *adopts* the CPA to see what follows, but many philosophers (e.g., Adam Elga, David Christensen, or those working on "permissivism") reject it as too strong for real-world rationality.

  ### 3. Relation to the "No Agreeing to Disagree" Theorem
  The Common Prior Assumption is a **necessary premise** of Aumann's Agreement Theorem. It is not a consequence of the theorem, nor is it stronger than the theorem needs; it is a foundational condition without which the theorem collapses.

  *   **The Logic:** The theorem states: *If* agents have Common Priors *and* their posteriors are Common Knowledge, *then* their posteriors must be identical.
  *   **The Counterfactual:** If you remove the Common Prior Assumption, agents **can** agree to disagree. If Alice starts with $P(H) = 0.9$ and Bob starts with $P(H) = 0.1$, and they both observe the same evidence $E$, they will update to different posteriors. They can know each other's posteriors, know each other is rational, and still disagree. The disagreement is "explained" by their different starting points rather than a failure of rationality.

  So, the CPA is the specific move that forces the disagreement to be located entirely in the *information* rather than the *inclination*.

  ### 4. Distinction from the Principle of Indifference
  It is crucial to distinguish these two, as students often conflate "same prior" with "uniform prior."

  *   **The Principle of Indifference:** This is a rule for determining the **content** of a prior when evidence is lacking. It says: "If you have no reason to prefer outcome A over outcome B, assign them equal probability (e.g., 0.5 each)."
  *   **The Common Prior Assumption:** This is a rule for determining the **identity** of the prior across agents. It says: "Whatever probability distribution you derive (whether via indifference, frequency data, or intuition), it must be the *same* distribution that your epistemic peer uses."

  **Example:** The CPA allows everyone to start with a prior that the disease is 90% likely. The Principle of Indifference would require them to start at 50% (assuming a binary state). The CPA demands intersubjective agreement on the starting point; the Principle of Indifference dictates a specific starting point based on ignorance.

  ### 5. Syllabus Recommendation
  To prevent confusion with **Common Knowledge of Rationality** (which is about the agents' knowledge of each other's reasoning processes during the update phase), I recommend structuring the syllabus distinction like this:

  1.  **Common Prior Assumption:** Constraints on the *initial state* (Where do we start?).
  2.  **Bayesian Updating:** Constraints on the *dynamic process* (How do we move?).
  3.  **Common Knowledge:** Constraints on the *epistemic environment* (What do we know about each other?).

  **Suggested Syllabus Entry:**
  > **The Common Prior Assumption (CPA):** The requirement that rational agents share an identical prior probability distribution over states of the world before receiving private signals. Often associated with *Harsanyi's Doctrine*. Contrasted with *Subjective Bayesianism* (which allows divergent priors) and the *Principle of Indifference* (which dictates specific prior values).

  This should give your students the precise vocabulary they need to isolate that specific modeling move you identified.
