      *   *Status:* This is highly debated.
      *   *Pro-CPA:* Harsanyi, Aumann, Geanakoplos. Argument: Differences in priors reflect differences in information (genetics, upbringing, past experience). If you trace it all back to the "beginning of time," priors should be identical. It's a requirement of *objective* rationality.
      *   *Anti-CPA:* Savage (subjective expected utility allows different priors), Gul (1998), various behavioral economists/philosophers. Argument: People can be rational but have different fundamental outlooks. It's a modeling convenience to ensure tractability and allow for the Agreement Theorem to hold.
      *   *Consensus:* It's often treated as a rationality requirement *within* the specific framework of Aumann-style agreement, but broadly in decision theory (Savage), priors are subjective.

