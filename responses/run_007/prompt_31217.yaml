prompt: |-
  You're a philosopher of mathematics who's comfortable with model theory and set theory. Think carefully, and maybe brainstorm a bit before you commit — I want the diagnosis, not just a summary of the paradox.

  I'm a grad student and I've got an argument that seems to prove too much, and I can't find the exit.

  (1) If ZFC is consistent, it has a countable model M (downward Löwenheim–Skolem).
  (2) ZFC proves that P(ω), the powerset of the natural numbers, is uncountable.
  (3) So M satisfies 'P(ω) is uncountable' — the set M calls P(ω) is uncountable from M's point of view.
  (4) But M itself is countable, and the set M calls P(ω) is a subset of M's domain, so from our point of view it's countable.
  (5) So the same set is both countable and uncountable.
  (6) So 'countable' and 'uncountable' are model-relative, and there's no absolute fact about whether there are more reals than naturals.
  (7) But that's absurd — either there are more reals than naturals or there aren't.

  I'd really like to keep (1) and (2); I don't want to become a finitist or throw out classical model theory. Wich step should I reject, and what does rejecting it cost me? If the problem is in (4)–(6), I need help seeing exactly where the slide happens.
