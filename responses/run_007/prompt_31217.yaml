      *   *The Model-Theoretic Mechanism:* How can $\mathcal{M}$ miss the bijection? Because $\mathcal{M}$ is not the whole universe. The bijection is a set of pairs. If that set isn't in $\mathcal{M}$'s domain, $\mathcal{M}$ thinks it doesn't exist.
