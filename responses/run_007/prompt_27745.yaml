      *   *Chase's report:* "The coffee tastes the same, but I don't like it as much." (Preference change).
      *   *Sanborn's report:* "The coffee tastes different, and I don't like the new taste." (Experience change).
      *   *Dennett's Point:* There is no way to verify who is right. Their behavioral outputs (rejecting the coffee) are identical. Their introspective reports are the only data, but those reports are theory-laden judgments, not raw data.
      *   *Qualia Defender's Move:* Treat the mind like a measurement device. There's a "raw taste" (qualia) and a "judgment standard" (preference). One changed, the other didn't. There is a fact of the matter.

  3.  **Task 1: Audit the Instrument-Calibration Analogy:**
      *   *Sample:* The chemical composition of the coffee.
      *   *Instrument:* The taster's sensory/cognitive system.
      *   *Baseline:* Past experience of the coffee (memory).
      *   *Calibration:* The criteria for "liking" or "detecting difference."
      *   *Reading:* The introspective report ("It tastes different" vs. "I like it less").
      *   *Units:* Qualitative characters (sweet, bitter, etc.).
      *   *The Claim:* Just as a thermometer can drift (calibration) or the temperature can change (sample), the mind can have drifting standards or drifting experiences.

  4.  **Task 2: Show Where the Mapping Breaks:**
      *   *Public vs. Private:* Thermometers can be cross-checked against other thermometers or physical standards. Qualia cannot.
      *   *Independent Access:* In physics, we can measure the temperature *and* the voltage output of the thermometer independently. In the mind, the "reading" *is* the introspection. There is no "meta-introspection" to check if the introspection is calibrated.
      *   *Circularity:* To say "My instrument drifted" requires knowing the sample didn't change. To say "The sample changed" requires knowing the instrument didn't drift. In the private case, you only have the output. Distinguishing the two requires assuming the distinction exists beforehand.
      *   *The "Cartesian Theater":* The analogy assumes a little homunculus reading the gauge. But who reads the homunculus's gauge?

  5.  **Task 3: Implications for the Larger Debate:**
      *   *Not just a bad picture:* It strikes at the heart of *incorrigibility* and *intrinsicness* (two of Dennett's four qualia properties).
      *   *Dennett's Heterophenomenology:* We must treat reports as texts to be interpreted, not as infallible data.
      *   *Incoherence:* If you can't distinguish the appearance from the judgment about the appearance, the "pure qualia" concept collapses into a judgment.
      *   *Strengthening Dennett:* It suggests that the "fact of the matter" the defenders seek is epistemologically inaccessible and ontologically superfluous.

