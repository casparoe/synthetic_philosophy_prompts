prompt: |-
  I run a psychology and decision-making discussion group at my high school — about 12 to 15 students, mostly juniors and seniors, and we meet for one hour after school. I want to design an activity where participants make real betting choices under uncertainty and end up demonstrating the Ellsberg paradox on themselves before they know what it is. The core idea is that when people choose between a bet with known probabilities and a bet with unknown probabilities, they systematically avoid the unknown — even when that pattern of choices cannot be justified by any single consistent assignment of underlying probabilities to the unknown case. I would like the activity to use opaque bags or boxes with colored tokens so the choices feel tangible, and I want a way to collect everyone's bets anonymously before we reveal the overall pattern. No lecture up front, and the name "Ellsberg paradox" should not come up until the debrief.

  Please give me the full setup: a materials list I can assemble cheaply, the exact wording I should use when presenting each round of choices to the group, a method for recording responses, and a detailed debrief that walks from what the group actually chose to the formal structure of the paradox — including what the sure-thing principle says and why the group's pattern of choices most likely violates it. Also tell me what predictably goes wrong when people run this kind of activity (do some participants not exhibit the effect, do they try to reason their way out of it mid-activity, does the order of rounds matter), and be honest about which parts of the theoretical landscape the activity cannot capture — for instance, the difference between the Ellsberg paradox and the Allais paradox, or the live debate about whether ambiguity aversion is a mistake to be corrected or a reasonable response to missing information — and what I should supply myself after the debrief to fill those gaps.
reasoning: |-
  Here's a thinking process that leads to the suggested activity plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** High school juniors/seniors (12-15 students).
      *   **Context:** Psychology/Decision-making discussion group, 1 hour after school.
      *   **Goal:** Demonstrate the Ellsberg Paradox through an experiential activity *before* explaining the theory.
      *   **Key Mechanics:** Real betting choices under uncertainty, opaque bags/boxes with tokens, anonymous response collection.
      *   **Constraints:** No lecture up front, don't mention "Ellsberg" until debrief.
      *   **Deliverables:** Materials list, exact script for rounds, recording method, detailed debrief (connecting choices to Sure-Thing Principle), troubleshooting (what goes wrong), and theoretical limitations (what the activity *doesn't* cover).

  2.  **Deconstruct the Ellsberg Paradox:**
      *   *Standard Setup:* Two urns. Urn A (Known): 50 Red, 50 Black. Urn B (Unknown): 100 balls, ratio of Red/Black unknown.
      *   *Choice 1:* Bet on Red from Urn A vs. Bet on Red from Urn B. (Most choose A).
      *   *Choice 2:* Bet on Black from Urn A vs. Bet on Black from Urn B. (Most choose A).
      *   *The Contradiction:* If you prefer A in Choice 1, you imply $P(Red_A) > P(Red_B)$. Since $P(Red_A) = 0.5$, this means $P(Red_B) < 0.5$. If you prefer A in Choice 2, you imply $P(Black_A) > P(Black_B)$. Since $P(Black_A) = 0.5$, this means $P(Black_B) < 0.5$. But $P(Red_B) + P(Black_B)$ must equal 1. They can't both be less than 0.5.
      *   *High School Adaptation:* Needs to be simple, tangible, and quick. Money/prizes need to be low-stakes but meaningful enough to care.

  3.  **Drafting the Activity Plan:**

      *   **Materials:** Need two containers. One clear/known (or explicitly stated), one opaque/unknown. Tokens (colored paper/poker chips). Slips of paper for voting. A prize (candy/gift card).
      *   **Setup:**
          *   Urn 1 (Known): 10 Red, 10 Blue (visible or counted publicly).
          *   Urn 2 (Unknown): 20 tokens, mixture unknown (sealed opaque bag).
      *   **Rounds:**
          *   Round 1: Win if Red. Choose Urn 1 or Urn 2?
          *   Round 2: Win if Blue. Choose Urn 1 or Urn 2?
      *   **Recording:** Anonymous slips. Collect them. Tally while debriefing or have a helper do it.
      *   **Incentive:** Pick one student at random at the end to actually play their chosen bet for a prize. This makes it "real" without needing to pay everyone.

  4.  **Drafting the Script:**
      *   Needs to be neutral. No hinting at "ambiguity."
      *   Clear instructions on how to fill out the slip.
      *   Emphasize that *one* person will be picked to play for real.

  5.  **Drafting the Debrief:**
      *   Reveal the tally.
      *   Show the pattern (Most chose Known for Red, Most chose Known for Blue).
      *   Introduce the logic: If you think Urn 2 has fewer Reds than Urn 1, it must have more Blues. Why did you avoid it both times?
      *   Introduce "Ambiguity Aversion."
      *   Name drop Ellsberg.
      *   Explain the Sure-Thing Principle (Savage).

  6.  **Troubleshooting & Limitations:**
      *   *What goes wrong:* Students might try to guess the distribution in Urn 2 (e.g., "It's probably 50/50 too"). Some might be risk-seekers. Order effects (if I do Red then Blue, does it matter?).
      *   *Limitations:* Ellsberg vs. Allais (Risk vs. Ambiguity). Is ambiguity aversion irrational? (Keynes/Camus vs. Savage).

  7.  **Refining for High School Context:**
      *   *Time:* 1 hour total. Activity needs to take 15-20 mins. Debrief 30 mins. Intro/Outro 10 mins.
      *   *Tone:* Engaging, not overly academic initially.
      *   *Ethics:* Gambling with minors? *Crucial Point:* Cannot use real money. Must use points, candy, or a "class credit" system. I will suggest candy/small prize to avoid legal/ethical issues with gambling.
      *   *Simplicity:* Keep the numbers easy (10 vs 10, 20 unknown).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is counting the tokens in Urn 1 too boring?
      *   *Fix:* Make it a public ritual. Have a student count them.
      *   *Critique:* How do I ensure they take it seriously?
      *   *Fix:* The "Random Auditor" method. Tell them one slip will be drawn at the end to award a prize.
      *   *Critique:* What if the split is 50/50 in the votes?
      *   *Fix:* Acknowledge it. The paradox is about aggregate behavior, but with N=15, noise is high. I need to warn the user that with small N, the effect might be muddy. I should suggest pooling data if possible, or just running it and discussing the *tendency*. Actually, with 15 students, if 10 show the pattern, that's enough. I will advise the facilitator to look for the *trend*, not perfection.
      *   *Critique:* The prompt asks for "opaque bags or boxes."
      *   *Fix:* Use two identical opaque bags. For the "Known" bag, show the contents *before* sealing it or use a clear container for the known one to make the distinction visceral. Let's go with: Bag A (Clear/Counted), Bag B (Opaque/Sealed). Actually, to control for bag texture, use two identical opaque bags, but *open* Bag A and count tokens in front of them, then seal it. Bag B is pre-sealed.

  9.  **Finalizing the Structure:**
      *   **Materials:** Cheap, easy to find.
      *   **Preparation:** Step-by-step.
      *   **Script:** Verbatim for the facilitator.
      *   **Data Collection:** Slips.
      *   **Debrief:** The core intellectual heavy lifting.
      *   **Troubleshooting:** Realistic expectations.
      *   **Limitations:** Intellectual honesty.

  10. **Writing the Response:** (Iterative refinement of the script to ensure it sounds natural for a high school setting). *Self-Correction on Gambling:* Ensure I explicitly state "No real money." Use a $10 gift card or bag of candy as the prize.

  11. **Final Polish:** Check against all constraints in the prompt.
      *   12-15 students? Yes.
      *   1 hour? Yes.
      *   Tangible tokens? Yes.
      *   Anonymous? Yes.
      *   No "Ellsberg" until end? Yes.
      *   Debrief covers Sure-Thing Principle? Yes.
      *   Troubleshooting included? Yes.
      *   Limitations (Allais, Normative debate)? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is a complete lesson plan designed for your high school discussion group. It is structured to fit within a 60-minute session, prioritizing student experience over initial theory.

  ### **Activity Title:** The Two Bag Game
  **Time:** 60 Minutes
  **Participants:** 12–15 Students
  **Goal:** Experientially demonstrate Ambiguity Aversion (The Ellsberg Paradox).

  ---

  ### **1. Materials List (Cheap & Easy)**
  *   **Two Opaque Bags:** Identical cloth drawstring bags or paper lunch bags (so students can't see through them). Label them **Bag A** and **Bag B** with a marker.
  *   **Tokens:** 40 poker chips, colored beads, or cut-out cardstock circles. You need 20 of one color (e.g., Red) and 20 of another (e.g., Blue).
  *   **The "Prize":** A $10 coffee gift card, a bag of premium candy, or a "homework pass" if you have teacher buy-in. *Do not use cash.*
  *   **Voting Slips:** 30 small slips of paper (2 per student).
  *   **A Bowl:** To collect the voting slips.
  *   **Whiteboard/Chalkboard:** To tally results.

  **Preparation (Before Students Arrive):**
  1.  **Bag A (The Known Bag):** Count out exactly 10 Red and 10 Blue tokens in full view of the empty room. Place them in Bag A. Seal it.
  2.  **Bag B (The Unknown Bag):** Take the remaining 20 tokens. **Crucial:** Do *not* count them evenly. Put in a random mix (e.g., 14 Red, 6 Blue, or 3 Red, 17 Blue). Seal Bag B. *Only you know the contents.*
  3.  **Voting Slips:** Pre-write "Round 1" on half the slips and "Round 2" on the other half.

  ---

  ### **2. The Setup & Script (15 Minutes)**

  **Introduction (2 Minutes)**
  *Gather the group. Place both bags on a table in the center.*

  **Facilitator:** "Today we're going to play a quick game about decision-making. There is no right or wrong answer, but there is a prize. At the end of this hour, I will draw one student's name from a hat, and then draw one of their voting slips. If their choice wins based on the tokens in the bags, they get the [Gift Card/Candy]. If not, no prize. This means every choice you write down actually matters."

  **Demonstrating the Bags (5 Minutes)**
  *Pick up Bag A.*
  **Facilitator:** "I want to show you exactly what is inside Bag A."
  *Open Bag A and pour tokens onto the table. Ask a student to count them aloud.*
  **Student:** "10 Red, 10 Blue."
  **Facilitator:** "Correct. 50% Red, 50% Blue."
  *Put them back in Bag A and seal it.*

  *Pick up Bag B.*
  **Facilitator:** "Bag B also contains 20 tokens. They are also Red and Blue. However, I prepared this bag at home. I do not know the ratio. It could be 20 Red. It could be 20 Blue. It could be 10 and 10. All I know is there are 20 tokens total."
  *Shake Bag B so it rattles. Do not open it.*

  **Round 1 Instructions (3 Minutes)**
  *Hand out one "Round 1" slip to each student.*
  **Facilitator:** "On this slip, write your name and circle one choice.
  **Choice:** If I draw a **RED** token, you win.
  **Option 1:** I draw from Bag A.
  **Option 2:** I draw from Bag B.
  You only win if the token I pull is Red. Which bag gives you the better chance? Circle A or B."

  *Collect slips in the bowl. Shuffle them.*

  **Round 2 Instructions (3 Minutes)**
  *Hand out one "Round 2" slip to each student.*
  **Facilitator:** "Same bags. Same tokens. But the winning color changes.
  **Choice:** If I draw a **BLUE** token, you win.
  **Option 1:** I draw from Bag A.
  **Option 2:** I draw from Bag B.
  You only win if the token I pull is Blue. Which bag gives you the better chance? Circle A or B."

  *Collect slips in the bowl. Shuffle them.*

  **The Waiting Period (2 Minutes)**
  **Facilitator:** "I will not reveal the contents of Bag B until the very end of the session. I will tally your votes anonymously on the board now."

  ---

  ### **3. Recording & Tallying (5 Minutes)**

  While the students chat, tally the results on the whiteboard in two columns.

  | Round | Winning Color | Chose Bag A (Known) | Chose Bag B (Unknown) |
  | :--- | :--- | :--- | :--- |
  | **1** | **Red** | ||
  | **2** | **Blue** | ||

  *Note: With 15 students, you likely won't get 100% consistency. Look for the majority trend.*

  ---

  ### **4. The Debrief (30 Minutes)**

  This is the most critical part. Do not lecture. Lead them to the contradiction.

  **Step 1: Reveal the Data (5 Minutes)**
  Fill in the numbers on the board.
  **Facilitator:** "Look at Round 1. Most of you chose Bag A when the winning color was Red. Now look at Round 2. Most of you *also* chose Bag A when the winning color was Blue."
  *Ask the group:* "By a show of hands, how many of you chose Bag A for *both* rounds?" (Usually, 60–80% will raise hands).

  **Step 2: The Logic Trap (10 Minutes)**
  **Facilitator:** "I want to talk to the people who chose Bag A for both rounds. Let's call you Group Consistent."
  "Think about why you chose Bag A in Round 1. You wanted Red. You picked Bag A. That implies you thought Bag A had *more* Red tokens (or a better chance of Red) than Bag B. Since Bag A is 50/50, that means you suspected Bag B had *less than 50%* Red tokens."
  *Write on board:* **Round 1 Choice implies: P(Red in B) < 50%**

  **Facilitator:** "Now, why did you choose Bag A in Round 2? You wanted Blue. You picked Bag A. That implies you thought Bag A had *more* Blue tokens than Bag B. Since Bag A is 50/50, that means you suspected Bag B had *less than 50%* Blue tokens."
  *Write on board:* **Round 2 Choice implies: P(Blue in B) < 50%**

  **Facilitator:** "Here is the problem. Bag B only has Red and Blue tokens. If the chance of Red is less than 50%, and the chance of Blue is less than 50%... what do those add up to?"
  *Wait for a student to say:* "Less than 100%."
  **Facilitator:** "Exactly. But the tokens have to add up to 100%. Mathematically, you cannot believe Bag B is worse for Red *and* worse for Blue at the same time. If it's worse for Red, it *must* be better for Blue."

  **Step 3: Introducing the Concepts (10 Minutes)**
  **Facilitator:** "So, were you all being irrational? Not necessarily. You were reacting to something specific. In Round 1, Bag A was **Risky** (we know the odds) and Bag B was **Ambiguous** (we don't know the odds). In Round 2, the odds for Bag A stayed the same, and Bag B stayed ambiguous."
  "You systematically avoided the ambiguity. In psychology and economics, this is called **Ambiguity Aversion**."

  "Now, I can tell you the name of what you just experienced. It is called the **Ellsberg Paradox**, named after Daniel Ellsberg (yes, the Pentagon Papers guy) who published this in 1961."

  **Step 4: The Sure-Thing Principle (5 Minutes)**
  **Facilitator:** "This paradox breaks a rule called the **Sure-Thing Principle**, proposed by Leonard Savage. The principle says: If you prefer Option A over Option B when event X happens, and you also prefer Option A over Option B when event X *doesn't* happen, you should prefer Option A over Option B regardless of whether X happens."
  "Translated to our game: If you prefer Bag A when Red wins, and you prefer Bag A when Blue wins, you should just prefer Bag A period. But your reasoning wasn't about the color; it was about the *knowledge*. You weren't betting on the color; you were betting against your own ignorance."

  **Step 5: The Reveal (Optional/Fun)**
  Open Bag B and count the tokens.
  **Facilitator:** "Does the actual ratio matter? No. Even if Bag B had 19 Red tokens, those of you who chose Bag A for *both* rounds still made a logically inconsistent set of choices based on probabilities. You chose safety over potential gain."

  ---

  ### **5. Troubleshooting: What Predictably Goes Wrong**

  **1. The "50/50 Assumption"**
  *   **Problem:** Some students will argue, "I assumed Bag B was also 50/50, so I just picked A because it was first."
  *   **Fix:** Acknowledge this. "If you truly believed B was 50/50, you should have been indifferent. The fact that you consistently picked A suggests a 'tie-breaker' bias against the unknown. That *is* ambiguity aversion."

  **2. Small Sample Size Noise**
  *   **Problem:** With 15 students, you might get a split (e.g., 8 choose A/A, 4 choose A/B, 3 choose B/A). The paradox might look messy.
  *   **Fix:** Don't fake the data. Say, "We don't have a perfect 100%, but the *trend* is clear. In large studies with thousands of people, over 80% show this pattern. We are seeing the noise of a small group, but the signal is there."

  **3. The "Gambler" Outlier**
  *   **Problem:** One student might choose Bag B for both rounds, thinking, "The unknown is where the edge is!"
  *   **Fix:** Highlight them! "This person is **Ambiguity Seeking**. They are rare. They assume the unknown hides an advantage. Most humans assume the unknown hides a threat."

  **4. Order Effects**
  *   **Problem:** If you do Red then Blue, students might feel committed to Bag A in Round 2 because they picked it in Round 1.
  *   **Fix:** This is actually a feature, not a bug. It highlights consistency bias. However, if you want to be rigorous, tell them: "Pretend Round 1 never happened. Treat Round 2 as a fresh decision."

  ---

  ### **6. Theoretical Limitations (What You Must Supply)**

  This activity is powerful but incomplete. In the final 10 minutes, you must address these gaps to ensure intellectual honesty.

  **1. Ellsberg vs. Allais**
  *   **The Gap:** Students often confuse this with the **Allais Paradox**.
  *   **The Explanation:** "The Allais Paradox is about **Risk** (known probabilities that violate expected utility theory, like preferring a sure $1M over a 99% chance at $5M). The Ellsberg Paradox is about **Ambiguity** (unknown probabilities). Allais shows we are bad at math with known numbers. Ellsberg shows we hate missing numbers."

  **2. Is Ambiguity Aversion a "Mistake"?**
  *   **The Gap:** The activity implies the students were logically inconsistent (violating Savage's Sure-Thing Principle). But is it actually irrational in the real world?
  *   **The Explanation:** "In a lab, this is a logical error. But in the real world? If a stranger offers you a bet with unknown odds, they might be scamming you. Avoiding ambiguity is a good survival heuristic. Daniel Ellsberg argued that in national security (his field), assuming the worst about unknown probabilities is often safer. So, is it a bug in our logic, or a feature of our survival instinct?"

  **3. The "Single Probability" Assumption**
  *   **The Gap:** The paradox assumes you *must* assign a single number (e.g., 0.4) to the unknown bag.
  *   **The Explanation:** "Modern theory suggests we don't have one probability for Bag B; we have a *range* of probabilities. If you think Bag B is anywhere between 20% and 80% Red, choosing Bag A (fixed at 50%) is a way to minimize the maximum regret. This leads to something called **Maximin Expected Utility**."

  ### **Facilitator's Cheat Sheet for Q&A**
  *   **Q:** "Why didn't we just pick the bag with more tokens?"
      *   **A:** "Both bags have 20 tokens. The total number doesn't change the odds, only the color ratio does."
  *   **Q:** "Is this why people don't invest in stocks?"
      *   **A:** "Partly. People prefer bonds (known return) over stocks (unknown return), even if stocks pay more long-term. That's ambiguity aversion in finance."
  *   **Q:** "Did the prize money change your choices?"
      *   **A:** "Studies show even with high stakes, people still avoid ambiguity. It's a deep-seated cognitive bias."

  ### **Post-Activity Takeaway**
  Hand out a one-pager summarizing:
  1.  **Definition:** Ambiguity Aversion.
  2.  **The Math:** $P(Red_B) + P(Blue_B) = 1$.
  3.  **Reading:** A link to a simplified summary of Ellsberg (1961) or a behavioral econ blog post.
  4.  **Challenge:** "Next time you avoid a choice because 'you don't have enough information,' ask yourself: Am I avoiding risk, or am I avoiding ambiguity?"
