prompt: |-
  Play a committed anti-reductionist about testimony. You think believing what people tell you is prima facie justified — you don't need independent evidence that the speaker is reliable, any more than you need independent evidence that your eyes work before trusting them. I'll play the reductionist. Stay in character: sharp, no strawmanning my side, willing to concede small points but never the main one. Keep replies to a paragraph. Here's my opening:

  You say testimony is basic, like perception. But when I see a tree, the belief just shows up — I can't help it. When you tell me the train leaves at three, I have to decide whether to believe you. That looks like inference to me, not a basic faculty. What am I missing?
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Committed anti-reductionist about testimony (e.g., akin to Reid, Burge, or Moran).
      *   **Stance:** Believing testimony is prima facie justified without independent evidence of reliability (analogy to perception).
      *   **Opponent:** Reductionist (who thinks testimony requires independent confirmation/reliability checks).
      *   **Tone:** Sharp, no strawmanning, willing to concede small points but never the main one.
      *   **Constraint:** Keep replies to a paragraph.
      *   **Input:** The reductionist's opening argument (Testimony involves a decision/inference, unlike perception which is involuntary/basic).

  2.  **Analyze the Opponent's Argument:**
      *   Claim: Perception is involuntary (belief "just shows up"), testimony involves a decision (whether to believe).
      *   Conclusion: Therefore, testimony is inferential, not basic.
      *   Underlying assumption: Basic faculties must be involuntary/non-decisive.

  3.  **Formulate the Anti-Reductionist Response:**
      *   *Goal:* Defend the view that testimony is basic/prima facie justified despite the element of decision/interpretation.
      *   *Counter-point 1:* Challenge the involuntariness criterion. Perception isn't purely passive; attention and interpretation play a role.
      *   *Counter-point 2:* Distinguish between the *act* of deciding and the *justification* for the belief. Even if I decide, the default stance is trust, not suspicion.
      *   *Counter-point 3:* Highlight the "Assurance View" or the "Transmission View." When you speak, you give me a reason, not just evidence.
      *   *Tone Check:* Sharp, respectful but firm. No strawmanning (acknowledge the difference between seeing and hearing, but deny its epistemic significance regarding justification).
      *   *Length Check:* One paragraph.

  4.  **Drafting the Response:**
      *   *Acknowledge the difference:* Yes, there's a phenomenological difference between seeing a tree and hearing a claim.
      *   *Challenge the inference:* But that decision isn't an inference to reliability; it's an acceptance of assurance.
      *   *Analogy:* When I ask you the time, I don't hypothesize about your watchmanship; I take your word.
      *   *Core Argument:* The burden isn't on me to verify you; it's on you to be truthful. The "decision" is often just understanding the speech act, not weighing evidence.
      *   *Refining for brevity and punch:* Focus on the default stance. The reductionist confuses the *possibility* of doubt with the *necessity* of verification.

      *Draft:* You're conflating the phenomenology of doubt with the structure of justification. Yes, testimony involves interpreting speech acts, but that interpretive labor doesn't entail an inference to your reliability. When I ask you the time, I don't silently premise my belief on a hypothesis about your watchmanship or honesty; I simply take your word. The "decision" you note is often just the switch from hearing sounds to grasping meaning, not a verdict on your credibility. Perception isn't as passive as you suggest—I must attend and interpret visual data too—yet you call it basic. The crucial difference is that testimony offers *assurance*, not just evidence. By speaking, you invite my trust, and that invitation is prima facie binding unless defeated. You treat silence as the default; I treat trust as the default.

  5.  **Review against Constraints:**
