answer: |-
  For Keynes, specifically in his *Treatise on Probability*, the first six months of the pandemic were the epitome of uncertainty, not risk. Risk implies known distributions—like a casino—where numerical probabilities govern outcomes. Uncertainty describes situations where no calculable probability exists because the relevant evidence is absent or the phenomenon is novel. SARS-CoV-2 was a new pathogen; transmission vectors, lethality, and intervention efficacy were unknown. There was no frequency data to ground a numerical probability.

  Public health authorities, however, acted as if they faced risk. They deployed models generating precise case counts and death tolls and issued definitive guidance on masks and transmission. In Keynesian terms, they conflated uncertainty with risk. They assigned numerical values to propositions where the logical relation between evidence and conclusion was too weak to support quantification. Probability, for Keynes, is a logical relation between propositions. When the evidence (proposition A) is scant, the logical support for the conclusion (proposition B) cannot be strong, yet authorities presented weak logical relations as certainties. When the WHO stated masks were unnecessary for the public, they treated a hypothesis based on scant evidence as a high-probability fact, ignoring that the probability was non-numerical and perhaps incomparable to other risks.

  This is where Keynes's concept of the "weight of evidence" illuminates the failure. Probability is the degree of rational belief; weight measures the amount of evidence underlying that belief. You can have a high probability estimate based on flimsy data (low weight). Early pandemic decisions often had high asserted probability but incredibly low weight. Authorities projected confidence without acknowledging the fragility of the data. A Keynesian approach would have demanded humility: acknowledging that while lockdowns might be the rational choice, the *confidence* in that choice was low due to the thinness of the evidence. Travel bans were implemented with high conviction but low weight, as the viral spread was already global.

  Standard decision theory typically focuses on maximizing expected utility based on assigned probabilities. It struggles when probabilities are unknowable. Keynes's framework highlights that the problem isn't just calculating the best move, but recognizing when the calculation itself is spurious. It explains why guidance flip-flopped: as the weight of evidence increased, the logical relation changed, altering the probability. Standard theory views this as inconsistency; Keynes views it as rational updating under uncertainty. The shift on aerosol transmission wasn't error; it was the weight of evidence finally supporting a different logical relation.

  However, Keynes's framework fails to guide action when weight is low. Knowing you are in uncertainty doesn't tell you whether to lockdown or reopen. It offers an epistemic diagnosis, not a policy prescription. Governments could not wait for high weight; the cost of inaction was potentially catastrophic. They had to act under uncertainty, effectively guessing where Keynes would advise caution. This reveals a gap in Keynes's thought: it describes the limits of knowledge but offers no heuristic for acting when knowledge is limited.

  Ultimately, the episode vindicates Keynes's descriptive claim: much of what is treated as probabilistic risk is actually uncertainty. The precise models proved wrong not because of calculation errors, but because the premises lacked weight. The early months showed that numerical probabilities were often illusions of precision. Yet, it also shows the limits of his philosophy. Life requires action even when the weight of evidence is negligible. Keynes tells us to be humble about our probabilities, but he cannot tell us how to save lives when humility offers no plan. The authorities were right to act, but wrong to pretend they knew the odds. They faced uncertainty but managed it as risk, creating a crisis of trust when the models inevitably fractured under the weight of reality.
