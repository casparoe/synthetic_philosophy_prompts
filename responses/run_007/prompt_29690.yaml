      *Let's refine the "Consequential Choice".*
      A surgeon operating remotely?
      If the haptic feedback is real, she saves a life.
      If the haptic feedback is a simulation generated by the patient's dying brain, she is killing a body in the real world while thinking she's saving a virtual one.
