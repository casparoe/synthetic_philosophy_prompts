      *Symmetry:* Either he slept and arrived (Arrival is real, Journey is dream), OR he is still sleeping and dreaming of arrival (Journey is real, Arrival is dream).
      *Consequential Choice:* Open the hatch (risk exposure if still dreaming/simulated) or stay asleep (risk missing arrival if real).

