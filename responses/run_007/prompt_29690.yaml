      *   *Idea 3: AI/Consciousness.* An AI wondering if it's simulating a human or a human simulating an AI.
      *   *Idea 4: Virtual Relationship.* Two people communicating only digitally. One might be a bot, but what if the human is the bot?
      *   *Idea 5: Medical/Coma.* A patient waking up vs. a healthy person dreaming they are sick.
      *   *Idea 6: The "Deep Fake" Identity.* A person receiving evidence they are a clone vs. the original.
      *   *Idea 7: The Architect vs. The Inhabitant.* A designer of a space vs. someone living in it.

      *Refining Idea 3 (AI/Consciousness):* Let's try to make it more grounded. A developer testing a neural link?
