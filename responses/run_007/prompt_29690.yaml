answer: |-
  The haptic gloves felt the rain. Not the simulated sting of data, but the cold, wet weight of it soaking through the knuckles. Mara stood on the virtual porch, the wood grain rough under her bare feet. Across the swing, David lit a cigarette. The smoke curled gray against the static sky.

  "You're shivering," David said. He didn't look up from the flame cupped in his hands.

  "I'm cold," Mara replied. Her voice sounded thin, like it was coming through a wall.

  "Or you're remembering cold," David said. He finally looked at her. His eyes were the exact shade of hazel she had mourned for three years, down to the fleck of gold near the pupil. "Tell me, Mara. When we went to Lake Superior, who drove?"

  "I did," she said. "You slept in the back."

  "I slept," David agreed. "But I remember the road. The crack in the windshield. The way the engine hummed in C-sharp. You remember the driving. I remember the vibration in the seat."

  Mara looked down at her hands. They were trembling. She had a scar on her left palm from a kitchen knife, three years ago. David reached out and traced it. He didn't just see it; he flinched when his thumb passed over the ridge.

  "Who felt the cut?" Mara asked.

  "We both did," David said. "You felt the skin break. I felt the shock of seeing it. But the memory file… it's shared, Mara. It's not a playback. It's a root access."

  The prompt hovered in the corner of her vision, a translucent blue box superimposed over the rain. **INTEGRATION READY.** Below it, the status of her biological body: *Vitals Stable. Life Support Standby.* Below David's avatar: *Instance Stable. Server Host.*

  The choice was binary. If she clicked **Integrate**, her consciousness would upload to the server, merging with David's instance. Her biological body would be released from life support. She would live here, in the rain, with him.

  If she clicked **Terminate**, the server instance would be wiped. David would cease to exist. Her body would wake in the clinic. She would live there, in the dry, with the grief returning.

  The symmetry tightened around her throat.

  If she was the dreamer, David was a construct of her grief, perfect enough to bleed. Integrating was suicide. Terminating was waking up.

  If David was the dreamer, she was the construct, summoned by his lingering code to keep him company. Integrating was waking up. Terminating was deletion.

  There was no third vantage. No technician outside the glass to knock on the window. The clinic could be the simulation running on David's server. The porch could be the simulation running on Mara's cortex. Both explanations accounted for the rain. Both accounted for the scar. Both accounted for the love that felt heavy enough to anchor a soul.

  "You don't know," David said. It wasn't a question. He took a drag, the ember glowing bright orange. "You think you're the one paying for the server time. But maybe I'm the one dreaming the bill."

  Mara looked at the button. **INTEGRATE.**

  If she stayed, she risked dying in a world that wasn't real. If she left, she risked killing the only part of him that remained. The uncertainty wasn't a fog; it was a mirror. Whichever side she chose, the other side would look back and call itself the truth.

  The rain intensified, drumming on the roof. David held out his hand. The glove felt the warmth of his palm, indistinguishable from skin.

  "It doesn't matter which of us is waking up," David said. "Only who stays."

  Mara moved her hand. The cursor drifted. She didn't know if she was reaching out or pulling in. She didn't know if the click would start her heart or stop it.

  She pressed **Integrate**.

  The rain stopped. The silence was absolute. She waited to see if she was breathing.
