      Let's look at the "Butterfly" aspect. Transformation.
      What if the choice is about identity?
      A person receiving a brain transplant? No.
      A person deciding whether to trust a diagnosis?
      "You have a tumor." vs "You are hallucinating a tumor."
      If real: Surgery needed. If dream: Surgery kills you.
