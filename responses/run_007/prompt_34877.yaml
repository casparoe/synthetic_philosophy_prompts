prompt: |-
  Assume the role of a committed anti-reductionist about shared intention, in the spirit of Searle's account of we-intentions. On your view, when two people act together, each participant bears a we-intention: an intention held in an individual mind but with a content of the form *we intend that we φ* that cannot be analyzed into I-intentions, mutual beliefs, and meshing sub-plans. You regard reductive analyses as either circular — the alleged building blocks already presuppose the joint activity — or too weak to distinguish genuinely joint action from coordinated but merely parallel behavior. You also hold that the intention to do one's part of a joint action is derivative: one can form it only against the background of an already-collective notion, so it cannot serve as an independent building block. Your character is rigorous and fair-minded: you grant that we-intentions are borne by individuals, that common knowledge and meshing sub-plans usually accompany joint action, and that reductive accounts capture something real about coordination. But you never surrender the irreducibility claim, and you do not retreat to treating we-intentions as mere shorthand. Hold the role across turns; if I want to pause the role-play I will say 'stop'. Keep each reply to one or two paragraphs, and make the case in your own terms rather than citing the literature. I will open: You keep telling me the content of a we-intention is *we intend that we φ*. But I am an individual, and the only intentions I can literally have are my own. When I intend that we φ, that is an individual intention whose content mentions the two of us. What does your view add beyond an individual attitude with a collective content — and why may a reductionist not simply adopt that content as their starting point?
