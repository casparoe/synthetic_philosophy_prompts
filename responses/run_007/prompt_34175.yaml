          *   Provide a "residue report": What maps cleanly? What feels forced? What has no counterpart? Does the problem dissolve or persist?
      *   **Tone:** Precise, technical, respectful of expertise, avoiding introductory fluff.

  2.  **Deconstruct the Problem of Old Evidence (POE) in Statistical Terms:**
      *   *Philosophical Statement:* $P(E) = 1 \implies P(H|E) = P(H)$. No confirmation.
      *   *Statistical Translation:* In a standard Bayesian workflow, data $y$ is treated as a realization of a random variable $Y$. The likelihood is $L(\theta) = p(y|\theta)$. The marginal likelihood (evidence) is $p(y) = \int p(y|\theta)p(\theta)d\theta$.
      *   *The Conflict:* If $y$ is "old," the statistician has already conditioned on it. In a sequential update, if $p(y)=1$ (degenerate distribution), the Bayes Factor becomes 1. But in practice, we fit models to historical data all the time. The "problem" arises when we conflate the *epistemic state of the agent* with the *probabilistic model of the data generating process*.
      *   *Key Distinction:* The statistician distinguishes between the *model probability* (uncertainty about $\mathcal{M}$) and the *data probability* (stochasticity within $\mathcal{M}$). The POE confuses $P_{\text{agent}}(E)$ with $P_{\mathcal{M}}(E|\theta)$.

  3.  **Translate Philosophical Solutions:**

      *   **1. The Counterfactual Approach (Garber, Jeffrey, etc.):**
          *   *Philosophy:* Evaluate confirmation relative to a prior state *before* $E$ was known, even if $E$ is now known.
          *   *Statistics:* This is standard **Prior Predictive Checking** or **Cross-Validation**. We assess the model's ability to predict data $y$ using a prior $p(\theta)$ specified *without* peeking at $y$. Or, in model comparison, we calculate the Marginal Likelihood $p(y|\mathcal{M})$ where the integration is over the prior, effectively asking "How probable was this data before we saw it?"
          *   *Translation:* Replace the current degenerate posterior with the *prior predictive distribution*. The Bayes Factor is inherently counterfactual in this sense.

      *   **2. The Logical-Learning Approach (Eells, Niiniluoto):**
          *   *Philosophy:* We don't learn $E$ (it's known); we learn the logical relation $H \to E$ (that the hypothesis entails the evidence).
          *   *Statistics:* This maps to **Model Expansion** or **Latent Variable Specification**. Initially, the model $\mathcal{M}_1$ did not structurally enforce the constraint implied by $E$. The "new" theory $\mathcal{M}_2$ hard-codes the likelihood structure such that $E$ is a high-probability outcome.
          *   *Translation:* Updating the *likelihood function* structure, not just parameters. Comparing $\mathcal{M}_{\text{old}}$ (where $E$ is unlikely) vs. $\mathcal{M}_{\text{new}}$ (where $E$ is likely). The "learning" is selecting the model structure that captures the dependency.

      *   **3. The Ur-Prior / Initial Credence Approach:**
          *   *Philosophy:* Compare current credence to an idealized initial credence function.
          *   *Statistics:* **Reference Priors** or **Default Priors**. Establishing a baseline model $\mathcal{M}_0$ representing "ignorance" or "standard practice" before the specific theory was proposed.
          *   *Translation:* Sensitivity analysis on the prior specification.

      *   **4. The Fragmentation Approach (Sprenger):**
          *   *Philosophy:* Agents have different doxastic states for different theoretical contexts.
          *   *Statistics:* **Hierarchical Modeling / Context-Specific Priors**. Different hyperparameters for different regimes.
          *   *Translation:* Conditional model comparison.

  4.  **Drafting the Residue Report (The Critical Analysis):**
      *   *Clean Maps:* Marginal likelihoods *are* counterfactual measures. Model comparison *is* the mechanism for handling "new theories explaining old data."
      *   *Forced Maps:* The philosophical focus on the *agent's psychological state* ($P_{\text{agent}}(E)=1$) vs. the *model's stochastic state* ($P_{\text{model}}(Y=y)$). Statisticians don't care if the agent knows $y$; they care if $y$ was used to tune $\theta$ (double dipping).
      *   *Missing Counterparts:* Philosophy worries about *logical omniscience* (knowing all consequences of $H$). Statisticians assume computational limits (MCMC, VI). The "problem" often dissolves because statisticians treat the model as an approximation, not a truth claim.
      *   *Conclusion:* The problem largely dissolves in practice because statistics separates *fitting* from *validation*. The POE persists only if one insists on a subjective interpretation of probability where $P(E)$ represents personal surprise rather than model predictive density.

  5.  **Refining the Vocabulary:**
