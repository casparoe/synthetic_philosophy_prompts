  7.  **Final Polish:** Organize into clear sections: Restatement, Translation of Solutions, Residue Report. (Proceed to generate output based on this structure.)

  *(Self-Correction Note during final output generation)*: I need to be careful not to dismiss the philosophical problem too easily. For a subjective Bayesian, the POE is real. For a pragmatic/statistical Bayesian, it's a workflow issue. I must articulate *why* the statistician's toolkit sidesteps it without claiming the philosophy is nonsense. The key is the *operationalization* of the prior.

  8.  **Final Plan:**
      *   **Section 1: Statistical Restatement.** Define POE as a confusion between the *epistemic probability of the data* (which is 1) and the *prior predictive density* (which is not).
