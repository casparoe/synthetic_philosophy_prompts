      *   **Goal:** A teaching plan that ensures the paradox lands as a genuine puzzle, not a trick/triviality.
      *   **Specific Requirements:**
          *   Order of conceptual pieces.
          *   One worked example/concrete case (and justification for choosing it over $\mathbb{R}$ or $\mathcal{P}(\mathbb{N})$).
          *   Predictable misconceptions and where/how to head them off.
          *   A final check question (internal vs. external viewpoint).
