answer: |-
  ### Candidate Norms

  Based on the five verdicts, the Truth Norm and Knowledge Norm are ruled out (Case 5 is false but proper; Case 4 lacks safety/sensitivity but is proper). Two norms remain that fit all data:

  1.  **The Internal Justification Norm:** Assert $p$ only if you believe $p$ and possess internally accessible reasons or evidence supporting $p$.
  2.  **The Process Reliability Norm:** Assert $p$ only if your belief is formed by a cognitive process that is generally reliable (truth-conducive in normal conditions), regardless of local luck.

  ### Predictions for the Wishful Thinking Case

  *   **Internal Justification Norm:** **Improper.** The speaker has no accessible evidence (no call, no website check); desire is not justification.
  *   **Process Reliability Norm:** **Improper.** Wishful thinking is not a generally reliable belief-forming process.

  *(Note: Both norms align with the verdict in Case 2 (The Hunch), which shares the same structure: True + Belief + No Evidence = Improper.)*

  ### Best Guess

  I believe the professor is running the **Internal Justification Norm**. Case 5 (Store Hours) is the clincher: the assertion is false, yet proper because the speaker did her "due diligence" (checking the website). This prioritizes the speaker's epistemic responsibility over the actual truth or external reliability of the source. Case 4 (Goldfinch) supports this too; despite the environment being hostile (making reliability shaky), the speaker's internal visual evidence was sufficient. The professor seems to care about whether the speaker *acted* responsibly, not whether the world cooperated.

  ### The Tiebreaker

  **The New Evil Demon Case:** A speaker is a brain in a vat. She asserts "I have hands" based on vivid sensory experience. She has perfect internal evidence, but her processes are completely unreliable (no hands exist).

  *   **Internal Justification Norm:** **Proper.** She has flawless accessible reasons for her belief.
  *   **Process Reliability Norm:** **Improper.** Her cognitive processes are not truth-tracking; they are systematically deceptive.

  This verdict would definitively separate the two norms.
