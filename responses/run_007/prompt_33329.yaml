      *   *Q9 (Theme a/d):* The Revolutionary Exception. You supported the Republicans in Spain. Was that a party?
      *   *Follow-up:* It was a necessity of war, not a principle. *Press:* Does necessity swallow the principle?
      *   *Q10 (Conclusion):* Rootedness. Does this proposal actually help people feel rooted or alienated?
