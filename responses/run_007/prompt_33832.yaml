  I'm trying to evaluate lexical threshold negative utilitarianism, but I've realized that before I can assess any particular version of it, I need to know what a theory of how pleasure and pain trade off against each other is supposed to do. Please write the desiderata for an account of the commensurability of pleasure and pain. What must such a theory get right? I have in mind requirements like: it must explain whether and why some pains are lexically prior to pleasures — no amount of the latter compensates for the former — and if so, where the thresholds lie and what grounds them. It must also handle the fact that we make ordinary tradeoffs between pleasures and pains all the time without treating every pain as lexically prior, so it cannot simply declare all pains incomparable with all pleasures. It must say something about aggregation across persons and across time, and about the creation of new lives: is it worse to bring into existence a life that will contain some suffering than to refrain from bringing into existence a life that would have contained more pleasure than pain? It must avoid entailing that we ought to eliminate all life capable of suffering, and it must be consistent with whatever we know about the psychology and neuroscience of pleasure and pain — for instance, whether they are processed by the same or different systems, and whether the contrast between positive and negative valence marks a qualitative boundary or a point on a continuum. For each requirement, give the case or consideration that motivates it, and mark whether it is non-negotiable or something a view could reasonably reject. Flag any pair of desiderata that you suspect cannot be jointly satisfied — that is the part I most want to see. Identify the single requirement that does the most work in excluding otherwise attractive views. Please write in continuous prose only, as in an email: no headings, bullet points, bold text, or tables.
