answer: |-
  - **Framing the issue**
  There is a striking discontinuity in contemporary animal ethics. Most scholars agree that industrial factory farming is a moral catastrophe requiring urgent mitigation, yet many treat wild animal suffering (WAS)—predation, disease, starvation—as morally neutral "natural processes." This intuition relies on a distinction between human-caused harm and natural harm. My thesis is that this distinction is morally irrelevant. If suffering is bad regardless of its source, and we accept duties to alleviate suffering we cause, consistency demands we accept at least *prima facie* duties to alleviate suffering we can prevent in the wild. The tension lies not in the value of the animal, but in the normative weight assigned to "naturalness" and causal responsibility.

  - **The core argument**
  The argument proceeds from three premises, moving from settled ground to contested claims. First, the **Sentience Premise**: moral status is grounded in the capacity to suffer. This is largely settled among sentientists; pain is intrinsically bad for the subject experiencing it. Second, the **Source Neutrality Premise**: the moral badness of suffering does not depend on its cause. Whether a chicken suffers in a cage or a gazelle suffers from predation, the phenomenological harm is identical. This is contested; some argue "natural" suffering lacks the agential injustice of human harm. However, if welfare is what matters, the source is secondary.

  Third, the **Capacity Principle**: if an agent can prevent significant harm without sacrificing something of comparable moral importance, they have a duty to do so (a Singer-esque formulation). Factory farming advocates accept this regarding humans' relationship to livestock. To deny this regarding wild animals requires showing a morally relevant difference. Proponents of WAS argue there is none. The only potential difference is epistemic or causal, not normative. Therefore, accepting duties to domesticated animals while denying *prima facie* duties to wild animals constitutes an inconsistency. One must either reject the Sentience Premise (abolishing animal ethics), reject the Capacity Principle (rejecting beneficence), or accept that the domain of moral concern extends to nature. The burden shifts to the skeptic to justify why "naturalness" negates the badness of suffering.

  - **Strongest objection**
  The most robust counterargument combines **Special Responsibility** with **Epistemic Risk**. This objection concedes that suffering is bad but denies that duties of beneficence are uniform. We have special obligations to beings we have domesticated because we created their dependency and vulnerability; we are causally responsible for their plight. Wild animals, conversely, exist independently of human agency. Imposing duties to intervene here transforms a negative duty (do not harm) into a demanding positive duty (fix nature), which risks moral overreach.

  Furthermore, the **Epistemic Risk** claim argues that ecosystems are complex adaptive systems. Intervening to reduce predation might cause ecological collapse, leading to greater net suffering. Unlike factory farming, where the harm mechanism is transparent, wild interventions have unknowable downstream effects. Thus, even if suffering is bad, the duty to prevent it is overridden by the duty not to cause catastrophic harm. This suggests the inconsistency is only apparent: we intervene in farming because we know how to stop the harm we created; we do not intervene in the wild because we lack the knowledge to help without causing worse harm.

  - **Reply and limits**
  This objection successfully limits *current* all-things-considered duties but fails to negate the *prima facie* commitment. Special responsibility adds weight to domestic duties but does not erase general beneficence. If I see a child drowning, I have a duty to help even if I didn't push them in; causal responsibility amplifies duty but does not create it ex nihilo. Regarding epistemic risk: this argues against *specific interventions*, not the *principle* of intervention. It implies we have a duty to research safe interventions rather than ignore the suffering.

  However, limits remain. This reply relies on the contested premise that "wildness" has no intrinsic value overriding welfare. Ecocentrists argue ecosystems have integrity worth preserving even at the cost of individual suffering. If one accepts ecocentrism, the inconsistency charge fails. Additionally, if negative utilitarianism is false (i.e., suffering isn't the only disvalue), the calculation changes. Thus, the argument secures a *prima facie* duty for welfarists but cannot compel ecocentrists. It establishes that ignoring WAS is intellectually costly, not that immediate intervention is mandatory.

  - **Conclusion**
  The argument demonstrates that rejecting duties to wild animals while accepting duties to domesticated ones requires rejecting core welfarist premises, specifically source neutrality and general beneficence. It does not prove we must intervene tomorrow, but it proves we cannot dismiss the issue as "natural." The inconsistency is real for sentientists. The debate now shifts from *whether* we have reasons to care to *how* we can act without violating epistemic constraints.
