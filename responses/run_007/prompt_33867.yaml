  1.  **"Fukuyama's point is simple."** **Mistaken.** The thesis rests on Hegelian dialectics via Kojève. It argues that human history is driven by the struggle for recognition (*thymos*), culminating in a system that satisfies this drive. It is not a simple geopolitical observation.
