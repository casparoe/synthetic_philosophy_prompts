answer: |-
  # Activity Title: The Ambiguity Audit
  **Course:** Upper-Level Undergraduate Seminar in Decision Theory / Philosophy of Economics
  **Time:** 75 Minutes
  **Participants:** ~20 Students
  **Goal:** Experientially demonstrate the Ellsberg Paradox, expose the violation of the Sure-Thing Principle, and force a trade-off between preference consistency and "ambiguity comfort."

  ---

  ## I. Materials & Setup

  1.  **The Urns:**
      *   **Urn 1 (Risk):** A clear acrylic box containing exactly **10 Red chips and 10 Blue chips**. Visible to all.
      *   **Urn 2 (Ambiguity):** An opaque cloth bag containing **20 chips** (Red/Blue mix). The ratio is fixed (e.g., 10 Red/10 Blue) but **hidden** from students. Tell them: *"There are 20 chips, some Red, some Blue. The ratio was determined by a random process before class. No one knows the exact count."*
  2.  **Choice Slips:** 40 small slips of paper (2 per student).
  3.  **Scoreboard:** Whiteboard or projected spreadsheet to track "Seminar Points."
  4.  **Stakes:**
      *   Each student starts with **0 Points**.
      *   Winning a bet = **+10 Points**.
      *   Losing a bet = **0 Points**.
      *   **Prize:** The student with the most points at the end receives a $25 gift card (or equivalent extra credit). *Note: Emphasize that points determine the prize, creating competitive stakes without using direct cash bets.*
  5.  **Room:** Tables arranged in a U-shape or clusters to allow visibility of Urn 1 but not Urn 2.

  ---

  ## II. Minute-by-Minute Timeline

  ### Phase 1: The Trap (0:00 – 0:25)
  *Goal: Elicit the ambiguity-averse preference pattern without theoretical framing.*

  *   **0:00 – 0:05: Introduction & Rules**
      *   Distribute Choice Slips.
      *   Explain the stakes: "You are building a portfolio of bets. Your final point total determines the prize winner."
      *   **Crucial Instruction:** "Do not discuss your choices with neighbors. This is a private decision."
      *   Do **not** mention Ellsberg, ambiguity, risk, or Savage. Refer to them only as "Urn 1" and "Urn 2."

  *   **0:05 – 0:15: Decision Round 1 (The Red Bet)**
      *   **Prompt:** "On Slip #1, choose **ONE** of the following options. You will win 10 Points if a **Red** chip is drawn."
          *   **Option A:** Draw from Urn 1 (Known).
          *   **Option B:** Draw from Urn 2 (Unknown).
      *   *Action:* Students mark slips, fold them, and place them in a collection box.
      *   *Facilitator:* Do not reveal preferences yet. Collect silently.

  *   **0:15 – 0:25: Decision Round 2 (The Blue Bet)**
      *   **Prompt:** "On Slip #2, choose **ONE** of the following options. You will win 10 Points if a **Blue** chip is drawn."
          *   **Option C:** Draw from Urn 1 (Known).
          *   **Option D:** Draw from Urn 2 (Unknown).
      *   *Action:* Students mark slips, fold, and submit.
      *   *Facilitator:* Collect silently.
      *   *Note:* Ensure students understand these are hypothetical bets for now. We will resolve them later.

  ### Phase 2: The Squeeze (0:25 – 0:45)
  *Goal: Expose the inconsistency and impose a cost for maintaining it.*

  *   **0:25 – 0:30: Tally & Reveal**
      *   Facilitator quickly tallies the four choice types (A, B, C, D).
      *   **Public Announcement:** "I am looking for a specific pattern. Did anyone choose **Option A (Urn 1 Red)** AND **Option C (Urn 1 Blue)**?"
      *   Ask those hands to stay up. (Typically, 60-80% of the class will have this pattern).
      *   **The Statement:** "If you raised your hand, you preferred the Known Urn for Red, and you preferred the Known Urn for Blue. You are 'Ambiguity Averse.'"

  *   **0:30 – 0:40: The Logical Audit (The "Dominance" Confrontation)**
      *   Project a table on the screen.
      *   **Facilitator:** "By choosing Urn 1 for Red, you act as if $P(Red_1) > P(Red_2)$. Since $P(Red_1) = 50\%$, you act as if Urn 2 has **less than 50% Red**."
      *   **Facilitator:** "By choosing Urn 1 for Blue, you act as if $P(Blue_1) > P(Blue_2)$. Since $P(Blue_1) = 50\%$, you act as if Urn 2 has **less than 50% Blue**."
      *   **The Trap:** "Is it possible for an urn with 20 chips to have *less than 10 Red* AND *less than 10 Blue* simultaneously?"
      *   *Class Response:* "No." (Sum must be 20).
      *   **Facilitator:** "Correct. Your choices commit you to a mathematical impossibility. You have violated the **Sure-Thing Principle**. Your preferences imply probabilities that sum to less than 1."

  *   **0:40 – 0:45: The Cost Choice**
      *   **Facilitator:** "You now have a choice to resolve this inconsistency before we draw the chips."
      *   **Option Revision (Free):** "You may change **one** of your slips to Urn 2. This makes your probabilities consistent. No cost."
      *   **Option Consistency (Cost):** "You may keep both slips as Urn 1. However, because this pattern allows a 'Bookie' to construct a Dutch Book against you (a guaranteed loss relative to a coherent strategy), you must pay a **3-Point Incoherence Fee**."
      *   *Action:* Students with the A+C pattern must privately submit a revision slip or accept the fee deduction on their scorecard.
      *   *Tension:* Students must decide if their discomfort with ambiguity is worth 30% of a potential win.

  ### Phase 3: Resolution & Debrief (0:45 – 1:15)
  *Goal: Map the experience to formal theory.*

  *   **0:45 – 0:55: The Draw**
      *   Draw one chip from Urn 1 (replace it).
      *   Draw one chip from Urn 2 (replace it).
      *   Award points based on final slips (minus any fees).
      *   Announce the winner.

  *   **0:55 – 1:10: Theoretical Mapping**
      *   **Risk vs. Ambiguity:** Urn 1 = Risk (Known probabilities). Urn 2 = Ambiguity (Unknown probabilities).
      *   **SEU Failure:** Explain that Subjective Expected Utility theory (Savage) requires a single prior $P$. The students revealed they do not have a single prior; they have a *set* of priors or a non-additive weighting.
      *   **Sure-Thing Principle:** Revisit the Phase 2 Audit. Explain that Savage's P2 says if you prefer $f$ to $g$ regardless of the state of the world, you should prefer $f$ to $g$. Here, the "State" is the composition of Urn 2.
          *   If Urn 2 has >10 Red: You should have bet on Urn 2 Red.
          *   If Urn 2 has <10 Red: You should have bet on Urn 1 Red.
          *   By betting Urn 1 for *both* Red and Blue, you claimed Urn 1 is better *regardless* of Urn 2's composition. But Urn 1 cannot be better than Urn 2 for Red *and* better than Urn 2 for Blue simultaneously (since one color must be more likely in Urn 2).
      *   **The Cost:** Discuss the "Incoherence Fee." In real markets, this fee is arbitrage. In the classroom, it's points. In philosophy, it's rationality.

  *   **1:10 – 1:15: Q&A and Limitations**
      *   Open floor for students who paid the fee to defend their choice.
      *   Final summary of the limitation (see below).

  ---

  ## III. Troubleshooting: What Will Go Wrong

  **1. The "Rational" Minority (No Paradox)**
  *   **Scenario:** 5-10 students choose Urn 1 for Red and Urn 2 for Blue (or vice versa). They are probabilistically consistent.
  *   **Facilitator Response:** Do not shame them. Acknowledge: "You are Savageans. You maximize Expected Utility. You are theoretically rational, but you are in the minority empirically. Today we study the majority intuition."

  **2. The "It's Just a Taste" Defense**
  *   **Scenario:** A student pays the fee and argues, "I know it's inconsistent, but I just *dislike* the opaque bag. It's my utility function."
  *   **Facilitator Response:** "Distinguishing belief from taste is the heart of the paradox. If it were just taste, you would pay the fee. But decision theory argues that 'taste' shouldn't violate probability axioms. If you dislike ambiguity, you should model that with a specific utility function over ambiguity, not by violating the sum rule. The fee represents the cost of not modeling it correctly."

  **3. Herding Behavior**
  *   **Scenario:** Students look at neighbors during Phase 1.
  *   **Prevention:** Collect slips immediately. If herding is suspected, note it in the debrief as a confounding variable (social ambiguity vs. epistemic ambiguity).

  **4. Boredom/Disengagement**
  *   **Scenario:** The "Logical Audit" feels like a math lecture.
  *   **Fix:** Keep the Phase 2 interaction high-energy. Ask the students to do the math on the board. "Who can tell me the maximum number of Red chips if my preference is true?" Make *them* find the contradiction.

  ---

  ## IV. Debrief Guide: Mapping Moments to Theory

  | Activity Moment | Formal Concept | Facilitator Script Snippet |
  | :--- | :--- | :--- |
  | **Urn 1 (Clear)** | **Risk** | "Here, the probability space is defined. $P(Red) = 0.5$. This is Knightian Risk." |
  | **Urn 2 (Opaque)** | **Ambiguity** | "Here, the probability measure is undefined. You cannot assign a unique $P$. This is Knightian Uncertainty." |
  | **Choosing Urn 1 for Both** | **Ambiguity Aversion** | "You revealed a preference for known probabilities over unknown ones, even when the expected value is identical." |
  | **The Logical Audit** | **Violation of Additivity** | "Your choices imply $P(Red) < 0.5$ and $P(Blue) < 0.5$. Summed, $P(Red \cup Blue) < 1$. But $Red \cup Blue$ is the certain event." |
  | **The Incoherence Fee** | **Dutch Book / Arbitrage** | "In a market, someone would sell you the Urn 2 portfolio and buy your Urn 1 portfolio, guaranteeing you a loss. The fee simulates this market discipline." |
  | **Revising the Choice** | **Restoring Coherence** | "By switching one bet, you align your subjective weights with the axioms of probability. You become a Savage agent." |

  ---

  ## V. Limitations: What the Game Cannot Reproduce

  **1. The "Real Money" Effect**
  *   **Issue:** Seminar points are not liquid cash. Loss aversion is lower with points than with rent money.
  *   **Facilitator Note:** You must verbally amplify the stakes. "This gift card is real. The points are your currency." Acknowledge that in high-stakes financial environments, ambiguity aversion often *increases*, making the paradox more severe, whereas here it might be treated as a game.

  **2. The "Single Shot" Problem**
  *   **Issue:** In the real world, agents learn the composition of Urn 2 over repeated draws. Ambiguity vanishes with information.
  *   **Facilitator Note:** "This is a one-shot game. In repeated interactions, ambiguity aversion often disappears as we learn the distribution. Ellsberg is about decisions under *strict* ignorance, not learning environments."

  **3. The "Existential" Weight**
  *   **Issue:** Choosing an urn for points is low-stakes compared to medical or climate decisions where Ellsberg is often applied.
  *   **Facilitator Note:** You must supply the gravity in words. "Imagine Urn 2 is a new medical treatment with unknown side effects. Urn 1 is the standard treatment. Your reluctance to choose Urn 2 isn't just about points; it's about the weight of the unknown. That feeling you had in Phase 1? That is the engine of the paradox."

  **4. The "Cost" is Artificial**
  *   **Issue:** The "Incoherence Fee" is imposed by the teacher, not the market.
  *   **Facilitator Note:** Clarify that in the real world, no teacher charges a fee. Instead, you simply lose money to arbitrageurs. "I am acting as the market maker today. In reality, the market itself would extract this cost from you until you revised your beliefs."
