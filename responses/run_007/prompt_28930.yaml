answer: |-
  The blog post you have read captures the broad outline of Elizabeth Anscombe's famous protest in 1956, but a scholar of her work would likely identify significant nuances that are missing or slightly distorted. While the post is not entirely inaccurate, it risks conflating Anscombe's moral philosophy with later historical revisionism.

  Here is an analysis of the specific claims, distinguishing between what an Anscombe scholar would accept and what requires correction.

  ### 1. The Event and the Opposition
  **Claim:** *In 1956 Anscombe publicly opposed Oxford's plan to award President Truman an honorary degree.*
  **Verdict:** **Accurate.**
  Anscombe did indeed lead a group of Oxford dons in opposing the degree. She circulated a pamphlet entitled *Mr Truman's Degree* and gathered signatures from faculty members who wished to register their dissent. It is worth noting, for context, that despite the protest, the degree was awarded on 20 June 1956.

  ### 2. The Moral Argument: Deliberate Attack on Civilians
  **Claim:** *The atomic bombings were war crimes because they deliberately attacked civilian cities, which the laws of war forbid.*
  **Verdict:** **Accurate.**
  This is the core of Anscombe's position. Writing from the standpoint of Catholic natural law ethics (specifically the principle that one may not do evil that good may come of it), she argued that the intentional killing of non-combatants is intrinsically wrong. She maintained that the bombings constituted the deliberate murder of innocents, regardless of the strategic outcome. A scholar would confirm that this deontological argument—that the act itself is prohibited—was central to her protest.

  ### 3. The Argument on Military Necessity and Surrender
  **Claim:** *Japan was already attempting to negotiate a surrender, so the bombs were not militarily necessary.*
  **Verdict:** **Misstated / Overstated.**
  This is the most significant point of divergence from Anscombe's actual philosophical position. While Anscombe may have personally believed the bombs were unnecessary, her published argument in *Mr Truman's Degree* does not rest primarily on historical claims about Japanese surrender negotiations. That specific historical argument is more closely associated with revisionist historians (such as Gar Alperovitz) who wrote decades later.

  Anscombe's argument was stronger and more absolute: she contended that the killing of innocents is forbidden *even if* it is militarily necessary. By framing her argument around the lack of necessity, the blog post makes her position sound consequentialist (i.e., "it was wrong because it didn't achieve a necessary goal"). In reality, Anscombe argued it was wrong *in itself*, regardless of whether it shortened the war. A scholar would argue that attributing the "surrender negotiation" point as her primary premise weakens her actual ethical stance.

  ### 4. The Nuremberg Comparison
  **Claim:** *Since the Allies had prosecuted Nazi leaders at Nuremberg for attacks on civilian populations, Anscombe argued that the justifications offered for the bombings would not have been accepted at Nuremberg.*
  **Verdict:** **Accurate.**
  Anscombe explicitly drew this parallel. She argued that the principles upheld at the Nuremberg Trials—that attacking civilian populations is a crime—must be applied universally, not merely to the vanquished. She contended that if German leaders were punished for the bombing of Rotterdam or Coventry, consistency demanded that the same moral standard be applied to the Allied leadership. She argued that "military necessity" was not accepted as a defence for the intentional killing of innocents at Nuremberg, and therefore should not excuse Truman.

  ### 5. The Conclusion: Honouring a War Criminal
  **Claim:** *Oxford was therefore proposing to honour a war criminal.*
  **Verdict:** **Follows from the accurate parts.**
  Although Anscombe's pamphlet is measured in its academic tone, the logical conclusion of her argument is precisely this. She wrote that Oxford, by honouring Truman, was signalling that the principles of Nuremberg were merely "victor's justice" rather than universal moral laws. She argued that the university was effectively condoning mass murder. While she may not have used the colloquial phrase "war criminal" in every sentence, the substance of her protest was that Truman was guilty of acts that constituted crimes against humanity under the very principles Oxford claimed to uphold. Therefore, the blog post's summary of her conclusion is fair.

  ### Summary Verdict
  An Anscombe scholar would likely say the blog post is **substantially fair but philosophically imprecise.**

  *   **Acceptable:** The account of the protest, the Nuremberg comparison, and the conclusion that Oxford was honouring a man guilty of grave moral crimes.
  *   **Problematic:** The emphasis on the "surrender negotiations" and "military necessity." This misrepresents Anscombe's ethical framework. She did not argue that the bombings were wrong *because* Japan was ready to surrender; she argued they were wrong *because* they involved the intentional killing of the innocent, which is never permissible.

  If you rely on the blog post, you should understand that Anscombe's objection was not merely a historical dispute about whether the bombs were needed to end the war, but a profound moral assertion that certain acts are forbidden regardless of their consequences. The final claim that Oxford was proposing to honour a war criminal does follow from her accurate premises, provided one understands "war criminal" in the moral sense she employed, rather than strictly as a legal verdict.
