  6.  **Refining the "Surrender" Point:**
      *   I need to be careful here. Did Anscombe mention the surrender? In her pamphlet "Mr Truman's Degree," she focuses on the *principle*. She writes: "It is unlawful to kill the innocent... Mr Truman's decision was to kill the innocent." She compares it to Nuremberg. She does not lean heavily on the "Japan was ready to surrender" historical argument as the *primary* justification. Her argument is that the *act itself* was murder. If the blog post suggests her argument *rested* on the lack of military necessity, that is a misrepresentation of her ethical framework (Anscombean ethics). She would argue it's wrong regardless of necessity. I must highlight this distinction.

