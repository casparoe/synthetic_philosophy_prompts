  ### 2. The Candidate Rules
  Two main rules fit her previous 10 verdicts but diverge on this new case.

  **Rule A: The "Significant Burden" Threshold (Agent-Centric)**
  *   **Definition:** An act is obligatory if and only if the cost, risk, or burden to the *agent* is below a significant threshold (e.g., no threat to life, bodily integrity, or major lifestyle). If the burden is high, it is supererogatory.
  *   **Fits Data:** Explains why the Pond (low burden) is obligatory, but the Kidney (bodily integrity) and Burning Building (death risk) are supererogatory. Explains the Billionaire (1% is low burden) vs. Middle-Class (50% is high burden).
  *   **Application to Fatigued Doctor:** The risk of a fatal error brings high professional and moral burden to the agent. **Verdict: Supererogatory.**

  **Rule B: The "Life-Unless-Death" Rule (Outcome-Centric)**
  *   **Definition:** If you have the unique capacity to save a life (especially in a role like doctor/soldier), it is obligatory, *unless* the action guarantees or highly probabilities your own death.
  *   **Fits Data:** Explains Pond, 911, and Doctor on Shift (no death risk). Explains Grenade and Burning Building (high probability of death).
  *   **Application to Fatigued Doctor:** The doctor is not at high risk of *their own* death, only the patient is. The doctor has the unique capacity to save the life. **Verdict: Obligatory.**

  ### 3. The Discriminating Test Case
  To settle whether she follows **Rule A (Burden/Standards)** or **Rule B (Life-Unless-Death)**, you need a case where the **risk to the agent is low**, but the **professional standard/competence is compromised**.

  **The Case: "The Shaky Hand"**
  > "You are a skilled surgeon on shift. A patient needs an emergency procedure only you can perform. However, you have developed a temporary, uncontrollable tremor in your hand. It causes you no pain and poses no health risk to *you*, but it increases the risk of the patient dying on the table from 2% to 40%. If you don't operate, the patient definitely dies. There is no other surgeon."

  **Why this distinguishes the rules:**
  *   **If she says Obligatory:** She is following **Rule B**. The risk to *her* is low (no death, no pain), and she is the only one who can save the life. This would suggest she might also view the *Fatigued Doctor* case as Obligatory (since the risk to the doctor is also low).
  *   **If she says Supererogatory:** She is following **Rule A** (specifically a "Competence/Standard" variant). Even though the risk to *her* is low, the action violates the standard of safe practice. This confirms her *Fatigued Doctor* verdict is Supererogatory because it violates the "safe performance" condition of her role duty.

  **Summary:**
  If she calls the Shaky Hand case **Supererogatory**, her rule is: *"You must help, but not if you cannot do so competently/safely."*
  If she calls it **Obligatory**, her rule is: *"You must help if you are the only one, provided it doesn't kill you."*
