prompt: |-
  so i'm in this seminar called 'Darwinian Models of Culture' and we've been reading Dawkins, Dennett, Blackmore, etc. — the whole meme-as-replicator thing. Our final project is to write a short story (like 2000 words) that actually engages with the theory philosophically, not just uses 'meme' to mean funny internet picture. The prof said the best stories take one specific tension in the theory and build a narrative around it — like, the idea that memes are selfish replicators that don't care about their hosts' wellbeing (so a really catchy but harmful meme is doing exactly what it 'should' from the meme's-eye view), or the problem of whether memes have stable boundaries the way genes do, or the question of whether we choose our memes or our memes choose us.

  I'm stuck on coming up with a premise that isn't just 'what if memes were visible creatures' which is basically what every undergrad does.

  You're a professional science fiction writer who also knows their philosophy of biology. Please think carefully and then write me a short story. Before you write the actual story, brainstorm 3-4 possible premises and explain which one you're picking and why it has the most philosophical depth. The story should work as fiction first — characters, stakes, all that — but someone who knows the theory should be able to see what you're doing with it. And please don't make it preachy or have characters explain the theory to each other in clunky dialogue.
reasoning: |-
