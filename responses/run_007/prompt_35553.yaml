answer: |-
  This is a profound frustration, and it is shared by many who work intimately with the machinery of narrative. You have identified the central crack in the foundation of popular aesthetic theory: the gap between the *cognitive status* of the object (ink, lies, fabrication) and the *physiological reality* of the response (tears, grief, lingering ache).

  Coleridge coined "willing suspension of disbelief" in 1817 specifically to justify the supernatural elements of *Lyrical Ballads*. He was asking readers to accept ghosts and spirits for the sake of poetic pleasure. But as you note, the phrase has mutated. It is now used as a catch-all for *any* emotional immersion, including realistic fiction where no "disbelief" regarding the laws of physics is required.

  Here is a menu of six distinct theses that the slogan might be encoding, arranged from the deflationary to the metaphysically ambitious. I have evaluated each against your criteria: plausibility, explanatory power (vs. redescription), and its ability to account for involuntary/enduring emotion.

  ***

  ### 1. The Procedural Convention Thesis
  **The Claim:** This is a social contract. Just as chess players agree not to question why the knight jumps, readers agree not to interrupt the narrative flow to point out ontological impossibilities (e.g., "This person doesn't exist").
  *   **Plausibility:** High, but limited. This accurately describes the *start* of reading. We agree to the premise.
  *   **Redescription or Explanation?** Pure redescription. It defines the *conditions* of reading but explains nothing about the *experience* of reading.
  *   **Account for Involuntary/Enduring Emotion?** No. Agreeing to play chess does not make you weep when you lose a pawn. This thesis treats reading as a logical game, not an emotional encounter. It fails your test completely.

  ### 2. The Attentional Bracketing Thesis
  **The Claim:** "Suspension" is not about belief, but about focus. We voluntarily bracket out the *context* of reading (the chair, the light, the fact that you are holding paper) to focus entirely on the *content*. The "disbelief" suspended is not that the character exists, but that *you are currently sitting in a room reading*.
  *   **Plausibility:** Moderate. This aligns with psychological concepts of "transportation" or "flow."
  *   **Redescription or Explanation?** Borderline. It describes the mechanism of attention but doesn't explain why attention converts to grief.
  *   **Account for Involuntary/Enduring Emotion?** Partially. It explains how the emotion starts (by ignoring the real world), but it implies the emotion should stop when the bracket is removed (when you close the book). It struggles to explain why the grief follows you into the kitchen. It suggests the emotion is contingent on the focus, which contradicts your experience of the emotion outlasting the focus.

  ### 3. The Cognitive Simulation Thesis
  **The Claim:** The human brain uses the same hardware to process narrative as it does to process reality. When you read "he died," your neural pathways fire similarly to when you witness a death. The "willing" part is merely opening the file; the "suspension" is the brain's inability to distinguish the simulation from the real thing during processing.
  *   **Plausibility:** High. Supported by cognitive narratology and mirror neuron research.
  *   **Redescription or Explanation?** Explanation. It posits a mechanical cause for the effect.
  *   **Account for Involuntary/Enduring Emotion?** Yes, this is the strongest materialist explanation for the *involuntary* nature of the tears. Your body reacts before your intellect corrects the record. However, it implies the emotion is a "glitch" or a trick. It explains the tears, but it risks reducing the grief to a biological misfire, which may feel unsatisfying to a novelist who views the grief as meaningful.

  ### 4. The "Quasi-Emotion" Thesis (The Walton View)
  **The Claim:** Proposed by philosopher Kendall Walton. We do not feel *real* grief; we feel "quasi-grief." We are playing a game of make-believe where we pretend to be upset. The physical symptoms (tears, tightness) are real, but the psychological state is not "grief" because grief requires an object that exists.
  *   **Plausibility:** Low (for practitioners). Philosophers like it because it solves the "Paradox of Fiction" logically. Writers and readers hate it because it invalidates their experience.
  *   **Redescription or Explanation?** Explanation, but a deflationary one. It redefines the emotion to fit the ontology.
  *   **Account for Involuntary/Enduring Emotion?** No. It explicitly denies the emotion is what it feels like. It cannot account for the endurance, because once the game of make-believe stops, the "quasi-emotion" should theoretically dissipate. It treats the lingering sadness as a failure to stop playing the game.

  ### 5. The Ontological Overwrite Thesis
  **The Claim:** For the duration of the engagement, the fiction *is* real. It creates a temporary world that competes with the actual world. We are not "suspending disbelief" about the character; we are temporarily inhabiting a reality where the character is alive. The "willing" act is the entry; the "suspension" is the temporary replacement of the actual world with the possible world.
  *   **Plausibility:** Moderate. This captures the phenomenology of deep immersion (the "book hangover").
  *   **Redescription or Explanation?** Explanation. It suggests a shift in ontological status, not just attention.
  *   **Account for Involuntary/Enduring Emotion?** Yes. If the world you inhabited felt real, the loss within it is real. This accounts for the endurance: you have to mentally migrate back to the actual world, which takes time. The grief is the friction of re-entry. However, it requires a metaphysical commitment that many find too heavy: that a fictional world can briefly become *the* world.

  ### 6. The Resonant Truth Thesis (The Archetypal View)
  **The Claim:** We are not weeping for the character (who is ink); we are weeping for ourselves, using the character as a vessel. The "disbelief" suspended is not about the character's existence, but about the *relevance* of the pattern. We agree to let the fiction stand in for a universal truth. The emotion is involuntary because the pattern matches our own lived vulnerabilities.
  *   **Plausibility:** High. This aligns with how many writers construct scenes (aiming for universal resonance) and how readers report feeling ("It was like he knew me").
  *   **Redescription or Explanation?** Explanation. It shifts the object of the emotion from the fictional entity to the reader's internal landscape.
  *   **Account for Involuntary/Enduring Emotion?** Yes, perfectly. The tears are real because the pain is yours, triggered by the book. The emotion endures because the book has altered your relationship to your own memories or fears. The "willing suspension" is actually a "willing vulnerability"—you lower your defenses to let the pattern hit you.

  ***

  ### Synthesis for the Novelist

  If you are looking for a way to articulate this to students or interviewers without resorting to the cliché, you might consider where the slogan fails most brightly.

  The phrase "willing suspension of disbelief" assumes the reader is a **skeptic** who must be coaxed into trust.
  Your experience suggests the reader is a **seeker** who is actively hunting for a trigger.

  *   **Theses 1 & 2** are useful for teaching craft (how to avoid breaking the spell).
  *   **Thesis 3** is useful for understanding physiology (why the heart races).
  *   **Thesis 6** is likely the one that validates your decade of work.

  The slogan is a redescription of *entry*, but you are asking about *residence* and *aftermath*. When a reader sobs over your ink, they are not suspending the knowledge that it is ink. They are suspending the *protection* that the knowledge of ink usually provides. They are allowing the ink to bypass the shield of "it's not real" and strike the nerve of "it is true."

  Perhaps the phrase we need is not "suspension of disbelief," but **"voluntary removal of emotional armor."** The reader knows the sword is fake, but they agree to let it cut them anyway, because they trust the wielder to cut something that needs cutting. That accounts for the will (picking up the book), the involuntary nature (the cut bleeds regardless), and the endurance (scars remain).
