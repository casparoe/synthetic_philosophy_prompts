prompt: |-
  People in cog sci and philosophy of mind often run together "predictive processing" and "the free energy principle" as if they're interchangable, but my understanding is that they're distinct theoretical commitments. Can you compare them? Specifically, what does the free energy principle assert that predictive processing doesn't, and vice versa? Is the FEP just a more general version of the same idea, or are they doing fundamentally different kinds of explanatory work? And does it even make sense to endorse one without the other?
reasoning: |-
  Here's a thinking process that leads to the comparison between Predictive Processing (PP) and the Free Energy Principle (FEP):

  1.  **Deconstruct the User's Query:**
