      *   **Core Definitions:** Briefly define FEP (math/physics of existence) and PP (cognitive science of the brain).
      *   **Key Differences Table/List:** Scope, Normative vs. Mechanistic, Implementation.
      *   **What FEP adds:** Universality, necessity, active inference link.
      *   **What PP adds:** Neural hierarchy, phenomenology, specific cognitive mechanisms.
      *   **Explanatory Roles:** Unification vs. Specific Explanation.
      *   **Decoupling:** Can you hold one without the other? (Yes, mostly).
      *   **Conclusion:** Summary of the relationship (FEP = Foundation, PP = Architecture).

  6.  **Drafting the Content (incorporating specific terminology):**
