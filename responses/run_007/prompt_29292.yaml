  1.  **Analyze the User's Query:**
      *   **Topic:** Metaphysics of reproduction, specifically *origin essentialism* (associated with Kripke).
      *   **Core Claim of Origin Essentialism:** A person could not have come from a different sperm and egg (different $z$).
