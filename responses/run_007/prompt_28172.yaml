answer: |-
  **MEMORANDUM**

  **TO:** Strategic Policy Committee, National Research Funding Council
  **FROM:** Policy Analysis Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Framework for Allocating Resources Between Parallel and Concentrated Research Efforts

  ### 1. Executive Summary

  The Council faces a recurring allocation dilemma: should we fund multiple groups pursuing the same high-stakes scientific goal in parallel, or concentrate resources on a single best-in-class team? Historically, we have favored parallel funding to hedge against technical failure and stimulate competition. However, under budget constraints, this approach risks triggering **commitment races**, where funded groups accelerate spending to secure priority, driving aggregate costs beyond the social value of the time saved.

  This memo recommends adopting a **Diversity-Adjusted Parallelism Framework**. This framework moves beyond a binary choice, instead conditioning parallel funding on two variables: (1) the technical diversity of the approaches, and (2) the marginal social value of speed. We propose concrete criteria for review panels to distinguish between productive diversification and wasteful redundancy, alongside mechanism designs (specifically milestone-based gating) to mitigate commitment races.

  ### 2. The Economic Structure of the Problem

  To formulate policy, we must distinguish between two distinct economic dynamics that often appear identical in grant applications: **Exploratory Diversification** and **Commitment Racing.**

  **2.1. Exploratory Diversification (The Case for Parallelism)**
  Science is characterized by high technical uncertainty. In fields like fusion energy or novel battery chemistry, the "true path" is unknown.
  *   **Logic:** Funding $N$ teams using *different* methodologies increases the probability that at least one succeeds.
  *   **Value:** The value here is risk reduction. If Team A fails, Team B may still succeed.
  *   **Efficiency:** Parallel funding is efficient here because the marginal cost of the second team is bought with the marginal benefit of increased success probability.

  **2.2. Commitment Races (The Case Against Parallelism)**
  A commitment race occurs when multiple teams pursue the *same* methodology, and the primary variable is speed to completion.
  *   **Logic:** Once funded, teams face a prisoner's dilemma. If Team A slows down to optimize cost-efficiency, Team B may sprint to claim priority (publications, IP, prestige). Team A is forced to sprint as well.
  *   **Waste:** Both teams burn through budgets faster than scientifically optimal. If the social value of finishing the project in 24 months rather than 30 months is \$10M, but the accelerated spending costs \$20M in aggregate, net social value is negative.
  *   **Duplication:** If the methodologies are identical, the second team adds little to the probability of success but doubles the cost.

  ### 3. The Strongest Argument for Concentration

  We must treat fairly the argument for concentrating resources on a single team. Proponents of concentration argue that **talent and attention are scarce resources.**

  Splitting a finite budget across five teams does not create five viable efforts; it may create five under-resourced struggles. In "winner-take-all" technical landscapes (e.g., achieving quantum supremacy), being second has near-zero value. If the Council can identify the highest-probability team ex ante, concentrating resources allows that team to hire top talent, build superior infrastructure, and avoid the administrative overhead of managing multiple grants.

  Furthermore, concentration avoids the "tragedy of the commons" in scientific attention. When multiple groups race, they often withhold data to maintain competitive advantage. A single funded consortium can operate as an open collaborative, accelerating the *field* even if it slows the specific *project*.

  **Assessment:** This argument holds strongest when technical uncertainty is low (we know *how* to do it, we just need to *do* it) and when the talent pool required exceeds the capacity of a single grant. However, it relies heavily on the Council's ability to pick the winner ex ante, a capability history suggests is fallible. Therefore, concentration should be the default *only* when specific criteria are met.

  ### 4. Proposed Decision Framework

  We recommend review panels apply the **Diversity-Adjusted Parallelism Framework**. Panels must score proposals against three criteria to determine the funding mode.

  #### Criterion 1: Technical Orthogonality (Diversity)
  *   **Question:** Do the competing proposals rely on distinct underlying mechanisms or assumptions?
  *   **High Diversity:** Team A uses mRNA; Team B uses viral vector. (Fund Parallel)
  *   **Low Diversity:** Team A uses mRNA variant X; Team B uses mRNA variant Y. (Fund Concentrated)
  *   **Rationale:** Parallel funding is justified as insurance against technical dead ends, not as insurance against execution errors.

  #### Criterion 2: Temporal Sensitivity (Value of Speed)
  *   **Question:** What is the marginal social value of completing the project 6–12 months earlier?
  *   **High Sensitivity:** Pandemic response, national security threat, imminent climate tipping point. (Fund Parallel to accelerate)
  *   **Low Sensitivity:** Fundamental physics, long-term material science, basic biology. (Fund Concentrated to optimize cost)
  *   **Rationale:** Commitment races are only socially beneficial if time saved is worth the extra cost. In basic science, reliability often outweighs speed.

  #### Criterion 3: Resource Elasticity
  *   **Question:** Will doubling the funding significantly reduce time-to-solution, or is the project talent-limited?
  *   **High Elasticity:** The bottleneck is equipment construction or data collection volume. (Fund Parallel)
  *   **Low Elasticity:** The bottleneck is human insight, regulatory approval, or physical decay rates. (Fund Concentrated)
  *   **Rationale:** Pouring money into a talent-limited project creates inflation in hiring without speeding up science, fueling a commitment race without the benefit of acceleration.

  ### 5. Implementation Mechanisms

  To prevent parallel funding from devolving into wasteful commitment races, the Council must alter the incentive structure of the grants themselves.

  **5.1. Milestone-Based Gating (The "Kill Switch")**
  Parallel funding should not be guaranteed for the full project duration.
  *   **Policy:** Fund parallel teams for Phase 1 (e.g., 18 months).
  *   **Mechanism:** At the Phase 1 review, compare technical progress, not just publications. If one approach demonstrates clear superiority or if the other hits a technical dead end, reallocate Phase 2 funds to the winner.
  *   **Effect:** This reduces the "sunk cost" pressure. Teams know they can be cut if they are inefficient, discouraging reckless spending to stay ahead.

  **5.2. Data Sharing Mandates**
  *   **Policy:** Parallel grantees must contribute to a shared data repository with a 6-month embargo maximum.
  *   **Effect:** This reduces the "secret race" dynamic. If Team A learns from Team B's failure, the aggregate cost of failure drops. This converts a zero-sum race into a positive-sum collaboration.

  **5.3. The "Single Best" Exception**
  *   **Policy:** If Criterion 1 (Diversity) is Low and Criterion 2 (Time) is Low, panels are mandated to recommend a single award.
  *   **Effect:** Prevents the default habit of "spreading the wealth" when science dictates focus.

  ### 6. Guidance for Review Panels

  To operationalize this, Panel Chairs will utilize the following **Allocation Matrix** during summary statements:

  | Technical Diversity | Value of Speed | Resource Elasticity | **Recommendation** |
  | :--- | :--- | :--- | :--- |
  | **High** (Distinct Paths) | **High** (Urgent) | **High** (Money=Speed) | **Fund Parallel** (Full Term) |
  | **High** (Distinct Paths) | **Low** (Basic Science) | **Low** (Talent Limited) | **Fund Parallel** (Gated) |
  | **Low** (Same Path) | **High** (Urgent) | **High** (Money=Speed) | **Fund Parallel** (Short Term Sprint) |
  | **Low** (Same Path) | **Low** (Basic Science) | **Any** | **Fund Concentrated** (Single Team) |

  ### 7. Conclusion

  The choice between parallel and concentrated funding is not a matter of philosophy but of portfolio management. Parallel funding is an insurance policy against technical uncertainty; it is not a subsidy for competition. By applying the Diversity-Adjusted Parallelism Framework, the Council can avoid the trap of the commitment race—where we pay a premium for speed we do not need—while preserving the capacity to hedge against the inevitable dead ends of high-stakes research.

  We request the Committee's approval to pilot this framework in the upcoming cycle for the Advanced Energy and Quantum Initiatives.
