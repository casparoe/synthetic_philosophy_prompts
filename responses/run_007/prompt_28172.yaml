prompt: |-
  I serve on the strategic policy committee of a national research funding council. We are revising our guidelines for how to handle situations where multiple research groups are pursuing the same high-stakes goal — a vaccine platform, a quantum supremacy milestone, a novel battery chemistry. In the past we have often funded several groups in parallel, reasoning that competition accelerates progress and that we cannot reliably pick the winner ex ante. But our budget is finite, and critics argue that parallel funding creates a commitment race: each group, once funded, must keep spending to stay ahead, and the aggregate cost can exceed the social value of reaching the goal a few months sooner. Others reply that parallel approaches are not pure duplication — different groups explore different technical paths — and that the real waste would be betting everything on one team that hits a dead end.

  Please draft a policy memo for the committee that recommends a concrete framework for deciding when to fund parallel competing efforts and when to concentrate resources on a single team. The memo should engage seriously with the structure of commitment races — the conditions under which they generate net benefits versus wasteful duplication — and should give criteria our review panels can actually apply. It should also treat fairly the strongest argument for the losing side.
reasoning: |-
  Here's a thinking process that leads to the suggested policy memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a strategic policy committee at a national research funding council.
      *   **Task:** Draft a policy memo recommending a framework for deciding between parallel funding (multiple groups) vs. concentrated funding (single team) for high-stakes research goals.
      *   **Key Issue:** The tension between competition accelerating progress vs. "commitment races" leading to wasteful duplication (aggregate cost > social value of time saved).
      *   **Counter-argument:** Parallel paths aren't pure duplication; they hedge against technical dead ends.
      *   **Requirements:**
          *   Engage seriously with the structure of commitment races (benefits vs. waste).
          *   Provide concrete, applicable criteria for review panels.
          *   Treat the strongest argument for the "losing side" fairly (steel-manning).
          *   Tone: Professional, analytical, policy-oriented.

  2.  **Deconstruct the Core Economic/Strategic Problem:**
      *   *The Commitment Race:* Once funded, teams feel pressure to spend quickly to win the "prize" (prestige, follow-on funding, IP). If $N$ teams spend $C$ each, total cost is $N \times C$. If the value of finishing at $T_1$ vs $T_2$ is $V$, we need $N \times C < V_{time\_saved} + V_{risk\_reduction}$.
      *   *The Hedging Argument:* Science is uncertain. Path A might fail. Path B might work. Funding only A risks total failure. Funding both increases probability of success ($P_{success}$).
      *   *The Decision Framework:* We need a way to distinguish between "redundant competition" (same method, racing for priority) and "diversified exploration" (different methods, racing for discovery).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the problem, the recommendation, and the core logic.
      *   **Background/Context:** Acknowledge the current practice (parallel funding) and the emerging critique (commitment races/budget constraints).
      *   **Analysis of the Commitment Race:**
          *   Define it clearly.
          *   When is it good? (Time sensitivity, low marginal cost of parallelism).
          *   When is it bad? (Diminishing returns, high duplication, low time value).
      *   **The Counter-Argument (Hedging):** Acknowledge that "duplication" is often "diversification." This satisfies the requirement to treat the opposing view fairly.
      *   **Proposed Framework (The Core):** Need concrete criteria.
          *   *Criterion 1: Technical Divergence.* Are they actually doing different things?
          *   *Criterion 2: Time Sensitivity.* Does finishing 6 months earlier matter significantly (e.g., pandemic vs. basic science)?
          *   *Criterion 3: Diminishing Returns.* Will adding a second team actually speed it up, or just split the talent pool?
          *   *Criterion 4: Coordination Mechanism.* Can we manage the race?
      *   **Implementation/Review Panel Guidance:** How do reviewers use this? A scoring rubric or checklist.
      *   **Conclusion:** Final wrap-up.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Just say "fund parallel if methods differ."
      *   *Correction:* Too simple. Sometimes methods differ slightly but are effectively the same race. Need to emphasize *uncertainty* and *time value*.
      *   *Commitment Race Nuance:* I need to explain *why* it happens. It's a prisoner's dilemma. If I slow down to save money, the other guy wins. The policy needs to mitigate this incentive structure.
      *   *Fairness:* Make sure the section on "Risk of Concentration" is robust. Don't just dismiss it as a strawman. Acknowledge that picking a single winner ex ante is notoriously hard (the "picking winners" problem).
      *   *Actionability:* The criteria need to be questions reviewers can answer with "Yes/No" or "High/Medium/Low."

  5.  **Developing the Framework (The "DIVERGE" Model or similar):**
      *   Let's create a specific decision matrix.
      *   *Dimension 1: Path Diversity.* (High diversity = fund parallel).
      *   *Dimension 2: Temporal Value.* (High urgency = fund parallel).
      *   *Dimension 3: Resource Elasticity.* (Does more money = faster results? Or is it talent-limited?)
      *   *Mechanism:* Introduce "Milestone Gates" to stop the commitment race. If one path clearly wins early, cut the other. This addresses the "sunk cost" aspect of the commitment race.

  6.  **Polishing the Tone:**
      *   Needs to sound bureaucratic but insightful. Use terms like "marginal social value," "technical uncertainty," "redundancy vs. diversity."
      *   Ensure the "Commitment Race" concept is explained clearly for non-economists on the committee.

  7.  **Final Review against Constraints:**
      *   Engage with commitment race structure? Yes.
      *   Concrete criteria? Yes (The Decision Matrix).
      *   Treat opposing argument fairly? Yes (Section on "The Case for Concentration").
      *   Memo format? Yes.

  8.  *(Self-Correction on "Commitment Race" definition)*: In this context, it's not just racing to publish. It's racing to spend. If I have \$10M and you have \$10M, and we both burn it in year 1 to be first, but the science needed 3 years of careful work, we wasted money. I need to make sure the policy discourages *burning budget for speed* unless speed is valuable.

  9.  **Finalizing the Recommendations:**
      *   Recommend a "Diversity-Adjusted Parallelism" approach.
      *   Introduce "Kill Switches" (mid-term reviews).
      *   Distinguish between "Mission-Oriented" (Time sensitive) and "Discovery-Oriented" (Path uncertain).

  10. **Writing the Memo.** (Proceeding to generate output based on these thoughts).

  **(Post-Drafting Check):** Does the memo explicitly address the "commitment race" mechanics? Yes, in the analysis section. Does it give review panels something to do? Yes, the "Decision Matrix." Is the counter-argument respected? Yes, in the "Risk of Over-Concentration" section.

