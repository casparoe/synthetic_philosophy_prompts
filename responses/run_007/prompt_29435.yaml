prompt: |-
  ok so ive been trying to work out what I should do when I'm not sure which moral view is right, and I've ended up with a set of commitments that each feel right to me on their own but I can't tell wether they actually hang together. I keep going back and forth, because whenever I try to apply them to a real decision one of them seems to pull against another. Here's roughly where I am:

  (1) When I'm genuinely torn between moral theories, I should weigh each theory by how likely I think it is and pick the action with the best expected moral value.
  (2) But I also think there's often no shared scale between a rule like never lie and a bad outcome that can be weighed up, so "best expected moral value" is sometimes not even a well-defined number.
  (3) If every theory I take at all seriously says an act is wrong, I won't do it, even though I can't put precise probabilities on the theories.
  (4) I don't think a theory I give almost no chance of being right should dominate my choices just because the stakes would be enormous if it were true (like a theory that says I must maximize paperclips, or one that says any tiny chance of infinite suffering swamps everything else).

  Which of these are actually in tension with each other, and which pairs only look like they conflict? Rank the real tensions by how severe they are, say what the cheapest fix would be for each one, and then tell me which single revision would leave the most coherent overall package.
