prompt: |-
  I'm a software engineer with no real background in philosophy or genetics, and I keep getting pulled into arguments about whether differences in intelligence or educational outcomes are "mostly genetic." I've picked up enough to know that its a weird, widely misunderstood number — something about variance in a population rather than a property of an individual, and that high heritability doesn't automatically mean environment can't matter — but I don't trust myself to know what actually follows from that. A friend recently sent me a within-family study where the heritability of educational attainment came out a lot lower than the usual headline numbers, and now I'm unsure wether the old numbers are wrong or just measuring something different.

  So here's what I want from you: give me the most important implications of what heritability does and does not mean, for how I should interpret the kinds of claims I keep seeing (like "IQ is 60 to 80 percent heritable" or "educational attainment is about 40 percent genetic") and for the places where this might actually change what I do — how I treat individual people, arguments about schooling and social policy, whether any of this belongs in hiring or in my own life decisions. Don't give me a neutral list of caveats; I want you to commit. Tell me which implications are the real ones, which are overrated or flat out don't follow, and rank them by how much they should change my thinking, with the reasoning for the ordering. And please write the whole thing as continuous prose, like a long email or letter — no headings, no bullet points, no bold, no tables.
