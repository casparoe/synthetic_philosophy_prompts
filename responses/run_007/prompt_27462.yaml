answer: |-
  Dear friend,

  It is completely understandable that you feel stuck in these arguments, because the way heritability is discussed in public discourse is almost always divorced from what the statistic actually measures. You have already grasped the two most technical points, which is that heritability describes variance in a population rather than a property of an individual, and that high heritability does not imply immutability. Since you asked me to commit to what actually follows from this and how it should change your thinking, I am going to be direct about the hierarchy of implications. I have ranked these by how much they should alter your behavior and worldview, starting with the most critical implication that should fundamentally anchor your interactions with people, down to the specific statistical nuances that should only change how you read headlines.

  The single most important implication, which should cause the largest shift in your thinking, is that heritability estimates tell you nothing useful about how to treat an individual person. When you hear that IQ is sixty to eighty percent heritable, it is tempting to think that for any given person, sixty to eighty percent of their intelligence is fixed by their DNA and the rest is environment. This is a category error that you must actively reject. Heritability is a ratio of variances, not a partition of cause within a skull. Even if a trait were one hundred percent heritable in a population, it could still be completely malleable in an individual if the right environmental intervention were found. Therefore, you should not change how you treat people based on these numbers. You should not assume a struggling student has hit a genetic ceiling, nor should you assume a high performer is solely the product of innate gift. The practical upshot is that you should continue to operate on the assumption that potential is opaque and distributed across all groups. This is the most important ranking because it governs your ethics and your daily interactions. If you take nothing else away, take this: heritability statistics are population-level descriptors that grant no license for individual-level determinism. You should ignore them when judging people.

  The second most important implication, which should significantly change how you view social policy and schooling, is that high heritability does not mean environmental interventions are futile. This is where the public debate gets most dangerous. People often hear that educational attainment is forty percent genetic and conclude that trying to fix schools or reduce poverty is a waste of time because the outcome is written in the genes. This is false. A classic example is height, which is highly heritable, yet average height has increased dramatically over generations due to better nutrition. The heritability of a trait can be high precisely because the environment is already optimized for everyone, or conversely, it can be low because environmental variance is swamping genetic potential. In the case of education, the fact that genetics play a role does not mean that improving teaching quality, reducing class sizes, or providing early childhood support will fail. In fact, because we cannot ethically or practically engineer human genomes to improve society, the environment is the only lever we have. You should therefore remain skeptical of any argument that uses high heritability to justify cutting social programs or accepting inequality as natural. Your thinking should shift toward viewing these statistics as a challenge to find the environmental factors that unlock genetic potential, rather than as a reason to give up on equity.

  The third implication, which should change how you interpret the specific studies you are seeing, including the one your friend sent you, concerns the difference between between-family and within-family estimates. You asked whether the old numbers are wrong or just measuring something different. The answer is that they are measuring something different, and the within-family study your friend shared is likely giving you a clearer picture of the direct genetic effect, while the headline numbers are confounded by socioeconomic status. When we measure heritability between families, we are comparing rich families to poor families. Rich families tend to have both better genes for educational attainment and better environments, like tutors and stable homes. This inflates the heritability estimate because the environment is correlated with the genetics. When you look within families, comparing siblings who share the same parents and home environment, that confounding variable is removed. The heritability drops because you are isolating the genetic variance from the shared environmental variance. This does not mean the headline numbers are lies, but it does mean they are context-dependent and often overstate the direct genetic influence in a way that implies inevitability. You should adjust your thinking to treat headline heritability numbers as upper bounds that include social stratification, rather than pure biological constants. This matters less for how you treat people, but it matters a lot for how you assess the validity of arguments made by others. If someone cites the high between-family number to argue that schools don't matter, you now know that the within-family data undermines that claim.

  The fourth and least important implication, in terms of how much it should change your thinking, is actually a directive to stop thinking about this topic entirely when it comes to hiring or personal life decisions. You asked whether this belongs in hiring. The answer is a firm no. Using heritability arguments in hiring is scientifically unsound and ethically hazardous. Even if intelligence is heritable, using a proxy for genetics in hiring is indistinguishable from discrimination based on background, and it ignores the fact that job performance is a skill set that can be trained. Furthermore, the predictive validity of genetic markers for complex behaviors like coding ability or leadership is currently negligible and likely to remain so for a long time. You should not change your hiring practices to account for genetic theories, nor should you make life decisions about your own children based on these probabilities. The noise in the system is too high, and the ethical risk is too great. This is ranked last not because it is unimportant, but because the correct action is simply to maintain the status quo of ignoring genetics in professional settings. You do not need to learn more to know that this is a dead end for practical application.

  To summarize the ordering of these implications, you should care most about the fact that these numbers do not justify treating individuals as fixed entities, because that protects your humanity and fairness. You should care second most about the fact that policy interventions still work despite high heritability, because that protects your civic engagement from fatalism. You should care third about the statistical distinction between study types, because that protects your intellect from being misled by bad science journalism. And you should care least about applying this to hiring, because you should not be doing that at all. The confusion you feel is a feature of the topic, not a bug in your understanding. The numbers are real, but the stories people tell about them are often fiction. Stick to the principle that while genes may load the gun, environment pulls the trigger, and in a society, we are responsible for where the guns are pointing. Trust your instinct that the headline numbers are being oversold, trust the within-family study as a correction on mechanism, but do not let either of them convince you that human potential is predetermined.
