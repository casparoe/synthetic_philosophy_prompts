  # Decision Tree: Spectrum Arguments and Transitivity

  **Starting Intuition:** You judge that the first item in a spectrum ($A_1$) is clearly better than the last ($A_n$), yet you also judge that no single adjacent step ($A_{i+1}$) is worse than its predecessor ($A_i$).

  **Core Question:** To resolve the contradiction, which of those judgments gives way, and why?

  ---

  ### The Tree

  **Q1. Do you retract the judgment that "no single adjacent step is worse than its predecessor"?**
  *   **Yes** (There *is* a step where $A_{i+1}$ is worse than $A_i$, even if it doesn't seem so). → Go to **Q2**.
  *   **No** (The adjacent judgments stand; the logic must break elsewhere). → Go to **Q5**.

  **Q2. Is the step where value drops located at a *detectable* change in the kind of value (e.g., from pleasure to pain, or high to low quality)?**
  *   **Yes** (There is a qualitative break we can identify). → Go to **Q3**.
  *   **No** (The break is between two items that seem qualitatively identical). → Go to **Q4**.

  **Q3. Does this qualitative break imply that the earlier items are *infinitely* or *lexically* superior (no amount of the later items can equal one earlier item)?**
  *   **Yes.** → **Leaf A: Transitivity preserved by thresholds or lexical priorities.**
  *   **No** (It is just a significant threshold, but trade-offs are still possible). → **Leaf A: Transitivity preserved by thresholds or lexical priorities.**
      *(Note: While distinct views, both preserve transitivity via a detectable non-smooth break.)*

  **Q4. Is there a *fact of the matter* about exactly which adjacent pair constitutes the drop, even if humans cannot know it?**
  *   **Yes.** → **Leaf B: Transitivity preserved by an unknowable sharp cutoff.**
  *   **No.** → **[FLAG: Unoccupied/Unstable]**
      *(See commentary below. This combination implies a "worse" step exists without a fact determining which one, a view rarely held without shifting to Leaf D or E.)*

  **Q5. Does the term "better than" change its meaning or standard of precision when comparing the endpoints versus the adjacent steps?**
  *   **Yes** (e.g., "better" means "noticeably better" for steps, but "overall better" for endpoints). → **Leaf C: Contextualist or equivocation response.**
  *   **No** (The meaning of "better" is stable throughout the chain). → Go to **Q6**.

  **Q6. Do the standard comparative relations ('better than', 'worse than', 'equal to') *apply* to adjacent items?**
  *   **No** (The comparison fails to yield a standard result). → Go to **Q7**.
  *   **Yes** (Adjacent items are equal, or one is slightly better, etc.). → Go to **Q8**.

  **Q7. Is the failure of standard relations due to a positive fourth relation ("on a par") or a lack of any relation ("incomparable")?**
  *   **On a Par.** → **Leaf D: Parity or incomparability between adjacent items.**
  *   **Incomparable.** → **Leaf D: Parity or incomparability between adjacent items.**
      *(Note: These are often grouped as "non-comparabilist" responses to spectra.)*

  **Q8. Is the chain broken because 'better than' itself is intransitive, or only because 'not worse than' is intransitive?**
  *   **'Better Than' is Intransitive.** → **Leaf E: Intransitivism about 'not worse than' (and perhaps about 'better than' itself).**
  *   **'Not Worse Than' is Intransitive.** → **Leaf E: Intransitivism about 'not worse than' (and perhaps about 'better than' itself).**
      *(Note: Both views deny the transitivity required to generate the paradox.)*

  ---

  ### Leaf Definitions

  *   **Leaf A (Thresholds/Lexical):** Transitivity holds. The spectrum is not smooth; there is a specific point where value drops significantly or qualitatively.
  *   **Leaf B (Unknowable Cutoff):** Transitivity holds. The spectrum is smooth to us, but reality contains a precise, hidden boundary where one step becomes worse.
  *   **Leaf C (Contextualism):** Transitivity holds (or is irrelevant). The contradiction arises because we are equivocating on the meaning of "better" at different scales.
  *   **Leaf D (Parity/Incomparability):** Transitivity holds, but the chain is broken because adjacent items cannot be linked by 'not worse than'. They are either incomparable or on a par.
  *   **Leaf E (Intransitivism):** The chain is linked, and meanings are stable, but the logic fails. 'Not worse than' (and possibly 'better than') is not a transitive relation.

  ---

  ### Commentary on Logical Space

  **1. Unoccupied or Unstable Combinations**
  *   **Q1 (Yes) + Q4 (No):** This combination asserts that there *is* a step that is strictly worse, but there is *no fact* about which step it is. While technically coherent (a form of supervaluationism), this position is rarely occupied in isolation. Most philosophers who deny a fact of the matter (Q4 No) also deny that a "worse" relation strictly holds (Q1 No), moving them to **Leaf D**. Holding both often leads to an unstable error theory.

  **2. Leaves the Tree Cannot Cleanly Separate**
  *   **Leaf A (Thresholds) vs. Leaf B (Unknowable Cutoff):** The distinction relies on the answer to **Q2** (Detectability). However, a "weak" lexical threshold might be theoretically detectable but practically unknowable, blurring the line between a qualitative break (Leaf A) and a sharp quantitative cutoff (Leaf B).
  *   **Leaf D (Parity) vs. Leaf E (Intransitivism):** Both views deny that 'not worse than' is transitive. The distinction rests on **Q6** (whether standard relations apply). However, some accounts of Parity function logically identically to Intransitivism in spectrum arguments, making them difficult to distinguish purely by their output on this specific problem.

  **3. Graduate Seminar Note**
  When using this tree, press students on **Q4**. The move from "we can't tell" to "there is no fact" is the pivot point between Epistemicism (Leaf B) and most non-classical solutions (Leaves D & E). Similarly, press on **Q5**: Contextualism is often a default "escape hatch," but requires a robust account of how semantic shift occurs without undermining the substantive value claim.
