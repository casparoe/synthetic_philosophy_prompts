      *   *Refinement:* Davidson is more about *semantics* than *goals*, but in IL, goals drive actions. Let's frame it as joint inference of a world model and a policy.
      *   *Key ML Concept:* **Joint Latent Variable Inference.** We are optimizing parameters $\theta$ (meaning/semantics) and $\phi$ (beliefs/world model) simultaneously to maximize the likelihood of observed utterances given environmental states, subject to a constraint that $\phi$ must be coherent with *our* $\phi$ (Charity).

  5.  **Addressing the "Residue Report":**
