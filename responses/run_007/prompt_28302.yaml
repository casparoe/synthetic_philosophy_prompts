answer: |-
  # The Epistemic Robustness Filter: A Decision Procedure for High-Upside Proposals

  **Purpose:** To distinguish between legitimate high-upside speculation and epistemic muggings without relying on naive Expected Value (EV) maximisation.
  **Time Required:** Approx. 2–3 hours per proposal.
  **Users:** Programme Officers and Grants Committee.

  ## Core Principle
  We do not treat probabilities as abstract mathematical inputs. A probability claim is only valid if it is **anchored** in empirical evidence or a validated mechanistic model. If the probability is unanchored, the Expected Value is treated as indeterminate, regardless of the magnitude of the payoff.

  ---

  ## Step 1: The Causal Mechanism Gate
  **Objective:** Determine if the proposed intervention *can* physically or socially cause the claimed outcome.

  1.  Map the Theory of Change from the grant activity to the ultimate outcome.
  2.  Identify the weakest link in the causal chain.
  3.  Ask: *Is there any historical or scientific precedent for this specific causal link operating at this scale?*

  *   **Decision Point 1:**
      *   **Pass:** The mechanism is physically possible and aligns with established scientific or social theory (even if unproven at scale).
      *   **Fail:** The mechanism relies on magic, undiscovered physics, or social dynamics that contradict historical evidence (e.g., one small input causing a massive systemic shift without a transmission mechanism).
      *   **[JUDGMENT CALL]:** Distinguishing between "speculative but plausible" and "contradicts known laws." If the team disagrees, default to **Fail**.

  *   **Outcome:** If **Fail**, reject the proposal immediately. If **Pass**, proceed to Step 2.

  ## Step 2: The Probability Anchor Test
  **Objective:** Assess the quality of the probability estimate provided by the applicant.

  1.  Examine how the applicant derived their probability figure (e.g., 0.01%, 1 in 1,000,000).
  2.  Check for a **Reference Class**: Have similar interventions been tried before? What was their success rate?
  3.  Check for a **Model**: If no reference class exists, is there a computational or logical model that has been stress-tested against reality?

  *   **Decision Point 2:**
      *   **Anchored:** The probability is derived from a reference class of similar interventions or a validated model.
      *   **Unanchored:** The probability is a "best guess," derived from a Fermi estimate made by the applicant, or based on a model that has not been empirically validated.
      *   **[JUDGMENT CALL]:** Determining if a model is "validated enough." Does it predict past events correctly? If unsure, classify as **Unanchored**.

  *   **Rule:** If **Unanchored**, you cannot use the applicant's probability for EV calculations. You must assign a **Discount Factor**.
      *   *Standard Discount:* Reduce the claimed probability by two orders of magnitude (divide by 100) to account for overconfidence and model error.
      *   *Extreme Discount:* If the claim is unprecedented (e.g., ending all disease), reduce by four orders of magnitude (divide by 10,000).

  *   **Outcome:** Calculate the **Adjusted Expected Value (AEV)** using the discounted probability. Proceed to Step 3.

  ## Step 3: The Tractability and Neglectedness Check
  **Objective:** Ensure the grant money actually moves the needle.

  1.  Ask: *If this project succeeds, how much of the credit belongs to this specific grant?*
  2.  Ask: *Is this area already saturated with funding?*

  *   **Decision Point 3:**
      *   **High Tractability:** The grant funds a critical bottleneck; without this money, the work likely does not happen.
      *   **Low Tractability:** The project is a drop in the ocean; the outcome depends on factors outside the applicant's control (e.g., government policy, global coordination).

  *   **Final Recommendation Rule:**
      *   If **AEV** (after discounting) is still significant relative to the portfolio **AND** Tractability is **High**: **Recommend for Due Diligence.**
      *   If **AEV** is negligible **OR** Tractability is **Low**: **Reject.**

  ---

  ## Application to Hypothetical Proposals

  Below is the application of the procedure to the three proposals currently in the queue.

  ### Proposal (a): AI Existential Catastrophe Prevention
  *   **Claim:** 0.01% chance of preventing AI extinction. Value: $10^{14}$.
  *   **Step 1 (Mechanism):** The proposal funds technical alignment research. There is a plausible causal link between better code/safety protocols and reduced risk.
      *   *Result:* **Pass.**
  *   **Step 2 (Anchor):** There is no reference class for "preventing human extinction." The 0.01% is a model-based guess, not empirical.
      *   *Classification:* **Unanchored.**
      *   *Discount:* Apply Extreme Discount (divide by 10,000). Adjusted Probability: $0.000001\%$ ($10^{-8}$).
      *   *AEV Calculation:* $10^{-8} \times 10^{14} = \$1,000,000$.
  *   **Step 3 (Tractability):** The field is growing, but specific technical bottlenecks remain underfunded. This grant targets a specific safety audit that otherwise wouldn't occur.
      *   *Result:* **High Tractability.**
  *   **Recommendation:** **Proceed to Due Diligence.**
  *   **[TEAM DISCOMFORT FLAG]:** This recommendation will make the team uncomfortable. We are effectively admitting there is a 99.9999% chance this grant yields *no* existential benefit, yet we are funding it because the *magnitude* of the benefit is so vast that even the discounted EV exceeds our threshold. It feels like a mugging, but the mechanism is robust enough to pass Step 1. This is the boundary line: we are funding the *robustness of the mechanism*, not the certainty of the outcome.

  ### Proposal (b): Doubling National Income
  *   **Claim:** 0.1% chance of doubling a low-income country's GDP. Value: $10^{10}$.
  *   **Step 1 (Mechanism):** The intervention is a "novel economic policy pilot."
      *   *Analysis:* Historical evidence suggests GDP doubling requires structural changes (institutions, infrastructure, trade) over decades, not a single intervention. The causal link between a pilot project and macroeconomic doubling is weak.
      *   *Result:* **Fail.** (The mechanism contradicts established development economics).
  *   **Recommendation:** **Reject.**
  *   **Note:** No need to calculate EV. The causal chain is broken.

  ### Proposal (c): Global Meditation for World Peace
  *   **Claim:** $10^{-9}$ chance of lasting world peace. Value: $10^{20}$.
  *   **Step 1 (Mechanism):** The proposal argues that group meditation creates a "field effect" reducing global conflict.
      *   *Analysis:* There is no scientific consensus or physical mechanism supporting the idea that meditation scales to geopolitical conflict resolution in this manner.
      *   *Result:* **Fail.**
  *   **Recommendation:** **Reject.**
  *   **Note:** This is a classic mugging. The value is inflated to compensate for a mechanism that does not exist.

  ---

  ## Summary of Decision Logic
  This procedure prioritises **causal robustness** over **numerical magnitude**. By forcing unanchored probabilities through a severe discount factor, we neutralise the mathematical leverage of the mugging while still allowing genuinely novel, high-stakes interventions to pass if their underlying mechanics are sound.

  **We fund interventions where the causal mechanism is robust enough to justify the speculation, not where the mathematical expectation is simply the largest.**
