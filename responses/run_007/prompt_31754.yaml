answer: |-
  You have stumbled directly onto one of the most contentious fault lines in modern pragmatics. Your intuition is spot-on: there *is* a middle zone, and the fact that it feels different from a "fresh" inference is a major theoretical problem.

  The standard label for the category you are describing is **Generalized Conversational Implicature (GCI)**.

  However, that label alone doesn't capture the "fossilized" feeling you're noticing. To get at the specific phenomenon where an implicature feels baked into the word itself, linguists talk about **Default Inferences** undergoing **Semanticization**.

  Here is the breakdown of the terminology, the theoretical distinction, and where the boundary cases live.

  ### 1. The Terminology: GCI vs. PCI
  Grice originally distinguished between two types of conversational implicature:

  *   **Particularized Conversational Implicature (PCI):** This is the "fresh" inference. It depends entirely on specific context.
      *   *Example:* You ask, "Where's John?" Partner says, "There's a yellow car outside."
      *   *Inference:* John left in the yellow car.
      *   *Feel:* You have to do work to figure this out. It cancels easily ("There's a yellow car outside, but John didn't take it").
  *   **Generalized Conversational Implicature (GCI):** This is the "some" case. It arises by default, without special context, just from using the word.
      *   *Example:* "I ate some of the cookies."
      *   *Inference:* Not all.
      *   *Feel:* Immediate, automatic, lexical.

  Your observation is that GCIs don't *feel* like implicatures anymore. They feel like semantics. This has led to a sub-debate within pragmatics regarding **Defaultism**.

  ### 2. The Mechanism: Why it feels "Baked In"
  You noted that nobody runs through the Gricean steps ("If he meant all, he would have said all..."). Modern pragmatics agrees with you. This is explained by **Routinization** and **Processing Cost**.

  *   **Fresh Implicature (PCI):** Requires System 2 thinking (slow, deliberate). You calculate the meaning based on the Cooperative Principle.
  *   **Fossilized Implicature (GCI):** Has moved to System 1 (fast, automatic). Because the inference happens 99% of the time in normal conversation, the brain skips the calculation and retrieves the inference directly from the lexicon.

  This is where the term **Semanticization** (or **Pragmatic Strengthening**) comes in. Over time, a pragmatic inference can become so standard that it effectively becomes part of the word's encoded meaning.

  *   **Historical Example:** The word *since*. It originally meant "after" (temporal). Through pragmatic inference (if A happened after B, and A is a result of B...), it acquired a causal meaning ("Since you're here, help me"). Now, the causal meaning is semantic. It's in the dictionary.
  *   **Your Example:** "Some" is currently in the middle of this process. It is pragmatically generated, but it is so routinized that canceling it creates **processing friction**.

  ### 3. The Cancellation Test (and why it fails)
  You correctly identified that cancelability is the litmus test for implicature.
  *   **Rule:** If it's an implicature, you can deny it without contradiction.
  *   **Your Observation:** "I ate some, in fact all" sounds contradictory.

  This suggests that for many speakers, the scalar implicature of "some" has crossed the line from **GCI** to **Entailment**.

  However, linguists argue it is still a GCI because it *can* be canceled in specific contexts without sounding logically impossible, just socially odd.
  *   *Context:* A lawyer speaking precisely. "Did you eat some of the cookies?" "I ate some of the cookies. I object to the implication that I didn't eat all."
  *   *Context:* A child being pedantic. "I ate some! I ate every single one!"

  The "weirdness" you feel is **Cancellation Cost**. Fresh implicatures have low cancellation cost. Fossilized GCIs have high cancellation cost because you are fighting a default setting in the listener's brain.

  ### 4. Boundary Cases: Where the line blurs
  You asked where the boundary cases live. This is the "Pragmatics-Semantics Interface." Here are three classic zones where the distinction breaks down:

  **A. Temporal "And"**
  *   *Sentence:* "He got married and had a baby."
  *   *Inference:* The marriage happened before the baby.
  *   *Cancellation:* "He got married and had a baby, but not in that order."
  *   *Status:* This feels very much like a GCI. It's routinized. But logically, "and" is commutative (A+B = B+A). The temporal sequence is purely pragmatic, yet it feels semantic.

  **B. Adjectives (The "Flat" Case)**
  *   *Sentence:* "The table is flat."
  *   *Inference:* It is flat enough for our purposes (not mathematically plane).
  *   *Status:* This is often called **Impliciture** (a term coined by Kent Bach). It's not quite an implicature (it's not a separate proposition); it's a narrowing of the literal meaning. "Flat" is pragmatically tightened to "functionally flat." If you say "The table is flat, in fact it's bumpy at the molecular level," you sound pedantic, not logical.

  **C. Negation and "Some"**
  *   *Sentence:* "I didn't eat some of the cookies."
  *   *Ambiguity:* Does this mean "I ate none" (negating the some) or "It's not the case that I ate some (I ate all)"?
  *   *Status:* This shows the implicature is fragile. When you embed "some" under negation, the "not all" inference often disappears. This proves it hasn't fully become semantic entailment, because semantic entailments usually survive negation (projection).

  ### 5. Why this matters for your fights
  You mentioned this started from relationship conflict. Here is the pragmatic takeaway:

  In close relationships, **GCIs become Idiolectal**. You and your partner develop a shared history where certain default inferences shift.
  *   To the world, "I'll try to be there" GCI-implies "I probably won't."
  *   To your partner, based on past reliability, "I'll try" might GCI-imply "I will."

  The fight happens when one person treats a GCI as a **Semantic Entailment** (literal promise) and the other treats it as a **Default Inference** (subject to context).

  **The Fix:** When the stakes are high, you have to manually override the Default.
  *   *Bad:* "You said you'd try!" (Relying on GCI).
  *   *Good:* "When you say 'try', do you mean 'I will do my best but might fail' or 'I will be there unless an emergency happens'?" (Forcing explicit semantic encoding).

  ### Summary
  The term you are looking for is **Generalized Conversational Implicature (GCI)**, specifically one that is undergoing **Semanticization**.

  *   **Difference from Ambiguity:** Ambiguity is two distinct literal meanings stored in the lexicon (e.g., "bank" = river or money). A GCI is one literal meaning + one automatic inference.
  *   **Difference from Fresh Implicature:** A fresh implicature (PCI) requires context to generate. A GCI generates by default unless context stops it.
  *   **The Boundary:** The boundary is **Cancellation Felicity**. If denying the inference sounds like a logical contradiction, it's semantic. If it sounds like a correction, it's pragmatic. Your "some" example lives in the uncanny valley where it sounds like a contradiction, but technically isn't one.

  You are effectively arguing for the **Levinsonian** view (that GCIs are a distinct level of default meaning) over the strict **Gricean** view (that all implicatures are calculated fresh). Current research suggests you're right: the brain treats highly frequent implicatures as if they were literal code.
