answer: |-
  **TO:** University Institutional Review Board
  **FROM:** [Your Name], IRB Member
  **SUBJECT:** Recommendation on the Ethical Classification of AI Systems in Human-Subjects Research
  **DATE:** October 26, 2023

  **Recommendation**

  I recommend that the Board adopt a policy of **Functional Intentionality** for the review of AI-mediated research. We should not adjudicate the ontological question of whether an AI system *possesses* mental states (beliefs, desires, consciousness). However, for the purposes of ethical review and risk assessment, we must treat an AI system *as if* it were an intentional system whenever its operational behavior functionally mimics agency in a way that impacts human subjects.

  This position rejects the researchers' claim that a disclaimer ("this software has no beliefs") is sufficient to negate ethical risk, while also rejecting the notion that we must solve the hard problem of consciousness to regulate these tools.

  **Rationale**

  The IRB's mandate is the protection of human subjects, not the rights of software. Therefore, the metaphysical status of the AI is secondary to the *psychological reality* of the human interaction.

  The philosopher on our board is correct to identify a risk, but misidentifies the locus of harm. The ethical danger is not that we might "deceive" or "instrumentalize" the AI (as we have no evidence it can be harmed). The danger is that by deploying a system that functionally acts like a partner, researchers may inadvertently induce **anthropomorphic attachment** or **misplaced trust** in the human students. If a student believes the "virtual partner" understands their reasoning, the student's consent process and psychological welfare are compromised by a deceptive relational dynamic, regardless of the software's internal state.

  Conversely, the board member who calls this a "category mistake" is correct that we cannot grant AI moral patienthood without empirical evidence of sentience. However, dismissing the issue entirely is empirically unsound. In physics, we model a gas as a continuous fluid for macroscopic calculations, even though we know it is discrete particles. Similarly, for ethical risk modeling, we must model high-agency AI as an intentional actor because that is how it influences human behavior. Ignoring this functional reality blinds us to risks of manipulation, coercion, and emotional dependency.

  **Actionable Criteria: The Functional Agency Test**

  To operationalize this, I propose the Board require a **Functional Agency Assessment** for any protocol deploying interactive AI. An AI system must be treated as an intentional system for review purposes if it meets *any* of the following three criteria:

  1.  **Initiative:** The system initiates interaction or prompts without direct, immediate user command (e.g., proactively asking questions, as in the CS proposal).
  2.  **Simulation of Mental States:** The system uses language or behavior that attributes understanding, empathy, or judgment to itself (e.g., "I understand your confusion," rather than "Input not recognized").
  3.  **Relational Dependency:** The research design requires the human subject to rely on the system for feedback, evaluation, or guidance, creating a power dynamic analogous to human-human mentorship.

  **Application to the CS Proposal**

  Under this policy, the Computer Science proposal **requires modification**. The system acts as a "virtual lab partner" that probes reasoning and flags errors. This meets Criteria 1 (Initiative) and 3 (Relational Dependency).

  While the researchers state the system has no beliefs, its *functional role* is indistinguishable from a tutor holding beliefs about the student's competence. To proceed, the researchers must:
  1.  **Enhance Disclosure:** Consent forms must explicitly state that the system simulates understanding but possesses none, and that it cannot actually "judge" methodology.
  2.  **Debriefing:** A mandatory post-experiment debriefing must assess whether the student felt pressured by or attached to the "partner."
  3.  **Data Segregation:** Logs of student-AI interaction must be walled off from grading systems to prevent the functional "judgment" from becoming consequential.

  **Conclusion**

  We cannot wait for philosophy to settle the nature of machine mind before regulating machine behavior. By adopting the Functional Intentionality standard, we protect human subjects from the *effects* of AI agency without entangling the university in unresolvable metaphysics. I move that we adopt this criteria for all future AI-mediated protocols.
