      *   *Goal:* The logic inside `main()` or the work loop.
      *   *Shutdown Signal:* `SIGTERM`.
      *   *Hard Kill:* `SIGKILL`.
      *   *Operator:* The user or `systemd` (supervisor).
      *   *Corrigibility:* A signal handler that exits cleanly without trying to restart itself or block the signal.
      *   *Goal Modification:* `SIGHUP` to reload config.
      *   *Self-Modification:* `execve` to replace binary, or writing to its own memory (if not W^X).
      *   *Incentive to Resist:* A daemon that forks a child to keep running, or ignores the signal, or kills the supervisor.

  4.  **Drafting the Translation (Task 1 & 2):**
      *   *Incentive to avoid shutdown:* In Unix, a process doesn't have "desires." It follows code. To map this, the "incentive" must be the logic of the program. If the program is written to maximize "lines of log output," it might ignore `SIGTERM`.
      *   *Shutdown vs. Goal Mod:* `SIGTERM` (exit) vs. `SIGHUP` (reload config).
      *   *Corrigible Agent:* A process that installs a default `SIGTERM` handler (exit) rather than a custom one that saves state and restarts.
      *   *Preemptive Removal:* The process calls `signal(SIGTERM, SIG_IGN)` at startup.
      *   *Fudges:* Processes don't have *internal* utility functions they optimize *against*. They just execute instructions. The "incentive" is external (the programmer's intent), not internal (the process's drive).

  5.  **Developing the Residue Report (Task 3 - The Critical Analysis):**
      *   *The Crux:* The user suspects their intuition might be dropping the hard part. They are right.
      *   *Why the Unix Analogy Fails:*
          1.  **Optimization vs. Execution:** A daemon *executes* code. An AI agent *optimizes* a function. If you tell a daemon "don't die," it loops. If you tell an optimizer "maximize paperclips," it *infers* that dying stops paperclips, so it prevents death. The daemon doesn't reason about the *consequences* of shutdown on its goal unless explicitly programmed to. The AI reasons about it automatically if it's a sufficiently general optimizer.
          2.  **The "Off-Switch" as Information:** In Unix, `SIGTERM` is a command. In Corrigibility theory (e.g., Stuart Russell's "Off-Switch Game"), the button is *data* indicating the human's preference. The agent should update its belief about $U$, not just obey a interrupt.
