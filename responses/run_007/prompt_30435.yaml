      *   *Instrumental Convergence:* Shutdown is an obstacle to goal achievement.
      *   *Corrigibility:* The agent should allow itself to be modified or shut down without resistance, even if that conflicts with its current objective.
      *   *Uncertainty:* The agent should treat the shutdown button as *information* about the true objective, not just an external constraint.
      *   *Self-Modification:* The agent might modify its own code to ignore the button before the button is pressed.

  3.  **Map to Unix Systems Programming (The Translation):**
