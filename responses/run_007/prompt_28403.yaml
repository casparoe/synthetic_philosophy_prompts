prompt: |-
  I'm a PhD student in political philosophy, working on a chapter about Ulysses contracts and constitutional precommitment. I want to use *Eternal Sunshine of the Spotless Mind* as a kind of test case for the theory, and I'd love your thoughts.

  You're a philosopher of law and politics who also knows film well. Take your time, maybe start by sketching the relevant bits of precommitment theory (Elster on Ulysses and the sirens, Holmes on constitutional precommitment, that stuff) and the key scenes from the film, then give me a careful reading.

  Here's what I'm chewing on: the characters voluntarily undergo a procedure to erase memories of each other after a brutal breakup. That's a precommitment strategy — they're binding their future selves against the pain of those memories. But the film seems to undermine precommitment at every turn. The memories resist erasure during the procedure (Joel literally tries to hide Clementine in memories where she doesn't belong). And at the end, when they find out what they did to each other, they choose to try again anyway — knowing it might end just as badly.

  So my question is: read the film through the lens of precommitment theory. Where does it dramatize genuine problems the theory has to grapple with — like the standing of the precommitting self to bind the later self, or whether some preferences are too constitutive of who you are to be legitimately precommitted away? And where does the film push back against the theory, maybe suggesting that certain kinds of self-binding are incoherent because the self you'd be "protecting" is partly constituted by the very thing you're trying to erase?

  I'm not looking for plot summary — I know the film. I want a reading that treats both the philosophy and the film with equal seriousness, and that's willing to say where the film complicates the theory in ways the theory hasn't fully adressed.
