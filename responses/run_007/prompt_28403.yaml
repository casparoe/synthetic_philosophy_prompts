      *   *Point 2: The Problem of Constitutive Preferences.* Precommitment usually targets *instrumental* weaknesses (eating cake vs. diet). But love/pain are *constitutive*. You can't bind yourself against your own history without ceasing to be who you are. The film argues that pain is not an externality to be managed but a texture of the self.
