          *   *Maimonidean Reply:* To regulate it strictly so it doesn't slide back into idolatry.
          *   *Verdict:* Serious tension.

      *   *Candidate 3: Pre-Sinaitic Sacrifices (Abel, Noah, Patriarchs).*
          *   *Weight:* Fatal/Heavy. If it's a concession to Egyptian/Midianite culture, why did Abel (pre-Egypt) do it? Nahmanides uses this to crush Maimonides.
          *   *Maimonidean Reply:* They acted on their own reasoning, not divine command yet.
          *   *Verdict:* Strong point for rivals.

      *   *Candidate 4: Prophetic Critiques (Isaiah 1, Jeremiah 7).*
          *   *Weight:* Ambiguous. Maimonides says this supports him (Prophets want the *goal*, not the *means*). Rivals say Prophets critique *hypocrisy*, not the *institution*.
          *   *Verdict:* Actually supports Maimonides more than rivals, so not a defeater *for* Maimonides, but needs nuance.

      *   *Candidate 5: Post-Temple Survival.*
          *   *Weight:* Awkward. If sacrifice was the concession and prayer the goal, why is the loss of sacrifice still mourned as a catastrophe?
          *   *Verdict:* Phenomenological tension.

      *   *Candidate 6: Leviticus 1: "A satisfying aroma to the Lord."*
