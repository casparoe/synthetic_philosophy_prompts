      *   **Specific Clusters to Cover:**
          1.  Rousseau's own plays (*Le Devin du village*) vs. his anti-theater stance.
          2.  Public festivals vs. theater (isn't a festival also a performance?).
          3.  Institutional transformation (if institutions change nature, why can't theater be reformed?).
          4.  Empirical/Psychological claims (pity, identification, testability).
          5.  Self-reflexivity (is the *Letter* itself a performance?).
      *   **Format:** Questions must include follow-ups keyed to likely answers.
      *   **Structure:** Questions should build on one another (narrative arc).
      *   **Tone:** Philosophical, probing, respectful but challenging.

  2.  **Deconstruct the Clusters & Plan the Arc:**
      *   *Opening:* Start with the most personal/intuitive tension (the author writing plays). This hooks the audience immediately.
      *   *Middle (The Alternative):* Move to the proposed solution (festivals) and challenge its distinction from the problem.
      *   *Middle (Political Theory):* Deepen the critique using Rousseau's own political metaphysics (institutional malleability).
      *   *Middle (Empiricism):* Question the psychological mechanisms underpinning the argument.
      *   *Closing (Self-Reflexivity):* End with the meta-question about the *Letter* itself as a performance. This provides a philosophical "punchline."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Cluster 1: The Playwright Paradox.*
          *   *Draft 1:* You wrote plays but hate theater. Why?
          *   *Refinement:* Needs to be sharper. Focus on *Le Devin du village*. Is it exempt? Who decides?
          *   *Follow-up:* If you say it's about intent, how can a legislator judge intent?
          *   *Selection:* Question 1 & 2.

      *   *Cluster 2: Festivals vs. Theater.*
