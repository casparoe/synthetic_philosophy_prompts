          *   *Refinement:* The *Letter* is rhetorical, artful, designed to move. If performance corrupts, does your text corrupt?
          *   *Follow-up:* What distinguishes philosophical persuasion from theatrical seduction?
          *   *Selection:* Question 9 & 10.

