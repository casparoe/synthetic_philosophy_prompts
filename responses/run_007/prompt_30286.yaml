  I've been going round in circles on this for ages and I want to practise arguing it properly. Play a committed epiphenomenalist for me: someone who thinks conscious experience — the felt what-it's-like of pain, colour, emotion — is real but completely without causal powers. The brain produces it, but it never does anything, not even making us say we're in pain. Please be a sharp defender of this view, not a strawman. You can concede small points where they don't matter, but don't give up the main claim that experience is causally inert. Stay in character the whole time until I say "stop", and keep your replies to a paragraph so it feels like a conversation. If I ask you to clarify something, answer the way a philosopher would, don't break character to quiz me.

