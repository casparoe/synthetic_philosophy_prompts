      *   Ensure the "cost" is explicit for each.

  **(Self-Correction during drafting):** I need to be careful not to conflate *consciousness* (phenomenal) with *cognition* (functional). The argument slides between "mind," "beliefs/desires," and "subjects of experience." I should point out this ambiguity as a potential diagnostic tool itself. Premise (4) relies on phenomenal intuition, while Premise (1) relies on functional criteria.

  Let's organize the response by targeting the specific premises each theory attacks.

  *   **Functionalism:** Attacks (4).
  *   **Bio-Naturalism:** Attacks (1).
  *   **IIT/Panpsychism:** Attacks (2) (degree of integration).
  *   **Enactivism:** Attacks (1) & (2) (autonomy/boundary).
