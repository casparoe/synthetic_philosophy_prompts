      *   (2) Many systems (markets, biofilms, crowds, internet) have similar functional organization.
      *   (3) If Functionalism $\rightarrow$ All these systems have minds (Liberalism about minds).
      *   (4) Conclusion (3) is unacceptable (Conservatism about minds).
      *   (5) Therefore, Ant Colony $\neg$ Mind.
      *   (6) Human Brain = System of non-conscious parts (neurons) coordinated.
      *   (7) Therefore, Human Brain $\neg$ Mind (or need a principled difference).
