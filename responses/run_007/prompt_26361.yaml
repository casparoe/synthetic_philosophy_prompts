      *   **The "Mark of the Cognitive" / Vehicle vs. Process (Adams, Aizawa):**
          *   *Diagnosis:* Reject (2). The "coupling-constitution fallacy." Just because parts interact doesn't mean the whole is a cognitive agent.
          *   *Cost:* Needs a robust theory of intrinsic representation.

  5.  **Refining the "Cost" Analysis:**
