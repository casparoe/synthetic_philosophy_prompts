answer: |-
  You have put your finger on one of the richest and most debated topics in modern philosophy, economics, and political theory. You are absolutely right that there is a specific name for this, and you are also right that the "weirdness" you feel—the paradox of the self restricting the self—is the exact philosophical puzzle that makes it so interesting.

  The short answer is that the technical term is **precommitment** (or **self-binding**), and the classic metaphorical name is a **Ulysses Pact** (or Ulysses Contract).

  But since you asked for the nuance and the "why it feels tricky" part, let's unpack this properly. There is a whole architecture of thought built around exactly the examples you gave.

  ### 1. The Name: The Ulysses Pact
  The term comes from Homer's *Odyssey*. Odysseus (Ulysses) wants to hear the song of the Sirens, but he knows that when he hears it, he will be overcome with an irresistible desire to steer his ship toward them, which will kill him.

  So, while he is still rational (Tuesday-You), he orders his crew to tie him to the mast and plug their own ears. He commands them: "No matter how much I beg, threaten, or order you to release me when we pass the Sirens, do not do it."

  When the ship passes the Sirens, Odysseus *does* beg and scream. He is genuinely angry. He wants to be untied. But because of his prior precommitment, he is ignored. He survives.

  This is precisely your friend with the ice block and the credit card. It is precisely the constitution that is hard to amend. The term **Ulysses Pact** captures the dramatic tension: the rational past self binding the passionate future self.

  ### 2. The Mechanism: Time Inconsistency
  You asked: *"Why should the you of Tuesday get to boss around the you of Wednesday?"*

  In standard economics for a long time, it was assumed that people were "time-consistent." If you prefer an apple to a cookie today, you should prefer an apple to a cookie next week. But behavioral economists (like Richard Thaler and George Ainslie) realized humans are **time-inconsistent**.

  We suffer from **hyperbolic discounting**. We value immediate rewards disproportionately higher than future rewards.
  *   **Tuesday-You:** Values "Health" (100 points) over "Cake" (50 points). Health wins.
  *   **Wednesday-You (standing in front of cake):** Values "Cake Now" (100 points) over "Health Later" (50 points). Cake wins.

  Your preferences have flipped simply because time has passed. Tuesday-You knows this flip is coming. Tuesday-You knows that Wednesday-You is essentially a different agent with different values. So, Tuesday-You restricts Wednesday-You's options to force Wednesday-You to adhere to Tuesday-You's values.

  ### 3. The "Weirdness": The Divided Self
  This addresses your unease about the "same person on both sides." Many philosophers and psychologists argue that the "unsettling" feeling you have is actually a recognition of a deep truth: **We are not a single, unified self.**

  There are two main models used to explain this:

  **A. The Planner and the Doer (Thaler & Shefrin)**
  Economists Richard Thaler and Hersh Shefrin proposed that inside one human skin, there are two agents.
  *   **The Planner:** Cares about long-term welfare (health, savings, sobriety).
  *   **The Doer:** Cares about immediate gratification (smoke, spend, eat).
  When your friend puts the credit card in ice, it is the *Planner* restricting the *Doer*. The paradox dissolves if you accept that "you" are actually a society of competing internal agents.

  **B. System 1 and System 2 (Daniel Kahneman)**
  Nobel laureate Daniel Kahneman popularized this in *Thinking, Fast and Slow*.
  *   **System 2:** Slow, deliberative, logical (Tuesday-You).
  *   **System 1:** Fast, impulsive, emotional (Wednesday-You).
  Precommitment is System 2 building a cage for System 1.

  So, to answer your question: Is Wednesday-You the "real" you? The theory suggests **both are real**, but they have different jurisdictions. The philosophical trickiness comes from deciding which one has the *authority*. Most precommitment theories argue the Planner/System 2 has "sovereignty" because it represents your reflective values, not just your reflexive urges.

  ### 4. The Political Connection: Jon Elster
  You mentioned constitutions, and this is where the political philosopher **Jon Elster** becomes essential reading for you. In his book *Ulysses and the Sirens* (1979) and later *Ulysses Unbound*, he explicitly connects the personal examples you gave to political theory.

  Elster argues that democracies use constitutions as Ulysses Pacts.
  *   **The People (Tuesday):** Write a constitution protecting free speech or property rights.
  *   **The People (Wednesday):** Get swept up in a moment of panic or passion (a war, a recession, a demagogue) and want to suspend those rights.
  *   **The Constitution:** The block of ice around the credit card. It makes it hard to act on the impulse.

  Elster argues this is rational because "the people" are not a single rational actor; they are prone to "passions" that they will later regret. By tying their own hands, they preserve their long-term autonomy against their short-term impulses.

  ### 5. The Debate: Is it Rational? Is it Free?
  You asked if people disagree about whether this is rational. They do.

  **The Pro-Precommitment View (Autonomy as Self-Control):**
  Philosophers like Gerald Dworkin argue that precommitment *enhances* freedom. If you are addicted to nicotine, you aren't free; the addiction controls you. By binding yourself, you are liberating your "true" self from the tyranny of impulse. This is sometimes called **Positive Liberty** (freedom *to* achieve your goals) vs. **Negative Liberty** (freedom *from* interference). Precommitment sacrifices Negative Liberty to gain Positive Liberty.

  **The Anti-Precommitment View (The Sovereignty of the Present):**
  Critics argue that Wednesday-You is just as real as Tuesday-You. Why does Tuesday get to be the dictator?
  *   **Preference Change:** What if Wednesday-You *genuinely* changed their mind? What if your friend actually stopped wanting to smoke, but also stopped wanting to live by rigid rules?
  *   **The Regret Problem:** If you tie your hands too tightly, you lose the ability to adapt to new information. A constitution that is *too* hard to amend can cause civil war because it can't adapt to reality. A credit card in ice is useless if there's a genuine emergency.
  *   **The Identity Problem:** The philosopher Derek Parfit argued that over time, we are psychologically less connected to our past/future selves. If Wednesday-You is psychologically very different from Tuesday-You, does Tuesday-You have the *moral right* to restrict them?

  ### 6. Summary of the "Flavors"
  To wrap this up, here is how scholars categorize the variations you noticed:

  1.  **Hard Precommitment:** Making the action impossible (throwing the cigarettes in the ocean). High security, high risk if you made a mistake.
  2.  **Soft Precommitment:** Making the action costly or difficult (putting cigarettes in the freezer, or a constitution requiring a 2/3 vote). Allows for override if the impulse is strong enough.
  3.  **Internal vs. External:**
      *   *Internal:* Willpower (often fails).
      *   *External:* Using the environment or other people (the roommate, the waiter, the Constitution).

  ### Conclusion
  You have identified **Precommitment Strategy** within the framework of **Time Inconsistency**, often illustrated by the **Ulysses Pact**.

  The "unsettling" feeling you describe is the friction between **Personal Identity** (am I one person or many?) and **Autonomy** (does freedom mean having options, or having the ability to stick to your plans?).

  If you want to read more on this specifically, I would recommend starting with **Jon Elster's *Ulysses and the Sirens***. It is accessible, witty, and deals exactly with the bridge between the personal (addiction) and the political (constitutions) that you intuitively connected. You aren't just thinking too much; you're thinking like a political philosopher.
