answer: |-
  This is a fascinating puzzle in aesthetic epistemology. Your friend's intuitions are remarkably consistent, which suggests she is operating under a coherent, albeit unstated, principle. To work out what she should say about the theatre case, we need to reverse-engineer her logic from the six verdicts you've provided.

  Here is an analysis of the rules she seems to be following, the competing interpretations, and how to test them.

  ### The Primary Hypothesis: The Immediate Access Principle

  The most compelling rule that fits all six of her verdicts is what we might call the **Immediate Access Principle**. This rule posits that testimony from a trustworthy source (whether an expert or a personally trusted layperson) is sufficient for aesthetic belief, *unless* the object of judgement is immediately available for your own direct perception without significant effort.

  Let's trace this through her cases:
  *   **Trust Baseline:** The Goodreads stranger is rejected immediately because they lack trustworthiness. All other sources (novelist, musicologist, brother, critic, sommelier) are deemed trustworthy.
  *   **The Barrier to Entry:** In the cases where she says 'yes' (novel, recording, mural, brother's book), there is a barrier between the subject and the object. You must order the book, travel to the archive, or gain entry to a private home. Even if these are possible, they are not *immediate*.
  *   **The Exception:** In the wine case, the object is literally in your glass. The barrier to verification is zero. Consequently, she insists you must taste it yourself.

  **Prediction for the Theatre Case:**
  Under the Immediate Access Principle, the verdict should be **Yes**. Although tickets are affordable and available, attending the play requires action: purchasing the ticket, travelling to the venue, and sitting through the performance. This is analogous to ordering the debut novel, not to tasting the poured wine. The object is not 'present' in the immediate environment.

  ### The Competing Hypothesis: The Transience Principle

  However, there is a rival rule that fits the existing data just as well. We might call this the **Transience Principle**. This rule suggests that testimony is permissible for enduring objects (books, recordings, murals) but impermissible for transient or consumable experiences (wine, live performances), where the aesthetic quality is tied to a specific moment that passes once experienced.

  *   **Enduring Objects:** The novel, the recording, the mural, and the brother's book are all static. They remain the same whether you experience them now or later. Testimony is a safe placeholder.
  *   **Transient Experiences:** The wine is a fleeting gustatory experience; once drunk, it is gone. This demands first-hand verification.
  *   **The Gap:** We haven't yet seen a case involving a live, time-sensitive event like a play.

  **Prediction for the Theatre Case:**
  Under the Transience Principle, the verdict should be **No**. A live theatre production is ephemeral; like the wine, it is an event that happens in time. If her prohibition on the wine is based on the nature of the experience (consumable/temporal) rather than its physical proximity, she ought to insist you see the play yourself before believing it is 'unmissable'.

  ### Distinguishing the Rules: The Tie-Breaker Case

  To determine which rule is truly guiding her, we need a case that separates *immediacy of access* from *transience of the object*. We need a scenario involving an enduring object that is immediately present.

  **The Test Case:**
  > You are visiting a museum with a curator friend whose taste you trust. You are standing directly in front of a painting. You haven't studied it closely yet, but she says, 'This is a masterpiece.' Can you justifiably believe her without examining it further?

  **How the Rules Diverge:**
  *   **The Immediate Access Principle says No.** The painting is right in front of you. Just like the wine in the glass, the aesthetic object is present for your own perception. To rely on her say-so would be to bypass your own faculties when they are currently engaged with the object.
  *   **The Transience Principle says Yes.** The painting is a static, enduring object (like the novel or the mural). It will not change or disappear if you look at it later. Therefore, testimony is permissible even if you are standing in the gallery.

  ### Summary of Verdicts

  | Rule | Basis of Distinction | Verdict on Theatre Case | Verdict on Museum Test Case |
  | :--- | :--- | :--- | :--- |
  | **Immediate Access** | Physical proximity / Effort to verify | **Yes** (Tickets require effort) | **No** (Painting is present) |
  | **Transience** | Nature of the object (Static vs. Event) | **No** (Play is a live event) | **Yes** (Painting is static) |

  ### Conclusion

  If I were to place a wager, I would suggest your friend is likely following the **Immediate Access Principle**. The wine case feels distinctively about the *presence* of the glass ('already poured in your glass') rather than the chemistry of the wine. Furthermore, the distinction between the 'orderable' novel and the 'poured' wine suggests effort is the key variable.

  Therefore, she will probably say **Yes** to the theatre case: you can believe the play is unmissable on your colleague's say-so, because seeing it requires a trip to the theatre, whereas the wine required only a sip. However, if you wish to be certain, present her with the Museum Case. If she hesitates to accept the curator's word while standing before the canvas, you'll know proximity is her true constraint.

  Cheers.
