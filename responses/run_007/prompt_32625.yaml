  - "reverse_residue": an array of strings, each describing something my engineering framework handles naturally that the philosophical treatment makes unnecessarily mysterious
  - "bottom_line": a one-sentence verdict on whether JOOTSing is a deep insight or just rediscovering metaprogramming
