prompt: |-
  You are a professional philosopher specializing in weakness of will, akrasia, and the philosophy of action, with a working knowledge of the psychology of hyperbolic discounting, preference reversal, and self-control. You have been asked to help a novelist translate your field's insights into a reusable character-construction procedure. Think carefully before you write. Begin by brainstorming the key distinctions and mechanisms your field recognizes — judgment shifts, executive failure, preference reversals under temporal proximity, the difference between akrasia and compulsion, the question of whether clear-eyed akrasia is possible at all — and then decide which of these survive translation into a tool for someone who is not a philosopher and who needs to make a decision in under an hour. Be honest about which distinctions you are dropping and why.

  I am a novelist. I write literary fiction in which characters make consequential decisions against their own better judgment: the politician who torpedoes a career they spent decades building, the parent who breaks a promise they genuinely meant to keep, the addict who walks back into the room they swore they would never enter again. I am tired of writing these moments by feel and suspecting afterward that they worked only because the plot required them. I want a procedure I can run during outlining, before I write a word of prose, that tells me whether a character's failure of will is psychologically credible given how I have constructed them — their desires, their beliefs, their history, their situation — and, if it is not, what I would need to change.

  The procedure should be something I can use in under an hour per major character. I have no formal training in philosophy, though I am willing to learn a small number of technical distinctions if they earn their keep. I need the procedure to be honest about where it is making a judgment call rather than applying a rule, and I need it to flag the cases it cannot settle — where the philosophy itself is divided, or where the answer depends on a fact about human psychology that is not yet known. I also need it to tell me when the most honest answer is "this character, as you have built them, would not plausibly fail here — if the plot requires it, you must change either the character or the situation."

  Please deliver:

  1. A step-by-step procedure — a checklist, a flowchart in words, a set of questions to ask in order — that I can run on any character facing a moment of possible akratic failure. Each step should say what counts as a sufficient answer and where the procedure stops with a "no, this won't work."

  2. A brief explanation, in plain language, of the key idea or ideas from the philosophy of weakness of will that the procedure operationalizes. I do not need a literature review; I need to know what the procedure is doing so I can trust it and adapt it when it misfires.

  3. Three worked applications:
     - A politician who has spent twenty years building toward a Supreme Court nomination and, at the confirmation hearing, makes a gratuitously hostile remark that sinks it — a remark they knew, even as they formed it, would destroy them.
     - A parent who genuinely believes they should keep a promise to attend their child's performance and, at the last moment, chooses to stay at work instead.
     - An alcoholic who has been sober for three years and, on an ordinary Tuesday with no obvious trigger, walks into a bar and orders a drink.

  4. For at least one of these, the procedure should tell me something I will not want to hear — that the failure is not credible as written, or that I have built the character wrong for the moment I need them to have.

  5. A section on what the procedure cannot do: the cases it cannot adjudicate, the philosophical disagreements it papers over, and the ways a clever novelist can fool it.

  Ground the procedure in the actual philosophical and psychological work on akrasia — the distinction between weakness of will and compulsion, the structure of hyperbolic discounting and preference reversal, the role of judgment shifts versus executive failure, the question of whether akrasia is even possible — but do not lecture. Every distinction you include must earn its place by doing work in the procedure. If a distinction cannot be translated into a question a novelist can ask about their character, leave it out and note that you have done so.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional Philosopher (specializing in weakness of will/akrasia/philosophy of action) + Psychologist (hyperbolic discounting/self-control).
      *   **Task:** Create a reusable character-construction procedure for a novelist.
      *   **Goal:** Help the novelist determine if a character's failure of will (akrasia) is psychologically credible *before* writing.
      *   **Constraints:**
          *   Usable in under an hour per character.
          *   No formal philosophy training required (but willing to learn key distinctions).
          *   Must be honest about judgment calls and limitations.
          *   Must flag when a failure is *not* plausible (requiring character/plot change).
          *   Must include: Step-by-step procedure, Plain language explanation of key ideas, Three worked applications (one must deliver bad news), Limitations section.
          *   Tone: Professional, rigorous, yet practical and accessible. No lecturing.

  2.  **Deconstruct the Philosophy/Psychology:**
      *   *Core Concept:* Akrasia (acting against one's better judgment).
      *   *Key Distinctions:*
          *   **Akrasia vs. Compulsion:** Akrasia implies some agency/choice; compulsion implies inability to do otherwise (addiction/obsession). This matters for moral responsibility and narrative tension.
          *   **Synchronic vs. Diachronic:** Is the judgment happening *at* the moment of action (synchronic) or was it a prior plan abandoned later (diachronic)?
          *   **Judgment Shift vs. Executive Failure:** Did the belief change ("actually, this isn't bad") or did the will fail ("I know it's bad, but I did it")? "Clear-eyed akrasia" is the hard case.
          *   **Hyperbolic Discounting:** Valuing immediate rewards disproportionately higher than future rewards as the moment approaches.
          *   **Preference Reversal:** Preferring A over B at time T1, but B over A at time T2 (closer to action).
      *   *Translation to Fiction:*
          *   Need to map "Better Judgment" to specific character beliefs/values.
          *   Need to map "Temptation" to specific immediate gratifications or relief.
          *   Need to map "Failure" to a mechanism (distraction, rationalization, overwhelm).
      *   *Dropping Complexity:* I need to drop the deep metaphysical debate on whether free will exists or if akrasia is logically impossible (Socrates). I need to drop complex neuroeconomic modeling. I need to focus on *narrative credibility*.

  3.  **Drafting the Procedure (The "Akrasia Audit"):**
      *   *Step 1: Define the Better Judgment.* What exactly did they intend? Why? (Values/Stakes).
      *   *Step 2: Define the Counter-Desire.* What pulls them away? (Immediate vs. Future).
      *   *Step 3: The Gap Analysis.* Is the gap between Judgment and Action bridgeable by known psychological mechanisms? (Hyperbolic discounting, ego depletion, rationalization).
      *   *Step 4: The Mechanism Check.* How did the switch happen? (Compulsion? Shift in belief? Pure weakness?).
      *   *Step 5: The Credibility Verdict.* Does this fit the character's history?

      *Refining the Procedure:* Make it a checklist with "Stop" conditions. If the "Better Judgment" isn't actually held, it's not akrasia. If the "Counter-Desire" is zero, it's not akrasia. If the mechanism is magic, it fails.

  4.  **Drafting the Explanation:**
      *   Keep it simple. Focus on *Temporal Proximity* (the "now" is powerful) and *Partitioned Mind* (the part that plans vs. the part that acts).
      *   Explain "Clear-Eyed Akrasia" simply: Knowing it's wrong while doing it.
      *   Explain "Compulsion" vs. "Weakness": Could they have stopped if a gun was to their head?

  5.  **Drafting the Worked Applications:**
      *   *Politician:* High stakes. Needs a mechanism. Anger? Ego protection? If it's just "oops," it fails. Let's make this the one that *fails* the audit to satisfy constraint #4. Why? Because sinking a Supreme Court nomination with a *gratuitous* remark is hard to justify unless there's a deep psychological wound triggered *in that moment*. If the prompt says "gratuitously hostile," it implies no external provocation. That's hard to make credible without changing the character.
      *   *Parent:* Classic conflict. Work (abstract/future value) vs. Child (immediate emotional cost/guilt). Hyperbolic discounting applies (the pain of leaving work *now* outweighs the disappointment of the child *later*). Needs a stressor.
      *   *Addict:* High compulsion element. Needs to distinguish between relapse (disease model) and akrasia (choice model). "Ordinary Tuesday" is the key. Needs a subtle trigger or ego depletion.

      *Decision:* I will make the Politician example the "Fail." It's the hardest to justify psychologically without appearing incompetent or self-destructive in a way that needs more backstory.

  6.  **Drafting the Limitations:**
      *   Philosophy isn't settled (Socrates vs. Aristotle vs. Davidson).
      *   Psychology varies (individual differences in impulse control).
      *   Fiction needs *some* improbability (plot vs. character).
      *   The "Unreliable Narrator" loophole.

  7.  **Review and Refine:**
      *   *Tone Check:* Am I lecturing? Keep it directive.
      *   *Time Check:* Can this be done in an hour? Yes, if the questions are sharp.
      *   *Constraint Check:* Did I drop distinctions? Yes (metaphysics of free will). Did I explain why? Yes (irrelevant to narrative credibility).
      *   *Constraint Check:* Did one example fail? Yes (Politician).
      *   *Constraint Check:* Is the philosophy grounded? Yes (Davidson, Elster, Ainslie).

  8.  **Final Polish:** Ensure the distinction between *compulsion* and *akrasia* is clear in the procedure, as that's a major philosophical hinge. Ensure "Hyperbolic Discounting" is explained as "The Magnification of the Now."

  *(Self-Correction during drafting)*: I initially thought about making the Addict the failure case. But addiction is often treated as compulsion in modern contexts. If the novelist wants *akrasia* (moral failure), they need to establish the addict still has agency. If they want *compulsion*, the audit changes. I'll stick with the Politician as the failure because "gratuitous self-sabotage" without a subconscious driver is psychologically thin. It forces the novelist to dig deeper or change the plot.

  Let's assemble the response.

  *Structure:*
  1. Introduction (Setting the stage).
  2. The Procedure (The Akrasia Audit).
  3. The Philosophy (Plain English).
  4. Worked Examples (including the "Fail").
  5. Limitations.

  *Key Philosophical References to keep in mind (internal):* Donald Davidson (How is Weakness of the Will Possible?), George Ainslie (Hyperbolic Discounting), Jon Elster (Ulysses and the Sirens), Richard Holton (Willpower). I won't name-drop excessively, but the logic must reflect them.

  *Refining the "Fail" condition:* The procedure needs a specific "Red Flag" section. If the character lacks a *mechanism* for the shift, it's a fail.

  *Refining the "Parent" example:* Make sure it's not just "bad parent." It needs to be "parent who *believes* they should go but doesn't." The mechanism is likely avoidance of immediate stress (work crisis) vs. delayed guilt.

  *Refining the "Addict" example:* Distinguish between "urge overwhelmed me" (compulsion) and "I decided to have just one" (akrasia). The prompt says "walks into a bar." That implies agency.

  Okay, ready to write.
answer: |-
  ## Introduction

  You are asking for a bridge between metaphysics and craft. In philosophy, *akrasia* (weakness of will) is the state of acting against one's own better judgment. The central puzzle is: If an agent knows X is the best thing to do, and has the ability to do X, why do they do Y?

  For a novelist, the puzzle is different: *Will the reader believe this?*

  To build this procedure, I have stripped away the metaphysical debates (e.g., "Is free will an illusion?") and the complex neuroeconomics. I have retained the distinctions that determine *narrative credibility*. Specifically, I am dropping the Socratic view that akrasia is impossible (that we always act on what we perceive as "good" in the moment). While philosophically interesting, it doesn't help you draft a scene. I am also collapsing the distinction between *synchronic* (failing at the exact moment of judgment) and *diachronic* (failing a prior resolution) akrasia, as the reader experiences them similarly.

  What remains are the mechanisms of failure: **Preference Reversal** (valuing the now over the later), **Rationalization** (changing the belief to fit the action), and **Executive Depletion** (the willpower muscle tired out).

  Here is your tool.

  ***

  ## 1. The Akrasia Audit (Step-by-Step Procedure)

  **Time Required:** 45–60 Minutes
  **Materials:** Character profile, Scene outline.

  **Instructions:** Answer the following five sections. If you hit a **[STOP]** condition, the failure is not currently credible. You must revise the character's psychology or the situation's pressure before proceeding.

  ### Step 1: Establish the "Better Judgment"
  Define the specific judgment the character is violating.
  *   **Question:** What is the specific proposition the character affirms as true *before* the failure? (e.g., "I must not drink," "I must attend my daughter's play.")
  *   **Question:** What is the *source* of this judgment? (Moral duty, prudential self-interest, fear of consequence, love?)
  *   **Question:** On a scale of 1–10, how deeply held is this judgment? (1 = vague preference, 10 = core identity).
  *   **[STOP] Condition:** If the judgment is a 1 or 2, this is not weakness of will; it is indifference. Raise the stakes or abandon the akrasia angle.

  ### Step 2: Identify the Counter-Desire
  Define the force pulling them away.
  *   **Question:** What immediate gratification or relief does the action offer? (Pleasure, anxiety reduction, ego protection, anger release?)
  *   **Question:** Is this desire *new* or *latent*? (Did the situation trigger it, or has it been waiting?)
  *   **[STOP] Condition:** If there is no identifiable benefit to the character (even a twisted one), the action is random, not akratic. Human beings do not act without perceived benefit.

  ### Step 3: The Mechanism of Reversal (Crucial Step)
  How did the "Better Judgment" lose? Choose **one** primary mechanism.
  *   **Option A: Hyperbolic Discounting.** The reward/pain of the *now* became magnified compared to the future. (e.g., "The drink helps *now*; the hangover is *later*.")
  *   **Option B: Rationalization.** The character temporarily convinced themselves the action wasn't actually bad. (e.g., "I've worked hard; I deserve this," or "This remark is necessary for justice.")
  *   **Option C: Executive Depletion.** The character had the judgment but lacked the mental energy to enforce it due to prior stress/fatigue.
  *   **[STOP] Condition:** If you cannot name the mechanism, or if the mechanism contradicts the character's history (e.g., a highly disciplined character succumbs to Option A without prior fatigue or high stress), the failure is not credible.

  ### Step 4: The Compulsion Check
  Distinguish weakness from inability.
  *   **Question:** If a gun were held to their head (or an equivalent ultimate threat existed), could they stop?
  *   **Yes:** It is Akrasia (Weakness of Will). They chose.
  *   **No:** It is Compulsion (Addiction/Pathology).
  *   **Note:** If you write Compulsion but frame it as Akrasia, readers may feel cheated by the lack of agency. If you write Akrasia but frame it as Compulsion, they may feel the character is being unfairly judged. Be clear on which this is.
  *   **[STOP] Condition:** If you claim it is Akrasia, but the character's history shows zero prior instances of resisting similar impulses, you are missing the "muscle" required for the failure to matter. Akrasia requires a will that *could* have worked but didn't.

  ### Step 5: The Aftermath Test
  *   **Question:** Immediately after the action, does the character feel regret/shame (confirming the judgment stood) or relief/justification (confirming the judgment shifted)?
  *   **Requirement:** For "Clear-Eyed Akrasia" (knowing it was wrong while doing it), the regret must be immediate or simultaneous.
  *   **[STOP] Condition:** If the character feels *nothing*, the judgment in Step 1 was not real.

  ***

  ## 2. The Philosophy Behind the Tool (Plain Language)

  This procedure operationalizes three core concepts from the philosophy of action and behavioral psychology.

  **1. Preference Reversal (Hyperbolic Discounting)**
  Standard economics assumes we value things consistently. Psychology shows we do not. We discount the future non-linearly. A reward available *now* is valued disproportionately higher than a reward available *tomorrow*, even if the delay is the same.
  *   *For the Novelist:* A character doesn't need to change their mind about what is "good." They just need the *present* to become psychologically massive. The pain of *now* (withdrawal, awkwardness, fatigue) outweighs the abstract value of the *future* (health, career, trust). Your job is to make the "Now" heavy.

  **2. The Partitioned Mind (Rationalization vs. Judgment)**
  Philosopher Donald Davidson argued that we can hold two conflicting beliefs if we keep them in separate mental compartments. We don't always change our moral compass; sometimes we just blindfold ourselves temporarily.
  *   *For the Novelist:* This is the "Yes, but..." mechanism. "Yes, I shouldn't drink, *but* today is different." This is distinct from simply forgetting the rule. The character must actively (though perhaps subconsciously) construct a loophole.

  **3. Clear-Eyed Akrasia**
  This is the hardest case: Acting against a judgment you hold *at the very moment of action*. Philosophers debate if this is possible. Psychologically, it manifests as a failure of *executive function* rather than *evaluation*. The brain knows the road is blocked but hits the gas anyway due to emotional override.
  *   *For the Novelist:* This requires high emotional arousal (rage, panic, despair). If the character is calm, clear-eyed akrasia is rarely credible. The "system" must be overheated.

  ***

  ## 3. Worked Applications

  ### Case A: The Politician (The Supreme Court Nominee)
  *Scenario:* 20 years of preparation. At the hearing, makes a gratuitously hostile remark that sinks the nomination. They knew it would destroy them as they said it.

  **Audit Results:**
  *   **Step 1 (Judgment):** "I must be confirmed." (Intensity: 10/10).
  *   **Step 2 (Counter-Desire):** What is the benefit of the hostile remark?
      *   *Draft Answer:* "They were annoying me."
      *   *Audit Critique:* Insufficient. Annoyance does not override a 20-year goal unless the annoyance triggers a deeper pathology.
  *   **Step 3 (Mechanism):**
      *   *Attempt:* Clear-Eyed Akrasia (Anger override).
      *   *Audit Critique:* For this to work, the anger must be framed as a loss of control (Compulsion) OR the character must believe the remark is necessary (Rationalization). If it is truly "gratuitous" (no purpose) and "known to be destructive" (clear-eyed), this violates the Principle of Minimal Rationality.
  *   **Step 4 (Compulsion Check):** Could they have stayed silent if threatened? Yes. So it is Akrasia.
  *   **Step 5 (Aftermath):** Immediate horror.

  **VERDICT: [STOP] — NOT CREDIBLE AS WRITTEN.**
  **Why:** You have constructed a character with a 10/10 desire for the nomination and a 10/10 understanding of the consequences. A "gratuitous" remark implies no strategic value. Akrasia requires a competing desire strong enough to override the goal. "Being annoyed" is not strong enough to override "20 years of ambition."
  **Fix:** You must change the character or the situation.
  1.  *Change Character:* Give them a pathological need for dominance that outweighs the nomination (making the nomination secondary, not primary).
  2.  *Change Situation:* The Senators must trigger a specific trauma that causes a temporary break in executive function (making it closer to compulsion/panic attack).
  3.  *Change Motivation:* The character must subconsciously *want* to fail (self-sabotage due to impostor syndrome). This turns the "Counter-Desire" into "Relief from Pressure." Without this, the character is simply incompetent, not weak-willed.

  ### Case B: The Parent (The Broken Promise)
  *Scenario:* Believes they should attend child's performance. Stays at work instead.

  **Audit Results:**
  *   **Step 1 (Judgment):** "I should be there for my child." (Intensity: 8/10).
  *   **Step 2 (Counter-Desire):** Avoidance of immediate conflict at work + Financial security.
  *   **Step 3 (Mechanism):** Hyperbolic Discounting.
      *   *Analysis:* The pain of leaving work *now* (angry boss, unfinished task) is immediate and concrete. The pain of the child's disappointment is *later* and abstract.
  *   **Step 4 (Compulsion Check):** Could they leave? Yes. It is Akrasia.
  *   **Step 5 (Aftermath):** Guilt on the drive home.

  **VERDICT: CREDIBLE.**
  **Why:** This fits the standard model of preference reversal. The "Now" (work stress) magnifies the cost of leaving. To strengthen it, ensure the work stress is acute (a crisis), not routine. If it's routine, the Judgment (Step 1) wasn't held strongly enough.

  ### Case C: The Alcoholic (The Ordinary Tuesday)
  *Scenario:* Sober 3 years. No obvious trigger. Walks into a bar.

  **Audit Results:**
  *   **Step 1 (Judgment):** "I must not drink." (Intensity: 10/10).
  *   **Step 2 (Counter-Desire):** Numbing of low-level anxiety / Return to familiar coping.
  *   **Step 3 (Mechanism):** Executive Depletion + Rationalization.
      *   *Analysis:* "Ordinary Tuesday" is the risk. If there is *no* stress, why the depletion?
      *   *Refinement:* You must establish that "Ordinary" implies "Monotonous/Depleting." Or, the Rationalization is: "I've done 3 years. I can handle one."
  *   **Step 4 (Compulsion Check):** This is the danger zone. If the urge is physiological (withdrawal), it leans toward Compulsion. If it is a decision ("I'll just have one"), it is Akrasia.
  *   **Step 5 (Aftermath):** Shame.

  **VERDICT: CREDIBLE (WITH CAUTION).**
  **Why:** This works only if you depict the *internal negotiation*. If they just walk in like a zombie, it reads as Compulsion (disease). If they argue with themselves ("Just one won't hurt") and lose, it is Akrasia. You must write the rationalization. The "Ordinary Tuesday" works best if the lack of crisis lowers their guard (complacency), which is a form of judgment shift.

  ***

  ## 4. Limitations and Loopholes

  This procedure is a tool for realism, not a law of physics. Be aware of its blind spots.

  **1. The "Unreliable Narrator" Loophole**
  The Audit assumes the character's self-report (Step 1) is true. A clever novelist can use this. The character *says* they wanted to stop, but the Audit reveals they didn't. This creates irony. The procedure will flag this as a "Judgment Shift," but you can use that intentionally to show self-deception.

  **2. Philosophical Disagreements**
  I have grounded this in the "Davidsonian" view (akrasia is possible). Some philosophers (Socrates/Plato) argue we always act on what we perceive as "good" in the moment. If you subscribe to this, every failure is actually a *mistake in calculation*, not a failure of will. The Audit treats these similarly, but the *tone* of the scene changes. Is the character weak (Davidson) or mistaken (Socrates)? The procedure doesn't force a choice, but you should know which you are writing.

  **3. The "Plot Armor" Problem**
  Sometimes the plot *needs* the failure, even if the character wouldn't plausibly do it. The Audit will tell you "This won't work." You can override it, but you pay a tax in credibility. To pay the tax, you must increase the "Counter-Desire" (Step 2) artificially. You must manufacture a stressor or a temptation stronger than the character's history suggests, just to make the math balance.

  **4. Cultural and Individual Variance**
  The psychology of impulse control varies by culture, upbringing, and neurotype. The Audit assumes a "neurotypical" baseline of executive function. If your character has ADHD, trauma responses, or comes from a culture with different temporal orientations, the "Hyperbolic Discounting" thresholds will shift. Adjust Step 3 accordingly.

  **5. The Mystery of Agency**
  Finally, there is a hard limit. We do not fully understand why a will fails in one instance and holds in another identical one. Sometimes, people just break. If the Audit says "Fail," but you have a profound artistic reason to include the moment, trust the art. But know that you are moving from Psychological Realism into Tragedy or Absurdism, where actions need not be rational, only resonant.
