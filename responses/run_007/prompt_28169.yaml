  The primary justification rests on the magnitude of risk and permanence of loss. Plasma regenerates within days, and egg donation, while invasive, does not compromise a woman's long-term survival in the way nephrectomy does. Removing a kidney is major surgery with lifelong implications for renal reserve, creating a higher threshold for what constitutes acceptable risk in exchange for money. The law presupposes that while individuals have autonomy over surplus biological materials, they should not be permitted to permanently diminish their own physiological viability for cash, as this undermines the state's interest in preserving citizen health and prevents the desperate from trading life expectancy for liquidity.

  However, the line is not purely medical; it is also deeply cultural. We compensate for sperm and eggs but regulate surrogacy differently, and whole blood is often voluntary while plasma is paid. These inconsistencies suggest that historical accidents and moral intuitions about reproduction versus survival also dictate policy. If the primary objection were strictly about exploitation rather than commodification, the regulatory framework would shift from prohibition to strict governance. Instead of banning payment, the system would mandate independent donor advocacy, enforce cooling-off periods, guarantee lifelong health insurance for complications, and potentially establish a single-payer model to set prices that reflect risk without preying on desperation. This would treat the kidney not as an inalienable part of the self that cannot be touched, but as a high-risk commodity requiring consumer protections similar to those in clinical trials or hazardous labor industries.
