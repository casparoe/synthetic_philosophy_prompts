          *   Kidney: Vital organ (you need two for optimal health, losing one is permanent), surgery is major/invasive, risk of long-term health issues, non-regenerative.
          *   *Principle:* Compensation is allowed where the donor's long-term health and autonomy are not permanently compromised.
      *   **The Exploitation/Consent Angle:**
          *   If the objection were purely about exploitation/pressured consent (rather than "selling body parts is wrong"), the rules would look different.
