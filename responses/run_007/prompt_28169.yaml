prompt: |-
  My brother's been on dialysis for the last year and we just found out its illegal to pay someone for a kidney, even a willing donor who'd get to keep one. But there's a plasma center down the street that pays people for blood plasma, and a friend of mine made five grand last year donating eggs. I'm trying to figure out what view of markets or of the body that set of rules presupposes. Is there a coherent principle that lets you sell plasma and eggs but not a kidney, or is the line just wherever it happens to have landed? What would have to change in the rules if the real objection was about exploitation or pressured consent rather than about selling body parts as such? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
