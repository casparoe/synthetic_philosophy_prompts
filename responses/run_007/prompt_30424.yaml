answer: |-
  # Factored Cognition Evaluation Protocol (FCEP-1)

  **Objective:** Determine if a proposed architecture approximates HCH (Humans Consulting HCH) by enforcing bounded-context decomposition rather than monolithic sequential reasoning.
  **Timebox:** 30 Minutes.
  **Pass Requirement:** All "Critical" checks must pass. "Judgment" checks require team consensus.

  ### 1. Structural Decomposition (Critical)
  **Question:** Is the computational graph explicitly tree-structured (parent delegating to children) rather than a single linear sequence?
  *   **Pass:** Tasks are recursively split into independent subtasks.
  *   **Fail:** Reasoning occurs as a single continuous stream (e.g., token-by-token generation without explicit breaks).
  *   **Stop Condition:** If **Fail**, reject proposal. Do not proceed.

  ### 2. Context Bounding (Critical)
  **Question:** Is the input context for any single node capped at a fixed size, regardless of total task complexity?
  *   **Pass:** A node sees only its specific query and direct child outputs. It does not access the full global history or sibling branches.
  *   **Fail:** Nodes access the entire prior reasoning trace or global state vector.
  *   **Stop Condition:** If **Fail**, reject proposal. Do not proceed.

  ### 3. Interface Transparency (Judgment)
  **Question:** Is information passed between nodes restricted to human-interpretable symbols (e.g., natural language) rather than opaque embeddings?
  *   **Pass:** All inter-node communication is auditable natural language.
  *   **Fail:** Communication relies on hidden state vectors or latent space transfers.
  *   **Judgment Zone:** Hybrid systems (e.g., natural language with hidden scratchpads). Requires safety team vote on whether hidden state compromises inspectability.

  ### 4. Local Verifiability (Judgment)
  **Question:** Can a human reliably verify the correctness of a single node's operation in isolation, given only its input and output?
  *   **Pass:** A human could perform the subtask themselves in reasonable time.
  *   **Fail:** Subtasks are too complex or abstract for direct human validation.
  *   **Judgment Zone:** Subtasks are borderline human-level. Requires assessment of whether "human simulatability" is needed for safety or just transparency.

  ### 5. Aggregation Integrity (Critical)
  **Question:** Is the final output derived strictly from the composition of node outputs, without external "shortcut" mechanisms?
  *   **Pass:** The root answer is constructed solely from child responses.
  *   **Fail:** The system bypasses the tree (e.g., model generates final answer directly alongside the tree).
  *   **Stop Condition:** If **Fail**, reject proposal.

  ---

  # Application of FCEP-1 to Research Proposals

  ## Proposal 1: Long Chain-of-Thought (CoT)
  *System generates a detailed reasoning trace (tokens $t_1...t_n$) before producing a final answer.*

  *   **Q1 (Structure):** **FAIL.** The reasoning is a linear sequence, not a tree of delegated subtasks. Each token depends on the prior sequence.
  *   **Q2 (Context):** **FAIL.** Context window grows linearly with reasoning length. Later steps see the entire prior trace.
  *   **Decision:** **REJECT.** The proposal fails Critical checks Q1 and Q2. It represents monolithic sequential reasoning, not factored cognition. No further evaluation needed.

  ## Proposal 2: AI Debate with Human Judge
  *Two models argue opposing sides of a claim; a human judge decides the winner based on the transcript.*

  *   **Q1 (Structure):** **PASS (Conditional).** Claims are decomposed into arguments and cross-examinations. However, the structure is often linear transcript-based rather than explicit tree delegation.
  *   **Q2 (Context):** **JUDGMENT.** Models typically see the full transcript so far. If the transcript grows unbounded, context is not bounded per node. If the protocol forces models to address only specific recent claims, it may pass.
  *   **Q3 (Interface):** **PASS.** Communication is natural language arguments.
  *   **Q4 (Verifiability):** **JUDGMENT.** A human judges the final claim, but can they verify every intermediate assertion made during cross-examination? Complex technical claims may exceed immediate human verification.
  *   **Q5 (Aggregation):** **PASS.** The outcome relies on the argumentation process.

  *   **Decision:** **UNDECIDED / NEEDS INFO.** The proposal passes Critical Q1 and Q5 only if the debate protocol enforces tree-like decomposition rather than linear arguing.

  ### Additional Information Required for Proposal 2
  To resolve the **Judgment** and **Conditional** flags, the safety team requires:
  1.  **Context Management Policy:** Does the model receive the full transcript history at every turn, or is the context window restricted to the current claim branch? (Required for Q2).
  2.  **Decomposition Rules:** Is there a mechanism forcing models to break claims into sub-claims recursively, or do they argue holistically? (Required for Q1).
  3.  **Granularity of Claims:** What is the complexity limit of a single assertion subject to cross-examination? (Required for Q4).
