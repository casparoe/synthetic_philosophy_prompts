      *   Supports "Mind not Machine"? Addressed.
      *   Identify the "Debate Closer" reading? Yes.

      *(Self-Correction during drafting)*: Make sure to distinguish between "Machine" as "Formal System" and "Machine" as "Physical Object." Gödel applies to formal systems. The leap to physical machines requires the Church-Turing thesis. I should mention that briefly.

      *(Refining the Levels for Clarity)*:
