          *   Both think the other is bad at conditional probability.
          *   Need to identify misconceptions for each group.
          *   Need a specific "check for understanding" activity at the end.
          *   Need to distinguish between "talking past each other" vs. "genuinely unresolved."
      *   **Goal:** A structured teaching plan (sequence, examples, interventions).

  2.  **Deconstruct the Audience & Their Biases:**
      *   *Physicists:* Often lean towards objective frequencies or symmetries in the setup. They might view the coin toss as the only random variable. "The coin is fair, so $P(Heads) = 1/2$. Waking up gives no new info about the coin." They might ignore the *sampling* bias introduced by the waking protocol.
      *   *Computer Scientists:* Often lean towards algorithmic probability, observer moments, or betting arguments. They might view "waking up" as sampling from the set of all possible wake-ups. "There are 3 wake-ups, 1 is Heads, so 1/3." They might ignore the *temporal indexicality* or the specific proposition being evaluated.
      *   *Common Ground:* Both are good at Bayes' Theorem but disagree on the *inputs* (priors, likelihoods, reference classes).

  3.  **Determine the Pedagogical Arc (90 mins):**
      *   *0-15 min:* Setup & Intuition Pumping (avoiding immediate calc).
      *   *15-45 min:* The Core Conflict (Formalizing the disagreement).
      *   *45-70 min:* The "Steel Man" Variants (Testing the principles).
      *   *70-85 min:* Assessment/Activity.
      *   *85-90 min:* Wrap-up (What remains open).

