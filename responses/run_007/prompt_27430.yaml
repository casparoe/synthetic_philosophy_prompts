      *   **Phase 2: Addressing the Camps (Misconceptions):**
          *   *Physicists (Halfers):* They treat "waking up" as a certainty, not evidence. Need to show that *selection effects* matter. Use the "Betting" argument early to show pragmatic consequences.
          *   *Computer Scientists (Thirders):* They treat "wake-ups" as independent samples. Need to show that credence isn't just frequency of observer moments. Use the "Technicolor Beauty" or "Extreme Sleeping Beauty" to test limits.
          *   *Intervention Point:* When they start writing Bayes' rules. Stop them. Ask: "What is $E$?" and "What is the Reference Class?"

