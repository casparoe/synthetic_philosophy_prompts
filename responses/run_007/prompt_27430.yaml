          *   *Idea:* The "Coma" variant or a variant where the payoff structure changes.
          *   *Best Idea:* **The "Sabotage" Variant.** If Beauty can disable the Tuesday alarm, should she? This forces them to commit to a decision-theoretic framework (EDT vs. CDT).

