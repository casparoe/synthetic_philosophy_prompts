answer: |-
  Here is a 90-minute teaching plan designed specifically for quantitative grad students who will try to solve this with Bayes' Theorem before understanding what the variables *mean*.

  ### The Core Pedagogical Strategy
  **Do not start with Sleeping Beauty.**
  If you start with the coin and the wake-ups, the physicists will model the coin and the computer scientists will model the wake-ups. They will never talk to each other.

  You must start with **Centered Propositions**. The technical gap here isn't probability math; it's the logic of indexicals ("I", "here", "now"). Until they agree on what kind of object a belief is, they cannot agree on the probability.

  ---

  ### Phase 1: The Conceptual Pre-requisite (0:00 – 0:20)
  **Goal:** Establish that self-locating belief is distinct from standard proposition belief.
  **The Tool:** The "Two Rooms" Case (not Sleeping Beauty).

  1.  **The Setup:** Tell them: "There are two identical rooms, A and B. A duplicate of you is in one, and another duplicate is in the other. You don't know which room you are in. A fair coin determined who goes where, but both rooms exist."
  2.  **The Question:** "What is your credence that you are in Room A?"
  3.  **The Trap:** A physicist might say "The coin is fair, so the *world* where A exists is 1/2." A CS person might say "There are two of me, so I'm 50% likely to be this one."
  4.  **The Intervention:** Introduce **Centered Worlds**.
      *   Standard proposition: "Room A exists." (True in both worlds).
      *   Centered proposition: "I am in Room A." (True in one centered world, false in the other).
      *   **Crucial Point:** Make them write down the **Sample Space**.
          *   Halfer-style space: $\{World_1, World_2\}$
          *   Thirder-style space: $\{(World_1, Me_A), (World_2, Me_B)\}$
      *   **Why this matters:** You need them to see that the disagreement isn't about arithmetic; it's about *what counts as a possible outcome*.

  ### Phase 2: Sleeping Beauty & The Camp Divide (0:20 – 0:50)
  **Goal:** Let them fight, then diagnose the specific error in their Bayes' Theorem inputs.
  **The Carrier:** **Extreme Sleeping Beauty**.
  *   *Why:* Standard Beauty (1 wake vs 2 wakes) is too close to call. Use 1 wake on Heads, 1,000,000 wakes on Tails. It forces the intuition to break.

  1.  **The Vote:** Ask for a show of hands: 1/2 or 1/3 (or 1/1,000,001).
      *   *Expectation:* Physicists $\to$ 1/2. CS $\to$ 1/3.
  2.  **The Whiteboard Battle:** Ask one from each camp to write their Bayes' update.
      *   $P(H|Wake) = \frac{P(Wake|H)P(H)}{P(Wake)}$
  3.  **Diagnosing the Misconceptions (The "Head Off" Moment):**
      *   **To the Physicists (Halfers):** They will claim $P(Wake|H) = P(Wake|T) = 1$.
          *   *The Counter:* "You are ignoring the **selection effect**. You are not sampling a *world*; you are sampling an *observer-moment*. If Tails creates 1,000,000 observer-moments and Heads creates 1, the likelihood of *this* moment being Tails is higher."
          *   *The Fix:* Force them to define $E$ (Evidence). Is $E$ "Beauty wakes up" or "Beauty wakes up *now*"?
      *   **To the Computer Scientists (Thirders):** They will treat observer-moments as independent samples.
          *   *The Counter:* "You are conflating **frequency of experiences** with **credence in a proposition**. Just because there are more Tails-wakes doesn't mean the coin was biased. Are you betting on the coin or betting on the wake-up?"
          *   *The Fix:* Ask them if they would bet on Heads if the payoff was per *coin flip* rather than per *wake-up*.

  ### Phase 3: The Operational Test (0:50 – 1:10)
  **Goal:** Move from "What is true?" to "What do you do?"
  **Why:** Quantitative students respect decision theory. If credence doesn't guide action, it's meaningless to them.

  **The Activity: The Pre-Experiment Betting Slip.**
  Tell them: "Before Beauty goes to sleep on Sunday, she is offered a bet. She can buy a ticket for \$1. If the coin is Heads, it pays \$X. If Tails, it pays \$0. The bet is settled once, after the experiment is over."

  *   **Ask the Halfers:** "If your credence is 1/2, what is the fair price?" (Should be \$0.50).
  *   **Ask the Thirders:** "If your credence is 1/3, what is the fair price?" (Should be \$0.33).
  *   **The Twist:** Now change the bet. "The ticket pays \$1 for *every time* you wake up and guess correctly."
      *   Thirders will feel vindicated (bet on Tails).
      *   Halfers must explain why they would bet on Heads (credence 1/2) but act as if it's Tails (to maximize payoff).
  *   **The Lesson:** This exposes that Halfers often separate **Credence** from **Betting Odds** in self-locating cases, while Thirders conflate them. This is the "Talking Past Each Other" zone.

  ### Phase 4: The Final Check (1:10 – 1:25)
  **Goal:** Verify they understand the *stakes*, not just the solution.
  **Do NOT ask:** "So, is it 1/2 or 1/3?"

  **The Assessment Question:**
  > "Imagine Beauty is told on Sunday: 'If you wake up and it is Monday, you will be asked for your credence. If you wake up and it is Tuesday, you will be silently killed.' She knows this rule. She wakes up. What is her credence that she will survive?"

  *   **Why this works:**
      *   A **Halfer** who thinks "waking up is no evidence" must say survival probability is 1/2 (based on the coin).
      *   A **Thirder** who thinks "I am a random wake-up" must calculate based on the proportion of surviving wake-ups.
      *   **The Correct Insight:** Both should realize the answer depends on whether the *killing* happens before or after the credence assignment, and whether "survival" is a property of the *world* or the *observer*.
      *   **What to look for:** You want them to pause and ask: "Am I betting on the coin outcome, or on my current temporal location?" If they ask that, they understand the problem. If they immediately calculate, they missed the point.

  ### Phase 5: What to Leave Unresolved (1:25 – 1:30)
  **Goal:** Intellectual honesty. Don't pretend philosophy has solved this.

  1.  **Genuinely Unresolved:** The normative link between **Self-Locating Credence** and **Decision Theory**.
      *   Tell them: "We do not have a consensus on whether Causal Decision Theory or Evidential Decision Theory applies to centered worlds. That is why the betting arguments fail to settle it."
  2.  **Talking Past Each Other:** The definition of "New Evidence."
      *   Tell them: "Halfers define evidence as 'information about the external world.' Thirders define evidence as 'information about my location in the world.' You are both doing the math right; you are modeling different variables."

  ### Summary of Misconceptions to Head Off

  | Camp | The Assumption | The Intervention Point |
  | :--- | :--- | :--- |
  | **Physicists** | "The coin is the only random variable. Waking is deterministic given the coin." | **Phase 2:** When they write $P(Wake|H) = 1$. Force them to acknowledge they are sampling *time slices*, not worlds. |
  | **CS / ML** | "Credence = Frequency of observer moments in the dataset." | **Phase 3:** The Pre-Experiment Bet. Show that maximizing wake-up accuracy $\neq$ maximizing coin-flip accuracy. |
  | **Both** | "Bayes' Theorem solves this." | **Phase 1:** Before the puzzle starts. Show that Bayes requires a agreed-upon sample space, which is exactly what is in dispute. |

  ### One Thing to Refuse to Settle
  **Do not arbitrate who is "right."**
  Your role is to show that **Halferism** is a theory about *worlds* (metaphysics) and **Thirderism** is a theory about *observers* (epistemology).
  If a student asks, "But what is the *real* probability?" your answer is: "That depends on whether you think probabilities attach to coins or to experiences. We don't have a meter for that."

  This keeps the discussion productive rather than adversarial. They are sharp enough to appreciate that the *question* is the hard part, not the *answer*.
