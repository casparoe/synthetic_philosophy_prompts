          *   *Wait, better idea:* Use **Betting** as the carrier. Physicists and CS folks respect decision theory. If credence doesn't guide action, what is it?
          *   *Decision:* Stick to Sleeping Beauty but immediately pivot to the **Betting Argument** as the stress test.

      *   **Phase 4: The "Talking Past Each Other" vs. "Unresolved":**
          *   *Talking Past:* Definition of "new evidence." Halfers say waking up isn't evidence about the coin. Thirders say it is evidence about *which* waking it is.
