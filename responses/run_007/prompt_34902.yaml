      *   *Core Thesis:* A life dominated by moral concerns (a "moral saint") is not an ideal of personal well-being or rationality.
      *   *Key Distinction:* She distinguishes between the *Loving Saint* (who finds happiness in being moral) and the *Rational Saint* (who sacrifices non-moral interests for moral ones). Her critique focuses mainly on the latter, but arguably affects the former too regarding the *range* of interests.
      *   *Key Argument:* Moral perfection crowds out non-moral virtues and interests (humor, gourmet cooking, art, etc.). A life lacking these is impoverished.
      *   *Implication for Moral Theory:* This is a critique of *utilitarianism* and *Kantianism* (dominant normative theories) which imply that moral reasons always override non-moral reasons. It suggests these theories provide an inadequate conception of *rationality* or *well-being*.
      *   *Does she say morality is unimportant?* No. She says it shouldn't be the *only* thing that matters.
