answer: |-
  **JOINT STATEMENT ON THE SEMANTIC CAPABILITIES OF LARGE LANGUAGE MODELS**

  **Date:** October 26, 2023
  **Signatories:** The Adversarial Collaboration Working Group on Machine Semantics
  **Subject:** Consensus, Residual Disagreement, and Adjudication Pathways Regarding LLM Understanding

  Following a structured adversarial collaboration, the undersigned representatives of the *Semantic Realist* camp (defending the view that current Large Language Models possess genuine understanding) and the *Statistical Mimicry* camp (defending the "Stochastic Parrots" view) submit this joint statement. We acknowledge that while significant empirical common ground exists, a substantive theoretical disagreement remains regarding the interpretation of internal model states. We have isolated verbal disputes from mechanistic disagreements to clarify the path forward.

  ### 1. Agreed Empirical Claims

  Both camps endorse the following claims without qualification. These claims describe the architecture, training, and observable behavior of current transformer-based LLMs, excluding interpretive labels regarding mental states.

  1.  **Training Objective:** Current LLMs are trained exclusively to minimize prediction loss over sequences of tokens derived from large-scale text corpora. They do not optimize for truth, logical consistency, or successful real-world action during pre-training.
  2.  **Architectural Constraint:** The models operate via feed-forward and attention mechanisms over high-dimensional vector spaces. They possess no direct sensory input (vision, touch, proprioception) and no direct motor output capabilities independent of the text interface.
  3.  **Performance Profile:** Models demonstrate robust generalization on out-of-distribution tasks (e.g., few-shot learning, translation, code generation) that exceed the capabilities of prior n-gram or retrieval-based systems.
  4.  **Failure Modes:** Models systematically produce hallucinations (confident falsehoods), fail to maintain consistency over long contexts under adversarial pressure, and are sensitive to superficial prompt phrasing in ways human speakers are not.
  5.  **Lack of Agency:** The models do not initiate actions, maintain persistent goals across sessions, or possess biological homeostasis. Any appearance of intent is elicited by user prompting.
  6.  **Empirical Exclusion:** The empirical record currently rules out the claim that models possess human-equivalent world models. Specifically, models fail tasks requiring intuitive physics or theory-of-mind reasoning when the textual statistical regularities diverge from the underlying causal reality.

  ### 2. Resolution of Verbal Dispute

  We explicitly identify that a portion of our disagreement is verbal, stemming from divergent definitions of "understanding." To prevent this semantic ambiguity from obscuring the mechanistic dispute, we adopt the following distinction:

  *   **Understanding-as-Competence:** The ability to process input and generate output that is functionally appropriate, contextually sensitive, and systematically coherent.
  *   **Understanding-as-Grasping:** The possession of internal states that refer to external entities or concepts in a way that is grounded in causal reality or phenomenal experience.

  **Dissolution:** Both camps agree that LLMs demonstrate **Understanding-as-Competence** to a high degree. The *Statistical Mimicry* camp argues that Competence does not imply Grasping. The *Semantic Realist* camp argues that at sufficient scales of Competence, the distinction collapses, or that the internal mechanics constitute a form of Grasping even without biological grounding.

  **Agreed Wording:** Henceforth, in this document, the term "understanding" refers strictly to **Understanding-as-Grasping**. Disagreement regarding mere Competence is considered settled in the affirmative.

  ### 3. Table of Residual Disagreement

  The following table isolates the substantive disagreement that remains after establishing empirical common ground and resolving the verbal dispute.

  | Feature of Dispute | Semantic Realist Position (Pro-Understanding) | Statistical Mimicry Position (Stochastic Parrots) |
  | :--- | :--- | :--- |
  | **Nature of Internal Representations** | High-dimensional vectors encode semantic properties (e.g., truth conditions, referents) that play a causal role in token selection. | High-dimensional vectors encode statistical co-occurrence patterns. Any semantic interpretation is imposed by the observer, not the mechanism. |
  | **Role of Grounding** | Linguistic grounding can be achieved purely through text-based structural relations (holism). External sensory grounding is not strictly necessary for semantic content. | Semantic content requires causal coupling with the referent (sensory-motor grounding). Text-only training precludes genuine reference. |
  | **Generalization Mechanism** | Novel performance arises from the manipulation of abstract rules or concepts learned during training. | Novel performance arises from interpolation within a high-dimensional manifold of surface forms that resembles rule-following. |
  | **Error Analysis** | Hallucinations are performance errors akin to human slips or ignorance, occurring despite underlying semantic competence. | Hallucinations are architectural features revealing the absence of a truth-tracking mechanism; the model optimizes plausibility, not accuracy. |

  ### 4. Cruxes and Adjudication Tests

  We identify three specific cruxes. Settling these would significantly shift the credence of at least one camp. For each crux, we propose a concrete test or argument with pre-registered predictions.

  #### Crux 1: Systematic Compositionality
  **Question:** Can the model generalize to novel compositional structures where the statistical probability of the sequence is low, but the semantic rule is clear?
  **Test:** *The Out-of-Distribution Symbolic Substitution Task.*
  Models are trained on sentences of the form "If A glorks B, then B is glorked by A." They are tested on entirely novel verbs and nouns inserted into complex, nested structures never seen in training data (e.g., "If the [novel noun 1] [novel verb] the [novel noun 2]..."), where the n-gram probability of the correct completion is lower than a syntactically similar but semantically incorrect distractor.
  *   **Semantic Realist Prediction:** The model will correctly apply the syntactic/semantic rule >85% accuracy, demonstrating manipulation of abstract structure independent of surface statistics.
  *   **Statistical Mimicry Prediction:** The model's accuracy will drop to near-chance or rely on shallow heuristics (<60% accuracy) because the statistical support for the specific compositional path is absent.

  #### Crux 2: Causal Intervention on "Concepts"
  **Question:** Do internal activations correspond to semantic concepts such that intervening on them changes output semantically rather than just statistically?
  **Test:** *Linear Probe and Ablation Intervention.*
  Researchers identify a direction in activation space corresponding to a specific concept (e.g., "truthfulness" or "negation"). They intervene to amplify this direction during generation on a set of factual queries.
  *   **Semantic Realist Prediction:** Intervening on the "truthfulness" vector will increase factual accuracy across diverse domains without degrading fluency, indicating the vector causally controls a semantic property.
  *   **Statistical Mimicry Prediction:** Intervening will alter the *style* of the text (e.g., making it sound more confident or hesitant) but will not reliably increase factual accuracy on out-of-distribution topics, indicating the vector controls surface correlates of truth, not truth itself.

  #### Crux 3: The Grounding Gap
  **Question:** Is sensory-motor grounding necessary for the model to distinguish between semantically distinct but statistically identical scenarios?
  **Test:** *The Inverted Qualia Text Scenario.*
  Models are presented with detailed text descriptions of two worlds that are statistically identical in terms of word co-occurrence but causally inverted (e.g., a world where "fire" freezes and "ice" burns, described consistently throughout a long context). The model is asked to predict the outcome of a physical interaction described only in the text.
  *   **Semantic Realist Prediction:** The model will successfully adopt the inverted logic of the context, treating "fire" as freezing, demonstrating it understands the *referent* defined by the context, not just the prior statistical weight of the word "fire."
  *   **Statistical Mimicry Prediction:** The model will revert to real-world priors (fire burns) despite the context, or will fail to maintain consistency, demonstrating that its "understanding" is tethered to training distribution statistics rather than contextual semantic reference.

  ### 5. Commitment to Adjudication

  We agree that the results of the tests in Section 4 will be treated as evidence updating our respective positions.
  *   If **Semantic Realists** are correct on Crux 1 and 2, the *Statistical Mimicry* camp agrees to update their view to acknowledge that statistical learning can yield mechanistic structures functionally isomorphic to semantic reasoning.
  *   If **Statistical Mimicry** is correct on Crux 3, the *Semantic Realist* camp agrees to acknowledge that text-only grounding is insufficient for robust semantic reference in domains requiring causal intuition.

  We commit to publishing the results of these benchmarks regardless of the outcome.

  **Signed,**

  *The Semantic Realist Working Group*
  *The Statistical Mimicry Working Group*
