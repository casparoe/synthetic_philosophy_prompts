answer: |-
  Your observation cuts to the very heart of criminal law theory, and it is a mark of your intellectual curiosity that you have identified what legal scholars have debated for centuries. The puzzle you describe, often called the act-omission distinction, does indeed rest on a specific understanding of causation, but it is crucial to recognize that the law's concept of causation is not purely physical or metaphysical. If we were speaking strictly in terms of physics or counterfactual logic, your intuition is correct: the outcome is identical, and in both scenarios, the death would not have occurred if the agent had behaved differently. In the language of philosophy, both the pusher and the bystander are necessary conditions for the death in their respective contexts. However, the law does not adopt a purely scientific view of causation; instead, it presupposes a normative theory of causation that is deeply intertwined with concepts of liberty, autonomy, and the expected course of events.

  To understand the theory of causation underlying the general rule, we must look to the work of legal philosophers like H.L.A. Hart and Tony Honoré, who argued that legal causation relies on the idea of an intervention in the normal course of things. Under this view, the world has a baseline or a status quo. When you push someone into the water, you are introducing a new, harmful force into the world; you are altering the baseline from a state of safety to a state of peril. Your action is seen as the cause because it explains the change. Conversely, when you stand by and watch someone drown, you are allowing the existing course of nature to take its place. In this framework, omissions are not viewed as causes in the same robust sense because they represent a failure to intervene in a process that was already underway, rather than the initiation of a new causal chain. The law presupposes that individuals are masters of their own actions but not guarantors of the world's safety. This distinction preserves a sphere of individual liberty where you are free to choose your own projects without being conscripted into the service of others. To punish the bystander is to claim a part of their time and agency for the benefit of a stranger, which the liberal tradition views as a significant infringement on freedom, whereas punishing the pusher merely restricts the freedom to harm.

  The exceptions you noted, such as parents starving children or lifeguards ignoring swimmers, are not inconsistencies in this theory but rather applications of it that involve a shifted baseline. In these cases, a specific duty exists that alters what counts as the normal course of events. For a parent, the expected baseline includes feeding the child; therefore, failing to feed is not merely allowing nature to take its course, but is an active deviation from the required norm. Similarly, a lifeguard has contractually assumed a role where intervention is the baseline expectation. When they fail to act, they are breaching a specific obligation that makes their omission legally equivalent to an act. Even the case of voluntary assumption, where someone starts a rescue and then quits, fits this model because by starting the rescue, the agent has induced reliance in the victim or others, thereby altering the situation from the original baseline. If you begin to throw a rope and then stop, you have actively worsened the victim's position relative to the moment you intervened, perhaps by discouraging others from helping. Thus, the law remains coherent if we understand that the distinction is not about the physical mechanics of causation, which remain constant, but about the normative expectations attached to the agent's relationship with the victim. The causation is the same, but the duty creates the liability.

  If we were to adopt the view that omissions are full-fledged causes on a par with actions, the law would undergo a radical transformation that would fundamentally alter the relationship between the citizen and the state. Such a system would likely impose a general duty to rescue, often referred to as a Bad Samaritan law, which is already present in some civil law jurisdictions like France and Germany. In this legal universe, the baseline expectation of human conduct would shift from non-interference to mutual aid. Every citizen would become an insurer of their neighbor's safety to the extent of their ability. While this might align better with a utilitarian moral philosophy that seeks to minimize harm regardless of the source, it would impose a heavy burden on individual liberty. It would require the law to adjudicate not just what you did, but why you did not do something else, forcing courts to evaluate the ease of rescue, the risk to the rescuer, and the moral worthiness of the victim in every case. This could lead to a surveillance state where inaction is scrutinized as closely as action, potentially chilling spontaneous human interaction and placing an infinite demand on individual time and resources.

  Ultimately, the law's current structure reflects a choice about the kind of society we wish to inhabit rather than a discovery of metaphysical truth about causation. It prioritizes negative rights, the right to be left alone, over positive rights, the right to be saved. This does not mean the law is incoherent, but rather that it is built on a moral foundation that distinguishes between doing harm and allowing harm, viewing the former as a violation of another's sovereignty and the latter as a tragedy that does not necessarily implicate the bystander's moral agency unless a special relationship exists. Your discomfort with this distinction is shared by many philosophers who argue that the moral difference between killing and letting die is negligible when the outcome and the ability to prevent it are identical. However, the law is not merely a system of morality; it is a system of governance that must balance moral ideals with practical liberty. By drawing the line at action, the law accepts that some preventable deaths are the price of a society that values individual autonomy above collective enforcement of benevolence. The exceptions serve as safety valves for those relationships where autonomy has already been voluntarily limited by duty, ensuring that the most vulnerable are protected without imposing a universal obligation of sainthood upon the populace.
