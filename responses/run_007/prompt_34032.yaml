answer: |-
  **The Smell of Inequality: *Parasite* and the Currency of Justice**

  Bong Joon-ho's *Parasite* is frequently described as a film about class struggle, but its specific horror lies in the impossibility of mobility. The Kim family does not merely lack money; they lack the standing to convert money into dignity. When they successfully infiltrate the Park household, their income rises, yet their social ontology remains fixed in the semi-basement. This dynamic offers a striking case study for the "equality-of-what" debate in political philosophy. This debate asks what metric a society should equalize to achieve justice: is it welfare (happiness or preference satisfaction), resources (income and goods), or capabilities (the substantive freedom to do and be)? While a resourcist account explains the Kims' material deprivation, and a welfarist account captures their resilience, the Capability Approach comes closest to diagnosing the injustice they suffer. However, *Parasite* ultimately challenges all three frameworks by revealing inequality not as a distributive problem to be solved, but as a relational and embodied reality that resists philosophical abstraction.

  To evaluate the Kims' plight through welfarism is to encounter the theory's most significant blind spot: the adaptation of preferences. Welfarism, rooted in utilitarianism, judges justice by the sum of happiness or preference satisfaction. Early in the film, the Kims are undeniably resourceful and often cheerful. They bond over folding pizza boxes, drink cheap beer, and revel in the cunning of their con. If justice were merely a matter of subjective well-being, the Kims would not appear profoundly unjustly treated until the violence of the third act. They have adapted to their deprivation, finding joy within the constraints of the *banjiha*.

  Here, the fit between theory and film fails catastrophically. As Amartya Sen has argued, welfarism ignores the "adaptation problem," where the oppressed lower their expectations to survive. *Parasite* visualizes this adaptation but frames it as tragic rather than justificatory. The Kims' cheerfulness is a survival mechanism, not evidence of justice. When Ki-woo dreams of buying the mansion to free his father, he is not expressing a preference satisfied by current conditions; he is acknowledging that his current welfare is contingent on a lie. A purely welfarist reading would understate the injustice because it cannot distinguish between happiness derived from freedom and happiness derived from delusion. The film insists that the Kims' situation is unjust even when they are laughing, suggesting that welfare is the wrong currency.

  If welfare is insufficient, perhaps the answer lies in resourcism, the view championed by theorists like John Rawls and Ronald Dworkin. Resourcism argues that justice requires the fair distribution of all-purpose means, primarily income and wealth. On the surface, the Kims' infiltration is a resourcist success story. They secure four incomes within the Park household. They eat better food, drink premium whiskey, and plan to invest. If the currency of justice is money, the plot of *Parasite* should resolve into stability once the checks start clearing.

  Yet the film demonstrates that resources are not neutral; they are socially coded. The Kims acquire the resources of the middle class but cannot access the *status* of the middle class. This is most visceral in the film's recurring motif of smell. Mr. Park never insults the Kims' competence; he insults their odor, the "smell of the semi-basement" that clings to them regardless of their employment. For a resourcist, smell is an externality, not a primary good. But for the Kims, the smell is a barrier more impermeable than a lack of cash. It marks them as a different species. When Mr. Park recoils from the smell of Mr. Kim while reaching for car keys, the transaction is not economic; it is existential. The resource metric misfires because it assumes that if you give people money, they can purchase any social good. *Parasite* shows that some goods—specifically, social respect and bodily integrity—are positional. They cannot be bought if the seller (the upper class) refuses to recognize the buyer as an equal. The Kims have the resources to cross the threshold, but they lack the social permission to do so without humiliation.

  This brings us to the Capability Approach, developed by Sen and Martha Nussbaum, which focuses on what individuals are actually able to do and to be. This framework seems the most robust for reading *Parasite*. The Kims lack the capability for "social bases of self-respect" and "bodily integrity." They are not free to move through the city without marking their class; they are not free to speak without calculating the risk of exposure. The injustice is not that they are unhappy (welfare) or poor (resources), but that their substantive freedoms are truncated by their social location.

  However, even the capability approach strains under the weight of the film's specific geography. Capabilities are often conceived as internal powers or opportunities provided by the state. In *Parasite*, the relevant capabilities are intensely relational and embodied. The capability to "appear respectable" is not something Ki-taek possesses; it is something Mr. Park grants or withholds. This highlights a tension in the Capability Approach: how to account for capabilities that are dependent on the attitudes of others. The smell is embodied—it is physically on Ki-taek's skin—yet it is socially constructed as a marker of inferiority. The film suggests that without changing the social structure (the "house"), individual capabilities remain positional. Ki-woo's final plan to earn money and buy the house acknowledges this; he knows he cannot simply *be* capable enough to enter the house as an equal; he must own the structure itself. Thus, while the Capability Approach best captures the *nature* of the deprivation (the loss of freedom to be), the film suggests that capabilities alone are insufficient if the social environment is hostile to their conversion into functioning.

  Furthermore, *Parasite* complicates the moral assumptions underlying all three philosophical positions. Egalitarian theories generally operate on a distributive model: there is a victim who lacks, and a structure (usually the state) that must give. This assumes a certain moral clarity. *Parasite* muddies this water. The Kims are not innocent victims; they are deceivers who manipulate a developmentally disabled man and fire a housekeeper to secure their gains. Conversely, the Parks are not individually cruel. Mrs. Park is naive, and Mr. Park is polite, adhering to a code of "nice because they are rich." They do not actively oppress the Kims; they simply ignore their humanity when it becomes inconvenient (such as during the flood, where Mr. Park worries about his son before the driver).

  This moral complexity resists the assumption that the Kims are simply victims of an unjust distribution. If justice were merely about redistributing resources, the Kims' deception would be a righteous reclamation. But the film portrays their actions as desperate and destructive, leading to bloodshed. The injustice is not just that the Kims have less; it is that the system pits them against the working-class housekeeper (Moon-gwang) rather than the owners. The philosophical debate often assumes a vertical relationship between the state and the citizen. *Parasite* reveals a horizontal violence among the poor fighting for scraps, enabled by a vertical indifference from the rich. A purely distributive framework struggles to account for this relational rot. It cannot easily diagnose why the Kims, upon gaining resources, do not lift others up but rather dig the hole deeper to protect their precarious perch.

  Ultimately, *Parasite* adds something to the equality-of-what debate that philosophical argument alone cannot provide: the sensory reality of inequality. Philosophy deals in concepts—utility, primary goods, functionings. Cinema deals in textures, sounds, and smells. The philosophical debate often abstracts the body; *Parasite* insists on it. The "smell" is the film's contribution to political theory. It represents a form of stigma that is neither purely material (it persists despite income) nor purely psychological (it is physically detectable). It is a somatic marker of class.

  Moreover, the film's spatial architecture challenges the flatness of distributive justice. Philosophical models often imagine equality as a horizontal leveling. *Parasite* presents inequality as vertical. The semi-basement is half-underground; the mansion is on a hill. During the flood, the Kims descend further into the sewage, while the Parks look out over the rain as a aesthetic backdrop. This verticality suggests that inequality is not just about having less, but about being *below*. It is about gravity. No amount of resource redistribution in the moment can change the fact that the Kims live in a space that floods while the Parks live in a space that overlooks.

  In conclusion, while the Capability Approach offers the most nuanced vocabulary for understanding the Kims' lack of freedom and dignity, *Parasite* exposes the limits of viewing justice solely through the lens of "equality of what." The film suggests that the currency of justice is not just welfare, resources, or capabilities, but recognition and spatial standing. The Kims' tragedy is that they possess the capabilities of the middle class but inhabit the body of the underclass. By forcing the audience to viscerally experience the smell of the semi-basement and the vertigo of the stairs, *Parasite* argues that inequality is not a puzzle to be solved by finding the right metric. It is a structural condition that distorts human relationships until violence becomes the only language left. Philosophy can define the lack, but only the film can make us feel the weight of it.
