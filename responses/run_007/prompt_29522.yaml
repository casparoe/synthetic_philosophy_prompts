answer: |-
  This phenomenon is formally known as **teleonomy** in biology and **latent function** or **invisible hand explanation** in social systems, both of which rely on **etiological functional explanations** where a trait's purpose is defined by the historical consequences that caused its retention rather than by any conscious intent.

  The explanatory work is real because the "rationale" is not a mental state but a causal history of selection. In biology, natural selection acts as a filter where traits causing higher reproductive success are retained; in organizations, market pressures or internal efficiency metrics act as the filter where rules yielding survival or profit are kept. The "who decided" question is answered by the process itself: the environment selected for the trait because of the consequence, making the consequence the cause of the trait's current presence. This differs from **teleology**, which implies a conscious designer or future goal pulling the present, whereas teleonomy is backward-looking, grounded in past replication success. It also differs from ordinary **functional description** (stating what a trait does) because it claims the function *explains the existence* of the trait, not just its current operation.

  To distinguish a legitimate teleonomic explanation from a made-up "just-so story," you must verify the causal loop between the benefit and the retention. A legitimate explanation requires evidence that the specific benefit cited was actually the pressure that selected for the trait historically. In biology, this means showing heritability, variation, and differential reproductive success linked to the trait (e.g., peacocks with larger tails actually mating more, not just assuming they do). In social systems, it requires evidence that rules producing the rationale survived while competing rules did not. A made-up story assumes that because a trait *is* beneficial now, it *arose* for that reason, ignoring spandrels (byproducts), drift, or historical constraint. The edge case is **adaptationism**: the error of assuming every trait is an optimal solution to a problem, rather than sometimes being a lucky accident or a compromise that merely survived. Legitimate teleonomy proves the benefit drove the survival; illegitimate teleology merely observes the benefit and invents a history.
