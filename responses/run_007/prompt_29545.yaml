          *   Also tension between **Verdict 2** and **Verdict 4**. If non-empirical virtues count (ST), why do empirical nulls hurt so much? Because nulls attack the *bridge* between the theory and the low-energy world.
      *   **Step 3: Proposing the Principle.**
