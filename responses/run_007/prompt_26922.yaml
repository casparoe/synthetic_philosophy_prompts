answer: |-
  1.  **On Ontological Profligacy and Innocence**
      "Your view commits you to the existence of objects that strike many as absurd—for instance, a single object composed of the Eiffel Tower and the tip of my nose. Critics argue this violates principles of ontological parsimony. You likely endorse the standard universalist defense that such fusions are an 'ontological free lunch,' meaning the whole is nothing *over and above* the parts, so counting the whole adds no ontological weight. My question is: even if we grant that the *ontology* isn't bloated, doesn't universalism significantly bloat our *ideology*? If we must acknowledge a distinct fact of composition for every arbitrary plurality, aren't we multiplying the structural complexity of reality even if we aren't multiplying entities?"

  2.  **Follow-up to Q1 (Keyed to the 'Nothing Over and Above' reply)**
      "If you reply that the structural complexity is also illusory because the composition relation is internal or trivial, does this not risk collapsing the distinction between the many parts and the one whole entirely? If the sum is truly *nothing over and above* the parts in a robust sense, why do we need the vocabulary of 'composition' at all, rather than simply plural quantification? What theoretical work is the mereological sum doing that the pluralities themselves cannot do?"

  3.  **On the Argument from Vagueness**
      "Let's turn to the Argument from Vagueness. You rely on the premise that existence cannot be vague; since restricted composition would entail borderline cases of existence, composition must be unrestricted. However, critics suggest this argument proves too much. If we accept that existence is precise, does this not force you to treat *all* vagueness as merely semantic or epistemic? Specifically, does your commitment to precise existence commit you to epistemicism regarding sorites series for ordinary predicates like 'is a heap' or 'is bald,' given that these objects exist?"

  4.  **Follow-up to Q3 (Keyed to the 'Existence is Precise' reply)**
      "Suppose you accept that commitment and argue that vagueness is indeed purely linguistic. Does this not create a disconnect between our metaphysical picture and the phenomenology of indeterminacy? If reality is perfectly sharp down to the atomic level, but our language is hopelessly vague, on what grounds do we claim our metaphysical theory is *explaining* the world rather than simply replacing it with a precise model that ignores the genuine indeterminacy we experience in macroscopic boundaries?"

  5.  **On Answering vs. Dissolving the SCQ**
      "The Special Composition Question asks *when* composition occurs. By answering 'always,' you seem to some critics to be changing the subject or dissolving the question rather than answering it. If composition is unrestricted, the concept loses its discriminatory power. Does universalism not render the concept of 'composition' trivial, such that it can no longer distinguish between a genuine unified object and a mere collection, thereby failing to capture the intuition that drove the SCQ in the first place?"

  6.  **Follow-up to Q5 (Keyed to the 'It is a Genuine Answer' reply)**
      "If you maintain that 'always' is a substantive answer, what then explains the obvious difference in causal and functional unity between a living organism and a scattered 'trout-turkey'? If composition itself doesn't track unity, must you posit a *second* relation—say, 'fusion' versus 'unity'—to do the explanatory work? And if so, isn't that second relation doing all the work that restrictivists thought composition was doing, rendering your unrestricted composition metaphysically idle?"

  7.  **On Modal Profiles and Essentialism**
      "Standard mereology combined with universalism often leads to mereological essentialism: an object cannot gain or lose parts without going out of existence. This implies that I cease to exist if I lose a single cell. How do you reconcile this rigid modal profile with our robust intuitions about persistence through change? Are you prepared to say that the object I call 'myself' is merely a temporal stage, or do you bite the bullet that the sum of my parts is essential to me?"

  8.  **On Reference and Linguistic Access**
      "If there are infinitely many overlapping objects located exactly where this table is, how does our language successfully refer to the table rather than the countless gerrymandered fusions that share its location? If reference is determined by causal history or descriptive fit, it seems underdetermined which of these co-located universalist objects we are talking about. Do you need to adopt a Carnapian view where we simply stipulate which objects exist in a linguistic framework, and if so, doesn't that make the truth of universalism framework-relative rather than metaphysically absolute?"

  9.  **On Defeasibility**
      "Finally, a question on the limits of your commitment. Universalism is often defended as the 'least bad' option in a dialectical standoff. What specific piece of evidence, theoretical cost, or intuitive counter-example would be severe enough to make you abandon universalism? Is there any possible world or metaphysical consideration that would convince you that composition is, in fact, restricted, or is the view held as a necessary truth insulated from empirical or intuitive revision?"
