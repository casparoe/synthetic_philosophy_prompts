      *   *Claim 2: Democratic Legitimacy.* Values require democratic consensus; beliefs require epistemic efficiency (markets).
      *   *Claim 3: Market Function.* Betting resolves uncertainty about causal relationships (policy $\to$ outcome).
      *   *Claim 4: Metric Stability.* The metric itself is fixed and not subject to the same empirical uncertainties as policies.
      *   *Claim 5: Incentive Alignment.* Betting incentivizes truth-seeking, voting incentivizes preference expression.

  4.  **Developing the Claims & Evaluations:**

      *   *Claim A: The Fact/Value Distinction is Operationally Clean.*
          *   *Meaning:* We can agree on a number (GDP, happiness index) without needing to predict how policies affect the *measurement* of that number.
          *   *Status:* Controversial/False (Goodhart's Law).
