      *   *Claim D: Democratic Legitimacy Applies Only to Ends, Not Means.*
          *   *Meaning:* It's undemocratic to let markets decide goals, but efficient to let them decide means.
          *   *Status:* Controversial (Technocracy vs. Democracy debate).
          *   *Relevance:* Sidesteps the epistemic objection, focuses on political philosophy.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the slogan's origin (Hanson) and the user's insight (it's a compression of complex assumptions).
      *   **Deconstruction (The Core Task):** Break down into 3-4 specific claims.
