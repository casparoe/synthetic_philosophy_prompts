answer: |-
  The session must be structured as an epistemic puzzle about inference from actions before it is introduced as a market model, ensuring the logical impossibility of speculative trade is derived from the structure of knowledge rather than market frictions.

  This ordering is critical because economists will instinctively look for frictions (transaction costs, liquidity) to explain trade, while philosophers will grasp the epistemic constraints but may miss the economic necessity of ex ante efficiency; by front-loading the logic of inference, you force both groups to accept the counterfactual baseline before introducing the market context.

  **Explanatory Arc and Dependencies**

  1.  **Epistemic Foundations (0–20 minutes):**
      *   Define information partitions and priors using a simple state-space diagram without yet mentioning trade.
      *   **Establish Common Priors vs. Common Knowledge here:** Explicitly distinguish that agents can have different *information* (partitions) but must share the same *probability measure* over states. This heads off the misconception that common priors means everyone has the same information.
      *   Show how Bayesian updating works within partitions.

  2.  **The Carrying Example (20–50 minutes):**
      *   **Replace the Lemons Example:** Do not use Akerlof's used-car market. Lemons relies on private values and hidden characteristics, whereas Milgrom–Stokey concerns common-value speculation where gains must come from another agent's loss.
      *   **Use a Binary Betting Market:** Two agents bet on a binary event (e.g., "Will it rain?"). They hold an initial endowment of cash. They receive private signals about the event.
      *   **What it must have:** Risk neutrality, common prior on the event probability, clear signal structure, and an initial allocation that is **ex ante Pareto efficient** (establish this at minute 30 before any trade is proposed). If the initial allocation is not efficient, trade is possible for insurance reasons, confounding the speculative logic.
      *   **What it must lack:** Liquidity shocks, hedging motives, or differences in priors.

  3.  **The Logic of the Offer (50–70 minutes):**
      *   Introduce the trading mechanism: Agent A offers to sell a bet to Agent B.
      *   **Move to 'Offer as Information' here:** This step depends entirely on the prior establishment of rationality and common priors. If A offers to sell, B must infer that A's private signal indicates the bet is unfavorable for B.
      *   Walk through the iterative elimination: B updates on the offer, realizes the expected value is non-positive, and rejects. A anticipates this rejection and never makes the offer.

  4.  **Implications and Misconceptions (70–80 minutes):**
      *   Address the misconception that the theorem predicts no trade in real markets. Clarify that real trade is driven by hedging, liquidity, or differing priors, not pure speculation on common values.
      *   Address the misconception that private information is a legitimate source of speculative gains. Show that under common priors, private information is "priced in" by the mere willingness to trade.

  5.  **Final Task (80–90 minutes):**
      *   Present a modified scenario where trade *does* occur despite common priors and rational agents (e.g., introduce a forced liquidity need for one agent).
      *   **Task:** Ask students to identify exactly which assumption of the Milgrom–Stokey framework was violated to allow trade, and explain why that specific violation breaks the "offer as information" loop. This tests whether they understand the necessary conditions rather than just the conclusion.

  **Expected Misconceptions and Interventions**

  *   **"Common priors means everyone has the same information."**
      *   *Head off:* During Phase 1 (Epistemic Foundations). Use the partition diagram to show disjoint information sets overlapping the same probability measure.
  *   **"Private information allows speculative gains."**
      *   *Head off:* During Phase 3 (Logic of the Offer). When a student argues "I know something you don't," respond with "But I know you know something, and I know you wouldn't offer unless it benefited you."
  *   **"The theorem predicts real markets should show no trade."**
      *   *Head off:* During Phase 4 (Implications). Explicitly list the escape hatches (hedging, liquidity, heterogeneous priors) and label them as the primary drivers of actual volume.

  **What to Leave Out**

  *   **The State-Space Proof:** Do not walk through the formal induction or measure-theoretic proof; it consumes time without adding epistemological clarity for this audience.
  *   **Aumann's Agreement Theorem:** Do not derive the relationship or prove the connection; merely mention it as a sibling result if asked, as it distracts from the trading mechanism.
  *   **p-Belief Systems:** Postpone this technical refinement; it is unnecessary for the core intuition of common knowledge of rationality.
  *   **Dynamic Extensions:** Keep the model static; introducing multiple rounds of trading complicates the "offer as information" signal without changing the fundamental result.
