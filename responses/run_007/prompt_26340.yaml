      *   **Diagnosis 3: Theory-Laden Intuitions:**
          *   Fink cases aren't neutral data. They presuppose a view of intrinsic properties.
          *   Lewis's "intrinsic basis" begs the question against those who think dispositions *are* the basis.
      *   **What Each Side Needs:**
          *   Conditionalists: Need to show the conditional captures the *causal power* without positing power.
          *   Dispositionalists: Need to show the power is distinct from the regularity.
      *   **What Counts as Progress?**
