      *   **The Philosophical Heart:** **Reflective Endorsement.** A corrigible agent must not endorse its own current goal as the final arbiter of value. It must endorse the *process* of correction. This violates the standard EUM assumption that $U$ is fixed and known.
      *   **What Moves the Debate Forward?**
          *   Stop looking for $U'$.
          *   Look at **Uncertainty over Rewards** (CIRL) but push it further (normative uncertainty).
