      *   Closing: Encouragement.

  8.  **Review against Constraints:**
      *   British English? (Yes, watch for 'z' vs 's', 'colour', etc.)
      *   No bullet points? (Yes.)
      *   No headings? (Yes.)
      *   Normal paragraphs? (Yes.)
      *   Letter style? (Yes.)

  9.  **Final Polish:** Ensure the transition between the wire example and the character example is smooth. Make sure the distinction between fink and mask is clear in the context of the character. (Fink = she loses kindness when needed. Mask = she has kindness but can't show it).

      *Self-Correction on British English:* Ensure I don't slip into Americanisms. "Realise" not "realize", "behaviour" not "behavior", "colour" not "color". Use "whilst" or "while" appropriately. Keep the tone polite and slightly understated.

      *Self-Correction on Philosophy:* Be careful not to get too technical. Keep it grounded in the user's examples. The "causal basis" idea is the key without needing the jargon.

      *Addressing the Sorcerer:* The user says the glass is fragile *until* the strike. This implies the disposition is time-indexed. The built-in cutoff wire is *never* live. This is consistent. The wire lacks the basis *now*. The glass has the basis *now*.

      *Addressing the Character:* The others blocking her is external. That's a mask. So she is kind. This is the hopeful/tragic reading.

