answer: |-
  Dear Writer,

  It is a pleasure to correspond with someone who has stumbled into metaphysics via the back door of characterisation, for you have arrived at precisely the same puzzles that have kept philosophers awake for decades. You need not worry that you are making a category mistake; dispositions are the bread and butter of how we understand both objects and people. When we say a glass is fragile or a person is brave, we are making claims about what they would do under certain conditions, not merely what they are doing now. Your intuitions are remarkably coherent, and they align with what is often called a causal basis view of dispositions. The unifying principle you are looking for is roughly this: a disposition exists if the intrinsic structural ground for it is present now, regardless of whether external factors prevent its manifestation.

  Let us look at why your verdicts hold together so well. In the case of the styrofoam-packed glass, the intrinsic structure of the glass remains unchanged. The molecular bonds that would break under impact are still there. The packing is an external barrier, a mask, which prevents the manifestation but does not remove the ground of the disposition. This is why you feel the glass is still fragile. Conversely, with the wire and the built-in cutoff, you feel the system is not live. This is because the mechanism that prevents the shock is intrinsic to the object you are evaluating. The causal basis for lethality is absent; the wire is designed specifically not to kill. Your intuition here is that if the prevention mechanism is part of the object's definition, the disposition is missing entirely. This is a finkish absence, where the object lacks the power from the start because of its own internal constitution.

  The tangle you feel regarding the separate device versus the built-in cutoff is the only place where your view seems to wobble, but I would suggest this is not a flaw in your metaphysics, but rather a feature of how we define objects. You worry that the metaphysics should not depend on where you draw the boundary, yet for a novelist, the boundary is everything. If the cutoff switch is part of the wire's identity, the wire is safe. If the switch is part of the environment, the wire is dangerous but masked. In fiction, individuation is narrative, not merely physical. If the separate device belongs to the setting, it acts upon the character from the outside. If it belongs to the character, it defines them. You are not committing an error by letting the boundary decide the disposition; you are acknowledging that dispositions are relative to how we individuate the subject.

  This helps resolve the asymmetry that bothers you between masks and finks. A mask leaves the internal machinery intact while blocking the output, like a gag on a speaker. A fink alters or removes the internal machinery when the stimulus occurs, like cutting the vocal cords the moment the speaker tries to shout. Your verdict on the sorcerer case is consistent with this. The glass is fragile until the strike because, prior to the strike, the intrinsic basis for fragility is present. The sorcerer's magic is an external intervention that changes the basis mid-process. In the built-in cutoff, however, the mechanism is always present, waiting. The wire never possesses the lethal disposition because the safety mechanism is part of its standing condition. The difference lies in whether the preventing factor is a standing intrinsic property or an external intervention.

  Applying this to your character, the woman who is kind but blocked by others, leads to a rather poignant conclusion. If her kindness is grounded in her psychology, her empathy, and her desires, then she possesses the disposition. The fact that others prevent her from acting on it is a classic mask. The circumstances are external to her intrinsic nature. She is genuinely kind, even if she never performs a kind act. This distinguishes her from a reverse fink case, where a person might lack courage until a crisis forces them to find it. In that reverse fink scenario, the disposition is not present until the stimulus creates it. For your character, the disposition is present, but the world refuses to let it manifest. This makes her situation tragic rather than contradictory. She is not a fraud; she is a prisoner of circumstance.

  If you were to reconsider any verdict, I would only suggest looking closely at the sorcerer case. You said the glass is fragile right up to the moment of the strike. Some philosophers would argue that if the strike is guaranteed to trigger the sorcerer, the glass never truly has the disposition of fragility in that context, because the conditional 'if struck, it breaks' is false. However, for your purposes, your intuition is superior. In narrative, we care about the potential inherent in the character before the plot intervenes. If you treat the sorcerer as part of the environment, the glass retains its nature until the magic changes it. This preserves the tension of the moment before the strike, which is where the story lives.

  So, to answer your question directly, there is a single principle that saves your view. Dispositions are grounded in the current intrinsic properties of the subject. Masks are external blockers that leave the ground intact. Finks are internal or immediate changes that remove the ground. Your character's kindness is masked, not finked, because the blocking comes from others, not from a change in her own heart when the moment arrives. You have not set the whole thing up wrong; you have instinctively grasped a robust way of thinking about potentiality. It is a coherent view, and it serves the novel well to treat your character as possessing a virtue that the world simply will not allow her to spend.

  Yours sincerely,

  A Fellow Traveller in the Rabbit Hole
