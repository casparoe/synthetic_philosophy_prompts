      *   "Hope nobody asks"? Yes.

  8.  **Final Polish:** Check the Davidsonian terminology (holism, triangulation, constitutive, transcendental). Ensure the distinction between *methodological* and *constitutive* is clear in every answer. (Self-Correction: Make sure the Lewis/Stalnaker objection specifically mentions "common ground" or "context sets" to show I know their lingo).

