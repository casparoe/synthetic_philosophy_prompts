answer: |-
  This is a brilliant observation, and you've put your finger on a genuine epistemological itch that bothers philosophers of mind, memory theorists, and historians alike. You are describing a structural error in how we infer the past from the present.

  To answer your question directly: there is no single, universally recognised Latin tag for this specific move (like *ad hominem* or *post hoc*). However, it is a well-documented problem that goes by a few different names depending on which corner of the library you're standing in.

  Here is how the literature carves it up, along with a suggestion for what you might call it on your blog.

  ### 1. The Historical Heavyweight: The Psychologist's Fallacy
  The closest established name comes from William James. In *The Principles of Psychology* (1890), he coined **"The Psychologist's Fallacy."**

  James defined it as the confusion of the observer's standpoint with that of the mental fact being reported. Usually, this means a psychologist assuming their analysis of a mental state is the same as the mental state itself. However, your example is a temporal variant of this: you are confusing the *current* standpoint (the waking report) with the *past* mental fact (the sleeping experience).

  James wrote:
  > "The great snare of the psychologist is the confusion of his own standpoint with that of the mental fact about which he is making his report."

  In your pub argument, your mate is treating his current waking standpoint (where the memory is vivid, structured, and emotional) as if it were the standpoint of the sleeping self. He is projecting the properties of the *investigation* onto the *object investigated*.

  ### 2. The General Semantics Label: Map-Territory Confusion
  If you want something punchier for a blog, the Alfred Korzybski maxim **"The map is not the territory"** is the most accessible fit.

  Your mate is treating the map (the memory report) as if it possesses the features of the territory (the actual dream event). Just because a map has a fold in it (a gap in memory) or is drawn in bright red ink (high emotional vividness), it doesn't mean the territory had a fold or was red. This is often discussed in cognitive science as a failure of **Source Monitoring**. The brain fails to tag the information as "constructed now" rather than "recorded then."

  ### 3. The Logical Category: Reification
  In strict logical terms, this is a form of **Reification** (or the Fallacy of Misplaced Concreteness).

  Reification occurs when an abstraction (a report, a memory, a model) is treated as if it were a concrete, physical event. By arguing that the *narrative structure of the report* proves the *narrative structure of the experience*, your mate is turning the story into the event. He is treating the *representation* as the *referent*.

  ### 4. The Consciousness Studies Context: Narrative Gravity
  Since your argument was specifically about dreams, you have stumbled directly into the wheelhouse of Daniel Dennett. In *Consciousness Explained*, Dennett argues against the "Cartesian Theatre" (the idea that there's a little man inside watching a screen of your life).

  Dennett suggests that what we think of as a unified conscious experience is often a result of **"Narrative Gravity."** The brain cobbles together disparate fragments into a coherent story *after the fact* to make sense of inputs. When your mate says, "The dream had a plot," Dennett would say: "The *report* has a plot. The neural events may have been chaotic and fragmented."

  Assuming the report's coherence proves the experience's coherence is sometimes called **The Fallacy of the Official Story**.

  ### Distinguishing it from Related Concepts

  You asked how to distinguish this from circularity, the homunculus fallacy, and transparency. Here is the breakdown:

  **Vs. Circular Reasoning (Begging the Question)**
  Circularity is when the conclusion is assumed in the premise (e.g., "Dreams are real because I experienced them, and I know I experienced them because they are real").
  Your mate isn't quite doing that. He is offering evidence (vividness, emotion). The error isn't that he's assuming the conclusion, but that the evidence he's offering is *causally disconnected* from the claim. He is inferring the cause (the dream) from the effect (the memory) while assuming the effect perfectly mirrors the cause. It's more of a **Non Sequitur** than a circle.

  **Vs. The Homunculus Fallacy**
  The homunculus fallacy involves explaining a phenomenon by positing a little agent inside who does the thing (e.g., "I see things because a little man in my brain looks at images").
  Your mate isn't positing an agent. He's positing a fidelity of transmission. He assumes the transmission from sleep to wakefulness is lossless. It's an error about *data integrity*, not agency.

  **Vs. The Transparency of Experience**
  The transparency thesis (often associated with Gilbert Ryle or later analytic philosophy) suggests that when we try to introspect, we "look through" our experience to the world. We see the tree, not our *seeing* of the tree.
  Your point is slightly different. You are arguing that the *introspection itself* is being mistaken for the *past event*. It's not that he's looking through the experience; it's that he's looking at a photograph of the experience and claiming the photograph *is* the landscape.

  ### A Proposal for Your Blog

  Since there isn't one perfect Latin name, and "Psychologist's Fallacy" is a bit clunky for a casual read, you might consider coining a descriptive term that captures the temporal aspect.

  **"The Retrospective Projection Fallacy"**
  This captures the essence: projecting the properties of the present recollection back onto the past event.

  **"The Archive Fallacy"**
  This treats the memory like a filed document. Just because the file is detailed doesn't mean the event was.

  **"The Fidelity Assumption"**
  This assumes the recording mechanism (memory) has perfect fidelity to the source (experience).

  ### My Recommendation

  If I were writing this up, I would lead with **The Psychologist's Fallacy** (to show you've done the reading) but explain it as a **Map-Territory Confusion** applied to time.

  You can frame it like this:
  > "My mate was committing a temporal version of William James's Psychologist's Fallacy. He was confusing the standpoint of the narrator (him, now, in the pub) with the standpoint of the protagonist (him, then, in the dream). He was treating the properties of the biography as if they were properties of the life."

  It is a sharp point you've made. In epistemology, this is the difference between **Preservationism** (memory preserves the past) and **Generativism** (memory generates a new representation). Your mate is a naive Preservationist; you are arguing for Generativism.

  Good luck with the blog. And next time you're at the pub, tell him Dennett says he's wrong. That usually settles it.
