      Your diagnosis is substantially correct: the debate stalls because it conflates **ontological** disagreements about the nature of price with **technical** disagreements about computation and incentives. However, it is more precise to say the sides are modeling different phenomena: the Austrians model the market as a *dynamic discovery procedure*, while Lange models socialism as a *static allocation problem*.

      Mises's argument was institutional and *a priori*. He argued that without private property in capital goods, there is no genuine exchange, and without exchange, there are no prices. For Mises, a price is not merely a ratio; it is a historical fact of settlement between owners risking their own assets. Lange's model bypasses this by treating prices as accounting indices. He conceded Mises's point on exchange but argued a Central Planning Board (CPB) could simulate prices via trial and error. This answers a neoclassical equilibrium question (can we find the clearing price?) but ignores Mises's institutional question (does this index reflect real scarcity preferences?).

      Hayek deepened this by shifting from property to epistemology. He argued that the data required for Lange's equations are not "given" but dispersed and tacit. For Hayek, the market doesn't just solve equations; it generates knowledge through competition. Lange's response relied on the assumption that local managers could and would report true cost functions to the CPB. Here, the debate shifts to incentives. As Don Lavoie noted, Lange assumes managers follow rules; Austrians assume agents maximize utility, which under socialism means gaming the system rather than optimizing production.

      Therefore, the disagreement is tripartite:
      1.  **Ontological:** Is price an emergent signal of property exchange (Mises) or a scarcity index computable by optimization (Lange)?
      2.  **Epistemic:** Is knowledge static and reportable (Lange) or dynamic and tacit (Hayek)?
      3.  **Methodological:** Is the burden of proof on demonstrating logical possibility (Lange) or practical feasibility without property rights (Mises)?

      What counts as progress? A formal result is unlikely to settle this because Lange already demonstrated logical possibility within neoclassical constraints. An empirical test is confounded because no pure socialist economy has existed without authoritarian politics, and no pure market economy exists without state intervention.

      Progress requires a **conceptual dissolution**. We must acknowledge that Lange solved the problem of *allocative efficiency under given preferences*, while Hayek addressed *adaptive efficiency under changing preferences*. Modern algorithmic planning revives the Langean project by claiming Big Data solves the epistemic problem. The counter-argument is not computational power but the *creation* of new preferences and technologies, which cannot be data-mined from the past.

      The honest answer is that the debate should stop pretending to be singular. Austrians should concede that planning can theoretically clear markets in a static model. Planners should concede that without property rights, the incentives for innovation and truthful revelation remain unresolved. Progress lies in shifting the question from "Can planning calculate?" to "Can planning innovate?" If planners can demonstrate a system that generates technological progress without private residual claimancy, they win. If not, the Austrian critique stands—not on calculation, but on discovery. Until that distinction is standardized, the debate will remain a dialogue of the deaf.

