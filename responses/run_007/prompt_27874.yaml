prompt: |-
  I run a monthly rationality dojo — a meetup of about 15 people, mostly software engineers and grad students who read LessWrong and have done the CFAR handbook exercises. We meet for two hours. Next month's topic is akrasia, and I want to go beyond the usual discussion of commitment mechanisms and Beeminder tricks. I want to design an in-class activity that makes participants viscerally feel the structure of hyperbolic discounting: the way your present self and your future self can want incompatible things, not because you're weak or irrational in some simple sense, but because the discount function itself generates preference reversals as the smaller-sooner reward approaches.

  Here's what I'm picturing. The activity should involve real choices with real (small) stakes — nothing cruel, but enough that people care about the outcome. Ideally, participants should make a series of choices at different time horizons, and then, as time passes within the session itself, some of them should find themselves wanting to reverse their earlier decisions. The point isn't to embarrass anyone; it's to give them the felt experience of being the agent who sincerely prefers A to B at t₁ and then sincerely prefers B to A at t₂, with no new information and no change in the rewards themselves. Then a debrief that connects what happened to the shape of the hyperbolic discount curve, the Ainslie-Rachlin model, and the puzzle of which preference should be treated as authoritative — the one held from a distance, or the one held up close.

  What I need from you: a concrete, runnable design. Give me the rules, the timeline within a two-hour window, the payoff structure (it can use small amounts of real money, snacks, or points that convert to something), and a detailed debrief script that maps specific moments in the activity onto the formal structure of hyperbolic discounting and preference reversal. Also tell me what will predictably go wrong the first time I run it — which parts of the experience the activity can't reproduce (e.g., the discounting happens over minutes rather than weeks, which might change the phenomenology) and how to handle that in the debrief. Throughout, I'd like you to indicate how confident you are in each major design choice, and to single out the element of the design you're least sure about, with a brief explanation of why.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Monthly rationality dojo, ~15 people (SEs/grad students, LW/CFAR background), 2 hours.
      *   **Topic:** Akrasia, specifically hyperbolic discounting and preference reversal.
      *   **Goal:** Move beyond commitment devices/Beeminder. Create a *visceral* experience of preference reversal within the session.
      *   **Requirements:** Concrete runnable design (rules, timeline, payoffs), detailed debrief script mapping to theory (Ainslie-Rachlin), prediction of failure modes/limitations, confidence ratings on design choices, identification of the least certain element.
      *   **Constraints:** Real stakes (small), no cruelty/embarrassment, 2-hour window.

  2.  **Deconstruct the Core Challenge:**
      *   *Hyperbolic Discounting:* $V = \frac{A}{1 + kD}$. Value drops sharply as delay ($D$) approaches 0.
      *   *Preference Reversal:* At $t_1$ (far from reward), prefer Larger-Later (LL). At $t_2$ (close to reward), prefer Smaller-Sooner (SS).
      *   *The Problem:* Real hyperbolic discounting usually happens over days/weeks. Compressing this into 2 hours risks feeling artificial or "gamey." If the delay is 10 minutes vs. 20 minutes, does it *feel* like akrasia? Or just impatience?
      *   *The Solution:* We need to simulate the *structure* of the reversal while acknowledging the time compression. We need multiple rounds to allow for learning and observation of the curve. We need a mechanism where the "Future Self" makes a plan and the "Present Self" executes (or revokes) it.

  3.  **Brainstorming Activity Mechanics:**
      *   *Idea 1: Food.* Choose candy now vs. better candy later. (Too simple, hard to scale stakes).
      *   *Idea 2: Money.* $5 in 10 mins vs. $8 in 30 mins. (Good, but waiting 30 mins in a 2-hour session is costly).
      *   *Idea 3: Effort/Discomfort.* Do a boring task now for a reward, or later for a bigger reward. (Captures "work" aspect of akrasia).
      *   *Idea 4: The "Ulysses Contract" Simulation.* Participants make choices for their future selves, then become that future self.
      *   *Selected Approach:* A multi-round "Intertemporal Choice Game" using real money/points. It needs to be fast enough to show the curve but slow enough to feel the tension. Let's use a "Choice Phase" and an "Execution Phase" separated by a distracting filler task.

  4.  **Developing the Design (Iterative Process):**
      *   *Timeline:* 2 hours.
          *   Intro (15m)
          *   Round 1 (Planning) (15m)
          *   Filler/Distraction (20m) - *Crucial for making "now" feel different from "then".*
          *   Round 1 (Execution) (15m)
          *   Round 2 (Variation) (20m)
          *   Debrief (35m)
      *   *Stakes:* Real money is best for rationalists. $5-$20 range. Or charity donation. Let's use cash + a "grand prize" raffle to keep variance low but interest high.
      *   *The Reversal Mechanism:*
          *   T0: Choose between $10 in 45 mins (LL) or $5 in 15 mins (SS).
          *   T1 (15 mins later): The SS option is now "Immediate." The LL option is "30 mins away." Do you switch?
          *   *Wait, this is hard to enforce.* If they take the $5, they leave the game.
          *   *Better:* Use a "Token" system. You earn tokens now, redeem later. Or, make the choice binding *unless* you pay a penalty to switch.
          *   *Best for Visceral Feel:* Allow the switch. The point is to *observe* the switch.
          *   *Refined Mechanism:* "The Commitment Market."
              *   Phase 1 (Cold State): Choose between Reward A (Small, Soon) and Reward B (Large, Later).
              *   Interlude: Do something engaging (discussion, puzzle) to make time pass.
              *   Phase 2 (Hot State): The "Soon" reward is now available *immediately*. The "Later" reward is still delayed. Can you stick to Phase 1?
      *   *Wait, one session isn't enough.* We need to show the *curve*.
      *   *Revised Mechanism:* Three Rounds of choices with varying delays.
          *   Round 1: $5 now vs $10 in 40 mins.
          *   Round 2: $5 in 20 mins vs $10 in 60 mins.
          *   Round 3: $5 in 40 mins vs $10 in 80 mins.
          *   *Problem:* We can't wait 80 mins.
      *   *Solution:* Use "End of Session" vs "Middle of Session" vs "Take Home".
          *   Option S: $5 cash at break (20 mins).
          *   Option L: $12 cash at end of session (90 mins).
          *   Option XL: $20 gift card mailed next week.
      *   *Actually, let's look at the "Preference Reversal" specifically.*
      *   *Design:* The "Two-Self Contract."
          *   Part 1: Participants write a contract for their future self. "I will choose the Large Reward at time T." They can lock it in (commitment) or leave it open.
          *   Part 2: Time passes. They are offered the Small Reward now.
          *   Part 3: End of session, payout.
      *   *Let's go with a specific, tested structure:* **The Intertemporal Auction.**
      *   *Wait, simpler is better for a dojo.* Let's do **"The Waiting Game."**
      *   *Structure:*
          1.  **Planning Phase (T-60):** Choose between $10 at Break (T-30) or $25 at End (T+0).
          2.  **Distraction:** Rationality exercise (unrelated).
          3.  **Checkpoint 1 (T-30):** Those who chose Break get $10. Those who chose End are offered a chance to switch to $10 *now* or keep waiting for $25.
          4.  **End (T+0):** Payout.
      *   *Critique:* If they switch, they get $10. If they wait, they get $25. The reversal is switching from "Wait for 25" to "Take 10".
      *   *Refinement:* To make it visceral, the "Now" reward needs to be tangible. Cash on the table.
      *   *Stakes:* $10 vs $25 is significant enough.
      *   *Confidence:* High on structure, Medium on emotional impact (is 30 mins enough?).

  5.  **Drafting the Content:**
      *   **Title:** "The Curve of Now."
      *   **Materials:** Envelopes, cash, timer, whiteboard.
      *   **Timeline:**
          *   0:00-0:15: Intro & Theory (Brief).
          *   0:15-0:30: Round 1 (Long Horizon Choice).
          *   0:30-1:15: Filler Activity (Crucial: must be engaging enough to make "now" feel distinct).
          *   1:15-1:30: Round 1 (Re-evaluation/Execution).
          *   1:30-1:45: Round 2 (Immediate Horizon Choice - Control).
          *   1:45-2:00: Debrief.
      *   **Payoff:** Real cash. $15 vs $40. (Need to ensure budget is okay). Let's suggest $10 vs $30 to keep it manageable for the host.
      *   **Debrief:** Connect to $V = A / (1+kD)$. Discuss "Which self is real?"
      *   **Failure Modes:** Time compression (30 mins isn't 30 days). Social pressure (not wanting to look weak). House money effect.

  6.  **Refining the "Visceral" Aspect:**
      *   Just choosing isn't enough. They need to *feel* the pull.
      *   *Addition:* In the Re-evaluation phase, put the "Small-Sooner" cash physically in their hands or on the table in front of them. Make the "Large-Later" a check/envelope sealed for later.
      *   *Addition:* Allow them to write a note to their future self during Phase 1. Read it in Phase 2.

  7.  **Addressing the "Confidence" Requirement:**
      *   I need to explicitly rate confidence for each section.
      *   I need to identify the *least* sure element. That is likely the *time compression*. 45 minutes of delay does not trigger the same biological urgency as 45 days. I need to address this in the debrief.

  8.  **Finalizing the Script:**
      *   Make sure the facilitator language is non-judgmental. "Notice what happens" not "You failed."
      *   Ensure the math is clear in the debrief.

  9.  **Review against Constraints:**
      *   15 people? Yes, scalable.
      *   2 hours? Yes, timeline fits.
      *   Real stakes? Yes, cash.
      *   No cruelty? Yes, switching is allowed and framed as data.
      *   Confidence ratings? Will add.
      *   Least sure element? Will identify (Time Compression).

  10. **Self-Correction/Polish:**
      *   *Wait, one round isn't enough to show the curve.* I should add a second choice *at the very end* that mirrors the first but with different delays to show consistency/inconsistency.
      *   *Actually, better:* Do two cohorts. Cohort A chooses at T=0 for T=30 vs T=60. Cohort B chooses at T=30 for T=30 (Now) vs T=60.
      *   *No, within-subject is better for visceral feel.* Everyone makes the long-term plan, then everyone faces the short-term temptation.
      *   *Key adjustment:* To make the reversal possible, they must be allowed to change their mind. If they commit bindingly, there is no reversal, only success/failure of commitment. The prompt asks to *feel the structure of preference reversal*. So they must be allowed to switch.
      *   *Payoff:* If they switch, they forfeit the larger amount. This is the cost of akrasia.
      *   *Wait, if they switch, do they get the small amount?* Yes. Otherwise, they just lose.
      *   *Okay, Plan:*
          1.  Choose: $10 in 30 mins OR $30 in 90 mins.
          2.  30 mins pass.
          3.  Offer: Take $10 NOW or wait 60 more mins for $30.
          4.  (Crucial) Those who originally picked $30 can now switch to $10.
          5.  End of session: Pay out.

      *   *Wait, 90 mins is too long for a 2 hour session.*
      *   *Adjustment:* Use "Take Home" vs "End of Session" vs "Break".
      *   Option S: $10 at Break (45 mins in).
      *   Option L: $30 at End (105 mins in).
      *   This fits 2 hours.
      *   Re-evaluation happens at Break.
      *   This works.

  11. **Drafting the Response:** (Mental check of the sections)
      *   Activity Name.
      *   Materials.
      *   Timeline.
      *   Rules/Payoff.
      *   Facilitator Script (Intro, Execution, Debrief).
      *   Confidence Ratings.
      *   Least Certain Element.

      *(Self-Correction on Debrief)*: Make sure to explicitly mention Ainslie-Rachlin. The "bunching" of rewards.
      *(Self-Correction on Failure Modes)*: Address the "Experimental Demand Characteristic" (people acting how they think they should).

      *Let's finalize the "Least Sure" element.* It's definitely the ecological validity of the time scale. I will highlight that.

      *Let's finalize the Confidence Ratings.*
      *   Timeline: High.
      *   Payoff Structure: High.
      *   Debrief Script: Medium-High.
      *   Visceral Impact: Medium (depends on group).

      *Okay, ready to write.*
answer: |-
  Here is a concrete design for your rationality dojo session. It is built to maximize the *felt experience* of preference reversal within a compressed timeframe, while maintaining psychological safety.

  # Activity Title: "The Curve of Now"

  ## 1. Logistics & Materials
  *   **Group Size:** 15 participants.
  *   **Duration:** 120 minutes.
  *   **Budget:** ~$150–$200 USD (Real cash is critical for visceral stakes; do not use points).
  *   **Materials:**
      *   Two distinct colors of envelopes (e.g., Red and Blue).
      *   Cash: 15 × $10 bills, 15 × $30 bills (or equivalent local currency).
      *   A visible countdown timer.
      *   Whiteboard/Projector.
      *   Printed "Contract Cards" (index cards).
      *   Pens.

  ## 2. Timeline Overview
  *   **0:00–0:15:** Introduction & Framing (Setting the stakes).
  *   **0:15–0:30:** **Phase 1: The Cold Choice** (Long-horizon planning).
  *   **0:30–1:15:** **The Interlude** (Engaging filler task to simulate "life happening").
  *   **1:15–1:30:** **Phase 2: The Hot Choice** (The reversal point).
  *   **1:30–1:45:** Payout & Transition.
  *   **1:45–2:00:** **Debrief** (Mapping experience to theory).

  ---

  ## 3. The Payoff Structure
  You are offering two reward profiles. Participants must choose one in Phase 1, but are allowed to switch in Phase 2.

  *   **Option S (Smaller-Sooner):** $10 cash, distributed at the **Break** (Minute 75).
  *   **Option L (Larger-Later):** $30 cash, distributed at the **End** (Minute 120).

  **The Reversal Mechanism:**
  In Phase 1, participants privately select S or L.
  In Phase 2 (at the Break), those who selected L are given an explicit opportunity to switch to S. If they switch, they get $10 immediately. If they stay, they wait 45 more minutes for $30.
  *Note: Those who picked S in Phase 1 cannot switch to L in Phase 2 (this simulates the inability to recover lost time, though you can allow it if you want symmetry; asymmetry creates more tension).*

  ---

  ## 4. Detailed Facilitator Script

  ### Part 1: Introduction (0:00–0:15)
  **Facilitator:** "Welcome. Today we are investigating akrasia, specifically the phenomenon of *preference reversal*. We often say we want to diet, but eat the cake. We say we want to save, but spend. Standard economics assumes our preferences are consistent over time. Behavioral economics suggests they are not."

  "We are going to run an experiment where you can earn real money. The rules are simple. There is no trick. The only variable is time."

  "Here is the deal: You can have $10 at the break, or $30 at the end of the session. That is 45 minutes of waiting for an extra $20. That is an effective hourly rate of roughly $26/hour for waiting. Most of you earn more than that as engineers or researchers. Rationally, Option L dominates."

  "However, you will have the chance to change your mind later. I want you to experience *what it feels like* to change your mind."

  ### Part 2: Phase 1 – The Cold Choice (0:15–0:30)
  **Action:** Hand out Index Cards.
  **Instruction:** "Write your name. Check Box S or Box L. Put the card in this envelope. Do not show your neighbor. This is a contract with your future self."

  **Facilitator Note:** Collect the envelopes. Do not look at them. This builds trust that you aren't judging them.

  ### Part 3: The Interlude (0:30–1:15)
  **Goal:** You must make the 45-minute wait feel *real*. If you just sit and stare at a clock, the discounting won't trigger. You need to induce a "Hot State."
  **Activity:** Run a high-engagement rationality exercise that induces mild cognitive load or social pressure.
  *   *Suggestion:* A "Pre-Mortem" group exercise on a hypothetical project, or a debate on a controversial tech ethics topic.
  *   *Why:* Akrasia often strikes when we are tired, distracted, or socially engaged. The "Cold" self plans during quiet reflection; the "Hot" self acts during the flow of life.
  *   **Crucial:** At minute 60, announce: "We are halfway to the break." Make the approaching reward salient.

  ### Part 4: Phase 2 – The Hot Choice (1:15–1:30)
  **Action:** Call for the Break.
  **Setup:** Place the $10 bills visibly on the table in front of each participant who chose Option L. Leave the $30 bills in a sealed box labeled "End of Session."
  **Instruction:** "We are at the Break. If you chose Option S, here is your $10. You are free to go eat."
  "To those who chose Option L: The $10 is right here. You can pick it up now. Or, you can leave it on the table, keep your card, and receive $30 at the end of the session. You have 2 minutes to decide."

  **Observation:** Watch the body language. Hesitation, reaching for the cash, looking at the box. This is the data.

  ### Part 5: Payout & Transition (1:30–1:45)
  Pay out the $10s to those who switched. Remind the $30 holders that they must stay until the very end to collect. (Ensure they actually stay; perhaps collect their contact info for mailing if they leave early, but cash-in-hand is best).

  ### Part 6: The Debrief Script (1:45–2:00)
  **Facilitator:** "Let's look at what happened. Raise your hand if you chose L in Phase 1. (Count). Keep your hand up if you stuck with L in Phase 2. (Count). Now, hands up if you chose L in Phase 1 but switched to S in Phase 2."

  **Mapping to Theory:**
  1.  **The Discount Curve:** "Draw a hyperbola on the board. $V = A / (1 + kD)$. In Phase 1, both rewards were in the future. The delay for S was 45 mins, for L was 90 mins. The *ratio* of delays was 1:2. The value of L looked high."
  2.  **The Crossing Point:** "In Phase 2, the delay for S became 0. The delay for L became 45. The ratio is now 0:45. Hyperbolic discounting says value spikes as delay approaches zero. Your 'Present Self' weighed the immediate $10 much heavier than your 'Past Self' did."
  3.  **Ainslie-Rachlin:** "This isn't weakness. It's a structural conflict between two agents: Planner-You and Doer-You. Planner-You wants the aggregate maximum. Doer-You wants the local maximum."
  4.  **The Normative Question:** "Which preference is authoritative? If Planner-You could bind Doer-You, should they? If you switched, did you make a mistake, or did your preferences legitimately update?"

  ---

  ## 5. Confidence Ratings on Design Choices

  | Design Element | Confidence | Rationale |
  | :--- | :--- | :--- |
  | **Cash Stakes ($10/$30)** | **High (90%)** | Rationalists respond to incentives. Points feel fake. $10 is enough to care about, $30 is enough to regret losing. |
  | **Allowing the Switch** | **High (95%)** | If you bind them (no switching), you test commitment devices, not preference reversal. To *feel* akrasia, they must be free to fail. |
  | **The Interlude Activity** | **Medium (70%)** | If the filler task is boring, time drags and "waiting" becomes the cost. If it's too fun, they forget the money. It needs to be engaging but not absorbing enough to forget the choice. |
  | **Time Compression (45 mins)** | **Low (50%)** | *See "Least Certain Element" below.* 45 minutes is not 45 days. The biological urgency may not fully replicate real-world akrasia. |
  | **Debrief Framing** | **High (90%)** | LW/CFAR audiences are familiar with the concepts. The value is linking the *feeling* in the room to the *graph* on the board. |

  ---

  ## 6. Predicted Failure Modes & Mitigations

  **1. The "House Money" Effect**
  *   *Risk:* Participants treat the money as "experiment money" rather than their own, reducing the stakes.
  *   *Mitigation:* In the intro, say: "This comes from my own budget. If everyone takes the $30, I am out $450. If you switch, you are taking money from the pool." (Even if not strictly true, it frames it as a limited resource).
  *   *Better:* Hand them the $10 in Phase 2 and say "You can keep this or give it back to me for a voucher worth $30 later." Loss aversion is stronger than gain seeking. *Recommendation: Use this framing.*

  **2. Social Signaling**
  *   *Risk:* Participants stick with Option L to look "rational" or switch to S because "everyone else is doing it."
  *   *Mitigation:* Make Phase 2 decisions private. Hand them a slip of paper to mark "Switch" or "Stay" and put it in a box. Reveal aggregate numbers only.

  **3. The "Gotcha" Feeling**
  *   *Risk:* Participants feel manipulated or embarrassed if they switch.
  *   *Mitigation:* In the debrief, normalize the switch. "If 30% of you switched, that is a textbook hyperbolic curve. If 0% switched, the stakes were too high or the time too short. We want switches. Switching gives us data."

  ---

  ## 7. The Least Certain Element: Time Compression
  **Element:** The compression of the delay period (45 minutes vs. weeks/months).
  **Why I'm unsure:** Hyperbolic discounting is evolutionarily tuned for survival contexts (food now vs. food later) and long-term planning (saving for retirement). A 45-minute delay in a safe room with air conditioning may not trigger the same limbic "grab it now" urgency as a real-world temptation (e.g., a cigarette, a procrastination impulse).
  **Phenomenology Risk:** Participants might intellectualize the choice ("$20 is worth an hour of my time") rather than *feel* the tug of the immediate reward. The "Hot State" might not get hot enough.

  **How to Handle in Debrief:**
  Be explicit about this limitation.
  *Script:* "We compressed months into minutes. This is a simulation. In the real world, the 'Hot State' is fueled by stress, fatigue, or visceral craving. Here, it is fueled only by the presence of cash on the table. If you didn't feel the tug, that doesn't mean you're immune to akrasia; it means this specific trigger wasn't potent for you. Notice: Did the cash *look* more valuable when it was within reach? That visual salience is a proxy for the emotional salience of real-world temptations."

  ## 8. Contingency Plan
  If **no one** switches in Phase 2:
  *   **Facilitator Move:** "The stakes were too high relative to the delay. Let's analyze why. Was $30 sufficiently larger? Was 45 minutes sufficiently short?"
  *   **Pivot:** Use this as a data point on *commitment*. "You all successfully acted as your Future Self. What protected you? Was it the group setting? The public commitment?" This still yields a valuable discussion on how to *prevent* reversal, even if reversal didn't occur.

  If **everyone** switches:
  *   **Facilitator Move:** "The discount rate was incredibly steep. This suggests the 'Cost of Waiting' (boredom, opportunity cost of the break) outweighed the $20 premium."

  ## 9. Final Preparation Checklist
  1.  **Cash:** Withdraw small bills the day before.
  2.  **Timer:** Set a loud alarm for the Break and End.
  3.  **Room:** Ensure you can close the door/privacy for the money handling.
  4.  **Mindset:** Prepare yourself to lose the money. If everyone takes the $30, you spend $450. If everyone takes the $10, you spend $150. Budget for the worst case ($450) to avoid subconscious resentment during the session.

  This design prioritizes the *structural insight* of preference reversal over the *moral lesson* of discipline. It treats the participants as scientists observing their own utility functions, which aligns perfectly with the LessWrong/CFAR ethos.
