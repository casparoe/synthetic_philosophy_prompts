prompt: |-
  I am a postdoctoral researcher preparing a paper for a workshop on consequentialism and decision-making under severe uncertainty. The paper defends a qualified act-consequentialism against the cluelessness objection. Its thesis is that cluelessness does not refute act-consequentialism as a criterion of rightness, but it does force a substantial revision of the theory's decision procedure. In particular, I argue that agents should not simply maximise expected value over their own inevitably incomplete probability distributions, because the priors such calculations require are, in the relevant long-run and identity-affecting cases, substantially arbitrary. Instead, I defend a robustness-based rule: an action is permissible only if it would be choice-worthy across a suitably wide range of reasonable empirical models of downstream consequences and reasonable evaluative theories, and where no available action meets that standard the agent should default to a conservative baseline of non-intervention. I try to show that the rule is not ad hoc by deriving it from a modest epistemic principle about suspending judgement under deep uncertainty rather than from risk-aversion.

  The audience will be roughly twenty-five people: several act-consequentialists sympathetic to effective altruism, who will hear any departure from expected-value maximisation as status quo bias; one Kantian, who thinks the real lesson of cluelessness is that consequentialism cannot be action-guiding at all; two formal epistemologists working on imprecise probabilities and higher-order evidence, who will press on how the set of reasonable models is specified and updated; a virtue ethicist sceptical of decision rules altogether; and a political philosopher who will ask whether the conservative baseline merely entrenches existing distributions of harm. Please draft a Q&A preparation sheet for this talk: the eight or so objections I am most likely to receive from this specific audience, ordered by how likely and how damaging they are, each phrased as the relevant audience member would actually put it. For each objection, include a reply that could be delivered in about two minutes and a note on where that reply is softest. Include the question I am hoping nobody asks, and tell me what I should concede up front in the talk so that I do not have to concede it under questioning.

  Throughout, please distinguish what is genuinely settled in the philosophical literature on cluelessness from what remains contested, and do not present a contested interpretation as if it were the consensus. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation sheet:

  1.  **Analyze the Request:**
      *   **User:** Postdoctoral researcher.
      *   **Topic:** Defending qualified act-consequentialism against the cluelessness objection.
      *   **Thesis:** Cluelessness doesn't refute the *criterion* of rightness but requires revising the *decision procedure*. Move from maximizing expected value (EV) with arbitrary priors to a robustness-based rule (permissible if choice-worthy across reasonable models/theories; otherwise default to conservative non-intervention). Derived from epistemic suspension of judgment, not risk-aversion.
      *   **Audience:** 25 people. Specific breakdown:
          *   Act-consequentialists/Effective Altruists (EA) (fear status quo bias).
          *   One Kantian (thinks consequentialism isn't action-guiding).
          *   Two Formal Epistemologists (imprecise probabilities/higher-order evidence).
          *   One Virtue Ethicist (sceptical of rules).
          *   One Political Philosopher (worried about entrenching harm/status quo).
      *   **Task:** Draft a Q&A preparation sheet.
          *   ~8 objections, ordered by likelihood/damage.
          *   Phrased as the audience member would speak.
          *   2-minute reply for each.
          *   Note on where the reply is softest.
          *   Include the "Question I hope nobody asks."
          *   Include a concession to make *during* the talk to avoid conceding under fire.
          *   **Constraint:** Distinguish settled vs. contested literature on cluelessness.
          *   **Constraint:** British English.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Core Claim:* Criterion vs. Procedure distinction. (Standard move, but needs defence).
      *   *Core Mechanism:* Robustness over a set of models/theories + Default to non-intervention.
      *   *Justification:* Epistemic principle (suspend judgment), not risk-aversion.
      *   *Vulnerability 1 (EA/Consequentialists):* This looks like satisficing or status quo bias. It blocks high-impact interventions (e.g., existential risk reduction) which are inherently uncertain.
      *   *Vulnerability 2 (Kantian):* If the procedure is this complex/uncertain, why not just use deontology? The "criterion" becomes idle.
      *   *Vulnerability 3 (Epistemologists):* How do you define "reasonable models"? Is it just imprecise probabilities? How do you update?
      *   *Vulnerability 4 (Political Phil):* "Non-intervention" favours the privileged. It's ideologically loaded.
      *   *Vulnerability 5 (Virtue Ethicist):* Rules don't make agents good. What about character?
      *   *Vulnerability 6 (General):* Is this still consequentialism?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (EA/Consequentialist):* Most likely. They dominate this space. They will hate the "non-intervention" default.
          *   *Phrasing:* "This is just status quo bias dressed up as epistemic humility."
          *   *Reply:* Distinguish risk-aversion from epistemic suspension. We aren't saying the status quo is *better*, just that we lack evidence to override it.
          *   *Soft Spot:* Defining the "baseline."

      *   *Objection 2 (Political Phil):* High damage. "Non-intervention" is politically charged.
          *   *Phrasing:* "Non-intervention entrenches existing harm."
          *   *Reply:* The baseline isn't 'do nothing', it's 'do no *new* unverified harm'. Acknowledge the tension.
          *   *Soft Spot:* Historical injustices make the status quo morally toxic.

      *   *Objection 3 (Formal Epistemologist):* Technical. "Reasonable models" is vague.
          *   *Phrasing:* "How do you bound the set of priors? Is this just imprecise probability?"
          *   *Reply:* It's a set of credal functions, but constrained by empirical adequacy, not just coherence.
          *   *Soft Spot:* The boundary of "reasonable" is itself arbitrary.

      *   *Objection 4 (Kantian):* Fundamental. "Action-guidingness."
          *   *Phrasing:* "If the criterion never yields a verdict without this complex procedure, it's useless."
          *   *Reply:* It yields verdicts (permissible/impermissible), just not always a unique optimum. That's enough for guidance.
          *   *Soft Spot:* If "non-intervention" is the default, does the criterion do any work?

      *   *Objection 5 (EA/Consequentialist - Longtermism):* Specific to "identity-affecting."
          *   *Phrasing:* "Existential risk work is uncertain. Your rule forbids it."
          *   *Reply:* Only if it's not robustly good. If it's robustly good across models, it's allowed.
          *   *Soft Spot:* Most x-risk work *is* highly speculative.

      *   *Objection 6 (Virtue Ethicist):* "Rules vs. Character."
          *   *Phrasing:* "Why focus on the act rather than the agent?"
          *   *Reply:* This is a paper on the *criterion of rightness*, not virtue. But the rule cultivates epistemic humility.
          *   *Soft Spot:* Separating act from agent is artificial.

      *   *Objection 7 (General/Meta):* "Is this still Consequentialism?"
          *   *Phrasing:* "You've smuggled in deontological constraints."
          *   *Reply:* No, the justification is still outcome-based (avoiding bad outcomes due to ignorance), just the *method* is indirect.
          *   *Soft Spot:* The "non-intervention" default looks very deontological (do no harm).

      *   *Objection 8 (The "Hope Nobody Asks"):* The "Why not just use Imprecise Probabilities (IP) directly?"
          *   *Phrasing:* "Why not just maximise E-admissibility or Gamma-maximin within an IP framework rather than this hybrid rule?"
          *   *Reason:* It undermines the novelty. If IP solves it, why the "robustness rule"?

  4.  **Refining the Content (Literature Check):**
      *   *Settled:* Cluelessness is a serious problem for classical utilitarianism (Lenman 2000, Greco 2016). Expected value calculations often fail under deep uncertainty.
      *   *Contested:* Whether this refutes consequentialism (some say yes, some say modify procedure). The specific solution (robustness vs. IP vs. scepticism).
      *   *Tone:* Academic, precise, British English (e.g., "maximise", "programme", "defence").

  5.  **Drafting the Concession:**
      *   Need to concede something to disarm critics.
      *   *Idea:* Concede that the "baseline" is hard to define in non-ideal theory. This pre-empts the Political Philosopher and the EA who worries about inaction.

  6.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes (EA/Political/Epistemic are top).
      *   2-minute replies? (Need to keep word count tight for spoken delivery).
      *   Soft spots identified? Yes.
      *   Hope nobody asks? Included.
      *   Concession included? Yes.
      *   British English? Yes.
      *   Settled vs. Contested distinction? Included in the intro notes.

  7.  **Final Polish:**
      *   Ensure the voices sound distinct (EA vs. Kantian vs. Pol Phil).
      *   Check the "non-intervention" phrasing to ensure it aligns with the user's thesis (conservative baseline).
      *   Make sure the distinction between *criterion* and *decision procedure* is clear in the replies.

  *(Self-Correction during drafting)*: I initially thought about putting the Kantian first. But in an EA-heavy workshop, the EA objection is more *likely*, even if the Kantian one is more *damaging* philosophically. I will weight likelihood higher for the top spots, as the user needs to survive the Q&A. The Political Philosopher's objection is also very damaging in the current climate. I will place the EA "Status Quo" objection first, followed closely by the Political "Entrenchment" objection.

  *(Refining the "Hope Nobody Asks")*: The best "killer question" is usually one that suggests the proposed solution is already standard in a different field, rendering the paper redundant. Asking why this isn't just standard Imprecise Probability theory (IP) is strong. Or, asking why the "criterion" matters if the "procedure" does all the work. Let's go with the IP question as it targets the Formal Epistemologists in the room who might feel their work is being reinvented.

  *(Refining the Concession)*: The user says "default to conservative baseline of non-intervention." This is the weakest point. Conceding that *defining* that baseline is context-dependent disarms the "status quo bias" charge slightly by admitting the difficulty.

