answer: |-
  **Q&A PREPARATION SHEET**
  **Workshop:** Consequentialism and Decision-Making Under Severe Uncertainty
  **Topic:** Robustness, Cluelessness, and the Decision Procedure
  **Date:** [Insert Date]

  ### **Preliminary Note: The State of the Literature**
  Before entering the Q&A, keep clear in your mind what is settled versus contested.
  *   **Settled:** There is broad agreement that 'cluelessness' (our inability to know the long-term consequences of acts, particularly identity-affecting ones) poses a severe problem for classical act-consequentialism relying on precise expected utility maximisation (Lenman 2000; Greco 2016). It is also generally accepted that distinguishing the *criterion of rightness* from the *decision procedure* is a valid theoretical move, though its success is debated.
  *   **Contested:** Whether cluelessness refutes consequentialism entirely (scepticism) or merely modifies it. There is no consensus on the correct formal tool for handling deep uncertainty (Imprecise Probabilities vs. Robustness vs. Ambiguity Aversion). Your specific claim—that the revision must be a robustness rule derived from epistemic suspension rather than risk-aversion—is a novel contribution, not an established view.

  ---

  ### **The Concession (To be made during the talk)**
  *To prevent being cornered on this during Q&A, insert the following qualification in your concluding remarks:*

  "I want to concede up front that specifying the 'conservative baseline of non-intervention' is the most difficult part of this proposal in non-ideal theory. I am not claiming the status quo is morally neutral. Rather, the baseline is a *procedural* anchor for cases of deep uncertainty, not a substantive claim that existing distributions of harm are permissible. How we define that baseline in contexts of historical injustice requires a separate, substantive theory of justice which I cannot fully develop here."

  ---

  ### **Likely Objections & Replies**

  #### **1. The Effective Altruist / Act-Consequentialist**
  **Likelihood:** Very High | **Damage:** High
  **The Objection:** "You say this isn't risk-aversion, but it functions identically to it. By demanding robustness across models and defaulting to non-intervention, you are effectively vetoing high-impact, high-uncertainty interventions—like existential risk reduction or radical political reform. Isn't this just status quo bias dressed up as epistemic humility? You're letting perfect be the enemy of the good."

  **The Reply (2 mins):**
  "It is crucial to distinguish *valuing* the status quo from *lacking evidence* to depart from it. My argument is not that the status quo is good, but that under deep uncertainty, our priors for long-term consequences are arbitrary. If we cannot distinguish between a 10% and a 90% chance of catastrophe, maximising expected value is mathematically spurious, not brave.
  However, this does not forbid high-impact work. If an intervention is *robustly* good—meaning it yields positive expected value across a wide range of reasonable empirical models and evaluative theories—it is permissible. The rule only blocks interventions that rely on a single, fragile model of the future. We should not confuse 'high impact' with 'highly speculative'. If existential risk reduction is truly robustly good, my theory permits it. If it relies on arbitrary priors, we shouldn't be doing it anyway."

  **Soft Spot:** Defining which interventions are "robustly good" versus "fragile." Many EAs believe x-risk work *is* robust; you might be forced to admit your theory blocks more than you intend.

  #### **2. The Political Philosopher**
  **Likelihood:** High | **Damage:** High
  **The Objection:** "You conceded the baseline isn't morally neutral, but your procedure treats it as such. In a world of structural violence, 'non-intervention' is an intervention that favours the privileged. By making the burden of proof lie on the agent to show robustness before acting, you entrench existing distributions of harm. Why shouldn't the default be remedial action rather than non-intervention?"

  **The Reply (2 mins):**
  "This is a serious concern, and why I distinguished the *procedural* baseline from substantive justice. The 'non-intervention' default applies specifically to *consequentialist calculations under deep uncertainty*, not to cases where harm is known and immediate. If we know a policy causes starvation, that is not a case of cluelessness; it is a case of known harm, and my theory demands we stop it.
  The robustness rule is designed for the *long-run, identity-affecting* cases where consequences are unknowable. In those specific realms, acting on arbitrary priors risks imposing new, unforeseen harms on vulnerable populations. Epistemic caution is a form of moral caution. However, I agree that applying this to structural injustice requires care, which is why I limited the scope of the talk to severe uncertainty regarding downstream effects."

  **Soft Spot:** Distinguishing "known harm" from "structural harm" is difficult. Structural harm is often diffuse and uncertain, potentially falling into your "cluelessness" bucket, which would trigger the non-intervention default.

  #### **3. The Formal Epistemologist (Imprecise Probabilities)**
  **Likelihood:** High | **Damage:** Medium-High
  **The Objection:** "You're reinventing the wheel. This sounds like Imprecise Probability (IP) theory, specifically *E-admissibility* or *Gamma-maximin*. Why posit a new 'robustness rule' rather than simply adopting a set of credal functions? Furthermore, how do you specify the set of 'reasonable models' without arbitrary boundaries? If the set is too wide, you get paralysis; too narrow, and it's just precise probability in disguise."

  **The Reply (2 mins):**
  "There is significant overlap with IP, and I acknowledge that debt. However, standard IP often focuses on how to *choose* given a set of probabilities. My focus is on the *epistemic justification* for the set itself. I argue the set is constrained not just by coherence, but by empirical adequacy and theoretical pluralism.
  Regarding the boundary: You are right that 'reasonable' is not sharply defined. But this is a feature, not a bug. It reflects the vagueness of our evidence. We are not looking for a decision algorithm that always outputs a unique action, but one that identifies when we are epistemically licensed to act. If the set of reasonable models yields no intersection of choice-worthiness, the correct output *is* paralysis or default, because that reflects the epistemic reality."

  **Soft Spot:** If pressed on *how* to update the set of models with new evidence, you may lack a formal mechanism. IP theorists have updating rules; your "epistemic principle" is more qualitative.

  #### **4. The Kantian**
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:** "You maintain act-consequentialism as the *criterion* of rightness, but your *procedure* rarely allows you to use it. If the criterion cannot guide action without this complex, external robustness check, it is idle. Why not simply adopt a deontological constraint against acting on arbitrary priors? You've effectively smuggled a Kantian constraint into a consequentialist framework."

  **The Reply (2 mins):**
  "The criterion is not idle; it determines the *direction* of the robustness check. We are checking models of *consequences*. A deontologist would check models of *duties*. The fact that the procedure is complex does not make the criterion irrelevant; it makes it demanding.
  Furthermore, the justification for the constraint is consequentialist: we suspend judgment because acting on arbitrary priors leads to suboptimal outcomes in the long run, not because acting on uncertainty is inherently wrong. The 'smuggling' is only superficial. The engine of the theory remains the evaluation of states of affairs."

  **Soft Spot:** If the "non-intervention" default becomes the most common output, the consequentialist criterion practically drops out of the picture for the most important decisions.

  #### **5. The Effective Altruist (Longtermist Focus)**
  **Likelihood:** Medium | **Damage:** Medium
  **The Objection:** "Identity-affecting cases are exactly where we need to act. Future generations cannot consent. If we default to non-intervention on existential risk because the probabilities are 'arbitrary', we are gambling with their lives. Isn't it better to act on a fragile model than to guarantee the status quo which might include extinction?"

  **The Reply (2 mins):**
  "Extinction is a known, robust bad across almost all evaluative theories. Therefore, preventing extinction is likely robustly choice-worthy, provided the intervention itself doesn't carry robust risks of causing extinction.
  My argument targets the *means*, not the *end*. If the proposed solution to existential risk relies on a fragile chain of reasoning—for example, specific geopolitical interventions with unknowable downstream effects—then yes, I argue we should pause. But if the intervention is robustly positive (e.g., basic biosecurity), it passes the test. We must not conflate 'uncertainty about the future' with 'uncertainty about the value of survival'."

  **Soft Spot:** Many longtermist interventions (e.g., specific AI governance strategies) are highly fragile. You may be ruling out the very interventions the audience cares most about.

  #### **6. The Virtue Ethicist**
  **Likelihood:** Low-Medium | **Damage:** Low
  **The Objection:** "You're focusing entirely on the act and the rule. But cluelessness is a problem about the *agent's* limitations. Why not focus on cultivating intellectual virtues—humility, caution, wisdom—rather than constructing a decision rule? A virtuous agent will know when not to act without needing a robustness algorithm."

  **The Reply (2 mins):**
  "I agree that virtues are essential, but they are not a substitute for a criterion of rightness. Virtue ethics tells us what a good person looks like; it doesn't necessarily tell us which act is right in a complex, systemic context where individual intuition fails.
  My rule is actually designed to *institutionalise* the virtue of epistemic humility. It forces the agent to explicitly confront the range of models rather than relying on gut feeling. So, I see this as complementary to virtue ethics, not opposed to it. The rule scaffolds the virtue."

  **Soft Spot:** Virtue ethicists may argue that rule-following without understanding undermines the development of true practical wisdom (*phronesis*).

  #### **7. The General Consequentialist (The "Why Bother?" Objection)**
  **Likelihood:** Low-Medium | **Damage:** Medium
  **The Objection:** "If the criterion of rightness depends on the actual consequences, but the decision procedure ignores the actual consequences in favour of 'reasonable models', you have severed the link between rightness and rationality. Why should I care about a criterion that doesn't guide me to the actual best outcome?"

  **The Reply (2 mins):**
  "Because under severe uncertainty, 'the actual best outcome' is unknowable ex ante. A theory that demands we aim for the unknowable is not a theory of rational choice; it is a theory of luck.
  By linking rationality to robustness across reasonable models, we maximise the *probability* of tracking the truth of the criterion, even if we cannot access the truth directly. It is the best available proxy for the criterion under epistemic constraints. We haven't severed the link; we've acknowledged the fog."

  **Soft Spot:** This concedes that the theory might systematically miss the "actual best outcome" in favour of safety. Hardline consequentialists may find this unacceptable.

  #### **8. The "Hope Nobody Asks" Question**
  **Likelihood:** Low | **Damage:** Very High
  **The Question:** (From a Formal Epistemologist or Sophisticated Consequentialist) "You argue against maximising expected value over incomplete distributions. But there is already a mature literature on *Imprecise Expected Utility* that allows for decision-making without precise priors (e.g., using lower previsions). Why is your 'robustness rule' superior to simply maximising the lower expectation? Is this not just a philosophical rebranding of a solved formal problem?"

  **The Reply (2 mins):**
  "That is an excellent point, and if my proposal were merely formal, I would defer to that literature. However, my claim is normative, not just formal. Maximising lower expectation is still a *maximisation* strategy that can yield counter-intuitive results (such as refusing a bet that is almost certainly favourable).
  My robustness rule is a *satisficing* constraint derived from the epistemic principle of suspension of judgment. It asks: 'Is this action choice-worthy across models?' rather than 'Which action has the highest lower bound?' This preserves the permissibility of inaction in a way that formal maximisation rules often struggle to justify without appearing ad hoc. I am offering the philosophical grounding for why one might choose a non-maximising rule in this context."

  **Soft Spot:** If they press that Lower Expectation maximisation *does* justify inaction in certain limit cases, your claim to novelty weakens significantly.

  ---

  ### **General Advice for Delivery**
  *   **Stand Firm on the Criterion/Procedure Distinction:** This is your shield. If they attack the outcome, remind them you are discussing the *rationality of the decision process* under uncertainty, not guaranteeing the outcome.
  *   **Watch the "Non-Intervention" Language:** As noted in the concession, be careful not to sound like you are advocating for passivity in the face of suffering. Use phrases like "epistemic pause" or "burden of proof."
  *   **Acknowledge the EA Audience:** Validate their goals (doing good) before explaining why your method protects those goals from error. Do not frame this as an attack on Effective Altruism, but as a refinement of its epistemic standards.
