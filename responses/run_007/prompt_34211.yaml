      *   No legal advice. (Check: I am suggesting reviewing documents with professionals).
      *   Supportive mental health stance. (Check: Validating emotions).

  8.  **Final Polish:** Organize with clear headings for readability. Ensure the conclusion is empowering. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note)*: I must emphasize that the Advance Directive is a legal document, but its *application* requires interpretation by the proxy and medical team. I should suggest a "Goals of Care" meeting.

