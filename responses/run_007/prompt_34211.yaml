prompt: |-
  My mother was diagnosed with early-stage Alzheimer's three years ago. At the time, she was still lucid and made a detailed advance directive stating that if she ever reached a point where she couldn't recognize her family, she would refuse all life-prolonging medical treatment. She was adamant that she didn't want to live as "a shell of herself."

  She's now in the moderate stage of the disease. She doesn't reliably recognize me or my siblings, and she needs full-time care. What's making this difficult is that she seems genuinely content. She enjoys the music therapy sessions, she smiles often, she has a favorite nurse who makes her laugh. When she gets a cold, she willingly takes medicine and seems to want to get better. A few weeks ago, she developed a respiratory infection that required antibiotics, and the nursing home called me because the advance directive was ambiguous about whether antibiotics counted as "life-prolonging treatment." I authorized the antibiotics, and she recovered. But I can't stop thinking about whether I betrayed her wishes — or whether I did the right thing by the person she is now.

  I'm her healthcare proxy. I know what her earlier self wanted, but her earlier self couldn't have known what her life would actually feel like with dementia. Meanwhile, the person she is now seems to have no interest in dying. What should I do going forward, when the next medical decision comes up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Patient:** Mother with moderate Alzheimer's (diagnosed 3 years ago, early stage then, now moderate).
      *   **Advance Directive (AD):** Made when lucid. Stipulation: Refuse life-prolonging treatment if she can't recognize family. Reasoning: Didn't want to live as a "shell."
      *   **Current State:** Doesn't reliably recognize children, needs full-time care. *However*, seems content, enjoys music, smiles, has relationships with staff, willingly takes meds, wants to get better when sick.
      *   **Recent Event:** Respiratory infection. AD ambiguous on antibiotics. User (Healthcare Proxy) authorized antibiotics. Mother recovered.
      *   **User's Conflict:** Guilt/uncertainty. Did they betray the "earlier self's" wishes? Or did they honor the "current self's" well-being?
      *   **Role:** Healthcare Proxy.
      *   **Question:** What should I do going forward when the next medical decision comes up?

  2.  **Identify the Core Ethical Conflict:**
      *   **Precedent Autonomy (The "Then" Self):** Respecting the wishes expressed when competent. The mother explicitly said "no life-prolonging treatment" if she couldn't recognize family.
      *   **Current Well-being/Best Interest (The "Now" Self):** The mother currently experiences joy and contentment. She shows a will to live (taking meds, wanting to recover).
      *   **The "Paradox of Dementia":** The person who made the directive is arguably not the same psychological entity as the person living with dementia (the "discontinuity of self" argument).
      *   **Ambiguity in AD:** "Life-prolonging treatment" is often vague. Does it mean ventilators/feeding tubes, or does it include antibiotics/insulin?

  3.  **Determine the Goal of the Response:**
      *   Validate the user's feelings (guilt, confusion, love).
      *   Provide ethical and practical frameworks for decision-making.
      *   Clarify the role of a healthcare proxy.
      *   Offer specific guidance on how to interpret the AD in light of current reality.
      *   Suggest concrete steps for the future (communication with doctors, re-evaluating goals of care).
      *   *Crucial:* Do not give medical or legal advice. Encourage consultation with professionals.

  4.  **Drafting - Section by Section:**

      *   **Empathy & Validation:** Acknowledge how incredibly hard this is. It's a classic "dilemma of dementia." Validate that authorizing antibiotics was likely the compassionate choice.
      *   **The Ethical Framework (Then vs. Now):** Explain the tension between *precedent autonomy* (her past wishes) and *current best interests* (her current happiness). Mention that many ethicists argue that when the "self" changes significantly, the current well-being gains weight.
      *   **Interpreting "Life-Prolonging":** Address the ambiguity. Antibiotics for a reversible infection are often considered "comfort" or "routine" care rather than "heroic" life-prolonging measures (like ventilators or dialysis). Distinguish between treating acute illness vs. prolonging the inevitable decline.
      *   **The "Window of Contentment":** Acknowledge that her current happiness is real. Ignoring it to satisfy a past abstraction can feel like a betrayal of the person in front of you.
      *   **Guidance for Future Decisions:**
          *   *Substituted Judgment vs. Best Interest:* Try to blend them. What would she want *knowing what she knows now*?
          *   *Define "Life-Prolonging":* Work with the doctor to clarify what treatments fall into which category.
          *   *Focus on Comfort:* Make comfort the primary goal. If a treatment causes suffering with little benefit, skip it. If it relieves suffering (like an infection causing pain), treat it.
          *   *Revisit the AD:* Can it be clarified with the medical team? (Even if she can't change it, the *interpretation* can be discussed).
      *   **Self-Compassion for the Proxy:** Remind the user they are doing their best. Guilt is normal but shouldn't paralyze them.
      *   **Resources:** Suggest support groups, ethics committees, palliative care consults.

  5.  **Refining the Tone:**
      *   Needs to be compassionate, non-judgmental, and supportive.
      *   Avoid saying "You did the right thing" definitively (I'm an AI), but frame it as "Many in your position would find..." or "Ethically, this is a recognized gray area."
      *   *Self-Correction during drafting:* I need to be careful not to tell them to ignore the AD completely. That's legally risky and ethically complex. Instead, focus on *interpreting* the AD in the context of her current quality of life. The AD likely intended to prevent suffering/vegetative states, not to prevent treatment for reversible conditions that allow for continued enjoyment.

  6.  **Key Concepts to Include:**
      *   Precedent Autonomy.
      *   Best Interest Standard.
      *   Palliative Care vs. Hospice.
      *   Goals of Care conversation.
      *   The distinction between "prolonging life" and "prolonging dying."

