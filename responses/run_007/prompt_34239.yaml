answer: |-
  ## The Local News Privacy & Public Interest Protocol (LNPPIP)

  **Purpose:** To move editorial decisions on personal data from "instinct" to "structured ethical reasoning."
  **Time Required:** 10–15 Minutes.
  **Philosophical Grounding:** This procedure relies on three core ethical concepts rather than legal statutes:
  1.  **Contextual Integrity (Helen Nissenbaum):** Information should not flow from one social context (e.g., a regulatory hearing) to another (e.g., a community news feed) if it violates the norms of the receiving context.
  2.  **Narrative Control (Jeffrey Reiman):** Individuals have a moral interest in controlling the story of their own lives to maintain autonomy and dignity.
  3.  **Proportionality (Millian Harm):** Intrusion is only justified if the public benefit demonstrably outweighs the specific harm caused to the individual.

  ---

  ### Step 1: Taxonomy of Information
  *Classify the specific piece of data you intend to publish. Different categories carry different ethical weights.*

  *   **A. Intimate Facts:** Health, sexuality, grief, family dynamics, home interior.
  *   **B. Public-Facing Facts:** Role in public office, business ownership, statements made in public forums.
  *   **C. Historical Wrongdoing:** Past convictions, disciplinary actions, allegations (resolved or unresolved).
  *   **D. Spatial/Location:** Current address, whereabouts, routine movements.
  *   **E. Relational:** Identities of family members, friends, or colleagues not central to the story.

  **Action:** Select one primary category.
  *   *If A or D:* Proceed to Step 2 with a **High Presumption of Privacy**.
  *   *If B:* Proceed to Step 2 with a **Low Presumption of Privacy**.
  *   *If C or E:* Proceed to Step 2 with a **Medium Presumption of Privacy**.

  ### Step 2: The Public Interest Threshold
  *Define the justification. Distinguish between "what the public is interested in" (curiosity) and "what is in the public interest" (democratic function).*

  **Question 2.1:** Does publishing this specific detail enable the audience to hold power to account, protect public safety, or correct a significant public misconception?
  *   **No:** **STOP.** Do not publish. (Curiosity is not an ethical justification).
  *   **Yes:** Proceed to 2.2.

  **Question 2.2:** Is the person a "voluntary public figure" regarding this specific issue? (e.g., Did they seek the office? Did they initiate the public controversy?)
  *   **No:** Their claim to narrative control is stronger. Note this for Step 4.
  *   **Yes:** Their claim to narrative control is weaker.

  ### Step 3: The Harm & Dignity Assessment
  *Estimate the cost to the individual. This is the ethical counterweight to Step 2.*

  **Question 3.1:** Will publication expose the individual to physical risk, harassment, or disproportionate social ostracization?
  *   **Yes:** **FLAG FOR SENIOR EDITOR.** Requires explicit mitigation strategy.
  *   **No:** Proceed.

  **Question 3.2:** Does this information freeze the individual in a past identity, denying the possibility of rehabilitation or change? (Specific to Category C: Historical Wrongdoing).
  *   **Yes:** Proceed to Step 4 with extreme caution.
  *   **No:** Proceed.

  **Question 3.3:** (For deceased or vulnerable persons) Have direct stakeholders (family, guardians) objected on dignity grounds?
  *   **Yes:** Proceed to Step 4. Their objection does not veto, but it adds weight to the "Harm" side of the scale.

  ### Step 4: The Necessity Test (The "Less Intrusive Means")
  *Can the story achieve the Step 2 Public Interest goal without this specific data point?*

  **Question 4.1:** If we remove the name/address/history, does the story lose its evidentiary value?
  *   **Example:** Naming a corrupt councillor is necessary for accountability. Naming the victim of a crime is often not necessary to report the crime occurred.
  *   **If No (Story still works):** **STOP.** Do not publish the personal data. Publish the story anonymously.
  *   **If Yes (Identity is central):** Proceed to Step 5.

  ### Step 5: The Proportionality & "Tomorrow" Check
  *This is the judgment call zone. The procedure cannot calculate this; it can only frame it.*

  **Question 5.1:** Is the harm to the individual *grossly disproportionate* to the public benefit?
  *   *Editorial Judgment:* If the benefit is "transparency" but the harm is "suicide risk" or "ruined livelihood for a minor infraction," the ethics demand non-publication even if legal.

  **Question 5.2:** The "Tomorrow Test": If the subject or their family confronts you tomorrow and asks, "Why did you need to print *that*?", can you articulate a reason that satisfies *their* dignity, not just your defense?
  *   **If you cannot articulate a dignified reason:** **STOP.**
  *   **If you can:** Publish, but document the reasoning.

  ---

  ## Case Analysis

  Here is the LNPPIP applied to your two cases from last year.

  ### Case 1: The Teacher (Historical Wrongdoing / Public Safety)

  **Step 1: Taxonomy**
  *   **Category:** C (Historical Wrongdoing/Disciplinary).
  *   **Presumption:** Medium Privacy.

  **Step 2: Public Interest Threshold**
  *   **2.1 (Accountability/Safety):** Yes. Safeguarding children is a high-priority public interest. Parents have a right to know about risks.
  *   **2.2 (Voluntary Figure):** Yes. He is applying for a Headship (a public-facing leadership role involving trust).
  *   **Result:** Threshold met. Proceed.

  **Step 3: Harm & Dignity**
  *   **3.1 (Risk):** Potential career destruction and social ostracization.
  *   **3.2 (Rehabilitation):** **CRITICAL FLAG.** He was cleared by the regulator. The infraction was procedural, not harmful. Publishing this now (5 years later) risks defining him by a resolved issue.
  *   **3.3 (Objection):** Implicit objection (he has not disclosed it; the tipster is adversarial).

  **Step 4: Necessity Test**
  *   **4.1 (Evidentiary Value):** Does the community need to know *his name* to understand safeguarding protocols? No. Does the hiring school need to know? Yes, but they likely have disclosure mechanisms (DBS/references) that do not require public news exposure.
  *   **Result:** Public news publication is **not necessary** to achieve the safety goal. The hiring authority is the appropriate context for this information, not the town newspaper.

  **Step 5: Proportionality & "Tomorrow" Check**
  *   **5.1 (Disproportionate?):** Yes. The harm (career sabotage based on a cleared allegation) outweighs the benefit (public gossip vs. actual hiring oversight).
  *   **5.2 (Dignified Reason):** If the teacher asks, "Why did you publish a cleared allegation from 5 years ago to stop my promotion?" the editor has no dignified answer other than "A parent told us to."

  **Decision Point:** Step 4 / Step 5.
  **Procedure Answer:** **Do Not Publish.**
  **Discomfort Check:** **High.** You may feel uncomfortable because "Safeguarding" is a trigger word that usually overrides privacy. There is a nagging fear: *What if he does something wrong in the new job?*
  *Editorial Note:* The procedure forces you to recognize that *you* are not the safeguarding authority. Publishing this acts as vigilante vetting. The ethical discomfort comes from abdicating the role of "protector," but the procedure correctly identifies that the news site is not the proper context for employment vetting (Contextual Integrity).

  ### Case 2: The Crash Victim (Deceased / Family Objection)

  **Step 1: Taxonomy**
  *   **Category:** A (Intimate/Family Circumstances) & D (Spatial/Location - via identity).
  *   **Presumption:** High Privacy (especially regarding the dead).

  **Step 2: Public Interest Threshold**
  *   **2.1 (Accountability/Safety):** Yes/No. Reporting the *crash* is in the public interest (road safety, traffic disruption). Reporting the *name* adds little to road safety.
  *   **2.2 (Voluntary Figure):** No. He was a private citizen driving on a public road. Being in public does not make one a public figure.

  **Step 3: Harm & Dignity**
  *   **3.1 (Risk):** Emotional distress to grieving family.
  *   **3.3 (Objection):** **CRITICAL FLAG.** Family has explicitly requested anonymity based on his character ("private man").

  **Step 4: Necessity Test**
  *   **4.1 (Evidentiary Value):** Can you report the road closure, the market disruption, and the fact of a fatality without the name? Yes.
  *   **Result:** The name is **not necessary** to tell the story of the public disruption.

  **Step 5: Proportionality & "Tomorrow" Check**
  *   **5.1 (Disproportionate?):** Yes. The public benefit of knowing *who* died is negligible compared to the harm of violating the family's grief and the deceased's known wishes.
  *   **5.2 (Dignified Reason):** If the family asks, "Why did you name him when we begged you not to?", the only answer is "It's our policy." That is not a dignified reason.

  **Decision Point:** Step 4.
  **Procedure Answer:** **Do Not Name.** (Report the death, report the closure, omit the name).
  **Discomfort Check:** **Low/Medium.** The discomfort here is professional, not ethical. You have the name. It is "factually true." Withholding facts feels like censorship to some journalists.
  *Editorial Note:* The procedure highlights that "Truth" is not the only ethical value. "Dignity" competes with "Truth." The procedure correctly identifies that the *event* is news, the *identity* is private. The discomfort lies in resisting the industry default of "naming the dead."

  ---

  ### Limitations of this Procedure

  1.  **The "Tipping Point" is Subjective:** Step 5 asks you to weigh harm against benefit. There is no algorithm for that. Two editors may still weigh "Safeguarding" differently in Case 1. The procedure forces you to articulate the weight, not removes the need to lift it.
  2.  **Motive Assessment:** In Case 1, the procedure relies on you assessing the tipster's motive implicitly. If the tipster had provided evidence of *ongoing* risk, Step 2.1 would weigh heavier.
  3.  **Precedent:** This procedure does not account for "consistency with past stories." If you named a crash victim last week, not naming this one may look like bias. You must apply this protocol retrospectively to your general policy, not just ad-hoc.

  **Final Instruction:** Keep this sheet in the editorial conference. When a decision is contested, do not argue opinions. Argue the Steps. "I believe you failed Step 4: The name is not necessary for the story." This moves the argument from "I feel" to "The protocol requires."
