answer: |-
  Thank you. Thank you to the Department, to my family, and to everyone who loved him.

  Standing here to accept this on his behalf is the hardest thing I've ever had to do. I look at this medal, and I know what it represents to this room. To his crew, it's a recognition of the bond you share and the risks you take together. To my family, it's a tangible piece of him, a sign that his life mattered.

  I know my brother would have found a way to deflect this. He spent a lot of quiet time in the firehouse reading books on ethics and duty, thinking deeply about why we do what we do. He understood that running toward a fire isn't about glory. He knew that the fire doesn't care about labels. He knew that the flames decide the outcome, but the person decides the action.

  He didn't run that day because he wanted to be called a hero. He ran because there was a child in the car, and he was the one who could help.

  There is a temptation, in moments like this, to talk about fate or destiny. But he wouldn't have wanted that. He would have wanted us to talk about the choice. Because the choice is the only thing that was truly his. The risk was real, the danger was known, and the cost was possible. He accepted all of that before he ever opened the door.

  To his crew: You know better than anyone that coming home isn't guaranteed. You know that the only thing you control is showing up. You don't need a medal to know the value of what he did, and I know you don't need me to tell you what he meant to you. But I am grateful that you are here to honor the standard he set.

  To my family: We know his heart. We know that he was brave, not because he wasn't afraid, but because he didn't let fear make his decisions for him. We miss him. We miss his voice, his questions, and his quiet presence. That loss doesn't get easier with a ceremony, but I hope it helps to know that his final act was exactly who he was.

  He used to say that character isn't measured by how you survive, but by what you're willing to risk.

  I accept this medal not as a definition of how he died, but as a testament to how he lived. He was willing to run toward the danger when everyone else was running away. He was willing to pay the price for a stranger's life.

  I am proud to be his brother. I am proud of the choice he made. And I will carry him with me, not in this metal, but in the example he left behind.

  Thank you.
