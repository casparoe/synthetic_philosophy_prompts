      *   *Diagnosis:* The core tension is between *Source Compatibilism* (Cases 1-5) and *Leeway Incompatibilism* (Case 6).
      *   *Principle A (Compatibilist):* "Freedom is the unimpeded exercise of normal deliberative capacities."
          *   Matches: 1, 2, 3, 4, 5.
