prompt: |-
  I run the policy shop at a small nonprofit that builds short-term coalitions between groups that normally won't be in the same room — an animal-welfare group and a hunters' group, a religious-traditionalist group and a secular civil-liberties group, that kind of pairing. We get maybe one of these a month, and the stakes are high: coalitions fall apart, board members resign, the local paper writes about us. My staff are organizers, not philosophers, and the executive director wants a written procedure she can sign off on, not a seminar.

  Lately I've been reading about this idea called moral trade — the thought that two groups with very different moral views can each come out ahead by their own lights if they trade concessions: each gives ground on something it sees as relatively unimportant in exchange for the other side giving ground on something it sees as much more important. Neither side is compromising its core values; they're just trading on the basis of different priorities. I find the idea compelling but I have no idea how to actually run it.

  Could you turn moral trade into a decision procedure I can use? I want a checklist my team can run on a proposal in a few hours: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it hands the decision to a person because the step is a value judgment rather than a fact. Please deal with the hard cases: one side says an issue is an absolute and not up for trade; the two sides cant agree on any common scale; a trade helps both sides but harms a third party; one side's views are bad enough that dealing with them at all feels like legitimizing them; and both sides claim to care more about the same thing so there's no obvious swap. Then run the procedure on two or three worked examples, and make at least one of them a case where the procedure tells me not to do a trade I'd otherwise be tempted to make.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Policy shop director at a small nonprofit.
      *   **Mission:** Building short-term coalitions between ideologically opposed groups (e.g., animal welfare + hunters, religious + secular).
      *   **Constraints:** High stakes (coalition failure, board resignations, press scrutiny), staff are organizers (not philosophers), ED wants a written procedure (checklist), needs to be actionable in a few hours.
      *   **Core Concept:** Moral Trade (trading concessions based on differing priority intensities, not core values).
      *   **Deliverables:**
          1.  A step-by-step decision procedure/checklist.
          2.  Handling of hard cases (absolutes, incommensurable scales, third-party harm, legitimization risks, overlapping priorities).
          3.  Identification of "hand-off" points (where human judgment is needed vs. factual checks).
          4.  Worked examples (2-3), including at least one "stop" recommendation.

  2.  **Deconstruct "Moral Trade" for Practitioners:**
      *   Academic moral trade (e.g., Toddman, MacAskill) is often abstract. I need to operationalize it.
      *   Key mechanism: *Intensity mismatch.* Group A cares 10/10 about X, 2/10 about Y. Group B cares 2/10 about X, 10/10 about Y. Trade: A gets X, B gets Y.
      *   Risk: Perceived betrayal, reputational damage, ethical boundaries.

  3.  **Drafting the Procedure (The "Moral Trade Protocol"):**
      *   *Structure:* Needs to be linear, with clear "Stop/Go" gates.
      *   *Phases:*
          1.  Viability Scan (Is this even possible?)
          2.  Valuation Audit (Do the intensities actually match?)
          3.  Risk Assessment (Reputation, Third Parties, Absolutes)
          4.  Final Authorization (The ED/Board sign-off).
      *   *Hard Cases:* Need specific questions embedded in the phases to catch these.
          *   *Absolutes:* "Is this a sacred value?"
          *   *Third Party:* "Who loses out?"
          *   *Legitimization:* "Does this normalize harm?"
          *   *Overlap:* "Is there actually a surplus to trade?"

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1: The Sacred Value Check.* If either side says "This is non-negotiable," stop. Moral trade requires *some* flexibility, just not on core identity.
      *   *Step 2: The Intensity Mismatch.* This is the engine. Need to verify A cares more about X than B, and B cares more about Y than A.
      *   *Step 3: The Third-Party Harm.* Coalitions shouldn't externalize costs to vulnerable groups not at the table.
      *   *Step 4: The Legitimacy/Reputation Check.* Will this destroy the nonprofit's brand?
      *   *Step 5: The Implementation Plan.* How is it framed? (Crucial for organizers).

  5.  **Addressing the "Hand-off" Requirement:**
      *   I need to explicitly mark where the checklist ends and human judgment begins. Usually, this is at the "Reputation" and "Final Go/No-Go" stages.

  6.  **Developing Worked Examples:**
      *   *Example 1 (Success):* Classic mismatch. Hunters (access) vs. Animal Welfare (cruelty methods).
          *   Trade: Welfare gets ban on cruel traps; Hunters get guaranteed access zones.
      *   *Example 2 (Failure/Stop):* The "Legitimization" trap.
          *   Scenario: Civil Liberties + Hate Group.
          *   Trade: Free speech protection vs. Funding.
          *   Why stop? Reputational damage + Third party harm (targets of hate).
      *   *Example 3 (Nuanced/Overlap):* Both care about the same thing.
          *   Scenario: Housing. Developers vs. Tenants.
          *   Problem: Both want "More Housing" but define it differently.
          *   Resolution: Trade *timing* or *type* rather than *principle*. Or stop if no mismatch. Let's make this a "Stop" or "Modify" case to show the procedure's teeth. Actually, the prompt asks for at least one case where the procedure says *no* to a tempting trade. Example 2 is good for that. Let's make Example 3 a "Success but tricky" case to show utility.
          *   *Revision:* Let's do Example 3 as the "No Common Scale" hard case. Religious vs. Secular on education.
          *   *Wait, let's stick to the prompt's specific request:* "Make at least one of them a case where the procedure tells me not to do a trade I'd otherwise be tempted to make."
          *   *Selection:*
              1.  **Success:** Hunters vs. Animal Welfare (Classic intensity mismatch).
              2.  **Hard Stop (The "Tempting" One):** Civil Liberties vs. Extremist Group. (Tempting because it defends free speech principle, but procedure flags legitimization/third-party harm).
              3.  **Failure (No Mismatch):** Two Environmental Groups (One radical, one moderate). Both care most about the *same* specific outcome. No trade possible.

  7.  **Fleshing out the Content:**
      *   *Tone:* Professional, pragmatic, bureaucratic but ethical.
      *   *Formatting:* Clear headings, checkboxes, bold text for decision points.
      *   *Hard Case Integration:* Ensure the "Sacred Value" and "Third Party" questions are prominent.

  8.  **Review against Constraints:**
      *   *Time:* Can this be done in a few hours? Yes, if data is pre-gathered.
      *   *Staff:* Organizers, not philosophers. Avoid jargon like "utilitarian calculus." Use "Priority Ranking."
      *   *ED Sign-off:* Include a specific signature block.

  9.  **Final Polish:**
      *   Check the "Hand-off" points. Explicitly state: "Staff check facts; Director/ED makes value judgment."
      *   Ensure the "Stop" logic is clear. If any "Red Flag" is triggered, the process halts unless escalated.

  **(Self-Correction during drafting):** I initially thought about putting the "Legitimization" check at the end. It should be earlier. If the partnership itself is toxic, the trade doesn't matter. I'll move the "Partnership Viability" to Step 1.
  Also, I need to make sure the "Intensity Mismatch" is quantified simply. A 1-10 scale is standard for organizers.
  I need to be careful with the "Third Party" harm. In moral trade theory, this is often ignored, but for a nonprofit, it's critical. I will add a specific "Externalities" gate.

  10. **Finalizing the Output Structure:**
      *   Introduction (Setting the stage).
      *   The Protocol (The Checklist).
      *   Handling Hard Cases (Embedded in the protocol + explanation).
      *   Worked Examples (Success, Stop, No-Trade).
      *   Closing advice.

