answer: |-
  # The Moral Trade Protocol (MTP)
  **Version 1.0 | For Internal Use Only**

  **Purpose:** To evaluate potential coalition proposals between ideologically opposed groups using the logic of *moral trade* (trading concessions based on intensity of preference rather than core values).
  **Time Required:** 2–4 hours (excluding initial relationship building).
  **Decision Authority:** Policy Director (Recommendation) → Executive Director (Final Sign-off).

  ---

  ## Part 1: The Decision Checklist

  ### Phase 1: Partnership Viability (The "Legitimacy" Gate)
  *Before analyzing the trade, determine if the partnership itself is permissible.*

  **1.1 The Reputation Test**
  *   **Question:** If this coalition becomes front-page news, will our donors, board, or core beneficiaries view our organization as having endorsed the partner's *identity* (not just this specific deal)?
  *   **Pass:** The partnership can be framed as transactional ("working together on X") rather than affiliative ("allies on everything").
  *   **Fail:** The partner is widely designated as a hate group, violent organization, or fraud. The association would cause immediate, irreparable brand damage.
  *   **Action:** If **Fail**, **STOP**. Do not proceed. This is a value judgment for the Executive Director.

  **1.2 The Sacred Value Check**
  *   **Question:** Has either side explicitly stated that the issue to be traded is a "sacred value" (non-negotiable, moral absolute, identity-defining)?
  *   **Pass:** Both sides indicate flexibility on *specific mechanisms* or *priorities*, even if their broad ideologies differ.
  *   **Fail:** One side says, "We cannot discuss this," or "This principle is not for sale."
  *   **Action:** If **Fail**, **STOP**. Moral trade requires fungible preferences, not absolute prohibitions.

  ### Phase 2: The Intensity Audit (The "Engine")
  *Verify that a trade actually creates value. Moral trade only works if priorities are mismatched.*

  **2.1 Priority Ranking**
  *   **Task:** Ask each group to rank the two issues on the table (Issue A and Issue B) on a scale of 1–10 regarding *their* willingness to spend political capital.
  *   **Requirement:**
      *   Group 1 must rate Issue A significantly higher than Issue B (e.g., A=9, B=3).
      *   Group 2 must rate Issue B significantly higher than Issue A (e.g., A=2, B=9).
  *   **Pass:** A clear "cross-over" exists (Group 1 cares more about A; Group 2 cares more about B).
  *   **Fail:** Both groups care more about the *same* issue (e.g., both rate A higher than B), or the gap is too narrow (e.g., 6 vs 5) to sustain a concession.
  *   **Action:** If **Fail**, **STOP**. There is no surplus value to trade.

  **2.2 The Concession Verification**
  *   **Question:** Is what is being given up actually "cheap" for the giver but "expensive" for the receiver?
  *   **Pass:** Group 1 concedes on B (which they don't care about much) to get A (which they care about deeply).
  *   **Fail:** Group 1 is asked to concede on something they actually care about deeply, even if they claim otherwise. (Verify with past voting records or public statements).
  *   **Action:** If **Fail**, **STOP**. This is a bad deal, not a trade.

  ### Phase 3: Externalities & Harm (The "Third Party" Gate)
  *Moral trade can accidentally harm people not at the table.*

  **3.1 The Victim Check**
  *   **Question:** Does this trade solve the two groups' problems by exporting costs to a vulnerable third party not represented in the room?
  *   **Pass:** The costs are borne by the two coalition partners (e.g., money, time, minor policy adjustments).
  *   **Fail:** The trade harms a marginalized group, the environment, or the public good to satisfy the two partners (e.g., two zoning groups trade away affordable housing requirements).
  *   **Action:** If **Fail**, **STOP**. This is a value judgment for the Policy Director.

  **3.2 The Precedent Risk**
  *   **Question:** Does this deal set a precedent that enables future harm?
  *   **Pass:** The deal is explicitly ring-fenced as a one-off exception.
  *   **Fail:** The language creates a loophole that either side can exploit later to undermine core safety or rights.
  *   **Action:** If **Fail**, **STOP** or Require Legal Review.

  ### Phase 4: Final Authorization
  *If all checks pass, prepare the brief.*

  **4.1 The Narrative Frame**
  *   **Task:** Draft the press release language.
  *   **Requirement:** Must emphasize "Shared Specific Goal" not "Shared Values."
  *   **Hand-off:** Submit brief to Executive Director for final signature.

  ---

  ## Part 2: Handling Hard Cases (Protocol Notes)

  **1. "One side says an issue is absolute."**
  *   **Protocol:** Phase 1.2 (Sacred Value Check).
  *   **Guidance:** Do not try to persuade them to compromise on absolutes. That breaks trust. Look for a *different* issue to trade. If no other issue exists, there is no trade.

  **2. "The two sides can't agree on a common scale."**
  *   **Protocol:** Phase 2.1 (Priority Ranking).
  *   **Guidance:** They don't need to agree on *why* they care, only *how much*. Use "Political Capital" as the currency. Ask: "How many phone calls to legislators would you make for this?" If Group A says 100 calls for Issue X and Group B says 5 calls for Issue X, you have a scale.

  **3. "A trade helps both sides but harms a third party."**
  *   **Protocol:** Phase 3.1 (The Victim Check).
  *   **Guidance:** This is the most common ethical failure mode of moral trade. If the "surplus" comes from exploiting a silent stakeholder, the nonprofit must veto it. This protects your long-term integrity.

  **4. "One side's views are bad enough that dealing feels like legitimizing them."**
  *   **Protocol:** Phase 1.1 (The Reputation Test).
  *   **Guidance:** This is not a fact check; it is a strategic judgment. If the partner's *existence* is antithetical to your mission (e.g., a civil rights group partnering with a segregationist group on "property rights"), the trade is too costly. The ED decides this.

  **5. "Both sides claim to care more about the same thing."**
  *   **Protocol:** Phase 2.1 (Priority Ranking).
  *   **Guidance:** If both care most about Issue A, you cannot trade Issue A for Issue B. You must look for Issue C and D. If no mismatched priorities exist, you have a *conflict*, not a *trade opportunity*. Do not force it.

  ---

  ## Part 3: Worked Examples

  ### Example 1: The Success Case (Hunters vs. Animal Welfare)
  **Proposal:** State Hunting Association + State Animal Welfare League.
  **Issues:** (A) Ban on leg-hold traps. (B) Access to public lands on Sundays.

  *   **Phase 1 (Viability):**
      *   *Reputation:* Low risk. Both are established, legal organizations. Framing: "Conservation Partners." **(PASS)**
      *   *Sacred Values:* Hunters say "Access is vital." Welfare says "Cruelty is vital." Neither says the *other's* issue is an absolute sin, just a low priority. **(PASS)**
  *   **Phase 2 (Intensity):**
      *   *Welfare Group:* Ban Traps (10/10), Sunday Access (2/10).
      *   *Hunters Group:* Ban Traps (3/10), Sunday Access (9/10).
      *   *Mismatch:* Clear cross-over. **(PASS)**
  *   **Phase 3 (Externalities):**
      *   *Third Party:* No harm to public or animals (ban helps animals). **(PASS)**
  *   **Phase 4 (Auth):**
      *   *Frame:* "Common Ground for Conservation."
      *   **Result:** **PROCEED.** This is a textbook moral trade.

  ### Example 2: The "Tempting No" (Civil Liberties vs. Extremist Group)
  **Proposal:** Local ACLU Affiliate + "Free Speech absolutist" Group (known for hosting hate speakers).
  **Issues:** (A) Protecting speaker permits for controversial figures. (B) Zoning laws for protest camps.

  *   **Phase 1 (Viability):**
      *   *Reputation:* **HIGH RISK.** The partner group is frequently covered in local papers for inciting violence. Donors have previously threatened to pull funding if the nonprofit is seen "sharing a stage" with them.
      *   *Sacred Values:* The partner group views "absolute free speech" as sacred, including hate speech. The Civil Liberties group views "safety" as increasingly core.
      *   *Director Judgment:* Even if the legal principle is sound, the association legitimizes the partner's broader agenda. **(FAIL)**
  *   **Phase 2 (Intensity):**
      *   *Mismatch:* Exists. Civil Liberties cares more about Zoning (B); Partner cares more about Permits (A). **(PASS)**
  *   **Phase 3 (Externalities):**
      *   *Third Party:* The targets of the hate speech bear the cost of the trade. **(FAIL)**
  *   **Result:** **STOP.**
      *   *Why this is hard:* The Policy Director might want to proceed because the *legal principle* (free speech) is defensible. The MTP forces a stop because the *partnership cost* (legitimization + third party harm) outweighs the policy win. This protects the nonprofit from being used as a shield for harmful actors.

  ### Example 3: The "No Mismatch" (Two Environmental Groups)
  **Proposal:** Radical Climate Direct-Action Group + Moderate Conservation NGO.
  **Issues:** (A) Stopping a specific pipeline. (B) Protecting a local wetland.

  *   **Phase 1 (Viability):**
      *   *Reputation:* Moderate risk, but manageable. **(PASS)**
      *   *Sacred Values:* Both view "Stopping Climate Destruction" as existential. **(WARNING)**
  *   **Phase 2 (Intensity):**
      *   *Radical Group:* Stop Pipeline (10/10), Protect Wetland (8/10).
      *   *Moderate Group:* Stop Pipeline (9/10), Protect Wetland (10/10).
      *   *Mismatch:* **NONE.** Both groups care more about the Pipeline than the Wetland (or vice versa). There is no "I care less about this than you do" dynamic.
      *   *Analysis:* If they trade, one side must concede on their #1 priority. That is not a trade; that is a surrender.
  *   **Result:** **STOP.**
      *   *Why this is hard:* Organizers often want to force coalition because "they are both on the left." The MTP reveals there is no economic surplus to be gained from a trade. Forcing it will lead to resentment and coalition collapse later.

  ---

  ## Part 4: Implementation Notes for Staff

  1.  **Do not skip Phase 1.** It is tempting to jump straight to the policy details (Phase 2). If the partnership is toxic, the policy details do not matter.
  2.  **Verify Intensity privately.** Do not ask groups to rank priorities in the same room. They will posture. Interview them separately.
  3.  **The "Stop" is a success.** Identifying a bad coalition before it launches saves the organization reputational capital. Marking a file "No Trade Possible" is a valid outcome.
  4.  **Escalation.** If you are unsure about Phase 1 (Reputation) or Phase 3 (Third Party Harm), escalate to the Executive Director immediately. Do not make these calls alone.

  **Approved By:** ______________________ (Executive Director)
  **Date:** ______________________
