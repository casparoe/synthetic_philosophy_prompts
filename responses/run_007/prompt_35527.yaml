          3.  Identify points of disagreement (Content, weight, bearer of obligations).
          4.  Evaluate explanatory power of each framework (Political reality vs. moral arbitrariness; handling the collective action problem).
          5.  Reverse analysis: What does the episode reveal about the *adequacy* of the positions? (Enlightened self-interest convergence, internal tensions).
          6.  Conclusion: Is the dichotomy inadequate? Is a third framework needed?

  2.  **Drafting - Section by Section:**

