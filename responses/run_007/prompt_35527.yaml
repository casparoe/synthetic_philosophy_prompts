      *   *Refining the Partialist Argument:* Make sure not to strawman the partialist. A sophisticated partialist (like Miller or Walzer) acknowledges some duties to outsiders. The critique should be on the *excess* (hoarding 400% of need).
      *   *Refining the Cosmopolitan Argument:* Acknowledge the "feasibility" objection. Cosmopolitans often get criticized for being utopian. Address how the pandemic showed the *necessity* of cosmopolitanism for survival, not just morality.

  4.  **Final Review against Prompt:**
