      *   **Section 1: The Compatriot-Partialist Analysis:**
          *   *Core Principle:* Government is an agent of its citizens. Social contract theory. Priority to those who fund/authorize the state.
          *   *Application:* Advance purchase agreements are justified. "Charity begins at home."
          *   *Limits:* Is it absolute? Most partialists aren't *unlimited* partialists. If helping others costs nothing (or very little), maybe help. But here, there was perceived risk.
          *   *Verdict:* Justifies priority, but maybe not *hoarding* (several times over population) if it leads to greater harm back home (variants). The export controls might be harder to justify if they hinder global supply without helping domestic supply significantly.
          *   *Nuance:* The "self-defeating" aspect. If hoarding causes variants that hurt compatriots, partiality actually argues *against* hoarding.

      *   **Section 2: The Strict Cosmopolitan Analysis:**
          *   *Core Principle:* Moral worth is independent of borders. Nationality is morally arbitrary (Rawlsian "natural lottery").
          *   *Application:* Vaccines should go to highest risk/need globally, not highest bidder. COVAX should have been prioritized over bilateral deals.
          *   *Verdict:* The distribution was a moral catastrophe. Wealthy nations treated vaccines as property rather than public goods.
          *   *Disagreement Points:*
              *   *Content:* Partialists say "protect us first." Cosmopolitans say "protect the most vulnerable first, regardless of location."
              *   *Weight:* Partialists give heavy weight to special relationships. Cosmopolitans give them little to no weight.
              *   *Bearers:* Partialists focus on *states*. Cosmopolitans focus on *individuals/institutions* globally.

      *   **Section 3: Explanatory Power & Silence:**
          *   *Partialism Strengths:* Explains *why* governments acted this way (elections, accountability). It captures the political logic.
          *   *Cosmopolitan Strengths:* Captures the *moral outrage*. Explains why the disparity felt unjust. Highlights the arbitrariness of birth determining life/death.
          *   *Silence/Weakness:*
              *   *Partialism:* Struggles with the *interconnectedness* of the pandemic. If the virus ignores borders, does the state boundary matter for health security?
              *   *Cosmopolitanism:* Struggles with *feasibility*. Who enforces this? It lacks a mechanism for implementation in a world of sovereign states.
              *   *Collective Action:* Partialism misses the "we sink together" aspect unless framed as enlightened self-interest. Cosmopolitanism sees it but lacks the lever to fix it.

      *   **Section 4: Adequacy of Positions (The Reverse Analysis):**
          *   *Convergence:* Enlightened self-interest (stop variants) aligned with cosmopolitan morality (save everyone).
          *   *Implication:* Does this help Cosmopolitanism? It shows cosmopolitan outcomes aren't always sacrificial. *However*, wealthy nations *still* didn't do it until variants threatened them. This suggests self-interest drove the train, not morality. This might weaken Cosmopolitanism's claim that moral duty alone is sufficient.
          *   *Tensions in Partialism:* "Protect our own" vs. "Protecting our own requires protecting others." The hoarding (3x-4x doses) was irrational even by partialist standards if it prolonged the pandemic.
          *   *The Dichotomy:* Is it binary? Maybe not.

      *   **Section 5: Towards a Third Framework?**
          *   *Global Institutionalism / Thin Cosmopolitanism:* We need institutions that align self-interest with global good *before* the crisis.
