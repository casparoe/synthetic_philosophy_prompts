      *   *Nuance:* Ulysses contracts (3) are often about *evidence* (blocking apps), not just credences. If I block the app, I don't get the evidence, so I don't update. My future credence stays the same. That's consistent with Reflection. But if I *do* get evidence and update badly (fever), that's where Reflection breaks. I need to make sure I distinguish these.

  9.  **Final Polish:** Ensure the ranking is clear and the "Single Revision" is actionable. (The revision is to qualify Reflection).

      *(Self-Correction on Claim 5)*: Claim 5 says "(1) and (2) are basically a package deal... anyone who accepts (1) is more or less committed to (2) automatically." This is the specific technical error. Conditionalization *entails* Reflection *only if* you are certain you will conditionalize. If you acknowledge (4), you are *not* certain you will conditionalize. So (1) + (4) $\rightarrow$ ~(2).

