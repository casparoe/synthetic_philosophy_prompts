answer: |-
  You are looking for a principle that reconciles your intuition that **Case 1** demands conciliation while **Cases 2–6** demand steadfastness. The tension you feel, particularly between Case 1 (climate models) and Case 6 (moral policy), is not a bug in your reasoning; it is a feature of how different kinds of knowledge work.

  There is a single principle that captures all six verdicts without forcing you to abandon any. I call it **The Principle of Opaque Mediation in Objective Domains.**

  ### The Principle

  **You should revise your credence toward a peer's view only when three conditions are met simultaneously:**
  1.  **Objectivity:** The question concerns a mind-independent fact (an "is" question, not an "ought" or "taste" question).
  2.  **Mediation:** The judgment is produced by a complex process or tool rather than direct perception or calculation.
  3.  **Opacity:** You lack the capacity to evaluate the specific steps of that process to identify who is in error.

  If any of these three conditions fails, you are epistemically entitled to remain steadfast.

  ### Applying the Principle to Your Six Cases

  Here is how the principle maps onto your verdicts:

  *   **Case 1 (Climate Sensitivity): Conciliate.**
      *   *Objectivity:* Yes (physical reality).
      *   *Mediation:* Yes (complex climate models).
      *   *Opacity:* Yes ("I cannot read their models").
      *   *Result:* The disagreement signals structural uncertainty in the tools themselves, not just human error. Since you cannot adjudicate the tools, the disagreement itself becomes data. You report the range.

  *   **Case 2 (Restaurant Bill): Steadfast.**
      *   *Objectivity:* Yes (mathematical fact).
      *   *Mediation:* No (direct arithmetic).
      *   *Opacity:* No (you checked the receipt twice).
      *   *Result:* Fails Mediation and Opacity. Math is deterministic; if you checked your work, the disagreement implies your friend made a performance error, not that the "true sum" is somewhere in between.

  *   **Case 3 (Voting Reform): Steadfast.**
      *   *Objectivity:* Yes (empirical turnout).
      *   *Mediation:* Yes (statistical papers).
      *   *Opacity:* **No** ("I have read both papers... one's strategy strikes me as plainly more credible").
      *   *Result:* Fails Opacity. You have exercised evaluative access. You are not deferring to the *person*; you are deferring to the *method* you have judged to be superior.

  *   **Case 4 (Novel Aesthetics): Steadfast.**
      *   *Objectivity:* **No** (subjective taste).
      *   *Result:* Fails Objectivity. Aesthetic disagreement does not imply error; it implies difference. There is no "true" midpoint between two tastes.

  *   **Case 5 (Source Truthfulness): Steadfast.**
      *   *Objectivity:* Yes (factual state of the source).
      *   *Mediation:* **No** (immediate perception/intuition).
      *   *Result:* Fails Mediation. While you cannot articulate *why* you think he is lying, this is a perceptual judgment (like seeing a facial expression), not a constructed model. In perceptual disagreements, we do not average views ("he is 50% lying"); we assume one observer missed a cue. Your gut instinct counts as direct access.

  *   **Case 6 (Moral Policy): Steadfast.**
      *   *Objectivity:* **No** (normative value).
      *   *Result:* Fails Objectivity. This is the asymmetry that bothered you. Case 1 is about *prediction* (what the world will do); Case 6 is about *prescription* (what the world should do). Disagreement in Case 1 suggests hidden complexity in the system. Disagreement in Case 6 suggests divergent weightings of values. You are not required to average your values.

  ### Why This Principle Works for You

  This principle resolves your specific anxiety about the asymmetry between Case 1 and Case 6. It clarifies that you are not being inconsistent; you are tracking the difference between **empirical uncertainty** (Case 1) and **normative divergence** (Case 6).

  In Case 1, the disagreement tells you something about the *world* (that it is hard to model). In Case 6, the disagreement tells you something about the *people* (that they value different things). As a journalist covering science, your duty in Case 1 is to map the uncertainty of the system. In Case 6, your duty is to articulate a coherent moral argument.

  ### The New Case: The Film Critics

  **The Scenario:** Two equally capable film critics disagree about whether a movie is worth seeing. You must decide whether to go tonight.

  **Application of the Principle:**
  1.  **Objectivity:** **No.** "Worth seeing" is ultimately an aesthetic judgment (like Case 4), even if dressed up as expert advice.
  2.  **Mediation:** Yes (they watched and analyzed the film).
  3.  **Opacity:** Likely Yes (you haven't seen it).

  **Verdict:** **Steadfast (with caveats).**

  Because the domain is aesthetic (failing the Objectivity test), you should not conciliate by assuming the "truth" is that the movie is mediocre. There is no objective midpoint between "masterpiece" and "trash."

  However, because the judgment is *mediated* by experts you respect, the disagreement provides **meta-information**. It tells you the film is polarizing.

  **Actionable Rule:**
  Do not split the difference (i.e., do not assume the movie is "okay"). Instead, treat the disagreement as a signal of **variance**.
  *   If you generally enjoy divisive, challenging art, the disagreement is a reason to **go**.
  *   If you prefer reliable, consensus entertainment, the disagreement is a reason to **stay home**.

  You are not revising your view of the movie's quality (you have none yet); you are revising your expectation of the *experience*. The principle protects you from thinking there is a "correct" average rating, while still allowing you to use the experts' disagreement as data about the film's nature.

  ### Summary for Your Work

  As a science journalist, you can use **The Principle of Opaque Mediation** as a checklist before writing a "he said, she said" story:

  1.  **Is this a factual claim?** (If no, don't conciliate; explain the values.)
  2.  **Is the reasoning visible?** (If yes, adjudicate the methods, don't just split the difference.)
  3.  **Is the uncertainty in the tools?** (If yes, report the range.)

  This allows you to be humble before complex science (Case 1) without being paralyzed before moral or aesthetic debates (Cases 4 & 6), and without undermining your own capacity to evaluate evidence (Cases 2 & 3).
