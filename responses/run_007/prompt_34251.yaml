prompt: |-
  so in my ethics class we were discussing deontology and someone made this point: deontological constraints are like the rules of a game, say football. you can't commit a foul to stop the other team from committing an even worse foul — that would be absurd, you'd be undermining the very point of having rules. and they said that's why it's not a "paradox" that deontology says you shouldn't kill one person to prevent five murders: you're just respecting the rule against killing, and breaking it to prevent other killings would be incoherent in the same way.

  i'm not sure this analogy is doing the work they think it is. can you walk me through what maps onto what — the referee, the players, the foul, the scoreline, the rulebook, the whole point of the game — and then tell me where the mapping breaks? in particular, i want to know whether the analogy smuggles in assumptions about who the "referee" is in the moral case, or about what the "point of the game" amounts to, that a consequentialist would just reject. and i want to know whether the conclusion — that it's not paradoxical to stick to the rule even when breaking it would prevent more violations — survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time.

  also, i'm especially interested in whether there's a better analogy for the deontologist here — something that captures the intuition without the baggage — or whether the fact that the football analogy is tempting tells us something about the underlying appeal of deontology that we should be suspicious of.

  oh and please write the answer in british english.
