prompt: |-
  I've been going back and forth with my brother-in-law (who's a programmer, not a biologist) about whether viruses are alive, and he's got this analogy he wont stop leaning on. He says a biological virus is exactly like a computer virus: it's just a bit of code — DNA or RNA wrapped in protein — that sits there inert until it finds the right host, at which point it hijacks the host's machinery to make copies of itself. It doesn't eat, it doesn't grow, it doesn't respond to its environment except in the most mechanical way. A computer virus does the same thing: it's just instructions that exploit a host system to replicate. If we wouldn't call a computer virus alive, he says, we shouldn't call a biological virus alive either — the underlying logic is identical, and the fact that one runs on silicon and the other on carbon is a distraction.

  I've tried pushing back: biological viruses evolve by natural selection, they're part of a phylogenetic tree, they have a physical structure that's more than just information, and so on. But he says those are just "implementation details" and the core analogy holds. I'm not satisfied, but I'm also not sure I can articulate exactly where the analogy breaks in a way that matters for the definition-of-life question.

  So I'd like you to audit the analogy properly. Give me the full mapping: what corresponds to what — the viral genome to the code, the capsid to the file wrapper, the host cell to the computer, the lytic cycle to execution, the dormant virion to the stored program. Then walk me through the disanalogies, and crucially, separate the ones that are incidental from the ones that genuinely matter for whether we should call the thing alive. Does the conclusion survive the disanalogies, or was the analogy smuggling in a verdict from the start? And if you think there's a better analogy out there — one that captures what's weird about viruses without begging the question — I'd like to hear it.

  One more thing: I want you to tell me where you're least confident in this analysis. What's the argument or consideration that would most likely change your mind about whether the analogy works, and where in the mapping do you think your reasoning is shakiest? Like, if a virologist read your answer, what's the part she'd roll her eyes at?
