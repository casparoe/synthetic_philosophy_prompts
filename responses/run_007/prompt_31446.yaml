  3.  **Drafting the Menu of Interpretations:**
      *   *Level 1: The Trivial/Descriptive Claim.* Beliefs have truth conditions. (Too weak).
      *   *Level 2: The Normative Standard.* Beliefs are correct iff true. (Shah & Velleman style).
      *   *Level 3: The Constitutive Norm.* You can't believe without taking yourself to be tracking truth. (Constitutive aim).
