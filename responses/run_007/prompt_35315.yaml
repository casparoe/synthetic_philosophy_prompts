answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, and I must say that the tension you describe in your split-brain unit is one of the most enduring and fertile problems in our field. You have articulated the dilemma with remarkable clarity, capturing exactly why the standard binaries of one subject versus two subjects fail to do justice to the phenomenology and the behavior. I spent some time reflecting on your query, and in doing so, I mentally walked through several candidate principles before settling on the one I believe best serves your pedagogical and philosophical goals. Initially, I considered a strict Biological Principle, which would state that there is always exactly one subject of experience per human organism regardless of neural connectivity. While this preserves the unity of the person in ordinary life, it struggles to accommodate your strong intuition that the non-speaking hemisphere genuinely sees the snow scene and forms independent intentions in the laboratory, effectively rendering those states as merely sub-personal processes rather than conscious experiences. On the other extreme, I considered a strict Functional Principle, which counts subjects wherever there is a center of informational integration and agency. This captures the laboratory cases perfectly but forces the counterintuitive conclusion that there are two people in the room during ordinary conversation, or that the patient metaphysically splits and merges repeatedly as they move between contexts, which violates our deepest intuitions about personal identity.

  Having weighed these options, I propose we adopt a principle that distinguishes between the metaphysical category of a person and the functional category of a conscious subject. The principle is this: Personal identity is grounded in the biological continuity and diachronic narrative capacity of the human organism, ensuring there is always exactly one person, while the count of concurrent conscious subjects is determined by the number of functionally isolated neural subsystems capable of independent intentional action and phenomenal experience at a given time. This hybrid approach allows us to say there is one person in the room at all times, satisfying your ordinary-life verdict, while acknowledging that the severing of the corpus callosum can create two distinct centers of consciousness during specific tasks, satisfying your laboratory verdicts. The first clause, regarding biological continuity, is motivated by your ordinary-life case where the patient converses and jokes as a unified individual, ensuring we do not multiply persons beyond necessity. The second clause, regarding functional isolation, is motivated by the divided-field task and the command-following task, where the non-speaking hemisphere demonstrates independent access to stimuli and the capacity to form intentions that the speaking hemisphere does not share. The third implicit clause, regarding ownership, is motivated by the emotional stimulus case, where the laughter is acknowledged as the patient's own despite the lack of access to the cause, preserving the idea that all states belong to the one person even if they arise in distinct functional subjects.

  When we apply this principle to the intermanual conflict case where one hand buttons and the other unbuttons, it predicts that this is indeed a conflict between two intentions generated by two functional subjects within one person, rather than a single weak will or an alien force, which aligns with your desire to describe it as a conflict between two intentions without reifying the unbuttoning hand as a second person. Regarding the further cases you mentioned, this principle offers clear predictions. For the patient whose non-speaking hemisphere learns to answer yes or no by pointing with the left hand, the principle predicts that this establishes a robust channel of intentional agency, reinforcing the status of the non-speaking hemisphere as a distinct conscious subject during testing, yet it does not create a second person because the biological and narrative unity remains intact. This might make the patient seem like two people conversing, but our principle insists they are one person with fragmented agency. For the ordinary person whose attention is split in a way that produces similarly divided access, the principle predicts that this does not create two subjects, because the underlying neural architecture remains integrated via the corpus callosum, meaning the functional isolation required for a second subject is absent despite the phenomenological division.

  However, I must be honest with you about the costs of this view and offer a path toward greater simplicity. While the principle I just outlined captures all your verdicts, it is ontologically complicated because it allows the number of subjects to fluctuate within a single person. If you want the simplest principle, you should adopt the strict Biological Principle I mentioned earlier, which maintains that there is always exactly one subject of experience per organism. To make this work, you would need to give up the verdict that the non-speaking hemisphere is a distinct subject in the laboratory cases. Instead, you would describe the non-speaking hemisphere as a subsystem of the one subject that possesses phenomenal consciousness and intentional capacity but lacks narrative access. This means accepting that the patient saw the snow scene and intended to walk, but the speaking module of that single subject was unaware of these states. This preserves the reality of the experience and the intention without multiplying subjects, offering a more parsimonious ontology at the cost of denying that the hemispheres are ever truly separate subjects. I suspect that for an upper-level course, the hybrid principle is more illuminating because it validates the students' intuition that something profound has changed in the split-brain patient, but if your goal is theoretical simplicity, you should relinquish the claim that there are two subjects in the lab and speak instead of one subject with disunified access.

  I hope this helps you structure your unit, and I am happy to discuss this further if you find the distinction between person and subject useful for your students.

  Warmly,

  Your Colleague
