answer: |-
  # Colloquium Q&A Prep Sheet
  **Thesis:** Hypocritical blame lacks standing because it is an Austinian misfire of a demand for moral repair, not a defect in truth or epistemic position.

  ## Part 1: The Objections (Ordered by Damage Potential)

  ### 1. The "Fiction" Objection
  **Camp:** Senior Consequentialist
  **Phrasing:** "You're building a cathedral on a foundation of sand. Blame is a tool for regulating behavior and maintaining social norms. If a hypocrite's blame successfully deters a wrongdoer or reinforces a norm, it has done its job. 'Standing' is just a deontological fetish. Why should we care about the purity of the blamer's relation if the outcome is good?"

  **Your Reply:**
  "Because blame is not merely a causal lever; it is a communicative act. If I drug you to stop you from smoking, I've shaped your behavior, but I haven't *blamed* you. Blame addresses the agent as a participant in a normative community. That address requires a specific channel to be open. When a hypocrite blames, they attempt to use a channel they have themselves severed. The 'outcome' might be behavioral compliance, but it is no longer moral recognition. My account preserves the distinctiveness of moral blame against mere behavioral conditioning. If we discard standing, we discard the idea that blame is something we *owe* each other as rational agents, reducing it to social engineering."

  **Weakness:** This relies on the Consequentialist accepting that "communication" has intrinsic value independent of outcomes. If they dig in on "only consequences matter," you have no common ground.

  ### 2. The "Deflection" Objection
  **Camp:** Feminist Philosopher
  **Phrasing:** "I worry your account gives ammunition to bad actors. In practice, crying 'hypocrisy' is often used to silence legitimate criticism, especially from marginalized groups. If you grant that hypocritical blame is a 'misfire' or 'void,' aren't you validating the move where a harasser says, 'You slept with someone too, so you can't accuse me of harassment'? How does your view prevent standing from becoming a shield for the guilty?"

  **Your Reply:**
  "My account distinguishes between the *validity of the demand* and the *truth of the accusation*. When I say the blame misfires, I mean the hypocrite cannot demand *repair*, not that the wrong didn't happen. The harasser in your example is still guilty. My view actually explains *why* the deflection feels potent—it points to a real normative defect in the interaction—without conceding that the original accusation was false. We must teach that lacking standing to *demand repair* does not equate to moral innocence. The hypocrite remains liable to blame from others who *do* have standing. My theory describes the defect; it does not prescribe silence."

  **Weakness:** You are relying on the audience to maintain a distinction between "your blame is void" and "you are off the hook." In the heat of real social conflict, these often collapse.

  ### 3. The "Authority" Objection
  **Camp:** Kantian Cluster
  **Phrasing:** "You say this isn't about authority, but it sounds exactly like a Kantian account of authority. If I violate a maxim, I cannot will it as a universal law, and thus I lose the authority to enforce it. You're dressing up the Categorical Imperative in speech-act clothing. Why isn't 'standing' just 'moral authority,' and why isn't your 'misfire' just 'contradiction in will'?"

  **Your Reply:**
  "Because authority implies a status one *has*, whereas standing is a relation one *occupies*. A Kantian account focuses on the blamer's internal consistency with the law. My account focuses on the interpersonal transaction of *repair*. I can be internally consistent yet still lack standing if I have no relationship of mutual accountability with you. Conversely, I might violate a norm but retain standing if I acknowledge my violation and seek repair. The Kantian view makes standing a monadic property of the blamer; I am arguing it is a dyadic property of the relationship. The misfire occurs not because I broke a rule, but because I cannot simultaneously demand repair from you while owing it myself for the same act."

  **Weakness:** The distinction between "status" and "relation" is subtle. If they press that the "relation" is constituted by "respect for the law," you risk collapsing back into their view.

  ### 4. The "Unfairness" Objection
  **Camp:** Relational Theorists (Second-Personal)
  **Phrasing:** "We agree blame is relational. But usually, we think the problem with hypocrisy is that it treats the blamee unfairly—it creates an unjustified hierarchy. Why isn't the complaint simply that the blamee is being wronged by the unfairness of the demand? Why do we need this extra layer of 'misfire' rather than just saying the blamee has a right to reject unfair treatment?"

  **Your Reply:**
  "Because 'unfairness' suggests the demand is too heavy or arbitrary. But the hypocrite's demand might be perfectly proportionate. The problem isn't the weight of the demand; it's the *source*. If I demand you pay a debt I also owe, the injustice isn't just that I'm treating you unfairly; it's that I am invoking a norm of solvency that I am currently violating. The 'misfire' captures the idea that the speech act itself is defective, not just the distribution of burdens. The blamee isn't just owed fair treatment; they are owed a *genuine* address. A hypocrite offers a simulacrum of address. That is a distinct wrong from unfairness."

  **Weakness:** You must walk a tightrope to show how this "distinct wrong" isn't just a subset of unfairness. If they argue all relational wrongs are unfairness, you lose the distinction.

  ### 5. The "Defeater" Objection
  **Camp:** Philosopher of Language
  **Phrasing:** "You're invoking Austin to do heavy lifting. But why is this a 'misfire' rather than a 'conversational defeater'? A defeater explains why we reject the claim without needing to say the speech act failed to occur. Calling it a misfire seems like metaphysical overkill for what is just a pragmatic block on acceptance."

  **Your Reply:**
  "Because a defeater suggests the act occurred but its force is neutralized. A misfire says the act *did not occur*. When a hypocrite blames, they aren't issuing a blame that we then reject; they are failing to issue blame at all. This matters for the record. If it's a defeater, the blame exists and needs rebutting. If it's a misfire, there is nothing to rebut. This aligns with our intuition that we don't argue with hypocrites; we dismiss them. The Austinian framework captures the *nullity* of the act, which a pragmatic defeater account leaves too ambiguous."

  **Weakness:** Austin's "misfire" is a technical legalistic concept. If they press on the precise felicity conditions of blame, you might not have a detailed enough linguistics of blame to back it up.

  ### 6. The "Truth" Objection
  **Camp:** Agnostic / General
  **Phrasing:** "You say the content of the blame can be perfectly true. But if the speech act misfires, what is the status of the proposition expressed? If I say 'I promise' without intending to, Austin says the promise is void. But if a hypocrite says 'You wronged me,' and it's true, in what sense is the 'blame' void? Are you separating the constative from the performative too sharply?"

  **Your Reply:**
  "I am separating the *assertion of fact* from the *demand for repair*. The constative ('You did X') remains true. The performative ('I hold you accountable/repair is owed') misfires. Blame is a hybrid. The hypocrite gets the fact right but fails the function. This is why we can agree the hypocrite is right about the facts but still say they have no business saying it. The 'void' applies to the normative force, not the descriptive content."

  **Weakness:** Some theorists argue blame is *essentially* the fusion of these two. If they argue you can't separate the fact from the holding-accountable, your hybrid model fractures.

  ### 7. The "Minor Hypocrisy" Objection
  **Camp:** Agnostic / Scope
  **Phrasing:** "Does this apply to all hypocrisy? If I speed on the way to tell you not to speed, do I lack standing? That seems too strong. We usually think standing is lost only in cases of serious or relevant hypocrisy. Where is the threshold on your view?"

  **Your Reply:**
  "The threshold is relevance to the demand for repair. If the norm I am invoking is one I am currently flouting in a way that suggests I do not take it seriously as a binding norm, I lack standing. Minor infractions might not undermine the seriousness of the demand. But if my violation signals that I regard the norm as optional for myself, I cannot demand it as obligatory for you. It's not about the severity of the sin, but the sincerity of the commitment to the norm underlying the demand."

  **Weakness:** "Sincerity of commitment" is hard to judge from the outside. This invites epistemic worries you tried to avoid.

  ### 8. The "Ressentiment" Objection
  **Camp:** Nietzschean
  **Phrasing:** "This whole debate smells of *ressentiment*. The weak invent 'standing' to protect themselves from the strong. You are codifying the right of the guilty to silence the accuser by focusing on the accuser's purity. Is this not just moralistic judgment masquerading as linguistic analysis?"

  **Your Reply:**
  "No, because standing protects the *norm*, not the individual. By insisting that only those committed to a norm can enforce it, we protect the norm from degradation. If anyone can enforce norms regardless of their own conduct, norms become mere weapons of power. My account demands that blamers put their own house in order, which is the opposite of protecting the weak; it is a demand for higher integrity from the moral community. It prevents morality from becoming a tool of domination by those who do not believe in it."

  **Weakness:** The Nietzschean can simply reply that "protecting the norm" is itself a power move. You cannot win this on their turf; you can only show internal consistency.

  ---

  ## Part 2: The Prayer Nobody Asks

  **The Question:**
  "If standing is a normative relation between blamer and blamee, **can the blamee waive it?** If I know you are a hypocrite, but I *want* you to blame me because I value your insight, can you successfully blame me? If yes, doesn't that make standing a matter of the blamee's permission rather than an Austinian condition? If no, aren't you disrespecting the blamee's agency?"

  **Why it is Dangerous:**
  This question pits the **Relational/Second-Personal** aspect of your view against the **Austinian** aspect.
  *   If you say **Yes (they can waive it):** You concede that standing is ultimately up to the blamee's discretion. This undermines the "misfire" claim. If the blamee accepts the demand, the speech act *fired*. This moves you closer to the Relationalists who say it's about what is owed, and away from the idea that the act itself is void. It makes standing contingent on uptake, not conventional conditions.
  *   If you say **No (they cannot waive it):** You risk sounding paternalistic. You are telling the blamee they cannot accept a demand they wish to accept. This alienates the Relational theorists who prioritize the agency of the participants in the relationship. It suggests the "conventional conditions" are external to the relationship, which contradicts your claim that standing is a relation *between* them.

  **Your Committed Reply (The Hard Line):**
  "They cannot waive it, because the misfire is not about their acceptance, but about the *capacity to obligate*. Even if you accept my demand, if I am a hypocrite regarding that norm, I cannot place you under an obligation of repair. You might feel guilt, or you might choose to make amends, but you are not *obligated by my demand*. To say otherwise is to confuse psychological influence with normative authority. I can influence you to change, but I cannot bind you. Standing is the power to bind, and that power is not subject to waiver because it is not mine to give—it is derived from the norm we both share."

  **Why this is risky:** It draws a hard line between "psychological influence" and "normative binding" that some (especially the Consequentialist and Relationalists) may deny exists. If they argue that "being bound" just *is* "accepting the influence," your distinction evaporates. But you must hold this line to preserve the Austinian nature of the misfire.
