      *   **Audience:** 15 people. Specific clusters: Kantians (authority), Relational/Second-Personal (what is owed/unfairness), Philosopher of Language (speech acts/conversational defeaters), Feminist (weaponization/deflection), Consequentialist (blame as tool/standing is fiction), Agnostics (x3), Nietzschean (ressentiment).
