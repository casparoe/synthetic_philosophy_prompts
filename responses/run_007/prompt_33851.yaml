prompt: |-
  I am a professor of philosophy and a member of my university's academic integrity board. We adjudicate cases of plagiarism, exam cheating, falsified data, and unauthorized collaboration, and we recommend sanctions up to and including expulsion. The board's deliberations almost always turn on character: we ask whether the student shows remorse, whether this was a one-time lapse or points to a pattern, whether the student is the kind of person who would do this again. I have taught the situationist critique of virtue ethics for years — the work of John Doris and Gilbert Harman, the Milgram obedience experiments, the Darley and Batson Good Samaritan study, the finding that discovering a dime in a phone booth dramatically increases helping behavior — and I have grown increasingly uncomfortable sitting in these hearings watching my colleagues draw exactly the kind of cross-situational character inferences that the situationist evidence calls into question.

  But I cannot simply tell the board that stable character traits are a fiction and we should stop making judgments. We still have to decide cases. What I need is a decision procedure that takes the situationist critique seriously without being paralyzed by it.

  Please write me a procedure our board can follow, grounded in what the situationist critique actually licenses and what it does not. The procedure should be a sequence of questions we ask about each case, in order, with guidance on what counts as a sufficient answer to each question. It should force us to check for situational explanations before we reach for character explanations, and it should tell us at what point the residual — what remains after we have accounted for the situation — is serious enough to warrant a sanction. It should flag the steps where the procedure cannot eliminate judgment and a human being must decide.

  Then apply the procedure to three hypothetical cases:

  1. A first-semester freshman copied a paragraph from an online source without attribution in a paper for a course in which the professor never discussed citation standards, the class had four hundred students, and the student had no prior record.

  2. A senior paid someone to write a paper for them in a small upper-division seminar whose professor had discussed academic integrity on the syllabus and in the first class session, and the student had previously been warned for minor plagiarism in another course.

  3. A student with a clean prior record texted exam answers to a friend during a remotely proctored exam. The course had shifted to remote format mid-semester because of a public health emergency, the exam instructions did not address collaboration, and the student had no prior infractions.

  For each case, tell me where the procedure lands, and flag whether the answer is one the board will find uncomfortable. Finally, tell me what the procedure cannot do: what kinds of cases it will mishandle, what assumptions it smuggles in, and what a virtue ethicist would say we have lost by adopting it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Professor of Philosophy, Member of Academic Integrity Board.
      *   **Context:** Adjudicates plagiarism, cheating, etc. Board relies heavily on *character judgments* (remorse, pattern, "kind of person").
      *   **Conflict:** User teaches Situationist Critique of Virtue Ethics (Doris, Harman, Milgram, Darley/Batson) which argues against stable cross-situational character traits. User feels hypocritical/uncomfortable using character judgments in hearings.
      *   **Constraint:** Cannot simply abolish judgment (cases must be decided). Needs a *decision procedure* that respects situationism but allows for sanctions.
      *   **Deliverables:**
          1.  A step-by-step decision procedure (sequence of questions, guidance, flags for human judgment).
          2.  Application to three specific hypothetical cases.
          3.  Critique of the procedure (limitations, hidden assumptions, virtue ethics counter-argument).

  2.  **Deconstruct the Situationist Critique (Philosophical Grounding):**
      *   *Core Claim:* Global character traits (honesty, courage) do not exist in a robust, cross-situational sense. Behavior is better predicted by situational features than by traits.
      *   *What it licenses:* It does *not* say behavior is random or determined solely by the situation in a way that removes agency. It says we should be skeptical of inferring *future* behavior from *past* behavior across *different* situations. It emphasizes looking for situational诱因 (triggers/causes).
      *   *What it doesn't license:* It doesn't mean "no one is responsible." It doesn't mean "sanctions are useless." Sanctions can be viewed as modifying future situations or consequences, not punishing "bad souls."
      *   *Goal:* Shift focus from "Who *is* this student?" to "What happened, why did the situation allow/encourage it, and how do we prevent recurrence?"

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Prioritize situational analysis before character attribution.
      *   *Step 1: Factual Establishment.* Did the violation occur? (Binary, necessary).
      *   *Step 2: Situational Audit.* What features of the context made this likely? (Clarity of rules, stress, ambiguity, peer behavior). *Situationist Core.*
      *   *Step 3: Agency & Knowledge.* Did the student know better? Could they have done otherwise? (Mitigates the "situation made me do it" defense if knowledge was clear).
      *   *Step 4: Pattern vs. Specificity.* Is this behavior localized to this specific type of situation or broad? (Situationism says traits aren't global, but local consistencies matter).
      *   *Step 5: Remediation Potential.* Will a sanction change the situation or the student's calculation? (Forward-looking, not retributive).
      *   *Judgment Flags:* Need to identify where human discretion is unavoidable (e.g., weighing the severity of situational factors).

  4.  **Applying the Procedure to Cases:**

      *   *Case 1 (Freshman, 400-student class, no instruction):*
          *   Situational Audit: High ambiguity, low oversight, no instruction.
          *   Agency: Low knowledge of norms.
          *   Outcome: Minimal sanction (educational).
          *   Uncomfortable? Maybe for those wanting to make an example.

      *   *Case 2 (Senior, contract cheating, prior warning, clear syllabus):*
          *   Situational Audit: Clear rules, small class (high visibility).
          *   Agency: High knowledge, prior warning (local pattern).
          *   Outcome: Severe sanction.
          *   Uncomfortable? Less so, fits standard intuition, but justified via risk assessment rather than "bad character."

      *   *Case 3 (Remote exam, emergency, ambiguous rules, clean record):*
          *   Situational Audit: High stress (pandemic), ambiguous rules, remote (easy to text).
          *   Agency: Clean record suggests this isn't a global trait.
          *   Outcome: Moderate/Educational.
          *   Uncomfortable? Yes, because it looks like cheating but the situation explains it well.

  5.  **Critiquing the Procedure (The "What We Lost" Section):**
      *   *Limitations:* Hard to quantify situational weight. Might be too lenient on manipulative students.
      *   *Hidden Assumptions:* Assumes students are rational actors responsive to sanctions. Assumes the board can accurately assess situations.
      *   *Virtue Ethics Counter:* We lose the narrative of moral growth. We treat students as risks to be managed, not agents to be cultivated. We ignore the *development* of character, even if it's fragile.

  6.  **Refining the Tone:**
      *   Must be academic, precise, empathetic to the professor's dilemma.
      *   Avoid jargon where possible, but use philosophical terms correctly (e.g., "global traits," "local consistency").
      *   Ensure the procedure is actionable, not just theoretical.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "remorse" issue? Situationists say remorse is also situational. The procedure should treat remorse as data about future compliance, not moral worth.
      *   *Check:* Did I flag where judgment is needed? Yes, specifically in weighing situational factors.
      *   *Check:* Is the distinction between "character" and "behavioral pattern" clear? I need to ensure the procedure doesn't just sneak character back in under the name of "pattern." A pattern in *similar* situations is predictive; a pattern across *different* situations is not (per Doris).

  8.  **Final Polish:** Organize with clear headings. Ensure the three cases are distinct in their outcomes to show the procedure's nuance. Make sure the philosophical critique at the end is robust. (Self-correction: Ensure I don't validate situationism as absolute truth, but as the lens the user *wants* to use).

  9.  *(Final thought on the "Uncomfortable" aspect)*: The most uncomfortable outcome for an integrity board is usually letting someone off "easy" because the *system* failed them. I need to make sure Case 1 and 3 reflect this tension.

  10. **Drafting the Response.** (Proceeds to generate output based on these steps).
answer: |-
  This is a profound institutional and philosophical challenge. You are asking for a procedural bridge between a metaphysical skepticism about character (situationism) and a practical necessity for adjudication (integrity board).

  The situationist critique (Doris, Harman) does not argue that behavior is random or that agents lack control. It argues that behavior is not reliably predicted by *global* character traits (e.g., "honesty") across *diverse* situations. It licenses us to look at local consistencies and situational variables, but it forbids us from inferring a "dishonest soul" from a single data point.

  Below is a decision procedure designed to operationalize this critique. It shifts the board's focus from **Retributive Character Assessment** ("Who is this person?") to **Predictive Risk & Situational Management** ("What conditions produced this, and how do we alter them?").

  ### The Situational Integrity Adjudication Procedure (SIAP)

  **Preamble:** The Board acknowledges that behavior is a function of the person *and* the environment ($B = f(P, E)$). We suspend judgment on global character traits. We adjudicate based on the specific interaction between the student's agency and the situational affordances present in the alleged violation.

  #### Step 1: Factual Verification (The Binary Gate)
  *   **Question:** Did the prohibited act occur, and did the student commit it?
  *   **Guidance:** Establish facts only. Do not discuss intent or history here.
  *   **Judgment Flag:** **None.** This is evidentiary. If "No," case dismissed. If "Yes," proceed.

  #### Step 2: The Situational Audit (The Situationist Core)
  *   **Question:** What specific features of the context made this violation *more likely* for a generic student?
  *   **Guidance:** Identify at least three situational variables. Look for:
      *   *Ambiguity:* Were rules unclear or unstated?
      *   *Pressure:* Was there high stakes, time pressure, or external crisis (e.g., pandemic)?
      *   *Opportunity:* Did the format (e.g., remote, large lecture) lower the perceived cost of cheating?
      *   *Normalization:* Is this behavior common in this specific department or course culture?
  *   **Sufficient Answer:** A documented list of environmental factors that statistically correlate with misconduct in literature or institutional data.
  *   **Judgment Flag:** **High.** Board members must agree on the weight of these factors. A "high-pressure" situation for one member may be "standard rigor" for another.

  #### Step 3: Agency & Knowledge Assessment
  *   **Question:** Given the situational factors in Step 2, did the student possess the specific knowledge and capacity to resist the pressure *in this specific context*?
  *   **Guidance:** This replaces "intent." Did they know the rule? Had they been warned *in this context*? Did they have the resources (time, mental health, skills) to comply?
  *   **Sufficient Answer:** Evidence of prior instruction, syllabus statements, or prior warnings *relevant to this specific type of task*.
  *   **Judgment Flag:** **Moderate.** Determining "capacity" requires empathy and inference.

  #### Step 4: Local Consistency Check (Replacing "Character")
  *   **Question:** Is there evidence of a *local* pattern of behavior in *similar* situations, rather than a *global* pattern across all situations?
  *   **Guidance:** Situationism denies global traits but allows for local consistencies. A student who cheats in high-stress math exams may not cheat in low-stress essays.
      *   *Prior Record:* Only counts if the prior infraction occurred in a structurally similar situation (e.g., remote exam vs. remote exam).
      *   *Remorse:* Treat remorse not as a sign of "good soul," but as data regarding future compliance. Is the student acknowledging the situational triggers?
  *   **Sufficient Answer:** A clear distinction between "this is the first time in this context" vs. "this is a repeated strategy in this context."
  *   **Judgment Flag:** **High.** Deciding what counts as "structurally similar" is interpretive.

  #### Step 5: Sanction Calibration (Forward-Looking)
  *   **Question:** What intervention alters the situation or the calculation to prevent recurrence?
  *   **Guidance:** Sanctions are not punishment for bad character; they are modifications to the $B = f(P, E)$ equation.
      *   *Educational:* If the cause was Ambiguity or Lack of Knowledge (Step 2/3).
      *   *Probation/Restriction:* If the cause was Opportunity or Calculation (Step 2).
      *   *Expulsion:* Only if the Local Consistency (Step 4) suggests the student cannot function within *any* reasonable academic situation without violating norms.
  *   **Sufficient Answer:** A sanction linked directly to the findings in Steps 2–4.
  *   **Judgment Flag:** **Moderate.** Weighing the severity of the intervention requires human discretion.

  ---

  ### Application to Hypothetical Cases

  #### Case 1: The Freshman in the Lecture Hall
  *   **Facts:** First semester, 400-student class, no citation instruction, copied paragraph, no prior record.
  *   **SIAP Analysis:**
      *   *Step 2 (Situational Audit):* High ambiguity (no instruction), low oversight (400 students), high anonymity. These are strong situational诱因 (triggers).
      *   *Step 3 (Agency):* Low specific knowledge. Cannot assume knowledge of citation norms without instruction.
      *   *Step 4 (Local Consistency):* No prior record. No basis to infer a local pattern.
      *   *Step 5 (Sanction):* Educational intervention. The situation failed the student as much as the student failed the situation.
  *   **Verdict:** **No formal sanction.** Mandatory workshop on citation. Grade penalty on the assignment only.
  *   **Uncomfortable?** **Yes.** Colleagues accustomed to "strict liability" will feel this lets the student off too easily. It implicates the professor's pedagogy as a causal factor in the misconduct.

  #### Case 2: The Senior Contract Cheater
  *   **Facts:** Senior, small seminar, explicit integrity discussion, prior warning for minor plagiarism, paid for paper.
  *   **SIAP Analysis:**
      *   *Step 2 (Situational Audit):* Low ambiguity (explicit discussion), low opportunity cost (small class implies high detection risk). The situation *discouraged* cheating.
      *   *Step 3 (Agency):* High knowledge. High capacity (senior status).
      *   *Step 4 (Local Consistency):* Strong local pattern. Prior warning for plagiarism indicates a recurring strategy in academic writing contexts.
      *   *Step 5 (Sanction):* The situational variables do not explain the behavior; the student overrode clear situational deterrents. Recurrence risk is high.
  *   **Verdict:** **Expulsion or Suspension.** The behavior persists despite favorable situational constraints.
  *   **Uncomfortable?** **No.** This aligns with standard intuition. However, the *justification* is different: not "they are a cheater," but "they have demonstrated immunity to standard situational deterrents."

  #### Case 3: The Remote Exam Texter
  *   **Facts:** Clean record, remote mid-semester due to emergency, ambiguous instructions on collaboration, texted answers.
  *   **SIAP Analysis:**
      *   *Step 2 (Situational Audit):* Extreme situational disruption (pandemic), shift to remote (high opportunity), ambiguous instructions (high ambiguity).
      *   *Step 3 (Agency):* Clean record suggests high general compliance capacity. Ambiguity lowers moral barrier.
      *   *Step 4 (Local Consistency):* No prior record. This is an isolated incident in a highly unique situation. Situationism predicts this might *not* repeat in a normal classroom.
      *   *Step 5 (Sanction):* Moderate. The situation was abnormal, but the act undermines the assessment validity.
  *   **Verdict:** **Probation + Grade Zero on Exam.** Retake required. No suspension.
  *   **Uncomfortable?** **Yes.** This is the hardest case. The student *did* cheat. But the procedure forces you to acknowledge the university created the chaotic environment that made cheating the path of least resistance. Colleagues may feel this undermines the value of the degree during a crisis.

  ---

  ### Limitations and Critique

  You asked what this procedure cannot do, what it assumes, and what is lost.

  **1. What the Procedure Cannot Do**
  *   **It cannot eliminate discretion.** Steps 2 and 4 require weighing situational factors. One board member's "high pressure" is another's "normal workload." The procedure structures the debate but does not solve it.
  *   **It cannot handle the "Manipulative Situationist."** A sophisticated student could game this system. They could create situational ambiguity or feign ignorance of norms to lower their sanction. The procedure assumes good faith in the audit.
  *   **It cannot predict rare "Black Swan" behaviors.** Situationism relies on statistical likelihoods. It cannot account for a student who is perfectly compliant until a sudden, unobservable personal crisis causes a massive violation.

  **2. Hidden Assumptions**
  *   **Rational Responsiveness:** The procedure assumes students are rational actors who will adjust their behavior if the situational costs/benefits change (Step 5). It assumes sanctions function as deterrents or educational correctives, not just retribution.
  *   **Institutional Fallibility:** It assumes the university is partly responsible for the "situation." This is politically dangerous. It requires the board to admit that poorly designed exams or unclear syllabi are *causes* of cheating, not just backdrops.
  *   **The Reality of Situations:** It assumes we can accurately reconstruct the "situation" after the fact. We often rely on the student's self-report, which is biased.

  **3. The Virtue Ethicist's Objection (What We Have Lost)**
  A virtue ethicist (or a traditionalist on your board) would argue that by adopting SIAP, you have stripped the process of its **moral narrative**.
  *   **Moral Growth:** By refusing to judge character, you refuse to hold the student accountable for *who they are becoming*. You treat them as a risk to be managed, not a moral agent to be cultivated.
  *   **The Meaning of Remorse:** In your current system, remorse matters because it signals a realignment of the student's values. In SIAP, remorse is merely data about recidivism risk. You lose the language of forgiveness and redemption.
  *   **Community Standards:** Academic integrity is often framed as a community of trust. By focusing on situational variables, you atomize the student. You lose the ability to say, "We hold you to this standard because you are a member of this community," replacing it with, "We sanction you because your behavior violates our risk parameters."

  **Final Recommendation:**
  Use the SIAP to check your biases, not to replace your judgment. When you feel the urge to say, "This student is a cheater," force yourself to answer Step 2 first. If the situational evidence is weak, *then* you may cautiously infer a local behavioral disposition. This allows you to remain philosophically consistent without abandoning your duty to uphold academic standards. You are not judging souls; you are managing the ecology of the classroom.
