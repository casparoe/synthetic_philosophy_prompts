  # SEMINAR HANDOUT: MAPPING THE METAPHYSICS OF DISPOSITIONS
  **Course:** Graduate Seminar in Metaphysics | **Topic:** Finks, Masks, and the Conditional Analysis
  **Instructor:** Prof. [Name]

  ### DIAGNOSTIC DECISION TREE
  *Instructions: Answer the following questions based on your intuitions about the cases discussed (Electro-Fink, Masked Fragility, Antidotes). Follow the path to your position in logical space.*

  **Q1. The Electro-Fink Case:** A live wire is connected to a device that instantly renders it dead if touched. The counterfactual "If touched, it would conduct" is **false**. Is the wire *still* disposed to conduct electricity at the moment before touch?
  *   **NO** (Disposition truth tracks the counterfactual): Go to **Q2**.
  *   **YES** (Disposition is real despite the counterfactual): Go to **Q3**.

  **Q2. The Masking Case:** A fragile glass is packed in styrofoam. It will not break if struck. To save the conditional analysis, must we require that the *intrinsic basis* of the disposition remains fixed during the stimulus?
  *   **NO**: **LEAF A: Simple Conditional Analysis** (Ryle/Early Carnap). *The analysis is extensionally correct as stated; finks show dispositions are not real properties.*
  *   **YES**: **LEAF B: Sophisticated Conditional Analysis** (Lewis 1997, Choi, Manley & Wasserman). *The analysis holds ceteris paribus, provided the intrinsic base persists.*

  **Q3. The Categorical Base:** You accept the disposition is real. Is its truthmaker a **categorical property** (a property with a nature independent of its causal powers, e.g., a quiddity)?
  *   **YES**: **LEAF C: Categoricalism / Realizer Functionalism** (Armstrong, Prior, Jackson). *Dispositions are either eliminated or are second-order functional roles realized by categorical bases.*
  *   **NO**: Go to **Q4**.

  **Q4. The Nature of Power:** Consider a fundamental property (e.g., charge). Is its nature **exhausted** by its potential for interaction with other properties (a "Pure Power")?
  *   **YES**: Go to **Q5**.
  *   **NO** (It has an intrinsic qualitative nature *in addition* to its powers): **LEAF D: Identity Theory / Dual-Aspect View** (Martin's later view, Heil, Jacobs). *Properties are unitary qualities that are simultaneously dispositional and categorical.*

  **Q5. Ontological Monism:** Are **all** fundamental properties Pure Powers?
  *   **YES**: **LEAF E: Pandispositionalism / Dispositional Monism** (Bird, Mumford). *The world is made entirely of powers; there are no purely categorical properties.*
  *   **NO** (Some properties are powers, some are categorical): **LEAF F: Dispositional Primitivism** (Martin's early view, Molnar). *Dispositions are sui generis, irreducible properties, but the ontology may be mixed.*

  ---

  ### UNDEFENDED REGIONS OF LOGICAL SPACE
  The tree generates six live positions. Two logically possible combinations remain largely undefended:
  1.  **The "Dualist Mixture" (Q4=NO, Q5=NO, but Properties are Distinct):** This view holds that some properties are purely categorical, some are purely dispositional, and some are dual-aspect. *Diagnosis:* Generally rejected as ontologically profligate and lacking a unifying principle for property identity.
  2.  **The "Extrinsic Realist" (Q3=NO, Q4=YES, Q5=NO):** A view where powers are pure but some are extrinsic, while others are intrinsic categorical. *Diagnosis:* Unexplored. Most Power Realists prefer ontological uniformity (either all intrinsic or all extrinsic).

  ### INDETERMINACY NOTE: PRIMITIVISM VS. IDENTITY THEORY
  **Leaf D (Identity)** and **Leaf F (Primitivism)** may converge if the Primitivist claims the "distinct" dispositional and categorical natures are borne by a *single* property. 
  *   **The Contested Issue:** Is the distinction between "quality" and "power" a distinction in *properties* (Primitivism) or a distinction in *concepts/aspects* of one property (Identity)? 
  *   **Proponents:** Martin shifted from F to D. Heil argues F is incoherent because we cannot conceive of a property that is *only* dispositional or *only* categorical.

  ---

  ### CROSS-CUTTING ISSUE: EXTRINSIC DISPOSITIONS
  **The Issue:** Must dispositions be grounded in *intrinsic* properties? (McKitrick 2003 argues for extrinsic dispositions, e.g., "being a key," "being vulnerable").

  | Position | Accommodates Extrinsic Dispositions? | Commitment to Intrinsicness |
  | :--- | :--- | :--- |
  | **Simple/Soph. Conditional Analysis** | **No** (typically). | **High.** Lewis's "Reformed CA" explicitly requires an intrinsic base to solve fink cases. |
  | **Categoricalism** | **Rarely.** | **High.** Categorical bases (e.g., shape, structure) are standardly intrinsic. |
  | **Dispositional Primitivism** | **Yes.** | **Low.** Molnar allows powers to be relational/extrinsic. |
  | **Pandispositionalism** | **Yes.** | **Low.** If all is power, relational powers are permissible. |
  | **Identity Theory** | **Yes.** | **Low.** Heil allows properties to be both qualitative and relational. |

  **Structural Impact:** If **Intrinsicness** were made a branching node (Q6), it would slice vertically through the tree. Making it a primary node would separate Lewis (Q2) from Realists (Q3-5) immediately, but would fail to distinguish the metaphysical nature of the properties themselves, which is the core debate of this seminar.
