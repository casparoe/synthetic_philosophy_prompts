  3.  **Drafting - Section by Section:**

      *   **Opening:** Establish the scenario (the marriage debate).
      *   **Round 1: The Marriage Case.** A argues intent is key. B argues procedure is key.
      *   **Round 2: The Judge Case.** A judge sentencing someone they think is innocent. Does the sentence stand? (Strong point for B).
      *   **Round 3: The Priest/Baptism Case.** A priest who lost faith baptizing someone. Is the soul saved? (Theological/Institutional angle).
