      *   **A needs:** A case where intention clearly existed but the act *failed* purely due to convention, or where lack of intention clearly *succeeded* in a way that harms the intentionalist view. Actually, better: A case where the *consequences* of saying the act happened without intent are so catastrophic that we *must* admit the act didn't happen.
