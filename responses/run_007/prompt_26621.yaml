      *   **Character B (Conventionalist/Austinian):** Focuses on the *procedure* and the *social reality*. If the felicity conditions (conventions, authority, context) are met, the act happens. Inner thoughts are private and irrelevant to the public institutional fact. Marriage is a status conferred by society, not a state of mind.

