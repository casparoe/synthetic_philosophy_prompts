      *   *Current Practice:* Vertebrates = protected. Cephalopods/Crustaceans = emerging protection. Insects = no protection.
      *   *Strict Presupposition:* The law acts *as if* insects lack the relevant property (sentience/capacity for suffering) required for moral consideration. It doesn't necessarily claim they *definitely* don't have it, but it proceeds on the basis that they don't.
      *   *Fits Well With:* Biological taxonomy (phylogenetic closeness to humans), cognitive complexity (brain size/structure), and practical enforceability.
      *   *Ruled Out:* Utilitarian aggregation across vast numbers (the Scale Argument), panpsychism, and strict precautionary principles applied to low-probability sentience.

  3.  **Assess the Basis of the Practice (Factual, Normative, or Epistemic?):**
      *   *Factual:* "Insects feel nothing." Science is inconclusive. Law treats this as fact, but it's likely an assumption.
      *   *Normative:* "Even if they feel, it doesn't matter." Unlikely. Welfare law is usually grounded in suffering.
      *   *Epistemic:* "We can't know, and the probability is too low to bother." This seems the most robust interpretation of the *legal* stance (burden of proof lies on the animal).
      *   *Conclusion:* It's primarily an epistemic cutoff masquerading as a factual one.

  4.  **Evaluate the Scale Argument:**
      *   *The Argument:* $P(\text{sentience}) \times N(\text{individuals}) = \text{Expected Moral Weight}$. Even if $P$ is small, $N$ is huge.
      *   *Undermining?* Yes, if one accepts Expected Value Theory (EVT) in ethics.
      *   *Absorbing?* Yes, if one rejects EVT.
          *   *Threshold View:* You need $P > X\%$ to count. Below that, you are zero.
          *   *Precautionary Principle:* Usually argues *for* protection when uncertain, but can be limited by "reasonable" thresholds.
          *   *Rights View:* Rights are binary. You either have them or you don't. Probabilities don't dilute rights, but they might determine possession.
      *   *Analysis:* The practice relies on a threshold view. The Scale Argument attacks the threshold by introducing aggregation. To absorb it, the law must insist that moral status is not aggregable in this way (a deontological or threshold constraint).

