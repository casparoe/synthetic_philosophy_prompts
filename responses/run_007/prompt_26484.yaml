          *   It correctly identifies that sortals play a role in persistence conditions.
      *   *Oversimplifications/Misrepresentations:*
          *   **"They're the same thing":** Most contemporary constitution theorists (Baker, Johnston) argue they are *constituted by* the same matter but are *numerically distinct*. The textbook says they are *identical*. This is the **Contingent Identity** view (Gibbard), which is widely considered problematic due to modal logic (Kripke).
          *   **"Just features of our conceptual scheme":** This is a heavy metaphysical claim (Conceptualism/Idealism light). Realists about artifacts (many constitution theorists) argue statues have mind-independent persistence conditions.
          *   **"No genuine metaphysical problem":** Most metaphysicians think there *is* a problem (How can one thing have two modal profiles?). Dismissing it as "conceptual" doesn't solve the modal conflict unless you accept relative identity or counterpart theory.
