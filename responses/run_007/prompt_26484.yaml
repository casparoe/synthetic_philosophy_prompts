          4.  Is the move from "different persistence conditions" to "conceptual scheme" legitimate?
          5.  Is the Aristotle appeal substantive or rhetorical?

  2.  **Deconstruct the Textbook's Position:**
      *   *Position:* This sounds like a version of **Constitution View** (Lynne Baker) mixed with **Conceptualism/Relativism** about identity, or perhaps a strong **Deflationary Monism** (like early Quine or certain readings of Frege). It leans heavily towards the idea that identity is relative to a sortal, and sortals are mind-dependent.
      *   *Key Claim:* "One thing, two descriptions." This is **Contingent Identity** or **Relative Identity** or just **Monism with Conceptual Persistence**.
      *   *Contrast:* The standard debate is usually between **Constitution View** (two things, coincident), **Identity View** (one thing, identical persistence conditions - rejected by most due to modal differences), **Eliminativism** (no statues), or **Dominant Sorts**.
      *   *The Textbook's specific move:* It accepts the modal difference (statue goes, lump stays) but denies the ontological multiplication (still one thing). This requires denying Leibniz's Law or restricting it to sortals.

  3.  **Evaluate Against Contemporary Literature:**
      *   *Fairness:*
