      *   *Aristotle:* Be careful not to overstate Aristotle scholarship, but consensus is that hylomorphism isn't merely linguistic.
      *   *Key Distinction:* Ontological vs. Conceptual. The textbook claims the problem is conceptual. The field largely treats it as ontological.

  7.  **Final Polish:** Organize by the user's specific questions.
      *   Fair parts? (Sortals matter).
