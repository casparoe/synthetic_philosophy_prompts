answer: |-
  Here is a 45-minute teaching plan designed to navigate the disciplinary fault lines in your room.

  ### 1. The Prerequisite: Establishing the "Neutral Stance"
  Before heterophenomenology (HP) can sound like a method rather than a evasion, you must secure agreement on the **status of the report**.

  In a mixed room, the default tension is between the **Authority of the Subject** (Philosophers/Psychologists) and the **Authority of the Instrument** (Neuroscientists).
  *   **What must be in place:** You need to establish that a verbal report is treated as *theoretical data*, not *infallible testimony* and not *mere noise*.
  *   **How to do it (Minutes 0–5):** Do not start with Dennett. Start with the **Problem of Authority**. Ask the room: "When a subject says 'the dot moved,' and our eye-tracker says 'the dot was stationary,' whose data goes into the column labeled 'Experience'?"
  *   **The Goal:** Get them to agree that we cannot simply discard the report (eliminativism) nor simply accept it as ground truth (Cartesian materialism). You need them to buy into the idea that we are constructing a **text** (the heterophenomenological world) that represents the subject's *beliefs* about their experience, regardless of the truth value of those beliefs. HP is only a live option if they accept that the *object of study* is the subject's *taken reality*, not reality itself.

  ### 2. The Single Example: The Color Phi Phenomenon
  Do not use a standard illusion (like Müller-Lyer) where the report is "wrong" about the world but "right" about the experience. Do not use a veridical report. Use **The Color Phi Phenomenon** (Kolers & von Grünau).

  *   **The Setup:** A blue spot flashes at position A. A red spot flashes at position B. The interval is short.
  *   **The Report:** Subjects consistently report seeing a *single* spot moving from A to B and *changing color* mid-trajectory.
  *   **Why this carries the session:**
      *   **It lacks:** A physical correlate for the *motion* or the *color change* during the interval. The stimulus is discrete; the experience is continuous.
      *   **It has:** A sincere, consistent verbal report that describes an event that physically did not happen.
  *   **The Lesson:** This forces the heterophenomenological move. You cannot say the subject is lying (Psychologists). You cannot say the motion existed in the world (Neuroscientists). You cannot say the subject has magical access to a non-physical mind (Philosophers).
  *   **The HP Move:** You record the report as the "phenomenological data." The *object* of your science becomes: "What neural mechanism constructs the *belief* that motion occurred?" This example forces the group to see that the "phenomenology" is the *construct*, not the *cause*.

  ### 3. Misconceptions and Pre-emption
  Do not wait for Q&A. If you wait, the room will polarize. Head these off during the methodological breakdown (Minutes 20–30).

  *   **The Philosophers (The "Behaviorism" Objection):**
      *   *The Fear:* They will hear HP as "experience doesn't exist, only speech acts exist."
      *   *When to head it off:* When defining the "Heterophenomenological World."
      *   *The Fix:* Explicitly state: "HP is neutral on ontology." Emphasize that we treat the subject as an **Intentional System**. We are not ignoring the experience; we are refusing to grant it *epistemic privilege* over third-person data. Say clearly: "We are not denying qualia; we are denying the subject's *authority* on the mechanism of qualia."
  *   **The Psychologists (The "Naive Introspection" Objection):**
      *   *The Fear:* They will hear HP as "just ask the subject and write it down."
      *   *When to head it off:* When discussing data transcription.
      *   *The Fix:* Emphasize the **Interpretative Layer**. The raw audio is not the data. The *interpreted text* is the data. Highlight that the experimenter must filter out slips, metaphors, and theory-laden language to get to the "phenomenological core." HP is *critical*, not passive.
  *   **The Neuroscientists (The "Epiphenomenal" Objection):**
      *   *The Fear:* They will ask, "If the report is just a belief, why not just scan the brain and skip the middleman?"
      *   *When to head it off:* When discussing the Neural Correlates of Consciousness (NCC).
      *   *The Fix:* Remind them that without the report, they don't know *which* neural activity is the correlate. The report identifies the *target* for the neural search. The heterophenomenological world tells the neuroscientist *what* to match against the brain state.

  ### 4. Scope: What to Explicitly Exclude
  To keep this to 45 minutes and avoid metaphysical trench warfare, state clearly at the outset (Minute 5) what is **out of bounds**:

  1.  **The Hard Problem:** State that HP is a method for *gathering data* about consciousness, not a solution for *why* data feels like something. It bypasses the Hard Problem to get work done.
  2.  **Eliminativism vs. Realism:** Declare the method agnostic. Whether the qualia are "real" or "user-illusions" is a question for later; HP is the tool we use to investigate either hypothesis without bias.
  3.  **Non-Verbal Subjects:** Acknowledge that HP relies on language. Do not let the seminar drift into animal consciousness or infant studies. Keep the scope to competent adult human reporters.

  ### 5. The Final Assessment Question
  Do not ask "What is heterophenomenology?" That tests memory. You need to test *application*.

  At Minute 40, present this scenario:

  > "A subject in a binocular rivalry task reports: 'I saw a house for the full 10 seconds.' The fMRI shows V1 activity toggling between house and face every 2 seconds. Under a heterophenomenological method, **what exactly gets written in the 'Phenomenology' column of your dataset, and why is it not simply 'Error'?"**

  *   **Correct Understanding:** They should answer that the column records the *subject's belief/report* ("I saw a house"), not the stimulus truth. It is not "Error" because the *experience* of continuity is the phenomenon to be explained, even if the stimulus was intermittent.
  *   **Incorrect Understanding:** If they say "Write 'Face/House Toggle'" (ignoring the report) or "Write 'Subject Lied'" (judging truth), they have missed the Neutral Stance.

  ### Timing Summary
  *   **00–05:** The Problem of Authority (Prerequisites).
  *   **05–20:** The Color Phi Case (The Example).
  *   **20–30:** The Method & Pre-empting Objections (Philosophers/Psych/Neuro).
  *   **30–35:** Scope & Exclusions.
  *   **35–40:** Implications for NCC/Research Design.
  *   **40–45:** Final Assessment Question & Discussion.
