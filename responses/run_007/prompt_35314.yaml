answer: |-
  Dear colleague, what a fascinating and deeply unsettling spot to find yourself in. It is rare that the abstract puzzles we discuss in seminars manifest so concretely in our professional lives, and I appreciate you trusting me with this. You have stumbled into the heart of the higher-order evidence debate, but with stakes that feel much heavier than the usual thought experiments about drunk pilots or drugged mathematicians. The core tension you are feeling is between your first-order evidence, which is the actual content of the student papers as they appear to you now, and your higher-order evidence, which is the knowledge that the cognitive mechanism that produced the original judgments was compromised. On one hand, you have the papers themselves, sitting there in front of you, apparently warranting the grades you assigned. On the other hand, you have the statistical and psychological fact that sleep deprivation degrades cognitive performance, which suggests you should not trust the output of that process, even if it looks stable upon review.

  If we look at this through the lens of the steadfast view, often associated with philosophers like Thomas Kelly or Richard Feldman, the argument would be that your current assessment screens off the higher-order evidence. The idea here is that once you are well-rested and looking at the papers again, you are in a position to assess the first-order evidence directly. The fact that you were tired last week is relevant to whether you were likely to get it right then, but it is less relevant to whether you are getting it right now. If the paper genuinely merits an A based on the arguments and evidence contained within it, then your current recognition of that merit justifies the grade. The higher-order evidence about your past state is defeated by your current direct access to the reasons supporting the grade. From this perspective, changing the grades would be an overcorrection, a form of epistemic self-sabotage where you privilege a statistical generalization about sleep deprivation over the specific evidence right in front of your eyes.

  However, the conciliationist position, championed by folks like David Christensen or Adam Elga, would push back hard here. They would argue that higher-order evidence does not just tell you that you were wrong in the past; it tells you that your current confidence might be misplaced because your current evaluation is not truly independent. The crucial detail in your story is that when you re-read the papers, you knew what grades you had originally assigned. This introduces a significant risk of anchoring bias or confirmation bias. Your well-rested self is not looking at the papers with fresh eyes; you are looking at them to check if the original grade was correct. When you see an A paper that you previously marked as an A, it feels correct, but that feeling is contaminated by the knowledge of the prior judgment. The higher-order evidence suggests that your cognitive faculties are not as reliable as they feel, and specifically, that your sense of obviousness might be a artifact of trying to reconcile with your past self rather than a pure response to the text. Therefore, rationality requires you to lower your confidence in the grades, even if you do not change them, because you cannot fully trust that your current agreement is earned rather than biased.

  There is also a middle ground, often called the total evidence view, which suggests we must weigh the first-order and higher-order evidence together. The first-order evidence is strong because you are now competent and the papers are tangible. The higher-order evidence is strong because sleep deprivation is a known defeater for reliability. The synthesis here requires acknowledging that while your current judgment is likely better than your exhausted judgment, it is not perfect because it is not blind. The epistemic humility required here is not necessarily to change the grades arbitrarily, but to recognize that your justification for them is slightly weaker than it would be if you had graded them well-rested from the start. You are in a position where you have justification for the grades, but it is a fragile justification, one that is vulnerable to the charge that you are merely rationalizing the output of a broken process.

  So, what should you do? I think the solution lies in separating the epistemic status of the grades from the ethical and procedural obligations you have to your students. Epistemically, you are probably justified in keeping the grades for the ten papers you re-read, provided you acknowledge that your confidence should be tempered. The papers themselves constitute evidence, and your current cognitive state is sufficient to assess that evidence, even if the process was initiated by a check on a faulty memory. However, because you know the original process was compromised, you have a professional obligation to account for the risk of error that the higher-order evidence highlights. This is especially true for the twenty papers you did not re-read. For those, the higher-order evidence stands undefeated by any fresh first-order assessment.

  I would suggest that you leave the grades as they are, since your current reflection confirms them, but you should communicate with your students in a way that acknowledges the situation. You might send a note explaining that while you have reviewed a sample of the papers under optimal conditions and found the grading consistent, you are aware that the initial grading occurred under suboptimal conditions. Consequently, you should offer an open and low-barrier opportunity for any student to request a re-grade or to discuss their paper with you. This moves the burden of proof slightly without abandoning your professional judgment. It respects the higher-order evidence by admitting the possibility of error, but it also respects the first-order evidence by not arbitrarily changing grades that currently appear correct. It transforms the epistemic problem into a procedural safeguard.

  Ultimately, I think the arrogance you fear comes not from keeping the grades, but from refusing to acknowledge the possibility that you might be wrong. If you simply say the grades stand because you say so, you are ignoring the higher-order evidence. But if you say the grades stand based on current review, while offering a mechanism for correction, you are integrating both levels of evidence. You are treating your students as epistemic partners who deserve to know that their work was evaluated under conditions you yourself deem unreliable, even if you believe the outcome was accurate. This approach allows you to maintain your authority as a grader while honoring your integrity as an epistemologist who knows that cognitive reliability is not an all-or-nothing switch. It is a way of living with the uncertainty that higher-order evidence inevitably introduces, without letting it paralyze your professional practice.
