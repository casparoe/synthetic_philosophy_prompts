  The practice is philosophically underdetermined because rival theories converge on its permission. A libertarian autonomy view licenses it as reproductive freedom; a utilitarian view licenses it to prevent suffering; a perfectionist view licenses it to promote excellence. The practice takes no stand on which justification is correct. It does not settle whether selection is obligatory or optional, nor does it define the threshold of harm required to justify selection. It leaves open whether traits like educational attainment are intrinsic goods or merely instrumental. Consequently, the practice functions as an overlapping consensus among conflicting ethical frameworks. It avoids resolving tensions between respecting the child's open future and maximizing their specific outcomes, allowing users to project their own moral reasoning onto the technology without the provider committing to a specific normative foundation. It leverages this ambiguity to maximize market appeal across diverse moral landscapes.

  **Section 5: What would change under a rival view**
  Under an expressivist or disability-critique view, the practice would require radical transformation. It could not market selection as improving life quality, as this implies existing lives with those traits are less worth living. To avoid expressive harm, it might restrict services solely to lethal childhood conditions where existence itself is arguably a harm. Marketing would shift from "best odds" to "medical necessity," removing language about flourishing or attainment. Providers might need to mandate counseling on living well with disabilities rather than preventing them. Ultimately, if selecting against schizophrenia expresses a negative judgment on people with schizophrenia, the practice would have to cease offering selection for non-lethal conditions. The focus would move from eliminating traits to accommodating them, fundamentally altering the service from optimization to basic health security. It would necessitate a shift from consumer choice to social responsibility regarding the disabled community.
