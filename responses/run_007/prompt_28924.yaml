  Strictly, the practice presupposes only that genetic liability is a morally relevant factor in reproductive choice and that parents are legitimate agents to weigh this factor. It does not require a specific theory of value like welfarism; it is compatible with perfectionism (selecting for excellence) or libertarianism (reproductive rights). It need not commit to the claim that scores accurately predict well-being, only that parents are permitted to act on them as if they do. The minimal commitment is that embryo selection is intelligible as a rational strategy for influencing future outcomes. It cannot shed the notion that some genetic profiles are preferable to others without becoming unintelligible. However, it remains agnostic on whether selection is a moral duty or merely a permissible option, and whether the value of traits is intrinsic or instrumental, allowing it to fit within multiple ethical frameworks without resolving their underlying tensions. It presupposes genetic information is actionable knowledge, distinct from mere curiosity, warranting intervention in the reproductive process. It requires that parents have the authority to prioritize potential future welfare over the natural lottery of conception.

  **Section 3: The eugenics question**
  The practice presupposes that the moral distinction between state-coerced eugenics and individual choice is decisive. It assumes historical objections targeted state power and malicious intent, not the selection act itself. By framing itself as "liberal eugenics," it claims insulation from moral critique based on autonomy and welfare maximization. However, this presupposes that the expressive harm of eugenics—the judgment that certain lives are less worth living—is negligible when decentralized. If the core objection to eugenics is the attitude toward disability rather than coercion, the liberal framing fails. The practice assumes private aggregation of choice does not replicate discriminatory social valuations. It presupposes that individual welfare goals are morally distinct from collective purity goals, ignoring how private choices shape public norms about which lives are desirable. It relies on the assumption that market dynamics dilute moral responsibility, assuming that no single agent intends harm, even if the cumulative effect devalues disabled lives.

