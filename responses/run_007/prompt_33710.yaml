answer: |-
  It is fascinating that you want to dig into the cod collapse through the lens of Moloch, because on the surface it looks like the perfect case study, but once you start pulling at the threads of who actually held the levers of power, the multipolar trap model starts to fray in interesting ways. If we treat Moloch as the personification of a system where individual rationality leads to collective ruin and no single actor can stop without being punished, the Newfoundland cod fishery fits the symptom profile but not necessarily the underlying mechanics. To map this carefully, we have to look at the specific payoff matrices for the different players involved, because they were not all operating on the same level of agency.

  At the bottom of the hierarchy you had the individual captains and crew members. For them, the Molochian pressure was very real. Especially after the government introduced individual quotas or seasonal limits, the incentive structure created a derby fishery. If the total allowable catch was set and the season opened, the payoff for any single captain was to catch as much as possible as quickly as possible. If you held back to let the stock recover, you did not get a reward; you simply lost income to the captain behind you who was willing to push the limits. Their options were binary: fish hard or go out of business. They were price takers and quota takers, locked into a race where conservation was economically suicidal. This is the purest form of the trap, where the competitive pressure forces behavior that destroys the resource base everyone depends on.

  However, the trap gets complicated when you move up to the processing companies and the local towns. The processors needed volume to keep their plants running efficiently. A idle plant is a financial loss, so their incentive was to lobby for higher quotas and to keep the fleet capacity high enough to deliver massive catches in short windows. The towns were dependent on this employment. Here the payoff is political and social stability. If the fishery contracts, people leave, votes are lost, and communities die. This is where the Canadian state enters the matrix, not as a neutral referee trying to prevent a tragedy of the commons, but as an active player with its own incentives that aligned with overexploitation. The government subsidized the modernization of the fleet in the 1970s and 1980s, effectively paying for the overcapacity that made the collapse inevitable. From a Moloch perspective, you might argue the state was also trapped, forced to prioritize short-term employment over long-term sustainability because the political cost of cutting quotas was immediate unemployment while the cost of overfishing was delayed and uncertain.

  This is where the model starts to stretch. In a classic multipolar trap, no single actor has the power to stop the cycle. But the Canadian government did have the power. They set the quotas. They owned the resource. They could have ignored the lobbying from the processors and the threats from the unions. The fact that they set quotas higher than the scientists recommended suggests this was not a case where coordination was impossible, but rather where the wrong incentives were weighted too heavily. The scientists themselves were trapped, but differently. Their payoff was accuracy and professional integrity, but their influence was contingent on being heard. When their assessments threatened the economic status quo, their data was often smoothed over or ignored by the bureaucracy. They were not competitors in a market; they were advisors whose advice was filtered through a political lens. So the failure was not just that everyone was competing to fish more, but that the regulatory body responsible for stopping the competition was itself incentivized to keep the game going.

  The race-to-the-bottom story does real explanatory work when looking at the foreign fleets before 1977 and the domestic derby fishing afterward. Before Canada extended its jurisdiction to two hundred miles, it was a free-for-all where Soviet and Spanish trawlers were stripping the shelf. No single nation could stop without losing the resource to the others. That is a textbook multipolar trap. But after 1977, when Canada took control, the dynamic shifted. It became a unipolar management failure disguised as a competitive market. The government created the overcapacity through subsidies and then refused to reduce it because of the political fallout. When you look at the 1992 moratorium, you see the break in the Moloch frame. The government did eventually act. They shut the whole thing down. Tens of thousands lost their jobs, which was the feared political cost, but they did it. This proves that collective action was not impossible, just delayed until the resource was effectively gone. If Moloch were absolute, the moratorium would never have happened because the cost of stopping would always outweigh the cost of continuing. Instead, the calculus finally flipped when there were no fish left to catch.

  So where does the model break? It breaks when it suggests inevitability. The Moloch frame flatters us by making the disaster feel like a force of nature, as if the actors were helpless before the incentives. But the cod collapse was driven by specific human choices to ignore data, to subsidize overcapacity, and to prioritize election cycles over ecological cycles. It was less a trap where no one could stop and more a situation where the people who could stop chose not to until it was too late. The trap was not purely multipolar competition among fishermen; it was a coupling of ecological limits with political short-termism. The fishermen were caught in Moloch's grip, yes, but the government held the key and chose to keep the door locked until the building burned down.

  Ultimately, the cod collapse shows that the Moloch frame is a partial fit. It explains the behavior of the fishermen and the foreign fleets perfectly, but it obscures the agency of the regulators. If you view the government as just another actor responding to incentives, then yes, everyone was trapped in a system that rewarded extraction. But unlike the fishermen, the government had the ability to change the rules of the game. They could have bought out the licenses, reduced the fleet size earlier, or enforced stricter science-based limits despite the political cost. The disaster shows that what looks like a multipolar trap is often a failure of governance where the referees are playing for the same team as the players. The trap was not that coordination was impossible, but that the coordination mechanism was corrupted by the very pressures it was supposed to manage. So while Moloch explains the pressure, it does not explain the surrender. The real lesson is that these traps are not inevitable physical laws but political choices, and recognizing that distinction is the only way to avoid building the next one.
