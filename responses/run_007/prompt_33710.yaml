prompt: |-
  So I've been reading about multipolar traps — the Moloch idea where a bunch of actors each responding rationally to their own incentives end up in an outcome none of them wanted, and no one can unilaterally stop without getting crushed. Take the collapse of the northern cod fishery off Newfoundland, the one that led to the 1992 moratorium, and analyze it through that lens. Not just as a generic tragedy of the commons, because I already know that version; I want the trap mapped carefully. I know the basics: the stock looked inexhaustible for centuries, then factory trawlers and foreign fleets scaled up after the 1950s, the Canadian government kept setting quotas that were too high and also subsidized the industry, and in 1992 they basicaly had to close it, which put tens of thousands of people out of work. So: who are the actual players — individual captains, processing towns, fleets, the Canadian state, the scientists giving stock assessments — and what did their options and payoffs look like at the point where a quota got set or a captain chose where to fish? Where does the race-to-the-bottom story do real explanatory work, and where does it get stretched? Then give me an honest account of where the model breaks. A lot of the damage came from deliberate government decisions, not atomized competition, and a moratorium did eventually get imposed, so collective action wasn't impossible. So what does the cod collapse show about Moloch-style stories: is this a case that confirms the frame, a partial fit, or a case where the frame flatters us by making the disaster feel inevitable? And if Moloch isn't quite right, what was the trap actually like? Oh, and please just write continuous prose, no headings or bullet points or bold or tables, the way you'd write me an email.
