  Can you give me your credence on the physical Church-Turing thesis, but decompose it properly? I want numbers for things like: the probability that "physical computability" is a coherent enough notion for the thesis to be truth-apt; the probability that general relativity or quantum gravity allows hypercomputation (Malament-Hogarth spacetimes, that sort of thing); the probability that even if exotic physics allows it, the resulting "computation" wouldn't be usable or observable in practice; and whatever else you think the credence turns on. Then tell me how they combine and which term your final number is most sensitive to. My own gut number is around 0.7 but I don't trust it because I haven't done the decompositon — I suspect I'm just pattern-matching to "smart people seem to believe it."
