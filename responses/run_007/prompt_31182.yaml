answer: |-
  ### Desiderata for a Theory of Material Constitution

  **The Core Case:** A sculptor shapes a lump of clay into a statue. The statue and the lump coincide spatially and materially. If the statue is squashed, the statue is destroyed, but the lump survives. The lump could have been shaped differently; the statue could not. They appear to be one object, yet they have different persistence conditions. An adequate theory must account for this data without collapsing into incoherence or ad-hocery.

  #### 1. Constitution and Identity
  *   **Requirement:** The theory must explicitly define the relation between the statue and the clay. It must state whether they are numerically identical or distinct. If distinct, it must define constitution as a relation other than identity. If identical, it must explain why they appear to have different conditions.
  *   **Forcing Case:** The intuitive pull of both "they are the same object" (one place, one mass) and "they are different objects" (different fates).
  *   **Status:** **[Non-Negotiable]**. A metaphysical theory cannot remain agnostic on the fundamental ontological relation of its subject matter.

  #### 2. Leibniz's Law
  *   **Requirement:** The theory must preserve the Indiscernibility of Identicals ($x=y \rightarrow \forall F(Fx \leftrightarrow Fy)$) or provide a rigorous justification for its failure. If the statue and lump are distinct, the theory must identify a discernible property. If they are identical, the theory must explain the apparent modal differences without violating logic.
  *   **Forcing Case:** The squashing case implies the lump has the property *can survive squashing* while the statue lacks it.
  *   **Status:** **[Non-Negotiable]**. Logical coherence is a constraint on all comers; exceptions require heavy defense.

  #### 3. The Modal Profile
  *   **Requirement:** The theory must vindicate the intuition that the statue is essentially statue-shaped (or artifact-bound) while the clay is not, without merely stipulating these essences for this specific case. It must derive persistence conditions from a general principle.
  *   **Forcing Case:** The asymmetry of survival conditions (squashing destroys one but not the other).
  *   **Status:** **[Non-Negotiable]**. Matching modal intuitions is the primary data set of the debate; ignoring them renders the theory irrelevant to the case.

  #### 4. The Grounding Problem
  *   **Requirement:** If the statue and lump are distinct, the theory must identify the metaphysical ground of their distinctness. Since they share all microphysical and categorical properties, the theory must point to what differentiates them (e.g., form, history, sortal concept) or argue why differentiation requires no ground.
  *   **Forcing Case:** The "coincidence" implies two entities with identical physical bases but different kind-memberships.
  *   **Status:** **[Non-Negotiable]**. Distinctness without a difference is metaphysically mysterious; the theory must either dissolve the mystery or explain it.

  #### 5. Counting and Sortals
  *   **Requirement:** The theory must account for ordinary counting practices. It must explain why we say "one object" in ordinary contexts despite ontological commitments to two (or vice versa), without making ordinary speech systematically false.
  *   **Forcing Case:** We hesitate to say "there are two things on the pedestal" despite accepting the statue and the lump.
  *   **Status:** **[Non-Negotiable]**. A theory that makes all ordinary object-talk false is eliminativist, which is a specific (and costly) theoretical choice, not a default.

  #### 6. Mereological Extensionality
  *   **Requirement:** The theory must resolve the tension with Classical Extensional Mereology (CEM), which states that objects with the same parts at the same time are identical. It must either reject CEM, restrict its scope, or reinterpret the parts relation.
  *   **Forcing Case:** The statue and lump share all parts at time $t$, yet (arguably) are not identical.
  *   **Status:** **[Non-Negotiable]**. (Note: *Preserving* CEM is a **[Camp Commitment]** of standard mereologists; *rejecting* it is a commitment of coincidentalists. Addressing the tension is NN.)

  #### 7. Generality
  *   **Requirement:** The theory must apply to organisms and persons, or provide a principled reason why artifacts are metaphysically special. It cannot treat the statue case in isolation.
  *   **Forcing Case:** The "Body/Person" and "Organism/Parcel of Matter" cases generate the same logical problems as the Statue/Lump.
  *   **Status:** **[Non-Negotiable]**. Ad-hoc restrictions to artifacts undermine the theory's metaphysical depth.

  #### 8. Proliferation
  *   **Requirement:** The theory must provide a principled criterion for which coincident candidates count as objects. If the statue and lump are two, the theory must explain why the "clay-minus-a-molecule" or the "aggregate of atoms" are not also distinct objects occupying the same space.
  *   **Forcing Case:** If coincidence is allowed here, nothing seems to stop an explosion of coincident entities (universalism).
  *   **Status:** **[Non-Negotiable]**. Ontological parsimony is a theoretical virtue; unchecked proliferation is a vice unless defended.

  #### 9. The Formal Features of Constitution
  *   **Requirement:** If constitution is a sui generis relation, the theory must specify its logic (irreflexive, asymmetric, transitive?). If it is not a real relation, the theory must reduce it to identity, predication, or conceptual truth.
  *   **Forcing Case:** We speak of the clay *constituting* the statue, not vice versa. The relation appears directional.
  *   **Status:** **[Non-Negotiable]**. The logic of the central relation must be explicit to avoid circularity or regress.

