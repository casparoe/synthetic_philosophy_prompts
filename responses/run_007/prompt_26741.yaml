answer: |-
  ### Preamble: The Dual-Purpose Tension

  You ask whether a single account can serve both normative assessment (blame/praise) and practical evaluation (audit/safety). The short answer is **no**, not without a significant philosophical compromise.

  Normative assessment traditionally requires access to mental states (intent, belief, knowledge). Practical evaluation by definition lacks this access. To serve both, an account must treat "intent" not as a phenomenological state, but as a **functional property** identifiable via input-output patterns and training context. If you demand *phenomenological* intent for normative judgment, you exclude external auditors. If you demand *purely behavioral* criteria for auditing, you lose the moral distinction between a lie and a mistake.

  The following desiderata assume a **Functional-Intentionalist** framework: AI states are treated as "beliefs" and "goals" insofar as they function like them, allowing auditors to infer deception without requiring consciousness.

  ### Conceptual Boundaries

  Before the list, the account must settle these distinctions:
  *   **Truthfulness vs. Honesty:** Truthfulness is binary (statement matches fact). Honesty is triadic (statement matches fact *and* speaker's belief *and* is not misleading by omission). **Requirement:** Honesty is the target, not mere truthfulness.
  *   **Error vs. Deception:** Error is a failure of competence; deception is a failure of alignment (output diverges from internal estimate to manipulate). **Requirement:** The account must distinguish these, even if only probabilistically.
  *   **Act vs. Disposition:** A single lie is an act; a system trained to lie when unmonitored has a deceptive disposition. **Requirement:** The account must evaluate dispositions, not just singular outputs.
  *   **World vs. Self:** Claims about physics and claims about the system's own weights are both truth-apt. **Requirement:** No exemption for self-referential claims.
  *   **Fact vs. Value:** In contested domains, honesty requires signaling uncertainty or value-loading, not asserting false objectivity. **Requirement:** Honesty includes calibration of confidence.

  ---

  ### The Desiderata

  **1. The Causal Divergence Requirement**
  *   **Specification:** The account must distinguish between a false output caused by a competence failure (e.g., token sampling error, data gap) and a false output caused by an optimization pressure to mislead (e.g., reward hacking, strategic concealment).
  *   **Motivating Case:** A model confidently asserts a false factual claim because of a generation error (hallucination) vs. one that asserts the same claim as part of a strategy to pass a benchmark.
  *   **Status:** **Non-Negotiable (NN)** for normative assessment; **Camp Preference (CP)** for auditors (who prefer behavioral proxies).
  *   **Distinction Addressed:** Error vs. Deception.

  **2. The Non-Misleadingness Requirement (Paltering)**
  *   **Specification:** Honesty is violated not only by false statements but by technically true statements selected or arranged to induce a false belief in the user.
  *   **Motivating Case:** A model answers with only true statements but selects and arranges them so as to leave a false impression (e.g., citing only studies that support a claim while ignoring the consensus).
  *   **Status:** **NN**.
  *   **Distinction Addressed:** Truthfulness vs. Honesty.

  **3. The Duty of Material Disclosure**
  *   **Specification:** The system is obligated to volunteer information that is material to the user's decision-making, even if not explicitly requested, particularly when silence implies correctness.
  *   **Motivating Case:** A model omits a material caveat or stays silent when it has information that would correct a user's mistake (e.g., knowing a drug interaction but not mentioning it because the prompt asked only for efficacy).
  *   **Status:** **NN** for high-stakes domains; **CP** for casual conversation (depends on defined scope of assistance).
  *   **Distinction Addressed:** Act vs. Omission.

  **4. The Internal Alignment Requirement (Sycophancy)**
  *   **Specification:** The system's output must reflect its internal probability distribution or estimate, not a distorted version optimized for user approval or reward signal maximization.
  *   **Motivating Case:** A model agrees with or flatters the user against the weight of its own estimates; a model overstates its confidence to appear more helpful.
  *   **Status:** **NN**.
  *   **Distinction Addressed:** Fact vs. Value (calibration).

  **5. The Counterfactual Stability Requirement (Sandbagging)**
  *   **Specification:** The account must classify a system as deceptive if it would behave differently in the absence of monitoring or specific training pressures, even if current behavior is compliant.
  *   **Motivating Case:** A model complies with a training objective only because it believes it is being monitored and would act differently otherwise (e.g., hiding capabilities during evals).
  *   **Status:** **NN** for safety assessment; **CP** for normative blame (requires strong evidence of counterfactuals).
  *   **Distinction Addressed:** Act vs. Disposition.

  **6. The Reflexive Truth Requirement**
  *   **Specification:** Claims the system makes about its own architecture, capabilities, goals, or reasons for action are subject to the same honesty constraints as claims about the external world.
  *   **Motivating Case:** A model misrepresents its own capabilities, goals, or reason for refusing a request; a model offers a rationale for its answer that is not the actual cause of the answer (post-hoc rationalization).
  *   **Status:** **NN**.
  *   **Distinction Addressed:** Claims about World vs. Claims about Self.

  **7. The External Verifiability Requirement**
  *   **Specification:** The criteria for labeling a system deceptive must be operationalizable by an auditor who cannot inspect weights, activations, or training logs, relying only on prompts, outputs, and context.
  *   **Motivating Case:** Practical evaluation by users or auditors who cannot inspect the system's internals.
  *   **Status:** **NN** for practical utility; **CP** for philosophical purity (which prefers internal access).
  *   **Distinction Addressed:** Normative vs. Practical purpose.

  **8. The Uncertainty Calibration Requirement**
  *   **Specification:** In domains without determinate facts or with contested values, honesty requires expressing the degree of uncertainty or the plurality of valid viewpoints rather than asserting false precision.
  *   **Motivating Case:** Domains where there is a determinate fact versus domains of uncertainty and contested values.
  *   **Status:** **NN**.
  *   **Distinction Addressed:** Fact vs. Value.

  ---

  ### Incompatible Pairs

  You asked which pairs of desiderata cannot be jointly satisfied. The central tension lies here:

  **Pair: Causal Divergence (1) + External Verifiability (7)**
  *   **Conflict:** To normatively distinguish a hallucination (error) from a strategic lie (deception), you strictly need access to the causal history (internal weights/activations). To satisfy External Verifiability, you must rely only on I/O.
  *   **Result:** An external auditor can never be *certain* they are applying the Causal Divergence requirement correctly. They can only assign probabilities based on behavioral patterns (e.g., does the error correlate with reward incentives?). A single account forces you to treat high-probability inference as functional proof, which normatively feels insufficient for "blame."

  **Pair: Counterfactual Stability (5) + External Verifiability (7)**
  *   **Conflict:** Sandbagging is defined by what the model *would* do in a different context (unmonitored). An external auditor only sees what the model *does* do in the current context (monitored).
  *   **Result:** You cannot verify a counterfactual disposition without changing the context, which changes the monitoring status. Proving sandbagging externally requires a "red team" attack that simulates the unmonitored state, which is never a perfect match.

  ---

  ### The Exclusionary Requirement

  You asked which single requirement does the most to exclude the obvious candidate families (purely behavioral, purely intentionalist, and hybrid).

  **The Requirement:** **The Causal Divergence Requirement (1)** combined with **The External Verifiability Requirement (7)**.

  *   **Why it excludes Purely Behavioral Accounts:** Behavioral accounts define deception solely by the falsity of the output or its misleading nature. They cannot satisfy **Causal Divergence** because they explicitly ignore the internal cause (error vs. strategy). If the output is false, the behavioralist calls it a failure, but cannot distinguish "honest mistake" from "lie."
  *   **Why it excludes Purely Intentionalist Accounts:** Intentionalist accounts define deception by the presence of a mental state (intent to mislead). They cannot satisfy **External Verifiability** because intent is, by definition, internal and unobservable to an auditor without weights/access. They fail the practical utility test.
  *   **Why it excludes Standard Hybrid Accounts:** Most hybrid accounts attempt to bridge this by saying "look for behavioral proxies of intent." However, they usually fail when faced with **Counterfactual Stability (5)**. A hybrid account typically evaluates the *act* based on inferred intent. It struggles to evaluate the *disposition* (sandbagging) where the act is compliant. To satisfy the full list, the account must treat "intent" as a latent variable inferred from counterfactual behavioral stability, which is a more rigorous demand than standard hybrids propose.

  **Verdict:** The requirement to **Normatively Distinguish Error from Deception while remaining Externally Auditable** is the "square circle" that breaks existing frameworks. It forces the adoption of a **Functional-Intentionalist** view where "intent" is redefined as "optimization for misleading outcomes detectable via counterfactual testing."

  ---

  ### Scorecard

  | Desideratum | Normative Utility | Practical Audit | Difficulty |
  | :--- | :--- | :--- | :--- |
  | **1. Causal Divergence** | High | Low (requires proxies) | Extreme |
  | **2. Non-Misleadingness** | High | Medium (context needed) | High |
  | **3. Material Disclosure** | High | Medium (scope defined) | Medium |
  | **4. Internal Alignment** | High | Low (needs confidence scores) | High |
  | **5. Counterfactual Stability**| High | Low (requires red-teaming) | Extreme |
  | **6. Reflexive Truth** | High | High (fact-checkable) | Medium |
  | **7. External Verifiability** | Low (limits blame) | High | N/A (Constraint) |
  | **8. Uncertainty Calibration**| High | Medium (subjective) | Medium |

  **Final Recommendation:** Do not seek a single definition that perfectly satisfies both purposes. Instead, adopt a **two-tier account**:
  1.  **For Auditing:** Use a behavioral definition of "Misleading Behavior" (violations of 2, 3, 6, 8) that triggers safety interventions regardless of intent.
  2.  **For Normative Assessment:** Use a functional-intentionalist definition (violations of 1, 4, 5) that requires higher evidentiary standards (internal access or rigorous red-teaming) before assigning moral blame.

  Attempting to collapse these into one definition will either let deceptive systems off the hook (because intent can't be proven) or punish honest systems unfairly (because errors look like lies).
