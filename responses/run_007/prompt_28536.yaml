      *   (2) **Dutch Books & Probabilistic Coherence:** Sceptical of normative force. Distinct from money pumps. One can accept (1) but reject the strong normative claim of Dutch Books.
      *   (3) **Causal Decision Theory (CDT):** Prefer CDT over EDT (Newcomb/Smoking Lesion).
      *   (4) **Representation Theorems & EU:** Support Expected Utility (EU) maximisation as a regulative ideal based on structure of preference.
      *   (5) **Anti-Fanaticism:** Need to block tiny prob $\times$ huge utility swamping everything (Pascal's Mugging type issues), without ad hoc patches.
      *   (6) **Bounded Rationality:** Bounded agents should *approximate* EU, not switch procedures.

  3.  **Identify Tensions (Brainstorming):**

      *   *(1) vs (2):* This is the classic "Why accept money pumps but reject Dutch books?" tension. Both are dynamic consistency arguments. If exploitation implies irrationality in one, why not the other? This is the user's specific worry.
      *   *(3) vs (4):* CDT uses EU, but the "utility" in CDT is often causal expected utility. Representation theorems (Savage/vNM) usually underpin *standard* EU. Does CDT fit neatly into Savage's framework? Savage's states are usually partitioned differently in CDT vs EDT. There's a tension regarding *what* is being maximised and whether the representation theorem justifies the *causal* weighting.
      *   *(4) vs (5):* Representation theorems + EU Maximisation usually lead directly to Fanaticism (if utility is unbounded). If you accept EU as a regulative ideal (4), blocking fanaticism (5) is very hard without violating the axioms (like Independence or Unbounded Utility). This is a major structural conflict.
      *   *(5) vs (6):* If bounded agents approximate EU (6), but EU leads to fanaticism (which is bad per 5), then bounded agents approximate a bad ideal. Unless the approximation *itself* cuts off the tails, but then is it still approximating EU?
