answer: |-
  This is a classic sticking point in Dewey scholarship, and your advisor is right: the connection is structural, not metaphorical. You aren't missing a hidden premise about a "collective subject" (Dewey would reject that as residual Hegelianism), but you might be underestimating the role of **communication** as the mechanism that scales the active/passive structure from the individual to the public.

  Here is the move Dewey is making, broken down into three components that should help you bridge Chapter 11 of *Democracy and Education* to your work on deliberation.

  ### 1. Experience is Transactional, Not Subjective
  Your hesitation stems from reading the "active/passive" distinction as first-personal phenomenology (i.e., *my* consciousness acting on *my* world). For Dewey, experience is **transactional**. It is not something that happens *in* a person; it is what happens *between* an organism and an environment.

  In the flame example, the "experience" isn't the pain in the finger; the experience is the **reconstruction of the relationship** between the finger and the flame.

  When you scale this to democracy, the "organism" is not a mystical collective mind, but a network of individuals engaged in **associated living** (a key phrase in *Democracy and Education*). The "environment" includes the social consequences of our joint actions.
  *   **Active (Trying):** Public policy, legislation, collective social action.
  *   **Passive (Undergoing):** The social consequences (economic shifts, environmental changes, distribution of resources).
  *   **The Connection:** This is where deliberation comes in.

  If a society acts (passes a law) and undergoes consequences (inequality increases), but no one traces the consequence back to the law, there is **no democratic experience**. There is just "dispersive, centrifugal, dissipating" activity, exactly as Dewey warns in your passage. Democracy, for Dewey, is the institutionalization of the *connection* phase.

  ### 2. Communication as the Scaling Mechanism
  You asked how the structure scales without a collective subject. The answer is **communication**. In *Democracy and Education*, Dewey argues that communication is what makes individual experiences "common."

  In the individual case, memory and cognition connect the action to the consequence. In the political case, **deliberation and inquiry** perform that cognitive function.
  *   When I stick my finger in the flame, *I* learn the connection.
  *   When a public enacts a policy, *we* must learn the connection through inquiry.

  If the consequences of public action are not communicated back to the agents of the action, the "return wave of consequences" is broken. This is why Dewey's later political work (*The Public and Its Problems*) focuses so heavily on the conditions of communication. A democratic public is not a subject that feels pain; it is a network of transactions where consequences are tracked, reported, and analyzed so that the "flux is loaded with significance."

  So, deliberation isn't just "talking about values." It is the **epistemic process of linking collective trying to collective undergoing.** Without it, political action is just blind impulse (mere activity).

  ### 3. The Normative Stakes: Education vs. Miseducation
  This is the crucial pivot for your dissertation. If experience requires the connection between action and consequence to be educative, then **political arrangements that obscure consequences are anti-democratic.**

  Dewey's definition of experience gives you a criterion for evaluating democratic institutions:
  *   **Educative Democracy:** Institutions allow citizens to perceive the link between their political choices (active) and social outcomes (passive). Deliberation flourishes here because the "data" of consequences is available.
  *   **Non-Democratic (or Miseducative) Arrangements:** Complex bureaucracies, opaque lobbying, or structural inequalities that disconnect the decision-makers from the consequences. Here, the "active" phase (voting/policymaking) is severed from the "passive" phase (suffering the results).

  This avoids the "collective subject" trap. You don't need the public to be one mind. You just need the **transactions** to be visible and traceable. When a specific group undergoes consequences (e.g., pollution) but cannot communicate that back to the group that did the acting (e.g., industry/regulators), the experience is fragmented. Democracy is the project of reintegrating those fragmented experiences through communication.

  ### How to Frame This in Your Dissertation
  You can argue that Dewey's account of deliberation is not a procedural add-on to democracy, but the **cognitive infrastructure required for collective experience to exist at all.**

  1.  **Reject the Aggregation Model:** Deliberation isn't just aggregating pre-formed individual preferences (which would be "mere activity").
  2.  **Adopt the Experimental Model:** Deliberation is the method by which a public tests hypotheses (policies) and registers results (consequences) to reconstruct future action.
  3.  **The "Undergoing" is Distributed:** Acknowledge that in politics, the "trying" and the "undergoing" are often done by different people (representatives act; constituents undergo). This makes communication *more* vital, not less. The "return wave" must travel through media, elections, and protest to complete the circuit of experience.

  ### Recommended Secondary Literature
  Since you are at the dissertation stage, you likely know the big names, but if you haven't dug into these specific angles, they might help solidify the argument:
  *   **James Bohman:** His work on Deweyan deliberation emphasizes the "division of democratic labor" and how communication bridges the gap between individual experience and public problems.
  *   **Robert Westbrook:** *John Dewey and American Democracy* provides the historical context for how Dewey moved from the educational to the political application of this schema.
  *   **Lorraine Smith Pangle:** She writes well on the tension between individual learning and civic education in Dewey.
  *   **Dewey's *The Public and Its Problems* (1927):** While you are working on *Democracy and Education*, Chapter 3 of *Public* is essentially the political translation of Chapter 11 of *Education*. He explicitly defines the public as those who share in the **indirect consequences** of transactions. That is the "undergoing" scaled up.

  **Summary:** The move you're missing is that **deliberation is the collective analog to cognition.** Just as cognition connects action to consequence in the individual to produce learning, deliberation connects policy to outcome in the public to produce social intelligence. It's not a metaphor; it's a functional isomorphism.
