      *   *Scaling Up:* How does "I stick my finger in the flame" become "We pass this law"?
          *   Action: Public policy / Collective action.
          *   Consequence: Social effects (inequality, pollution, economic shift).
          *   Connection: Deliberation/Inquiry (noticing the link between policy and effect).
      *   *The Missing Link:* **Communication.** In *Democracy and Education*, communication is the mechanism by which individual experiences become shared.

  4.  **Formulate the Argument (The "Move" the User is Missing):**
