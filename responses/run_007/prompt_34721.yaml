      *   *Scholarly References:* Mentioning *The Public and Its Problems* (1927) is essential here, even though the user is on *Democracy and Education* (1916). It's the political elaboration of these exact ideas. Also, maybe mention contemporary interpreters (Bohman, Talisse, or classic ones like Hickman) to ground the PhD-level discussion.

