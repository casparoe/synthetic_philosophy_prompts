answer: |-
  # Workshop Q&A Prep Sheet: Defending Williams's Integrity Objection

  **Context:** Department Ethics Workshop
  **Topic:** Williams's "One Thought Too Many" as a Structural Critique of Deliberation
  **Time Limit per Reply:** ~2 Minutes

  ---

  ### 1. The "Dispositional vs. Occurrent" Objection
  **Likelihood:** 5/5 | **Damage:** 4/5
  **Raised By:** The Sophisticated Consequentialist (Railton fan)

  **The Question:** "You're attacking a straw version of sophisticated consequentialism. Railton already distinguished between the *criterion of rightness* and the *decision procedure*. The agent doesn't need to occurrently validate their commitment against the impartial standpoint in the moment. They can just love their wife. So where is the alienation if the thought never crosses their mind?"

  **2-Minute Reply:**
  *   **Distinguish Access from Authority:** Acknowledge Railton's distinction. Concede the agent need not have the *thought* occurrently.
  *   **The Structural Point:** Argue that alienation arises from the *authority structure*, not the psychological occurence. My commitment to my wife holds only *because* the impartial standpoint permits it. It is on loan from the System.
  *   **The Counterfactual Test:** If the impartial standpoint demanded I sacrifice her, my commitment would have to dissolve. The fact that my ground project is *conditional* on external validation—even if dispositional—means I am not fully identified with it. I am an administrator of my own life, not the author.
  *   **Closing:** Alienation isn't feeling distant; it's the structural subordination of my ground projects to an external tribunal.

  **Weakest Link:** Explaining why "structural subordination" matters normatively if it has no psychological impact on the agent's experience. If the agent feels no alienation, why is there a philosophical problem?

  ---

  ### 2. The "Bad Outcome" Trap
  **Likelihood:** 4/5 | **Damage:** 5/5
  **Raised By:** The Act-Utilitarian

  **The Question:** "Okay, suppose the impartial standpoint *does* demand you let your wife drown to save two strangers. You say saving her is a matter of integrity. Are you really arguing that you should let the strangers die? If so, isn't integrity just a fancy word for selfishness?"

  **2-Minute Reply:**
  *   **Reject the Dilemma:** Deny that Williams is committed to letting the strangers die *as a moral principle*. He is describing a conflict, not solving it with a new calculus.
  *   **The Point of the Objection:** The argument isn't that consequentialism gives the *wrong answer*; it's that it cannot make sense of the *cost* of the answer. Consequentialism sees the sacrifice of integrity as just another utility cost. Williams says it's a loss of the *agent*.
  *   **Pivot:** If I save my wife, consequentialism calls me irrational or lucky. I'm arguing consequentialism lacks the vocabulary to describe my action as *intelligible* without reducing me to a vessel for utility.
  *   **Closing:** I'm not saying integrity trumps utility; I'm saying a theory that requires me to view integrity as merely a utility input has misunderstood the agent.

  **Weakest Link:** Risk of sounding like you are endorsing a non-moral preference (saving wife) over a moral requirement (saving more lives), making you look morally shallow to the agnostics.

  ---

  ### 3. The "Practical Identity" Co-opt
  **Likelihood:** 3/5 | **Damage:** 3/5
  **Raised By:** The Korsgaardian Kantian

  **The Question:** "This sounds exactly like Korsgaard's 'Practical Identity.' You're saying we need commitments that constitute who we are. But Korsgaard argues these identities must be reflectively endorsable from a universal standpoint. Why is Williams's view better than just saying your ground projects *are* your contribution to the Kingdom of Ends?"

  **2-Minute Reply:**
  *   **Source of Normativity:** For Korsgaard, the identity is valid *because* it passes the universal test. For Williams, the identity is valid *because it is mine*.
  *   **Direction of Fit:** Korsgaard: World/Universal → Agent. Williams: Agent → World.
  *   **The Alienation Remains:** Even if the Kingdom of Ends "approves" of my love for my wife, the fact that I need that approval to legitimize the love is the alienation. Williams values the *ground project* as the source of value, not the reflection upon it.
  *   **Closing:** Korsgaard saves the agent by making them universal. Williams saves the agent by letting them be particular.

  **Weakest Link:** Korsgaardians are skilled at arguing that without the universal standpoint, practical identity is just brute inclination. You risk conceding that Williams offers no *normative* force, only a psychological description.

  ---

  ### 4. The "Wrong Framework" Objection
  **Likelihood:** 3/5 | **Damage:** 2/5
  **Raised By:** The Virtue Ethicist

  **The Question:** "You're framing this as a problem of deliberative structure. But integrity isn't about how you deliberate; it's about character. A virtuous person doesn't 'validate' their commitments; they just embody them. Isn't the whole debate a symptom of modern moral philosophy's obsession with procedure?"

  **2-Minute Reply:**
  *   **Partial Concession:** Agree that modern moral theory over-intellectualizes deliberation.
  *   **Defend the Frame:** However, consequentialism *explicitly* claims to be a decision procedure (or a criterion that dictates one). It forces the structural question.
  *   **Strategic Move:** Use the VE to bolster Williams. If VE is right that deliberation shouldn't look like this, that supports Williams's claim that consequentialist deliberation is alienating.
  *   **Closing:** Even if VE is the better home for integrity, my talk is specifically about why Consequentialism cannot absorb this critique, even if it tries to mimic VE dispositions.

  **Weakest Link:** If you concede too much to the VE, the Consequentialists will argue you've abandoned the normative debate for a sociological one.

  ---

  ### The Dreaded Question (Hope Nobody Asks)

  **"Is 'alienation' just a contingent psychological cost you're weighing against utility, or is it a trump? If it's a trump, where does its authority come from if not... an impartial justification?"**

  **Why this is dreaded:** This forces you into a Euthyphro-style dilemma.
  1.  **If Alienation is a cost:** Then sophisticated consequentialism wins. They just add "psychological alienation" to the utility calculus. If the alienation is bad enough, they won't demand the sacrifice. You haven't refuted them; you've just given them a new variable.
  2.  **If Alienation is a trump:** You need to explain the *normative authority* of integrity. Why does integrity forbid the sacrifice? If you say "because it's wrong," they ask "why?" If you appeal to an impartial reason to justify integrity, you've collapsed back into the structure you're attacking. If you refuse to justify it, you look like an irrationalist defending brute preferences.

