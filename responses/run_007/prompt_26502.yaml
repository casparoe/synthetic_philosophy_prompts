      *   *Virtue Ethicist:* "This is all too abstract. Integrity isn't about deliberation structures; it's about character. You're intellectualizing a habit."
      *   *Agnostic/Meta-ethicist:* "Is this just a psychological claim masquerading as normative? Are you saying alienation is *bad* consequentially or intrinsically?"

  4.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Objection 1 (Most Likely/Damaging):* The Sophisticated Consequentialist (Railton). They think this is settled. They will argue the "justification" doesn't need to be present to consciousness.
          *   *Reply:* Distinguish *occurrent* thoughts from *structural authority*. Even if I don't think it, the fact that my commitment holds only *because* the System approves is what alienates me.
