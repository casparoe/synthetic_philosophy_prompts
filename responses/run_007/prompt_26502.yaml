      *   *Objection 2 (High Damage):* The Act-Utilitarian. The "Bad Outcome" challenge. What if the impartial view says "No, let her drown"?
          *   *Reply:* That reveals the core conflict. If I let her drown for the System, I've lost integrity. If I save her *despite* the System, the System isn't sovereign.
          *   *Weakness:* Makes Williams look like he prefers bad outcomes (the "shallow" objection).

      *   *Objection 3 (Korsgaardian):* "Practical Identity."
