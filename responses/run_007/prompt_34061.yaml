prompt: |-
  I've been reading about the Church–Turing thesis lately — not the thesis itself, which I gather every computer scientist and logician accepts, but the protracted philosophical argument about what kind of claim it actually is. On one side, people hold that it is a definition, or something close to one, and therefore not the sort of thing that admits of proof or disproof. On another, it is treated as an empirical hypothesis about the limits of what human beings can compute, supported by the failure to find counterexamples and by the convergence of independent formalisms. A third camp treats it as a theorem whose only missing premise is a precise analysis of "effectively computable," and that analysis is precisely what the thesis supplies, so the whole thing is really a conceptual clarification rather than a discovery. And there are further positions I am probably missing. The mathematics is not in dispute — everyone agrees that Turing computability, general recursiveness, and lambda-definability pick out the same class of functions. The debate has been running for the better part of a century, and as far as I can tell, it has not moved.

  I spent my career in the natural sciences, where a disagreement that persists for decades typically means that someone has not specified what would count as evidence, or that the question is badly posed, or that the disputants are talking past each other. So I want a diagnosis of the structure of this impasse before I invest any more time in reading the individual positions. Is there a hidden empirical question at the bottom — for instance, about whether any physical process could out-compute a Turing machine? Is the disagreement really about what counts as an adequate explanation of a pre-theoretic notion like "computable"? Or are the different parties answering different questions under the same heading — one asking about the nature of mathematical functions, another about the capacities of human beings, another about the physics of computation? And given your diagnosis, what would it take to make progress: a formal result, a sharper distinction, an experiment, or simply the recognition that the question should be retired? Please write your response as continuous prose — no headings, bullet points, bold text, or tables — the way you would write a letter.
