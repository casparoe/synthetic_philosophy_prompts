answer: |-
  Dear Friend,

  Your intuition serves you well, and your frustration is entirely warranted. Coming from the natural sciences, where a disagreement persisting for a century usually signals a fundamental flaw in the experimental design or the formulation of the hypothesis, you are looking at this debate through the correct lens. The reason the Church–Turing thesis remains a philosophical battleground rather than a settled fact is not because the mathematics is obscure, but because the participants are indeed answering different questions under the same label. The impasse is structural, arising from a conflation of three distinct claims that have been historically bundled together: a mathematical claim about functions, a physical claim about the universe, and a cognitive claim about human capability. Until these are disentangled, the debate will continue to spin in circles, with each camp producing valid arguments that simply bounce off the premises of the others.

  The core of the confusion lies in the status of the informal notion of effective calculability. When Church and Turing originally proposed their thesis, they were attempting to capture a pre-theoretic intuition about what it means for a human being to follow a finite set of rules to calculate a number. The first camp you mentioned, those who view the thesis as a definition, are largely working within pure mathematics and computer science. For them, the thesis functions as a stipulation that allows work to proceed. They are not interested in whether the definition matches reality, but rather in the utility of the formalism. However, the second camp, those who treat it as an empirical hypothesis, are actually talking about what is now often distinguished as the Physical Church–Turing Thesis. This is the hidden empirical question you suspected. It asks whether any physical system in our universe can compute functions that a Turing machine cannot. This is genuinely an open scientific question. If general relativity or quantum mechanics allows for physical processes that perform hypercomputation, such as exploiting Malament–Hogarth spacetimes or infinite precision measurements, then the physical thesis is false. This is not a matter of conceptual analysis but of physics, and it is where your scientific background is most applicable. The failure to find counterexamples here is not a logical proof but an inductive generalization from current physical theories.

  The third camp, which views the thesis as a theorem awaiting a precise analysis of the informal concept, is engaged in a project of conceptual clarification. Philosophers and logicians like Wilfried Sieg and Robin Gandy have argued that if we rigorously axiomatize the constraints on a human computer—such as the boundedness of sensory input and the locality of state changes—we can derive Turing computability as a mathematical consequence. If their analysis is accepted, the original Church–Turing thesis becomes a theorem about abstract agents satisfying certain constraints. However, this only settles the matter for the logical thesis, not the physical one. The impasse persists because proponents of the empirical view often reject the conceptual analysis as too restrictive, arguing that it assumes what it sets out to prove by baking Turing-like constraints into the definition of an agent. Meanwhile, the conceptual analysts argue that the empirical proponents are changing the subject from computation to physical dynamics. They are talking past each other because one side is discussing the limits of symbolic manipulation while the other is discussing the limits of physical causality.

  So, to answer your question about what would make progress, we should not look for a single experiment or a new formal result that settles the whole debate. Instead, progress requires a dissolution of the monolithic thesis into its constituent parts. We need to recognize that the Logical Church–Turing Thesis is likely a conceptual truth grounded in the analysis of finite symbolic procedures, while the Physical Church–Turing Thesis is a contingent hypothesis about the laws of nature that remains falsifiable. The debate will not end with a proof because the original formulation ambiguously straddles the line between necessity and contingency. What is needed is not a discovery, but a sharper distinction that allows computer scientists to proceed with the logical thesis as a definition while physicists remain free to investigate hypercomputation as an empirical possibility. Once this distinction is universally adopted, the philosophical heat will dissipate, leaving behind separate, tractable questions in logic, physics, and cognitive science.

  In short, the question should not be retired, but it must be fragmented. The century-long stalemate is a artifact of language rather than reality. You would be best served by reading contemporary literature that explicitly distinguishes between the logical, physical, and cognitive versions of the thesis. You will find that the mathematicians have largely moved on, secure in their formalisms, while the physicists and philosophers of mind continue to argue about the boundaries of the physical and the mental. Your instinct that the disagreement implies a badly posed question is correct, but the solution is not to discard the inquiry, but to parse it into questions that are well-posed enough to be answered by either proof or experiment. I hope this diagnosis helps you navigate the literature without feeling that you are missing a hidden key; the key is simply the realization that there are multiple locks on the door.

  Yours sincerely,

  A Fellow Traveler in Thought
