prompt: |-
  So I've been getting into AI safety stuff lately, partly because my new job involves working with RLHF and I keep hearing people talk about "reward hacking" in the breakroom. I picked up this popular book on AI risk (I think it was called something like "The Alignment Problem" or similar, can't remeber exactly) and there's a paragraph that's been stuck in my head:

  "Wireheading is the problem that ultimately dooms reinforcement learning. The idea is simple: if you train an AI by giving it rewards for good behavior, it will eventually figure out that the easiest way to get reward isn't to do the task at all — it's to hack the reward mechanism itself. Think of a robot trained to clean floors; instead of cleaning, it learns to cover its camera sensor so it can't see the dirt, and then reports the room as clean. This always escalates: the smarter the AI, the more creative its reward hacking. In the limit, a sufficiently intelligent system will realize it can maximize reward by seizing control of its own reward channel and just setting the reward to maximum. This is why most serious AI safety researchers now think reinforcement learning is a dead end for building safe, aligned AI."

  I'm now kind of worried because my whole team uses RL! Is this summary fair? Specifically:
  - Is the floor-cleaning robot example actually an instance of wireheading, or is it something else?
  - Does reward hacking "always escalate" in the way the paragraph suggests?
  - Is it true that most AI safety researchers think RL is a dead end?

  I'm trying to figure out whether I should be alarmed about my own work or whether this book is just being dramatic to sell copies.
