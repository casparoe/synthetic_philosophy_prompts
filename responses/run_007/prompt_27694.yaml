  ### The Sleeping Beauty Decision Tree

  **Instructions:** Answer the following questions based on your intuition about the setup. Be consistent: if you say a probability changes in Q1, carry that logic into Q2.

  #### Q1: The "Wake-Up" Update
  Before the experiment, you know the coin is fair (50% Heads). When you wake up in the room (without knowing the day), does your confidence that the coin landed **Heads** change from that original 50%?
  *   **A)** No, it stays at 50%.
  *   **B)** Yes, it decreases (Heads becomes less likely).
  *   **C)** Yes, it increases (Heads becomes more likely).

  #### Q2: The "Monday" Filter
  Imagine you wake up and a note is handed to you that says **"Today is Monday."** Compared to your answer in Q1 (your confidence *before* reading the note), does your confidence in **Heads** change now?
  *   **A)** No, it stays the same as Q1.
  *   **B)** Yes, it increases (Heads becomes more likely).
  *   **C)** Yes, it decreases (Heads becomes less likely).

  #### Q3: The "Sample Space" Check
  When you wake up, do you consider "I am awake right now" to be a random sample drawn from all possible awakenings (Heads-Mon, Tails-Mon, Tails-Tue)?
  *   **A)** Yes, waking up is like drawing a ticket from a hat containing all three possibilities.
  *   **B)** No, waking up was guaranteed to happen regardless of the coin; it's not a random sample.

  #### Q4: The "Tuesday" Elimination
  When you learn it is **Monday**, do you consider the "Tails & Tuesday" scenario to be completely ruled out of the possible worlds?
  *   **A)** Yes, that scenario is now impossible.
  *   **B)** No, it still holds some weight or relevance to the coin flip probability.

  ---

  ### The Leaves (Your Position)

  Follow your answers to find your position.

  #### 1. The Standard Thirder
  *   **Path:** Q1(**B**) → Q2(**B**) → Q3(**A**)
  *   **Credence:** 1/3 on waking; 1/2 on Monday.
  *   **Diagnosis:** You believe waking up provides new self-locating evidence. Since Tails produces twice as many awakenings, finding yourself awake makes Tails more likely. Learning it's Monday eliminates the Tails-Tuesday option, restoring the odds to 50/50.

  #### 2. The Standard Halfer (Lewisian)
  *   **Path:** Q1(**A**) → Q2(**B**) → Q4(**A**)
  *   **Credence:** 1/2 on waking; 2/3 on Monday.
  *   **Diagnosis:** You believe waking up provides no new evidence about the coin. However, once told it's Monday, you eliminate the Tuesday possibility. Since Tails loses an option but Heads doesn't, Heads becomes more likely relative to Tails.

  #### 3. The Double Halfer
  *   **Path:** Q1(**A**) → Q2(**A**) → Q4(**A**)
  *   **Credence:** 1/2 on waking; 1/2 on Monday.
  *   **Diagnosis:** You believe waking up provides no evidence. Crucially, you also believe learning it's Monday *still* doesn't change the coin odds, even though Tuesday is ruled out. You likely treat the coin flip as independent of the day-indexing.

  #### 4. ⚠️ Empty Leaf: The "Heads-Favoring" Waker
  *   **Path:** Q1(**C**)
  *   **Diagnosis:** Nobody lives here because waking up cannot make Heads more likely; Tails has more awakenings, so if anything, waking should favor Tails.

  #### 5. ⚠️ Empty Leaf: The "Stubborn Thirder"
  *   **Path:** Q1(**B**) → Q2(**A**) or Q2(**C**)
  *   **Diagnosis:** Incoherent; if you start at 1/3 (H-M, T-M, T-T) and eliminate T-T, you must move to 1/2, not stay at 1/3 or drop lower.

  #### 6. ⚠️ Empty Leaf: The "Anti-Bayesian Halfer"
  *   **Path:** Q1(**A**) → Q2(**C**)
  *   **Diagnosis:** Incoherent; eliminating a Tails outcome (Tuesday) should never make Heads *less* likely than it was before.

  ---

  ### Limitations & Notes

  **Can this tree separate everyone?**
  No. This tree separates positions based on **credence movements** (the numbers). It cannot distinguish between philosophers who arrive at the same numbers using different metaphysical justifications.
  *   *Example:* A "Self-Indication Assumption" Thirder and a "Long-Run Frequency" Thirder will both land on **Standard Thirder**, even if they argue fiercely about *why*.
  *   *Example:* A "Centred Conditionalization" Double Halfer and a "Possibility Elimination" Double Halfer will both land on **Double Halfer**.

  **Why Q3 and Q4?**
  Q1 and Q2 sort the numbers. Q3 and Q4 are "sanity checks" to ensure your reasoning matches the numbers.
  *   If you answered **Standard Halfer** but said **No** to Q4 (Tuesday isn't ruled out), your logic is buggy: you claim the odds shift on Monday (Q2) but deny the mechanism that shifts them (Q4).
  *   If you answered **Standard Thirder** but said **No** to Q3 (Waking isn't a sample), you might be a Thirder for non-standard reasons (e.g., betting arguments only), which is valid but worth noting.

  **For the Software Engineer:**
  Think of the coin flip as initializing a variable `coin_state`.
  *   **Halfers** think `wake_event` does not update `P(coin_state = Heads)`.
  *   **Thirders** think `wake_event` is a query that returns a row from a database where Tails has duplicate entries, updating the probability.
  *   **Double Halfers** think `wake_event` doesn't update the probability, and the `if day == Monday` filter *also* doesn't update the probability, despite filtering the dataset. (This usually implies a specific exception handling in their Bayesian update logic).
