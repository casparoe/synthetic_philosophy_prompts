prompt: |-
  I'm a software engineer with no philosophy background, but I recently read the Zhuangzi butterfly bit (the one where he wakes up and isn't sure if he dreamed he was a butterfly or is a butterfly dreaming he's a man) and then rewatched Inception, and I cant stop turning them over together. I want a reading of Inception through that passage and through dream skepticism more generally. The contrast I keep noticing: Zhuangzi seems basically fine with the uncertainty, even treats it as a kind of transformation, while Inception treats the dream/waking boundary as an engineering problem with a test (totems, the spinning top at the end) and a huge cost if you get it wrong. So read the movie against the Zhuangzi idea: where does Inception actually engage the same skeptical worry, and where is it working a different problem? Specifically, is Cobb's spinning top supposed to be an answer to the skeptical worry, and would Zhuangzi or the dream-skeptic tradition think that's the right kind of move? Don't just summarize the plot; I want a real back-and-forth where you say honestly where the movie resist the reading too.

  After the reading, give me a short structured summary as a JSON object with these fields:
  - "scenes": an array of 3-5 specific scenes or plot devices from Inception that bear on the dream/waking question, each with a one-sentence note on what it shows.
  - "zhuangzi_themes": an array of the distinct ideas from the butterfly passage and the dream skepticism tradition you're using, one sentence each.
  - "matches": an array of up to 3 strings naming places where the movie genuinely touches the Zhuangzi problem.
  - "resistances": an array of up to 3 strings naming places where the movie is doing something else and the Zhuangzi reading would be forced.
  - "bottom_line": one sentence saying whether Inception is best read as dream skepticism or as something else.
