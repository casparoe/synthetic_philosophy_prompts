answer: |-
  Dear colleague, it is smart to step back and clarify the target before firing at the theories, because the distribution question is where metaphysics crashes hardest into biology. If you are building a scorecard for theories of consciousness distribution, the first and perhaps most critical desideratum is that the theory must not collapse the distinction between sentience and sapience. You need a framework that can accommodate the possibility of a creature having phenomenal experiences without possessing higher-order thoughts, language, or complex conceptual capacities. This is largely non-negotiable for anyone working within a naturalistic framework who accepts the Cambridge Declaration on Consciousness, because if you define consciousness in a way that requires metacognition, you inevitably rule out most non-human animals by fiat rather than by evidence. Theories like Higher-Order Thought run afoul of this immediately, whereas First-Order theories handle it well, so treating this distinction as rigid is a requirement for a broad distribution view, though admittedly some cognitive camps treat it as a preference to intellectualize consciousness.

  Closely tied to that is the requirement of evolutionary gradualism, which dictates that consciousness should not appear magically in the lineage solely at the human branch. An adequate theory must allow for continuity in neural and behavioral capacities across phylogeny, meaning that if a trait relevant to consciousness exists in a homologous structure in mammals and birds, the theory should not deny consciousness to one while granting it to the other without a compelling structural reason. This is non-negotiable for any theory that aims to be compatible with standard evolutionary biology, although some dualists or exceptionalists might reject it to preserve human uniqueness. You also need a desideratum of empirical adequacy regarding comparative neurobiology and ethology, which means the theory cannot contradict established findings about neural correlates like the thalamocortical system in mammals or the vertical lobes in cephalopods, nor can it ignore behavioral markers of pain avoidance and learning that suggest subjective experience. This is non-negotiable for any theory claiming scientific validity, as a theory that predicts fish are unconscious despite nociceptive opioid systems is failing to track the data.

  Another conceptual constraint you should list is the avoidance of epiphenomenalism, meaning the theory should explain what consciousness is for rather than treating it as a causally inert byproduct. This is preferable but not strictly non-negotiable, as some property dualists accept epiphenomenalism, but for a naturalist trying to explain why consciousness evolved across animals, causal efficacy is almost required to avoid the evolutionary puzzle of why such a costly trait would be selected for if it did nothing. You also need the theory to handle the hard cases without absurdity, such as not granting consciousness to thermostats while denying it to dogs, which touches on the problem of panpsychism versus skepticism. This is a preference for most camps, as everyone wants to avoid the absurd extremes, but where people draw the line varies significantly. Finally, the theory must respect the distinction between having any consciousness at all versus having a specific kind of consciousness, ensuring it does not conflate the presence of experience with the richness of human experience. This is non-negotiable for the distribution question specifically, because your goal is to map the presence or absence of the light of experience, not the resolution of the screen.

  If you are looking for the single desideratum that knocks out the most otherwise-reasonable theories, it is the requirement to accommodate phenomenal consciousness in creatures lacking higher-order cognitive capacities, which is essentially the enforcement of the sentience-sapience distinction combined with evolutionary gradualism. This is the heaviest filter because it immediately disqualifies any theory that ties consciousness necessarily to language, metacognition, or a specific human-like prefrontal architecture. Many sophisticated cognitive theories, including standard Higher-Order Thought and some versions of Global Workspace Theory, struggle here because they define the conditions for consciousness in terms of cognitive access or reporting capabilities that non-human animals likely lack. By insisting that a theory must explain why a dog feels pain even if it cannot think about its pain, you force the theory to ground consciousness in lower-order sensory or affective systems, which eliminates a huge swath of intellectualist accounts that might otherwise look promising for human consciousness. This constraint does the most work because it forces the theory to be biological rather than purely cognitive, and that is where most philosophical accounts of mind tend to break when they meet the animal kingdom.
