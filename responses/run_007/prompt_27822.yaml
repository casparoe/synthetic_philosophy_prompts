      *   **Process:** Brainstorm candidate principles, test them against past cases, test against the new case, identify the closest analog, acknowledge underdetermination if necessary, and recommend a path forward with justification.
      *   **User Persona:** Software engineer on an EA-aligned grants committee (values logic, consistency, evidence, but not necessarily philosophical jargon).
      *   **Goal:** Prioritize understanding the *rules* being followed over a simple binary decision.

  2.  **Analyze the Past Decisions (The Data Set):**
      *   *Case 1 (Deworming):* Funded. High RCT evidence, low cost/QALY, health metric. -> *Principle: Strong evidence + quantifiable health impact = Fund.*
      *   *Case 2 (Mental Health):* Rejected. Moderate evidence, heterogeneous outcomes, hard to quantify. -> *Principle: Hard-to-quantify outcomes = Reject (even with some evidence).*
      *   *Case 3 (AI Safety):* Funded. Weak measurability, no near-term outcomes, high tail risk. -> *Principle: Existential/Catastrophic risk overrides measurability requirements.*
      *   *Case 4 (Arts Education):* Rejected. Anecdotal only, no controlled evidence. -> *Principle: Anecdotal evidence = Reject.*
      *   *Case 5 (Air Pollution Policy):* Funded. Quasi-experimental evidence, measurable health improvements. -> *Principle: Quasi-experimental + measurable impact = Fund (even if policy/advocacy).*

  3.  **Analyze the New Proposal (The Test Case):**
      *   **Topic:** Criminal Justice Reform (pretrial detention/incarceration).
      *   **Evidence:** Two credible quasi-experimental studies (like Case 5).
      *   **Outcomes:** Mixed. Some measurable (days incarcerated, rearrest), some hard to quantify (dignity, family stability).
      *   **Metrics:** Does not fit health-metric template (unlike Cases 1 & 5).
      *   **Severity:** Harms look large (potentially akin to Case 3's severity, but not existential).

  4.  **Brainstorm Candidate Principles (Hypothesis Generation):**
      *   *H1: The "Quantifiable Health" Rule.* Only fund if outcomes can be converted to QALYs/DALYs.
      *   *H2: The "Evidence Threshold" Rule.* Fund if there is RCT or strong quasi-experimental evidence, regardless of domain.
      *   *H3: The "Severity Override" Rule.* If the harm is severe enough (suffering/liberty), relax measurability constraints.
      *   *H4: The "Tractability/Measurability" Rule.* Reject if a significant portion of the value proposition is unquantifiable (like Case 2).
      *   *H5: The "EA Core vs. Longtermism" Split.* Health/Policy = Strict metrics; Existential Risk = Loose metrics.

  5.  **Test Principles Against Past Decisions:**
      *   *H1 (Quantifiable Health):* Fits 1, 2, 5. *Fails 3* (AI Safety has no health metrics). *Fails New Case* (Justice isn't health).
      *   *H2 (Evidence Threshold):* Fits 1, 5. *Fails 2* (Moderate studies rejected). *Fits 3* (Weak evidence funded, so threshold isn't uniform). *Inconsistent.*
      *   *H3 (Severity Override):* Fits 3 (Tail risk). Fits 5 (Health harms). Fits 1 (Health harms). *Explains why 2 & 4 were rejected* (Severity lower?). *Potential fit for New Case.*
      *   *H4 (Measurability Constraint):* Fits 2 (Rejected due to heterogeneity/quantification issues). Fits 4 (Anecdotal). *Tension with 3* (AI Safety funded despite weak measurability). *Tension with New Case* (Mixed metrics).
      *   *H5 (Domain-Specific Rules):* Global Health/Policy = Strict metrics. Existential Risk = High tolerance for uncertainty. *Fits all 5 cases perfectly.*

  6.  **Evaluate the New Case against the Best Principles:**
      *   The New Case sits in a "grey zone." It's not Global Health (Cases 1, 2, 5). It's not Existential Risk (Case 3). It's Domestic Policy/Justice.
      *   *Comparison to Case 5 (Air Pollution):* Both are policy advocacy. Both have quasi-experimental evidence. Both have measurable outcomes (health vs. incarceration days). *Difference:* Air pollution maps cleanly to health metrics (EA favorite); Justice maps to liberty/dignity (harder to aggregate).
      *   *Comparison to Case 2 (Mental Health):* Both have "soft" outcomes (dignity/family vs. mental health states). Both have mixed measurability. *Difference:* Case 2 had "moderate" studies; New Case has "credible quasi-experimental" (stronger).
      *   *Comparison to Case 3 (AI Safety):* Both address severe harms. *Difference:* AI is existential/longtermist; Justice is near-term/suffering-focused.

  7.  **Identify the Closest Analog:**
      *   **Case 5 (Air Pollution)** is the strongest structural analog. Both are policy interventions with quasi-experimental evidence targeting large-scale suffering/harm.
      *   **Case 2 (Mental Health)** is the strongest cautionary analog. Both struggle with quantifying the "full" value (dignity/family vs. mental wellness).
      *   *Verdict:* Case 5 is the better analog for *evidence type*, but Case 2 is the better analog for *metric friction*. However, since Case 5 was funded despite being policy (not direct aid like Case 1), it suggests the fund is open to policy if evidence is quasi-experimental.

  8.  **Synthesize the Recommendation:**
      *   The precedents are slightly underdetermined because Criminal Justice doesn't fit the "Global Health" or "Existential Risk" buckets perfectly.
      *   However, the *principle* that best explains the track record is: **"Fund interventions with strong causal evidence (RCT/Quasi-experimental) targeting severe, tractable harms, even if metrics aren't strictly QALYs, provided the core outcomes are measurable. Reject when outcomes are too heterogeneous or evidence is merely anecdotal/moderate, unless the risk is existential."**
      *   *Decision:* Lean towards **Funding**, but with conditions (similar to Case 3 or 5).
