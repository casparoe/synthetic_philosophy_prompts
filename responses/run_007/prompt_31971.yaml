answer: |-
  You have stumbled upon one of the most persistent and knotty problems in metaphysics. The territory you are describing is formally known as the **Metaphysics of Personal Identity**, and specifically the problem of **Transworld Identity** (identity across possible worlds).

  The specific intuition you have regarding the sperm and egg is a well-established philosophical position called **Origin Essentialism**. The rhetorical move you identified in arguments about privilege is often discussed under the banner of the **Non-Identity Problem**, though when used defensively, it is frequently accused of being a **Modal Fallacy**.

  Here is how philosophers have carved up this territory, the main positions on where the line is drawn, and the status of that argumentative move.

  ### 1. The Core Question: Transworld Identity
  When you ask, "Could *I* have been born in the 18th century?", you are asking about **transworld identity**. Can the very same entity (you) exist in a different "possible world" (a counterfactual scenario) with different properties?

  There are two dominant ways philosophers map this:

  **A. The Strict View (Kripke and Origin Essentialism)**
  The most famous defence of the intuition you described comes from the American philosopher **Saul Kripke**, particularly in his work *Naming and Necessity* (1970). Kripke argues for **Origin Essentialism**.

  His thesis is roughly this: An individual's origin is essential to them. You could not have come from different parents, nor from a different sperm and egg. If a different sperm had fertilised the egg, that would not be *you* in a different circumstance; that would be a *different person* entirely.

  For Kripke, this is not a gradient; it is a sharp, metaphysical line. It is not just that we couldn't *know* it was you; it is that it is logically impossible for it to be you. On this view, the statement "If I had been born poor, I wouldn't be me" is metaphysically true, though often ethically irrelevant.

  **B. The Gradient View (Lewis and Counterpart Theory)**
  Your intuition that there might be a "gradient" is championed by **David Lewis**. In his **Counterpart Theory**, Lewis argues that strict identity across worlds is incoherent. You exist only in this world.

  When we say, "I could have been a revolutionary," Lewis says we are not talking about *you* literally existing in another world. We are talking about a **counterpart** of you in another world who is sufficiently similar to you.

  This allows for the gradient you sensed. A counterpart born in the 18th century with your psychology is a very close counterpart (high similarity). A counterpart born of different parents is a more distant counterpart. A counterpart where the sperm is different is so distant that we stop calling them a counterpart of *you* at all. This theory validates the feeling that some counterfactuals preserve identity better than others, without requiring a sharp metaphysical switch.

  ### 2. The Sperm-and-Egg Criterion and Twins
  You asked if the sperm-and-egg criterion is the standard view. In contemporary analytic metaphysics, **Origin Essentialism is the dominant view**, but it faces the exact challenge you raised regarding identical twins.

  If identity is fixed by the zygote, and monozygotic twins come from the same zygote (which splits later), does Origin Essentialism imply they are the same person? Obviously not.

  Proponents of Origin Essentialism usually refine the criterion to handle this. They might argue that:
  1.  **Individuation happens at splitting:** While the genetic origin is the same, the *spatiotemporal path* of the cells diverges. The specific history of the physical matter becomes the essential origin, not just the genetic code.
  2.  **The "Thin" vs. "Thick" Zygote:** Some argue the essential origin is not just the biological material, but the specific potentiality of that specific cell at that specific time. When it splits, two new potentialities are created.

  So, while the sperm-and-egg rule is the standard heuristic, it is usually refined to "the specific initial physical constitution and its immediate developmental path."

  ### 3. The Argumentative Move: Privilege and the Non-Identity Problem
  You noted that in discussions of privilege, someone might say, "If I'd been born poor, I wouldn't be me," to deflect the claim that they are "lucky."

  **Is there a name for this?**
  Philosophically, this logic is derived from the **Non-Identity Problem**, formulated most famously by **Derek Parfit** in *Reasons and Persons* (1984). Parfit used it to show a problem in ethics: if a policy change means different people are conceived in the future, can we say the policy harms those future people? (Parfit argues: no, because without the policy, *they* wouldn't exist to be harmed).

  However, when used in a conversation about privilege, philosophers generally regard this move as a **Modal Fallacy** or a category error. Here is why:

  1.  **De Re vs. De Dicto:** The fallacy often lies in confusing *de re* modality (about the thing) with *de dicto* modality (about the description).
      *   *Claim:* "You are lucky to be rich."
      *   *Meaning:* The person sitting here (let's call him John) has the property of 'being rich', and it is fortunate for John that he has this property.
      *   *Deflection:* "If I were poor, I wouldn't exist."
      *   *Error:* This conflates **John** with **John's life history**. The moral claim is usually about the distribution of goods amongst existing people, not about the metaphysical necessity of John's conception.

  2.  **The "Thisness" (Haecceity) Confusion:** The defender is prioritising their **haecceity** (their unique "thisness" derived from their origin) over their **qualitative properties** (being wealthy, healthy, educated). The critic is talking about the qualitative properties. By insisting on the haecceity, the defender changes the subject.

  While there isn't a single catchy Latin name for this specific rhetorical deflection (like *ad hominem*), it is often described in political philosophy as an **Essentialist Deflection** or simply an misuse of the Non-Identity Problem. It is widely considered a "conversation stopper" that is metaphysically plausible (under Kripkean views) but morally inert. It fails to address the structural point about luck, which is usually about the *arbitrariness* of the distribution of resources, regardless of who specifically ends up holding them.

  ### 4. Summary of the Territory
  To summarise how the land is mapped:

  *   **The Field:** Metaphysics of Personal Identity / Modal Metaphysics.
  *   **The Sharp Line:** **Origin Essentialism** (associated with Kripke). Holds that your specific biological origin is necessary for your identity. If the sperm differs, you do not exist.
  *   **The Gradient:** **Counterpart Theory** (associated with Lewis). Holds that "you" in other worlds are just similar counterparts. This allows for degrees of "youness."
  *   **The Psychological View:** (Associated with Locke and Parfit). Focuses on memory and continuity. This is less popular for *counterfactual* origins (most agree you can't have your psychology without a brain to hold it), but it dominates discussions of survival over time.
  *   **The Privilege Move:** An invocation of **Origin Essentialism** to block claims about **Moral Luck**. It is generally viewed by ethicists as a **Modal Fallacy** because it conflates the identity of the person with the contingency of their circumstances.

  ### Conclusion
  You are correct that there is a distinction between "me in different clothes" and "someone else entirely." The standard philosophical view (Origin Essentialism) agrees with you that the line is drawn at conception (the specific gametes).

  However, the philosophical consensus on the *argument* about privilege is that while the metaphysics might be sound (you wouldn't technically be you), the ethical move is a deflection. It treats personal identity as a shield against moral luck, whereas most political philosophers argue that claims about privilege are about the fairness of the system, not the metaphysical necessity of the beneficiary.

  So, you have identified a genuine metaphysical distinction, but also spotted where it is often weaponised in a way that philosophers tend to frown upon.
