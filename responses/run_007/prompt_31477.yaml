  3.  **Establish the "Gold Standard" (The Theorem & Critiques):**
      *   **Theorem Statement:** Given a binary choice (A vs. B), where one is objectively "correct."
      *   **Assumptions:**
          1.  **Binary Choice:** Two options.
          2.  **Objective Truth:** One option is correct.
          3.  **Independence:** Voters vote independently (conditional on the state of the world).
          4.  **Competence:** Each voter has probability $p > 0.5$ of choosing the correct option. (Homogeneous competence is the standard simple version, though heterogeneous versions exist where average $p > 0.5$).
          5.  **Sincere Voting:** Voters vote for what they believe is correct (not strategic).
          6.  **Odd Number of Voters:** (To avoid ties, though this is a technicality).
      *   **Conclusion:** Probability of majority being correct ($P_N$) is greater than $p$, and $\lim_{N \to \infty} P_N = 1$.
      *   **Evaluation of Claim:** The claim is *contingent*. It holds *if* assumptions hold. In real elections, assumptions often fail, weakening the "strong" argument.
      *   **Key Failure Points:**
          1.  **Competence ($p > 0.5$):** If $p < 0.5$, the theorem reverses (larger groups are *worse*). If $p = 0.5$, group performance = individual performance. In complex politics, is $p > 0.5$ plausible?
          2.  **Independence:** Common shocks (media, campaigns) create correlation. Positive correlation reduces the "wisdom of crowds" effect. The convergence to 1 slows down or stops (limit might be $< 1$).
          3.  **Objective Truth:** Does a "correct" policy exist? (Epistemic democracy debate).
