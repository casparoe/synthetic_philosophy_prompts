prompt: |-
  I'm a novelist, not a philosopher, and I want you to meet me in the vocabulary I actually work in: the main narrative, the story inside the story, diegetic levels if that word earns its keep, the reader's standing assumption about which level is the ground floor, the reveal where the outer frame turns out to be a story someone is telling, and the recursive case where a story loops back and contains itself. Restate the dream-skepticism problem in that vocabulary, as faithfully as you can. Do both versions: the Cartesian one, where waking life is the baseline and the only worry is that I might be dreaming right now, and Zhuangzi's butterfly passage, where a man dreams he is a butterfly and wakes up unsure whether he is a man who dreamt he was a butterfly or a butterfly now dreaming he is a man. I never studied the philosophy side, so if a distinction matters, build it in the narrative terms or flag that it won't go. Keep the translation honest — dont smuggle in assumptions from the novelist side and call it a translation. Then give me the residue report: what translated cleanly, what you had to bend, and what has no counterpart in my vocabulary at all. And then the part I actually care about: is the leftover something my nested-stories framework is missing, or is it something the philosophers get for free by using waking and dreaming as if the levels where already labeled from the outside?
