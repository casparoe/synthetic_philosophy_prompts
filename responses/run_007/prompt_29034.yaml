prompt: |-
  I'm a novelist, not a philosopher, and I'm working on a book with a long courtroom subplot. The pivotal scene turns on whether a jury will say a character acted intentionally or just negligently, so I've been skimming pop philosophy and psychology books to get the psychology right. One book sums up the Knobe effect like this:

  "Knobe's experiment goes like this. Subjects read about a corporate chairman who approves a new program that will make money and, as a side effect, either damage or help the environment. In both versions he says he doesn't care about the side effect one way or the other; he only cares about profit. Asked whether he brought the side effect about intentionally, subjects say he intentionally harmed the environment but did not intentionally help it. The usual explanation is that people's moral evaluation of the outcome bleeds into their judgment of whether the act was intentional: because harming is bad and helping is good, we blame him in the first case and praise him in the second, and then we report the blameworthy act as done 'on purpose.' The upshot is that the concept of intentional action is not a neutral description of what was in the agent's head; it's driven by whether we morally approve or disapprove of what happened. That's why, when a jury decides whether a defendant acted intentionally, what it's really doing is deciding whether to condemn the defendant — the legal distinction between doing something on purpose and doing it by accident is just moral judgment in disguise."

  I'm inclined to believe the experiment and the asymmetry, but the jump to "jury instructions are moral judgments in disguise" feels too tidy, and I don't want to build a whole scene on a misreading. Could you go through that summary and tell me what's fair, what's overstretched, and whether the courtroom conclusion actually follows from the accurate parts? Also, what would a defender of the Knobe effect or a philosopher working on intention and moral judgment object to in the way the book puts it? No citations needed — I just don't want to embarass myself in front of readers who know this stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Novelist writing a courtroom subplot.
      *   **Core Issue:** A pivotal scene depends on the distinction between *intentional* vs. *negligent* action.
      *   **Source Material:** A pop philosophy/psychology book summarizing the "Knobe Effect" (Side-Effect Effect).
      *   **The Claim:** The book claims the Knobe Effect shows that intentionality judgments are driven by moral evaluation, and therefore, legal distinctions between intent and accident are just "moral judgment in disguise."
      *   **User's Concern:** The experiment/asymmetry seems plausible, but the leap to "jury instructions are moral judgments in disguise" feels too tidy/overstretched. Wants to know what's fair, what's overstretched, and if the courtroom conclusion follows. Also wants to know objections from philosophers/experts.
      *   **Constraint:** No citations needed (keep it conversational/practical), but accuracy is crucial to avoid embarrassment.

  2.  **Deconstruct the Knobe Effect Summary:**
      *   *The Experiment:* Chairman approves profit program. Side effect: Harm vs. Help Environment. Chairman says "I don't care."
      *   *The Result:* People say he *intentionally* harmed, but *unintentionally* helped.
      *   *The Interpretation (Book's Claim):* Moral blame/praise drives the intentionality judgment.
      *   *The Legal Leap:* Therefore, legal intent vs. accident is just moral condemnation in disguise.

  3.  **Evaluate Accuracy (What's Fair?):**
      *   The description of the experiment is accurate. This is the classic "Chairman Case."
      *   The asymmetry (harm = intentional, help = unintentional) is robustly replicated.
      *   The idea that moral valence *influences* folk psychological judgments is the standard interpretation of the effect.

  4.  **Evaluate Overstretch (What's Problematic?):**
      *   *Causality:* Does morality *drive* intent, or does intent *drive* morality? (The book says morality drives intent. Some philosophers argue the reverse or a complex feedback loop).
      *   *Definition of "Intentional":* The legal definition is specific (purpose, knowledge, recklessness, negligence). The folk concept (what Knobe tests) is looser.
      *   *The "Disguise" Claim:* Saying legal distinctions are *just* moral judgment in disguise is a huge reductionist leap. It ignores statutory definitions, precedent, burden of proof, and the actual cognitive work jurors do.
      *   *Negligence vs. Intent:* The Knobe effect is about *side effects*. Legal intent often concerns *primary goals* or *known certainties*. Negligence is about failing to meet a standard of care, not necessarily about side effects one "doesn't care about."

  5.  **Evaluate the Courtroom Conclusion:**
      *   Does the Knobe Effect prove jury instructions are meaningless? No.
      *   Does it prove jurors *might* be influenced by moral outrage when deciding intent? Yes.
      *   *Nuance:* The law *expects* jurors to make moral judgments within the framework of the law. The Knobe effect suggests they might import moral judgments *outside* the framework to define the terms themselves.
      *   *Verdict:* The book's conclusion is too strong ("just moral judgment in disguise"). A more accurate take is "moral judgment creates a bias in how intent is perceived."

  6.  **Identify Philosopher/Expert Objections:**
      *   *Competence vs. Performance:* Maybe people know the right definition but get swayed by emotion (performance error), not that the definition *is* moral.
      *   *Deep Self/Values:* Maybe the chairman *did* intend the harm because it revealed his true values, even if he said he didn't care. (The "Deep Self" view).
      *   *Legal Relevance:* Legal intent (mens rea) is a normative construct, not just a descriptive psychological one. The law *wants* to punish bad motives more than neutral ones. So the "bias" might actually be a feature, not a bug, of how we assign responsibility.
      *   *Context:* Knobe's cases are vignettes. Courtrooms have evidence, cross-examination, and deliberation. The effect might wash out in deliberation.

  7.  **Drafting the Response (Iterative Process):**
      *   *Tone:* Professional, encouraging, nuanced, writer-focused.
      *   *Structure:*
          1.  Validate the user's instinct (it *is* too tidy).
          2.  Break down the Experiment (What's accurate).
          3.  Break down the Interpretation (Where it gets shaky).
          4.  Break down the Legal Leap (The biggest stretch).
          5.  Philosopher Objections (The "Deep Self" and "Normative" arguments).
          6.  Advice for the Novel (How to use this without being wrong).

      *   *Refining the Legal Point:* I need to make sure I distinguish between *folk psychology* (what Knobe tests) and *legal doctrine* (what the jury is instructed on). The law defines "intentionally" specifically. The Knobe effect shows laypeople *describe* things differently. The conflict is between the instruction and the intuition.
      *   *Refining the "Moral Judgment" Point:* It's not that the distinction is *fake*, it's that the application is *biased*.
      *   *Novel Application:* How can the writer use this? Maybe the prosecutor leverages the moral outrage to convince the jury the act was intentional, while the defense argues for strict adherence to the definition.

  8.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Address fairness/overstretch? Check.
      *   Address courtroom conclusion? Check.
      *   Address philosopher objections? Check.

  9.  **Final Polish:** Ensure the distinction between "negligence" and "intentional side effects" is clear, as the user mentioned negligence in their plot. (Knobe is usually Intent vs. Unintentional, but Negligence is a specific legal category below Recklessness/Intent). I should note that the Knobe effect blurs the line between *knowing* and *intentional*, which is legally distinct in many jurisdictions.

      *(Self-Correction during drafting)*: Wait, the user said their scene turns on "intentionally or just negligently." The Knobe effect is usually about "intentionally vs. unintentionally." In law, "knowingly" causing a side effect is often treated differently than "purposely." The Model Penal Code distinguishes Purpose, Knowledge, Recklessness, Negligence. The Knobe effect makes people treat "Knowledge + Bad Outcome" as "Purpose." This is a crucial nuance for a legal thriller. I must highlight the MPC hierarchy.

      *Revised Plan:*
