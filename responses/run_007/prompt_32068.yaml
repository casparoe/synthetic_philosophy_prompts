prompt: |-
  A colleague in my department has taken to arguing that the whole problem of truth is an artifact of grammar. His preferred analogy is pronominal: the expression "that is true," he says, stands to a sentence roughly as a pronoun stands to a noun phrase. Just as "she" lets a speaker avoid repeating a name while still talking about the same person, "that is true" lets a speaker affirm or deny an entire class of sentences without enumerating them — as in "whatever the witness said is true." From this he concludes that truth is not a genuine property, that there is no correspondence relation between true sentences and the world, and that the substantive theories of truth are trying to analyze something the word "true" was never in the business of naming.

  I want you to audit this analogy rather than simply take sides. First, lay out the intended correspondence explicitly: what in the pronominal source is supposed to map onto what in the truth-predicate target, and which features of pronouns are carrying the argument. Second, identify the disanalogies. In particular, consider whether "that is true" really inherits its content from an antecedent sentence in the way a pronoun inherits its referent from an antecedent noun phrase; whether the analogy handles uses of "true" where there is no recoverable antecedent sentence, or where the antecedent is unknown, foreign, or embedded in an opaque context; and whether pronouns and "true" behave alike under negation, quantification, and propositional-attitude reports. Third, distinguish the disanalogies that matter for the deflationary conclusion from those that are merely incidental, and say which features of the pronominal source the analogy quietly imports that the target lacks. Finally, tell me whether the conclusion — that there is no property of truth and no work for a substantive theory of truth to do — survives the audit, and what a better analogy for the deflationist's point would be, if any.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit a colleague's analogy regarding truth and grammar (specifically, the pro-sentential theory of truth).
      *   **Colleague's Claim:** "That is true" functions like a pronoun standing to a sentence as a pronoun stands to a noun phrase. Therefore, truth is not a genuine property, no correspondence relation exists, and substantive theories are misguided.
      *   **Requirements:**
          1.  Lay out the intended correspondence explicitly (source vs. target).
          2.  Identify disanalogies (content inheritance, missing antecedents, opaque contexts, logical behavior).
          3.  Distinguish significant disanalogies from incidental ones; identify imported features.
          4.  Evaluate whether the deflationary conclusion survives the audit.
          5.  Suggest a better analogy if applicable.
      *   **Tone:** Analytical, philosophical, balanced (audit rather than take sides initially), rigorous.

  2.  **Deconstruct the Colleague's Argument (The Pro-Sentential Theory):**
      *   This is a known position in philosophy of language, often associated with Dorothy Grover, Joseph Camp, and Nuel Belnap (the "Prosentential Theory of Truth").
      *   *Core Idea:* "True" isn't a predicate describing a property; it's a grammatical device for anaphora (reference back).
      *   *Analogy:* Pronouns (he/she/it) $\rightarrow$ Noun Phrases :: Pro-sentences ("That is true") $\rightarrow$ Sentences.

  3.  **Step 1: Lay out the intended correspondence.**
      *   *Source Domain:* Pronominal reference (e.g., "Alice left. She ran.").
      *   *Target Domain:* Truth predicates (e.g., "Snow is white. That is true.").
      *   *Mapping:*
          *   Noun Phrase (NP) "Alice" $\mapsto$ Sentence (S) "Snow is white".
          *   Pronoun "She" $\mapsto$ Pro-sentence "That is true" (or just "True").
          *   Function: Avoid repetition, enable generalization (quantification).
          *   Feature carrying the argument: Anaphora (dependence on antecedent), lack of independent descriptive content.

  4.  **Step 2: Identify Disanalogies.**
      *   *Content Inheritance:* Pronouns inherit *reference* (object). "True" inherits *content* (proposition/sentence). Is "That is true" a sentence itself? Yes. But does it function *exactly* like "She"?
      *   *Missing Antecedents:*
          *   Pronoun: "She is late." (Who? Context needed).
          *   Truth: "Everything he said is true." (Blind truth ascriptions). What if we don't know what he said? The pronoun analogy struggles with *blind* ascriptions where the antecedent is unavailable.
          *   Foreign/Opaque: "What the Pope said is true." (I don't speak Latin/Italian). Can I use a pronoun for someone I can't identify? Not really. But I can say their statement is true.
      *   *Logical Behavior:*
          *   Negation: "She didn't run" vs. "That is not true."
          *   Quantification: "Everyone loves her" vs. "Everything he said is true." (This is actually where the analogy is strongest, which is why deflationists like it).
          *   Propositional Attitudes: "John believes that she is nice" vs. "John believes that it is true that snow is white." The embedding is clunky. "True" allows disquotation ("It is true that p" $\equiv$ "p"). Pronouns don't allow disquotation in the same way ("She" $\neq$ "Alice" in all contexts, specifically intensional ones).
      *   *Grammar:* "True" is an adjective. "She" is a pronoun. The colleague says "That is true" acts as a pro-sentence. But "True" can modify nouns ("a true friend"). Pronouns can't do that.

  5.  **Step 3: Distinguish Significant vs. Incidental Disanalogies.**
      *   *Incidental:* Grammatical category (adjective vs. pronoun). This is surface structure.
      *   *Significant:*
          *   *Disquotation:* "It is true that p" entails "p". "She is F" does not entail "Alice is F" if the reference fails or is ambiguous. Truth has a normative/logical link to the antecedent that pronouns lack.
          *   *Blind Ascriptions:* This is the killer for the strict pronoun analogy. I can affirm the truth of a conjecture ("Fermat's Last Theorem was true before it was proved") without knowing the content fully or having a specific linguistic antecedent token. Pronouns require a specific antecedent token or contextually salient referent.
          *   *Property vs. Device:* Even if it functions anaphorically, does that prove it lacks a property? "Water soluble" functions dispositionally, but is still a property. The move from "grammatical function" to "no property" is the leap to audit.
      *   *Imported Features:* The analogy imports the idea of *linguistic convenience* (avoiding repetition). It suggests "true" adds nothing but syntactic utility. It ignores the normative role of truth (aim of belief, correctness condition).

  6.  **Step 4: Evaluate the Conclusion.**
      *   Does the analogy support Deflationism? Yes, it supports the *redundancy* or *pro-sentential* version of deflationism.
      *   Does it prove *no property*? Not necessarily. It proves the *concept* might be logical/grammatical, but a property could still supervene. However, for the deflationist, if the word's function is exhausted by the anaphora, positing a "property" is metaphysical excess.
      *   Does it kill Correspondence? It makes correspondence look like a category mistake (trying to match a pro-sentence to the world).
      *   *Verdict:* The analogy is powerful for explaining *generalization* (quantifying into sentence position), but weak on *blind ascriptions* and *normativity*. The conclusion survives *if* one accepts that exhaustive grammatical function eliminates metaphysical property status (a contentious premise).

  7.  **Step 5: Better Analogy?**
      *   If "pronoun" is too weak, what captures the logical force?
      *   *Logical Operator:* Like negation or conjunction? No, "true" isn't truth-functional in that way.
      *   *Disquotation Device:* Tarski's T-scheme.
      *   *Endorsement/Agreement:* "Ditto" or "Me too." This captures the performative aspect better than the descriptive aspect of pronouns.
      *   *Anaphoric Deflationism:* Stick with anaphora but refine it (Brandom's anaphoric chains).

  8.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the position (Pro-sentential Theory).
      *   *Section 1 (Correspondence):* Map NP to Sentence, Pronoun to "is true". Highlight the "avoiding repetition" and "generalization" functions.
      *   *Section 2 (Disanalogies):*
          *   *Blind Ascriptions:* "What he said is true" works even if I don't know what he said. "She is tall" fails if I don't know who "she" is.
          *   *Intensional Contexts:* "True" allows disquotation (transparent). Pronouns are often opaque.
          *   *Adjectival uses:* "True friend," "True north." Pronouns don't modify nouns.
      *   *Section 3 (Significance):* The "Blind Ascription" point is the most damaging to the strict pronoun analogy. The move from "grammatical device" to "no property" is the philosophical leap, not the linguistic one. The analogy imports "mere convenience" and ignores "normativity."
      *   *Section 4 (Conclusion & Alternative):* The deflationary conclusion *mostly* survives regarding correspondence, but the "no property" claim is stronger than the analogy supports. A better analogy might be "logical punctuation" or "endorsement marker" (like a stamp of approval) rather than a pronoun. Or, refine the pronoun analogy to "pro-form" in a logical system rather than natural language pronoun.

      *(Self-Correction during drafting)*: I need to be careful not to just argue against deflationism. The prompt asks to audit the *analogy*. I must focus on whether the *pronoun comparison* holds water, not just whether deflationism is true. The colleague's argument is: Analogy $\rightarrow$ No Property. I need to check the strength of that arrow.

      *Refining the "Blind Ascription" point:* This is the standard objection to pro-sententialism. If I say "Everything the Pope said is true," and I don't speak Latin, I cannot form the pro-sentence equivalents for each sentence. Yet my assertion is meaningful. A pronoun requires a salient antecedent. Truth does not.

      *Refining the "Property" leap:* Even if "true" is a pro-sentence, does that mean there is no property? "Soluble" describes a disposition. "True" could describe a normative status. The analogy shows *function*, not *ontology*.

      *Better Analogy:* The "Ditto" mark. Or the logical symbol of assertion.

  9.  **Final Polish:** Ensure clear headings, precise philosophical terminology (anaphora, disquotation, blind ascription, propositional attitudes), and a neutral but critical tone. (Check against the prompt requirements one last time).

      *Requirement Check:*
      1. Lay out correspondence? Yes.
      2. Identify disanalogies (antecedent, unknown, opaque, logic)? Yes.
      3. Distinguish significant/incidental, imported features? Yes.
      4. Conclusion survival & better analogy? Yes.

      *Let's write.*
answer: |-
  Your colleague is articulating a version of the **pro-sentential theory of truth**, a sophisticated form of deflationism most notably developed by Dorothy Grover, Joseph Camp, and Nuel Belnap. The core intuition is that "is true" is not a predicate describing a metaphysical property but a grammatical device enabling anaphoric reference to sentences.

  Here is an audit of that analogy, structured according to your requirements.

  ### 1. The Intended Correspondence

  To evaluate the argument, we must first formalize the mapping your colleague proposes between the source domain (pronominal reference) and the target domain (truth ascription).

  | Source Domain (Pronouns) | Target Domain (Truth Predicate) |
  | :--- | :--- |
  | **Noun Phrase (NP)** <br>*(e.g., "Alice")* | **Sentence (S)** <br>*(e.g., "Snow is white")* |
  | **Pronoun** <br>*(e.g., "She")* | **Pro-sentence** <br>*(e.g., "That is true" / "It is true")* |
  | **Function 1: Economy** <br>*(Avoids repeating "Alice")* | **Function 1: Economy** <br>*(Avoids repeating "Snow is white")* |
  | **Function 2: Generalization** <br>*(e.g., "Everyone loves **her**")* | **Function 2: Generalization** <br>*(e.g., "Everything he said **is true**")* |
  | **Semantic Status** <br>*(Derives content from antecedent)* | **Semantic Status** <br>*(Derives content from antecedent sentence)* |

  **The Argumentative Load:**
  The analogy carries the argument on two specific features of pronouns:
  1.  **Anaphoric Dependence:** A pronoun has no independent reference; it borrows its referent from an antecedent. Similarly, "is true" has no independent meaning; it borrows its content from an antecedent sentence.
  2.  **Logical Utility without Ontology:** We do not posit a "property of she-ness" to explain how "she" works. Therefore, we should not posit a "property of truth" to explain how "true" works.

  ### 2. Disanalogies

  While the mapping is elegant, it fractures under specific linguistic and logical pressures.

  **A. Content Inheritance and Antecedents**
  *   **Pronoun:** Requires a contextually salient antecedent or a demonstrative act. If I say "She is running" without prior context or a pointing gesture, the statement is semantically incomplete.
  *   **Truth:** "That is true" often functions where no specific linguistic antecedent is available.
      *   *Case:* "The Riemann Hypothesis is true."
      *   *Problem:* There is no specific token sentence being repeated. The antecedent is a mathematical proposition, potentially expressible in infinite variations. The pronoun analogy suggests a linguistic token-to-token relationship that truth ascriptions often bypass.

  **B. Blind Ascriptions (Unknown or Foreign Antecedents)**
  This is the most significant disanalogy.
  *   **Pronoun:** I cannot use "she" to refer to a woman if I cannot identify her or if she is not contextually available.
  *   **Truth:** I can meaningfully say, "Everything the Pope said in his encyclical is true," even if I do not speak Latin/Italian and have not read the encyclical.
      *   *The Mismatch:* In the pronoun case, the speaker must grasp the referent to use the pronoun. In the truth case, the speaker can endorse the *relationship* of the sentences to the world without grasping the specific content of the sentences. The pro-sentential analysis struggles to explain how I can use a "pro-sentence" for a sentence I cannot formulate.

  **C. Opaque Contexts and Propositional Attitudes**
  *   **Pronoun:** Pronouns behave notoriously badly in intensional contexts. "Lois Lane wants to marry Superman" does not entail "Lois Lane wants to marry him" (if 'him' refers to Clark Kent), due to opacity.
  *   **Truth:** "True" is typically transparent (disquotational). "It is true that snow is white" is logically equivalent to "Snow is white."
      *   *The Mismatch:* If "That is true" were truly analogous to "She," we would expect substitution failures in belief contexts similar to pronouns. Instead, "true" acts more like a logical operator that cancels opacity, whereas pronouns preserve it.

  **D. Grammatical Flexibility**
  *   **Pronoun:** Pronouns substitute for NPs. They cannot modify nouns.
  *   **Truth:** "True" is an adjective. It appears in "true friend," "true north," or "a true statement." The pro-sententialist must argue these are secondary or metaphorical uses, but their prevalence suggests "true" has a descriptive role that pronouns lack.

  ### 3. Significant vs. Incidental Disanalogies

  **Incidental Disanalogies**
  *   **Part of Speech:** That "true" is an adjective and "she" is a pronoun is surface grammar. The pro-sententialist argues "is true" functions as a sentence-substitute, so the adjectival morphology is incidental.
  *   **Number/Gender:** Pronouns encode gender/number; "true" does not. This is irrelevant to the logical function.

  **Significant Disanalogies**
  *   **The "Blind Ascription" Problem:** This matters for the deflationary conclusion. If "true" allows us to endorse content we cannot articulate, it is doing more work than a simple anaphoric device. It is acting as a **quantifier into propositional content**. A pronoun quantifies over objects; "true" quantifies over *contents*. This suggests "true" is a logical device, but perhaps a more complex one than a mere pronoun.
  *   **Normativity:** Pronouns are descriptive tools. Truth is normative. To call a belief "true" is to say it is *correct*. To call a statement "true" is to license its assertion. Pronouns do not carry licensing conditions. The analogy imports **linguistic convenience** but ignores **normative force**.
  *   **The Ontological Leap:** The analogy shows that "true" has a logical function. It does not prove there is *no property*. "Water soluble" has a functional definition (dissolves in water), but we still accept solubility as a real dispositional property. The colleague's move from "grammatical device" to "no property" is a philosophical inference, not a linguistic fact imported by the analogy.

  **Imported Features**
  The analogy quietly imports the idea that the word "true" is **ontologically inert** because pronouns are ontologically inert. But pronouns are inert only because they refer to objects that are already posited. If sentences correspond to facts, a device that refers to sentences might indirectly track facts. The analogy assumes the conclusion (no correspondence) by choosing a source (pronouns) that lacks a correspondence relation to the world.

  ### 4. Audit Verdict and Better Analogies

  **Does the Conclusion Survive?**
  *   **Against Correspondence:** **Yes, largely.** The analogy successfully undermines naive correspondence theories that treat "truth" as a relational property like "being to the left of." If "true" is a logical device for generalization, looking for a "truth relation" is a category mistake.
  *   **No Property/No Work for Theory:** **No.** The audit reveals that the pronoun analogy is too weak to sustain the full deflationary conclusion. Because "true" handles blind ascriptions and normative endorsement in ways pronouns do not, there is still "work" for a theory of truth to do: explaining the norms of assertion and the logic of propositional quantification. The conclusion that there is *no* property is stronger than the premise (the analogy) can support. A functional role is compatible with a dispositional property.

  **A Better Analogy**
  If the goal is to defend deflationism without incurring the liabilities of the pronoun analogy, a more robust analogy is **Logical Punctuation** or **Endorsement**.

  1.  **The "Ditto" Mark:** Like the pronoun, "ditto" avoids repetition. But unlike a pronoun, "ditto" implies *sameness of value* or *validity*, not just reference. This captures the normative aspect better.
  2.  **The Assertion Stroke (Frege):** In logic, the turnstile or assertion sign indicates that a proposition is being put forward as correct. "Is true" functions less like a pronoun referring to a sentence and more like a stamp of approval applied to a content.
  3.  **Quantificational Variable:** Instead of a pronoun, treat "true" as part of a substitutional quantifier. "Something he said is true" $\approx$ $\exists p$ (He said that $p$ & $p$).

  **Recommendation:**
  Tell your colleague that the pronoun analogy is the "training wheels" of deflationism. It is excellent for demonstrating how we quantify into sentence positions without nominalizing propositions (avoiding "propositions" as objects). However, it fails to account for blind ascriptions and the normative license truth confers. A better defense of his conclusion would rely not on the *pronoun* analogy, but on the **disquotational** nature of truth: the insight that " 'p' is true" adds nothing to "p" but the ability to generalize. This preserves the deflationary conclusion without relying on a linguistic comparison that breaks down under pressure.
