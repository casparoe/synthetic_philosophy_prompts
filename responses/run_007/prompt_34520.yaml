          *   *Test:* Unconscious processing in humans (blindsight, automatic driving).
          *   *Prediction:* Searle says human biology underlies it even if unconscious. Opponent says functional output matters more than felt experience.
      *   *Crux 3 (Biology):* Is carbon chauvinism justified?
          *   *Test:* Gradual replacement of neurons with chips (Ship of Theseus).
          *   *Prediction:* Searle says mind fades when biology leaves. Opponent says mind persists as long as function persists.

  6.  **Refining the Tone:**
