          *   *Robot Reply:* Embed the program in a robot interacting with the world (causal connection).
          *   *Brain Simulator Reply:* Simulate the actual neuron firings of a Chinese speaker.
          *   *Other Minds/Intuition Pump:* Searle is just relying on the intuition that *he* wouldn't understand, which might be unreliable.

