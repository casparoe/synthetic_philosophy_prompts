  **The Case:** Imagine a policy that lowers the welfare of the best-off group. It does **not** help the worse-off group (not even indirectly). It does **not** increase the total welfare. The *only* change is that the gap between rich and poor is smaller.

  **Instructions:** Follow the questions below. Answer based on your intuition about the case, not on which theory you think you "should" be.

  ---

  ### The Decision Tree

  **1. In this specific case, is there *anything at all* good about the outcome, even if you think the overall result is worse?**
  *(Is the increased equality valuable in at least one respect, pro tanto?)*
  *   **YES** → Go to **2A**
  *   **NO** → Go to **2B**

  **2A. Is this value located in the *pattern of distribution* itself?**
  *(Is it the mathematical shape of the outcome that is good, rather than how people treat each other?)*
  *   **YES** → Go to **3** (Telic Path)
  *   **NO** → *Stop.* (You hold a rare view: Equality is good, but not because of patterns or relations. This cell is typically considered **incoherent** or **underexplored**.)

  **3. Is equality the *only* thing that matters, outweighing the loss in welfare?**
  *(Is the leveled-down world better all-things-considered, or just better in one way but worse overall?)*
  *   **YES** → **Leaf A: Monist Telic Egalitarianism**
  *   **NO** → **Leaf B: Pluralist Telic Egalitarianism**

  **2B. Is the core moral concern about *social relations* or *fairness*?**
  *(Do you oppose inequality because it creates oppression/status hierarchies, rather than because of welfare numbers?)*
  *   **YES** → **Leaf C: Deontic (Relational) Egalitarianism**
  *   **NO** → Go to **4** (Welfarist Path)

  **4. Do benefits to the worse-off matter *more* than equal benefits to the better-off?**
  *(Even if inequality itself isn't bad, should we prioritize helping those who have less?)*
  *   **YES** → **Leaf D: Prioritarianism**
  *   **NO** → Go to **5**

  **5. Is there a threshold of "enough" below which losses matter lexically?**
  *(Does welfare only matter morally until people have sufficient resources, or does it matter at all levels?)*
  *   **YES** → **Leaf E: Sufficientarianism**
  *   **NO** → **Leaf F: Utilitarianism**

  ---

  ### The Leaves: Your Position & Its Cost

  **Leaf A: Monist Telic Egalitarianism**
  *   **Your View:** Equality is the only intrinsic value; the leveled-down world is better all-things-considered.
  *   **The Awkward Commitment:** You must endorse destroying goods for the rich even if it makes everyone objectively worse off and helps no one.

  **Leaf B: Pluralist Telic Egalitarianism**
  *   **Your View:** Equality is intrinsically good, but welfare also matters; leveling down is good in one respect but bad overall.
  *   **The Awkward Commitment:** You must admit there is *some* moral gain in making the rich poorer even when it helps no one, which many find unintuitive.

  **Leaf C: Deontic (Relational) Egalitarianism**
  *   **Your View:** Equality is a requirement of fair social relations, not a valuable outcome pattern.
  *   **The Awkward Commitment:** You cannot call the leveled-down outcome "better," even though you oppose inequality, which can make explaining your objection to pure welfare losses difficult.
  *   *Note: On the Leveling Down case specifically, you answer identically to the Prioritarian (Leaf D).*

  **Leaf D: Prioritarianism**
  *   **Your View:** Inequality isn't bad in itself, but benefits to the worse-off have greater moral weight.
  *   **The Awkward Commitment:** You must prefer a world where the worse-off gain a tiny amount over a world where the better-off gain a massive amount, regardless of the resulting inequality.
  *   *Note: On the Leveling Down case specifically, you answer identically to the Deontic Egalitarian (Leaf C).*

  **Leaf E: Sufficientarianism**
  *   **Your View:** Morality requires everyone have "enough"; above that threshold, inequality and priority don't matter.
  *   **The Awkward Commitment:** You must be indifferent to massive inequalities between the super-rich once everyone has crossed the threshold of sufficiency.

  **Leaf F: Utilitarianism**
  *   **Your View:** Only the sum (or average) of welfare matters; distribution has no independent value.
  *   **The Awkward Commitment:** You must accept a world with extreme slavery or deprivation if the total welfare sum is slightly higher than in an equal world.

  ---

  ### Map Notes: Empty Cells & Overlaps

  **1. The "Incoherent" Cell**
  *   *Position:* Claims inequality is **intrinsically bad** (implies removing it is good) but denies leveling down is **even pro tanto good**.
  *   *Status:* **Incoherent.** If inequality is intrinsically bad, removing it (even by leveling down) must be good in at least one respect. You cannot hold both.

  **2. The "Hybrid" Cell**
  *   *Position:* Accepts **Priority** for the worse-off (Leaf D) AND thinks **Inequality itself is bad** (Leaf B).
  *   *Status:* **Underexplored.** This is a consistent hybrid view (e.g., Parfit's later work), but it complicates the tree by requiring two separate reasons to oppose inequality.

  **3. The Indistinguishable Pair**
  *   *Position:* **Deontic Egalitarianism (Leaf C)** vs. **Prioritarianism (Leaf D).**
  *   *Status:* **Convergent on LDO.** Both answer "No" to Question 1. The tree separates them by *grounds* (Relations vs. Welfare Weight), but in the specific Leveling Down case, they yield the exact same verdict: the policy is not good. They only come apart in cases where leveling down *would* improve social relations.
