answer: |-
  This is a fascinating ethical puzzle because your friend has already intuitively rejected the two most common but flawed heuristics: **Species Essentialism** (humans are special because they are human) and **Biological Determinism** (bigger brain = more status). Her "Alien Constraint" (walnut brain + human capacities = full status) is the key that unlocks her entire framework. It establishes that her system is a form of **Capacity-Based Functionalism**. Moral status is derived from *what a being can do and experience*, not *what it is made of* or *how much it weighs*.

  Here is a mapping of the candidate principles, an analysis of how they fit her fixed points, and what they imply for the sperm whale.

  ### 1. The Candidate Principles

  We can evaluate four main metrics against her fixed points.

  #### A. Absolute Brain Mass
  *   **The Rule:** More brain tissue = higher status.
  *   **Fit with Fixed Points:** **Fails.**
      *   *The Alien Constraint:* Explicitly rejects this (walnut brain can have full status).
      *   *Octopuses/Ravens:* Have tiny brains but moderate status.
      *   *Sperm Whale:* Has the largest brain in history. If this rule held, sperm whales would have higher status than humans.
  *   **Verdict:** Discard.

  #### B. Encephalization Quotient (EQ)
  *   **The Rule:** Brain size relative to body size (a proxy for "spare" cognitive processing power).
  *   **Fit with Fixed Points:** **Poor.**
      *   *Humans/Apes/Dolphins:* High EQ, fits "Full/Very High."
      *   *Elephants:* Modest EQ, fits "High."
      *   *Ravens:* Bird EQ calculations are notoriously difficult and often low compared to mammals, yet they have moderate status.
      *   *Octopuses:* Invertebrates don't have a standard EQ; their nervous system is distributed.
      *   *The Alien Constraint:* A walnut brain in a small body might have a high EQ, but the constraint says status comes from the *capacities* (conversation), not the ratio.
  *   **Verdict:** Weak. It correlates well with the mammals on her list but fails on the outliers (Ravens/Octopuses) and is theoretically undermined by the Alien Constraint.

  #### C. Neural Substrate Complexity (Neuron Count/Density)
  *   **The Rule:** Status tracks with the number of neurons in the forebrain/pallium (the seat of integration), regardless of brain size.
  *   **Fit with Fixed Points:** **Strong.**
      *   *Humans:* Highest cortical neuron count.
      *   *Ravens:* Parrots and corvids have incredibly dense pallial neurons, explaining their moderate status despite small brains.
      *   *Octopuses:* High total neuron count (500 million+), mostly in arms, explaining their unique moderate status despite being invertebrates.
      *   *Insects:* Low neuron counts, fits "No Status."
      *   *The Alien Constraint:* Compatible. If the walnut brain has human-level neuron density or efficiency, it passes.
  *   **Verdict:** A strong contender for a *proxy* measure.

  #### D. Cognitive & Socio-Cultural Capacity (Functionalism)
  *   **The Rule:** Status tracks with demonstrated capacities: self-awareness, future planning, complex communication, cultural transmission, and moral reasoning.
  *   **Fit with Fixed Points:** **Best Fit.**
      *   *Humans:* Max capacity.
      *   *Apes/Dolphins:* High capacity (mirror test, language analogues).
      *   *Elephants:* High capacity (grief, cooperation).
      *   *Dogs/Pigs/Ravens/Octopuses:* Moderate capacity (problem solving, but limited abstract reasoning).
      *   *The Alien Constraint:* This is literally the definition of this rule.
  *   **Verdict:** This is the governing principle. The other metrics (neurons, EQ) are merely evidence used to estimate this capacity when direct testing is impossible.

  ---

  ### 2. Stress-Testing the Fixed Points

  To find the rule she is *actually* running, we have to see which fixed points are doing the heavy lifting.

  *   **The "Octopus/Raven" Constraint:** These are the most important data points. They prove she is not a "mammal chauvinist." Any rule that requires a neocortex (mammalian brain structure) is invalid because octopuses don't have one, and birds have a different structure (nidopallium). This forces her rule to be **functional**, not anatomical.
  *   **The "Alien" Constraint:** This proves she values **output over hardware**. A being that *acts* like a moral agent *is* a moral agent, even if the hardware is inefficient or tiny.
  *   **The "Insect" Constraint:** This proves that **complex behavior alone isn't enough**. Honeybees have complex social structures and "dance language," but she assigns them no status. This implies the capacity must be *individual* and *flexible*, not just instinctual or colony-level.

  **Conclusion on the Rule:** She is running a **Capacity-Based Functionalism** weighted by **Individual Cognitive Flexibility**.

  ---

  ### 3. The Sperm Whale Verdicts

  Now we apply the surviving principles to the sperm whale.

  #### Scenario 1: The "EQ Hardliner" Rule
  *   **Logic:** If she secretly weights EQ heavily (despite the Alien constraint), the sperm whale drops. Their EQ is ~1.5 (similar to a walrus). Bottlenose dolphins are ~4.0.
  *   **Verdict:** **Moderate Status** (aligned with dogs/pigs).
  *   **Consistency Cost:** High. She would have to explain why Bottlenose Dolphins are "Very High" but Sperm Whales are "Moderate," despite Sperm Whales having larger absolute brains, longer lifespans, and more complex cultural dialects. It risks violating the "Alien Constraint" by prioritizing hardware efficiency (EQ) over actual capacity (culture).

  #### Scenario 2: The "Neural Hardware" Rule
  *   **Logic:** Sperm whales have the largest absolute number of neurons of any animal. Even if density is lower, the total processing power is immense.
  *   **Verdict:** **Very High to Full Status.**
  *   **Consistency Cost:** Moderate. She would need to explain why massive processing power devoted to echolocation doesn't count as "cognitive." However, recent science suggests their acoustic processing is integrative, not just sensory.

  #### Scenario 3: The "Cognitive/Cultural Capacity" Rule (Most Consistent)
  *   **Logic:** This follows the Alien Constraint. What can the whale *do*?
      *   *Evidence for:* Complex matrilineal societies, distinct cultural "codas" (dialects) passed down generations, cooperative hunting, large social brains.
      *   *Evidence against:* Failed mirror self-recognition (though this test is biased toward visual animals), hard to test means-end reasoning underwater.
      *   *Phylogeny:* They are Odontocetes (toothed whales), closely related to Bottlenose Dolphins ("Very High").
  *   **Verdict:** **Very High Status.**
  *   **Reasoning:** If Bottlenose Dolphins get "Very High" for individual cognition, Sperm Whales should get "Very High" for *collective* cognition and culture. The Alien Constraint says if a being can "compose music" (codas are musical) and "hold a conversation" (complex vocal exchanges), they warrant high status.
  *   **Consistency Cost:** Low. It aligns with the Dolphin verdict and respects the functionalist approach.

  ---

  ### 4. Where the Consistency Risks Lie

  If your friend wants to remain consistent, she needs to watch out for two specific traps when deciding on the sperm whale.

  **Trap 1: The "Testing Bias" Trap**
  She assigns "Very High" to chimps and dolphins partly because they pass the mirror test. Sperm whales fail it. But the mirror test is visual. Sperm whales are acoustic.
  *   *Risk:* If she downgrades sperm whales because they fail visual tests, she violates her own Functionalism.
  *   *Fix:* She must accept acoustic self-recognition or cultural complexity as equivalent evidence.

  **Trap 2: The "Honeybee" Trap**
  Sperm whales have "cultural dialects." Honeybees have "dance language." Why is one High Status and the other None?
  *   *Risk:* If she upgrades sperm whales solely on culture, she must ensure she doesn't accidentally upgrade social insects.
  *   *Fix:* The distinction is **individual flexibility**. Honeybee dances are instinctual and rigid. Sperm whale codas are learned, vary by group, and change over time (evolutionary culture). The status comes from the *individual's capacity to learn and adapt*, not the existence of a group signal.

  ### 5. Recommendation for Your Friend

  To maintain consistency with her "Alien Constraint" and her existing verdicts, she should classify the **Sperm Whale as having "Very High" moral status**, equivalent to Bottlenose Dolphins and Great Apes.

  **The Argument for Consistency:**
  1.  **Functionalism:** Her "Alien" rule prioritizes *capacity* over *hardware*. Sperm whales demonstrate high-capacity communication and culture, even if their EQ is modest.
  2.  **Phylogenetic Parity:** It is inconsistent to grant "Very High" status to Bottlenose Dolphins (Odontocetes) while demoting Sperm Whales (Odontocetes) based on an EQ metric she otherwise ignores (given the Raven/Octopus verdicts).
  3.  **The "Walnut" Precedent:** If a walnut brain with conversation skills gets Full Status, a 6kg brain with complex conversation skills (codas) should not be penalized for its body size (EQ).

  **The Only Reason to Downgrade:**
  The only consistent reason to assign them **Moderate Status** (with dogs/pigs) is if she decides that **Individual Moral Agency** is a strict requirement for "Very High" status. Since there is no evidence sperm whales make *moral* judgments (only social ones), whereas the Alien example *does* make moral judgments, she could argue the Alien gets "Full" and the Whale gets "High/Very High."

  **Summary:**
  *   **Most Consistent Rule:** Cognitive/Behavioral Complexity (Functionalism).
  *   **Most Constraining Fixed Points:** The Octopus/Raven (rules out brain anatomy) and the Alien (rules out brain size/EQ).
  *   **Sperm Whale Verdict:** **Very High.** Downgrading them based on EQ would force her to reconsider Elephants (also low EQ) or Ravens (different brain structure), threatening the coherence of her entire list.
