answer: |-
  # Q&A Prep Sheet: The Mislocated Demandingness Objection

  **Context:** Department colloquium.
  **Audience:** 5 Consequentialists (4 Act, 1 Rule), 2 Kantians, 1 Virtue Ethicist.
  **Core Thesis:** The demandingness objection is not about *quantity* (how much is asked) but *structure* (the exclusion of agent-relative projects from the criterion of rightness).

  ### Part I: Literature Status Check
  *Use this to calibrate your confidence during replies.*

  *   **Settled:** Bernard Williams' "Integrity Objection" (*Utilitarianism: For and Against*, 1973) is distinct from simple "over-demandingness." Standard replies (decision-procedure, blame, satisficing) are well-documented in the literature (e.g., Singer, Hooker, Slote).
  *   **Contested:** Whether Consequentialism *must* be defined by agent-neutrality (Scheffler argues prerogatives can be internal; traditionalists disagree). Whether the "criterion of rightness" must be action-guiding or merely justificatory. Whether Rule-Consequentialism collapses into Act-Consequentialism under ideal conditions.
  *   **Strategy:** Do not claim consensus on the definition of consequentialism. Acknowledge the Scheffler debate but argue that *your* version of the objection holds even on generous definitions.

  ---

  ### Part II: The Objections (Ordered by Damage Potential)

  #### 1. The "Stipulative Definition" Objection
  *   **Likelihood:** High
  *   **Damage:** Critical
  *   **Voice:** Senior Act-Consequentialist
  *   **Question:** "You argue that adding an agent-relative prerogative to the criterion stops a view from being consequentialist. But Samuel Scheffler argued decades ago that a 'hybrid' view is still consequentialist because the good remains the fundamental evaluative standard. Aren't you just defining consequentialism narrowly to win the argument? If I say the Good *includes* agent-relative prerogatives, haven't I answered your Step 3?"
  *   **2-Minute Reply:** "I'm not defining consequentialism by fiat, but by its structural commitment to the *agent-neutrality* of the good. If the Good itself dictates that I must weight my own projects higher than strangers' *without an instrumental justification*, the 'Good' is no longer doing the normative work—the agent's perspective is. Scheffler's hybrid view concedes my point: it saves the agent's projects only by ceasing to be pure consequentialism. My argument is that *act-consequentialism* (the target of the objection) cannot absorb this without self-destructing. You can have the prerogative, but you can't call it AC."
  *   **Weakness:** Relies on a specific definition of consequentialism (agent-neutrality) that some modern consequentialists reject. If they insist "Consequentialism = maximizing the Good, whatever the Good contains," you risk a verbal dispute.

  #### 2. The "Williams Redux" Objection
  *   **Likelihood:** High
  *   **Damage:** Critical
  *   **Voice:** Kantian (Sympathetic but precise)
  *   **Question:** "This sounds exactly like Bernard Williams' integrity objection from the 70s. He argued that utilitarianism attacks our personal identity. You claim to be 'relocating' the demandingness objection, but aren't you just repackaging Williams? If so, why should we think this settles a debate the consequentialists claim was already settled?"
  *   **2-Minute Reply:** "Williams focused on the *psychological cost* to the agent—the alienation of losing one's identity. My argument is normative, not psychological. I'm arguing that even if an agent *could* psychologically detach from their projects, AC provides no *normative justification* for them within the criterion of rightness. Williams showed it hurts; I'm showing why the theory cannot account for the hurt without contradiction. The 'dead debate' claim relies on solving the psychological burden (via decision procedures); I'm showing the structural exclusion remains."
  *   **Weakness:** Hard to disentangle completely from Williams. If they press that normative exclusion *just is* the integrity objection, you may have to concede lineage while maintaining novelty in the *criterion* focus.

  #### 3. The Rule-Consequentialist Escape
  *   **Likelihood:** High (Specific audience member)
  *   **Damage:** High
  *   **Voice:** Rule-Consequentialist
  *   **Question:** "My view selects rules that optimize the good. A rule like 'Agents may prioritize their own children' clearly optimizes general well-being by reducing anxiety and promoting care. So Rule-Consequentialism builds the prerogative into the code without abandoning consequentialism. Doesn't this bypass your Step 1 and 3?"
  *   **2-Minute Reply:** "It bypasses Step 1 only superficially. In your view, the agent is allowed to prioritize their child only *because* doing so generally optimizes the impersonal good. If, in a specific case, prioritizing the child *fails* to optimize the good (e.g., I could save two strangers instead), your criterion says I am acting wrongly. The prerogative is instrumental, not non-instrumental. My objection requires that the agent's project be a source of reasons *even when* it doesn't optimize the good. Your view still treats personal attachments as tools for the impersonal good."
  *   **Weakness:** Rule-Consequentialists often argue that we should never be in epistemic positions where we know violating the rule optimizes the good. You must press the *ideal* theory point.

  #### 4. The Criterion/Motive Distinction
  *   **Likelihood:** High
  *   **Damage:** Medium
  *   **Voice:** Act-Consequentialist
  *   **Question:** "You're conflating the criterion of rightness with a decision procedure. AC tells me what makes acts right. It doesn't tell me I can't *love* my family. I can have the motives you want, as long as the act is right. Why does the criterion need to validate my motives?"
  *   **2-Minute Reply:** "Because morality isn't just about act-classification; it's about practical reasoning. If the criterion says my love for my family provides no *non-instrumental* reason for action, then when I deliberate, I must treat that love as a bias to be overcome or a tool to be used. That is the alienation. It's not that I can't *have* the motive; it's that the theory tells me that motive has no normative weight in justifying the act. A moral theory that tells agents their deepest commitments are normatively inert regarding rightness is structurally flawed."
  *   **Weakness:** Some ACs are happy to admit morality is alienating. You must press that this is a *reductio*, not a feature.

  #### 5. The "Anti-Theory" Pushback
  *   **Likelihood:** Certain
  *   **Damage:** Medium
  *   **Voice:** Virtue Ethicist
  *   **Question:** "You're trying to fix a criterion-based theory by adding a prerogative to the criterion. But the problem is the search for a single criterion of rightness. Why not just abandon the project of a decision criterion altogether? Isn't your Step 2 conceding too much to the consequentialist framework?"
  *   **2-Minute Reply:** "I grant that criterion-based theories have limits. However, my argument is an *internal* critique. I'm meeting consequentialists on their own ground to show that *even if* we accept the project of a criterion, AC fails. If I succeed, it strengthens your hand: it shows that the demand for a purely agent-neutral criterion is the specific failure point. But to persuade this department, I need to show AC breaks internally, not just externally."
  *   **Weakness:** Risks alienating the VE by validating the "criterion project" they dislike. Keep the concession clear.

  #### 6. The Kantian Alternative
  *   **Likelihood:** Medium
  *   **Damage:** Low
  *   **Voice:** Kantian
  *   **Question:** "You conclude we need an agent-relative prerogative. But Kantians argue we have perfect duties to ourselves and others that ground this without a 'prerogative.' Why frame the solution as a 'permission to do less' rather than a 'duty to maintain integrity'?"
  *   **2-Minute Reply:** "Because the intuition driving the demandingness objection is about *latitude*, not obligation. We feel we are *permitted* to save our child, not that we are *forbidden* from saving the stranger. A duty-based framing risks making the personal project itself mandatory, which doesn't capture the optionality we value. A prerogative captures the space where morality steps back, which fits the phenomenology of the objection better than a competing duty."
  *   **Weakness:** Kantians may argue optionality is just a conflict of imperfect duties. Don't get bogged down in Deontic logic.

  #### 7. The "Hope Nobody Asks" Question
  *   **Target:** Step 3 (The claim that adding a prerogative is unmotivated/destroys the view).
  *   **Likelihood:** Low (Hopefully)
  *   **Damage:** Critical
  *   **Voice:** Sharp Act-Consequentialist
  *   **Question:** "Okay, let's say we accept we need a prerogative. You say it's 'unmotivated from within consequentialism.' But if the *point* of morality is to promote well-being, and well-being is best promoted by agents having prerogatives, isn't the prerogative motivated *by* consequentialism? You're assuming the Good must be maximized in every act, rather than promoted by the system. Why is that assumption non-negotiable?"
  *   **2-Minute Reply:** "If the prerogative is justified *because* it promotes well-being, it remains instrumental. That returns us to the Rule-Consequentialist objection. For the prerogative to solve the 'standing of projects' problem, it must allow the agent to act *against* the optimization of the good without wrongdoing. If the justification is still 'this promotes the good overall,' the agent's project is still subordinate to the Good. To give the project non-instrumental standing, the justification must come from the agent's standpoint, not the impersonal Good. That breaks the consequentialist structure."
  *   **Weakness:** This is the hardest pivot. You must hold the line that "non-instrumental" means "not justified by the Good." If they argue the Good *includes* agent-relative satisfaction, you are back to Objection #1.

  ---

  ### Part III: Strategic Notes for the Q&A

  1.  **The "Dead Debate" Trap:** The consequentialists will try to drag you back to "Can't we just use a heuristic?" or "Isn't satisficing enough?" **Do not engage deeply.** Acknowledge these solve the *quantity* problem, then immediately pivot: "That handles how much I pay, but it doesn't handle *why* I pay. My objection is about the *why*."
  2.  **The Kantian Alliance:** The Kantians are friendly but dangerous. They will try to co-opt your conclusion for Deontology. **Keep them at arm's length.** "I'm not arguing for Kantianism today; I'm arguing that AC fails on its own terms. What replaces it is a separate question."
  3.  **The Virtue Ethicist:** They will try to dissolve the problem. **Acknowledge but bracket.** "That may be true, but my paper addresses the consequentialist framework specifically."
  4.  **Tone:** Avoid sounding like you are reviving 1970s objections. Frame this as a *structural* analysis of the criterion, not a complaint about hardship. You are doing meta-ethics/normative architecture, not moral complaining.
