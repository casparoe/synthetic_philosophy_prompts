  ### Apparent tensions that dissolve

  View 1 and View 5 are natural allies, not enemies. If the derogatory force is semantically encoded (View 1), it contributes to the proposition expressed, ensuring that slurs and neutral counterparts differ in truth-conditional content (View 5). This aligns with combinatorial externalism, where the semantic value includes a prescription of contempt, making the propositions distinct. This avoids the Gricean problem you noted in View 1, as conventional content projects without requiring speaker intent. Thus, your semantic commitment supports your non-equivalence claim directly. Similarly, View 4 (mentioning) creates no genuine conflict. The use/mention distinction is robust enough to handle semantic encoding; mentioning a word invokes its form, not its semantic content or illocutionary potential. Therefore, academic discussion remains permissible because you are not deploying the slur's semantic value to refer or predicate, merely citing the phonological string. These positions form a coherent baseline for a semanticist approach.

  ### Genuine tensions, ranked

  The first and most severe tension exists between View 1 (Semantic Encoding) and View 2 (Reclamation). If derogatory content is fixed semantically, it should be context-invariant, much like the meaning of "dog" or "triangle." However, View 2 claims the same phonological form loses this force in-group. Standard semantic theories struggle to explain how a word's literal meaning switches off based on speaker identity without positing lexical ambiguity (claiming there are actually two different words) or abandoning semantic encoding for pragmatics. If you insist the meaning is encoded, you must explain how reclamation changes that encoding without changing the word. Furthermore, if the meaning projects (as per View 1), it should project in reclamation contexts too, yet intuitively it does not.

  Second, View 3 (Constitutive Subordination) clashes sharply with View 2. View 3 asserts that using a slur enacts subordination regardless of intent or audience. If the act itself is subordinating, akin to a judge sentencing a defendant, in-group reclamation should still constitute self-subordination or intra-group hierarchy. View 2 insists it is "genuinely non-derogatory." You cannot maintain that the act *always* constitutes subordination simply by virtue of being uttered while also claiming some instances *do not* subordinate anyone. This creates a paradox where the same action is both harmful and harmless depending on who speaks, which undermines the "constitutive" claim.

  Third, there is a category tension between View 1 and View 3. View 1 locates the problem in semantics (meaning/truth), while View 3 locates it in illocution (action/power). While compatible, they pull in different directions: one suggests the error is asserting a false/loaded proposition, the other that the error is performing a harmful social act. If the violation is purely semantic, why is the harm described as social subordination? If it's purely social, why rely on semantics? Maintaining both requires a complex theory where semantic content necessarily triggers illocutionary subordination, which risks redundancy or category confusion regarding where the primary normative violation lies.

  ### Least costly revision

  The least costly revision is to refine View 3. Currently, it claims subordination occurs "regardless of... intentions or whether anyone present takes offense." It does not, however, specify social authority. You can modify View 3 to state that slurring enacts subordination only when deployed by a speaker with social authority over the target group. This preserves View 1 (semantic encoding) and View 5 (non-equivalence) because the word's meaning remains stable. It also saves View 2 (Reclamation) because in-group usage lacks the power differential required to enact subordination, rendering it non-derogatory without needing to change the semantics. This adjustment costs little theoretically but resolves the conflict with reclamation data, allowing you to maintain a semantic view while acknowledging the sociological reality of power dynamics in speech acts. This aligns with Rae Langton's speech act theory, where authority determines illocutionary uptake, solving the tension without abandoning your core semantic commitments.
