  # JOINT STATEMENT ON THE ORIGINAL POSITION
  **Adversarial Collaboration between Proponents of Rawlsian Constructivism and Harsanyi-Bayesian Utilitarianism**

  **Date:** October 26, 2023
  **Signatories:** [Rawlsian Representative], [Harsanyi-Bayesian Representative]

  ## I. AGREED PREMISES
  *The following claims constitute the shared theoretical framework. Both parties agree that these premises are necessary conditions for the debate, though they disagree on the implications derived from them.*

  1.  **Purpose of the Device:** The Original Position (OP) and the Veil of Ignorance (VoI) are thought experiments designed to model impartiality. They are not historical events but devices of representation intended to filter out bias arising from contingent social advantages (class, race, gender, natural endowment).
  2.  **Motivation of the Parties:** The parties behind the Veil are "mutually disinterested." They are not motivated by envy or altruism, but by a desire to advance their own conception of the good (whatever that turns out to be) as effectively as possible.
  3.  **Knowledge Constraints:** The parties possess general knowledge of economics, psychology, and political sociology (the "circumstances of justice"), but lack specific knowledge of their own place in society, their natural assets, or their specific comprehensive doctrine.
  4.  **Object of Choice:** The parties are selecting principles to govern the **basic structure of society**. They agree that this choice is fundamental and distinct from ordinary economic decisions, as it establishes the background conditions for all future cooperation.
  5.  **Rationality:** The parties are instrumentally rational. They will not choose principles that are strictly dominated by other available options (i.e., if Option A yields a better outcome for the party in every possible state of the world than Option B, Option B will be rejected).
  6.  **Exclusion of Settled Interpretations:** We explicitly acknowledge that the following remain **contested** and are *not* included in this consensus:
      *   Whether the situation behind the Veil constitutes decision-making under *risk* (known probabilities) or *uncertainty* (unknown probabilities).
      *   Whether the metric of advantage is *primary goods* (Rawls) or *utility/preference satisfaction* (Harsanyi).
      *   Whether the correct decision rule is *Maximin* (Rawls) or *Expected Utility Maximization* (Harsanyi).

  ## II. PRECISE FORMULATION OF DISAGREEMENT
  *The parties diverge on the specification of rational choice within the constraints agreed upon above. Each side accepts the following characterization of their own position and the opposing position as accurate.*

  | **Feature** | **The Rawlsian Position** | **The Harsanyi-Bayesian Position** |
  | :--- | :--- | :--- |
  | **Epistemic Status** | The Veil creates **radical uncertainty**. There is no objective basis for assigning probabilities to social positions. Applying the Principle of Insufficient Reason (assigning equal probability) is arbitrary because social positions are not repeatable random events like dice rolls. | The Veil creates **decision under risk**. A rational agent cannot act without probabilities. In the absence of specific evidence, the Principle of Insufficient Reason dictates an **equiprobability assumption** (1/N chance of being any person). |
  | **Decision Rule** | **Maximin.** Given the gravity of the choice (fundamental liberties and life prospects), the lack of probabilistic basis, and the unacceptable nature of certain outcomes (e.g., slavery, destitution), rationality requires securing the worst-case scenario. | **Expected Utility Maximization (MEU).** Rationality requires maximizing the mathematical expectation of utility. To reject MEU in favor of Maximin is to introduce an arbitrary, extreme psychological risk-aversion parameter into the definition of rationality. |
  | **Outcome** | **The Difference Principle.** Inequalities are permitted only if they maximize the position of the least advantaged. This ensures the "strains of commitment" are not exceeded. | **Average Utilitarianism.** Principles should be chosen to maximize the average welfare of the population. This yields the highest expected return for a randomly situated individual. |
  | **Critique of Opponent** | Harsanyi treats the basic structure as a gamble. This fails to respect the distinctness of persons and ignores that some losses (basic liberties) cannot be compensated by average gains. | Rawls surreptitiously builds a specific risk-aversion function into the OP. If one removes this stipulation, the OP logically entails Utilitarianism. |

  ## III. CRUXES AND ADJUDICATION
  *The following table identifies specific sub-questions (Cruxes). For each Crux, we define the type of argument or case that both sides agree would be relevant to settling the matter, and we pre-register our predictions.*

  | **Crux** | **Description of the Contested Issue** | **Accepted Case / Evidence**<br>*(What would move the needle?)* | **Rawlsian Prediction** | **Harsanyi Prediction** |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Probability Crux** | **Is the Equiprobability Assumption rational under the Veil?**<br>Does the lack of specific knowledge justify assigning equal probability to all social positions, or does it justify assigning *no* probability? | A formal demonstration regarding the **application of the Principle of Insufficient Reason to unique historical structures**.<br>*(Specifically: Does treating social positions as a lottery violate the description of the OP as a non-probabilistic choice situation?)* | We predict the demonstration will show that social positions are **non-random unique events**. Therefore, assigning probabilities is epistemically baseless, forcing a non-probabilistic rule (Maximin). | We predict the demonstration will show that **action requires probability**. To refuse to assign probabilities is to refuse to choose. Equiprobability is the only impartial prior, making MEU the only rational rule. |
  | **2. The Stakes Crux** | **Does the "Basic Structure" justify departing from MEU?**<br>Is the choice of constitutional essentials sufficiently distinct from ordinary gambles to warrant a special decision rule, or is this a post-hoc justification for risk aversion? | A comparative analysis of **outcomes under catastrophic failure**.<br>*(Specifically: Would a rational agent accept a 1% chance of enslavement for a 99% chance of utopia, if the choice determines their permanent social status?)* | We predict that under **strains of commitment** analysis, parties will reject the gamble. The loss of basic status is lexically prior to gains in wealth, rendering MEU inappropriate for the basic structure. | We predict that if the **expected utility** of the "utopia" is sufficiently high, a rational agent *will* take the gamble. Rejecting it is purely a function of a specific utility curve (risk aversion), not rationality itself. |
  | **3. The Stability Crux** | **Would Average Utilitarianism survive the "Strains of Commitment"?**<br>Even if MEU selects Utilitarianism initially, would the resulting society be stable, or would those at the bottom withdraw cooperation? | An assessment of **compliance conditions in a Utilitarian society**.<br>*(Specifically: Can those sacrificed for the average welfare reasonably be expected to uphold the principles of justice?)* | We predict Utilitarianism fails the **publicity condition**. Those at the bottom cannot affirm the principles governing them, leading to instability. Thus, the OP parties would anticipate this and reject Utilitarianism. | We predict that **social stability is a separate empirical variable**. If the average welfare is high enough, social cohesion holds. The OP chooses the principle; stability is a secondary constraint that Utilitarianism can satisfy. |

  ## IV. COMMITMENT TO REVISION
  *Both signatories agree that if the "Accepted Case" for any Crux is successfully demonstrated in the direction predicted by the opposing side, they will revise their confidence in their respective conclusion by a minimum of 20%. We acknowledge that philosophical demonstration is distinct from empirical falsification, but commit to treating logical coherence and consistency with the Agreed Premises as binding constraints.*

  ***

  **Signed:**

  _________________________
  (Rawlsian Representative)

  _________________________
  (Harsanyi-Bayesian Representative)
