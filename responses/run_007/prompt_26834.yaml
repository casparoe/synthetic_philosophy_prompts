  Based on the verdicts you've collected, your philosopher is navigating the classic tension between *realism* (categories track mind-independent reality) and *constructivism* (categories are tools created by human practices). The nuance in her "Species" verdict is the key: she allows that scientists *choose* concepts without making the kind *socially constructed*.

  Here are the three most plausible rules fitting her prior verdicts, their predictions for "Planet," and my assessment of which rule she is actually using.

  ### Rule 1: The Causal Essence Rule (Natural Kinds)
  **The Logic:** A category is **Not Socially Constructed** if its members share a mind-independent causal structure, history, or essence (e.g., atomic number, evolutionary lineage, hormonal profile). A category is **Socially Constructed** if it groups phenomena based on human interpretation, symptom checklists, or social consequences rather than a unified underlying cause.
  *   **Fits:** Atoms (proton count), Sex (biology), Puberty (process), Species (lineage).
  *   **Explains Nuance:** Schizophrenia is SC because it clusters symptoms with heterogeneous causes; Species are Not SC because they share a causal history (lineage), even if we debate how to measure it.
  *   **Prediction for Planet:** **Not Socially Constructed.** Planets share a causal formation history and dynamical dominance ("clearing the neighborhood" is a physical state, not just a label). The IAU vote merely recognized a physical distinction.

  ### Rule 2: The Institutional Stipulation Rule (Boundary Drawing)
  **The Logic:** A category is **Socially Constructed** if its boundaries are fixed by human agreement, vote, or legal decree, especially where nature presents a continuum. A category is **Not Socially Constructed** if the boundaries are discrete and discovered rather than stipulated.
  *   **Fits:** Adulthood (18 years is a legal line), Money (value is stipulated), Schizophrenia (DSM checklist thresholds).
  *   **Explains Nuance:** Species are Not SC because reproductive isolation is a biological fact, even if we use different *concepts* to identify it. (She treats biological concepts as discovery tools, not stipulations).
  *   **Prediction for Planet:** **Socially Constructed.** The IAU definition relied on a specific vote to draw a sharp line (hydrostatic equilibrium + clearing orbit) where there was previously a continuum of bodies. The "demotion" was an administrative act, not a discovery of a new physical joint.

  ### Rule 3: The Social Function Rule (Normative Kinds)
  **The Logic:** A category is **Socially Constructed** if its primary purpose is to regulate human behavior, distribute rights, or organize social institutions. A category is **Not Socially Constructed** if its purpose is purely descriptive of the non-human world.
  *   **Fits:** Money (exchange), Race/Gender (social hierarchy/identity), Adulthood (legal rights), Schizophrenia (treatment/insurance access).
  *   **Explains Nuance:** Species and Atoms describe the world; they do not grant rights or organize economies. Schizophrenia is SC because the *diagnosis* gates medical and legal treatment, even if the *suffering* is biological.
  *   **Prediction for Planet:** **Not Socially Constructed.** The category "Planet" serves a descriptive astronomical function. It does not grant Pluto or Earth rights, funding, or social status (metaphorically aside).

  ### Best Guess: She is running Rule 1 (The Causal Essence Rule)
  **Why:** The "Species" verdict is the strongest constraint. By insisting that Species are **Not** socially constructed *even though* biologists choose among concepts, she has explicitly decoupled "scientific convention" from "social construction." She grants the natural sciences the authority to carve nature at its joints, even if the knife is chosen by humans.

