  *   **If she says Mineral Species ARE Socially Constructed:** She is prioritizing **Rule 2**. She believes that *any* category requiring a committee vote to fix its boundary is constructed, regardless of the underlying physics. This suggests she might treat the IAU vote on Pluto as a constitutive act, meaning **Planet is SC**.

