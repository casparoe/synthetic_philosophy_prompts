      *   *Consequences/Feedback:* Reward signal ($r_t$) and next state ($s_{t+1}$).
      *   *Social Policies:* Multi-agent RL (MARL) or a single global policy affecting a complex environment.
      *   *Democracy:* The protocol for aggregation of feedback and policy updates. It's the optimization algorithm distributed across agents.
