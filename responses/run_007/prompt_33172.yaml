  **MEMORANDUM**

  **TO:** Search-and-Rescue Command
  **FROM:** Ethics & Protocol Consultant
  **SUBJECT:** Implementation of Non-Aggregative Triage Protocol (The "Equal Claim" Procedure)

  **WARNING:** *The following procedure deviates from standard utilitarian emergency management doctrine ("Save the Most"). Adopting this protocol exposes the county, the command staff, and field volunteers to significant legal liability, public relations risk, and moral injury. Standard SAR doctrine and tort law generally prioritize maximizing survival outcomes. This procedure is designed to operationalize the ethical arguments of John Taurek as requested, but it must be formally adopted as county policy to offer any shield to volunteers. Do not distribute this to field teams without legal counsel and official policy ratification.*

  ---

  ### PART 1: THE DECISION PROCEDURE
  **Name:** The Equal Claim Protocol (ECP)
  **Purpose:** To resolve triage conflicts where resources allow saving only one of two groups, prioritizing individual fairness over aggregate numbers.
  **Time Limit:** 5 Minutes max.

  **STEP 1: VIABILITY CHECK (The "Can We?" Question)**
  *   **Question:** Is there a reasonable probability of success for *both* groups given current resources, weather, and terrain?
  *   **Criteria for "Yes":** Confidence >50% for both.
  *   **If NO (One group is unreachable/too risky):** Proceed to that group immediately. **STOP.** (Taurek agrees: You are not obligated to attempt the impossible.)
  *   **If YES (Both are viable):** Move to Step 2.

  **STEP 2: DIFFERENTIATING FACTORS (The "Who Needs Us More?" Question)**
  *   **Question:** Are there non-numerical factors that make one group's claim on rescue stronger?
  *   **Check:**
      *   Severity of injury/illness (Immediate threat to life vs. discomfort).
      *   Vulnerability (Children, elderly, disabled vs. able-bodied adults).
      *   Exposure (Rate of deterioration due to environment).
  *   **Criteria for "Move On":** Factors are roughly equivalent. (e.g., both groups have minor injuries, both are adults, both are in similar exposure).
  *   **If YES (One group is clearly more vulnerable/injured):** Proceed to that group. **STOP.** (Taurek agrees: Need can break ties.)
  *   **If NO (Factors are equal):** Move to Step 3.

  **STEP 3: THE NUMBERS CHECK (The "Values Call")**
  *   **Question:** Is the *only* remaining difference between the two groups the number of people?
  *   **If NO:** Return to Step 2.
  *   **If YES:** **STOP CHECKLIST.** This is a values call.
      *   **Instruction:** Do not default to the larger group. The protocol requires giving each *individual* an equal ex-ante chance of survival.
      *   **Action:** Conduct a **Weighted Randomization**.
      *   **Method:** Assign one "ticket" per person. Total tickets = Person A + Person B. Draw one ticket. Save the group associated with the drawn ticket.
      *   **Documentation:** Record the exact numbers and the randomization result in the incident log immediately.

  ---

  ### PART 2: HONEST ASSESSMENT & CONFLICT POINTS

  **1. Where This Conflicts with "Save the Most"**
  *   **The Aggregate Loss:** Standard protocol treats four deaths as worse than one death. This procedure treats four deaths as *four individual tragedies*, none of which inherently outweigh the single tragedy of the one.
  *   **The Outcome:** In a 1-vs-4 scenario, standard protocol saves the 4, 100% of the time. This procedure saves the 4, 80% of the time. In the 20% of cases where the single person's ticket is drawn, four people will die who *could* have been saved. Your teams will know this.
  *   **The "Hate" Factor:** Volunteers join SAR to save lives. This procedure forces them to knowingly accept a higher probability of total loss to satisfy a principle of fairness. This causes moral injury.

  **2. Where It Misfires or Goes Silent**
  *   **Step 2 Ambiguity:** "Vulnerability" is subjective. Is a child more vulnerable than an injured adult? The checklist stops at Step 3 if you can't agree. This pushes the burden onto the Team Leader.
  *   **Legal Silence:** The law generally recognizes a "duty to act reasonably." In emergency medicine and SAR, "reasonably" is almost universally interpreted as "maximizing survival." A weighted lottery may be construed as gross negligence or arbitrary caprice in a wrongful death suit. There is no legal precedent protecting a Taurekian choice in SAR.
  *   **Public Perception:** If the media learns you "rolled dice" and the larger group died, the public outrage will be immense. "Why did you let four die to save one?" is a headline you cannot spin.

  **3. The "Values Call" Designation**
  *   Step 3 is explicitly marked as a values call because no algorithm can resolve the tension between *fairness to the individual* and *utility for the group*. The checklist forces the Commander to own the choice rather than hiding behind "protocol said so."

  ---

  ### PART 3: WORKED CASES

  #### CASE 1: The Pure Numbers Conflict
  *   **Scenario:** One hiker (Group A) vs. Four hikers (Group B). Same injuries (sprained ankles, hypothermia risk), same weather, same terrain difficulty. Confidence of rescue is 90% for either.
  *   **Procedure Run:**
      *   Step 1 (Viability): Both viable. **Pass.**
      *   Step 2 (Factors): No difference in injury or vulnerability. **Pass.**
      *   Step 3 (Numbers): Only difference is 1 vs. 4. **Stop.**
      *   **Action:** Weighted Randomization. 5 Tickets total. Group A gets 1 ticket. Group B gets 4 tickets.
  *   **Outcome:** There is a **20% chance** your team heads to the single hiker, leaving the four to potentially die or suffer significantly longer.
  *   **Team Reaction:** **HATE.** Your volunteers will despise this. They will feel complicit in the deaths of the four if the single ticket is drawn. It violates the core instinct of "do the most good."
  *   **Review Board/Lawyer:** If the single ticket is drawn and the four suffer harm, you will be sued. The argument will be: "You had the capacity to save four, and you chose a 20% chance to save one instead. That is unreasonable."

  #### CASE 2: The Viability Conflict
  *   **Scenario:** One hiker (Group A) is on stable ground, reachable in 30 mins (95% confidence). Five hikers (Group B) are across a swelling river, reachable in 60 mins (40% confidence due to water rise).
  *   **Procedure Run:**
      *   Step 1 (Viability): Group A is viable. Group B is marginal/low confidence.
      *   **Decision:** Proceed to Group A. **STOP.**
  *   **Outcome:** Save the one certain life.
  *   **Team Reaction:** **ACCEPTABLE.** This aligns with standard SAR risk management. Taurek does not argue you must attempt the impossible or the highly risky to satisfy numbers.
  *   **Review Board/Lawyer:** Defensible. Resource allocation based on probability of success is standard operational procedure, regardless of ethical framework.

  #### CASE 3: The Vulnerability Conflict
  *   **Scenario:** One Adult (Group A) vs. Three Children (Group B). Same injury, same terrain, same confidence.
  *   **Procedure Run:**
      *   Step 1 (Viability): Both viable. **Pass.**
      *   Step 2 (Factors): Age/Vulnerability check.
      *   **Decision:** **STOP CHECKLIST.** This is a Values Call.
  *   **Analysis:** The procedure *cannot* solve this. Taurek argues numbers don't count, but he is less clear on whether "types" of people count. Most societies assign higher priority to children.
      *   *Option A (Utilitarian):* Save the three children (3 lives > 1 life).
      *   *Option B (Vulnerability):* Save the three children (Children > Adults).
      *   *Option C (Strict Taurek):* Randomize between groups (50/50) or individuals (1/4 vs 3/4).
  *   **Instruction to Commander:** You must make a human judgment call here. The checklist explicitly refuses to automate the valuation of a child's life vs. an adult's. Document your reasoning: "Decision based on vulnerability prioritization, not numbers."
  *   **Team Reaction:** **MIXED.** Most will want to save the children. If you randomize this, they will revolt.
  *   **Review Board/Lawyer:** "Vulnerability" is a more defensible metric than "Randomization." If you save the adult via randomization and a child dies, the liability is catastrophic.

  ---

  ### PART 4: FINAL RECOMMENDATION

  You asked for a Taurekian procedure. I have given you one. **I strongly advise against adopting it as written.**

  1.  **Legal Suicide:** In the Cascades, SAR is often governed by state statutes and county ordinances that imply a duty to act in the public interest. Courts interpret "public interest" in emergencies as "maximizing survival." A weighted lottery is indistinguishable from negligence in a courtroom.
  2.  **Volunteer Retention:** Your teams are volunteers. They are not moral philosophers. Asking them to flip a coin (weighted or not) when they know they could save more people will cause burnout and resignations. They need to believe their work maximizes good.
  3.  **The "Hate" Case:** Case 1 is the dealbreaker. If you implement this, and the 1-vs-4 lottery goes to the 1, and the 4 die, you will lose the trust of the community and your team.

  **Alternative Suggestion:**
  Use Taurek not as a *decision procedure*, but as a *review lens*.
  *   **Field Protocol:** Continue "Save the Most" (Utilitarian). It is legally defensible and psychologically sustainable.
  *   **Post-Incident Review:** Use Taurek's arguments to comfort the team when the "Save the Most" choice leaves a single person behind. Remind them that while they saved the most lives, the loss of the individual is still a profound moral tragedy, not just a math error. This acknowledges the Taurekian insight (the individual loss matters) without forcing the team to operationalize it in a way that gets people killed or sued.

  **If you proceed with the Equal Claim Protocol:**
  You must secure a formal indemnity from the County Council and a written opinion from the County Counsel stating that this protocol meets the "standard of care." Without that, you are asking your volunteers to put their personal assets and freedom at risk for a philosophical experiment.
