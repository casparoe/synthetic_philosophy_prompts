      *   *Response D: The "Distinction in Kind" (Clarke-Doane).*
          *   Math is secure because it's *modally robust* or because mathematical beliefs are *necessarily true* (if true at all). Moral beliefs are contingent.
          *   If math beliefs are necessarily true, they *cannot* be false. So the "regardless of truth" condition is vacuous or different.

