answer: |-
  This is an exceptionally well-constructed argument. You have effectively formalized what is known in the literature as the **"Global Skepticism"** or **"Companions in Guilt"** objection to Evolutionary Debunking Arguments (EDAs). It is the most significant hurdle for debunkers like Richard Joyce, Sharon Street, and Michael Ruse.

  If I were defending the evolutionary debunker, I would not accept the argument as sound. While it is valid, I would argue it is unsound. The most defensible move is to **reject Premise (4)**, though doing so incurs a specific theoretical cost regarding the metaphysics of mathematics versus morality. A secondary, more nuanced move involves **refining Premise (1)**.

  Here is an analysis of how a debunker would respond, the specific wedge they would attempt to drive, and the theoretical costs involved.

  ---

  ### Option 1: Reject Premise (4) — The "Truth-Mediation" Defense

  The most common strategy for saving the EDA from spilling over into mathematics and science is to argue that the evolutionary explanation for mathematical beliefs *does* essentially appeal to their truth, whereas the explanation for moral beliefs does not.

  **The Argument:**
  In Premise (4), you claim that evolutionary explanations for math appeal only to the "adaptive advantages of behaving as if those propositions were true." The debunker replies that in the case of mathematics (and empirical science), the **fitness advantage is mediated by the truth of the proposition.**

  *   **Math Case:** Why did believing $2+2=4$ confer a fitness advantage? Because in the actual world, aggregating two objects with two objects *results in* four objects. The truth of the arithmetic proposition constrains the physical environment. If $2+2$ actually equaled $5$, the organism believing $2+2=4$ would fail to gather enough food and would die. The truth of the math is *explanatorily relevant* to the fitness benefit.
  *   **Moral Case:** Why did believing "harming ingroup members is wrong" confer a fitness advantage? Because it promoted social cohesion and reduced internal conflict. Crucially, this fitness benefit obtains *regardless* of whether harming ingroup members is *actually* morally wrong. Even if moral nihilism were true (i.e., nothing is actually wrong), the *belief* that it is wrong would still promote cohesion. The truth of the moral proposition is *explanatorily irrelevant* to the fitness benefit.

  **The Wedge:**
  Therefore, Premise (4) is false. The evolutionary explanation for math *cannot* be fully stated without referencing the truth of mathematical propositions, because the truth is what makes the behavior adaptive. The evolutionary explanation for morality *can* be fully stated without referencing moral truth, because the fitness payoff is independent of that truth.

  **The Theoretical Cost:**
  To make this move, the debunker must commit to a metaphysics where mathematical truths (or at least applied arithmetic) have a "world-guiding" capacity that moral truths lack.
  1.  **Naturalism about Math:** The debunker usually has to treat math as descriptive of mind-independent structural features of the physical world (Naturalism) while treating morality as Non-Natural (or vice versa).
  2.  **The Platonist Problem:** If the debunker is a Platonist about math (believing numbers are abstract, causally inert objects), they face a problem. If numbers are causally inert, how do they explain fitness? They must argue that *concrete instantiations* of number are what matter. But then they must explain why *concrete instantiations* of moral facts (e.g., suffering) don't play the same role.
  3.  **Limitation of Scope:** This limits the EDA. It only works against **Non-Naturalist Moral Realists**. If a moral realist argues that moral facts are natural facts (e.g., "wrongness" = "causing unnecessary suffering"), the debunker loses the wedge, because then moral truth *would* be world-guiding and fitness-relevant, just like math.

  ### Option 2: Refine Premise (1) — The "Modal Security" Defense

  A more sophisticated response (championed by philosophers like **Katia Vavova** and **Justin Clarke-Doane**) is to argue that your formulation of the Debunking Principle in Premise (1) is too crude.

  **The Argument:**
  Premise (1) states: *E is a defeater if E accounts for B without appeal to the truth of B.*
  The refiner argues: *E is a defeater only if E shows that B is **insensitive** or **unsafe**.*

  *   **Sensitivity:** We would not believe $B$ if $B$ were false.
  *   **Safety:** We could not easily have believed $B$ if $B$ were false.

  The debunker argues that mathematical beliefs *are* sensitive/safe, even if evolution shaped them, whereas moral beliefs are not.
  *   **Math:** If $2+2$ were $5$, we likely *would not* believe $2+2=4$, because our interactions with the world would constantly contradict that belief, and we wouldn't survive to pass on the genes. The truth anchors the belief.
  *   **Morality:** If "harming is wrong" were false (i.e., harming is permissible), we *would still* believe it is wrong, because the evolutionary pressure (social cohesion) remains the same. The belief is "decoupled" from the truth.

  **The Theoretical Cost:**
  1.  **Counterfactual Burden:** The debunker must defend controversial counterfactuals. (e.g., "If harming weren't wrong, we'd still believe it is.") Non-naturalists often argue that moral truths *necessarily* supervene on natural facts, so the counterfactual is impossible or incoherent.
  2.  **Epistemic Complexity:** This moves the debate from simple genealogy to complex modal epistemology. It requires the debunker to prove that our moral beliefs are modally disconnected from moral truths, which is difficult if one accepts any form of moral supervenience.

  ### Option 3: Accept the Conclusion, Deny the Self-Defeat (The Pragmatic Move)

  If the debunker feels the pressure on (4) is too great, they might accept that evolutionary explanations undermine the *epistemic* justification for both math and morality, but reject Premise (6)'s claim that this leads to self-destruction. This is **Richard Joyce's** strategy in *The Myth of Morality*.

  **The Argument:**
  Joyce argues that EDAs show we lack *epistemic* justification for moral beliefs (they are unjustified true beliefs, or perhaps false). He is willing to extend this skepticism to other domains if necessary, but he avoids self-destruction by distinguishing between **epistemic rationality** and **pragmatic rationality**.
  *   We can accept that our belief in evolution is not *epistemically* justified (because our cognitive faculties are shaped by fitness, not truth).
  *   However, we are *pragmatically* justified in keeping those beliefs because they are indispensable for navigating the world.
  *   Morality, however, is *not* indispensable in the same way (we can have "fictionalism" or error theory).

  **The Theoretical Cost:**
  1.  **Radical Skepticism:** This is a high-cost position. It amounts to admitting that we have no reason to think our cognitive faculties track truth in *any* domain, including the science used to prove evolution.
  2.  **Instability:** Many philosophers argue this position is unstable. If you admit your faculties don't track truth, you lose the right to claim evolution is *true*, not just useful. This leads to a self-referential incoherence that most debunkers want to avoid.

  ### Recommendation for Your Paper

  If I were grading this paper, I would look for you to engage with **Option 1 (The Truth-Mediation Defense)** as the primary battleground. It is the most direct response to your Premise (4).

  **To strengthen your paper, consider this:**
  The debunker's success relies on the claim that **Math Truth $\rightarrow$ Fitness**, whereas **Moral Truth $\nrightarrow$ Fitness**.
  Your counter-move should be to press the debunker on **why** this asymmetry holds.
  *   If the debunker says math is about physical objects and morality is about non-natural properties, they have conceded that the EDA only works against Non-Naturalist Realism. (This is a significant concession).
  *   If the debunker says math is indispensable to science and morality is not, they are making a Quinean argument, not a purely genealogical one.

  **Key Literature to Cite:**
  *   **Sharon Street:** "A Darwinian Dilemma for Realist Theories of Value" (Sets up the dilemma).
  *   **Richard Joyce:** *The Evolution of Morality* (Defends the pragmatic escape).
  *   **Justin Clarke-Doane:** "Morality and Mathematics" (Directly addresses your parity argument; he argues math is *modally robust* in a way morality is not).
  *   **Katia Vavova:** "Debunking Evolutionary Debunking" (Refines the debunking principle to avoid global skepticism).
  *   **David Enoch:** "Taking Morality Seriously" (The "Third-Factor" response; argues there *is* a link between fitness and moral truth, similar to math).

  **Verdict:**
  Your argument is sound *unless* the debunker can successfully distinguish the explanatory role of truth in math vs. morality. The debate is not about whether evolution shaped both (it did), but whether the **truth of the content** plays a role in the **explanation of the fitness**. If you can show that the debunker cannot make this distinction without begging the question against the moral realist, your "proves too much" objection will stand.
