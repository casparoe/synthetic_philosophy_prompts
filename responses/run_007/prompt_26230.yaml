answer: |-
  Your framing is not broken, but it is dangerous. It assumes "representation" is a natural kind waiting to be discovered, like an electron. In cognitive science and ML, it is more likely a *level of abstraction* or a *useful fiction*. If you demand a theory that tells you what representations *really are* (ontologically), you will hit a wall. If you demand a theory that tells you how to *predict model behavior under intervention* (pragmatically), you might succeed.

  That said, to stop people from arguing past each other, we need to agree on what a successful theory must account for. Below is the scorecard of desiderata, categorized by necessity.

  ### I. Non-Negotiable Desiderata (Hard Constraints)
  *If a theory fails these, it is empirically falsified or mathematically incoherent.*

  **1. Causal Efficacy (The "Epiphenomenon" Test)**
  *   **Requirement:** The theory must identify structures that, when intervened upon, predictably alter downstream computation in a way consistent with the purported content.
  *   **Motivation:** If you claim a vector direction represents "gender," but zeroing it out doesn't change gendered behavior (or changes unrelated things), it's not a representation; it's a correlate. Probes that achieve 100% accuracy but fail intervention tests (the "probing paradox") prove that information *presence* is not representation *existence*.
  *   **Status:** **Non-Negotiable.** Representation without causal role is dualism.

  **2. Compatibility with Superposition (The "Dimensionality" Test)**
  *   **Requirement:** The theory must account for the fact that the number of semantically distinct features often exceeds the number of physical dimensions (neurons/layers).
  *   **Motivation:** Empirical fact: Models store more features than they have neurons (e.g., Elhage et al.'s "Toy Models of Superposition"). A theory that insists on a 1-to-1 mapping between "concept" and "neuron" is falsified by polysemanticity. It must allow features to be defined over subspaces or sparse linear combinations.
  *   **Status:** **Non-Negotiable.** Ignoring superposition makes the theory incompatible with modern transformer mechanics.

  **3. Architecture Invariance (The "Substrate" Test)**
  *   **Requirement:** The theory should identify representations that persist across minor architectural changes (e.g., reordering neurons, rotating bases) or training seeds, provided the function remains similar.
  *   **Motivation:** If a "representation" vanishes because you permuted the hidden layer neurons, it was an artifact of the coordinate system, not the computation. Representations should be properties of the *function*, not the specific *parameterization*.
  *   **Status:** **Non-Negotiable.** Otherwise, you are studying the random seed, not the network.

  **4. Non-Triviality (The "Hash Table" Test)**
  *   **Requirement:** The theory must distinguish between information that is *used* for generalization and information that is merely *stored* for lookup.
  *   **Motivation:** A hash table encodes keys and values perfectly. A neural network that memorizes the training set encodes the labels. Neither "represents" the concepts in a way that supports reasoning. A representation must support *inference* over the content, not just retrieval. The structure of the representation space must mirror the structure of the domain (e.g., analogies hold as vector arithmetic).
  *   **Status:** **Non-Negotiable.** This is the core difference between compression and cognition.

  ---

  ### II. Contested Desiderata (Camp Preferences)
  *These are often treated as requirements, but they reflect specific research goals (engineering vs. science) rather than ontological truths.*

  **5. Human Alignability (The "English" Test)**
  *   **Requirement:** The theory should map identified features to human-interpretable concepts (e.g., "dog," "positive sentiment").
  *   **Motivation:** This is the goal of *Interpretability for Safety*. We need to know if the model is lying or plotting.
  *   **Status:** **Preference.** This assumes the model's ontology matches ours. An "adequate account" of representation might reveal alien concepts that have no English label. Demanding human labels biases the theory against finding the *true* latent structure.
  *   **Tension:** Conflicts with **Non-Negotiable #2 (Superposition)**. Human concepts are often messy unions of multiple precise model features.

  **6. Locality (The "Where is it?" Test)**
  *   **Requirement:** The theory should be able to point to a specific location (layer, neuron, or subspace) where the representation resides.
  *   **Motivation:** Engineering utility. If we can't locate it, we can't edit it.
  *   **Status:** **Preference.** Representations might be path-dependent or distributed across the entire residual stream in a way that makes "location" a fuzzy concept. Insisting on strict locality might force a false discretization on a continuous process.

  **7. Discreteness (The "Feature" Test)**
  *   **Requirement:** The theory should output a discrete list of features (e.g., "Feature 492: Goldfinch").
  *   **Motivation:** Cognitive ease. Humans think in discrete categories. SAEs (Sparse Autoencoders) pursue this.
  *   **Status:** **Preference.** The underlying math is continuous. Forcing discreteness (via sparsity penalties) is a modeling choice, not necessarily a fact about the network. The "true" representation might be a dense, continuous manifold.

  **8. Completeness (The "100% Explanation" Test)**
  *   **Requirement:** The theory should explain all variance in the model's activations, not just the interpretable 10%.
  *   **Motivation:** Scientific rigor. If you only explain the "easy" features, you haven't explained the representation, you've explained the *interpretable subset* of the representation.
  *   **Status:** **Preference (but high stakes).** Current methods (like SAEs) struggle with "feature noise" or the "dark matter" of activations. A theory that admits it only explains 20% of the network is honest, but less useful for alignment.

  ---

  ### III. Specific Answers to Your Cases

  **1. Encoding vs. Representing (The Hash Table Line)**
  *   **The Criterion:** *Structure-Preserving Homomorphism.*
  *   **Explanation:** A hash table encodes data such that retrieval is exact but structural relationships (similarity, analogy, hierarchy) are destroyed (avalanche effect). A genuine representation preserves the *topology* of the input space. If "King - Man + Woman = Queen" works in the vector space, that is evidence of representation. If changing one bit scrambles the output, it's encoding.
  *   **Desideratum:** The theory must require that distances/angles in representation space correlate with semantic distances in the world.

  **2. Superposition & Polysemanticity**
  *   **The Verdict:** This does not break the representation story; it breaks the *localist* neuron story.
  *   **Requirement:** A theory must define representations as **directions in a subspace**, not activations of single units. If a neuron fires for "cats" and "existential dread," the theory must posit that these are two different *bases* or *contexts* in which that neuron participates. The "feature" is the sparse combination, not the neuron.
  *   **Desideratum:** The theory must allow for **context-dependent decoding**. The meaning of an activation vector depends on the subspace it is projected into.

  **3. Distributed vs. Localist**
  *   **The Verdict:** "Where" is a red herring if defined as "which neuron."
  *   **Requirement:** The theory must define location as a **subspace projection**. It doesn't matter if the feature is smeared across 100 neurons, provided there is a linear probe that can isolate it and an intervention that can modify it without collateral damage.
  *   **Desideratum:** Basis invariance. The representation exists if the *subspace* exists, regardless of the coordinate system (neuron ordering).

  **4. Causal Role vs. Structural Criteria**
  *   **The Verdict:** Structural is necessary, Causal is sufficient. You need both.
  *   **Requirement:**
      *   *Structural:* Can a linear probe read the info? (Necessary condition).
      *   *Causal:* Does intervening on that info change the output *specifically*? (Sufficient condition).
  *   **Why:** You can have structure without causality (read-only memory). You can have causality without structure (a kill switch). Representation requires the structure to *be* the cause.
  *   **Desideratum:** **Interventional Robustness.** Changing the representation value $v$ to $v'$ should change the output behavior $B$ to $B'$ in a way consistent with the semantic shift, *without* breaking the model's coherence (i.e., without triggering error states).

  ---

  ### IV. Tensions and No-Go Results

  Here is where you need to be careful. There are likely trade-offs that prevent a "Theory of Everything" for NN representations.

  **1. The Interpretability Triangle (No-Go)**
  You generally cannot maximize all three of the following simultaneously:
  *   **Fidelity:** Explaining 100% of the model's activation variance.
  *   **Sparsity/Discreteness:** Having a clean, discrete list of features (like an SAE).
  *   **Human Intelligibility:** Mapping those features to English concepts.
  *   *Conflict:* High fidelity often requires dense, distributed codes (violating Sparsity). High sparsity often leaves "dark matter" unexplained (violating Fidelity). High intelligibility forces you to ignore alien features the model actually uses (violating Fidelity).
  *   *Implication:* A theory must declare which corner of the triangle it prioritizes.

  **2. The Intervention Paradox (Tension)**
  *   **Conflict:** To prove a representation is causal, you must intervene. But intervening on a high-dimensional manifold often pushes the activation vector **off-manifold** (into regions the network never saw during training).
  *   *Result:* The network behaves unpredictably not because your theory is wrong, but because you broke the input distribution.
  *   *Implication:* A theory of representation must include a theory of the **valid intervention manifold**. You can't just demand "causal role" without specifying *how* to intervene without breaking the system.

  **3. Realism vs. Instrumentalism (Philosophical Tension)**
  *   **Conflict:**
      *   *Realist View:* The features exist "in" the network waiting to be found (like planets).
      *   *Instrumentalist View:* Features are tools *we* impose to predict the network (like latitude/longitude).
  *   *Result:* If you take the Realist view, polysemanticity is a bug to be solved. If you take the Instrumentalist view, polysemanticity is just a feature of our chosen basis.
  *   *Implication:* You cannot satisfy the demand for "The One True Basis" (Realism) while acknowledging that any basis can represent the vector space (Instrumentalism).

  ### V. Should You Be Asking a Different Question?

  Yes. Slightly.

  Asking "Do neural networks *really* have representations?" invites metaphysical bog-down.
  **Better Question:** "What is the **minimal abstraction** required to predict the model's behavior under **semantic interventions**?"

  This shifts the criteria from *ontological truth* to *predictive utility*.
  *   Instead of "Is this a real feature?", ask "If I treat this as a feature, can I predict the outcome of editing it?"
  *   Instead of "Where is the representation?", ask "What is the smallest subspace I need to control to change this behavior?"

  **Summary of the Scorecard:**
  1.  **Causal Efficacy:** Non-negotiable.
  2.  **Superposition Compatibility:** Non-negotiable.
  3.  **Architecture Invariance:** Non-negotiable.
  4.  **Structure Preservation (vs. Hashing):** Non-negotiable.
  5.  **Human Alignability:** Preference (Safety camp).
  6.  **Discreteness:** Preference (Mechanistic camp).
  7.  **Completeness:** Preference (Science camp).

  If a paper claims to have a theory of representation but ignores **Superposition** or **Causal Efficacy**, discard it. If it fails **Human Alignability**, it might still be good science, just bad safety engineering. If it claims to solve the **Interpretability Triangle**, check the math—they are likely overfitting.
