prompt: |-
  ok so i've been reading a bunch of interpretability papers and i keep seeing people argue past each other about whether neural networks "really have representations" or whether we're just projecting our own concepts onto matrices. before i go any further i want to nail down what the hell a theory of neural network representation is even supposed to do. like, what are the desiderata? what does an adequate account have to deliver?

  i want the full list of requirements — the cases it has to get right, the distinctions it can't collapse, the empirical facts about how modern NNs actually work that it can't contradict. for each requirement, give me the consideration or case that motivates it. then flag which ones are non-negotiable (any theory that fails here is dead) and which are more like preferences of particular camps.

  a few things i specifically want covered, though dont let these constrain you if there are other important ones:

  - the difference between merely encoding information and genuinely representing something (like, a hash table encodes but doesn't represent in the relevant sense — what's the line?)
  - what to do about superposition and polysemanticity — if a neuron fires for both cats and existential dread, does that break the representation story or just complicate it?
  - the fact that representations in NNs are distributed and not localist — does a theory need to say where a representation is, or is that a red herring?
  - whether the theory has to say something about how representations are used downstream (causal role) or whether structural/informational criteria are enough

  also: i want to know whether any pair of these desiderata are in tension or jointly unsatisfiable. if there's a no-go result lurking — like, you can't simultaneously satisfy the demand for discrete interpretable features and the demand to respect the geometry of activation space — i want that flagged explicitly.

  if the whole framing is confused and i should be asking a different question instead, say so. i'd rather get told i'm approaching it wrong than get a polite answer to a broken question.

  i'll do the scorecard myself later — i just want the criteria first.
reasoning: |-
