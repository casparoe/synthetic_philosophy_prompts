prompt: |-
  ok so for my gov class we've been doing political philosophy and i've ended up with this set of views and i want to know if they actually fit together before i turn in my final paper:

  (1) democracy is justified because it treats everyone as an equal, not because it gets the best results
  (2) if we could somehow give extra votes to people who actually understand the issues, we'd get better policy
  (3) but any real attempt at epistocracy would just hand power to the already-privileged, because "knowledgeable" would end up meaning "people like us"
  (4) a political system that consistantly makes bad decisions is failing, even if its procedures are perfectly fair
  (5) it's disrespectful to tell someone they don't get an equal say because they're uninformed

  i'm not sure where the problem is exactly but i have a feeling these don't all hang together. can you go through and tell me which pairs are actually in tension, which ones only look like they are, and rank the real tensions by how bad they are? and for each tension, say what the cheapest fix would be — which commitment i'd have to give up or modify.

  also, whatever verdict you reach about the worst tension, i want you to tell me what would change your mind about it. like, what argument or kind of evidence would make you flip your ranking or say the tension isn't real after all.
