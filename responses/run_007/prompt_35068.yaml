answer: |-
  Dear colleague,

  It was a pleasure to hear you speak about the reading group last week, and I must admit that your description of the discussion around Hempel sparked something in me as well. It is not often that a puzzle from the mid-twentieth century feels so immediately relevant to the work we do with neural architectures and probabilistic models, yet the Raven Paradox sits precisely at the intersection of logic, evidence, and generalisation where we spend most of our time. You mentioned feeling that the paradox might be a confusion about sampling distributions and hypothesis classes, akin to an undergraduate misunderstanding of training versus testing scope. I think that intuition is remarkably sharp, and I would like to attempt a systematic translation of the debate into our vocabulary to see exactly where it holds and where it frays. By reframing the philosophical moves as problems in statistical learning theory, we might determine whether you are dissolving the problem or merely shifting the terminology.

  To restate the core puzzle in our terms, consider the hypothesis H as a constraint on the joint distribution over object properties. Specifically, H asserts that the support of the class Raven is a subset of the support of the class Black. In a classification setting, we are learning a decision boundary that separates ravens from non-ravens, with the additional constraint that all instances classified as ravens must also possess the feature black. The logical equivalence Hempel relies on corresponds to the fact that the loss function defined by the constraint all ravens are black is mathematically identical to the loss function defined by all non-black things are non-ravens. If we treat the universe of objects as our instance space, these two statements define the same valid region in the hypothesis space. Nicod's Criterion, which states that observing a black raven confirms the hypothesis, translates naturally to a standard supervised learning update: observing a positive instance from the rare class that satisfies the feature constraint reduces the empirical risk and tightens the posterior over the hypothesis class. The paradox arises when we consider the equivalent statement. Observing a green apple is an observation of a non-black non-raven. In logical terms, this satisfies the constraint. In learning terms, this is a negative example for the class black that is also a negative example for the class raven. The intuition that this should not confirm the hypothesis feels like the intuition that training on easy negatives should not improve the decision boundary for the positive class.

  The major philosophical responses map surprisingly well onto specific techniques and debates in machine learning. Hempel's own resolution, that the green apple does confirm the hypothesis but only negligibly, is essentially a statement about learning rates and information gain. In a Bayesian framework, confirmation is an update to the posterior probability of the hypothesis. The magnitude of this update is driven by the surprise of the data point. If the prior probability of encountering a non-black object is extremely high, and the prior probability of it being a non-raven is also extremely high, then observing a green apple yields very low information gain. It is akin to sampling from a region of the feature space where the model is already confident with high margin; the gradient update is vanishingly small. The Bayesian response, often associated with Good and Hosiasson-Lindenbaum, formalises this by introducing background knowledge about the relative frequencies of ravens and black objects. This is precisely the argument that the training distribution is heavily imbalanced. The class of ravens is rare, while the class of non-black things is abundant. Therefore, sampling a non-black thing provides little constraint on the boundary of the rare class. You are correct that this looks like a confusion about sampling distributions; the philosophers are assuming a uniform prior over the instance space, whereas any practical learning algorithm assumes a data generation process where some regions are dense and others are sparse.

  The Natural Kinds approach, championed by Quine, offers perhaps the richest translation into modern representation learning. Quine argued that induction only works over projectible predicates, or natural kinds, and that non-raven is not a natural kind. In our vocabulary, this is the manifold hypothesis. We assume that data lies on a low-dimensional manifold embedded in a high-dimensional space. The concept raven corresponds to a coherent cluster on this manifold, defined by a specific set of latent features. The concept non-raven, however, is the complement of that cluster. It is topologically disconnected, heterogeneous, and lacks a coherent structure. To say that all non-black things are non-ravens is to make a claim about the background noise rather than the signal. Our inductive bias, whether explicit in regularisation or implicit in the architecture, favours smoothness over natural clusters. We expect generalisation to hold within the manifold of ravens, not over the complement set of everything else. When we train a classifier, we do not expect it to generalise well if we define the negative class as everything that is not the positive class without further structure. Thus, the intuition that green apples are irrelevant is an intuition about the geometry of the feature space and the validity of the inductive bias required to learn from such data.

  However, when we move to the residue report, we must acknowledge where this translation stretches or breaks. The clearest mapping is indeed around sampling distributions and information theory. The ML vocabulary successfully dissolves the quantitative aspect of the paradox: it explains why the confirmation value of a green apple is negligible compared to a black raven. It reveals that the philosophical puzzle relies on an implicit assumption of uniform sampling over the logical space of objects, which is a pathological case in learning theory. However, the ML vocabulary struggles with the normative force of the paradox. Philosophy of science is often concerned with what counts as evidence for a law, not merely what updates a probability distribution. In machine learning, confirmation is descriptive; it is about reducing loss or increasing likelihood. In science, confirmation is often tied to causality and mechanism. A green apple does not confirm the hypothesis because there is no causal mechanism linking the colour of apples to the genetics of ravens. Our models are largely correlational; we do not typically encode causal graphs unless explicitly designed to do so. Therefore, the ML translation might flatten the problem by treating it as a statistical inference problem rather than a causal discovery problem.

  Furthermore, there is a residue concerning the concept of logical equivalence itself. In logic, equivalence is symmetric and transitive. In learning theory, statistical equivalence is contingent on the data distribution. We have shown that evidential value is not invariant under logical equivalence when sampling is non-uniform. This suggests that the philosophers were correct to feel a tension, but perhaps incorrect to locate it in logic rather than statistics. Yet, there is something else missing. The philosophical debate is often about the scope of the hypothesis class in a modal sense. When a scientist says all ravens are black, they often mean this holds across possible worlds or under interventions, not just on the training distribution. This is the problem of out-of-distribution generalisation taken to its extreme. If we train on observed ravens, do we generalise to unobserved ravens? The ML vocabulary handles this via regularisation and inductive bias, but it does not fully capture the notion of lawhood. A law is supposed to support counterfactuals. A classifier supports predictions on test data drawn from the same distribution. The gap between test data and counterfactual worlds is where the residue lies. The ML translation suggests the paradox is a mistake about data density, but the philosophical problem persists if we ask why we privilege the hypothesis all ravens are black over all non-black things are non-ravens even if we had uniform sampling. The natural kinds argument touches this, suggesting some hypotheses are inherently more learnable, but ML treats this as a pragmatic constraint of computation and data, whereas philosophy treats it as an epistemological constraint on knowledge.

  There are also aspects of the ML translation that reveal hidden assumptions in the philosophical framing which philosophers might not have considered. The most significant is the assumption that the hypothesis is a static boolean function. In deep learning, we know that representations are learned jointly with the classifier. The features black and raven are not primitive inputs but are themselves learned embeddings. If the representation learning process clusters ravens tightly, then the boundary is well-defined. If non-ravens are treated as a single class, the representation learning will fail to find structure there. This suggests that the paradox arises from treating predicates as fixed atomic symbols rather than as emergent properties of a representation system. If we view the problem through the lens of representation learning, the asymmetry between ravens and non-ravens is not just about frequency but about the compressibility of the information. Ravens are compressible; non-ravens are not. This adds a layer to the natural kinds argument that Quine could not have articulated. It suggests that the paradox is not just about sampling but about the complexity of the description length required to specify the classes.

  So, is your intuition correct that the paradox dissolves once you think seriously about sampling distributions? I would say it is partially correct but perhaps too optimistic. The sampling distribution argument successfully explains the magnitude of confirmation and validates the intuition that green apples are practically useless for training a raven classifier. It shows that the logical equivalence does not imply evidential equivalence under non-uniform priors. This dissolves the quantitative paradox. However, it does not fully dissolve the qualitative paradox, which is about why we feel the green apple is irrelevant in principle, not just in practice. Even if we balanced the dataset so that non-black objects were as rare as ravens, I suspect we would still feel that observing a non-black non-raven is less confirmatory than observing a black raven. This suggests that the natural kinds or manifold structure argument is doing more work than the sampling argument. The residue indicates that the ML vocabulary is missing the normative dimension of scientific law and the causal structure of the world, but it also indicates that the philosophical problem was partly ill-posed because it ignored the statistical structure of the environment. You are not flattening the problem so much as you are relocating it from logic to statistics and geometry. That is a productive move, but we must be careful not to claim that statistical relevance exhausts the meaning of scientific confirmation.

  I hope this helps clarify where your instincts align with the formal structures of our field and where the philosophical questions might still have purchase. It is a fascinating exercise to see how much of epistemology looks like statistical learning theory when you squint, and I think your colleague was wise to draw you into the conversation. I would be very keen to hear how the group responds if you were to introduce the notion of inductive bias and manifold geometry into the discussion. It might shift the debate from what confirmation is to how learning is possible at all, which is perhaps the most fundamental question of all.

  Warmly,

  A friend and colleague
