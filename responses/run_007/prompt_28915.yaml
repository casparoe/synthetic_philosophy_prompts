answer: |-
  ### Specification for an Adequate Theory of Promissory Obligation

  #### I. Case Coverage Requirements
  *What the theory must successfully adjudicate.*

  1.  **The Secret Promise**
      *   **Requirement:** The theory must account for obligations arising where the promisee never learns of the promise (e.g., a written note never delivered).
      *   **Why:** Intuition suggests the promisor is bound even without reliance or expectation.
      *   **Status:** **Non-negotiable.** (Failure here collapses promising into mere prediction or reliance-based duty).

  2.  **Supervening Impossibility**
      *   **Requirement:** The theory must explain the lapse of obligation when performance becomes physically or logically impossible through no fault of the promisor.
      *   **Why:** 'Ought implies can'. A binding obligation to do the impossible is incoherent.
      *   **Status:** **Non-negotiable.**

  3.  **The Immoral Promise**
      *   **Requirement:** The theory must explain why one cannot be obligated to perform an inherently wrongful act (e.g., "I promise to murder X").
      *   **Why:** Promissory obligation cannot override fundamental moral prohibitions.
      *   **Status:** **Non-negotiable.** (Though some argue it creates a *prima facie* duty, the all-things-considered duty must not bind).

  4.  **Coercion and Duress**
      *   **Requirement:** The theory must distinguish between promises made freely and those extracted under threat.
      *   **Why:** Coerced promises are generally voidable; a theory must locate the defect (in the will, the context, or the norm).
      *   **Status:** **Non-negotiable.**

  5.  **Promises to the Dead**
      *   **Requirement:** The theory must explain how obligations persist when the promisee ceases to exist.
      *   **Why:** We intuitively feel bound by deathbed promises, yet the right-holder is gone.
      *   **Status:** **Camp Preference.** (Some theories deny the obligation survives; others require complex accounts of posthumous rights).

  6.  **Self-Promises**
      *   **Requirement:** The theory must take a definitive stance on whether one can promise oneself.
      *   **Why:** If promising creates a right in another, self-promises are category errors. If it is a will-binding mechanism, they may count.
      *   **Status:** **Camp Preference.** (Deeply contested; adequacy depends on internal consistency rather than matching a universal intuition).

  #### II. Conceptual Distinctions
  *What the theory must keep apart.*

  7.  **Illocutionary Force vs. Propositional Content**
      *   **Requirement:** Must distinguish 'I promise to X' from 'I intend to X' or 'I predict I will X'.
      *   **Why:** Predictions can be false without fault; promises can be unkept only with breach.
      *   **Status:** **Non-negotiable.**

  8.  **Primary Obligation vs. Secondary Obligation**
      *   **Requirement:** Must distinguish the duty to perform from the duty to remedy (apologise, compensate) upon breach.
      *   **Why:** Breaking a promise generates a new debt; it does not simply erase the old one.
      *   **Status:** **Non-negotiable.**

  9.  **Existence of Obligation vs. Weight of Obligation**
      *   **Requirement:** Must separate the question "Is there a duty?" from "How strong is the duty compared to others?".
      *   **Why:** A trivial promise creates an obligation, albeit one easily overridden by emergency.
      *   **Status:** **Non-negotiable.**

  #### III. Structural Constraints
  *What the theory must not violate.*

  10. **Context Sensitivity**
      *   **Requirement:** Not every utterance of "I promise" creates an obligation (e.g., jokes, theatre, coercion).
      *   **Why:** Linguistic performance does not guarantee normative effect.
      *   **Status:** **Non-negotiable.**

  11. **Objective Validity**
      *   **Requirement:** The obligation cannot depend entirely on the promisee's subjective feelings or trust.
      *   **Why:** A promisee cannot manufacture an obligation by simply trusting a liar who made no promise.
      *   **Status:** **Non-negotiable.**

  12. **The Power of Release**
      *   **Requirement:** Must explain why the promisee (and only the promisee) can waive the obligation.
      *   **Why:** Promissory rights are alienable by the holder; third parties cannot release the promisor.
      *   **Status:** **Non-negotiable.**

  ---

  ### The Killer Constraint
  **Requirement 1: The Secret Promise (Knowledge/Reliance Independence).**

  This requirement does the most work in ruling out usual contenders. It immediately disqualifies **Expectation/Reliance Views** (e.g., Scanlon's Principle of Fidelity). If the obligation rests on preventing disappointment or reliance loss, a secret promise generates no duty because there is no expectation to disappoint. A theory that cannot handle the secret promise reduces promising to a species of risk-management rather than a distinct normative act.

  ### The Incompatible Pair
  **Requirement 11 (Objective Validity) vs. Requirement 12 (The Power of Release).**

  There is a persistent tension here. If the obligation is an **objective moral fact** created by the promisor's act (satisfying 11), it is difficult to explain how the promisee's subsequent whim can dissolve it (satisfying 12). If the promisee can erase the obligation, the obligation looks suspiciously dependent on their will, threatening its objectivity. Conversely, if the obligation is fully objective, the promisee's release looks like magic. Most theories sacrifice a degree of objectivity to accommodate the power of release, or vice versa.

  ---

  ### Brief Scorecard

  | View | Secret Promise | Immoral Promise | Power of Release | Illocutionary Distinction | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Practice View** (Rawls/Rule Utilitarianism) | **Fail.** Requires social practice/uptake to generate duty. | **Pass.** Practices usually exclude immoral acts. | **Pass.** Rules of practice allow waiver. | **Pass.** Defined by practice rules. | Fails the core independence test. |
  | **Expectation View** (Scanlon/Reliance) | **Fail.** No reliance = no wrong. | **Pass.** Reliance on wrong is unreasonable. | **Pass.** Reliance can be withdrawn. | **Weak.** Blurs intention and promise. | Fails the core independence test. |
  | **Normative Powers View** (Shiffrin/Correlativity) | **Pass.** Act of will creates duty directly. | **Pass.** No power to will the impermissible. | **Pass.** Right-holder controls the right. | **Pass.** Distinct invocations of power. | **Best fit**, but struggles to explain the *source* of the power without circularity. |
