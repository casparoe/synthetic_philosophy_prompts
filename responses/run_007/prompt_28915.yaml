      *   *Selection:* The tension between **Normative Sovereignty** (I create the obligation) and **Content Constraints** (I can't create an obligation to do wrong). Or, more classically, **Reliance/Expectation** vs **Secret Promises**.
      *   *Better Tension:* **The Power of Release** vs **Objective Obligation**. If the obligation is objective/moral, how can a mere whim of the promisee dissolve it? This is the "Normative Control" problem.

