          *   Impossibility (supervening impossibility).
          *   Coercion/Duress (promises under pressure).
          *   Immoral promises (promises to do wrong).
          *   Promises to the dead.
          *   Self-promises (do they count?).
      *   *Distinctions to maintain:*
          *   Promising vs. Predicting/Intending.
          *   Obligation existence vs. Obligation weight.
          *   Breaking vs. Remedying (secondary obligations).
      *   *Constraints to respect:*
          *   Context/Content sensitivity (not every "I promise" binds).
          *   Objectivity (not solely dependent on promisee's feelings).
          *   Explanation of Release/Uptake (why they matter).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Secret Promise.* A theory must explain obligation without reliance on actual reliance or knowledge. *Status:* Non-negotiable (standard intuition).
      *   *Requirement 2: The 'Ought Implies Can' Constraint.* Must handle impossibility. If it becomes impossible, the primary obligation lapses or changes. *Status:* Non-negotiable.
      *   *Requirement 3: The Illocutionary Distinction.* Must distinguish 'I promise' from 'I intend'. *Status:* Non-negotiable.
      *   *Requirement 4: The Normative Independence.* Obligation shouldn't depend entirely on the promisee's subjective state (feelings). *Status:* Non-negotiable.
      *   *Requirement 5: The Content Constraint.* Cannot bind one to do the impermissible. *Status:* Non-negotiable (mostly, though some argue for *prima facie* duty). Let's call it Non-negotiable that it doesn't create a *binding* duty to do wrong.
      *   *Requirement 6: The Power of Release.* Must explain how the promisee can waive the right. *Status:* Non-negotiable.
      *   *Requirement 7: Secondary Obligations.* Distinguish between the breach and the duty of repair. *Status:* Non-negotiable.
      *   *Requirement 8: Self-Promises.* Must take a stance (usually that they are different or non-existent). *Status:* Camp Preference (contested).
      *   *Requirement 9: Dead Promises.* Must explain persistence after death. *Status:* Camp Preference (some theories struggle here).

      *Refining for the "Spec" feel:* Group them logically. Cases, Distinctions, Constraints.

  4.  **Identifying the "Killer Constraint":**
      *   What rules out the most theories?
      *   *Expectation/Reliance views* fail on Secret Promises.
      *   *Practice/Rule views* struggle with Content Constraints or specific context.
      *   *Normative Powers* handle most but struggle with the *source* of the power.
      *   *Decision:* The **Secret Promise** requirement is the classic hammer against Reliance/Expectation theories. However, the **Content Constraint** (immoral promises) is also strong. But the prompt asks for the *single* requirement doing the most work ruling out *usual contenders*. The Secret Promise is the standard philosophical wedge. Let's go with the **Secret Promise (Knowledge/Reliance Independence)**.

  5.  **Identifying Incompatible Pairs:**
