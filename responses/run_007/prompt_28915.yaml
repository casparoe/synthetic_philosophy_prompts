prompt: |-
  im after a spec, not another survey. before i read any more about why promises bind, i want the requirements list: what does a theory of promissory obligation actually have to deliver to count as adequate. cover the cases it has to get right (promises the promisee never learns about, promises that become impossible, promises made under pressure, promises to do something you shouldnt do anyway, promises to the dead, promises to yourself if those count), the distinctions it cant collapse (promising vs predicting or stating an intention, the obligation created vs how weighty it is, breaking vs needing to make it right afterward), and any constraints it has to respect (it shouldnt make every utterance of "i promise" binding regardless of content or context, it shouldnt make the obligation depend entirely on how the promisee feels, it should explain why release or uptake matters at all). for each requirement say why its a requirement and whether its non-negotiable or just one camps preference. then tell me which single requirement does the most work ruling out the usual contenders, and flag any pair of requirements you suspect cant be jointly met. a short scorecard of the practice, expectation, and normative-powers views against the list is fine but keep it brief. answer in British English.
reasoning: |-
