  This is a rigorous and well-structured reconstruction of a classic problem in population ethics (often associated with Parfit, Narveson, and McMahan). You have correctly identified that the Procreation Asymmetry is difficult to ground without appearing ad hoc.

  To preserve the asymmetry without treating it as a brute primitive, you should reject **Step (2)**.

  Here is the detailed analysis of why this is the best point of rejection, how to ground the rejection, and what it costs you.

  ### The Recommendation: Reject Step (2)

  **Step (2) claims:** *If the reason is person-affecting (bad for her $\rightarrow$ don't create), then by parity, (good for her $\rightarrow$ create).*

  **Why reject it:** This step assumes that the moral logic of "harm" and "benefit" is symmetric regarding contingent existence. Most defenders of the asymmetry argue that it is not. You can reject the inference that "existence would be good for her" generates a *moral reason to create her* in the same way that "existence would be bad for her" generates a *moral reason not to create her*.

  **The Grounding (The Person-Affecting Restriction):**
  To ground this rejection without brute stipulation, you appeal to the **logic of moral claims**.
  1.  **Harm:** If you create a miserable person, you have created a subject who now has a complaint against you. They exist, they suffer, and their existence is attributable to your action. There is a *victim* to whom you owe a duty of non-maleficence.
  2.  **Benefit:** If you do not create a happy person, there is no subject who suffers a loss. There is no one *to whom* the benefit is owed. A duty of beneficence requires a beneficiary; in the case of non-procreation, the potential beneficiary is absent.

  This grounds the asymmetry in the **necessary conditions for moral standing**. We have duties *to* people, but we do not have duties to bring people *into existence* for their own sake, because "their sake" presupposes their existence.

  ### The Cost of Rejecting Step (2)

  Rejecting this step saves the asymmetry, but it forces you to confront two significant philosophical costs:

  **1. The Non-Identity Problem**
  If you argue that we have no reason to create happy people because there is no subject to be benefited, you must explain why it is permissible to create a child who will have a *less* happy life when you could have created a *different* child who would have a *happier* life.
  *   **The Problem:** Since the children are different people (due to different conception times/conditions), the first child is not harmed by being created (their life is still worth living). But intuitively, we seem to have a reason to choose the happier child.
  *   **The Cost:** You must develop a "Same Number Quality Claim" or a "Person-Affecting Restriction" that is sophisticated enough to handle this without collapsing back into impersonal utilitarianism. (See: Derek Parfit's *Reasons and Persons* or Jeff McMahan's work on the Non-Identity Problem).

  **2. The "No Subject" Metaphysics**
  You must accept a controversial metaphysical claim about benefit and harm. You are asserting that "benefit" requires a pre-existing subject, whereas "harm" can be constituted by the act of bringing a suffering subject into existence.
  *   **The Cost:** Critics will argue this is inconsistent. If existence can be "bad for" someone (grounding the reason not to create), why can it not be "good for" someone (grounding the reason to create)? You must argue that "bad for" functions as a **defeater** (a veto), while "good for" functions as an **optimizer** (a bonus), and that morality is driven primarily by veto-powers rather than optimization in this context.

  ### An Alternative: Reject Step (1)

  If you find the costs of rejecting Step (2) too high (specifically the Non-Identity vulnerabilities), there is a more structural move available: **Reject Step (1).**

  **Step (1) claims:** *Reasons must be either person-affecting (welfare) or impersonal.*

  **The Alternative Grounding (Contractualism):**
  You can argue that moral reasons are grounded in **justifiability to others** (following T.M. Scanlon or Seana Shiffrin).
  *   **Grounding:** An action is wrong if it violates principles that no one could reasonably reject.
  *   **Application:** A miserable person can reasonably reject a principle that allows them to be created into misery. A happy person *cannot* reasonably reject a principle that allows them not to be created, because non-existence is not a loss *to them* (there is no "them" to experience the loss).
  *   **Advantage:** This grounds the asymmetry in the **logic of justification** rather than welfare calculus. It explains *why* the valence is asymmetric without calling it a brute fact.

  **The Cost:**
  *   You must abandon **welfarism** (the idea that welfare is the only thing that matters morally).
  *   You must accept that moral status is tied to the capacity for reasonable rejection, which creates complex edge cases regarding embryos, fetuses, or severely cognitively impaired individuals.

  ### Summary

  To maintain the asymmetry without treating it as a brute primitive:

  1.  **Primary Move:** Reject **Step (2)**. Argue that the moral logic of harm (non-maleficence) applies to creation, but the moral logic of benefit (beneficence) does not generate an obligation to create, because duties require existing claimants.
  2.  **Secondary Move (if you want deeper grounding):** Reject **Step (1)**. Adopt a **Contractualist** framework where the asymmetry is derived from the conditions of justifiability rather than welfare sums.

  **My advice:** Start by rejecting **Step (2)**. It preserves your intuition that morality is about people's welfare (keeping you close to your original framework) while blocking the symmetry argument. Be prepared, however, to refine your definition of "harm" to handle the Non-Identity Problem.
