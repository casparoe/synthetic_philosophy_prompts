  **Top Tier: Field-style Deflationism**
  Field earns the most explanatory keep by extending the disquotational schema to account for the *normative* role of truth in assertion and its logical function in preserving warrant, which the T-schema alone does not dictate. This adds a load-bearing layer regarding the role of truth in reasoning that pure equivalence theories lack.

  **Middle Tier: Horwich-style Minimalism and Prosententialism**
  Horwich explains the *utility* of the concept (expressing generalizations) while Prosententialism provides a semantic *mechanism* (anaphora) for truth-ascriptions, but both largely remain within the bounds of the equivalence intuition. Their differences are often load-bearing only in specific linguistic contexts (Prosententialism) or metaphysical framing (Horwich), rather than offering substantial new explanatory resources.

  **Bottom Tier: Redundancy Theory**
  Ramsey's theory treats truth as strictly eliminable, dissolving the phenomenon rather than explaining its function in reasoning, generalization, or semantic ascent. It offers the least independent explanatory work because it denies the predicate has any function that requires a positive theory beyond deletion.
