  A final-exam essay question for this seminar on the topic of epistemic closure and Nozick's tracking theory. The question should be unanswerable by simply reciting what the tracking conditions are or summarizing the brain-in-a-vat example. It should force students to confront whether Nozick's denial of closure is a feature of the theory or a fatal flaw, and to engage with the deepest considerations on both sides. The question should take a strong student about 45 minutes to answer.

  Then provide:

  1. A model answer of roughly 600–700 words that an A-level student might produce.

  2. A marking scheme built around six must-hit points, each worth a specified number of marks (total 20). For each point, include a one-sentence note on how weaker answers typically get it wrong — e.g. by confusing sensitivity with safety, by treating the closure principle as obviously non-negotiable without argument, or by failing to distinguish different formulations of closure. The marking scheme should also include a brief paragraph at the end explaining what separates an A answer (roughly 17–20 marks) from a B answer (roughly 13–16 marks) in terms of the quality of argument and integration of the points, not just their presence.

  The question, model answer, and marking scheme should all be usable as-is in a real course.
