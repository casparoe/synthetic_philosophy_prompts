  3. Anticipate the misconception that the argument claims science makes no progress, and head it off by clarifying that PMI targets ontological commitment rather than predictive utility. You must explicitly distinguish between a theory working instrumentally and its central terms actually referring to real entities.
  4. Make sure the audience accepts that past theories were genuinely successful before arguing they were false, because the induction collapses if the premises are weak. This ordering ensures they see the force of the dilemma before you draw the pessimistic conclusion about current science.
  5. Conclude by posing the question of whether a realist can accept the historical data without accepting the pessimistic conclusion, forcing them to identify where the inference might break. This question tests if they grasp that the PMI is an inductive challenge to the link between success and truth, not merely a list of false theories.
