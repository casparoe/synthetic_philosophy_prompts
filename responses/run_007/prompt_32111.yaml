answer: |-
  ### The Normative Architecture of Fairness Criteria

  Your professor's question cuts to the heart of the matter: the impossibility theorems (Chouldechova 2017; Kleinberg et al. 2016) are not merely technical roadblocks; they are proofs of **normative incompatibility**. They demonstrate that the ethical intuitions we hold about fairness pull in opposite directions when the world is imperfect and unequal.

  To answer "What do you actually want?", you must stop treating fairness criteria as statistical switches and start treating them as **operationalizations of ethical commitments**. Below is a set of desiderata for an adequate fairness criterion. These are not the metrics themselves (like "equalized odds"), but the *requirements* any metric must satisfy to be morally and practically viable.

  ---

  ### Part I: The Desiderata

  Here are five requirements for a fairness criterion. Each includes the motivating ethical consideration and a classification of its status (Non-Negotiable vs. Contestable).

  #### 1. Predictive Truthfulness (Calibration)
  *   **Definition:** A risk score assigned by the system must carry the same probabilistic meaning regardless of group membership. If the system assigns a risk score of 0.8 to members of Group A and Group B, the actual probability of the outcome must be 0.8 for both.
  *   **Motivation:** This is a requirement of **honesty and utility**. If a score means "80% risk" for one group but "40% risk" for another, the system is lying to the decision-maker. This undermines trust and leads to inefficient resource allocation (e.g., denying loans to low-risk individuals because their risk was overestimated).
  *   **Status:** **Contestable.** While vital for utility, some argue that in contexts of historical oppression, "truthfulness" to biased data perpetuates injustice. Affirmative action frameworks often explicitly sacrifice predictive truthfulness to achieve social goals.

  #### 2. Error Burden Equality (Equalized Odds)
  *   **Definition:** The rates of false positives and false negatives should be equal across groups. The pain of being wrongly rejected (false negative) or wrongly flagged (false positive) should not fall disproportionately on a protected class.
  *   **Motivation:** This is a requirement of **procedural justice**. It asserts that the *process* of classification should not be more error-prone for one group than another. It protects groups from bearing the brunt of the system's imperfection.
  *   **Status:** **Contestable.** This assumes that false positives and false negatives are equally bad, or at least that their relative badness is constant across groups. In reality, a false positive in policing (jail) is vastly different from a false positive in advertising (spam).

  #### 3. Access Equality (Demographic Parity)
  *   **Definition:** The rate of positive outcomes (loans approved, hires made) should be independent of group membership.
  *   **Motivation:** This is a requirement of **distributive equity**. It focuses on the end-state distribution of resources. The motivating case is that historical structural barriers have depressed base rates; therefore, equalizing outcomes is necessary to correct for past exclusion, regardless of current predictive statistics.
  *   **Status:** **Contestable.** This is the most polarized desideratum. Critics argue it ignores qualification differences and forces quota-like systems; proponents argue it is the only way to break cycles of disadvantage.

  #### 4. Individual Consistency
  *   **Definition:** Two individuals who are similar with respect to the task-relevant features should receive similar outcomes, regardless of their group membership.
  *   **Motivation:** This is a requirement of **individual rights**. It prevents the "sacrifice" of specific individuals for the sake of group statistics. It ensures that fairness is not just a population-level property but respects the individual standing before the algorithm.
  *   **Status:** **Contestable (but strong).** While intuitively appealing, strict individual fairness requires a perfect similarity metric, which is often unavailable. Furthermore, group fairness advocates argue that treating "similar" individuals the same ignores the contextual differences of their group membership (e.g., a credit score of 650 may reflect different economic realities for different groups).

  #### 5. Harm Sensitivity (Contextual Proportionality)
  *   **Definition:** The criterion must allow for the weighting of errors based on the specific harm they cause in the deployment domain.
  *   **Motivation:** This is a requirement of **consequentialism**. A fairness criterion that treats a false positive in a movie recommendation system the same as a false positive in a pre-trial risk assessment is morally blind.
  *   **Status:** **Non-Negotiable.** Any criterion that cannot distinguish between high-stakes and low-stakes errors is disqualified from being a *fairness* criterion. It may be a statistical constraint, but it is not an ethical one.

  ---

  ### Part II: Disqualification Conditions

  Before scoring existing criteria, we must establish what disqualifies a proposal from counting as a fairness criterion at all. A proposal is disqualified if:

  1.  **It Requires Perfection:** If the criterion can only be satisfied when the predictor is perfect (AUC = 1), it is useless for real-world ML. (This disqualifies any definition that demands simultaneous satisfaction of Truthfulness, Error Equality, and Access Equality without acknowledging trade-offs).
  2.  **It Ignores Base Rate Sensitivity:** If the criterion assumes base rates are identical across groups without justification, it is empirically fragile. It must explicitly state how it handles differing prevalences.
  3.  **It Amplifies Net Harm:** If satisfying the criterion demonstrably increases the total amount of severe harm (e.g., violent crime, destitution) compared to a baseline, without a compensating justice benefit, it fails the Harm Sensitivity desideratum.

  ---

  ### Part III: The Incompatibility Core

  This is the analytical heart of your seminar. The impossibility results are not just about equations; they map directly onto the clash between the desiderata above.

  **The Impossible Triangle:**
  Given an imperfect predictor and differing base rates between groups, you cannot simultaneously satisfy **Predictive Truthfulness (D1)**, **Error Burden Equality (D2)**, and **Access Equality (D3)**.

  *   **Conflict A (Truthfulness vs. Error Equality):** If you enforce Calibration (D1) and Base Rates differ, you *mathematically cannot* have Equal False Positive and False Negative Rates (D2). One group will inevitably suffer more errors.
      *   *Ethical Trade-off:* Do you value the score meaning the same thing for everyone (D1), or do you value the errors being shared equally (D2)?
  *   **Conflict B (Error Equality vs. Access Equality):** If you enforce Equalized Odds (D2) and Base Rates differ, you *mathematically cannot* have Demographic Parity (D3). The selection rates will diverge.
      *   *Ethical Trade-off:* Do you value equal error rates (D2), or do you value equal representation in outcomes (D3)?
  *   **Conflict C (Truthfulness vs. Access Equality):** If you enforce Calibration (D1) and Demographic Parity (D3), you generally cannot satisfy Error Burden Equality (D2), and you may need to distort the prediction function significantly.
      *   *Ethical Trade-off:* Do you value accurate risk assessment (D1), or do you value equal distribution of benefits (D3)?

  **The Role of Individual Consistency (D4):**
  Individual consistency often conflicts with **Access Equality (D3)**. If Group A has a higher base rate of positive outcomes than Group B, enforcing Access Equality requires treating some individuals in Group A differently from "similar" individuals in Group B to balance the totals.

  **The Non-Negotiable Constraint:**
  **Harm Sensitivity (D5)** is the arbiter. Since you cannot satisfy D1, D2, and D3 simultaneously, you must choose the pair that minimizes the specific harm of your context.
  *   *In Lending:* False Negatives (denying a good loan) cause economic exclusion. You might prioritize **Access Equality (D3)** over **Truthfulness (D1)**.
  *   *In Pre-trial Detention:* False Positives (detaining someone innocent) cause loss of liberty. You might prioritize **Error Burden Equality (D2)** (specifically low FPR) over **Access Equality (D3)**.

  ---

  ### Part IV: Scoring the Major Families

  Here is how the standard families of criteria score against the desiderata. Note that no criterion scores "Yes" on the Impossible Triangle (D1, D2, D3) simultaneously.

  | Criterion Family | Predictive Truthfulness (D1) | Error Burden Equality (D2) | Access Equality (D3) | Individual Consistency (D4) | Harm Sensitivity (D5) |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Calibration-Based**<br>(e.g., Kleinberg et al.) | **Yes** | **No** (Fails if base rates differ) | **No** (Outcomes diverge) | **Yes** (Generally) | **Low** (Focuses on score meaning, not error cost) |
  | **Equalized Odds**<br>(e.g., Hardt et al.) | **No** (Requires distorting scores) | **Yes** (By definition) | **No** (Selection rates differ) | **Mixed** (May treat similar individuals differently to balance errors) | **Medium** (Balances errors, but assumes symmetry) |
  | **Demographic Parity**<br>(e.g., Zafar et al.) | **No** (Often sacrifices accuracy) | **No** (Error rates usually diverge) | **Yes** (By definition) | **No** (Explicitly uses group membership to adjust outcomes) | **High** (If the harm is defined as exclusion) |
  | **Individual Fairness**<br>(e.g., Dwork et al.) | **Yes** (Preserves metric) | **No** (Group errors may differ) | **No** (Outcomes follow base rates) | **Yes** (By definition) | **Medium** (Depends on the similarity metric) |

  ### Conclusion: Answering the Professor

  When your professor asks, "What do you actually want?", the answer is not a statistical metric. The answer is a **prioritization of harms**.

  You want a fairness criterion that:
  1.  **Acknowledges the Impossibility:** It explicitly states which of the Impossible Triangle (Truthfulness, Error Equality, Access Equality) it is sacrificing.
  2.  **Satisfies Harm Sensitivity (D5):** It prioritizes the desideratum that mitigates the most severe harm in your specific domain (e.g., liberty vs. profit).
  3.  **Remains Operational:** It does not require perfect prediction.

  **The Verdict:**
  *   If the cost of a False Positive is **loss of liberty** (policing, bail), you want **Error Burden Equality (D2)**, specifically bounding the False Positive Rate. You sacrifice Calibration and Access Equality.
  *   If the cost of a False Negative is **exclusion from opportunity** (lending, hiring), you want **Access Equality (D3)** or **False Negative Rate Balance**. You sacrifice Calibration and potentially increase False Positives.
  *   If the cost is **misallocation of resources** (medical triage), you want **Predictive Truthfulness (D1)**. You accept that error rates and access will differ by group because the risk itself differs.

  There is no "fair" algorithm in the abstract. There is only an algorithm that is fair *with respect to a specific hierarchy of values*. Your job is to define that hierarchy before you choose the math.
