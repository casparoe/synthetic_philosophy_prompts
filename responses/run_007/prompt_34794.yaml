      *   **Core Claim:** The user believes that if two translation manuals agree on all observation sentences (truth conditions), they are not genuinely rival manuals but merely notational variants. Therefore, "Gavagai" is a problem for *reference* (metaphysics/ontology) but not for *meaning* (translation/communication).
