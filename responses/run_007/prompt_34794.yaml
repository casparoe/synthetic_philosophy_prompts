      *   *Step 2 (Indeterminacy of Translation):* Because reference is unsettled, we can construct different translation manuals that map "Gavagai" to different English terms ("rabbit" vs. "undetached rabbit part").
      *   *Step 3 (Rivalry):* These manuals are empirically equivalent (save all observations) but logically incompatible (say different things about the world). Thus, there is no fact of the matter about which is right.
      *   *Quine's Assumption:* Translation requires mapping terms to terms (or predicates to predicates) in a way that preserves reference *independently* of the sentence context, or at least that differences in term mapping constitute genuine differences in the manual.

