      *   *Key Distinction:* Reference (ontology) vs. Truth Conditions (meaning/communication).
      *   *Holism:* Meaning is determined at the sentence level (Fregean context principle). If sentence truth conditions are fixed, meaning is fixed.
      *   *Notational Variants:* Manuals that differ only on term reference but agree on sentence truth conditions are merely using different ontological frameworks to say the same thing. They are compatible, not rival.
      *   *Critique of Quine:* Quine treats translation manuals as if they must preserve *reference* to be correct, rather than preserving *assertibility conditions*. He reifies the "term-to-term" mapping as a fact of the matter, which contradicts his own holism.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the strength of Quine's initial move (Inscrutability) but challenge the second move (Indeterminacy). State the thesis: Reference is metaphysical, Meaning is pragmatic/linguistic.
      *   **Point 1: The Primacy of the Sentence (Fregean Holism):** Quine claims to be a holist, but his Gavagai argument smuggles in atomism. Meaning resides in the sentence's truth conditions, not the term's extension. If "Lo, a rabbit" and "Lo, an undetached rabbit part" are triggered by the exact same stimuli in all contexts, they function identically in the language.
      *   **Point 2: Compensatory Adjustments (The "Proxy Function"):** Quine himself discusses proxy functions. If you change the reference of "gavagai" to "rabbit part," you must change the reference of "is the same as" (identity) to "goes with the same rabbit as." If you do this systematically, the *truth values of sentences* remain unchanged.
      *   **Point 3: Rivalry vs. Equivalence:** For two manuals to be genuinely indeterminate (rival), they must disagree on the truth of some sentence. If Manual A says "Gavagai = Rabbit" and Manual B says "Gavagai = Rabbit Part," but both translate "Gavagai" as "There is a rabbit" in practice, they agree on all *observable facts*. The difference is purely ontological, not linguistic.
