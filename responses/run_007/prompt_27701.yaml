answer: |-
  This is a classic and very sharp objection. You have essentially reconstructed the **"Indeterminacy of Selection"** argument, which has haunted etiological accounts (like those of Millikan and Neander) since the 1980s. It feels compelling because it exploits the gap between the *ontology* of selection (what actually happened) and the *epistemology* of reconstruction (what we can know).

  However, you don't need to abandon the etiological account. To save it, you should reject **Premise (5)**, and consequently **Premise (4)**.

  Here is the breakdown of why (5) is the weak link, how the etiological account handles the "bundling" problem, and what the cost of this move is.

  ### The Target: Premise (5)
  > *(5) ...this requires us to hold everything else equal while varying one effect — which is biologically unrealistic, since you can't vary the heart's pumping without varying its sounds, its hormone production, etc.*

  This premise asserts a metaphysical or biological necessity: that the effects are *necessarily* bundled such that selection cannot distinguish them. This is false.

  **1. Correlation vs. Causal Contribution**
  Selection does not select for *correlations*; it selects for *causal contributions* to fitness. Even if pumping and thumping are 100% correlated in the actual history of hearts, they are not causally equivalent.
  *   **Pumping** causes oxygenation, which causes survival.
  *   **Thumping** is a byproduct of valve closure and fluid dynamics. It does not cause survival.

  The etiological account relies on a counterfactual analysis of *causal relevance*, not just statistical correlation. The relevant counterfactual is not "Can we imagine a heart that pumps without sound?" (which might be physically difficult), but rather: **"If the sound occurred without the pumping, would it confer fitness?"** and **"If the pumping occurred without the sound, would it confer fitness?"**

  Since the answer is "No" to the first and "Yes" to the second, the selection pressure is *for* pumping. The sound is a "free rider" (to use Elliot Sober's terminology). Selection can distinguish between a trait that *causes* fitness and a trait that is merely *correlated* with the cause of fitness, even if they are currently bundled.

  **2. Variation Over Time**
  Premise (5) assumes a static snapshot of the heart. But selection operates over deep time across a population. While *current* hearts might bundle pumping and thumping tightly, evolutionary history is full of variation.
  *   There may have been ancestral variations where valve mechanics differed (changing the sound) without compromising flow.
  *   There may be future variations (e.g., artificial hearts) that pump silently.

  The etiological account looks at the *history* of the trait. If, across the lineage, variations in pumping capacity tracked with fitness variations, while variations in acoustic profile did not, then pumping is the function. The fact that they are bundled *now* does not mean they were indistinguishable to selection *then*.

  ### The Supporting Error: Premise (4)
  > *(4) ...The question... presupposes we can disentangle which effects drove selection. But natural selection doesn't come with labels.*

  This premise conflates **epistemology** with **ontology**.
  *   **Ontology:** Is there a fact of the matter about which effect drove selection? The etiological theorist says **Yes**. The causal structure of the world determines whether the pumping or the thumping saved the organism's life.
  *   **Epistemology:** Is it easy for *us* to figure that out? The etiological theorist admits **No**.

  Your argument suggests that because *we* lack labels, *nature* lacks distinction. But nature doesn't need labels. Causal mechanisms are distinct even if we struggle to disentangle them. Just because a crime scene investigator finds it hard to determine which bullet killed the victim doesn't mean there is no fact of the matter about which bullet was lethal.

  ### The Cost of Rejecting (5) and (4)

  If you reject these premises to save the etiological account, you incur three specific costs. You need to be prepared to defend these in your seminar:

  **1. Empirical Fallibility**
  You must admit that function ascriptions are empirical hypotheses that could turn out to be wrong. We *think* the heart's function is pumping, but if future comparative biology showed that ancient hearts were actually selected for hormonal secretion (with pumping as a side effect), we would have to update our function ascription. Function is not armchair knowledge; it is biological history.

  **2. The Problem of "Perfect Correlation"**
  There is a lingering philosophical worry: What if two effects *were* perfectly correlated throughout the entire evolutionary history of a trait? (e.g., a gene that necessarily causes both Trait A and Trait B via pleiotropy, and both contribute equally to fitness).
  *   **The Cost:** In cases of perfect, inseparable pleiotropy, the etiological account might have to say **both** are functions.
  *   **The Defense:** This is actually a feature, not a bug. If a trait was genuinely maintained by two distinct fitness benefits, it has two functions. The problem only arises if you insist one *must* be the "real" function. The etiological account allows for multifunctionality.

  **3. Reliance on "Selection-For" vs. "Selection-Of"**
  You must commit to Elliot Sober's distinction. Selection *of* the organism (the whole bundle) happens, but selection *for* a specific trait (the causal driver) is what grounds function. Defending this requires a robust theory of causal explanation in biology. You are signing up for the view that causal relevance is objective, not just a heuristic we impose.

  ### Why This Saves the "Nose/Glasses" Intuition

  You mentioned you don't want to lose the etiological advantage regarding the nose. Rejecting (5) preserves this advantage perfectly.

  *   **Nose/Glasses:** Holding up glasses is a causal role (Causal-Role account says it's a function). But historically, noses were not selected *for* holding glasses. The causal contribution of holding glasses to ancestral fitness was zero. The etiological account correctly identifies this as an accident.
  *   **Heart/Thump:** Thumping is a causal role. But historically, hearts were not selected *for* thumping. The causal contribution of thumping to ancestral fitness was zero (it was a byproduct of the pumping mechanism).

  In both cases, the etiological account uses the **history of causal contribution** to filter out accidents. Your argument in (5) tried to claim that history *cannot* distinguish contribution from byproduct. By rejecting (5), you reaffirm that history *does* distinguish them based on causal pathways, even if the effects are currently bundled.

  ### Summary for Your Seminar

  To escape the corner:
  1.  **Reject Premise (5).** Variation and causal disentanglement are biologically possible over evolutionary time, even if traits are bundled in the present.
  2.  **Clarify Premise (4).** Distinguish the *fact* of selection (ontology) from our *reconstruction* of it (epistemology). The etiological account is a claim about the fact.
  3.  **Accept the Cost.** Admit that function ascriptions are empirical claims subject to revision based on biological data, not conceptual truths.

  This allows you to keep the etiological account's greatest strength (ruling out accidental benefits like glasses-holding) while answering the "bundling" objection by appealing to **causal relevance** rather than mere correlation.
