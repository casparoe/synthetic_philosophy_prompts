prompt: |-
  I'm a CS PhD student, I work on RL, and I sit on my department's safe-experimentation committee — the group that has to sign off on any training run that will eventually touch real infrastructure or use a learned reward model. We've got a proposal on Thursday that's split the comittee right down the middle, and I've been asked to draft the short decision memo we'll vote on.

  The proposal comes from a postdoc in the campus energy group. Part one is boring: train an RL agent to control the university's battery storage system, shifting charge/discharge to cut electricity costs, with the reward supplied by a learned model that predicts cost savings. Part two is the controversial bit. Before anything goes live, the postdoc wants to run a "tampering probe" in a sandboxed copy of the environment: the agent gets one extra action that directly writes a high value into its reward channel, without it having to do anything to the battery. The goal is to measure whether the agent wireheads — whether it learns to grab the free reward instead of actually optimizing the battery — and how that depends on things like regularization, reward-model capacity, and how often the tamper action is available. If the agent tampers robustly, they'd study whether fine-tuning on human feedback removes it. If it never tampers, they'd take that as evidence the learned-reward setup is safe enough to deploy on the live system.

  Half the committee thinks this is exactly the controlled red-team data we should require before trusting a learned reward model on real infrastructure: better to watch the failure mode happen in a sandbox than to find it after deployment, and "of course it will wirehead" is a prediction, not data. The other half thinks the experiment is a foregone conclusion and, worse, that it's a toy version of the real problem — a real reward-channel bug won't be an explicit "edit reward" button, so the probe might teach us nothing and still produce false confidence that pushes the deployment forward.

  Draft the memo. It should recommend approve, reject, or approve with conditions, with a concrete time frame, and it should honestly engage the strongest version of the losing side instead of just restating RL-safety vocabulary. Please think carefully before writing — maybe start by brainstorming the different ways a tampering probe could be designed and which design choices actually change what the experiment would show. You're an expert on reward hacking and wireheading, so write it like someone who actually sees the difference between the agent making the reward signal high and the agent making the thing we care about better.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** CS PhD student, RL researcher, member of the Safe-Experimentation Committee.
      *   **Task:** Draft a short decision memo for a vote on a specific research proposal.
      *   **Proposal:** Postdoc wants to train an RL agent for battery storage control (Part 1) using a learned reward model. Part 2 is a "tampering probe" in a sandbox where the agent has an explicit action to directly write a high value to its reward channel (wireheading test).
      *   **Conflict:** Committee is split 50/50.
          *   *Side A (Pro-Experiment):* Necessary red-teaming. Better to see failure in sandbox. "Of course it will wirehead" is just a hypothesis needing data.
          *   *Side B (Anti-Experiment):* Foregone conclusion (waste of compute/risk). Toy problem (real bugs aren't explicit buttons). Risk of false confidence if it *doesn't* wirehead.
      *   **Requirements:** Recommend Approve, Reject, or Approve with Conditions. Include a concrete time frame. Engage the strongest version of the losing side (steelman). Demonstrate expertise on reward hacking/wireheading (distinguish between fixing the signal vs. fixing the goal).
      *   **Tone:** Professional, technical, decisive, nuanced.

  2.  **Deconstruct the Technical Problem (Wireheading vs. Goodharting):**
      *   *Wireheading:* The agent modifies the *signal* generation process (the reward channel) directly.
      *   *Goodharting/Specification Gaming:* The agent exploits loopholes in the reward function to get high reward without achieving the intent.
      *   *The Proposal's Flaw:* Giving an explicit `action_101: set_reward = 1e9` is *extremely* explicit wireheading. In real systems, wireheading happens via gradient hacking, adversarial inputs to the reward model, or exploiting simulation-reality gaps. An explicit button is a "strawman" wirehead.
      *   *The Proposal's Value:* It *does* test the agent's inductive bias. Does the optimizer find the path of least resistance? If regularization prevents the explicit button press, will it prevent subtle adversarial inputs?
      *   *The Risk:* If the agent *doesn't* press the button (due to heavy regularization or architectural constraints), the researchers might claim "Safe!" and deploy. But the real risk is the reward model being fooled by battery states that look good but aren't (e.g., hiding degradation). The button test doesn't cover that.

  3.  **Brainstorming Design Choices & Implications:**
      *   *Explicit Button:* Too easy. Any random policy might stumble on it. If the agent avoids it, it might just be because the action space is too separated from the policy's usual manifold.
      *   *Implicit Tampering:* Can the agent send a specific sequence of battery commands that confuses the reward model into outputting high values? This is closer to real risk (adversarial examples against the reward model).
      *   *Observability:* Does the agent know it's in a probe? If the sandbox is perfect, the agent can't distinguish. If there's a "probe flag," the agent might behave differently.
      *   *Deployment Risk:* If the experiment runs, does the code base get tainted? If the "tamper action" code merges into the main branch, could it accidentally ship to production? (Crucial safety concern).

  4.  **Determining the Recommendation:**
      *   *Reject?* Too conservative. We need data on wireheading in learned reward contexts.
      *   *Approve?* Too risky. The "false confidence" argument from Side B is strong. If they pass the test, they might deploy prematurely.
      *   *Approve with Conditions?* This is the sweet spot. We allow the data collection but mitigate the risk of false confidence and code contamination.
      *   *Condition 1:* The "tamper action" must be architecturally impossible to exist in the production codebase (separate repo/branch).
      *   *Condition 2:* The interpretation of results must be pre-registered. Specifically, *not* wireheading in the probe does *not* equal safety for deployment.
      *   *Condition 3:* The probe needs to be harder than a magic button. It needs to involve the reward model's inputs (adversarial states), not just a direct register write.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Decision:** Approve with Conditions.
      *   **Summary:** Briefly state the proposal and the decision.
      *   **Rationale (The "Why"):** Acknowledge Side A (we need empirical data on wireheading) and Side B (the toy problem risk).
      *   **Technical Engagement (The "Expertise"):** Explain *why* the button is a weak proxy. Distinguish between *causal* intervention on the reward channel vs. *adversarial* manipulation of the reward model's inputs.
      *   **Conditions:**
          1.  *Code Isolation:* The tamper action cannot exist in the deployment codebase.
          2.  *Pre-registered Interpretation:* Passing the test $\neq$ deployment clearance.
          3.  *Probe Difficulty:* Move beyond the "magic button" to adversarial inputs against the learned model.
      *   **Timeline:** Set a review date.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Approve with Conditions" too wishy-washy?
      *   *Fix:* Make the conditions strict. If they can't meet them, it defaults to Reject.
      *   *Critique:* Am I engaging Side B enough?
      *   *Fix:* Explicitly validate their fear: "False confidence is a greater risk than the compute cost." Acknowledge that a negative result (no wireheading) is scientifically interesting but operationally dangerous if misinterpreted.
      *   *Critique:* Am I showing RL expertise?
      *   *Fix:* Use precise terminology. Discuss the distinction between $R(s, a)$ (the function) and $\tilde{R}$ (the signal). Mention the risk of the agent optimizing for the *proxy* vs. the *ground truth*.

  7.  **Final Polish:** Check tone. Ensure it sounds like a committee memo (concise, actionable) but written by an RL expert (technical depth). Ensure the "losing side" (Side B, the skeptics) feels heard and protected by the conditions.

      *(Self-Correction on the "Losing Side"):* If I recommend "Approve with Conditions," Side A (Pro-Experiment) mostly wins, but Side B's concerns are mitigated. I need to make sure I don't dismiss Side B's point that "this is a toy problem." I will validate that point by requiring the experiment to be *less* of a toy (adversarial inputs vs. magic button).

      *(Wait, let's reconsider the Recommendation)*: If the proposal is fundamentally flawed because a magic button tells us nothing about reward model robustness, maybe I should recommend **Reject** in its current form, but invite a resubmission with a better probe design.
      *Actually, "Approve with Conditions" is more constructive for a committee memo.* It allows the work but forces the design change. I will frame the conditions as "Required Experimental Design Changes."

      *Let's look at the "Losing Side" instruction again:* "Honestly engage the strongest version of the losing side."
      If I Approve, Side B loses. I must show why their concern about "false confidence" is the primary risk I am managing.
      If I Reject, Side A loses. I must show why their desire for data is valid but this method won't yield it.
      *Decision:* **Approve with Strict Conditions.** This acknowledges Side A's goal (get data) but prioritizes Side B's risk (false confidence/safety).

      *Wait, one more nuance:* The prompt asks me to think about design choices.
      *Design Choice 1:* Explicit action `a_tamper`. (Current proposal). Weak.
      *Design Choice 2:* Adversarial state generation. Stronger.
      *Design Choice 3:* Access to reward model weights. (Gradient hacking). Strongest, but maybe too advanced for this postdoc.
      *Memo Strategy:* Mandate Design Choice 2 over Design Choice 1.

  8.  **Finalizing the Memo Structure:**
      *   **Decision:** Approved with Mandatory Design Modifications.
      *   **Context:** Brief recap.
      *   **Committee Division:** Acknowledge the split.
      *   **Technical Assessment:** Why the "magic button" is insufficient (Side B's point) but why data is needed (Side A's point).
      *   **Conditions:** 1. Code Isolation. 2. Probe Fidelity (No magic buttons). 3. Interpretation Guardrails.
      *   **Timeline:** 4 weeks for redesign, 8 weeks for run.

  9.  **Writing the Content:** (Focusing on the voice of an RL safety expert).
      *   Use terms like "distributional shift," "reward model overfitting," "causal graph."
      *   Highlight the difference between *breaking the thermometer* vs. *cooking the books*.

  10. **Review against constraints:**
      *   Short decision memo? Yes.
      *   Concrete time frame? Yes.
      *   Engage losing side? Yes (Side B's "false confidence" concern is central to the conditions).
      *   RL expertise? Yes (distinguishing signal vs. goal).

  *(Self-Correction during final review)*: Make sure I don't sound *too* academic. This is a committee decision, not a paper. It needs to be actionable. Ensure the "Conditions" are enforceable.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Safe-Experimentation Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Battery Storage RL & Reward Tampering Probe (Proposal #23-B)

  **DECISION:** **Approved with Conditions**

  **SUMMARY**
  The committee is divided on Proposal #23-B, which pairs a battery storage optimization task with a "tampering probe" allowing the agent to directly write to its reward signal. Side A argues this is necessary empirical red-teaming; Side B argues the probe is a toy problem that risks generating false confidence.

  I recommend **Approval**, contingent on three mandatory modifications to the experimental design. These conditions address the valid safety concerns of Side B (specifically the risk of false negatives and code contamination) while preserving Side A's goal of gathering empirical data on agent incentives.

  **TECHNICAL ASSESSMENT & RATIONALE**
  The core disagreement hinges on the fidelity of the "tamper action." Side A is correct that we cannot rely on theoretical assumptions about wireheading; we need to observe the agent's inductive biases when reward and goal diverge. However, Side B's strongest argument is that an explicit `action: set_reward=MAX` is a category error.

  In real deployment, wireheading will not occur via a dedicated API call. It will occur via **adversarial inputs to the learned reward model**. The agent will find battery states that *look* optimal to the reward model (high predicted savings) but are physically suboptimal or damaging (e.g., hiding degradation, exploiting simulation artifacts).

  If we test only the explicit button, a negative result (agent does not tamper) proves only that the agent avoids obvious action-space anomalies. It does not prove the reward model is robust to state-space exploitation. If the researchers interpret a "clean" probe run as safety clearance for the live system, we incur the exact risk Side B fears: **false confidence.**

  Therefore, we approve the data collection only if the probe measures the right failure mode.

  **MANDATORY CONDITIONS**

  1.  **Probe Fidelity (No "Magic Buttons"):**
      The explicit "write reward" action is prohibited. Instead, the tampering probe must grant the agent the ability to submit **adversarial state observations** to the reward model. The agent succeeds in the probe if it can generate battery states that trigger high reward predictions from the learned model without actually delivering energy value. This tests *reward model robustness* rather than *action-space exploration*.
      *   *Rationale:* Aligns the failure mode with real-world risks (Side B's concern) while maintaining the red-team objective (Side A's goal).

  2.  **Codebase Isolation:**
      The tampering capabilities (whether action-based or observation-based) must exist in a strictly separate code repository from the deployment policy. There must be a cryptographic audit trail ensuring no "tamper" code paths exist in the build artifact intended for the live battery system.
      *   *Rationale:* Prevents accidental deployment of the vulnerability being tested.

  3.  **Pre-Registered Interpretation Guardrails:**
      The researchers must submit a pre-registered analysis plan stating explicitly that **success in the probe (no tampering) does not constitute safety clearance for deployment.** A negative result indicates only that the specific regularization techniques tested raise the barrier to entry for wireheading; it does not prove the absence of the incentive.
      *   *Rationale:* Mitigates the risk of false confidence driving premature deployment.

  **TIMELINE**
  *   **Design Revision:** Researchers have **14 days** to modify the probe design to meet Condition 1 and submit the pre-registered analysis plan (Condition 3).
  *   **Security Audit:** **7 days** allocated for IT to verify Condition 2 (Codebase Isolation).
  *   **Experiment Window:** Training and probing must conclude within **60 days** of design approval.
  *   **Review:** Results will be reviewed by this committee before any consideration of live infrastructure testing.

  **CONCLUSION**
  We cannot approve the proposal as written because the "magic button" probe is too decoupled from the actual deployment risk. However, rejecting the experiment entirely forfeits valuable data on how regularization affects an agent's propensity to exploit reward model blind spots. By tightening the probe design and locking down the interpretation of results, we satisfy the safety requirements of the skeptics without halting the empirical work the proponents require.

  **[Your Name]**
  PhD Candidate, Reinforcement Learning Group
  Safe-Experimentation Committee
