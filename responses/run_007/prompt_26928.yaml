answer: |-
  # Epistemic Intuitions Sorting Quiz

  **Instructions:** Read each case carefully. For each question, select the option that best matches your immediate judgment about whether the protagonist **knows** the proposition in question. Do not worry about technical theories; answer based on whether you would say "They know" in ordinary conversation.

  **1. The Lottery**
  You hold one ticket in a fair lottery with one million tickets and one prize. The draw has not happened. Based solely on the odds, do you know your ticket will lose?
  A) Yes, I know it will lose.
  B) No, I do not know it will lose.

  **2. The Zoo**
  You see a zebra in a pen at the zoo. You know that if it were a mule painted to look like a zebra, it would look exactly the same. You know it is a zebra. You know zebras are not painted mules. Do you know it is not a painted mule?
  A) Yes, I know it is not a painted mule.
  B) No, I do not know it is not a painted mule.

  **3. Fake Barn County**
  Henry is driving through a county where almost all structures looking like barns are fake facades. He stops and looks at the one real barn. He believes it is a barn. Does Henry know it is a barn?
  A) Yes, he knows.
  B) No, he does not know.

  **4. The Grandmother**
  A grandmother sees her grandson is alive. However, if he were dead, the family would tell her he is alive to spare her feelings. She believes he is alive because she sees him. Does she know he is alive?
  A) Yes, she knows.
  B) No, she does not know.

  **5. The Brain in a Vat**
  You are sitting in a seminar. Do you know you have hands? Do you know you are not a brain in a vat being fed experiences of hands?
  A) I know I have hands, and I know I am not a vat.
  B) I know I have hands, but I do not know I am not a vat.
  C) I do not know I have hands (because I don't know I'm not a vat).

  **6. The Stopped Clock**
  You glance at a clock that stopped exactly 12 hours ago. It happens to show the correct time. You believe the time is correct. Do you know the time?
  A) Yes, I know the time.
  B) No, I do not know the time.

  **7. The Bank Case**
  Hannah has evidence the bank is open on Saturday.
  *Case Low:* No penalty if she is wrong.
  *Case High:* If she is wrong, her check bounces and she faces foreclosure.
  In both cases, her evidence is identical. Does she know the bank is open in both cases?
  A) Yes, she knows in both Low and High.
  B) No, she knows in Low, but not in High.
  C) No, she knows in neither.

  **8. Conjunction**
  You know proposition P. You know proposition Q. Do you know "P and Q"?
  A) Yes, I know the conjunction.
  B) No, I do not necessarily know the conjunction.

  ***

  # Scoring Key

  Tally your answers to find your epistemic profile.

  **Profile 1: The Closure Skeptic (Mostly 2B, 5B, 8B)**
  You believe knowledge does not automatically transfer across logical steps. You likely think we can know ordinary things (zebras, hands) without being able to rule out remote skeptical possibilities (painted mules, vats).
  *Common Label:* Relevant Alternatives or Tracking Theory.

  **Profile 2: The Safety First Epistemologist (Mostly 3B, 4A, 6B, 5A)**
  You think knowledge requires a secure connection to the truth. Luck (Clock, Fake Barn) defeats knowledge, but ordinary perception (Grandmother, Hands) succeeds. You generally preserve logical closure.
  *Common Label:* Safety-Based Epistemology.

  **Profile 3: The Moorean Invariantist (Mostly 5A, 3A, 6A, 1B)**
  You are confident in ordinary knowledge (Hands, Barns) and reject skepticism. You think practical stakes (Bank) do not change knowledge, but probabilistic evidence (Lottery) is insufficient. You maintain logical closure.
  *Common Label:* Closure-First Invariantism.

  **Profile 4: The Contextualist/Pragmatist (Mostly 7B)**
  Your verdicts shift based on practical stakes or salient error possibilities. You might say Hannah knows in Low stakes but not High stakes.
  *Common Label:* Contextualism or Pragmatic Encroachment.

  **Profile 5: The Sensitivity Theorist (Mostly 4B, 2B)**
  You focus on whether the belief would change if the fact were false. If the grandmother would still believe he is alive even if he were dead, she doesn't know.
  *Common Label:* Nozickian Tracking.

  ***

  # Instructor's Design Notes: Logical Space & Positions

  This instrument maps four diagnostic axes: **Sensitivity** (Q4), **Closure** (Q2, Q5, Q8), **Safety/Environment** (Q3, Q6), and **Stakes/Salience** (Q7).

  **Locating Named Positions:**
  1.  **Nozick (Tracking):** Requires Sensitivity. Verdicts: Q4 (No), Q2 (No), Q5 (B). Denies Closure to avoid skepticism.
  2.  **Dretske (Relevant Alternatives):** Similar to Nozick. Verdicts: Q2 (No), Q5 (B). Distinguishes relevant vs. irrelevant alternatives.
  3.  **Safety (Sosa/Pritchard):** Requires Safety (no nearby error). Verdicts: Q3 (No), Q6 (No), Q4 (Yes). Accepts Closure (Q2 Yes, Q5 A).
  4.  **Moorean Invariantism (Williamson/Standard):** Anti-skeptic, Pro-Closure. Verdicts: Q5 (A), Q2 (Yes). Accepts Q3 (Yes) if internalist, (No) if externalist.
  5.  **Contextualism/Encroachment:** Defined by Q7 (B).

  **Unoccupied or Problematic Combinations:**
  *   **Sensitivity + Closure:** Generally incoherent. If knowledge requires sensitivity (Q4 No), one cannot know one is not a BIV (Q5 B), forcing Closure denial (Q2 No). A view claiming Sensitivity is required *and* Closure holds against skepticism is logically unstable.
  *   **Safety + Closure Denial:** Unattractive. Safety theories usually preserve closure because safety is preserved across known entailment in nearby worlds.
  *   **Lottery Knowledge + Anti-Skepticism:** If one answers Q1 (Yes), one must explain why this doesn't generate knowledge of skeptical hypotheses via closure. Rarely held.

  **Indistinguishable Pairs:**
  *   **Nozick vs. Dretske:** This quiz cannot cleanly separate them. Both deny closure in skeptical cases and require a form of counterfactual reliability. Separation requires cases where Sensitivity and Relevant Alternatives diverge (e.g., necessary truths).
  *   **Safety vs. Externalist Moorean:** Both accept Closure and deny Knowledge in Fake Barn cases. They differ on the *explanation* (modal safety vs. reliable process), which verdicts alone may not capture.
