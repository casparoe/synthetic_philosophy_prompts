      *Self-Correction on Case 1:* The prompt says "I want to sign the council up... but the other four officers are doubtful." If I *know* they are doubtful, why am I asking? Because I want to do it anyway. The procedure must stop me. That is the "unpleasant" outcome. It prevents me from exercising my power.
      *Self-Correction on Case 3:* This is political. The procedure should probably require a higher bar than just one ally. Maybe 3/5 for public statements? Let's stick to the "Two-Key" (2/5) for simplicity, but note that public statements are high risk. Actually, to make it robust, for "Public Stance on School Policy," the procedure should require a Majority (3/5) via text if a meeting isn't possible. This distinguishes it from a fundraising event. I will incorporate this distinction into Step 3 or 4. Let's add a "Stakes" filter.

      *Revised Procedure Step:*
      1. Reversible?
      2. Routine?
      3. Controversial? (If yes, need consensus).
      4. Time? (If enough for text, text vote. If not, need 2nd key).
