prompt: |-
  I'm giving a presentation next month to the program staff and external reviewers of a philanthropic foundation that requires every grant proposal to carry a reference-class forecast, drawn from base rates of comparable past projects, and that treats the outside view as the main safeguard against overoptimistic proposals. I'm defending the claim that, for genuinely unprecedented interventions, this practice systematically underweights the inside view, and that epistemic modesty cuts the other way: forcing a reference class can manufacture false confidence by hiding contestable similarity judgments inside a number.

  My argument in brief: (1) selecting a reference class is itself an inside judgment about which past projects are relevantly similar; (2) the base rate inherited from that class silently carries those similarity assumptions, so it cannot check the inside view without partly presupposing it; (3) for one-off interventions the variance across defensible reference classes is usually larger than the uncertainty the outside view was meant to reduce; (4) so deference to the outside view is often a disguised inside view wearing an exaggerated air of modesty.

  The audience is mostly economists and operations-research-trained evaluators who are accountable for the foundation's grant decisions, who take the planning fallacy and optimism bias to be the default explanation of failed programs, and who see the outside view as their protection against being sold a story; a smaller group are epistemologists who work on higher-order evidence, disagreement, and the limits of self-knowledge about bias.

  Draft my Q&A prep sheet, not the talk itself: the eight or so objections I'm most likely to face from this specific audience, ordered by expected damage (likelihood weighted by force), with both factions represented and each objection phrased the way that faction would actually put it. For each, give a two-minute reply and a note on where that reply is soft. End with the question I'm hoping nobody asks, and explain why it's the dangerous one.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Draft a Q&A prep sheet for a presentation.
      *   **Topic:** Critiquing the mandatory use of reference-class forecasting (RCF) / outside view for unprecedented philanthropic interventions. Arguing that it underweights the inside view and creates false confidence via contestable similarity judgments.
      *   **Audience:**
          *   Majority: Economists, OR-trained evaluators, foundation staff. Value RCF, fear optimism bias/planning fallacy, see outside view as a safeguard.
          *   Minority: Epistemologists. Focus on higher-order evidence, disagreement, limits of self-knowledge.
      *   **Format:** ~8 objections, ordered by expected damage (likelihood $\times$ force). Phrased in the voice of the specific faction. Two-minute reply for each. Note on where the reply is soft. End with the "dangerous question" nobody should ask.
      *   **Tone:** Professional, intellectually rigorous, persuasive but humble (epistemic modesty).

  2.  **Deconstruct the Argument:**
      *   *Core Claim:* Mandatory RCF for unprecedented projects is counterproductive.
      *   *Premise 1:* Reference class selection is subjective (inside view).
      *   *Premise 2:* Base rates embed these subjective assumptions.
      *   *Premise 3:* Variance across classes > Uncertainty reduction.
      *   *Conclusion:* Outside view deference = Disguised inside view + false modesty.

  3.  **Brainstorm Objections (by Faction):**

      *   *Economists/Evaluators:*
          *   "Without RCF, you just get storytelling."
          *   "Optimism bias is proven; you need an anchor."
          *   "You can always find *some* class; imperfect is better than nothing."
          *   "How do you propose we allocate funds if not by comparable metrics?"
          *   "This sounds like an excuse for grantees to ignore data."

      *   *Epistemologists:*
          *   "Isn't this just skepticism about aggregation?"
          *   "What about peer disagreement on the class selection?"
          *   "Doesn't the outside view still provide higher-order evidence?"
          *   "Are you advocating for pure intuition?"

  4.  **Select and Order the Top 8 (Likelihood $\times$ Force):**

      1.  *The "Anchor" Objection (Econ):* Even a noisy anchor is better than unanchored optimism. (High likelihood, high force).
      2.  *The "Accountability" Objection (Econ/Staff):* If we don't use RCF, how do we justify decisions to the board/donors? (High likelihood, high force).
      3.  *The "Selection Bias" Objection (Econ/OR):* You can game any system; RCF at least makes the gaming explicit. (Medium likelihood, high force).
      4.  *The "Epistemic Humility" Objection (Epistemologist):* Isn't deferring to base rates *more* humble than trusting your specific case judgment? (Medium likelihood, medium force).
      5.  *The "Hybrid" Objection (Econ):* Why not just use RCF as a prior and update? (High likelihood, medium force).
      6.  *The "Definition of Unprecedented" Objection (Staff):* Nothing is truly unprecedented; you're setting the bar too high. (Medium likelihood, medium force).
      7.  *The "Variance" Objection (OR):* If variance is high, that *is* the information (risk), not a bug. (Low likelihood, high force).
      8.  *The "Institutional Memory" Objection (Staff):* RCF builds institutional learning; your approach silos knowledge. (Low likelihood, medium force).

      *Refining the Order:* I need to weigh "Damage." The most damaging objections are those that threaten the practical viability of the foundation's process or strike at the core philosophical coherence.
      1.  *The "Bayesian Update" Objection (Econ):* Why not just treat base rate as a prior? (Kahneman/Lovallo standard response). This is the strongest technical counter.
      2.  *The "Guardrail" Objection (Staff):* Without this, we have no defense against salesmanship.
      3.  *The "Nothing is Unique" Objection (Econ):* Claiming "unprecedented" is a loophole.
      4.  *The "Humility" Objection (Epistemologist):* Outside view *is* the modesty move.
      5.  *The "Explicit vs. Implicit" Objection (OR):* RCF forces explicit assumptions; inside view hides them.
      6.  *The "Decision Rule" Objection (Staff):* What's the alternative algorithm?
      7.  *The "Variance as Signal" Objection (OR):* Wide classes signal risk.
      8.  *The "Institutional Learning" Objection (Staff):* We need data for next time.

      *Let's adjust phrasing to match the factions.*

  5.  **Drafting the Content (Iterative refinement):**

      *   *Objection 1 (The Bayesian):* "Why not just use the base rate as a prior?"
          *   *Reply:* For unprecedented cases, the likelihood function swamps the prior. The "prior" isn't neutral; it's a competing model.
          *   *Soft spot:* Requires admitting we don't know the likelihood function either.
      *   *Objection 2 (The Guardrail):* "This removes our only shield against charisma."
          *   *Reply:* It replaces one bias (optimism) with another (status quo/class bias). We need structured inside-view scrutiny, not just numbers.
          *   *Soft spot:* Hard to operationalize "structured scrutiny."
      *   *Objection 3 (The "Nothing is Unique"):* "Unprecedented is a weasel word."
          *   *Reply:* It's a threshold. If the causal mechanism is novel, past outcomes aren't data, they're analogies.
          *   *Soft spot:* Where is the threshold?
      *   *Objection 4 (Epistemic Humility):* "Deferring to the aggregate is more humble."
          *   *Reply:* False humility if the aggregate is irrelevant. True humility admits the reference class is chosen by a biased human.
          *   *Soft spot:* Can sound like solipsism.
      *   *Objection 5 (Explicit Assumptions):* "RCF makes assumptions visible."
          *   *Reply:* It makes the *class* visible, but hides the *similarity judgment*.
          *   *Soft spot:* Still, a number is easier to audit than a narrative.
      *   *Objection 6 (Alternative Process):* "What's the alternative?"
          *   *Reply:* Red teaming the causal model, not the timeline/budget against past averages.
          *   *Soft spot:* Resource intensive.
      *   *Objection 7 (Variance):* "High variance just means high risk."
          *   *Reply:* If variance covers 0-100%, the number is noise, not signal.
          *   *Soft spot:* Finance handles this with volatility pricing; why not here?
      *   *Objection 8 (Learning):* "We need data for the future."
          *   *Reply:* Bad data (wrong class) corrupts future learning more than no data.
          *   *Soft spot:* We learn nothing if we don't try to categorize.

  6.  **The "Dangerous Question":**
      *   What kills the argument? The argument relies on the claim that the inside view can be improved. If the inside view is *inherently* corrupted by bias (which the foundation believes), then the critique collapses.
      *   *Question:* "If the inside view is biologically prone to optimism bias, as Kahneman shows, why do you trust it more than a flawed outside view?"
      *   *Why dangerous:* It forces me to defend the reliability of human judgment, which is exactly what the foundation's mandate says is unreliable.

  7.  **Review and Refine:**
      *   Check tone: Is it respectful but firm?
      *   Check timing: Are replies ~2 minutes spoken? (approx. 250-300 words).
      *   Check factions: Do the economists sound like economists? Do the epistemologists sound like epistemologists?
      *   Check ordering: Is it truly by damage potential? (I'll put the "Bayesian Prior" and "Guardrail" at the top).

  8.  **Final Polish:** Ensure the "Soft Spot" is honest and actionable. Make sure the "Dangerous Question" explanation is incisive. (Self-Correction: Make sure the distinction between "Inside View" as "gut feeling" vs "Inside View" as "causal model analysis" is clear in the replies, as that's the defender's leverage).

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: The Limits of Reference-Class Forecasting
  **Presentation:** "The False Modesty of Mandatory Base Rates"
  **Audience:** Foundation Evaluators (Econ/OR) & Epistemologists
  **Goal:** Defend the claim that mandatory RCF for unprecedented interventions creates false confidence.

  ---

  ### 1. The "Bayesian Prior" Objection (Economists/Evaluators)
  **The Question:** "You're treating the outside view as a replacement for the inside view. But standard Bayesian practice treats the base rate as a *prior* and the specific case details as the *likelihood*. Why not just use the reference class as an anchor and update from there, rather than discarding it? Isn't discarding the prior the real epistemic arrogance?"

  **The Reply (2 mins):**
  "That is the standard Kahneman-Lovallo prescription, and it works well for routine projects like construction or IT implementation. But for *unprecedented* interventions, the 'prior' isn't neutral information; it is a competing causal model. If I am proposing a novel gene-drive eradication strategy, using the base rate of 'pest control programs' as a prior assumes the causal mechanism is analogous to pesticide spraying. If the mechanism is fundamentally different, that prior isn't just weak evidence; it's misleading evidence.
  My argument isn't that we should ignore the past, but that for one-off interventions, the variance across defensible reference classes (e.g., 'pest control' vs. 'genetic therapies' vs. 'public health campaigns') is so massive that the 'prior' becomes noise. Updating on noise doesn't reduce error; it just quantifies it. Epistemic modesty here means admitting we don't have a stable prior distribution, not that we should pretend we do."

  **Where this is soft:** You haven't offered a formal method for weighting the likelihood. It risks sounding like you're advocating for unanchored intuition, which economists distrust more than biased anchors.

  ### 2. The "Guardrail Against Salesmanship" Objection (Program Staff)
  **The Question:** "Grant applicants are professional storytellers. Their inside views are incentivized to be optimistic. The reference class is our only objective shield against being sold a dream. If we remove this requirement, aren't we just handing the decision over to the most charismatic PI?"

  **The Reply (2 mins):**
  "I agree that the inside view provided by the *applicant* is compromised by incentive structures. But the solution isn't to substitute a number that pretends to be objective; it's to change *who* constructs the inside view.
  Currently, the foundation accepts the applicant's inside view and checks it against an outside view. I'm proposing we reject the applicant's inside view entirely and build our own causal model using independent experts who have no stake in the funding. The 'outside view' number gives us a false sense of security that we've done the math, when we've actually just accepted a contestable similarity judgment. It is better to have a contentious debate about causal mechanisms than a quiet acceptance of a base rate that hides those disagreements behind a decimal point."

  **Where this is soft:** Independent expert panels are expensive and slow. You are proposing a resource-intensive alternative to a cheap heuristic.

  ### 3. The "Nothing is Unique" Objection (Economists)
  **The Question:** "You keep saying 'unprecedented.' In social science and development, nothing is truly unprecedented. There is always a broader class. Isn't 'unprecedented' just a loophole applicants will use to escape accountability?"

  **The Reply (2 mins):**
  "It is a loophole if we define reference classes by sector, like 'education' or 'health.' I'm defining them by causal mechanism. If a project relies on a behavioral nudge that has never been tested at scale, or a governance structure that contradicts established institutional theory, the relevant base rate is empty.
  The danger isn't that applicants claim uniqueness; it's that evaluators force a class where none exists to satisfy a compliance checkbox. If you force me to categorize a crypto-based land registry as 'property rights reform,' I inherit the failure rates of bureaucratic land reform. That doesn't hold the project accountable; it holds the *category* accountable. We should allow 'unprecedented' to be a risk flag that triggers deeper scrutiny, not a compliance failure that triggers a forced analogy."

  **Where this is soft:** Distinguishing "sector" from "causal mechanism" is itself a subjective judgment. You haven't solved the regress problem.

  ### 4. The "Humility" Objection (Epistemologists)
  **The Question:** "Isn't deferring to a base rate the *more* humble move? It acknowledges that my specific case judgment is prone to bias. Insisting on the inside view seems to privilege the evaluator's intuition over aggregate data."

  **The Reply (2 mins):**
  "It looks like humility, but it's actually displaced responsibility. When I choose a reference class, I am making a judgment about similarity. If I choose 'failed tech startups' over 'successful open-source projects' for a software grant, I've determined the outcome before calculating the average.
  True epistemic humility requires acknowledging that the *selection of the class* is where the bias lives. By treating the base rate as an external check, we hide that selection bias inside a number. It is more humble to say, 'We have no data for this specific causal chain,' than to say, 'This is like that, so we know the odds.' The latter is a claim to knowledge we don't possess."

  **Where this is soft:** It risks sounding like skepticism about aggregation itself, which undermines the foundation's entire evidence-based mission.

  ### 5. The "Explicit Assumptions" Objection (Operations Research)
  **The Question:** "A reference class forces you to state your assumptions about similarity. An inside view allows you to hide assumptions in a narrative. Isn't a wrong number better than a hidden story?"

  **The Reply (2 mins):**
  "A number isn't an assumption; it's a conclusion. The assumption is the similarity judgment, and that *is* hidden in the narrative of why we chose that class.
  If I say 'This project has a 20% success rate,' the audit trail stops at the data source. If I say 'This project relies on mechanism X, which is untested,' the audit trail requires examining mechanism X. The number creates a 'stopping point' for inquiry. We stop asking 'why' once we have the 'what.' For high-variance interventions, we need to extend the inquiry, not truncate it with a statistic."

  **Where this is soft:** Numbers are easier to audit than narratives. You are asking for more cognitive labor from the reviewers.

  ### 6. The "Alternative Algorithm" Objection (Program Staff)
  **The Question:** "Okay, suppose we accept your critique. What is the operational alternative? We need a decision rule for the board. Are you suggesting we just vote on narratives?"

  **The Reply (2 mins):**
  "I'm not suggesting voting on narratives. I'm suggesting we shift the forecasting target. Instead of forecasting *outcome probability* based on past analogs, we forecast *milestone viability* based on causal prerequisites.
  Use a 'pre-mortem' approach: Assume the project failed, and work backward to identify which causal links broke. Rate the robustness of each link. This keeps the focus on the specific intervention's logic rather than an external analog. It produces a risk profile, not a single probability number. It tells the board *where* the risk is, rather than pretending to know *how much* risk there is."

  **Where this is soft:** Pre-mortems are also subject to optimism bias. You haven't proven this is more accurate than RCF, just more detailed.

  ### 7. The "Variance as Signal" Objection (Economists/OR)
  **The Question:** "You argue that variance across reference classes is a bug. In finance, variance is the signal. If the base rate varies wildly depending on the class, doesn't that simply tell us the project is high-risk? Why is that a problem?"

  **The Reply (2 mins):**
  "In finance, variance implies volatility around a known mean structure. Here, the variance implies *model uncertainty*. If one class suggests 10% success and another suggests 90%, the average isn't 50%; it's 'unknown.'
  Treating model uncertainty as risk leads to mispricing. If we treat 'unknown' as '50% risk,' we might fund projects that are actually impossible, or reject projects that are actually sure bets. Acknowledging the variance as 'unquantifiable uncertainty' changes the decision rule from 'is the EV positive?' to 'can we afford to learn if this works?' That is a fundamentally different allocation strategy."

  **Where this is soft:** Foundations often *want* to take high risks. Distinguishing "high risk" from "unknown" might not change the funding decision, only the labeling.

  ### 8. The "Institutional Memory" Objection (Program Staff)
  **The Question:** "If we don't categorize projects into reference classes, how do we learn? Five years from now, how do we know if our portfolio worked unless we compare it to past cohorts?"

  **The Reply (2 mins):**
  "We can still categorize ex-post for learning, without using ex-ante categories for forecasting. In fact, forcing ex-ante categories distorts the learning. We end up optimizing projects to fit successful historical classes rather than fitting the problem.
  Let the data cluster naturally after the fact. If we force a square peg into a round hole to get a grant, we corrupt the data for the next five years. It is better to have five years of 'unique' project data that we can later cluster, than five years of 'comparable' projects that were artificially constrained to look comparable."

  **Where this is soft:** Ex-post clustering is methodologically difficult. You are asking for a research project, not an evaluation protocol.

  ---

  ### The Dangerous Question
  **The Question:** "You argue that the inside view is suppressed by the outside view. But the psychological literature on the planning fallacy is robust: human judgment is *systematically* optimistic, even among experts. If the inside view is biologically corrupted, why do you trust *any* inside view—even a scrutinized one—more than a flawed outside view?"

  **Why it's dangerous:**
  This strikes at the foundation's theological core. Their entire mandate is built on the premise that human intuition is the problem and algorithmic/data-driven heuristics are the solution (the "Bias vs. Noise" framework).
  If you answer "Because experts can correct bias," you contradict the literature they fund.
  If you answer "Because the outside view is worse," you have to prove that *selection bias* in reference classes is systematically larger than *optimism bias* in planning, which is an empirical claim you likely cannot support with data (since you are arguing the data is flawed).
  **Preparation:** You must pivot to "Structural vs. Individual." Acknowledge individual optimism bias, but argue that *institutional* reference-class selection introduces a different, harder-to-detect systemic bias (status quo bias) that is more dangerous for innovation than individual optimism. You aren't defending intuition; you are defending *causal modeling* over *analogical reasoning*.
