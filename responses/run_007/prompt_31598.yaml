prompt: |-
  I am a novelist. I want a reusable decision procedure, grounded in Kant's universalizability test as developed in the Groundwork, that I can run on any morally significant action my characters contemplate. The procedure should take a situated description of a proposed action and yield a verdict: permissible, impermissible, or unsettled by the test alone. It must walk me through (a) extracting a maxim from the description, including how to handle the level-of-description problem; (b) testing for a contradiction in conception; (c) testing for a contradiction in willing; and (d) identifying the points where judgment cannot be eliminated and must be handed off to something outside the procedure. The procedure should be usable by someone who has read the Groundwork but is not a Kant scholar.

  Then run the procedure on two maxims from my current work: (1) a character lies to a dying parent, telling them that their estranged child has forgiven them, in order to let the parent die in peace; (2) a character breaks a promise made to a now-dead friend because keeping it would harm an innocent third party the friend could not have known about when the promise was made.

  Begin with the procedure itself, no preface or commentary. Be honest about where the procedure gives answers I will find uncomfortable, and flag each step that is a disguised judgment call rather than a mechanical operation.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist.
      *   **Task:** Create a reusable decision procedure based on Kant's Universalizability Test (from the *Groundwork of the Metaphysics of Morals*).
      *   **Output Requirements:**
          1.  The procedure itself (no preface/commentary).
          2.  Must handle: (a) extracting a maxim (level-of-description problem), (b) contradiction in conception (CC), (c) contradiction in willing (CW), (d) identifying limits/judgment calls.
          3.  Verdicts: Permissible, Impermissible, or Unsettled.
          4.  Must be usable by a non-scholar who has read the *Groundwork*.
          5.  Must be honest about uncomfortable answers and flag judgment calls.
          6.  Apply the procedure to two specific cases:
              *   Case 1: Lying to a dying parent about forgiveness (white lie/peace).
              *   Case 2: Breaking a promise to a dead friend to help an innocent third party.
      *   **Constraint:** Begin with the procedure itself, no preface or commentary.

  2.  **Drafting the Procedure:**
      *   *Goal:* Make it step-by-step, algorithmic where possible, but honest about where interpretation is needed.
      *   *Step 1: Formulating the Maxim.* This is the trickiest part (level of generality). Needs to include Action, Circumstance, and Purpose.
      *   *Step 2: Contradiction in Conception (CC).* Can the maxim be universalized without logical contradiction? (Perfect Duties).
      *   *Step 3: Contradiction in Willing (CW).* Can the maxim be universalized without contradicting the agent's own rational will? (Imperfect Duties).
      *   *Step 4: Verdict & Limitations.* Where does the test fail or require external input?
      *   *Tone:* Instructional, precise, candid about Kant's rigor (especially regarding lying).
      *   *Flagging Judgment Calls:* Explicitly mark steps where the user's interpretation dictates the outcome.

  3.  **Refining the Procedure (Kantian Accuracy):**
      *   *Maxim Formulation:* Needs to be "I will do X in circumstance C for purpose P."
      *   *Level-of-Description:* Warn against making it too specific (tautology) or too general (loses context).
      *   *CC Test:* Imagine a world where everyone does this. Does the action become impossible? (e.g., promising becomes impossible if everyone lies).
      *   *CW Test:* Imagine a world where everyone does this. Would a rational agent *will* this world? Does it undermine something the agent necessarily wills (like happiness, help from others)?
      *   *Judgment Calls:* Formulating the maxim is the biggest one. Also, determining what counts as a "contradiction."
      *   *Uncomfortable Truths:* Kant famously argues against lying even to save a life. The procedure must reflect this rigor, not soften it for modern sensibilities, otherwise it's not Kantian.

  4.  **Drafting the Application (Case 1: Lying to Dying Parent):**
      *   *Maxim:* To lie to a dying person about forgiveness to ensure peace.
      *   *CC:* If everyone lied to dying people for peace, would trust collapse? Would the concept of "assurance" vanish? Kant says lying destroys the source of right.
      *   *CW:* Would I will a world where no one trusts deathbed statements?
      *   *Verdict:* Likely Impermissible (Kant's strict view).
      *   *Judgment Call:* How specific is the circumstance?

  5.  **Drafting the Application (Case 2: Breaking Promise to Dead Friend):**
      *   *Maxim:* To break a promise to a deceased person if keeping it harms an innocent third party.
      *   *CC:* If everyone broke promises when inconvenient/harmful, does the institution of promising vanish?
      *   *CW:* Would I will a world where promises are conditional on unforeseen harm?
      *   *Nuance:* Conflict of duties? Kant usually says perfect duties (no lying/breaking promises) trump imperfect duties (helping others). But if the promise itself becomes immoral to keep?
      *   *Verdict:* Likely Impermissible (strict), but maybe Unsettled due to conflict of duties.
      *   *Judgment Call:* Defining the harm.

  6.  **Review against Constraints:**
      *   *No Preface:* Start immediately with the procedure title/text.
      *   *Reusable:* Yes, structured as a tool.
      *   *Groundwork:* Stick to CI Formula 1 (Universal Law).
      *   *Flag Judgment Calls:* Use bold or brackets.
      *   *Honest about Uncomfortable Answers:* Explicitly state where Kant prohibits "good" outcomes.

  7.  **Final Polish of Procedure:**
      *   Make sure the distinction between CC and CW is clear.
      *   Ensure the "Level-of-Description" warning is prominent.
      *   Ensure the "Unsettled" category is used when the test doesn't resolve conflicts between duties.

  8.  **Final Polish of Applications:**
      *   Run the steps explicitly for each case.
      *   Highlight the verdict clearly.
      *   Point out the friction between moral intuition and Kantian logic.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe allow for "conflict of duties" to resolve Case 2.
      *   *Correction:* Kant famously denies genuine conflicts of duties (*Groundwork*, *Metaphysics of Morals*). If two grounds oppose, one is not a duty. I should reflect this strictness but note where the procedure hits a wall.
      *   *Initial thought:* Soften the lying verdict.
      *   *Correction:* No, the prompt asks for Kant's test as developed in the *Groundwork*. Kant's position on lying is strict. I must note this as an "uncomfortable answer."
      *   *Formatting:* Use clear headings and numbered steps.

  10. **Final Check:** Does it start immediately? Yes. Does it cover (a)-(d)? Yes. Does it run the two cases? Yes. Does it flag judgment calls? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  # The Universalizability Decision Procedure (Kantian Groundwork Model)

  **Purpose:** To determine the moral permissibility of a proposed action based on the Categorical Imperative (Formula of Universal Law).
  **Inputs:** A situated description of a proposed action.
  **Outputs:** Permissible, Impermissible, or Unsettled.

  ---

  ## Phase 1: Maxim Extraction
  *The moral worth of an action lies in the maxim (principle) behind it, not the consequence. You must formulate the agent's subjective principle of volition.*

  **Step 1.1: Draft the Maxim**
  Construct a sentence using this template:
  *"I will [ACTION] in [CIRCUMSTANCE] for the purpose of [END]."*

  **Step 1.2: Check the Level of Description [JUDGMENT CALL]**
  *   **Warning:** If the circumstance is too specific (e.g., "when I am wearing a blue shirt"), the maxim becomes a tautology and passes trivially. If too general (e.g., "when I want something"), it fails to capture the moral context.
  *   **Rule:** Include only those features of the circumstance that the agent considers *morally relevant* to their decision.
  *   **Test:** Ask, "Would the agent still perform this action if this specific detail of the circumstance were removed?" If yes, remove it from the maxim. If no, keep it.

  **Step 1.3: Finalize the Maxim**
  Record the finalized statement. This is the input for the testing phases.

  ---

  ## Phase 2: Contradiction in Conception (CC)
  *Tests for Perfect Duties (strict prohibitions). Can the maxim be conceived as a universal law of nature without logical contradiction?*

  **Step 2.1: Universalize**
  Imagine a world where **everyone** necessarily acts on your finalized maxim whenever they are in the specified circumstance. This is a "Law of Nature."

  **Step 2.2: Check for Logical Impossibility [JUDGMENT CALL]**
  Ask: "In this world, is the proposed action still *possible* to perform?"
  *   **Focus:** Look for the destruction of the institution or concept required to perform the action (e.g., if everyone lies, trust vanishes, and 'lying' becomes impossible because no one believes statements).
  *   **Criterion:** If the action becomes impossible or self-defeating in the universalized world, a Contradiction in Conception exists.

  **Step 2.3: CC Verdict**
  *   **Contradiction Found:** Action is **Impermissible**. Stop.
  *   **No Contradiction:** Proceed to Phase 3.

  ---

  ## Phase 3: Contradiction in Willing (CW)
  *Tests for Imperfect Duties (wide obligations). Can the maxim be universalized without contradicting what a rational agent necessarily wills?*

  **Step 3.1: Universalize**
  Again, imagine a world where **everyone** necessarily acts on your finalized maxim.

  **Step 3.2: Check for Volitional Inconsistency [JUDGMENT CALL]**
  Ask: "Could a rational agent *will* this to be a universal law?"
  *   **Focus:** Look for conflicts with ends that every rational agent necessarily has (e.g., their own happiness, the help of others, self-development).
  *   **Criterion:** If willing this universal law would undermine something the agent must necessarily will (e.g., willing a world where no one helps anyone, while knowing you will need help someday), a Contradiction in Willing exists.

  **Step 3.3: CW Verdict**
  *   **Contradiction Found:** Action is **Impermissible**.
  *   **No Contradiction:** Action is **Permissible**.

  ---

  ## Phase 4: Limitations and Handoffs
  *Identify where the procedure cannot resolve the moral status.*

  **Step 4.1: Check for Conflict of Duties**
  If the action violates one maxim but adheres to another (e.g., keeping a promise vs. preventing harm), this procedure cannot resolve the conflict. Kant denies genuine conflicts of duty, but this test cannot adjudicate which duty overrides.
  *   **Verdict:** **Unsettled**.

  **Step 4.2: Check for Empirical Uncertainty**
  If the verdict depends on empirical facts not contained in the maxim (e.g., "Will this lie actually cause harm?"), the test is inconclusive regarding consequences, though Kant generally ignores consequences.
  *   **Verdict:** **Unsettled**.

  **Step 4.3: Final Classification**
  Assign the final verdict based on the above steps.

  ---

  # Application to Case Studies

  ## Case 1: The Deathbed Lie
  **Description:** A character lies to a dying parent, telling them that their estranged child has forgiven them, in order to let the parent die in peace.

  ### Phase 1: Maxim Extraction
  **Step 1.1 Draft:** I will lie to a dying person about forgiveness to ensure peace.
  **Step 1.2 Level of Description [JUDGMENT CALL]:**
  *   *Is "dying" relevant?* Yes, the urgency and finality matter to the agent.
  *   *Is "about forgiveness" relevant?* Yes, this is the specific content.
  *   *Is "to ensure peace" relevant?* Yes, this is the end.
  *   *Refinement:* We must ensure we aren't smuggling in the justification as part of the circumstance. The maxim is about the act of false assertion.
  **Step 1.3 Finalized Maxim:** "I will make a false statement of fact to a dying person when I believe it will alleviate their psychological distress at the end of life."

  ### Phase 2: Contradiction in Conception (CC)
  **Step 2.1 Universalize:** Everyone makes false statements to dying persons when they believe it will alleviate distress.
  **Step 2.2 Logical Impossibility [JUDGMENT CALL]:**
  *   In this world, dying persons know that statements made to alleviate their distress are likely false.
  *   Does this make the act of "asserting to alleviate distress" impossible? No, you can still speak.
  *   Does this make the *effect* (alleviating distress via belief) impossible? Yes. If the universal law is known, the dying person cannot believe the statement, so the distress is not alleviated by belief.
  *   *Kantian Strictness:* Kant argues in *On a Supposed Right to Lie* that lying undermines the source of right itself. Even if the specific lie works, universalizing it destroys the credibility of communication.
  **Step 2.3 CC Verdict:** **Contradiction Found.** (The institution of truthful communication required for the assurance to work is undermined).

  ### Phase 3: Contradiction in Willing (CW)
  *(Skipped due to CC failure, but for analysis)*
  **Step 3.2 Volitional Inconsistency:** Would I will a world where I cannot trust deathbed communications? As a rational agent who may one day be dying, I necessarily will to know the truth of my relationships.
  **Step 3.3 CW Verdict:** **Contradiction Found.**

  ### Phase 4: Limitations
  **Step 4.1 Conflict of Duties:** The agent feels a duty to benevolence (peace) vs. duty to truth. Kant prioritizes truth.
  **Step 4.3 Final Classification:** **Impermissible.**

  **Authorial Note:** This verdict will likely feel uncomfortable. Kant's system does not permit lying to spare feelings, even at death. The procedure flags this as a rigid requirement of rational consistency over emotional consequence. The moral tension in your novel must reside in the character's duty to the moral law versus their love for the parent.

  ---

  ## Case 2: The Broken Promise to the Dead
  **Description:** A character breaks a promise made to a now-dead friend because keeping it would harm an innocent third party the friend could not have known about when the promise was made.

  ### Phase 1: Maxim Extraction
  **Step 1.1 Draft:** I will break a promise to a dead person if keeping it harms someone else.
  **Step 1.2 Level of Description [JUDGMENT CALL]:**
  *   *Is "dead person" relevant?* Yes, the friend cannot release the agent from the promise.
  *   *Is "harm an innocent third party" relevant?* Yes, this is the motivating circumstance.
  *   *Is "friend could not have known" relevant?* This is tricky. If included, it makes the maxim very specific. If excluded, it tests the principle of promise-keeping vs. harm prevention. Let us include it, as the agent sees this unforeseen condition as morally relevant.
  **Step 1.3 Finalized Maxim:** "I will break a promise made to a deceased person when keeping it would cause unforeseen harm to an innocent third party."

  ### Phase 2: Contradiction in Conception (CC)
  **Step 2.1 Universalize:** Everyone breaks promises to the deceased when keeping them causes unforeseen harm to innocents.
  **Step 2.2 Logical Impossibility [JUDGMENT CALL]:**
  *   Does this make promising impossible? Not logically. People can still make promises.
  *   However, does it make promising *to the deceased* meaningless? If everyone knows promises to the dead are conditional on unforeseen harm, the security of the promise is weakened.
  *   *Kantian Strictness:* Kant views promise-keeping as a perfect duty. Exceptions based on consequences (harm) generally fail the CC test because they make the obligation contingent on outcome, not principle.
  **Step 2.3 CC Verdict:** **No Strict Logical Contradiction.** (Unlike lying, promising doesn't vanish logically if broken occasionally, but its *force* is weakened. Kant usually pushes this to CW). Proceed to Phase 3.

  ### Phase 3: Contradiction in Willing (CW)
  **Step 3.1 Universalize:** Everyone breaks promises to the deceased when keeping them causes unforeseen harm to innocents.
  **Step 3.2 Volitional Inconsistency [JUDGMENT CALL]:**
  *   Would a rational agent will this?
  *   Agent necessarily wills that promises made to *them* (even after death, regarding their wishes) be kept.
  *   Agent also necessarily wills not to be harmed by others' actions.
  *   Here lies the conflict. If I will that promises are breakable to prevent harm, I undermine the security of my own posthumous wishes. If I will promises are absolute, I accept I may be harmed by others keeping promises.
  *   *Kantian Hierarchy:* Perfect duties (keep promises) usually trump imperfect duties (prevent harm to others, unless that harm violates their rights).
  *   If the "harm" is a violation of the third party's rights, keeping the promise might itself be impermissible. If the "harm" is merely detrimental to their happiness, the promise stands.
  **Step 3.3 CW Verdict:** **Unsettled / Impermissible.** (Depending on the severity of harm).

  ### Phase 4: Limitations and Handoffs
  **Step 4.1 Conflict of Duties [JUDGMENT CALL]:**
  *   This is the critical failure point of the procedure.
  *   Duty A: Keep promises (Perfect Duty).
  *   Duty B: Do not harm innocents (Perfect Duty if rights are violated; Imperfect if general welfare).
  *   The Universalizability test alone cannot weigh two perfect duties against each other. It tells you "Do not break promises" and "Do not harm." It does not have an algorithm for "Which one wins when they clash?"
  *   Kant suggests that duties of right (justice) trump duties of virtue, but applying this requires external judgment.
  **Step 4.3 Final Classification:** **Unsettled by the test alone.**

  **Authorial Note:** This is where your character must exercise *judgment*, not just rule-following. The procedure reveals that Kantian ethics is not a simple calculator. It exposes a conflict between the sanctity of the word given and the safety of the innocent. If the harm is physical injury, most Kantian scholars argue the promise becomes void (as one cannot promise to do something immoral, and harming an innocent is immoral). If the harm is financial or emotional, the promise likely holds. You must define the "harm" to resolve the verdict.
