answer: |-
  This is a classic debate in political philosophy, touching on the distinction between **Negative Liberty** (freedom *from* interference) and **Positive/Republican Liberty** (freedom *to* act or freedom from *domination*). Your flatmate is quoting a version of Negative Liberty, but the devil is in the definition of "interference."

  Here is a menu of five distinct precise theses his slogan could be expressing, categorized by what counts as interference, the philosophical verdict on that definition, and how it applies to your zero-hours contract argument.

  ### 1. The Physicalist Thesis
  *   **The Claim:** Interference occurs *only* when physical force prevents movement.
  *   **What counts:** Locked doors, chains, physical restraint.
  *   **What doesn't count:** Threats, economic pressure, social norms, or lack of money.
  *   **Whose interference:** Any agent (human or otherwise) that physically blocks you.
  *   **Verdict:** **False.** While clear, this is too narrow to capture any useful concept of "liberty." Under this definition, a slave whose master never physically locks them up but threatens death if they leave is "free."
  *   **Implication for Zero-Hours:** **Supports Flatmate.** Since the employer is not physically restraining the worker, the worker is free.

  ### 2. The Intentional Agency Thesis (Classic Negative Liberty)
  *   **The Claim:** Interference requires a *deliberate human act* intended to constrain you.
  *   **What counts:** Laws, commands, direct threats, physical force initiated by people.
  *   **What doesn't count:** Natural obstacles, poverty, market forces, or unintended consequences of others' actions.
  *   **Whose interference:** Only other human beings (not "society" or "the economy").
  *   **Verdict:** **Substantive and Defensible.** This is the standard liberal view (e.g., Hobbes, Berlin). It distinguishes between being *prevented* by a person and being *unable* due to circumstances.
  *   **Implication for Zero-Hours:** **Supports Flatmate.** Poverty is a circumstance, not a human agent. The employer is not forcing the worker to accept; they are merely offering a contract. The "necessity" comes from the economy, not the employer's direct coercion.

  ### 3. The Moralized Baseline Thesis (Libertarian)
  *   **The Claim:** Interference is any action that worsens your position relative to your *moral entitlements*.
  *   **What counts:** Violations of property rights or existing contracts.
  *   **What doesn't count:** Refusing to give you something you have no right to (e.g., an employer refusing to pay for unworked hours).
  *   **Whose interference:** Other humans, but only if they violate your rights.
  *   **Verdict:** **Substantive and Defensible.** This relies on a specific theory of property rights (e.g., Nozick). It distinguishes between a *threat* ("Take this shift or I'll hurt you") and an *offer* ("Take this shift or you get nothing").
  *   **Implication for Zero-Hours:** **Supports Flatmate.** The employer owns the shifts. Offering them on specific terms is not interference; it is the exercise of their property rights. The worker's lack of alternatives is unfortunate but not a rights violation by the employer.

  ### 4. The Domination Thesis (Republican Liberty)
  *   **The Claim:** Interference includes the *capacity* of another to interfere arbitrarily, even if they don't use it.
  *   **What counts:** Being subject to the arbitrary will of another (dependency).
  *   **What doesn't count:** Constraints that are non-arbitrary (e.g., rule of law) or natural.
  *   **Whose interference:** Powerful agents upon whom you are dependent.
  *   **Verdict:** **Substantive and Defensible.** This is the Republican view (e.g., Pettit). It argues you are unfree if you live at the mercy of another's whim, regardless of whether they actually stop you.
  *   **Implication for Zero-Hours:** **Undermines Flatmate.** The worker is dependent on the employer's whim for income. Because the employer *can* arbitrarily withhold shifts without recourse, the worker is in a relationship of domination, rendering them unfree even if no direct coercion occurs.

  ### 5. The Unbounded Options Thesis (Positive Liberty/Capability)
  *   **The Claim:** Interference is *anything* that reduces your viable options, including internal or structural constraints.
  *   **What counts:** Poverty, lack of education, psychological pressure, as well as human coercion.
  *   **What doesn't count:** Nothing (any constraint counts).
  *   **Whose interference:** Everyone and everything (society, biology, economy).
  *   **Verdict:** **False (as a definition of interference).** As you noted, if "interference" means "anything affecting options," then gravity interferes with your freedom to fly. This makes the slogan a tautology ("Freedom is having no constraints") that describes an impossible state of existence.
  *   **Implication for Zero-Hours:** **Undermines Flatmate.** It validates your view that economic necessity constrains freedom. However, it risks making "freedom" synonymous with "power" or "wealth," which changes the subject from liberty to capability.

  ### Summary for Your Argument

  *   **To support his conclusion:** He must be arguing for **Thesis 2 (Intentional Agency)** or **Thesis 3 (Moralized Baseline)**. He needs to maintain that poverty is a "circumstance" and the contract is an "offer," not a "threat."
  *   **To undermine his conclusion:** You should push for **Thesis 4 (Domination)**. This avoids the trap of Thesis 5 (which he will easily dismiss as "wanting everything for free").
  *   **The Pivot:** Instead of arguing about "interference," ask him: *"Does freedom require security from the arbitrary will of others?"* If he says yes, he concedes the zero-hours worker is unfree (Thesis 4). If he says no, he is defending a version of freedom (Thesis 2/3) that allows a master to be free so long as they don't physically chain the slave.
