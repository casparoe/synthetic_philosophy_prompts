answer: |-
  This is a precise and well-identified cluster of phenomena. You are correct that while it overlaps with the EDT/CDT debate, it constitutes a distinct conceptual move regarding the *nature* of the correlation between agents.

  For a PhD student in decision theory, the short answer is that the specific move you are describing is most rigorously formalized under **Functional Decision Theory (FDT)** (and its predecessor, **Timeless Decision Theory** or TDT), relying on the concept of **subjunctive dependence** or **logical correlation**. The historical/popular term for the intuition is **Superrationality**.

  Here is a breakdown of the terminology, the formal literature, and the distinctions regarding validity vs. "magical thinking."

  ### 1. The Terminology

  **Superrationality**
  Coined by Douglas Hofstadter (in *Metamagical Themas*, 1985), this is the specific label for the Prisoner's Dilemma intuition you described. Hofstadter argued that in a symmetric PD between rational agents, rationality dictates cooperation because each agent should recognize that their reasoning is a "mirror" of the other's. If I decide to cooperate, the logic I used to get there is the same logic the other person is using. Therefore, my decision *is* their decision, logically speaking.
  *   *Status:* Intuitive and influential, but not formally rigorous in standard game theory.

  **Subjunctive Dependence / Logical Correlation**
  This is the technical mechanism proposed by Eliezer Yudkowsky (TDT, 2010) and later Yudkowsky & Soares (FDT, 2017).
  *   **CDT** treats the other agent's move as causally independent.
  *   **EDT** treats the other agent's move as evidentially correlated (conditional probability).
  *   **FDT** treats the other agent's move as **logically dependent**. It posits that you are not choosing an *action* (cooperate/defect), but rather the *output of a decision algorithm*. If another agent is running a sufficiently similar algorithm, the output is logically constrained to be the same, regardless of spatial/temporal separation.
  *   *The Move:* You reason: "If my algorithm outputs 'Cooperate', then any agent running a isomorphic algorithm must also output 'Cooperate'."

  **Acausal Trade**
  This term (common in the rationalist/EA circles you mentioned) refers to extending this reasoning to agents with whom you have no causal contact whatsoever (e.g., future AIs, agents in other Everett branches, or simulated beings). It relies entirely on the FDT/TDT framework.

  ### 2. The Formal Literature

  If you want to trace the rigorous carving of this concept, these are the key nodes:

  *   **Hofstadter, D. (1985).** *Metamagical Themas.* (The origin of "Superrationality".)
  *   **Tennenholtz, M. (2004).** "Program Equilibrium." *Games and Economic Behavior.* This is crucial. Tennenholtz formalizes the idea of agents submitting source code to a game. If the code matches, they cooperate. This provides a game-theoretic foundation for "logical correlation" without needing metaphysical claims about timelessness.
  *   **Yudkowsky, E. (2010).** "Timeless Decision Theory." (Unpublished manuscript, widely circulated in the field.) Introduces subjunctive dependence.
  *   **Yudkowsky, E., & Soares, N. (2017).** "Functional Decision Theory: A New Theory of Instrumental Rationality." *arXiv:1710.05060.* This is the definitive technical statement. It explicitly distinguishes FDT from CDT and EDT using the "Psychopath Button" and "Newcomb's Problem" cases, but applies directly to the Symmetric PD.
  *   **Parfit, D. (1984).** *Reasons and Persons.* While not using the FDT label, Parfit's discussion of the "Common Sense Theory of Rationality" vs. "Self-Interest Theory" in the context of the Prisoner's Dilemma and voting covers the moral/philosophical ground of why individual causal efficacy might be the wrong metric.

  ### 3. Valid Reasoning vs. "Magical Thinking"

  You asked for the literature that distinguishes valid applications from spurious ones. This is the main point of contention between FDT proponents and standard CDT/Evidentialists (like James Joyce or David Lewis).

  **The Valid Case (Logical Facts)**
  The reasoning holds when the correlation is grounded in a **logical fact**.
  *   *Example:* Two computers running the exact same source code in separate rooms.
  *   *Why:* It is a mathematical truth that $f(x) = f(x)$. If I compute $f$, the other computer computes $f$. My "choice" is the discovery of the output of $f$.
  *   *FDT View:* This is not magic; it is reasoning about logical necessity.

  **The "Magical" Case (Spurious Correlation)**
  The reasoning fails when the correlation is merely **statistical** or **indexical** without logical necessity.
  *   *Example:* "I am wearing a red shirt, therefore other people like me will wear red shirts."
  *   *Why:* There is no logical function linking my shirt choice to theirs.
  *   *The Voting/Vegetarianism Nuance:* This is where it gets messy.
      *   **CDT/Standard View:** Voting is causally negligible. Doing it because "others like me will" is the **Fallacy of Composition** or magical thinking unless there is a causal mechanism (e.g., social signaling).
      *   **FDT View:** Voting is rational *if* you view yourself as a token of a decision algorithm shared by a demographic. If you decide "Vote," and 10,000 others run the "Vote if Utilitarian > Cost" algorithm, you have collectively caused the outcome.
      *   **The Critique:** Critics argue that unless you have *proof* that others are running your algorithm, assuming logical correlation is unjustified optimism. FDT proponents argue that in the absence of specific differences, you should treat similar agents as running similar algorithms (principle of indifference over algorithms).

  ### 4. Distinguishing from Closest Concepts

  To ensure precision in your own work, here is how to separate this cluster from its neighbors:

  | Concept | Mechanism | Key Difference from your Pattern |
  | :--- | :--- | :--- |
  | **Causal Decision Theory (CDT)** | Causal Counterfactuals | Explicitly *rejects* your pattern. Treats other's move as fixed/independent. |
  | **Evidential Decision Theory (EDT)** | Conditional Probability | Accepts the correlation as *evidence*, but not as a *control variable*. EDT cooperates in PD but fails "Tickle Defense" cases. FDT cooperates because it *controls* the logical output. |
  | **Rule Utilitarianism** | Moral Rules | Consequentialist outcome is similar (cooperate/vote), but justification is moral ("follow the rule that maximizes utility") rather than decision-theoretic ("my algorithm determines the output"). |
  | **Kantian Categorical Imperative** | Universalizability | "Act only according to that maxim..." sounds like Superrationality. However, Kant is deontological; your pattern is instrumental rationality (achieving the best payoff). |
  | **Program Equilibrium** | Code Submission | The game-theoretic formalization. Your pattern is the *informal reasoning* that leads to Program Equilibrium outcomes without the literal code submission. |

  ### 5. Summary for Your Research

  The specific move you are isolating is **reasoning via subjunctive dependence over decision algorithms**.

  *   If you want to frame it historically/philosophically: **Superrationality**.
  *   If you want to frame it formally/technically: **Functional Decision Theory (FDT)**.
  *   If you want to frame it game-theoretically: **Program Equilibrium** or **Logical Correlation in Games**.

  **The "Magic" Boundary:**
  The literature (specifically Soares & Yudkowsky) argues the reasoning is valid *if and only if* there is a logical constraint linking the decisions.
  *   **Valid:** Identical source code; agents who have proven they reason identically; agents who are logically isomorphic.
  *   **Invalid:** Agents who are merely "similar" in vague psychological traits without a shared decision algorithm.
  *   **Contested:** Agents who are "similar enough" that logical uncertainty suggests a high probability of isomorphic output (the Voting/Vegetarianism case). FDT says this is valid; CDT says this is magical thinking.

  For a PhD student, the **Yudkowsky & Soares (2017)** paper is the essential reference, as it attempts to axiomatize exactly the intuition you are describing and defend it against the charge of "magical thinking" by grounding it in the logic of counterpossibles.
