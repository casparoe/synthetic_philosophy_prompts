          *   What is the implicit theory of commodification/repugnance underlying this pattern?
          *   Is this view coherent?
          *   What happens if we swap rationales (e.g., apply kidney logic to eggs/plasma or vice versa)?
          *   Does this theory extend to price gouging bans?

  2.  **Initial Brainstorming & Legal Landscape:**
