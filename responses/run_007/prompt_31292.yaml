          2.  *Reproductive Gametes (Eggs):* Relational model. High stakes but framed as "helping families."
          3.  *Vital Organs (Kidneys):* Sacred model. Zero-sum, life/death, identity.
      *   **The Coherence Check:** Is it consistent? No. It's a patchwork of historical accidents (NOTA 1984 vs. evolving biotech markets).
      *   **The Exploitation Paradox:** Address the user's point about poverty. Why is egg exploitation okay but kidney exploitation isn't? (Answer: Visibility and Irreversibility).
      *   **Price Gouging Connection:** Is it the same theory? No, it's about market failure during emergencies, not bodily integrity. But they share a "moral economy" vibe.
      *   **Swapping Rationales:** What if we applied kidney logic to eggs? (Ban payment). What if we applied egg logic to kidneys? (Regulated market).
      *   **Conclusion:** The system isn't based on a single theory; it's based on *social comfort levels* with specific technologies at specific times.

  5.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Refining the "Time and Inconvenience" point:* This is the most important legal technicality. In *plasma*, you sit for 90 mins. In *eggs*, you undergo hormones + retrieval. In *kidneys*, the "inconvenience" is major surgery and loss of function. The law draws the line where the "service" becomes indistinguishable from the "product."
      *   *Refining the "Repugnance" theory:* Cite Alvin Roth (Nobel laureate). He talks about "repugnant markets." Kidney markets are repugnant because they violate the "sanctity of the body" in a way eggs don't. Eggs are *potential* life; kidneys are *current* life support.
