      *   *Eggs:* ASRM (American Society for Reproductive Medicine) guidelines, not federal law. Payment is for "time and effort," capped (soft cap) at ~$10k, though market rates vary.
      *   *Kidneys:* National Organ Transplant Act (NOTA) of 1984. Explicit federal ban on "valuable consideration."
      *   *Blood:* Mostly voluntary (Red Cross), but plasma is paid.
      *   *Sperm:* Paid, but low amounts.
      *   *Womb/Surrogacy:* Varies by state, often paid.
      *   *Price Gouging:* State consumer protection laws, emergency declarations. Different legal basis (contract law/unfair trade) vs. bodily integrity.

  3.  **Developing the "Implicit Theory":**
      *   It's not just about risk (eggs are risky).
      *   It's not just about regeneration (eggs aren't really regenerative in the same way plasma is).
      *   It's not just about exploitation (poor women sell eggs too).
      *   *Hypothesis 1: The "Gift Relationship" vs. Market.* Richard Titmuss. Blood/Organs = Gift. Plasma/Eggs = Service.
      *   *Hypothesis 2: Threat to the Self.* A kidney is a core part of identity/wholeness. Eggs are potential life, but not *you*. Plasma is fluid.
      *   *Hypothesis 3: Supply Elasticity & Necessity.* We need *lots* of plasma (chronic treatments). We need *few* kidneys (one-time transplant). If we pay for kidneys, the market might flood with desperate poor people, undermining the "altruistic system" trust.
      *   *Hypothesis 4: The "Time and Inconvenience" Legal Fiction.* This is crucial. The law pretends you aren't selling the *tissue*, you are selling the *labor* to get it. This works for plasma (hourly) and eggs (cycle based). It breaks for kidneys because the "labor" is indistinguishable from the loss of the organ.

  4.  **Structuring the Analysis:**
      *   **Introduction:** Acknowledge the journalist's sharp observation. Validate the inconsistency.
