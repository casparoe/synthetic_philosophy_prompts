  "The coast is clear," she said, though heavy rain
  Fell dark upon her unassuming sight.
  She saw no storm within her inner light,
  She claimed the sun without a hint of strain.
  "The coast is blocked," he said, though way was plain,
  He deemed it false, yet sought to hide the bright.
  He hid the passage in a crafted night,
  He spoke the fact to serve a purpose vain.

  One heart was single, though fact went clean astray,
  No secret chamber hid the thought from speech.
  No double heart allowed the lie to dwell;
  But one chose night while standing in the day,
  And used the fact to make a deceitful breach,
  For where the will divides, the lies excel.
