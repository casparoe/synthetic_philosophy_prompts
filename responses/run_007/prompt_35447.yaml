  *   Clarify that prioritarianism is distinct from egalitarianism (non-relational vs. relational) rather than a "form" of it.
  *   Refine the evaluation to explain that prioritarianism captures the moral impulse to help the worse-off via the priority weighting mechanism itself, not via a derivative commitment to equality.

