answer: |-
  It is entirely understandable that you find your brother-in-law's heuristic frustrating. As you know, 'What if everybody did that?' is the folk-ethics equivalent of a sledgehammer: it delivers a heavy blow, but it lacks the precision of a scalpel. Because it is vague, it is difficult to parry. It conflates empirical predictions with normative principles, and acts with maxims.

  Since you teach the *Groundwork*, I shall not labour the basics of the Categorical Imperative. Instead, I offer a menu of the distinct philosophical theses that slogan might be encoding. You can deploy these to force him to specify which claim he is actually making. In my experience, engineering minds often prefer Rule-Consequentialism but dress it up in Kantian clothing because the latter sounds more absolute.

  Here is the breakdown of the distinct precise theses, their plausibility, and their application to the parking case.

  ### 1. The Rule-Consequentialist Claim
  **The Thesis:** An act is wrong if the general adoption of the rule permitting that act would produce worse overall consequences than the general adoption of a rule forbidding it.
  **The Mechanism:** This is not about the act itself, but the *practice*. If the rule 'Skip payment for short stops' became universal, the revenue model for the car park would collapse, spaces would not be maintained, or fees would rise prohibitively for everyone else.
  **Evaluation:** **Plausible.** This is the strongest empirical argument against your position.
  **Does it get the conclusion?** **Yes.** It successfully argues that skipping the fee is wrong, not because of the immediate harm (which you admitted is negligible), but because of the systemic risk.
  **The Pushback:** This relies on an empirical threshold. Does *everybody* need to do it to break the system, or merely *enough* people? If the car park is vast and empty, the consequentialist harm is virtually zero. You can ask him: 'At what percentage of compliance does the system collapse? If I am the only one doing it, am I still wrong?' If he says yes, he has abandoned consequentialism for something deontological.

  ### 2. The Kantian Claim: Contradiction in Conception (CC)
  **The Thesis:** An act is wrong if the maxim behind it cannot be conceived as a universal law of nature without a logical contradiction.
  **The Mechanism:** We must look at the maxim, not the act. If the maxim is 'I will use public parking facilities without paying whenever I choose', a world where this is a universal law implies the concept of 'paid parking' ceases to exist. You cannot logically will to use a 'paid service' in a world where no one pays.
  **Evaluation:** **Plausible, but technical.** This is the classic 'false promising' argument applied to fees.
  **Does it get the conclusion?** **Yes.** It renders the act irrational.
  **The Pushback:** This depends entirely on how the maxim is described (see below). If the maxim is 'I will not pay when the cost is disproportionate to the service', can that be universalised? Perhaps. A world where people only pay for value might not involve a logical contradiction, merely a different economic model.

  ### 3. The Kantian Claim: Contradiction in the Will (CW)
  **The Thesis:** An act is wrong if, although the maxim can be *conceived* as a universal law, it cannot be *willed* as such without contradicting other necessary ends of the agent.
  **The Mechanism:** You can conceive of a world where no one pays for parking (chaos, or no parking). But as a rational agent, you will that parking spaces exist and are maintained. Therefore, you cannot rationally will a universal law that destroys the conditions necessary for your own end (parking).
  **Evaluation:** **Very Plausible.** This is likely the strongest Kantian argument for this specific case. It is a duty of justice regarding public institutions.
  **Does it get the conclusion?** **Yes.** It frames the issue as undermining a system you rely upon.
  **The Pushback:** This admits of exceptions. If there is an alternative system (e.g., voluntary donation), you could will that. It also relies on the assumption that paid parking is the *only* way to secure the end.

  ### 4. The Fairness (Free-Rider) Claim
  **The Thesis:** It is wrong to benefit from a cooperative scheme without bearing one's fair share of the burdens, provided the scheme is just and others are complying.
  **The Mechanism:** This is not about consequences or logic, but reciprocity. By skipping the fee, you gain an advantage over those who pay. You are treating the compliant drivers as mere means to your end (free parking).
  **Evaluation:** **Plausible.** This is often what people *mean* when they use the slogan, even if they don't articulate it this way.
  **Does it get the conclusion?** **Yes.** It bypasses the 'negligible harm' argument entirely. The harm isn't to the car park owner; it's to the other drivers who are being 'suckered'.
  **The Pushback:** This relies on the scheme being just. If the parking fees are extortionate or the revenue is misused, the obligation to fairness weakens. You can ask: 'Is the fee fair? If the council spends the money on something useless, am I still bound?'

  ### 5. The Virtue Ethics Claim
  **The Thesis:** An act is wrong if it cultivates a vice or reflects a deficient character.
  **The Mechanism:** The question is not 'What if everybody did that?' but 'What sort of person does that?' Doing the act makes you the sort of person who cuts corners when they think they can get away with it.
  **Evaluation:** **Plausible.**
  **Does it get the conclusion?** **Yes.**
  **The Pushback:** This is ad hominem in the philosophical sense. It judges the agent, not the act. You can argue that a virtuous person also knows when rules are pedantic and when they serve a purpose. Blind obedience is not necessarily a virtue.

  ---

  ### The Problem of Act Description (Framing)

  This is the leverage point you are looking for. The slogan 'What if everybody did *that*?' is unstable because '*that*' is ambiguous.

  *   **Description A (Specific):** 'What if everybody skipped the fee when staying for less than ten minutes in an empty lot?'
      *   *Result:* The system probably survives. The harm is negligible. The conclusion (it's wrong) fails.
  *   **Description B (General):** 'What if everybody broke minor rules when they were confident they'd get away with it?'
      *   *Result:* Social trust collapses. The conclusion (it's wrong) holds.

  Your brother-in-law relies on sliding between Description B (to get the moral force) and Description A (to apply it to the specific case).

  **Does Kant escape this?**
  No, not entirely. The 'maxim formulation' problem is the standard objection to the first formula of the Categorical Imperative. Kant requires us to universalise the *maxim*, not the *act*. But maxims are descriptions of acts under an aspect.
  *   If I formulate my maxim as 'I will not pay for parking', it fails.
  *   If I formulate it as 'I will not pay for services I do not meaningfully consume', it might pass.

  The work is being done by the description. If the description is too specific, anything can be universalised (e.g., 'I will lie on Tuesdays'). If it is too general, nothing can be (e.g., 'I will do what I want'). Kant attempts to solve this by insisting maxims must include the *reason* for the action, but there is still room for manoeuvre.

  **CC vs. CW in this context:**
  In the parking case, the Contradiction in Conception is weak. It is not logically impossible for everyone to park for free; the car park simply becomes a commons. The real force comes from the Contradiction in the Will (you need the system to function) or the Fairness claim. Your brother-in-law's slogan usually implies a CC ('The system would break!'), but it is often actually a CW or Consequentialist claim ('The system *should* be preserved').

  **Act vs. Maxim:**
  The slogan universalises an *act* ('did *that*'). This is a category error.
  *   **Act:** 'Not putting money in the meter.'
  *   **Maxim:** 'Not putting money in the meter *in order to save £2 because I believe the service is unnecessary for short stops*.'
  Kant's test applies to the latter. If your brother-in-law insists on universalising the act alone, he is not doing Kantian ethics; he is doing a crude form of rule-worship.

  ### Summary for your next discussion

  When he deploys the slogan, you might try this sequence:

  1.  **Isolate the Thesis:** 'Are you saying the *consequences* would be bad if everyone did it, or that the *principle* is contradictory?' (Force him to choose between Consequentialism and Kant).
  2.  **Challenge the Description:** 'Everybody doing *what* exactly? Skipping fees for ten minutes? Or skipping fees whenever they feel like it? The first might be sustainable; the second is not.'
  3.  **The Free-Rider Angle:** 'If you mean it's unfair to the other payers, say that. That's a fairness argument, not a "what if everybody" argument. And if it's a fairness argument, does it hold if the fee is unjust?'
  4.  **The Kantian Correction:** 'If we are being Kantian, we must universalise the maxim, not the act. My maxim is about proportional use of resources. Can you show a contradiction in willing that?'

  In short, the slogan is a rhetorical device that borrows authority from Kant and Mill without doing the work required by either. It is not a 'simple point'; it is a compressed argument that falls apart when unpacked.
