  To: Program Committee
  From: [Your Name]
  Date: [Current Date]
  Subject: Decision Memo on Submission #[ID]

  I recommend accepting this submission as a short position note contingent on specific revisions to its claims regarding the Church-Turing Thesis.

  The technical core of this paper is sound; the description of the Malament-Hogarth spacetime setup and the resulting ability to perform supertasks within that specific relativistic model is a legitimate contribution to the study of relativistic computation. However, the committee's split reflects a deeper ambiguity in how we frame the relationship between physical law and computability theory. My recommendation seeks to preserve the technical insight while correcting the philosophical overreach that makes a main-track acceptance problematic.

  The reviewers arguing for rejection or major revision are correct that the standard Church-Turing Thesis (CTT) is primarily a claim about effective calculability—specifically, what can be computed by a human following a fixed algorithm without insight or error. Under this definition, which dominates our field's foundations, exotic spacetimes do not constitute a refutation because the "effective procedure" itself remains unchanged; only the physical substrate allowing its execution differs. Accepting the paper as a main-track result claiming a definitive refutation of CTT risks conflating the mathematical definition of an algorithm with the physical limits of our universe, which could mislead readers regarding the status of computability theory.

  However, we must engage seriously with the opposing view held by the other two reviewers: that the CTT also functions as an empirical hypothesis about what physical devices can compute. On this reading, often termed the "Physical Church-Turing Thesis," the thesis is indeed vulnerable to counterexamples from general relativity. Dismissing this perspective as "confused" is too quick; if computer science is to remain grounded in physical reality, we must acknowledge that what is computable *in principle* (mathematically) may differ from what is computable *in practice* (physically). The authors are right to highlight that if our universe permits Malament-Hogarth spacetimes, the limits of physical computation expand beyond the Turing bound.

  To resolve this, the paper must be revised to explicitly distinguish between the Mathematical CTT and the Physical CTT. Specifically, the authors must: (1) revise the abstract and conclusion to state that they are challenging the *Physical* Church-Turing Thesis, not the standard thesis regarding effective calculability; (2) remove language suggesting that the concept of an algorithm itself is broken, focusing instead on the realizability of algorithms in exotic spacetimes; and (3) shorten the exposition to fit the position note format, as the philosophical argument requires more nuance than a full paper allows given the current draft. This path validates the physical insight without compromising the conceptual precision required of our main track.
