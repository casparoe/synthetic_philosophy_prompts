answer: |-
  # Desiderata for a Theory of Slurs

  The following specification outlines the necessary conditions for an adequate linguistic and philosophical account of slurs. These criteria are divided into semantic/pragmatic mechanics, embedding behaviors, social dynamics, and critical distinctions. Each item includes the motivating case or contrast.

  ## I. Semantic and Pragmatic Interface

  **1. Truth-Conditional Equivalence (The Neutral Counterpart Constraint)**
  *   **Requirement:** The theory must explain why a slur ($S$) and its neutral counterpart ($N$) are extensionally equivalent (true of the same individuals) while differing in cognitive significance.
  *   **Contrast:** "Hans is German" vs. "Hans is a Kraut." Both are true under the same conditions, yet they are not interchangeable in ordinary discourse.
  *   **Status:** **Non-Negotiable (NN).** (Note: Some revisionist semantic theories challenge this, but any theory denying it must explain the overwhelming intuition of co-extensionality).

  **2. Derogation vs. Ordinary Insult**
  *   **Requirement:** The account must distinguish systemic, group-based derogation from personal, attribute-based insult.
  *   **Contrast:** Calling someone a "liar" or "idiot" attacks specific traits/behaviors. Calling someone a slur attacks their identity/group membership as a basis for inferiority.
  *   **Status:** **NN.**

  **3. The Contempt Contrast**
  *   **Requirement:** The theory must explain why a slur uttered without personal contempt still derogates, while a neutral term uttered with venom does not become a slur.
  *   **Contrast:** A bureaucrat filling a form with a slur (no personal hate) vs. a rival shouting "You idiot!" (high contempt). The former is a slur; the latter is an insult.
  *   **Status:** **NN.**

  ## II. Embedding and Projection (The Logic of Hate)

  **4. Survival Under Negation**
  *   **Requirement:** The derogatory force must persist when the term is negated.
  *   **Case:** "He is not a [slur]." This does not merely deny group membership; it often retains the offensive presupposition or implicature that the group is derogatory.
  *   **Status:** **NN (Fixed Data).**

  **5. Survival Under Conditionals and Questions**
  *   **Requirement:** The force must persist in non-assertoric contexts.
  *   **Case:** "If he is a [slur], he should leave" or "Is he a [slur]?" The speaker risks offense/derogation even without asserting the target's membership.
  *   **Status:** **NN (Fixed Data).**

  **6. Behavior in Attitude Reports**
  *   **Requirement:** The theory must specify whether the derogatory force is attributed to the subject of the attitude or the speaker.
  *   **Case:** "Alice believes that Bob is a [slur]." Does this report Alice's prejudice or implicate the speaker's? (Data is mixed; theory must accommodate the variance).
  *   **Status:** **Theory-Optional (Data is contested).** Some accounts require speaker endorsement; others allow opaque attribution.

  **7. Quotation and Mention**
  *   **Requirement:** The theory must distinguish between *using* a slur and *mentioning* it, explaining why mention is permissible in specific contexts (e.g., academic discussion).
  *   **Case:** A linguist saying "The word [slur] has five letters" vs. "He is a [slur]."
  *   **Status:** **NN.**

  ## III. Social Dynamics and Identity

  **8. Speaker Asymmetry (In-Group vs. Out-Group)**
  *   **Requirement:** The account must explain why the derogatory force is neutralized or altered when used by a member of the target group, but remains active for out-group speakers.
  *   **Case:** A Black speaker using the n-word vs. a White speaker using the n-word.
  *   **Status:** **NN.**

  **9. Reclamation and Semantic Change**
  *   **Requirement:** The theory must accommodate the diachronic process where a slur loses derogatory force within a community (appropriation) without claiming the word ceases to be a slur historically.
  *   **Case:** "Queer" shifting from a slur to a neutral/positive identity marker for some, but remaining a slur for others.
  *   **Status:** **NN.**

  **10. Variation Without Dissolution**
  *   **Requirement:** The theory must allow for intensity variation across communities and time without making the category of "slur" so fluid it dissolves.
  *   **Case:** A term may be highly volatile in one region and dormant in another, yet both count as slurs.
  *   **Status:** **NN.**

  ## IV. Critical Distinctions (Do Not Collapse)

  **11. Offense vs. Derogation**
  *   **Requirement:** Distinguish the psychological state of the hearer (offense) from the linguistic function of the term (derogation).
  *   **Contrast:** One can be offended by a truth (no derogation) and unoffended by a slur (in-group use, yet derogation remains for out-group listeners).
  *   **Status:** **NN.**

  **12. Speaker Identity vs. Term Content**
  *   **Requirement:** The theory must balance the contribution of the speaker's social position against the conventional content of the word.
  *   **Contrast:** A slur said by an outsider is worse than the same slur said by an insider, but the word itself carries the history.
  *   **Status:** **NN.**

  **13. Taboo vs. Falsity**
  *   **Requirement:** Explain why slurs are prohibited (taboo) independently of their truth value.
  *   **Contrast:** A true statement using a slur is still impermissible; a false statement using a neutral term is merely incorrect.
  *   **Status:** **NN.**

  ---

  # Classification of Requirements

  | Requirement | Status | Notes |
  | :--- | :--- | :--- |
  | **Truth-Conditional Equivalence** | **NN** | Denying this requires radical revision of semantics. |
  | **Derogation vs. Insult** | **NN** | Core definitional boundary. |
  | **The Contempt Contrast** | **NN** | Separates semantic force from prosodic intent. |
  | **Survival Under Negation** | **NN** | The primary "projection" data point. |
  | **Survival Under Conditionals** | **NN** | Confirms projection is not an artifact of assertion. |
  | **Behavior in Attitude Reports** | **Camp-Specific** | Expressivists and Presuppositionalists disagree on data interpretation. |
  | **Quotation and Mention** | **NN** | Any theory failing this is practically unusable. |
  | **Speaker Asymmetry** | **NN** | Essential for social accuracy. |
  | **Reclamation** | **NN** | Essential for diachronic accuracy. |
  | **Variation Without Dissolution** | **NN** | Prevents category error. |
  | **Offense vs. Derogation** | **NN** | Prevents psychological reductionism. |
  | **Speaker Identity vs. Content** | **NN** | Prevents pure contextualism or pure invariantism. |
  | **Taboo vs. Falsity** | **NN** | Prevents epistemic reductionism. |

  ---

  # Tensions and The Eliminator

  ### Incompatible Pairs (Theoretical Tensions)
  While the *phenomena* above are non-negotiable, satisfying them simultaneously creates tension for specific *mechanisms*.

  1.  **Truth-Conditional Equivalence vs. Projection as Semantic Content:**
      *   If $S$ and $N$ have identical truth conditions, the derogation must be non-truth-conditional (e.g., implicature, expressivism). But if it is non-truth-conditional, standard pragmatic theory suggests it should be cancelable under negation. It is not.
      *   *Tension:* Maintaining equivalence while explaining non-cancelability.

  2.  **Semantic Stability vs. In-Group Non-Derogation:**
      *   If the derogatory force is encoded in the semantic content (invariantism), it is difficult to explain how in-group use lacks that force without positing ambiguity (two different words). If it is context-sensitive, it is difficult to explain why out-group use is *always* derogatory regardless of intent.
      *   *Tension:* Explaining how the same word can be derogatory for Speaker A and non-derogatory for Speaker B without fracturing the lexicon.

  ### The Single Eliminator
  **Requirement #4: Survival Under Negation (combined with #1 Truth-Conditional Equivalence).**

  This pair eliminates the most leading candidate theories.
  *   **Eliminates Pure Gricean Implicature:** Implicatures are cancelable. "He is not a [slur], and I don't mean to imply anything bad about that group" should work, but it doesn't.
  *   **Eliminates Pure Truth-Conditional Content:** If the derogation were truth-conditional, negating the sentence ("He is not a [slur]") should negate the derogation. It does not.
  *   **Eliminates Simple Speech Act Theory:** If the derogation is merely an illocutionary effect of asserting, negation (which suspends assertion) should suspend the effect. It does not.

  This constraint forces theories into **Presuppositional**, **Conventional Implicature**, or **Hybrid Semantic-Pragmatic** frameworks, as these are the only mechanisms that allow content to project through logical operators while maintaining truth-conditional equivalence with a neutral counterpart.
