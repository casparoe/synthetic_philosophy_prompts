      *   *Eliminator:* Will identify.

  8.  **Refining the "Fixed Data" vs "Theory-Optional":**
      *   Fixed: Negation doesn't cancel the slur's force.
      *   Optional/Debated: Does it project from *belief reports*? (Some say "John believes he is a [slur]" attributes the slur to John, not the speaker. Others say it implicates the speaker too). I need to be precise here. The standard data is that it projects from negation and conditionals. Attitude reports are trickier (attribution vs. endorsement). I will list Attitude Reports as a site of contention/data refinement.

  9.  **Final Polish:** Ensure tone is analytical and rigorous, matching the user's request for a "full specification." Avoid taking sides, just set the table.

