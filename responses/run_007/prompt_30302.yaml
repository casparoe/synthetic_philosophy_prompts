      *   **Goal:** Provide a full specification of requirements an adequate account must meet before evaluating specific theories.
      *   **Specific Inclusions:**
          *   Slur vs. Ordinary Insult.
          *   Slur vs. Neutral Counterpart (truth-conditional difference).
          *   Derogatory force under embedding (negation, conditionals, questions, attitude reports, quotation, mention).
          *   Fixed data vs. theory-optional regarding embedding.
          *   In-group use, reclamation, speaker asymmetry.
          *   Variation across communities/time (without category dissolution).
          *   Distinctions not to collapse (offense vs. derogation, mention vs. use, identity vs. content, taboo vs. false).
          *   Slur without contempt vs. Contemptuous non-slur.
      *   **Formatting/Structure:**
          *   List desiderata with cases/contrasts motivating each.
          *   Mark requirements as Non-Negotiable (NN) vs. Camp-Specific (CS).
          *   Flag incompatible pairs (tensions).
          *   Identify the single requirement that eliminates the most leading candidates.
          *   Keep theory scorecards brief; focus on criteria.

  2.  **Deconstruct the Phenomenon (Slurs):**
      *   What makes a slur a slur? It's not just mean. It's systemic, identity-based, and linguistically peculiar.
      *   *Truth-Conditions:* Does "X is a [slur]" mean the same as "X is a [neutral]"? Most say yes (extensionally), but the *force* differs.
      *   *Projection:* Slurs seem to retain their sting even when negated ("He isn't a [slur]"). This is the "projection problem."
      *   *Appropriation:* In-group members can use them without derogation. Out-group cannot.
      *   *Offense:* You can offend without slurring (accidental), and slur without offending (in-group), but the *derogation* is the core semantic/pragmatic feature.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Truth-Conditional Equivalence.* A theory must explain why "X is a [slur]" and "X is a [neutral]" are often treated as truth-conditionally equivalent (both true of the same group) despite the difference in force.
          *   *Contrast:* "He is a German" vs. "He is a Kraut."
          *   *Status:* NN (mostly, though some expressivists dispute this).

      *   *Item 2: Derogatory Content vs. Insult.* Distinguish systemic derogation from personal insult.
          *   *Contrast:* Calling someone an "idiot" (insult) vs. a racial slur (group-based derogation).
          *   *Status:* NN.

      *   *Item 3: Projection/Embedding.* How does the hate survive logical operators?
          *   *Cases:* Negation ("Not a [slur]"), Conditionals ("If he is a [slur]..."), Questions ("Is he a [slur]?").
          *   *Fixed Data:* The offense/derogation usually projects (survives).
          *   *Status:* NN.

      *   *Item 4: Speaker Asymmetry (In-Group/Out-Group).*
          *   *Case:* A member of group G using S_G vs. non-member using S_G.
          *   *Status:* NN.

      *   *Item 5: Reclamation/Appropriation.*
          *   *Case:* "Queer," "Nigga." How does the meaning change over time?
          *   *Status:* NN (theory must accommodate, even if mechanism varies).

      *   *Item 6: Variation and Stability.*
          *   *Case:* Slurs vary in intensity across regions/eras but remain slurs.
          *   *Status:* NN.

      *   *Item 7: Distinctions (The "Do Not Collapses").*
          *   Offense vs. Derogation (can slur without offending in-group; can offend without slur).
          *   Use vs. Mention (quoting a slur).
          *   Speaker Identity vs. Term Content (who says it matters, but the word carries weight).
          *   Taboo vs. False (slurs aren't false, they are prohibited).
          *   *Status:* NN.

      *   *Item 8: The Contempt Contrast.*
          *   *Case:* Saying a slur neutrally (reporting) vs. saying "idiot" with venom.
          *   *Status:* NN.

  4.  **Refining and Categorizing (NN vs. CS):**
      *   *NN:* Data that actually exists. (e.g., Slurs project under negation).
      *   *CS:* Explanatory mechanisms. (e.g., Is the derogation *semantic* or *pragmatic*? Is it *truth-conditional* or *expressive*?).
      *   *Correction:* The prompt asks to mark requirements as NN or CS. Usually, the *phenomenon* is NN, the *explanation* is where camps differ. I need to frame the desiderata as "The theory must account for X." If a theory denies X exists, it fails. So most are NN. CS would be things like "The theory must posit a separate semantic dimension" (Presupposition vs. Expressivism). I will frame them as "Must account for..." and mark the *nature* of the requirement. Actually, better to mark if the *requirement itself* is contested.
      *   *Decision:* Most linguistic data points are NN. Theoretical commitments (e.g., "Must be semantic") are CS. I will label the desiderata based on whether the *phenomenon* is universally accepted (NN) or if the *requirement* reflects a specific theoretical stance (CS).
      *   *Wait, re-reading prompt:* "Mark which requirements are non-negotiable and which are the demands of a particular camp." Okay. So, "Must explain projection" is NN. "Must explain projection via conventional implicature" is CS. I will write the desiderata as "Must explain X" (NN) but note where camps disagree on X's existence (rare) or mechanism.
      *   *Actually, looking at the literature:* There is debate on whether truth-conditions are *actually* identical. Some say slurs have different truth conditions (homophobe vs non-homophobe world). I should mark Truth-Conditional Equivalence as NN *for the neutral counterpart comparison* but acknowledge the debate. Let's stick to the consensus data: Extensionally equivalent, intensionally distinct.
      *   *Camp Specific:* Demands like "Must be purely pragmatic" or "Must be purely semantic." I will list the *phenomenal* requirements as NN and note theoretical splits where relevant.

  5.  **Identifying Tensions (Incompatible Pairs):**
      *   *Tension 1:* Truth-Conditional Equivalence vs. Projection as Semantic. If meaning is identical to neutral, why does negation fail to cancel? (The Frege-Geach problem for Expressivism).
      *   *Tension 2:* In-Group Non-Derogation vs. Semantic Content. If the word *means* derogation semantically, how can in-group use lack it without changing the meaning? (Context-sensitivity vs. Semantic Stability).
      *   *Big Eliminator:* The "Projection + In-Group" combo kills simple Pragmatic accounts and simple Semantic accounts. The hardest constraint is usually **Projection under Negation combined with In-Group Non-Derogation.**
      *   *Wait, the prompt asks:* "say which single requirement does the most to eliminate the leading candidate theories."
      *   *Candidate:* **Projection of Derogatory Force under Negation (while maintaining Truth-Conditional Equivalence).** This kills pure Gricean implicature (cancelable) and pure Truth-Conditional content (would make negation truth-functional). It forces complex hybrid or presuppositional views.

  6.  **Structuring the Output:**
      *   Introduction: Scope and Purpose.
      *   Section 1: Core Semantic/Pragmatic Interface (Truth, Counterparts, Insults).
      *   Section 2: Embedding and Projection (The Logic of Hate).
