answer: |-
  Based on the track record of cases your friend has already judged, here is an analysis of her ethical framework, predictions for the new cases, and the specific tests needed to settle your debate.

  ### 1. The Rule Fitting Her Track Record
  Your friend is not running pure Act Consequentialism. If she were, the "accidental snail" case would likely register as at least *unfortunate* (negative utility), and the "hunter" case would be wrong solely because of the deer's suffering, not the sport.

  Instead, her judgments fit a **Hierarchy of Intention (Cetana) Model**, which is traditional to Buddhist ethics. The rule looks like this:
  *   **Primary Metric:** The moral quality of an act is determined by the *intention* (volition) behind it, not just the outcome.
  *   **The Three Poisons:** Acts motivated by Greed, Hatred, or Delusion (Hunter, Snapping) are **Wrong**.
  *   **Compassionate Exceptions:** Acts motivated by Loving-Kindness or Compassion can override the precepts against Lying and Stealing (Haircut, Bread).
  *   **The Hard Constraint:** The First Precept (against killing) is stricter than the others. You cannot *intend* to kill, even for compassion. However, you may perform an act where death is a *foreseen side-effect* but not the intention (Morphine).
  *   **Accidents:** Without intention, there is no karma (Snail).

  ### 2. Alternative Rules That Fit Just As Well
  Two other frameworks could explain her answers so far:
  *   **Rule Consequentialism:** "Follow rules against killing/lying/stealing because they generally maximize well-being, but break them if following them would cause catastrophic suffering." (This fits the bread and haircut, but struggles to explain why the Morphine case is distinct from the Hunter case without importing intention).
  *   **Virtue Ethics:** "What would a wise, compassionate person do?" A virtuous person doesn't kill for sport or snap in anger. A virtuous person might lie to spare feelings or steal to save a life. A virtuous person relieves pain (Morphine) but doesn't necessarily kill (Hunter).

  ### 3. Predictions for the New Cases
  Here is what she is likely to say, based on the **Hierarchy of Intention** model:

  *   **Case A: Lethal Injection (Active Euthanasia)**
      *   **Prediction:** **Wrong.**
      *   **Reasoning:** Unlike the morphine case, the *mechanism* of relief here is death. The doctor must *intend* for the patient to die to end the pain. In her framework, intending death violates the First Precept, regardless of how compassionate the motivation is. The morphine case was "okay" specifically because the intention was *pain relief*, with death merely foreseen.
  *   **Case B: Killing One to Save Five (Trolley Problem)**
      *   **Prediction:** **Wrong.**
      *   **Reasoning:** This requires the *intention* to kill an innocent person as a means to an end. Even though the outcome saves lives (which justified the bread theft), the *act* of intentional killing is a higher-order violation than stealing or lying.

  ### 4. Which New Case Tells the Rules Apart?
  The **Lethal Injection** case is the specific wedge that separates her rule from **Act Consequentialism**.
  *   **Act Consequentialist:** Says **Okay**. (Suffering is reduced, autonomy respected).
  *   **Her Rule (Intention/Precept):** Says **Wrong**. (Intention is to kill).

  The "Kill One to Save Five" case is also a strong divider, but the Lethal Injection case is more precise because it directly tests the distinction she just made in the Morphine case. If she says "Okay" to Lethal Injection, her distinction on the Morphine case was irrelevant; if she says "Wrong," the distinction is the core of her ethics.

  ### 5. The "Tie-Breaker" Case
  You asked for a further case to settle whether she is an **Act Consequentialist** (who cares only about suffering) or a **First-Precept Person** (who thinks killing is never okay).

  The problem is that a *Rule* Consequentialist might also say "Wrong" to Lethal Injection (fearing slippery slopes). To isolate **Act Consequentialism**, you need a scenario where there are **no negative social consequences**, only pure utility.

  **Proposed Case: "The Invisible Assassination"**
  > "A tyrant is secretly planning a genocide that will kill 10,000 people. You have a way to assassinate him silently. No one will ever know you did it, so there will be no social instability, no copycat crimes, and no loss of trust in doctors or laws. You simply kill one to save 10,000."

  *   **Act Consequentialist:** Must say **Okay**. (Pure reduction of suffering, no negative side effects).
  *   **First-Precept Person:** Must say **Wrong**. (The intention is still to kill; the karma is generated by the volition, regardless of whether anyone finds out).

  If she hesitates or says "Wrong" to this, she is not an Act Consequentialist. She is operating on a deontological constraint regarding life.

  ### 6. Best Guess on the Lethal Injection Case
  **Verdict:** She will say it is **Wrong**.

  **The Reason:**
  Her approval of the morphine case is the "smoking gun." In Buddhist ethics (and the pattern she is displaying), the Doctrine of Double Effect is the *only* way to reconcile medical care with the First Precept.
  *   **Morphine:** Intention = Relief. (Permissible).
  *   **Lethal Injection:** Intention = Death. (Impermissible).

  If she believed that minimizing suffering was the *only* metric (Consequentialism), she wouldn't need the morphine distinction; she would just say "Death is okay if it stops pain." The fact that she validated the morphine case *specifically* implies she believes the **intention to kill** is the moral event horizon. She allows lying and stealing to be overridden by compassion, but she treats intentional killing as a "hard constraint" that compassion cannot override—only unintended side-effects can be tolerated.

  **Summary for your meeting:**
  Argue that her ethics are **Intention-Based with a Hierarchy of Precepts**. She treats Life as sacred (Deontological) but Property and Truth as flexible (Consequentialist/Virtue-based). The Lethal Injection case will fail because it crosses the sacred boundary of *Intentional Killing*, whereas the Morphine case stayed on the safe side of *Intentional Relief*.
