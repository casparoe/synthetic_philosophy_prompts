  Dear Friend,

  I have read through the transcript of the debate between Mara and Jonah with care, and I am happy to offer my adjudication of their exchange. It is a classic tension in safety engineering, but within the specific context of AI alignment, the stakes sharpen the disagreement in ways that allow for a definite judgment. I will walk through their exchange chronologically, assessing the validity of each move and rating them on a scale from clearly mistaken to clearly right, before offering my overall verdict and noting what both parties overlooked.

  Mara opened the discussion by asserting that worst-case behavior is the only standard that matters because deployment is adversarial and average-case guarantees assume a friendly world. I rate this move as clearly right. In the context of alignment, the consequence of failure is often catastrophic or existential, which means that the expected utility calculation is dominated by the tail risks rather than the mean performance. Her identification of deployment as adversarial is also correct; once a system is capable enough to be useful, it becomes a target for exploitation by bad actors or simply encounters edge cases that function as adversarial inputs. Jonah replied by arguing that for learned systems the worst case is uncomputable and that claims of worst-case guarantees are either vacuous or merely small-sample estimates of average behavior. I rate this move as partially mistaken. He is technically correct that exact worst-case verification is currently intractable for large neural networks, but he is wrong to conclude that this invalidates the standard. The difficulty of measuring a quantity does not change the quantity that matters for safety, and conflating the limitation of our tools with the definition of safety is a category error.

  Mara answered that our inability to compute the exact worst case licenses trying harder to approximate it through adversarial training and red-teaming, rather than retreating to average-case metrics. I rate this move as clearly right. This is the correct engineering response to epistemic uncertainty; when you cannot prove safety, you must stress-test the boundaries of the system as aggressively as possible. Jonah shot back that adversarial training is itself an average-case evaluation over the distribution of attacks generated, making the label worst-case a relabeling rather than a different guarantee. I rate this move as partially right but ultimately misleading. It is true that practical red-teaming involves sampling, but the intent and methodology differ significantly from random sampling; adversarial training specifically seeks to expand the support of the test distribution to include pathological cases, which shifts the evaluation closer to the worst-case ideal even if it does not reach it mathematically.

  Jonah then shifted to a cost argument, claiming that no useful system will satisfy a true worst-case requirement and that refusing to deploy is itself a risky decision. I rate this move as partially mistaken. While it is true that perfect safety is impossible and opportunity costs are real, this argument conflates the evaluation metric with the deployment decision. We can evaluate against a worst-case standard and still decide to deploy with mitigations if the risk is managed, but lowering the evaluation standard to average-case obscures the risk rather than managing it. Mara replied that this only works if the tail contains minor failures, whereas for high stakes a small probability of disaster dominates the calculation, and realistic cases are exactly what adversaries will avoid. I rate this move as clearly right. This is the core of the safety case for alignment; if the failure mode is catastrophic, the probability threshold for acceptance is so low that average-case performance becomes irrelevant.

  Jonah pressed further on the notion of a worst case itself, arguing that against an optimizing adversary there is no maximally bad input, only an arms race, so the meaningful question is robustness across a distribution of plausible shifts. I rate this move as partially mistaken. He correctly identifies that security is dynamic, but he incorrectly infers that this makes the question average-case. Robustness across plausible shifts is still a form of worst-case reasoning over the set of plausible shifts, not an average over nature's distribution. Mara denied that this was average-case reasoning, stating it is worst-case over the adversary's capabilities rather than nature's distribution, and that Jonah had moved the guarantee up a level while keeping its structure. I rate this move as clearly right. She correctly identifies that changing the domain of the quantifier from inputs to adversary capabilities preserves the worst-case structure of the safety claim, which is the essential feature she was defending.

  There are, however, important elements that both of them are missing. Neither participant adequately addresses the role of interpretability and mechanistic analysis in bridging the gap between Jonah's practical constraints and Mara's theoretical standards. Mara assumes we can approximate the worst case through testing alone, but without understanding the internal mechanisms of the model, adversarial training is just blind search. Jonah assumes that because we cannot verify the whole space, we must accept average-case metrics, ignoring the possibility of formal verification on abstracted models or using interpretability to rule out entire classes of failure modes. They also both neglect the distinction between training-time alignment and deployment-time monitoring; a robust safety case likely requires a combination of worst-case design principles and average-case monitoring tools, rather than treating them as mutually exclusive evaluation standards.

  My overall verdict is that Mara is more right than Jonah. While Jonah offers a necessary reality check on the limitations of current verification technology, his argument conflates what is easy to measure with what is important to measure. In safety-critical engineering, especially where the stakes involve existential risk, the standard of evaluation must be driven by the severity of the failure mode, not the convenience of the metric. Mara correctly identifies that alignment is fundamentally about securing the system against the tails of the distribution and adversarial optimization, whereas Jonah's position risks normalizing a level of risk that is unacceptable for advanced AI systems. Jonah is right that we cannot currently achieve perfect worst-case guarantees, but Mara is right that we must not lower our standards to match our current capabilities; instead, we must improve our capabilities to meet the standard. Therefore, Mara's framework provides the correct normative guide for evaluating alignment techniques, even if Jonah's pragmatic concerns must be addressed in the implementation.

  I hope this helps your group move forward.

  Sincerely,

  Your Adjudicator
