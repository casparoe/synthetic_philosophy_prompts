answer: |-
  This is a classic conflict between **social reality** (which is gradual and vague) and **contractual reality** (which is usually binary and specific).

  Here is the breakdown of why your head is spinning, where the landlord is coming from, and how you should actually handle this.

  ### 1. Is the situation vague?
  **Socially? Yes.** **Legally/Contractually? Usually No.**

  You are experiencing the "slow slide" of cohabitation, which is very common. However, lease agreements and landlord-tenant laws generally do not care about the *emotional* progression of a relationship. They care about **occupancy.**

  To a landlord (and often a court), a "resident" is not defined by when the U-Haul arrived. It is defined by **pattern of use.** If she is sleeping there "most nights," she has crossed the threshold from guest to occupant in the eyes of almost every standard lease agreement.

  ### 2. The "Guest vs. Resident" Test
  While laws vary by location, most jurisdictions and leases use a combination of these factors to determine if someone has "moved in":
  *   **Time:** The most common standard is the "14-day rule." If a guest stays more than 14 days in a 6-month period, or more than 3–5 consecutive nights, they are considered a tenant.
  *   **Possessions:** Leaving clothes, toiletries, or furniture indicates intent to reside.
  *   **Mail:** If she receives mail at the address.
  *   **Keys:** If she has her own set of keys.
  *   **Contribution:** If she contributes to rent or utilities (even via Venmo).

  If she is there "most nights," you have likely already breached the guest clause of your lease, even if you didn't sign a new document. The landlord isn't necessarily wrong about the *status*; they are leveraging it to get more money.

  ### 3. Check Your Lease Immediately
  You need to find the specific clauses regarding **Occupants**, **Guests**, and **Unauthorized Tenants.**
  *   **What does it say about guests?** Does it specify a number of days?
  *   **What does it say about rent increases?** Can they raise rent mid-lease for an additional occupant? (Usually, they cannot raise the *base rent* until the lease renews, but they may be able to add a "per-person surcharge" or fee immediately if it's written in the lease).
  *   **What does it say about penalties?** Some leases have fees for unauthorized occupants.

  ### 4. The Rent Increase Question
  This is where you have more room to push back.
  *   **Mid-Lease:** In many places, a landlord cannot raise the *base rent* in the middle of a fixed-term lease (e.g., a 12-month lease) unless the lease specifically allows for it upon adding an occupant. They usually have to wait until renewal.
  *   **Utility/ Wear-and-Tear:** Landlords argue that two people use more water, electricity, and cause more wear than one. This is a reasonable argument.
  *   **Rent Control:** If you are in a rent-controlled city (like NYC, SF, LA), there are strict limits on how much they can charge for an additional occupant.

  ### 5. Strategy: Don't fight the "Move-In," fight the "Cost"
  If you argue "She didn't move in!", you will likely lose because "most nights" is a hard fact to dispute. It puts you in a position of looking dishonest.

  **Instead, try this approach:**

  1.  **Acknowledge the gray area:** "I understand your concern. From my perspective, it happened gradually, so I didn't realize we had crossed the threshold into needing to update the lease. I wasn't trying to hide anything." (This de-escalates the accusation of malice).
  2.  **Agree to add her:** "We are happy to add her to the lease to make everything official."
  3.  **Negotiate the increase:**
      *   Ask for the increase to be justified in writing (e.g., increased utility usage).
      *   Check local laws: In some jurisdictions, landlords can only charge a reasonable amount for an additional occupant (e.g., $50–$100/month), not a full market-rate rent hike.
      *   If you are mid-lease, remind them that the lease terms regarding rent usually hold until the renewal date.

  ### 6. The Risk of Digging In
  If you refuse to add her:
  *   The landlord may claim lease violation.
  *   Depending on local law, this could lead to a cure-or-quit notice (remove the occupant or leave).
  *   Since she is there "most nights," asking her to leave to satisfy the landlord is likely impractical and damaging to your relationship.

  ### Summary
  The landlord is technically right that she is residing there, even if there was no "move-in day." The vagueness is in your head, not in the lease.

  **Your best move:** Verify what your local laws say about mid-lease rent hikes for additional occupants. Agree to add her to the lease to secure her tenancy rights, but negotiate the rent increase based on local standards for additional occupants rather than accepting whatever number the landlord throws out.

  ***Disclaimer:** I am an AI, not a lawyer. Landlord-tenant laws vary wildly by city, state, and country. You should check your specific lease agreement and consider contacting a local tenant union or housing authority for advice specific to your jurisdiction.*
