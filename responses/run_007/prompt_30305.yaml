answer: |-
  Here is a definitive 50-minute lesson plan. It is designed to be tight, interactive, and focused strictly on the logical function of the counterexample rather than the metaphysics of free will itself.

  ### 1. Board Work: The Visual Anchor (Minutes 0–5)
  Do not start by talking. Start by writing. This gives students something to look at while you set the stage and prevents them from getting lost in the narrative details later.

  **Write this on the left side of the board:**
  > **PAP (Principle of Alternative Possibilities):**
  > A person is morally responsible for what they have done *only if* they could have done otherwise.
  > *(Necessary Condition: Responsibility $\rightarrow$ Ability to Do Otherwise)*

  **Write this on the right side of the board:**
  > **The Goal:**
  > Show that PAP is **FALSE**.
  > *(Find a case where: Responsibility = YES, but Ability to Do Otherwise = NO)*

  **Why this order:** You need to establish the logical target immediately. If you start with the story of Jones and Black, students will get bogged down in the sci-fi mechanics. By putting the logical structure on the board first, every detail of the story they hear next must serve this logical goal.

  ### 2. The Example: The "Two-Stage" Reveal (Minutes 5–20)
  Do not tell the whole Jones/Black story at once. It is too dense. Use a **Two-Stage Reveal** to isolate the intuition.

  **Stage 1: The Actual Sequence (Minutes 5–10)**
  Tell the story *without* mentioning Black yet.
  *   "Jones is thinking about voting for Candidate A or Candidate B. He deliberates. He decides, for his own reasons, to vote for Candidate A. He votes."
  *   **Ask:** "Is Jones responsible for this vote?"
  *   **Consensus:** Yes. (Get this on the record).
  *   **Board:** Write "Responsibility: YES" under the PAP definition.

  **Stage 2: The Counterfactual Intervener (Minutes 10–20)**
  Now add the constraint.
  *   "Now, add Black. Black is a neurosurgeon who wants Jones to vote for A. He has implanted a chip in Jones's brain. Black monitors Jones's brain states."
  *   **Crucial Detail:** "If Jones shows *any* sign of choosing B, Black presses a button that forces Jones to choose A. But if Jones chooses A on his own, Black does **nothing**."
  *   "In this specific scenario, Jones chooses A on his own. Black never touches the button."
  *   **Ask:** "Does Jones have the ability to do otherwise?"
  *   **Consensus:** No. (If he tried to choose B, Black would stop him).
  *   **Board:** Write "Ability to Do Otherwise: NO" under the PAP definition.

  **The Pivot:**
  Point to the board. "We have Responsibility = YES. We have Ability to Do Otherwise = NO. PAP says Responsibility *requires* Ability. The case shows Responsibility *without* Ability. Therefore, PAP is false."

  **Why this example:** The standard Jones/Black case is the best one for an intro section *provided* you strip away the "prior sign" complication initially. Do not use a "time travel" or "God's foreknowledge" variant; they introduce theological or temporal confusions. Stick to the neural chip. It is artificial, which helps students accept the "no alternative possibilities" premise without arguing about real-world psychology.

  ### 3. Misconception Management (Minutes 20–35)
  This is where the discussion will live. You must anticipate three specific objections. Do not wait for students to raise them; introduce them yourself as "Common Pushbacks" to control the framing.

  **Misconception 1: "But Black's presence makes Jones unfree/unresponsible." (The Begging the Question Objection)**
  *   **When it crops up:** Immediately after Stage 2. Students will say, "Jones is just a puppet because Black is there."
  *   **How to defuse:** Distinguish the *Actual Sequence* from the *Counterfactual Sequence*.
  *   **Script:** "I hear you saying Black *caused* the action. But look at the story: Black *never acted*. The causal chain of the actual vote runs 100% through Jones's own deliberation. Black is like a safety net that never catches you. If you walk across a tightrope without falling, are you not a good walker just because a net was below you? The net explains why you *couldn't fall*, but it doesn't explain why you *walked*."

  **Misconception 2: "This just proves Determinism is true, so we're back to the Incompatibilist argument."**
  *   **When it crops up:** When students realize Jones couldn't do otherwise. They will conflate "Black's constraint" with "Causal Determinism."
  *   **How to defuse:** Explicitly decouple Frankfurt cases from Determinism.
  *   **Script:** "This is the most important point of the hour. Frankfurt cases work even in an **indeterministic** universe. Imagine the universe is random. Jones still could have done otherwise *unless* Black stops him. Black removes the alternative possibilities, not causal determinism. Frankfurt isn't trying to prove determinism is compatible with free will; he's trying to prove that *alternative possibilities* aren't the thing that matters for responsibility."

  **Misconception 3: "The Prior Sign Problem." (The Flicker of Freedom)**
  *   **When it crops up:** A sharp student will ask, "How does Black know when to intervene? There must be a sign before Jones decides, so Jones *could* have done otherwise by not showing the sign."
  *   **How to defuse:** Grant the point, then bracket it. Do not let this derail the section.
  *   **Script:** "That is a brilliant objection, known as the 'Flicker of Freedom.' Philosophers have spent 30 years refining the case to block that (e.g., Black monitors the decision *at the exact moment* it happens). But for today, assume we can construct the case so there is no prior sign. Even if there is a tiny 'flicker' of an alternative, it's not enough to satisfy the robust 'ability to do otherwise' PAP requires. Don't let the mechanics of the chip distract you from the logic: We are imagining a scenario where the alternative is genuinely blocked."

  ### 4. The "So What?" Connection (Minutes 35–40)
  You must connect this back to the lecture they attended on Incompatibilism, or they will feel this was an isolated logic puzzle.

  *   **Recall the Incompatibilist Argument:**
      1.  Free Will requires Ability to Do Otherwise (PAP).
      2.  Determinism removes Ability to Do Otherwise.
      3.  Therefore, Determinism removes Free Will.
  *   **The Frankfurt Impact:** "Frankfurt attacks Premise 1. If PAP is false, the Incompatibilist argument collapses. You can be responsible (and have free will) even if you couldn't do otherwise. This opens the door for **Compatibilism**, but more importantly, it shifts the debate from 'Alternative Possibilities' to 'Sourcehood' (was the action *mine*?)."

  ### 5. The Closing Question (Minutes 40–45)
  Do not ask "Does anyone have questions?" That yields silence. Ask a diagnostic question that forces them to apply the logic, not the story.

  **The Question:**
  > "Imagine we have two worlds. In World 1, Jones votes A with no Black. In World 2, Jones votes A with Black present (but inactive).
  >
  > If you think Jones is responsible in World 1, **what logical reason do you have to deny he is responsible in World 2?** If your answer relies on 'he could have done otherwise in World 1 but not World 2,' haven't you just admitted PAP is false?"

  **Why this works:** It forces them to confront the *irrelevance* of Black to the actual sequence. If they say responsibility is the same in both, they accept Frankfurt's conclusion. If they say responsibility is different, they must explain why a dormant mechanism changes moral status, which usually leads them back to PAP, which the case is designed to break.

  ### 6. Scope Control: What NOT to Get Into (Minutes 45–50)
  You have 5 minutes to wrap up. To survive this, you must explicitly avoid these traps:

  1.  **Do not debate whether Determinism is actually true.** Keep the focus on the *conceptual link* between Responsibility and Alternatives.
  2.  **Do not define "Free Will" too deeply.** Frankfurt targets *Moral Responsibility*. The lecture may have conflated the two. If a student asks, "But does he have Free Will?", answer: "Frankfurt argues that if Responsibility doesn't need alternatives, then whatever 'Free Will' means, it probably doesn't need alternatives either. But let's stick to Responsibility for today."
  3.  **Do not try to solve the 'Prior Sign' objection.** As noted above, acknowledge it as a sophisticated counter-argument (Widerker/Fischer), but tell them that for the purposes of this intro course, we accept the *possibility* of a Frankfurt-style case to test the principle.

  ### Summary Checklist for the TA
  *   **Board:** PAP definition vs. Case Result (Yes/No).
  *   **Story:** Two-stage reveal (Jones alone $\rightarrow$ Jones + Dormant Black).
  *   **Key Distinction:** Actual Sequence (Jones) vs. Counterfactual Sequence (Black).
  *   **Key Distinction:** Alternative Possibilities vs. Causal Determinism.
  *   **Exit Ticket:** Compare World 1 (No Black) vs. World 2 (Dormant Black).

  If you stick to this sequence, you prevent the narrative from overwhelming the logic, and you ensure they leave understanding that Frankfurt is an attack on **PAP**, not necessarily a proof of **Compatibilism**.
