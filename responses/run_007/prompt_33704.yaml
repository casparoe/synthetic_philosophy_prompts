answer: |-
  # Old Evidence Validation Protocol (OEVP)

  ## 1. Purpose and Theoretical Grounding
  **The Problem:** In Bayesian confirmation theory, if evidence $E$ is already known (probability 1), conditioning on it cannot update the probability of a hypothesis $H$. This is the "problem of old evidence." However, in public health, we constantly encounter new theories that explain existing surveillance data. To prevent analysts from treating post-hoc storytelling (accommodation) as equal to genuine prediction, we must evaluate the *counterfactual risk* the hypothesis took regarding the data.

  **The Translation:** We cannot change the fact that the data are old. Instead, we assess whether the hypothesis *would have* been surprised by the data if it had been proposed earlier. If the hypothesis was flexible enough to fit any outcome, or if it was selected *because* it fit this outcome, it gains no confirmatory weight. This procedure operationalizes that distinction.

  **Scope:** This protocol evaluates the *epistemic weight* of the evidence (how much belief should shift). It does **not** determine policy action (which depends on costs, values, and resources).

  ---

  ## 2. The Procedure (Checklist)

  **Instructions:** The proposing analyst completes Sections A–C. A senior reviewer (not the proposer) validates Section D and assigns the Verdict. Total time: < 4 hours.

  ### Section A: Provenance and Timing (The "When")
  *Goal: Determine if the hypothesis was selected based on the data.*

  1.  **A1. Timestamp:** Is there a dated record (lab notebook, commit hash, memo) of the hypothesis statement $H$ prior to the extraction of the specific dataset $E$ used for validation?
      *   *Yes:* Proceed to A2.
      *   *No:* Proceed to A2, but flag as **Post-Hoc Formulation**.
  2.  **A2. Inspection:** Was the dataset $E$ visually or statistically inspected by the proposer *before* $H$ was finalized?
      *   *No (Blind):* Proceed to Section B.
      *   *Yes (Seen):* Proceed to Section B, but flag as **Data-Informed Formulation**.

  **Stop Condition 1:** If A1 is No **AND** A2 is Yes, the hypothesis is **Accommodated**. It cannot count as strong confirmatory evidence unless it passes the High-Risk test in Section C. If it fails Section C, verdict is **No Evidence**.

  ### Section B: Analysis Flexibility (The "How")
  *Goal: Detect "garden of forking paths" or p-hacking.*

  3.  **B1. Degrees of Freedom:** Were the following analysis choices pre-specified in a protocol before seeing $E$?
      *   Primary outcome definition.
      *   Subgroup stratifications.
      *   Time windows / Lag structures.
      *   Significance thresholds / Cut-points.
      *   *All Pre-specified:* Low Flexibility.
      *   *Some/None Pre-specified:* High Flexibility.
  4.  **B2. Multiple Testing:** How many alternative hypotheses or model specifications were tested on $E$ before settling on the current $H$?
      *   *1 (Only this one):* No Selection Effect.
      *   *2–5:* Moderate Selection Effect.
      *   *5+ or "Hundreds" (e.g., scan statistics):* Severe Selection Effect.

  **Stop Condition 2:** If B1 is High Flexibility **AND** B2 is Severe Selection Effect, the analysis is **Data-Driven Exploration**. Verdict: **No Evidence** (treat as hypothesis-generating only).

  ### Section C: Riskiness and Specificity (The "What")
  *Goal: Determine if the data could have falsified the hypothesis.*

  5.  **C1. Precision:** Does $H$ predict a specific quantitative value or shape (e.g., "peak at lag 4 weeks," "OR = 1.5"), or merely a direction/association (e.g., "cases will rise," "exposure is linked")?
      *   *Quantitative/Shape:* High Precision.
      *   *Directional/Qualitative:* Low Precision.
  6.  **C2. Falsifiability:** Identify a pattern in $E$ that was possible but would have contradicted $H$.
      *   *Clear Contradiction Exists (e.g., peak at lag 10):* High Risk.
      *   *Vague/Compatible with Almost Anything (e.g., "some change"):* Low Risk.

  **Stop Condition 3:** If C1 is Low Precision **AND** C2 is Low Risk, the hypothesis is **Immunized**. Verdict: **No Evidence** (accommodation).

  ### Section D: Counterfactual Reconstruction (The "Surprise")
  *Goal: Estimate the Bayes Factor via expert judgment.*

  7.  **D1. Likelihood under H:** If $H$ were true, how probable is the specific pattern observed in $E$? (Scale 0–1).
      *   *Analyst Estimate:* ______
  8.  **D2. Likelihood under ~H:** If $H$ were false (null or alternative theory), how probable is this specific pattern? (Scale 0–1).
      *   *Analyst Estimate:* ______
      *   *Constraint:* This must be justified by external literature or mechanistic constraints, not by the fit itself.
  9.  **D3. Honesty Check:** Can the reviewer independently verify that these estimates are not inflated by knowing the outcome?
      *   *Yes:* Proceed to Verdict.
      *   *No (Estimates rely on knowing the data):* **Hand Off to Human Judgment**.

  ### Verdict Assignment
  *   **Strong Evidence:** Passes A (Blind or Low Risk), Passes B (Low Flexibility), Passes C (High Risk), D3 is Yes. (Weight: High).
  *   **Weak/Suggestive Evidence:** Passes C (High Risk), but Fails A or B (Post-hoc or Flexible). (Weight: Low – requires replication).
  *   **No Evidence:** Fails C (Low Risk) OR Fails B (Severe Selection). (Weight: Zero).
  *   **Human Judgment Required:** Passes A/B/C but Fails D3 (Counterfactuals cannot be honestly reconstructed).

  ---

  ## 3. Application to Cases

  ### Case 1: The Data Dredge
  *Scenario:* Analyst runs hundreds of associations on hospitalization data, finds one significant link (Exposure X → Outcome Y), writes hypothesis after finding the p-value.
  *   **Section A:** A1=No, A2=Yes. (Flag: Post-Hoc).
  *   **Section B:** B1=High Flexibility (thresholds/subgroups chosen to maximize significance). B2=Severe Selection ("several hundred associations").
  *   **Stop Condition 2 Triggered:** High Flexibility + Severe Selection.
  *   **Verdict:** **No Evidence.**
  *   **Analyst Reaction:** The analyst will not like this. They found a "significant" result. However, the procedure identifies that the selection effect inflates the false positive rate to near 100%. The data were used to build *and* test the hypothesis (double-counting).
  *   **Documentation:** "Claim rejected due to severe multiple testing without correction and post-hoc hypothesis formulation. Treat as exploratory only."

  ### Case 2: The Model Prediction
  *Scenario:* Transmission model derived independently predicts a specific lag structure (peak at week 4) in historical surveillance data collected years prior.
  *   **Section A:** A1=Yes (Model existed), A2=No (Data not used to build model). (Flag: Blind).
  *   **Section B:** B1=Low Flexibility (Model output is fixed). B2=No Selection (Only one model).
  *   **Section C:** C1=High Precision (Specific lag week). C2=High Risk (Data could have peaked at week 2 or 10).
  *   **Section D:** D1=High, D2=Low (Peak at exactly week 4 is unlikely under null). D3=Yes (Model mechanics justify D1).
  *   **Verdict:** **Strong Evidence.**
  *   **Documentation:** "Claim accepted. Hypothesis predates data inspection, makes precise risky prediction, and counterfactual likelihood ratio is favorable."

  ### Case 3: The Mixed Case (Hand-Off)
  *Scenario:* Analyst notices a trend in old data, forms a hypothesis about mechanism, then finds a *second* feature in the same data (e.g., seasonality amplitude) that the mechanism implies. Analyst claims the amplitude supports the mechanism.
  *   **Section A:** A1=No (Hypothesis triggered by data trend), A2=Yes. (Flag: Data-Informed).
  *   **Section B:** B1=Moderate (Amplitude metric was pre-defined in database, but choice to test it was post-hoc). B2=Moderate.
  *   **Section C:** C1=High Precision (Amplitude ratio), C2=High Risk (Could have been any ratio).
  *   **Section D:** D1/D2 Reconstruction is difficult. The analyst cannot honestly say what they would have believed about the amplitude *before* seeing the trend that sparked the hypothesis. The "counterfactual prior" is contaminated by knowing the data.
  *   **Stop Condition 4 Triggered:** Fails D3 (Honesty Check).
  *   **Verdict:** **Hand Off to Human Judgment.**
  *   **Reasoning:** The procedure cannot mathematically disentangle the "spark" data from the "test" data when they come from the same source and the hypothesis was inspired by the source. A senior committee must decide if the mechanistic link is strong enough to treat the amplitude as a separate test.
  *   **Documentation:** "Epistemic weight indeterminate via protocol. Requires committee review to assess independence of hypothesis features."

  ---

  ## 4. Limitations and Boundary Conditions

  **1. Judgment Calls Dressed as Procedure:**
  Section D (Counterfactual Reconstruction) is inherently subjective. While we ask for numbers, they are estimates of "surprise." Two reviewers may assign different likelihoods to $P(E|\neg H)$. The procedure mitigates this by requiring justification, but it cannot eliminate subjectivity. This is where the "Hand Off" exists.

  **2. Where the Procedure Misfires:**
  *   **True Discoveries in Messy Data:** Sometimes genuine insights come from dredging (Case 1). This procedure will label them "No Evidence." This is correct epistemologically (the data *as analyzed* do not support the claim), but it may delay action. The protocol protects against false positives, not false negatives.
  *   **Vague Hypotheses:** If a hypothesis is dressed in precise language but is actually vague (e.g., "risk increases" without magnitude), it will fail Section C. However, a clever analyst might game Section C by claiming high precision falsely. Reviewer vigilance is required.

  **3. Epistemology vs. Decision Theory:**
  This procedure determines **confirmation strength** (how much to believe). It does **not** determine **intervention**.
  *   *Example:* A Case 1 result ("No Evidence") might still warrant a low-cost advisory if the potential harm is catastrophic (Precautionary Principle).
  *   *Example:* A Case 2 result ("Strong Evidence") might not warrant intervention if the cost is prohibitive.
  *   **Boundary:** The output of this protocol is a weight for the decision matrix, not the decision itself. Do not use this checklist to approve spending; use it to approve the *scientific validity* of the premise underlying the spend.

  **4. The "Only Old Data" Hard Case:**
  If no new data can ever be collected, this protocol forces a harsh truth: old data cannot strongly confirm a hypothesis generated from them. The verdict will likely be "Weak" or "Human Judgment." This is not a failure of the protocol; it is a fact of inference. In these cases, the agency must decide based on mechanistic plausibility rather than statistical confirmation.

  ---

  ## 5. Implementation Notes for the Lead
  *   **Training:** Run a 2-hour workshop with your analysts using Case 1 and Case 2. Show them that Case 1 fails not because the math is wrong, but because the *process* guarantees false positives.
  *   **Documentation:** Save the completed checklist as part of the analytic record. If a claim is challenged later, this document proves due diligence.
  *   **Culture:** Frame this not as "policing" but as "protecting credibility." A claim that passes this protocol is bulletproof; one that does not is vulnerable.

  \answer{The Old Evidence Validation Protocol is a five-step audit that distinguishes genuine prediction from post-hoc accommodation by evaluating hypothesis timing, analysis flexibility, prediction riskiness, and counterfactual likelihood reconstruction.}
