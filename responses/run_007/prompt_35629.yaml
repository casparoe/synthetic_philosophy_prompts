answer: |-
  Here is a toy example designed to isolate the scaling problem. It shows how two plausible methods for "translating" a deontological verdict into numbers lead to opposite decisions, proving that the translation itself carries moral weight.

  ### The Scenario: The Starving Child and the Loaf
  You are walking past a bakery. You see a starving child who will not survive the night without food. The baker is asleep. You can steal one loaf of bread to save the child, or you can walk away.

  *   **Act A:** Steal the bread.
  *   **Act B:** Walk away.

  You are morally uncertain. You assign **50% credence to Act Utilitarianism** and **50% credence to Strict Deontology** (specifically, a Kantian view that stealing is inherently forbidden, regardless of consequences).

  ### The Raw Verdicts
  First, we look at what each theory says *before* we try to combine them.

  1.  **Utilitarianism (Quantitative):**
      *   **Act A:** Child lives (+100 utils), Baker loses bread (–1 util). **Net: +99.**
      *   **Act B:** Child dies (–100 utils), Baker keeps bread (0). **Net: –100.**
      *   *Gap:* The difference between the best and worst act is **199 utils**.

  2.  **Deontology (Qualitative):**
      *   **Act A:** Violates the duty "Do not steal." **Verdict: Forbidden.**
      *   **Act B:** Respects the duty. **Verdict: Permitted.**
      *   *Gap:* The theory offers no numbers. It just marks Act A as a violation.

  ### The Comparison Problem
  To calculate "expected choiceworthiness," you must assign a numerical cost to the Deontological verdict "Forbidden." How bad is a violation compared to 100 utils of welfare? Here are two reasonable scaling methods.

  #### Method 1: "Consequence-Matching" Scale
  **The Logic:** You assume the deontological rule exists *roughly* to prevent harm. Therefore, the "cost" of violating the rule should be proportional to the typical harm the rule prevents. Since the rule "Do not steal" usually protects property worth about 1 util (the price of the bread), a violation should cost roughly that amount on the utilitarian scale.
  *   **Scaling:** "Forbidden" = **–1** (Equivalent to the baker's loss).
  *   **The Calculation:**
      *   **Act A:** (0.5 × 99) + (0.5 × –1) = 49 – 0.5 = **48.5**
      *   **Act B:** (0.5 × –100) + (0.5 × 0) = **–50**
  *   **Recommendation:** **Steal the bread.** (Act A has higher expected choiceworthiness).

  #### Method 2: "Categorical-Weight" Scale
  **The Logic:** You assume the deontological rule is a *side-constraint* that is independent of harm. A moral violation is a distinct kind of badness that shouldn't be measured by the size of the consequence. To respect the structural integrity of Deontology, a violation must carry enough weight to potentially override consequentialist gains, otherwise, you aren't really treating it as a deontological constraint. You assign a fixed "moral penalty" high enough to matter.
  *   **Scaling:** "Forbidden" = **–200** (A fixed penalty greater than the utilitarian stakes).
  *   **The Calculation:**
      *   **Act A:** (0.5 × 99) + (0.5 × –200) = 49.5 – 100 = **–50.5**
      *   **Act B:** (0.5 × –100) + (0.5 × 0) = **–50**
  *   **Recommendation:** **Walk away.** (Act B has higher expected choiceworthiness).

  ### Why This Bites
  Notice that the math didn't decide anything; the **scaling method** decided everything.

  *   If you use **Method 1**, you have implicitly decided that Deontology is just a rough heuristic for minimizing harm. You have "consequentialized" the deontological theory in the process of normalizing it.
  *   If you use **Method 2**, you have implicitly decided that Deontological constraints have independent, non-negotiable weight.

  Your friend says to "treat it like expected utility," but this example shows you cannot do that without first answering a substantive moral question: *Is a deontological violation bad because of its consequences, or bad in itself?*

  That is not a technical detail; it is the very thing you were uncertain about in the first place. By picking a normalization method, you have secretly resolved your moral uncertainty before running the calculation.
