prompt: |-
  I've been thinking about promising — specifically, about what makes a promise binding and when that bindingness lapses or is defeated. I find that my gut reactions to particular cases don't line up neatly with any single theory I know, and I'd like help working out what principle, if any, they add up to.

  Here are the cases and my verdicts:

  1. I promise a colleague I'll read their draft by Friday. Thursday night, a family member is hospitalized, and I spend the evening at the hospital. I don't read the draft. Verdict: the promise doesn't bind me in those circumstances — the obligation is defeated, not merely outweighed.

  2. I promise a friend I'll keep a secret they confide. Later I learn the secret concerns ongoing financial fraud at our workplace. Verdict: the promise doesn't bind me; I'm free to report it.

  3. A stranger at a party, slightly drunk, promises to donate a kidney to me after hearing I'm on a waiting list. The next morning, sober, they say they didn't mean it. Verdict: the promise doesn't bind them.

  4. My elderly neighbor promises to leave me her antique desk in her will. She forgets to update the will and dies; the desk goes to her nephew. Verdict: the promise bound her, and her estate has a moral debt to me, even though I have no legal claim.

  5. I promise my young daughter I'll take her to the aquarium on Saturday. Saturday morning I wake up with a bad migraine. I cancel. Verdict: the promise still has force — I owe her a rescheduled trip and an apology — but I wasn't wrong to cancel.

  6. A contractor promises to finish a renovation by June 1. They're delayed by a supply-chain disruption entirely outside their control. Verdict: the promise still binds, but the breach isn't culpable; they owe completion as soon as feasible, not damages.

  7. I promise a friend I'll attend their wedding. Two days before, my spouse has a serious medical episode and I can't leave town. Verdict: same as case 1 — the obligation is defeated, not just overridden.

  8. Someone promises under credible threat of violence to hand over their wallet. Verdict: no binding force whatsoever.

  9. I tell a distant acquaintance "let's get lunch sometime" meaning it as a genuine promise, but they treat it as mere politeness and never follow up. Verdict: the promise binds me weakly — I should make a good-faith effort to schedule something, but if they never respond, I'm released.

  10. I promise to donate to a charity after a friend's fundraising pitch, but I later discover the charity has a terrible record of actually delivering aid. Verdict: the promise doesn't bind me; the basis on which I made it was false.

  What I can't figure out is whether there's a unified principle here. Cases 1 and 7 feel like they should be explained the same way — something about impossibility or catastrophic cost — but is the distinction between an obligation's being "defeated" and its being "outweighed" doing real work, or am I just labeling an intuition? Case 3 and case 8 both involve compromised consent, yet I feel they're different in an important way — drunkenness and coercion aren't the same kind of defect — but I end up with the same verdict for both, which makes me wonder whether I'm missing a distinction that should matter. Case 4 and case 9 both involve promises that are in some sense inert or unclaimed, yet I judge them very differently: the desk promise binds fully, the lunch promise barely binds. And case 10 seems to involve a mistake about the object of the promise, but not all mistakes release us — if I promise to buy you a book I think is in print but it's out of print, I still owe you something.

  Is there a principle, or a small set of principles, that captures these verdicts? Which of my verdicts would I have to revise to get a simpler account, and what does the resulting account say about a case I haven't considered: a promise made by someone suffering from early-stage dementia who understood the promise when they made it but no longer remembers having made it?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Topic:** The nature of promising, specifically bindingness, defeasibility, and lapsing conditions.
      *   **Input:** 10 specific cases with the user's intuitive verdicts.
      *   **Goal:** Find a unified principle (or small set) that explains these verdicts.
      *   **Specific Questions:**
          *   Is the "defeated vs. outweighed" distinction real?
          *   Why do Case 3 (drunk) and Case 8 (coercion) yield the same verdict despite different defects?
          *   Why do Case 4 (will/desk) and Case 9 (lunch) differ so much in binding force despite both being "inert"?
          *   What about Case 10 (false basis) vs. other mistakes?
          *   Which verdicts might need revision for a simpler account?
          *   Apply the resulting theory to a new case: Early-stage dementia promise.

  2.  **Deconstruct the Cases & Verdicts:**

      *   *Case 1 (Family Emergency vs. Draft):* Obligation defeated (not just outweighed). Key factor: Significant unforeseen moral cost/impossibility.
      *   *Case 2 (Secret vs. Fraud):* Obligation defeated. Key factor: Illegality/Immorality of the content revealed.
      *   *Case 3 (Drunk Kidney):* No binding force. Key factor: Competence/Validity of consent at time of promising.
      *   *Case 4 (Will/Desk):* Binds estate (moral debt). Key factor: Reliance/Expectation + Seriousness of commitment (testamentary intent).
      *   *Case 5 (Daughter/Migraine):* Binds but breach not culpable (owe reschedule/apology). Key factor: Relationship specificity + partial impossibility vs. total defeat. *Note: This differs slightly from Case 1 in the user's mind (Defeated vs. Suspended/Modified).*
      *   *Case 6 (Contractor/Supply Chain):* Binds, breach not culpable (owe completion). Key factor: Risk allocation + Impossibility/Force Majeure. Similar to Case 5.
      *   *Case 7 (Wedding vs. Spouse Health):* Obligation defeated. Key factor: Same as Case 1 (Family emergency).
      *   *Case 8 (Threat/Wallet):* No binding force. Key factor: Coercion/Validity of consent.
      *   *Case 9 ("Lunch Sometime"):* Weakly binds (good faith effort). Key factor: Ambiguity/Convention + Lack of specific reliance.
      *   *Case 10 (Charity Fraud):* Doesn't bind. Key factor: False premises/Mistake of fact regarding the *purpose*.

  3.  **Identify Underlying Themes/Principles:**

      *   *Validity Conditions:* Was the promise properly formed? (Cases 3, 8). Needs competence and voluntariness.
      *   *Content Constraints:* Is the promised act permissible? (Case 2).
      *   *Defeasibility Conditions:* Do circumstances change such that the cost of keeping the promise is too high or the purpose is frustrated? (Cases 1, 5, 6, 7).
      *   *Reliance/Expectation:* How much did the promisee rely on this? How specific was it? (Cases 4 vs. 9).
      *   *Mistake:* Was the promise based on a false assumption essential to the agreement? (Case 10).

  4.  **Synthesize a Unified Theory:**

      *   *Candidate Theory:* **The Reliance-Expectation-Validity Framework.**
      *   *Core Idea:* A promise creates a normative bond based on the *invited reliance* of the promisee, constrained by the *validity of the promisor's consent* and the *moral permissibility of the act*.
      *   *Refinement:* Let's look for a principle that handles the "Defeated vs. Outweighed" distinction. This sounds like *Scanlon's Principle of Fidelity* mixed with *Conditional Obligation*.
      *   *Better Fit:* **The "Conditional Invitation to Rely" Theory.**
          *   A promise is an invitation to rely on one's future conduct.
          *   This invitation is *conditional* on:
              1.  Valid formation (Competence, Voluntariness).
              2.  Moral permissibility of the act.
              3.  Stability of the underlying assumptions (Frustration of purpose).
              4.  Proportionality of cost (Impossibility/Excessive burden).
          *   The *strength* of the obligation depends on the *reasonableness of reliance*.

  5.  **Address the User's Specific Puzzles:**

      *   *Defeated vs. Outweighed:* This distinction maps to **Validity/Conditions vs. Trade-offs**. If a condition fails (emergency, coercion), the obligation dissolves (defeated). If it's just a competing desire, it's outweighed. But Cases 1 & 7 suggest "Excessive Cost" defeats rather than outweighs. This aligns with the idea that promises are implicitly conditional on "all else being reasonably equal."
      *   *Case 3 (Drunk) vs. Case 8 (Coercion):* Both attack **Validity**. Drunkenness undermines *competence*; Coercion undermines *voluntariness*. Same verdict (void) because the promise never properly formed.
      *   *Case 4 (Desk) vs. Case 9 (Lunch):* This is about **Reasonable Reliance**. A testamentary promise invites heavy, specific reliance (planning life/estate). "Lunch sometime" is phatic; reliance is low/ambiguous. The *strength* of the bond scales with the *clarity and seriousness of the invited reliance*.
      *   *Case 10 (Charity):* This is **Frustration of Purpose/Mistake**. The promise was "I will give to X *because X does good*." If X doesn't do good, the condition fails. Distinguish from "Book out of print" (substitution possible) vs. "Charity fraud" (identity of the recipient is tainted).

  6.  **Develop the Principle:**

      *   *Principle:* **The Principle of Conditional Reliance.**
      *   *Statement:* "One is bound by a promise to the extent that one has intentionally invited specific reliance, provided that (a) the promise was validly formed, (b) the content remains permissible, (c) the underlying assumptions hold, and (d) the cost of performance does not exceed a threshold of reasonable sacrifice implicit in the context."

  7.  **Evaluate Verdicts for Revision (Simplification):**

      *   *Case 5 & 6 vs. Case 1 & 7:* The user distinguishes between "Defeated" (1, 7) and "Suspended/Modified" (5, 6).
      *   *Critique:* This distinction is subtle. In 1 (Draft), the deadline passes. In 5 (Aquarium), the event can be rescheduled. In 6 (Renovation), the job can be finished late.
      *   *Revision:* Unify these. The obligation is to *perform or make restitution/repair*. In Case 1, performance is impossible (time travel), so only apology/explanation remains. In 5 & 6, performance is delayed. The principle is the same: The primary obligation is suspended by impossibility, but a secondary obligation (repair relationship) remains.
      *   *Case 4:* Does the estate owe a *moral debt*? Yes, but it's weaker than a contract. Keep this, but ground it in *Reliance*. Did the user rely? If yes, strong debt. If no, weak. The prompt implies a moral debt exists regardless. I should suggest the debt relies on *expectation* created.

  8.  **Analyze the New Case (Dementia):**

      *   *Scenario:* Promise made while competent, forgotten due to dementia.
      *   *Application:*
          *   Validity at time T1: Yes.
          *   Reliance at time T2: Did the promisee rely?
          *   Capacity at time T2: Promisor cannot *choose* to fulfill.
          *   *Verdict:* The obligation transfers to caregivers/estate (similar to Case 4), but the promisor themselves is not *culpable* for forgetting. The bond exists, but the agent cannot execute it. It becomes a duty of care for others.

  9.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the sophistication of the intuitions.
      *   *The Unified Principle:* Propose "The Principle of Invited Reliance under Normal Conditions."
      *   *Breakdown:*
          1.  **Validity Threshold** (Cases 3, 8).
          2.  **Implicit Conditions** (Cases 1, 2, 7, 10).
          3.  **Scalar Bindingness** (Cases 4, 5, 6, 9).
      *   *Addressing the Puzzles:*
          *   Defeated vs. Outweighed: It's about Implicit Conditions.
          *   Drunk vs. Coerced: Both fail Validity Threshold.
          *   Desk vs. Lunch: Scalar Reliance.
          *   Charity Mistake: Frustration of Purpose.
      *   *Revisions:* Suggest smoothing the distinction between Cases 1/7 and 5/6. They are all "Impossibility/Excessive Burden," differing only in whether performance is *permanently* impossible or *temporarily* suspended.
      *   *The Dementia Case:* Apply the theory. Distinguish between the *existence* of the obligation (yes) and the *culpability* of the agent (no).

  10. **Refining the Output:** (Self-Correction during drafting)
      *   *Check:* Did I address the "Defeated vs. Outweighed" question directly? Yes, by framing it as "Condition Failure vs. Weight Balancing."
      *   *Check:* Is the Dementia case handled nuancedly? Need to ensure I distinguish between the *promisee's right* and the *promisor's capacity*.
      *   *Tone:* Philosophical, analytical, respectful of the user's intuitions.

  11. **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate response based on this structure.)
answer: |-
  Your intuitions are remarkably consistent and align closely with a sophisticated view in moral philosophy that blends **Scanlonian contractualism** (promises as invitations to rely) with **conditional obligation theory**.

  You are struggling to find a unified principle because you are looking for a single *rule*, whereas your intuitions track a **multi-layered framework**. Your verdicts suggest that a promise is not a binary switch (on/off) but a normative bond that has **conditions of formation**, **conditions of maintenance**, and **degrees of strength**.

  Here is a proposed unified principle, an analysis of your specific puzzles, a suggestion for simplifying your verdicts, and an application to the dementia case.

  ### The Unified Principle: Conditional Invited Reliance

  **Principle:** *A promise creates a binding obligation to the extent that the promisor has intentionally invited the promisee to rely on their future conduct, provided that: (1) the consent was validly formed, (2) the content remains morally permissible, (3) the factual assumptions underlying the promise hold true, and (4) the cost of performance does not exceed the threshold of sacrifice implicit in the context.*

  This principle breaks your cases down into three distinct layers:

  1.  **Validity (The Entry Gate):** Was the promise properly formed?
  2.  **Defeasibility (The Exit Gate):** Did conditions change such that the bond dissolves?
  3.  **Scalar Strength (The Bond's Tension):** How heavily did the promisee rely, and how specific was the commitment?

  ---

  ### Addressing Your Specific Puzzles

  #### 1. Defeated vs. Outweighed (Cases 1, 5, 6, 7)
  You ask if this distinction is real. Under the **Conditional Invited Reliance** view, **yes**.
  *   **Outweighed** implies a trade-off between two valid obligations (e.g., "I promised to meet you, but I want to watch a movie").
  *   **Defeated** implies that a *condition* of the promise has failed.

  When you promise a colleague (Case 1) or a friend (Case 7), there is an implicit clause: *"provided no emergency arises."* This is not you weighing the promise against the emergency; it is recognizing that the promise **never applied** to this specific scenario. The obligation doesn't get crushed by a heavier weight; the floor drops out from under it.
  *   **Revision for Simplicity:** Your distinction between Case 1/7 (Defeated) and Case 5/6 (Binds but suspended) is slightly unstable. In Case 5 (Aquarium), you cannot take her *on Saturday*. That specific performance is impossible, just like the draft in Case 1.
      *   *Suggestion:* Treat Case 5 and 6 exactly like Case 1 and 7. The specific obligation (Saturday/Aquarium, June 1/Renovation) is **defeated**. However, because the *relationship* allows for substitution (rescheduling), a **secondary obligation** arises to restore the expectation. In Case 1, the deadline (Friday) makes substitution impossible, so only the apology remains. The underlying mechanism (defeat by impossibility/excessive cost) is the same.

  #### 2. Drunkenness vs. Coercion (Cases 3 & 8)
  You feel these are different defects but yield the same verdict. They are different defects, but they attack the same layer: **Validity**.
  *   **Case 3 (Drunkenness):** Attacks **Competence**. The agent lacked the capacity to invite reliance meaningfully.
  *   **Case 8 (Coercion):** Attacks **Voluntariness**. The agent had capacity, but the will was overridden.
  *   **Why the same verdict?** Because without competence *and* voluntariness, there is no "Invitation to Rely." If I cannot invite you to rely on me, I cannot bind myself. The mechanism differs, but the result (no bond formed) is identical.

  #### 3. The Desk vs. The Lunch (Cases 4 & 9)
  This is the **Scalar Strength** layer. Not all invitations to rely are equal.
  *   **Case 4 (Desk):** This is a **High-Stakes Reliance**. Testamentary promises are formal, specific, and invite the promisee to structure their expectations of the future (e.g., "I will have that desk in my home"). The "cost" of breaking it is high because the reliance was reasonable and significant.
  *   **Case 9 (Lunch):** This is **Phatic/LOW-Stakes Reliance**. The phrase "sometime" is linguistically ambiguous. The social convention signals low commitment. The promisee's reliance is (or should be) minimal.
  *   **The Principle:** The binding force is proportional to the **reasonableness of the reliance invited**. The desk promise invited heavy reliance; the lunch promise invited tentative reliance.

  #### 4. The Charity Mistake (Case 10)
  This is **Frustration of Purpose** (Condition 3 in the principle).
  *   You distinguish this from a book being out of print. Why?
  *   **Book:** The object (the book) is unavailable, but the *purpose* (you reading/enjoying the book) can be fulfilled by a substitute.
  *   **Charity:** The object (the donation) is available, but the *purpose* (doing good) is frustrated by the fraud.
  *   **Verdict:** Your intuition is correct. The promise was "I will support *effective aid*." If the charity is fraudulent, the essential description of the object is false. The condition fails.

  ---

  ### Which Verdicts to Revise for a Simpler Account?

  To make your theory more robust, I recommend **collapsing the distinction between Cases 1/7 and Cases 5/6.**

  Currently, you say:
  *   1 & 7: Obligation Defeated.
  *   5 & 6: Obligation Binds (but breach not culpable).

  **The Revision:** In all four cases, the **primary obligation** (perform act X at time T) is **defeated** by impossibility or excessive cost. However, promises create a **residual obligation** to repair the relationship or fulfill the intent if possible.
  *   In Case 5 & 6, performance is *temporarily* possible, so the residual obligation looks like "finish later."
  *   In Case 1, performance is *permanently* impossible (time has passed), so the residual obligation is only "apologize/explain."

  **Why revise?** It unifies the theory of "Impossibility/Excessive Burden." You don't need two different categories for "Family Emergency" vs. "Migraine/Supply Chain." They are both "Unforeseen Impediments." The difference in outcome is just a function of whether the act is *repeatable*, not whether the obligation was defeated.

  ---

  ### The New Case: Early-Stage Dementia

  **Case:** *A person promises to pay for your college tuition while fully competent. Two years later, they have early-stage dementia. They do not remember the promise, but they are not legally incapacitated. They have the funds but refuse to pay because "I never said I'd do that."*

  **Application of the Principle:**

  1.  **Validity:** At Time 1 (formation), the promise was valid (Competent + Voluntary). The bond was created.
  2.  **Defeasibility:** No emergency or moral shift has occurred to defeat the condition.
  3.  **Reliance:** You likely relied on this (planning finances).
  4.  **Capacity:** At Time 2 (performance), the promisor lacks *memory*, but perhaps not *understanding* if reminded.

  **Verdict:**
  The **obligation remains binding**, but the **culpability shifts**.

  *   **The Bond:** The promise created a normative debt that attaches to the *person* and their *estate*, not just their current working memory. Because the validity condition was met at formation, the obligation persists.
  *   **The Agent:** The promisor is not *morally culpable* for the breach in the same way a liar is. They suffer from a defect of agency (memory loss).
  *   **The Resolution:** This functions similarly to your **Case 4 (The Desk)**. Since the agent cannot reliably execute the will of their past self, the obligation transfers to their **guardians or estate**.
  *   **Conclusion:** You are owed the tuition. If the promisor refuses due to memory loss, their caregiver or financial proxy has a moral duty to honor the commitment made by the "past self," provided the funds are available and doing so doesn't harm the promisor's current care needs. The promise survives the degradation of the memory that formed it, because the *reliance* it created is still active in you.

  ### Summary of the Unified Theory

  Your intuitions add up to a **Conditional Reliance Theory**:
  1.  **Validity:** Consent must be competent and free (Cases 3, 8).
  2.  **Implicit Conditions:** Promises are void if the content is immoral, the facts are false, or the cost becomes excessive/unforeseen (Cases 1, 2, 7, 10).
  3.  **Scalar Strength:** Bindingness scales with the reasonableness of reliance invited (Cases 4 vs. 9).
  4.  **Residual Duty:** When a promise is defeated by impossibility, a secondary duty to repair/replace remains if feasible (Cases 5, 6).

  This accounts for all your verdicts (with the slight smoothing of 1/5/6/7) and provides a clear path for the dementia case.
