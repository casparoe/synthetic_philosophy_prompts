      *   *(2) The Equivalence Claim:* This is the crux. Jake assumes that "Here is a hand" entails "I am not dreaming" in a way that requires *prior* justification of "I am not dreaming." This touches on the *Closure Principle* (If I know P, and I know P entails Q, do I know Q?). Moore accepts closure but thinks we know the entailing proposition (Hand) better than the entailed one (~Dreaming). Jake assumes the reverse (need to know ~Dreaming to know Hand).
      *   *(3) The Dreaming Claim:* Standard skeptical intuition. Phenomenal indistinguishability.
      *   *(4) The "Cheating" Charge:* This follows if you accept the skeptic's demand for *antecedent* justification against skepticism.
      *   *(5) The Irrelevance Charge:* This is the strongest philosophical point. Moore shifts the burden of proof. He doesn't *refute* skepticism on the skeptic's terms; he rejects the skeptic's starting assumptions.

  3.  **Identify the Core Philosophical Dispute:**
      *   **Skeptic's Demand:** To know $O$ (object), I must first be able to rule out $H$ (skeptical hypothesis).
      *   **Moore's Response:** I know $O$ with greater certainty than I know the premises required to doubt $O$. Therefore, I can infer $\neg H$ from $O$, rather than needing $\neg H$ to infer $O$.
      *   **Jake's Mistake:** Jake assumes the Skeptic's order of justification is the *only* valid order. He assumes Moore is trying to play the Skeptic's game and win. Moore is actually changing the game.

  4.  **Formulate a Defense of Moore (for the User):**
