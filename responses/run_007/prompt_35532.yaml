          *   (3) But one *can't* prove ~Dreaming just by looking (experience is compatible with dreaming).
          *   (4) Therefore, Moore's proof is cheating (either fails or relies on a hidden difference).
          *   (5) If there's a difference (i.e., Moore ignores skeptical scenarios), he hasn't answered the skeptic.
      *   **Goal:** Identify where Jake's argument might be vulnerable, explain Moore's actual position (Common Sense vs. Skepticism), and help the user understand the dialectical situation.

  2.  **Evaluate Jake's Argument (Step-by-Step):**
