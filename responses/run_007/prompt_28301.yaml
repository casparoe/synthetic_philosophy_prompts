      *Refining the "Overrated" section:* Many philosophers try to prove akrasia is impossible. Behavioral econ proves it exists. So that debate is dead. The "Dual Systems" mapping is also tired. I'll focus on the "Is it Irrational?" debate being too coarse-grained.

