      *   *The "Progress" Concept:* "Progress" is a thick evaluative concept. It describes a state of affairs *and* commends it. The dispute is about what features warrant commendation.
      *   *Addressing the Paradox:* If the diagnosis is correct, the debate *can* make progress, but not by finding a "true" definition. It progresses by clarifying the trade-offs of each conception. The lack of settlement on *this* question doesn't undermine the diagnosis; it exemplifies the very difficulty of metaphilosophical reflection.

