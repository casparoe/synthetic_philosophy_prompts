      *   *Different Standards:* Pessimists use a "truth-accumulation" standard; Optimists use a "clarification/elaboration" standard. *Critique:* This is close, but doesn't explain why they talk past each other regarding the *value* of the activity.
      *   *Different Questions:* Pessimists ask "Do we know the answers?" Optimists ask "Is the discourse improving?" *Critique:* Plausible, but they are explicitly arguing about the same label ("progress").
