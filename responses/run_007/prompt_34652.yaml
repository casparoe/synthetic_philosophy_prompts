answer: |-
  You are hitting on exactly the insight that revolutionized economics in the 18th century. Your intuition is correct: **The St. Petersburg Paradox does indeed kill *Expected Monetary Value* maximization.**

  If the theory was just "maximize the expected dollar amount," you are right—it would be dead in the water. The reason it didn't kill the broader framework of rational choice is that the framework **evolved** specifically to survive this counterexample.

  Here is why it is treated as a "paradox to be resolved" rather than a "graveyard for the theory," and why the debate is actually still alive today.

  ### 1. The Shift from Value to Utility
  The immediate historical response to your exact point came from Daniel Bernoulli in 1738. He agreed with you: no rational person treats every dollar as equal.

  The first dollar you get saves your life; the millionth dollar buys a slightly nicer boat. This is **diminishing marginal utility**. Bernoulli proposed that rational agents don't maximize expected *money*; they maximize expected *utility* (usually modeled as logarithmic).

  *   **Naive EV:** $\sum (P \times \text{Money}) = \infty$
  *   **Expected Utility:** $\sum (P \times \log(\text{Money})) = \text{Finite}$

  Once you make that switch, the infinite expectation disappears, and the "rational" price to pay becomes something reasonable (like \$5–\$20, depending on your wealth). So, the framework wasn't killed; it was upgraded from **Expected Value Theory** to **Expected Utility Theory (EUT)**. For 200 years, EUT became the gold standard of rational choice.

  ### 2. The "Super-Paradox" (Menger's Critique)
  However, your skepticism is shared by later mathematicians. In 1934, Karl Menger pointed out that Bernoulli's solution has a loophole.

  If you can construct a game where the payout grows fast enough (e.g., $e^{2^n}$ instead of $2^n$), you can break *any* unbounded utility function. Even if utility is logarithmic, I can design a payout schedule that makes the expected utility infinite again.

  This suggests that **any** unbounded utility function leads to paradoxes. This forces a stronger conclusion: **Rational utility functions must be bounded.** There must be a maximum amount of "happiness" money can buy. This is a significant constraint on rational choice theory that stems directly from your objection.

  ### 3. The Reality Check: Finite Bankrolls
  A more pragmatic resolution (often attributed to Keynes or simply common sense) is that the "infinite" expected value relies on the casino having infinite money.

  In the real world, the casino has a bankroll $W$. If the streak of tails is long enough that $2^n > W$, the casino goes bust and pays you $W$. Once you cap the payout at the total money supply in the universe, the expected value crashes from infinity to something quite small (usually less than \$50).

  So, the paradox only exists in a Platonic realm of infinite resources. In physical reality, the expected value is low, and your intuition matches the math. The "paradox" is essentially an error of applying infinite math to finite physics.

  ### 4. The Modern Revival: Ergodicity Economics
  Recently, physicist Ole Peters has revived this debate with a compelling argument that supports your view even more strongly. He argues that Expected Utility Theory is still flawed because it looks at an **ensemble average** (what happens across many parallel universes) rather than a **time average** (what happens to one person over time).

  *   **Ensemble:** If 1 million people play once, the average payout is huge.
  *   **Time:** If *you* play 1 million times, your wealth dynamics follow a different path.

  Peters argues that for a single agent playing over time, the "expected value" is irrelevant if the probability of ruin is high. This approach resolves the paradox without needing "utility functions"—it just changes the math of how we model growth over time. This suggests that standard rational choice theory might still be using the wrong statistical machinery.

  ### 5. Why is it still called a "Paradox"?
  You asked why we don't just call it a counterexample and move on.

  1.  **Pedagogical Value:** It is the perfect "canary in the coal mine." It is the simplest possible demonstration that **mathematical expectation $\neq$ rational value.** Every economics student learns it to understand why we need utility theory.
  2.  **Normative vs. Descriptive:**
      *   **Descriptive:** How people *do* act. (People won't pay \$1,000).
      *   **Normative:** How people *should* act.
      The paradox persists because there is still philosophical disagreement on the normative side. If a casino *did* have infinite money, *should* you pay \$1,000? A strict EV maximizer says yes. A utility maximizer says no. The tension between those two definitions of "rational" is what keeps the paradox alive.
  3.  **Behavioral Economics:** The paradox was an early precursor to Behavioral Econ. It showed that humans aren't cold calculators. Daniel Kahneman and Amos Tversky (Prospect Theory) essentially formalized what your intuition says: people weigh probabilities and losses differently than pure EV suggests.

  ### Summary
  You are right that it refutes **naive Expected Monetary Value**.

  It didn't kill **Rational Choice Theory** because the theory mutated into **Expected Utility Theory** to absorb the blow. However, modern critiques (Menger, Peters, Behavioral Econ) suggest that even Expected Utility Theory is not the final word.

  So, it remains a "paradox" because it highlights a permanent tension: **Mathematical infinity does not map onto human decision-making.** As long as economists try to use infinite models to describe finite humans, the St. Petersburg Paradox will remain the classic example of where that mapping breaks.
