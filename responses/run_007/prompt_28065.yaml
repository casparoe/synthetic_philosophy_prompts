answer: |-
  ### Part 1: The Logical Space & Tree Design

  Before writing the questions, we need to map the conceptual territory. We aren't just sorting by "name of concept"; we are sorting by **decision criteria**. Here is the decision tree that underpins the scoring key.

  **The Root:** Do species represent real, mind-independent units in nature?
  *   **No:** $\rightarrow$ **Eliminativism** (Species are arbitrary human slices) or **Instrumental Pluralism** (Species are real but the *concept* is context-dependent).
  *   **Yes:** $\rightarrow$ Move to Mechanism.

  **Branch 1: The Cohesion Mechanism (What holds the group together?)**
  *   **Interbreeding/Gene Flow:** $\rightarrow$ **Biological Species Concept (BSC)**.
      *   *Constraint:* Fails on asexuals/fossils. If you apply this there, you are a "Dogmatic BSC" (or Eliminativist about those taxa).
  *   **Ecological Niche/Selection:** $\rightarrow$ **Ecological Species Concept (EcSC)**.
      *   *Constraint:* Distinguishes sympatric populations even if gene flow is possible.
  *   **Ancestry/Descent:** $\rightarrow$ **Lineage Concepts** (PSC or EvSC).
      *   *Constraint:* Handles asexuals and fossils well.

  **Branch 2: The Lineage Split (PSC vs. EvSC)**
  *   **Diagnosability (Fixed Traits):** $\rightarrow$ **Phylogenetic Species Concept (PSC)**. (Cracraft variant).
      *   *Focus:* Can I tell them apart?
  *   **Separate Evolutionary Fate:** $\rightarrow$ **Evolutionary Species Concept (EvSC)**. (Wiley variant).
      *   *Focus:* Are they on different trajectories?
      *   *Note:* These are notoriously hard to separate in extant sexual taxa. We will use the **Fossil** and **Bacteria** cases to pry them apart.

  **Branch 3: The Threshold (Phenetic vs. Cladistic)**
  *   **Overall Similarity:** $\rightarrow$ **Phenetic Concept**.
      *   *Focus:* They look the same, they are the same.
      *   *Constraint:* Fails on cryptic species.

  **Branch 4: The Meta-Stance (Pluralism)**
  *   **Context-Dependent:** $\rightarrow$ **Species Pluralism**.
      *   *Focus:* BSC for birds, PSC for bacteria, EcSC for sympatric hosts.
      *   *Scoring Note:* This is detected by *inconsistency* across taxa types, not a single answer.

  **Empty/Problematic Cells:**
  1.  **Phenetic + Gene Flow:** Incoherent. If overall similarity is the metric, interbreeding status is irrelevant. (Nobody holds this).
  2.  **Eliminativist + Strict Realist Criteria:** Incoherent. You can't say "Species aren't real" and then insist "Interbreeding *makes* them real."
  3.  **PSC vs. EvSC on Extant Taxa:** largely empty in practice. They usually yield the same verdict on living birds/mammals. They diverge on *anagenesis* (fossils) and *microbes*.
  4.  **Individuals vs. Kinds:** This distinction (Ghiselin/Hull vs. Traditional) cuts *across* the tree. A BSC proponent can think species are individuals (historical entities) or classes (natural kinds). **This quiz cannot distinguish this.** It tests *criteria for individuation*, not *ontological category*.

  ---

  ### Part 2: The "What's in a Name?" Species Quiz

  **Instructions:** For each case, choose the option that best matches your intuition about how biologists *should* classify the organisms. Don't worry about consistency yet; just go with your gut on the biology.

  **1. The Salamander Ring (Ensatina)**
  A ring of salamander populations surrounds a valley. Neighbors can interbreed all the way around the ring, but where the ends meet at the south, they act like distinct species and do not interbreed.
  *   A. They are one species. The gene flow connects the whole ring; the end point is just an extreme variation.
  *   B. They are multiple species. The populations at the contact point are reproductively isolated, which breaks the chain.
  *   C. It depends on whether you care about the history of the ring or the current reproductive barriers.

  **2. The Ancient Asexuals (Bdelloid Rotifers)**
  These microscopic animals haven't sexually reproduced for millions of years. They have no gene flow, yet they cluster into distinct morphological groups.
  *   A. They cannot be species. "Species" implies interbreeding; these are just distinct lineages or clones.
  *   B. They are definitely species. They have distinct evolutionary histories and traits, sex isn't required.
  *   C. They are species only if they occupy distinct ecological roles, regardless of sex.

  **3. The Bacterial Web (Horizontal Gene Transfer)**
  In a group of bacteria, genes are swapped promiscuously between lineages. There is no clear "tree" of ancestry, just a web of shared traits.
  *   A. We should stop calling them species. The category assumes a branching tree, which doesn't exist here.
  *   B. They are species if they cluster by overall genetic similarity, even if the history is messy.
  *   C. They are species if they occupy distinct ecological niches, even if they swap genes.

  **4. The Fossil Slice (Chronospecies)**
  A lineage of trilobites changes slowly over 5 million years. Paleontologists draw a line at 2.5 million years and name the older ones *Species A* and the newer ones *Species B*.
  *   A. This is arbitrary. It's one evolving lineage; cutting it is just for human convenience.
  *   B. It's valid. Once the later population is diagnosably different, it counts as a new species.
  *   C. It's valid only if the change represents a shift in ecological function or adaptive zone.

  **5. The Cryptic Twins (Sympatric Non-Interbreeders)**
  Two populations of moths live in the same forest, look identical to the human eye, but never mate with each other in the wild.
  *   A. One species. If you can't tell them apart morphologically, the distinction isn't biologically significant.
  *   B. Two species. Reproductive isolation is what matters, even if we can't see it.
  *   C. Two species. They likely have subtle genetic or chemical differences that mark separate histories.

  **6. The Hybrid Zone (Stable Introgression)**
  Two populations of warblers meet in a narrow zone and hybridize freely, but outside that zone, they remain distinct and don't mix.
  *   A. One species. The barrier is permeable; genes are flowing between them.
  *   B. Two species. The hybrid zone is stable and narrow; the cores of the populations remain distinct.
  *   C. Two species. The hybrids often have lower fitness, keeping the lineages separate despite some mixing.

  **7. The Host Shifters (Lab vs. Field)**
  Two populations of fruit flies feed on different fruits. In the lab, they mate happily. In the wild, they never meet because they stay on their specific fruit.
  *   A. One species. Biological compatibility is proven; the separation is just behavioral geography.
  *   B. Two species. They are ecologically isolated and adapting to different hosts; that's what makes them distinct.
  *   C. Two species. They are on separate evolutionary trajectories due to the host specialization.

  **8. The Conservation Dilemma (Legally Distinct)**
  A population of wolves is genetically distinct but regularly interbreeds with a neighboring wolf population. The law wants to protect the distinct group.
  *   A. Protect them, but don't call them a separate species. They are just a variant of the neighbor.
  *   B. Call them a species. Genetic distinctiveness warrants the label and the protection.
  *   C. Call them a species. The label is a tool for conservation; if it saves the lineage, it's the right label.

  ---

  ### Part 3: Scoring Key & Interpretation

  **How to Score:**
  Tally your answers. Do not look for a perfect match. Look for the **dominant pattern**. If your answers are all over the place, you might be a **Pluralist** (see below).

  | Question | Option A Tendency | Option B Tendency | Option C Tendency |
  | :--- | :--- | :--- | :--- |
  | **1 (Ring)** | BSC (Lumper) | BSC (Splitter) / PSC | Pluralist / EvSC |
  | **2 (Rotifers)** | **BSC (Dogmatic)** | PSC / EvSC | **EcSC** |
  | **3 (Bacteria)** | **Eliminativist** | Phenetic | **EcSC** / PSC |
  | **4 (Fossils)** | **EvSC** (Lineage) | **PSC** (Diagnosable) | **EcSC** |
  | **5 (Cryptic)** | **Phenetic** | **BSC** | PSC (Genetic) |
  | **6 (Hybrids)** | **BSC** (Cohesion) | **PSC** / Phenetic | **EvSC** (Trajectory) |
  | **7 (Hosts)** | **BSC** (Potential) | **EcSC** | **EvSC** |
  | **8 (Law)** | **BSC** / Realist | **PSC** / Realist | **Pluralist** / Pragmatist |

  #### The Leaves (Your Result)

  **1. The Biological Species Conceptualist (Mostly 1B, 5B, 6A, 7A)**
  *   **Logic:** Species are defined by reproductive isolation and gene flow.
  *   **The Awkward Commitment:** You have to tell the bdelloid rotifers (Q2) that they aren't species, or admit your concept only applies to sexual organisms.
  *   **Empty Cell Check:** You likely struggle with Q3 (Bacteria) unless you accept Eliminativism there.

  **2. The Phylogenetic Species Conceptualist (Mostly 2B, 4B, 5C, 8B)**
  *   **Logic:** Species are the smallest diagnosable clusters of organisms with a shared ancestry (Cracraft variant).
  *   **The Awkward Commitment:** You must accept that every tiny, fixed genetic difference potentially creates a new species (taxonomic inflation), and you have to defend drawing lines in the fossil record (Q4) where ancestors and descendants might be classified differently.
  *   **Indistinguishability Flag:** If you also chose 4A or 7C, you might actually be an **Evolutionary Species Conceptualist**. The PSC focuses on *traits* (diagnosability); the EvSC focuses on *fate* (separate lineage). On living animals, these usually look the same.

  **3. The Ecological Species Conceptualist (Mostly 2C, 3C, 4C, 7B)**
  *   **Logic:** Species are lineages occupying distinct adaptive zones/niches.
  *   **The Awkward Commitment:** You have to explain why two populations that look different and don't interbreed are the *same* species if they occupy the exact same niche (rare, but possible), or why asexuals are species without referencing their ancestry.
  *   **Strength:** This is the only view that handles Q2 (Rotifers) and Q3 (Bacteria) comfortably without switching concepts.

  **4. The Pheneticist (Mostly 5A, 3B, 1A)**
  *   **Logic:** Species are groups of similar organisms.
  *   **The Awkward Commitment:** You have to tell the student who found the cryptic moths (Q5) that they are wrong; if they look the same, they are the same species, regardless of mating behavior. (This view is largely abandoned in philosophy of biology, so if you landed here, you might be a pre-theoretic realist).

  **5. The Evolutionary Species Conceptualist (Mostly 4A, 6C, 7C)**
  *   **Logic:** Species are lineages with a separate evolutionary fate and tendencies.
  *   **The Awkward Commitment:** You have to define "separate fate" without relying solely on reproductive isolation (BSC) or fixed traits (PSC). It's often vague on *when* a lineage becomes a species.
  *   **Indistinguishability Flag:** As noted above, this is hard to separate from PSC in this quiz. If you chose 4A (Fossils are arbitrary cuts), you lean EvSC (lineage continuity). If you chose 4B (Diagnosable = new species), you lean PSC.

  **6. The Species Pluralist (Mixed Pattern: e.g., BSC on Q1, PSC on Q2, EcSC on Q7)**
  *   **Logic:** There is no single property that unites all species. Different taxa require different concepts.
  *   **The Awkward Commitment:** You have to explain why we use the same word "species" for birds and bacteria if the definition changes completely. You are treating "species" as a family resemblance term or a pragmatic tool rather than a natural kind.
  *   **Inconsistency Note:** If your pattern looks random (e.g., BSC on Q1, Phenetic on Q5, Eliminativist on Q3), you aren't necessarily a Pluralist; you might just be inconsistent. A true Pluralist switches *deliberately* based on the organism type (sexual vs. asexual vs. microbial).

  **7. The Eliminativist / Anti-Realist (Mostly 3A, 4A, 8C)**
  *   **Logic:** The category "species" does not carve nature at the joints. It is a human construct imposed on continuous variation.
  *   **The Awkward Commitment:** You have to tell conservation biologists (Q8) that they are protecting a fiction, even if it's a useful one. You deny that "species" refers to a real entity in the world.
  *   **Empty Cell Check:** You cannot be an Eliminativist and a strict BSC Realist. If you chose 3A (Bacteria aren't species) but 5B (Cryptic moths *are* species), you are not a full Eliminativist; you are a Pluralist or a BSC-ist with a blind spot for microbes.

  ---

  ### Part 4: Instructor's Notes on Limitations

  **1. The Individuals vs. Kinds Distinction**
  This quiz **does not** test whether you view species as *historical individuals* (Ghiselin/Hull) or *natural kinds* (Traditional).
  *   *Why?* A BSC proponent can believe species are individuals (spatiotemporally restricted gene pools) OR kinds (classes of organisms defined by interbreeding).
  *   *Result:* A "BSC" result on this quiz is compatible with both ontologies. To test this, you would need questions like: "Can a species go extinct and then be resurrected?" (Individuals say no; Kinds say yes).

  **2. The PSC vs. EvSC Blur**
  *   *Why?* On extant, sexual taxa (Questions 1, 5, 6, 7), the PSC (diagnosable cluster) and EvSC (separate lineage) almost always yield the same verdict.
  *   *Result:* The only questions that separate them are Q2 (Asexuals), Q3 (Bacteria), and Q4 (Fossils). If a student scores "PSC" but chose 4A (Fossils are arbitrary), they are likely an EvSC thinker. If they chose 4B (Diagnosable = New Species), they are a PSC thinker.

  **3. Pluralism vs. Confusion**
  *   *Why?* A student who hasn't done the reading might just guess randomly, resulting in a "Mixed Pattern."
  *   *Result:* To confirm Pluralism, ask the student: "Did you change your criteria because the *organism* changed, or because the *case* was hard?" Pluralism is a meta-theoretical commitment, not just inconsistent judging.

  **4. The "Dogmatic BSC" Cell**
  *   *Observation:* Some students will choose BSC answers for the Rotifers (Q2) and Bacteria (Q3).
  *   *Interpretation:* This is logically possible (they believe rotifers/bacteria don't have species), but biologically unpopular. This maps to a "Restricted Realism"—species are real, but only for sexually reproducing macrofauna. This is often a stepping stone to Pluralism.
