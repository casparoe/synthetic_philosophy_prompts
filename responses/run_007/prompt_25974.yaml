answer: |-
  You have hit on one of the most persistent and frustrating nerves in contemporary metaphysics. Your intuition is shared by many sophisticated philosophers (including Ted Sider, Eli Hirsch, and others working on meta-ontology): **On the surface, it looks like a notational variant.** If both theories validate the same ordinary modal claims ("I could have been a plumber"), what is the fight about?

  However, the consensus among specialists is that while it *feels* verbal, it is actually a **systematic theoretical disagreement** with genuine stakes in ontology, logic, and the nature of essence.

  Here is a breakdown of why this isn't merely a verbal dispute, where the hidden stakes lie, and what progress would actually look like.

  ### 1. The Ontological Stake (The Big One)
  You noted that the fight is about "what makes those claims true." In metaphysics, that is not a semantic quibble; it is an ontological claim.

  *   **Lewis (Modal Realism):** For Lewis, possible worlds are **concrete entities** just as real as the actual world, spatiotemporally isolated. When he says a counterpart exists, he means a flesh-and-blood person exists in a concrete universe elsewhere.
  *   **Kripke/Plantinga (Actualism):** For the transworld identity crowd, non-actual worlds are **abstract entities** (maximal consistent sets of propositions, states of affairs, or stipulated conditions). They do not concretely exist.

  **The Disagreement:** This is not verbal. It is a disagreement about the furniture of the universe.
  *   If Lewis is right, there are infinitely many concrete universes containing talking donkeys and purple swans.
  *   If Kripke is right, there is only one concrete universe, and "possible worlds" are abstract tools we use to describe it.

  You cannot reconcile these two views by saying "it's just a matter of how we speak." One side claims a massive inflation of concrete existence; the other denies it. That is a factual disagreement about reality, even if it doesn't change the truth value of "I could have been a plumber."

  ### 2. The Logical/Formal Stake
  You suggested they agree on "every single modal truth." This is technically incorrect. They agree on *ordinary* modal truths, but they diverge on the **logic of identity and quantification.**

  *   **The Necessity of Identity:** In standard Quantified Modal Logic (QML) favored by Kripke, if $a = b$, then necessarily $a = b$ ($\square(a=b)$).
  *   **Lewis's Logic:** Lewis rejects standard QML. In Counterpart Theory, identity is world-bound. I am identical to myself in this world, but I am not identical to my counterpart in that world. Therefore, the standard Barcan formulas and the necessity of identity require significant modification or rejection.

  **The Stake:** If you adopt Counterpart Theory, you must adopt a non-standard logic. If you adopt Transworld Identity, you keep standard logic but must accept "haecceities" (primitive this-ness) or essential properties to track individuals across worlds. The disagreement is about which logical cost is higher.

  ### 3. The Essentialism Stake (Where Truth Values Diverge)
  This is where the "verbal dispute" hypothesis really breaks down. Because Lewis and Kripke analyze modality differently, they sometimes arrive at **different truth values** for specific philosophical claims, particularly regarding **essentialism.**

  **Example: Chisholm's Paradox (The Ship of Theseus problem applied to modality)**
  Imagine an object $x$. We swap one part to get $y$, then another to get $z$, and so on, until we have a completely different object $n$.
  *   **Kripke (Transworld Identity):** Must draw a line somewhere. There is a fact of the matter about the *essential* constitution of the object. At some point in the chain, it is no longer *the same object*. This requires a robust, perhaps mysterious, notion of essence.
  *   **Lewis (Counterpart Theory):** The counterpart relation is based on **similarity**, which is vague and context-dependent. In one context, $n$ is a counterpart of $x$; in another, it isn't. There is no fact of the matter about where the line is drawn.

  **The Divergence:**
  *   Question: "Is it *determinately true* that Nixon could not have been born of different parents?"
  *   Kripke: **Yes.** (Origin essentialism is rigid).
  *   Lewis: **It depends on context.** (If the similarity relation weights genetic origin heavily, yes; if it weights psychological continuity heavily, maybe no).

  Here, they are not just describing the same reality differently; they are making different predictions about the determinacy of modal claims.

  ### 4. So, What Kind of Disagreement Is This?
  It is a **Clash of Systematic Frameworks.**

  It is not a verbal dispute because the terms "exist," "world," and "identity" are doing heavy theoretical lifting in incompatible systems. However, your suspicion is correct in this sense: **It is underdetermined by empirical data.** You cannot run an experiment to see if other worlds are concrete or abstract.

  Therefore, the choice is driven by **Theoretical Virtues**:
  1.  **Parsimony:** Kripke wins on *quantitative* parsimony (fewer concrete objects). Lewis argues he wins on *qualitative* parsimony (no need for primitive modal notions like "essence" or "haecceity"; everything reduces to set theory and spatiotemporal relations).
  2.  **Intuition:** Kripke wins on pre-theoretic intuition ("It's *me* in the other world, not a twin!"). Lewis argues intuitions are unreliable guides to metaphysics.
  3.  **Logical Elegance:** Lewis offers a reduction of modality to extensional logic (a huge win for formalists). Kripke keeps modality primitive (a win for those who think modality is fundamental).

  ### 5. What Counts as Progress?
  Since there is no empirical test, progress in this debate looks like **problem-solving capacity.**

  *   **Solving Paradoxes:** If Counterpart Theory can solve the Sorites paradox or Chisholm's Paradox more elegantly than Transworld Identity without incurring massive logical costs, that is progress for Lewis.
  *   **Semantic Integration:** If one framework integrates better with our best theories of language, time, or physics, that is progress. (e.g., If physics implies a multiverse, Lewis looks better. If physics implies a single block universe, Kripke looks better).
  *   **Meta-Ontological Clarity:** Progress might come from admitting that the dispute is partly verbal *about existence*. If we adopt a deflationary view of ontology (like Carnap or Hirsch), we might say Lewis and Kripke are just using different "conceptual frameworks" for existence. But even then, we must ask: *Which framework is more useful for our total theory of the world?*

  ### Diagnosis
  Your hypothesis is 80% correct. It *is* a disagreement about what a metaphysical explanation should look like (reductive/extensional vs. primitive/intuitive).

  But it is not *merely* verbal because:
  1.  **Ontological Commitment:** One side commits to infinite concrete universes; the other does not. That is a factual claim about reality.
  2.  **Logic:** They require different logical systems.
  3.  **Essentialism:** They yield different truth conditions for edge-case essentialist claims.

  **The Verdict:** It is a genuine metaphysical disagreement where the "data" are not empirical observations but **logical consistency, paradox resolution, and theoretical utility.**

  **Progress** won't come from a theorem that proves one side wrong (like in math), nor from an experiment (like in physics). Progress comes from showing that one framework creates fewer philosophical problems than the other. Currently, the field is largely stalled because both sides have paid their costs: Lewis pays with crazy ontology; Kripke pays with mysterious essences. Until someone finds a way to get the benefits without the costs, the debate will remain a standoff of theoretical virtues.
