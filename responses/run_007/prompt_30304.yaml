prompt: |-
  I sit on the interagency working group that writes the official guidence on discounting for long-lived public projects — roads, flood defenses, the climate stuff. We're revising the rate, and everyone agrees the current 3.5% real rate is a mush of at least three things: pure time preference, the effect of expected consumption growth on the marginal utility of money, and some kind of premium for catastrophe risk. The real fight is over the first one. Half the group wants to set pure time preference to zero, on the grounds that discounting someone's welfare just because they happen to be born later is ethically indefensible, and instead use a Ramsey-style rate that declines over the horizon. The other half wants to keep a positive pure time preference of around 1% a year, partly for consistency with observed savings behavior and market interest rates, partly because they think a zero rate would quietly smuggle in a lot of controversial assumptions about future growth and risk, and partly because they worry a near-zero rate would make our guidance look unmoored from the actual cost of capital.

  Draft the short memo I'll circulate before Thursday's meeting. It should recommend a concrete course of action — a specific rate or schedule, and what the pure time preference term should be — and it should engage the strongest case for keeping a positive pure time preference honestly, not just write it off as impatience. If you think the right answer is messier than either camp's position — say, a near-zero rate paired with an explicit, separately justified risk adjustment, or a schedule that declines and then flattens — say so, and be specific about what the pure time preference component itself should be.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an interagency working group on discounting for long-lived public projects (infrastructure, climate, etc.).
      *   **Task:** Draft a short memo to circulate before Thursday's meeting.
      *   **Goal:** Recommend a concrete course of action (specific rate/schedule, specific pure time preference term).
      *   **Key Conflict:** Pure Time Preference ($\delta$).
          *   *Camp A:* $\delta = 0$ (Ethical argument: discrimination by birth date is wrong). Implies declining Ramsey rate.
          *   *Camp B:* $\delta \approx 1\%$ (Pragmatic/Market argument: consistency with savings behavior, avoids unmoored guidance, hides assumptions about growth/risk).
      *   **Requirement:** Engage the strongest case for positive $\delta$ honestly (don't dismiss it as mere impatience).
      *   **Flexibility:** If the answer is messier (e.g., near-zero $\delta$ + explicit risk adjustment, or declining then flattening), propose that specifically.

  2.  **Determine the Technical/Economic Context:**
      *   **Ramsey Rule:** $r = \delta + \eta \cdot g$.
          *   $r$: Social Discount Rate (SDR).
          *   $\delta$: Pure Rate of Time Preference (PRTP).
          *   $\eta$: Elasticity of Marginal Utility of Consumption (inequality aversion).
          *   $g$: Expected growth rate of per capita consumption.
      *   **Current Guidance:** 3.5% real rate (likely based on older OMB Circular A-4 standards, though recent updates have shifted).
      *   **The "Messy" Reality:** Long-term projects (climate) face uncertainty about future growth ($g$) and catastrophic risk. A constant rate is often inappropriate for very long horizons (Weitzman/Gollier effects).
      *   **Ethical vs. Descriptive:** $\delta=0$ is prescriptive/ethical (Ramsey, Stern). $\delta>0$ is descriptive/positive (market revealed preference).
      *   **The Compromise:** Most modern literature (e.g., Drèze, Stern, recent UK/US updates) leans toward low $\delta$ for intergenerational equity but acknowledges market constraints for intragenerational projects. However, for *long-lived* projects (climate/infrastructure), the ethical argument usually dominates, but needs to be reconciled with market reality to avoid "unmoored" criticism.

  3.  **Formulate the Recommendation:**
      *   *Option 1 (Pure Camp A):* $\delta = 0$. Risk: Guidance looks theoretical, ignores opportunity cost of capital in the near term.
      *   *Option 2 (Pure Camp B):* $\delta = 1\%$. Risk: Ethically dubious for centuries-long projects, undervalues future damages/benefits.
      *   *Option 3 (Hybrid/NUanced):* A declining schedule.
          *   Near-term (0-50 years): Align closer to market rates to satisfy Camp B (implies higher effective $r$).
          *   Long-term (50+ years): Decline to reflect ethical $\delta$ and uncertainty (Camp A).
          *   *Crucial Detail:* How to handle $\delta$ specifically?
          *   *Decision:* Recommend a **near-zero pure time preference ($\delta \approx 0.1\% - 0.5\%$)** combined with a **declining term structure**.
          *   *Why?* It honors the ethical imperative (Camp A) without ignoring the opportunity cost/market signal (Camp B). The "1%" Camp B wants is often a proxy for risk and growth uncertainty, not just impatience. We should unbundle those.
          *   *Specifics:* Set $\delta$ low (0.1%), keep $\eta$ around 1.5-2.0, let $g$ drive the near-term rate, but apply a declining schedule for uncertainty.
          *   *Wait, a better compromise:* Acknowledge that the "1%" Camp B wants includes a *risk premium* for project-specific uncertainty. If we separate *social time preference* from *risk adjustment*, we can set $\delta$ low but keep the *effective* discount rate realistic via risk adjustments.
          *   *Refined Recommendation:* Set $\delta = 0.1\%$ (effectively zero but non-singular). Use a declining schedule for the *social discount rate* (starting ~3% and falling to ~1% over 300 years). Explicitly separate "catastrophe risk" from $\delta$.

      *   *Actually, looking at recent literature (e.g., UK Green Book, US OMB 2024 updates):* The trend is toward lower rates for long-term.
      *   *Best Memo Strategy:* Propose a **two-tiered approach** or a **declining schedule** where $\delta$ is set ethically low, but the *observed* rate remains consistent with markets in the short run due to $g$ and risk adjustments.
      *   *Let's pick a specific stance:* $\delta = 0.1\%$. Why not exactly zero? To avoid mathematical singularities and acknowledge a tiny degree of existential risk (probability humanity won't exist). This addresses Camp B's "unmoored" fear without accepting "impatience."
      *   *Structure:*
          1.  Context/Problem.
          2.  Evaluation of Camp A (Ethics) vs. Camp B (Consistency/Risk).
          3.  Recommendation (Specific $\delta$, Specific Schedule).
          4.  Justification (Unbundling the components).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the stalemate. State the purpose (break the deadlock).
      *   **The Core Conflict:** Summarize the $\delta=0$ vs. $\delta=1\%$ debate fairly.
      *   **Addressing Camp B (The Hard Part):** Why do they want 1%? It's not just "impatience." It's about *opportunity cost* and *risk of displacement*. If we ignore market rates, we fund projects that destroy wealth in the short term. Also, there's a non-zero probability of existential catastrophe (which looks like time preference).
      *   **The Proposal:**
          *   **Pure Time Preference ($\delta$):** Set at **0.1%**. Not zero, not 1%. 0.1% reflects a tiny probability of extinction/existential rupture, not impatience.
          *   **Schedule:** Declining term structure. Start at ~3% (consistent with current $g$ and $\eta$) for short-term, declining to ~1% for 100+ years.
          *   **Risk:** Handle catastrophe risk *additively* or via the declining schedule (Weitzman), not inside $\delta$.
      *   **Closing:** Call to action for Thursday.

  5.  **Refining the Tone:**
      *   Needs to be bureaucratic but intellectually honest.
      *   Respectful of both sides.
      *   Technically precise (Ramsey equation references).
      *   Action-oriented.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 0.1% too specific?
      *   *Fix:* It's better to be specific than vague. It forces a decision.
      *   *Critique:* Did I address the "market consistency" argument?
      *   *Fix:* Yes, by noting that the *total* rate in the near term will still be ~3% due to growth ($g$) and elasticity ($\eta$), even if $\delta$ is low. This satisfies Camp B's worry about being "unmoored" without accepting their $\delta$ argument.
      *   *Critique:* Did I separate catastrophe risk?
      *   *Fix:* Explicitly state that catastrophe risk belongs in the risk adjustment/scenario analysis, not baked into $\delta$.

  7.  **Final Polish:** Check length (short memo), clarity, and ensure the "Thursday meeting" context is clear. (Ensure I mention the Ramsey formula explicitly as it's the shared language).

      *(Self-Correction on OMB Circular A-4)*: Note that OMB updated guidance recently (2024) suggesting lower rates (2% and 1.5%). I should align with the spirit of modernization but acknowledge the specific working group's mandate. I will write this as if the 3.5% is the *current* baseline we are trying to move from, consistent with the prompt's premise.

      *(Final Decision on $\delta$)*: I will recommend $\delta = 0.1\%$. It's the "Stern Review" adjacent position but acknowledges the "existence risk" counter-argument.

      *(Final Decision on Schedule)*: Declining. 3% near term, 1% long term.

      *(Addressing Camp B's "Growth Assumption" worry)*: If $\delta=0$, $r$ depends entirely on $g$. If $g=0$, $r=0$. Camp B worries this forces optimistic growth assumptions. I need to mention that we will use conservative $g$ estimates or a declining schedule to mitigate this.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Interagency Working Group on Discounting
  **FROM:** [Your Name/Office]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Pure Time Preference and Term Structure for Revised Guidance

  **Purpose**

  This memo proposes a concrete resolution to the stalemate regarding the Pure Rate of Time Preference ($\delta$) in our upcoming revision of discounting guidance. Our current 3.5% real rate conflates ethical parameters with market observations and risk premiums. To produce guidance that is both ethically defensible for intergenerational projects and operationally viable for near-term infrastructure, I recommend we decouple these components.

  **The Conflict**

  We are currently divided between two positions:
  1.  **$\delta = 0\%$:** Based on the Ramsey-Cass-Koopmans ethical standard. Discounting future welfare solely due to temporal distance is discriminatory.
  2.  **$\delta \approx 1\%$:** Based on descriptive market data. A positive rate ensures consistency with observed savings behavior, prevents the guidance from becoming unmoored from the opportunity cost of capital, and avoids implicitly assuming perpetual consumption growth.

  Both sides have merit. The $\delta=0$ camp is correct on equity grounds: there is no ethical justification for valuing a life saved in 2100 less than one saved in 2050 simply because of the date. However, the $\delta=1\%$ camp raises a valid technical concern. If $\delta=0$, the Social Discount Rate (SDR) becomes entirely dependent on expected consumption growth ($g$) and elasticity ($\eta$) via the Ramsey equation ($r = \delta + \eta \cdot g$). This creates two risks:
  *   **Growth Dependency:** It forces us to take a strong stance on future economic growth. If $g$ falls (due to climate damages or stagnation), the discount rate collapses, potentially implying infinite present values for long-term benefits.
  *   **Market Dislocation:** A near-zero near-term rate conflicts with the actual cost of capital for public investments, risking the approval of projects that displace more valuable private capital in the short run.

  **Recommendation**

  I propose we adopt a **hybrid approach** that satisfies the ethical imperative without ignoring market reality or growth uncertainty.

  **1. Set Pure Time Preference ($\delta$) at 0.1%**
  We should reject both exactly zero and exactly one percent.
  *   **Why not 0%?** A rate of exactly zero assumes with certainty that the society valuing the project will exist indefinitely. A small positive value (0.1%) acts as a proxy for existential risk (the probability that the polity or humanity does not survive to enjoy the benefit), not impatience.
  *   **Why not 1%?** 1% implies a degree of impatience inconsistent with intergenerational equity.
  *   **The Compromise:** 0.1% acknowledges the ethical priority of the future while mathematically accommodating the non-zero probability of catastrophic rupture.

  **2. Adopt a Declining Term Structure**
  We should not apply a single constant rate. I recommend a schedule that declines over the project horizon:
  *   **0–50 years:** ~3.0% (Consistent with current market conditions and $\eta \cdot g$).
  *   **50–100 years:** ~2.0%
  *   **100+ years:** ~1.0%

  This addresses the "market consistency" concern. In the near term, the total rate ($r$) remains close to current capital costs because $\eta \cdot g$ does the heavy lifting, not $\delta$. In the long term, the rate declines to reflect uncertainty about future growth rates (the Weitzman-Gollier effect) and the ethical weight of distant generations.

  **3. Explicitly Separate Catastrophe Risk**
  The "premium for catastrophe risk" currently buried in the 3.5% must be removed from the discount rate. Catastrophic risks (e.g., climate tipping points) should be handled via **scenario analysis and risk-adjusted benefits**, not by inflating the discount rate. Inflating the rate to account for risk paradoxically undervalues the insurance value of projects that mitigate those very risks.

  **Path Forward for Thursday**

  This approach allows us to tell the Office of Management and Budget and the public that:
  1.  We are not ignoring market rates (near-term rates remain realistic).
  2.  We are not discriminating against the future (pure time preference is near-zero).
  3.  We are handling risk transparently (via scenario analysis, not a blunt rate hike).

  I ask that the group come to Thursday's meeting prepared to vote on the **0.1% $\delta$** parameter specifically, treating the term structure and risk adjustments as separate, subsequent technical decisions.

  **[Your Initials]**
