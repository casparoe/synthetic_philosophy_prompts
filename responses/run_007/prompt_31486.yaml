answer: |-
  ### Introduction

  To evaluate competing theories of the norm of assertion, one must first establish the data that any such theory is obliged to explain. The debate is not merely about stipulating a rule that sounds plausible; it is about finding a principle that systematises our intuitive judgements regarding when an assertion is proper, when it is open to criticism, and what it accomplishes socially and epistemically. The following framework outlines the conceptual distinctions and specific desiderata that an adequate theory must address. These criteria are pitched to allow for a fair comparison between the Knowledge Norm (KN), Truth Norm (TN), Belief Norm (BN), Justification/Warrant Norm (JN), and the view that there is No Constitutive Norm (NN).

  ### I. Essential Conceptual Distinctions

  Before assessing specific cases, an adequate theory must respect three structural distinctions. Failure to do so results in category errors rather than substantive disagreement.

  1.  **Violation vs. Blamelessness:**
      *   **Specification:** A theory must distinguish between an assertion that *violates* the norm (is incorrect) and an assertion for which the speaker is *blameless* (is reasonable given their perspective).
      *   **Motivation:** This is required to handle cases of warranted falsehoods. If a speaker asserts a falsehood on the basis of overwhelming evidence, we intuitively feel they should not be castigated, yet many theories (KN, TN) hold the assertion is improper.
      *   **Status:** **Non-negotiable.** Any theory that conflates correctness with blameworthiness cannot account for the difference between being unlucky and being negligent.

  2.  **Constitutive vs. Prudential/Moral Norms:**
      *   **Specification:** The theory must identify a rule that is *constitutive* of the act of assertion (much like the rules of chess are constitutive of moving a bishop), distinct from norms of politeness, prudence, or morality.
      *   **Motivation:** One may assert a truth that is hurtful (violating politeness) or assert a secret that one knows (violating prudence) without ceasing to have made a proper *assertion*. The target norm governs the act *qua* assertion.
      *   **Status:** **Non-negotiable.** Without this, the 'No Norm' view becomes indistinguishable from the claim that assertion is merely governed by a cluster of context-sensitive practical norms.

  3.  **Norm of Assertion vs. Norm of Belief:**
      *   **Specification:** The theory must clarify whether the norm of assertion is derivative of the norm of belief or sui generis.
      *   **Motivation:** If assertion is the expression of belief, the BN suggests the norms are identical. If assertion is a tool for knowledge transmission, the KN suggests assertion has a stricter standard than belief.
      *   **Status:** **Preference.** This is a theoretical choice. The BN camp prefers identity; the KN camp prefers assertion as a higher standard.

  ### II. The Desiderata

  The following six criteria represent the phenomena an adequate theory must capture. For each, the motivating case is specified, along with its status as a hard constraint or a theoretical preference.

  #### 1. The Lottery Constraint
  *   **The Case:** A speaker asserts, 'Your ticket has lost,' based solely on the knowledge that the odds are millions to one, without checking the results.
  *   **The Requirement:** The theory must explain why this assertion strikes us as improper, despite the high statistical probability of truth.
  *   **Status:** **Non-negotiable.** The intuition that one cannot assert lottery propositions on statistical grounds alone is robust across most contexts. A theory that permits this (e.g., a simple probabilistic JN) fails to match practice.

  #### 2. The Moorean Constraint
  *   **The Case:** Assertions of the form '*p*, but I do not believe that *p*' or '*p*, but I do not know that *p*'.
  *   **The Requirement:** The theory must explain the absurdity or paradoxical nature of these conjunctions without claiming they are logically contradictory (since they can be true).
  *   **Status:** **Non-negotiable.** The infelicity of Moorean sentences is a datum of ordinary language. Any theory that predicts these should be felicitous is immediately suspect.

  #### 3. The Warranted Falsehood Constraint
  *   **The Case:** A speaker asserts a falsehood based on misleading but overwhelming evidence (e.g., asserting a clock shows the correct time when it has stopped, though it happens to be that time, or conversely, asserting a true time when the clock is stopped but the speaker doesn't know it). More precisely: asserting *p* where *p* is false, but the speaker has excellent justification.
  *   **The Requirement:** The theory must account for the speaker's blamelessness while maintaining a stance on whether the norm was violated.
  *   **Status:** **Preference.** This is the primary battleground between externalists (KN, TN) and internalists (JN, BN). Externalists treat the assertion as improper but blameless; internalists treat it as proper. A theory need not pick the externalist line, but it must *account* for the intuition of blamelessness.

  #### 4. The Disavowal Constraint
  *   **The Case:** Assertions accompanied by explicit disavowals, such as '*p*, but I don't know that *p*' or '*p*, but I don't believe it'.
  *   **The Requirement:** The theory must explain why appending these clauses renders the assertion infelicitous (the 'Moorean' effect applied to knowledge/belief).
  *   **Status:** **Non-negotiable.** Similar to the Moorean Constraint, the linguistic data is clear: these utterances are pragmatically defective. The theory must explain why the norm of assertion clashes with the disavowal.

  #### 5. The Testimonial Constraint
  *   **The Case:** A hearer accepts an assertion. What epistemic position does this grant them?
  *   **The Requirement:** The theory must explain what a hearer is entitled to take from an assertion. If assertion is governed by knowledge, the hearer should be entitled to acquire knowledge. If merely by truth or belief, the entitlement might be weaker.
  *   **Status:** **Non-negotiable.** Assertion is the primary vehicle of testimony. A theory that severs the link between proper assertion and the hearer's epistemic entitlement fails to explain the social function of the practice.

  #### 6. The Challenge and Retraction Constraint
  *   **The Case:** When an assertion is challenged ('How do you know that?') or when a speaker retracts ('I shouldn't have said that').
  *   **The Requirement:** The theory must align the constitutive norm with the standard patterns of challenge and retraction. Specifically, it must explain why 'How do you know?' is the default challenge, rather than 'Is it true?' or 'Do you believe it?'.
  *   **Status:** **Non-negotiable.** The linguistic practices of challenging and retracting are the observable enforcement mechanisms of the norm. A theory that predicts the wrong challenge is inappropriate is failing to describe the practice.

  ### III. Tensions and Trade-offs

  No theory satisfies all desiderata without cost. The primary tension lies between **The Lottery Constraint** and **The Warranted Falsehood Constraint**.

  *   **The Tension:** To rule out lottery assertions (which are likely true but unknown), one typically needs a factive norm (like KN or TN). However, a factive norm renders warranted false assertions *violations* of the norm. To save the speaker from blame in warranted falsehood cases, the theory must introduce a robust distinction between violation and blamelessness. Conversely, a JN can easily explain blamelessness in falsehood cases (the speaker was justified) but struggles to rule out lottery assertions (the speaker is statistically justified).
  *   **Dissolving the Tension:**
      *   **Knowledge Norm (KN):** Accepts the tension. Asserting a warranted falsehood is a violation (improper) but blameless. Asserting a lottery proposition is a violation (no knowledge).
      *   **Justification Norm (JN):** Denies the Lottery Constraint's force (arguing lottery assertions are proper, or that statistical evidence isn't 'justification' enough) or accepts that warranted falsehoods are fully proper.
      *   **Truth Norm (TN):** Similar to KN but struggles more with the 'How do you know?' challenge, as truth is not always accessible to the speaker to defend.

  A secondary tension exists between **The Disavowal Constraint** and **The No Norm View**. If there is no constitutive norm, the systematic infelicity of disavowals must be explained away as mere conversational implicature or pragmatic inconsistency, which some argue is less parsimonious than positing a rule.

  ### IV. The Eliminative Desideratum

  If one must identify the single desideratum that does the most work in eliminating candidate norms, it is **The Challenge and Retraction Constraint (specifically regarding 'How do you know?')**.

  *   **Reasoning:** While the Lottery Case is powerful, contextualists and proponents of JN can argue away the intuition (claiming standards shift, or that statistical evidence is insufficient justification). However, the linguistic practice of challenging an assertion is public and stable. The fact that the appropriate challenge is almost universally 'How do you know?' (or 'Are you sure?') rather than 'Is it true?' or 'Do you believe it?' directly targets the *standard* the speaker is held to.
  *   **Impact:**
      *   It eliminates the **Truth Norm**, because a speaker cannot defend 'It is true' without appealing to knowledge or evidence; truth itself is not a defence the speaker can offer.
      *   It eliminates the **Belief Norm**, because 'Do you believe it?' is a challenge to sincerity, not to the assertion's epistemic standing.
      *   It puts pressure on the **Justification Norm**, because 'How are you justified?' is a possible challenge, but 'How do you know?' is more specific and factive.
      *   It is the strongest evidence for the **Knowledge Norm**, as it aligns the norm with the demand for knowledge.
      *   It forces the **No Norm** view into a complex pragmatic explanation of why we *act* as if there is a knowledge norm.

  ### V. Preliminary Scoring of Candidate Views

  Here is how the five candidate views fare against the **non-negotiable** desiderata (Lottery, Moorean, Disavowal, Testimony, Challenge), assuming the distinction between violation and blamelessness is available where needed.

  1.  **Knowledge Norm (KN):**
      *   **Score:** High.
      *   **Performance:** Naturally explains the Lottery Case (no knowledge), Moorean/Disavowal cases (contradicts the rule), and the Challenge data ('How do you know?' checks the rule). Handles Testimony well (transmission of knowledge). Must rely on the violation/blamelessness distinction to handle Warranted Falsehoods.

  2.  **Truth Norm (TN):**
      *   **Score:** Moderate.
      *   **Performance:** Explains Moorean/Disavowal cases reasonably well. Struggles with the Lottery Case (high probability of truth is often sufficient for 'reasonable' assertion under TN unless truth is strictly factive and known). Major struggle with the Challenge data: 'How do you know?' is not the appropriate challenge for a truth rule; 'Is it true?' is, but that is not how we speak.

  3.  **Belief Norm (BN):**
      *   **Score:** Low.
      *   **Performance:** Fails the Moorean Constraint (asserting '*p* but I don't believe *p*' violates the norm, but '*p* but I don't *know* *p*' would be fine, which it isn't). Fails the Lottery Case (one can believe a ticket lost on statistical grounds). Fails the Challenge data ('Do you believe it?' is not the standard epistemic challenge).

  4.  **Justification/Warrant Norm (JN):**
      *   **Score:** Moderate/High.
      *   **Performance:** Excellent on Warranted Falsehoods (no violation). Struggles significantly with the Lottery Case (statistical evidence often counts as justification, so it predicts lottery assertions are proper). Struggles with the Challenge data ('How do you know?' implies a factive standard exceeding mere justification).

  5.  **No Constitutive Norm (NN):**
      *   **Score:** Low.
      *   **Performance:** Must explain all the above constraints as pragmatic implicatures or social conventions rather than constitutive rules. While it avoids positing a mysterious rule, it struggles to explain the *systematicity* of the criticism (why 'How do you know?' is always the right question). It risks failing the Testimonial Constraint by making the hearer's entitlement too context-dependent.

  ### Summary for the Reader

  As you proceed into the literature, use the **Challenge Constraint** as your primary filter. If a theory cannot explain why we ask 'How do you know?', it is likely deficient. However, keep the **Violation vs. Blamelessness** distinction close at hand; without it, the Knowledge Norm appears too harsh on warranted falsehoods, and the Justification Norm appears too permissive on lottery propositions. The literature largely consists of attempts to balance these two poles.
