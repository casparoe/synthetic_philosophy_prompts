answer: |-
  The phenomenon you are describing has a well-established name in cognitive science and artificial intelligence: **Conceptual Slippage** (often just called **Slippage**).

  This term was coined and rigorously defined by Douglas Hofstadter and his student Melanie Mitchell in the context of the **Copycat project** (detailed in their 1995 book *Fluid Concepts and Creative Analogies*). The Copycat computer model was built specifically to solve the exact letter-string analogy puzzles you are designing (e.g., *abc → abd*, what does *xyz* become?).

  ### Why "Conceptual Slippage" Fits
  Your observation that concepts "quietly bend into a neighboring rule" is the precise definition of slippage in this framework. Hofstadter argues that concepts are not rigid boxes but have "halos" of neighboring concepts. Under normal circumstances, the core of the concept is activated (e.g., "successor"). However, when the context exerts **pressure** (e.g., the letter 'z' has no successor in the standard alphabet), the activation slips to a neighboring concept in the semantic network (e.g., "predecessor").

  Crucially, slippage explains the phenomenological aspect you noticed: solvers insist they applied the "same" rule. This is because slippage preserves the **abstract relationship** while altering the **concrete instantiation**.
  *   **Abstract Relation:** "Change the edge letter to its alphabetic neighbor."
  *   **Concrete Instantiation 1:** Right edge, forward neighbor (*c → d*).
  *   **Concrete Instantiation 2:** Left edge, backward neighbor (*x → w*).

  To the solver, the *abstract relation* is what constitutes the "rule." The slippage happens in the mapping process, below the level of conscious rule formulation, which is why it feels seamless rather than like a rule switch.

  ### Distinctions from Related Concepts

  1.  **Vs. Analogy:** Analogy is the macroscopic task ($A:B :: C:D$). Slippage is the microscopic cognitive mechanism that allows the analogy to be completed when a literal mapping fails. You cannot have this specific type of fluid analogy without slippage.
  2.  **Vs. Conceptual Blending:** Blending (Fauconnier & Turner) typically involves projecting elements from two input spaces into a third "blended" space to create new meaning (e.g., a "computer virus"). Slippage is about adjusting the *mapping links* between a source and a target to preserve structural consistency, not necessarily creating a new blended domain.
  3.  **Vs. Rule-Switching:** Rule-switching implies a conscious decision ("Plan A failed, I will now try Plan B"). Slippage is unconscious and automatic. The solver does not feel they have switched plans; they feel they have executed the *same* plan in a constrained environment.
  4.  **Vs. Generalization:** Generalization is applying a broad rule to new instances (e.g., "add 1" works for 2 and 100). Slippage occurs when the broad rule *cannot* apply literally and must deform (e.g., "add 1" becomes "subtract 1" because of a boundary).

  ### Boundaries of the Phenomenon
  For a bend to count as slippage, it must be **local** and **pressure-driven**.
  *   **Local:** The concept must slip to a near neighbor in the conceptual network (e.g., *successor → predecessor*, *letter → group*, *right → left*). A jump from *successor → double* without intermediate steps is not slippage; it's a leap.
  *   **Pressure-Driven:** The slippage must be motivated by the structure of the target string (e.g., the 'z' boundary, or the pre-existing grouping in *iijjkk*). Random variation is not slippage.

