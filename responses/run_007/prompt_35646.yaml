answer: |-
  This is one of the most common sticking points in bargaining theory. You can crunch the Lagrangians for Nash or draw the lines for Kalai–Smorodinsky (K-S) without ever grasping *why* they disagree.

  The short answer is: **Nash cares about the local trade-off at the deal; Kalai–Smorodinsky cares about the ratio of your gain to your maximum possible gain.**

  Here is the intuitive breakdown, the conflict, and a concrete example.

  ---

  ### 1. The Core Philosophy: What is "Fair"?

  #### Nash Bargaining Solution (NBS)
  *   **The Vibe:** "Let's split the surplus where our marginal rates of substitution are equal."
  *   **Fairness Concept:** Fairness is about **efficiency at the margin**. Nash assumes that if we are rational, we will settle at a point where neither of us can give up a little bit of utility to get more from the other person without making the product of our gains smaller.
  *   **The Axiom (IIA):** *Independence of Irrelevant Alternatives.*
      *   **Intuition:** If we agree on a deal in a large set of options, and then we remove options that we *weren't going to pick anyway*, our deal shouldn't change.
      *   **Implication:** The solution depends only on the shape of the feasible set **locally**, right around where the agreement happens. It ignores "utopian" outcomes that are technically possible but inefficient.

  #### Kalai–Smorodinsky Solution (K-S)
  *   **The Vibe:** "Let's split the surplus proportionally to our best-case scenarios."
  *   **Fairness Concept:** Fairness is about **proportional gains**. If your best possible outcome (your "ideal point") is twice as high as mine, you should get twice as much of the surplus.
  *   **The Axiom:** *Individual Monotonicity.*
      *   **Intuition:** If the set of possible deals expands in your favor (your maximum possible payoff increases) while my maximum stays the same, your actual payoff should not decrease.
      *   **Implication:** The solution depends on the **global** shape of the set, specifically the "corners" (the ideal point), even if those corners aren't on the efficient frontier.

  ---

  ### 2. Addressing Your Confusion: "The Pie"

  You asked: *"Doesn't monotonicity just mean that if the pie gets bigger for you but not for me, you shouldn't get less, and why would Nash violate that?"*

  You are very close, but there is a subtle distinction. Monotonicity isn't about the *agreed* pie getting bigger; it's about your **maximum potential** (your threat point or utopia point) getting bigger.

  **Why Nash Violates Monotonicity:**
  Nash maximizes the *product* of gains $(u_1 - d_1)(u_2 - d_2)$. Geometrically, this finds the point where a hyperbola is tangent to the feasible frontier.

  Imagine the frontier expands for Player 1 (Player 1's max payoff increases).
  1.  **K-S View:** The line from the disagreement point to the Ideal Point gets steeper. The intersection with the frontier moves up. Player 1 gets more. (Monotonicity satisfied).
  2.  **Nash View:** Nash looks at the *curvature* of the frontier. If the set expands in a way that makes the frontier "flatter" near the solution, the tangent point might shift to give Player 2 *more* utility to maintain the optimal product ratio, even though Player 1's potential increased.

  **In plain English:** Nash says, "I don't care that you *could* have gotten 100 points if things went perfectly. I care about what we can trade *right here*." K-S says, "The fact that you *could* get 100 points gives you more bargaining power, so you should get a larger share of the actual deal."

  ---

  ### 3. A Concrete Example Where They Differ

  Let's construct a simple 2-person game where the feasible set is a polygon. This makes the algebra easy but the geometry distinct.

  **The Setup:**
  *   **Players:** 1 and 2.
  *   **Disagreement Point ($d$):** $(0, 0)$. (If we don't agree, we both get 0).
  *   **Feasible Set ($S$):** The convex hull of four points: $(0,0), (4,0), (0,3),$ and **$(3,2)$**.
      *   Think of this as a quadrilateral. The "Pareto Frontier" (the efficient edge) consists of two line segments connecting $(0,3) \to (3,2) \to (4,0)$.
      *   Notice the "kink" at $(3,2)$.

  **Step 1: Find the Ideal Point ($I$)**
  The Ideal Point is the maximum possible payoff for each player individually within the set $S$.
  *   Max for Player 1: Look at the x-coordinates. The max is **4**.
  *   Max for Player 2: Look at the y-coordinates. The max is **3**.
  *   **Ideal Point $I = (4, 3)$.** (Note: This point is *not* feasible, but K-S uses it as a reference).

  **Step 2: Calculate Kalai–Smorodinsky**
  K-S draws a straight line from the Disagreement Point $(0,0)$ to the Ideal Point $(4,3)$.
  *   **Equation of the line:** $y = \frac{3}{4}x$ (or $y = 0.75x$).
  *   We need to find where this line intersects the Pareto Frontier.
  *   Let's check the first segment of the frontier: from $(0,3)$ to $(3,2)$.
      *   Slope = $\frac{2-3}{3-0} = -\frac{1}{3}$.
      *   Equation: $y = 3 - \frac{1}{3}x$.
  *   **Intersect the K-S line with this segment:**
      $$0.75x = 3 - 0.333x$$
      $$\frac{3}{4}x + \frac{1}{3}x = 3$$
      $$\frac{9+4}{12}x = 3 \Rightarrow \frac{13}{12}x = 3$$
      $$x = \frac{36}{13} \approx \mathbf{2.77}$$
      $$y = \frac{3}{4} \times \frac{36}{13} = \frac{27}{13} \approx \mathbf{2.08}$$
  *   **K-S Solution:** $(\approx 2.77, \approx 2.08)$.

  **Step 3: Calculate Nash Bargaining Solution**
  Nash maximizes the product of payoffs: $P = x \cdot y$.
  We check the product along the frontier segments.
  *   **Segment 1** ($(0,3)$ to $(3,2)$): $y = 3 - x/3$.
      *   Product $P = x(3 - x/3) = 3x - x^2/3$.
      *   To maximize, take derivative: $3 - 2x/3 = 0 \Rightarrow x = 4.5$.
      *   **Problem:** $x=4.5$ is outside this segment (which ends at $x=3$). So the max on this segment is at the endpoint **$(3,2)$**. Product = $6$.
  *   **Segment 2** ($(3,2)$ to $(4,0)$): $y = 8 - 2x$.
      *   Product $P = x(8 - 2x) = 8x - 2x^2$.
      *   To maximize, take derivative: $8 - 4x = 0 \Rightarrow x = 2$.
      *   **Problem:** $x=2$ is outside this segment (which starts at $x=3$). So the max on this segment is at the endpoint **$(3,2)$**. Product = $6$.
  *   **Nash Solution:** Since the product is maximized at the kink, the solution is **$(3, 2)$**.

  **The Result:**
  *   **Nash:** $(3, 2)$
  *   **K-S:** $(2.77, 2.08)$

  **Interpretation:**
  Nash gives Player 1 more ($3 > 2.77$) and Player 2 less ($2 < 2.08$).
  *   **Why?** Nash loves the "kink." At $(3,2)$, the trade-off rate changes abruptly. Nash locks onto that corner because it maximizes the product.
  *   **Why K-S differs:** K-S ignores the kink's local geometry. It only cares that Player 2's ideal point (3) is relatively high compared to Player 1's (4). It draws a straight line and splits the gains proportionally ($2.77/4 \approx 2.08/3 \approx 69\%$ of their max potential). Nash doesn't care about the "4" or the "3" if they aren't part of the local tangent.

  ---

  ### 4. Why is Monotonicity Attractive? (And why choose K-S?)

  Your lecturer says choosing between them is about what you think fairness requires. Here is the trade-off:

  **Choose Nash (IIA) if:**
  You believe bargaining is about **local efficiency**. You think "irrelevant" options (like the theoretical maximum I could get if you got nothing) shouldn't influence the deal.
  *   *Real-world analogy:* Wage negotiation. If the company *could* theoretically make \$1 billion in a fantasy scenario, but realistically makes \$100 million, Nash says the fantasy \$1 billion shouldn't dictate the wage. Only the realistic trade-offs at the margin matter.

  **Choose Kalai–Smorodinsky (Monotonicity) if:**
  You believe bargaining power is derived from **potential**.
  *   *Real-world analogy:* International trade or resource sharing. If Country A discovers a new technology that *could* allow them to produce twice as much (increasing their Ideal Point), Monotonicity says their share of the joint agreement should increase, even if they aren't using that technology yet.
  *   **Why it's attractive:** It prevents a situation where your bargaining position improves (your ceiling rises), but the solution mechanism punishes you by giving you *less* (which Nash can do if the curvature changes). Monotonicity guarantees that having a better "BATNA" (Best Alternative to a Negotiated Agreement) or higher potential never hurts you.

  ### Summary
  *   **Nash** asks: "Where is the tangent that maximizes our joint product?" (Ignores the corners).
  *   **K-S** asks: "Where does the line to our best hopes hit the frontier?" (Ignores the local curvature).
  *   **Conflict:** Nash satisfies IIA (removing unreachable options doesn't change the deal) but violates Monotonicity (your deal can shrink even if your potential grows). K-S satisfies Monotonicity but violates IIA (adding unreachable options changes the Ideal Point, which moves the solution).
