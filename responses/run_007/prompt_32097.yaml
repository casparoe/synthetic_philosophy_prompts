      *   **The Twist (10 mins):** This is where I drive home the Multiple Drafts Model. The distinction collapses not because they are the same, but because the question is ill-posed.
      *   **Conclusion/Assessment (5 mins):** The specific question required.
      *   **What to Refuse:** The "When exactly?" question.

  4.  **Refining the Pedagogical Strategy (Addressing the "Verbal Dispute" worry):**
      *   Students think: "Is it A or B?"
      *   Dennett says: "There is no fact of the matter to distinguish A from B."
      *   Teaching move: Don't ask them to choose. Ask them to design an experiment to tell them apart. They will fail. *That failure* is the lesson.
      *   *Sequence:*
          1.  Recap Phi (briefly).
          2.  Pose the Orwellian/Stalinesque options.
          3.  Group Task: Design the experiment to distinguish them.
          4.  Debrief: Why did you fail? (Because you assume a 'finish line' of consciousness).
          5.  Introduce Multiple Drafts as the dissolution of the problem.

  5.  **Addressing Specific Constraints:**
      *   *British English:* Check spelling (colour, programme, realise, etc.) and tone (polite but authoritative).
      *   *Misconceptions:*
          1.  "One must be true." (Head off early).
          2.  "It's just about memory." (Address during experiment design).
          3.  "Dennett denies consciousness." (Address at the end).
      *   *Final Question:* Needs to test understanding of the *lack* of fact of the matter, not just definitions.
      *   *Refusal:* The "Time of Occurrence" of a conscious experience.

  6.  **Developing the Content (Iterative refinement):**

      *   *Example:* I'll recommend the **Cutaneous Rabbit**. Why? Visual illusions (Phi) tempt students to think of "screens" and "pixels" (Cartesian Theatre). Tactile illusions disrupt the "inner eye" metaphor. It makes the "where and when" of the experience harder to locate physically, supporting Dennett's point.
      *   *Sequence:*
          1.  **Warm-up (5 mins):** Re-state the distinction but immediately problematise the "fact of the matter".
          2.  **The Challenge (20 mins):** "The Experiment Design Game". Groups try to find a neural marker that distinguishes revision (Orwell) from fabrication (Stalin).
          3.  **The Pivot (15 mins):** Discuss why they failed. Introduce Multiple Drafts.
          4.  **Wrap-up (10 mins):** Final question and boundaries.

      *   *Wait, 50 minutes is tight.* I need to be precise.
