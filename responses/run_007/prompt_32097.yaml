answer: |-
  # Section Plan: Dennett on the Orwellian/Stalinesque Distinction

  **Module:** Philosophy of Mind (Year 2)
  **Duration:** 50 Minutes
  **Class Size:** 20 Students
  **Topic:** The Indeterminacy of Conscious Timing (Dennett)

  ## 1. Pedagogical Strategy & Example Choice

  **The Example: The Cutaneous Rabbit Illusion (Not Colour Phi)**
  You should **not** use the Colour Phi phenomenon for this session, even though they have seen it.
  *   **Why?** Students are already fixated on the visual metaphor of a 'screen' or 'projection'. This reinforces the Cartesian Theatre model you are trying to dismantle. With Colour Phi, they inevitably ask, "Where was the dot *really*?" which leads them back to spatialising time.
  *   **The Alternative:** Use the **Cutaneous Rabbit**. A series of taps on the wrist and elbow creates the illusion of taps hopping up the arm.
  *   **Advantage:** It disrupts the 'inner eye' metaphor. It makes the *location* of the experience just as dubious as the *timing*. If they can't agree on where the sensation happened, they are more open to the idea that they can't agree on *when* it became conscious.
  *   **Time Cost:** Spend the first 5 minutes demonstrating/describing it. This investment pays off by breaking their visual biases.

  **The Core Problem:** Students think the Orwellian/Stalinesque distinction is an empirical question (one must be true, we just don't know which). Your goal is to show it is a **conceptual error**. The difference isn't hard to find; there is no fact of the matter to find.

  ---

  ## 2. Session Sequence (50 Minutes)

  ### Part 1: The Trap (00:00 – 00:05)
  *   **Action:** Briefly describe the Cutaneous Rabbit.
  *   **The Setup:** Present the dilemma immediately.
      *   *Stalinesque:* The brain waits for all taps, fabricates the 'hopping' sensation, and then projects it to consciousness.
      *   *Orwellian:* The brain registers the taps as they are, but later revises the memory to include the 'hopping'.
  *   **The Provocation:** Ask the room: "Which one is it? Show of hands for Orwell, show of hands for Stalin."
  *   **Anticipated Move:** They will split or say "We need more data."
  *   **Your Counter:** "For the next 20 minutes, you are not philosophers. You are neuroscientists with unlimited funding. Your job is not to argue; it is to design an experiment that definitively distinguishes the two."

  ### Part 2: The Impossible Experiment (00:05 – 00:30)
  *   **Activity:** Break into four groups of five.
  *   **Task:** Design a protocol to detect the difference. They must specify:
      1.  What neural marker are they looking for?
      2.  At what millisecond does the 'conscious experience' occur?
      3.  How does that marker differ between 'fabrication' (Stalin) and 'revision' (Orwell)?
  *   **TA Role:** Circulate. When a group proposes a solution, play the sceptic.
      *   *If they suggest measuring memory centres:* Ask, "How do you know that isn't part of the conscious construction rather than post-hoc storage?"
      *   *If they suggest measuring early sensory cortex:* Ask, "How do you know that activity isn't unconscious processing that only becomes conscious later?"
      *   *If they appeal to 'what it feels like':* Remind them that subjective report is the *data* to be explained, not the *method* of explanation.
  *   **Goal:** Lead them to frustration. They will realise they cannot pinpoint a 'finish line' where unconscious processing becomes conscious experience.

  ### Part 3: The Dissolution (00:30 – 00:45)
  *   **Plenary Discussion:** Bring the class back together. Ask: "Why was that task impossible?"
  *   **Key Concept:** Guide them to the conclusion that the distinction presupposes a **Cartesian Theatre**—a specific place and time where 'it all comes together'.
  *   **Dennett's Move:** Explain that Dennett isn't saying the two models are the *same*; he is saying the question assumes a 'fact of the matter' that does not exist.
      *   *Analogy:* Asking "Is the nation's economy happening in London or New York?" It's a category error. The economy is distributed; so is consciousness (Multiple Drafts Model).
  *   **Addressing the 'Verbal Dispute' Worry:** Students will say, "So it's just semantics?"
      *   *Correction:* It is not merely verbal; it is **ontologically empty**. It's not that we lack the words; it's that the phenomenon (a single moment of conscious onset) is not real.

  ### Part 4: Conclusion & Boundaries (00:45 – 00:50)
  *   **The Final Question:** (See below).
  *   **What to Refuse:** (See below).

  ---

  ## 3. Misconception Management

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"One model must be true."** | Part 1 (The Trap) | Reframe immediately. State: "Dennett's claim is that nature does not decide this. It is not a hidden fact." |
  | **"It's just an epistemic limit."** | Part 3 (Discussion) | Students will say, "We just can't *measure* it yet." You must insist: "Dennett argues there is nothing *to* measure. It is not a limitation of technology, but of the concept." |
  | **"Dennett denies consciousness exists."** | Part 3 (Discussion) | Clarify: He denies the *theatre*, not the *play*. Experience exists, but it is not a singular event in time. |
  | **"Revision implies lying."** | Part 2 (Group Work) | Students treat 'Orwellian' as confabulation. Remind them: In this context, *all* perception is a form of controlled hallucination. The distinction is about timing, not truth. |

  ---

  ## 4. The Final Assessment Question

  Do not ask them to define the terms. Ask them to apply the logical consequence of the distinction's collapse.

  > **"If a future neuroscientist claims to have located the precise millisecond where an Orwellian revision becomes distinct from a Stalinesque fabrication, what category mistake have they made according to Dennett?"**

  *   **Correct Answer Indicator:** They should identify that the scientist is presupposing a 'finish line' or a 'Cartesian Theatre' where content becomes conscious. They should note that the scientist is treating a distributed process as a discrete event.
  *   **Incorrect Answer Indicator:** They suggest the scientist needs better equipment, or that the scientist has proven Dennett wrong by finding the fact.

  ---

  ## 5. What to Openly Refuse to Settle

  You must draw a boundary around what this tutorial is *not* about. There are two questions students will ask that you should explicitly decline to answer at this level:

  1.  **"But when did the subject *really* feel the tap?"**
      *   **Refusal:** "I am not going to answer that, because Dennett's point is that 'really' has no application here. There is no 'real' time of experience independent of the various discriminatory processes in the brain."
  2.  **"Does this mean qualia don't exist?"**
      *   **Refusal:** "That is the 'Hard Problem' debate, which is for the lecture series. In this section, we are only analysing the *timing* and *narrative* structure of experience. Whether the 'feel' itself is illusory is a separate metaphysical claim."

  ## 6. TA Notes for Delivery (British English)

  *   **Tone:** Keep it Socratic. You are not there to lecture the distinction (they have read the text); you are there to make them feel the *problem* with the distinction.
  *   **Timekeeping:** 50 minutes vanishes quickly. If the 'Experiment' phase runs long, cut the Plenary Discussion short, but do not cut the 'Boundaries' section. Ending on a clear note about what remains unresolved is crucial for their essay writing.
  *   **Spelling/Usage:** Ensure your whiteboard notes use British spelling (e.g., *colour, programme, realise, centre*). Avoid Americanisms like "guess" (use "reckon" or "suppose" if being informal, but standard English is fine).
  *   **Group Dynamics:** With 20 students, ensure the quiet ones in the 'Experiment' phase are tasked with writing down the protocol. This prevents the two loudest students from dominating the design.

  By following this plan, you move them from thinking "I don't know which is true" to "I see why asking which is true is a mistake." That is the philosophical shift required.
