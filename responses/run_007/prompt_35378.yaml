answer: |-
  **The Scenario**

  Marcus, a 68-year-old former architect, executed an advance directive stating that if he ever lost the capacity to recognize his family or understand his own professional work, he should not be given life-sustaining treatment for serious infections. He valued cognitive autonomy and narrative coherence above mere biological existence. Five years later, Marcus suffers advanced vascular dementia. He no longer recognizes his wife or children, cannot identify his own blueprints, and has no autobiographical memory of his career. However, he retains his basic emotional temperament: he is cheerful, enjoys listening to jazz, eats willingly, and engages warmly with caregivers. When he develops severe pneumonia, his current expressed preference is to "get better and stay here," while his advance directive mandates comfort care only. The medical team must decide whether to administer antibiotics (overriding the directive) or withhold them (respecting the directive).

  ***

  **Analysis of the Three Views**

  **(1) The Dworkin-style "Integrity" View:**
  This view distinguishes between *experiential interests* (momentary pleasure or pain) and *critical interests* (values that define a good life). For Dworkin, Marcus's advance directive reflects his critical interests—his deeply held conviction that a life without cognitive recognition and autonomy is not worth living. Even though current Marcus has experiential interests (enjoying jazz, avoiding death), honoring the directive protects the narrative integrity of his life as a whole. To ignore the directive would be to allow his later, diminished state to veto the authoritative values of his competent earlier self. **Verdict: Respect the directive (withhold antibiotics).**

  **(2) The Dresser-style "Present Interests" View:**
  This view argues that moral authority resides only in the currently existing subject of experience. Because Marcus has undergone significant psychological change—losing memory, recognition, and the specific values that motivated the directive—the "Marcus" who wrote the directive is psychologically discontinuous with the "Marcus" in the hospital bed. The earlier self is effectively gone. The current patient has a clear interest in continuing to experience joy and avoiding death. To kill him to satisfy the wishes of a "dead" prior self is to harm a living being for the sake of a ghost. **Verdict: Override the directive (administer antibiotics).**

  **(3) The "Threshold" or "Sliding Scale" View:**
  This view holds that advance directives retain presumptive authority unless psychological continuity drops below a specific threshold of severance. While Marcus has lost significant memory and cognitive capacity, he retains enough psychological connectedness (same temperament, same body, same basic emotional responses) to be considered the same person for moral purposes. The change is significant, but it has not crossed the high threshold required to completely void the directive's authority (such as a persistent vegetative state or total personality obliteration). Therefore, the directive still binds, even if his current preferences differ. **Verdict: Respect the directive (withhold antibiotics).**

  ***

  **The Key Feature and Dresser's Counter-Attack**

  **The Specific Feature:**
  The feature driving the divergence is the **coexistence of significant cognitive/value loss with retained capacity for simple enjoyment.** This creates a "middle ground" of psychological change. For Dworkin and the Threshold view, this change is unfortunate but insufficient to break the moral bond of the life narrative or personal identity. For Dresser, however, this specific combination is decisive: because the values that grounded the directive are gone *while* new interests have emerged, the moral weight shifts entirely to the present.

  **If You Removed That Feature:**
  If you removed the retained capacity for enjoyment (e.g., if Marcus were in a persistent vegetative state with no experiential interests), all three views would likely agree to respect the directive. There would be no current interests to conflict with the past ones, making it an "easy case." Conversely, if you removed the significant cognitive loss (e.g., Marcus was fully competent but just changed his mind), all three would agree to follow his current wishes, as competence trumps prior directives. The tension exists only because he is "happy but gone."

  **Dresser's Counter-Attack:**
  A defender of the Dresser view would attack the other two views by arguing they commit a category error regarding harm. They would argue that Dworkin and the Threshold view are prioritizing abstract metaphysical continuity over concrete welfare. Dresser would claim: "You are sacrificing a happy, living being who wants to live to satisfy the preferences of a person who no longer exists. The 'integrity' of a life story cannot outweigh the actual suffering and death of the current subject. By respecting the directive, you are not protecting Marcus; you are killing him to honor a ghost." They would assert that psychological continuity is not a binary switch but a moral gradient, and in this case, the loss of the *values* that underwrote the directive is enough to sever its authority, regardless of whether we technically call him the "same person."
