  A laboratory technician is required to sterilize instruments by running them through an autoclave cycle that concludes with a green light indicator. A wiring fault causes the light to remain red even after successful sterilization. The protocol mandates: "If red, reset and rerun cycle." The technician resets, runs, sees red, resets, reruns, repeating this for six hours without ever inspecting the instruments directly or calling maintenance, because their performance metrics are tied exclusively to "completed protocol cycles" logged by the machine, and any manual override is recorded as a violation that triggers immediate suspension, functionally coupling their behavior to the machine's feedback loop in a way that makes adherence to the futile cycle the only strategy that avoids penalty within their operational environment.

  (a) The behavior is rigid in the Sphex sense because it follows a fixed stimulus-response pattern: the red light (stimulus) triggers the reset-and-rerun sequence (response), regardless of the actual state of the instruments (the disruption). The agent fails to adapt to the obvious solution (manual inspection or maintenance request) that would resolve the underlying goal (sterilization) more efficiently. A naive observer would call it sphexish because the agent appears trapped in a loop of pointless repetition, seemingly unable to "see" that the indicator is broken and that the procedure has become decoupled from its purpose.

  (b) The structural feature that denies sphexishness is the **contingency between behavioral deviation and external penalty**. The technician's rigidity is not caused by an inability to process the futility, but by a functional constraint where deviating from the script incurs a cost (suspension) that outweighs the cost of repetition. This preserves **instrumental rationality within a constrained utility function**: the agent is successfully maximizing their defined rewards (keeping their job) even while failing the nominal task (sterilizing efficiently). This matters for the debate because it demonstrates that surface rigidity can be the output of a flexible, goal-tracking system operating under specific constraints, whereas the wasp's rigidity is the output of a system lacking such constraint-responsive architecture entirely.

  (c) The element driving the wedge is the **existence of the penalty structure** (the threat of suspension for protocol deviation). If you removed this element—imagine the technician could override the machine without consequence—the case would likely collapse into sphexishness, as there would be no functional reason for a capable human to continue the futile loop. The penalty structure explains the rigidity as a rational adaptation to the environment rather than a cognitive deficit, distinguishing it from the wasp's hardwired inflexibility.

  (d) A committed skeptic would argue that the technician is merely executing a higher-order subroutine: "Avoid Suspension." They would claim this meta-rule is just as fixed and sphexish as the wasp's provisioning routine, merely one level of abstraction higher. This response fails because it conflates **fixed hardware constraints** with **modifiable software constraints**. The technician's adherence to the "Avoid Suspension" rule is contingent on the validity of the threat; if the employer changed the policy, the behavior would change instantly. The wasp's behavior is insensitive to such normative changes. To maintain their position, the skeptic must refine "sphexishness" to mean "any behavior determined by prior causes," which renders the term vacuous for distinguishing agency, effectively conceding that the original distinction (rigidity due to incapacity vs. rigidity due to incentive) was meaningful all along.
