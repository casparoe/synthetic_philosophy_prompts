  #### 4. Board Task (Understanding Check)
  **Time:** Last 5 minutes.
  **Task:** Put the following on the board. Do not ask for a proof. Ask for a diagnosis.

  > **Consider the Poset $(P, \subseteq)$ where $P$ is the set of all **proper** subsets of $\mathbb{N}$ (i.e., $S \subset \mathbb{N}$ and $S \neq \mathbb{N}$).**
  >
  > 1.  Does this poset satisfy the **hypothesis** of Zorn's Lemma? (Does every chain have an upper bound *in P*?)
  > 2.  Does this poset have a **maximal element**?
  > 3.  Does this contradict Zorn's Lemma? Why or why not?

  **Expected Answer Key (for you):**
  1.  **No.** Consider the chain of finite initial segments: $\{1\} \subset \{1,2\} \subset \{1,2,3\} \dots$. The only upper bound in $\mathcal{P}(\mathbb{N})$ is $\mathbb{N}$. But $\mathbb{N} \notin P$. So the chain has no upper bound *in P*.
  2.  **No.** For any proper subset $S$, pick $n \notin S$. Then $S \cup \{n\}$ is a larger proper subset.
  3.  **No Contradiction.** Zorn's Lemma says "IF hypothesis, THEN maximal." Here, the hypothesis fails, so the conclusion is not guaranteed.

  **Why this works:** It tests if they understand that the Upper Bound must lie *in the Poset*, not just in the universe of sets. It tests the difference between "Maximal" and "Nothing bigger exists in the universe."

  ---

  #### 5. What to Explicitly Leave Out
  State this at the beginning or end to manage expectations.

  1.  **The Proof of Zorn's Lemma:** Do not attempt to prove ZL from the Axiom of Choice or Well-Ordering Theorem. It requires transfinite recursion which is beyond the scope. Treat ZL as an axiom for this course.
  2.  **Equivalence of AC, ZL, and Well-Ordering:** Mention they are equivalent, but do not prove the implications.
  3.  **Transfinite Induction:** Do not introduce ordinal numbers. If asked, say "Zorn's Lemma is the tool we use to avoid learning ordinals in this course."
  4.  **Topological Applications:** Do not mention Tychonoff's Theorem or Krull's Theorem (Ideals). Stick to the one carrying example.
  5.  **The "Finite Character" Lemma:** In the Vector Space context (if you mention it as a side note), do not prove that "dependence is finite." State it as a fact. (Since you are using the Partial Injection example, this is naturally avoided).
