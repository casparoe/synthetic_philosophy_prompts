  ### Lecture Plan: Zorn's Lemma (75 Minutes)

  #### 1. Dependency Structure & Order of Ideas
  Do not start with the statement. The statement is meaningless without the vocabulary. Build the vocabulary in this strict dependency order:

  1.  **Partial Orders (Posets):**
      *   *Prerequisites:* Sets, Relations (reflexive, antisymmetric, transitive).
      *   *Definition:* A set $P$ with a relation $\preceq$.
      *   *Examples:* $(\mathbb{R}, \leq)$, $(\mathcal{P}(S), \subseteq)$, $(\mathbb{Z}^+, |)$.
  2.  **Chains:**
      *   *Dependency:* Requires Poset.
      *   *Definition:* A subset $C \subseteq P$ where every pair is comparable ($x, y \in C \implies x \preceq y \text{ or } y \preceq x$).
      *   *Crucial Clarification:* A chain can be uncountable. It is not a sequence.
  3.  **Upper Bounds:**
      *   *Dependency:* Requires Poset and Chain.
      *   *Definition:* An element $u \in P$ such that $\forall c \in C, c \preceq u$.
      *   *Crucial Contrast:* An upper bound must be in $P$, but **need not be in $C$**.
  4.  **Maximal Elements:**
      *   *Dependency:* Requires Poset.
      *   *Definition:* $m \in P$ is maximal if $\forall x \in P, m \preceq x \implies m = x$.
      *   *Crucial Contrast:* Maximal $\neq$ Maximum (Greatest). A maximum is $\geq$ everyone; a maximal is simply not $<$ anyone.
  5.  **Zorn's Lemma Statement:**
      *   *Dependency:* Requires all above.
      *   *Hypothesis:* Every chain in $P$ has an upper bound in $P$.
      *   *Conclusion:* $P$ contains at least one maximal element.

  **Time Allocation:**
  *   0–15 min: Motivation & Poset/Chain Definitions.
  *   15–30 min: Upper Bounds vs. Maximal Elements (The Core Logic).
  *   30–40 min: The Statement of Zorn's Lemma.
  *   40–60 min: The Carrying Example.
  *   60–70 min: Misconception Review.
  *   70–75 min: Board Task.

  ---

  #### 2. The Carrying Example
  **Decision:** I **reject** the usual Vector Space Basis example.

  **Why:** While students know Linear Algebra, the verification that "the union of a chain of linearly independent sets is linearly independent" relies on the **finite character of linear dependence**. Proving this requires a separate lemma ("dependence involves only finitely many vectors"). In a 75-minute lecture focused on the *logic of Zorn's Lemma*, this algebraic verification becomes a cognitive black box that distracts from the order-theoretic mechanics (Chain $\to$ Upper Bound $\to$ Maximal). You end up teaching a Linear Algebra lemma rather than Zorn's Lemma.

  **Replacement:** **The Poset of Partial Injections.**
  *   **The Set ($P$):** Let $A$ and $B$ be non-empty sets. Let $P$ be the set of all **injective partial functions** from $A$ to $B$. (i.e., functions $f: D \to B$ where $D \subseteq A$ and $f$ is one-to-one).
  *   **The Order:** $f \preceq g$ if $g$ extends $f$ (i.e., $\text{dom}(f) \subseteq \text{dom}(g)$ and $g(x) = f(x)$ for all $x \in \text{dom}(f)$).
  *   **The Chain:** A collection of functions $\{f_i\}$ where each extends the previous.
  *   **The Upper Bound:** The union function $F = \bigcup f_i$. (You must verify $F$ is a function and is injective).
  *   **The Maximal Element:** A function that cannot be extended. (If $|A| \leq |B|$, a maximal element is an injection from all of $A$ into $B$).

  **What it must have:**
  *   It must rely only on Set Theory (Functions, Subsets, Unions), which they covered in their Proofs course.
  *   It must clearly demonstrate the "Extension" philosophy of Zorn's Lemma (start small, extend until you can't).
  *   The verification that the union is an upper bound must be visible but quick (union of compatible functions is a function).

  **What it must not have:**
  *   It must not require algebraic structures (Rings, Fields, Vector Spaces).
  *   It must not require "finite character" arguments (like linear dependence).

  ---

  #### 3. Misconception Map
  Address these *before* they become entrenched. Do not wait for questions.

  | Misconception | When to Head It Off | How to Address It |
  | :--- | :--- | :--- |
  | **"Maximal means Maximum (Greatest)."** | **Min 20** (Defining Maximal) | Draw a Hasse diagram with two peaks. Show an element that is $\geq$ nothing else, but not $\geq$ *everything* else. |
  | **"An upper bound of a chain must be *in* the chain."** | **Min 25** (Defining Upper Bound) | Use $(\mathbb{R}, \leq)$. Chain: $[0, 1)$. Upper bound: $1$. $1 \notin [0, 1)$. Emphasize $u \in P$, not necessarily $u \in C$. |
  | **"Chains must be countable (sequences)."** | **Min 15** (Defining Chain) | Explicitly state: "A chain is just a subset where everyone compares. It can be the size of $\mathbb{R}$." Use $\mathbb{R}$ itself as a chain in $\mathbb{R}$. |
  | **"Zorn's Lemma gives an upper bound for the whole Poset."** | **Min 35** (Stating ZL) | Clarify: The hypothesis assumes chains have upper bounds. The conclusion gives a **maximal element**, not a maximum for $P$. |
  | **"Zorn's Lemma is constructive."** | **Min 35** (Stating ZL) | State clearly: "It tells you it exists. It does not tell you how to find it. It is non-constructive." |
  | **"The Empty Poset works."** | **Min 35** (Hypothesis Check) | Ask: "Does the empty chain have an upper bound?" If $P = \emptyset$, no. So ZL requires $P \neq \emptyset$ (implicitly, via the empty chain condition). |
  | **"This is obvious for Finite Dimensions."** | **Min 40** (Motivating Example) | Acknowledge: "Yes, for finite dimensions we use induction. Zorn is the 'Infinite Induction' for when steps don't stop." |

