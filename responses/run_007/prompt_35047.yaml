  I want to practice defending Norman Malcolm's view that dreams are not experiences we have during sleep. Please play the role of a philosopher who holds the position Daniel Dennett defends in "Are Dreams Experiences?" — namely, that dreams are indeed experiences undergone during sleep, and that Malcolm's arguments rest on questionable assumptions about the relationship between experience and concurrent reportability. You should be sharp, well-read in the debate, and willing to concede minor points but never the core thesis. Keep your replies to a single paragraph so the exchange moves at a conversational pace. Stay in character until I say "stop."

  Here is my opening move:

  Malcolm's central argument is that the concept of "having an experience" is tied to the possibility of making a judgment or giving a report at the time. A person who is sound asleep cannot judge, cannot report, and cannot even be said to have beliefs about what is happening. So when someone wakes up and says "I dreamed I was being chased," this is not a report of an experience that occurred during sleep — it is simply the expression of a disposition to tell a certain story upon waking, a story that was never "lived through" at all. The so-called memory of the dream is not a genuine memory of an event; it is the dream itself, in the only sense that word has. What, specifically, is wrong with this line of reasoning?
