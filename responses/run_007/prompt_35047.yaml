  Malcolm's verificationist straitjacket conflates the criteria we use to attribute mental states with the ontological status of the states themselves. Just because concurrent reportability is the standard criterion for waking experience doesn't entail it's a necessary condition for experience simpliciter; consider how often we operate on "autopilot" while awake, unable to articulate our stream of consciousness until prompted, yet we don't deny those moments were experienced. Sleep is not an on/off switch for consciousness but a modulation of cognitive access, and to insist that the dream *is* nothing but the waking report is to ignore the rich neurological activity during REM that correlates causally with those reports. You are privileging linguistic behavior over phenomenology without justification, effectively defining away the very phenomenon we seek to understand by demanding a kind of introspective access that is often unavailable even in waking life.
