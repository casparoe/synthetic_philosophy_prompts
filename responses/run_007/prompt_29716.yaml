answer: |-
  **MEMORANDUM**

  **TO:** Editorial Policy Committee
  **FROM:** Chair, Editorial Policy Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Revised Author Guidelines

  **Context**
  The replication crisis necessitates urgent reform of our author guidelines. The current manuscript under review (p = .04 interaction, 5-condition design, unpreregistered, selective reporting of 1 of 3 measures) exemplifies systemic vulnerabilities: questionable research practices (QRPs) regarding flexibility in analysis and outcome reporting. Reviewers are split because current guidelines allow such ambiguity.

  **Recommendation**
  I recommend adopting a **Hybrid Policy**. This approach integrates the preregistration requirement from Proposal A with the transparency and reporting standards from Proposal B, while excluding the mandatory Bayes factor requirement and the rigid significance threshold tightening.

  **Rationale**
  The trigger manuscript failed due to selective reporting and lack of design commitment. Proposal B's transparency mandates (disclosing all measures) directly address selective reporting. Proposal A's preregistration mandate addresses HARKing (hypothesizing after results are known). However, mandating Bayes factors (Proposal A) creates a prohibitive barrier for many authors lacking Bayesian training, and rigidly tightening p-thresholds (Proposal B) risks increasing false negatives without addressing root causes. The Hybrid model maximizes rigor and reproducibility while maintaining feasibility for a general psychology journal.

  **Implementation Plan and Timeline**
  1.  **Drafting (Months 1-2):** Revise guidelines to mandate preregistration for confirmatory studies and full disclosure of all collected data/measures.
  2.  **Editorial Training (Month 3):** Train editors and reviewers on verifying preregistrations and disclosure statements.
  3.  **Soft Launch (Months 4-5):** Encourage compliance for new submissions; provide feedback without immediate rejection.
  4.  **Full Enforcement (Month 6):** Compliance becomes mandatory for acceptance.

  **Implications for the Manuscript Under Review**
  While new policies typically apply to new submissions, the principles of transparency are immediate ethical standards. We should issue a major revision request requiring the authors to upload all raw data and report results for all three outcome measures. If the interaction effect does not hold across measures or appears driven by selective reporting, the manuscript should be rejected.

  **Strongest Opposing Consideration**
  The primary argument against this Hybrid recommendation is the increased administrative burden on editors and reviewers. Verifying preregistrations against final manuscripts and checking full disclosure statements requires significant time and expertise. Critics may argue this slows the publication pipeline and disadvantages researchers from institutions with less support for open science infrastructure, potentially reducing submission volume from diverse populations.

