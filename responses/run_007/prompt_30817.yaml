answer: |-
  This is a profound and deeply recognized problem within moral philosophy. You are not merely experiencing personal burnout; you are encountering the lived reality of some of the most significant objections to impartial consequentialism. The tension you describe—between the impartial demand to maximize the good and the partial commitments that constitute a meaningful human life—is the central fault line in modern ethical theory.

  Given your background, I will avoid platitudes about "self-care" and instead offer a diagnosis grounded in the meta-ethical and normative literature. The question you pose—is this a flaw in the theory or a limit of the person?—has been debated extensively. Here are four rigorous philosophical frameworks through which to analyze your situation.

  ### 1. The Integrity and Alienation Objection (Bernard Williams)
  Your description of feeling "distant" and viewing relationships as "indulgences" echoes Bernard Williams' famous critique of utilitarianism in *A Critique of Utilitarianism* (1973). Williams argues that impartial consequentialism attacks the agent's **integrity**.

  For Williams, our "ground projects" and deep personal commitments (to a partner, to a specific intellectual passion) are not merely preferences to be weighed in the utilitarian calculus; they are what give us a reason to live and act at all. When a moral theory requires you to view these commitments from an entirely impartial standpoint, it alienates you from the very source of your agency.

  **The Diagnosis:** If the theory requires you to detach from the relationships that make you *you*, it may be demanding a kind of psychological fragmentation. Williams suggests that a theory that requires the agent to become a neutral channel for the satisfaction of aggregate utility is flawed because it fails to respect the boundary of the self. The "grim dutifulness" you feel is the symptom of this alienation. You are acting as a vessel for the "impartial point of view" rather than as an integrated agent.

  ### 2. The "Moral Saint" Problem (Susan Wolf)
  In *Moral Saints* (1982), Susan Wolf argues that a life dominated exclusively by moral concern is not only psychologically difficult but arguably undesirable. A "moral saint" (in the utilitarian sense) would have to give up the eccentricities, hobbies, and personal loves that make a life rich and well-rounded.

  Wolf distinguishes between the *Rational Love of Morality* model and the *Moral Mastery* model. You seem to be attempting the latter. Her point is not that morality is unimportant, but that moral value is not the *only* value. A life lacking in non-moral virtues (wit, creativity, passion for specific, non-optimal projects) is impoverished.

  **The Diagnosis:** Your advisor's concern about your research losing "depth" is crucial here. Intellectual depth often requires obsession, idiosyncrasy, and a kind of selfish immersion in a problem that an impartial calculator might deem "inefficient." If the theory forbids the very states of mind required for excellence in your profession, the theory may be self-defeating regarding your specific potential contribution.

  ### 3. The Criterion of Rightness vs. Decision Procedure
  A standard move in consequentialist defense is to distinguish between the **criterion of rightness** (what makes an act right) and the **decision procedure** (how an agent should decide what to do).

  Even if it is true that the right act is the one that maximizes the good (criterion), it does not follow that you should *try* to maximize the good in every moment (decision procedure). This is the core of **Indirect Utilitarianism** (or Rule Utilitarianism).

  **The Diagnosis:** You may be suffering from what Peter Railton calls "alienated consequentialism." A sophisticated consequentialist should recognize that human beings are not optimized for constant, impartial calculation.
  *   **Psychological Sustainability:** If you burn out, drop out of academia, or your partner leaves you, your long-term capacity to do good diminishes radically.
  *   **Epistemic Humility:** You are currently a PhD student. Your assessment that "working/volunteering now" is better than "building a life/partnerhip/research depth" assumes a short time horizon. If a sustainable, happy, connected you produces a groundbreaking thesis that influences policy for decades, that may outweigh the immediate utility of your current stipend donations.
  *   **The Paradox of Hedonism (applied to Morality):** Just as directly pursuing happiness often eludes it, directly pursuing the "best state of affairs" in every micro-interaction can undermine the dispositions (loyalty, love, intellectual curiosity) that actually produce the best states of affairs over a lifetime.

  ### 4. The Overdemandingness Objection
  You ask if the demand is unreasonable. The **Overdemandingness Objection** posits that a moral theory is flawed if it demands sacrifices that exceed what can reasonably be expected of moral agents.

  While you correctly note that difficulty does not imply falsehood, there is a distinction between *difficult* and *destructive*. If a theory systematically undermines the conditions necessary for human flourishing (social bonding, mental health, intellectual passion), many philosophers argue this is a *reductio ad absurdum* of the theory, not a testament to the agent's weakness.

  Samuel Scheffler, in *The Rejection of Consequentialism*, argues for an "agent-centered prerogative." He suggests that agents are morally permitted to give some extra weight to their own interests and projects, not because those interests are objectively more important, but because acknowledging this prerogative is necessary for the theory to be livable and for agents to maintain their integrity.

  ### Synthesis and Recommendation

  You are asking whether the problem is the theory or the person. The philosophical consensus among those who take these objections seriously is that **a theory which renders a life unrecognizable as a good human life is likely in need of revision.**

  Here is a proposed path forward that remains philosophically rigorous:

  1.  **Shift from Act to Indirect Consequentialism:** Accept that the *best way* to be an impartial benefactor of humanity is not to *act* like an impartial calculator in every moment. Cultivating deep love for your partner and deep passion for your research may be the most utility-maximizing strategy available to you *in the long run*, even if it looks sub-optimal in the short run.
  2.  **Re-evaluate the "Impartial Point of View":** Consider whether true impartiality requires ignoring the *instrumental value* of partial relationships. Your relationship with your partner is not just an "indulgence"; it is a support structure that keeps you sane. Your research is not just a job; it is your potential leverage point for impact. Neglecting them is arguably *irrational* from a consequentialist standpoint.
  3.  **Accept Supererogation:** Consider adopting a view where maximizing the good is *good*, but not strictly *obligatory* beyond a certain threshold. If you are giving a "substantial portion" of your stipend, you are already doing far more than most. Demanding more to the point of dysfunction yields diminishing returns.
  4.  **Listen to the Advisor and Partner:** They are observing data points you cannot see. The "loss of depth" in your research suggests your current mode of operation is reducing your intellectual capital. If your goal is to reduce suffering, a burnt-out philosopher with shallow research is less effective than a thriving one with deep insights.

  **Conclusion:**
  It is not a failure of moral character to find that a theory which strips your life of meaning is unsustainable. In fact, recognizing that your attachments, passions, and relationships are necessary preconditions for *any* effective moral agency is a more sophisticated moral insight than the grim duty you are currently enduring. You do not need to abandon the impartial point of view entirely; you need to integrate it into a human life, rather than sacrificing the human life to the point of view.
