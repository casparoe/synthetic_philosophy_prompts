      *   **Ranking:**
          1.  (2) + (3) [Direct Contradiction]
          2.  (3) + (5) [Makes Bookkeeping impossible]
          3.  (1) + (3) [Threatens the unity of the Good]
      *   **Cheapest Fixes:**
