prompt: |-
  ok so my friend has this whole system for writing essays where he splits the prompt into a bunch of tiny questions, answers each one really carefully, and then just glues all the answers together. he says if each tiny answer is right, the final essay has to be right, cause there's nothing else left to get wrong. but whenever i read his essays they feel kind of hollow — every sentance is fine on its own, but the whole thing somehow misses the point of the prompt. when i said that he got annoyed and told me to point to one specific sentance that's wrong or admit im just biased against his method. i cant point to one. is it actually possible for all the parts to be right and the whole thing to still be wrong? or am i just being unfair?
