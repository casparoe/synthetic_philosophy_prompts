answer: |-
  Yes, you are absolutely right, and your friend is falling for a classic logical trap.

  It is entirely possible for every individual part of something to be "correct" while the whole thing is a failure. In logic, this is known as the **Fallacy of Composition**. It is the mistaken belief that what is true of the parts must automatically be true of the whole.

  Here is why your friend's method is failing, why you can't find a "wrong sentence," and how to explain this to him without starting a fight.

  ### 1. The Error Isn't in the Sentences; It's in the Connections
  Your friend is challenging you to find a *factual* error ("point to one specific sentence that's wrong"). But in essay writing, the quality doesn't come from the factual accuracy of individual sentences. It comes from **synthesis**.

  *   **His Method:** Prompt $\rightarrow$ Question 1 (Answer) + Question 2 (Answer) + Question 3 (Answer) = Essay.
  *   **What an Essay Needs:** Thesis $\rightarrow$ Argument A (supported by evidence) $\rightarrow$ Argument B (connected to A) $\rightarrow$ Conclusion (synthesizing A and B).

  When he "glues" the answers together, he is creating a list, not an argument. The error isn't in Sentence A or Sentence B; the error is in the **transition** between them. If Sentence A doesn't logically lead to Sentence B, the *relationship* is wrong, even if both sentences are factually true.

  **Analogy:** Imagine you buy the finest pistons, tires, steering wheel, and seats money can buy. You lay them out on the garage floor. Every single part is "right." But you don't have a car; you have a pile of parts. You can't drive a pile of parts. The "car-ness" comes from how the parts are assembled, not the parts themselves.

  ### 2. Emergent Properties
  Writing has what systems theorists call **emergent properties**. These are qualities that only exist when the parts work together, such as:
  *   **Flow:** Does one idea naturally lead to the next?
  *   **Tone:** Is the voice consistent?
  *   **Thesis Strength:** Does the whole piece prove a central point?

  You cannot find "flow" or "tone" in a single sentence. You can only find them in the paragraph or the essay as a whole. When your friend asks you to point to one wrong sentence, he is asking you to find a structural problem in a single brick. You can't do that, because the problem is with the wall, not the brick.

  ### 3. Answering the Prompt vs. Answering Questions
  Prompts usually ask for a **task**, not just information.
  *   **Prompt:** "Evaluate the extent to which technology improved communication."
  *   **Friend's Sub-questions:** "What is technology?" "What is communication?" "Did it improve?"
  *   **The Problem:** He might answer all three correctly. But if he doesn't weigh the evidence, discuss counter-arguments, or define "extent," he hasn't actually done the task. He has just defined terms and stated a conclusion. He missed the *nuance* required by the prompt.

  ### How to Explain This to Him
  Since he is being defensive, don't attack his method. Attack the *metric* he is using to judge success.

  **Say this:**
  > "I can't point to a wrong sentence because the sentences aren't wrong. They're factually correct. But an essay isn't just a list of facts; it's an argument. The problem isn't the bricks; it's the mortar. When you glue the answers together, the logical flow gets lost. It feels like a checklist, not a story."

  **Try this test:**
  Ask him to read his essay out loud, but stop at the end of every paragraph and ask: *"How does this paragraph prove the thesis, and how does it lead into the next one?"*
  *   If he has to pause and think hard to explain the connection, the connection isn't on the page.
  *   If he says, "Well, it's obvious," but it didn't feel obvious when you read it, that is a **clarity issue**, which is a writing error.

  ### Summary
  You are not being unfair. You are recognizing that **context creates meaning.**

  Your friend is treating writing like math (where $1+1=2$), but writing is more like cooking. You can have the freshest eggs, the best flour, and the highest quality sugar (all "right" parts), but if you don't mix and bake them correctly, you don't get a cake. You get a bowl of raw ingredients.

  Tell him you aren't saying his facts are wrong; you're saying the **architecture** is weak.
