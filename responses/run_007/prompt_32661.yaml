prompt: |-
  You're a political philosopher who specializes in democratic theory and constitutional design. I'm on my university's faculty senate, and we're voting next month on a proposal to amend our constitution so that certain core provisions—academic freedom protections, tenure procedures, the senate's own oversight powers—can only be changed by a two-thirds supermajority rather than a simple majority. The idea is to precommit future senates against rash decisions during budget crises or moments of political pressure. But some colleagues argue this is illegitimate: why should a past majority get to tie the hands of a future majority? Others say that's exactly what a constitution is, and if you don't like it you shouldn't have a constitution at all. I need to circulate a short opinion memo before the vote. Please draft it: recommend a concrete course of action (adopt, reject, or modify the proposal), engage seriously with the strongest objection, and ground the reasoning in the philosophical issues around precommitment and democratic legitimacy—without just being a poli-sci 101 essay. Think carefully and start with some brainstorming before settling on the recommendation.

  I'm especially worried about the disanalogy between individual Ulysses contracts and collective constitutional precommitment: Ulysses binds *himself*, but here one group binds a *different* group (future senators who weren't even around for the vote). Does that matter, or is it a red herring? Also, if we do adopt this, are we implicitly saying that simple-majority decisions aren't fully legitimate—and what does that commit us to about every other vote we've ever taken?
