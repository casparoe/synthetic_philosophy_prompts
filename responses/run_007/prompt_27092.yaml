      *   *Self-Correction on "Mach":* GR violates strict Mach's principle. So the desideratum shouldn't be "Satisfy Mach," it should be "Account for the origin of inertial structure," acknowledging Mach might be wrong.

  8.  **Final Structure:**
      *   Preamble: The purpose of the spec.
      *   Section 1: The Desiderata (numbered, with Force, Case, and Status).
      *   Section 2: The Trade-offs (Incompatibilities).
      *   Section 3: The Exclusionary Constraint & The Hidden Assumption.

  9.  (Final Polish of the text to ensure it sounds like a rigorous philosophical specification document.) *Make sure to explicitly flag Negotiable vs Non-negotiable as requested.*

