answer: |-
  Here is the specification. It treats spacetime ontology not as a choice between pre-packaged "-isms," but as an engineering problem with hard constraints derived from physics and metaphysics.

  ### The Spec: Desiderata for Spacetime Ontology

  **1. The Inertial Phenomenology Constraint**
  *   **Requirement:** The account must distinguish inertial from non-inertial motion without reference to external material bodies.
  *   **Forcing Consideration:** **Absolute Rotation.** Newton's Bucket and the Two Globes demonstrate that centrifugal forces arise in the absence of relative motion between nearby bodies. If spacetime is *only* relations between material objects, an empty rotating universe (or a universe with only two globes) should be indistinguishable from a non-rotating one. It is not.
  *   **Status:** **Non-negotiable.** Any theory that collapses this distinction contradicts the empirical behavior of gyroscopes and fluid surfaces.
  *   **Case:** Newton's Bucket, The Two Globes.

  **2. The Leibniz Equivalence Constraint**
  *   **Requirement:** The theory must not treat mathematically distinct models that differ only by a uniform translation (Shift) or gauge transformation as physically distinct worlds.
  *   **Forcing Consideration:** **The Principle of Sufficient Reason (PSR) / Ockham's Razor.** If two models differ only by a global shift of all matter and spacetime points, there is no observable difference and no internal structural difference. To claim they are distinct worlds is to posit surplus structure that violates the identity of indiscernibles.
  *   **Status:** **Non-negotiable (with nuance).** While "surplus structure" is often tolerated in mathematics, an ontology that insists shifted worlds are *metaphysically* distinct renders the shift undetectable in principle, turning spacetime into a Kantian noumenon.
  *   **Case:** Leibniz's Shift Argument.

  **3. The Hole Argument Constraint (Determinism)**
  *   **Requirement:** The ontology must not entail radical local indeterminism solely due to the freedom to redistribute spacetime points within a vacuum region (the "hole").
  *   **Forcing Consideration:** **Determinism vs. Gauge Redundancy.** If spacetime points are independent individuals (substantivalism), diffeomorphic models represent distinct physical situations. Since GR allows multiple such models fitting the same initial data, the theory becomes indeterministic. This indeterminism is not physical (like quantum decay) but metaphysical (haecceitistic). Physical theories should not be underdetermined by gauge.
  *   **Status:** **Non-negotiable.** We require that indeterminism arise from dynamics, not from the ontology of the stage itself.
  *   **Case:** Einstein's Hole Argument.

  **4. The Vacuum Existence Constraint**
  *   **Requirement:** The account must allow for the existence of spatiotemporal structure in the absence of material fields.
  *   **Forcing Consideration:** **General Relativity Solutions.** GR permits vacuum solutions (e.g., Minkowski space, gravitational waves in vacuum). A strict relationism that defines spacetime *as* relations between material bodies cannot account for the geometry of an empty universe without ad hoc modifications (e.g., positing counterfactual matter).
  *   **Status:** **Negotiable (but costly).** One can deny this (strict Machian relationism), but it requires modifying or restricting the interpretation of GR. However, given that gravitational waves carry energy without matter, denying this is increasingly empirically untenable.
  *   **Case:** Gravitational Waves, Minkowski Space.

  **5. The Origin of Inertia Constraint (Mach's Principle)**
  *   **Requirement:** The account must explain *why* inertial structure exists and why it aligns with the distribution of mass-energy (to the extent that it does).
  *   **Forcing Consideration:** **Causal Closure.** Substantivalism posits inertial structure as a brute fact of the spacetime substance. Relationism/Machianism posits it as an effect of distant matter. An adequate ontology should not treat the guide of motion (inertia) as an unexplained primitive if a causal story is available.
  *   **Status:** **Negotiable.** GR is not fully Machian (inertial structure exists in vacuum). One can accept inertia as a brute geometric fact. However, an ontology that offers *no* explanation for why geodesics are the paths of free fall is explanatorily deficient.
  *   **Case:** Mach's Rotating Shell.

  **6. The Observability/Reality Distinction**
  *   **Requirement:** The account must distinguish between what is empirically measurable and what is ontologically real, without collapsing reality into observability.
  *   **Forcing Consideration:** **Empirical vs. Theoretical Equivalence.** Just because point locations are not observable (due to general covariance) does not automatically mean they are not real. However, if they are real, their unobservability must be explained (e.g., as gauge), not ignored. Collapsing reality into observability leads to instrumentalism, which violates the prompt's requirement for an ontological story.
  *   **Status:** **Non-negotiable.** Scientific realism requires this distinction.
  *   **Case:** Gauge freedom in Electromagnetism and GR.

  ---

  ### Incompatibilities and Trade-offs

  You asked which combinations are ruled out. The constraints above form a "trilemma" for standard views.

  1.  **Naive Substantivalism is Ruled Out.**
      *   *Conflict:* Violates **Desideratum 3 (Hole Argument)**. If points are individuals + GR is true $\rightarrow$ Indeterminism.
      *   *Resolution:* Must adopt "Sophisticated Substantivalism" (denying haecceitism), which effectively concedes **Desideratum 2 (Leibniz Equivalence)**.

  2.  **Strict Material Relationism is Ruled Out.**
      *   *Conflict:* Violates **Desideratum 4 (Vacuum Existence)**. If spacetime is *only* matter relations, vacuum solutions are impossible or meaningless.
      *   *Resolution:* Must adopt "Modal Relationism" (relations between *possible* matter), which inflates ontology to match substantivalism, or accept empirical inadequacy regarding gravitational waves.

  3.  **Mach's Principle + GR is Ruled Out.**
      *   *Conflict:* Violates **Desideratum 5 (Origin of Inertia)**. GR allows inertia without matter.
      *   *Resolution:* Accept that inertia is not fully relational. This favors substantivalism or structural realism over strict Machianism.

  ---

  ### The Exclusionary Constraint

  **The single requirement doing the most work is Desideratum 3 (The Hole Argument Constraint).**

  It is the only constraint that forces a modification of the *definition* of substantivalism. Before the Hole Argument, one could be a substantivalist and believe shifted worlds were distinct. After Earman and Norton (1987), you cannot be a substantivalist *and* believe that diffeomorphic models represent distinct physical states without accepting radical indeterminism.

  This forces the substantivalist to adopt **Leibniz Equivalence** (Desideratum 2). But once a substantivalist accepts Leibniz Equivalence, the ontological difference between them and a sophisticated relationist (who accepts vacuum structure) becomes vanishingly small. The Hole Argument squeezes the substantivalist until they look like a relationist, and squeezes the relationist until they look like a substantivalist (regarding vacuum).

  ### The Taken-for-Granted Assumption Up for Grabs

  **The assumption that "Spacetime" must be a single category of being (Substance vs. Relation).**

  Both camps assume the question is: *Is spacetime a thing (noun) or a web of relations (predicate)?*

  The live alternative that bypasses the trilemma is **Spacetime Structural Realism**.
  *   **Why it's up for grabs:** It denies that "points" are the fundamental relata (killing the Hole Argument's force) while maintaining that the metric structure is real (satisfying the Vacuum and Inertia constraints).
  *   **The Cost:** It requires accepting that structure can exist without a "substrate" bearing it. This violates the classical metaphysical intuition that properties must inhere in substances. If you drop the requirement that "properties need a substance," the Substantivalism/Relationism debate dissolves.

  ### Negotiability Summary

  | Desideratum | Status | Argument |
  | :--- | :--- | :--- |
  | **Recover Observable Symmetries** | **Non-negotiable** | Empirical adequacy is the baseline for physical ontology. |
  | **No Unobservable Points** | **Negotiable** | This is Relationist prejudice. Electrons were once "unobservable." Reality exceeds measurement. |
  | **Determinism (Gauge)** | **Non-negotiable** | Indeterminism from gauge redundancy is a defect of representation, not nature. |
  | **Inertia from Matter (Mach)** | **Negotiable** | GR suggests this is false. Ontology should follow physics, not Mach's intuition. |
  | **Substance/Property Distinction** | **Negotiable** | This is the metaphysical bottleneck. Dropping it allows Structural Realism. |

  **Final Verdict:** An adequate account must be **structurally realist** (to satisfy Vacuum and Inertia), **sophisticated** (to satisfy Hole Argument/Leibniz Shift), and **non-haecceitistic** (to satisfy Determinism). Anything less is either empirically wrong or metaphysically bloated.
