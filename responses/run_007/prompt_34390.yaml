prompt: |-
  Here's a view I've ended up defending and I want you to tell me what would count against it, not just argue with it. It's a broadly Rousseauian line about theater and its modern descendants: the form itself is corrupting because it lets us feel pity, courage, and indignation while sitting safely in a chair, so the moral emotions get discharged on fictions and the audience walks away feeling virtuous without having done anything — and what the stage teaches, when it teaches at all, mostly flatters the audience's existing vices rather than correcting them. What would count against this? Give me the defeaters sorted from fatal to merely awkward: evidence that fiction actually prompts real-world action instead of displacing it, the fact that people distinguish simulated emotion from real emotion, historical cases where spectacle seems to have mobilized people, and whatever else belongs. Then tell me which of these a committed defender of the view would themselves concede as counting against them, and whether the position as I've stated it is insulated enough to be unfalsifiable, and if so whether that's a problem for a view like this. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
