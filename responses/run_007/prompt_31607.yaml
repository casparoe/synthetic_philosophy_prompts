answer: |-
  This is a sharp observation, and your physicist's intuition is serving you well here. You have identified a fault line that runs through modern decision theory, economics, and statistical mechanics. The disconnect you are describing is the central pillar of a research program that has gained significant traction in the last decade.

  Here are the answers to your four questions, situating the phenomenon within the literature.

  ### 1. The Name of the Cluster
  The broad framework you are looking for is **Ergodicity Economics**.

  The specific phenomenon—the divergence between the ensemble average (expected value) and the time average in multiplicative processes—is the **Ergodicity Problem** (or **Non-Ergodicity**).

  The key figure here is the physicist **Ole Peters** (London Mathematical Laboratory). Along with collaborators like Murray Gell-Mann (in his later years) and Oliver Thorley, Peters has argued that much of neoclassical economics fails because it assumes processes are ergodic when they are not. In an ergodic system, the average over time for one particle equals the average over the ensemble at one moment. In multiplicative wealth dynamics, the system is non-ergodic: the ensemble average grows exponentially, while the time average for a single trajectory shrinks (due to the geometric mean being lower than the arithmetic mean).

  The betting strategy you alluded to is the **Kelly Criterion** (or geometric growth optimal strategy), but Ergodicity Economics generalizes this from a betting heuristic to a foundational principle of rationality.

  ### 2. Dynamics vs. Preferences (The Log-Utility Distinction)
  You are correct that the math looks identical to expected utility theory (EUT) with a logarithmic utility function, but the *ontology* is radically different.

  *   **Standard EUT (Bernoulli/Savage):** The logarithm is **psychological**. Daniel Bernoulli introduced log-utility to solve the St. Petersburg Paradox by positing that humans have diminishing marginal utility of wealth. It is a statement about *preferences*: "I value the 100th dollar less than the 1st." If you encounter an agent who claims to value money linearly, EUT says they are rational to bet the farm.
  *   **Ergodicity Economics (Peters):** The logarithm is **physical/dynamical**. It is not that the agent *prefers* log-wealth; it is that the *process* of compounding transforms linear wealth into logarithmic growth rates. The quantity that is additive over time (and thus has a stable average) is not wealth $W$, but $\ln(W)$.
      *   In this view, an agent maximizing linear expected wealth in a multiplicative environment isn't "risk-seeking"; they are making a category error about the physics of the system. They will go extinct.
      *   Therefore, risk aversion is not a preference parameter; it is an **objective constraint** imposed by the dynamics of survival in a non-ergodic world.

  ### 3. The Name of the Mistake
  The specific error of optimizing the arithmetic mean when the geometric mean is required is often called **The Ergodicity Error**.

  In finance and trading contexts, the mechanism that causes the decay is frequently called **Volatility Drag** or **Variance Drain**. This refers to the fact that if an asset returns $+50\%$ and then $-50\%$, the arithmetic average return is $0\%$, but the actual wealth is $0.75$ of the start. The "drag" is the difference between the arithmetic mean return and the geometric mean return (approximately $\mu - \sigma^2/2$ in continuous time).

  However, in the philosophical context you are reading, **The Ergodicity Error** is the precise term for assuming that the expectation value $\mathbb{E}[W]$ is the relevant quantity for decision making, rather than the time-average growth rate $\lim_{T\to\infty} \frac{1}{T} \ln(W_T)$.

  ### 4. The Case Against the "Strong Claim"
  The strong claim you mention is that Ergodicity Economics renders Expected Utility Theory (EUT) redundant or reveals it as fundamentally flawed. While the ergodicity critique is devastating for *specific* applications of EUT (like repeated investment), there are robust counter-arguments against the idea that it replaces EUT entirely.

  **A. Finite Horizons and Consumption**
  Ergodicity arguments rely on the limit $T \to \infty$. They maximize the *asymptotic* growth rate. However, agents have finite lifetimes and, crucially, need to *consume* wealth, not just compound it.
  *   If you need to withdraw 5% of your portfolio every year to eat, maximizing geometric growth might not be the optimal strategy for maximizing *utility of consumption*.
  *   EUT is better suited for intertemporal choice involving consumption streams, where the goal isn't to make the pot as big as possible at the end of time, but to smooth well-being over a life.

  **B. Single-Shot Decisions**
  The ergodicity argument holds water when the bet is repeated many times. In a **single-shot decision**, the ensemble average *is* the relevant metric if you can offload the risk.
  *   *Example:* If I can make a one-off bet with positive EV, and I have the option to sell the ticket to a diversified insurer before the outcome is known, I should maximize EV. The insurer can pool many such uncorrelated bets, making the ensemble average realizable for them.
  *   EUT handles single-shot decisions naturally; Ergodicity Economics struggles to justify risk aversion in non-repeated, non-compounding scenarios without smuggling in preferences.

  **C. Heterogeneous Goals (Survival vs. Growth)**
  Maximizing long-run growth (Kelly betting) is a specific goal. It is not the *only* rational goal.
  *   An agent might want to maximize the probability of reaching a specific threshold by a specific time (e.g., "I need \$100k for surgery in 6 months"). The Kelly strategy might minimize the probability of ruin, but it might also maximize the time to reach the goal compared to a more aggressive strategy.
  *   EUT allows for arbitrary utility functions to model these specific goals. The Ergodicity argument essentially hard-codes one specific utility function (log wealth) as "The Rational One." Critics argue this is just as dogmatic as the neoclassical assumption of risk-neutrality, merely swapping one norm for another.

  **D. The "Mises/Keynes" Objection**
  There is a philosophical objection regarding the nature of probability. The ergodicity argument assumes the probabilities are known and stationary (a fair coin, fixed drift). In radical uncertainty (Knightian uncertainty), where the distribution itself might change or be unknown, the time-average argument becomes fragile. EUT, particularly in its subjective Bayesian form (Savage), is designed to handle decision-making under uncertainty where frequencies are not well-defined.

  ### Summary for your Reading
  If you want to follow this thread, look for:
  1.  **Ole Peters,** "The Ergodicity Problem in Economics" (various papers and talks).
  2.  **William Poundstone,** *Fortune's Formula* (for the history of the Kelly Criterion and the Shannon/Thorp connection).
  3.  **Leonard MacLean, Edward Thorp, and William Ziemba,** *The Kelly Capital Growth Investment Criterion* (for the rigorous math).
  4.  **Cosma Shalizi,** who has written critical blog posts on the "Ergodicity Economics" hype, offering the counter-perspective from statistical mechanics.

  Your intuition is correct: the divergence between ensemble and time averages is a physical fact that standard economics often ignores. However, whether that physical fact *replaces* the theory of rational choice, or simply *constrains* it in specific dynamic contexts, remains an open and heated debate.
