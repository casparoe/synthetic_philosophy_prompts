answer: |-
  You have identified one of the most persistent and structurally significant tensions in contemporary metaphysics. While there is no single, canonical Latin label for this specific rhetorical maneuver (like *ad hominem* or *petitio principii*), it is a widely recognized phenomenon in the literature on de re modality.

  In the technical literature, this pattern is usually discussed under the heading of **the tension between Transworld Identity and Counterpart Theory**, or more historically, as an application of the **Strict vs. Loose Identity** distinction to modal contexts. When critics attack the maneuver, they often label it **Modal Equivocation** or **Inconsistent Modal Semantics**. When proponents defend it, they often frame it as **Modal Contextualism** or **Conventionalism**.

  Here is a breakdown of the pattern, the underlying philosophical choice, how to diagnose it, and the conditions under which it might be considered legitimate.

  ### 1. The Underlying Choice: Transworld Identity vs. Counterparts

  The pattern you observe arises because authors are trying to navigate between two incompatible semantic frameworks for modal claims:

  *   **Transworld Identity (TWI):** Associated with Kripke and Plantinga. This view holds that when we say "Nixon could have lost," we are talking about *Nixon himself* in another world.
      *   *Advantage:* Preserves the intuitive force of de re modality (it is *him*).
      *   *Vulnerability:* Faces the **Chisholm Paradox**. If Nixon could have had slightly different origins, and that person could have had slightly different origins, by transitivity, Nixon could have had *completely* different origins. To stop the slide, one must accept **Origin Essentialism** (Nixon *must* have his actual parents), which contradicts the "loose" intuition the author started with.
  *   **Counterpart Theory (CT):** Associated with David Lewis. This view holds that Nixon exists only in the actual world. In other worlds, there are *counterparts* of Nixon (similar individuals).
      *   *Advantage:* Solves the Chisholm Paradox (similarity is not transitive in the same way identity is) and avoids "incompatible properties" objections.
      *   *Vulnerability:* Loses the intuitive force. It isn't *Nixon* who loses; it's a "stand-in." This makes the conclusion "Nixon could have lost" seem metaphorically true but literally false.

  **The Pattern You Noticed:** Authors often want the *ontological security* of TWI (to make the claim about the real object) but the *flexibility* of CT (to allow the object to have different properties without running into paradox).

  ### 2. Is There a Name?

  There is no single standardized noun for the fallacy itself, but here are the terms used to describe it:

  *   **Modal Equivocation:** This is the critical term. It accuses the author of using "the same object" in the strict sense (numerical identity) when establishing reference, and in the loose sense (qualitative similarity) when establishing possibility.
  *   **The "Strict and Loose" Slide:** Drawing on Bishop Butler and Thomas Reid (and revived by David Lewis), this refers to shifting between "strict philosophical identity" and "loose popular identity."
  *   **The Transworld Identity Retreat:** An informal descriptor for when an author retreats to counterpart-like relations under pressure but returns to identity language for the conclusion.
  *   **Haecceitistic Slippage:** A more technical term referring to sliding between relying on *haecceities* (primitive "thisness" that secures identity) and qualitative properties (which secure similarity).

  ### 3. How to Distinguish Consistency from Sliding

  To determine if an author is sliding illegitimately or working within a consistent (perhaps nuanced) view, ask the following diagnostic questions:

  #### A. Check the Truth Conditions
  Does the author explicitly state what makes a modal claim true?
  *   **Consistent TWI:** "For $x$ to be possibly $F$, there must be a world containing $x$ (the very same entity) that is $F$." (They must then explain how $x$ survives the change, often via haecceities).
  *   **Consistent CT:** "For $x$ to be possibly $F$, there must be a world containing a *counterpart* of $x$ that is $F$." (They admit $x$ is not literally in that world).
  *   **The Slide:** The author asserts the TWI truth condition in the introduction but uses CT-style reasoning (similarity of properties) to defend the possibility against objections, without acknowledging the shift in truth conditions.

  #### B. Check the Response to the Chisholm Paradox
  Present the Sorites-style objection: "If the statue could be made of 99% of this clay, could it be made of 98%? ... 1%?"
  *   **Consistent Essentialist:** "No. There is a cutoff. At some point, it is no longer the statue." (Accepts strict limits).
  *   **Consistent Counterpart Theorist:** "It depends on which counterpart relation we are invoking. There is no fact of the matter about the *statue itself*."
  *   **The Slide:** "Well, it's still the statue in a loose sense, but strictly speaking, we are talking about the original object which could have been different." This attempts to deny the cutoff while maintaining strict identity.

  #### C. Check the Ontological Commitment
  *   **Consistent:** The author commits to **Haecceities** (primitive thisness) to ground identity across worlds without relying on properties. (e.g., Plantinga).
  *   **The Slide:** The author rejects haecceities as "mysterious" but insists on strict identity. Without haecceities, identity across worlds usually collapses into qualitative similarity (Counterpart Theory). If they deny the ground (haecceities) but keep the house (strict identity), they are sliding.

  ### 4. Is the Slide Ever Legitimate?

  It is not always a fallacy. There are philosophical positions that formalize this "slide" as a feature, not a bug.

  **1. Modal Contextualism (Charitable Reconstruction)**
  Some philosophers (like David Lewis, ironically, and later contextualists) argue that the meaning of "could have been" shifts depending on the conversational context.
  *   *Context A (Metaphysical):* We demand strict identity. (Result: Essentialism).
  *   *Context B (Practical/Everyday):* We accept loose similarity. (Result: Contingency).
  *   **Legitimacy:** If the author explicitly argues that modal discourse is context-sensitive, they are not equivocating; they are proposing a semantic theory. The illegitimacy arises only if they claim there is a single, context-invariant fact of the matter while treating it as variable.

  **2. Modal Conventionalism**
  Philosophers like Amie Thomasson or Eli Hirsch argue that modal truths are determined by our linguistic conventions and concepts, not by mind-independent metaphysical structures.
  *   **Legitimacy:** If modal claims are about how we *conceptualize* objects, then shifting between strict and loose criteria is permissible because the criteria are ours to set. The "slide" is just adjusting the conceptual scheme to fit the purpose.

  **3. The "Loose and Popular" Defense**
  Following Butler and Reid, an author might argue that "identity" is ambiguous.
  *   **Legitimacy:** If they explicitly state: "Strictly speaking, the object cannot have different parents; but in the loose and popular sense, we say it could," they are being consistent. The error occurs when they conclude "Therefore, strictly speaking, the object could have had different parents."

  ### 5. Boundary Cases and Further Reading

  To sharpen your eye for this pattern, look at how these specific authors handle it:

  *   **Nathan Salmon (*Reference and Essence*):** Salmon is crucial here. He argues against the slide. He defends a view where you can have different origins but maintains strict identity, leading him to controversial conclusions (like contingent identity). He explicitly tries to block the "retreat" to counterparts.
  *   **David Lewis (*Counterpart Theory and Quantified Modal Logic*):** Lewis is the primary critic of this pattern. He argues that if you want to avoid paradox, you *must* accept Counterpart Theory and give up strict transworld identity. He accuses Kripkeans of wanting "the best of both worlds."
  *   **Kit Fine (*Essence and Modality*):** Fine argues that modal claims (what could be) are not the ground of essential claims (what it is to be). He might argue the slide occurs because authors are confusing modality with essence.
  *   **Graff Forbes (*Identity in the Strict and Loose Sense*):** This paper directly addresses the distinction you noticed.

  ### Summary Recommendation

  If you need to label this in a paper or discussion, the most precise description is:

  > **"An equivocation between Transworld Identity and Counterpart relations, exploiting the Strict/Loose Identity distinction."**

  If you want to be charitable, call it **"Modal Contextualism."**
  If you want to be critical, call it **"Modal Equivocation."**

  **The Test:** The author is sliding if they rely on the *necessity of identity* (Leibniz's Law) to block objections when it suits them, but ignore the *indiscernibility of identicals* when arguing for the possibility of property changes. If they do not explicitly resolve how an object can be numerically identical while lacking its actual individuating properties, they are likely engaging in the pattern you identified.
