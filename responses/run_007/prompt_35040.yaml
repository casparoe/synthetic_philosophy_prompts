prompt: |-
  I've been working through Maimonides' Guide for the Perplexed, and I'm stuck on a passage in Part III, Chapter 32 where he argues that the Torah's sacrificial system was a divine concession to the Israelites' psychological limitations. Here's the relevant section (Friedländer translation):

  "It is, namely, impossible to go suddenly from one extreme to the other; it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed. […] But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them […] It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action. For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings, and of things imaginary and unreal, and commanded us to serve Him in the same manner […] By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established; this result was thus obtained without deterring or confusing the minds of the people by the abolition of the service to which they were accustomed and which alone was familiar to them."

  And then, anticipating pushback:

  "I know that you will at first thought reject this idea and find it strange; you will put the following question to me in your heart: How can we suppose that Divine commandments, prohibitions, and important acts, which are fully explained, and for which certain seasons are fixed, should not have been commanded for their own sake, but only for the sake of some other thing."

  Here's what I'm wrestling with. Maimonides seems to be advancing a divine-accommodation thesis — but I can't tell how far he means to push it. Is this a local claim about sacrifice specifically, or does it license a general hermeneutic of suspicion toward any commandment that looks like it might be a concession to the Israelites' cultural starting point? If the latter, what's the limiting principle that keeps this from swallowing the whole Law? And if God can issue commands whose surface justification is not their real justification, what does that imply about the epistemic position of someone trying to derive moral or theological lessons from the plain text of those commands? I'm less interested in the historical reception (I know Nahmanides pushed back hard on this) than in whether the argument, taken on its own terms, has a stable stopping point.

  Please say how confident you are in what you claim and single out the point you're least sure of. Please write in American English.
