prompt: |-
  I am a PhD student in philosophy of mind working on pain and affect, and I keep seeing theories of the badness of pain built to handle ordinary acute pain while pain asymbolia is treated as an afterthought. Before I read further, I want the full specification of what an adequate theory of the badness of pain has to deliver, with pain asymbolia as the load-bearing case.

  By pain asymbolia I mean the rare neuropsychological condition in which a person can identify a noxious stimulus as painful, locate it, and rate its intensity, but reports that it is not unpleasant: they do not mind it, may not withdraw, and do not seek relief. This looks like a dissociation between the sensory-discriminative dimension of pain and its affective-motivational dimension, and it is the case I want the desiderata to be built around.

  Please write the requirements list. For each requirement, give the case or consideration that forces it — for example, whatever forces the distinction between pain intensity and pain unpleasantness, whatever forces a stance on whether asymbolic pain is really pain, and whatever empirical dissociations a theory cannot contradict. Include the standard contrast cases where they sharpen a requirement: ordinary acute pain, reports in which an analgesic leaves the sensory quality largely intact while the unpleasantness recedes, pain without tissue damage, and so on. Keep the weight on the criteria rather than on scoring the theories.

  Then do three further things. First, mark each requirement as non-negotiable for any adequate theory or as a preference of a particular camp (evaluativist, representationalist, imperativist, attitudinal, or otherwise). Second, say whether any subset of the requirements is jointly unsatisfiable or in serious tension — in particular, if asymbolic pain is genuinely pain, can a theory both make badness intrinsic to pain and honor the dissociation, and if not, which requirement has to give? Third, identify the single requirement that does the most to eliminate the standard candidates, and explain why it is that one.

  Format the response in these sections, in this order:

  1. The target and the central case — 2–3 sentences stating what a theory of pain's badness is meant to explain and what asymbolia establishes.
  2. Non-negotiable requirements — the bulk of the response; one requirement per paragraph or a table, each with its motivating case or consideration.
  3. Negotiable or camp-specific requirements — the demands that reflect theoretical taste rather than adequacy, with a sentence on whose taste each reflects.
  4. Tensions and jointly unsatisfiable subsets — 1–2 paragraphs on where the list may not be co-satisfiable and which requirement you would give up first.
  5. The requirement that does the most work — 1 paragraph on the single criterion that excludes the most standard theories.
  6. Where I am least confident — 1 paragraph identifying which requirement you are least sure is a genuine desideratum, and what argument or empirical finding would lead you to drop or demote it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of mind (pain and affect).
      *   **Topic:** Theories of the badness of pain, specifically centering pain asymbolia as the "load-bearing case" rather than an afterthought.
      *   **Task:** Provide a full specification of requirements (desiderata) for an adequate theory of pain's badness.
      *   **Structure:**
          1.  Target and Central Case (2-3 sentences).
          2.  Non-negotiable requirements (with motivating cases).
          3.  Negotiable/Camp-specific requirements (with attribution).
          4.  Tensions and jointly unsatisfiable subsets (analysis of compatibility).
          5.  The requirement that does the most work (elimination of candidates).
          6.  Where I am least confident (uncertainty about a desideratum).
      *   **Tone:** Academic, precise, philosophically rigorous, tailored to a specialist.
      *   **Key Constraint:** Pain asymbolia must be the central lens for formulating the requirements.

  2.  **Deconstruct the Central Case (Pain Asymbolia):**
      *   *What is it?* Dissociation between sensory-discriminative (location, intensity, quality) and affective-motivational (unpleasantness, suffering, urge to withdraw).
      *   *Implication:* A theory of *badness* must explain why ordinary pain is bad while asymbolic pain (if it is pain) is not, without collapsing the two dimensions entirely or denying the phenomenology of one side.
      *   *Key Contrast Cases:* Ordinary acute pain (bad), analgesic effects (morphine/cingulotomy reduces unpleasantness but keeps sensation), pain without damage (phantom, neuropathic), painless nociception (debated).

  3.  **Drafting the Requirements (Section 2 & 3):**
      *   *Requirement 1: The Dissociation Constraint.* Must account for the separability of sensory and affective dimensions. (Motivation: Asymbolia, cingulotomy).
      *   *Requirement 2: The Phenomenal Constraint.* Must explain why ordinary pain *feels* bad, not just causes bad behavior. (Motivation: First-person authority, phenomenology of suffering).
      *   *Requirement 3: The Normative Constraint.* Must explain why pain provides reasons for action/avoidance in ordinary cases but not asymbolic ones. (Motivation: Rationality of avoidance).
      *   *Requirement 4: The Identity/Classification Constraint.* Must take a stance on whether asymbolic experience is *pain*. (Motivation: Semantic stability vs. functional definition).
      *   *Requirement 5: The Causal/Functional Constraint.* Must align with the biological function of pain (warning system). (Motivation: Evolutionary biology, nociception).
      *   *Requirement 6: The Valence Constraint.* Must explain the negative valence specifically. (Motivation: Why not neutral or positive?).

      *Refining for "Non-negotiable" vs. "Negotiable":*
      *   Non-negotiable: Must handle the data (dissociation), must account for phenomenology (badness feels like something), must handle the normative force (reasons to avoid).
      *   Negotiable: Whether badness is intrinsic or extrinsic, whether it's representational or imperative, whether asymbolia counts as "pain" strictly speaking (though most want to say yes to make the problem hard).

  4.  **Analyzing Tensions (Section 4):**
      *   *The Big Tension:* If pain is *essentially* bad (intrinsic badness), how can asymbolic pain exist as pain?
      *   *Option A:* Deny asymbolic pain is pain (Semantic move). Saves intrinsic badness, loses the dissociation data as a variation of pain.
      *   *Option B:* Accept asymbolic pain is pain (Empirical move). Loses intrinsic badness; badness must be contingent or separable.
      *   *Option C:* Redefine badness (e.g., imperativism). Badness is a command, asymbolia is a broken receiver.
      *   *Joint Unsatisfiability:* "Pain is essentially unpleasant" + "Asymbolic experience is pain" + "Asymbolic experience is not unpleasant." One must go. Usually, the "essentially" claim is the casualty.

  5.  **Identifying the "Killer" Requirement (Section 5):**
      *   Which requirement kills the most theories?
      *   *Candidate:* The requirement that the theory must explain the *dissociation* without denying the *phenomenal reality* of the badness in ordinary cases.
      *   *Better Candidate:* The requirement to account for the *normative force* (reasons for action) while accepting the asymbolic dissociation. Simple representationalism often struggles here (representing damage doesn't entail badness). Imperativism handles the command but struggles with the "feeling." Evaluativism struggles with the dissociation if value is intrinsic to the representation.
      *   *Selection:* The requirement that **Badness must be phenomenally manifest yet contingently linked to sensory content.** This kills strong identity theories and pure functionalism. Let's refine: It's the requirement that **The theory must explain the motivational gap in asymbolia without reducing badness to mere disposition to withdraw.** (Targets behaviorism/functionalism).
      *   *Actually, the prompt asks for the one that eliminates standard candidates.* The "Intrinsic Badness vs. Asymbolic Pain" tension is the classic killer. Let's frame the requirement as: **The theory must accommodate the possibility of pain without unpleasantness.** This kills "Pain is essentially unpleasant" views (like some simple phenomenal intentionalism).

  6.  **Addressing Uncertainty (Section 6):**
      *   Where is the philosophical ground shaky?
      *   The status of asymbolia itself. Is it truly pain? Or is it "nociceptive awareness"?
      *   If asymbolia is reclassified as "painless nociception," the whole load-bearing case collapses.
      *   I should express uncertainty about the **Classification Constraint** (whether asymbolia counts as pain).

  7.  **Review and Refine (Self-Correction):**
      *   *Check Tone:* Needs to be PhD level. Avoid oversimplification. Use terms like "sensory-discriminative," "affective-motivational," "phenomenal character," "normative force."
      *   *Check Formatting:* Strictly follow the 6 sections.
      *   *Check Content:* Ensure asymbolia is the lens for *every* requirement where possible.
      *   *Correction on Section 2:* Ensure I explicitly mark Non-negotiable vs Negotiable in the text or via the section headers as requested. The prompt asks for Section 2 to be "Non-negotiable" and Section 3 to be "Negotiable". I need to make sure I don't mix them up.
      *   *Correction on Section 5:* Make sure I explain *why* it eliminates candidates (e.g., eliminates strong identity theory, simple representationalism).

  8.  **Final Polish:**
      *   Ensure the distinction between "pain" (the experience) and "nociception" (the neural processing) is clear in the motivating cases.
      *   Ensure the "badness" is distinguished from "suffering" where necessary, though they often overlap in this context.
      *   Make sure the "Tensions" section explicitly addresses the "Intrinsic Badness" problem.

      *(Self-Correction during drafting Section 2)*: I need to make sure I don't just list generic philosophy of pain requirements, but requirements *for a theory of badness* specifically, filtered through asymbolia.
      *   Req 1: Dissociation of Sensory/Affective.
      *   Req 2: Phenomenal presence of badness (in ordinary cases).
      *   Req 3: Explanation of Motivational Deficit (in asymbolia).
      *   Req 4: Compatibility with Analgesic Data (morphine/cingulotomy).

      *(Self-Correction during drafting Section 4)*: The tension is between "Pain is essentially bad" and "Asymbolia is pain." I need to be precise about which requirement creates the contradiction.

      *(Self-Correction during drafting Section 5)*: The "Dissociation Constraint" is the most powerful filter. It kills monolithic theories.

      *(Self-Correction during drafting Section 6)*: The uncertainty should be about the empirical/phenomenological interpretation of asymbolia itself.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  1. The target and the central case
  A theory of the badness of pain must explain why ordinary pain experiences possess a negative normative and phenomenal force that commands avoidance, while accounting for the existence of pain asymbolia. Pain asymbolia establishes that the sensory-discriminative capacity to identify noxious stimuli can remain intact even when the affective-motivational force—the "badness"—is absent, requiring the theory to disentangle pain's intensity from its unpleasantness without denying the reality of either.

  2. Non-negotiable requirements
  **The Dissociation Constraint:** The theory must allow for the conceptual and empirical separability of the sensory-discriminative dimension (location, intensity, quality) from the affective-motivational dimension (unpleasantness, suffering). This is forced by pain asymbolia and cingulotomy cases, where patients report "it hurts but it doesn't bother me." A theory that identifies the badness of pain strictly with its sensory intensity (e.g., a simple magnitude theory) cannot accommodate the asymbolic report without accusing the subject of error.

  **The Phenomenal Manifestation Constraint:** In ordinary cases, the badness of pain must be phenomenally manifest; it cannot be merely a dispositional property or a hidden neural correlate. This is forced by first-person authority in ordinary acute pain: when we suffer, the badness feels like part of the experience itself, not just a consequence of it. A theory that relegates badness entirely to a post-experiential judgment or a purely functional role fails to capture why pain *feels* bad rather than just being treated as such.

  **The Motivational Gap Constraint:** The theory must explain why ordinary pain generates an immediate prima facie reason for avoidance, while asymbolic pain does not, without appealing solely to behavioral output. This is forced by the observation that asymbolics do not withdraw from noxious stimuli despite acknowledging the damage risk. A purely behaviorist account of badness (badness = withdrawal disposition) fails because it cannot distinguish between an asymbolic who *won't* withdraw and a paralyzed ordinary sufferer who *can't* withdraw; the badness must explain the motivational push, not just the movement.

  **The Analgesic Compatibility Constraint:** The theory must be consistent with pharmacological and surgical data where unpleasantness is reduced while sensory quality remains largely stable. This is forced by morphine administration and prefrontal lobotomy cases, where patients often report the pain is still present but "distant" or "unconcerning." A theory that ties badness inextricably to the specific qualitative character of the sensation (e.g., burning implies badness necessarily) contradicts the empirical record of chemical dissociation.

  **The Classification Neutrality Constraint:** The theory must provide clear truth conditions for whether asymbolic experience counts as "pain" without stipulating the answer by definition. This is forced by the need to avoid verbal disputes; if a theory defines pain as "essentially unpleasant," it trivially solves the problem by denying asymbolics have pain, but this ignores the phenomenological similarity. An adequate theory must explain *why* we might call it pain (sensory match) or not (affective mismatch) based on the underlying ontology of badness, not semantic fiat.

  3. Negotiable or camp-specific requirements
  **The Intrinsic Badness Requirement:** The demand that badness be an intrinsic, non-relational property of the pain experience itself reflects the taste of **Phenomenal Intentionalists** and **Qualia Realists**, who resist reducing badness to relations of desire or command. **Imperativists** and **Attitudinal Theorists** reject this, viewing badness as extrinsic (a command issued to the self or a con-attitude toward content).

  **The Representational Accuracy Requirement:** The demand that the badness of pain must represent actual tissue damage or normative badness in the world reflects the taste of **Strong Representationalists** and **Evaluativists**. **Non-Representationalists** and **Imperativists** often prefer to view pain's badness as imperative content ("Stop this!") or raw feel, arguing that pain can be bad even if it misrepresents damage (e.g., phantom limb pain).

  **The Unified Mechanism Requirement:** The demand that a single neural or functional mechanism underlies both ordinary and asymbolic pain (differing only in degree or connectivity) reflects the taste of **Reductive Physicalists**. **Dual-Aspect** or **Pluralist** theorists may prefer a requirement that allows badness to be realized by a distinct subsystem that can be lesioned independently without altering the "pain" proper.

  4. Tensions and jointly unsatisfiable subsets
  There is a serious tension between the **Phenomenal Manifestation Constraint** (badness feels intrinsic to ordinary pain) and the **Dissociation Constraint** (badness can be removed while pain remains), specifically when combined with a strong **Classification Neutrality** that insists asymbolic experience *is* pain. If badness is phenomenally intrinsic to the experience type "pain," then an experience lacking badness cannot be an experience of "pain." To satisfy the Dissociation Constraint while maintaining that asymbolics feel pain, one must concede that badness is not intrinsic to the sensory phenomenology of pain, which weakens the Phenomenal Manifestation Constraint for ordinary cases (making badness look more like an add-on attitude than a felt quality).

  If forced to resolve this trilemma, the requirement to give up is the claim that **badness is intrinsic to the sensory phenomenology**. One must adopt a composite view where "pain" refers to a complex state comprising sensory content + affective valuation. This preserves the Dissociation Constraint (the valuation can be lesioned) and Classification Neutrality (we can call the sensory remnant "pain" loosely, or "painless nociception" strictly), but it requires weakening the intuition that badness is a simple, indivisible quale. The jointly unsatisfiable subset is: (1) Pain is essentially unpleasant; (2) Asymbolic subjects experience pain; (3) Asymbolic subjects do not experience unpleasantness. Standard theories usually drop (1).

  5. The requirement that does the most work
  The **Dissociation Constraint** does the most work to eliminate standard candidates, specifically **Simple Identity Theories** and **Strong Sensory Representationalism**. Simple Identity Theories (pain = badness) are eliminated immediately because they cannot accommodate the asymbolic report without denying the subject's competence. Strong Sensory Representationalism (the view that representing tissue damage *just is* the badness) is severely strained because asymbolics represent the damage (they can locate and rate it) without the badness. This constraint forces theories toward **Composite Views** (Evaluativism, Imperativism, Attitudinalism) that posit a second-order component (evaluation, command, or attitude) layered onto sensory content, effectively ruling out any monolithic account of pain phenomenology.

  6. Where I am least confident
  I am least confident in the **Classification Neutrality Constraint**, specifically regarding whether asymbolic experience should be categorized as "pain" at all. If further empirical work reveals that the "sensory" reports of asymbolics are actually cognitively mediated judgments about nociception rather than genuine sensory phenomenology, the load-bearing case collapses into "painless nociception." If asymbolia is reclassified as a deficit in sensory consciousness rather than a dissociation of affect, the requirement to accommodate it as a form of pain becomes a liability rather than a desideratum. I would drop or demote this requirement if neurophenomenological evidence showed that the primary somatosensory cortex activity in asymbolics does not correlate with conscious sensory experience in the same way it does for ordinary subjects.
