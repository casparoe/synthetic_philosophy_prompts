  A friend and I spent most of yesterday afternoon arguing about Dennett's three stances—the physical stance, the design stance, and the intentional stance—and when each is the right one to adopt. By the end I had a list of the systems we discussed and which stance she said was appropriate for each:

  - A thermostat: design stance
  - An E. coli bacterium: physical stance
  - A spider building a web: design stance
  - Stockfish (a chess engine): design stance
  - A domestic cat: intentional stance
  - A New Caledonian crow: intentional stance
  - A chimpanzee: intentional stance
  - A large language model (GPT-4 class): design stance

  We never got to the octopus, which I now wish I had asked about, because it seems like it might separate the candidate principles she could be running. What are the principles that fit her verdicts equally well, what does each predict about the octopus, and which further case would best distinguish any principles that agree on the octopus? If her verdicts don't yet pick out a unique rule, give your best guess at which one she's actually running and say why you favor it.
