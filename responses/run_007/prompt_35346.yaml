answer: |-
  Your intuition is spot on. Your friend has captured the *flavor* of Dennett's early work (specifically *The Intentional Stance*, 1987) but misses the crucial refinement he made later (specifically in the paper "Real Patterns," 1991).

  She is interpreting Dennett as a **fictionalist** or an **eliminativist** (someone who thinks beliefs aren't *real*), whereas Dennett is actually a **pattern realist**.

  Here is the breakdown of what she got right, where she went off the rails, and why the "subjectivity" conclusion doesn't actually follow from Dennett's premises.

  ### 1. What She Got Right (The "Rough Shape")
  Your friend correctly identified the core mechanics of the Intentional Stance. Dennett would agree with the following:

  *   **No Literal Inscription:** Beliefs and desires are not little sentences written in neural tissue (he rejects the "Language of Thought" hypothesis in its literalist form). There is no specific "belief box" in the brain.
  *   **Predictive Utility:** The primary justification for using the Intentional Stance is predictive power. If treating a system as a rational agent allows you to predict its behavior better than the Physical or Design Stance, you should use it.
  *   **Observer-Dependent *Stance*:** It is true that the *choice* to take the stance is up to the observer. A system doesn't force you to treat it intentionally; you choose to because it works.

  ### 2. The Critical Misreadings (Where She Overstated It)
  This is where your friend's summary diverges from Dennett's actual ontology. She is treating the Intentional Stance as a "useful lie." Dennett treats it as a "useful truth about patterns."

  **A. "Convenient Trick" vs. "Real Patterns"**
  *   **Her Claim:** Taking the intentional stance means stopping talking about real patterns and using a trick.
  *   **Dennett's View:** Dennett argues vigorously that beliefs are **Real Patterns**. He uses the analogy of a **Center of Gravity**.
      *   Is a center of gravity a physical object? No.
      *   Is it "just a trick" we use to predict how an object will fall? No.
      *   Does it really exist? Yes. It is an objective feature of the physical world, even though it is an abstract one.
      *   **The Verdict:** For Dennett, beliefs are real like centers of gravity. They are abstract objects that have causal explanatory power. Calling them a "convenient trick" implies they are fictional. Dennett says they are real, just not *physical*.

  **B. "Subjective" vs. "Objective Patterns"**
  *   **Her Claim:** Whether a system has beliefs is subjective; it depends on the observer's utility.
  *   **Dennett's View:** While the *observer* chooses the stance, the *pattern* is objective.
      *   If a system is so complex that the *only* way to predict it reliably is to treat it as having beliefs, then it **objectively has beliefs**.
      *   It is not up to the observer's whim. If you refuse to take the intentional stance toward a human, your predictions will fail. The "fact of the matter" is grounded in the complexity of the system, not the mood of the observer.
      *   **The Verdict:** Dennett rejects radical subjectivity. There is a fact of the matter about whether a system exhibits an intentional pattern, even if that fact is gradient-based.

  **C. "Mutually Exclusive" Levels**
  *   **Her Claim:** The three stances are mutually exclusive; using one means abandoning the others.
  *   **Dennett's View:** They are distinct levels of abstraction, but they are **compatible**.
      *   You can acknowledge that a chess computer is physically made of silicon (Physical Stance), designed by engineers (Design Stance), and wants to win (Intentional Stance).
      *   They are mutually exclusive *in a single prediction* (you can't calculate the voltage to predict the move), but they are not ontologically exclusive. Adopting the intentional stance does not deny the physical reality; it just abstracts away from it.

  ### 3. Does the "Subjectivity Conclusion" Follow?
  **No.** This is the weakest link in her argument.

  She argues: *Because the stance is chosen by the observer, the existence of the belief is subjective.*

  Dennett argues: *Because the stance is chosen by the observer, but the success of the stance depends on the system's objective complexity, the existence of the belief is objective.*

  For Dennett, "mindedness" isn't a magic switch that flips on. It is a matter of degree. A thermostat has a tiny, rudimentary amount of "intentionality" (it "wants" to maintain temperature). A human has a massive amount. The fact that there are borderline cases (is a sophisticated chatbot minded?) does not mean there is *no* fact of the matter. It just means the concept is vague, like "baldness" or "heap." Vagueness does not equal subjectivity.

  ### 4. Why This Confusion Happens
  Your friend is likely conflating Dennett with **Eliminative Materialists** (like Paul and Patricia Churchland).
  *   **Eliminativists** say: "Beliefs don't exist; folk psychology is a false theory."
  *   **Dennett** says: "Beliefs exist, but not the way you think they do. They are real patterns, not brain states."

  If your friend thinks Dennett believes beliefs are *false*, she is attributing the Churchlands' view to him. Dennett spent decades arguing against the Churchlands on exactly this point.

  ### Summary for Your Peace of Mind
  You were right to feel she was overstating it.
  1.  **She is right** that beliefs aren't physical things in the brain.
  2.  **She is wrong** that this makes them "subjective" or "mere tricks."
  3.  **She is wrong** that the stances are mutually exclusive ontologies.

  Dennett's position is subtle: Beliefs are **objective abstracta**. They are as real as a melody (which isn't in the notes, but in the pattern of notes) or a center of gravity. To say they are "subjective" is to misunderstand Dennett's definition of "real."

  You can tell her: *"Dennett isn't saying beliefs are fictions we project. He's saying they are real patterns we detect. The stance is the microscope; the belief is the bacteria. Just because I have to choose to look through the microscope doesn't mean the bacteria are subjective."*
