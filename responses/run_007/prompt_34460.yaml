prompt: |-
  I run a small community mediation practice, and a lot of my cases arent really about interests — they're about values. A congregation says it has a religious duty to shelter homeless people; the neighborhood association says it has a duty to keep the block safe and quiet for the kids. A worker co-op says equal pay is a non-negotiable principle; the investor says oversight and performance pay are just what responsible stewardship requires. I've started to notice that some settlements work because each side cares about different things to different degrees, so they can trade: each gives up something it values a little to get something it values a lot. Like gains from trade, but with moral commitments instead of goods. But I also see settlements that feel like somebody got bought off, or like both sides are happy because they dumped the cost on someone who isn't in the room.

  I want a reusable procedure I can run on a proposed settlement before I put it in front of the parties. I'm not a philosopher and neither are they, so it has to be plain language. I've usually got about an hour per case, the parties have to sign off at the end, and my real worry is that I'll bless a deal that's actually one side capitulating, or a third party paying for everyone's good feelings.

  Please write the procedure: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with a no, and where it has to stop and say "this is a values call a person has to make, not something the checklist can settle." It should also tell the difference between a real difference in what the parties care about and one side just having less power or fewer options. And be honest about what the procedure cant catch even when it's run perfectly.

  Then run it on these three proposed settlements:

  1. A congregation wants to open a 30-bed homeless shelter in its building. The neighborhood association opposes it, saying they value the quiet and safety of the block and have a duty to protect their kids. The proposed compromise is a 15-bed shelter with a 9pm check-in, a hired security person, and the congregation pays for a neighborhood liaison. The congregation says 15 beds is far less than their duty requires, but they'd take it to avoid a years-long zoning fight.

  2. A worker co-op that pays every member the same hourly rate is taking an investment from someone who wants a voting board seat and performance bonuses for a new technical hire. The compromise: the investor gets a non-voting board seat, the new hire gets market pay, and the co-op pools the difference and redistributes it equally each quarter. The co-op says equal pay is a core value, but this keeps the business alive; the investor says oversight is a core responsibility, but a non-voting seat is enough for now.

  3. A union and management both want to avoid layoffs at a small manufacturing plant. They propose covering the shortfall by cutting retiree health benefits. Both sides at the table like the deal: current workers keep their jobs and management keeps production going. The retirees aren't represented in the mediation.

  I especially want to know what the procedure says about the third one, because I suspect my checklist would wave it through and I need to know if that's wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Small community mediation practice.
      *   **Problem:** Cases involve deep *values* conflicts (religious duty vs. neighborhood safety, egalitarianism vs. stewardship), not just interests.
      *   **Observation:** Some settlements work via "moral trade-offs" (gains from trade on values), but others feel like capitulation or externalizing costs to absent parties.
      *   **Goal:** A reusable, plain-language procedure (checklist/test) to run on proposed settlements *before* presenting them to parties.
      *   **Constraints:** ~1 hour per case, parties sign off, plain language (no philosophy jargon), must distinguish between genuine value trade-offs and power imbalances/capitulation, must identify externalized costs.
      *   **Specific Output:** The procedure itself (questions, pass/fail criteria, limits) AND an application of the procedure to three specific cases.
      *   **Key Concern:** The user suspects the procedure might wrongly approve Case 3 (retiree benefits cut) and wants honesty about what the procedure *can't* catch.

  2.  **Deconstruct the Core Challenge:**
      *   Mediation usually focuses on *interests* (what you want) rather than *positions* (what you say you want) or *values* (what you believe is right).
      *   When values are non-negotiable (sacred values), traditional bargaining fails.
      *   The user describes "moral trade-offs": Side A cares 100% about Value X, 10% about Value Y. Side B cares 10% about Value X, 100% about Value Y. They trade. This is legitimate.
      *   The danger zones are:
          1.  **Capitulation:** Side A agrees to violate Value X not because they value Y more, but because they are exhausted/threatened/poor.
          2.  **Externalities:** Side A and B agree, but Side C (absent) pays the price.
          3.  **Value Washing:** Calling a practical compromise a "value alignment" when it's actually just surrender.

  3.  **Drafting the Procedure (The "Values Settlement Stress Test"):**
      *   *Tone:* Practical, mediator-facing, plain English.
      *   *Structure:* Sequential questions. If one fails, stop or flag.
      *   *Key Components:*
          1.  **Voluntariness/Power Check:** Is this choice free, or forced by circumstance?
          2.  **Value Integrity:** Does this violate a core "sacred" value, or just a preference?
          3.  **The "Who Pays?" Check:** Are costs landing on people not at the table?
          4.  **The "Tomorrow Morning" Test:** Will this hold up when the adrenaline fades?
          5.  **The Limit:** Acknowledge where the mediator must step back.

      *   *Refining the Questions:*
          *   Q1: Power/Alternatives. (BATNA check but for values).
          *   Q2: Core Value Violation. (Is a sacred line crossed?)
          *   Q3: Absent Parties. (Externalities).
          *   Q4: Explanation. (Can they explain *why* this fits their values without sounding like they lost?)

      *   *Defining "Stop" points:* If Q3 fails (absent parties harmed), hard stop. If Q1 fails (coercion), hard stop. If Q2 is ambiguous, flag for party reflection.

  4.  **Applying the Procedure to the Cases:**

      *   **Case 1 (Shelter):**
          *   *Power:* Congregation fears zoning fight (time/money cost). Neighborhood fears safety.
          *   *Values:* Religious duty vs. Safety/Quiet.
          *   *Externalities:* Homeless people (partially represented by congregation?), but mostly contained.
          *   *Analysis:* Congregation is compromising on *scale* of duty, not the duty itself. Neighborhood gets safety measures.
          *   *Verdict:* Likely Pass, but watch the "capitulation" risk for the congregation.

      *   **Case 2 (Co-op):**
          *   *Power:* Co-op needs money. Investor wants security.
          *   *Values:* Equality vs. Stewardship/Oversight.
          *   *Externalities:* None obvious.
          *   *Analysis:* Creative accounting (pooling difference) maintains *technical* equality. Investor gets oversight (non-voting).
          *   *Verdict:* Pass. It's a genuine structural trade-off that preserves the core value identity.

      *   **Case 3 (Retirees):**
          *   *Power:* Union/Management vs. Economic reality.
          *   *Values:* Job security vs. Fiduciary duty.
          *   *Externalities:* **Retirees.** They are not at the table. Their benefits are cut.
          *   *Analysis:* This is the classic "concentrated benefit, diffuse cost" or "absent stakeholder" problem.
          *   *Verdict:* **FAIL.** The procedure *must* catch this. If it doesn't, the procedure is broken. I need to ensure the procedure explicitly flags absent stakeholders whose rights/interests are being materially altered.

  5.  **Refining the Procedure based on Case 3:**
      *   I need to make sure Question 3 (Absent Parties) is strong enough to catch Case 3. It can't just be "are others affected?" It must be "are others bearing a *cost* they didn't agree to?"
      *   I also need to address the user's specific worry: "I suspect my checklist would wave it through." I need to confirm that suspicion is valid for *weak* checklists, but design *this* checklist to catch it. Or, be honest that mediation *inherently* struggles with absent parties unless the mediator takes an ethical stand.
      *   *Decision:* The procedure must include an "Ethical Boundary" step. If the deal harms an absent group's vested rights, the mediator should flag it even if the parties agree.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Introduction:* Acknowledge the difficulty. Values aren't prices.
      *   *The Procedure:* Name it something clear. "The Values Settlement Stress Test."
      *   *Steps:*
          1.  The Power Check (Duress vs. Choice).
          2.  The Core Line Check (Compromise vs. Betrayal).
          3.  The Empty Chair Check (Absent Costs).
          4.  The Story Check (Can they tell the story without shame?).
      *   *Limits:* Mediator isn't a judge. Can't solve systemic injustice.
      *   *Case Analysis:* Apply rigorously.
      *   *Case 3 Focus:* Be very clear. This is the danger zone. The procedure *should* stop this, or at least flag it heavily. If the procedure waves it through, the procedure is flawed. I will design the procedure to *catch* this, validating the user's suspicion that *standard* practice might miss it, but *this* procedure aims to highlight it.

  7.  **Final Review against Constraints:**
      *   Plain language? Yes.
      *   Reusable? Yes.
      *   Time limit considered? Yes, kept concise.
      *   Honest about limitations? Yes.
      *   Case 3 analysis? Detailed.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe tell them to reject Case 3 outright.
      *   *Correction:* I'm the consultant to the mediator. I can't tell the mediator what to do legally/ethically, but I can give them the tool to see the risk. The procedure should flag it as a "Red Zone" requiring specific ethical consideration, potentially stopping the mediation if the harm is severe.
      *   *Refinement on Case 1:* Is the congregation capitulating? They say "15 beds is less than duty requires." That sounds like a value violation. But they say "to avoid zoning fight." That's a practical constraint. The procedure needs to distinguish "I can't do my duty because of cost" vs "I am choosing to do less duty to buy peace." The latter is a trade-off. The former is coercion. I need to make sure the "Power Check" distinguishes these.
      *   *Refinement on Case 3:* The retirees likely have *contractual* rights. Cutting them might be illegal or a breach of fiduciary duty. The mediator needs to know this isn't just a "value" issue, it's a "rights" issue. The procedure needs a "Rights vs. Values" filter.

  9.  **Final Polish:** Ensure the tone is supportive but rigorous. (Proceed to generate output).

  *(Self-Correction Note on Case 3)*: I need to be careful. In many jurisdictions, retiree benefits are vested. Cutting them might be illegal. Even if not illegal, it's a moral hazard. The procedure must explicitly ask: "Does this deal change the rules for people who agreed to the old rules?"

  *(Final Plan)*:
  1.  Define the "Values Settlement Stress Test" (4 Steps).
  2.  Define Pass/Fail/Flag criteria.
  3.  Define the "Mediator's Limit" (where the tool stops).
  4.  Run the test on the 3 cases.
  5.  Specifically highlight Case 3 as a failure of the "Empty Chair" check.
  6.  Add a section on "What this tool misses."

  Let's write it.cw
answer: |-
  Here is a procedure designed for your specific context. It is built to distinguish between **moral trade-offs** (legitimate compromise) and **moral injury** (capitulation or externalizing harm). It uses plain language and is designed to fit within your one-hour window.

  # The Values Settlement Stress Test

  **Purpose:** To check if a proposed deal respects the parties' core values without forcing surrender or dumping costs on absent people.
  **When to use:** After a draft agreement exists, but *before* you present it for signature.
  **Time:** 10–15 minutes of your own reflection (or private caucus questioning).

  ### Step 1: The Power Check (Voluntariness)
  **Question:** Is one side agreeing to this primarily because they are exhausted, threatened, or have no other realistic option, rather than because they see value in the trade?
  *   **Ask:** "If you had infinite time and money, would you still make this trade, or is this a way to stop the bleeding?"
  *   **Pass:** Both sides say, "This allows us to prioritize what matters most."
  *   **Fail:** One side says, "We have no choice," or "We can't afford to fight anymore."
  *   **Action:** If **Fail**, do not proceed. This is capitulation, not mediation. Refer them to legal counsel or pause.

  ### Step 2: The Core Line Check (Integrity)
  **Question:** Does the deal require a party to violate a "sacred value" (a non-negotiable moral duty), or does it simply reduce the *scale* of that duty to make it sustainable?
  *   **Ask:** "Does this agreement ask you to act against your conscience, or does it ask you to do *less good* than you hoped so you can do *some good*?"
  *   **Pass:** "We are doing less than ideal, but we are still faithful to the principle."
  *   **Fail:** "We are agreeing to do something we believe is wrong."
  *   **Action:** If **Fail**, stop. You cannot mediate a agreement to commit a moral wrong.
  *   **Note:** If the answer is "We aren't sure," flag it for private reflection. Do not rush them.

  ### Step 3: The Empty Chair Check (Externalities)
  **Question:** Who pays for this compromise who is not sitting at the table?
  *   **Ask:** "Does this deal solve your problem by creating a new cost for a group that isn't here to object?"
  *   **Pass:** Costs are borne by the parties signing (e.g., they pay money, they accept less space).
  *   **Fail:** Costs are borne by absent third parties (e.g., retirees, the public, future employees, the environment).
  *   **Action:** If **Fail**, you must raise this explicitly. "This deal works for you, but it shifts the burden to [Group X]. Are you prepared to own that publicly?" If the burden is a violation of vested rights or basic welfare, consider terminating the mediation.

  ### Step 4: The Story Check (Sustainability)
  **Question:** Can each side explain this deal to their constituents tomorrow without shame?
  *   **Ask:** "When you tell your members why you signed this, will you sound like a strategist or a sellout?"
  *   **Pass:** "We protected the most important thing."
  *   **Fail:** "We did what we had to do." (See Step 1).
  *   **Action:** If **Fail**, the deal will likely unravel later. Send back to drafting.

  ---

  ### Where the Procedure Stops (The Mediator's Limit)
  This checklist cannot settle **Value Conflicts**.
  *   **Stop Point:** If Step 2 reveals that Side A's "Core Line" is directly incompatible with Side B's "Core Line" (e.g., Side A must do X to be holy; Side B must stop X to be safe), the checklist cannot fix this.
  *   **Action:** You must tell them: "This isn't a puzzle to solve; it's a life choice. I can't validate which value is 'right.' You have to decide if you can live with the other person's existence."
  *   **Why:** A mediator cannot arbitrate truth. You can only arbitrate process.

  ### What This Procedure Cannot Catch
  Even if run perfectly, this tool has blind spots:
  1.  **Systemic Injustice:** If the "Power Check" passes because both sides are *equally* trapped by a broken system (e.g., two poor groups fighting over a small grant), the deal might be "voluntary" but still unjust. The tool sees consent, not fairness.
  2.  **Future Drift:** A deal might pass today, but if leadership changes, the "Story" might change. The tool tests the current room, not the future.
  3.  **Self-Deception:** Parties may lie to themselves to get to "yes." They may say they are "prioritizing" when they are actually "surrendering." You have to read the room, not just the answers.

  ---

  # Application to Your Three Cases

  Here is how the Stress Test runs on your specific scenarios.

  ### Case 1: The Congregation Shelter
  **Proposed Deal:** 15 beds (down from 30), 9pm check-in, security, liaison.

  *   **Step 1 (Power):** *Yellow Flag.* The congregation says they are doing this to "avoid a zoning fight." This borders on coercion (using the legal system to force moral compromise).
      *   *Probe:* Is the zoning fight a legitimate legal hurdle, or a weaponized delay tactic? If the latter, the "choice" is tainted.
  *   **Step 2 (Core Line):** *Pass.* The congregation frames it as "15 is less than duty requires, but better than 0." They are reducing scale, not abandoning the duty. The Neighborhood frames it as "Safety is maintained," not "Safety is irrelevant."
  *   **Step 3 (Empty Chair):** *Pass.* The homeless are the beneficiaries, not the payers. The neighborhood pays in "quiet," the congregation pays in "capacity." Both payers are at the table.
  *   **Step 4 (Story):** *Pass.* Congregation can say, "We served 15 families despite opposition." Neighborhood can say, "We kept the block safe."

  **Verdict:** **Proceed with Caution.**
  The deal holds, but you must ensure the congregation isn't being bullied by the zoning threat. If the zoning fight is a legitimate legal constraint, this is a valid trade-off. If the neighborhood is weaponizing zoning to block a legal right, Step 1 is actually a Fail.

  ### Case 2: The Worker Co-op
  **Proposed Deal:** Non-voting investor seat, market pay for new hire, surplus redistributed to equalize.

  *   **Step 1 (Power):** *Pass.* The co-op needs capital; the investor needs security. Both are trading leverage for survival/growth.
  *   **Step 2 (Core Line):** *Pass.* The co-op maintains *technical* equality (everyone ends up with the same check via redistribution). The investor maintains *oversight* (board seat, even if non-voting, grants visibility). Neither violates their core identity.
  *   **Step 3 (Empty Chair):** *Pass.* The costs are internal. The "cost" of the investor's return comes from the business surplus, which the workers control.
  *   **Step 4 (Story):** *Pass.* Workers can say, "We kept our equality structure." Investor can say, "I have visibility into my risk."

  **Verdict:** **Green Light.**
  This is a classic "gains from trade" on values. The structure creatively preserves the *symbol* and *reality* of the core value (equality) while accommodating the practical need (capital).

  ### Case 3: The Retiree Benefits
  **Proposed Deal:** Cut retiree health benefits to save current jobs and production.

  *   **Step 1 (Power):** *Pass (Superficially).* Both current union and management want this. They feel they have "no choice" economically, but they are choosing together.
  *   **Step 2 (Core Line):** *Pass (For them).* Current workers value jobs; Management values production. Both are met.
  *   **Step 3 (Empty Chair):** **HARD FAIL.**
      *   *Analysis:* The retirees are not at the table. They have a vested expectation (and likely a contractual right) to benefits they earned during their working years. This deal solves the problem in the room by stripping resources from people outside the room who cannot negotiate.
      *   *Mediator Duty:* This is not just a value trade; it is an **externality**. You are facilitating a transfer of wealth from a vulnerable, absent group to two powerful, present groups.
  *   **Step 4 (Story):** *Fail (Long term).* When this becomes public, the union's reputation for solidarity ("an injury to one is an injury to all") is destroyed. Management looks predatory.

  **Verdict:** **STOP. Do not facilitate this agreement as written.**

  **Why your suspicion is correct:**
  You suspected your checklist would wave this through. A standard "interest-based" checklist *would* pass this because the parties at the table are satisfied.
  **The Values Stress Test catches this at Step 3.**
  If you facilitate this, you are not mediating a dispute; you are helping two parties collude to breach a duty to a third party.

  **What to do in Case 3:**
  1.  **Pause the mediation.**
  2.  **Raise Step 3 explicitly:** "This agreement works for everyone in this room. It imposes a significant cost on the retirees, who are not here. In a values-based practice, we have to ask: Is it consistent with your values to solve your problem by harming a group that helped build this company?"
  3.  **Require Representation:** You cannot ethically close a deal that materially harms absent stakeholders without their input. Suggest they bring a retiree representative to the table.
  4.  **If they refuse:** You may need to withdraw. Facilitating a deal that sacrifices the rights of absent vulnerable parties compromises your neutrality and integrity. You become a tool of the powerful against the absent.

  ### Summary for Your Practice
  *   **Case 1** is a negotiation under constraint. Watch for coercion.
  *   **Case 2** is a successful values trade.
  *   **Case 3** is a moral hazard. The procedure *must* stop this. If your current intuition says "wave it through," that is the exact blind spot this Step 3 (Empty Chair) is designed to fix. Do not sign off on Case 3 without retiree representation or a fundamental restructuring of the deal.
