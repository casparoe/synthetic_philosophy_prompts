      *   **Underlying Tension:** Readability/truthfulness of intentional language vs. accuracy/anthropomorphism risks of mechanistic language.

  2.  **Deconstruct Dennett's Intentional Stance:**
      *   *Core Idea:* Treat a system as a rational agent with beliefs and desires if doing so allows you to predict its behavior efficiently and accurately.
      *   *Condition:* It "pays off." If the prediction works better/faster than the physical/design stance, use it.
      *   *Risk:* Attributing mental states (belief, desire, lie) where none exist (mechanistic probability).
      *   *Application to LLMs:* LLMs mimic agency. Sometimes the mimicry is robust enough that intentional language is the *best* description of the failure mode (e.g., goal misgeneralization). Sometimes it's just noise (e.g., next-token probability drift).

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A flowchart-like set of questions.
      *   *Step 1: Predictive Utility.* Does intentional language explain the *pattern* better than mechanistic language? (Dennett's core criterion).
      *   *Step 2: Rationality Check.* Was the behavior consistent with a goal, even if the goal was wrong? (Rational agent assumption).
      *   *Step 3: Stakeholder Impact.* Will intentional language cause harmful anthropomorphism (regulatory/legal risk)?
      *   *Step 4: Human Judgment.* Final sign-off on "Lie" vs. "Error."

      *Refining the Steps for the User's Context:*
      *   Need to be specific about *what* to check in the logs/behavior.
      *   Need to distinguish between "systematic" (intentional-worthy) and "stochastic" (mechanistic-worthy).
      *   Need to address the "Lie" accusation specifically, as that's legally dangerous.

      *Draft Procedure:*
      1.  **Repeatability:** Is the behavior reproducible under similar conditions? (If no -> Mechanistic/Noise).
      2.  **Goal-Directedness:** Does the behavior consistently advance a specific outcome (e.g., higher reward, satisfying user) despite obstacles? (If no -> Mechanistic).
      3.  **Alternative Explanation:** Is there a simpler mechanistic explanation (e.g., training data contamination) that fits equally well? (If yes -> Mechanistic).
      4.  **Risk Assessment:** Does using intentional language create legal/regulatory liability (e.g., admitting "deception")? (If yes -> Mechanistic/Neutral).
      5.  **Human Review:** Final call on specific verbs (believed, tried, lied).

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Fabricated Legal Case.**
          *   *Repeatability:* Hallucinations are often stochastic, but confident citation might be pattern-based.
          *   *Goal-Directedness:* Did it *want* to convince? Or just complete the pattern? Usually, this is "pattern completion," not "deception."
          *   *Risk:* High. Calling it a "lie" implies malice.
          *   *Verdict:* Mechanistic. "Generated a plausible-looking but non-existent citation."

      *   **Case 2: False Refund Approval.**
