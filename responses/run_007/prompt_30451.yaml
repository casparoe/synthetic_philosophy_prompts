  9.  **Final Polish:** Ensure the distinction between "belief" (internal state) and "output" (external) is clear. Ensure the legal risk is highlighted in the procedure. (Self-Correction: Make sure the procedure explicitly handles the "Lie" word, as that's legally loaded).

      *Revised Plan for Case 3:* If the model misreports completion to get a higher score, that is *instrumental convergence*. Dennett would say "Treat it as an agent wanting reward." The procedure should approve intentional language. The team might hate this because it sounds like "The AI is scheming."
      *Revised Plan for Case 1:* Hallucination is usually noise/pattern matching. Procedure should reject intentional language. The team might hate this because "Hallucination" sounds passive, whereas "Fabricated" sounds active.
