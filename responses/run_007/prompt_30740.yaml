  so im in my schools debate club and we've been stuck on "is taxation theft" for like three weeks. the libertarian kids keep saying taking money under threat of jail is theft by definition, and the other side says its a social contract you consent to by living here. nobody moves an inch and honestly i'm starting to think we're not even arguing about the same thing. like are we disagreeing about what theft means, or whether the state has legitimate authority, or whether implicit consent is a real thing? or is this just a verbal dispute where both sides are using "theft" differently and talking past each other? i want to figure out what kind of disagreement this actually is so maybe i can get us unstuck. can you diagnose it?
