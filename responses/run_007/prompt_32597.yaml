  This is a classic formulation of the **Wrong Kind of Reasons (WKR) problem**. You have reconstructed the dilemma perfectly: you are caught between the **Fittingness Intuition** (attitudes must track their objects, e.g., admiration tracks admirability) and the **Pragmatic Intuition** (benefits can be reasons for attitudes, e.g., believing to recover).

  To keep the *intuitions* behind both (4) and (8), you must reject the assumption that the word "reason" is doing the same work in both cases.

  ### The Diagnosis: Equivocation on "Reason"

  The argument relies on a univocal definition of "reason." It assumes that if there is a reason to admire the demon (3), it must be the *same kind* of reason that makes admiration fitting (4), and that if pragmatic benefits count as reasons in the doctor case (8), they must count as reasons in the demon case (3).

  To resolve this, you should **reject Premise (5)** as a universal constraint, but **qualify Premise (4)**.

  ### The Solution: Distinguish Two Kinds of Reasons

  You need to adopt a **Reasons Pluralism** view, distinguishing between:

  1.  **Object-Given Reasons (Right Kind of Reasons - RKRs):** Considerations that bear on the object of the attitude (e.g., the demon's virtues, the truth of the prognosis). These determine whether the attitude is **fitting** or **correct**.
  2.  **State-Given Reasons (Wrong Kind of Reasons - WKRs):** Considerations that bear on the *state* of having the attitude (e.g., avoiding punishment, recovering health). These determine whether the attitude is **beneficial** or **prudent**.

  **How this resolves your dilemma:**

  *   **The Demon Case:** The threat provides a *State-Given Reason*. It is true that you have a reason to admire him in the pragmatic sense (saving intuition 8's logic). However, Premise (4) is correct that this doesn't make the demon *admirable*. You preserve (4) by interpreting it as: "There is no *Object-Given* reason to admire the demon."
  *   **The Doctor Case:** The benefit provides a *State-Given Reason*. You preserve (8) by acknowledging that pragmatic reasons are genuine reasons, just not *epistemic* ones.
  *   **Premise (5):** You reject this because it claims *only* Object-Given considerations count as reasons. By rejecting it, you allow pragmatic reasons to exist (saving 8), but by distinguishing the types, you explain why the demon case still feels wrong (saving the spirit of 4).

  ### Which Step to Reject?

  **Reject Premise (5).**

  > *(5) So something like this must be true: a consideration is a reason for an attitude only if it bears on the object in the way proper to that attitude...*

  You should replace it with: *"A consideration is a **constitutive/fittingness** reason for an attitude only if it bears on the object..."* while allowing that **pragmatic** reasons exist outside this constraint.

  ### What Does This Cost?

  Rejecting (5) and adopting the Two-Kind view comes with three significant theoretical costs:

  1.  **Theoretical Complexity:** You can no longer have a simple, unified theory of normative reasons. You must explain how these two types of reasons interact. For example, if I have a pragmatic reason to believe I will recover, but overwhelming evidence I won't, which reason "wins"? (Usually, epistemic reasons trump pragmatic ones for belief, but explaining *why* requires extra work).
  2.  **Tension with Constitutive Aims:** Many philosophers argue that attitudes are *defined* by their aims (belief aims at truth, admiration at admirability). If you admit pragmatic reasons are genuine reasons *for the attitude* (and not just reasons to *cause* the attitude), you risk blurring the line between what the attitude *is* and what we *do* with it. You have to explain how one can "believe for a pragmatic reason" without violating the nature of belief (the "transparency" constraint).
  3.  **Linguistic Awkwardness:** You must accept that sentences like "I have a reason to admire this tyrant" are technically true (pragmatically), even though they sound like category mistakes. You have to be comfortable explaining that the sentence is true in one sense (prudence) and false in another (fittingness).

  ### Summary
  If you keep (5), you lose pragmatic reasons (violating 8). If you drop (5) without distinction, you lose the fittingness constraint (violating 4). By **rejecting (5)'s exclusivity** and distinguishing **Object-Given** from **State-Given** reasons, you can validate the pragmatic force in the doctor case while maintaining that the demon remains unadmirable.
