          *   *Philosophical Stance:* Aesthetic Empiricism / Formalism.
          *   *Strengths:* Aligns with immediate sensory experience. Challenges snobbery.
          *   *Weaknesses:* Ignores context, intention, and art-historical significance. Reduces art to mere decoration.

      *   **Move 2 (Elena):**
          *   *Claim:* Art isn't just surface; it's a relationship between maker, moment, and material. Forgery falsifies this relationship. Analogy: Archaeopteryx fossil (scientific value lies in history).
          *   *Philosophical Stance:* Contextualism / Historical Ontology of Art (Danto/Dickie vibes).
          *   *Strengths:* Captures why we care about authorship. Good analogy for historical evidence.
          *   *Weaknesses:* The fossil analogy might be category mistaken (art vs. evidence). Does art *function* like a fossil?

      *   **Move 3 (Marcus):**
          *   *Claim:* Fossil analogy begs the question. Fossils are evidence; paintings are for looking/feeling. Analogy: A chair replica is just as good for sitting.
          *   *Philosophical Stance:* Functionalism / Aesthetic Isolationism.
          *   *Strengths:* Distinguishes between epistemic value (fossil) and aesthetic value (painting). Highlights the "function" of art as experience.
          *   *Weaknesses:* Is the function of art *only* sitting/looking? Ignores the communicative aspect of art.

      *   **Move 4 (Elena):**
          *   *Claim:* Marcus conceded that history matters for *some* objects (fossils, love letters). Art belongs in that category because it's an intentional act within a tradition. The feeling of betrayal proves something was lost.
          *   *Philosophical Stance:* Intentionalism / Art as Action.
          *   *Strengths:* Forces Marcus to define the category of "art." Uses phenomenological evidence (feeling of betrayal) as data.
          *   *Weaknesses:* Is the feeling of betrayal proof of aesthetic loss, or just social loss? (Marcus will pounce on this).

      *   **Move 5 (Marcus):**
          *   *Claim:* Betrayal is social, not aesthetic. Analogy: A fabricated anecdote is still a good story, even if the friend lied. Forgery is a worse social act, not a worse painting.
          *   *Philosophical Stance:* Separation of Ethical/Social from Aesthetic.
          *   *Strengths:* Cleanly separates the object's properties from the artist's behavior.
          *   *Weaknesses:* Can you truly separate the "story" from the "storyteller" in art? Is art communication?

  3.  **Evaluate the Dialectic (Point-by-Point Adjudication):**

      *   *Round 1:* Marcus sets a high bar for empiricism. Elena needs to show why non-perceptual properties matter.
      *   *Round 2:* Elena's fossil analogy is strong but vulnerable to category errors. Marcus needs to distinguish art from evidence.
      *   *Round 3:* Marcus successfully distinguishes evidence from experience, but his chair analogy is weak (art isn't purely utilitarian).
      *   *Round 4:* Elena traps Marcus: if history matters for *some* things, why not art? Her "betrayal" argument is strong phenomenologically.
      *   *Round 5:* Marcus isolates the betrayal to the social realm. This is the crux: Is art essentially social/communicative?

  4.  **Identify the Core Disagreement (Where it Bottoms Out):**
      *   It's not about perception (they agree perception is identical).
      *   It's about the *ontology of the artwork*.
      *   Marcus: Artwork = Aesthetic Object (perceptual properties).
      *   Elena: Artwork = Aesthetic Action (historical/intentional properties).
      *   The "Betrayal" point is the testing ground. Is the betrayal about the *object* or the *relationship*?

  5.  **Drafting the Response:**
