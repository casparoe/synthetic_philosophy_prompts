  4.  **Developing the Arguments (Drafting & Refining):**

      *   *Argument 1: The Infinite Horizon/Summation Problem (Decisive/Formal).*
          *   If time is unbounded and utility is positive, the sum is infinite. Comparing infinite streams is mathematically problematic without discounting or a criterion like "overtaking."
          *   *Defender Concession:* Yes, this breaks standard utilitarian calculus.
          *   *Insulation:* Use overtaking criteria or limit average utility.
          *   *Problem:* These criteria have their own counter-intuitive results (e.g., the "Repugnant Conclusion" variants in infinite time).

      *   *Argument 2: Personal Identity and Psychological Connectedness (Strong/Conceptual).*
          *   Parfit's reductionist view. If I am weakly connected to my future self, why treat that self's welfare as identical to my current self's?
          *   *Defender Concession:* If identity is what grounds special concern, and identity fades, temporal neutrality might be misapplied *within* a life.
          *   *Nuance:* User might say this applies to *interpersonal* neutrality, but within a life, connectedness matters.
          *   *Ranking:* High, because it attacks the metaphysical grounding of the "self" over time.

      *   *Argument 3: The Non-Identity Problem (Strong/Normative).*
          *   Policies affecting the distant future change *who* exists. If we delay a harm, different people are born. If those people have lives worth living, have we harmed them?
          *   *Defender Concession:* Temporal neutrality assumes fixed subjects. If subjects vary, the framework strains.
