      *(Self-Correction on Infinite Horizon)*: Is it *decisive*? Many utilitarians accept infinite horizons and use overtaking criteria. I should frame it as "Decisive against *standard* aggregation," but maybe not against the *ethic* itself. I will rank it high because it forces a revision of the aggregation mechanism, which is a significant theoretical cost.

      *(Self-Correction on Personal Identity)*: If the user is a temporal neutralist, they likely accept Parfit's reductionism. So, does connectedness justify discounting? Parfit says no, it just reduces the *reason* for special concern. But if the self is a series of person-stages, temporal neutrality applies *between* stages. I need to be careful here. The objection is that if connectedness fades, the *unity* required for neutrality dissolves.

