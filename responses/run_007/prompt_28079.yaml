prompt: |-
  I've come to accept that pure time preference—discounting a benefit or harm solely because it lies further in the future—is not a legitimate normative input, but a bias to be debiased. On my view, the only permissible discounting is for uncertainty, opportunity costs, and similar epistemic or instrumental factors; the bare passage of time itself should carry no weight. I want to know what would count against this. What observations, arguments, formal results, or possible cases should move me, ranked from decisive to merely awkward? In particular, which of these would a committed defender of temporal neutrality concede as counting against the position—for example, implications for choices involving the very distant future, the analogy between temporal and spatial partiality, the dependence of discounting on personal identity over time, or puzzles that arise once infinite horizons are allowed—rather than dismissing as mere demandingness objections? Finally, has the position been qualified in ways that insulate it from any such evidence, and if so, is that insulation a problem for a view of this kind?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Position:**
      *   **Core Claim:** Pure time preference (discounting utility/welfare solely due to temporal distance) is a bias, not a legitimate normative input.
      *   **Permissible Discounting:** Only for uncertainty, opportunity costs, instrumental factors (epistemic/pragmatic).
      *   **Normative Stance:** Temporal Neutrality (the "bare passage of time itself should carry no weight").
      *   **Request:** What counts *against* this view?
      *   **Ranking:** Decisive to merely awkward.
      *   **Constraint:** Must be arguments a *committed defender of temporal neutrality* would concede count against the position (not just "it's too demanding").
      *   **Specific Topics to Address:** Distant future implications, spatial/temporal analogy, personal identity, infinite horizons.
      *   **Final Question:** Has the position been qualified/insulated, and is that insulation problematic?

  2.  **Initial Brainstorming & Categorization of Objections:**
      *   *Parfit's Non-Identity Problem:* Affects future people. If we delay harm, different people exist. Does temporal neutrality collapse here?
      *   *Infinite Utility/Summation:* If time is infinite and we don't discount, total utility might be undefined or infinite, making comparison impossible (Vallentyne, Brown).
      *   *Personal Identity/Psychological Connectedness:* Parfit again. I am less connected to my future self. Is discounting based on *connectedness* permissible? If so, is it "pure" time preference or something else?
      *   *Sustainability/Overwhelming Obligations:* If future generations count equally, current consumption must be near zero (Ramsey's "ethical indefensibility" quote). Is this a *reductio* or just demandingness? User says "not mere demandingness."
      *   *Spatial Analogy:* We don't discount based on distance in space. Why time? If the analogy breaks, why?
      *   *Growth/Opportunity Cost:* Ramsey argued discounting is ethically indefensible, but acknowledged economic growth makes future people richer, so marginal utility is lower. This isn't pure time preference, but it interacts.
      *   *Risk of Extinction:* If we care equally about the far future, extinction avoidance becomes overwhelmingly important. Is this a bug or a feature? (Longtermism).
      *   *Preference Satisfaction:* People *have* time preferences. Satisfying preferences is good. Ignoring them reduces welfare.

  3.  **Filtering for the User's Constraints:**
      *   *Constraint:* "Not mere demandingness." This rules out "It requires too much sacrifice." The objection must be internal coherence or logical contradiction, not just practical difficulty.
      *   *Constraint:* "Committed defender would concede." This means I need to find arguments that strike at the *logic* of temporal neutrality, not just its popularity.
