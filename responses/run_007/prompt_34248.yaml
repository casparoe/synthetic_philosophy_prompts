prompt: |-
  So I'm a journalist covering the science-and-ideas beat, and I'm working on a feature about the knowledge argument — Mary's room, the whole thing. You know the setup: Mary's a brilliant neuroscientist who knows every physical fact about color vision, but she's been raised in a black-and-white room. When she finally sees a red rose, does she learn something genuinly new? That's the question.

  What I want from you is a short story that dramatizes this. Not a dry recap of the thought experiment — I want fiction that makes the reader feel what's at stake. Here's the thing though: I want you to take a side. Don't give me a both-sides, on-the-one-hand treatment. Commit. If you think Mary learns something new (and physicalism is in trouble), write the story so that lands. If you think she doesn't, make that case through the narrative. I want the story itself to be an argument, in a way.

  One more thing — after the story, add a quick note about where you're taking liberties with the philosophical details or leaning on a contested reading. That'll help me when I'm weaving in the more analytical sections of the piece. No need for citations or bibliography, I've got the references already.

  And keep it tight — my editor will kill me if it runs over 2,000 words. Honestly I'm writting this on my phone so don't judge the punctuation.
