      *   *Disciplinary Power:* Bottom-up/Capillary, invisible, "Yes/Normalize," training, efficiency, the Panopticon (internalized gaze), examination/documentation.
      *   *Key Mechanisms:* Hierarchical observation, normalizing judgment, examination.
      *   *The Body:* Docile bodies, trained, optimized.
      *   *Knowledge:* Power/Knowledge nexus. Files, grades, rankings create the "truth" about the subject.
