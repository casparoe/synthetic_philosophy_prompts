      *Refining the "Contrarian" moment:* In the Faculty Meeting, the instinct is usually "The teachers are powerful." Foucault suggests the *system* is powerful, and the teachers are also subjects of it. I will advise the user to make the teachers feel constrained by the file, not just masters of it.

      *Refining the "Rework" moment:* If a scene relies solely on a shout of "No!", the procedure should flag it as "Sovereign" and ask if that fits the institution's long-term logic. If it's a conservatory, it's likely disciplinary. A sovereign outburst might be an anomaly, not the rule.

