      *   **Goal:** Draft an "Adversarial Collaboration Document" they can both sign.
      *   **Requirements:**
          *   Numbered list of substantive agreed claims (structure, assumptions, what is/isn't being said).
          *   Disagreements table (specific sub-questions, steel-manned positions).
          *   Cruxes (questions that, if settled, change minds).
          *   Resolution paths (arguments/experiments bearing on cruxes, predictions).
