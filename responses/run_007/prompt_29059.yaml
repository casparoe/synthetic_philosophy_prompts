answer: |-
  ### The Checks

  This procedure is a static analysis tool designed to expose structural contradictions in self-amending rulesets. It does not guarantee legal validity—that is determined by players or courts after the fact—but it identifies logical faults that frequently lead to system collapse. Run these three checks on every proposed amendment or new ruleset.

  **1. The Temporal Anchor Check**
  *Objective:* Ensure the rule does not claim authority before it exists.
  *Procedure:* Identify the exact moment the rule claims to take effect. Compare this to the moment the validating vote or decision concludes.
  *Pass:* The rule takes effect at or after the moment of validation.
  *Fail:* The rule claims to be in force prior to its adoption (retroactive authority).
  *Human Decision:* If the rule fails, stop. Retroactivity is a design choice, not a bug, but it requires explicit ratification. Hand this to the governance body: "Do you accept that this rule claims to validate the very process that created it? If yes, record a separate resolution ratifying the past action."

  **2. The Authority Lineage Check**
  *Objective:* Ensure there is an unbroken chain of validity from the current ruleset to the proposed change.
  *Procedure:* Trace the permission to make this change. Which existing rule allows this amendment? Does the proposed change alter that specific permission rule?
  *Pass:* The change is permitted by existing rules, and those existing rules remain valid after the change.
  *Fail:* The change removes or alters the rule that authorised it in a way that makes the current change impossible under the old rules (e.g., raising a threshold for a vote that has already occurred).
  *Human Decision:* If the change alters the amendment rule itself, hand to the designer: "Are you intending to change the rules for *future* amendments only, or does this text claim to govern its own passage? If the latter, verify the vote meets the *new* threshold, not just the old one."

  **3. The Entrenchment and Survival Check**
  *Objective:* Prevent accidental lock-in or system vacuum.
  *Procedure:* Scan for clauses that make the rule harder to change than the constitution allows, or clauses that repeal the entire ruleset.
  *Pass:* The rule can be amended using the standard procedure, and the system retains at least one rule governing procedure after enactment.
  *Fail:* The rule makes itself unamendable (or harder to amend than the meta-rule allows), or it repeals itself without a transition plan.
  *Human Decision:* If the rule entrenches itself, hand to the community: "This rule attempts to bind future majorities. Is this intended as a permanent constraint?" If the rule repeals itself, ask: "Is the intention to reset the game to a state of nature? If so, define what happens next."

  ***

  ### Worked Applications

  Here we apply the procedure to the three proposed rules you provided. Note where the procedure flags issues that designers often ignore because they seem 'clever'.

  **(a) The Self-Entrenching Rule**
  *Proposal:* Raises amendment threshold from majority to unanimity; states new threshold governs any amendment to the rule, *including the amendment that enacted it*.
  *Check 1 (Temporal):* Pass. It takes effect upon passage.
  *Check 2 (Lineage):* **Fail.** Under the old rules, a majority suffices. Under the new text, unanimity is required for *this* vote. If the vote was only a majority, the rule invalidates its own passage.
  *Check 3 (Entrenchment):* **Fail.** It raises the barrier higher than the previous meta-rule likely intended for self-modification.
  *Designer Temptation:* Designers often ignore the Lineage Fail, assuming the new rule 'bootstraps' itself into validity. **Do not ignore this.** If the vote was not unanimous, the rule is void ab initio. The Human Decision here is crucial: you must either re-run the vote under unanimity or strip the clause regarding retroactive application.

  **(b) The Retroactive Authority Rule**
  *Proposal:* Declares itself in force one turn before adoption, so the vote was conducted under its own authority.
  *Check 1 (Temporal):* **Fail.** It claims existence prior to validation.
  *Check 2 (Lineage):* **Fail.** It claims to authorise the vote that created it, creating a circular dependency.
  *Check 3 (Survival):* Pass.
  *Designer Temptation:* This is tempting because it cleans up procedural errors after the fact. However, the procedure flags this as a critical failure. A rule cannot create the ground it stands on. The Human Decision requires a separate ratification vote *after* adoption to legitimise the past turn. Without that, the rule is a logical fiction that opponents can challenge successfully.

  **(c) The Self-Repealing Rule**
  *Proposal:* On effect, repeals every rule in the game, including itself.
  *Check 1 (Temporal):* Pass.
  *Check 2 (Lineage):* Pass. It uses existing power to repeal.
  *Check 3 (Survival):* **Fail.** It creates a system vacuum. There are no rules left to govern the repeal itself or what follows.
  *Designer Temptation:* Designers love 'nuke' buttons. The procedure flags the vacuum. The Human Decision is vital: "What is the default state?" If there is no fallback constitution, the community dissolves into chaos. The procedure demands you specify a successor rule or a default protocol before this can pass safely.

  ***

  ### Limits

  This procedure is a heuristic, not a proof. It cannot guarantee validity because legal systems are fundamentally retrospective. A rule is often only 'valid' once the community accepts it, regardless of logical paradoxes. If everyone agrees to ignore the Temporal Anchor Check, the rule will work in practice despite failing the test.

  Furthermore, the procedure cannot catch semantic ambiguities or external conflicts. It analyses structure, not meaning. A rule might pass all three checks but still be unenforceable because it contradicts higher-order laws (e.g., platform Terms of Service) or human rights standards.

  Finally, there is a Gödelian limit: no ruleset can fully verify its own consistency from within. If a paradox is subtle enough, it will hide in the interaction between rules rather than within a single rule. This procedure catches the common structural failures—the 'low-hanging fruit' of legal paradoxes—but it cannot replace the need for a living governance body capable of interpreting ambiguities when they arise. Use this to filter out obvious bugs, not to certify truth.
