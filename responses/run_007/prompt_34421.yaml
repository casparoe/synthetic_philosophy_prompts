  Additionally, your distinction between manipulability and unequal strategic competence is crucial. It shifts the burden from designing impossible mechanisms to improving voter education or simplifying ballots. This avoids the "perfect is the enemy of the good" trap. You correctly note that strategy-proof rules like serial dictatorship are arguably worse than manipulable ones because they ignore input from multiple agents entirely. The argument successfully challenges the fetishization of strategy-proofness without denying the math.

  Furthermore, the "costly signal" analogy is compelling. In economics, signals must be costly to be credible. If strategic voting requires research, coordination, or overcoming psychological barriers like voting against a true favorite, it mimics a costly signal of intensity. This gives a functionalist explanation for why strategic voting persists despite normative critiques. It suggests voters aren't just gaming the system but adapting the system to capture missing information that the ballot structure excludes. This bridges the gap between formal theory and behavioral reality, offering a pragmatic defense of imperfect institutions. Ultimately, you provide a functionalist justification for a phenomenon usually deemed pathological.

  - "What doesn't work" (~350 words)
  The empirical claim is your weakest link. There is little evidence that strategic voting correlates with genuine preference intensity rather than polarization or privilege. In the US, tactical voting often benefits entrenched parties, not intense minorities. The "costly signal" theory assumes strategic voting is hard, but often it is just following partisan media cues, which correlates with wealth and education, not intensity. A poor voter might care intensely but lack the cognitive bandwidth to strategize. Consequently, your system might amplify the intensity of the wealthy, not the passionate. This creates a systematic bias.

  Conceptually, you conflate ordinal limitations with strategy-proofness. You specify "ordinal voting system," but if intensity matters, why restrict ourselves to ordinal ballots? Cardinal voting allows intensity expression directly without relying on the noisy proxy of strategic manipulation. While Gibbard extends impossibility results to cardinal rules, the strategic landscape changes significantly. You are defending a workaround for a problem that might be better solved by changing the input mechanism rather than embracing manipulation.

  Also, strategic voting often suppresses intensity. If a minority knows they cannot win, they might not vote at all, creating strategic despair. Or, strategic voting can lead to "lesser evilism," dampening support for innovative policies. The signal is noisy; it often reflects poll standings more than internal utility. Strategic voting depends on expectations of others, not just personal stakes. Finally, you assume the outcome of strategic voting is normatively better. But if intense minorities block mild majorities consistently, you get instability. A mild majority's consistent preference might represent greater aggregate utility than an intense minority's, but your framework systematically discounts the majority's welfare because they lack the incentive to strategize. This turns voting into a contest of agitation rather than preference aggregation, potentially undermining stability and legitimacy.

  - "The objection I'd press" (~200 words)
  The most damaging objection is that your system incentivizes the "tyranny of the intense minority." If strategic voting is the channel for intensity, then organized, intense minorities can consistently override mild majorities. While you argue this is desirable, democratically, this undermines the aggregation of welfare. If every election becomes a contest of who cares more rather than who prefers what, you invite instability and polarization. Candidates would cater to extreme bases rather than median voters.

  This doesn't just express intensity; it amplifies it disproportionately, leading to policy whiplash. A mild majority's consistent preference might represent greater aggregate utility than an intense minority's, but your framework systematically discounts the majority's welfare because they lack the incentive to strategize. This turns voting into a contest of agitation rather than preference aggregation. Furthermore, strategic voting requires information about others' preferences. This leads to reliance on polls and media, which can be manipulated by elites. Thus, the "intensity" signal is easily hijacked by those who control the narrative, making the system vulnerable to manipulation not by voters, but by power brokers shaping voter expectations.

  - "Where I'd take this next" (~150 words)
  Read Farquharson's *Theory of Voting* (1969), which treats strategic voting as sophisticated behavior rather than pathology. Look into "Utilitarian Voting" literature, such as Range Voting, to see if cardinal ballots solve your intensity problem without the strategic noise. Empirically, examine data from jurisdictions with different systems, such as Scotland's STV versus US Plurality, to see if strategic voting correlates with measures of preference strength.

  Finally, try to formalize the "costly signal" model. Under what conditions does strategic voting accurately reveal intensity versus when does it just reveal resources? You need a model where the cost of strategy is tied to utility loss, not just cognitive load. Explore the literature on "Expressive Voting" versus "Instrumental Voting" to refine your understanding of voter motivation. This will help you determine if the signal is truly about intensity or merely about partisan identity. Consider mechanism design literature on partial implementation to see if there are middle grounds.
