      *   *Point 3: Causal Power.* James insists consciousness *does* things. He'd worry Dennett's "narrative gravity" is too passive. James needs the "fight for life" to be felt to be real.
      *   *Point 4: Heterophenomenology vs. Introspection.* James would reject Dennett's method of treating subjects as third-person objects.
      *   *Conclusion:* James would be a "Phenomenological Functionalist." He'd accept the mechanism but demand the feeling be counted as real causal data.

