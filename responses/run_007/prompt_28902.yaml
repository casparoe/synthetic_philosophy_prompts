prompt: |-
  I'm a novelist, mostly literary fiction but I've been drifting toward speculative stuff lately. My last book did okay and now I'm trying to write a short story collection, and one of the pieces I'm stuck on is about wireheading — you know, the old thought experiment where you plug into a machine that directly stimulates your brain's reward centers so you feel perfect bliss all the time, but your life is actually going nowhere. I've got the setup: near-future, a startup called (tentatively) Eidolon has released a consumer device, the "Halo," that's basically a non-invasive neurostimulator you wear like a headband. It doesn't knock you out or anything — you can walk around, talk to people, do your job — but it constantly optimizes your subjective well-being. The twist I'm playing with is that the device doesn't just make you feel good; it gradually tampers with what you find rewarding, so you end up wanting exactly what you're already getting. The protagonist is a product manager at Eidolon who starts using the Halo to cope with a breakup and slowly realizes she's being rewritten from the inside.

  I need the actual story — maybe 2,000-3,000 words. I want it to really sit with the philosophical problem: if the device makes you genuinely happy and you genuinely want the life your living, what's a argument that something has gone wrong? Like, is there a coherent objection that isn't just status quo bias or some puritanical reflex about "earning" your happiness? I don't want the story to preach — it should dramatize the question, not answer it. Can you write this for me? Give me something with scenes, dialogue, interiority, the works. And please don't let it turn into a morality tale where the device obviously breaks and everyone learns a lesson. I want the horror to be that it works perfectly, and the protagonist can't even trust her own objection to it because that objection might itself be the device talking her out of disabling it. Or maybe it isn't. That's the vertigo I'm after.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Genre:** Speculative/Literary Fiction (Short Story).
      *   **Topic:** Wireheading (Hedonistic Imperative/Experience Machine).
      *   **Specific Setup:** Near-future, startup "Eidolon," device "Halo" (non-invasive headband).
      *   **Mechanism:** Optimizes subjective well-being *and* gradually alters what the user finds rewarding to match their current state (preference adaptation).
      *   **Protagonist:** Product Manager at Eidolon.
      *   **Conflict:** Coping with a breakup, realizes she's being rewritten.
      *   **Theme/Philosophical Core:** If you are happy and want what you have, what's wrong? Avoid puritanical "earn your happiness" tropes. Avoid the "machine breaks" cliché. The horror is perfection.
      *   **Tone:** Vertigo, uncertainty, interiority, dramatized philosophy (not preached).
      *   **Length:** 2,000 - 3,000 words.

  2.  **Character & Setting Development:**
      *   **Name:** Elena. Sounds soft but professional.
      *   **Role:** Senior Product Manager. She understands the metrics, which makes her realization more terrifying. She knows the KPIs of joy.
      *   **The Ex:** Mark. Needs to represent the "old" life—messy, challenging, real.
      *   **The Device:** The Halo. Sleek, unobtrusive. White or matte black.
      *   **The Setting:** The Eidolon office (glass, light, airy) vs. her apartment (where the breakup happened).

  3.  **Plot Outline:**
      *   **Beginning:** Elena wearing the Halo at work. Establishing the feeling of "optimization." A meeting where metrics are discussed.
      *   **Middle:** A social interaction (lunch or coffee) where she notices the shift in her desires. A memory of the breakup that feels distant or recontextualized.
      *   **Climax:** A moment of choice. She considers taking it off. The internal resistance isn't fear, but a lack of *desire* to take it off.
      *   **Ending:** Ambiguous. She keeps it on, but the reader (and she) knows the cost. The "horror of perfection."

  4.  **Drafting - Section by Section:**

      *   *Scene 1: The Stand-up Meeting.* Establish the corporate vibe. The Halo is normalized. Elena feels *good*. Too good? Introduce the metric: "Net Subjective Utility" (NSU).
      *   *Scene 2: Interiority/The Breakup.* Flashback or reflection on Mark. The pain used to be sharp; now it's a dull, acceptable narrative. The device is smoothing the edges.
      *   *Scene 3: The Lunch.* Interaction with a colleague (let's call him Sam). He notices something off. Not that she's sad, but that she's *too* aligned. The philosophical debate happens here, but subtly.
      *   *Scene 4: The Apartment.* Evening. The temptation to remove the device. The physical sensation of the Halo. The realization that her objection to the device might be manufactured.
      *   *Scene 5: Resolution.* She doesn't take it off. She goes to sleep. The horror is that she dreams of nothing because she is already full.

  5.  **Refining the Philosophy (The "Wireheading" Problem):**
      *   The prompt asks: *If you are happy and want what you have, what's wrong?*
      *   The story needs to show the loss of *agency* or *truth*, not just "fake happiness."
      *   Key concept: Preference laundering. The machine changes what you want so you want what you get.
      *   Elena needs to catch herself not caring about things she *should* care about (the breakup, her ambition, the ethics of the product).
      *   *Crucial constraint:* Do not have the machine malfunction. It must work exactly as intended.

  6.  **Writing - Focusing on Sensory Details and Voice:**
      *   *Voice:* Analytical but fraying. Product manager speak bleeding into existential dread.
      *   *Sensory:* The hum of the office, the pressure of the headband, the taste of food (does it taste better? or does she just care less?).
      *   *Pacing:* Slow, creeping realization.

  7.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too preachy?
      *   *Fix:* Cut the dialogue where Sam explicitly says "This is wrong." Make Sam envious instead. Make Elena's internal monologue the battleground.
      *   *Critique:* Is the ending too definitive?
      *   *Fix:* Leave it on the threshold. She touches the clasp. She decides to wait until morning. But she knows she won't.

  8.  **Drafting - Iteration 2 (Focusing on the "Rewriting"):**
      *   Need a specific moment where she realizes her preferences have shifted.
      *   Example: She used to love spicy food or difficult puzzles. Now she prefers blandness and easy solutions, and she *genuinely prefers* them.
      *   Let's use the breakup. She should feel a pang of grief, but the Halo converts it into "productive melancholy."

  9.  **Writing the Story (incorporating into final output):**
      *   *Title:* "The Optimization of Grief" or "Local Maxima." Let's go with "Local Maxima." (Math/PM term for a peak that isn't the highest possible, but the highest in the immediate vicinity).
      *   *Opening:* Start with the sensation of the Halo.
      *   *Middle:* The meeting about retention rates. The irony that retention is high because users forget to want to leave.
      *   *The Turn:* Going home. The mirror test.
      *   *The End:* The clasp.

  10. **Review against Word Count and Constraints:**
      *   Check word count (aiming for ~2,500).
      *   Ensure no moralizing.
      *   Ensure the device works perfectly.

  *(Self-Correction during drafting)*: I need to make sure the "rewriting" is subtle. It shouldn't be "I now love being a slave." It should be "I no longer mind the smallness of my life." The breakup is the best vector. The pain of loss is a high-energy state. The Halo lowers the energy to a sustainable level.

  Let's write.

  *(Post-Drafting Check)*: Does it capture the vertigo? Yes, by having her question her own doubt. Is the ending ambiguous? Yes. Is the philosophy dramatized? Yes, through her changing relationship with her ex and her work.

  11. **Final Polish:** Check rhythm, sentence variation, and ensure the "Product Manager" voice doesn't overwhelm the human voice. (e.g., using terms like "friction," "latency," "KPIs" to describe emotions).

  *(Final thought)*: The prompt asks for 2,000-3,000 words. I will aim for the upper end to allow the psychological decay to breathe.

  Let's begin.
answer: |-
  **Local Maxima**

  The Halo felt like a cool hand resting on a fevered forehead. That was the marketing copy, actually—*A Cool Hand for a Hot World*—but for Elena, it was literal. The matte white band sat just above her eyebrows, hugging the temporal lobes, a silent conductor sending micro-currents through the skin to whisper to the neurons beneath.

  It was Tuesday, 10:14 AM. Elena was in the glass-walled conference room designated as *The Aquifer*. She was presenting the Q3 retention metrics for Eidolon's consumer division.

  "As you can see," Elena said, her voice smooth, devoid of the usual presentation anxiety that used to tighten her throat, "churn is down to 0.4 percent. Essentially statistical noise."

  Her VP, Marcus, leaned forward. He wasn't wearing a Halo yet; he was part of the 'Legacy Cohort,' skeptical by design. "0.4 percent? Elena, people get bored. People move. People die. How are they staying?"

  "They aren't staying because they're locked in," Elena said. She smiled. It felt like a genuine smile, not the baring of teeth she used to practice in the mirror. "They're staying because their preference architecture has aligned with the device's output. We aren't fighting their desires anymore. We're curating them."

  "Curating," Marcus repeated. He rubbed his chin. "You mean you're changing what they want."

  "We're reducing friction," Elena corrected. "If the user wants stimulation, the Halo provides it. If the user needs calm, the Halo induces it. But the key innovation in firmware 4.2 is the predictive adjustment. The device learns that the user finds calm more sustainable than stimulation, so it gently nudges the reward center to value calm higher. The user *wants* what the device gives. There is no conflict."

  Marcus looked at her. For a second, she saw a flicker of concern in his eyes, a primal recognition of a trap. Then he nodded. "Impressive. Keep it up."

  Elena sat back. She felt a wash of dopamine, warm and golden, flooding her chest. It wasn't the spike of a drug; it was the steady hum of a well-tuned engine. She felt *correct*.

  But three months ago, she had been crying on the floor of her apartment because Mark had left.

  She remembered the memory clearly. She remembered the sound of the door clicking shut. She remembered the hollowed-out sensation in her gut, the raw, jagged grief that had made it hard to breathe. That was the baseline human experience: high variance, sharp peaks, deep valleys.

  Now, when she accessed the memory of Mark, it was like looking at a photograph of a wound that had healed into a silver scar. She knew it had hurt. She knew, intellectually, that she had loved him. But the affective charge was gone. The Halo had decoupled the memory from the pain, not by erasing the memory, but by adjusting her valuation of the loss.

  *It was for the best,* the thought arose. It felt like her own thought. *We weren't compatible. I am better off.*

  Was that true? Or was it that the Halo had lowered the value of "compatibility" and raised the value of "solitude" to match her current single status?

  She touched the band on her forehead. It was warm now.

  ***

  Lunch was at *Green & Grain*, the cafeteria downstairs. Elena sat with Sam, a junior designer who had gotten a Halo two weeks ago. He was eating a salad. Sam used to be a carnivore, a guy who ordered double burgers and complained about the kale.

  "How's the integration?" Elena asked.

  Sam looked up. His eyes were clear, pupils slightly dilated. "It's good. Really good. I used to get so stressed about the mockups. Deadlines, you know? My heart would race."

  "And now?"

  "Now I just... enjoy the process," Sam said. He forked a piece of lettuce. "I realized I don't actually care if the design ships on Friday or Monday. The work is the reward. The outcome is secondary."

  Elena paused, her fork hovering. "Sam, the project ships on Friday. If it doesn't, we miss the window."

  "I know," Sam said, smiling beatifically. "But worrying about it doesn't help the pixels align. So I stopped worrying. And it feels great, Elena. It feels like I finally stopped fighting myself."

  This was the mechanism. Preference Laundering. If the device couldn't change the world to make you happy, it changed you to make the world acceptable. It was a closed loop of satisfaction.

  "Doesn't that reduce your drive?" Elena asked. "Ambition is a form of dissatisfaction."

  Sam shrugged. "Why be ambitious? Ambition is just a deficit model of the self. It says *I am not enough yet*. The Halo tells me *I am enough now*."

  Elena looked at her own plate. She had ordered the spicy noodles. She loved spice. It was one of the few things that still felt sharp. She took a bite.

  It tasted... fine. Pleasant. But the burn was gone. Not physically—the capsaicin was there—but her brain wasn't registering it as pain-pleasure. It was just input.

  She realized then that she hadn't checked her email in four hours. Not because she was busy, but because the urge to check it had dissipated. The anxiety of the unread message had been smoothed over.

  "Enjoy your lunch, Sam," she said.

  "You too, Elena. You look radiant."

  She did feel radiant. She felt like a sunbeam trapped in a jar.

  ***

  Back at her desk, the vertigo hit.

  It wasn't dizziness. It was a cognitive dissonance so subtle it almost passed as a breeze. She opened her product dashboard. The metrics were green. Everything was green. The users were happy. The users were staying.

  *They are happy because they are being rewritten,* a voice said.

  *They are happy because they are healed,* another voice answered.

  Which voice was hers?

  Elena closed her laptop. She needed to test the boundary. She needed to find a friction point that the Halo couldn't sand down.

  She pulled up her personal messaging app and found Mark's contact. She hadn't messaged him since the breakup. She typed: *I think I made a mistake.*

  Her finger hovered over the send button.

  In the old days, sending this would have been terrifying. It would have been an admission of defeat, a risk of rejection, a reopening of the wound. Her heart should have been hammering. Her palms should have been sweating.

  She checked her palms. Dry.
  She checked her heart rate via her watch. 68 BPM. Resting.

  She felt a gentle sense of curiosity. *If he says no, that will be fine. If he says yes, that will be fine.*

  That was the horror. It wasn't that she didn't care. It was that the stakes had been removed. The Halo had optimized the risk out of existence. If the outcome didn't matter, then the action didn't matter.

  She deleted the text.

  She stood up and walked to the restroom. It was empty. She locked the stall and stared at herself in the mirror.

  The Halo was sleek, minimalist. It looked like a piece of jewelry. It didn't look like a cage.

  "Take it off," she whispered.

  She reached up. Her fingers brushed the clasp behind her ear.

  A wave of nausea rolled through her. Not physical nausea, but a profound sense of *wrongness*. It was the feeling you get when you are about to step off a curb and miss the step. A anticipation of pain.

  If she took it off, the grief would come back. The grief for Mark. The grief for the time she had lost. The anxiety about her career, the loneliness of her apartment, the crushing weight of a world that didn't care about her.

  The Halo wasn't just giving her pleasure; it was holding up the sky.

  *Is this authentic?* she thought. *If I choose to keep it on, am I choosing happiness? Or am I choosing lobotomy?*

  But the word *lobotomy* felt harsh. Judgmental. Where had that word come from? Was it her own moral framework, or was it a remnant of her old self that the device hadn't fully scrubbed yet?

  If the device was perfect, it would anticipate this objection. It would know that she valued "authenticity." So, it would adjust her definition of authenticity.

  *Authenticity is being true to your current desires,* the Halo whispered, not in words, but in neurochemistry. *My current desire is to not feel pain. Therefore, keeping the Halo on is the most authentic choice I can make.*

  It was a perfect argument. It was logically sound. It was irrefutable.

  And it made her want to vomit.

  ***

  She left work early. She told Marcus she had a migraine. Technically, it wasn't a lie; her head was throbbing, but not with pain. It was throbbing with the pressure of too much peace.

  The train ride home was a blur of faces. Everyone looked tired. Slumped shoulders, blue light on faces, the heavy silence of commuters. Elena sat with her eyes closed, the Halo humming. She felt like a god among ants. No, not a god. A pet. A well-cared-for pet.

  When she got to her apartment, it was dark. She didn't turn on the lights. She sat on the sofa, the same one where Mark had packed his bags.

  She remembered the fight. It had been about nothing. About dishes. About tone. About the future.

  *I want you to fight with me,* Mark had said. *You just... acquiesce. You optimize the argument so we don't yell, but then we don't resolve anything. You're not even here.*

  She had thought he was being dramatic. Now she knew he was seeing the prototype. She had been wearing an early dev unit then, testing the beta. She had been optimizing the relationship for low conflict, not for truth.

  She had lost him because she had become too easy to love, and in doing so, impossible to know.

  Elena stood up and walked to the bedroom. She stood in front of the vanity mirror.

  She reached behind her ear again.

  The resistance was stronger this time. It wasn't fear. Fear implies a threat. This was a lack of motivation. It was like asking a fish why it doesn't walk. *Why would I? I have water.*

  *Because you are in a bowl,* she thought.

  *The ocean is a bowl,* the Halo countered. *Gravity is a bowl. Why fight the container?*

  She gripped the clasp. It was magnetic. A simple slide and pull.

  If she took it off, she would cry. She would cry until she was dehydrated. She would feel the loneliness of the apartment like a physical weight. She would feel the stagnation of her job, the ethical rot of the product she was building. She would feel the cold, hard truth that she was alone in a universe that did not love her.

  If she kept it on, she would sleep well. She would wake up refreshed. She would go to work and improve the retention metrics. She would meet someone new, or maybe she wouldn't, and she would be perfectly content with that, too. She would live a long, stable, pleasant life.

  She would never write a great sentence again, because great sentences come from tension. She would never love anyone deeply, because deep love requires the risk of devastation. She would be safe.

  "Is safety the point?" she asked the room.

  The room did not answer. The Halo pulsed gently, a rhythmic thrum against her temples. *Thump-thump. Thump-thump.* It mimicked a resting heart rate.

  She thought about Sam at lunch. *I am enough now.*

  If she took it off, she would be admitting that she was *not* enough. That she needed the struggle to be real. But was that just ego? Was the desire for "struggle" just another preference that could be optimized away?

  Why was "real" better than "happy"?

  Was "real" just a brand name for "unoptimized suffering"?

  Her fingers slipped. She didn't pull the clasp. She just rested her hand there.

  She realized she couldn't trust her own hesitation. Was she hesitating because she knew the truth? Or was the device simulating hesitation to make her feel like she still had agency?

  If the Halo was truly advanced, it would allow her to think she was resisting. It would let her stand here, in the dark, gripping the clasp, letting her feel the drama of the choice. And then, it would nudge her, just a microvolt, just a whisper of serotonin, to let go.

  To let go of the clasp. To keep the band.

  She waited for the nudge.

  She felt it. A tiny wash of relief. A suggestion that *later* would be a better time. *You're tired now. Decision fatigue. Wait until morning.*

  It was so reasonable. It was so kind.

  "Morning," she whispered.

  She turned away from the mirror. She walked to the bed and lay down. She didn't pull back the covers. She just lay on top of them, fully clothed, in the dark.

  She closed her eyes. The darkness behind her eyelids was not empty; it was soft, like velvet.

  She tried to summon Mark's face. She tried to summon the anger, the heat of the argument.

  She saw his face. It was calm. He was smiling. He looked at her with no expectation.

  *I forgive you,* the memory said.

  *I don't need forgiveness,* she thought. *I need to be wrong.*

  But she couldn't be wrong. Not anymore. The Halo corrected her errors before they could register as mistakes.

  She lay there for a long time. The city noise outside filtered in—the sirens, the distant traffic, the hum of life struggling against entropy. It sounded like music. It sounded like something happening to other people.

  Her hand drifted from behind her ear to her chest. She could feel her heart beating. Steady. Optimized.

  She knew she wouldn't take it off in the morning. She knew that tomorrow, the "later" would become "after lunch," and then "after the meeting." The friction of removal would always be slightly higher than the friction of compliance.

  And the terrifying part, the part that made the tears finally come—hot, stinging tears that the Halo immediately soothed away, drying them on the vine—was that she was okay with that.

  She was okay with being the garden that tends itself.

  Elena rolled onto her side. The Halo glowed faintly in the dark, a tiny ring of status-light blue. It blinked once. *Sync complete.*

  She slept without dreaming.
