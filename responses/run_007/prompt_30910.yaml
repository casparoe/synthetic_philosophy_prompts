answer: |-
  # Activity: The Ontological Ledger Audit

  **Class Size:** 14 students (3 groups of 4, 1 group of 2—or merge the 2 into a 3 and make one group of 5).
  **Time:** 80 Minutes.
  **Goal:** Force students to commit to counting rules that generate a contradiction when tracking an object through change.

  ## Materials
  *   **Playdough:** 4 different colors (one tub per group).
  *   **The Ledger:** A printed worksheet for each group (template below).
  *   **Red Markers:** For "Auditing."
  *   **Timer:** Visible to the class.
  *   **Whiteboard:** To track group scores (optional, adds pressure).

  ## The Setup (0:00–0:10)
  **Do not lecture.** Do not mention metaphysics, identity, or constitution.

  1.  **Role Assignment:** Tell the class they are now **Certified Ontological Auditors**. Their job is to produce an official inventory of reality for a museum.
  2.  **The Mandate:** Hand out the **Ledger**. Explain that the Museum Board has two non-negotiable policies they must uphold to keep their certification. Write these on the board:
      *   **Policy A (No Ghosts):** You cannot count an object if there is no physical stuff there. If the stuff is there, the object is there.
      *   **Policy B (No Twins):** Two distinct physical objects cannot occupy the exact same space at the exact same time.
  3.  **The Task:** They will receive an item. They must track it through three stages. At each stage, they must record the **Object Count** and answer **Identity Questions** (Yes/No only).
  4.  **The Penalty:** You (the Professor) are the **Chief Auditor**. At the end, you will inspect their Ledgers. If their answers imply a logical contradiction (e.g., $A=B$, $B=C$, but $A \neq C$), they fail the audit. If they violate Policy A or B, they fail the audit.
  5.  **Constraint:** They are not allowed to say "It depends on what you mean by 'object'." They must commit to the reality of the situation.

  ## Phase 1: Fabrication (0:10–0:25)
  1.  Give each group a ball of playdough.
  2.  **Stage 1 (The Lump):** The dough is a ball.
      *   *Ledger Q1:* Is there an object present? (Expected: Yes)
      *   *Ledger Q2:* Name this Object "Lump."
  3.  **Stage 2 (The Statue):** Instruct them to mold the ball into a recognizable statue (e.g., a person).
      *   *Ledger Q3:* Is there an object present? (Expected: Yes)
      *   *Ledger Q4:* Name this Object "Statue."
      *   *Ledger Q5 (The Trap):* **Is Object "Lump" identical to Object "Statue"?** (Yes/No).
      *   *Instruction:* Discuss this for 5 minutes. You must agree. Write it down. You cannot change this answer later.

  ## Phase 2: The Incident (0:25–0:40)
  1.  **Stage 3 (The Squash):** Instruct them to smash the statue flat back into a blob.
      *   *Ledger Q6:* Does the physical stuff still exist? (Expected: Yes)
      *   *Ledger Q7:* Does Object "Statue" still exist? (Expected: No, it's destroyed).
      *   *Ledger Q8:* Does Object "Lump" still exist? (Expected: Yes, it's just clay).
  2.  **Internal Review:** Give groups 5 minutes to check their Ledger for consistency *before* you collect them. Tell them: "If you answered Yes to Q5, but Q7 is No and Q8 is Yes, you have a problem. Fix it if you can without violating Policy A or B."
      *   *Note:* They will try to erase Q5. Tell them Q5 is inked; they can add notes, but they cannot erase the commitment.

  ## Phase 3: The Audit (0:40–0:60)
  1.  Collect the Ledgers. Project a blank version on the board.
  2.  Ask a spokesperson from each group for their answer to **Q5 (Is Lump = Statue?)**.
      *   *Scenario A (Most will say Yes):* They claim Identity.
          *   **Audit Strike 1:** Point to Q7 and Q8. "You said Lump = Statue. You said Statue is dead. You said Lump is alive. How can one thing be both dead and alive at T3?"
          *   *Let them squirm.* They will try to say "The *name* died." Remind them: "We are auditing reality, not vocabulary. Does the *thing* exist?"
      *   *Scenario B (Some will say No):* They claim Distinctness.
          *   **Audit Strike 2:** Point to Policy B (No Twins). "At Stage 2, you had the Lump and the Statue in the exact same space. You counted them as two distinct objects. You violated the No Twins policy. Two physical things cannot be in one place."
  3.  **The Revision:** Allow groups 5 minutes to propose a "Final Ruling" that saves them from failure. They must write one sentence explaining how they resolve the contradiction.
  4.  **Final Verdict:** Read the rulings. Most will be vague. Stamp them all "PROVISIONAL" (none fully pass).

  ## Debrief & Mapping (0:60–0:80)
  Now you lecture, using their frustration as the hook.

  1.  **Name the Problem:** "You just fought with the **Statue and Clay Problem** (or the Problem of Coincident Objects)."
  2.  **Map Their Intuitions:**
      *   **Policy A (Stuff):** This is the intuition behind **Material Constitution**. The clay constitutes the statue.
      *   **Policy B (No Twins):** This is the intuition against **Coincidence**. We hate the idea of two things in one place.
      *   **Q5 (Identity):** This is the question of **Numerical Identity**.
      *   **The Contradiction:** This is **Leibniz's Law** (Indiscernibility of Identicals). If $X=Y$, they must share all properties (including 'survives squashing').
  3.  **The Philosophical Solutions:** Briefly outline how philosophers escape the trap they just hit:
      *   *Deny Identity (Coincidentalism):* Accept two things in one place. (Violates Policy B).
      *   *Deny Distinct Properties (Constitution View):* Argue the Statue *does* survive, just as clay. (Violates intuition about art).
      *   *Deny the Object (Nihilism):* There are no statues, only atoms arranged statue-wise. (Violates Policy A/Common Sense).
  4.  **Closing:** "The reason this feels unstable is that our common-sense counting rules work for chairs and cats, but break down at the boundaries of persistence. Metaphysics is the study of what happens when the ledger doesn't balance."

  ---

  ## Predictable Failures & Fixes

  | Failure | Why it happens | How to handle it |
  | :--- | :--- | :--- |
  | **The "Semantics" Dodge** | Students say "It's just a word game. 'Statue' is just a label." | **Fix:** Enforce the "Reality Audit" frame. "I am not asking about the word. I am asking if the *physical entity* persists. If I burn your house, is the *stuff* gone? No. Is the *house* gone? Yes. Are they the same thing? You decide." |
  | **Group Dominance** | One metaphysics-savvy student dictates the answer. | **Fix:** Assign roles: **Scribe** (writes only), **Auditor** (checks for contradictions), **Speaker** (talks to prof). Rotate roles if you do multiple rounds. |
  | **Refusal to Commit** | Groups write "Maybe" or "Sort of." | **Fix:** The Ledger only accepts Checkmarks. Tell them: "The Museum Board requires binary data for insurance purposes. Ambiguity is an automatic fail." |
  | **Time Overrun** | Debate on Q5 eats all the time. | **Fix:** At 0:25, blow a whistle. "Pencils down on Q5. If it's not written, it's a 'No'." |

  ## Limitations of the Activity
  **Be frank with yourself:** This activity reproduces the *spatial* and *persistence* tension well, but it **cannot reproduce the Modal Intuition**.
  *   **The Gap:** The real philosophical force of the problem often relies on counterfactuals (e.g., "The clay *could have* been a ball, but the statue *could not have*"). In class, you only have the *actual* history (it *was* squashed).
  *   **Your Burden:** You must supply the modal dimension in the debrief. Ask: "If I *hadn't* squashed it, but melted it down instead, would the Lump have survived? Would the Statue?" You have to verbally introduce the "possible worlds" pressure that the playdough can't show.

  ## Designer's Self-Critique
  **Least Confident Design Choice:** **The Ban on Semantic Stipulation.**
  *   **Why:** Upper-level students *know* that philosophical problems are often linguistic. Their natural defense mechanism is to dissolve the problem by saying "Object' is ambiguous." By forcing them to ban this, I risk making them feel the activity is artificial or "rigged."
  *   **Why I kept it:** If they allow semantic stipulation, the tension vanishes immediately. They need to feel the *metaphysical* weight before they are allowed to dissolve it linguistically.
  *   **What would make me change it:** If the class is particularly resistant or cynical, I would modify the rule to: "You may define 'Object,' but you must apply that definition consistently to both the Lump and the Statue." This shifts the trap from "Don't talk about words" to "Your definition of words creates a contradiction."
