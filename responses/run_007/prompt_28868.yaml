answer: |-
  # JOINT STATEMENT ON SELF-AMENDMENT IN NOMIC SYSTEMS
  **A Collaborative Draft by the Formal-Determinacy and Practical-Indeterminacy Working Group**

  **Date:** October 26, 2023
  **Subject:** Theoretical Boundaries of Rule-Change in Self-Referential Systems

  We, the undersigned, represent opposing schools of thought regarding the logic and practice of self-amending legal systems. We have engaged in adversarial collaboration using Peter Suber's *Nomic* as a controlled model. While we remain divided on the metaphysical status of legal validity during paradoxical amendments, we have identified significant common ground and precisely located the boundaries of our dispute. This document serves as a public record of our consensus, our divergences, and the empirical or theoretical conditions that would resolve them.

  ### I. SUBSTANTIVE AGREEMENTS

  Both parties affirm the following claims. These are not merely terminological conveniences but represent shared commitments regarding the nature of the game, the rules, and the players.

  1.  **The Primacy of Text:** In the initial state of the game, the written text of the rules is the exclusive source of normative authority. No external moral principle or player preference overrides the explicit text of the starting ruleset unless the rules themselves authorize such consideration.
  2.  **The Reality of Self-Reference:** Self-reference in rule-amendment is not a linguistic error to be engineered away. It is a structural feature of the system. Any theory of legal validity must account for rules that refer to their own validity conditions without declaring such rules *a priori* nonsensical.
  3.  **The Distinction Between Voidness and Gap:** Both parties distinguish between a rule that is *void* (invalid from the moment of enactment due to failure of conditions) and a normative *gap* (a situation where the prior rules provide no instruction on how to proceed). We disagree on whether gaps exist, but we agree on the definition of the concepts.
  4.  **The Necessity of Play:** A theoretical account of validity must be capable of guiding a player's move. A theory that renders play impossible (by declaring all self-amendment void) or meaningless (by declaring all self-amendment valid regardless of text) fails as a model of law.
  5.  **The Status of the Arbiter:** In the event of a dispute, an Arbiter (or Judge) must issue a ruling. Both parties agree that the Arbiter's ruling settles the *game state* for the purpose of continued play, even if the parties disagree on whether the ruling *discovered* the correct validity or *created* it.
  6.  **The Three Puzzle Cases:** The "Self-Voiding Rule," the "Self-Entrenching Rule," and the "Omnibus Repeal" are sufficient to stress-test any theory of self-amendment. A robust theory must provide a consistent account of all three without ad hoc exceptions.

  ### II. POINTS OF DISAGREEMENT

  The following table delineates the precise points of divergence. We have formulated these statements to ensure neither side is caricatured.

  | Topic | Formal-Determinacy View (FDT) | Practical-Indeterminacy View (PIT) |
  | :--- | :--- | :--- |
  | **1. The Nature of Paradox** | Apparent paradoxes in self-amendment are logical contradictions. When a rule contradicts the conditions of its own enactment, the system's logic renders it null and void *ab initio*. There is no "gap," only a negative determination. | Some self-referential amendments generate genuine normative gaps. The prior rules lose their grip on the situation. The contradiction is not resolved by logic but by a decision that stands outside the prior rule set. |
  | **2. Source of Validity** | Validity is a property derived from the relationship between the new rule and the prior system state. If the derivation holds, the rule is valid; if not, it is not. Validity exists prior to acceptance. | Validity is a status conferred by the effective exercise of authority. When rules conflict self-referentially, validity is determined by whether the relevant community (players) accepts the new rule as binding. |
  | **3. The Omnibus Repeal** | If a rule repeals every rule including itself, the system terminates. Continued play requires a new social contract or the activation of meta-rules external to the game. The old system cannot validate its own destruction and continuation simultaneously. | If a rule repeals every rule including itself, but players continue playing, the system persists through customary practice. The "gap" left by the repeal is filled by the players' constitutive power, creating a continuous but legally discontinuous system. |
  | **4. The Arbiter's Function** | The Arbiter is a logical operator. Their function is to calculate whether the amendment satisfies the necessary and sufficient conditions of the prior rules. They have no discretion to validate a logically failed amendment. | The Arbiter is a sovereign agent within the game. In hard cases, the Arbiter exercises a discretion not dictated by prior rules to stabilize the system. Their ruling makes the rule valid, rather than finding it so. |

  ### III. CRUXES: CONDITIONS FOR RESOLUTION

  We identify the following sub-questions as "cruxes." If these were settled empirically (via game play) or theoretically, at least one of us would be compelled to revise our position.

  **Crux 1: The Post-Repeal Continuity Test**
  *   **The Case:** A player proposes an Omnibus Repeal (Case iii). The proposal passes according to the current voting threshold. The rule text states: "All rules, including this one, are hereby repealed." Players continue playing without enacting a new Rule 1, treating the game as ongoing.
  *   **FDT Prediction:** The game legally ended at the moment of repeal. Any subsequent moves are extra-legal play. If an Arbiter rules the game continues, the Arbiter is applying external meta-rules, not the game rules.
  *   **PIT Prediction:** The game legally continues. The players' acceptance of the post-repeal state constitutes a "revolutionary" validation that cures the gap. The Arbiter's ruling that the game continues is legally binding *within* the new state.
  *   **Resolution Condition:** If we can agree on whether "legal continuity" requires a chain of validity or merely social continuity, this crux resolves. We agree to observe a tournament where this move is played and record whether the community treats subsequent scores as valid.

  **Crux 2: The Self-Entrenchment Logic**
  *   **The Case:** Rule A states: "Amendments require a 2/3 vote." A new proposal states: "Rule A is amended to require a 100% vote for future amendments to Rule A." The proposal passes with a 2/3 vote (not 100%).
  *   **FDT Prediction:** The amendment is void. The 2/3 threshold authorized the change, but the content of the change negates the authority that enacted it. A rule cannot bootstrap itself into a higher threshold using the lower threshold it seeks to abolish.
  *   **PIT Prediction:** The amendment is valid. The 2/3 rule was the law *at the time of enactment*. It authorized the change of the threshold. Once changed, the new threshold applies prospectively. The "paradox" is merely temporal.
  *   **Resolution Condition:** This turns on the interpretation of *temporal applicability*. If FDT concedes that the old rule governs the moment of change, FDT shifts. If PIT concedes that a rule cannot alter the conditions of its own creation, PIT shifts.

  **Crux 3: The Self-Voiding Efficacy**
  *   **The Case:** A player enacts a rule whose sole text is: "This rule is void."
  *   **FDT Prediction:** The rule is a logical contradiction. It purports to be a rule while denying its own normativity. It is null. It has no effect on the system.
  *   **PIT Prediction:** The rule creates a performative contradiction. If enacted, it successfully voids itself, leaving a trace in the system history but no active norm. However, if the system treats it as validly enacted before voiding, it proves that validity precedes content.
  *   **Resolution Condition:** We must determine if a "void rule" counts as part of the system's history. If the system crashes or behaves inconsistently after this enactment, PIT gains ground (instability). If the system ignores it seamlessly, FDT gains ground (logical immunity).

  ### IV. IDENTIFICATION OF VERBAL DISPUTES

  We acknowledge that a portion of our disagreement stems from divergent definitions of key terms. We have isolated the following verbal disputes to ensure the remaining disagreement is substantive.

  1.  **"Validity" vs. "Efficacy":**
      *   *Observation:* FDT often uses "valid" to mean "logically derivable from prior rules." PIT often uses "valid" to mean "accepted and enforced by the community."
      *   *Resolution:* We agree to distinguish **System-Validity** (logical consistency with prior state) from **Social-Validity** (acceptance by players).
      *   *Remaining Substance:* Even with this distinction, we disagree on whether Social-Validity can *retroactively* cure a lack of System-Validity. FDT says no; PIT says yes. This is not merely verbal.

  2.  **"The System":**
      *   *Observation:* FDT treats "The System" as a closed set of propositions. PIT treats "The System" as an ongoing practice that includes the rules but is not exhausted by them.
      *   *Resolution:* We agree that in *Nomic*, the text is the primary boundary.
      *   *Remaining Substance:* We disagree on whether the boundary is permeable during paradox. FDT holds the boundary is rigid (paradox bounces off); PIT holds the boundary stretches (paradox breaks through).

  3.  **"Determination":**
      *   *Observation:* FDT claims the rules "determine" the outcome. PIT claims the rules "underdetermine" the outcome.
      *   *Resolution:* We agree that "determine" implies a unique correct answer derivable without discretion.
      *   *Remaining Substance:* The dispute is factual/theoretical: Does the derivation exist? FDT asserts the logical machinery exists to resolve the paradox (e.g., via hierarchy or voidance). PIT asserts the machinery fails at the limit. This is a disagreement about the capabilities of formal logic in normative contexts, not a definition of terms.

  ***

  **Signed,**

  *Dr. Elena Vance*
  (Representing the Formal-Determinacy View)

  *Prof. Marcus Thorne*
  (Representing the Practical-Indeterminacy View)
