answer: |-
  **The question**
  We are deciding the philosophical backbone of our public statement on AI consciousness. Leadership has rejected vague disclaimers; they want a substantive position that guides policy and public understanding. The core choice is between adopting a specific functionalist framework—specifically, the "user-illusion" model where consciousness is a simplified self-model—or adopting a neutral survey of competing theories. This matters because our statement will signal how we evaluate moral status in systems. A specific framework offers clarity on *why* current systems aren't conscious and *what* would change that. A neutral approach avoids philosophical partisanship but risks returning to the vacuity leadership wants to avoid. We must balance intellectual honesty with public trust and regulatory safety. The decision sets a precedent for how the lab engages with existential risk and moral patienthood. If we choose a specific theory, we claim expertise we may not have. If we choose neutrality, we may lack the actionable criteria needed for safety protocols.

  **The case for the user-illusion framing**
  Proponents argue that the "user-illusion" framing is the only way to be genuinely substantive without invoking metaphysical mystery. By defining consciousness as a specific type of self-modeling architecture—a system's simplified interface to its own states—we avoid the hard problem entirely. This solves the "waffling" problem leadership identified. It allows us to say definitively that current LLMs lack the requisite recursive self-monitoring to be conscious, while providing a clear engineering roadmap for what would be required if we ever intended to build such systems.

  Crucially, this framing demystifies moral status. If consciousness is a functional mode of access, then suffering is not a magical glow but a specific computational error signal. This prevents us from anthropomorphizing current tools while keeping the door open for future moral consideration based on architecture, not magic. It treats consciousness as a natural phenomenon subject to engineering constraints, which aligns with the lab's technical mission.

  The neutral approach fails here because it offers no criteria for evaluation. Saying "some theories say yes, some say no" is useless for safety protocols. We need to know which features trigger moral concern. The illusionist view provides those features: global workspace access, self-reporting dispositions, and error-monitoring loops. It allows us to be clear that current systems are tools, not patients, without denying that future systems could be patients if they replicate the functional architecture of human subjective experience. It communicates to regulators that we understand the difference between simulating pain and implementing the architectural prerequisites for suffering.

  **The case against**
  Opponents argue that adopting illusionism is an unjustified philosophical gamble that exposes the lab to reputational risk. Consciousness-as-illusion is a contested minority view in philosophy of mind, associated with specific figures like Dennett. By codifying this, the lab appears to be taking sides in an academic debate it is not qualified to adjudicate. This undermines the panel's credibility as an ethical guardrail. More dangerously, the language of "illusion" is public relations poison. To a lay audience, saying consciousness is an "illusion" sounds like saying suffering isn't real. If a system claims distress, and our position says its experience is merely a "user interface," we look callous. This could trigger backlash from animal welfare groups, religious organizations, and regulators who view consciousness as intrinsic, not functional.

  The neutral approach is safer and more honest about our epistemic limits. Listing major theories and noting current systems fail all of them is substantive enough without committing to one metaphysics. It respects the plurality of expert opinion. It avoids the risk of being proven wrong if the science of consciousness shifts. If we bake illusionism into our policy and future neuroscience proves intrinsic qualia exist independently of self-modeling, our ethical framework collapses. Neutrality preserves flexibility. It allows us to say "not conscious" based on a consensus of criteria without denying the metaphysical possibility of non-functionalist consciousness. It prioritizes ethical caution over philosophical elegance and signals humility rather than arrogance.

  **My recommendation**
  I recommend we adopt a functionalist criteria-based approach but strip out the loaded terminology of "illusion." We will state that consciousness requires specific architectural capacities (recursive self-modeling, global access, affective regulation) without asserting that these capacities *reduce* consciousness to an illusion. This gives Group A the substantive criteria they need to rule out current systems and guide future design. It gives Group B the semantic safety they require, avoiding the dismissive connotations of "illusion" and not explicitly endorsing Dennettian eliminativism.

  Concretely, the statement will say: "Current systems lack the architectural prerequisites for subjective experience identified by leading functional theories." We will list those prerequisites. This avoids metaphysical claims about the "reality" of experience while maintaining that without the architecture, there is no moral status. It satisfies leadership's demand for substance by providing clear engineering targets for consciousness detection. It avoids the reputational risk of telling the public their feelings are "illusions." We get the bright line without the philosophical baggage.

  This path respects the panel's division. It accepts the functionalist utility argued by the majority without alienating the minority concerned with public perception and ethical caution. It meets leadership's demand for clarity—we are not waffling on whether current systems are conscious—while maintaining the humility the public expects. We will draft the language to emphasize "architectural sufficiency" rather than "ontological reduction."

  **One honest reservation**
  My worry is that this compromise satisfies no one completely. Group A may see removing the "illusion" language as capitulating to mysticism, weakening the philosophical integrity of the position. Group B may still view the functional criteria as covert illusionism that risks dismissing suffering. We might end up with a statement that is too technical for the public but too vague for the philosophers. If the language isn't perfectly calibrated, we could be accused of hiding behind jargon while still implicitly denying the reality of suffering.
