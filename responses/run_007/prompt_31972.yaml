answer: |-
  ### Part I: Conceptual Clarifications & Preliminary Distinctions

  Before drafting the joint statement, it is necessary to isolate the specific points of friction where the Suppositionalist and Propositionalist have been talking past one another. The following distinctions are proposed as the framework for the collaboration.

  **1. The Scope of Lewis's Triviality Results**
  *   **Misunderstanding:** The Propositionalist often implies Lewis proved conditionals *cannot* be propositions. The Suppositionalist often implies Lewis proved nothing relevant because she never claimed they were propositions.
  *   **Clarification:** Lewis (1976) proved that there is no Boolean algebra of propositions containing the conditional $A \to C$ such that for *all* probability functions $P$ in the algebra, $P(A \to C) = P(C|A)$ (Adams' Thesis), unless the algebra is trivial (containing only probabilities 0 and 1).
  *   **Agreed Interpretation:** The result forces a choice: either reject that conditionals express propositions in the algebra, or reject that Adams' Thesis holds for *all* admissible probability functions (e.g., by restricting the context or the class of functions).

  **2. Truth Conditions vs. Assertability Conditions**
  *   **Misunderstanding:** The Propositionalist assumes that if a sentence is meaningful and embeddable, it must have classical truth conditions. The Suppositionalist assumes that if a sentence lacks classical truth conditions, it cannot embed logically.
  *   **Clarification:** We must distinguish the *semantic content* (what is expressed) from the *norm of assertion* (when it is appropriate to utter).
  *   **Agreed Interpretation:** Both sides agree conditionals have *assertability conditions*. The dispute is whether these assertability conditions are *derived* from truth conditions (Propositionalist) or whether they are *sui generis* and exhaust the semantic content (Suppositionalist).

  **3. Simple vs. Embedded Occurrences**
  *   **Misunderstanding:** The Propositionalist cites embeddings ("If A, then C" inside a negation) as proof of propositional status. The Suppositionalist cites them as idioms or distinct speech acts.
  *   **Clarification:** We must distinguish the semantics of the *main clause* conditional from conditionals appearing in the *scope* of operators.
  *   **Agreed Interpretation:** The data regarding embeddings is contested. We agree on the *syntax* (they appear under negation/disjunction) but disagree on whether the *semantic contribution* in those contexts is truth-functional/Boolean.

  **4. The Ramsey Test**
  *   **Misunderstanding:** Both invoke Ramsey, but for different ends.
  *   **Clarification:** Ramsey suggested that to evaluate "If A, C," one adds A to one's stock of knowledge and argues for C.
  *   **Agreed Interpretation:** Both agree this describes the *psychological process* of evaluation. The Propositionalist views this as a heuristic for finding the truth condition (the closest A-world). The Suppositionalist views this as the definition of conditional belief, with no reference to truth conditions.

  ***

  ### Part II: Joint Statement of Adversarial Collaboration

  **Title:** On the Semantics and Probability of Indicative Conditionals: A Statement of Common Ground and Remaining Disagreement
  **Signatories:** The Suppositionalist, The Propositionalist
  **Date:** October 26, 2023

  #### 1. Claims of Common Ground
  *We, the undersigned, agree to the following claims as the baseline for our continued inquiry. We affirm that these claims are stated precisely enough to avoid previous equivocations.*

  1.  **The Probability Constraint (Adams' Thesis):** For simple, unembedded indicative conditionals ("If A, C"), the degree of belief a rational agent assigns to the conditional is, in standard contexts, equal to the conditional probability of the consequent given the antecedent. Formally: $P(\text{If } A, C) = P(C|A)$, provided $P(A) > 0$.
  2.  **The Triviality Result:** We agree on the formal mathematical result proven by David Lewis (1976): If conditionals are treated as propositions within a standard Boolean algebra of events, and if Adams' Thesis holds for *all* probability functions defined over that algebra, then the algebra is trivial (agents can only hold credences of 0 or 1).
  3.  **Implications of Triviality:** We agree that Lewis's result does not prove conditionals lack truth conditions *simpliciter*. It proves that **Propositionalism** and **Universal Adams' Thesis** are incompatible. One must be modified or rejected.
  4.  **Linguistic Data:** We agree that speakers of natural language:
      *   Assign probabilities to indicative conditionals.
      *   Update these probabilities upon learning new information (conditionalization).
      *   Occasionally embed conditionals under negation, disjunction, and propositional attitude verbs (e.g., "I believe that if A, C").
  5.  **The Ramsey Test:** We agree that the Ramsey Test accurately describes the *epistemic procedure* speakers use to evaluate simple conditionals. We disagree only on what this procedure reveals (truth conditions vs. conditional credence).
  6.  **Non-Vacuity:** We agree that indicative conditionals with false antecedents are not automatically "true" in the material sense. Our dispute concerns whether they have *any* truth value, not whether they match the material conditional.

  #### 2. Map of Remaining Disagreements
  *The following table isolates the precise points of divergence. Each position is phrased charitably to ensure the holder can endorse the description.*

  | Domain | The Suppositionalist Position | The Propositionalist Position |
  | :--- | :--- | :--- |
  | **Metaphysics of Content** | Indicative conditionals do not express propositions. They have no truth conditions. They are linguistic devices for expressing conditional degrees of belief. | Indicative conditionals express propositions. They have truth conditions (e.g., determined by a selection function or possible worlds semantics). |
  | **Source of Probability** | The probability of a conditional is *sui generis*. It is not derived from the probability of a truth condition. $P(\text{If } A, C)$ is primitive. | The probability of a conditional is derived from its truth conditions via the standard Law of Total Probability. $P(\text{If } A, C)$ is the measure of the set of worlds where the conditional is true. |
  | **Embeddings** | Apparent embeddings (e.g., "Not (If A, C)") are either pragmatic constructions, distinct semantic operators, or express higher-order attitudes about conditional credence. They do not prove Boolean structure. | Embeddings are semantic evidence. If a sentence can be negated or disjoined, it contributes a proposition to the logical form. "Not (If A, C)" denies the truth of the conditional proposition. |
  | **Response to Triviality** | **Accept the Result:** Since conditionals aren't propositions, they aren't in the algebra. Lewis's result is avoided by denying the antecedent of his conditional. | **Restrict the Scope:** Conditionals are propositions, but Adams' Thesis does not hold for *all* probability functions. Context restricts the admissible functions, or the logic is non-Boolean, avoiding triviality. |
  | **False Antecedents** | When the antecedent is known to be false, the conditional is "void." It is neither true nor false; the question of truth does not arise. | When the antecedent is false, the conditional still has a truth value (determined by the closest antecedent-worlds), even if that value is epistemically inaccessible. |

  #### 3. Cruxes and Test Cases
  *We identify the following three "Cruxes" as the sub-questions most likely to resolve or dissolve our disagreement. For each, we propose a concrete test case or argument. We record our current predictions to allow for future updating.*

  **Crux 1: The Semantics of Negation**
  *   **Question:** Does the negation of a conditional ("It is not the case that if A, C") function as a truth-functional operator on a proposition, or does it express a distinct attitude (e.g., "If A, not C" or "I deny the conditional credence")?
  *   **Test Case:** Consider the sentence: *"It is not the case that if the butler did it, he used the candlestick."*
      *   **Scenario:** We know the butler did it. We are unsure about the weapon.
      *   **Suppositionalist Prediction:** This utterance is semantically awkward or elliptical for "If the butler did it, he did *not* use the candlestick." It expresses a high conditional credence in ~C given A. It is not a negation of a truth-bearer.
      *   **Propositionalist Prediction:** This utterance asserts that the proposition expressed by "If the butler did it, he used the candlestick" is false. In a possible worlds framework, this means in the closest worlds where the butler did it, he did not use the candlestick.
      *   **Adjudication Criterion:** If speakers accept this negation as equivalent to the conditional negation ("If A, not C") in all contexts, it favors Suppositionalism. If speakers distinguish "Not (If A, C)" from "If A, not C" (e.g., allowing for truth-value gaps), it favors Propositionalism.

  **Crux 2: The Betting Behavior**
  *   **Question:** Do speakers treat conditionals as bets that are called off (void) when the antecedent is false, or as bets that are won/lost based on truth conditions?
  *   **Test Case:** A bet is offered on: *"If the coin lands Heads, it will show 1752."* (Assume a standard coin with no date).
      *   **Scenario:** The coin lands Tails.
      *   **Suppositionalist Prediction:** Rational agents treat the bet as "off" or void. No money changes hands. The conditional was not false; it was inapplicable.
      *   **Propositionalist Prediction:** Depending on the theory, the bet might be "won" (vacuously) or "lost" (if the closest Heads-worlds don't show 1752). However, most Propositionalists predict agents will treat it as void *pragmatically*, but insist the *semantic* truth value exists.
      *   **Adjudication Criterion:** If agents insist the bet is void *because the sentence lacks a truth value*, Suppositionalism is supported. If agents admit it has a truth value but the bet is void due to conversational norms, Propositionalism is supported. We will survey intuitions on whether "voidness" feels semantic or pragmatic.

  **Crux 3: Triviality and Context Shift**
  *   **Question:** Can Propositionalism save Adams' Thesis by appealing to context-sensitive probability spaces without losing explanatory power?
  *   **Test Case:** *McGee's Counterexamples to Modus Ponens* (e.g., "If a Republican wins, then if Reagan doesn't win, Anderson will win").
      *   **Scenario:** High credence in Republican win; high credence that if Reagan doesn't win, Anderson will. Low credence in "If Reagan doesn't win, Anderson will" *simpliciter* if we condition on Democrat win.
      *   **Suppositionalist Prediction:** This shows that conditional probabilities do not behave like probabilities of propositions. The probability of the nested conditional shifts with context. This confirms conditionals are not stable propositions.
      *   **Propositionalist Prediction:** This shows that the *context* (and thus the selection function or probability space) shifts when we evaluate the nested conditional. The proposition expressed changes, preserving Propositionalism.
      *   **Adjudication Criterion:** If the context shift required to save Propositionalism becomes so radical that the proposition expressed by "If A, C" is unrecognizable between premise and conclusion, Suppositionalism is favored. If the shift can be modeled systematically within a possible worlds framework, Propositionalism is favored.

  #### 4. Commitment to Future Inquiry
  *We agree that the resolution of these cruxes requires further work in experimental semantics (to test the linguistic data in Crux 1 & 2) and formal epistemology (to test the viability of context-shift models in Crux 3). We commit to updating our positions based on the outcome of these specific tests, rather than general theoretical preference.*

