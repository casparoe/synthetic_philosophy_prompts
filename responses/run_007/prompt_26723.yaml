  *   **Option B: Embrace Animalism (Revise Case 1 & 2).**
      *   Hold that you are essentially a human organism. In Case 1 (Teletransporter), you die, and a replica is created. In Case 2, you survive on Earth, and a replica is on Mars. In Case 5, you survive (as you currently think). In Case 4, you die (as the organism is divided).
      *   *Why:* This restores the transitivity of identity. You are one organism, one person.
