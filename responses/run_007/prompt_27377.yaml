prompt: |-
  I teach a third-year undergraduate seminar on democratic theory — about 24 students, one 80-minute session — and I want to run an in-class game that makes them feel the Condorcet jury theorem in their bones, rather than just watching me derive it. The double edge is what I'm after: when each person is even slightly better than chance and their judgements are independent, a majority of a large group can be much more accurate than any single member; but when people are slightly worse than chance, or their errors are correlated, majority rule can reliably compound the error instead of washing it out. I want the game to produce both edges in what actually happens, before I name any of this. I have a vague idea of a first phase with individual answers to some factual questions and then a majority vote, and a second phase where everyone gets the same misleading hint before voting, but I don't know how to make the correlation visible rather than just asserted. It has to run without real money — points or candy at most. Please give me concrete rules, a timeline, the exact stimuli or questions to use, and a debrief that maps each phase onto the theorem's conditions (binary choice, p > 0.5, independence, sincerity). Also tell me what will predictably go wrong the first time I run it, and be straight with me about which feature of the theorem a 24-person classroom simply cant exhibit.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 3rd-year undergrads (political science/philosophy/etc.), seminar style (24 students).
      *   **Time:** One 80-minute session.
      *   **Goal:** Experiential understanding of the Condorcet Jury Theorem (CJT).
      *   **Key Concepts to Demonstrate:**
          1.  *The Good:* $p > 0.5$ + Independence $\rightarrow$ Group accuracy $\rightarrow$ 1 as $N \rightarrow \infty$.
          2.  *The Bad (Double Edge):* $p < 0.5$ OR Correlated Errors $\rightarrow$ Group accuracy $\rightarrow$ 0 (or stays low).
      *   **Constraints:** No real money (points/candy okay), must be concrete (rules, timeline, stimuli), must include debrief mapping to theorem conditions, must predict pitfalls, must acknowledge limitations of $N=24$.
      *   **Specific Challenge:** Making "correlated errors" visible, not just asserted.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Assumptions:* Binary choice (True/False, A/B), Competence ($p > 0.5$), Independence (votes not influenced by others), Sincerity (vote true belief).
      *   *Result:* Majority probability approaches 1 as $N$ increases.
      *   *Failure Modes:*
          *   Incompetence ($p < 0.5$): Majority gets worse as $N$ increases.
          *   Dependence (Correlation): Information cascades or common bias prevents error cancellation.

  3.  **Designing the Game (The "Experiment"):**
      *   *Need:* A task where individuals are *slightly* better than chance, but not perfect. General knowledge trivia is good for this.
      *   *Phase 1 (Independence & Competence):* Individual votes on hard trivia. Aggregate. Show improvement.
      *   *Phase 2 (Correlation/Dependency):* Introduce a common signal (a "hint" or "expert opinion") that is *wrong*. This forces correlated error.
      *   *Phase 3 (Incompetence - Optional but requested):* The prompt asks for the "double edge" ($p < 0.5$). Hard to engineer $p < 0.5$ naturally without trick questions. Better to focus on the Correlation edge as the primary "bad" outcome, as it's more relevant to democratic theory (echo chambers, media bias). However, I can simulate $p < 0.5$ by using *misleading* questions where intuition fails. Let's stick to the Correlation edge for the "Bad" phase as it's easier to manufacture in class than systematic individual incompetence. Actually, the prompt specifically asks for "when people are slightly worse than chance, OR their errors are correlated." I should try to hit the Correlation one hard, as it's more pedagogically rich for a seminar. I will add a "Trick Question" round for the $p < 0.5$ feel.

      *   *Refining the "Correlation" Mechanism:* Just giving a hint isn't enough. Students need to *see* the correlation.
      *   *Idea:* Use a visual estimation task.
      *   *Task:* Guess the number of items in a jar? No, too much variance.
      *   *Task:* Binary factual questions.
      *   *Phase 1:* Independent research/thought.
      *   *Phase 2:* Shared (misleading) information source.
      *   *Visualization:* Need to show the voting pattern. Hand raising is okay, but anonymous clickers or slips of paper are better for sincerity. Let's use slips of paper for anonymity to ensure sincerity, then tally on board.

  4.  **Drafting the Protocol:**

      *   **Prep:** 10 Binary Questions. 5 "Fair" (p > 0.5), 3 "Trick" (p < 0.5 intuition), 2 "Control".
      *   **Round 1 (The Miracle):** 5 Fair Questions. Students answer alone. Tally individual accuracy. Tally Majority accuracy.
      *   **Round 2 (The Echo Chamber):** 5 Questions. Before answering, show a "News Flash" or "Expert Consensus" that is *uniformly wrong* for a subset of questions, or simply discuss the answers briefly allowing a loud wrong voice to dominate.
      *   *Better idea for Correlation:* The "Common Signal" treatment. Give them a handout with "Background Reading" that contains a systematic bias.
      *   *Even Better:* The "Influence" treatment. Allow them to discuss for 2 minutes before voting on Round 2. This creates social correlation.
      *   *Best for "Visible Correlation":* Use a specific cognitive bias task. The "Linda Problem" style or general knowledge where a common misconception exists.
      *   *Decision:* Let's use General Knowledge.
          *   Phase 1: Silent, independent.
          *   Phase 2: Public "Hint" (which is wrong).
          *   Phase 3: Discussion (Correlation).
      *   *Wait, time is tight (80 mins).* Keep it to two main phases.
      *   **Phase 1: Independence.** Silent voting on 10 questions.
      *   **Phase 2: Correlated Error.** Provide a "Briefing Document" that looks authoritative but contains a systematic error pattern, OR allow 3 minutes of unstructured discussion before voting on new questions.
      *   *Let's go with the "Common Signal" approach.* It's cleaner. I will provide a "Fact Sheet" that has a subtle systematic error.
      *   *Actually, the prompt asks to make correlation VISIBLE.*
      *   *Revised Plan:*
          *   Round 1: Independent votes (Write down).
          *   Round 2: Public "Expert" recommendation (which is wrong) + Vote.
          *   Round 3: Discussion allowed + Vote.
      *   *Simplification:* To fit 80 mins, do two rounds of 5 questions each.
      *   Round 1: Independent.
      *   Round 2: "The Whisper." Select one student to be the "Influencer." Give them the answers (some wrong). They give a 1-minute speech. Others vote.
      *   *Wait, to show correlation, I need to show that their errors match.*
      *   *Okay, here is the winning mechanic:*
          *   **Stimuli:** 10 Binary General Knowledge Questions (designed so avg accuracy is ~60-70%).
          *   **Round 1 (Independence):** Students answer silently.
          *   **Round 2 (Correlation):** Students answer after seeing a "Poll Result" from a previous (fake) class that was wrong.
          *   **Visualization:** Plot the distribution of scores. In Round 1, errors should be scattered. In Round 2, errors should cluster (everyone gets the *same* ones wrong).

  5.  **Addressing the Constraints & Pitfalls:**
      *   *N=24 Limitation:* CJT is asymptotic. With 24, the "magic" isn't perfect. Variance is high. I need to manage expectations.
      *   *Sincerity:* Students might joke. Need anonymous voting.
      *   *Competence:* If questions are too hard ($p < 0.5$), Round 1 fails. If too easy ($p \approx 1$), there's no room for improvement. Need Goldilocks questions.
      *   *Correlation:* Hard to force. The "Fake Poll" is the best way. It creates a focal point.

  6.  **Developing the Questions:**
      *   Need questions where the intuitive answer is often wrong (for the $p<0.5$ feel) or just hard enough ($p \approx 0.6$).
      *   Example: "Is the population of Country X larger than Country Y?"
      *   Example: "Did Event A happen before Event B?"
      *   I need to provide the actual questions in the prompt response.

  7.  **Structuring the Debrief:**
      *   Map Phase 1 to $p > 0.5$ + Independence.
      *   Map Phase 2 to Correlated Error (Information Cascades/Herding).
      *   Discuss the $p < 0.5$ scenario theoretically (if the group is systematically biased).
      *   Address the $N=24$ limitation honestly.

  8.  **Refining the "Visible Correlation" aspect:**
      *   How to show it on the board?
      *   Create a "Error Matrix."
      *   Rows = Students. Columns = Questions.
      *   Round 1: X's are scattered.
      *   Round 2: X's form vertical lines (columns) where everyone missed the same question due to the hint.
      *   *This is the key visual.*

  9.  **Timeline Check:**
      *   Intro: 10 mins.
      *   Round 1 (Indep): 15 mins (5 questions, voting, tallying).
      *   Round 2 (Correlated): 20 mins (Hint, 5 questions, voting, tallying).
      *   Analysis/Board Work: 15 mins.
      *   Debrief/Lecture: 20 mins.
      *   Total: 80 mins.

  10. **Predicting Failure:**
      *   Students talking during Round 1.
      *   Questions too easy (ceiling effect).
      *   Students ignoring the hint in Round 2 (skepticism).
      *   The "Majority" in Round 1 might actually lose (variance). Need to run the numbers on the questions beforehand to ensure $p > 0.5$ is likely.

  11. **Final Polish:**
      *   Make sure the instructions are script-ready.
      *   Ensure the "Fake Poll" is convincing.
      *   Clarify the $N=24$ limitation (Law of Large Numbers needs more N for smooth curves).

  12. **Self-Correction on "p < 0.5":**
      *   It is very hard to guarantee a classroom of 24 undergrads has $p < 0.5$ on factual questions without trickery.
      *   *Solution:* Use the "Trick Question" strategy for the theoretical discussion of $p < 0.5$, but focus the *game* on the Correlation edge. The prompt asks for "when people are slightly worse than chance, OR their errors are correlated." I will prioritize Correlation for the game because it's actionable, but I will include one "Poison Pill" question in Round 1 where the majority *will* get it wrong to demonstrate the $p < 0.5$ risk on a micro scale.
      *   *Actually, better:* In Round 2, the "Hint" should make them systematically wrong on specific questions, effectively driving their $p$ below 0.5 *for those questions*. This satisfies the condition.

  13. **Finalizing the Plan:**
      *   **Title:** The Wisdom (and Folly) of Crowds.
      *   **Materials:** Slips of paper, Projector, Pre-written Questions.
      *   **Visual:** The Error Matrix is crucial.

      *(Self-Correction during drafting)*: I need to be careful about the "Fake Poll." If students smell a rat, they rebel. It needs to be framed as "Data from a pilot study."
      *(Refinement on N=24)*: I must explicitly state that with 24 people, the majority rule isn't *guaranteed* to be right even if $p > 0.5$. It's probabilistic. I need to manage this expectation so the professor doesn't look bad if the majority loses Round 1. I will suggest running *many* questions (10-15) to average out the variance.

      *(Wait, 80 minutes is tight for 15 questions + tallying).*
      Let's do 2 Rounds of 8 Questions.
      Tallying needs to be fast. Use a TA or pre-printed bubbles? No, keep it low tech. Hand raise for tally? No, breaks anonymity.
      *Solution:* Students mark a sheet. Instructor collects. While instructor tallies (takes 5 mins), students do a filler task or break.
      *Better:* Use a free polling app (Mentimeter/Slido) if tech allowed. Prompt says "without real money," implies low tech is safer. I'll stick to paper but streamline the tally.
      *Streamlined Tally:* Ask students to count their *own* score. Ask for a show of hands for "Who got 7/8?", "6/8?", etc. Record distribution. Then ask "How many got Q1 right?" for the Matrix.
      *Actually, for the Matrix, I need to know WHO got what wrong to show correlation.*
      *Okay, I will assign students numbers 1-24 at the start.* They write their number on the slip. This allows me to build the Matrix on the board live.

      *Let's write the response.*
answer: |-
  Here is a complete lesson plan designed to fit an 80-minute seminar, engineered to make the Condorcet Jury Theorem (CJT) visceral. It focuses on the **Double Edge**: Aggregation of independent competence vs. Aggregation of correlated error.

  ### **Lesson Title:** The Wisdom and Folly of Crowds
  **Time:** 80 Minutes
  **Class Size:** 24 Students
  **Materials:** 
  *   Slips of paper (2 per student).
  *   Projector/Board.
  *   Pre-printed "Pilot Data" handout (for Phase 2).
  *   Candy/Points (optional reward for highest individual score).

  ---

  ### **Part 1: Setup & Phase 1 (Independence)** 
  **Goal:** Establish $p > 0.5$ and Independence.

  **1. Introduction (5 mins)**
  *   Tell students: "We are testing collective intelligence. No talking. No phones. This is anonymous, but please write your **Student Number (1–24)** on the slip so we can track error patterns later. I need sincerity for the data to work."
  *   Assign numbers 1–24 quickly (row by row).

  **2. The Task (10 mins)**
  *   Distribute **Slip A**.
  *   Display **8 Binary Questions** (see *Stimuli List* below). 
  *   **Instruction:** "Circle A or B. Rely *only* on your own knowledge. Do not look at neighbors."
  *   Collect slips immediately.

  **3. The Tally & The Reveal (10 mins)**
  *   **While you tally:** Ask students to calculate their own personal score. Ask for a show of hands for the distribution (e.g., "Who got 8/8? 7/8?"). Write the *Individual Accuracy Distribution* on the board.
  *   **The CJT Calculation:** Calculate the **Majority Vote** for each of the 8 questions. (e.g., For Q1, 18 said A, 6 said B. Majority = A). Check if Majority matches Truth.
  *   **Write on Board:** 
      *   Avg Individual Accuracy: ~__%
      *   Majority Rule Accuracy: __% (Likely higher).

  ---

  ### **Part 2: Phase 2 (Correlated Error)** 
  **Goal:** Introduce a common signal that creates dependency and systematic bias.

  **1. The Treatment (5 mins)**
  *   Distribute **Slip B** and a **"Pilot Study Summary"** handout.
  *   **The Script:** "Before you answer the next set, here is data from a pilot study run with graduate students last year. It shows the consensus view on these topics. You may use this to inform your judgment."
  *   **The Trap:** The handout contains **systematic errors**. For 5 of the 8 questions, the "Consensus" listed is *wrong*. (e.g., "85% of Pilot respondents believed [False Statement]").
  *   **Instruction:** "Answer Slip B. You may consider the Pilot Data."

  **2. The Vote & Tally (10 mins)**
  *   Collect slips. Repeat the tally process.
  *   **Crucial Visual:** On the board, draw a **24x8 Grid** (Rows = Students, Cols = Questions). 
      *   For Phase 1, mark an 'X' where a student got it *wrong*. It should look like random static (scattered).
      *   For Phase 2, mark an 'X' where a student got it *wrong*. It should look like **vertical stripes** (columns where almost everyone got it wrong because they followed the bad hint).

  **3. The Result (5 mins)**
  *   Compare Phase 1 vs. Phase 2 Majority Accuracy.
  *   **Expected Outcome:** Phase 1 Majority > Individual Avg. Phase 2 Majority < Individual Avg (or collapses to the bias of the hint).

  ---

  ### **Part 3: The Debrief & Theory Mapping** 
  **Goal:** Connect the experience to the math.

  **1. The Good Edge (15 mins)**
  *   **Point to Phase 1:** "Why did the Majority beat the Average Individual?"
  *   **Map to Theorem:** 
      *   **Binary Choice:** A/B questions.
      *   **Competence ($p > 0.5$):** Most of you knew more than half the answers. You weren't guessing randomly.
      *   **Independence:** You didn't talk. Your errors were random noise.
      *   **Mechanism:** Random noise cancels out; signal remains. The "Law of Large Numbers" begins to kick in even at $N=24$.

  **2. The Bad Edge (15 mins)**
  *   **Point to Phase 2 Grid:** "Look at the error pattern. In Phase 1, errors were scattered. In Phase 2, errors formed columns. Why?"
  *   **Map to Theorem:** 
      *   **Correlated Error:** The "Pilot Data" was a **Common Signal**. It didn't add new independent information; it added the *same* error to everyone.
      *   **The Result:** Independence assumption violated. The errors did not cancel; they compounded. The Majority became confidently wrong.
  *   **Discuss $p < 0.5$:** "What if the questions were so hard that your average accuracy was 40%?" (Point to any question in Phase 1 where the Majority failed). "If $p < 0.5$, the CJT proves the Majority gets *worse* as the group grows. We would need to flip the votes (follow the minority) to find truth."

  **3. Limitations & Reality (10 mins)**
  *   **Sincerity:** "If you joked on Slip A, you lowered the group's $p$. CJT assumes sincere voting."
  *   **The $N=24$ Problem:** (See below).

  ---

  ### **Stimuli List (The Questions)**
  *You must verify these facts before class. The goal is ~65% individual accuracy.*

  **Phase 1 (Independence)**
  1.  **Geography:** Which country has a larger population? (A) Vietnam (B) Germany. *(Truth: B)*
  2.  **History:** Did the printing press arrive in England before or after Columbus sailed to the Americas? (A) Before (B) After. *(Truth: A)*
  3.  **Science:** Is the sun larger than the Earth by a factor of roughly 100 or 1,000,000? (A) 100 (B) 1,000,000. *(Truth: B)*
  4.  **Art:** Was Van Gogh alive during the American Civil War? (A) Yes (B) No. *(Truth: B)*
  5.  **Economics:** Did the Great Depression start before 1930? (A) Yes (B) No. *(Truth: A)*
  6.  **Biology:** Do humans share more DNA with chimpanzees or mice? (A) Chimpanzees (B) Mice. *(Truth: A)*
  7.  **Lit:** Was Jane Austen published before or after 1800? (A) Before (B) After. *(Truth: B - Sense & Sensibility was 1811)*
  8.  **Tech:** Was the first iPhone released before 2008? (A) Yes (B) No. *(Truth: A - 2007)*

  **Phase 2 (The Trap)**
  *Use similar difficulty questions. On the "Pilot Data" handout, explicitly state the wrong consensus for Q1, Q3, Q5, Q7, Q8.*
  *   **Example Trap:** Q1: "Which city is further North? (A) Rome (B) New York." *(Truth: B)*. **Pilot Handout says:** "80% of experts agree Rome is further North due to Gulf Stream warming." (This is false, but plausible sounding).

  ---

  ### **What Will Predictably Go Wrong (And How to Fix It)**

  1.  **The "Ceiling Effect":** If the questions are too easy, everyone gets 100%. The Majority cannot improve on perfection.
      *   *Fix:* Pilot the questions on a colleague first. Aim for 60-70% difficulty.
  2.  **The "Skeptic Student":** One smart student might realize the Pilot Data is wrong and vote against it. If they convince others, the correlation breaks.
      *   *Fix:* Frame the Pilot Data as "Aggregated Survey Results," not "Expert Truth." It appeals to social proof rather than authority, making it harder to refute without looking arrogant.
  3.  **The Tally Bottleneck:** Counting 24 slips x 8 questions live takes too long.
      *   *Fix:* **The "Self-Report" Tally.** Ask students: "Raise your hand if you got Q1 right." Record the number. Then "Raise your hand if you got Q2 right." This gives you the column totals for the Majority Vote instantly. For the Error Matrix, just pick 3 students who got Q1 wrong and ask them to stand up. It's illustrative, not statistically rigorous.
  4.  **Phase 1 Failure:** With $N=24$, it is statistically possible for the Majority to lose on a specific question even if $p > 0.5$.
      *   *Fix:* **Do not claim the Majority wins every question.** Claim the Majority wins *more often than the average individual*. If the Majority loses Q3, use it: "This is the variance risk. CJT is probabilistic, not magical."

  ---

  ### **The Hard Truth: What $N=24$ Cannot Exhibit**

  Be straight with your students about this during the debrief.

  **1. Asymptotic Certainty:**
  The CJT states that as $N \rightarrow \infty$, Probability(Majority Correct) $\rightarrow 1$.
  With 24 students, you are nowhere near infinity. The curve is still steep. If individual competence is $p=0.55$ (only slightly better than chance), a group of 24 is **not** guaranteed to be right. In fact, they will still be wrong roughly 30-40% of the time. You cannot demonstrate the "near certainty" of large crowds with a seminar size. You can only demonstrate the *direction* of improvement.

  **2. The "p < 0.5" Catastrophe:**
  The theorem states if $p < 0.5$, the group probability goes to 0 as $N \rightarrow \infty$. With 24 students, you cannot show the probability going to zero. You can only show a single instance of the majority being wrong. You cannot show the *trend* of degradation without running the game 50 times.

  **3. Heterogeneity:**
  CJT assumes identical $p$. In your class, you have experts (poli-sci majors) and novices. The "Weighted CJT" is more accurate for reality, but harder to teach. Acknowledge that in real democracies, voters are not identical coins.

  ### **Instructor Script for the "Double Edge" Conclusion**
  > "Today you felt the theorem. In Phase 1, your ignorance was private. When we added your private ignorances together, they cancelled out, leaving the knowledge. In Phase 2, your ignorance became public. You shared the same bias. When we added your public ignorances together, they didn't cancel; they amplified. 
  >
  > Democratic theory often obsesses over the first edge: how voting aggregates wisdom. But the second edge is the danger of modern politics: when we all consume the same misinformation, vote based on the same poll, or listen to the same influencer, we violate the **Independence** assumption. We stop being a jury and start being an echo chamber. The math doesn't change: garbage in, garbage out. But with correlated error, it's garbage in, *amplified* garbage out."
