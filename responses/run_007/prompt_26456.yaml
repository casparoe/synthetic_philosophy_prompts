      *   *Producer vs. Consumer:*
          *   Producer-based (Millikan's early work, Dretske): Focuses on what caused the signal historically. Struggles with disjunction because the cause *was* sometimes X and sometimes Y.
          *   Consumer-based (Millikan's later refinement, Papineau, Neander): Focuses on what the signal is *used for* by the system receiving it.
      *   *Proper Function:* What a trait was selected to do (etiological function).
      *   *Normal Conditions:* The conditions under which the proper function is successfully executed.

