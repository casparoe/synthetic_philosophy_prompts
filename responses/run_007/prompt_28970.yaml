answer: |-
  **Activity: The `#` Function Game**

  **Goal:** Force students to realize past usage underdetermines future application.
  **Materials:** Whiteboard, handouts with training data.

  **Timeline & Script**

  **0–10 min: Training Phase**
  Tell students: "You've learned a new mathematical function, `#`. You don't know the formula, only past examples. Extend the sequence."
  Write on board:
  $2 \# 2 = 4$
  $10 \# 10 = 20$
  $49 \# 49 = 98$
  $3 \# 50 = 53$
  Ask: "What is $51 \# 51$?"
  *Expected Answer:* 102.
  *Your Move:* Write "102" on the board. Do not confirm it yet.

  **10–20 min: The Skeptical Challenge**
  Select a student who said 102. Ask: "Why 102?"
  They will say: "It's addition."
  **Stop them.** Say: "I am not asking what you think it is *now*. I am asking: what fact about your *past* training (the four equations on the board) forces 102 rather than 5?"
  Write the alternative rule: **Quus#**: $x \# y = x + y$ if $x, y \leq 50$; else $5$.
  Point out: "Look at the board. Every single line fits `Addition` AND `Quus#` perfectly. Your past behavior is compatible with both. What fact makes you right?"

  **20–35 min: The Vertigo (Small Groups)**
  Break into groups of 3. One is the **Speaker** (claims they meant Addition), one is the **Skeptic** (claims they meant Quus#), one is the **Judge**.
  **Constraint:** The Speaker cannot appeal to "what I intended in my head." They must point to a *public fact* (past usage, definitions, physical states) that distinguishes the two.
  **Rule for Judge:** If the Speaker says "I just meant addition," the Judge must veto. "That's the conclusion, not the evidence."
  Walk around. If a group stalls, whisper: "If you meant addition, you should have been able to point to it before I suggested Quus#. Did you check every number up to infinity?"

  **35–50 min: Debrief & Kripke Connection**
  Bring class back. Ask: "Did anyone find a fact that ruled out Quus#?" (None will have).
  **Script:** "You feel 102 is obvious. Kripke agrees it's obvious. But his question is: *What makes it obvious?* If meaning is a fact about you, there must be a fact that distinguishes meaning Plus from meaning Quus. You found none. Your past usage is finite; the rule is infinite. No finite data entails an infinite rule."
  **The Skeptical Solution:** "Kripke's Wittgenstein says there is no 'superlative fact' in your head. Meaning isn't a private state; it's your eligibility to join a community. You are correct because you agree with *us*, not because you grasped a Platonic entity. We let you into the club of 'adders' because you behave like us."

  **Predictable Failures & Fixes**

  1.  **The "Simplicity" Objection:** Students will say, "Addition is simpler; Quus# is gerrymandered."
      *   *Fix:* Concede simplicity but deny truth. "Simplicity is a pragmatic virtue, not a truth-maker. Nature isn't obligated to be simple. What *fact* makes the simple rule the *meaningful* one?"
  2.  **The "Intention" Objection:** "I intended addition!"
      *   *Fix:* "An intention is just another mental state. How did you intend 'addition' rather than 'quaddition' in your intention? You're regressing. We need a fact that fixes the content of the intention."
  3.  **Boredom/Resistance:** They feel tricked.
      *   *Fix:* Acknowledge it. "This feels like a trick. That's the vertigo. Kripke wants you to feel that the ground of meaning is shakier than you thought."

  **Limitations (Be Honest)**

  1.  **The "Right Answer" Problem:** In this game, *you* (the TA) know the intended rule was likely Addition. In Kripke's paradox, there is *no* fact of the matter, not even for you. The activity simulates ambiguity; Kripke argues ambiguity is constitutive of meaning itself.
  2.  **Finite vs. Infinite:** The game uses a cutoff (50). Kripke's point applies to *any* finite usage, even without a specific cutoff. Students might think "If I just had more training data, I'd know." Kripke says no amount of finite data suffices.
  3.  **Community:** The activity isolates them. The "Skeptical Solution" relies on community agreement, which is hard to simulate in a 50-minute tutorial where you (the authority) hold the answer key.

  **Prep Note:** Do not reveal which rule you "actually" had in mind. If they ask, say: "It doesn't matter. The paradox holds regardless of what I meant."
