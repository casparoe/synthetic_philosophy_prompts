answer: |-
  Imagine Elena standing on a ski slope on a bright but freezing day, preparing to apply sunscreen. The Physical stance, tracking the causal chain of her neural states and motor cortex, predicts she will squeeze the tube and rub the lotion on her face. The Intentional stance, attributing to her the belief that snow reflects UV rays and the desire to prevent skin cancer, makes the exact same prediction: she will apply the lotion. However, the Design stance, treating Elena as a product of natural selection optimized for the African savanna, predicts she will *not* apply the lotion. Her evolutionary design includes thermal sensors that register the freezing air as "safe from burning" and lacks any innate mechanism to detect invisible UV radiation; in her Environment of Evolutionary Adaptedness, cold always correlated with low solar intensity. Thus, while her physics and her reasons align on action, her biological blueprint suggests inaction.

  **The Check**

  **Predictions:** The Physical stance predicts the action based on the current neurochemical state implementing her plan. The Intentional stance predicts the action based on the rationality of her beliefs and desires regarding health. The Design stance predicts inaction because the organism's built-in sensors (thermal feedback) signal no threat, and the behavior (applying foreign substance) offers no immediate evolutionary payoff in the ancestral context.

  **The Peeling Feature:** The divergence arises from **environmental mismatch**. The Design stance relies on heuristics calibrated for the past (cold = safe), while the Intentional stance utilizes culturally transmitted knowledge (snow = UV reflection) that overrides the ancestral heuristic.

  **Removal Test:** If you remove the modern knowledge (she doesn't know about UV) or the modern environment (she is on a shady forest floor), the case collapses back into agreement. Without the weather report, her Intentional stance aligns with her Design stance (it feels cold, so I'm safe), and all three predict she will skip the sunscreen.

  **Design Stance Pushback:** A defender of the Design stance would argue I have taken the stance at the wrong level. They would claim the "real pattern" is indeed at the design level because humans are designed for *plasticity*. The capacity to learn from culture and override thermal heuristics is itself an adaptation. Therefore, applying the sunscreen *is* the Design stance prediction when you view the brain as a general-purpose learning machine rather than a bundle of specific savanna heuristics. They would insist the real pattern is the adaptability, not the specific heuristic, and thus the Design stance ultimately subsumes the Intentional one.
