      *   Kill recommendation included? Yes.

  8.  **Final Polish:** Ensure the tone is authoritative but helpful. (Proceed to generate output).

  *(Self-Correction on the "Commitment")*: I must avoid "on the one hand, on the other." I will adopt the mainstream mathematical logician consensus: GIT is about formal systems, not physical reality or cognition *unless* specific, highly controversial bridging premises are argued. Most pop-sci pieces do not argue these premises; they assert them. Therefore, the checklist should be strict.

