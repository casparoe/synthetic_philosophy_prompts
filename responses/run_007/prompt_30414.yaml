answer: |-
  Here is the checklist. I have committed to a single, strict version based on the consensus of mathematical logicians and philosophers of mathematics. This is not a "balance both sides" tool; it is a filter for category errors.

  Most pop-science uses of Gödel are wrong. If a piece relies on Gödel to make its central point, it is almost certainly flawed. This checklist is designed to catch that flaw quickly.

  ### The "Gödel Sanity Check" (10-Minute Edition)

  **Instructions:** Read the specific paragraph(s) invoking Gödel. Answer the five questions in order. If you hit a **STOP**, the claim is unsupported. If you reach the end, the claim is *technically* permissible but requires the "Judgment Call" at Step 5.

  #### 1. The System Specification
  **Question:** Does the author identify a specific **formal axiomatic system** to which Gödel applies?
  *   **Good Answer:** "Peano Arithmetic," "Principia Mathematica," "ZFC Set Theory," or explicitly "any consistent formal system capable of basic arithmetic."
  *   **Bad Answer:** "The human mind," "Science," "The Universe," "The Law," "AI," "Logic" (generically).
  *   **STOP CONDITION:** If the author applies Gödel directly to a physical object, a biological process, or a social institution without first defining it as a formal mathematical system, **flag the claim as unsupported.** Gödel's theorems apply to strings of symbols and rules of inference, not neurons, particles, or judges.

  #### 2. The Arithmetic Requirement
  **Question:** Does the identified system include **basic arithmetic** (addition and multiplication of natural numbers)?
  *   **Good Answer:** Yes, the system can express statements like $2+2=4$ or quantified statements about integers.
  *   **Bad Answer:** No, it's a system of ethics, or simple logic without numbers, or a neural network (which is statistical, not axiomatic).
  *   **STOP CONDITION:** Gödel's incompleteness requires the system to be complex enough to encode arithmetic. If the system is too simple (e.g., Euclidean geometry without coordinates, or pure propositional logic), it can be complete. If the author doesn't establish the system handles arithmetic, **flag the claim as unsupported.**

  #### 3. Truth vs. Provability
  **Question:** Does the author distinguish between **"true"** and **"provable within the system"**?
  *   **Good Answer:** Yes. They acknowledge the statement is unprovable *inside the system* but may be seen as true from a "meta" perspective.
  *   **Bad Answer:** They treat "unprovable" as synonymous with "unknowable," "false," or "mystical."
  *   **STOP CONDITION:** Gödel does not say truths are unknowable; he says they are unprovable *using only the rules of that specific system*. If the author claims Gödel proves "some truths can never be known by anyone," **flag the claim as unsupported.**

  #### 4. The Isomorphism Check (JUDGMENT CALL)
  **Question:** If the author is applying this to something non-mathematical (like the Mind or AI), do they argue **why** that thing is isomorphic to a formal axiomatic system?
  *   **Good Answer:** They acknowledge this is a controversial assumption (e.g., "If we assume the brain operates like a formal system...") and cite the Lucas-Penrose argument or similar.
  *   **Bad Answer:** They assert it as fact (e.g., "Since the brain is a computer, and computers are formal systems...").
  *   **PROCEDURAL TRUTH:** This is the most common failure point. There is no scientific consensus that the human mind *is* a formal axiomatic system. There is no consensus that AI *must* be bound by a single fixed formal system (AI can change its own axioms).
  *   **DECISION POINT:** If the author treats this analogy as a settled fact rather than a philosophical hypothesis, **you must demand a rewrite.** This is not a fact; it is a metaphysical stance.

  #### 5. The Consistency Assumption (JUDGMENT CALL)
  **Question:** Does the claim rely on the system being **consistent**?
  *   **Good Answer:** They acknowledge Gödel's Second Theorem (a system cannot prove its own consistency).
  *   **Bad Answer:** They ignore consistency entirely.
  *   **PROCEDURAL TRUTH:** Gödel's theorems only hold if the system is consistent. If the system is inconsistent, it can prove everything (including falsehoods), and incompleteness doesn't matter.
  *   **DECISION POINT:** If the piece claims "Gödel proves science is limited," ask: "Does Gödel prove science is inconsistent, or just incomplete?" If they conflate the two, **kill the analogy.**

  ---

  ### When to Kill the Piece
  **Commitment:** If the central thesis of the article rests on the outcome of Step 4 (The Isomorphism Check) and the author cannot defend the premise that "Mind/Science/Law = Formal Axiomatic System" as a *contested philosophical argument* rather than an *engineering fact*, **you should kill the Gödel angle.**

  It is better to run a piece without Gödel than to run a piece that misuses Gödel. Misusing Gödel signals to knowledgeable readers that the rest of the science is likely sloppy. If removing Gödel collapses the argument, the argument was never sound.

  ---

  ### Running the Checklist on Examples

  #### Example 1: "Human mathematicians can see truths no machine could prove."
  *(The Lucas-Penrose Argument)*

  1.  **System Specification:** The author claims "The Machine" is a formal system. **Pass.**
  2.  **Arithmetic:** The author assumes the machine does math. **Pass.**
  3.  **Truth vs. Provability:** The author claims humans "see" the truth of the Gödel sentence. **Pass.**
  4.  **Isomorphism Check:** **FAIL.** The author asserts humans are *not* formal systems, but offers no proof, while asserting machines *are*. This assumes humans have access to "truth" outside of any formal process. This is a philosophical assertion, not a mathematical one.
  5.  **Consistency:** Usually ignored. **FAIL.**

  **Verdict:** **Unsupported.** This is a 70-year-old philosophical debate, not a settled scientific fact.
  **Editorial Action:** Demand the author frame this as "Some philosophers, like Roger Penrose, argue..." rather than "Gödel proves..." If they refuse to soften the claim to reflect the controversy, cut the reference.

  #### Example 2: "Gödel shows some scientific truths are unknowable in principle."
  *(The Theory of Everything Limit)*

  1.  **System Specification:** The author identifies "Physics" or "A Theory of Everything" as the system. **FAIL.** Physics is not an axiomatic system; it is an empirical modeling process.
  2.  **Arithmetic:** Irrelevant, since Step 1 failed.
  3.  **Truth vs. Provability:** The author equates "scientific truth" with "mathematical provability." **FAIL.** Science relies on falsification and observation, not formal proof.
  4.  **Isomorphism Check:** **FAIL.** No argument is made that the physical universe *is* a formal system.
  5.  **Consistency:** Ignored.

  **Verdict:** **Dead on Arrival.** This is a category error. Gödel limits *proof*, not *empirical knowledge*.
  **Editorial Action:** Kill the paragraph. It undermines the credibility of the science section. Tell the writer: "Gödel applies to math, not physical reality. Find a different limit for physics (e.g., Heisenberg, Chaos Theory) or drop the claim."

  #### Example 3: "The Law cannot be fully formalized."
  *(The Legal-Tech Argument)*

  1.  **System Specification:** The author identifies "The Legal Code" as the system. **FAIL.** Law is interpreted by humans, relies on precedent, and contains intentional ambiguities. It is not a formal axiomatic system.
  2.  **Arithmetic:** **FAIL.** Laws do not typically encode Peano Arithmetic.
  3.  **Truth vs. Provability:** **FAIL.** Legal outcomes are not "true/false" in the logical sense; they are "liable/not liable."
  4.  **Isomorphism Check:** **FAIL.** The author assumes law works like math.
  5.  **Consistency:** **FAIL.** Laws often contradict each other until resolved by courts.

  **Verdict:** **Decorative/Misleading.** The conclusion (law is hard to formalize) might be true, but Gödel is not the reason.
  **Editorial Action:** Allow the conclusion, but force the removal of Gödel. Tell the writer: "You are making a sociological point about ambiguity in language, not a logical point about incompleteness. Cite legal theory, not Kurt Gödel."

  ### Summary of the "Judgment Calls"
  I want to be honest about where this checklist relies on your judgment, not just logic.

  1.  **Step 4 (Isomorphism):** This is the biggest gray area. There *are* arguments that cognition is computational (Computational Theory of Mind). If a writer is specifically discussing *that* theory, they get a pass to invoke Gödel, **provided** they acknowledge it is a hypothesis. Your judgment call is distinguishing between a writer exploring a hypothesis and a writer presenting a hypothesis as a theorem.
  2.  **Step 5 (Consistency):** In pop-sci, "consistency" is often glossed over. If the piece is otherwise strong, you might let a minor slip here pass. But if the piece argues that "contradictions are inevitable," they are misusing Gödel (who assumed consistency to prove incompleteness).

  **Final Directive:**
  Gödel is the "Godwin's Law" of mathematics journalism. Its presence usually signals a writer is reaching for depth they haven't earned. Use this checklist to protect your magazine from looking like it doesn't understand the difference between a proof and a metaphor. If the Gödel reference doesn't survive Step 1 and Step 4 rigorously, cut it.
