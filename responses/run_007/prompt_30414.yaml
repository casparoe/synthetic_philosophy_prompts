prompt: |-
  Got into it last night with a friend who would not stop saying that Gödel's incompleteness theorems prove no AI will ever do real mathematics, because there are true statements no formal system can prove. I kept saying that's not what the theorems say but I couldn't make the distinction sharp enough on the spot, and it matters for my job: I edit the science and tech section of a magazine, and every few weeks a writer or a pitch invokes Gödel to prove something outside math — that the mind isnt a machine, that some truths are beyond science, that AI is fundamentally limited, that law cant be fully formalized. I want a checklist I can actually run on a piece in about ten minutes before deadline. It should take a claim of the form 'Gödel shows X' and tell me whether the use is legitimate, overextended, or just decorative. Give me the questions in order, what counts as a good enough answer to each, where the procedure stops and says the claim is unsupported, and where it has to hand the decision to a person because its a judgment call rather than a fact. Be honest about the steps that feel procedural but are actually judgment. Then run it on two or three examples: the claim that Gödel shows human mathematicians can see truths no machine could prove, the claim that Gödel shows some scientific truths are unknowable in principle, and whichever third example you think is most common or most misleading. And please commit — pick the version of the checklist you actually think is right and defend it, dont just lay out options. If the procedure would tell me to kill a piece I'd otherwise run, say so.
