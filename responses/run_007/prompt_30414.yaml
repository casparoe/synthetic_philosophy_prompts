      *Wait, re-reading prompt:* "the claim that Gödel shows human mathematicians can see truths no machine could prove" (Example 1), "the claim that Gödel shows some scientific truths are unknowable in principle" (Example 2). I need a third. "Law cant be fully formalized" was mentioned in the prompt intro. Let's use **Legal/Regulatory Systems** as the third, as it's a favorite of legal-tech writers.

  7.  **Final Review against Constraints:**
