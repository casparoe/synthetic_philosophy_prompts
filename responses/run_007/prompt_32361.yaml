answer: |-
  The "Asian values" debate of the early 1990s serves as a potent stress test for the concept of "Western values." Ostensibly a dispute over human rights universality between the Global North and the rising powers of East and Southeast Asia, the conflict was fundamentally a contest over the definition, ownership, and exportability of political morality. By examining the arguments surrounding the 1993 Bangkok Declaration and the Vienna World Conference, we can dissect whether "Western values" constitutes a coherent philosophical category or merely a geopolitical placeholder.

  ### 1. Map the Claims: The Content of the Dichotomy

  To understand what "Western values" picked out in this debate, we must look at the specific normative commitments attributed to it by its proponents and detractors.

  **The Attribution to the West:**
  For Lee Kuan Yew, Mahathir Mohamad, and the signatories of the Bangkok Declaration, "Western values" were not a vague cultural ambiance but a specific political technology. They identified three core components:
  *   **Normative Commitment:** *Atomistic Individualism.* The West was defined by the prioritization of the individual over the group. Rights were framed as shields *against* the state and community, rather than claims realized *through* them.
  *   **Historical Origins:** The Enlightenment and Liberalism. The proponents traced these values to 17th-century European social contract theory and 19th-century laissez-faire liberalism. They argued these were historically contingent developments, born of specific European struggles against church and monarchy, not universal truths.
  *   **Institutional Expressions:** Adversarial democracy, litigious legal systems, and an unconstrained free press. Lee Kuan Yew specifically pointed to the "excesses" of Western democracy—gridlock, short-termism, and social fragmentation—as evidence that these institutions were culturally specific, not universally applicable.

  **The Contrasting Asian Alternative:**
  In opposition, the "Asian values" proponents posited a communitarian ethic, often loosely grounded in Confucianism (despite the religious diversity of the signatories, including Muslim Malaysia and Buddhist Thailand).
  *   **Normative Commitment:** *Duty and Harmony.* The basic unit of society is the family, not the individual. Social order and economic security are prerequisites for liberty, not its byproducts.
  *   **Institutional Expressions:** Benevolent authoritarianism or "guided democracy." The state acts as a paternal figure, prioritizing economic development and social stability over civil-political liberties.

  **Precision of Content:**
  Crucially, the debate was not merely about "culture" in an anthropological sense. It was about *developmental legitimacy*. By labeling human rights conditionality as "Western values," Asian leaders reclassified external pressure on labor rights or press freedom as cultural imperialism, thereby insulating their state-capitalist models from critique.

  ### 2. Assess the Coherence of the Category

  When we scrutinize "Western values" as deployed in this debate, the category fractures under the weight of its own internal contradictions. The debate reveals that "Western values" functions simultaneously as a genealogical, demographic, and philosophical claim, failing to cohere on any single axis.

  **Genealogical vs. Philosophical:**
  The Asian proponents made a genealogical claim (these ideas come from Europe) to undermine a philosophical claim (these ideas are universal). However, the category "Western values" collapses when subjected to the history of Western thought itself.
  *   **Internal Conflicts:** If "Western values" equals liberal individualism, what does the debate do with the Western traditions of Marxism, Christian Democracy, or Hegelian statism? The Western tradition contains robust arguments for the priority of the community (e.g., Rousseau's general will, Catholic Social Teaching, Social Democracy). To claim that "community over individual" is distinctively Asian is to ignore the entire history of European conservatism and socialism.
  *   **The Counter-Enlightenment:** The Asian emphasis on order and authority finds strong echoes in Western thinkers like Hobbes, Burke, or Schmitt. If "Western values" includes these, the contrast with "Asian values" dissolves. If it excludes them, the category is not "Western" but "Liberal."

  **Demographic Reality:**
  As a demographic claim (what Western populations actually value), the category is equally unstable. In the 1990s, Western Europe was deeply invested in social welfare and collective security (the EU project), while the United States emphasized market liberty. Which is the "Western value"? The Asian proponents conveniently cherry-picked the most fractious elements of American culture to represent the whole "West," ignoring the corporatist and communitarian structures of Continental Europe.

  **Verdict on Coherence:**
  The category is philosophically incoherent. It treats a specific, contested slice of modern Western political thought (late 20th-century neoliberal liberalism) as the totality of Western civilization. It survives only by suppressing the West's own internal civil war between liberty and equality, individual and community.

  ### 3. Diagnose the Rhetorical Function

  If the category is philosophically porous, why was it so effective? The answer lies in its rhetorical function. In the Vienna/Bangkok exchange, "Western values" operated less as a description and more as a *move* in a geopolitical argument.

  **For the Asian Proponents (The Shield):**
  For Lee and Mahathir, "Western values" was a strategic foil. It functioned as a **boundary marker**. By labeling human rights norms as "Western," they achieved two goals:
  1.  **Relativization:** They shifted the debate from *justice* (are these rights valid?) to *identity* (do these rights fit us?).
  2.  **Sovereignty:** It allowed them to frame international monitoring as neo-colonialism. "Western values" became a synonym for "foreign interference."
  It was not a sincere anthropological claim—Singapore and Malaysia were modern, capitalist, legalistic states deeply integrated into the Western economic order. It was a tool of regime survival.

  **For the Western Defenders (The Sword):**
  Conversely, when Western diplomats and NGOs defended human rights as "universal," they were often implicitly defending a Western particularism while claiming neutrality.
  *   **Universalism as Particularism:** By insisting the UDHR was culture-neutral, Western defenders obscured the document's historical lineage (heavily influenced by Western legal traditions).
  *   **Detachment:** Could the claim be detached from Western genealogy? Theoretically, yes. One could argue for free speech based on Islamic or African traditions of consultation (*Shura* or *Palaver*). However, in the heat of the 1990s debate, the West rarely made these cross-cultural arguments. They relied on the authority of the UN and the moral weight of the post-WWII order.
  *   **Rhetorical Function:** For the West, "Western values" was an unspoken premise. They preferred the term "Universal Values," but the operational content was indistinguishable from the liberal democratic consensus of the OECD nations.

  **Description vs. Argument:**
  The phrase functioned primarily as an **argumentative move**. For the East, it meant "particular and non-exportable." For the West, it meant "universal and mandatory." The same phrase carried opposite modal weights depending on who spoke it.

  ### 4. Verdict on the Category

  The "Asian values" debate exposes "Western values" as an **ideological construct with strategic utility but philosophical poverty.**

  **Incoherent yet Functional:**
  The category is incoherent if treated as a description of a unified civilizational essence. There is no single "Western" position on the relationship between the individual and the state. However, the category has genuine content if understood as a label for a specific **hegemonic project**: the post-Cold War liberal international order. In this sense, "Western values" picks out the institutional package of liberal democracy, market capitalism, and individual rights promoted by the US and its allies in the 1990s.

  **The Resistance to a Clean Verdict:**
  The debate resists a clean verdict because "values" are never purely abstract; they are embedded in power.
  *   If we abandon the category, we risk losing the ability to critique authoritarianism (by hiding behind "cultural difference").
  *   If we retain it uncritically, we risk imperialism (by masking power as morality).

  **Salvage or Abandon?**
  The category should be **abandoned as a cultural essence but retained as a historical descriptor.**
  *   **Abandon:** We must stop using "Western values" to imply that liberalism is the genetic property of people of European descent or that communitarianism is the property of Asians. The debate proved that "Asian" leaders could be hyper-capitalist individualists in economics while preaching communitarianism in politics, and "Western" nations could prioritize security over liberty (e.g., post-9/11).
  *   **Refine:** The phrase works best when historicized. It should refer not to a spirit of the West, but to the **political technology of liberal institutionalism** that emerged from the Atlantic world.

  **Conclusion:**
  The "Asian values" debate reveals that "Western values" is a **floating signifier**. It does not describe a static reality but negotiates a power relationship. When the West was hegemonic (1990s), "Western values" were "Universal values." When challenged, they retreated to being "Western." The episode teaches us that the coherence of "Western values" depends entirely on whether the speaker is trying to export them or defend against them. Ultimately, the category is less about geography or philosophy and more about **legitimacy**: it is the language used to argue who has the right to govern whom.
