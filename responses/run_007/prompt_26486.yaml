      *   **The Task:** Map major philosophical theories on the "Paradox of Tragedy" (why we enjoy sad art) onto the user's four-category framework.
      *   **Requirements:**
          *   Restate each philosophical view in the user's vocabulary.
          *   Be honest about fit (what translates, what stretches, what doesn't fit).
