      *   (3) vs. (5): (3) says satisficing is often the *right* procedure. (5) says we should design systems so satisficers get *optimizer* outcomes. If satisficing is already the right procedure, why aim for optimizer outcomes? Or does (5) imply optimizer outcomes are the gold standard?

  4.  **Pair-by-Pair Analysis (Drafting the content):**

