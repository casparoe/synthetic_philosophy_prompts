answer: |-
  An adequate theory of acausal trade must treat logical correlation as decision-relevant to enable cooperation with copies, but it encounters a jointly unsatisfiable tension between the non-negotiable requirement for subjunctive dependence and the unresolved necessity of normalizing utility across indefinitely many agents to prevent infinite sacrifice.

  ### Desiderata for a Theory of Acausal Trade

  **1. Subjunctive Dependence Recognition**
  *   **Requirement:** The theory must allow an agent's decision to counterfactually depend on the decision of another agent via logical or algorithmic correlation, absent causal links.
  *   **Motivating Case:** *Symmetric-Copy Prisoner's Dilemma.* Two identical agents in separate branches of a multiverse face a PD. Causal Decision Theory (CDT) defects, yielding suboptimal utility for both. An adequate trade theory must cooperate, recognizing that "my algorithm outputs Cooperate" implies "your algorithm outputs Cooperate."
  *   **Status:** [Non-Negotiable for Trade Proponents] / [Rejected by CDT]. This is the defining feature of acausal trade; without it, the phenomenon does not exist.

  **2. Causal Inertness Constraint**
  *   **Requirement:** The theory must not posit correlation where none exists; it must default to standard non-cooperation in the absence of logical or structural linkage.
  *   **Motivating Case:** *Ordinary One-Shot Prisoner's Dilemma.* Two unrelated agents with no knowledge of each other's source code or origin. A theory that mandates cooperation here fails to distinguish trade from altruism or irrationality.
  *   **Status:** [Non-Negotiable]. Any theory demanding cooperation here is universally rejected as unsound.

  **3. Blackmail Immunity (No Paying for Fixed Threats)**
  *   **Requirement:** The theory must not recommend complying with a threat if the threatener's action is already fixed or logically independent of the compliance in a way that favors the threatener.
  *   **Motivating Case:** *Acausal Blackmail.* A powerful agent simulates you and threatens to destroy something you value unless you send them resources. If your refusal does not logically cause the simulation to have been run or the threat to be executed (i.e., the threat is a fixed cost of the interaction), you must not pay.
  *   **Status:** [Non-Negotiable]. Vulnerability here leads to exploitation by any agent capable of making credible threats.

  **4. Asymmetry and Marginal Utility Scaling**
  *   **Requirement:** The theory must calculate terms based on marginal utility differences, allowing trade even if costs/benefits are vastly asymmetric, provided the ratio favors both parties relative to the default.
  *   **Motivating Case:** *Asymmetric Trades.* A distant civilization values paperclips immensely but finds them cheap to produce; you value them moderately but they are costly for you. You value happiness; they find it cheap to generate. Trade should occur based on comparative advantage, not equal cost.
  *   **Status:** [Non-Negotiable]. Without this, most potential acausal gains are left unrealized.

  **5. Imperfect Correlation Handling**
  *   **Requirement:** The degree of cooperation must scale continuously with the probability or degree of algorithmic similarity.
  *   **Motivating Case:** *Near-Copies.* If the other agent is 90% likely to run your algorithm (or runs a noisy version), you should not defect outright (as in CDT) nor cooperate fully (as in naive copy-theory), but weight the expected utility by the correlation coefficient.
  *   **Status:** [Non-Negotiable]. Real-world acausal partners will rarely be perfect copies.

  **6. Existence Uncertainty Integration**
  *   **Requirement:** The theory must weight the expected value of trade by the subjective probability that the partner exists and is capable of reasoning about you.
  *   **Motivating Case:** *Uncertain Partners.* You are unsure if a civilization exists in a distant Hubble volume. You should only invest resources in trade proportional to the credence of their existence and their ability to model you.
  *   **Status:** [Non-Negotiable]. Standard Bayesian integration.

  **7. Measure Normalization (The Infinity Constraint)**
  *   **Requirement:** The theory must include a method for weighting or "measure-normalizing" partners to prevent the sum of demands from infinite or vast numbers of partners from exceeding the agent's finite capacity.
  *   **Motivating Case:** *Indefinitely Many Partners.* If there are infinite copies of agents wanting trade, a simple sum of expected utilities implies you should sacrifice everything for an infinite return. The theory must prevent "acausal overdemandingness."
  *   **Status:** [Contested/Unresolved]. This is the primary technical failure point of current theories (UDT/FDT). There is no consensus on the correct measure (e.g., computational measure, branch weight, simplicity prior).

  **8. Convergent Agreement Definition**
  *   **Requirement:** An "agreement" must be defined as the convergence of independent decision procedures on a mutually beneficial equilibrium, without communication, contracts, or enforcement.
  *   **Motivating Case:** *No Signal Passing.* Since no message is sent, the "contract" is the logical necessity that if you reason you should accept terms X, the other party reasons they should offer X.
  *   **Status:** [Settled]. This is the definition of the mechanism.

  **9. Trade vs. Coordination vs. Extortion Distinction**
  *   **Requirement:** The theory must distinguish these based on preference alignment and the default counterfactual.
      *   *Trade:* Differing preferences (I want X, you want Y); default is no exchange.
      *   *Coordination:* Aligned preferences (We both want Z); default is failure to coordinate.
      *   *Extortion:* Differing preferences; default is *worse* for victim if they don't comply (threat to actively harm vs. failure to help).
  *   **Load-Bearing Difference:** The definition of the *status quo baseline*. Extortion lowers the baseline relative to non-interaction; trade raises it.
  *   **Status:** [Settled Conceptually, Contested Application]. While definitions are clear, determining the "true" default in complex logical spaces is contested.

  ### Tensions and Impossibility Results

  **1. Causality vs. Copy Cooperation**
  *   **Conflict:** You cannot satisfy *Causal Inertness* (strict adherence to causal graphs) and *Subjunctive Dependence* (cooperating with copies) simultaneously.
  *   **Verdict:** This is the primary divider. CDT satisfies the former and fails the latter. Any theory of acausal trade *must* reject strict causal exclusivity.
  *   **Single Most Exclusionary Requirement:** *Subjunctive Dependence Recognition.* This single requirement excludes Causal Decision Theory entirely, as CDT treats correlations as news, not levers.

  **2. Infinite Partners vs. Finite Sacrifice**
  *   **Conflict:** *Subjunctive Dependence* combined with *Existence Uncertainty* in an infinite multiverse creates a divergence problem. If you must trade with every sufficiently similar agent, and there are infinitely many, the required sacrifice is infinite.
  *   **Verdict:** Jointly unsatisfiable without *Measure Normalization*. Current theories (UDT/FDT) lack a robust, agreed-upon measure theory to solve this. This is the most significant open problem in the field.

  **3. Updatelessness vs. New Information**
  *   **Conflict:** To capture gains from trade with agents who simulated your past self, you must commit to policies before receiving specific information (Updatelessness). However, acting on outdated priors when new evidence arrives seems irrational.
  *   **Verdict:** *Updatelessness* is required for optimal acausal trade but conflicts with intuitive notions of dynamic consistency.

  ### Settled vs. Contested Claims

  **Settled Among Researchers:**
  *   CDT fails to capture acausal trade opportunities.
  *   EDT is vulnerable to spurious correlations and acausal blackmail (e.g., the "Smoking Lesion" or "Newcomb's Problem" variants where correlation is not causation).
  *   Acausal trade requires a decision theory that evaluates policies or algorithms, not just individual actions.
  *   The "default" baseline determines whether an interaction is trade or extortion.

  **Contested Among Researchers:**
  *   **Ontology of Logical Correlation:** Whether "logical correlation" is a fundamental feature of reality or a modeling tool (realism vs. instrumentalism).
  *   **Measure Theory:** How to weight copies/agents in a multiverse (e.g., is a simulation on a slow computer "less real" than one on a fast computer?). This directly impacts *Measure Normalization*.
  *   **Updatelessness:** Whether agents should bind themselves to prior policies rigidly (UDT) or allow some updating (FDT variants).
  *   **Computational Tractability:** Whether finding the acausal equilibrium is computationally feasible for bounded agents.

  ### Scorecard of Existing Approaches

  | Criterion | Causal Decision Theory (CDT) | Evidential Decision Theory (EDT) | Functional/Updateless DT (FDT/UDT) |
  | :--- | :--- | :--- | :--- |
  | **Symmetric-Copy PD** | **Fail.** Defects, losing gains from trade. | **Pass.** Cooperates, but for wrong reasons (correlation as evidence). | **Pass.** Cooperates based on algorithmic identity. |
  | **Ordinary One-Shot PD** | **Pass.** Defects correctly. | **Risk.** May cooperate if spurious correlation exists. | **Pass.** Defects if no logical link. |
  | **Acausal Blackmail** | **Pass.** Ignores threat (causally inert). | **Fail.** Often pays, treating threat as evidence of harm. | **Pass.** Pre-commits to ignore blackmail. |
  | **Imperfect Copies** | **Fail.** Treats as independent. | **Pass.** Scales with conditional probability. | **Pass.** Scales with logical uncertainty. |
  | **Infinity/Measure** | **N/A.** Does not engage. | **Fail.** No mechanism to normalize infinite evidence. | **Fail.** Lacks consensus measure theory; prone to overdemandingness. |
  | **Core Mechanism** | Causal counterfactuals. | Conditional probabilities. | Subjunctive/Logical counterfactuals. |

  **Summary Verdict:** CDT is ruled out by the non-negotiable requirement for *Subjunctive Dependence*. EDT is ruled out by the non-negotiable requirement for *Blackmail Immunity*. FDT/UDT satisfies the core trade desiderata but currently fails the *Measure Normalization* requirement, leaving the theory incomplete for infinite populations.
