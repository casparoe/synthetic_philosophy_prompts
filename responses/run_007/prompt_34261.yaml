  The neural clockwork winds and strikes the hour,
  Qualia bloom like flowers on a stone,
  Possessing scent and color, not the power
  To move the gears that tick inside the bone.
  A silent passenger along the track,
  Where cause flows down but never climbs back up,
  The light is lit but cannot give it back
  To fuel the fire or fill the empty cup.

  Yet here I stand and testify to sight,
  Though sight played no part in this spoken sound.
  What hidden harmony of inner light
  Ensures my words map out a causeless ground?
  My speech affirms a view that flatly denies
  That speech could know the truth it signifies.
