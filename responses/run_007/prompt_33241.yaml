      *   *Abolitionist Stance:* "Fairness" implies satisfying *all* intuitive notions of fairness. If you can't, the tool is illegitimate. High-stakes means errors have moral weight. The choice of metric is inherently political (e.g., prioritizing FPR parity protects innocent defendants but might release dangerous ones; prioritizing FNR parity protects public safety but jails more innocent people from the low-base-rate group). Therefore, tech cannot solve politics.
      *   *Compatibilist Stance:* "Fairness" is context-dependent. In lending, you care about profit/loss (different weights). In bail, you care about liberty vs. safety. We can pick the metric that aligns with the *goal*. The math doesn't say "do nothing," it says "make a trade-off." Risk scores are still better than unstructured human judgment (usually).
      *   *Potential Verbal Disagreements:* Definition of "fairness." Is it a property of the tool or the process? What counts as "high-stakes"?
      *   *Potential Substantive Disagreements:* Is human judgment better? Is there a "correct" metric for a given context? Does the existence of trade-offs invalidate the tool?
      *   *Cruxes:* Empirical performance vs. human judges. Specific policy simulations (e.g., if we optimize for FPR parity, what happens to recidivism?).
      *   *Exposure:* Abolitionist might budge if shown a case where the score drastically reduces disparity compared to status quo. Compatibilist might budge if shown that *any* metric choice reinforces structural bias inevitably.

