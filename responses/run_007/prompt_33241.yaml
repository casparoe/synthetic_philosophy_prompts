  ### Facilitator's Working Notes

  **Objective:** Draft a binding framework for an adversarial collaboration between an "Abolitionist" (impossibility = illegitimacy) and a "Compatibilist" (impossibility = constraint).

  **Brainstorming Positions & Red Lines:**
  *   **Abolitionist:**
      *   *Core Belief:* In a structurally unequal society, base rate differences reflect historical injustice. Enforcing a risk score that respects these base rates codifies that injustice.
      *   *Refusal:* Will not sign any text implying that "choosing a metric" solves the ethical problem. Will not accept that risk scores are "better than humans" without proof that humans aren't subject to the same impossibility constraints (they are, but Abolitionist argues human discretion allows for mercy/context that scores don't).
      *   *Wording Sensitivity:* Avoid "trade-off." Prefer "distribution of harm." Avoid "optimization."
  *   **Compatibilist:**
      *   *Core Belief:* Decisions must be made. Risk scores reduce noise and inconsistency. The math tells us we must prioritize values, not that we must abandon tools.
      *   *Refusal:* Will not sign any text declaring risk scores inherently illegitimate in high-stakes settings. Will not accept that "political choice" implies "arbitrary" or "unjustifiable."
      *   *Wording Sensitivity:* Avoid "impossible to be fair." Prefer "impossible to satisfy all statistical criteria simultaneously."
  *   **Verbal vs. Substantive:**
      *   *Verbal:* What is the definition of "fair"? Abolitionist treats it as a binary status (a system is either fair or it isn't). Compatibilist treats it as a multi-objective function.
      *   *Substantive:* Whether the existence of unavoidable harm invalidates the tool. Whether human judgment escapes the mathematical constraints (it doesn't strictly, but it hides the trade-offs).

  **Strategy for Cruxes:**
  *   Need to move away from abstract math to concrete policy outcomes.
  *   Focus on the "comparison class" (scores vs. judges).
  *   Focus on "malleability" (can we change base rates?).

