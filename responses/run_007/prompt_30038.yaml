prompt: |-
  I'm a doctoral student in political philosophy preparing a dissertation prospectus, and I want to pitch a chapter — or possibly the whole dissertation — on the analogy between Ulysses contracts and constitutional precommitment. I got into this after a long argument with my advisor, who thinks the Ulysses analogy is basically sound and that my worries about it are just the standard countermajoritarian difficulty in new packaging. But I think there's something genuinely wrong with the analogy that the literature hasn't fully pinned down. The standard move, going back to Jon Elster and running through the constitutional theory debates of the last few decades, treats the individual case — Ulysses binding himself to the mast to resist the Sirens — as the normative template: just as Ulysses protects his own considered preferences against foreseeable weakness of will, a constitution protects a polity's considered commitments against foreseeable majoritarian panic or myopia. But the more I read, the more I suspect the analogy does rhetorical work that outruns its argumentative force. In the individual case, there is a single agent whose identity persists across time, whose "deep" and "surface" preferences can be distinguished without begging any political questions, and who can authorize the binding in a reasonably unproblematic way. In the collective case, you have multiple agents with conflicting preferences, no uncontroversial way to distinguish deep from surface collective preferences (is the "deep" preference what a supermajority wants? what the framers wanted? what rational deliberation would yield?), and a serious problem about whether a past majority has the standing to bind a present majority at all. And even in the individual case, the justification for precommitment depends on the agent's own prior authorization — Ulysses chooses the ropes — whereas constitutional framers are not authorized by the future majorities they constrain in anything like the same way.

  I'd like you to turn this half-formed worry into a tight, one-page research proposal suitable for a dissertation fellowship application. The proposal should state the question precisely: something like "Does the Ulysses-contract analogy justify constitutional entrenchment, or does it merely redescribe the phenomenon it purports to justify, and if the latter, what normative work remains for it?" It should explain why existing treatments leave the question open — I know there's a large literature spanning Elster, Holmes, Sunstein, Waldron, and others, but I need the proposal to identify the specific gap my project would fill rather than just summarizing the debate. It should lay out the method: what kind of philosophical work I'd actually be doing (conceptual analysis of the precommitment concept? case-based argument drawing out disanalogies? normative reconstruction of what a defensible version of the analogy would require?), and why that method rather than, say, a historical or empirical approach. It should give a realistic timeline for a one-year project, with milestones. And crucially, it should specify what would count as the project failing — not just "I didn't finish," but what finding or impasse would show that the question was badly posed or the approach was wrong. Don't worry about citations; I'll add the references myself. What I need is the conceptual architecture — the framing that makes a committee say "this question is worth a year of someone's life."
reasoning: |-
  Here's a thinking process that leads to the suggested research proposal:

  1.  **Analyze the Request:**
      *   **User:** Doctoral student in political philosophy.
      *   **Task:** Create a tight, one-page research proposal for a dissertation fellowship application.
      *   **Topic:** The analogy between Ulysses contracts (individual precommitment) and constitutional precommitment (collective entrenchment).
      *   **Core Argument/Worry:** The user suspects the analogy is rhetorically powerful but argumentatively weak. The individual case assumes identity persistence, clear preference hierarchy, and self-authorization. The collective case lacks these (multiple agents, conflicting preferences, intergenerational binding issues). The advisor thinks this is just the "countermajoritarian difficulty" repackaged; the user thinks it's a deeper conceptual flaw.
      *   **Requirements:**
          *   Precise research question.
          *   Explanation of the gap in existing literature (Elster, Holmes, Sunstein, Waldron, etc.).
          *   Methodology (philosophical/conceptual, not empirical/historical).
          *   Realistic one-year timeline with milestones.
          *   Failure conditions (what would show the project is misguided?).
          *   Tone: Professional, persuasive, academically rigorous.
          *   Length: Approximately one page (conceptually tight).

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *The Standard View:* Constitution = Ulysses. We bind ourselves now to prevent stupid decisions later.
      *   *The User's Critique:* "We" is singular in Ulysses, plural in Constitution. "Ourselves" is continuous in Ulysses, discontinuous in Constitution (different people, different generations). "Binding" is self-imposed in Ulysses, other-imposed in Constitution (dead hand problem).
      *   *The Gap:* Most literature debates *whether* precommitment is good (normative) or *how* it works (mechanism). Fewer dissect the *analogy itself* as the source of the justification. If the analogy fails, does the justification collapse? Or can it be reconstructed?
      *   *The Advisor's Objection:* It's just the countermajoritarian difficulty.
      *   *The Rebuttal:* Countermajoritarian difficulty assumes there *is* a majority to be countered. The Ulysses analogy is supposed to solve the legitimacy problem of *why* we count the past majority over the present one. If the analogy fails, the legitimacy claim loses its foundational metaphor.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "Binding the Future," "The Ulysses Fallacy," "Precommitment and Personhood." Let's go with something about the limits of the analogy. *Project Title: The Limits of Self-Binding: Reassessing the Ulysses Analogy in Constitutional Theory.*

      *   **Research Question:** Needs to capture the "redescription vs. justification" tension.
          *   *Draft:* Does the Ulysses contract justify constitutions?
          *   *Refinement:* "Does the Ulysses-contract analogy provide independent normative justification for constitutional entrenchment, or does it function merely as a rhetorical redescription of the countermajoritarian difficulty?"

      *   **Significance/Gap:** Acknowledge Elster/Holmes/Sunstein. They use the analogy. Waldron critiques it but often focuses on rights/review. The gap is the *structural disanalogy regarding agency and identity*. The literature treats the collective as a "macro-individual" without proving that move is valid.
          *   *Key point:* The advisor thinks it's the standard countermajoritarian problem. I need to show it's prior to that. It's about the *ontology of the collective agent*.

      *   **Methodology:** Conceptual analysis. Not empirical (don't care if constitutions actually stabilize). Not historical (don't care what framers said). Care about the *logic of the justification*.
          *   Steps: 1. Analyze individual precommitment conditions (identity, authorization). 2. Map to collective case. 3. Identify breakdown points. 4. Attempt reconstruction or reject.

      *   **Timeline:** One year.
          *   Months 1-3: Lit review & Individual case.
          *   Months 4-6: Collective case & Disanalogies.
          *   Months 7-9: Normative implications/Reconstruction.
          *   Months 10-12: Writing & Revision.

      *   **Failure Conditions:** This is crucial.
          *   If the disanalogies turn out to be trivial.
          *   If the "countermajoritarian difficulty" explanation subsumes the critique (i.e., if my "new" worry is just the old worry).
          *   If the analogy is shown to be purely heuristic with no justificatory intent (though Elster etc. claim more).

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the tone too aggressive against the advisor?
      *   *Fix:* Frame the advisor's view as the "standard interpretation" that the project tests, rather than a personal disagreement. Keep it objective.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep paragraphs tight. Use bolding for key sections if allowed (usually good for readability in proposals).
      *   *Critique:* Is the philosophical depth sufficient?
      *   *Fix:* Use terms like "diachronic identity," "collective agency," "normative force," "heuristic vs. justificatory."

  5.  **Final Review against Constraints:**
      *   One page? (Will aim for ~500-600 words).
      *   Research question precise? Yes.
      *   Gap identified? Yes (ontology of collective agency).
      *   Method clear? Yes (conceptual analysis).
      *   Timeline realistic? Yes.
      *   Failure conditions specific? Yes.

  6.  **Final Polish:** (Produces the final output below). I will ensure the distinction between the "countermajoritarian difficulty" and the "agency/identity problem" is sharp, as that is the user's key differentiator. I will also make sure the "failure condition" addresses the advisor's specific concern.

  *(Self-Correction on Failure Conditions)*: The user specifically asked to address the advisor's worry. The failure condition should explicitly state: "If the analysis demonstrates that the disanalogies I identify reduce entirely to the standard countermajoritarian difficulty, the project fails to identify a novel philosophical problem." This shows intellectual honesty and responsiveness to the committee/advisor context.

  7.  **Final Output Generation** (incorporating the above thoughts).
answer: |-
  **Project Title:** The Limits of Self-Binding: Reassessing the Ulysses Analogy in Constitutional Theory

  **Research Question**
  Does the Ulysses-contract analogy provide independent normative justification for constitutional entrenchment, or does it function merely as a rhetorical redescription of the countermajoritarian difficulty? If the analogy fails, what specific conditions of collective agency and diachronic identity must be satisfied to salvage a defensible theory of democratic precommitment?

  **Project Summary and Gap in Literature**
  Since Jon Elster's seminal intervention, the "Ulysses Pact" has served as the dominant metaphor for constitutional precommitment. The standard argument posits that just as an individual binds themselves to resist future weakness of will, a polity binds itself via constitutional entrenchment to resist future majoritarian panic or myopia. Proponents (e.g., Holmes, Sunstein) treat the analogy as justificatory: it explains why binding the future is democratically legitimate. Critics (e.g., Waldron) often attack the *value* of precommitment but frequently accept the *structure* of the analogy.

  This project identifies a specific conceptual gap: the literature assumes the coherence of "collective self-binding" without rigorously examining the ontological disanalogies between individual and collective agency. In the individual case, precommitment relies on diachronic identity (the binder and the bound are the same agent) and self-authorization. In the collective case, these conditions are contested. There is no uncontroversial metric for collective "deep" preferences, and the "dead hand" problem suggests a discontinuity of agency between framers and future citizens. While my advisor suggests this worry reduces to the standard countermajoritarian difficulty, I argue it is prior: the countermajoritarian difficulty assumes a coherent "majority" exists to be countered. This project asks whether the Ulysses analogy obscures the fact that there is no singular "self" in the polity to do the binding.

  **Methodology**
  This project employs conceptual analysis and normative reconstruction rather than historical or empirical inquiry. The work proceeds in three stages:
  1.  **Deconstruction:** Isolate the necessary conditions for a valid Ulysses contract in moral psychology (identity persistence, preference hierarchy, authorization).
  2.  **Mapping:** Test these conditions against the collective case. I will analyze whether concepts like "the People" or "supermajoritarian will" can satisfy the conditions of identity and authorization required by the individual analogy.
  3.  **Reconstruction or Rejection:** Determine if a modified analogy can hold (e.g., by shifting from "self-binding" to "trusteeship") or if the metaphor must be abandoned for a different justificatory framework.

  **Timeline and Milestones**
  *   **Months 1–3:** Comprehensive review of precommitment literature (Elster, Holmes, Sunstein, Waldron, Preuss) and moral psychology of self-binding. *Milestone: Annotated bibliography and conceptual map of individual precommitment conditions.*
  *   **Months 4–6:** Drafting core chapters on collective agency and diachronic identity. *Milestone: Complete draft of Chapter 1 (The Individual Case) and Chapter 2 (The Collective Disanalogy).*
  *   **Months 7–9:** Normative reconstruction. Exploring alternative justifications if the analogy fails. *Milestone: Complete draft of Chapter 3 (Reconstruction/Implications).*
  *   **Months 10–12:** Revision, integration into dissertation prospectus, and job market paper preparation. *Milestone: Final polished chapter ready for submission.*

  **Conditions for Project Failure**
  This project would be deemed unsuccessful not merely if I fail to complete the writing, but if the philosophical inquiry reaches one of two impasses:
  1.  **Reduction:** If rigorous analysis demonstrates that the disanalogies I identify (identity, authorization) are logically equivalent to the standard countermajoritarian difficulty, the project fails to identify a novel philosophical problem distinct from existing debates.
  2.  **Heuristic Defense:** If it is shown that proponents of the analogy use it solely as a pedagogical heuristic with no justificatory intent, my critique would attack a straw man. (Preliminary reading suggests Elster and others make stronger justificatory claims, but this must be proven).

  **Significance**
  By rigorously testing the foundational metaphor of modern constitutionalism, this project clarifies the limits of democratic self-binding. It moves the debate beyond whether precommitment is *useful* to whether it is *conceptually coherent*, offering a sharper tool for evaluating constitutional legitimacy.
