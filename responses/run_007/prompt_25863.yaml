prompt: |-
  Hey, I'm a PhD student in philosophy of mind and I was talking to my officemate (also a grad student, but he works on AI ethics) about Dennett, and he gave me this summary of how the intentional stance applies to LLMs:

  "Dennett says that when a system is too complex to predict from the physical stance or the design stance, you should adopt the intentional stance — you treat it as a rational agent with beliefs and desires and predict its behavior by asking what a rational agent would do given those beliefs and desires. For LLMs, this means we should literally attribute beliefs to them, because the intentional stance is the only way to make sense of their outputs. And here's the key move: Dennett argues that there's nothing more to having a belief than being a system reliably predictable by the intentional stance. Beliefs just are the posits of a successful intentional stance. So if the stance works for an LLM — and it clearly does, we talk about what GPT-4 'thinks' or 'knows' all the time — then the LLM has beliefs in exactly the same sense you or I do. The substrate doesn't matter; it's multiple realizability all the way down."

  I've read Consciousness Explained and some of The Intentional Stance, but I haven't kept up with the recent debates about AI. My gut says he's overreaching — I remember Dennett being pretty careful about not equating the intentional stance with genuine mentality, and I think he'd want to say that LLMs lack something important (comprehension? consciousness? the right kind of evolutionary history?). But my officemate insists this is just the standard reading and I'm importing Cartesian assumptions. Can you go through this summary claim by claim and tell me what's fair to Dennett, what's a distortion, and whether the conclusion about LLMs actually follows from the parts he gets right?
