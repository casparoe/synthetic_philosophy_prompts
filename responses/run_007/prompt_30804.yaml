answer: |-
  It is completely understandable that you find yourself wrestling with these conflicting intuitions, especially given the personal weight of your grandmother's situation. What you are describing is a version of a classic problem in bioethics often framed as the conflict between precedent autonomy and current well-being, but your specific set of commitments adds nuance that deserves careful untangling. You have assembled a position that is actually quite sophisticated, even if it feels unstable to you right now. The good news is that these commitments can be made coherent, but it requires prioritizing which tensions are fundamental and which are merely practical. I think the most serious tension you face lies between your third and fourth commitments, specifically the clash between the thin psychological continuity in dementia and the enduring force of the advance directive. If the person now is effectively different from the person who wrote the directive, the metaphysical foundation for respecting that directive crumbles. This is the deepest philosophical hurdle because if there is no meaningful connection between the selves, it is hard to explain why the past self's voice should silence the current self's experience. This tension is more serious than the others because it attacks the justification for the practice itself, rather than just its application.

  The second most serious tension exists between your first and fifth commitments, which is the practical ethical conflict between respecting the prior wish and honoring the current happiness. This is less metaphysical than the first tension but more urgent in a clinical setting. You want the directive to carry weight, yet you also believe that ending a life that is currently enjoyed is wrong. This creates a instability in decision-making because it is unclear where the boundary lies. The third and least serious tension, though practically dangerous, is between your fifth and sixth commitments regarding the loophole problem. You want to allow exceptions for happiness but fear that doing so destroys the rule. This is a problem of implementation and safeguards rather than fundamental moral theory, which is why I rank it as the least serious of the three, even though it is the one most likely to cause harm in the real world if mishandled.

  To bring these into line without abandoning your core intuitions, you need to shift the justification for the advance directive away from identity and toward narrative integrity. This addresses your second commitment about rejecting the ownership model. You do not need to claim that the earlier self owns the later body to argue that the earlier self's wishes matter. Instead, you can argue that we have an obligation to respect the integrity of a person's life as a whole narrative. The directive is not a contract or a property claim, but a final chapter written by the author of the life story. Even if the character in the final chapter has changed significantly, disregarding the author's intended ending fractures the coherence of the entire life. This allows you to hold that the directive has force despite the thin psychological continuity, satisfying your third and fourth commitments. The past self has a legitimate claim not because they are the same person, but because they are the author of the life being lived, and there is value in respecting that authorship unless the cost to the current inhabitant is too high.

  This narrative framework helps resolve the conflict between respecting the directive and overriding it for current happiness. You can maintain that the directive should generally prevail because it protects the critical interests of the life plan, which survive incapacity, whereas the current happiness often reflects only experiential interests. However, you can allow for overrides when the current well-being is not just fleeting pleasure but represents a significant engagement with the world that the earlier self would have recognized as valuable had they known this specific outcome was possible. This sets a high bar for overriding the directive, which protects you from the loophole problem. It is not enough that she enjoys pudding or smiles at routines; the exception should require evidence that the current life has a quality and engagement that makes the termination of it a profound harm to the being who exists now. This distinguishes between a life that is merely pleasant and a life that has regained a form of meaningfulness that outweighs the prior refusal.

  To address your fear about gutting the practice through loopholes, you need to couple this high bar with procedural safeguards. You can argue that overriding an advance directive should never be a unilateral decision by a family member based on a subjective impression of happiness. Instead, it should require an independent assessment, perhaps by an ethics committee or a second medical opinion, to verify that the current state is one of genuine contentment and not just a lack of distress that is being misinterpreted. This satisfies your sixth commitment by making the exception difficult to access, ensuring it remains a rare deviation rather than a new norm. By treating the directive as a strong presumption grounded in narrative integrity, rather than an absolute command grounded in ownership, you create a system where the past self is honored by default, but the current self is protected from profound suffering or the loss of a unexpectedly valuable existence.

  Bringing this all together for your discussion group, you can present your view as a modified narrative account. You acknowledge the metaphysical break in identity but argue that moral respect extends across that break due to the value of life-story integrity. You admit that current well-being can override prior wishes, but only when that well-being is robust and verified through strict procedures, preventing the slippery slope you rightly fear. This allows you to keep all six commitments by reordering their priorities. The directive holds because of the life narrative, not identity. The override is permitted because critical interests can shift in extreme cases, but the safeguard ensures the override is not abused. This position is coherent, defensible, and sensitive to the tragedy of your grandmother's condition without sacrificing the principles that protect vulnerable people in the medical system.
