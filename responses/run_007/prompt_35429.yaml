      *   *Influence-Based/Power Views (e.g., Foucault, propaganda models):* Focus on structural power and shaping the "horizon of thought."
          *   *Application:* It didn't just sell a cigarette; it redefined what a cigarette *meant*.
          *   *Verdict:* Deep manipulation (propaganda).

  4.  **Task 3: Evaluating the Distinction (The "Stress Test"):**
      *   *Does it sharpen the distinction?* Yes, regarding *source transparency*. It highlights that hiding the *agent* of persuasion is a key marker of manipulation.
      *   *Does it expose a gap?* Yes, regarding *complicit participants*. Some marchers knew. Were they manipulators or manipulated? They were used as means, even if willing. This complicates the "victim" model of manipulation.
      *   *Spectrum vs. Cutoff:* Suggests a spectrum of *transparency*. It's not binary.
