  ### Nearest existing concepts

  The literature offers several adjacent concepts. The **reductionism/anti-reductionism debate** (Hume vs. Reid) frames the normative question: do we need positive reasons to accept testimony, or is trust default? **Motivated reasoning** (Kunda) explains why we process information to reach preferred conclusions, often altering evidence weighting or memory retrieval. **Confirmation bias** describes the tendency to search for or interpret evidence favoring existing beliefs, typically affecting evidence gathering rather than acceptance thresholds. In social epistemology, **testimonial injustice** (Fricker) involves assigning credibility deficits due to identity prejudice, while **epistemic partiality** (Friend) argues relationships might justify bias. **Selective skepticism** describes doubting claims based on source rather than content. **Identity-protective cognition** (Kahan) is perhaps closest, suggesting people reject facts threatening their group identity. **Echo chamber theory** (Nguyen) explains how communities discredit outside sources, but focuses on social structure rather than individual cognitive switching. While these explain *why* we doubt or *who* we doubt, none precisely capture the mechanism of shifting the *epistemic standard itself*—from default entitlement to burden-of-proof—based solely on propositional congruence. This pattern sits at the intersection of psychology and normative epistemology, lacking a specific single label despite being widely observable in polarization studies and science communication research regarding how laypeople evaluate current expert consensus.

  ### How the described pattern differs

  The described pattern differs fundamentally because it operates at the meta-epistemic level. Confirmation bias and motivated reasoning typically involve filtering evidence or weighting arguments differently to support a conclusion. Here, the evidence (the testimony) is identical; what changes is the rule of inference applied to it. Dan isn't weighing the journalist's report differently; he is changing the requirement for what counts as a valid report. Unlike testimonial injustice, which targets the speaker's identity (e.g., gender, race), this asymmetry targets the proposition's content relative to priors. The speaker remains; the credibility deficit is triggered by the claim, not the claimant. Furthermore, this isn't mere cherry-picking, where one selects favorable data from a mix. This is accepting unfavorable data structures when they yield favorable results. The subject genuinely feels they are being principled: trust is the default for "safe" claims, while scrutiny is the default for "dangerous" ones. Distinguishing it from hypocrisy, it is a structural shift in epistemic policy that feels internally consistent because the subject perceives the "dangerous" claim as inherently requiring more proof due to its counter-intuitive nature, masking the bias as rigorous skepticism. Crucially, standard biases assume a fixed standard of proof applied unevenly; this phenomenon involves changing the standard itself. The agent moves from an anti-reductionist stance (trust unless defeated) to a reductionist stance (verify before trusting) without acknowledging the shift, driven by conclusion comfort. This makes it resistant to correction, as appealing to consistency is met with claims that the "risky" claim simply warranted extra caution.

  ### A name and definition

  **Proposed Name:** Asymmetric Testimonial Defaulting (ATD).
  **Definition:** ATD is the cognitive practice of applying anti-reductionist epistemic standards (default trust) to testimony that aligns with prior beliefs, while applying reductionist standards (burden of proof on the speaker) to testimony that contradicts them. It is not merely weighting evidence differently, but shifting the threshold for credibility acceptance based on propositional congruence.
  **Examples:** Consider a voter who accepts a poll showing their candidate leading without checking methodology (default trust), but demands rigorous sample size analysis for a poll showing their candidate losing (burden of proof). Or a patient who accepts a doctor's diagnosis confirming their self-assessment immediately, but seeks second opinions and literature reviews for a diagnosis contradicting their lifestyle habits. In both cases, the speaker's competence is assumed in the first instance and questioned in the second, not due to speaker features, but solely due to the alignment of the testimony with the listener's worldview. ATD captures the specific mechanism of shifting the default setting of trust rather than just the outcome of belief. It highlights that the agent is not merely biased in belief formation, but biased in epistemic policy selection, treating congruence as a proxy for reliability without acknowledgment of the double standard.

  ### Where this leaves the reductionism debate

  This pattern complicates the reductionism debate by revealing it as a false dichotomy in descriptive psychology. Humans are neither consistent reductionists nor anti-reductionists; we are opportunistic hybrids. For anti-reductionists (Reid), this is damaging: it shows default trust is not a stable principle but a fair-weather friend, easily abandoned when inconvenient. It suggests the "principle of credulity" is psychologically real only when costless. For reductionists (Hume), it is also problematic: it shows we do not consistently demand positive reasons for belief, even when we claim to value rigor. We only demand reasons when the belief is painful. This suggests the normative debate should shift from "which default is correct?" to "how do we enforce consistent standards?" The phenomenon implies that any viable epistemology must account for policy consistency as a virtue distinct from truth-tracking. If our natural tendency is to switch policies based on comfort, then normative epistemology must prescribe a strict fixed standard regardless of content. Ultimately, ATD suggests the reductionism debate misses the deep real human problem: not whether to trust, but our inability to apply the same rules of trust truly universally. The primary epistemic vice is not merely gullibility or skepticism, but inconsistency in applying epistemic norms.
