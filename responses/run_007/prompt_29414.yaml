  # Handout Supplement: Diagnostic Bongard Problem (Concept Learning)

  ## The Problem

  **Instructions:** Below are two panels. The six boxes in the **Left Panel** all share a hidden rule. The six boxes in the **Right Panel** all violate that rule. Your task is to determine the rule and classify the **Held-Out Items** at the bottom.

  **Visual Vocabulary:**
  *   **Shapes:** Circle (`o`), Triangle (`^`, `v`, `<`, `>` indicating orientation).
  *   **Size:** Large (`L`), Small (`S`). (Visually represented by diameter).
  *   **Location:** All figures appear within the **Center Cell** of a 3x3 grid. (Learners receive only the Grid ID `C`, not internal coordinates).
  *   **Fill:** All shapes are unfilled.

  ### Left Panel (Positive Examples)
  *All satisfy the hidden rule.*
  1.  **[Cell C]**: `L-Tri(^)` on left, `S-Circ` on right. (Triangle points **at** Circle).
  2.  **[Cell C]**: `L-Tri(v)` on top, `S-Circ` on bottom. (Triangle points **at** Circle).
  3.  **[Cell C]**: `L-Tri(<)` on right, `S-Circ` on left. (Triangle points **at** Circle).
  4.  **[Cell C]**: `L-Tri(>)` on left, `S-Circ` on right. (Triangle points **at** Circle).
  5.  **[Cell C]**: `L-Tri(^)` on bottom-left, `S-Circ` on top-right. (Triangle points **at** Circle).
  6.  **[Cell C]**: `L-Tri(v)` on top-right, `S-Circ` on bottom-left. (Triangle points **at** Circle).

  ### Right Panel (Negative Examples)
  *All violate the hidden rule.*
  1.  **[Cell C]**: `S-Tri(^)` on right, `L-Circ` on left. (Triangle points **away** from Circle).
  2.  **[Cell C]**: `S-Tri(v)` on bottom, `L-Circ` on top. (Triangle points **away** from Circle).
  3.  **[Cell C]**: `S-Tri(<)` on left, `L-Circ` on right. (Triangle points **away** from Circle).
  4.  **[Cell C]**: `S-Tri(>)` on right, `L-Circ` on left. (Triangle points **away** from Circle).
  5.  **[Cell C]**: `S-Tri(^)` on top-right, `L-Circ` on bottom-left. (Triangle points **away** from Circle).
  6.  **[Cell C]**: `S-Tri(v)` on bottom-left, `L-Circ` on top-right. (Triangle points **away** from Circle).

  ### Held-Out Items (To Classify)
  *   **Item A (Ordinary Positive):** [Cell C]: `L-Tri(>)` on left, `S-Circ` on right. (Points **at**).
  *   **Item B (Ordinary Negative):** [Cell C]: `S-Tri(<)` on right, `L-Circ` on left. (Points **away**).
  *   **Item C (Diagnostic Probe):** [Cell C]: `L-Tri(>)` on **right**, `S-Circ` on **left**. (Triangle points **away**).

  ***

  ## Analysis and Demonstration

  ### 1. The Hidden Rule
  **"The triangle points toward the circle."**

  ### 2. Verification of Training Set
  *   **Left Panel (1–6):** In every box, the vector originating from the triangle's apex intersects the circle's center. All satisfy the rule.
  *   **Right Panel (1–6):** In every box, the vector originating from the triangle's apex points in the opposite direction of the circle. All violate the rule.
  *   **Note on Features:** In all 12 training boxes, the Triangle and Circle occupy the same Coarse Grid Cell (`C`). A learner restricted to coarse location cannot distinguish their relative positions.

  ### 3. Held-Out Item Verdicts
  *   **Item A:** **Positive.** (Matches rule: Points at).
  *   **Item B:** **Negative.** (Matches rule: Points away).
  *   **Item C (Probe):** **Negative.** (Violates rule: Points away).

  ### 4. The Diagnostic Probe vs. Comparison Box
  To reveal the difference between learners, we contrast **Item C (Probe)** with a **Comparison Box (Item D)**.

  *   **Item C (Probe):** `L-Tri(>)` on Right, `S-Circ` on Left. (Points **Away**).
  *   **Item D (Comparison):** `L-Tri(>)` on Left, `S-Circ` on Right. (Points **Toward**).

  **Unary Feature Distribution (Identical for C and D):**
  *   **Triangle:** Shape=Tri, Size=Large, Orientation=Right, Location=Center-Cell.
  *   **Circle:** Shape=Circ, Size=Small, Orientation=None, Location=Center-Cell.
  *   **Bag of Features:** `{(Tri, L, R, C), (Circ, S, None, C)}`.

  ### 5. Learner Verdicts and Explanation

  **The Feature-Based Learner (FBL):**
  *   **Hypothesis Space:** Boolean combinations of unary properties (Shape, Size, Orientation, Coarse Location).
  *   **Induction from Training:** The FBL observes a perfect correlation in the training set: All Positive boxes contain a `Large-Triangle` and `Small-Circle`. All Negative boxes contain a `Small-Triangle` and `Large-Circle`. The FBL cannot use Orientation or Relative Position because Orientation varies randomly across Pos/Neg classes in the training set (e.g., `Tri-Right` appears in Left-Panel #4 and Right-Panel #4), and Coarse Location is identical (`C`) for all.
  *   **Learned Rule:** `Positive IF (Tri=Large AND Circ=Small)`.
  *   **Verdict on Probe (Item C):** **Positive.**
  *   **Reasoning:** Item C matches the unary feature signature of the Positive training examples (`Tri=L, Circ=S`). The FBL is blind to the internal arrangement within the cell.
  *   **Verdict on Comparison (Item D):** **Positive.**
  *   **Reasoning:** Identical features to Item C.

  **The Relational Learner (RL):**
  *   **Hypothesis Space:** Includes binary relations (e.g., `PointsTowards(x, y)`).
  *   **Induction from Training:** The RL ignores the size correlation (noting that size is irrelevant in other potential contexts) or prioritizes the invariant geometric relation. It identifies that `PointsTowards(Tri, Circ)` is the only property constant across all 6 Positive examples and absent in all 6 Negative examples.
  *   **Verdict on Probe (Item C):** **Negative.**
  *   **Reasoning:** Although the sizes match the positive prototype, the relation `PointsTowards` is false.
  *   **Verdict on Comparison (Item D):** **Positive.**
  *   **Reasoning:** The relation `PointsTowards` is true.

  ### 6. The Feature Doing the Work
  The diagnostic work is done by the **relative spatial vector** between the triangle's apex and the circle's center.
  *   **If this feature is removed:** If we treat the shapes as point-objects with no internal extent or sub-cell position (collapsing the "Left/Right within Cell" distinction), the relation `PointsTowards` becomes undefined. The example collapses into two indistinguishable bags of features, rendering the concept unlearnable without enriching the ontology.

  ### 7. Defense and Assessment
  A determined defender of the Feature-Based View might resist this conclusion in three ways:

  1.  **Enriching the Feature Set:** The defender might argue we should add `Relative-Position` as a unary property (e.g., `Tri-Is-Left-Of-Circle`).
      *   *Assessment:* This smuggles a relational predicate in under a unary name. `Is-Left-Of-Circle` is not a property the triangle has "on its own"; it is a function of the triangle *and* the circle. To compute this feature, the system must already bind the two objects, which is the relational capacity the feature-view claims to lack.

  2.  **Rejecting the Probe as Unnatural:** The defender might claim that a rule depending on sub-grid positioning within a coarse cell is "gerrymandered" and not a genuine cognitive concept.
      *   *Assessment:* This concedes the lesson. Cognitive science evidence (e.g., from infant cognition or visual attention) suggests organisms *are* sensitive to pointing and gaze direction even when categorical location is ambiguous. Denying the probe's validity protects the theory by excluding the very phenomena (relational sensitivity) it fails to explain.

  3.  **Denying the Fairness of the Test:** The defender might argue that if the input is truly coarse (Cell C), then the relation *does not exist* in the input stream, so the RL is cheating by seeing data the FBL does not.
      *   *Assessment:* This misunderstands the constraint. The constraint specifies the *features available for hypothesis formation*, not the raw sensory data. Perception often provides coarse categorical tags (e.g., "Center") while retaining analog spatial data for relational processing. The lesson is that concept learning requires more than just tagging objects with categories; it requires operations over the structure connecting them. If the FBL cannot access the structure, it cannot learn the concept, regardless of how much training data it receives.

  **Conclusion:** The probe demonstrates that learning from examples is not a single ability. What you can induce depends on what you can represent. A learner restricted to unary features will inevitably fail on concepts that are irreducibly relational, mistaking correlated accidents (size) for the rule (pointing).
