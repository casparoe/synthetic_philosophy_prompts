      *   *Colloquium vs. Independent Theorem:* Key difference is **confidentiality/trust** and **labor credit**. Colloquium implies a norm of non-appropriation before publication. Independent discovery respects the labor of the second prover (they did the work).
      *   *Gene Patenting:* Key difference is **discovery vs. invention** and **public good/access**. Genes are facts of nature; monopolizing them hinders science/health.

      *   *Emerging Themes:*
          1.  **Labor/Desert:** Did the user do the work? (Theorem: Yes. Colloquium: No.)
          2.  **Harm/Competition:** Does this undercut the original creator's livelihood? (Commercial sequel: Yes. Fan fic: No.)
          3.  **Transformative Use:** Does this add new value/meaning? (Sampling: Yes. Chorus lift: No.)
