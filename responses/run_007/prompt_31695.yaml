answer: |-
  **MEMORANDUM**

  **TO:** Bargaining Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Strategy on Public Resolutions Prior to Negotiations

  **Purpose**
  We are split on whether to pass a public resolution now, nine months out, committing us to no less than 6% wage increase and zero shift in health-care costs. This memo outlines why I believe we should hold off on making that pledge public until later in the process, and proposes a concrete timeline for building our leverage without painting ourselves into a corner.

  **The Case for Taking a Stand**
  I want to start by acknowledging the strength of the argument for this resolution. The proponents are right about one thing: negotiations are exhausting. Over months of talks, it is easy for a committee to get worn down and accept a deal that looks "reasonable" on paper but fails to meet our members' needs. By going public now, we intend to remove that pressure. We want management to know that we cannot retreat, so they won't waste time trying to push us below our baseline. It is a strategy designed to protect our unity.

  **The Risk of Mutual Lock-Down**
  However, there is a significant risk in making this pledge *before* we have exchanged proposals. Management has already publicly stated that wages are frozen. If we immediately respond with a public ultimatum of our own, we are not just stating our goals; we are daring them to match our rigidity.

  When one side builds a wall, the other side feels forced to build a wall. If we publicly lock the door on our end, and they lock it on theirs, neither side can move without looking weak. This creates a trap. We end up in a situation where a strike becomes the only way to break the deadlock, even if a deal was possible. We risk turning a negotiation into a showdown before we've even sat down at the table.

  We need to keep our demands firm, but we also need to keep our options open. We should save the public hardline stance for when it is most useful: when management is stalling, not when we are introducing ourselves.

  **Recommended Course of Action**
  I recommend we adopt the 6% and health-care goals as our *internal* mandate, but delay the *public* resolution. Here is a practical timeline for the next nine months:

  **1. Preparation Phase (Months 1–3)**
  *   **Action:** We adopt the 6%/health goals as our internal starting point. We do not publish this as an ultimatum.
  *   **Focus:** Survey the membership to confirm these numbers reflect their priorities. Gather data on inflation and company profits to back up our ask.
  *   **Message to Management:** In early meetings, we state clearly that these are our expectations based on economic reality, but we are ready to review their opening proposal.

  **2. Negotiation Phase (Months 4–7)**
  *   **Action:** Bargain in good faith. If management offers less than our goals, we reject it based on the data, not a public pledge.
  *   **Leverage:** If management cites their "wage freeze" public statement as a reason they can't move, we challenge that narrative with our data. We reserve the right to go public *if* they refuse to move off a frozen wage.
  *   **Benefit:** This keeps the pressure on them. They have the rigid public stance; we have the flexibility to expose them as unreasonable if they don't budge.

  **3. Escalation Phase (Month 8–9 / If Talks Stall)**
  *   **Action:** If we reach a stalemate near the expiration date, *then* we pass the public resolution.
  *   **Timing:** We announce to the membership and the press that we have authorized the committee to reject anything below our standards.
  *   **Benefit:** This maximizes impact. It shows we tried to negotiate, but now we are digging in. It gives us the "tied hands" advantage when it actually matters, without triggering an early deadlock.

  **Conclusion**
  We all want the same result: a strong contract without a strike if possible. Adopting a public no-concessions pledge today feels strong, but it actually reduces our maneuverability. By keeping our powder dry, we allow ourselves to be reasonable partners in the early stages while retaining the option to become immovable if management forces our hand later.

  I move we table the public resolution and adopt the timeline above.
