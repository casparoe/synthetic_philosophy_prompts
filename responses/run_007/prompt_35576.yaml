answer: |-
  The identification of the Kelly criterion with logarithmic expected utility is mathematically valid within a specific static optimization context but conceptually misleading, as it conflates a structural requirement for long-run survival with a psychological preference ordering over wealth states.

  ### Table of Correspondences and Divergences

  | Feature | Expected Utility (Logarithmic) | Kelly Criterion | Status of Mapping |
  | :--- | :--- | :--- | :--- |
  | **Objective Function** | Maximize $E[U(W)]$ where $U(W) = \ln(W)$ | Maximize asymptotic geometric growth rate $g = E[\ln(1+r)]$ | **Formally Equivalent** (under i.i.d. reinvestment) |
  | **Origin of Log** | Subjective preference; agent *happens* to value wealth logarithmically | Structural necessity; log is the unique function linearizing multiplicative compounding | **Divergent** (Preference vs. Physics of Growth) |
  | **Risk Aversion** | Diminishing marginal utility of wealth (psychological) | Avoidance of ruin/absorbing barrier at zero (mathematical necessity) | **Divergent** (Attitude vs. Constraint) |
  | **Temporal Domain** | Typically static or discounted sum of utilities | Dynamic path dependence; time is non-separable | **Divergent** (State vs. Path) |
  | **Probability Interpretation** | Ensemble average (expectation over parallel states) | Time average (expectation over sequential realization) | **Divergent** (Ergodic vs. Non-ergodic) |
  | **Normative Basis** | Axiomatic consistency (VNM rationality) | Performance dominance (asymptotic wealth maximization) | **Divergent** (Consistency vs. Success) |
  | **One-Shot Decisions** | Fully normative | Normatively weak without assumption of repeatability | **Divergent** (General vs. Conditional) |

  ### Analysis of the Disanalogies

  **1. The Ontology of the Utility Function**
  In standard Expected Utility (EU) theory, the utility function is a representation of subjective preferences satisfying axioms of completeness, transitivity, independence, and continuity. Choosing $U(W) = \ln(W)$ is treated as a specific parameterization of an agent's risk tolerance. In the Kelly framework, the logarithm is not a psychological parameter but a mathematical consequence of the law of large numbers applied to multiplicative processes. Maximizing the expected logarithm of wealth is equivalent to maximizing the time-average growth rate. The analogy quietly imports the subjectivity of EU into Kelly, suggesting the agent *chooses* log-utility due to risk aversion, whereas Kelly suggests the agent *must* use log-utility to avoid almost sure ruin in the long run, regardless of their psychological comfort with risk.

  **2. Ensemble vs. Time Averages (Ergodicity)**
  Standard EU maximizes the ensemble average: the expected value across all possible outcomes in a single period (or discounted sum thereof). This assumes ergodicity—that the average across parallel worlds equals the average across time for a single agent. Wealth dynamics under reinvestment are non-ergodic; the ensemble average wealth grows exponentially even as the typical trajectory goes to zero (if betting over-Kelly). Kelly maximizes the time average growth rate. By equating Kelly with log-EU, the literature often obscures this ergodicity break. The objection that EU ignores the path-dependence of ruin applies to standard EU but is the *central problem* Kelly solves. Therefore, objections to EU regarding its handling of risk do not automatically apply to Kelly, because Kelly modifies the objective function specifically to correct for the non-ergodicity that standard EU ignores.

  **3. The Nature of Risk Aversion**
  In EU, risk aversion is explained by the curvature of the utility function (diminishing marginal utility). In Kelly, "risk aversion" (betting less than the bankroll) is a structural requirement to prevent the wealth process from hitting the absorbing barrier at zero. A Kelly bettor does not bet less because they feel pain from losses; they bet less because multiplicative dynamics dictate that volatility drags geometric mean returns below arithmetic mean returns (volatility drag). The analogy imports the psychological explanation for risk aversion into a framework where risk aversion is a physical constraint of compounding.

  **4. Time and Discounting**
  In EU, time is typically handled via a discount factor $\delta^t$, separable from the utility function. In Kelly, time is embedded in the compounding structure $(1+r)^t$. There is no separable discount parameter; the "discounting" of future utility emerges from the probability of ruin and the geometric nature of growth. Treating Kelly as log-EU often leads to the erroneous insertion of arbitrary discount rates into Kelly models, which violates the growth-optimal logic where the horizon is effectively infinite.

  ### Conclusion and Recharacterization

  The conclusion that Kelly is "nothing but" log-utility EU does not survive once these disanalogies are explicit. While the *calculus* is identical in the specific case of i.i.d. reinvestment, the *justification* and *domain of applicability* differ fundamentally. The EU framing treats the log function as a contingent preference, vulnerable to objections regarding axiom violations (e.g., Allais paradox) or arbitrary functional form. The Kelly framing treats the log function as a derived necessity for survival in non-ergodic environments, immune to preference axioms but vulnerable to assumptions about repeatability and market structure.

  A more precise characterization is that **the Kelly criterion is the solution to the problem of non-ergodic multiplicative dynamics, which admits a static representation as logarithmic expected utility.** The relationship is one of formal coincidence under specific constraints, not conceptual identity. Kelly introduces distinctive normative content: it prioritizes time-average performance over ensemble-average expectation, thereby shifting the normative basis of decision theory from internal consistency of preferences to external performance of trajectories. Consequently, objections to EU based on psychological realism do not necessarily undermine Kelly, as Kelly's normative force derives from the mathematics of growth rather than the axioms of choice.
