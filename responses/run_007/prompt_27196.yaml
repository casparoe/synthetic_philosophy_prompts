      *   *The Audience:* Working writers care about *getting words on the page*. They might be skeptical of theory or see it as abstract navel-gazing. They need to feel the *utility* of the shift.
      *   *The Format:* 1 hour is short. Needs tight structure.
      *   *The Example:* The user wants to use a writer's notebook instead of Otto's notebook. Is this a mistake?
          *   *Pros:* Relatable, immediate.
          *   *Cons:* Risk of sounding like "keeping a journal is good." Needs to show *coupling* and *trust*, not just storage.
          *   *Verdict:* Not a mistake, *if* framed correctly. It needs to demonstrate *active cognitive offloading*, not passive storage.

