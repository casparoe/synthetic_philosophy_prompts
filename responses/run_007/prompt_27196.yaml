          *   *Risk:* Writers think "Oh, I should write more notes."
          *   *Fix:* Focus on a specific moment of *thinking in the notebook*. Not recording a thought, but *having* the thought via the arrangement of notes.
          *   *Requirement:* The example must show the notebook doing work the brain *can't* do alone (spatial manipulation, permanence during distraction).

      *   **Phase 3: Misconceptions & Timing:**
          *   *Misconception 1:* "It's just a metaphor." (Address early).
          *   *Misconception 2:* "My phone is literally part of my mind (biologically)." (Address mid-way).
          *   *Misconception 3:* "This means I need more tools." (Address near end).

      *   **Phase 4: Scope (What to leave out):**
          *   Don't get into the "Mark of the Cognitive" debate.
          *   Don't get into AI/LLMs (too distracting right now).
          *   Don't get into collective mind (too big).

      *   **Phase 5: The Closing Question:**
