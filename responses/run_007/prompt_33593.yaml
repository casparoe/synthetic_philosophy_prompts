      *   **The Problem:** Couldn't articulate what would *count against* this view (falsifiability/defeaters).
      *   **The Goal:** A sorted list of defeaters (fatal to awkward), an analysis of which a constructivist would concede vs. dismiss, and an honest assessment of whether the position is unfalsifiable (and if that's okay).
      *   **Tone:** Philosophical, rigorous, honest, nuanced.

  2.  **Initial Brainstorming & Categorization:**
