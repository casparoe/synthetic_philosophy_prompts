      *   *Crucial Point:* The "Fatal" defeater is usually internal inconsistency. Has Intuitionistic Logic been proven inconsistent? No. So there are no *logical* fatal defeaters. The fatal ones must be *philosophical* (e.g., inability to account for the success of classical math).
      *   *Refining "Unfalsifiable":* It's not empirically falsifiable, but it is *theoretically* vulnerable (e.g., if a decision procedure for Halting Problem was found, constructivism about arithmetic would collapse). Wait, if Halting Problem was decidable, classical math would still hold, but constructivism would be *vindicated* (since LEM would hold for those cases). Actually, if someone proved $\neg \neg P \to P$ generally, that would kill it. But that's impossible in the system.
