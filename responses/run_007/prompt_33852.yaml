      *   Real physics involves energy conditions (Gödel universe requires negative cosmological constant + rotating dust, not our universe).
      *   Activity ignores gravity's effect on the ship, focuses only on causal structure.

  8.  **Refining the Flow:**
      *   *Intro:* Hand out packets. "You are pilots. These are your navigation constraints."
