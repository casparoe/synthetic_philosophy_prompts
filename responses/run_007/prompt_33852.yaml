          *   *Better Idea:* A grid where the "Allowed Moves" change based on the row/column.
          *   *Best Idea for Philosophy:* Focus on the *causal structure*.
          *   *Activity Name:* "The Rotating Light-Cone Game."
          *   *Setup:* Each student gets a worksheet with a polar grid.
          *   *Rule:* At each step, you must move into your "Future Sector."
