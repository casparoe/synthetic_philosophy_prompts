      *   *Option D:* Decision-Theoretic/Pragmatic. (Focus on what action we take.)
      *   *Decision:* I will argue for the **Causal Structuralist** view, but I will frame it aggressively. The thesis won't be "it depends on the graph." The thesis will be: **"Simpson's Paradox proves that data alone is semantically empty. The only defensible rule is that no statistical adjustment is valid without a prior causal commitment."** This turns "it depends" into a hard constraint on methodology.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. "The Silence of the Data" or "The Arithmetic of Lies." Let's go with "The Arithmetic of Lies: Why Simpson's Paradox is a Crisis of Meaning."
