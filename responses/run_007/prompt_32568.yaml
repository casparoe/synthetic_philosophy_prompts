      *   *The Phenomenon:* $P(A|B) > P(A|\neg B)$ overall, but $P(A|B, C) < P(A|\neg B, C)$ and $P(A|B, \neg C) < P(A|\neg B, \neg C)$ for subgroups $C$.
      *   *The Conflict:* Which number represents the "real" effect? The big bucket or the split buckets?
      *   *The Positions:*
          1.  *Naive Realism:* The aggregated data is the truth; splitting introduces noise/small sample size issues.
