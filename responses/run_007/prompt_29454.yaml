answer: |-
  **Examination Question**

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1**

  An agent must choose between traveling to Damascus or Aleppo. A perfectly reliable Predictor has already predicted her choice. If the Predictor predicts Damascus, Death is waiting in Damascus; if the Predictor predicts Aleppo, Death is waiting in Aleppo. The agent dies if and only if she travels to the city where Death is waiting. She strictly prefers survival to death.

  Write an essay addressing the following:
  1.  Explain why this case generates a deliberative instability for Evidential Decision Theory (EDT) that is more severe than the tension found in Newcomb's Problem.
  2.  Explain why Causal Decision Theory (CDT) cannot resolve the choice via dominance reasoning, specifically addressing the relationship between the probabilities of the acts and the probabilities of the states.
  3.  Evaluate the "ratificationist" repair (deliberational equilibrium). Does adopting a mixed strategy genuinely solve the agent's predicament, or does it merely stabilize an arbitrary policy without improving the outcome?

  ***

  **Model Answer**

  The Death in Damascus problem presents a fatal challenge to standard decision theories because the agent's evidence regarding the state of the world is entirely constituted by her own intended action. Unlike Newcomb's Problem, where one box is transparently safe, here both options appear lethal conditional on choosing them.

  For Evidential Decision Theory, which maximizes expected utility based on conditional probabilities ($V(A) = \sum P(S|A)U(S)$), the case generates a self-undermining loop. If the agent leans toward Damascus, the conditional probability that Death is in Damascus rises to nearly 1, given the Predictor's reliability. Consequently, the evidential expected utility of Damascus plummets, making Aleppo appear superior. However, once she leans toward Aleppo, the conditional probability shifts: Death is now likely in Aleppo. Thus, whichever act she evidentially favors becomes evidentially disfavored. In Newcomb's Problem, EDT consistently recommends one-boxing; the conditional probabilities stabilize. In Death in Damascus, EDT offers no stable recommendation. Every available act provides evidence that makes the alternative act look better, rendering the theory action-guidingly inert.

  Causal Decision Theory attempts to bypass this by evaluating acts based on their causal consequences, using partition probabilities independent of the act ($P(S)$). However, CDT faces a structural deadlock here. To calculate expected utility, the agent needs the prior probability of the states (Death's location). But the state is determined by the Prediction, which matches the Act. Therefore, the probability of the state $S_D$ (Death in Damascus) is identical to the probability of the act $A_D$ (Going to Damascus). The agent cannot assign a probability to the state without first assigning a probability to her own choice. This creates a circularity: the expected utility of an act depends on the probability of the act itself. Furthermore, dominance reasoning fails. While going to Damascus is better if Death is in Aleppo, and going to Aleppo is better if Death is in Damascus, neither act is dominant because the "better" outcome for each act relies on a state that is unlikely to obtain if that act is performed. CDT cannot identify a uniquely rational act because the causal partition is probabilistically tied to the decision variables.

  To resolve this instability, ratificationists propose a deliberational equilibrium requirement: an agent should only choose an act that she would still choose after learning she was going to choose it. In this case, no pure strategy is ratifiable. If I decide "Damascus," I learn Death is there, and I would switch. However, a mixed strategy (e.g., assigning a 0.5 probability to each city) can achieve equilibrium. At 0.5, the expected utilities of both acts equalize, halting the deliberative oscillation.

  Yet, this repair is arguably superficial. It solves the problem of *deliberative stability*, but not the problem of *survival*. If the Predictor predicts the outcome of the mixed strategy (the actual city visited), the agent still dies, as the prediction will match the realized act. If the Predictor predicts the probability distribution itself, the agent might survive by forcing the Predictor to assign Death to a city the agent visits only 50% of the time. However, this requires the Predictor to target probabilities rather than actions, which contradicts the standard setup where Death meets the agent at the destination. Thus, the mixed strategy merely masks the underlying fatality. It allows the agent to stop worrying about which choice is rational, but it does not provide a rational basis for expecting to live. The equilibrium is mathematically stable but practically hollow; it stabilizes an arbitrary policy (the 50/50 split) without breaking the link between choice and death. Theories that cannot distinguish between stabilizing a decision process and securing a good outcome fail to capture the normative force of rationality in high-stakes environments.

  ***

  **Marking Scheme**

  **Total Marks:** 20 (5 Criteria × 4 Marks)

  | Criterion | Description of Required Content | Common Error / Note | A vs. B Distinction |
  | :--- | :--- | :--- | :--- |
  | **1. EDT Instability** | Must explain that conditional on any act, the probability of death approaches 1, making the alternative act always appear evidentially superior. | **Error:** Describing it as simply "bad outcomes" rather than shifting conditional probabilities. | **A:** Explicitly contrasts the shifting conditional probabilities with the stable conditional probabilities in Newcomb's. |
  | **2. CDT Probability Tie** | Must explain that $P(State)$ depends on $P(Act)$, creating circularity in the expected utility calculation, preventing a fixed prior. | **Error:** Claiming CDT fails simply because "correlation exists" without noting the endogeneity of the state probabilities. | **A:** Clearly articulates why this prevents the calculation of a unique maximum, rather than just saying dominance fails. |
  | **3. Comparison to Newcomb** | Must explicitly state why this is harder than Newcomb's (Newcomb has a stable optimal choice for EDT; Damascus does not). | **Error:** Treating the two cases as identical in structure regarding stability. | **A:** Integrates the comparison into the analysis of the theories rather than treating it as a separate factual claim. |
  | **4. Ratification Repair** | Must define ratification/equilibrium (choosing what you would choose knowing you chose it) and how mixed strategies achieve this (equalizing EU). | **Error:** Vague description of "thinking harder" or failing to mention mixed strategies/probabilities. | **A:** Explains *how* the 0.5 probability equalizes expected utilities to stop deliberation. |
  | **5. Critique of Repair** | Must argue that deliberative stability does not guarantee survival (outcome vs. process) or that the predictor defeats the randomization. | **Error:** Concluding the mixed strategy solves the problem because the math works out. | **A:** Distinguishes between solving the *decision* problem and the *practical* problem of survival. |

  **Grading Guidance:**
  *   **17-20 (A):** Seamless integration of all five points. The distinction between deliberative stability and survival outcomes is sharp. The explanation of the CDT probability circularity is precise.
  *   **13-16 (B):** Covers all five points but mechanically. May treat the Newcomb comparison as an add-on. The critique of the repair may acknowledge the problem but lack precision on *why* the mixed strategy fails to save the agent.
  *   **9-12 (C):** Identifies EDT/CDT problems but misses the specific "harder than Newcomb" nuance or the probability circularity in CDT. Repair discussion is vague.
  *   **0-8 (D):** Significant misunderstandings of the case setup or decision theoretic formulas. Fails to address the repair.
