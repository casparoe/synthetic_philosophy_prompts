          5.  Critique of the repair (arbitrariness).
      *   *Key Content:*
          *   EDT: $V(D) = P(Death|D) \times U(Death)$. Since $P(Death|D) \approx 1$, $V(D)$ is low. But if I decide $A$, $P(Death|A) \approx 1$. So whichever I lean toward, the other looks better. Infinite loop.
          *   CDT: States are $S_D$ (Death in Dam) and $S_A$ (Death in Ale). $U(D|S_D)$ is bad, $U(D|S_A)$ is good. No act dominates. Probabilities of states depend on act probabilities (correlation without causation).
          *   Repair: Ratificationism (choose act you would choose knowing you chose it). Mixed strategy (50/50).
