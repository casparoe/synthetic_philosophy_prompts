answer: |-
  ### Desiderata for an Adequate Account of Moorean Absurdity

  The following specifications outline the necessary conditions for any theory claiming to resolve Moore's Paradox. They distinguish between the phenomenological data that any successful theory must save (non-negotiable) and the theoretical commitments that divide competing camps (camp preference).

  **1. The Commissive Form**
  *   **Requirement:** The account must explain the specific irrationality or absurdity inherent in asserting or believing the proposition $p \land \neg B_I p$ (e.g., "It is raining, but I do not believe that it is").
  *   **Case/Consideration:** This is the canonical form of the paradox. The proposition can be true (it may be raining while I am unaware of it), yet asserting or believing it strikes the subject as fundamentally incoherent.
  *   **Status:** **Non-negotiable.** Any theory that fails to explain why this specific conjunction generates absurdity fails to address the core phenomenon.

  **2. The Omissive Form**
  *   **Requirement:** The account must explain the absurdity of the variant $p \land B_I \neg p$ (e.g., "It is raining, but I believe that it is not") and clarify its relationship to the commissive form.
  *   **Case/Consideration:** While logically distinct from the commissive form, the omissive form generates the same intuitive sense of absurdity. A complete theory must either treat them as equivalent in absurdity or provide a principled reason for any difference in status.
  *   **Status:** **Non-negotiable.** Standard literature treats these as paired manifestations of the same underlying conflict; ignoring one leaves the account incomplete.

  **3. The First-Person Present-Tense Restriction**
  *   **Requirement:** The account must explain why the absurdity vanishes when the proposition is shifted to the third person (e.g., "It is raining, but *he* does not believe it") or the past tense (e.g., "It was raining, but I did not believe it").
  *   **Case/Consideration:** Moorean sentences are not logical contradictions; if they were, the absurdity would persist across persons and tenses. The restriction indicates the absurdity is tied to the speaker's current epistemic access or self-ascription.
  *   **Status:** **Non-negotiable.** This is the defining boundary condition of the paradox. A theory that predicts absurdity in the third person or past tense is overgenerating.

  **4. Asymmetry with the Converse**
  *   **Requirement:** The account must explain why the converse proposition $B_I p \land \neg p$ (e.g., "I believe that it is raining, but it is not") is *not* Moorean absurd, despite being a conjunction of a belief report and a truth-claim.
  *   **Case/Consideration:** The converse is typically regarded as a humble admission of error rather than an absurdity. It is logically possible to have false beliefs. The theory must distinguish why "truth without belief" is absurd, but "belief without truth" is merely false.
  *   **Status:** **Non-negotiable.** Failing to distinguish the Moorean conjunction from the fallible belief report collapses the paradox into a general problem of error or ignorance.

  **5. Explanatory Scope regarding Locus (Belief vs. Assertion)**
  *   **Requirement:** The account must specify whether the absurdity attaches primarily to the *act of assertion*, the *state of belief*, or *both*, and justify this classification.
  *   **Case/Consideration:** Some intuitions suggest one cannot even *think* the Moorean thought coherently (doxastic absurdity), while others suggest the thought is merely irrational to *express* (pragmatic absurdity).
  *   **Status:** **Camp Preference.** This is the primary fault line between theories. Wittgensteinians and Doxastic Logicians typically prioritize the belief state; Griceans and Norm-of-Assertion theorists prioritize the speech act. An adequate theory need not choose "both," but it must non-arbitrarily justify its chosen locus.

  ***

  ### The Critical Filter: The First-Person Present-Tense Restriction

  The single desideratum that does the most work to exclude the leading accounts is the **First-Person Present-Tense Restriction**. This constraint proves most fatal because the core mechanisms of the Hintikka-style, Gricean, and Knowledge-Norm approaches are inherently agent-neutral or content-neutral, requiring significant auxiliary assumptions to capture the indexical peculiarity of Moorean absurdity. The **Hintikka-style doxastic-logic approach** treats belief as an operator subject to consistency rules (e.g., $B(p \land \neg Bp)$ is inconsistent); however, logical inconsistency applies equally to third-person attributions ($B_x(p \land \neg B_x p)$), failing to explain why attributing this state to *others* lacks the distinctive Moorean absurdity. The **Gricean implicature story** relies on violations of conversational maxims (Quality/Quantity), but conversational norms apply to all speakers; it struggles to explain why "John asserts p but doesn't believe it" does not trigger the same *self-undermining* phenomenology as the first-person case. Finally, the **Knowledge-Norm-of-Assertion view** posits that one must not assert what one does not know; while this explains why asserting $p$ without belief is impermissible, it treats the norm as agent-neutral. It fails to explain why the *sentence itself* feels absurd in the first person but functions as a coherent description of ignorance in the third person. Consequently, this desideratum forces all three accounts to step outside their primary theoretical frameworks (logic, pragmatics, or epistemology) to incorporate a theory of self-knowledge or transparency, revealing it as the most stringent filter for adequacy.
