  # Joint Statement on the Ideal of Moral Sainthood
  **Prepared by the Adversarial Collaboration on Moral Ideals**
  **Date:** October 26, 2023

  ### Preamble
  We, the undersigned, represent two distinct camps in contemporary normative ethics. One camp defends the thesis advanced by Susan Wolf in "Moral Saints" (1982), arguing that a life of maximal moral goodness is not a rational or desirable human ideal. The opposing camp defends the traditional view that moral sainthood constitutes the highest human excellence and that reservations about it reflect moral deficiency rather than philosophical insight.

  Following a period of adversarial collaboration, we have identified significant common ground regarding the descriptive and conceptual landscape of this debate. However, deep normative disagreements remain. This document records our shared premises, maps our residual disagreements, and identifies the specific cruxes upon which future progress depends.

  ***

  ### Section I: Jointly Accepted Claims
  *Both signatories affirm the following propositions as true or methodologically necessary for this debate.*

  1.  **Definition of the Moral Saint:** We agree to define the "Moral Saint" as an individual whose life is governed by a commitment to maximizing moral value (whether utilitarian, deontological, or virtue-ethical) to the furthest extent possible, prioritizing moral obligations over personal preferences whenever a conflict arises.
  2.  **The Scarcity Constraint:** We agree that human time, energy, and cognitive attention are finite resources. Time dedicated to moral improvement or moral action is time not dedicated to other pursuits (e.g., hobbies, leisure, artistic development).
  3.  **Existence of Non-Moral Goods:** We agree that non-moral goods exist and are genuinely valuable. Both sides acknowledge that wit, aesthetic appreciation, culinary taste, and playfulness are positive traits that contribute to human flourishing and social attractiveness.
  4.  **Descriptive Phenomenology:** We agree on the empirical observation that ordinary people often find the concept of the Moral Saint unappealing, intimidating, or "one-dimensional." Both sides accept that this is a widespread psychological fact, regardless of its normative significance.
  5.  **The Demandingness of Morality:** We agree that morality, taken seriously, is demanding. It requires significant sacrifice of self-interest. Neither side argues that morality is trivial or easily compatible with a life of pure self-indulgence.
  6.  **Admiration as a Data Point:** We agree that the patterns of human admiration are relevant data for ethical theory. Whether these patterns are authoritative or suspect is disputed, but their existence is not.

  ***

  ### Section II: Residual Disagreements
  *The following table outlines the precise points of divergence. The phrasing in each column is endorsed by the respective signatory as an accurate representation of their view.*

  | Point of Contention | Commitment of the Wolf-Defender | Commitment of the Saint-Defender |
  | :--- | :--- | :--- |
  | **1. The Source of Discomfort** | The common intuition that saints are "boring" or "humorless" tracks a genuine defect in the moral saint ideal. The ideal itself crowds out the personal excellences required for a rich human life. | The common intuition that saints are "boring" or "humorless" tracks a defect in the observer. It reveals a reluctance to submit to the authority of the good, not a flaw in the ideal. |
  | **2. The Structure of Value** | Value is pluralistic. Moral value is one type of value among others (aesthetic, personal, intellectual). No single type of value lexically dominates all others in constituting a well-lived life. | Value is hierarchical. Moral value possesses "overridingness." While other values exist, they are subordinate. A life is well-lived only insofar as it aligns with the moral good. |
  | **3. The Role of Personal Projects** | A rational life plan *must* include personal projects that are not morally justified. It is rationally permissible to pursue a hobby even when moral duty could use that time. | A rational life plan subordinates personal projects to moral duty. Pursuing a hobby when one could be doing moral good is permissible only if it serves the moral life (e.g., preventing burnout). |
  | **4. The Nature of "Richness"** | A "rich" life requires a diversity of concerns, some of which are morally neutral. A life focused solely on the good of others is impoverished in terms of individual agency and style. | A "rich" life is defined by the depth of one's commitment to the good. The integration of moral purpose provides a unity and depth that outweighs the variety of non-moral pursuits. |

  ***

  ### Section III: The Cruxes
  *These are the specific sub-questions where resolution would likely shift the debate. For each crux, we specify the evidence or argument both sides agree is relevant, and we record our divergent predictions.*

  #### Crux 1: The Compatibility Thesis
  **Question:** Is it psychologically or conceptually possible for a person to be *maximally* devoted to morality while simultaneously possessing robust non-moral excellences (e.g., being genuinely witty, a gourmet, or a dedicated artist)?

  *   **Agreed-Upon Evidence:** Biographical studies of historical figures widely regarded as morally exceptional (e.g., St. Francis, Gandhi, Mother Teresa) analyzed specifically for the presence and depth of their non-moral interests and aesthetic sensibilities.
  *   **Wolf-Defender Prediction:** Analysis will show a negative correlation. As moral devotion approaches the maximum, non-moral excellences will be truncated or instrumentalized (e.g., art is only for preaching), confirming the "one-dimensional" charge.
  *   **Saint-Defender Prediction:** Analysis will show that true moral perfection *enhances* non-moral excellences. The saint's wit or artistry will be deeper because it is unburdened by selfishness. Apparent lack of interest is a misinterpretation of their asceticism, not a lack of capacity.

  #### Crux 2: The Diagnostic Weight of Intuition
  **Question:** When ordinary people feel repelled by the Moral Saint, is this reaction a reliable indicator of a flaw in the Saint, or a reliable indicator of a flaw in the People?

  *   **Agreed-Upon Evidence:** Comparative moral psychology research on "moral dumbfounding" and the correlation between selfishness and judgments of "likability." Specifically, studies measuring whether individuals who rate saints as "unlikable" also score higher on measures of narcissism or lower on measures of moral commitment.
  *   **Wolf-Defender Prediction:** There will be no significant correlation between narcissism and finding saints unlikable. The repulsion will be widespread across personality types, suggesting the ideal itself violates human rational nature, not just moral virtue.
  *   **Saint-Defender Prediction:** There will be a strong correlation. Those who find the saint unlikable will demonstrate higher levels of self-centeredness and lower levels of moral understanding. The repulsion is a symptom of moral immaturity.

  #### Crux 3: The Rationality of Sacrifice
  **Question:** Is it practically rational for an agent to sacrifice a significant personal project (e.g., writing a novel) for a marginal moral gain (e.g., donating the equivalent time's earnings to a slightly more effective charity)?

  *   **Agreed-Upon Evidence:** Reflective equilibrium testing using specific case vignettes where the moral gain is quantifiable but small, and the personal loss is significant to the agent's sense of identity. We will survey considered judgments of agents in "idealized" conditions (fully informed, calm, impartial).
  *   **Wolf-Defender Prediction:** In idealized conditions, rational agents will universally judge that keeping the personal project is permissible, and perhaps required for integrity. To demand the sacrifice is to misunderstand the nature of rational agency.
  *   **Saint-Defender Prediction:** In idealized conditions, rational agents will acknowledge that the moral choice is the *right* one, even if difficult. They may admit they lack the strength to do it, but they will not call it *irrational* to choose the moral option. The "integrity" objection will be rejected as a disguise for selfishness.

  ***

  **Signed,**

  _________________________
  *Defender of the Wolf Position*

  _________________________
  *Defender of the Saint Ideal*
