  *(Self-Correction during drafting)*: I should be careful not to say the Static Shift *doesn't* require sophisticated substantivalism. It does. But the user's intuition is that it feels less damaging. I need to explain *why* it feels less damaging. It's because Newtonian space is a rigid container; shifting it doesn't change its internal structure. GR spacetime *is* the structure. Identifying diffeomorphic models in GR means the points have *no* identity without the metric. In Newtonian space, points can have identity without matter (just via the rigid grid), even if the origin is arbitrary. In GR, without the metric, the manifold is just a topological soup.

