      *   *Key distinction:* In the Static Shift, the *relations* between material objects are preserved. In the Hole Argument, the *relations between the metric field and the manifold points* are what's at stake. Since the metric *is* the physics in GR, this is deeper.

  7.  **Final Plan:**
      *   Introduction: Validate the parallel (gauge arguments).
