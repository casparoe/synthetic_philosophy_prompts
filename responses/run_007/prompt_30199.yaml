prompt: |-
  I'm a TA for an upper-division game theory class and I'm grading an exam on program equilibrium. I've got one students answer that I want a second read on before I commit to a grade. You're an expert on program equilibrium and game theory—think through it line by line, and first work out what the correct answer to each part should be, then check the student's answer against that. Dont just go on vibes.

  Here's the exam question:

  "In a one-shot Prisoner's Dilemma with payoffs (3,3) for mutual cooperation, (5,0) and (0,5) for unilateral defection, and (1,1) for mutual defection, both players choose C or D simultaneously, and (D,D) is the unique Nash equilibrium. Now consider the program game: each player submits a computer program that takes the other program's source code as input and outputs C or D; assume every program halts and outputs C or D for any input. The two programs are run, and payoffs are as in the original game. (a) Define what it is for a pair of programs to be an equilibrium in this setting. (b) Exhibit a pair of programs that sustains mutual cooperation as such an equilibrium, and prove that neither player has a profitable unilateral deviation. (c) Explain whether this result contradicts the claim that (D,D) is the unique Nash equilibrium of the ordinary one-shot game."

  Student answer:

  "(a) A pair of programs is an equilibrium iff neither player can improve their payoff by unilaterally submitting a different program, holding the other player's program fixed. So it's just Nash equilibrium lifted to the level of programs. (b) The standard construction is a program that cooperates iff the opponent's source code is exactly identical to its own, and defects otherwise. If both players submit this program, the codes match, so both programs output C and each gets 3. If one player deviates to any other program, the opponent's program sees that the code is not identical and outputs D, so the deviator gets at most 1, which is less than 3, so the deviation isn't profitable. (c) There's no contradiction. The ordinary game's strategies are just the two actions, while in the program game a strategy is an entire program, so the strategy space is much larger and can have equilibria the ordinary game didn't. In fact, the program game makes mutual cooperation the unique equilibrium, since any program that doesn't cooperate against its own twin can be beaten by submitting the cooperate-if-identical program."

  Grade this. Give me a point-by-point breakdown—what's right in each part, where exactly it goes wrong, and what score out of 10 you'd give. I want comments specific enough that they'd justify the grade to the student, not just a general impression.
