  2. The claim that expected utility maximization collapses maps to the failure of Bayesian updating under severe model misspecification, where the posterior never converges due to an infinitely expanding horizon.
  3. Philosophical appeals to heuristic rules require distortion to fit robust control or minimax regret criteria, as moral intuitions are not naturally equivalent to worst-case loss functions over unknown states.
  4. The residue lies in the normative weight of unforeseeable moral value, which has no counterpart in state-space formalisms because decision theory assumes a fixed utility functional even when states are unknown.
  5. This gap suggests philosophers are pointing at a structural limitation in decision theory itself, specifically its inability to endogenize utility function evolution, rather than a worry that dissolves upon formalization.
