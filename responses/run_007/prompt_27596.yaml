          *   *Observation/Panopticon:* It's not just the teacher; it's the culture of visibility. "Tracking" with eyes (SLANT). The data walls.
          *   *Normalizing Judgment/Micro-penalties:* This is key. It's not about big crimes; it's about the untucked shirt. The penalty is immediate and corrective.
