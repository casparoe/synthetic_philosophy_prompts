  **(Self-Correction Note):** I need to be careful not to simply say "Foucault is right." I need to show *where* the theory strains. The strain is on the question of *agency*. Foucault is often criticized for leaving no room for resistance. If students *choose* this (or parents do), does that change the power dynamic? I should argue that within the school walls, the choice is suspended. The structural coercion remains.

