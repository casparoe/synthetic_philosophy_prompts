          *   *The Twist:* The tragedy isn't that the schools fail; it's that they succeed *by* narrowing the horizon of the self. The "habits of success" are indistinguishable from "habits of compliance."

      *   **Conclusion:** Summarize. The friend is right about the *economics*, wrong about the *ontology*. Foucault is right about the *mechanism*, but we must acknowledge the moral dilemma: Is trading autonomy for mobility a fair bargain? The theory illuminates the cost.

