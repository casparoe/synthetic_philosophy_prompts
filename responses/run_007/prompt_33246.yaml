answer: |-
  ### Desiderata for a Theory of Causation

  1.  **Extensional Adequacy (Actual Causation):** [Non-Negotiable] The theory must correctly classify token-level causal claims in standard test cases (e.g., identifying the cause in preemption scenarios).
  2.  **Extensional Adequacy (Type Causation):** [Non-Negotiable] The theory must account for general causal claims (e.g., "Smoking causes cancer") distinct from token claims.
  3.  **Type/Token Coherence:** [Non-Negotiable] The theory must specify a coherent relationship between type-level generalizations and token-level instances (e.g., token causation should not be possible where type causation is nomologically impossible).
  4.  **Difference-Making:** [Non-Negotiable] Causation must entail some form of counterfactual dependence or difference-making relation; if the cause had not occurred (or been different), the effect would not have occurred (or would be different).
  5.  **Explanatory Relevance:** [Non-Negotiable] Causal relations must track explanatory relevance; citing a cause must provide a valid answer to a "why" question.
  6.  **Asymmetry:** [Non-Negotiable] If C causes E, then E does not cause C (in the same respect and time).
  7.  **Transitivity:** [Parochial] If C causes D and D causes E, then C causes E.
  8.  **Relata Specification:** [Parochial] The theory must specify whether the relata are events, facts, propositions, or variables taking values.
  9.  **Omission/Prevention Inclusion:** [Parochial] Absences (failures to act) and preventions count as genuine causes.
  10. **Intrinsicness:** [Parochial] Whether a process is causal depends on the intrinsic character of the process and its laws, not on extrinsic alternatives (e.g., whether a backup predictor existed).
  11. **Metaphysical Reduction:** [Parochial] Causal facts must be analyzable in terms of non-causal facts (e.g., counterfactuals analyzed via world similarity, not primitive interventions).
  12. **Context Insensitivity:** [Parochial] Causal truth conditions should not vary based on pragmatic context or contrastive focus.

  ***

  ### Motivations and Cases

  1.  **Extensional Adequacy (Actual):** Motivated by the demand that the theory match considered judgments on specific cases.
      *   *Cases:* **Early Preemption** (Suzy throws, Billy holds back; Suzy causes the break, though dependence is absent); **Late Preemption** (Suzy's rock hits first, Billy's would have); **Symmetric Overdetermination** (Two rocks hit simultaneously). A theory that says Billy is the cause in Early Preemption fails.
  2.  **Extensional Adequacy (Type):** Motivated by scientific and legal practice which relies on generalizations.
      *   *Cases:* Epidemiological studies linking asbestos to mesothelioma. A theory that only handles tokens cannot serve science.
  3.  **Type/Token Coherence:** Motivated by the intuition that tokens instantiate types.
      *   *Consideration:* If "Arsenic causes death" is true, a specific ingestion of arsenic causing a specific death must be compatible with that law. Incoherence leads to a fractured metaphysics where singular causation floats free of laws.
  4.  **Difference-Making:** Motivated by the intuition that causes make a difference to their effects.
      *   *Cases:* **Simple Dependence** (If I hadn't struck the match, it wouldn't have lit). This is the core insight of both Lewis (counterfactuals) and Woodward (interventions). Without this, causation collapses into correlation or mere succession.
  5.  **Explanatory Relevance:** Motivated by the link between causation and understanding.
      *   *Cases:* **Explanatory Asymmetry** (The height of the flagpole explains the shadow, not vice versa, despite nomological co-determination). Causation must filter out irrelevant factors (e.g., the color of the match is causally irrelevant to the lighting).
  6.  **Asymmetry:** Motivated by the arrow of time and the structure of manipulation.
      *   *Consideration:* We can manipulate effects by manipulating causes, but not vice versa. Simultaneous mutual causation creates logical loops that undermine predictive utility.
  7.  **Transitivity:** Motivated by the idea of causal chains and long-distance responsibility.
      *   *Cases:* **The Purple Flame** (Potassium salts cause a purple flame; purple flame causes ignition; did salts cause ignition? Intuition says yes). **Switch Cases** (A switch diverts a train; train arrives; did switching cause arrival? Intuition says no). This tension makes Transitivity parochial; Lewis accepts it, Woodward rejects it.
  8.  **Relata Specification:** Motivated by formal precision.
      *   *Consideration:* Lewis uses **Events** (spacetime regions). Woodward/HP use **Variables** (values in a system). This dictates whether you can model structural equations (Variables) or require spatiotemporal continuity (Events).
  9.  **Omission/Prevention Inclusion:** Motivated by moral and legal liability.
      *   *Cases:* **The Gardener** (Failure to water causes flowers to die). **Double Prevention** (A prevents B from preventing C; A causes C). Counterfactual theories handle this easily; Process theories struggle (no physical flow).
  10. **Intrinsicness:** Motivated by physicalism and the intuition that causation is "in the world."
      *   *Cases:* **Preemption** again. To solve Preemption, Lewis appeals to extrinsic alternatives (what Billy *would* have done). This violates Intrinsicness. Process theorists keep Intrinsicness but lose Preemption cases.
  11. **Metaphysical Reduction:** Motivated by Humean empiricism.
      *   *Consideration:* Lewis demands counterfactuals be analyzed via similarity of worlds (non-causal). Woodward treats **Interventions** as primitive (causal). Insisting on Reduction forces the Lewisian path; rejecting it opens the Interventionist path.
  12. **Context Insensitivity:** Motivated by the desire for objective truth conditions.
      *   *Cases:* **Contrastive Focus** ("The lightning caused the fire" vs. "The lightning caused the fire *rather than the smolder*"). Some argue causal truth varies with the contrast class; others demand invariant truth conditions.

  ***

  ### Joint-Satisfiability and the Forcing Requirement

  **The Impossibility Result:**
  There is a jointly unsatisfiable subset of requirements if one insists on classifying **Omission/Prevention Inclusion** and **Metaphysical Parsimony** (a constraint implicit in Naturalism, closely related to Intrinsicness and Relata) as Non-Negotiable.
  1.  **Difference-Making** (Non-Negotiable): Causation requires counterfactual dependence.
  2.  **Omission Inclusion** (Non-Negotiable for a complete theory of explanation/liability): Absences are causes.
  3.  **Metaphysical Parsimony** (Non-Negotiable for Physicalism): Causation involves positive physical facts/flows, not negative facts or infinite extrinsic dependencies.

  *Conflict:* If Omissions are causes (2) via Difference-Making (1), then the cause is a *negative fact* (the non-occurrence of an event). This violates Parsimony (3), as there is no physical "stuff" corresponding to the cause, and it leads to an explosion of causes (the failure of every other possible gardener to water the flowers).
  *Resolution:* One must be dropped. Lewis struggles here (trying to fit omissions into event ontology). Woodward accepts the violation of Parsimony (causation is about variables, not physical stuff). **Finding:** A theory cannot be simultaneously difference-making, inclusive of omissions, and metaphysically parsimonious in the classical physicalist sense.

  **The Choice Forcer:**
  The single requirement that does the most to force a choice between the Counterfactual (Lewis) and Interventionist (Woodward) approaches is **Metaphysical Reduction (Requirement 11)**.
  *   **Lewis:** Accepts Reduction. Counterfactuals must be analyzed via similarity metrics of possible worlds to avoid circularity. This forces a focus on **Events** and **Intrinsicness** (as much as possible) and leads to complex machinery to handle Preemption (quasi-dependence).
  *   **Woodward:** Rejects Reduction. Interventions are understood causally (an intervention *is* a causal process). This allows the theory to be **Non-Reductive** and **Pragmatic**, prioritizing **Explanatory Relevance** and **Variable Relata** over metaphysical grounding.
  *   *Why it forces the choice:* If you demand Reduction, you cannot use Woodward's primitive interventions. If you reject Reduction, Lewis's similarity semantics appear unnecessarily restrictive and detached from scientific practice.

  ***

  ### Vulnerability of Classification

  The classification of requirements as Non-Negotiable versus Parochial is most likely to fail on **Extensional Adequacy (Requirement 1 & 2)**.

  **The Argument:**
  My classification treats matching folk intuitions on cases (Preemption, Switches, Overdetermination) as a hard constraint. However, a growing body of empirical philosophy (experimental metaphysics) suggests these intuitions are unstable, culturally variable, and conflated with normative judgments (blame).
  *   **If this consideration goes the other way:** If Extensional Adequacy is demoted to Parochial (i.e., "Our intuitions about cases are flawed and the theory should correct them, not follow them"), the entire landscape shifts.
      *   The **Impossibility Result** regarding Omissions dissolves (we can simply say omissions aren't causes, regardless of intuition).
      *   The pressure to solve **Preemption** vanishes (if intuition says there is a cause where there is no dependence, the intuition may be wrong).
      *   **Interventionism** gains a decisive advantage, as it explicitly prioritizes **Explanatory Relevance** and **Invariance** over matching pre-theoretic intuitions about "what caused what." Lewis's project, which is deeply tied to analyzing the *concept* (and thus the intuitions), would be undermined more severely than Woodward's, which is tied to *scientific practice*.

  **Conclusion:** The entire debate rests on the assumption that there is a stable set of intuitions to be adequate *to*. If that assumption fails, "Extensional Adequacy" is not a Non-Negotiable constraint, but a Parochial commitment to conceptual analysis over scientific utility.
