  But I suspect that's too crude. Give me the faithful translation, not the cartoon version. Then do the residue report: what in each position has NO counterpart in my vocabulary, what had to be distorted to fit, and — this is what I really want — whether the untranslatable bits are things my vocabulary *should* be able to say but can't (i.e., I'm missing something) or things that only looked like claims because the philosophers were talking sloppily.

  Hard limit: 800 words. And please push back if I've framed the whole exercise wrong — if, say, the compression/source-code distinction I'm leaning on already begs the question against one side, tell me that upfront and restart.
