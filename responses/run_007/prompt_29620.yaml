  ### 1. Candidate Rules

  Based on the colleague's track record, three distinct normative principles fit the verdicts on Cases 1–3.

  **Rule A: The Coherence Requirement (Structural)**
  *   **Principle:** Rationality is a property of the preference relation itself. Synchronic preferences must be transitive, and diachronic preferences must be stationary (time-consistent).
  *   **Application:**
      *   Case 1 (Intransitive): **Irrational** (Violates transitivity).
      *   Case 2 (Non-stationary): **Irrational** (Violates stationarity).
      *   Case 3 (Stationary): **Rational** (Satisfies both).
  *   **Implication:** The agent's mental state is defective if preferences shift or cycle, regardless of whether the agent successfully manages those defects to avoid loss.

  **Rule B: The Exploitability Requirement (Pragmatic/Outcome)**
  *   **Principle:** Rationality is defined by immunity to strategic exploitation. An agent is irrational if they engage in a sequence of choices that leaves them with a strictly dominated outcome (worse off by their own lights) compared to an available alternative. This is the "Money Pump" argument extended diachronically.
  *   **Application:**
      *   Case 1 (Money Pump): **Irrational** (Agent ends with C and -$3; dominated by starting C).
      *   Case 2 (Dynamic Money Pump): **Irrational** (Agent pays fees to reverse course, ending with $95; dominated by the $100 available at $t_1$ or the $120 preferred at $t_0$).
      *   Case 3 (No Pump): **Rational** (Agent secures preferred outcome without loss).
  *   **Implication:** The defect is the *loss*, not the preference shift itself. If the agent avoids the loss, they avoid the irrationality.

  **Rule C: The Sophistication Requirement (Strategic)**
  *   **Principle:** Rationality requires that an agent correctly forecasts their future preferences and chooses the optimal strategy given those constraints. A "Naive" agent (who fails to anticipate reversal) is irrational; a "Sophisticated" agent (who anticipates and optimizes) is rational.
  *   **Application:**
      *   Case 1 (N/A): **Irrational** (Intransitivity prevents coherent planning).
      *   Case 2 (Naive): **Irrational** (Failed to anticipate reversal).
      *   Case 3 (Consistent): **Rational** (Trivially sophisticated; no reversal to anticipate).
  *   **Implication:** Rationality is about the *process* of agency and forecasting. Even if an agent avoids loss, failing to exercise strategic control over one's future self is a rational failure.

