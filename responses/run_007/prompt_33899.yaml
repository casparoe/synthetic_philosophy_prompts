      *   *Check:* Did I address the "N=1" problem of Analogy? Yes, crucial point.
      *   *Check:* Did I address the "Hard Problem"? Need to make sure I distinguish between inferring a mind exists vs. what that mind *is*.
      *   *Check:* The user asked for "Model Identifiability." Make sure to emphasize that $P(D|\text{Mind}) = P(D|\text{Zombie})$ is the definition of unidentifiability.

  8.  **Final Polish:** Organize into clear sections: The Translation, The Residue Report, The Verdict. (Proceed to generate output based on this structure.)

