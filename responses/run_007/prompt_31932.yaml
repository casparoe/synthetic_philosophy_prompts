answer: |-
  To determine how Augustine of Hippo would classify Harry Frankfurt's concept of "bullshit," one must first examine Augustine's precise definition of a lie (*mendacium*) and the theological architecture supporting his absolutism. In *De Mendacio* and *Contra Mendacium*, Augustine defines a lie not merely as stating a falsehood, but as speaking with a "will to deceive" (*voluntas fallendi*) while holding a different conviction in one's mind. The core sin is the discordance between the heart (*cor*) and the tongue (*lingua*); as he famously writes, "He lies who utters what he thinks otherwise than he thinks it." For Augustine, the moral gravity of speech lies in the interior intention of the speaker rather than the exterior correspondence of the statement to reality. Consequently, a statement that happens to be true is still a lie if the speaker believes it false, and a statement that is false is not a lie if the speaker believes it true.

  Given this framework, Augustine would likely not accept Frankfurt's distinction between lying and bullshitting as morally exculpatory. While the bullshitter differs from the liar in that the bullshitter is indifferent to the truth-value of the proposition, the bullshitter nonetheless intends to deceive the listener about the nature of the communication itself. By engaging in discourse, the bullshitter implicitly claims to be participating in a truth-telling enterprise; by being indifferent to the truth, they are dissimulating their own epistemic stance. Augustine would argue that the bullshitter intends the listener to believe that the speaker is offering a reliable account of reality, while the speaker knows they are offering only an impression. This constitutes a *voluntas fallendi* regarding the speaker's own integrity and the reliability of their testimony. Therefore, even if the bullshitter does not know the specific proposition is false (which might technically exempt them from the strict definition of lying a specific fact), they are lying about their relationship to the truth.

  Furthermore, Augustine's teleology of language would condemn bullshitting even if it could be semantically squeezed out of the definition of *mendacium*. For Augustine, speech is a divine gift ordained for the communication of truth and the fostering of charity (*caritas*) within the community. To use speech merely as a tool for self-aggrandizement or social maneuvering, while disregarding its connection to truth, is to misuse a sacrament of human society. It treats language as a means to a worldly end rather than a vessel for God's Truth. In his taxonomy of lies, Augustine categorizes lies told for worldly advantage or vanity as sinful, albeit less grave than lies that damage religious doctrine. Bullshitting, which is typically driven by vanity, persuasion, or the maintenance of a social role, would fall squarely into this category of lies told for "the pleasure of pleasing" or for temporal gain.

  Augustine might also address the "accidental truth" aspect of bullshit (where the bullshitter coincidentally says something true) through his doctrine of sinful intent. Since the bullshitter's mind is not aligned with the truth (they do not hold the truth as their motive), their speech lacks the righteousness required for virtuous communication. The sin is located in the will's indifference to Truth (with a capital T, i.e., God). To be indifferent to truth is to be indifferent to God, which is inherently sinful. Thus, while Augustine might acknowledge a technical distinction where a bullshitter believes a false statement to be possibly true (avoiding the strict label of lying about that fact), he would subsume the act under the broader category of *simulatio* (dissimulation) or false witness against one's own epistemic limitations. He would argue that asserting something without regard for its truth is a form of bearing false witness about one own's knowledge.

  Ultimately, Augustine's rigid moral psychology prioritizes the orientation of the soul over the consequences of the act. Because the bullshitter's soul is oriented toward impression rather than truth, and because the act involves a deceptive presentation of the self as a truth-teller, Augustine would view it as a violation of the Eighth Commandment. He would likely classify it as a species of lying, or at the very least a sin of equivalent gravity, because it severs the sacred bond between inner conviction and outer expression. The indifference to truth is, for Augustine, a form of pride—a preference for one's own image over divine reality—and thus falls under the absolute prohibition against departing from Truth.

  Verdict: Augustine would condemn bullshitting as a sinful form of lying or dissimulation because it severs the necessary bond between mind and speech, thereby violating the divine ordinance that language must serve truth rather than mere impression.
