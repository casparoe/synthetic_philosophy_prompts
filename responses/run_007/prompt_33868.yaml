      *   *Fix:* Don't do full Bayes theorem derivation on board. Use a numerical example (e.g., 55% accuracy) to make it concrete.
      *   *Critique:* Will they confuse this with Network Effects?
      *   *Fix:* Explicitly contrast "I go because it's good" vs. "I go because you're there."
      *   *Critique:* Is the assessment question hard enough?
      *   *Fix:* Make it about a change in signal precision. If the cascade is robust, changing private signal precision shouldn't change behavior *once the cascade starts*.

  9.  **Final Polish:**
