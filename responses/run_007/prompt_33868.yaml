prompt: |-
  hey so i'm covering information cascades and rational herding next week in my undergrad social epistemology course, one 75-minute lecture. students have done some basic bayesian updating already — they get priors and updating on new evidence — but they haven't thought about what happens when the evidence is other people's actions. i don't need you to explain cascades to me, i need a plan for how i should explain them. what's the order the pieces have to go in so that the cascade result lands as a surprising but rational consequence of individual reasoning, not as some weird pathology or market failure? what's the one example that should carry the whole thing — i'm thinking the two-restaurant setup but maybe theres a reason to use something else — and what does that example need to have and not have to work? and what misconceptions am i gonna get? i'm guessing they'll think it's just peer pressure, or that people in cascades are ignoring their own private information, or that the whole thing requires some kind of irrationality or groupthink. where exactly in the sequence do i head each of those off? and what's a good question i can ask at the end to see if they actually understood the mechanism rather than just nodding along — something that would catch the difference between cascade behavior and plain conformity.
reasoning: |-
  Here's a thinking process that leads to the suggested lecture plan:

  1.  **Analyze the Request:**
      *   **Topic:** Information Cascades and Rational Herding.
      *   **Context:** Undergrad Social Epistemology course, one 75-minute lecture.
      *   **Student Background:** Understand basic Bayesian updating (priors, evidence), but *not* social evidence (actions as evidence).
      *   **Goal:** Create a lecture plan where the cascade result feels like a *surprising but rational consequence* of individual reasoning, not a pathology/irrationality.
      *   **Key Decisions:** Order of concepts, choice of example (Two-Restaurant vs. others), necessary features of the example, anticipating misconceptions (peer pressure, ignoring private info, irrationality), and a final assessment question.

  2.  **Deconstruct the Core Challenge:**
      *   The hardest part of teaching cascades is overcoming the intuition that "following the crowd" is irrational or lazy.
      *   Students need to see that *ignoring* one's own signal can be the *optimal Bayesian move* given the public history.
      *   The "Aha!" moment needs to happen when they realize the public signal (actions of predecessors) becomes more informative than the private signal.

  3.  **Select the Example:**
      *   *Option A: Two Restaurants (Banerjee/Bikhchandani/Welch style).* Classic, intuitive. Good for binary choices.
      *   *Option B: Urn Guessing (Anderson/Holt).* Very precise for experiments, but maybe too abstract for a philosophy/epistemology crowd.
      *   *Option C: Tech Adoption (VHS vs. Beta).* Good for real-world, but hard to model private signals cleanly.
      *   *Decision:* Stick with the **Two-Restaurant (or Two-Street) Setup**. It's the standard for a reason. It isolates the variables best.
      *   *Refinement:* Let's call them "Restaurant A" and "Restaurant B". One is objectively better, but students don't know which. They get a private signal (a review/card) and see previous diners' choices.
      *   *Requirements for the Example:*
          *   Binary choice (A or B).
          *   One state of the world (A is better OR B is better).
          *   Private signals are imperfect but informative (e.g., 60% accurate).
          *   Sequential decision-making (crucial).
          *   Payoffs depend on choosing the *better* option, not just matching others (distinguishes from network effects).

  4.  **Structure the Lecture (75 Minutes):**
      *   *0-10 min:* Hook & Setup (The intuition trap).
      *   *10-25 min:* The Model (Formalizing the intuition).
      *   *25-45 min:* The Tipping Point (Deriving the cascade).
      *   *45-60 min:* Misconceptions & Epistemic Implications (Why this matters for social epistemology).
      *   *60-75 min:* Assessment & Discussion.

  5.  **Drafting the Content - Step-by-Step:**

      *   **The Hook:** Start with a scenario where following the crowd feels wrong, then show where it feels right.
      *   **The Model:** Keep the math light but rigorous enough for Bayes users. Use odds ratios or simple probabilities.
      *   **The "Aha" Moment:** This needs to be the calculation where Private Signal < Public History.
      *   **Misconceptions:**
          *   *Peer Pressure:* Need to emphasize payoffs depend on truth, not conformity.
          *   *Ignoring Info:* They *are* using info (public info outweighs private).
          *   *Irrationality:* It's individually rational, collectively suboptimal.
      *   **Assessment Question:** Needs to force a distinction between "I think they know something" vs. "I just want to fit in."

  6.  **Refining the Sequence (The "Order of Pieces"):**
      *   1. Individual Bayesian Updating (Review).
      *   2. Social Evidence as Data (Actions reveal signals).
      *   3. Sequentiality (Order matters).
      *   4. The Weight of History (When public > private).
      *   5. The Cascade (The rational decision to ignore private signal).

  7.  **Addressing Specific User Constraints:**
      *   *Surprising but Rational:* Emphasize that the agent *wants* to be right, not fit in.
      *   *Example:* Two-Restaurant. Needs to ensure payoffs are tied to *quality*, not *popularity*.
      *   *Misconceptions:* Head off "peer pressure" early by defining the utility function. Head off "ignoring info" during the calculation phase.
      *   *Final Question:* Needs to be a counterfactual. "What if payoffs changed?"

  8.  **Self-Correction/Review during drafting:**
