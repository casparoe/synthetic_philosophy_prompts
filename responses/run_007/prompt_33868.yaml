answer: |-
  This is a classic pedagogical challenge in social epistemology. The goal is to move students from "herding is irrational conformity" to "herding is the rational optimization of limited information."

  Here is a 75-minute lecture plan designed to land that specific insight, using the Two-Restaurant model, with specific checkpoints to head off misconceptions.

  ### The Core Example: Two Restaurants (A and B)
  **Stick with this.** It is the cleanest vehicle for this concept. Urn experiments are too abstract; tech adoption is too messy with network effects.

  **What the example MUST have:**
  1.  **Objective Truth:** One restaurant is objectively better (say, A), but no one knows which at the start.
  2.  **Payoffs tied to Truth, not Popularity:** You get a good meal if you pick the better restaurant. You do *not* get extra utility for being with the crowd. (This kills the "peer pressure" misconception immediately).
  3.  **Imperfect Private Signals:** Each student gets a "tip" (a signal) that is correct >50% of the time (e.g., 60%), but not 100%.
  4.  **Sequentiality:** Students decide one by one, observing the choices of those before them, but *not* their private signals.

  **What the example MUST NOT have:**
  1.  **Congestion/Network Effects:** Do not imply the restaurant gets better because more people are there.
  2.  **Communication:** Agents cannot say *why* they chose; they only show *what* they chose.

  ---

  ### Lecture Sequence (75 Minutes)

  #### 1. The Intuition Trap (0–10 mins)
  *   **Goal:** Surface the misconception that herding is irrational before you correct it.
  *   **Activity:** Ask the class: "Imagine you're in a new city. You have a Yelp review saying Restaurant A is good. You walk past it and see it's empty. Restaurant B next door has a line out the door. Where do you eat?"
  *   **Poll:** Most will say B.
  *   **Ask:** "Why?" They will say "The crowd must know something."
  *   **The Trap:** Ask, "Is this rational? Or is this just mindless conformity?" Let them debate. Most will hedge.
  *   **The Setup:** Tell them: "Today we are going to prove that ignoring your own Yelp review to follow the crowd is not just rational, it is the *mathematically optimal* Bayesian move. And we're going to see why that's terrifying for group knowledge."

  #### 2. Formalizing the Model (10–25 mins)
  *   **Goal:** Translate the intuition into the Bayesian framework they already know.
  *   **The Board Work:**
      *   **State of World:** $W \in \{A, B\}$. Prior $P(A) = 0.5$.
      *   **Private Signal ($s$):** Each person gets a signal $s_A$ or $s_B$.
      *   **Signal Precision:** $P(s_A | A) = P(s_B | B) = 0.6$ (Keep numbers simple).
      *   **Decision Rule:** A rational agent maximizes the probability of choosing the better restaurant.
  *   **Person 1:** Only has private signal. If $s_A$, choose A. (Expected accuracy 60%).
  *   **Person 2:** Has private signal + observes Person 1's choice.
      *   *Crucial Step:* Walk through the inference. Person 2 knows Person 1 is rational. Therefore, Person 1's choice *reveals* Person 1's signal.
      *   Person 2 now has two signals (their own + Person 1's inferred signal). They update based on both.
  *   **Check Misconception #1 (Peer Pressure):** Explicitly state the utility function on the board. $U = 1$ if correct choice, $0$ if wrong. No points for matching others. If they match, it's only because matching implies correctness.

  #### 3. The Tipping Point / The Cascade (25–45 mins)
  *   **Goal:** The "Aha!" moment where private information is rationally discarded.
  *   **The Scenario:**
      *   Person 1 got $s_A$ $\rightarrow$ Chooses A.
      *   Person 2 got $s_B$ $\rightarrow$ Infers P1 got $s_A$. Net signals: One A, One B. Cancel out. P2 follows their own private signal (tie-breaker). Say P2 chooses A.
      *   **Person 3:** This is the pivot.
      *   Person 3 observes: P1 chose A, P2 chose A.
      *   Person 3 receives private signal: $s_B$.
      *   **The Calculation:** Person 3 knows P1 likely had $s_A$. P2 likely had $s_A$ (or $s_B$ but broke tie toward A). The public history suggests *at least* two signals for A (or a strong weighting).
      *   **The Math:** The probability that A is better given two previous A-choices is now higher than the probability of A being better given one private $s_B$ signal.
      *   **The Result:** Person 3 chooses A *despite* their private signal telling them B.
  *   **Head Off Misconception #2 (Ignoring Info):**
      *   *Student Objection:* "But they are ignoring their own evidence!"
      *   *Your Response:* "They are not ignoring evidence. They are weighing evidence. The public history represents the aggregated private signals of predecessors. Once the public weight exceeds the weight of one private signal, ignoring the private signal is the Bayesian requirement. To follow your private signal here would be *irrational*."
  *   **Define the Cascade:** From Person 3 onward, *no one's choice reveals any new information.* Everyone chooses A regardless of their signal. The pool of public information stops growing.

  #### 4. Epistemic Implications & Fragility (45–60 mins)
  *   **Goal:** Connect the math to Social Epistemology themes (fragility, path dependence).
  *   **Discussion Point 1: Fragility.** The cascade is based on very little information. If the first two people had flipped signals, we could be in a "B Cascade" even if A is objectively better. The group outcome is highly sensitive to early noise.
  *   **Discussion Point 2: Information Externality.** When Person 3 ignores their signal to follow the crowd, they deprive Person 4 of that signal. This is a negative externality. Individual rationality leads to collective stupidity (the group stops learning).
  *   **Head Off Misconception #3 (Groupthink/Irrationality):**
      *   *Student Objection:* "This looks like Groupthink."
      *   *Your Response:* "Groupthink implies a psychological desire for cohesion. This is an *informational* problem. Even if everyone hated each other and wanted to be unique, if they care about being *right*, they still cascade. It's a structural feature of sequential decision making, not a psychological bug."

  #### 5. Assessment Question (60–75 mins)
  *   **Goal:** Distinguish cascade behavior from plain conformity.
  *   **The Question:** Do not ask "What is a cascade?" Ask a counterfactual that breaks conformity but keeps the cascade logic intact.
  *   **Prompt:** "Imagine we change the payoff structure. Now, you get \$10 for choosing the better restaurant, but you also get \$100 if you choose the *same* restaurant as the majority of the class.
      *   **Part A:** In this new game, if you see a cascade forming for Restaurant A, but your private signal says B, what do you do? (Answer: Choose A, but now for two reasons: informational + monetary).
      *   **Part B (The Kicker):** Now imagine a different change. You get \$10 for the better restaurant, but you get **penalized** \$100 if you choose the same restaurant as the person immediately before you (you are forced to be a contrarian).
      *   **Question:** Does an information cascade still occur in this 'Contrarian Game'? Why or why not?"
  *   **Why this works:**
      *   If they say "No cascade because people want to be different," they misunderstand. The cascade is about *inference*, not payoffs.
      *   **Correct Answer:** Yes, a cascade still occurs (or at least the informational logic holds), but it looks different. Actually, the better version of this question is:
      *   **Revised Better Question:** "We are back to the standard game (payoff only for truth). A cascade for Restaurant A has started. Person 100 is about to decide. They receive a private signal that is **100% accurate** (a godsend review). Do they follow the cascade or their signal?"
      *   **Desired Answer:** They follow their signal.
      *   **Why:** This tests if they understand that cascades are fragile and depend on the *weight* of information. If private information becomes sufficiently precise ($> $ accumulated public weight), the cascade breaks.
      *   **What this catches:** Students who think cascades are "lock-in" or "peer pressure" will say "They have to follow the crowd." Students who understand the Bayesian mechanism will say "They update on the crowd, but the new signal outweighs the crowd, so they break the cascade."

  ### Instructor Cheat Sheet: Anticipating Friction

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"It's Peer Pressure"** | During the Setup (Min 10) | Define utility explicitly on the board. $U$ depends on *State of World*, not *Other Agents' Actions*. |
  | **"They are ignoring data"** | During the Tipping Point (Min 35) | Reframe: "They aren't ignoring it; they are outvoted." Use the phrase "Endogenous Public Information." |
  | **"This requires irrationality"** | During Implications (Min 50) | Remind them: "If you were Person 3, and you chose B against the crowd, I could show you a calculation proving you lowered your odds of a good meal." |
  | **"Cascades are permanent"** | During Assessment (Min 65) | Use the "Perfect Signal" counterfactual (see above). Cascades break when private signal precision exceeds public history weight. |

  ### One Final Tip for the Board Work
  Draw a **Decision Tree** vs. an **Information Flow Diagram**.
  *   Students often confuse the *action* (choosing A) with the *information* (signal $s_A$).
  *   Draw a distinct line between "What I know" (Signal) and "What I do" (Action).
  *   Show that in a cascade, the link between Signal and Action is severed. This visual break is usually what makes the concept click.
