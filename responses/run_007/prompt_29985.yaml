      *   In Case 3, there *is* precommitment. The "Real Preference" is the one that binds the future.

  4.  **Drafting the Principle:**
      *   Name: **The Principle of Reflective Costliness.**
      *   Definition: A choice reveals "true utility" to the extent that it is (1) costly (stakes are real), (2) coherent with higher-order volitions (what you want to want), and (3) free of known cognitive processing errors (framing, myopia).
      *   Hierarchy:
          1.  Costly choices are the baseline (beats talk).
          2.  Planning-self choices (precommitments) beat Impulsive-self choices (if conflict is acknowledged).
          3.  Robust goals beat Framed inputs.
      *   This explains why Case 4 (Action > Talk) holds (Costly > Cheap) but Case 3 (Precommitment > Lapse) holds (Planning > Impulsive).
