      *   It must be a **Normative Model of Agency.** Utility is the score of the "Idealized Agent" version of you. It's a construct used to predict what you *would* choose if you were fully informed, calm, and temporally consistent.
      *   This aligns with "Coherent Extrapolated Volition" lite.

