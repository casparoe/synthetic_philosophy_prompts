      *   *Synthesis:* The principle is **Reflective Endorsement under Costly Constraints.**
      *   Utility is a **Normative Construct** derived from what the agent chooses when they are (a) paying costs, (b) free of processing errors, and (c) aligning with their higher-order volitions (what they want to want).
