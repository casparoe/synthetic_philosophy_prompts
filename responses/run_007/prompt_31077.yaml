  # Decision Tree: Rational Commitments Under Severe Uncertainty

  This tree sorts positions in formal epistemology and decision theory based on responses to concrete cases of underdetermination. Begin at the root and follow the path that matches your intuitions about rational requirements.

  ### **Root Node: The Representation of Belief**
  **Case:** Consider two equally trusted forecasters. Forecaster A assigns probability 0.2 to an event $E$; Forecaster B assigns probability 0.8. There is no further evidence to adjudicate between them.
  **Question:** Is a rational agent *required* to collapse this conflict into a single precise probability (e.g., 0.5), or is the rational state permitted to remain set-valued (e.g., the interval $[0.2, 0.8]$)?

  *   **Required (Single Precise Credence):** Go to **Branch A**.
  *   **Permitted (Set-Valued Credence):** Go to **Branch B**.

  ---

  ### **Branch A: Precise Credence Required**
  **Node A1: The Source of Precision**
  **Case:** Return to the two conflicting forecasters (0.2 vs 0.8). You are required to adopt a single precise credence.
  **Question:** Does the evidence itself *force* one specific value (such as the arithmetic mean) as the only rational option, or does the evidence allow a range of values where the agent may arbitrarily select any one without violating rationality?

  *   **Evidence forces a specific value:**
      *   **Position:** **Uniqueness-style Precise Bayesianism**.
      *   **Diagnosis:** You hold that rational constraints are tight enough to determine a unique posterior even from sparse or conflicting evidence.
  *   **Agent may select any value in the range:**
      *   **Position:** **Permissive Precise Bayesianism**.
      *   **Diagnosis:** You hold that evidence underdetermines belief, but rationality requires the agent to "precisify" their state arbitrarily to facilitate decision-making.

  ---

  ### **Branch B: Set-Valued Credence Permitted**
  **Node B1: The Structure of Belief**
  **Case:** Consider the **Ellsberg Urn**: 30 Red balls, 60 Black or Yellow balls (unknown proportion). You know $P(\text{Red}) = 1/3$ and $P(\text{Black or Yellow}) = 2/3$. However, you have no information distinguishing Black from Yellow.
  **Question:** Does your belief state respect additivity (i.e., must your degree of belief in Black plus your degree of belief in Yellow equal your degree of belief in Black-or-Yellow), or does the lack of evidence justify a representation where the sum of beliefs in the parts is *less* than the belief in the whole?

  *   **Additivity Required (Set of Standard Probabilities):** Go to **Branch B2**.
      *   *Note:* You represent uncertainty as a family of precise probability functions (e.g., $P(\text{Black})$ ranges from 0 to 2/3).
  *   **Additivity Not Required (Non-Additive Measure):** Go to **Branch B3**.
      *   *Note:* You represent uncertainty using capacities or belief functions where $Bel(\text{Black}) + Bel(\text{Yellow}) < Bel(\text{Black or Yellow})$.

  ---

  ### **Branch B2: Additive Sets (Imprecise Probabilities)**
  **Node B2.1: Completeness of Preferences**
  **Case:** In the **Ellsberg Urn**, consider a bet on Red (known 1/3) versus a bet on Black (unknown 0 to 2/3). Your set of probabilities says Red is better than Black on some functions, and Black is better than Red on others.
  **Question:** Must you force a strict preference between these two bets (ranking one as better), or are you permitted to remain indecisive (ranking neither as better)?

  *   **Permitted to Remain Indecisive (Incomplete Preferences):** Go to **Branch B2.2**.
  *   **Required to Force a Ranking (Complete Preferences):** Go to **Branch B2.3**.

  **Node B2.2: Criteria for Permissibility**
  **Case:** Consider a decision problem with three acts. Act $X$ is optimal for some probabilities in your set. Act $Y$ is never optimal for any probability in your set, but Act $Y$ is not strictly worse than Act $X$ across *all* probabilities (perhaps $Y$ is better than $X$ on some, worse on others, but never the *best* option).
  **Question:** Is Act $Y$ rationally permissible?

  *   **Yes, permissible (so long as not strictly dominated):**
      *   **Position:** **Imprecise Probabilism (Maximality)**.
      *   **Diagnosis:** You adopt a weak dominance criterion. An act is allowed unless another act is definitely better.
  *   **No, impermissible (must be optimal for at least one probability):**
      *   **Position:** **Imprecise Probabilism (E-admissibility)**.
      *   **Diagnosis:** You require that a permissible act must be the best choice for at least one live possibility in your belief set.
      *   **Note on Coherent Lower Previsions:** Both Maximality and E-admissibility are decision rules consistent with the theory of **Coherent Lower Previsions**. If your primary commitment is to the coherence of the lower buying prices themselves rather than a specific choice rule, you occupy this space generally.

  **Node B2.3: Rules for Complete Ranking**
  **Case:** Consider a **Coin with Unknown Bias**. You must price a bet that pays \$1 if Heads. Your set of probabilities for Heads is $[0, 1]$.
  **Question:** Do you possess a precise probability distribution *over* the possible biases (a "second-order" belief), or do you evaluate the bet using only the set of first-order probabilities without weighting them?

  *   **Yes, I have a precise second-order distribution:**
      *   **Position:** **The Smooth Ambiguity Model**.
      *   **Diagnosis:** You separate ambiguity (the set of probabilities) from ambiguity attitude (your weighting of those probabilities) via a second-order expectation.
  *   **No, I use the set directly:** Go to **Node B2.4**.

  **Node B2.4: Evaluation of the Set**
  **Case:** Return to the **Unknown Bias Coin** ($[0, 1]$). You must evaluate the bet.
  **Question:** Do you evaluate the act solely by its worst-case expected utility, or do you allow a weighted mix of the best and worst cases (or a more complex weighting)?

  *   **Solely Worst-Case:**
      *   **Position:** **Maxmin Expected Utility (MEU)**.
      *   **Diagnosis:** You are extremely ambiguity-averse; only the lowest expectation in the set matters.
  *   **Weighted Mix / Complex Weighting:** Go to **Node B2.5**.

  **Node B2.5: Nature of the Weighting**
  **Case:** Consider two bets with the same range of expected utilities but different event structures.
  **Question:** Is your ambiguity attitude determined by a fixed index of optimism/pessimism applied to the best and worst expectations, or does it depend on a non-linear weighting of the events themselves based on outcome ranks?

  *   **Fixed Optimism/Pessimism Index:**
      *   **Position:** **Hurwicz-criterion or Variational Ambiguity Preferences**.
      *   **Diagnosis:** You weigh the maximum and minimum expected utilities (or penalize deviations from a reference) linearly.
      *   **Flag:** This leaf is difficult to separate empirically from Variational preferences without complex elicitation; they are often grouped.
  *   **Non-linear Event Weighting:**
      *   **Position:** **Choquet Expected Utility**.
      *   **Diagnosis:** You distort the probabilities of events based on the ranking of outcomes (rank-dependent utility), allowing for more flexible ambiguity attitudes than MEU or Hurwicz.

  ---

  ### **Branch B3: Non-Additive Measures**
  **Node B3.1: Source of Non-Additivity**
  **Case:** Return to the **Ellsberg Urn**. Your belief in Black is 0, Yellow is 0, but Black-or-Yellow is 2/3.
  **Question:** Is this non-additivity derived from the logical structure of the evidence (e.g., reliability of sources, logical constraints), or is it inferred purely from your betting preferences?

  *   **Derived from Evidence Structure:**
      *   **Position:** **Dempster-Shafer Belief Functions**.
      *   **Diagnosis:** You use belief and plausibility functions to represent evidence support, often employing specific combination rules for updating.
  *   **Inferred from Preferences:**
      *   **Position:** **Choquet Expected Utility** (Non-Additive Representation).
      *   **Diagnosis:** While mathematically similar to Branch B2.5, here the non-additivity is taken as the fundamental representation of belief rather than a derivative of a set of probabilities.
      *   **Flag:** This leaf and the Choquet leaf in Branch B2 are often mathematically equivalent; the distinction is philosophical (belief representation vs. decision rule).

  ---

  ### **Diagnosis of Empty or Unattractive Space**

  1.  **Precise Credence + Incomplete Preferences:** This combination is largely unoccupied. If an agent commits to a single precise probability function, standard decision theory (Expected Utility) generates a complete ranking of acts. To have incomplete preferences with precise credence requires rejecting Expected Utility theory entirely without adopting imprecise probabilities, a position rarely defended in this literature.
  2.  **Set-Valued Credence + Required Precision in Choice (without a rule):** It is incoherent to claim the belief state is essentially set-valued but that the agent is *required* to choose as if it were precise without specifying the rule (MEU, Smooth, etc.) that performs the collapse. The "Permissive Precise Bayesian" (Branch A) handles the collapse at the belief stage; the "Complete Preference" branches (B2.3) handle it at the choice stage.
  3.  **Dempster-Shafer + Complete Preferences (without Choquet):** While possible, Dempster-Shafer is typically paired with decision rules that respect the belief/plausibility bounds (often incomplete). Using it solely to generate a complete Choquet integral collapses it into the Choquet position.

  ### **Separability Flags**

  *   **Hurwicz vs. Variational:** These are flagged at Node B2.5. They are behaviorally very similar (both interpolate between min and max). Separating them requires asking whether the agent minimizes a penalty function relative to a set of priors (Variational) or simply takes a linear combination of min/max EU (Hurwicz).
  *   **Choquet (Branch B2) vs. Choquet (Branch B3):** These are flagged at Node B3.1. Mathematically, a Choquet integral can represent both a set of probabilities (MEU is a special case) and a belief function. The tree separates them based on whether the agent views the non-additivity as a *representation of evidence* (DS/B3) or a *preference weighting* (CEU/B2).
  *   **Maximality vs. E-admissibility:** These are separated at Node B2.2. However, in simple binary choices (like Ellsberg Bet 1 vs 2), they yield identical recommendations. They only diverge in larger decision problems where an act is not dominated but is never optimal.
