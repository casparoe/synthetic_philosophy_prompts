      *   Round 3 (Play + Tally): 10 mins.
      *   Debrief/Discussion: 35 mins.
      *   *Risk:* 10 mins per round is tight for 8 pairs. Need to streamline. Simultaneous play.
      *   *Streamlining:* All Signalers decide simultaneously. All Receivers decide simultaneously. Match them up.
      *   *Better:* 8 pairs. They sit across from each other.
      *   *Instruction:* "Don't talk."
      *   *Rounds:* 5 mins instruction, 5 mins play per round. Total 20 mins play. 40 mins debrief. 15 mins buffer/setup.
      *   *Wait, 16 students.* 8 pairs is manageable.
      *   *Payoff Tracking:* Need a quick way to record. Pre-printed scorecards.

  5.  **Refining the "Differential Cost" Mechanism:**
      *   To make it feel fair, the cost difference needs to be explicit in the rules for Round 3 but hidden in terms of *who* has which cost until they see the result.
