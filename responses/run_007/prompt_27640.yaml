          *   Signaler pays a cost for Signaling.
      *   **The Crucial Math:**
          *   *Round 1 (Cheap Talk):* Cost = 0 for everyone. Low types will signal (free benefit). Receivers learn signal means nothing. Trust collapses.
          *   *Round 2 (Uniform Cost):* Cost = $C$ for High and Low. If Benefit of Trust ($B$) > $C$, Low types still signal. Receivers still can't distinguish. Trust collapses or stays low.
          *   *Round 3 (Differential Cost):* Cost = $C_H$ for High, $C_L$ for Low. We need $B - C_H > 0$ (High wants to signal) AND $B - C_L < 0$ (Low does *not* want to signal). This creates a Separating Equilibrium.
      *   **Points:** Keep numbers simple (e.g., 10, 20, 30).
