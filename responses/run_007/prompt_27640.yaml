answer: |-
  # Game Title: The Cost of Credibility

  ## Materials
  *   **Type Cards:** 8 cards marked "High Quality" (H) and 8 cards marked "Low Quality" (L). (Note: Only Signalers use these; 4 Signalers will be H, 4 will be L. The extra 4 cards are spares/rotations).
  *   **Signal Slips:** Small pieces of paper for Signalers to write "Signal" or "Silent".
  *   **Response Slips:** Small pieces of paper for Receivers to write "Trust" or "Pass".
  *   **Score Sheets:** One per student to track personal points.
  *   **Whiteboard:** To track aggregate class results per round.

  ## Setup (5 Minutes)
  1.  **Divide the Class:** Randomly assign 8 students as **Signalers** and 8 students as **Receivers**. Have them sit in two rows facing each other, forming 8 pairs.
  2.  **Assign Types:** Privately hand one Type Card to each Signaler. Ensure exactly **4 Signalers are High (H)** and **4 Signalers are Low (L)**. Receivers are not assigned types.
  3.  **Confidentiality:** Instruct students not to show their Type Card or their decision slips to anyone except the instructor during tallying. They may not speak to their partner during play.
  4.  **Goal:** Tell students: "Your goal is to maximize your own individual point total over three rounds. There is no team score."

  ## Rules & Payoff Structure
  Explain that the **Benefit of Trust** and **Receiver Payoffs** remain constant throughout all three rounds. Only the **Signaler's Cost** changes.

  **Constant Payoffs (All Rounds):**
  *   **Receiver:**
      *   If you choose **Trust** and Signaler is **H**: You get **+30 points**.
      *   If you choose **Trust** and Signaler is **L**: You get **-30 points**.
      *   If you choose **Pass**: You get **0 points**.
  *   **Signaler:**
      *   If Receiver chooses **Trust**: You get **+50 points** (Gross Benefit).
      *   If Receiver chooses **Pass**: You get **0 points**.
      *   *Minus* the **Cost of Signaling** (varies by round).

  **Round-Specific Signaling Costs:**
  *   **Round 1 (Cheap Talk):** Cost to Signal = **0** (for both H and L).
  *   **Round 2 (Uniform Cost):** Cost to Signal = **20** (for both H and L).
  *   **Round 3 (Differential Cost):** Cost to Signal = **10** (for H) and **40** (for L).

  *Note: Choosing "Silent" always has a cost of 0. If a Signaler chooses "Silent," the Receiver automatically gets "Pass" payoff (0), and Signaler gets 0.*

  ## Timeline & Procedure (70 Minutes Total)

  ### Round 1: Cheap Talk (15 Minutes)
  1.  **Announce Rules:** State the Constant Payoffs and Round 1 Costs (Cost = 0).
  2.  **Decision:** Signalers write "Signal" or "Silent" on a slip. Receivers write "Trust" or "Pass" on a slip. (Give them 2 minutes).
  3.  **Exchange:** Pairs exchange slips simultaneously.
  4.  **Tally:** Students calculate their own scores. Instructor asks for a show of hands: "How many Signalers signaled?" "How many Receivers trusted?" Record aggregate data on the board (e.g., 8/8 signaled, 2/8 trusted).
  5.  **Silence:** Do not discuss strategy yet.

  ### Round 2: Uniform Cost (15 Minutes)
  1.  **Announce Rules:** State that the Cost to Signal is now **20 points for everyone**. Types (H/L) remain the same as Round 1.
  2.  **Decision:** Signalers and Receivers make new decisions on fresh slips. (2 minutes).
  3.  **Exchange & Tally:** As before. Record aggregate data on the board.
  4.  **Silence:** Do not discuss strategy yet.

  ### Round 3: Differential Cost (15 Minutes)
  1.  **Announce Rules:** State that Costs have changed based on Quality. **H pays 10, L pays 40**. Remind them they know their own type, but Receivers do not know the Signaler's type.
  2.  **Decision:** Signalers and Receivers make decisions. (2 minutes).
  3.  **Exchange & Tally:** As before. Record aggregate data.
  4.  **Reveal:** Ask Signalers to reveal their Types (H or L) to the class. Compare the behavior of H vs. L in this round.

  ### Transition to Debrief (5 Minutes)
  *   Collect score sheets.
  *   Ask students to calculate their total score across all three rounds.
  *   Move chairs into a circle for discussion.

  ***

  # Debrief Guide

  ### 1. Mapping the Rounds to Theory
  Do not start with definitions. Start with their data on the whiteboard.

  **Round 1 (The Collapse of Cheap Talk):**
  *   **Ask:** "In Round 1, signaling was free. How many Low Types signaled? How many Receivers trusted?"
  *   **Concept:** **Divergence of Interests.** Both H and L want to be Trusted. Since signaling cost nothing, L had every incentive to mimic H.
  *   **Outcome:** **Pooling Equilibrium.** The signal carried no information because both types sent it. Receivers learned that "Signal" $\neq$ "High Quality." Trust collapsed because the risk of -30 outweighed the expected gain of +30 when the probability of H was only 50%.
  *   **Philosophical Point:** Communication fails when interests diverge and there is no mechanism to enforce truth.

  **Round 2 (The Failure of Uniform Cost):**
  *   **Ask:** "We added a cost. Did honesty improve? Did Low Types stop signaling?"
  *   **Calculation:** "Low Types, if you signaled and were trusted, you gained 50 - 20 = 30. If you stayed silent, you got 0. Was it worth it to lie?" (Yes).
  *   **Concept:** **Cost is not enough.** A signal that is equally costly to everyone is just a tax. If the benefit of deception (50) exceeds the tax (20), low-quality signalers will still pay the tax to deceive.
  *   **Outcome:** Still a **Pooling Equilibrium**. Receivers still cannot distinguish H from L. Trust likely remained low.
  *   **Philosophical Point:** Mere expense does not guarantee honesty. A Ferrari is expensive, but a criminal can lease one to fake wealth.

  **Round 3 (The Handicap Principle):**
  *   **Ask:** "What changed in the behavior of Low Types here? Why?"
  *   **Calculation:** "Low Types, if you signaled and were trusted, you gained 50 - 40 = 10. But if you were Distrusted, you lost 40. High Types, you gained 50 - 10 = 40."
  *   **Concept:** **Differential Cost / Condition-Dependence.** The cost must fall *more heavily* on the low-quality signaler.
  *   **Outcome:** **Separating Equilibrium.** High Types signal (net gain); Low Types stay silent (net loss or too risky). Receivers learn that "Signal" $\rightarrow$ "High Quality." Trust increases.
  *   **Philosophical Point:** This is Zahavi's **Handicap Principle**. Honesty is sustained not by moral intent, but by the physiological or economic structure of the cost. The signal is honest *because* it is wasteful for the liar to produce.

  ### 2. Index vs. Handicap Signals
  Draw a distinction on the board.

  *   **Index Signals:** The signal is physically tied to the quality. It *cannot* be faked regardless of cost.
      *   *Example:* The pitch of a roar is determined by the size of the vocal cords. A small animal physically cannot produce a deep roar.
      *   *Game Connection:* This game did **not** model Index signals. Low Types *could* have paid the 40 points. They chose not to because it wasn't profitable, not because it was impossible.
  *   **Handicap Signals:** The signal *can* be faked, but it is too costly for the low-quality individual to sustain.
      *   *Example:* A peacock's tail. A sickly peacock *could* grow a tail, but it would die from the energy drain or predation risk. A healthy peacock can afford it.
      *   *Game Connection:* This **is** what the game modeled. The honesty relies on the *choice* driven by differential cost, not physical impossibility.

  ### 3. Rationality vs. Evolution
  *   **Ask:** "You made choices based on math. How does this happen in nature? Do gazelles calculate points?"
  *   **Point:** In the game, honesty emerged from **rational choice**. In nature, honesty emerges from **natural selection**.
  *   **Mechanism:** Signalers who lied in Round 3 conditions would have paid high costs and failed to reproduce. Receivers who trusted liars would have been eaten (or mated poorly). Over generations, the strategies that remain are those that look like the rational choices you just made. The equilibrium is evolutionary, not cognitive.

  ***

  # Failure Modes & Limits

  ### Predictable Failures and Fixes

  **1. Collusion ("I'll signal, you trust, we split the points")**
  *   **Symptom:** Round 1 or 2 shows 100% Trust despite incentives.
  *   **Cause:** Students view the game as cooperative rather than competitive/individualistic.
  *   **Fix:** At the start of Round 2, announce: "The top 3 individual scores will receive [bonus points/credit/recognition]." This re-aligns incentives to self-interest. Remind them that in biology, genes are "selfish," not cooperative.

  **2. The "Altruistic Receiver"**
  *   **Symptom:** Receivers keep Trusting in Round 1 despite losing points.
  *   **Cause:** Social pressure to be nice or misunderstanding the payoff.
  *   **Fix:** During the Round 1 tally, publicly highlight a Receiver who lost points. Ask, "Why did you Trust?" If they say "I wanted to be fair," remind them: "In this simulation, a Receiver that Trusts a Liar goes extinct. You must play to survive."

  **3. Low Types Signal in Round 3**
  *   **Symptom:** Low Types still Signal, breaking the separation.
  *   **Cause:** Risk-seeking behavior or misunderstanding the cost (thinking they might get lucky).
  *   **Fix:** Use this as a teaching moment. "In evolutionary terms, this strategy is unstable. If Low Types signal, Receivers stop Trusting. If Receivers stop Trusting, Signaling becomes useless. The system collapses back to Round 1." This illustrates why the equilibrium is stable only when L types *do not* signal.

  **4. The "Rigged" Feeling**
  *   **Symptom:** Students complain Round 3 costs were arbitrary.
  *   **Cause:** The differential cost feels imposed by the instructor rather than emerging from the system.
  *   **Fix:** Acknowledge this. "In the game, I set the costs. In nature, physics and physiology set the costs. A heavy tail is harder for a weak bird to carry. That isn't rigged; it's biology. The game abstracts that physical reality into point values."

  ### What the Game Cannot Reproduce

  **1. Co-evolutionary Time**
  *   **Limit:** The game happens in minutes. Students use **rational foresight**.
  *   **Reality:** Signaling systems evolve over millennia. Receivers and Signalers do not "decide"; successful strategies replicate, unsuccessful ones vanish.
  *   **Discussion:** Be frank that you are simulating the *equilibrium state* of an evolutionary process, not the process itself. Students are acting as "smart genes," which is a useful heuristic but not biologically literal.

  **2. Continuous Quality**
  *   **Limit:** The game uses binary types (High/Low).
  *   **Reality:** Quality is a spectrum.
  *   **Discussion:** Mention that in continuous models, signal intensity scales with quality (e.g., brighter plumage for healthier birds), but the logic of differential cost remains the same.

  **3. Multiple Signals**
  *   **Limit:** Single signal (Signal/Silent).
  *   **Reality:** Animals use multiple modalities (visual, auditory, chemical).
  *   **Discussion:** If time permits, note that real systems often layer handicaps to ensure robustness, but the core logic of condition-dependent cost applies to each.
