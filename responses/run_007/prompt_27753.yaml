answer: |-
  You are right to be annoyed, and your intuition about the circularity is philosophically sharp. Your friend is making a category error: they are conflating a *statistical inference* with an *ontological claim*.

  Here is the breakdown of the implicit theory your friend (and the bank's heuristic) is relying on, whether it holds water, and what would change if you actually cared about causal mechanisms rather than statistical outliers.

  ### 1. The Implicit Theory: Behavioral Operationalism
  The fraud detection system, and your friend's justification of it, presupposes a view of identity and mechanism that we can call **Behavioral Operationalism**.

  Under this view, "you" (the mechanism generating transactions) are not defined by your internal state (your intentions, your physical presence, your authorization), but exclusively by your **observable output distribution**.
  *   **The Axiom:** The "mechanism" is identical to the historical pattern of its outputs.
  *   **The Inference:** If the output deviates significantly from the historical distribution ($P(Transaction | History)$ is low), the generating mechanism *must* have changed.
  *   **The Identity Condition:** Mechanism A = Mechanism B if and only if they produce statistically indistinguishable data streams.

  This is a Humean view of causality. It assumes there is no hidden "glue" (like your physical body or your intent) holding your identity together; there is only the "constant conjunction" of events. If the conjunction breaks, the identity is broken. In this framework, "fraud" isn't defined as "someone else using your card"; it is defined as "data that does not fit the curve."

  ### 2. Does This Theory Hang Together?
  **Pragmatically:** Yes.
  **Ontologically:** No.

  **Where it works:**
  For a bank, the *cost* of a fraud transaction and the *cost* of a blocked legitimate transaction are both calculable risks. If 99% of transactions that look like *this* (different city, luxury store) are fraud, blocking them minimizes aggregate loss. As a risk model, it is coherent.

  **Where it fails (The Circularity):**
  Your critique hits the ontological failure. The theory cannot distinguish between **Contextual Variation** (same agent, new environment) and **Agent Substitution** (different agent, same environment).
  *   **Non-Stationarity:** Humans are not stationary processes. We change. We travel. We have emergencies. The Operationalist theory assumes the "mechanism" (you) is static. When you change your behavior legitimately, the system diagnoses a change in *mechanism* rather than a change in *state*.
  *   **Reification:** Your friend is reifying the model. They are treating the statistical outlier (the symptom) as proof of a different generator (the cause). But as you noted, the system sees *only* the outlier. To say it "knows" the mechanism is different is circular; it defines "different mechanism" as "that which produces outliers."

  So, the theory hangs together as a **heuristic for risk**, but it falls apart as a **theory of action**. It treats a low-probability event as evidence of a different *cause*, when it is often just evidence of a different *context*.

  ### 3. Carving by Causal Structure vs. Output Shape
  If the system carved "mechanisms" by underlying causal structure (i.e., *who* authorized the action and *why*) rather than output shape (i.e., *does this look like past actions*), the architecture would need to change fundamentally.

  **Current System (Output Shape):**
  *   **Input:** Transaction amount, merchant category, location, time.
  *   **Logic:** "Does this fit the cluster of past points?"
  *   **Goal:** Anomaly Detection.

  **Causal System (Underlying Structure):**
  *   **Input:** Biometric verification, device cryptographic handshake, explicit intent signal (e.g., pre-authorization in an app), geolocation correlation with phone GPS.
  *   **Logic:** "Is there a causal chain linking the authorized agent to this specific request?"
  *   **Goal:** Authorization Verification.

  **What would change in practice?**
  1.  **Friction would shift, not disappear:** Instead of blocking the transaction and making you call later (reactive), the system would demand a causal proof at the moment of purchase (proactive). E.g., "Your phone GPS matches the store GPS; enter biometric ID."
  2.  **Travel would be irrelevant:** If the causal link (your phone + your fingerprint) is present, the *location* becomes data, not a risk factor. The mechanism is identified by the *key*, not the *lock*.
  3.  **False Positives would drop, False Negatives might rise:** If a thief steals your card *and* your phone *and* coerces your fingerprint, a causal system might pass it (because the causal chain is intact), whereas a behavioral system might block it (because the spending pattern is weird). A causal system secures the *agent*, not the *pattern*.

  ### 4. Is the Practice Committed to This View?
  Here is the crucial distinction: **The bank is not committed to this view; your friend is.**

  **The Bank (The Pragmatist):**
  The bank's system is theoretically agnostic. It does not actually care if the mechanism is "you traveling" or "a thief in Moldova." It cares about **Expected Loss**.
  *   It treats the *uncertainty* generated by the anomaly as a liability.
  *   It does not presuppose the mechanism *is* different; it presupposes the *probability of loss* is higher.
  *   If you call and verify, they unblock it immediately. This proves they don't actually believe the mechanism *must* be different; they just believe the *risk* was unmanaged.

  **Your Friend (The Naive Realist):**
  Your friend is committed to the Behavioral Operationalist view. They are defending the block by claiming the system *detected a truth* ("different mechanism") rather than admitting the system *managed a risk* ("high uncertainty").
  *   They are treating the model's output as a metaphysical reality.
  *   They are confusing **epistemology** (what the bank can know) with **ontology** (what actually happened).

  ### Summary
  Your friend's argument is circular because it defines "mechanism" by "statistical deviation." If you define mechanism that way, then yes, every anomaly is a different mechanism—but that definition renders the word "mechanism" useless for distinguishing between *you on vacation* and *a thief*.

  The bank's practice isn't actually committed to the idea that you *are* a fraudster; it is committed to the idea that **anomalies are expensive**. Your friend is trying to sell you a metaphysical justification for a financial insurance policy. You were right: the system couldn't tell the difference between a changed context and a changed agent. It just priced the uncertainty as fraud.
