      *   *Section 2: Coherence Check.* Does it work? Yes, for money. No, for truth. It conflates *novelty* with *hostility*. It assumes the past predicts the future perfectly, which ignores human agency/adaptability.
      *   *Section 3: The Causal Alternative.* If we cared about *causal structure* (Agent + Intent), we'd need different data. Biometrics, device fingerprinting, explicit intent signals. The goal shifts from "Anomaly Detection" to "Authorization Verification."
