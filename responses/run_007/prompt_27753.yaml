      *   **Questions to Answer:**
          1.  What is the implicit theory of "mechanism" presupposed by current fraud detection practices?
          2.  Does this theory hang together (is it coherent/valid)?
          3.  What would change if the system carved mechanisms by *underlying causal structure* (intent/agent) rather than *output data shape* (statistical anomaly)?
          4.  Is the practice *actually committed* to that view, or is it agnostic/theory-neutral?

  2.  **Analyze the Implicit Theory of "Mechanism":**
      *   *Current Practice:* Fraud detection systems (FDS) are primarily statistical/behavioral. They build a profile (baseline distribution) of $P(Transaction | User)$.
      *   *The Friend's Language:* "Different mechanism."
      *   *The Reality:* The system doesn't know the mechanism. It knows the *deviation*.
      *   *Implicit Theory:* **Operationalism/Behaviorism.** A "mechanism" is defined *exhaustively* by its observable output distribution. If $P(Output | Context)$ shifts significantly, the "mechanism" is deemed different. This is essentially a "Black Box" theory of identity. Mechanism = Input/Output function. If the function changes, the mechanism changes.
      *   *Philosophical Label:* This aligns with *phenomenalism* or *instrumentalism* regarding the agent. The "self" is just a stable pattern of behavior.

  3.  **Evaluate Coherence (Does it hang together?):**
      *   *Pros:* It works pragmatically. It minimizes loss. It's computationally feasible.
      *   *Cons:* It creates false positives (like the user's trip). It conflates *contextual variation* (same agent, new environment) with *agent substitution* (different agent). It assumes stationarity (that the user's behavior won't change), which is false for humans.
      *   *Verdict:* It hangs together *operationally* (as a risk model) but fails *ontologically* (as a theory of what constitutes an action/agent). It treats the symptom (anomaly) as the cause (fraud).

  4.  **Contrast with Causal Structure (Intent/Agent):**
      *   *Current:* Mechanism = Statistical Distribution.
      *   *Causal:* Mechanism = Intentional Agent + Authorization State.
      *   *What would change?*
          *   Need for out-of-band verification (2FA, geolocation + intent signal).
          *   Contextual modeling (detecting "travel mode" vs. "theft mode").
          *   Shift from "Is this likely?" to "Is this authorized?"
          *   Reduced friction for known context shifts (e.g., travel notices, though these are outdated now, maybe dynamic context inference).

  5.  **Address Agnosticism (Is it committed to the view?):**
      *   *Crucial Point:* The *algorithm* doesn't care about philosophy. It optimizes a loss function.
      *   *The Friend's Mistake:* The friend is retrofitting a metaphysical explanation ("different mechanism") onto a statistical heuristic ("low probability").
      *   *System's Stance:* The system is theoretically agnostic. It treats the *risk* as the same, regardless of the *cause*. It doesn't presuppose the mechanism *is* different; it presupposes the *risk profile* is identical.
      *   *Refinement:* The practice isn't committed to the *ontology* of the mechanism, but it is committed to the *equivalence of risk* associated with statistical outliers.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's frustration. It's a classic False Positive scenario. Acknowledge the philosophical depth of the question (it's not just about banking, it's about identity and causality).
