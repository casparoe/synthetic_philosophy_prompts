answer: |-
  # JOINT STATEMENT ON RELIGIOUS REASONS IN PUBLIC ADVOCACY

  **Issued by representatives of Public Reason Liberalism and Religious Reasons Inclusivism following adversarial collaboration.**

  ### I. Shared Premises

  We, the undersigned, affirm the following claims as the common ground for our continued debate regarding the role of religious arguments in democratic advocacy. We stipulate that these claims are non-vacuous and commit both parties to specific constraints on political justification.

  1.  **The Coercive Nature of Law:** Criminal and civil laws are not merely advisory; they are backed by the state's monopoly on legitimate force. Compliance is mandatory, and violation invites sanction, imprisonment, or fines.
  2.  **The Requirement of Public Justification:** Because the state coerces all citizens, the fundamental terms of political cooperation must be justifiable to those citizens regarded as free and equal. A law lacks legitimacy if it is justified solely by appeal to the private interests of a ruling faction.
  3.  **Institutional Neutrality:** State institutions (legislatures, courts, executive agencies) must not justify policy outcomes by asserting the truth of one comprehensive religious or philosophical doctrine over another. The state may not declare a specific theology correct.
  4.  **The Integrity of Religious Citizens:** Religious convictions are not inherently irrational, dangerous, or private preferences. For many citizens, religious commitments constitute their primary moral framework and are integral to their identity and conscience. Asking citizens to bracket these commitments imposes a significant burden on their integrity.

  ### II. Table of Residual Disagreements

  The following table outlines where our consensus ends. We have formulated each position to ensure proponents of each view recognize their own arguments. We have also distinguished between *genuine* disagreements (conflicting claims about justice or stability) and *verbal* disagreements (conflicts arising from differing definitions of key terms).

  | Issue | Public Reason Liberal (PRL) Position | Religious Reasons Inclusivist (RRI) Position | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Scope of the Duty of Civility** | The duty to justify coercive laws using only public reasons applies to **citizens** when they vote and advocate for constitutional essentials, not solely to officials. | The duty to use public reasons applies strictly to **officials** (judges, legislators) acting in their formal capacity. Citizens in the "background culture" owe no such restriction. | **Genuine:** Disagreement over the moral obligations of democratic citizenship versus free speech rights. |
  | **2. Accessibility of Reasons** | A reason is public only if it is **shareable**: its persuasive force relies on premises and methods of reasoning accessible to all reasonable citizens, regardless of their comprehensive doctrine. | A reason is public if it is **intelligible**: even if the premise is religious, the argument can be understood and engaged with by others without requiring conversion. | **Verbal/Genuine:** Disagreement over whether "public" means *accessible in principle* (RRI) or *acceptable in principle* (PRL). |
  | **3. The Proviso** | Religious reasons may be introduced in public debate only on the **proviso** that in due course, proper public reasons are presented to support the same conclusion. | No proviso is required. Religious reasons can stand as sufficient justification for policy preferences if they aim at the common good and are offered respectfully. | **Genuine:** Disagreement over whether religious reasons are inherently insufficient for coercive justification. |
  | **4. Secular Comprehensive Doctrines** | Kantianism, Utilitarianism, and other secular comprehensive doctrines are subject to the same restrictions as religious doctrines when used to justify law. | Restrictions disproportionately burden religious citizens because secular ideologies often mask themselves as "neutral" public reason, creating an asymmetry. | **Genuine:** Disagreement over whether the restriction is neutral in effect or inherently biased against religion. |

  ### III. Cruxes and Empirical Tests

  We identify three substantive cruxes where settling the factual or normative underlying question would move at least one side toward the other's position. For each crux, we specify a concrete historical or hypothetical case we agree bears on the issue, and we record our divergent predictions regarding that case.

  #### Crux 1: The Asymmetry Objection
  **Question:** Does the exclusion of religious reasons unfairly privilege secular comprehensive doctrines that function similarly to religions (e.g., strict utilitarianism or Kantianism) but are exempted from the "public reason" constraint?

  *   **Concrete Case:** A legislative debate on euthanasia where a secular utilitarian argues solely from "maximization of welfare" and a religious citizen argues solely from "sanctity of life."
  *   **PRL Prediction:** The utilitarian argument can be reformulated into public health and safety metrics accessible to all, whereas the religious argument relies on metaphysical claims inaccessible to non-believers. The asymmetry is apparent, not real.
  *   **RRI Prediction:** The utilitarian argument relies on faith in a specific moral calculus not shared by all reasonable citizens. Excluding the religious argument while accepting the utilitarian one demonstrates that "public reason" is itself a sectarian comprehensive doctrine.

  #### Crux 2: Translation Loss
  **Question:** Can religious moral insights be translated into public reason without losing the specific moral force or motivation necessary to sustain justice?

  *   **Concrete Case:** The American Civil Rights Movement, specifically Dr. Martin Luther King Jr.'s *Letter from Birmingham Jail*.
  *   **PRL Prediction:** King's arguments were effective because they were eventually grounded in Constitutional values and Natural Law (public reasons). The religious language was rhetorical ornamentation that could be stripped away without losing the political justification.
  *   **RRI Prediction:** King's arguments derived their unique moral urgency and motivational power precisely from their religious grounding. Translating them into purely secular Constitutional terms would have diluted the moral force necessary to overcome unjust laws.

  #### Crux 3: The Proviso and Stability
  **Question:** Does requiring religious citizens to supplement their reasons with public ones (the Proviso) promote long-term stability, or does it foster resentment and alienation among religious minorities?

  *   **Concrete Case:** A conscientious objector opposing a vaccine mandate whose objection is rooted solely in a theological view of bodily purity, for which no secular equivalent exists.
  *   **PRL Prediction:** Granting exemptions based solely on non-public reasons undermines the rule of law and social trust. Stability requires that all exemptions be justifiable via public health or liberty principles accessible to all.
  *   **RRI Prediction:** Denying exemptions because the reason is religious signals second-class citizenship. Stability is better served by accommodating sincere conscientious objections regardless of their source, preventing radicalization.

  ### IV. Commitment to Continued Dialogue

  We acknowledge that our disagreements are not merely semantic but reflect deep tensions between the values of democratic legitimacy and inclusive participation. We commit to testing our predictions against future political developments and agree that if evidence shows that inclusive advocacy leads to greater instability (confirming PRL fears) or that exclusive advocacy leads to systemic injustice against religious citizens (confirming RRI fears), we will revise our respective positions accordingly.

