answer: |-
  Here is the specification of desiderata for a theory of metaphysical grounding and fundamentality, structured for comprehensive exam preparation.

  ### I. Extensional Adequacy: The Classification of Cases
  A theory must provide a consistent verdict on the following paradigmatic cases. While verdicts may vary by camp, the theory must be able to *accommodate* the standard intuitions or provide a compelling error theory for why they are mistaken.

  1.  **Determinates and Determinables:**
      *   *Case:* The rose is scarlet; therefore, the rose is red.
      *   *Desideratum:* The theory must classify the determinate (scarlet) as grounding the determinable (red), not vice versa, and not as a symmetric relation.
  2.  **Truth-Functional Compounds:**
      *   *Case:* $P$ is true; therefore, $P \lor Q$ is true.
      *   *Desideratum:* The true disjunct must ground the true disjunction. The theory must explain why the disjunction does not ground the disjunct.
  3.  **Set-Theoretic Ontology:**
      *   *Case:* Socrates exists; therefore, {Socrates} exists.
      *   *Desideratum:* Following Fine, the theory should typically classify the member as grounding the singleton, not vice versa, despite their necessary coexistence.
  4.  **Mereology (Composition):**
      *   *Case:* The bricks exist and are arranged wall-wise; therefore, the wall exists.
      *   *Desideratum:* The theory must take a stance on whether parts ground the whole (Classical Mereology) or the whole grounds the parts (Priority Monism). It cannot remain silent; it must validate one direction as the standard or mark the other as a substantive rival.
  5.  **Infinite Descent (Gunk):**
      *   *Case:* A world where every object has proper parts, ad infinitum.
      *   *Desideratum:* The theory must determine if grounding is possible in this world. It must either rule out gunk by fiat (via structural constraints) or allow for infinite grounding chains without a foundation.
  6.  **Logical and Mathematical Truths:**
      *   *Case:* $2+2=4$ or the Law of Non-Contradiction.
      *   *Desideratum:* The theory must assign a status: are these ungrounded (fundamental), grounded in nothing (zero-grounded), or grounded in linguistic/conceptual facts? It cannot leave them unclassified.

  ### II. Conceptual Distinctions: What Grounding Is Not
  A theory must delineate grounding from nearby concepts to avoid collapsing into reductionism or confusion.

  1.  **Grounding vs. Causation:**
      *   *Consideration:* Causation is diachronic (temporal) and typically distinct from metaphysical explanation.
      *   *Desideratum:* The theory must allow for synchronic dependence (the statue depends on the clay *now*, not because the clay caused it earlier).
  2.  **Grounding vs. Necessitation/Supervenience:**
      *   *Consideration:* Necessary co-extension does not imply grounding (e.g., being triangular vs. being trilateral; Socrates vs. {Socrates}).
      *   *Desideratum:* The theory must be **hyperintensional**. It must distinguish between propositions that are necessarily equivalent but differ in explanatory order.
  3.  **Full vs. Partial vs. Mediate Ground:**
      *   *Consideration:* Some facts suffice for a consequence alone (full); others require supplementation (partial). Some grounds are immediate; others are distant (mediate).
      *   *Desideratum:* The theory must distinguish the *sufficiency* of the ground from the *distance* of the ground. (e.g., The scarlet color is a partial ground for "colored," but a full ground for "red").
  4.  **Ungrounded vs. Fundamental:**
      *   *Consideration:* A fact might lack a ground (brute) but not be part of the fundamental base (e.g., a brute emergent property).
      *   *Desideratum:* The theory must distinguish *ontological fundamentality* (building blocks of reality) from *explanatory independence* (lack of ground). They often coincide, but the theory must allow them to come apart conceptually.
  5.  **Worldly Relation vs. Explanatory Device:**
      *   *Consideration:* Is "because" a feature of the world (realism) or a feature of our representation (deflationism/conceptualism)?
      *   *Desideratum:* The theory must specify whether grounding is an objective relation between facts/entities or a primitive operator in our discourse.

  ### III. Formal Features: The Logic of Grounding
  A theory must commit to a formal logic for the grounding relation. For each feature, the case for and against is provided.

  1.  **Irreflexivity ($\neg(x \prec x)$):**
      *   *Case For:* Self-grounding implies circular explanation, which is vicious.
      *   *Case Against:* Some holistic or dialetheic views suggest certain truths might be self-explanatory.
      *   *Status:* **Non-negotiable** for standard accounts.
  2.  **Asymmetry (If $x \prec y$, then $\neg(y \prec x)$):**
      *   *Case For:* Grounding provides directionality. If $x$ grounds $y$, $y$ is derivative of $x$; $x$ cannot also be derivative of $y$.
      *   *Case Against:* Mutual dependence (e.g., mind/body interaction, or holistic coherence theories) might require symmetry.
      *   *Status:* **Non-negotiable** for standard accounts; denial moves the view to Coherentism.
  3.  **Transitivity (If $x \prec y$ and $y \prec z$, then $x \prec z$):**
      *   *Case For:* Explanation chains should connect. If the mental grounds the social, and the physical grounds the mental, the physical grounds the social.
      *   *Case Against:* Counterexamples exist (e.g., determinables: Scarlet grounds Red, Red grounds Colored, but some argue Scarlet does not directly ground Colored in the same way).
      *   *Status:* **Contested.** Many accept it, but some argue for non-transitive grounding.
  4.  **Well-Foundedness (No infinite descending chains):**
      *   *Case For:* Without a bottom, explanation is never complete; reality lacks a basis (The "Turtle Problem").
      *   *Case Against:* Rules out gunky worlds a priori. Infinitists argue infinite chains can be explanatory.
      *   *Status:* **Camp Preference.** This is the primary divide between Foundationalists and Infinitists/Gunk theorists.

  ### IV. Tensions and Incompatibilities
  The following pairs of desiderata generate significant friction. Satisfying both often requires costly theoretical maneuvers.

  1.  **Well-Foundedness vs. The Possibility of Gunk:**
      *   *Tension:* If grounding *must* be well-founded (non-negotiable structural constraint), then a gunky world is metaphysically impossible. If gunk is possible (modal intuition), well-foundedness must be dropped.
      *   *Cost:* You must choose between a structural constraint on explanation or a modal constraint on reality.
  2.  **Hyperintensionality vs. Grounding Necessitarianism:**
      *   *Tension:* If grounds *necessitate* what they ground (a common intuition), it is difficult to maintain hyperintensionality (since necessary equivalents should be interchangeable). Fine's challenge: How can $A$ ground $B$ if $A$ and $B$ are necessary equivalents but distinct?
      *   *Cost:* You must either deny that grounds necessitate (controversial) or adopt a very fine-grained theory of facts/properties to preserve hyperintensionality.
  3.  **Grounding as a Real Relation vs. The Grounding of Grounding:**
      *   *Tension:* If grounding is a worldly relation $R(x,y)$, then the fact that $R(x,y)$ obtains is itself a fact. Does *that* fact need grounding?
      *   *Cost:* If yes, regress looms (the "grounding regress"). If no, there is an ungrounded relational fact, which complicates the claim that only the fundamental is ungrounded. Deflationists avoid this by denying the relation exists.

  ### V. Constraints vs. Camp Preferences
  To pass the exam, you must distinguish what defines the *concept* from what defines a *school of thought*.

  **Non-Negotiable Constraints (Constitutive of "Grounding"):**
  *   **Hyperintensionality:** If the theory collapses into modal supervenience, it is not a theory of grounding.
  *   **Irreflexivity & Asymmetry:** If the theory allows loops or self-grounding, it is typically reclassified as Coherentism or Holism, not standard Grounding Theory.
  *   **Synchronicity:** If the theory requires temporal delay, it is Causation, not Grounding.

  **Camp Preferences (Substantive Metaphysical Commitments):**
  *   **Well-Foundedness:** Required by **Foundationalists**; rejected by **Infinitists** and **Gunk Theorists**.
  *   **Direction of Mereology:** Parts ground Whole (**Pluralists**); Whole grounds Parts (**Priority Monists**).
  *   **Status of Logical Truths:** Grounded in nothing (**Zero-grounding**); Ungrounded (**Brute**); Grounded in concepts (**Conceptualism**).
  *   **Reality of the Relation:** Real relation (**Realists/Primitivists**); Linguistic/Conceptual device (**Deflationists** like Dasgupta or Wilson).

  ### VI. The Exclusionary Requirement
  **Requirement:** **Well-Foundedness.**

  **Why:** This single structural constraint does the most work to exclude main extant positions.
  1.  **Excludes Infinitism:** It rules out the view that reality consists of an infinite chain of dependence with no bottom.
  2.  **Excludes Gunk:** It renders metaphysically impossible any world composed entirely of composite objects with no simples.
  3.  **Excludes Certain Monist/Holist Views:** Some holistic views rely on mutual dependence or circularity that well-foundedness forbids.
  4.  **Forces Foundationalism:** It mandates that there *must* be a fundamental level.

  While **Hyperintensionality** excludes Modal Reductionists (the predecessors to grounding theory), **Well-Foundedness** is the primary fault line *within* the contemporary grounding literature itself. Adopting it as a non-negotiable constraint effectively declares Foundationalism the only game in town, forcing all rivals (Infinitists, Gunk theorists, some Monists) to argue that the *concept* of grounding does not require it, even if *reality* is well-founded. It is the most substantive "formal" commitment a theory can make.
