          *   *Examples:* Specific neuron polysemanticity, attention heads that emerge due to residual stream capacity limits rather than direct utility.
          *   *Verdict:* It maps best to "architectural artifact" or "optimization artifact," but the "co-option" part is hard because ML models don't usually "live" long enough to be repurposed without retraining.

      *   *Q2: Inferring History from Utility?*
