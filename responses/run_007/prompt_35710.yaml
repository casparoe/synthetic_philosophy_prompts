          *   *Assessment:* It's a common heuristic, but potentially misleading. It suggests a separation between "mental stuff" and "physical stuff" that functionalists (who are usually physicalists) want to avoid. Functionalism is about *causal roles*, not necessarily an ontological distinction like software vs. hardware.
