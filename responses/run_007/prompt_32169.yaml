  **The asymmetry**

  The Knobe effect presents a stark asymmetry in folk judgments of intentional action. In the harm case, a chairman pursues profit knowing it will damage the environment, expresses indifference, and proceeds. Most people label the harm intentional. In the help case, the chairman pursues profit knowing it will aid the environment, expresses the same indifference, and proceeds. Most people label the help unintentional. Crucially, the chairman's psychological state is identical in both scenarios: he possesses knowledge of the side effect, lacks a desire for the side effect, and prioritizes profit above all. Traditional action theory suggests intentionality depends on these internal states—belief, desire, and intention. Since these remain constant while the moral valence of the outcome flips, the resulting divergence in judgment creates a puzzle. Either our concept of intentional action is sensitive to moral outcomes, or our judgments are being skewed by factors external to the concept itself.

  **The moralized reading**

  The moralized reading argues that this asymmetry reveals something fundamental about the concept of intentional action itself: it is not value-neutral. Proponents claim that moral considerations penetrate the cognitive machinery used to attribute intentionality. We do not first determine if an act was intentional using purely descriptive psychological criteria and then apply moral judgment afterwards. Instead, the moral status of the outcome influences whether we categorize the act as intentional in the first place. When an outcome is bad, we are motivated to find an agent responsible for blame; consequently, we expand the criteria for intentionality to include known side effects. When an outcome is good, the motivation to assign credit is weaker or requires stronger endorsement, so we restrict the criteria. This view challenges the Standard View in philosophy of action, which treats intentionality as a purely descriptive category like "causation." If the moralized reading is correct, folk psychology is inherently normative. To understand someone as an agent is already to engage in a practice of holding them accountable. The concept of intentionality is thus inextricably linked to the practices of praise and blame, suggesting that morality is constitutive of agency rather than merely an evaluation applied to it. This implies that traditional action theory has been chasing a ghost; there is no neutral "intentional" to be found independent of our normative practices. The asymmetry isn't a bug in human reasoning, but a feature of how we conceive of agency itself. Furthermore, this reading accounts for the immediacy of the judgment. People do not hesitate or calculate; the moral valence triggers the intentional classification automatically. The boundaries of the concept shift depending on the stakes. This suggests that our cognitive architecture for understanding action is built around normative expectations, making the moralized reading a robust description of our actual conceptual competence. Consequently, philosophers cannot define intentional action without referencing the normative context in which the action occurs.

  **Deflationary readings**

  Deflationary readings attempt to save the traditional, neutral concept of intentionality by arguing the effect arises from factors outside the concept itself. One prominent view is the trade-off explanation. In the harm case, the environmental damage is a cost the agent accepts to gain profit; he effectively "buys" the profit with the harm. In the help case, the environmental benefit is a free bonus; he pays no cost for it. On this view, intentionality tracks whether the side effect was weighed against the goal as a counter-reason, not its morality. People intuitively feel you intend what you are willing to sacrifice for, not what you merely allow to happen as a windfall.

  Another deflationary approach is the Deep Self view. This suggests intentionality tracks whether the outcome aligns with the agent's deeper values. In the harm case, indifference to harm reveals a bad character, making the harm expressive of who he truly is. In the help case, indifference to help reveals no particular virtue, so the help isn't expressive of his deep self. Here, "intentional" serves as a marker for actions that flow from the agent's core attitudes. It explains why we don't call reflexive actions intentional even if known; they don't reflect the self.

  A third variant argues this is merely pragmatic: people decide blame first, then use the word "intentional" loosely to justify that blame, knowing full well the strict definition isn't met. This distinguishes between conceptual competence (knowing what intention means) and performance (using the word to serve social goals).

  All these views share a core commitment: the underlying concept of intentional action remains descriptive and neutral. The asymmetry is produced by conversational implicature, differing psychological inputs regarding costs, or judgments about character, rather than a moralized concept. These accounts are attractive because they preserve the distinction between fact and value. They allow philosophers to maintain that intentionality is a matter of mental states, while acknowledging that moral judgments often piggyback on those states in complex ways. If successful, the Knobe effect is merely a performance error or a contextual nuance, not evidence that our core concept of agency is corrupted by morality. They suggest that if we stripped away the moral framing and focused strictly on the mental architecture, the asymmetry would vanish, revealing the neutral concept underneath. Ultimately, deflationaries argue that morality influences the application of the concept, not the concept's definition.

  **My verdict**

  My verdict is that the moralized reading is the most plausible. While deflationary accounts offer comforting continuity with traditional philosophy, they struggle to explain the robustness and universality of the effect. The trade-off view fails because asymmetries persist even when costs are controlled or removed in experimental variations. The Deep Self view is stronger, but it ultimately collapses into a moralized view: what counts as part of the "Deep Self" is itself determined by normative expectations. We identify an agent's true values based on what we think they should care about. The pragmatic view assumes people are systematically misleading each other about a core concept, which is an uncharitable interpretation of linguistic competence.

  The moralized reading accepts the data at face value: our concept of agency is inherently normative. This is not a defect but a feature. Human agency evolved within social groups where holding members accountable was crucial for cooperation. Therefore, the cognitive mechanism for identifying agents was designed to flag responsibility, not just track mental states. To call an action "intentional" is to mark it as appropriate for moral evaluation. This explains why the asymmetry is immediate and cross-cultural. It also resolves the philosophical tension by rejecting the assumption that descriptive and normative domains must be separate. We should conclude that the concept of intentional action is moralized. Trying to purify it of moral content ignores how the concept actually functions in human life. The Knobe effect shows that we cannot understand agency without understanding responsibility. The deflationary attempt to salvage a neutral concept is a theoretical imposition that contradicts our lived experience of judging others. We do not observe behavior, calculate mental states, and then add morality; we see responsible agents acting in a moral world. The concept of intentionality is the bridge between the two, and it must bear the weight of both. Philosophy of action must therefore abandon the quest for a value-free definition and embrace the normative nature of agency.
