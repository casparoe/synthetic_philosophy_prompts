answer: |-
  **Materials & Rules**
  *   **Randomizer:** One 10-sided die (1–6 = Heads/Win, 7–0 = Tails/Loss). Project the rolls.
  *   **Tracking:** Each student gets a sheet (columns: Round, Stake %, Result, New Total) or uses a phone calculator.
  *   **Mechanics:** Start with 100 chips. Each round, students secretly write a stake percentage (0–100%) of their *current* bankroll. Reveal bets simultaneously. Roll die. Wins add stake to bankroll; losses subtract it.
  *   **Elimination:** If bankroll hits 0, you bust (stay seated, observe).
  *   **Prize:** Largest final bankroll wins a chocolate bar.

  **Timeline (75 Minutes)**
  *   **0–10 min:** Distribute sheets. Explain rules neutrally. Emphasize: "Positive expected value bet." Do not mention Kelly or risk management.
  *   **10–40 min:** The Game. 30 rounds. Aim for 1 minute/round. Project a live leaderboard (top 5 stacks) after every 5 rounds to induce social pressure.
  *   **40–75 min:** Debrief (see below).

  **Logistics**
  *   **Secret Bets:** Essential. If students see others betting 100%, they may mimic. Collect bet slips or have them write hidden until the roll.
  *   **Leaderboard:** **Yes, display it.** It creates tournament incentives (risk-seeking to beat peers) which mirrors real-world fund manager pressures. It highlights the conflict between "winning the seminar" and "growing wealth robustly."
  *   **Calculations:** Allow phones. Manual compounding errors will frustrate the lesson.

  **Debrief Flow**
  1.  **The Outcome (5 min):** Plot final bankrolls on a **log scale**. Most will be near zero (busts); a few lucky moderate bettors will be high. Ask the all-in players: "EV was +20% per round. Why did you lose?"
  2.  **Arithmetic vs. Geometric (10 min):** Explain that Arithmetic Mean (EV) maximizes average outcome across *parallel universes*, but Geometric Mean maximizes growth in *one timeline* over time.
  3.  **The Math (10 min):** Show the ruin condition. All-in ($f=1$): One loss wipes you out. Probability of survival over 30 rounds is $0.6^{30} \approx 0$.
      Introduce the growth rate formula: $g = p \log(1+f) + q \log(1-f)$.
      Show that maximizing this yields $f^* = p - q = 20\%$.
  4.  **The Lesson (5 min):** Rationality isn't just EV. It's about non-ergodicity: you can't average across paths if you're dead on one.

  **Predictable Failures & Fixes**
  *   **Early Busts:** Half the class may go all-in and bust by round 5. They will check out.
      *   *Fix:* Let busted students become "auditors" tracking the leader's volatility, or let them bet on the remaining rounds with imaginary money to stay engaged.
  *   **Tiny Bets:** Some will bet 1% and survive with negligible growth.
      *   *Fix:* In debrief, acknowledge safety but highlight opportunity cost. They survived but didn't thrive.
  *   **The Prize Distortion:** The chocolate bar incentivizes max variance (all-in), not max growth.
      *   *Fix:* Explicitly discuss this. "To win the chocolate, you needed luck. To build wealth, you need Kelly. Don't confuse contest strategy with life strategy."

  **Limitations & Honesty**
  *   **30 Rounds is Too Short:** In 30 rounds, variance dominates. A lucky 100% bettor (if they survive) might beat a 20% bettor. The "almost surely" logic requires hundreds of rounds.
      *   *Fix:* During debrief, run a Python simulation live (projected) showing 1,000 rounds for 100 agents. Show the 20% bettors dominating the distribution while all-iners converge to zero. You must supply the long-run data the game cannot.
  *   **Discrete vs. Continuous:** Chips are discrete; Kelly assumes continuous wealth.
      *   *Fix:* Ignore this; it's negligible for this lesson.

  **Key Takeaway:** EV tells you what *should* happen on average; Geometry tells you what *will* happen to you.
