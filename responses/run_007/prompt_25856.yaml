      *   *Claim 1: The Logical Validity Claim.* (Narrowest). In a *deductive* argument, if all premises are descriptive, the conclusion cannot be normative. This is trivially true by definition of validity.
      *   *Claim 2: The Justificatory Gap Claim.* (Slightly broader). Descriptive facts alone cannot *justify* a normative conclusion without some bridging principle. This acknowledges that facts matter, but they aren't the whole story.
      *   *Claim 3: The Autonomy of Ethics Claim.* (Broader). Ethical truths are a distinct domain from scientific truths. Science can inform ethics, but it cannot *replace* ethical reasoning.
