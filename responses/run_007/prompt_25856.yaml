      *   *Interpretation 1 (Logical):* Valid deductive arguments cannot have purely descriptive premises and a normative conclusion. (The "No Normative Conclusion from Purely Descriptive Premises" rule).
      *   *Interpretation 2 (Epistemological):* Empirical methods alone cannot justify moral truths. You need something else (intuition, reason, sentiment).
      *   *Interpretation 3 (Metaphysical):* Moral properties do not exist in the natural world. Naturalism is false.
