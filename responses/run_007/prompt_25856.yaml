answer: |-
  You have hit on one of the most persistent sources of confusion in introductory ethics. Your intuition is correct: the slogan "you can't get an ought from an is" (often called **Hume's Law** or the **Is-Ought Problem**) is frequently weaponized as a conversation-stopper when it is actually a technical point about logical structure.

  When people use it to shut down arguments about evolutionary psychology or neuroscience, they are often sliding from a narrow logical truth to a broad metaphysical dogma without noticing the transition.

  Here is the breakdown of the distinct claims hidden inside that slogan, ordered from the narrowest (and most defensible) to the broadest (and least defensible), along with an assessment of whether they actually refute the arguments you described.

  ---

  ### 1. The Logical Validity Claim
  **The Claim:** In a formally valid *deductive* argument, you cannot derive a normative conclusion (an "ought") if *all* your premises are purely descriptive (an "is"). At least one premise must contain normative content.

  *   **Plausibility:** **Near 100%.** This is a truth of logic. If your premises describe the world (e.g., "Humans evolved to feel disgust") and your conclusion prescribes action (e.g., "You ought not trust disgust"), there is a missing link. Without a rule connecting the description to the prescription, the logic doesn't hold.
  *   **Does it dismiss your examples?** **No.**
      *   **Why:** Pointing this out doesn't prove the argument wrong; it just proves the argument is *incomplete*.
      *   **Application:** If someone says, "Disgust is unreliable, so we ought to ignore it," the Logical Validity Claim simply asks: "What is your bridge premise?" The arguer can easily reply: "Oh, I assumed we ought to base judgments on reliable mechanisms." Once that normative premise is added, the logic is valid.
      *   **Verdict:** This is a tool for **clarification**, not refutation. It forces the arguer to make their values explicit, but it does not show those values are wrong.

  ### 2. The Justificatory Gap Claim
  **The Claim:** Descriptive facts alone cannot *justify* a moral conclusion. You need a normative principle to do the heavy lifting. Science can tell us what *is* possible or what *is* happening, but it cannot tell us what *matters*.

  *   **Plausibility:** **High.** This is the standard philosophical interpretation of Hume. It acknowledges that facts are necessary for ethics (you can't know what to do if you don't know how the world works), but insists they are not *sufficient*.
  *   **Does it dismiss your examples?** **No, but it shifts the burden.**
      *   **Why:** This claim admits that evolutionary psychology is relevant, but insists it isn't the whole story. It challenges the arguer to defend the *bridge principle* (e.g., "Why *ought* we align our morals with our evolution?").
      *   **Application:** In the in-group bias example, this claim asks: "Just because we evolved to favor our tribe, why should we continue to do so? Maybe we ought to overcome our evolution." It doesn't rule out the argument; it just demands a reason for choosing that specific normative path.
      *   **Verdict:** This does real **argumentative work**. It prevents scientists or psychologists from claiming their data *automatically* solves moral problems without philosophical reasoning.

  ### 3. The Autonomy of Ethics Claim
  **The Claim:** Ethical reasoning is a distinct domain from scientific reasoning. You cannot *reduce* moral truths to natural facts. Even if we know all the physical and psychological facts about the universe, we still need a separate faculty (reason, intuition, sentiment) to determine value.

  *   **Plausibility:** **Contested.** This is the battleground between **Moral Naturalists** (who think good/bad are natural properties like health/sickness) and **Non-Naturalists** (who think good/bad are sui generis). Many modern philosophers (like Philippa Foot or Rosalind Hursthouse) argue that for living things, "good" is tied to biological flourishing, which blurs this line.
  *   **Does it dismiss your examples?** **Sometimes, but often overreaches.**
      *   **Why:** If you hold this view, you might reject the idea that "disgust is unreliable" has *any* moral weight unless backed by a non-natural moral intuition. However, a Naturalist would argue that "reliability" is a functional good, similar to how a "good eye" is one that sees well.
      *   **Application:** If someone uses this to say, "Neuroscience is irrelevant to ethics," they are overreaching. Neuroscience tells us about agency, compulsion, and suffering, which are central to ethics.
      *   **Verdict:** This is often used as a **soft conversation-stopper**. It creates a wall between "science" and "morality" that is harder to cross than necessary, potentially ignoring how human nature constrains what is morally possible (e.g., "ought implies can").

  ### 4. The Metaphysical Irrelevance Claim
  **The Claim:** Facts about the natural world (including human nature, evolution, and psychology) have **no bearing** on what we ought to do. Morality is entirely separate from reality.

  *   **Plausibility:** **Low.** This is the "broadest and least defensible" reading. It implies that moral duties could exist even if they were impossible for humans to fulfill, or that the nature of the being subject to the duty doesn't matter. Most ethicists reject this.
  *   **Does it dismiss your examples?** **Yes, but illegitimately.**
      *   **Why:** This is the version of the slogan that says, "You're talking about biology, I'm talking about morality, so you're wrong." It treats the Is-Ought gap as a chasm rather than a step.
      *   **Application:** If someone says, "We evolved to care about kin," and you reply, "That's an 'is', so it implies nothing about 'ought'," you are ignoring that our moral obligations are likely grounded in the kinds of beings we are. If we were a different species (e.g., solitary drones), our "oughts" would differ. Therefore, the "is" of our nature *does* constrain the "ought."
      *   **Verdict:** This is a pure **conversation-stopper**. It is dogmatic. It pretends that because facts don't *guarantee* values, facts are *irrelevant* to values.

  ---

  ### Summary: How to Handle the Slogan

  When you encounter this slogan in the wild, you can now diagnose which claim is being made.

  1.  **If they mean Claim 1 (Logic):** Agree with them. "You're right, I left out a premise. My full argument is: Disgust is unreliable (Is), we ought to avoid unreliable judgment mechanisms (Ought), therefore we ought to distrust disgust (Ought)." This neutralizes their objection immediately.
  2.  **If they mean Claim 2 (Justification):** Engage with them. "Agreed, facts aren't sufficient. So let's debate the bridging principle: Should we align our morals with our evolutionary nature, or overcome it?" This moves the conversation to the actual disagreement.
  3.  **If they mean Claim 4 (Irrelevance):** Challenge them. "Are you saying human nature is totally irrelevant to human ethics? If humans couldn't feel pain, would we still have an obligation not to torture? If the 'is' of our psychology doesn't matter at all, what does morality apply to?"

  **The Bottom Line:**
  The slogan is a valid warning against **smuggling** values into facts without admitting it. It is **not** a valid proof that facts are irrelevant to values.

  In the examples you gave (evolutionary in-group bias, disgust reliability), the arguers are usually relying on a hidden normative premise like *"We ought to be rational"* or *"We ought to minimize error."* The "Is-Ought" objection is useful only if it forces them to admit and defend that premise. If it is used to suggest that evolutionary facts are simply out of bounds for moral discussion, it is being used dogmatically, and you are right to be frustrated.
