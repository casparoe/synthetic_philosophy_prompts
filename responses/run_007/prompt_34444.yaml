  2.  **Deconstruct the Paradoxes:**

      *   **Lottery Paradox (Kyburg, 1961):**
          *   Setup: Fair lottery with $N$ tickets, one winner.
          *   Beliefs: For each ticket $t_i$, it is highly probable it will lose ($P(\text{lose}) \approx 1$). So, I believe $t_i$ will lose.
          *   Conjunction: I believe $(t_1 \text{ loses} \land t_2 \text{ loses} \land \dots \land t_N \text{ loses})$.
          *   Conflict: I also know/believe one ticket *will* win. So I believe $\neg(t_1 \text{ loses} \land \dots \land t_N \text{ loses})$.
          *   Result: Inconsistency if belief is closed under conjunction.

      *   **Preface Paradox (Makinson, 1965):**
          *   Setup: An author writes a book with $N$ claims.
          *   Beliefs: For each claim $c_i$, the author has good evidence/reason to believe it. So, I believe $c_i$.
          *   Conjunction: I believe $(c_1 \land c_2 \land \dots \land c_N)$.
          *   Conflict: Based on humility/past experience, the author believes there is at least one mistake in the book. So I believe $\neg(c_1 \land \dots \land c_N)$.
          *   Result: Inconsistency if belief is closed under conjunction.

  3.  **Construct the Explicit Mapping:**
      *   Lottery Ticket $t_i$ loses $\leftrightarrow$ Book Claim $c_i$ is true.
      *   Probability of loss ($\approx 1$) $\leftrightarrow$ Evidential support for claim (high).
