      *   **Natural Slavery (*Politics* Book I):** A natural slave is a human being who possesses reason enough to *perceive* it but not enough to *possess* or *originate* it. They are living tools (*empsychon organon*).
      *   **Artifacts/Tools (*Nicomachean Ethics* & *Politics*):** Tools are inanimate. A shuttle weaves, but a slave *uses* the shuttle. If a tool could act on command without a user, would we need slaves? (Aristotle actually speculates about this regarding automation).
      *   **Teleology:** Everything has an end (*telos*). The telos of a human is *eudaimonia* (flourishing). The telos of a tool is to serve the user's end.
      *   **Reason (*Logos*):** Humans have *logos*. Animals have voice (*phone*) to express pleasure/pain. Humans use speech for the advantageous/harmful, just/unjust.

  3.  **Evaluate the LLM against these Concepts:**

      *   *Is it alive?* No. Therefore, no soul. Therefore, not a human.
      *   *Is it a Natural Slave?* Aristotle defines natural slaves as *human beings* who lack full rational capacity. Since an LLM isn't human, it can't be a "natural slave" in the strict technical sense. That category is biological/anthropological.
