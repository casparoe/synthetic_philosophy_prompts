          *   If it resonates, it's because human experience is shared, not because you stole it.
      *   **Creative vs. Derivative:**
          *   Derivative = Autopilot.
          *   Creative = Intentional choice.
          *   Ask: "What am I adding?"
      *   **Actionable Advice for the Coursework:**
          *   Lean into the specific details of Birmingham.
          *   Focus on voice.
          *   Stop worrying about the "skeleton" and worry about the "flesh."
      *   **Conclusion:** Reassure them. The feeling of unoriginality is a sign of growth.

  7.  **Refining the Tone:**
      *   Needs to be respectful (they are in Year 12, so nearly an adult, but still a student).
