      *   *Claim 3: "That's why a lot of epistemologists now think we should abandon the concept of knowledge and work with degrees of belief instead."*
          *   *Verdict:* **Highly Exaggerated/Inaccurate.** While Bayesian epistemology (degrees of belief) is popular, the Dogmatism Paradox is *not* the primary driver for abandoning "knowledge." Elimativism about knowledge is a fringe view. Most responses try to *save* knowledge by tweaking the principles (e.g., denying closure, distinguishing evidence from defeaters).

