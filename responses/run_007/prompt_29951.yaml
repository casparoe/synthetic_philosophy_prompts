      *   *Defeasibility:* Knowledge can be lost by new evidence. Just because I know $p$ now doesn't mean I would know $p$ *if* I encountered strong evidence against it. (The "Defeasibility Theory" of knowledge).
      *   *Contextualism:* In a context where I claim to know, I'm ignoring error possibilities. But if counter-evidence appears, the context shifts, and I no longer claim to know.
      *   *Bayesian/Probabilistic Response:* We rarely have absolute probability 1. So we shouldn't dismiss evidence. But this challenges the premise "If I know $p$..." rather than abandoning knowledge.
      *   *The "Right to Ignore":* Some (like Kripke himself might suggest, or Lasonen-Aarnio) argue there's a sense in which you *can* ignore evidence, but it's not "dogmatic" in the vicious sense. It's about the *status* of the evidence.

