      *   (2) *Commitment Condition:* Standing is lost when not genuinely committed to the norm (treating it as applying to others but not self). This is the "Hypocrisy Condition."
      *   (3) *Reform Exception:* Past wrongs don't disqualify if reformed. (Standard exception in literature).
      *   (4) *Victim Exception:* Victims have standing even if hypocritical (unreformed). (This is the "Victim's Privilege").
      *   (5) *Meddlesomeness Distinction:* Standing $\neq$ Meddlesomeness. (Standard distinction).
      *   (6) *Third Party Standing:* Bystanders have standing if committed. (Standard view).

  3.  **Evaluate Tensions (The Core Task):**

      *   **Tension A: (2) vs. (4) [The User's Main Worry]**
          *   (2) says: No standing if not committed to the norm (i.e., if you violate it without reform).
          *   (4) says: Victims *do* have standing even if they violate the norm without reform.
          *   *Analysis:* This is a direct contradiction *unless* "commitment to the norm" is interpreted differently for victims, or if victims have a *different source* of standing.
          *   *Severity:* **High.** This is the structural weak point. If (2) is the *fundamental* explanation, (4) breaks it. If (4) is an intuition bomb, (2) needs qualification.

      *   **Tension B: (2) vs. (3)**
