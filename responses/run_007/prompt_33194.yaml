          *   *Severity:* **Medium.** It's not a logical contradiction, but it risks making the theory unfalsifiable or bloated. However, they are standard moves in the literature. The real issue is whether they mask a deeper problem with (2).

      *   **Tension D: (4) vs. (6)**
          *   (4) Victims (even hypocrites) have standing.
