answer: |-
  This is a classic problem in normative ethics, often framed as the "demandingness objection" to utilitarianism or the problem of "moral overdrive." Your intuitions are actually quite stable; the tension arises because you are trying to reconcile two competing moral frameworks: an **impartial consequentialist** view (maximize good) and an **agent-centered** view (protect personal integrity and projects).

  To resolve the inconsistencies (particularly between Case 2 and Case 5, and the status of Case 7), I propose a principle that integrates a **Harm/Benefit Distinction** with a **Threshold of Reasonable Sacrifice**.

  ### The Proposed Principle: The Threshold of Reasonable Sacrifice (TRS)

  **An act is Obligatory if and only if:**
  1.  It prevents **significant harm** (death, severe suffering, rights violation) to another; AND
  2.  The cost to the agent is **trivial or moderate** (does not compromise the agent's basic well-being or core life projects).

  **An act is Supererogatory if and only if:**
  1.  It prevents significant harm but the cost **exceeds the threshold** of reasonable sacrifice (compromises well-being/projects); OR
  2.  It provides a **positive benefit** (enhancement of well-being) that is not strictly harm prevention, regardless of cost.

  **An act is Permissible (but not obligatory) if:**
  1.  It fails to prevent significant harm where the cost would have been trivial/moderate; OR
  2.  It prioritizes the agent's core life projects over the prevention of harm where the cost of prevention would be significant.

  ---

  ### How TRS Handles Your Cases

  Here is how this principle maps onto your seven verdicts. Note where it validates you and where it forces a clarification.

  *   **1. The Pond (Obligatory):** Prevents significant harm (death) at trivial cost (shoes). **Fits TRS.**
  *   **2. The Charity (Obligatory):** Prevents significant harm (death) at trivial cost ($200). **Fits TRS.**
      *   *Correction:* TRS forces you to abandon the intuition that this feels morally different from Case 1. Psychologically distinct? Yes. Morally distinct? No. Distance is morally irrelevant.
  *   **3. The Kidney (Supererogatory):** Prevents significant harm (death/illness) but cost is significant (surgery risk, pain). **Fits TRS.**
  *   **4. The Second Kidney (Supererogatory):** Prevents harm but cost is extreme (life on dialysis). **Fits TRS.**
  *   **5. The Life's Work (Supererogatory):** Prevents significant harm (malaria) but cost is significant (sacrifice of preferred career path/comfort).
      *   *Resolution:* This solves your consistency problem. Case 2 is obligatory because the cost is a one-off trivial sum. Case 5 is supererogatory because it requires restructuring your *core life projects*. You are permitted to have a life plan that isn't purely optimized for altruism.
  *   **6. The Grenade (Supererogatory):** Prevents significant harm (5 deaths) but cost is ultimate (life). **Fits TRS.**
      *   *Clarification:* The soldier who freezes has failed to be a hero, but has not violated a duty, because the cost exceeds the threshold of reasonable sacrifice.
  *   **7. The Compliment (Supererogatory):** Provides positive benefit (joy) but is not harm prevention.
      *   *Resolution:* Under TRS, duties are primarily grounded in *harm prevention*. Kindnesses that merely "add good" without preventing a negative are gifts, not debts. This validates your feeling that it is a "spark of grace."

  ### Verdicts You Must Abandon

  To commit to TRS, you must explicitly reject two of your hesitations:

  1.  **The Moral Relevance of Distance (Case 1 vs. 2):** You must accept that Case 2 is just as obligatory as Case 1. The "psychological difference" is a bias to be corrected, not a moral feature. If you keep the intuition that Case 2 is optional, you break the logic of Case 1.
  2.  **The Ambiguity of the Compliment (Case 7):** You must accept that the compliment is *not* a minor duty. If you classify it as obligatory, you open the door to a world where we are in constant debt for every tiny interaction. TRS classifies it as supererogatory because it is benefit-enhancement, not harm-prevention.

  ### Stress-Test Cases

  Here are three new cases designed to test the boundaries of TRS, specifically the definition of "core life projects" and the aggregation of costs.

  **8. The Sorites of Giving**
  You earn a high salary. Donating $200 (Case 2) is trivial. Donating 50% of your income every year for 40 years prevents vastly more harm than the malaria researcher (Case 5), but it severely restricts your lifestyle.
  *   **TRS Verdict:** At what specific percentage does "trivial cost" become "significant sacrifice"?
  *   **The Stress:** TRS relies on a threshold, but thresholds are often vague. If 10% is obligatory, is 11%? If you say 50% is supererogatory, does that mean you are permitted to let people die once you hit that limit? This tests whether the "core life projects" clause is too permissive.

  **9. The Emotional Rescue**
  You see a stranger having a panic attack in an airport. You are trained in mental health first aid. You can calm them down in 20 minutes, but you will miss your flight, costing you $400 and a day of vacation time.
  *   **TRS Verdict:** Is panic attack "significant harm"? Is missing a flight "significant cost"?
  *   **The Stress:** This blurs the line between Case 1 (Pond) and Case 3 (Kidney). It's not life-or-death, but it is suffering. It's not life-ruining cost, but it is more than shoes. TRS might struggle to categorize this cleanly without a more granular scale of harm/cost.

  **10. The Competing Promise**
  You promised to take your child to the zoo today (a core life project/relationship duty). On the way, you encounter a chance to donate blood (supererogatory under TRS: prevents harm, moderate cost) or volunteer at a shelter (supererogatory).
  *   **TRS Verdict:** Does the existence of a supererogatory opportunity override a specific duty to a loved one?
  *   **The Stress:** TRS protects "core life projects." Is parenting a project? If so, the zoo is obligatory, the blood donation is supererogatory. But if the blood donation could save a life *today*, does the math change? This tests whether "personal projects" can ever be outweighed by "emergency good."

  ### Recommendation

  The **Threshold of Reasonable Sacrifice** principle is the most robust fit for your intuitions. It preserves the "floor" of duty (Singer-style harm prevention at low cost) while building a "ceiling" that protects your integrity (you don't have to give your life or your career).

  **Your next step:** Try to define "Significant Harm" and "Core Life Projects" more rigidly.
  *   *Question:* Is "comfort" a core life project?
  *   *Question:* Is "avoiding moderate inconvenience" a reasonable sacrifice?

  If you can define those terms, you will have a working ethical framework that handles the Pond, the Charity, and the Career without collapsing into either selfishness or sainthood.
