answer: |-
  | Desideratum | Statement | Motivation | Status | Tension with |
  | :--- | :--- | :--- | :--- | :--- |
  | **Semantic Content** | The theory must specify *what* property of the world or internal state a given activation pattern corresponds to (its "aboutness"). | Without content, we merely have correlation, not representation. A theory that identifies a feature but cannot say what it is a feature *of* fails the basic definition of representation. | Non-negotiable | None |
  | **Causal Efficacy** | Intervening on the purported representation (e.g., clamping or ablating a feature) must produce predictable, systematic changes in model output consistent with that content. | If manipulating the "dog feature" does not alter dog-related classification or generation, the feature is epiphenomenal. Representation implies a functional role, not just passive correlation. | Non-negotiable | None |
  | **Coordinate Invariance** | The identification of a representation must not depend on the arbitrary choice of basis (e.g., the standard neuron basis); representations must be definable over subspaces or invariant manifolds. | Due to superposition and polysemanticity, single neurons rarely encode single features. A theory tied to the neuron basis fails to capture distributed coding and is mathematically arbitrary under rotation. | Non-negotiable | **Observer Independence** |
  | **Normativity** | The theory must distinguish between a representation being *active* and a representation being *correct*; it must account for the possibility of misrepresentation (error). | A thermometer correlates with temperature, but a representation can be false (e.g., a hallucination). A theory that cannot explain how a network represents "dog" when no dog is present fails to capture intentional content. | Non-negotiable | **Causal Efficacy** |
  | **Observer Independence** | The existence and content of the representation must be a fact about the network itself, not dependent on the specific interpretability technique or researcher used to find it. | This distinguishes scientific realism (features are "in" the net) from instrumentalism (features are useful fictions). Without this, interpretability is merely compression, not discovery. | Camp-dependent (Realists) | **Coordinate Invariance** |
  | **Computational Integration** | The representation must be causally connected to downstream layers; it cannot be a "dead end" activation that correlates with input but is ignored by the readout. | Prevents identifying "ghost features" that exist in activation space but play no role in the function. Representation requires integration into the computational graph. | Non-negotiable | None |

  ### The Impossibility Tension
  The most critical friction exists between **Coordinate Invariance** and **Observer Independence**. In high-dimensional spaces with superposition, the functional behavior of a network is often invariant to rotations of the activation basis (the "Basis Problem"). If the network's input-output map remains unchanged under rotation, but **Observer Independence** demands there be one "true" set of features (e.g., a specific sparse basis), the theory must identify a privileged basis *intrinsic* to the network. However, **Coordinate Invariance** dictates that no basis is mathematically privileged without an external prior (like sparsity). Thus, a theory that demands features are both "really there" (Observer Independent) and "basis agnostic" (Coordinate Invariant) risks an impossibility result: it must find a unique, intrinsic decomposition in a space where multiple, incompatible decompositions yield identical predictive power (the Rashomon effect).

  ### The Critical Desideratum
  The single desideratum that does the most work is **Coordinate Invariance**. This requirement immediately invalidates the vast majority of naive interpretability theories, specifically "neuron-centric" realism (the idea that a single neuron equals a single concept). By forcing the theory to abandon the standard basis, it necessitates a move toward subspace, dictionary, or circuit-based ontologies (e.g., Sparse Autoencoders or Linear Probes). It is the gatekeeper that separates modern mechanistic interpretability from earlier activation analysis; any theory that fails this is not a theory of *neural network* representation, but merely a theory of *neuron index* correlation. It forces the philosopher to grapple with linear algebra and the engineer to grapple with ontology, making it the primary filter for adequacy.
