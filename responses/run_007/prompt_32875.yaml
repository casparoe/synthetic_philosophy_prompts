prompt: |-
  Draft the joint statement of an adversarial collaboration between a committed advocate of the gene's-eye view of selection and a committed advocate of multi-level selection theory. The statement should reflect the state of the debate as it stands after decades of exchange — not the caricatures each side sometimes attributes to the other, but the considered positions of researchers who have engaged seriously with the opposing framework. Structure the document as follows:

  (1) A numbered list of claims both parties can sign. These should cover: the formal relationships between kin selection and group selection models; what the Price equation decomposition shows and what it leaves open; the empirical conditions under which group structure demonstrably affects evolutionary outcomes; the criteria both sides accept for identifying a level of selection; and any agreed-upon examples where one framework has guided research more fruitfully than the other.

  (2) A disagreements table with three columns: the gene's-eye advocate's formulation, the multi-level advocate's formulation, and an analysis of where exactly the formulations part ways. Each side's column should contain wording that side would endorse without reservation. The table should include at minimum the following rows: whether between-group selection in nature is typically strong enough to be evolutionarily significant without special conditions; whether the gene's-eye practice of averaging fitness effects across social contexts obscures causally relevant structure; which framework gives the more perspicuous account of the major evolutionary transitions (such as the origins of multicellularity, eusociality, and chromosomal organization); and whether the concept of a "vehicle" of selection picks out a causally distinct role or merely redescribes gene-level dynamics.

  (3) A section identifying the cruxes — the sub-questions whose resolution would cause at least one party to substantially revise their view — and, for each crux, a description of a kind of empirical or theoretical result that both sides agree would bear on it, together with each side's prediction about what such an investigation would find.

  Ensure that the agreed-claims section is neither vacuous nor question-begging; the real work is in finding formulations that genuinely narrow the space of disagreement while remaining precise enough that both specialists would sign them.
reasoning: |-
  Here's a thinking process that leads to the joint statement:

  1.  **Analyze the Request:**
      *   **Task:** Draft a joint statement of an adversarial collaboration between a Gene's-Eye View (GEV) advocate and a Multi-Level Selection (MLS) advocate.
      *   **Tone/Style:** Professional, precise, reflective of decades of serious debate (not caricatures), collaborative yet acknowledging genuine disagreement.
      *   **Structure:**
          1.  Numbered list of agreed claims (formal relationships, Price equation, empirical conditions, criteria for levels, fruitful examples).
          2.  Disagreements table (GEV formulation, MLS formulation, Analysis of divergence). Specific rows required (strength of between-group selection, averaging fitness effects, major transitions, concept of "vehicle").
          3.  Cruxes section (sub-questions, agreed evidence, predictions from both sides).
      *   **Constraint:** Agreed claims must not be vacuous or question-begging. They must narrow the space of disagreement while being signable by specialists.

  2.  **Deconstruct the Scientific Context:**
      *   *The Debate:* This is the classic "Levels of Selection" debate (Williams/Dawkins vs. Wynne-Edwards/Sober/Wilson).
      *   *Current State:* Most theorists agree on the *mathematical equivalence* (Price Equation shows they can be translated into each other). The debate is now largely about *causal interpretation*, *heuristic utility*, and *empirical prevalence*.
      *   *Key Concepts:* Kin Selection (inclusive fitness), Group Selection (MLS1/MLS2), Price Equation, Major Evolutionary Transitions, Vehicles/Replicators.
      *   *Goal:* Capture the nuance that while the math matches, the *explanatory focus* differs.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Specific, non-trivial agreements.
      *   *Claim 1 (Formal Equivalence):* Acknowledge that kin selection and group selection models are often mathematically transformable. *Draft:* Under standard assumptions, inclusive fitness and group selection partitions of the Price Equation are algebraically equivalent.
      *   *Claim 2 (Price Equation):* What does it do? Partitions change in gene frequency. What doesn't it do? Dictate causal interpretation.
      *   *Claim 3 (Empirical Conditions):* When does group structure matter? When variance between groups is high relative to within groups, and migration is low. Both sides agree on the *conditions*, even if they disagree on frequency.
      *   *Claim 4 (Criteria for Levels):* What makes a level? Variation, Heritability, Differential Fitness. Both sides accept Lewontin's conditions apply at any level.
      *   *Claim 5 (Fruitful Examples):* Where does each shine? GEV for genomic conflict/imprinting. MLS for evolutionary transitions/colony level traits.

      *Refining Claim 1:* Need to be careful. They aren't *always* equivalent (e.g., non-additive fitness effects can complicate inclusive fitness). Let's phrase it as "canonical models."
      *Refining Claim 5:* Make sure it doesn't sound like "you take this, I take that." It should be about heuristic utility.

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Steelman both sides. No strawmen.
      *   *Row 1 (Strength of Between-Group Selection):*
          *   GEV: Rare/Weak without kin structure.
          *   MLS: More common than GEV admits, especially in structured populations.
          *   Analysis: Disagreement on empirical prevalence, not theoretical possibility.
      *   *Row 2 (Averaging Fitness):*
          *   GEV: Averaging is valid for predicting gene frequency change.
          *   MLS: Averaging hides the causal mechanism (group context).
          *   Analysis: Prediction vs. Explanation distinction.
      *   *Row 3 (Major Transitions):*
          *   GEV: Suppression of lower-level conflict (gene policing).
          *   MLS: Emergence of higher-level fitness (group becomes individual).
          *   Analysis: Bottom-up control vs. Top-down emergence.
      *   *Row 4 (Vehicle Concept):*
          *   GEV: Vehicle is a temporary carrier; gene is the only long-term replicator.
          *   MLS: Vehicles (organisms/groups) are genuine units of selection in their own right.
          *   Analysis: Ontological status of the interactors.

  5.  **Drafting Section 3: Cruxes:**
      *   *Goal:* What evidence would change minds?
      *   *Crux 1: Prevalence of Group Selection in Nature.*
          *   Evidence: Systematic meta-analysis of selection gradients (within vs. between).
          *   GEV Prediction: Between-group variance usually negligible compared to kin selection effects.
          *   MLS Prediction: Between-group variance is a significant driver in social species.
      *   *Crux 2: Non-Additive Fitness Effects.*
          *   Evidence: Cases where inclusive fitness calculations fail due to synergistic epistasis.
          *   GEV Prediction: Extensions can handle this (regression methods).
          *   MLS Prediction: MLS framework handles non-additivity more naturally without ad hoc adjustments.
      *   *Crux 3: Evolution of New Levels (Transitions).*
          *   Evidence: Experimental evolution of multicellularity (e.g., yeast, algae).
          *   GEV Prediction: Selection acts on genes for "staying together"; group benefit is derivative.
          *   MLS Prediction: Group-level fitness emerges and constrains lower-level selection.

  6.  **Review and Refine:**
      *   *Check Tone:* Is it respectful? Yes.
      *   *Check Accuracy:* Does this reflect the actual state of the field (e.g., Nowak et al. 2010 controversy, subsequent clarifications)? Yes, the focus is on equivalence vs. utility.
      *   *Check Constraints:* Did I include all required rows in the table? Yes. Is the agreed section non-vacuous? I need to ensure Claim 1 isn't just "math is math." It needs to acknowledge the *transformability* specifically.
      *   *Self-Correction on Claim 1:* Ensure I mention that equivalence holds for *prediction*, not necessarily *causal attribution*.
      *   *Self-Correction on Table:* Ensure the "Analysis" column doesn't take sides but explains the *nature* of the disagreement (e.g., ontological vs. pragmatic).

  7.  **Final Polish:** Check for clarity, precise terminology (e.g., distinguishing MLS1 from MLS2, ensuring "vehicle" vs. "replicator" is used correctly in the Dawkins sense). Ensure the "Cruxes" are actually testable.

  *(Self-Correction during drafting)*: I need to make sure I don't imply the debate is "solved." The prompt asks for the state *after decades of exchange*, which implies a mature stalemate where boundaries are clear but positions remain distinct. The language should reflect "stable disagreement" rather than "impending resolution."

  *(Refining the "Vehicle" row)*: The GEV advocate sees the vehicle as a heuristic for gene propagation. The MLS advocate sees the vehicle as a locus of fitness. The divergence is ontological.

  *(Refining the "Averaging" row)*: This is about causal granularity. GEV says the gene is the only thing that matters causally in the long run. MLS says the group interaction is the causal trigger.

  Let's assemble the document.

  *Structure Check:*
  1. Numbered Claims (5-6 items).
  2. Table (4 rows).
  3. Cruxes (3 items).

  *Content Check:*
  - Price Equation mentioned? Yes.
  - Kin vs Group formal relationship? Yes.
  - Empirical conditions? Yes.
  - Major transitions? Yes.
  - Vehicle concept? Yes.

  *Voice:* Joint statement. "We, the undersigned..."

  *Final Review of Agreed Claims:* Make sure they aren't too weak. Instead of "Both sides like math," say "Both sides accept the Price Equation as a valid accounting tool." Instead of "Groups exist," say "Group structure alters selection gradients."

  Okay, ready to write.
answer: |-
  # JOINT STATEMENT ON THE LEVELS OF SELECTION DEBATE
  **Issued by the Adversarial Collaboration on Evolutionary Causality**

  **Signatories:**
  *Representing the Gene-Centered Perspective:* [Name/Title]
  *Representing the Multi-Level Selection Perspective:* [Name/Title]

  **Date:** October 26, 2023

  ### Preamble
  After decades of theoretical exchange and empirical scrutiny, we acknowledge that the debate between the gene's-eye view (GEV) and multi-level selection (MLS) theory has matured. While fundamental disagreements regarding causal interpretation and heuristic utility remain, the caricatures of the past have been discarded. We agree that the mathematical formalisms are largely translatable, but we diverge on which formalism best captures the causal structure of nature. This document codifies our areas of convergence, specifies the precise locus of our remaining disagreements, and identifies the empirical cruxes that could resolve them.

  ---

  ### 1. Agreed Claims
  *The following propositions represent the stable core of consensus resulting from our collaboration. Both parties endorse these claims without reservation.*

  1.  **Formal Equivalence of Canonical Models:** In cases where fitness effects are additive and population structure is well-defined, standard kin selection models (inclusive fitness) and group selection models (MLS1) are mathematically transformable into one another via the Price Equation. Both frameworks yield identical predictions regarding the direction of allele frequency change in these contexts.
  2.  **The Role of the Price Equation:** We agree that the Price Equation provides a valid, neutral accounting of evolutionary change, partitioning it into components of transmission and selection. However, we agree that the Equation itself is a tautology of change; it does not dictate which partition (e.g., individual vs. group, or direct vs. indirect fitness) corresponds to the *causal* mechanisms operating in a specific biological system.
  3.  **Empirical Conditions for Group Effects:** Both parties accept that group structure affects evolutionary outcomes when: (a) there is significant variance in trait frequency between groups relative to within groups; (b) group-level traits impact the survival or reproduction of the group; and (c) migration/mixing is sufficiently low to maintain this variance. We disagree only on the frequency with which these conditions are met in nature, not on the conditions themselves.
  4.  **Criteria for Levels of Selection:** We accept Lewontin's conditions (variation, heritability, differential fitness) as necessary and sufficient for selection to occur at any given level. If a collective entity satisfies these conditions, selection is operating at that level, regardless of whether one prefers to describe the outcome as gene propagation or group adaptation.
  5.  **Heuristic Division of Labor:** We acknowledge that different frameworks offer distinct explanatory advantages depending on the phenomenon. The GEV framework has proven more fruitful for analyzing intragenomic conflict, meiotic drive, and genomic imprinting. The MLS framework has proven more perspicuous for modeling the emergence of new biological individuals (Major Evolutionary Transitions) and the evolution of traits where the group boundary is physically discrete (e.g., eusocial colonies, multicellular organisms).

  ---

  ### 2. Disagreements Table
  *While we agree on the mathematical substrate, we diverge on causal attribution and ontological commitment. The following table isolates the specific points of contention.*

  | Topic | Gene's-Eye View (GEV) Formulation | Multi-Level Selection (MLS) Formulation | Analysis of Divergence |
  | :--- | :--- | :--- | :--- |
  | **Strength of Between-Group Selection** | "In natural populations, selection between groups is typically too weak to overcome within-group selection unless mediated by high genetic relatedness (kin selection). Apparent group adaptations are usually byproducts of gene-level maximizing." | "Selection between groups is a robust and frequent driver of evolution in structured populations, often operating independently of high kinship. Group-level fitness differences are sufficient to explain altruism without reducing them to indirect gene benefits." | **Empirical Prevalence:** Both agree group selection *can* happen. The disagreement is quantitative: GEV views it as a rare special case requiring high relatedness; MLS views it as a common consequence of population structure. |
  | **Averaging Fitness Effects** | "Averaging fitness effects across social contexts is methodologically sound because the gene is the only replicator. The 'context' is merely part of the environment selected upon; causal agency resides in the gene's differential survival." | "Averaging fitness effects across social contexts obscures the causal mechanism. The interaction *between* individuals creates a new causal structure (the group) that cannot be reduced to the sum of individual fitness effects without losing explanatory power." | **Causal Granularity:** GEV prioritizes the *replicator* as the sole causal agent. MLS prioritizes the *interactor* (vehicle) and argues that emergent properties of the interaction are causally distinct, not just environmental noise. |
  | **Major Evolutionary Transitions** | "Transitions (e.g., to multicellularity) are explained by genes selecting for mechanisms that suppress lower-level conflict (e.g., germ-line sequestration). The higher level is a vehicle constructed by genes to enhance their own propagation." | "Transitions involve the alignment of fitness interests such that the higher-level unit becomes a genuine Darwinian individual. The causality flows top-down: group-level selection constrains and shapes lower-level selection." | **Direction of Explanation:** GEV explains transitions bottom-up (genes building vehicles). MLS explains transitions top-down (emergent group fitness constraining genes). |
  | **Concept of a 'Vehicle'** | "The vehicle (organism/group) is a heuristic construct. It is a temporary repository for genes. Attributing 'fitness' to a vehicle is a shorthand for describing the success of the replicators within it." | "The vehicle is an ontologically distinct unit of selection. When a collective achieves functional integration, it possesses fitness in its own right, not merely as an aggregate of constituent gene fitness." | **Ontological Status:** GEV views 'vehicle fitness' as derivative/reducible. MLS views 'vehicle fitness' as emergent/irreducible. |

  ---

  ### 3. Cruxes and Empirical Predictions
  *We identify the following sub-questions as the critical bottlenecks preventing further convergence. For each, we specify the type of evidence required and our divergent predictions.*

  #### Crux 1: The Prevalence of Non-Kin Group Selection
  *   **The Question:** Is between-group selection in nature typically dependent on high genetic relatedness, or does it frequently operate in low-relatedness groups via sorting mechanisms?
  *   **Agreed Evidence:** A large-scale meta-analysis of selection gradients in social organisms, quantifying the ratio of between-group variance to within-group variance independent of relatedness coefficients (r).
  *   **GEV Prediction:** Once relatedness is controlled for, the residual variance attributed to "pure" group selection will be negligible. Most cases identified as group selection will collapse into kin selection models upon closer genetic inspection.
  *   **MLS Prediction:** A significant proportion of social traits will show strong between-group selection gradients even when relatedness is low, driven by mechanisms like assortment, policing, or group fission/fusion dynamics that are not captured by kinship coefficients.

  #### Crux 2: Handling Non-Additive Fitness (Synergy)
  *   **The Question:** Which framework provides the more robust account of evolutionary dynamics when fitness effects are strongly non-additive (synergistic or antagonistic epistasis)?
  *   **Agreed Evidence:** Experimental evolution systems (e.g., microbial biofilms or digital evolution) where fitness payoffs are explicitly non-linear functions of neighbor traits.
  *   **GEV Prediction:** Inclusive fitness theory can accommodate non-additivity via regression techniques and higher-order coefficients without abandoning the gene as the causal unit. The math becomes complex, but the ontology holds.
  *   **MLS Prediction:** Inclusive fitness calculations will become unwieldy or fail to converge in high-synergy contexts, whereas MLS models will naturally capture the dynamics by treating the collective output as the unit of selection, requiring fewer ad hoc parameters.

  #### Crux 3: The Ontology of the Transition to Multicellularity
  *   **The Question:** During the origin of multicellularity, does the "organism" emerge as a new locus of fitness, or does it remain a collection of competing cell-lineages suppressed by gene-level mechanisms?
  *   **Agreed Evidence:** Observation of early-stage multicellular evolution (e.g., *Volvox* or yeast clusters) tracking the heritability of group-level traits vs. cell-level traits over hundreds of generations.
  *   **GEV Prediction:** We will observe that "organismal" traits are maintained solely by specific genes that suppress cell-level cheating (policing). If policing genes are removed, the group level dissolves immediately, proving the gene is the primary maintainer of the level.
  *   **MLS Prediction:** We will observe that group-level fitness becomes heritable independently of specific policing genes, through physical bottlenecks or developmental constraints. The group level will persist even when specific "policing" alleles vary, indicating the level itself has become the dominant unit of selection.

  ---

  **Conclusion**
  We sign this statement to affirm that the debate is no longer about mathematical possibility, but about causal interpretation and empirical frequency. We commit to testing the predictions outlined in Section 3, acknowledging that the results may require one or both of us to revise the weight we assign to our respective frameworks.
