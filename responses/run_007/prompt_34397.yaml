prompt: |-
  I was at a dinner after a conference last month and two people I know — both sharp, both in tech — got into a long argument about whether one of them should quit his job to start a company. I took notes because it felt like they were replaying the whole inside-view/outside-view debate from Kahneman and Tetlock in real time. Here's roughly how it went:

  Dan said he was thinking of leaving his Big Tech job to build a fintech startup, and he had a specific thesis about an underserved market. Maya asked what the base rate is for fintech startups. Dan said he didn't know exactly but probably low. Maya said that's the number that should dominate his thinking — the outside view says you start with the class of ventures you belong to and adjust from there. Dan said that's fine for someone with no information, but he has a decade of domain expertise and a concrete product hypothesis, and the outside view deliberately ignores all that. Maya said that's exactly the trap: everyone with a startup idea thinks their inside information is special, which is why the base rate is so low, and the whole point of the outside view is to correct for that predictable overconfidence. Dan said then by that logic no one should ever start a company, because the base rate will always be terrible. Maya said that's not quite right — you can have inside information that's genuinely diagnostic, like you've already built a prototype and users are pulling it out of your hands, but Dan hasn't done that. Dan pushed back: what's the principle that separates diagnostic inside information from the kind he thinks he has? He said her position seems to be "inside information counts when it's so obvious any idiot could see it." Maya said that's a caricature, but the burden of proof is on the person who thinks they're an exception, and the default should be the outside view. Dan said the default is just another word for a prior, and priors get updated — refusing to update on your own experience is epistemic self-sabotage.

  They went back and forth like this for a while and I couldn't tell who was winning. Can you go through their exchange and adjudicate it move by move — who's right about which point, and what's the right way to think about the inside/outside view distinction here?
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A dinner conversation between two tech professionals (Dan and Maya) about quitting a job to start a fintech startup.
      *   **Core Conflict:** Inside View (Dan) vs. Outside View (Maya), referencing Kahneman/Tetlock.
      *   **Task:** Adjudicate the exchange move-by-move, determine who is right about which point, and synthesize the correct way to think about the distinction.
      *   **Tone:** Analytical, balanced, insightful (matching the user's note-taking/observational style).

  2.  **Deconstruct the Dialogue (Move-by-Move Analysis):**

      *   *Move 1: Dan's Plan.* Dan wants to quit Big Tech for a fintech startup based on a thesis/underserved market.
          *   *Assessment:* Standard entrepreneurial setup. High risk, high reward.
      *   *Move 2: Maya's Base Rate.* Maya asks for the base rate (success rate of fintech startups).
          *   *Assessment:* Correct application of Outside View. Establishing the reference class is step 1.
      *   *Move 3: Dan's Concession & Dismissal.* Dan admits base rate is low but says it dominates thinking only for those *without* information.
          *   *Assessment:* Partially right. Base rates *are* for the reference class, but he's implying he's not in the average class.
      *   *Move 4: Maya's Correction.* Maya says the Outside View is specifically designed to correct for the belief that "my info is special."
          *   *Assessment:* Strong point. This is the core psychological bias Kahneman warns about (planning fallacy, overconfidence).
      *   *Move 5: Dan's Reductio Ad Absurdum.* Dan argues that if Outside View always wins, no one should ever start a company (since base rates are always terrible).
          *   *Assessment:* This is a common counter-argument. It highlights a limitation of *rigid* Outside View thinking. If true, innovation stops.
      *   *Move 6: Maya's Nuance.* Maya clarifies: Inside info counts if it's *diagnostic* (e.g., traction/users), which Dan lacks.
          *   *Assessment:* Crucial distinction. "Thesis" vs. "Evidence." This moves the goalpost from "opinion" to "data."
      *   *Move 7: Dan's Challenge.* Dan asks for the principle separating "diagnostic" info from his "thesis." Accuses her of saying "only obvious info counts."
          *   *Assessment:* Good philosophical pushback. Where is the line between insight and delusion?
      *   *Move 8: Maya's Burden of Proof.* Maya says the burden is on the exception-maker; default is Outside View.
          *   *Assessment:* Statistically sound. Bayesian updating requires strong likelihood ratios to move a low prior.
      *   *Move 9: Dan's Bayesian Defense.* Dan says the default is just a prior, and refusing to update on experience is self-sabotage.
          *   *Assessment:* Technically correct on Bayesian theory, but misses the *weighting* issue. How much weight does "experience" carry vs. "market data"?

  3.  **Synthesize the Adjudication (Who is Right?):**

      *   *Maya's Strengths:* She is statistically safer. She correctly identifies the psychological trap of overconfidence. She correctly identifies that a "thesis" is not "evidence."
      *   *Dan's Strengths:* He correctly identifies that rigid base-rate thinking kills innovation. He correctly notes that priors *must* be updated.
      *   *The Verdict:* Maya wins on *risk assessment* and *process*. Dan wins on *potential upside* and *agency*. However, in the context of *decision quality* (which is what Kahneman/Tetlock focus on), Maya is more aligned with rational forecasting. Dan is falling into the "Inside View Bias."

  4.  **Develop the "Right Way to Think About It" (Synthesis):**

      *   It's not a binary choice (Inside OR Outside). It's a sequence.
      *   *Step 1: Outside View first.* Establish the baseline. (Anchoring).
      *   *Step 2: Inside View second.* Adjust based on specific evidence.
      *   *Step 3: Weight of Evidence.* How strong is the inside info? (Thesis < Prototype < Traction < Revenue).
      *   *Step 4: Reference Class Refinement.* Is Dan in the "average founder" class or the "serial founder with domain expertise" class? Changing the reference class is a valid Inside View move *if justified*.
      *   *Key Concept:* "Superforecasting" (Tetlock). Dragonfly eye (multiple perspectives).
      *   *Key Concept:* "Pre-mortem."

  5.  **Drafting the Response:**

