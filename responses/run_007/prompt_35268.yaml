answer: |-
  ### Brainstorming the Central Argument Section

  To explain Anscombe's argument without reducing it to a political slogan, I need to isolate the specific moral mechanism she employs. It isn't simply that "civilians died." Everyone in 1956 knew civilians died. The philosophical heavy lifting is done by the **Doctrine of Double Effect (DDE)** and the specific taxonomy of **intention**.

  I should structure this explanation in three moves:
  1.  **The Absolute Prohibition:** Establish that for Anscombe (following the Catholic natural law tradition), the intentional killing of the innocent is absolutely prohibited, regardless of consequences. This sets the high stakes.
  2.  **The DDE Distinction:** Explain how traditional just war theory allows for civilian death *only* if it is a foreseen but unintended side-effect of a legitimate military target (e.g., bombing a munitions factory where workers happen to be). This is the "foresight" clause.
  3.  **The Application to Truman:** This is the crux. Anscombe argues the atomic bombings do not fit the "side-effect" category. The destruction of the cities *was* the method of coercion. The civilian suffering was not incidental; it was the **means** by which the surrender was secured. Therefore, it falls under "intended," making it murder in her framework, regardless of the good consequence (ending the war).

  I need to be careful with the word "intention." For undergrads, intention sounds like "what you want." For colleagues, it's about the "description under which the action is chosen." I'll use the "means vs. side-effect" language to bridge that gap. I must avoid sounding like I am endorsing her conclusion as the final word; rather, I am presenting it as a rigorous stress-test of the distinction itself. This keeps the administrators comfortable (we are analyzing logic, not condemning history) while keeping the colleagues engaged (the metaphysics of action is in play).

  ***

  ### Speech Text

  **Title:** The Architecture of Dissent: Anscombe, Truman, and the Intention
  **Occasion:** Opening of Exhibition, Philosophy Faculty Library
  **Time:** Approx. 9 minutes

  Good afternoon. It is a privilege to welcome you to the Philosophy Faculty Library for this exhibition. Looking around the room, I see faces I know well—colleagues who have spent careers parsing the nuances of practical reason—and faces I am eager to know, undergraduates encountering these texts for the first time. And, I am sure, members of the University's administration, who are perhaps wondering whether we are about to reopen a wound that healed over sixty years ago.

  Let me offer a reassurance immediately. We are not here to hold a retrial of 1956. We are not here to vote again on whether Harry Truman should have received his honorary degree. That vote is history. What remains, and what this exhibition preserves, is not the verdict, but the *argument*.

  The theme of this exhibition is "Dissent and Academic Integrity." Often, we think of academic integrity as honesty in data or attribution in footnotes. But there is a deeper, more uncomfortable sense of the term. It is the integrity of reasoning itself. It is the willingness to follow a moral premise to its conclusion, even when the conclusion disrupts the ceremonial calm of the Encaenia.

  When Elizabeth Anscombe wrote *Mr. Truman's Degree*, she was not engaging in political grandstanding. She was engaging in moral diagnostics. She took the University's own claimed tradition of ethical reasoning and applied it to a contemporary act of state power. To understand why this matters—not just then, but now—we have to look past the drama of the protest and look at the architecture of her argument.

  Anscombe's argument rests on a specific, rigorous distinction regarding human action. It begins with a premise drawn from the just war tradition and natural law: that the intentional killing of the innocent is absolutely prohibited. It is not a matter of calculation. You cannot weigh innocent lives against military victory.

  Now, obviously, war inevitably results in the death of non-combatants. If the prohibition on killing the innocent were absolute in a way that forbade *any* action leading to their death, no war could ever be fought. This is where the Doctrine of Double Effect enters the picture. This doctrine allows for the foreseen but *unintended* death of civilians, provided the action itself is legitimate (like destroying a military target) and the death is not the means by which the objective is achieved.

  Think of the difference between bombing a munitions factory to stop production, where workers unfortunately die in the blast, versus bombing a residential district specifically to terrorize the population into surrender. In the first case, the death is a tragic side-effect. In the second, the death is the mechanism.

  Anscombe's charge against Truman was not simply that civilians died. Her charge was about the *description of the action*. She argued that the bombings of Hiroshima and Nagasaki could not be categorized under the "side-effect" clause. The destruction of the cities and the killing of their inhabitants were not incidental to the goal of ending the war; they were the very means by which the surrender was to be coerced.

  For Anscombe, intention is not merely what you hope happens in your heart. It is what you choose in your action. If you choose an act *in order that* civilians die, because their death is what breaks the enemy's will, then you have intended their death. You cannot say, "I wanted the surrender, and the death was just a side effect," when the death was the lever you pulled to get the surrender.

  This is the philosophical move that gives the pamphlet its enduring weight. It shifts the debate from consequentialism—"Did it save lives in the long run?"—to the metaphysics of action—"What exactly was done?"

  However, bringing this argument into the 21st century requires us to do more than simply recite Anscombe's position. We must ask whether the distinction she relies upon can bear the weight she places on it.

  This is where the tension lies, and where I want to leave you today. Anscombe assumes that the distinction between *intended means* and *foreseen side-effect* is morally decisive. She assumes that intention does the heavy lifting. But does it?

  Consider the pressure this case puts on that distinction. In modern warfare, the line between "terrorizing the population" and "destroying military infrastructure located in a city" is often blurred. If a leader knows with near-certainty that a bombing will kill thousands of civilians, does the internal mental state of "intention" change the moral reality of the act? Some critics argue that focusing so narrowly on intention allows agents to sanitize their actions through careful description. If I describe my act as "destroying morale" rather than "killing civilians," have I changed the morality, or merely the label?

  Conversely, others argue that without Anscombe's strict distinction, we lose the only barrier we have against total war. If we abandon the idea that intending evil is worse than foreseeing it, then all constraints become matters of mere calculation.

  So, we are left with a live wire. Was Anscombe right that the intention/foresight distinction is the bedrock of moral reasoning in war? Or does the Truman case reveal that the distinction is too fragile to handle the complexity of modern conflict?

  I raise these questions not to undermine Anscombe, but to honor the kind of integrity she displayed. Academic integrity is not about having the right answers ready for the exam. It is about the courage to ask the questions that make the examiners shift in their seats.

  The documents in this exhibition show us a moment when the University was asked to look at itself. Anscombe forced her colleagues to ask: What does it mean for Oxford to honor a head of state? Is it a recognition of past service, or an endorsement of moral conduct?

  We do not need to agree with Anscombe to learn from her. We only need to recognize that the structure of our moral reasoning matters. Whether you are an undergraduate writing your first tutorial paper, or a statesman making decisions that affect millions, the descriptions under which you choose to act define who you are.

  This exhibition does not offer a verdict on 1956. It offers a mirror. It asks us to look at how we reason, how we dissent, and how we maintain integrity when the cost of doing so is high. The questions Anscombe raised about intention, consequence, and the limits of power are not historical artifacts. They are the very questions that define the ethical landscape we walk today.

  I invite you to look at the materials, to trace the argument, and to sit with the tension. Thank you.
