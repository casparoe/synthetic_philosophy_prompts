answer: |-
  # SPECIFICATION: ACCOUNT OF 'THE WILL OF THE PEOPLE'

  ## 1. DESIDERATA (The Functional Requirements)

  An account $A$ of the will of the people $W$ must satisfy the following conditions to distinguish legitimate appeals from factional rhetoric.

  ### 1.1 Case Coverage
  *   **C1 (The Narrow Bind):** $A$ must explain why a 52–48 referendum result generates binding obligations for the 48% for a duration $t > 0$, without classifying the 48% as enemies of the people.
  *   **C2 (The Extra-Institutional):** $A$ must assign a truth-value to claims of $W$ arising from mass movements lacking formal balloting (e.g., protests, strikes).
  *   **C3 (The Indirect Mandate):** $A$ must distinguish between a procedural victory (e.g., Electoral College) and a claim to $W$ when the popular vote is lost.
  *   **C4 (The Intensity Filter):** $A$ must differentiate between a poll majority expressing low-cost preference and a will requiring high-cost action (the "lift a finger" test).

  ### 1.2 Ontological Distinctions
  *   **D1 (Aggregation vs. Subject):** $A$ must not collapse $W$ into a sum of individual preferences ($\sum p_i$). $W$ must be capable of functioning as a unitary agent (Collective Subject) distinct from the arithmetic majority.
  *   **D2 (Fact vs. Norm):** $A$ must separate the empirical claim ("People want $X$") from the legitimating claim ("People *should* rule/$X$ is right").
  *   **D3 (Constitutive vs. Causal):** $A$ must distinguish between support that *creates* the group (constitutive) and support that *comes from* a pre-existing group (causal).

  ### 1.3 Formal Constraints
  *   **F1 (Cycle Sensitivity):** $A$ must acknowledge Condorcet cycles where no majority will exists.
  *   **F2 (Arrow Compliance):** $A$ must not claim to produce a coherent social welfare function satisfying Universal Domain, Pareto, IIA, and Non-Dictatorship simultaneously.
  *   **F3 (Discursive Consistency):** $A$ must resolve the discursive dilemma (inconsistency between premise-based and conclusion-based voting) without arbitrary stipulation.
  *   **F4 (Boundary Non-Circularity):** $A$ must define the boundary of "the people" ($B$) without using the outcome of the will-formation process to define $B$ itself.

  ---

  ## 2. CLASSIFICATION: NON-NEGOTIABLE VS. CAMP PREFERENCES

  To determine satisfiability, we must separate logical constraints from normative desires.

  ### 2.1 Non-Negotiables (Logical/Formal Hard Limits)
  These cannot be waived without rendering the account mathematically incoherent or tautological.
  *   **F1 & F2 (Social Choice Impossibility):** You cannot have a transitive, complete ordering of preferences derived from diverse individual orderings without violating at least one Arrow condition. This is a theorem, not a debate.
  *   **F4 (The Boundary Regress):** Defining the demos is itself a democratic decision. Any account that claims to solve the boundary problem non-circularly is lying. (Whelan's Paradox).
  *   **D2 (Is-Ought):** An empirical account cannot generate normative legitimacy without an external bridging premise.

  ### 2.2 Camp Preferences (Normative/Political Choices)
  These are trade-offs different theories prioritize. Satisfying one usually violates another.
  *   **C1 (Durability):** Liberal constitutionalism prefers long binding times; Deliberative democracy prefers revisability.
  *   **C2 (Extra-Institutional):** Populists prefer $W$ exists outside institutions; Institutionalists prefer $W$ is only visible through procedures.
  *   **D1 (Collective Subject):** Populists/Rousseauians require a unitary Subject; Pluralists/Liberals prefer mere Aggregation.
  *   **C4 (Intensity):** Populists weigh intensity/commitment heavily; Liberals weigh equality of vote heavily.

  ---

  ## 3. THE INCOMPATIBILITY ANALYSIS (The Unsatisfiable Subset)

  This is the core constraint. You asked for the subset of desiderata that is **jointly unsatisfiable**. There is no account that can satisfy the following triad simultaneously. I call this the **Trilemma of Popular Sovereignty**.

  ### The Trilemma
  1.  **Empirical Fidelity:** The account must reflect the actual, expressed preferences of individuals (Desiderata C1, C4, D2-Empirical).
  2.  **Unitary Coherence:** The account must produce a single, consistent, rational "Will" capable of acting as a subject (Desiderata D1, C1-Binding).
  3.  **Procedural Neutrality:** The account must not rely on a dictator or pre-rigged boundary to generate that Will (Desiderata F2, F4).

  **Verdict:** You can satisfy any two, but never all three.

  ### Proof of Incompatibility

  #### Conflict A: Empirical Fidelity + Unitary Coherence $\rightarrow$ Violates Procedural Neutrality
  *   **The Mechanism:** To get a coherent "Will" (2) from messy empirical preferences (1) where Condorcet cycles exist (F1), you must impose an agenda setter or a tie-breaker.
  *   **The Violation:** This agent (a leader, a committee, a specific voting rule) becomes a **Dictator** in the Arrow sense. They determine the outcome when preferences cycle.
  *   **The Populist Trap:** This is the standard populist move. They claim Empirical Fidelity ("I speak for the real people") and Unitary Coherence ("We have one will"), but they achieve this by violating Procedural Neutrality (ignoring institutions, courts, or minority vetoes that reveal the cycles).
  *   **Result:** The account fails F2. It claims to be democratic but relies on a hidden veto power to suppress incoherence.

  #### Conflict B: Unitary Coherence + Procedural Neutrality $\rightarrow$ Violates Empirical Fidelity
  *   **The Mechanism:** To ensure the "Will" is rational and consistent (2) without a dictator (3), you must construct the Will procedurally (e.g., deliberative forums, representative trustees) rather than aggregating raw preferences.
  *   **The Violation:** The output no longer matches the raw empirical data of polls or referendums (1). The "Will" becomes a *fiction* or a *construction* required for the system to function.
  *   **The Liberal Trap:** This is the standard liberal move. They claim the "Will" is found in the Constitution or Parliament (Coherence) via fair rules (Neutrality), but they must admit this often contradicts what 52% of people say they want in polls (Empirical Fidelity).
  *   **Result:** The account fails C4 and D2-Empirical. It admits the "Will" is a normative construct, not an empirical fact.

  #### Conflict C: Empirical Fidelity + Procedural Neutrality $\rightarrow$ Violates Unitary Coherence
  *   **The Mechanism:** You count everyone equally (3) and record exactly what they say (1).
  *   **The Violation:** You inevitably encounter Condorcet cycles, discursive dilemmas, and instability (F1, F3). There is *no* "Will of the People," only a shifting distribution of preferences.
  *   **The Pluralist/Realist Move:** This account denies the existence of "The People" as a subject (D1). It sees only factions.
  *   **Result:** The account fails C1. If there is no coherent Subject, a 52-48 vote cannot bind the 48% as "the People's Will," only as a temporary coalition victory. It cannot distinguish "the People" from "a Faction" ontologically, only numerically.

  ### The Boundary Problem Amplifier (F4)
  The Trilemma is worsened by the Boundary Problem.
  *   To satisfy **Empirical Fidelity**, you need to know *who* to count.
  *   To satisfy **Procedural Neutrality**, the boundary cannot be set by the winner.
  *   To satisfy **Unitary Coherence**, the boundary must be fixed enough to form a Subject.
  *   **Impossibility:** If the boundary is fixed *prior* to the vote (to ensure Coherence), it violates Neutrality (why *this* boundary?). If the boundary is decided *by* the vote (to ensure Neutrality), it violates Coherence (the "people" voting on who the "people" are is circular).
  *   **Consequence:** Any account that claims to solve the Boundary Problem (F4) while maintaining Empirical Fidelity is necessarily **Constitutive (D3)**. It claims the leader/movement *calls* the people into existence. This makes the claim unfalsifiable. If the leader says "This is the people," and you ask "Who counts?", and the answer is "Those who support the will," you have entered a tautology.

  ---

  ## 4. IMPLICATIONS FOR LEGITIMACY TESTING

  You asked for a spec to tell when an appeal is legitimate. Based on the Unsatisfiable Subset above, **no such account exists** that satisfies all your desiderata. However, you can diagnose the *type* of claim being made by seeing which corner of the Trilemma is being sacrificed.

  ### Diagnostic Matrix

  | Claim Type | Sacrifices... | To Preserve... | Legitimacy Risk |
  | :--- | :--- | :--- | :--- |
  | **Populist** | Procedural Neutrality (F2, F4) | Empirical Fidelity & Unitary Coherence | **High.** Claims empirical truth but suppresses cycles/minorities via leadership veto. Collapses D2 (Fact/Norm). |
  | **Liberal/Constitutional** | Empirical Fidelity (C1, C4) | Unitary Coherence & Procedural Neutrality | **Low (Stable).** Admits "Will" is constructed. Risks disconnect from reality (C4 "lift a finger"). |
  | **Pluralist/Realist** | Unitary Coherence (D1) | Empirical Fidelity & Procedural Neutrality | **Medium.** Admits no "People" exists, only coalitions. Cannot justify long-term binding (C1). |

  ### The "Faction vs. People" Test
  Since you cannot satisfy the Trilemma, you cannot use an internal metric to distinguish "Faction" from "People." You must use an external one.

  1.  **If the account claims Empirical Fidelity + Unitary Coherence:** It is illegitimate by definition (Arrow Violation). It is a faction claiming to be the whole. *Test: Check for agenda manipulation or suppression of alternative vote counts.*
  2.  **If the account claims Constitutive Support (D3):** It is unfalsifiable. The leader defines the people. *Test: Check if boundary definition changes to ensure victory.*
  3.  **If the account respects Formal Constraints (F1-F3):** It must admit the "Will" is provisional. *Test: Does it allow for reversal? If a 52-48 vote is treated as "settled for a generation" (C1) while ignoring cycles, it is factional.*

  ### Final Verdict on Unsatisfiability
  The subset **{Empirical Fidelity, Unitary Coherence, Procedural Neutrality}** is jointly unsatisfiable.

  *   **Non-Negotiable:** Procedural Neutrality (specifically Arrow's Non-Dictatorship and Boundary Non-Circularity). If you waive this, "Will of the People" becomes "Will of the Leader."
  *   **Required Sacrifice:** You must abandon either **Empirical Fidelity** (admit the Will is a legal fiction/procedure) OR **Unitary Coherence** (admit the People are a fractured multitude with no single Will).

  **Recommendation:** To avoid factionalism, adopt the **Liberal/Constitutional** horn. Sacrifice Empirical Fidelity. Treat "The Will of the People" as a *regulative ideal* generated by procedure, not an *empirical object* discovered by polls or plebiscites. Any account claiming to find a coherent, empirical Will without admitting to procedural rigging is, by mathematical necessity, a factional power grab.
