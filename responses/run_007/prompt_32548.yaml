      *   **Requirements:**
          *   Distinguish between "reason no longer applies" vs. "we can't figure it out."
          *   Identify escalation points (human judgment).
          *   Be honest about mechanical steps hiding judgment calls.
          *   Run the procedure on 2-3 specific software examples (Legacy Auth, Code Review Step, Low-Usage Feature).
          *   At least one example must recommend *against* the team's desire.
          *   Flag limits of the procedure and where the Burkean framework breaks down in software.

  2.  **Deconstruct "Chesterton's Fence" for Software:**
      *   *The Fence:* Legacy code, processes, features, infrastructure.
      *   *The Builder:* Previous engineers, product managers, compliance requirements, past incidents.
      *   *The Reason:* Technical constraints, business logic, safety, compliance, tribal knowledge.
      *   *The Risk:* Removing it causes outages, churn, security vulnerabilities, or compliance fines.
      *   *The Burkean Insight:* Survival implies utility, even if obscure. Time is a filter.

  3.  **Drafting the Decision Procedure (The "Fence Audit"):**
      *   *Constraint:* Must take < 1 hour.
      *   *Structure:* Needs to be sequential.
      *   *Key Phases:*
          1.  **Identification:** What exactly are we removing?
          2.  **Archaeology:** Who built it? When? Why (git logs, tickets, Slack)?
          3.  **Impact Analysis:** Who uses it? What breaks? (Data-driven).
          4.  **Risk Simulation:** What's the worst case?
          5.  **Mitigation:** Can we disable instead of delete?
          6.  **Verdict:** Go, No-Go, or Escalate.
      *   *Epistemic Humility Check:* Explicitly ask "What don't we know?"
      *   *Burden of Proof:* The proposer must provide evidence of safety, not the defender evidence of necessity.

      *Refining the Steps:*
      *   Step 1: Define the Fence.
      *   Step 2: The "Origin Story" Search (Git blame, Jira, People).
      *   Step 3: The "Silent User" Check (Logs, Support Tickets).
      *   Step 4: The "Disaster Scenario" Pre-mortem.
      *   Step 5: The "Shadow Mode" Test (Can we turn it off quietly?).
      *   Step 6: The Verdict.

      *Addressing the "Judgment Call" Requirement:* I need to explicitly note where the checklist relies on intuition or incomplete data.

  4.  **Developing the Worked Examples:**
      *   *Example 1: Legacy Auth Service.* Team wants to kill it. It's a mess.
          *   *Application:* Check logs. Check who uses it. Maybe it's only used by one internal tool or a specific SSO integration.
          *   *Outcome:* Likely "Escalate" or "Go with Shadow Mode." Let's make it a "Go with Caution" but highlight the risk. Actually, to meet the prompt requirement ("recommend against"), I should tweak one. Let's make the Code Review one the "No-Go."
      *   *Example 2: Code Review Step.* Team wants to remove it to speed up deploys.
          *   *Application:* Why was it added? Past incident? Compliance?
          *   *Outcome:* If it was added after a major security breach, removing it is dangerous. This fits the "recommend against" requirement well.
      *   *Example 3: Low Usage Feature (3%).* Product wants to kill it.
          *   *Application:* Who are the 3%? Enterprise? Power users?
          *   *Outcome:* If they are enterprise, keep it. If random free users, kill it. Let's make this one ambiguous/escalate.

      *Revision for Prompt Compliance:* The prompt asks for *at least one* recommendation against the team's desire.
      *   *Scenario A (Auth):* Team wants to delete. Procedure says "Shadow first, then delete." (Neutral/Go).
      *   *Scenario B (Code Review):* Team wants to remove. Procedure says "No-Go, high catastrophic risk." (Against).
      *   *Scenario C (Feature):* Team wants to deprecate. Procedure says "Escalate to Product/Sales." (Neutral).

  5.  **Critiquing the Burkean Framework in Software:**
      *   Software isn't society. It rots faster.
      *   "Survival" in code often means "too scary to touch," not "optimal."
      *   Technical debt accumulates interest; sometimes you *must* tear the fence down even if you don't know why it's there because the cost of maintaining it is existential.
      *   Innovation requires breaking things.
      *   The "Builder" might have been wrong originally.

  6.  **Writing the Response:**
      *   *Tone:* Professional, respectful of the intellectual framework (Burke/SSC), practical engineering focus.
      *   *Structure:*
          1.  Introduction (Acknowledging the problem).
          2.  The Procedure ("The Fence Audit Protocol").
          3.  Worked Examples.
          4.  Limitations & Framework Critique.
      *   *Self-Correction during drafting:* Make sure the "under an hour" constraint is realistic. Don't ask for deep code analysis, ask for metadata and stakeholder checks. Ensure the "judgment call" flags are visible.

  7.  **Final Review against constraints:**
