      *   *Key Mechanism:* It's not that people *become* rational instantly. It's that the *structure* of democracy channels passions in a way that approximates reason. "Men are led by passion, but if they follow reason, they are free." But in politics, we deal with men as they *are*.
      *   *The "Bridge":* The bridge isn't moral transformation; it's *aggregation of power* leading to *stability*, which allows reason to flourish. Also, the definition of "right" shifts from individual power to collective power.
