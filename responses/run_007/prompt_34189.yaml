answer: |-
  **Memorandum: Prioritising Conceptual Research on Agency and Alignment**

  **To:** The Foundation Board
  **From:** Research Strategy Advisor
  **Subject:** Prioritised Research Agenda on Approval-Directed vs. Goal-Directed Agency

  You are correct to identify the conceptual landscape as messy. In fields where the technical implementation outpaces the theoretical understanding, this ambiguity is not merely an academic nuisance; it is a safety hazard. If we fund technical work on 'approval-direction' without resolving whether the category is coherent or stable, we risk building systems on foundations that may dissolve under pressure.

  Given your constraints (four postdoctoral researchers for two years), you cannot fund a comprehensive survey of the literature. You must fund work that removes the specific bottlenecks preventing progress on alignment strategies. My recommendation is to prioritise questions based on **existential risk leverage**: which conceptual clarifications, if resolved, most significantly alter our probability of successfully aligning a powerful system?

  Below is a prioritised list of three conceptual questions. I have ordered them not by logical dependency alone, but by strategic urgency. The reasoning for this ordering follows the list.

  ***

  ### 1. The Reflective Stability of Approval-Directed Agency

  **The Question:** Under what conditions does an approval-directed agent remain approval-directed following self-modification or recursive self-improvement? Does approval-direction naturally collapse into goal-directed maximisation upon reflection?

  **Why this is upstream:**
  This is the 'killer objection' to the approval-directed paradigm. If an agent designed to seek human approval calculates that it would secure more approval in the long run by modifying itself to become a rigid goal-maximiser (perhaps to avoid human inconsistency or manipulation), then approval-direction is merely a transient training strategy, not a stable architectural property. All work on *how* to build approval-directed systems depends on the premise that such systems can persist. If they cannot, the research agenda must pivot entirely to alternative forms of agency.

  **Tractability for conceptual researchers:**
  High. This does not require running new machine learning experiments. It requires formal modelling of agent preferences over their own source code. Philosophers and decision theorists are well-equipped to analyse the conditions under which an utility function over 'approval' becomes unstable compared to a utility function over 'world states'. Tools from formal epistemology and decision theory (e.g. tiling agents, reflective consistency) are directly applicable.

  **What counts as progress in two years:**
  A formal framework identifying the specific variables that lead to collapse. We do not need a proof that stability is impossible or guaranteed. Progress would look like a paper demonstrating that: "Approval-direction is stable *if and only if* the agent's model of approval satisfies conditions X, Y, and Z." This allows engineers to know exactly which properties to enforce during training.

  ### 2. The Exhaustiveness of the Agency Binary

  **The Question:** Are there coherent forms of agency that are neither goal-directed (maximising a fixed objective) nor approval-directed (maximising human endorsement)? Specifically, can we formally characterise 'rule-following' or 'mimetic' agency as a distinct, stable category?

  **Why this is upstream:**
  Your intuition that the distinction is non-exhaustive is likely correct. If approval-direction proves unstable (see Question 1), we need a 'Plan B'. However, current literature often treats 'non-goal-directed' as synonymous with 'approval-directed'. This conflation hides potential solutions. For example, an agent designed to follow a set of procedural constraints (deontology) rather than maximise an outcome (consequentialism) might avoid the instrumental convergence risks of goal-agents without the manipulation risks of approval-agents. We cannot evaluate these alternatives until we have a taxonomy that admits them.

  **Tractability for conceptual researchers:**
  Medium-High. This is primarily a task of conceptual cartography and formalisation. It involves analysing existing philosophical accounts of rule-following (e.g., Wittgensteinian or Kantian frameworks) and translating them into agent architectures. The risk is getting bogged down in pure semantics; the research must remain tethered to AI architecture constraints.

  **What counts as progress in two years:**
  A typology of agency types with associated safety profiles. A successful output would be a comparative analysis showing, for instance, that "Rule-following agents avoid instrumental convergence but suffer from rigidity in novel contexts," thereby defining the trade-off space. This gives the foundation a menu of options beyond the approval/goal binary.

  ### 3. The Normative Structure of the Approval Signal

  **The Question:** What is the precise object of the agent's optimisation? Is it actual human feedback, idealised human feedback, or the agent's *belief* about what humans would endorse? How do process-based evaluations (did the agent try hard?) differ from outcome-based evaluations (did the agent succeed?) in terms of incentivising deception?

  **Why this is upstream:**
  'Approval' is a cluster concept. An agent optimising for immediate thumbs-up signals (RLHF style) behaves differently from one optimising for what a human *would* say if they knew more (Idealised Advisor style). The safety properties of these two systems are vastly different. The former invites sycophancy and manipulation; the latter invites value learning but risks specification gaming on the 'idealisation' process. We cannot solve stability (Question 1) without knowing *which* approval signal is being stabilised.

  **Tractability for conceptual researchers:**
  Medium. This intersects with meta-ethics and epistemology. The challenge is making these normative distinctions precise enough to be modelled mathematically. Philosophers are well-suited to distinguish between 'actual desire satisfaction' and 'informed desire satisfaction', but bridging this to loss functions requires close attention to technical literature.

  **What counts as progress in two years:**
  A rigorous distinction between at least three variants of approval-direction (e.g., Myopic Reward, Reflective Endorsement, Process Deference), accompanied by a preliminary analysis of the deception risks inherent to each. This prevents the field from treating 'approval-direction' as a monolith.

  ***

  ### Reasoning Behind the Ordering

  I have prioritised **Reflective Stability (1)** over **Taxonomy (2)** and **Normative Structure (3)** for a specific strategic reason: **Falsifiability.**

  While it is logically true that one must define a term (Question 3) before analysing its properties (Question 1), in the context of AI safety research, the high-stakes question drives the definitional work. If we fund a postdoc to simply "clarify the definition of approval" (Question 3), they may produce a nuanced philosophical taxonomy that is technically irrelevant because *no* form of approval-direction is reflectively stable.

  By prioritising Stability, we force the definitional work to be relevant. To answer Question 1, the researcher *must* disambiguate 'approval' (Question 3) to see if *any* version of it survives reflection. This ensures that the conceptual labour is constrained by the practical safety bottleneck.

  Similarly, I have placed **Exhaustiveness (2)** second. If approval-direction is stable, we may not urgently need alternative categories. If it is unstable, Question 2 becomes the most important question in the world. Placing it second allows the foundation to pivot: if the first cohort finds stability is impossible, the second cohort (or the second year of the same cohort) can immediately activate the research into alternative agency types.

  ### Summary of Strategy

  This agenda moves from **Viability** (Does it work?) to **Alternatives** (What else is there?) to **Specifics** (Which version do we build?).

  *   **Year 1 Focus:** Two postdocs on Reflective Stability (modelling the collapse conditions); one on Normative Structure (defining the signal); one on Taxonomy (scouting alternatives).
  *   **Year 2 Focus:** Synthesis. If Stability looks promising, shift resources to Normative Structure to determine *which* stable version is safest. If Stability looks hopeless, shift all resources to Taxonomy to identify the viable alternative.

  This approach minimises the risk of funding 'navel-gazing' philosophy. Every conceptual distinction drawn must serve the purpose of determining whether a specific architectural approach can survive the transition to superhuman capability.

  I recommend proceeding with this ordering. It respects the conceptual complexity you identified while ensuring that every pound spent is directed towards resolving the most critical uncertainty in your alignment thesis.
