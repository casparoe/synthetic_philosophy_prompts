      *   **Situation:** Family conflict regarding older sister's ADHD diagnosis. Sister sees it as a neurodivergent trait mismatched with the environment; parents see it as a medical condition requiring treatment.
      *   **Goal:** Understand the *conceptual* distinction between a "disorder/disease" and a "normal variation/trait" that is maladaptive in a specific context.
      *   **Constraint:** Explicitly states *not* asking for medical advice. Wants to think through the philosophy/sociology/psychology of the definition of disorder.
