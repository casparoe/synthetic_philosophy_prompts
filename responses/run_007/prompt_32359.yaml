      *   *Medical Model:* The problem lies within the individual (pathology, deficit, needs fixing).
      *   *Social Model:* The problem lies in the interaction between the individual and an environment designed for a different type of person (mismatch, needs accommodation).
      *   *The "Harmful Dysfunction" Analysis:* A standard philosophical definition (Wakefield) that combines evolutionary function and social harm.

  3.  **Brainstorm Key Concepts to Explore:**
      *   **Neurodiversity:** The idea that neurological differences are natural variations, like biodiversity.
      *   **Context/Environment:** How school structures (lecture-based, long sitting) favor certain brains over others.
      *   **Impairment/Distress:** The clinical threshold. Is it just different, or does it cause significant suffering/inability to function *even with accommodations*?
      *   **Agency/Autonomy:** The sister's right to self-identify vs. parents' concern for her future.
