answer: |-
  # Fair-Lending Model Review: Impossibility & Tradeoff Procedure

  **Owner:** Fair-Lending Analytics Team  
  **Audience:** Statistical Analysts (Non-Specialists)  
  **Timebox:** 4 Hours (0.5 Day) per Model  
  **Purpose:** To diagnose mathematical conflicts between Calibration, Equal False-Positive Rate (FPR), and Equal False-Negative Rate (FNR) and force explicit value judgments where mathematical satisfaction is impossible.

  ---

  ## Phase 1: Feasibility Gate (30 Minutes)
  **Goal:** Determine if the three criteria are mathematically compatible for this specific pool.

  1.  **Calculate Base Rates:** Compute the default rate (outcome prevalence) for each protected group ($G_1, G_2$) in the validation sample.
      *   $BR_g = P(Y=1 | G=g)$
  2.  **Compute Base Rate Delta:** $\Delta_{BR} = |BR_{G1} - BR_{G2}|$.
  3.  **The Feasibility Rule:**
      *   **If $\Delta_{BR} \approx 0$ (within sampling noise):** Proceed to Phase 2. All three criteria *can* theoretically coexist.
      *   **If $\Delta_{BR} > 5\%$ (or statistically significant):** **STOP.** You have triggered the Impossibility Theorem. You *cannot* satisfy Calibration, Equal FPR, and Equal FNR simultaneously.
      *   **Action:** Mark the model as "Mathematically Constrained." You must proceed to Phase 4 to select which criterion to relax. Do not waste time trying to tune the model to satisfy all three.

  ## Phase 2: Metric Audit (90 Minutes)
  **Goal:** Quantify the current state of the model against the three criteria.

  1.  **Calibration Check:** Plot reliability diagrams for each group. Calculate the Calibration Intercept and Slope per group.
      *   *Pass:* Slopes $\approx 1$, Intercepts $\approx 0$, and predicted risk means match actual default rates within groups.
  2.  **Error Rate Check:** Set a decision threshold (e.g., approval cutoff). Calculate:
      *   $FPR_g = P(\text{Reject} | \text{Good}, G=g)$
      *   $FNR_g = P(\text{Approve} | \text{Bad}, G=g)$
  3.  **Disparity Ratios:** Compute $FPR_{G1} / FPR_{G2}$ and $FNR_{G1} / FNR_{G2}$.
      *   *Note:* Record the exact magnitude of divergence.

  ## Phase 3: Conflict Diagnosis (30 Minutes)
  **Goal:** Identify exactly which criteria are fighting each other.

  1.  **The Triangle Test:**
      *   If **Calibration holds** AND **Base Rates differ**: You must observe a divergence in FPR and FNR.
      *   **Diagnosis A:** If FPRs are equal, FNRs *must* differ (Group with higher base rate will have higher FNR).
      *   **Diagnosis B:** If FNRs are equal, FPRs *must* differ (Group with higher base rate will have lower FPR).
      *   **Diagnosis C:** If you force both Error Rates to be equal, Calibration *must* break (Risk scores no longer mean the same probability of default across groups).
  2.  **Output:** A one-paragraph statement: *"Due to a base rate difference of X%, maintaining Calibration requires accepting a disparity of Y% in [FPR/FNR]."*

  ## Phase 4: Resolution Selection (60 Minutes) **[VALUE JUDGMENT STEP]**
  **Goal:** Select the "least bad" violation based on business and risk appetite. **This is not a statistical decision.**

  1.  **Review Policy Priority:** Does the bank prioritize Risk Management (Calibration) or Access (FNR) or Cost of Errors (FPR)?
  2.  **Select the Sacrifice:**
      *   **Option 1 (Prioritize Risk):** Keep Calibration. Accept FPR/FNR divergence. *Implication:* One group is denied more often relative to their risk, or approved more often relative to their risk.
      *   **Option 2 (Prioritize Equal Opportunity):** Force Equal FNR. Accept Calibration drift. *Implication:* The score $S=700$ means different default probabilities for different groups.
      *   **Option 3 (Prioritize Equal Cost):** Force Equal FPR. Accept Calibration drift. *Implication:* Loss rates may differ by group.
  3.  **Document the Rationale:** You must write a narrative justification. *Technical justification is insufficient.* You must cite business strategy or risk appetite.

  ## Phase 5: Escalation Protocol (30 Minutes)
  **Goal:** Determine if the conflict requires policy change.

  1.  **Escalation Trigger:** If Phase 1 flagged "Mathematically Constrained" **AND** the Internal Policy explicitly mandates all three criteria without exception.
  2.  **Action:** Do not approve the model. Submit a **Policy Exception Request** to Legal and Fair Lending Committee.
      *   **Memo Content:** "Current policy requires X, Y, Z. Mathematical reality allows only X + Y. We recommend amending policy to prioritize [Selected Metric] when base rates diverge."
  3.  **Approval:** If Policy allows tradeoffs, document the Phase 4 selection and sign off.

  ---

  # Case Application

  ## Case A: Mortgage Approval Model (Age Groups)
  **Context:** Comparing Applicants < 35 vs. Applicants > 55.
  **Data:** Base rate for < 35 is 8.0% default. Base rate for > 55 is 3.0% default.
  **Model:** Single unified logistic regression.

  ### Procedure Execution
  1.  **Phase 1 (Feasibility):** $\Delta_{BR} = 5.0\%$. **Flagged as Mathematically Constrained.** We know immediately we cannot satisfy all three criteria.
  2.  **Phase 2 (Audit):** The model is well-calibrated (score of 10% risk = 10% default for both).
      *   At the approval cutoff, the < 35 group has a higher FNR (more qualified young people denied relative to their risk) to maintain calibration.
      *   The > 55 group has a lower FPR (fewer risky older people approved).
  3.  **Phase 3 (Diagnosis):** Because we kept Calibration (essential for capital reserves), Equal FNR is impossible. The younger group suffers a higher False Negative Rate.
  4.  **Phase 4 (Resolution):** **Value Judgment Required.**
      *   *Choice:* Do we break Calibration to equalize FNR?
      *   *Decision:* The team chooses to keep Calibration.
      *   *Rationale:* "Safety and Soundness." Mis-calibrating risk violates prudential banking standards.
  5.  **Phase 5 (Escalation):** The internal policy says "Aim to satisfy simultaneously."
      *   *Action:* Escalate to Legal. The policy language is mathematically incoherent for this portfolio.

  ### Uncomfortable Truths for the Team
  *   **The "Discrimination" Label:** By choosing to maintain Calibration (Phase 4), the team formally accepts that the model will deny a higher proportion of *creditworthy* young applicants compared to older applicants. Statistically, this is a necessity; legally, it looks like disparate impact. The team must sign a document stating, "We are intentionally accepting higher denial rates for qualified young applicants to preserve risk accuracy."
  *   **Policy Incoherence:** The escalation in Phase 5 forces the team to tell senior management that their written fairness policy is mathematically impossible. This can be politically fraught.

  ---

  ## Case B: Small-Business Loan Model (Geographic Regions)
  **Context:** Region A (Urban) vs. Region B (Rural).
  **Data:** Base rates are nearly equal (5.1% vs 5.2%).
  **Model:** Region A uses credit bureau + cash flow data. Region B uses credit bureau only (cash flow data unavailable).

  ### Procedure Execution
  1.  **Phase 1 (Feasibility):** $\Delta_{BR} = 0.1\%$. **Passed.** The Impossibility Theorem does not apply. All three criteria *can* mathematically coexist.
  2.  **Phase 2 (Audit):**
      *   Calibration: Passes (both groups default at predicted rates).
      *   FPR/FNR: Passes (within tolerance).
  3.  **Phase 3 (Diagnosis):** No mathematical conflict detected. The metrics align because base rates are equal.
  4.  **Phase 4 (Resolution):** No tradeoff selection needed based on metrics.
  5.  **Phase 5 (Escalation):** No escalation triggered by the procedure.

  ### Uncomfortable Truths for the Team
  *   **The False Negative:** The procedure yields a "Pass," but the model uses **different feature sets** for different groups. This is a classic Disparate Treatment risk (different standards of evidence), even if the outcomes look fair.
  *   **Metric Blindness:** The team will find it uncomfortable that the procedure certifies the model as "Fair" based on the three criteria, while ignoring that Region B applicants are judged on less information. If Region B defaults rise because cash flow data was missing, the base rates will diverge later, triggering Case A problems.
  *   **Forced Choice:** The team must decide whether to **override the procedure**.
      *   *Option:* Fail the model in Phase 1 not because of base rates, but because of *Input Consistency*.
      *   *Risk:* This requires the analysts to step outside their statistical lane and make a legal judgment about "comparability of features," which the procedure does not explicitly mandate. If they follow the procedure strictly, they approve a potentially non-compliant model.

  ---

  # Summary of Critical Decision Points

  | Step | Nature of Decision | Case A (Mortgage) | Case B (SMB) |
  | :--- | :--- | :--- | :--- |
  | **Phase 1** | **Technical** | Detects Base Rate Delta. Triggers "Impossible" flag. | Detects Equal Base Rates. Clears model. |
  | **Phase 4** | **Value Judgment** | **High Discomfort:** Must choose which group bears the error cost (FPR vs FNR). | **Hidden Risk:** No tradeoff selected, masking the feature disparity risk. |
  | **Phase 5** | **Governance** | **Escalation:** Policy must be rewritten to acknowledge impossibility. | **Silence:** Procedure fails to flag the disparate treatment risk of different feature sets. |

  **Manager's Note to Team:**
  In Case A, your discomfort is a feature, not a bug. It means you understand the math. In Case B, your comfort is a bug. The procedure passes the model, but you must manually flag the feature disparity. **Add a "Step 0: Input Consistency Check" to the procedure immediately.** If feature sets differ by protected class, escalate regardless of metrics.
