prompt: |-
  Hey, I'm working through Warren and Brandeis's 1890 article "The Right to Privacy" for a small reading group and this paragraph keeps throwing me:

  Recent inventions and business methods call attention to the next step which must be taken for the protection of the person, and for securing to the individual what Judge Cooley calls the right "to be let alone." Instantaneous photographs and newspaper enterprise have invaded the sacred precincts of private and domestic life; and numerous mechanical devices threaten to make good the prediction that "what is whispered in the closet shall be proclaimed from the house-tops." For years there has been a feeling that the law must afford some remedy for the unauthorized circulation of portraits of private persons; and the evil of the invasion of privacy by the newspapers, long keenly felt, has been but recently discussed by an able writer. The alleged facts of a somewhat notorious case brought before an inferior tribunal in New York a few months ago, directly involved the consideration of the right of circulating portraits; and the question whether our law will recognize and protect the right to privacy in this and in other respects must soon come before our courts for consideration.

  What I can't get straight is what there actually arguing here. They make it sound like the common law has spent centuries expanding protection for the person (battery to assault to nuisance to slander and libel), and that privacy is just the next move in that same game. But then they also talk like the law doesn't yet recognize a right to privacy and has to be shown that it can. So are they saying judges are already committed to it, or that they ought to create it, or something in between? Also, when they borrow Judge Cooley's phrase the right "to be let alone," is that meant as a definition of privacy or more of a slogan? And why does it matter to them so much that these earlier expansions were worked out by judges rather than legislatures — would the argument lose its force if you thought privacy had to come from a statute instead? Could you walk me through the paragraph almost sentence by sentence and flag where the real argumentative work is happening?
