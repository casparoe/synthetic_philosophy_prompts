answer: |-
  **The Accountability Algorithm**

  This procedure helps managers decide between the **Blaming Stance** (holding the employee morally answerable with consequences) and the **Problem-Solving Stance** (treating the error as a system or capacity issue to be fixed).

  **Step 1: The Safety Stop**
  *Question:* Did this action create immediate physical danger or violate the law?
  *Answer:* **Yes.** Secure the situation immediately. Proceed to Step 2.
  *Answer:* **No.** Proceed to Step 2.
  *Note:* This step does not decide the stance; it prioritizes safety.

  **Step 2: The Knowledge Check**
  *Question:* Did the employee clearly know the correct standard and possess the training to meet it?
  *Satisfactory Answer:* "Yes, this is basic training they completed months ago." -> **Go to Step 3.**
  *Satisfactory Answer:* "No, this is new/complex/untrained." -> **STOP. Problem-Solving Stance.** (Retrain.)
  *Judgment Call:* Determining what counts as "clearly known" is subjective.

  **Step 3: The Control Check**
  *Question:* Did external factors (equipment, staffing, time pressure imposed by management) make success reasonably impossible?
  *Satisfactory Answer:* "Yes, the lift was broken," or "I forced them to rush." -> **STOP. Problem-Solving Stance.** (Fix the system.)
  *Satisfactory Answer:* "No, they had the tools and time." -> **Go to Step 4.**
  *Judgment Call:* Defining "reasonably impossible" is a moral judgment about pressure vs. performance.

  **Step 4: The Choice Check**
  *Question:* Did the employee knowingly choose a shortcut or risky behavior to benefit themselves (e.g., leaving early, avoiding effort)?
  *Satisfactory Answer:* "Yes, they admitted they wanted to leave." -> **STOP. Blaming Stance.** (Discipline.)
  *Satisfactory Answer:* "No, they thought they were doing the right thing." -> **STOP. Problem-Solving Stance.** (Coach.)

  **Step 5: The Pattern Check (If Steps 2-4 are mixed)**
  *Question:* Is this the third occurrence of this specific behavior?
  *Answer:* **Yes.** -> **Blaming Stance.** (Accountability is now required.)
  *Answer:* **No.** -> **Problem-Solving Stance.** (Give benefit of the doubt.)

  ***

  **Worked Applications**

  **1. The Rushed Brake Job**
  *Scenario:* Mechanic cuts corners to leave early. Car is unsafe.
  *Run:*
  1.  **Safety:** Yes. (Proceed)
  2.  **Knowledge:** Yes. Brakes are core competency. (Proceed)
  3.  **Control:** No. Management didn't force them to rush; they chose to. (Proceed)
  4.  **Choice:** Yes. They chose safety vs. leaving early.
  *Result:* **Blaming Stance.**
  *Why:* This was a moral failure, not a skill failure. They treated customer safety as expendable for personal convenience. Discipline is required to maintain trust.

  **2. The Burned-Out Service Writer**
  *Scenario:* Writer makes billing error after 16-hour days covering shortages.
  *Run:*
  1.  **Safety:** No (Financial risk only). (Proceed)
  2.  **Knowledge:** Yes. They know billing. (Proceed)
  3.  **Control:** Yes. Management imposed 16-hour days and staffing shortages. Success was statistically unlikely due to fatigue.
  *Result:* **Problem-Solving Stance.**
  *Why:* The error is a symptom of management failure, not employee malice. Fix the schedule. Blaming here destroys morale and ignores the root cause.

  **3. The Damaged Fender (The Unpopular Answer)**
  *Scenario:* A senior mechanic damages a customer's car panel while moving it. He was using the shop's primary lift, which you know jerks unexpectedly. You usually blame mechanics for "being careless."
  *Run:*
  1.  **Safety:** Yes (Property damage). (Proceed)
  2.  **Knowledge:** Yes. He is senior. (Proceed)
  3.  **Control:** Yes. The lift is known to malfunction. He had to use it to work.
  *Result:* **Problem-Solving Stance.**
  *Why:* The procedure flags the equipment, not the man.
  *Why you won't like it:* Fixing the lift costs capital capital you'd rather save. It's easier to dock the mechanic's pay.
  *Why you must follow it:* If you blame the mechanic for equipment failure, you signal that you value money over their security. Good mechanics will leave because they know they can be punished for your deferred maintenance. You lose retention to save repair costs.

  ***

  **Limitations and Moral Flags**

  This procedure cannot handle every situation. Do not use it for:
  1.  **Malice or Sabotage:** If an employee intends harm, this is HR/Legal territory, not a management decision procedure.
  2.  **Harassment/Discrimination:** These are legal liabilities. Never treat these as "problem-solving" opportunities.
  3.  **Gross Negligence:** If the error is so severe it threatens the business's license, legal counsel overrides this checklist.

  **Moral Judgments Disguised as Procedure**
  Be aware that two steps are actually moral judgments, not mechanical checks:
  *   **Step 3 (Control):** Deciding whether pressure was "reasonable" is subjective. A manager who tolerates chaos will always answer "No" (employee had control), while a empathetic manager will answer "Yes" (system failed). You must calibrate your managers on what constitutes "reasonable constraint."
  *   **Step 4 (Choice):** Inferring intent is mind-reading. Managers often project their own frustrations onto employees. Require evidence (statements, logs) before marking "Yes."

  **Final Warning**
  This tool creates consistency, but it cannot create wisdom. If your managers do not trust the employees, they will manipulate the answers to justify blame. If they fear conflict, they will manipulate answers to avoid accountability. You must audit the *answers* they log, not just the final decision. The integrity of the procedure depends on the integrity of the manager running it.
