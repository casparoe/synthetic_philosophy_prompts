  2.  **Deconstruct the Core Concept:**
      *   The user is referencing philosophical distinctions (likely Strawson-esque reactive attitudes vs. objective stance).
      *   *Blaming Stance:* Employee had control, knew better, chose wrong. Requires accountability/consequences.
      *   *Problem-Solving Stance:* Employee lacked capacity, knowledge, or was constrained by external factors. Requires training/system fix.
