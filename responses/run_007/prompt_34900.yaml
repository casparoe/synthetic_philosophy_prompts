  2.  **Deconstruct Superrationality:**
      *   What is it? Roughly, the idea that rational agents in symmetric situations should correlate their actions because their reasoning processes are identical (or sufficiently similar). It challenges Causal Decision Theory (CDT) in favor of something closer to Evidential Decision Theory (EDT) or Functional Decision Theory (FDT).
      *   Key proponents/related views: Douglas Hofstadter (original term), David Gauthier (constrained maximization), Judea Pearl (critic), Wei Dai (UDT), Eliezer Yudkowsky (FDT).
      *   Key mechanism: Subjunctive dependence or logical correlation.

  3.  **Brainstorm Defeaters (Vulnerabilities):**
