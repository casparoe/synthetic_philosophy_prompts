  Actually, the "Reference Class" problem is more foundational. If you can't define the class, you can't apply the theory. I'll mark that as Fatal/Major.
  Let's stick to "Fatal" for things that make the theory incoherent, "Major" for things that make it lose utility or applicability, "Awkward" for counter-intuitive results.

  *Revised Plan for Defeaters:*
  1.  **The Reference Class Problem (Fatal/Major):** Without a metric of similarity, the theory is undefined.
