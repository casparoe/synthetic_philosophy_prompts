prompt: |-
  I'm in a graduate seminar on formal epistemology and decision theory, and we've spent several weeks on the limitations of causal decision theory. I've become convinced that something like superrationality — the principle that in symmetric decision problems, you should choose the action that would yield the best outcome if all players in your epistemic situation reasoned the same way and chose the same action — is the right response to the one-shot Prisoner's Dilemma and structurally similar cases. The core intuition is that if you know the other player is your exact epistemic twin and will replicate your reasoning, then defecting because your choice does not cause theirs amounts to ignoring relevant information about what they will in fact do.

  I want to know what I am staking on this view. Please tell me what would count against superrationality: not just the familiar charge that it conflates evidential and causal relevance, but a systematic map of its vulnerabilities. What formal results, edge cases, or conceptual problems would weaken or defeat the position? I want defeaters ranked from fatal to merely awkward, and for each, I want to know whether a committed defender of superrationality would concede it as counting against them or would dismiss it as question-begging. I also want an honest assessment of whether the view has been insulated by qualifications — for instance, by restricting the reference class of sufficiently similar agents — and whether that insulation is a problem for a view of this kind, or just good theory-building.

  After the main analysis, give me a structured summary as a JSON object with this schema:

  {
    "defeaters": [
      {
        "name": "short label for the defeater",
        "description": "what would have to be true or what the problem is, in one or two sentences",
        "severity": "fatal | major | awkward",
        "conceded_by_defenders": true or false,
        "category": "formal_result | conceptual | empirical | edge_case | internal_tension"
      }
    ],
    "overall_assessment": {
      "is_falsifiable": true or false,
      "is_insulated_by_qualifications": true or false,
      "insulation_is_a_problem": "explanation of why insulation is or is not a problem for a view of this kind, or null if not insulated"
    }
  }
