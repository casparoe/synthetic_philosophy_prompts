      *   *Reference Class:* Defenders often retreat to "logical similarity" but admit this is hard to formalize. They might dismiss the charge as "CDT bias."
      *   *Evolutionary:* Defenders argue rationality isn't about evolutionary fitness in a mixed pool, but about normative correctness. They usually dismiss this.
      *   *Formalization:* Defenders concede this is work-in-progress (FDT is newer than CDT/EDT).

  6.  **Assess Insulation/Qualifications:**
