      *   *The "Blackmail/Extortion" problem:* FDT/Superrationality can be exploited by agents who know your algorithm (Parfit's Hitchhiker variants, Blackmail).
      *   *The "Asymmetry" problem:* What if the twins aren't exact? How similar is similar enough?
      *   *The "Causal Isolation" intuition:* It feels like magic. If I press a button here, how does it change the physical state over there without a causal link?
      *   *The "Newcomb's Problem" distinction:* Superrationality works well in Newcomb, but PD is different because the payoff matrix is symmetric and causal independence is usually assumed by the setup.
      *   *The "Evolutionary Stability" argument:* In a mixed population, superrational cooperators get exploited by CDT defectors.
      *   *The "Logical Uncertainty" problem:* Formalizing "logical correlation" requires a theory of logical uncertainty which is still underdeveloped.
      *   *The "Precommitment" regress:* Do you need to precommit to be superrational? If so, when?

  4.  **Select and Rank Defeaters:**
      *   *Fatal:* The Blackmail/Extortion vulnerability (FDT specific, but applies to superrational logic). If you are predictable, you can be held hostage.
