prompt: |-
  I'm on my city's affordable housing task force and we're stuck between two proposals for a city-owned parcel. Proposal A: a mixed-income building with 65 deeply affordable units (for households below 30% AMI) plus 135 market-rate units, where the market-rate revenue cross-subsidizes the affordable ones so we use zero additional public dollars beyond the land. Proposal B: a 100% deeply affordable building on the same parcel, but because there's no cross-subsidy it only pencils out to 50 units — fewer total affordable units than A, but every single one goes to a low-income household.

  One of the members keeps saying Rawls's difference principle decides it: we have to maximize the position of the worst-off, and B gives them 100% of the building instead of about a third. I think he's confusing the *share* going to the worst-off with the *absolute position* of the worst-off — 65 affordable units houses more families than 50 does — but I also suspect there's a deeper issue about whether the difference principle even applies to a one-off policy decision rather than the basic structure of society as a whole. I need to make the case clearly because three other members are nodding along with him and we vote in ten days.

  Draft me a short memo (2–3 pages) for the task force that: (1) explains what the difference principle actually says, including what Rawls meant by "the basic structure" and why he thought the principle applies to that and not necessarily to every individual policy; (2) applies it honestly to our two proposals and says which one it favors, if either; (3) takes the other guy's argument seriously — don't just dismiss the "share" intuition, say what's right about it and where it goes wrong; and (4) gives a clear recommendation with reasons. Assume no one on the task force has read Rawls, so spell out the concepts as you go.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** City affordable housing task force deciding between two proposals for a city-owned parcel.
      *   **Proposal A:** Mixed-income (65 deeply affordable + 135 market-rate). Zero public subsidy beyond land. Total affordable units = 65.
      *   **Proposal B:** 100% deeply affordable. Requires public subsidy (implied, since it "only pencils out to 50 units" without cross-subsidy, though the prompt says "because there's no cross-subsidy it only pencils out to 50 units" - wait, let me re-read carefully).
          *   *Correction on Proposal B:* "100% deeply affordable building... but because there's no cross-subsidy it only pencils out to 50 units." This implies the *capacity* of the site + available funding allows for 50 units if 100% affordable. Proposal A allows for 200 total units (65 affordable + 135 market) because market revenue covers costs.
          *   *Key Comparison:* A = 65 affordable units. B = 50 affordable units.
      *   **Conflict:** One member argues Rawls's Difference Principle favors B (100% to worst-off vs. 1/3 to worst-off). The user argues A favors the worst-off more (65 families vs. 50 families).
      *   **Task:** Draft a 2-3 page memo.
      *   **Requirements:**
          1.  Explain Rawls's Difference Principle and "Basic Structure."
          2.  Apply it honestly to the proposals.
          3.  Address the opposing argument seriously (share vs. absolute number).
          4.  Give a clear recommendation.
      *   **Audience:** Task force members (laypeople regarding philosophy, policymakers regarding housing).
      *   **Tone:** Professional, persuasive, philosophical but accessible, respectful of the dissenting view.

  2.  **Deconstruct Rawls (Mental Check):**
      *   *Theory:* Justice as Fairness.
      *   *Basic Structure:* The major social institutions (constitution, economy, legal system) that distribute rights and duties and determine the division of advantages. Rawls explicitly states the principles of justice apply primarily to the *basic structure*, not every single transaction or specific policy decision in isolation.
      *   *Difference Principle:* Social and economic inequalities are to be arranged so that they are to the greatest benefit of the least advantaged.
      *   *Interpretation:* It's about maximizing the *absolute* position (primary goods, opportunities, resources) of the worst-off group, not necessarily maximizing their *proportionate share* of a specific pie.
      *   *Application to Policy:* While a single policy isn't the "basic structure," it should align with principles that would govern the basic structure. However, applying it rigidly to a single project might miss the systemic view (e.g., if choosing B reduces overall housing supply or sets a precedent that limits future affordable development).

  3.  **Evaluate the Proposals through a Rawlsian Lens:**
      *   *Proposal A:* 65 units for <30% AMI.
      *   *Proposal B:* 50 units for <30% AMI.
      *   *The "Worst-Off":* Households below 30% AMI on the waiting list.
      *   *Rawls's Metric:* Who is better off? The 65 families housed in A, or the 50 families housed in B?
      *   *Analysis:* 65 > 50. Therefore, in terms of *absolute numbers* of worst-off individuals helped, A wins.
      *   *The Opposing Argument:* B gives 100% of the resource to the worst-off. A "dilutes" the resource with market-rate people.
      *   *Counter-Argument:* Rawls cares about the *index of primary goods* (housing, security, opportunity). A housed family is better off than an unhoused family. Maximizing the number of housed families maximizes the benefit to the class of the worst-off.
      *   *Nuance:* Does the presence of market-rate units harm the affordable residents? (Stigma? Stability?) If not, A is strictly better. If yes, that needs weighing. But based *strictly* on the numbers provided, A houses more people.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose (clarify the philosophical argument regarding Rawls) and the stakes (65 vs. 50 units).
      *   **Section 1: What Rawls Actually Said:**
          *   Define the Difference Principle simply (inequalities allowed only if they help the worst-off).
          *   Define the "Basic Structure" (institutions, not single decisions). Explain why Rawls made this distinction (efficiency, liberty, avoiding micromanagement).
          *   Crucial point: Rawls focuses on *absolute* expectations, not relative shares.
      *   **Section 2: Applying to Proposals A & B:**
          *   Identify the "least advantaged" ( <30% AMI households).
          *   Compare the outcome: 65 housed vs. 50 housed.
          *   Conclusion: A maximizes the absolute position of the group.
      *   **Section 3: Addressing the Counter-Argument (Share vs. Absolute):**
          *   Validate the intuition: It feels unfair to mix income groups; B feels "purer."
          *   Explain the error: Confusing *proportion* with *benefit*. If 100% of 50 is less than 33% of 200 (in terms of need met), the worst-off are worse off in B.
          *   Mention the "Basic Structure" caveat: This one decision shouldn't override the systemic goal of maximizing housing stock.
      *   **Section 4: Recommendation:**
          *   Vote for A.
          *   Reasons: More families housed, sustainable model (no extra public $), aligns with Rawlsian *outcome* (maximizing the minimum) even if the *method* involves inequality (market units).

  5.  **Refining the Tone:**
      *   Avoid being condescending to the colleague. Use phrases like "This is a compelling intuition," or "It is easy to see why..."
      *   Ensure the distinction between "share of the building" and "share of housing security" is clear.
      *   Keep it tight (2-3 pages approx. 800-1200 words).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the "Basic Structure" clearly? *Adjustment:* Make sure to note that Rawls didn't want judges or bureaucrats applying the difference principle to every single law, but rather designing the system so it happens naturally. However, for a task force, we act as designers of a micro-structure.
      *   *Check:* Did I address the "share" argument? *Adjustment:* Explicitly name it the "proportionate share fallacy" or similar, but gently.
      *   *Check:* Is the math clear? *Adjustment:* 65 > 50. Emphasize that the "worst-off" are the people *without* housing.
      *   *Check:* Is the recommendation clear? *Adjustment:* Yes, vote A.

  7.  **Final Polish:** Check formatting, ensure flow between sections. (The prompt asks for 2-3 pages, which in standard memo formatting is roughly 800-1000 words single spaced or 1200 double. I will aim for substantial content that fits that visual length).

  *(Self-Correction on Rawls Nuance)*: I need to be careful not to say Rawls *never* applies to policy. He says the principles regulate the basic structure, which *then* regulates policy. But in a task force setting, we are effectively designing a local rule. The key insight is that the Difference Principle is about the *expectations* of the worst-off, not their *envy* or *relative share*. If the worst-off are absolutely better off in A (because they have a home vs. no home), A wins.

