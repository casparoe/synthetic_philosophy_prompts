answer: |-
  **MEMORANDUM**

  **TO:** Affordable Housing Task Force Members
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Philosophical Framework for Parcel Decision: Applying Rawls to Proposals A and B

  **Introduction**

  As we approach our vote on the development of the city-owned parcel, the debate has centered on two competing visions: Proposal A (65 deeply affordable units cross-subsidized by market-rate units) and Proposal B (50 deeply affordable units funded by public subsidy). A compelling argument has been raised that John Rawls's "Difference Principle" mandates we choose Proposal B because it dedicates 100% of the resource to the worst-off, whereas Proposal A dedicates only about one-third.

  This memo clarifies what Rawls's theory actually entails, specifically regarding the "Basic Structure" of society and the definition of "benefit." It argues that while the intuition behind Proposal B is morally serious, a correct application of Rawlsian justice—and indeed a pragmatic view of housing need—favors Proposal A.

  **1. Rawls 101: The Difference Principle and the Basic Structure**

  To apply Rawls correctly, we must understand two specific concepts: the *Basic Structure* and the *metric of advantage*.

  **The Basic Structure**
  Rawls, in *A Theory of Justice*, explicitly limits the scope of his principles. He argues that the principles of justice apply primarily to the "basic structure" of society—the major political, social, and economic institutions that distribute fundamental rights and determine the division of advantages from social cooperation.

  Rawls did not intend for the Difference Principle to be applied micromanagement-style to every individual policy decision, transaction, or land deal in isolation. Why? Because focusing on individual transactions can undermine the overall system's efficiency and liberty. For example, if we demanded every single contract maximize the position of the worst-off, the market might seize up, ultimately hurting the worst-off by reducing overall wealth. Rawls wants us to design the *rules of the game* (the basic structure) so that, over time, the system naturally maximizes the well-being of the least advantaged.

  **The Difference Principle**
  The principle states: *Social and economic inequalities are to be arranged so that they are to the greatest benefit of the least advantaged.*

  Crucially, Rawls defines "benefit" in terms of an **index of primary goods** (rights, liberties, opportunities, income, wealth, and the social bases of self-respect). He is concerned with the *absolute* level of these goods enjoyed by the worst-off group, not their *relative share* compared to the better-off. Rawls is not an egalitarian in the sense of demanding equal shares; he is a prioritarian. He cares about how much the bottom rung has, not how far they are from the top rung, provided the inequality is necessary to improve the bottom rung's position.

  **2. Application to Proposals A and B**

  When we apply this framework to our decision, we must identify the "least advantaged" group. In this context, it is households earning below 30% of the Area Median Income (AMI) who are currently cost-burdened or unhoused.

  **The Metric: Absolute Position**
  Under Proposal A, 65 families from this group secure stable, deeply affordable housing. Under Proposal B, 50 families from this group secure stable, deeply affordable housing.

  If we accept that housing is a primary good essential for opportunity, health, and security, then the "position" of the least advantaged is determined by whether they have a home.
  *   **Proposal A:** Improves the absolute position of 65 worst-off households.
  *   **Proposal B:** Improves the absolute position of 50 worst-off households.

  Because 65 is greater than 50, Proposal A maximizes the expectation of the least advantaged class more effectively. The existence of market-rate units in Proposal A is an "inequality" (some pay market rate, some do not), but Rawls allows inequalities *if and only if* they work to the advantage of the worst-off. Here, the "inequality" of mixing incomes generates the cross-subsidy that houses 15 additional low-income families who would otherwise remain without housing. Therefore, the inequality is justified under the Difference Principle.

  **3. Addressing the Argument for Proposal B**

  The argument for Proposal B rests on a powerful moral intuition: that public resources should not be "diluted" by benefiting those who are already better off. There is validity to this concern. Historically, mixed-income developments have sometimes led to the displacement of the poorest residents or created stigmatizing environments where affordable residents feel like second-class citizens. If Proposal A resulted in lower quality of life for the 65 families compared to the 50 families in B, the Rawlsian calculus might shift.

  However, the argument that Rawls requires us to maximize the *proportionate share* of the building going to the worst-off misinterprets the theory.

  **Share vs. Outcome**
  The claim that B is more "Rawlsian" because 100% of the units go to the poor confuses the *share of the resource* with the *benefit of the resource*. Rawls does not argue that the worst-off should own 100% of the pie; he argues they should receive the largest possible slice that the system can sustainably provide.

  If we choose B, we are prioritizing the *purity* of the allocation over the *magnitude* of the relief. We are effectively saying it is better for 50 families to have a home exclusively among peers than for 65 families to have homes in a mixed environment. Unless we have evidence that the mixed-income environment actively harms the 65 families (reducing their "social bases of self-respect"), the absolute gain of 15 additional housed families outweighs the relative loss of exclusivity.

  **The Basic Structure Caveat**
  Furthermore, treating this single parcel as a standalone test of justice ignores the "Basic Structure" warning. If we establish a precedent that city land must always be 100% affordable regardless of efficiency, we may reduce the total housing stock the city can produce over the next decade. A policy that feels more just in one instance (Proposal B) might lead to a less just system overall if it limits our capacity to house people in the future.

  **4. Recommendation**

  I recommend the Task Force vote for **Proposal A**.

  **Reasons:**
  1.  **Maximizing the Minimum:** Proposal A houses 30% more deeply affordable households than Proposal B (65 vs. 50). This directly maximizes the absolute position of the least advantaged group, which is the core mandate of the Difference Principle.
  2.  **Fiscal Sustainability:** Proposal A achieves this without additional public subsidy beyond the land. This preserves public funds for other services that benefit the worst-off (e.g., supportive services, childcare, transit), further enhancing their "index of primary goods."
  3.  **Correcting the Philosophical Error:** While the desire to reserve 100% of the building for the poor is emotionally resonant, it prioritizes relative share over absolute need. Rawlsian justice is concerned with outcomes for the vulnerable, not the symbolic purity of the allocation.

  **Conclusion**
  We should not reject a tool (mixed-income cross-subsidy) simply because it involves inequality, if that inequality is the very mechanism that allows us to lift more people out of precarity. Proposal A uses the market to serve the poor more effectively than the public subsidy alone can in Proposal B. It is the choice that best aligns with both practical housing needs and the true spirit of distributive justice.

  I look forward to discussing this further at our next meeting.
