answer: |-
  When people invoke Epicurus's "death is nothing to us," they are typically advancing one of four distinct claims, ranging from psychological advice to metaphysical assertions about value.

  1.  **The Therapeutic Claim: You should not fear the state of being dead.**
      *   **Assertion:** Since you will not exist to experience death, anticipating it as a painful state is irrational. Dread requires a subject; death removes the subject.
      *   **Plausibility:** High. It successfully targets the fear of *experience* (e.g., darkness, silence, suffering).
      *   **Follows from Slogan:** Yes. This follows directly from the premise that existence and death do not overlap.
      *   **Common Usage:** Very common. This is the most charitable and frequent use, aimed at comforting the dying or the death-anxious.

  2.  **The Experiential Harm Claim: Death cannot be bad *for you* at the time it occurs.**
      *   **Assertion:** Something is only bad for a person if they experience it as bad. Since death eliminates the experiencer, it cannot be a negative experience for the deceased.
      *   **Plausibility:** Contested. Philosophers like Thomas Nagel argue harm can be comparative (deprivation of goods) rather than purely experiential.
      *   **Follows from Slogan:** Yes, provided one accepts the premise that harm requires experience. It relies on the "no subject" premise to define harm strictly as experienced suffering.
      *   **Common Usage:** Common in philosophical disputes. Used to block claims that the *moment* of death is a harm to the subject.

  3.  **The Misfortune Claim: Death is never a tragedy or misfortune for the deceased.**
      *   **Assertion:** Because there is no subject to suffer the loss, dying at twenty is not worse for that person than dying at eighty. There is no "victim" of death.
      *   **Plausibility:** Low to Moderate. Counterintuitive to most moral intuitions regarding premature death. It ignores the deprivation account of harm (loss of future goods).
      *   **Follows from Slogan:** Weakly. The slogan proves you won't *feel* bad, but not that you haven't *lost* anything. It conflates experiencing harm with being harmed.
      *   **Common Usage:** Very common as an argument-stopper. Often deployed to shut down debates about abortion, euthanasia, or premature death, though it arguably overreaches the logic.

  4.  **The Sufficiency Claim: A longer life is not better than a shorter one.**
      *   **Assertion:** Since death is nothing to us, extending life adds no value. A complete life is complete regardless of duration.
      *   **Plausibility:** Low. Most people value continued existence and future projects; death prevents the realization of those values.
      *   **Follows from Slogan:** Poorly. The slogan addresses the *state* of death, not the *value* of life. Denying death is bad does not automatically deny life is good.
      *   **Common Usage:** Less common, but appears in discussions about life extension or population ethics. Often a non-sequitur derived from the Misfortune Claim.

  **Summary**
  The slogan moves from a robust psychological insight (1) to a controversial metaphysical stance on harm (2), then to a counterintuitive ethical claim (3), and finally to a questionable axiological conclusion (4). In ordinary conversation, users often slide from (1) to (3) without noticing the gap. They assume that because you won't *feel* the loss, the loss *doesn't matter*. While (1) and (2) follow logically from the non-overlap of life and death, (3) and (4) require additional premises about the nature of value that the slogan itself does not provide. When used to dismiss the tragedy of premature death, the slogan is usually doing more work than its logic can support.
