  **Viability Note:**
  Before presenting the proposal, I must flag a significant philosophical hurdle. Your core intuition—that moral uncertainty forces aggregation via expected value calculations—risks begging the question against Taurek. Maximizing Expected Choice-Worthiness (MEC), the standard model for moral uncertainty, presupposes that we can compare the *magnitude* of value across different moral theories (the Intertheoretic Comparison Problem). Taurek's position often rests on the denial that there is a common scale of value across persons; if so, he likely denies a common scale across theories. If MEC presupposes aggregation to function, using it to refute Taurek is circular. The proposal below reframes the project to avoid this: it asks not whether uncertainty *refutes* Taurek, but whether a Taurekian can construct a coherent decision-rule under uncertainty without collapsing into aggregation. This makes the project viable but technically demanding.

  ***

  # Research Proposal: Aggregation and Practical Deliberation Under Normative Uncertainty

  ### 1. Research Question
  The central question of this project is: **Does taking normative uncertainty seriously render non-aggregative moral theories practically inert?**

  John Taurek famously argued that in rescue cases, the fact that more people stand to be saved does not, by itself, justify saving the larger group. This "numbers don't count" thesis relies on a first-order moral claim: there is no agent-neutral value in saving more lives that outweighs the claim of the individual. However, this debate has almost exclusively assumed moral certainty. In reality, agents are uncertain about which moral theory is correct. Standard models of decision-making under normative uncertainty suggest we ought to maximize expected moral value across the theories in which we have credence.

  If a agent has even a small credence in aggregative theories (like utilitarianism), and if we can compare choice-worthiness across theories, the expected value of saving the larger group will almost invariably exceed that of saving the smaller group. This suggests that even if Taurek is right about the *truth* of morality, his view might be action-guiding only under conditions of impossible moral certainty.

  However, this argument faces a structural objection: standard expected value models may presuppose the very interpersonal comparability Taurek denies. Therefore, the refined research question is: **Can a coherent norm for decision-making under normative uncertainty be constructed that respects Taurekian non-aggregation, or does the structure of practical deliberation under uncertainty inevitably force aggregation?**

  ### 2. Literature Gap
  Two distinct literatures are relevant here, yet they remain siloed. First, the literature on aggregation and rescue cases (sparked by Taurek) focuses on first-order moral intuitions in burning-building scenarios. It debates whether numbers count, often assuming the agent knows the moral facts. Second, the literature on normative uncertainty focuses on the meta-normative question of how to act when unsure about morality. This literature typically examines conflicts between theories that agree on the *scale* of value but disagree on verdicts (e.g., deontology vs. consequentialism regarding rights), or it focuses on the metaphysics of intertheoretic comparison.

  These fields have not been brought together to address the specific structural tension between non-aggregation and uncertainty. Aggregation theorists have not considered whether their views survive the introduction of uncertainty. Conversely, normative uncertainty theorists have not tested their decision rules against theories that deny the comparability of value across persons. This project bridges that gap. It applies the formal tools of normative uncertainty to the specific problem of aggregation, asking whether the "practical inertia" objection holds or whether it relies on question-begging assumptions about intertheoretic comparison.

  ### 3. Methodology and Work Plan
  This is a two-year theoretical project combining conceptual analysis with formal modeling.

  **Months 1–6: Foundations and Formalization**
  I will begin by mapping the logical space of Taurekian positions. Not all non-aggregative views deny interpersonal comparability; some deny the *relevance* of aggregated value. I will distinguish between "hard" non-aggregation (no common scale) and "soft" non-aggregation (common scale but lexical priority to the individual). Simultaneously, I will survey existing models of normative uncertainty (e.g., Maximizing Expected Choice-Worthiness, My Favorite Theory, Nash Voting) to determine which, if any, are compatible with hard non-aggregation.
  *Deliverable:* A working paper defining the "Taurekian Decision Problem" under uncertainty.

  **Months 7–12: Modeling Intertheoretic Comparison**
  The core technical challenge is intertheoretic comparison. If Taurek denies we can compare the value of saving Person A vs. Person B, can we compare the value of "Saving A according to Taurek" vs. "Saving A and B according to Utilitarianism"? I will work with formal epistemologists to test variance normalization and other scaling methods. The goal is to see if any normalization method allows a Taurekian theory to retain non-zero influence on decision-making when pitted against aggregative theories with low credence.
  *Deliverable:* A formal model demonstrating the conditions under which non-aggregation survives uncertainty.

  **Months 13–18: Testing Implications**
  I will apply the model to specific cases. For instance, if I am 90% credence in Taurek and 10% in Utilitarianism, does the expected value calculation still mandate saving the many? I will also explore "theory individuation": does treating Utilitarianism as a family of theories rather than one monolithic theory change the expected value calculation? This phase involves refining the decision rule to avoid the "practical inertia" result without begging the question.
  *Deliverable:* Second paper on the implications for rescue cases and resource allocation.

  **Months 19–24: Synthesis and Dissemination**
  The final phase involves integrating the formal results with broader meta-ethical implications. If non-aggregation is inert under uncertainty, does this count as a pragmatic reductio of the view? Or does it suggest our models of normative uncertainty are biased toward aggregative structures? I will finalize the monograph manuscript and present findings at three major conferences.
  *Deliverable:* Completed manuscript and conference presentations.

  ### 4. Possible Conclusions
  There are three primary outcomes, decided by the feasibility of intertheoretic comparison:

  1.  **The Inertia Conclusion:** If no coherent method of intertheoretic comparison allows non-aggregative theories to compete with aggregative ones under uncertainty, then Taurek's view is practically inert. It applies only under moral certainty, a state humans never occupy. This would be a strong pragmatic argument against non-aggregation.
  2.  **The Pluralist Conclusion:** It may be possible to construct a decision rule (e.g., a modified voting system between theories) that allows non-aggregative views to veto aggregation even under uncertainty. This would preserve Taurek's view but require revising standard models of normative uncertainty.
  3.  **The Collapse Conclusion:** The analysis might show that "non-aggregation" is not a first-order moral view but a constraint on decision rules. If so, the debate shifts from "what is right" to "how to decide," potentially dissolving the original conflict.

  The deciding consideration will be whether we can define a "choice-worthiness" function for Taurekian theories that does not implicitly smuggle in aggregation. If the only way to make Taurekianism action-guiding under uncertainty is to assign it a value scale that aggregates, the Inertia Conclusion wins.

  ### 5. Assessment of Success and Failure
  This project carries high philosophical risk, and success must be defined realistically.

  **Failure Conditions:**
  The project fails if it merely asserts that expected value calculations favor aggregation without addressing the Intertheoretic Comparison Problem. If the argument rests on the assumption that we can compare the magnitude of value across Taurekian and Utilitarian theories, it begs the question against Taurek. Taurek can simply deny that such comparisons are meaningful. If I cannot overcome this objection, or if I produce a formal model that relies on premises a Taurekian would reasonably reject, the project will have failed to advance the debate. Additionally, failure would result if the formal modeling proves intractable, leaving the question at the level of vague intuition.

  **Success Conditions:**
  Success does not require proving Taurek wrong. Success is achieved if I provide a definitive map of the logical space. Even a negative result—that non-aggregation is incompatible with standard norms of decision under uncertainty—is a significant philosophical contribution. It would force non-aggregators to either abandon their view or develop a novel meta-normative account of uncertainty. Specifically, the project succeeds if it: (1) clearly distinguishes between first-order non-aggregation and meta-normative decision rules; (2) demonstrates exactly where standard models of normative uncertainty presuppose aggregation; and (3) offers a rigorous argument for whether this presupposition is fatal to the Taurekian position.

  Ultimately, the project's value lies in shifting the debate from first-order intuitions about rescue cases to the structural requirements of practical deliberation. Even if the conclusion is that the Taurekian view cannot be made coherent under uncertainty, establishing that limit is a substantive theoretical advance.
