prompt: |-
  I'm putting together an application for a two-year postdoctoral fellowship, and I need a research proposal (about 1500 words). My half-formed idea is this: the debate over Taurek's claim that the numbers don't count in rescue cases has been conducted almost entirely under the assumption that we know the relevant moral facts with certainty. But if we take moral uncertainty seriously — the idea that we should be uncertain about which moral theory is correct and should take that uncertainty into account in our practical deliberations — then Taurek's position may face a distinctive problem. Specifically, even if Taurek is right that there is no requirement to save the many rather than the few when we are certain of our moral reasons, it seems that under moral uncertainty we may be forced to aggregate across persons anyway, because the expected moral value of saving the many (computed across the range of theories we have nonzero credence in) will almost always favor saving the larger group. If so, Taurek's anti-aggregation conclusion might be practically inert: it only applies in a condition of moral certainty that we are never actually in.

  Turn this into a proposal with: (1) a precise statement of the research question, (2) why the existing literatures on Taurek-style aggregation and on moral uncertainty haven't been brought together to address this, (3) the method — what I would actually do, month by month, over the two years, (4) what the possible conclusions are and which considerations would decide between them, and (5) an honest assessment of what would count as the project failing and what would count as success. Don't include a bibliography or formal citations; I'll add those. Refer to positions and arguments by description.

  A couple of things to keep in mind. First, I want the proposal to be self-critical: if the core idea has a hidden flaw — for instance, if moral uncertainty just collapses into first-order moral reasoning in a way that makes the whole framing question-begging, or if the expected-value argument I sketched implicitly assumes exactly the kind of interpersonal aggregation that Taurek denies — I'd rather hear that now than after I submit the application. So if you think the question as I've posed it rests on a confusion or can't be made to work, say so plainly and explain why, rather than writing a polite proposal around a broken idea. Second, I'm not wedded to the exact framing I gave above; if you see a better or sharper version of the question in the same neighborhood, use that instead.

  Please approach this as an expert in moral philosophy who is also familiar with the formal epistemology literature on normative uncertainty. Before writing the proposal itself, take some time to think through the argumentative landscape — brainstorm the strongest objections to the idea and how they might be answered, and identify where the genuine open questions are. Then write the proposal from that more considered vantage point.
