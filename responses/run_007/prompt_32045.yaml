  2.  **Initial Brainstorming & Contextualization:**
      *   *Origin:* The term comes from Rudyard Kipling's *Just So Stories* (e.g., "How the Leopard Got His Spots"). These are fanciful, untestable myths.
      *   *Critics:* Gould and Lewontin ("The Spandrels of San Marco") are the big names here. They argued EP often assumes adaptationism without evidence.
      *   *Defenders:* Tooby and Cosmides, Pinker, etc. They argue EP makes predictions and uses comparative methods.
      *   *Core Tension:* Is EP generating testable predictions or just rationalizing the status quo?
      *   *Audit Approach:* I need to treat the analogy as a structural map. $A$ (Just-So Story) $\to$ $B$ (EP Hypothesis). Where do the vertices match? Where do the edges snap?

  3.  **Drafting the Correspondences (The Mapping):**
      *   *Storyteller:* The Evolutionary Psychologist.
      *   *Audience:* The Scientific Community / Public.
      *   *Tale:* The Adaptive Explanation (the hypothesis about the trait's history).
      *   *Moral:* The Conclusion (The trait exists *because* it was adaptive; therefore, it is natural/inevitable).
      *   *Setting:* The Environment of Evolutionary Adaptedness (EEA) – plays the role of "Once upon a time."

  4.  **Analyzing the Hold (Where it works):**
      *   *Narrative Structure:* Both involve a story about the past.
      *   *Post Hoc Nature:* Often, the trait is observed first, then the story is built.
      *   *Plausibility vs. Truth:* Both rely on intuitive plausibility ("Of course leopards need spots to hide!").
      *   *Difficulty of Verification:* We can't time travel to check the EEA, just as we can't check Kipling's mythic past.

  5.  **Analyzing the Breakdown (Where it fails):**
      *   *Intent:* Kipling knew he was writing fiction. Scientists claim empirical truth.
      *   *Constraints:* Scientific stories are constrained by physics, genetics, phylogeny. Kipling's are constrained only by imagination.
      *   *Methodology:* EP uses cross-cultural data, comparative primatology, archaeological records. Just-so stories use none.
      *   *Falsifiability:* In principle, EP hypotheses *can* be falsified (e.g., if a trait appears in a context where it reduces fitness). Just-so stories are immune.

  6.  **Addressing the "Dismissive Use" (The Crux):**
      *   Why is the critique damaging? It attacks *falsifiability* and *bias*.
      *   *Feature 1: Post Hoc Construction.* Does science allow this? Yes (abductive reasoning). But if *only* post hoc, it's weak.
      *   *Feature 2: Protection from Refutation.* This is the killer. If a hypothesis is immunized against data (e.g., "it was adaptive in the EEA, even if not now"), it matches the Just-So Story.
      *   *Matter vs. Incidental:* The fact that it's a "story" is incidental. The fact that it's *untestable* matters. The fact that it serves an ideological "Moral" (naturalism) matters.

  7.  **Reformulating Adaptationist Hypotheses:**
      *   How to fix it?
      *   Pre-registration of predictions.
      *   Focus on design features (engineering analysis) rather than just history.
      *   Null hypotheses (is it a spandrel?).
      *   Comparative testing (do related species have it?).

  8.  **Conclusion & Better Analogy:**
      *   Does the dismissive conclusion survive? Partially. It survives as a warning against *bad* EP, but fails as a condemnation of *all* EP.
      *   Better Analogy: Forensic Science / Detective Work.
          *   Reconstructing a past event from present traces.
          *   Constrained by evidence.
          *   Multiple hypotheses possible, but some ruled out.
          *   Not directly observable, but inferable.
      *   Alternative: Engineering/Reverse Engineering. (Tooby & Cosmides prefer this).

