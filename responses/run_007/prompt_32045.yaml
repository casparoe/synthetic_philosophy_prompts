answer: |-
  ### Audit of the "Just-So Story" Analogy in Evolutionary Psychology

  The charge that evolutionary psychology (EP) produces "just-so stories" is perhaps the most famous critique in the philosophy of biology. Originating prominently with Stephen Jay Gould and Richard Lewontin's 1979 paper *The Spandrels of San Marco and the Panglossian Paradigm*, the analogy invokes Rudyard Kipling's *Just So Stories*—whimsical, fictional tales explaining animal features (e.g., "How the Leopard Got His Spots").

  To audit this analogy is to treat it not as a slur, but as a structural mapping between two domains: **Fictional Etymology** (Kipling) and **Adaptationist Hypothesis** (EP). Below is an examination of the vertices of this mapping, the integrity of the connections, and the implications for the scientific status of the field.

  ---

  ### 1. The Intended Correspondences

  For the analogy to function, specific roles in the creation and consumption of a Just-So Story must map onto the scientific practice of EP.

  | **Just-So Story (Kipling)** | **Evolutionary Psychology (EP)** | **Function of the Correspondence** |
  | :--- | :--- | :--- |
  | **The Storyteller** | The Evolutionary Psychologist | The agent constructing the narrative explanation. |
  | **The Audience** | The Scientific Community / Public | The recipients who must be persuaded by the plausibility of the account. |
  | **The Tale** | The Adaptive Hypothesis | The narrative linking a current trait to a past selective pressure. |
  | **"Once upon a time"** | The Environment of Evolutionary Adaptedness (EEA) | The inaccessible historical setting where the causal event occurred. |
  | **The Moral** | The Normative Conclusion | The implication that the trait is "natural," "inevitable," or functionally optimal. |
  | **The Plot Device** | Natural Selection | The mechanism invoked to explain why the trait changed (magic vs. fitness). |

  **The Core Claim of the Analogy:** The critic asserts that the EP hypothesis shares the *epistemic status* of the Kipling tale: it is a plausible narrative constructed after the fact, designed to satisfy a desire for explanation, but lacking empirical leverage to distinguish truth from fiction.

  ---

  ### 2. Where the Mapping Holds

  The analogy gains traction in three specific areas of structural similarity:

  **A. The Inaccessibility of the Past (The EEA Problem)**
  In Kipling's stories, the past is mythic; in EP, the past is the Pleistocene. Neither can be directly observed. Both the storyteller and the scientist must infer past causes from present effects (the leopard's spots; the human mind's modularity). This creates a shared reliance on **abductive reasoning** (inference to the best explanation), which is inherently riskier than deductive prediction.

  **B. Plausibility as a Proxy for Truth**
  Kipling's stories work because they feel intuitively right (leopards hide in dappled shade). EP hypotheses often rely on similar intuitive fitness logic ("Men prefer youth because it signals fertility"). In both cases, there is a risk that **narrative coherence** is mistaken for **empirical validation**. If the story hangs together logically, the audience may suspend disbelief.

  **C. The Normative "Moral"**
  Kipling's stories often explain why things *must* be the way they are. Similarly, EP explanations can drift from "this trait evolved" to "this trait is functional/natural." This creates a **naturalistic fallacy** risk where the "Moral" of the evolutionary tale is used to justify current social arrangements, mirroring how folklore justifies cultural norms.

  ---

  ### 3. Where the Mapping Breaks Down

  The analogy fractures when we examine the constraints and methods applied to the "Tale."

  **A. Constraints on the Storyteller**
  Kipling was constrained only by imagination and rhyme. The evolutionary psychologist is constrained by **phylogeny, genetics, physics, and archaeology**. An EP hypothesis that contradicts the fossil record or genetic heritability estimates is rejected. A Just-So Story that contradicts physics (e.g., the moon made of green cheese) is still a valid story.

  **B. The Role of the Audience (Peer Review)**
  The audience for Kipling seeks entertainment; they reward novelty and charm. The audience for EP seeks truth; they reward **falsifiability and predictive power**. A scientific "tale" is subjected to adversarial scrutiny designed to break the narrative, not enjoy it.

  **C. The Mechanism**
  Natural selection is a blind, algorithmic process with mathematically definable outcomes (fitness maximization). Kipling's mechanisms are intentional and magical (a painter painting spots). While the *reconstruction* of selection might be story-like, the *mechanism* itself is rigorously modeled in population genetics, unlike the magic in folklore.

  ---

  ### 4. Critical Disanalogies: What Matters for the Dismissal?

  Not all breaks in the analogy are equal. Some are incidental; others strike at the heart of the dismissive critique.

  **Incidental Disanalogies:**
  *   *Tone:* That science is serious and Kipling is whimsical does not matter. A serious error is still an error.
  *   *Complexity:* That EP stories are mathematically complex while Kipling's are simple does not save EP if the logic is flawed.

  **Critical Disanalogies (The "Live" Charges):**
  The dismissive force of the analogy depends entirely on two features that Just-So Stories possess but Scientific Hypotheses *should not*:

  1.  **Immunization from Refutation:** A Just-So story is true by fiat. If a critic says, "Leopards don't hide in trees," the storyteller says, "Well, they used to."
      *   *The Charge:* EP hypotheses are often insulated from refutation by retreating into the EEA. If a trait is maladaptive *now*, the EP defender claims it was adaptive *then*. Because the EEA is unobservable, this makes the hypothesis unfalsifiable.
      *   *Verdict:* If an EP hypothesis is structured this way, the analogy **holds**. If the hypothesis makes claims about present-day mechanisms that can be tested, the analogy **breaks**.

  2.  **Purely Post Hoc Construction:** A Just-So story is written to explain an existing feature. It makes no new predictions.
      *   *The Charge:* EP observes a trait (e.g., jealousy) and invents a history. It does not predict the existence of the trait before observation.
      *   *Verdict:* This is the strongest point of the analogy. Science ideally predicts novel facts. If EP only rationalizes known data, it functions like folklore.

  ---

  ### 5. Reformulating Adaptationist Hypotheses

  Can adaptationist hypotheses be reformulated to shed the "Just-So" features? Yes, by shifting the focus from **historical narration** to **design analysis**.

  *   **From History to Engineering:** Instead of asking "What happened in the past?", ask "Does this trait exhibit complex functional design?" (The Paley/Dawkins approach). If a trait shows evidence of specialized design for a specific problem (e.g., the eye for seeing), adaptation is the null hypothesis regardless of the specific history.
  *   **Novel Predictions:** A robust EP hypothesis should predict **hidden features**. For example, if a fear module evolved for snakes, it should predict faster conditioning to snake images than to gun images (even though guns are more dangerous now). This is a testable, novel prediction, not a post hoc rationalization.
  *   **Cross-Species Comparison:** If the trait is adaptive, related species in similar niches should exhibit convergent traits. This moves the evidence from a single narrative to a comparative dataset.
  *   **Pre-Registration:** To combat *post hoc* rationalization, researchers can preregister predictions based on evolutionary models before collecting data.

  If EP adopts these methods, it sheds the "protection from refutation" feature. It becomes a **hypothetico-deductive** enterprise rather than a **narrative-abductive** one.

  ---

  ### 6. Conclusion: Does the Dismissive Verdict Survive?

  **The Audit Result:**
  The "Just-So Story" analogy is a **valid warning** but an **invalid verdict**.

  *   **As a Warning:** It correctly identifies a methodological hazard. Any research programme that relies on unobservable past events, intuitive plausibility, and post hoc rationalization *is* producing Just-So Stories. Insofar as specific EP papers exhibit these features (and some do), the critique is devastating and accurate for those specific instances.
  *   **As a Verdict:** It fails as a condemnation of the entire field. It conflates the *difficulty* of historical reconstruction with the *impossibility* of scientific testing. It ignores the constraints (genetics, neuroscience, comparative biology) that bind the scientist but not the storyteller.

  The dismissive conclusion survives only if one assumes that *all* adaptationist explanations are necessarily post hoc and unfalsifiable. If adaptationist hypotheses are reformulated to generate novel predictions about cognitive architecture (rather than just narrating history), the analogy collapses.

  **A Better Analogy: Forensic Science**
  A more accurate analogy for proposing and testing adaptationist explanations is **Forensic Reconstruction** (or Detective Work).

  *   **Correspondence:** Like the evolutionary psychologist, the forensic scientist was not present at the crime (the evolutionary past). They must infer causes from traces (current traits/genomes).
  *   **Constraints:** They cannot invent any story they like; the narrative must fit the physical evidence (ballistics/DNA vs. genetics/phylogeny).
  *   **Testability:** A forensic hypothesis can be wrong. New evidence (a witness/DNA test vs. archaeological find/neurological data) can overturn the reconstruction.
  *   **Status:** We do not dismiss forensic science as "just-so stories" merely because the crime happened in the past. We recognize it as **historical science**—difficult and probabilistic, but empirically grounded.

  Like forensics, evolutionary psychology is an attempt to reconstruct a past event from present evidence. It is prone to error and bias, but unlike Kipling's tales, its conclusions are held hostage by the evidence, not the imagination.
