answer: |-
  Sir,

  I receive your objection with the seriousness it deserves, for it strikes at the very heart of the distinction I have drawn between the nature of man and the nature of the beasts. It is a difficulty that has been raised by learned men before you, notably by Monsieur More in England, and I am pleased to address it with you now, for clarity in this matter is essential not only to natural philosophy but to our understanding of the soul's immortality.

  You ask why I do not grant that animals might possess sensation—pain, hunger, fear—while lacking reason and language. You suggest that on my own account, the mind possesses distinct faculties, and perhaps the lower faculty of sensation might exist without the higher faculty of intellect.

  To this, I must reply that you are here relying on a Scholastic distinction which I have taken great pains to dismantle. The Peripatetics taught that there is a "sensitive soul" in animals, distinct from the "rational soul" in men. They imagined the soul as a composite of parts, one governing nutrition, another sensation, another reason. But in the *Sixth Meditation* and in my replies to objections, I have demonstrated that the mind is a substance entirely indivisible. It is not composed of parts. When I will, I understand, I imagine, and I feel, it is one and the same *I* that does all these things. There are not three souls in a man, but one soul that performs all these functions.

  Consequently, if you grant that a dog feels pain, you grant that it possesses a mind—a *res cogitans*. For what is pain? It is not merely the motion of the nerves or the withdrawal of the limb. A clock may strike when a weight descends, but it does not *feel* the strike. Pain is a *thought*, a mode of consciousness. To feel pain is to be conscious of pain. If the beast is conscious, it thinks. And if it thinks, it possesses an immaterial soul, distinct from the body.

  Now, consider the consequence. If the soul of the beast is immaterial, it is not dependent on the body for its existence in the way that extension is. It would, by the same logic I apply to the human soul, be immortal. Are we to suppose that the souls of flies and horses persist eternally? Or that God, being just, creates immortal souls merely to suffer in the bodies of animals, with no hope of salvation or reward? This would make God a tyrant. To avoid this impiety, and to remain consistent with the indivisibility of the thinking substance, we must conclude that if animals lack reason, they lack the thinking substance entirely. They cannot have "half" a mind.

  But you press me further: how then do we explain their cries when struck, or their flight from danger? You say I must explain how sensation could be absent when the behavior suggests it is present.

  Here, I invite you to consider the anatomy of the body as a machine. In my *Treatise on Man*, I have described how the nerves are like pipes, and the "animal spirits" like a subtle wind or flame that flows from the heart through the brain to the muscles. When the skin of a dog is struck, the nerve fibers pull on the interior of the brain—specifically upon the pineal gland, which I have identified as the seat where the body's motions are coordinated. This motion of the gland, caused by the impact, directs the animal spirits to the muscles of the legs to flee, or to the throat to emit a cry.

  This entire process is mechanical. It requires no inner witness. Consider a pipe organ: when air is forced through a pipe, it makes a sound. Does the organ feel the air? Consider a clock: when the gear strikes the hammer, it chimes. Does the clock feel the hour? The cry of the animal is no more a sign of inner suffering than the chiming of the clock is a sign of the clock's knowledge of time. It is a disposition of the organs.

  You argue that my language test proves only a lack of reason, not a lack of mind. But I maintain that language is the only certain external sign of an internal thought. I do not mean mere vocalization; parrots may utter words. I mean the capacity to arrange signs in novel ways to express *new* thoughts, independent of immediate passion. A human, even one born without voice or hearing, will invent signs to make their thoughts known. A beast never does.

  If a dog truly felt pain as a *thought*, it would possess the capacity to signify that pain apart from the immediate mechanical impulse. It would be able to communicate to us, "I suffered yesterday," or "I fear that I shall suffer tomorrow." But they are bound entirely to the present disposition of their organs. They act always in the same way to the same stimuli, governed by the arrangement of their parts, not by a free mind interpreting sensations.

  Therefore, Sir, the step from "no reason" to "no mind" is not a gap, but a necessity of metaphysics. Sensation is a mode of thought. Thought implies an immaterial soul. An immaterial soul implies reason and immortality. Since animals show no evidence of reason (via language) and cannot possess immortality without impugning God's justice, they cannot possess sensation. They are automata, admirable in their construction, but devoid of that inner light which we call consciousness.

  I trust this clarifies why I cannot concede the faculty of sensation to them without overturning the foundations of my philosophy. I await your reply.

  I remain, etc.
