          *   The Mind is a unity: It is not composed of parts. You can't have "half" a mind.
          *   Language as the Mark of Thought: Only a mind can use signs flexibly to express *thought*, not just impulse.
          *   Mechanism: All bodily functions (circulation, digestion, movement, even complex behavior) can be explained by the disposition of organs and animal spirits, without need for a sensitive soul.
          *   Theology/Philosophy of Religion: Immortality of the human soul vs. mortality of the "soul" in animals. If animals have sensations, they have an immortal soul (potentially), which raises theological problems (theodicy).
          *   Sensation is a mode of *thinking*, not just bodily reaction.

  3.  **Address the Specific Objection:**
      *   *The Objection:* Animals could have sensation (pain/hunger) without reason.
      *   *Descartes's Counter:* Sensation *is* a form of thought. In the *Meditations* and *Principles*, sensation is a mode of the mind. If an animal feels pain, it is conscious of pain. If it is conscious, it thinks. If it thinks, it is a mind.
      *   *The Unity of the Mind:* The human mind is indivisible. We don't have a "sensitive soul" and a "rational soul" (against the Scholastics/Aristotelians). We have one soul that does everything. If animals had sensation, they would have the same kind of soul as humans.
      *   *The Mechanical Explanation:* What looks like sensation (crying out when hit) is just mechanical reflex. Like a clock striking when a weight moves. No inner feeling is required to explain the behavior.
      *   *The Language Argument Refined:* It's not just about speaking. It's about the *flexibility* of response. Animals act according to the disposition of their organs. Humans act by reason. If animals had sensation, they would have some degree of reason to interpret that sensation, but they show none.
      *   *Theological Implication (Crucial for Descartes):* If animals feel pain, God is unjust for allowing them to suffer without hope of reward. If they don't feel, no injustice.

