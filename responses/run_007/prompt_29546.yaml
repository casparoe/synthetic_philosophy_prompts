      *Final Check Question:* Needs to be sharp. "Imagine a patch that removes the character's ability to suffer but keeps the animations identical. If you kick it now, is the wrongness diminished? If yes, you think the *character* matters. If no, you think *you* matter."

      *What not to settle:* Whether they *are* conscious. We can't know that. We are discussing the *criteria*.

  9.  **Final Polish:** Check tone. Needs to be facilitative, not lecturing. Ensure timing is realistic. (1 hour is very short, need to be strict on timekeeping).

