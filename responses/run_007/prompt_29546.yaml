answer: |-
  ### The Carrying Example: The Dog Companion
  **Pick:** The dog companion with pain animations.
  **Defense:** Choose the dog over the villager. The villager example smuggles in *cognitive* criteria (memory, identity, reciprocity) which distracts from the core metaphysical hurdle: *simulated suffering.* If your crowd can't agree on whether simulated pain matters, they will never agree on whether simulated memory matters. The dog isolates the variable of **sentience** without complicating it with **sapience**. It forces the "it's just code" objection immediately, which is exactly where you want the debate to start. The emotional resonance is a feature, not a bug; it raises the stakes so the "pixels" objection feels insufficient, forcing them to articulate *why* it's insufficient.

  ### The Hour Plan

  **00:00 – 00:10: The Setup & The Kick**
  *   **Action:** Do not define "moral patient." Describe the scenario.
  *   **Script:** "You're playing an RPG. You have a dog companion. It follows you, whines when hit, and limps when injured. There is a command menu. One option is 'Kick.' You select it. The dog yelps and cowers. No gameplay penalty. No reward. Just the animation."
  *   **Task:** Ask the room: "Is this action morally neutral, like moving a cursor? Or is it wrong?"
  *   **Goal:** Get a show of hands. Establish the conflict immediately.

  **00:10 – 00:25: Conditions for Wrongness (Generating the Distinction)**
  *   **Action:** Ask the "Why?"
  *   **Flow:** When someone says "It's wrong," ask: "What property of the dog makes it wrong?"
      *   If they say "Because it suffers," ask: "Can code suffer?" (This invites the **'Just Pixels'** objection).
      *   If they say "Because it makes me cruel," ask: "If no one ever knew you did it, would it still be wrong?"
  *   **The Pivot:** Use their answers to draw the prerequisite distinction on a whiteboard.
      *   **Column A:** Matters *to me* (I feel bad, I become cruel, I violate a norm).
      *   **Column B:** Matters *in itself* (The dog has an interest in not hurting, regardless of my feelings).
  *   **Instruction:** Tell them: "For the rest of the hour, if you argue the character matters, you must argue for Column B. If you argue it's only about the player's psychology, you are arguing for Column A."

  **00:25 – 00:40: Absorbing the Misconceptions**
  *   **Misconception 1: "They're just pixels/code." (The Ontological Objection)**
      *   *When:* Immediately after the setup.
      *   *Absorption:* Don't refute it. Accept it. "Okay, they are pixels. But they are pixels arranged to simulate a nervous system. If a robot dog looked and acted exactly like this, would it matter? If yes, then 'biology' isn the criteria, it's 'function.' If no, why is biology the magic ingredient?"
      *   *Goal:* Move the debate from *substrate* (flesh vs. code) to *capacity* (suffering vs. non-suffering).
  *   **Misconception 2: "If I feel bad, that shows they matter." (The Subjective Objection)**
      *   *When:* During the "Conditions" phase.
      *   *Absorption:* Use the Column A/B distinction. "Your sadness proves *you* are a moral agent. It doesn't prove *the dog* is a moral patient. A statue could be destroyed and you might feel sad. Does the statue matter in itself?"
      *   *Goal:* Force them to decouple the player's virtue from the character's status.
  *   **Misconception 3: "It's the same as a character in a novel." (The Medium Objection)**
      *   *When:* Late in this section.
      *   *Absorption:* "In a novel, the author kicks the dog. You witness it. In a game, *you* kick the dog. You are the cause. Does *agency* change the moral weight of the object?"
      *   *Goal:* Highlight that interactivity might change the *player's* burden, but ask if it changes the *character's* status.

  **00:40 – 00:50: Stress Testing the Criteria**
  *   **Action:** Introduce a variable change to the example.
  *   **Scenario:** "Patch 1.0: The dog has pain animations. Patch 2.0: The developers remove the pain script. The dog still limps and whines visually, but the 'suffering' flag is set to false. It registers no negative state."
  *   **Question:** "Is kicking the dog in Patch 2.0 less wrong than Patch 1.0?"
  *   **Goal:** This forces them to commit. If they say "Yes, less wrong," they believe the *internal state* (Point of View) matters. If they say "No, same wrongness," they believe the *external treatment* (or the player's virtue) is the only thing that matters.

  **00:50 – 00:55: The Final Check Question**
  *   **Ask this exactly:** "If we could prove definitively that the character has **no inner experience**—no pain, no fear, no point of view—but hurting them still made **you** a worse person... did the *character* have moral status, or did *you*?"
  *   **Success Criteria:** You want to hear them say, "The character didn't matter, the player did." If they say "The character mattered because they were treated badly," they have conflated *being the object of harm* with *being a subject of harm.*

  **00:55 – 01:00: What We Are Not Settling**
  *   **Openly Refuse:** Do not let the group decide if game characters *are* conscious. That is a metaphysical question you cannot solve in a cafe.
  *   **Statement:** "We are not deciding if code can feel. We are deciding what criteria we *require* for something to feel before we grant it status. Are we waiting for a soul? A nervous system? Or just the ability to say 'ouch'?"
  *   **Close:** End on the idea that how we treat simulations might train us for how we treat realities (the "spillover" argument), which sidesteps the character's status entirely but validates the discussion.

  ### Summary of Prerequisites
  You must establish the **Instrumental vs. Intrinsic** distinction (Column A vs. Column B) *before* asking if they matter. If you ask "Do they matter?" first, people will answer "Yes, because I care," which conflates the two. By asking "What makes it wrong?" first, you force them to reveal their criteria, which allows you to label it for them.

  ### Order of Misconceptions
  1.  **"Just Pixels"** (Ontological): Handle this first by shifting to functionalism.
  2.  **"I Feel Bad"** (Psychological): Handle this second by separating agent-virtue from patient-status.
  3.  **"Same as Novel"** (Medium): Handle this third by isolating the variable of player agency.

  ### What to Refuse to Settle
  Do not settle the **Hard Problem of Consciousness.** Do not let the group conclude "Code can't feel, therefore discussion over." Remind them that we assume other humans feel based on behavior, not direct access to their code. If behavior is enough for humans, ask why it isn't for the dog. Keep the epistemic uncertainty alive; the moral question exists *in* the uncertainty.
