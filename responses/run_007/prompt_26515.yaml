answer: |-
  You have identified a very real and well-recognized structural failure mode in decision theory and probability. While there isn't a single, universally standardized noun phrase like "The Modus Ponens of Paradoxes," there are established technical terms for the *normative violation* and the *probabilistic root* of the error.

  Here is the breakdown of the naming, the diagnosis, the distinctions, and the falsification criteria.

  ### 1. The Name of the Pattern

  There are two main ways to name this, depending on whether you are looking at it through the lens of **Decision Theory** or **Probability Theory**.

  **A. Decision Theory: Violation of Description Invariance**
  The most precise technical term for the failure mode you are describing is a **Violation of Description Invariance** (sometimes called **Frame Invariance** or **Extensionality**).
  *   **Definition:** A rational decision procedure should yield the same preference ordering regardless of how the options are described or labeled, provided the underlying outcomes and probabilities remain identical.
  *   **Why it fits:** In your pattern, the setup is symmetric (A and B are extensionally equivalent). If the reasoning yields "Choose A" but relabeling yields "Choose B," the reasoning procedure is dependent on the *description* (the label) rather than the *extension* (the actual outcome). This is considered a fatal flaw in rational choice axioms.

  **B. Probability Theory: Paradoxes of the Principle of Indifference**
  When the error stems from assigning probabilities based on symmetry (e.g., "I have no reason to think A is larger than B, so $P(A>B) = 0.5$"), this falls under **Paradoxes of the Principle of Indifference**.
  *   **Definition:** Errors that arise when applying the principle that one should assign equal probability to events when there is no evidence to distinguish them.
  *   **Why it fits:** This covers the Two-Envelope problem, Bertrand's Paradox, and many anthropic puzzles. The "symmetry" you notice is the trigger for invoking Indifference, and the contradiction arises because Indifference cannot be consistently applied across all possible parameterizations of the symmetry.

  **C. A Proposed Umbrella Term: Symmetry-Induced Incoherence**
  Since you are looking for a term that captures the *family resemblance* across decision theory, anthropics, and simulation arguments, I would propose **Symmetry-Induced Incoherence**.
  *   It captures the input (symmetry/indistinguishability).
  *   It captures the output (incoherence/contradiction/$A>B$ and $B>A$).
  *   It distinguishes it from incoherence caused by simple arithmetic errors or logical fallacies like equivocation.

  ### 2. The Diagnosis: What Is Actually Going Wrong?

  The standard diagnosis among decision theorists and probabilists is that these arguments implicitly rely on **Improper Priors** or **Illicit Conditionalization**.

  **The Technical Failure:**
  In the Two-Envelope problem, for example, the calculation that suggests switching is beneficial assumes you can treat the amount in your envelope as a fixed variable $x$ while simultaneously treating the other envelope as having an expected value of $1.25x$.
  *   **The Contradiction:** For this to hold for *any* $x$, the prior probability distribution over the possible amounts of money must be uniform over the range $(0, \infty)$.
  *   **The Error:** No such probability distribution exists (it cannot be normalized to sum to 1). This is an **Improper Prior**.
  *   **The Result:** When you use an improper prior, expected values become undefined or infinite. Once expectations are infinite, standard dominance reasoning breaks down. You can't say $E[A] > E[B]$ if both are undefined.

  **The Anthropics/Simulation Variation:**
  In anthropic cases (like the Doomsday Argument or Simulation Argument), the error is often **Reference Class Ambiguity**.
  *   The symmetry argument assumes you are a "random sample" from a specific reference class (e.g., "all observers").
  *   The contradiction arises because there are multiple valid ways to define the reference class, and the Principle of Indifference yields different results for each. The reasoning fails because it treats a self-locating belief ("I am me") as if it were an objective frequency ("This is a random observer") without a justified measure.

  **Summary Diagnosis:**
  The reasoning treats a **symmetry of ignorance** (I don't know which is which) as a **symmetry of probability** (they are equally likely to be high/low in a way that supports expectation calculations), often implicitly assuming a probability measure that does not exist.

  ### 3. Distinctions from Near-Miss Concepts

  It is important to distinguish this pattern from other forms of decision-theoretic failure.

  | Concept | Relation to Your Pattern | Key Difference |
  | :--- | :--- | :--- |
  | **Dutch Book** | **Consequence, not Cause.** | A Dutch Book is a *set of bets* that guarantees a loss. Your pattern *leads* to Dutch Bookability (if you act on the reasoning, you can be pumped for money), but the pattern itself is the *reasoning error* that makes you vulnerable. |
  | **Equivocation** | **Similar, but linguistic.** | Equivocation is using a word with two meanings. Here, the labels "A" and "B" keep their meaning; the error is in the *mathematical measure* applied to them, not the semantic definition. |
  | **Buridan's Ass** | **Opposite problem.** | Buridan's Ass is paralysis between two symmetric options. Your pattern is *spurious motivation* to choose one despite symmetry. |
  | **Newcomb's Problem** | **Different symmetry.** | Newcomb's involves a tension between causal and evidential decision theory. Your pattern arises even within a single decision theory (e.g., EDT) due to measure errors. |
  | **Inadmissible Strategy** | **The normative label.** | In game theory, a strategy is "inadmissible" if another strategy does at least as well in all states. "Always Switch" in Two-Envelope is inadmissible. This is the *status* of the choice, not the *name of the reasoning error*. |

  ### 4. What Would Change the Diagnosis? (Falsification Criteria)

  If we accept the standard diagnosis (that the error lies in Improper Priors or Violations of Description Invariance), here is what would force a revision of that account:

  **A. The "Finite Bounds" Counterexample**
  *   **Current Account:** The paradox relies on infinite ranges/improper priors. If you bound the amounts (e.g., between \$1 and \$1,000,000), the paradox dissolves because the probability distribution becomes proper, and the calculation no longer favors switching at the boundaries.
  *   **Falsification:** If someone constructs a version of this paradox with **strictly finite bounds**, **proper priors**, and **complete symmetry**, where the expected value calculation *still* strictly favors switching (or favors A over B), the "Improper Prior" diagnosis is false. (Note: No such example is currently known; finite bounds usually resolve the math).

  **B. The "Rational Label Dependence" Argument**
  *   **Current Account:** Rationality requires Description Invariance.
  *   **Falsification:** If a decision theory is demonstrated where **Label Dependence is rational**. For example, in some game-theoretic focal point scenarios, agents *should* coordinate on "The Left One" simply because it is labeled "Left." If it can be shown that in *non-cooperative* single-agent decision problems, label dependence is sometimes epistemically justified, then "Violation of Description Invariance" is not a universal failure mode.

  **C. The "Measure-Free" Resolution**
  *   **Current Account:** The error is probabilistic (bad priors).
  *   **Falsification:** If a resolution is found that retains the improper prior but fixes the logic via a different mechanism (e.g., a new formulation of Expected Utility Theory that handles infinite values without contradiction). If the math can be made to work *with* the symmetry intact and the infinite prior, then the diagnosis that "the prior is the problem" is incorrect; the problem would instead be the definition of Expectation itself.

  ### Summary

  *   **Best Technical Name:** **Violation of Description Invariance** (Decision Theory) or **Paradox of the Principle of Indifference** (Probability).
  *   **Best Descriptive Name:** **Symmetry-Induced Incoherence**.
  *   **Diagnosis:** The reasoning implicitly assumes an **Improper Prior** (a probability distribution that cannot exist) or commits **Illicit Conditionalization** (treating symmetric ignorance as informative evidence).
  *   **Boundary:** It is distinct from a Dutch Book (which is the exploitability resulting from the error) and distinct from Equivocation (which is semantic).
  *   **Falsification:** A finite, proper-prior version of the paradox that still yields contradictory dominance would invalidate the standard "Improper Prior" diagnosis.

  This pattern is essentially the shadow cast by trying to apply finite probability calculus to problems with hidden infinities or undefined measures. The symmetry is the clue that the measure is undefined, because if the measure *were* defined, the symmetry would force $E[A] = E[B]$, preventing the contradiction.
