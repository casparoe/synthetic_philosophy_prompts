prompt: |-
  I'm a machine learning engineer — I spend my days with proper scoring rules, calibration, expected loss, and Bayesian updating — but I've never actually read the philosophy side. I keep hearing about this thing called accuracy-first epistemology, or epistemic utility theory, where people argue that the fundamental epistemic value is accuracy, that credences should be graded by how inaccurate they are (using something like the Brier score or log score), and that this yields arguments for probabilism (your credences should obey the probability axioms because otherwise some other credence function is strictly more accurate in every possible world) and for conditionalization (Bayes' rule is the update rule that maximizes expected accuracy). From where I sit this all sounds like things I already know under different names — strict propriety, dominance, posterior updates — but I can't tell whether that's because it is the same thing or because I'm flattening it.

  Please restate the accuracy-first program in the vocabulary I actually use, as faithfully as you can: loss functions, strictly proper scoring rules, expected loss, dominance/admissibility, calibration, and Bayes' rule as posterior computation. Be honest about where the translation is clean, where you have to fudge, and where a philosophical claim has no counterpart at all in my vocabulary. In particular I want to know: does the claim that accuracy is the fundamental epistemic value have any expression in ML terms, or does ML treat the choice of scoring rule as task-relative in a way that leaves no room for that claim? Does the argument for conditionalization say anything beyond "if you've already committed to a prior and likelihood, Bayes' rule gives the posterior"? Is the fact that strictly proper scoring rules elicit coherent predictions a normative fact about rationality, or just a fact about which predictors are admissible under a fixed loss? And I can't tell whether it matters that Brier and log score both support the probabilism argument but disagree about which coherent credences are more accurate — in ML we'd just say you pick the loss for your task, but the philosophers seem to want accuracy to be the one fundamental value. Then give me the residue report: what didnt survive the translation, and whether the stuff that didn't survive is a defect in my vocabulary or a sign that the philosophers' claims were doing less work than they look like they're doing.

  End with a single sentence beginning "Bottom line:" summarizing what the residue says about whether accuracy-first epistemology is more or less substantive than the ML vocabulary makes it appear.
