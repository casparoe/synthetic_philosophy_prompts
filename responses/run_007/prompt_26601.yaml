prompt: |-
  I'm TAing an intro course on classical Chinese philosophy this term, and we just got to the Mencius/Xunzi debate about human nature. I'm grading a batch of short essays, and one of the ones I recieved keeps making me go back and forth, so I'd like a careful second opinion before I commit to a grade. The question the students had was: explain the main disagreement between Mencius and Xunzi about human nature; clarify what each means by xing, the term usually rendered as nature; say what each thinks it takes for a person to become good; and note at least one way in which their positions are less opposed than the usual slogans suggest.

  Here is what the student wrote. The basic contrast is that Mencius thinks human nature is good and Xunzi thinks it is bad. Mencius argues that all people are born with the virtues already inside them, and his evidence is that anyone who sees a child about to fall into a well will spontaneously feel alarm and pity, which shows that benevolence is present in us from birth and only needs to be allowed to grow. Xunzi holds the opposite: people are born selfish and unruly, and if they follow their inborn desires they will fight and create chaos, so goodness has to be imposed on them from outside through ritual, law, and punishment. The two are therefore diametrically opposed: Mencius is an optimist who thinks virtue grows naturally, while Xunzi is a pessimist who thinks people can only be made good by force.

  Could you grade this for me (a letter grade, or whatever scheme you think fits) and then walk me through the justification point by point: what it earns credit for, what it gets wrong, and what it leaves out? When you flag the errors, please seperate the things that are straightforwardly wrong from points that are genuinely contested among specialists, and don't present a contested reading as if it were the consensus. And write the whole thing as continuous prose, like an email: no headings, bullet points, bold text, or tables.
