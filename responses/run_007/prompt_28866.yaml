      *   **Side B (Organism/Continuity View / Engineer):** Self = Specific Biological/Computational Instance. Identity is binary (or tied to specific causal history). Survival = Continuity of the specific substrate or causal chain. A copy is a copy, not the original.

  3.  **Drafting - Section 1: Shared Claims (Common Ground):**
