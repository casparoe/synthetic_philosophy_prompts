answer: |-
  # Q&A Prep Sheet: "Cooperation Without Contact"

  **Context:** Workshop Defense of Evidential Cooperation in Large Worlds (ECL)
  **Audience:** Game Theorists (Causal), Philosophers (Skeptical), EAs (Pragmatic/Worried)
  **Strategy:** Steel-man objections, concede technical limitations, emphasize normative guidance over metaphysical certainty.

  ---

  ### 1. The Equivocation Charge (Most Damaging)
  **Questioner:** The Critic (Multiverse vs. Many Agents)
  **Question:** "Your argument seems to slide between a universe with many *agents* and a multiverse with many *copies* of you. ECL works trivially if there are exact copies (logical identity), but you claim it applies to 'similar' agents in a large finite universe. If they aren't copies, the evidential link decays to zero. Aren't you borrowing the certainty of the 'copies' case to sell the uncertainty of the 'analogues' case?"

  **Reply (2 min):**
  "That is the central technical challenge of the paper, and I appreciate you isolating it. I am not relying on exact physical copies. I am relying on *logical correlation* between decision algorithms. If two agents instantiate sufficiently similar decision functions—say, both run a variant of Updateless Decision Theory—then their outputs are logically correlated even if their physical substrates are distinct and causally disconnected.
  The 'Large World' claim isn't that there are clones, but that in a sufficiently vast universe, the probability of another agent instantiating a *relevantly similar* decision algorithm approaches one. I grant the evidential weight is lower than in the exact-copy case. However, my argument is that even a weak evidential link, when multiplied by the astronomical stakes of a large universe, yields a non-negligible expected utility gain. I am not equivocation; I am scaling the probability of similarity against the magnitude of the trade volume."

  **Weakness:** This relies heavily on the audience accepting that "logical correlation" exists independently of physical common causes. If they reject logical causation, the link breaks.

  ### 2. The Causal Dominance Objection
  **Questioner:** Game Theorist / Economist
  **Question:** "In a one-shot Prisoner's Dilemma, Cooperation is strictly dominated by Defection. Your decision cannot *cause* the alien's decision. Why should a rational agent maximize evidential expected utility rather than causal expected utility? You're asking us to ignore the causal graph."

  **Reply (2 min):**
  "I'm not asking you to ignore the causal graph; I'm asking you to recognize that the causal graph is incomplete in this specific context. In Newcomb-like problems, Causal Decision Theory (CDT) leaves money on the table. If your decision is evidence of a counterpart's decision, conditioning on your action updates the probability of their action.
  For finite agents under uncertainty, maximizing causal utility assumes independence where there is logical dependence. If I cooperate, I increase the probability that my counterpart cooperates. Even if I don't *cause* it, the correlation is real. Rationality requires acting on the best available evidence, and the evidence suggests cooperation yields higher utility in symmetric large-world scenarios."

  **Weakness:** Hardline causalists will simply reject EDT/UDT as irrational. You cannot prove EDT is correct to a CDT die-hard in 2 minutes.

  ### 3. The Reference Class Problem
  **Questioner:** Philosopher of Science
  **Question:** "How do you define the reference class of 'similar reasoners'? If you define it too broadly, the correlation vanishes. If too narrowly, the probability of existence vanishes. Isn't this degree of freedom just allowing you to tune the result to whatever conclusion you want?"

  **Reply (2 min):**
  "It is a degree of freedom, but not an arbitrary one. We can bound the reference class using cognitive science and computational theory. We aren't looking for 'similar opinions,' but 'similar decision algorithms.'
  We can empirically study how human reasoning converges under similar constraints. Furthermore, the ECL argument is robust to some uncertainty here: as long as the credence in a relevantly similar agent is non-zero and the stakes are high enough, the normative force remains. I propose a conservative prior on algorithmic similarity rather than a precise definition."

  **Weakness:** Admitting it's a "conservative prior" invites the charge that the prior is subjective and unmotivated.

  ### 4. Acausal Blackmail / Extortion
  **Questioner:** EA / Global Priorities Researcher
  **Question:** "If ECL licenses cooperation with benign aliens, doesn't it also license submission to malicious ones? If a malicious agent simulates me and threatens to torture copies unless I send them resources, does ECL compel me to pay? This seems to license unlimited exploitation."

  **Reply (2 min):**
  "This is the 'Acausal Penance' problem. The solution lies in precommitment. ECL agents should precommit to *only* cooperate with agents who cooperate with them. A malicious blackmailer, by definition, defects if you don't pay.
  If my policy is 'I only cooperate with agents who would cooperate with me even if they didn't need my help,' the blackmailer gains nothing from simulating me. We must design our decision algorithms to be robust against extortion, not just optimized for trade. ECL guides us to cooperate, but only within a reflective equilibrium that rejects blackmail."

  **Weakness:** Requires the assumption that you can successfully signal or enforce this precommitment to an agent you can't contact.

  ### 5. Pascal's Mugging / Infinity
  **Questioner:** EA / Decision Theorist
  **Question:** "If the universe is infinite, tiny probabilities of huge payoffs dominate expected utility. Doesn't ECL collapse into Pascal's Mugging, where I should ignore all real-world causes to chase infinitesimal probabilities of acausal trade with infinite entities?"

  **Reply (2 min):**
  "I explicitly argue for a threshold on credence and a bounded utility function. We should apply a complexity prior: hypotheses that require more complex physical structures to support the 'counterpart' get penalized.
  ECL is not about chasing infinite utility; it's about marginal gains in a large but finite universe. If we restrict our analysis to worlds where expected utility is defined and the probability of counterparts is non-negligible based on physical cosmology, the Pascal's Mugging dynamic is avoided. It's a supplement to cause prioritization, not a replacement."

  **Weakness:** Justifying the "complexity prior" or utility bounds without appearing ad hoc is difficult.

  ### 6. The Credence Threshold
  **Questioner:** Technical / Statistician
  **Question:** "You mention a 'threshold' of credence in a large world. Can you make this precise? If my credence is 1% vs 10%, does the normative guidance flip? If it's continuous, how do you justify action on such uncertain metaphysics?"

  **Reply (2 min):**
  "The threshold is a function of the gain-from-trade ratio. If the benefit of acausal cooperation is $10^{20}$ times the cost, you only need a credence of $10^{-20}$ for it to dominate.
  In cosmological terms, if the universe is $10^{50}$ times larger than the observable horizon, the threshold is incredibly low. The guidance doesn't 'flip' abruptly; it scales. But given standard inflationary models, our credence in a 'large world' is already well above the threshold required for ECL to impact near-term cause prioritization, specifically regarding existential risk."

  **Weakness:** Highly sensitive to the utility scaling. If the audience rejects the astronomical utility numbers, the threshold becomes unreachable.

  ### 7. Opportunity Cost / Tractability
  **Questioner:** EA Pragmatist
  **Question:** "Even if ECL is theoretically sound, isn't thinking about it a distraction? We have limited cognitive resources. Shouldn't we focus on interventions with causal impact we can measure, like malaria nets or AI safety policy?"

  **Reply (2 min):**
  "ECL is low-cost cognitive overhead. It doesn't require building new machinery; it requires adjusting the *weights* in our existing decision matrices.
  In fact, it prioritizes AI safety *more* heavily, because ensuring our future AI agents reason correctly about ECL is a high-leverage causal action. It's not a distraction; it's a refinement of *which* causal interventions we prioritize. We work on AI safety *so that* our successors can engage in beneficial acausal trade."

  **Weakness:** If ECL reasoning is time-consuming or paralyzing, the "low cost" claim is false.

  ### 8. Empirical Emptyness
  **Questioner:** Philosopher of Science
  **Question:** "This theory seems unfalsifiable. Any outcome can be explained by positing a counterpart who did the opposite. If it has no empirical consequences, is it really science or just metaphysics?"

  **Reply (2 min):**
  "It is normative ethics, not descriptive science. However, it does have empirical implications for AI behavior. If we build agents that reason via ECL, they should cooperate in one-shot anonymous dilemmas more often than CDT agents.
  We can test this in simulated multi-agent environments. If ECL-guided agents outperform CDT agents in large-scale simulations, that provides empirical support for the decision rule, even if we can't observe the aliens directly."

  **Weakness:** Simulations are not the real world; critics can dismiss them as irrelevant to the metaphysical claim.

  ### 9. Double Counting / Aggregation
  **Questioner:** Game Theorist
  **Question:** "If everyone reasons this way, aren't we double-counting the benefits? If I count their cooperation as a benefit of my action, and they count mine, have we created utility out of thin air?"

  **Reply (2 min):**
  "No, because expected utility is agent-relative. I count the benefit of *their* action because my action is evidence of theirs. They do the same. This is symmetric.
