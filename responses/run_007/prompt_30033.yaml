  Drawing on your background, I have treated your seven cases as a dataset and attempted to fit a model that minimizes the residuals between the principle's predictions and your intuitions.

  The tension in your data lies in the "flip": in Case 1 (Ex-Partner), misleading is *better* than lying. In Case 5 (Company), misleading is *worse* than lying. A simple rule like "lying is always worse" or "truth-telling is always better" fails to fit.

  The principle that best accommodates your verdicts distinguishes between **protective deception** (where you keep your hands clean) and **corruptive deception** (where you poison the well).

  ### The Principle: Non-Exploitative Epistemic Stewardship

  **Core Statement:** The moral value of a deceptive act is determined by the listener's entitlement to the truth and the degree to which the method of deception corrupts the shared conventions or tools required for trust.

  **Clause 1 (Entitlement and Integrity):** When a listener is **not entitled** to the truth (e.g., due to malicious intent or low-stakes politeness), the speaker should minimize factual falsehoods to preserve their own integrity.
  *   *Verdict:* Misleading is preferable to Lying.
  *   *Motivating Cases:* **Case 1** (Ex-partner has no right to her location; you keep your statement factually true) and **Case 2** (Neighbor has no right to your harsh opinion; you keep your statement factually true).

  **Clause 2 (Private Convention):** When a listener **is entitled** to the truth in a private or professional relationship, a direct lie is generally worse than misleading, *unless* the misleading statement exploits a specific conversational convention to guarantee a false belief the speaker knows the listener relies on.
  *   *Verdict:* Lying is usually worse, but "conventional misleading" is also impermissible.
  *   *Motivating Cases:* **Case 3** (The convention "I can write a letter" implies "I can write a *strong* letter." Exploiting this is not fine, but a direct lie is perhaps worse). **Case 6** (A direct lie about status is bad, but doesn't exploit a deep convention as much as Case 3).

  **Clause 3 (Public/Methodological Corruption):** When a deception exploits a public standard, scientific method, or legal technicality to evade accountability, misleading is **worse** than a direct lie. This is because it degrades the tool (language, science, law) that the public relies on to discern truth.
  *   *Verdict:* Misleading is worse than Lying.
  *   *Motivating Cases:* **Case 5** (Exploiting the technical definition of "proof" corrupts public discourse) and **Case 7** (Exploiting the visual convention of graphs corrupts scientific record).

  **Clause 4 (Relational Agency):** In intimate relationships of care, the primary moral duty is to the listener's agency. Deception that delays necessary truth without consent violates this agency regardless of truth-value.
  *   *Verdict:* Lying and Misleading are equally problematic.
  *   *Motivating Cases:* **Case 4** (Both options deny your sister the chance to prepare for the bad news).

