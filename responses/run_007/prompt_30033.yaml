  ### Application to New Cases

  **1. The Graph Case (Case 7)**
  *   **Principle Verdict:** This falls under **Clause 3**.
  *   **Analysis:** A graph relies on the shared convention that visual area/height corresponds proportionally to magnitude. By truncating the axis, the authors exploit this convention to induce a false belief about the effect size while maintaining technical truth ("the data points are real").
  *   **Conclusion:** The principle agrees with your intuition: this is **as bad as fabricating data**. It corrupts the methodological tool (the graph) that the scientific community uses to evaluate truth. It forces the reader to distrust the tool itself, not just the author.

  **2. The Retirement Party Case**
  *   **Scenario:** A colleague asks if you are coming. You say, "I'll be out of town that weekend" (True, but you booked the trip *after* hearing about the party to avoid it).
  *   **Principle Verdict:** This falls under **Clause 2 (Private Convention)**.
  *   **Analysis:** Your colleague is entitled to a straightforward answer regarding your social commitment. The phrase "I'll be out of town" carries a conversational implicature: "I would come if I could, but an external conflict prevents me." By booking the trip *to create* the conflict, you are exploiting the convention of the "polite excuse" to avoid the relational work of a direct refusal ("I'd prefer not to come").
  *   **Conclusion:** The principle suggests this is **worse than saying "No, I won't be there."** While the statement is factually true, it is a manipulative use of a social convention to mislead the colleague about your willingness to attend. It protects you from awkwardness at the cost of their ability to accurately model your relationship.

