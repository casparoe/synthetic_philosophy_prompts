answer: |-
  You have put your finger on one of the most significant, persistent, and notoriously slippery issues in cognitive science and philosophy. The short answer is: **Yes, there is a name.** It is widely known as **The Frame Problem**.

  However, your intuition that the literature treats it as "its own thing" in different domains is also correct. The "carving" of this problem is a matter of active debate. While the structural skeleton is identical across the fields you mentioned, the *flesh* on the bones differs enough that some philosophers argue they are distinct problems that merely share a family resemblance, while others (like Daniel Dennett) argue they are all manifestations of a single, deep issue about relevance and context.

  Here is how the joints are typically carved, mapping your three observations onto the philosophical landscape.

  ### 1. The Label: The Frame Problem
  The term was coined by John McCarthy and Patrick Hayes in 1969 in the context of AI planning (your first example). They were trying to formalize how a robot reasons about action using logic.

  In formal logic, if you state an action (e.g., `Move(Beaker, Shelf A, Shelf B)`), you must explicitly state the effects (e.g., `Position(Beaker) = Shelf B`). The problem arises because you also have to explicitly state what *doesn't* change (e.g., `Color(Walls) = White`, `Mass(Beaker) = m`). Since the list of non-changes is effectively infinite, a brute-force logical system grinds to a halt.

  ### 2. The Carving: Three Distinct "Joints"
  Philosophers and AI researchers generally distinguish between three variants of the Frame Problem. Your three examples map almost perfectly onto these three distinctions.

  #### A. The Metaphysical/Semantic Frame Problem (AI Planning)
  *   **Your Example:** The robot moving the beaker.
  *   **The Question:** How do we formally represent the **inertia** of the world? (i.e., The assumption that things stay the same unless acted upon.)
  *   **The Status:** In classical AI, this is largely considered **solved**. Techniques like "successor state axioms" (Reiter, 1991) or "circumscription" (McCarthy) allow systems to assume non-change by default without enumerating it.
  *   **The Joint:** This is a problem of *logic and representation*. It asks: "What is the correct formalism to describe a changing world efficiently?"

  #### B. The Epistemological Frame Problem (Belief Revision)
  *   **Your Example:** Updating beliefs without cascading changes.
  *   **The Question:** How does an agent determine which of its existing beliefs are **relevant** to the new information, and which can be ignored?
  *   **The Status:** This is considered **unsolved** and is central to philosophy of mind.
  *   **The Joint:** This is a problem of *relevance*. As Jerry Fodor pointed out in *The Modularity of Mind*, human belief systems are "isotropic"—any belief can potentially be relevant to any other belief (e.g., learning about beakers might change your belief about your colleague if you suspect they tampered with it). A competent adult ignores the infinite irrelevant connections instantly. We don't just know what stays the same; we know what *matters*.
  *   **Key Text:** Daniel Dennett's essay *"Cognitive Wheels: The Frame Problem of AI"* (1984) is the classic bridge here. He argues the AI version is just a toy version of the real philosophical problem: how does a mind bound by finite resources manage an infinite web of potential implications?

  #### C. The *Ceteris Paribus* Problem (Scientific Modeling)
  *   **Your Example:** Isolating causal factors in a model.
  *   **The Question:** How do we justify holding background conditions constant when deriving causal laws?
  *   **The Status:** Treated in philosophy of science, often under the label of **idealization** or **ceteris paribus clauses**.
  *   **The Joint:** This is a problem of *causal isolation*. While structurally identical to the Frame Problem (assuming everything else stays the same), the focus here is on *truth conditions*. In AI, we want efficiency; in science, we want valid generalizations.
  *   **Connection:** Nancy Cartwright and others have argued that scientific laws are only true *ceteris paribus* (all else being equal), but since "all else" is never truly equal in the real world, this creates a tension similar to the Frame Problem: how do we define the boundary of the system we are modeling?

  ### 3. Is It One Problem or Several?
  This is the crux of your question. Where are the real joints?

  **The Argument for Unity (The Dennett/Fodor View):**
  Proponents argue these are all the same problem because they stem from the **combinatorial explosion of relevance**. Whether you are a robot, a human, or a scientist, you are embedded in a causal net where everything is potentially connected to everything else. The core difficulty is not representing change, but **filtering context**. If this view holds, the Frame Problem is the fundamental barrier to creating General AI (AGI). We can solve the logic (Variant A), but we cannot solve the relevance (Variant B).

  **The Argument for Distinction (The AI Engineer View):**
  Many AI researchers argue the philosophical version is a "pseudoproblem." They claim that once you solve the Semantic Frame Problem (Variant A) with the right logic, the rest is just engineering optimization. They argue that "relevance" isn't a mystical philosophical hurdle but a matter of search heuristics and attention mechanisms (which modern Deep Learning attempts to address). From this view, the Belief Revision and Scientific Modeling issues are distinct applications, not the same core bug.

  ### 4. Summary of the "Joints"
  If you are looking for the precise terminology to categorize what you've seen, here is the taxonomy:

  1.  **Frame Problem (Narrow):** The logical representation of change and inertia. (AI Planning).
  2.  **Frame Problem (Broad):** The problem of relevance and contextual boundlessness. (Philosophy of Mind / Belief Revision).
  3.  **Ramification Problem:** A close cousin in AI/Belief Revision. If I move the beaker, the *position* changes (direct effect), but the *shadow* of the beaker also moves (indirect effect). How does the system infer the indirect effects without enumerating them?
  4.  **Qualification Problem:** Another cousin. To move the beaker, I must assume it's not glued down, the gravity is normal, I'm not hallucinating, etc. How do we list the infinite preconditions for an action?
  5.  **Ceteris Paribus Problem:** The philosophy of science equivalent regarding causal isolation.

  ### Conclusion
  You have correctly identified a structural isomorphism across three fields. The umbrella term is **The Frame Problem**, but the "carving" suggests it is a **cluster concept**.

  *   In **AI**, it is a technical hurdle of *efficiency and representation*.
  *   In **Philosophy of Mind**, it is an existential hurdle of *relevance and cognition*.
  *   In **Philosophy of Science**, it is a methodological hurdle of *isolation and idealization*.

  Most contemporary philosophers of cognitive science side with your intuition: these are not merely similar problems; they are different facets of the same underlying constraint on finite systems operating in infinite causal environments. The fact that humans solve it effortlessly suggests our brains use architectural tricks (modularity, heuristics, embodied cognition) that classical logic-based models lack.

  If you want to pursue the "carving" further, I recommend starting with **Daniel Dennett's *"Cognitive Wheels"*** for the broad philosophical view, and **Murray Shanahan's *"Solving the Frame Problem (1997)"*** for the technical AI perspective. They will show you exactly where the joint between the "logic" version and the "mind" version lies.
