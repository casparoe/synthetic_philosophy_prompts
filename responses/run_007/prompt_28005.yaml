answer: |-
  You have correctly identified that this debate is frozen, and your intuition that it isn't waiting on a neuroscience breakthrough is spot on. This is not a factual disagreement, nor is it purely a semantic one; it is a **foundational disagreement over levels of abstraction and the purpose of explanation.**

  Here is the diagnosis of why this stalemate exists and whether it can move.

  ### 1. It is not a factual disagreement
  If this were a factual dispute, we would be waiting for a specific discovery—perhaps a neuron that fires without cause, or a quantum effect in the microtubules. But both sides generally accept physicalism. The "illusionists" (like Sam Harris or Galen Strawson) and the "compatibilists" (like Daniel Dennett or Harry Frankfurt) agree on how the brain works: inputs lead to processing which leads to outputs. They agree that the Sphex wasp is mechanistic. The disagreement is not about *what is happening*, but about **what description of what is happening counts as "freedom."**

  The illusionist looks at the human brain and sees the same causal chain as the wasp, just longer and more tangled. They argue that if you trace the chain back far enough, "you" didn't start it.
  The compatibilist looks at the human brain and sees a "reflection loop" that the wasp lacks. They argue that the ability to simulate futures, recognize patterns, and veto impulses *is* the freedom that matters, regardless of the underlying causality.

  ### 2. It is a "Level of Abstraction" Clash
  Think of the difference between a computer running a rigid script and a computer running a learning algorithm.
  *   **The Illusionist** is like a hardware engineer. They say, "At the level of electrons and logic gates, both computers are deterministic. Neither is 'free.' Calling the second one 'free' is magic thinking."
  *   **The Compatibilist** is like a software developer. They say, "At the level of the user interface, one program crashes when you move an icon and the other adapts. That functional difference is real, and it's the only one that matters for calling it 'smart' or 'free.'"

  The debate is frozen because one side refuses to acknowledge the higher level as "real" (reductionism), while the other side insists the higher level is the only place the word "freedom" has any coherent meaning (emergentism/pragmatism). They are talking past each other because they are standing on different floors of the same building.

  ### 3. It is an Axiomatic Disagreement about "Enough"
  At the bedrock, this is a clash of intuitions about what constitutes a satisfying explanation.
  *   **Side A (Illusionist):** Requires **Ultimate Origination.** To be truly free, you must be the *uncaused cause* of your actions. If your desires come from genetics or environment, you didn't *really* choose them. Since nothing can be an uncaused cause, free will is impossible.
  *   **Side B (Compatibilist):** Requires **Responsiveness to Reasons.** To be free, you must be able to act according to your desires without external coercion, and you must be able to change those desires if presented with new reasons. Since humans can do this and wasps can't, free will is real.

  Neither side can argue the other out of their axiom because the axioms are not provable; they are standards of satisfaction. One side feels cheated unless they are the "prime mover" of the universe; the other feels that "prime mover" is a incoherent concept that doesn't apply to anything, so demanding it makes the word "freedom" useless.

  ### Can this be moved?
  It cannot be moved by science, but it can be moved by **pragmatics.**

  The debate only remains frozen as long as both sides treat "free will" as a metaphysical substance we are trying to detect. The deadlock breaks when you ask: **"What work do we want the concept of free will to do?"**

  If the purpose of "free will" is to justify eternal reward or punishment in a cosmic sense, the Illusionists win; we don't have that. If the purpose of "free will" is to distinguish between a murderer and a sleepwalker for the sake of social safety and rehabilitation, the Compatibilists win; the distinction is vital and real.

  Dennett's argument in *Elbow Room* is essentially that the Illusionists are demanding a kind of freedom (magic) that nobody actually needs, while ignoring the kind of freedom (evitability and choice) that we do need. The debate moves only when participants admit they are arguing about **moral vocabulary**, not **physics.**

  ### Summary
  This is a foundational conflict over explanatory levels rather than empirical facts, resolvable only by shifting the debate from metaphysical truth to the pragmatic utility of the concept.
