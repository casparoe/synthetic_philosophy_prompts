prompt: |-
  I have been working through the Frege–Geach problem and have arrived at an argument that seems to me to prove too much — not just that expressivism faces a technical difficulty, but that a whole family of use-based semantic theories is ruled out in one stroke. I cannot tell whether I have made a subtle mistake, or whether the argument is sound and the landscape is simply bleaker than I thought. I would like a diagnosis.

  Here is the argument:

  (1) According to expressivism, the meaning of an atomic moral sentence — for example, "lying is wrong" — is constituted by the non-cognitive attitude it conventionally expresses (say, disapproval of lying).

  (2) Natural languages are compositional: the meaning of a complex expression is a function of the meanings of its constituents and their mode of syntactic combination.

  (3) From (1) and (2), the meaning of a complex moral sentence, such as the conditional "If lying is wrong, then getting one's brother to lie is wrong," must be a function of the attitudes expressed by its constituent moral clauses together with the semantics of the conditional connective.

  (4) But a moral clause embedded in a conditional does not express the attitude it expresses when it occurs unembedded. A speaker who sincerely utters the conditional above need not disapprove of lying — she may be reasoning hypothetically from a premise she rejects. The embedded occurrence of "lying is wrong" is not the vehicle of any attitude of disapproval.

  (5) Therefore, the embedded occurrence of "lying is wrong" does not have the meaning attributed to it by (1). Its meaning, in that context, cannot be the attitude it fails to express.

  (6) Consequently, the conditional's meaning is not determined by the meanings of its parts in the way compositionality requires. Expressivism is incompatible with the compositionality of moral language.

  (7) The argument seems to generalise. Consider any semantic theory that ties the meaning of a sentence constitutively to the speech act it is used to perform — for instance, views on which the meaning of an indicative sentence is the assertion it standardly makes, or views on which meaning is exhausted by the inferential role a sentence plays when asserted. Each such theory faces the same problem when the sentence appears embedded: the speech act is not performed, so the posited meaning-bearer is absent, yet the sentence makes the same compositional contribution. If the argument works against expressivism, it works against any force-based or use-based semantics.

  (8) But that conclusion is too strong. Inferentialism, dynamic semantics, and various forms of pragmatism are live research programmes. The embedding problem is standardly treated as a special challenge for expressivism, not as a refutation of every theory that ties meaning to use. So the argument must go wrong somewhere.

  Where does it go wrong? Which premise should be rejected, and what does rejecting it cost the expressivist? And does the argument genuinely generalise in the way step (7) suggests, or does the generalisation rest on a confusion that is absent from the narrower argument against expressivism?
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is working on the Frege-Geach problem (embedding problem for non-cognitivism/expressivism).
      *   **The Argument:** They present an 8-step argument claiming that expressivism fails compositionality because embedded clauses don't express the attitudes that constitute their meaning. They further claim this argument generalizes to *all* use-based/force-based semantic theories (inferentialism, etc.), which seems "too strong" given that those fields are active.
      *   **The Task:** Diagnose the argument. Identify where it goes wrong (if it does). Determine which premise to reject. Assess the cost of rejection. Evaluate the generalization claim (step 7).

  2.  **Deconstruct the Argument:**
      *   (1) Expressivist core thesis: Meaning = Expressed Attitude (for atomic sentences).
      *   (2) Compositionality: Meaning of whole = function of meaning of parts.
      *   (3) Interim conclusion: Meaning of conditional = function of attitudes of parts + conditional semantics.
      *   (4) Observation: Embedded clauses don't express the attitude (no actual disapproval in "If lying is wrong...").
      *   (5) Inference: Therefore, embedded meaning $\neq$ atomic meaning (since attitude is absent).
      *   (6) Conclusion: Expressivism violates compositionality.
      *   (7) Generalization: This applies to *any* theory tying meaning to speech act/force/use.
      *   (8) Reductio ad absurdum (pragmatic): Since inferentialism/etc. survive, the argument must be flawed.

  3.  **Evaluate the Core Logic (Steps 1-6):**
      *   This is the classic Frege-Geach objection.
      *   *Premise (1)* is the standard definition of simple expressivism.
      *   *Premise (2)* is widely accepted (though some might fight it, it's not the weak point here).
      *   *Premise (4)* is the crucial observation. Embedded sentences don't perform the main speech act.
      *   *Step (5)* is the inference that creates the problem. It assumes that if the *act* isn't performed, the *meaning* (defined by the act) isn't present.
      *   *Step (6)* follows if (5) is true.

      *Diagnosis:* The standard expressivist response targets the move from (4) to (5). Expressivists (like Blackburn, Gibbard) argue that the meaning *is* preserved, but the *expression of attitude* is context-dependent. They need a logic of attitudes. The argument assumes a naive version of expressivism where meaning = *actual* expression of attitude in every context. Sophisticated expressivism says meaning = *type* of attitude state, which can be entertained hypothetically.

  4.  **Evaluate the Generalization (Step 7):**
      *   The user claims this kills *all* use-based theories (inferentialism, speech act theory, dynamic semantics).
      *   *Is this true?*
      *   **Inferentialism (Brandom):** Meaning is inferential role. Does "If P, then Q" require asserting P? No. It requires acknowledging the *inferential connection*. The role is preserved even if the assertion isn't made. Brandom distinguishes between *undertaking* a commitment and *attributing* it, or between assertion and conditional acceptance.
      *   **Dynamic Semantics:** Meaning is context change potential (CCP). "If P, then Q" updates the context differently than "P". But the CCP of "P" inside the conditional is the *same* CCP as "P" alone, just applied to a hypothetical context. Compositionality holds.
      *   **Speech Act Theory:** Distinguishes between sentence meaning (propositional content) and illocutionary force. Embedding usually suspends force but keeps content.
      *   **The Confusion:** The user's argument conflates *performing* the speech act with the *potential* or *content* of the speech act. Use-based theories generally define meaning in terms of *conditions* for use or *roles* in reasoning, not necessarily the *actual performance* in every token utterance.
      *   *Key Distinction:* **Force vs. Content.** Most use-based theories allow that embedding suspends *force* (assertion, expression of attitude) while preserving *content* (the thing that has the force). Expressivism tries to reduce content to force/attitude, which makes the problem harder for them than for inferentialists who distinguish commitment-types.

  5.  **Identify the Flaw:**
      *   The flaw lies in **Premise (5)** and the interpretation of **Premise (1)**.
      *   Premise (1) is too crude. Sophisticated expressivism doesn't say "Meaning = Actual Expression." It says "Meaning = Type of Mental State." One can be in a state of "disapproving-of-lying" hypothetically without actually disapproving.
      *   Alternatively, the flaw is in the **Generalization (7)**. The argument works against *simple* expressivism because it tries to eliminate propositional content entirely. Inferentialism and Dynamic Semantics *retain* a notion of content (inferential potential, context change potential) that is stable across embeddings, even if that content is defined by use.
      *   *Crucial Point:* The Frege-Geach problem is specifically acute for Expressivism because Expressivism denies that moral sentences have truth-conditional content independent of the attitude. Inferentialism, for example, often accepts that sentences have content defined by their inferential relations, which *do* persist in embedding (e.g., P implies Q is a relation that holds even if P is unasserted).

  6.  **Drafting the Response:**

      *   **Acknowledge the sophistication:** This is a well-structured argument that hits the nail on the head regarding the *tension*, but misses the nuance in the solutions.
      *   **Diagnose the Core Error:** The error is in **Premise (5)** (and the inference from 4 to 5). It assumes that if the *act* isn't performed, the *meaning-constituting property* is absent.
      *   **Expressivist Solution:** Explain how Blackburn (quasi-realism) or Gibbard (norm-expressivism) handle this. They distinguish between *expressing* an attitude and *entertaining* the state of mind. The meaning is the *type* of state, which can be nested.
      *   **Address the Generalization (Step 7):** This is the most important part for the user. Why doesn't this kill Inferentialism?
          *   Inferentialism defines meaning by *inferential potential*, not just *actual inference*. "P" has the potential to lead to "Q". In "If P then Q", that potential is being described, not exercised. The potential remains the same.
          *   Dynamic Semantics: Meaning = Context Change Potential. "P" changes context C to C+P. In "If P...", we check what *would* happen to a hypothetical context. The CCP of "P" is constant.
          *   Speech Act Theory: Distinguishes Propositional Content from Illocutionary Force. Embedding suspends Force, not Content. Expressivism tries to collapse Content into Force, which is why it struggles more.
      *   **Conclusion:** The argument proves too much because it relies on a naive version of use-theory (Meaning = Actual Performance) rather than a sophisticated one (Meaning = Conditions/Potential for Performance). Expressivism *can* survive by adopting a logic of attitudes (accepting the cost of complexity), but the generalization fails because other use-theories have resources (content/force distinction, potentials) that simple expressivism explicitly rejects or struggles to formulate.

  7.  **Refining the Diagnosis (Self-Correction/Nuance):**
      *   Wait, does Expressivism *explicitly reject* the content/force distinction? Yes, that's the point of non-cognitivism. They want to say there is no "moral proposition" over and above the attitude.
      *   So, for Expressivism, rejecting (5) costs them the simplicity of their view. They have to build a "logic of attitudes." This is the "cost" the user asked about.
      *   For Inferentialism, they *don't* have to pay that cost because their definition of meaning (inferential role) is inherently structural and compositional in a way that accommodates embedding naturally (e.g., P's role includes being an antecedent).
      *   So the generalization *fails* because other use-theories define "use" more broadly (potential/role) than the specific "expression of current mental state" definition in Premise (1).

  8.  **Final Plan:**
      *   Validate the user's intuition (it's a strong argument against *naive* expressivism).
      *   Pinpoint the failure at Premise (5) / the definition in Premise (1).
      *   Explain the Expressivist fix (Logic of Attitudes/Quasi-Realism) and its cost (complexity, mimicking realism).
      *   Refute the Generalization (Step 7) by showing how Inferentialism/Dynamic Semantics define "use" differently (potential vs. performance).
      *   Conclude on the landscape: It's not bleaker, but Expressivism has a harder hill to climb than Inferentialism.

  9.  (Self-Correction on Step 7): I need to be careful. Some *might* argue the Frege-Geach problem *does* challenge inferentialism (e.g., Schroeder's objections to Gibbard extend to inferentialism). However, the consensus is that inferentialism has better tools (commitment vs. entitlement, etc.) to handle it. I should acknowledge that the problem *pressures* all use-theories, but the *lethal* version presented here relies on conflating performance with potential.

  10. **Final Polish:** Ensure tone is respectful and philosophical. Use standard terminology (quasi-realism, commitment, context change potential).

  *(Self-Correction during drafting)*: I should explicitly mention that Premise (1) is the vulnerable spot for the generalization. Expressivism ties meaning to *non-cognitive attitudes*. Inferentialism ties meaning to *inferential roles*. An inferential role *includes* how the sentence behaves in conditionals. An attitude expression does not obviously include hypothetical entertainment. That is the disanalogy.

