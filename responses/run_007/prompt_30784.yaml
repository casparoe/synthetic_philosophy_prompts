      *   **Coherence:** It is operationally coherent (solvency relies on law of large numbers across the portfolio) but philosophically tense (single-case vs. group frequency).
      *   **Subjectivist Shift:** If insurers were strictly subjectivist (Bayesian/degree of belief), premiums would reflect the insurer's uncertainty given *all* available information, not just regulated information.
