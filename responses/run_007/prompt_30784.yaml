answer: |-
  Life insurance underwriting implicitly relies on a pragmatic frequentist framework that treats group frequencies as objective individual propensities, a stance that is operationally coherent for portfolio solvency but philosophically unstable, and shifting to strict subjectivism would transform regulatory bans from corrections of "objective risk" into explicit constraints on admissible evidence without altering the underlying pricing mathematics.

  The industry's implicit theory is a disguised propensity view: it acts as if mortality risk is a physical property inherent to the insured, measurable only through the proxy of reference classes. This solves the single-case problem by fiat; the actuary assumes that if the reference class were sufficiently granular, the group frequency would converge to the individual's true "force of mortality." This is operationally coherent because insurance solvency depends on the Law of Large Numbers across the portfolio, not on the metaphysical truth of any single policyholder's hazard function. As long as the classification scheme yields statistically independent risks within a large pool, the business model holds regardless of whether individual probability is real or epistemic. However, it is philosophically unstable because it cannot resolve the reference class problem you identified: there is no statistical test to determine whether "smoker" is a more relevant class than "zip code" without invoking causal assumptions that lie outside the frequency data itself.

  If an insurer adopted strict subjectivism (Bayesian personalism), risk would be defined explicitly as the insurer's degree of belief conditional on their specific information set $\mathcal{I}$. Pricing would technically remain an expectation of loss, $E[L|\mathcal{I}]$, but the ontological claim would shift from "this is your risk" to "this is our uncertainty given what we are allowed to know." In this framework, acquiring more predictive data (like genetic markers) is not uncovering an objective truth but simply reducing epistemic variance to calibrate the book more accurately. Consequently, the pricing mechanism itself wouldn't change—actuaries would still run regressions—but the justification for exclusions would. Under the current quasi-objective view, banning race or genetics implies these factors are not part of "true risk," which is empirically false if they are predictive. Under strict subjectivism, banning them is honestly acknowledged as a societal constraint on the information set $\mathcal{I}$, forcing the insurer to price based on $E[L|\mathcal{I}_{allowed}]$ rather than $E[L|\mathcal{I}_{all}]$.

  This makes legal bans logically more consistent under subjectivism. In the objective propensity view, prohibiting the use of predictive variables forces the insurer to charge prices that do not reflect reality, creating a cross-subsidy that looks like a market distortion. In the subjectivist view, probability is already normative relative to the observer's constraints; the law simply modifies the constraints. The tension you perceive arises because the industry wants the moral authority of objectivity ("you pay more because you are riskier") while retaining the political flexibility of subjectivism ("we choose these classes for business reasons"). A strict subjectivist framework would dissolve this tension by admitting that underwriting is always a measurement of uncertainty relative to a regulated information set, not a discovery of individual fate.
