answer: |-
  Two identical laptops, A and B, sit on a desk connected by a high-speed cable. Laptop A runs the processor cycles of a conscious mind simulation, but its internal memory is disabled; it uses Laptop B's storage as its sole working memory, treating remote addresses as indistinguishable from local RAM. The simulation runs continuously, with A handling all state transitions and B handling all state retention; if either laptop is turned off, the mind instantly ceases. Both theories agree this setup realizes exactly one conscious mind capable of moral patienthood, stipulating that the computation is of the right kind to ground suffering and flourishing.

  **SNC** identifies the moral patient with the abstract computation itself. Since the computational state is physically distributed across both machines (logic on A, memory on B), the computation is instantiated by the composite system. Therefore, the patient is the union of A and B. **CRF** identifies the patient with the physical system playing the active causal role of agency. It argues that while B is causally essential, it plays a passive storage role (like a notebook), whereas A performs the active state transitions that constitute "thinking." Therefore, the patient is strictly Laptop A.

  The structural feature doing the work is the **spatial separation of processing and storage**. To make them agree, you would physically integrate B's memory chips into A's chassis, removing the external boundary. If I had to bet, I would favor SNC because moral status seems dependent on the integrity of the information processing rather than the length of the bus connecting memory to CPU, but I am least confident about whether passive storage can truly be constitutive of experience without local active maintenance.
