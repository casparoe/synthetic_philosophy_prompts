answer: |-
  **Exam Question**

  Galen Strawson's Basic Argument concludes that true moral responsibility is impossible because nothing can be *causa sui*. P.F. Strawson, conversely, argues that reactive attitudes (resentment, gratitude, blame) are constitutive of human life and not subject to rational justification via metaphysics. Suppose you accept Galen Strawson's Basic Argument as sound. Can you coherently maintain the practice of reactive attitudes as P.F. Strawson describes them? Specifically, analyze whether the *normative force* of reactive attitudes (the sense that blame is *deserved*) presupposes the very ultimate responsibility Galen Strawson denies. If you argue they can be maintained, explain what justification they retain once ultimate responsibility is removed. If you argue they cannot, explain what replaces them. Do not simply argue that compatibilism solves the metaphysical problem; address the psychological and normative tension between believing no one is ultimately responsible while feeling someone is truly blameworthy.

  ***

  **Model Answer**

  Accepting Galen Strawson's Basic Argument (GSBA) creates a profound crisis for P.F. Strawson's framework of reactive attitudes. The GSBA establishes that moral responsibility requires ultimate responsibility (UR), which entails being the cause of oneself (*causa sui*). Since this is impossible, no one is truly morally responsible. P.F. Strawson (PFS) argues that reactive attitudes are natural, non-optional features of human life that do not require metaphysical justification. The tension arises here: if GSBA is sound, our reactive attitudes are predicated on a false belief—that agents are ultimately responsible. The question is whether these attitudes can survive the demolition of their metaphysical precondition.

  One might argue, following PFS, that reactive attitudes are psychologically inevitable regardless of metaphysical truth. Even if we know determinism (or the GSBA) is true, we cannot help but feel resentment when harmed. However, this conflates psychological inevitability with normative coherence. The prompt asks about the *normative force* of blame—the sense that an agent *deserves* suffering. If GSBA is correct, no one deserves anything in the ultimate sense. Maintaining full-blooded reactive attitudes while accepting GSBA risks intellectual dishonesty. It requires holding a belief (they are blameworthy) that one knows is metaphysically impossible (they are not ultimately responsible). This suggests an error theory: our moral practices are systematic errors based on false metaphysical assumptions.

  To maintain coherence, a proponent of GSBA must revise the attitudes. This leads to a revisionist stance. We might retain "forward-looking" attitudes—anger that signals boundary violations or motivates reform—while stripping away the "retributive" core that demands desert. For example, one might feel protective indignation rather than moral resentment. This preserves the social function of PFS's framework (maintaining relationships, demanding good will) without smuggling in the UR that GSBA denies. However, this risks changing the subject. PFS argues that reactive attitudes are defined by their demand for regard. If we remove the expectation that the agent *could have done otherwise* in the ultimate sense, does the attitude remain one of *blame*, or merely behavioral management?

  Alternatively, one could adopt a fictionalist approach. We act *as if* agents are responsible because the practice is indispensable, even while knowing it is metaphysically false. This avoids the psychological impossibility of abandoning attitudes but accepts that the justification is pragmatic, not truth-apt. The danger here is stability. Can we sustain the intense emotional heat of resentment while consciously believing the target is not ultimately responsible? Likely not. The feeling of desert is intrinsic to the phenomenology of resentment. To deny UR is to dampen the resentment.

  Therefore, accepting GSBA forces a modification of PFS's framework. We cannot coherently maintain standard reactive attitudes with their full normative force because that force derives from the belief in UR. We are left with a choice: abandon the attitudes (leading to a detached, objective stance incompatible with meaningful relationships) or revise them into something thinner (protective, forward-looking) that acknowledges the lack of ultimate desert. The most coherent path is revisionism. We keep the social structure PFS identifies but purge the retributive element GSBA disproves. This saves the practice from irrationality but admits that our moral life is built on a necessary fiction or a modified psychology that no longer matches our pre-theoretical intuitions about blame. Ultimately, GSBA shows that PFS's naturalism is insufficient; knowing the metaphysics *does* change the norms, even if it doesn't change the psychology immediately.

  ***

  **Marking Scheme**

  **A Grade (Excellent: 80-100%)**
  *   **Specific Moves:**
      *   Clearly distinguishes Galen Strawson's metaphysical impossibility claim from P.F. Strawson's naturalistic/psychological claim.
      *   Directly addresses the *normative* tension: argues that the *felt demand* of reactive attitudes presupposes ultimate responsibility.
      *   Evaluates specific strategies for reconciliation (Error Theory, Fictionalism, or Revisionism) rather than just stating they conflict.
      *   Critically assesses whether "revised" attitudes still count as *reactive attitudes* in P.F. Strawson's sense.
  *   **Mistakes that knock down:** None significant. Minor clarity issues acceptable.

  **B Grade (Good: 60-79%)**
  *   **Specific Moves:**
      *   Accurately summarizes GSBA and P.F. Strawson's framework.
      *   Identifies the conflict (Metaphysics vs. Psychology).
      *   Offers a position on whether attitudes can be maintained (usually argues for revision or pragmatism).
  *   **Deficiencies:**
      *   Treats the conflict as merely psychological ("it's hard to feel blame") rather than normative ("blame is unjustified").
      *   Relies on standard compatibilist objections (e.g., "responsibility only requires reasons-responsiveness") without addressing why GSBA rejects that as sufficient for *ultimate* responsibility.
      *   Fails to analyze whether revised attitudes lose the essential feature of P.F. Strawson's framework.

  **C Grade (Pass: 50-59%)**
  *   **Specific Moves:**
      *   Summarizes GSBA (regress/causa sui) correctly.
      *   Mentions P.F. Strawson and reactive attitudes.
      *   States that there is a tension between the two.
  *   **Deficiencies:**
      *   Stops at summary; does not engage with the *justification* of attitudes.
      *   Confuses Galen Strawson and P.F. Strawson (attributing the Basic Argument to P.F. or vice versa).
      *   Claims compatibilism "solves" the problem without explaining how it bypasses the ultimacy condition.
      *   Ignores the prompt's instruction to avoid standard metaphysical objections in favor of normative/psychological analysis.

  **Fail (<50%)**
  *   Misrepresents the Basic Argument.
  *   Fails to discuss reactive attitudes.
  *   Off-topic or plagiarism.

  Crux: It tests the ability to analyze whether the metaphysical impossibility of ultimate responsibility undermines the normative legitimacy of our indispensable reactive attitudes.
