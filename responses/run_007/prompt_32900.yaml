answer: |-
  # Which Theory of Material Composition Do You Actually Hold?

  **Instructions:** Read each scenario carefully. Answer based on your immediate intuition about whether a single, distinct object exists in that situation. Do not worry about technical philosophical terms; simply choose the option that best matches your judgement.

  ### Question 1
  Imagine your left shoe and the Moon. They are both physical things, but they are very far apart and not connected.
  *   **A)** Yes, strictly speaking, there is a single object composed of your shoe and the Moon.
  *   **B)** No, there is just your shoe and there is just the Moon; they do not make up one thing.

  ### Question 2
  Consider a hammer where the metal head is screwed tightly onto the wooden handle.
  *   **A)** Yes, this arrangement constitutes a single object (a hammer).
  *   **B)** No, there are only the head and the handle arranged together.

  ### Question 3
  Think about a living domestic cat walking across a room.
  *   **A)** Yes, the cat is a single object made up of its parts.
  *   **B)** No, there are only the cells and atoms arranged cat-wise.

  ### Question 4
  Picture a loose pile of sand grains on a beach, not stuck together, just resting on one another.
  *   **A)** Yes, the pile counts as a single object.
  *   **B)** No, there are only the individual grains of sand.

  ### Question 5
  Look up at a cloud in the sky. Its boundaries are fuzzy and it changes shape constantly.
  *   **A)** Yes, the cloud is a single object.
  *   **B)** No, there are only water droplets suspended in the air.

  ### Question 6
  Imagine a wooden chair that has been smashed into splinters with a sledgehammer. The pieces are lying in a heap.
  *   **A)** Yes, the heap of splinters is still a single object (albeit a broken one).
  *   **B)** No, the object ceased to exist; there are now just pieces of wood.

  ### Question 7
  Consider the thing composed of your nose and the Eiffel Tower.
  *   **A)** Yes, there is an object that is the sum of your nose and the Tower.
  *   **B)** No, that is just two separate things mentioned in the same sentence.

  ### Question 8
  Think about yourself, right now, as a physical body.
  *   **A)** Yes, I am a single physical object composed of my parts.
  *   **B)** No, strictly speaking, there are only the atoms arranged person-wise.

  ### Question 9
  Two strangers are shaking hands on the street. Their skin is touching firmly.
  *   **A)** Yes, during the handshake, they form a single physical object.
  *   **B)** No, they remain two separate people merely in contact.

  ### Question 10
  Consider the entire universe, containing every particle and object that exists.
  *   **A)** Yes, the universe itself is one single massive object.
  *   **B)** No, the universe is just the collection of all the things inside it.

  ***

  # Scoring Key and Interpretation

  Tally your **A** and **B** answers. Then, look at your specific pattern of responses to the critical questions below to determine your philosophical position.

  ### 1. Mereological Nihilism
  *   **Pattern:** You answered **B** to almost every question, including Question 3 (Cat) and Question 8 (Yourself).
  *   **Rationale:** Nihilists hold that composition never occurs. There are no composite objects, only fundamental simples (atoms, particles, etc.). If you believe that even living beings and yourself are not truly single objects but merely arrangements of parts, you align with this view.
  *   **Key Indicators:** B on Q3, B on Q8, B on Q2.

  ### 2. Mereological Universalism
  *   **Pattern:** You answered **A** to almost every question, including Question 1 (Shoe/Moon) and Question 7 (Nose/Tower).
  *   **Rationale:** Universalists hold that composition is unrestricted. Any collection of things, regardless of distance, connection, or function, composes a further thing. If you are willing to accept that arbitrary collections like "your nose and the Eiffel Tower" constitute genuine objects, you align with this view.
  *   **Key Indicators:** A on Q1, A on Q7, A on Q4.

  ### 3. Organicism
  *   **Pattern:** You answered **A** to Question 3 (Cat) and Question 8 (Yourself), but **B** to Question 2 (Hammer), Question 4 (Sand), and Question 1 (Shoe/Moon).
  *   **Rationale:** Organacists hold that composition occurs only when the parts constitute a living organism. Non-living composites (like hammers or piles of sand) do not truly exist as single objects; only living things do. If you grant existence to cats and humans but deny it to artefacts and heaps, you align with this view.
  *   **Key Indicators:** A on Q3, B on Q2, B on Q4.

  ### 4. Fastening-Based View (Common Sense)
  *   **Pattern:** You answered **A** to Question 2 (Hammer) and Question 8 (Yourself), but **B** to Question 1 (Shoe/Moon) and Question 4 (Sand).
  *   **Rationale:** This view holds that composition requires physical connection, bonding, or fastening. Parts must be joined in a specific way to form a whole. This distinguishes you from the Universalist (who accepts disconnected objects) and the Organacist (who accepts living things even if parts are not 'fastened' in the artefact sense, though organisms are internally connected). Crucially, if you said **A** to the Hammer (Q2) but **B** to the Cat (Q3), you might hold an Artefact-only view, but most Common Sense views accept both.
  *   **Key Indicators:** A on Q2, B on Q1, B on Q7.

  ### 5. Brutalism (or Primitivism)
  *   **Pattern:** Your answers are mixed and do not follow a clear rule. For example, you said **A** to the Cloud (Q5) but **B** to the Sand (Q4), or **A** to the Hammer (Q2) but **B** to the Universe (Q10).
  *   **Rationale:** Brutalists hold that composition facts are brute facts; there is no informative principle (like life or fastening) that explains them all. Some things compose objects and others do not, and that is simply the way reality is. If your intuitions vary by case without a unifying theoretical thread, you align with this view.
  *   **Key Indicators:** Inconsistent pattern (e.g., A on Q5, B on Q4, A on Q2, B on Q1).

  ### 6. Moderate Restrictivism (Vague Boundaries)
  *   **Pattern:** You answered **A** to ordinary objects (Hammer, Cat) but hesitated or said **B** to vague objects (Cloud, Sand) while also saying **B** to disconnected objects (Shoe/Moon).
  *   **Rationale:** This is a variant of the Fastening view that places extra weight on boundary precision. You accept composites where boundaries are clear but reject them where boundaries are vague.
  *   **Key Indicators:** B on Q5, B on Q4, A on Q2.

  ***

  # Notes on Unoccupied and Indistinguishable Positions

  ### Logically Possible but Unoccupied Combinations
  There are answer patterns that are logically consistent but correspond to no defended philosophical position in the literature:

  1.  **The "Anti-Organic Universalist" (A on Q1/Q7, B on Q3):** This person believes arbitrary sums (Shoe/Moon) exist, but living organisms do not. This is virtually unoccupied because any view generous enough to accept arbitrary fusions usually accepts organisms as a subset. It is theoretically unstable.
  2.  **The "Artefact Nihilist" (A on Q2, B on Q3):** This person believes hammers exist but cats do not. This is highly unattractive philosophically, as organisms are typically seen as better candidates for objecthood than artefacts. No serious theory privileges glue over life.
  3.  **The "Cosmic Nihilist" (A on Q2/Q3, B on Q10):** You believe hammers and cats exist, but the Universe as a whole does not. While some might argue the universe is a collection rather than a set, most mereological theories that accept medium-sized composites also accept the maximal composite. This combination is rarely defended explicitly.

  ### Indistinguishable Positions
  *   **Organicism vs. Fastening View on Organisms:** This quiz cannot fully separate Organicism from the Fastening view regarding living things, because organisms *are* fastened (biologically connected). Both views answer **A** to Question 3 (Cat). The distinction relies entirely on non-living artefacts (Question 2). If a respondent answers **A** to both Cat and Hammer, they are either a Fastening theorist or a Universalist; if they answer **A** to Cat and **B** to Hammer, they are an Organacist.
  *   **Brutalism vs. Untheorised Common Sense:** A respondent who scores as a Brutalist may simply be a Common Sense realist who has not yet generalised their intuitions into a principle (like Fastening). The quiz treats these similarly because, practically, they judge cases individually rather than by rule. Distinguishing them requires asking *why* they chose their answers, not just *what* they chose.
  *   **Nihilism vs. Eliminativism:** For the purposes of this quiz, Nihilism (no composition) and Eliminativism (composite objects do not exist) yield the same answers. They are metaphysically distinct in some frameworks but operationally identical in this diagnostic.
