answer: |-
  1. This project asks whether normative reasoning in welfare economics requires interpersonal utility comparisons to satisfy the strict invariance conditions of physical measurement, or if weaker relational structures suffice. Specifically, it investigates whether domain-specific pairwise judgments, even if incomplete or intransitive, can ground distributive policy without a common cardinal scale.

  2. Current debates remain stalled because both skeptics and proponents implicitly accept that legitimacy demands a unified metric akin to temperature or length. Consequently, the possibility that policy-relevant comparisons rely on heterogeneous, context-dependent relations rather than universal magnitudes has not been systematically evaluated.

  3. I will dedicate months one and two to text analysis, months three and four to modeling, and months five and six to policy testing. This conceptual-engineering approach is preferable to empirical surveys because the barrier is theoretical coherence, not data availability.

  4. Success consists of demonstrating a coherent framework where incomplete pairwise judgments support key distributive principles without invoking cardinal unity. Failure would be proving that any such weaker structure inevitably collapses into inconsistency or cannot distinguish between competing policy outcomes.

  5. Given the limited funding, the inquiry will restrict its analysis to three canonical cases in tax and transfer policy rather than attempting a comprehensive reconstruction of welfare theory. This ensures the project produces a publishable paper within one year without requiring collaborative modeling or extensive archival research.
