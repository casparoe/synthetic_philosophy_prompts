  3. Asymbolia undermines strong imperativism because patients retain the pain experience but lack the intrinsic motivational command to protect the injured body part.
  4. The dissociation supports the composite view of pain over the unified phenomenon view, suggesting pain consists of separable sensory-discriminative and affective-motivational components.
  5. It refutes motivational internalism regarding pain by showing that the phenomenal experience of pain does not necessarily entail a motivation to avoid or cease the stimulus.
