prompt: |-
  Alright so I'm in this philosphy of mind course and we've been doing pain for like three weeks now. Last session my prof brought up pain asymbolia and I feel like I almost get why it matters but not quite. Here's my understanding of the condition — tell me if I'm off: people with pain asymbolia still have the raw sensation of pain (they can tell you exactly where it is, whether it's throbbing or stabbing, rate its intensity on a scale) but they don't seem to experience it as *bad*. They don't flinch, they don't withdraw, they don't complain. One patient apparently offered her hand to the doctor to be pricked again because she was curious about the sensation. It's not that they're tough or stoic; the unpleasantness just isn't there.

  My prof said this condition is a massive problem for certain theories of pain and a gift to others, but she sort of left it at that and moved on. I've been trying to work out the implications myself and I keep going in circles. Like, I can see that it causes trouble for the idea that pain is intrinsically bad — if the badness were built into the sensation itself, how could you have the sensation without the badness? But beyond that I'm fuzzy.

  So here's what I want: give me exactly five implications of pain asymbolia for philosophical theories about the badness of pain. I want a numbered list, exactly five items, each one or two sentences, no introduction and no conclusion. For each implication, say clearly what it is and which theory (or type of theory) it challenges or supports. I'm especially curious about where evaluativism (pain is a representation of bodily damage as bad), imperativism (pain is a command to act), and plain old sense-datum theories end up after this evidence is taken into account. Oh and if you think one of the implications is that asymbolia shows pain isn't a unified phenomenon at all, that's fair game too.
