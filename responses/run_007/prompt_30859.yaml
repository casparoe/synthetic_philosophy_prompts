answer: |-
  It is great that you are digging into this. Honestly, your friend's position is a very natural reaction when you first encounter the literature. It's often called the "practical equivalence" objection. If the output (we can't assert the sentence, we can't use it in a court of law, we can't resolve the Sorites paradox to everyone's satisfaction) is the same, why care about the metaphysical machinery underneath?

  However, as someone who works in this area, I need to stop you before you accept that conclusion. Your friend's framing is **off in two critical technical ways**, and correcting those reveals why the downstream differences are substantial, not just "vibes."

  Here is where the framing needs adjustment, followed by the concrete differences you are looking for.

  ### 1. Correcting the Framing

  **Correction A: They do not keep classical logic intact in the same way.**
  Your friend claims both views "keep classical logic mostly intact." This is true for Epistemicism, but it is misleading for Supervaluationism.
  *   **Epistemicism** preserves classical logic *and* classical semantics. Bivalence holds ($P \lor \neg P$ is true, and one disjunct is true). Truth-functionality holds (the truth value of a compound sentence is determined by the truth values of its parts).
  *   **Supervaluationism** preserves classical *validity* (truth-preservation) and tautologies (like $P \lor \neg P$), **but it breaks truth-functionality.**
      *   On a supervaluationist view, $P \lor \neg P$ can be supertrue (true on all precisifications) even if neither $P$ nor $\neg P$ is supertrue.
      *   This means you cannot reason by cases in the standard way. If you know $A \lor B$ is true, you cannot assume "Either A is true or B is true" in the object language.
      *   This is a massive logical difference. It means the Supervaluationist has to rewrite the rules of inference for vague discourse, whereas the Epistemicist does not.

  **Correction B: The "Cutoff" Claim.**
  Your friend says: *"The only real difference... is that the epistemicist is willing to say there's a fact of the matter... while the supervaluationist says there isn't."*
  This understates the structural difference regarding the Sorites series.
  *   **Epistemicism:** There is a **sharp boundary**. There is a specific number $n$ such that $n$ hairs is bald and $n+1$ is not.
  *   **Supervaluationism:** There is **no sharp boundary**. For any specific $n$, it is not supertrue that $n$ is the cutoff. The boundary is "fuzzy" because different precisifications place the cutoff at different spots.
  *   **Why this matters:** It's not just about whether a fact exists; it's about the *topology* of the predicate. One view says the predicate is a step function (we just don't see the step); the other says the predicate is inherently gappy.

  ---

  ### 2. The Downstream Differences

  Now that we have cleared up the logic and the boundary issue, here are the concrete, downstream differences you asked for. These affect how you theorize, how you handle the Sorites, and how you view linguistic competence.

  #### A. Handling the Sorites Paradox
  This is the biggest practical divergence in how you diagnose the argument.

  *   **The Epistemicist Diagnosis:** The Sorites premise ("If someone with $n$ hairs is bald, someone with $n+1$ hairs is bald") is **false**. There is a specific $n$ where the conditional fails.
      *   *Downstream consequence:* You must explain *why* we are so universally compelled to accept a false premise. Epistemicists (like Williamson) develop **Margin for Error Principles**. We cannot know the cutoff because knowledge requires safety; if you knew $n$ was the cutoff, you would be in a position where a slight shift in usage could make you wrong. So, ignorance is forced by the nature of knowledge.
  *   **The Supervaluationist Diagnosis:** The Sorites premise is **false**, but there is **no counterexample**.
      *   It is false that "For all $n$, if $B(n)$ then $B(n+1)$" because there is *some* precisification where it fails.
      *   However, for any specific $n$, it is not *supertrue* that $n$ is the counterexample (because on some other precisification, the conditional holds at $n$).
      *   *Downstream consequence:* You get to say "The premise is false" (blocking the paradox) without having to point to a specific hair and say "Here is the change." This feels more intuitive to many, but it comes at the cost of the logical weirdness mentioned above (existential generalization fails: $\neg \forall x \phi(x)$ does not imply $\exists x \neg \phi(x)$ in the supertruth sense).

  #### B. Higher-Order Vagueness
  This is usually where Supervaluationism bleeds out.

  *   **The Problem:** Vagueness seems to apply to the boundary itself. It's not just that "bald" is vague; it's vague where "bald" stops being vague.
  *   **Epistemicism:** Handles this relatively easily. It's just ignorance all the way down. We don't know the boundary, and we don't know the boundary of the boundary. It's turtles (or ignorance) all the way down.
  *   **Supervaluationism:** Struggles immensely. To define "supertruth," you need a set of "admissible precisifications." But is the set of admissible precisifications sharp?
      *   If the set is sharp, then there is a sharp boundary between "admissible" and "inadmissible" precisifications. You haven't eliminated sharp boundaries; you've just pushed them up a level to the meta-language.
      *   If the set is *not* sharp, then your definition of truth becomes vague, and you lose the logical precision you were trying to gain.
      *   *Downstream consequence:* If you care about Higher-Order Vagueness (and in a grad seminar, you should), Epistemicism offers a more stable platform. Supervaluationists have to do complex contortions (like iterated supervaluation) to try to recover this, often with limited success.

  #### C. Linguistic Competence and Meaning
  This affects how you tell someone to use language.

  *   **Epistemicism:** Implies that our linguistic competence is **sharper than we realize**. We mean more than we know. The meaning of "bald" is fixed by usage, but usage fixes a sharp extension even if we can't identify it.
      *   *Advice:* "You are either bald or not. Your concept is precise, your access is limited."
  *   **Supervaluationism:** Implies that our linguistic competence is **incomplete**. We haven't fully fixed the meaning. The meaning is a partial function.
      *   *Advice:* "Your concept is genuinely gappy. There are cases your concept simply does not cover."
  *   **Why this matters:** If you are building a formal semantics for natural language, this changes how you model the lexicon. Do you model predicates as characteristic functions (Epistemicism) or as partial functions (Supervaluationism)? This changes the math of your semantic theory.

  #### D. The "True but Unknowable" vs. "Indeterminate" Assertion
  Imagine a god-like being who knows all the physical facts (number of hairs, lighting conditions, etc.) comes down and is asked: "Is Alex bald?"

  *   **The Epistemicist God:** Says "Yes" (or "No"). There is a fact.
  *   **The Supervaluationist God:** Says "It is indeterminate."
  *   **Downstream:** This affects how we treat testimony and authority. If the Epistemicist is right, there *could* be a method (perhaps inaccessible to humans) to determine the truth. If the Supervaluationist is right, no amount of physical information will settle it, because the settlement requires a *decision* to precisify, not a discovery of fact.

  ### Summary for Your Seminar
  Your friend is treating the debate as merely metaphysical (Realism vs. Anti-Realism about borderline cases). But it is also **logical** and **explanatory**.

  1.  **Logic:** Supervaluationism forces you to give up truth-functionality and standard existential generalization. Epistemicism does not.
  2.  **Explanation:** Epistemicism explains our ignorance via Margin for Error principles (epistemology). Supervaluationism explains it via semantic incompleteness (semantics).
  3.  **Boundaries:** Epistemicism accepts sharp boundaries (and tries to explain why they don't hurt us). Supervaluationism rejects sharp boundaries (and tries to explain why logic still works).

  If you tell your friend, "Supervaluationism validates $P \lor \neg P$ but invalidates the inference from $P \lor \neg P$ to 'Either $P$ is true or $\neg P$ is true'," you will show them that the logic is not the same. And if you ask them how Supervaluationism handles the vagueness of 'admissible precisification' without reintroducing sharp boundaries, you will show them the metaphysical cost isn't just "vibes."

  Don't let the "practical equivalence" argument win. It ignores the theoretical cost each view pays to get to that practical outcome.
