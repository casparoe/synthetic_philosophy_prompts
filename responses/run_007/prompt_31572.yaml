      *   **Rule (2) [Self-Amendment]:** Valid rules can change the procedure for adopting rules (including themselves). (Standard Nomic feature).
      *   **Rule (3) [Persistence/Non-Retroactivity]:** Valid rules stay valid until repealed. Repealing the *authorizing* rule doesn't invalidate rules adopted under it. (Grandfathering).
      *   **Rule (4) [Ratification/Estoppel]:** If a rule had the *wrong majority* but was treated as binding for several turns, it stands. (Soft constraint/Cure by practice).
      *   **Rule (5) [Self-Invalidation]:** A validly adopted rule declaring itself invalid is valid *and* has the effect of being invalid. (Paradox handling).

  3.  **Pairwise Comparison & Tension Identification:**

      *   **Pair (1) vs. (4):**
          *   (1) says: No amount of going along with it makes an invalid rule valid.
