      *   *Fix for (1) vs. (5):* This is the "Self-Referential Paradox." *Cheapest Fix:* Clarify that "Invalid" in Rule 5 means "Has no force," not "Was never adopted."

  6.  **Refining the Output:**
      *   Structure: Introduction -> The Big Contradiction -> Secondary Tensions -> Compatible Pairs -> Ranked List of Fixes.
      *   Tone: Analytical, helpful, slightly playful (it's a game about rules).
