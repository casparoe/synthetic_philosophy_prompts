      *   **Input:** 5 specific rules regarding validity, adoption, amendment, persistence, ratification, and self-reference.
      *   **Output:** Identify tensions/contradictions between pairs, distinguish real vs. apparent tensions, rank by severity, and propose the "cheapest fix" for each.
      *   **Goal:** Help the user resolve inconsistencies *before* the game starts.

  2.  **Analyze the Rules:**
