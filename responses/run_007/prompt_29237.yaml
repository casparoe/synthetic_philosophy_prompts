answer: |-
  This is an excellent question that cuts to the heart of why the therapy/enhancement (T/E) distinction remains a "zombie concept" in bioethics: it refuses to die, yet many argue it refuses to live.

  Your intuition is well-founded. Christopher Boorse's Biostatistical Theory (BST) is precisely the move you are describing, and for a long time, it was the dominant strategy for naturalizing the distinction. If health is normal species functioning, therapy restores it, and enhancement exceeds it.

  However, the consensus in contemporary bioethics has largely moved away from relying on the BST to ground the T/E distinction. The reasons are not merely pedantic; they strike at the viability of using statistical normality as a proxy for moral permissibility. The critique generally falls into two buckets, corresponding to the two parts of your final question: **(1) The line cannot be drawn non-arbitrarily (conceptual instability), and (2) Even if it could, it lacks normative force (normative inertness).**

  Here is the breakdown of why the BST solution is generally regarded as insufficient for the work you want it to do.

  ### 1. The Reference Class Problem is Normative, Not Empirical
  You suggest that hard cases need "better empirical specification of the relevant reference classes." The counter-argument is that selecting the reference class is itself a normative act, not an empirical discovery.

  Boorse argues we should use natural reference classes (age, sex). But consider your growth hormone example. If we define the reference class as "all children," short stature is a deviation. If we define it as "children with parental height X," it might be normal. If we define it as "children in a specific socioeconomic stratum where nutrition was limited," it changes again.

  The choice of which reference class is "appropriate" often depends on what we are trying to achieve morally. As **Norman Daniels** (who tries to salvage Boorse for justice theory) admits, we select reference classes based on what functions are relevant to protecting an individual's share of the "normal opportunity range." But determining which opportunities are "normal" is a social/moral judgment, not a biological one. If the boundary of the class is determined by moral considerations about what counts as a disadvantage, then the T/E distinction derived from it is circular: we are defining disease based on what we think we ought to treat.

  ### 2. The Arbitrariness of the Cutoff (The Sorites Problem)
  Even if we agree on the reference class, BST relies on a statistical cutoff (e.g., two standard deviations from the mean). Biologically, functioning is almost always a continuum.

  The philosophical worry here is the **Arbitrariness Objection**. If a child is at the 2.1st percentile for height and receives growth hormone (therapy), but a child at the 2.5th percentile is denied it, the distinction rests on a statistically arbitrary line.
  *   **Conceptual Worry:** If the boundary is arbitrary, is it a real conceptual distinction or a pragmatic administrative one?
  *   **Normative Worry:** Can an arbitrary statistical line bear the weight of moral permission? Most ethicists argue no. If the moral status of an intervention changes drastically based on a 0.4% difference in statistical frequency, the moral theory is suspect. This suggests the T/E distinction is not tracking a morally relevant property, but rather a bureaucratic convenience.

  ### 3. The "Statistical Normality is Not Normative Good" Objection
  This is perhaps the most damaging critique for a PhD level analysis. BST equates "statistically typical functioning" with "health." But statistical typicality does not always align with well-being or moral goodness.

  *   **The Universal Pathogen:** If a new environmental toxin lowers everyone's immune function by 20%, the new lower baseline becomes "statistically normal." Under a strict BST, the lowered function is healthy, and restoring the old function would be "enhancement." This is counterintuitive; we want to say the population is diseased, not that the baseline shifted. (Boorse tries to handle this via "species design," but critics argue "design" is teleological and metaphysically suspect in a post-Darwinian framework).
  *   **The Universal Enhancement:** Conversely, if we develop a safe cognitive booster and everyone takes it, high cognition becomes the new normal. Does that mean the next generation *needs* it to be "healthy"?
  *   **Aging:** Aging involves a universal decline in function. It is statistically typical. Is aging a disease? If BST says no (because it's typical), then therapies to mitigate aging are "enhancements." If BST says yes (because it reduces function), then aging is a pathology. Both conclusions are uncomfortable for different moral frameworks.

  The point is that **statistical typicality and moral desirability come apart.** Therefore, a distinction based on statistical typicality cannot automatically inherit moral weight.

  ### 4. The Normative Inertness (The "So What?" Objection)
  To your final question: *Is the real worry that the distinction can't be drawn cleanly, or that even a cleanly drawn distinction wouldn't carry the moral weight people want it to?*

  The literature suggests it is **both**, but the latter is the deeper sinkhole. Even if we could draw the line cleanly (e.g., via a perfect genetic baseline), the T/E distinction does not map onto the **Permissible/Impermissible** or **Obligatory/Optional** distinctions.

  *   **Therapy isn't always obligatory:** Cosmetic reconstructive surgery after a burn is therapy, but is it morally required? Is it always funded by justice-based healthcare systems? (Some argue no).
  *   **Enhancement isn't always suspect:** Vaccination is arguably an enhancement of the immune system (preparing it for a threat it hasn't statistically encountered yet). Education enhances cognitive capacity beyond the "baseline." We often have a moral *obligation* to enhance our children (via education, nutrition, etc.).

  As **Allen Buchanan** and others have argued, the T/E distinction is often used as a proxy for a deeper debate about **fairness** and **authenticity**.
  *   When people object to enhancement, they usually aren't objecting to the *statistical deviation*; they are objecting to *unfair advantage* (cheating) or *hubris* (playing God).
  *   When people advocate for therapy, they are usually advocating for *relief of suffering* or *equality of opportunity*.

  If we strip away the T/E label and look directly at the underlying values (suffering, fairness, autonomy, authenticity), the T/E distinction drops out as an unnecessary middleman. This is the "Normative Inertness" critique: The distinction doesn't *do* the ethical work; it merely labels the outcome of ethical work done by other principles.

  ### 5. Why the Distinction Persists
  If the arguments against it are so strong, why does the literature persist?
  1.  **Regulatory Utility:** The FDA and insurance companies *need* a binary switch for reimbursement. Philosophy often lags behind policy needs.
  2.  **Intuitive Appeal:** As you noted, it feels natural. It aligns with a "restoration vs. improvement" intuition that is hard to shake.
  3.  **Lack of Alternatives:** Welfarist accounts (health is what maximizes well-being) are too broad. Capabilities approaches (Sen/Nussbaum) are better but harder to operationalize.

  ### Summary for your Research
  You are correct that the BST offers the most *conceptually tidy* solution. However, the philosophical consensus is that it fails because:
  1.  **Reference classes are normatively loaded**, making the "empirical specification" impossible to isolate from moral judgment.
  2.  **Statistical cutoffs are arbitrary**, making them poor grounds for moral dichotomies.
  3.  **The distinction is normatively inert**, failing to track the actual moral reasons we care about (justice, suffering, fairness).

  For a PhD project, a productive angle might not be to try to fix the BST, but to investigate **why** we cling to the T/E distinction despite its failures. Is it a heuristic for a specific theory of justice (like Daniels')? Is it a placeholder for concerns about human nature (like Sandel's)? Or is it simply a regulatory artifact that philosophy has mistakenly reified?

  The strongest argument against your proposal is that **you cannot derive an 'ought' (therapy is permissible/required) from an 'is' (this is statistically typical)** without smuggling in normative premises about the value of that typicality. Once you admit those premises are doing the work, the statistical distinction becomes redundant.
