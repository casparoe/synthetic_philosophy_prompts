  TO: Steering Committee, Gene Drive Malaria Consortium
  FROM: [Your Name/Seat]
  DATE: October 26, 2023
  SUBJECT: Decision Memo on Field Trial Authorization Protocol

  I recommend we adopt the all-seven-sign-off rule for any consortium-endorsed field trial, provided we simultaneously establish an independent external review panel to adjudicate objections based on empirical data rather than subjective risk tolerance.

  This recommendation addresses the critical vulnerability in our current "most optimistic lab binds" de facto policy while mitigating the paralysis concerns raised by those opposing a unanimous veto. We must acknowledge that gene drives are inherently transboundary; an ecological adverse event in one jurisdiction compromises the regulatory and public landscape for all seven labs. If a single laboratory proceeds based on an outlier risk assessment and causes harm, the resulting loss of public trust will not be contained within that country—it will halt funding and regulatory approval for the entire consortium, effectively ending the project for everyone. For the committee members concerned about delays impacting malaria control, the cost of a total field shutdown due to premature action far outweighs the cost of a coordinated, slightly slower timeline.

  However, the concern that a single cautious lab could indefinitely veto progress based on subjective risk tolerance rather than data is valid. To address this, the adoption of the all-seven rule must be coupled with the independent review panel mechanism. Under this framework, a lab withholding sign-off must submit a formal objection grounded in specific, falsifiable scientific evidence regarding containment or ecological risk. The external panel will review these objections against agreed-upon safety thresholds. This prevents paralysis by ensuring that vetoes are data-driven rather than tolerance-driven, while maintaining the unanimity required to protect our collective license to operate. This approach balances the urgent need for malaria interventions with the long-term viability of the technology we are all working to deploy.
