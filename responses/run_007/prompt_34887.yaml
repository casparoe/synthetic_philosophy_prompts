answer: |-
  This is one of the most fertile problems in analytic aesthetics, and you have pinpointed the exact tension that keeps philosophers of art up at night. You are essentially asking for a reconciliation of **Nelson Goodman's** distinction between autographic and allographic arts with **Arthur Danto's** institutional theory, all filtered through the brutal economics of the auction house.

  Here is a reconstruction of the implicit theory presupposed by the forgery panic, followed by an analysis of whether the art world is actually inconsistent when it comes to conceptual art and photography.

  ### 1. The Implicit Theory: Art as Achievement, Not Object

  If the art market (and the critical establishment that supports it) treats a revealed forgery as worthless despite its unchanged perceptual properties, it is explicitly rejecting **Perceptual Aestheticism** (the idea that aesthetic value resides solely in the sensory experience of the object).

  Instead, the practice presupposes a theory of **Historical Essentialism** combined with **Performance Value**.

  *   **Historical Essentialism:** An artwork is not just a physical object; it is an object *plus* a specific history of production. To be a "Vermeer," the painting must have been caused by the hand and mind of Vermeer in the 17th century. A perfect duplicate created in the 1930s is ontologically a different work, even if it is perceptually indistinguishable.
  *   **Performance Value:** We value art not just for what it *is*, but for what it *does*. A Vermeer is valued as a feat of innovation, vision, and technical mastery within a specific historical context. A van Meegeren is a feat of deception and mimicry. When the forgery is revealed, the "performance" changes. We are no longer admiring the breakthrough of a 17th-century master; we are admiring the trickery of a 20th-century conman. The aesthetic experience is cognitively penetrated; knowing the history changes what we see.

  **So, the market presupposes that Artistic Value = Perceptual Quality × Historical Agency.**

  If the Agency is fraudulent, the Value collapses, regardless of the Perceptual Quality. This suggests that the art world views artworks as **traces of human action** rather than autonomous beautiful objects.

  ### 2. The Consistency Check: Photography and Conceptual Art

  Your "twist" is excellent. If the theory above is true (that the specific history of physical production matters), then Conceptual Art and Photography should theoretically suffer the same fate as painting if they aren't "originals." Yet, they don't.

  *   **Sol LeWitt:** You can buy his instructions, hire a team of painters who have never met LeWitt, and have them paint the wall. It is considered an authentic LeWitt.
  *   **Photography:** You can have Print #1 and Print #50 from the same negative. Both are "originals."

  Is this inconsistent? **Superficially, yes. Structurally, no.**

  The inconsistency dissolves if we refine the theory from "History of Physical Production" to **"History of Artistic Sanction."**

  #### The Goodman Distinction: Autographic vs. Allographic
  Nelson Goodman, in *Languages of Art*, provided the standard philosophical tool for this.
  *   **Autographic Arts (Painting, Sculpture):** The history of production is constitutive of the work. Even the most perfect copy is a forgery because the work *is* the specific physical object created by the artist.
  *   **Allographic Arts (Music, Dance, Literature, Conceptual Art):** The work is defined by a notation or instruction. A performance of Beethoven's 5th is authentic if it follows the score, regardless of who conducts it.

  **Where Photography Fits:** Photography is a hybrid. Ontologically, it is allographic (any print from the negative is the same work). However, the *market* treats it as autographic by imposing limited editions.

  **The Unifying Principle: Authorization**
  The art world is not inconsistent if we understand that what is being valued is not the *physical uniqueness* of the object, but the **authorization of the artist's agency.**

  1.  **In Painting (Vermeer):** The artist's agency is transmitted through their physical touch. There is no other way to verify the sanction. Therefore, the physical object must be unique.
  2.  **In Conceptual Art (LeWitt):** The artist's agency is transmitted through the *idea/instruction*. The physical paint is incidental. The "original" is the certificate of authenticity and the instruction set, not the wall. The execution is a clerical task, not a creative one.
  3.  **In Photography:** The artist's agency is transmitted through the selection of the negative and the approval of the print. Print #1 and Print #50 are aesthetically identical, but the market creates scarcity to mimic the autographic model. However, an *unauthorized* print from the same negative (made after the artist's death without estate approval) is treated as a forgery/posthumous print and loses value.

  **Conclusion on Consistency:** The art world is consistent. It does not value "the hand of the artist" universally; it values **"the sanction of the artist."**
  *   For Vermeer, sanction = hand.
  *   For LeWitt, sanction = instruction/certificate.
  *   For Sherman/Struth, sanction = signed edition.

  In all cases, if you bypass the artist's sanction (forging the hand, faking the certificate, printing from a scanned negative), the value collapses. The van Meegeren case isn't about the paint; it's about the lack of Vermeer's sanction.

  ### 3. The Critical Turn: Economic Value vs. Aesthetic Value

  However, there is a deeper trap in your question. You ask what the *market's practice* presupposes about *aesthetic value*.

  We must be careful not to conflate **Price** with **Aesthetic Worth**.
  When the van Meegerens were revealed as fakes, they were removed from museums and their price tanked. But did their *beauty* vanish? Most critics admit they are still technically proficient paintings.

  The market panic reveals that the Art World operates on **Institutional Value**, which is a cocktail of:
  1.  **Aesthetic Experience** (How it looks)
  2.  **Art-Historical Significance** (What it did for the timeline of art)
  3.  **Provenance/Scarcity** (Economic rarity)

  A forgery fails on #2. It did not influence the 17th century; it did not solve problems for Vermeer's contemporaries. It is historically inert.
  A forgery fails on #3. It is not scarce in the right way (it's a lie about scarcity).

  **Is the Art World Hypocritical?**
  Perhaps. The art world claims to value "vision" and "beauty," but the market proves it values **narrative** and **provenance**.
  *   If you take a urinal (Duchamp's *Fountain*), it has zero craft, zero perceptual uniqueness (it's a mass-produced object). Yet it is priceless. Why? Because of the *narrative of sanction*.
  *   If you take a van Meegeren, it has high craft, high perceptual beauty. Yet it is worthless. Why? Because the *narrative is a lie*.

  This suggests the implicit theory of the art world is actually **Narrative Essentialism**. The physical object is merely a prop for a story about human creativity.
  *   **Vermeer Story:** "Genius emerges in the Dutch Golden Age." (Valuable)
  *   **van Meegeren Story:** "Conman tricks Nazis and critics." (Interesting historically, but worthless as *Vermeer*).
  *   **LeWitt Story:** "Idea transcends execution." (Valuable)

  ### Summary

  To answer your specific prompt:

  1.  **What theory does the forgery panic presuppose?**
      It presupposes that an artwork is an **embodied action**, not just a physical object. Aesthetic value is cognitively dependent on the belief in the work's genesis. We value the *achievement* of the specific artist in their specific context, not just the resulting visual stimulus.

  2.  **Is the art world inconsistent regarding Conceptual Art and Photography?**
      No, provided you shift the definition from "physical uniqueness" to **"authorized instantiation."**
      *   In painting, authorization requires the artist's hand.
      *   In conceptual art, authorization requires the artist's instruction/certificate.
      *   In photography, authorization requires the artist's approval of the print/edition.
      In all three, a violation of authorization (forgery) destroys the value. The medium changes *how* authorization is verified, but not *that* it is required.

  3.  **The Catch:**
      The art market conflates this **Artistic Value** (which relies on honest agency) with **Economic Value** (which relies on scarcity). The van Meegeren case shows that without the honest agency, the economic value evaporates, even if the perceptual beauty remains. This suggests that for the art world, **truth is a higher aesthetic category than beauty.** A beautiful lie is aesthetically inferior to an ugly truth, because the lie breaks the communicative contract between artist and viewer that defines the art experience.

  You are studying the moment where aesthetics collides with ethics. The forgery is punished not because it isn't beautiful, but because it is a lie. The art world, it turns out, is a moral community masquerading as a sensory one.
