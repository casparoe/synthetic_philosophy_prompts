          *   *Red Light (The Copy Problem):* Locke emphasizes *sameness* of consciousness, not just similarity. If uploading creates a copy while the original lives, Locke might say there are now two persons.
          *   *Red Light (Gradualism):* The user's specific worry. Locke focuses on the *appropriation* of past actions. Gradual replacement preserves the *flow* of consciousness better than a sudden jump. Locke would likely favor gradualism *if* consciousness remains continuous. But the Prince/Cobbler case is a "jump."
