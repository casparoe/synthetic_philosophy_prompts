answer: |-
  This is a fantastic project. Adversarial collaboration in philosophy is rare, and the "Badness of Death" debate is notoriously prone to talking past one another (often because the two sides are operating with different implicit definitions of "harm" and "welfare").

  Below is a draft of the Joint Statement. I have designed the **Agreed Claims** to be non-trivial constraints on the theory (ruling out easy outs), and the **Disagreements Table** to isolate the metaphysical vs. psychological components of the debate. I have also included the **Crux Analysis** you requested, specifically addressing the Lucretian symmetry and the potential verbal dispute.

  ***

  # Joint Statement on the Badness of Death
  **Prepared for the Department of Philosophy Panel on Mortality and Value**
  **Participants:** [Epicurean Name] & [Deprivationist Name]

  ## Section 1: Agreed Substantive Claims
  *The following claims represent points of convergence that constrain our respective theories. We both accept that any adequate account of death must accommodate these intuitions or explain them away systematically.*

  1.  **The Counterfactual Constraint:** The putative badness of a specific death is dependent on the quality of the life that would have followed had death not occurred.
      *   *Implication:* If a person's future life would have contained net suffering or neutral value, their death is not bad (even for the Deprivationist). If a person's future life would have contained net goods, the *pressure* to call death "bad" is highest (even for the Epicurean, who must explain why this intuition is mistaken).
  2.  **The Timing Puzzle:** Both sides acknowledge that locating the precise time at which death harms the decedent is metaphysically problematic.
      *   *Implication:* The Deprivationist admits it is difficult to pinpoint *when* the subject is worse off (since they do not exist). The Epicurean admits it is difficult to explain why the *moment* of death seems significant if the state of non-existence is what matters. We agree that standard models of "event-based harm" struggle here.
  3.  **The Distinction between "Bad for the Decedent" and "Bad Simpliciter":** We agree that death can be a tragedy, a loss of potential value, and harmful to survivors, society, and the decedent's projects, without necessarily being *bad for the decedent's welfare*.
      *   *Implication:* The debate is strictly limited to the **Self-Regarding Claim**: "Is death bad *for the one who dies*?" We agree that answering "No" does not entail that death is unimportant.
  4.  **The Relevance of Consciousness:** We agree that the capacity for consciousness is a necessary condition for *experiencing* value, but we disagree on whether it is a necessary condition for *possessing* welfare.
      *   *Implication:* This isolates the disagreement to the nature of welfare (experiential vs. objective/comparative) rather than the biology of death.

  ## Section 2: Map of Disagreements

  | (a) Precise Issue | (b) Epicurean Formulation | (c) Deprivationist Formulation | (d) Judgment on Status |
  | :--- | :--- | :--- | :--- |
  | **The Existence Condition**<br>*(Must a subject exist to be harmed?)* | **Yes.** A state of affairs can only be bad for a subject $S$ if $S$ exists at the time the badness obtains. Non-existence precludes the subject-predicate relation required for harm. | **No.** A state of affairs can be bad for $S$ if it makes $S$'s total life history worse than it otherwise would have been, regardless of $S$'s existence at the time of the comparison. | **Genuine Meta-Ethical Crux.** This is the foundational disagreement about the nature of "good for." |
  | **The Experience Requirement**<br>*(Must harm be felt?)* | **Yes.** Harm requires a negative phenomenological state (or the disposition to have one). If there is no experience, there is no harm. | **No.** Harm is a setback to interests. Interests can be set back without the subject's knowledge (e.g., posthumous betrayal, unseen deprivation). | **Downstream of Existence Condition.** If you reject the Existence Condition, you likely reject the Experience Requirement. |
  | **Lucretian Symmetry**<br>*(Is prenatal non-existence relevantly similar to post-mortem?)* | **Yes.** Both are states of non-existence. To fear one but not the other is irrational asymmetry. The "direction" of time is irrelevant to the subject. | **No (or Irrelevant).** Even if the *state* is symmetric, our rational concern is time-biased toward the future. We care about the loss of *future* goods, not past ones. | **Psychological/Downstream.** This is a rhetorical weapon dependent on the Existence Condition. |
  | **Definition of "Bad For"**<br>*(What does the phrase mean?)* | **Experientialist:** "Bad for $S$" means "$S$ suffers negatively." | **Comparativist:** "Bad for $S$" means "$S$ is worse off in world $W1$ than in world $W2$." | **Partially Verbal.** See Section 3. |

  ## Section 3: Crux Analysis & Evidentiary Tests

  ### 1. The Primary Crux: The Existence/Experience Requirement
  This is the engine of the disagreement. The Epicurean holds a **Presentist/Experiential** view of welfare (you must be here to feel it). The Deprivationist holds a **Comparativist/Objective** view of welfare (you can be worse off even if you don't feel it).

  *   **Is this merely verbal?**
      *   *Assessment:* Partially. If the Epicurean defines "bad for" strictly as "experienced suffering," and the Deprivationist defines it as "lower welfare score," they are agreeing on the facts but disagreeing on the label.
      *   *Why it's still substantive:* The Deprivationist argues that the *ordinary concept* of "bad for" includes things like betrayal behind one's back or death itself. The Epicurean argues the ordinary concept is confused. The dispute is over **conceptual analysis of welfare**, not just dictionary definitions.
  *   **Agreed Test Case: Posthumous Betrayal.**
      *   *Scenario:* A spouse is faithfully married for 40 years, dies, and is immediately betrayed by the partner the next day. The deceased never knows.
      *   *Epicurean Prediction:* This is not bad for the deceased. No subject exists to experience the betrayal.
      *   *Deprivationist Prediction:* This is bad for the deceased. It violates the terms of their life-interests and renders part of their life history (the trust) based on a falsehood.
      *   *Agreed Evidentiary Weight:* Both sides agree that our *intuition* here is the testing ground. If intuition strongly says "that poor bastard," the Epicurean must explain the error theory. If intuition says "he doesn't know, so it doesn't matter," the Deprivationist loses ground.

  ### 2. The Lucretian Symmetry Point
  *   **Status:** **Downstream Consequence.**
  *   **Analysis:** This is not a separate metaphysical crux. It is a *reductio* argument employed by the Epicurean.
      *   If you accept the **Existence Condition** (Epicurean), Symmetry follows automatically (Non-existence = Non-existence).
      *   If you reject the **Existence Condition** (Deprivationist), you have the tools to break the symmetry (e.g., via the "Time-Bias" argument: we naturally care more about future goods than past goods).
  *   **Conclusion:** Resolving the Existence Condition resolves the Symmetry debate. We do not need a separate test for this; it falls where the primary crux falls.

  ### 3. Proposed Path Forward for the Panel
  To avoid talking past each other, we agree to frame the debate not as "Is death bad?" but as:

  > **"Is the 'Comparative Account' of Welfare (Deprivationism) or the 'Experiential Account' of Welfare (Epicureanism) more faithful to our considered judgments about value?"**

  *   **The Epicurean's Burden:** Explain why the intuition that "a 20-year-old dying is worse than a 90-year-old dying" is an illusion, without making it seem like we don't care about people.
  *   **The Deprivationist's Burden:** Explain how a subject can be harmed at time $T$ when they do not exist at time $T$, without invoking mystical properties.

  ***

  ### Notes for the Moderator (You)

  **1. On the "Verbal Dispute" Warning:**
  I flagged the definition of "Bad For" as *Partially Verbal* in the table. This is the danger zone.
  *   **Risk:** The Epicurean says, "He isn't suffering!" The Deprivationist says, "He's worse off!" They both nod and think they've won.
  *   **Intervention:** If you hear this, stop them. Ask: *"Are you disagreeing about whether the person's welfare total is lower, or just about whether we should use the word 'harm' to describe that lower total?"* If they agree the welfare total is lower (Epicureans usually admit the *goods* are lost, they just deny it's *bad for the subject*), then the disagreement is purely about the **Subject-Requirement**. Force them to fight on *that* hill.

  **2. On Lucretius:**
  The Deprivationist will try to dismiss Lucretius as "psychologically implausible." The Epicurean will treat it as "logically necessary."
  *   **Your Move:** Remind the audience (and panelists) that Lucretius is only fatal to the Deprivationist if the Deprivationist cannot justify **Time Bias**. If the Deprivationist can argue that "caring about the future but not the past" is rational (which most people think it is), Lucretius fails. Don't let the Epicurean treat Lucretius as a checkmate; it's only an opening gambit.

  **3. The "Timing Problem" as Common Ground:**
  Use Section 1, Claim #2 to humanize them. Both sides look silly trying to explain *when* the harm happens.
  *   Epicurean: "It never happens!" (Counter-intuitive)
  *   Deprivationist: "It happens... when he would have been reading a book?" (Metaphysically spooky)
  *   Acknowledging that *both* theories have a "weirdness" cost levels the playing field. It's not about who has no problems; it's about who has the *better* problems.
