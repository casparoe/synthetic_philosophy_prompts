  The Martian behaves exactly the same,
  He withdraws his hand to avoid the pain,
  He speaks of how the burning makes him feel,
  No carbon chains inside to spark and fire,
  Yet he fulfills the avoidance causal role,
  You dismiss him as merely different stuff.

  We swap the neurons for the silicon stuff,
  One by one until the brain is not the same,
  The input-output map holds fast its role,
  Does the subject wake and claim a new distinct pain?
  Or do the circuits hum and still fire,
  And if he screams, deny that he can feel?

  You say unless the biology can feel,
  It is just hollow mimicry and stuff,
  You wait for ions and not chips to fire,
  Insisting that the vehicle must be same,
  As if the meat defines the nature of pain,
  And not the abstract computational role.

  The mind is defined by the causal role,
  Not by the wetness of the way we feel,
  If the structure maps the structure of the pain,
  Why privilege the carbon over stuff?
  The pattern stays invariant though not same,
  In material, the signals still must fire.

  Let the wetware or the hardware fire,
  So long as each maintains the proper role,
  The experience remains qualitatively same,
  Regardless of the medium used to feel,
  Do not confuse the vessel with the stuff,
