answer: |-
  This is one of the most profound puzzles in legal philosophy, often referred to as the **paradox of constitutional amendment** or the problem of **self-embracing sovereignty**. You have identified the tension between the *procedural* supremacy of the amendment rule and the *substantive* supremacy of the eternity clause.

  To answer your request, I will reconstruct the jurisprudential architecture that makes sense of this practice, distinguish its logical necessities from its ideological companions, and map the theoretical rivalries that leave the practice underdetermined.

  ### 1. Reconstructing the Implicit Theory

  The practice of judicial enforcement of eternity clauses presupposes a specific theory of constitutional authority: **The Distinction Between Constituent and Constituted Power.**

  **The Core Distinction**
  The theory holds that there are two distinct types of legal authority at play:
  1.  **Constituent Power (*Pouvoir Constituant*):** The original authority that creates the constitutional order (usually "the People" in a founding moment). This power is unlimited and creates the framework.
  2.  **Constituted Power (*Pouvoir Constitué*):** The authority established *by* the constitution (Parliament, the Amendment Procedure). This power is limited, derivative, and operates *within* the framework.

  **The Logical Resolution of the Knot**
  Your puzzle arises if we view the amendment procedure as the "highest rule." The implicit theory rejects this. It posits that the amendment procedure is merely a *competence* granted by the constitution, not the source of the constitution's validity.
  *   **The Eternity Clause** is not treated as an ordinary rule subject to the amendment procedure. It is treated as a **condition of validity** for the amendment procedure itself.
  *   **The Parliament's Action:** If a parliament uses the amendment procedure to repeal the eternity clause, the theory says they are attempting to exercise *constituent* power using *constituted* machinery. They are trying to pull themselves up by their own bootstraps.
  *   **The Verdict:** Under this theory, they have not "amended" the constitution; they have attempted a **legal revolution** or a usurpation. They have broken the constitution because they exceeded the jurisdiction granted to them by the constituent power.
  *   **The Court's Authority:** The court is authorized not merely by the text, but by its role as the guardian of the *identity* of the legal system. It asserts that the amendment power is structurally incapable of destroying the foundations that give it existence.

  ### 2. Strict Presuppositions vs. Compatible Narratives

  It is crucial to separate what is logically required to make this practice work from the ideological stories we tell to justify it.

  **What is Strictly Presupposed (The Logical Minimum)**
  1.  **Hierarchical Validity:** The legal system must accept that some norms condition the validity of others. The eternity clause is a second-order rule (a rule about rules) that restricts the first-order rule (the amendment procedure).
  2.  **Institutional Competence:** There must be an institution (the Court) empowered to review the *substance* of amendments, not just the *procedure*.
  3.  **Identity Continuity:** The theory presupposes that the legal system has an "identity" that persists over time. If the protected articles (e.g., federal structure, fundamental rights) are removed, the theory claims the *current* constitution ceases to exist and a *new* one begins. Therefore, the old amendment procedure cannot be used to birth the new constitution.

  **What Merely "Fits Well" (Ideological Add-ons)**
  1.  **Natural Law:** Many argue eternity clauses protect "inalienable rights." This fits well, but is not strictly necessary. A constitution could eternally protect a state religion or a specific economic system without invoking natural law.
  2.  **Democratic Pre-commitment:** The idea that "the People" bound their future selves to protect democracy. This is a popular political justification, but the legal logic works even without this democratic narrative (e.g., in monarchical or technocratic contexts).
  3.  **Moral Progress:** The assumption that the protected rights are objectively "good." The legal mechanism functions regardless of the moral quality of the protected clauses; it functions on the basis of *entrenchment*, not *truth*.

  ### 3. Philosophical Underdetermination

  This is the most critical part of your inquiry. The practice of enforcing eternity clauses is **philosophically underdetermined**. Several rival theories of legal validity can account for the practice equally well, but they disagree on *why* the court is right.

  **Rival Theory A: Hard Positivism (Hartian)**
  *   **Explanation:** H.L.A. Hart's "Rule of Recognition" is the ultimate criteria for validity in a legal system. If the officials (judges, parliamentarians) accept the eternity clause as part of the ultimate Rule of Recognition, then it is law.
  *   **Why the Court Wins:** The court strikes down the amendment because the ultimate social rule accepted by officials says, "Amendments violating the eternity clause are null."
  *   **Implication:** The eternity clause is valid simply because the legal culture says it is. It is a social fact, not a moral truth.

  **Rival Theory B: Normativism (Kelsenian)**
  *   **Explanation:** Hans Kelsen's "Grundnorm" (Basic Norm) validates the whole system.
  *   **Why the Court Wins:** The Grundnorm validates the original constitution. The amendment power is a lower norm. A lower norm cannot contradict a higher norm. If the amendment destroys the core, it loses its connection to the Grundnorm.
  *   **Implication:** The system is a logical hierarchy. The court preserves the logical coherence of the system.

  **Rival Theory C: Constitutional Essentialism (The "Basic Structure" Doctrine)**
  *   **Explanation:** Associated with the Indian Supreme Court (*Kesavananda Bharati*) and German Constitutional Court.
  *   **Why the Court Wins:** The constitution has an invisible "basic structure" that is inherent to its nature. The eternity clause is just an explicit marker of this implicit structure.
  *   **Implication:** Even without an eternity clause, some things might be unamendable because they define the constitution's essence. The text is secondary to the structural logic.

  **Rival Theory D: Decisionism (Schmittian)**
  *   **Explanation:** Carl Schmitt argued that legal norms cannot bind the sovereign political will.
  *   **Why the Court Wins (or Loses):** This theory suggests the practice is a **fiction**. If Parliament truly has the political will (and the 2/3 majority), they are the sovereign. If the court stops them, it is not because of "law," but because the court has more political power in that moment.
  *   **Implication:** The "logical knot" is real and insoluble. The outcome is determined by power, not validity.

  ### 4. Confidence Assessment

  **High Confidence (90%+): The Constituent/Constituted Distinction**
  I am highly confident that the practice *requires* a distinction between the power that makes the constitution and the power that operates under it. Without this distinction, the eternity clause is logically incoherent (a rule binding the rule-maker). Every successful judicial enforcement of an eternity clause implicitly relies on this hierarchy.

  **Medium Confidence (70%): The Underdetermination**
  I am moderately confident that the rival theories (Positivism vs. Essentialism) are truly indistinguishable in practice. In a specific case, a judge might use Positivist language ("The Rule of Recognition says...") or Essentialist language ("The spirit of the Constitution demands..."), but the outcome is the same. However, in a crisis, these theories might diverge (e.g., if the "People" demand a change via referendum).

  **Low Confidence / The Point of Least Certainty (50%): The Source of the Court's Authority in a Positivist Framework**
  This is the point I am least sure of: **Can a strictly Positivist theory fully justify the court's authority without smuggling in moral assumptions?**

  *   **The Problem:** If the Rule of Recognition is based on what officials *accept*, what happens if Parliament (elected by the people) accepts the repeal of the eternity clause, but the Court does not? Who represents the "official" acceptance?
  *   **The Uncertainty:** If the Parliament follows the text perfectly, and the Court strikes it down based on an "eternity" clause, the Court is essentially saying, "The text you followed is not the ultimate rule." In Positivist terms, the Court is changing the Rule of Recognition.
  *   **Why I am unsure:** It is unclear whether the Court is *applying* the existing law or *making* new law by asserting that the eternity clause trumps the amendment procedure. If the amendment procedure is the only written mechanism for change, the Court's intervention looks like a "legal coup" from a strict Positivist view. I am uncertain whether there is a coherent Positivist explanation that doesn't eventually rely on a non-positivist claim (e.g., "Some values are too important to be voted away").

  ### Summary Conclusion

  The practice presupposes that the Constitution is not just a set of rules, but a **system with an identity**. The amendment procedure is a key to the house, but the eternity clause says, "This key cannot be used to burn the house down."

  If Parliament tries to burn the house down using the key, the theory says they are no longer using the key as intended; they are wielding an axe. The Court's authority rests on the claim that it can distinguish between the use of a key and the swing of an axe.

  However, **where the practice is underdetermined** is in the *source* of that distinction. Is it because the social rule says so (Positivism)? Because the logic of norms demands it (Kelsen)? Or because certain rights are morally inviolable (Natural Law)? The legal practice works regardless of the answer, but the philosophical foundation remains contested. My least certain point is whether a purely descriptive theory of law (Positivism) can sustain this practice without collapsing into the very moral realism it seeks to avoid.
