answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who has waded as deeply into the literature as you have. I share your sense of fatigue, and more importantly, I share your suspicion that we are dealing with a structural impasse rather than a temporary gap in our theorizing. You are asking for a diagnosis of the disagreement itself, and I think that is precisely where the field needs to focus if we are to make any genuine headway. When we strip away the specific case variations and the proliferating acronym-laden theories, what remains is a foundational tension within our moral conceptual scheme that the nonidentity problem exposes with surgical precision.

  To start with what is genuinely settled among those of us working in this niche, there is broad agreement on the counterfactual structure of the standard cases. We agree that in paradigmatic nonidentity scenarios, the choice of action determines which particular individual comes into existence, and we agree that the individual who exists has a life worth living, even if it is flawed. There is also consensus that the person-affecting restriction, which holds that an act can be wrong only if it makes some particular person worse off than they would otherwise have been, yields the counterintuitive result that no wrong is committed in these cases. Conversely, there is agreement that impersonal views, which evaluate outcomes based on the total or average value of states of affairs regardless of who occupies them, avoid this specific counterintuitive result but often fall prey to the Repugnant Conclusion or other mereological paradoxes. This trade-off is the settled landscape upon which the debate plays out. What remains fiercely contested is whether this trade-off is acceptable, whether one horn of the dilemma can be dulled through conceptual refinement, or whether the dilemma itself signals a deeper failure in our ethical frameworks.

  Regarding your question about the kind of disagreement this is, I am inclined to think it is not merely verbal, though terminology plays a role. When philosophers argue over the definition of harm, such as whether one can be harmed by being caused to exist in a suboptimal state, they are not just quibbling over words. They are attempting to preserve different normative commitments. The person-affecting theorist is trying to preserve the intuition that morality is essentially relational, grounded in claims that specific individuals can make against one another. The impersonal theorist is trying to preserve the intuition that morality is fundamentally about making the world better, regardless of the identity of the beneficiaries. The disagreement is substantive because it reflects a clash between two plausible but incompatible pictures of the point of moral evaluation. It is similar to the deontological-consequentialist divide, but sharpened by the fact that the nonidentity problem removes the usual overlap where these views converge on same-person choices.

  You also asked whether there is a hidden metaphysical question doing the work, specifically regarding existence across possible worlds. This is a keen observation, but most specialists would argue that the metaphysics is not the primary engine of the impasse. The standard debate assumes a Kripkean origin essentialism where the identity of a person is fixed by their actual genetic origins, meaning the person in the nonidentity case literally would not exist in the alternative scenario. While some have tried to dissolve the problem by challenging this metaphysical assumption, perhaps by adopting a counterpart theory or a more flexible view of transworld identity, these moves are generally seen as costly or ad hoc. The real work is being done by normative assumptions about comparability. The impasse turns on whether we believe moral comparisons require a common subject across the compared worlds. If you think moral status attaches to persons, the comparison fails. If you think moral status attaches to outcomes or slots in a population, the comparison succeeds. This is not a metaphysical dispute about whether the person exists in the other world, but a normative dispute about whether their nonexistence in the other world matters for the evaluation of the act.

  So, what counts as progress given this diagnosis? I doubt we will see a formal result that solves the problem in the way a mathematical proof solves an equation, largely because the inputs are intuitive judgments rather than axioms. However, there has been progress in mapping the boundaries of the impossible. Gustaf Arrhenius's impossibility theorems have been crucial here, demonstrating formally that no theory can satisfy a set of seemingly adequate conditions simultaneously. This shifts the burden from finding the perfect theory to deciding which condition we are willing to drop. Progress, then, looks less like a solution and more like a clearer understanding of the costs associated with each theoretical option. We are moving toward a recognition that population ethics might require a pluralistic account or a concession that our moral concepts are indeterminate in these extreme cases.

  Some colleagues argue that we should accept the person-affecting view and bite the bullet on nonidentity cases, claiming our intuition that the child is wronged is an illusion generated by conflating different cases. Others argue we must accept the impersonal view and live with the Repugnant Conclusion, hoping to mitigate its force through qualitative distinctions. A third group, which I find increasingly compelling, suggests that the problem indicates a limitation in the scope of reflective equilibrium. It may be that our folk moral concepts evolved to handle interactions among existing contemporaries and simply lack the structure to handle nonidentity choices without contradiction. If this is right, progress involves acknowledging that we may need to construct new moral concepts rather than discover the true meaning of old ones. We might need to distinguish between being wronged and being the victim of a wrongful act, or develop a notion of collective responsibility that does not rely on individual harm.

  Ultimately, I suspect you are correct that the debate has the structure of something that cannot be fully resolved within our current conceptual framework. The nonidentity problem is not a puzzle to be solved but a symptom of a deeper tension between the agent-relative constraints we feel in our interpersonal dealings and the agent-neutral demands we feel regarding the state of the world. Recognizing this does not mean we should stop working on it, but it does mean we should stop expecting a consensus solution that leaves all our pre-theoretical intuitions intact. The most honest progress we can make is to articulate clearly which intuitions we are sacrificing and why, rather than pretending we have found a way to save them all. I hope this helps clarify where I see the field standing, and I would be very interested to hear if you think this diagnostic approach offers a viable path forward for your own work.

  Best wishes,

  A Colleague
