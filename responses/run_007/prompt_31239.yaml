prompt: |-
  Hey, I'm taking an epistemology class and we just finished a unit on norms of assertion — basically, what standard you have to meet for it to be ok to assert something. We read the main views: the knowledge norm (you should only assert what you know), the truth norm (you should only assert what's true), and the belief norm (you should only assert what you believe).

  I've been trying to apply these to a real-world practice and I keep getting stuck on Wikipedia. Wikipedia's core content policy is basically that information needs to be verifiable from reliable published sources, and they explicitely say that truth isn't the standard for inclusion. So editors will write stuff into articles that they personally think is false, as long as there's a citation to a reliable source. And they'll remove stuff that's obviously true if no reliable source has published it.

  What norm of assertion does Wikipedia's practice presuppose? Because it doesn't seem to fit any of the three we studied. It's not knowledge — the article ends up asserting things nobody knows, and might even be false. It's not truth — the policy literally says truth isn't the standard. And it's sort of not belief either — editors are supposed to follow the sources, not their own beliefs about what's true.

  Is there some other norm of assertion at work here — maybe something about delegated epistemic authority, or about what an institution is entitled to assert versus what an individual is entitled to assert? Or is Wikipedia just not really in the business of "asserting" things, so the whole question is confused?

  Please think through this carefully, like a professional epistemologist would. I'd love if you start by saying what each of the three main norms would predict about Wikipedia's practice, then try to reconstruct whatever norm you think is actually implicit in the verifiability policy, and then tell me whether that norm is coherent and defensible. Also curious what would have to change if Wikipedia switched to a knowledge norm or a truth norm — like, what specific practices would have to be different?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Epistemology class, unit on norms of assertion (Knowledge Norm, Truth Norm, Belief Norm).
      *   **Problem:** Applying these norms to Wikipedia's "Verifiability" policy (WP:V).
      *   **Observation:** Wikipedia explicitly rejects truth as a standard ("Wikipedia is not a publisher of original thought," "Verifiability, not truth"). Editors assert things they might believe are false (if sourced) and remove things they believe are true (if unsourced).
      *   **Task:**
          1.  Analyze Wikipedia's practice through the lens of the three main norms (Knowledge, Truth, Belief).
          2.  Reconstruct the implicit norm actually at work in Wikipedia's policy.
          3.  Evaluate the coherence and defensibility of this reconstructed norm.
          4.  Consider counterfactuals: What would change if Wikipedia adopted a Knowledge or Truth norm?
      *   **Tone/Style:** Professional epistemologist, careful reasoning, structured argument.

  2.  **Deconstruct the Three Standard Norms vis-à-vis Wikipedia:**
      *   *Knowledge Norm (KN):* Assert $p$ only if you know $p$.
          *   Wikipedia problem: Editors often assert $p$ without knowing $p$ personally. They rely on sources. Also, the collective "voice" of Wikipedia doesn't have mental states required for knowledge.
      *   *Truth Norm (TN):* Assert $p$ only if $p$ is true.
          *   Wikipedia problem: WP:V explicitly says "Truth is not the standard." They assert $p$ based on reliable sources even if $p$ turns out false (e.g., outdated scientific consensus). They remove true $p$ if unsourced.
      *   *Belief Norm (BN):* Assert $p$ only if you believe $p$.
          *   Wikipedia problem: Neutral Point of View (NPOV) requires reporting views editors might disagree with. Editors act as scribes, not believers.

  3.  **Identify the Implicit Norm (The "Wikipedia Norm"):**
      *   What *is* the standard? It's "Verifiability from Reliable Sources."
      *   How do we phrase this as a norm of assertion?
      *   *Candidate 1:* Assert $p$ only if $p$ is published in a reliable source.
      *   *Candidate 2:* Assert $p$ only if $p$ is *attributable* to a reliable source. (Crucial distinction: Wikipedia often uses attribution like "According to X..." rather than bare assertion "X is true.")
      *   *Candidate 3:* Institutional/Delegated Norm. The assertion isn't made by the editor, but by the *institution* based on *procedural justification*.
      *   *Refinement:* It looks like a **Justified Assertibility Norm based on Institutional Procedure**. Or, more specifically, a **Norm of Attributed Reportage**.
      *   *Key Epistemic Concept:* *Testimonial Authority* and *Social Epistemology*. Wikipedia functions as a aggregator of testimony, not a primary knower.
      *   *Proposed Norm:* **The Norm of Reliable Attribution.** One should assert $p$ (in the encyclopedia context) only if $p$ is endorsed by a reliable third-party source.
      *   *Wait, is it assertion?* This is the user's second question. Is Wikipedia asserting? Or is it reporting assertions?
      *   *Nuance:* Wikipedia sentences often look like bare assertions ("The earth is round"). But the *warrant* is the citation. So it's an assertion *backed by citation*.
      *   *Best formulation:* **The Norm of Documented Consensus.** Assert $p$ only if $p$ reflects the prevailing view of reliable literature.

  4.  **Evaluate Coherence and Defensibility:**
      *   *Coherence:* Is it internally consistent? Yes, it prioritizes stability and checkability over metaphysical accuracy. It avoids the "editor as oracle" problem.
      *   *Defensibility:* Is it *good*?
          *   *Pros:* Prevents original research, reduces bias, creates a stable record of public discourse.
          *   *Cons:* Can cement falsehoods (if sources are wrong), lags behind cutting-edge truth (if sources haven't caught up), creates "citation circles."
      *   *Epistemic Status:* It shifts the goal from *first-order knowledge* (knowing the world) to *second-order knowledge* (knowing what is said about the world).

  5.  **Counterfactuals (Switching Norms):**
      *   *Switch to Truth Norm:* Editors would need to verify facts independently. "Original Research" would be encouraged. Chaos, bias, liability issues.
      *   *Switch to Knowledge Norm:* Editors would need to personally know the facts. Impossible for a crowdsourced project. Would shrink to a small expert board.
      *   *Current System:* Keeps editors as *curators* rather than *knowers*.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. It touches on social epistemology and institutional speech acts.
      *   *Section 1: The Three Standard Norms applied to Wiki.*
          *   KN: Fails because editors don't know, and "Wiki" doesn't have a mind.
          *   TN: Fails because WP:V explicitly rejects it.
          *   BN: Fails because of NPOV (reporting views one disagrees with).
      *   *Section 2: Reconstructing the Wikipedia Norm.*
          *   It's not about the *proposition's* status (true/known) but the *provenance*.
          *   Call it the **Norm of Attributable Assertibility**.
          *   Distinguish between *bare assertion* and *reported assertion*. Wikipedia mostly does the latter, even if grammatically it looks like the former.
          *   Connect to *Social Epistemology* (Goldman, Lackey, etc.). It's about tracking reliable testimony.
      *   *Section 3: Coherence and Defensibility.*
          *   Coherent? Yes, it serves the goal of an *encyclopedia* (summary of existing knowledge) vs. a *truth-discovery engine*.
          *   Defensible? Pragmatically yes, epistemically mixed. It sacrifices truth-tracking for reliability/accountability.
      *   *Section 4: Counterfactuals.*
          *   Truth Norm: "Original Research" allowed. High risk of error/bias.
          *   Knowledge Norm: Only experts. No crowdsourcing.
      *   *Conclusion:* Wikipedia isn't a standard assertoric agent. It's a *curatorial* agent. The norm is about *warranted assertibility based on social testimony*.

  7.  **Refining the Epistemic Terminology:**
      *   Use terms like "warranted assertibility," "testimonial chain," "institutional speech act," "deontological vs. alethic."
      *   Make sure to address the "Is it assertion?" point. Searle's institutional facts might be relevant.
      *   *Self-Correction on "Assertion":* Philosophers like MacFarlane or Brandom might argue that assertion is defined by the norms governing it. If the norm is different, is it still assertion? Maybe it's a distinct speech act: *Encoding*.
      *   *Decision:* Stick to the user's framing but nuance it. It *functions* as assertion for the reader, but the *normative base* is different.

  8.  **Final Polish:** Check tone. Ensure it sounds like a professor/TA feedback session. Structured clearly with headings. (Proceed to generate output based on these thoughts.)

      *   *Key Insight to highlight:* The shift from *alethic* norms (truth/knowledge) to *procedural/deontic* norms (following rules of evidence).
      *   *Reference:* Mention the "Verifiability, not Truth" policy explicitly.
      *   *Reference:* Mention "No Original Research."

  9.  **Final Review against constraints:**
      *   Start with the three norms.
      *   Reconstruct the implicit norm.
      *   Evaluate coherence/defensibility.
      *   Discuss counterfactuals (Truth/Knowledge switch).
      *   Professional epistemologist tone.

      *(Self-Correction during drafting)*: I need to be careful not to say Wikipedia *never* asserts truths. It does. But the *norm* governing the assertion isn't truth *per se*, it's sourcing. The truth is a byproduct, not the gatekeeper.

      *(Refining the "Norm" name)*: Let's call it the **Norm of Documented Consensus** or **Norm of Reliable Testimony**. "Norm of Reliable Testimony" fits best with social epistemology.

      *(Addressing the "Assertion" question)*: I should explicitly tackle whether Wikipedia is asserting. It's a collective institutional voice. The "assertion" is arguably *attributed*. "According to X, P." But often it's written as "P [citation]." This is a *backed assertion*.

      *Okay, ready to write.*
answer: |-
  This is a fantastic question. You have identified a genuine tension between standard analytic epistemology—which tends to focus on individual speakers and propositional attitudes—and the social epistemology of large-scale information institutions.

  Wikipedia is a fascinating edge case because it functions as a *collective epistemic agent* with a constitution (its policies) that explicitly overrides standard individual epistemic norms.

  Let's break this down systematically, starting with how the three standard norms fare against Wikipedia's actual practice, then reconstructing the specific norm Wikipedia actually employs, and finally evaluating its coherence and the implications of changing it.

  ### 1. The Three Standard Norms Applied to Wikipedia

  If we take the standard norms of assertion literally, Wikipedia's practice looks like a systematic violation of all three.

  **The Knowledge Norm (KN): *Assert $p$ only if you know $p$.***
  *   **Prediction:** Editors should only add content they personally know to be true.
  *   **Wikipedia Reality:** This is explicitly forbidden under the "No Original Research" policy. An editor might know $p$ is true because they witnessed it (e.g., "It is raining outside the Eiffel Tower right now"), but they cannot assert it in Wikipedia unless a reliable source has published it. Conversely, an editor can assert $p$ (e.g., a complex quantum physics claim) that they do not personally understand or "know," provided they can cite a textbook.
  *   **Verdict:** Wikipedia violates the KN. The editor is not the knower; the *source* is the knower, and the editor is a transmitter.

  **The Truth Norm (TN): *Assert $p$ only if $p$ is true.***
  *   **Prediction:** Falsehoods should be removed; truths should be included.
  *   **Wikipedia Reality:** As you noted, the policy "Verifiability, not Truth" explicitly rejects this. If a reliable source (e.g., *The New York Times* in 1920) claims something false (e.g., "There is no oxygen on Mars"), Wikipedia may assert it *as a historical claim* or even as a current claim if the consensus of sources hasn't updated. More critically, if a fact is true but no reliable source has published it (e.g., a minor biographical detail confirmed by private email), it must be removed.
  *   **Verdict:** Wikipedia violates the TN. Truth is neither necessary (unsourced truths are out) nor sufficient (sourced falsehoods are often in, at least until corrected by other sources).

  **The Belief Norm (BN): *Assert $p$ only if you believe $p$.***
  *   **Prediction:** Editors should not assert things they think are false.
  *   **Wikipedia Reality:** The "Neutral Point of View" (NPOV) policy requires editors to represent significant viewpoints proportionally, even if the editor believes those viewpoints are wrong. An editor who believes climate change is a hoax is required to assert the scientific consensus on climate change if that is what the reliable sources say.
  *   **Verdict:** Wikipedia violates the BN. The editor's doxastic state is irrelevant; the *source's* endorsement is what matters.

  ### 2. Reconstructing the Implicit Norm: The Norm of Reliable Attribution

  If Wikipedia isn't following KN, TN, or BN, what norm is governing its assertions?

  To understand this, we have to look at the *type* of speech act Wikipedia is performing. When an individual says, "The capital of France is Paris," they are making a first-order assertion about the world. When Wikipedia says, "The capital of France is Paris [citation]," it is performing a **second-order reportative assertion**. It is asserting that *the literature says* the capital is Paris.

  Therefore, the norm at work is not alethic (about truth) or doxastic (about belief), but **procedural and testimonial**.

  I propose we call this the **Norm of Reliable Attribution (NRA)**:
  > **Assert $p$ only if $p$ is attributable to a reliable third-party source.**

  Or, more precisely, regarding the institution's entitlement:
  > **The institution is entitled to assert $p$ if and only if $p$ reflects the prevailing consensus of reliable published testimony.**

  This norm shifts the epistemic burden from the *speaker* (the editor) to the *chain of testimony* (the sources). In social epistemology, this aligns with a **reductionist view of testimony**, where the justification for believing (or asserting) $p$ depends on the reliability of the testifier, not the immediate epistemic state of the repeater.

  **Is Wikipedia "Asserting"?**
  You asked if Wikipedia is really in the business of asserting. Under the NRA, Wikipedia is engaging in a hybrid speech act. Grammatically, it looks like assertion ("The earth is round"). Pragmatically, it functions as **endorsed reportage**. The citation marker is not just a footnote; it is a modal operator. It changes the meaning from "$p$ is true" to "$p$ is warranted by the corpus of reliable literature."

  ### 3. Coherence and Defensibility of the NRA

  Is this norm coherent? **Yes.**
  It is internally consistent because it decouples the *validity of the entry* from the *metaphysical status of the fact*. The goal of Wikipedia is not to be an oracle of truth, but to be a **summary of public discourse**. The NRA ensures that every claim can be audited. If a claim is challenged, you don't ask the editor, "How do you know?" You ask, "Where is the citation?" This makes the epistemic justification public and checkable, rather than private and mentalistic.

  Is it defensible? **Pragmatically, yes; Epistemically, with caveats.**

  *   **The Defense:** The NRA is the only norm scalable to a crowdsourced project. If you require Knowledge or Truth, you require expertise. If you require Belief, you invite bias. The NRA allows non-experts to curate expert knowledge without needing to verify the knowledge themselves. It creates a system of **distributed epistemic accountability**.
  *   **The Critique:** The NRA suffers from the **Lag Problem** and the **Citation Circle**.
      *   *Lag:* If the truth changes (e.g., a new medical discovery), Wikipedia cannot assert the truth until sources publish it. During the lag, Wikipedia asserts falsehoods (by the TN standard).
      *   *Citation Circles:* If Source A cites Source B, and Source B cites Source A, the NRA is satisfied, but no actual knowledge generation has occurred.
      *   *Systemic Bias:* If reliable sources are biased (e.g., historical underrepresentation of certain groups), the NRA codifies that bias. The norm prioritizes *verifiability* over *accuracy*, which can cement structural falsehoods.

  So, the norm is defensible as a **policy for institutional stability**, but it is not a perfect norm for **truth-tracking**.

  ### 4. Counterfactuals: What if Wikipedia Switched Norms?

  To see why the NRA is necessary for Wikipedia, consider what would happen if they adopted the standard norms you studied.

  **Scenario A: Switching to the Truth Norm (TN)**
  *   **Policy Change:** "Verifiability" is replaced with "Accuracy." Editors are encouraged to add true facts even without citations if they can prove them. "Original Research" is allowed.
  *   **Consequence:** Chaos. Wikipedia would become a blog. Every editor would claim their unsourced addition is "true." Disputes would become unresolvable because there is no arbiter other than the editor's personal conviction. The site would likely be shut down due to liability (libel, misinformation) because there is no paper trail of responsibility.
  *   **Epistemic Shift:** Wikipedia moves from a *library* (collection of records) to a *laboratory* (site of discovery). It loses its value as a reference work.

  **Scenario B: Switching to the Knowledge Norm (KN)**
  *   **Policy Change:** "Only assert what you know." Editors must demonstrate personal expertise or direct access to the fact.
  *   **Consequence:** The crowdsourcing model collapses. Most editors do not "know" the facts they edit; they read them elsewhere. To comply with KN, editors would need to be primary researchers or experts. Wikipedia would shrink from millions of articles to a small, expert-written encyclopedia (like Britannica used to be).
  *   **Epistemic Shift:** The barrier to entry becomes too high. The "wisdom of the crowd" (in terms of error-correction) is lost because only "knowers" can edit.

  ### 5. Conclusion: Institutional vs. Individual Norms

  Your intuition that this involves "delegated epistemic authority" is exactly right.

  In standard epistemology classes, we analyze the norms governing **individual agents** (S asserts that $p$). Wikipedia is an **institutional agent**. Institutions have different epistemic goals than individuals.
  *   **Individual Goal:** Share knowledge, express belief, track truth.
  *   **Institutional Goal (Wikipedia):** Maintain a stable, auditable, neutral record of public consensus.

  The norm Wikipedia presupposes is a **Norm of Institutional Warrant**. It says: *An institution may assert $p$ if $p$ is backed by the appropriate procedural credentials (citations), regardless of the internal mental states of the agents maintaining the institution.*

  This suggests that when we study the epistemology of the internet age, we may need to expand our taxonomy of assertion. We are moving from an epistemology of **knowers** to an epistemology of **curators**. Wikipedia's norm is not "Know what you say," it is "Source what you say."

  **Summary for your class:**
  Wikipedia does not follow the Knowledge, Truth, or Belief norms. It follows a **Norm of Reliable Attribution**. This norm is coherent as a procedural standard for a collective agent, prioritizing **auditability** and **consensus** over **truth** and **knowledge**. While this makes Wikipedia less effective at discovering new truths, it makes it more effective at stabilizing existing public knowledge without requiring editors to be experts. Switching to a Truth or Knowledge norm would destroy the collaborative model that makes Wikipedia possible.
