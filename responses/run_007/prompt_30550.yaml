answer: |-
  The Han van Meegeren affair remains the paradigmatic case study for the philosophy of art regarding forgery. Between 1936 and 1943, Van Meegeren produced several paintings, most notably *The Supper at Emmaus*, in the style of Johannes Vermeer. He artificially aged the canvases and fabricated provenance, successfully passing them off as newly discovered masterpieces. Leading critics, including Abraham Bredius, hailed *Emmaus* as a supreme example of Vermeer's spiritual maturity. Museums and collectors acquired the works for vast sums. Following World War II, Van Meegeren confessed to the forgeries to avoid treason charges (having sold a fake to Nazi leader Hermann Göring). He demonstrated his technique in court, proving the works were his. Immediately, the artistic esteem of the paintings collapsed. They were removed from the pedestal of high art, relegated to curiosities, and their market value plummeted, despite the fact that the physical pigment on canvas remained identical to the day they were authenticated.

  This episode forces a confrontation between competing theories of artistic value. To analyze it, we must distinguish four levels of valuation that are often conflated:
  1.  **Aesthetic Value:** The quality of the experience provided by the object's perceptible properties.
  2.  **Market Value:** The monetary price commanded by the object.
  3.  **Moral Assessment:** The ethical judgment of the creator's actions (fraud, deception).
  4.  **Expert Competence:** The reliability of the critics and authenticators.

  Below, I lay out three philosophical accounts of why originals are valued over forgeries and test them against the Van Meegeren facts, keeping these four levels distinct.

  ### I. Three Candidate Explanations

  **1. The Perceptualist View**
  This view, rooted in formalism, holds that aesthetic value supervenes entirely on observable features. If Object A (the original) and Object B (the forgery) are perceptually indistinguishable, they possess identical aesthetic value. Knowledge of origin is external to the aesthetic experience.

  **2. The Contextualist View**
  This view, associated with Arthur Danto and George Dickie, argues that the history of production is partly constitutive of the work's artistic identity. A work is not merely a physical object but an artifact embedded in an art-historical context. Changing the history (from Vermeer to Van Meegeren) changes the work itself, and thus its aesthetic properties.

  **3. The Achievement-Based View**
  This view locates value in the work as a record of a specific human performance. We value art not just for the result, but for the difficulty and creativity of the act that produced it. An original represents a breakthrough or a specific creative solution; a forgery represents a technical replication. The value lies in the nature of the feat.

  ---

  ### II. Analysis of the Van Meegeren Episode

  #### 1. The Perceptualist Account

  **Implications for Judgments:**
  *   **Before Exposure:** Critics were aesthetically correct to praise *Emmaus*. The painting possessed beauty, balance, and mastery of light.
  *   **After Exposure:** Critics and collectors were irrational to downgrade the work. Since the paint did not change, the aesthetic value remained constant.
  *   **Levels:**
      *   *Aesthetic Value:* Unchanged. The "collapse" in esteem is a psychological error, not an aesthetic reality.
      *   *Market Value:* The price drop is a market correction based on scarcity and branding, not a reflection of the object's intrinsic worth.
      *   *Moral Assessment:* Van Meegeren is a fraud, but this is irrelevant to the painting's beauty.
      *   *Expert Competence:* Experts failed on provenance (history), but their initial aesthetic judgment (that the painting was "good") remains valid.

  **Strengths and Strains:**
  *   **Handled Cleanly:** This view explains why the paintings were visually compelling enough to fool experts in the first place. It validates the intuition that "beauty is in the eye of the beholder."
  *   **Strains to Accommodate:** It cannot explain why the *experience* of looking at the painting changed after the confession. Viewers reported that the faces suddenly looked "dead" or "caricatured" once they knew it was Van Meegeren. Perceptualism must dismiss this shift as a cognitive bias rather than a legitimate change in aesthetic perception. It leaves the intense feeling of betrayal and the subsequent aesthetic dismissal unexplained, treating them as category errors.

  #### 2. The Contextualist Account

  **Implications for Judgments:**
  *   **Before Exposure:** Critics were mistaken. They attributed the work to the wrong context (Vermeer's late spiritual period). Their praise was directed at a work that did not exist (a Vermeer).
  *   **After Exposure:** The downgrading was correct. The work *became* a different object (a 1930s pastiche) when the context was corrected.
  *   **Levels:**
      *   *Aesthetic Value:* Changed. Because the context is constitutive, the aesthetic properties (e.g., "innovative" vs. "derivative") changed when the history was revealed.
      *   *Market Value:* Reflects the true artistic identity. The price drop is rational because the object is now categorized as a minor 20th-century work, not a rare 17th-century masterpiece.
      *   *Moral Assessment:* The deception is central. The work was presented under false pretenses, corrupting the "artworld" relations required for it to function as a Vermeer.
      *   *Expert Competence:* Experts failed fundamentally. They did not just miss the provenance; they misidentified the work itself.

  **Strengths and Strains:**
  *   **Handled Cleanly:** This view best explains the collapse in esteem. It accounts for why the *same* brushstrokes are read differently: as "bold" in Vermeer, they are "calculated" in Van Meegeren. The history informs the perception.
  *   **Strains to Accommodate:** It risks over-intellectualizing the visual experience. Does the canvas *really* change aesthetically, or just our *classification* of it? If a blind viewer were told it was Vermeer, then told it was Van Meegeren, the Contextualist must argue the aesthetic object changed, which seems to rely heavily on cognitive framing rather than sensory input. It also struggles to explain why Van Meegeren's own context (1930s Dutch painting) doesn't generate its own positive aesthetic value, rather than just a negative "not-Vermeer" value.

  #### 3. The Achievement-Based Account

  **Implications for Judgments:**
  *   **Before Exposure:** Critics praised an achievement that did not occur. They valued the creative leap of Vermeer solving a compositional problem in the 1660s.
  *   **After Exposure:** The downgrading is justified because the nature of the achievement changed. Van Meegeren's feat was technical imitation, not creative innovation.
  *   **Levels:**
      *   *Aesthetic Value:* Tied to the performance. The value drops because the performance (imitation) is of a lower order than the performance (innovation).
      *   *Market Value:* Pays for the rarity of the specific genius (Vermeer's). The drop reflects the loss of the "Vermeer achievement."
      *   *Moral Assessment:* Van Meegeren stole credit for an achievement. The moral wrong is the misattribution of the creative act.
      *   *Expert Competence:* Experts failed to recognize the nature of the skill. They mistook technical mimicry for creative genius.

  **Strengths and Strains:**
  *   **Handled Cleanly:** This explains why we care about *who* did it. We value the *first* time a style appears, not the *best* replication of it. It clarifies why Van Meegeren's own demonstration paintings (painted in court) are valued differently: they are records of his confession, not records of Vermeer's genius.
  *   **Strains to Accommodate:** It must explain why Van Meegeren's achievement (fooling the world for a decade) doesn't carry its own high value. If we value difficulty, forging a Vermeer is incredibly difficult. The view must argue that *creative* difficulty outweighs *technical* difficulty. It also risks conflating moral admiration for the artist with aesthetic value of the work.

  ---

  ### III. Synthesis and Position

  The Van Meegeren affair reveals that the opposition between "perceptible features" and "history of production" is too coarse to capture the complexity of artistic valuation. However, the episode ultimately confirms a nuanced **Contextualist view**, provided we understand context as penetrating perception rather than merely framing it.

  **1. The Failure of Pure Perceptualism**
  The Perceptualist view fails to account for the *phenomenology* of the exposure. When the forgery was revealed, viewers did not simply intellectually reclassify the object; they reported seeing it differently. The "magic" vanished. If aesthetic value were truly confined to the retinal image, knowledge of the forgery should be as irrelevant to aesthetic judgment as knowing the chemical composition of the paint. The fact that it is not suggests that aesthetic experience is cognitively penetrated. We see *actions* in the brushstrokes, not just shapes. When we think we see Vermeer's action, we see confidence; when we know it is Van Meegeren, we see calculation. The perceptual surface is not neutral; it is read as a trace of human agency.

  **2. The Distinction of Levels**
  The Van Meegeren case demonstrates that these four levels (Aesthetic, Market, Moral, Competence) are entangled but distinct.
  *   **Moral vs. Aesthetic:** A strict Perceptualist might argue we commit the "genetic fallacy" by letting Van Meegeren's moral fraud taint the art. However, the fraud is not external to the art; it is the *mode of presentation* of the art. The deception prevents the work from functioning as a communicative act between artist and viewer. Therefore, the moral assessment (fraud) directly impacts the aesthetic context (trust/communication).
  *   **Competence:** The experts were not visually incompetent; they were historically incompetent. They correctly identified the painting as "masterful," but incorrectly identified the *source* of that mastery. This supports the Achievement and Contextual views: identifying the source is part of identifying the work.
  *   **Market:** The market collapse was not merely financial panic; it was a re-pricing based on the shift from "unique historical artifact" to "skillful replica." This aligns with the Achievement view: the market pays for the specific historical achievement, not just the visual output.

  **3. Conclusion: A Nuanced Contextualism**
  I take the position that the Van Meegeren affair confirms a **Contextualist view**, specifically one where the history of production constitutes the *aesthetic properties* themselves, not just the classification.

  Reading the "aesthetic" narrowly (as mere sensory pleasure) makes the Perceptualist view tempting but inadequate. Reading it broadly (as the experience of engaging with an artifact's intended meaning and origin) makes Contextualism unavoidable. When we look at *The Supper at Emmaus*, we are not just looking at a depiction of a meal; we are engaging with a claim about the history of art. Van Meegeren's forgery was not just a fake painting; it was a fake *art-historical event*.

  The episode shows that we value originals because they are nodes in a causal network of artistic development. A Vermeer influences the future; a Van Meegeren forgery merely mimics the past. When the context shifted, the painting ceased to be a node in the 17th-century network and became a node in a 20th-century narrative of deception. The "collapse in esteem" was not a change in the object's physics, nor a mere moral punishment of the forger. It was the recognition that the *work* we were admiring—a Vermeer—had never existed. In its place was a different work—a Van Meegeren—which, while technically proficient, lacked the artistic status of the former. Thus, the history of production is not an external label; it is the lens through which the perceptible features acquire their significance.
