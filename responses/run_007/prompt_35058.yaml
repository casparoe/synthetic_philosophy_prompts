prompt: |-
  Okay so we covered costly signaling theory in my evo psych class last week and the prof kept using this analogy: a peacock's tail is like a designer handbag or a Rolex. The idea is that in both cases you're spending a ton of resources on something that seems useless or even harmful to survival, but the very wastefulness is what makes it an honest signal — if you can afford to blow resources on that, you must be doing well. The prof then used this to argue that a lot of human status displays (expensive degrees, fancy weddings, conspicuous charity) are basically the same thing, and that the analogy shows they're "honest signals" of underlying quality.

  But I'm not sure the analogy holds up as well as he made it sound. Like, a peacock can't decide not to grow a tail — it's genetic and the cost is mandatory. Someone can definately decide to buy a fake Rolex or take out loans for a wedding they can't afford. And the peacock isn't trying to signal to other peacocks that it's rich — it's signaling fitness to peahens in a mating context, which seems pretty different from signaling to your whole social group. Plus the tail is a single trait that directly correlates with health, whereas human status symbols are culturally constructed and can shift over time.

  Can you do the correspondence table thing — what maps to what between the peacock's tail and human luxury signaling — and then walk through where the analogy breaks? And the real question: does the conclusion that human status displays are "honest signals" survive once the disanalogies are on the table, or was the analogy doing too much work? Also, the prof seemed pretty confident about this, so if you think the analogy is shaky, tell me what would change your mind the other way — what consideration or evidence would make you think "okay, actually the analogy is tighter than I thought."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Costly Signaling Theory (CST) in evolutionary psychology, specifically comparing peacock tails to human luxury goods/status displays.
      *   **User's Stance:** Skeptical of the professor's analogy. Points out key differences (genetic vs. voluntary, fakeability, audience/context, biological vs. cultural).
      *   **Tasks:**
          1.  Create a correspondence table (Peacock Tail $\leftrightarrow$ Human Luxury Signaling).
          2.  Walk through where the analogy breaks (disanalogies).
          3.  Evaluate the conclusion: Do human status displays remain "honest signals" despite the breaks?
          4.  Identify what evidence/considerations would strengthen the analogy (change my mind).
      *   **Tone:** Critical, analytical, academic but accessible, respectful of the user's skepticism (which is well-founded).

  2.  **Deconstruct the Theory (Costly Signaling Theory - CST):**
      *   *Core Premise:* Signals are honest because they are costly. Only high-quality individuals can afford the cost.
      *   *Peacock Example:* Tail is heavy, makes flying hard, attracts predators. Only a healthy, parasite-free male can grow a big one *and* survive.
      *   *Human Example:* Buying a Rolex, getting a PhD, throwing a wedding. Costs money/time/effort. Only wealthy/competent individuals can afford it.

  3.  **Drafting the Correspondence Table:**
      *   Need to map the biological mechanics to the sociological/psychological mechanics.
      *   *Signaler:* Peacock $\rightarrow$ Human.
      *   *Receiver:* Peahen $\rightarrow$ Social peers/potential mates.
      *   *Signal:* Tail feathers $\rightarrow$ Luxury goods/degrees.
      *   *Cost:* Energy/Predation risk $\rightarrow$ Money/Time/Opportunity cost.
      *   *Underlying Quality:* Genetic fitness/Parasite resistance $\rightarrow$ Wealth/Competence/Social capital.
      *   *Function:* Mating success $\rightarrow$ Status/Mating/Alliances.

  4.  **Analyzing the Breaks (Disanalogies):**
      *   *User's Point 1: Genetic vs. Voluntary.* Peacocks *must* grow tails. Humans *choose* to buy Rolexes.
          *   *Implication:* Humans can opt-out or fake it (debt, counterfeits).
      *   *User's Point 2: Audience.* Peahens only. Humans = broad social network.
          *   *Implication:* Different evolutionary pressures (sexual selection vs. social competition).
      *   *User's Point 3: Biological vs. Cultural.* Tail is universal to the species. Rolex is culturally specific.
          *   *Implication:* Signals can change rapidly in humans, slowing down evolutionary feedback.
      *   *User's Point 4: Direct vs. Indirect Correlation.* Tail health $\rightarrow$ Genetic health. Money $\rightarrow$ Inheritance/Luck/Debt.
          *   *Implication:* Money isn't always a proxy for personal competence/fitness.

  5.  **Evaluating the Conclusion ("Honest Signals"):**
      *   Does the theory survive?
      *   *Yes, but...* It's not a 1:1 map. It works better for *some* signals than others.
      *   *Hard-to-fake signals:* Extreme sports, genuine altruism (time/energy), difficult degrees (Ivy League).
      *   *Easy-to-fake signals:* Counterfeit goods, credit card debt.
      *   *Nuance:* CST in humans is often about *social* selection, not just *sexual* selection. The "cost" ensures honesty, but the "currency" is different (cultural capital vs. genetic fitness).
      *   *Verdict:* The professor oversimplified, but the core mechanism (cost ensures honesty) still holds *if* the cost is truly hard to fake.

  6.  **Identifying "Change My Mind" Evidence:**
      *   What would make the analogy tighter?
      *   *Evidence of physiological cost:* If luxury spending actually impacted health/survival directly (e.g., testosterone levels linked to spending).
      *   *Universality:* If specific types of signaling appear across all cultures (e.g., risk-taking).
      *   *Inability to Fake:* If data showed that "faking" status (debt) leads to severe reproductive/social penalties that mimic predation risk.
      *   *Developmental constraints:* If status seeking was shown to be as hormonally driven as feather growth (actually, there is some evidence for this regarding testosterone and dominance).

  7.  **Refining the Output:**
      *   *Structure:* Follow the user's prompt order (Table $\rightarrow$ Breaks $\rightarrow$ Conclusion $\rightarrow$ Change My Mind).
      *   *Voice:* Validate the user's skepticism (it's a common critique in the field). Don't just defend the prof; analyze the theory.
      *   *Key Terminology:* Handicap Principle, Zahavi, Sexual Selection vs. Social Selection, Counter-signaling.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "fake Rolex" point? Yes, crucial. Counterfeits break the "cost" requirement.
      *   *Check:* Did I address the "debt" point? Yes, debt allows low-quality signalers to mimic high-quality ones, breaking the honesty condition.
      *   *Check:* Is the distinction between sexual selection (peacocks) and social status (humans) clear? Need to emphasize that humans use status for *both* mating and coalition building.
      *   *Refinement:* Make sure to mention that CST *does* apply to humans, but the professor's specific analogy (Rolex = Tail) is the weak link, not the theory itself.

  9.  **Final Polish:** Ensure the tone is collaborative ("You're right to question this") rather than lecturing. (Proceed to generate response).

  *(Self-Correction Note)*: Wait, I need to make sure I don't dismiss CST entirely for humans. It's a valid framework, just often misapplied. I should distinguish between *Conspicuous Consumption* (Veblen) and *Costly Signaling* (Zahavi). They overlap but aren't identical. I will incorporate this distinction.

  10. **Final Plan:**
      *   Intro: Validate skepticism.
      *   Table: Map the variables.
      *   Disanalogies: Detail the 4 main breaks (Volition, Falsifiability, Audience, Correlation).
      *   Verdict: Theory survives but needs modification (Social Selection + Hard-to-fake costs).
      *   "Change My Mind": Physiological links, cross-cultural universals, penalties for faking.
      *   Closing: Summary.

