answer: |-
  To evaluate theories of truth, you must first define the "job description" that generates the paradox in the first place. An adequate theory is expected to satisfy a set of intuitive desiderata, but formal results demonstrate that these desiderata form an inconsistent set. Below are the core requirements, the impossibility results that constrain them, and an analysis of which constraint dictates the landscape of solutions.

  ### The Desiderata: A Job Description for Truth

  **1. The Unrestricted T-Schema (Naive Truth)**
  *   **Requirement:** For any sentence $\phi$, the equivalence $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$ must hold.
  *   **Justification:** This is not merely a technical preference but the conceptual core of truth. The predicate 'true' functions to disquote; to assert "It is true that snow is white" is to assert "Snow is white." If a theory systematically invalidates this equivalence for non-pathological sentences, it fails to capture the concept we actually use.

  **2. Classical Logic**
  *   **Requirement:** The logic governing the truth predicate must include the Law of Excluded Middle ($\phi \lor \neg \phi$), the Law of Non-Contradiction ($\neg(\phi \land \neg \phi)$), and the Principle of Explosion (from contradiction, anything follows).
  *   **Justification:** Classical logic is the standard infrastructure of analytic reasoning. Abandoning it incurs a massive theoretical cost, requiring the reconstruction of mathematics and ordinary inference. A theory of truth should explain the paradox without dismantling the logical framework used to formulate it, unless absolutely necessary.

  **3. Semantic Closure (Universality)**
  *   **Requirement:** The language must be able to contain its own truth predicate and refer to its own sentences (self-reference).
  *   **Justification:** Natural language is semantically closed; we say things like "This sentence is false" or "Everything I am saying is true." A theory that forbids closure (by imposing a hierarchy) may be consistent, but it fails as a model of natural language, treating human discourse as structurally deficient.

  **4. Consistency (Non-Triviality)**
  *   **Requirement:** The theory must not entail every sentence (i.e., it must not be trivial).
  *   **Justification:** The purpose of a truth predicate is to distinguish truth from falsehood. If a theory allows a contradiction to explode into triviality (where everything is true), the predicate loses its discriminatory power and becomes useless for reasoning or description.

  **5. Expressive Completeness**
  *   **Requirement:** The theory must allow for infinite generalizations, such as "Every theorem of Peano Arithmetic is true."
  *   **Justification:** The primary utility of the truth predicate is to express generalizations we could not otherwise state (due to finite length). If a theory restricts the truth predicate so severely that we cannot quantify over it (as in strict Tarskian hierarchies), it cripples the very function that makes the predicate philosophically valuable.

  ### Jointly Unsatisfiable Subsets

  You cannot satisfy all five desiderata simultaneously. The literature identifies specific "Inconsistent Multiples" that force a choice:

  *   **The Inconsistent Tetrad:** {Classical Logic, Consistency, Semantic Closure, Unrestricted T-Schema}.
      *   **Result:** The Liar Paradox derivation shows that accepting all four leads directly to a contradiction ($\lambda \leftrightarrow \neg \lambda$). In a classical, consistent, closed language, the T-Schema entails triviality.
  *   **Tarski's Undefinability Theorem:**
      *   **Result:** In any sufficiently strong formal system (like arithmetic), a truth predicate satisfying the T-Schema cannot be defined *within* that system if the system is consistent and classical. This formally proves you cannot have Semantic Closure + Unrestricted T-Schema + Classical Logic + Consistency.
  *   **Montague's Theorem:**
      *   **Result:** Extends Tarski's result to modal logic and truth, showing that even if you treat truth as a modal operator rather than a predicate, you face inconsistency if you retain classical logic and basic modal principles (necessitation) alongside the T-Schema.

  ### Negotiable Desiderata

  Since the set is inconsistent, every theory must treat at least one desideratum as negotiable.

  *   **Semantic Closure (Negotiated by Tarskians/Contextualists):** Tarski sacrifices closure by introducing a hierarchy of languages (object language vs. metalanguage). This preserves Classical Logic and Consistency but fails to model natural language directly.
  *   **Classical Logic (Negotiated by Kripkeans/Paraconsistentists):** Kripke sacrifices bivalence (LEM fails for the Liar), while Dialetheists (like Priest) sacrifice Non-Contradiction (Explosion fails). This preserves Closure and the T-Schema but requires non-classical reasoning.
  *   **The Unrestricted T-Schema (Negotiated by Revision Theorists/Contextualists):** Some theories restrict the *validity* of the T-biconditionals or treat them as context-sensitive. This preserves Classical Logic and Consistency but complicates the intuitive link between $\phi$ and $T(\phi)$.
  *   **Consistency (Negotiated by Dialetheists):** Paraconsistent approaches accept that some contradictions are true. This preserves Closure and the T-Schema but requires accepting true contradictions, which is counter-intuitive for many.

  ### The Most Restrictive Requirement

  The single requirement that does the most to narrow the field is **Classical Logic**.

  While the Unrestricted T-Schema is the *engine* of the paradox, Classical Logic is the *filter* of acceptability. Insisting on Classical Logic immediately eliminates the two largest families of direct solutions: **Paracomplete theories** (like Kripke's, which reject LEM for gaps) and **Paraconsistent theories** (like LP, which reject Explosion for gluts). This forces the theorist into the narrower corner of **Hierarchical** (Tarski), **Contextualist**, or **Revisionist** approaches, which must then perform complex maneuvers (like stratifying languages or redefining validity) to avoid inconsistency while keeping logic intact. Because Classical Logic is the default background assumption of analytic philosophy, demanding it imposes the highest structural cost on the theory's architecture.

  An adequate theory of truth must navigate the inconsistent tetrad by sacrificing at least one core intuition, with the commitment to classical logic acting as the primary filter that determines the available architectural solutions.
