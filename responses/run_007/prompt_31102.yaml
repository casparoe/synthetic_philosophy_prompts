  *Wait, one more nuance:* The prompt says "Take seriously the possibility that the senior members were right." I need to make sure the proposal doesn't imply seniority = bias. It implies seniority = *influence*. The fix is independent judgment + senior wisdom applied *after* independent judgment is formed.

