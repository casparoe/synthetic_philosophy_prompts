  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "David is wrong." Chesterton's Fence *is* about unseen consequences. David's point about cohort bonding might actually be valid even if the language skill isn't. I should acknowledge that *hidden functions* exist, but critique his *method* of invoking them without evidence.
      *   *Nuance on Unfalsifiability:* A principle isn't a scientific hypothesis. It's a heuristic. Calling it "unfalsifiable" is a category error, but Maya's point about it being a "conversation stopper" is valid. I need to clarify that distinction.
