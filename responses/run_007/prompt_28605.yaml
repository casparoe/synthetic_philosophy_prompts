answer: |-
  **Memorandum to the Standing Governance Committee**

  **Subject:** Analysis of Precedents Regarding the City-Centre Congestion Charge Proposal

  **Recommendation**
  To remain consistent with our precedents, the Committee should **endorse the use of a Citizens' Assembly** to consider the congestion charge. However, our precedents leave a critical ambiguity regarding whether the Assembly should *decide* the matter bindingly or merely *recommend* policy to the Council. While the weight of principle suggests the Assembly should be empowered to decide (due to the Council's admitted conflict of interest), this specific point of authority is not uniformly settled by our history.

  **Analysis of Analogs**

  **The Closest Analog: Precedent 3 (Electoral Ward Boundaries)**
  This is the most controlling precedent. In Case 3, we removed the task from the Council entirely because the elected members had a direct conflict of interest in drawing their own electoral seats. In the current proposal, Council members have privately admitted they would vote against a beneficial policy solely due to electoral fear. This mirrors the structural conflict in Case 3. Just as the Council could not be trusted to act impartially on ward boundaries, it cannot be trusted to act impartially on a measure that impacts its re-election prospects. Case 3 supports handing the decision entirely to the Citizens' Assembly.

  **The Secondary Analog: Precedent 1 (Carbon Emissions Plan)**
  This precedent supports the *suitability* of a Citizens' Assembly for this subject matter. Like the congestion charge, carbon emissions involve complex technical data that can be briefed to laypeople (as our transport staff have confirmed here). However, Case 1 differs in that the Council retained final approval over the implementation budget. This precedent supports using an Assembly for the policy framework but suggests the Council should retain a financial veto.

  **The Most Misleading Analog: Precedent 2 (Annual Budget)**
  It would be a mistake to treat the Annual Budget precedent as controlling. We rejected an Assembly for the budget because it requires ongoing technical accountability and recurrent adjustment. A congestion charge is a specific policy levy with hypothecated revenue (earmarked for public transport), not the general recurrent budget of the city. Treating this like the annual budget would ignore the strategic, one-off nature of the decision and the staff's assurance that the technicalities are briefable.

  **Principles and Underdetermination**

  While our precedents clearly commit us to using a Citizens' Assembly rather than the Council or an adjudicative panel, they genuinely **underdetermine the extent of the Assembly's authority**. There is a tension between Case 1 (Council retains budget approval) and Case 3 (Council removed entirely). To resolve this, we must look to the underlying principles:

  1.  **The Principle of Institutional Conflict:** When the elected Council faces a direct conflict between the public interest and its own political survival or structural advantage, the Council's authority should be suspended in favour of the Citizens' Assembly (derived from Case 3).
  2.  **The Principle of Fiscal Accountability:** When a policy decision carries significant financial implementation costs, the elected Council must retain final approval over the budget to ensure ongoing accountability (derived from Case 1).
  3.  **The Principle of Technical Competence:** If the technical details of a policy can be adequately conveyed to laypeople in a short briefing, the matter is suitable for a Citizens' Assembly; if it requires deep, ongoing expert management, it remains with the Council or experts (derived from Cases 1, 2, and 5).

  **Application of Principles**
  *   **Technical Competence:** Staff confirm the details are briefable. This clears the hurdle for a Citizens' Assembly (Principle 3).
  *   **Institutional Conflict:** The Council's admission of electoral fear triggers Principle 1. This suggests the Council should be removed from the decision entirely, as in Case 3.
  *   **Fiscal Accountability:** The charge involves revenue and spending. Principle 2 suggests the Council should keep a veto.

  **Resolution:** In this instance, the **Principle of Institutional Conflict** must outweigh the Principle of Fiscal Accountability. If the Council retains a veto, they may use it to block the policy for electoral reasons, rendering the Assembly process futile. Therefore, consistency with the *spirit* of Case 3 dictates that the Assembly should *decide*, not merely recommend.

  **The Tie-Breaking Case**
  To definitively settle the tension between Principle 1 (Conflict) and Principle 2 (Fiscal Accountability) for future reference, the Committee should seek a precedent (or create a test case) involving a **hypothecated tax where the Council is not conflicted**.

  *   *The Case:* A proposal to introduce a small levy on hotel stays to fund tourism marketing, where the Council faces no electoral backlash.
  *   *Why it helps:* If we endorse a Citizens' Assembly to *decide* this matter, it establishes that Assemblies can have binding financial power even without Council conflict. If we endorse an Assembly only to *recommend*, it establishes that Fiscal Accountability (Principle 2) is the default rule, and Conflict (Principle 1) is the only exception. This would clarify whether our decision on the congestion charge is a broad new power for Assemblies or a specific remedy for Council misconduct.

  **Conclusion**
  We should vote to endorse the Citizens' Assembly. To be fully consistent with our strongest precedent regarding conflicts of interest (Case 3), we should allow the Assembly to make the final decision, notwithstanding the financial implications noted in Case 1.
