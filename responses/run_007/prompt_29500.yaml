answer: |-
  Leibniz would treat the simulation hypothesis as a claim at a subordinate physical level that leaves his theodicy untouched, rather than a rival metaphysical explanation, because only God's intellect can ground the realm of possibility from which any world is selected.

  For Leibniz, possible worlds are not merely logical combinations waiting to be instantiated by a computer; they are ideas in the Divine Intellect that gain existence only through God's will choosing the maximally perfect compossible set. A simulation hypothesis posits a computational substrate run by an advanced civilization, but that substrate must itself exist within some world. Even if our world is simulated by beings in a higher world, that higher world still requires metaphysical grounding, which ultimately terminates in God's choice. Therefore, simulation explains the mechanical arrangement of a specific created order, but it cannot answer why there is something rather than nothing or why this specific compossible set was actualized, leaving the core of Leibniz's theodicy intact.

  However, accommodating simulation requires significant qualification of Leibniz's theory of substance and causation. It is settled scholarship that Leibnizian monads are "windowless" substances that do not interact causally, coordinated instead by pre-established harmony. A standard simulation model implies real causal influx from the simulator to the simulated (processing inputs to update states). To accommodate this, Leibniz would have to argue that the correlation between the simulator's code and the simulated experience is not causal but harmonized from the beginning, effectively reducing the simulation to a metaphor for pre-established harmony. Furthermore, if simulated beings are to be moral agents subject to theodicy, they must be genuine substances; yet Leibniz holds that only God can create substances. If simulated beings are merely artifacts, they are "well-founded phenomena" without true unity, meaning their suffering would not factor into the moral calculation of the "best world."

  Regarding miracles and perfection, Leibniz would likely view a tweakable simulation as evidence against the world being the best possible. It is settled that Leibniz rejects occasionalism and divine intervention after creation; God does not fix mistakes because the initial choice was perfect. If a finite simulator alters parameters mid-run, this implies imperfection in the initial design. Leibniz would argue that a truly optimal world runs without intervention, so a simulation requiring updates would be metaphysically inferior to a world unfolding via internal substantial force.

  Finally, one must distinguish between settled structural commitments and contested ontological interpretations. It is consensus that Leibniz grounds possibility in God's intellect and denies intersubstantial causation. However, scholars contest whether Leibniz was a strict idealist (where bodies are merely phenomena) or allowed some reality to corporeal substances. If the idealist reading holds, a physical simulation is ontologically impossible as a foundation for reality; if the realist reading holds, simulation might describe the phenomenal layer. Consequently, presenting simulation as compatible requires assuming the contested view that phenomena can have a structured reality independent of monadic perception, whereas the settled view suggests simulation cannot touch the metaphysical bedrock of monads.
