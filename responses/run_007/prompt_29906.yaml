      *   *Simple Libertarianism (Indeterminism):* Fails the "Randomness" check. A wasp could theoretically be indeterminate but still stuck in a loop. Fails the "Expert" check (flow isn't always indeterministic).
      *   *Dennett-style (Evolutionary/Competence):* Focuses on avoidability. Handles wasp (couldn't avoid). Handles human (could have done otherwise given evolution). Good fit, but might blur the animal line too much.

  7.  **Drafting the Content (incorporating constraints):**
      *   *Tone Check:* American English (e.g., "behavior" not "behaviour", "program" not "programme"). Direct, no fluff.
      *   *Structure:*
          1.  Intro (acknowledging the spec sheet approach).
          2.  The Requirements (Numbered, with Rationale and Status).
