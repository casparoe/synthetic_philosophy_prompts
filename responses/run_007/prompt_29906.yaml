      *   **Specific Content to Cover:** Cases (wasp, addiction, compulsion, habit, autopilot, expert flow), Distinctions (flexibility vs. randomness, reasons vs. plasticity, degrees vs. all-or-nothing), Animal cognition constraints, Alternative foils (attention, self-control).
      *   **Tone:** Analytical, direct, philosophical but accessible (spec-sheet style).

  2.  **Deconstruct the Core Problem:**
      *   The *Sphex* wasp represents "rigidity" or "mechanical routine."
      *   Humans represent "flexibility" or "agency."
      *   The challenge is defining the boundary without making humans look like wasps (determinism/habit) or wasps look like humans (complex instinct).
      *   The user wants a "spec sheet" for a theory of free will/agency based on this contrast.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: The Wasps Must Lose.* A theory must explain why the wasp isn't free.
          *   *Why:* It's the foundational example.
          *   *Status:* Non-negotiable.

      *   *Requirement 2: The Addict/Compulsive Must Lose (mostly).* Addiction looks like *Sphexishness* in humans.
          *   *Why:* If the theory says addicts are fully free, it clashes with moral/legal intuition. If it says they are *never* free, it clashes with recovery narratives.
          *   *Status:* Non-negotiable (needs nuance).

      *   *Requirement 3: The Expert/Flow Must Win.* Driving on autopilot or a musician in flow isn't deliberative, but we don't want to call it *Sphexish*.
          *   *Why:* To distinguish habit/routine from *mindless* routine.
          *   *Status:* Non-negotiable.

      *   *Requirement 4: Flexibility $\neq$ Randomness.* Being able to do otherwise shouldn't just be noise.
          *   *Why:* Randomness isn't control.
          *   *Status:* Non-negotiable.

      *   *Requirement 5: Reasons-Responsiveness.* Flexibility must be guided by *something* (reasons, goals), not just plasticity.
          *   *Why:* A leaf blows in the wind (plastic), but isn't free.
          *   *Status:* Non-negotiable.

      *   *Requirement 6: Degrees vs. Binary.* Is free will a switch or a dimmer?
          *   *Why:* The wasp/human line might be blurry.
          *   *Status:* Camp Preference (Compatibilists like degrees; Libertarians often want binary).

      *   *Requirement 7: Animal Cognition Constraint.* Can't place the line *too* high. Dogs/crows show flexibility.
          *   *Why:* Biological continuity.
          *   *Status:* Non-negotiable (for naturalistic theories).

      *   *Requirement 8: Stability vs. Flexibility Tension.* You need habits to function, but habits look like *Sphexishness*.
          *   *Why:* The "Commitment vs. Openness" problem.
          *   *Status:* Critical Tension.

  4.  **Refining the Tensions:**
      *   The user specifically asked about the tension between "reliable commitment" (not blown around) and "flexibility" (not stuck in a loop).
      *   *Analysis:* This is the "Stability-Flexibility Dilemma." A system too flexible is erratic; too stable is rigid. A good theory must explain *meta-control* (when to switch modes).

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most popular positions?
      *   *Candidate:* The "Expert/Flow" requirement (Req 3) combined with "Reasons-Responsiveness" (Req 5).
      *   *Why:* Simple Libertarianism fails because indeterminism doesn't guarantee *reasons*-responsiveness (it might just be noise). Hard Determinism fails because it collapses the wasp/human distinction entirely.
      *   *Selection:* The "Non-Deliberative Competence" requirement (Req 3). It kills theories that equate free will solely with conscious deliberation.

  6.  **Testing Standard Contenders:**
