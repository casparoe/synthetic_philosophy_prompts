answer: |-
  You have independently rediscovered a central problem in contemporary moral philosophy. The phenomenon you are describing has a very specific and robust treatment in the literature, most notably by the philosopher **Samuel Scheffler**.

  The established name for the phenomenon is **dependence on the collective afterlife**, and the specific argument is often referred to as **Scheffler's Afterlife Requirement**.

  Here is the carving you asked for: what the concept is, why it applies to your library but not your cooking, and where the edges lie.

  ### 1. The Core Concept: The Collective Afterlife
  In his 2013 book *Death and the Afterlife*, Samuel Scheffler explores exactly the thought experiment you proposed: *What if we knew that humanity would go extinct shortly after our own deaths?*

  Scheffler argues that for most people, this realization would undermine the value of almost all their activities, even those that seem self-contained. He distinguishes this from a "personal afterlife" (your soul living on) and calls it the **collective afterlife** (humanity continuing without you).

  Your intuition matches Scheffler's conclusion: **Many of our values are not self-contained; they are structurally dependent on the assumption that there will be people to receive, use, or continue what we are doing.**

  ### 2. The Carving: Why the Library but not the Cooking?
  You asked for a principled line between the values that depend on this future (the library) and those that do not (cooking, understanding code). Philosophers generally carve this distinction along three axes:

  #### A. Experiential vs. Structural Value
  *   **Cooking (Experiential):** The value of cooking with your partner is largely *consummatory*. It is realized in the experience itself. The meal is eaten, the conversation happens, the sensation is felt. Once the experience is over, the value has been "cashed out." It does not require a future audience to validate it.
  *   **The Library (Structural):** The value of an open-source library is *functional* and *structural*. It is a tool designed to be integrated into systems that will exist later. Its "point" is to reduce friction for future developers. If there are no future developers, the tool has no function. It is like building a bridge that leads to a cliff; if no one will ever walk it, the engineering effort loses its teleological point.

  #### B. Intrinsic vs. Instrumental Goods
  *   **Understanding Code (Intrinsic):** When you struggle to understand a difficult piece of code "for its own sake," you are engaging in a good that is internal to the activity. The expansion of your own understanding is the end goal. That value is secured the moment you understand it.
  *   **The Library (Instrumental):** The library is a means to an end. The end is "other people building things." If the "other people" term is zeroed out by extinction, the instrument has no target.

  #### C. Private vs. Participatory Goods
  This is perhaps the sharpest edge. Some philosophers (like Margaret Gilbert or Joseph Raz) discuss **participatory goods**.
  *   **Cooking** is a shared good, but it is shared *synchronically* (with your partner, now).
  *   **Open Source** is a shared good shared *diachronically* (across time). It is a contribution to a **tradition** or a **practice**.
  *   **The Line:** If an activity contributes to a *practice* that is defined by its continuity over time (science, engineering, art, democracy), it depends on the collective afterlife. If an activity is a *private experience* or a *momentary connection*, it does not.

  ### 3. Where are the Edges? (Edge Cases)
  To test this carving, we can look at activities that sit on the boundary.

  *   **Planting a Tree:** You will never sit in its shade. Does this depend on the future? **Yes.** If humanity goes extinct tomorrow, planting the tree becomes an act of futility, not stewardship.
  *   **Writing a Diary:**
      *   *If written only for you:* **No.** It is a tool for your own cognitive processing. Extinction doesn't negate the processing you did while alive.
      *   *If written for history:* **Yes.** If you write it expecting future biographers, and there are none, the effort shifts from "contribution" to "solipsism."
  *   **Having Children:** This is the strongest case. For many, the value of parenting is explicitly tied to the existence of the child *after* the parent is gone. Scheffler uses this to show how deeply the collective afterlife is woven into our reasoning.
  *   **Discovering a Truth (Math/Science):** If you prove a theorem, does it matter if no one is left to read it?
      *   *Platonist view:* No, the truth exists eternally.
      *   *Humanist view:* Yes, because knowledge is a social state, not just a propositional one. If there is no mind to hold the knowledge, the "discovery" loses its social value.

  ### 4. What It Is Not (Distinctions)
  It is important to distinguish this from similar concepts that do *not* quite fit your description.

  *   **It is not "Legacy" (in the vanity sense):** Legacy often implies "I want my *name* attached to this." You described the work feeling pointless even if *you* weren't around to witness the end. You care about the *utility* of the library, not the *fame* of the author. Scheffler calls this the difference between "survival of the self" and "survival of the valued."
  *   **It is not simple Altruism:** Altruism is usually about reducing suffering for specific others. Your motivation isn't necessarily to stop suffering; it's to maintain the *infrastructure of human capability*. You are acting as a **steward of civilization**, not just a helper of individuals.
  *   **It is not "Impersonal Value" alone:** Impersonal value suggests beauty exists even if no one sees it (e.g., a beautiful sunset on a dead planet). Your intuition is the opposite: the value *disappears* if no one is there to use it. This is **anthropocentric instrumentalism**.

  ### 5. Summary for the Engineer
  If you were to document this in a philosophical RFC, the spec would look like this:

  *   **Phenomenon:** **Dependence on the Collective Afterlife** (Scheffler).
  *   **Condition:** The value of an activity $V$ is a function of the probability of a future human community $P(Future)$.
  *   **Equation:**
      *   For *Experiential* activities (cooking): $V \approx Constant$ (regardless of $P(Future)$).
      *   For *Generative* activities (OSS): $V \propto P(Future)$.
  *   **The Boundary:** The line is drawn between **consummatory experiences** (value realized in the moment of doing/feeling) and **generative contributions** (value realized in the moment of future use/continuation).

  You have identified that you are motivated by **generative contribution**. You are not working for the "user story" of your own life, but for the "system architecture" of human civilization. When the system is scheduled for shutdown, the code commit feels meaningless. That is a rational, philosophically defensible position.
