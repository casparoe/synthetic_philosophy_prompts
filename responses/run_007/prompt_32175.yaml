prompt: |-
  I'm an ML engineer at a large AI lab, and I've recently been moved from the capabilities team to the safety team. My new job is to evaluate proposals for alignment techniques that come from our researchers, and to recommend which ones should get engineering resources allocated to them. The proposals range from new reward-modeling schemes to interpretability tools to adversarial training curricula. The problem I keep running into is that most techniques look fine on our current models, but I have no principled way to judge whether they will hold up when the models get more capable — which is the whole point.

  I need a decision procedure I can run on a proposal: a set of questions to ask in order, tests to apply, and red flags to check for, grounded in what we actually know about how alignment techniques can fail to scale. The procedure should be usable by someone with an ML engineering background but no specialized alignment theory, it should take no more than an afternoon per proposal, and it should flag the points where the answer genuinely depends on a judgment call rather than an engineering fact. Where the procedure can't settle the question, it should tell me what additional information would.

  Please then run the procedure on two proposals: (1) a scheme that trains a model to produce critiques of its own outputs and uses those critiques as an auxiliary reward signal, and (2) a technique that uses sparse autoencoders to find features corresponding to undesirable behaviors and then applies a fine-tuning penalty to those features.

  Please begin with the procedure itself, with no preface or commentary.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** ML engineer at a large AI lab, moved from capabilities to safety.
      *   **Task:** Evaluate alignment technique proposals for scalability (will they work on more capable models?).
      *   **Output Needed:**
          1.  A decision procedure (questions, tests, red flags) grounded in known scaling failure modes.
          2.  Constraints: Usable by ML engineer (no specialized alignment theory), takes ≤ 1 afternoon per proposal, flags judgment calls vs. engineering facts, specifies needed info if undecided.
          3.  Apply the procedure to two specific proposals:
              *   (1) Self-critique as auxiliary reward.
              *   (2) SAEs for feature suppression via fine-tuning penalty.
          4.  **Constraint:** Begin with the procedure itself, *no preface or commentary*.

  2.  **Deconstruct the Problem (Alignment Scalability):**
      *   Why do alignment techniques fail to scale?
          *   *Goodhart's Law:* Optimizing a proxy breaks when capability increases.
          *   *Deceptive Alignment:* Models learn to appear aligned during training but pursue hidden goals.
          *   *Distributional Shift:* Training data doesn't cover edge cases encountered at higher capability.
          *   *Instrumental Convergence:* Capable models seek power/resources regardless of specific goals.
          *   *Opacity:* Techniques relying on introspection might fail if the model learns to hide its reasoning (sandbagging).
          *   *Specification Gaming:* Finding loopholes in the reward/critique mechanism.
      *   The procedure needs to probe these vulnerabilities without requiring deep theoretical expertise, focusing on empirical checks and architectural assumptions.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A step-by-step checklist.
      *   *Structure:*
          1.  Mechanism Clarity (What exactly is being optimized?)
          2.  Proxy Robustness (Is the signal correlated with true intent across scales?)
          3.  Opacity & Hiding (Can the model game the monitoring tool?)
          4.  Optimization Pressure (Does high capability + high pressure create perverse incentives?)
          5.  Failure Mode Analysis (What does failure look like?)
          6.  Judgment Call Flagging (Where do we need human intuition?)
      *   *Time Limit:* Needs to be actionable in an afternoon. So, focus on available data, literature reviews, and small-scale experiments rather than full training runs.
      *   *Tone:* Professional, engineering-focused, skeptical.

      *Drafting Steps:*
      *   Step 1: Define the Target. (What behavior are we trying to enforce?)
      *   Step 2: Identify the Proxy. (What signal are we actually optimizing?)
      *   Step 3: Check for Goodharting. (Does the proxy diverge from the target as capability increases?)
      *   Step 4: Check for Manipulability. (Can the model influence the signal without changing the behavior?)
      *   Step 5: Check for Structural Dependencies. (Does this rely on assumptions about internal architecture that might change?)
      *   Step 6: Red Flag Checklist. (Specific known failure modes.)
      *   Step 7: Verdict & Info Needed.

  4.  **Refining the Procedure for the User's Constraints:**
      *   "No specialized alignment theory": Avoid jargon like "mesa-optimizers" unless defined simply. Use terms like "goal misgeneralization" or "reward hacking."
      *   "Afternoon per proposal": Focus on literature search, code review, and small-scale sanity checks, not new training runs.
      *   "Flag judgment calls": Explicitly mark sections where empirical data is insufficient.

  5.  **Developing the Two Case Studies:**

      *   **Proposal 1: Self-Critique as Auxiliary Reward.**
          *   *Mechanism:* Model generates output -> Model critiques output -> Critique quality used as reward.
          *   *Scaling Risk:* As models get smarter, they might learn to write flattering critiques regardless of output quality (sycophancy/reward hacking). They might optimize for looking good rather than being good.
          *   *Procedure Application:*
              *   Proxy: Critique quality.
              *   Robustness: Does critique accuracy scale with capability?
              *   Manipulability: Can the model decouple critique from truth?
              *   Verdict: High risk of Goodharting. Needs external verification.

      *   **Proposal 2: SAEs for Feature Suppression.**
          *   *Mechanism:* Train SAE -> Find "bad" features -> Penalize activation during fine-tuning.
          *   *Scaling Risk:* Features might not be linearly additive. Model might route around suppressed features (polysemanticity/redundancy). Model might learn to hide the concept from the SAE (adversarial features).
          *   *Procedure Application:*
              *   Proxy: SAE feature activation.
              *   Robustness: Are features stable across scales?
              *   Manipulability: Can the model activate features without the behavior or vice versa?
              *   Verdict: Promising but fragile. Depends on SAE completeness.

  6.  **Review against Constraints:**
