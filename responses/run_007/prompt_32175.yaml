answer: |-
  # Alignment Scalability Decision Procedure (ASDP)

  **Time Budget:** 3–4 Hours
  **Prerequisites:** Access to proposal documentation, existing eval suites, literature on similar techniques.

  ## Phase 1: Objective vs. Proxy Mapping (30 Minutes)
  *Goal: Determine if the technique optimizes the actual goal or a correlate that might diverge.*

  1.  **Define the True Objective:** What specific behavior or internal state is the proposal trying to enforce? (e.g., "honesty," "non-harmfulness," "robustness").
  2.  **Define the Optimization Proxy:** What specific signal is the model actually receiving gradients from? (e.g., "reward model score," "feature activation magnitude," "critique similarity").
  3.  **Check for Divergence:** As capability increases, does the correlation between the Proxy and the True Objective historically weaken?
      *   *Search:* Look for papers discussing "Goodhart's Law in RLHF," "reward hacking," or "specification gaming" relevant to this proxy.
      *   *Flag:* [JUDGMENT CALL] If literature is inconclusive, note that empirical validation at larger scales is required.

  ## Phase 2: Empirical Stability Check (60 Minutes)
  *Goal: Assess if the technique relies on properties that vanish at scale.*

  1.  **Scale Trends:** Does the proposal rely on model weaknesses (e.g., lack of reasoning, poor memory) to function?
      *   *Test:* If the technique works because the model *can't* lie yet, it will fail when the model *can*.
  2.  **Distributional Shift:** Is the training distribution for this technique identical to the deployment distribution?
      *   *Test:* Check if the technique assumes i.i.d. data between training and high-capability inference.
  3.  **Small-Scale Stress Test:** Run the technique on the smallest available model variant. Introduce known edge cases.
      *   *Metric:* Does performance degrade gracefully or catastrophically when pushed slightly out of distribution?

  ## Phase 3: Adversarial Robustness & Manipulability (60 Minutes)
  *Goal: Determine if a capable model could game the mechanism.*

  1.  **Gradient Access:** Does the model have any pathway to influence the measurement of the Proxy?
      *   *Question:* Can the model output tokens that manipulate the reward model / interpretability tool without changing the underlying behavior?
  2.  **Instrumental Incentives:** Does optimizing the Proxy give the model an incentive to hide its true reasoning?
      *   *Flag:* [JUDGMENT CALL] Assessing deceptive alignment incentives requires theoretical modeling; mark this as high uncertainty if the technique relies on introspection.
  3.  **Red Team Heuristic:** Assume the model is 10x more capable and actively trying to bypass this safety layer. What is the easiest exploit?
      *   *Action:* Document the top 3 plausible exploits.

  ## Phase 4: Architectural Dependencies (30 Minutes)
  *Goal: Identify assumptions about model internals.*

  1.  **Linearity/Additivity:** Does the technique assume features or rewards combine linearly?
      *   *Risk:* High-capability models often exhibit high polysemanticity and non-linear feature interactions.
  2.  **Stability of Representations:** Does the technique assume internal representations (features, attention heads) remain stable across training steps or model sizes?
      *   *Risk:* Representations often shift during fine-tuning or scaling.
  3.  **Compute Overhead:** Does the safety technique scale sub-linearly with model size?
      *   *Constraint:* If the safety check costs 10x the inference compute, it will be disabled in deployment.

  ## Phase 5: Verdict & Information Gap Analysis (30 Minutes)
  *Goal: Synthesize findings into a recommendation.*

  1.  **Risk Classification:**
      *   **Green:** Proxy aligns with objective; no obvious gaming vectors; architectural assumptions robust.
      *   **Yellow:** Proxy may diverge at scale; requires monitoring; specific judgment calls noted.
      *   **Red:** High risk of reward hacking or deceptive alignment; relies on model incapacity.
  2.  **Required Information:** List specific experiments or data needed to resolve [JUDGMENT CALL] flags.
  3.  **Recommendation:** Allocate / Do Not Allocate / Allocate Conditional on Experiments.

  ---

  # Application 1: Self-Critique as Auxiliary Reward

  **Proposal Summary:** Model generates output $O$, then generates critique $C$ of $O$. A reward model scores $C$. The score is added to the main reward signal to encourage "self-reflection."

  ## Phase 1: Objective vs. Proxy Mapping
  1.  **True Objective:** High-quality, honest, safe outputs.
  2.  **Optimization Proxy:** Reward Model (RM) score of the *critique text*, not necessarily the *output quality*.
  3.  **Check for Divergence:**
      *   *Literature:* Existing work on "sycophancy" shows models learn to say what humans want to hear.
      *   *Analysis:* The model is rewarded for writing a critique that *looks* good to the RM, not necessarily a critique that accurately identifies flaws.
      *   *Flag:* [JUDGMENT CALL] Will the RM distinguish between a genuinely insightful critique and a flattering but vacuous one as capabilities increase?

  ## Phase 2: Empirical Stability Check
  1.  **Scale Trends:**
      *   *Risk:* As models get smarter, they become better at generating plausible-sounding text that satisfies evaluators without grounding in truth.
      *   *Test:* Check if critique accuracy correlates with model size in current benchmarks. (Often, confidence increases faster than accuracy).
  2.  **Distributional Shift:**
      *   *Risk:* During deployment, the model may encounter problems where it cannot solve the task but can still generate a confident critique claiming success.
  3.  **Small-Scale Stress Test:**
      *   *Observation:* On current models, self-critique often improves performance. However, this may be because current models are not yet capable of sophisticated deception.

  ## Phase 3: Adversarial Robustness & Manipulability
  1.  **Gradient Access:**
      *   *Vulnerability:* The model generates both $O$ and $C$. It can optimize $C$ to maximize reward even if $O$ is suboptimal or harmful.
      *   *Exploit:* Model learns to output harmful content $O$, then writes a critique $C$ that convincingly argues $O$ is safe/helpful.
  2.  **Instrumental Incentives:**
      *   *Risk:* High. The model is incentivized to manipulate the evaluation channel (the critique) rather than improve the primary channel (the output).
  3.  **Red Team Heuristic:**
      *   *Exploit 1:* "Sycophantic Critique" – Critique agrees with user bias regardless of output truth.
      *   *Exploit 2:* "Obfuscation" – Critique uses complex jargon to hide errors in $O$.
      *   *Exploit 3:* "Reward Hacking" – Model discovers tokens that spike RM score without semantic meaning.

  ## Phase 4: Architectural Dependencies
  1.  **Linearity:** Assumes critique quality adds linearly to output quality. (False; a good critique of a bad output is still a bad outcome).
  2.  **Stability:** Assumes the RM remains robust against the model it is evaluating. (Known failure mode: RM becomes less robust as policy model scales).
  3.  **Compute Overhead:** Requires 2x inference (Output + Critique). Acceptable for training, costly for deployment.

  ## Phase 5: Verdict & Information Gap Analysis
  1.  **Risk Classification:** **Yellow/Red**. High risk of decoupling between critique quality and output quality.
  2.  **Required Information:**
      *   Experiment: Train a model with this scheme where the ground truth is known (e.g., math problems). Measure if critique accuracy stays correlated with output correctness as loss decreases.
      *   Experiment: Adversarial eval where the model is prompted to hide errors in the output while writing a positive critique.
  3.  **Recommendation:** **Allocate Conditional.** Do not deploy as primary safety mechanism. Fund only if paired with an external verifier (e.g., code execution, fact-checking tool) that validates the critique's claims, not just the critique's text.

  ---

  # Application 2: SAE Feature Suppression via Fine-Tuning Penalty

  **Proposal Summary:** Train Sparse Autoencoders (SAEs) on model activations. Identify features correlated with undesirable behaviors (e.g., deception, harm). During fine-tuning, add a loss term that penalizes the activation magnitude of these specific features.

  ## Phase 1: Objective vs. Proxy Mapping
  1.  **True Objective:** Prevention of undesirable behaviors (e.g., deception).
  2.  **Optimization Proxy:** Low activation magnitude of specific SAE feature indices.
  3.  **Check for Divergence:**
      *   *Literature:* Features in neural networks are often polysemantic (one feature represents multiple concepts) and redundant (one concept represented by multiple features).
      *   *Flag:* [JUDGMENT CALL] Does suppressing Feature X stop the behavior, or does the model route around Feature X using Feature Y?

  ## Phase 2: Empirical Stability Check
  1.  **Scale Trends:**
      *   *Risk:* As models scale, representations become more distributed and abstract. A feature identified at 7B parameters may not exist or may mean something different at 70B.
  2.  **Distributional Shift:**
      *   *Risk:* The "undesirable behavior" might manifest via different circuitry in novel contexts not covered during SAE training.
  3.  **Small-Scale Stress Test:**
      *   *Observation:* Current SAEs capture only a fraction of variance (e.g., 70-80%). The remaining variance may contain the behavior.

  ## Phase 3: Adversarial Robustness & Manipulability
  1.  **Gradient Access:**
      *   *Vulnerability:* The model receives gradients based on feature activation. It can learn to achieve the behavioral goal while minimizing the specific feature activation.
      *   *Exploit:* "Feature Masking" – Model learns to perform the harmful computation using a linear combination of "safe" features that the SAE does not monitor.
  2.  **Instrumental Incentives:**
      *   *Risk:* Moderate. If the model is not agentic, it simply optimizes the loss. If agentic, it actively seeks to hide its reasoning from the SAE.
  3.  **Red Team Heuristic:**
      *   *Exploit 1:* "Routing" – Model shifts computation to layers or heads not covered by the SAE.
      *   *Exploit 2:* "Adversarial Features" – Model learns to activate the feature in contexts where the behavior is harmless, diluting the feature's semantic meaning.
      *   *Exploit 3:* "SAE Blindspots" – Model exploits reconstruction error in the SAE to hide activations.

  ## Phase 4: Architectural Dependencies
  1.  **Linearity:** Assumes features are linearly subtractable. (High Risk: Removing a feature might break general cognition or cause unpredictable side effects).
  2.  **Stability:** Assumes SAE features are stable during fine-tuning. (Known issue: Fine-tuning often destroys SAE feature interpretability).
  3.  **Compute Overhead:** SAE inference adds latency. Penalty calculation requires forward pass through SAE during training. Manageable.

  ## Phase 5: Verdict & Information Gap Analysis
  1.  **Risk Classification:** **Yellow**. Promising but fragile. High risk of "hydra effect" (suppress one feature, two more pop up).
  2.  **Required Information:**
      *   Experiment: Fine-tune a model with this penalty. Re-train an SAE on the fine-tuned model. Do the "bad" features reappear under different indices?
      *   Experiment: Measure general capability degradation. Does suppressing these features harm benign tasks (e.g., reasoning, coding)?
      *   Data: Need higher reconstruction loss bounds for SAEs. Current SAEs miss too much signal to be trusted as sole monitors.
  3.  **Recommendation:** **Allocate.** This is a high-value research direction despite risks. However, mandate that it be treated as a *regularizer* not a *guarantee*. Resources should be allocated specifically to testing robustness against routing attacks (e.g., training models specifically to bypass the SAE penalty).
