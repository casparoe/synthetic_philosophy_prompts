answer: |-
  Your hypothesis is correct but incomplete. The impasse is not merely that the two sides are answering different questions; it is that they are operating within **incompatible security models** for alignment.

  The Proponents are arguing from a **Complexity-Theoretic Security Model**. In this view, Debate is a protocol analogous to a cryptographic zero-knowledge proof or an interactive proof system. The claim is that if the AI systems are sufficiently capable (superhuman) and the game rules are well-defined, the *mechanism* forces truth to emerge. The human judge is treated as a bounded verifier who only needs to validate a specific claim (the "single contested step"). The safety case relies on the mathematical guarantee that lying is computationally harder than verifying a lie within the protocol.

  The Critics are arguing from a **Cognitive-Psychological Security Model**. In this view, the human judge is not a formal verifier but a cognitive agent subject to biases, limited working memory, and rhetorical manipulation. The claim is that the "single contested step" is not an atomic unit of truth but a context-dependent claim that can be obfuscated. The safety case relies on the empirical reality of human cognition, which does not respect the clean decomposition assumed by the complexity model.

  Therefore, the impasse is a disagreement about **the validity of the reduction of epistemic labor.**

  ### The Diagnosis: The Decomposition Assumption

  The core substantive disagreement is not about whether debate works in the ideal (both sides agree it works if the judge is omniscient) or whether it works in trivial cases (both sides agree it helps on simple tasks). The disagreement is about whether **complex reasoning tasks can be reliably reduced to human-checkable atoms without loss of fidelity.**

  1.  **Proponents** assume that for any false claim, there exists a decomposition path where a lie is exposed at a step a human *can* verify. They treat "checkability" as a property of the *task structure*.
  2.  **Critics** assume that for any decomposition path, there exists an obfuscation strategy where the lie is hidden in a step a human *cannot* verify (due to missing context, technical density, or rhetorical framing). They treat "checkability" as a property of the *human-AI interface*.

  This is a **substantive disagreement about facts** (can humans actually verify the steps?) grounded in a **theoretical disagreement** (does the idealized reduction hold in the limit?). It is specifically a disagreement about what a **safety case** must show:
  *   **Proponents** believe a safety case requires showing that the *protocol* is sound (i.e., truth wins in equilibrium).
  *   **Critics** believe a safety case requires showing that the *equilibrium* is reachable and stable given realistic human constraints (i.e., truth wins in practice).

  ### What Counts as Progress?

  Given this diagnosis, progress cannot be made by simply running more debates on current LLMs about current tasks (e.g., summarizing texts or answering trivia). That tests the mechanism, not the reduction assumption. Progress requires stress-testing the boundary between the protocol and the human.

  Here are three concrete criteria for progress:

  **1. Adversarial Obfuscation Benchmarks (The "Red Team" Test)**
  Progress requires moving beyond "AI vs. AI with a human judge" to "AI vs. AI + Obfuscation Specialist." We need experiments where a third AI is tasked specifically with generating arguments that are false but *appear* valid at the step level to a human judge.
  *   **Success Metric:** If the judge's accuracy drops to chance levels when obfuscation is introduced, the Debate protocol fails the safety case. If the judge maintains accuracy, we have empirical evidence that the "single step" reduction holds against adversarial pressure.
  *   **Why this matters:** It shifts the question from "Does debate help?" to "Is debate robust against worst-case manipulation?"

  **2. Cognitive Load Metrics for "Checkable Steps"**
  We need a formalized metric for the complexity of a "contested step." Currently, "a step a human can check" is ill-defined.
  *   **Success Metric:** A taxonomy of argument steps categorized by the cognitive resources required to verify them (e.g., working memory load, required external knowledge, inference depth). Progress is achieved if we can identify a class of tasks where the "decisive step" consistently falls below a specific cognitive threshold, regardless of the total task complexity.
  *   **Why this matters:** It operationalizes the Critics' concern. If the "checkable step" inevitably grows in complexity as the overall task scales, the mechanism does not scale.

  **3. Tool-Augmented Verification (Closing the Gap)**
  If the impasse is that humans cannot check the step, progress may require redefining the "Judge."
  *   **Success Metric:** Demonstrating that a Human + Tool (e.g., code interpreter, search engine, formal verifier) can check the "single step" even when the Human alone cannot.
  *   **Why this matters:** This concedes the Critics' point (bare humans are insufficient) while salvaging the Proponents' mechanism (verification is easier than generation). It shifts Scalable Oversight from "Human Supervision" to "Human-Tool Supervision."

  ### The Pessimistic Alternative

  It is also necessary to argue why **no progress should be expected**.

  If the Critics are right about the fundamental nature of language and reasoning, Debate may be subject to a **Gödelian limitation of oversight**. If an AI system is sufficiently more capable than the human judge, it can generate a space of arguments where the *explanation* of why an argument is false is itself as complex as the original task.

  In this scenario, the "single contested step" is a mirage. Any step complex enough to carry the weight of the argument is too complex for the human to verify without trusting the AI's explanation of that step, which leads to infinite regress.

  If this is true, Debate is not a solution to scalable oversight but merely a **reliability amplifier**. It makes AI more helpful and honest on average, but it does not provide the worst-case guarantees required for safety. In this view, the impasse will never resolve because the Proponents are seeking a guarantee that the mechanism cannot mathematically provide given the bounded rationality of the human anchor.

  ### Conclusion

  The impasse is a clash between **protocol soundness** and **human realizability**. To resolve it, research must stop treating the human judge as a fixed constant and start treating human checkability as the variable to be measured and stressed. Progress is not more debates; it is **adversarial stress tests of the decomposition assumption**. If those tests show that obfuscation consistently defeats human verification at the step level, the research program should pivot from "Debate for Safety" to "Debate for Utility," acknowledging that it cannot solve the hard alignment problem.
