prompt: |-
  ok so i've been reading around in accuracy-first epistemology and i'm trying to nail down whether the package i've ended up with is actually consistent. here's what i think:

  (1) accuracy is the sole fundamental epistemic good. every epistemic norm — probabilism, conditionalization, norms against akrasia, whatever — has to be derivable from the goal of minimizing inaccuracy, or it isn't a genuine epistemic norm.

  (2) the brier score is the correct measure of inaccuracy for credences. not just one among many proper scoring rules; it's the right one.

  (3) probabilism is true, and joyce's accuracy-dominance argument for it works.

  (4) conditionalization is the uniquely rational update rule. when you learn E, you should set your new credences to your old credences conditional on E.

  (5) the principle of indifference is false. you're not rationally required to assign equal credences to symmetric possibilities when you have no evidence distinguishing them.

  (6) epistemic akrasia is always irrational. you can't rationally have high credence in P while also having high credence that your total evidence doesn't support P — that's a kind of internal incoherence.

  i'm not trying to defend all of these in one paper or anything, this is just where i've landed from reading the literature, and i want to know if i'm smuggling in a contradiction somewhere. go through the pairs and tell me which ones are actually in tension, which only look like they are, and rank the real tensions by severity. for each real tension say what the cheapest revision is and what it costs.
reasoning: |-
