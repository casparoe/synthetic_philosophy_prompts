      Is there a tension between (3) Probabilism and (6) Akrasia? Some argue that probabilism + accuracy *entails* akrasia norms (e.g., via reflection principles). But the literature suggests this derivation is fragile. So the tension remains between the *foundation* (1) and the *norm* (6).

