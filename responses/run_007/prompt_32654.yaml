answer: |-
  The Moses bridges substantiate Winner's claim that infrastructure encodes power, but only if we shift focus from Moses's personal intent to the systemic choices sustaining exclusion. Ultimately, the case proves artefacts possess politics not through inherent necessity (strong thesis), but through their embedding in specific socio-technical systems (weak thesis), revealing Winner's blind spot: politics resides less *in* the object than in the governance maintaining it.

  Taking the thesis seriously, the bridges exemplify the 'weak' version. Winner's 'strong' claim suggests certain technologies inherently require specific power structures, such as nuclear power necessitating hierarchy. The bridges do not fit this; they do not *require* authoritarianism, only accommodate it. A democratic society could maintain low bridges if it chose to prioritise parklands over public access. They align with the 'weak' version: artefacts compatible with certain political arrangements than others. A low overpass is not intrinsically authoritarian, but within 1930s New York, it functioned as a gatekeeper. Winner's rhetorical deployment often blurs this, implying the concrete itself dictates social relations, yet the physical constraint only becomes political when paired with a stratified transport network. By treating the bridges as 'strong' politics, Winner risks suggesting the exclusion was unavoidable given the technology, rather than a contingent social choice.

  Regarding historical pushback, the disputed intent does not invalidate the thesis. If politics lies in the artefact's function rather than the designer's psyche, the outcome matters more than the motive. Whether Moses personally specified nine feet or merely accepted standard engineering specifications that achieved the same end, the bridge performs exclusion. This shifts the locus of politics from individual malice to institutional inertia. The artefact retains its politics even if the origin story is mythologised, because the material consequence remains unchanged. However, Winner's reliance on the anecdote of Moses's deliberate prejudice weakens his structural argument, suggesting politics requires a conscious villain rather than emergent systemic bias. The myth persists because it satisfies a desire for identifiable culpability, obscuring the broader complicity of engineering standards and zoning laws.

  This exposes the thesis's primary limit: conflating the artefact with the system. A low bridge is only exclusionary within a system where buses are the primary mode for the poor. In a car-free society, the bridge's height is politically neutral. Thus, the politics are not *in* the bridge, but in the bridge-system relationship. Furthermore, Winner focuses heavily on the moment of design, obscuring the politics of maintenance and adaptation. A bridge's politics are not static; they can be altered, raised, or bypassed. Treating the politics as inherent to the concrete risks technological determinism, ignoring how human agency persists post-construction. Consequently, the thesis risks reifying power structures, making them appear as immutable features of the built environment rather than reversible policy decisions. The Moses case ultimately teaches that while artefacts embody power, that power is contingent upon the social order that sustains them, not merely cast in stone. To locate politics solely in the object is to let the society that built and keeps it off the hook.
