          *   Strict requirement vs. fit? Yes (Functional vs. Ontological).
          *   Realism vs. Instrumentalism? Yes.
          *   Recklessness/Negligence consistency? Yes (Noted the shift to objective standards).
          *   Eliminative Materialism? Yes (Retribution vs. Regulation).
      *   *Self-Correction during drafting:* I need to make sure I don't conflate "instrumentalism" with "fiction." Dennett's instrumentalism is robust. Also, ensure the distinction between *actus reus* and *mens rea* is clear but integrated. The prompt asks about the "practice," so focus on legal reasoning, not just abstract philosophy.

  5.  **Final Review against the Prompt's specific questions:**
      *   "What theory of mind?" -> Folk Psychology (BDI).
      *   "Separate strict requirements from fit." -> Requirement: Discriminability/Control. Fit: Causal Realism.
      *   "Real internal states or instrumental?" -> Compatible with both, but retribution needs realism.
      *   "Recklessness/Negligence consistent?" -> Negligence is the break point (objective vs. subjective).
      *   "Eliminative Materialism changes?" -> Shift from blame to risk management; intent becomes neural patterns.

