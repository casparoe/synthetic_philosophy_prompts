answer: |-
  Here is the Frege–Geach problem restated in your vocabulary, followed by the residue report.

  ### The Frege–Geach Problem: A PL Restatement

  **The Setup**
  Imagine a language where certain expressions are **Commands** (effectful terms) rather than **Values** (pure terms).
  *   **Standard View (Realism):** A sentence like `lying_is_wrong` has type `Bool`. It evaluates to a value.
  *   **Expressivist View:** `lying_is_wrong` has type `Cmd Unit` (or `MoralEffect`). Its semantic content *is* the side effect it produces (e.g., updating a global `SentimentStore`, throwing a `Disapproval` exception, or printing to `stderr`). It does not return a value that can be inspected.

  **The Embedding Problem**
  In a standard compiler, you can embed a pure term anywhere a value is expected. You cannot embed a `Cmd` in a position that expects a `Value` without sequencing it (i.e., running it).

  The Frege–Geach problem arises because natural language allows moral commands to appear in **unexecuted evaluation contexts**.

  Consider the term:
  ```haskell
  not (lying_is_wrong)
  ```
  If `lying_is_wrong` is `Cmd Unit`, this is a type error. `not` expects a `Bool`. You cannot negate a state update. You can only negate the *result* of a computation, but Expressivism insists there is no result—only the performance of the command.

  Now consider the conditional (implication):
  ```haskell
  if lying_is_wrong then getting_brother_to_lie_is_wrong else pure ()
  ```
  In the `if` condition, `lying_is_wrong` is not being executed. It is being inspected to determine control flow. If the meaning of `lying_is_wrong` is *only* its execution (the effect), then in this context, it is semantically inert. It has no meaning here because it isn't running.

  **The Validity Problem (Modus Ponens)**
  Now consider an inference rule (Modus Ponens):
  1.  `lying_is_wrong`
  2.  `lying_is_wrong -> getting_brother_to_lie_is_wrong`
  3.  Therefore, `getting_brother_to_lie_is_wrong`

  In a type system, this looks like function application.
  *   Premise 1 is a term `M` of type `Cmd Unit`.
  *   Premise 2 is a term `F` of type `Cmd Unit -> Cmd Unit`.
  *   Conclusion is `F M`.

  The problem is: **What is the type of the implication?**
  If the implication is a pure function (`Bool -> Bool`), Premise 1 doesn't fit (it's not a `Bool`).
  If the implication is effectful (`Cmd Unit -> Cmd Unit`), then Premise 2 is itself a command. To use it, you must execute it. But executing the implication isn't the same as asserting the logical connection.

  In PL terms, the Frege–Geach problem is the failure to define a **compositional semantics** for a language where:
  1.  Atomic propositions are effectful commands with no return value.
  2.  Logical connectives (`not`, `->`, `or`) act as constructors that expect pure values.
  3.  Logical validity requires that the type structure of the premises maps to the conclusion *without* forcing the execution of the effects in the premises.

  You are trying to write a type checker for a language where the atomic types are effects, but the logical operators are defined over values, and you are forbidden from introducing a hidden return type (like `Bool`) to bridge the gap.

  ***

  ### Residue Report

  Here is the breakdown of what translates cleanly, what requires fudging, and what gets dropped when mapping this philosophical problem into PL theory.

  #### 1. Clean Translations
  *   **The Embedding Issue:** The analogy of "negating a state update" is precise. In PL, `not (putState x)` is ill-typed. In Expressivism, `Not(Lying is Wrong)` is semantically mysterious because you can't negate an act of disapproval.
  *   **Compositionality:** The demand for a compositional semantics is identical. In PL, the meaning of `not A` must be a function of the meaning of `A`. If `A`'s meaning is "run this effect," and `not` expects "inspect this value," composition fails.
  *   **Unasserted Contexts:** This maps perfectly to the distinction between **Elaboration** and **Execution**. In the antecedent of a conditional, the code is elaborated (type-checked/analyzed) but not executed. Expressivism struggles to explain what is being elaborated if there is no denotation.

  #### 2. The Fudge Factors
  *   **The Nature of "Effects":** In PL, an effect usually has a denotation in the metalogic (e.g., a State Monad denotes a function `S -> (A, S)`). We solve the embedding problem by giving effects a mathematical model.
      *   *The Fudge:* Expressivists explicitly **refuse** this move. They deny moral sentences denote functions or states. To make the PL analogy work, I had to assume `Cmd Unit` has *no* underlying monadic transformer, which is an unusual design for a compiler (usually everything denotes *something*).
  *   **Validity vs. Type Safety:** In PL, if the types match, the program is "valid." In philosophy, validity is about **preservation of commitment**.
      *   *The Fudge:* I mapped validity to type preservation. This works structurally, but in PL, type preservation guarantees the machine won't get stuck. In ethics, it guarantees you aren't being irrational. The "stuckness" is normative, not mechanical.

  #### 3. The Lost Residue (What PL Vocabulary Drops)
  This is the critical part. Your vocabulary handles the *syntax* of the problem well, but it drops the *pragmatics* and *normativity*.

  *   **Disagreement:**
      *   *PL View:* If I run `throw(Disapproval)` and you run `throw(Approval)`, we have produced two different side effects. There is no conflict. The log just has two entries.
      *   *Philosophy View:* If I say "Lying is wrong" and you say "Lying is not wrong," we are disagreeing. We cannot both be right.
      *   *The Loss:* PL semantics is generally descriptive. It doesn't model **incompatibility of attitudes**. To capture this, you'd need a type system where `Disapproval` and `Approval` for the same term cause a compile-time error (a conflict), but Expressivism makes this hard because these aren't types, they are actions.
  *   **Normative Force (The "Ought"):**
      *   *PL View:* Modus Ponens is a rule you *can* use.
      *   *Philosophy View:* Modus Ponens is a rule you *ought* to use. If you accept the premises, you are *committed* to the conclusion.
      *   *The Loss:* PL explains how inference *works*. It doesn't explain why an agent is *rationally bound* by it. The Frege–Geach problem is partly about explaining why it feels like a mistake to deny the conclusion after accepting the premises. In PL, denying the conclusion just means you don't run that branch of the code.
  *   **Modus Ponens Location:**
      *   You asked if Modus Ponens is substitution or normalization. In this translation, it looks like **Elaboration**. It's the process of checking that the effectful premises license the effectful conclusion.
      *   *The Loss:* The philosophical problem isn't just that the types don't match; it's that the **attitude** in the conclusion feels different from the attitude in the premises.
      *   *Example:*
          1.  `Boo! Lying` (Attitude: Disapproval)
          2.  `Boo! (If Lying then Getting Brother to Lie)` (Attitude: Disapproval of the conditional)
          3.  Therefore: `Boo! Getting Brother to Lie` (Attitude: Disapproval)
      *   In PL, if I have `effect A` and `effect (A -> B)`, running them gives me `effect B`. But why does having the first two attitudes *force* the third? In PL, nothing forces me to run the third effect. The "binding" nature of logic is lost in the translation to effect handlers.

  ### Summary Answers to Your Specific Questions

  **1. Does "not (lying is wrong)" come out as negating a state update?**
  Yes, that translation is faithful. The problem is exactly that `not` is a value-level operator, and Expressivism treats moral sentences as command-level terms. You cannot apply value-level operators to command-level terms without a monadic lift (e.g., `liftM not`), but Expressivists deny there is a value to lift.

  **2. Where does Modus Ponens go?**
  It becomes a problem of **Effect Polymorphism** or **Kleisli Composition**.
  If `A` and `B` are effects, `A -> B` must be a Kleisli arrow (`A -> m B`). But since `A` is `Unit` (just an effect), the arrow is `Unit -> m (Unit -> m Unit)`.
  The problem is that standard logic assumes `A -> B` is a value that can be stored and passed around. If `A -> B` is itself an effectful commitment, the transitivity of inference breaks down unless you have a robust monad law that equates "committing to the implication" with "committing to the conclusion given the premise." Expressivists struggle to write that monad instance without smuggling in truth values.

  **3. Is Frege–Geach just the embedding problem for effectful languages?**
  No. There is residue.
  The embedding problem is the **syntactic** half. PL solves this easily by giving effects denotations (e.g., State Monad).
  The Frege–Geach problem includes a **pragmatic** half: explaining **disagreement** and **rational constraint**.
  *   In PL, if I define `type Moral = IO ()`, I can embed it by lifting it to `Reader Env Bool`. Problem solved.
  *   In Philosophy, if I define `Moral = IO ()`, I have turned morality into a description of psychological states (Psychologism). Expressivists want to avoid saying moral sentences describe psychological states. They want them to *be* the states.
  *   **The Residue:** Your vocabulary assumes a separation between the *code* and the *machine running it*. Expressivism tries to collapse that distinction for moral terms. The Frege–Geach problem is the error message you get when you try to compile a language where the code *is* the machine state, but you still want to run a type checker on it.
