      *   **The "Super" Work:** Explain that the difference isn't always in the *answer*, but in the *logic*. Use Prisoner's Dilemma as the clearest example of divergence (Nash=Defect, Super=Cooperate).
      *   **The Luring Lottery:**
          *   Define the payoff clearly (Weighted lottery).
