answer: |-
  You have hit on a very subtle and often misunderstood point in decision theory. Your intuition is correct: in the **Platonia Dilemma**, standard game theory (specifically Symmetric Nash Equilibrium) and Hofstadter's **Superrationality** actually converge on the same numerical answer ($p = 1/20$).

  This convergence is exactly why the Platonia Dilemma can be frustrating when trying to understand what makes superrationality "super." If the answer is the same, what is the difference?

  The difference lies not in the *outcome* of that specific game, but in the **logical structure of the reasoning** and how that reasoning handles games where individual incentives conflict with group symmetry (like the Prisoner's Dilemma or the Luring Lottery).

  Here is a breakdown of what superrationality is, why Platonia masks its power, and how the Luring Lottery reveals the divergence you are looking for.

  ---

  ### 1. The Core Distinction: Causal vs. Logical Correlation

  To understand the "super" in superrationality, we have to look at how a player models the other players.

  *   **Standard Rationality (Nash):** I assume the other players are rational, but I treat their decisions as **fixed** (or probabilistically independent) from my own. I ask: *"Given that everyone else is playing strategy $S$, is my best response also $S$?"* This is a fixed-point search. Even with Common Knowledge of Rationality (CKR), standard game theory treats your move and my move as distinct events that happen to correlate because we are in equilibrium.
  *   **Superrationality:** I assume the other players are not just rational, but **identical reasoners** to me. Therefore, I treat their decisions as **logically dependent** on mine. I ask: *"If I conclude that strategy $S$ is best, then—because they are running the same algorithm as me—they must also conclude $S$ is best."*

  In superrationality, you don't just predict what others will do; you assume your reasoning process **determines** what they do. This is a form of *acausal decision theory* (similar to modern Timeless Decision Theory). You act as if your choice sets the value for all identical agents.

  ### 2. The Platonia Dilemma: Why They Converge

  **The Setup:** 20 players. If exactly one person sends a telegram, they win \$1 million. If 0 or >1 send, no one wins.

  **Standard Game Theory (Nash):**
  You look for a Symmetric Mixed-Strategy Nash Equilibrium. You calculate the probability $p$ that maximizes your expected payoff, assuming everyone else uses $p$.
  *   Probability of exactly one sender = $20 \cdot p \cdot (1-p)^{19}$.
  *   Maximizing this function yields $p = 1/20$.
  *   **Reasoning:** "If everyone else plays $1/20$, my best response is $1/20$."

  **Superrationality:**
  You reason that since everyone is identical, everyone must choose the same probability $p$.
  *   You want to choose the $p$ that maximizes the group outcome (which maximizes your outcome, since you are one of the group).
  *   You maximize $20 \cdot p \cdot (1-p)^{19}$ with respect to $p$.
  *   **Result:** $p = 1/20$.
  *   **Reasoning:** "If I choose $p$, everyone chooses $p$. I will choose the $p$ that makes us all win most often."

  **The Verdict:**
  You are right. In the Platonia Dilemma, the "super" reasoning does not change the number. The Symmetric Nash Equilibrium happens to coincide with the globally optimal symmetric strategy.
  *   **What work is the "super" doing here?** It is doing **metaphysical** work, not **numerical** work. It justifies *why* we should focus on the symmetric equilibrium without needing an external coordinator. It treats the correlation as a logical necessity rather than a coincidental equilibrium selection.

  However, because the numbers are the same, Platonia is a bad example for showing the *practical* difference. To see the difference, we need a game where the Nash Equilibrium is **not** the globally optimal symmetric outcome.

  ### 3. The Luring Lottery: Where They Diverge

  This is the example you asked for, and it is where superrationality and standard rationality part ways.

  **The Setup (Hofstadter's Version):**
  *   Players submit a positive integer $x$.
  *   A prize pool of \$1,000,000 is available.
  *   The actual prize amount is diluted by the sum of all entries: $\text{Prize} = \frac{\$1,000,000}{\sum x_i}$.
  *   Your chance of winning is proportional to your entry: $\text{Chance} = \frac{x_i}{\sum x_i}$.
  *   **Your Expected Value (EV):**
      $$ EV_i = \left( \frac{x_i}{\sum x_j} \right) \times \left( \frac{\$1,000,000}{\sum x_j} \right) = \frac{\$1,000,000 \cdot x_i}{(\sum x_j)^2} $$

  **Standard Rationality (Nash):**
  I treat everyone else's numbers as fixed. Let $S_{-i}$ be the sum of everyone else's numbers.
  $$ EV_i = \frac{K \cdot x_i}{(S_{-i} + x_i)^2} $$
  If I increase $x_i$, the numerator grows linearly, but the denominator grows quadratically. However, for small $x_i$ relative to $S_{-i}$, increasing my number increases my weight in the lottery faster than it dilutes the prize *for me*.
  *   There is always an incentive to submit a higher number than the others to capture a larger share of the lottery weight.
  *   **Result:** An "arms race." Everyone keeps increasing their number to gain relative advantage. In the limit (Nash Equilibrium), everyone submits the maximum possible number (or infinity), the sum explodes, and the prize value collapses to near zero. This is a **Tragedy of the Commons**.

  **Superrationality:**
  I reason: "I am identical to the other players. If I decide to submit a high number $x$ to gain an advantage, they will reason the same way and also submit $x$."
  *   Therefore, I cannot gain a relative advantage. $\sum x_j = N \cdot x$.
  *   My Expected Value becomes:
      $$ EV = \frac{K \cdot x}{(N \cdot x)^2} = \frac{K}{N^2 \cdot x} $$
  *   In this equation, my EV is **inversely proportional** to $x$.
  *   To maximize my EV, I must make $x$ as **small** as possible.
  *   **Result:** Everyone submits **1**. The prize pool remains large (\$1,000,000 / 20), and everyone has an equal shot.

  **The Divergence:**
  *   **Standard Rationality:** Submit a huge number. (Result: Everyone gets ~\$0).
  *   **Superrationality:** Submit 1. (Result: Everyone gets a share of a large prize).

  Here, the "super" is doing **economic** work. It prevents the tragedy of the commons by enforcing logical correlation. Standard rationality sees the dilution of the prize as an "externality" (someone else's problem), while superrationality internalizes it (if I dilute, we all dilute).

  ### 4. Summary: What is the "Super" Doing?

  To answer your specific questions:

  **1. Isn't this just Common Knowledge of Rationality (CKR)?**
  No. CKR implies "I know you are rational, and you know I know..." In standard game theory, this leads to Nash Equilibrium. In the Luring Lottery, CKR leads to the arms race (Defect). Superrationality adds a stronger axiom: **"I know you are rational, and I know you are running the *same algorithm* as me."** This shifts the decision theory from Causal Decision Theory (CDT) to something like Evidential or Timeless Decision Theory (EDT/TDT).

  **2. What work is the "super" doing in Platonia?**
  In Platonia, it is doing **justificatory** work. It explains *why* we land on the symmetric equilibrium without needing a focal point or a coordinator. It asserts that the correlation is logical, not just statistical. However, because the Nash Equilibrium and the Superrational optimum coincide in Platonia, it fails to demonstrate the *power* of the concept.

  **3. Does the Luring Lottery show them coming apart?**
  **Yes.** This is the definitive case.
  *   **Standard Rationality** leads to a "race to the bottom" (high numbers, destroyed prize).
  *   **Superrationality** leads to cooperation (low numbers, preserved prize).

  ### The Takeaway

  Hofstadter's superrationality is essentially a plea to treat **logical identity** as a causal lever.

  *   In **Platonia**, the lever doesn't move the outcome because the self-interested equilibrium already aligns with the group optimum.
  *   In the **Luring Lottery** (and the Prisoner's Dilemma), the self-interested equilibrium destroys value. Superrationality "saves" the value by forcing the player to realize that **defecting logically implies everyone else defects.**

  You were right to be skeptical of Platonia as the sole example; it hides the divergence. The Luring Lottery is where the "super" earns its keep.
