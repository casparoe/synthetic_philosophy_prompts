prompt: |-
  I run an intelligence analysis unit in a government agency. My analysts produce assessments on geopolitical and security questions, and every assessment goes through internal review before dissemination. A persistent problem: reviewers sometimes challenge an assessment not because the evidence is weak or the reasoning is flawed, but because the conclusion, if accepted, would have undesirable consequences — it might embolden an adversary, alarm allies, constrain policymakers, or be politically weaponised. I am told that philosophers have analysed exactly this kind of distinction under the label "the wrong kind of reasons problem": roughly, the difference between reasons that bear on whether an attitude (here, a belief) is correct, and reasons that bear on whether it would be good to have that attitude. I need a decision procedure my review team can apply to classify a given objection to an assessment as a reason of the right kind (bearing on the truth of the assessment or the quality of the evidence and reasoning supporting it) or a reason of the wrong kind (bearing on the desirability of accepting or disseminating the assessment). The procedure must be a checklist or sequence of tests that reviewers with no philosophy background can apply in under ten minutes. It should handle cases where the distinction blurs, and it should explicitly flag where the procedure cannot settle the matter and an editor or senior analyst must decide. Then apply the procedure to these three objections:

  1. "If we assess that the rebel faction controls significant territory in the north, foreign governments will cite our assessment as a pretext for military intervention."
  2. "The analyst's primary source for the claim about weapons stockpiles has recanted their earlier testimony and has a documented history of fabrication."
  3. "The assessment uses the phrase 'cannot be ruled out' for a low-probability event; this wording will be read by non-expert readers as implying the event is likely, and the resulting public alarm will itself cause diplomatic damage."
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Head of an intelligence analysis unit in a government agency.
      *   **Problem:** Reviewers challenge assessments based on *consequences* of the conclusion (undesirable outcomes) rather than *evidence/reasoning* (truth/accuracy).
      *   **Concept:** "The Wrong Kind of Reasons Problem" (philosophical distinction between reasons for belief vs. reasons for action/attitude).
      *   **Task:** Create a decision procedure (checklist/sequence of tests) for reviewers to classify objections as "Right Kind" (truth/evidence-based) or "Wrong Kind" (consequence-based).
      *   **Constraints:**
          *   Must be usable by non-philosophers.
          *   Must take under 10 minutes.
          *   Must handle blurry cases.
          *   Must flag when escalation (senior analyst/editor) is needed.
          *   Must apply the procedure to three specific objections provided.

  2.  **Deconstruct the Philosophical Concept:**
      *   *Right Kind of Reasons (RKR):* Evidence, logic, methodology, source reliability, coherence with existing knowledge. These bear on the *truth* of the proposition ($P$ is true).
      *   *Wrong Kind of Reasons (WKR):* Political fallout, diplomatic strain, public panic, policy constraints. These bear on the *utility* or *safety* of holding/disseminating the belief ($P$ is dangerous to believe/say).
      *   *The Blurry Middle:* Sometimes consequences *are* evidence (e.g., if saying $P$ causes a war, maybe $P$ was a secret everyone wanted to keep, implying $P$ is sensitive, but not necessarily false). However, in intelligence analysis, the core mandate is truth-to-power. The distinction is usually between "Is this accurate?" vs. "Is this safe to say?"

  3.  **Drafting the Decision Procedure (The "Truth-Utility Filter"):**
      *   *Goal:* Simple, actionable, binary (mostly), with an escalation path.
      *   *Step 1: The "Therefore" Test.* Does the objection attack the link between evidence and conclusion, or the link between conclusion and outcome?
      *   *Step 2: The "New Evidence" Test.* Does the objection introduce new data about the world (the subject matter) or new data about the *reaction* to the report?
      *   *Step 3: The "Classification/Sensitivity" Check.* Is this actually a security/classification issue masquerading as an analytic critique? (Crucial for gov context).
      *   *Step 4: The "Wording vs. Substance" Check.* Is the objection about the *fact* or the *phrasing*?
      *   *Escalation:* When does it need a boss? When the consequence is severe enough to warrant suppression *despite* accuracy (a policy decision, not an analytic one).

      *Refining for the 10-minute constraint:* Needs to be a flowchart or a numbered list with Yes/No gates. Let's make it a 4-Question Checklist.

      *Draft Checklist:*
      1.  Does the objection cite a flaw in data, logic, or source reliability? (Yes = Right Kind).
      2.  Does the objection cite a negative outcome of dissemination (political, diplomatic, military)? (Yes = Wrong Kind).
      3.  Is the objection about ambiguity causing misinterpretation? (Grey Area).
      4.  Does the objection imply the conclusion is true but dangerous? (Wrong Kind for analysis, Right Kind for dissemination policy).

      *Wait, I need to be careful.* In intelligence, "dissemination control" is valid. If a report is accurate but compromises a source, it shouldn't be disseminated *as is*. That's not a "Wrong Kind of Reason" regarding *belief*, it's a security constraint. The prompt specifically distinguishes between "belief is correct" vs "good to have that attitude." In an agency context, the "attitude" is the *assessment held by the agency*.
      *Correction:* The prompt asks to distinguish reasons bearing on *truth/quality of evidence* vs. *desirability of accepting/disseminating*.
      *So:*
      *   Right Kind = Analytic Integrity (Is it true?)
      *   Wrong Kind = Policy/Political Preference (Is it convenient?)
      *   *Exception:* Security/Source Protection is a "Right Kind" reason to *redact*, but not to *change the judgment*. I need to make sure the procedure distinguishes between "Change the judgment" (Bad) and "Restrict distribution" (Valid security practice). The prompt focuses on *challenging the assessment* (i.e., the judgment), not just the distribution list.

      *Revised Procedure Structure:*
      1.  **The Evidence Test:** Does this point to a gap in the proof?
      2.  **The Consequence Test:** Does this point to a fallout from the belief?
      3.  **The Ambiguity Test:** Is the problem the fact or the communication of the fact?
      4.  **Escalation Trigger:** When consequences are severe enough to override analytic independence (requires senior decision).

  4.  **Developing the Content:**
      *   Title: "Analytic Integrity vs. Policy Impact Filter."
      *   Format: 4-Step Checklist.
      *   Time estimate: 5-7 minutes.
      *   Instructions: Clear, non-jargon.

  5.  **Applying to the Three Objections:**

      *   *Objection 1:* "Rebel faction controls territory... foreign governments will cite... pretext for intervention."
          *   Analysis: This is purely about what others will *do* with the info. It doesn't say the rebels *don't* control territory.
          *   Classification: Wrong Kind (Policy/Consequence).
          *   Action: Flag for senior review regarding dissemination, but do not alter analytic judgment.

      *   *Objection 2:* "Source recanted... history of fabrication."
          *   Analysis: This attacks the *evidence* supporting the claim.
          *   Classification: Right Kind (Evidence/Reliability).
          *   Action: Analyst must re-evaluate confidence level or change judgment.

      *   *Objection 3:* "Phrase 'cannot be ruled out'... read as likely... public alarm... diplomatic damage."
          *   Analysis: This is tricky. It's about *communication* causing *consequences*. It's not saying the event *can* be ruled out (evidence), it's saying the *phrasing* is dangerous.
          *   Classification: Blurry. It's a "Wrong Kind" reason to change the *probability*, but a "Right Kind" reason to change the *wording* for clarity.
          *   Nuance: If the probability *is* low, saying "cannot be ruled out" is analytically accurate. If readers misinterpret it, that's a communication failure, not an analytic one. However, preventing "diplomatic damage" is a consequence-based reason.
          *   Verdict: Mixed. Analytic judgment (low prob) = Right Kind. Wording/Dissemination = Wrong Kind (consequence). Needs escalation to decide if we clarify wording or suppress.

  6.  **Refining the Procedure for "Blurry Cases":**
      *   I need to explicitly address the "Communication vs. Substance" blur.
      *   I need to ensure the "Escalation" step is clear. If a consequence is catastrophic (e.g., war), a senior official *might* decide to suppress, but that is a *policy* decision, not an *analytic* one. The procedure must protect the analysts from being forced to lie, while acknowledging the agency head has to manage risk.
      *   *Key Distinction:* "Do not publish this conclusion" (Valid management) vs. "Conclude the opposite" (Invalid analytic pressure). The procedure should focus on *challenging the assessment* (the judgment).

  7.  **Final Polish of the Procedure:**
      *   Make it look like an official form/checklist.
      *   Add a "Decision Matrix" at the end.
      *   Ensure the tone is professional and bureaucratic (fitting the user's context).
      *   Check time limit: 4 questions, simple logic, definitely under 10 mins.

  8.  **Review against Constraints:**
      *   Checklist/Sequence? Yes.
      *   Non-philosophers? Yes (avoid terms like "doxastic justification").
      *   Under 10 mins? Yes.
      *   Handle blur? Yes (via "Communication Check").
      *   Flag escalation? Yes.
      *   Apply to 3 cases? Yes.

  9.  **Self-Correction on Objection 3:**
      *   Is "public alarm" a Wrong Kind reason? Yes, it's a consequence.
      *   Is "readers misinterpret" a Right Kind reason? Yes, it's about clarity/precision (analytic craft).
      *   So the objection mixes a craft critique (clarity) with a consequence critique (alarm). The procedure needs to separate these. If the wording is imprecise, fix the wording (Right Kind). If the wording is precise but the *truth* is alarming, do not change the wording to hide the truth (Wrong Kind).
      *   I will classify Objection 3 as "Mixed/Requires Escalation" because it conflates precision with damage control.

  10. **Finalizing the Output Structure:**
      *   Introduction (acknowledging the gravity).
      *   The Procedure (The "T-U Filter" - Truth vs. Utility).
      *   Application to the 3 Cases.
      *   Closing advice on implementation.

  *(Self-Correction during drafting)*: Make sure to emphasize that "Wrong Kind" doesn't mean "Ignore." It means "Route to Policy/Security, not Analysis." A consequence might be valid for *suppression*, but not for *altering the truth*. The procedure must make this distinction clear so analysts don't feel gaslit, and reviewers don't feel ignored.

  Let's write the "Truth-Utility Filter" (TUF).

  *Step 1: Evidence Check.* (Does it change the probability?)
  *Step 2: Consequence Check.* (Does it describe a fallout?)
  *Step 3: Clarity Check.* (Is it about misunderstanding?)
  *Step 4: Escalation.* (If Consequence is high stakes).

  Okay, ready to generate response.

  *(Final thought on Objection 3)*: The objection says "this wording will be read... as implying the event is likely." If the event is *not* likely, and the wording implies it *is*, that is an analytic error (imprecise communication). If the wording is accurate ("low prob, but possible") and readers *still* panic, that's a consequence issue. The objection claims the wording *causes* the misreading. This is a craft critique. But the *reason* given for the critique is "diplomatic damage." This is the blur. I will categorize it as "Mixed" requiring separation of the clarity issue from the damage issue.

  Okay, proceeding with the response.cw
answer: |-
  ## The Truth-Utility Filter (TUF)
  **Purpose:** To distinguish analytic objections (Right Kind) from policy/consequence objections (Wrong Kind) during the review process.  
  **Time Required:** 5–10 Minutes per objection.  
  **Users:** Reviewers, Senior Analysts, Editors.

  ### Instructions for Reviewers
  When you object to a draft assessment, or when you receive an objection from a stakeholder, apply the following four tests in sequence. Mark **YES** or **NO** for each. Follow the decision matrix at the end.

  #### Step 1: The Evidence Test
  *Does this objection identify new information about the subject matter, a flaw in the source reliability, or a gap in the logical chain connecting evidence to conclusion?*
  *   **YES:** This is a **Right Kind** reason. It bears on the truth of the assessment.
  *   **NO:** Proceed to Step 2.

  #### Step 2: The Consequence Test
  *Does this objection describe a negative outcome (political, diplomatic, military, public) that would result from policymakers or adversaries **believing** or **acting on** this assessment?*
  *   **YES:** This is a **Wrong Kind** reason regarding the *analysis*. It bears on the utility/safety of the assessment, not its truth.
  *   **NO:** Proceed to Step 3.

  #### Step 3: The Clarity Test
  *Is the objection about the **wording** causing misinterpretation (analytic craft), or is it about the **content** causing alarm (consequence)?*
  *   **Wording/Precision:** (e.g., "This phrase is ambiguous.") → **Right Kind** (Fix the writing).
  *   **Alarm/Reaction:** (e.g., "This truth will scare people.") → **Wrong Kind** (Do not dilute the truth).
  *   **UNCLEAR/MIXED:** Proceed to Step 4.

  #### Step 4: The Escalation Flag
  *If Step 2 or 3 yielded a "Wrong Kind" or "Mixed" result, are the potential consequences severe enough (e.g., loss of life, breach of source security, major diplomatic rupture) that dissemination itself requires senior authorization?*
  *   **YES:** **ESCALATE.** Do not change the analytic judgment. Route to the Agency Head/Policy Board for a dissemination decision.
  *   **NO:** **DISMISS** as an analytic objection. The assessment stands as written.

  ---

  ### Decision Matrix

  | Result | Classification | Action Required |
  | :--- | :--- | :--- |
  | **Step 1 = YES** | **Right Kind (Analytic)** | Analyst must address the evidence/logic flaw. Judgment may change. |
  | **Step 2 = YES** | **Wrong Kind (Policy)** | Do **not** alter the judgment. Route to Policy/Security team for dissemination controls (e.g., classification, limited distribution). |
  | **Step 3 = Mixed** | **Blurry (Craft vs. Consequence)** | Separate the issues. Fix ambiguity (Right Kind). Ignore pressure to hide truth (Wrong Kind). If inseparable, **ESCALATE**. |
  | **Step 4 = YES** | **Senior Decision** | Analysis remains intact. Senior leadership decides whether to publish, delay, or restrict. |

  ---

  ### Application to Provided Objections

  Here is how the TUF procedure classifies the three specific objections you provided.

  #### 1. "If we assess that the rebel faction controls significant territory in the north, foreign governments will cite our assessment as a pretext for military intervention."
  *   **Step 1 (Evidence):** **NO.** The objection does not claim the rebels *don't* control the territory.
  *   **Step 2 (Consequence):** **YES.** The objection explicitly cites military intervention by foreign governments as the negative outcome of the belief.
  *   **Step 3 (Clarity):** N/A.
  *   **Step 4 (Escalation):** **YES.** Military intervention is a high-stakes consequence.
  *   **Classification:** **Wrong Kind (Policy/Consequence) → ESCALATE.**
  *   **Action:** The analytic judgment must not be changed to hide the territory control. However, because the consequence is severe, the *dissemination* of this specific judgment may need to be restricted (e.g., Top Secret/NOFORN) or briefed verbally rather than in a written cable. This is a decision for senior leadership, not the reviewer.

  #### 2. "The analyst's primary source for the claim about weapons stockpiles has recanted their earlier testimony and has a documented history of fabrication."
  *   **Step 1 (Evidence):** **YES.** This objection attacks source reliability and the evidentiary basis of the claim.
  *   **Step 2 (Consequence):** N/A.
  *   **Step 3 (Clarity):** N/A.
  *   **Classification:** **Right Kind (Analytic).**
  *   **Action:** The analyst must immediately re-evaluate the confidence level of the assessment. If this source was pivotal, the judgment may need to be downgraded or retracted. This is a valid analytic critique.

  #### 3. "The assessment uses the phrase 'cannot be ruled out' for a low-probability event; this wording will be read by non-expert readers as implying the event is likely, and the resulting public alarm will itself cause diplomatic damage."
  *   **Step 1 (Evidence):** **NO.** It does not claim the event is impossible.
  *   **Step 2 (Consequence):** **YES.** It cites "public alarm" and "diplomatic damage."
  *   **Step 3 (Clarity):** **MIXED.**
      *   *Part A:* "Wording will be read... as implying the event is likely." If the event is low-probability, and the wording implies high-probability, this is an **analytic craft error** (Right Kind). The wording should be clarified to accurately reflect low probability (e.g., "Highly unlikely, but possible").
      *   *Part B:* "...resulting public alarm will cause diplomatic damage." This is a **consequence** (Wrong Kind). You cannot fix diplomatic damage by lying about probability.
  *   **Step 4 (Escalation):** **YES.** Because the objection conflates precision with damage control, and cites diplomatic damage.
  *   **Classification:** **Mixed → ESCALATE.**
  *   **Action:** The reviewer should instruct the analyst to clarify the wording to ensure "low probability" is explicit (fixing the craft error). However, if the *truth* of the low-probability event is still diplomatically damaging, the decision to publish rests with senior leadership. The analyst cannot be forced to change the probability estimate to avoid alarm.

  ---

  ### Implementation Notes for the Unit Head

  1.  **Legitimize the "Wrong Kind":** Do not tell reviewers that "Wrong Kind" reasons are irrelevant. In government, consequences matter. The procedure teaches them that consequences are valid reasons to **restrict dissemination**, but invalid reasons to **distort truth**. This preserves analytic integrity while respecting policy risks.
  2.  **The "Escalation" Safety Valve:** Reviewers often push on consequences because they feel responsible for the fallout. Step 4 gives them a place to put that concern (Senior Leadership) without forcing the analyst to falsify the work.
  3.  **Training:** Run a 30-minute workshop using these three examples. Have reviewers grade them using the checklist. This ensures a shared vocabulary ("That's a Step 2 objection, take it to the Director, don't give it back to the analyst").
