      *   **Conclusion:** Summarize the philosophical stakes (integrity of collective reasoning).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* Condorcet is different enough?
      *   *Correction:* Emphasize that Condorcet is about cycles in preference orderings, while Discursive is about logical inconsistency in propositional attitudes. Condorcet says "We don't know what we want." Discursive says "We believe $A$, we believe $B$, but we deny $A \land B$." The latter is a failure of *truth-tracking* or *rationality*, not just stability.
      *   *Check:* Did I address the "dissolving the problem" part?
