          *   Highlight the logical connection ($P, Q \vdash R$).
          *   The dilemma is about *responsibility to reasons*.
      *   **Section 2: Who Faces the Dilemma? (The Collective Agent):**
          *   It's the chair, the institution, or the group *as a body*.
          *   They must issue a *single* consistent set of judgments to function.
      *   **Section 3: PBP vs. CBP (The Horns of the Dilemma):**
          *   Define them clearly.
          *   Explain the trade-off: Rationality (PBP) vs. Responsiveness/Democracy (CBP).
          *   Explain why neither is perfect (PBP ignores majority on conclusion; CBP creates lying/inconsistency).
      *   **Section 4: The Group Agency Objection (Why Care?):**
