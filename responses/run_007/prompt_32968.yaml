prompt: |-
  I run a small landscaping business and buy and sell used compact equipment — skid steers, mini excavators, that kind of thing — maybe four or five machines a year, each one eight to thirty grand, so a bad buy hurts for a whole season. I've been reading about markets on my own, and the idea that stuck with me is the no-trade stuff: if a seller is willing to sell me a machine at a price I think is good, their willingness to sell at that price is itself information, and I should treat it as evidence about the machine, not just background noise. I get the logic in the abstract but I don't know how to run it on a Tuesday morning when a contractor texts me about a Bobcat he's letting go cheap.

  Please write me a reusable decision procedure for whether to go through with a used-equipment purchase, grounded in that no-trade idea and whatever else about how markets do and don't aggregate information actually bears on it. It should be something I can run in about an hour, without an economist, and my wife signs off on anything over ten thousand so the reasoning has to be legible to her too. Don't spend the whole thing re-explaining the no-trade theorem, I've read enough of that; I need the checklist, with the hard cases. Include: the questions to ask in order, what counts as a sufficent answer to each, where the procedure says walk away, and where it stops being a fact question and becomes a judgment call about risk or need. Then run the procedure on three cases: (1) a contractor selling a 2018 skid steer because he says he's downsizing, (2) a machine at an auction where I can't talk to the seller at all, and (3) a mechanic friend offering me his personal truck at what looks like a great price. At least one of the worked examples should give me an answer I won't like, and I want you to be straight about where this procedure would make me pass up good deals or where it just can't settle the question.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Small landscaping business owner. Buys/sells 4-5 used compact machines/year ($8k-$30k).
      *   **Problem:** Needs a decision procedure for buying used equipment, grounded in "no-trade theorem" logic (adverse selection/information asymmetry) but practical for a Tuesday morning.
      *   **Constraints:**
          *   Reusable checklist.
          *   Run time: ~1 hour.
          *   No economist jargon (needs to be legible to his wife for sign-off on >$10k).
          *   Don't over-explain the theory (he gets it).
          *   Must include: Ordered questions, sufficient answers, walk-away triggers, judgment call boundaries.
          *   Must run on three specific cases: (1) Contractor downsizing (2018 Bobcat), (2) Auction (no seller contact), (3) Mechanic friend's truck.
          *   At least one example must yield an unwanted "Walk Away" result.
          *   Must admit limitations (where it misses good deals or can't decide).

  2.  **Deconstruct the "No-Trade" Insight for this Context:**
      *   *Theory:* If a seller knows more than the buyer and is willing to sell at the market price, the buyer should infer the asset is likely below market quality (Akerlof's Lemons / Milgrom-Stokey No-Trade).
      *   *Application:* Why is *this* seller selling to *me* at *this* price?
      *   *Key Signal:* Willingness to sell $\neq$ Opportunity. It's a signal of hidden information unless countered by a "liquidity shock" or "strategic mismatch" reason.
      *   *Goal:* Distinguish between "Lemon" (hidden defect) and "Liquidity/Mismatch" (good machine, wrong owner).

  3.  **Drafting the Decision Procedure (The "Tuesday Morning Checklist"):**
      *   *Structure:* Needs to be linear, logical, and binary where possible.
      *   *Phase 1: The "Why" (Information Asymmetry Check).* This is the core no-trade application.
      *   *Phase 2: The Verification (Costly Signaling).* How to prove the "Why."
      *   *Phase 3: The Numbers (Financial Viability).* Even if it's not a lemon, can we afford it?
      *   *Phase 4: The Wife Test (Legibility).* Clear summary for the non-expert.
      *   *Walk-Away Triggers:* Needs specific red flags.
      *   *Judgment Calls:* Where does the checklist end and gut feeling begin?

      *Drafting Questions:*
      1.  Why are they selling? (Need a reason external to machine quality).
      2.  Can they prove usage/maintenance? (Records, hours).
      3.  Is the price *too* good? (If it's way below market without explanation, it's a trap).
      4.  Inspection? (Mechanic or self).
      5.  Liquidity/Need? (Do we actually need this?).

      *Refining for the "No-Trade" angle:* The critical step is establishing a *non-informational* reason for the trade. If the seller has private info (it's broken) and I don't, trade shouldn't happen. If the seller has a liquidity need (going out of business) or a fit issue (needs a bigger machine), trade *can* happen. The checklist must force the user to validate the latter.

  4.  **Developing the Three Cases:**

      *   *Case 1: Contractor Downsizing (2018 Bobcat).*
          *   *Scenario:* Plausible legitimate reason.
          *   *Outcome:* Likely "Proceed" but with conditions.
          *   *Twist:* Maybe the hours don't match the story. Let's make it a "Proceed with Caution/Inspection" to show nuance. Or better, make it a "Walk Away" to satisfy the "answer I won't like" constraint? No, let's save the hard "Walk Away" for the friend or auction. Let's make Case 1 the "Gray Area/Judgment Call."
          *   *Correction:* The prompt asks for *at least one* answer I won't like. Let's make Case 3 (Friend) the hard "Walk Away" because it violates the information principle most dangerously, or Case 2 (Auction) because you can't verify the "Why." Actually, the Friend scenario is the best place to apply the no-trade theorem rigorously. Friends often dump lemons on friends. Let's make Case 3 the "Walk Away."

      *   *Case 2: Auction (No Contact).*
          *   *Scenario:* High information asymmetry.
          *   *Outcome:* Strict valuation discount required. If price > discounted value, walk.
          *   *Lesson:* No-trade theorem is strongest here. You assume the worst.

      *   *Case 3: Mechanic Friend's Truck.*
          *   *Scenario:* Trust vs. Incentive.
          *   *Outcome:* This needs to be the "Walk Away" that hurts. Why? Because friends often sell problems they can't fix or don't want to warranty. The "no-trade" logic says: If he knows it's great, why sell? If he sells, he knows something.
          *   *Refinement:* Let's make Case 1 the "Walk Away" to surprise him. A contractor "downsizing" is the classic cover story for a lemon. Let's say the hours are low but the wear is high.
          *   *Re-evaluation:* The prompt asks for *at least one* answer I won't like. I will make Case 1 (The Contractor) the "Walk Away" because it looks the most legitimate but fails the specific "Why" test upon scrutiny. This demonstrates the value of the procedure.

  5.  **Refining the "Wife Test":**
      *   Needs to be simple. "Risk," "Cost," "Reason."
      *   One-page summary format.

  6.  **Addressing Limitations:**
      *   Must admit that this procedure kills deals. It creates a "lemons discount." You will miss out on some good machines because you couldn't verify the seller's motive. That's the cost of safety.

  7.  **Final Polish:**
      *   Tone: Professional, direct, peer-to-peer (contractor to contractor).
      *   Formatting: Bold headers, checkboxes, clear "STOP" signs.
      *   Ensure the "No-Trade" logic is embedded in the questions (e.g., "What forces the sale?") without lecturing on it.

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I explain the theorem? *No, keep it minimal.*
      *   *Check:* Is it under an hour? *Yes, if records are available.*
      *   *Check:* Is the wife sign-off clear? *Yes, add a specific section.*
      *   *Check:* Did I hit the "Walk Away" requirement? *Yes, Case 1 will be the hard stop.*

      *(Self-Correction on Case 1)*: If I make Case 1 a walk away, I need to be sure the logic holds. A contractor downsizing is a *liquidity/strategy* reason, which usually validates trade. To make it a walk away, the *evidence* must contradict the story. E.g., Says downsizing, but buying a bigger machine next week. Or says low hours, but hydraulic leaks suggest otherwise. Let's go with: Story is "downsizing," but market check shows he just bought a newer model of the *same* machine, implying this one is the spare/lemon. That triggers the no-trade alarm.

      *(Self-Correction on Case 3)*: Actually, the Friend case is more poignant for "No-Trade." If a mechanic friend sells a truck, he knows the engine better than anyone. If he sells, he knows it's about to blow. I'll make Case 3 the hard "Walk Away" because it's emotionally difficult but logically sound. Case 1 can be a "Go" to show the procedure works for legitimate sellers. Case 2 is a "Go with Discount." Case 3 is "No." This feels more balanced. Wait, prompt says "At least one... answer I won't like." Okay, I'll stick with Case 3 being the hard no. It's the most counter-intuitive (trust vs. logic).

      *Wait, let's look at the "No-Trade" logic again.* The theorem says trade shouldn't happen if information is asymmetric and rational. Trade *only* happens if there's a difference in valuation *unrelated* to quality (liquidity, risk tolerance, usage fit).
      *   Case 1 (Contractor): Difference in usage fit (downsizing). Valid.
      *   Case 2 (Auction): High asymmetry. Valid only at deep discount.
      *   Case 3 (Friend): High asymmetry (he knows the history). If price is "great," why isn't he keeping it? This is the strongest No-Trade signal. I will make Case 3 the "Walk Away."

      *Wait, one more check:* The prompt asks for "where the procedure says walk away, and where it stops being a fact question and becomes a judgment call." I need to explicitly mark those boundaries.

      *Final Plan:*
      1.  Intro: Acknowledge the theory, pivot to practice.
      2.  The Procedure (The "Tuesday Checklist").
      3.  The "Wife Sheet" (Summary).
      4.  The Three Cases.
      5.  Limitations/Admissions.

      *Let's write.*
answer: |-
  # The "Tuesday Morning" Equipment Decision Procedure

  This procedure is designed to operationalize the "no-trade" insight: **A seller's willingness to sell is evidence of hidden defects unless you can identify a reason for the sale that is unrelated to the machine's quality.**

  You have one hour. If you cannot clear these hurdles in one hour, you do not have enough information to buy.

  ## Part 1: The Checklist (Run Time: 45–60 Minutes)

  ### Phase 1: The Motive Test (The No-Trade Filter)
  *Goal: Identify a reason for the sale that is not based on private information about machine quality.*

  **Q1: What specific event forces this sale?**
  *   **Acceptable Answers:** Business closure, upsizing/downsizing fleet (verify with other listings), cash flow emergency (verify with urgency), equipment redundancy (they bought a replacement).
  *   **Unacceptable Answers:** "Just don't need it," "Upgrading" (without proof of new purchase), "Moving" (without proof of move), Silence/Evasion.
  *   **STOP:** If the answer is vague or unverifiable within 15 minutes of research (calling references, checking online listings), **WALK AWAY.**

  **Q2: Why are they selling to *you* specifically (or the public) instead of a dealer?**
  *   **Acceptable Answers:** Dealer offer was too low (verify typical trade-in value), they need cash faster than dealer terms allow, they know you and trust you (see Risk Note below).
  *   **Unacceptable Answers:** "Dealer wouldn't take it" (without explanation), "Selling private for more money" (without justification why this machine commands premium private attention).
  *   **STOP:** If the seller implies the machine is too good for a dealer but won't let you inspect it like a dealer would, **WALK AWAY.**

  ### Phase 2: The Verification Test (Costly Signaling)
  *Goal: Force the seller to put skin in the game to prove Q1.*

  **Q3: Can they provide maintenance records matching the hour meter?**
  *   **Sufficient:** Invoices for filters, fluid, repairs that align with hours.
  *   **Insufficient:** "I changed the oil myself," "Lost the books."
  *   **STOP:** If no records exist, apply a **20% "Lemon Discount"** to your maximum bid. If the price doesn't meet this discounted value, **WALK AWAY.**

  **Q4: Will they allow a third-party inspection or cold start?**
  *   **Sufficient:** Yes, unconditionally.
  *   **Insufficient:** "It's cold outside," "It's at a job site," "As-is where-is" (without prior inspection).
  *   **STOP:** If they block a cold start or inspection, **WALK AWAY.** No exceptions. This is the highest correlation with hidden hydraulic or engine failure.

  ### Phase 3: The Valuation Test
  *Goal: Ensure the price reflects the risk.*

  **Q5: What is the "Quick Sale" market value?**
  *   *Action:* Check MachineryTrader, Facebook Marketplace, and local auction results for the last 90 days for similar hours/condition.
  *   **Rule:** Your max offer is 80% of the average asking price for similar units. (You need margin for immediate repairs and resale risk).
  *   **STOP:** If the seller's firm price is above your 80% mark, **WALK AWAY.** Do not fall in love with the machine.

  ### Phase 4: The Judgment Boundary
  *At this point, facts run out. You must decide based on risk tolerance.*

  *   **If Phase 1 & 2 passed:** The risk is mostly mechanical wear (quantifiable).
  *   **If Phase 1 failed but Phase 2 passed:** The risk is hidden history (unquantifiable). Only proceed if the price is 40% below market.
  *   **If Phase 3 passed:** The financial risk is contained.
  *   **The Wife Test:** If the purchase requires her sign-off (> $10k), fill out the "One-Page Summary" below. If you cannot fill it out simply, you do not understand the deal well enough to explain it. **Do not buy.**

  ---

  ## Part 2: The "Wife Sheet" (For Sign-Off >$10k)

  *Fill this out before asking for approval. If you can't check the boxes, the answer is no.*

  | Item | Requirement | Status |
  | :--- | :--- | :--- |
  | **Reason for Sale** | Verified external reason (e.g., downsizing), not just "wants to sell." | [ ] Verified [ ] Unknown |
  | **Inspection** | Cold start & mechanic check completed or waived for deep discount. | [ ] Passed [ ] Waived |
  | **Price vs. Market** | Purchase price is at least 20% below average market listing. | [ ] Yes [ ] No |
  | **Worst Case** | If machine dies in 3 months, we can repair/replace without hurting payroll. | [ ] Yes [ ] No |
  | **Resale Floor** | If we hate it, we can sell it in 3 months for at least purchase price. | [ ] Yes [ ] No |

  ---

  ## Part 3: Worked Examples

  Here is how the procedure runs on three real-world scenarios.

  ### Case 1: The "Downsizing" Contractor (2018 Skid Steer)
  **Scenario:** A local contractor texts you. He has a 2018 Bobcat T770, 1,200 hours. Asks $24,000. Market average is $28,000. He says he's downsizing the fleet.

  *   **Phase 1 (Motive):** You call him. He says business is slow, needs to free up capital.
      *   *Check:* You search his company name online. You see a post from last week advertising a *newer* 2022 model for sale as well.
      *   *Analysis:* If he's downsizing, why did he buy a 2022 recently? Or, if he's keeping the 2022, why is the 2018 the one going? It implies the 2018 is the problem child. The "downsizing" story is contradicted by recent buying behavior.
      *   *Result:* **FAIL Q1.**
  *   **Phase 2 (Verification):** He offers records. They show oil changes but no hydraulic filter changes. He agrees to a cold start.
  *   **Phase 3 (Valuation):** Price is $24k vs $28k market. That's only a 14% discount.
  *   **Procedure Verdict:** **WALK AWAY.**
  *   **Why:** The motive is suspect (contradictory evidence), and the price discount (14%) is not deep enough to compensate for the risk that the "downsizing" story is a cover for a machine that eats hydraulics. You will likely find a leak during inspection, but the procedure stops you *before* you waste the trip.
  *   **Hard Truth:** This might be a perfectly fine machine. But the information asymmetry is skewed against you. The procedure forces you to pass because the *signal* is noisy.

  ### Case 2: The Public Auction (Mini Excavator)
  **Scenario:** A local auction house has a 2015 Kubota. No reserve. You cannot talk to the owner. It runs in the video, but you can't do a cold start.

  *   **Phase 1 (Motive):** Unknown. Could be estate, could be bankruptcy, could be "lemon."
      *   *Analysis:* Maximum information asymmetry. You must assume the worst (Akerlof's Lemons).
      *   *Result:* **FAIL Q1 & Q2.** (You cannot verify motive or inspect).
  *   **Phase 2 (Verification):** Impossible.
      *   *Rule:* Apply the "Lemon Discount" (20% minimum) plus an "Inspection Risk Discount" (another 15%). Total required discount: 35% below market.
  *   **Phase 3 (Valuation):** Market value is $20,000. Your max bid is $13,000.
  *   **Procedure Verdict:** **BID ONLY UP TO $13,000.** If it goes to $14,000, **STOP.**
  *   **Why:** You are buying a box of unknowns. The no-trade theorem is strongest here. The seller knows the machine's flaws; you know nothing. Trade is only rational if the price is so low that the flaws don't matter financially.
  *   **Judgment Call:** If you have a mechanic on standby who can fix anything same-day, you might push the bid to $15k. That is a risk tolerance call, not a fact call.

  ### Case 3: The Mechanic Friend's Truck
  **Scenario:** Your friend, a diesel mechanic, offers you his personal Ford F-350. He says, "I'm getting a newer one, want to buy mine? It's solid, I'll give you a deal." Price is $15,000. Market is $19,000.

  *   **Phase 1 (Motive):** He says he's upgrading.
      *   *Check:* He is a mechanic. He knows the vehicle's history better than any seller in existence.
      *   *Analysis:* This is the **highest possible information asymmetry.** If the truck were perfect, a mechanic would keep it as a backup or sell it to a customer with a warranty. Selling it to a friend "as-is" suggests he knows a major repair is looming that he doesn't want to pay for (or warranty).
      *   *Result:* **FAIL Q1 (High Risk).** The "friendship" actually increases the adverse selection risk, it doesn't lower it.
  *   **Phase 2 (Verification):** He says, "You don't need to inspect, I maintain it."
      *   *Result:* **FAIL Q4.** Refusal of independent inspection is a critical failure.
  *   **Phase 3 (Valuation):** $15k vs $19k is a 21% discount.
      *   *Rule:* For a friend/mechanic sale with no inspection, the required discount is 40%+ because you cannot verify the "Why."
  *   **Procedure Verdict:** **WALK AWAY.**
  *   **Why:** This is the answer you won't like. It feels rude. But the logic is strict: **He knows more than you.** His willingness to sell at a "good" price is strong evidence that the asset is overvalued at that price.
  *   **The Script:** "I value our friendship too much to mix business into it. If something breaks, I'll be mad, and you'll feel guilty. I'm going to pass."

  ---

  ## Part 4: Limitations & Admissions

  This procedure is not perfect. It is a risk-management tool, not a profit-maximization tool.

  **1. You Will Miss Good Deals.**
  In Case 1 (Contractor), the guy might actually be downsizing and the 2022 listing might be for a client. By walking away, you avoid risk, but you also forfeit profit. The no-trade theorem dictates that to be safe, you must assume the worst. This costs you opportunity. **Accept this.** It is cheaper to miss a good Bobcat than to buy a bad one.

  **2. It Cannot Settle "Urgency."**
  If you *need* a machine tomorrow to start a job, this procedure is too slow. In that case, you are paying a "panic premium." Acknowledge that you are gambling, not investing. Do not use this checklist for emergency buys; use it for fleet building.

  **3. The "Friend" Problem.**
  Case 3 highlights where markets fail socially. The procedure tells you not to buy from friends if you can't inspect. This protects your money but strains the relationship. The procedure prioritizes the business solvency over the social capital. If you value the friendship more than the $4k savings, ignore the procedure—but know you are violating the information principle.

  **4. The Judgment Boundary.**
  The checklist stops at Phase 3. It tells you *if* the deal is safe. It does not tell you *if* the deal is necessary. Buying a $20k machine that passes all checks is still a bad idea if you don't have work for it. That is a business strategy call, not a market information call.

  ### Final Note for the Wife
  If she asks why you passed on the Friend's Truck (Case 3), show her **Phase 1, Q1**. Explain: *"He knows more about the truck than I do. If it was perfect, he'd keep it. Because he's selling it to me without letting me check it, the math says it's about to break. I'm saving us $10k in repairs by hurting his feelings for a week."*
