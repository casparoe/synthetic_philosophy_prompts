prompt: |-
  I teach an upper-level seminar on paradoxes in the law, about 15 students, 90-minute sessions. I want to run a classroom game that makes them feel the weirdness of self-amending rules — the kind of thing you get in Nomic, or in constitutional paradoxes where the amendment clause is used to amend itself. I don't want to explain the problem up front. I want them to run into it by actually trying to operate under a ruleset that turns out to be self-referentially unstable, and only then step back and see what happened.

  Can you design the activity? I need the initial rules (simple enough to explain in five minutes), the setup — groups, roles, a point system that gives them something to fight over — a timeline for the session, and what I as facilitator do at each stage. The game should have a moment where the rules go haywire: someone tries to do something that's permitted under one reading of the rules and prohibited under another, and there's no higher rule to settle which reading wins. The debrief should map what happened onto the conceptual issues — self-reference, the distinction between rules that govern conduct and rules that govern rule-change, the paradox of self-amendment, and why "just follow the rules" isn't always a determinate instruction. Also tell me what predictably goes wrong the first time I run it and what I should do when it does, and be honest about which features of the philosophical problem the activity can't reproduce and I'll have to supply myself in discussion.

  I'd like you to say how confident you are in the major design choices and single out the thing you're least sure about. And please just write in continuous prose, like an email — no headings, no bullet points, no bold, no tables.
