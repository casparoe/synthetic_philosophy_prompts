prompt: |-
  I've been reading the debate about whether ordinary objects—tables, chairs, mountains—really exist, and after six months I've concluded it has completely stalled. The eliminativists say, roughly, that only simples exist, or that composition never occurs, so there are no tables, only particles arranged tablewise. The conservatives say this is absurd: we can see tables, we build them, we sit at them. Both sides have refined their arguments to the point where every move has a standard countermove, and I can't find anyone in the literature who has changed their mind in response to an argument from the other side since about 2005.

  I want you to diagnose this debate as a metaphilosopher specializing in metaontology—not to adjudicate it, but to tell me what kind of disagreement this is and why it's stuck. Is this a verbal dispute in Chalmers's sense, where the two sides are using "exists" or "object" differently and talking past each other? Is it a substantive dispute where one side is simply wrong but we lack the evidence to settle it? Is it a case where the two sides share all the same beliefs about the non-philosophical facts and diverge only in how they weigh theoretical virtues like parsimony and conservatism, making it a clash of epistemic temperaments rather than a factual disagreement? Or is the whole question ill-posed in some way?

  In your diagnosis, please be specific about what each side's core commitment actually is, and distinguish between what they say in papers and what the disagreement would look like if we charitably reconstructed it. I'm especially interested in whether there is a hidden empirical question doing work—something about perception, or about how we track and count objects, or about the semantics of natural-language sortals—that one side thinks is decisive and the other doesn't.

  After your diagnosis, provide a structured summary as a JSON object with the following fields:

  - "diagnosis": a short label for the kind of disagreement (e.g., "verbal_dispute", "substantive_factual_dispute", "clash_of_theoretical_virtues", "ill_posed_question", "mixed")
  - "what_each_side_wants": a two-element object with keys "eliminativist" and "conservative", each giving a one-sentence description of what that side would need the other to concede for the debate to count as resolved
  - "hidden_empirical_component": the empirical question, if any, that you think is secretly driving the impasse, or null if none
  - "what_would_count_as_progress": the most realistic thing that could actually move the debate forward given your diagnosis, or an argument that nothing would
  - "where_this_diagnosis_is_weakest": the step in your reasoning where you are least confident, and what alternative diagnosis becomes plausible if that step fails

  Finally, I want you to tell me: what argument or consideration would make you change your diagnosis? That is, what's the thing you could learn about this debate—a particular argument you haven't considered, a way of reframing it, an empirical result—that would lead you to reclassify the disagreement as something else?

  Take your time. Start by brainstorming the possible diagnoses before settling on one, and flag the places where you're making a judgment call rather than reporting a consensus.
