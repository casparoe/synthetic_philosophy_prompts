          *   Reader's Conclusion: Yes, but only if you accept the premise. It makes quietist art *ethically* suspect, not necessarily *aesthetically* failed.

      *   *Claim 5 (The Radical/Ontological):* Aesthetic value *is* political efficacy. There is no separate aesthetic realm.
          *   Status: Radical/Controversial.
