      *   **The Conflict:** A fellow member (a painter) interprets Du Bois's line ("Thus all Art is propaganda and ever must be...") as a universal claim that *all* art is inherently political/propagandistic, making "art for art's sake" dishonest and quietist art a failure. The user is skeptical of this strong reading but wants precision, not just gut feeling.
      *   **The Task:** Create a "systematic menu" of distinct precise claims the slogan "all art is propaganda" might express.
