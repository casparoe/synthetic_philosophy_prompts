          *   Reader's Conclusion: No. Just because art *has* effects doesn't mean its *value* lies there. A quietist poem still has effects, but maybe unintentional ones.

      *   *Claim 2 (The Semantic/Expressive):* Art expresses a perspective, and having a perspective is political.
