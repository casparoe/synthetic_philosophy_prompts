  8.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note during final output generation)*: I need to be careful not to misrepresent Du Bois. In "Criteria," he is specifically addressing the *Negro Artist*. The painter's claim is "All Art" (universal). Du Bois's claim is often read as "All [Negro] Art [in this context]". I need to make sure the menu distinguishes between a universal claim and a contextual claim, as that is likely where the user's group is talking past each other. I will add a specific thesis on the "Contextual Imperative."

  Let's organize the theses:
  1.  The Sociological Fact (Descriptive/Weak)
  2.  The Semantic Inevitability (Expressive)
  3.  The Contextual Imperative (Du Bois's likely actual meaning)
