prompt: |-
  Okay so I'm on my university's honorary degrees committee — not something I ever expected to be doing — and we've hit a wall on one nomination and its my turn to write the memo. The nominee is a former Director of National Intelligence. The facts aren't really in dispute: after a major terrorist attack, he authorized a warrantless surveillance program that swept up domestic communications on a huge scale. Multiple courts later ruled it unconstitutional. There are internal memos from the time showing he knew the legal basis was shaky. But — and here's the part that's splitting the committee — the intelligence community's own after-action assessments say the program almost certainly prevented a second attack on a major city, plausibly saving thousands of lives. No one's really challenging those assessments.

  So the committee is basically 50/50. One camp says: you can't give an honorary degree to someone who deliberately authorized an illegal program that violated citizens' rights for years. It would signal the university is fine with "the ends justify the means" as long as the ends are big enough. The other camp says: refusing to honor him signals that we'd rather have a public servant who keeps his hands clean while people die than one who gets his hands dirty doing the necessary thing. They're framing our refusal as a kind of moral cowardice — we get to feel righteous, and he's the one who had to make the actual call.

  The chair has asked for a short memo (call it a thousand words) that recommends a clear course of action and actually works through the moral question, not just a "on balance" hedge. We vote next week. I'm supposed to treat both sides seriously and come down somewhere definite. I need something the committee can actually deliberate over and vote on — and honestly I could see myself going either way, so I want the reasoning laid out clearly enough that the memo itself might change my mind.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a university's honorary degrees committee.
      *   **Task:** Write a 1,000-word memo recommending a clear course of action (Yes or No) regarding a nominee.
      *   **Nominee:** Former Director of National Intelligence (DNI).
      *   **Key Facts:** Authorized warrantless domestic surveillance after a major terrorist attack. Courts ruled it unconstitutional. Internal memos show he knew the legal basis was shaky. Intelligence assessments say it prevented a second attack/saved thousands of lives.
      *   **The Conflict:** "Rule of Law/Rights" vs. "Utilitarian/Security" (Dirty Hands problem).
      *   **Committee Status:** 50/50 split.
      *   **Requirement:** Treat both sides seriously, come down definitively (no hedging), work through the moral question deeply.
      *   **Goal:** Provide reasoning clear enough to potentially change the author's (and committee's) mind.

  2.  **Determine the Stance:**
      *   To make the memo compelling and useful for deliberation, it needs to take a strong position. A "no" vote is generally more aligned with the core mission of a university (pursuit of truth, rule of law, civil liberties). However, a "yes" vote argues for the "dirty hands" theory of leadership.
      *   *Decision:* I will argue for **declining the nomination (No)**. Why? Because universities are institutions dedicated to principles (like constitutional law and ethics), not just outcomes. Honoring someone who knowingly violated the Constitution undermines the academic mission more than refusing to honor someone who made a utilitarian calculation undermines national security. It creates a sharper moral tension for the committee to debate.
      *   *Alternative:* I could argue "Yes" based on the burden of leadership. But the "Rule of Law" argument is usually more resonant in an academic setting. Let's stick with "No" but ensure the "Yes" arguments are represented fairly before refuting them.

  3.  **Outline the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Introduction:** State the purpose, the nominee, and the recommendation (Decline).
      *   **The Case for Honor (The "Dirty Hands" Argument):** Acknowledge the weight of the decision, the threat environment, the lives saved, and the burden of leadership. Validate the pro-nomination side.
      *   **The Case Against Honor (The Institutional Integrity Argument):** Focus on the university's mission, the rule of law, the precedent set, and the distinction between *understanding* a choice and *celebrating* it.
      *   **The Deciding Factor:** Why the university's specific role tips the scale. The difference between a political award and an academic honor.
      *   **Conclusion:** Reiterate the recommendation.

  4.  **Drafting - Section by Section (incorporating word count and tone):**

      *   *Tone:* Professional, thoughtful, rigorous, empathetic but firm.
      *   *Word Count Check:* Needs to be around 1,000 words. I need to expand on the philosophical underpinnings to meet this without fluff.

      *   *Intro:* Keep it crisp. State the recommendation immediately.
      *   *Section 1: The Argument for Conferral.* Focus on the "Tragic Choice." Max Weber's "Ethics of Responsibility." The reality of the post-attack panic. The intelligence community's validation. The accusation of moral cowardice against the committee.
      *   *Section 2: The Argument for Declining.* Focus on the "Ethics of Conviction." The University's role as a guardian of constitutional principles. The danger of normalizing extra-legal action. The internal memos (knowledge of illegality).
      *   *Section 3: Synthesis/Resolution.* Why the University isn't the White House. We honor *exemplars*, not just *effective actors*. If we honor this, what does it say to our law students, our civics students?
      *   *Conclusion:* Final push.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "No" argument too preachy?
      *   *Fix:* Ensure I acknowledge that the "Yes" side isn't wrong about the lives saved. The conflict isn't Truth vs. Lies, it's Values vs. Outcomes.
      *   *Critique:* Is the distinction between "understanding" and "honoring" clear?
      *   *Fix:* Make sure to emphasize that we can study his tenure without awarding him a degree.
      *   *Word Count Management:* I need to ensure I don't run short. I will expand on the specific implications for the university's mission (law school, political science department, etc.).

  6.  **Final Polish:** Check the flow, ensure the recommendation is unambiguous, and verify the tone is appropriate for a committee memo. (The prompt asks for ~1000 words).

      *(Self-Correction on Word Count)*: I need to be careful not to write *too* little. I will expand the philosophical discussion on "Dirty Hands" vs. Institutional Integrity to ensure depth.

  7.  **Final Review against constraints:**
      *   Memo format? Yes.
      *   Clear recommendation? Yes (Decline).
      *   Treats both sides seriously? Yes.
      *   Works through moral question? Yes.
      *   ~1000 words? I will aim for that density.

      *(Drafting thought)*: Let's make sure the "Dirty Hands" argument gets its due. It's a legitimate political theory (Walzer, Weber). I should reference the weight of that. Then counter with the specific nature of *academic* honors.

      *(Drafting thought)*: The prompt mentions internal memos showing he knew the legal basis was shaky. This is crucial. It moves it from "mistake" to "choice." I need to highlight that.

      *(Drafting thought)*: The prompt mentions the committee is 50/50. The memo needs to bridge that gap.

      *Let's write.*

      *(Post-Drafting Check)*: Looks like the draft is coming in a bit short. I need to expand on the "Precedent" aspect. What happens if we do this? Does it open the door for other controversial figures? I will add a paragraph on the slippery slope of "results-oriented" honoring.

      *(Second Post-Drafting Check)*: I need to make sure the "moral cowardice" accusation is directly addressed. That's a specific point in the prompt. I will add a section specifically on "The Charge of Cowardice."

      *Okay, ready to generate.*

      *(Wait, one more thing)*: The prompt asks me to treat both sides seriously and come down somewhere definite. I need to make sure the "Yes" argument feels *strong*, not like a strawman. The stakes (thousands of lives) are massive. I must not minimize that.

      *Okay, proceeding with generation.*

