answer: |-
  You have identified a sophisticated and pervasive rhetorical maneuver that sits in the blind spot between logic, rhetoric, and metaethics. It is frustrating precisely because it is designed to be unassailable: if you attack the evaluation, the speaker retreats to the explanation; if you attack the explanation, they claim you are resisting history.

  There is no single, canonical Latin term for this specific sleight of hand, but in contemporary metaethics and critical theory, it is best understood as a species of **Stealth Debunking** (or what I will call **The Genealogical Insinuation**). It relies on **Explanatory Reductionism** to do normative work while disavowing normative intent.

  To give you the boundaries you asked for, we must distinguish this move from three neighbors: the Genetic Fallacy, Nietzschean Genealogy, and Legitimate Debunking Arguments.

  ### 1. The Core Mechanism: The Genealogical Insinuation
  The move functions by exploiting the psychological weight of origins without accepting the logical burden of a normative conclusion.

  *   **The Setup:** The speaker offers a causal history of a norm (e.g., "Human rights emerged from specific theological commitments").
  *   **The Framing:** The history is told using "thick" descriptive language that carries negative connotations (e.g., "dogma," "hangover," "power structure," "contingency") rather than neutral language (e.g., "development," "synthesis," "evolution").
  *   **The Shield:** When challenged, the speaker invokes the **Is-Ought Distinction**. They claim, "I am merely describing the causal history. I am not saying the norm is false."
  *   **The Payoff:** Despite the shield, the audience is left with the *feeling* that the norm is unjustified. The speaker gets the rhetorical benefit of debunking without the argumentative responsibility of proving the norm is false.

  This is not merely the **Genetic Fallacy**. The Genetic Fallacy is a formal error in reasoning: *"X comes from Y, Y is bad, therefore X is bad."* It is an explicit inference. The move you are describing is more insidious because it **refuses to make the inference explicit.** It relies on *pragmatic implicature*. The speaker implies the evaluation conversationally while denying it semantically.

  **Boundary:** If the argument explicitly concludes "Therefore, this norm is invalid," it is the Genetic Fallacy (or a Debunking Argument). If it refuses to conclude that but ensures you feel it anyway, it is **Stealth Debunking**.

  ### 2. Contrast with Nietzschean Genealogy
  You asked about Nietzsche. This is the crucial philosophical boundary. Nietzsche is often accused of committing the genetic fallacy, but a careful reading of *On the Genealogy of Morality* shows he is doing something different—and he is honest about it.

  *   **Nietzsche's Transparency:** Nietzsche does not pretend to be neutral. He openly admits he is attacking Christian morality. He traces the origin of "good and evil" to *ressentiment* not to say "therefore it is logically false," but to say "therefore it is a symptom of a declining form of life." He owns the evaluation. He wants to *transvalue* values, not merely describe them.
  *   **The Insinuation's Denial:** The move you are noticing pretends to be a neutral historical or sociological observation. It claims the status of *science* or *history* while performing the work of *polemic*.

  **Boundary:** Nietzsche is an **open combatant**; he admits his genealogy is a weapon. The move you are describing is a **covert operative**; it claims to be a mirror while acting as a hammer. If the author admits they are trying to undermine the norm, they are doing Nietzschean genealogy. If they claim they are "just asking questions" or "just tracing history" while undermining the norm, they are doing Stealth Debunking.

  ### 3. Contrast with Legitimate Debunking Arguments
  In contemporary metaethics (e.g., Sharon Street, Richard Joyce), there is a legitimate form of argument called a **Debunking Argument**. This argues that if the causal explanation of a belief does not track the truth (e.g., evolution shaped our moral intuitions for survival, not for moral truth), then the belief is unjustified.

  *   **The Bridge Premise:** A legitimate debunking argument must state a **bridge premise**. It must argue: *"If a belief is caused by Process X, and Process X does not track Truth, then the belief is unjustified."* This premise is open to scrutiny. You can argue against the bridge.
  *   **The Insinuation's Shortcut:** The move you are describing hides the bridge premise. It presents the causal origin and lets the audience supply the bridge premise themselves ("Oh, if it comes from property laws, it's probably just about money, not justice"). By hiding the premise, the speaker makes it impossible to critique the logic.

  **Boundary:** A legitimate debunking argument invites scrutiny of the link between origin and validity. Stealth Debunking obscures that link to protect it from scrutiny.

  ### Proposed Terminology and Criteria
  Since there is no single established term, I propose we label this **"The Explanatory-Debunking Slide."** It is a rhetorical slide from *explanation* to *evaluation* that occurs in the gap of the speaker's disavowal.

  For a case to count as **The Explanatory-Debunking Slide**, it must meet four criteria:

  1.  **Causal Reduction:** The norm is explained as the product of a specific, often non-rational cause (e.g., power, economics, psychology, historical accident).
  2.  **Pejorative Framing:** The vocabulary used to describe the origin carries negative evaluative weight (e.g., calling a tradition a "construct," a "regime," or a "hangover" rather than a "framework" or "heritage").
  3.  **Plausible Deniability:** When challenged on the evaluation, the speaker retreats to the factuality of the causal claim ("I'm just saying this is where it came from").
  4.  **Rhetorical Effect:** The net effect on the audience is a diminution of the norm's authority, regardless of the speaker's official disclaimer.

  ### Why This Matters
  The danger of this move is not just logical; it is epistemic. It creates a **one-way ratchet of skepticism**.
  *   If you try to defend the norm, you are asked for its historical origin.
  *   If you provide the origin, it is framed as reductive.
  *   If you object to the framing, you are accused of fearing history.
  *   If you point out the fallacy, you are told you are misunderstanding the "nuanced" explanation.

  This creates a position that is immune to critique because it refuses to state its criteria for success. A genuine genealogy (like Williams' *vindicatory* genealogy) tries to show *why* we need a value. A genuine debunking argument tries to show *why* a value is false. The Explanatory-Debunking Slide tries to make the value *feel* fragile without proving it is.

  ### Summary of Boundaries
  *   **Genetic Fallacy:** Explicitly infers value from origin. (Logic error)
  *   **Legitimate Debunking:** Explicitly argues that origin undermines justification. (Philosophical argument)
  *   **Nietzschean Genealogy:** Openly admits the intent to revalue based on origin. (Philosophical project)
  *   **Explanatory-Debunking Slide:** Implicitly suggests origin undermines justification while denying that suggestion. (Rhetorical maneuver)

  You are right to be suspicious of it. It is a way of winning an argument by refusing to state what the argument actually is. When you encounter it, the correct philosophical response is to force the speaker to articulate the **bridge premise**: *"You are explaining the origin, but you are clearly implying the origin matters for the validity. Are you arguing that norms with this origin are invalid? If not, why does the origin matter? If so, please defend that claim."* This collapses the slide back into a standard argument, where it can be properly evaluated.
