  Expert in moral philosophy — think carefully, and don't just hand me a label; I want the boundries of the thing. I keep noticing a move in moral and political arguments that I don't have a precise term for. Someone will give a disreputable-sounding origin for a norm or value — monogamy traced back to inheritance and property, say, or human rights traced to secularized Christian universalism — and then a paragraph later they treat that origin as if it had already made the norm suspect. But if you object that this is just the genetic fallacy, they'll insist they're only explaining where the norm came from, not evaluating it. Then the debunking tone quietly creeps back in. What exactly is that move? I know it's somewhere near what Nietzsche is doing in his genealogy of morality, but I'm not sure whether he's guilty of it, doing it on purpose, or doing something cleaner. Is there an established term for an origin-explanation that is treated as debunking while it officially disavows any evaluative force, and how does it differ from the genetic fallacy on one side and from a genuinely debunking genealogy on the other? If there's no established term, what would you call it, and what would a case need to look like to count as one?
