          *   *Critique:* This is more Wittgenstein. Putnam touches on it with "Division of Linguistic Labor," but it's not the *main* point of "ain't in the head."
          *   *Refinement:* Let's focus on the "Division of Linguistic Labor." I use "elm" but can't distinguish it from a beech. Experts fix the meaning.
