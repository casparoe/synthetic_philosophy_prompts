      *Actually, a better fit:* The Inside View constructs a causal model specific to the case. The Outside View looks at the residual distribution of similar cases.
      *Let's settle on:* Inside View = Unit-specific parameters estimated without hierarchical constraint (No Pooling). Outside View = The Hyperparameters governing the distribution of those unit-specific parameters.
      *Planning Fallacy:* This is specifically about time/cost. It's a bias in the location parameter of the predictive distribution.
