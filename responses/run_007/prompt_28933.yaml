      *   *The "Model" Itself:* The Inside/Outside debate often implies the Inside View *lacks* a statistical model (it's a narrative). The Bayesian assumes a model exists. Translating "narrative" to "likelihood" is a stretch.
      *   *Exchangeability:* The Outside View *requires* exchangeability. The Inside View often explicitly *rejects* exchangeability ("I am special"). In BHM, if you reject exchangeability, you don't pool. So the Inside View is effectively a no-pooling model.
      *   *Objective vs. Subjective:* The Outside View is often presented as "objective data." In BHM, hyperpriors can be subjective too. The distinction is more about *source of information* (aggregate vs. specific).
      *   *Epistemic Modesty:* Is it a norm or a calculation? In BHM, it's a calculation (shrinkage factor). In psychology, it's a cognitive discipline.

