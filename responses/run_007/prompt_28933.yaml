      *   *Reference Class:* Choice of exchangeability group.
      *   *Planning Fallacy:* Systematic bias in the subjective prior mean or underestimated variance in the likelihood.
      *   *Epistemic Modesty:* Accepting the shrinkage estimator rather than the no-pooling estimator.

  6.  **Develop the Residue Report:**

      *   *Clean Translation:* Shrinkage = Modesty. Reference Class = Exchangeability Group.
      *   *Distorted:* Narrative vs. Likelihood. The psychological *urge* to ignore base rates isn't captured by the math.
      *   *Missing:* The *process* of selecting the reference class is political/psychological, not just statistical. The "Outside View" often implies a specific *type* of data (outcome frequencies) vs. causal mechanisms. BHM handles both.
