          *   **Planning Fallacy:** A biased Prior mean ($\mu_{subjective} > \mu_{true}$) or a Likelihood that underestimates variance (overconfidence).
          *   **Epistemic Modesty:** Shrinkage. The weight given to the hyperparameters relative to the case-specific data.

