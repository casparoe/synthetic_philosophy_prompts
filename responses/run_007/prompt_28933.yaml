      *Crucial nuance:* The Reference Class Problem is the hardest part. In BHM, exchangeability is an assumption. In I/OV, choosing the class is the hard part. I need to highlight that BHM assumes you *know* the hierarchy, whereas I/OV says *finding* the hierarchy is the cognitive work.

