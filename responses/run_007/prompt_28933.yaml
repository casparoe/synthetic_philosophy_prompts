      *   **Outside View:** Focusing on the statistics of a reference class of similar cases, ignoring specific details. *Bayesian analog:* The population-level distribution (hyperprior) or the mean of the random effects.
      *   **Reference Class Problem:** Choosing which group defines "similar." *Bayesian analog:* Defining the exchangeability group (the level of the hierarchy).
      *   **Planning Fallacy:** Underestimating time/cost/overestimating success. *Bayesian analog:* Systematic bias in the likelihood or prior mean (miscalibration).
      *   **Epistemic Modesty:** Deferring to the base rate. *Bayesian analog:* Shrinkage. Allowing the hierarchical structure to pull the individual estimate toward the group mean.

  3.  **Map the Concepts (Drafting the Mapping):**

      *   *Hierarchy Level:* The Outside View corresponds to the higher levels of the hierarchy (population/hyperparameters). The Inside View corresponds to the lower levels (unit-specific parameters).
      *   *Prior vs. Likelihood:* This is tricky. The Inside View isn't just a likelihood; it's often a *model* that generates a prediction. If I model my startup success based on my specific features (X), that's a likelihood $P(Data|X, \theta)$. But the *prediction* comes from the posterior of $\theta$. The Outside View says "Look at the distribution of $\theta$ across all startups."
      *   *Better Mapping:*
          *   **Outside View:** The Hyperprior $p(\theta | \phi)$ or the marginal distribution of the outcome derived from the reference class. It represents the structural constraints of the environment.
          *   **Inside View:** The Likelihood $p(y | \theta, x_{specific})$ combined with a subjective Prior $p(\theta)$ that is *conditional only on the specific case* without hierarchical pooling. It treats the case as fixed and unique, not drawn from a distribution.
