  10. **Final Polish:** Ensure the distinction between *Objective* Consequentialism (actual outcomes) and *Subjective* Consequentialism (expected outcomes) is clear, as this is the primary lever philosophers use to solve the trilemma. Ensure the "Complex Cluelessness" challenge to Subjective Consequentialism (where expectations can't be formed) is highlighted.

  *(Self-Correction on the Trilemma)*: The user's trilemma is: (i) determinate action-guidance, (ii) purely outcome-based criterion, (iii) no unargued empirical claim that long-run effects wash out.
  Actually, the tension is sharper. If (ii) means *actual* outcomes, then (i) is impossible under (iii). If (ii) means *expected* outcomes, (i) is possible, but (iii) becomes hard because forming expectations in complex cluelessness *is* an empirical claim. I need to be precise here.

