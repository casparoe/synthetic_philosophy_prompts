      *   Let's refine this.
      *   If (ii) is true, rightness = actual outcomes.
      *   If (i) is true, we must know rightness *ex ante*.
      *   If (iii) is true, we can't assume long-term effects cancel out.
      *   *Conflict:* If rightness is actual outcomes (ii), and we can't predict them (iii), we can't have guidance (i) unless we use expected value. But EV requires probabilities. In complex cluelessness, we lack probabilities. So either we fake probabilities (violating iii), we give up guidance (violating i), or we say rightness is based on *expected* outcomes (modifying ii).
      *   *Crucial Distinction:* Subjective vs. Objective Consequentialism. This is the pivot point.

  5.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Requirement 1: Consequentialist Integrity.* The theory must ground normative force in the good. (Settled: Otherwise it's not consequentialism).
      *   *Requirement 2: Epistemic Feasibility.* The theory cannot demand knowledge agents structurally cannot have. (Settled: "Ought implies can" applied to knowledge).
      *   *Requirement 3: Extensional Adequacy.* It must yield the intuitively correct verdict in high-confidence cases (Charity > Burning). (Contested: How much weight do intuitions carry? But generally accepted as a constraint).
      *   *Requirement 4: Decision-Theoretic Rigor.* It must specify how to handle risk (simple) and uncertainty (complex). (Contested: Which decision rule?).
      *   *Requirement 5: The Guidance/Evaluation Distinction.* Must clarify if it's telling you what *is* right or how to *find* it. (Contested: Objective vs. Subjective).

  6.  **Addressing Specific User Questions:**
      *   *Simple vs. Complex:* Simple allows Expected Value (EV). Complex breaks EV. A single theory needs a unified account of probability or a switch mechanism.
      *   *Recovering Confidence:* How to say Charity > Burning without assuming wash-out? Answer: Short-term dominance. The near-term good is so massive it swamps plausible long-term variance *unless* one assumes long-term effects are infinitely weighty. This relies on discounting or bounded utility.
      *   *Criterion vs. Procedure:* Does it help? Yes, it dissolves the "wrong action, right procedure" paradox. But it risks making the "Criterion" useless.
      *   *The Trilemma:* I need to formalize this. It looks like: (1) Objective Rightness (Actual Outcomes), (2) Ex Ante Guidance, (3) Radical Ignorance. You can't have all three. You must drop one.
          *   Drop 1 -> Subjective Consequentialism (Rightness = Expected Outcomes).
          *   Drop 2 -> Skeptical Consequentialism (No Guidance).
          *   Drop 3 -> Empirical Optimism (We can know/assume wash-out).

  7.  **Scoring the Candidates:**
      *   *Naive Maximizing:* Fails Epistemic Feasibility.
