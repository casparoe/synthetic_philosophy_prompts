answer: |-
  Here is the specification you requested. I have structured this as a technical brief on the constraints facing any viable consequentialist decision theory under conditions of radical uncertainty.

  I have flagged criteria as **[Settled]** (broad consensus among specialists) or **[Contested]** (significant philosophical disagreement). Note that "consensus" here means consensus among those working specifically on the structural logic of consequentialism, not the broader ethical community.

  ---

  ### Part 1: The Desiderata (The Spec)

  To count as an adequate response to cluelessness, a theory must satisfy the following requirements. I have divided them into *Structural Constraints* (defining the theory type) and *Functional Constraints* (what the theory must achieve).

  #### A. Structural Constraints

  **1. Consequentialist Integrity [Settled]**
  *   **Requirement:** The ultimate normative weight must rest on the value of states of affairs (outcomes), not on intrinsic features of acts, rules, or agent character.
  *   **Motivation:** If the theory grounds rightness in adherence to a rule *regardless* of that rule's outcome in a specific case, it has ceased to be consequentialism and become deontology.
  *   **Note:** This allows for *indirect* consequentialism (rules are heuristics for outcomes), but not *rule-worship* (rules bind even when outcomes are clearly worse).

  **2. Epistemic Feasibility [Settled]**
  *   **Requirement:** The theory cannot require an agent to possess information that is structurally unavailable (e.g., the infinite causal future).
  *   **Motivation:** "Ought implies can" applies to epistemic access. A theory that demands omniscience to determine duty is practically vacuous.
  *   **Constraint:** This rules out "Objective Consequentialism" (rightness = actual best outcome) as a *decision guide*, though it may remain a *criterion of evaluation*.

  **3. Decision-Theoretic Completeness [Contested]**
  *   **Requirement:** The theory must specify a decision rule for both **Simple Cluelessness** (known outcomes, known probabilities) and **Complex Cluelessness** (unknown outcome space, unassignable probabilities).
  *   **Motivation:** A theory that works only under risk (Simple) but goes silent under uncertainty (Complex) fails to guide action in the precise cases where cluelessness is most threatening.
  *   **Tension:** Standard Expected Utility Theory (EUT) satisfies Simple but fails Complex. Extending EUT to Complex cases requires principles (e.g., Principle of Indifference) that many decision theorists reject as arbitrary.

  #### B. Functional Constraints

  **4. Extensional Adequacy [Contested]**
  *   **Requirement:** The theory must recover standard confident verdicts (e.g., "Donate to effective charity" > "Burn the money") without relying on ad-hoc exceptions.
  *   **Motivation:** If a theory implies we have no reason to prefer charity to arson because both have unknown long-term tails, it suffers from *reductio ad absurdum*.
  *   **Constraint:** The theory must explain why near-term, high-probability goods are not swamped by low-probability, high-magnitude long-term effects (the "Pascal's Mugging" problem).

  **5. Non-Circular Empirical Assumptions [Settled]**
  *   **Requirement:** The theory cannot solve the epistemic gap by simply *asserting* that long-term effects cancel out or are negligible, unless it provides a mechanism for why this is so.
  *   **Motivation:** Claiming "long-run effects wash out" is an empirical claim about the causal structure of the universe. Using it to save the theory begs the question against the skeptic who argues the causal structure is chaotic or lexicographically dominated by far-future effects.

  **6. Action-Guidance vs. Evaluation Clarity [Contested]**
  *   **Requirement:** The theory must explicitly state whether it is providing a **Criterion of Rightness** (what makes an act right) or a **Decision Procedure** (how to choose).
  *   **Motivation:** Conflating these leads to the "Self-Defeat" objection (if maximizing is the criterion, trying to maximize might fail to maximize).
  *   **Tension:** If the theory admits the Criterion is unknowable (due to cluelessness) and offers only a Procedure, it risks making the Criterion normatively inert.

  ---

  ### Part 2: The Trilemma Analysis

  You suspected a trilemma between: (i) Determinate Guidance, (ii) Purely Outcome-Based Criterion, and (iii) No Unargued Empirical Wash-Out Claims.

  Here is the precise formulation of the inconsistency. Let us define the terms strictly:

  1.  **Objective Criterion:** An act is right iff it produces the *actual* best outcome (maximizes utility).
  2.  **Ex Ante Guidance:** An agent can know, prior to acting, which act is right.
  3.  **Epistemic Humility:** We cannot know the long-term causal ramifications of acts, nor can we assume they cancel out without evidence.

  **The Inconsistency Proof:**
  *   If **Objective Criterion** holds, rightness is determined by the actual future.
  *   If **Epistemic Humility** holds, the actual future (specifically the long-tail) is inaccessible and not assumed to cancel.
  *   Therefore, the determinants of rightness are inaccessible.
  *   Therefore, **Ex Ante Guidance** is impossible.

  **Conclusion:** You cannot hold all three. Any adequate response must explicitly reject one.

  *   **Option A (Reject Objective Criterion):** Move to **Subjective Consequentialism**. Rightness is determined by *expected* value (relative to evidence).
      *   *Cost:* You must solve Complex Cluelessness (how to form expectations without probabilities).
  *   **Option B (Reject Ex Ante Guidance):** Accept **Skeptical Consequentialism**. We can evaluate acts after the fact, but cannot know what to do now.
      *   *Cost:* The theory loses its practical function as a normative guide.
  *   **Option C (Reject Epistemic Humility):** Assert **Empirical Optimism**. Claim we *can* know, or that long-term effects *do* wash out.
      *   *Cost:* Requires a robust empirical defense of causal stability or discounting, which is philosophically contentious.

  **Verdict on your suspicion:** Your trilemma is valid. Most professional work attempts Option A (Subjective Consequentialism) but struggles with the "Complex" variant where expectations cannot be formed.

  ---

  ### Part 3: Simple vs. Complex Cluelessness

  Does this distinction force different requirements? **Yes.**

  *   **Simple Cluelessness:** We face a known probability distribution with a long tail.
      *   *Requirement:* The theory needs a handling of **infinite expected value** or **heavy-tailed distributions**. If the far future has non-zero probability of containing infinite value, standard maximization breaks (Pascal's Wager dynamics).
      *   *Solution Space:* Discounting, bounded utility functions, or probability truncation.
  *   **Complex Cluelessness:** We face unknown states of the world. We cannot list the outcomes, let alone assign probabilities.
      *   *Requirement:* The theory needs a decision rule for **ignorance**, not just risk.
      *   *Solution Space:* Maximin, Minimax Regret, or Imprecise Probabilities.
      *   *Conflict:* Standard Consequentialism relies on Expected Utility (EU). EU is undefined under Complex Cluelessness.
      *   *Can a single theory meet both?* Only if it adopts a **hybrid decision rule** (e.g., "Maximize EU where probabilities are known; use Robust Satisficing where they are not"). However, this risks violating **Consequentialist Integrity** if the switch isn't itself justified by consequences.

  **Recovering Confidence (Charity > Burning):**
  To satisfy *Extensional Adequacy* without assuming wash-out:
  The theory must rely on **Causal Dominance** in the short term.
  *   *Argument:* In the immediate timeframe (t=0 to t=5 years), the causal chain is tight. Charity saves lives; burning destroys resources. The magnitude of this near-term good is so high that, *unless* one assigns lexicographic priority to the far future, it swamps plausible variance in the long tail.
  *   *Requirement:* The theory must explicitly incorporate **temporal discounting** or **probability decay** as a normative or epistemic necessity. If you treat a 1% chance of affecting the year 3000 as equal to a 99% chance of affecting the year 2025, you lose Extensional Adequacy.

  ---

  ### Part 4: Criterion of Rightness vs. Decision Procedure

  Does this split help? **It helps diagnostically, but not solvably.**

  *   **The Move:** "The *Right Act* is the one with the best consequences (Objective). The *Rational Choice* is the one with the best expected consequences (Subjective)."
  *   **Benefit:** It resolves the guilt of being wrong. You can choose rationally but act wrongly.
  *   **Limitation:** It does not solve Complex Cluelessness. If you cannot form expectations (Complex), you cannot identify the *Rational Choice* either.
  *   **The Dodge:** Saying "Adopt the rule with the best consequences" (Rule Consequentialism) is only a solution if you can identify that rule. If cluelessness applies to acts, it applies equally to rules (we don't know the long-term consequences of adopting a rule).
  *   **Verdict:** The distinction is **[Settled]** as necessary for clarity, but it is not a *solution* to the epistemic gap. It merely relocates the gap from "Which act?" to "Which heuristic?"

  ---

  ### Part 5: Scoring the Candidates

  Here is how the standard responses score against the Desiderata.

  #### 1. Naive Maximizing Consequentialism (Objective)
  *   *Claim:* Do the act that actually produces the most good.
  *   *Consequentialist Integrity:* **Pass.**
  *   *Epistemic Feasibility:* **Fail.** (Violates Trilemma horn 2).
  *   *Action Guidance:* **Fail.** (Requires omniscience).
  *   *Verdict:* Viable as an evaluative standard only. Useless as a decision theory.

  #### 2. The Washing-Out / Expected Value Line (Subjective)
  *   *Claim:* Maximize Expected Value; assume long-term noise cancels out.
  *   *Consequentialist Integrity:* **Pass.**
  *   *Epistemic Feasibility:* **Partial Pass.** (Works for Simple Cluelessness).
  *   *Decision-Theoretic Completeness:* **Fail.** (Collapses under Complex Cluelessness; cannot assign probabilities).
  *   *Non-Circular Empirical Assumptions:* **Fail.** (Relies on the unproven claim that variance cancels or is discountable).
  *   *Verdict:* The standard working view, but technically vulnerable to the "Complex" objection.

  #### 3. Indirect / Sophisticated Consequentialism
  *   *Claim:* Maximize good by following rules/heuristics that generally maximize good.
  *   *Consequentialist Integrity:* **Pass** (in theory), **Risk** (in practice if rules become rigid).
  *   *Epistemic Feasibility:* **Pass.** (Rules are easier to track than acts).
  *   *Extensional Adequacy:* **Pass.** (Recovers common sense).
  *   *Decision-Theoretic Completeness:* **Fail.** (Cluelessness applies to rule-selection too. How do we know which rules have the best long-term consequences?).
  *   *Verdict:* Kicks the can down the road. Solves computational limits, not epistemic limits.

  #### 4. Satisficing or Robust-Choice Views
  *   *Claim:* Choose an option that is "good enough" or robust across many probability models.
  *   *Consequentialist Integrity:* **Risk.** (Why stop at "good enough" if you can do better? Requires justification).
  *   *Epistemic Feasibility:* **Pass.** (Lower epistemic burden).
  *   *Decision-Theoretic Completeness:* **Pass.** (Designed for uncertainty).
  *   *Extensional Adequacy:* **Risk.** (May forbid high-stakes high-reward moves that intuition demands).
  *   *Verdict:* The strongest candidate for handling Complex Cluelessness, but requires modifying the "Maximize" core of consequentialism.

  ---

  ### Summary of the "Spec" for an Adequate Response

  If you are evaluating a new paper or theory, check it against this checklist:

  1.  **Does it admit the Trilemma?** It must explicitly state which of the three horns (Objective Rightness, Guidance, Humility) it is dropping.
  2.  **Does it distinguish Risk vs. Uncertainty?** If it uses Expected Value, it must explain how probabilities are generated in Complex Cluelessness cases.
  3.  **Does it justify Discounting?** To recover confident cases (Charity > Burning), it must argue for probability decay or temporal discounting without simply asserting it.
  4.  **Is the Criterion/Procedure split explicit?** It must not claim to guide action using a criterion that is ex hypothesi unknowable.

  **Final Professional Assessment:**
  There is no consensus solution. The field is currently stuck on the **Complex Cluelessness** horn. The "Washing-Out" view is the pragmatic default, but it is recognized as empirically fragile. The most rigorous current work is moving toward **Imprecise Probabilities** or **Robust Satisficing**, effectively modifying the "Maximize" requirement to preserve "Guidance" and "Humility." This suggests the Trilemma is real, and the cost of solving it is weakening the demand for strict maximization.
