          *   Flag settled vs. contested criteria.
          *   No bibliography.
      *   **Tone:** Rigorous, analytical, precise, avoiding survey-style fluff. Focus on the *specification* of the problem space.

  2.  **Deconstruct "Consequentialist Cluelessness":**
      *   *The Problem:* Consequentialism says rightness depends on outcomes. Long-term outcomes are epistemically inaccessible. Therefore, we don't know what's right.
      *   *Simple Cluelessness:* We know the possible outcomes and can assign probabilities (risk), but the tail is long.
      *   *Complex Cluelessness:* We don't even know the *structure* of the outcome space or how to assign probabilities (uncertainty/ignorance).
      *   *The Threat:* If we can't know outcomes, consequentialism becomes action-guiding vacuum or collapses into something else.

  3.  **Brainstorming Desiderata (The "Spec"):**
      *   *D1: Action Guidance.* A moral theory should help agents choose. (Contested: Some say it just evaluates).
      *   *D2: Consequentialist Fidelity.* It must remain grounded in outcomes, not deontology or virtue. (Non-negotiable for the label).
      *   *D3: Epistemic Honesty.* It can't assume we know what we don't. (Non-negotiable).
      *   *D4: Discriminatory Power.* It must distinguish between obvious cases (charity > burning). (Non-negotiable for plausibility).
      *   *D5: Handling Uncertainty.* It needs a decision rule for unknown probabilities. (Contested: Maximize EV vs. Maximin vs. Insufficient Reason).
      *   *D6: Stability/Non-Self-Defeat.* The theory shouldn't recommend abandoning itself immediately.

  4.  **Developing the Trilemma Hypothesis:**
