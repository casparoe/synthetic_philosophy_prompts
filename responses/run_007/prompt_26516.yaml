prompt: |-
  ok so we're doing political philosophy in class and my teacher gave us this bit from Locke's Second Treatise (the 1690 one), section 119, and i just cannot get my head round what he's actually saying here. the passage is:

  "every man, that hath any possessions, or enjoyment, of any part of the dominions of any government, doth thereby give his tacit consent, and is as far forth obliged to obedience to the laws of that government, during such enjoyment, as any one under it; whether this his possession be of land, to him and his heirs for ever, or a lodging only for a week; or whether it be barely travelling freely on the highway; and in effect, it reaches as far as the very being of any one within the territories of that government."

  so my question is: is Locke saying that just *being* somewhere counts as consenting to the government there? because that seems mad — like, if i'm just passing through a country on a coach i've somehow agreed to obey all its laws? and if so what even is the difference between tacit consent and just... being forced? like if you can't leave (maybe you're poor, or there's a border closed, or you're a kid), does he still think you've consented?

  i want you to actually take a side on this — don't just give me "some people think X, others think Y." tell me whether Locke's idea of tacit consent here is actually defensible or whether it collapses into something that isn't consent at all, and why. keep it to 400 words max.
