answer: |-
  **BOARD PAPER: RECOMMENDATION ON THE STATUS AND FUTURE OF THE *PERSEVERANCE***

  **TO:** The Board of Trustees, Devon Maritime Museum
  **FROM:** [Your Name/Committee Chair]
  **DATE:** [Date]
  **SUBJECT:** Strategic Response to Heritage Lottery Fund Query & Long-Term Interpretation of the *Perseverance*

  ### 1. Executive Summary

  This paper addresses the critical question raised by the Heritage Lottery Fund (HLF) regarding our upcoming £200,000 funding application: *Are we preserving a historic ship or maintaining a replica?* This query reflects a long-standing internal division within the Board regarding the identity of the *Perseverance*.

  This recommendation proposes a unified position that validates both the material reality of the vessel (less than 3% original timber) and its historical continuity (unbroken lineage of care since the 1820s). It recommends proceeding with the HLF application under the classification of a **"Continuously Maintained Historic Vessel"** and adopting a policy of "Radical Transparency" in public interpretation. This approach satisfies the founding charter, secures funding viability, and maintains public trust.

  ### 2. Context and The Core Dilemma

  The *Perseverance* has been in our care since 1923. Through five major restorations, virtually all original fabric has been replaced. We face a philosophical and practical divergence:

  *   **Position A (Continuity of Identity):** Argues that the *Perseverance* remains the historic ship. The identity of a vessel lies in its name, design, and continuous lineage of care, analogous to a living organism replacing cells. The Charter to "preserve the *Perseverance*" remains valid.
  *   **Position B (Material Integrity):** Argues that with less than 3% original timber, the vessel is functionally a replica. Continued claims of historic status risk misleading the public and donors. The Charter may no longer apply to the physical object currently in the dry dock.

  Both positions are intellectually robust. Position A protects the cultural value and emotional resonance of the exhibit. Position B protects the museum's reputation for accuracy and integrity. To move forward, we must not choose one over the other, but synthesize them.

  ### 3. Analysis of Board Positions

  **In support of Position A (Continuity):**
  In maritime tradition, a ship's identity is not solely defined by its timber. Vessels are routinely rebuilt over centuries while retaining their registered identity. The *Perseverance* holds a "National Historic Ship" status (if applicable, or eligible) based on its provenance, not just its cellulose. The skill, techniques, and decisions made during the 1950s, 1980s, and 2017 restorations are themselves now part of the ship's history. To declare it a replica would sever the emotional and historical link to the 1923 acquisition and negate the value of the conservation work already undertaken.

  **In support of Position B (Materiality):**
  Transparency is the currency of museums. If a visitor believes they are standing on 1820s decking when they are standing on 2017 oak, we are failing our educational mission. The Heritage Lottery Fund's query highlights a risk: if we claim "preservation of historic fabric" when little exists, we risk reputational damage if the 3% figure becomes public knowledge without context. Furthermore, if the object is a replica, our Charter's legal standing regarding "preservation" could be challenged by stakeholders.

  ### 4. Proposed Path Forward: The "Living History" Synthesis

  We recommend defining the *Perseverance* not as a binary "Original vs. Replica," but as a **Document of Maritime Conservation.**

  The *Perseverance* is a hybrid object. It is an 1820s design, launched in the 19th century, whose physical form documents 100 years of British maritime conservation practice. The value lies in *both* the original conception and the century of care that kept her afloat (metaphorically or literally).

  #### 4.1 Recommendation on Funding Application (HLF)
  We should proceed with the application, but we must answer the HLF's question with nuance rather than a binary choice.

  *   **Classification:** We should classify the project as **"Preservation of a Historic Vessel through Continual Renewal."**
  *   **Narrative:** The application should explicitly state the 3% figure. We argue that the *significance* of the *Perseverance* lies in its continuous existence as a public asset since 1923. The funding is not to "freeze" the ship in time (which is impossible for wood), but to continue the unbroken chain of stewardship.
  *   **Justification:** We align with standards used by the National Historic Ships UK committee, which recognizes that for wooden vessels, "preservation" often necessitates "replacement" to maintain structural integrity. We are preserving the *entity*, not just the *matter*.

  #### 4.2 Recommendation on Public Interpretation
  To satisfy Position B's concern for honesty, we must adopt a policy of **Radical Transparency.**

  *   **Signage & Guides:** We stop using unqualified phrases like "Walk on the original deck." Instead, we use: *"This deck was renewed in 2017, continuing a tradition of repair dating back to 1923."*
  *   **The 3% Feature:** We turn the scarcity of original wood into a key exhibit. We should mark the locations of the remaining original timbers (perhaps with discreet plaques or a digital overlay). This highlights the rarity of the original material rather than hiding the replacement.
  *   **The Story of Repair:** We interpret the restoration history as part of the ship's biography. The 1950s repairs tell a story about post-war conservation; the 2017 repairs tell a story about modern heritage funding. The ship becomes a timeline of how we have valued our past over the last century.

  #### 4.3 Recommendation on the Founding Charter
  Regarding the concern that the Charter no longer applies:

  *   **Interpretation:** We recommend the Board adopt a formal resolution interpreting the phrase "Preserve the *Perseverance*" to mean "Preserve the identity, design, and public accessibility of the vessel known as the *Perseverance*," rather than "Preserve the original atomic matter of the vessel."
  *   **Rationale:** This aligns with the intent of the founders (to keep the ship for the public) without being constrained by the physical degradation of organic material. This ensures the Charter remains the guiding legal instrument for the next 100 years.

  ### 5. Implementation Plan

  1.  **Board Resolution:** At next month's meeting, move to adopt the "Continuously Maintained Historic Vessel" definition as official museum policy.
  2.  **HLF Application:** Draft the funding narrative to explicitly acknowledge the replacement history, framing it as a testament to the ship's enduring value rather than a deficit.
  3.  **Interpretation Audit:** Commission a review of all current signage and marketing materials to ensure they reflect the "Radical Transparency" policy before the next funding cycle begins.
  4.  **External Validation:** Seek an advisory opinion from National Historic Ships UK to bolster our definition in the eyes of the HLF.

  ### 6. Conclusion

  This recommendation does not ask either side of the Board to surrender their principles.
  *   To **Position A**, it affirms that the *Perseverance* is indeed the historic ship, provided we understand "ship" as a continuous identity.
  *   To **Position B**, it affirms that we must be honest about the material composition and that the story of the replacements is as important as the original build.

  By embracing the complexity of the *Perseverance*, we transform a liability (the lack of original wood) into a unique asset (a living case study of conservation). This allows us to secure the £200,000, honor our Charter, and tell a richer, more honest story to the public.

  **Recommended Motion:**
  *That the Board approves the submission of the HLF application under the classification of 'Continuously Maintained Historic Vessel' and adopts the policy of 'Radical Transparency' regarding the vessel's material history in all public-facing communications.*
