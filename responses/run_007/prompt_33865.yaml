prompt: |-
  I'm on the board of a small maritime museum down in Devon. Our main exhibit is the Perseverance, a whaling ship from the 1820s that's been sitting in our dry dock since 1923. The museum's founding charter says our purpose is 'to preserve the Perseverance for the public benefit.' Here's the thing: over the last hundred years we've replaced virtualy every piece of timber in her, bit by bit, across five major restorations and countless smaller repairs. The last survey says less than 3% of the current wood dates from her working life. The most recent restoration was in 2017, when we replaced the last of the original deck planking. Now the hull needs another £200,000 of work, and the Heritage Lottery Fund has told us they'll consider an application, but they want us to clarify whether we're asking them to fund the preservation of a historic ship or the maintenance of a replica. Our board is split right down the middle. Half says obviously it's the same ship — we've been looking after her continuously, the repairs were done gradually and with care, you wouldn't say a person stops being themselves because their cells get replaced. The other half says come off it, it's a replica that's been assembled over decades, and the charter probaly doesn't even apply anymore. I need to draft a recommendation for our board meeting next month. It should say what we should do about the funding application and how we should describe the ship to the public going forward, and it should take both sides seriously — I don't want a document that just picks a side and dismisses the other lot.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation:

  1.  **Analyze the Request:**
      *   **Context:** Board member of a small maritime museum in Devon.
      *   **Subject:** The *Perseverance*, a whaling ship from the 1820s, in dry dock since 1923.
      *   **Problem:** Less than 3% of original timber remains. Needs £200k for hull work. Heritage Lottery Fund (HLF) asks: Is this preservation of a historic ship or maintenance of a replica?
      *   **Conflict:** Board is split 50/50.
          *   Side A (Continuity): It's the same ship (Ship of Theseus argument), continuous care, charter applies.
          *   Side B (Materiality): It's effectively a replica, charter might not apply, misleading to call it historic.
      *   **Task:** Draft a recommendation for the board meeting.
      *   **Requirements:** Address funding application strategy, address public description/interpretation, take both sides seriously (balanced, not dismissive).

  2.  **Deconstruct the Philosophical & Practical Issues:**
      *   *The Ship of Theseus:* This is the classic philosophical puzzle. If all parts are replaced, is it the same object?
      *   *Heritage Sector Standards:* How do bodies like HLF, National Historic Ships UK, etc., view this? Usually, "designated" status relies on significance, which can be historical, architectural, *or* associative. Continuity of care matters.
      *   *The Charter:* "Preserve the Perseverance for the public benefit." Does "Perseverance" refer to the physical matter or the entity/identity?
      *   *Funding:* HLF needs clarity. Ambiguity risks rejection.
      *   *Public Trust:* Honesty is crucial. Claiming it's "1820s wood" when it's not is deceptive. Claiming it's a "replica" might diminish its cultural value and donor appeal.

  3.  **Determine the Strategy for the Recommendation:**
      *   *Goal:* Bridge the divide. Find a "Third Way" that satisfies the HLF, honors the charter, respects the material reality, and keeps the ship viable.
      *   *Tone:* Professional, diplomatic, nuanced, decisive but inclusive.
      *   *Structure:*
          1.  Executive Summary.
          2.  Context & The Challenge (acknowledging the split).
          3.  Analysis of Position A (Continuity/Identity).
          4.  Analysis of Position B (Materiality/Replica).
          5.  Proposed Path Forward (The Synthesis).
          6.  Specific Recommendations (Funding & Interpretation).
          7.  Conclusion.

  4.  **Drafting - Section by Section:**

      *   *Title:* Needs to be formal. "Recommendation regarding the Status and Future of HMS Perseverance."
      *   *Introduction:* State the purpose. Acknowledge the HLF query.
      *   *The Core Debate:* Explicitly name the "Ship of Theseus" dynamic without getting too academic. Validate both sides.
          *   *Side A:* Focus on *provenance* and *continuous lineage*. The "soul" of the ship.
          *   *Side B:* Focus on *material integrity* and *transparency*. The "body" of the ship.
      *   *The Synthesis (The "Both/And" approach):* This is key. We can't just say "It's old" or "It's new." We need to define it as a *living historic vessel* where the *process* of preservation is part of the history.
      *   *Funding Strategy:* Don't lie to HLF. Frame it as "Preservation of a Historic Vessel through Continual Renewal." This aligns with maritime tradition (ships are maintained to sail/exist).
      *   *Public Interpretation:* Radical transparency. Tell the story of the replacements. Make the 3% original wood a feature, not a bug. Make the 97% replacement a testament to 100 years of care.
      *   *Charter:* Reinterpret "Preserve the Perseverance." It means preserving the *identity and story*, not just the cellulose.

  5.  **Refining the Tone:**
      *   Avoid saying "Side A is right" or "Side B is wrong."
      *   Use phrases like "Compelling argument," "Valid concern," "Equally important perspective."
      *   Ensure the recommendation is actionable.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too wishy-washy?
      *   *Fix:* Make sure the final recommendation is clear. We *are* applying for the funds, but under a specific narrative. We *are* calling it historic, but with specific caveats in the interpretation.
      *   *Critique:* Did I address the charter?
      *   *Fix:* Add a specific section on Charter Compliance.
      *   *Critique:* Is the HLF requirement met?
      *   *Fix:* Explicitly state how to answer their question in the application.

  7.  **Final Polish:** Check for maritime terminology (dry dock, planking, hull), Devon context (maybe mention local heritage), and boardroom language (motions, resolutions). *Self-correction: Keep it general enough for any Devon museum, don't invent specific location names.*

  8.  **Final Output Generation:** (This matches the provided good response.)
      *   Structure: Memo format.
      *   Content: Balanced analysis + Clear decision.
      *   Key Concept: "Continuously Maintained Historic Vessel."

  9.  *(Post-Drafting Thought)*: I should ensure I mention National Historic Ships UK or similar bodies as a potential arbiter or standard, to add external weight to the recommendation. (Added to the "External Validation" point).

  10. **Final Review against constraints:** Does it take both sides seriously? Yes. Does it cover funding? Yes. Public description? Yes. Charter? Yes.

