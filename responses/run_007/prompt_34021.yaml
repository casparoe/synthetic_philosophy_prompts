      *   *Observation 3 (Precedent/Capability):* The "Reasonable" cases involve actors who have *already been caught* doing similar things or have the known capability to do so (CIA does covert ops, Corps hide data, Govt abuses marginalized groups). The "Unreasonable" cases require capabilities or coordination levels never before demonstrated.
      *   *Draft Principle:* **The Principle of Proportional Secrecy and Precedent.** A conspiracy is reasonable to suspect if: (1) The number of required conspirators is small enough to maintain silence, AND (2) The actors have a clear material incentive, AND (3) There is historical precedent for these actors doing similar things.

      *   *Refining the Principle:* Let's make it sharper for a novelist. It needs to be about *epistemic justification*.
      *   *Proposed Principle:* **The Incentive-Scale-Precedent Triad.**
