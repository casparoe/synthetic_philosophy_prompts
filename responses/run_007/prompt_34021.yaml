          2.  **Scale:** Can the secret be kept by the number of people required to execute it?
          3.  **Precedent:** Have these specific actors done this *kind* of thing before?

  4.  **Test the Principle against User's Verdicts:**
      *   *Moon Landing:* Fails Scale (too many people), Fails Incentive (cost of faking > cost of doing). -> Unreasonable. (Matches)
