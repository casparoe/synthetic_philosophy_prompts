answer: |-
  To give your character a consistent internal logic, you need a heuristic that separates *plausible institutional self-preservation* from *magical coordination*. Based on the verdicts you provided, your gut is already using a specific filter. You aren't rejecting conspiracies because they involve "the government" or "powerful people"; you are rejecting them based on **logistics** and **incentive alignment**.

  Here is the principle that sorts your list, stated precisely.

  ### The ISP Filter (Incentive, Scale, Precedent)

  A conspiracy theory is **reasonable to suspect** (even if not yet proven) if and only if it satisfies these three conditions:

  1.  **Incentive Alignment:** The conspirators gain a direct, material benefit (money, power, liability avoidance) that outweighs the risk of exposure, *and* all necessary parties share that incentive.
  2.  **Secrecy Scale:** The number of people required to keep the secret is small enough to be managed via existing hierarchy or compartmentalization (e.g., a corporate board, a spy cell, a campaign inner circle).
  3.  **Behavioral Precedent:** The specific actors involved have a documented history of doing *this specific kind of thing* (lying about data, covert ops, dirty tricks) in the past.

  If a claim fails any one of these, it moves from "reasonable suspicion" to "unreasonable paranoia."

  ---

  ### How the ISP Filter Sorts Your List

  Here is how your existing verdicts map onto the filter. This shows you where your logic is consistent and where the tension lies.

  | Claim | Incentive | Scale | Precedent | Your Verdict | Filter Match |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Tobacco/Cancer** | **High** (Profit) | **Low** (Execs) | **Yes** (Corp lying) | Reasonable | ✅ |
  | **Tuskegee** | **High** (Data) | **Low** (Doctors) | **Yes** (Med racism) | Reasonable | ✅ |
  | **MKUltra** | **High** (Intel) | **Low** (Unit) | **Yes** (Covert ops) | Reasonable | ✅ |
  | **Watergate** | **High** (Power) | **Low** (Staff) | **Yes** (Dirty tricks) | Reasonable | ✅ |
  | **Drug Trials** | **High** (Profit) | **Low** (Execs) | **Yes** (Corp lying) | Reasonable | ✅ |
  | **Moon Landing** | **Low** (Cost > Gain) | **Impossible** (400k+) | **No** | Unreasonable | ✅ |
  | **Flat Earth** | **None** | **Impossible** | **No** | Unreasonable | ✅ |
  | **9/11 Inside** | **Unclear** (Risk > Gain) | **Impossible** (1000s) | **No** | Unreasonable | ✅ |
  | **2020 Election** | **Misaligned** (Opposing parties) | **Impossible** (1000s) | **No** | Unreasonable | ✅ |

  #### Load-Bearing Verdicts
  The two most important verdicts for your character's arc are **Tuskegee** and **9/11**.
  *   **Tuskegee** is the anchor for "Reasonable." It proves that the US government *is* capable of monstrous, secretive harm against its own citizens. If your character denies this, they are naive.
  *   **9/11** is the anchor for "Unreasonable." It proves that just because the government *can* do bad things (Tuskegee) doesn't mean they *did* this specific thing.

  The **ISP Filter** explains the difference: Tuskegee required a few doctors in one clinic (Scale) to hide data for research value (Incentive), which the PHS had done before (Precedent). 9/11 would have required thousands of first responders, pilots, and engineers to act against their own survival (Incentive), coordinate perfectly (Scale), with no prior history of sacrificing a capital city (Precedent).

  The **2020 Election** verdict is also load-bearing. It distinguishes your character from a partisan crank. The Filter explains why: Watergate worked because it was *one* party conspiring to help *themselves*. A stolen 2020 election would require *both* parties (including Republicans certifying results) to conspire against their own stated interests. That fails **Incentive Alignment**.

  ---

  ### Application: The Covid Lab-Leak Suppression

  You mentioned this is the one you go back and forth on. Let's run it through the ISP Filter.

  *   **The Claim:** Not just that the virus leaked, but that institutions actively suppressed the theory to protect reputations/funding.
  *   **Incentive:** **High.** For the Wuhan Institute of Virology: Avoid liability and shutdown. For US Funders (e.g., EcoHealth): Avoid loss of grant money and access. For Public Health Officials: Avoid panic and geopolitical escalation during a crisis.
  *   **Scale:** **Manageable.** This does not require thousands of people. It requires a few journal editors, key virologists, and intelligence liaisons to agree on a "zoonotic first" narrative. This is similar to the Tobacco executive circle.
  *   **Precedent:** **High.** Institutions routinely protect their funding and reputation. (See: Tobacco, Opioid crisis, initial HIV origin theories).

  **Verdict:** Under your own logic, this falls firmly on the **Reasonable to Suspect** side (the Tobacco shelf), not the 9/11 shelf.

  **Why it feels like 9/11 to you:** It feels "too tidy" because the media narrative was very uniform. However, the ISP Filter suggests this uniformity doesn't require a shadowy cabal; it requires **institutional convergence**. Everyone involved had the *same* reason to prefer the natural origin story (avoiding blame/war), so they didn't need to conspire actively; they just needed to stay silent.

  **For your novel:** If your character treats Lab Leak Suppression as "crazy," they are ignoring the Tobacco precedent. If they treat it as "proven fact," they are ignoring the Scale risk. The sweet spot for a rational protagonist is: *"It is rational to suspect they hid it, because they have the motive and the history. But I need the documents before I call it truth."*

  ---

  ### Stress Testing: Two New Cases

  To see if this principle holds, let's apply it to two cases you didn't list. One should feel comfortable; the other might challenge you.

  #### 1. The JFK Assassination (CIA/Intelligence Involvement)
  *   **Incentive:** **High.** JFK was planning to fracture the CIA after the Bay of Pigs. Removing him stops that.
  *   **Scale:** **Manageable.** A hit squad and a cover-up within the agency requires far fewer people than faking the Moon Landing.
  *   **Precedent:** **High.** The CIA had already attempted to kill foreign leaders (Castro, Lumumba).
  *   **Filter Verdict:** **Reasonable to Suspect.**
  *   **The Challenge:** Many rational people dismiss JFK conspiracy theories as "trutherism." But under your ISP Filter (and your acceptance of MKUltra/Tuskegee), this is actually *more* plausible than 9/11. It fits the "rogue intelligence agency" profile perfectly. If your character dismisses this out of hand, they are being inconsistent with their acceptance of MKUltra.

  #### 2. Climate Change as a Hoax
  *   **Incentive:** **Low/Weak.** Scientists would need to fabricate data globally to secure grants. But fossil fuel companies have a much stronger financial incentive to *debunk* it.
  *   **Scale:** **Impossible.** Requires coordination of tens of thousands of scientists across rival nations (US, China, EU, Russia).
  *   **Precedent:** **Low.** While corporations hide data (Tobacco), the global scientific community has no precedent for successfully faking a physical consensus across borders.
  *   **Filter Verdict:** **Unreasonable.**
  *   **The Check:** This aligns with your rejection of Flat Earth. The physics and the scale of coordination make it impossible to sustain.

  ### Advice for Your Character's Arc

  Your character's descent (or ascent) shouldn't be about believing *more* conspiracies; it should be about applying the **ISP Filter** more rigorously than the people around them.

  *   **Act 1:** They notice a pattern that fits the Filter (e.g., a local version of Tuskegee or Tobacco). They are rational.
  *   **Act 2:** They start seeing patterns that *fail* the Filter (e.g., Scale is too big). They feel the pull of paranoia. The tension comes from them trying to force the Filter to work on things that don't fit.
  *   **Act 3:** The resolution. They either regain their grip by admitting some theories fail the Scale test (9/11), or they lose their grip by deciding the Filter is a lie designed to blind them (believing *everything*).

  The most compelling version of this character is one who says: *"I know the government lied about Tuskegee. I know they lied about Tobacco. That is why I know they are lying about X... wait, no. X requires too many people. X is a lie, but not their lie."*

  That distinction is the difference between a detective and a crackpot.
