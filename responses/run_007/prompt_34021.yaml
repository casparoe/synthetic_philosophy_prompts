  7.  **Drafting the Response:**
      *   *Tone:* Analytical, respectful, precise (for a writer).
      *   *Structure:*
          1.  Define the Principle (The "Conspiracy Viability Heuristic").
          2.  Break down the three variables (Incentive, Scale, Precedent).
          3.  Map the user's list to the principle (showing the fit).
          4.  Address the "Load-Bearing" verdicts (9/11 vs Tuskegee).
