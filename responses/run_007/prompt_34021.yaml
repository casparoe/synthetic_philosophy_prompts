      *   *Precedent:* High. Scientists protect reputations (Tobacco, Thalidomide). Governments hide blunders (Bay of Pigs, initial HIV origins).
      *   *Verdict:* **Reasonable to suspect, unreasonable to assert as fact without evidence.** It sits in the "Tobacco" zone (institutional self-preservation) more than the "9/11" zone (magical coordination). The principle suggests suspicion is warranted, but certainty is not.

