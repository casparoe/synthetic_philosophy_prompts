      *   *Load-Bearing:* The distinction between 9/11 and Tuskegee is crucial. It hinges on *Scale* and *Precedent*. The distinction between 2020 Election and Watergate hinges on *Scale* and *Incentive* (bipartisan coordination required vs partisan).

