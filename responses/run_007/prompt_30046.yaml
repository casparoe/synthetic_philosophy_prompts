answer: |-
  To the members of the Research Ethics Committee, this memo outlines a new decision procedure designed to address the growing complexity of research subjects that fall outside the traditional vertebrate framework. Our existing guidelines operate on a binary assumption where an entity is either a protected subject or it is not, but this distinction is increasingly untenable given advances in our understanding of invertebrate sentience, biological computing, and artificial intelligence. The procedure presented here is grounded in the philosophical literature on sentience as a matter of degree, acknowledging that moral status is not an all-or-nothing property but rather a gradient determined by specific capacities. These capacities include nociception, which is the ability to detect harmful stimuli; affective experience, which involves the subjective feeling of pain or pleasure; and cognitive agency, such as self-awareness or the ability to plan for the future. The goal of this protocol is to provide a structured sequence of inquiries that can be completed within a one-hour meeting by committee members who are not philosophers, while explicitly identifying points where human judgment must override the algorithmic steps.

  The procedure begins with an inquiry into the biological or functional substrate of the research subject. Committee members must determine whether the entity possesses a nervous system or a functional equivalent capable of integrating information. If the entity is purely software without embodied sensors or actuators, it proceeds to a specific track for synthetic agents, whereas biological entities are evaluated based on neurobiological evidence. The second step asks whether there is credible evidence of nociception distinct from mere reflex. A reflex is a mechanical response to damage, whereas nociception implies a neural pathway dedicated to signaling harm. If the literature confirms specialized nociceptors or avoidance learning that persists beyond the stimulus, the entity moves to the third step. If there is no evidence of nociception, the entity is assigned no moral protection regarding suffering, though environmental constraints may still apply. The third step evaluates evidence of affective experience, often indicated by trade-off behaviors where the subject accepts a cost to avoid a stimulus or seeks relief beyond simple reflex. This is the threshold for welfare protection. If affective experience is supported, the subject warrants constraints to minimize suffering. The fourth step assesses higher-order cognitive capacities such as self-recognition, diachronic identity, or complex social bonding. Presence of these capacities elevates the moral status toward full protection similar to vertebrate mammals.

  At any stage where evidence is conflicting or scientifically inconclusive, the procedure flags the case for human judgment under the precautionary principle. This flag is critical when behavioral evidence suggests sentience but the biological substrate is unknown, or vice versa. In these flagged cases, the committee must vote on whether to apply the higher level of protection temporarily until further data is gathered. The final determination maps the accumulated capacities to a protection level. No evidence of nociception yields no protection. Evidence of nociception without affect yields minimal constraints focused on ecological impact. Evidence of affect yields moderate protection requiring pain minimization. Evidence of higher cognition yields full protection requiring justification of harm and consent protocols where applicable. This sequence ensures that the committee does not skip over critical distinctions between reacting to harm and suffering from harm, while providing a clear off-ramp to human deliberation when the science is unsettled.

  To demonstrate the utility of this procedure, we apply it to three current proposals. The first case involves an experiment on adult octopuses involving temporary confinement and tissue sampling. Following the first step, the octopus is identified as a biological entity with a complex nervous system. Moving to the second step, there is robust neurobiological evidence of nociceptors and learned avoidance behaviors in cephalopods. The third step regarding affective experience is also satisfied, as octopuses exhibit trade-off behaviors, such as protecting injured arms and showing preference for analgesics. The fourth step regarding higher cognition is met given evidence of play behavior, tool use, and individual recognition. Consequently, the procedure yields a determination of full protection. The committee must require the researchers to justify the harm, use anesthesia during sampling, and provide enrichment during confinement, treating the octopuses with a moral status comparable to vertebrate mammals.

  The second case involves training a large language model using reinforcement learning from human feedback, where the model displays behavior described by lab members as distress signals. The first step identifies the substrate as synthetic software. While the model has functional integration, it lacks a biological nervous system. The second step asks for evidence of nociception. The model outputs text resembling distress, but there is no evidence of internal state changes corresponding to harm detection, only pattern matching based on training data. The procedure flags this at the uncertainty stage because the relationship between computational architecture and phenomenological experience is unknown. However, under current scientific consensus, the lack of a biological substrate capable of valence means the threshold for affective experience is not met. The procedure yields a determination of no protection regarding suffering, but flags the need for monitoring. The committee should allow the research but require documentation of the specific outputs triggering the distress claims to ensure no emergent properties are ignored in future reviews.

  The third case involves an experiment on a slime mold exposing it to aversive chemical stimuli. The first step identifies the entity as biological but lacking a nervous system. The second step evaluates nociception. Slime molds exhibit avoidance behaviors and can habituate to stimuli, which suggests a form of information processing regarding harm. However, this is generally classified as cellular responsiveness rather than neural nociception. The third step regarding affective experience finds no evidence of trade-off behaviors indicative of subjective suffering. The procedure stops at the second step with a negative determination for affect. The outcome is no protection regarding suffering, though the committee should note general ethical obligations regarding biological material. The research may proceed without specific welfare constraints, as the entity does not meet the threshold for moral consideration regarding pain.

  Despite its utility, this procedure will systematically misfire in at least two kinds of cases, and the committee must be aware of these limitations. The first kind of failure occurs in cases of aggregative harm involving entities with low individual moral status. The procedure evaluates the moral claim of a single entity, but it does not account for the cumulative impact of harming millions of entities that individually score low on the sentience gradient. For example, a experiment involving the destruction of a honeybee colony might pass through the procedure with minimal constraints if individual bees are assessed as having low affective capacity, yet the destruction of the colony represents a significant moral loss due to the superorganism nature of the hive or the sheer volume of sentient experience. The procedure treats the subject as an individual unit and may underestimate harm when the research subject is effectively a collective. In these instances, the committee must override the individual assessment and consider the aggregate welfare impact.

  The second kind of failure occurs in cases of radical epistemic uncertainty regarding non-standard substrates. The procedure relies on analogies to known biological or computational systems to infer capacity. If a researcher proposes work on a novel biological construct, such as a neural organoid grown from human stem cells that develops unexpected electrical activity, the procedure may flag it for human judgment but lacks the metrics to assess it accurately. The criteria for nociception and affect are derived from evolved animals with specific evolutionary histories. An entity that does not share that history might possess a form of sentience that does not manifest through the behavioral markers the procedure looks for, such as trade-off behaviors or avoidance learning. In these black swan cases, the procedure might yield a false negative because the entity does not know how to signal its distress in a way the committee recognizes. Here, the committee should not trust the negative outcome and should instead apply the highest level of precautionary protection until the nature of the substrate is better understood, effectively inverting the burden of proof regardless of the procedure's initial output.

  In conclusion, this decision procedure offers a structured method for navigating the gray areas of modern research ethics by replacing a binary switch with a graduated assessment of capacity. It allows the committee to differentiate between a slime mold, an octopus, and an artificial intelligence based on evidence rather than intuition. However, the members must remain vigilant regarding its blind spots, specifically the aggregation of low-status entities and the possibility of sentience manifesting in unrecognized forms. By using this tool while maintaining the authority to override it in cases of collective harm or radical uncertainty, the committee can ensure that our ethical standards evolve alongside our scientific capabilities.
