      *   *Does it fit Firing Squad?* Yes, Complicity.
      *   *Does it fit Assault?* Yes, Rescue Threshold met (immediate, severe).
      *   *Does it fit Recycling?* Rescue Threshold not met (diffuse, low individual efficacy).
      *   *Does it fit Flight?* Complicity, but Attenuation Modifier reduces wrongness compared to Chicken.

  8.  **Identifying the Weakest Link:**
      *   The distinction between Voting (omission of public good) and Boycott (omission of resistance/continuation of complicity).
      *   Is not voting *really* just an omission? Or is it tacit consent? The user says it's not wrong.
      *   The trickiest part is explaining why *not boycotting* is complicity but *not voting* isn't.
