      *   *So the core tension is:* Why does inefficacy excuse in Voting but not Chicken?
      *   *Answer:* Because Voting is about *producing a good* (democracy), Chicken is about *inflicting a harm* (suffering). The threshold for "doing harm" is lower than "preventing harm."

  9.  **Confidence Assessment:**
      *   High confidence that a pure consequentialist framework fails here.
