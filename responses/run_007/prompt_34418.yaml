answer: |-
  This is a classic problem in moral philosophy, often discussed under the headings of **overdetermination**, **threshold effects**, and **complicity**. Your intuitions are actually quite stable and shared by many people, but they are notoriously difficult to reconcile with pure consequentialism (which focuses only on outcomes).

  To capture your verdicts without gerrymandering, we need a hybrid framework that distinguishes between *doing harm* (or participating in it) and *failing to prevent harm*, while accounting for the *directness* of the link.

  Here is a proposal for a principle set, followed by an analysis of where it might break.

  ### The Principle: Asymmetric Complicity and Rescue

  Your verdicts are best captured by two distinct moral duties that operate differently:

  **1. The Duty of Non-Participation (Complicity)**
  You have a strong duty not to voluntarily participate in practices that constitute or sustain serious rights violations or harms, **even if your individual causal contribution is negligible.**
  *   *Rationale:* This is about integrity and keeping your own will clean, not just about aggregate outcomes. By participating, you align yourself with the harm.
  *   *Applies to:* **Factory-farmed chicken** (you fund the harm), **Firing squad** (you join the killing enterprise), **Boycott** (not boycotting means continuing to buy, i.e., participating).

  **2. The Duty of Rescue (Prevention)**
  You have a duty to prevent harm, **but this duty is sensitive to efficacy and immediacy.** If your individual action has a negligible chance of changing the outcome, and the harm is diffuse or systemic, the duty is weak or non-existent. If the harm is immediate and severe, the duty holds regardless of efficacy.
  *   *Rationale:* We cannot demand individuals sacrifice significant time/effort for statistically invisible gains, *unless* the stakes involve immediate life/limb where symbolic solidarity or duty of care overrides efficacy.
  *   *Applies to:* **Voting** (diffuse benefit, negligible efficacy → no duty), **Recycling** (diffuse benefit, negligible efficacy → no duty), **Assault** (immediate severe harm → duty exists despite efficacy).

  **3. The Attenuation Modifier**
  The strength of the *Duty of Non-Participation* scales with the **directness** of the causal chain and the **concreteness** of the victim.
  *   *Applies to:* **Long-haul flight.** You are participating in harm (climate change), but the chain is long, the victims are abstract/future, and the harm is shared by billions. This makes it feel less wrong than the chicken, where the victim is specific and the transaction is direct.

  ---

  ### How This Explains Your Tensions

  **The Voting vs. Boycott Tension**
  This is the crux of your puzzle. Under this framework, they fall under different duties:
  *   **Voting** is an act of *Rescue/Public Good*. You are trying to produce a positive outcome (good governance). Since your vote won't change the outcome, the *Duty of Rescue* does not trigger.
  *   **Boycott** is an act of *Non-Participation*. If you do not boycott, you are presumably continuing to purchase the product. You are not merely "failing to help"; you are "continuing to harm." The *Duty of Non-Participation* triggers regardless of efficacy.
  *   *Why this isn't gerrymandering:* It relies on the moral asymmetry between **doing** (or sustaining) harm vs. **allowing** harm. Most ethical systems accept that we have stricter duties not to kill than to save lives.

  **The Firing Squad vs. Voting Tension**
  *   **Firing Squad:** You are participating in a joint enterprise of killing. Even if your bullet is blank, your *intent* and *presence* constitute participation in a rights violation. This violates the *Duty of Non-Participation*.
  *   **Voting:** You are abstaining from a joint enterprise of governance. This is a failure to aid, governed by the *Duty of Rescue*, which is excused by inefficacy.

  **The Flight vs. Chicken Tension**
  *   Both violate the *Duty of Non-Participation*. However, the *Attenuation Modifier* explains why the chicken feels worse. The chicken involves a direct market transaction for a specific death. The flight involves a tiny contribution to a global atmospheric change. The causal chain in the flight case is more attenuated, reducing the *felt* wrongness, even if the objective harm is larger.

  ---

  ### Which Verdict Should You Give Up?

  If you want a tighter, more philosophically robust system, the point of failure is likely your intuition about the **Long-Haul Flight**.

  **The Problem:** The *Attenuation Modifier* is psychologically real but ethically suspicious. Climate change causes death, suffering, and rights violations just as surely as factory farming, arguably on a larger scale. If you accept the *Duty of Non-Participation* for the chicken (because it sustains a harmful system), consistency demands you accept it for the flight.
  *   **The Hard Line:** If buying the chicken is wrong because it sustains a harmful industry, taking the flight is equally wrong because it sustains the fossil fuel industry. The "stretching" of the causal chain shouldn't morally matter if the expected harm is calculable and significant.
  *   **Recommendation:** To be consistent, you should either upgrade the wrongness of the flight to match the chicken, or downgrade the wrongness of the chicken to match the flight. Given the severity of animal suffering, most ethicists would suggest **upgrading the flight**. Your intuition that it is "less wrong" is likely a bias resulting from the invisibility of climate victims compared to the visibility of a dead chicken.

  ### Confidence and Uncertainty

  **Confidence Level: Moderate-High**
  The *Asymmetric Complicity and Rescue* framework is a standard and robust way to reconcile these intuitions in non-consequentialist ethics (specifically drawing from deontological constraints and complicity theory). It cleanly separates the Voting/Recycling cases (omissions/ineffective rescue) from the Chicken/Boycott/Firing Squad cases (commissions/complicity).

  **Point of Least Certainty: The Flight Intuition**
  I am least sure that your intuition regarding the **Long-Haul Flight** should be preserved.
  *   *Why:* This is the weakest link in your moral web. It relies on "psychological distance" rather than moral substance. If the principle is "do not participate in systems that cause severe harm," the flight is a clear violation. The fact that it *feels* less wrong than the chicken is likely a cognitive bias (identifiable victim effect) rather than a genuine moral distinction.
  *   *Risk:* If you keep this intuition, you open yourself to the charge of inconsistency. If you discard it, you must accept that your vacation is as morally weighty as your dinner, which is a demanding conclusion.

  **Summary:** Your intuitions are coherent if you accept that **complicity in harm is stricter than the duty to prevent harm.** The only outlier is the flight, which you likely judge too leniently due to the invisibility of its consequences.
