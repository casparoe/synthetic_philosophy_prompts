answer: |-
  ### Interview Questions: The Anscombean Position on Truman and the Bomb

  **1. Let's begin with the core of Anscombe's argument: the concept of intention. You argue that Truman's decision constitutes murder because he intended the deaths of civilians. However, some defenders of the bombing argue the intention was solely to end the war quickly, with civilian death being a foreseen but unintended side effect. Why does the Anscombean framework reject this distinction in the case of nuclear deployment?**

  *   **Follow-up:** You will likely reply that the destruction of the cities *was* the means to the end, not merely a side effect. If so, does this imply that any bombing raid where civilian morale or infrastructure is the target is inherently murderous, regardless of the weapon used?

  **2. A common objection to your position is consequentialist: if the bombing prevented a land invasion that would have cost hundreds of thousands of lives, does the moral prohibition against murder hold even when it leads to a greater loss of life? How do you answer the claim that "clean hands" are a luxury we cannot afford in statecraft?**

  *   **Follow-up:** I anticipate you will argue that one is not responsible for the evil actions of others (the Japanese leadership's refusal to surrender) but is responsible for one's own. Does this absolve Truman of the responsibility to minimize harm within his power, or does it suggest that moral agency is strictly bounded by one's own immediate acts?

  **3. You classify both Hiroshima and Nagasaki as murder. However, historically and morally, do you view the second bombing as worse than the first, or differently condemned? After Hiroshima, the world knew the destructive power of the atomic bomb; does the decision to proceed with Nagasaki so soon after constitute a distinct moral failure, or are they identical in kind?**

  *   **Follow-up:** If you argue they are identical in kind because the *principle* was established with the first, does that diminish the specific culpability of those who ordered the second, given they had new information about the devastation that the first decision-makers did not?

  **4. To maintain that killing these civilians was murder, you must maintain they were not legitimate targets. In a total war economy, many civilians work in munitions factories or sustain the logistics of the army. How do you distinguish between a civilian whose work contributes to the war effort and a combatant without resorting to a vague notion of innocence?**

  *   **Follow-up:** You will likely draw a line at "direct participation" versus "material cooperation." But if a factory worker knows their product is used to kill, are they not morally complicit in that killing? If they are complicit, why does their death count as murder rather than collateral damage or legitimate targeting?

  **5. Following on that, critics argue that drawing such a sharp line between combatants and civilians ignores the reality of collective responsibility in a democracy at war. If the populace supports the regime and fuels the war machine, doesn't the Anscombean view rely on an individualistic morality that doesn't fit the collective nature of modern conflict?**

  *   **Follow-up:** I expect you to reject collective guilt entirely. But if we cannot hold a populace collectively responsible, does that make modern war impossible to fight justly, effectively pushing your position closer to pacifism than you might admit?

  **6. You have argued that the Allied demand for Unconditional Surrender was an unjust condition that made the bombing possible by closing off diplomatic avenues. If that policy was a necessary precondition for the murder of the civilians in Hiroshima and Nagasaki, does criticizing that demand implicate the broader Allied strategy in the guilt of those deaths?**

  *   **Follow-up:** You will likely say that an unjust condition makes the resulting violence unjust, but does not necessarily make the war itself unjust. However, if removing that condition could have saved the civilians, does holding onto it make the Allies partially responsible for the deaths they could have avoided?

  **7. There is a risk in this line of reasoning: by blaming the Unconditional Surrender policy for the civilian deaths, are you not implicitly accepting a consequentialist calculation yourself? You seem to be arguing that if they had surrendered earlier, fewer would die. Does this not undermine your rejection of consequentialism?**

  *   **Follow-up:** If you argue that you are pointing out a causal link rather than making a utilitarian calculation, does that distinction hold when the primary reason we care about the policy is the body count it produced?

  **8. You maintain that World War II against Germany could be justly fought, yet the Allies engaged in terror bombing of German cities, such as Dresden and Hamburg. How do you reconcile condemning Hiroshima and Nagasaki while maintaining the justice of the European theater, given that the intent to demoralize the civilian population was present in both?**

  *   **Follow-up:** I suspect you will concede that the bombing of German cities was also unjust. If so, does this mean the Allies fought a just war *in principle* but committed war crimes *in practice* so systematically that it undermines the claim that the war was "justly fought"?

  **9. Moving to the present, nuclear deterrence relies on the threat of using these weapons. If the use of atomic weapons against civilians is always murder, is the possession of them for deterrent purposes also morally illicit, or can one threaten what one cannot morally do?**

  *   **Follow-up:** If you argue that conditional intention to murder is still sinful or immoral, does this require a complete nuclear disarmament regardless of the geopolitical consequences, even if it invites aggression from non-compliant states?

  **10. Finally, Anscombe's argument is deeply rooted in Catholic natural law and the doctrine of double effect. Can a secular consequentialist or a liberal deontologist accept the core of your conclusion—that Truman committed murder—without buying into the theological or metaphysical framework that Anscombe used to derive it?**

  *   **Follow-up:** If you argue that the argument stands on reason alone, why has it failed to persuade secular ethicists who accept the same premises but reach different conclusions? Is the "murder" label inextricably tied to a specific conception of the sanctity of life that secularism does not share?

  ***

  ### Contextual Note: The State of the Debate on Anscombe's Argument

  When discussing Elizabeth Anscombe's *Mr. Truman's Degree* (1958) and the philosophical position outlined above, it is crucial to distinguish between what is historically settled regarding her text and what remains philosophically and historically contested.

  **What is Settled:**
  *   **Anscombe's Conclusion:** It is uncontested that Anscombe argued Truman's decision was murder. She did not hedge this claim; she viewed the intentional killing of innocents as an absolute prohibition that consequences could not override.
  *   **The Basis of the Objection:** It is settled that her protest against Truman's honorary degree at Oxford was based on the *intentionality* of the act. She argued that the civilians were not killed as a side effect (collateral damage) but as the means to force surrender.
  *   **Unconditional Surrender:** It is a matter of record that Anscombe identified the policy of Unconditional Surrender as a key factor that eliminated the possibility of a negotiated peace, thereby making the use of the bomb seem "necessary" to the Truman administration.
  *   **Non-Pacifism:** It is settled that Anscombe was not a pacifist. She believed in the possibility of a just war and distinguished between killing combatants and killing innocents.

  **What is Genuinely Contested:**
  *   **Historical Counterfactuals:** Historians and philosophers fiercely debate the claim that Japan was ready to surrender prior to the bombs or that Unconditional Surrender was the sole blocker. Some argue the Soviet entry into the war was the decisive factor, while others maintain an invasion was imminent and necessary. Anscombe's argument relies on the premise that the bombing was *not* necessary to end the war; if the bombing was the only viable option to stop the war, the moral calculus shifts for many ethicists.
  *   **The Coherence of "Intention":** Contemporary philosophers of action dispute Anscombe's application of the Doctrine of Double Effect. Some argue that in "terror bombing," the death of civilians is indeed a means, but others argue that the distinction between "means" and "foreseen side effect" is psychologically and morally unstable in complex military strategies.
  *   **Consistency Regarding Germany:** While Anscombe condemned the atomic bombs, her position on the firebombing of German cities is sometimes interpreted differently by her defenders. A strict reading requires condemning Dresden as well. The contestation lies in whether one can maintain the war against Germany was "just" if the primary method of strategic bombing employed by the Allies was inherently unjust.
  *   **Secular Viability:** There is ongoing debate over whether Anscombe's argument survives without her theological commitments. Secular deontologists often struggle to ground the absolute prohibition on killing innocents without recourse to natural law or divine command, while consequentialists reject the prohibition entirely when stakes are high. Whether the "murder" label sticks in a secular framework remains a point of contention in modern just-war theory.
