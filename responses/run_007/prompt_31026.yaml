answer: |-
  Here is the specification for a coherent theory of desert, the conflicts within that spec, and the only view that survives the stress test.

  ### The Spec Sheet: 5 Requirements for a Theory of Desert

  To be taken seriously, a theory of desert cannot just be a intuition pump for "hard work should pay." It must resolve specific philosophical tensions.

  | # | Requirement | The Forcing Case |
  | :--- | :--- | :--- |
  | **1** | **The Control Principle** | **The Genetic Lottery:** Two people exert identical effort. Person A has high native IQ/talent; Person B has low. A produces 10x value. If A deserves 10x the reward, you are rewarding luck, not agency. A theory of desert must separate what is *mine* (agency) from what is *given* (circumstance). |
  | **2** | **The Effort/Talent Distinction** | **The Gifted Slacker:** A naturally brilliant coder coasts and builds a useful app in 2 hours. A struggling coder works 80 hours to build a buggy version. If desert tracks *outcome*, the Slacker wins. If it tracks *moral worth*, the Struggler wins. A theory must declare which metric is the "desert-base." |
  | **3** | **The Desert/Entitlement Gap** | **The Loophole Lawyer:** A CEO exploits a legal loophole to drain a pension fund. They are *entitled* to the money by contract/law. Do they *deserve* it? If Desert = Entitlement, the concept is redundant. If Desert $\neq$ Entitlement, the theory must explain why we sometimes enforce entitlements people don't deserve. |
  | **4** | **The Social Value Constraint** | **The Mudpie Maker:** A worker spends 10 hours diligently making mudpies. Another spends 10 hours baking bread. Both exerted equal effort. Does the mudpie maker deserve a wage? If desert is internal (effort), yes. If desert is external (value), no. A theory must link individual agency to social utility. |
  | **5** | **The Non-Identity of Need** | **The Starving Saboteur:** A person is starving (high need) but sabotaged the factory (negative desert). A person is wealthy (low need) but saved the factory (positive desert). A theory of desert must not collapse into a theory of welfare. Need creates a claim on *survival*; desert creates a claim on *surplus*. |

  ---

  ### Triage: Non-Negotiables vs. Camp Hangups

  **Non-Negotiable (The Hard Constraints)**
  *   **1. The Control Principle:** Without this, "desert" is just a religious justification for fortune. If I deserve my height, I deserve my income. This reduces morality to physics.
  *   **3. The Desert/Entitlement Gap:** Without this, "desert" is just a synonym for "legal right." We need the concept precisely for cases where the law is unjust or blind.
  *   **5. The Non-Identity of Need:** Without this, you cannot distinguish between *charity* and *payment*. Collapsing them destroys the incentive structure and the moral distinction between contribution and dependency.

  **Camp Hangups (Negotiable/Secondary)**
  *   **2. The Effort/Talent Distinction:** *Libertarians* want to blur this (talent is property). *Egalitarians* want to sever it (talent is luck). This is a battlefield, not a foundation.
  *   **4. The Social Value Constraint:** *Utilitarians* insist on this (no value, no reward). *Kantians* resist it (virtue is its own reward). This is a policy implementation detail, not a metaphysical requirement.

  ---

  ### The Fatal Tension: Incompatibilities

  You cannot satisfy **The Control Principle (1)** and **The Social Value Constraint (4)** simultaneously in a free market.

  *   **Why:** Social value is determined by market scarcity and consumer preference, which are largely matters of brute luck (being born in the right era with the right skills).
  *   **The Conflict:** If you reward based on Social Value (4), you violate Control (1) because you are rewarding luck. If you reward based on Control (1) (i.e., effort/sacrifice), you violate Social Value (4) because you might be paying people to make mudpies.
  *   **The Result:** You must choose between a **Moral Economy** (rewarding effort) and a **Productive Economy** (rewarding value). You cannot have a "Meritocracy" that claims to be both morally just and economically efficient without lying about one of them.

  ---

  ### The Killer Requirement: The Control Principle

  **Requirement #1 does the most damage.** It detonates the standard defense of market income.

  Most people operate on a "Market Meritocracy" view: *I deserve my income because I created value.* The Control Principle reveals that "creating value" is 90% dependent on factors you didn't choose (genetics, upbringing, historical timing). If you cannot deserve your native assets, you cannot deserve the income stream those assets generate.

  ---

  ### Scorecard: How Standard Positions Fare

  | Position | Control (1) | Entitlement Gap (3) | Need Distinction (5) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Market Meritocracy** (Libertarian/Neoliberal) | **FAIL.** Treats talent as property. | **PASS.** Distinguishes law from morality. | **PASS.** Rejects need as a claim on income. | **Incoherent.** Justifies aristocracy of luck. |
  | **Strict Egalitarianism** (Outcome Equality) | **PASS.** Neutralizes luck. | **FAIL.** Often conflates rights with outcomes. | **FAIL.** Collapses desert into need. | **Unstable.** Destroys agency incentives. |
  | **Utilitarianism** (Incentive-Based) | **FAIL.** Ignores desert entirely (forward-looking). | **PASS.** Rules are tools, not moral truths. | **PASS.** Need is just another utility input. | **Honest.** Admits it's not about desert. |
  | **Luck Egalitarianism** (Choice-Sensitive) | **PASS.** Rewards choice, taxes luck. | **PASS.** Distinguishes just claims from legal ones. | **PASS.** Separates welfare (need) from wage (choice). | **SURVIVOR.** |

  ---

  ### The Committed Answer: The View That Survives

  I defend **Luck Egalitarian Desert** (specifically, a **Responsibility-Sensitive Prioritarianism**).

  **The Core Claim:**
  You deserve the consequences of your **choices**, but you do not deserve the consequences of your **circumstances**.

  **Why I Defend These Requirements:**
  I hold **The Control Principle** as non-negotiable because any other starting point is morally arbitrary. If we allow "brute luck" (talent, inheritance) to count as desert, we are not building a moral system; we are sanctifying a lottery. I hold **The Desert/Entitlement Gap** as non-negotiable because law is a blunt instrument; morality must be the sharp edge that critiques it.

  **The Surviving View:**
  Standard Meritocracy fails because it conflates *price* with *virtue*. The market price of your labor is a function of supply and demand, which are external to your moral agency. Therefore, **no one deserves their market income in full.**

  However, we cannot abolish desert entirely (or we lose agency). The solution is a two-tier system:

  1.  **The Baseline (Need):** A universal floor guaranteed by citizenship. This satisfies *Requirement 5* (Need) without contaminating desert. No one starves, regardless of "merit."
  2.  **The Surplus (Desert):** Income above the baseline is distributed based on **Effort + Prudence (Option Luck)**, not Talent + Inheritance (Brute Luck).

  **How It Works in Practice (The "Raise" Problem):**
  *   **The Hard Worker / Low Talent:** Deserves a reward for *effort*, but not for *output value*. If their output is low value, the market shouldn't pay them more, but the state should subsidize their effort to ensure they aren't penalized for low native ability.
  *   **The Lucky Coaster:** Does *not* deserve the windfall from their lucky break. That surplus should be taxed as "rent" on brute luck and redistributed to the baseline.
  *   **The Inherited Head-Start:** The head-start is neutralized via estate tax/opportunity equalization. They only deserve the return on the *marginal effort* they added to that head start, not the return on the head start itself.

  **The Hard Pill to Swallow:**
  This view admits that **most high earners do not deserve their wealth.** They are the beneficiaries of the genetic and social lottery. This is not an attack on their *entitlement* (they earned it legally), but on their *desert* (they have no moral claim to keep it all).

  **Why This Wins:**
  It is the only view that respects human agency (we are responsible for our choices) without respecting moral arbitrariness (we are not responsible for our genetics). It saves the concept of desert from becoming a myth, but shrinks its domain to the only place it can logically exist: **the space between our circumstances and our choices.**

  **Final Verdict:**
  Stop asking who deserves the bigger share of the *whole pie*. The pie is mostly luck. Ask who deserves the *cherries on top*—the marginal gain produced by their specific, voluntary exertion. Tax the rest. That is the only defensible theory of desert.
