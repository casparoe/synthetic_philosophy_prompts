answer: |-
  You have put your finger on the precise mathematical nerve that makes infinite population ethics so notoriously difficult. You are correct to distinguish this from the "pairing" puzzle (which is about cardinality and Cantor's diagonalization); your problem is about **aggregation** and **series convergence**.

  Here is the carving you are looking for: the name of the phenomenon, the mathematical principle driving it, the ethical terminology, and the specific boundary cases where the problem vanishes.

  ### 1. The Name of the Phenomenon

  There is no single "Trolley Problem" style label, but there are two precise terms used depending on whether you are speaking to a mathematician or a philosopher.

  **The Mathematical Name: The Riemann Rearrangement Theorem**
  Strictly speaking, the Riemann Rearrangement Theorem states that if an infinite series of real numbers is *conditionally convergent* (it converges to a sum, but the sum of the absolute values diverges), its terms can be rearranged to sum to any real number, or to diverge to positive or negative infinity.

  While your specific example ($\sum \pm 1$) technically diverges rather than converges conditionally, the underlying pathology is identical: **the lack of absolute convergence.** In mathematics, this is broadly categorized under the **Order-Dependence of Infinite Sums**.

  **The Ethical Name: The Permutation Problem**
  In population ethics and social choice theory, this is most commonly called **The Permutation Problem** (or sometimes **The Problem of Permutation Invariance**).
  It arises because standard Utilitarianism relies on an **Anonymity Axiom**: the moral value of a future should not depend on *which* specific individuals hold the utility, nor the order in which we list them. If the "running total" changes when you permute (reorder) the people, the aggregation method violates Anonymity.

  So, if you need a label for your argument, call it **The Permutation Problem in Infinite Aggregation**.

  ### 2. The Nearest Concepts (and how they differ)

  You mentioned you want to know the edges. Here is how this problem is distinct from its neighbors.

  **A. Hilbert's Hotel (Cardinality vs. Summation)**
  *   **The Concept:** The puzzle you started with (pairing +1s and -1s one-to-one) is about *cardinality*. It asks: "How many?"
  *   **The Difference:** Your running-total puzzle is about *magnitude*. It asks: "How much?"
  *   **The Edge:** You can solve the cardinality puzzle (there are $\aleph_0$ of each) and still be left with the summation puzzle. The summation puzzle is harder because cardinality is order-invariant (Cantor's theory), but infinite sums are not.

  **B. Diamond's Impossibility Theorem**
  *   **The Concept:** A theorem in economics showing you cannot have a social welfare function that satisfies both **Strong Pareto** (if everyone is better off, the future is better) and **Anonymity** (swapping people doesn't change value) in an infinite context.
  *   **The Difference:** Diamond's theorem is a formal proof of impossibility. The Permutation Problem is the *mechanism* that creates that impossibility.
  *   **The Edge:** The Permutation Problem is the specific symptom; Diamond's Theorem is the diagnosis that the disease is terminal for standard utilitarianism.

  **C. Supertasks**
  *   **The Concept:** Performing infinitely many actions in finite time (e.g., Thomson's Lamp).
  *   **The Difference:** Supertasks are about physical or temporal possibility. The Permutation Problem is about evaluative coherence.
  *   **The Edge:** You can have the Permutation Problem even in a static, timeless universe of infinite people. Time is not required, only an ordering.

  ### 3. The Boundary Cases: Where the Problem Disappears

  This is the "carving" you requested. The Permutation Problem only exists in a specific zone of logical space. If you move outside that zone, the running-total method becomes stable again.

  **Boundary 1: Absolute Convergence (The Diminishing Utility Fix)**
  *   **The Condition:** The utility values must get smaller fast enough. If the utilities are $+1, -1/2, +1/3, -1/4 \dots$ (the alternating harmonic series), the sum converges.
  *   **The Edge:** If $\sum |u_i| < \infty$ (the sum of absolute values is finite), then **Riemann's Rearrangement Theorem does not apply.** The sum is invariant regardless of order.
  *   **Ethical Implication:** If welfare has a "discount rate" or diminishes rapidly enough across the infinite population, the problem vanishes. But this requires assuming distant people matter less, which many ethicists reject.

  **Boundary 2: One-Sided Infinity (The Sign Fix)**
  *   **The Condition:** All utilities are non-negative (or non-positive).
  *   **The Edge:** If every life is $+1$ (or $+1$ and $0$), the sum is $+\infty$ regardless of order. You cannot rearrange a series of positive numbers to make it sum to negative infinity.
  *   **Ethical Implication:** The Permutation Problem *only* arises when there is a mix of positive and negative welfare in an infinite set. A "Heaven" (all +1) is stable; a "Mixed World" (+1 and -1) is unstable.

  **Boundary 3: Finite Differences (The Overtaking Criterion)**
  *   **The Condition:** You are not evaluating a single future in isolation, but comparing two futures that differ in only *finitely* many places.
  *   **The Edge:** If Future A and Future B are identical except for 1,000 people, the infinite "tails" cancel out. You only sum the differences.
  *   **Ethical Implication:** This is the most common "fix" in economics (called the **Overtaking Criterion** or **Catch-up Criterion**). It admits we can't judge the *absolute* value of an infinite future, but we can judge *relative* improvements. The Permutation Problem resurfaces if the differences themselves are infinite.

  **Boundary 4: Privileged Ordering (The Spacetime Fix)**
  *   **The Condition:** There is a natural, non-arbitrary order to the people (e.g., their position in spacetime).
  *   **The Edge:** If the universe has a grid structure, you might say "we must sum along the time axis."
  *   **Ethical Implication:** This solves the mathematical arbitrariness but creates a moral one. Why does summing by *time* matter more than summing by *space*? If you sum by time slices, you might get a different result than summing by spatial regions. This leads to **Frame-Dependence**, which is arguably just the Permutation Problem in disguise.

  ### 4. Summary of the Carving

  To visualize where your problem lives:

  1.  **Is the population finite?**
      *   Yes $\rightarrow$ No problem. (Standard Utilitarianism works).
      *   No $\rightarrow$ Go to 2.
  2.  **Are all utilities the same sign (all good or all bad)?**
      *   Yes $\rightarrow$ No problem. (Sum is $\infty$ or $-\infty$ invariantly).
      *   No (Mixed) $\rightarrow$ Go to 3.
  3.  **Is the sum of absolute utilities finite? ($\sum |u_i| < \infty$)**
      *   Yes $\rightarrow$ No problem. (Absolutely convergent; order doesn't matter).
      *   No $\rightarrow$ **The Permutation Problem Exists Here.**

  You are stuck in the bottom-right quadrant: **Infinite Population + Mixed Welfare + Non-Absolute Convergence.**

  ### 5. What to call it in argument

  If you are writing this up or arguing it, the strongest phrasing is:

  > "This is an instance of the **Permutation Problem** arising from the lack of **Absolute Convergence** in infinite utility streams. Because the series is not absolutely convergent, the aggregate value is **order-dependent**, which violates the **Anonymity Axiom** required by standard utilitarianism."

  This signals that you understand the math (Absolute Convergence), the ethics (Anonymity/Utilitarianism), and the specific paradox (Permutation). It prevents your opponent from retreating to the "pairing" (cardinality) argument, because you have explicitly moved the goalposts to *summation*.

  ### 6. The Philosophical Upshot

  The reason this feels so sticky is that it suggests **Infinite Utilitarianism is mathematically ill-defined** without additional constraints.

  Most philosophers who work on this (like Vallentyne, Kagan, or Greaves) conclude that you cannot assign a *scalar value* (a single number) to such a future. Instead, you must use **partial orderings**. You can say Future A is *better* than Future B if A is better in every finite slice, but you must accept that some futures are **incomparable**.

  The "running total" method fails because it tries to force a complete ordering (Good, Bad, Neutral) onto a structure that only supports a partial ordering. The "fix" your opponent offered (just pick an order!) is mathematically valid but morally arbitrary, which is exactly why you feel stuck. You aren't missing a trick; you've found the wall.
