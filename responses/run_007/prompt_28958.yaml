answer: |-
  After months of discussion and review of the literature, we have convened to formalize the state of our debate regarding the cognitive penetrability of perception. This document serves as a record of our shared commitments, the precise locus of our disagreement, and the empirical cruxes that we agree would adjudicate the matter. We begin by affirming our shared commitment to a realist view of the visual system, acknowledging that perception involves a hierarchy of processing stages ranging from early sensory registration in areas like V1 to higher-level object recognition and semantic categorization. We both agree that attention is a distinct mechanism from perception proper, and that shifts in spatial or feature-based attention can alter perceptual processing without implying that beliefs or desires have penetrated the system. We also agree that many purported cases of cognitive penetration are best explained as post-perceptual judgment biases, where the sensory input remains constant but the decision criteria or memory reports are altered by expectations. Furthermore, we concur that for a genuine case of cognitive penetration to exist, a high-level cognitive state such as a belief, desire, or expectation must causally influence the content of early perceptual experience in a way that is not reducible to attentional modulation or response bias. We both accept that if an effect can be fully explained by the subject attending differently to stimuli based on their expectations, this does not count as penetration of the perceptual module itself.

  Despite this substantial common ground, we diverge on the architectural openness of the visual system. My position is that the visual system is not encapsulated and that high-level cognitive states can alter the phenomenology and neural processing of early vision, such that what one sees is literally shaped by what one believes or wants. My colleague maintains that the core stages of perceptual processing are cognitively impenetrable, arguing that the visual system operates as a modular input system that delivers a fixed representation to cognition, which then interprets that representation. Where I see evidence of top-down influence on sensory representation, my colleague sees evidence of top-down influence on selection, weighting, or decision-making processes that occur after the perceptual representation has been finalized. We agree that this disagreement is not merely verbal but hinges on the specific timing and neural locus of top-down influences. If cognitive states modulate neural activity in early visual cortex prior to the formation of a decision, this favors my view. If such modulation occurs only in later stages associated with memory, reporting, or motor planning, this favors my colleague's view.

  To move beyond this stalemate, we have identified two specific cruxes where further evidence would force at least one of us to revise our position. The first crux concerns the temporal profile of semantic influence on sensory processing. We propose a magnetoencephalography study where subjects are primed with semantic categories that are either congruent or incongruent with subsequently presented ambiguous visual stimuli, while controlling strictly for spatial attention. The question is whether semantic congruency modulates event-related fields in early visual cortex within the first one hundred milliseconds of stimulus onset. I predict that congruent primes will alter the amplitude of early sensory components such as the C1 or P1, indicating that semantic information has accessed and modified early sensory processing before conscious recognition is complete. My colleague predicts that early components will remain unaffected by semantic congruency, with differences appearing only in later components such as the P3 or N400, which are associated with contextual integration and decision-making rather than early sensory registration. If the early components show modulation despite strict attentional controls, my colleague must concede that some form of penetration occurs at early stages. If only later components are modulated, I must concede that the effects are post-perceptual.

  The second crux concerns the plasticity of perceptual tuning following category learning. We propose a longitudinal experiment where subjects are trained to distinguish between novel artificial object categories that differ only in subtle visual features, with the training regime emphasizing semantic labels and functional beliefs about the categories. The question is whether this training alters tuning functions in early visual areas as measured by functional magnetic resonance adaptation or decoding accuracy. I predict that after extensive training, the neural representation of the trained categories in early visual cortex will become more distinct, reflecting a change in the perceptual system itself driven by cognitive category acquisition. My colleague predicts that while behavioral discrimination will improve, the neural tuning in early visual areas will remain unchanged, with improvements localized to higher-level object recognition areas or decision circuits. If early visual tuning shifts as a function of semantic category learning, this supports the view that cognition reshapes perception. If the shift is confined to higher-order areas, this supports the view that perception is fixed and only downstream processing adapts.

  We commit to accepting the results of these paradigms as binding for our respective positions, provided the methodological controls for attention and response bias are met to the satisfaction of both parties. We acknowledge that there may be verbal disputes regarding the definition of perception, but we believe these empirical tests bypass mere terminology by targeting the causal architecture of the visual system. We further agree that if evidence emerges showing that what we call penetration is actually a form of rapid perceptual learning that occurs during the experiment rather than a direct influence of standing beliefs, this would require a refinement of my position, though it would still suggest a permeability of the system over time that my colleague might find difficult to reconcile with strong modularity. Conversely, if all top-down effects are shown to be mediated by known attentional mechanisms even in cases where subjects report no shift in attention, my colleague must acknowledge that the boundary between attention and perception is more porous than traditionally assumed.

  Stepping back from the draft itself to evaluate the terrain, I am moderately confident in the way I have carved things up, perhaps around seventy percent, primarily because the debate over cognitive penetration is notorious for shifting goalposts regarding what counts as perception versus judgment. The section I am least sure about is the formulation of the second crux regarding perceptual learning, because there is a persistent risk that one side will argue that changes in early visual tuning due to training constitute a change in the input system's parameters rather than genuine cognitive penetration by standing beliefs, which could allow your colleague to maintain the impenetrability thesis by reclassifying the effect as plasticity rather than penetration. Additionally, I suspect the whole debate might be partly verbal insofar as the distinction between early attentional weighting and early perceptual modification is not always clear in neural data, and there is a possibility that both of you might interpret the same neural modulation differently depending on your prior theoretical commitments. The temporal crux is stronger because timing is harder to reinterpret, but even there, feedback loops in the brain are so rapid that distinguishing a top-down belief signal from a recurrent perceptual processing signal remains technically challenging. Ultimately, this document should serve as a solid foundation, but you should be prepared for the possibility that even clear data might be absorbed into existing frameworks without forcing a full concession, which is a common feature of deep philosophical disputes in cognitive science.
