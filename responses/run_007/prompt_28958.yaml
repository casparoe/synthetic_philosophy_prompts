prompt: |-
  So my reading group has been going back and forth on cognitive penetration of perception for months, and we're finally trying to write up an adversarial collaboration document. The two of us — I lean toward the view that perception is cognitively penetrable (beliefs, expectations, desires can literally shape what we see, not just what we judge about what we see), and my colleague holds that perception is cognitively impenetrable in its core stages (what looks like penetration is always post-perceptual judgment, or attention shifting around, or some other downstream effect that leaves early perceptual processing itself untouched). We want to produce a joint statement we can both sign.

  What we're after: first, the claims we actually agree on — about the visual system, about what would and wouldn't count as penetration, about the existing empirical results and which ones are genuinely in dispute. Then, the precise points where we still differ, phrased so that each of us would accept the wording of our own position (no straw men). Then the cruxes — the sub-questions where, if they got settled, at least one of us would have to move. And for each crux, the kind of experiment or evidence we'd both accept as bearing on it, with each of our predictions written down in advance. We're especially interested in cruxes that go beyond the usual suspects — not just "does the Mueller-Lyer illusion go away with practice" but something deeper about architecture.

  Please write this as continuous prose — no headings, no bullet points, no bold, no tables. Just write it the way you'd write a letter or an email, flowing naturally from agreed claims through disagreements to cruxes and predictions. And at the end, tell me how confident you are in the way you've carved things up, and which part of the document you're least sure about — whether it's a formulation you think one side might reject, or a crux you're not sure really cuts at the joint, or a place where you suspect the whole debate might be partly verbal.
