  2.  **Deconstruct the Kalai-Smorodinsky (KS) Solution:**
      *   **Core Idea:** Maintain the ratio of maximum possible gains relative to the disagreement point. It connects the disagreement point $d$ to the ideal point $b$ (where each gets their max possible utility) and finds the intersection with the Pareto frontier.
      *   **Formula:** Maximize $\lambda$ such that $u = d + \lambda(b - d)$ is feasible.
      *   **Key Property:** Individual Monotonicity (unlike Nash).
      *   **Challenge:** Utilities are ordinal/non-comparable across persons. KS requires normalizing utilities to [0,1] based on $d$ and $b$.

