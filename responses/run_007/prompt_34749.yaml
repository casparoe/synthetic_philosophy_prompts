      *   *Step 2: Define Ideal Point ($b$).* What is the best each party could possibly get within the feasible set? (Not necessarily what they want, but what is physically/contractually possible).
      *   *Step 3: Normalize.* Map $d$ to 0 and $b$ to 1 for each party.
      *   *Step 4: Find Intersection.* Look for the feasible outcome closest to the line connecting $d$ and $b$.
