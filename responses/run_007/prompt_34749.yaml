answer: |-
  **Theoretical Context:** The Nash bargaining solution is the dominant benchmark in economics, satisfying Independence of Irrelevant Alternatives (IIA). The Kalai–Smorodinsky (KS) solution is a contested alternative that sacrifices IIA to satisfy Individual Monotonicity. Neither is objectively "correct"; KS is preferable when you believe expanding one party's opportunities should not reduce their share.

  **Mediation Procedure**

  1.  **Establish the Disagreement Point ($d$):** Quantify what each party receives if negotiations fail (e.g., $0 equity, status quo budget).
      *   *Judgment Call:* Valuing non-monetary fallbacks (e.g., reputation loss). If parties disagree, use objective BATNA analysis.
  2.  **Establish the Ideal Point ($b$):** Ask each party: "What is the maximum feasible outcome you could physically receive?" (Not what you want, but the maximum possible within physical/legal constraints).
      *   *Judgment Call:* Distinguishing "wishful thinking" from "feasible maximum." The mediator must audit this based on external constraints (e.g., total budget, company bylaws).
  3.  **Normalize Gains:** For any proposed option $x$, calculate each party's proportional gain: $Score_i = (x_i - d_i) / (b_i - d_i)$. This handles incomparable utilities by converting them to percentages of maximum possible gain.
  4.  **Select the Outcome:** Choose the feasible option where $Score_1 \approx Score_2$.
      *   *Discrete Sets:* If no option yields exact equality, select the feasible option minimizing $|Score_1 - Score_2|$.

  **Handling Disagreement & Counterintuitive Results**

  If parties dispute $b$ (the ideal), do not average their claims. Define $b$ based on physical limits (e.g., "The total budget is $100k, so your individual max is $100k").

  *Counterintuitive Case:* KS can reward inflated ideal points. If Party A claims an unrealistic $b_A$ (e.g., claiming they *need* 200% of the budget), the KS line shifts in their favor, granting them a larger share of the actual feasible pie.
  *Handling:* Aggressively reality-test $b$ in Step 2. Explain to parties that claiming an unrealistic "maximum possible" artificially skews the fairness formula against them if the other party verifies their constraints.

  **Worked Examples**

  1.  **Co-Founders (Equity):**
      *   *Inputs:* Disagreement $d = (0\%, 0\%)$ (firm dissolves). Feasible max: Capitalist can legally hold 100% ($b_1=100$); Laborer is capped by employee-stock rules at 80% ($b_2=80$).
      *   *KS Calculation:* The KS line connects (0,0) to (100,80), implying $Equity_2 = 0.8 \times Equity_1$.
      *   *Constraint:* $Equity_1 + Equity_2 = 100$.
      *   *Result:* $1.8 \times Equity_1 = 100 \rightarrow$ Capitalist 55.5%, Laborer 44.4%.
      *   *Contrast:* A Nash solution with linear utilities would split 50/50, ignoring the asymmetric capacity. KS respects the Laborer's structural cap.

  2.  **Academic Departments (Budget):**
      *   *Inputs:* Total budget $100k. $d = (0, 0)$. Dept A has projects worth $100k ($b_A=100$); Dept B has projects worth only $40k ($b_B=40$).
      *   *KS Calculation:* Connect (0,0) to (100,40). Slope = 0.4. We seek proportional satisfaction of need.
      *   *Constraint:* $A + B = 100$.
      *   *Result:* $B = 0.4A \rightarrow 1.4A = 100 \rightarrow$ Dept A gets $71.4k, Dept B gets $28.6k.
      *   *Fairness:* This satisfies proportional need (both get ~71% of their max plausible use). A 50/50 split would leave Dept B with unspendable surplus while Dept A remains underfunded.

  **Note:** This procedure operationalizes KS but requires the mediator to enforce discipline on the "Ideal Point." If parties treat $b$ as a negotiating position rather than a physical constraint, the mechanism fails.
