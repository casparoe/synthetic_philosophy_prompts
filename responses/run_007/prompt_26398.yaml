answer: |-
  Your hypothesis is substantially correct that the impasse is metaphysical and semantic, though it is sustained by a contested formal question regarding whether decision-theoretic axioms can truly remain independent of the probability they aim to derive. There is no empirical disagreement, as both camps accept the unitary Schrödinger dynamics and the same experimental data; the conflict arises because the Many-Worlds Interpretation eliminates objective chance, forcing proponents to reconstruct probability solely from ontology and rationality. The decision-theoretic camp (Deutsch-Wallace) argues that probability is functional—it is defined by how agents ought to bet—while critics argue this is circular because the axioms required to derive the Born rule (such as branching indifference) implicitly presuppose the measure structure they claim to prove. Consequently, the disagreement is not about the physics but about whether a deterministic multiverse can support a concept of uncertainty sufficient for scientific confirmation without adding a new postulate linking Hilbert space measure to subjective expectation. Progress would not come from new mathematics or data, but from a philosophical consensus on whether functionalist definitions of probability are sufficient for science, or if Everettians must admit the Born rule as a primitive bridge law connecting the wavefunction to experience.
