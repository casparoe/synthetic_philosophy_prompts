      *   **Opposing View:** A peer argues Buddhist ethics is essentially consequentialism + rebirth (karma = welfare tracking, precepts = rules of thumb, bodhisattva = welfare maximisation). They claim disagreements are metaphysical, not ethical.
      *   **User's Intuition:** Suspicious of this view. Suspects intention (*cetanā*) and agent-transformation are key, not just external outcomes.
      *   **Task:** Audit the analogy. Map Buddhist concepts to Consequentialist ones. Identify where the mapping strains/breaks. Distinguish significant disanalogies (ethical) from insignificant ones (metaphysical). Suggest a better analogy if applicable.
      *   **Tone/Style:** British English. Philosophical rigour but accessible.

  2.  **Initial Assessment & Deconstruction:**
      *   The peer's view is a form of "Consequentialist Interpretation of Buddhism" (often associated with thinkers like Damien Keown, though Keown actually argues *against* pure consequentialism, favouring virtue ethics. Some Western utilitarians *do* try to claim Buddhism).
      *   *Surface Similarities:* Both care about suffering (*dukkha* vs. pain/utility). Both have a universal scope (all sentient beings). Both imply actions have weight based on results (karma vs. consequences).
      *   *Deep Differences:* Consequentialism judges the *act* by the *outcome*. Buddhism judges the *act* by the *intention* and its effect on the *agent's character*.
      *   *Key Concept:* *Cetanā* (volition/intention) is karma. This is the killer argument against pure consequentialism.
      *   *Goal:* Validate the user's suspicion while acknowledging where the peer isn't *completely* mad (there are overlaps).

  3.  **Drafting the Mapping (The "Audit"):**
      *   Need a clear table or list comparing concepts.
      *   *Utility* $\leftrightarrow$ *Nirvana/Cessation of Dukkha*.
      *   *Maximisation* $\leftrightarrow$ *Liberation of All Beings*.
      *   *Empirical Consequences* $\leftrightarrow$ *Karmic Vipaka (Fruit)*.
      *   *Rules of Thumb* $\leftrightarrow$ *Sila (Precepts)*.

  4.  **Identifying the Strain Points (The "Breakage"):**
      *   *Intention vs. Outcome:* In utilitarianism, a well-intentioned disaster is a bad act. In Buddhism, a well-intentioned disaster is good karma (ethically), even if the worldly result is bad.
      *   *Agent-Neutrality vs. Agent-Cultivation:* Utilitarianism doesn't care *who* does the good, just that it gets done. Buddhism cares deeply about the purity of the doer's mind.
      *   *The "Good":* Utilitarianism usually defines good as pleasure/preference satisfaction. Buddhism defines the ultimate good as the *extinguishing* of craving (which might look like negative utility to a hedonist).
      *   *Special Obligations:* Utilitarianism is impartial. Buddhism has gratitude/obligations to parents/teachers that aren't purely utility-based.

  5.  **Evaluating the "Same Ethical Project" Claim:**
