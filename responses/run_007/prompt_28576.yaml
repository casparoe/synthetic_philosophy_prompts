answer: |-
  Your suspicion is well-founded. The argument your group member is making is a known position in comparative ethics—sometimes called the 'Consequentialist Interpretation'—but it is widely regarded by specialists as reductive. It captures the *soteriological goal* (ending suffering) but misses the *moral architecture*.

  If you treat Buddhist ethics as merely 'Consequentialism + Rebirth', you risk turning the Dharma into a cosmic accounting exercise, which contradicts the core teaching of *anattā* (not-self) and the psychological focus of the path.

  Here is an audit of the analogy, mapping the concepts, identifying where the machinery jams, and proposing a more robust alternative.

  ### 1. The Mapping: Where the Analogy Holds Surface Water

  Your friend is not hallucinating similarities; there are genuine structural overlaps. Here is how the translation usually looks:

  | **Utilitarian/Consequentialist Concept** | **Buddhist Equivalent (Superficial)** | **Function** |
  | :--- | :--- | :--- |
  | **Utility / Welfare** | **Sukha / Cessation of *Dukkha*** | The 'good' to be promoted. |
  | **Maximisation Principle** | **Bodhisattva Vow / Universal Compassion** | The scope of moral concern (all sentient beings). |
  | **Empirical Consequences** | **Karmic *Vipāka* (Fruit)** | The result of an action ripening over time. |
  | **Rules of Thumb** | **Sīla (Precepts)** | Heuristics to prevent harm (e.g., 'do not kill'). |
  | **Impartiality** | **Equanimity (*Upekkhā*)** | Not favouring self over other. |

  On this level, your friend is right: both systems are universalist, concerned with suffering, and believe actions have causal weight. However, this is where the resemblance largely ends.

  ### 2. The Strain Points: Where the Mapping Breaks

  The claim that disagreements are 'mostly about metaphysics (rebirth)' is incorrect. The disagreements are about the **criterion of moral rightness** and the **nature of the moral agent**.

  #### A. *Cetanā* (Intention) vs. Actual Outcomes
  In consequentialism, the moral worth of an act is determined by its actual outcome. If you try to save a drowning child but accidentally push them under, a strict act-utilitarian must call this a 'wrong' act (or at least, sub-optimal), regardless of your motive.

  In Buddhism, *karma* is defined explicitly as *cetanā* (volition/intention). The Buddha states in the *Anguttara Nikāya*: "It is intention, O monks, that I call karma."
  *   **The Break:** If you act with pure compassion but the worldly outcome is disastrous, you have generated *good* karma (wholesome *kusala*), because your mind was purified by the intention. The external consequence is secondary to the psychological imprint left on the agent.
  *   **Ethical Significance:** High. This shifts Buddhism from an act-evaluation system to an agent-evaluation system.

  #### B. Agent-Neutrality vs. Agent-Transformation
  Consequentialism is 'agent-neutral'. It does not matter who performs the good act; the universe just needs the good to be done. If lying saves a life, a utilitarian lies. The moral integrity of the liar is irrelevant compared to the saved life.

  Buddhism is 'agent-relative' regarding spiritual progress. The path is about transforming *your* mind to eradicate defilements (*kilesas*).
  *   **The Break:** A Buddhist might refrain from a 'useful' lie because the act of lying reinforces greed, hatred, or delusion *in the liar*, damaging their potential for liberation. The focus is on the purity of the instrument (the mind), not just the product (the outcome).
  *   **Ethical Significance:** High. This makes Buddhist ethics inherently self-regarding in a way utilitarianism forbids. You cannot sacrifice your own spiritual purity for the 'greater good' in the same way a utilitarian sacrifices their comfort.

  #### C. The Definition of 'The Good'
  Utilitarianism typically defines 'good' as the satisfaction of preferences or the experience of pleasure (hedonic or otherwise).

  Buddhism defines the ultimate good (*Nibbāna*) as the *extinguishing* of craving.
  *   **The Break:** From a utilitarian view, the cessation of all feeling (in some interpretations of Nirvana) or the radical reduction of desire could look like a negative utility. Furthermore, Buddhism posits that 'worldly happiness' is ultimately *dukkha* (unsatisfactory). A utilitarian wants to maximise 'happy moments'; a Buddhist wants to see through the illusion that 'happy moments' constitute lasting welfare.
  *   **Ethical Significance:** Medium-High. It changes the target of the ethical calculus.

  #### D. Special Obligations
  Consequentialism is radically impartial. Your mother counts for no more than a stranger in the moral calculus.

  Buddhism acknowledges *katannu* (gratitude) and specific duties to parents, teachers, and the Sangha.
  *   **The Break:** While universal compassion is the ideal, the *Mangala Sutta* and *Sigalovada Sutta* outline specific reciprocal duties. Ignoring your parents to go save strangers might be utilitarian, but it would be considered unskilful (*akusala*) in Buddhism because it violates the natural order of gratitude.
  *   **Ethical Significance:** Medium. It shows Buddhism is not purely impartialist.

  ### 3. Metaphysics vs. Ethics: Why Your Friend is Wrong

  Your friend argues the tension is metaphysical (rebirth). This is a category error.

  Even if you remove rebirth (as many Secular Buddhists do), the ethical structure remains non-consequentialist.
  *   **Without Rebirth:** Karma becomes immediate psychological conditioning. Lying makes you a deceitful person *now*, not just in a future life.
  *   **The Ethical Core:** The disagreement is not about *when* the consequences happen (next life vs. now); it is about *what constitutes the moral act*. Is it the external result (Consequentialism) or the internal volition and character development (Buddhism)?

  Therefore, the tension is **structural**, not metaphysical.

  ### 4. A Better Analogy: Virtue Ethics (with Soteriological Aims)

  If you need to offer your group an alternative framework, **Virtue Ethics** (specifically Aristotelian or Humean, adapted) is the standard academic counter-proposal. Scholars like Damien Keown (*The Nature of Buddhist Ethics*) argue strongly for this.

  **The Mapping:**
  *   **Eudaimonia (Flourishing)** $\leftrightarrow$ **Nibbāna (Liberation)**. Both are the ultimate telos (end goal).
  *   **Virtues (*Arete*)** $\leftrightarrow$ **Pāramīs (Perfections)**. Qualities like generosity, patience, and wisdom are cultivated for their own sake, not just as tools.
  *   **Practical Wisdom (*Phronesis*)** $\leftrightarrow$ **Paññā (Wisdom)**. The ability to discern the right action in context, rather than following a rigid formula.
  *   **Habituation** $\leftrightarrow$ **Bhāvanā (Mental Cultivation)**. Ethics is about training the mind through repetition, not calculating outcomes.

  **Why this fits better:**
  1.  **Focus on Character:** Like Virtue Ethics, Buddhism asks "What sort of person should I be?" rather than "What should I do?".
  2.  **Intrinsic Value:** Virtues are good in themselves because they reflect a mind free from defilement, not merely because they produce good results.
  3.  **Context Sensitivity:** Both systems recognise that rules (precepts/laws) require wisdom to apply correctly in complex situations.

  **The Caveat:**
  Buddhism is not *exactly* Aristotelian virtue ethics. Aristotle wanted to flourish *in the world*; Buddhism seeks liberation *from the cycle*. A more precise label might be **Soteriological Virtue Ethics**. The 'virtues' are instrumental to salvation, but they are cultivated as intrinsic qualities of the mind.

  ### 5. Summary for Your Group

  To articulate your suspicion properly, you might say something like this:

  > "Treating Buddhism as consequentialism conflates the *goal* (reducing suffering) with the *method* (calculating outcomes). In utilitarianism, a well-intentioned failure is a moral wrong. In Buddhism, a well-intentioned failure is wholesome karma, because *cetanā* (intention) is the primary ethical metric.
  >
  > Furthermore, consequentialism is agent-neutral; it doesn't care who does the good. Buddhism is deeply concerned with the moral hygiene of the agent. We follow precepts not just to manage external welfare, but to stop poisoning our own minds with greed and aversion. The disagreement isn't about whether rebirth exists; it's about whether ethics is a ledger of results or a therapy for the will."

  **Verdict:** The analogy is useful for introductory comparisons of *scope*, but it fails as a description of *moral reasoning*. Your intuition regarding intention and agent-transformation is the correct philosophical lever to pull.
