          *   *View B (Prescriptive/Normative):* Ethically, $\delta$ should be zero. We shouldn't discriminate based on date of birth. (Stern style).
          *   *Resolution:* The practice *allows* for $\delta = 0$, but often agencies use $\delta > 0$. So the practice *itself* doesn't mandate discrimination, but specific *choices* of rates often imply it.

      *   **Part 3: The "Broken Arm" Analogy (Utility vs. Consumption):**
          *   If we discount *utility* (welfare/pain), that implies future suffering matters less. Most ethicists reject this.
          *   If we discount *monetary equivalents*, it's because money buys less welfare for rich people. If future people are richer, the *money* value of fixing the arm is lower, even if the *pain* is equal.
          *   *Settled:* Most economists agree we should not discount *utility* purely due to time.
