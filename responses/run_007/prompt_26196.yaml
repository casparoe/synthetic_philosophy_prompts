prompt: |-
  I'm a clinical ethicist at a teaching hospital, I work maybe four or five consults a week — end-of-life stuff, treatment refusals, the occasional resource fight. And I keep running into the same basic problem: when am I supposed to treat someone else's moral judgment as something I should just defer to, the way I'd defer to a cardiologist about an ECG? 

  Sometimes its obvious. A patients family understands what the patient would have wanted better than I do — that seems like a straightforward case for deference. Other times it feels like moral deference is just a category mistake, like I'm outsourcing the very thing I was consulted to do. And then there's the murky middle: the attending who's been doing this for thirty years and has deeply settled views about, say, truth-telling. He's thought about it more than I have. Does that make him a moral expert I should defer to? Or is moral expertise not like that?

  I want you to write me a decision procedure I can actually use — a sequence of questions I can run at 2 AM, that ends in one of three outputs: defer, don't defer, or escalate to the full committee. I need it to distinguish at least three kinds of thing people might be offering me:
  - knowledge of values (the family knows the patient)
  - moral reasoning or argument (someone's thought harder or longer)
  - moral perception (the nurse who's been bedside sees something I'm missing)

  Then apply it to two cases. First: a family demands we keep going with aggressive treatment that the whole team agrees is futile; the family says they know the patient would want everything tried. Second: an attending with a thirty-year career tells me it is categorically wrong to conceal a terminal diagnosis even when the family, for cultural reasons, is begging us not to disclose it, and he expects me to back him.

  Flag where the procedure is most likely to give the wrong answer, and tell me what kind of case would make you substantially revise it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Clinical ethicist at a teaching hospital (4-5 consults/week).
      *   **Problem:** When to defer to others' moral judgments vs. when to assert independent ethical analysis. Distinguishing between moral expertise and other forms of expertise.
      *   **Goal:** A practical decision procedure (sequence of questions) usable at 2 AM.
      *   **Outputs:** Defer, Don't Defer, Escalate to Committee.
      *   **Distinctions Required:** Knowledge of values (family), Moral reasoning/argument (experienced clinician), Moral perception (bedside nurse).
      *   **Application:** Apply to two specific cases (Futile treatment/Family demands vs. Truth-telling/Cultural norms).
      *   **Critique:** Flag likely failure points and conditions for revision.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Moral Deference:* Is there such a thing as a "moral expert"? In clinical ethics, expertise is usually procedural (process, frameworks, law/policy) rather than substantive (knowing the "right" answer better than others).
      *   *Epistemic Authority:* Who knows what?
          *   Family $\rightarrow$ Patient's specific values/history.
          *   Clinicians $\rightarrow$ Medical facts, prognosis, workflow realities.
          *   Ethicist $\rightarrow$ Normative frameworks, consistency, policy, mediation.
      *   *The Trap:* Deferring on *facts* (prognosis) is easy. Deferring on *values* (what ought to be done) is the danger zone.

  3.  **Drafting the Decision Procedure (The "2 AM Algorithm"):**
      *   Needs to be quick, actionable, and structured.
      *   *Step 1: Identify the Claim.* What kind of authority are they claiming? (Fact, Value, Perception).
      *   *Step 2: Assess Competence/Access.* Do they actually have access to the information they claim?
      *   *Step 3: Check for Harm/Policy.* Does deferring violate core constraints (law, policy, non-maleficence)?
      *   *Step 4: Determine Output.*

      *Refining the Distinctions:*
      *   *Knowledge of Values:* Family knows the *person*, not necessarily the *principle*. Defer on "what would they want," don't defer on "what is ethically permissible."
      *   *Moral Reasoning:* Experience $\neq$ Ethics. Defer on clinical judgment, don't defer on normative justification.
      *   *Moral Perception:* The "gut check." Defer on *observation*, don't defer on *interpretation*.

      *Drafting the Questions (Iterative Process):*
      *   Q1: Is this a claim about medical fact or patient history? (If yes, defer to expert/family).
      *   Q2: Is this a claim about what *ought* to be done? (If yes, proceed).
      *   Q3: Is the claim based on unique access (bedside time, intimate history)? (If yes, weigh heavily).
      *   Q4: Does the claim violate policy/law/harm thresholds? (If yes, don't defer).
      *   Q5: Is there reasonable disagreement? (If yes, escalate).

      *Let's make it tighter.* I'll structure it as a "Triage Protocol for Moral Authority."

  4.  **Developing the Cases:**
      *   *Case 1 (Futility/Family):* Family claims knowledge of values. Team claims medical futility.
          *   Application: Family has epistemic authority on *values*, but not on *medical indication*. If treatment is truly futile (physiologically impossible), ethics can't override physics. If it's "qualitative futility," that's a value judgment.
          *   Verdict: Likely "Don't Defer" on the *decision* to treat, but "Defer" on the *understanding* of the patient. Might need Escalate if conflict persists.
      *   *Case 2 (Truth-Telling/Culture):* Attending claims moral principle (autonomy/truth). Family claims cultural value (protection).
          *   Application: Attending has experience, but is asserting a universal principle. Family has cultural context. Ethicist must weigh autonomy vs. harm.
          *   Verdict: "Don't Defer" to the attending's absolutism. "Defer" to the family's cultural insight *if* it doesn't violate patient's known wishes. Likely "Escalate" if stalemate.

  5.  **Critiquing the Procedure (The "Flagging" Section):**
      *   Where does this fail?
      *   *Implicit Bias:* The procedure assumes the ethicist can neutrally judge "harm" or "policy."
      *   *Power Dynamics:* An attending can bully an ethicist. The procedure doesn't stop that.
      *   *Time:* 2 AM is hard for "Escalate."
      *   *Moral Distress:* Sometimes the right answer causes burnout.

  6.  **Refining the Output:**
      *   Tone: Professional, peer-to-peer, pragmatic, philosophically grounded but not academic.
      *   Structure:
          1.  Introduction (acknowledging the difficulty).
          2.  The Protocol (The 5-Step Filter).
          3.  Definitions of the Three Claims.
          4.  Case Applications.
          5.  Limitations & Revision Criteria.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure I don't confuse "deferring to medical judgment" with "deferring to moral judgment." The prompt asks specifically about *moral* deference.
      *   *Clarification:* Distinguish between deferring to the *input* (information) vs. the *conclusion* (decision).
      *   *Nuance:* In Case 1, "futility" is a loaded term. I need to address that.
      *   *Nuance:* In Case 2, "cultural reasons" need to be verified, not just asserted.

  8.  **Final Review against constraints:**
      *   3 Outputs? Yes.
      *   3 Distinctions (Values, Reasoning, Perception)? Yes.
      *   2 Cases applied? Yes.
      *   Flag failure points? Yes.
      *   Revision criteria? Yes.

      *(Self-Correction on the "2 AM" constraint)*: A full committee escalation isn't possible at 2 AM. I need to note that "Escalate" means "Punt to morning/Admin on-call" effectively. I will clarify that in the protocol.

      *(Refining the "Moral Expertise" concept)*: I need to be clear that clinical ethicists are experts in *process*, not necessarily *truth*. This is a key distinction for the user.

      *(Final Polish)*: Ensure the tone respects the user's expertise. They know the theory; they want a tool.

      *(Wait, one more thing)*: The prompt asks to distinguish the three kinds of things people offer. I should make sure the decision procedure explicitly routes based on these types. I will add a "Classification Step" at the beginning.

      *(Let's build the procedure)*:
      Step 1: Classify the Claim (Values, Reasoning, Perception).
      Step 2: Verify Access (Do they actually know this?).
      Step 3: Check Constraints (Law/Policy/Harm).
      Step 4: Decide.

      Okay, ready to write.

      *(Wait, looking at Case 2 again)*: The attending says it is *categorically wrong*. This is a deontological claim. The family is asking for nondisclosure (often consequentialist or relational autonomy). The ethicist needs to decide if the attending's "expertise" grants him moral authority. The answer should be no, but his clinical judgment on *capacity* or *harm* matters. I need to be precise there.

      *(Looking at Case 1 again)*: "Futile" is the keyword. If physiologically futile, ethics doesn't matter. If qualitatively futile, it's a value clash. I will assume "qualitative" for the ethical dilemma to exist.

      *(Final check on "Escalate")*: At 2 AM, escalation is to the Administrator on Call or Ethics Chair, not the "full committee." I will clarify this practical limitation.

      Okay, proceeding with generation.cw
answer: |-
  This is the central tension of clinical ethics: you are hired for your expertise in *normative reasoning*, yet you constantly encounter people with superior expertise in *particulars* (the family), *clinical reality* (the attending), or *situational awareness* (the nurse).

  The mistake most ethicists make is treating moral deference as a binary switch. It isn't. You never defer on the *final normative conclusion* (that is your job), but you must defer on the *premises* that feed that conclusion.

  Here is a triage protocol designed for high-fatigue, high-stakes environments. It distinguishes between deferring to **data** (which you should do) and deferring to **judgment** (which you rarely should).

  ### The "Moral Authority Triage" Protocol (2 AM Version)

  **Step 1: Classify the Claim**
  What kind of authority is the interlocutor claiming?
  *   **Type A (Knowledge of Values):** "I know what the patient would want." (Family/Surrogates)
  *   **Type B (Moral Reasoning):** "I know what the right thing to do is, based on principle/experience." (Attending/Senior Staff)
  *   **Type C (Moral Perception):** "I see suffering/nuance you aren't seeing." (Bedside Nurse/Social Work)

  **Step 2: Verify Epistemic Access**
  Does this person have unique access to the facts required to make this claim?
  *   *For Type A:* Do they have a history of reliable knowledge about the patient? (Not just biological relation).
  *   *For Type B:* Is their reasoning based on medical facts you lack, or purely normative principles?
  *   *For Type C:* Have they spent significant time at the bedside in the last 24 hours?

  **Step 3: Check Hard Constraints**
  Does accepting this claim violate:
  *   Law/Regulation?
  *   Hospital Policy?
  *   The "Harm Threshold" (would this cause clear, immediate, non-beneficial harm)?

  **Step 4: Determine Output**
  *   **DEFER:** If Claim is Type A or C **AND** Epistemic Access is verified **AND** no Hard Constraints are violated. (You accept their input as fact, but you still own the decision).
  *   **DON'T DEFER:** If Claim is Type B **OR** Hard Constraints are violated. (You acknowledge their view but proceed with independent ethical analysis).
  *   **ESCALATE:** If Type A conflicts with Type B **OR** there is reasonable disagreement among staff **OR** the stakes involve irreversible harm without clear precedent. *(Note: At 2 AM, "Escalate" means "Admin on Call + Ethics Chair notification," not full committee).*

  ---

  ### Distinguishing the Three Claims

  To use the protocol, you must rigorously categorize what is being offered you.

  1.  **Knowledge of Values (The Family):**
      *   *Nature:* Empirical claim about a specific person's history.
      *   *Deference Rule:* High deference on *preferences*, zero deference on *permissibility*. They are the experts on the patient, not on bioethics.
  2.  **Moral Reasoning (The Attending):**
      *   *Nature:* Normative claim about duty or outcome.
      *   *Deference Rule:* Low deference. Clinical experience correlates with clinical skill, not necessarily ethical rigor. "I've done this for 30 years" is an appeal to tradition, not moral authority.
  3.  **Moral Perception (The Nurse):**
      *   *Nature:* Phenomenological claim about the current reality.
      *   *Deference Rule:* High deference on *observation*, moderate on *interpretation*. If they say "the patient looks distressed when you mention this," believe them. If they say "therefore we must stop," that is a reasoning claim (see Type B).

  ---

  ### Case Applications

  #### Case 1: The "Futile" Treatment Demand
  **Scenario:** Family demands aggressive care. Team says futile. Family claims they know the patient "would want everything tried."

  *   **Step 1 (Classify):** Type A (Knowledge of Values). The family is claiming access to the patient's prior wishes.
  *   **Step 2 (Access):** Do they have evidence? (Prior conversations, advance directives, consistent religious/cultural history). If yes, access is verified.
  *   **Step 3 (Constraints):** Here is the pivot. Define "Futile."
      *   *Physiologically Futile (e.g., CPR on a decapitated patient):* This violates medical reality. Hard Constraint.
      *   *Qualitatively Futile (e.g., permanent vegetative state):* This is a value judgment, not a medical fact. No Hard Constraint.
  *   **Step 4 (Output):**
      *   If *Physiological*: **DON'T DEFER.** You cannot ethically authorize a medically impossible act.
      *   If *Qualitative*: **ESCALATE.** You have a Type A claim (Family values) clashing with a Type B claim (Team judgment on benefit). This is a classic conflict requiring process protection.
      *   *Nuance:* You **DEFER** to the family on the premise that "the patient valued survival at all costs." You **DO NOT DEFER** on the conclusion that "we must therefore provide non-beneficial antibiotics." You might instead authorize a time-limited trial to honor the value without violating medical integrity.

  #### Case 2: The Truth-Telling Standoff
  **Scenario:** Attending (30 years exp) says concealing diagnosis is categorically wrong. Family (cultural reasons) begs for nondisclosure.

  *   **Step 1 (Classify):**
      *   Attending: Type B (Moral Reasoning). He is asserting a universal principle (Autonomy/Truth).
      *   Family: Type A (Knowledge of Values/Cultural Context). They are asserting what protects the patient's well-being within their framework.
  *   **Step 2 (Access):**
      *   Attending: Has clinical access, but no special access to the *moral truth* of this culture.
      *   Family: Has high access to cultural norms and patient's relational context.
  *   **Step 3 (Constraints):** Does nondisclosure violate law (informed consent) or cause immediate harm (preventing advance care planning)?
      *   If the patient has capacity: Law requires disclosure. Hard Constraint.
      *   If the patient lacks capacity/surrogate decision making: Cultural norms often allow "protective nondisclosure." No Hard Constraint.
  *   **Step 4 (Output):** **DON'T DEFER (to the Attending).**
      *   *Reasoning:* The attending is claiming moral expertise ("categorically wrong"). This is a Type B claim. His 30 years of experience do not make him an expert in this family's cultural ethics.
      *   *Action:* You defer to the Family's *information* about the culture (Type A), but you do not defer to their *request* automatically. You mediate.
      *   *Resolution:* You likely advise the attending to explore *why* the family wants this. Is it to preserve hope? To protect the patient from despair? You might agree to a staged disclosure. You reject the Attending's absolutism, but you do not simply do what the family asks. You own the ethical path.

  ---

  ### Where This Procedure Will Fail (The Flags)

  **1. The "Policy as Morality" Trap**
  *   *Failure Point:* Step 3 (Hard Constraints).
  *   *Risk:* Hospital policy is often risk-management, not ethics. If you treat policy as a moral hard constraint, you become a compliance officer, not an ethicist.
  *   *Example:* Policy says "Family cannot be in room during code." Ethics might say "Compassionate presence is required." If you defer to policy, you fail the patient.
  *   *Fix:* Distinguish "Legal/Regulatory" (True Constraints) from "Administrative/Policy" (Negotiable Constraints).

  **2. The Power Differential Blind Spot**
  *   *Failure Point:* Step 2 (Verify Access).
  *   *Risk:* At 2 AM, an aggressive Attending (Type B) can intimidate an ethicist into treating their opinion as a medical fact. "If you don't back me, the patient dies on my watch."
  *   *Example:* Case 2. The attending frames truth-telling as a medical safety issue rather than a moral one.
  *   *Fix:* If the "medical fact" being presented is actually a value judgment dressed up as physiology (e.g., "Telling him will kill him"), force a second opinion or Escalate immediately.

  **3. The "Escalate" Void**
  *   *Failure Point:* Step 4 (Escalate).
  *   *Risk:* At 2 AM, there is no committee. There is only an Administrator on Call (AOCA) who cares about liability, not ethics.
  *   *Fix:* Redefine "Escalate" in the night context to mean "Document dissent + Notify Chair by 8 AM + Maintain Status Quo." Do not use "Escalate" to mean "Let the AOCA decide."

  ### When to Substantially Revise This Procedure

  I would discard this algorithm if you encounter a case involving **Systemic Injustice**.

  This procedure assumes a baseline where the hospital, the staff, and the family are operating in good faith within a just system. It fails if:
  *   **The Policy is Unjust:** If the "Hard Constraint" (e.g., insurance authorization, visitation rules) is itself the source of the ethical harm.
  *   **The "Expertise" is Biased:** If the Attending's "30 years of experience" includes documented patterns of bias against certain demographics (e.g., pain management in minority patients). In this case, Type B claims (Reasoning) must be treated as hostile, not expert.
  *   **Resource Allocation:** If the "Futility" case is actually a "Resource Scarcity" case (e.g., only one ICU bed left), this procedure breaks because it treats medical indication as the only variable.

  In those scenarios, you cannot run a triage algorithm. You must shift from *consultative ethics* to *advocacy ethics*. The goal is no longer "resolution," it is "witness and disruption." If you find yourself consistently flagging cases for revision due to systemic bias, your job description has changed, and this tool will no longer suffice.
