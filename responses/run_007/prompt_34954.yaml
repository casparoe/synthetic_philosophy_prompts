  - A surgeon amputates a limb without consent to save an unconscious patient's life: permissible
  - A surgeon amputates a limb against a competent patient's explicit refusal: wrong
  - Torturing a terrorist to find a ticking time bomb: wrong
  - Tackling a stranger to stop them from stepping into traffic: permissible
  - Deceiving research participants about a study's purpose (with full debriefing afterward): permissible
  - Lying to a dementia patient that they're at home when they're in a care facility, to keep them calm: she says this is wrong

  I'm especially stuck on the last one because it seems a lot like the research deception case to me, but she insists they're different.

  Our new case: a doctor gives a patient a placebo and tells them it's a real medication. The patient improves. The doctor didn't ask for consent to this specific deception, though the patient consented to treatment generally. The condition isn't life-threatening but it seriously affects quality of life.

  What do you think she'll say about the placebo case, and what rule or approach is she actually running? I can think of at least two theories that fit her verdicts so far, and I'm curious which one you think is more likely and what further case would settle it.

  Keep it to 400 words max.
