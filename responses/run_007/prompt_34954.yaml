  The dementia case is the key differentiator. She marks it wrong because the deception is permanent; the patient's agency is never restored, treating them merely as a means to calmness. Research deception is permissible because debriefing restores the participant's autonomy. The surgeon cases confirm that competent refusal is absolute, while unconscious care relies on presumed consent for life-saving measures.

  **Verdict on Placebo:** She will say **Wrong**.
  Like the dementia case, this involves deception without specific consent and no plan to restore full information. Unlike the Nazi case, the condition isn't life-threatening, so the "Harm Prevention" override doesn't trigger. The benefit (quality of life) does not outweigh the violation of informed consent.

  **Distinguishing Theories:**
  You are likely weighing **Rule Utilitarianism** against **Autonomy-Based Deontology**. Both fit your data, but they diverge on *why* the dementia case is wrong (bad societal rules vs. rights violation). To settle this, propose the following case:

  *"A doctor gives a placebo without initial consent but promises to reveal the deception after treatment ends."*

  If she says **Permissible**, her rule is about **Restoring Autonomy** (matching the research case). If she says **Wrong**, her rule is stricter: **Specific Consent is Required** regardless of future disclosure. This isolates whether the moral violation is the lie itself or the permanent loss of agency, clarifying why she distinguishes research from dementia care.
