prompt: |-
  I'm a software engineer who owns the ranking layer on a recommender, and last month I got burned because our consensus ranking of a set of items flipped around depending on which third item happened to be in the candidate pool, which sent me down the Arrow's impossibility theorem rabbit hole. Restate Arrow's theorem in the vocabulary I actually think in — pairwise comparators, score aggregation, rank aggregation, objective functions like Kemeny distance, tie-breaking, Condorcet cycles, and independence of irrelevant alternatives treated as a caching or modularity property — as faithfully as you can. Then do the residue report: which parts of the theorem translate cleanly into rank-aggregation terms, which parts you had to strech to fit, and which parts have no counterpart at all in how I think about merging preferences. Then give me a verdict: is Arrow saying our ranker is mathematically doomed, or is it a theorem about something narrower — ordinal ballots, no interpersonal comparisons, one true social ordering — that my system is allowed to sidestep? I want to know whether my intuition that its just the impossibility of a perfect merge is right, or whether my vocabulary is quietly missing the whole normative point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software Engineer, owns the ranking layer of a recommender system.
      *   **Problem:** Experienced a ranking flip (instability) based on the presence/absence of a third item (violating Independence of Irrelevant Alternatives - IIA). Went down the Arrow's Impossibility Theorem rabbit hole.
