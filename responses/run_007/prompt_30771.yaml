answer: |-
  Here is the translation of Arrow's Impossibility Theorem into the vocabulary of a ranking engineer, followed by the residue report and the verdict on your system.

  ### 1. Arrow's Theorem: The Engineering Spec

  Imagine you are writing a generic `RankAggregator` class. It takes a set of `Candidate` items and a list of `SignalProvider` objects (your "voters"). Each `SignalProvider` exposes a `compare(A, B)` method that returns an ordinal preference (A > B, B > A, or A == B), but **does not expose magnitude** (no scores, no logits, just pairwise ordering).

  Your goal is to implement `get_final_ranking(candidates, signals)` that returns a sorted list.

  **The Requirements (The Axioms):**

  1.  **Unrestricted Domain (Input Agnosticism):** Your aggregator must not crash or throw `InvalidPreferenceError` regardless of what orderings the `SignalProvider`s return. You cannot assume the signals will be consistent or follow a specific distribution. You must handle any possible combination of pairwise outputs.
  2.  **Non-Dictatorship (No Hardcoded Override):** You cannot simply ignore $N-1$ signals and return the ordering of `signals[0]`. The logic must structurally incorporate input from all providers.
  3.  **Pareto Efficiency (Consensus Respect):** If `signals[i].compare(A, B) > 0` for **all** $i$, then your `final_ranking` must place A before B. You cannot overrule unanimous consensus.
  4.  **Independence of Irrelevant Alternatives (Modularity / Cacheability):** The relative ordering of A and B in the final output must depend **only** on how the signals rank A and B.
      *   *Engineering implication:* You should be able to compute `score(A)` and `score(B)` in isolation (or in different shards) and merge them later.
      *   *The Violation:* If adding Item C to the candidate pool changes the relative sort order of A and B, you have violated IIA. This breaks sharding, makes caching impossible, and introduces the instability you saw last month.

  **The Theorem:**
  If your `SignalProvider`s only return **ordinal** comparisons (no scores), and you have 3 or more candidates, **there is no deterministic `RankAggregator` implementation** that satisfies all four requirements simultaneously.

  If you enforce Unrestricted Domain, Non-Dictatorship, and Pareto, you **will** encounter Condorcet Cycles (A > B > C > A) or IIA violations (the ranking of A vs B flips when C enters the pool). You cannot write a comparator that is both consistent (transitive) and modular (IIA-compliant) under these constraints.

  ---

  ### 2. Residue Report

  Here is where the political science math maps cleanly to your stack, and where the abstraction leaks.

  #### Clean Translations
  *   **IIA $\rightarrow$ Modularity/Sharding:** This is the strongest mapping. In distributed ranking, you often score items in parallel shards and merge. If your merge logic violates IIA, you cannot shard. The presence of Item C in Shard 2 shouldn't change the A-vs-B decision in Shard 1. Arrow proves that for ordinal data, perfect modularity is impossible without dictatorship.
  *   **Pareto $\rightarrow$ Consensus Guards:** This maps directly to "safety rails." If every model (CTR, CVR, Quality) says an item is spammy or low quality, the ranker should never promote it.
  *   **Transitivity $\rightarrow$ Sort Stability:** Your final list must be sortable. If your aggregation logic produces a cycle (A > B, B > C, C > A), your `sort()` function will throw or produce undefined behavior depending on the language runtime.

  #### Stretched Fits
  *   **Voters $\rightarrow$ Signals:** In Arrow's theorem, voters are autonomous agents with rights. In your system, signals are engineered features. You *can* fire a signal. You *can* weight them. The "Non-dictatorship" constraint is artificial in engineering; you often *want* a "dictator" (e.g., a Safety Filter that overrides everything).
  *   **Unrestricted Domain $\rightarrow$ Model Output Bounds:** Arrow assumes voters can produce *any* permutation. Your models produce outputs constrained by training data and architecture. You rarely see "adversarial" preference profiles in production unless your models are broken.

  #### No Counterpart (The Missing Pieces)
  *   **Cardinality (Scores vs. Ranks):** This is the biggest gap. Arrow assumes **ordinal** inputs (A > B). Most modern recommenders use **cardinal** inputs (Score A = 0.8, Score B = 0.7). If you have magnitude, you can use Weighted Sums or Learning-to-Rank (LambdaMART), which bypass Arrow entirely.
  *   **Ground Truth Utility:** Arrow seeks a "social welfare function" that reflects the "will of the voters." Your ranker seeks to optimize a specific **Objective Function** (e.g., Watch Time, Revenue). If flipping A and B when C is present increases global Watch Time, your system *should* do it. Arrow calls this a violation; your business calls it optimization.
  *   **Interpersonal Comparison:** Arrow forbids comparing the "strength" of preference between voters. In recsys, you explicitly compare signal strength (e.g., "The CTR model is more confident than the Freshness model").

  ---

  ### 3. The Verdict

  **Is your ranker mathematically doomed?**
  **No.**

  **Why?**
  Arrow's Impossibility Theorem applies to **ordinal** aggregation without **interpersonal comparison of utility**.

  1.  **You Likely Use Cardinal Scores:** If your ranking layer merges logits, probabilities, or normalized scores (e.g., `0.2 * CTR + 0.8 * CVR`), you are not operating in Arrow's domain. You are using a **Borda Count** variant or a linear combination. These methods satisfy IIA *relative to the scores*, provided the scores themselves are context-independent.
  2.  **You Have a Defined Objective:** Arrow tries to find a "fair" consensus. You are trying to maximize a loss function. If the "flip" you experienced (A > B without C, but B > A with C) resulted in higher engagement, it wasn't a bug—it was a feature of context-dependent optimization (e.g., diversity or substitution).
  3.  **You Are Allowed to be a Dictator:** You can explicitly weight signals. If the CTR model is 10x more important than the Diversity model, that is a "weighted dictatorship," which Arrow explicitly excludes but engineering embraces.

  **However, your intuition is partially right.**
  The instability you saw last month suggests one of two things:

  1.  **Normalization Artifacts:** If you are normalizing scores (e.g., MinMax scaling) across the candidate pool *before* ranking, you have introduced a dependency on the candidate set. $Score'(A) = \frac{Score(A) - min(Pool)}{max(Pool) - min(Pool)}$. If $C$ enters the pool and becomes the new $max$, $Score'(A)$ changes. This violates IIA. This is an engineering choice, not a mathematical inevitability.
  2.  **Pure Ordinal Merging:** If you are literally merging ranked lists without scores (e.g., using Reciprocal Rank Fusion or voting), you are indeed in Arrow's territory. In this case, **instability is a feature of the algorithm, not a bug.** You cannot guarantee IIA with RRF or Borda without introducing scores.

  **Actionable Advice:**
  *   **If you need Stability (IIA):** Move to cardinal scoring. Ensure scores are absolute (not normalized against the batch) so `score(A)` is constant regardless of whether `C` is present.
  *   **If you need Optimization:** Accept the IIA violation. Contextual ranking (where the value of A depends on the presence of B and C) is often necessary for diversity and user satisfaction. Just document that the ranking is **non-compositional** and cannot be trivially sharded.

  **Summary:** Arrow proves you can't have a perfect, fair, modular, ordinal democracy. You aren't running a democracy; you're running an optimization engine. You can sidestep the theorem by using scores (cardinality) and explicit weighting (dictatorship), but you must pay for it with either the complexity of score calibration or the acceptance of context-dependent ranking behavior.
