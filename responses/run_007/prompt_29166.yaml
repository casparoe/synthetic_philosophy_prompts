answer: |-
  Dear friend,

  It is a pleasure to engage with you on this topic, as superrationality remains one of the most provocative and elegant ideas in the landscape of decision theory. You have articulated the core intuition perfectly: when faced with a symmetric problem and a symmetric counterpart, treating the other's move as fixed while varying your own seems to ignore the logical link between your reasoning processes. However, since you asked for a stress test, I will lay out the objections that have been raised against this view, ranging from those that threaten to dismantle the theory entirely to those that merely complicate its application. I will also try to indicate where defenders of the view stand firm and where they might concede ground, as well as address the worry about unfalsifiability.

  The most severe objection, which many critics consider fatal, is the charge of causal magic. Standard causal decision theory insists that my choice cannot physically influence the choice of another player who is spatially separated and unable to communicate with me. If I switch from cooperation to defection in a one-shot prisoner's dilemma, the physical state of my twin's brain does not change as a result of that switch. Therefore, critics argue, superrationality conflates correlation with causation. It assumes that by choosing a strategy, I am somehow selecting the output of a similar algorithm elsewhere, which looks like magical thinking from a physicalist perspective. Defenders of superrationality, particularly those working in modern frameworks like Functional Decision Theory, do not concede this point. They argue that the objection begs the question by assuming a causal model that is too narrow. They contend that rationality is about controlling the output of your decision algorithm, and since the twin runs the same algorithm, choosing the output logically entails the twin's output. They would say the causal objection misses the point entirely because it ignores logical counterfactuals. However, for anyone committed to a strict physicalist causality, this remains a hard stop that renders the theory incoherent.

  Slightly less fatal but formally troubling is the problem of symmetry breaking. Superrationality relies heavily on the assumption of perfect symmetry in reasoning and information. In the real world, perfect symmetry is virtually non-existent. There is always noise, slight differences in processing speed, or indexical uncertainty about which player is which. Formal analyses suggest that superrational reasoning can be extremely fragile; if the correlation between players is less than perfect, the prescription to cooperate can collapse rapidly back into standard defection. Some defenders concede that the theory requires a high threshold of similarity to function, admitting that it is not a robust solution for noisy environments. Others argue that the theory should be qualified to handle probabilistic correlations, but this leads to complex calculations that often yield results indistinguishable from standard evidential decision theory, blurring the unique appeal of superrationality. This is a significant vulnerability because it limits the theory to idealized thought experiments rather than practical application.

  A third objection concerns exploitation and scope. Superrationality performs beautifully against other superrationalists, but poorly against standard rational agents. If I know my counterpart is a standard game-theoretic rationalist who will defect regardless of my reasoning, superrationality might still prescribe cooperation if I mistakenly believe we are symmetric reasoners, leading to the sucker's payoff. Even if I know they are not superrational, the theory must explain why I should not revert to standard defection. Defenders readily concede this point, acknowledging that superrationality is not a universal dominant strategy but rather a specific protocol for a specific class of interactions. They argue this is not a flaw but a feature, similar to how a contract is only binding on those who sign it. However, this concession limits the theory's ambition. It transforms superrationality from a general account of rational choice into a niche strategy for a rare class of problems, which some critics find awkward for a theory claiming to define rationality itself.

  Moving to empirical findings, the evidence from experimental game theory is mixed and arguably inconclusive. People do cooperate in one-shot prisoner's dilemmas more often than standard theory predicts, which superrationalists cite as validation. However, psychologists and behavioral economists offer alternative explanations that do not require superrational logic, such as social norms, altruistic preferences, or confusion about the game structure. If cooperation can be explained by a preference for fairness rather than a logical deduction about symmetry, then superrationality is not necessary to explain the data. Defenders might dismiss this by saying that normative theories are not falsified by descriptive data; just because people cooperate for the wrong reasons does not mean superrationality is the wrong reason. Yet, this creates an awkward disconnect where the theory claims to describe rational choice but cannot be distinguished empirically from irrational heuristics or social conditioning.

  There are also philosophical objections regarding agency and the nature of choice. Superrationality implies that once the reasoning process is fixed, the choice is determined. If I am truly symmetric with my twin, I cannot choose differently than them. This raises a worry about the illusion of choice. If my decision is merely the unfolding of a logical necessity shared with another, in what sense am I an agent making a free choice? Some philosophers argue this undermines the concept of agency required for moral responsibility or rational deliberation. Defenders typically adopt a compatibilist stance, arguing that acting according to your own reasoning process is the only meaningful sense of free will, even if that process is deterministic. While this resolves the logical tension, it leaves some with an intuitive discomfort that the theory treats agents as function outputs rather than choosers. This is less a formal defeater and more a philosophical cost that some are willing to pay and others are not.

  Finally, I must address your concern about unfalsifiability. There is a genuine risk that superrationality can be qualified into vacuity. If the theory predicts cooperation and the players defect, a defender can always claim that the symmetry condition was not met or that the players were not truly superrational. If every failure can be explained away by adjusting the conditions of symmetry or reasoning capability, the theory becomes hard to test. Defenders would argue that this is common to all normative theories of rationality. Utilitarianism, for example, is not falsified by people acting selfishly; it prescribes how one should act, not how one does act. However, there is a difference between a normative ideal and a theory that relies on empirical conditions like symmetry to trigger its prescriptions. If the conditions are so stringent that they never obtain, or so vague that they can be retroactively fitted to any outcome, the theory risks losing its explanatory power. I think defenders would concede that clarity on the symmetry condition is crucial to avoid this trap, but they would maintain that the normative force remains even if the empirical instantiation is rare.

  In summary, the causal objection is the most fatal if you reject logical counterfactuals, while the symmetry fragility and exploitation issues are serious limitations that defenders largely accept as boundaries of the theory. The empirical and agency objections are awkward but manageable depending on your philosophical commitments. The risk of unfalsifiability is real but perhaps inherent to normative theorizing, provided the conditions for application are clearly defined. Superrationality remains a compelling lens for symmetric problems, but it requires a willingness to step outside standard causal frameworks and accept that its domain of applicability is narrower than standard game theory. I hope this helps you weigh the costs and benefits of adopting this view.

  Warmly,

  Your assistant
