answer: |-
  # The Consciousness Sorter: A Decision Tree

  This tree is designed to sort your intuitions about conscious experience into named philosophical positions. It begins with the "Cartesian Theater" debate and branches out using empirical cases (Change Blindness, Libet, Color Phi) rather than jargon.

  Follow the path that best matches your intuition.

  ---

  ### **START: The Integration Question**
  **When you have a unified experience (e.g., seeing a red ball move), do you think there is a specific place in the brain, or a precise moment in time, where disparate processing streams come together to create a single, finished representation that *is* the conscious experience?**

  *   **YES:** There is a "finish line" where unconscious processing becomes conscious experience. → **Go to Branch A**
  *   **NO:** Consciousness is distributed, ongoing, or there is no such finish line. → **Go to Branch B**

  ---

  ### **BRANCH A (The "Finish Line" Views)**

  **Node A1: The Ontology Question**
  **At this finish line, is the conscious experience something *over and above* the physical firing of neurons (a non-physical property), or is it identical to the physical process itself?**

  *   **It is non-physical (an extra ingredient):** → **Leaf 1: Property Dualism**
  *   **It is identical to the physical process:** → **Go to Node A2**

  **Node A2: The Change Blindness Question**
  **In "Change Blindness" experiments, subjects miss massive changes in a scene (e.g., a building disappearing) if their attention is disrupted. Does this mean the detailed picture *never existed* in your brain, or that it existed but you couldn't *access* it?**

  *   **It existed, but I couldn't access it (Richness):** → **Leaf 2: Cartesian Materialism**
  *   **It never existed; only what I access is represented (Sparseness):** → **Go to Node A3**

  **Node A3: The Mechanism Question**
  **Is the mechanism at this finish line best described as a specific *biological cause* (like digestion) or a *functional broadcast* (like data on a network)?**

  *   **Biological Cause:** → **Leaf 3: Biological Naturalism**
  *   **Functional Broadcast:** → **Leaf 4: Global Workspace Theory**

  ---

  ### **BRANCH B (The "No Finish Line" Views)**

  **Node B1: The Fundamentality Question**
  **If the brain doesn't generate consciousness at a specific locus, is it because consciousness is already a fundamental feature of all matter, like mass or charge?**

  *   **Yes, it is fundamental:** → **Leaf 5: Panpsychism**
  *   **No, it is an emergent function of complex systems:** → **Go to Node B2**

  **Node B2: The Reality of the "Feel"**
  **When experiments (like Libet's) suggest your conscious intention arises *after* your brain has already initiated action, is the *feeling* of conscious will a genuine neural event that is just misdated, or is it a false user-illusion?**

  *   **It is a false user-illusion:** → **Go to Node B3**
  *   **It is a genuine event (just not central):** → **Go to Node B4**

  **Node B3: The Illusion Strength Question**
  **If the feeling is an illusion, should we say the *impression* of experience is real (but misleading), or that the very concept of "phenomenal consciousness" is a theoretical error to be discarded?**

  *   **Impression is real, property is not:** → **Leaf 6: Illusionism**
  *   **Concept is a theoretical error:** → **Leaf 7: Eliminativism**

  **Node B4: The Structure Question**
  **In cases like the Color Phi phenomenon (where the brain backdates color changes to create smooth motion), is consciousness a stream of competing narrative "drafts," or does it require a separate, higher-order thought *about* the sensory state?**

  *   **Stream of competing drafts:** → **Leaf 8: Multiple Drafts Model**
  *   **Requires a higher-order thought:** → **Leaf 9: Higher-Order Thought (HOT) Theory**

  ---

  ### **THE LEAVES: Positions & Awkward Commitments**

  1.  **Property Dualism:** Consciousness is a real, non-physical property generated by the brain at a specific locus.
      *   *Awkward Commitment:* It struggles to explain how a non-physical property can causally influence physical neurons without violating conservation of energy.
  2.  **Cartesian Materialism:** There is a physical place where experience happens, containing rich details that exceed what we can report.
      *   *Awkward Commitment:* It must explain why Change Blindness occurs if a rich, unified picture is supposedly being maintained at the finish line.
  3.  **Biological Naturalism:** Consciousness is a literal biological feature of the brain, caused by lower-level neurobiological processes.
      *   *Awkward Commitment:* It asserts consciousness is causal but resists explaining *how* it works in computational or functional terms, risking obscurantism.
  4.  **Global Workspace Theory (GWT):** Consciousness occurs when information is broadcast to a global network of cognitive systems, making it accessible for report.
      *   *Awkward Commitment:* It faces the "Hard Problem" of explaining why global access feels like *something* rather than just being a functional data-transfer.
  5.  **Panpsychism:** Consciousness is a fundamental feature of physical reality, and brains merely complexify it rather than create it.
      *   *Awkward Commitment:* It faces the "combination problem," struggling to explain how tiny micro-experiences combine into a unified human mind.
  6.  **Illusionism:** The subjective feeling of "what it's like" is a robust cognitive illusion; there is no phenomenal property, only the mistaken belief in one.
      *   *Awkward Commitment:* It must explain how an illusion can feel so undeniable without presupposing the very phenomenal quality it denies.
  7.  **Eliminativism:** Folk-psychological concepts like "conscious experience" are false theories that will be replaced by neuroscientific vocabulary.
      *   *Awkward Commitment:* It requires denying the existence of the very data (our own experience) that any theory of mind is supposed to explain.
  8.  **Multiple Drafts Model:** There is no central theater; consciousness is the narrative stream resulting from parallel, time-variant editorial processes.
      *   *Awkward Commitment:* It risks implying there is "no one home" to experience the drafts, potentially collapsing into illusionism.
  9.  **Higher-Order Thought (HOT) Theory:** A mental state is conscious only if it is targeted by a separate, higher-order mental state representing it.
      *   *Awkward Commitment:* It implies that animals or infants without sophisticated meta-cognitive abilities may have no conscious experiences at all.

  ---

  ### **META-ANALYSIS: Indistinguishable Pairs & Unoccupied Space**

  **Indistinguishable Pairs**
  *   **Global Workspace Theory vs. Cartesian Materialism:** These two are empirically very difficult to separate. Both posit a physical correlate for consciousness. The split relies entirely on the "Overflow" debate (whether consciousness is richer than access). If future experiments prove access exhausts consciousness, Cartesian Materialism effectively becomes GWT.
  *   **Illusionism vs. Eliminativism:** The structural feature here is semantic rather than empirical. Both deny phenomenal realism. Illusionism keeps the *report* of experience as a valid datum to be explained; Eliminativism rejects the datum. A reader who answers "False user-illusion" at Node B2 may find the split at Node B3 arbitrary.
  *   **Higher-Order Thought vs. Global Workspace:** Both are "access" theories. HOT posits the access is an internal thought; GWT posits it is a system-wide broadcast. Neuroscientifically, these may describe the same mechanism from different levels of abstraction.

  **Unoccupied Regions of Logical Space**
  *   **Non-Physical Distributed Consciousness:** A view that denies a brain locus (Branch B) but claims consciousness is non-physical (Node A1 logic applied to Branch B). This would be a form of "Cosmic Idealism" or dualistic Panpsychism. It is logically coherent but rarely defended in analytic philosophy because it combines the causal problems of Dualism with the combination problems of Panpsychism.
  *   **Rich Distributed Consciousness:** A view that denies a finish line (Branch B) but insists the distributed experience is *rich* (denying the implication of Change Blindness). This is close to **Enactivism**, which argues the richness is in the active engagement with the world, not the internal representation. It occupies a small niche because it requires redefining "representation" entirely.
  *   **The "Hard Problem" Eliminativist:** A view that accepts the Finish Line (Branch A) but claims the experience there is an illusion. This is incoherent; if there is a specific neural state that *is* the experience, and you admit the state exists, you are a Materialist. To call it an illusion, you must deny the state *is* the experience, pushing you back to Branch B.
