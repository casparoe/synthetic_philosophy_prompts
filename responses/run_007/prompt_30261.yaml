  When discussing this with your students, you might highlight that the "Simulation Dampening" argument often suffers from a **base-rate neglect**. Students frequently focus on the fragility of the *simulation* (the 30% slice) while ignoring that the *base reality* (the 70% slice) remains the dominant driver of expected value unless the Simulation Argument specifically predicts doom for base-reality civilizations. The Simulation Argument is not necessarily a defeater for longtermism; depending on how one updates on the "Great Filter," it could be evidence that long, stable futures are physically possible.
