prompt: |-
  I am taking a course on social choice and collective decision-making, and we have just worked through the discursive dilemma. Before I read any more proposals for aggregating individual judgments into collective ones, I want the specification they will be tested against. Write the desiderata: what any adequate theory of how a group should form a collective judgment on a set of logically connected propositions has to deliver, assuming the group is supposed to be able to act as a coherent agent over time, not merely to tally independent votes. For each requirement, give the case or consideration that makes it a requirement, and say whether it is non-negotiable or a preference of a particular camp.

  Make sure the list includes at least: universal domain; collective consistency and completeness; deductive closure; consensus preservation; propositionwise independence, and the stronger systematicity condition; anonymity; non-dictatorship; monotonicity or responsiveness; and premise-sensitivity or reason-tracking. Use the doctrinal paradox — three judges deciding whether a defendant is liable, where liability requires both breach and a valid contract, and the majority holds breach, holds valid contract, and denies liability — as the central case for the inconsistency problem, but do not stop there: give the consideration behind each criterion, not just a label.

  Then the part I most want. Given the impossibility theorems in the judgment-aggregation literature, tell me which subsets of these desiderata cannot be jointly satisfied, and lay out the real options: weaken collective rationality by allowing incompleteness rather than inconsistency, drop independence or systematicity, restrict the admissible agendas, or accept something dictatorial. Say which single requirement does the most work in excluding otherwise attractive rules, and why. Finally, in a paragraph or a small table, score premise-based voting, conclusion-based voting, and a distance-based rule against the list — but keep that brief; the criteria are the point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Social Choice / Collective Decision-Making, specifically Judgment Aggregation (JA).
      *   **Context:** The user has just studied the Discursive Dilemma (Doctrinal Paradox) and wants to know the *desiderata* (criteria) for evaluating aggregation rules *before* seeing specific proposals.
      *   **Goal:** Provide a specification list (desiderata) with justifications (case/consideration) and status (non-negotiable vs. preference). Then, discuss impossibility results, trade-offs/options, identify the "bottleneck" constraint, and briefly score three specific rules (Premise-based, Conclusion-based, Distance-based).
      *   **Required Criteria:** Universal Domain, Collective Consistency & Completeness, Deductive Closure, Consensus Preservation (Unanimity), Propositionwise Independence, Systematicity, Anonymity, Non-dictatorship, Monotonicity/Responsiveness, Premise-sensitivity/Reason-tracking.
      *   **Central Case:** The Doctrinal Paradox (3 judges, breach, contract, liability).
      *   **Tone:** Academic, precise, philosophical but accessible to a student in the field.

  2.  **Deconstruct the Desiderata (The "Specification"):**
      *   I need to define each term clearly.
      *   I need to explain *why* it matters (the normative justification).
      *   I need to classify it (Non-negotiable/Standard vs. Controversial/Camp-specific).
      *   *Self-Correction on Classification:* In JA literature, some conditions are standard "rationality" constraints (like consistency), while others are fairness constraints (like anonymity). "Non-negotiable" is tricky because the impossibility theorems show they *are* negotiable. I should frame this as "Standard Rationality Requirement" vs. "Democratic Fairness Requirement" or similar, but sticking to the prompt's "Non-negotiable vs. Preference" instruction. I will interpret "Non-negotiable" as "Required for the group to count as a rational agent" and "Preference" as "Required for the group to count as a democratic body."

      *   *Drafting the Criteria:*
          1.  **Universal Domain:** Any logically possible profile of individual judgments should be admissible. *Why?* Freedom of thought/robustness. *Status:* Standard, but often restricted in practice.
          2.  **Collective Consistency & Completeness:** The output must be a valid judgment set (no contradictions, decision on every issue). *Why?* Agency requires coherence. *Status:* Non-negotiable for agency.
          3.  **Deductive Closure:** If the group accepts $P$ and $P \to Q$, it must accept $Q$. *Why?* Logical competence. *Status:* Often merged with Consistency/Completeness.
          4.  **Consensus Preservation (Unanimity):** If everyone agrees on $P$, the group accepts $P$. *Why?* Respect for individual views/Pareto efficiency. *Status:* Strongly preferred/Standard.
          5.  **Propositionwise Independence:** The collective judgment on $P$ depends *only* on individual judgments on $P$. *Why?* Prevents manipulation/protects autonomy on specific issues. *Status:* Highly controversial (the main culprit in impossibility theorems).
          6.  **Systematicity:** Independence + Neutrality (same rule for all propositions). *Why?* Fairness/Impartiality. *Status:* Stronger than Independence, also controversial.
          7.  **Anonymity:** All individuals count equally. *Why?* Political equality. *Status:* Democratic preference.
          8.  **Non-dictatorship:** No single person determines the outcome. *Why?* Democracy/Anti-autocracy. *Status:* Non-negotiable for democratic theory.
          9.  **Monotonicity/Responsiveness:** If support for $P$ increases, the group shouldn't switch from accepting to rejecting. *Why?* Stability/Responsiveness. *Status:* Standard rationality.
          10. **Premise-sensitivity/Reason-tracking:** The collective judgment should reflect the reasons (premises), not just the conclusion. *Why?* Accountability/Transparency. *Status:* Specific to the "discursive" camp (vs. conclusion-based).

  3.  **Address the Impossibility Theorems & Trade-offs:**
      *   *The Core Conflict:* List-Pettit Theorem (2002) is the big one. It shows Universal Domain + Consistency + Completeness + Independence + Non-dictatorship is impossible (for non-trivial agendas).
      *   *The "Bottleneck":* Propositionwise Independence is usually identified as the main driver of the impossibility in this context. It prevents the group from seeing logical connections *between* propositions.
      *   *The Options:*
          1.  Relax Rationality (allow inconsistency/incompleteness).
          2.  Relax Independence (allow holistic aggregation).
          3.  Restrict Domain (assume people are already consistent/correlated).
          4.  Accept Dictatorship/Authority (epistocracy).
      *   *Evaluation:* Which requirement does the most work? Independence. It forces the aggregation to ignore the logical structure of the agenda.

  4.  **Score the Rules:**
      *   *Premise-Based Procedure (PBP):* Vote on premises, deduce conclusion.
      *   *Conclusion-Based Procedure (CBP):* Vote on conclusion, ignore premises.
      *   *Distance-Based (Kemeny-like):* Minimize distance between collective set and individual sets.
      *   *Scoring:* I need to check them against the list above.
          *   PBP: Fails Independence (conclusion depends on premises), Satisfies Consistency, Satisfies Reason-tracking.
          *   CBP: Satisfies Independence (on the conclusion), Fails Consistency (with premises), Fails Reason-tracking.
          *   Distance: Satisfies Consistency, Fails Independence (holistic), Computationally heavy.

  5.  **Review and Refine:**
      *   *Check Prompt Constraints:* Did I use the Doctrinal Paradox as the central case? Yes. Did I include all listed criteria? Yes. Did I distinguish non-negotiable vs. preference? Yes. Did I identify the "single requirement" doing the most work? Yes. Is the scoring brief? Yes.
      *   *Tone Check:* Ensure it sounds like a guide for a student who knows the paradox but hasn't seen the solutions yet. Avoid giving away the "answer" as if one rule is perfect (because none are).
      *   *Nuance on "Non-negotiable":* I must be careful. In social choice, almost everything is negotiable to avoid impossibility. I will frame "Non-negotiable" as "Constitutive of the concept of a rational collective agent" vs. "Normative democratic ideal."
      *   *Refining the "Independence" argument:* Make sure to explain *why* Independence fails in the Doctrinal Paradox. (Majority says Yes to P, Yes to Q, but No to P&Q. Independence forces the group to take the majority on P&Q directly, ignoring the P and Q votes).

  6.  **Final Polish:** Organize with clear headings. Ensure the Doctrinal Paradox example is woven into the explanation of Consistency and Independence. (Self-Correction: Make sure the distinction between Independence and Systematicity is clear. Independence is issue-by-issue. Systematicity adds that the function is the same for all issues).

  7.  **Drafting the Content:** (Mental Outline)
      *   Intro: Acknowledge the Discursive Dilemma.
      *   Section 1: The Desiderata (Table or List with Justification/Status).
      *   Section 2: The Impossibility & The Real Options (List-Pettit).
      *   Section 3: The Bottleneck (Independence).
      *   Section 4: Scoring the Rules (Brief Table).

  8.  **Final Review against constraints:** "Make sure the list includes at least..." -> Check. "Use the doctrinal paradox... as the central case" -> Check. "Tell me which subsets... cannot be jointly satisfied" -> Check. "Say which single requirement does the most work" -> Check. "Score premise-based, conclusion-based, and distance-based" -> Check.

      *Wait, one detail:* "Deductive closure" is often treated as part of "Collective Consistency and Completeness" in modern JA (rational judgment sets are usually defined as consistent and complete, implying closure for the relevant logic). I will treat them together or closely linked to avoid redundancy, but ensure the label is present as requested.

      *Refining "Non-negotiable":* I will categorize them as "Constitutive of Agency" (hard constraints for the group to act) vs. "Democratic Norms" (constraints for the group to be legitimate). This maps better to the prompt's "non-negotiable vs preference" without claiming logical necessity where there is none.

      *Let's write.*
answer: |-
  ### The Specification: Desiderata for Collective Judgment

  To function as a coherent agent over time, a group cannot merely be a statistical aggregate; it must possess a "mind" capable of holding attitudes that guide action. The following criteria define what an adequate judgment aggregation rule must deliver.

  | Desideratum | Definition & Consideration | Status |
  | :--- | :--- | :--- |
  | **Universal Domain** | The rule must accept any logically possible combination of individual judgment sets as input. <br>**Consideration:** A free group cannot exclude members simply because their views are idiosyncratic or logically eccentric. To be robust, the procedure must handle disagreement without censoring admissible inputs. | **Preference** (Often restricted in practice to avoid impossibility, but standard for a general theory). |
  | **Collective Consistency & Completeness** | The collective output must be free of logical contradictions (consistency) and provide a judgment on every proposition in the agenda (completeness). <br>**Consideration (The Doctrinal Paradox):** In the paradox, the majority accepts *Breach* and *Contract*, but rejects *Liability* (where Liability $\leftrightarrow$ Breach $\land$ Contract). This set {Breach, Contract, $\neg$Liability} is inconsistent. An agent acting on this cannot execute a coherent plan (e.g., award damages while denying liability). | **Non-negotiable** (Constitutive of agency; an inconsistent agent is irrational). |
  | **Deductive Closure** | If the collective accepts $P$ and accepts $P \to Q$, it must accept $Q$. <br>**Consideration:** A group that fails closure fails to recognize the implications of its own commitments. It renders the group incompetent to manage its own commitments over time. | **Non-negotiable** (Usually subsumed under Consistency/Completeness for rational agents). |
  | **Consensus Preservation (Unanimity)** | If every individual accepts $P$, the collective must accept $P$. <br>**Consideration:** If there is no disagreement, the aggregation rule should not manufacture one. This is the judgment-aggregation equivalent of the Pareto principle. | **Non-negotiable** (Standard minimal requirement for responsiveness). |
  | **Propositionwise Independence** | The collective judgment on any proposition $P$ depends *only* on the individual judgments on $P$, not on judgments regarding other propositions ($Q, R$). <br>**Consideration:** This protects issue-by-issue autonomy and prevents manipulation via logical linkage. However, in the Doctrinal Paradox, this condition forces the group to vote on *Liability* independently of the votes on *Breach* and *Contract*, thereby generating the inconsistency. | **Preference** (Epistemic/Democratic camp; the primary target of criticism in JA). |
  | **Systematicity** | A stronger version of Independence: The collective judgment on $P$ depends on individual judgments on $P$ via the *same* function used for all other propositions (Neutrality + Independence). <br>**Consideration:** Ensures fairness and impartiality across different issues; the "weight" of a vote shouldn't change depending on the topic. | **Preference** (Stronger fairness constraint; often dropped before simple Independence). |
  | **Anonymity** | All individuals' judgments are weighted equally; permuting individuals does not change the outcome. <br>**Consideration:** Political equality. One member, one vote. | **Preference** (Democratic norm; epistocracies may reject this). |
  | **Non-dictatorship** | There is no single individual whose judgments always determine the collective judgments regardless of others. <br>**Consideration:** The group must be collective, not a singleton in disguise. | **Non-negotiable** (For any theory claiming to be about *collective* decision-making). |
  | **Monotonicity / Responsiveness** | If support for a proposition increases (others stay fixed), the collective judgment should not switch from acceptance to rejection. <br>**Consideration:** Stability and sensitivity to evidence. A rule that punishes increased support is perverse. | **Non-negotiable** (Standard rationality constraint). |
  | **Premise-Sensitivity (Reason-Tracking)** | The collective judgment on a conclusion should be derived from the collective judgment on the premises supporting it. <br>**Consideration:** Accountability. If a court rules *Liability*, it must be able to cite the *Breach* and *Contract* as reasons. Without this, the decision appears arbitrary or opaque. | **Preference** (Specific to the "discursive" camp; Conclusion-based voters reject this). |

  ---

  ### The Impossibility and the Real Options

  The central result in this literature (the List-Pettit Theorem, 2002) demonstrates that for any non-trivial agenda (like the Doctrinal Paradox), **no aggregation rule can satisfy Universal Domain, Collective Consistency (including Closure), Consensus Preservation, Propositionwise Independence, and Non-dictatorship simultaneously.**

  You cannot have it all. To design a working system, you must choose which constraint to break. The real options are:

  1.  **Weaken Collective Rationality:** Allow the collective to hold inconsistent or incomplete judgments. (e.g., Accept the majority vote on all three propositions in the Paradox, even if inconsistent).
      *   *Cost:* The group cannot act as a unified agent; it risks pragmatic paralysis.
  2.  **Drop Independence (or Systematicity):** Allow the judgment on one proposition to depend on judgments on others. (e.g., Determine *Liability* based on the votes for *Breach* and *Contract*).
      *   *Cost:* Violates the intuition that issues should be decided on their own merits; opens the door to "manipulation by agenda."
  3.  **Restrict the Domain:** Assume individuals will not hold just *any* combination of views, but only those that are epistemically constrained or correlated.
      *   *Cost:* Relies on empirical assumptions about group psychology that may not hold.
  4.  **Accept Dictatorship/Authority:** Assign the decision power to a single expert or sub-committee.
      *   *Cost:* Abandons democratic equality.

  #### The Bottleneck Constraint
  **Propositionwise Independence** does the most work in excluding otherwise attractive rules.

  **Why?** Independence forbids the aggregation rule from "seeing" the logical connections between propositions. It treats *Breach*, *Contract*, and *Liability* as isolated silos. In the Doctrinal Paradox, the inconsistency arises precisely because the rule is forced to tally *Liability* without looking at the tallies for *Breach* and *Contract*. If you drop Independence, you allow the rule to prioritize logical coherence over issue-by-issue majoritarianism (e.g., by letting the premise votes determine the conclusion). Most impossibility theorems in this field collapse if Independence is relaxed, making it the primary "pressure valve" for escaping impossibility.

  ---

  ### Scoring the Rules

  Here is how the three standard solutions score against the critical desiderata.

  | Desideratum | **Premise-Based Procedure (PBP)** <br>*(Vote on premises, deduce conclusion)* | **Conclusion-Based Procedure (CBP)** <br>*(Vote on conclusion, ignore premises)* | **Distance-Based Rule** <br>*(Minimize logical distance to individual sets)* |
  | :--- | :--- | :--- | :--- |
  | **Consistency & Closure** | **Pass** (Guaranteed by deduction) | **Fail** (Can yield the Paradox outcome) | **Pass** (Selects a consistent set) |
  | **Independence** | **Fail** (Conclusion depends on premise votes) | **Pass** (On the conclusion issue) | **Fail** (Holistic comparison) |
  | **Reason-Tracking** | **Pass** (Explicitly links reasons to outcome) | **Fail** (Outcome unmoored from premises) | **Pass** (Implicitly respects logic) |
  | **Anonymity** | **Pass** | **Pass** | **Pass** |
  | **Main Trade-off** | Sacrifices Independence to save Rationality. | Sacrifices Rationality to save Independence. | Sacrifices Independence/Transparency for Rationality. |

  **Summary:** The **Premise-Based Procedure** is generally favored in the "discursive" literature because it preserves Collective Consistency and Reason-Tracking, accepting the violation of Independence as the necessary cost of coherent agency. The **Conclusion-Based Procedure** preserves Independence but risks the group acting irrationally (the Doctrinal Paradox). **Distance-Based** rules offer a mathematically elegant way to restore consistency without a strict premise/conclusion hierarchy, but they violate Independence and are often less transparent to the participants.
