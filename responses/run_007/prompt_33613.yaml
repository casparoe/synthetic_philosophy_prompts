prompt: |-
  I serve on my medical school's Clinical Skills Committee. We're revising our policy on students' use of AI diagnostic decision-support tools during the third-year internal medicine clerkship. Currently, students are expected to arrive at diagnoses through their own history-taking, physical exam, and clinical reasoning, consulting only attending physicians and residents. But AI tools are now integrated into the hospital's EHR system, and many residents and attendings use them routinely — not as a substitute for judgment, but as a check on differential diagnoses and a prompt for overlooked possibilities. A group of clerkship directors wants us to permit students to use these tools as well, arguing that learning to work with AI is now part of competent clinical practice and that withholding the tools creates an artificial training environment that doesn't reflect the reality students will face in residency. The opposing group argues that diagnostic reasoning is a foundational skill that must be developed without AI scaffolding; if students learn to rely on these tools from the start, they'll never develop the deep pathophysiological understanding that lets a physician catch an atypical presentation or question the AI's output when it's wrong. They point to research from other fields — aviation, radiology, financial auditing — showing that when professionals outsource judgment to automated systems early in training, their unaided performance deteriorates and their conceptual grasp of the domain becomes shallower in ways that are difficult to repair later.

  The committee is divided roughly evenly, and I need to draft the decision memo that will be circulated before our vote next week. The memo should recommend either permitting AI use, prohibiting it, or permitting it with specified conditions, and should give reasons that both sides can recognize as fair. Please engage seriously with the strongest argument on the losing side rather than dismissing it. Limit the memo to 800 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Medical School's Clinical Skills Committee.
      *   **Task:** Draft a decision memo for the committee to circulate before a vote.
      *   **Topic:** Revising policy on students' use of AI diagnostic decision-support tools during the third-year internal medicine clerkship.
      *   **Current Policy:** No AI (own reasoning + human supervision).
      *   **Proposed Change:** Permit AI use (aligned with residency practice).
      *   **Conflict:**
          *   *Pro-AI:* Competency includes AI collaboration; current policy is artificial.
          *   *Anti-AI:* Diagnostic reasoning is foundational; early reliance leads to skill atrophy/shallow understanding (automation bias).
      *   **Requirement:** Recommend a position (Permit, Prohibit, or Conditional).
      *   **Requirement:** Engage seriously with the strongest argument on the *losing* side (fairness).
      *   **Constraint:** Limit to 800 words.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Prohibit):* Ignores the reality of modern practice and the committee's trend towards integration. Hard to enforce if it's in the EHR.
      *   *Option 2 (Permit Unrestricted):* Risks the foundational skill atrophy argued by the opposing side.
      *   *Option 3 (Conditional/Hybrid):* This is the most balanced approach. It allows exposure to AI (addressing Pro-AI) but safeguards foundational reasoning (addressing Anti-AI).
      *   *Decision:* Recommend permitting AI use *with specified conditions* (e.g., disclose use, justify agreement/disagreement, specific phases of clerkship).

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Rationale for Recommendation (The "Why"):**
          *   Acknowledge the shift in clinical practice (Pro-AI argument).
          *   Acknowledge the risk to foundational skills (Anti-AI argument).
          *   Propose the middle ground: "Augmented Reasoning" rather than "Automated Diagnosis."
      *   **Specific Conditions:**
          *   Timing (e.g., later in clerkship?).
          *   Disclosure (must document use).
          *   Reflection (must explain why they accepted/rejected AI suggestion).
      *   **Engaging the Losing Side:** Since I'm recommending *Conditional Permission*, the "losing" side is technically the hardline "Prohibit" group (though the "Permit Unrestricted" group also compromises). However, the prompt asks to engage with the strongest argument on the *losing* side. If I recommend Conditional Permission, both sides compromise. But usually, in these memos, one side's core concern is overridden. Let's frame the recommendation as "Permit with Conditions." The strongest opposing argument is the "skill atrophy/automation bias" argument (the Anti-AI side). Even with conditions, there's a risk. I need to acknowledge that risk seriously.
      *   *Correction:* Actually, if I recommend "Permit with Conditions," I am mostly aligning with the Pro-AI group but mitigating their excess. The "Losing" side would be the strict "Prohibit" side. I need to validate their concern about skill atrophy.
      *   *Alternative:* I could recommend "Prohibit during initial weeks, Permit later." This leans towards the Anti-AI side initially.
      *   *Best Approach:* A phased approach. Prohibit during the first half (foundational), Permit during the second half (integration). This validates the Anti-AI concern about foundational skills while accepting the Pro-AI reality of modern practice.
      *   *Wait, let's look at the "Losing Side" requirement again.* "Engage seriously with the strongest argument on the losing side rather than dismissing it." If I recommend a hybrid, there isn't a clear "loser." To make the memo decisive, I should lean one way. Given the trend of medicine, "Permit with Conditions" is the most viable policy. The "Losing" side is the "Strict Prohibition" camp. Their strongest argument is that *any* early reliance degrades deep pathophysiological understanding. I must acknowledge that even with conditions, this risk exists and requires monitoring.

      *   *Refined Plan:*
          1.  Recommend: **Permitted with Strict Conditions.**
          2.  Reasoning: Balances competency needs with skill preservation.
          3.  Conditions: Disclosure, justification, and perhaps a "no-AI" period for initial assessments.
          4.  Addressing the Opposition: Acknowledge the automation bias risk. Admit that conditions might not fully prevent skill atrophy. Commit to assessment changes to mitigate this.

  4.  **Drafting - Content & Tone:**
      *   Tone: Professional, balanced, decisive, academic.
      *   Word Count: Keep tight. Aim for ~700-750 to be safe under 800.

  5.  **Drafting - Step-by-Step:**

      *   *Header:* Standard memo format.
      *   *Introduction:* Purpose is to recommend policy on AI tools in IM clerkship. Recommendation: Conditional Permission.
      *   *Argument for Change:* Clinical reality. Residents use it. Students need to learn AI literacy (prompt engineering, interpreting output).
      *   *Argument for Caution (The Opposition):* Diagnostic reasoning is a muscle. Automation bias is real. Cite the aviation/radiology analogy.
      *   *The Compromise (Policy):*
          1.  Initial Phase (Weeks 1-4): No AI. Focus on unaided reasoning.
          2.  Secondary Phase (Weeks 5-12): AI permitted as a "second check."
          3.  Requirement: Students must document AI use and explicitly justify accepting or rejecting its suggestions in their notes/presentations.
      *   *Engaging the Losing Side (Strict Prohibition):* The prohibitionists argue that *any* exposure risks shallow learning. I need to admit that this policy does not eliminate that risk. There is evidence that once a tool is available, the temptation to offload cognition is high. Even with justification requirements, students might reverse-engineer explanations to match the AI. This is a valid fear.
      *   *Mitigation:* To address this, we will adjust evaluations to test unaided reasoning (e.g., oral exams without EHR access).
      *   *Conclusion:* Call to vote.

  6.  **Review and Refine (Self-Correction):**
      *   *Check Word Count:* Ensure it doesn't exceed 800.
      *   *Check "Losing Side" Requirement:* Make sure I don't just dismiss the automation bias concern. I need to validate it as a serious risk that the policy attempts to manage but cannot guarantee to eliminate.
      *   *Check Tone:* Ensure it sounds like a committee memo, not an essay.

  7.  **Final Polish:** (Mental check of the draft)
      *   *Header:* To: Clinical Skills Committee. From: [My Name/Role]. Subject: Policy Recommendation...
      *   *Opening:* Recommend conditional permission.
      *   *Body:* Why conditional? Because both sides have merit.
      *   *Opposition:* The "Prohibit" side worries about cognitive offloading. I will acknowledge that safeguards aren't perfect.
      *   *Closing:* Vote request.

      *Wait, one nuance:* If I recommend "Conditional Permission," the "Losing" side is the "Strict Prohibition" side. Their argument is that foundational skills will be damaged. I need to make sure I don't just say "we'll monitor it." I need to say "Their concern is valid; there is a risk we are accepting."

