      *Key phrase to include:* "Automation bias," "foundational skill," "clinical reality."

      *Final check on the "Losing Side" instruction:* "Engage seriously with the strongest argument on the losing side." If I propose a hybrid, is there a losing side? Yes, the strict prohibitionists lose their ban. The strict permisisonists lose their unrestricted access. I will frame the "Losing Side" as the Prohibitionists, as the trend is towards integration. I will acknowledge their fear that *any* use degrades reasoning.

      *Actually, a better interpretation:* If I recommend "Permit with Conditions," I am essentially siding with the "Permit" group but reining them in. The "Losing" side is the "Prohibit" group. I must validate their concern that this might still hurt learning.

      *Let's go.*

