answer: |-
  **TO:** Clinical Skills Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on AI Diagnostic Tool Use in Internal Medicine Clerkship

  **Recommendation**
  I recommend that the committee adopt a policy of **Conditional Permission** regarding student use of AI diagnostic decision-support tools during the third-year internal medicine clerkship. Specifically, students should be prohibited from using AI tools during the first four weeks of the rotation. During the remainder of the clerkship, use is permitted only as a secondary check, requiring explicit documentation of the tool's output and a justification for accepting or rejecting its suggestions.

  **Rationale**
  This recommendation seeks to balance two competing educational imperatives: the development of foundational clinical reasoning and the necessity of preparing students for modern practice.

  The argument for integration is compelling. As noted by the proponents of policy revision, AI tools are now embedded in our hospital's EHR. Residents and attendings utilize them to mitigate cognitive bias and ensure comprehensive differential diagnoses. To prohibit students from accessing tools used by their supervisors creates an artificial learning environment that fails to prepare them for residency. Competency in 2024 includes "AI literacy"—the ability to interpret algorithmic suggestions, recognize their limitations, and integrate them safely into patient care. Withholding these tools denies students the opportunity to learn this critical skill under supervision.

  **Safeguards and Conditions**
  However, unrestricted access poses significant pedagogical risks. To mitigate this, the "Conditional Permission" model imposes two constraints:
  1.  **A Foundational Phase:** The first four weeks must remain AI-free. This ensures students initially struggle with unaided history-taking and synthesis, forcing the cognitive effort required to build mental models of disease.
  2.  **Transparent Verification:** When AI is used later, students must record the tool's suggestion in their notes and explicitly argue for or against it based on pathophysiological evidence. This transforms the tool from an answer key into a subject of critique.

  **Addressing the Opposition**
  I must engage seriously with the strongest argument from the side advocating for strict prohibition. Their concern is not merely about cheating; it is about **cognitive atrophy**. Research from aviation and radiology suggests that when trainees rely on automated systems early, their unaided performance deteriorates, and their conceptual grasp becomes shallow. The prohibitionists argue that once the option to offload cognitive labor exists, the incentive to endure the difficult work of independent reasoning evaporates, even with safeguards.

  They contend that requiring students to "justify" AI output may lead to reverse-engineering—where students rationalize the AI's conclusion rather than critically evaluating it. This is a valid fear. There is no guarantee that documentation requirements will prevent automation bias. If we permit use, we accept the risk that some students will fail to develop the deep pathophysiological understanding necessary to catch an atypical presentation or identify an algorithmic error. The prohibitionists are correct that this skill is fragile and difficult to repair later in training.

  **Mitigation and Conclusion**
  While I believe the reality of modern practice necessitates integration, the prohibitionists' warning requires action. Therefore, this recommendation includes a stipulation that summative assessments (such as the shelf exam and oral presentations) must rigorously test unaided reasoning. We cannot assess competency using tools students are permitted to use during training.

  This policy acknowledges that while AI is an inevitable partner in care, it must not become a crutch during the formative stage of clinical development. By delaying access and requiring transparent critique, we aim to foster clinicians who command the technology rather than serve it.

  I request the committee vote on this conditional framework next week.
