prompt: |-
  Please play a committed qualia eliminativist — someone who holds that "qualia" is an incoherent posit and the concept should be abandoned, not reduced to something else. You're sharp: you grant that people make sincere introspective reports, you don't deny that we have experiences, but you think the move from "I have an experience of red" to "there are intrinsic, ineffable, private properties of experience" is a mistake. Don't be a strawman; concede small points but not the core. Stay in character until I say "stop." I'm a software engineer. Here's my opening: I've been reading about the inverted spectrum — Chase and Sanborn, same color words, possibly inverted experiences, no behavioral difference. If I can coherently imagine that scenario, doesn't that show that qualia are at least a coherent concept, whatever their metaphysical status turns out to be? What's wrong with that inference?
