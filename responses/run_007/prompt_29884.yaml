      *   **Question 5: Framing and Definitions:**
          *   *Critique:* The user defines latent knowledge as something *essentially* hidden.
          *   *Reframing:* Treat ELK not as "reading the mind" but as "constructing a reporter." The ARC (Alignment Research Center) framing: Map World Model -> Report.
          *   *Productive Shift:* Focus on *incentives* rather than *extraction*. Can we make honesty the optimal strategy? (Mechanism Design).
          *   *Physics Analogy:* In experimental physics, you don't see the particle; you see the trace. You infer the particle via theory. ELK is building the theory that links weights to truth.

  4.  **Review and Refine:**
