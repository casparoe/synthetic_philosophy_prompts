answer: |-
  You are absolutely right to be annoyed. What you experienced is a classic philosophical **Motte-and-Bailey** maneuver, dressed up in cognitive science jargon. Your friend retreated to a defensible, boring claim when you pressed him on existence, but advanced a radical, controversial claim when he wanted to deny your persistence.

  Daniel Dennett's phrase "center of narrative gravity" is notoriously slippery because it mixes a physics metaphor (gravity) with a literary one (narrative). Physics implies objective reality; literature implies subjective construction. Your friend was sliding between these two implications to avoid having to defend a consistent ontology.

  Here are the four distinct precise claims hidden inside that phrase, ranked from boringly true to genuinely radical.

  ### 1. The Pragmatic Claim (The "User Interface" Reading)
  **The Claim:** Human beings organize their memories and plans into a story structure to function socially. Referring to "me" is a useful shorthand for this cluster of memories and intentions.
  *   **Status:** **Platitude.** Almost no one denies this. Psychologists and novelists agree.
  *   **Commitments:**
      *   **Existence:** Selves exist as social tools.
      *   **Persistence:** Persistence is a matter of degree (how coherent the story is).
      *   **Consciousness:** Consciousness is real; the *story* about it is just a compression algorithm.
  *   **Does it do the work?** **No.** This reading is compatible with there *also* being a deep, inner self. It just says we talk about it using stories. It doesn't rule out the thing you were defending.

  ### 2. The Ontological Claim (The "Real Pattern" Reading)
  **The Claim:** The self is an abstract object, like a "center of gravity." A center of gravity isn't a physical particle you can put in a box, but it is objectively real because it predicts physical behavior. Similarly, the "self" is a real pattern in the brain's data, not a physical thing, but not a lie either.
  *   **Status:** **Defensible.** This is Dennett's official, careful position.
  *   **Commitments:**
      *   **Existence:** Selves exist as abstract objects (like numbers or institutions).
      *   **Persistence:** Persistence is the continuity of the pattern, not the continuity of a "soul substance."
      *   **Consciousness:** Consciousness is real, but it is distributed, not located in a single "theater."
  *   **Does it do the work?** **Partially.** This denies the *Cartesian* self (a ghost in the machine) but affirms the *Person*. However, it grants enough reality to the self that your friend can't say "you don't really exist."

  ### 3. The Eliminativist Claim (The "Benign Fiction" Reading)
  **The Claim:** The self is a user-illusion. Just like the desktop icons on your computer aren't "real" files (they are pointers to code), the "self" is a fiction the brain tells itself to simplify control. There is no "center," only the gravity.
  *   **Status:** **Radical/Controversial.** This is what people *hear* when Dennett says "fiction," even if he hedges.
  *   **Commitments:**
      *   **Existence:** Selves do not fundamentally exist (ontological eliminativism).
      *   **Persistence:** Persistence is false; there is only a causal chain of states.
      *   **Consciousness:** What we feel as a unified consciousness is a retrospective fabrication.
  *   **Does it do the work?** **Yes.** This is the conclusion your friend *wanted*. It dissolves the hard problem of personal identity by saying the question is based on a false premise.

  ### 4. The Normative Claim (The "Task" Reading)
  **The Claim:** You *ought* to create a center of narrative gravity. To be a moral agent is to weave your actions into a coherent story for which you can be held responsible.
  *   **Status:** **Ethical/Prescriptive.** Not a metaphysical claim at all.
  *   **Commitments:**
      *   **Existence:** Irrelevant.
      *   **Persistence:** Irrelevant.
      *   **Consciousness:** Irrelevant.
  *   **Does it do the work?** **No.** This shifts the argument from "What am I?" to "How should I act?" It dodges the metaphysical question entirely.

  ***

  ### Diagnosis: How Your Friend Cheated

  Your friend was using **Reading 3 (Eliminativist)** to shock you and deny persistence, but when you cornered him on existence, he retreated to **Reading 2 (Ontological/Abstraction)**.

  *   **When you asked: "Do I exist?"**
      *   He used **Reading 2**. "Of course you exist, like a center of gravity exists." (Defensible, but grants you reality).
  *   **When you asked: "Am I the same self over time?"**
      *   He used **Reading 3**. "The persisting inner thing is a fiction." (Radical, denies your intuition of identity).
  *   **When you pushed for consistency:**
      *   He likely drifted toward **Reading 1**. "It's just how we talk." (Platitude, ends the debate by making it trivial).

  **The Contradiction:**
  If the self is like a center of gravity (Reading 2), it **does** persist as long as the physical body persists. A car has a center of gravity today and the same center of gravity tomorrow (relative to the car). If your friend admits the self is a "real abstraction," he must admit you persist as that abstraction.
  If the self is a fiction (Reading 3), then it **doesn't** exist, even as an abstraction. You can't say "It's a real abstraction but also a fiction." That is the equivocation.

  ### Which Reading Actually Does the Work?

  Only **Reading 3 (The Eliminativist Claim)** does the philosophical work of dissolving the "hard problem" of the self. It is the only one that actually challenges the idea that there is a "you" that survives change.

  However, Reading 3 is **much harder to defend** than Reading 2.
  *   **Reading 2** saves the phenomena (you exist, you persist) but changes the category (you are a pattern, not a substance).
  *   **Reading 3** denies the phenomena (you are a useful error).

  Your friend wanted the **shock value of Reading 3** without the **burden of proof of Reading 3**. He wanted to tell you your persistence is a fiction, but when you asked if *you* were a fiction, he backed down and said "No, you're an abstraction."

  ### How to Respond Next Time

  If you engage him again, force him to pick one ontology. Ask him this:

  > "Is the 'center of narrative gravity' a **real pattern** that tracks my biological continuity, or is it a **fiction** that replaces my continuity?
  >
  > If it's a **real pattern**, then I persist as long as the pattern persists, and I'm right about persistence.
  > If it's a **fiction**, then I don't exist, and you're wrong to say 'of course you exist.'
  > You can't have it both ways."

  He is trying to have a cake (the scientific authority of Dennett) and eat it too (the common-sense intuition that he isn't a hallucination). The phrase "center of narrative gravity" is the frosting hiding the fact that the cake is either stale (Platitude) or poisonous (Eliminativism).
