      *   **Pinpoint the Flaw:** The flaw is in the definition of "fair bet" relative to credence.
          *   In the DBA, $P(H) = p$ means you are indifferent between buying a ticket for $\$p$ that pays $\$1$ if $H$ and $\$0$ otherwise.
          *   This definition *presupposes* linear utility of money.
          *   If you have DMU, your betting quotient is *not* your credence. Your betting quotient is distorted by risk aversion.
      *   **Address Premise (3):** The principle "If you regard a bet as fair, you must take it" is only true if "fair" means "non-negative expected utility."
