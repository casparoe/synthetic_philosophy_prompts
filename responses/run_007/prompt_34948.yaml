      *   *Refining the "Fairness" concept:* A coherent Bayesian with DMU does *not* regard the large bet as fair. They regard the *probability* as 1/2, but the *bet* as unfavorable. The DBA targets the probability assignment, not the risk attitude.
      *   *Wait, one nuance:* If the DBA defines credence *as* the betting price, then a risk-averse person's "credence" looks weird (e.g., they might pay less for a bet on a sure thing if the stake is huge?). No, usually we define credence via *infinitesimal* stakes or utility-normalized stakes.
