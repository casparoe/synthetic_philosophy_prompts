answer: |-
  ### Final Exam Question: Ethics 300

  **Question 4 (25 points)**
  Parfit's Nonidentity Problem suggests that certain choices that bring about future people with flawed lives are not wrong, provided those lives are worth living, because the choice also determined *which* people would exist.
  1.  Explain why this constitutes a genuine moral problem rather than a merely verbal puzzle about the definition of "harm." Focus on the tension between the **Person-Affecting Restriction** and our moral intuitions.
  2.  Select **one** specific philosophical attempt to resolve this problem (e.g., an Impersonal Principle, a Rights-Based account, or a Revised Person-Affecting View). Evaluate this proposal by explaining what moral work it successfully performs and what difficulties or counter-intuitions it leaves unresolved.

  *Recommended time: 60 minutes. Recommended length: 750–850 words.*

  ***

  ### Model Answer

  The Nonidentity Problem is not merely a semantic dispute about whether we can "harm" someone by bringing them into existence. It is a structural conflict within moral theory between the **Person-Affecting Restriction** and robust moral intuitions regarding responsibility. The Person-Affecting Restriction holds that an act can only be wrong if it makes some particular person worse off than they would otherwise have been. In identity-affecting choices—such as a 14-year-old girl choosing to have a child now rather than waiting—the child born early has a life worth living. If she had waited, a *different* child would have been born. Therefore, the early-born child is not worse off than they would have been (since the alternative was non-existence), and the Person-Affecting Restriction implies the girl did nothing wrong.

  This is genuinely difficult because rejecting the restriction seems to require abandoning the idea that morality is fundamentally about how we treat *individuals*. If we accept the restriction, we must accept the "Nonidentity Conclusion": that reckless procreation is permissible provided the resulting life is worth living. This contradicts the deep intuition that we have obligations to future people not to impose avoidable burdens on them, regardless of whether those burdens make their lives net-negative. The problem is hard because it forces a choice between a logically coherent principle (Person-Affecting) and a substantive moral commitment (that causing preventable suffering is wrong). It reveals that our standard comparative account of harm (worse off than before/worse off than alternative) breaks down when existence itself is the variable.

  One prominent attempt to resolve this is Parfit's **Impersonal Principle** (specifically the "Same Number Quality Claim"). This principle suggests that if two outcomes involve the same number of people, the one in which people have a higher quality of life is better, regardless of *who* those people are. This solves the Nonidentity Problem by shifting the locus of evaluation from individual welfare comparisons to outcome states. Under this view, the 14-year-old's choice is wrong not because she harmed her child, but because she brought about a state of affairs with less overall well-being than she could have.

  The strength of the Impersonal Principle is that it preserves the intuition that the choice was wrong without relying on a incoherent comparison to non-existence. It aligns moral evaluation with the quality of lives lived, allowing us to criticize policies that deplete resources or change climate patterns for future generations, even if those specific future people owe their existence to those policies. It successfully decouples the wrongness of the act from the specific complaint of the victim.

  However, this solution leaves significant difficulties unresolved. First, it risks alienation from the individuals involved. By treating people as vessels of value rather than subjects of rights, it struggles to explain why we owe duties *to* specific future persons. If a policy harms a specific future person but increases overall average well-being by bringing in different, happier people, the Impersonal Principle might justify the harm, which conflicts with rights-based intuitions.

  Second, and more critically, the Impersonal Principle is vulnerable to the **Repugnant Conclusion**. If the goal is simply to maximize total or average quality of existence irrespective of identity, one might be forced to conclude that a massive population with lives barely worth living is better than a smaller, flourishing population. While the Nonidentity Problem and the Repugnant Conclusion are distinct, the solution to the former often triggers the latter. Consequently, while the Impersonal Principle solves the logical puzzle of the Nonidentity Problem, it does so by opening a new set of problems in population ethics. It is not a consensus solution; rather, it is a trade-off that resolves the identity paradox at the cost of potentially counter-intuitive implications regarding population size and distribution. Thus, the Nonidentity Problem remains a live issue because every proposed solution requires revising other deeply held moral commitments.

  ***

  ### Marking Scheme (25 Points)

  #### Part 1: Explaining the Difficulty (10 Points)
  *   **A Range (8–10 pts):** Clearly articulates the **Person-Affecting Restriction** and explains why the "harm" comparison fails in identity-affecting cases. Explicitly states that the problem is structural (logic vs. intuition), not just semantic. Notes that the alternative for the child is non-existence.
  *   **B Range (5–7 pts):** Defines the Nonidentity Problem correctly but relies heavily on the "harm" definition without explaining the Person-Affecting Restriction. May imply the problem is just about whether non-existent people count.
  *   **C Range (0–4 pts):** Fails to distinguish identity-affecting from identity-preserving choices. Claims the problem is solved by saying "future people don't exist yet" or confuses the issue with general uncertainty about the future.

  #### Part 2: Evaluating a Solution (10 Points)
  *   **A Range (8–10 pts):** Selects a specific theory (e.g., Impersonal Principle, Rights View). Clearly explains the **strength** (how it solves the NIP) and the **weakness** (what new problem it creates, e.g., Repugnant Conclusion, alienation). Acknowledges the solution is contested, not settled.
  *   **B Range (5–7 pts):** Describes a solution but offers a shallow critique (e.g., "it seems weird"). Fails to connect the solution's weakness to a broader ethical problem. Treats the solution as more definitive than it is.
  *   **C Range (0–4 pts):** Merely summarizes a solution without evaluation. Or, evaluates a solution that does not actually address the Nonidentity Problem.

  #### Clarity and Accuracy (5 Points)
  *   **A Range (5 pts):** Precise philosophical terminology. No category errors.
  *   **B Range (3–4 pts):** Generally clear but minor imprecisions.
  *   **C Range (0–2 pts):** Disorganized or difficult to follow.

  #### **Examiner's Notes: Common Mistakes to Flag**
  1.  **Confusing NIP with the Repugnant Conclusion:** The NIP is about *who* exists (identity); the Repugnant Conclusion is about *how many* exist (quantity). A student can mention the Repugnant Conclusion as a *side effect* of a solution (as in the model answer), but they must not treat them as the same problem.
  2.  **The "Existence" Error:** Students often argue Parfit's point is simply that "future people don't exist yet, so we can't harm them." This is incorrect. The problem persists even if we grant future people moral status; the issue is the *comparative* baseline (non-existence vs. impaired existence).
  3.  **Identity-Preserving Confusion:** Students must understand that if the choice were identity-preserving (e.g., poisoning a water supply for an existing child), the Person-Affecting Restriction would easily condemn it. The NIP only arises when the choice changes *who* is born.
  4.  **Consensus Claim:** Penalize answers that state one solution (e.g., Impersonal Principles) is the "correct" or "accepted" answer. The field remains divided.

  #### **Grade Boundaries**
  *   **A (21–25):** Sophisticated grasp of the Person-Affecting Restriction; nuanced evaluation of a solution that acknowledges trade-offs.
  *   **B (16–20):** Solid understanding of the case and the problem; evaluation of solution is present but lacks depth regarding unresolved issues.
  *   **C (11–15):** Basic understanding of the scenario; struggles with the theoretical underpinnings (Person-Affecting); evaluation is weak or missing.
  *   **D/F (0–10):** Fundamental misunderstandings of the prompt or the philosophical concepts.
