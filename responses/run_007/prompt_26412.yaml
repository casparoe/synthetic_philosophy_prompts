answer: |-
  **MEMORANDUM**

  **TO:** Ethics Advisory Board, [Clinic Name]
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Clinical Use of Polygenic Risk Scoring (PGT-P) for Non-Medical Traits

  ### Executive Summary

  This memo addresses a request from a prospective patient couple to utilize Preimplantation Genetic Testing for Polygenic Traits (PGT-P) to select an embryo with the highest predicted score for educational attainment. While the couple acknowledges the limitations of the technology and frames the request within the bounds of reproductive autonomy, the clinical team is divided on whether the clinic should facilitate this service.

  After reviewing current scientific literature, professional guidelines, and ethical arguments, I recommend that the Board **decline** the request and adopt a policy moratorium on the use of PGT-P for non-medical traits (such as intelligence, height, or personality) at this time. This recommendation aligns with current guidance from the American Society for Reproductive Medicine (ASRM) and the European Society of Human Reproduction and Embryology (ESHRE).

  ### Background and Scientific Context

  Preimplantation Genetic Testing (PGT) is well-established for aneuploidy (PGT-A) and monogenic disorders (PGT-M). PGT-P, however, utilizes genome-wide association studies (GWAS) to calculate polygenic risk scores (PRS) for complex traits influenced by thousands of genetic variants and environmental factors.

  To inform our vote, we must distinguish between settled scientific realities and genuinely contested projections.

  **Settled Scientific Consensus:**
  1.  **Predictive Validity:** At the individual level, current PGT-P for behavioral or cognitive traits has low predictive power. A high polygenic score for educational attainment does not guarantee high academic performance, nor does a low score preclude it. Environmental factors remain the dominant determinant.
  2.  **Population Bias:** GWAS data is heavily skewed toward populations of European ancestry. PRS accuracy drops significantly for patients of other ancestries, raising immediate concerns about equity and accuracy in a diverse patient population.
  3.  **Pleiotropy:** Genetic variants associated with one trait often influence others. Selecting for a variant associated with higher cognitive scores may inadvertently select for variants associated with psychiatric conditions (e.g., autism or schizophrenia), creating a risk of unintended harm.

  **Genuinely Contested Areas:**
  1.  **Trajectory of Utility:** Proponents argue that predictive power will increase as datasets grow. There is disagreement on whether current limitations justify a permanent ban or merely a cautionary period.
  2.  **Definition of "Disease":** There is no consensus on where to draw the line between "medical" and "social" traits. Some bioethicists argue that if a trait impacts quality of life (e.g., susceptibility to depression), it is medical. Others maintain that normal variation (e.g., IQ within the normal range) should not be subject to selection.

  ### Ethical Analysis

  The division within our clinical team mirrors the broader bioethical debate. Both positions rest on defensible moral premises.

  **1. The Argument for Reproductive Autonomy**
  Proponents of permitting PGT-P argue from the principle of reproductive liberty. Parents already exert significant control over their children's genetic makeup through partner selection and gamete donation. Furthermore, parents routinely invest resources to optimize outcomes (e.g., moving to better school districts, private tutoring).
  *   **Consistency:** If we permit PGT-M to prevent a genetic disease, and we permit donor selection based on physical traits or education, prohibiting PGT-P appears arbitrary.
  *   **Harm Reduction:** If the technology is safe and the patients are informed, preventing them from using it restricts their liberty without preventing tangible harm to a future child, who would be born regardless of which embryo is selected.
  *   **Private vs. State:** Unlike historical eugenics programs, this is non-coercive. It is "liberal eugenics" driven by individual choice, not state mandate.

  **2. The Argument for Non-Maleficence and Justice**
  Opponents argue that the clinic has a duty to avoid harm and uphold the integrity of the medical profession.
  *   **Medicalization of Normality:** Using medical resources to select for enhanced traits shifts fertility treatment from healing to engineering. This risks altering the parent-child relationship, potentially viewing the child as a product of design rather than a gift to be accepted.
  *   **Exacerbating Inequality:** Access to PGT-P is limited by cost. Widespread adoption could exacerbate social stratification, allowing wealthy families to compound genetic and socioeconomic advantages.
  *   **The "Open Future":** Selecting for a specific trait (e.g., high academic potential) may impose undue expectations on the child, restricting their right to an open future.
  *   **Misleading Marketing:** Even with counseling, offering the test implies a clinical validity that does not yet exist. Patients may overestimate the certainty of the outcome, leading to future regret or psychological distress for the child if they do not meet the "genetic potential."

  ### Professional Landscape

  It is critical to note where our clinic stands relative to peer institutions.
  *   **ASRM (2021):** The Ethics Committee concluded that PGT-P for complex traits should not be offered clinically outside of IRB-approved research due to lack of clinical utility and ethical concerns.
  *   **ESHRE:** Similarly advises against clinical use until validity is proven and ethical implications are resolved.
  *   **Industry Practice:** The majority of major fertility clinics and PGT laboratories currently refuse to process samples for non-medical polygenic scoring.

  By permitting this request, [Clinic Name] would become an outlier. This carries reputational risk and potential liability if the resulting child does not meet expectations, despite counseling.

  ### Recommendation

  I recommend the Board **vote to decline the current request** and **adopt a policy prohibiting the use of PGT-P for non-medical traits** until further notice.

  **Rationale:**
  1.  **Clinical Integrity:** Our primary mandate is to facilitate healthy pregnancies and prevent serious disease. PGT-P for educational attainment falls outside the scope of medical indication.
  2.  **Patient Protection:** Despite counseling, the gap between statistical probability and individual outcome is wide enough that offering this service risks misleading patients about the control they have over their future child's life.
  3.  **Precautionary Principle:** Given the risks of pleiotropy and the potential for social harm, the burden of proof should lie on demonstrating safety and utility before clinical adoption, not on proving harm before restriction.

  **Proposed Policy Conditions (for the moratorium):**
  *   PGT-P may only be considered in the future for serious, early-onset medical conditions where no monogenic cause is identified (e.g., certain heart diseases), subject to further Board review.
  *   Selection for behavioral, cognitive, or cosmetic traits remains prohibited.
  *   This policy will be reviewed annually in light of scientific advancements.

  ### Implementation for the Current Couple

  If the Board votes to adopt this recommendation, the clinical team should communicate the decision to the couple with empathy.
  *   **Message:** Acknowledge their desire to provide advantages for their child. Explain that the clinic follows national professional guidelines which currently classify this use as experimental and ethically problematic due to low predictive accuracy.
  *   **Alternative:** Reiterate our commitment to supporting their journey through standard PGT-A/M to ensure a healthy pregnancy, which remains the strongest predictor of positive life outcomes.

  ### Motion for Vote

  I move that the Ethics Advisory Board adopt a policy moratorium on the clinical use of Polygenic Risk Scoring for non-medical traits, effective immediately, and decline the pending patient request based on this policy.

  ***

  **Attachments:**
  *   ASRM Ethics Committee Opinion on PGT-P (2021)
  *   Summary of GWAS limitations regarding ancestry diversity
