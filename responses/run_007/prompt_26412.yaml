prompt: |-
  I sit on the ethics advisory board of a mid-sized fertility clinic. We're reviewing our policy on preimplantation genetic testing. Currently we offer PGT-A (for aneuploidy) and PGT-M (for monogenic disease) — the standard stuff. A couple has now requested PGT-P, polygenic scoring, to select among several viable embryos for the one with the highest predicted score on educational attainment. They're paying out of pocket, they've been counselled on how weak the predictiv power actually is at the individual level, and they frame it as no different in principle from moving to a good school district or reading to your kid at night — just parents trying to give their child whatever advantages they can.

  The clinical team is split. Some see this as a nautral extension of reproductive autonomy: if we let parents choose when to conceive, whether to terminate for Down syndrome, and which donor eggs to use based on a profile, why draw the line here? Others say this crosses from preventing disease into engineering childern, and that the clinic should draw a hard boundary at medical indications — once you start ranking embryos by IQ predictors you're doing eugenics with a friendlier face, never mind that no state is coercing anyone.

  I need to draft a short memo — maybe two or three pages — that the board can discuss and vote on at our next meeting. It should recommend whether to permit this request, decline it, or permit it with conditions, and it should engage both positions seriously rather than just restating one side's premises. Also, please separate what's settled from what's genuinely contested among people who work in this area — don't present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Ethics Advisory Board (EAB) at a mid-sized fertility clinic.
      *   **Task:** Draft a memo (2-3 pages) for the board to discuss and vote on.
      *   **Topic:** Policy on Preimplantation Genetic Testing for Polygenic Risk Scores (PGT-P), specifically for non-medical traits like educational attainment.
      *   **Scenario:** A couple requests PGT-P for educational attainment. They are paying out of pocket, understand the limitations, and argue from reproductive autonomy/parental advantage.
      *   **Conflict:** Clinical team is split (Reproductive Autonomy vs. Medical Indication/Eugenics concerns).
      *   **Requirements:**
          *   Recommend a course of action (Permit, Decline, or Permit with Conditions).
          *   Engage both positions seriously (steel-man both sides).
          *   Distinguish between settled science/ethics and genuinely contested areas (avoid false consensus).
          *   Tone: Professional, ethical, nuanced, actionable.

  2.  **Determine the Recommendation:**
      *   *Option A (Permit):* Highly controversial. Most professional societies (ASRM, ESHRE) currently advise against clinical use of PGT-P for complex traits due to low predictive value and ethical concerns. Doing so might isolate the clinic.
      *   *Option B (Decline):* Aligns with current professional guidelines. Protects the clinic from reputational risk and potential harm to future children (psychological burden). Respects the "medical model" of genetics.
      *   *Option C (Permit with Conditions):* A middle ground, but ethically tricky. What conditions make selecting for IQ okay? Strict counseling? Limiting to high scores? Still violates the core ethical objection of many.
      *   *Decision:* The strongest ethical and professional stance currently is to **Decline** clinical offering of PGT-P for non-medical traits, while acknowledging the complexity. This aligns with ASRM (American Society for Reproductive Medicine) and ESHRE (European Society of Human Reproduction and Embryology) guidance. It allows the memo to be defensible.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of the issue and the recommendation.
      *   **Background:** What is PGT-P? Current status of the request.
      *   **Scientific & Clinical Context (Settled vs. Contested):** Crucial section to meet the prompt's requirement.
      *   **Ethical Analysis:**
          *   Argument for Autonomy (The Couple's View).
          *   Argument for Non-Maleficence/Justice (The Skeptics' View).
      *   **Policy Landscape:** What are other bodies doing?
      *   **Recommendation:** Clear vote item.
      *   **Implementation:** How to communicate the decision.

  4.  **Drafting Content - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Executive Summary:* State the recommendation clearly (Decline at this time).
      *   *Background:* Define PGT-A, PGT-M, and PGT-P. Note the specific request (educational attainment).
      *   *Scientific Context:*
          *   *Settled:* PGT-P has low predictive power for individuals. Environmental factors dominate. Current GWAS data is biased toward European ancestry.
          *   *Contested:* Whether "low power" justifies a ban or just stronger counseling. Whether the tech will improve fast enough to matter soon.
      *   *Ethical Analysis:*
          *   *Pro-Autonomy:* Consistency with donor selection, PGD for disease, and socioeconomic advantages parents already seek. Slippery slope arguments are weak if the line is drawn at "medical necessity."
          *   *Pro-Restriction:* Medicalization of normal variation. Eugenics concerns (even if private). Child's right to an open future. Exacerbating social inequality.
      *   *Professional Consensus:* ASRM and ESHRE currently recommend against it outside of research. This is a key anchor.
      *   *Recommendation:* Decline the specific request and adopt a policy prohibiting PGT-P for non-medical traits until scientific validity and ethical consensus improve.
      *   *Next Steps:* Counseling for the current couple, policy review timeline.

  5.  **Refining the Tone and Nuance (Self-Correction during drafting):**
      *   *Check:* Did I present the autonomy argument fairly? *Correction:* Ensure I don't dismiss the "school district" analogy too quickly; acknowledge its logical consistency even if the conclusion differs.
      *   *Check:* Did I distinguish settled vs. contested? *Correction:* Make a specific subsection for this. Be clear that *predictive validity* is the settled weak point, while the *moral permissibility* is the contested point.
      *   *Check:* Is the recommendation actionable? *Correction:* Yes, vote to adopt a moratorium/policy.
      *   *Check:* Length? *Correction:* Keep it tight. 2-3 pages single-spaced is roughly 1000-1500 words.

  6.  **Final Review against Prompt:**
      *   Memo format? Yes.
      *   Recommend Permit/Decline/Conditions? Yes (Decline).
      *   Engage both positions? Yes.
      *   Separate settled vs. contested? Yes.
      *   Tone appropriate for EAB? Yes.

  7.  **Final Polish:** Check for clarity, professional language, and specific references to professional guidelines (ASRM/ESHRE) to bolster the argument. (Ensure I don't hallucinate specific guideline dates, but refer to their general stance which is well-known in bioethics).

  *(Self-Correction on "Settled" Science)*: I need to be careful not to say it's "settled" that it *doesn't work*. It's settled that the *current* predictive power is low. It's contested whether it will improve. I will phrase this carefully.

