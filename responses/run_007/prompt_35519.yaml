      *   *The Stakes:* Truthmakers, ontology of facts vs. lists, nature of predication.
      *   *The Stalemate:* Realists (Armstrong, etc.) vs. Anti-Realists/Primitivists (Strawson, etc.) vs. Deflationists.

  3.  **Addressing Question 1: Substantive vs. Verbal:**
      *   Is it just words? Partially. "Proposition" means different things (linguistic, mental, abstract object, fact).
      *   But underneath the terminology, there's a real ontological worry: How does *aboutness* or *truth* emerge from *stuff*?
      *   *Diagnosis:* It's not *merely* verbal, but the verbal confusion masks the substantive core. The substantive core is about *ontological commitment*. If you say "facts exist," you owe an account of their unity. If you say "only objects exist," you owe an account of predication.
      *   *Verdict:* Substantive, but obscured by category mistakes (treating logic like mechanics).

  4.  **Addressing Question 2: Background Pictures of Explanation:**
      *   This is crucial.
      *   *Side A (Analysis/Construction):* Metaphysics is like engineering. You build complex things from simple things. If there's a gap, fill it with a connector. (Leads to regress).
      *   *Side B (Primitivism/Holism):* Metaphysics describes bedrock. Some things are just unified. Explanation stops. (Stops regress but looks like magic).
      *   *Side C (Deflationism):* The demand for an explanation is category-mistaken. Logic isn't glue.
      *   *Diagnosis:* The dispute persists because there is no agreed-upon "stopping rule" for metaphysical explanation. One side demands a mechanism; the other says the demand is illegitimate.

  5.  **Addressing Question 3: Hidden Formal/Empirical vs. Bedrock Intuition:**
      *   Is there data? No. It's not empirical.
      *   Is there formal logic? Yes, but logic formalizes the structure, it doesn't solve the ontological glue problem (Frege's "unsaturatedness" attempt).
      *   *Diagnosis:* It's about bedrock intuitions regarding *composition*. Mereological sum (heap) vs. Structured whole (organism/machine). The intuition that "relations are just more objects" drives the regress. The intuition that "relations are fundamentally different" stops it but requires a primitive distinction.
      *   *Key Insight:* The regress arises from *reifying* the copula. If the copula is an object, regress follows. If it's a mode of being, regress stops. The debate is about whether we are allowed to posit "modes of being."

  6.  **Addressing Question 4: Prospects for Progress:**
      *   Can it be solved? Unlikely in the traditional sense.
      *   What counts as progress?
