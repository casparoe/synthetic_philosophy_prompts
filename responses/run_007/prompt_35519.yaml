      *   *Diagnosis:* Progress comes from dissolving the demand for a "connector." The "New Metaphysics" or "Grounding" literature might offer new vocabulary, but the structural problem remains.
      *   *Conclusion:* It's a "framework dispute." Progress is realizing it's a choice of framework, not a discovery of fact.

