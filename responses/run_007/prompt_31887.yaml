      *   However, methods like Attainable Utility Preservation (AUP) and Relative Reachability *do* exist. How do they bypass this?
      *   They don't define "intended effects" directly. They define a *baseline* and measure *deviation* in terms of *general capability* or *reachability*, not specific semantic value.
      *   The colleague's argument hinges on Step (4): "A task specification that can classify arbitrary changes is... a full specification of what we want."
      *   Is this true? AUP doesn't classify changes as "intended/unintended." It classifies them as "reducing future optionality."
      *   So, the definition of "side effect" in Step (1) might be the weak link.

