      *Let's add a layer:* He is doing this because he *can't* cry for his own dead wife. He needs the fiction to unlock the real grief.
      This adds stakes. The fiction is the key to the real emotion.
      This solves the paradox: The fiction isn't the *object* of the emotion, it's the *catalyst*.
      But the prompt asks to dramatize the paradox, not necessarily solve it.
      Let's stick to the tension. The tension between the celery stalk and the sorrow.

      *Drafting - Section by Section:*
      1.  **The Setup:** Establish the artifice. The celery, the cornstarch, the lights. Silas is the master of lies.
      2.  **The Task:** The death scene. He knows the actor, David. David is joking around outside.
