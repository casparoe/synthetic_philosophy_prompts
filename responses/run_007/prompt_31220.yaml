answer: |-
  The New Deal presents a potent stress test for Deweyan experimentalism, validating its instrumental logic while exposing significant tensions in its democratic requirements. Dewey defines inquiry as a social process where a public identifies problematic situations, tests hypotheses through action, and revises ends and means based on observed consequences. Crucially, for Dewey, democracy is not merely the voting mechanism that authorizes leaders, but the method by which the public itself organizes to understand the indirect consequences of associated life. The New Deal undeniably embraced the instrumentalist core: FDR's "bold persistent experimentation" treated policies as working hypotheses rather than dogmatic truths. However, the agency of inquiry rested almost exclusively with the administrative state and the "Brain Trust," rather than the public organizing itself.

  Analyzing specific programs reveals this split. The **National Recovery Administration (NRA)** embodied the hypothesis that industry-led code authorities would stabilize prices and wages without creating monopolistic abuse. The evidence criterion was measurable compliance, price stability, and employment levels. The administration observed massive non-compliance and stifled competition, yet revision was slow until the Supreme Court struck it down in *Schechter Poultry Corp. v. United States* (1935). The Deweyan verdict is mixed: the policy was treated as revisable, but the public was not adequately organized to perceive the indirect consequences (higher consumer prices) until crisis point. The **Agricultural Adjustment Act (AAA)** hypothesized that reducing supply would raise farm income. When the first AAA was struck down in 1936, the administration revised the means (shifting from production controls to conservation payments) while keeping the end (price stability) intact. This shows instrumental flexibility, but the inquiry was technocratic; farmers were subjects of the policy, not co-inquirers into the ecological or market consequences. The **Works Progress Administration (WPA)** offers the strongest case for experimentalism. Its hypothesis was that direct employment would stimulate demand and maintain skills. Evidence was tracked via unemployment rates and infrastructure output. The WPA was scaled up and down responsive to economic data, and unlike the NRA, it engaged locals in project selection. However, the ultimate decision-making power remained federal.

  On balance, the New Deal **largely complicates** Dewey's theory. It confirms that experimental governance is workable at scale regarding the *method* of policy (hypothesis-testing), but it reveals that Dewey's ideal of the *public* as the inquirer is fragile under conditions of crisis and complexity. The New Deal relied on administrative expertise and executive energy to conduct inquiry *for* the public, not *with* them. Dewey argues that expert knowledge must be subordinate to public judgment, yet the New Deal demonstrates that rapid, large-scale inquiry often necessitates epistemic elitism. The "public" in the 1930s was largely a recipient of relief and a viewer of Fireside Chats, rather than an organized body conducting inquiry into indirect consequences. This does not refute Dewey's normative claim that democracy *should* be inquiry, but it complicates the descriptive claim that a mass public *can* effectively function as the primary inquirer in a complex industrial state without ceding authority to experts. The episode suggests that Deweyan experimentalism requires institutional channels for public intelligence that the New Deal bypassed in favor of efficiency.

