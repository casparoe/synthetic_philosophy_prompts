prompt: |-
  So I just spent like two hours arguing with a friend about wether "the will of the people" actually means anything, and I'm still annoyed. Here's what I want: construct a thought experiment where a policy wins a clear majority in a fair vote but would clearly fail under a deliberative or Rousseau-style conception of the popular will. Constraints: realistic political scenario (a referendum on something boring like zoning or tax policy, not a sci-fi thing), no more than a paragraph, and — this is the hard part — the majority preference can't come from voters being ignorant or irrational. The divergence has to come from a structural feature of how preferences get formed when there's no deliberation, not from people being dumb. After the scenario, walk through what an aggregative conception says, what a deliberative conception says, and why they diverge. Then tell me which feature of the case is doing the real work, and what a defender of the aggregative view would say to push back.

  And please just start with the thought experiment itself — no preamble, no "here's a scenario I came up with," just the case. Then the analysis.
