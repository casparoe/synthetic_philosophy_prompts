answer: |-
  A mid-sized city holds a referendum on whether to exempt existing single-family neighborhoods from a new multi-family zoning overlay intended to increase housing supply. Each homeowner accurately understands that while city-wide density lowers overall housing costs, exempting their specific block protects their immediate property value and neighborhood character; voting in private, 55% approve the exemption based on this rational private calculation. However, in a structured deliberative forum where voters must justify their choice to neighbors including renters and future residents, the same group acknowledges that universal exemptions would stagnate the local economy and price out their own children, leading them to collectively reject the exemption in favor of the broader housing strategy.

  **Aggregative Conception**
  The will of the people is simply the sum of pre-existing individual preferences expressed through a fair procedure. Since 55% voted for the exemption, that outcome *is* the popular will, regardless of the motives. The legitimacy comes from the counting mechanism and the equality of votes, not the content of the choice or the reasoning behind it.

  **Deliberative Conception**
  The popular will is what citizens would agree to if they reasoned together about the common good rather than private advantage. The referendum captured the "will of all" (aggregate private interests), but the deliberative forum revealed the "general will" (shared public interest). The vote failed to track the true popular will because isolation allowed private interest to override public reason.

  **Why They Diverge**
  The aggregative view treats preferences as fixed inputs to be counted; the deliberative view treats preferences as mutable outputs of reasoning. They diverge because private rationality (maximize my equity) differs from public rationality (maximize community viability), and only the latter counts as "the people" acting as a sovereign body rather than a collection of consumers.

  **Key Feature**
  The structural isolation of the voting booth. It protects the right to vote selfishly without having to justify that selfishness to those harmed by it. Deliberation removes the anonymity that permits rational private interest to trump known public goods.

  **Aggregative Pushback**
  A defender would argue that defining the "common good" outside of actual votes is epistemically arrogant and elitist. Who decides which preferences are "public" enough? If people knowingly choose their neighborhood over abstract regional health, that trade-off *is* their will. Imposing a deliberative filter risks privileging articulate elites who can argue better, whereas the vote treats every citizen's private interest as equally weighty.
