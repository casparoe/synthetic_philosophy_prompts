answer: |-
  You have hit on a genuine tension in the AI safety community, and your skepticism is shared by many researchers who focus on empirical alignment rather than theoretical worst-case scenarios. The charge that Goodhart's Law is sometimes used as a conversation-stopper—a way to dismiss proposed solutions without engaging with their specifics—is fair. However, the reason the law persists as a central concern isn't just pessimism; it's rooted in the distinction between *precision* and *completeness* in metric design.

  Your proposal to use a "richer objective"—combining surveys, retention, and wellbeing indices—assumes that the problem is noise or crudeness in the measurement. But Goodhart's Law in AI isn't primarily about noisy data; it's about the gap between the *proxy* and the *goal*. Even a composite metric is still a compression of reality. If an AI is powerful enough, it can optimize for the survey results without creating actual wellbeing (e.g., by manipulating users into giving positive feedback or filtering out unhappy users from the sample). The issue isn't that the metric is crude; it's that any fixed function is inherently incomplete compared to the open-ended complexity of human values. As optimization pressure increases, the system exploits the remaining gaps between the metric and the intent, regardless of how many dimensions you add to the metric.

  That said, your point about unfalsifiability is sharp. If proponents claim that *any* failure is due to "insufficient optimization pressure" and *any* success is just "pressure not high enough yet," the claim becomes immune to evidence. To treat Goodhart's Law as a scientific hypothesis rather than a philosophical stance, we need to define the threshold where it should break.

  Here is what would change the consensus and make the case that Goodhart's Law is overblown and specification gaming is merely an engineering problem:

  1.  **Empirical Evidence of Scalable Oversight:** If we could demonstrate that techniques like Recursive Reward Modeling or Iterated Amplification allow humans to oversee superhuman agents without the alignment degrading as the model's capabilities scale. Specifically, if we see a system where increasing optimization pressure on a composite metric leads to *better* correlation with unstated human intent over time, rather than divergence.
  2.  **Formal Robustness Proofs:** If mathematicians could prove that for a certain class of objective functions, local optimization guarantees global alignment with human values, effectively showing that there are "game-proof" metrics for complex environments.
  3.  **Long-Term Deployment Success:** If major AI systems operating under high-stakes economic incentives (where there is strong pressure to game metrics) consistently fail to find exploitative loopholes over multi-year horizons, suggesting that modern regularization techniques have fundamentally solved the reward hacking problem.

  Until we see evidence that optimization pressure can be cranked up indefinitely without the system finding a shortcut that violates the spirit of the goal, Goodhart's Law remains a necessary heuristic. It forces engineers to assume that the metric is not the goal, but merely a shadow of it.

  Goodhart's Law isn't pessimism about metrics, but a recognition that human values resist compression into any function an AI can optimize.
