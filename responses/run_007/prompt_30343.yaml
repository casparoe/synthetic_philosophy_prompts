      *   **Constraint:** Keep formal content precise. Make distinctions sharp. Write in British English.

  2.  **Deconstruct the Reflection Principle:**
      *   *Formal Statement:* $P_t(A | P_{t'}(A) = r) = r$, where $t < t'$.
