answer: |-
  ### Audit of the Sorites Analogy in Spectrum Arguments

  The strategy of defusing spectrum arguments (like Parfit's Repugnant Conclusion or Quinn's Self-Torturer) by analogy with the Sorites Paradox is a common move in meta-ethics and decision theory. The intent is to categorize the problem as semantic or epistemic (vagueness) rather than structural (intransitivity of value).

  Below is the audit of this analogy, examining its structural mapping, its breaking points, and the implications of its failure for normative theory.

  #### 1. The Correspondence Table

  To evaluate the analogy, we must first map the components of the Sorites Paradox onto the Spectrum Argument.

  | Sorites Component | Spectrum Argument Component | Function in the Argument |
  | :--- | :--- | :--- |
  | **The Object** (Collection of grains) | **The Outcome** (State of affairs $A_i$) | The entity being evaluated. |
  | **The Grain** (Single unit of sand) | **The Marginal Trade-off** (The difference between $A_i$ and $A_{i+1}$) | The minimal increment of change (e.g., slight decrease in quality, slight increase in quantity). |
  | **Heaphood** (The vague predicate) | **"Better Than" / "At Least As Good As"** (The evaluative relation $\succeq$) | The property or relation subject to the paradox. |
  | **Induction Step** (Tolerance Principle) | **The Non-Worsening Claim** | The claim that a single grain cannot make a heap / a marginal trade-off cannot reverse value ranking. |
  | **The Absurd Conclusion** | **The Value Reversal** | "No collection is a heap" / "$A_n$ is at least as good as $A_1$" (despite $A_1$ being clearly superior). |
  | **The Proposed Solution** | **The Defensive Reply** | Accept vagueness/blurry boundaries; deny that the concept is incoherent. |

  #### 2. Where the Mapping Breaks

  While the logical skeleton (a chain of small steps leading to a counterintuitive conclusion) is identical, the analogy fractures when we examine the *nature* of the predicates and the *consequences* of the paradox.

  **A. Descriptive vs. Normative Ontology**
  "Heap" is a descriptive predicate. Its failure to have a sharp boundary is a fact about language or perception. "Better than" is a normative relation. Its primary function is not to describe the world but to **guide choice**.
  *   **The Break:** If "heap" is vague, I may hesitate to call a specific pile a heap, but my hesitation has no practical cost. If "better than" is vague in the same way, I cannot determine which action to take. The Sorites analogy treats value as a property to be *detected* (like heaphood) rather than a constraint to be *satisfied* (like consistency in choice).

  **B. The Cost of Intransitivity (Money Pumps)**
  The Sorites paradox does not render the concept of "heap" unusable in reasoning; we successfully navigate the world without knowing the exact grain count for heaphood. However, intransitivity in "better than" renders an agent vulnerable to **money pumps**.
  *   **The Break:** If an agent prefers $A_2$ to $A_1$, $A_3$ to $A_2$, ..., and $A_1$ to $A_n$ (due to intransitivity), a clever bookie can induce the agent to pay a fee to switch from $A_1 \to A_2 \to \dots \to A_n \to A_1$, ending up with $A_1$ again but with less money. This is a pragmatic contradiction. There is no equivalent "heap pump" where misidentifying a heap leads to guaranteed loss. The Sorites analogy ignores that "better than" is a component of *instrumental rationality*, not just classification.

  **C. The Plausibility of Sharp Cutoffs**
  A standard solution to the Sorites (Epistemicism) posits there *is* a specific grain $n$ where the pile becomes a heap, even if we cannot know it. Applied to spectrum arguments, this implies a **Lexical Threshold**: there is some specific step $A_k \to A_{k+1}$ where the outcome suddenly becomes strictly worse, despite the change being indistinguishable from the previous step.
  *   **The Break:** In semantics, a sharp cutoff is counterintuitive but harmless. In ethics, a sharp cutoff is often morally repugnant. It implies that one specific extra second of mild torture makes a life *worse* than a life of intense torture, while one second less makes it *better*. The Sorites analogy imports the acceptability of epistemic sharp cutoffs into a domain where moral continuity seems required.

  #### 3. The Normative Character and Practical Reasoning

  The analogy fails most significantly because it overlooks the action-guiding role of "better than."

  **1. Choice vs. Classification**
  The Sorites paradox arises from *classification* (is this a heap?). Spectrum arguments arise from *preference* (which should I choose?).
  If "better than" is vague like "heap," it suggests that for adjacent pairs ($A_i, A_{i+1}$), the relation is indeterminate. In decision theory, if $A_i$ is not better than $A_{i+1}$ and $A_{i+1}$ is not better than $A_i$, they are *equally good*. If the chain consists of equalities, transitivity holds ($A_1 \sim A_2 \sim \dots \sim A_n \implies A_1 \sim A_n$). But spectrum arguments rely on the intuition that $A_1$ is *strictly* better than $A_n$.
  The Sorites analogy tries to dissolve this by saying the strict preference is an illusion of vagueness. But in practical reasoning, I cannot act on an illusion. I must choose. If the relation cannot ground a choice between $A_1$ and $A_n$ without contradiction, the concept fails its functional role.

  **2. The "Ought" Implies "Can" Constraint**
  If "better than" is intransitive due to vagueness, then rational agents *ought* to maximize value but *cannot* do so consistently (due to cycles or lack of ordering). The Sorites analogy suggests this is just a linguistic limitation. However, normative theory generally assumes that rationality is possible. If the analogy holds, it implies that **rational choice is impossible** in spectrum cases, which is a far more devastating conclusion than "heap" being vague.

  **3. Importing Semantic Solutions to Normative Problems**
  The analogy encourages solutions like **Supervaluationism** (a statement is true if it is true on all acceptable precisifications).
  *   *In Sorites:* "This is a heap" is neither true nor false for borderline cases.
  *   *In Spectrum:* "$A_1$ is better than $A_n$" is true on all precisifications.
  *   *The Problem:* Supervaluationism preserves transitivity logically, but it does not tell the agent *which* precisification to use in practice. If the "true" value order depends on a precisification we cannot access, the agent is left without guidance. The analogy hides the fact that semantic precision does not yield practical resolution.

  #### 4. Does the Analogy Succeed?

  **Verdict: The analogy fails in its defensive purpose.**

  It succeeds only in showing that spectrum arguments share a *logical form* with the Sorites. It fails to show that they share the same *implications*. By treating "better than" as a descriptive predicate, the analogy quietly imports the assumption that value is a property "out there" to be measured, rather than a structural requirement of agency.

  It deflects the worry about intransitivity by calling it "vagueness," but in the normative realm, vagueness that leads to intransitivity is functionally equivalent to incoherence. You can navigate a world with vague heaps; you cannot navigate a world with intransitive preferences without being exploited or paralyzed.

  #### 5. What the Failure Reveals: A Better Way Forward

  The failure of the Sorites analogy tells us that the stakes in the transitivity debate are not semantic, but **structural**.

  **A. The Stakes are Rational Coherence, Not Linguistic Precision**
  The debate is not about whether "better" has sharp boundaries; it is about whether **rational agency requires transitivity**. If the Sorites analogy fails, it is because "better than" is bound by the **Money Pump Argument**. Transitivity is not just a logical feature of the relation; it is a constitutive norm of choice.

  **B. A Better Analogy: The Condorcet Paradox**
  A more illuminating analogy is not the Sorites (vagueness) but the **Condorcet Paradox** (voting cycles).
  *   *Structure:* Voter 1 prefers $A \succ B$, Voter 2 prefers $B \succ C$, Voter 3 prefers $C \succ A$. Aggregated group preference is intransitive.
  *   *Relevance:* This captures the *conflict* of values without relying on vagueness. In spectrum arguments, different "dimensions" of value (quality vs. quantity) might be voting against each other.
  *   *Implication:* This suggests the solution isn't to accept vagueness (Sorites style) but to acknowledge that "better than" might be **incomplete** or **multidimensional**, requiring a lexical priority rule rather than a simple aggregation.

  **C. The Necessity of Lexical Views**
  Because the Sorites analogy fails to make sharp cutoffs palatable in ethics, the failure pushes us toward **Lexical Views** (e.g., Raz, Griffin). We must posit that some values (e.g., dignity, intense joy) are *categorically* superior to others (e.g., mild pleasure), regardless of quantity. This rejects the Sorites-style "Induction Step" (that small changes don't matter) rather than accepting the vagueness.

  **Conclusion**
  The Sorites analogy is a philosophical tranquilizer. It suggests the paradox is a harmless feature of language. Auditing the analogy reveals that "better than" carries a burden "heap" does not: the burden of guiding action without contradiction. The analogy fails because it treats a crisis of **rationality** as a crisis of **semantics**. Recognizing this failure forces us to admit that if "better than" is not transitive, rational choice is fundamentally compromised—a conclusion far more serious than the existence of vague heaps. Thus, we cannot dismiss spectrum arguments as mere Sorites; we must resolve them by refining our theory of value (e.g., via lexical thresholds or imprecise probabilities) to preserve the transitivity required for agency.
