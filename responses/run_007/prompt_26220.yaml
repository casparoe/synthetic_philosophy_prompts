      *   *Arbitrariness:* The loss landscape has multiple basins of attraction. The global optimum isn't unique. Switching to a different basin yields similar returns.
      *   *Common Knowledge:* In Lewis, this is epistemic. In MARL, this is often "Shared State" or "Centralized Critic." But strictly, it's about the *belief* about others' policies.
