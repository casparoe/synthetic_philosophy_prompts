answer: |-
  ### The move described

  The argumentative pattern you have identified operates by isolating a complex phenomenon, stripping it of its functional or psychological context, and reconstructing it solely through a literalist decomposition of its linguistic label. The agent begins by stipulating a definition that requires mutually exclusive states to hold simultaneously—for example, defining self-deception as the simultaneous conscious knowledge of a truth and the conscious belief in its falsehood. Having established this definition as the sole criterion for the concept's existence, the agent demonstrates that the definition entails a logical contradiction. From this impossibility, they conclude that the phenomenon itself is illusory or non-existent. Crucially, this move bypasses any empirical investigation into whether a coherent psychological mechanism exists that matches the *functional role* of the concept. Instead, it treats the semantic tension within the label as a metaphysical veto on the reality of the thing labeled. The strategy effectively conflates the impossibility of a specific, maximalist definition with the impossibility of the underlying phenomenon, thereby dissolving a substantive debate about human psychology into a trivial semantic victory.

  ### Nearest existing concepts

  This pattern bears a strong family resemblance to the **Straw Man fallacy**, yet it diverges in a critical way regarding the source of the distortion. In a classic Straw Man, an arguer misrepresents an opponent's specific position to make it easier to attack; the distortion is ad hoc and targeted at a person or a specific claim. In the move you describe, the distortion is not necessarily aimed at an opponent's specific view but at the concept itself. As you noted, the extreme definition often has some foothold in common parlance or philosophical history; it is not a pure fabrication. However, it is an uncharitable selection among competing definitions. While a Straw Man attacks a weak version of an opponent's argument, this move attacks the strongest possible *literal* version of a concept to kill the concept entirely. It differs because it claims to be clarifying the "true meaning" of the term rather than misrepresenting a person's claim, leveraging the ambiguity of language rather than the weakness of an argument.

  It also shares DNA with the **No True Scotsman** and **Motte-and-Bailey** fallacies, though the direction of movement is distinct. In a No True Scotsman, an arguer protects a universal claim from counterexamples by arbitrarily redefining the category to exclude the counterexample post-hoc. In your pattern, the redefinition happens pre-emptively to exclude the phenomenon entirely. Similarly, a Motte-and-Bailey involves retreating from a controversial claim (the Bailey) to a defensible one (the Motte) when challenged. Here, the arguer does the opposite: they fortify themselves in the impossible, controversial definition (the Bailey) and refuse to retreat to the functional, defensible version (the Motte). They are not trying to save a claim about the world; they are trying to eliminate a concept from the ontology. They hold the impossible definition not because they believe it is true, but because its impossibility is the weapon they need to declare the phenomenon illusory.

  Finally, the move is closely related to **Begging the Question** (petitio principii) and what philosophers call a **Verbal Dispute**. In begging the question, the conclusion is assumed in the premises. Here, the conclusion (that self-deception is impossible) is built into the stipulative definition (that self-deception requires logical contradiction). If you define X as "a square circle," you have guaranteed that X cannot exist without needing to look at the world. This overlaps with verbal disputes, where parties argue about the definition of a word rather than the facts of the matter. However, this move is more aggressive than a standard verbal dispute. It does not merely pause to clarify terms; it uses the terminological clarification as a trump card to dismiss empirical reality. It treats the etymology or literal semantics of a phrase as a higher authority than psychological observation, assuming that if the words don't fit together perfectly, the reality cannot exist.

  ### Does it have a name?

  Despite its prevalence in philosophical debates regarding free will, consciousness, and morality, there is no single, canonical Latin name for this specific maneuver in standard logic textbooks. It is often discussed under the broader umbrella of **Eliminativism** or **Conceptual Analysis**, but these describe philosophical stances rather than the argumentative tactic itself. Some philosophers refer to it as a "definitional stop," a term popularized by Ludwig Wittgenstein and later Daniel Dennett, where an inquiry is halted by insisting on a rigid definition rather than looking at usage. Others might categorize it under **Semantic Stipulation** used destructively. In the context of free will debates, incompatibilists who define free will as requiring contra-causal liberty are sometimes accused of engaging in **Conceptual Perfectionism**, but this is not a standardized fallacy name. The lack of a specific label likely stems from the fact that the move sits on the boundary between a logical error and a substantive metaphysical disagreement about whether folk concepts should be revised or discarded.

  ### Proposed name and definition

  I propose calling this maneuver **The Eliminative Stipulation**. This term captures the two core components: the use of a stipulative definition (one asserted by fiat rather than empirical observation) and the eliminative goal (seeking to prove the non-existence of the phenomenon). The **Eliminative Stipulation** occurs when an arguer defines a phenomenon strictly by the literal conjunction of its constituent words or its most paradoxical folk-intuition, demonstrates that this conjunction is logically or metaphysically impossible, and concludes that the phenomenon does not exist, while ignoring functionalist or mechanistic accounts that resolve the paradox. The key boundary case distinguishes this from legitimate conceptual analysis. If a concept is truly incoherent (like "married bachelor"), the Eliminative Stipulation is a valid proof of non-existence. However, if the concept refers to a complex functional state (like "self-deception" or "free will") where the literal words are metaphorical or shorthand for a process, employing the Eliminative Stipulation is fallacious. It treats a label as a blueprint rather than a tag.

  To further clarify the boundaries, consider the difference between "witchcraft" and "self-deception." If one defines a witch as "a woman who casts spells via supernatural power," and then argues witches don't exist because supernatural power is impossible, this is a legitimate use of the move; the definition tracks the essential claim of the phenomenon. However, if one defines "memory" as "a perfect video recording stored in the brain," and then argues memory doesn't exist because brains don't store video, this is an illegitimate Eliminative Stipulation. The error lies in selecting a definition that fails to track the functional reality of the thing being named. The fallacy is committed when the stipulation prioritizes semantic purity over explanatory utility. It becomes a tool for dismissing messy realities because they do not fit into neat linguistic boxes. The test for whether the move is fallacious is whether the definition provided is the only way the concept is understood or used in the relevant domain (e.g., psychology, law, ethics). If the definition ignores the standard operational usage in favor of a literalist deconstruction, it is an Eliminative Stipulation.

  ### Is it ever legitimate?

  There are contexts where insisting on a demanding definition is not only legitimate but necessary, specifically when the concept in question is purely normative, logical, or defined by its essential properties rather than its functional outcomes. In mathematics and logic, if a definition entails a contradiction, the object defined cannot exist; there is no "functional" version of a square circle to be found. Similarly, in ethics or law, if a concept is defined by specific criteria (e.g., "murder" requires "malice aforethought"), demonstrating that those criteria are not met legitimately excludes the concept from applying, even if a killing occurred. The move becomes fallacious only when applied to natural kind concepts or complex psychological phenomena where the label is a placeholder for a mechanism rather than a literal description. If the goal is **conceptual engineering**—improving our concepts to better track reality—then challenging a contradictory definition is useful. However, if the goal is **ontological denial**—claiming the underlying reality doesn't exist simply because the label is imperfect—the move is cheating. The criterion for legitimacy is thus: does the definition serve to clarify a reality that exists independently of the word, or does it use the word to veto the reality? If the latter, it is an illegitimate Eliminative Stipulation.
