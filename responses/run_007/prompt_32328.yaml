  Some arguments for longtermism hold that we should accept substantial present-day costs in order to shape the far future, because even a very small probability of influencing an astronomically large number of future lives can dominate an expected-value calculation. Critics regard this style of reasoning as a form of fanaticism. Please explain the most important implications of the simulation argument for this debate. In particular, discuss whether the hypothesis that we ourselves are living in a simulation should mainly weaken the empirical assumptions behind far-future fanaticism, mainly reinforce it by adding another vast population of morally relevant beings, or change the debate in some more specific way, and defend your assessment. Please answer in American English.
