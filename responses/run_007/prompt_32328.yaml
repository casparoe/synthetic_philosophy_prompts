      *   **Simulation Argument (SA):** Proposed by Nick Bostrom. At least one of these is true: (1) Civilizations go extinct before reaching post-human stage, (2) Post-human civilizations have no interest in running ancestor simulations, (3) We are almost certainly living in a simulation.
      *   **Intersection:** How does the possibility that we are in a simulation affect the calculation of whether to invest in the long-term future?

