answer: |-
  The debate between longtermism and its critics often centers on expected value theory. Longtermists argue that because the potential number of future lives is astronomically large, even a minuscule probability of positively influencing that future justifies significant present-day sacrifices. Critics label this "fanaticism," arguing that it relies on fragile probability estimates that are easily manipulated (a problem akin to Pascal's Mugging). The Simulation Argument, most famously formulated by Nick Bostrom, introduces a radical uncertainty about the nature of our reality. While one might initially think that the possibility of simulated minds simply adds more moral weight to the calculus (reinforcing longtermism), a closer analysis suggests that the Simulation Hypothesis primarily **weakens the empirical assumptions behind far-future fanaticism**. It does so by undermining the causal leverage we have over the future and by introducing a high probability of premature termination, thereby reducing the expected size of the future we can influence.

  To understand why the Simulation Argument weakens rather than reinforces the fanaticism charge, we must first address the intuition that it might reinforce it. Proponents of the "reinforcement" view argue that if ancestor simulations are common, the total population of morally relevant beings is vastly larger than physicalist estimates suggest. If simulated minds count morally, the "stakes" of our actions increase. However, this reasoning conflates the *current* population with the *future* population that longtermism seeks to protect. Longtermist fanaticism relies on the premise that we can secure an *enduring* future where civilization expands to fill the light cone. If we are living in a simulation, the "far future" is not a physical expansion into the cosmos but a computational runtime controlled by entities in a base reality. The existence of more simulated minds today does not guarantee a longer duration for the simulation tomorrow. Therefore, simply adding simulated beings to the moral count does not validate the specific longtermist claim that present sacrifices will yield astronomical future returns.

  The primary way the Simulation Argument weakens the case for far-future fanaticism is by attacking the reliability of causal leverage. Standard longtermist interventions, such as reducing existential risk from nuclear war or unaligned artificial intelligence, assume a physicalist causal chain: if we prevent a catastrophe today, civilization continues, colonizes space, and generates trillions of lives. However, if we are in a simulation, our causal power is restricted to the parameters set by the simulators. Our efforts to build starships or secure nuclear arsenals might be irrelevant if the simulation is designed to end at a specific historical juncture (e.g., the 21st century) or if the simulators intervene to reset the timeline. In this scenario, the probability ($P$) that a specific present-day action influences the astronomical future drops precipitously. Fanaticism requires a robust link between action and outcome; the Simulation Hypothesis severs this link, rendering expected value calculations highly unstable.

  Furthermore, the Simulation Argument introduces a specific "termination risk" that drastically reduces the expected value ($V$) of the future. In base reality, a civilization might theoretically persist for billions of years. In a simulation, the duration is limited by the computational resources and interests of the simulators. Ancestor simulations are typically run to study specific historical periods, not to simulate the heat death of the universe. If there is a non-negligible probability that we are in such a simulation, the expected duration of the future shrinks from billions of years to perhaps mere centuries. When calculating expected value ($EV = P \times V$), a massive reduction in $V$ (the size of the future) neutralizes the astronomical stakes that longtermists rely on to justify present-day costs. If the future is likely to be "shut off" computationally, the argument for sacrificing the present generation loses its mathematical force.

  Some might argue that the Simulation Argument does not weaken or reinforce the debate but rather **changes it** by shifting the focus to "simulator ethics." On this view, we should act in ways that please the simulators to ensure the simulation continues. While this technically alters the *method* of influencing the future, it ultimately circles back to weakening the fanaticism argument. Optimizing for simulator approval is epistemically opaque; we have no data on what simulators value. This introduces a layer of uncertainty far greater than standard existential risk analysis. Fanaticism is criticized for relying on speculative probabilities; building a moral framework on the unknowable preferences of post-human simulators is even more speculative. Consequently, this shift does not save the expected value calculation; it makes it too uncertain to support the substantial present-day costs demanded by strong longtermism.

  In defense of the assessment that the Simulation Argument mainly weakens far-future fanaticism, one must recognize that the fanaticism critique is fundamentally about epistemic humility. Critics argue that we cannot confidently assign probabilities to extreme outliers. The Simulation Hypothesis validates this skepticism by showing that our fundamental understanding of the timeline and causal structure of the universe might be wrong. If we accept the Simulation Argument, we must admit that the "astronomical future" is not a default physical trajectory but a contingent computational outcome. This admission lowers the confidence level required for rational decision-making. You cannot justify "substantial present-day costs" based on a high-variance gamble where the rules of the game might change or end without warning.

  In conclusion, while the Simulation Argument expands the ontology of possible beings, its net effect on the longtermism debate is to undermine the empirical confidence required for far-future fanaticism. It does not merely add more people to the equation; it challenges the stability of the equation itself. By suggesting that the future may be shorter than it appears and that our causal leverage over it is illusory or restricted, the Simulation Hypothesis reduces the expected value of long-term interventions. Therefore, rather than providing a new avenue for fanatical sacrifice, the Simulation Argument serves as a skeptical check, reinforcing the critics' view that we should be wary of betting the present on highly speculative models of the far future.
