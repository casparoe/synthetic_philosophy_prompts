      *   *Option B: Weaken (Undermine Empirical Assumptions).*
          *   Argument: If we are in a simulation, the "far future" we are trying to influence might not exist. The simulation could be turned off. The laws of physics might not hold indefinitely. The link between present action and long-term outcome is severed or made uncertain.
          *   Counter: Even in a simulation, there is a future *within* the simulation.

      *   *Option C: Change the Debate (Structural/Epistemic Shift).*
