  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar in metaethics.
      *   **Topic:** Expressivism and the Frege-Geach Problem (Ayer, Stevenson, Hare, Geach, Searle, Blackburn).
      *   **Goal:** Create a final exam essay question that distinguishes rote memorization from deep understanding.
      *   **Specific Constraints:**
          *   One essay question (50-minute in-class limit).
          *   Must push beyond standard presentation (truth-aptness/embedding) into deeper terrain (compositionality, validity, attitude individuation, semantic values vs. expressivist commitment).
          *   Model answer (600-800 words).
          *   Marking scheme (20-point scale: A, B, C ranges + common mistakes).

  2.  **Deconstruct the Frege-Geach Problem (FGP):**
      *   *Surface Level:* Moral sentences appear in unasserted contexts (conditionals, questions). Expressivism says they express attitudes. You can't have an attitude in an unasserted context. Therefore, expressivism fails to explain logical validity (e.g., Modus Ponens).
      *   *Deep Level:* It's about the *unity of content*. The content of "Stealing is wrong" in "Stealing is wrong" must be the same as in "If stealing is wrong, then..." for the argument to be valid. Expressivism traditionally ties content to *force* (expressing an attitude). If force changes (assertion vs. supposition), does content change? If content is the attitude itself, how do I "have" the attitude hypothetically?
      *   *The Tension:* To solve FGP, expressivists often assign semantic values (truth-conditions or commitment conditions) to moral sentences. But if moral sentences have standard semantic values, how is this different from realism/cognitivism? Is "quasi-realism" just realism in disguise?

  3.  **Drafting the Question:**
      *   *Attempt 1:* Explain the Frege-Geach problem and how Blackburn solves it. (Too standard, invites summary).
      *   *Attempt 2:* Does the Frege-Geach problem show expressivism is false? Discuss. (Too vague).
      *   *Attempt 3 (Closer):* Blackburn argues we can solve FGP without abandoning expressivism. But does assigning semantic values to moral sentences turn expressivism into cognitivism?
      *   *Refining for Depth:* I need to force the student to choose between *what* is being explained (logic vs. psychology) and *how* (semantics vs. pragmatics). Let's focus on the cost of the solution.
      *   *Final Polish:* "Simon Blackburn argues that expressivism can solve the Frege–Geach problem without collapsing into cognitivism. However, critics contend that any solution robust enough to secure logical validity inevitably assigns moral sentences truth-apt content, thereby abandoning the core expressivist insight. Evaluate this tension. Specifically, does a successful expressivist semantics require distinguishing the *content* of a moral judgment from the *attitude* expressed, and if so, does this distinction preserve or undermine the expressivist project?"
      *   *Wait, let's make it tighter for 50 mins.* Focus on the "price" of the solution.
      *   *Selected Question:* "The Frege–Geach problem is often presented as a technical difficulty regarding logical embedding. However, at its core, it challenges the expressivist account of the *unity of content* across asserted and unasserted contexts. Evaluate the following claim: 'Any expressivist solution to the Frege–Geach problem that successfully secures logical validity inevitably assigns moral sentences a propositional content independent of the speaker's attitude, thereby collapsing the distinction between expressivism and cognitivism.' In your answer, discuss whether the 'content' of a moral judgment must be distinct from the 'attitude' expressed to solve the problem, and what this implies for the viability of quasi-realism."

  4.  **Drafting the Model Answer:**
      *   *Goal:* Show argumentative structure, not just summary. Needs to engage with the "collapse" objection.
      *   *Structure:*
          1.  Intro: Define FGP not just as embedding, but as the challenge to the attitude/content link. State thesis (The tension is real, but quasi-realism attempts to walk the line by redefining 'truth' and 'content' functionally).
          2.  The Core Challenge: Explain *why* embedding threatens expressivism (the van Roojen/Wedgwood point about attitude types). If "Wrong" means "Boo," what does "If wrong" mean? "If Boo"? That's nonsense. So we need a content that persists.
          3.  The Cognitivist Trap: If we give it persistent content (propositions), aren't we cognitivists?
          4.  The Expressivist Defense (Blackburn/Gibbard): Distinguish *semantic content* from *psychological state*. We can have a logic of attitudes (commitments). Validity is about consistency of attitudes, not truth-preservation.
          5.  Critical Evaluation: Does this work? It saves the logic, but does it save the *metaphysics*? The "collapse" objection holds if 'truth-apt' just means 'plays the truth-role.' But expressivists argue truth is deflated.
          6.  Conclusion: The distinction is preserved only if one accepts a deflationary account of truth/content. If one demands robust representational content, expressivism collapses.
      *   *Word Count Check:* Need to keep it tight (600-800 words). Focus on the *argument*, not history.

  5.  **Drafting the Marking Scheme:**
      *   *Scale:* 20 points.
      *   *A Range (17-20):* Nuanced grasp of the content/attitude distinction. Engages with the "collapse" objection. Mentions validity as consistency of attitude vs. truth preservation.
      *   *B Range (13-16):* Good explanation of FGP. Explains Blackburn's solution. Misses the deeper philosophical implication (the collapse objection).
      *   *C Range (9-12):* Standard textbook summary. "Moral sentences aren't truth apt." "Geach says they embed." "Blackburn says quasi-realism." Lacks critical evaluation.
      *   *Common Mistakes:* Confusing FGP with disagreement. Thinking "Boo/Hooray" logic solves it automatically.

  6.  **Review and Refine:**
      *   *Question:* Is it clear? Yes. Is it hard? Yes.
      *   *Model Answer:* Does it sound like a smart undergrad/grad student? Needs to be precise. Avoid saying "Blackburn solves it." Say "Blackburn *argues*..."
      *   *Marking Scheme:* Ensure the distinctions between bands are sharp. The key differentiator is understanding *why* the solution threatens the theory (the collapse objection).

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't just summarize Blackburn. I need to evaluate the *claim* in the prompt. The prompt asks to evaluate the claim that solving FGP *collapses* expressivism. The model answer should take a stance or show the complexity of that stance. I will argue that it threatens *classical* expressivism but quasi-realism attempts to redefine the terms to avoid collapse.

      *(Self-Correction on Marking Scheme)*: Make sure to explicitly mention the "unity of content" issue. That's the philosophical heart.

  7.  **Final Polish:** Check word counts and tone. Ensure the prompt instructions are followed exactly. (1) Question, (2) Model Answer, (3) Marking Scheme.

      *Wait, one more check on the Model Answer length.* 600-800 words is roughly 1 to 1.5 single-spaced pages. I need to be concise.
      *Check on Marking Scheme:* 20 points total. A: 17-20, B: 13-16, C: 9-12. Need to account for D/F implicitly or just focus on the passing ranges as requested. I will focus on the requested ranges but imply lower scores for major failures.

      *Let's refine the Question slightly for maximum clarity.*
      "Evaluate the following claim: 'Any expressivist solution to the Frege–Geach problem that successfully secures logical validity inevitably assigns moral sentences a propositional content independent of the speaker's attitude, thereby collapsing the distinction between expressivism and cognitivism.'"
      This is good. It forces them to tackle the "price" of the solution.

      *Let's refine the Model Answer.*
      Start with the problem of unity. Move to the cognitivist accusation. Discuss the expressivist reply (logic of attitudes). Conclude on the deflationary move.

      *Let's refine the Marking Scheme.*
      Be specific about "attitude individuation" and "semantic values."

      *Ready to write.*
answer: |-
  (1) Essay Question

  **Evaluate the following claim:**

  > "Any expressivist solution to the Frege–Geach problem that successfully secures logical validity inevitably assigns moral sentences a propositional content independent of the speaker's attitude, thereby collapsing the distinction between expressivism and cognitivism."

  In your answer, discuss whether the *content* of a moral judgment must be distinct from the *attitude* expressed to solve the problem of embedding. Does a successful expressivist semantics require abandoning the core idea that moral utterances function primarily to express non-cognitive states, or can "quasi-realism" sustain this distinction without inconsistency?

  ***

  (2) Model Answer

  The claim that solving the Frege–Geach problem forces expressivism to collapse into cognitivism targets the deepest tension in metaethics: the relationship between semantic content and psychological force. To evaluate this, one must look beyond the surface issue of grammatical embedding and examine what logical validity requires of moral sentences.

  The Frege–Geach problem arises because expressivism traditionally identifies the meaning of a moral sentence with the expression of a non-cognitive attitude (e.g., "Stealing is wrong" means *Boo stealing*). The difficulty is not merely that moral sentences appear in unasserted contexts like conditionals ("If stealing is wrong..."). The deeper issue is the *unity of content*. For an argument like Modus Ponens to be valid, the term "wrong" must contribute the same semantic value in both the premise ("Stealing is wrong") and the conditional premise ("If stealing is wrong..."). If the meaning of "wrong" is tied to the *act* of expressing an attitude, it is unclear what meaning it retains in the unasserted context where no attitude is expressed. If the content changes between contexts, the argument commits the fallacy of equivocation.

  To secure validity, the expressivist seems forced to assign moral sentences a stable semantic content that persists across asserted and unasserted contexts. This looks suspiciously like the cognitivist's proposition. If "Stealing is wrong" has a content that can be hypothesized, negated, or embedded, that content appears to be truth-apt in the standard sense. This generates the "collapse objection": if expressivists grant moral sentences propositional content to save logic, they have surrendered the defining feature of their theory—that moral judgments are not beliefs about the world but expressions of conative states.

  However, sophisticated expressivists like Simon Blackburn and Allan Gibbard resist this collapse by redefining the nature of validity and content. They argue that we need not adopt realist truth-conditions to secure validity. Instead, we can construct a logic of *attitudes* or *normative commitments*. On this view, validity is not defined as truth-preservation (since moral sentences lack robust truth conditions) but as *consistency of attitudes*. An argument is valid if holding the premises' attitudes while rejecting the conclusion's attitude constitutes a pragmatic inconsistency or a fragmentation of the mind.

  This move attempts to preserve the expressivist insight while solving the technical problem. The "content" of the moral sentence is not a representation of a moral fact but a functional role within a system of planning or emotive expression. Blackburn's quasi-realism argues that we can earn the right to talk of moral "truth" and "facts" deflationarily. To say "It is true that stealing is wrong" is just to reaffirm the attitude *Boo stealing*. Thus, moral sentences behave *as if* they are propositional without positing moral properties.

  Does this sustain the distinction? It depends on one's tolerance for deflationism. If "propositional content" simply means "that which embeds and participates in logic," then expressivism does collapse, but only because cognitivism has been deflated alongside it. However, if "cognitivism" requires robust representational content (belief states that track mind-independent facts), expressivism remains distinct. The expressivist assigns semantic values to moral sentences, but these values are understood in terms of their role in guiding action and coordinating attitudes, not describing reality.

  Therefore, the claim in the prompt is partially correct but ultimately relies on a robust conception of "propositional content." A successful expressivist semantics does assign systematic semantic values to moral sentences, which looks cognitivist on the surface. Yet, it avoids collapsing into *robust* cognitivism by maintaining that the fundamental nature of the judgment is conative, not cognitive. The distinction is preserved only if one accepts that logic and truth can be understood functionally rather than representationally. If one insists that logical validity requires robust truth-conditions, then expressivism cannot solve Frege–Geach without self-destruction. But if validity is a matter of consistency in commitment, quasi-realism offers a coherent, non-collapsing path.

  ***

  (3) Marking Scheme (20 Points)

  **A-Range (17–20 points): Excellent**
  *   **Core Argument:** Identifies that the Frege–Geach problem is fundamentally about the *unity of content* across asserted/unasserted contexts, not merely grammatical embedding.
  *   **The Collapse Objection:** Clearly articulates *why* solving the problem threatens expressivism (i.e., assigning stable semantic values looks like assigning truth-conditions/propositions).
  *   **Expressivist Defense:** Accurately explains the quasi-realist move (e.g., Blackburn/Gibbard) to redefine validity as *consistency of attitudes/commitments* rather than truth-preservation.
  *   **Critical Evaluation:** Engages with the deflationary strategy. Recognizes that the "collapse" depends on how one defines "proposition" or "truth." Distinguishes between *robust* cognitivism and *deflated* truth-aptness.
  *   **Structure:** Argument is tight, precise, and directly answers the prompt without unnecessary biographical or historical summary.

  **B-Range (13–16 points): Good**
  *   **Core Argument:** Correctly explains the Frege–Geach problem (embedding and validity).
  *   **The Collapse Objection:** Notes that giving moral sentences semantic content makes them look like propositions.
  *   **Expressivist Defense:** Describes Blackburn's or Gibbard's solution (e.g., logic of attitudes) but may treat it as a straightforward fix rather than a philosophical tension.
  *   **Critical Evaluation:** Lacks depth on the *cost* of the solution. May assert that quasi-realism works without explaining *how* it avoids cognitivism (e.g., fails to mention deflationism or the redefinition of validity).
  *   **Structure:** Clear and organized, but may rely more on exposition of the readings than independent argumentation.

  **C-Range (9–12 points): Adequate/Basic**
  *   **Core Argument:** Provides a standard textbook summary of the Frege–Geach problem (e.g., "Moral sentences aren't truth-apt, so they can't be in conditionals").
  *   **The Collapse Objection:** Mentions cognitivism vs. expressivism but treats them as simple opposites without engaging the nuance of semantic values.
  *   **Expressivist Defense:** Vaguely mentions "quasi-realism" or "Blackburn" without explaining the mechanism (e.g., says "Blackburn solves it" without explaining the logic of attitudes).
  *   **Critical Evaluation:** Little to no evaluation of the claim in the prompt. Concludes with a summary rather than a judgment.
  *   **Structure:** May be disorganized or spend too much time on Ayer/Stevenson rather than the specific logical problem.

  **Common Student Mistakes & Grading Penalties:**

  1.  **Confusing Frege–Geach with Moral Disagreement:**
      *   *Mistake:* Discussing how expressivism explains disagreement (e.g., "If I say Boo and you say Hooray, we aren't disagreeing") instead of logical embedding/validity.
      *   *Penalty:* This indicates a fundamental misunderstanding of the prompt. Cap at **10 points (C-)** regardless of writing quality, as it fails to address the specific philosophical problem requested.

  2.  **The "Boo/Hooray" Logic Fallacy:**
      *   *Mistake:* Claiming that simply creating logical operators for "Boo" and "Hooray" (e.g., "Boo(Boo stealing)") automatically solves the problem without addressing the *unity of content* or the charge of collapse.
      *   *Penalty:* Shows surface-level understanding. Prevents entry into the A-range. Max **14 points (B-)**.

  3.  **Ignoring the "Collapse" Claim:**
      *   *Mistake:* Explaining the Frege–Geach problem and Blackburn's solution perfectly, but failing to evaluate the specific claim in the prompt (i.e., does this solution *collapse* the theory?).
      *   *Penalty:* Fails to answer the specific question asked. Limits score to **15 points (B)** even if the exposition is accurate.
