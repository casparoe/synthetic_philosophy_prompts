answer: |-
  You have hit on one of the most profound and genuinely difficult problems in both AI alignment and the philosophy of mind. You are right to feel that "reward ambiguity" doesn't quite capture it; reward ambiguity usually assumes the environment dynamics (beliefs) are known and asks if multiple reward functions could produce the same policy. Your point is deeper: **the dynamics (beliefs) and the objective (preferences) are entangled, and you cannot disentangle them from behavior alone.**

  Yes, this has a name. In fact, it has two: one in philosophy and one in technical AI literature.

  ### 1. The Philosophical Name: The Problem of Radical Interpretation

  You were spot on about Donald Davidson. In the philosophy of language and mind, this is known as the **Problem of Radical Interpretation**.

  Davidson argued that there is no way to measure a person's beliefs independently of their desires (preferences), nor their desires independently of their beliefs. They are holistically interdefined.
  *   If I see you reaching for a fridge, I can only infer you *want* food if I assume you *believe* there is food in the fridge.
  *   But I can only infer you *believe* there is food in the fridge if I assume you *want* food.

  Davidson's solution to this circularity was the **Principle of Charity**. To break into the loop, the interpreter must *assume* the agent is largely rational and that their beliefs are largely true (by the interpreter's own lights). You have to project your own epistemic framework onto them to get a foothold.

  Daniel Dennett approaches this similarly with the **Intentional Stance**. He argues that we treat entities as rational agents governed by beliefs and desires because it is the most efficient predictive strategy, not because we have accessed their "true" internal states. The "entry point" is pragmatic utility, not ontological truth.

  ### 2. The Technical Name: The Identifiability Problem (or Unidentifiability)

  In the AI and IRL literature, this is formally known as the **Identifiability Problem** regarding beliefs and rewards.

  While early IRL papers (like Ng & Russell, 2000) focused on the ambiguity of rewards given known dynamics, later work realized that if the agent's planning process (which encodes their beliefs and rationality) is unknown, the reward function is **unidentifiable**.

  The seminal paper you need to read is:
  **"Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents" by Armstrong and Mindermann (2018).**

  Their main theorem essentially proves exactly what you have intuited:
  > Without knowing the agent's planning algorithm (which maps beliefs + rewards to actions), it is impossible to infer the reward function from behavior, even with infinite data.

  They show that for any observed behavior, you can construct a "degenerate" pair of beliefs and rewards that explains it. For example, an agent could be:
  1.  **Rational** with Reward A and Beliefs B.
  2.  **Anti-rational** (trying to minimize reward) with Reward -A and Beliefs B.
  3.  **Rational** with Reward A' and Beliefs B' (where B' is a delusion that action X achieves Y).

  All three produce the exact same actions. There is no mathematical way to distinguish them from behavior alone.

  ### 3. How it relates to "Reward Ambiguity"

  It is helpful to distinguish the two:
  *   **Reward Ambiguity:** "Given that I know how the world works and how you think, there are multiple goals you could be pursuing." (This is solvable with priors or more data).
  *   **The Identifiability/Circularity Problem:** "I don't know how you think or how you see the world, so I can't even define the space of possible goals." (This is unsolvable without external assumptions).

  Your insight is that **Reward Ambiguity is a subset of the Identifiability Problem.** You cannot resolve ambiguity if you cannot first identify the variables.

  ### 4. What should you call it?

  If you are writing an essay or discussing this in your module, you have a few strong options depending on the flavor you want:

  *   **The Belief-Reward Identifiability Problem:** This is the most precise technical term.
  *   **The Davidsonian Knot:** A more philosophical shorthand referencing the circularity of propositional attitudes.
  *   **The Degeneracy of Mental State Attribution:** This borrows from neuroscience/physics, implying multiple underlying configurations produce the same observable output.

  ### 5. Why did the lecturer move on?

  The lecturer likely nodded and moved on because, in the context of standard IRL coursework, this is the "No Free Lunch" theorem. It implies that **pure IRL is impossible.**

  To make progress, AI alignment researchers have to cheat (in a necessary way). They break the circle by assuming:
  1.  **Shared Beliefs:** We assume the AI and human share a common world model (e.g., "opening a window lets air in").
  2.  **Rationality Priors:** We assume the human is roughly Boltzmann-rational (noisy but directed), rather than systematically perverse.
  3.  **Cooperative IRL (CIRL):** We assume the human is *trying* to teach the AI, which adds a communicative layer that breaks the symmetry.
  4.  **Side Channels:** We use language, eye-tracking, or brain imaging to get belief-data that isn't purely behavioral.

  ### Summary

  You have independently rediscovered a core result in both philosophy of mind and AI safety.
  *   **Philosophy:** Davidson's **Radical Interpretation**.
  *   **AI:** Armstrong & Mindermann's **Unidentifiability of Rewards**.
  *   **The crux:** You cannot infer preferences from behavior without assuming a prior over beliefs/rationality.

  If you want to impress your lecturer, mention **Armstrong & Mindermann (2018)** and ask how current alignment proposals justify their **priors over human rationality** to break the identifiability deadlock. That is the cutting edge of the debate.
