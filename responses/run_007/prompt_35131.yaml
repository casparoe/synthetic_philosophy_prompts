answer: |-
  The central design move is to force students to vote on sacrificing a peer's raffle entry under two structural conditions: one where the loss is a byproduct of redirecting a threat, and one where the loss is the instrument required to stop the threat.

  ### Reasoning
  Students dismiss the trolley problem because they treat it as a math problem (1 < 5) or a hygiene problem (touching is icky). By using a tangible stake (raffle tickets for a desirable prize) and isolating the *mechanism* of the sacrifice while keeping the outcome identical, you bypass their rehearsed answers. They must confront why using a person (or their property) feels different than harming them incidentally, even when the cost is the same. This creates the phenomenological groundwork for the Doctrine of Double Effect (DDE) without the jargon.

  ### Materials & Setup
  *   **Materials:** 16 envelopes, 16 slips of paper ("Raffle Tickets"), 1 box, 1 high-value prize (e.g., $20 coffee card or premium chocolates), 2 labeled bins ("Void" and "Safe"), 1 prop lever (can be a ruler taped to a box).
  *   **Stakes:** Each student receives one envelope with a ticket upon entering. Tell them: "At the end of class, one ticket will be drawn from the 'Safe' bin. The holder wins the prize. Tickets in the 'Void' bin are destroyed."
  *   **Room:** Arrange chairs so there is a clear "front" where the bins and lever are.

  ### 75-Minute Timeline

  **0:00–0:05 | Setup & Stakes (No Theory)**
  *   Distribute envelopes. Explain the raffle rules clearly.
  *   State the ground rule: "We are going to run two scenarios where some tickets are at risk. You will vote on how to handle the risk. Your votes are binding."
  *   Do not mention trolleys, ethics, or philosophy yet.

  **0:05–0:20 | Round 1: The Redirect (Switch Structure)**
  *   **The Threat:** Announce that a "System Glitch" has randomly selected 5 tickets (draw 5 names/envelopes from the box). These 5 are currently in the "Danger Zone."
  *   **The Choice:** "I can pull this lever to redirect the Glitch. If I pull it, the Glitch targets 1 different random ticket instead. The original 5 are moved to the 'Safe' bin. The 1 new target goes to the 'Void' bin."
  *   **The Vote:** Show of hands. Who pulls the lever?
  *   **Execution:** If the vote passes, draw 1 new name from the remaining 11. Move the 5 to Safe, the 1 to Void. Destroy the 1 ticket visibly.
  *   **Reaction:** Ask the class: "How did that feel?" (Keep it brief, 2 mins).

  **0:20–0:35 | Round 2: The Blocker (Footbridge Structure)**
  *   **Reset:** Return all remaining tickets to the box. (Or use a fresh set if you want to keep stakes high, but destroying them adds realism. *Recommendation:* Use fresh tickets for Round 2 so everyone still has a chance, but acknowledge the previous loss).
  *   **The Threat:** Announce the "System Glitch" has again randomly selected 5 tickets.
  *   **The Choice:** "I cannot redirect the Glitch this time. However, I can stop it completely if I insert 1 random ticket from the remaining group into the 'Blocker Slot.' That ticket is destroyed to jam the mechanism. The 5 threatened tickets are moved to 'Safe'."
  *   **The Vote:** Show of hands. Who sacrifices the ticket to stop the Glitch?
  *   **Execution:** If the vote passes, draw 1 name from the remaining 11. Take their ticket and put it in the "Void" bin explicitly as the *method* of saving the 5.
  *   **Reaction:** Ask: "How did this feel compared to Round 1?"

  **0:35–0:55 | Small Group Discussion**
  *   Divide into groups of 4.
  *   **Prompt:** "The outcome was identical in both rounds (5 saved, 1 lost). Why did the vote counts differ? Why did the loss feel different? Was it about the lever vs. the slot, or something else?"
  *   **Task:** Each group must produce one sentence explaining the moral difference they felt.

  **0:55–1:15 | Debrief & Mapping**
  *   Collect group sentences.
  *   **Introduce the Terminology:** Now introduce "Doctrine of Double Effect."
  *   **Map the Activity:**
      *   **Round 1 (Switch):** The harm to the 1 was *foreseen* but not *intended*. The intention was to save the 5; the loss was a side effect of redirecting the threat.
      *   **Round 2 (Footbridge):** The harm to the 1 was *intended* as a *means*. The loss was the instrument used to achieve the save.
  *   **Connect to Classic Cases:** Explain that Round 1 mirrors the Switch Case (redirecting threat), and Round 2 mirrors the Footbridge Case (using the person).
  *   **Close:** Ask if this distinction justifies the different voting patterns.

  ### Cost/Payoff Scheme
  *   **Currency:** Raffle Tickets.
  *   **Sting:** The destruction of the ticket is public and irreversible. The winner is drawn only from the "Safe" bin. If a student's ticket is voided, they are visibly excluded from the prize.
  *   **Why it stings:** It creates a temporary "in-group" (Safe) and "out-group" (Void). Even though it's just candy/coffee, the public exclusion triggers social loss aversion.

  ### Predictable Failures & Handling
  1.  **Failure:** Students argue, "It's utilitarian either way; 5 > 1. Why are we fussing?"
      *   **Handle:** Ask, "If the logic is identical, why did the vote count drop in Round 2?" Force them to account for their own hesitation.
  2.  **Failure:** Students claim the difference is just "physical contact" (touching the ticket in Round 2).
      *   **Handle:** Remind them you handled the ticket in both rounds. Ask, "Did the ticket *cause* the save in Round 1? Or did it just get hit? In Round 2, was the ticket *used*?"
  3.  **Failure:** Students feel manipulated or angry about losing their ticket.
      *   **Handle:** Acknowledge the discomfort. "Good. Ethical theory should feel like something when it touches real stakes. That discomfort is the data."
  4.  **Failure:** The vote is unanimous in both cases (either all yes or all no).
      *   **Handle:** If unanimous, pivot the discussion to *why* everyone agreed. If everyone said "Yes" to both, ask: "Does that mean the distinction doesn't matter, or that the stakes were too low?" If everyone said "No," ask: "Is it ever okay to use someone as a means?"

  ### Limitations of the Activity
  *   **Moral Weight:** This activity cannot reproduce the inviolability of human life. Sacrificing a raffle ticket is disanalogous to killing a person. Students may correctly note that property rights are fungible in a way lives are not.
  *   **Consent:** In the classic trolley problem, the victims do not consent. In this classroom activity, students implicitly consented to the game by staying in class. You must acknowledge this: "In the real thought experiment, the one person doesn't agree to be on the track. Here, you agreed to the raffle rules. That changes the moral landscape, but the structural distinction remains."
  *   **Agency:** The instructor physically moves the tickets. In the Footbridge case, the agent usually pushes the person. By keeping the instructor as the agent, you mute the "personal force" variable, which is good for isolating DDE, but students might conflate the two. Be precise in your language during the debrief about *intention* vs. *action*.
