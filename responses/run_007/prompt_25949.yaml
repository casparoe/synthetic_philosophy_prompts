      *Wait, one nuance on Move 6/7:* He says love needs reasons (features of the person). She says those are internal reasons. He implies utilitarianism can account for this. She says utilitarianism accounts for them only *instrumentally*. This is the key. I need to make sure this is clear. The utilitarian values the humor *because* it produces utility. The lover values the humor *because* it is hers/it is good in itself within the relationship.

