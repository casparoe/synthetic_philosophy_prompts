          *   Use the concept of "Constitutional Patriotism" (Habermas) or "Integrity" (Dworkin). The bond isn't the specific rules, but the commitment to the *process* of reasoning together.
          *   Connect back to the prenup: A good prenup isn't just a trap; it's a clear set of rules for dissolution that prevents worse conflict. A good constitution prevents civil war/tyranny.
