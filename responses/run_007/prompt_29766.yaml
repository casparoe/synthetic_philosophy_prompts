prompt: |-
  You are a professional philosopher specializing in epistemology, the philosophy of mind, and the norms of assertion. I am drafting a position for a graduate seminar and need a rigorous consistency audit before I circulate it. Please think carefully and systematically: begin by working through the implications of each commitment and the interactions between each pair of commitments, distinguishing real conflicts from merely apparent ones, and only then give your final verdict.

  Here is the package I currently hold.

  (1) Assertion is governed by a knowledge norm: a speaker is entitled to assert that p only if she knows that p.

  (2) Moore-paradoxical assertions — utterances of the schema p, but I do not believe that p — are defective for a purely epistemic reason: the asserted content cannot be known, and this unknowability is the complete explanation of why such utterances cannot properly be made.

  (3) Moore-paradoxical beliefs are irrational, and the right explanation is the transparency of belief: from the deliberative standpoint, the question whether I believe that p is settled by settling whether p, so one cannot coherently judge both that p and that one does not believe that p.

  (4) Asserting that p expresses the belief that p; this is part of what distinguishes asserting from merely uttering a sentence.

  (5) A fully satisfying account of Moore's paradox should explain the defective assertion and the irrational belief by a single underlying mechanism. A view that offers one story for the assertion case and a different story for the belief case should count that disunity as a serious cost.

  (6) The KK principle is false: one can know that p while not being in a position to know that one knows that p.

  Please audit this set. Specifically: identify which pairs are in genuine tension, which pairs merely appear to be in tension, and which pairs support one another; for each genuine tension, say how severe it is, which commitment or commitments would have to give, and what the cheapest revision would be; rank the tensions by severity rather than treating them all as equally serious; and then say which single revision would do the most to restore coherence and what that revision would cost elsewhere in the package.

  I am not asking for an introduction to Moore's paradox or a survey of the literature. I want a precise internal audit of this particular set of commitments, and I want you to separate real problems from illusory ones. Do not tell me the set is fine unless it really is; if something has to go, say what and why.
