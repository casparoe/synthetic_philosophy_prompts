answer: |-
  You are not missing a step, and your skepticism is well-founded. You have correctly identified the mathematical equivalence: **Maximizing the Kelly criterion is mathematically identical to maximizing expected utility with a logarithmic utility function of wealth.**

  If your friend is arguing that everyone *intrinsically* values wealth logarithmically, they are making a psychological claim that is empirically false. People have varied risk profiles.

  However, the "Geometric Rationality" crowd (heavily influenced by physicist Ole Peters and the LessWrong community) argues that the justification for Kelly isn't about *psychology* (utility), but about *physics* (ergodicity).

  Here is the breakdown of where your friend is right, where they are overreaching, and what the actual "missing step" argument is.

  ### 1. The Mathematical Truth: It Is Log Utility
  You are correct. In the standard von Neumann–Morgenstern Expected Utility Theory (EUT) framework, if you maximize $E[\ln(W)]$, you arrive at the Kelly bet. If you maximize $E[W]$ (linear utility), you bet everything on any positive expected value bet.

  If rationality is defined strictly as "consistency with your own preferences," then Kelly is only rational for those who happen to prefer log wealth. If you prefer linear wealth, Kelly is irrational for you.

  ### 2. The Ergodicity Argument (The "Missing Step")
  The argument your friend is likely making relies on **ergodicity economics**. This is the core of the "Geometric Rationality" pitch.

  *   **Ensemble Average (Standard EV):** Standard expected value calculates the average outcome across many parallel universes. In one universe, you win big; in another, you go bust. The average might be high.
  *   **Time Average (Geometric Growth):** We do not live in an ensemble of parallel universes. We live in one timeline. We experience events sequentially.

  In **additive** dynamics (e.g., picking up \$10 bills), the time average equals the ensemble average. But in **multiplicative** dynamics (e.g., investing, betting a percentage of your bankroll), they diverge.

  In a multiplicative process, if you bet too much and hit a losing streak, your bankroll shrinks. To recover, you need a percentage gain on a smaller base. If you hit zero, you cannot recover. The "ensemble average" might say you're rich, but the "time average" says you're bankrupt.

  **The Claim:** Maximizing the geometric mean (Kelly) isn't a *preference*; it's the only way to maximize the growth rate of wealth *in time*. If you maximize arithmetic expected value in a multiplicative world, you will almost surely go to zero eventually.

  Therefore, the argument goes: **Kelly is objectively rational for any agent who wants to remain in the game.**

  ### 3. Instrumental vs. Normative Rationality
  This is where the "sleight of hand" you suspected usually hides.

  *   **Normative Claim:** "You *should* value money logarithmically." (This is false/controversial).
  *   **Instrumental Claim:** "Regardless of what you value, if your goals require resources in the future, you must avoid ruin. Kelly avoids ruin best in multiplicative environments."

  The rationalist argument is usually instrumental. They argue that for almost any human goal (saving lives, building AI, enjoying retirement), **survival** is a prerequisite. You cannot achieve your utility function if you are bankrupt or dead.

  Because the Kelly criterion maximizes the long-run growth rate and minimizes the time to reach financial goals while avoiding ruin, it is the optimal *instrumental* strategy for almost any *terminal* goal.

  ### 4. Where Your Friend Is Overreaching
  Even with the ergodicity argument, there are limits to the "Kelly is universal" claim.

  **A. One-Shot Bets**
  Kelly is derived for *repeated* bets. If you have a one-off opportunity to bet your life savings on a 60% coin flip that pays 2:1, and you never get to bet again, Kelly might be too conservative. If you have linear utility over the outcome (e.g., you need \$1M to save a village, and you have \$500k), maximizing expected value might be the moral choice, even if it risks ruin.

  **B. Non-Wealth Utility**
  Kelly applies to wealth. If your utility function is not about wealth accumulation but about something else, the mapping breaks. For example, in existential risk reduction, the "bankroll" is humanity. We only have one shot. Some argue this calls for *more* aggression than Kelly, not less, because the "game" ends if we lose anyway.

  **C. Diminishing Marginal Utility is Real, but Varied**
  While log utility is a good heuristic for wealth (an extra \$1,000 means more to a poor person than a billionaire), it is not a universal law. Some people are risk-neutral; some are risk-seeking. Declaring Kelly the "One True Rationality" dismisses legitimate variations in human preference.

  ### 5. Summary: The Verdict
  You are right to be suspicious of the leap from "strategy" to "norm."

  *   **What you are missing:** The ergodicity argument. It suggests that maximizing expected log wealth is not just a risk preference, but a requirement for surviving multiplicative dynamics in a single timeline.
  *   **What your friend is missing:** The distinction between instrumental and normative rationality. Kelly is a superior *tool* for long-term survival, but it does not dictate what you *should care about*.

  **The Synthesis:**
  Geometric rationality is best understood as a constraint on **strategies**, not **values**.
  *   **Values:** You can value whatever you want (linear, log, step-function).
  *   **Strategies:** If your values depend on having resources in the future, and you operate in a multiplicative environment, you should *act as if* you have log utility to ensure you survive long enough to realize those values.

  Your friend is trying to sell a robust heuristic for survival as a universal moral imperative. That is the sleight of hand. Kelly is the optimal way to drive the car, but it doesn't tell you where you should want to go.
