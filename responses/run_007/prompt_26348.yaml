  ok so i've been trying to get my views straight on the nonidentity problem and obligations to future people, and i want a consistency check before i commit to anything in writing. here's the set of things i find myself believing:

  (1) the nonidentity problem is a real structural challenge — it's not just a confusion that dissolves once you draw the right distinctions.

  (2) i'm drawn to a narrow person-affecting view: an act can be wrong only if it harms (or makes things worse for) some particular person. i don't think there's such a thing as impersonal badness, and i don't think "the world is worse" is a reason anyone has, independently of it being worse for someone.

  (3) i think the 14-year-old girl in parfit's case acts wrongly when she chooses to have a child now rather than waiting, even though the child she has now will have a life worth living and wouldn't have existed otherwise.

  (4) i think there's a genuine moral difference between the risky policy and the safe policy — it matters whether the very same people who end up existing are the ones made worse off by the choice. the no-difference view seems wrong to me.

  (5) i think we have strong, action-guiding obligations to adopt aggressive climate policy for the sake of people who will live in 200 years, even though those particular people wouldn't exist under a different policy.

  (6) i accept the time-dependence claim: which particular future people come to exist is highly sensitive to what we do now (who meets whom, which sperm meets which egg, etc.), so different policies mean different people.

  i genuinely don't know which of these i'd give up if i had to — i'm not secretly hoping you'll tell me to drop one in particular. what i want is: which pairs are genuinely in tension, which only look like they are, and what's the least costly revision? rank the tensions by severity rather than treating them all as equally bad, and for each real tension say specifically what has to go to resolve it and what the philosophical cost of that move is.

  write back in plain continuous prose, no bullet points or headings or tables, like a normal email.
