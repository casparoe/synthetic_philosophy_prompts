answer: |-
  Subject: Re: Consistency check on nonidentity problem views

  Hi there,

  It is great that you are mapping this out before committing to paper, because the set of beliefs you have laid out is a classic example of what makes the nonidentity problem so stubborn. You have essentially captured the exact set of intuitions that Parfit argued were mutually inconsistent, and while each one feels compelling on its own, holding all of them simultaneously creates a logical knot that you will need to untie. I want to walk you through where the tensions lie, rank them by how threatening they are to your overall position, and outline what you would have to sacrifice to resolve them.

  The most severe and structurally definitive tension in your set is the contradiction between your commitment to the narrow person-affecting view in belief two, the time-dependence claim in belief six, and your intuitive judgments in beliefs three and five. If you accept belief six, which says that different policies bring different people into existence, then the child born to the fourteen-year-old girl and the people living in two hundred years under a lax climate policy would not have existed had you chosen differently. If you then hold to belief two, which states that an act is wrong only if it makes some particular person worse off, you are logically forced to conclude that neither the girl nor the climate policymakers are acting wrongly. This is because those particular people are not worse off than they would otherwise have been; in the alternative scenario, they would not exist at all, and having a life worth living is better than never existing. This directly contradicts belief three, where you say the girl acts wrongly, and belief five, where you say we have strong obligations to future people despite the identity shift. You cannot maintain that wrongness requires harming a particular person while also claiming that acts are wrong in cases where no particular person is harmed compared to their alternative. This is the core of the nonidentity problem, and it is the most critical inconsistency because it strikes at the definition of moral wrongness in your framework.

  To resolve this primary tension, you have two main options, both of which carry significant philosophical costs. The first option is to give up belief two and abandon the narrow person-affecting view. This would allow you to say that an act can be wrong even if it does not make any particular existing or future person worse off, perhaps because it brings about a state of affairs that is impersonally worse or because it violates a duty to bring about the best possible people. The cost here is that you must accept some form of impersonal badness, which many find metaphysically queer or alienating because it detaches morality from the welfare of specific individuals. The second option is to give up beliefs three and five. This means accepting the counterintuitive conclusion that the fourteen-year-old girl does not act wrongly and that we have no obligations based on harm to specific future people in climate cases. The cost here is moral absurdity; it renders your ethical framework unable to condemn clearly reckless behavior simply because of the timing of conception, which most philosophers find an unacceptable price to pay for consistency.

  A secondary but still significant tension exists between belief four and the combination of beliefs two and six. You state in belief four that you reject the no-difference view and think it matters whether the very same people are made worse off. However, if you maintain belief two and belief six, you are effectively forced into a version of the no-difference view anyway, or at least a view where identity differences completely exonerate the agent. If identity changes in every long-term policy case due to belief six, and wrongness requires harming specific people due to belief two, then long-term policy choices become morally neutral compared to short-term ones where identity is fixed. This undermines the spirit of belief four, which seems to want to preserve a moral distinction without letting the agent off the hook. If you keep beliefs two and six, you must accept that there is a massive moral difference between same-person and different-person cases, specifically that the latter are permissible. If you want to maintain belief five, which insists on obligations in different-person cases, you are again pressured to soften belief two or reject the moral significance of identity changes in belief four. The cost of resolving this is either accepting that identity changes wipe out obligations, which conflicts with belief five, or admitting that identity does not matter as much as you think, which conflicts with belief four.

  Belief one is largely meta-theoretical and does not create a direct contradiction with the others, as acknowledging the nonidentity problem is a real challenge is compatible with holding inconsistent views about how to solve it. However, if you resolve the tensions by dropping belief two or belief three, you might find that belief one loses some of its force for you, since you will have effectively dissolved the problem rather than solving it within the original constraints. The least costly revision generally accepted in contemporary literature is to modify belief two into a wide person-affecting view or a hybrid view that allows for obligations to future people without fully embracing impersonal values. This allows you to keep beliefs three, five, and six intact while avoiding the metaphysical baggage of pure impersonalism. However, you must be clear that this requires redefining what it means to harm or benefit someone to include comparisons across possible different people, which is a significant theoretical move.

  In summary, your current set of beliefs is inconsistent because the narrow person-affecting view cannot support the obligations you want to affirm in cases where identity depends on the act. The most severe tension is between your definition of wrongness and your judgments about the girl and climate policy. To fix this, you will likely need to relax the constraints of the narrow person-affecting view, as the cost of denying the wrongness of the girl's action or our climate obligations is too high for most practical ethical frameworks. I hope this helps you clarify where you stand before you start writing.

  Best wishes
