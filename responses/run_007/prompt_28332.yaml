answer: |-
  Here are the desiderata for a theory of translation under formal constraint. They are structured to define the boundary conditions of the problem you have identified: where form is function, and the medium is part of the message.

  ### I. The Desiderata

  **1. Propositional Fidelity (The Semantic Floor)**
  *   **Requirement:** The theory must account for the preservation of the text's core propositional content. It must define a threshold below which the translation ceases to be a version of the source and becomes a new work inspired by it.
  *   **The Case:** A translation of Marot's poem that describes a healthy woman dancing, rather than a sick one resting, fails regardless of how perfectly it mimics the three-syllable line. The theory must explain why "sense" is not merely decorative, even when form is paramount. It must distinguish between *variation* (acceptable) and *contradiction* (unacceptable).

  **2. Structural Isomorphism (The Architectural Constraint)**
  *   **Requirement:** The theory must specify which structural features are constitutive of the work's identity. It cannot treat all formal features as equal; it must distinguish between the *scaffolding* (e.g., line count, stanza shape) and the *decoration* (e.g., specific vowel sounds).
  *   **The Case:** In the Marot example, the 28-line count and the couplet structure are scaffolding. A theory that allows a translation to expand to 40 lines to accommodate rhymes fails to recognize that the constraint *is* the subject. The theory must explain why the container matters as much as the contained.

  **3. Prosodic Correspondence (The Kinetic Energy)**
  *   **Requirement:** The theory must address the physical experience of reading—the rhythm, tempo, and breath. It must explain how to map the *energy* of the source prosody into the target language, even if the exact metric system differs.
  *   **The Case:** French is syllable-timed; English is stress-timed. A theory that demands exact syllable counts in English may produce a mechanical, dead rhythm. The theory must account for how to reproduce the *effect* of the tri-syllabic brevity (urgency, lightness, fragility) without necessarily enslaving the English to a syllable count that destroys its natural stress patterns.

  **4. Pragmatic Equivalence (The Social Vector)**
  *   **Requirement:** The theory must accommodate shifts in register, address, and social relationship that are encoded grammatically or lexically. It must explain how to translate relationships, not just words.
  *   **The Case:** The shift from *vous* to *tu* in Marot's poem marks a midpoint intensification of intimacy. English lacks this grammatical distinction. A theory that ignores this collapses a crucial dramatic arc. It must offer a mechanism for compensating for this loss (e.g., through lexical choice, syntax, or tone) rather than declaring it untranslatable.

  **5. Semiotic Integrity (The Self-Reference)**
  *   **Requirement:** The theory must handle elements where the text refers to itself or its own construction (puns, acrostics, hidden names). It must define the status of "hidden" information that is visible in the source but invisible in the target.
  *   **The Case:** Marot tucks his name into the poem. If the translation does not hide the translator's name (or the author's) in the same way, is it a failure? The theory must decide whether such features are essential to the work's identity or merely clever ornaments. It must explain the cost of making the hidden visible (via footnotes) versus keeping it hidden (via adaptation).

  **6. Aesthetic Coherence (The Target-Language Object)**
  *   **Requirement:** The translation must function as a viable aesthetic object in the target language. It cannot be a collection of successful local solutions that form a disastrous whole.
  *   **The Case:** A translation might successfully rhyme every couplet and keep the syllable count, but if the resulting English is archaic, awkward, or comical where the original is tender, the theory has failed. The theory must prioritize the *reader's experience* of the translation as a poem, not just the translator's success in solving puzzles.

  ---

  ### II. The Tensions (Incompatibilities)

  A robust theory must not only list requirements but map the fault lines where they break against one another. These are not merely difficulties; they are logical conflicts where satisfying one desideratum physically precludes satisfying another.

  **1. The Rhyme vs. Syntax Tension**
  *   **Conflict:** Satisfying *Structural Isomorphism* (rhyme scheme) often forces violations of *Propositional Fidelity* or *Aesthetic Coherence*.
  *   **The Reality:** In moving from Language A to Language B, the available rhyme words change. To find a rhyme in English for "sick," you might need "quick," "brick," or "click." None may fit the semantic context. To force the rhyme, you must distort the syntax or the meaning.
  *   **Theoretical Choice:** A theory must state whether a near-rhyme (slant rhyme) with accurate meaning is superior to a perfect rhyme with distorted meaning. It cannot claim both are equally achievable.

  **2. The Meter vs. Idiom Tension**
  *   **Conflict:** Satisfying *Prosodic Correspondence* (meter/length) often violates *Aesthetic Coherence* (naturalness).
  *   **The Reality:** Strict adherence to a syllable count in a target language with different rhythmic rules can produce "translationese"—language that scans but does not speak.
  *   **Theoretical Choice:** The theory must decide if the *visual* constraint (count) outweighs the *aural* constraint (rhythm). If the English sounds clunky to preserve the French syllable count, has the form been honored or betrayed?

  **3. The Pragmatic vs. Literal Tension**
  *   **Conflict:** Satisfying *Pragmatic Equivalence* (the *tu/vous* shift) often requires violating *Propositional Fidelity* (adding words or changing tone).
  *   **The Reality:** To signal the shift to intimacy in English, you may need to add qualifiers ("my dear," "listen") that are not in the source text. This adds semantic content that wasn't there.
  *   **Theoretical Choice:** Is it better to add words to save the relationship dynamic, or keep the word count exact and lose the dynamic? The theory must rank these losses.

  **4. The Transparency vs. Visibility Tension**
  *   **Conflict:** Satisfying *Semiotic Integrity* (the hidden name) often violates *Aesthetic Coherence*.
  *   **The Reality:** If you force the letters M-A-R-O-T into an English poem where they don't naturally fit, the surrounding words may become nonsensical. If you explain the trick in a footnote, you destroy the "hidden" nature of the device.
  *   **Theoretical Choice:** The theory must determine if the *secret* is for the reader to find, or for the scholar to know. It cannot be both in a translated context without compromise.

  ---

  ### III. Classification: Non-Negotiable vs. Contingent

  To help you assess existing theories, here is the distinction between requirements that define the task and those that define a specific methodology.

  **Non-Negotiable (Constitutive of the Task)**
  *   **Aesthetic Coherence:** The translation must work as a text in the target language. If it is unreadable, it is not a translation; it is a cipher.
  *   **Propositional Floor:** The core subject matter cannot be inverted. A poem about illness cannot become a poem about health.
  *   **Structural Recognition:** The theory must acknowledge the constraint. It cannot pretend the form doesn't exist. Even if it chooses to break the form, it must account for the break.

  **Contingent (School-Specific or Purpose-Driven)**
  *   **Exact Syllable Count:** This is often a preference of formalist schools. A theory may allow line *length* (visual or temporal) to substitute for strict syllable counting.
  *   **Perfect Rhyme:** Slant rhyme, assonance, or rhythmic closure may be acceptable substitutes depending on the theory's view of "music."
  *   **The Hidden Name:** Some theories will argue this is a parlor trick that should be sacrificed for sense; others will argue it is the key to the poem and must be recreated at all costs. This is a value judgment, not a linguistic fact.
  *   **Foreignization vs. Naturalization:** Whether the translation should sound "translated" (preserving the foreign syntax) or "native" (smoothing the edges) is a strategic choice, not a theoretical necessity.

  ### IV. Summary Specification

  An adequate theory of translation under formal constraint must not promise reconciliation where none exists. It must not claim that form and sense can always be perfectly aligned.

  Instead, it must provide a **calculus of loss**. It must tell you, before you begin, which constraints are rigid and which are elastic. It must define what constitutes a "successful failure"—where a translation admits it cannot keep the rhyme, but explains what it kept instead (e.g., the rhythm, or the wit).

  For a novelist, the critical takeaway is this: The theory must treat your sentence not as a vessel of information, but as a **score for performance**. The translation is a new performance of that score in a different acoustic. The desiderata above ensure that the theory evaluates the performance, not just the notes.
