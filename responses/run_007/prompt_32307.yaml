          *   *Normativity:* CoG is descriptive. The Self is normative (responsibility, authenticity).
          *   *Reflexivity:* The CoG doesn't know it's a CoG. The Self knows it's a Self (self-representation).

      *   **Part 3: Do the Disanalogies Break the Conclusion?**
          *   *Friend's Conclusion:* Deep metaphysical questions dissolve.
