      *   **Task:** Reconstruct the *implicit theory of life* presupposed by actual astrobiological practice (instruments, biosignatures, controls, announcement protocols). Identify where practice is underdetermined (different definitions lead to same hardware). Explore how practice would change under alternative definitions (metabolism-first, information-processing, 'lyfe'). Focus on the "residue" – what practice reveals that definitions obscure.
      *   **Tone/Style:** Professional, insightful, philosophical but grounded in engineering/science reality.
      *   **Language:** British English (e.g., "operationalise," "programme," "colour," "analyse").

  2.  **Deconstruct the "Implicit Theory of Life" in Current Practice:**
      *   *What do we actually measure?* We measure chemistry, structure, and energy.
      *   *What does this imply?*
          *   **Carbon Chauvinism (mostly):** We look for organics.
          *   **Water Dependency:** Solvent assumptions are baked into sampling systems.
          *   **Earth-Envy:** We look for things that look like Earth life (amino acids, lipids, nucleobases).
          *   **Disequilibrium:** We assume life creates thermodynamic anomalies.
          *   **Complexity/Specificity:** We assume life creates specific patterns (chirality, chain lengths) distinct from abiotic chemistry.
      *   *The Implicit Definition:* Life is a *thermodynamic anomaly* manifested through *specific molecular complexity* in an *aqueous medium*. It's less about "evolution" (which is historical) and more about "pattern" (which is instantaneous).

  3.  **Identify Underdetermination:**
