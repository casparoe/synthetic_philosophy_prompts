          *   Lyfe: Thermal imaging, solvent-independent structural analysis.
      *   *Section 4: The Announcement Protocol:* How we claim discovery reveals we need *exclusion of abiotic processes* rather than *confirmation of evolution*. It's a legalistic burden of proof, not a biological one.
      *   *Conclusion:* Summarise the "residue." We are building "Anomaly Detectors," not "Life Detectors."

  6.  **Refining the Language (British English Check):**
