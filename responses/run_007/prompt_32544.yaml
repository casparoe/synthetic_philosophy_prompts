prompt: |-
  i'm a planetary scientist working on a mission concept for an icy moon — think Europa or Enceladus. we're designing instruments to detect 'life' but i keep running into the problem that nobody on the team can agree what we're actually looking for. the working definition in our field is the NASA one, "Life is a self-sustaining chemical system capable of Darwinian evolution," but when you try to operationalise that into a set of instrument requirements, honestly it falls apart. like, how do you build a spectrometer that detects 'capable of Darwinian evolution'? you can't. so you end up looking for proxies.

  here's what i want you to do. take the actual practice of life-detection in astrobiology — the kinds of instruments we fly, the biosignatures we target (chirality, isotopic fractionation, complex organic polymers, redox disequilibrium, that sort of thing), the way we design controls, the way we'd actually announce a detection — and reconstruct the implicit theory of life that the practice presupposes. not what we say we're committed to in the glossy proposal, but what the practice actually commits us to once you read it off the hardware and the protocols. where is the practice underdetermined such that several quite different definitions of life would license the same instrument choices? and what would we have to change about how we do life-detection if we adopted a metabolism-first definition instead of an evolution-first one, or a definition based on information-processing, or something like the 'lyfe' framework that allows for non-aqueous solvents and non-Darwinian evolution? i'm less interested in the definitional debate itself than in what the practice reveals that the definitions dont — the bits we're actually relying on when we spend the money and build the hardware. that's the residue i want extracted.

  write the answer in British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

