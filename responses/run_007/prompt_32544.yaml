answer: |-
  This is a profoundly astute observation, and one that rarely makes it into the public-facing mission documentation. You have identified the epistemic gap between the *political definition* of life (the NASA standard, which is useful for grant committees and legal frameworks) and the *operational definition* of life (what the mass spectrometer actually cares about).

  When you strip away the rhetoric of "Darwinian evolution" and look strictly at the hardware, the sampling protocols, and the statistical thresholds required for a press conference, a different theory of life emerges. It is not a theory of history or reproduction; it is a theory of thermodynamics and information density.

  Here is an reconstruction of the implicit theory of life presupposed by current astrobiological practice, the points of underdetermination, and how the hardware would shift under alternative frameworks.

  ### 1. The Implicit Theory: Life as a Chemical Anomaly

  If we read the theory off the hardware—specifically the suite of instruments typically proposed for an Enceladus or Europa lander (mass spectrometers, microscopes, Raman spectrometers, gas chromatographs)—we are not building machines to detect evolution. We are building machines to detect **statistical improbability in chemical space.**

  The practice commits us to three core tenets that differ significantly from the NASA definition:

  **A. Life is a Thermodynamic Disequilibrium**
  The NASA definition mentions "self-sustaining," but the instruments measure *disequilibrium*. We look for redox gradients, unexpected ratios of isotopes (e.g., $^{12}\text{C}$ vs $^{13}\text{C}$), or chemical species that should not coexist stably without a continuous energy input.
  *   **The Residue:** The implicit theory is that life is a *dissipative structure*. We are not looking for a "creature"; we are looking for a local violation of entropy expectations. If we find a plume with a chemical composition that suggests rapid recombination of oxidants and reductants, we flag it. The hardware assumes life is essentially a heat engine that leaves a chemical exhaust note distinct from abiotic geochemistry.

  **B. Life is a Filter of Molecular Complexity**
  Consider a mass spectrometer looking for amino acids or lipids. Abiotic chemistry (e.g., Fischer-Tropsch type synthesis) produces a distribution of organics that follows a power law or a geometric progression. Biology, conversely, is specific. It selects *this* amino acid, not *that* one; *this* chain length, not *that* one.
  *   **The Residue:** The implicit theory is that life is a *selection mechanism*. We assume biology occupies a tiny, specific volume of possible chemical configuration space. Our instruments are designed to measure "specificity" (e.g., homochirality) rather than "function." We assume that if a sample shows high specificity (low entropy in molecular distribution), it is biological.

  **C. Life is Temporally Stable but Chemically Active**
  Our sampling protocols often involve heating samples (pyrolysis) or dissolving them. We assume the biosignatures are robust enough to survive launch, cruise, and landing, yet labile enough to be detected.
  *   **The Residue:** The implicit theory treats life as *fossilisable information*. Even when looking for extant life, we are often looking for the structural remnants of it (polymers, cell walls). We are effectively treating extant life as a "fresh fossil." This presupposes that life must have a structural component that resists immediate thermal equilibration.

  **Summary of the Implicit Theory:** Current practice does not operationalise "Darwinian evolution." It operationalises **"Complex Chemical Disequilibrium."** We are looking for a system that maintains a low-entropy state in a high-entropy environment using specific carbon-based machinery.

  ### 2. Where Practice is Underdetermined

  You asked where the practice is underdetermined such that different definitions license the same instrument choices. This is the crux of the ambiguity in your team's debates.

  **The Chirality Trap**
  *   **Instrument:** A polarimeter or a chiral gas chromatograph.
  *   **Darwinian View:** Homochirality is required for template replication (enzymes fitting substrates).
  *   **Metabolism-First View:** Homochirality might emerge from autocatalytic surfaces or polarised light interactions without replication.
  *   **Lyfe View:** A non-Darwinian dissipative structure might still select one enantiomer simply because it packs more efficiently or dissipates energy better in that specific solvent.
  *   **The Underdetermination:** If you detect 90% L-amino acids, the instrument reading is identical. The hardware cannot distinguish between a replicating cell, a self-sustaining metabolic cycle, or a strange crystalline dissipative structure. The *interpretation* changes, but the *requirement* for a chiral sensor remains constant across all three theories.

  **The Polymer Assumption**
  *   **Instrument:** High-resolution mass spectrometry (e.g., Orbitrap-style) looking for high-mass organics.
  *   **Darwinian View:** We need nucleic acids or proteins for information storage.
  *   **Metabolism-First View:** We might find complex catalytic peptides that don't store information but facilitate reactions.
  *   **The Underdetermination:** Both require long-chain organics. A mass spec detects mass-to-charge ratios. It cannot tell you if the polymer is coding for something (information) or just catalysing something (metabolism). By funding a mass spec, you are funding a "Complex Organic Detector," not a "Genome Detector."

  **The Isotopic Fractionation**
  *   **Instrument:** Tunable Laser Spectrometer.
  *   **Darwinian View:** Enzymes prefer lighter isotopes.
  *   **Abiotic View:** Certain kinetic chemical reactions also fractionate isotopes.
  *   **The Underdetermination:** We rely on the *magnitude* of fractionation to distinguish biology from geology. But this is a threshold choice, not a theoretical one. If we set the threshold at 20‰, we might miss slow-metabolising 'lyfe'. If we set it at 50‰, we might include abiotic photochemistry. The instrument is the same; the 'definition' of life is hidden in the data analysis pipeline's cutoff values.

  ### 3. How Hardware Would Change with Alternative Definitions

  If you were to honestly redesign the payload based on alternative definitions, the mission architecture would shift dramatically. The fact that we *don't* do this reveals that we are secretly committed to the "Earth-like Chemical Anomaly" model.

  **A. If we adopted a Metabolism-First Definition**
  *   **Theory:** Life is a self-sustaining network of chemical reactions (e.g., reverse Krebs cycle) regardless of replication.
  *   **Current Hardware Failure:** Mass spectrometers destroy the sample to analyse it. They give you an inventory, not a rate.
  *   **Required Hardware:** You would need **microfluidic calorimeters** and **flux sensors**. You need to incubate the sample with potential substrates and measure heat output or chemical turnover *in real-time*. You are looking for *activity*, not *inventory*.
  *   **Mission Change:** You need a lander that can maintain samples at in-situ pressure and temperature for weeks, feeding them nutrients and watching for consumption. A flyby plume sampler is useless for metabolism-first, as you cannot measure flux in a dispersed plume.

  **B. If we adopted an Information-Processing Definition**
  *   **Theory:** Life is a system that encodes, stores, and transmits information (Shannon information) to resist entropy.
  *   **Current Hardware Failure:** We look for specific polymers (DNA/proteins). We do not measure *complexity* independent of chemistry.
  *   **Required Hardware:** You would need **nanopore sequencers** capable of reading *any* linear polymer, not just nucleic acids, coupled with algorithmic complexity analysis (e.g., measuring Kolmogorov complexity of the sequence).
  *   **Mission Change:** The focus shifts from "what elements are present?" to "what is the sequence structure?" You might prioritise high-resolution imaging of molecular chains over bulk chemical composition.

  **C. If we adopted the 'Lyfe' Framework (e.g., Schulze-Makuch et al.)**
  *   **Theory:** Life is a system that maintains a non-equilibrium state via dissipation, potentially in non-aqueous solvents, without necessarily evolving via natural selection.
  *   **Current Hardware Failure:** Our instruments are water-centric. We assume aqueous extraction. We look for carbon bonds that are stable in water.
  *   **Required Hardware:** You would need **solvent-agnostic structural analysers**. Perhaps neutron spectrometers to look for hydrogen distribution without assuming water. Thermal imaging with much higher sensitivity to detect localised heat dissipation anomalies on the surface.
  *   **Mission Change:** You might not look for organics at all. You might look for thermal anomalies or structural orderings in ice that suggest active maintenance against crystallisation.

  ### 4. The Announcement Protocol: The Legalistic Residue

  Finally, consider how you would announce a detection. This protocol reveals the true operational definition more than the instruments do.

  When a team claims a detection, they do not say, "We have observed Darwinian evolution." They say, "We have observed X, and we have ruled out known abiotic processes Y and Z."

  *   **The Implicit Theory:** Life is the **null hypothesis of last resort.**
  *   **The Residue:** This reveals that astrobiology is not actually a search for life; it is a search for **the limits of abiotic chemistry.** We define life operationally as "chemistry we cannot currently explain geologically."

  This is why the practice is so conservative. If you adopt a metabolism-first definition, you might claim life upon seeing a catalytic cycle. But the announcement protocol requires you to rule out *all* abiotic catalysis. Since abiotic chemistry is infinite in its variety, you can never strictly rule it out. Therefore, the practice forces you back to "Earth-like biosignatures" because those are the only ones where we feel confident we understand the abiotic background well enough to rule it out.

  ### Conclusion: The "Residue" Extracted

  You asked for the residue—the bits we rely on when spending the money. Here it is:

  1.  **We are building Anomaly Detectors, not Life Detectors.** The hardware is designed to find statistical outliers in chemical distributions, presupposing that biology is the only thing that creates such outliers.
  2.  **We are committed to Carbon-Water Chauvinism by Engineering Necessity.** Not because we believe other chemistries are impossible, but because calibration standards for 'alternative biochemistry' do not exist. We cannot build a sensor for 'unknown unknowns'.
  3.  **We treat Life as a State, not a Process.** The NASA definition is process-heavy (evolution, self-sustaining). The hardware is state-heavy (concentration, ratio, structure). We have silently agreed to look for the *footprints* of the process, assuming the footprints are unique.
  4.  **The Definition is in the Data Pipeline.** The "theory of life" is not in the mission statement; it is in the threshold algorithms that decide when a signal-to-noise ratio warrants a press release.

  If you want to resolve the tension in your team, I suggest you stop trying to agree on a definition of life. Instead, agree on a **Definition of Abiotic Confidence.** Acknowledge that your instruments are designed to characterise geochemistry with such precision that biology becomes the only remaining variable. You are not measuring life; you are measuring the failure of geology to explain the data. That is the only operationalisable position the hardware supports.
