answer: |-
  The distinction between indicative and counterfactual conditionals is one of the central puzzles in the philosophy of language and logic. Your intuition about the "Butler/Gardener" pair cuts to the heart of the matter: why does the same logical structure yield such different acceptability conditions depending on the mood?

  Here is a comparison of the two, an analysis of the "fixed facts" vs. "deep meaning" debate, and an examination of the edge cases that complicate the picture.

  ---

  ### 1. The Butler/Gardener Puzzle

  Let's formalize your example:
  *   **Indicative:** "If the butler didn't kill him, the gardener did."
  *   **Counterfactual:** "If the butler hadn't killed him, the gardener would have."

  **The Indicative Case**
  This sounds "obviously right" given the background knowledge that *someone* killed the victim (let's call this proposition $K$).
  *   **Logic:** If we accept $K$ (Butler $\lor$ Gardener), then logically $\neg\text{Butler} \to \text{Gardener}$ follows immediately (via Disjunctive Syllogism).
  *   **Function:** The indicative conditional here is functioning as a vehicle for **inference from ignorance**. We don't know *who* did it, but we know the disjunction is true. The conditional merely reflects the structure of our remaining epistemic possibilities.

  **The Counterfactual Case**
  This sounds suspicious without further information. Even if we know $K$ is true, asserting the counterfactual implies a **causal or dispositional connection**.
  *   **Logic:** It is not enough that the gardener *did* kill him in the actual world. For the counterfactual to be true, the gardener must have killed him in the *nearest possible world* where the butler did not.
  *   **Function:** This requires the gardener's action to be **robust**. It implies the gardener was *ready, willing, and able* to kill regardless of the butler's action. If the gardener only killed the victim *because* he saw the butler fail (a reactive chain), the counterfactual might be false. If the gardener was asleep and the butler's failure woke him, the counterfactual is false.

  ### 2. Fixed Facts vs. Deep Meaning

  You ask whether this difference is best explained by **what background facts we hold fixed** (a pragmatic/contextual view) or a **deeper difference in meaning** (a semantic view).

  #### The "Fixed Facts" View (Pragmatics/Context)
  Historically associated with Quine and Goodman, this view suggests the logic of conditionals is roughly the same, but counterfactuals require us to hold different sets of facts constant to avoid contradiction.
  *   **Argument:** In the indicative, we hold fixed our *knowledge* (that a murder occurred). In the counterfactual, we must "backtrack." We imagine the butler didn't kill him; to make sense of this, we might have to imagine the murder *didn't happen at all* unless we also hold fixed the gardener's disposition.
  *   **Verdict:** This explains the intuition well but struggles formally. If the semantics were identical, we should be able to force the indicative to behave like the counterfactual by changing context, but the grammatical mood (tense) forces the shift regardless of context.

  #### The "Deep Meaning" View (Semantics)
  Modern semantics (Stalnaker, Lewis, Kratzer) argues there is a fundamental semantic difference in the **modal base** and **ordering source**.
  *   **Indicatives:** Quantify over worlds compatible with what is **known** (Epistemic Modal Base). Since we know the murder happened, all worlds in the domain are murder-worlds. Thus, if the butler is innocent in a world, the gardener must be guilty.
  *   **Counterfactuals:** Quantify over worlds compatible with **salient facts/laws**, often excluding the actual truth of the antecedent (Metaphysical/Circumstantial Modal Base). We look for the closest world where the butler doesn't kill. In that world, the fact "someone was killed" is *not* automatically held fixed. It is only true if the gardener's disposition ensures it.
  *   **Verdict:** This is the stronger explanation. The difference in mood (present vs. past/subjunctive) triggers a different semantic operator. The "fixed facts" intuition is actually a *consequence* of this semantic shift. The counterfactual morphology signals "remoteness from reality," which changes the set of worlds we evaluate.

  **Conclusion on the Butler Case:** The difference is semantic. The indicative checks the gardener's guilt in worlds consistent with our *knowledge* (where the murder is fixed). The counterfactual checks the gardener's guilt in worlds consistent with the *butler's innocence* (where the murder is not necessarily fixed).

  ### 3. Cases That Make the Distinction "Too Tidy"

  While the semantic distinction is robust, several phenomena blur the line, suggesting the boundary is more of a gradient or context-dependent than a binary switch.

  #### A. Future Conditionals
  Consider:
  1.  "If it rains tomorrow, the match **will** be cancelled." (Indicative)
  2.  "If it rained tomorrow, the match **would** be cancelled." (Counterfactual/Subjunctive)

  In many contexts, these are truth-conditionally equivalent. If I am unsure about the weather, I might use (1). If I think rain is unlikely but possible, I might use (2). However, if I know for a fact it *will* rain, (2) sounds odd (presupposing falsity), whereas (1) is fine.
  *   **The Problem:** This suggests the difference is often just about the speaker's **epistemic stance** (probability assigned to the antecedent) rather than a hard semantic wall. Some theorists (like Anderson) argued counterfactuals *always* imply the antecedent is false, but future counterfactuals show they can be "open."

  #### B. 'Might'-Conditionals
  1.  "If the butler didn't kill him, the gardener **might** have." (Indicative)
  2.  "If the butler hadn't killed him, the gardener **might** have." (Counterfactual)

  The indicative version is weak; it merely says the gardener is an epistemic possibility. The counterfactual version is stronger; it says there is a *close possible world* where the gardener does it.
  *   **The Problem:** The interaction of modals with conditionals reveals that "might" in counterfactuals often quantifies over metaphysical possibility, while in indicatives it quantifies over epistemic possibility. This supports the "Deep Meaning" view but complicates the logic, as the scope of the modal interacts differently with the conditional operator in each mood.

  #### C. Biscuit Conditionals (Relevance Conditionals)
  J.L. Austin's famous example: "There are biscuits on the sideboard **if you want them**."
  *   **The Problem:** This is grammatically indicative, but it does not function as a conditional assertion. The biscuits are there regardless of your desire. The "if" clause specifies the **relevance** of the utterance, not the truth conditions of the consequent.
  *   **Implication:** This shows that the indicative form is polysemous. Not all "if P, Q" structures are truth-functional conditionals. If we treat the Butler indicative as a biscuit conditional ("The gardener did it, if you're wondering who"), the logic changes entirely.

  #### D. Explicit Modals and Sobel Sequences
  Consider **Sobel Sequences**, which test how context shifts:
  1.  "If the butler killed him, he used a gun." (Plausible)
  2.  "If the butler killed him and used a silencer, he didn't use a gun." (Also Plausible)

  In classical logic, if $A \to C$, then $(A \land B) \to C$. But conditionals violate this (Antecedent Strengthening).
  *   **The Problem:** Both indicatives and counterfactuals violate Antecedent Strengthening, suggesting they share a "variably strict" semantic structure. However, counterfactuals are *more* sensitive to this.
  *   **Example:** "If Caesar had been in command in Korea, he would have used the atom bomb." vs "If Caesar had been in command in Korea, he would have used catapults."
      Depending on which facts we hold fixed (Caesar's ruthlessness vs. Caesar's historical technology), the truth value flips. This reinforces that the "Fixed Facts" mechanism is the engine driving the "Deep Meaning" semantics.

  ### Summary

  The difference between the Butler indicative and the Butler counterfactual is **semantic**, but it manifests as a difference in **which facts are held fixed**.

  1.  **Indicatives** restrict the domain of quantification to worlds compatible with the speaker's **knowledge**. Since we know the murder happened, the "murder" fact is fixed across all relevant worlds.
  2.  **Counterfactuals** restrict the domain to worlds compatible with **salient circumstances/laws**, prioritizing similarity to the actual world over consistency with current knowledge. The "murder" fact is *not* automatically fixed; it must be secured by the gardener's disposition.

  **Why the distinction isn't tidy:**
  The line blurs in **future conditionals** (where knowledge is incomplete) and **biscuit conditionals** (where the conditional structure is pragmatic, not semantic). Furthermore, the "past tense" used in counterfactuals ("hadn't") is often a **modal past** (signaling remoteness) rather than a temporal past. This means a sentence like "If the butler weren't killing him right now..." can be counterfactual without referring to the past.

  Ultimately, the "Deep Meaning" view wins because the grammar forces the shift, but the "Fixed Facts" intuition is the correct description of *how* that semantic shift affects our evaluation of the sentence. The counterfactual requires the gardener to be "ready" because the semantics forces us to look at a world where the *necessity* of the murder has been removed, leaving only the gardener's disposition to put it back.
