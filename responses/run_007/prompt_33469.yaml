prompt: |-
  my friend Nina is always going on about the extended mind thesis. her claim is that her phone is literally part of her mind — not metaphorically, not "like" a part of her mind, but actually constitutes her cognitive system in the same way her hippocampus does. she leans hard on the Otto/Inga analogy: Otto's notebook is to Otto what Inga's biological memory is to Inga, and her phone is to her what the notebook is to Otto. she says all four Clark and Chalmers conditions are satisfied — the phone is reliably there, she trusts what it says without double-checking, the info is easily accessible, and she consciously entered (or endorsed) the data at some point. the conclusion she draws is pretty strong: she says that if you accept the extended mind thesis, then forcing her to leave her phone in a locker during an exam is cognitively equivalent to forcing another student to take a memory-suppressing drug — both are just degrading a cognitive resource, and the substrate is morally and epistemically irrelevant.

  I've read the paper and I feel like she's stretching it, but I can't quite put my finger on where the analogy breaks. can you audit this for me? i want the full mapping — what corresponds to what between the Otto/Inga case and a smartphone user — and then the disanalogies that matter. in particular: do smartphones actually meet the four conditions when you look at them carefully? (e.g., is the info she's retrieving really stuff she previously endorsed, or is a lot of it algorithmically fed to her?) was the original thesis even designed to cover a device that's constantly updating, internet-connected, and curated by third parties? and does her exam-policy conclusion survive the audit, or is she smuggling in conclusions the analogy can't carry? if the analogy is mostly bad, whats a better one?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Extended Mind Thesis (EMT), specifically Clark & Chalmers' "The Extended Mind" (1998).
      *   **Scenario:** The user's friend, Nina, claims her smartphone is *literally* part of her mind, analogous to Otto's notebook. She argues that confiscating her phone during an exam is like giving another student a memory-suppressing drug.
      *   **Task:** Audit Nina's claim.
          *   Map the Otto/Inga analogy to the Smartphone case.
          *   Analyze the four conditions (Trust, Access, Endorsement, Reliability).
          *   Address the nature of the device (static notebook vs. dynamic internet-connected phone).
          *   Evaluate the exam-policy conclusion.
          *   Identify disanalogies.
          *   Suggest a better analogy if the phone one fails.
      *   **Tone:** Philosophical, analytical, nuanced, helpful (not just debunking, but clarifying).

  2.  **Deconstruct the Extended Mind Thesis (EMT):**
      *   *Core Claim:* Cognitive processes aren't confined to the skull. If an external resource functions *like* an internal cognitive process, it *is* part of the cognitive process.
      *   *The Otto/Inga Case:*
          *   Inga: Hears about MoMA, recalls address from biological memory, goes there.
          *   Otto: Has Alzheimer's, hears about MoMA, checks notebook, goes there.
          *   Parity Principle: If Otto's notebook plays the same functional role as Inga's memory, it counts as memory.
      *   *The Four Conditions (Glue and Trust):*
          1.  Constant availability (reliably there).
          2.  Easy accessibility (direct access).
          3.  Automatic endorsement (trust without scrutiny).
          4.  Past endorsement (consciously entered/verified).

  3.  **Audit Nina's Claim (The Smartphone Case):**
      *   *Mapping:*
          *   Inga $\rightarrow$ Student with biological memory.
          *   Otto $\rightarrow$ Nina.
          *   Notebook $\rightarrow$ Smartphone.
          *   Biological Memory $\rightarrow$ Phone Storage/Cloud.
      *   *Condition Check:*
          1.  *Reliability:* Is the phone always there? Mostly, yes (until the exam). Battery? Signal? *Verdict: Mostly passes, but fragile.*
          2.  *Accessibility:* Is it easy to access? Yes, swipe and search. *Verdict: Passes.*
          3.  *Trust:* Does she trust it without checking? Yes, often. *Verdict: Passes.*
          4.  *Endorsement:* **CRITICAL FAIL POINT.** Did Nina consciously enter *all* the info? Google results? News feeds? AI summaries? No. Much is algorithmically curated or searched in the moment.
      *   *Static vs. Dynamic:* Otto's notebook is static storage. A phone is a portal to the internet (the "hive mind" or external knowledge), not just personal storage.
      *   *Exam Policy Conclusion:* Is confiscation like a memory drug?
          *   If EMT holds *strictly* for the phone as *memory*, maybe.
          *   But exams usually test *internalized* competence, not *coupled* competence.
          *   Fairness issue: If everyone has a phone, it's equal. If no one has a phone, it's equal. If Nina claims it's part of her *mind*, she's claiming a right to an unfair advantage (unless everyone gets one).
          *   Moral/Epistemic relevance: Substrate *might* be irrelevant for cognition, but relevant for assessment goals.

  4.  **Identify Disanalogies (Where Nina Stretches It):**
      *   **Coupling vs. Constitution:** Is the phone *constituting* the memory or just *coupling* with it? Otto's notebook is a store of *dispositional beliefs* he already had. A phone search is often acquiring *new* information on the fly.
      *   **The "Google Gap":** Otto looks up *his* notes. Nina Googles *the world's* knowledge. That's not memory; that's consultation.
      *   **Agency/Endorsement:** Otto wrote the note. Nina didn't write the Wikipedia article.
      *   **Cognitive Bloat:** If the phone is mind, is the whole internet mind? Where does Nina end? (The problem of cognitive bloat).

  5.  **Evaluate the Exam Conclusion:**
      *   Even if EMT is true, assessment policies are normative, not just descriptive.
      *   Goal of exam: Test internalized neural pathways (usually).
      *   Analogy to memory drug: A memory drug removes *internal* capacity. Confiscating a phone removes an *external* tool. If the test is "unaided recall," the phone was never allowed to be part of the "test-taking cognitive system," even if it is part of the "daily life cognitive system."
      *   Nina is smuggling an *epistemic* claim (it's knowledge) into a *normative* claim (I'm entitled to use it here).

  6.  **Develop a Better Analogy:**
      *   If the phone isn't Otto's notebook, what is it?
      *   It's more like a **Librarian** or a **Team of Assistants**.
      *   Or, a **Sensory Extension** (like a blind person's cane) but for information retrieval, not memory storage.
      *   Actually, the best counter-analogy is **Calculator vs. Brain**. We allow calculators in some math tests, not others. It depends on *what is being tested*.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the strength of EMT but validate the user's skepticism. Nina is a "maximalist" about EMT.
      *   *Section 1: The Mapping.* Lay out the Otto/Inga/Notebook vs. Nina/Student/Phone comparison clearly.
