      *   *Exam Logic:* The exam isn't testing "Nina + Phone." It's testing "Nina." If the syllabus says "closed book," the cognitive system under test is defined *by the rules of the test*, not by metaphysics.

  9.  **Final Polish:** Check tone. Ensure it sounds like a philosophical audit. Use terms like "Parity Principle," "Coupling-Constitution Fallacy," "Cognitive Bloat." (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note: Ensure I address the specific question about algorithmically fed info. That's a strong point against the 'Endorsement' condition.)*

  10. **Final Structure:**
