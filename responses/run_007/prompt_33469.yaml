      *   *Section 3: The Internet Problem.* Distinguish between *storage* (Otto) and *querying* (Google). This is the "Coupling-Constitution Fallacy" risk.
      *   *Section 4: The Exam Conclusion.* Why the moral leap fails. Distinguish between *cognitive ontology* (what is the mind?) and *pedagogical assessment* (what are we measuring?).
      *   *Section 5: Better Analogies.* Suggest the "Librarian" or "Calculator" analogy.
      *   *Conclusion:* Summarize. Nina is right that the phone is cognitively *integrated*, but wrong that it's cognitively *constitutive* in the same way as biological memory, especially regarding the *source* of the info.

  8.  **Refining the Argument (Self-Correction during drafting):**
