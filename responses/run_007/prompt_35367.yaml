      *   Neither fully captured the *epistemic game theory* resolution (Aumann's interactive epistemology) or the *evolutionary/learning* resolution (binmore).
      *   The real resolution lies in recognising that Common Knowledge of Rationality (CKR) is an extremely strong assumption that is practically impossible to sustain in finite games without introducing some uncertainty (trembles or types).
      *   Kreps, Milgrom, Roberts, Wilson (1982) showed that if there is even a tiny probability that a player is *not* rational (or is a "tit-for-tat" type), the equilibrium shifts dramatically towards cooperation for most of the game.
      *   So, Dan is right about the *math* of the strict model, but Maya is right that the *model* is brittle and unrealistic. The "paradox" is resolved by relaxing CKR slightly.

