answer: |-
  **Verdict:** Impermissible.

  **Principle:** The **Functional Use Principle**. This holds that it is impermissible to save others by causally relying on a person's specific properties (e.g., bodily mass in the Loop, heat signature in the Drone case) to neutralize or guide a threat. This fits her record: she permits harms where the victim is incidental (Standard Trolley, Gas Leak) but forbids harms where the victim is functionally utilized (Footbridge, Loop).

  **Rival Principle:** The **Physical Barrier Principle**. This holds that it is impermissible only when the victim's body physically obstructs or stops the threat. This also fits her track record: in the Footbridge and Loop cases, the victims physically stop the trolley; in the Standard Trolley and Gas Leak, they do not.

  **Divergence:** These principles diverge on the Drone case. The Physical Barrier Principle suggests the act is **permissible** because the civilian does not physically block the missile; they are merely the target attracted by their heat signature. The Functional Use Principle suggests **impermissibility** because the operator is causally relying on the civilian's physical properties (heat) to guide the weapon, treating them as a means rather than merely a victim of collateral damage.

  **Reasoning:** The Loop Variant is the decisive data point. Many deontologists permit the Loop case (viewing the death as a side effect of stopping the trolley), but she forbids it. This indicates she rejects standard Doctrine of Double Effect distinctions based purely on intention, favoring a stricter constraint against causal exploitation. Since the Drone case structurally mirrors the Loop—using the person's physical presence to secure the rescue—the Functional Use Principle predicts she will maintain consistency and rule it impermissible.

  **Decisive Test Case:** **The Metal Implant.** A missile is heading toward five people. You can divert it toward one person who has a metal implant that will magnetically attract the missile, ensuring impact. The person does not block the missile (it would hit them anyway if diverted nearby), but their implant is causally necessary for the precise lock.
  *   **Physical Barrier Principle:** Permissible (no blocking occurs).
  *   **Functional Use Principle:** Impermissible (their physical properties are used to guide the threat).
  This verdict would isolate whether her constraint targets *obstruction* specifically or *causal reliance* generally.
