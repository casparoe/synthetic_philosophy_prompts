answer: |-
  It is understandable why you feel that way. When Harry Frankfurt published his 1969 paper *"Alternate Possibilities and Moral Responsibility,"* it was widely regarded as a philosophical earthquake. For a time, many thought it had indeed delivered a knockout blow to incompatibilism.

  However, the claim that the debate is "settled" is not shared by the majority of contemporary metaphysicians and ethicists. While Frankfurt cases successfully complicated the debate, they did not end it. Incompatibilists have not simply refused to accept a result; rather, they have developed robust counter-arguments that challenge the coherence, relevance, and completeness of Frankfurt's attack.

  Here is why incompatibilism remains a dominant and rational position in the free will debate, despite Frankfurt cases.

  ### 1. The Shift from "Leeway" to "Source" Incompatibilism
  Your argument assumes that incompatibilism rests *entirely* on the Principle of Alternative Possibilities (PAP). This is known as **Leeway Incompatibilism**. Frankfurt cases are very effective against this specific view.

  However, many incompatibilists have shifted to **Source Incompatibilism**. Source incompatibilists argue that alternative possibilities are not the *root* of the problem. The root problem is **ultimate origination**.
  *   **The Argument:** Even if you have alternative possibilities, if the causal chain determining your choice stretches back to before you were born (as in determinism), you are not the *ultimate source* of your action.
  *   **Relevance to Frankfurt:** A Frankfurt case shows you can be responsible without alternatives. But it does not show you can be responsible if your decision is the inevitable result of prior causes over which you had no control. Derk Pereboom and Galen Strawson, for example, argue that determinism undermines responsibility regardless of PAP, because it makes you a mere conduit for prior events. Frankfurt cases do not address this "sourcehood" intuition.

  ### 2. The "Flicker of Freedom" Strategy
  Many philosophers (such as David Widerker and Carl Ginet) argue that Frankfurt cases do not actually eliminate *all* alternative possibilities. They argue there is always a "flicker" of freedom remaining.
  *   **The Argument:** In a Frankfurt case, the agent cannot choose to do *otherwise* (e.g., not kill the victim). However, they can choose to kill the victim **on their own** versus killing the victim **because of the intervener**.
  *   **The Implication:** This distinction constitutes an alternative possibility. If moral responsibility requires *some* alternative possibility, the Frankfurt case fails to eliminate it. The incompatibilist can argue that the agent is responsible precisely because they exercised the "on their own" flicker, which was an alternative to the "forced" scenario.

  ### 3. The Dilemma Defense
  This is perhaps the most technical but damaging objection to Frankfurt cases (championed by Widerker). It argues that the setup of a Frankfurt case is incoherent when applied to the determinism debate.
  *   **The Horns:** For the intervener (Jones) to know when to intervene, there must be a "prior sign" indicating what the agent will do.
      1.  **If the sign is deterministically connected to the action:** Then the agent is already determined to act before the intervener does anything. The case presupposes determinism to work, which begs the question against the incompatibilist.
      2.  **If the sign is indeterministic:** Then the sign is not a guarantee. The agent could theoretically show the sign but then do otherwise, fooling the intervener. If that is possible, then the agent *could have done otherwise*, so PAP holds.
  *   **The Result:** Either the case assumes determinism (question-begging) or it allows alternative possibilities (fails to refute PAP).

  ### 4. Intuition Pump vs. Logical Proof
  Frankfurt cases rely heavily on intuitive judgments. Frankfurt asks us to intuit that the agent is responsible in his hypothetical scenario.
  *   **Incompatibilist Pushback:** Many incompatibilists simply do not share that intuition. They argue that if an agent is in a situation where they *could not have failed* to act (even if the mechanism didn't fire), the "ability to do otherwise" is a necessary condition for the *kind* of control required for responsibility.
  *   **Manipulation Arguments:** Incompatibilists often use "Manipulation Cases" (like Pereboom's Four-Case Argument) to counter Frankfurt. They argue that if determinism is true, we are essentially manipulated by the past and laws of nature. If we aren't responsible in a clear manipulation case, we shouldn't be responsible in a deterministic case, regardless of Frankfurt-style intervener logic.

  ### 5. The Debate Has Evolved, Not Died
  You are correct that Frankfurt cases forced incompatibilists to refine their arguments. The debate is no longer simply "Determinism vs. PAP." It is now about:
  *   **Control:** What kind of control is necessary for responsibility? (Regulative control vs. Guidance control).
  *   **Origination:** Does the agent need to be the *prima causa* (first cause) of their will?
  *   **Semantics:** Are we arguing about the definition of "free will" or the metaphysical conditions of responsibility?

  ### Conclusion
  It is not a failure to accept a settled result; it is a recognition that the result was not settled. Frankfurt cases successfully showed that **PAP is not the only game in town**, but they did not prove that determinism is compatible with responsibility.

  Incompatibilists remain because they believe that even if you grant Frankfurt's point about alternatives, determinism still robs agents of the **authorship** required for true moral responsibility. As long as the "Sourcehood" argument remains viable, incompatibilism remains a philosophically robust position.
