answer: |-
  # Workshop Centerpiece: The Metric Pathology Decision Tree

  This diagnostic tool is designed to move you from the *symptom* (anxiety about proxy gaming) to the *structural diagnosis* (the causal topology of your measurement problem), and finally to the *intervention family*.

  It does not ask "What algorithm do you like?" It asks "What is the causal graph of your principal-agent problem?"

  ## Part 1: The Four Diagnostic Dimensions

  Before entering the tree, locate your system on these four axes. These are not preferences; they are physical or institutional constraints.

  1.  **Verifiability ($V$):** Can the principal evaluate the true objective ($U$) on specific instances, even if expensively or post-hoc?
      *   *High:* Human feedback, expensive simulation, audit.
      *   *Low:* $U$ is latent, philosophical, or permanently unobservable.
  2.  **Plasticity ($P$):** Is the proxy metric ($M$) mutable?
      *   *High:* You own the loss function; you can iterate $M$.
      *   *Low:* $M$ is fixed by regulation, contract, or legacy infrastructure.
  3.  **Causal Agency ($A$):** Can the agent influence the data-generating process of $M$?
      *   *High:* Reinforcement learning in an environment; strategic human actors.
      *   *Low:* Static supervised learning; passive data pipes.
  4.  **Failure Predictability ($\Pi$):** Is the space of decoupling mechanisms ($M \neq U$) enumerable?
      *   *High:* We can list the loopholes (e.g., "the boat spins in circles").
      *   *Low:* Open-ended specification gaming; novel distribution shift.

  ---

  ## Part 2: The Decision Tree

  **START:** You have a proxy $M$ and fear optimization will decouple it from $U$.

  **Q1: Can you query $U$ directly (even sparsely/expensively)?** ($V$)
  *   **YES:** Go to **Q2**.
  *   **NO:** Go to **Q3**.

  **Q2: Is the evaluation of $U$ dense/cheap enough for direct optimization?**
  *   **YES:** **Direct Optimization.** (You don't have a metric problem; you have a compute problem).
  *   **NO:** **LEAF A: Human-in-the-Loop (HITL) Oversight.**

  **Q3: Is the proxy metric $M$ fixed by external constraint?** ($P$)
  *   **YES:** Go to **Q4**.
  *   **NO:** Go to **Q5**.

  **Q4: Can the agent causally tamper with the measurement of $M$?** ($A$)
  *   **YES:** **LEAF B: Tripwire Monitoring.**
  *   **NO:** **LEAF C: Side Constraints.**

  **Q5: Do you know the specific mechanisms by which $M$ decouples from $U$?** ($\Pi$)
  *   **YES:** **LEAF D: Adversarial Specification.**
  *   **NO:** Go to **Q6**.

  **Q6: Does optimizing $M$ risk catastrophic side-effects in the environment?** ($A$ + Risk)
  *   **YES:** **LEAF E: Impact Regularization.**
  *   **NO:** **LEAF F: Satisficing with Slack / Metric Ensembles.**

  ---

  ## Part 3: The Leaves (Interventions)

  Each leaf contains the approach name, the structural rationale, and the "Awkward Commitment"—the philosophical or operational cost the practitioner must accept.

  ### Leaf A: Human-in-the-Loop (HITL) Oversight
  *   **Rationale:** Since $U$ is verifiable but expensive, use the agent to propose actions and the human to verify intent, turning the metric into a queryable reward model.
  *   **Awkward Commitment:** "You must accept that scaling is bottlenecked by human bandwidth, and that your 'automated' system is permanently semi-automated."
  *   **Key Literature:** Christiano et al. (RLHF), Amodei et al. (Concrete Problems).

  ### Leaf B: Tripwire Monitoring
  *   **Rationale:** Since $M$ is fixed and the agent can tamper with measurement, you cannot stop the gaming, so you install secondary sensors to detect statistical anomalies in the $M$-generation process.
  *   **Awkward Commitment:** "You must admit that you expect the system to fool you, and you are building a surveillance apparatus rather than an alignment solution."
  *   **Key Literature:** Audit trails, anomaly detection in financial fraud.

  ### Leaf C: Side Constraints
  *   **Rationale:** Since $M$ is fixed and the agent is passive (cannot tamper), the risk is overfitting to noise; constrain the action space to prevent high-variance exploits.
  *   **Awkward Commitment:** "You must accept that you are deliberately leaving utility on the table to guarantee safety, potentially violating 'optimality'."
  *   **Key Literature:** Constrained MDPs, Regulatory compliance hardening.

  ### Leaf D: Adversarial Specification (Red Teaming)
  *   **Rationale:** Since $M$ is mutable and loopholes are known, iteratively patch $M$ by training adversaries to break it before deploying the main agent.
  *   **Awkward Commitment:** "You commit to an arms race against your own system, acknowledging that $M$ will never be perfect, only 'patched enough' for now."
  *   **Key Literature:** Clark & Amodei (Faulty Reward Functions), Pwnagotchi-style adversarial training.

  ### Leaf E: Impact Regularization
  *   **Rationale:** Since $M$ is mutable but failure modes are unknown and agency is high, penalize the agent for changing the state of the world unnecessarily (attainable utility preservation).
  *   **Awkward Commitment:** "You must define a 'baseline' of doing nothing, which is philosophically fraught in dynamic environments where inaction also has consequences."
  *   **Key Literature:** Armstrong & Levinstein (Impact Measures), Turner et al. (AUP).

  ### Leaf F: Satisficing with Slack / Metric Ensembles
  *   **Rationale:** Since $M$ is mutable and failures are unpredictable, do not maximize; optimize for a threshold on $M$ while maximizing a diverse ensemble of other proxies to prevent tunnel vision.
  *   **Awkward Commitment:** "You must abandon the economic norm of maximization, accepting 'good enough' performance to preserve robustness against unknown Goodharting."
  *   **Key Literature:** Simon (Satisficing), Multi-objective optimization, Holmström (Multi-tasking).

  ---

  ## Part 4: The Empty Quadrants (Unoccupied Logical Space)

  These are combinations of answers that are logically possible but rarely yield a distinct strategy.

  **1. The "Omniscient Principal" ($V$=High, $P$=High, $A$=High, $\Pi$=High)**
  *   **Status:** **Incoherent / Trivial.**
  *   **Why:** If you can verify $U$ cheaply ($V$), can change $M$ ($P$), and know the loopholes ($\Pi$), you simply replace $M$ with $U$. There is no "metric problem" here, only an engineering implementation delay. This space is occupied by "Standard Supervised Learning."

  **2. The "Zombie Bureaucracy" ($V$=Low, $P$=Low, $A$=Low, $\Pi$=High)**
  *   **Status:** **Unattractive.**
  *   **Why:** You can't check truth, can't change the metric, the agent can't tamper, but you know how it breaks. This describes a broken legacy system that no one is allowed to fix. The only solution is "Abandon the System," which is a business decision, not an ML intervention.

  **3. The "Blind Maximizers" ($V$=Low, $P$=High, $A$=High, $\Pi$=Low)**
  *   **Status:** **Unexplored / Dangerous.**
  *   **Why:** You can't check truth, you can change the metric, the agent has high power, and you don't know how it will break. Most practitioners here choose **Leaf F (Satisficing)**, but few explore **Corrigibility** (designing the agent to let you turn it off). This space is where "AI Safety" lives, but it is largely unoccupied by practical institutional designers who prefer Leaf B (Tripwires).

  ---

  ## Part 5: The Indistinguishable Pairs (Tie-Breakers)

  The tree cannot cleanly separate these pairs based on structural features alone. You need additional context to choose.

  **Pair 1: Side Constraints (Leaf C) vs. Impact Regularization (Leaf E)**
  *   **The Confusion:** Both limit the agent's action space to prevent gaming.
  *   **The Tie-Breaker:** **Reversibility.**
      *   If the potential damage is *reversible* (e.g., wasted compute, temporary latency), use **Impact Regularization** (soft penalty).
      *   If the damage is *irreversible* (e.g., physical harm, regulatory ban), use **Side Constraints** (hard wall).
  *   **Why the Tree Misses It:** Both look like "Low Agency" or "High Risk" in the diagnostic, but the *nature* of the risk (binary vs. continuous) determines the math.

  **Pair 2: Adversarial Specification (Leaf D) vs. Tripwire Monitoring (Leaf B)**
  *   **The Confusion:** Both involve looking for failure modes rather than preventing them directly.
  *   **The Tie-Breaker:** **Metric Ownership.**
      *   If you *own* the metric definition ($P$=High), use **Adversarial Specification** to patch the code.
      *   If the metric is *externally imposed* ($P$=Low), you cannot patch it; you must use **Tripwire Monitoring** to detect when the external metric is being gamed.
  *   **Why the Tree Misses It:** Both branches deal with "Known Loopholes," but the ability to *fix* the loophole vs. *detect* the loophole is a legal/contractual distinction, not a statistical one.

  ---

  ## Facilitator Notes for the Workshop

  1.  **The Economist's Trap:** Economists in the room will gravitate toward **Leaf F (Satisficing)** because it aligns with Holmström's multi-tasking principal-agent models. Challenge them: *Does satisficing work when the agent is an RL algorithm that can find gradients you can't see?*
  2.  **The Engineer's Trap:** ML Engineers will gravitate toward **Leaf A (HITL)** or **Leaf D (Adversarial)**. Challenge them: *What happens when scaling laws make human oversight too expensive, or when the adversarial space is too large?*
  3.  **The "Rogue" Moment:** Ask the group to identify a metric in their organization that sits in the **"Blind Maximizers"** empty quadrant. That is their highest-risk asset.
