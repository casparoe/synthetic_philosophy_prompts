answer: |-
  To argue that Taurek's own principles compel us to save the five, we must accept his metaphysical starting point: there is no "super-person" who suffers the sum of the five losses. The loss of life is suffered only by the individual who dies. However, we must reject his procedural conclusion (the coin flip) by showing that it violates the very principle of **equal concern for individuals** that motivates his view.

  Here is the argument that Taurek's individualism, properly understood, generates a requirement to save the five.

  ### 1. The Misinterpretation of "Equal Concern"
  Taurek argues that because each person's loss is separate, we cannot say the loss of five is greater than the loss of one. Therefore, to show equal concern, we should flip a coin between the *parties*: a 50% chance for the one, and a 50% chance for the five.

  The flaw here is that the coin flip treats the **groups** as the units of moral concern, not the **individuals**. By giving the group of five a 50% chance and the individual one a 50% chance, you are effectively treating the five as a single moral entity equivalent to the one. But Taurek insists there are no such entities. There are only six individuals.

  If moral concern is owed to *individuals*, then the decision procedure must respect the structure of individual claims.
  *   **The One** has one claim to be saved.
  *   **The Five** have five distinct claims to be saved.

  A coin flip between the groups asserts that **Claim₁ (The One) = Claim₂₋₆ (The Five).**
  But Taurek's own individualism asserts that **Claim₁ = Claim₂**, and **Claim₁ = Claim₃**, etc.
  It does *not* assert that **Claim₁ = (Claim₂ + Claim₃ + Claim₄ + Claim₅ + Claim₆).**

  By flipping a coin, you are allowing one individual's claim to veto the claims of five other individuals. This grants the One a privileged status. It says the One's interest is weighty enough to subject *each* of the Five to a 50% risk of death. If you truly respected each of the Five as individuals equal to the One, you could not allow the One to impose that risk on them.

  ### 2. The Failure of the Coin Flip: Individual Probabilities
  Let us look at the ex-ante probabilities for survival for each specific person under Taurek's coin flip versus saving the five.

  *   **Under the Coin Flip:**
      *   The One has a 50% chance of survival.
      *   Each member of the Five has a 50% chance of survival.
  *   **Under Saving the Five:**
      *   The One has a 0% chance of survival.
      *   Each member of the Five has a 100% chance of survival.

  Taurek argues the Coin Flip is fairer because it gives the One a chance. But consider the complaint of any single member of the Five, say, Alice.
  Alice says: *"I had a claim to be saved equal to that man's. Yet you chose a procedure that gave me only a 50% chance of living, when you could have given me 100%. You lowered my security to raise his."*

  To justify this to Alice, you must explain why *her* individual interest was subordinate to *his*. If their claims are truly equal, why is it permissible to risk her life to give him a chance, but not permissible to risk his life to guarantee hers?

  The only non-aggregative answer is that you cannot risk five distinct individuals to save one. If you view the situation as a series of pairwise comparisons (One vs. Alice, One vs. Bob, etc.), the One loses every comparison if the goal is to save *someone*. But more importantly, the Coin Flip imposes a **collective risk** on the Five that is not imposed on the One. The One faces a 50% risk of death regardless of what the Five do. The Five face a 50% risk of death *because* the One exists. This violates the separateness of persons by making the Five's safety contingent on the One's lottery ticket.

  ### 3. Counting Claims, Not Utilities (The Deontological Shift)
  The standard utilitarian objection is that 5 lives > 1 life. Taurek rightly rejects this because it sums *well-being*. However, we can count **duties owed** without summing *goodness*.

  Morality is about what we owe to each person.
  *   If you save the One, you fail in your duty to Alice. You fail in your duty to Bob. You fail to Carol, Dave, and Eve. That is **five distinct failures of duty**.
  *   If you save the Five, you fail in your duty to the One. That is **one distinct failure of duty**.

  This is not aggregating the *value* of the lives. It is counting the *number of moral relationships* in which you are failing to provide what is owed. Taurek's individualism demands we look at the moral relation between the rescuer and each person.

  If you are required to show equal respect to all, you must minimize the number of individuals to whom you must say, *"I could have saved you, but I chose not to."*
  *   Saving the One: You say this to 5 people.
  *   Saving the Five: You say this to 1 person.

  To treat individuals equally is to acknowledge that being the person to whom you say "I chose not to save you" is a moral harm (a violation of a claim). Even if the *loss of life* is not aggregated, the *violation of the duty to rescue* is occurring in five distinct instances versus one. To respect the Five individually is to acknowledge that you cannot justify failing five distinct duties to satisfy one.

  ### 4. Why the "Permission" Defense Fails
  Taurek often retreats to the position that he is not arguing you are *required* to save the one, but merely that you are *permitted* to do so (i.e., not required to save the five). He suggests morality allows discretion here.

  This move fails because moral permissions must be **justifiable to all affected parties**.
  If you claim a permission to save the One (via a coin flip or direct choice), you are claiming a permission to let the Five die. You must be able to justify this action to Alice, Bob, Carol, Dave, and Eve.

  What is the justification? *"I wanted to give that man a fair chance."*
  Alice's response: *"Why does his fair chance warrant my death? Our claims were equal."*

  If the claims are equal, you cannot justify prioritizing one claim over five others without appealing to a sum (which Taurek bans) or arbitrary preference. If morality is grounded in what we owe to individuals, you cannot have a "permission" to violate the claims of five people when doing so is not necessary to uphold a superior claim (since the claims are equal).

  A permission to save the One implies that the Five have no grounds for complaint. But they *do* have grounds. They can say, *"You failed to recognize the distinctness of our claims. You treated us as a bloc to be weighed against him, rather than five individuals whose claims outnumbered his."*

  Because the action (saving the One) generates justified complaints from five individuals that the alternative (saving the Five) does not generate from the One (since the One's claim is outweighed by the sheer number of equal claims against it), the permission dissolves. You are not free to act in a way that leaves five people with a justified grievance when you could act in a way that leaves only one.

  ### Conclusion
  Taurek is right that there is no impersonal sum of well-being. But he is wrong that this leads to a coin flip. The coin flip aggregates the Five into a single unit to balance against the One, violating the separateness of persons.

  True respect for the separateness of persons requires acknowledging that there are five distinct claims opposing one distinct claim. While we cannot sum the *value* of the lives, we can count the *number of individuals whose claims are being overridden*. To show equal concern for each of the Five individually, you must not subject them to a risk of death to spare the One. Therefore, even on Taurek's own individualist terms, you are **required** to save the five.
