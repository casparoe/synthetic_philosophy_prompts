answer: |-
  Here is a Q&A prep sheet tailored to your specific argument, audience composition, and the high-stakes context of your department.

  ### **Literature Status: Settled vs. Contested**

  Before you step to the podium, keep this map in mind so you don't overclaim.

  *   **Settled (or Near-Consensus):**
      *   There is a distinct normative phenomenon called "standing to blame."
      *   Hypocrisy is the paradigmatic condition that undermines standing.
      *   Lacking standing is distinct from the *truth* of the blame (i.e., the target actually did wrong).
      *   Hypocritical blame is morally objectionable (usually framed as unfair).

  *   **Genuinely Contested (Your Battleground):**
      *   **The "Why":** Is it unfairness (Fritz & Miller), lack of commitment (Bell), or authority (Wallace)?
      *   **The Consequence:** Does lacking standing make the blame *morally impermissible* (you shouldn't do it) or *illocutionarily defective* (it doesn't count as blame)? **This is your specific claim.** Many (e.g., Todd) argue it's still blame, just inappropriate. You are arguing it misfires *as blame*. This is the stronger, more controversial claim.

  ---

  ### **Q&A Prep Sheet: Objections & Replies**

  These are ordered by **philosophical damage** (how hard they hit the thesis), not emotional difficulty.

  #### **1. The Kantian/Agent-Neutrality Objection**
  **The Objection:** "You're claiming the blame misfires because of facts about the *blamer*. But if moral norms are agent-neutral, the violation stands regardless of who points it out. If I murder someone, it doesn't matter if a fellow murderer tells me I shouldn't have. The moral law applies. By making the validity of the blame dependent on the blamer's moral record, aren't you collapsing the distinction between the *norm* and the *enforcement*?"

  **The 2-Minute Reply:**
  "I appreciate the force of that. It's crucial to distinguish the *truth of the proposition* from the *felicity of the speech act*. My claim isn't that the norm doesn't apply to the target. If I steal, I violate the moral law, regardless of who speaks. But blame isn't just stating a fact; it's a communicative address that demands a specific kind of recognition.
  Think of it like a verdict. A random person in the gallery can shout 'Guilty!' at a defendant. They might be right. But it doesn't function as a *verdict* because they lack the institutional standing. Similarly, hypocritical blame fails to secure the normative uptake required for moral address. The Kantian is right that the *law* holds, but blame is the *human practice* of invoking that law. When the invoker disavows the law through their own conduct, the invocation loses its illocutionary force. The norm stands, but the *blame* falls flat."

  **Candid Weakness:**
  This relies heavily on the analogy between institutional authority (judges) and moral authority. Kantians may reject that moral authority is relational in this way. If they view blame as simply "holding someone to the law," your distinction between norm and enforcement might look like a dodge.

  #### **2. The Strawsonian/Phenomenology Objection**
  **The Objection:** "On a Strawsonian view, blame is constituted by reactive attitudes like resentment or indignation. A hypocrite can genuinely feel indignation. They can express it. The target can feel the sting. If all the phenomenological and behavioral markers of blame are present, in what sense has the act 'misfired'? You're defining blame too narrowly as a successful communication rather than a human reaction."

  **The 2-Minute Reply:**
  "That's a fair challenge to the definition. I'm not denying the hypocrite feels anger or that the target feels stung. But I'm arguing that *full-blooded moral blame* has a normative telos: it aims at moral reconciliation or acknowledgment of the norm.
  When a hypocrite blames, the target's natural response isn't guilt or acknowledgment; it's 'Who are *you* to say that?' That response isn't just an excuse; it's a rejection of the *terms* of the address. If the essential function of blame is to call for acknowledgment of a shared norm, and the blamer's conduct signals they don't share it, the call cannot be answered as intended. The reactive attitude is there, but the *moral conversation* is broken. So, it's blame-like, but defective as a move in the moral practice."

  **Candid Weakness:**
  Strawsonians might dig in and say, "No, blame *just is* the reactive attitude." If they define blame psychologically rather than communicatively, your "misfire" claim becomes a verbal dispute. You need to hold firm that you are analyzing the *normative practice*, not just the psychology.

  #### **3. The Semanticist's Objection (Presupposition Failure)**
  **The Objection:** "You're using a linguistic analogy: presupposition failure. But in semantics, when a presupposition fails (e.g., 'The King of France is bald'), the sentence is usually false or truth-valueless, not necessarily an 'infelicitous act.' Why think the failure of the standing presupposition nullifies the *act* of blaming rather than just making the *content* inappropriate? Why is it a misfire rather than an abuse?"

  **The 2-Minute Reply:**
  "This is why I lean on the Austinian distinction between misfires and abuses. An abuse is when you have the standing but use it for bad ends. A misfire is when the procedure itself is void.
  My argument is that standing is a *constitutive norm* of the blame act, not a regulative one. If I promise without intent, I haven't made a 'bad promise'; I haven't promised at all. Similarly, standing isn't just a polite precondition; it's what authorizes the speaker to speak *for the norm*. Without it, the utterance might look like blame, but it lacks the normative backbone to function as blame. It's not that the content is false; it's that the speaker lacks the license to assert it *as a blamer*."

  **Candid Weakness:**
  This is technically dense. If the semanticist presses you on whether "standing" is truly *constitutive* (like "I do" in marriage) or merely *regulative* (like "be polite"), you could get bogged down. Ensure you have a clear example of constitutive norms ready.

  #### **4. The "Moral Truth" Objection**
  **The Objection:** "If the hypocrite's blame is defective *as blame*, does that mean the target has no reason to feel guilty? Are you suggesting that my moral obligations depend on the purity of the person pointing them out? That seems to let the target off the hook."

  **The 2-Minute Reply:**
  "Not at all. This is the most common misunderstanding of the standing view. The target's obligation to feel guilt is grounded in their own violation of the norm, not the blamer's standing.
  My claim is about the *interaction*, not the *obligation*. The target still did wrong. They still owe amends to the victim. But they do not owe *acknowledgment to the hypocrite*. The hypocrite loses the right to demand that acknowledgment. So the target isn't 'off the hook' morally; they are just insulated from *that specific demand* from *that specific person*."

  **Candid Weakness:**
  This is your safest ground, but be careful not to sound like you're minimizing your own screwup. Acknowledge your error clearly if this comes up.

  ---

  ### **The Dreaded Question (The Wild Card)**

  **The Context:** This is the question you are dreading. It may come from the senior colleague, or a friend trying to signal him. It shifts the talk from abstract to painfully concrete.

  **The Question:** "Let's make this concrete. If I—someone who has made mistakes in the past—point out an error you've made, are you saying I'm not actually blaming you? Are you saying your mistake doesn't count because of my history? Isn't this just a sophisticated way of silencing criticism you don't like?"

  **Why it sinks you:** It forces you to either (a) admit you are talking about *him* (unprofessional/personal) or (b) deny the relevance of the example (dishonest). It risks making you look defensive or immune to feedback.

  **The 2-Minute Reply:**
  "That's a crucial question, and I want to be very precise. First, I am not saying the mistake doesn't count. My error is my error, and I am responsible for it regardless of who points it out.
  Second, this isn't about silencing criticism. It's about the *mode* of address. Anyone can point out a mistake. But *blame* carries a specific moral weight—it implies a demand for accountability from a shared moral ground.
  If I defend the view that hypocrisy undermines standing, I am arguing that when a blamer violates the very norm they invoke, they lose the authority to make that *moral demand*. It doesn't mean I can ignore the feedback. It means the interaction shifts from 'moral accountability' to 'practical correction.' I can accept the correction without accepting the *blame* from that source. So, no, it's not about silencing criticism. It's about preserving the integrity of moral address so that it remains a tool for reconciliation rather than power."

  **Candid Weakness:**
  This requires immense composure. If you sound bitter, you lose the room. You must sound like you are clarifying a principle, not settling a score. **Crucial:** Do not look at the colleague when answering. Look at the questioner or the room generally.

  ---

  ### **Final Tactical Advice**

  1.  **Own the Controversy:** In your intro, explicitly state: "I know the claim that blame *misfires* is stronger than the standard fairness view. I'm defending that stronger claim." This inoculates you against people acting like they've discovered a hole you didn't know about.
  2.  **The "We" Language:** When discussing hypocrites, use "we" or "one," not "they." It shows you understand this is a structural human problem, not a weapon against specific enemies.
  3.  **If the Colleague Speaks:** If he stands up to ask the "Dreaded Question," treat it with extra generosity. "That's an important challenge, and it gets to the heart of why this matters practically." If you remain gracious while defending the principle, you win the room even if he disagrees.
  4.  **Bail Out Clause:** If a question gets too personal or heated, use the "Scope" defense: "For the purposes of this paper, I'm focusing on the structural conditions of standing, but I'd love to discuss the specific application offline."

  Good luck. You have a solid argument; the literature is on your side regarding the *existence* of standing, even if the *consequences* are debated. Stick to the illocutionary analogy—it's your strongest shield.
