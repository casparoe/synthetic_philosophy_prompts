answer: |-
  Your frustration is well-founded; the Frankfurt debate is arguably the most recursive stalemate in contemporary metaphysics. Your hypothesis that the sides are answering different questions is insightful, but it requires refinement to capture why the literature feels "stuck" rather than just bifurcated.

  ### 1. Is it Verbal, Substantive, or Two Projects?
  It is a **substantive disagreement** that masquerades as a verbal one.

  Both sides generally agree on the definition of the Principle of Alternative Possibilities (PAP) and the mechanics of Frankfurt cases. They do not disagree about what words mean (verbal), nor are they pursuing entirely distinct enterprises (two projects). They are both trying to answer the same question: *What are the necessary conditions for moral responsibility?*

  However, the stalemate arises because they prioritize different **explanatory bases** for responsibility.
  *   **The Frankfurt/Compatibilist Side:** Argues that responsibility is grounded in the **actual sequence** of events (how the action was generated). If the agent identifies with their desire and acts on it without coercion, they are responsible, even if a counterfactual intervener removed alternative possibilities. For them, alternative possibilities are epiphenomenal to responsibility.
  *   **The Libertarian/Incompatibilist Side:** Argues that responsibility is grounded in **regulative control** (the power to select between genuine futures). For them, the actual sequence is insufficient without the ability to do otherwise.

  The "talking past each other" feeling comes from the fact that Frankfurt cases target *leeway* (alternative possibilities), while opponents often retreat to *sourcehood* (origin of action). When a Compatibilist says, "See, he's responsible without alternatives," the Libertarian replies, "Only if you assume the actual sequence is all that matters," which is precisely what is being disputed.

  ### 2. Critique of Your Hypothesis
  Your hypothesis suggests one side tracks **practices** and the other tracks **metaphysics**. This is partially correct but not the root cause.
  *   **Why it's close:** Compatibilists often appeal to our intuitive practices of blaming and praising (which rarely involve checking for metaphysical indeterminism). Libertarians often appeal to metaphysical intuitions about "ultimate" control.
  *   **Why it's incomplete:** Sophisticated Libertarians (like Robert Kane or Derk Pereboom) care deeply about practices; they argue our practices of *desert* are unjustified without metaphysical leeway. Conversely, Frankfurt-style Compatibilists (like Fischer and Ravizza) offer robust metaphysical accounts of "guidance control."

  The split isn't practice vs. metaphysics; it is **Leeway Incompatibilism** vs. **Source Compatibilism**. The "begging the question" charge you encountered is the **Dilemma Defense**: Libertarians argue that Frankfurt cases are either deterministic (in which case they presuppose compatibilism is true) or indeterministic (in which case the intervener cannot guarantee the outcome, leaving a "flicker" of alternative possibility). This isn't a misunderstanding; it's a clash over whether determinism is compatible with responsibility *before* the case even begins.

  ### 3. What Would Count as Progress?
  More Frankfurt cases will not solve this; we have hundreds of variants (Frankfurt, Jones, Black, etc.), and the objections scale with them. Progress would require one of the following:

  1.  **A Theory of Value:** Instead of arguing over cases, philosophers need to explain *why* alternative possibilities would matter if they did. If Libertarians can articulate the specific value added by leeway (beyond just "it feels necessary"), Compatibilists would have to address that specific value.
  2.  **Experimental Philosophy (X-Phi):** If research showed that intuitions about Frankfurt cases are culturally specific or correlate with unrelated cognitive traits, it would undermine the methodological reliance on these intuitions for both sides.
  3.  **A Unified Theory of Control:** Progress looks like a framework that explains why we have conflicting intuitions. For example, a theory that admits PAP is false for *blame* but true for *obligation*, or vice versa. (Some progress has been made here, distinguishing "obligation" from "responsibility," but the core metaphysical dispute remains).

  ### 4. The Better Diagnosis
  The debate is stuck because Frankfurt cases are **dialectically limited**. They can only refute PAP if the audience already accepts that the "actual sequence" is sufficient for responsibility. If you believe that responsibility requires the ability to do otherwise, no Frankfurt case will ever look like a case of responsibility to you; it will always look like a case of manipulation or determinism.

  Therefore, the disagreement is not about the cases themselves, but about the **prior metaphysical commitment** to what kind of control is required for desert. The literature hasn't moved because neither side can provide a non-circular argument for why their preferred type of control (leeway vs. source) is the correct one.

  The impasse is a substantive conflict over the metaphysical grounds of control, not a verbal misunderstanding, because both sides agree on the definitions but disagree on what kind of freedom responsibility ultimately requires.
