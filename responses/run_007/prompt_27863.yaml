  Based on your ten cases, your intuitions track a distinction between **deception about objective status/risks** versus **deception about subjective motivation**, and between **illegitimate coercion** versus **relationship boundaries**.

  Here is a principle that captures the structure of your verdicts, followed by the implications for your undecided case and the cost of maintaining consistency.

  ### The Principle: Voluntary Agreement on Essential Terms

  > **A person's "yes" counts as valid consent if and only if:**
  > 1.  **Capacity:** They have the mental ability to understand the nature of the act and its immediate consequences.
  > 2.  **Voluntariness:** Their agreement is not secured by an illegitimate threat or an abuse of structural power.
  > 3.  **Integrity:** Their agreement is not based on a lie regarding an **objective, material fact** about the partner's identity or the physical risks of the act.

  **How it fits your ten cases:**
  *   **Capacity:** Rules out Case 8 (very drunk); allows Case 9 (mildly drunk) and Case 10 (mild disability).
  *   **Voluntariness:** Rules out Case 5 (Boss/Power) and Case 7 (Blackmail/Threat). It allows Case 6 (Breakup) because ending a relationship is a *legitimate consequence* of incompatibility, not an illegitimate threat like firing or doxxing.
  *   **Integrity:** Rules out Case 1 (Surgeon) and Case 2 (Married) because these are objective social/biological statuses that define the *kind* of relationship. It allows Case 3 (Love) and Case 4 (Age 32 vs 34) because love is a subjective internal state, and a two-year age difference is not a *material* fact.

  ### The Vasectomy Verdict

  Under this principle, **her "yes" does not count.**

  Here is why: A vasectomy is an **objective, material fact** about the partner's body that directly alters the **physical risks** (pregnancy) of the act. It is not a subjective feeling like "love" (Case 3), nor is it a minor statistic like "age 32 vs 34" (Case 4). It is structurally identical to your "Married" verdict (Case 2): in both cases, the woman agreed to a specific type of sexual encounter (one without pregnancy risk, one without infidelity risk) that did not exist. The lie changed the *essential terms* of the bargain.

  ### The Cost: Which Verdict You May Have to Give Up

  To maintain this principle cleanly, you will likely have to reconsider **Case 1 (The Surgeon Lie).**

  Here is the tension: Your principle invalidates consent when lies concern "objective, material facts."
  *   In the **Vasectomy Case**, the materiality is clear: it concerns bodily risk (pregnancy).
  *   In the **Married Case**, the materiality is clear: it concerns social/relational status (availability).
  *   In the **Surgeon Case**, the materiality is weaker. A job title is an objective fact, but does it alter the *nature of the sex* or the *physical risk*? No. It alters the *social prestige* or *economic expectation*.

  If you hold firm that the Vasectomy lie invalidates consent because of **physical consequence**, you must admit the Surgeon lie is less severe. If you hold firm that the Surgeon lie invalidates consent because of **social deception**, you risk invalidating Case 3 (Love), as love is often a "social condition" of sex for many people.

  Most legal and ethical frameworks draw the line at **bodily risk and identity**. Under a strict reading of the principle required to justify the Vasectomy verdict, the Surgeon lie becomes "fraud in the inducement" (regrettable, but consent valid). To keep your verdict on Case 1, you must accept a broader definition of "Material Fact" that includes social status, which makes the boundary between Case 1 (Surgeon) and Case 3 (Love) harder to defend logically, even if it feels distinct emotionally.

  ### The Test Case: The Wealth Lie

  To see what you are actually committed to, consider this case:

  > **Case 11:** A man tells a woman he is a wealthy heir. He is actually in significant debt. She sleeps with him because she wants a secure future; she would not have slept with him had she known.

  *   **If you say her "yes" counts:** You are committed to the view that only *biological/physical* facts (Vasectomy, Disease) or *legal status* (Marriage) invalidate consent. You must then **give up Case 1 (Surgeon)**, as a job title is closer to wealth than it is to fertility.
  *   **If you say her "yes" does not count:** You are committed to the view that *any* objective dealbreaker invalidates consent. This puts pressure on **Case 3 (Love)**. If wealth is a material fact, why isn't the emotional commitment of "love"?

  **Recommendation:**
  Your intuitions are most consistent if you treat the **Vasectomy Case** as **Invalid Consent**. This aligns with your views on the Married and Surgeon cases. However, be aware that this commits you to a view where consent is fragile: it can be undone by lies about anything the other person deems a "condition," unless you strictly limit "conditions" to bodily risks and legal status. If you choose that limit, Case 1 (Surgeon) is the verdict you should reconsider.
