answer: |-
  Here are ten interview questions designed to move beyond the textbook summary of Frankfurt cases and engage with the current technical and normative debates in the literature.

  ### 1. The Disciplinary Panel & The Intuition of "No Alternative"
  "Before we dive into the technicalities of your book, I want to ground this in a real-world tension. I recently served on a university disciplinary panel where a student admitted to plagiarism but argued she wasn't responsible because her circumstances—financial pressure, threat of expulsion—left her 'no genuine alternative.' Her defense relied on a version of the Principle of Alternative Possibilities (PAP): *no alternatives, no responsibility.* Your work argues PAP is false. If we accept your view, does it become *harder* to excuse that student? Or does defeating PAP actually allow us to separate the question of 'could she have done otherwise' from 'was she coerced' in a way that helps us judge her case more fairly?"

  ### 2. The Flicker-of-Freedom Strategy (Required Topic)
  "Let's press on the most persistent defense of PAP: the 'flicker-of-freedom' strategy. Critics concede that in Frankfurt cases, the agent cannot avoid the *outcome*, but they argue the agent still retains the alternative possibility of bringing about that outcome *on their own* versus being forced by the intervener. They claim this 'flicker' is enough to ground responsibility. You argue these flickers aren't robust enough. But isn't the worry here that you're moving the goalposts? If an agent can choose to act on their own or be manipulated, why is that alternative morally insignificant?"

  *   **Anticipated Answer:** The guest will likely argue that while the flicker exists, it is not a *robust* alternative. They will claim that for an alternative to ground responsibility, it must allow the agent to avoid moral blame entirely, not just avoid the mechanism of intervention.
  *   **Follow-up:** "If I understand you correctly, you're distinguishing between *any* alternative possibility and a *responsibility-grounding* alternative possibility. But doesn't that distinction itself presuppose the conclusion you're trying to prove? In other words, aren't you defining 'robustness' in a way that conveniently excludes the flicker simply because it doesn't save PAP?"

  ### 3. The Prior Sign & The Timing Problem (Required Topic)
  "I want to bundle two technical objections that often run together. For a Frankfurt intervener to know when to step in, they typically rely on a 'prior sign' that indicates what the agent will do. Incompatibilists argue that for this sign to be reliable, the agent's decision must already be causally determined, which begs the question against the libertarian. Furthermore, this raises the 'timing problem': if the sign appears early enough to guarantee intervention, doesn't the agent lose the ability to do otherwise *before* they make the decision, thereby undermining the very ownership of the action you're trying to preserve?"

  *   **Anticipated Answer:** The guest will likely argue that the sign need not be causally determining; it can be a non-causal indicator or a 'buffer' that doesn't remove freedom until the moment of decision. They will argue the timing of the loss of alternatives is simultaneous with the decision, not prior to it.
  *   **Follow-up:** "You suggest the loss of alternatives happens at the moment of decision, not before. But if the intervener is monitoring a prior sign that is infallible, isn't the future already fixed in a way that makes the 'moment of decision' merely epistemic for the agent, even if it feels free? How do you avoid the charge that the 'fixity' of the future is doing the metaphysical heavy lifting here, regardless of when we say the alternatives vanish?"

  ### 4. Guidance Control vs. Regulative Control (Required Topic)
  "A central pillar of your defense is the distinction between 'guidance control' and 'regulative control.' You argue we only need guidance control—the mechanism issuing the action must be our own—to be responsible. But consider a case of subtle manipulation where an agent's desires are engineered so they 'own' the action, yet they lack regulative control. If guidance control is truly sufficient, why does the manipulation case feel so different from the Frankfurt case? What specific feature of guidance control protects the Frankfurt agent from the charge that they are merely a conduit for a determined sequence?"

  *   **Anticipated Answer:** The guest will likely emphasize the 'history' of the mechanism. They will argue that in Frankfurt cases, the mechanism is the agent's own normal practical reasoning, whereas in manipulation cases, the history of that mechanism is compromised.
  *   **Follow-up:** "So you're relying on a historical condition to distinguish the two. But if the agent in the Frankfurt case *never* exercises the ability to do otherwise, does the 'history' of their mechanism matter? If the actual sequence is identical to a determined sequence, why does the *counterfactual* presence of the intervener not render the actual sequence just as devoid of control as the manipulation case?"

  ### 5. Control Worth Wanting (Required Topic)
  "Let's zoom out to the normative stakes. Even if you successfully show that PAP is false and that guidance control is sufficient for responsibility, have you given us the kind of control that is 'worth wanting'? Galen Strawson and others argue that without the ability to be the ultimate source of one's nature, responsibility is an illusion. If your Frankfurt agent is responsible, but couldn't have done otherwise even in the broadest sense, are we just redefining 'responsibility' to mean 'socially useful blame' rather than a deep metaphysical desert?"

  *   **Anticipated Answer:** The guest will likely adopt a Strawsonian reactive attitudes approach, arguing that the control worth wanting is the control required to participate in interpersonal relationships, not a god-like metaphysical power.
  *   **Follow-up:** "If we accept that 'control worth wanting' is just the control required for social participation, doesn't that make responsibility contingent on our social practices rather than the agent's metaphysics? If we decided as a society to stop blaming people who lacked alternative possibilities, would your argument still hold, or does your view ultimately depend on us *wanting* to hold people responsible regardless of the metaphysics?"

  ### 6. Buffer Cases and the Infallible Sign
  "David Hunt and others have developed 'buffer cases' to attack the prior sign objection. They construct scenarios where the agent can try to avoid the sign, but failing to avoid it triggers the intervention. These cases attempt to remove the question-begging prior sign. Do you think buffer cases successfully insulate Frankfurt examples from the incompatibilist critique, or do they introduce new problems regarding the agent's ability to 'try' to do otherwise that undermine the intuition of responsibility?"

  ### 7. The Manipulation Argument (Pereboom/Mele)
  "The four-stage manipulation argument is arguably the biggest live threat to compatibilist defenses of Frankfurt cases. If an agent is manipulated into having the exact psychology of the Frankfurt agent, and we intuit they aren't responsible, then the Frankfurt agent shouldn't be either. You've argued that the Frankfurt agent has a 'dispositional' power the manipulated agent lacks. Is this distinction robust enough to stop the slippery slope, or does the manipulation argument show that without regulative control, the difference between 'normal' and 'manipulated' is just a matter of degree?"

  ### 8. Sourcehood vs. Leeway
  "Much of the recent literature suggests the debate has shifted from 'leeway' (alternative possibilities) to 'sourcehood' (being the origin of the action). Your defense of Frankfurt cases seems to prioritize sourcehood. However, some critics argue that sourcehood *requires* leeway—that you can't truly be the source if you couldn't have diverged. Is your view ultimately a rejection of the 'Sourcehood Intuition' as traditionally understood, or are you proposing a new taxonomy of what it means to be a source?"

  ### 9. Blame vs. Responsibility
  "There is a growing movement to decouple 'responsibility' from 'blame.' One might argue that even if the Frankfurt agent is responsible (in the sense of being the author of the act), they might not deserve *blame* if they couldn't have done otherwise. Does your defense of Frankfurt cases commit you to the view that blame is appropriate in these cases, or do you think we can attribute responsibility while mitigating the reactive attitudes due to the lack of alternatives?"

  ### 10. Practical Implications for Accountability
  "Returning to where we started: if your view becomes the orthodoxy in ethics departments and trickles down into institutional policy, how should that change how we handle excuses? If a student claims 'I had no choice,' and we accept that 'no choice' (in the PAP sense) doesn't negate responsibility, do we risk losing empathy for coercive circumstances? How do we balance the metaphysical truth of your view with the pragmatic need to recognize when circumstances *do* mitigate culpability?"
