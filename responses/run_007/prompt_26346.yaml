prompt: |-
  I host a philosophy podcast, and after serving on a university disciplinary panel last semester—where a student argued that her circumstances left her no genuine alternative but to plagiarize—I've been unable to stop thinking about what it really takes for someone to be morally responsible. Next week's guest is a philosopher who has recently published an influential book defending Frankfurt-style counterexamples to the Principle of Alternative Possibilities. I want to push past the introductory rehearsal of the cases and press on the live fault lines in the literature. Draft eight to ten interview questions that go beyond restating the view. I want at least one question each on the flicker-of-freedom strategy, on the timing problem and whether the intervener's reliance on a prior sign begs the question against the incompatibilist, and on whether the distinction between guidance and regulative control can do the work its defenders claim—and for each, a follow-up keyed to the answer the guest is most likely to give. I also want at least one question that connects the Frankfurt cases to the broader question of what kind of control is worth wanting, and whether that matters for responsibility.
