      *   Address "existence" verbal/substantive? Yes.
      *   Cruxes (3 specific ones)? Yes.
      *   Concrete cases for cruxes? Yes.
      *   Predictions recorded? Yes.
      *   Signable by both? Yes.

  8.  *(Final thought on the "Verbal" distinction)*: This is tricky. If I say "Existence means X" and you say "Existence means Y", that's verbal. But if I say "X is the only valid math" and you say "Y is the only valid math", that's substantive. I will frame it as: The definition is terminological, the *legitimacy* of the classical definition is substantive.

