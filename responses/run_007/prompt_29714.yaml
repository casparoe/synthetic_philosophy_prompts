          *   *Strategy:* I will mark the definition as terminological (they define it differently), but the *acceptability of non-constructive existence* as substantive.

  4.  **Drafting Section 3: Cruxes:**
      *   *Goal:* Identify pivot points. If these were resolved, minds might change (or at least the debate would shift).
      *   *Crux 1: Iterative Conception & AC.* Does the cumulative hierarchy imply AC?
          *   *Case:* The nature of the set-theoretic universe $V$.
          *   *Classical Prediction:* $V$ is definite; AC holds.
