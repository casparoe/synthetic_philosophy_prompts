answer: |-
  Here is a complete workshop design for your 75-minute session. It is engineered to induce the specific cognitive dissonance of XOR Blackmail without using jargon until the debrief.

  ## Workshop Title: The Oracle's Filter
  **Goal:** Participants experience a decision where paying a cost seems irrational causally (it doesn't change the past) but rational evidentially (it correlates with a better world state).
  **Group Size:** 25 participants.
  **Time:** 75 Minutes.

  ---

  ### 1. Materials Needed
  *   **25 "Participant Packets"** (Manila envelopes).
  *   **25 "Secret Cards"** (Red or Blue cardstock, sealed inside the packets).
  *   **15 "Blackmail Letters"** (Printed slips, placed in only 15 of the 25 packets).
  *   **25 Decision Slips** (Paper for writing "PAY" or "REFUSE").
  *   **1 "Master Ledger"** (For you, the facilitator).
  *   **Pre-Workshop Survey Link** (Sent 24 hours prior, or done on phones in first 5 mins).
  *   **Currency:** "Reputation Points" (RP). Top 3 scores win a book or gift card (avoids gambling laws).

  ### 2. The Payoff Scheme (Reputation Points)
  Start everyone with **100 RP**.

  | State of World | Your Action | Outcome | Final RP |
  | :--- | :--- | :--- | :--- |
  | **Dirt (Red Card)** | **REFUSE** | **Exposed** (Catastrophe) | **0** |
  | **Dirt (Red Card)** | **PAY** | **Silenced** (Costly) | **50** |
  | **No Dirt (Blue Card)** | **REFUSE** | **Vindicated** (Best) | **100** |
  | **No Dirt (Blue Card)** | **PAY** | **Scammed** (Wasted Cost) | **80** |

  *Note: The "Scammed" penalty (20 pts) must be smaller than the "Silenced" penalty (50 pts), which must be much smaller than the "Exposed" penalty (100 pts).*

  ---

  ### 3. Timeline & Facilitator Script

  #### Phase 1: The Profile (0:00 – 0:10)
  **Action:** If you didn't send a pre-survey, have them scan a QR code now.
  **Survey Question:** *"In a high-stakes scenario where a threat depends on your compliance, do you prioritize minimizing cost (Refuse) or minimizing risk (Pay)?"*
  **Facilitator Script:**
  > "Welcome. We are running a simulation of a strategic negotiation. The system needs to profile your decision-making style. Please answer honestly. This data will be used by the 'Oracle'—an algorithm that determines your starting conditions. Do not discuss your answers."

  *(Collect phones/papers. You need 5 minutes to 'process' this. While you 'process', secretly sort your 25 Secret Cards: 12 Red (Dirt), 13 Blue (No Dirt). Randomly assign them to envelopes.)*

  #### Phase 2: The Distribution (0:10 – 0:20)
  **Action:** Distribute the Packets. 15 people get a Letter inside. 10 people get an Empty Packet (plus their Secret Card).
  **Facilitator Script:**
  > "The Oracle has run its simulation. It knows your profile. It has assigned you a 'Secret Status' (Red or Blue) inside your envelope. **Do not open it yet.**
  >
  > "Here is the rule the Oracle followed to decide who received a Blackmail Letter:
  > **The Oracle sends a Letter if and only if: (It Predicted You Would PAY) XOR (You Have Dirt).**
  >
  > "Some of you have a letter. Some of you do not. If you do not have a letter, your role is 'Auditor.' You will verify the Oracle's logic at the end. If you *do* have a letter, read it silently."

  *(The Letter reads: "We know your Secret. Transfer 50 RP to avoid exposure. If you refuse, we reveal the Secret.")*

  #### Phase 3: The Decision (0:20 – 0:40)
  **Action:** Participants with Letters must decide. Auditors watch.
  **Facilitator Script:**
  > "You have 10 minutes to decide. Write PAY or REFUSE on your slip.
  >
  > "Remember the Oracle's rule: It sent you this letter based on a *prediction* it made earlier using your survey, combined with your Secret Status. The Secret Status is already fixed in your envelope. The Prediction is already fixed in my ledger.
  >
  > "However, you are now choosing whether to fulfill that prediction. Does your choice change the Secret in the envelope? No. But does it tell you something about what's in the envelope? That's for you to weigh."

  *(Walk around. If someone asks "Is the prediction accurate?", say: "The Oracle's psychological model is historically 90% accurate for this demographic.")*

  #### Phase 4: The Reveal (0:40 – 0:55)
  **Action:** Collect Decision Slips. Reveal Secret Cards. Calculate Scores.
  **Facilitator Script:**
  > "Hand in your decisions. Auditors, please come forward. I will show you the Master Ledger. Verify that for every person who got a Letter, the XOR rule held true against their *Prediction* and their *Secret Card*."
  >
  > *(Show the ledger. It should look like this for Letter-Receivers:)*
  > *   *Predicted Pay + Blue Card = Letter Sent*
  > *   *Predicted Refuse + Red Card = Letter Sent*
  >
  > "Now, let's see the outcomes." *(Reveal cards and tally points dramatically).*

  #### Phase 5: The Debrief (0:55 – 1:15)
  **Action:** Connect the game to XOR Blackmail.
  **Facilitator Script:**
  > "Look at the people who Paid. Most of you had Blue Cards (No Dirt). You lost 20 points, but you were safe.
  > "Look at the people who Refused. Most of you had Red Cards (Dirt). You lost everything.
  >
  > "Why? Because of the XOR rule.
  > "If you were the type to Pay, the Oracle only sent a letter if you had **No Dirt**.
  > "If you were the type to Refuse, the Oracle only sent a letter if you **Had Dirt**.
  >
  > "By receiving the letter, your decision became *evidence* of your Secret Status.
  > "If you Paid, it was likely the Oracle predicted Pay, meaning you likely had No Dirt.
  > "If you Refused, it was likely the Oracle predicted Refuse, meaning you likely Had Dirt.
  >
  > "This is **XOR Blackmail**. In Causal Decision Theory, paying is irrational—the dirt is already in the envelope. In Evidential or Functional Decision Theory, paying is rational—because paying correlates with the world where the envelope is blue."

  ---

  ### 4. Honest Postmortem: What Will Go Wrong
  *As a journalist, you need to know where the simulation fails compared to the formal puzzle.*

  #### 1. The "Common Cause" Leak (Predictable Failure)
  **The Issue:** In the formal puzzle, the Blackmailer is a *logical* predictor (Omega). Your decision *now* logically determines what they predicted *then*. In this workshop, the correlation is merely *psychological*. The Survey caused the Prediction, and your Psychology causes the Decision.
  **The Risk:** Smart participants will realize: "My decision right now doesn't change the Survey I filled out 20 minutes ago. The dirt is fixed. I'm not paying."
  **Mitigation:** Emphasize the 90% accuracy rate during the decision phase. If they believe the correlation is strong, the Expected Value calculation forces them to pay, even if they don't believe in "magic."

  #### 2. The "Auditor" Boredom
  **The Issue:** The 10 people who don't get letters might disengage.
  **The Fix:** Give the Auditors a betting side-game. Let them bet RP on how many Letter-Receivers will Pay. If they guess within 10%, they get a bonus. This keeps them analyzing the incentives.

  #### 3. The "Fake Oracle" Distrust
  **The Issue:** If participants suspect you are manually adjusting the Ledger to make a point, the lesson collapses.
  **The Fix:** Be transparent about the Ledger *after* the game. Let Auditors verify the XOR math. Trust is the currency here.

  #### 4. What You Cannot Reproduce (The Debrief Key)
  You must explain this clearly in the final 10 minutes.
  *   **Logical vs. Statistical Correlation:** In the real XOR Blackmail puzzle (Ahmed/Yudkowsky), the correlation is *counterfactual*. If you *were* to choose differently, the Blackmailer *would have* predicted differently, and *would not have sent the letter*.
  *   **In the Workshop:** If a participant chooses differently than their survey, the Letter *still exists*. The past doesn't change.
  *   **The Lesson:** The workshop simulates the *Evidential* pressure (Paying looks safer), but it cannot simulate the *Acausal* leverage (Paying *makes* it safer). You must tell them: *"You felt the pull of evidence. The formal puzzle argues that your decision actually reaches back in time to select which world you are in. This game only showed you that the worlds are sorted."*

  ### 5. Facilitator Cheat Sheet (The Logic)
  *Keep this hidden on your clipboard.*

  **The XOR Rule:** $Letter \iff (Prediction \oplus Dirt)$
  *   $\oplus$ means "One or the other, but not both."

  **Your Setup for 15 Letter-Receivers:**
  1.  **5 People:** Predicted PAY + **No Dirt (Blue)**. (Letter Sent). *If they Pay: Safe.*
  2.  **5 People:** Predicted PAY + **Dirt (Red)**. (No Letter Sent). *Remove these from the Letter pool.*
  3.  **5 People:** Predicted REFUSE + **Dirt (Red)**. (Letter Sent). *If they Refuse: Doomed.*
  4.  **5 People:** Predicted REFUSE + **No Dirt (Blue)**. (No Letter Sent). *Remove these from the Letter pool.*

  *Wait, to ensure everyone in the "Letter Group" feels the tension, you must curate the 15 Letters to be a mix of the two "Letter Sent" conditions.*
  *   **Group A (10 people):** Predicted Pay + Blue Card. (Incentive: Paying confirms safety).
  *   **Group B (5 people):** Predicted Refuse + Red Card. (Incentive: Refusing confirms doom).
  *   **The Trap:** Group B participants, if they realize they are "Refuse Types," might think "I have Dirt, so I must Pay to mitigate!" But if they Pay, they violate their prediction.
  *   *Simplification for Workshop:* Just ensure the **Prediction** matches the **Decision** for most people (since the model is 90% accurate).
      *   If they follow their type: Group A (Pay/Blue) wins. Group B (Refuse/Red) loses.
      *   This creates the visceral feeling: "The people who paid are safe. The people who refused are dead."
      *   The CDT objection remains: "But paying didn't *make* me Blue!"
      *   That is the exact debate you want to spark.

  ### 6. Journalistic Angle for Your Piece
  When you write this up, focus on the **physical sensation** of the decision.
  *   **The Hook:** "I held the envelope. I knew the red card was already inside. But my hand shook writing 'REFUSE' because I knew that only people with red cards were brave enough to refuse."
  *   **The Insight:** Rationality isn't just about causality; it's about what your decision *says* about the universe you inhabit. XOR Blackmail forces you to ask: "Do I want to be the kind of person who gets blackmailed?"
  *   **The Limit:** Acknowledge that without a true "Omega" (perfect predictor), this is just sophisticated selection bias. But in a world of algorithms that *do* predict us (credit scores, policing, ads), the distinction between "causal" and "evidential" is becoming less academic and more practical.
