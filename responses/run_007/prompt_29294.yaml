answer: |-
  You call it a cop-out. I call it a safeguard.

  You have put your finger on the hardest part of my political theory, I grant you that. It is easy to speak of justice in the abstract; it is much harder to speak of it when blood is in the streets. But you are misunderstanding what I mean by "public authority," and you are underestimating the danger of the solution you propose.

  Let's look at your main charge: that I forbid the very thing I say is necessary. You say if the tyrant controls the army and the courts, there is no public authority left to depose him.

  I ask you: Who made the tyrant?

  If he is a usurper—as we are discussing here, a man who seized power without right—he never truly held authority. He holds power, yes. Force, yes. But authority? No. Authority belongs to the community. When a man seizes what does not belong to him, he breaks the pact with the people. In that case, the "public authority" does not vanish into thin air. It reverts to the community itself, or to those who represent the community—the nobles, the magistrates, the leading men who hold the place of the multitude.

  I am not saying a private citizen must go to the tyrant's own corrupt judge to ask permission to kill him. That would be absurd. I am saying that the act of removing a tyrant cannot be the act of a *private* individual acting on their own judgment. It must be the act of the *public* body acting to remove a cancer.

  Do you see the distinction? If one private man decides the ruler is a tyrant and kills him, that man has set his own judgment above the law. He has made himself a judge in his own case. And if he can do that, why can't his neighbor do the same to him tomorrow?

  You ask why the private citizen isn't allowed to do it, especially if innocents are dying. I ask you: What happens the day after the killing?

  History is my teacher here, not just scripture. Look at the Romans. They killed Caesar. They called him a tyrant. Did liberty return? Or did the blood of one tyrant water the seeds of a civil war that brought forth many more? When you allow private tyrannicide, you teach every ambitious malcontent that the way to power is through the dagger. You destabilize the very concept of office.

  If a private man kills a tyrant, he is often praised in the moment, but he has introduced a principle that will destroy the state. He has said that political problems are solved by murder. I would rather endure a bad ruler for a time than unleash a perpetual cycle of assassination where every successor is judged and executed by the next disgruntled subject.

  So, to answer your specific trap: If the tyrant controls all the institutions, then the "public authority" is the community rising up *together*, through its representatives, to depose him. It is not a murder; it is an execution of justice by the body politic against a thief who stole their peace.

  But if you mean to ask, "Thomas, what if the community is too terrified to move, and only one brave soul can stop the slaughter?"

  Then I say this: That brave soul risks his soul. He may save the city physically, but he undermines the order of justice. And furthermore, who guarantees he is right? What if he is mistaken? What if the "tyrant" was actually punishing rebels, and this "hero" is just a factionalist?

  I do not say resistance is impossible. I say it must be *public*, or it is merely sedition dressed in holy clothing.

  So I put the question back to you: Is it better to have a rule of law that is sometimes slow to punish evil, or a rule of violence where any man with a sword can decide that his ruler is a tyrant and act accordingly? Where does that road end?
