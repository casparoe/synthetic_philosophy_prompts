      *Refining the "Verbal" aspect:* This is a key philosophical point. Carnap vs. Quine. I need to make sure the table reflects that *they* might disagree on whether the disagreement is verbal. I'll note that in the table.

      *Refining the "Concession":* Make sure it's not impossible. "If God appeared" is bad. "If LIGO detected X" is better.

      *Let's build the content.*

      *   *Agreement 1:* Bucket shows acceleration is non-relative to nearby matter.
