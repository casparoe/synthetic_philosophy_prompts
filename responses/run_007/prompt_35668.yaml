      *   **Universalization:** Imagine everyone acting on that maxim in similar circumstances.
      *   **Contradiction in Conception (CC):** The maxim becomes impossible to conceive as a universal law (logical/physical impossibility). Leads to Perfect Duties (strict prohibitions/obligations).
      *   **Contradiction in Willing (CW):** The maxim can be conceived as universal, but cannot be *willed* as such without contradicting oneself (undermining one's own rational ends). Leads to Imperfect Duties (wide obligations).
