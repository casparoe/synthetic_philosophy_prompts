  3.  **Deconstruct the SE Vocabulary:**
      *   **Property-Based Testing (PBT):** Generating inputs, checking invariants hold.
      *   **Invariants:** Conditions that must always be true.
      *   **Pre/Postconditions:** Contracts on functions.
      *   **Concurrency/Deadlock:** Multiple agents accessing shared state, system halts or violates consistency.
      *   **Formal Specification:** Mathematical description of system behavior.

  4.  **Drafting the Translation (Mental Sandbox):**
