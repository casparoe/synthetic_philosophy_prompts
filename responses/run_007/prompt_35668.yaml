      *   *Maxim Description:* In SE, this is the "specification gap." If I test `sort(list)`, I expect order. If I test `permute(list)`, I don't. The moral weight lies in *how the agent describes their action*. SE assumes the spec is given; Kant asks the agent to generate the spec correctly.
