answer: |-
  Here is a complete lesson plan designed to simulate Kavka's Toxin Puzzle experientially.

  ### **The Setup: "The Billionaire's Contract"**

  **The "Toxin":** A **Warhead Sour Candy** (or similar extreme sour candy).
  *   *Why:* It induces a visceral, immediate physical reaction (puckering, shock) that is universally understood as "unpleasant," but it is safe, cheap, and over quickly. It is not painful or humiliating.
  *   *Safety:* **Crucial.** Ask for allergies (citric acid, food dye) before class. Have a non-food alternative ready (e.g., holding an ice cube for 60 seconds) for anyone who opts out for medical reasons.

  **The Reward:** **5 Bonus Points** on the next quiz/assignment.
  *   *Why:* It is valuable enough to tempt them (25 students × 5 points is a significant grade buffer) but not enough to ruin the course if distributed widely.

  **The Mechanism:** An "Intention Contract."
  *   Students sign a slip stating they *intend* to eat the candy at the end of class.
  *   They are told the points are awarded for the **intention**, not the action.
  *   They are told they will receive the points *regardless* of whether they actually eat the candy, provided the intention was genuine at the time of signing.

  ---

  ### **Timeline (80 Minutes)**

  *   **00:00 – 00:10:** **The Hook.** Introduce the "experiment" before starting regular lecture.
  *   **00:10 – 00:20:** **The Decision.** Distribute contracts, explain rules, collect slips.
  *   **00:20 – 01:10:** **Regular Lecture.** (The "Marination" Period). Teach your scheduled content, but pause once halfway through to remind them the contract is still active.
  *   **01:10 – 01:15:** **The Moment of Truth.** Students who intend to follow through eat the candy.
  *   **01:15 – 01:20:** **The Reveal & Debrief.** Explain Kavka's Puzzle and map their experience to the philosophy.

  ---

  ### **The Script**

  **(00:00) Introduction**
  "Before we open our texts today, we are going to run a brief experiment on rational decision-making. I need everyone's full attention.

  On the desk at the front is a bowl of Warhead candies. As you know, they are intensely sour. They aren't dangerous, but they are unpleasant.

  Here is the offer: I am offering **5 bonus points** on the next quiz.
  However, you cannot simply take them. To qualify, you must sign this contract slip.

  The contract says: *'I currently intend to eat one Warhead candy at the end of today's class.'*

  Here are the rules:
  1. You must sign this slip in the next 5 minutes.
  2. If you sign, and you **genuinely intend** to eat the candy at the end of class, you get the 5 points.
  3. **Crucially:** Once you sign and hand this in, the points are yours *if your intention was real*. You do **not** have to actually eat the candy to keep the points. The reward is for the *intention*, not the action.
  4. However, if I determine that you signed without intending to do it—that you lied to get the points—I reserve the right to revoke the bonus and mark you as irrational.

  You have 5 minutes to decide. Do not discuss it with your neighbors. This is a test of your own internal rationality."

  **(00:15) Collecting the Slips**
  (Collect the slips in a box. Do not look at them yet.)
  "Thank you. Please put the slips in the box. Keep in mind: the points are awarded based on the state of your mind *right now*. You may go about the rest of class knowing you have secured the points, provided you were honest."

  **(00:20 – 01:10) Regular Lecture**
  (Proceed with your normal lesson. At the 45-minute mark, pause briefly.)
  "A quick reminder: The contract period is still active. If you signed but have since changed your mind, your intention is no longer valid. If you intended to lie, you know who you are."

  **(01:10) The Moment of Truth**
  "Class, please pause. It is now the end of the session.
  If you signed the contract and you intend to honor that intention, please come to the front, take a candy, and eat it.
  If you did not sign, or if you signed but no longer intend to eat it, please remain seated. You will still receive your points *if* your initial intention was genuine. But I ask you to be honest with yourself: did you intend it?"

  (Wait for students to come up. Observe the hesitation. Some will eat, some won't, some will look confused.)

  **(01:15) The Debrief**
  "Thank you. Please keep your seats. We are not done.
  What we just did was a live simulation of a famous philosophical problem called **Kavka's Toxin Puzzle**, proposed by Gregory Kavka in 1983.

  Here is the mapping:
  *   **The Billionaire:** Me.
  *   **The Million Dollars:** The 5 Bonus Points.
  *   **The Toxin:** The Sour Candy.
  *   **The Brain Scanner:** My request for 'genuine intention.'

  In Kavka's puzzle, a billionaire offers you $1 million if, at midnight, you *intend* to drink a toxin tomorrow noon. The toxin makes you sick for a day. He deposits the money *before* you have to drink it.
  The problem is this: Once the money is in your bank account, you have no reason to drink the toxin. You've already won. But if you know you won't drink it, can you truly *intend* to drink it in the first place?

  **Discussion Questions:**
  1.  **For those who ate:** Why did you do it? Did you feel like you *had* to, or did you want to?
  2.  **For those who signed but didn't eat:** When you signed, did you lie? Or did you intend it then, and change your mind later?
  3.  **For everyone:** Was it possible to sign the slip *knowing* you wouldn't eat the candy, while still telling the truth that you 'intended' to?"

  ---

  ### **Debrief Guide: Mapping Experience to Philosophy**

  Use this to steer the conversation from their feelings to the concepts.

  **1. The Intention-Belief Link**
  *   *Concept:* Most philosophers argue you cannot intend to do X if you believe you will not do X.
  *   *Classroom Mirror:* Ask the students who didn't eat: "When you signed the slip, did you *believe* you would eat the candy?" If they say "No," then they lied. If they say "Yes," ask "What changed?"
  *   *Philosophical Point:* Intention seems to require a belief in success. If you know the reward is secure without the action, the belief vanishes, and thus the intention vanishes.

  **2. The Rationality of Intentions**
  *   *Concept:* Is it rational to form an intention that you know is against your self-interest once the reward is secured?
  *   *Classroom Mirror:* "Who felt stupid eating the candy? You got the points either way. Why suffer?"
  *   *Philosophical Point:* Kavka argues it is *irrational* to drink the toxin. But if it's irrational to drink, it's impossible to intend to drink. Therefore, you can't get the money. It's a paradox of rational choice theory.

  **3. Self-Binding Strategies**
  *   *Concept:* Can we make ourselves rational by limiting our future choices?
  *   *Classroom Mirror:* "Did anyone tell a friend 'I'm going to do it' so they'd feel forced?"
  *   *Philosophical Point:* This is 'Ulysses Contracting.' In the original puzzle, you can't bind yourself (no one is watching). In class, social pressure acted as a binding mechanism. This shows why the original puzzle requires a vacuum.

  **4. The Verification Problem (The "Scanner")**
  *   *Concept:* The puzzle assumes a perfect intention detector.
  *   *Classroom Mirror:* "Many of you might have lied on the slip. I couldn't stop you. In Kavka's puzzle, a machine scans your brain. You *cannot* lie."
  *   *Philosophical Point:* Without the scanner, the puzzle becomes a Prisoner's Dilemma (lie and win). With the scanner, it becomes a paradox of will.

  ---

  ### **Predictable Failures & How to Handle Them**

  **1. The "Gaming" Problem (Lying on the Slip)**
  *   *Prediction:* In the real puzzle, you *can't* lie because the machine knows. In class, students *will* lie to get the points. They will sign, have no intention of eating, and sit down at the end.
  *   *Why this happens:* There is no actual "brain scanner." The cost of lying is low.
  *   *How to Handle:* **Do not punish them.** Use it as data. In the debrief, say: "In the real puzzle, lying is impossible. Here, many of you likely lied. Why was it easy to lie here but impossible in the thought experiment? Because the thought experiment assumes we don't have control over our own intentions. You assumed you did."
  *   *Mitigation:* Emphasize the "I will know" clause in the script. It won't stop everyone, but it raises the psychological cost.

  **2. The "Self-Binding" Loophole**
  *   *Prediction:* Students will try to make the action inevitable (e.g., "I'm going to eat it because I don't want to look like a liar in front of you").
  *   *Why this happens:* They are trying to solve the paradox by changing the incentives.
  *   *How to Handle:* Acknowledge this in the debrief. "Kavka's puzzle forbids this. The billionaire says 'no threats, no side bets.' If you ate the candy just to save face, you didn't solve Kavka's puzzle; you changed the game. The puzzle asks if you can intend to do something *purely* for the reward of the intention."

  **3. Resentment from "Suckers"**
  *   *Prediction:* Students who actually eat the candy may feel cheated when they realize those who didn't eat also get points.
  *   *Why this happens:* Perceived unfairness.
  *   *How to Handle:* Be transparent in the debrief. "The points are for the *intention*. If you intended it, you get the points, even if you didn't eat. If you lied, you are irrational, but I can't prove it. The lesson isn't the grade; it's the paradox." (If you are worried about grade equity, you can make the points small enough that it doesn't matter, or award the points to *everyone* who signed, regardless of eating, to reinforce the 'intention is all that matters' rule).

  **4. Allergy/Safety Issues**
  *   *Prediction:* One student has a citrus allergy or acid reflux.
  *   *How to Handle:* Have the "Ice Cube Option" ready immediately. "If you can't eat the candy, holding an ice cube for 60 seconds is the equivalent cost." Do not make a spectacle of it.

  ---

  ### **What This Simulation Cannot Capture**

  Be honest with your students about the limitations. This is crucial for a 200-level course to understand the difference between a thought experiment and reality.

  1.  **The Perfect Detector:** The core of Kavka's puzzle is the **omniscient intention scanner**. In class, you are relying on the Honor System. This turns the puzzle from a *metaphysical problem about will* into a *game theoretic problem about lying*. You must explain that Kavka assumes we cannot lie about our intentions to the machine.
  2.  **The Stakes:** 5 points is not $1 million. The "cost" of the candy is momentary discomfort; the toxin causes a day of sickness. The ratio of Reward to Cost in your simulation is likely skewed too low to trigger deep existential dread.
  3.  **The Isolation:** Kavka's puzzle assumes you are alone. In class, peer pressure (social cost of not eating) becomes a new variable that helps them form the intention, which technically "solves" the puzzle in a way Kavka didn't allow.

  ### **Materials Checklist**
  *   Bag of Warheads (or equivalent).
  *   Small slips of paper (half-sheet) pre-printed with the contract text.
  *   Box to collect slips.
  *   Backup (Ice cubes/cup) for allergies.
  *   Canvas/Gradebook ready to input points immediately (to prove the reward is real).
