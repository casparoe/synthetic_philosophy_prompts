  **Tolstoy's Art Classification Tree**

  **Node 1: Sincerity**
  *Question:* Was the primary impulse behind this work an uncontrollable need to transmit a feeling the artist genuinely experienced, or was it to entertain, impress, or imitate established forms?
  *   *Entertain/Imitate:* **Counterfeit Art**. (Stop)
  *   *Genuine Transmission:* Proceed to Node 2.

  **Node 2: Exclusivity**
  *Question:* Does the feeling transmitted rely on special education, class status, or nationalism to be understood, or does it separate people into distinct groups?
  *   *Exclusive/Separating:* **Bad but Genuine Art**. (Stop)
  *   *Accessible/Uniting:* Proceed to Node 3.

  **Node 3: Consciousness**
  *Question:* Does the feeling simply reflect common human experience (grief, joy, wonder), or does it awaken a consciousness of human brotherhood and relation to the Divine Source?
  *   *Common Experience:* **Good Universal Art**.
  *   *Brotherhood/Source:* **Good Religious Art**.

  **Blurred Boundaries**
  **Universal vs. Religious:** Tolstoy views religious art as the apex of universal art. The distinction is often degree, not kind. A story about simple grief (Universal) may implicitly affirm shared humanity (Religious). Tolstoy admits the "religious consciousness of his time" evolves, making this category fluid. In practice, a work transmitting profound wonder at nature might sit comfortably in both leaves.

  **Missing Combinations**
  **Genuine + Exclusive + Religious:** Logically, one could imagine a work sincerely transmitting a sectarian religious feeling that excludes outsiders. Tolstoy gives this no leaf. He rules it out by definition: true religious consciousness *is* the recognition of unity. Therefore, exclusive religious feeling is categorized as **Bad but Genuine Art** (sectarianism/nationalism) or **Counterfeit** (church ritual imitated). He overlooks the possibility of sincere sectarian faith being spiritually valid, but within his system, it is morally "bad" because it divides. This reveals his deeper commitment: Art's value is ethical, not aesthetic. If it divides, it fails the religious test, regardless of sincerity.

  **Instruction for Use**
  Ask students to answer Node 1 brutally. Most professional work fails here, becoming "counterfeit" not due to lack of skill, but lack of sincere infection. This provokes the necessary argument: Is "infection" enough? Is accessibility elitist in disguise? Use the tree not to judge, but to locate the friction points in their own poetics.
