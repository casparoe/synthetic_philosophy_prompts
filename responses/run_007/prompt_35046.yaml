              *   *Common Emotion:* **Good Universal Art**.
              *   *Brotherhood/Source:* **Good Religious Art**.
      *   *Blurred Leaves:* Universal vs. Religious. Tolstoy views religious art as the highest universal art; the distinction is often degree, not kind.
      *   *Missing Combination:* Genuine + Exclusive + Religious. Tolstoy rules this out: true religious consciousness *is* unity. Exclusive "religious" art is, for him, counterfeit or bad genuine (sectarianism).

