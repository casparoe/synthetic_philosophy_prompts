answer: |-
  Here is a defended agenda for a dissertation on expected value fanaticism, based on the current state of the formal literature.

  ### The Diagnosis: Where the Confusion Lies

  The field is currently stalled because it conflates three distinct problems under the label "Pascal's Mugging/Fanaticism":
  1.  **Epistemic:** Should rational credences in extreme claims decay fast enough to offset the utility? (Williamson, Smith).
  2.  **Axiomatic:** Which decision-theoretic axiom must be violated to avoid the conclusion? (Beckstead & Thomas, Buchak).
  3.  **Ethical:** Is the utility function (e.g., Total Utilitarianism) the culprit? (Greaves, Holt).

  Most existing work tries to solve one by assuming the others are fixed. This is why you hit a wall: if you fix the ethics (Total Utilitarianism) and the epistemology (Bayesianism), the decision theory *must* be fanatical unless you break VNM. If you fix the decision theory (EUT) and ethics, you must break Bayesianism.

  Your dissertation should not try to "solve" fanaticism by picking a side. It should map the **dependency structure** of these breaks. The goal is to determine which breakage is *least costly* to the rest of rational choice theory.

  Here are the two priorities I would assign, followed by what to avoid.

  ---

  ### Priority 1: The Axiomatic Cost of "Timidity"
  **Question:** *What is the minimal set of VNM axioms that must be dropped to block fanaticism without triggering immediate reductios (like money pumps or dominance violations)?*

  **Reasoning:**
  This is the most **upstream** question. Before you can ask if an anti-fanatical rule is useful (dynamic consistency) or epistemically justified, you must define the rule. Currently, the literature offers a menu: Bounded Utility (violates Dominance/Unboundedness), Probability Thresholds (violates Continuity), or Risk-Weighted EUT (violates Independence).

  We lack a **characterization theorem** for "timid" decision rules. We know EUT leads to fanaticism with unbounded utility. We do not have a precise map of *exactly* which weakening of Continuity or Dominance is required to block tails of size $10^{100}$ while preserving rational behavior for tails of size $10^6$. Most proposals are ad hoc (e.g., "ignore probabilities $< 10^{-9}$"). A formal derivation of the *necessary* axiom violation would clarify whether anti-fanaticism is a local patch or a fundamental restructuring of rationality.

  **Tractability:** High. This is pure formal decision theory. It requires constructing preference relations over lotteries with heavy-tailed payoffs and testing them against standard axioms. It fits your 3-year timeline and skillset perfectly.

  **Upstream Status:** Very High. If you prove that blocking fanaticism requires violating a "core" axiom like State-Wise Dominance, that effectively kills the anti-fanatic project (since Dominance is hard to give up). If you prove it only requires a specific, localized weakening of Continuity, that opens the door for Priority 2.

  **Shift Factors:**
  *   **Up:** If new work in formal epistemology (e.g., on complexity priors) suggests credences *can* be non-negligible for extreme claims, the pressure shifts entirely to the decision rule, making this question urgent.
  *   **Down:** If the "Longtermism" movement pivots away from Total Utilitarianism (e.g., toward Person-Affecting views), the utility function becomes bounded naturally, rendering this axiomatic work less relevant.

  ---

  ### Priority 2: Diachronic Consistency of Anti-Fanatical Rules
  **Question:** *Can a non-fanatical decision rule be made dynamically consistent, or does rejecting the "mug" today force you to accept a Dutch Book tomorrow?*

  **Reasoning:**
  This is the **viability** check. The standard objection to threshold views or bounded utility is that they are dynamically inconsistent. If you reject a bet today because the probability is below your threshold, but you know that tomorrow you will face a sequence of such bets that *collectively* exceed the threshold, you are exploitable.

  While Priority 1 defines the rule, Priority 2 tests whether the rule can survive in a sequential world. Most existing defenses of anti-fanaticism are static (one-shot). Given that longtermist decisions are inherently sequential (we make choices over centuries), a static defense is insufficient. There is a gap in the literature regarding **resolute choice** or **self-binding** mechanisms specifically for tail-risk scenarios. Can you formalize a policy that rejects the mug without opening yourself to a diachronic Dutch Book?

  **Tractability:** Medium-High. This requires modeling sequential decision trees with heavy-tailed nodes. It is formal but more complex than Priority 1. It is doable without a lab, but requires careful game-theoretic modeling.

  **Upstream Status:** Medium. It depends on the output of Priority 1 (you need a rule to test). However, it is upstream of *normative recommendation*. If the rule is dynamically inconsistent, the axiomatic work in Priority 1 is purely theoretical curiosity.

  **Shift Factors:**
  *   **Up:** If AI alignment or existential risk modeling becomes more formalized, the "sequential" nature of risk mitigation becomes more salient, increasing demand for diachronic models.
  *   **Down:** If the field accepts that rational agents can be "myopic" in tail scenarios without penalty (a controversial stance), the pressure to solve dynamic consistency drops.

  ---

  ### Overrated: Moral Uncertainty as a Dampener
  **Question:** *Does hedging across moral theories (e.g., averaging Total Utilitarianism and Person-Affecting views) solve fanaticism?*

  **Reasoning:**
  This is currently **overrated** as a dissertation focus. The intuition is that if you are 10% confident in a non-fanatical theory, you won't act fanatically. However, formal analysis suggests this just **delays** the problem. If the fanatical theory has unbounded utility, even a tiny credence in it can swamp the non-fanatical theories (the "Fanaticism in Moral Uncertainty" problem).

  Unless you have a novel formal mechanism for how moral credences interact with utility bounds, this topic is saturated. The low-hanging fruit was picked by MacAskill, Bykvist, and Ord (2020). Pursuing this risks ending with the conclusion "Moral Uncertainty doesn't help," which is a negative result that doesn't advance the decision theory itself. It moves the buck from decision theory to meta-ethics, which is less tractable for a formalist.

  **Why it's downstream:** Even if moral uncertainty dampens fanaticism, it doesn't solve the *structural* problem for an agent who is certain of their moral theory. It's a patch, not a foundation.

  ---

  ### Summary of the Agenda

  1.  **Start with Priority 1 (Axiomatics).** Spend year 1 mapping the exact axiom violations required to block fanaticism. Do not propose a solution yet; characterize the *cost* of the solution. This establishes the theoretical landscape.
  2.  **Move to Priority 2 (Dynamics).** Spend year 2 testing the viable candidates from Year 1 against diachronic Dutch Books. This filters the theoretically possible from the practically viable.
  3.  **Avoid Moral Uncertainty.** Treat it as a background variable, not the focus.

  **The "Confusion" to Exploit:**
  The field is confused about whether **Fanaticism** is a bug in *probability* (we shouldn't believe the claim) or *utility* (we shouldn't value the outcome) or *aggregation* (we shouldn't maximize expectation). By focusing on the **Axiomatic Cost**, you force the field to admit that if probabilities and utilities are fixed, the *aggregation rule* is the only variable left. This clarifies the debate more than another paper arguing about priors.

  **Final Advice:**
  Be wary of "Longtermism" as a motivator. It is a use-case, not a theory. If you tie your dissertation too tightly to longtermist ethics, you risk dating your work if the movement shifts. Keep the focus on **Decision Theory under Heavy Tails**. That is a permanent problem in mathematics and economics, regardless of whether one cares about the far future.
