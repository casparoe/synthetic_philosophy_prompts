      *   The regress: To follow a rule, you need an interpretation of the rule. But the interpretation itself is just another sign/post. How do you follow *that*? (Wittgenstein's "paradox of interpretation").
      *   Crucial distinction: Skepticism about *knowledge* vs. Skepticism about *facts*. Kripke is arguing there is *no fact of the matter*, not just that we can't access it.

