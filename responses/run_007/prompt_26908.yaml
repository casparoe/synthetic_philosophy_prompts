          *   Dispositionalism: Maybe I was disposed to say "125" for "68+57". But what if I made a mistake? Or what if my brain is finite and would have malfunctioned at large numbers? Dispositions describe what I *would* do, not what I *should* do (normativity).
          *   Mental State/Algorithm: If the algorithm is in my head, is it a picture? A formula? If it's "add 1 repeatedly," how do I know "add 1" means *plus 1* and not *quus 1*? (The interpretation regress).
      *   *Point 3: "Isn't this just generic skepticism?"*
