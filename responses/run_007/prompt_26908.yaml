      *   *However*, the philosophical bite isn't about *epistemic uncertainty* (how do I *know*?). It's about *metaphysical constitution* (what *makes* it the case?).
      *   The user suggests the "algorithm" fixes meaning. Kripke's skeptic asks: What constitutes *grasping* that algorithm?
