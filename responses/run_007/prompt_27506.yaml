prompt: |-
  I'm a grad student TA-ing for an undergrad moral philosophy course, and next week I have to lead a fifty-minute discussion section on the idea that hypocrisy undermines your standing to blame. The professor covered it in lecture but the students were visibly confused — they kept saying things like "but if what the hypocrite says is true, why can't they say it?" I need to un-confuse them and actually get the philosophical point to land.

  Don't explain the topic to me — I know the literature. What I need is a teaching plan: what has to go first in the section, what example should carry the whole thing (and what the example needs to have and not have), what misconceptions they'll bring in or form along the way and exactly where I should head each one off, and one question I can ask at the end to check whether they actually got it rather than just nodding along. I'm especially worried they'll conflate "lacking standing" with "being wrong" or "being a bad person," and I'm not sure how to sequence things so the distinction between the truth of the blame and the standing to issue it feels unavoidable rather than like a technicality. Also, when you lay out the plan, please flag which parts of the standing-to-blame debate are basically settled among people working on it and which parts are genuinely contested — I don't want to accidentally present one contested view as if it's the consensus and have the professor give me a look.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **User:** Grad student TA for an undergrad moral philosophy course.
      *   **Task:** Lead a 50-minute discussion section on "hypocrisy undermines standing to blame."
      *   **Problem:** Students are confused (specifically: "If the blame is true, why can't they say it?").
      *   **Constraints:**
          *   Do *not* explain the topic to the TA (they know the literature).
          *   Provide a *teaching plan* (sequencing, examples, misconceptions, check-for-understanding question).
          *   Specific focus: Distinguish "lacking standing" from "being wrong" or "being a bad person." Make the distinction feel unavoidable, not technical.
          *   Specific focus: Flag settled vs. contested areas in the literature (to avoid professor pushback).
      *   **Time:** 50 minutes.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Core Intuition:* Hypocrites lack the moral authority to blame.
      *   *Student Confusion:* Truth of the accusation vs. Right to accuse. (The "Tu Quoque" fallacy confusion).
      *   *Key Distinction:* Standing (procedural/normative authority) vs. Content (substantive moral truth).
      *   *Literature Landscape:*
          *   *Settled:* Hypocrisy *can* undermine standing (the "No Standing" view is dominant enough for undergrads). It's distinct from the truth of the claim.
          *   *Contested:* *Why* it undermines standing (Commitment, Authority, Equality/Unfairness accounts). Whether it *always* undermines standing (e.g., reformed hypocrites, minor vs. major violations). Whether standing can be regained.

  3.  **Drafting the Teaching Plan - Step-by-Step:**

      *   **Goal:** Make the distinction between *truth* and *standing* visceral.
      *   **Time Allocation:**
          *   Intro/Warm-up: 5 mins
          *   Core Example & Discussion: 25 mins
          *   Addressing Misconceptions (The "But they're right!" moment): 10 mins
          *   Nuance/Contested Terrain: 5 mins
          *   Exit Ticket/Check: 5 mins

      *   **The Example:** Needs to be high stakes but relatable. Needs to separate the *act* from the *actor*.
          *   *Idea 1:* Cheating on a test. (A bit cliché).
          *   *Idea 2:* Smoking while telling kids not to smoke. (Classic, but maybe too health-focused).
          *   *Idea 3:* Stealing while accusing someone of stealing. (Good, clear moral violation).
          *   *Selection:* The "Speeding Parent" or "Cheating Partner." Let's go with a modified "Cheating Partner" scenario but sanitized for class. Actually, the "Speeding Parent" is often clearer for *authority*. Let's try a "Roommate" scenario. It's peer-to-peer, removing parental authority complications.
          *   *Refinement:* Let's use a "Late Assignment" scenario. It's meta (they are students).
          *   *Wait, better:* The "Stolen Lunch" scenario. It's petty but clearly wrong.
          *   *Best Choice:* **The "Eco-Hypocrite" vs. The "Private Thief".** Actually, to hit the "standing" point hardest, we need a case where the blamer is *guilty of the same thing*.
          *   *Selected Example:* **The "Plagiarizing Accuser."** Student A accuses Student B of plagiarism. Student A also plagiarized.
          *   *Why:* It's relevant to their lives. It separates the *fact* of plagiarism (true/false) from the *right* to accuse (standing).

      *   **Sequencing to Force the Distinction:**
          1.  Establish the wrongness of the act (B plagiarized).
          2.  Establish the truth of the accusation (A is right about B).
          3.  Introduce the hypocrisy (A also plagiarized).
          4.  Ask: "Does A's accusation land?"
          5.  If they say "Yes, because it's true," push: "Would you accept the blame from A?" "Is A allowed to demand restitution?"

      *   **Misconceptions to Head Off:**
          1.  *Tu Quoque:* "You did it too!" doesn't make *you* innocent. (Need to affirm this first).
          2.  *Moral Worth:* "A is a bad person." (Standing isn't about general goodness).
          3.  *Effectiveness:* "A's blame won't work." (Standing is normative, not psychological).

      *   **Settled vs. Contested:**
          *   *Settled:* Standing is distinct from truth. Hypocrisy is a paradigmatic defeater of standing.
          *   *Contested:* The *ground* of standing (Equality vs. Commitment vs. Authority). Whether *all* hypocrisy defeats standing (proportionality).

      *   **The Exit Question:** Needs to test the distinction, not memory.
          *   *Draft:* "Can a hypocrite be right?" (Too easy).
          *   *Draft:* "Why can't they blame?" (Too open).
          *   *Better:* A scenario where the truth is clear, but the standing is manipulated. Or vice versa.
          *   *Best:* A case where someone *doesn't* lack standing despite being imperfect. (The "Reformed" or "Lesser Evil" case).

  4.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* The plagiarism example might get bogged down in university policy. Let's stick to interpersonal moral blame, not institutional reporting.
      *   *Revision:* Use a "Gossip/Secret" scenario. A tells B "You shouldn't spread rumors." A spreads rumors.
      *   *Actually, let's go with the "Speeding Driver" classic but updated.* It's universally understood.
      *   *Wait, the prompt asks for ONE example to carry the whole thing.* It needs to be robust.
      *   *Decision:* **The "Drunk Driving Dad" (or Parental Figure).** No, that's too heavy.
      *   *Decision:* **The "Cheating Teammate."** You are working on a group project. Partner A slacks off. Partner B slacks off *more* or *also*. Partner A blames Partner B.
      *   *Let's go with the "Roommate Dish" scenario.* It's low stakes, high frequency.
      *   *Wait, I need to make sure the "Truth" is undeniable.*
      *   *Okay, Final Decision on Example:* **The "Speeding Driver" is actually the clearest for philosophical distinction.** Everyone knows speeding is wrong. Everyone knows cops can be speeders. But for *moral* blame (not legal), let's use **The "Gossipy Moralist."**
      *   *Actually, the prompt mentions students said "If what they say is true..."* I need an example where the truth is *obviously* true.
      *   *Let's use the "Stealing" example.* It's binary.
      *   *Scenario:* Alex steals $20 from the pot. Blair accuses Alex. Blair has also stolen from the pot before.
      *   *Why this works:* It isolates the specific norm violation.

      *   *Wait, I need to flag the literature status.*
      *   *Friedland (2002), Bell (2013), Fritz & Miller (2018).*
      *   *Consensus:* Hypocrisy undermines standing.
      *   *Disagreement:* Why? (Unfairness/Equality vs. Commitment to Values).

      *   *Exit Question:* Needs to be a "Apply the principle" question.
      *   *Idea:* "Imagine someone who violated the norm 10 years ago and has been perfect since. Do they have standing?" (Tests the 'commitment' vs. 'equality' view).

  5.  **Finalizing the Structure:**
      *   **0-5 min:** Warm-up (The "Truth" Intuition).
      *   **5-25 min:** The Core Case (The "Stealing Roommate"). Drill the distinction.
      *   **25-35 min:** Misconception Management (Tu Quoque, Bad Person, Effectiveness).
      *   **35-45 min:** The "Why" (Settled vs. Contested).
      *   **45-50 min:** Exit Question.

  6.  **Writing the Content:** (Focusing on tone: professional, supportive of TA, precise on philosophy).
      *   *Tone Check:* Don't lecture the TA. Give them the script/flow.
      *   *Literature Check:* Ensure I don't say "It's definitely the Equality Account." Say "Many argue..."
      *   *Misconception Check:* Explicitly script the "But they're right!" interruption.

  7.  **Review against Constraints:**
      *   50 mins? Yes.
      *   One carrying example? Yes (The Roommate/Stealing case).
      *   Misconceptions flagged? Yes.
      *   Settled vs. Contested flagged? Yes.
      *   Exit question included? Yes.
      *   No explaining the topic to TA? Yes.

  8.  **Final Polish:** Make sure the distinction between *normative standing* and *psychological effectiveness* is clear, as students often conflate "I won't listen to them" with "They can't tell me."

  *(Self-Correction during final review)*: I need to make sure the example isn't *too* legalistic. Standing to *blame* is moral, not legal. I will emphasize the *interpersonal* reaction ("I resent *you* telling me this") rather than the institutional penalty.

  Let's refine the example to: **The "Late Night Noise" Scenario.**
  *   Norm: Don't wake roommates.
  *   Violator: Alex wakes roommates.
  *   Blamer: Blair wakes roommates (last week).
  *   Accusation: Blair tells Alex "You shouldn't have woken me."
  *   This is perfect. It's moral, interpersonal, and recurring.

  Okay, ready to generate the response.
answer: |-
  Here is a 50-minute teaching plan designed to force the distinction between *truth* and *standing* without getting bogged down in jargon. It relies on a single, evolving case study and explicitly flags the dialectical landscape for you.

  ### **The Carrying Example: "The Noisy Roommate"**

  **The Setup:**
  Alex and Blair are roommates. They have an explicit agreement: "No loud music after 11 PM."
  *   **Last Tuesday:** Blair played loud music until 1 AM.
  *   **Tonight:** Alex plays loud music until 1 AM.
  *   **The Confrontation:** Blair wakes up, angry, and says to Alex: "What you did was wrong. You violated our agreement. You owe me an apology."

  **Why this example works:**
  1.  **Truth is undeniable:** Alex *did* violate the norm. (Preempts "But maybe they're innocent?")
  2.  **Hypocrisy is clear:** Blair *just* did the same thing.
  3.  **Stakes are low:** It avoids heavy baggage (like abuse or crime) that triggers emotional reasoning over normative reasoning.
  4.  **Interpersonal:** It isolates *moral standing* from *institutional authority* (unlike a cop or professor).

  ---

  ### **Part 1: The Hook & The Intuition (0:00–0:10)**

  **Goal:** Elicit the "But they're right!" confusion immediately so you can dismantle it.

  1.  **Present the Case (3 mins):** Write the setup on the board. Keep it sparse.
  2.  **The First Vote (2 mins):** Ask: "Is Alex's action wrong?" (Get unanimous agreement). "Is Blair's accusation *factually* correct?" (Get unanimous agreement).
  3.  **The Pivot Question (5 mins):** Ask: "Does Blair have the **right** to demand an apology from Alex?"
      *   *Expected Reaction:* Half the room will say "Yes, because Alex is wrong." Half will say "No, because Blair did it too."
      *   *Your Move:* Do not resolve this yet. Write "TRUTH" on the left side of the board and "STANDING" on the right.
      *   *Say:* "We agree Alex is wrong (Truth). We disagree if Blair can enforce this (Standing). Today is about why those are different columns."

  ### **Part 2: Driving the Wedge (0:10–0:30)**

  **Goal:** Make the distinction feel unavoidable by focusing on the *reaction*, not the *act*.

  **Step 1: The "Tu Quoque" Trap (10 mins)**
  Students will say: "Blair is just saying 'You did it too!' to get out of trouble."
  *   **Head it off:** "I'm not asking if Alex is *excused*. Alex is definitely guilty. I'm asking about **Blair**. If Alex says, 'You have no right to blame me,' is Alex making a mistake?"
  *   **The Analogy:** Use the **Corrupt Referee**.
      *   *Script:* "Imagine a ref who takes bribes. They call a foul on a player. The foul *happened*. The call is *accurate*. But does the ref have the **authority** to make that call?"
      *   *Point:* Accuracy $\neq$ Authority.
  *   **Literature Flag (For You):** This is **Settled**. Almost everyone in the debate (Friedland, Bell, Fritz & Miller) agrees that standing is distinct from the truth of the proposition. It is a normative status, not an epistemic one.

  **Step 2: The Nature of the Complaint (10 mins)**
  Ask the class: "If you were Alex, why would you be annoyed at Blair specifically?"
  *   *Target Answer:* "It's unfair." "It's arrogant."
  *   **The Crucial Distinction:** Push them to see that the annoyance isn't about the *rule* (they know they broke it); it's about the *relationship*.
  *   *Script:* "If a stranger told you this, you'd feel guilty. If Blair tells you, you feel **resentment**. Why the difference?"
  *   *Concept:* Standing is about the **normative relationship** between blamer and blamee. When Blair blames Alex, Blair implies, "I uphold this norm, and you have fallen below *my* standard." If Blair doesn't uphold it, that implication is false/insulting.
  *   **Literature Flag (For You):** This touches on the **Commitment Account** (Bell) vs. the **Equality Account** (Fritz & Miller).
      *   *Commitment:* Blair lacks standing because they aren't truly committed to the norm.
      *   *Equality:* Blair lacks standing because they claim a moral superiority they don't possess.
      *   *Consensus:* Both agree hypocrisy defeats standing. They disagree on *why*. Present this as "Philosophers disagree on the engine, but agree the car won't start."

  ### **Part 3: Managing Misconceptions (0:30–0:40)**

  **Goal:** Preempt the three specific confusions you mentioned.

  **Misconception 1: "Lacking Standing = Being Wrong"**
  *   *Student:* "So if Blair has no standing, Alex didn't do anything wrong?"
  *   *Correction:* "No. Alex still owes an apology. Just not to *Blair*. Maybe to the other roommates, or to the universe. The *debt* exists; Blair just isn't the right *collector*."
  *   *Analogy:* "If I'm not your bank, I can't demand your mortgage payment, even if you owe money."

  **Misconception 2: "Lacking Standing = Being a Bad Person"**
  *   *Student:* "Blair is just a hypocrite, they're terrible."
  *   *Correction:* "Standing is local, not global. Blair might be a saint otherwise. But regarding *this norm*, right now, they lack standing. You can have standing to blame someone for stealing even if you are a tax evader. Standing is norm-specific."
  *   **Literature Flag (For You):** This is **Settled**. Standing is typically viewed as localized to the specific norm violated, not a general moral status.

  **Misconception 3: "Lacking Standing = Ineffective"**
  *   *Student:* "Maybe Blair just won't be *listened to*."
  *   *Correction:* "This is the biggest trap. Standing isn't psychological (will Alex listen?); it's normative (is Blair *entitled* to demand?). Even if Alex listens and feels guilty, Blair might still lack the *right* to induce that guilt."
  *   *Test:* "If Alex apologizes to Blair, should Blair accept it? Or should Blair say, 'Don't apologize to me, I'm in no position to accept this'?"

  ### **Part 4: The Contested Terrain (0:40–0:45)**

  **Goal:** Show them where the philosophy actually lives, so they don't think it's all settled dogma.

  **Script:** "We've agreed hypocrisy undermines standing. But how much hypocrisy? And can you get it back?"
  1.  **Proportionality:** If Blair played music at 11:05 PM, can they blame Alex for playing it at 2 AM? (Some say yes, some say no).
  2.  **Repentance:** If Blair apologizes for last Tuesday *before* blaming Alex today, do they regain standing?
      *   *Consensus View:* Many think yes (the "Reformed Hypocrite").
      *   *Contested View:* Some argue the historical fact of the violation permanently severs the equality required for standing.
  3.  **Why it matters:** Tell them: "If you write about this, don't just say 'Hypocrisy kills standing.' Ask: 'Which kind?'"

  ### **Part 5: The Exit Ticket (0:45–0:50)**

  **Goal:** A check for understanding that prevents nodding along.

  **The Question:**
  > "Imagine a reformed smoker who smoked for 20 years but quit 10 years ago. They tell a teenager, 'You shouldn't start smoking.'
  >
  > **Does this person have standing to blame the teenager?**
  >
  > Don't tell me yes or no. Tell me **which feature of the case** determines your answer."

  **What to look for in their answers:**
  *   **Bad Answer:** "Yes, because smoking is bad." (Confuses truth with standing).
  *   **Bad Answer:** "No, because they smoked before." (Misses the 'reformed' nuance).
  *   **Good Answer:** "It depends on whether standing requires *current* commitment or *perfect* history." OR "Yes, because they aren't claiming superiority, just warning based on experience."
  *   **Why this works:** It forces them to apply the *criteria* for standing (Commitment vs. Equality vs. History) rather than just the intuition about hypocrisy.

  ---

  ### **Summary of Literature Status (For Your Safety)**

  | Claim | Status in Literature | Notes for TA |
  | :--- | :--- | :--- |
  | **Hypocrisy can undermine standing.** | **Settled/Consensus** | Safe to teach as the baseline view. |
  | **Standing is distinct from Truth.** | **Settled/Consensus** | Crucial distinction. Don't let them blur it. |
  | **Standing is distinct from General Moral Worth.** | **Settled/Consensus** | Standing is norm-specific. |
  | **The "Equality Account" (Unfairness) is the *only* explanation.** | **Contested** | Competes with Commitment (Bell) and Authority accounts. |
  | **All hypocrisy defeats standing (no proportionality).** | **Contested** | Many argue minor hypocrisy doesn't defeat standing for major violations. |
  | **Reformed hypocrites regain standing.** | **Contested** | Plausible, but not universally accepted. |

  ### **TA Survival Tip**
  If a student pushes back hard ("I think the hypocrite *does* have standing!"), don't fight them. Pivot to: "Okay, so you think standing is robust against hypocrisy. What *would* make someone lose standing then? If not hypocrisy, what?" This keeps the discussion on the *concept* of standing without forcing them to accept a specific conclusion.
