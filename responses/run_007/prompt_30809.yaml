      *   3. *Inaudible violin:* Blind test identical, value gap remains. Gut: Strad worth more.
      *   4. *Sol LeWitt:* Instructions matter, physical execution replaceable. Gut: Originals don't matter.
      *   5. *Posthumous cast:* Identical mold, lifetime vs. after death. Gut: Lifetime worth more.
      *   6. *High-res scan:* Digital vs. Physical copy (Case 1). Gut: Scan is fine, Physical copy feels like a fake. (Inconsistency noted by user).
      *   7. *Reattributed portrait:* Rembrandt -> Pupil. Surface unchanged. Gut: Less valuable all along.
      *   8. *Better fake:* Better than the master, but fake. Gut: Less valuable when exposed.
      *   9. *Forged diary:* Text same, suffering real. Gut: Worse when exposed.

  3.  **Search for a Unifying Principle:**
      *   *Hypothesis 1: Physicalism.* (Value is in the atoms). Fails Cases 1, 2, 3, 5, 7, 8, 9. Works for 6 maybe.
      *   *Hypothesis 2: Intentionality/Provenance.* (Value is in the history of creation). Works for 1, 2, 3, 5, 7, 8, 9. Fails 4 (LeWitt) and maybe 6 (Scan).
      *   *Hypothesis 3: Narrative/Connection.* (Value is the human connection to the creator/moment).
      *   *Hypothesis 4: Dual-Aspect Theory.* (Artworks have a physical vehicle and an ontological status).

      *   *The Strongest Candidate:* **The Principle of Generative History (or Causal History).**
          *   An artwork's identity and value are not exhausted by its current physical state but include the *process of its coming into being*.
          *   Specifically: **The value lies in the specific causal chain linking the object to the creative agency of the artist.**
          *   This explains why the Van Meegeren drops (wrong chain), the Violin drops (wrong maker), the Diary drops (wrong witness), the Cast drops (artist not supervising).
          *   It explains LeWitt (Case 4) because the *concept* is the art, and the causal chain is "Artist Concept -> Certified Execution." The physical wall is just the display terminal.
