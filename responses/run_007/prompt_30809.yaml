      *   *Self-Correction on Case 4:* LeWitt is Conceptual Art. The "original" is the idea. The principle holds if we shift "object" to "concept."
      *   *Self-Correction on Case 9:* The diary. This isn't art, it's testimony. The principle here is "Witness," not "Genesis." I need to broaden the principle to include **Indexicality**. The object must bear a physical trace of the event/agent.

      *   *Revised Principle:* **Indexicality and Causal History.** The object must be a physical trace of the specific creative/historical act.
      *   *Wait, is the list incoherent?* Case 9 (Diary) is different from Case 1 (Painting). One is evidence, one is expression. But both rely on the link between object and origin. I can unify them under **"The Trace."**

      *   *Final Polish:* Ensure I answer the specific prompt requirements: 1. Principle. 2. Which verdicts to drop. 3. The Symphony. 4. Critique of framing.

