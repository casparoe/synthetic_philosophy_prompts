prompt: |-
  You are an expert on philosophical pedagogy who also knows the ins and outs of two-dimensional semantics — Chalmers, Jackson, Stalnaker, the whole debate. Think carefully about the dependency structure of the ideas before you lay out the plan.

  I'm a PhD student TAing an upper-level undergrad philosophy of language course. Next week I have to teach two-dimensional semantics in one 75-minute session. The students have already done Kripke — they've read Naming and Necessity, they can parrot back the necessary a posteriori and rigid designation, and they've done some basic possible-worlds semantics (they know what an intension is, at least formally: a function from worlds to extensions). But 2D always goes badly in this course. The evals from previous years show students walking away thinking it's just "there are two kinds of possible worlds" or "primary intension is what's in your head and secondary intension is what's in the world."

  I don't need you to explain 2D semantics to me. I know the machinery. I need a teaching plan: the sequence of ideas, the one example that carries the whole session, and — crucially — the misconceptions theyll form and exactly where in the timeline I should head each one off.

  Specific constraints:
  - I have to make the "considered as actual" vs "considered as counterfactual" distinction land. This is the thing that always fails. They nod along when I say it but then five minutes later theyre treating primary intension as just "what I think the word means" and secondary as "what it really means."
  - They'll confuse primary intension with epistemic possibility and secondary with metaphysical possibility. I need to forestall this explicitly.
  - I need them to see why we need the whole apparatus, not just "rigid designation plus some epistemology." The motivation has to be clear before I start drawing matrices or I'll lose them.
  - I'm not sure whether to use "water" or "Hesperus" as the running example. Tell me which one and why, and also tell me what the example needs to have and what it must not have (so I understand the choice).
  - They tend to get lost when the "actually" operator shows up, so I need to place that carefully in the sequence.
  - I have a whiteboard and I'll draw the 2×2 matrix, but I need to know when to draw it — too early and its meaningless, too late and its just a summary they copy down.

  Plan the arc: what do I put on the board at minute 1, what's the pivot point around minute 30, what do I do at minute 60 to consolidate. And give me the one question I can ask in the last five minutes that would show me whether someone actually understands the two-dimensional framework or is just mapping it onto the Kripkean machinery they already know.

  Also: which parts of 2D semantics should I openly refuse to get into at this level? I'm thinking the debate between epistemic and contextual 2D, and the whole question of whether 2D gives you a semantics for attitude ascriptions. But maybe there's something else I should explicitly set aside.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Role:** Expert on philosophical pedagogy and two-dimensional (2D) semantics (Chalmers, Jackson, Stalnaker, etc.).
      *   **Task:** Create a 75-minute teaching plan for an upper-level undergrad philosophy of language course.
      *   **Student Background:** Know Kripke (*Naming and Necessity*), necessary a posteriori, rigid designation, basic possible worlds semantics (intensions as functions from worlds to extensions).
      *   **Known Problems:** Students think 2D = "two kinds of worlds," confuse primary/secondary with "in head"/"in world," confuse primary/secondary with epistemic/metaphysical possibility, get lost with the "actually" operator, disengage when matrices appear too early/late.
      *   **Specific Constraints:**
          *   Must land "considered as actual" vs. "considered as counterfactual."
          *   Must forestall epistemic vs. metaphysical confusion.
          *   Must motivate *why* we need 2D (not just Kripke + epistemology).
          *   Choose between "Water" and "Hesperus" (and justify).
          *   Place the "actually" operator carefully.
          *   Timing: Minute 1, Minute 30 (pivot), Minute 60 (consolidate), Last 5 mins (assessment question).
          *   Scope: What to exclude (e.g., epistemic vs. contextual, attitude ascriptions).

  2.  **Deconstruct the Core Philosophical Problem:**
      *   Kripke showed that identity statements involving rigid designators (like "Water = H2O") are necessary if true.
      *   But they are a posteriori. We can *imagine* water not being H2O.
      *   Kripke's explanation: We are imagining a *qualitatively identical* substance that isn't H2O, not water itself.
      *   2D Semantics aims to formalize this intuition. It distinguishes two ways of evaluating a statement across possible worlds.
      *   *Crucial Distinction:* It's not two kinds of worlds. It's two ways of *using* the same set of worlds.
      *   *Primary Intension:* Fix the reference in a world $w$ treated *as actual*. (What does 'water' pick out in $w$ if $w$ is the actual world?)
      *   *Secondary Intension:* Fix the reference in the *actual* world, then see what it picks out in $w$ treated *as counterfactual*. (Given water is H2O here, what is it in $w$?)

  3.  **Select the Running Example:**
      *   *Option A: Hesperus/Phosphorus.* Good for identity, but often gets bogged down in "names vs. descriptions." Students might think the difference is just about modes of presentation associated with names.
      *   *Option B: Water/H2O.* The classic Putnam/Kripke case. Better for natural kind terms.
      *   *Decision:* **Water.**
      *   *Why:* It separates the *concept* (clear, drinkable liquid) from the *microstructure* (H2O) more vividly than names. It allows for the "Twin Earth" intuition pump which is essential for 2D.
      *   *Requirements:* The example must allow for a scenario where the *reference-fixing description* comes apart from the *essential property*. It must not rely on ambiguity of the term (it's not polysemous).

  4.  **Structure the 75 Minutes:**

      *   **0-10 mins: Motivation & The Kripkean Tension.**
          *   Review: "Water = H2O" is necessary a posteriori.
          *   Problem: It *seems* contingent. We can conceive of XYZ.
          *   Kripke's solution: Illusion of contingency.
          *   2D's goal: Capture *why* it seems contingent without denying Kripke.
      *   **10-25 mins: The Two Ways of Evaluating (The "Considered As" Distinction).**
          *   Introduce the distinction *before* the matrix.
          *   Use the "Actual" operator implicitly first.
          *   Scenario 1: World $w$ is actual. What is 'water'? (Primary).
          *   Scenario 2: Actual world is fixed (H2O). World $w$ is counterfactual. What is 'water' there? (Secondary).
      *   **25-40 mins: The Matrix & Formalizing.**
          *   Draw the 2x2.
          *   Rows = Worlds considered as actual.
          *   Columns = Worlds considered as counterfactual.
          *   Diagonal = Primary Intension.
          *   Fixed Row (Actual) = Secondary Intension.
          *   *Pivot Point (Min 30):* Moving from intuition to the grid.
      *   **40-55 mins: The "Actually" Operator & Misconception Check.**
          *   Introduce $@$.
          *   Show how "Water is actually H2O" changes the truth conditions.
          *   Address Epistemic vs. Metaphysical confusion here.
      *   **55-65 mins: Why do we need this? (The Payoff).**
          *   It's not just psychology. It explains the cognitive significance of necessary truths.
          *   It reconciles internalism and externalism (Jackson/Chalmers angle).
      *   **65-75 mins: Consolidation & Assessment.**
          *   Review.
          *   The Killer Question.

  5.  **Addressing Specific Misconceptions:**
      *   *Two kinds of worlds:* Emphasize it's the *same* set of worlds, evaluated differently.
      *   *In head vs. In world:* Primary isn't just "what I think." It's the reference-fixing condition. Secondary isn't "reality," it's the rigidified extension.
      *   *Epistemic vs. Metaphysical:* Primary tracks epistemic possibility (conceivability), Secondary tracks metaphysical possibility. But don't equate them simply. Primary intension *captures* the epistemic dimension of meaning.
      *   *The "Actually" Operator:* Place this *after* the matrix is understood. It rigidifies the primary intension.

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Minute 1:* Don't start with definitions. Start with the puzzle. "Water is H2O" is necessary. But I can imagine it isn't. How?
      *   *Minute 30:* This needs to be the transition from verbal description to the visual matrix. If I draw it too early, it's abstract. If too late, it's a recap. Min 30 is perfect for "Let's map this."
      *   *Minute 60:* Consolidation. Connect back to the motivation. Why did we build this machine? To save the phenomenon of cognitive significance without killing rigid designation.
      *   *The Killer Question:* Needs to force them to use both dimensions. "Is 'Water is actually H2O' necessary?" (Yes, 2D necessary). "Is 'Water is H2O' 2D necessary?" (No, only 1D necessary). Wait, better: Ask about a statement that is true on the diagonal but false on the row, or vice versa.
      *   *Refining the Killer Question:* Ask them to evaluate "Water is not H2O" in a specific cell of the matrix. Or better: "If Twin Earth is actual, is 'Water is H2O' true?" (No). "If Twin Earth is counterfactual (and Earth is actual), is 'Water is H2O' true?" (Yes).
      *   *Best Killer Question:* "Consider the sentence 'Water is actually H2O.' Is this statement true or false at a world where the clear liquid is XYZ, *considered as actual*?" This forces them to apply the 'actually' operator within the primary intension evaluation.

  7.  **Scope Control:**
      *   Exclude: Contextual vs. Epistemic 2D (Stalnaker vs. Chalmers). Too technical.
      *   Exclude: Attitude Ascriptions (believes that...). Too complex for 75 mins.
      *   Exclude: Deep metaphysics of worlds (modal realism vs. ersatz). Irrelevant.
      *   Exclude: The "Strong" vs. "Weak" necessity distinction unless it comes up naturally (better to avoid to save time).

  8.  **Refining the "Water" vs. "Hesperus" choice:**
      *   Water is better because "Hesperus" often leads students to think about *names* having descriptions. Water makes it about *natural kinds* and *reference fixing*, which aligns better with the "considered as actual" logic (i.e., whatever plays the 'water role' in that world).
      *   Constraint: Must ensure students don't think 'water' *means* 'clear liquid'. It's about reference fixing.

  9.  **Final Review against Constraints:**
      *   *Considered as actual/counterfactual:* Central to the 10-25 min block.
      *   *Epistemic/Metaphysical confusion:* Addressed explicitly at min 45.
      *   *Motivation:* Min 0-10.
      *   *Example:* Water.
      *   *Actually operator:* Min 40-55.
      *   *Matrix timing:* Min 30.
      *   *Scope:* Defined exclusions.

  10. **Writing the Response:** (Adopting the persona: authoritative, pedagogical, precise). *Self-Correction during drafting:* Make sure I emphasize that the Primary Intension is *not* a description in the Fregean sense that gives meaning, but a reference-fixing condition. This is a common Chalmers/Jackson nuance. Also, ensure the "Actually" operator explanation is crisp—it shifts the evaluation world back to the base world.

      *Wait, one nuance on the "Actually" operator:*
      Standard 1D: $\llbracket \text{Actually } \phi \rrbracket^w = \llbracket \phi \rrbracket^{w_{@}}$.
      2D: $\llbracket \text{Actually } \phi \rrbracket^{w, v} = \llbracket \phi \rrbracket^{w, w}$. (Where $v$ is counterfactual, $w$ is actual).
      I need to make sure I don't get bogged down in the formal semantics of the operator, but rather its intuitive effect: it locks the reference to the world being treated as actual.

      *Revised Killer Question:* "Evaluate 'Water is H2O' at the Twin Earth world, *considered as actual*." (False). "Evaluate 'Water is H2O' at the Twin Earth world, *considered as counterfactual* (given Earth is actual)." (True).
      *Better:* "Is the statement 'Water is actually H2O' true at the Twin Earth world considered as actual?"
      If Twin Earth is actual, 'water' refers to XYZ. 'Actually H2O' refers to H2O in the actual world (Twin Earth). So 'Water' (XYZ) is H2O (H2O). False.
      Wait, 'Actually' rigidifies to the *context of utterance* or the *world considered as actual*? In 2D semantics (Chalmers style), 'Actually' usually picks out the world considered as actual (the diagonal).
      Let's stick to the Chalmers/Jackson epistemic 2D framework since that's the standard intro.
      Okay, I will formulate the question carefully in the plan.

      *Let's finalize the exclusions:* Definitely cut the Stalnaker/Chalmers debate. Cut the connection to Fregean senses (unless noting the similarity). Cut the "A-intension vs. C-intension" terminology if it confuses, stick to Primary/Secondary.

      *Let's finalize the Matrix:*
      Rows: World considered as actual.
      Cols: World considered as counterfactual.
      Diagonal: Primary Intension.
      Row 1 (Actual World): Secondary Intension.

      *Let's finalize the "Actually" placement:* It explains why "Water is actually H2O" is necessary in a way "Water is H2O" isn't (in the 2D sense). It rigidifies the primary intension.

      *Okay, ready to write.*
answer: |-
  Here is a teaching plan designed to navigate the specific conceptual pitfalls of two-dimensional (2D) semantics.

  ### The Running Example: "Water"
  **Use "Water," not "Hesperus."**

  **Why:**
  1.  **Descriptive vs. Rigid:** With "Hesperus," students often retreat to the idea that names are just disguised descriptions. "Water" forces the issue of natural kinds. It separates the *phenomenal concept* (clear, drinkable liquid) from the *essential property* (H2O) more vividly.
  2.  **Twin Earth Intuition:** The Twin Earth thought experiment is the engine of 2D semantics. It requires a substance that *looks* like water but *isn't* water. Hesperus/Phosphorus doesn't offer a clean "twin" scenario without getting bogged down in astronomical observation errors.
  3.  **Constraint:** You must explicitly state that 'water' is **not synonymous** with "clear, drinkable liquid." If you let them think the primary intension *is* the meaning, they will revert to Frege. The primary intension is a *reference-fixing condition*, not a synonym.

  ---

  ### The 75-Minute Arc

  #### Phase 1: Motivation & The Kripkean Tension (Minutes 0–15)
  **Goal:** Establish why rigid designation leaves a explanatory gap regarding *cognitive significance*.

  *   **Minute 1 (The Board):** Write: **"Water = H2O."**
      *   Ask: "Is this necessary?" (Yes, per Kripke).
      *   Ask: "Is this a priori?" (No, we needed chemistry).
      *   Ask: "Can I coherently imagine a world where water is not H2O?" (Yes, Twin Earth/XYZ).
  *   **The Tension:** Kripke says when you imagine XYZ, you aren't imagining *water* that isn't H2O; you're imagining a *different substance* that looks like water.
  *   **The Pedagogical Hook:** "Kripke is right about metaphysics. But he leaves out the *epistemology*. It *feels* contingent to us. 2D semantics isn't here to refute Kripke; it's here to formalize *why* it feels contingent without denying that it's metaphysically necessary."
  *   **Misconception Check:** If a student says, "So water could have been XYZ," correct them immediately: "Metaphysically, no. Epistemically/conceptually, yes. 2D tracks that difference."

  #### Phase 2: The "Considered As" Distinction (Minutes 15–30)
  **Goal:** Explain the two modes of evaluation *before* drawing the matrix.

  *   **The Setup:** Draw two worlds on the board: **Earth** (H2O) and **Twin Earth** (XYZ).
  *   **Mode 1 (Secondary Intension):** "Fix the actual world as Earth. 'Water' refers to H2O. Now, go to Twin Earth *as a counterfactual situation*. Does H2O exist there?"
      *   *Result:* No (or only in a lab). So "Water is H2O" is True.
      *   *Label:* **Counterfactual Evaluation.** (Fix reference here, vary the world).
  *   **Mode 2 (Primary Intension):** "Now, pretend Twin Earth is *actual*. We are inhabitants of Twin Earth. We point to the lakes and say 'water'. What are we referring to?"
      *   *Result:* XYZ.
      *   *Question:* "In this scenario (Twin as Actual), is 'Water is H2O' true?"
      *   *Result:* No. 'Water' picks out XYZ. XYZ $\neq$ H2O.
      *   *Label:* **Actual Evaluation.** (Vary the world of reference fixing).
  *   **Crucial Phrase:** Drill this sentence: **"It is not two kinds of worlds. It is two ways of using the same world."**
      *   Write this on the board. Underline it.

  #### Phase 3: The Matrix (Minutes 30–45) — *The Pivot Point*
  **Goal:** Formalize the intuition. If you draw this earlier, it's abstract algebra. Now, it's a map of what they just discussed.

  *   **Draw the 2x2 Matrix:**
      *   **Rows:** World considered *as actual* ($w$).
      *   **Columns:** World considered *as counterfactual* ($v$).
      *   **Cells:** Truth value of "Water is H2O" at $\langle w, v \rangle$.
  *   **Fill it in together:**
      *   *Row 1 (Earth as Actual):* Col 1 (Earth as Counter) = T. Col 2 (Twin as Counter) = T (because 'water' rigidly designates H2O).
      *   *Row 2 (Twin as Actual):* Col 1 (Earth as Counter) = F (because 'water' rigidly designates XYZ). Col 2 (Twin as Counter) = F.
  *   **Identify the Intensions:**
      *   **Secondary Intension:** The row where the Actual World is fixed (Row 1). It's constant (T, T). This captures Kripkean necessity.
      *   **Primary Intension:** The **Diagonal**. (Earth/Earth = T; Twin/Twin = F). This captures the epistemic contingency.
  *   **Misconception Head-Off:** Students will think the Primary Intension is "what's in my head."
      *   *Correction:* "The diagonal isn't psychology. It's the function from *worlds considered as actual* to extensions. It's objective reference-fixing, not subjective belief."

  #### Phase 4: The "Actually" Operator & Modal Confusion (Minutes 45–60)
  **Goal:** Introduce the operator that bridges the gap and forestall the Epistemic/Metaphysical conflation.

  *   **The Problem:** "Water is H2O" is 1D-necessary (Secondary intension is constant). But it's not 2D-necessary (Diagonal varies).
  *   **The Solution:** Introduce **Actually**.
      *   Sentence: "Water is **actually** H2O."
      *   Semantics: 'Actually' forces the evaluation back to the world considered *as actual* (the diagonal).
      *   Effect: It makes the Primary Intension rigid.
  *   **The Confusion (Epistemic vs. Metaphysical):**
      *   Students will say: "Primary = Epistemic Possibility, Secondary = Metaphysical Possibility."
      *   **Intervention:** "Stop. Primary intension *tracks* epistemic possibility (conceivability), but it is a *semantic value*. Secondary intension tracks metaphysical possibility. But do not say 'Primary is epistemic.' Say 'Primary intension explains why the statement has epistemic contingency.'"
      *   *Why:* Epistemic possibility is about what we can know. Primary intension is about how reference is fixed. They correlate, but they aren't identical.
  *   **Minute 60 Consolidation:** Erase the board. Draw a single line: **Diagonal = Conceivability. Row = Metaphysical Necessity.** Ask them to copy this distinction.

  #### Phase 5: Why We Need This & Assessment (Minutes 60–75)
  **Goal:** Justify the machinery and test understanding.

  *   **The Payoff:** Why not just say "Kripke + Epistemology"?
      *   Because 2D explains how we can learn necessary truths. We learn the Secondary Intension by discovering the Primary Intension's value at the actual world.
      *   It reconciles Internalism (access to primary intension) with Externalism (secondary intension depends on environment).
  *   **The Exclusions (Explicitly tell students this):**
      1.  **Contextual vs. Epistemic 2D:** "We are doing the Chalmers/Jackson epistemic version. Stalnaker has a different contextual version. We are ignoring that debate."
      2.  **Attitude Ascriptions:** "We are not solving 'Lois believes Superman can fly' today. That requires 3D semantics or more complexity."
      3.  **The Metaphysics of Worlds:** "We don't care if worlds are concrete or abstract. They are indices for evaluation."
  *   **The Killer Question (Last 5 Minutes):**
      *   Do not ask: "What is the primary intension?" (They can parrot this).
      *   **Ask this:** "Consider the sentence: **'Water is actually H2O.'** Evaluate this sentence at the **Twin Earth world, considered as actual.** Is it True or False? Explain why."
      *   **Correct Answer:** **False.**
      *   **Reasoning:** If Twin Earth is *actual*, 'water' refers to XYZ. 'Actually H2O' refers to H2O *in the world considered as actual* (Twin Earth). Since Twin Earth contains XYZ, not H2O, the statement claims XYZ = H2O. That is false.
      *   **Why this works:** If they treat 'actually' as rigidifying to *our* world (Earth), they'll say True. If they treat 'water' as having a fixed secondary intension regardless of the 'as actual' status, they'll say True. To get False, they must understand that 'actually' shifts the reference fix to the diagonal world, and 'water' shifts its extension to the diagonal world, and those two don't match on Twin Earth.

  ---

  ### Anticipating & Heading Off Misconceptions

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"Two kinds of worlds"** | Min 15 (Intro) | Explicitly state: "Same set of worlds. Different *parameters of evaluation*." Write **1 Set, 2 Uses** on the board. |
  | **"Primary = In Head / Secondary = In World"** | Min 30 (Matrix) | When defining Primary, say: "This is not psychology. If you are a brain in a vat, your primary intension might pick out nothing. It's about reference conditions, not mental images." |
  | **"Primary = Epistemic / Secondary = Metaphysical"** | Min 45 (Modalities) | Use precise phrasing: "Primary intension *models* epistemic contingency. It is not identical to epistemic possibility." |
  | **"Actually means *our* world"** | Min 50 (Operator) | Clarify: "In 2D semantics, 'actually' means 'the world currently being treated as actual' (the row index), not necessarily *this* classroom's world." |
  | **"Water means 'clear liquid'"** | Throughout | Repeat: "Primary intension is a reference-fixing description, not a synonym. 'Water' rigidly designates whatever satisfies the description in the actual world." |

  ### Board Plan Summary

  *   **Left Third:** The Kripkean Puzzle (Necessary A Posteriori vs. Conceivability).
  *   **Middle Third:** The 2x2 Matrix (Rows = As Actual, Cols = As Counterfactual). Diagonal highlighted.
  *   **Right Third:** Key Distinctions (Primary vs. Secondary, Actually Operator, The Killer Question).

  ### Final Advice for the TA
  You will lose them when you switch from talking about "Earth" to talking about "$w_1$." Keep the labels "Earth" and "Twin" in the matrix as long as possible. Only switch to $w/v$ notation when you must. When you introduce the "Actually" operator, use your hands: point to the row header ("This is Actual") and then point to the cell ("This is Counterfactual"). 'Actually' drags your finger back to the row header.

  If you stick to the **Water** example, respect the **Minute 30 Pivot** for the matrix, and ask the **Killer Question** about "Water is actually H2O" on Twin Earth, you will separate the students who grasp the framework from those who are just memorizing Kripkean slogans.
