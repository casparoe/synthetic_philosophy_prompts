  The Halfer is right that she knew an awakening would occur, but wrong about *which* proposition she conditionalizes on. On Sunday, she knows "There will be an awakening," but she cannot know "I am awake now," because "now" picks out Sunday. The new evidence is the indexical truth: "This current experience is an awakening." This is relevant because the coin toss determines the density of awakening moments available to be experienced. If Heads, there is one such moment (Monday); if Tails, there are two (Monday and Tuesday). When she wakes, she rules out the centered possibilities where she is not awake (like Tuesday given Heads), and since the Tails world contains twice as many awake-centers as the Heads world, finding herself in one favors Tails. The Halfer ignores the self-locating nature of the evidence, treating all awakenings as a single event rather than distinct opportunities for observation.
