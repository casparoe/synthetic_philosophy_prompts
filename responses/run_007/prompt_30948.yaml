  Based on the three verdicts provided, your colleague is almost certainly operating under **Updateless Decision Theory (UDT)** or its philosophical counterpart, **Functional Decision Theory (FDT)**. These theories are specifically designed to yield the "One-box," "Stay," and "Pay" verdicts in these respective cases by treating the agent's decision as the output of a fixed algorithm that is logically correlated with the predictor's simulation.

  However, to give you the analytical spread you need for the seminar, here are the candidate rules, their predictions on Counterfactual Mugging, and a further test case.

  ### 1. Candidate Decision Rules

  **Candidate A: Updateless/Functional Decision Theory (UDT/FDT)**
  *   **Mechanism:** The agent chooses the *policy* (input-output mapping of their decision function) that maximizes expected utility from a prior perspective ("ex-ante"), ignoring indexical information (like knowing the coin landed Tails) that would screen off logical correlations.
  *   **Fit to Data:**
      *   *Newcomb:* One-boxes (Policy "One-box" fills the box).
      *   *Death in Damascus:* Stays (Policy "Flee" predicts Death in Aleppo; Policy "Stay" predicts Death in Damascus. Paying €1,000 is strictly dominated).
      *   *XOR Blackmail:* Pays (Policy "Pay" makes the termite disjunct false; Policy "Don't Pay" makes it true).
  *   **Prediction on Counterfactual Mugging:** **Pays the $100.**
      *   *Reasoning:* From the ex-ante perspective, the policy "Pay on Tails" yields an expected value of $0.5 \times (-\$100) + 0.5 \times (\$10,000) = \$4,950$. The policy "Don't Pay" yields $0. She optimizes the algorithm, not the specific branch outcome.

  **Candidate B: Evidential Decision Theory (EDT) with "Logical Evidentialism"**
  *   **Mechanism:** The agent maximizes expected utility conditional on their action, treating logical constraints (like XOR) as strong evidence.
  *   **Fit to Data:**
      *   *Newcomb:* One-boxes (One-boxing is strong evidence the box is full).
      *   *Death in Damascus:* Stays (Sophisticated EDT recognizes fleeing is futile evidence; paying is a sunk cost).
      *   *XOR Blackmail:* Pays (Conditional on Paying, the logical constraint implies Termites are false).
  *   **Prediction on Counterfactual Mugging:** **Does Not Pay.**
      *   *Reasoning:* EDT updates on observations. Once she knows the coin is Tails, the Heads world is counterfactual and screened off. $E[U | Pay, Tails] = -\$100$. $E[U | \neg Pay, Tails] = \$0$. Paying is bad news for her wallet with no upside.

  **Candidate C: Timeless Decision Theory (TDT)**
  *   **Mechanism:** Similar to FDT but often formulated with causal graphs augmented by logical nodes. It treats the predictor's simulation as a "logical twin."
  *   **Fit to Data:** Matches UDT/FDT on all three cases.
  *   **Prediction on Counterfactual Mugging:** **Ambiguous / Likely Does Not Pay.**
      *   *Reasoning:* Standard TDT updates on the coin flip observation. Unless explicitly built with a precommitment mechanism, TDT treats the Heads payoff as causally inaccessible once Tails is observed. (Note: Some interpretations of TDT argue it *should* pay, making it indistinguishable from UDT on this case).

  ### 2. Prediction

  **She Pays the $100.**

  The XOR Blackmail verdict is the strongest signal. Standard EDT and CDT typically fail XOR Blackmail (EDT because it treats the termite fact as fixed evidence once the letter arrives; CDT because it sees no causal leverage). Accepting the XOR payment indicates she treats logical subjunctive dependence as action-guiding. This commitment logically extends to Counterfactual Mugging under UDT/FDT.

  ### 3. Further Test Case (To Separate Remaining Candidates)

  If she **Pays** the Counterfactual Mugging, she rules out standard EDT and CDT. However, this leaves **UDT/FDT** and **Precommitment-TDT** (or a "Logical-TDT" variant) as live candidates, as both might pay. To separate **UDT/FDT** from **TDT**, use:

  **The Logical Mugging (Mathematical Mugging)**
  *   **Scenario:** Omega does not flip a coin. Instead, Omega looks at the 10,000th digit of $\pi$. If it is even (which it is, but she doesn't know that yet), Omega asks for $100. If it were odd, Omega would have given her $10,000 iff Omega predicted she would pay on Even.
  *   **UDT/FDT Verdict:** **Pays.** (Logical uncertainty is treated identically to empirical uncertainty; the decision algorithm determines the outcome across logical possibilities).
  *   **TDT Verdict:** **Does Not Pay.** (Standard TDT relies on causal graphs. Mathematical facts are not causal nodes; they are fixed background truths. TDT struggles to see how her decision "influences" a mathematical fact, even via prediction).
  *   **Why it separates:** This tests whether her "updatelessness" applies to *logical* uncertainty or only *empirical* uncertainty.

  ### 4. Necessary Precisification of "Reliable Predictor"

  For these predictions to hold, "reliable predictor" must be precisified as **Subjunctively Dependent** rather than merely **Correlated**.

  *   **Correlation (Weak):** The predictor guesses based on demographics or past behavior. (EDT might pay XOR, but UDT requires more).
  *   **Subjunctive Dependence (Strong):** The predictor's output is determined by *simulating the agent's decision function*. The prediction is correct *because* the agent's algorithm outputs a specific value, not just because the two events happen to coincide.
  *   **Why it matters:** In Counterfactual Mugging, if Omega is merely a psychologist correlating with her tendencies, paying is irrational (the money is already gone). If Omega is simulating her *source code*, her current decision *is* what determines the counterfactual payoff. Your colleague's XOR verdict implies she accepts the **Subjunctive/Logical** precisification.
