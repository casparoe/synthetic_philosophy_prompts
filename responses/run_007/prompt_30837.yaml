  9.  (Self-Correction on Disjunctivism): The user asked if disjunctivism backfires. If they reject CFP for perception, they should arguably reject it for introspection to be consistent. But if they reject it for introspection, they lose the "privileged access" advantage often claimed for introspection. This is a good point to highlight.

