prompt: |-
  So I just spent like three hours at a bar arguing with a friend who's a law lecturer about whether a manager at her university actually fired someone or not. The guy said "I think we're done here, clear out your desk" during a heated meeting, but then the provost says no, the firing wasn't official because it wasn't in writing and the manager didn't have sign-off. My friend was like "speech act theory says he fired him, the words did the thing" and I was like "but the felicity conditions weren't met" and we went in circles. I realized I dont actually have a systematic way to think about this even though I deal with it all the time.

  I work in HR operations for a decent-sized nonprofit and I'm the person who writes the scripts and templates for managers doing terminations, disciplinary meetings, promotions, performance reviews — all the conversations where the words are supposed to actually DO something, not just describe something. And Ive been winging it. What I want is a proper procedure I can use to audit our scripts: a checklist or decision tree that tells me, for any piece of scripted language, whether it's performative or constative, whether it actually performs the act it's supposed to, and what conditions would cause it to fail.

  Specifically I need it to cover: (a) is this utterance even trying to be performative, (b) what felicity conditions does it need — authority, sincerity, correct procedure, uptake, all of that, (c) which conditions are binary pass/fail and which are matters of degree, and (d) where the procedure has to throw up its hands and say "this is a judgment call, ask a lawyer or a more senior HR person."

  Then I want you to run it on three of our actual scripts. One: a termination meeting opener — "I'm terminating your employment effective immediately." Two: a verbal warning — "This is a formal verbal warning and will be documented in your file." Three: a promotion conversation — "I'm pleased to tell you we're promoting you to senior program manager." For each one, tell me: if all the conditions are met, does the utterance actually perform the act (fire, warn, promote) or is it just reporting a decision that happened somewhere else? And flag the cases where the utterance is performative but some condition is borderline and the procedure can't resolve it — like, the manager has delegated authority to fire but the employee handbook says termination requires VP approval, and the manager said the words before the VP weighed in.

  Be straight with me about where the philosophy gives clear answers and where it doesn't. And if the procedure spits out something I don't want to hear — like "your promotion script isn't actually performative, it's just describing what HR already decided" — dont sugarcoat it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** HR Operations professional at a decent-sized nonprofit. Writes scripts/templates for managers (terminations, discipline, promotions, reviews).
      *   **Context:** Just spent 3 hours arguing with a law lecturer friend about Speech Act Theory (Austin/Searle) applied to a specific firing scenario (oral vs. written, authority issues).
      *   **Problem:** Realizes they've been "winging it" regarding the performative nature of HR language. Needs a systematic way to audit scripts.
      *   **Goal:** A procedure/checklist/decision tree to evaluate HR scripts based on Speech Act Theory (performative vs. constative, felicity conditions, etc.).
      *   **Specific Requirements:**
          *   Cover: (a) Is it performative? (b) Felicity conditions (authority, sincerity, procedure, uptake). (c) Binary vs. Gradient conditions. (d) Escalation points (ask a lawyer).
          *   Apply to three specific scripts: Termination opener, Verbal warning, Promotion conversation.
          *   Determine: Does the utterance *do* the thing or just *report* the thing?
          *   Flag: Borderline cases/ambiguities.
          *   Tone: Straight, no sugarcoating, acknowledge where philosophy helps and where it fails.

  2.  **Deconstruct the Theoretical Framework (Speech Act Theory in HR):**
      *   *Core Concept:* J.L. Austin's *How to Do Things with Words*.
      *   *Performative:* Uttering the words *is* the action (e.g., "I promise," "I pronounce you...").
      *   *Constative:* Uttering the words describes a state of affairs (e.g., "The sky is blue," "You were late").
      *   *Felicity Conditions:* Conditions required for the performative to succeed.
          *   *Preparatory:* Right person, right context, right prerequisites.
          *   *Sincerity:* The speaker intends the act.
          *   *Essential:* The utterance counts as the act within the institution.
          *   *Uptake:* The hearer understands/accepts the act (controversial in legal/HR contexts, but relevant).
      *   *HR Reality Check:* HR is rarely pure Speech Act Theory. It's mixed with Contract Law, Labor Law, and Organizational Policy. A "performative" utterance in philosophy might be legally void if policy isn't followed. The user needs to know where the *words* carry the weight vs. where the *paperwork* carries the weight.

  3.  **Develop the Procedure (The "Performative Audit Protocol"):**
      *   Need a step-by-step flow.
      *   *Step 1: Intent Classification.* Is this meant to *do* something or *say* something?
      *   *Step 2: Authority Check.* Who is speaking? Do they have the power?
      *   *Step 3: Procedural Preconditions.* What must happen *before* the words are spoken?
      *   *Step 4: Formulation.* Are the right words used? (Explicit vs. Implicit performatives).
      *   *Step 5: Uptake/Record.* Does it need acknowledgment?
      *   *Step 6: Risk Assessment.* Binary vs. Gradient conditions. When to call legal.

  4.  **Apply the Procedure to the Three Scripts:**

      *   **Script 1: Termination ("I'm terminating your employment effective immediately.")**
          *   *Type:* Performative (Declarative).
          *   *Conditions:* Authority (high stakes), Procedure (often requires written confirmation), Sincerity (final decision).
          *   *Risk:* High. If the manager lacks final sign-off, the words are void or create a lawsuit risk (wrongful termination).
          *   *Verdict:* Often *not* the actual performative act in modern HR; it's usually the *notification* of a decision made elsewhere (HR/Leadership). The *letter* is often the true performative.
          *   *Flag:* The "Oral vs. Written" debate from the user's bar argument. This is the crux.

      *   **Script 2: Verbal Warning ("This is a formal verbal warning...")**
          *   *Type:* Performative (Verdictive/Exercitive).
          *   *Conditions:* Authority (manager usually has this), Procedure (prior coaching?), Documentation (paradox of "verbal" being documented).
          *   *Risk:* Medium. "Verbal warning" is a misnomer. It's a documented event.
          *   *Verdict:* The words initiate the disciplinary track, but the *filing* solidifies it.
          *   *Flag:* The contradiction of "verbal" + "documented."

      *   **Script 3: Promotion ("I'm pleased to tell you we're promoting you...")**
          *   *Type:* Constative/Reportive (mostly).
          *   *Conditions:* Authority (budget approved, HR processed), Procedure (offer letter).
          *   *Risk:* Low/Medium (expectation management).
          *   *Verdict:* Usually constative. The *offer letter* or *contract amendment* is the performative. The conversation is the delivery.
          *   *Flag:* If the manager says this before comp changes are approved, it creates a binding expectation (promissory estoppel risk).

  5.  **Drafting the Response:**
      *   *Tone:* Professional, direct, slightly academic but grounded in HR ops reality. Acknowledge the user's insight (they are right to worry about this).
      *   *Structure:*
          1.  Validation (You're right, this matters).
          2.  The Protocol (The Checklist/Decision Tree).
          3.  The Audit (Applying to the 3 scripts).
          4.  The Hard Truths (Where philosophy fails and law takes over).
      *   *Key Distinction:* Differentiate between *Institutional Performatives* (HR Policy) and *Legal Performatives* (Contract/Law). The user's friend was arguing Philosophy; the user needs to manage Liability.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Don't get too bogged down in Austin vs. Searle jargon. Keep it applicable to HR. Use "Felicity Conditions" but define them in HR terms (Authority, Process, Documentation).
      *   *Correction on Script 1:* In many nonprofits, the *letter* is the legal termination. The meeting is the *notification*. I need to make sure the user understands that their script might be legally constative even if it sounds performative.
      *   *Correction on Script 3:* Promotions often involve a change in contract. The words "you are promoted" are rarely the binding act; the signed offer letter is. I need to highlight this gap.
      *   *Addressing the "Bar Argument":* The friend said "Speech act theory says he fired him." I need to clarify that Speech Act Theory describes *language*, but Employment Law describes *liability*. They can diverge. A manager can * linguistically* fire someone, but the *organization* can void it if conditions aren't met. This is the "Institutional Fact" vs. "Brute Fact" distinction (Searle).

  7.  **Final Polish:** Check against constraints.
      *   (a) Performative/Constative? Yes.
      *   (b) Felicity conditions? Yes.
      *   (c) Binary/Gradient? Yes.
      *   (d) Escalation points? Yes.
      *   Straight talk? Yes.
      *   No sugarcoating? Yes.

  8.  *(Final thought)*: Make sure to emphasize that in HR, *documentation* often trumps *utterance*. The "Written vs. Oral" debate is the biggest risk area.

