answer: |-
  You are right to be worried. Your friend the law lecturer is arguing from a philosophical framework (Speech Act Theory), but you are operating in a liability framework (Employment Law + Organizational Policy). The danger zone is where those two diverge.

  In philosophy, if the felicity conditions are met, the act is done. In HR, if the felicity conditions are *not* met, the act might still be claimed to have happened by the employee, leading to litigation. You aren't just auditing language; you are auditing risk.

  Here is the **Performative Audit Protocol (PAP)** designed for HR Operations. It translates Austin and Searle into compliance language.

  ### Part 1: The Performative Audit Protocol (PAP)

  Use this decision tree for every script.

  **Step 1: The Intent Classification (Constative vs. Performative)**
  *   **Question:** Is this utterance intended to *change the state of the world* (create a new employment status), or is it intended to *describe a change* that has already occurred administratively?
  *   **Test:** If the manager stays silent, does the status change anyway?
      *   *Yes:* The script is **Constative** (Reporting).
      *   *No:* The script is **Performative** (Doing).
  *   **Risk:** High-risk acts (firing, demoting) should usually be Constative (reporting a decision made by HR/Leadership) to prevent rogue performatives.

  **Step 2: The Felicity Condition Checklist**
  For an utterance to successfully perform an act without creating liability, the following must hold. Mark each as **Binary** (Pass/Fail) or **Gradient** (Risk increases as condition weakens).

  1.  **Authority (Binary):** Does the speaker have the *delegated power* to enact this specific change *at this specific time*?
      *   *Fail State:* Manager fires without VP sign-off.
  2.  **Procedural Pre-conditions (Binary):** Have all required steps occurred *before* the words are spoken? (e.g., HR review, documentation filed, approvals signed).
      *   *Fail State:* Warning given before incident investigation is closed.
  3.  **Formulation (Gradient):** Are the words explicit enough to be understood, but constrained enough to prevent scope creep?
      *   *Fail State:* "We need to part ways" (Vague) vs. "Your employment is terminated" (Explicit).
  4.  **Sincerity/Intent (Binary):** Does the organization stand behind the words immediately?
      *   *Fail State:* Manager says "You're fired," then emails HR 10 minutes later asking, "Can we take that back?"
  5.  **Uptake/Acknowledgment (Gradient):** Does the employee need to acknowledge receipt for the act to stick?
      *   *Fail State:* Employee claims they didn't understand the warning.

  **Step 3: The Escalation Threshold**
  *   **Stop and Call Legal/Senior HR if:**
      *   Authority is delegated but not verified (e.g., "I think I can fire for this").
      *   Procedural Pre-conditions are incomplete (e.g., "We'll get the paperwork done tomorrow").
      *   The utterance creates a financial obligation (Promotion/Raise) without a signed contract amendment.

  ---

  ### Part 2: The Audit of Your Scripts

  Here is the straight talk on your three scripts.

  #### Script 1: Termination Opener
  > **Script:** "I'm terminating your employment effective immediately."

  *   **Classification:** **Performative (Declarative).**
      *   This utterance attempts to sever the contract.
  *   **Felicity Conditions:**
      *   **Authority:** **Binary.** Does this manager have final sign-off? If your policy says "VP Approval Required," and the VP hasn't signed, this utterance is **infelicitous**.
      *   **Procedure:** **Binary.** In most nonprofits, the *Termination Letter* is the legal performative, not the spoken words. The spoken words are merely **notification**.
      *   **Uptake:** **Gradient.** The employee doesn't have to agree, but they must hear it.
  *   **The Verdict:**
      *   **Philosophical Reality:** If the manager says this with intent, a speech act *has occurred*. The social reality is broken.
      *   **HR/Legal Reality:** If the VP hasn't signed off, the organization can void the act, but you have now created a **Wrongful Termination** exposure because the manager created a reasonable expectation of termination.
      *   **The Fix:** Change the script to Constative.
      *   *Revised:* "The organization has made the decision to end your employment. Here is the letter confirming the details."
      *   *Why:* This shifts the performative weight to the **Letter** (which HR controls), not the **Voice** (which the manager controls).
  *   **Flag:** **HIGH RISK.** If your current script allows a manager to say this before HR/VP final sign-off, you are winging it dangerously. The "bar argument" your friend won is legally dangerous for you. Philosophically, he fired the guy. Legally, you now have to clean up the mess of an unauthorized firing.

  #### Script 2: Verbal Warning
  > **Script:** "This is a formal verbal warning and will be documented in your file."

  *   **Classification:** **Performative (Verdictive).**
      *   This utterance places the employee on a disciplinary track.
  *   **Felicity Conditions:**
      *   **Authority:** **Binary.** Managers usually have this.
      *   **Procedure:** **Binary.** Has the incident been verified? Is there evidence?
      *   **Formulation:** **Gradient.** The phrase "Verbal Warning" is an oxymoron in HR. It is a **Documented Warning delivered orally.**
  *   **The Verdict:**
      *   **Philosophical Reality:** The act is performed the moment the words are spoken.
      *   **HR/Legal Reality:** The act is not secure until the documentation is filed. If the manager says this but never emails HR to file it, the "warning" is ghost.
      *   **The Fix:** Acknowledge the contradiction.
      *   *Revised:* "We are issuing a Formal Warning. I am telling you this verbally now, but you will receive written confirmation for your file."
      *   *Why:* This clarifies that the *record* is the enduring act, the *speech* is the delivery mechanism.
  *   **Flag:** **MEDIUM RISK.** The borderline condition here is **Documentation**. If the manager says the words but fails the "Documentation" precondition within 24 hours, the performative degrades. Your script needs a mandatory follow-up task attached to it.

  #### Script 3: Promotion Conversation
  > **Script:** "I'm pleased to tell you we're promoting you to senior program manager."

  *   **Classification:** **Constative (Reportive) masquerading as Performative.**
      *   This is the most dangerous script you have.
  *   **Felicity Conditions:**
      *   **Authority:** **Binary.** Has Comp/HR approved the salary band? Has the budget been released?
      *   **Procedure:** **Binary.** Is there a signed offer letter or contract amendment?
  *   **The Verdict:**
      *   **Philosophical Reality:** The manager is expressing joy and reporting news.
      *   **HR/Legal Reality:** This is **not** the promotion. The promotion happens when the compensation system is updated and/or the new contract is signed.
      *   **The Danger:** If a manager says this, and then Budget pulls the funding 2 hours later, the employee has a claim for **Promissory Estoppel**. They relied on your performative to their detriment (e.g., quit their other job, moved houses).
      *   **The Fix:** Make it explicitly conditional or reportive of a completed process.
      *   *Revised:* "I'm pleased to confirm that your promotion to Senior Program Manager has been approved. You will receive the updated offer letter from HR by EOD."
      *   *Why:* "Confirm... has been approved" anchors the act in the *past* (the approval), not the *present* (the manager's speech).
  *   **Flag:** **HIGH RISK (Financial).** This utterance is performative *enough* to bind the organization in court if the paperwork lags. If your managers are saying this before HR sends the letter, stop them immediately.

  ### Part 3: Where Philosophy Fails You

  You asked for straight talk on where the theory doesn't help. Here it is:

  1.  **Institutional Facts vs. Brute Facts:**
      Speech Act Theory works great for "I promise." It works poorly for "I fire." Firing isn't just a speech act; it's an **institutional fact**. It requires a backend system (payroll, benefits, access keys) to validate the speech. If the manager says "You're fired" but Payroll keeps paying them, the *institution* overrides the *speech*. Your audit must prioritize the **System** over the **Script**.

  2.  **The "Uptake" Problem:**
      Austin argued uptake (the hearer understanding) is necessary for a performative. In HR, it doesn't matter if they understand. If you hand them the termination letter and they scream "I don't accept this!", they are still fired. Do not build scripts that require employee agreement to be valid.

  3.  **The "Winging It" Zone:**
      You mentioned you've been winging it. The biggest gap is **Delegated Authority**.
      *   *Philosophy:* If the manager says it, they meant it.
      *   *HR:* If the manager says it, did they have the right to?
      *   *The Gap:* Your scripts assume the manager has the authority. Your **Process** must verify it *before* the script is read.
      *   *Action:* Your checklist needs a "Pre-Meeting Authorization" step. No script is safe if the manager hasn't clicked "Approve" in the HRIS system before walking into the room.

  ### Summary Recommendation

  1.  **Terminate the "Oral Termination":** Rewrite Script 1. The spoken words should never be the instrument of termination. They should be the *delivery* of the written instrument. The letter fires; the manager explains.
  2.  **Clarify the "Verbal" Warning:** Rename it "Initial Formal Warning." Acknowledge in the script that it creates a record.
  3.  **Delay the Promotion:** Ensure Script 3 is only read *after* the offer letter is generated. The script confirms the admin act; it does not initiate it.

  Your friend the lecturer is right about language, but you are responsible for liability. In HR, **paperwork trumps speech.** Design your scripts to reflect that hierarchy.
