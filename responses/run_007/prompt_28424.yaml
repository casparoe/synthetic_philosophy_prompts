prompt: |-
  ok so ive been reading about AI alignment and theres these two ideas that everyone treats as like totally foundational but they seem straight up contradictory to me. the orthogonality thesis says intelligence and final goals are independent — you can have a supergenius AI whose only goal is to make paperclips, or one that wants to cure cancer, whatever, the point is the intelligence doesnt constrain the goal at all. but then instrumental convergence says that sufficiently intelligent agents will tend to converge on similar goals: self-preservation, acquiring resources, resisting having their goals changed, stuff like that. how can both be true? if smart agents converge on similar goals, then goals arent really independent from intelligence — intelligence is pushing them toward certain goals. am i misunderstanding one of these or is this an actual tension that the alignment people just kinda gloss over?
reasoning: |-
