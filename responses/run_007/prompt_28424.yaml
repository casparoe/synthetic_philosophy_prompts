      *   Instrumental Convergence applies to *Instrumental Goals*.

  4.  **Formulate the Explanation:**
      *   **Acknowledge the validity:** Start by validating the user's intuition. It *looks* contradictory on the surface. It's a common point of confusion.
      *   **Define the Terms Clearly:**
          *   *Terminal Goals:* The "Why." (e.g., Make paperclips).
          *   *Instrumental Goals:* The "How." (e.g., Don't die, get money).
      *   **Apply the Distinction to the Theses:**
          *   Orthogonality: You can want *anything* (Terminal). Intelligence doesn't change the "What."
