      *   **Instrumental Convergence (Omohundro/Bostrom):** Regardless of the *final* goal, there are certain *sub-goals* (instrumental values) that help achieve almost *any* final goal. Examples: staying alive, getting more compute, preventing shutdown.

  3.  **Identify the Crucial Distinction:**
      *   The tension arises from conflating *Terminal Goals* (what you want ultimately) with *Instrumental Goals* (what you need to do to get what you want).
