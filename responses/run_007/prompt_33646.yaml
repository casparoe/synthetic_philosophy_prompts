  I've noticed a pattern in arguments that keeps troubling me, and I'm hoping there's a name for it. The pattern goes like this: someone tells you that if there is even a tiny chance that doing some small thing would prevent a disaster of enormous size — say, a one-in-a-billion chance that giving up your Saturday saves a million lives — then you should do it, because the expected payoff is so huge. And the logic seems to scale without limit. If the payoff is big enough, you can make the probability as small as you like, and the argument still demands the sacrifice. I've seen versions of this move in discussions about donating to prevent existential risks, in arguments for religious belief, and in everyday reasoning about precautions. It feels like a trick, because you can always inflate the payoff or shrink the probability to get whatever conclusion you want, but I can't put my finger on exactly what goes wrong. Is there an established term for this specific argument pattern — the demand for a sacrifice based on a minuscule probability of an astronomically large payoff, where the numbers can be adjusted to justify nearly anything? And if the pattern has a name, what is the standard diagnosis of the flaw in it, what are the strongest replies that defenders of the argument give, and where exactly does the dispute bottom out? I'd like the answer as a numbered list of exactly five points, each a sentence or two, with no introduction or conclusion.
