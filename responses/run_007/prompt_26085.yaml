answer: |-
  The stalemate is a substantive disagreement about the correct formalism for counterfactual reasoning—causal versus logical—masked as a verbal dispute over the extension of "rationality."

  The core friction is ontological: Causal Decision Theory (CDT) models the agent as a physical node in a causal graph where the copy is a distinct variable correlated by common cause, whereas superrationality (and its modern successor, Functional Decision Theory) models the agent as an instantiation of an abstract algorithm where the copy is the same logical variable. When the CDT proponent says "my choice doesn't causally affect theirs," they are employing Pearl's `do()` operator, which surgically severs incoming causal arrows to the decision node. When the superrationalist says "if I cooperate, they cooperate," they are employing a logical counterfactual, where changing the output of the decision function necessarily changes the output of all instantiations of that function. Because standard probability theory and causal models lack a native formalism for logical dependence, the two sides are literally calculating different expected utilities using different counterfactual semantics, even though they use the same words to describe the scenario.

  This feels like a verbal dispute because both camps claim the normative label "rational," but the disagreement is deeper than definition; it is about which formalism correctly captures the constraints on agency. The CDT side prioritizes causal efficacy and the intuition of "could have done otherwise" in a physical sense, while the superrational side prioritizes optimal outcomes and the intuition that reasoning is a deterministic process that must yield identical results given identical inputs. As long as the debate remains framed around intuitive pumps about prisoner's dilemmas, it will spin, because each side's intuitions are calibrated to their own underlying metaphysics of choice.

  The debate can only move if the question shifts from "what action is rational?" to "what decision algorithm is reflectively consistent?" If you ask a CDT agent whether it would self-modify before the game to bind itself to superrational reasoning, it must say yes to maximize utility, implying its own decision procedure is unstable. This reframes the issue from a normative clash to a technical requirement for autonomous agents: rationality must be defined such that an agent does not wish to rewrite its own source code. Progress depends on whether philosophers accept reflective consistency as a necessary condition for rationality; if they do, superrationality (or FDT) wins by default, but if they reject it to preserve causal intuitions, the deadlock remains permanent. The increasing relevance of AI coordination may force this resolution, as engineered agents require formalisms that handle logical correlation without ambiguity.
