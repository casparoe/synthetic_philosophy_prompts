answer: |-
  ### Instructor's Note on Logical Space (Pre-Drafting Reflection)
  *To ensure the exam question targets the genuine philosophical tension:* The core issue is not merely that idealization is hard to define, but that the *criteria* for idealization determine the *output*. If the criteria are purely descriptive (e.g., "more data," "less anger"), they fail to rule out pathological outcomes (Inertia). If the criteria are normative (e.g., "relevant data," "reasonable anger"), the theory presupposes the very norms it seeks to ground (Loading). A strong answer must show how different theories locate themselves on this spectrum and whether they can claim the "normative" elements are merely conceptual truths rather than substantive moral commitments.

  ***

  ### 1. Essay Question

  **Course:** PHI 550 – Metaethics and the Foundations of Normativity
  **Assessment:** Take-Home Final Examination
  **Time Limit:** 48 Hours
  **Word Limit:** 2,500 words maximum

  **Question:**

  Procedural accounts of normativity attempt to ground substantive moral truths in the outcomes of idealized deliberation (e.g., what an agent would choose under full information, or what contractors would agree to behind a veil of ignorance). However, such accounts face a structural dilemma: the **Normative Loading vs. Normative Inertia** objection.

  1.  **Loading:** If the conditions of idealization (e.g., rationality, impartiality, relevance) are specified using normative concepts, the account is circular and fails as a reductive grounding strategy.
  2.  **Inertia:** If the conditions are specified using purely non-normative, psychological, or functional concepts, the procedure is under-constrained and fails to yield determinate normative authority.

  Select **two** distinct frameworks of indirect normativity (e.g., Full-Information Accounts, Ideal Observer Theory, Ideal Contractualism, or Coherent Extrapolated Volition). Construct a comparative argument assessing whether either framework can escape this dilemma. Do not merely summarize the views; you must diagnose whether the specific *procedural specifications* of each view render them vulnerable to Loading, Inertia, or both. Conclude by evaluating whether the dilemma forces a rejection of reductive proceduralism entirely, or if a viable escape route exists.

  ***

  ### 2. Model Answer

  **Title:** The Euthyphro Problem of Procedure: A Diagnostic of Idealization

  Indirect normative theories seek to anchor "ought" in "would"—specifically, what agents would will under idealized conditions. The promise is a naturalistic grounding of normativity without invoking queer moral properties. However, the Normative Loading vs. Normative Inertia dilemma suggests this project is structurally unsound. If the idealization is normatively thick, it begs the question; if thin, it is impotent. By examining Peter Railton's Full-Information Account and John Rawls's Ideal Contractualism, we see that while they stumble on different horns of the dilemma, neither successfully escapes the need for prior normative commitment, suggesting that reductive proceduralism is untenable.

  Railton's naturalistic realism defines an agent's good as what they would want themselves to want if they possessed full information and instrumental rationality. This framework leans heavily toward the **Inertia** horn. To avoid Loading, Railton defines rationality instrumentally and information empirically. Yet, without a normative constraint on the *content* of desires, full information does not guarantee normatively robust outcomes. An agent with full information might still desire pathological ends (e.g., counting blades of grass) if their psychological constitution is sufficiently alien. Railton attempts to mitigate this by appealing to the "social environment" and objective facts, but if the procedural output depends entirely on contingent psychological dispositions, the procedure lacks normative *authority*. It tells us what we *would* value, not what we *should*. To fix this, Railton would need to stipulate that certain desires are "irrational" regardless of information, but this introduces a normative standard external to the procedure, collapsing into Loading.

  Conversely, Rawlsian Contractualism faces the **Loading** horn more acutely. The "original position" is designed to yield principles of justice through rational agreement under a veil of ignorance. However, the specifications of the veil are not neutral. Excluding knowledge of one's conception of the good or specific talents is a substantive normative choice, not a procedural necessity. If the contractors knew their talents, they might agree to a meritocratic hierarchy; by withholding this knowledge, Rawls ensures an egalitarian outcome. Critics argue this rigs the game. To defend the veil, Rawls must argue that these constraints are "reasonable," but reasonableness is itself a normative concept. Thus, the procedure does not generate normativity from non-normative inputs; it processes prior normative commitments (embedded in the constraints) into specific principles. The procedure is heuristic, not foundational.

  Comparing the two reveals a structural trade-off. Railton preserves naturalistic purity but loses normative grip (Inertia); Rawls secures normative traction but sacrifices reductive purity (Loading). Can either escape? Proponents of Reflective Equilibrium might argue the circularity is virtuous rather than vicious. They claim we refine our procedural specifications against our considered judgments until they cohere. However, this abandons the reductive ambition. If the procedure is validated by our pre-existing moral intuitions, it is not grounding those intuitions; it is systematizing them. This is a viable metaethical position, but it concedes that idealization is not the *source* of normativity.

  Another potential escape lies in **Conceptual Truths**. A proceduralist might argue that the constraints (e.g., "impartiality" or "instrumental rationality") are analytic truths about morality or agency, not substantive moral commitments. For Rawls, being moral just *means* being impartial. For Railton, being an agent just *means* pursuing means to ends. If these are conceptual necessities, the Loading charge fails because no substantive moral premise is smuggled in. Yet, this defense is fragile. Disputes over what constitutes "rationality" or "impartiality" are themselves normative disputes. To define rationality as excluding sadism is not a conceptual truth; it is a moral stance.

  Ultimately, the dilemma forces a choice between authority and reductiveness. To secure authority (avoid Inertia), one must build normative standards into the idealization (accept Loading). To secure reductiveness (avoid Loading), one must rely on bare psychology (accept Inertia). Since the primary motivation for indirect normativity is usually to provide a naturalistic reduction that retains authority, the dilemma is fatal to the project as originally conceived. The only viable escape is to abandon reductivism: accept that idealization reveals normative truths that exist independently of the procedure. But this transforms the view into a form of non-naturalistic or robust naturalistic realism, where the procedure is epistemic rather than ontological. Thus, the dilemma does not destroy normativity, but it does destroy the hope that procedural idealization can ground it without presupposing it.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 40 (6 Criteria × 5 marks + 10 marks for General Quality)

  | Criterion | Description | Weak Answer (0–2 marks) | Strong Answer (5 marks) |
  | :--- | :--- | :--- | :--- |
  | **1. Formulation of the Dilemma** | Accurately defines Loading (circularity) and Inertia (under-constraint) as structural problems for grounding. | Defines terms vaguely or conflates them with general skepticism about objectivity. | Precisely distinguishes the metaphysical/epistemic stakes of each horn regarding *grounding*. |
  | **2. Analysis of Framework A (Inertia/Loading)** | Identifies which horn primarily threatens the first chosen theory (e.g., Railton/Inertia). | Merely summarizes the theory's mechanics without linking them to the dilemma. | Demonstrates *why* the specific procedural specifications (e.g., instrumental rationality) invite the specific horn. |
  | **3. Analysis of Framework A (Counter-Move)** | Assesses the theorist's potential defense against the identified horn. | States the defense without evaluating its success against the dilemma. | Diagnoses why the defense either surrenders reductivism or fails to solve the structural issue. |
  | **4. Analysis of Framework B (Inertia/Loading)** | Identifies which horn primarily threatens the second chosen theory (e.g., Rawls/Loading). | Treats the second theory in isolation without applying the dilemma's pressure. | Shows how the specific constraints (e.g., veil of ignorance) function as normative inputs. |
  | **5. Comparative Diagnostic** | Compares how the two theories fail or succeed differently relative to each other. | Discusses theories sequentially without synthesizing the comparison. | Articulates the trade-off (e.g., purity vs. authority) revealed by comparing the two failures. |
  | **6. Evaluation of Escape Routes** | Judges whether the dilemma is fatal or escapable (e.g., via Reflective Equilibrium or Non-reductivism). | Offers a binary "yes/no" conclusion without metaethical nuance. | Nuanced verdict that distinguishes between saving the *procedure* vs. saving the *reductive project*. |

  **General Quality (10 Marks):**
  *   **Argumentative Cohesion (4 marks):** The essay flows logically; the conclusion follows from the comparative diagnosis.
  *   **Originality/Insight (3 marks):** Goes beyond standard lecture notes to offer a novel synthesis or critique of the escape routes.
  *   **Clarity and Precision (3 marks):** Philosophical terminology is used correctly; prose is concise and free of ambiguity.

  **Grading Note:** To earn full marks on the "Evaluation of Escape Routes" criterion, the student must recognize that escaping the dilemma often requires abandoning the *reductive* ambition of proceduralism, not just tweaking the procedure. Answers that claim a "perfect proceduralism" is possible without addressing the presupposition of normativity should be capped at 3/5 on this point.
