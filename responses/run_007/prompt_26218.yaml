answer: |-
  You have identified a genuine and well-documented phenomenon, but you are correct to sense that it sits in a gap between disciplines. There is no single, canonical term in aesthetics that captures *exactly* this retroactive rewriting of the sensory record.

  The phenomenon you describe is usually discussed in fragments across psychology, philosophy of mind, and cognitive science of art, but it lacks a unified label in aesthetic theory.

  Here is the breakdown of the nearest established concepts, why they don't quite fit, and a proposal for a label that carves the phenomenon at its joints.

  ### 1. The Nearest Established Concepts

  **A. Hindsight Bias (Psychology)**
  *   **What it is:** The "I-knew-it-all-along" effect. Once an outcome is known, people reconstruct their prior expectations to align with the new information.
  *   **Why it's close:** It explains the *temporal* distortion. Critics claim they "always sensed something off" because their memory has been updated to match the current truth.
  *   **Why it falls short:** Hindsight bias is usually about *predictions* (e.g., "I knew that stock would crash"). Your observation is about *sensory qualia* (e.g., "the paint looks flat"). It's not just a memory of a thought; it's a memory of a sensation.

  **B. Cognitive Penetrability of Perception (Philosophy of Mind)**
  *   **What it is:** The debate over whether beliefs/knowledge can directly alter low-level sensory processing (e.g., does knowing a patch is red make it *look* redder?).
  *   **Why it's close:** It addresses the mechanism. If perception is "cognitively penetrable," then knowing a painting is a forgery could literally change how the light hits your retina (or how the brain processes that signal).
  *   **Why it falls short:** This describes the *possibility* of belief affecting perception in the present. It doesn't inherently account for the *retroactive* narrative ("it *always* looked this way").

  **C. Psychological Essentialism (Cognitive Science of Art)**
  *   **What it is:** The intuition that objects (especially art) contain an invisible "essence" from their creator. (Championed by Paul Bloom and Denis Dutton).
  *   **Why it's close:** This explains *why* the perception changes. If the "Vermeer essence" is removed, the object is ontologically different, so the brain seeks sensory evidence to match the new ontology.
  *   **Why it falls short:** Essentialism explains the devaluation, but not necessarily the *memory revision*. One could say, "It has no essence now," without claiming, "It never had luminosity."

  **D. Reconstructive Memory / The Post-Event Information Effect (Cognitive Psychology)**
  *   **What it is:** Elizabeth Loftus's work showing that new information introduced after an event can alter the memory of the event itself.
  *   **Why it's close:** This is the actual neurological mechanism. The "exposure" is the post-event information that rewrites the "viewing" memory.
  *   **Why it falls short:** It's a general memory term, not specific to the *aesthetic* or *sensory* nature of the revision.

  ### 2. Why the Aesthetic Canon Misses This
  You rightly excluded Goodman and Dutton. Goodman (*Languages of Art*) focuses on the epistemic value of authenticity (knowing it's a forgery changes how we *investigate* the work). Dutton (*The Art Instinct*) focuses on the evolutionary value of performance and authenticity.

  Both treat the change as a **re-evaluation of status**, not a **revision of sensation**. They assume the sensory data remains constant while the *judgment* shifts. Your observation is more radical: the sensory data itself is retroactively corrupted.

  ### 3. Proposed Label: "Retroactive Perceptual Contagion"

  If I were to coin a term that carves this at the joints, I would call it **Retroactive Perceptual Contagion**.

  Here is why this label works:

  1.  **Retroactive:** It captures the specific temporal anomaly you identified. The knowledge travels backward in time to alter the record of the experience.
  2.  **Perceptual:** It distinguishes this from mere *judgment revision*. It's not that the price tag changed; it's that the brushstroke looks stiff. It claims the *qualia* (the subjective sensory experience) have been altered.
  3.  **Contagion:** This is the crucial element. In anthropology and psychology, "contagion" refers to the belief that properties can transfer between objects or ideas (e.g., a sweater worn by a murderer feels "evil"). In this case, the "fakeness" is a contaminant that infects the past experience. The knowledge of the forgery doesn't just sit alongside the memory; it seeps into it and spoils it.

  ### Alternative Formal Label: "Epistemic Rewriting of Aesthetic Qualia"
  If you need something more analytic for a philosophical context, **"Epistemic Rewriting"** is precise. It highlights that *episteme* (knowledge of provenance) is rewriting *aisthesis* (sensory experience).

  ### Summary of the Distinction
  To ensure you have the vocabulary to distinguish this from its neighbors:

  *   **Vs. Re-evaluation:** Re-evaluation says, "It looks the same, but it's worth less." **Retroactive Perceptual Contagion** says, "It is worth less because it looks different now."
  *   **Vs. Confirmation Bias:** Confirmation bias is searching for evidence to support a belief. **Retroactive Perceptual Contagion** is the *creation* of evidence in the memory record where none existed before.
  *   **Vs. Hindsight Bias:** Hindsight bias is about *expectations* ("I knew it would fail"). **Retroactive Perceptual Contagion** is about *sensations* ("I see the cracks now").

  ### Conclusion
  You haven't missed a standard term; you've identified a specific intersection that hasn't been fully lexicalized. The phenomenon is a hybrid of **Reconstructive Memory** driven by **Psychological Essentialism**.

  If you write about this, **Retroactive Perceptual Contagion** is the strongest label. It captures the eerie feeling that the truth of the object has reached back through time to touch your eyes. It acknowledges that in aesthetics, provenance is not just metadata; it is a lens that, once placed over the eye, changes the light that *already passed through*.
