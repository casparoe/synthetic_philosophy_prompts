      *   **The Likeness Counter:** Marcus hits the big gun immediately. The Miller-Tichý theorem. If $A$ and $B$ are both false, Popper's definition implies neither is closer. This kills the utility of verisimilitude for false theories (which is all of them).
      *   **Elena's Defense/Retreat:** Elena can't deny the theorem. She needs to nuance the Popperian position. Maybe shift to *methodological* verisimilitude or admit the logical definition needs tweaking but the *spirit* remains. She argues that the Likeness view is worse.
      *   **Marcus's Positive Case:** Explain the possible worlds approach. Newton vs. Einstein. Newton is "closer" because the worlds he allows are physically similar to ours, even if strictly false.
