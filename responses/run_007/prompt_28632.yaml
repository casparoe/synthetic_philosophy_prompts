      *   *Check:* Are they strawmen? *Adjustment:* Ensure Elena doesn't just say "Popper said it." She should represent a sophisticated falsificationist who knows the criticism. Ensure Marcus isn't just saying "Intuition says so." He should appeal to structural realism or natural properties.

