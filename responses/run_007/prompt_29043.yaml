answer: |-
  The phenomenon you are encountering is widely known as **Simpson's Paradox**, but your intuition is reaching for something more specific: **Causal Inference**. Your gut is correctly distinguishing between **confounders** (variables that distort the relationship) and **mediators/colliders** (variables that are part of the relationship or consequences of it).

  Your working hypothesis ("Condition on pre-treatment, never on post-treatment") is remarkably accurate. It aligns with the **Backdoor Criterion** in causal diagrams. However, to make it robust enough to resolve Case 5 and the new Email case, we need to refine the language from "time" to "causality."

  ### The Principle: The Causal Adjustment Rule

  **Statement:**
  > To estimate the effect of a Treatment on an Outcome, stratify (split) only on variables that are **causes of the Treatment** (or common causes of Treatment and Outcome). **Never** stratify on variables that are **effects of the Treatment**.

  **In your terms:**
  *   **Pre-treatment variables:** Usually causes or common causes. **Trust the Split.**
  *   **Post-treatment variables:** Usually effects (mediators) or consequences (colliders). **Trust the Overall.**

  ---

  ### Testing the Principle Against Your Cases

  Here is how the principle validates your verdicts in Cases 1–4, and why it clarifies Case 5.

  #### Case 1: Referrer and Retention (Verdict: Trust Split)
  *   **Variable:** Platform (iOS/Android).
  *   **Causal Status:** Platform exists *before* the user encounters the referrer. It influences which referrer they use (A sends mostly iOS) and influences retention (iOS retains better).
  *   **Classification:** **Confounder** (Pre-treatment cause).
  *   **Principle:** Split on it.
  *   **Result:** Matches your verdict. The overall result is biased because Referrer A got an easier cohort (iOS).

  #### Case 2: Signup Page and Activation (Verdict: Trust Overall)
  *   **Variable:** Time on Page.
  *   **Causal Status:** The Page Version *causes* the Time on Page (e.g., a confusing page makes people stay longer or leave faster). Time on Page then influences Activation.
  *   **Classification:** **Mediator** (Post-treatment effect).
  *   **Principle:** Do not split on it. Splitting blocks the causal path (e.g., if the New Page works *by* making people spend more time, splitting by time hides that benefit).
  *   **Result:** Matches your verdict.

  #### Case 3: Banner and Satisfaction (Verdict: Trust Overall)
  *   **Variable:** Purchaser Status.
  *   **Causal Status:** Banner Exposure happens, then User decides to Purchase. You are analyzing only Purchasers.
  *   **Classification:** **Collider / Selection Bias** (Post-treatment effect).
  *   **Principle:** Do not condition on it. Conditioning on a downstream outcome (Purchase) creates a spurious association between the Banner and unmeasured factors (like "price sensitivity") that also drove the purchase.
  *   **Result:** Matches your verdict.

  #### Case 4: Plan Type and Revenue (Verdict: Trust Overall)
  *   **Variable:** Support Tickets.
  *   **Causal Status:** Plan Choice happens first. The Plan influences how many tickets a user files (e.g., Pro users get better support or are more power users). Tickets influence Revenue (or correlate with it).
  *   **Classification:** **Mediator** (Post-treatment effect).
  *   **Principle:** Do not split on it. If Pro plans reduce ticket volume (a benefit), splitting by ticket count controls away that benefit.
  *   **Result:** Matches your verdict.

  #### Case 5: Tutorial Completion and Retention (Verdict: Torn)
  *   **Variable:** Week-1 Activity.
  *   **Causal Status:** Tutorial happens first. Tutorial causes Activity. Activity causes Retention.
  *   **Classification:** **Mediator** (Post-treatment effect).
  *   **Principle:** Do not split on it. Trust the **Overall**.
  *   **Why you are torn:** You are sensing a conflict between **Causal Effect** and **Predictive Value**.
      *   *Causal Question:* "Does forcing a user to do the tutorial increase retention?" (Answer: Look at Overall).
      *   *Mechanism Question:* "Does the tutorial help *beyond* just getting them active?" (Answer: Look at Split).
      *   *Observational Warning:* Because tutorial completion is self-selected (observational), the **Overall** is also biased by *pre-treatment* motivation (motivated users complete tutorials *and* retain).
  *   **Resolution:** The Principle dictates you **Trust the Overall** for business decisions. The value of the tutorial *includes* its ability to drive week-1 activity. If you split by activity, you are asking, "For users who are already active, did the tutorial help?" which is a much narrower question. However, acknowledge that because this is observational, the Overall number includes selection bias (motivated users).

  #### New Case: Email Subject Lines (Verdict: ?)
  *   **Scenario:** Subject Line A vs. B. Assignment based on Signup Cohort. Overall conflicts with Split by Cohort.
  *   **Variable:** Signup Cohort.
  *   **Causal Status:** Cohort exists *before* the Email Send. The Cohort determines which Subject Line they get (Assignment based on cohort). The Cohort also likely determines Open Rate (e.g., newer cohorts are more engaged).
  *   **Classification:** **Confounder** (Pre-treatment cause).
  *   **Principle:** **Trust the Split.**
  *   **Reasoning:** This is structurally identical to Case 1. If Cohort 1 (high openers) mostly got Subject A, and Cohort 2 (low openers) mostly got Subject B, Subject A will look better overall even if Subject B is actually superior within each cohort.
  *   **Verdict:** You must trust the **Cohort-Split** result. The Overall is confounded by cohort engagement levels.

  ---

  ### Where the Principle Breaks (and how to repair it)

  Your hypothesis is strong, but it has two specific failure modes you need to know to avoid future pitfalls.

  #### 1. The "Observational Trap" (Case 4 & 5)
  The principle says "Trust Overall" for post-treatment splits. However, if the Treatment itself was **not randomized** (e.g., Plan Choice in Case 4, Tutorial Completion in Case 5), the **Overall** result is vulnerable to *pre-treatment* confounding.
  *   **In Case 4:** You trusted the Overall (Pro makes more revenue). But if Pro users are simply larger companies (a pre-treatment variable you didn't measure), the Overall is misleading. The principle protects you from *over-controlling* (splitting on tickets), but it does not protect you from *under-controlling* (ignoring company size).
  *   **Repair:** "Trust the Overall *only if* the treatment is randomized or pre-treatment confounders are balanced. If observational, the Overall is a mix of causal effect and selection bias."

  #### 2. The "M-Bias" (Rare but possible)
  Sometimes a pre-treatment variable is a **Collider** (an effect of two unmeasured causes). Conditioning on it *introduces* bias where none existed.
  *   **Example:** Suppose "Platform" (Case 1) wasn't a cause of Referrer, but both Platform and Referrer were caused by an unmeasured "Tech Savviness." Splitting by Platform could theoretically induce bias.
  *   **Repair:** In product analytics, this is rare. It is safer to assume Pre-treatment = Confounder. Stick to your rule, but be aware that not *every* pre-treatment variable needs to be split on—only those that correlate with both Treatment and Outcome.

  ### Final Precise Statement for Your Workflow

  To operationalize this, replace your gut check with this decision tree:

  1.  **Did the variable exist before the user encountered the treatment?**
      *   **No (Post-treatment):** **DO NOT SPLIT.** Trust the Overall. (Cases 2, 3, 4, 5).
          *   *Reason:* You will block the mechanism or induce selection bias.
      *   **Yes (Pre-treatment):** Go to Step 2.
  2.  **Does the variable influence both the Treatment assignment and the Outcome?**
      *   **Yes (Confounder):** **SPLIT.** Trust the weighted average of the splits. (Cases 1, New Email Case).
          *   *Reason:* The Overall is biased by imbalanced cohorts.
      *   **No:** You may ignore it (splitting only adds noise).

  **Summary of Verdicts:**
  *   **Case 1:** Split (Pre-treatment Confounder).
  *   **Case 2:** Overall (Post-treatment Mediator).
