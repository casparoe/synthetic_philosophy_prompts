  # Lesson Plan: The Envelope Elimination Game

  **Course:** Upper-Level Undergraduate Paradoxes & Self-Reference
  **Session:** 75 Minutes
  **Class Size:** 18 Students
  **Topic:** The Surprise Exam Paradox (Unexpected Hanging)

  ## I. Learning Objectives
  1.  **Experiential:** Students will personally undergo the tension of the backward induction argument, committing to the conclusion that the exam is impossible.
  2.  **Analytical:** Students will identify the specific premises (Knowledge, Announcement, Rationality) that generate the contradiction.
  3.  **Philosophical:** Students will distinguish between *psychological surprise* and *epistemic unknowability*.

  ## II. Materials & Preparation
  1.  **The Sealed Commitment:** Before class, write a day of the week (e.g., "WEDNESDAY") on a card. Place it in a sealed, opaque envelope. Label the envelope **"THE QUIZ DAY."** Place this visibly on the podium.
  2.  **The Five Day-Envelopes:** Prepare 5 large envelopes labeled **MON, TUE, WED, THU, FRI**.
      *   Inside 4 of them: A blank sheet of paper saying "NO QUIZ TODAY."
      *   Inside 1 of them (matching the Sealed Commitment): A short, 10-minute quiz on the previous week's reading (e.g., Liar Paradox basics).
      *   *Note:* You know which one contains the quiz; the students do not.
  3.  **Prediction Slips:** 18 slips of paper for students to submit their final prediction.
  4.  **Payoff Tokens:** Candy or a ledger for Extra Credit (EC) points.
  5.  **Whiteboard:** For tracking the elimination argument.

  ## III. The Payoff Scheme
  To incentivize the backward induction while maintaining the "sting" of the paradox:
  *   **Correct Prediction:** +5 EC Points (or large candy bar).
  *   **Incorrect Prediction:** -2 EC Points (or sour candy).
  *   **Claim of "Impossible":** 0 Points (Neutral).
  *   **Logical Consistency Bonus:** +1 EC Point if the group submits a valid written derivation of the impossibility argument, *even if the quiz happens*. (This ensures they engage with the logic rather than gambling).

  ## IV. Session Timeline (75 Minutes)

  ### Phase 1: The Announcement & Setup (10 Minutes)
  1.  **Display the Envelopes:** Place the 5 Day-Envelopes and the Sealed Commitment on the table.
  2.  **The Announcement:** Read the following script verbatim:
      > "Inside the Sealed Commitment is a day of this week. On that day, you will take a quiz. The content of the quiz is in the corresponding Day-Envelope.
      >
      > **Clause 1:** The quiz *will* happen on one of these five days.
      > **Clause 2:** You will *not know* the day of the quiz until the moment I open that day's envelope.
      >
      > You may deliberate openly. You may coordinate. You must submit a Prediction Slip before I open any envelope. If you predict the day correctly, you gain points. If you predict wrongly, you lose points. If you claim the announcement is logically impossible, you gain nothing, but you lose nothing."
  3.  **Verification:** Allow a student to verify the Sealed Commitment is sealed and the Day-Envelopes are identical from the outside.

  ### Phase 2: Deliberation & Backward Induction (30 Minutes)
  1.  **Group Work:** Divide students into 6 groups of 3.
  2.  **Task:** "Determine the optimal strategy. Can you deduce the day? Or is the announcement flawed?"
  3.  **Instructor Role:** Circulate. Do *not* lecture. If a group stalls, ask: "What do you know on Thursday night if the quiz hasn't happened yet?"
  4.  **Expected Output:** Groups should derive the Backward Induction:
      *   *Friday:* If it hasn't happened by Thu night, it must be Fri. But then we'd know Thu night. Violates Clause 2. So, not Fri.
      *   *Thursday:* If not Fri, and hasn't happened by Wed night, it must be Thu. But then we'd know. So, not Thu.
      *   *...Eliminate all days.*
      *   *Conclusion:* The quiz cannot happen.
  5.  **Submission:** Each group submits one **Prediction Slip** (Day or "Impossible") and, if claiming Impossible, their **Proof of Impossibility**.

  ### Phase 3: The Reveal & Quiz (15 Minutes)
  1.  **Collect Predictions:** Most groups will likely submit "Impossible" (due to the Logical Consistency Bonus and risk aversion).
  2.  **The Elimination:** Ask the class: "How many groups eliminated Friday?" (All hands). "How many eliminated Thursday?" (All hands).
  3.  **The Twist:** State: "Based on your reasoning, no day is possible. However, I am required to give the quiz."
  4.  **The Action:** Open the envelope for the day you chose (e.g., Wednesday).
      *   *If it contains the Quiz:* "It is Wednesday. Please take out pens. You have 10 minutes."
      *   *If it contains 'No Quiz':* (Do not do this. Always choose the envelope with the quiz for this activity to ensure resolution).
  5.  **Administration:** Students take the 10-minute quiz. They are now experiencing the "Surprise" despite having "proven" it impossible.

  ### Phase 4: Debrief & Mapping (20 Minutes)
  *Do not dismiss class until the mapping is complete.*

  **Step 1: The Emotional Check-in (5 mins)**
  *   "Who feels I lied?"
  *   "Who feels they were logically correct but practically wrong?"
  *   "Who is genuinely surprised?"

  **Step 2: Structural Mapping (10 mins)**
  Write the following on the board and ask students to map their experience to these terms:
  1.  **The Announcement:** (Clause 1: Existence, Clause 2: Unknowability).
  2.  **The Elimination:** (The Backward Induction).
  3.  **The Self-Reference:** (Clause 2 refers to the students' knowledge *of* Clause 1 & 2).
  4.  **The Collapse:** (Where did the logic break?)

  **Key Questions to Ask:**
  *   "When I opened the Wednesday envelope, did you *know* it was Wednesday beforehand?" (No).
  *   "So Clause 2 was satisfied psychologically. Why did the logic say it couldn't be?"
  *   "Does 'Knowledge' require certainty? If you were 99% sure it was Wednesday, does that count as knowing?"
  *   "Did the elimination argument destroy Clause 1 (Existence) or Clause 2 (Unknowability)?"

  **Step 3: Resolution Theories (5 mins)**
  Briefly outline three standard resolutions without endorsing one:
  1.  **Epistemic Blindspot:** The truth is knowable, but *asserting* it makes it unknowable (Shaw).
  2.  **Knowledge Norms:** 'Knowledge' requires a margin of error; the induction assumes infallibility (Williamson).
  3.  **Self-Reference:** The announcement is a self-contradictory sentence, like the Liar (Quine).

  ## V. Failure Modes & Handling

  | Failure Mode | Description | Concrete Handling |
  | :--- | :--- | :--- |
  | **The Spoiler** | A student says, "This is the Surprise Exam Paradox. It's fake." | Acknowledge: "Yes, it is. But the *feeling* of the contradiction is the data. Prove to me why your knowledge overrides the announcement." |
  | **The Gambler** | A student ignores the logic, guesses "Wednesday," and wins EC. | Highlight in debrief: "They won the points, but did they solve the paradox? No, they got lucky. The paradox is about *justification*, not luck." |
  | **The Skeptic** | "You could have put the quiz in any envelope. It wasn't committed." | Show the Sealed Commitment envelope again. "The commitment was to a day, not to the logic. The logic was yours." |
  | **Coordination Failure** | Half the class says "Impossible," half says "Friday." | Use this to discuss **Common Knowledge**. "Did you *know* that everyone else eliminated Friday? If not, the induction fails." |
  | **The "Foul" Claim** | "You lied! It wasn't a surprise, we knew it had to be one of the five!" | Distinguish **Set Knowledge** (it's one of five) vs. **Specific Knowledge** (it is Wednesday). The paradox concerns Specific Knowledge. |

  ## VI. Limitations of the Design
  Be explicit with students about where this simulation diverges from the idealized paradox:

  1.  **Idealized Epistemic States:** The paradox assumes students are perfect logicians who *know* the teacher is rational and truthful. In class, students suspect trickery (e.g., "He might change the day"). This "noise" actually helps replicate the real-world tension but muddies the pure logic.
  2.  **Time Compression:** The real paradox relies on the *passing of time* (Thursday night becomes Friday morning). Here, we simulate the passage of time hypothetically. This removes the "memory" component of knowing the quiz didn't happen on Mon/Tue.
  3.  **Contested Reading:** This design leans on the **Epistemic Reading** (focusing on "Knowledge"). It downplays the **Modal Reading** (focusing on "Possibility"). If a student argues, "It was *possible* it was Friday, just not *knowable*," the game treats that as a win for the teacher, but a strict logician might argue the announcement was simply false, not paradoxical.

  ## VII. What Would Change My Mind?
  I would restructure this activity if:

  1.  **The "Knowledge" Objection Holds:** If I become convinced by **Timothy Williamson's** critique (that knowledge requires a margin of error, so the students never *actually* know it's Friday on Thursday night because their cognitive faculties aren't perfect), then the Backward Induction is a fallacy from step one.
      *   *Change:* I would modify the activity to test *confidence levels* (0-100%) rather than binary knowledge, demonstrating that "near certainty" is not "knowledge," thereby dissolving the induction before it starts.
  2.  **Ethical Concerns on Deception:** If students feel the "Impossible" payoff (0 points) penalizes them for doing the philosophy correctly.
      *   *Change:* I would decouple the EC from the prediction. EC is awarded for the *quality of the argument* in the debrief essay, not the game outcome. The game becomes purely demonstrative.
  3.  **The "Self-Defeating" Resolution:** If I decide to teach the **Quinean** view (the announcement is simply self-contradictory and false).
      *   *Change:* I would alter the announcement to: "There will be a quiz, and you will not be able to *prove* which day it is." This shifts the focus from *knowledge* to *provability*, aligning with a Gödelian interpretation, requiring a different payoff structure (rewarding proof of unprovability).

  ## VIII. Instructor Notes for Success
  *   **Tone:** Maintain a playful but rigorous demeanor. You are not an adversary; you are the "System" testing their logic.
  *   **The Quiz Content:** Keep the actual quiz very easy (e.g., "Define 'self-reference'"). The point is the *context*, not the assessment.
  *   **The "Impossible" Bonus:** Ensure you actually award the +1 EC for the Proof of Impossibility. This validates their logical effort even though the world (you) contradicted it. This validates the philosophical struggle: *Logic said X, Reality said Y. Why?*
