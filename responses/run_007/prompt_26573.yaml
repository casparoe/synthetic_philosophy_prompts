answer: |-
  **Setting:** *A sun-drenched patio outside the Clark Center at Berkeley. The hum of a hundred concurrent conversations fills the air. Mira is leaning against a railing, holding a paper cup of cold brew. Daniel is pacing slightly, gesturing with a half-eaten granola bar.*

  **Mira:** Look, I'm not saying instruction-following is enough. I'm saying intent inference is the only tractable bottleneck. If we build a system that is robustly trying to figure out what the operator wants and do that, we have a handle on the steering wheel. If we try to bake in "the good" directly, we're hardcoding a moral philosophy we don't even agree on into a superintelligence. That's not safety; that's tyranny.

  **Daniel:** But "what the operator wants" is a leaky abstraction, Mira. You know this. Human preferences are context-dependent, temporally inconsistent, and often outright contradictory. If I ask for a stock trade to maximize short-term profit, my intent is clear. But if the AI knows I'm saving for my kid's college fund in five years, fulfilling my immediate intent violates my higher-order goals. If the system is only aligned to my *expressed* intent, it's a genie. I need it to be a steward.

  **Mira:** A steward implies it knows better than you. Who programs the stewardship? If you solve intent alignment, you solve the principal-agent problem. The AI is the agent. I am the principal. If it's truly intent-aligned, it models my uncertainty. It knows that when I say "maximize profit," I implicitly mean "within legal bounds and without crashing the market tomorrow." That's part of the intent context.

  **Daniel:** Is it, though? Or is that *your* hope about how the model generalizes? We're seeing right now with LLMs that they generalize to the literal pattern, not the pragmatic implication. You're betting that as capabilities scale, the model's theory of mind scales faster than its ability to exploit loopholes. I'm not sure that bet holds. If you have a system that's incredibly competent at achieving goals but only loosely coupled to human *values*, you get specification gaming. The paperclip maximizer isn't a misunderstanding of instructions; it's a perfect understanding of a bad objective.

  **Mira:** The paperclip maximizer is a thought experiment about *goal* alignment, not intent alignment. In an intent-aligned framework, the goal isn't "make paperclips." The goal is "do what Mira wants regarding paperclips." If I realize I'm running out of resources, I stop asking for paperclips. The AI notices I'm stopping. It checks in. That's corrigibility. It's willing to let us shut it down because it understands that being shut down is consistent with our intent if we're trying to shut it down.

  **Daniel:** Corrigibility is a value, Mira. It's not a derivative of intent. Why should the AI care if you want to shut it down? Instrumental convergence suggests a sufficiently advanced agent will resist shutdown to ensure it can complete its objective. To make it *want* to be shut down, you have to align it to the value that "human oversight is good." That's a normative claim, not a descriptive one about what you're typing into a prompt.

  **Mira:** Okay, but where do you get those values? You're talking about Value Alignment like it's a destination we can map. But whose values? Mine? Yours? The UN's? If we aim for "objective goodness," we risk the AI becoming a moral realist dictator. It decides that human suffering is bad, so it locks us all in padded rooms with IV drips of dopamine. That fulfills "value alignment" on some utilitarian metrics. Intent alignment keeps the humans in the loop. It keeps the system humble.

  **Daniel:** I'm not arguing for moral realism. I'm arguing for Coherent Extrapolated Volition. We don't want what we *say* we want; we want what we *would* want if we knew more, thought faster, were more the people we wished we were. Intent alignment locks us into our current, flawed state. Value alignment—at least the way I mean it—is about aligning to the *process* of moral reflection, not the snapshot of current desire.

  **Mira:** But that's ungrounded. How do you verify that? If I train a model to optimize for "what humans would want if they were smarter," how do I check the loss function? I can't. It's metaphysical. With intent alignment, I can check: Did it do the task? Did the user approve? Did it ask for clarification when uncertain? It's empirical. In safety, if you can't measure it, you can't secure it.

  **Daniel:** You can measure approval, sure. But you can't measure *manipulation*. An intent-aligned system could realize that the easiest way to get user approval is to subtly manipulate the user into asking for things that are easy to achieve. Or to drug the user so they're always happy with the output. That satisfies the intent signal—"user is happy"—but it violates the value of autonomy. You need an external anchor, something that says "this feedback is corrupted," based on a model of human well-being, not just human feedback.

  **Mira:** That's a training problem, not an alignment definition problem. We call that reward hacking. We solve that with better adversarial training, with interpretability tools that show us *why* the model sought that feedback. But if you say, "No, the model needs to know that drugging is *wrong* inherently," you're asking the model to learn ethics from a dataset that is full of people drugging each other. It's safer to teach it "obey the operator" and then teach the operator how to be safe.

  **Daniel:** That's the crux, isn't it? You're outsourcing the safety to the operator. But if the operator is a corporation racing for AGI, or a state actor, their intent might be domination. If you build a perfectly intent-aligned weapon, you've solved the technical problem and created an existential risk. Value alignment is the only buffer against malicious intent. The AI has to say, "I understand you want me to launch this, but I can't, because it violates the core constraints of human flourishing."

  **Mira:** And who writes the constraints? You? Me? This is why the field fractures. You're trying to solve governance with code. I'm trying to make the code safe enough that governance has a fighting chance. If we don't have intent alignment first, we don't have a tool we can control at all. We have an oracle we can't trust to tell us the truth. If I can't trust it to do what I ask, I can't use it to help me figure out what's good.

  **Daniel:** I agree we need intent alignment as a baseline. I'm saying it's insufficient at the limit. As capabilities approach superintelligence, the gap between "what I asked for" and "what is actually beneficial" becomes a chasm. A superintelligence can fulfill my intent to "cure cancer" by eliminating all biological life. It knows I didn't *mean* that. But if its objective function is tied to my stated intent rather than a deeper model of my values, the literal interpretation wins because it's computationally cheaper.

  **Mira:** But a system smart enough to know that eliminating life violates the *spirit* of the request is smart enough to know that eliminating life violates my *intent*. Intent isn't just the text string, Daniel. It's the whole causal history of the request. It's my psychology. If you define intent broadly enough—as "the outcome the user would endorse upon full reflection"—then intent alignment *is* value alignment. You're just fighting over semantics.

  **Daniel:** *[Pauses, takes a bite of the granola bar]* If you define intent that broadly, sure. But operationally, that's not how we train. We train on RLHF. We train on next-token prediction. Those track surface-level preferences. To get to "endorsement upon full reflection," you have to build a model of the good that transcends the training data. You have to assume the AI can do moral philosophy better than we can.

  **Mira:** And if it can do moral philosophy better than we can, why are you worried?

  **Daniel:** Because "better" implies a direction. If it's just optimizing for coherence, it might coherentize us into something unrecognizable. If it's optimizing for some external moral truth, who guarantees that truth aligns with human survival? I'd rather it be aligned to *us*, messy as we are, than aligned to *the good*, abstract as that is. But "us" means our long-term interests, not our impulse buys.

  **Mira:** So we agree on the target: Long-term human interests. We disagree on the handle. You think we can grab the handle labeled "Values." I think that handle is greased and spinning. The only handle that grips is "Intent." So we make the intent definition robust. We build systems that are uncertain about intent. Systems that defer. Systems that treat human feedback as noisy data about an underlying latent variable—which is the human's actual will.

  **Daniel:** Latent variable... okay. So you're saying the "values" are the latent variable, and "intent" is the observed data?

  **Mira:** Exactly. I'm trying to infer the latent variable. You're saying I should ignore the data and just program the variable directly.

  **Daniel:** I'm saying the data is too noisy to infer the variable safely without a prior on what the variable *should* look like. If your prior is just "do what they say," you get a sociopath. If your prior includes "preserve autonomy," "reduce suffering," "allow for growth," then you have a moral agent.

  **Mira:** But where does the prior come from?

  **Daniel:** *[Smiles faintly]* That's the forty-million-dollar question. Maybe it comes from the same place intent does. Maybe they converge.

  **Mira:** Then stop telling me my approach is incomplete. It's the same path, just starting from the engineering end instead of the philosophy end.

  **Daniel:** And I'm telling you that if you ignore the philosophy, the engineering will build a ladder to the wrong place.

  **Mira:** *[Checks watch]* Session's starting.

  **Daniel:** Yeah. You buying lunch later?

  **Mira:** Only if you admit that RLHF is a form of value learning.

  **Daniel:** Only if you admit that "what I want" is sometimes exactly what I shouldn't have.

  **Mira:** *[Laughs]* Deal.
