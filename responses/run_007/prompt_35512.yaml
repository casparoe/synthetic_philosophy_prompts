      *   *The "Reference Class" Problem:* Who counts as a trading partner?
      *   *The "Normative Status" Problem:* Is this actually *rationality* or just a specific preference structure?

  5.  **Step 3: Ranking and Refining Defeaters:**
      *   *Lethal:* Logical incoherence, Dutch Books, self-defeating policies.
      *   *Severe:* Acausal Blackmail (makes the agent exploitable), Pascal's Mugging (makes the agent action-paralyzed).
      *   *Moderate:* Reference class ambiguity (makes the theory vague), Computational intractability (makes it impractical).
      *   *Survivable:* Counter-intuitive results (e.g., cooperating with a rock if it "computes" you).

      *Refinement on "Lethal":* The strongest argument against FDT/TDT is usually that it violates the *Dominance Principle* in a way that feels like magic. But the proponents accept that. A better lethal blow is if the theory is *unstable* under reflection (e.g., an FDT agent would self-modify to CDT).
      *Refinement on "Blackmail":* This is the big one. If AT works, *threats* work too. If I know you are an acausal trader, I can threaten to destroy value unless you send me resources. If you pay, you encourage blackmail. If you don't, you lose. This is the "Acausal Extortion" problem.

  6.  **Step 4: Addressing Falsifiability/Insulation:**
      *   Decision theory is normative, not empirical. You can't "falsify" it with a physics experiment.
