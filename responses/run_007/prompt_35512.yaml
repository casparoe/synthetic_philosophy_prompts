      *   *Check:* Did I address the "unfalsifiable" concern? Yes, by distinguishing empirical falsification from normative coherence (Dutch Books).
      *   *Nuance:* Make sure to distinguish between TDT (Yudkowsky) and FDT (MacAskill et al.), though they share the AT core. FDT is the more rigorous modern formulation.
