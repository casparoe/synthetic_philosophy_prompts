  3.  **Step 1: Clarify the Commitments of Acausal Trade (AT):**
      *   What *is* AT really? It's not magic. It's based on logical correlation.
      *   Core Commitment 1: **Logical Subjunctivity.** My decision *is* the output of a computation. If you run the same computation (or a sufficiently similar one), our outputs are logically linked, even without causal signal.
      *   Core Commitment 2: **Updatelessness.** You must decide on a policy *before* knowing specific indexical facts that might tempt you to defect (e.g., "I am the one who moves first"). This is crucial for FDT/TDT.
      *   Core Commitment 3: **Computational Isomorphism.** The agents must share enough source code/structure for the logical link to hold.
      *   Core Commitment 4: **Normative Realism (Implicit).** There is a "correct" decision procedure that maximizes utility across logical possibilities, not just causal ones.

  4.  **Step 2: Brainstorming Defeaters (The "What Could Go Wrong" List):**
      *   *The "Many Worlds" Problem:* If I cooperate with a copy, do I care about *all* copies equally? What if there are more defectors than cooperators?
      *   *The "Blackmail" Problem:* Acausal trade opens the door to acausal blackmail (Parfit's Hitchhiker on steroids).
      *   *The "Prior" Problem:* How do we establish the correlation without a shared prior?
      *   *The "Computational Complexity" Problem:* Is it actually computable? (User said skip "imperfect simulation," but *intractability* is different).
