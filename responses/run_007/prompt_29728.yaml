      *   *Key Insight:* The debate forces you to define what the forum *is*. Is it a home (Devlin) or a park (Hart)?

      *(Refining the "Loud Part" aspect)*: Devlin argues the "man on the Clapham omnibus" feels disgust. In a forum, the "loud part" might not be the majority. This weakens the Devlin argument unless that loud part represents the core identity. Hart would warn against the "tyranny of the vocal minority."

