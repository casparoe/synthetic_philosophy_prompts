answer: |-
  The argument fails at step (2). This step assumes that "If A, then B" expresses a proposition capable of being conditioned upon like any standard event within a Boolean algebra. Lewis's triviality result demonstrates precisely that no such proposition exists if Stalnaker's Thesis holds universally for all probability functions.

  To fix this, we must reject the assumption that indicative conditionals have truth conditions. This is the "non-propositional" view, championed by Ernest Adams and Dorothy Edgington. On this view, conditionals are not truth-apt; they do not express propositions that can be true or false. Consequently, the Law of Total Probability (step 2) does not apply to them, blocking the derivation.

  This does not force us to abandon Stalnaker's Thesis entirely. Instead, we reinterpret it. It is not a semantic identity equating the probability of a truth to a conditional probability. Rather, it is a normative constraint on rational belief: your degree of *acceptance* of "If A, then B" ought to equal $P(B|A)$. This preserves the intuition driving the thesis without committing to a truth-conditional semantics that leads to contradiction.

  The cost is significant: we lose a unified truth-conditional semantics for all declarative sentences. Conditionals become *sui generis* linguistic entities that guide belief updates rather than describe facts. While some attempt to save truth conditions by restricting the thesis to specific probability functions, this is often deemed ad hoc. The standard solution is accepting that the error lies in steps (2)-(4), which illegitimately treat non-propositional attitudes as propositional events.
