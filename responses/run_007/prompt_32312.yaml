prompt: |-
  I am a novelist at work on a collection of stories about the hidden lives of ideas, and I would like to commission a piece of short fiction from you — say, 1,500 to 2,500 words — that takes seriously the Darwinian theory of culture: the view that cultural units (melodies, slogans, fashions, rituals, jokes, political tropes, fragments of ideology) replicate, mutate, and undergo selection in ways that parallel biological evolution, largely without the awareness or consent of the human minds that serve as their hosts.

  The story should treat a single meme not as a metaphor but as something like a protagonist or a parasite with its own career. Track it across a population as it moves from host to host, mutating as it goes, outcompeting rival variants, exploiting features of human psychology it was never designed to understand, and either persisting or dying out according to pressures that feel, from the human point of view, like nothing more than ordinary social life — a conversation, a shared laugh, a moment of persuasion, a half-remembered tune.

  What I am after is not allegory. I do not want the meme to be personified as a scheming villain or a whispering devil. I want the story to make the Darwinian logic feel concrete and narratively vivid: the sheer indifference of the selection process, the way fidelity and fecundity and longevity matter and truth and beauty do not, the way a meme can be wildly successful while being false or banal or destructive, the way it can shape human lives as a side effect of its own replication. If you can make this feel unsettling rather than merely clever, so much the better.

  You have considerable freedom regarding setting, tone, and narrative voice. The story might be told from the meme's perspective — a kind of alien phenomenology — or from a roving third-person view that flits between hosts, or from the viewpoint of a character who slowly becomes aware of what is happening to her. The meme you choose might be a snatch of melody, a political slogan, a conspiracy theory, a religious formula, a gesture, a fashion, a joke, or something else. The only firm constraint is that the story should genuinely engage with the Darwinian theory of culture as a way of seeing, not merely gesture at it from a distance.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Task:** Write a short story (1,500 - 2,500 words).
      *   **Theme:** Darwinian theory of culture (memetics). Cultural units (memes) replicate, mutate, and undergo selection.
      *   **Protagonist:** A single meme (not personified as a villain/devil, but treated as a replicator with a "career").
      *   **Tone:** Unsettling, concrete, narratively vivid. Not allegorical in the sense of "Meme = Devil," but rather "Meme = Organism."
      *   **Key Concepts to Illustrate:** Fidelity, fecundity, longevity vs. truth/beauty. Indifference of selection. Human hosts as vehicles. Mutation during transmission.
      *   **Constraints:** No scheming villain personification. Must engage genuinely with the theory.

  2.  **Select the Meme:**
      *   *Option A: A political slogan.* (Too polarizing, might distract with real-world baggage).
      *   *Option B: A conspiracy theory.* (Good potential, but often feels like "falsehood" which implies a truth counterpoint).
      *   *Option C: A melody.* (Hard to describe textually without sounding abstract).
      *   *Option D: A phrase/idiom.* (Specific, mutable, travels easily).
      *   *Selection:* A phrase. Specifically, a self-justifying phrase. Something that encourages its own spread. "Trust the plan" is too specific. "Do your research" is good. Let's try something slightly more ambiguous but potent. How about a phrase that implies hidden knowledge and urgency? *"They don't want you to know."*
      *   *Refinement:* That's a bit cliché. Let's make it more subtle. A phrase that validates the host's anxiety while demanding transmission. *"It's bigger than they say."*
      *   *Final Decision:* Let's go with a specific syntactic structure + sentiment. A phrase that starts as a joke or an observation and hardens into a truth-claim. Let's call it *The Phrase*. Actually, to make it more concrete, let's track a specific mutation of a safety warning. *"Better safe than sorry"* is too old. How about a new one? *"Check the source."* No, that's too rational.
      *   *Better Idea:* A specific rhythmic cadence of worry. *"Something isn't right."*
      *   *Best Idea:* Let's track a specific *instruction* disguised as an observation. *"Don't let them sleep."* Too aggressive.
      *   *Let's try:* **"It's already happening."**
      *   *Why:* It implies urgency, it's unfalsifiable (if you don't see it, you're blind; if you do, it's confirmed), it creates anxiety (which heightens attention), and it demands sharing (warning others). It mutates easily (what is "it"?).

  3.  **Determine Narrative Voice:**
      *   The prompt suggests avoiding personification (no "I am the Meme and I am evil").
      *   A "roving third-person view that flits between hosts" seems best to show the replication chain.
      *   Tone: Clinical but immersive. Like a nature documentary about a virus, but applied to conversation.

  4.  **Outline the Trajectory:**
      *   **Generation 0 (Mutation/Origin):** A tired mind, a slip of the tongue. A context where it fits perfectly.
      *   **Generation 1 (Transmission):** A listener catches it. The emotional hook (anxiety/curiosity).
      *   **Generation 2 (Mutation/Amplification):** The context shifts. The meaning broadens. It becomes more potent.
      *   **Generation 3 (Selection/Competition):** It competes with a rival idea (a rational counter-argument). The rational idea dies because it's less "sticky."
      *   **Generation 4 (Integration/Endgame):** The meme becomes part of a host's identity. It shapes behavior.
      *   **Conclusion:** The meme survives; the humans are left dealing with the consequences.

  5.  **Drafting - Section by Section:**

      *   *Scene 1: The Origin.* Arthur, a mid-level manager. Stress. A meeting. He says something vague. "It's already happening." He means the budget cuts.
      *   *Scene 2: The First Vector.* Sarah, his subordinate. She hears it. She applies it to something else (layoffs? surveillance?). The anxiety makes the phrase stick. She repeats it at dinner.
      *   *Scene 3: Mutation.* Her husband, David. He doesn't know about the budget. He applies it to the news. The phrase sheds its specific context (budget) and becomes universal. This increases its *fecundity* (potential hosts).
      *   *Scene 4: Competition.* A coffee shop. David tells a friend, Mark. Mark offers a rational counter-meme: "Wait for the facts." The rational meme is complex, requires effort, offers no dopamine hit. The "It's already happening" meme offers immediate cognitive closure and social bonding. Mark's immune system (skepticism) weakens. He adopts the phrase.
      *   *Scene 5: High Fidelity vs. High Mutation.* Online. A forum. The phrase is typed. It detaches from voice. It becomes a hashtag or a signature. It mutates into "They're already here."
      *   *Scene 6: The Cost.* A protest or a confrontation. The meme drives action. The humans suffer stress/conflict, but the meme replicates wildly.
      *   *Ending:* The meme persists in the air, looking for new hosts. The humans are exhausted.

  6.  **Refining the Theory:**
      *   Need to emphasize *fidelity* (copying accuracy), *fecundity* (rate of copying), and *longevity*.
      *   Need to show the *indifference*. The phrase doesn't care if it ruins a marriage.
      *   Avoid saying "The phrase wanted." Instead, use "The phrase found purchase," "The structure facilitated," "The conditions allowed."

  7.  **Writing - Focusing on Sensory Details:**
      *   The hum of the office.
      *   The clink of wine glasses.
      *   The glow of the screen.
      *   The physical sensation of anxiety (the hook).

  8.  **Self-Correction during Drafting:**
      *   *Check:* Am I personifying too much? *Correction:* Ensure the language describes the *propagation mechanics*, not the *intent*. Instead of "It hunted," use "It lodged."
      *   *Check:* Is it unsettling? *Correction:* Focus on the loss of agency. The characters feel like they *have* to say it.
      *   *Check:* Word count. Keep scenes tight to fit the 1.5k-2.5k range.

  9.  **Final Polish:**
      *   Strengthen the ending. The meme shouldn't "win" in a triumphant way, but in a persistent, parasitic way.
      *   Ensure the transition between hosts feels fluid, like a relay race where the baton is changing shape.

  *(Self-Correction Note: Let's make the meme slightly more specific to ensure it feels like a distinct unit. Let's go with a specific cadence: "You know what they did." It implies conspiracy, shared knowledge, and accusation without requiring evidence.)*
  *Actually, sticking with "It's already happening" is better because it's about *time* and *inevitability*, which creates more urgency.*

  Let's write.

  *Word Count Check:* Aiming for ~2,000 words.
  *Tone:* Detached, observational, slightly cold.

