answer: |-
  # M&M Omission Causality Decision Procedure

  **Purpose:** To determine whether a failure to act (omission) is a causal factor in patient harm or death.
  **Time:** 5–10 minutes per case.
  **Users:** Clinicians without philosophical training.

  ### Philosophical Preamble (Read Once)
  In law and medicine, we treat "doing nothing" as a cause only under specific conditions. Philosophically, an omission is not an event; it is the absence of an event. Therefore, we cannot say an omission caused harm unless three conditions are met:
  1.  **Normativity:** There was a specific duty to act (distinguishing a nurse ignoring a patient from a passerby ignoring a stranger).
  2.  **Counterfactual Dependence:** If the action *had* occurred, the harm would likely have been avoided (the "But-For" test).
  3.  **Capability:** The agent was able to act (you cannot be causal for failing to do the impossible).

  This checklist enforces these distinctions to prevent **Hindsight Bias** (assuming the outcome was inevitable) and **Over-attribution** (blaming clinicians for outcomes they could not have changed).

  ---

  ### The Procedure

  **Step 1: The Factual Omission**
  *   **Question:** Is it a matter of objective record that the specific action *did not occur*?
  *   **Sufficient Yes:** Documentation, logs, or unanimous witness testimony confirm the action was not performed (e.g., no lab order entered, no vitals recorded).
  *   **Logic:**
      *   **NO:** → **Not a Cause.** (The alleged omission did not happen; investigate commission or disease progression).
      *   **YES:** → Proceed to Step 2.

  **Step 2: The Normative Duty**
  *   **Question:** At that specific moment, was there an established obligation (policy, protocol, or accepted standard of care) requiring *this* actor to perform *this* action for *this* patient?
  *   **Sufficient Yes:** A written protocol exists, or the action is universally recognized as standard practice for the clinical presentation (e.g., "Abnormal K+ requires recheck").
  *   **Philosophical Distinction:** This preserves the **Normative Constraint**. Without duty, an omission is merely a background condition, not a cause.
  *   **Logic:**
      *   **NO:** → **Not a Cause.** (Failure to act where no duty exists is not causal in M&M review, even if outcome was bad).
      *   **YES:** → Proceed to Step 3.

  **Step 3: The Capability Constraint**
  *   **Question:** Was it physically and structurally possible for the actor to perform the action at that time?
  *   **Sufficient Yes:** The actor had the authority, tools, time, and physical capacity to act (e.g., the lab was open, the physician was on-site).
  *   **Philosophical Distinction:** This preserves **"Ought Implies Can."** You cannot be causally responsible for failing to do the impossible.
  *   **Logic:**
      *   **NO:** → **Not a Cause.** (System barrier prevented action; classify as System Error, not Individual Causation).
      *   **YES:** → Proceed to Step 4.

  **Step 4: The Counterfactual (But-For) Test**
  *   **Question:** If the action *had* been taken, is it **more likely than not (>50%)** that the specific harm/death would have been avoided?
  *   **Sufficient Yes:** Clinical evidence suggests the intervention is highly effective for this condition (e.g., defibrillation for V-Fib).
  *   **Philosophical Distinction:** This preserves **Probabilistic But-For Causation**. We require preponderance of evidence, not mere possibility.
  *   **Logic:**
      *   **NO (Clearly <50%):** → Proceed to Step 5.
      *   **NO (Uncertain/Debatable):** → **A Human Judgment is Required.** (Escalate to Senior Panel/CMO).
      *   **YES:** → **Causal Omission.** (Proceed to Incident Report/Remediation).

  **Step 5: The Loss of Chance Threshold**
  *   **Question:** Although survival was not >50% likely, did the omission eliminate a *substantial* chance of survival (e.g., reduced survival from 40% to 0%)?
  *   **Sufficient Yes:** Consensus that the intervention offers a meaningful, non-negligible benefit despite low overall odds.
  *   **Philosophical Distinction:** This addresses **Probabilistic Causation**. Philosophy disputes whether reducing a chance is "causing" the death. Medicine often treats it as such.
  *   **Logic:**
      *   **NO:** → **Not a Cause.** (The disease caused the death; the omission was clinically negligible).
      *   **YES:** → **A Human Judgment is Required.** (Committee must vote on whether "Loss of Chance" qualifies as reportable causation in this context).

  ---

  ### Application to Cases

  #### Case 1: The Nurse and the Potassium
  *   **Facts:** Nurse fails to recheck abnormal K+. Patient arrests.
  *   **Step 1 (Fact):** Yes, no recheck recorded.
  *   **Step 2 (Duty):** Yes, protocol mandates recheck for abnormal K+.
  *   **Step 3 (Capability):** Yes, lab available, nurse on duty.
  *   **Step 4 (Counterfactual):** Yes. Untreated hyperkalemia is highly lethal; treatment is highly effective. Probability of avoiding arrest with treatment is >50%.
  *   **Result:** **Causal Omission.**
  *   **Committee Reaction:** Expected. Clear line from error to harm.

  #### Case 2: The Low-Yield Screening
  *   **Facts:** Physician does not offer screening test. Cancer found post-mortem. Test has "modest probability" of detection (e.g., 20% sensitivity).
  *   **Step 1 (Fact):** Yes, test not offered.
  *   **Step 2 (Duty):** Yes/Debatable. Assume guidelines suggest "consider" but not "mandate." Let's grant Yes for the sake of the causal link.
  *   **Step 3 (Capability):** Yes.
  *   **Step 4 (Counterfactual):** No. If the test only detects 20% of cases, it is *not* "more likely than not" (>50%) that the test would have found it.
  *   **Step 5 (Loss of Chance):** Yes. It reduced chance from 20% to 0%.
  *   **Result:** **A Human Judgment is Required.**
  *   **Committee Reaction:** Frustration. Clinicians want to flag "Missed Cancer." The procedure forces them to admit this is not strict causation, but a policy decision on "Loss of Chance."

  #### Case 3: The Night Shift and the Vitals
  *   **Facts:** Patient deteriorates slowly. Night shift does not monitor vitals at the interval that *would* have caught it. **No policy required monitoring at that interval.**
  *   **Step 1 (Fact):** Yes, vitals not taken.
  *   **Step 2 (Duty):** **No.** No policy existed; standard of care for that stability level did not mandate that frequency.
  *   **Result:** **Not a Cause.**
  *   **Committee Reaction:** **Unpopular.** The patient died under their watch. The committee will feel this absolves the night shift too easily. However, philosophically, without a duty, the omission is not a deviation from the expected course, and thus not a *cause* attributable to the staff. It identifies a **System Gap** (need for new policy) rather than Individual Causation.

  ---

  ### What This Procedure Cannot Settle

  1.  **Systemic Culture vs. Individual Blame:** The procedure isolates individual causal omissions. It cannot determine if a "culture of silence" caused the omission. That requires qualitative review, not a checklist.
  2.  **The "Loss of Chance" Moral Weight:** Step 5 kicks the hard philosophical problem (is reducing a 20% chance "killing"?) to a human vote. The checklist cannot solve the metaphysics of probabilistic causation.
  3.  **Hindsight Bias in Duty:** Step 2 relies on the committee agreeing on what the "Standard of Care" was *at the time*, not what seems obvious *after the death*. The checklist cannot prevent the committee from inventing a duty that didn't exist.

  ---

  ### Structured Summary Table

  | Step | Question to ask | What counts as a sufficient yes | Where a no or yes sends the user | Judgment call? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Is it objectively recorded that the action *did not occur*? | Documentation or unanimous witness confirmation of non-performance. | **No:** Ends in "Not a Cause."<br>**Yes:** Go to Step 2. | No |
  | **2** | Was there an established obligation (policy/standard) to act *at that moment*? | Existence of protocol or universal consensus on standard of care for this presentation. | **No:** Ends in "Not a Cause."<br>**Yes:** Go to Step 3. | No |
  | **3** | Was it physically/structurally possible for the actor to perform the action? | Actor had tools, authority, time, and capacity. | **No:** Ends in "Not a Cause" (Classify as System Barrier).<br>**Yes:** Go to Step 4. | No |
  | **4** | If acted, is it **>50% likely** the harm would have been avoided? | Clinical consensus that intervention is highly effective for this specific pathology. | **Yes:** Ends in "Causal Omission."<br>**No/Uncertain:** Go to Step 5. | No (Threshold is mathematical) |
  | **5** | Did the omission eliminate a *substantial* chance of survival (e.g., >10-20%)? | Consensus that the lost opportunity was clinically meaningful, despite low overall odds. | **No:** Ends in "Not a Cause."<br>**Yes:** Ends in "A Human Judgment is Required." | **Yes** (Committee must vote on policy) |
