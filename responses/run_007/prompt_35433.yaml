answer: |-
  Here is the map of desiderata for a theory of action under moral uncertainty (metanormative decision theory). I have categorized them by function, specified the case motivating them, and flagged their status.

  ### I. Scope and Input Desiderata
  *What the theory must be able to ingest and process.*

  **1. The Common Currency Requirement (Intertheoretic Comparability)**
  *   **The Case:** You are 50% credence in Utilitarianism (maximize happiness) and 50% in Prioritarianism (maximize happiness, but weight the worse off). Both share a "currency" (welfare), but scale it differently. Or, 50% Utilitarianism vs. 50% Kantianism (duties vs. welfare).
  *   **The Requirement:** The theory must specify how to compare the *magnitude* of value or choiceworthiness across different moral theories. It must either provide a normalization scale (e.g., variance normalization, range normalization) or explain how to make decisions without cardinal comparison.
  *   **Status:** **Non-negotiable.** A theory cannot output a verdict without a method to weigh conflicting inputs. Even theories that deny comparability must explain how they decide without it (e.g., by lexical priority).
  *   **Decision Theory Link:** Explicitly engages with the **measurement scale requirement** (ordinal vs. cardinal vs. ratio).

  **2. The Empirical/Moral Distinction**
  *   **The Case:** *Empirical:* You are 90% sure the box contains money (Newcomb/Evidence). *Moral:* You are 90% sure keeping promises is right.
  *   **The Requirement:** The theory must distinguish between uncertainty about the *state of the world* (empirical) and uncertainty about the *evaluation function* (moral). It cannot simply treat moral theories as empirical hypotheses about "moral facts" existing in the world, because moral theories define the value of the outcomes, not just the probability of the outcomes.
  *   **Status:** **Non-negotiable.** Collapsing this leads to category errors (e.g., trying to "observe" moral facts to update credences in the same way you observe rain).
  *   **Distinction Protected:** Uncertainty between moral theories vs. uncertainty about non-moral facts.

  **3. The Fanaticism Constraint**
  *   **The Case:** You have 99.9% credence in Common Sense Morality (save a child nearby) and 0.1% credence in a "Fanatical" theory (save the entire universe from torture, no matter the cost).
  *   **The Requirement:** The theory must declare whether a tiny credence in a theory with infinite or astronomical stakes can override high credence in a theory with modest stakes.
  *   **Status:** **Camp Preference.**
      *   *EVM Camp:* Accepts fanaticism as a bullet to bite (Expected Value is linear).
      *   *Risk-Weighted/Threshold Camp:* Rejects it (requires a threshold of credence or risk-weighting).
      *   *Why:* This is the primary fracture line. A theory must pick a side; it cannot be neutral.

  ### II. Formal Constraints
  *Rules from decision theory the account must respect or reject.*

  **4. The Dominance Principle**
  *   **The Case:** Theory A says Act X is better than Act Y. Theory B says Act X is better than Act Y. You have credence only in A and B.
  *   **The Requirement:** The theory must recommend Act X. If every theory you have non-zero credence in agrees on the ranking of two options, the metanormative theory should respect that ranking.
  *   **Status:** **Non-negotiable (with caveats).** Violating this makes the theory alienating; it tells you to act against every moral view you hold.
  *   **Decision Theory Link:** Respects **Stochastic Dominance**.

  **5. Expected Utility Reasoning (Linearity)**
  *   **The Case:** You are choosing between a sure thing and a gamble under moral uncertainty.
  *   **The Requirement:** The theory must state whether the "metanormative value" of an action is the linear expectation of its "first-order choiceworthiness."
  *   **Status:** **Camp Preference.**
      *   *MEC (Maximizing Expected Choiceworthiness):* Accepts linearity.
      *   *My Favorite Theory / Bargaining:* Rejects linearity (MFT ignores probability; Bargaining uses non-linear negotiation).
      *   *Why:* Accepting this leads to the Fanaticism problem (see #3). Rejecting it requires a new formal structure.

  ### III. Structural and Conceptual Distinctions
  *Philosophical coherence requirements.*

  **6. Choiceworthiness vs. Rightness**
  *   **The Case:** You act on a theory that turns out to be false, but you followed the best procedure for uncertainty.
  *   **The Requirement:** The theory must distinguish between the *objectively right action* (what the true moral theory demands) and the *subjectively choiceworthy action* (what is rational to do given your uncertainty).
  *   **Status:** **Non-negotiable.** Without this, moral uncertainty implies moral ignorance is always blameworthy, which contradicts the purpose of the theory.
  *   **Distinction Protected:** Choiceworthiness (relative to agent's state) vs. Rightness (relative to truth).

  **7. The Regress Stopper (Higher-Order Uncertainty)**
  *   **The Case:** You are unsure which moral theory is right (1st order), but also unsure whether to maximize expected choiceworthiness or follow My Favorite Theory (2nd order).
  *   **The Requirement:** The theory must explain how to handle uncertainty about *which metanormative theory* is correct. It cannot simply assume the agent knows the correct decision rule.
  *   **Status:** **Non-negotiable.** If a theory cannot handle uncertainty about itself, it is incomplete. (Note: Many papers ignore this; a robust desideratum list demands it).
  *   **Why:** Without this, the theory is dogmatic about its own methodology.

  **8. Agency vs. Deferral**
  *   **The Case:** You are unsure about abortion. Do you calculate the expected choiceworthiness yourself, or do you defer to the Pope/Philosopher King?
  *   **The Requirement:** The theory must clarify if it is a guide for *your* reasoning or a rule for *deferring* to expert consensus.
  *   **Status:** **Non-negotiable.** Most theories aim to guide the agent's own reasoning. Collapsing this turns moral uncertainty into epistemic deference.
  *   **Distinction Protected:** Acting under moral uncertainty vs. deferring to a moral expert.

  ### IV. The Impossible Conflicts
  *Pairs of desiderata that cannot be jointly satisfied.*

  **1. Comparability + Linearity + Anti-Fanaticism**
  *   **The Conflict:** If you can compare value across theories (Comparability) and you sum them linearly (Linearity/EVM), you **must** accept Fanaticism (tiny credence in infinite value dominates).
  *   **The Trade-off:** To avoid fanaticism, you must either deny intertheoretic comparisons (make theories incommensurable) or reject linear expectation (use risk-weighting or thresholds). You cannot have all three.

  **2. Dominance + My Favorite Theory (MFT)**
  *   **The Conflict:** MFT says "Follow the theory you are most confident in." If you are 51% Utilitarian, 49% Deontologist, MFT says "Maximize Utility." But if the Deontological constraint is absolute, the Utilitarian option might violate a duty that the Deontological theory says is *worse* than any utility gain.
  *   **The Trade-off:** MFT often violates Dominance in mixed cases where the minority theory assigns negative infinity (or lexical priority) to an action the majority theory prefers. EVM respects Dominance but demands comparability.

  **3. Formal Precision + Parliamentary Intuition**
  *   **The Conflict:** "Parliamentary" models (theories bargain like legislators) handle incommensurability intuitively. However, they struggle to define the "bargaining solution" formally without smuggling in a common currency (utility) to measure the "deal."
  *   **The Trade-off:** You can have a formally precise model (EVM) or an intuitive bargaining model, but the bargaining model usually collapses into EVM when formalized, or remains vague.

  ---

  ### Scorecard of Main Candidates

  | Candidate | Comparability | Dominance | Fanaticism | Regress Handling | Primary Failure |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **MEC** (Maximizing Expected Choiceworthiness) | **Requires it** (uses normalization) | **Respects** | **Accepts** (Vulnerable) | Poor (Assumes EVM is true) | Fanaticism; relies on controversial normalization scales. |
  | **MFT** (My Favorite Theory) | **Denies it** (Only looks at top theory) | **Violates** (Ignores minority vetoes) | **Avoids** | Poor (Dogmatic about method) | Ignores the value of uncertainty; violates dominance in constraint cases. |
  | **Parliamentary** (Bargaining/Negotiation) | **Bypasses it** (Treats theories as agents) | **Mixed** (Depends on bargaining rules) | **Avoids** (Veto power possible) | Poor (Who sets the bargaining rules?) | Informal; often collapses into MEC when formalized. |
  | **Risk-Weighted EVM** | **Requires it** | **Respects** (Modified) | **Avoids** (Down-weights tails) | Poor | Complex; requires choosing a risk-attitude parameter arbitrarily. |

  **Summary:**
  *   **MEC** is the only one that satisfies **Dominance** and **Linearity**, but pays the price in **Fanaticism** and **Comparability** complexity.
  *   **MFT** avoids **Comparability** and **Fanaticism**, but pays the price in **Dominance** violations.
  *   **Parliamentary** models attempt to solve **Comparability** intuitively but lack **Formal Precision**.
  *   **Regress** is universally unsolved; all candidates assume their own metanormative correctness.
