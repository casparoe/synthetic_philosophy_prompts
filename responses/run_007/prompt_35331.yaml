prompt: |-
  I've been teaching virtue ethics for years and I've never been moved by the situationist critique. My view is that the whole thing rests on a misunderstanding: virtue ethics doesn't require the kind of rigid cross-situational consistency that the situationists set out to debunk. An honest person isn't someone who behaves identically in every honesty-relevant situation — that would be bizarre. The virtues are more like practical skills that involve sensitivity to context, so the fact that people's behavior shifts across situations (the phone booth dime experiment, the Good Samaritan seminary study, etc.) doesn't touch the view I actually hold.

  But I'm aware I might be too comfortable here. What would actually count against my position? I want a map of the evidence and arguments that should move me, sorted by how decisive they'd be. Are there versions of the situationist critique that target my kind of view specifically, rather than the straw man? Are there empirical results that would be awkward even for a context-sensitive virtue ethics? And honestly: have I qualified the view into unfalsifiability, and if so, is that a problem for a view of this kind — or is that just how normative theories work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Background:** Experienced teacher of virtue ethics (VE).
      *   **Current Stance:** Unmoved by the situationist critique (Doris, Harman, etc.).
      *   **Reasoning:** Believes situationists attack a straw man (rigid cross-situational consistency). VE is about context-sensitive practical skills (phronesis), not robotic consistency.
      *   **Goal:** Wants to be challenged. Needs a "map of evidence and arguments" that *should* move them, sorted by decisiveness.
      *   **Specific Questions:**
          *   Are there versions of the critique targeting *this* specific view (context-sensitive VE)?
          *   Are there empirical results awkward even for context-sensitive VE?
          *   Has the view been qualified into unfalsifiability? Is that a problem?

  2.  **Deconstruct the Situationist Critique (Standard vs. Sophisticated):**
      *   *Standard Critique:* Situationists argue that empirical psychology shows behavior is driven by situational factors rather than stable character traits. Therefore, global traits (virtues) don't exist.
      *   *User's Defense:* Virtues aren't global traits in the rigid sense; they are sensitive to context.
      *   *The Gap:* The user is likely thinking of Aristotelian *phronesis*. The situationists often target "global traits" (consistent across *all* situations). The user says VE only requires "local traits" or context-sensitive dispositions.
      *   *The Counter-Challenge:* Does the empirical data show that even *local* stability is lacking? Or that the "sensitivity to context" is actually just rationalization of inconsistency?

  3.  **Brainstorming Counter-Arguments (The "Map"):**

      *   *Level 1: The "Fragmentation" Argument (Moderate Threat).* Even if we allow context-sensitivity, the data suggests fragmentation is deeper than VE allows. It's not just "different contexts require different responses," it's "morally irrelevant factors dictate responses."
      *   *Level 2: The "Rationalization" Argument (Strong Threat).* VE claims agents act *for reasons* based on perception of the good. Situationists argue the "context sensitivity" is actually unconscious bias or environmental nudging, not practical wisdom.
      *   *Level 3: The "Trait Existence" Argument (Strong Threat).* If the correlation between behavior in Situation A and Situation B is near zero, does the "trait" do any explanatory work? If VE becomes purely about individual acts without predictive power, is it still a trait theory?
      *   *Level 4: The "Unfalsifiability" Charge (Meta-Ethical Threat).* If every counter-example is explained away as "lack of phronesis" or "wrong context," does the theory lose empirical traction?

  4.  **Developing the "Decisiveness" Sorting:**
      *   *Low Decisiveness:* Arguments that just restate the straw man (rigid consistency). The user is right to dismiss these.
      *   *Medium Decisiveness:* Arguments showing that "context sensitivity" is actually "moral noise." (e.g., finding a dime makes you helpful, not because you perceived a need, but because of mood).
      *   *High Decisiveness:* Arguments showing that the *mechanism* of virtue (reason-responsive disposition) is empirically unsupported. If human cognition doesn't work the way VE says it does (integration of affect, cognition, motivation), then VE is psychologically unrealistic.
      *   *Highest Decisiveness:* The "Empty Explanans" problem. If VE can't distinguish between a virtuous person and a lucky person empirically, it loses its normative force.

  5.  **Addressing the "Unfalsifiability" Question:**
      *   This is crucial. Normative theories aren't scientific hypotheses, but they make psychological presuppositions.
      *   If VE says "Virtue exists" and psychology says "Character structures don't exist in that form," there's a clash.
      *   Qualifying too much makes VE trivial. "A virtuous person is one who does the right thing." (Tautology).
      *   Need to distinguish between *normative ideal* (which can be rare) and *psychological possibility* (which must be real).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's intuition (they are right that the standard critique is often a straw man). Acknowledge the sophistication of their position (Aristotelian/Phronetic).
      *   *Section 1: The Refined Situationist Challenge (Local Traits).* Move beyond global traits. Discuss "Local Virtues" (Snow, Kamtekar). The challenge isn't consistency across *all* situations, but consistency across *relevantly similar* situations.
      *   *Section 2: The Mechanism Challenge (The "Why").* This is the strongest point. It's not about *what* they do, but *why*. If the "context sensitivity" is driven by morally irrelevant factors (smell of bread, mood), VE's account of *practical reason* is undermined.
      *   *Section 3: The Predictive/Explanatory Power.* If traits don't predict behavior better than situation, do they exist? VE needs to claim traits explain *something*.
      *   *Section 4: The Unfalsifiability Trap.* Address the user's specific worry. Distinguish between "ideal theory" and "psychological realism." If no one can actually possess the trait, is it a virtue or a fantasy?
      *   *Conclusion:* Summarize the "Map."

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to concede too much to situationism. The user is a VE proponent. The goal is to show *where* they might be vulnerable, not to convert them to situationism.
      *   *Nuance:* Distinguish between "Virtue Ethics as Normative Theory" vs. "Virtue Ethics as Moral Psychology." The situationist critique targets the psychology. The user needs to know where the psychology undermines the normativity.
      *   *Specific Studies:* Mention the "Clean Desk" study, "Bakery Smell," "Phone Booth." But focus on the *interpretation* of these.
      *   *Key Philosophers:* Mention Nancy Snow, Rachana Kamtekar (defenders who refine VE), and maybe Christian Miller (who tries to bridge the gap with "character theory").

  8.  **Final Polish:** Check tone. Respectful, intellectually rigorous, challenging but fair. Ensure the "sorted by decisiveness" requirement is met clearly. (Decided to use a tiered system: Tier 1, Tier 2, Tier 3).

