answer: |-
  This debate is not merely a verbal dispute, nor is it a straightforward substantive disagreement about empirical facts. It is best diagnosed as a **clash of teleological-ontological frameworks**, where epistemology is subordinate to soteriology and metaphysics. The stalemate persists because the schools are not using the same **criteria of individuation** for what constitutes a distinct *pramāṇa*. They agree on the definition of *pramā* (valid cognition) as a veridical awareness of reality, but they disagree on whether the *instrument* causing that awareness is defined by its causal mechanism, its phenomenological feel, or its logical structure.

  Here is the diagnosis, engaging with the specific reduction arguments, followed by an assessment of what constitutes progress.

  ### 1. Concrete Engagement: Why Reduction Fails for the Proponents

  To understand why the debate is stuck, we must look at why the proponents of 4 or 6 *pramāṇas* reject the reductionist accounts of the Buddhists (2) or Naiyāyikas (4).

  **A. *Arthāpatti* (Postulation): The Problem of *Vyāpti* (Pervasion)**
  *   **The Case:** Devadatta is alive but not at home. We conclude he is outside.
  *   **The Reduction (Nyāya/Buddhist):** This is inference (*anumāna*). The major premise is: "If a living person is not at home, they are outside."
  *   **The Mīmāṃsā Objection (Kumārila):** Inference requires a known universal connection (*vyāpti*) between the middle term (not at home) and the major term (outside). We have no such universal. Being "not at home" does not logically entail being "outside" (he could be in a cellar, or dead, though we know he is alive).
  *   **The Irreducibility:** Mīmāṃsā argues this cognition arises from a unique cognitive tension: the conflict between "Devadatta is alive" and "Devadatta is not here." The resolution is not a logical deduction but a **postulation** required to make sense of the conflicting facts. It is a distinct cognitive operation because the *cause* of the knowledge is the removal of cognitive conflict, not the perception of a universal relation.

  **B. *Anupalabdhi* (Non-apprehension): The Ontology of Absence**
  *   **The Case:** Knowing there is no pot on the table.
  *   **The Reduction (Nyāya/Buddhist):** This is perception (*pratyakṣa*). You perceive the bare table. The "absence of the pot" is a conceptual construct imposed on the perceived locus.
  *   **The Mīmāṃsā Objection:** Perception requires a connection between sense organ and object. If the pot is absent, there is no object to connect with. You cannot perceive "nothing."
  *   **The Irreducibility:** For Bhāṭṭa Mīmāṃsā, absence (*abhāva*) is a real ontological category. Therefore, knowing it requires a unique instrument. To reduce it to perception is to confuse the *locus* (the table) with the *object* (the absence). The causal chain is distinct: it is triggered by the *failure* of conditions for perception, not the presence of conditions.

  **C. *Upamāna* (Comparison): The Acquisition of Meaning**
  *   **The Case:** Learning that a *gavaya* (wild ox) is like a cow, and later identifying one in the forest.
  *   **The Reduction (Buddhist):** This is inference based on similarity.
  *   **The Nyāya Objection:** Inference requires prior knowledge of the relation. Here, the learner does not know the *gavaya* exists. They are given a testimony ("a gavaya is like a cow"), see a cow, go to the forest, and match the memory to the perception.
  *   **The Irreducibility:** Nyāya argues this generates knowledge of *name-object relation* (*saṅketa*), which is not produced by inference (which deals with properties) or testimony (which only gave the rule, not the identification). The causal moment of *recognition* based on similarity is a unique cognitive event.

  ### 2. Diagnosis: Teleological-Ontological Framework Dispute

  The debate is deadlocked because the schools are playing different games with the same pieces.

  **1. Divergent Criteria of Individuation**
  The core disagreement is metaphysical.
  *   **The Parsimony Camp (Buddhists/Cārvāka):** They operate with a **Causal-Efficiency Criterion**. A *pramāṇa* is distinct only if it involves a unique causal power (*śakti*). Since inference and perception can explain the causal chain of *upamāna* or *arthāpatti* without positing new entities, positing new *pramāṇas* violates ontological economy (*lāghava*). For Dharmakīrti, only particular moments of existence are real; universals and absences are constructs. Therefore, instruments knowing constructs cannot be fundamental.
  *   **The Phenomenological Camp (Mīmāṃsā/Nyāya):** They operate with a **Phenomenological-Output Criterion**. A *pramāṇa* is distinct if the *experience* of knowing is distinct. The "aha!" moment of *arthāpatti* feels different from the logical grinding of *anumāna*. Furthermore, they are **Realists** about absences, similarities, and Vedic meanings. If the object known is ontologically distinct (e.g., an absence), the instrument must be distinct.

  **2. Epistemology in Service of Soteriology**
  The number of *pramāṇas* is not an abstract tally; it is a gatekeeper for liberation (*mokṣa*) or duty (*dharma*).
  *   **Mīmāṃsā:** Needs *śabda* (testimony) and *arthāpatti* to be irreducible to validate the Veda. If *śabda* reduces to inference, the Veda becomes fallible (since inference can be wrong). If *arthāpatti* reduces, complex ritual obligations (which often rely on postulation) become unstable. Their epistemology is designed to protect the authority of the text.
  *   **Buddhists:** Need to limit *pramāṇas* to perception and inference to prevent reification. Accepting *śabda* as independent validates the Veda (which they reject). Accepting *anupalabdhi* validates the reality of absences (which conflicts with momentariness). Their epistemology is designed to support emptiness (*śūnyatā*) and nominalism.
  *   **Nyāya:** Needs 4 to validate common sense and language. They are realists about the external world and need *upamāna* to explain how language hooks onto the world.

  **3. The "Framework" Nature**
  This is a Kuhnian paradigm dispute. The schools share terminology (*pramāṇa*, *pramā*, *anumāna*) but the terms function differently within their respective systems. When a Buddhist says "inference," they mean a logic grounded in causal relations between particulars. When a Mīmāṃsaka says "inference," they allow for relations between universals. They talk past each other because their **background metaphysics** dictates their **epistemological limits**.

  ### 3. What Counts as Progress?

  Given this diagnosis, consensus on the *number* of *pramāṇas* is impossible and arguably undesirable, as the number serves as a boundary marker for school identity. However, philosophical progress is possible if we shift the goal from **numerical consensus** to **meta-epistemological clarity**.

  **A. What Would NOT Count as Progress**
  *   **New Counterexamples:** Proposing a 7th *pramāṇa* or a new reduction case will fail. The schools have exhaustive catalogs of examples. The issue is not data; it is interpretation.
  *   **Empirical Verification:** Cognitive science cannot solve this. Even if neuroscience showed distinct neural correlates for *arthāpatti*, a Buddhist could argue it is still a composite of inference-processes, while a Mīmāṃsaka would claim it proves irreducibility. The dispute is normative, not descriptive.

  **B. What WOULD Count as Progress**
  Progress requires formalizing the **Criteria of Individuation**. The debate needs to move from "How many are there?" to "Under what conditions do we count instruments as distinct?"

  1.  **Distinguishing Generative vs. Justificatory Accounts:**
      Progress would come from explicitly separating the *causal genesis* of belief (psychology) from the *warrant* for belief (logic).
      *   Buddhists focus on the **Generative**: What causal chain produced this cognition?
      *   Mīmāṃsakas focus on the **Justificatory**: What unique authority validates this cognition?
      *   *Result:* If schools agreed to specify which track they are on, they might agree that *arthāpatti* is causally reducible (Generative) but justificatorily distinct (Justificatory). This dissolves the contradiction without forcing a numerical change.

  2.  **Formalizing the Reduction Condition:**
      The debate needs a formal logic of reduction. Is $X$ reducible to $Y$ if:
      *   (a) The output of $X$ is a subset of $Y$?
      *   (b) The causal process of $X$ is a subset of $Y$?
      *   (c) The warrant for $X$ is derivable from $Y$?
      *   *Result:* Currently, Nyāya argues (c) while Buddhists argue (b). Explicitly agreeing on the definition of "reduction" would clarify that they are often agreeing on the phenomena but disagreeing on the taxonomy.

  3.  **Acknowledging the Soteriological Stake:**
      Progress involves admitting that the epistemology is downstream of the metaphysics.
      *   *Result:* A "map" of the debate showing that accepting *anupalabdhi* commits one to Realism about Absence. This turns the debate from "Is *anupalabdhi* real?" to "Is Realism about Absence defensible?" This shifts the battleground to metaphysics, where arguments might be more decisive (e.g., arguments about causal efficacy of absences).

  ### Conclusion

  The stalemate is not a failure of Indian philosophy; it is a feature of its systematic nature. The debate over *pramāṇas* is a proxy war for deeper conflicts about the nature of reality (nominalism vs. realism) and the path to salvation (reason vs. revelation).

  Therefore, **no progress should be expected on the number of *pramāṇas*.** Any school that changes its number collapses its own metaphysical and soteriological architecture. The only viable progress is **diagnostic**: recognizing that the dispute is not about the inventory of knowledge sources, but about the **conditions for ontological commitment**. The "solution" is not to find the true number, but to understand that the number is a function of the metaphysical price one is willing to pay.
