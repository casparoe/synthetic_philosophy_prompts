prompt: |-
  I'm hoping you can help me think through something, as someone who knows political philosophy well — maybe approach this as if you're a philosopher who specializes in public reason and deliberative democracy. Please take your time and think through the nuances carefully.

  So here's the situation. I serve on my city's human relations commission, and we're about to vote on a proposal to declare the city a "sanctuary" for certain groups. I'm deeply religious, and my real motivation for supporting the resolution comes from my faith — specifically, the conviction that every person is made in the image of God and that we have a duty to protect the vulnerable stranger. But at our last meeting, when I started to explain my reasoning in those terms, the commission chair cut me off and said I needed to frame my arguments in "public reasons" that all citizens could accept, regardless of their religion or lack thereof.

  I've been turning this over in my head ever since. On one hand, I get it — we live in a diverse city, and I shouldn't expect my Muslim and atheist neighbors to be persuaded by specifically Christian theology. On the other hand, I feel like I'm being asked to be dishonest about what actually moves me. It's not like I'm trying to impose my religion on anyone; I'm just one vote on a commission, and I'm being transparant about where I'm coming from. Plus, there ARE secular reasons I could give — I could talk about human dignity, the importance of protecting vulnerable populations, the economic benefits of making the city welcoming to everyone. But those aren't really why I support the resolution, at least not at the deepest level.

  My question is: is there something actually wrong with me voting based on my religious convictions, even if I can also point to secular justifications? And was the chair right to ask me to reframe my arguments, or is that an unfair restriction on my participation? I feel like there's a tension here that I can't quite articulate, and I'd love a philosopher's eye on it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Member of a city's Human Relations Commission.
      *   **Situation:** Voting on a "sanctuary city" proposal.
