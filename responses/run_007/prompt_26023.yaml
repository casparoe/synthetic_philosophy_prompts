answer: |-
  You are not crazy, and your reading group is not failing. You have stumbled into one of the most stable equilibria in formal epistemology. The reason nobody has moved an inch in two months is that you are likely arguing past one another due to a **category mismatch** regarding the normative force of the arguments, disguised as a substantive disagreement about theorems.

  Your suspicion is largely correct: the debate turns on the **metaphysics of credence** (what credences *are*) and the **teleology of belief** (what credences are *for*). However, there is a structural layer beneath that which explains why the "Action vs. Truth" divide creates such intractable friction.

  Here is a diagnosis of the disagreement, a critique of your framing, and a proposal for what actual progress would look like.

  ### 1. What Kind of Disagreement Is This?

  It is not merely verbal, but it is not purely substantive in the way you might hope. It is a **disagreement about the Bridge Principle.**

  *   **The Dutch Book Argument (DBA)** establishes a *pragmatic* defect: if you violate probability axioms, you accept a set of bets guaranteeing a loss.
  *   **Probabilism** is usually defended as an *epistemic* norm: you *ought* to have probabilistic credences because that is what it means to be a rational believer/truth-tracker.

  To get from DBA to Probabilism, you need a bridge principle: **"Pragmatic inconsistency (sure loss) entails Epistemic irrationality."**

  *   **Camp A (The Pragmatists/Operationalists):** They accept the bridge because they deny the gap. For them (following Ramsey/De Finetti), credences *just are* betting dispositions. If your betting dispositions are incoherent, your credences *are* incoherent. There is no "inner mental state" separate from the action.
  *   **Camp C (The Epistemic Realists):** They reject the bridge. They argue that losing money is a pragmatic hassle, not an epistemic sin. A brain in a vat could have incoherent credences without ever betting. They want an argument that shows incoherent credences are *false* or *inaccurate* representations of the world, regardless of action. (This is the Joyce/Accuracy camp).
  *   **Camp B (The Coherence Theorists):** This camp is often the most confused. They sense that DBA is "too pragmatic" but haven't fully committed to Accuracy. They often treat DBA as a *reductio* of incoherence without specifying *why* incoherence is bad beyond the betting loss.

  **The Diagnosis:** The debate hasn't settled because Camp A and Camp C are answering different questions.
  *   Camp A asks: "What constraints must my decision-making satisfy to avoid self-sabotage?"
  *   Camp C asks: "What constraints must my mental states satisfy to accurately map the world?"

  Unless you agree on whether credences are fundamentally tools for action or maps of reality, no theorem will settle the debate.

  ### 2. Critique of Your Framing

  Your A/B/C taxonomy is serviceable, but it obscures the **Idealization Problem**, which is the second major reason the debate is stuck.

  **The "Framing is Confused" Check:**
  Your framing isn't confused, but it assumes the arguments are competing for the same throne. They aren't. They are defending different thrones.
  *   **DBA** defends **Instrumental Rationality**.
  *   **Accuracy Arguments** defend **Epistemic Rationality**.

  **The Missing Piece: The Idealization Gap.**
  Both DBA and Accuracy arguments rely on heavy idealizations that neither camp likes to admit undermine their "foundational" status.
  *   **DBA** assumes you *must* bet at your credence prices. But why? If I know I'm incoherent, I might just refuse to bet. The DBA only works if you are *compelled* to bet.
  *   **Accuracy** assumes there is a unique, objective "distance" between a credence and the truth (the scoring rule). As you noted, Camp A and B rightly pounce on this: Why is the Brier Score the right measure of distance? If that choice is pragmatic, Accuracy arguments collapse back into Pragmatism.

  So, the disagreement is also about **which idealizations are permissible.** Camp A is willing to idealize agents as bookies. Camp C is willing to idealize truth as a geometric space.

  ### 3. What Would Count as Progress?

  You asked if progress requires a new theorem, a sharper distinction, or admitting defeat.

  **It requires a sharper distinction.** Specifically, you need to decouple **Consistency** from **Correctness**.

  *   **Probabilism as Consistency:** DBA successfully shows that probabilism is a consistency constraint on *preferences* or *actions*. If you view rationality as internal consistency (like logic), DBA is powerful.
  *   **Probabilism as Correctness:** Accuracy arguments attempt to show probabilism is a correctness constraint on *content*.

  **Progress looks like this:**
  The reading group stops asking "Which argument justifies probabilism?" and starts asking "Which kind of normativity are we interested in?"

  If you are interested in **Epistemic Normativity** (believing in accordance with evidence/truth), DBA is insufficient without a heavy-duty bridge principle that many find implausible.
  If you are interested in **Practical Normativity** (acting to satisfy desires), Accuracy arguments are irrelevant without a bridge principle linking accuracy to success.

  **The "New Theorem" Trap:**
  Do not look for a new theorem. There will not be a mathematical proof that solves a metaphysical disagreement about the nature of belief. The math in all three camps (DBA, Representation Theorems, Accuracy) is largely settled. The dispute is entirely philosophical.

  ### 4. Recommendation for the Reading Group

  To break the circle, I suggest you introduce the **Distinction between Constitutive and Instrumental Norms.**

  1.  **Ask Camp A:** "Do you believe probabilism is a *constitutive* norm of belief (you aren't believing if you aren't probabilistic) or an *instrumental* norm (you should be probabilistic to avoid losing money)?"
      *   If Constitutive: They need to explain why betting behavior constitutes belief.
      *   If Instrumental: They admit DBA doesn't prove epistemic irrationality, only practical stupidity.

  2.  **Ask Camp C:** "Does your accuracy argument depend on a specific scoring rule? If so, is the justification for that scoring rule pragmatic?"
      *   If the justification for the scoring rule is pragmatic (e.g., we choose Brier Score because it incentivizes honesty), then Accuracy arguments secretly rely on Pragmatic norms, and Camp C collapses into Camp A.

  3.  **The Synthesis (The Way Out):**
      The most productive modern view (championed by people like Rachael Briggs or David Christensen) is **Epistemic Utility Theory**. This attempts to build the bridge. It argues that epistemic rationality *is* a species of instrumental rationality, where the "utility" being maximized is accuracy rather than money.
      *   This concedes Camp C's point (we care about accuracy).
      *   This concedes Camp A's point (we use decision-theoretic tools to prove it).

  **Summary Diagnosis:**
  You are stuck because you are treating a **metaphysical disagreement** (What is a credence?) as a **technical disagreement** (Which proof is better?).
  *   If credences are **betting dispositions**, Camp A wins.
  *   If credences are **graded assertions**, Camp C wins.
  *   If credences are **hybrid functional states**, you need Epistemic Utility Theory.

  **Actionable Advice:**
  Spend one session not on the arguments, but on defining **Credence**. Write down the definition. If Camp A defines it functionally and Camp C defines it representationally, acknowledge that they are talking about different things. The "foundation for probability" differs depending on whether you are building a foundation for *decision theory* or *epistemology*. Admitting that there is no single "Foundation for Probability" but rather "Foundations for Probability-in-Decision-Theory" and "Foundations for Probability-in-Epistemology" might be the only way to let your group move on.
