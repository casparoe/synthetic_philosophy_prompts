      4. Absence of pleasure is not bad (unless someone is deprived).
      Therefore, Non-existence has (Good + Not Bad). Existence has (Bad + Good).
      He argues the "Good" of absence of pain outweighs the "Good" of presence of pleasure.
      I must represent this accurately without endorsing it as consensus.

      *Settled vs. Contested:* It is *not* settled that the Asymmetry is correct. It is settled that it is a *problem* for ethical theory. I must make this distinction sharp.

