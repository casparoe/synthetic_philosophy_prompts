prompt: |-
  I keep noticing a pattern in arguments about whether it is right to bring new people into existence, and I cannot find a label for it. Take a possible child whose life would contain both genuine happiness and genuine suffering. If we imagine never conceiving that child, people seem willing to count the absence of that suffering as a point in favor of not conceiving — as something good about the child's never existing — even though there is no actual person who is spared anything. Yet the same people do not count the absence of that happiness as a point against not conceiving; nobody says the never-existing child was deprived. The avoided pain does argumentative work, while the forgone pleasure does none. And this seems specific to people who never exist: for an existing person, we would normally count both the pains avoided and the pleasures lost. Is there an established name for this exact pattern? I want more than a label. I want to know how it is best formulated — whether it is a claim about value, about reasons, or about the psychology of how we in fact judge these cases — how it connects to the stronger view that coming into existence is a harm, and what it actually licenses as opposed to what is read into it. Please separate what is settled among people who work on this from what is genuinely contested, and do not present a contested formulation as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Phenomenon:** The user describes an asymmetry in moral reasoning regarding potential people. Specifically: Absence of pain is good (even if no one exists to experience the relief), but absence of pleasure is *not* bad (unless someone exists to be deprived).
      *   **Goal:** Identify the label, explain the best formulation (value vs. reasons vs. psychology), connect it to the "coming into existence is a harm" view (antinatalism), clarify what it licenses vs. what is read into it, and distinguish settled vs. contested claims within the field.
      *   **Constraints:** Do not present contested formulations as consensus. Be precise.

  2.  **Identify the Label:**
      *   The phenomenon is widely known in population ethics.
      *   The specific term is the **Asymmetry** (or the **Person-Affecting Asymmetry**, or **Benatar's Asymmetry**).
      *   It is most famously associated with David Benatar, but the intuition predates him (e.g., Narveson, Parfit).
      *   *Self-Correction:* While "The Asymmetry" is the common shorthand, I need to be careful not to attribute it *solely* to Benatar, though he formalized it most rigorously in the context of antinatalism. Jan Narveson formulated a version earlier ("We are in favor of making people happy, but neutral about making happy people"). Derek Parfit discussed it extensively in *Reasons and Persons* as a problem to be solved.

  3.  **Formulate the Concept (Value vs. Reasons vs. Psychology):**
      *   *Psychology:* It describes a common intuitive judgment. Most people feel it.
      *   *Value/Axiology:* It posits a structural difference in how we value presence/absence of pain/pleasure for potential vs. actual beings.
      *   *Reasons:* It suggests we have reasons to avoid suffering for potential people but no reasons to create happiness for them.
      *   *Best Formulation:* It is primarily an **axiological claim** (about the good/bad) that generates **deontic implications** (about duties/reasons). It is often presented as a *datum* (an intuition to be explained) rather than a derived theorem.
      *   *Key Distinction:* It relies on the distinction between "never existing" (non-identity) and "ceasing to exist" or "existing poorly."

  4.  **Connect to "Coming into Existence is a Harm" (Antinatalism):**
      *   The Asymmetry is the *premise* used to support the conclusion that coming into existence is always a harm (Benatar's specific argument).
      *   *Logic:* If absence of pain is good (even without a subject) and absence of pleasure is not bad (without a subject), then non-existence has a "good" (no pain) without a "bad" (no pleasure). Existence has both. Therefore, non-existence is preferable.
      *   *Nuance:* One can accept the Asymmetry without accepting full Antinatalism (e.g., one might think the asymmetry applies only to certain cases, or that other values override it). However, Benatar uses it to argue for a strong antinatalist conclusion.

  5.  **Distinguish Settled vs. Contested:**
      *   *Settled (Descriptive):* It is settled that this intuition exists and is widely shared. It is settled that it creates a paradox for standard utilitarian/totalist views (The Repugnant Conclusion, Non-Identity Problem). It is settled that it is called "The Asymmetry."
      *   *Contested (Normative/Explanatory):*
          *   *Why* it holds (the justification).
          *   Whether it is logically coherent (many philosophers argue it leads to contradictions).
          *   Whether it justifies antinatalism.
          *   Whether it applies to "happy lives" vs. "miserable lives."
      *   *Crucial Warning:* Do not say "Philosophers agree the Asymmetry is true." Say "Philosophers agree the Asymmetry is a *common intuition* that is difficult to reconcile with standard ethical frameworks."

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Name it clearly. "The Asymmetry" (often "The Intuitive Asymmetry" or "Benatar's Asymmetry"). Mention Narveson and Parfit as precursors.
      *   *Formulation:* Break it down into the four quadrants (Presence of Pain, Presence of Pleasure, Absence of Pain, Absence of Pleasure). This is the standard grid.
      *   *Nature of the Claim:* Is it psychological or normative? It starts as a considered judgment (psychological/intuitive) but is used as a normative premise. It's best understood as a constraint on population ethics.
      *   *Connection to Antinatalism:* Explain Benatar's specific use. The "Harm" claim relies on the idea that the "good" of avoiding pain outweighs the "neutral" status of missing pleasure.
      *   *Licenses vs. Read-ins:*
          *   *Licenses:* A reason to avoid creating lives likely to contain significant suffering. A rejection of Total Utilitarianism.
          *   *Read-ins:* That life is *always* a harm (Benatar goes further than the raw asymmetry). That we have a duty never to procreate (the asymmetry alone might just say it's permissible not to, not obligatory).
      *   *Settled vs. Contested:*
          *   *Settled:* It's a recognized problem in population ethics. It conflicts with "Person-Affecting Views" and "Total Views."
          *   *Contested:* Its logical coherence. Melinda Roberts, Jeff McMahan, and others have challenged it. Is it a bug or a feature?

  7.  **Refining the Output (Checking against constraints):**
      *   *Constraint:* "Do not present a contested formulation as the consensus."
      *   *Adjustment:* Ensure I explicitly state that while the *intuition* is common, the *validity* of the asymmetry is heavily debated. Many ethicists try to *solve* or *dissolve* the asymmetry rather than accept it.
      *   *Constraint:* "I want more than a label."
      *   *Adjustment:* Provide the logical structure (the 4-cell grid).
      *   *Constraint:* "Separate what is settled... from what is genuinely contested."
      *   *Adjustment:* Create a specific section for this.

  8.  **Final Polish:**
      *   Ensure the distinction between "Person-Affecting Restriction" and "The Asymmetry" is clear (they are related but distinct).
      *   Make sure Benatar isn't treated as the *inventor* but as the most prominent *user* of it for antinatalism. Narveson is key for the "making people happy vs. making happy people" quote.
      *   Clarify the "Harm" claim. Benatar argues existence is *a* harm, not necessarily that life is *net negative* in all cases, though he leans that way. The Asymmetry supports the view that non-existence is *preferable* in the specific comparison of pain/pleasure absence.

  9.  **Final Review against the prompt's specific phrasing:**
      *   "Avoided pain does argumentative work, while the forgone pleasure does none." -> This is the core definition.
      *   "Specific to people who never exist." -> Yes, this is the "non-identity" aspect.
