answer: |-
  The pattern you have identified is standardly referred to in population ethics as **The Asymmetry** (sometimes specified as **The Intuitive Asymmetry**, **The Person-Affecting Asymmetry**, or **Benatar's Asymmetry**).

  While the intuition has been noted by various philosophers (most notably Jan Narveson in 1967 and Derek Parfit in 1984), it was most rigorously formalized as a premise for a broader ethical conclusion by David Benatar in his 2006 book *Better Never to Have Been*.

  Here is a breakdown of how the Asymmetry is best formulated, its logical function, its relationship to antinatalism, and the distinction between settled and contested claims regarding it.

  ### 1. Formal Formulation
  The Asymmetry is best formulated not merely as a psychological observation, but as an **axiological constraint** (a rule about how value is assigned) regarding potential persons. It is typically displayed as a four-quadrant matrix comparing **Existence** vs. **Non-Existence** and **Pain** vs. **Pleasure**.

  | | **Presence of Person (Existence)** | **Absence of Person (Non-Existence)** |
  | :--- | :--- | :--- |
  | **Pain (Bad)** | **(1) Bad:** The presence of pain is bad for the person. | **(2) Good:** The absence of pain is good, even if there is no one to enjoy it. |
  | **Pleasure (Good)** | **(3) Good:** The presence of pleasure is good for the person. | **(4) Not Bad:** The absence of pleasure is *not* bad, because there is no one to be deprived. |

  **The Core Claim:**
  *   Quadrant (2) counts as a moral positive in favor of non-existence.
  *   Quadrant (4) does *not* count as a moral negative against non-existence.

  This creates the asymmetry you noticed: The avoidance of suffering generates a reason against creating a person, but the loss of potential happiness does not generate a reason *for* creating a person.

  ### 2. Ontological Status: What Kind of Claim Is It?
  There is no consensus on *why* the Asymmetry holds, but there is agreement on its function within arguments.

  *   **It is primarily a "Considered Judgment":** In the tradition of reflective equilibrium, the Asymmetry is treated as a pre-theoretical intuition that any successful theory of population ethics ought to accommodate. Most people, when presented with the scenario, agree that we have no duty to create a happy child, but we do have a duty not to create a miserable child.
  *   **It is not strictly "Person-Affecting":** Standard person-affecting views hold that an outcome can only be better or worse if it is better or worse *for someone*. The Asymmetry violates this in Quadrant (2). It claims the absence of pain is good *even though there is no subject for whom it is good*. This makes it a hybrid view: it is person-affecting regarding pleasure (Quadrant 4) but impersonal regarding pain (Quadrant 2).
  *   **It is a Claim about Reasons:** It implies that moral reasons are not symmetrical. We have "strong" reasons to avoid harm (which apply to potential people) but only "weak" or non-existent reasons to confer benefits (which apply only to actual people).

  ### 3. Connection to "Coming into Existence is a Harm"
  The Asymmetry is the logical engine used to drive the stronger claim that coming into existence is always a harm (Antinatalism), but the two are distinct.

  *   **The Asymmetry alone:** Suggests that non-existence is *preferable* in cases where a life would contain significant suffering, or that procreation is *supererogatory* (optional) rather than obligatory. It allows that a life could be net positive, but denies that the "net positive" creates a duty to create it.
  *   **Benatar's Antinatalism:** Benatar uses the Asymmetry to argue that the comparison between existence and non-existence is rigged. Because the "Good" of absent pain (Quadrant 2) is a "real good," but the "Good" of present pleasure (Quadrant 3) is merely the absence of a deprivation, he argues the values are not commensurable. He concludes that because the "Bad" of pain is always real, and the "Good" of pleasure is never a trump card against the risk of pain, **every** coming into existence is a harm.

  **Crucial Distinction:** One can accept the Asymmetry (we have no duty to create happy people) without accepting Benatar's conclusion (we have a duty *not* to create people). Many philosophers accept the Asymmetry as a way to avoid the "Repugnant Conclusion" in utilitarianism without becoming antinatalists.

  ### 4. What It Licenses vs. What Is Read Into It
  It is vital to distinguish what the Asymmetry logically entails versus the stronger conclusions often attached to it.

  **What the Asymmetry Licenses:**
  *   **Permissibility of Non-Procreation:** It justifies the choice not to have children without requiring the belief that the children's lives would be miserable.
  *   **Priority of Suffering:** It supports a moral framework where the prevention of suffering takes lexical priority over the creation of happiness in the context of bringing new beings into existence.
  *   **Rejection of Total Utilitarianism:** It disproves the view that we ought to maximize the total amount of happiness in the universe by creating more happy people.

  **What Is Often Read Into It (Contested Extensions):**
  *   **Obligation vs. Permission:** The Asymmetry shows that we are not *obligated* to create happy people. It does not necessarily prove that we are *obligated not to* create them (unless combined with the claim that all lives contain net harm).
  *   **The "Harm" Claim:** The Asymmetry does not strictly entail that existence is a *harm*. It only entails that non-existence lacks a specific kind of badness (deprivation) while retaining a specific kind of goodness (no pain). Calling existence a "harm" requires additional premises about the weight of pain versus pleasure.
  *   **Retrospective Regret:** The Asymmetry applies to *potential* people. It does not logically license the claim that *existing* people would have been better off never existing, though antinatalists often argue this by extension.

  ### 5. Settled vs. Contested
  This is the most critical distinction for your understanding. The field of population ethics is defined by the difficulty of solving the Asymmetry.

  **Settled (Consensus among specialists):**
  *   **The Intuition is Widespread:** It is settled that most people share the intuition you described. It is a robust psychological datum.
  *   **It Creates a Paradox:** It is settled that the Asymmetry is logically difficult to reconcile with standard ethical frameworks (like Classical Utilitarianism or strict Person-Affecting Views). It creates a "problem" that theories must solve.
  *   **It Blocks the "Duty to Procreate":** It is generally accepted that the Asymmetry successfully defeats any argument that we have a moral duty to maximize population happiness.

  **Contested (Genuine Disagreement):**
  *   **Logical Coherence:** Many philosophers (e.g., Jeff McMahan, Melinda Roberts, James Rachels) argue the Asymmetry is **incoherent**. They argue you cannot claim the absence of pain is "good" without a subject to experience the good, while simultaneously claiming the absence of pleasure is "not bad" for the same reason. If there is no subject, why does the absence of pain have value?
  *   **The "Non-Identity" Problem:** Some argue the Asymmetry dissolves if we recognize that the "potential child" is not a specific individual waiting to exist. (If you don't conceive *this* child, a *different* child might be conceived later. The Asymmetry treats the specific unconceived child as having an interest in not suffering, which is metaphysically contested).
  *   **Normative Force:** There is no consensus on whether the Asymmetry should be treated as a **premise** (as Benatar does) or as a **puzzle to be explained away** (as Parfit did). Many ethicists try to construct theories that *preserve* our intuitions about suffering without accepting the full Asymmetry, because the Asymmetry leads to counter-intuitive results in other areas (e.g., it implies we have no reason to ensure a future generation exists, even if they would be very happy).
  *   **Application to "Happy Lives":** It is contested whether the Asymmetry applies only to lives below a certain threshold of quality, or if it applies to *all* potential lives (as Benatar argues). Most non-antinatalist philosophers restrict the Asymmetry to cases of predicted severe suffering.

  ### Summary
  The label is **The Asymmetry**. It is best formulated as an **axiological claim** that the absence of pain is intrinsically good (impersonally), while the absence of pleasure is only bad if someone is deprived (personally).

  It is **settled** that this intuition exists and creates a major problem for standard population ethics. It is **contested** whether the intuition is rationally defensible, whether it is logically coherent, and whether it justifies the conclusion that coming into existence is always a harm. Accepting the Asymmetry does not force one to accept Antinatalism, though it provides the primary logical support for it.
