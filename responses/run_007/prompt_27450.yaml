answer: |-
  ### The Self-Amendment Decision Tree

  **Start:** A constitution says any article (including this one) can be amended by a two-thirds vote. Legislators use a two-thirds vote to amend that clause, requiring unanimity from now on.

  **Q1. Is the new unanimity requirement valid law?**
  *   **No:** Go to **Q2**.
  *   **Yes:** Go to **Q3**.

  **Q2. Is it invalid because a legal system must have a fixed "master rule" outside itself that cannot change?**
  *   **Yes:** **Leaf 1: Fixed Hierarchy.** (Self-amendment is incoherent; validity always comes from a higher, static source.)
  *   **No:** **Leaf 2: Unnamed/Incoherent.** (You claim the vote is invalid, but deny there is a fixed higher rule. This position is rarely defended; it leaves the system with no source of validity at all.)

  **Q3. What made the change valid: the *text* of the old rule, or the *social fact* that people accepted the vote?**
  *   **Social Fact:** **Leaf 3: Ultimate Rule.** (The text didn't do it; the system's "rule of recognition" shifted because officials accepted the change. The text is just evidence.)
  *   **The Text:** Go to **Q4**.

  **Q4. In the game Nomic, does the rule that allows players to change rules apply to *itself*?**
  *   **No:** **Leaf 4: Separation of Act/Rule.** (The *act* of changing is valid, but the rule itself doesn't technically touch itself. The rule describes the power; the exercise of power is distinct.)
  *   **Yes:** Go to **Q5**.

  **Q5. At the exact moment the new rule is born, does the old rule still exist to authorize it?**
  *   **No:** **Leaf 5: Unnamed/Validity Gap.** (If the old rule dies before the new one is born, nothing authorizes the new one. This is usually considered a logical error.)
  *   **Yes:** **Leaf 6: Two-Step Process.** (The old rule validates the new rule while both briefly coexist, then the old rule vanishes. Self-amendment works, but only via this temporal overlap.)

  **Q6. A bylaw reads "This bylaw may never be repealed." A majority votes to repeal it. Is the repeal valid?**
  *   **Yes:** (You accept **Leaf 6: Two-Step Process**, but with limits. You believe systems can amend themselves, but cannot successfully bind their future selves against a simple majority.)
  *   **No:** **Leaf 7: Fully Reflexive.** (A system can amend anything, including entrenchment clauses. If the rule says it's permanent, it is permanent, even against a majority vote.)

  ***

  ### How This Sorts Your Readers

  This tree avoids asking readers what theory they subscribe to (e.g., "Are you a Hartian?") and instead asks what they think happens in specific scenarios. Here is the logic of the sort:

  1.  **The Validity Split (Q1):** This separates the **Skeptics** (Fixed Hierarchy) from the **Accepters**. If you think self-amendment is impossible, you land in Leaf 1. If you think it happens, you must explain how.
  2.  **The Source Split (Q3):** This separates the **Externalists** (Ultimate Rule) from the **Internalists**. If you think the text didn't do it—society did—you are in Leaf 3 (Hart's position). If you think the text *did* authorize the change, you believe in genuine legal reflexivity.
  3.  **The Mechanism Split (Q4 & Q5):** This separates the **Technicians** from the **Magicians**. If you think the rule doesn't apply to itself (Leaf 4), you avoid paradox by separating the *power* from the *paper*. If you think it does apply, you must solve the timing problem (Q5). If you can't solve the timing (Leaf 5), your position collapses. If you can (Leaf 6), you have a working model of self-amendment.
  4.  **The Limit Split (Q6):** This separates the **Democrats** from the **Absolutists**. Most people who accept self-amendment (Leaf 6) still think a current majority should win over a past majority (Bylaw case). Only the **Fully Reflexive** (Leaf 7) believe a rule can truly "lock the door" from the inside.

  **Note on Indistinguishable Positions:**
  Readers who land on **Leaf 6** (Two-Step) and answer **"Yes"** to Q6 (Repeal is valid despite entrenchment) are functionally identical to those who answer **"No"** to Q6, *unless* they have a theory for why entrenchment fails. Most legal theorists (like Alf Ross) argue entrenchment fails because a current majority cannot be bound by a past one. If a reader thinks entrenchment *works* (Leaf 7), they hold a much rarer, stronger view of sovereignty. The tree flags this at the end because it doesn't affect the *mechanism* of amendment, only the *limits*.
