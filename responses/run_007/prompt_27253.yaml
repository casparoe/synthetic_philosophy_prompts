answer: |-
  This is a classic "skeptical paradox" in meta-ethics, dressed up in the language of moral psychology. Your friend's argument is valid, but it is not sound. It relies on a specific, contentious meta-ethical compression that collapses **procedural norms** into **substantive preferences**.

  You are right to feel stuck between (4) and (7). The slide happens primarily between **(3) and (4)**, though **(1)** is being exploited along the way.

  Here is how to break the spell, which step to reject, and what it costs.

  ### The Diagnosis: The Conflation of Process and Content

  The argument works by convincing you that because there is no "view from nowhere" to judge moral *outcomes* (content), there is no way to judge moral *processes* (structure).

  *   **Step (2)** claims there is no neutral fact about which moral judgments are *right*. (Plausible to many non-realists).
  *   **Step (4)** claims there is no standard outside preferences to sort them into *sound* and *biased*. (This is the leap).

  The error is assuming that the standard for "bias" must be a **substantive moral truth** (e.g., "Equality is Good"). In moral psychology and philosophy, "bias" is often defined **procedurally** or **causally**, not substantively.

  ### Option 1: Reject (4) via Constitutive Norms (The Rationalist Move)

  You said you'd rather give up (4) but worry it begs the question. It only begs the question if you assume the standard must be a *substantive moral preference* (like "I prefer equality over hierarchy").

  **The Rejection:** Reject the claim that all moral standards are "just preferences." Some standards are **constitutive norms** of judgment itself.

  **The Argument:**
  To engage in moral *judgment* (as opposed to mere taste) is to commit oneself to certain procedural norms, such as consistency, impartiality, and universality.
  *   **Preference:** "I prefer vanilla ice cream." (No claim to universality).
  *   **Moral Judgment:** "Stealing is wrong." (Implicitly claims this applies to everyone, including me, in relevantly similar situations).

  If a judge sentences out-group members more harshly, they are violating the **constitutive norm of impartiality** that defines the practice of *judging*. They aren't just violating *your* preference; they are violating the internal logic of the institution they are participating in.

  **The Cost:**
  You must accept a form of **Moral Constructivism** or **Rationalism**. You have to argue that morality isn't just about *what* we value, but *how* we value. You are committing to the idea that there are rational constraints on moral agency that are not merely subjective preferences.
  *   *Does this help yourself to a preference-like standard?* No. A preference is contingent ("I happen to like this"). A constitutive norm is necessary for the activity ("You can't play chess without moving the bishop diagonally"). If you reject impartiality, you aren't playing the "morality game"; you're just expressing power or taste.

  ### Option 2: Reject (1) and (2) via Descriptive Psychology (The Naturalist Move)

  Since this is a **moral psych** seminar, you have a stronger empirical card to play. In psychology, "bias" does not require a moral truth; it requires a **counterfactual about causal relevance**.

  **The Rejection:** Reject the definition of bias in (1) as requiring a "correct judgment." In social science, bias is defined as **sensitivity to normatively irrelevant variables.**

  **The Argument:**
  We can establish "irrelevance" without solving meta-ethics.
  *   **Fact:** Skin color is causally irrelevant to the likelihood of recidivism (controlling for socioeconomic factors, etc.).
  *   **Observation:** Judge A's sentencing varies significantly based on skin color.
  *   **Conclusion:** Judge A's process is biased.

  This doesn't require knowing the "correct" sentence length (the moral truth). It only requires knowing that *race* is not a valid input for the function of *sentencing*. This is a functional/teleological claim, not a mystical moral fact.

  **The Cost:**
  You have to accept **Naturalism**. You are grounding the bias distinction in facts about human welfare, social cooperation, or institutional function, rather than abstract moral truths. You are saying, "If the goal of the legal system is X, then race is an irrelevant variable." If the friend asks, "But why is X the goal?" you have to be willing to ground that in human needs rather than pure preference.

  ### Option 3: The Internalist Critique (The *Ad Hominem* Move)

  This is the cheapest way out, but often the most effective in seminar.

  **The Rejection:** Reject (3). Calling a judgment biased does not require applying *your* standard; it can apply *their* standard.

  **The Argument:**
  Most people (including your friend) claim to value fairness or consistency. If you show them their judgments violate *their own* stated principles due to an irrelevant cue (e.g., framing effects, order effects), you have identified a bias **by their own lights**.
  *   "You say you value equal treatment under the law. Your data shows you punish Group B harder for the same crime. Therefore, you are biased."

  **The Cost:**
  This doesn't catch the "Honest Bigot" who says, "I know it's inconsistent, but I prefer punishing Group B." However, for the vast majority of moral discourse, people operate within a shared framework of reasons. This moves the debate from "My preference vs. Yours" to "Your Actions vs. Your Principles."

  ### Recommendation

  **Reject (4), but do it via Option 1 (Constitutive Norms).**

  This addresses your specific fear: *"I don't see how to give up (4) without helping myself to a moral standard that's just as preference-like."*

  **The Response to your Friend:**
  "Step (4) assumes that any standard used to police preferences must itself be just another preference. But that ignores **structural norms**.
  Logic isn't a preference; it's a constraint on coherent thought. Similarly, **impartiality** and **consistency** aren't moral preferences; they are constraints on coherent *judging*.
  When I call a judge biased, I am not saying 'I prefer equality.' I am saying 'Your process violates the constitutive rules of judgment you claim to be engaging in.'
  If you reject (4), you aren't positing a 'moral fact' floating in the ether; you are positing that moral agency has a structure, and bias is a structural failure, not just a difference in taste."

  **Why this saves (7):**
  It allows you to call the racist judge biased without needing to prove that "Equality is Objectively True." You only need to prove that "Judging implies Impartiality," and the judge is claiming to be Judging. If they admit they aren't trying to judge fairly but just to oppress, you can call them an oppressor, not a biased judge. But you can still distinguish the *bias* (the structural failure) from a *preference* (a substantive value).

  **The Price:**
  You must concede that your friend is operating from a **Radical Subjectivist** or **Error Theoretic** framework. By rejecting (4), you are committing to the view that moral reasoning is subject to norms of rationality that are not merely subjective. In a moral psych seminar, this is usually a acceptable cost; in a hard meta-ethics seminar, it would be the start of a much longer war.
