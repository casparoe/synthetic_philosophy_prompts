prompt: |-
  So I've somehow ended up giving a talk at our company's ML reading group next month, and I'm going to argue that inverse reinforcement learning has a pretty fundemental blind spot when it comes to actually recovering what humans *want* (as opposed to just what they do). My basic line is: IRL treats all behavior as optimal with respect to some reward function plus maybe a noise term, but real human behavior is shaped by a ton of stuff that isn't preference at all — false beliefs about the world, social pressure, akrasia, habits, constraints people don't even know they're operating under. The math can't tell the difference between "she walked to the cafe because she prefers the scenic route" and "she walked to the cafe because she's wrong about which way is shorter." And if you're using IRL to infer human values for alignment purposes, that distinction matters a lot.

  The audience is mostly ML engineers — some of them work on our RLHF pipeline, a few come from a robotics background where they've actually implemented IRL, and there's one guy from the reasoning team who will definitely want to formalize everything I say as a Bayesian network. They're smart but they tend to think that if you can't state a problem in a loss function it's not a real problem. I'm not a philosopher, I'm just an engineer who's been reading around this stuff on weekends, so I'm a little nervous about getting steamrolled in Q&A.

  Can you prep me for the objections I'll actually get from this crowd? I want them ordered roughly by how likely and how damaging they are, phrased the way an ML engineer would put them (not a philosopher), with a short reply I can give and a note on where each reply is weakest. Also tell me which objection I should be praying nobody thinks to ask. And at the end, let me know how confident you are in the overall prep and which point you're least sure about — I'd rather know where the floor is soft than walk on it thinking it's solid.
