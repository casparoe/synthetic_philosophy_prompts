answer: |-
  I hold the greater good in distant light.
  My promise stands firm against the weight.
  I take the nearer good within my sight.

  The shadow shortens, time takes hasty flight.
  The value shifts without a change in state.
  I hold the greater good in distant light.

  No new reason makes the future white.
  The value bows to seal the present's fate.
  I take the nearer good within my sight.

  The distant promise fades into the night.
  The moment comes, I can no longer wait.
  I hold the greater good in distant light.

  The choice is made, the moment bitten tight.
  The smaller satisfaction fills the plate.
  I take the nearer good within my sight.

  The same eyes watch the future turn less bright.
  I own both words, spoken soon or late.
  I hold the greater good in distant light.
  I take the nearer good within my sight.
