answer: |-
  Good morning, everyone. Welcome.

  It is a genuine privilege to stand here and open this workshop. We have a wonderful mix of people in the room—colleagues from Philosophy, colleagues from Mathematics, and many whose work lives comfortably, or perhaps uncomfortably, on the border between the two. I want to extend a special thanks to both departments for co-hosting this event, and to the organizers who made it happen.

  We are gathered here to mark a specific anniversary. Fifty years ago, Paul Benacerraf published "Mathematical Truth." In the history of philosophy of mathematics, it is something of a singularity. It is the paper that everyone cites, everyone claims to have moved beyond, and yet, everyone is still wrestling with.

  Now, I am conscious of the composition of this room. It is roughly half philosophers and half mathematicians. And I am conscious that when a philosopher stands up to talk about Benacerraf to a room of mathematicians, there is a specific risk. The risk is that I will describe a problem that feels, to you, like a artifact of over-thinking. You know how to do mathematics. You know what a proof is. You know when an argument is rigorous and when it is hand-wavy. The idea that there is a "dilemma" about whether numbers *exist* or how we *know* them can sound like a category error. It can sound like asking a carpenter if they believe in the ontology of the hammer before they drive the nail.

  Conversely, I know my colleagues in philosophy are listening for a different risk. The risk that in trying to make this palatable to our mathematical colleagues, we will sand down the sharp edges of the problem until it disappears. We cannot afford to do that. Benacerraf's dilemma is not a puzzle to be dissolved; it is a tension that remains live.

  So, my goal for these ten minutes is not to teach the problem to anyone—I suspect most of you know the contours already. My goal is to frame why this workshop is necessary *now*, and why this problem belongs to all of us, not just one department.

  Let's recall the core tension, but let's try to strip away the jargon for a moment.

  Benacerraf asked us to look at two commitments that seem entirely reasonable on their own.

  The first commitment is semantic. It says that mathematical sentences should be treated like ordinary sentences. When I say "There are prime numbers greater than 100," that should be true in the same way "There are chairs in this room" is true. It requires there to be *things* that the sentence is about, and those things need to make the sentence true. For the mathematicians in the room: this is basically a commitment to taking your own discourse at face value. When you prove a theorem, you aren't just moving symbols according to rules; you are tracking truth.

  The second commitment is epistemic. It says that for us to know something is true, there has to be a plausible story about how we interact with the things that make it true. If I know there are chairs in this room, it's because I can see them, touch them, or someone told me who saw them. There is a causal chain.

  Here is the pinch. If we take the first commitment seriously—if numbers are objects that make sentences true—they look like they have to be abstract. They don't have location. They don't have mass. They don't enter into causal relations. But if they don't enter into causal relations, how do we satisfy the second commitment? How do biological creatures, evolved in a physical world, locked into a causal network, manage to have reliable beliefs about things that are causally inert?

  To the philosophers: We know this as the problem of access. To the mathematicians: I invite you to see this not as skepticism about your results, but as wonder at your methods. If mathematical objects are truly independent of us, the reliability of human mathematics is, statistically speaking, a miracle. Benacerraf isn't saying you're wrong; he's asking how you're so right.

  But there is a second horn to the dilemma, often overshadowed by the epistemic one, and I think this is where the mathematicians in the room might feel more at home. This is the Identification Problem.

  If numbers are objects, *which* objects are they? Is the number 2 the set $\{ \emptyset, \{ \emptyset \} \}$? Or is it $\{ \{ \emptyset \} \}$? Both set-theoretic reductions work perfectly for arithmetic. They yield the same theorems. But they can't both *be* the number 2, because they aren't identical to each other.

  Now, a common reaction from mathematical practice is: "This doesn't matter. We care about structure, not identity." And that is a powerful intuition. It leads to structuralism. But Benacerraf's point cuts deep here, too. If you say "Numbers aren't objects, they are positions in a structure," you have saved the epistemology—maybe we know structures through abstraction—but you have complicated the semantics. What makes a statement about a "position" true if there is no object occupying it?

  So, we are stuck. If we prioritize truth, we lose knowledge. If we prioritize knowledge, we lose truth. Or, we change the subject entirely and say math isn't true in the standard sense, which feels like a betrayal of the practice.

  Why does this matter for a workshop in 2023?

  Because the last fifty years have seen incredible developments in both fields, and the dialogue has often lagged behind.

  In philosophy, we have developed sophisticated accounts of modal knowledge, of abstraction principles, of fictionalism and neo-logicism. But sometimes, I worry we are solving the problem in a vacuum. We construct epistemic theories that satisfy philosophical constraints but look nothing like the cognitive science of how mathematicians actually think.

  In mathematics, the foundations have only become more rich. Category theory, homotopy type theory, new perspectives on set theory. These aren't just technical tools; they are different ways of carving up the ontology of mathematics. When a mathematician says, "I am a working Platonist," what work is that Platonism doing? Is it a heuristic? Is it a metaphysical claim?

  This workshop is designed to put those conversations in the same room.

  To my philosophical colleagues: I ask that we listen carefully when the mathematicians describe their practice. If our epistemic theories require a picture of mathematical cognition that no mathematician recognizes, our theories are likely wrong. We cannot solve Benacerraf by ignoring the data of mathematical experience.

  To my mathematical colleagues: I ask that you consider that the "foundational" questions aren't just about avoiding paradoxes or ensuring consistency. They are about the relationship between your minds and the reality you are describing. If the standard picture of reference doesn't work, that isn't a failure of math; it's a clue that our understanding of reference, or of objects, or of knowledge, needs to expand.

  We are not here to declare a winner. We are not here to say "Platonism is dead" or "Structuralism saves the day." We are here to acknowledge that Benacerraf identified a friction point between the best semantics we have and the best epistemology we have. That friction generates heat. And hopefully, over the next two days, it will also generate light.

  We have a fantastic lineup of speakers who will be pushing on these questions from different angles. Some will argue we need to revise our logic. Some will argue we need to revise our metaphysics. Some will argue we need to look at the history of how these concepts evolved.

  My hope is that by the end of this workshop, the philosophers will feel the mathematical constraints more sharply, and the mathematicians will feel the philosophical pressure more acutely. Not to make us doubt our work, but to deepen our understanding of what we are doing when we do it.

  Thank you to everyone for coming, for being open to the discomfort of the dilemma, and for being willing to talk across the divide. Let's have a productive couple of days.

  Thank you.
