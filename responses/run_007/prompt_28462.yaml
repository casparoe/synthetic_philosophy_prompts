answer: |-
  This is a foundational question in the philosophy of biology. The "Species Problem" persists not because biologists are incompetent, but because the term "species" is asked to perform multiple, often conflicting, theoretical jobs. To evaluate any species concept, one must first establish the **desiderata**—the list of jobs the concept is required to do.

  Below is a specification of the desiderata for an adequate account of species, categorized by their function, along with the motivating cases, the status of the requirement (non-negotiable vs. preferential), and the inherent trade-offs.

  ### I. Ontological and Metaphysical Desiderata
  *These requirements concern what kind of thing a species is supposed to be in reality.*

  **1. The Reality Condition (Natural Kind vs. Class)**
  *   **Requirement:** The definition must specify whether a species is a *natural kind* (a class of similar individuals defined by intrinsic properties) or an *individual* (a spatiotemporally bounded historical entity).
  *   **Motivation:** If species are real units of nature (realism), they must exist independently of human classification. If they are arbitrary classes (nominalism), they are merely heuristic tools.
  *   **Status:** **Non-negotiable.** Any concept must take a stance. Most modern philosophy of biology favors the "species-as-individuals" thesis (Ghiselin/Hull), meaning a species is a single historical lineage, not a class of similar organisms.
  *   **Distinction:** This addresses the **Category vs. Taxon** distinction. The *species category* is the rank (the concept of "specieshood"); a *species taxon* is the specific unit (e.g., *Panthera leo*). A definition must explain what makes the category valid without dictating the boundaries of every specific taxon a priori.

  **2. The Ontology/Epistemology Distinction**
  *   **Requirement:** The definition must distinguish between *what makes* a group a species (constitutive criteria) and *how we identify* that group (operational criteria).
  *   **Motivation:** We often identify species by morphology (epistemology), but that does not mean morphology *makes* them species (ontology). Conflating these leads to errors when cryptic species are discovered (same look, different species) or polymorphic species are split (different look, same species).
  *   **Status:** **Non-negotiable.** Failure here renders a concept useless for theoretical biology, reducing it to a field guide key.

  ### II. Empirical and Operational Desiderata
  *These requirements concern the applicability of the definition across the diversity of life.*

  **3. Universality (The "All Life" Condition)**
  *   **Requirement:** The definition must apply to sexual eukaryotes, asexual eukaryotes, prokaryotes, and fossils.
  *   **Motivating Cases:**
      *   **Asexual Organisms:** Bdelloid rotifers or dandelions that reproduce clonally.
      *   **Bacteria/HGT:** Prokaryotes that exchange genes horizontally rather than vertically.
      *   **Fossils:** Populations known only from morphology in rock, where behavior and genetics are inaccessible.
  *   **Status:** **Contested.** Realists often demand this (Non-negotiable for a *General* Species Concept). Pluralists argue this is a **Preference** of the "unifier" school and that different concepts should apply to different kingdoms (e.g., one concept for animals, another for bacteria).
  *   **Constraint:** A definition relying on mating behavior automatically fails this for asexuals and fossils.

  **4. Diagnosability (The "Field Work" Condition)**
  *   **Requirement:** It must be possible, at least in principle, to determine whether a specific organism belongs to a species.
  *   **Motivation:** If a definition posits a boundary that is theoretically real but empirically undetectable, it is scientifically inert.
  *   **Status:** **Non-negotiable.** A concept that cannot be operationalized is metaphysics, not science.

  **5. Boundary Sharpness vs. Continuity**
  *   **Requirement:** The definition must account for the existence of discrete clusters in nature while acknowledging evolutionary gradualism.
  *   **Motivating Cases:**
      *   **Ring Species:** Populations (e.g., *Ensatina* salamanders) arranged geographically where neighbors interbreed, but terminal ends do not. Are they one species or many?
      *   **Natural Hybrids:** Cases where distinct lineages exchange genes (e.g., wolves and coyotes, or many plant species).
  *   **Status:** **Jointly Unsatisfiable Pair.** You cannot have perfectly sharp boundaries *and* fully accommodate gradual evolutionary divergence.
      *   *Option A:* Enforce sharp boundaries (privileges the "clusters").
      *   *Option B:* Accommodate gradualism (privileges the "process," risking the dissolution of the species category).

  ### III. Evolutionary and Theoretical Desiderata
  *These requirements ensure the definition fits within modern evolutionary theory.*

  **6. Lineage Integrity**
  *   **Requirement:** The definition must treat species as segments of population-level lineages evolving separately from other such lineages.
  *   **Motivation:** Evolution is a historical process. A species concept that ignores ancestry (e.g., purely phenetic similarity) contradicts evolutionary theory.
  *   **Status:** **Non-negotiable.**

  **7. Process Compatibility**
  *   **Requirement:** The definition must allow for *speciation* to be a process, not an instantaneous event.
  *   **Motivation:** Speciation takes time. During the "grey zone" of speciation, populations are partially isolated. A definition must explain the status of populations in this intermediate state.
  *   **Status:** **Non-negotiable.**

  **8. Horizontal Gene Transfer (HGT) Compatibility**
  *   **Requirement:** The definition must accommodate non-tree-like inheritance.
  *   **Motivating Case:** **Bacteria.** If genes move laterally between distinct lineages, the "branching tree" model of species breaks down.
  *   **Status:** **Preference of the Phylogenetic/Pluralist School.** Strict cladists view this as a fatal flaw for tree-based concepts; others argue bacterial "species" are simply different kinds of units than animal species.

  ---

  ### IV. Trade-offs and The "Killer" Constraint

  #### Jointly Unsatisfiable Pairs
  1.  **Universality vs. Mechanism:** You cannot have a definition that relies on a specific *mechanism* of cohesion (like interbreeding) and also satisfies *Universality* (covering asexuals/fossils).
  2.  **Discreteness vs. Gradualism:** You cannot demand that species always be sharply distinct clusters (to satisfy Diagnosability) and simultaneously acknowledge that evolution is a continuous process (to satisfy Process Compatibility), specifically in Ring Species cases.

  #### The Single Requirement That Eliminates the Most Concepts
  **Universality (specifically regarding Reproductive Mode).**
  The requirement that a species concept must apply to **asexual organisms and fossils** is the single greatest eliminator of leading concepts.
  *   It immediately falsifies the **Biological Species Concept (BSC)**, which defines species by reproductive isolation. You cannot test reproductive isolation in fossils, and it is non-existent in asexuals.
  *   It puts immense pressure on the **Phylogenetic Species Concept (PSC)**, as HGT in bacteria makes monophyly difficult to define.

  ---

  ### V. Scorecard of Leading Concepts

  Here is how the three major concepts score against the critical desiderata.

  | Desideratum | **Biological Species Concept (BSC)** | **Phylogenetic Species Concept (PSC)** | **Ecological Species Concept (ESC)** |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | Species as Reproductive Communities | Species as Monophyletic Lineages | Species as Adaptive Zones |
  | **Universality (Asexuals/Fossils)** | **FAIL** (Cannot apply) | **PASS** (In principle) | **PASS** (In principle) |
  | **Diagnosability** | **FAIL** (Allopatric populations hard to test) | **PASS** (Fixed character differences) | **MIXED** (Niche hard to measure) |
  | **Hybrids/Ring Species** | **FAIL** (Ambiguous status) | **PASS** (Treats hybrids as distinct lineages) | **MIXED** (Depends on niche overlap) |
  | **Evolutionary Process** | **PASS** (Focuses on isolation mechanism) | **MIXED** (Focuses on pattern/history) | **PASS** (Focuses on selection) |
  | **HGT / Bacteria** | **FAIL** | **FAIL** (Tree structure violated) | **PASS** (Focuses on function/niche) |

  ### Summary for Your Paper
  If your paper argues that species are "real," you must adopt the **Non-negotiable** desiderata (Lineage Integrity, Ontology/Epistemology distinction). If you argue that species are "imposed," you will likely highlight the **Jointly Unsatisfiable Pairs** (specifically Sharp Boundaries vs. Gradualism) to show that nature does not carve itself at the joints cleanly enough to satisfy our definitions.

  The critical tension you should explore is whether **Universality** is actually a valid requirement. Many biologists now argue for **Species Pluralism**: the idea that no single definition can satisfy all desiderata, and we should accept different species concepts for different branches of the tree of life. This accepts that "species" might not pick out one single *kind* of thing in nature, but rather several different kinds of evolutionary units that we conveniently label with the same word.
