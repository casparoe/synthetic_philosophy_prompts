  **I.**

  The file on the table was thin, but it looked heavy. Elias tapped the top sheet, a genetic screening result printed in black and white. Outside, the rain blurred the kitchen window into a gray smear.

  "It's not a guarantee," Mara said. She was washing dishes, her back to him. The water ran hot; steam rose around her shoulders. "It just says there's a predisposition. Like my family with the heart stuff. We manage."

  "My mother didn't manage," Elias said. He didn't open the file. He just looked at the corner of it. "She managed for forty years, and then she didn't. And before that, she spent twenty years wishing she hadn't woken up."

  "We could give them therapy. Medication. A good life." Mara turned off the tap. She dried her hands on a towel, slow and deliberate. "We can promise them love. We can promise them safety."

  "We can promise them love," Elias said. "We can't promise them that the love will be enough to offset the chemistry. If we bring them here, the pain is real. It's guaranteed they'll feel some of it. The joy is… hopeful. But the pain is certain."

  Mara leaned against the counter. "So we punish them for the chance of joy?"

  "No," Elias said. "We spare them the certainty of the rest."

  ***

  **II.**

  The room was painted a soft, neutral yellow. They had bought the crib second-hand, sanded it down, assembled it with careful turns of the screwdriver. It stood in the center of the room like a boat waiting for a passenger who hadn't bought a ticket.

  Mara ran her hand along the railing. "It feels wrong. Leaving it empty."

  "Why?" Elias stood in the doorway. He didn't step inside. "Who is it empty of?"

  "You know who."

  "Do I?" Elias looked past her, through the window opposite. The yard was overgrown. "If we don't put a child in here, is there a child somewhere else who is cold? Is there a soul waiting in line who gets skipped?"

  Mara turned to him, her expression tight. "It feels like a loss. Like we're closing a door on someone."

  "There's no one on the other side of the door, Mara. That's the point. If we walk away, the room is just a room. The air doesn't get hurt. The silence doesn't suffer. If we fill it, and things go wrong, then someone suffers. If we leave it, no one is deprived. You can't deprive a ghost."

  "It feels like deprivation," she whispered.

  "That's because you're here to feel it," Elias said. "They aren't."

  ***

  **III.**

  They were stuck on the highway, bumper to bumper. The brake lights ahead formed a river of red ink. The heat in the car was stifling despite the AC. Elias tapped the steering wheel. Mara scrolled through her phone, the light illuminating her tired face.

  "Look at this," she said, showing him a photo. A friend's toddler, smiling, covered in cake. "He looks so happy."

  "He looks happy now," Elias said. "He's going to grow up. He's going to sit in this traffic. He's going to have his heart broken. He's going to worry about money. He's going to get the flu."

  "Everyone does."

  "Exactly. Everyone does." Elias glanced at her. "We say a life is worth starting if the good outweighs the bad. But who decided the baseline? Why is 'net positive' enough justification to subject someone to the bad at all?"

  Mara put the phone down. "Because the good is… luminous. When it happens."

  "It's luminous," Elias agreed. "But the bad is heavy. We're talking about forcing someone into the grind. Just because we can handle the grind doesn't mean we have the right to assign them to it. Is a mostly okay life a gift? Or is it just a reprieve from the worst?"

  "It's a life, Elias."

  "It's a burden," he said, merging slowly into the next lane. "And we're the only ones who can decide if they have to carry it."

  ***

  **IV.**

  The neighbors were having a party. Music thumped through the wall, bass vibrating the floorboards. But underneath the music, rising above it occasionally, was the sound of a baby crying. Not a fuss, but a wail. Sharp. Desperate.

  Mara sat on the couch, knees pulled to her chest. She flinched every time the cry peaked.

  "It stops eventually," Elias said. He was reading, but he hadn't turned a page in twenty minutes.

  "For how long? Until the next time? Until they're sick? Until they're old and in pain?" Mara covered her ears with her palms. "It sounds like pleading."

  "In our house," Elias said, his voice low, "that sound doesn't exist."

  "But neither does the laughter," Mara said. "Neither does the singing. You're talking about the absence of pain like it's a virtue. But it's also the absence of everything else."

  "The absence of pain is good," Elias said. He finally put the book down. "Even if no one is there to enjoy the peace. The absence of joy… that's not bad. Not unless there's someone there to miss it. There's no one here to miss the singing. But if we brought them here, there would be someone to feel the crying."

  Mara listened. The baby screamed, a raw, tearing sound. Then, abruptly, it stopped. The silence that followed was heavy, but it was clean.

  "It's so quiet," she said.

  "It's safe," Elias said.

  ***

  **V.**

  The box went into the back of the closet, behind the winter coats. It contained the vitamins, the ovulation tracker, the book on toddler sleep training. Elias slid it into the shadows.

  Mara watched him from the bed. She didn't help. She didn't stop him.

  "Are we sure?" she asked. Her voice was small, but not trembling.

  "We're sure that no one will be hurt," Elias said. He closed the closet door. The click of the latch was final.

  "We're sure that no one will be helped, either."

  Elias sat on the edge of the bed. He took her hand. His palm was warm. "There's a difference. If we don't do this, the world loses nothing. No joy is lost. If we do… we risk everything."

  Mara looked at the closet door. She thought about the yellow room down the hall. She thought about the traffic. She thought about the crying next door. She let out a breath she felt like she'd been holding for a year. Her shoulders dropped.

  "Okay," she said.

  The room was dark. The house was silent. There was no one in the house to be lonely, and so, no one was.
