      *   *Causal Claim:* Human intent is the *primary* or *sole* cause of the outcome. (Debatable. Tools facilitate/enable).
      *   *Moral Claim:* Moral responsibility lies exclusively with the user, not the designer/owner. (Strong claim, often contested).
      *   *Design Claim:* The tool's design does not significantly influence the likelihood or scale of the outcome. (False for many technologies).

  3.  **Map to Technology/Algorithms:**
      *   Algorithms aren't passive like a hammer. They are active agents in a sense (optimizing for goals).
      *   Social media algorithms have *their own* goals (engagement, profit) set by designers.
