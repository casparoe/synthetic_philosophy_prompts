      *   *Refining Thesis 2:* "Human will is the necessary condition." True, but is it sufficient? No. A gun makes killing easier than bare hands. This is the "force multiplier" argument.
      *   *Refining Thesis 3:* "Blame belongs to the operator." This ignores negligent design. If a car has brakes that fail, the driver isn't solely to blame.
      *   *Refining Thesis 4:* "The tool doesn't bias the outcome." This is the big one for algorithms. Algorithms *optimize*. Optimization implies values (e.g., engagement > truth).

      *   *Connecting to Algorithms:*
