answer: |-
  You are right to feel that something slippery is happening. Your intuition about speed bumps vs. guns is actually a classic distinction in the philosophy of technology. Your friend is using a slogan that conflates several different philosophical claims into one punchy sentence. Some of those claims are trivially true, some are debatable, and some are demonstrably false when applied to software.

  To help you dismantle this, let's dissect "Guns don't kill people, people kill people" into four distinct theses. We will look at what each claims, whether it's true, and whether it applies to algorithms.

  ### Thesis 1: The Agency Claim
  **The Claim:** *Inanimate objects cannot form intent, so they cannot be moral agents.*
  *   **Status:** **Trivially True.**
  *   **Explanation:** A gun, a knife, or a line of code cannot "want" anything. It cannot be held criminally liable. Only humans have minds capable of intent.
  *   **Relevance to Algorithms:** This is true. TikTok isn't a person. However, this is a straw man. No one arguing against algorithmic neutrality is claiming the code has a soul or legal personhood. They are claiming the *designers* baked intent into the code.
  *   **Verdict:** Your friend wins this point, but it doesn't help his argument. Proving the algorithm isn't a person doesn't prove it doesn't influence behavior.

  ### Thesis 2: The Causal Claim
  **The Claim:** *Human intent is the primary or sole cause of the outcome; the tool is merely a passive conduit.*
  *   **Status:** **Substantively Debatable (often False).**
  *   **Explanation:** This suggests that the tool adds nothing to the equation other than what the user puts in. But tools change the *physics* of action. A gun allows a weak person to kill a strong person from a distance. It changes the *scale* and *likelihood* of the outcome.
  *   **Relevance to Algorithms:** Algorithms are not passive conduits like a pipe; they are active filters. If you search for "climate change," Google doesn't show you everything; it shows you what its model predicts you will click. It intervenes in the causal chain.
  *   **Verdict:** This is where the analogy starts to crack. A gun waits to be fired. An algorithm fires content at you before you ask.

  ### Thesis 3: The Moral Responsibility Claim
  **The Claim:** *Moral responsibility for the outcome lies exclusively with the user, never with the designer or manufacturer.*
  *   **Status:** **False (in most legal and ethical frameworks).**
  *   **Explanation:** We generally accept that designers share responsibility if a tool is dangerously defective or designed to fail safely. If a car's brakes are designed to fail after 10,000 miles, the manufacturer shares blame for the crash, even if a human was driving.
  *   **Relevance to Algorithms:** This is the core of your debate. Your friend wants to place 100% of the blame on the *user* (for clicking/engaging) and 0% on the *designer* (for optimizing for outrage).
  *   **Verdict:** This is weak. In product liability law, if you design a product that is known to cause harm (e.g., addictive slot machines), you bear responsibility.

  ### Thesis 4: The Design Neutrality Claim
  **The Claim:** *The design of the tool does not significantly bias the user toward a specific outcome.*
  *   **Status:** **False (for algorithms).**
  *   **Explanation:** This is the "Speed Bump" distinction you noticed.
      *   **Gun:** Designed to maximize lethality. (Biased toward killing).
      *   **Knife:** Designed to cut. (Neutral regarding food vs. flesh).
      *   **Speed Bump:** Designed to *force* a specific behavior (slowing down) regardless of intent.
      *   **Algorithm:** Designed to *maximize a metric* (time on site, engagement).
  *   **Relevance to Algorithms:** Social media algorithms are not neutral tools like a hammer. They are **optimizers**. They have a goal function (e.g., "maximize ad revenue"). To achieve that goal, they actively steer user behavior. If polarization keeps users on the site longer, the algorithm will *learn* to serve polarizing content. It is not waiting for the user to choose polarization; it is nudging them toward it to satisfy its own goal.
  *   **Verdict:** This is the kill shot. The tool is not neutral because its design explicitly values *engagement* over *truth* or *civic health*.

  ---

  ### Which Thesis Does Your Friend Need?

  For your friend's argument ("It's on us, not the tool") to work, he needs **Thesis 4 (Design Neutrality)** and **Thesis 3 (Exclusive Moral Responsibility)** to be true.

  He needs you to believe that the algorithm is like a **library card catalog**. A card catalog is neutral; it just tells you where the book is. If you pick up a hateful book, that's on you.

  But social media algorithms are not card catalogs. They are more like **casino slot machines**.

  ### Why the "Gun" Analogy Fails for Algorithms

  Your friend's analogy fails because it misidentifies the relationship between the user and the technology.

  1.  **The Principal-Agent Problem:**
      *   **Gun:** The gun serves the shooter. The shooter's will is the master.
      *   **Algorithm:** The algorithm serves the *platform*, not the user. The platform wants ad revenue; the user wants connection. The algorithm optimizes for the platform's goal, often *against* the user's stated interest (e.g., you want to sleep, but the algorithm wants you to scroll).
      *   **Implication:** You cannot say "people kill people" when the tool is actively working against the person's best interest to satisfy a third party (the corporation).

  2.  **Affordances and Constraints:**
      *   **Speed Bumps:** As you noted, speed bumps physically force you to slow down. They are "value-laden" technology (they value safety over speed).
      *   **Algorithms:** Algorithms are "psychological speed bumps." They use variable reward schedules (like slot machines) to hijack dopamine loops. They constrain your attention regardless of your intent to log off.
      *   **Implication:** If a tool is designed to bypass human rationality (addiction mechanics), blaming the human for falling for it is like blaming a gambler for the odds being stacked against them.

  3.  **Scale and Amplification:**
      *   **Gun:** Amplifies physical force.
      *   **Algorithm:** Amplifies *reach*. A hateful person in 1990 could yell at a few people in a bar. Today, the algorithm can deliver their hate to a million people because it identifies that hate generates engagement.
      *   **Implication:** The tool changes the *societal impact* of the individual action. The "people kill people" slogan ignores that the *tool* determines the body count.

  ### How to Respond

  You can tell your friend that his slogan relies on the idea that technology is **instrumental** (a passive means to an end). But modern tech philosophy (think Langdon Winner or Don Ihde) argues technology is **constitutive** (it shapes the end itself).

  Here is a precise way to put it to him:

  > "The slogan 'guns don't kill people' relies on the idea that the tool is neutral. But a speed bump isn't neutral; it forces you to slow down. Social media algorithms aren't neutral tools like a hammer; they are **optimizers**. They are explicitly programmed to value 'engagement' above everything else.
  >
  > If the algorithm learns that outrage keeps me on the app longer than happiness, it will feed me outrage. It is steering me to satisfy its own goals, not mine. So when you say 'it's on the people,' you're ignoring that the deck is stacked by the design. You're blaming the gambler for losing at a rigged slot machine."

  **Summary:**
  *   **Trivial Truth:** Code has no soul.
  *   **Substantive Lie:** Code has no values. (It has the values of its optimizers).
  *   **Friend's Requirement:** He needs the code to be neutral.
  *   **Reality:** The code is non-neutral by definition (it optimizes for specific metrics).

  Your friend is treating the algorithm like a **knife** (neutral tool). It is actually a **slot machine** (designed to manipulate behavior). That is the distinction that wins the argument.
