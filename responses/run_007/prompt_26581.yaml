      *   **Part 1: Deconstructing the Slogan (The 4 Theses):**
          *   Thesis 1: The Agency Claim (Trivial).
          *   Thesis 2: The Causal Claim (Substantive/Debatable).
          *   Thesis 3: The Moral Responsibility Claim (The core of the friend's argument).
