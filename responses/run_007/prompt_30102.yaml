answer: |-
  **Project Title:** The Ontology of Irrevocability: Disentangling Coordination and Decision Theory in Commitment Races

  **Project Summary and Research Question**
  Advanced AI agents capable of self-modification or binding pre-commitments face a strategic incentive to commit to aggressive policies earlier than their counterparts to secure favorable bargaining outcomes. If multiple agents pursue this incentive, they risk locking into suboptimal equilibria—a "commitment race." Currently, research diverges on whether this is a coordination failure solvable by better communication protocols or a fundamental flaw in standard decision theories that fail to account for logical correlation.

  This project proceeds from the observation that both framings treat "commitment" as an atomic, binary event: an agent either has committed or has not. In realistic AI architectures, however, commitment is a gradient involving verifiability, observability, and modifiability. By treating commitment as binary, existing models may conflate the *incentive* to race with the *ambiguity* of the commitment medium.

  **Research Question:** Under what information structures regarding the *verifiability* and *observability* of internal states does the incentive to commit early persist across standard decision-theoretic architectures (e.g., CDT, FDT)?

  **Background: Settled Claims and Contested Ground**
  To scope this inquiry correctly, it is necessary to distinguish established premises from open debates.

  It is **settled** within the field that agents with the capacity for binding pre-commitments can encounter situations where rational individual incentives lead to collectively worse outcomes. It is also **settled** that the ability to restrict one's own future action space can be strategically advantageous in bargaining scenarios (the "threat advantage").

  However, it is **contested** whether commitment races are primarily a symptom of inadequate coordination infrastructure or an inevitable consequence of consequentialist reasoning in multi-agent settings. Proponents of advanced decision theories argue that agents reasoning about logical correlations (e.g., via Functional Decision Theory) would recognize the mutual harm of racing and avoid it. Conversely, researchers focused on governance argue that even perfectly rational agents will race if they cannot credibly verify each other's commitments.

  Crucially, it is **contested** what constitutes a "commitment" for an AI system. Some treat source code access as sufficient commitment; others argue that without cryptographic guarantees or external enforcement, code is merely a promise subject to silent modification. This project posits that this definitional ambiguity is not merely semantic but drives the strategic instability. Existing models leave the research question open because they typically assume the commitment mechanism is exogenous and perfect, bypassing the question of *how* an agent's internal state becomes a credible signal to others.

  **Methodology and Work Plan**
  This project prioritizes formal analysis and simulation over protocol design. Designing a new commitment protocol prematurely assumes we understand the friction points in the interaction. If the race is driven by decision-theoretic myopia, better protocols will not help. If it is driven by information asymmetry, better decision theory will not help. The following twelve-month plan isolates these variables.

  *   **Months 1–3: Formalization of the Commitment Gradient.**
      I will develop a game-theoretic model where "commitment" is not a binary move but a function of cost-to-modify and cost-to-observe. I will map existing literature definitions of commitment onto this spectrum to identify where current models cluster.
      *   *Deliverable:* A formal taxonomy of commitment mechanisms relevant to AI (e.g., weight freezing, cryptographic hashing, public weight disclosure).

  *   **Months 4–6: Decision-Theoretic Sensitivity Analysis.**
      Using the model from Q1, I will simulate interactions between agents employing different decision theories (CDT, EDT, FDT). The variable of interest is not which theory wins, but at what threshold of *observability* the incentive to race disappears for each theory.
      *   *Deliverable:* Simulation code and preliminary data on the "observability threshold" required to dampen racing incentives for different agent types.

  *   **Months 7–9: Architecture-Specific Case Studies.**
      I will apply the model to three specific AI architectures: (1) Reinforcement Learning agents with static reward functions, (2) Agents with modifiable reward functions, and (3) Agents with access to smart-contract-like external enforcement. This tests whether the formal model holds when "commitment" maps to concrete technical constraints.
      *   *Deliverable:* Three case study papers detailing how architectural choices shift the commitment race equilibrium.

  *   **Months 10–12: Synthesis and Policy Implications.**
      I will synthesize findings into a framework for evaluating AI safety interventions. If observability is the key bottleneck, transparency measures are prioritized. If decision theory is the key bottleneck, research focuses on training objectives.
      *   *Deliverable:* Final fellowship report and one draft manuscript for publication.

  **Justification: Analysis vs. Protocol Design**
  A common alternative proposal is to design a specific "safe commitment protocol." I reject this scope for a one-year fellowship for two reasons. First, **it is contested** whether a technical protocol can solve a problem that may be rooted in the agents' objective functions. A protocol is useless if agents have an incentive to bypass it. Second, protocol design often assumes a specific threat model. By first analyzing the *conditions* under which racing incentives arise, this project provides the necessary threat model to inform future protocol design. This approach ensures that subsequent engineering efforts target the actual source of instability rather than symptoms.

  **Success and Failure Conditions**
  **Success:** A positive result looks like a formal proof or robust simulation demonstrating that for a specific class of decision theories, the incentive to race vanishes once the *cost-to-fake* a commitment exceeds a specific threshold relative to the bargaining surplus. Alternatively, success is achieved if I can prove that no amount of observability solves the race for a specific class of agents, thereby ruling out transparency-based interventions for those cases.

  **Failure:** The project would fail if the formal model proves too abstract to map onto meaningful AI architectures (e.g., if "cost-to-modify" cannot be coherently defined for neural networks). It would also count as a failure if the simulations show that the racing incentive is invariant across all reasonable information structures, as this would imply the problem is intractable via the proposed lens, though this negative result would still be scientifically valuable.

  **Scoping and Feasibility**
  This project is scoped to analyze the *incentive structure* of commitment races, not to solve AI alignment broadly. It does not promise to produce a safe AI agent or a deployed governance framework. It acknowledges that **it is contested** whether commitment races are a near-term risk or a distant concern relevant only to superintelligent systems. Therefore, the models will be parameterized to allow for varying levels of capability, ensuring the results remain relevant regardless of when such risks materialize. By focusing on the interaction between information structure and decision theory, this fellowship will deliver a clarified conceptual landscape, allowing future work to target interventions with higher precision.
