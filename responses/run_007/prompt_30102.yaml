prompt: |-
  I'm applying for a one-year research fellowship at an institute that funds work on decision theory and AI alignment, and the application asks for a two-page proposal. I'd like to work on the commitment races problem: roughly, the idea that agents capable of making binding commitments about their own future behavior have an incentive to commit as early and irrevocably as possible, with the result that if enough agents follow that incentive, everyone ends up worse off than under some coordinated alternative. The discussions I've seen tend to treat this either as a coordination problem to be solved by better commitment protocols or as a fundamental challenge to decision theory itself, and I suspect the two framings rest on different assumptions about what a commitment is and when an agent should want one.

  Please turn this into a proposal that does the following: (1) states a precise, answerable research question; (2) explains why the existing framings leave that question open; (3) lays out what I would actually do over the year, month by month, and why that approach rather than designing another commitment protocol; (4) says what a positive result would look like and what would count as the project failing; and (5) is honestly scoped for a single year. Don't include citations or a bibliography; I'll add those myself.

  One further request: throughout the proposal, separate what is settled from what is genuinely contested among people who work on this, and don't present a contested view as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Commitment Races in AI Alignment/Decision Theory.
      *   **Goal:** A two-page research fellowship proposal.
      *   **Key Constraint 1:** State a precise, answerable research question.
      *   **Key Constraint 2:** Explain why existing framings (coordination vs. decision theory) leave this question open.
      *   **Key Constraint 3:** Lay out a month-by-month plan (1 year) and justify *why* this approach (analysis vs. protocol design).
      *   **Key Constraint 4:** Define success and failure conditions.
      *   **Key Constraint 5:** Honest scoping for one year.
      *   **Key Constraint 6:** Distinguish settled vs. contested claims (crucial instruction).
      *   **Formatting:** No citations/bibliography.
      *   **Tone:** Academic, precise, honest, persuasive.

  2.  **Deconstruct the Topic (Commitment Races):**
      *   *What is it?* Agents committing early/irrevocably to gain strategic advantage, leading to suboptimal equilibria (like a game of chicken where everyone swerves late or nobody swerves).
      *   *Existing Framings:*
          1.  *Coordination/Protocol:* We need better technical ways to commit (e.g., smart contracts, cryptographic commitments) to allow for safer coordination.
          2.  *Decision Theory:* The problem lies in the decision algorithm (e.g., CDT vs. FDT vs. EDT). If agents reason correctly, they won't race.
      *   *The Gap:* Both assume we know *what* counts as a commitment. But in AI, "commitment" is fuzzy. Is it weights? Code? A public statement? A pre-commitment to updateless reasoning? The proposal needs to interrogate the *ontology* of commitment before solving the race.
      *   *Research Question:* Needs to be specific. Not "How do we solve commitment races?" (too big). Maybe "Under what conditions does the definition of 'irrevocability' collapse the distinction between coordination failure and decision-theoretic error?" Or "To what extent is the commitment race problem driven by ambiguity in the observability of commitments rather than the incentives themselves?"
      *   *Refined Question:* "To what extent does ambiguity in the *observability* and *verifiability* of commitments drive the incentive to race, independent of decision-theoretic architecture?" (This allows analyzing the *structure* of the interaction rather than just prescribing a decision theory or a protocol).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but academic. "The Ontology of Irrevocability: Disentangling Coordination and Decision Theory in Commitment Races."
      *   **Introduction/Problem Statement:** Define commitment races. Acknowledge the risk (AI systems locking in bad equilibria).
      *   **Research Question:** Make it precise.
      *   **Literature/Gap Analysis:** Address the "Settled vs. Contested" constraint.
          *   *Settled:* Commitment races are possible; early binding can be advantageous; uncoordinated races lead to suboptimal outcomes.
          *   *Contested:* Whether this is a bug in decision theory or a lack of coordination infrastructure. Whether "updatelessness" solves it.
          *   *The Gap:* Both sides assume a binary view of commitment (made/not made). Real AI systems have gradations of transparency and modifiability.
      *   **Methodology/Work Plan:** Month-by-month.
          *   *Q1:* Formal modeling (Game theory + info structures).
          *   *Q2:* Simulation/Agent-based modeling (testing the formal models).
          *   *Q3:* Taxonomy of AI commitments (weights, architecture, external tools).
          *   *Q4:* Synthesis and policy implications.
          *   *Justification:* Why analysis over protocol design? Because designing a protocol without understanding the underlying friction is premature. We need to know *what* we are coordinating *on*.
      *   **Success/Failure:**
          *   *Success:* A formal model showing where the race incentive disappears based on information structure, or a proof that it's invariant.
          *   *Failure:* Inability to formalize "commitment" in a way that distinguishes it from ordinary strategy.
      *   **Scoping:** Acknowledge this won't solve AI alignment, but clarifies a specific bottleneck.

  4.  **Refining the "Settled vs. Contested" Constraint:**
      *   I need to be careful not to say "Everyone agrees X." Instead, "It is widely acknowledged that..." vs "There is disagreement regarding..."
      *   Specifically, the prompt asks to separate settled from contested *throughout* the proposal. I should weave this into the narrative rather than having a single bullet point list, or have a specific section that highlights it clearly. Let's integrate it into the "Background and Open Questions" section for flow, but ensure the language is precise.

  5.  **Refining the Scope (One Year):**
      *   Don't promise a new decision theory.
      *   Don't promise a deployed protocol.
      *   Promise a *model* and a *taxonomy*.
      *   Month-by-month needs to look realistic. (e.g., Months 1-3: Lit review + Formalization. Months 4-6: Simulations. Months 7-9: Case studies/AI specificities. Months 10-12: Writing).

  6.  **Drafting the Content (Iterative refinement):**

      *   *Question:* "Does the incentive to race stem primarily from the *timing* of commitments or the *transparency* of the commitment mechanism?" -> Let's go with: "Under what information structures does the incentive to commit early persist across standard decision-theoretic architectures?"
      *   *Why not protocol design?* Because if we don't know if the problem is the *reasoning* or the *channel*, building a channel is guessing.
      *   *Success:* A theorem or simulation result that isolates the variable.
      *   *Failure:* The model is too abstract to map to AI systems.

  7.  **Review against Constraints:**
      *   Two pages? (Need to keep word count tight, approx 1000-1200 words).
      *   Precise question? Yes.
      *   Why existing framings fail? Yes (they assume commitment is atomic).
      *   Month-by-month? Yes.
      *   Why this approach? Yes (Foundational analysis vs. engineering).
      *   Success/Failure? Yes.
      *   Scoped? Yes.
      *   Settled/Contested distinction? *Crucial.* I will add explicit phrasing like "While it is generally accepted that..., it remains contested whether..."

  8.  **Final Polish:**
      *   Check tone. Ensure it sounds like a researcher talking to peers.
      *   Ensure the distinction between "coordination problem" and "decision theory problem" is clear.
      *   Make sure the "Settled vs. Contested" instruction is visibly respected.

