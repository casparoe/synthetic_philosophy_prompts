      *(Self-Correction on Scoping)*: A full formal proof might be too ambitious for a year if the definitions are slippery. I should frame it as "Developing a formal framework and preliminary results" rather than "Proving Theorem X."

      *(Checking the "Settled/Contested" instruction again)*: The prompt says "throughout the proposal, separate what is settled from what is genuinely contested." I need to make sure I don't just do this in one section. I will use phrasing that highlights this distinction in the problem statement, the methodology justification, and the expected outcomes.

  9.  **Final Word Count Check:** A standard two-page single-spaced proposal is roughly 1000-1200 words. I will aim for that density.

      *(Final Plan)*:
      1. Title
      2. Project Summary & Research Question
      3. Background: Settled vs. Contested
      4. Methodology & Work Plan (Month-by-Month)
      5. Why Analysis over Protocol Design
      6. Success/Failure Conditions
