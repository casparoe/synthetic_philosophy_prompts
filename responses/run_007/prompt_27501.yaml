      *   **Orwellian:** The brain presents Dot 1 immediately, then retroactively edits the memory/experience once Dot 2 arrives. (Edit after presentation).
      *   **Dennett's View (Multiple Drafts):** There is no "Cartesian Theater." There is no single moment of "consciousness." There are parallel streams of processing. The question "when did it become conscious?" is ill-posed because there's no finish line.

  3.  **Translate to Systems Vocabulary:**
