answer: |-
  Here is a structured plan for your 50-minute tutorial. It is designed to move students from a concrete intuition about fairness to an abstract understanding of aggregation logic, without relying on the standard "torture vs. headaches" intuition pump.

  ### **Session Goal**
  By the end of the tutorial, students should be able to identify that the Separateness-of-Persons objection is not about the *amount* of utility sacrificed, but about the *logical category error* of summing utilities across distinct agents as if they were distinct moments in a single life.

  ### **The Carrying Example: "The Overtime Lottery"**
  Do not use physical pain or medical triage. Use **leisure time**. It is fungible, quantifiable, and relatable, but lacks the visceral "rights violation" trigger of bodily harm.

  *   **Scenario:** A team of 5 employees must complete a project to save the company. It requires 40 hours of overtime this weekend.
  *   **Option A (Distribution):** Each employee works 8 hours. Everyone loses a portion of their weekend.
  *   **Option B (Concentration):** One employee (chosen by lottery) works 40 hours. The other four have their weekends completely free.
  *   **Utility Assumption:** Stipulate for the sake of argument that the marginal disutility of labor increases. (i.e., The 1st hour of work is annoying; the 40th hour is miserable). However, the *total* negative utility of one person working 40 hours is *less* than the sum of five people working 8 hours each. (4 people have 100% happy weekends > 1 person has a 0% happy weekend).
  *   **Utilitarian Verdict:** Option B is morally obligatory. It maximizes net utility.

  ---

  ### **Tutorial Sequence (50 Minutes)**

  #### **1. Setup and Utilitarian Calculation (0–10 mins)**
  *   **Action:** Present the "Overtime Lottery" scenario. Write the utility numbers on the board.
  *   **Task:** Ask students to verify the Utilitarian calculation. Confirm that, given the stipulated numbers, Option B produces more total utility.
  *   **Dependency:** You must secure their agreement that Utilitarianism *demands* Option B before you can challenge *why* it demands it. If they dispute the math, the structural point is lost.
  *   **Pedagogical Move:** Ask: "How many of you feel Option B is wrong, even if it maximizes utility?" (Show of hands).

  #### **2. The Prudence Analogy (10–25 mins)**
  *   **Action:** Introduce the structural analogy. This is the core of the session.
  *   **Explanation:** Ask students to imagine a **single person** planning their own month.
      *   *Case:* I work 40 hours this week (suffering) so I can take next week off (pleasure).
      *   *Logic:* We accept this sacrifice because the "sufferer" and the "beneficiary" are the same person. The loss is *compensated* within the same life.
  *   **The Pivot:** Explain that Utilitarianism treats the group of 5 employees exactly like the single person over time. It assumes the loss to the one worker is "compensated" by the gain to the four others, simply because the *sum* is higher.
  *   **The Objection:** The Separateness-of-Persons objection claims this is a category error. Compensation only makes sense *within* a life. You cannot use my weekend to pay for your weekend, because we are not the same entity.
  *   **Dependency:** This depends on Step 1. Students must see the Utilitarian logic clearly to recognize that it is applying the logic of *prudence* (intrapersonal) to *benevolence* (interpersonal).

  #### **3. Managing Misconceptions (25–40 mins)**
  *   **Action:** Open the floor for objections. Students will naturally reach for the three misconceptions. Do not wait for them to arise; introduce them as "Common Pushbacks" to test the theory.
  *   **Dependency:** This depends on Step 2. You need the "Prudence Analogy" established to defuse these. Without it, their objections will stick.

      *   **Misconception 1: The Demandingness Objection.**
          *   *Likely Surface:* "It's just too hard to ask one person to work 40 hours."
          *   *Defuse:* "Imagine the shift was only 2 hours vs. 20 minutes each. The total utility still favors the concentration. The objection holds even if the burden is tiny. It's not about the *size* of the burden, but the *authority* to assign it across persons."
      *   **Misconception 2: The Rights Objection.**
          *   *Likely Surface:* "But the worker has a right to their weekend!"
          *   *Defuse:* "Rights are the *solution* we might propose to fix this, not the *problem* itself. The Separateness Objection explains *why* we think rights are needed in the first place. If we treat people as one big container of utility, rights make no sense. We are diagnosing the engine, not just listing the crash damage."
      *   **Misconception 3: The Epistemic/Calculus Objection.**
          *   *Likely Surface:* "But how can we know the 40-hour shift is actually less painful? We can't compare utilities."
          *   *Defuse:* "Recall our lecture on interpersonal comparisons. For this tutorial, assume we have a 'utility meter' and we *know* Option B creates more utility. The objection says Option B is wrong *even if* we know for a fact it creates more utility."

  #### **4. Structural Implications (40–45 mins)**
  *   **Action:** Summarize the shift in perspective.
  *   **Point:** Utilitarianism is concerned with the **Sum of Good**. The Separateness Objection says we must be concerned with the **Distribution of Good** among distinct entities.
  *   **Scope Setting:** Explicitly state what you are *not* covering.
      *   "We are not discussing Rule Utilitarianism (which might solve this by rules)."
      *   "We are not discussing Contractarianism or Rawls' Theory of Justice (which builds on this objection)."
      *   "We are focusing solely on why Act Utilitarianism's aggregation logic is structurally distinct from how we view individual lives."

  #### **5. Diagnostic Question (45–50 mins)**
  *   **Action:** Pose the following question for a written response or show of hands. This is designed to fail students who conflate the objection with demandingness or rights.

  > **Question:** "A Utilitarian responds to the Overtime Lottery case by saying: 'Okay, we will force one person to work 40 hours, but we will ensure that the burden is so small it barely affects their life, while the benefit to the others is huge.'
  >
  > Does the Separateness-of-Persons objection still apply to this modified case? Why?"

  *   **Correct Grading Key:**
      *   **Fail (Misconception):** "No, because it isn't demanding anymore." (Confuses objection with demandingness).
      *   **Fail (Misconception):** "Yes, because they still have a right not to work." (Confuses objection with rights theory).
      *   **Pass (Structural):** "Yes, because it still treats the group as a single entity. Even a small burden cannot be transferred across persons simply to maximize the sum, because there is no 'super-person' to receive the compensation."

  ---

  ### **Why This Sequence Works**
  1.  **Example First:** First-years need concrete grounding before abstract meta-ethics. The "Overtime" case is mundane enough to prevent emotional shutdown but clear enough to show aggregation.
  2.  **Prudence Analogy Second:** This is the bridge. Without comparing *intrapersonal* trade-offs to *interpersonal* trade-offs, the objection sounds like a complaint about fairness. The analogy reveals the *metaphysical* claim about persons.
  3.  **Misconceptions Third:** You can only correct the "Rights" and "Demandingness" errors once they understand the "Prudence" analogy. The analogy provides the vocabulary to distinguish the structural flaw from practical difficulties.
  4.  **Diagnostic Last:** The question forces them to apply the structural logic to a case where the "Demandingness" and "Rights" intuitions are minimized, isolating the aggregation variable.

  ### **Scope: What to Set Aside**
  Openly tell students: *"Today we are analyzing a flaw in the **logic** of Act Utilitarianism. We are not solving it. We are not discussing whether Rights or Contracts fix it, and we are not discussing whether Rule Utilitarianism avoids it. Those are solutions for future weeks. Today is purely about the diagnosis."*

  This prevents the tutorial from drifting into a debate about political philosophy (Rawls/Nozick) which they are not prepared for, and keeps the focus on the moral arithmetic they learned in lecture.
