      *   *Evaluation of (4) Self-binding:* This is a second-order rationality argument (bounded rationality/heuristics). If an agent knows they are prone to quitting good projects prematurely, a rule "don't quit once started" might maximize long-term utility even if it leads to suboptimal choices in specific instances. This is rational from a meta-perspective.
