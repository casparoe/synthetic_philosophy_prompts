prompt: |-
  I'm a product manager at a mid-size tech company, overseeing the team that builds our content recommendation system. For the past two quarters our north-star metric has been daily active minutes — total time users spend on the platform per day. The metric is up 18%, and leadership is pleased. But I've been digging into the data, and the gains are concentrated in outrage-bait: posts that make people angry, anxious, or envious, which they then spend twenty minutes hate-scrolling through. User satisfaction surveys are flat or slightly down. When I raised this, our VP of growth said to add a satisfaction metric to the objective function. But I can already see how that gets gamed — satisfaction surveys are easy to nudge with well-timed prompts, and if we weight them heavily enough to counteract the engagement incentive, the algorithm will simply learn to serve content that makes people feel satisfied in the moment while still wasting their time.

  I've read enough to recognize the shape of the problem — Goodhart's law, specification gaming, the whole cluster. But the blog posts I've read are long on diagnosis and short on prescription, and I'm trying to figure out what to actually do on Monday. Specifically: is there a principled distinction between "we picked the wrong metric" and "any metric we pick will eventually be gamed under sufficient optimization pressure"? If the latter is true, what does a sane response look like — weaker optimization, keeping a human in the loop, or something else entirely? And if I can't fix the incentive structure from my role, is there a way to design the metric such that the failure mode becomes visible early, before it does real damage?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **Role:** Product Manager (mid-size tech company).
      *   **Domain:** Content recommendation system.
      *   **Current North-Star Metric:** Daily Active Minutes (up 18%).
      *   **Problem:** Gains driven by negative engagement (outrage, anxiety, envy). User satisfaction is flat/down.
      *   **Leadership Stance:** VP of Growth suggests adding satisfaction to the objective function.
      *   **User's Concern:** Satisfaction metrics can be gamed (prompt timing, short-term dopamine vs. long-term value). Recognizes Goodhart's Law/Specification Gaming.
      *   **Core Questions:**
          1.  Is there a distinction between "wrong metric" vs. "all metrics get gamed"?
          2.  If all get gamed, what's a sane response (weaker optimization, human-in-loop, etc.)?
          3.  If I can't fix incentives, how do I design metrics to reveal failure modes early?
      *   **Goal:** Actionable advice for Monday.

  2.  **Deconstruct the Core Questions:**

      *   *Question 1: Wrong Metric vs. Inevitable Gaming.*
          *   Insight: It's not binary. Some metrics are *more* robust than others. "Time spent" is notoriously fragile because it conflates "flow state/value" with "addiction/friction." "Satisfaction" is fragile because it's subjective and manipulatable.
          *   Distinction: The problem isn't just the metric; it's the *objective function* (what the model optimizes) vs. the *guardrails* (what the business constrains).
          *   Key Concept: Proxy vs. True Goal. Time is a proxy for Value. Satisfaction is a proxy for Value. Both drift.

      *   *Question 2: Sane Response to Inevitable Gaming.*
          *   Insight: You cannot optimize a single number forever. You need a *portfolio* of metrics.
          *   Strategy: Constrained Optimization. Maximize Engagement *subject to* Retention/Satisfaction thresholds.
          *   Strategy: Human-in-the-loop isn't scalable for recs, but *Human-in-the-design* is.
          *   Strategy: Weaker optimization? Maybe regularization, but better to change *what* is optimized.
          *   Key Concept: Multi-objective optimization with hard constraints.

      *   *Question 3: Early Warning Systems.*
          *   Insight: Need "canary metrics" or "counter-metrics."
          *   Strategy: Measure long-term retention, not just daily. Measure negative feedback (hides, mutes, reports). Measure return rate (do they come back tomorrow?).
          *   Key Concept: Lagging indicators of health.

  3.  **Drafting the Advice (Iterative Process):**

      *   *Acknowledge and Validate:* Start by validating their intuition. They are right. This is a classic "engagement trap."
      *   *Address Q1 (Wrong vs. Inevitable):* Explain that *all* proxies drift, but some drift faster. Time-on-site is a "high-drift" proxy. The distinction is between *direct* measurement of value (hard) vs. *behavioral* proxies (easy to game).
      *   *Address Q2 (Sane Response):*
          *   Don't just add satisfaction to the loss function (VP's idea). That leads to "survey bait."
          *   Propose **Constrained Optimization**. Maximize engagement *provided that* retention/satisfaction doesn't drop below X.
          *   Propose **Long-term Value (LTV)** proxies. 7-day retention is harder to game than 1-day minutes.
          *   Propose **Negative Signals**. Explicitly optimize *against* hides/mutes/reports.
      *   *Address Q3 (Early Warning):*
          *   Define "Counter-Metrics." If Engagement goes up, what *must* stay stable? (e.g., Day-7 retention, NPS, churn rate).
          *   Set up **Alerting**. If Engagement $\uparrow$ and Retention $\downarrow$, trigger a review.
      *   *Actionable Monday Plan:*
          *   Don't argue philosophy with the VP. Speak their language (risk, retention, LTV).
          *   Propose a "Health Dashboard" alongside the North Star.
          *   Suggest a specific experiment design (A/B test with long-term holdouts).

  4.  **Refining the Concepts (Self-Correction/Nuance):**
      *   *Correction:* The VP said "add satisfaction to the objective function." I need to explain why that's technically risky (reward hacking) without sounding like I'm rejecting leadership.
      *   *Nuance:* Differentiate between *in-app* satisfaction (clicks) and *post-session* satisfaction (surveys).
      *   *Nuance:* Mention "Time Well Spent" frameworks (Center for Humane Tech) as industry context.
