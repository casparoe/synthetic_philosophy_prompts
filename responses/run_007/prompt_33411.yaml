prompt: |-
  I'm a product manager at a mid-sized SaaS company. I've recently been assigned to design our AI-automation roadmap, and in trying to think seriously about what happens to the people whose work gets automated, I stumbled onto Marx's "Fragment on Machines" from the Grundrisse. I don't have a background in philosophy or political economy, so I'm not confident I'm reading him right. But I do have fluency in the vocabulary of my trade: user stories, product roadmaps, OKRs, technical debt, build-versus-buy, deprecation, success metrics, stakeholder alignment, and so on.

  Restate Marx's core argument about automation — the relationship between machinery, fixed capital, living labor, and what he calls the "general intellect" — in that product-management vocabulary. Deliver the restatement as exactly five numbered items, each a sentence or two, with no introduction or conclusion. Each item should isolate one specific claim from Marx's account, translate it into my vocabulary, and then note whether the translation is clean, distorted, or impossible. For the items that do not translate cleanly, tell me whether the residue points to a limitation of the product-management framework, a limitation of Marx's analysis, or something genuinely incommensurable between the two. I want to know whether my professional vocabulary is helping me see something real about automation or quietly screening me from what Marx was actually saying.
