      *Drafting Item 5:*
      Marx suggests automation could liberate humans for artistic and scientific development outside the production process. We reframe this as freeing capacity for "higher-value strategic initiatives," which is a distorted translation that confines the possibility of freedom within the logic of continued productivity rather than life beyond work.

