  2.  **Deconstruct Marx's "Fragment on Machines":**
      *   *Core Concept 1: Fixed Capital vs. Living Labor.* Machinery (fixed capital) absorbs knowledge/science (general intellect) and reduces the need for direct human labor (living labor) in production.
      *   *Core Concept 2: General Intellect.* Knowledge becomes a direct force of production, embedded in machines, not just in workers' heads.
      *   *Core Concept 3: Crisis of Value.* Since value is based on labor time, and machines reduce labor time to near zero, the capitalist basis of value (exchange value) collapses or becomes contradictory.
      *   *Core Concept 4: Liberation vs. Immiseration.* Automation *could* free humans for creative activity, but under capitalism, it leads to unemployment or precarious work because income is tied to labor time.
      *   *Core Concept 5: The Subject/Object Flip.* The worker becomes an appendage to the machine; the machine system becomes the subject, the human the object.

  3.  **Map to PM Vocabulary:**
      *   *Fixed Capital* -> Tech stack, automation tools, infrastructure.
      *   *Living Labor* -> Human effort, manual workflows, headcount.
      *   *General Intellect* -> Collective knowledge base, AI models, documented processes, institutional memory.
      *   *Value/Exchange Value* -> Metrics, ROI, OKRs, revenue recognition.
      *   *Crisis* -> Technical debt, business model risk, market disruption.
      *   *Worker/Appendege* -> User experience, workflow integration, human-in-the-loop.

