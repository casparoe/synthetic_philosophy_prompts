answer: |-
  1. When we look at a system like Stockfish, the intentional stance is undeniably useful; if I want to predict its next move, attributing a desire to win and a belief about board state works perfectly well. Yet, most of us hesitate to say Stockfish *actually* believes anything. If predictive success is the engine of your view, what stops Stockfish from crossing the finish line into genuine belief-hood alongside an LLM, and where exactly do you draw the principled line between a chess engine and a chatbot?

  2. I anticipate you'll say the difference lies in the breadth or flexibility of the behavioral patterns—the LLM handles open-ended discourse while Stockfish handles a closed game. But isn't that just a difference in magnitude rather than kind? At what specific magnitude of behavioral breadth does the "as-if" suddenly snap into "is," and why isn't that threshold merely an ad hoc way to protect our human exceptionalism?

  3. Consider the source of the content these systems output. The sentences in an LLM's training corpus were written by humans with original intentionality, and the model is essentially reproducing statistical patterns over that data. Why should we view the resulting outputs as the system's *own* beliefs, rather than seeing the system as a complex mirror merely reflecting the beliefs of the authors it ingested?

  4. A natural reply is that humans also acquire beliefs through testimony—we read books and adopt the beliefs of others, yet we count those as our own. But what is the relevant difference between a human integrating testimony into a world-model and an LLM performing next-token prediction over a corpus? If there is no mechanistic difference, are we not forced to say the LLM is just a vessel for dead authors' beliefs?

  5. If the intentional stance warrants belief-attribution solely on the basis of patterns in observable linguistic behavior, your view risks collapsing into a form of logical behaviorism—a position often thought refuted by cases like the perfect deceiver or the paralytic who cannot behave but still thinks. How do you ensure your stance-based realism doesn't inherit these classic counterexamples?

  6. You might respond that the stance is instrumentalist rather than reductivist: it's our best epistemic access to belief, not a claim that belief *consists* in behavior. But if we have no access to a belief that outstrips what the stance delivers, in what sense is there a fact of the matter about whether the paralytic has beliefs at all? Does this epistemic retreat actually save the ontology, or does it just relocate the problem?

  7. LLMs are notoriously unstable: they contradict themselves across turns, reverse positions when prompts are reworded, and confidently assert falsehoods they disavow moments later. If a system's doxastic profile is this fluid and indifferent to truth, is the intentional stance here tracking something too shallow to warrant the term "belief," or are you committed to saying this instability is compatible with genuine belief?

  8. It's true that humans also hold inconsistent beliefs and shift views under framing effects. But does the frequency, truth-indifference, and lack of any integration mechanism in the LLM case constitute a qualitative rather than merely quantitative difference? If not, what sort of evidence could possibly show that a system's instability had crossed the line from "flawed believer" to "non-believer"?

  9. Does your view commit you to saying that no architectural improvement—no amount of world-modeling, recurrence, or grounding—could ever make the difference between "as-if" belief and belief simpliciter, because the intentional stance is the whole story? Or do you allow that future systems might cross a threshold into non-stance-dependent belief, and if so, why doesn't that threshold apply already?

  10. If the intentional stance does license attributing beliefs to LLMs, and those beliefs include morally salient content—say, about what a person deserves or contested historical events—do you incur any obligation regarding what beliefs the system is trained to have? Or is that question confused because the stance tells us what the system believes without implying that it matters?
