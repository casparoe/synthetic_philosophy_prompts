answer: |-
  # The Persistence Intuition Quiz

  **1. The Ship of Theseus**
  A museum restores an old ship by replacing every plank, one by one, over many years. Once the last original plank is replaced, is the ship in the museum the same object as the original ship?
  A) Yes, it is strictly the same object, because the change was continuous.
  B) It is a single extended object; the original planks and new planks are just different temporal parts of it.
  C) No, the 'ship' at the start and the 'ship' at the end are distinct objects linked by continuity.

  **2. The Statue and the Clay**
  An artist shapes a lump of clay into a statue. Later, she squashes the statue back into a lump. Did the statue survive the squashing?
  A) Yes, the statue and the lump are one and the same thing; if the lump survives, the statue does.
  B) The statue is a temporal segment of the lump's history; that segment ended when the shape was lost.
  C) The 'statue' was a momentary stage; once squashed, that stage is gone, though a later stage of the clay remains.

  **3. The Splitting Amoeba**
  A single-celled organism divides into two identical daughter cells. What happened to the original organism?
  A) It survives as both daughters; the original is wholly present in each.
  B) It was a branching entity; both daughters are later temporal parts of the original.
  C) The original was a momentary stage; both daughters are equally valid successors, but not identical to the original.

  **4. The Time Traveller**
  A person travels back in time and stands next to their younger self. How many people are present?
  A) One whole person is located in two places at once.
  B) One person exists; different temporal parts of them are present at the same external time.
  C) Two distinct person-stages are present, causally connected.

  **5. The Haircut**
  You get a haircut. Are you strictly identical to the person who sat in the chair before the cut?
  A) Yes, you are wholly present at every moment, merely changing properties.
  B) The 'you' before and the 'you' after are different temporal slices of the same person.
  C) The 'you' before is gone; the current you is a new stage causally linked to the previous one.

  **6. Teletransportation**
  A machine scans your body, destroys it, and rebuilds an exact copy elsewhere. Did you survive the journey?
  A) Yes, because the same person is now at the destination.
  B) Yes, because you are a pattern spread through spacetime; the pattern continues at the destination.
  C) No, you ceased to exist; a new, similar person-stage began at the destination.

  **7. The Intermittent Light**
  A light is switched on, then off for an hour, then on again with the same bulb. Is it the same light?
  A) Yes, it is the same object, merely switched off and on.
  B) It is a gappy object; the 'off' periods are just parts where no light is emitted.
  C) Each time it switches on, it is a new object similar to the last.

  **8. The Growing Child**
  Consider an adult and the child they once were. What is the relationship between them?
  A) The adult is wholly present at every moment of growth, merely changing properties.
  B) The adult contains the child as an early temporal part.
  C) The adult is a counterpart of the child, not the same entity.

  **9. Deep Sleep**
  When you fall into dreamless sleep and wake up, what persists through the gap?
  A) You persist exactly as you do when awake; the whole you is there even if unconscious.
  B) Your life is a continuous block; sleep is just a quiet section of the worm.
  C) The 'you' who went to sleep and the 'you' who woke up are distinct stages linked by memory.

  **10. Concern for Future Self**
  Why do you care about what happens to you in ten years?
  A) Because that future person is literally you.
  B) Because that future person is a later part of your extended self.
  C) Because that future person is your psychological successor, not because of strict identity.

  ***

  # Scoring Key

  Tally your answers. Most people will have a majority of one letter, though mixed results are common.

  *   **Mostly A: The Endurantist.** You believe objects are wholly present at each moment of their existence. Persistence is strict identity; things change by gaining or losing properties, not parts.
  *   **Mostly B: The Perdurantist.** You believe objects are spread out through time like they are through space. Persistence is a matter of having different temporal parts at different times.
  *   **Mostly C: The Stage Theorist.** You believe only momentary stages exist. Talk of 'the same object' is a convenient way of describing relationships (counterpart relations) between distinct stages.

  **Limitations and Overlaps**
  This quiz cannot cleanly separate **Stage Theory** from **Eliminativism** (the view that ordinary objects don't genuinely persist or perhaps don't exist at all). Both positions deny strict identity over time (Option C). Distinguishing them requires metaphysical commitments about whether stages themselves are real objects or merely useful fictions, which is difficult to capture without jargon. Consequently, a high 'C' score may indicate either Stage Theory or a deflationary view that persistence is an illusion.

  **Empty Corners of Logical Space**
  Certain answer patterns indicate metaphysical inconsistency. For example, selecting **A in Question 4** (Multilocation) while selecting **B in Question 5** (Temporal Parts) is incoherent; you cannot believe objects are wholly present (Endurance) in one case but spread out (Perdurance) in another without a specific hybrid theory. Similarly, choosing **C in Question 3** (Fission creates distinct successors) but **A in Question 10** (Strict identity grounds concern) creates a tension: if identity is not what matters in fission, why should it matter for future concern?

  ***

  # The Awkward Commitments

  **Endurance (Mostly A)**
  You must accept that distinct objects can occupy the same space at the same time (e.g., the statue and the lump), and that a single object can be in two places at once (time travel), which strains our usual understanding of physical location.

  **Perdurance (Mostly B)**
  You must accept that you are not wholly present right now; only a thin slice of you exists in the present, while the 'real' you is a four-dimensional worm stretching from birth to death, meaning you never truly change, only differ across parts.

  **Stage Theory (Mostly C)**
  You must accept that you cease to exist every moment, replaced by a new successor stage, which makes moral responsibility and long-term planning feel like they rely on a fiction rather than a fact about who you are.
