answer: |-
  This is a profound observation that cuts to the core of contemporary environmental ethics. You have identified what I will call the **Responsibility-Efficacy Gap**: the dissonance between assigning robust moral obligation to individual agents while simultaneously conceding the causal negligibility of those agents' actions regarding the outcome in question.

  As a philosopher working in collective action, I argue that the practice of Carbon-Footprint Exhortation (CFE) is not theoretically empty, but it is theoretically *hybridized* and *unstable*. It does not rely on a single coherent ethical framework. Instead, it constructs a patchwork justification that shifts depending on which objection is being raised.

  Here is a reconstruction of the implicit theory of moral responsibility presupposed by CFE, an analysis of its consistency, and a mapping of its philosophical underdetermination.

  ### I. Dissolving the Inefficacy Objection: From Causation to Participation

  The standard philosophical challenge to individual climate action is the **Inefficacy Objection** (often associated with Walter Sinnott-Armstrong). It posits that if an individual act (e.g., one flight) does not cross a causal threshold to worsen climate change (e.g., trigger a specific storm or melt a specific glacier), then act-consequentialism provides no reason to refrain.

  Since CFE practitioners concede the "rounding error" point, the practice *cannot* presuppose Act-Consequentialism. If it did, it would be advising irrational behavior. Therefore, CFE implicitly rejects the premise that **moral responsibility requires causal efficacy.**

  Instead, the practice presupposes a theory of **Complicity or Participation**. On this view, morality is not solely about *outcomes* (what I cause) but about *relationship to harm* (what I join). By purchasing carbon-intensive goods, I am not necessarily *causing* the warming, but I am *participating* in the unjust structure that produces it.

  *   **Implicit Commitment 1:** Moral agency persists even when causal leverage is absent.
  *   **Implicit Commitment 2:** There is a duty to keep one's own "hands clean" regarding harmful systems, independent of whether cleaning them changes the system.

  This moves the locus of evaluation from the *consequence* of the act to the *nature* of the act itself. This is the first pivot away from standard utilitarianism.

  ### II. Reconstructing the Normative Framework

  If CFE is not Act-Consequentialist, what is it? It does not rely on one theory but rather oscillates between three, deploying them strategically to ward off different doubts.

  **1. The Kantian Universalizability Test (The Rhetorical Shield)**
  When challenged on efficacy, CFE often retreats to: *"But what if everyone did that?"* This is a Kantian move. It shifts the question from "Does my act cause harm?" to "Can the maxim of my act be willed as a universal law?"
  *   *Function:* This bypasses the causal threshold problem. It doesn't matter if *my* flight warms the planet; it matters that a world where *everyone* flies as I do is unsustainable.
  *   *Limitation:* Strict Kantianism requires acting from duty, not just conformity. CFE rarely demands the rigorous introspection of the Categorical Imperative; it uses universalizability as a heuristic for harm, not a test of rationality.

  **2. Rule-Consequentialism (The Normative Glue)**
  CFE implicitly argues that widespread compliance with low-carbon norms is good, and therefore I ought to follow the norm to support its existence.
  *   *Function:* This addresses the coordination problem. If I follow the norm, I signal that the norm is viable, potentially encouraging others (a signaling effect).
  *   *Limitation:* Rule-consequentialism usually collapses into act-consequentialism if the rule clearly produces no good in a specific instance. CFE ignores this collapse.

  **3. Virtue Ethics (The Emotional Core)**
  This is the strongest implicit commitment. Slogans like "Be the change" or "Do your part" are appeals to character, not outcomes. The claim is that a virtuous agent (a responsible citizen, a steward of the earth) simply *does not* engage in wasteful consumption, regardless of the global impact.
  *   *Function:* This sustains moral obligation when efficacy is denied. It makes carbon footprinting a matter of **integrity**.
  *   *Limitation:* Virtue ethics is agent-centered. It risks becoming self-indulgent ("I am a good person because I line-dry") rather than world-changing.

  **Synthesis:** The implicit theory is **Participatory Integrity**. It claims that individuals have a duty to align their personal conduct with the solution they wish to see, primarily to maintain moral integrity and secondarily to support social norms, even if the causal impact is negligible.

  ### III. The Consistency Test: The Consumption Bias

  You ask if the practice is internally consistent. If we take "Participatory Integrity" seriously, does it require voting, career choice, or organizing?

  **The Verdict: No, the practice is not internally consistent.**

  If the moral weight comes from *complicity in harm* or *integrity of character*, then **political inaction is arguably more culpable than carbon consumption.**
  *   **Causal Leverage:** Voting, organizing, and career choices (e.g., working for a renewable startup vs. an oil major) have vastly higher expected causal utility than line-drying laundry.
  *   **Complicity:** If I vote for politicians who dismantle climate regulations, I am more complicit in structural harm than if I eat a burger, yet CFE rarely frames voting as a strict moral obligation in the same way it frames diet.

  **Why the Inconsistency?**
  The practice presupposes a **Sphere of Control Bias**. It assumes the private sphere (consumption) is the domain of moral freedom, while the public sphere (politics) is the domain of constraint or uncertainty.
  *   *Philosophical Error:* This contradicts the earlier admission of causal negligibility. If my consumption doesn't matter causally, why is it the privileged domain of action? If integrity is the goal, political integrity matters more.
  *   *Structural Explanation:* The inconsistency suggests the practice is not driven by the philosophical theory it presupposes, but by **institutional constraints**. NGOs and corporations can measure consumption easily; they cannot easily measure or mandate political radicalism. Furthermore, emphasizing consumption avoids antagonizing the political donors or corporate partners who fund the campaigns.

  Therefore, the practice is **pragmatically selective**. It applies the theory of Participatory Integrity rigorously to market behaviors but laxly to civic behaviors. This is a philosophical failure, even if it is a marketing success.

  ### IV. Philosophical Underdetermination

  Finally, we must distinguish what the practice *presupposes* from what merely *fits* it. The practice is philosophically underdetermined, meaning multiple rival theories can justify it, which allows practitioners to avoid committing to the difficult implications of any single one.

  **1. What is Strictly Presupposed:**
  *   **Individual Agency:** That individuals retain moral agency within structural constraints. (This is contested by hard structuralists).
  *   **Non-Causal Responsibility:** That one can be responsible for outcomes one does not causally determine.
  *   **Commensurability:** That diverse acts (flying, eating, voting) can be reduced to a single metric (carbon tons) for moral comparison.

  **2. What Merely Fits (But is Not Required):**
  *   **Neoliberal Governance:** The idea that the market is the primary site of political change. CFE fits this perfectly, but a Socialist could also support CFE as "prefigurative politics" (building the new society within the shell of the old).
  *   **Perfectionism:** The idea that we must be morally perfect. CFE fits this, but a "satisficing" consequentialist could also support it as a "good enough" heuristic for the masses.

  **3. The Points of Underdetermination:**
  *   **The Threshold Question:** CFE does not specify *how much* sacrifice is required. Is it "reduce where possible" (moderate) or "zero carbon" (radical)? A Virtue Ethicist might say "it depends on the agent," while a Rule-Consequentialist might say "follow the scientific target." The practice hedges here to maximize participation.
  *   **The Substitution Effect:** CFE implies that reducing footprint in Area A (diet) compensates for footprint in Area B (flying). This presupposes a **Fungibility of Moral Credit**. A Kantian would reject this (duties are distinct); a Consequentialist would accept it (tons are tons). CFE treats them as fungible to allow flexibility, borrowing from Consequentialism without accepting its demandingness.

  ### Conclusion: The Theory of "Symbolic Participatory Responsibility"

  To answer your core question: The practice presupposes a theory I would label **Symbolic Participatory Responsibility**.

  It claims that in the face of collective action problems where individual causal efficacy is null, moral agents are nevertheless obligated to perform **symbolic acts of alignment** with the collective good. These acts serve two functions:
  1.  **Internal:** Maintaining the agent's moral integrity (Virtue Ethics).
  2.  **External:** Signaling commitment to a norm to encourage broader compliance (Rule-Consequentialism).

  **Is it consistent?** No. By focusing disproportionately on consumption over political action, it violates its own logic of efficacy (where politics wins) and integrity (where civic duty is paramount).

  **Is it underdetermined?** Yes. It borrows the *urgency* of Consequentialism ("the house is on fire"), the *duty* of Deontology ("do your part"), and the *character focus* of Virtue Ethics ("be the change"), while evading the *demandingness* of the first, the *rigor* of the second, and the *holism* of the third.

  **Philosophical Recommendation:**
  If you wish to make this practice consistent, you must either:
  1.  **Embrace the Political:** Elevate voting, organizing, and career choice to the same level of moral urgency as diet and travel.
  2.  **Embrace the Symbolic:** Admit frankly that these actions are primarily about integrity and signaling, not direct harm reduction, and stop implying that they "save the planet" in a causal sense.

  The current tension exists because the practice wants the causal credit of the former while relying on the moral logic of the latter.
