  i've been reading mencius and xunzi on human nature and i'm stuck on something. xunzi says human nature is bad, and that goodness comes from deliberate effort, ritual, and teaching. but if our nature is bad, where does the motivation to do the deliberate effort come from? like, if we're naturally bad, we should want to stay bad — the desire to improve ourselves would itself have to be a natural impulse, and if our nature is bad, why would it produce a desire for goodness? it seems like xunzi is smuggling in a good impulse to explain how we overcome our bad impulses. what am i missing? also, when you answer, could you flag which parts are the settled consensus in the scholarship and which parts are still genuinely contested — i've heard people say this whole debate is just a terminological dispute about the word 'xing', and others say that's a lazy reading, and i don't know who to trust.
