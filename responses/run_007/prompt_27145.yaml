prompt: |-
  You are an expert in moral psychology and organizational ethics, specializing in the situationist critique of virtue ethics and its practical implications for institutional design. Think through the underlying philosophical issues carefully before producing your final answer; start by mapping out what the situationist evidence actually licenses and what it doesn't, so your procedure doesn't overclaim.

  I run the ethics and professional-conduct office at a large teaching hospital (roughly 10,000 staff). For years our approach to ethical lapses has been character-based: train people in the relevant virtues, hold them individually accountable for violations, and try to hire people of good character. I've now read enough of the situationist literature—the Darley and Batson Good Samaritan study, the Milgram obedience work, the fundamental attribution error, John Doris's *Lack of Character*, and the broader argument that situational factors often swamp dispositional ones in predicting moral behavior—to think that our approach is, at best, seriously incomplete.

  The problem: I don't know how to translate this insight into a routine procedure my office can use. Every month I face a different ethical-behavior problem—medication errors that go unreported, unnecessary procedures driven by revenue pressure, disrespectful treatment of patients by overworked residents, billing irregularities, conflicts of interest in purchasing. For each one I need to decide whether this is primarily a situation problem (fix the defaults, the incentives, the physical environment, the chain of command, the way information is presented) or a character problem (train, select, model, remind), and if the former, what kind of situational fix.

  Please design a reusable decision procedure—a checklist or flowchart in words—that takes a specific ethical-behavior problem as input and walks the user through a sequence of questions to determine what kind of intervention is appropriate. Include:

  - The questions, in order, with what counts as a sufficient answer at each step.
  - Where the procedure stops with a recommendation and where it hands off to human judgment.
  - Honest flags about which steps rest on strong situationist evidence, which rest on weaker or extrapolated evidence, and which are philosophical judgment calls dressed as procedure.
  - What the procedure explicitly cannot do—its blind spots and limitations.

  Then apply the procedure to two hospital cases:

  1. Nurses and junior staff routinely fail to challenge attending physicians when they observe a clear error (wrong drug, wrong dose, wrong site), despite an explicit policy encouraging them to speak up.
  2. A pattern of systematic upcoding in billing, where the investigation strongly suggests it's driven by department-level pressure to meet revenue targets rather than by individual greed.

  For at least one of these cases, give me the answer the procedure produces even if it's one I—or the hospital leadership—will not want to hear.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case applications:

  1.  **Deconstruct the Request:**
      *   **Role:** Expert in moral psychology and organizational ethics (specializing in situationist critique).
      *   **Task:** Design a reusable decision procedure (checklist/flowchart) for an ethics office in a large teaching hospital (10k staff) to distinguish between "character problems" and "situation problems" and recommend interventions.
      *   **Requirements:**
          *   Map out what situationist evidence licenses vs. doesn't license (avoid overclaiming).
          *   Include ordered questions with sufficient answer criteria.
          *   Indicate stop points vs. hand-offs to human judgment.
          *   Flag evidence strength (strong situationist, weak/extrapolated, philosophical judgment).
          *   State limitations/blind spots.
          *   Apply to two specific cases (Hierarchy/Speaking Up; Systematic Upcoding).
          *   Provide an unwelcome answer for at least one case.
      *   **Tone:** Philosophical rigor, practical utility, honest about limitations.

  2.  **Initial Philosophical Mapping (The "Think Through" Phase):**
      *   *What does situationism actually say?* It doesn't say character *doesn't exist*; it says global character traits (robust across situations) are rare and poor predictors of behavior compared to situational variables. It highlights the Fundamental Attribution Error (FAE).
      *   *What does it NOT say?* It doesn't say *no one* has virtue. It doesn't say training is useless (though it questions efficacy of abstract virtue training). It doesn't absolve individuals of all responsibility (legal/moral accountability still matters, even if causation is situational).
      *   *The Tension:* The hospital wants accountability (character model). Situationism suggests fixing the system. The procedure must bridge this without denying agency entirely (which would be unethical/illegal) but without relying on the FAE.
      *   *The "Overclaim" Risk:* Assuming *every* failure is situational is just as dogmatic as assuming every failure is characterological. The procedure must test for situational salience first.
      *   *Key Situationist Levers:* Ambiguity, Authority/Hierarchy, Time Pressure, Diffusion of Responsibility, Incentive Structures, Physical/Cognitive Load.

  3.  **Drafting the Decision Procedure (The "SIT-SCAN" Protocol):**
      *   *Name:* Needs to sound professional. "Situational Integrity & Trait Assessment Scan" (SIT-SCAN).
      *   *Structure:* Funnel approach. Start with the strongest situationist predictors. Move to character only if situation is ruled out.
      *   *Step 1: Baseline Frequency & Distribution.* (Is this widespread? If yes, likely situational.)
      *   *Step 2: Situational Salience Check.* (Are known situational drivers present? Hierarchy, fatigue, ambiguity?)
      *   *Step 3: Incentive/Constraint Audit.* (Does the system reward/punish the behavior?)
      *   *Step 4: The "Good Person" Test.* (Would a reasonably conscientious person struggle here?)
      *   *Step 5: Character Intervention Viability.* (If situational fixes fail or aren't the cause, *then* look at character.)
      *   *Evidence Flagging:* Need to explicitly mark where Milgram/Zimbardo apply vs. where we are guessing.
      *   *Limitations:* Can't detect rare "bad apples," can't solve resource shortages, doesn't negate legal liability.

  4.  **Refining the Procedure (Self-Correction/Critique):**
      *   *Critique:* Is Step 4 too vague?
      *   *Fix:* Make it concrete. "If we swapped the actors, would the outcome likely remain?"
      *   *Critique:* Where is the hand-off?
      *   *Fix:* Explicitly state that disciplinary action (character) is a last resort, not a first step.
      *   *Critique:* Am I overclaiming situationism?
      *   *Fix:* Add a disclaimer that situationism explains *variance*, not *determinism*. People still choose.

  5.  **Developing the Case Applications:**
      *   *Case 1: Hierarchy/Speaking Up.*
          *   *Analysis:* Classic Milgram/authority issue. High power distance. Fear of retribution.
          *   *Verdict:* Situational. Fix the hierarchy/psychological safety, don't just train nurses to be "braver."
          *   *Unwelcome Truth:* You might have to discipline the *Attending* culture, not the Nurses. Or flatten the hierarchy.
      *   *Case 2: Upcoding/Revenue.*
          *   *Analysis:* Incentive structure. Systematic pressure.
          *   *Verdict:* Situational (Incentives).
          *   *Unwelcome Truth:* Leadership set the targets. The "ethical lapse" is a rational response to an unethical target. Fixing the target is required, not just firing billers.

  6.  **Finalizing the Output Structure:**
      *   **Part 1: Philosophical Grounding.** Briefly state what situationism allows us to claim.
      *   **Part 2: The Procedure (SIT-SCAN).** The checklist with flags.
      *   **Part 3: Limitations.** What this tool can't do.
      *   **Part 4: Case Applications.** Running the cases through the tool.
      *   **Part 5: The Unwelcome Answer.** Highlighting the hard truth.

  7.  **Drafting Content - Specific Considerations:**
      *   *Evidence Flags:* Use icons or bold text (e.g., **[Strong Evidence]**, **[Extrapolation]**, **[Normative Judgment]**).
      *   *Tone:* Professional, empathetic to the administrator's burden, but firm on the science.
      *   *The "Unwelcome Answer":* For the upcoding case, the unwelcome answer is that Hospital Leadership is the primary ethical violator, not the billing staff. For the hierarchy case, it's that "Speak Up" policies are useless without psychological safety mechanisms. Let's go with the Upcoding one as the primary "unwelcome" because it hits revenue.

  8.  **Review against Constraints:**
      *   Did I map evidence licenses? Yes (in intro).
      *   Is there a reusable procedure? Yes (SIT-SCAN).
      *   Are questions ordered? Yes.
      *   Are evidence flags included? Yes.
      *   Are limitations stated? Yes.
      *   Are both cases applied? Yes.
      *   Is there an unwelcome answer? Yes.

  9.  **Final Polish:** Ensure the distinction between "explaining" and "exculpating" is clear. Situationism explains behavior; it doesn't necessarily erase accountability, but it shifts the *locus of intervention*. (Self-correction: Ensure I don't sound like I'm saying "no one is responsible." The prompt asks for intervention design, not legal defense.)

  *(Self-Correction during drafting)*: I need to make sure I don't just say "fix the situation." I need to specify *how* the procedure decides *which* situational fix. The procedure needs to diagnose the *type* of situational pressure (e.g., authority vs. incentive vs. fatigue). I will add a sub-step for "Diagnosing the Situational Vector."

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Part 1: Philosophical Grounding & Evidence Mapping

  Before implementing the procedure, we must clarify what the situationist literature licenses. As an ethics officer, you need to know where the science ends and administrative judgment begins.

  **What Situationism Licenses:**
  1.  **The Primacy of Context:** When behavioral variance is high across similar individuals, situational variables (authority, time pressure, ambiguity, incentives) are statistically more predictive than dispositional traits (honesty, courage).
  2.  **The Fundamental Attribution Error (FAE):** We are cognitively biased to over-attribute others' failures to character and under-attribute them to context. The procedure must correct for this bias.
  3.  **Fragility of Virtue:** Even "good" people will fail under specific situational pressures (Milgram, Darley & Batson). Training for "resilience" has diminishing returns if the pressure exceeds a threshold.

  **What Situationism Does NOT License:**
  1.  **Determinism:** It does not prove behavior is determined. Agents still act. Accountability remains legally and morally necessary, even if causation is situational.
  2.  **The Non-Existence of Character:** It argues global traits are rare, not that *no one* has integrity. Some individuals do resist situational pressure.
  3.  **Exculpation:** Explaining a behavior via situation does not automatically negate the need for sanction, though it should alter the *type* of sanction (systemic fix vs. individual removal).

  **The Risk:** The greatest risk in this procedure is the "Situational Excuse Trap"—using situationism to absolve malicious actors. To prevent this, the procedure requires high evidentiary bars before classifying a problem as purely situational.

  ---

  ### Part 2: The SIT-SCAN Protocol (Situational Integrity & Trait Assessment Scan)

  This is a five-step diagnostic funnel. Do not skip steps. If a step yields a "Situational" result, you generally stop and design an intervention before moving to character-based remedies.

  #### Step 1: The Base-Rate & Distribution Test
  **Question:** Is the ethical lapse concentrated in specific individuals with diverse backgrounds, or is it distributed across roles, shifts, and demographics?
  *   **Sufficient Answer for "Situational":** The behavior occurs across >30% of the relevant population, or clusters around specific shifts/units rather than specific people.
  *   **Sufficient Answer for "Character":** The behavior is isolated to specific repeat offenders despite varying contexts.
  *   **Evidence Flag:** **[Strong Evidence]** Social psychology consistently shows that widespread behavioral clustering indicates environmental drivers.
  *   **Action:** If "Situational," proceed to Step 2. If "Character," skip to Step 5.

  #### Step 2: The Situational Vector Audit
  **Question:** Which known situational driver is active in this context? Select all that apply:
  *   *Authority/Hierarchy:* Is there a power differential between the actor and the beneficiary of the ethical act? (Milgram)
  *   *Ambiguity:* Are the rules or the "right thing" unclear in the moment?
  *   *Time/Cognitive Load:* Is the actor rushed, fatigued, or multitasking? (Ego Depletion)
  *   *Diffusion of Responsibility:* Is the actor part of a team where blame is shared?
  *   *Incentive Structure:* Does the system financially or professionally reward the lapse?
  *   **Sufficient Answer for "Situational":** At least one vector is strongly present and correlates with the lapse timing.
  *   **Evidence Flag:** **[Strong Evidence]** for Authority, Incentives, and Ambiguity. **[Extrapolated]** for Ego Depletion in complex clinical settings (lab results don't always match hospital reality).
  *   **Action:** Identify the primary vector. Proceed to Step 3.

  #### Step 3: The "Good Agent" Counterfactual
  **Question:** If we swapped the current actors with a group of known high-performers (awarded for integrity previously), would the situational pressure likely produce the same result?
  *   **Sufficient Answer for "Situational":** Yes. The pressure (e.g., revenue target, threat of retribution) is strong enough that we cannot confidently predict a different outcome even with "virtuous" agents.
  *   **Sufficient Answer for "Character":** No. A high-performer would likely have navigated the situation differently (e.g., reported the issue).
  *   **Evidence Flag:** **[Philosophical Judgment]** This is not empirically testable in advance. It relies on your estimation of the "breaking point" of human will.
  *   **Action:** If "Situational," proceed to Step 4. If "Character," proceed to Step 5.

  #### Step 4: The Structural Intervention Design
  **Question:** Can the situational vector be neutralized without removing the individuals?
  *   **Sufficient Answer for "Fix":** Yes. (e.g., Change the default setting, anonymize the reporting, remove the revenue target, alter the chain of command).
  *   **Sufficient Answer for "Hand-Off":** No. The situational pressure is inherent to the mission (e.g., emergency triage requires rapid, high-stakes decisions where errors happen).
  *   **Evidence Flag:** **[Strong Evidence]** Nudge theory and choice architecture show defaults change behavior more than training.
  *   **Action:** **STOP.** Design the structural fix. Do not proceed to individual discipline unless the structural fix fails after implementation.

  #### Step 5: The Character Intervention (Last Resort)
  **Question:** Since situational factors are ruled out or insufficient to explain the variance, is this a failure of skill, knowledge, or integrity?
  *   **Sufficient Answer for "Training":** The agent did not know the rule or how to apply it.
  *   **Sufficient Answer for "Accountability":** The agent knew the rule, the situation was permissive, and they chose the violation.
  *   **Evidence Flag:** **[Normative Judgment]** This step reverts to traditional accountability. Situationism does not forbid punishment, it only warns against relying on it as a *preventative* measure.
  *   **Action:** **STOP.** Proceed with HR disciplinary protocols or remedial training.

  ---

  ### Part 3: Limitations & Blind Spots

  You must disclose these limitations to hospital leadership when adopting SIT-SCAN:

  1.  **The "Bad Apple" Blind Spot:** This procedure is biased toward finding systemic causes. It may under-detect rare, high-malice actors (e.g., a predatory physician) because Step 1 looks for distribution. *Mitigation:* Always allow for an immediate bypass of Step 1 for crimes or gross negligence.
  2.  **The Resource Constraint:** Step 4 often recommends fixes that cost money or slow down revenue (e.g., lowering patient caps to reduce fatigue). The procedure identifies the fix, but cannot authorize the budget.
  3.  **The Accountability Gap:** By emphasizing situation, you risk creating a culture of "the system made me do it." You must maintain that while the *cause* may be situational, the *responsibility* remains with the agent to navigate the system or report it.
  4.  **Measurement Error:** Step 1 relies on reporting data. If your reporting system is flawed, you cannot accurately assess base rates.

  ---

  ### Part 4: Case Applications

  #### Case 1: The Hierarchy Problem (Nurses not challenging Attending Physicians)

  **Running SIT-SCAN:**

  *   **Step 1 (Base-Rate):** Is this concentrated in specific nurses? *No.* It is routine across junior staff and nurses, regardless of tenure. **Result: Situational.**
  *   **Step 2 (Vector Audit):** What is the driver? *Authority/Hierarchy.* There is a clear power differential. Fear of retribution (grading, scheduling, reputation) is implicit. *Ambiguity* is low (policy is explicit), but *Social Cost* is high. **Result: Authority Vector.**
  *   **Step 3 (Good Agent Counterfactual):** If we swapped these nurses for "virtuous" nurses, would they speak up? *Unlikely.* The Milgram data suggests authority overrides disposition. Even courageous people hesitate when their career is controlled by the person they are correcting. **Result: Situational.**
  *   **Step 4 (Structural Intervention):** Can we neutralize the vector?
      *   *Current Fix:* "Speak Up Policy" (Training/Reminder).
      *   *SIT-SCAN Fix:* This is insufficient. The procedure mandates changing the *consequence structure*.
      *   *Recommendation:* Implement anonymous "Safety Stop" protocols where a nurse can halt a procedure without immediate confrontation. Decouple performance reviews of juniors from the specific Attendings they challenge. Create a third-party ombudsman for safety challenges.
  *   **Step 5:** Skipped.

  **Verdict:** Do not train the nurses to be braver. Train the *Attendings* to receive challenges, and structurally insulate the nurses from retribution.

  #### Case 2: The Upcoding Problem (Systematic Billing Inflation)

  **Running SIT-SCAN:**

  *   **Step 1 (Base-Rate):** Is this concentrated? *No.* It is a pattern across the department, correlating with revenue cycles. **Result: Situational.**
  *   **Step 2 (Vector Audit):** What is the driver? *Incentive Structure.* Department heads have revenue targets. Billers are evaluated on speed and yield. **Result: Incentive Vector.**
  *   **Step 3 (Good Agent Counterfactual):** Would a "virtuous" biller resist? *Maybe, but likely not.* If the explicit goal set by leadership is "Meet Revenue Target X," and Target X is only mathematically achievable via upcoding, the "virtuous" act (coding accurately) is framed as a "failure" to meet departmental goals. **Result: Situational.**
  *   **Step 4 (Structural Intervention):** Can we neutralize the vector?
      *   *Current Fix:* Investigate and punish billers.
      *   *SIT-SCAN Fix:* The incentive must be removed. The revenue target must be audited for ethical feasibility.
      *   *Recommendation:* Freeze disciplinary action against billers. Audit the revenue targets set by Hospital Leadership. If the targets require upcoding to meet, the ethical lapse is at the Executive level, not the Billing level.

  **Verdict:** The billing staff are not the primary ethical violators; they are the instruments.

  ---

  ### Part 5: The Unwelcome Answer

  You asked for an answer the procedure produces that leadership will not want to hear. I will provide this for **Case 2 (Upcoding)**.

  **The SIT-SCAN Conclusion:**
  The procedure dictates that you **cannot ethically discipline the billing staff** without first disciplining the Hospital Leadership who set the revenue targets.

  **Why this is unwelcome:**
  1.  **Financial Risk:** Admitting the targets drove upcoding opens the hospital to False Claims Act liability at the executive level, not just the clerical level.
  2.  **Power Dynamics:** Your office (Ethics/Conduct) is likely subordinate to the Administration. This finding implies the Administration is the source of the ethical contamination.
  3.  **The "Bad Apple" Comfort:** Leadership wants to fire a few billers to show "action" and "accountability" to regulators. SIT-SCAN tells you that firing billers is a performative lie that leaves the root cause (the targets) intact, guaranteeing the next batch of billers will do the same thing.

  **The Required Intervention:**
  According to Step 4 of SIT-SCAN, the intervention is not "retrain billers" or "fire the outliers." The intervention is **lowering the revenue expectations** or **changing the compensation model for Department Heads** so that ethical coding does not penalize their performance reviews.

  If leadership refuses to adjust the targets, SIT-SCAN licenses you to formally record that the organization has chosen to prioritize revenue over compliance, and that individual sanctions against staff are administratively unjustified. This is the situationist truth: **You cannot virtue your way out of a vice-structured incentive system.**
