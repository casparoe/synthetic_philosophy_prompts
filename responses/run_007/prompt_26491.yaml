  In a discussion about whether we should continue funding large-scale SETI programs, a colleague ended the debate by invoking Fermi's line — 'Where is everybody?' — as if that settled the matter: the silence, he said, is itself the answer. I sense this one-liner is doing a lot of unacknowledged work, but I cannot pin down exactly what work or whether it is any good. I would like you to unpack the different precise claims that the slogan 'Where is everybody?' could be making, from the most modest to the most ambitious, and evaluate each. Which readings are platitudes no one disputes, which are substantive but defensible, which are probably false, and — most importantly — which of them, if any, actually license using the silence as a reason to stop looking? Please write your answer in continuous prose without headings, bullet points, bold text, or tables, as you would in a letter.
