answer: |-
  This is a pedagogical challenge that mirrors the transition from theoretical derivation to experimental demonstration. Your group is trained to look for confounding variables and causal mechanisms. The Frankfurt argument is counter-intuitive to them because it asks them to isolate a variable (moral responsibility) while holding a usually correlated variable (alternative possibilities) constant at zero, without changing the causal history of the action.

  Here is a systematic plan for the 90-minute session, designed to treat the argument as a setup that must be calibrated before the measurement (the intuition) can be trusted.

  ### I. The Carrying Example: Judgment and Specification

  **Verdict:** Do not use the original Jones/Black "prior sign" version.
  **Reason:** For scientists, the "prior sign" (a twitch, a blush) invites a regress objection: *What caused the sign?* If the sign is determined, the agent is determined. If the sign is indeterminate, the intervener can't know when to intervene. This drags the discussion into the mechanics of the intervener's knowledge, which is a confounding variable.

  **Recommendation:** Use a **"Neural Blocker"** variant.
  **The Setup:**
  *   **Agent:** Alice.
  *   **Action:** Voting for Candidate A.
  *   **Intervener:** A chip in Alice's brain (monitoring only, not driving).
  *   **Mechanism:** The chip is set to *block* any neural sequence leading to a vote for B. It does not *cause* the vote for A. It acts as a logical gate, not a motor.
  *   **Actual Sequence:** Alice deliberates and votes for A on her own. The chip does nothing.
  *   **Counterfactual Sequence:** If Alice were to initiate a vote for B, the chip would stimulate/force the A-vote neural pathway.

  **Why this works for scientists:** It separates *causation* (the motor) from *preclusion* (the gate). It allows you to treat the chip as a boundary condition rather than a causal force in the actual trial.

  ---

  ### II. Board Work and Sequence (90 Minutes)

  Divide the whiteboard into three vertical columns. Do not erase the Left Column until the end.

  **Column 1: The Principle (0:00–0:10)**
  *   Write the **Principle of Alternative Possibilities (PAP)**: *An agent is morally responsible for an action only if they could have done otherwise.*
  *   Write the **Target**: *To show PAP is false.*
  *   **Instruction:** Tell the group: "Treat PAP as a hypothesis. We are looking for a counter-instance. A single valid counter-instance falsifies the universal claim."

  **Column 2: The Case Construction (0:10–0:35)**
  *   **Step 1 (Control Run):** Describe Alice voting for A *without* the chip. Ask: "Is she responsible?" (Consensus: Yes).
  *   **Step 2 (Experimental Run):** Add the chip. Emphasize two constraints on the board:
      1.  *Inactivity:* In the actual sequence, the chip exerts zero energy/force.
      2.  *Preclusion:* In the counterfactual sequence, 'Vote B' is physically impossible.
  *   **Step 3 (The Measurement):** Ask: "Is she responsible in the Experimental Run?"
  *   **The Pivot:** If they say "No," ask: "What causal difference did the chip make to the actual sequence?" If they say "Yes," ask: "Could she have done otherwise?" (Answer: No).
  *   **Conclusion:** Responsibility = Yes; Alternative Possibilities = No. PAP = Falsified.

  **Column 3: The Diagnostic Log (0:35–End)**
  *   Use this space to track objections. Do not treat them as "questions." Treat them as "data anomalies." If an objection arises, write it here. If it is resolved by the setup, cross it out. If it reveals a flaw in the setup, circle it.

  ---

  ### III. Map of Misconceptions

  Your group will attempt to "save" PAP by finding a hidden variable. Here is where they will look, and how to handle it.

  | Misconception | Typical Arrival Point | Strategy | Verification of Resolution |
  | :--- | :--- | :--- | :--- |
  | **1. The Coercion Confusion**<br>("The chip made her do it.") | **0:15–0:25**<br>(During Case Construction) | **Preempt.** Explicitly state: "In the actual sequence, the chip is off. It is a spare tire, not the engine." Use the physics analogy: A wall prevents you from walking north, but it does not cause you to walk south. | Can they distinguish between the *source* of the action (Alice) and the *guarantor* of the outcome (Chip)? |
  | **2. The Determinism Assumption**<br>("This only works if the universe is deterministic.") | **0:35–0:50**<br>(During The Pivot) | **Let Surface.** This is the most dangerous trap. Let them argue it. Then dismantle: The case works *even if* Alice's choice is indeterministic. The chip blocks the *realization* of the alternative, not the *cause* of the actual. | Can they articulate that the *absence of alternatives* is secured by the chip, regardless of whether Alice's actual choice was determined? |
  | **3. The "Flicker" Defense**<br>("She could have *tried* to do otherwise, even if she failed.") | **0:50–1:05**<br>(During Deep Dive) | **Bracket.** Acknowledge this (it's a sophisticated objection). But note that responsibility attaches to the *action* (Voting A), not the *attempt*. If the action is identical to the Control Run, responsibility should be too. | Do they accept that moral responsibility tracks the *outcome/action*, not the *range of motion*? |
  | **4. The Knowledge Condition**<br>("She didn't know about the chip.") | **1:05–1:15**<br>(Late Session) | **Dismiss.** Ignorance of constraints does not negate responsibility (e.g., I am responsible for staying in the room even if I don't know the door is locked, provided I chose to stay). | Can they apply the intuition to a non-Frankfurt case (e.g., the Locked Room) consistently? |

  **How to tell if they've genuinely overcome it:**
  Don't ask "Do you understand?" Ask them to identify the *causal locus*. If they say, "The chip removed the freedom, but Alice provided the cause," they have it. If they say, "Well, she wasn't really free because the chip was there," they have conflated *freedom of action* with *freedom of will*.

  ---

  ### IV. The Diagnostic Question (Last 10 Minutes)

  Do not ask them to summarize Frankfurt. Ask them to apply the *Actual Sequence vs. Alternative Sequence* distinction to a scenario where the intervener is absent, but the constraint is present.

  **The Question:**
  > "Imagine a pilot flying a plane. Unknown to her, the co-pilot has locked the control stick so it *cannot* turn left. It can only go straight or right. The pilot, wanting to go straight, flies straight. She never attempts to turn left.
  >
  > **Question:** Is the pilot responsible for flying straight?
  > **Follow-up:** If you say Yes, does she have the ability to do otherwise? If you say No, how is this different from a normal flight where the stick is unlocked?"

  **What this tests:**
  *   If they say **No** (Not responsible): They have failed to grasp the Frankfurt point. They are still clinging to PAP.
  *   If they say **Yes** (Responsible) but **Yes** (Could have done otherwise): They are confused about the lock.
  *   If they say **Yes** (Responsible) and **No** (Could not have done otherwise): **Success.** They have decoupled responsibility from alternative possibilities.

  ---

  ### V. What to Decline to Settle

  Your group will want to solve the "Hard Problem" of free will in one session. You must explicitly bracket the following to keep the architecture secure. Write these on the bottom of the board under "Out of Scope":

  1.  **Compatibilism vs. Incompatibilism:** Frankfurt cases attack PAP, not Determinism. One can accept Frankfurt and still be an Incompatibilist (by rejecting the idea that determinism removes alternatives). Do not let the session drift into "Does determinism exist?"
  2.  **The "Flicker" Strategy:** If a participant insists there is *always* some alternative (e.g., the alternative of "deciding to try"), acknowledge it as a technical debate for next time. The core intuition is about the *action*, not the *precursors*.
  3.  **Moral Luck:** Do not let them slide into "She's lucky the chip didn't intervene." The argument is about *responsibility*, not *praise/blame magnitude*.

  **Closing Instruction to the Group:**
  "Today, we are not deciding if free will exists. We are testing a specific structural claim: Is the *ability to do otherwise* a necessary condition for responsibility? If the Frankfurt case holds, the answer is no. Whether that saves free will or destroys it is a problem for the next session."

  This approach respects their scientific training by isolating variables, defining the control group, and demanding that objections identify specific causal confounds rather than appealing to general unease.
