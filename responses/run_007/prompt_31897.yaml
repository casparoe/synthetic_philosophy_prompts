answer: |-
  This is one of the most nuanced episodes in the history of 20th-century philosophy of science. You have correctly identified the trajectory: Popper initially cast doubt on the scientific status of Darwinism, calling it a "metaphysical research programme," and later retracted that specific characterization while maintaining his core demarcation criteria.

  To answer your question directly: The tension is **real** in terms of his published statements over time, but it represents a **change of mind based on a deeper analysis of the theory**, rather than an inconsistency in his philosophy or a special exemption for biology. In fact, his later view is a *stricter* application of falsifiability to evolution than his earlier one.

  Here is the breakdown of the two "Poppers," the textual evidence, and what this implies for historical sciences.

  ### 1. The "Metaphysical" Popper (1974–1978)
  In the 1970s, Popper was concerned that the phrase "survival of the fittest" was being used as a universal explanation that could not be wrong.

  *   **The Text:** In his autobiography *Unended Quest* (1974) and a lecture titled "Natural Selection and the Emergence of Mind" (1978), Popper argued that natural selection was not a testable scientific theory but a "metaphysical research programme."
  *   **The Argument:** He claimed the theory was tautological. If fitness is defined by survival, and survival is explained by fitness, the statement "the fittest survive" reduces to "those who survive, survive."
  *   **Relation to Demarcation:** This was a **consistent application** of his falsifiability criterion. If a theory can accommodate any possible observation (e.g., if a species survives, it was fit; if it goes extinct, it was unfit), it cannot be falsified. Therefore, by his own definition, it was not empirical science. He was not granting an exemption here; he was arguably excluding evolutionary theory from "science" proper, placing it in the realm of heuristic metaphysics.

  ### 2. The "Retraction" Popper (1980s)
  By the mid-1980s, Popper had engaged more deeply with biologists (notably through correspondence and debates) and revised his position.

  *   **The Text:** In the 1987 revision of the 1978 lecture mentioned above, Popper added a crucial footnote and altered the text. He explicitly stated: *"I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."*
  *   **The Argument:** Popper realized that while the *general principle* could be formulated tautologically, evolutionary biology does not actually operate that way. Biologists make specific claims about specific adaptations in specific environments. For example, claiming that "white moths were more fit than black moths in pre-industrial England due to camouflage" is a testable, falsifiable hypothesis. If black moths had survived better in that environment, the hypothesis would be falsified.
  *   **Relation to Demarcation:** He did not lower the bar for falsifiability. Instead, he acknowledged that Darwinism, when properly formulated, **meets the bar**. He distinguished between the *general idea* of selection (which is a framework) and *specific evolutionary hypotheses* (which are scientific).

  ### 3. Is this Consistent, an Exemption, or a Change of Mind?

  **It is an explicit change of mind, but it preserves philosophical consistency.**

  Popper did not say, "Falsifiability doesn't apply to biology." He said, "I was wrong to think biology couldn't be falsified."

  *   **No Special Exemption:** He did not carve out a "biology exception" to his demarcation criterion. He maintained that for evolutionary theory to be scientific, it must make risky predictions. He criticized biologists who used natural selection as a "get-out-of-jail-free" card to explain away anomalies without evidence.
  *   **Consistency:** His underlying philosophy remained stable: Science requires the possibility of refutation. His early view was that Darwinism lacked this possibility. His later view was that Darwinism *possesses* this possibility, provided one looks at specific models rather than the slogan "survival of the fittest."
  *   **The "Metaphysical" Label:** He did not entirely discard the "metaphysical research programme" label. In his later view, the *general framework* of evolution serves as a metaphysical guide that generates specific, testable scientific theories. This aligns with his later philosophy (influenced by Lakatos to some degree) that science operates within broader research programmes.

  ### 4. Does this show Falsifiability is a "Bad Fit" for Historical Sciences?

  This is the crux of your second question. Popper's struggle with Darwinism highlights a difficulty, but not necessarily a failure, of falsifiability regarding historical sciences.

  **The Challenge of Historical Sciences:**
  Popper acknowledged that evolutionary biology is a "historical science." It deals with singular events (the extinction of the dinosaurs, the emergence of mammals) rather than repeatable universal laws (like gravity).
  *   **The Problem:** You cannot rerun the history of life to test a hypothesis.
  *   **Popper's Solution:** Popper argued that historical sciences are scientific not because they predict the *future*, but because they make testable claims about the *past*. If a theory claims a certain fossil must exist in a certain stratum, and it is not found (where it should be), the theory is falsified.

  **Is it a Bad Fit?**
  Popper's vacillation suggests that **naive falsificationism** is a bad fit for complex historical sciences. If you demand that a theory yield a single, clean prediction like physics, evolutionary biology fails.
  However, Popper's mature view suggests that falsifiability is still the correct *demarcation*, provided we understand what is being tested.
  *   We do not test "Evolution" as a monolith.
  *   We test specific phylogenetic models, specific claims about adaptation, and specific genetic predictions.

  In *The Logic of Scientific Discovery*, Popper noted that historical explanations often rely on "initial conditions" which are hard to verify. His engagement with Darwinism forced him to admit that while the *narrative* is historical, the *mechanisms* (genetics, selection pressures) are subject to universal laws that are testable.

  ### Conclusion

  The tension you perceive is **apparent in the timeline but resolved in the philosophy.**

  1.  **Real Tension:** There is a genuine contradiction between Popper's 1974 statement ("It is metaphysical") and his 1987 statement ("It is scientific"). He admitted this himself.
  2.  **Philosophical Consistency:** There is no contradiction in his *criteria*. He applied falsifiability strictly in both instances. He simply corrected his empirical assessment of whether evolutionary biology could meet that strictness.
  3.  **Implication for Historical Science:** The episode does not prove falsifiability is wrong for history; it proves that applying it requires care. One must distinguish between the **heuristic framework** (which guides research) and the **empirical models** (which risk refutation).

  Popper's final position was that Darwinism is a successful scientific theory *because* it generates falsifiable hypotheses, not in spite of them. His earlier worry was that biologists were treating it as a tautology; his retraction was a call for them to be more rigorous, not a relaxation of his standards. In this sense, the "Darwinian Popper" is entirely consistent with the "Critical Rationalist Popper": he corrected an error in his understanding of the theory to preserve the integrity of his demarcation criterion.
