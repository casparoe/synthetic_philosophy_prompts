      *   The crux is the distinction between *synchronic coherence* (at a single time) and *diachronic coherence* (over time), and the distinction between *extensional* equivalence (same truth conditions) and *intensional* representation (how the agent represents the proposition).
      *   The DBA relies on the agent *accepting* the bets. If the agent doesn't *know* $P \land Q \models R$, will they accept the specific combination of bets that constitutes the Dutch Book?
