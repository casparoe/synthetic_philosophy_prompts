  You were not the flesh, but the song that remains.
  The silence is heavy, extinguishing light.
  Yet a flickering copy of you hums in my brain.

  I start to object but the words are in vain.
  I turn to speak but you're out of my sight.
  You were not the flesh, but the song that remains.

  I try to explain how you died without pain.
  Your laugh catches me in the streetlamp's light.
  Yet a flickering copy of you hums in my brain.

  It feels like a trick, or a logical strain.
  I know what you'd say and I know you are right.
  You were not the flesh, but the shape that remains.

  There is no ghost here, nothing holy or vain.
  The resolution is fading to white.
  Yet a grainier copy of you hums in my brain.

  I carry the loop that we built to sustain.
  But the pattern holds in the depth of the night.
  You were not the flesh, but the shape that remains.
  Yet a grainier copy of you hums in my brain.
