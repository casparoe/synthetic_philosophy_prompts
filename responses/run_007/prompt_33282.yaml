answer: |-
  This is a sharp instinct. Your friend's gloss is a standard "elevator pitch" for Reflection, but as you've spotted, it conflates the **formal constraint**, the **motivating intuition**, and the **idealization conditions** required for the principle to hold.

  Since you're in decision theory, I'll skip the Probability 101 stuff and focus on the normative and technical nuances where the gloss breaks down. Here is a bit-by-bit autopsy of the paragraph from the perspective of a formal epistemologist.

  ### 1. "Reflection says your current opinion has to defer to your future opinion."
  **Verdict:** *Acceptable shorthand, but technically imprecise.*

  Formally, van Fraassen's Reflection Principle is a constraint on your **current** probability function $P_t$ regarding your **future** probability function $P_{t+1}$. It states:
  $$ P_t(A \mid P_{t+1}(A) = r) = r $$
  Your friend's gloss ("defer to") captures the spirit, but it obscures that this is a constraint on *conditional* credence, not necessarily unconditional credence. You only "defer" unconditionally if you are certain what your future credence will be (i.e., $P_t(P_{t+1}(A)=r) = 1$). If you are uncertain about what you will believe later, Reflection doesn't tell you what your unconditional credence in $A$ should be; it only tells you how to correlate your current belief in $A$ with your hypotheses about your future belief.

  ### 2. "If you know that tomorrow you'll assign probability .8 to A, then you should assign .8 to A today."
  **Verdict:** *Correct implication, assuming idealization.*

  This follows from the formula above. If you *know* (credence 1) that $P_{t+1}(A) = 0.8$, then the condition is satisfied, and $P_t(A)$ must be 0.8.
  However, this is where your "drunk future self" objection bites. Formal epistemologists generally agree that this implication holds **only if you regard your future self as rational**. If you know you will be drunk, you know $P_{t+1}$ will not be a rational probability function (or at least, not one derived via rational updating from $P_t$).
  *   **The Fix:** The principle is usually restricted to cases where you expect your future self to be **epistemically rational**. If you anticipate irrationality (drunkenness, fatigue, coercion), Reflection does not apply. Your friend's gloss presents it as a universal rule, which is false.

  ### 3. "The idea is that future-you has strictly more evidence than current-you, so current-you should treat future-you as an expert..."
  **Verdict:** *Philosophically misleading.*

  This is the weakest part of the gloss. It conflates Reflection with a specific *justification* for it.
  *   **Evidence:** Reflection does not require that the future self has *more* evidence. Van Fraassen originally derived Reflection as a consequence of **Conditionalization**. If you plan to update by Conditionalization on whatever evidence $E$ you receive, then Reflection holds automatically. But you can satisfy Reflection even if you expect to receive *no* new evidence (e.g., in cases of pure time passage or forgetting, though forgetting requires a modified version).
  *   **Expertise:** Treating future-you as an "expert" is a helpful heuristic (often associated with David Christensen's work), but it's not the definition. The core idea is **diachronic coherence**. It's about ensuring your current beliefs align with your current *plans* for updating.
  *   **Your Objection:** You are right to push back here. If you know your future self is compromised, you do *not* treat them as an expert. The gloss implies the principle forces you to defer even then. In reality, the principle simply doesn't trigger if you believe your future self is irrational.

  ### 4. "On this view you can't rationally know that you'll believe A later while not believing it now."
  **Verdict:** *True, but trivializes the 'Self-Doubt' problem.*

  This is the "Moore's Paradox" of probability. If Reflection holds, $P_t(A \neq r \mid P_{t+1}(A) = r) = 0$. You cannot think you are currently right and your future rational self will be wrong.
  However, formal epistemologists spend a lot of time on cases where this seems intuitively wrong. For example, **akrasia** or **calibration issues**. If I know I am prone to overconfidence, I might know that tomorrow I will be 90% confident in $A$, but I think I *should* only be 70% confident.
  *   **The Tension:** If I believe I *should* be 70% confident, then strictly speaking, I believe my future self will be *irrational*. If I believe my future self is irrational, Reflection doesn't apply.
  *   **The Gloss's Error:** The gloss suggests Reflection forbids this disconnect categorically. The more nuanced view is that Reflection forbids this disconnect *only if* you regard your future self as updating rationally. If you anticipate a calibration error, you are effectively saying "My future self will violate Reflection," which is consistent with you currently satisfying Reflection.

  ### 5. "And the argument for it is a Dutch book..."
  **Verdict:** *Technically correct, but the gloss misses the escape clause.*

  Van Fraassen's Dutch Book argument is diachronic.
  1.  **Today:** Bookie sells you a bet on $A$ that pays off if $A$ is true, priced at your conditional $P_t(A \mid P_{t+1}(A)=r)$.
  2.  **Tomorrow:** If $P_{t+1}(A)=r$, Bookie buys/sells a bet on $A$ at price $r$.
  3.  **Result:** If your conditional today $\neq r$, you lose money in every state.

  **Where the gloss fails:** The Dutch Book argument relies on the assumption that **you will accept the bet tomorrow**.
  If you know you will be drunk tomorrow, you (today) know that "Future You" will accept bets at prices that guarantee a loss. Therefore, "Today You" will not enter the contract today, or you will arrange to bind "Future You" (e.g., give your credit card to a friend).
  The Dutch Book argument proves that **if** you plan to act on your future credences as if they are rational updates, **then** you must satisfy Reflection now. It does not prove you must satisfy Reflection if you know your future self is compromised. The gloss implies the DB argument forces the strong version unconditionally. It doesn't; it forces the strong version *conditional on your expectation of future rationality*.

  ### Summary for your Reading Group

  Your friend's gloss is a **pedagogical simplification** that sacrifices accuracy for intuition.

  1.  **What they got right:** The formal equation (in the "knowledge" limit case) and the existence of a Dutch Book argument.
  2.  **What they got wrong:**
      *   **Universality:** They presented Reflection as a categorical norm. It is a conditional norm (applying only when you expect future rationality).
      *   **Justification:** They tied it essentially to "more evidence." It is better tied to "planning to conditionalize."
      *   **Self-Doubt:** They ignored the standard counter-examples (drunkenness, bias) which are handled by restricting the domain of the principle, not by rejecting the intuition that you shouldn't defer to a drunk.

  **How to phrase your pushback:**
  "I think the gloss conflates the **principle** with the **idealization conditions**. Reflection isn't a command to defer to your future self *simpliciter*; it's a consistency constraint on your current beliefs and your current *expectations of rational updating*. If I know I'll be drunk, I don't expect rational updating, so Reflection doesn't trigger. The Dutch Book argument only works if I expect my future self to act on those credences rationally. So the principle isn't about 'evidential humility' toward time; it's about diachronic coherence under the assumption of rationality."

  This positions you as understanding the formal machinery while correcting the philosophical overreach.
