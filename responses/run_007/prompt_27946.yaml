      *   *Key Names to drop:* Wittgenstein (obviously), Shoemaker (self-intimation), Evans (transparency), maybe Byrne (BEL rule).
      *   *Refining the "Infallibility" point:* I need to make sure I distinguish between "I cannot be wrong" and "It makes no sense for me to *say* I am wrong." The user conflates the coherence of the thought with the impossibility of the state.
