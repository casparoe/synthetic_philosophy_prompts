  7.  **Refining the Philosophy:**
      *   *Self-Correction on Case 4:* The user says dog eating is fine because they eat pork. This implies a *Species Consistency* principle, not just human autonomy. I need to make sure the proposed principle accounts for the "Hypocrisy Constraint."
      *   *Self-Correction on Case 3 vs 5:* Why is Sati wrong (pressure) but Arranged Marriage okay (pressure)? The distinction is likely the *exit cost*. In Sati, the exit cost is death/social death. In Arranged Marriage, the exit cost is disappointment/conflict, but legal/social survival is possible. This is the "Meaningful Exit" criterion.
