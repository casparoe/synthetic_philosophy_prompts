  9.  **Final Polish:** Ensure clear headings or logical flow. Make sure the "Color Phi" specifics (Red -> Green -> Motion/Change) are central. Ensure the "Justify your answer" part is robust. (The prompt asks me to judge. I will judge that it is not substantive *given current frameworks*, but explain the precondition for it becoming substantive).

