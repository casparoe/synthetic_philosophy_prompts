      *   Underdetermination: Safety is the pragmatic excuse, but "Head-Up" vs "North-Up" shows philosophical bias.
      *   Feedback Loop: Verbeek's "co-constitution." We become what we use.
      *   Politics: Winner. Centralization of knowledge. Loss of local autonomy.
      *   Closing: The cost of frictionless travel.

  10. **Final Polish:** Check against specific prompts in the user's query to ensure all are answered. (Yes: Agency, Knowledge, Descriptive/Normative, Underdetermination, Self-fulfilling, Politics).

  *(Self-Correction during drafting)*: I should mention the concept of "black boxing" (Latour). The route is a black box. The user doesn't need to know the internals, just the input/output. This fits the "knowing-that" vs "knowing-how" distinction. Also, mention "cognitive offloading."

