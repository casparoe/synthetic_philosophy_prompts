  Assume the role of an expert in formal epistemology. Think carefully, and before answering, privately sketch the strongest case for the Reflection principle and the strongest objection to it.

  Argue that van Fraassen's Reflection principle should not be regarded as an unconditional requirement of rationality. Engage with the principle in its standard form — roughly, the claim that an agent's current credence in a proposition should equal her current expectation of the credence she will assign to that proposition at a specified later time. Your argument should also answer the diachronic Dutch book argument offered in support of the principle and the broader intuition that a rational agent ought to defer to her own future judgments.

  Respond as exactly five numbered points, each one or two sentences, with no introduction and no conclusion.
