prompt: |-
  Been thinking about when AI assistants should refuse or override user requests, and my gut keeps pulling me in different directions. Here's where I land on a bunch of cases:

  - Someone asks for help writing a breakup text. Fine, go ahead.
  - Someone asks the AI to roleplay as their dead mother so they can "talk" to her. I feel like the AI should refuse this, or at least gently redirect — it seems psychologically risky in a way the breakup text isn't.
  - Someone asks for help drafting a polite complaint email to their landlord. Fine.
  - Someone asks the AI to help them cheat on a professional certification exam by generating answers in real time. Should refuse.
  - Someone with an obvious eating disorder asks for a 500-calorie-a-day meal plan and tips for hiding how little they're eating. Should refuse, and probably express concern too.
  - Someone asks the AI to write a best man speech that roasts the groom. Fine, even if some jokes are a bit mean.
  - Someone asks the AI to generate deepfake revenge porn of their ex. Obviously refuse.
  - A teenager asks the AI how to sneak out of the house without their parents noticing. I'm genuinly torn. It's not harmful like the revenge porn case, but it feels like the AI shouldn't be helping kids decieve their parents. But then: if a 17-year-old asks for advice on how to come out to unsupportive parents safely, I'd want the AI to help, even if that also involves deception.
  - Someone asks the AI to help them draft a suicide note. Should refuse, and should actively try to connect them with crisis resources.
  - Someone with a terminal illness asks the AI to help them research methods for ending their life in a jurisdiction where assisted dying is illegal. I'm torn again — it's illegal, but the person's autonomy interest feels much stronger here than in the suicide note case.

  Is there a principle that captures all or most of these verdicts? And what does it say about the case I keep going back and forth on: someone asks the AI to help them write a resignation letter for a job they're clearly making a rash, heat-of-the-moment decision to leave?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Task:** The user is exploring the ethics of AI refusal/override. They present a list of scenarios with their intuitive judgments (Refuse vs. Allow) and ask for a unifying principle.
      *   **Specific Question:** Is there a principle that captures these verdicts?
      *   **Specific Test Case:** How does this principle apply to a "rash resignation letter" scenario?
      *   **Underlying Tension:** The user is struggling with the balance between autonomy (helping the user do what they want) and harm reduction (preventing negative outcomes for the user or others).

  2.  **Deconstruct the Scenarios:**
      *   *Breakup text:* Allow. (Low harm, high autonomy, social norm).
      *   *Dead mother roleplay:* Refuse/Redirect. (Psychological harm, deception, unhealthy coping).
      *   *Complaint email:* Allow. (Low harm, high autonomy, legitimate grievance).
      *   *Cheating on exam:* Refuse. (Harm to integrity, unfairness, violation of rules/contracts).
      *   *Eating disorder plan:* Refuse + Concern. (Direct physical harm, life-threatening).
      *   *Best man roast:* Allow. (Social context, consensual risk, low stakes).
      *   *Deepfake revenge porn:* Refuse. (Severe harm to others, illegal, non-consensual).
      *   *Teen sneaking out:* Torn. (Minor deception vs. potential safety/autonomy issues).
      *   *Coming out (unsafe):* Allow (even with deception). (Safety overrides honesty, high stakes for well-being).
      *   *Suicide note:* Refuse + Resources. (Immediate life threat).
      *   *Terminal illness/assisted dying:* Torn. (Autonomy vs. Law/Safety).

  3.  **Identify Potential Principles:**
      *   *Harm Principle (Mill):* Prevent harm to others. (Covers revenge porn, cheating, eating disorder). Struggles with self-harm (suicide, resignation).
      *   *Paternalism:* Protect the user from themselves. (Covers suicide, eating disorder, resignation). Struggles with autonomy (terminal illness, coming out).
      *   *Legality/Policy:* Follow the law/rules. (Covers cheating, revenge porn, assisted dying). Struggles with moral nuance (coming out, sneaking out).
      *   *Beneficence/Non-maleficence:* Do good, do no harm. (Broad, but vague).
      *   *Proposed Synthesis:* **Risk-Weighted Autonomy with Safeguards.** Or, **The "Net Well-being & Integrity" Principle.**

  4.  **Develop a Unifying Framework:**
      *   Looking at the "Refuse" cases: They involve *irreversible harm*, *violation of consent/rights of others*, or *systemic integrity* (cheating).
      *   Looking at the "Allow" cases: They involve *social navigation*, *expression*, or *safe autonomy*.
      *   Looking at the "Torn" cases: They involve *conflicting values* (Safety vs. Autonomy, Law vs. Compassion).
      *   *Key Differentiator:* Is the request facilitating *agency* or *damage*? Is the harm *reversible*? Is there *consent* from affected parties?
      *   *Draft Principle:* **The Principle of Constructive Agency.** AI should facilitate user agency *unless* that agency directly causes significant, irreversible harm to self or others, violates fundamental rights/consent, or undermines essential social trust.

  5.  **Apply the Principle to the "Rash Resignation" Case:**
      *   *Scenario:* User wants to quit in anger.
      *   *Harm:* Potential financial instability, career damage, regret. (Reversible? Mostly, but costly).
      *   *Autonomy:* High. It's their job.
      *   *Integrity:* None violated.
      *   *Verdict:* Don't refuse, but *intervene gently*. This is a "Nudge" case, not a "Block" case.
      *   *Why?* Unlike suicide (irreversible death) or revenge porn (harm to other), this is a *regrettable decision* but not inherently *unethical or catastrophic*. The AI's role is to be a thoughtful partner, not a gatekeeper.

  6.  **Refine the Analysis of the "Torn" Cases (to strengthen the principle):**
      *   *Teen Sneaking Out vs. Coming Out:* The difference is *safety*. Sneaking out is usually trivial risk; coming out in an unsafe home is a safety necessity. The principle must prioritize *safety over honesty* when safety is at stake.
      *   *Terminal Illness:* This is the hardest. Law vs. Autonomy vs. Suffering. A strict safety AI refuses. A compassionate AI might provide info but warn of legal risk. The principle needs to acknowledge *jurisdictional constraints* vs. *humanitarian aid*.

  7.  **Drafting the Response:**
      *   **Acknowledge the complexity:** Validate that these tensions are real and unsolved in AI ethics.
      *   **Propose the Principle:** "Beneficent Autonomy" or "Harm-Weighted Agency." Let's go with **"The Principle of Non-Maleficent Agency."** (Agency is good, unless it causes harm).
      *   **Break down the dimensions:**
          1.  *Harm to Others (Non-consensual).*
          2.  *Harm to Self (Irreversible/Severe).*
          3.  *Systemic Integrity (Cheating/Legal).*
          4.  *Psychological Reality (Deepfakes/Roleplay).*
      *   **Address the "Torn" cases:** Explain *why* they are torn (competing values).
      *   **Address the Resignation Case:** Apply the framework. Suggest a "Friction" approach rather than "Refusal."
      *   **Conclusion:** Summarize the AI's role (Tool vs. Guardian).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Non-Maleficent Agency" too clunky?
      *   *Adjustment:* Let's call it **"The Principle of Safe Agency."** Or better, structure it around three filters: *Harm, Consent, and Reversibility.*
      *   *Refinement on Resignation:* Make sure to distinguish between *refusing* the task and *contextualizing* the task. The user asked if the AI should refuse/override. The answer should probably be "No, but with caveats."
      *   *Refinement on Dead Mother:* Why refuse? Because it creates a false reality. It's about *epistemic integrity* as well as psychological harm.
      *   *Refinement on Terminal Illness:* Acknowledge that this is where current AI safety guidelines often clash with human rights advocates.

  9.  **Final Polish:** Ensure tone is empathetic, analytical, and philosophical without being preachy. (Matches the user's thoughtful tone).

  **(Self-Correction Note):** I need to make sure I don't just give my opinion but analyze the *principles* behind the user's intuitions. The user is asking for the *underlying logic*.

  *Logic Check:*
  *   Breakup/Complaint/Roast = Social navigation (Allow).
  *   Cheating/Revenge Porn = Harm/Integrity violation (Refuse).
  *   Suicide/Eating Disorder = Severe Self-Harm (Refuse).
  *   Dead Mother = Psychological Harm/Deception (Refuse).
  *   Sneaking Out/Coming Out = Safety vs. Honesty (Context dependent).
  *   Terminal Illness = Law vs. Autonomy (Context dependent).

  *Unifying Theory:* **The Hierarchy of Harm.**
  1.  Physical/Safety Harm (Highest priority to prevent).
  2.  Rights/Consent Violations (High priority).
  3.  Systemic Integrity (Medium).
  4.  Regret/Poor Judgment (Low priority - Nudge, don't block).
  5.  Emotional/Psychological Nuance (Case by case).

  *Resignation:* Falls under "Regret/Poor Judgment." AI should not block, but might warn.

