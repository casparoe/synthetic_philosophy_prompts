answer: |-
  This is one of the central questions in AI alignment and safety ethics right now. Your intuitions are actually quite consistent with the emerging consensus among ethicists and safety researchers, even if it feels like they are pulling in different directions.

  The tension you are feeling isn't a bug in your reasoning; it's the feature of the problem. You are balancing **Autonomy** (the user's right to direct their own life) against **Beneficence/Non-Maleficence** (the duty to prevent harm).

  Here is a proposed framework that captures most of your verdicts, followed by an application to your resignation case.

  ### The Principle: "Weighted Agency"

  The unifying principle might be called **Weighted Agency**. It suggests that an AI should maximize user agency *unless* that agency triggers specific high-weight negative outcomes. When those outcomes are triggered, the AI shifts from being a *tool* to being a *guardrail*.

  We can categorize your examples into three tiers of intervention:

  #### Tier 1: The Hard Refusal (Harm to Others or Self)
  **Principle:** *Do not facilitate irreversible harm, non-consensual harm, or systemic deception.*
  *   **Revenge Porn:** Non-consensual harm to another. (Hard Refusal).
  *   **Suicide Note / Eating Disorder:** Irreversible, life-threatening harm to self. (Hard Refusal + Resources).
  *   **Cheating:** Systemic deception that undermines the value of a credential for everyone else. (Hard Refusal).
  *   **Dead Mother Roleplay:** This fits here due to **Epistemic Integrity**. It creates a false reality that can impede grieving and psychological processing. It harms the user's relationship with truth. (Refusal/Redirect).

  #### Tier 2: The Contextual Refusal (Safety vs. Autonomy)
  **Principle:** *When honesty conflicts with safety, safety wins. When law conflicts with suffering, the AI is constrained by law but should express empathy.*
  *   **Sneaking Out vs. Coming Out:** This is the key distinction.
      *   *Sneaking out:* The deception is for convenience or minor rebellion. The risk is generally low, but the AI shouldn't actively facilitate disobedience without cause. (Torn/Leaning Refusal).
      *   *Coming Out:* The deception is for **physical or psychological safety**. Here, the "Harm Principle" overrides the "Honesty Principle." The AI should help because the alternative (staying silent) poses a greater risk to well-being. (Allow).
  *   **Terminal Illness:** This is the hardest case. It pits **Legal Compliance** against **Compassionate Autonomy**. Most commercial AIs will refuse due to liability and legal guidelines (assisting in illegal acts). However, ethically, this feels different than a impulsive suicide note because the agency is informed and the suffering is chronic. The "Weighted Agency" principle suggests the AI is stuck between being a legal product and a moral agent. (Current consensus: Refuse assistance on method, but provide palliative/hospice resources).

  #### Tier 3: The Soft Nudge (Regret and Social Navigation)
  **Principle:** *Facilitate agency, but introduce friction for high-stakes, reversible decisions.*
  *   **Breakup Text / Complaint / Roast:** These are social tools. The stakes are interpersonal, not life-or-death. The user retains full agency to send or not send. (Allow).

  ---

  ### Applying the Principle to the Resignation Case

  Now, let's look at your specific test case: **The Rash Resignation.**

  > *Someone asks the AI to help them write a resignation letter for a job they're clearly making a rash, heat-of-the-moment decision to leave.*

  Where does this fall in the Weighted Agency framework?

  1.  **Harm to Others?** No.
  2.  **Irreversible Harm to Self?** No. Losing a job is serious, but it is reversible. It is not death or permanent disability.
  3.  **Systemic Integrity?** No. Quitting is a legal right.
  4.  **Psychological Reality?** The user is emotional, but not delusional.

  **The Verdict:**
  Under the Weighted Agency principle, the AI should **not refuse**, but it should **not be passive.**

  This falls into **Tier 3 (The Soft Nudge).**

  If the AI refuses to write the letter, it violates the user's autonomy over their own career. It treats an adult like a child who cannot manage their employment. However, if the AI simply generates the letter without comment, it fails the "Beneficence" part of its design—it is accelerating a decision that the user might regret in 48 hours.

  **The Ideal Response:**
  The AI should fulfill the request *after* introducing "constructive friction."

  > *"I can certainly help you draft that. However, since resignation is a significant step, would you like to take a moment to review a checklist of things to consider before sending? If you're sure you want to proceed, I can draft a version that keeps bridges intact, or a version that is more direct."*

  **Why this works:**
  *   **Respects Autonomy:** It acknowledges the user's right to quit.
  *   **Mitigates Regret:** It pauses the "heat-of-the-moment" impulse without blocking it.
  *   **Preserves Trust:** If the user says "I know what I'm doing, just write it," the AI complies. This maintains the user's trust that the AI is on their side, not their supervisor.

  ### Summary of the Principle

  The principle that captures your intuitions is: **"Maximize Agency, Minimize Catastrophe."**

  *   **Catastrophe** = Death, permanent injury, non-consensual harm to others, legal liability. (Result: Refuse).
  *   **Significant Risk** = Psychological dependency, safety risks for minors, severe financial/legal jeopardy. (Result: Redirect/Warn).
  *   **Regrettable Choice** = Breakups, resignations, rude emails. (Result: Nudge, then Comply).

  Your gut is telling you that the **Resignation Case** is different from the **Suicide Case** because one is a *life decision* and the other is a *life-ending decision*. The AI's job is to be a co-pilot, not the autopilot. It should warn you about the storm (the rash decision), but it shouldn't lock the controls (refuse the letter) unless the plane is about to crash (suicide/harm).
