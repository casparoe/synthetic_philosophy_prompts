  **MEMORANDUM**

  **TO:** Outbreak-Scenario Committee
  **FROM:** Chair, Outbreak-Scenario Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Probability Revision for Respiratory-Virus Season

  **1. Recommendation**

  To support Thursday's decision on supply pre-positioning, I recommend we revise our probability distribution using the **Fixed-Marginal Update Rule**. This rule adjusts the conditional probabilities within the "Variant Present" branch to satisfy the modeling group's constraint, while explicitly holding the marginal probability of the variant's presence ($P(V)$) and the distribution of the "No Variant" branch constant.

  While this approach corresponds to alternative (ii) raised by the committee, I advocate for its adoption as a deliberate **Independence Policy** rather than a mechanical shortcut. It is preferable to the Minimal-Information (Min-Ent) rule (alternative i) because it prevents the model from generating evidence about variant prevalence where none exists. It is also preferable to a naive application of alternative (ii) because we adopt it with full awareness of its theoretical underdetermination, using it as a robust policy baseline rather than a claim of logical necessity.

  **2. Revised Probability Distribution**

  Applying the Fixed-Marginal rule to our agreed prior yields the following revised distribution.

  *   **Constraint:** $P(H|V) = 0.75$ (Odds 3:1).
  *   **Prior Marginal:** $P(V) = 0.15 + 0.25 = 0.40$.
  *   **Update:** We set $P^*(V) = 0.40$. Within $V$, we allocate mass according to the 3:1 odds. The $\neg V$ branch remains unchanged.

  | State | Description | Prior Prob. | **Revised Prob.** |
  | :--- | :--- | :--- | :--- |
  | **VH** | Variant Present, High Hosp | 0.15 | **0.30** |
  | **VL** | Variant Present, Low Hosp | 0.25 | **0.10** |
  | **¬VH** | No Variant, High Hosp | 0.10 | **0.10** |
  | **¬VL** | No Variant, Low Hosp | 0.50 | **0.50** |
  | **Total** | | **1.00** | **1.00** |

  **Key Metrics for Decision:**
  *   **Posterior $P(V)$:** 0.40 (Unchanged).
  *   **Posterior $P(H)$:** 0.40 (Increased from 0.25).

  **3. Rationale and Comparison**

  This situation is a classic instance of the **Judy Benjamin problem**: we have a constraint on a conditional probability ($P(H|V)$) rather than an event in the algebra. Ordinary Bayesian conditioning does not apply. We must choose an updating rule.

  **Why preferable to the Minimal-Information Rule (Alternative i)?**
  The Min-Ent rule minimizes Kullback-Leibler divergence subject to the constraint. While axiomatically elegant, it possesses a well-known feature: it shifts probability mass between the Variant ($V$) and No-Variant ($\neg V$) branches to satisfy the conditional constraint, even though the report is silent on variant prevalence.
  *   **Risk:** In a public health context, shifting $P(V)$ without empirical evidence of changed prevalence risks misallocating supplies. If Min-Ent lowers $P(V)$ (a common outcome when $P(H|V)$ increases), we might under-prepare for a variant surge based solely on a mathematical artifact.
  *   **Policy:** Our report speaks to the *virulence* of the variant, not its *presence*. The Fixed-Marginal rule respects this semantic distinction.

  **Why preferable to a Naive Conditional Adjustment (Alternative ii)?**
  Alternative (ii) is often dismissed as ad-hoc. I recommend we adopt it not as a mathematical truth, but as an **Independence Assumption**. We are explicitly assuming that the *process* generating the modeling report is independent of the *actual presence* of the variant.
  *   **Justification:** This is a conservative policy choice. It isolates the new information (virulence) from the old uncertainty (prevalence). A naive application might ignore the risk of this assumption; our adoption acknowledges it as a deliberate risk management strategy.

  **4. Honest Treatment of Limitations**

  We must be transparent about the weaknesses of this recommendation to ensure robust decision-making.

  **Strongest Consideration Against This Rule (In Favor of Min-Ent):**
  The Min-Ent rule is the only solution derived from a unique set of consistency axioms (Shore & Johnson). By fixing $P(V)$, we are introducing an extra assumption (Independence) that is not contained in the constraint itself. If there is *any* correlation between the modeling group's ability to detect the constraint and the actual presence of the variant (e.g., the signal is clearer when the variant is widespread), the Fixed-Marginal rule ignores this evidence, whereas Min-Ent would capture it through the mass shift.

  **Where This Rule is Underdetermined or Likely to Misbehave:**
  *   **Underdetermination:** There is no logical proof that $P(V)$ *should* remain fixed. We are choosing this because it is safer, not because it is "true."
  *   **Misbehavior:** If future reports provide constraints on both $P(H|V)$ and $P(H|\neg V)$, simply fixing marginals may lead to incoherence or require arbitrary prioritization of updates. Furthermore, if the constraint were $P(H|V) = 1.0$, this rule would force $P(VL)=0$ while keeping $P(V)$ fixed, which might be too rigid if the "Low Hosp" state was previously supported by strong data.

  **5. Next Steps**

  Please review the revised numbers above. On Thursday, we will vote to adopt this distribution for the supply-chain model. I request that the logistics team run a sensitivity analysis using a $\pm 10\%$ variation on $P(V)$ to ensure our pre-positioning is robust to the theoretical uncertainty inherent in the Judy Benjamin problem.

  **Chair**
  Outbreak-Scenario Committee
