      *   *Key Fragment:* "Justice without force is powerless; force without justice is tyrannical." (Pensées, 298/103)
      *   *The Problem:* We cannot make what is just be strong, so we make what is strong be just.
      *   *Skepticism:* Pascal is deeply skeptical of human reason's ability to discern objective justice independent of custom, climate, and power. Justice is often defined by the prevailing laws and customs of a region, not universal truth.
      *   *Political Realism:* He acknowledges the necessity of force for order but warns against mistaking force for true justice. He distinguishes between "justice" (true, divine, or natural) and "legal justice" (established by power).
      *   *Human Nature:* Corrupt, self-interested, prone to self-deception (*amour-propre*).

  3.  **Analyze Humanitarian Intervention/R2P:**
      *   *Claim:* Universal human rights justify overriding sovereignty when a state harms its people.
