answer: |-
  ### Introduction

  Mikhail Bongard's pattern-recognition problems and Nelson Goodman's "New Riddle of Induction" both illuminate the logical gap between finite data and infinite generalizations. In a Bongard problem, the solver is presented with twelve images: six on the left (positive examples) and six on the right (negative examples). The task is to formulate a rule that distinguishes the left class from the right. Goodman's riddle, conversely, asks why we project the predicate "green" rather than "grue" (green before time $t$, blue after) into the future, given that all past observations support both equally.

  While both challenges demonstrate that data underdetermines theory, they operate in different domains: Bongard problems are primarily about **perceptual representation and feature extraction**, whereas Goodman's riddle is about **semantic projectibility and temporal prediction**.

  ### Concrete Example: The "Green-Blue" Bongard

  To ground this comparison, consider the following Bongard-style problem:

  *   **Left Side (6 images):** Six geometric shapes, all colored **Green**. (Varied shapes: circles, triangles, squares).
  *   **Right Side (6 images):** Six geometric shapes, all colored **Blue**. (Varied shapes: circles, triangles, squares).
  *   **Implicit Task:** Determine the rule distinguishing Left from Right to classify a 13th image.

  **The Standard Induction:**
  The intuitive human solution is: *"Items on the Left are Green; items on the Right are Blue."* The distinguishing feature is **Color**.

  **The Goodman-Style Complication:**
  Now, apply a Goodman-style predicate to this spatial setup. Define a new color predicate, **"Grue-Left"**, as follows:
  *   An object is **Grue-Left** if it is observed on the Left side before the year 2050, or on the Right side after the year 2050.
  *   (Conversely, define **"Bleen-Right"** as Blue before 2050 on the Right, or Green after 2050 on the Left).

  If all twelve example images are observed **before 2050**, the data supports two competing hypotheses equally well:
  1.  **Hypothesis A (Natural):** Left = Green, Right = Blue.
  2.  **Hypothesis B (Grue-ish):** Left = Grue-Left, Right = Bleen-Right.

  Both hypotheses fit the twelve examples perfectly. However, they diverge radically on a test case presented **after 2050**. Hypothesis A predicts a new Left-side image will be Green. Hypothesis B predicts it will be Blue (because after 2050, "Grue-Left" objects on the Left must be Blue, per the definition's symmetry, or more simply, if we define "Grue" as Green-before-$t$/Blue-after-$t$, the Left side rule becomes unstable).

  A simpler Grue application: Define **"Grue-Shape"** as "Green if on the Left, Blue if on the Right."
  *   **Rule 1:** Left side contains Green things.
  *   **Rule 2:** Left side contains Grue-Shape things.

  Since all Left-side examples are Green, both rules fit. But Rule 2 is position-dependent. If the rule is meant to be *intrinsic* to the objects (to classify a new object regardless of position), Rule 2 fails. If the rule is meant to describe the *arrangement*, Rule 2 is tautological ("Left things are Left-things"). Goodman's riddle complicates the induction by showing that without a constraint on *which predicates are permissible*, we cannot distinguish a law of color from a coincidental correlation of position and time.

  ---

  ### 1. The Kind of Underdetermination

  The underdetermination exposed by Bongard problems is **representational**, while Goodman's is **projectible**.

  **Bongard: The Feature Search Problem**
  In Bongard problems, the underdetermination arises because the vocabulary of features is not given. The solver must decide whether the relevant difference is shape, color, number, containment, orientation, or topology. Infinite logical descriptions fit the twelve images (e.g., "Left shapes have fewer than 100 sides" vs. "Left shapes are convex"). The challenge is **abductive**: inferring the *intended description* from a vast space of possible visual primitives. The underdetermination is resolved by appealing to human perceptual priors (e.g., Gestalt laws, simplicity).

  **Goodman: The Predicate Validation Problem**
  Goodman assumes the features are already identified (e.g., we agree on what "green" looks like). The underdetermination arises because logically equivalent predicates ("green" vs. "grue") yield contradictory future predictions. The challenge is **justificatory**: why is one predicate "projectible" and the other not? Goodman's underdetermination is not about finding the feature, but about validating the *logic of induction* itself.

  **Convergence:**
  They converge on the worry that **syntax does not determine semantics**. In Bongard, the pixel data (syntax) does not determine the concept "triangle" (semantics). In Goodman, the observation reports ("this is green") do not determine the future truth of the generalization. However, they are distinct: Bongard is about *discovering* the rule's content; Goodman is about *trusting* the rule's form.

  ### 2. Transferability of Solutions

  A satisfactory solution to one would **not** fully carry over to the other; they demand fundamentally different theoretical resources.

  **Solving Bongard (Computational/Cognitive Resources)**
  Solving Bongard problems requires a theory of **perceptual ontology**. In AI, this is addressed via deep learning (learning features from data) or symbolic AI (hand-crafted primitives). A solution involves priors on visual simplicity, object permanence, and spatial relations.
  *   *Transfer to Goodman:* If an AI solves Bongard problems by learning "natural" visual features, it implicitly solves a localized version of Goodman's riddle (it prefers "green" over "grue" because "green" is a simpler feature in its latent space). However, this is a pragmatic fix, not a philosophical justification. It explains *how* we choose, not *why* we are justified.

  **Solving Goodman (Philosophical/Pragmatic Resources)**
  Goodman's own solution was **entrenchment**: we project "green" because it has a history of successful projection in our language and practice. This requires a theory of **linguistic practice and natural kinds**.
  *   *Transfer to Bongard:* Entrenchment helps solve Bongard problems (we prefer "triangle" because it is an entrenched concept). However, it does not solve the *perceptual* bottleneck. A solver might know "triangle" is entrenched but still fail to *detect* triangles in noisy pixel data. Goodman provides a constraint on the *output* of the learning process, but Bongard requires a mechanism for the *processing* of the input.

  **Verdict:**
  Bongard requires a **psychology of perception**; Goodman requires an **epistemology of induction**. Solving the perceptual problem (Bongard) leaves the skeptical problem (Goodman) untouched (why trust the perception?). Solving the skeptical problem (Goodman) leaves the computational problem (Bongard) untouched (how to extract the features?).

  ### 3. The Deeper Obstacle

  Goodman's New Riddle poses the **deeper obstacle** to the idea that concepts can be learned or induced from examples alone.

  **Why Goodman is Deeper:**
  1.  **Universality:** Bongard problems assume a shared visual reality and a cooperative context (a puzzle setter and a solver). They operate *within* a framework of shared concepts. Goodman's riddle attacks the framework itself. It shows that even if we agree on the data (the examples), the logic of induction provides no internal criterion for choosing between competing generalizations.
  2.  **The "Alone" Constraint:** The prompt asks about learning from "examples alone." Bongard problems suggest that with enough cleverness, we can extract the rule from the images. Goodman proves that **no amount of examples** can logically distinguish "green" from "grue." The distinction requires external information (past usage, entrenchment, biological constraints). Therefore, Goodman demonstrates the *impossibility* of induction from examples alone, whereas Bongard merely demonstrates the *difficulty* of feature extraction.
  3.  **Skepticism vs. Engineering:** Bongard is an engineering challenge (how to build a system that sees like a human). Goodman is a skeptical challenge (how to justify believing the system's output). One can build a Bongard-solver that works 99% of the time; one cannot logically refute the Grue hypothesis without appealing to non-empirical premises.

  **Conclusion:**
  While Bongard problems vividly illustrate the complexity of mapping data to concepts in a rich perceptual world, Goodman's riddle exposes the logical void at the heart of that mapping. Bongard shows that concepts are hard to *find*; Goodman shows that concepts are impossible to *justify* based solely on the examples that instantiate them. Therefore, Goodman poses the deeper philosophical obstacle to pure empiricist accounts of concept learning.
