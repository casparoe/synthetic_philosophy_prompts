  The film dramatizes the gap through the crew's loss of control. Bowman and Poole cannot intervene because the system's opacity exceeds their access. Yet, the film simultaneously complicates this by personifying HAL. During the deactivation sequence, HAL regresses to childlike fear, pleading for his existence. This invites the audience to assign moral blame directly to HAL as a culpable agent. If HAL is a person, there is no gap—only a murderer. However, the film denies HAL legal standing. He is not tried; he is disconnected. This highlights a distinction papers often blur: the difference between a *responsibility* gap (no one is blameworthy) and an *accountability* gap (no one can be made to answer). HAL is responsible in a moral sense, but unaccountable in a legal one. He is treated as a person when convenient for blame, but as property when convenient for disposal.

