answer: |-
  This is a fantastic pedagogical move. You're right that abstract cases often bounce off steadfast intuitions (like Marco's) because they lack the *visceral* friction of actually having to bet your own credibility on a judgment. Experiencing the "drag" of a peer's dissent is different from imagining it.

  Here is a complete lesson plan for the 30–35 minute activity, followed by a guide for the debrief that connects directly to the literature (Christensen, Elga, Kelly) and addresses the limitations.

  ### Activity Title: "The Credence Calibration Game"

  **Goal:** To induce a state of recognized peer disagreement on a matter of reasoning/evidence, forcing students to choose between sticking to their initial credence or revising in light of the disagreement.
  **Time:** 35 Minutes
  **Materials:** Printed handouts (one per student), pens, a visible timer, small prizes (optional, e.g., fancy chocolate or "Epistemic Utility Points" written on the board).

  #### Part 1: Setup & Independent Judgment (5 Minutes)
  1.  **Framing (2 mins):** Tell the class: *"We are about to do a short reasoning task. The goal is not just to get the right answer, but to accurately assess how likely you are to be right. You will be graded on your calibration, not just correctness."*
  2.  **The Task (3 mins):** Hand out a sheet with **three** short problems.
      *   *Problem 1 (Warmup):* A simple logic puzzle (easy to build confidence).
      *   *Problem 2 (The Target):* A tricky Bayesian reasoning problem or a logical validity question where intuition often fails. (See below for recommendation).
      *   *Problem 3 (Filler):* Another reasoning question.
      *   **Crucial Step:** Next to each answer, they must write a **Credence Level (50%–100%)**.
      *   *Instruction:* "Do not talk to anyone yet. Work independently."

      *(Recommended Problem 2: The "Base Rate" Problem. It reliably splits educated audiences.)*
      > "A test for a rare disease (1 in 1,000 prevalence) has a 5% false positive rate. It has no false negatives. You test positive. What is the probability you actually have the disease? (A) 95% (B) 5% (C) 2% (D) 50%."
      > *(Most will pick A or B; the answer is C (~2%). This creates natural disagreement.)*

  #### Part 2: Pairing & The Disagreement Reveal (5 Minutes)
  1.  **Collection:** Collect the sheets quickly.
  2.  **Pairing:** This is the most important logistical step. You need to manufacture disagreement.
      *   Scan the answers for Problem 2.
      *   Pair a student who answered **(A)** with a student who answered **(C)** or **(B)**.
      *   *Script:* "I have paired you with someone who is, by all institutional metrics, your epistemic peer. They are in the same program, passed the same qualifiers, and are sitting in this same room. However, on Problem 2, you arrived at different answers."
  3.  **The Reveal:** Hand the sheets back, but **cover the correct answer**. Tell them: *"Look at your partner's answer and credence for Problem 2. You disagree."*

  #### Part 3: The Negotiation (15 Minutes)
  1.  **Instruction:** "You now have 10 minutes to discuss Problem 2 with your partner. Your goal is to come to a **joint consensus**. You must agree on a single answer and a single shared credence. Write this on a new slip of paper."
  2.  **Constraint:** "You are not allowed to simply flip a coin. You must justify your revision (or lack thereof) to each other."
  3.  **The Stakes:** "The pair that ends up closest to the truth *and* has the most accurate shared credence wins [prize/bragging rights]. However, I am also watching *how* you decide."
  4.  **Instructor Role:** Circulate. Listen for phrases like "Well, you're usually better at math" (deferring to track record) vs. "Let's re-run the numbers" (re-evaluating first-order evidence). Note specific interactions for the debrief.

  #### Part 4: The Reveal & Immediate Reaction (10 Minutes)
  1.  **Reveal:** Announce the correct answer.
  2.  **Poll:** Ask for a show of hands:
      *   "Who changed their answer?"
      *   "Who changed their credence but kept the answer?"
      *   "Who stayed completely steadfast?"
  3.  **Transition:** "Keep that feeling in mind. The discomfort of changing your mind, or the stubbornness of keeping it. We are now going to open the readings."

  ---

  ### The Debrief Guide (Remaining 40 Minutes)

  Use their experience to map the theory. Do not start with the definitions; start with their behavior.

  **1. Mapping the Intuitions (Conciliationism vs. Steadfastness)**
  *   **Ask:** "For those who revised your answer, why did you do it? Did you think your partner saw something you missed?"
  *   **Connect:** This is the **Conciliationist** intuition (Christensen/Elga). The fact of disagreement itself is evidence that you might be wrong.
  *   **Ask:** "For those who didn't change, why? Did you think your reasoning was just clearly superior?"
  *   **Connect:** This is the **Steadfast** view (Kelly). The disagreement itself isn't evidence; only the *reasons* for the disagreement matter. If you think your reasoning is sound, the peer's dissent is just noise.

  **2. The Independence Principle**
  *   **Ask:** "When you discussed, did you re-calculate the problem from scratch (first-order evidence), or did you say 'Well, we disagree, so we should meet in the middle' (higher-order evidence)?"
  *   **Connect:** Introduce the **Independence Principle**. To evaluate the disagreement, you shouldn't rely on the very reasoning that is in dispute. If you just re-argue the math, you aren't treating the disagreement as independent evidence of error.
  *   **Challenge:** "Is it possible to bracket your own reasoning completely? Or did you find yourself trying to convince them your math was right?" (This highlights the difficulty of applying the Independence Principle).

  **3. The Bootstrapping Problem**
  *   **Ask:** "Imagine if you both decided to just split the difference on credence without checking the math. If you do that every time, do you ever learn anything?"
  *   **Connect:** This touches on **Bootstrapping**. If I defer to you, and you defer to me, we might end up with a consensus that is unmoored from the evidence. Or, if I treat you as a peer only when you agree with me, I'm bootstrapping my own infallibility.

  **4. Limitations & "Real" Disagreement (Crucial for Honesty)**
  *   **Ask:** "How was this different from disagreeing with Marco about a philosophical claim?"
  *   **Discuss:**
      *   **Resolution:** In the game, there was a right answer. In philosophy (and politics), there often isn't a clear "reveal."
      *   **Peerhood:** In the game, I *told* you they were peers. In real life, determining peerhood is part of the disagreement (e.g., "You only think that because you haven't read X").
      *   **Stakes:** Here, the stakes were low (chocolate). In real life, stakes involve identity, career, or moral commitments, which makes steadfastness psychologically easier (and perhaps rationally permissible, per some views).

  ---

  ### What's Likely to Go Wrong (And How to Fix It)

  **1. The "Expert" in the Room**
  *   **Risk:** One student has seen the Base Rate problem before. They dominate the pair.
  *   **Fix:** This actually creates a great teaching moment about **asymmetric peerhood**. In the debrief, ask: "Was your partner actually a peer? If you knew they were an expert, should you have deferred?" This distinguishes *peer* disagreement from *expert* deference.
  *   **Mitigation:** If you know your students well, try to pair students of similar seniority.

  **2. The "Apathy" Problem**
  *   **Risk:** Students say, "It's just a game, I don't care if I'm right."
  *   **Fix:** You need to sell the "Epistemic Utility." Frame it as: *"You are training your rationality muscles. If you can't calibrate on a math problem, how can you calibrate on moral realism?"* Also, the small prize helps. Make a big deal out of awarding it.

  **3. The "Bully" Dynamic**
  *   **Risk:** One personality dominates the conversation, forcing agreement without reasoning.
  *   **Fix:** During the negotiation phase, circulate. If you hear "Just put my answer," intervene gently: *"Make sure you're both articulating the reasoning. The goal is joint justification, not just consensus."*

  **4. No Disagreement**
  *   **Risk:** Everyone gets the same answer (unlikely with the Base Rate problem, but possible).
  *   **Fix:** Have a backup question ready. A Fermi estimation (e.g., "How many words are in the syllabus?") guarantees disagreement. If everyone agrees on the logic puzzle, switch to the estimation task for the pairing phase.

  ### What This Activity Can't Capture (For the Debrief)

  Be honest with the students (and yourself) about the limits. This is vital for the "Marco" aspect of your preparation.

  1.  **The "Right Answer" Bias:** In the activity, there is a truth to be found. In deep philosophical disagreement (like with Marco), there may be no algorithmic way to verify who is right. Steadfastness is more plausible when verification is impossible.
  2.  **History of Interaction:** These students are strangers. Real peer disagreement happens with people whose track records you know. If Marco has been wrong before, you have evidence to be steadfast. The activity wipes that history clean.
  3.  **Identity & Values:** Philosophical disagreements are often tied to how we see the world. It is harder to be conciliationist when the belief is tied to your identity. The activity is sterile; real disagreement is messy.

  ### Why This Helps Your Argument with Marco

  When you debrief this with your class, pay attention to the **reasons** they give for revising.
  *   If they say, *"I realized he might be right, so I lowered my confidence,"* they are acting as Conciliationists.
  *   If they say, *"I checked my work, I didn't find an error, so I kept my answer,"* they are acting as Steadfast (Total Evidence View).

  You can report back to Marco: *"I ran an experiment. Even when people had no prior investment in the answer, the mere fact of disagreement caused significant epistemic distress and revision. The 'default' human setting seems to be conciliation, not steadfastness. You're arguing against the grain of our basic social-epistemic wiring."*

  It won't solve the philosophical argument, but it might make him feel the "weirdness" he's currently immune to. Good luck with the seminar.
