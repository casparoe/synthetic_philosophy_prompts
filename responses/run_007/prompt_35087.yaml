          4.  For each claim, specify the evidence needed to settle it.
          5.  Specifically separate claims about: Input content, Grammar compatibility (hypothesis space), and Learner capabilities (domain-general vs. specific).
          6.  Identify which reading would actually rule out the statistical model.
          7.  Evaluate whether the dismissal relies on a stronger reading than evidence supports.

  2.  **Initial Brainstorming & Conceptual Mapping:**
