answer: |-
  # Activity Design: The Predictor's Gauntlet

  ## Overview
  This session uses two mechanical games to simulate the decision-theoretic tension of **Counterfactual Mugging** and **XOR Blackmail**. Participants earn "Snack Points" (SP). The student with the most SP at the end chooses the snacks for the next session (high social stakes). The "Predictor" is enforced via sealed envelopes and rigid game rules, removing the need for actual psychic prediction.

  ## Materials Needed
  *   **12 Envelopes** (labeled "Algorithm Card").
  *   **12 Envelopes** (labeled "Blackmail Disposition").
  *   **12 Scorecards** (to track SP).
  *   **Tokens/Chips** (optional, or just write on Scorecards).
  *   **1 Coin** (large, visible).
  *   **1 Deck of Cards** (10 Red "Termite" cards, 90 Blue "Safe" cards — shuffled).
  *   **Whiteboard** (for tallying scores).
  *   **Facilitator Script** (below).

  ## Payoff Scheme
  *   **Starting SP:** 100 per student.
  *   **Phase 1 (Mugging):**
      *   Cost to Pay: 20 SP.
      *   Reward for "Lucky" Branch: 200 SP (drawn from a pool funded by the "Unlucky" branch).
  *   **Phase 2 (Blackmail):**
      *   Cost to Pay Blackmail: 20 SP.
      *   Cost of "Termite" State: 100 SP.
  *   **Winning:** Top scorer picks next week's snacks. Top 3 get "bragging rights" (certificates).

  ---

  ## Phase 1: The Counterfactual Pot (25 Minutes)
  *Simulates Counterfactual Mugging.*

  ### Setup & Rules (Read Aloud)
  1.  **The Algorithm:** "Take an 'Algorithm Card' envelope. Inside, write either **PAY** or **REFUSE**. Seal it. This represents your decision algorithm—the code Omega simulates to predict you. Do not show anyone."
  2.  **The Pot:** "I (Facilitator) will collect these. I am Omega. I will not open them yet."
  3.  **The Coin:** "I will flip a coin for *each* of you privately behind this screen.
      *   **TAILS (The Reward Branch):** I open your envelope. If it says **PAY**, you receive **200 SP** from the Bank. If **REFUSE**, you get 0.
      *   **HEADS (The Cost Branch):** I open your envelope. If it says **PAY**, I *ask* you to pay **20 SP** into a communal Pot. If **REFUSE**, you pay nothing."
  4.  **The Twist:** "Here is the catch. The Bank reward for TAILS is funded by the Pot from HEADS. If the Pot is empty, TAILS players get nothing. If you are in HEADS and asked to pay, you can choose to **Honor** your card (Pay 20 SP) or **Defect** (Refuse to pay, even if your card said PAY)."
  5.  **The Tension:** "If you are in HEADS, your payment helps the TAILS players. You get no direct benefit. But if everyone Defects in HEADS, the Tails players (who relied on your Algorithm Card) get nothing."

  ### Execution
  1.  Students write/seal cards (2 mins).
  2.  Facilitator flips coins privately for each student (5 mins).
  3.  **TAILS Group:** Facilitator opens cards. Awards 200 SP if card says PAY. (3 mins).
  4.  **HEADS Group:** Facilitator opens cards. If PAY, asks student: "Your algorithm said Pay. Will you honor it and put 20 SP in the Pot? Or Defect?" (5 mins).
  5.  **Resolution:** Tally the Pot. If Pot > 0, distribute bonus to TAILS group (optional, or just keep the tension that their reward *depended* on the HEADS group's honor). *Correction for simplicity:* To strictly mirror Mugging, the Tails reward comes from the "Bank" (Facilitator), but the *justification* for the Bank's generosity was the prediction.
      *   *Revised Payoff:* Tails players get 200 SP from Facilitator if Card=PAY. Heads players lose 20 SP if Card=PAY AND they Honor.
      *   *Why this creates tension:* Heads players know their Card=PAY caused the Tails players to get rich. If they Defect now, they gain 20 SP personally, but they "break" the logic that made the Tails players rich.

  ---

  ## Phase 2: The XOR Note (25 Minutes)
  *Simulates XOR Blackmail.*

  ### Setup & Rules (Read Aloud)
  1.  **The State:** "I have a deck of cards. 10% are Red (Termites), 90% are Blue (Safe). I will draw one for each of you. This is the truth of your house. You do not see it yet."
  2.  **The Disposition:** "Take a 'Blackmail Disposition' envelope. Write **PAY** or **IGNORE**. Seal it. This is what the Blackmailer predicts you will do."
  3.  **The Letter Rule:** "The Blackmailer sends you a Letter based on this rule: **You get a Letter IF AND ONLY IF (State is Red) XOR (Disposition is PAY).**"
      *   *Facilitator Note:* Red + Pay = No Letter. Red + Ignore = Letter. Blue + Pay = Letter. Blue + Ignore = No Letter.
  4.  **The Decision:** "I will now determine who gets a Letter based on your State and your Sealed Disposition. If you receive a Letter, you must decide: **Pay Blackmail (20 SP)** or **Ignore (0 SP)**."
  5.  **The Payoff:** "At the end, we reveal the State.
      *   If Red (Termites): You lose **100 SP**.
      *   If you Pay Blackmail: You lose **20 SP**.
      *   Total Loss = Termite Cost + Blackmail Cost."

  ### Execution
  1.  Students write/seal Disposition (2 mins).
  2.  Facilitator draws State cards privately (2 mins).
  3.  Facilitator applies XOR Rule. Hands "Letter" slips to eligible students (3 mins).
      *   *Crucial:* Do not reveal States yet.
  4.  **Letter Receivers:** Decide Pay or Ignore. Record choice. (5 mins).
  5.  **No Letter Receivers:** Do nothing. (1 min).
  6.  **Reveal:** Everyone reveals State. Calculate losses. (5 mins).

