  ## Debrief Script (45 Minutes)

  ### Part 1: The Mugging (Phase 1)
  **Facilitator:** "In Phase 1, those of you who got HEADS faced a choice. You had already written 'PAY' on your card. That card determined whether the TAILS players got 200 points. When you were asked to actually pay, many of you felt a pull to honor the card, even though paying cost you points and helped only the lucky TAILS group. Why?"

  *   *Expected Student Response:* "It felt like cheating to write Pay and then Refuse." "I wanted the Tails people to win." "It felt inconsistent."

  **Facilitator:** "This is the **Counterfactual Mugging**.
  *   **CDT (Causal Decision Theory):** Says **Refuse**. Your payment now cannot change the coin flip that already happened. You lose 20 SP for no causal gain.
  *   **EDT (Evidential Decision Theory):** Says **Refuse**. Paying is evidence you are a 'Payer', but the coin is already flipped.
  *   **FDT (Functional Decision Theory):** Says **Pay**. Your decision *now* is logically linked to the output of your Algorithm Card *then*. If your algorithm outputs 'Refuse' in this situation, Omega would have predicted 'Refuse', and the Tails players would have gotten nothing. To be the kind of agent who gets the reward, you must pay the cost."

  ### Part 2: The Blackmail (Phase 2)
  **Facilitator:** "In Phase 2, if you received a Letter, you knew you were in a specific logical slot: Either (Termites + You Disposed to Ignore) OR (Safe + You Disposed to Pay). Many of you felt that Paying the blackmail was a bad idea, even though Paying correlated with being Safe."

  *   *Expected Student Response:* "Paying didn't stop the termites." "The letter was already sent."

  **Facilitator:** "This is **XOR Blackmail**.
  *   **EDT:** Says **Pay**. Receiving a letter is bad news. Paying is strongly correlated with the 'Safe' state (because if you were Safe and Disposed to Pay, you get a letter. If you were Termites and Disposed to Pay, you get *no* letter). So, among Letter-Receivers, Payers are more likely to be Safe. EDT chases this correlation.
  *   **CDT:** Says **Ignore**. Paying doesn't cause the Termites to vanish.
  *   **FDT:** Says **Ignore**. Your decision algorithm controls the Blackmailer's prediction. But the Letter is *already sent*. The correlation is fixed. You cannot logically influence the State (Termites) by paying. You only lose an extra 20 SP."

  ### Part 3: The Tension
  **Facilitator:** "Notice the conflict. In Phase 1 (Mugging), FDT says **Pay** (to influence the prediction). In Phase 2 (Blackmail), FDT says **Ignore** (because the prediction is already realized in the Letter).
  *   If you use **EDT**, you Pay in Blackmail (bad) and Refuse in Mugging (missed reward).
  *   If you use **CDT**, you Refuse in Mugging (missed reward) and Ignore in Blackmail (correct).
  *   **FDT** navigates both: It pays when the decision *logically determines* the predictor's past action (Mugging), but refuses when the decision only correlates with a fixed state (Blackmail).
  *   The tension you felt—'Why pay in one but not the other?'—is exactly the boundary where CDT and EDT fail, and FDT attempts to succeed."

  ---

  ## Prediction of Failure Modes & Mitigation

  | Failure Mode | Description | Mitigation |
  | :--- | :--- | :--- |
  | **The "Empty Pot" Glitch** | In Phase 1, if no one gets HEADS, the tension vanishes. | **Facilitator Fix:** If by chance no one gets HEADS, reroll for one volunteer. Or, pre-determine that exactly 6 students are HEADS to ensure the dilemma exists. |
  | **Collusion** | Students agree "We all write PAY" to game the system. | **Facilitator Fix:** Emphasize individual scoring. "The Snack Winner is the *individual* with the most points." Remind them that in Mugging, you want to be Tails/Pay, but if you are Heads, you want to Defect. |
  | **XOR Confusion** | Students don't understand the XOR logic (Red+Pay = No Letter). | **Facilitator Fix:** Use a lookup table on the whiteboard during rules. <br>Red + Pay = No Letter.<br>Red + Ignore = **Letter**.<br>Blue + Pay = **Letter**.<br>Blue + Ignore = No Letter. |
  | **Predictor Skepticism** | "The envelope isn't a real predictor." | **Facilitator Fix:** Acknowledge this in debrief. "In the thought experiment, Omega is perfect. Here, the Envelope *is* you. If you deviate from the envelope, you are proving your algorithm inconsistent. The logic holds if you view the Envelope as your source code." |

  ---

  ## Limitations Note (For Facilitator)
  **What this activity cannot reproduce:**
  1.  **Perfect Prediction:** In the game, the "Predictor" is just a sealed note. Students *can* physically change their mind. In the real philosophical problem, Omega *knows* you will change your mind.
      *   *Debrief Fix:* Explicitly state: "Imagine the Envelope was written by a perfect simulation of you. If you Defect in Phase 1, the Simulation would have Defected, and the Tails reward would never have existed. You are not tricking Omega; you are defining your algorithm."
  2.  **Single-Shot vs. Iterated:** This is a one-off game. FDT often shines in iterated contexts or logical correlation.
      *   *Debrief Fix:* Remind them that Decision Theory is about the *principle* of the choice, not just the expected value of this specific snack session.
  3.  **Logical Omniscience:** XOR Blackmail relies on the agent understanding the logical constraint (XOR). Students might just see it as probabilistic.
      *   *Debrief Fix:* Walk through the truth table slowly in the debrief to show why the correlation exists logically, not just causally.

  **Closing Thought for Facilitator:**
  "The goal isn't to prove FDT is right. The goal is to make you feel that CDT leaves money on the table in Phase 1, and EDT burns money in Phase 2. If you leave feeling that *no single simple rule* captures both intuitions comfortably, the activity succeeded."
