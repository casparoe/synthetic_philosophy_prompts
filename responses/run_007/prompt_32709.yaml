      *Confidence:* 85%.
      *   *Least Sure:* Will the students actually choose to remove the rule? I need to prime them to value efficiency over caution. I will add a "Time Limit" to the round to pressure them.

  11. **Drafting the Content:** (Mental outline of the response sections)
