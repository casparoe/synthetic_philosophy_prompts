  13. **Final Polish:** Check tone (academic but practical). Ensure constraints (no mention of Chesterton early) are met.

  *(Self-Correction on "Least Sure"):* The biggest risk is students not falling for the trap. They might be too suspicious. I need to make the "Reform" phase feel like *their* idea, not a trick. I will frame it as "You are now the Constitutional Convention."

