      *   *Make the rule more subtle.* Instead of "wait 10 seconds," make it "Route all requests through the Scribe." If they bypass the Scribe, information is lost, leading to duplicate claims.
      *   *Let's stick with the "Claim Marker" idea but refine the consequence.* It represents *public notice* in property law or *due process* in legislation.
      *   *Confidence:* High on the concept, medium on the timing.
