  10. **Finalizing the Design:**
      *   **Activity:** "The Commons Auction."
      *   **Fence:** A mandatory "cooling-off" period and public registration before bidding.
      *   **Incentive:** Limited high-value items.
      *   **Consequence:** Simultaneous bids invalidate the item.
      *   **Debrief:** Connect to procedural law, tradition, and unintended consequences.

      *(Self-Correction during drafting)*: Keep it simpler. "The Token Exchange."
      *   3 Factions.
      *   Central Bank.
      *   Rule: To exchange tokens for points, you must fill out a slip in triplicate (metaphorically) or wait for a specific signal.
      *   Actually, the "Collision" model is more visceral. Let's go with **"The Narrow Bridge."**
      *   **Setup:** A physical bottleneck (a doorway or a specific table zone).
      *   **Rule:** Only one person passes at a time, must announce intent.
      *   **Reform:** Remove the announcement rule to speed up flow.
      *   **Result:** Gridlock/Collisions.
      *   **Philosophical Link:** Traffic laws, norms of civility, procedural hurdles in legislation.

      *Decision:* I will use a **Resource Allocation Simulation** called "The Commons Ledger." It feels more "political theory" than a physical race.
      *   **Fence:** A specific bureaucratic step (signing a ledger) before taking resources.
      *   **Incentive:** Resources are depleting. Signing takes time.
      *   **Consequence:** If you take without signing, the resource is "contested" and destroyed.
      *   **Why:** It mirrors property rights and record-keeping institutions.

      *Wait, one more check:* The prompt asks for *advanced* students. The activity shouldn't feel childish. It needs to feel like a governance problem.
      *   **Revised Concept:** "The Amendment Game."
      *   They are a legislature. They are given a standing order (the Fence). It slows down passing bills. They vote to suspend the rule. Then they pass bad bills or gridlock occurs because the rule prevented something subtle (e.g., minority consultation).
      *   *Critique:* Hard to simulate in 90 mins.
