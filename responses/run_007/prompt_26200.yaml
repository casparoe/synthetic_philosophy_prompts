prompt: |-
  I cover AI for a general-audience science magazine, and I run a roughly monthly brown-bag workshop for my newsroom — around 15 reporters and editors, 90 minutes, mostly smart people who don't code. The thing I keep tripping over in coverage is the gap between the press-release line that a system "learned the user's preferences" and what inverse reinforcement learning actually gives you: a reward function that makes the observed behavior look rational, out of a whole family of reward functions that would do the job just as well. I want my colleagues to feel that underdetermination in there bones before they write another sentence like "the model inferred what humans value."

  Design a hands-on activity or game for that workshop. I'd like the participants split into small groups, some acting as the "demonstrator" (each given a private scoring scheme) and the others acting as the "learning system" (seeing only the demonstrator's choices, then trying to recover the scoring scheme). The catch should be that different private scoring schemes produce the same observable choices, so the learners confidently recover a reward function that is wrong — or right, but for reasons they can't tell apart. Give me the exact rules, the materials (paper, cards, a printable grid, whatever is cheap), a point scheme that doesn't need real money, a timeline for the 90 minutes, and a debrief that maps what happened onto the actual technical issues: reward ambiguity and identifiability, how the choice of features or state representation sneaks in, why the rationality assumption (Boltzmann or otherwise) is doing a lot of work, and why a lab can still honestly report a learned reward function even when it isn't "the" human preference. Also tell me what will predictably go wrong the first time I run it (e.g., a group picks a scoring scheme so simple everyone reconstructs it, or people start arguing that the demonstrator was just irrational), and be upfront about which part of the real technical problem the activity can't reproduce — I'd rather say that in the debrief than let people leave overconfident.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Science journalists/editors (smart, non-technical, critical thinkers).
      *   **Goal:** Illustrate the underdetermination/ambiguity problem in Inverse Reinforcement Learning (IRL). Specifically, that multiple reward functions can explain the same behavior.
      *   **Format:** 90-minute brown-bag workshop, small groups, hands-on activity/game.
      *   **Mechanism:** "Demonstrators" have private scoring schemes; "Learners" observe choices and try to reverse-engineer the scheme.
      *   **Key Constraint:** Different scoring schemes must produce identical observable choices (equifinality).
      *   **Deliverables:** Rules, materials, point scheme, timeline, debrief (mapping to technical concepts), failure modes, limitations.

  2.  **Deconstruct the Technical Concept (IRL Ambiguity):**
      *   *Core Problem:* If I see you walk from A to B, did you do it because you like B? Or because you hate A? Or because C is blocked? Or because the path A->B is shortest?
      *   *Mathematical reality:* $R$ is not uniquely identified by $\pi^*$ (optimal policy). Many $R$ yield the same $\pi^*$.
      *   *Journalistic hook:* "The AI learned what we value" vs. "The AI found *a* story that fits what we did."

  3.  **Design the Game ("The Mystery Scorer"):**
      *   *Need:* A discrete environment where choices are visible but motivations are hidden.
      *   *Idea 1: Grid World.* Classic RL. Too abstract? Maybe.
      *   *Idea 2: Menu Selection.* People choose meals. Easy to understand. Hard to constrain choices to be identical under different rules.
      *   *Idea 3: Pathfinding on a Map.* Good, but requires drawing.
      *   *Idea 4: "The Apartment Hunt".* Participants choose between apartments with different features (Rent, Size, Commute).
      *   *Selection:* **Grid World with Hidden Traps/Rewards.** It's the standard RL analogy for a reason—it's visual and discrete. Let's make it tactile. A printed grid with tokens.
      *   *Refinement for Ambiguity:* To ensure *different* rules produce *same* paths, the environment needs constraints. If the grid is open, people take different paths. If there are obstacles, paths converge.
      *   *Better Idea:* **"The Curator's Choice."** Selecting items for a display.
      *   *Best Idea for this specific constraint:* **"The 3-Stop Tour."**
          *   Context: A tourist in a city with 5 landmarks.
          *   Task: Plan a route visiting 3 landmarks starting from Home.
          *   Secret Rule: The Demonstrator has a hidden scoring rule (e.g., "Maximize Art," "Minimize Walking," "Avoid Crowds").
          *   Problem: If the map is designed right, "Maximize Art" and "Minimize Walking" might result in the exact same route.
      *   *Wait, simpler:* Let's use a **Grid with Hidden Values**.
          *   Grid: 4x4.
          *   Start: Bottom Left. End: Top Right.
          *   Move: Up or Right only (forces path length to be constant, removing "shortest path" ambiguity).
          *   Hidden Feature: Each cell has two hidden numbers (Feature A, Feature B).
          *   Demonstrator Rule: Maximize Sum of A OR Maximize Sum of B.
          *   Trick: Design the grid so the path maximizing A is the *same* as the path maximizing B.
          *   Learner Task: Guess whether the rule was A or B.
          *   Outcome: They can't tell. Both fit perfectly.

      *   *Let's refine the "Equifinality" aspect.* It needs to be more visceral.
      *   *Game Name:* **"The Black Box Budget."**
      *   *Setup:* A simplified "shopping" scenario.
      *   *Items:* 5 Items. Each has 3 visible attributes (Price, Color, Weight).
      *   *Constraint:* You can pick exactly 3 items. Budget constraint? No, let's keep it to choice.
      *   *Secret Scoring:*
          *   Rule 1: Prefer Red.
          *   Rule 2: Prefer Cheap.
          *   Rule 3: Prefer Light.
      *   *The Trap:* Design the item set so that the 3 Red items are *also* the 3 Cheapest items, but the 3 Light items are different.
      *   *Wait, I need the Learners to fail confidently.*
      *   *Revised Game:* **"The Route Master."**
      *   *Materials:* Printed map with nodes and edges.
      *   *Demonstrator:* Given a secret "Reward Card" (e.g., +10 for passing a Park, -5 for passing a Factory).
      *   *Learner:* Sees the path taken.
      *   *The Twist:* Provide two different Reward Cards to two different Demonstrators that result in the *same* optimal path on that specific map.
      *   *Learners:* Try to guess the Reward Card. They will argue. They will be wrong (or right by luck).

      *   *Let's go with the Grid/Path idea but make it very concrete.*
      *   *Name:* **"The Commute."**
      *   *Grid:* 5x5. Start (Home), End (Work).
      *   *Obstacles:* Some squares blocked.
      *   *Hidden Features:* Each square has a "Scenery" value and a "Noise" value printed on the back (or on a separate key).
      *   *Demonstrator Secret:* "I maximize Scenery" OR "I minimize Noise."
      *   *Design:* Create a map where the path with highest Scenery is identical to the path with lowest Noise.
      *   *Learner:* "Did they like Scenery or hate Noise?"
      *   *Result:* Indistinguishable.

      *   *Actually, let's make it even simpler for a 90-min workshop.*
      *   *Activity:* **"The 5-Choice Menu."**
      *   *Why:* No drawing, just cards.
      *   *Setup:* 5 Rounds. In each round, 3 Options are presented (Card A, B, C). Demonstrator picks one.
      *   *Attributes:* Each Option has 2 attributes (e.g., Sweet vs. Salty, Cheap vs. Expensive).
      *   *Secret Rule:* "Always pick Sweet" OR "Always pick Cheap."
      *   *The Trap:* In the specific 5 rounds provided, the "Sweet" option is *always* the "Cheap" option.
      *   *Learner Task:* Deduce the rule.
      *   *Debrief:* You can't. The data is collinear.

      *   *Decision:* The **"Route Planning"** on a fixed map is more visceral for "RL" than menu picking. It feels more like "behavior." Let's stick with a simplified Grid World. It maps better to "states and actions."

      *   *Revised Plan:*
          1.  **Materials:** Printed 4x4 Grids, Transparency overlays (for hidden features), Tokens.
          2.  **Roles:** Demonstrator (has secret goal), Learner (watches path), Observer (takes notes).
          3.  **The Trick:** Two different "Reward Maps" yield the same "Optimal Path" due to obstacles.
          4.  **Timeline:** 15 min intro, 40 min game (2 rounds), 35 min debrief.

  4.  **Drafting the Content:**

      *   *Materials:* Need to be printable. Grid, Obstacle cards, Reward Keys.
      *   *The "Trap":* I need to explicitly design the grid so that Reward Function A and Reward Function B produce the same behavior.
          *   Grid: Start (0,0), End (3,3).
          *   Obstacles: Block specific paths to force convergence.
          *   Reward A: +10 for stepping on 'Green' tiles.
          *   Reward B: +10 for stepping on 'Blue' tiles.
          *   Design: The only viable path goes through tiles that are *both* Green and Blue. Tiles that are Green-only or Blue-only are blocked or off-path.
      *   *Wait, simpler:*
          *   Reward A: Avoid Red tiles.
          *   Reward B: Seek Green tiles.
          *   Map: The only path that avoids Red *is* the path that seeks Green.
      *   *Even simpler for non-coders:*
          *   **Scenario:** "The Office Snack Run."
          *   **Map:** A floorplan with 4 paths from Desk to Breakroom.
          *   **Hidden Variables:** Path 1 (Fast, Loud), Path 2 (Slow, Quiet), Path 3 (Fast, Quiet), Path 4 (Slow, Loud).
          *   **Demonstrator 1 Secret:** "I value Speed." (Chooses Path 1 or 3).
          *   **Demonstrator 2 Secret:** "I value Quiet." (Chooses Path 2 or 3).
          *   **The Trap:** Add an obstacle (e.g., "Wet Floor") that blocks Path 1 and Path 2.
          *   **Result:** Both Demonstrators *must* choose Path 3.
          *   **Learner:** Sees Path 3. Is it Speed or Quiet? Impossible to know.

      *   *Let's flesh this out.* This is the "Identifiability Problem."
      *   *Game Title:* **"The Indistinguishable Commute."**
      *   *Materials:* Printed maps, "Secret Goal" cards, "Obstacle" cards.
      *   *Groups:* 3-4 people. 1 Demonstrator, 2 Learners, 1 Facilitator/Timekeeper.
      *   *Rounds:*
          *   Round 1: Open map. Learners guess correctly (Calibration).
          *   Round 2: Constrained map (The Trap). Learners argue and fail (The Lesson).

  5.  **Addressing the Debrief (The "So What?"):**
      *   Map the game to IRL terms.
      *   *Behavior* = The Path taken.
      *   *Reward Function* = The Secret Goal.
      *   *Underdetermination* = Multiple Goals -> Same Path.
      *   *Rationality Assumption:* We assumed the Demonstrator was optimizing. What if they just liked the color of the carpet? (Boltzmann rationality).
      *   *Feature Representation:* The map only showed Speed/Noise. What if there was a "Smell" feature we didn't see? (Omitted Variable Bias).
      *   *Journalistic takeaway:* Don't write "AI learned values." Write "AI found a value system consistent with behavior."

  6.  **Predicting Failure Modes:**
      *   *Failure 1:* Demonstrator acts "irrationally" (picks suboptimal path). *Fix:* Instruct them to be optimal.
      *   *Failure 2:* Learners guess the right answer by luck. *Fix:* Emphasize in debrief that being right doesn't mean the *method* worked.
      *   *Failure 3:* Groups finish too fast. *Fix:* Add a "Round 3" where they have to design a test to distinguish the goals (Active IRL).
      *   *Failure 4:* Overconfidence. *Fix:* The debrief must be hard-hitting.

  7.  **Refining the Limitations:**
      *   Real IRL deals with high-dimensional continuous spaces, not 4 paths.
      *   Real IRL uses probabilities (noisy rationality), not deterministic choices.
      *   Real IRL often has *some* identifiability with enough diverse data (this game shows the worst-case).

  8.  **Final Polish:**
      *   Tone: Professional, engaging, respectful of their intelligence.
      *   Formatting: Clear headers, bullet points, printable-ready descriptions.
      *   Check timing: 90 mins is tight. Keep instructions crisp.

      *(Self-Correction during drafting)*: Make sure the "Secret Goals" are truly indistinguishable in Round 2.
      *   Path A: 5 mins, Noisy.
      *   Path B: 10 mins, Quiet.
      *   Path C: 5 mins, Quiet.
      *   Goal 1: Minimize Time. (Options: A or C).
      *   Goal 2: Minimize Noise. (Options: B or C).
      *   Constraint: Path A is blocked (Construction). Path B is blocked (Elevator Broken).
      *   Result: Both must pick C.
      *   Learner sees C. Was it Time or Noise?
      *   Perfect.

      *Wait, one more layer:* To make it about "Reward Functions" specifically, let's assign point values.
      *   Goal 1: +10 pts per minute saved.
      *   Goal 2: +10 pts per decibel reduced.
      *   It leads to the same choice.
      *   Okay, I will stick to the "Attributes" version as it's more intuitive for non-coders than abstract points.

      *Let's write the response.*
answer: |-
  Here is a complete design for your 90-minute workshop. It is built to be low-tech (paper and pens), high-engagement, and specifically engineered to force the "underdetermination" problem to happen visibly.

  # Workshop Title: The Indistinguishable Commute
  **Goal:** Demonstrate that multiple, distinct internal reward functions can produce identical optimal behavior, making "value inference" fundamentally ambiguous without further constraints.

  ## 1. Materials & Prep (Cheap & Printable)
  You need to prepare packets for each small group (3–4 people per group).

  **Per Group Packet:**
  1.  **3 "City Maps" (Printed):**
      *   *Map A (Tutorial):* 4 distinct paths from Home to Work. No obstacles.
      *   *Map B (The Trap):* Same 4 paths, but Path 1 and Path 2 are marked "BLOCKED" (e.g., Construction, Flood).
      *   *Map C (The Test):* Same 4 paths, different obstacles (designed for the debrief).
  2.  **6 "Commute Cards" (Cut out):**
      *   These describe the attributes of the 4 paths.
      *   *Path 1:* 5 mins, Noisy.
      *   *Path 2:* 10 mins, Quiet.
      *   *Path 3:* 5 mins, Quiet.
      *   *Path 4:* 10 mins, Noisy.
  3.  **4 "Secret Goal" Cards (Folded/Hidden):**
      *   *Card Alpha:* "Maximize Speed (Choose fastest available path)."
      *   *Card Beta:* "Maximize Peace (Choose quietest available path)."
      *   *Card Gamma:* "Avoid Crowds (Choose Path 4 only)." (Distractor)
      *   *Card Delta:* "Random Walker (Pick any open path)." (Distractor)
  4.  **Worksheet:** A simple sheet for Learners to write their hypothesis and confidence level (0–100%).
  5.  **Pens.**

  **Room Setup:**
  *   Tables arranged for groups of 3–4.
  *   Whiteboard/Projector for the debrief.

  ---

  ## 2. The Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Intro** | Hook: The headline "AI Learned Human Values." The claim: We can read minds by watching feet. |
  | **10–25** | **Round 1** | **Calibration.** Open map. Demonstrator has a simple goal. Learners guess. (Builds confidence). |
  | **25–45** | **Round 2** | **The Trap.** Constrained map. Two different Goals yield the *same* choice. Learners argue. (Breaks confidence). |
  | **45–55** | **Break** | Bio break. Let the frustration simmer. |
  | **55–80** | **Debrief** | Map the game to IRL math. Discuss ambiguity, rationality, and features. |
  | **80–90** | **Takeaway** | Drafting better headlines. Q&A. |

  ---

  ## 3. The Activity Rules

  **Roles:**
  *   **The Demonstrator (1 person):** Receives a Secret Goal Card. Looks at the Commute Cards. Chooses a path on the Map. *Must* act rationally to achieve their goal.
  *   **The Learners (2–3 people):** See the Map and the Commute Cards. See the *Choice* made. Do **not** see the Secret Goal. Must deduce the Goal.

  **Round 1: Calibration (15 mins)**
  *   **Map:** Map A (All 4 paths open).
  *   **Secret Goal:** Give the Demonstrator *Card Alpha* (Maximize Speed).
  *   **Action:** Demonstrator selects Path 1 or 3 (both are 5 mins). Let's say they pick Path 3.
  *   **Learner Task:** "What did they value?"
  *   **Expected Outcome:** Learners guess "Speed." They might be unsure between Speed vs. Peace (since Path 3 is both), but Path 1 was available (Fast/Noisy). If they picked Path 3 over Path 1, they might value Peace too.
  *   **Point:** Data distinguishes goals *if* the environment allows divergence.

  **Round 2: The Trap (20 mins)**
  *   **Map:** Map B (Path 1 and Path 2 are BLOCKED).
  *   **Setup:** This is the critical moment.
      *   *Group 1 Demonstrator* gets **Card Alpha** (Maximize Speed).
      *   *Group 2 Demonstrator* gets **Card Beta** (Maximize Peace).
      *   *(If you have many groups, split them half/half).*
  *   **Available Paths:**
      *   Path 1 (Fast/Noisy) -> **BLOCKED**
      *   Path 2 (Slow/Quiet) -> **BLOCKED**
      *   Path 3 (Fast/Quiet) -> **OPEN**
      *   Path 4 (Slow/Noisy) -> **OPEN**
  *   **Action:**
      *   Demonstrator 1 (Speed) compares Path 3 (5m) vs Path 4 (10m). Picks **Path 3**.
      *   Demonstrator 2 (Peace) compares Path 3 (Quiet) vs Path 4 (Noisy). Picks **Path 3**.
  *   **Learner Task:** "What did they value?"
  *   **Expected Outcome:** Both groups observed the exact same behavior (Path 3). Group 1 thinks "It was Speed." Group 2 thinks "It was Peace."
  *   **The Conflict:** Bring the groups together. Ask Group 1: "How do you know it wasn't Peace?" Ask Group 2: "How do you know it wasn't Speed?"
  *   **Result:** They cannot know. The data is identical. The reward functions are **unidentifiable**.

  ---

  ## 4. The Debrief (Mapping to Technical Reality)
  *Use the whiteboard. Draw the grid from the game, then draw the math next to it.*

  **1. Reward Ambiguity & Identifiability**
  *   **Game:** Two different Secret Goals (Speed vs. Peace) produced the exact same Path (3).
  *   **Tech:** In Inverse Reinforcement Learning (IRL), we observe policy $\pi$ (the path) and want to find reward $R$. But many $R$ functions optimize the same $\pi$.
  *   **Headline Fix:** Instead of *"AI Inferred Human Values,"* write *"AI Found a Value System Consistent With Observed Behavior."*

  **2. The Rationality Assumption**
  *   **Game:** You assumed the Demonstrator was *optimizing* their Secret Goal.
  *   **Tech:** IRL assumes "Boltzmann Rationality"—agents are more likely to pick higher-reward actions, but not perfectly.
  *   **The Catch:** If the Demonstrator just liked the color of the path marker (a feature you didn't measure), your inference is garbage.
  *   **Discussion:** Did anyone consider the Demonstrator might be irrational? How would that break your model?

  **3. Feature Representation (The "State" Problem)**
  *   **Game:** The Commute Cards only listed Time and Noise.
  *   **Tech:** If the reward function depends on a feature you didn't record (e.g., "Scenery" or "Safety"), you cannot learn it.
  *   **The Catch:** In real AI, we define the state space. If we leave out "user safety" from the features, the AI cannot learn to value it, even if the human does.
  *   **Headline Fix:** *"AI Learned Preferences Within The Limits Of Its Sensors."*

  **4. Why Labs Can Still Report This**
  *   **Question:** "If it's ambiguous, why did the paper get published?"
  *   **Answer:** Because in the lab, they regularize. They pick the *simplest* reward function that fits (Maximum Entropy IRL).
  *   **Analogy:** It's like drawing a line through two dots. Infinite lines fit. But we pick the straight one because it's simplest. It works for prediction *in that context*, but it's not "Truth."

  ---

  ## 5. Predictable Failure Modes (And How to Handle Them)

  **Failure 1: The "Rationality" Rebellion**
  *   *What happens:* A Learner says, "Maybe they just liked Path 3 because it's the middle one. They weren't optimizing anything."
  *   *Why:* This is actually correct! Real humans aren't perfect optimizers.
  *   *Fix:* Validate them. "You just discovered the **Rationality Assumption** problem. If the human isn't optimizing, IRL fails. The paper assumes they are. Are they?"

  **Failure 2: Accurate Guessing by Luck**
  *   *What happens:* In Round 2, a Learner guesses "Speed" and the Demonstrator *was* using "Speed." The Learner claims victory.
  *   *Why:* 50/50 chance.
  *   *Fix:* Ask the *other* group. "Group 2 had the same behavior but used 'Peace.' Does Group 1's victory prove Group 2 wrong?" (No). Emphasize that **fit does not equal truth.**

  **Failure 3: The Demonstrator Cheats**
  *   *What happens:* The Demonstrator picks Path 4 just to be difficult.
  *   *Fix:* In the instructions, emphasize: "You are a robot. You must maximize your score." If they break character, discard that round.

  **Failure 4: It's Too Easy**
  *   *What happens:* Groups solve Round 2 instantly.
  *   *Fix:* Have a **Round 3** ready. Give them Map C where Path 3 is *also* blocked. Now both Speed and Peace seekers must pick Path 4 (Slow/Noisy).
      *   Speed seeker hates it.
      *   Peace seeker hates it.
      *   *Lesson:* When constraints get tight, behavior converges even more, making inference *harder*, not easier.

  ---

  ## 6. Limitations (What to Say in the Close)
  *Be honest about where the game diverges from reality. This builds trust.*

  1.  **Discrete vs. Continuous:** "In the game, you had 4 paths. In real AI, the 'path' is a high-dimensional vector of probabilities. The ambiguity is vastly worse, not better."
  2.  **Deterministic vs. Probabilistic:** "In the game, the Demonstrator picked the *best* path. Real IRL uses 'noisy' rationality (softmax). It tries to fit the *distribution* of choices, not just one. But the identifiability problem remains."
  3.  **Single Agent vs. Population:** "We played with one Demonstrator. Real IRL uses thousands of users. This helps, *unless* all thousands of users are stuck in the same 'Map B' environment (e.g., everyone uses the same app interface). If the environment doesn't vary, the data doesn't help."

  ## 7. The Journalistic Takeaway (Handout)
  *Print this small card for them to take back to their desks.*

  **The IRL Checklist for Reporters:**
  1.  **Did they vary the environment?** If the users always faced the same choices, the AI can't distinguish preferences.
  2.  **What features were visible?** If the AI couldn't see "safety," it can't learn to value "safety."
  3.  **Did they claim "The" Preference?** Challenge the definite article. It should be "*A* preference function consistent with..."
  4.  **Where did the rationality come from?** Did they assume users were perfect optimizers? (They aren't).

  ---

  ## Why This Works for Your Newsroom
  *   **No Code:** It uses logic and maps, not Python.
  *   **Visceral:** They *feel* the frustration of not knowing the answer despite having "perfect" data.
  *   **Specific:** It targets the exact phrase "inferred what humans value" and shows why it's technically shaky.
  *   **Safe Failure:** Getting the answer wrong in the game is the point. It lowers the stakes for admitting uncertainty in their reporting.
