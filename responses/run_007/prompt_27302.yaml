      *The Conflict:* You can't consistently hold that naturalness is an objective feature of the world that solves Grue (4) *and* that it's a projection of our habits (5) *and* that it's an unjustifiable bedrock (7) without clarifying the metaphysical status of "naturalness."
      *   If (5) is true, (4) is weakened (it's not a *principled* reason, it's a psychological fact).
