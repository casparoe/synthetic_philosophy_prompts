answer: |-
  1. **Critic:** Mathematically, your view is represented as $\sum g(w_i)$ where $g$ is a concave transformation of welfare. That is structurally identical to utilitarianism with diminishing marginal utility of welfare. You haven't escaped egalitarianism; you've just baked the equality preference into the metric of welfare itself. By choosing a concave function, you are implicitly saying that distribution matters, which is the egalitarian intuition you claim to reject.

     **Prioritarian:** The math overlaps, but the normative structure differs fundamentally. Telic egalitarianism values the *relation* between $w_i$ and $w_j$; it says equality is intrinsically good. Prioritarianism values $w_i$ based on its absolute magnitude alone. The concave function reflects the moral urgency of benefits, not the value of equality. I can explain the weighting without ever referencing another person's level of welfare.

  2. **Critic:** But you cannot explain the weighting without referencing a baseline. If you say "a benefit matters more at lower levels," you are grounding the weight in the person's position. But position is only meaningful relative to a standard. If you're alone on an island, are you "low"? If yes, your view collapses into absolute sufficiency. If no, then "low" means "lower than others." If it's the latter, you're weighting based on relational status, which is egalitarianism. You need a comparative baseline to justify the concave curve.

     **Prioritarian:** "Low" refers to absolute well-being, not rank. A person suffering intense pain has high priority regardless of whether others are in agony or bliss. The weight tracks the moral urgency of relieving suffering, not the gap between persons. The baseline is the scale of well-being itself, not the distribution of well-being across the population. I don't need to know anyone else's welfare to determine the moral weight of a benefit to you.

  3. **Critic:** Let's apply this to Leveling Down. I reduce the rich man's welfare without helping the poor man. The poor man's absolute level is unchanged, so his weight is unchanged. You say there's no gain. But if the justification for the weight is "because they have less," then the *reason* they have priority is their scarcity of welfare. If I destroy the rich man's welfare, I increase the scarcity of welfare in the aggregate. Doesn't the poor man's claim become stronger simply because others now have less, making his relative deprivation more salient?

     **Prioritarian:** No. The priority weight attaches to the individual's absolute state, not the distribution of states. Destroying the rich man's welfare creates no benefit. It generates no positive value to offset the loss. The poor man's claim strength is fixed by his own level, not by the destruction of value elsewhere. Under egalitarianism, leveling down narrows the gap, which is a pro tanto good. Under prioritarianism, nothing good happens because no one is benefited and the weights are non-relational.

  4. **Critic:** That's the dodge. You say the claim is fixed by his level. But why does level dictate weight? The only non-arbitrary answer is "because having less is bad." But "having less" is the definition of inequality. You've just relabeled equality as "absolute priority." If the reason for the weight is that they have less than others *could* have, or less than is *normal*, you're smuggling in a comparative baseline. You haven't eliminated equality; you've privatized it. The Leveling-Down Objection returns because your justification for the curve relies on the very thing you claim to ignore.

     **Prioritarian:** I deny that "having less" is the reason. The reason is that benefits have diminishing moral value. A unit of welfare is more morally valuable when it alleviates suffering than when it adds to luxury. This is a claim about the moral value of welfare itself, not about the distribution of welfare across persons. I can hold this view even in a one-person world. Egalitarianism cannot. That formal difference blocks Leveling Down because I do not value the pattern, only the weighted sum.

  5. **Critic:** But that claim about moral value is unsupported without a comparative story. If welfare is welfare, why is a util at level 10 morally different from a util at level 100? Unless you say "because 10 is unequal compared to a reasonable standard," you're asserting a brute fact. Egalitarianism admits the comparison openly. You hide it in the utility function to dodge Leveling Down, but the objection remains: if you value the bottom more, you must value the gap less, and that makes leveling down pro tanto good in respect of closing the gap.

     **Prioritarian:** The Leveling-Down Objection asks if there is *any* respect in which leveling down is good. For the egalitarian, the narrowing gap is a good thing. For me, there is no gap value. The diminishing moral value of welfare explains the weighting without invoking the good of equality. I can reject leveling down entirely because I value weighted welfare, not patterns. The justification blocks the objection because I deny the premise that equality is a value, even if the output of our views sometimes converges.
