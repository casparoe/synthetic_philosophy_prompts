prompt: |-
  I am a philosophy professor serving on my university's AI policy working group, and the phrase "counterfeit people" has become a conversation-stopper. One colleague uses it to mean simply that a chatbot is not a person; another uses it to mean that AI systems that imitate persons are corrosive to the trust on which institutions depend; a third invokes it to justify a blanket disclosure requirement for any student-facing AI. Before our next meeting, I want a disambiguation rather than a single interpretation. What are the distinct precise claims that Dennett's phrase "counterfeit people" could be marking, from the nearly vacuous to the substantive and controversial? For each reading, say whether it is plausible or false, and identify which reading, if any, does the work each colleague is asking it to do. I need a menu of readings I can bring to the committee.
