      *   *Source:* Daniel Dennett has used this phrase in various contexts (interviews, essays, talks around 2023-2024 regarding AI).
      *   *Core Idea:* Dennett is generally concerned with *competence without comprehension* and the social dangers of being deceived by systems that mimic human agency without having the moral status or internal life of humans. He often links this to trust and the "user interface" of humanity.
      *   *Key Distinction:* It's not just "is it conscious?" but "is it safe to treat it as a person in our social fabric?"

