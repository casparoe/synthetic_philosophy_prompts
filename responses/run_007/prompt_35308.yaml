answer: |-
  The problem of normative bootstrapping is fundamentally a dilemma between circularity and reduction. To explain the obligation generated by a promise, we must appeal to a prior normative principle. If that principle is itself promissory (e.g., a tacit promise to keep conventions), the argument is viciously circular. If the principle is non-promissory (e.g., utility or harm prevention), it fails to capture the distinctive *directedness* of promissory obligation. A promise creates a duty *owed to the promisee*, granting them a specific right to demand performance. General duties to uphold social practices or minimize harm are owed to the community or the impartial good, not specifically to the individual promisee. Thus, the literature faces a structural impasse: either the explanation presupposes what it seeks to explain, or it explains it away.

  Humean conventionalism attempts to ground the obligation in the social utility of the practice. It avoids circularity by denying that the convention rests on a prior promise. However, it succumbs to the reduction problem. If my duty is to uphold the institution of promising because it benefits society, then breaking a promise is wrong because it damages social trust, not because it wrongs *you*. This cannot account for the promisee's standing to release me from the obligation. If the duty were truly to the impartial good, your consent could not extinguish it, yet intuitively, a promisee can release a promisor. Conventionalism saves the binding force but loses the relational structure.

  Scanlon's expectation-based account attempts to recover directedness by focusing on the harm done to the specific promisee when expectations are disappointed. However, this invites the circularity worry you identified. Not all expectations generate obligations; I am not obligated to fulfill every prediction you make about my behavior. The expectation generated by a promise is morally potent only because it was created by an *assurance* that one would perform. But an assurance just is a commitment to be bound. To say "you ought not disappoint expectations created by binding assurances" is tautological. The principle of fidelity presupposes the very normative force it aims to explain. It explains the obligation by referencing the expectation, but the expectation is only protected because of the obligation.

  Is there a way out? The only viable resource lies in accepting a primitive **normative power**. On this view, the capacity to create obligations by speech is not derived from a prior duty (whether conventional or harm-based) but is a basic feature of moral agency, akin to the power of consent. We possess a general, standing duty to respect the exercises of certain normative powers by others. When I promise, I exercise a power to alter the normative relationship between us, and you acquire a right because the moral law recognizes your authority to claim this assurance.

  This avoids circularity because the source of the obligation is not a prior promise, but a general duty to respect agency. It avoids reduction because the duty is triggered specifically by the interaction between promisor and promisee, preserving directedness. However, this solution comes at a metaphysical cost. It requires accepting that agents have a queer, sui generis capacity to change moral reality ex nihilo, constrained only by the broader duty to respect such capacities. While this avoids the logical traps of conventionalism and contractualism, it trades conceptual circularity for metaphysical primitivism. Ultimately, breaking the bootstrapping circle requires admitting that the power to promise is a fundamental, unanalyzable brick in the moral architecture. Any attempt to derive it from something else will either circle back to promising or dissolve the specific relational bond that defines it.
