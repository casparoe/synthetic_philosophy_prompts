answer: |-
  Your instincts are spot on, and you are right to feel that something was glossed over in that summary. The economist you heard was speaking from a particular behavioral economics perspective that often prioritizes descriptive accuracy over normative force, and while nothing they said was technically false regarding the mechanics of the paradox, the philosophical conclusions they drew are much more contested than they let on. The core issue here is indeed the distinction between descriptive and normative claims, and your suspicion that these were being run together is the key to untangling the debate.

  To start with the part of the summary that is generally accepted by decision theorists across the board, the logical structure of the Allais paradox is sound. The economist correctly described the choice pattern that many people exhibit, and they correctly identified that this pattern violates the independence axiom. If you prefer a sure million over a gamble that offers a high chance of a million and a small chance of five million, consistency demands you maintain that preference ranking when you strip away the common 89 percent chance of winning a million from both options. When people switch their preferences in the second scenario, choosing the riskier option for the higher payoff despite having rejected risk in the first scenario, they are mathematically violating the independence axiom. No serious decision theorist disputes that the Allais preferences are incompatible with expected utility theory.

  Where the economist's summary becomes controversial is in the interpretation of what that violation means. When the speaker said the independence axiom is false, they were treating the axiom as a descriptive law of human psychology, similar to a law in physics. If an axiom is meant to describe how people actually behave, then yes, the Allais paradox shows it is false because people systematically violate it. However, in philosophy and much of normative economics, the axioms of expected utility theory are not primarily descriptive claims but normative principles. They are proposed as standards of rational coherence. From this perspective, the Allais paradox does not prove the axiom is false; rather, it demonstrates a tension between our intuitive judgments and the requirements of consistency. Many philosophers argue that the correct response to the paradox is not to abandon the axiom but to recognize that the common Allais preferences are irrational. On this view, the paradox serves as a Dutch book argument or a money pump scenario, showing that agents with these preferences are vulnerable to exploitation or internal inconsistency, and thus ought to revise their preferences to align with the axiom.

  This brings us to the claim that expected utility theory has been empirically refuted and that the framework is dead. This is an overstatement that depends entirely on what you expect the theory to do. If you view decision theory as a psychological model meant to predict actual human behavior in all contexts, then expected utility theory is indeed inadequate, and models like prospect theory do a better job of capturing phenomena like loss aversion and the certainty effect demonstrated by Allais. Prospect theory modifies the utility function and the weighting of probabilities to accommodate these violations, and it is the dominant descriptive model in behavioral economics. However, if you view decision theory as a normative account of rational choice, expected utility theory remains the gold standard. It is still the foundational framework for most work in ethics, political philosophy, and normative economics. The fact that humans frequently violate its axioms does not necessarily refute the theory's claim about what rational agents should do, any more than the fact that humans are bad at mental arithmetic refutes the laws of mathematics.

  The economist's conclusion that decision theory has moved on implies a consensus that does not exist. The field is better described as bifurcated. There is a descriptive project, largely housed in psychology and behavioral economics, which uses tools like prospect theory to model actual behavior. Then there is a normative project, largely housed in philosophy and classical economics, which continues to refine and defend expected utility theory as the correct account of rationality. Some researchers even work on hybrid models or alternative normative theories, such as weighted utility theory or regret theory, which attempt to preserve some normative force while accommodating Allais-type preferences, but these are not universally accepted replacements. The independence axiom remains a central point of contention, with some arguing it is too strong a requirement for rationality and others arguing it is the minimal condition for consistent agency.

  So your suspicion that the economist was conflating descriptive failure with normative refutation is well-founded. The Allais paradox is a powerful result, but it does not settle the philosophical question of how we ought to make decisions. It merely establishes that our intuitive preferences often clash with the requirements of expected utility maximization. Whether we should fix our preferences or fix the theory is still an open debate, and one that is very much alive in philosophy. You are not missing anything about the terrain by feeling uncomfortable with the economist's conclusion; you are correctly identifying a category error that is common when economists speak to philosophers. The framework is not refuted in the sense that it is no longer useful or defensible; it is challenged descriptively, but it retains its normative prestige. For your work in practical reason, this means you can still legitimately use expected utility theory as a baseline for rationality, provided you acknowledge the Allais paradox as a significant objection that requires a response, whether that response is defending the axiom, modifying the theory, or arguing that the intuitive preferences reveal a deeper structure of rationality that expected utility misses.
