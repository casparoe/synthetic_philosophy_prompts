answer: |-
  To run *R v Dudley and Stephens* through Scanlon's contractualism, we must treat the lifeboat not as a courtroom but as a site of moral justification. The core question is not legal liability but whether the act could be justified by principles no one could reasonably reject.

  ### The Parties and Their Complaints
  In Scanlon's framework, we look for "generic reasons"—reasons anyone in that position would have, stripped of personal idiosyncrasies.
  *   **Richard Parker:** His generic reason is the claim not to be killed. The burden imposed on him by a principle permitting his sacrifice is death, compounded by the violation of his agency (being used as a means).
  *   **Dudley and Stephens:** Their generic reason is the claim to survive. The burden imposed on them by a principle forbidding killing is also death (via starvation).
  *   **Brooks:** His position is complex; he dissented but benefited. His complaint aligns with Dudley and Stephens regarding survival, but his initial dissent weakens his claim to have authorized the killing.

  ### The Principles and Reasonable Rejection
  We test two competing principles for the general regulation of behavior in extreme emergencies.

  **Principle A (Necessity):** "In situations of imminent death where survival is impossible without it, it is permissible to kill one innocent person to save the others."
  *   **Parker's Rejection:** Parker can reasonably reject this. The burden is absolute loss of life without consent. Crucially, Scanlon emphasizes that the burden of *being killed* is distinct from and heavier than the burden of *dying*. Being killed involves a specific wrong done *by* others, violating a claim to security against active harm.
  *   **Dudley/Stephens' Defense:** They might argue Parker cannot reasonably reject this because the alternative is everyone dying. However, Scanlon argues that reasonable rejection is not determined solely by the outcome (death) but by the *grounds* of the complaint. Parker's complaint rests on a right not to be sacrificed; Dudley's rests on a desire to be saved. The former is typically stronger in contractualism.

  **Principle B (Prohibition):** "It is never permissible to kill an innocent person, even to prevent one's own death from natural causes."
  *   **Dudley/Stephens' Rejection:** Can they reasonably reject this? They face death. However, Scanlon would argue that the burden of dying from starvation, while terrible, does not outweigh Parker's burden of being murdered. The principle protects Parker from being used; it does not guarantee Dudley survival, only that he won't be killed by his companions.
  *   **The Verdict:** Principle A is disallowed because Parker can reasonably reject it. Principle B is allowed because Dudley's reasons for rejecting it (survival via killing) are outweighed by Parker's reasons for accepting it (security against murder).

  ### The Aggregation Problem
  This is where the machinery strains. You have three lives (Dudley, Stephens, Brooks) versus one (Parker). Utilitarianism sums them: 3 > 1. Scanlon is famously wary of aggregation.

  In *What We Owe to Each Other*, Scanlon discusses the "Rescue Case" (save five drowning people or one). He eventually concedes that numbers *can* count when claims are identical (five claims to be saved vs. one claim to be saved). However, *Dudley* is not a rescue case; it is a sacrifice case.
  *   **Claims are not identical:** Parker's claim is "do not kill me." Dudley's claim is "save me from starvation." Scanlon argues these are not fungible. You cannot aggregate three claims to *be saved* to outweigh one claim *not to be killed*.
  *   **The Aggregation Limit:** If the situation were purely "who dies?" (e.g., a rockfall will crush either 1 person or 3 people, and you can divert it), Scanlon allows saving the greater number because the claims are equal (claims not to die). But in *Dudley*, the mechanism matters. The theory blocks aggregation here because the *type* of burden on Parker (homicide) is categorically heavier than the burden on the others (starvation), regardless of the numbers.

  ### The Doing/Allowing Distinction
  Does this distinction do work? Yes, it is the linchpin. Without it, contractualism risks collapsing into a numbers game. Scanlon relies on the idea that individuals have stronger complaints against being harmed by others than against not being aided by others.
  *   **Natural Fit:** This aligns with the intuition that murder is worse than letting die.
  *   **The Bend:** Critics argue this distinction is deontological baggage imported into contractualism. If the "generic reason" is simply "I want to live," why does the mechanism (knife vs. starvation) change the weight of the reason? Scanlon must argue that the social condition of living under principles requires security against active predation, which is a heavier burden to lose than the hope of rescue.

  ### The Contractualist Solution: Consent and Lotteries
  Scanlon's theory naturally points toward consent procedures. If the men had agreed *ex ante* to a lottery where the loser is eaten, Parker's complaint changes. He would have consented to the principle "In emergencies, we draw lots to decide who dies."
  *   **Why this works:** Consent neutralizes the "reasonable rejection." Parker could not reasonably reject a principle he agreed to under fair conditions.
  *   **What they should have done:** Draw lots. Since they did not, they violated the requirement to find principles acceptable to all. They treated Parker as a resource, not a co-legislator of their survival rules.

  ### What the Case Shows About the Theory
  **Strengths:**
  1.  **Individual Veto:** The theory explains why Parker's individual status matters. He isn't just a unit of value; he is a party to the agreement.
  2.  **Procedural Fairness:** It naturally generates the lottery solution, which matches many moral intuitions about fairness in dire straits.

  **Weaknesses/Awkwardness:**
  1.  **Reliance on Doing/Allowing:** The theory avoids the aggregation problem largely by insisting that killing is worse than letting die. If you challenge that distinction (e.g., arguing that in a closed lifeboat, *not* killing Parker is actively choosing to let the others die), contractualism struggles to explain why the numbers don't count. It risks looking like it begs the question: "Killing is worse because the principle against it cannot be reasonably rejected," but the reason it can't be rejected is that killing is worse.
  2.  **Ex Ante Probabilities:** Contractualism relies on generic reasons based on foreseeable outcomes. At the time, death seemed certain for all without Parker. If the generic reason is "certain death vs. certain death," the distinction between killing and dying becomes thinner. The theory relies on the *moral* distinction surviving the *empirical* equality of the outcome.

  **Overall Fit:**
  The theory handles the lack of consent and the individual complaint naturally. It has to work harder to explain why the three lives don't aggregate to outweigh the one, relying heavily on the qualitative difference between homicide and starvation. It reaches the legal holding (guilty), but arguably for more nuanced reasons than the court's blunt "necessity is no defense."

  \answer{Scanlon's contractualism condemns the killing because Parker's individual claim not to be murdered outweighs the aggregated survival claims of the others, unless fair consent procedures like a lottery are used.}
