answer: |-
  Your gut instinct is spot on, and your mate is relying on a model that works for casinos and insurance companies, but not for individual human beings. You have stumbled upon one of the most famous problems in economics and decision theory.

  The principle that captures your verdicts is called **Expected Utility Theory**, specifically incorporating the concept of **Diminishing Marginal Utility of Wealth**.

  Here is how this principle explains your intuition, why your mate's advice is dangerous, and what it says about that 1-in-10-million ticket.

  ### 1. Why Expected Value fails
  Expected Value (EV) assumes that money is linear. It assumes that £500 is exactly 100 times more valuable to you than £5. In a purely mathematical sense, this is true. In a human sense, it is false.

  The first £1,000 you earn keeps you fed and housed. The millionth £1,000 buys you a slightly nicer car. The *utility* (satisfaction or usefulness) you get from money decreases as you get more of it. This is **Diminishing Marginal Utility**.

  Because of this, you are **risk-averse**. You prefer a certain £4 over a 50% chance of £10, even though the EV is £5. The pain of losing your entry fee is felt more sharply than the pleasure of a win that might not happen.

  ### 2. Does this principle force you to change your verdicts?
  Surprisingly, no. In fact, Expected Utility Theory validates your gut feelings over the raw Expected Value calculations.

  *   **The Coin Flip (50% @ £10):** You offered £4. This is very close to the EV (£5). Because the risk is low and the sum is small, your utility function is almost linear here.
  *   **The Long Shots (1-in-100 to 1-in-1,000,000):** You offered less and less (£2 down to 20p) despite the EV staying at £5. This is perfectly consistent with risk aversion. The variance is huge. The chance of walking away with nothing is so high that the theoretical average becomes meaningless to your personal finances.
  *   **St Petersburg Paradox:** This is the classic example. In 1738, Daniel Bernoulli used this exact game to prove that people maximise *utility*, not *value*. He showed that if you calculate the expected *utility* (using a logarithmic scale), the infinite value collapses into a finite, reasonable number. Your cap of £15 is actually quite standard for this game; most people won't pay more than £20, regardless of the infinite EV.

  So, the principle suggests you shouldn't change your verdicts. Your intuition is correctly accounting for the fact that a 1-in-a-million chance is practically zero in a single lifetime, whereas the maths treats it as a valid average over infinite trials.

  ### 3. The 1-in-10,000,000 shot at £50,000,000
  This is the fascinating case. The Expected Value is still £5. Based on your previous trend (where lower probability led to lower willingness to pay), you should pay less than the 20p you offered for the 1-in-a-million game. Financially, the principle suggests this ticket is worth pennies.

  However, Expected Utility Theory has a nuance here. While the probability is lower, the **magnitude** of the win (£50m vs £5m) might cross a threshold of "life-changing wealth".
  *   £5 million makes you very comfortable.
  *   £50 million makes you part of a global elite; you could never work again, buy islands, etc.

  For some people, the utility of £50m is not just 10x the utility of £5m; it represents a fundamental shift in life status. This might justify paying *more* than your trend suggests, perhaps even a few pounds, not because the EV is better (it isn't), but because the *utility* of that specific jackpot spikes disproportionately.

  However, if we look at it purely through the lens of risk aversion you've shown so far, the principle says: **do not be fooled by the headline figure.** The odds are so astronomically against you that the ticket is financially worthless. The only reason to buy it is for the "dream value" (the fun of imagining winning for a few days), which you already acknowledged in your 1-in-a-million example.

  ### Summary
  Your mate is treating you like a bank. Banks have billions of pounds and can play games millions of times; for them, Expected Value is real. You are an individual with limited funds playing a game once; for you, **Expected Utility** is what matters.

  *   **The Principle:** Expected Utility with Diminishing Marginal Utility.
  *   **Your Verdicts:** They are sound and economically rational.
  *   **The 1-in-10m Ticket:** Financially, it is worth less than 20p. Any more than that is paying for entertainment, not investment.

  Trust your gut on this one. In the real world, a bird in the hand (or a few pounds in your pocket) is worth far more than two in the bush, even if the bush is theoretically full of gold.
