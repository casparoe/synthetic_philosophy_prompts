answer: |-
  Here are ten interview questions designed to press the Knowledge Norm of Assertion (KNA) at its limit points, assuming familiarity with the view and focusing on dialectical pressure rather than exposition.

  ### Pressure Point 1: Lottery Propositions

  **1. The Certainty Challenge**
  In lottery cases, the KNA explains why I cannot assert your ticket lost: I don't *know* it. But a Norm of Certainty explains this equally well, and perhaps better, given that knowledge seems compatible with some residual risk while assertion in lottery cases seems ruled out by *any* risk. Why should we posit Knowledge as the constitutive norm rather than Certainty, which seems to track the specific intuition that probabilistic support alone is insufficient?

  *   **Follow-up:** You'll likely reply that Certainty is too strong for ordinary assertions—we assert many things we aren't Cartesian certain of. But if you concede that assertion requires less than certainty, haven't you effectively decoupled the norm from the *phenomenology* of the lottery case? If the norm allows risk elsewhere, why does the lottery case specifically require a knowledge-level cutoff rather than just a context-sensitive threshold of probability?

  **2. The High-Probability Rival**
  Consider a rival norm: "Assert $p$ only if $p$ is highly probable." We can set the threshold high enough to rule out lottery assertions but low enough to permit ordinary empirical claims. What theoretical work is the concept of *knowledge* doing here that a refined probabilistic threshold couldn't do? Is "knowledge" just a placeholder for "probability high enough to ignore error possibilities"?

  *   **Follow-up:** I anticipate you'll argue that knowledge explains *which* error possibilities are relevant to ignore, whereas probability alone cannot distinguish lottery errors from ordinary errors. But if the mechanism is really about the *structure* of error possibilities, isn't the norm actually about *epistemic position* or *safety*, with knowledge being merely a byproduct? Why make knowledge the rule rather than the underlying structural feature that generates knowledge?

  ### Pressure Point 2: The Moorean Data

  **3. The Belief Norm Competition**
  The KNA elegantly explains the infelicity of "It's raining, but I don't know it's raining." However, a Belief Norm ("Assert $p$ only if you believe $p$") explains the infelicity of "It's raining, but I don't believe it's raining." Since both sound defective, what makes the Knowledge version the *constitutive* defect rather than the Belief version? Why isn't belief the core requirement, with knowledge just being a desirable add-on?

  *   **Follow-up:** You will likely argue that the Belief Norm permits asserting lucky guesses, which seems improper. But if the intuition against lucky guesses is driven by the fact that they aren't *true* or *reliable*, doesn't that suggest the norm is actually about Truth or Reliability? If the Belief Norm fails because it allows falsehoods, why isn't the Truth Norm the primary candidate, with knowledge serving only as a reliable guide to truth?

  **4. The Truth Norm Competition**
  Following on that: If I assert a truth, I have succeeded in telling you how the world is. If I assert a falsehood, I have failed. This suggests a Truth Norm. The KNA says I can assert a truth improperly if I don't know it. Why should the *speaker's epistemic state* determine the propriety of the act rather than the *accuracy of the content*? Isn't the primary function of assertion to convey truth, not to display the speaker's cognitive achievement?

  *   **Follow-up:** Your standard reply is that the Truth Norm fails to explain why "p, but p is false" is paradoxical in a way that implicates the speaker, not just the world. But if we adopt a Truth Norm plus a separate norm of sincerity, do we not capture the same data without making knowledge constitutive? Why is it theoretically cheaper to bundle truth and justification into a single knowledge rule rather than treating them as independent constraints on the same act?

  ### Pressure Point 3: The "Too Demanding" Charge

  **5. The Gettierized Assertion**
  Consider the stopped clock case: I look at a stopped clock that happens to show the right time, and I assert, "It's 2 PM." I have a true belief with justification, but no knowledge. The KNA classifies this assertion as improper. Yet, intuitively, I have done nothing wrong; I am blameless. If the norm condemns blameless behavior, in what sense is it a norm governing *action* rather than an abstract ideal?

  *   **Follow-up:** You will distinguish between *primary propriety* (satisfying the norm) and *secondary propriety* (being blameless in violating it). But if an agent can be fully rational, evidence-responsive, and blameless while violating the norm, does the norm still have grip on the *practice*? If the participants in the language game cannot distinguish primary from secondary propriety from the inside, how does the rule function constitutively for them?

  **6. The Utility of the Excuse**
  Sticking with that distinction: In law or ethics, an excuse acknowledges a violation but mitigates punishment. In assertion, if I am excusably violating the knowledge norm, am I still subject to criticism? If I am not subject to criticism, what is the practical difference between a blameless violation and a satisfaction of the norm?

  *   **Follow-up:** You might say I am still subject to *retraction* even if I am not blamed. But if I reasonably took myself to know, why should I retract upon learning I was Gettierized? The truth hasn't changed, and my evidence hasn't changed. If the only consequence of violating the constitutive norm is a request to retract in cases where my epistemic position is unchanged, doesn't that suggest the norm is tracking something external to the communicative exchange, like metaphysical luck?

  ### Pressure Point 4: The "Too Permissive" Charge

  **7. The Exam Case**
  Consider a student taking a test who has memorized the facts but suffers from impostor syndrome; she knows the answer but sincerely believes she is guessing. The KNA licenses her to assert the answer. Yet, intuitively, she should not assert it because she lacks confidence. If the KNA permits assertion where the speaker takes herself to be unreliable, isn't the norm disconnected from the speaker's own perspective on their reliability?

  *   **Follow-up:** You will likely reply that the norm governs the *act*, not the *psychology*, and that she actually *is* reliable. But assertion is a speech act that invites the audience to trust the *speaker*. If the speaker does not invite that trust because she doubts her own knowledge, isn't the assertion defective in virtue of that mismatch? Does the KNA inadvertently sever the link between the speaker's authority and her own take on her authority?

  **8. Standing and Privacy**
  I may know that my friend is having an affair, but it seems improper for me to assert this to her spouse, even if I know it. The KNA says I am epistemically positioned to assert. This suggests there are norms of *standing* independent of the knowledge norm. If standing can override knowledge, why is knowledge the *constitutive* norm of assertion rather than just a necessary condition for one type of proper assertion?

  *   **Follow-up:** You'll argue that standing is a norm of *morality* or *prudence*, not assertion *per se*. But if I cannot properly assert without standing, and standing is independent of knowledge, then "proper assertion" requires more than knowledge. Why privilege the epistemic condition as the *constitutive* one if the act can be fully blocked by non-epistemic conditions that are equally essential to the act's social success?

  ### Pressure Point 5: The Constitutive Claim

  **9. The Chess Analogy**
  Proponents often compare the KNA to the rules of chess: move the bishop diagonally or you aren't playing chess. But if I assert without knowledge, we still understand me as asserting; we just criticize me. In chess, if I move the bishop like a knight, the move is null. Why is the analogy to chess apt if the "move" of assertion remains valid even when the norm is violated?

  *   **Follow-up:** You will clarify that constitutive norms define the *aim* or *standard* of the activity, not the physical utterance. But if the utterance counts as an assertion regardless of the norm, isn't the norm merely *regulative*? If the identity of the speech act doesn't depend on satisfying the knowledge condition, in what robust sense is the rule constitutive of the act itself rather than just the *evaluation* of the act?

  **10. The Function of Assertion**
  Finally, if the knowledge norm is constitutive, it should reflect the fundamental function of assertion. Is the function of assertion to spread knowledge, or to share information? If I tell you a truth you need to know, but I do so without knowing it myself (relying on a reliable source I don't understand), I have served the function of sharing information. Why must the *asserter* be the locus of knowledge for the act to fulfill its constitutive aim?

  *   **Follow-up:** You'll argue that assertion is a mechanism for generating knowledge in the hearer, which requires knowledge in the speaker (via transmission). But if the hearer acquires a true belief that functions as knowledge in their own life, does it matter if the speaker lacked knowledge? If the KNA prioritizes the purity of the transmission chain over the practical success of the hearer, isn't the norm serving an epistemic hygiene function rather than a communicative one?
