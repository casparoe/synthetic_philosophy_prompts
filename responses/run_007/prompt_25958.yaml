prompt: |-
  I'm taking a grad seminar on personal identity and we spent three weeks on Parfit. I've read the teletransporter stuff, the branch-line case, the psychological spectrum — the whole menu of puzzle cases. And I've realized that before I can even evaluate the competing theories (psychological continuity, biological continuity, narrative views, whatever), I need to know what I'm actually asking a theory to do. Like, what are the requirements? Some people treat the teletransporter as a knockdown intuition that identity doesn't matter, others think it's just a weird edge case we shouldn't build a theory around. Some think fission shows identity isn't one-one, others think it shows survival doesn't require identity. I gotta step back and get the desiderata straight before I commit to anything.

  So: write me the desiderata for an adequate theory of what matters in survival. I want the full list — the cases it must handle, the distinctions it must respect (e.g., between numerical identity and what matters, or between survival and psychological continuity), the intuitive data points it has to either accomodate or explain away. For each desideratum, give the motivating case or argument. Flag which ones you think are non-negotiable and which are more like camp-specific preferences. And I especially want to know: are there any pairs of desiderata that can't be jointly satisfied? If the teletransporter pushes us one way and the fusion case pushes us another, I want that tension named. Finally, which single requirement does the most to narrow the field — if you had to pick one that rules out the most popular views, which is it? Take a definite position on all of this — I don't want a survey of what different philosophers demand, I want your actual view on what the list should be and why. Hard cap: 900 words.
