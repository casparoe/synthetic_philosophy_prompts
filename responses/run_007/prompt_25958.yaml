answer: |-
  The primary mistake in personal identity is asking "What makes me me?" instead of "What makes survival matter?" An adequate theory must prioritize practical rationality over metaphysical taxonomy. Here are the desiderata I argue are necessary for a theory of what matters in survival.

  **1. The Fission Constraint (Non-negotiable)**
  A theory must explain why branching survival is not worse than death. In Parfit's fission case, your brain hemispheres are transplanted into two bodies. Both resulting people are psychologically continuous with you. Intuitively, this is survival, not death. If a theory implies you die because identity cannot be one-many, it fails. It must account for the intuition that having two successors is better than having none.

  **2. The Logical Coherence Constraint (Non-negotiable)**
  A theory must respect the transitivity and one-one nature of numerical identity. If A=B and B=C, then A=C. You cannot be identical to two distinct people. This is a logical requirement, not an empirical one. Any theory that claims you are *identical* to both fission outcomes violates logic. Thus, a theory must either deny survival in fission (violating Constraint 1) or deny that survival requires identity.

  **3. The Prudential Concern Constraint (Non-negotiable)**
  A theory must ground special concern for the future. Why save for retirement? Why fear future pain? The theory must link whatever constitutes survival to the rationality of anticipation and self-interest. If the Teletransporter destroys you and creates a replica, but the replica remembers your debts and feels your pain, prudential concern should transfer. If a theory says you should be indifferent to the replica because it isn't "you" metaphysically, it fails to explain rational action.

  **4. The Biological Anchor (Camp-specific)**
  Many demand that survival requires biological continuity (the same living organism). This is driven by cases where psychology is wiped but the body remains. I flag this as optional. While biologically intuitive, it conflicts with the Teletransporter intuition where we accept survival via psychological copying. Insisting on biology forces us to treat Teletransportation as death, which violates the Prudential Concern Constraint for most agents. This is a preference for animalism over reductionism, not a requirement for coherence.

  **The Central Tension**
  The fatal friction lies between the Fission Constraint and the Logical Coherence Constraint. If "what matters" is numerical identity, Fission kills you (because identity cannot branch). But Fission intuitively preserves what matters. Therefore, identity and what matters come apart. The Teletransporter pushes us toward psychological continuity; Fusion (where two streams merge) challenges the uniqueness of that continuity. But Fission is the wedge. It forces a choice: abandon logic or abandon the identity thesis.

  **The Killer Constraint**
  The single requirement that narrows the field most drastically is **the demand to accommodate Fission without violating Logical Coherence.** This is the filter that destroys Simple Views and Biological Views alike.

  Why? Because it forces the Separation Thesis: *Identity is not what matters.*
  If you insist identity is what matters, Fission forces you to say survival is lost (since identity cannot be one-many). This contradicts the deep intuition that branching is a form of survival. If you insist survival requires identity, you must deny the Fission intuition. The only way to satisfy both non-negotiables is to decouple them. You must argue that Relation R (psychological continuity and connectedness) is what matters, and R can hold without identity.

  This requirement rules out any theory that ties prudential concern strictly to numerical identity. It eliminates Lockean views that try to salvage identity through "non-branching" clauses (which make survival depend on extrinsic factors like whether the other hemisphere survived). It also eliminates Biological Views that cannot account for psychological transfer in Teletransportation.

  **My Position**
  I argue that the Separation Thesis is not just a solution but a prerequisite. The list above demands a Reductionist view. We are not separately existing entities; we are brains and bodies producing interconnected mental states. When those states continue, what matters continues, even if the "self" does not remain numerically identical.

  The Fission/Logic clash is the engine of the debate. Satisfying it requires accepting that survival is a matter of degree and relation, not a binary metaphysical fact. Any theory that tries to restore a deep, further fact of identity will crash against the logic of branching. Therefore, the only adequate theory is one that treats identity as a conventional label over underlying psychological and physical relations, prioritizing the continuity of consciousness over the continuity of the "person." This is the only path that respects both our rational practices and the laws of logic.
