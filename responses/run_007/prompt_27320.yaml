answer: |-
  # Activity Design: The Grid Glyph Protocol

  **Course Context:** Upper-level undergraduate seminar (Concepts & Categories).
  **Class Size:** 14 students.
  **Duration:** 75 minutes.
  **Goal:** Experiential refutation of the "checklist theory" of categorization; intuitive grasp of categories as roles within a system (style).

  ## 1. Materials & Setup
  *   **Grid Sheets:** Pre-printed handouts. Each sheet contains twelve **4x6 cell grids** (4 columns, 6 rows). The cells should be large enough (approx. 1cm²) to be filled in completely with a thick marker.
  *   **Writing Tools:** Black felt-tip markers (thick enough to fill a cell in one stroke) and red fine-liner pens.
  *   **Style Cards:** 7 distinct cards (one per pair). Each card displays three letters (e.g., **n, m, h**) rendered in a specific, novel "grid style" that you have designed in advance.
  *   **Timer:** Visible to the class.

  ## 2. Timeline & Procedure

  ### Phase 1: The Divergent 'a' (25 Minutes)
  **0:00–0:05 | Introduction & Rules**
  *   Distribute Grid Sheets and Markers.
  *   **Rule 1:** Letters must be constructed by filling in whole cells only. No partial fills, no diagonals.
  *   **Rule 2:** Legibility is determined by peer consensus, not instructor fiat.
  *   **Task:** "On your first two grids, draw the lowercase letter 'a'. But there is a constraint: The two 'a's must be **structurally distinct**. If one has a closed loop at the top, the other must not. If one touches the left wall, the other must not. They must both be unmistakably 'a's, but they should look like they come from different worlds."

  **0:05–0:20 | Production**
  *   Students work individually. Circulate to ensure they aren't making trivial changes (e.g., just shifting one pixel). Push them toward "single-story" (handwriting style) vs. "double-story" (print style) variations if they get stuck.
  *   *Instructor Note:* If a student says, "This one looks like a 'd'," tell them: "Keep it. We will test that boundary later."

  **0:20–0:25 | The Feature Audit (Individual)**
  *   Hand out red pens.
  *   **Task:** "Look at your two 'a's. List three specific grid features they share (e.g., 'Cell B3 is filled,' 'There is a vertical line on the left,' 'There is a closed hole'). Write this list at the bottom of the page."

  ### Phase 2: The Feature Trap (15 Minutes)
  **0:25–0:35 | Pair Swap & Falsification**
  *   Students pair up (7 pairs).
  *   **Task:** "Swap sheets with your partner. Look at their two 'a's and their list of shared features. Now, look at the *other* empty grids on their sheet. Draw a lowercase 'd' in one of them."
  *   **The Trap:** "Check your partner's list of 'a' features against the 'd' they just drew. Does the 'd' also have those features? If yes, cross that feature off the list. Your goal is to cross out *every* feature on the list."
  *   *Expected Outcome:* Students will realize that any geometric feature shared by their two 'a's (e.g., "a vertical stem," "a closed loop") is also present in the 'd', or absent in one of the 'a's.

  **0:35–0:40 | Group Report**
  *   Ask 3 pairs to report: "What feature did you think was essential to 'a', and how did the 'd' steal it?"
  *   *Do not explain why this happened yet.* Just record the failures on the board (e.g., "Closed loop? No, 'd' has it." "Vertical stem? No, some 'a's don't.").

  ### Phase 3: The Style Transfer (20 Minutes)
  **0:40–0:50 | The Alien Font**
  *   Distribute the **Style Cards** (one per pair). Each card shows three letters (e.g., **i, l, t**) rendered in a specific, consistent style you have pre-drawn on a master grid.
      *   *Example Style:* "The Heavy Bottom." All horizontal strokes in the bottom 3 rows are 2 cells thick; top rows are 1 cell.
      *   *Example Style:* "The Broken Line." No cell touches another vertically; there must always be a 1-cell gap between vertical segments.
  *   **Task:** "This is a new alphabet. You have seen three letters in this style. Your task is to draw the letter **'h'** in this same style. You have never seen an 'h' in this style before. You cannot copy an exemplar; you must apply the *rule* of the style."

  **0:50–1:00 | Verification**
  *   Pairs swap their new 'h' with another pair who had the *same* Style Card.
  *   **Vote:** "Does this 'h' belong to the same family as the cards? Yes/No."
  *   If they agree, they successfully identified the **system** rather than copying features.

  ### Phase 4: Debrief & Theory Mapping (15 Minutes)
  **1:00–1:15 | Discussion**
  *   **Step 1 (The Checklist Failure):** Ask, "In Phase 1, why couldn't you find a feature that guaranteed 'a'-ness?"
      *   *Guide them to:* Features are neither necessary (some 'a's lack them) nor sufficient (the 'd' has them).
  *   **Step 2 (The System Success):** Ask, "In Phase 3, how did you draw an 'h' you'd never seen? You didn't match features. What did you match?"
      *   *Guide them to:* You matched a *relationship*, a *constraint*, or a *role*. You understood what the style *does* to a letter, not what the letter *is*.
  *   **Step 3 (Naming):** Now introduce the terminology.
      *   The failed view: **Classical Theory / Checklist View** (categories defined by necessary and sufficient conditions).
      *   The successful view: **Family Resemblance** (Wittgenstein) or **Prototype/Exemplar** (Rosch), but push further toward **Structural/Systemic** views (Hofstadter's "Letter Spirit").
      *   Explain that a category is often a **role in a space of possibilities**. An 'a' is an 'a' because it plays the 'a' role within a specific stylistic system, not because it holds a specific set of pixels.

  ## 3. Predictable Failures & Mitigations

  **1. The "It Just Looks Like an 'a'" Defense**
  *   **Problem:** In Phase 2, students will resist falsifying their features. They will say, "Well, the 'd' has a loop, but it's on the *left*, so it's different." They will add spatial qualifiers to save the checklist.
  *   **Fix:** Enforce the "Grid Coordinate" rule. Features must be describable in terms of cell positions or simple adjacency (e.g., "Column 2 is filled"). If they say "on the left," ask them to define "left" in a way that doesn't also apply to the 'd' in that specific grid. If they get stuck, intervene: "If you have to add three exceptions to your rule to make it work, is it a rule or a description of this specific drawing?"

  **2. The Style Transfer is Too Easy**
  *   **Problem:** If the style is just "make everything bold," they aren't grasping a system; they're just applying a filter.
  *   **Fix:** Design the Style Cards to require **structural trade-offs**. For example, a style where "Curves are impossible; all curves must be approximated by 3 stepped cells." To draw an 'h', they must figure out how to step the arch. If they just bold the lines, the other pair will vote "No" during verification.

  **3. Time Creep**
  *   **Problem:** Drawing on grids is slower than writing. Phase 1 often bleeds into Phase 2.
  *   **Fix:** Be ruthless with the timer. At minute 20, call "Pens Down" for Phase 1 even if they aren't finished. The frustration of incompleteness is data for the debrief (categories are often recognized before completion).

  ## 4. Limitations (What This Activity Cannot Do)

  *   **Fluidity:** The grid discretizes the letter. Real letter recognition handles continuous deformation (rotation, scaling, skew). The grid makes letters feel static and atomic. You must verbally bridge this: "In the real world, the grid is infinite and the lines are fluid, but the *logic* of the failure remains the same."
  *   **Context:** Reading happens in words, not isolation. An 'a' is easier to identify in "cat" than alone. This activity isolates the letter, which makes the categorization problem *harder* than it is in nature. Acknowledge that context usually solves the problem for us, masking the underlying conceptual difficulty.
  *   **The "Spirit" Itself:** The activity demonstrates *systematicity*, but "spirit" implies a kind of aesthetic coherence that is hard to capture in 20 minutes. You will have to supply the philosophical weight of why "style" matters for meaning (e.g., how a font conveys tone, authority, playfulness) in your closing remarks.

  ## 5. Confidence & Weakest Point

  **Confidence Level:** **85%**.
  The structure is robust. The grid constraint successfully prevents "typographic intuition" from bypassing the logical problem, and the pair-swap falsification in Phase 2 reliably breaks the checklist mindset in my experience with similar logic puzzles.

  **Weakest Point:** **The Transition in Phase 4.**
  There is a risk that students will interpret the "Style Transfer" success as simply "a more complex checklist" (e.g., "The rule was just a long list of if-then statements"). They may not spontaneously grasp that the style is a **generative role** rather than a **descriptive list**.
  *   *Mitigation:* In the debrief, ask: "Did you memorize the 'h' or did you *build* it?" If they say "built," ask "What was the blueprint?" If they describe a rule ("thicken the bottom"), press: "Is that rule a feature of the letter, or a constraint on the *space*?" You must explicitly articulate the shift from *features of objects* to *constraints on a system* to ensure they don't just walk away with a "Complex Checklist Theory."
