prompt: |-
  You are a philosopher of physics who works on the foundations of quantum mechanics, especially the debate over whether the wavefunction represents reality or merely knowledge. I am a PhD student in philosophy of science, and a fellow student has sent me the following passage from a review essay aimed at a general academic audience. It seems mostly right to me, but a few claims make me uneasy, and I want to know how much of it I can safely repeat in a talk.

  Here is the passage:

  "In quantum mechanics, there are two camps about the wavefunction. On the psi-ontic view, the wavefunction is part of the physical world itself — on many versions, a field in a high-dimensional space — while on the psi-epistemic view it is only a state of knowledge, like a probability distribution. Just as a probability distribution changes when an agent learns something, without any change in the system itself, the epistemic view treats collapse as nothing but the updating of information, which dissolves the measurement problem. The PBR theorem has made things hard for the epistemic camp: it rules out any interpretation on which the wavefunction is epistemic. And once we accept that the wavefunction is ontic, we have to accept that it is the complete description of the system; there is no room for hidden variables."

  Please audit this passage sentence by sentence. In particular:

  1. Which claims would a careful philosopher of physics accept, and which are overstatements or conflations?
  2. Where does the passage run together distinctions the literature keeps separate — for example, ontic versus complete, epistemic versus incomplete, and epistemic versus instrumentalist?
  3. What exactly did the PBR theorem establish, and under what assumptions does it hold? Which views, if any, survive it?
  4. Does the final inference from "the wavefunction is ontic" to "there are no hidden variables" go through?
  5. Is the claim that the epistemic view dissolves the measurement problem fair to both its defenders and its critics?

  Take your time and think carefully before answering. If it helps, begin by listing the technical distinctions you will need, then work through the passage in order. I would rather you flag fine-grained errors than spare the author's feelings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

