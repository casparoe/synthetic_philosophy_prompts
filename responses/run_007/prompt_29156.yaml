answer: |-
  1. This objection conflates global reductionism, which requires general inductive reasons to trust testimony as a source, with local reductionism, which demands specific evidence for every single utterance.
  2. Establishing a track record relies on perception and memory, so the initial data points for reliability do not themselves require testimonial validation.
  3. Children utilize non-testimonial cues like facial expressions and correlations with visible objects to build an initial inductive base for reliability.
  4. This developmental process implies that many early beliefs are merely causal acquisitions rather than justified knowledge until the child can cross-reference claims with perceptual experience.
  5. Ultimately, the regress stops at perceptual knowledge, so the theory does not assume the trust it aims to earn but rather builds it from independent sensory evidence.
