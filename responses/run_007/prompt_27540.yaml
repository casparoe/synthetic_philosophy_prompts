      She leaves the cricket on the threshold stone.
      Obeying some unconscious, deep command.
      Then goes inside to check the dark alone.

      If prey is shifted from its assigned zone,
      She drags it back to this familiar land.
      She leaves the cricket on the threshold stone.

      No new decision in her brain is grown.
      She will not trust the weight within her hand.
      Then goes inside to check the dark alone.

      The cycle turns, a wheel of brittle bone.
      Bound fast within a rigid, unseen band.
      She leaves the cricket on the threshold stone.

      What looks like thought is by the pattern shown.
      Where free will claims it makes its final stand.
      Then goes inside to check the dark alone.

      We claim our choices are our very own.
      Yet trace our paths on that same shifting sand.
      She leaves the cricket on the threshold stone.
      Then goes inside to check the dark alone.

