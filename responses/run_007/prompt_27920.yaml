  *   **L:** The Library Lounge (Quiet, good for talking, but boring).
  *   **R:** The Rooftop Garden (Great view, but weather-dependent).
  *   **B:** The Basement Bar (Fun, but loud and cramped).

  **Materials:**
  *   **Preference Cards:** 18 index cards, color-coded.
      *   **7 Red Cards:** `1. Library (L) > 2. Rooftop (R) > 3. Basement (B)`
      *   **6 Blue Cards:** `1. Rooftop (R) > 2. Basement (B) > 3. Library (L)`
      *   **5 Green Cards:** `1. Basement (B) > 2. Library (L) > 3. Rooftop (R)`
  *   **Ballots:** Small slips of paper (3 per student, one for each round).
  *   **Whiteboard:** To tally votes.

  **Why This Distribution?**
  This profile (7-6-5 split) creates a **Condorcet Cycle** dynamic where no option is universally loved, but specific groups are "pivotal."
  *   **Red (Plurality Winners):** They win honest voting but are vulnerable to being outflanked.
  *   **Blue (The Compromisers):** They are the "Kingmakers." In Plurality and Runoff, their honest vote leads to their *last* choice winning. They have the strongest incentive to lie early.
  *   **Green (The Burying Squad):** In Approval voting, they are the ones who benefit from "bullet voting" (voting for only one candidate).
  By distributing the pain across different groups in different rounds, you ensure the whole class feels the structural pressure, not just one faction.

  **Distribution:**
  Hand out the cards randomly as students enter. Tell them: *"Keep this card secret. This is your true preference. Your goal in this game is to get the outcome highest on your list. Do not show your card to neighbors."*

  ---

  ## 2. Rules for Each Round

  Run three rounds. Between rounds, collect all ballots, tally them publicly on the board, announce the winner, and then distribute new blank ballots.

  **Round 1: Plurality Rule**
  *   **Instruction:** "Mark an 'X' next to **one** venue. The venue with the most votes wins. Ties are broken alphabetically (B > L > R)."
  *   **Voting:** Secret, simultaneous.
  *   **Expected Honest Outcome:** L (7), R (6), B (5). **Winner: Library.**
  *   **Why:** This is the baseline. Red gets 1st choice. Blue gets 3rd choice. Green gets 2nd choice. Blue students should feel aggrieved.

  **Round 2: Two-Round Runoff**
  *   **Instruction:** "Mark an 'X' next to **one** venue. If a venue gets >50%, it wins. If not, the top two venues advance to a second immediate vote. In the second vote, you vote again between the top two. Majority wins."
  *   **Voting:** Secret, simultaneous. (Instructor runs the "second round" tally immediately based on the same ballots or a quick show of hands for the runoff pair).
  *   **Expected Honest Outcome:**
      *   Round 1 Tally: L (7), R (6), B (5). Top two: L & R.
      *   Round 2 Matchup: L vs R. Red votes L. Blue votes R. Green votes L (since L > R).
      *   Result: L (12) vs R (6). **Winner: Library.**
  *   **Why:** Blue students *still* get their last choice. This reinforces that "more sophisticated" rules don't fix their problem.

  **Round 3: Approval Voting**
  *   **Instruction:** "You may vote for **as many venues as you like**. You can vote for one, two, or all three. The venue with the most total votes wins."
  *   **Crucial Prompt:** Before handing out ballots, say: *"In this round, you are free to vote strategically. You are not required to vote for your favorite. You are only required to follow the rule. Your goal remains: get the highest outcome on your personal card."*
  *   **Voting:** Secret, simultaneous.
  *   **Expected Honest Outcome (if they vote for top 2):**
      *   Red (L, R): 7 votes for L, 7 for R.
      *   Blue (R, B): 6 votes for R, 6 for B.
      *   Green (B, L): 5 votes for B, 5 for L.
      *   Totals: L (12), R (13), B (11). **Winner: Rooftop.**
      *   *Result:* Green students get their 3rd choice. They have a strong incentive to "bullet vote" (vote only for B).
  *   **Expected Strategic Outcome:**
      *   Green votes only B. Red/Blue vote top 2.
      *   Totals: L (7), R (13), B (11 + 5 = 16). **Winner: Basement.**
      *   *Result:* Green gets 1st choice.

  ---

  ## 3. The Pivot Moment

  **When:** During the tally of **Round 2**.

  **The Realization:**
  When you announce that the Library has won *again* under the Runoff rule, watch the Blue cardholders. They have now received their last-choice outcome twice.
  *   **The Spark:** A Blue student will likely raise their hand and say, "Wait, if we all voted for Basement in the first round, Basement would have made the runoff."
  *   **Facilitator Move:** Do not confirm or deny. Simply say, *"That's an interesting hypothesis. We can't redo Round 2. But keep that thought for Round 3."*

  **If No One Discovers It:**
  If students vote honestly in Round 3 despite the permission to strategize:
  1.  Announce the result (Rooftop wins).
  2.  Ask the Green cardholders: *"Did you get your first choice?"* (No). *"Did you get your last choice?"* (Yes).
  3.  Ask: *"The rules allowed you to vote for only one venue. If you had done that, what would have happened?"*
  4.  Walk through the math on the board. The realization that *following the rules but lying about preferences* yields a better result is the core of the activity.

  ---

  ## 4. Debrief (25 Minutes)

  Transition from the game to the theory. Write **"Gibbard–Satterthwaite Theorem"** on the board.

  **Step 1: Define Strategy-Proofness via Experience**
  *   *Ask:* "In Round 1, could a Blue student have gotten a better result by marking 'Basement' instead of 'Rooftop'?" (Yes).
  *   *Define:* "A rule is **strategy-proof** if no voter can ever benefit from lying about their preferences. We just proved Plurality is *not* strategy-proof."

  **Step 2: Map Activity to Theorem Conditions**
  Draw a table on the board with the theorem's conditions and check them off based on the activity.

  | Condition | What it means | Did our activity have this? |
  | :--- | :--- | :--- |
  | **3+ Alternatives** | At least three options to choose from. | **Yes** (Library, Rooftop, Basement). |
  | **Non-Dictatorship** | No single student determines the outcome alone. | **Yes** (It took a group of 6 Blues or 5 Greens to change the result). |
  | **Unrestricted Domain** | The rule must work for *any* possible set of preferences. | **Yes** (I could have handed out different cards, and the rule would still run). |
  | **Strategy-Proofness** | Voters should never benefit from lying. | **NO** (We found lies in every round). |

  **Step 3: The Impossibility**
  *   *Explain:* "Gibbard and Satterthwaite proved that if you have 3+ options and you don't want a dictator, **you cannot design a voting rule that is immune to strategy.**"
  *   *Connect:* "In Round 1, the strategy was 'Compromise' (vote for 2nd choice to stop 3rd choice). In Round 3, the strategy was 'Exaggeration' (bullet vote to boost 1st choice). Different rules invite different lies, but *every* rule invites some lie."

  **Step 4: The "So What?"**
  *   Ask: "Does this mean democracy is broken?"
  *   Guide them to: "No, it means we must choose *which* vulnerabilities we prefer. Plurality encourages two-party systems. Runoff encourages coalition building. Approval encourages broad appeal. The theorem tells us there is no perfect system, only trade-offs."

  ---

  ## 5. What Will Go Wrong

  **Failure Mode 1: The "Moral Voter" Problem**
  *   *What:* Students refuse to lie in Round 3 because they feel it's "cheating" or "undemocratic," even when told it's allowed.
  *   *Fix:* During the debrief, acknowledge this. "Many of you felt a moral constraint. The theorem assumes *rational* agents who care only about the outcome. In reality, norms prevent manipulation. But the *incentive* remains, which means the system is fragile if norms break down."

  **Failure Mode 2: Tally Confusion**
  *   *What:* With 18 students, counting Approval ballots live can be slow and error-prone, killing the momentum.
  *   *Fix:* Have a pre-printed tally sheet for yourself. As you collect ballots, quickly mark hash marks on the board yourself while a student reads them out. Or, appoint two "Election Commissioners" (students) to tally while you facilitate the discussion.

  **Unavoidable Limitation: Finite Domain**
  *   *The Gap:* The theorem applies to *all* possible preference profiles. We only tested *one* specific profile (the 7-6-5 split). A skeptical student might say, "Maybe there's *another* profile where Plurality works perfectly."
  *   *The Fill:* Acknowledge this explicitly. "We tested one snapshot. The theorem is a mathematical proof that covers *every* snapshot. Today you felt the incentive in this specific case; the math guarantees that incentive exists in *some* case for every rule. You felt the bug; the theorem proves the bug is in the code, not just this data."

  **Tone Check:**
  Keep it light. When a student admits to lying, high-five them. "Excellent strategy. You just broke the system." This reinforces that the *system* is the object of study, not their honesty.
