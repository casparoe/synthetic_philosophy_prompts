  3. Is waiting for full verification impossible because the window to act will close forever? If you can wait, stop and verify; if you cannot, proceed to the next question.
  4. Is the potential benefit to the public so significant that withholding it is itself an ethical failure? If no, stop; James argues you may only leap when the option is momentous.
  5. **[Judgment Call]** Am I pursuing this because the evidence compels me, or because I want the scandal to be real? If desire drives the belief, stop; this is wishful thinking, not journalism.
  6. Can I write the piece to accurately reflect the uncertainty without rendering the allegation meaningless? If you cannot hedge without killing the story, stop; ambiguity is not legal protection.
  7. **[Judgment Call]** Would I bet my career and my source's safety on this being true based on what I know right now? If hesitation remains, stop; your gut knows the evidence is insufficient.
