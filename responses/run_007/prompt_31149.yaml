answer: |-
  This is a profound observation that cuts to the bone of contemporary debates in moral responsibility, specifically the tension between the **Control Principle** (one is responsible only for what one controls) and our intuitive practices of **Character Assessment**.

  You have identified a friction point where our commitment to fairness (unchosen factors shouldn't matter) collides with our commitment to holding agents accountable for who they are (character matters).

  Below is a systematic analysis of candidate concepts from the literature, an evaluation of their fit, and a proposal for how to carve this phenomenon distinctively.

  ### 1. Candidate Characterizations from the Literature

  #### A. Moral Luck (Nagel, Williams)
  *   **The Concept:** Thomas Nagel's seminal paper "Moral Luck" categorizes luck into four types. Your phenomenon straddles **Circumstantial Luck** (the choking child, the ambush) and **Constitutive Luck** (the impatient temperament, the timid disposition). Nagel argues that since both are matters of luck (unchosen), strictly speaking, neither should affect moral worth.
  *   **Where it Fits:** It perfectly names the *inputs*. You are describing the differential treatment of circumstantial vs. constitutive luck.
  *   **Where it Falls Short:** Nagel uses "Moral Luck" to generate a *skepticism* about responsibility (i.e., "If both are luck, blame is incoherent"). You are describing a *robust asymmetry in our actual judgments* (i.e., "We blame the constitutive luck *more*"). The term "Moral Luck" describes the problem of luck generally, but it does not name the specific *asymmetry* wherein internal luck aggravates while external luck mitigates. It describes the puzzle, not the specific pattern of judgment.

  #### B. Quality of Will (Strawson, Scanlon)
  *   **The Concept:** P.F. Strawson and later T.M. Scanlon argue that blame is a response to the "quality of will" an agent displays toward others. The impatient driver displays ill will (disregard for safety/rules); the panicking driver displays care (for the child).
  *   **Where it Fits:** It explains *why* we blame the impatient driver. His action reveals a objectionable attitude.
  *   **Where it Falls Short:** It dodges the "unchosen" constraint. If the impatient man's disregard stems from an unchosen temperament he could not alter, why is that "quality of will" attributable to *him* in a way that warrants blame? A Quality of Will account must explain why we hold people responsible for the will they *have*, rather than the will they *chose*. It explains the verdict, but not the asymmetry regarding the *source* of that will.

  #### C. Deep Self / Real Self Views (Frankfurt, Watson, Sher)
  *   **The Concept:** George Sher and others argue that we are responsible for actions that flow from our "deep self" (our enduring values, desires, and character), even if we didn't choose that deep self.
  *   **Where it Fits:** This is the strongest normative defense of your observation. The impatient driver's action flows from his deep self; the panicking driver's action overrides his deep self. Therefore, the former is responsible, the latter is not.
  *   **Where it Falls Short:** It risks circularity. Why is the temperament part of the "deep self" while the panic is not? Both are psychological states. The distinction relies on a prior intuition about **identification**. It describes the mechanism of attribution but doesn't fully explain why the *unchosen* nature of the deep self doesn't trigger an excuse in the same way the *unchosen* nature of the situation does.

  #### D. Fundamental Attribution Error (Social Psychology)
  *   **The Concept:** The cognitive bias where observers overemphasize dispositional explanations for behavior while underemphasizing situational explanations.
  *   **Where it Fits:** It describes the *psychological mechanism* driving the asymmetry. We are cognitively wired to see the impatient man as "bad" and the panicking man as "unlucky."
  *   **Where it Falls Short:** It is purely descriptive and pejorative. It implies the asymmetry is a *mistake* or a bug in human cognition. You are asking for a philosophical carving—implying there may be a normative structure here worth preserving, or at least understanding on its own terms, not just dismissing as a bias.

  ---

  ### 2. The Carving: What is the Operative Distinction?

  You asked if the distinction is really between **Situation and Make-up**. I argue it is not.

  Consider a soldier with a unchosen phobia of loud noises (Make-up) who breaks during an ambush. We might excuse him (mitigation).
  Consider a driver who runs a red light because he is late for a job interview he *chose* to schedule tightly (Situation/Choice mix). We might blame him.

  The distinction is not Internal vs. External, nor is it Chosen vs. Unchosen. The operative distinction is **Agential Ownership vs. Agential Override.**

  *   **Agential Override (The Excuse):** The causal factor (choking child, ambush) acts as an *external force* that bypasses or overwhelms the agent's normal evaluative machinery. The agent is a *patient* of the circumstance. The action does not express who they are; it expresses what is happening to them.
  *   **Agential Ownership (The Blame):** The causal factor (impatience, greed) acts as an *internal source* that constitutes the agent's evaluative machinery. Even if unchosen, the action *expresses* who they are. The agent is the *author* of the action, even if they are not the ultimate author of their character.

  Therefore, the asymmetry you observe is not about control; it is about **expressivity**. We blame when the action reveals the agent; we excuse when the action conceals or distorts the agent.

  ---

  ### 3. Edge Cases and Boundaries

  To test this carving, we must look where the phenomenon breaks down.

  **A. Unchosen Dispositions that *Do* Mitigate**
  *   **Case:** A man embezzles because he suffers from unchosen, clinical kleptomania or severe depression-induced desperation.
  *   **Judgment:** We mitigate blame.
  *   **Why:** These dispositions are categorized as **Pathologies** rather than **Vices**. In our moral ontology, a pathology is viewed as a *breakdown* of the agential machinery (like a seizure), whereas a vice (impatience, greed) is viewed as a *functioning* of the machinery, albeit a morally flawed one.
  *   **The Edge:** The line between "Bad Character" and "Mental Illness." If the unchosen disposition is seen as an impairment of capacity, it excuses. If it is seen as a configuration of values, it implicates.

  **B. Unchosen Situations that *Do Not* Mitigate**
  *   **Case:** A person grows up in a culture of systemic violence (unchosen situation) and commits assault.
  *   **Judgment:** We often still blame them fully (legally and sometimes morally).
  *   **Why:** Over time, situational pressures can become **Internalized**. If the agent has had time to reflect on their situation and endorse the violent norms, the "situation" has migrated into the "make-up."
  *   **The Edge:** The temporal dimension. Immediate situational pressure excuses (panic); long-term situational pressure often fails to excuse because we expect *adaptation* or *resistance*, turning the situation into a test of character.

  ---

  ### 4. Naming and Defining the Phenomenon

  There is no single standard name in the canon that captures this specific asymmetry of judgment regarding unchosen factors. "Moral Luck" is too broad; "Fundamental Attribution Error" is too dismissive.

  I propose we call this: **The Asymmetry of Constitutive Attribution.**

  **Definition:**
  > **The Asymmetry of Constitutive Attribution** is the moral-psychological phenomenon wherein unchosen factors originating *within* the agent's psychology (constitutive traits) are treated as grounds for responsibility, while unchosen factors originating *outside* the agent's psychology (circumstantial pressures) are treated as grounds for exemption, despite both being equally beyond the agent's ultimate control.

  **Distinctive Features:**
  1.  **Locus of Causation:** It distinguishes based on whether the unchosen cause is *identity-constituting* (internal) or *identity-alien* (external).
  2.  **Expressivity Condition:** It holds that blame tracks the degree to which an action *expresses* the agent's standing dispositions, regardless of the origin of those dispositions.
  3.  **Normative Tension:** It highlights the conflict between the **Control Principle** (fairness requires choice) and the **Character Principle** (accountability requires ownership of self).

  ### 5. Philosophical Implications

  If we accept this carving, we must confront an uncomfortable truth: **Our practice of responsibility is not fundamentally about Control; it is about Relationship.**

  When we blame the impatient driver, we are not punishing him for failing to choose his temperament. We are responding to the fact that his temperament makes him a dangerous participant in our shared cooperative scheme. The choking driver, by contrast, is temporarily removed from that scheme by an emergency; his "social self" is suspended. The impatient driver's "social self" is fully active, merely flawed.

  The asymmetry persists because we hold people responsible for **who they are** in a way we do not hold them responsible for **what happens to them**. The tragedy, as Nagel noted, is that "who we are" is largely determined by "what happened to us" (genetics, upbringing). The Asymmetry of Constitutive Attribution is the mechanism by which we ignore that tragedy to maintain a functional system of social accountability.

  ### Summary Recommendation
  If you are writing on this, do not settle for "Moral Luck." Use **The Asymmetry of Constitutive Attribution**. Frame your argument around the distinction between **Vice (unchosen but owned)** and **Pathology/Pressure (unchosen and alien)**. This allows you to acknowledge the unfairness (the luck element) while explaining the resilience of the intuition (the ownership element).
