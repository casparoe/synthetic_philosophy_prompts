answer: |-
  You are absolutely right to feel that Dan is pulling a fast one. Your intuition is spot-on: he is using a slogan to *conclude* a debate that the reading group is supposed to be *investigating*. In metaethical terms, Dan is committing a classic case of **begging the question**. He assumes the conclusion (that these issues are matters of taste) to dismiss the premise (that these issues might be matters of moral fact).

  The slogan *de gustibus non est disputandum* is philosophically slippery because it can function as a trivial observation about psychology or a heavyweight metaphysical claim about value. Dan is exploiting this ambiguity. He uses the defensibility of the trivial reading to shield the controversial reading from scrutiny.

  Here is a breakdown of six distinct claims the slogan could be making, ranked from trivial to substantive. For each, I've analyzed its defensibility and whether it actually licenses Dan's move.

  ### 1. The Phenomenological Claim
  **The Claim:** "You cannot argue someone into having a sensory experience they do not have." (e.g., You can't reason someone into liking the taste of cilantro.)
  *   **Is it Defensible?** **Yes.** This is psychologically trivial. Logical arguments do not directly alter sensory qualia or immediate visceral reactions.
  *   **Does it License Dan?** **No.** This applies to *sensory* taste (sweet, salty, disgusting), not *moral* taste. While eating octopus involves sensory experience, the objection to it is usually about *sentience, pain, or death*. Polyamory involves no sensory taste at all; it is about relationship structures, consent, and commitment. Dan is conflating "visceral disgust" with "moral judgment." Even if you can't argue someone into liking cilantro, you *can* argue someone into believing that killing a sentient being is wrong.

  ### 2. The Standards Claim
  **The Claim:** "Matters of taste lack public, intersubjective criteria for correctness, whereas moral judgments imply such criteria."
  *   **Is it Defensible?** **Plausible, but contested.** It is generally accepted that there is no "correct" answer to "Is vanilla better than chocolate?" However, moral realists argue there *are* criteria for morality (well-being, rationality, fairness).
  *   **Does it License Dan?** **No.** This claim actually highlights the *difference* between taste and morality. For Dan to use this, he would have to demonstrate that octopus-eating and polyamory *lack* intersubjective criteria. By simply asserting the slogan, he is assuming there are no criteria without showing why fairness, harm, or consent don't apply here. He is using the slogan to bypass the work of showing that moral standards are absent.

  ### 3. The Humean Claim (Instrumental Reason)
  **The Claim:** "Reason is and ought only to be the slave of the passions." Ultimate ends (values) are not subject to rational assessment; only the means to achieve them are.
  *   **Is it Defensible?** **Controversial.** This is a specific, substantive metaethical view (Humeanism). Kantians and Aristotelians strongly disagree, arguing reason can dictate ends.
  *   **Does it License Dan?** **Only if argued for.** If Dan is a Humean, he has a coherent framework. But he can't just drop the Latin phrase; he has to defend Humean psychology. Furthermore, even Humeans distinguish between "calm passions" (moral sentiments) and "violent passions" (immediate tastes). Dan is treating deep moral commitments as if they are violent, fleeting passions without justification.

  ### 4. The Expressivist Claim
  **The Claim:** "Moral statements do not express beliefs that can be true or false; they express non-cognitive attitudes (like 'Boo!' or 'Hurray!')."
  *   **Is it Defensible?** **Yes, as a major metaethical theory.** (Ayer, Blackburn, Gibbard). This is a serious philosophical position.
  *   **Does it License Dan?** **No, not as a slogan.** Expressivism is a complex theory that requires explaining away the *appearance* of moral disagreement. Since your group is discussing moral disagreement, Dan is obligated to explain why the *phenomenology* of the octopus debate (where people act as if there is a truth of the matter) is illusory. Dropping the slogan ignores the expressivist's burden to explain why moral language *looks* factual if it isn't.

  ### 5. The Mackiean Error Theory
  **The Claim:** "All positive moral claims are false because there are no objective moral properties to make them true." (Since you read Mackie, this is the heavy hitter).
  *   **Is it Defensible?** **Arguable.** This is the position your group started with. It is a defensible *position*, but it requires the "Argument from Queerness" and the "Argument from Relativity."
  *   **Does it License Dan?** **Only if he does the work.** If Dan is an Error Theorist, he should say, "I am an Error Theorist; therefore, I believe all moral claims are false, similar to taste claims." But simply saying *de gustibus* implies that the *subject matter* is preference, rather than that the *claims* are systematically erroneous. It conflates "there are no moral facts" with "morality is just preference." The former is an ontological claim; the latter is a reductionist claim. Dan is skipping the argument.

  ### 6. The Radical Subjectivist Claim
  **The Claim:** "Value is *constituted* by individual preference. There is nothing to morality *but* taste."
  *   **Is it Defensible?** **Highly Dubious.** This contradicts the phenomenology of moral experience. When we argue about polyamory, we appeal to external reasons (honesty, harm, autonomy), not just "I don't like it."
  *   **Does it License Dan?** **Yes, but it's dogmatic.** This is the only reading that fully licenses his dismissal. However, it is the least defensible reading. It denies the distinction between "I want X" and "X is good." If Dan holds this, he is rejecting the premise of the reading group (which is to investigate the nature of moral judgment) by fiat.

  ---

  ### The Diagnosis: The "Gap" Strategy

  Dan's move relies on a **Gap**.
  *   **Side A (Defensible):** "You can't argue about sensory flavor." (Claims 1 & 2)
  *   **Side B (Work-Doing):** "Morality is just sensory flavor." (Claim 6)

  Dan invokes the authority of Side A to smuggle in Side B.

  **How to push back in the session:**
  You don't need to be aggressive. You can frame this as a request for clarification that exposes the ambiguity. Here are three scripts you can use, depending on how much heat you want to bring:

  **Option 1: The Gentle Clarification (Socratic)**
  > "Dan, when you use *de gustibus*, I want to make sure I understand which claim you're making. Are you saying we literally *can't* argue about it because our brains don't work that way (the psychological claim)? Or are you saying there *are no facts* to argue about (the metaphysical claim)? Because if it's the second one, that's basically Error Theory, and I thought we needed to argue for that, not just assume it."

  **Option 2: The Phenomenology Check (Focus on the examples)**
  > "The slogan works for ice cream because I don't think vanilla is 'unjust.' But when we discuss octopus or polyamory, we appeal to reasons like consent or suffering. If you're classifying those as 'taste,' aren't you ignoring that we are offering public reasons? How does the slogan account for the fact that we treat these disputes differently than chocolate preferences?"

  **Option 3: The Meta-Ethical Call-Out (Direct)**
  > "My worry is that the slogan presupposes the conclusion of our course. We are trying to figure out *how* to distinguish preference from moral judgment. If we use *de gustibus* to classify anything we disagree on as 'preference,' we aren't drawing the line; we're just erasing it. Can we use the slogan only *after* we've established that a claim lacks moral criteria, rather than using it to prove it lacks criteria?"

  ### Summary for your notes
  *   **Defensible readings:** Claims 1 & 2 (Psychology/Standards).
  *   **Work-doing readings:** Claims 5 & 6 (Error Theory/Subjectivism).
  *   **The Problem:** The defensible readings don't apply to morality (without argument), and the work-doing readings aren't defensible without argument. Dan is trading on the ambiguity to avoid giving the argument.

  This breakdown should give you the vocabulary to show that the slogan isn't an argument; it's a placeholder for an argument that Dan isn't making.
