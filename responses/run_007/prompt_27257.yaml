answer: |-
  Dear colleague,

  You have correctly identified the tension at the heart of our work. The debate between generalism and particularism is not just academic noise; it is exactly why our meetings stall. The generalist wants a rule that covers all cases, while the particularist insists that the moral weight of a feature like lying or refusing treatment shifts depending on the context. If we pretend principles are exceptionless, we become rigid and unjust. If we pretend they are irrelevant, we become arbitrary and indefensible. Since you asked for a procedure that fits within an hour and satisfies the medical board, I must be honest from the start: writing a procedure is itself a concession to generalism. It assumes we can standardize moral reasoning. However, we can design a procedure that does not try to solve the particularist problem but rather manages it by forcing us to isolate exactly where the judgment call lies. The goal is not to eliminate discretion but to make it visible so that when the board asks why we decided X, we can show them the specific feature of the case that tipped the scale.

  The procedure consists of four sequential questions that must be answered in order, and the meeting ends immediately if the first question cannot be resolved. The first question is strictly factual. We ask what the medical status, legal constraints, and patient capacity are, and a sufficient answer requires unanimous agreement among the committee members. If a clinician says the patient lacks capacity and another says they have it, the procedure stops there. We do not move to ethics until we agree on the facts, because particularism relies on specific features, and we cannot weigh features we have not identified. If we cannot agree on the facts within fifteen minutes, the case is returned to the treating team for clarification, and we record no ethical recommendation. This is where the procedure stops with a no. It cannot adjudicate medical disputes, only ethical ones.

  Once facts are settled, the second question asks which prima facie principles are in conflict. We do not ask which principle wins yet, only which ones are present. A sufficient answer here is simply naming them, such as autonomy versus beneficence, or confidentiality versus duty to warn. This step acknowledges the generalist framework that gives the board comfort. The third question is where we invite the particularist insight. We ask whether there is a specific feature of this case that changes the moral weight of one of the principles. For example, does the fact that the patient is a minor change the weight of autonomy? Does the fact that the harm is imminent change the weight of confidentiality? A sufficient answer requires pointing to a specific fact identified in step one that acts as a defeater for the usual rule. If no one can identify a specific feature that alters the weight, the default principle stands. This is where judgment is dressed up as procedure. We are asking members to articulate their intuition about relevance, and there is no objective test for whether a feature is morally relevant. However, requiring it to be articulated prevents members from simply asserting an exception without reason.

  The fourth and final question is the defensibility check. We ask if we would accept this reasoning if the roles were reversed or if this case were cited as precedent for a similar case next year. A sufficient answer is a unanimous vote that the reasoning holds consistency. If the committee cannot agree here, the decision is handed to the committee chair, who must document the dissent. This is where the procedure admits it cannot solve moral disagreement. It isolates the disagreement to whether the specific exception is generalizable. If we cannot agree that this exception is safe to use again, we cannot recommend it, because the board requires defensibility. This means the procedure will sometimes recommend a morally suboptimal action because it cannot be safely standardized. That is the cost of working within an institution.

  Let us run this on the patient refusing the blood transfusion. In step one, we agree on the facts: the patient is an adult, has been assessed as having decision-making capacity, understands the risk of death, and refuses based on religious conviction. The medical team agrees death is highly likely without transfusion. In step two, we identify autonomy versus beneficence. In step three, we ask if there is a feature that changes the weight of beneficence. Usually, saving a life outweighs refusal. However, the specific feature here is the intact capacity combined with the religious grounding. The particularist argument is that bodily integrity is not just a preference but a constitutive part of the person's moral identity. The committee must decide if this feature defeats the usual priority of beneficence. In step four, we ask if we would accept this as precedent. If we say yes, we are saying any capacitated adult can refuse life-saving treatment for religious reasons. If the committee votes yes, the recommendation is to honor the refusal. This outcome might be unpopular with surgeons who feel they are being asked to let a patient die, but the procedure forces them to acknowledge that the principle of autonomy, given the specific feature of capacity, defeats beneficence in this context. The procedure does not make this easy, but it makes the reasoning clear for the board.

  Now consider the nurse who accessed the chart to warn the partner about HIV. In step one, we agree on the facts: the nurse accessed records without authorization, the patient had not consented to disclosure, but the partner was at immediate risk of infection. The nurse did not consult the public health officer or the attending physician before acting. In step two, the conflict is confidentiality versus duty to prevent harm. In step three, we look for the feature that alters the weight. Usually, confidentiality is strict. However, imminent harm to an identifiable third party is a known defeater for confidentiality. Here is where the procedure might produce an outcome the committee will not like. The specific feature of this case is not just the harm, but the method. The nurse bypassed the established protocol for partner notification. The particularist insight is that while warning the partner was good, the unauthorized access undermines the trust required for the healthcare system to function. If we allow nurses to breach confidentiality based on their own assessment of risk, we create a rule that could be abused. In step four, we ask if we would accept this as precedent. Would we accept a rule that allows any clinician to access records without authorization if they believe harm is imminent? Most committees would have to say no, because it invites subjective risk assessment outside of legal safeguards. Therefore, the procedure recommends that the nurse's action was unethical, despite the good outcome. This will be deeply unpopular. The committee will want to support the nurse who saved a partner. But the procedure isolates the judgment to the method, not the outcome. To be defensible to the board, we cannot recommend a breach of protocol even for a good result, unless we are willing to codify that breach as acceptable practice. Since we are not, the recommendation must be critical of the nurse.

  I must conclude by reiterating what this procedure cannot do. It cannot relieve the moral distress of the surgeons in the first case or the nurse in the second. It cannot tell us if particularism is true. It is a tool for institutional defensibility, not moral truth. By writing it down, we are pretending that moral reasoning can be captured in steps, which is a generalist fiction. But it is a fiction that allows us to finish the meeting in an hour and survive the audit. The judgment calls are hidden in step three, where we decide which features are relevant, and in step four, where we decide which precedents we are willing to live with. We are not solving the philosophy; we are managing the risk. If you can accept that limitation, this workflow should stop the arguments about whether principles are rules or thumbprints and focus us on whether we can defend the exception we are about to make.

  Best regards,

  Your colleague
