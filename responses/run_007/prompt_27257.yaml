prompt: |-
  I serve on the clinical ethics committee at a small hospital. We review maybe a dozen cases a year — treatment refusals, family members demanding we hide a diagnosis, triage decisions in a bad flu season — and our recommendations have to be defensible to the medical board if someone complains. We meet for an hour, and most of us are clinicians, not philosophers. Our current method is a one-page list of principles, and every meeting devolves into the same argument: one member says the principle settles it, and another says the principle is just a rule of thumb and this case is one of the exceptions. I gather philosophers have actually fought about this under the names generalism and particularism, and the particularists say something like: a feature that counts against an act in one case can count in favor of it in another, so there are no exceptionless moral principles to fall back on. I want you to turn that debate into a procedure the committee can actually run in an hour. What questions do we ask, in what order, and what counts as a sufficient answer to each? Where should the procedure stop with a no, and where does it have to hand the decision to a person because the question is one of judgment rather than fact? Be honest about which steps are judgment calls dressed up as procedure, and about what the procedure cannot do — in particular whether writing a procedure at all is already a concession to generalism. Then run the procedure on two cases: a patient with capacity refusing a blood transfusion on religious grounds, and a nurse who looked at a patient's chart in order to warn the patient's partner about an HIV diagnosis. Make sure at least one of those comes out the way the committee would not like. And please, no headings, bullets, bold text, or tables — continuous prose only, the way you'd write an email.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a clinical ethics committee at a small hospital.
      *   **Context:** Review ~12 cases/year (treatment refusals, family requests, triage). Recommendations must be defensible to the medical board.
      *   **Constraint:** Meetings are 1 hour. Members are clinicians, not philosophers.
      *   **Problem:** Current method (one-page list of principles) leads to arguments about generalism vs. particularism (principles vs. exceptions).
      *   **Task:** Turn the generalism/particularism debate into a usable procedure for the committee.
      *   **Requirements:**
          *   Specify questions to ask, in order.
          *   Specify what counts as a sufficient answer.
          *   Specify where to stop with a "no" vs. hand off to judgment.
          *   Be honest about judgment calls dressed as procedure.
          *   Be honest about limitations (e.g., is writing a procedure itself a concession to generalism?).
          *   Run the procedure on two cases:
              1.  Patient with capacity refusing blood transfusion (religious).
              2.  Nurse looking at chart to warn partner about HIV.
          *   At least one case must come out a way the committee would not like (counter-intuitive or uncomfortable).
          *   **Format Constraint:** No headings, bullets, bold text, or tables. Continuous prose only (like an email).

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Generalism:* Moral principles (autonomy, beneficence, etc.) are universal and exceptionless (or have codifiable exceptions).
      *   *Particularism:* Moral reasons are context-dependent. A feature (e.g., lying) can be bad in one case and good in another. Principles are at best rules of thumb.
      *   *The Challenge:* Clinicians want rules (defensibility), but reality is messy (particularism). A rigid procedure risks being too generalist, but no procedure risks being arbitrary.
      *   *The Solution:* A "casuistic" or "reflective equilibrium" approach disguised as a procedure. It needs to acknowledge that principles are starting points, not end points, and force the committee to articulate *why* a principle applies or doesn't apply in *this* specific context.

  3.  **Drafting the Procedure:**
      *   Need a flow that respects the 1-hour limit.
      *   Step 1: Facts. (Crucial for defensibility).
      *   Step 2: Identify conflicting principles (the "generalist" start).
      *   Step 3: Test the principles against the specifics (the "particularist" pivot). Ask: "Does this feature actually count as a reason here?"
      *   Step 4: Consensus/Decision.
      *   Need to address the "judgment vs. fact" distinction.
      *   Need to address the meta-ethical honesty (writing a procedure *is* a generalist act).

  4.  **Drafting the Case Runs:**
      *   *Case 1 (Jehovah's Witness):* Standard autonomy vs. beneficence. Usually, autonomy wins if capacity is clear. To make it "uncomfortable," maybe the procedure highlights a nuance that makes the committee hesitate, or perhaps it upholds autonomy so strictly it feels cold. Actually, the prompt asks for at least one case to come out a way the committee would *not* like. Usually, committees want to save lives. If the procedure forces them to respect refusal strictly, that might be uncomfortable for some clinicians, but it's standard ethics. Let's look at Case 2.
      *   *Case 2 (Nurse/HIV):* Confidentiality vs. Duty to Warn. This is legally and ethically murky. Tarasoff-style duties vary. If the procedure forces a strict confidentiality rule, the committee might hate it because the partner is at risk. If it forces a warning, they might hate it because of privacy laws. Let's aim for the procedure to validate the nurse's breach of confidentiality based on imminent harm, which might violate hospital policy or strict privacy interpretations, making the committee nervous about defensibility. Or, conversely, the procedure might show the nurse acted improperly because proper channels weren't used, leading to a recommendation against the nurse, which might feel morally harsh if the partner was saved. Let's try to make the procedure conclude that the nurse's action was unethical despite the good outcome, because the *process* was wrong. That usually bothers clinicians who value outcomes.
      *   *Wait, re-reading:* "Make sure at least one of those comes out the way the committee would not like." This implies the *recommendation* is unpopular. If the committee is clinician-heavy, they usually prioritize patient safety/outcomes. A procedure that prioritizes rigid process over outcome might be unpopular. Or a procedure that forces them to accept a refusal of life-saving treatment (Case 1) might be unpopular with surgeons. Let's make Case 1 (Blood Transfusion) result in a strict "do not transfuse" recommendation despite the patient dying, which surgeons often hate. Or Case 2 where the nurse is censured despite preventing infection. Let's go with Case 2: The procedure reveals the nurse violated confidentiality without exhausting alternatives, so the committee must recommend disciplinary action, even though the partner was saved. Clinicians hate punishing good Samaritans.

  5.  **Addressing the Format Constraint:**
      *   **NO HEADINGS, BULLETS, BOLD, TABLES.**
      *   Continuous prose only.
      *   Tone: Professional, email-like, honest, philosophical but practical.

  6.  **Developing the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the tension. Admit that writing a procedure is itself a generalist move, but a necessary one for defensibility.
      *   *The Procedure:* Describe it narratively.
          1.  Establish facts (capacity, urgency, alternatives).
          2.  Identify the conflict (which principles are fighting?).
          3.  The "Defeater" Question (Is there a specific feature here that flips the principle?).
          4.  The "Defensibility" Check (Can we write this down without contradicting past cases?).
          5.  The Decision.
      *   *Honesty:* Admit step 3 is where the judgment hides. Admit the procedure can't solve moral distress.
      *   *Case 1 (Transfusion):* Walk through the steps. Facts clear. Conflict: Autonomy vs. Beneficence. Defeater: None found (capacity is key). Result: Respect refusal. (This might be uncomfortable for life-saving clinicians, but it's standard).
      *   *Case 2 (Nurse/HIV):* Facts: Nurse accessed chart without authorization, warned partner. Conflict: Privacy vs. Harm Prevention. Defeater: Did she check if the patient would tell? Did she check legal protocols? If no, the "feature" of unauthorized access counts against her even if the outcome was good. Result: Action was unethical. (This will be unpopular).
      *   *Conclusion:* Reiterate limitations.

      *Self-Correction on Format:* I must ensure I do not use *any* bolding or lists. Even numbering like "1." might be risky if it looks like a list. I should use words like "first," "second," "next." I need to be very careful with paragraph breaks to ensure it looks like prose.

      *Self-Correction on "Unpopular Outcome":* The prompt says "Make sure at least one of those comes out the way the committee would not like." A committee of clinicians usually wants to support clinicians. Recommending discipline for the nurse (Case 2) is likely unpopular. Recommending letting a patient die (Case 1) is also unpopular. I'll make Case 2 the unpopular one because it punishes a clinician for trying to help, which triggers the "second victim" fear.

      *Refining the Procedure Description:* I need to explicitly answer "Where should the procedure stop with a no, and where does it have to hand the decision to a person because the question is one of judgment rather than fact?" I need to weave this into the prose.

      *Refining the Meta-Ethical Honesty:* I need to explicitly state that creating this procedure is a concession to generalism.

