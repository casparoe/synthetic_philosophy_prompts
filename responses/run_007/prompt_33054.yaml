answer: |-
  It is completely understandable that you feel lost; the Pasadena game is notorious for turning robust mathematical tools into philosophical mush. To grasp why it matters without drowning in algebra, we need to shift focus from the calculation itself to what an "expected value" is actually supposed to represent.

  ### The Intuition: A Bag of Numbers
  Imagine the possible outcomes of the game not as a sequence in time, but as a vast bag containing slips of paper. Each slip represents a possible outcome (heads on flip 1, heads on flip 2, etc.), labelled with its probability and its payoff. To find the expected value, you are essentially trying to add up all the values in this bag, weighted by their probability.

  In ordinary situations, the total in the bag is stable. It does not matter whether you count the £10 slips before the £5 slips or vice versa; the sum is the same. This stability relies on a mathematical property called **absolute convergence**. It guarantees that the positive and negative values are finite enough in magnitude that their order of addition is irrelevant.

  The Pasadena game breaks this stability. The positive payoffs alone sum to infinity, and the negative payoffs alone sum to negative infinity. You have an infinite amount of good news and an infinite amount of bad news mixed together. The result, $\ln 2$, only appears if you add the slips in the specific order of flip 1, then flip 2, then flip 3, and so on.

  ### Why isn't "$\ln 2$" a legitimate answer?
  Here lies the rub. In probability theory, the sample space (the bag of outcomes) is a set, not a sequence. A set has no inherent order. There is no physical law dictating that you must evaluate the outcome of flip 1 before flip 2 when calculating the theoretical value of the game. You could just as logically group all the odd flips together first, or arrange them by the size of the payoff.

  Because the series is only *conditionally* convergent, the Riemann Rearrangement Theorem tells us that by simply shuffling the order in which you sum these outcomes, you can make the total equal to any number you like (positive, negative, or zero). If the value of the game depends on an arbitrary choice of how to order the outcomes, then the game effectively has no unique value. Saying the expectation is $\ln 2$ is like saying the average height of a group of people depends on the order in which they stand in line. It suggests the tool (Expected Utility Theory) is broken, not that the game has a specific value.

  ### How is this different from the St Petersburg Paradox?
  The classic St Petersburg paradox is a problem of **infinity**. The expected value diverges to positive infinity, suggesting you should pay any finite amount to play, which clashes with human intuition. The theory gives an answer ("infinity"), but it is an impractical one.

  The Pasadena game is a problem of **undefinedness**. The expected value does not exist at all. Expected Utility Theory (EUT) goes silent. It cannot tell you whether to play for a penny or pay a million pounds. While St Petersburg challenges whether we should trust infinite values, Pasadena challenges whether EUT can handle cases where utilities are unbounded but cancel out ambiguously. It is a more fundamental attack on the coherence of the theory.

  ### Is there a consensus on what to do?
  There is no consensus. The game has split decision theorists into camps. Some argue that rational agents must have **bounded utility** (there is a maximum amount of good or bad anything can do for you), which simply disqualifies the Pasadena game as impossible for a rational agent to conceive. Others argue that we must reject **countable additivity** (the rule that allows us to sum infinite probabilities), which blocks the paradox but weakens probability theory.

  A significant group, however, accepts that EUT is simply silent here. They argue that rationality does not require a preference in such pathological cases. You are not irrational for refusing to play, nor for playing; the theory simply has no jurisdiction. This is often viewed as unsatisfying because it suggests our best model of rational choice fails in precisely the kind of extreme uncertainty it was designed to handle.

