      *   For the Fiction problem: The cheapest fix is to argue that reading fiction involves *implicit consent* to be moved. The reader *wants* to be bypassed. This preserves (a) because the target *would* endorse the motivation if aware (they bought the book to feel this).
      *   For the Intent problem: Distinguish between the *act* being manipulative and the *act* being *unethical*. (d) admits it's manipulation but says it's not "morally loaded." This is actually consistent if phrased carefully. The tension is in (a) saying manipulation *is* wrong.
