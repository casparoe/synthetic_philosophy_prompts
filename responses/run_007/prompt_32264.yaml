      *   **Tension 4: (b) vs. (c).**
          *   *Core:* Persuasion needs reasons. Fiction doesn't give reasons, it gives experiences.
          *   *Severity:* **High.** (Subset of Tension 1).
          *   *Resolution:* Fiction isn't "persuasion" in the propositional sense; it's "simulation" or "invocation."

