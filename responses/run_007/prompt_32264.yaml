          *   *Cost:* Nuance. Have to explain why readers consent to this bypass.
      *   *Analysis of Tension 2 (Intent vs. Mechanism):* (a) defines manipulation by the *how*. (d) excuses it by the *why*.
          *   *Revision:* Distinguish "Manipulation" (descriptive) from "Wrongful Manipulation" (normative).
          *   *Cost:* Semantic precision.
      *   *Analysis of Tension 3 (Doctor vs. Advertiser):* Both bypass reason. One is okay, one isn't.
