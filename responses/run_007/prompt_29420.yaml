prompt: |-
  I've been thinking about consent and deception, and I've landed on a view that I'm not entirely comfortable with but can't see my way around. Here it is: whether deception invalidates consent depends entirely on what the deception was about. If someone lies about something that's internal to the act they're asking consent for — like lying about wearing a condom, or lying about what medical procedure they're about to perform — then consent is void. But if they lie about something external to the act — like lying about being married, or about their job, or about their feelings — then the consent stands, even if the person wouldn't have consented had they known the truth. The distinction is between deceptions that change what the act *is* and deceptions that only change what the act *means* or what its broader context is.

  I want to know what would count against this view. What cases does it get wrong? Are there deceptions about context that are so central to someone's reasons for consenting that they should count as invalidating? And on the flip side, are there deceptions about the act itself that shouldn't invalidate consent? I'd also like to know whether this view collapses into one of the standard positions under pressure — like the view that consent is just about what's subjectively material to the consenter, or the view that consent is never invalidated by deception at all. Rank the problems, and tell me honestly whether the view is salvageable or whether I should abandon it. Oh, and please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The ethics of consent and deception (specifically, fraud in the inducement vs. fraud in the factum, though the user frames it as internal vs. external deception).
      *   **User's View:** Deception invalidates consent *only* if it's about something "internal" to the act (changes *what* the act is). Deception about "external" factors (changes *meaning* or *context*) does not invalidate consent, even if material to the decision.
      *   **Tasks:**
          1.  Identify counter-examples/cases the view gets wrong (context deceptions that *should* invalidate, act deceptions that *shouldn't*).
          2.  Assess if the view collapses into standard positions (subjective materiality vs. no invalidation).
          3.  Rank the problems.
          4.  Give an honest verdict on salvageability.
          5.  **Constraint:** Write in British English.

  2.  **Deconstruct the User's View:**
      *   This is essentially a version of the "Fraud in the Factum" vs. "Fraud in the Inducement" distinction found in law and philosophy (e.g., O'Neill, Alexander, Wertheimer).
      *   *Internal/Factum:* Nature of the act (e.g., sex vs. medical exam, condom use).
      *   *External/Inducement:* Reasons for the act (e.g., status, wealth, love).
      *   *Strength:* Provides a clear bright line. Avoids the "subjective materiality" slippery slope where any lie could void consent.
      *   *Weakness:* The line between "internal" and "external" is often blurry. Some "external" factors seem morally crucial.

  3.  **Brainstorming Counter-Examples (What counts against the view?):**

      *   *External deceptions that feel like they *should* invalidate consent:*
          *   **Impersonation:** Lying about *who* one is. (Is identity internal or external? Usually treated as internal in law, but fits the user's "external" definition if defined loosely as context).
          *   **HIV Status:** Is this internal (nature of the act/risk) or external (health status)? Most argue this invalidates consent.
          *   **Reproductive Intentions:** Lying about wanting children/sterility. This is about the *consequences* of the act, not the physical mechanics.
          *   **Authority/Coercion adjacent:** Lying about being a police officer to get sex. (This borders on coercion, but is technically deception about status).
          *   **The "Sperm Theft" case:** Lying about contraception to get someone pregnant.

      *   *Internal deceptions that *shouldn't* necessarily invalidate consent:*
          *   **Trivial details:** Lying about the specific brand of medical instrument? (Too minor).
          *   **White lies to facilitate the act:** "This won't hurt" (when it will a bit). Is this internal? It's about the sensation.
          *   **Surprise elements:** A surprise party? (Not sexual/medical, but consent to gathering).
          *   **Roleplay:** Consensual deception within the act.

      *   *The Collapse Problem:*
          *   If "internal" is defined by "what the person cares about," it collapses into Subjective Materiality.
          *   If "internal" is defined strictly physically, it collapses into "Consent is never invalidated" (except for the most extreme physical swaps).

  4.  **Developing the Argument (British English Nuances):**
      *   Use spelling: *colour, analyse, centre, defence, programme*.
      *   Use vocabulary: *whilst, amongst, reckon, shall, ought*.
      *   Tone: Philosophical, analytical, polite but direct.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the view. It's a classic distinction (factum vs. inducement).
      *   **Problem 1: The 'Identity' Counter-Example (Highest Rank).** Lying about who you are. If I consent to sex with my husband, and it's actually his twin brother, the view might call this 'external' (identity is context?), but morally it voids consent. *Correction:* Usually, identity is treated as internal to the partner. But what about professional identity? (Doctor/Patient).
      *   **Problem 2: Health and Risk (HIV/STDs).** This is the biggest pressure point. Is HIV status internal to the act? Physically, the act is the same. Biologically, the risk is different. If the view says this is external, it fails morally. If it says internal, the definition of 'internal' stretches.
      *   **Problem 3: Reproductive Deception.** Lying about contraception or sterility. The physical act is identical. The consequence is different. Many argue this vitiates consent.
      *   **Problem 4: The Boundary Problem (Collapse).** How do we define 'internal'? If we define it by 'essential features,' who decides? If the consenter decides, it's subjective materiality. If the law/philosopher decides, it's paternalistic.
      *   **Salvageability:** Is it fixable? Yes, by refining 'internal' to include 'normatively essential features' rather than just physical mechanics.

  6.  **Refining the Ranking:**
      1.  **The Health/Risk Problem (HIV/STDs):** Most urgent moral failure.
      2.  **The Identity Problem:** Fundamental to autonomy.
      3.  **The Definitional Collapse:** Theoretical instability.
      4.  **Trivial Internal Lies:** Over-inclusivity.

  7.  **Final Review against Constraints:**
      *   British English? (Check spellings and idioms).
      *   Honest verdict? (Yes).
      *   Addressed all sub-questions? (Yes).

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe impersonation is clearly internal.
      *   *Correction:* Under the user's definition ("internal to the act"), one could argue the *act* of sex is the same regardless of the partner's name. I need to show why this distinction is hard to maintain without arbitrariness.
      *   *Tone check:* Ensure I don't sound condescending. The user has landed on a defensible philosophical position (similar to Onora O'Neill or some legal standards), so treat it with respect while critiquing.

  9.  **Final Polish:** Check for "z" vs "s" in organise/analyze (British prefers 's', though 'z' is Oxford spelling, I'll stick to 's' for safety/consistency with common British usage). Ensure "programme" not "program". Use "whilst".

  *(Self-Correction on British English)*: Actually, Oxford spelling uses 'ize', but standard British usage often prefers 'ise'. I will use 'ise' to be safe and distinctively non-American. I will ensure vocabulary like 'maths' (if needed), 'licence' (noun), 'defence'.

  Let's structure the response clearly with headings.

