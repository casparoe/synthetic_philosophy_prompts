answer: |-
  This is a sophisticated position you have arrived at. In philosophical and legal circles, this is often recognised as the distinction between *fraud in the factum* (deception about the nature of the act) and *fraud in the inducement* (deception about the reasons for the act). It is a view held by various legal systems and philosophers, such as Onora O'Neill, because it attempts to strike a balance between protecting autonomy and avoiding the chaos of making every white lie a potential assault.

  However, you are right to feel a degree of unease. The line between 'internal' and 'external' is notoriously difficult to draw without arbitrariness. Below, I have ranked the problems with this view from most severe to least severe, followed by an analysis of whether it collapses into other positions and a final verdict on its salvageability.

  ### 1. The Problem of Health and Risk (Highest Priority)
  This is the most significant moral failure of the view as you have stated it. Consider the case of HIV status or other serious sexually transmitted infections.

  *   **The Case:** Person A consents to unprotected sex with Person B. Person B knows they are HIV positive but lies and says they are negative.
  *   **Your View's Verdict:** One could argue this is an 'external' deception. The physical mechanics of the act are identical. The lie concerns a medical condition (context/status), not the nature of the act itself (which is still sexual intercourse). Therefore, consent stands.
  *   **Why it gets it wrong:** Most people intuitively feel that consent to *safe* sex is fundamentally different from consent to *life-risking* sex. If the deception concerns a risk that is intrinsic to the performance of the act, treating it as merely 'contextual' seems to violate bodily autonomy. If your view validates consent here, it permits a serious moral wrong. If you adjust the view to say health risks are 'internal', you must explain why a lie about wealth or marriage isn't also a 'risk' to one's life plan.

  ### 2. The Problem of Identity and Impersonation
  This is the classic counter-example in the literature, but it puts pressure on your definition of 'internal'.

  *   **The Case:** A woman consents to sex with her husband in the dark. It is actually his brother, who has remained silent to deceive her.
  *   **Your View's Verdict:** If 'internal' means the physical act, the act is the same. If 'internal' includes the identity of the partner, the consent is void.
  *   **Why it gets it wrong:** If you classify identity as 'external' (a feature of the person, not the act), your view implies she consented. This is absurd; she consented to intimacy with *her husband*, not his brother. However, if you classify identity as 'internal', you must explain why identity is internal but marital status (lying about being married) is external. Both are facts about the person. The distinction begins to look like splitting hairs to reach the 'correct' moral conclusion rather than following a principled rule.

  ### 3. The Problem of Reproductive Intentions
  This is a growing area of ethical debate that strains the internal/external distinction.

  *   **The Case:** A man lies about having had a vasectomy to persuade a woman to have unprotected sex, intending to impregnate her against her wishes (or vice versa).
  *   **Your View's Verdict:** The physical act is unchanged. The deception is about future consequences or intentions (external context). Consent stands.
  *   **Why it gets it wrong:** Many argue that reproduction is a fundamental purpose of sexual activity for many people. To deceive someone about the reproductive consequences is to change the *nature* of the transaction, even if the physical mechanics are identical. If your view holds that consent is valid here, it fails to protect people from being used as mere means to an end (parenthood) without their knowledge.

  ### 4. The Problem of Trivial Internal Lies (Over-inclusivity)
  On the flip side, are there deceptions about the act itself that *shouldn't* invalidate consent?

  *   **The Case:** A magician asks for a volunteer for a trick that involves a brief, harmless pinch. He says, "I will touch your arm," but actually touches your wrist. Or, a doctor says, "I am using a steel scalpel," but uses a titanium one.
  *   **Your View's Verdict:** These are lies about the internal mechanics of the act. Technically, consent is void.
  *   **Why it gets it wrong:** This makes the view too rigid. It criminalises or moralises trivial deviations. We need a way to distinguish between *essential* features of the act and *incidental* features. Your current formulation lacks a filter for significance.

  ### Does the View Collapse?

  You asked whether this view collapses into one of the standard positions under pressure. The answer is: **yes, it is in constant danger of collapsing into Subjective Materiality.**

  Here is the mechanism of the collapse:
  To avoid the absurd results in the HIV and Impersonation cases, you will be forced to expand the definition of 'internal'. You will start saying, "Well, HIV status is internal because it changes the *risk*," or "Identity is internal because it changes the *partner*."

  Once you start defining 'internal' as "anything that significantly changes the nature of the act," the question becomes: **Significant to whom?**
  *   If it is significant to the *consenter* (e.g., "It matters to me if he is married"), then you have collapsed into the **Subjective Materiality** view (any lie that influences the decision voids consent).
  *   If it is significant to the *law/morality* (e.g., "We decide identity matters, but wealth does not"), then you are relying on a paternalistic standard of what *ought* to matter, which undermines the very autonomy the consent framework is meant to protect.

  To avoid collapsing into "Consent is never invalidated" (by keeping 'internal' strictly physical), you must accept the morally repugnant conclusions regarding HIV and impersonation. To avoid those conclusions, you must expand 'internal', which blurs the line until it disappears.

  ### Verdict: Is it Salvageable?

  **Honest Assessment:** The view is **salvageable, but it requires modification.** You should not abandon the core intuition—that not every lie vitiates consent—but you must refine the criterion for what counts as 'internal'.

  **How to fix it:**
  Instead of "Internal vs. External," adopt a framework of **"Normatively Essential Features."**
  Deception invalidates consent not merely when it is about the physical act, but when it concerns a feature of the act or the agent that is *normatively essential* to the type of interaction being undertaken.

  *   **Why this helps:** It allows you to say HIV status is 'essential' to sexual intimacy (due to risk) without saying wealth is 'essential'. It allows you to say identity is 'essential' without saying job title is.
  *   **The Cost:** You lose the bright-line clarity of your original view. You have to do the hard work of arguing *why* certain features are essential. You cannot simply point to physics; you must point to social and moral norms.

  **Final Recommendation:**
  Do not abandon the project, but do not cling to the "Internal/External" phrasing. It is too brittle. Shift your language to **"Deception regarding the essential nature of the act versus deception regarding the collateral benefits."**

  Acknowledge that 'essential nature' includes health risks and identity, whilst 'collateral benefits' includes wealth, status, or emotional promises. This preserves your intuition that lying about one's job shouldn't void sexual consent, whilst avoiding the moral catastrophe of validating consent in cases of HIV transmission or impersonation. It is a harder line to defend, but it is the only one that holds up under scrutiny.
