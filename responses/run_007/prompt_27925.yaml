  3.  **Evaluate the Nature of the Dispute:**
      *   *Is it merely verbal?* Partially. Definitions of "understanding" and "belief" vary wildly. If Side A defines belief functionally and Side B defines it biologically/phenomenologically, they aren't disagreeing about the model, but about the label.
      *   *Is it empirical?* Yes, underneath. It's about what mechanisms are necessary for cognition. Is transformer architecture sufficient? Does grounding matter?
      *   *Is it about standards of evidence?* Definitely. Side A accepts behavioral success as evidence of internal state. Side B requires causal mechanism transparency or embodied interaction.
      *   *Is it about bedrock intuitions?* Yes. Some intuitively feel syntax $\neq$ semantics (Searle's Chinese Room). Others feel input-output mapping *is* semantics (Turing Test tradition).

