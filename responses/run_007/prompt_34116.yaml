answer: |-
  This is a fantastic question, and you have spotted the exact tension that makes this passage philosophically rich rather than just a platitude. You are right to sense that "Judge not" is not a blanket prohibition on moral discernment, otherwise verse 5 ("then shalt thou see clearly to cast out the mote") would be nonsensical.

  To help you flesh out your character, we need to disentangle two different philosophical problems wrapped up in this text: the **epistemic problem** (can the hypocrite see the truth?) and the **normative problem** (does the hypocrite have the *right* to speak the truth?).

  Here is the breakdown of the philosophy of "standing to blame," specifically through the lens of that passage, and how it applies to your character.

  ### 1. The Exegesis: "Judge Not" vs. "See Clearly"
  You are correct that verse 1 ("Judge not") is often misread as moral relativism. In the context of the Sermon on the Mount, the Greek word *krino* here implies **condemnatory judgment**—a final, self-righteous sentencing of another person, often to elevate oneself.

  Verse 5 is the key to your character. It implies a surgical metaphor. You cannot perform eye surgery on someone else if your own vision is obstructed by a plank of wood.
  *   **The Epistemic Claim:** The beam *distorts* vision. This suggests the hypocrite might actually be wrong about the severity or nature of the other person's fault. They are projecting.
  *   **The Normative Claim:** Even if the hypocrite *could* see clearly, they are not permitted to operate until they are clean.

  So, to answer your specific question: The passage suggests **both**. The hypocrite's perception is likely distorted (they are obsessed with the mote because they are avoiding the beam), *but* even if their criticism is factually accurate, they lack the **moral authority** to deliver it.

  ### 2. Standing to Blame: Etiquette or Moral Principle?
  You asked: *If the hypocrite's criticism is factually correct, what is it exactly that's missing from her standing? Is it just a matter of etiquette, or is there a deeper moral reason?*

  In contemporary moral philosophy (thinkers like R. Jay Wallace or Gary Watson), this is known as the problem of **Standing**. The consensus is that it is **not merely etiquette**. It is a deeper moral reason. Here is why:

  **A. The Commitment Condition**
  When you blame someone, you are implicitly claiming to stand for a value. If I say, "You shouldn't lie," I am asserting that I uphold the value of honesty. If I am a liar, my action demonstrates that I do not actually respect that value. Therefore, my blame is revealed as a tool of power or control, not a defense of the moral good. Your character isn't defending morality; he is using morality as a weapon to deflect attention from himself.

  **B. The Fairness Condition**
  Blame implies a community of shared rules. If I hold you to a standard that I exempt myself from, I am claiming a privilege I haven't earned. This violates the basic moral principle of reciprocity (which Matthew 7:2 explicitly mentions: *"with what measure ye mete, it shall be measured to you again"*). It turns the moral relationship into a hierarchy where the hypocrite is the judge and the other person is the defendant, despite them both being guilty.

  **C. The Trust Condition**
  Blame is a form of moral communication. It is an invitation to acknowledge a wrong and repair the relationship. A hypocrite breaks the trust required for that conversation. If your character tells his business partner, "You need to be more transparent," while hiding an affair, the partner cannot hear this as care. They hear it as manipulation. The truth of the statement ("transparency is good") is swallowed by the context of the speaker.

  ### 3. Application to Your Character
  To avoid making him a cartoon villain, you need to decide *why* he lacks standing. Is he malicious, or is he tragic?

  **Option A: The Blind Hypocrite (Epistemic Distortion)**
  He genuinely believes he is the moral arbiter. The "beam" in his eye is so large he literally cannot see his own hypocrisy.
  *   *Philosophical angle:* He suffers from **self-deception**. He points out the mote in others to convince himself he doesn't have a beam.
  *   *Novelistic effect:* This makes him pitiable. He is desperate for order in a life he is chaos-ing up. When he blames others, he is trying to stabilize his own crumbling moral world.

  **Option B: The Cynical Hypocrite (Normative Failure)**
  He knows he is a mess. He knows he has no standing. But he uses moral criticism anyway to gain leverage.
  *   *Philosophical angle:* This is **bad faith**. He understands the rules of the moral community but exploits them for personal gain.
  *   *Novelistic effect:* This makes him dangerous. He knows exactly which buttons to push. He might say, "I know I'm not perfect, but I'm right about this." (This is a common defense, but philosophically weak, as it admits the lack of standing while demanding the authority).

  **Option C: The Tragic Hypocrite (The "Verse 5" Hope)**
  This aligns best with the Biblical text's hope. He knows the beam is there. He hates it. But he is addicted to the beam.
  *   *Philosophical angle:* He recognizes the **truth of the claim** but acknowledges his **lack of standing**.
  *   *Novelistic effect:* This creates internal conflict. Imagine a scene where he sees his partner lying. He *knows* he should call it out. He *knows* it's wrong. But he stays silent because he knows if he speaks, he exposes himself. Or, he speaks, and immediately feels the hollowness of his own voice.

  ### 4. How to Write the "Lack of Standing"
  If you want the reader to feel the philosophical weight of his hypocrisy without you explaining it, show the **reaction of the blamed**.

  When a person with standing blames you, you feel guilt or a call to repair.
  When a person *without* standing (a hypocrite) blames you, you feel **resentment** or **contempt**.

  If your character critiques someone, and the recipient thinks, *"Who are you to say this?"* rather than *"Oh no, I did wrong,"* you have successfully dramatized the lack of standing.

  ### Summary for your Drafting
  1.  **The Criticism Can Be True:** The hypocrite can be factually right about the other person's fault. (The mote is real).
  2.  **The Authority Is Fake:** The hypocrite lacks the *normative standing* to enforce that truth because they violate the reciprocity of the moral community.
  3.  **The Vision Is Clouded:** The passage suggests his own failings likely distort *how* he judges (harshly, selectively, or projectionarily).
  4.  **The Path Forward:** The text argues that moral correction is only legitimate when it comes from a place of shared vulnerability ("first cast out the beam").

  For a complex character, the most interesting place to live is the gap between **knowing the truth** and **lacking the authority to speak it.** Does he stay silent? Does he speak and feel like a fraud? Or does he speak and double down to convince himself he isn't?

  That tension is where the humanity lives.
