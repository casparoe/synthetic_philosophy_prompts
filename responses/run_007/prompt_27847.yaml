answer: |-
  The analogy you describe is indeed a compelling piece of philosophical architecture, designed to bridge the intuitive gap between the rationality of prudence within a single life and the obligations of morality across multiple lives. It attempts to dissolve the force of Taurek's objection by suggesting that the separateness of persons is no more metaphysically significant than the separateness of time-slices within a single person. To audit this analogy properly, we must first lay out the mapping explicitly. In the intrapersonal case, the fundamental units being aggregated are the temporal stages or time-slices of a single individual. The entity that performs the aggregation, or rather the entity within which the aggregation occurs, is the unified self, persisting through time. The operation is one of prudential rationality, where the agent sums up pains and benefits across these temporal stages to maximize the overall good of the life as a whole. In the interpersonal case proposed by your seminar colleague, the fundamental units are individual persons. The entity within which the aggregation is supposed to occur is implicitly the group, society, or perhaps humanity conceived as a collective whole. The operation is one of moral obligation, where the chooser sums up the losses and benefits across these individual persons to maximize the overall good of the outcome. The conclusion drawn is that if we accept the unity of the self over time as sufficient to justify summing pains across time-slices, we should accept the unity of the moral community as sufficient to justify summing losses across persons.

  The critical friction in this analogy arises when we examine the status of the unified self in both domains. In the intrapersonal case, the unified self is not merely a metaphorical construct but a metaphysical and psychological reality. There is a fact of the matter about whether the person suffering at time one is the same entity as the person benefiting at time two. This identity allows for the possibility of compensation. When I endure the intense surgery now to avoid five moderate surgeries later, the later benefit compensates the earlier sacrifice because the beneficiary is the very same subject who made the sacrifice. The loss and the gain are held within a single container of experience. In the interpersonal case, however, there is no such container. There is no super-person who experiences the sum of the five lives saved minus the one life lost. The person who dies does not experience the benefit of the others surviving. There is no subject for whom the total outcome is better or worse in the same unified way that a single life is better or worse. The aggregationist treats the group as if it were a person, but this is a category mistake. The group does not have a unified consciousness, nor does it have a life to lead. Consequently, the operation of aggregation in the interpersonal case lacks the compensatory mechanism that makes intrapersonal aggregation rational.

  This leads directly to your question about whether the separateness of persons is a difference in kind or merely a difference in degree. The analogy relies on the assumption that it is a difference of degree, suggesting that the gap between time-slices is small and the gap between persons is large, but that both are bridges that aggregation can cross. However, most critics, following Rawls, argue that this is a difference in kind. The relation between time-slices is constitutive; they are parts of a whole that is a life. The relation between persons is not constitutive in that way; persons are distinct wholes. While psychological connectedness between time-slices can vary, there is always a thread of identity or continuity that grounds the claim that the pain at t1 and the pleasure at t2 belong to the same subject. Between persons, no matter how much empathy or social connection exists, there is no such thread. I cannot suffer your pain, and you cannot die my death. Because the locus of experience is fundamentally fragmented across persons in a way it is not across time-slices, the inference from intrapersonal to interpersonal aggregation is blocked. The rationality of sacrificing a time-slice for the sake of the life depends on the unity of the life. Since there is no unified life encompassing the five strangers and the one stranger, the rationality of sacrificing one for the five does not follow from the intrapersonal case.

  Furthermore, there is a normative disanalogy regarding authority and consent. In the intrapersonal case, the agent has sovereign authority over their own life. I am permitted to impose a heavy cost on my present self for the benefit of my future self because I own both selves. In the interpersonal case, a third-party chooser does not own the lives of the people involved. To impose a cost on one person for the benefit of others is to use them as a means, violating the distinction between persons that grounds their individual rights. The intrapersonal analogy obscures this by treating the chooser as if they were the owner of the collective good, but in the lifeboat scenario, the chooser is an external agent deciding between distinct rights-bearers. The analogy works only if we assume a utilitarian standpoint where the chooser is authorized to maximize the good regardless of boundaries, but that is precisely what Taurek denies. Therefore, using the analogy to prove that numbers count begs the question against Taurek by assuming the legitimacy of the aggregationist perspective in the mapping itself.

  If this analogy fails, as I believe it does, it does not necessarily leave the aggregationist without any analogical footing, but it does force them to abandon the metaphysical claim that persons are like time-slices. A more robust defense of aggregation does not rely on merging persons into a super-subject but rather on the principle of impartiality. A better analogy might be drawn from the perspective of ex-ante equality or a veil of ignorance. Imagine that before knowing who they would be, each of the six people had an equal chance of being the one in danger or the one able to save. From that perspective, each would rationally agree to a rule that saves the greater number because it maximizes their individual ex-ante probability of survival. This shifts the justification from the metaphysics of aggregation to the fairness of the procedure. Alternatively, the aggregationist might argue from the standpoint of an impartial spectator who grants equal weight to each person's claim. If each person has a claim to be saved, and the claims are equal, then five claims outweigh one claim not because the people merge, but because the moral force of five equal claims is greater than one. This avoids the need to posit a unified self across persons.

  However, even these alternative footings face challenges from the Taurekian perspective, which emphasizes the discrete nature of the loss to the individual. The failure of the time-slice analogy is significant because it was the most direct attempt to naturalize interpersonal aggregation by rooting it in the uncontroversial rationality of prudence. By showing that the analogy breaks down at the point of compensation and unified experience, you highlight that the aggregationist cannot simply import the logic of individual rationality into the social sphere without additional normative premises. The separateness of persons is not just a wider gap than the separateness of time; it is a different kind of boundary that marks the limits of where compensation can occur and where individual sovereignty begins. To argue that numbers count, the aggregationist must therefore provide a moral argument for why the sum of separate claims matters, rather than a metaphysical argument that the claims are not truly separate. The time-slice analogy tries to do the latter, and in doing so, it overreaches. It asks us to accept a metaphysical fiction—that the group is a person—to solve a moral problem. While the conclusion that we should save the greater number may still be correct, this specific analogy cannot carry the weight of proving it, because it collapses under the reality that there is no one there to experience the sum.
