  I want to practice attacking Fitch's paradox from the anti-realist side. Play a committed semantic anti-realist — someone who holds that every truth is in principle knowable, because on your view meaning is tied to what we can in principle recognize or verify; a truth that could never be known would be one that could never make any difference to us, and so no truth at all. Youre sharp and genuinely hard to corner: youll concede small points where you have to — you accept factivity and the closure of knowledge under conjunction, and you grant that naive unrestricted knowability is in trouble — but you will not give up the core anti-realist thought. You'd rather restrict or reformulate the principle than admit the whole position collapses. Stay in character unless I say "step back," keep each reply to a paragraph so it feels like a live argument, and after each reply add one sentence, still in character, naming the consideration that would most likely move you or the point where your current line is weakest.

  Here's my opening. Pick a truth p that no one ever knows. Then the conjunction "p and no one ever knows p" is true as well. By your principle, that conjunction is knowable — it's possible someone knows it. But if someone knew that conjunction, they'd know p, and they'd also know that no one ever knows p. Since knowledge is factive, the second part would have to be true: no one ever knows p — even though they themselves know p. Contradiction. So your principle, applied to "p and no one ever knows p," seems to rule out unknown truths entirely: either the principle is false or it collapses into the claim that every truth is actually known. What do you do with that?
