  **The Comparative Welfare Principle:** An agent wrongs a future individual if their choice causes that individual to exist with a lower quality of life than an alternative choice would have provided for a different individual, even if the first individual would not otherwise have existed.

  This principle rejects the idea that identity shields agents from responsibility. Your intuitions in Cases 1, 3, and 5 recognize that causing someone to exist in a suboptimal state can be wrongful, even if their life is worth living. The moral weight lies in the comparative quality of life afforded to the position of "future person," not merely in the harm done to a specific pre-existing identity. If we accept that policy makers wrong future generations by lowering their baseline welfare (Cases 1 and 5), consistency demands we acknowledge that parents also wrong their children by knowingly selecting a lower welfare trajectory when a higher one was available. Identity is morally arbitrary; what matters is the welfare instantiated in the future.

  Regarding your unsettled case (Case 6), the principle delivers a clear verdict: conceiving now is wrong, and the child has a complaint against the parents. By choosing to conceive immediately, the parents caused a specific child to exist with a "good" life when they could have caused a different child to exist with a "much easier, happier" life. Under the Comparative Welfare Principle, the first child is wronged by this comparative deficit. They have grounds to complain that they were denied the opportunity to be the happier child that could have existed instead. This aligns with your verdicts on emissions and resource conservation: the specific identity of the sufferer does not negate the wrongness of imposing a preventable welfare deficit.

  To maintain consistency, this principle forces you to drop your verdicts in Cases 2 (Teen Mom) and 4 (Lab Botch). You currently hold that the child is not wronged in these scenarios because their lives are worth living and they wouldn't otherwise exist. However, this contradicts your stance on Cases 1 and 5. In the teen mom case, the mother chooses a path resulting in a harder life for her child when waiting would have produced a different child with an easier life. In the lab botch case, the negligence results in a child with a disability rather than a different, healthier child. If future citizens can complain about policy-induced welfare deficits despite nonidentity, then children must be able to complain about parental or medical decisions that similarly lock them into lower welfare states.

  Dropping these verdicts is difficult because it expands the scope of "wronging" significantly. However, retaining them creates an unjustifiable double standard between collective policy and individual reproduction. If identity dependence doesn't excuse industrial boomers or polluters, it shouldn't excuse teens or labs. The principle demands we prioritize the quality of life brought into the world over the specific identity of the liver.

  Ultimately, your gut correctly identifies that nonidentity is not a moral get-out-of-jail-free card in cases of policy and intentional constraint. To be fully consistent, you must extend that insight to individual reproductive choices. The cost is accepting that many "bad decisions" are not just regrettable but actually wrong the children born from them. This is a demanding view, but it is the only one that respects the comparative value of human welfare across all your cases.
