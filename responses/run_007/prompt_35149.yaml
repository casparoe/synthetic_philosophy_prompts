answer: |-
  **Setting:** *A quiet corner of the university philosophy lounge. Late afternoon. Elias, a senior professor with a reputation for rigorous formalism, is stirring tea. Sarah, a younger but sharp metaphysician, sits opposite him with a stack of papers.*

  **Elias:** You look like you've been wrestling with the Sorites again, Sarah. I saw the pile of sand on your desk earlier. Literally, I hope?

  **Sarah:** (Laughs) Metaphorically. Though I did count out forty grains on a napkin. It's this Williamson paper you lent me. I appreciate the rigor, Elias, I do. But I still can't swallow the pill. You really want me to believe that there is a specific number *n* such that *n* grains make a heap, but *n-1* do not?

  **Elias:** I want you to believe that classical logic holds, that bivalence holds, and that our words mean what they mean. If you accept those, the sharp cutoff follows. It's not that I *like* the cutoff. It's that the alternatives seem to require amputating parts of logic I'm not willing to lose.

  **Sarah:** But look at the cost. You're positing a metaphysical miracle. One grain of sand. Removed from a pile. Suddenly, the predicate "is a heap" ceases to apply. That grain possesses some magical heap-constituting power?

  **Elias:** No magic. Just precision. Think of it like a geological fault line, since you appreciate the analogy. The stress builds up until it snaps. The snap is sharp, even if the pressure buildup was gradual. The extension of the word "heap" is fixed by our usage patterns, causal history, and environmental facts. Those facts are complex, incredibly complex, but they determine a boundary. We just can't *know* where it is.

  **Sarah:** That's the epistemic leap I can't make. You're saying the boundary exists but is unknowable in principle. Why? If the meaning is determined by use, and our use is fuzzy, why wouldn't the meaning be fuzzy?

  **Elias:** Because "fuzzy meaning" is a placeholder, not an explanation. When you say the meaning is fuzzy, you're saying there are cases where the sentence "This is a heap" is neither true nor false. You're introducing truth-value gaps. Now, be honest: isn't a truth-value gap weirder than a sharp cutoff?

  **Sarah:** Not necessarily. On supervaluationism, we don't just say "it's gappy" and leave it. We say a statement is *super-true* if it's true on all admissible precisifications. "This mountain is tall" might be gappy, but "This mountain is tall or not tall" is super-true. We save classical logic without positing a magic grain.

  **Elias:** You save the tautologies, yes. But what have you done to truth? You've severed the link between truth and the world. If I point to a borderline heap and say "That is a heap," and you say "That's neither true nor false," you're saying my utterance fails to describe reality. But reality doesn't care about our precisifications. The rocks are there. The grains are there. Why should the *truth* of my statement depend on a set of hypothetical sharpenings of my language that I never intended?

  **Sarah:** Because your language *is* underdetermined! That's the point. When we learned the word "heap," no one pointed to a borderline case and said, "This counts." Our linguistic training didn't fix the boundary. So, there isn't a fact of the matter to be ignorant *about*. You're treating vagueness as ignorance, Elias. I'm treating it as semantic indecision.

  **Elias:** Semantic indecision sounds polite, but it collapses under higher-order vagueness. Let's push there. You admit there are borderline cases. Call them the "penumbra." But isn't there also a borderline case of the penumbra? A case where it's unclear if it's unclear?

  **Sarah:** Exactly. Supervaluationism handles that beautifully. We just iterate the "definitely" operator. It's definitely a heap. It's borderline. It's borderline that it's borderline. The set of admissible precisifications shrinks as we go up the orders, but the gaps remain.

  **Elias:** Do they? If you have a gap between "definitely heap" and "borderline," you've just drawn a sharp line between the two. You've solved first-order vagueness by creating a sharp boundary at the second order.

  **Sarah:** I haven't drawn a line. I've just acknowledged that the set of precisifications doesn't sharply cut off. There's no sharp line between a precisification that counts as "admissible" and one that doesn't.

  **Elias:** Ah, but now you're regressing. If there's no sharp line between admissible and inadmissible precisifications, then your notion of "super-truth" is itself vague. And if super-truth is vague, your logic isn't classical anymore, is it? You're trying to have your cake and eat it too. You want the comfort of classical logic, but you want to apply it to a semantics that refuses to be precise about its own boundaries.

  **Sarah:** (Pauses, tapping her pen) That's a fair hit. The "problem of higher-order vagueness" is the thorn in my side. But look at your position. If you accept higher-order vagueness, you must accept that there is a sharp boundary between "knowable" and "unknowable." There is a specific grain where, if you removed it, we would shift from *knowing* it's a heap to *not knowing* it's a heap. That seems even more mystical than the heap boundary itself!

  **Elias:** It does seem odd. But Williamson has a defense there. It's the margin for error principle. To know something, your belief must not only be true, it must be safe. In borderline regions, your belief could easily be wrong because the boundary is so close. So, knowledge drops off before truth drops off. The boundary of knowledge is sharp, but it's located *before* the boundary of truth.

  **Sarah:** So you're saying we are ignorant of the cutoff, and also ignorant of where our ignorance begins?

  **Elias:** Precisely. It's ignorance all the way down. But it preserves the idea that the world + language = determinate facts.

  **Sarah:** But *why*? That's the question I keep coming back to. What drives this insistence on determinacy? Is it a metaphysical commitment? Or is it just a love of classical logic?

  **Elias:** It's a commitment to what language *is*. Look, Sarah, language is a social tool embedded in a physical world. The totality of facts about how we use words, our neural states, our environment—that totality is finite and determinate. If the supervenience base is determinate, the supervenient facts (meanings) must be determinate. To say otherwise is to say that meaning floats free of use.

  **Sarah:** I disagree. The supervenience base *isn't* determinate in the way you think. Our use of words includes dispositions. And dispositions can be indeterminate. If I ask a speaker, "Would you call 45 grains a heap?" they might hesitate, or say "It depends." That hesitation isn't hidden knowledge; it's a lack of fact. Meaning is constituted by our practices, and our practices leave the edges open.

  **Elias:** But if the edges are open, communication should fail at the edges. Yet, we communicate perfectly well about borderline cases. We agree they're borderline.

  **Sarah:** We agree because we share the same *range* of admissible precisifications, not because we share a hidden sharp boundary. Think of it like a cloud. Does a cloud have a sharp boundary?

  **Elias:** Physically, the density of water vapor drops off gradually. But at the molecular level, every molecule is either in the cluster or not.

  **Sarah:** But "cloud" isn't a molecular term. It's a macroscopic one. If you insist on a sharp boundary for "cloud," you're imposing a precision the concept doesn't need. Epistemicism feels like you're demanding a map have a resolution higher than the territory allows.

  **Elias:** No, I'm saying the territory *has* the resolution, you just can't see it. The map (our language) corresponds to the territory. If the map seems fuzzy, it's because we lack the data, not because the territory is fuzzy.

  **Sarah:** But the "territory" of meaning *is* us. It's our dispositions. If our dispositions are fuzzy, the territory is fuzzy. You're treating meanings like Platonic forms that exist independently of our ability to grasp them.

  **Elias:** I'm treating them as facts that supervene on us. Just because we can't locate the supervenience function doesn't mean it isn't there. Consider your geology background. A tectonic plate boundary. Is it a line?

  **Sarah:** It's a zone of deformation.

  **Elias:** Exactly. But if you had to model it for a stress equation, you'd need a vector. A specific line of force. If you say "the stress is neither applied nor not applied," your bridge falls down. Epistemicism is the engineering view of language. We need bivalence to make the inferences work. Supervaluationism is the artistic view. It captures the nuance but blurs the structural integrity.

  **Sarah:** (Smiles) I like that. Engineering vs. Art. But here's my worry. If you're right, then there is a sentence in English, right now, that is true, but which no human being can ever know is true, simply because it sits on the other side of a cutoff we can't detect. That makes truth radically detached from verification.

  **Elias:** And if *you're* right, then the Law of Excluded Middle fails for ordinary sentences. "This is a heap or this is not a heap" fails to be true in borderline cases. That detaches truth from logic. Which detachment is more damaging to philosophy?

  **Sarah:** I'd say detaching truth from logic is worse. That's why I stick with supervaluationism. It keeps the logic intact via super-truth.

  **Elias:** But at the cost of making "truth" a disquotational ghost. "It is super-true that p" doesn't mean p is the case in the world; it means p is the case in all *models* of the language. You've turned semantics into model theory.

  **Sarah:** And you've turned semantics into archaeology. Digging for a boundary that was never built.

  **Elias:** (Sips tea) Perhaps. But I'd rather dig for a boundary that exists than build a model where boundaries dissolve. It keeps the world solid.

  **Sarah:** And I'd rather build a model that reflects how we actually speak, hesitation and all. It keeps the language human.

  **Elias:** So, we're back to the start. Is the weirdness of the magic grain worse than the weirdness of the truth-value gap?

  **Sarah:** It seems the "real action" isn't in the logic. We both want to save classical logic, mostly. It's about the metaphysics of meaning. Do you think meaning is a discovery or a construction?

  **Elias:** Discovery. The facts of use fix the meaning. We discover the extension.

  **Sarah:** Construction. The practices of use create the meaning. And we didn't construct sharp edges.

  **Elias:** Then we agree on the practices. We just disagree on what those practices entail.

  **Sarah:** Precisely. And until we solve the hard problem of intentionality—how minds hook onto the world—I suspect we'll keep arguing about heaps.

  **Elias:** (Chuckles) Well, at least we can agree on this: If I add one grain to this pile, the probability of it collapsing increases.

  **Sarah:** Now *that* is a super-true statement.
