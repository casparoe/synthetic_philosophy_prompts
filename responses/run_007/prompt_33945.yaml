  (1) "What the answer gets right" — 120–180 words.
  (2) "Where it goes wrong" — about 200 words, point by point, naming the specific claims that are wrong or in tension with each other and why.
  (3) "Grade and justification" — a grade out of 20 and a short paragraph tying it to a rubric.
  (4) "Comments to put on the paper" — 100–150 words of actual margin comments i can paste.
