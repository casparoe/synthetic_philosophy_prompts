  This preserves the asymptotic consistency (b) if all signals are pooled to form a single highly competent judgment, but it reduces the majority's advantage (a) to equality with a fully informed individual voter due to induced unanimity.

  3. **A shared public signal**
  This preserves the finite advantage (a) but fails the asymptotic consistency (b) if the public signal's precision is high enough to systematically bias voter posteriors, making the limit depend on the signal rather than the aggregate private information.

  4. **Exchangeable common-cause correlation**
  This preserves the finite advantage (a) for reasonable parameters but definitively fails the asymptotic consistency (b) because pairwise correlation bounded away from zero prevents the variance of the vote share from vanishing as the electorate grows.
