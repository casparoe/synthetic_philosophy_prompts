prompt: |-
  My friend was telling me about this thing called the dogmatism paradox from his epistemology class, and I wanted to check if he's got it right. Here's what he said, roughly:

  "Okay so the dogmatism paradox. It starts from the idea that if you know some proposition p, then you also know that any evidence against p is misleading — because if p is true, evidence against it can't be good evidence. So if you know p, you're rationally permitted to dismiss any counterevidence without even examining it. Just throw it in the bin. But that's obviously dogmatic and irrational. So the paradox shows that fallibilism — the view that you can know things without absolute certainty — is self-undermining. Because fallibilism says you should always be open to new evidence, but the paradox proves that once you know something, you can't be. Kripke basically used this to argue that knowledge is impossible unless you're a Cartesian infallibilist, which nobody wants to be."

  Something about this feels off to me. I thought the paradox was more of a puzzle than a knockdown argument, and I vaguely remember that Kripke presented it without actually endorsing the skeptical conclusion? Also the jump from "this evidence is misleading" to "I can ignore it sight unseen" seems like it's doing a lot of work that maybe isn't justified. But I haven't read the original stuff. Can you go through his summary and tell me which parts a philosopher working on this would nod along with, which parts they'd push back on, and whether the overall picture he's giving is fair?
