  3.  **Address Question 1: Unfair to Functionalism?**
      *   *Functionalist View:* Functionalism cares about input-output relations and internal state transitions. If the colony maps inputs (Achille's speech/pheromones) to outputs (ant movements/pheromones) in a way that is isomorphic to a mind, it's a mind. The anteater is the *environment* providing input/receiving output.
