      *   *Refining Claim 2 (Framing):* "Representation is selection." To show X is to hide Y. This implies a stance. This is the "Impossibility of Neutrality" reading.
      *   *Refining Claim 3 (Institutional):* "The aesthetic is political." Bourdieu-ish. Standards of beauty are class/race-coded. This is the "Status Quo" reading.
      *   *Refining Claim 4 (Intentional):* "Artists mean to persuade." Many artists mean to explore or express, not persuade. This is weak.
      *   *Refining Claim 5 (Normative):* "Art ought to be propaganda." This is what Du Bois was arguing *for*, not necessarily describing the universe.
      *   *Refining Claim 6 (Reductionist):* "Art = Propaganda." This erases the distinction. This is the "Conversation Ender" reading.

  5.  **Aligning with Du Bois's Text ("Criteria of Negro Art"):**
      *   Du Bois acknowledges art *can* be pure (he mentions Keats, Baudelaire). He doesn't deny the existence of non-propaganda art historically.
      *   His point is contextual: For Black artists in 1926 America, art *must* be propaganda because the very humanity of Black people is under attack.
      *   He explicitly says: "I do not care a damn for any art that is not used for propaganda." But he also says, "I do not believe that all Art is propaganda." Wait, let me check the text.
      *   *Correction:* The quote is "Thus all Art is propaganda." But immediately before/after, he nuances it. He says, "I do not care a damn for any art that is not used for propaganda." But does he believe *all* art *is* propaganda ontologically?
      *   *Close Reading:* "Thus all Art is propaganda and ever must be..." He is making a universal claim *in that sentence*. However, the surrounding argument is about the *duty* of the Negro artist. He contrasts "Art for Art's sake" with "Propaganda." He argues the latter is necessary for his people.
      *   *Crucial Distinction:* Du Bois is making a *sociological* claim about the function of art in a racialized society, not necessarily a *metaphysical* claim about the essence of art. He is also reclaiming the word "propaganda."

