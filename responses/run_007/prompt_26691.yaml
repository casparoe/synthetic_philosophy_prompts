          *   Identify which readings are "bluffs" (sound deep but collapse).

  2.  **Deconstruct the Quote & Context:**
      *   **Source:** "Criteria of Negro Art" (1926).
      *   **Context:** Du Bois is speaking to the NAACP, addressing Black artists specifically. He is arguing *for* propaganda in a specific context (racial uplift), not necessarily defining the metaphysical essence of *all* art everywhere for all time.
      *   **The Quote:** "Thus all Art is propaganda and ever must be, despite the wailing of the purists. I stand in utter shamelessness and say that whatever art I have ever written has been propaganda for getting the right of being human to be true."
      *   **Key Nuance:** He distinguishes between *good* propaganda and *bad* propaganda. He doesn't say *only* propaganda is art, but that art *functions* as propaganda.

  3.  **Brainstorming the Distinct Claims (The "Unpacking"):**
      *   *Claim 1: The Causal/Effect Claim.* All art has effects on people's beliefs/behaviors. (Weak/Trivial).
      *   *Claim 2: The Framing/Neutrality Claim.* All art selects reality, thus implying a viewpoint. (Interesting/Defensible).
      *   *Claim 3: The Social/Institutional Claim.* Art worlds are embedded in power structures; "pure art" reinforces the status quo. (Interesting/Defensible).
      *   *Claim 4: The Intentional Claim.* All artists intend to persuade. (Probably False).
      *   *Claim 5: The Normative/Functional Claim.* Art *should* be propaganda (specifically for justice), and calling it that reclaims the term. (Du Bois's actual point).
      *   *Claim 6: The Reductionist Claim.* Aesthetic value *is* propaganda effectiveness. (Probably False/Reductive).

  4.  **Drafting the Analysis (Iterative Refinement):**

