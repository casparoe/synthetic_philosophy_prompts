answer: |-
  ### The Principle: Cognitive Custody

  The principle that unifies your firm verdicts is **The Principle of Cognitive Custody**.

  **The Rule:** You may outsource the *generation* of code or knowledge, but you may not outsource the *custody* of the logic you ship. You retain custody if you can explain **why** the code works, **how** it fails, and **what** it implies for the system, unless the code is encapsulated within a versioned, external dependency with its own maintenance lifecycle.

  This principle distinguishes between **Tools/Dependencies** (where custody is transferred to a maintainer community) and **Business Logic/Source** (where custody remains with you). It prioritizes **maintainability** and **accountability** over **productivity**.

  Here is how Cognitive Custody maps to your verdicts:

  1.  **Crypto Library (Fine):** This is an **External Dependency**. You do not own the internals; the library maintainers do. Your custody is limited to the *interface contract* (inputs/outputs), which is standardized.
  2.  **Boilerplate (Fine):** This is **Trivial Logic**. By reading it, you retain custody. The cognitive load to understand it is low enough that you immediately absorb ownership.
  3.  **AI Parser (Not Fine):** This is **Core Logic**. It lives in your source tree. If you cannot explain the control flow, you have surrendered custody. If it breaks, you cannot fix it; you can only replace it.
  4.  **Code Review (Not Fine):** This is **Reasoning**. Accepting a change without understanding the "why" means you do not understand the *invariants* the code protects. You have lost custody of the function's correctness.
  5.  **Framework Learning (Fine):** This is **Knowledge Transfer**. The constraint ("provided I can build something") ensures you have validated the mental model. You have gained custody of the knowledge, even if the path was unconventional.

  ---

  ### Resolution of the Ambivalent Case: The SQL Report

  **Verdict:** **Not Fine** (unless you can audit the logic).

  **Application of the Principle:**
  SQL queries for business reports are **Business Logic**, not Infrastructure. Unlike a cryptography library, there is no external maintainer responsible for the correctness of your specific joins and aggregations.
  *   **Intent vs. Mechanism:** You understand the *intent* (the question), but you do not understand the *mechanism* (the query).
  *   **The Risk:** If the data looks wrong, you cannot trace the error. If the query is inefficient, you cannot optimize it. If the LLM hallucinates a table relationship, you cannot detect it.
  *   **The Requirement:** To satisfy Cognitive Custody, you must be able to trace the data lineage. You do not need to write the SQL from memory, but you must be able to read the generated SQL and explain *why* it returns the correct numbers. If you cannot audit the query, you have shipped a "black box" inside your repository, which violates the principle.

  ---

  ### Evaluation of the New Case: Legacy Translation

  **Scenario:** Using an LLM to translate a legacy codebase into a new language, producing code that runs but that no one on the team can yet read.

  **Verdict:** **Not Fine** (for production).

  **Application of the Principle:**
  This is a violation of Cognitive Custody on a systemic level.
  *   **The "Yet" Problem:** If this code is a temporary migration artifact that humans *will* refactor and understand before shipping, it is acceptable tool use. However, if this code is shipped as-is, you have created **Knowledge Debt**.
  *   **Unreadable Source:** Code that "no one... can yet read" is functionally equivalent to a compiled binary in your source repository. It breaks the social contract of engineering: that source code is for humans to read and machines to execute.
  *   **Failure Mode:** When the translated code fails (due to language-specific concurrency issues, memory management, or edge cases), the team lacks the custody required to debug it. They are forced to treat their own source code as an external black box, which is unsustainable.

  ---

  ### Consistency Check: Do Any Verdicts Have to Go?

  **None of your firm verdicts need to be discarded.** The Principle of Cognitive Custody accommodates all of them, provided you maintain a strict boundary between **Dependency** and **Source**.

  However, there is one tension you must manage to keep your philosophy consistent:

  **The Tension:** *Crypto Library* vs. *AI Parser*.
  *   **The Conflict:** In both cases, you admit you do not understand the internals. Why is one fine and the other not?
  *   **The Resolution:** You must rigorously enforce the **Boundary of Accountability**.
      *   **Crypto:** If a vulnerability is found, you update the version. The accountability lies with the library author.
      *   **Parser:** If a bug is found, *you* fix it. The accountability lies with you.
  *   **The Warning:** If you start treating AI-generated code as a "dependency" (i.e., "I'll just ask the AI to fix it when it breaks"), you are eroding your own role as an engineer. The principle holds, but it requires you to be disciplined about what counts as a "library" versus what counts as "your code."

  **Summary:**
  Your intuition is sound. The dividing line is not "Did I write this?" but "Do I own the reasoning behind this?"
  *   **SQL:** Own the reasoning (audit the query).
  *   **Translation:** Own the code (ensure it is readable).
  *   **Crypto:** Own the integration (trust the community).

  Stick to **Cognitive Custody**. It protects you from becoming a "prompt assembler" rather than a software engineer.
