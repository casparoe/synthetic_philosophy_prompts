answer: |-
  **TO:** Steering Committee, Citizens' Assembly on Land-Use Reform
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Participant Eligibility and Deliberative Ground Rules

  As we finalize the ground rules for the upcoming land-use assembly, I want to offer a perspective on the proposal to exclude individuals with recent partisan electoral experience. This proposal rests on a serious philosophical concern, one that deserves our careful attention before we decide on eligibility criteria.

  **Engaging the Weilian Critique**
  The argument for exclusion draws rightly on Simone Weil's critique of political parties. In *On the Abolition of All Political Parties*, Weil argues that parties are structures of "collective passion" that inevitably subordinate truth and justice to the preservation of the group's power. Her concern is that party discipline replaces individual conscience with a pre-packaged line of reasoning. If we accept this premise, allowing party actors into the assembly risks importing the very adversarial dynamics we aim to transcend. In a contentious policy area like land-use reform, where NIMBYism often aligns with partisan incentives, the risk that participants will deliberate in bad faith is real. We must take seriously the possibility that party affiliation can act as a cognitive blindfold.

  **The Risk of Exclusion**
  However, while Weil's diagnosis of party dynamics is insightful, her prescription of exclusion poses a greater threat to the legitimacy of a citizens' assembly. Our legitimacy relies on descriptive representation—a microcosm of the public. Political engagement is not evenly distributed; those who run for office or hold party roles are often more civically engaged, more knowledgeable about policy mechanisms, and more demographically diverse (in terms of race and class) than the average citizen.

  Excluding them based on past activity creates a "purity test" that is arguably illiberal. It suggests that certain forms of civic participation disqualify one from future deliberation. Furthermore, it assumes that party affiliation is the sole driver of bias, ignoring other powerful influences like property ownership, developer ties, or ideological media consumption, which we do not screen for.

  **Recommendation**
  I recommend we adopt a two-part approach that addresses the *behavioral* risks Weil identifies without imposing *eligibility* bans:

  1.  **Eligibility:** Do not exclude participants based on past candidacy or party office. Maintain open eligibility to preserve the statistical representativeness of the sortition pool.
  2.  **Internal Conduct Rules:** Adopt a "Individual Capacity" pledge for all selected members. This pledge would explicitly state that participants are serving as private citizens, not delegates of any organization. Additionally, we must empower facilitators to intervene if they observe organized caucusing or bloc-voting behavior within small groups. We should ban pre-assembly coordination among participants regarding voting strategies.

  **Addressing the Strongest Objection**
  The strongest objection to this approach is that rules cannot undo internalized discipline. A critic might argue that a party loyalist does not need a whip to know their line; their bias is intrinsic, and they will influence others regardless of the rules.

  This is a valid concern, but it underestimates the design of the assembly itself. Unlike a legislature, our assembly isolates participants from external pressure, provides balanced expert testimony, and utilizes small-group deliberation designed to shift perspectives. Evidence from previous assemblies shows that when party actors are placed in a environment that rewards listening rather than winning, their behavior changes. We should trust the *process* to neutralize partisan discipline, rather than pruning the *people*. If we exclude engaged citizens, we risk creating an assembly that is demographically skewed and disconnected from the political realities that actually shape land-use policy.

  By keeping the door open but setting firm boundaries on conduct, we honor Weil's warning about collective pressure without compromising the democratic integrity of the assembly.

  I look forward to discussing this further at our next meeting.
