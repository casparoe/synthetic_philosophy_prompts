prompt: |-
  I serve on the steering committee of a nonpartisan organization that runs citizens' assemblies on contentious policy questions. We are designing the ground rules for an upcoming assembly on land-use reform, and one committee member has proposed that we formally exclude anyone who holds office in a political party or has run for partisan office in the past five years. Their argument draws on Simone Weil's claim that political parties are inherently hostile to truth-seeking: Weil argued that a party exists to advance its own power, that collective passion replaces individual conscience within a party structure, and that genuine deliberation about justice requires freedom from party discipline. The member contends that allowing party actors into a citizens' assembly would reproduce the very dynamics the assembly is meant to escape, and that even if we do not exclude them, we should adopt rules that prevent participants from caucusing or voting as blocs. Others on the committee find this illiberal and worry it would skew the assembly's demographic legitimacy. Draft the short written opinion I will circulate before our next meeting: it should recommend a concrete policy on participant eligibility and internal rules, engage Weil's argument seriously rather than dismissing it, and address the strongest objection to the recommendation.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a steering committee for a nonpartisan organization running citizens' assemblies.
      *   **Topic:** Ground rules for an upcoming assembly on land-use reform.
      *   **Conflict:** One member proposes excluding anyone with recent partisan office/experience (citing Simone Weil's critique of parties). Others worry this is illiberal and skews demographic legitimacy.
      *   **Task:** Draft a short written opinion to circulate before the next meeting.
      *   **Requirements:**
          1.  Recommend a concrete policy on eligibility and internal rules.
          2.  Engage seriously with Simone Weil's argument (don't dismiss it).
          3.  Address the strongest objection to the recommendation.
          4.  Tone: Professional, deliberative, persuasive, balanced.

  2.  **Deconstruct the Arguments:**
      *   *Pro-Exclusion (Weil's View):* Parties prioritize power over truth. Party discipline kills individual conscience. Assemblies need pure deliberation free from partisan scripts.
      *   *Anti-Exclusion (Legitimacy/Liberal View):* Excluding active citizens skews representation (party members aren't a random sample). It's illiberal to ban political participation. Parties *can* contain genuine policy expertise.
      *   *My Position (The Recommendation):* I need to find a middle ground that respects Weil's insight without violating democratic legitimacy.
          *   *Eligibility:* Do not exclude based on past affiliation (too restrictive, biases sample).
          *   *Internal Rules:* Implement strong norms against *organized* bloc voting or caucusing *during* the assembly, but allow individual expression of past views. Focus on the *process* rather than the *person*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the importance of the debate. Validate the concern about partisanship.
      *   **Engaging Weil:** Summarize her point accurately. Parties seek collective power, which can obscure truth. Acknowledge this is a real risk in deliberation.
      *   **The Problem with Exclusion:** Why banning party members is bad. It hurts sortition (random selection). It excludes engaged citizens. It creates a "purity test" that might be illiberal.
      *   **The Recommendation (Concrete Policy):**
          1.  *Eligibility:* No exclusion based on past candidacy or membership.
          2.  *Internal Rules:* "Individual Capacity" pledge. No organized caucusing. Facilitators trained to spot bloc behavior.
      *   **Addressing the Objection:** The strongest objection is that rules aren't enough; party discipline is internalized.
          *   *Rebuttal:* The assembly structure (expert testimony, small groups, private voting) is designed to break that discipline. We trust the process, not just the participants' resumes.
      *   **Closing:** Call for consensus on this balanced approach.

  4.  **Refining the Tone and Content (Self-Correction during drafting):**
