prompt: |-
  hey, i'm a high school student and my philosophy club is doing a session on just war theory, specifically the moral equality of combatants. could you write a dialogue for us? like, between two people who disagree about whether soldiers on both sides of a war have the same moral right to kill each other. one person should defend the traditional view that the rules of war apply equally to both sides, so a soldier fighting for an unjust cause isn't personally guilty just for fighting, as long as he follows the rules of war. the other person should defend the revisionist view that you can't have a right to kill for an unjust cause, so the soldiers on the wrong side are doing something wrong even if they fight clean. i want both characters to be smart and to actualy respond to each other's strongest points, not just talk past each other or strawman each other. have them get into the hard stuff: the soldier on the unjust side who has no way of knowing his side is unjust, the conscript who'd be punished for refusing, and whether the whole system of war law would collapse if we gave up moral equality. also maybe have them argue about whether the equal rights are a real moral permission or just a pragmatic convention, and whether a convention can create a permission to kill that wouldn't exist outside it. please don't make one side obviously win. and no headings, bullet points, bold, or tables — just continuous prose, like an email or a letter.
