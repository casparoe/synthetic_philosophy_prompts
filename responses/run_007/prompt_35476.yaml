answer: |-
  Dear friend, it was great to hear about your philosophy club's upcoming session. Just war theory is one of those topics that seems straightforward until you really dig into the contradictions, and the moral equality of combatants is probably the sharpest edge of the whole field. You asked for a dialogue that captures the tension between the traditional view and the revisionist critique without letting one side easily win, so I drafted a conversation between two students, Marcus and Elena. I wrote this as continuous prose so you can read it aloud or hand it out without worrying about formatting issues. I hope it sparks some lively debate in your group.

  The coffee shop was quiet enough that Marcus and Elena could talk over their notes without shouting, though the tension between their positions was palpable. Marcus leaned back in his chair, stirring his drink as he laid out the traditional case. He argued that once a war has started, the soldiers on both sides stand on equal moral ground regarding how they fight. He said that if we accept the traditional view, often associated with Michael Walzer, we have to accept that a soldier fighting for an unjust cause is not a murderer simply for engaging the enemy, provided they follow the rules of war. He insisted that soldiers are instruments of the state, not independent moral agents capable of judging the grand strategy of their leaders. To demand otherwise, Marcus suggested, is to demand something humanly impossible. He pointed out that most soldiers do not have access to the intelligence or the diplomatic context required to know if their war is truly just. If a soldier is told by their government that a conflict is defensive, and they have no reason to doubt it, they cannot be held morally responsible for the underlying injustice.

  Elena shook her head, leaning forward with her elbows on the table. She代表 the revisionist view, drawing on the work of philosophers like Jeff McMahan. She argued that the traditional view separates the justice of the war from the actions of the soldier in a way that doesn't make sense. She said that killing is only permissible in war for the same reasons it is permissible outside of war, primarily self-defense or the defense of others. If a soldier is fighting for an unjust cause, say an aggressive war of conquest, they are essentially attacking people who have done nothing to deserve being attacked. Elena argued that you cannot have a right to kill someone who has not forfeited their right to life. She acknowledged that the soldier might be confused or misled, but she insisted that a mistake does not change the moral reality for the victim. If an innocent person is shot by a soldier who mistakenly believes they are an enemy combatant, the shooter has still done something wrong, even if they are not fully blameworthy for the mistake.

  Marcus countered this by bringing up the issue of coercion and conscription. He asked Elena to consider the soldier who is drafted under threat of imprisonment or execution if they refuse to serve. He argued that if we say these soldiers are acting wrongly by fighting, we are condemning people who have no real choice. He suggested that the traditional view offers a kind of moral protection for these individuals. It says that as long as they fight within the rules, they are not guilty of a moral crime. This distinction matters, Marcus said, because it separates the question of whether the act is permissible from whether the person is blameworthy. He argued that the revisionist view conflates the two. Elena responded by agreeing that the conscript might not be blameworthy. She said that we can say a person is acting objectively wrongly without necessarily blaming them for it. If someone holds a gun to your head and tells you to steal a wallet, you are still stealing, even if we don't punish you for it. She argued that maintaining this distinction is crucial because it preserves the truth about the victim's rights. The victim of an unjust war deserves to be defended, and calling the attacker a legitimate combatant undermines that right.

  The conversation shifted to the practical consequences of adopting one view over the other. Marcus argued that the moral equality of combatants is a vital convention that prevents wars from becoming total extermination campaigns. He said that if soldiers believe they are fighting on behalf of justice while the enemy is fighting for evil, they will feel justified in breaking the rules. They will treat the enemy as criminals rather than peers. He claimed that the traditional view creates a shared moral language where both sides agree to limit violence. If we abandon this, Marcus warned, the side that believes it is just will feel entitled to use any means necessary to defeat the unjust aggressor. He asked whether it is worth sacrificing the lives of future soldiers to maintain a philosophical truth that might make warfare more brutal. He suggested that the convention itself creates a moral permission that did not exist before. By agreeing to the rules of war, soldiers enter a special sphere where killing is permitted by mutual consent, regardless of the underlying cause.

  Elena challenged the idea that a convention could create a moral permission to kill. She asked how an agreement between two groups could override the basic right to life of the individuals involved. She argued that you cannot sign a contract that gives you the right to murder someone who hasn't threatened you. If the convention is based on a lie, then stabilizing warfare through that lie is morally suspect. She acknowledged Marcus's point about the risks but argued that we cannot build morality on a foundation we know to be false. She suggested that instead of lowering our standards to make war safer, we should work to make war less likely or to ensure that only just wars are fought. She also pointed out that soldiers today have more access to information than in the past. With the internet and independent journalism, the claim of ignorance is harder to sustain. She argued that holding soldiers to a higher standard might actually encourage them to question unjust orders, potentially preventing unjust wars from happening in the first place.

  Marcus pushed back on the idea of the soldier as a moral critic of state policy. He said that expecting every soldier to evaluate the justice of their war undermines the democratic process. In a democracy, the citizens collectively decide on war through their representatives, and the soldiers execute that decision. If soldiers start picking and choosing which wars to fight based on their personal moral assessment, it could lead to fragmentation and insubordination. He argued that the moral equality of combatants respects the separation between the political leadership and the military instrument. Elena replied that democracy does not absolve individuals of responsibility for violent acts. She said that following orders is not a get-out-of-jail-free card in domestic law for serious crimes, so it should not be one in war either. She argued that the revisionist view does not require every soldier to be a philosopher, but it does require them to acknowledge that if their cause is clearly unjust, they are participating in a collective crime. She suggested that the fear of insubordination is overstated and that moral clarity could actually strengthen military discipline by aligning it with justice.

  They sat in silence for a moment, considering the stalemate. Marcus returned to the idea of the convention as a pragmatic necessity. He said that even if the revisionists are theoretically correct, the traditional view functions as a necessary fiction. He compared it to a rule in a game that everyone agrees to follow so the game can be played safely. He asked if the value of saving lives in the current conflict outweighs the abstract moral consistency demanded by the revisionists. He wondered if a convention can create a kind of collective permission, where the mutual risk taken by soldiers creates a new moral context that overrides the initial injustice. Elena remained skeptical. She said that some things are not up for convention. She argued that if the traditional view protects soldiers at the cost of denying the victim's right to life, then the protection is bought too cheaply. She concluded that while she understands the pragmatic appeal of the traditional view, she cannot accept that it changes the fundamental moral reality of killing.

  Marcus nodded, acknowledging that he could not prove her wrong on the fundamental moral point, only on the practical consequences. He said that perhaps the best we can hope for is a tension between the two views. He suggested that the traditional view should govern the laws of war and how we treat prisoners, to ensure stability, while the revisionist view should govern how we judge the leaders who start the wars and how we educate soldiers about their responsibility. Elena agreed that there might be a place for both, but she insisted that the moral truth must not be suppressed. She said that we should not tell soldiers they are moral equals when they are not, because that disrespects the people they are killing. They finished their drinks without resolving the debate, both aware that the question of whether a uniform grants a moral shield is something they would continue to wrestle with long after the club meeting ended. The conversation left them with the understanding that the moral equality of combatants is not just a legal technicality, but a profound question about the relationship between the individual, the state, and the value of human life.
