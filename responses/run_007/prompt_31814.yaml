answer: |-
  ### I. Candidate Reconstructions of the Implicit Theory

  To understand the moral architecture of carbon and biodiversity offsetting, we must isolate the normative commitments required to make the practice intelligible. I propose three candidate reconstructions of the implicit theory of value and obligation presupposed by offsetting markets.

  **Candidate 1: Pure Aggregative Consequentialism**
  On this view, the moral value of an action is determined solely by its contribution to a global state of affairs (e.g., atmospheric carbon concentration or total biodiversity acreage). The identity of the agent and the specific location of the harm are morally irrelevant. A ton of CO2 emitted in London is identical in moral weight to a ton emitted in Shanghai, provided the global total remains constant.
  *   *Implication:* Moral obligations are strictly impersonal. The "separateness of persons" is dissolved; victims of climate change are treated as a collective reservoir of welfare rather than rights-holders against specific polluters.

  **Candidate 2: The Entitlement (Coasean) Theory**
  This view presupposes that the atmosphere or ecological capacity is a common property resource allocated via a regulatory cap. Firms hold a defeasible entitlement to emit up to a limit. Offsetting is not "canceling a wrong" but rather "trading a license." The moral work is done by the procedural legitimacy of the market and the regulatory cap, not by the intrinsic nature of the emission.
  *   *Implication:* Harm is defined legally rather than morally. If you hold the credit, you have a right to emit. The obligation is to hold the credit, not to avoid the physical act of emission.

  **Candidate 3: Compensatory Justice (Restorative Model)**
  This view treats emission or destruction as a *prima facie* wrong against specific victims (future generations, local communities, non-human life). Offsets are not licenses but reparations. The firm incurs a debt by emitting and discharges that debt by funding a benefit elsewhere that compensates the victims (or the planet as a proxy).
  *   *Implication:* This preserves a notion of wrongdoing but assumes harms and benefits are commensurable enough to allow restitution across different categories (e.g., money for trees, trees for smoke).

  ### II. The Most Defensible Reconstruction: Fungible Aggregativism

  While firms often use the language of Candidate 3 (speaking of "responsibility" and "restoration"), the structural logic of the practice is best reconstructed as **Fungible Aggregativism within a Property Framework** (a hybrid of Candidates 1 and 2).

  **Argument for this Reconstruction:**
  1.  **Spatial and Temporal Fungibility:** The practice strictly presupposes that a harm here can be canceled by a benefit there, even if the beneficiaries are entirely different persons. If I flood a village in Brazil to build a dam, I cannot morally cancel that specific wrong by planting trees in Indonesia *unless* the moral value lies in the aggregate sum of "flooded villages vs. trees," not in the specific rights of the Brazilian villagers. Therefore, the practice presupposes that the *location* and *recipient* of the harm are secondary to the *global total*.
  2.  **Commensurability:** The practice requires a common metric (tons of CO2e, biodiversity units). This presupposes that distinct kinds of value (industrial utility, atmospheric stability, local ecosystem services) can be reduced to a single quantitative denominator.
  3.  **The Separateness of Persons:** The practice violates the Rawlsian constraint on the separateness of persons. It treats the sacrifices of those harmed by emissions (e.g., island nations facing sea-level rise) as interchangeable with the benefits gained by those receiving the offsets (e.g., a community receiving cookstoves). It sums utilities across distinct moral agents, which is the hallmark of classical utilitarianism.
  4.  **Strict Presupposition vs. Fit:** A deontologist *could* fit this practice into their system only by redefining the duty. Instead of "Do not emit," the duty becomes "Ensure net emissions are zero." However, this is a strained reading. The practice *strictly presupposes* a consequentialist structure because it permits the *act* of harming (emitting/destroying) provided the *outcome* (net total) is neutralized. A strict deontologist with agent-relative constraints (e.g., "I must not destroy wetlands") could not coherently endorse offsetting as a license to proceed.

  **Conclusion on Theory:** The practice operates as if the atmosphere is a global sink with a capacity limit, and moral obligation is satisfied by maintaining the level of the sink, regardless of who pours into it or who cleans it. It treats environmental harm as a *statistical aggregate* rather than a *rights violation*.

  ### III. Philosophical Underdetermination in the Practice

  While the aggregative structure is clear, the practice is philosophically underdetermined in several critical areas where rival theories could license the same market mechanisms but for different reasons.

  1.  **The Counterfactual Problem (Additionality):**
      *   *Underdetermination:* Does the offset project need to be *caused* by the payment, or merely *correlated*?
      *   *Rival Theories:* A **Causal Theory** requires that the offset would not have happened without the payment (strict additionality). A **Subsidiary Theory** allows funding projects that would have happened anyway, viewing the payment as a tax for the right to use the commons. The current practice often blurs this, allowing "hot air" credits where the moral cancellation is illusory.
  2.  **Permanence and Time:**
      *   *Underdetermination:* Is a ton of carbon stored for 10 years equivalent to a ton never emitted?
      *   *Rival Theories:* A **Stock Theory** views the atmosphere as a bathtub; temporary storage is insufficient if the water eventually flows back in. A **Flow Theory** focuses on annual rates. Offsetting treats temporary storage (trees that might burn) as equivalent to permanent avoidance (fossil fuels left in the ground), presupposing a discount rate on future harm that is philosophically contentious.
  3.  **Equivalence of Kind:**
      *   *Underdetermination:* Is a wetland in the UK truly equivalent to one in the Philippines?
      *   *Rival Theories:* **Homogeneous Value Theory** says yes (a hectare is a hectare). **Contextual Value Theory** says no (value depends on local biodiversity, cultural significance, and ecosystem function). The practice presupposes homogeneity to facilitate trade, but ecology presupposes contextuality.

  ### IV. The Tension: Fungible Environmental Harms vs. Non-Fungible Rights

  The central philosophical tension arises when we compare offsetting to other corporate obligations. A firm cannot purchase "safety offsets" (e.g., "We will fund a hospital elsewhere to compensate for violating safety laws here") nor "fraud offsets."

  **Why the Discrepancy?**
  1.  **Rights vs. Harms:** Safety laws and fraud prohibitions are typically grounded in **agent-relative constraints** and **individual rights**. Violating safety protocols is a direct violation of a specific employee's right to bodily integrity. Climate change and biodiversity loss, conversely, are often treated in policy as **threshold harms** or **collective action problems**. No single ton of CO2 kills a specific person; it contributes to a statistical risk.
  2.  **Identifiable vs. Statistical Victims:** In safety violations, the victim is identified and the causality is direct. In carbon offsetting, the victims are diffuse, future, and statistical. Moral intuition (and law) is far more willing to allow trade-offs involving statistical lives than identified lives.
  3.  **The "Drop in the Bucket" Problem:** Because a single emission does not causally necessitate a specific harm (due to non-linearity and thresholds), the act is viewed as *malum prohibitum* (wrong because regulated) rather than *malum in se* (wrong in itself). Safety violations are often treated as *malum in se*.

  **Is the Practice Coherent?**
  The practice is **conditionally coherent**. It is coherent *if and only if* one accepts that environmental damage is purely aggregative and does not violate specific rights to a stable climate or local ecosystem.
  However, if climate change is understood as violating human rights (e.g., the right to life, health, or property of specific communities), the practice becomes **incoherent**. You cannot trade away a right. If a firm's emissions contribute to drowning a specific island nation, funding a forest elsewhere does not restore that nation's right to exist. The current practice quietly combines two incompatible theories:
  1.  **For Safety/Fraud:** A Deontological/Rights-Based Theory (constraints cannot be traded).
  2.  **For Carbon/Biodiversity:** A Utilitarian/Aggregative Theory (harms can be summed and canceled).

  ### V. Shifting to a Constraint-Based View

  If we replaced the implicit aggregative view with one on which certain environmental harms are **constraints that may not be traded away** (a deontological shift), the practice would require radical alteration:

  1.  **Offsets as Reparation, Not License:** Offsets could no longer be purchased *ex ante* to permit emission. They could only function as *ex post* reparations for unavoidable harm, acknowledging that the moral debt remains even if compensated.
  2.  **Strict Reduction Mandates:** The primary obligation would shift from "Net Zero" to "Gross Zero" for the specific agent. You must stop *your* harm; funding others to stop *their* harm is supererogatory, not a substitute.
  3.  **Prohibition of Spatial Fungibility:** If the harm is a violation of the local commons, you cannot repair it globally. You must restore the specific ecosystem damaged or compensate the specific victims affected.
  4.  **Incommensurability:** We would have to admit that some losses (extinction of a species, loss of a homeland) cannot be "canceled" by a equivalent gain elsewhere. This would likely render many offset markets impossible, as true equivalence would be rarely established.

  ### VI. Conclusion

  The practice of carbon and biodiversity offsetting presupposes a **Fungible Aggregativism** that treats the biosphere as a balance sheet where debits and credits are interchangeable regardless of agent, location, or time. It relies on the dissolution of the separateness of persons, treating victims of pollution and beneficiaries of conservation as interchangeable units in a global calculus.

  The practice is philosophically underdetermined regarding counterfactuals and permanence, allowing firms to exploit epistemic gaps. Most critically, it stands in tension with the non-fungible treatment of other corporate harms (safety, fraud). This tension reveals that offsetting is only coherent if we accept that environmental harm is a collective statistical issue rather than a violation of individual rights. If we move toward a rights-based or constraint-based environmental ethics, the "net zero" via offsets model collapses, requiring a shift toward gross reduction and specific restitution. The current coherence of the practice depends on maintaining the ambiguity between "managing a global total" and "violating specific rights."
