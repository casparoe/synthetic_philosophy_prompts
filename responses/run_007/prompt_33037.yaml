prompt: |-
  Okay so I'm a high school junior and I've been reading about this thing called Bayesian confirmation theory for a science fair project on how we know when evidence actually supports a theory. I ran into this argument that's been bugging me for like two weeks and I can't figure out where the reasoning goes wrong. I'd love if you could act as an expert philosopher of science and really walk through this carefully — maybe start by laying out the argument in your own words to make sure we're on the same page, then go step by step and diagnose it.

  Here's the argument as I understand it:

  (1) In Bayesian terms, evidence E confirms hypothesis H when learning E makes H more probable than it was before — so P(H|E) > P(H).

  (2) Bayes' theorem says P(H|E) = P(E|H) × P(H) / P(E).

  (3) So for P(H|E) to be bigger than P(H), we need P(E|H) / P(E) > 1, which means P(E|H) > P(E). That's basically the condition for confirmation.

  (4) Now, if E is something we already knew before we ever came up with H — what philosophers call "old evidence" — then at the time we're evaluating the theory, P(E) is already 1. We're certain of it.

  (5) If P(E) = 1, then P(E|H) can't be any bigger than 1 either (probabilities max out at 1), so P(E|H) > P(E) is impossible. So old evidence can never confirm a theory.

  (6) But that's obviously false. The classic example is the perihelion precession of Mercury: astronomers knew about that weird orbit for decades before Einstein, and when general relativity came along and predicted it exactly, that was huge confirmation for the theory — everyone treats it as one of the main reasons to believe GR. Same with Darwin using known fossil distributions; he didn't discover new fossils, he used ones people already knew about to support natural selection.

  (7) So either Bayesian confirmation theory is broken, or one of the steps above has a hidden mistake.

  My gut says step (4) or (5) is where the trouble starts — something about P(E) = 1 being the wrong way to represent old evidence. I've seen people suggest we should pretend the scientist "forgets" the evidence temporarily and then checks if the theory predicts it, but that seems like a total cheat. Other people say the problem is really in step (1), that we need a different definition of confirmation entirely. There's also this idea that we should replace P(E) with something like the probability E would have had if we didn't know it, but I don't get how that's not just making up numbers.

  Can you tell me which step you think fails, and why? And also — what does your preferred fix say about a case where a theory gets proposed, makes a bunch of new predictions that all come true, but also fits a ton of old evidence that was known for centuries? Is the old evidence doing any confirmational work there, or is it all coming from the new predictions? I feel like the old evidence is doing *something*, but I don't know how to say what in Bayesian terms.

  Also please answer in American English — I'm in the US and some of the philosophy stuff I've read uses British spellings and it throws me off.
