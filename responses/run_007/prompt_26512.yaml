prompt: |-
  I'm a philosophy PhD student and I'm giving a talk in three weeks at the applied ethics workshop — it's a mixed crowd, mostly people working in bioethics and population ethics, but there's a handful of decision theorists who show up regularly and they're sharp. I've been losing sleep over this because my advisor is on sabatical and I can't run my slides by her beforehand. My talk is defending a particular version of the procreation asymmetry: the claim that while there's no moral reason to bring a happy person into existence, there is a strong moral reason not to bring a miserable person into existence. I'm arguing that this asymmetry isn't just a brute intuition but can be grounded in a more general principle about the scope of moral reasons — specifically, that reasons to benefit are person-affecting in a way that reasons not to harm are not. I know the standard objections (the non-identity problem, Parfit's repugnant-conclusion-adjacent worries, the question of whether the asymmetry even survives formalization), but I've presented versions of this before to philosophy audiences and what I really need is to be ready for *this* audience. The bioethicists are going to care about whether the asymmetry has implications for reproductive choices and disability ethics; the decision theorists are going to want to see it formalized and will push on whether my person-affecting restriction can be stated without collapsing into inconsistency. And there's one senior faculty member who wrote a paper arguing that the asymmetry is just a confabulation from scope insensitivity — he's definitely going to be there.

  Can you draft me a Q&A prep sheet? I want the objections ordered by roughly how likely they are to come up and how much damage they'd do, phrased in the way this specific crowd would phrase them. For each one, give me a two-minute reply and a note on where the reply is weakest — what I should concede, what I should hold. And please include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD student.
      *   **Event:** Applied Ethics Workshop (3 weeks away).
      *   **Audience:** Mixed. Mostly bioethicists/population ethicists, some sharp decision theorists, one specific senior faculty member (critic of asymmetry/scope insensitivity).
      *   **Topic:** Defending the Procreation Asymmetry (No reason to create happy people, strong reason not to create miserable people).
      *   **Core Argument:** Asymmetry grounded in a general principle about the scope of moral reasons (benefits are person-affecting, harms are not).
      *   **Stressors:** Advisor on sabbatical (no safety net), losing sleep, high stakes (workshop talk can make or break reputation/job market prospects).
      *   **Needs:** Q&A prep sheet. Ordered by likelihood/damage. Phrased in audience-specific language. Two-minute replies. Weakness analysis (concede vs. hold). Include the "nightmare question."

  2.  **Deconstruct the Argument & Audience:**
      *   *The Argument:* Person-affecting restriction (PAR) applied differently to benefits vs. harms.
      *   *Bioethicists:* Care about practical implications (PGD, abortion, disability, resource allocation). They worry about "expressivist" objections or harming existing disabled people by implying their lives aren't worth living.
      *   *Decision Theorists:* Care about formalization, consistency, expected utility, axioms. They will attack the coherence of "reasons without subjects."
      *   *Senior Faculty (The Scope Insensitivity Critic):* Thinks the asymmetry is a cognitive bias, not a moral truth. Will attack the intuitive foundation.
      *   *Standard Objections:* Non-Identity Problem (NIP), Repugnant Conclusion (RC), Mere Addition Paradox.

  3.  **Drafting the Questions (Ordering by Likelihood/Damage):**

      *   *High Likelihood/High Damage:* The Decision Theorist's consistency challenge. If the logic doesn't hold, the whole talk fails.
      *   *High Likelihood/Medium Damage:* The Bioethics/Disability objection. This is an applied ethics workshop; they *will* ask about implications.
      *   *Medium Likelihood/High Damage:* The Senior Faculty's "Scope Insensitivity" attack. This targets the *motivation* for the view.
      *   *Medium Likelihood/Medium Damage:* Non-Identity Problem. Standard fare, but needs specific handling given the "person-affecting" angle.
      *   *The Nightmare Question:* Something that collapses the distinction between "harm" and "benefit" in the context of existence.

  4.  **Developing the Replies (Constraint: ~2 minutes spoken):**
      *   Need to be concise, philosophical, but conversational.
      *   Need to acknowledge the strength of the objection (steel-manning).
      *   Need to pivot back to the core thesis (Scope of Reasons).

  5.  **Refining the Content (Iterative Process):**

      *   *Objection 1 (Decision Theory):* "How do you formalize a reason without a subject?"
          *   *Reply:* Distinguish between *reasons for an agent* and *reasons grounded in a subject's welfare.* Harm creates a complaint; benefit doesn't create a debt.
          *   *Weakness:* Might look ad hoc. *Concession:* Admit it requires a specific axiology. *Hold:* It's not inconsistent, just non-standard.

      *   *Objection 2 (Bioethics/Disability):* "Does this imply disabled lives aren't worth living?"
          *   *Reply:* Distinguish "miserable" (not worth living) from "disabled" (worth living but with challenges). The asymmetry applies to the threshold of a life worth starting.
          *   *Weakness:* The line is fuzzy. *Concession:* Admit the threshold is hard to define. *Hold:* The moral distinction remains valid even if the line is blurry.

      *   *Objection 3 (Senior Faculty/Scope Insensitivity):* "This is just cognitive bias."
          *   *Reply:* Bias explains *belief*, not *truth*. Even if biased, the principle solves paradoxes (RC) better than total utilitarianism.
          *   *Weakness:* Hard to prove it's not *just* bias. *Concession:* We are prone to bias. *Hold:* The theoretical utility justifies the intuition.

      *   *Objection 4 (Non-Identity):* "If the child wouldn't exist otherwise, how are they harmed?"
          *   *Reply:* My view accepts "harm" in a comparative sense is tricky, but the *reason* not to create suffering doesn't depend on making a specific existing person worse off. It's an impersonal reason regarding suffering states.
          *   *Weakness:* Conflicts with standard person-affecting views. *Hold:* That's the point of my modification.

      *   *The Nightmare Question:* "If benefits don't count for potential people, why do harms count? Isn't 'existence' the benefit required to suffer the harm?" (The Symmetry Attack).
          *   *Reply:* Suffering is intrinsically bad regardless of consent; happiness is not intrinsically good enough to mandate creation.
          *   *Weakness:* Very hard to defend without begging the question.

  6.  **Review against Constraints:**
      *   Tone: Professional, supportive, academically rigorous.
      *   Format: Q&A Prep Sheet.
      *   Specifics: Mention the advisor situation implicitly (boost confidence), address the specific audience types.
      *   Time: Ensure replies are readable in 2 mins (approx. 250-300 words).

  7.  **Final Polish:**
      *   Make sure the "Weakness/Concede/Hold" section is actionable.
      *   Ensure the "Nightmare Question" is truly scary but answerable.
      *   Add a brief encouraging intro/outro to manage the user's anxiety. (Self-correction: Keep it focused on the task, but a little empathy helps).

  8.  *(Self-Correction during drafting)*: Wait, the user said their argument is that *reasons to benefit are person-affecting* but *reasons not to harm are not*. This is a specific hybrid view. I need to make sure the Decision Theory question targets *that* specific asymmetry in formalization. The bioethicists will worry about the "miserable" threshold. The Senior Faculty will attack the intuition itself.

      *   *Refining the Decision Theory Objection:* It's about the "State-Dependence" of utility functions. If utility is undefined for non-existence, how can harm be defined?
      *   *Refining the Bioethics Objection:* Focus on the "Expressivist Objection."
      *   *Refining the Senior Faculty Objection:* Focus on "Evolutionary Debunking."

      *   *Nightmare Question:* Needs to be the one that forces a dilemma between the two halves of the asymmetry. "If a life is barely worth living, do you have a reason to create it? If no, why not? If yes, asymmetry breaks."

      *   *Let's finalize the Nightmare Question:* Actually, the strongest attack on *this specific formulation* (benefits person-affecting, harms not) is: "If reasons not to harm are impersonal, why aren't reasons to benefit impersonal? What breaks the symmetry other than intuition?" I'll use that.

  9.  **Finalizing the Output Structure:**
      *   Intro (Validation & Strategy).
      *   The Prep Sheet (5 Questions).
      *   The Nightmare Question.
      *   Closing Advice.

      *(Self-Correction on Word Count)*: Keep the replies tight. A 2-minute reply is roughly 250-300 words spoken at a moderate pace. I will draft them to that length.

      *(Check on Senior Faculty)*: Make sure to address the "scope insensitivity" claim specifically.

      *(Check on Decision Theorists)*: Use terms like "axiological framework," "domain of the utility function," "comparability."

      *(Check on Bioethicists)*: Use terms like "expressivist objection," "threshold," "social model of disability."

      *Ready to write.*
answer: |-
  This is a high-stakes talk, but you know the literature better than anyone in the room. The anxiety you're feeling is normal; it means you care about the precision of the argument. Since your advisor isn't available, treat this prep sheet as your proxy committee.

  The strategy here is **triage**. You cannot defend every inch of the view perfectly. You need to identify where you can concede ground without collapsing the theory, and where you must dig in. The decision theorists will test your *consistency*; the bioethicists will test your *implications*; the senior faculty will test your *foundations*.

  Here is your Q&A Prep Sheet, ordered by likelihood and potential damage.

  ***

  ### Q&A Prep Sheet: The Procreation Asymmetry & Scope of Reasons

  #### 1. The Decision Theorist's Consistency Challenge
  **Likelihood:** Very High | **Damage Potential:** High
  **Phrasing:** "You're claiming reasons to benefit are person-affecting, but reasons not to harm are impersonal. In formal decision theory, we usually require a unified axiological framework. If the utility function is undefined for non-existent subjects (as person-affecting views usually hold), how do you assign a negative value to 'harming' them by bringing them into existence without also assigning a positive value to 'benefiting' them? Aren't you just stipulating an asymmetry to avoid the Repugnant Conclusion?"

  **2-Minute Reply:**
  "That's the crux of the proposal. I'm not arguing for a unified utility function across existence and non-existence. I'm arguing for a deontic asymmetry grounded in the *nature* of the states involved. Suffering is intrinsically bad in a way that demands avoidance, even if there is no prior subject to be made worse off. We can think of this as an 'impersonal bad' that attaches to the state of affairs of a miserable person existing.
  However, happiness is not intrinsically good in a way that *demands* production. It is good *for* someone. So, the domain of the 'benefit' reason requires a beneficiary to latch onto. The domain of the 'harm' reason latches onto the suffering itself. This isn't just to avoid the Repugnant Conclusion; it's to respect the intuition that while we owe duties to existing people to make them happy, we don't owe duties to potential people to satisfy that potential. The formalization isn't inconsistent; it's just state-dependent regarding benefits but state-independent regarding severe harms."

  **Weakness Analysis:**
  *   **Where it's weak:** It risks looking *ad hoc*. Decision theorists hate "brute" distinctions.
  *   **Concede:** Admit that this requires rejecting standard Expected Utility Theory assumptions regarding population. You are proposing a non-standard axiology.
  *   **Hold:** Do not concede that it is inconsistent. It is *asymmetric*, not inconsistent. Hold the line that suffering has a normative "weight" that existence-independent of a subject can carry, whereas benefit does not.

  #### 2. The Bioethics/Disability Objection (The Expressivist Challenge)
  **Likelihood:** High | **Damage Potential:** Medium-High
  **Phrasing:** "You talk about not bringing 'miserable' people into existence. In a clinical context, this sounds like the logic used to justify selecting against embryos with disabilities. Does your view imply that lives with significant disabilities are 'miserable' and therefore shouldn't be started? How do you draw the threshold without expressing disrespect to existing disabled people?"

  **2-Minute Reply:**
  "This is a crucial distinction. My argument relies on the threshold of a 'life worth starting,' which is distinct from a 'life worth continuing.' A life can be worth continuing for an existing person even if it involves significant hardship or disability. However, the threshold for *bringing* someone into existence is higher.
  I am not equating disability with misery. Many disabled lives are well above the threshold of having a life worth starting. The asymmetry applies to lives that are so burdened by suffering that they are not worth living *for the person living them*. My view actually protects disabled people: it argues against a utilitarian calculus that might sacrifice existing disabled people for the greater good. It says we have strong reasons not to create suffering, but we don't have reasons to maximize 'ability' or 'happiness' in potential people. The expressivist objection applies if we say their lives *now* aren't worth living. I am only talking about the moral reason to initiate a life of severe, unmitigated suffering."

  **Weakness Analysis:**
  *   **Where it's weak:** The "threshold" is notoriously vague. Bioethicists will press on who decides what counts as "miserable."
  *   **Concede:** Concede that the line is fuzzy and context-dependent. Acknowledge the social model of disability (society creates misery, not just impairment).
  *   **Hold:** Hold that there *is* a theoretical limit (e.g., intractable pain, inability to form any preferences). Don't let the fuzziness of the line dissolve the distinction.

  #### 3. The Senior Faculty's "Scope Insensitivity" Attack
  **Likelihood:** Medium | **Damage Potential:** High (Reputational)
  **Phrasing:** "I've argued before that this asymmetry is a cognitive confabulation. We feel it because we're scope-insensitive to large numbers of happy people but sensitive to individual suffering. You're building a moral theory on a psychological bias. Why shouldn't we just debias our intuitions rather than build a complex theory to accommodate them?"

  **2-Minute Reply:**
  "I appreciate that challenge. It's true that evolutionary psychology might explain *why* we have these intuitions. But the genealogy of an intuition doesn't necessarily debunk its normative force. Even if the asymmetry is a bias, it's a bias that solves major paradoxes in population ethics that Total Utilitarianism cannot, specifically the Repugnant Conclusion and the Mere Addition Paradox.
  If we 'debias' ourselves into Total Utilitarianism, we are forced to accept that we have a moral obligation to populate the world until everyone is barely worth living, provided the total sum is higher. My view offers a reflective equilibrium. It preserves the intuition that suffering is urgent while avoiding the demand to maximize population. So, even if the intuition has psychological origins, its theoretical utility in producing a coherent, action-guiding ethics suggests it tracks a genuine normative distinction, not just a cognitive error."

  **Weakness Analysis:**
  *   **Where it's weak:** Evolutionary debunking arguments are hard to fully deflect.
  *   **Concede:** Concede that we *are* scope-insensitive and must be careful.
  *   **Hold:** Hold that "psychological origin" $\neq$ "normative falsehood." The theoretical cost of the alternative (Repugnant Conclusion) is too high to discard the intuition solely on genealogical grounds.

  #### 4. The Non-Identity Problem (NIP) Twist
  **Likelihood:** Medium | **Damage Potential:** Medium
  **Phrasing:** "If the reasons not to harm are impersonal, does the Non-Identity Problem disappear for you? If I choose a policy that causes a future child to be disabled but happy, but another policy would have created a *different* child who is super-happy, have I harmed the first child? If your reasons are impersonal, does it matter that the child couldn't exist otherwise?"

  **2-Minute Reply:**
  "On my view, the Non-Identity Problem loses some of its bite, but not all. If the child is happy (life worth living), I haven't violated the reason not to create a miserable person. So, in the standard NIP case where the child has a life worth living, there is no *asymmetry-based* objection.
  However, my view doesn't necessarily solve every NIP case, because I'm not claiming *all* reasons are impersonal. I'm claiming the reason *not to create misery* is. If the choice is between creating a miserable person and a happy person, the impersonal reason blocks the miserable creation. But if the choice is between a happy person and a happier person, we are back in person-affecting territory where identity matters. I'm not offering a full solution to NIP, but rather a constraint on when NIP applies: it doesn't apply when the outcome involves creating a life not worth living."

  **Weakness Analysis:**
  *   **Where it's weak:** It limits the scope of your theory. It admits you don't solve *all* population ethics problems.
  *   **Concede:** Concede that this view doesn't solve NIP for "happy vs. happier" cases.
  *   **Hold:** Hold that it solves the *morally urgent* cases (suffering), which is the primary motivation for the asymmetry.

  #### 5. The "Mere Addition" Pressure
  **Likelihood:** Low | **Damage Potential:** Medium
  **Phrasing:** "If there's no reason to bring a happy person into existence, does that mean adding happy people to the world is morally neutral? If so, how do you avoid the conclusion that a world with billions of suffering people is permissible as long as we add enough happy people to 'offset' it?"

  **2-Minute Reply:**
  "Correct, on my view, adding happy people is morally neutral in itself; it doesn't make the world better, it just makes it larger. But this doesn't allow suffering to be 'offset.' Because reasons not to harm are impersonal and non-cancelable by independent benefits. You cannot trade off a miserable person's existence against a happy person's existence. The reason not to create the miserable person is a veto, not a weight on a scale. So, a world with billions of suffering people is impermissible regardless of how many happy people you add. The asymmetry protects the suffering from being aggregated away."

  **Weakness Analysis:**
  *   **Where it's weak:** Aggregation problems. Some ethicists insist trade-offs must be possible.
  *   **Concede:** None really, this is the core strength of the view.
  *   **Hold:** Hold hard on the "veto" power of suffering. This is your selling point to the bioethicists.

  ***

  ### The Nightmare Question
  **The Question:** "If existence is a prerequisite for suffering, isn't existence also a prerequisite for benefiting? You say we have a reason not to impose suffering on a potential person, but no reason to impose benefits. But to suffer, one must exist. To benefit, one must exist. If you have a reason to avoid the state of 'existing-and-suffering,' why don't you have a reason to pursue the state of 'existing-and-benefiting'? What breaks the symmetry other than the intuition itself?"

  **Why it's the nightmare:** It attacks the logical core of your "Scope of Reasons" argument. If you can't explain *why* the prerequisites don't symmetrize the reasons, the theory looks like special pleading.

  **2-Minute Reply:**
  "The symmetry breaks because suffering and benefiting have different normative valences regarding *necessity*. Suffering is a 'bad' that creates a claim for avoidance even if the subject doesn't yet exist to claim it—think of it as a defect in the world. Benefiting is a 'good' that requires a subject to *receive* it to be actualized.
  To put it another way: Non-existence is neutral. Moving from Non-existence to Suffering is a negative change for the world. Moving from Non-existence to Happiness is not a positive change for the world in the same way, because there was no prior subject deprived of that happiness. The 'harm' is in the presence of the pain. The 'benefit' is not in the presence of pleasure alone, but in the pleasure *for* someone. Since the 'someone' is contingent on the act, the reason to benefit cannot precede the act. The reason to avoid pain can, because pain is self-intimatingly bad."

  **Weakness Analysis:**
  *   **Where it's weak:** It relies heavily on the claim that "pleasure for someone" is normatively different from "pain in the world." A utilitarian will say pain is just negative pleasure.
  *   **Concede:** Concede that this requires rejecting hedonistic monism (the idea that pleasure and pain are the only goods/bads). You are committed to a pluralistic or asymmetrical axiology.
  *   **Hold:** Hold that the *experience* of suffering imposes a moral demand that the *experience* of pleasure does not. This is the bedrock of the asymmetry.

  ***

  ### Final Advice for the Workshop

  1.  **Manage the Clock:** If a questioner starts a monologue, wait for a breath and say, "That's a really important point, let me make sure I address the core of it..." then pivot to your prepared reply.
  2.  **The "Advisor" Gap:** If you get stuck, don't bluff. Say, "That's a complication I'm currently working through in the written draft. My tentative thought is X, but I'd welcome your take on that." This signals confidence and openness.
  3.  **The Senior Faculty:** If he presses the "Scope Insensitivity" point, don't get defensive. Validate him. "I know your work on this well, and I'm trying to show that even if the intuition is biased, the *principle* does work that the bias can't." Flattery disarms critics.
  4.  **Sleep:** You know the material. The anxiety is your brain simulating threats. The prep sheet above covers 90% of what will happen. The other 10% is just conversation.

  You're going to do fine. Good luck.
