answer: |-
  You have articulated a sophisticated version of the institutional critique that avoids the common strawman of claiming EA ignores evidence, focusing instead on how the demand for evidence shapes the portfolio. To stress-test this properly, we need to distinguish between the critique as it applies to the global health and development wing, where it is strongest, and the longtermist wing, where it faces significant empirical challenges. The strongest defeater for your view, the kind that would force you to drop the thesis entirely, is the actual allocation of capital toward existential risk reduction over the last decade. If the machinery of EA systematically selected for legible, near-term, countable interventions, then AI safety and biosecurity should be chronically underfunded relative to global health, yet the opposite has occurred within the core ecosystem. The Open Philanthropy Project and associated donors have shifted billions toward causes where the counterfactual impact is inherently unobservable, the timeline is indefinite, and the metrics are proxies at best. There are no RCTs for alignment research, no clear attribution for policy advocacy on AI governance, and the beneficiaries do not yet exist. The fact that the spreadsheet mindset has been used to justify pouring resources into these areas suggests the filter is far more permeable than your critique assumes, or that the filter is not the primary driver of allocation decisions. If the measurability bias were the dominant selection pressure, the longtermist portfolio would not exist in its current form, because the epistemic standards required to validate a bednet distribution are categorically impossible to meet for AI alignment. The presence of this funding indicates that the expected-value framework is flexible enough to accommodate radical uncertainty, provided the theoretical upside is high enough, which undermines the claim that the tools strictly select for legibility.

  A slightly weaker but still substantial defeater involves the internal evolution of how these tools are applied. You posit that the machinery acts as a filter, but there is considerable evidence that the machinery often acts as a post-hoc justification for intuition-driven decisions. Many of the largest bets in EA, particularly in the longtermist space, were driven by philosophical arguments and donor intuition before the models were built to support them. If the selection effect were driven by the metrics themselves, we would see a gradual drift toward measurability, but instead we see sudden pivots based on conceptual breakthroughs, such as the shift from global poverty to existential risk, which occurred despite a lack of new measurable data. This suggests the filter is weaker than it looks because the human element—donor passion, community consensus, philosophical shifts—often overrides the spreadsheet constraints. When the same apparatus is used to justify giving money to a philosopher working on moral circle expansion as it is to a charity distributing deworming pills, the instrument appears neutral enough that blaming it for a specific directional bias becomes difficult. The tool is being stretched to fit the cause, rather than the cause being shrunk to fit the tool. To update away from your view, you would need to see that the funding landscape is dominated by hard metrics, but if you look at the top grants by dollar value, many are for work that is fundamentally unmeasurable in the near term.

  Moving to considerations that would only warrant adding caveats rather than dropping the view, you should concede that the bias is likely real and potent within the global health and development sector specifically. The GiveWell top charity list is a perfect example of your thesis in action, where interventions are selected based on cost-per-life-saved estimates that favor direct service delivery over systemic change. If your claim is restricted to this domain, it is almost certainly true and load-bearing. The controversial part is extending this to the movement as a whole. A committed proponent of the measurability-bias critique should concede that the longtermist wing breaks their model, but they might argue that this simply shifts the bias from measurability to modelability. That is, the filter isn't about empirical data but about what can be formalized in a probabilistic model. This is a nuanced retreat that preserves the core insight while acknowledging the data. You would need to distinguish between empirical legibility and theoretical legibility. If the movement selects for things that can be modeled, even if not measured, your critique holds but requires refinement. However, if the movement funds things that resist both measurement and modeling, relying on pure narrative or urgency, then the filter story loses power.

  Regarding the insulation of your critique, there is a genuine risk that it has become unfalsifiable if every exception is treated as an anomaly. To avoid this, you must define what proportion of funding would count as a falsification. If fifty percent of EA funding went to unmeasurable, structural, long-term work, would you still claim a measurability bias exists? If the answer is yes, because the other fifty percent is measurable, then the critique is structural and permanent, which makes it less useful as a guide for improvement. A structural thesis of this kind is insulated if it claims that the mere existence of the tools distorts the portfolio, regardless of the output. To make it falsifiable, you need to commit to a counterfactual claim: that a movement without these tools would fund a significantly different portfolio of unmeasurable causes that are actually high-impact. If you cannot specify what that portfolio looks like or why it would be better, the critique risks being a complaint about rigor itself rather than a bias within it. The honest conclusion is that the view is partially insulated, but that is acceptable if you frame it as a tendency rather than a deterministic law. The bias exists as a pressure, not a wall.

  The load-bearing controversial bit of your view is not that measurement influences decisions, which is trivially true of any rational agent, but that the influence is distorting enough to cause net negative value or significant opportunity costs compared to a less rigorous alternative. Proving the distortion is the hard part. The trivial part is acknowledging that RCTs favor certain kinds of interventions. The controversial part is claiming that the interventions favored are less valuable than the ones excluded. This requires a claim about the world that is hard to verify. For example, if you argue that policy change is more impactful than direct aid but is underfunded due to measurability bias, you are making a claim about the effectiveness of policy change that is itself hard to measure. You are using an unmeasurable claim to critique the preference for measurable claims. This symmetry is where the critique often stalls. To make progress, you would need to identify specific instances where EA passed on a high-impact, unmeasurable opportunity specifically because it lacked metrics, and where a less rigorous actor took it and succeeded. Without those case studies, the critique remains theoretical.

  Finally, a committed measurability-bias person should concede that the tools have evolved to accommodate the critique. The rise of cause prioritization research itself is an attempt to measure the unmeasurable, acknowledging the gap you identified. They should also concede that the bias is likely stronger in public-facing communications than in private grantmaking, as donors need to justify decisions to stakeholders. If the public narrative is all about numbers but the private checks are written for vague, high-upside projects, the filter is largely performative. This would mean your critique applies more to the movement's branding than its actual capital allocation. If you accept this, you update from EA is biased by measurability to EA markets itself as measurable while acting on intuition. This is a different claim. It suggests the spreadsheet mindset is a lingua franca rather than a decision engine. If that is the case, the filter story is less about selection and more about communication, which is a significant caveat. Ultimately, the strongest evidence against your view is the money itself. Follow the grants. If the billions are going to things you cannot count, the filter is not doing what you say it is. If they are going to things you can count, your view stands. The data from the last decade suggests a mix, heavily weighted toward the uncountable in the longtermist sphere and the countable in the global health sphere, which means your critique is half-right and half-wrong, and the update should be to split the movement in your analysis rather than treating it as a monolith.
