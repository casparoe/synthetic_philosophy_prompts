prompt: |-
  im the faculty speaker at this year's commencement at a small liberal arts college, and I've run into the problem that everything a commencement speech is supposed to say sounds to me like bad faith. I teach Sartre — radical freedom, no fixed human nature, the idea that existence comes before essence, all of it — and I can't bring myself to stand up and tell two hundred graduates to "discover who they really are" or "be true to yourself" or that their degree has turned them into something. Those are exactly the moves I spend my seminars teaching students to distrust. But I also can't give a Sartre lecture to four hundred parents in folding chairs in the sun.

  Can you write the speech? The Sartrean commitments should do the actual structural work — they should determine what the speech can and cant promise — rather than being dropped in as decoration. It has to land as encouragement, not as a philosophy lecture, and not as a bleak "you're on your own" downer. And I don't want the fix to be just swapping "destiny" for "choice," telling them they're free to be whoever they choose, as if that were a one-time decision. On the view I actually hold, that's its own kind of bad faith, because you go on choosing — including when you pretend you've stopped — and the speech should get that across without making the parents panic. It also can't pretend freedom is a consolation prize; part of the view is that freedom is closer to a burden than a gift, and the speech has to be honest about that while still feeling like a commencement address. Maybe one small joke for the handful of students who actually read Sartre, but don't lose everyone else. Aim for roughly eight minutes when read aloud.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Role:** Faculty speaker at a small liberal arts college commencement.
      *   **Problem:** Traditional commencement tropes ("find yourself," "follow your dreams," "you are now X") feel like bad faith to a Sartrean philosopher.
      *   **Constraints:**
          *   Must embody Sartrean commitments structurally (existence precedes essence, radical freedom, responsibility, no fixed nature).
          *   Cannot be a philosophy lecture (parents are present, it's a ceremony).
          *   Must be encouraging, not bleak/nihilistic ("you're on your own").
          *   Cannot simplify freedom to just "choice" or "be whoever you want" (that's also bad faith).
          *   Must acknowledge freedom as a burden, not just a gift.
          *   Needs one small joke for the Sartreans in the crowd.
          *   Length: Roughly 8 minutes spoken (approx. 1000-1200 words).
      *   **Tone:** Honest, grounded, warm but rigorous, avoiding clichés while fulfilling the ritual function.

  2.  **Deconstruct Sartrean Themes for a General Audience:**
      *   *Existence precedes essence:* You aren't born with a purpose. You make it. -> *Translation for speech:* The future is unwritten, not because it's magical, but because it's empty until you fill it.
      *   *Bad Faith:* Pretending you have no choice or that you've finished choosing. -> *Translation for speech:* Beware of labels, beware of thinking the degree "makes" you, beware of thinking you've arrived.
      *   *Radical Freedom/Responsibility:* You are condemned to be free. You are responsible for everything you do. -> *Translation for speech:* This is scary, but it's also where dignity comes from. You are the author.
      *   *The Look/The Other:* We exist in a world with others. -> *Translation for speech:* Your choices impact the world; you aren't alone in this.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the occasion without resorting to "today you become..." Acknowledge the heat/formality (parents in the sun). Set the tone: honest, not flowery.
      *   **The "Essence" Trap:** Address the degree. It's a piece of paper, not a transformation of soul. Avoid "You are now Scholars." Instead, "You have done work."
      *   **The Core Metaphor (Freedom as Burden/Tool):** Move away from "follow your passion." Move toward "you have to build the path." Acknowledge the anxiety.
      *   **The "Bad Faith" Warning (Subtle):** Don't use the term "bad faith." Describe the *feeling* of wanting to stop choosing. The temptation to let others decide.
      *   **The Encouragement:** Why is this good? Because it means you aren't trapped. It means redemption is always possible. It means you matter.
      *   **The Joke:** Needs to be low-key. Maybe about hell or other people.
      *   **Closing:** A call to action that emphasizes continuous creation.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hello everyone. It's hot.
      *   Usually, people say you found yourself here. I say you didn't. You don't have a self to find.
      *   You are free. That's scary.
      *   Don't let anyone tell you who you are.
      *   You have to keep choosing.
      *   Joke: Hell is other people, but luckily you have friends here.
      *   Go make meaning.

      *Critique 1:* Too blunt. Too lecture-y. Needs more warmth. Needs to sound like a speech, not a seminar. The "burden" aspect needs to feel empowering, not depressing.

  5.  **Drafting - Iteration 2 (Refining Tone and Structure):**
      *   *Opening:* Welcome families. Acknowledge the weirdness of the ritual.
      *   *The Degree:* It's not a stamp of essence. It's a record of action.
      *   *The Future:* It's not a path waiting to be walked. It's terrain you have to clear.
      *   *The Anxiety:* It's okay to be scared. That means you understand the stakes.
      *   *The Community:* We choose together.
      *   *The Joke:* Slip it in regarding "other people."
      *   *Conclusion:* Keep going.

  6.  **Writing - Focusing on Language:**
      *   Avoid: "Destiny," "True Self," "Dreams," "Become."
      *   Use: "Build," "Act," "Choose," "Responsibility," "Moment."
      *   *Key Sartrean nuance:* Freedom isn't doing whatever you want; it's the necessity of acting without a script.
      *   *Addressing the Parents:* Reassure them that this doesn't mean chaos. It means their kids are capable adults.

  7.  **Drafting the Content (incorporating the constraints):**
      *   *Word Count Check:* 8 minutes is roughly 1000-1100 words at a moderate pace.
      *   *The "Bad Faith" translation:* Instead of saying "Don't be in bad faith," say "Don't pretend the script is written."
      *   *The "Burden":* Acknowledge the weight. "Condemned to be free" is too heavy. Try "The weight of the pen."
      *   *The Joke:* "There is a famous line... hell is other people. Look around. These aren't demons. They're your people."

  8.  **Refining and Polishing:**
      *   Make sure the transition from "burden" to "encouragement" works. The encouragement comes from *agency*, not *outcome*.
      *   Ensure the ending lands. It needs to feel like a send-off.
      *   Check for accidental essentialism. (e.g., instead of "You are leaders," say "You have the capacity to lead.")

  9.  **Final Review against constraints:**
      *   Sartrean structure? Yes (action defines being).
      *   No lecture? Yes (concepts embedded in metaphors).
      *   Encouraging? Yes (focus on agency).
      *   Not just "choice"? Yes (focus on continuous commitment).
      *   Freedom as burden? Yes (acknowledged anxiety).
      *   One joke? Yes.
      *   Length? Looks right.

  **(Self-Correction during drafting):** I initially thought about explicitly mentioning "existence precedes essence." No, that's too lecture-y. I need to *show* it. I'll talk about the diploma as a record of what they *did*, not who they *are*. I need to make sure the parents don't hear "your kids are unmoored." I need to frame this as "your kids are capable architects."

  10. **Final Polish:** Check rhythm and cadence for spoken delivery. (e.g., short sentences for impact. Pauses.)

  *(Proceed to generate speech based on these thoughts.)*
answer: |-
  Good morning. To the graduating class, to your families, to the faculty, and to the friends who have traveled to be here: welcome.

  I know the tradition of this day. I know what is usually expected of me. I am supposed to tell you that today is a culmination. I am supposed to tell you that the work you have done here has revealed who you truly are. I am supposed to offer you a map for the future and assure you that if you follow your passion, the path will light up beneath your feet.

  But I teach philosophy. And specifically, I teach a kind of philosophy that makes it difficult for me to speak in certainties. So, I am going to ask you to indulge me in a different kind of honesty.

  If I were to stand here and tell you that you have "found yourself" at this college, I would be lying. Not because you haven't worked hard—you have. Not because you haven't grown—you have. But because there is no "self" waiting to be found. There is no hidden essence inside you, like a pit in a peach, that this degree has finally uncovered.

  You are not a puzzle that has been solved. You are a question that has learned how to ask itself more clearly.

  This might sound unsettling. We like the idea of a destination. We like the idea that a degree transforms you into something fixed: a Scholar, a Leader, a Professional. It offers a kind of comfort. It suggests that the hard part is over, that you have arrived at your definition, and now you simply have to live it out.

  But the truth is lighter and heavier than that. The truth is that you are not a noun. You are a verb.

  For the past four years, you have defined yourself by what you *did*. You wrote the paper. You ran the experiment. You organized the protest. You stayed up late. You showed up. You were not "a student" in your bones; you were a student by your actions. And now that you are leaving, that mechanism does not turn off.

  This is the burden I want to leave you with. It is the burden of authorship.

  When you walk out of these gates, no one is coming to hand you a script. There is no cosmic authority waiting to validate your choices. If you choose a career in finance, you are not "fulfilling a destiny." You are making a choice. If you choose to paint, or to teach, or to wander, you are not "following a star." You are making a choice.

  I know this sounds like anxiety. I know that freedom is often sold to you as a gift, like a scholarship or a key to the city. But real freedom is not a gift. It is a responsibility. It means that you cannot blame your circumstances forever. It means you cannot blame your parents, or the economy, or your personality. At some point, you have to acknowledge that you are the one moving your feet.

  There is a temptation, in the years ahead, to try to put this burden down. You will feel tired. You will feel uncertain. And you will be tempted to say, "This is just who I am. I can't change. I have to do this because it's what people like me do."

  When you say that, you will be lying to yourself. You will be pretending that you are an object, something fixed, when you are actually a subject, something fluid. You will be trying to escape the very thing that makes you human.

  I tell you this not to frighten you, but to empower you. Because if you are not fixed, then you are not trapped. If you make a mistake, it does not define you. If you take a wrong turn, you are not "lost," because there was no predetermined path to begin with. You simply choose again. You act again. You write the next line.

  This is why the education you received here matters. It was not about filling you with facts. It was about strengthening your capacity to choose wisely, to think critically, and to bear the weight of your own judgment.

  And you do not have to bear it alone.

  There is a line from the philosopher I study that is often misunderstood. It is quoted on t-shirts and coffee mugs, usually by people who haven't read the book. The line is: "Hell is other people."

  *(Pause for a brief smile)*

  For the two of you in the third row who know the context: please put your phones away. For the rest of you: that quote is not about how annoying roommates are. It is about how we need other people to witness our lives, to reflect back to us who we are becoming.

  Look at the people sitting next to you. Look at your families in the stands. They are not your jailers. They are your witnesses. We create meaning together. When you choose to be kind, you create a world where kindness matters. When you choose to be honest, you create a world where truth has value. You are not building your life in a vacuum. You are building a shared world.

  So, what do I wish for you?

  I do not wish for you to "find your passion." Passion is a feeling, and feelings come and go. I wish for you to find your commitments. I wish for you to choose projects that are worthy of your freedom. I wish for you to engage with the world in a way that makes it more livable for everyone else, because your freedom depends on theirs.

  I wish for you the courage to admit when you are wrong, because that is just you choosing again. I wish for you the resilience to keep acting even when the outcome is uncertain, because the action is where the meaning lives, not the result.

  And I wish for you the ability to tolerate the dizziness of being free. It is okay to feel unmoored. It is okay to look at the horizon and not see a dock. That dizziness is not a sign that something is broken. It is a sign that you are awake.

  Class of 2024, you are not finished products. You are not statues unveiled today. You are architects standing before an empty site with a pile of bricks and a set of tools. The sun is hot. The work is hard. No one can build it for you.

  But the building is yours.

  Go make something true.

  Congratulations.
