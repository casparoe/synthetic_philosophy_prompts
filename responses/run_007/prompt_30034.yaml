          *   *Months 3-4:* Case Studies/Thought Experiments. Construct scenarios (e.g., mathematical proofs, code security, policy analysis) where the debunking is longer/harder than the claim.
          *   *Months 5-6:* Synthesis & Mitigation. Can the protocol be tweaked? (e.g., restricting argument length, requiring formal verification). Write up.
          *   *Why Philosophy?* Empirical tests need a framework to interpret. We are defining the *possibility space* of alignment, not just testing current models.

      *   **4. Success/Failure:**
          *   *Success:* A taxonomy of obfuscation. A proof that certain classes of obfuscation are immune to debate. Or a modified protocol that handles it.
