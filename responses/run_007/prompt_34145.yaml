answer: |-
  **Question 1**
  Your position relies on the claim that there is a structural incoherence in believing $p$ while believing your evidence doesn't support $p$. Critics argue that to move from the premise "My evidence does not support $p$" to the conclusion "I ought not believe $p$," you need a substantive "level-bridging" principle. If you deny such a principle, the incoherence seems to vanish; if you affirm it, you seem to be begging the question against the akratic agent who denies the principle. How do you formulate this bridge without assuming the very rationality constraint you are trying to prove, and does this not render the norm circular?

  **Follow-up 1**
  I anticipate you will reply that the bridge principle is not an external premise the agent must reason through, but rather a constitutive rule of the doxastic system itself—something like a norm of transparency. But if it is constitutive, doesn't that imply that an agent in an akratic state has, in some sense, fallen out of the business of believing altogether? If so, how can we criticize them for being *irrational* rather than simply for not believing? It seems you risk making the norm too strong to be violated, or too weak to be normative.

  ***

  **Question 2**
  Let's press further on that bridge. Suppose an agent accepts a level-bridging principle but has misleading higher-order evidence that suggests their application of the principle is faulty in this specific instance. They believe $p$, and they believe their evidence supports $p$, but they also believe they are currently bad at assessing evidence. To avoid akrasia, they must disregard their assessment of their own assessment. Doesn't this require a level of epistemic arrogance that undermines the very reliability the bridge principle was meant to secure? Where does the view leave us when the bridge and the higher-order evidence pull in opposite directions?

  **Follow-up 2**
  You might respond that rationality is a matter of internal coherence, not external reliability, so arrogance is irrelevant if the coherence is maintained. But if rationality can require you to ignore known defects in your own cognitive machinery, are we still talking about *epistemic* rationality? It seems you are defining rationality in a way that allows it to systematically diverge from truth-conduciveness. If the "rational" response is to ignore evidence that you are reasoning poorly, what normative force does the label "rational" retain?

  ***

  **Question 3**
  I'd like to shift to the analogy with practical akrasia. In the practical domain, we accept that an agent can judge they ought to $\phi$ while failing to $\phi$; indeed, that is the definition of weakness of will. You deny the analogous possibility in the epistemic domain: you cannot rationally judge that your evidence supports believing $p$ while failing to believe $p$. What is the fundamental disanalogy between action and belief that licenses this asymmetry? Is it a difference in the objects of the attitudes, or a difference in the kind of control we have over them?

  **Follow-up 3**
  A common reply is that belief is involuntary in a way that action is not—we cannot believe at will. But if belief is involuntary, it seems odd to call the failure to align belief with judgment "irrational" rather than merely "unfortunate." If I cannot help but believe $p$ despite judging my evidence doesn't support it, in what sense am I culpable? Does your view require a form of doxastic voluntarism to make the charge of irrationality stick, and if so, is that psychologically plausible?

  ***

  **Question 4**
  Let's pursue the control issue. If you concede that we lack direct voluntary control over belief, you might argue that the norm is still applicable because we have indirect control over our evidence-gathering. However, the akratic state often arises precisely when evidence-gathering is complete. If the norm applies synchronically to the state of belief itself, and the agent cannot change that belief at will, does your view not collapse into an externalist requirement where "rational" just means "responding correctly to evidence," regardless of the agent's perspective? How do you maintain the internalist intuition that rationality is about the agent's perspective without granting them the control to fix akratic states?

  **Follow-up 4**
  You may argue that rationality is a matter of competence, not control—that we can be critiqued for malfunctioning even if we can't fix the malfunction in the moment. But this seems to shift the ground from *normativity* to *evaluation*. We evaluate a broken clock as inaccurate, but not as irrational. If the akratic agent is like the broken clock—unable to align their output with their own assessment—why use the language of rational permission at all? Does this not drain the concept of its action-guiding force?

  ***

  **Question 5**
  Moving to peer disagreement: If I learn that an epistemic peer disagrees with me, I acquire higher-order evidence that my assessment of the first-order evidence may be flawed. Your anti-akrasia position seems to imply that I must retain my original belief, because to lower my confidence would be to believe $p$ while thinking my evidence (now including the peer's disagreement) doesn't support it. This looks like a license for dogmatism. How do you reconcile the anti-akrasia norm with the strong intuition that rationality requires some degree of conciliation in the face of peer disagreement?

  **Follow-up 5**
  I expect you will say that the peer's disagreement does not actually change the first-order evidence, but merely adds higher-order evidence that one *might* be wrong. You might argue that suspending judgment would violate the norm because one's total evidence still supports $p$. But if the anti-akrasia norm effectively trumps the demand for conciliation in every case, doesn't it render the concept of "peer disagreement" epistemically inert? If the rational response is always to trust one's own assessment over the signal that one might be mistaken, what work is the "peer" doing in the example?

  ***

  **Question 6**
  Let's press on that point about the "peer." If your view is that one should never become akratic, then in a disagreement case, either I think my peer is wrong (and stay steadfast) or I think my peer is right (and switch beliefs). But the conciliationist argues there is a third option: recognizing the symmetry of the situation makes the evidence equivocal, requiring suspension of judgment. You seem to rule this out as akratic if I still lean toward $p$. If any doxastic response to peer disagreement risks violating the anti-akrasia norm, does your view not lose its power to discriminate among responses? How do you avoid the result that the norm is either too permissive or too restrictive to guide action in disagreement cases?

  **Follow-up 6**
  You might reply that suspension of judgment is the only rational response if the evidence is truly equivocal, and that steadfastness is only required when the first-order evidence remains strong. But this pushes the problem back to the assessment of the evidence. If the anti-akrasia norm forbids me from acknowledging that my strong first-order evidence might be neutralized by the peer's disagreement, aren't you effectively saying that higher-order evidence can never defeat first-order evidence? If so, isn't this a form of epistemic foundationalism that most contemporary epistemologists reject?

  ***

  **Question 7**
  I want to turn to cases of deliberately misleading evidence, such as the "drug case." Suppose you know you have taken a drug that impairs probabilistic reasoning. You assess some evidence and conclude $p$ is likely. You also know the drug makes you overconfident. It seems the rational response is to reduce your confidence in $p$. Yet, on your view, this looks like becoming akratic: believing $p$ (based on the evidence) while believing your evidence doesn't support that level of confidence (due to the drug). How can you maintain that akrasia is always irrational without implying that it is irrational to account for known cognitive defects?

  **Follow-up 7**
  Your likely response is that the higher-order evidence about the drug does not change what the first-order evidence supports, only how reliable you are in assessing it. Therefore, to adjust your belief is to be influenced by something other than the evidence for $p$. But this implies that rationality requires you to treat your own known cognitive impairment as irrelevant to the justification of your belief. Are you prepared to accept that a rational agent is one who ignores known defeaters regarding their own reliability? That seems to sever the link between rationality and responsible belief formation.

  ***

  **Question 8**
  Continuing with the drug case: If you insist that the rational agent must ignore the drug's effect to avoid akrasia, you seem to be prioritizing coherence over calibration. A calibrated agent lowers confidence when they know they are impaired; a coherent agent maintains confidence to match their assessment of the evidence. Why should we value the coherence of the anti-akrasia norm over the calibration that seems necessary for truth-tracking? Is there a version of your view that allows for rational calibration without succumbing to akrasia, or must we choose between being rational and being reliable?

  **Follow-up 8**
  You may argue that calibration is a long-term virtue, while anti-akrasia is a synchronic norm. But if synchronic rationality systematically leads to long-term unreliability, why call it rational? If the "rational" thing to do is to remain overconfident because lowering confidence would be akratic, then rationality appears to be a self-contained game divorced from the goal of believing truth. Does your view ultimately imply that epistemic rationality is not about getting things right, but merely about keeping one's story straight?

  ***

  **Question 9**
  This brings us to the classification of the norm. Is the prohibition on akrasia a synchronic coherence requirement on belief sets, a diachronic requirement about how beliefs should be updated, or a constitutive norm tied to the very nature of belief? Your answer matters because if it is synchronic, it's hard to explain how one *escapes* akrasia without a diachronic process. If it is constitutive, it's hard to explain how anyone violates it. Which classification do you prefer, and what problems does that specific classification create for explaining the distinct "badness" of akrasia compared to, say, believing a contradiction?

  **Follow-up 9**
  If you classify it as a constitutive norm, you risk making akrasia impossible, as I mentioned earlier. If you classify it as a synchronic coherence requirement, you face the problem that an agent can be coerced or manipulated into coherence without being rational. For instance, a brainwasher could remove the higher-order belief, leaving the first-order belief intact. The agent is no longer akratic, but they aren't more rational. Does this not suggest that the anti-akrasia norm captures merely a superficial feature of rationality, missing the deeper requirement of proper responsiveness to reasons?

  ***

  **Question 10**
  Finally, let's address the distinction between substantive and structural rationality. You seem to defend anti-akrasia as a requirement of structural coherence. This implies an agent could be structurally rational while holding terribly misguided first-order beliefs, provided they match their higher-order assessments. Do you accept that the anti-akrasia norm is silent about the quality of first-order reasoning? If so, does this not make the norm distressingly thin as an epistemic ideal? Why should we care about avoiding akrasia if it doesn't guarantee, or even tend toward, substantive epistemic goodness?

  **Follow-up 10**
  You might reply that structural rationality is a necessary condition for substantive rationality, even if not sufficient. But if the two can come apart—if one can be structurally perfect but substantively disastrous—then the structural norm seems to lack independent value. If the only reason to avoid akrasia is that it usually leads to false beliefs, but your view permits cases where avoiding akrasia leads to *more* false beliefs (as in the drug case), then you have undermined the instrumental value of the norm. What non-instrumental value does structural coherence have that justifies adhering to it when it conflicts with truth-seeking?
