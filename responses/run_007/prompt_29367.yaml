answer: |-
  The short answer is: **None.** There is no observable difference between the two models.

  This lack of observable difference is precisely the point of the Hole Argument. It is designed to force a dilemma upon the substantivalist. Here is a detailed breakdown of why there is no observable difference, and what that implies for the argument.

  ### 1. What counts as an "Observable" in General Relativity?
  In General Relativity (GR), physical observables must be **diffeomorphism-invariant**. This means that a measurement cannot depend on the arbitrary mathematical labels (coordinates or manifold points) we assign to spacetime.

  *   **Not an Observable:** "The value of the metric tensor at manifold point $p$."
      *   Why? Because $p$ is just a bare mathematical location. Without a physical reference (like a particle or a field value) to identify $p$, you cannot point to it in an experiment.
  *   **Is an Observable:** "The value of the curvature scalar at the point where two particles collide."
      *   Why? This is a **spacetime coincidence**. It relates the gravitational field to matter fields.

  ### 2. Why the Experiment Detects Nothing
  In the Hole Argument, you have two models:
  1.  Model A: $(M, g)$
  2.  Model B: $(M, \phi^*g)$

  Here, $\phi$ is a diffeomorphism that shifts points inside the "hole" but leaves everything outside unchanged.

  If you perform an experiment inside the hole, you are necessarily using physical apparatus (clocks, rods, particles). Let's say you measure the curvature at the location of your detector.
  *   In **Model A**, the detector is at manifold point $p$, and the curvature there is $K$.
  *   In **Model B**, the diffeomorphism moves the detector to point $\phi(p)$, and it moves the curvature field such that the curvature at $\phi(p)$ is also $K$.

  Because the diffeomorphism moves **everything** (the spacetime geometry *and* the matter fields defining your experimental apparatus) in lockstep, all **relationships** between fields and matter remain identical.

  Therefore, no experiment performed inside the region can distinguish Model A from Model B. They predict identical outcomes for every possible measurement.

  ### 3. The Dilemma for Substantivalism
  Your question asks: *"Which development is actual?"*

  The Hole Argument (formulated by Earman and Norton, 1987) uses the lack of observable difference to create a *reductio ad absurdum* against **Manifold Substantivalism**.

  *   **If you are a Substantivalist:** You believe manifold points have independent reality (haecceity). Therefore, "Curvature at $p$" and "Curvature at $\phi(p)$" are distinct physical facts, even if they look the same relationally.
      *   **Consequence:** You must accept that the theory is **radically indeterministic**. The past does not determine which specific manifold point gets which curvature value, even though no observation can ever tell the difference.
  *   **If you want Determinism:** You must deny that Model A and Model B represent distinct physical possibilities.
      *   **Consequence:** You must adopt **Leibniz Equivalence**. This principle states that models related by a diffeomorphism represent the **same physical state of affairs**. The manifold points do not have independent identity; they are only defined by the fields on them.

  ### 4. Summary
  The Hole Argument does not suggest there is a hidden difference we haven't found yet. It establishes that **if** substantivalism is true, there is a difference in reality that is **in principle unobservable**.

  Most physicists and philosophers of physics resolve the argument by rejecting the substantivalist premise that leads to the indeterminism. They conclude that the two mathematical models correspond to a single physical reality. Therefore, the question "which development is actual?" is a category error; there is only one physical development, described by two mathematically distinct but physically equivalent models.

  **In conclusion:** An experiment inside the region would detect **zero difference**. The Hole Argument uses this empirical indistinguishability to argue that we should not regard the two models as representing distinct physical possibilities.
