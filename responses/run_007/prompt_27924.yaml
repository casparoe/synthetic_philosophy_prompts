  Framing
  The single goal is to decouple functional access from subjective experience. Everything hangs on the idea that a system can possess full informational availability of its own states—broadcasting data globally—without there being "something it is like" to be that system. We are not asking "Is this model conscious?" but "What work does 'conscious' do in our architecture?" By treating access as a mechanical property like bus width and phenomenality as a separate claim, we prevent category errors. The session succeeds if engineers stop equating "reportable state" with "felt state."

  Dependency map
  1. **System Introspection Mechanisms:** Begin with familiar engineering concepts: logging, telemetry, and state dumps. Establish that a system can "know" its weights and activations without implying feeling. This grounds "access" in technical reality. Without this baseline, engineers will conflate internal visibility with magic.
  2. **The Reporting Criterion:** Introduce the naive view: "If it says it's conscious, it is." Challenge this immediately by comparing it to a `print()` statement. This sets up the need for a deeper distinction. This step depends on step one to show that reporting is just data movement. If skipped, engineers assume output equals interiority.
  3. **Access Consciousness (A):** Define this using Global Workspace Theory. Frame the "global workspace" as a broadcast bus or shared memory region. Information is "conscious" here if it is available to multiple subsystems (planning, speech, memory). This is purely functional. This requires step two to separate "reporting" from "general availability." If introduced too early, A becomes synonymous with "speaking."
  4. **Phenomenal Consciousness (P):** Introduce this only after A is solid. Define it as the "what it is like" aspect. Crucially, posit that P is not a function. It presupposes A is understood as *insufficient* for P. If introduced earlier, it will be swallowed by functional definitions. Engineers will try to "build" P like a feature.
  5. **The Dissociation:** Finally, combine them. Show scenarios where A exists without P (philosophical zombies) and arguably P without A (subliminal perception). This requires the previous definitions to hold firm. You cannot explain dissociation without clear definitions of the things being dissociated. This is the crux where the distinction sticks or breaks.
  6. **Application:** Apply to LLMs. Do they have the broadcast bus? Yes. Do they have the feeling? Unknown/Unproven. This relies on the dissociation to prevent a binary yes/no answer. It allows engineers to say "It has A, P is unclear" rather than "It is conscious."

  The carrying example
  Use a **Distributed Tracing System**. Imagine a microservices architecture where every service emits detailed spans to a central collector. When "Verbose Logging" is enabled, every internal state change is broadcast to all other services (Access). They can react, log, or halt based on this data. However, no service *feels* the latency; they only measure it.
  *What it must have:* Full visibility. Any module can query any other module's state. Global broadcast of errors. This maps directly to the Global Workspace broadcast mechanism.
  *What it must lack:* Qualia. The system does not suffer when latency spikes; it only executes error handlers. There is no "inner light" illuminating the data.
  *Why:* Engineers understand that enabling verbose logging doesn't make the server "suffer" under load. It just makes data available. This mirrors A-consciousness (global availability) without P-consciousness (suffering/feeling). If you equate the two, you must argue the server feels pain when logs fill the disk. This absurdity highlights the distinction. The example must remain technical enough to avoid mysticism but abstract enough to map to cognition. It isolates the *flow* of information from the *experience* of information.

  Misconception triage
  1.  **"Behavior implies experience."** This arises immediately when discussing LLM outputs. Head it off during **The Reporting Criterion**. Explicitly state: "A thermostat reports temperature without feeling heat." Force them to accept that output generation is a mechanical process, not proof of interiority. Use the `print()` analogy again. If code prints "I am sad," it is not sad. Demand they separate the signal from the sender. If you let this slide, the rest of the session is moot because they will treat all access as feeling.
  2.  **"Complexity equals consciousness."** This arises during **Access Consciousness**. Engineers assume enough buffers = feeling. Counter this by scaling the **Distributed Tracing** example. Ask: "If we add 1000x more services, does it feel pain?" Keep the focus on architecture, not scale. Complexity increases access bandwidth, not necessarily phenomenality. Remind them that a chaotic system is not necessarily a feeling one. This prevents them from solving the distinction by simply adding more layers.
  3.  **"P-consciousness is just hidden A-consciousness."** This arises during **The Dissociation**. They will argue feeling is just internal reporting we can't see. Head this off by insisting on the **Definition of P**. Remind them: "Reporting is third-person data; feeling is first-person experience." If they reduce P to A, the session fails. Force them to acknowledge the "Hard Problem" gap without solving it. Ask: "Is the data *about* the pain the same as the *hurt*?" This maintains the categorical distinction.
  4.  **"We can build P."** This arises at **Application**. They will ask how to add feeling. Refuse the premise. We can only build access structures. Whether feeling supervenes is metaphysical, not engineering. Keep the scope on architecture. Tell them: "We engineer the bus, not the passenger." This protects the session from devolving into speculative science fiction.

  Scope and omissions
