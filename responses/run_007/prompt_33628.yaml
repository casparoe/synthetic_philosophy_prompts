prompt: |-
  I'm a novelist, not a philosopher, but I somehow ended up in a social circle where half my friends are effective altruists and the other half think EA is basically a tech-bro rationalization engine. I've been listening to them argue for two years and I genuinly can't tell what kind of disagreement this is. The EA side says: look, if you can earn 300k in finance and donate 150k a year to GiveWell's top charities, you're saving lives at a scale most people never come close to—what's the objection? The critics say: that framing treats the existing economic system as a given, it ignores the institutional causes of poverty, and the whole "measurability bias" means you end up funding bed nets while the tax code that immiserates those same people goes unchallenged. The weird thing is, both sides seem to concede the other side's facts. The EA folks don't deny systemic change matters; the critics don't deny bed nets save lives. And yet no one moves an inch. My hunch, as someone who writes fiction for a living, is that this is basically a disagreement about narrative structure: the EA side sees morality as a problem you solve by optimizing a function, and the critics see it as a story about power and institutions where the unit of analysis isn't the individual choice. Is that right? And if I'm right that it's a disagreement about frameworks rather than facts, does that mean the debate is just people talking past each other forever, or is there a way to actually make progress? Be honest, and if my diagnosis is off, tell me where. Also, if the whole question is badly framed in a way I'm not seeing, say so instead of humoring me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Novelist (creative, narrative-focused, observant of human dynamics), not a philosopher.
      *   **Situation:** Stuck in a social circle with polarized views on Effective Altruism (EA). One side pro-EA (earning to give, measurable impact), one side anti-EA (systemic change, power structures, critique of capitalism).
      *   **Observation:** Both sides concede the other's facts (bed nets save lives vs. systems cause poverty), but disagree on *what to do* and *how to think about it*.
      *   **Hypothesis:** The disagreement is about *narrative structure* or *frameworks* (optimization function vs. story of power), not facts.
      *   **Questions:** Is this diagnosis right? If so, is the debate futile (talking past each other) or can progress be made? Be honest, challenge the framing if needed.

  2.  **Evaluate the User's Diagnosis:**
      *   *Is it about narrative structure/frameworks?* Yes, largely. The user has hit on a key insight. EA is often consequentialist/utilitarian (maximize good), while the critics are often structuralist/deontological/virtue-ethical (fix the system, don't be complicit).
      *   *Is it *just* narrative?* No. There are underlying philosophical commitments (meta-ethics, epistemology) and practical constraints (time horizons, risk tolerance).
      *   *Is the question badly framed?* Not really. It's a very astute observation from an outsider. However, it risks oversimplifying the *stakes*. It's not just "stories"; it's about resource allocation and moral identity.

  3.  **Deconstruct the Disagreement (The "Why"):**
      *   **EA Side:** Focuses on *marginal* impact, tractability, and neglectedness (ITN framework). Time horizon: Now (lives lost today). Unit: Individual action. Metric: QALYs/DALYs.
      *   **Critics:** Focuses on *root* causes, leverage, and justice. Time horizon: Long-term structural change. Unit: Collective/Institutional action. Metric: Power shifts/Policy changes.
      *   **The "Facts" Concession:** They agree on the *immediate* effects (nets work) but disagree on the *counterfactuals* and *opportunity costs*. (e.g., If I become a banker, do I reinforce harmful systems? If I become an activist, do I fail to save immediate lives?)
      *   **The "Talking Past Each Other" Problem:** Yes, this happens. EA speaks the language of math/efficiency. Critics speak the language of politics/justice.

  4.  **Formulate the Response:**
      *   **Validate:** Acknowledge the user's insight. It's sharp and accurate. The "narrative structure" analogy is excellent for a novelist.
      *   **Refine/Nuance:** It's not *just* narrative. It's about *moral ontology* (what exists as a moral object) and *epistemology* (how we know what works).
      *   **Address the "Futile Debate" Question:** Is it hopeless? No. But it requires shifting the terrain.
      *   **Identify the Hidden Third Option:** Cause prioritization. EA *does* care about systemic change (e.g., AI safety, biosecurity, institutional reform), but critics often focus on the "earning to give" caricature.
      *   **Actionable Advice for the Novelist:** How to move the conversation? Use the "narrative" strength.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Validate the user. "You have a novelist's eye for the subtext." Confirm the diagnosis is mostly right but needs slight expansion.
      *   **The Core Disagreement (Frameworks):**
          *   EA = Engineering/Utilitarian. Problem: Suffering exists. Solution: Allocate resources to minimize it.
          *   Critics = Political/Structural. Problem: Injustice exists. Solution: Change the rules of the game.
          *   *Key distinction:* "Saving lives within the game" vs. "Changing the game."
      *   **Where the Diagnosis Needs Nuance (The "Facts" Issue):**
          *   Do they actually agree on facts? Not really. They disagree on *counterfactuals*. (Would the banker donate if not for EA? Would the activist actually change policy?)
          *   They disagree on *risk*. (Certainty of bed nets vs. Uncertainty of revolution).
      *   **Is it Futile?**
          *   It *can* be, if they stay in their silos.
          *   Progress happens when they acknowledge *portfolio approaches*. (Some do nets, some do policy).
          *   EA has evolved (Longtermism, Institutional decision-making).
      *   **The Novelist's Role:**
          *   Don't try to solve the philosophy.
          *   Highlight the *human cost* of each framework.
          *   Show the *blind spots*.
      *   **Conclusion:** Honest assessment. It's a clash of worldviews, but not an irreconcilable one.

  6.  **Refining the Tone:**
      *   Keep it intellectual but accessible.
      *   Respect the user's intelligence (they aren't a philosopher, but they understand human nature).
      *   Avoid jargon where possible, or explain it (e.g., counterfactuals).
      *   Be honest about the limitations of EA (the "tech-bro" critique isn't baseless).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "badly framed" instruction?
      *   *Correction:* I should explicitly state if the framing is off. The framing is actually good, but I should point out that "EA" isn't a monolith. The "finance/donate" model is just one strand (Earning to Give), not the whole movement. The critics are attacking a specific subset.
      *   *Check:* Did I answer if progress is possible?
