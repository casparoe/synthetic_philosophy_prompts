answer: |-
  # JOINT STATEMENT ON THE MORAL RELEVANCE OF NUMBERS IN RESCUE CASES

  **Undersigned:**  
  *The Aggregationist Party*  
  *The Anti-Aggregationist Party*

  **Date:** October 26, 2023  
  **Subject:** The One-versus-Five Rescue Case

  ## I. AGREED CLAIMS

  We, the undersigned parties, having engaged in adversarial collaboration regarding the moral obligations of a rescuer in forced-choice scenarios, affirm the following claims as the common ground upon which our disagreement rests. These claims are intended to rule out confounding variables and isolate the specific structural disagreement regarding the moral weight of numbers.

  1.  **Equality of Moral Status:** We agree that each of the six strangers possesses equal moral status. The single individual is not intrinsically more valuable, more deserving, or more entitled to rescue than any single individual within the group of five. Discrimination based on race, gender, social utility, or personal preference is morally impermissible for both sides.
  2.  **Comparability of Harm:** We agree that the harm faced by all six individuals is identical in kind and magnitude (certain death) and that this harm is equally severe *for each individual suffering it*. We agree that death is a comparable loss for the one and for each of the five.
  3.  **Impartiality of the Agent:** We agree that the rescuer acts as an impartial agent. The rescuer has no special obligations (familial, contractual, or promissory) to any of the six, and no causal responsibility for their predicament. The decision must be made solely on the basis of general moral principles applicable to any agent in this position.
  4.  **Necessity of Choice:** We agree that this is a forced choice. The rescuer cannot save all six, cannot save none, and cannot defer the decision until the threat passes. To abstain from choosing is to choose a random outcome without moral deliberation, which both sides reject as an abdication of moral agency.
  5.  **Rejection of "Moral Mathematics" as Mere Arithmetic:** We agree that the dispute is not about simple arithmetic. Both sides acknowledge there are five people on one side and one on the other. The disagreement is not about *counting* heads, but about whether the *moral reason* to save scales linearly with the count.
  6.  **Fairness is Required:** We agree that the procedure for deciding must be fair. However, we acknowledge that we define "fairness" differently (see Section II). We agree that a decision procedure that arbitrarily favors the one over the five (or vice versa) without moral justification is unjust.
  7.  **Irrelevance of Aggregate Social Utility:** We agree that this case should be decided without reference to downstream social consequences (e.g., "the five might produce more GDP"). The moral weight must be derived from the immediate rescue context and the status of the individuals involved.

  ## II. STATEMENT OF DISAGREEMENT

  Having established the boundaries of the case, we record our residual disagreement. We have determined that this is not merely a verbal dispute, but a substantive disagreement regarding the structure of moral reasons and the nature of interpersonal comparison.

  | **The Aggregationist Position** | **The Anti-Aggregationist Position** |
  | :--- | :--- |
  | **The Core Claim:** The moral reason to prevent a death is agent-neutral and additive. Because each of the five has a claim to be saved equal to the one's claim, the combined moral weight of the five claims outweighs the single claim. | **The Core Claim:** The moral claim each person has on the rescuer is non-transferable and non-fungible. The strength of a claim is determined by the individual's need, not by the presence of other needy individuals. |
  | **The Obligation:** Impartiality requires maximizing the number of lives saved. To save the one is to treat the lives of the five as less valuable in aggregate, violating the principle of equal concern. | **The Obligation:** Impartiality requires giving each individual an equal chance of being rescued. To save the five is to subordinate the one's interest entirely to the majority, violating the separateness of persons. |
  | **The Verdict:** You ought to save the five. Saving the one is morally wrong (or significantly sub-optimal). | **The Verdict:** You ought to flip a fair coin (or use an equivalent randomization device) to decide which group to save. Saving the five deterministically is morally wrong. |
  | **Conception of Fairness:** Fairness is ex ante *outcome* maximization. A rule that saves more people treats everyone's interest in survival with equal respect over time. | **Conception of Fairness:** Fairness is ex ante *opportunity* equality. In a single shot decision, each person deserves an equal probability of rescue, regardless of group size. |

  ## III. CRUXES AND TEST CASES

  We identify three specific cruxes. For each, we specify a test case, our respective predictions, and what concession would undermine our respective views.

  ### Crux 1: The Continuity of Numbers (The "One vs. Million" Case)
  **Question:** Does the moral weight of the larger group increase indefinitely with numbers, or does it plateau relative to the individual's claim?

  *   **Test Case:** The scenario is identical to the central case, except the group consists of one stranger versus one million strangers.
  *   **Aggregationist Prediction:** The obligation to save the million is overwhelming. A coin flip is morally grotesque. The single individual's claim is morally negligible in the face of the million.
  *   **Anti-Aggregationist Prediction:** The single individual is still entitled to a significant chance of rescue. While a strict 50/50 coin flip may be adjusted to a weighted lottery, the one's chance cannot be reduced to near-zero. The one cannot be simply "outweighed."
  *   **Concession Against Aggregation:** If Aggregationists admit that in the 1 vs. 1,000,000 case the single person is entitled to a near-equal chance (e.g., >10%), they abandon the principle that numbers aggregate linearly.
  *   **Concession Against Anti-Aggregation:** If Anti-Aggregationists admit that in the 1 vs. 1,000,000 case the single person is entitled to only a negligible chance (e.g., <0.001%), they have effectively accepted that numbers can swamp individual claims, conceding the core of aggregation.

  ### Crux 2: The Veil of Ignorance (Ex Ante Rationality)
  **Question:** What decision rule would rational agents choose if they did not know which person they were?

  *   **Test Case:** All six individuals (the one and the five) meet behind a veil of ignorance before the threat arises. They know one will be isolated and five will be grouped, but none know who will be where. They must choose the rescue rule the agent will use later.
  *   **Aggregationist Prediction:** Rational agents will choose the "Save the Greater Number" rule. This maximizes each individual's ex ante probability of survival (83% chance of survival vs. 50% with a coin flip).
  *   **Anti-Aggregationist Prediction:** Rational agents concerned with the *separateness of persons* may choose the "Coin Flip" rule. They may prioritize minimizing the risk of being the sacrificed minority over maximizing overall survival odds (Maximin reasoning).
  *   **Concession Against Aggregation:** If rational agents behind the veil prefer the coin flip to guarantee equal odds rather than maximize survival probability, the Aggregationist claim that "saving more is rationally required" is undermined.
  *   **Concession Against Anti-Aggregation:** If rational agents behind the veil unanimously prefer the "Save the Greater Number" rule to maximize their own survival odds, the Anti-Aggregationist claim that "fairness requires equal chances" is undermined as contrary to the individuals' own rational interests.

  ### Crux 3: Continuity of Harm (The "Legs vs. Life" Case)
  **Question:** Is aggregation permissible for lesser harms, and if so, why does death block it?

  *   **Test Case:** You can prevent either one stranger from dying or five strangers from losing a leg (a significant, permanent disability, but not death).
  *   **Aggregationist Prediction:** Aggregation applies. Five legs lost is a greater total loss than one life lost (or at least, there is some number of legs where aggregation holds). Moral reasons sum across harms.
  *   **Anti-Aggregationist Prediction:** Lexical priority applies. One life trumps any number of legs. Aggregation is impermissible across certain thresholds of severity. The structure of the claim changes with the severity of the harm.
  *   **Concession Against Aggregation:** If Aggregationists admit that one life *always* trumps any number of lost legs, they accept a non-aggregative constraint for severe harms, which invites the question of why death does not trigger the same constraint in the 1 vs. 5 case.
  *   **Concession Against Anti-Aggregation:** If Anti-Aggregationists admit that five legs *can* outweigh one life (or that aggregation works for legs but not lives), they must explain the structural difference between summing pains/disabilities and summing losses of life, beyond mere intuition.

  ## IV. VERBAL DISPUTE ANALYSIS

  We have examined whether our disagreement is merely verbal. We conclude the following:

  1.  **"Counting":** We agree this is **not** merely verbal. Both sides "count" the people. The Aggregationist sums the *reasons* generated by the people. The Anti-Aggregationist counts the *people* to ensure each is acknowledged, but refuses to sum the reasons. This is a structural disagreement about moral ontology, not semantics.
  2.  **"Fairness":** We identify a **partially verbal** component here. Both sides use the word "fairness," but the Aggregationist defines it as *Impartial Maximization of Good* while the Anti-Aggregationist defines it as *Equal Opportunity for Rescue*. Once this definition is disambiguated, the substantive disagreement remains: *Which conception of fairness is morally binding?*
  3.  **"Ought":** We agree this is **not** verbal. Both sides intend "ought" to be action-guiding and binding. The disagreement is not about the force of the obligation, but its direction.

  ## V. CONCLUSION

  We sign this document to affirm that our dispute is genuine, substantive, and unresolved. We agree on the facts of the case and the equal status of the persons involved. We disagree on whether the moral universe allows for the summation of individual claims across persons. We commit to testing our views against the cruxes identified in Section III, acknowledging that a shift in intuition regarding those cases would necessitate a revision of the positions held here.

  _________________________  
  *Signature, Aggregationist Party*

  _________________________  
  *Signature, Anti-Aggregationist Party*
