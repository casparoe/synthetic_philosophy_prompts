answer: |-
  Your diagnosis is insightful and captures a significant source of the friction in the literature, but it requires a precise adjustment to be fully defensible. You suggest the stalemate arises because the two sides are answering different questions: the physicalist concerning **entailment** (metaphysics/logic) and the anti-physicalist concerning **conveyance** (epistemology/phenomenology).

  While this distinction is real, characterizing it as the two sides asking *different* questions misrepresents the dialectic. Both sides are ultimately answering the same question: **Is physicalism true?** (i.e., is the physical truth the *whole* truth?).

  The stalemate arises not because they are talking past each other, but because they disagree on the **bridge principle** connecting your two questions. They disagree on whether a failure of *conveyance* (epistemic gap) necessitates a failure of *entailment* (ontological gap).

  Here is an analysis of your diagnosis, the actual structure of the disagreement, and what might constitute progress.

  ### 1. Evaluating Your Diagnosis

  Your hypothesis is **partially defensible but needs refinement**.

  **Where it succeeds:**
  You correctly identify that the physicalist tends to defend the *closure* of the physical domain (entailment), while the anti-physicalist leverages the *residue* of subjective experience (conveyance). Much of the confusion in the literature stems from conflating epistemic claims ("Mary cannot deduce the experience") with metaphysical claims ("The experience is non-physical").

  **Where it falls short:**
  If the anti-physicalist were *only* asking whether physical descriptions can convey experience, they would be a **Type-B Physicalist** (or an epistemic dualist). They would say, "Yes, there is an unbridgeable epistemic gap, but physicalism might still be true."
  However, most prominent anti-physicalists (like Jackson originally, and Chalmers) argue that the failure of conveyance *proves* the failure of entailment. They argue:
  1.  Mary gains new knowledge (Epistemic Premise).
  2.  If physicalism were true, physical knowledge would entail all knowledge (Metaphysical Premise).
  3.  Therefore, physicalism is false.

  The physicalist does not deny the epistemic premise (most admit Mary learns *something*). They deny the inference from 1 to 3. They argue that one can have an epistemic gap without an ontological gap (e.g., via Phenomenal Concepts).

  Thus, the disagreement is not that they are asking different questions, but that they disagree on **whether the epistemic situation of Mary is a reliable guide to metaphysical structure.**

  ### 2. The Real Structure of the Disagreement

  The impasse is best understood as a clash over **modal epistemology** and the **nature of concepts**. The debate has crystallized into three main positions, each of which accepts different parts of your distinction:

  1.  **Type-A Physicalism (Illusionism/Reductionism):** Denies the epistemic gap. (e.g., Dennett). Claims that if Mary really knew *all* physical facts, she *could* deduce what it's like. The intuition that she learns something new is a cognitive illusion.
      *   *Status:* Often viewed as counter-intuitive; rejects the "data" of the thought experiment.
  2.  **Type-B Physicalism (Phenomenal Concept Strategy):** Accepts the epistemic gap, denies the ontological gap. (e.g., Loar, Papineau, Tye). Claims Mary gains a new *concept* (phenomenal) for an old *property* (physical/neural). The failure of conveyance is due to the unique nature of phenomenal concepts, not non-physical properties.
      *   *Status:* The dominant physicalist reply, but accused of being an "ad hoc" brute posit to block the dualist inference.
  3.  **Anti-Physicalism (Dualism/Russellian Monism):** Accepts the epistemic gap, infers the ontological gap. (e.g., Chalmers, Goff). Claims that if a gap is conceivable and primitive, it reflects reality.
      *   *Status:* Accused of violating causal closure or making consciousness nomologically dangly.

  **The Core Impasse:**
  The debate stalls because the Type-B Physicalist and the Anti-Physicalist agree on the phenomenology (Mary learns something new) but disagree on the **explanation** of that phenomenology.
  *   **Anti-Physicalist:** "The only explanation for this epistemic remainder is an ontological remainder."
  *   **Physicalist:** "There is a second explanation: the cognitive architecture of the knower (concepts) creates the remainder without ontological expansion."

  There is currently no neutral arbiter to decide between these two explanations because both are internally consistent. The argument has become a contest of **inference to the best explanation**, where each side finds their own explanation more parsimonious.

  ### 3. What Would Count as Progress?

  If the diagnosis is that the stalemate is due to a clash over bridge principles (epistemic $\to$ metaphysical), progress cannot come from refining the Mary thought experiment itself. The intuition pump has been pumped dry. Progress requires shifting the terrain.

  **A. Dissolving the Disagreement (Conceptual Engineering)**
  Progress would look like a rigorous account of **why** phenomenal concepts create an epistemic gap *if* physicalism is true. Currently, the Phenomenal Concept Strategy (PCS) is often accused of being a "placeholder."
  *   *Requirement:* A positive theory of cognitive architecture that predicts the Mary intuition as a necessary byproduct of how brains process information, independent of ontology. If cognitive science can demonstrate that *any* system with our architecture would experience an "explanatory gap" even in a fully physical world, the anti-physicalist's inference is blocked.

  **B. Formal Results (Modal Logic and Entailment)**
  You mentioned a "formal result about the limits of physical entailment." This is difficult because the dispute is often over the definition of "physical."
  *   *Hempel's Dilemma:* If "physical" is defined by current physics, physicalism is likely false (current physics is incomplete). If "physical" is defined by future ideal physics, physicalism is trivial (whatever exists is physical by definition).
  *   *Progress:* A resolution to Hempel's Dilemma that allows us to specify the "base" facts without triviality. Until we agree on what counts as a "physical fact," we cannot determine if Mary knows "all" of them.

  **C. Shifting the Burden (Russellian Monism)**
  A significant movement in recent literature (Chalmers, Goff) suggests the dichotomy itself is the problem. **Russellian Monism** accepts the anti-physicalist's claim (physical descriptions don't convey essence) but rejects the dualist conclusion (therefore, non-physical). Instead, it posits that physics describes *structure/relations*, while consciousness is the *intrinsic nature* of the physical.
  *   *Progress:* This dissolves the standoff by accepting the "conveyance" failure (physics doesn't convey intrinsic nature) while maintaining monism. If this framework can solve the "combination problem" (how micro-experience makes macro-experience), it may supersede the standard physicalist/dualist deadlock.

  **D. Rejecting the Datum (Illusionism)**
  The most radical progress would come from denying the premise. If research in cognitive science suggests that "what it is like" is a user-illusion generated by introspective mechanisms (Frankish, Dennett), then Mary doesn't learn a new fact; she acquires a new *error*.
  *   *Progress:* Empirical evidence that introspective reports of qualia are systematically unreliable would undermine the anti-physicalist's starting point.

  ### 4. Conclusion

  Your diagnosis is defensible if modified: The sides are not asking different questions, but they are **prioritizing different constraints** on the answer.
  *   The **Physicalist** prioritizes **causal closure and parsimony** (no ontological expansion).
  *   The **Anti-Physicalist** prioritizes **phenomenal transparency and conceivability** (epistemic access reveals ontology).

  The impasse persists because both constraints are deeply intuitive. Progress will not come from better arguments about Mary, but from:
  1.  **Naturalizing the Gap:** Explaining the epistemic remainder via cognitive science rather than metaphysics.
  2.  **Redefining the Physical:** Moving toward structuralist or Russellian accounts that accommodate the "conveyance" failure without dualism.
  3.  **Challenging the Intuition:** Providing empirical reasons to distrust the "what it is like" datum.

  Until one of these external anchors is secured, the debate will likely remain a reflective equilibrium between two coherent but incompatible worldviews. The "failure to specify the target" you identified is real, but it is a failure to agree on the **rules of inference** between knowledge and being, not merely a failure to define the questions.
