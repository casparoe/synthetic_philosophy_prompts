answer: |-
  This is a classic pedagogical challenge. The Dollar Auction (Shubik, 1971) is conceptually simple but emotionally potent. If run poorly, it feels like a parlor trick; if run well, it viscerally demonstrates why rational actors end up in irrational conflicts (wars, price wars, legislative gridlock).

  The key to making this work without real money is **substitute currency with social and administrative stakes**, and **structuring the social dynamics** to prevent collusion or early exit.

  Here is a 75-minute lesson plan designed to generate reliable escalation, manage the ethical constraints of a university setting, and bridge the gap between experience and formal theory.

  ---

  # Session Plan: The Escalation Trap
  **Time:** 75 Minutes
  **Students:** 18 (Mixed Undergrad/Grad)
  **Goal:** Experience the logic of escalation before learning the theory.
  **Constraint:** Do not use the terms "Dollar Auction," "Sunk Cost," or "Escalation of Commitment" until the final 20 minutes.

  ## 1. Incentive Design (The "No-Money" Fix)
  Since you cannot use cash, you need a currency that triggers **loss aversion**. Grades are too high-stakes/ethical risk; candy is too low-stakes.
  *   **The Prize:** A "Homework Exemption Token" (valid for one weekly response paper) OR a \$25 Coffee Card (if you have TA budget). *Recommendation: The Exemption Token is often valued higher by grad students.*
  *   **The Endowment:** Every student (or team) starts with **100 "Strategic Units" (SU)**.
  *   **The Cost:** The highest bidder wins the Prize. The **highest AND second-highest** bidders must pay their final bid in SU from their endowment.
  *   **The Penalty:** If a student/team ends with **negative SU**, they incur a "Social Tax."
      *   *Social Tax:* They must bring snacks for the next seminar OR summarize the next reading for the class. (Make this public and binding).
  *   **The Structure:** **Teams of Two.** (9 Teams total).
      *   *Why Teams?* Individual students can quit easily. Partners create mutual obligation ("I can't let you lose points"), which significantly increases the likelihood of escalation past the rational threshold.

  ## 2. Run of Show (Minute-by-Minute)

  ### Phase 1: Setup & Framing (0:00 – 0:10)
  *   **Seating:** Arrange chairs so all 9 teams face the front.
  *   **The Pitch:** "Today we are running a Resource Allocation Exercise. There is one Prize [show the Token/Card]. You are competing in teams."
  *   **The Rules (Write on Board):**
      1.  Bids must be in increments of 5 SU.
      2.  Highest bidder wins the Prize.
      3.  **Crucial:** The top *two* bidders pay their final bids. (e.g., Bid A: 40, Bid B: 45. A pays 40, B pays 45, B wins Prize).
      4.  You start with 100 SU.
      5.  If you go negative, you owe the "Social Tax."
      6.  **Time Limit:** You have 10 seconds to raise your hand to bid once the previous bid is called. If no bid in 10 seconds, auction closes.
  *   **The Trap Setup:** Do not discuss strategy. Do not warn them about the trap. If they ask, "Is there a trick?" say, "The rules are the rules."
  *   **Icebreaker:** Ask one team to make the opening bid (usually 5 or 10).

  ### Phase 2: The Auction (0:10 – 0:30)
  *   **TA Role:** You are the Auctioneer. Be energetic, neutral, but firm on the 10-second clock.
  *   **Managing the Stall:**
      *   *Risk:* Bidding stops at 90 SU (just below the 100 endowment).
      *   *Intervention:* If bidding stalls below the Prize Value (100 SU), remind them: "The Prize is worth 100. Current bid is 80. It is currently undervalued."
      *   *Risk:* Bidding stops at 100 SU.
      *   *Intervention:* This is the critical juncture. The second-highest bidder is about to lose 95 SU for nothing. They *must* bid 105 to minimize loss (losing 5 instead of 95). If they hesitate, lean in: "Team 3, you are currently set to pay 95 and get nothing. A bid of 105 changes your outcome."
  *   **The Spiral:** Once bids exceed 100 SU, the dynamic shifts from "winning a prize" to "minimizing loss." This is where the energy in the room will spike. Let it run until one team capitulates or both hit a hard ceiling (e.g., 200 SU).
  *   **Stop Point:** Stop the auction when one team clearly folds or when the bids become absurd (e.g., 300 SU for a 100 SU prize).

  ### Phase 3: Emotional Processing (0:30 – 0:40)
  *   **Do not teach yet.** Let them sit with the frustration.
  *   **Prompt:** "Take 2 minutes within your teams to discuss: How do you feel? What was your strategy at minute 5 vs. minute 15?"
  *   **Class Discussion:** Ask the top two bidders to stand.
      *   "At what point did you realize you were losing value?"
      *   "Why didn't you stop?"
      *   Ask the audience: "Who thought they would bid over 100 SU before we started?" (Show of hands). "Who thinks they would have stopped at 50 SU?"
  *   **Goal:** Establish that *ex ante* rationality differed from *in situ* behavior.

  ### Phase 4: Theoretical Debrief (0:40 – 1:15)
  Now you intellectualize the experience. Move to the whiteboard.

  **A. The Payoff Structure (10 mins)**
  *   Draw the matrix. Show that up to bid \$0.99 (or 99 SU), it's a standard auction.
  *   Show the shift at \$1.00 (100 SU).
  *   **Concept:** **Non-Zero-Sum Game.** In a standard auction, only the winner pays. Here, the "loser" pays too. This creates a negative-sum outcome for the group.
  *   **PolSci Link:** This is not just a market failure; it is a **Conflict Trap**.

  **B. Sunk Costs vs. Rational Escalation (15 mins)**
  *   Ask: "Was bidding 150 SU irrational?"
  *   *Discussion:* At the moment of the bid, if you have already bid 140, bidding 150 to win 100 is a loss of 50. *Not* bidding is a loss of 140.
  *   **Concept:** **Escalation of Commitment.** It is locally rational to escalate to minimize loss, even if globally irrational.
  *   **PolSci Link:** Apply to **War of Attrition**. Why do states continue fighting wars they cannot win? (e.g., US in Vietnam, USSR in Afghanistan). The cost of withdrawal (political shame, sunk resources) exceeds the marginal cost of one more month of fighting.

  **C. The Chicken Game & Credibility (10 mins)**
  *   Once bids pass the prize value, the game transforms. It is no longer about value; it is about **credibility**.
  *   **Concept:** **Brinkmanship.** You are bidding to convince the other player you are "crazy" enough to keep going.
  *   **PolSci Link:** Nuclear deterrence, legislative shutdowns. Who can best signal they are willing to absorb pain?
  *   **Grad Student Nuance:** Mention **Common Knowledge of Rationality**. If both players are perfectly rational and know the other is rational, the auction shouldn't start (backward induction). The fact that it *did* start implies bounded rationality or incomplete information about the opponent's risk tolerance.

  ## 3. Anticipating Pitfalls (The "TA Survival Guide")

  **Pitfall 1: Collusion (The "Split")**
  *   *Risk:* Two teams agree beforehand to bid 5 SU and split the prize.
  *   *Prevention:* Announce at the start: "Any side deals detected will result in immediate disqualification and the Social Tax for all involved."
  *   *Mitigation:* If you suspect whispering, call it out lightly: "I see coalition building. Remember, this is a non-cooperative game."

  **Pitfall 2: The "Rational" Stop (Stalling at 90 SU)**
  *   *Risk:* Students are too smart. They stop before the trap snaps shut.
  *   *Fix:* The **Team Structure** is your insurance. Partners pressure each other. If that fails, use the **"Bank Loan"** rule. Allow teams to borrow SU past 100, but interest is 10% payable in "Social Tax" units. This removes the hard budget constraint and allows the spiral to continue purely on pride.

  **Pitfall 3: Hyper-Escalation (Bidding 1000 SU immediately)**
  *   *Risk:* Students treat it as a joke and bid wildly, ruining the tension.
  *   *Fix:* Enforce the **10-Second Clock** strictly. Require bids to be written on a slip of paper and handed to you if they get too rowdy. This slows the pace and forces calculation.

  **Pitfall 4: Resentment over the "Social Tax"**
  *   *Risk:* Students feel punished for a game.
  *   *Fix:* Frame the Tax as **Voluntary but Binding**. "If you end negative, you have the option to pay the Tax or write a 1-page reflection on how you would avoid this trap in a real-world negotiation." Most will choose the reflection, which is actually good for learning.

  ## 4. Scripting the "Reveal"
  When you finally introduce the terminology (Minute 45), use this script:

  > "What you just played is a classic game theory model called the **Dollar Auction**, designed by Martin Shubik in 1971.
  >
  > Notice that none of you were 'irrational' in the moment. You were responding to incentives. The structure of the game changed the definition of 'winning.'
  >
  > In Political Science, we see this when conflicts cease to be about the *object* of the conflict (the dollar/the territory) and become about the *cost of losing* (the bid/the casualties).
  >
  > Today's reading connects this to [Insert Course Topic, e.g., Civil War Duration / Legislative Bargaining]. Your job in the essay is not to say 'they were stupid,' but to identify the institutional rules that turned a solvable dispute into an escalation trap."

  ## 5. Why This Design Works for Mixed Levels
  *   **Undergrads:** Get the visceral thrill of the game and the clear lesson on sunk costs.
  *   **Grad Students:** Can analyze the breakdown of backward induction and the signaling dynamics during the debrief.
  *   **You (TA):** You remain neutral. You aren't lecturing on Shubik; you are facilitating an experiment they just lived.

  ## 6. Final Prep Checklist
  1.  **Print "Strategic Unit" Sheets:** Give each team a sheet with 100 checkboxes to cross off as they bid. Visualizing the depletion of resources adds pressure.
  2.  **Timer:** Have a visible countdown timer on the screen for the 10-second bid window.
  3.  **The Prize:** Physically place the Token/Card on the table. It needs to be tangible.
  4.  **Backup Plan:** If the auction ends too quickly (e.g., someone folds at 60 SU), run a second round with **Anonymous Bidding** (sealed bids) to contrast how transparency affects escalation. (Only do this if you have extra time).

  This plan ensures the students leave the room arguing about the game, which is the perfect state for them to engage with the reading. Good luck.
