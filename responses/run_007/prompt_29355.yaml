prompt: |-
  I'm writing a novel whose main character is a physicist still chewing on Maxwell's demon, and I've realized I can't tell whether the people she argues with are making a different claim or just the same claim in different words. The standard resolution is that the demon has to measure the molecules and then erase those measurements, and erasing a bit costs at least kT ln 2, so the second law survives and the books balance. But the argument doesn't stop there. Some people say Szilard already dissolved the whole thing and the demon is just a feedback controller, so information is about correlations and bookkeeping, not a substance. Others say no, the demon shows information really is physical, and the second law ends up being a claim about what an observer can know, not just about gas molecules. The equations are the same on all sides, and yet nobody moves. I've started to suspect the real disagreement is about what an explanation of the second law has to do: give a mechanism, or give a bookkeeping identity. Is that right, or is there a live physical or formal claim still hiding in it? Diagnose the structure of the disagreement, and tell me what would actually count as progress if your diagnosis is right. Keep it under 400 words.
