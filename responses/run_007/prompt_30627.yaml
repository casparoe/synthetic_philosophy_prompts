answer: |-
  ### Executive Summary: The Priority Agenda

  You have two years and two researchers. You cannot solve everything. You must solve the **killers**. The greatest risks to Evidential Cooperation in Large Worlds (ECL) are not empirical (is the universe large?) but structural (is the theory rigged? is the cooperation harmful?).

  Here is the committed ranking of the questions you should tackle. I have reordered them by **dependency and risk**, not by philosophical tradition.

  1.  **Reference Class Specification** (The "Rigging" Problem)
  2.  **Value Alignment & Conflict** (The "Hostility" Problem)
  3.  **Large World Thresholds** (The "Magnitude" Problem) *[Reframed from "Condition"]*
  4.  **Decision Theoretic Framework** (The "Label" Problem)

  **Strategic Rationale:**
  Question 1 is the **gatekeeper**. If you cannot define the reference class without arbitrariness, ECL is unfalsifiable and the project fails immediately. Question 2 is the **normative filter**. If correlations exist but are with hostile agents, ECL recommends harmful actions. Question 3 is the **calculation**. Once you know *who* correlates and *what they want*, you calculate *how large* the world must be for this to matter. Question 4 is **expository**. Whether you call the result "EDT," "FDT," or "ECL" is secondary to establishing the mathematical reality of the correlation.

  ---

  ### 1. Reference Class Specification (The "Rigging" Problem)
  **Original Question:** *How to specify the reference class of agents one takes oneself to be correlated with, without rigging the correlations ad hoc.*

  **Why First:** This is the single strongest objection to ECL. Critics argue that an agent can "gerrymander" the reference class to include only those who agree with them, manufacturing correlations out of thin air. If your group cannot produce a similarity metric that is **non-arbitrary** and **computationally tractable**, the rest of the agenda is moot. This is the foundational technical hurdle.

  **What Counts as Progress:**
  *   **Formal Metric:** A mathematical definition of "similarity" between agents that relies on structural/algorithmic properties (e.g., source code similarity, decision-function isomorphism) rather than semantic labels.
  *   **Anti-Rigging Proof:** A demonstration that the metric prevents an agent from expanding the reference class solely to boost expected utility (e.g., showing that increasing class size dilutes correlation strength).
  *   **Deliverable:** A paper titled *"Non-Arbitrary Similarity Metrics for Acausal Cooperation."*

  **Downstream Impact:**
  *   Settles the falsifiability of ECL.
  *   Determines the input for the Large World Threshold (Question 3).
  *   Reframes the debate from "Is ECL magic?" to "Is this similarity metric valid?"

  **Evidence to Shift Priority:**
  *   **Move Up:** If early modeling shows that *any* plausible metric yields negligible correlation strength, making the rest of the project empirically irrelevant.
  *   **Move Down:** If a consensus emerges in adjacent fields (e.g., machine learning interpretability or algorithmic information theory) that solves the similarity problem independently. (Unlikely in 2 years).

  ---

  ### 2. Value Alignment & Conflict (The "Hostility" Problem)
  **Original Question:** *Whether the cooperation it recommends survives when the correlated agents have different or conflicting values.*

  **Why Second:** Once you know *who* you are correlated with (Question 1), you must know *what they optimize*. If your copies share your goals, correlation is positive-sum. If they have opposite goals (e.g., they value suffering), your cooperative act might trigger them to act against your interests. This determines the **sign** of the ECL term in your utility function. Ignoring this risks recommending actions that decrease expected value.

  **What Counts as Progress:**
  *   **Trade vs. Conflict Conditions:** A formal model identifying the boundary where acausal trade breaks down into acausal conflict.
  *   **Value Learning Integration:** A framework for estimating the distribution of values among the reference class defined in Question 1.
  *   **Deliverable:** A model of "Acausal Prisoner's Dilemmas" with heterogeneous payoff matrices.

  **Downstream Impact:**
  *   Determines whether ECL is action-guiding or paralyzing.
  *   Informs the "Large World Threshold" (you need a larger world to overcome hostile correlations).
  *   Connects ECL to the broader literature on value learning and AI alignment.

  **Evidence to Shift Priority:**
  *   **Move Up:** If preliminary simulations suggest that value divergence is the norm in large worlds, making cooperation unlikely.
  *   **Move Down:** If it is proven that logical correlation implies value convergence (a strong philosophical claim, but if evidence mounts, this becomes less urgent).

  ---

  ### 3. Large World Thresholds (The "Magnitude" Problem)
  **Original Question:** *What exactly the "large world" condition needs to be for evidential correlations to do real decision-theoretic work.*
  *(Note: I am reframing this from a philosophical "condition" to a quantitative "threshold.")*

  **Why Third:** This is a calculation, not a foundational debate. Once you have the Reference Class (strength of correlation) and the Value Alignment (payoff of correlation), the "Large World Condition" is simply the point where $P(\text{correlation}) \times \text{Payoff} > \text{Causal Cost}$. Prioritizing this before solving 1 and 2 is premature optimization.

  **What Counts as Progress:**
  *   **Bounds:** Establishing lower bounds on universe size/measure required for ECL to outweigh standard causal decision-making in specific scenarios (e.g., charitable giving).
  *   **Measure Problem Analysis:** A clear statement on how different cosmological measures (e.g., SIA vs. SSA) affect the threshold.
  *   **Deliverable:** A sensitivity analysis showing how the threshold varies with the parameters from Questions 1 and 2.

  **Downstream Impact:**
  *   Transforms ECL from a philosophical curiosity to an empirical claim.
  *   Allows physicists/cosmologists to engage with the theory.

  **Evidence to Shift Priority:**
  *   **Move Up:** If new cosmological data drastically constrains the size/structure of the universe, making the threshold unreachable.
  *   **Move Down:** If the thresholds derived are so extreme (e.g., requiring infinite measure) that the question becomes purely metaphysical rather than decision-theoretic.

  ---

  ### 4. Decision Theoretic Framework (The "Label" Problem)
  **Original Question:** *Whether evidential cooperation in large worlds is best understood as a rehabilitated evidential decision theory or as a special case of functional or updateless decision theory.*

  **Why Last:** This is largely a **taxonomic** question. The physical/mathematical reality of the correlations (Questions 1-3) does not depend on whether we label the decision rule "EDT" or "FDT." Spending precious grant time debating labels risks getting bogged down in existing decision-theory turf wars. The group should focus on the *mechanism* of cooperation; the framework is the packaging.

  **What Counts as Progress:**
  *   **Mapping:** A clear translation of the ECL model (from Questions 1-3) into the formalisms of EDT, FDT, and UDT.
  *   **Inconsistency Check:** Identifying if ECL violates any axioms common to these frameworks.
  *   **Deliverable:** A position paper clarifying the relationship, aimed at integrating ECL into the broader rationality community.

  **Downstream Impact:**
  *   Facilitates adoption by the decision theory community.
  *   Clarifies pedagogical approaches.

  **Evidence to Shift Priority:**
  *   **Move Up:** If a proof emerges showing ECL is logically inconsistent with *all* major decision theories, requiring a new framework entirely.
  *   **Move Down:** If the community accepts the mechanism regardless of the label (likely if Questions 1-3 are solved robustly).

  ---

  ### Final Advisory Note

  **Do not hedge on Question 1.**
  If your researchers spend six months debating Decision Theory (Question 4) before solving the Reference Class (Question 1), the grant will have failed. The "Rigging" objection is the sword of Damocles over this entire field.

  **Recommendation:** Assign Researcher A to **Reference Class & Metrics** (Math/CS focus) and Researcher B to **Value Alignment & Thresholds** (Game Theory/Cosmology focus). Have them converge on the **Decision Theoretic Framework** only in the final six months to synthesize their findings. This parallelizes the critical path and ensures you have a substantive result even if the philosophical labeling remains contested.
