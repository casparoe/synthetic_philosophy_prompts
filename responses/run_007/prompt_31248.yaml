answer: |-
  The medical-legal practice of enforcing advance directives over the apparent wishes of a person with severe dementia rests on a specific metaphysical wager about who you are. It presupposes a theory of **psychological continuity** combined with **precedent autonomy**. Under this view, your "true" self is identified with your rational, autonomous capacity to form life plans and values. When dementia severs the psychological links to that past self—erasing memory and rational planning—the "real" person is considered to have departed or diminished significantly. What remains is a biological organism that must be governed by the last valid will of the rational agent. This framework prioritizes "critical interests" (long-term values established by the competent self) over "experiential interests" (the immediate pleasure, pain, and desires of the present self). The law treats the directive as a binding command from the past sovereign to the future subject, assuming the past self owns the future body.

  A relational or Ubuntu perspective challenges this metaphysics at its root. In Ubuntu philosophy, personhood is not a private, internal property like rationality or memory that can be lost; it is a social status conferred and sustained through relationships ("I am because we are"). From this view, the person with dementia is not a diminished remnant but a fully constituted person *now*, existing within a network of care, recognition, and interaction. Their smiles, their enjoyment of pudding, and their resistance to harm are not mere reflexes but expressions of a person currently embedded in a community. To silence these current expressions in favor of a document written by a "ghost" is to deny the current person's moral standing. It treats the patient as an object to be managed according to past instructions rather than a subject participating in a present relationship. The relational view argues that personhood is dynamic; if the community recognizes and cares for the individual, they are a person, and their current will matters because it sustains that relational bond.

  This creates a fundamental conflict. The standard practice assumes the past self has veto power over the present self. The relational view assumes the community has a responsibility to the present person. If we took the relational view seriously, the practice of advance directives would shift from a legalistic enforcement of past commands to a communal deliberation about current well-being. The directive would not be discarded—it represents a vital part of the patient's history and the family's relationship to them—but it would lose its binding legal authority. It would become an advisory document, one voice among many in a decision-making process that includes caregivers, family, and clinicians. The goal of medical decision-making would change from "respecting autonomy" (following the past order) to "maintaining personhood" (sustaining the current relational existence). Treatment would be withheld or provided based on whether it supports the patient's current capacity for relationship and comfort, rather than whether it violates a prior command.

