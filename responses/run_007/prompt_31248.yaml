    "relational_challenge": "A relational view objects that personhood is constituted through ongoing recognition and care, so overriding the current self's will treats a socially embedded person as a mere object of the past.",
    "verdict": "incompatible",
    "what_would_change": "Advance directives would become non-binding advisory documents, with treatment decisions made by a care community focused on sustaining the patient's current relational well-being."
  }
