answer: |-
  This is a sharp observation, and you have correctly identified a structural vulnerability that appears in governance, security, and risk ethics. You are describing a specific failure mode of **permissionless systems**.

  The most precise established term for this is **"The Unilateralist's Curse."**

  It was formalized in a 2016 paper by philosophers Nick Bostrom, Thomas Douglas, and Carl Shulman (*"The Unilateralist's Curse"*). While the term is most common in risk ethics and effective altruism circles, it maps exactly to the dynamic you are describing.

  Here is the breakdown of the concept, how it differs from related ideas, and the boundaries you asked for.

  ### 1. The Core Concept: The Unilateralist's Curse
  The curse arises when three conditions are met:
  1.  **Shared Impact:** An action affects the interests of a group.
  2.  **Unilateral Capacity:** Any single member of the group has the technical or procedural ability to initiate the action without consent.
  3.  **Divergent Judgment:** Members disagree on the value or risk of the action.

  **The Math of the Scaling Problem:**
  You noted that this gets worse as the group grows. The formal logic is probabilistic.
  Let's say there is a risky action. In a group of $N$ people, let's assume the probability that any specific individual thinks the action is "worth the risk" is $p$.
  The probability that *no one* in the group will take the action is $(1 - p)^N$.
  Therefore, the probability that *at least one person* takes the action is $1 - (1 - p)^N$.

  As $N$ (group size) increases, the probability of the action happening approaches 100%, even if $p$ (the percentage of people who are reckless) is very small. In a group of 3, you need a 33% recklessness rate to expect one actor. In a group of 100, you only need a 1% recklessness rate.

  **Why "Curse"?**
  It is called a curse because the outcome is often sub-optimal for the group as a whole. The decision is not made by the median voter or the wisest member, but by the member with the **lowest threshold for action.**

  ### 2. Is it "Tyranny of the Minority"?
  **No.** This is a crucial distinction for your novel.
  *   **Tyranny of the Minority** usually refers to *veto power*. A small group can *stop* the majority from acting (e.g., the UN Security Council, the filibuster). It is a blocking mechanism.
  *   **The Unilateralist's Curse** is about *initiation power*. A single individual can *force* the majority to accept a new reality.

  In your intentional community, if one person invites a difficult roommate and the rules say "no veto," that is the Unilateralist's Curse. If one person could *block* a new roommate everyone else wanted, that would be Tyranny of the Minority.

  ### 3. Relation to Game Theory & Security
  In game theory, this is often discussed alongside **"Best Shot Public Goods"** vs. **"Weakest Link Security."**
  *   **Best Shot:** A public good is provided if *at least one* person contributes (e.g., calling the fire department). Your scenario uses "Best Shot" mechanics.
  *   **Weakest Link:** A system fails if *at least one* person fails (e.g., one person clicks a phishing link, the whole network is compromised). Your scenario results in a "Weakest Link" outcome.

  Your novelist's intuition is spotting that **Best Shot mechanics applied to negative outcomes create a Weakest Link vulnerability.**

  ### 4. A Precise Definition (Carving at the Joints)
  If you need a definition for your notes or to explain it to an editor, try this:

  > **Unilateral Action Risk:** A governance failure mode in which the cost of reversing a decision is higher than the barrier to initiating it, and initiation rights are distributed equally among members. This creates an asymmetry where the group's risk profile is determined not by the average risk tolerance of its members, but by the member with the highest risk tolerance (or lowest inhibition).

  ### 5. Edge Cases (Testing the Boundaries)
  To see if a situation in your novel counts, run it through these three tests:

  **Edge Case A: The Fire Alarm (Does it count?)**
  *   *Scenario:* Anyone in the communal house can pull the fire alarm.
  *   *Verdict:* **Mechanism matches, Valence differs.** This is a unilateral trigger. However, it is designed this way *on purpose* because the cost of a false alarm is lower than the cost of a fire. It counts as the *structure*, but it's a "benign" version. In your novel, you are writing the "malign" version (where the cost of the false alarm is high).

  **Edge Case B: The Two-Person Rule (Does it count?)**
  *   *Scenario:* To invite a new member, two existing members must sign off.
  *   *Verdict:* **No.** This is the specific *remedy* for the Unilateralist's Curse. By requiring $k > 1$ actors, you mathematically reduce the probability of a reckless action. If your community adopts this, they are solving the problem you identified.

  **Edge Case C: Social Norms vs. Written Rules (The Fuzzy Boundary)**
  *   *Scenario:* The written rules say anyone can invite a guest. But historically, everyone asks the group chat first. If someone doesn't ask, they get shunned.
  *   *Verdict:* **Borderline.** Technically, the unilateral power exists. However, if the *social cost* is high enough, the effective power is neutralized. In your novel, the tension arises when someone decides they don't care about the social cost. This is often where the drama lies: the person who treats the rule as literal when everyone else treats it as normative.

  ### 6. Confidence and Uncertainty

  **Confidence Level: High (85-90%)**
  I am highly confident that "The Unilateralist's Curse" is the correct theoretical framework for the dynamic you described. The mathematical scaling of risk based on group size and unilateral capacity is the exact subject of that literature.

  **The One Thing I'm Least Sure About:**
  I am less certain about the **sociological terminology within intentional communities specifically.**
  While "Unilateralist's Curse" is the rigorous philosophical term, specific subcultures (co-housing, communes, cooperatives) often have their own slang. For example, some co-housing groups might call this "The Open Door Problem" or "Consensus Drift." There may be a more colloquial term used by people who actually live in communes that hasn't made it into political theory literature. If you want authenticity for your characters, they might not say "Unilateralist's Curse," they might say, "Well, you know what happens when everyone holds the keys."

  **Recommendation for the Novel:**
  Keep "The Enthusiast's Trigger" in your notebook. It is evocative and accurate. In the text, have a character explain the *mechanism* ("It only takes one of us to sink the ship") rather than using a jargon term. The tragedy you are describing is that the system is designed for *trust*, but it scales like *risk*.
