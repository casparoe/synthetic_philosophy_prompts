answer: |-
  Next week an exam will fall on one of five days,
  But you will not know which until it arrives.
  It must be a surprise, no matter how you gaze,
  If you deduce the date, the surprise barely survives.
  So trust the rule that governs your days.

  So Friday cannot be the day it lands,
  For if Thursday passes without a test,
  I'd know Friday remains by strict commands,
  And knowledge steals the surprise from the rest.

  Then Thursday falls, for Friday is erased,
  If Wednesday night passes, Thursday is certain,
  And certainty leaves the surprise effaced.

  So Wednesday goes, and Tuesday follows suit,
  No day remains to bear the fruit.

  No Monday left, no exam at all.

  Then Wednesday came; I had proved it away.
  The proof was the trap that kept me blind today.
