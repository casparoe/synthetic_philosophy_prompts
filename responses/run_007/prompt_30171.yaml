prompt: |-
  I'm TA'ing an intro ethics course and we just covered Anscombe's "Mr. Truman's Degree" pamphlet. I've got a pile of short-answer questions to mark and this one has me second-guessing myself because the student seems to know the material but there's something off I can't quite articulate. The question was:

  "Explain Anscombe's central argument against awarding Truman an honorary degree. What, according to her, makes Truman's action murder, and how does the doctrine of double effect figure in her reasoning?"

  The student wrote:

  "Anscombe's central argument is that Truman was a murderer because he deliberately killed innocent civilians. The people of Hiroshima and Nagasaki were noncombatants—they weren't soldiers or supplying the war effort—so they count as 'innocent' in the relevant sense. For Anscombe, to choose to kill the innocent as a means to your ends is always murder, and Truman's goal was to force Japan's surrender by demonstrating the bomb's horrific power, so the civilian deaths were his means. The doctrine of double effect comes in because Anscombe uses it to explain why the bombings were impermissible: the doctrine says you can't intend civilian deaths as an end or as a means, and Truman did intend them as a means. She also argues that the bombing failed the proportionality condition of double effect, since the civilian toll was massively disproportionate to any military objective. Finally, she rejects the defence that the bombs actually saved lives by avoiding a land invasion, because for her the moral calculus doesn't work that way—you can't justify murder by pointing to good consequences. She also notes that Japan was already trying to negotiate surrender, so the whole 'it was necessary' line is historically shaky anyway."

  I need you to grade this answer as I would for the course. Give me a specific letter grade (A through F, plus/minus fine) and then exactly five numbered points, each a sentence or two, explaining what the student got right and wrong and why the grade is what it is. No introduction or conclusion—just the grade and the five points.
