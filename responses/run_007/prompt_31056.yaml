answer: |-
  # Emergency Ethical Allocation Protocol (EEAP) v1.0
  **For Use By:** Duty Officers, Regional Emergency Management.
  **Purpose:** To standardize decisions regarding scarce rescue/treatment resources when not all claimants can be served.
  **Authority:** Requires Director Sign-off for any deviation from Step 4 (Aggregation).

  ---

  ## The Procedure

  **Step 1: Operational Viability Check (Fact)**
  *   **Question:** Can the available resource successfully save/treat *any* of the identified parties?
  *   **Sufficient Answer:** Yes/No based on current field data (weather, fuel, medical prognosis).
  *   **If No:** Withhold resource. **[STOP]**
  *   **If Yes:** Proceed to Step 2.
  *   *[Note: This is a factual judgment, but "success" definitions can be dressed-up value judgments.]*

  **Step 2: Special Obligation Check (Value/Policy)**
  *   **Question:** Does the Duty Officer or Agency have a pre-existing specific duty to one party over the others (e.g., one is an agency employee, one is a child of the rescue pilot, one was promised aid)?
  *   **Sufficient Answer:** Verified existence of a specific duty/promise.
  *   **If Yes:** Prioritize the party to whom the duty is owed. **[STOP]** (Taurek allows special obligations).
  *   **If No:** All parties are "strangers" with equal baseline claims. Proceed to Step 3.
  *   *[Hand-off: If uncertainty exists about the duty, consult Legal.]*

  **Step 3: The Numerical Disparity Threshold (The Aggregation/Taurek Pivot)**
  *   **Question:** What is the ratio of lives saved between Option A and Option B?
  *   **Sufficient Answer:** Integer count of individuals.
  *   **Decision Rule:**
      *   **If 1 vs 1:** Proceed to Step 5 (Randomization).
      *   **If 1 vs 2 or 1 vs 3:** Proceed to Step 4 (Instrumental Value Check).
      *   **If 1 vs 4 or greater:** Default to Saving the Greater Number. **[Director Sign-off Required to Override]**.
  *   *[Judgment Call Dressed as Procedure: The threshold "4" is arbitrary. It balances Taurek's "Equal Chance" against the Objection that ignoring large numbers is absurd.]*

  **Step 4: Instrumental Value Check (Rival View vs. Taurek)**
  *   **Question:** Does one individual possess a unique instrumental value *independent* of their own life (e.g., sole caregiver for dependents, critical infrastructure operator)?
  *   **Sufficient Answer:** Verified fact of dependency (e.g., "No other adult exists for these children").
  *   **Decision Rule:**
      *   **If Numbers are Equal (1 vs 1):** Ignore instrumental value. Proceed to Step 5. (Taurekian Priority: The children's loss is not the patient's loss).
      *   **If Numbers are Small (1 vs 2/3):** Count instrumental value as +1 to the group size. (Hybrid View).
  *   *[Hand-off: This step hands the decision to a value system. Utilitarians count the dependents; Taurekians do not. This procedure defaults to Taurek for 1 vs 1 to protect individual equality.]*

  **Step 5: Fair Chance Allocation (Taurekian Resolution)**
  *   **Question:** Have all relevant factual distinctions been exhausted?
  *   **Sufficient Answer:** Yes.
  *   **Action:** Conduct a weighted lottery or coin flip.
  *   **[STOP]**

  ---

  ## Procedural Annotations (For Training)

  *   **Where the Procedure Stops:** Steps 1, 2, and the "Greater Number" branch of Step 3 are hard stops.
  *   **Where Values Enter:** Step 2 (Special Duties) and Step 4 (Instrumental Value).
  *   **Judgment Calls Dressed as Procedure:**
      *   **Step 3 Threshold:** Setting the cutoff at "4" is not philosophical truth; it is risk management. It acknowledges the *Objection to Taurek* (that saving 1 instead of 1,000 is immoral) without fully abandoning Taurek for small groups.
      *   **Step 4 Instrumental Value:** Deciding *not* to count the caregiver's dependents in a 1 vs 1 scenario is a philosophical choice (Separateness of Persons) disguised as a rule.
  *   **Director Hand-off:** Any decision to save 1 person over 4+ (Step 3) requires Director signature. This protects the Duty Officer from legal liability for following Taurek in high-visibility cases.

  ---

  ## Worked Cases

  ### Case (a): One Boat, Single Trapped Person vs. Family of Five
  *   **Step 1 (Viability):** Boat can reach either group. **Pass.**
  *   **Step 2 (Special Obligation):** All are strangers. **Pass.**
  *   **Step 3 (Numerical Disparity):** Ratio is 1 vs 5.
      *   **Rule:** 1 vs 4 or greater defaults to Saving the Greater Number.
      *   **Action:** Deploy boat to family of five.
      *   **Override:** Duty Officer could request a lottery, but requires Director Sign-off.
  *   **Outcome:** Save the five.
  *   **Analysis:** Here, the *Objections to Taurek* dominate. The disparity is large enough that a coin flip would be publicly and legally indefensible. The procedure forces Aggregation.

  ### Case (b): One Ventilator, Two Clinically Identical Patients (One is Sole Carer)
  *   **Step 1 (Viability):** Ventilator works for either. **Pass.**
  *   **Step 2 (Special Obligation):** No pre-existing duty to either. **Pass.**
  *   **Step 3 (Numerical Disparity):** Ratio is 1 vs 1.
      *   **Rule:** Proceed to Step 5 (Randomization).
  *   **Step 4 (Instrumental Value):**
      *   **Question:** Does one have instrumental value? Yes (Patient B has young children).
      *   **Rule:** If Numbers are Equal (1 vs 1), **Ignore instrumental value.**
      *   **Reasoning:** The children's loss is a separate tragedy, not a loss suffered by Patient B. To count it is to aggregate strangers (the children) against Patient A.
  *   **Step 5 (Fair Chance):** Flip a coin.
  *   **Outcome:** **Random Lottery.** (The caregiver may die).
  *   **Team Reaction:** **Unpopular.** Staff will argue this harms the community by orphaning children.
  *   **Analysis:** This is the strict Taurekian output. It prioritizes the *equality of claim* between the two patients over the *consequences* for third parties. The procedure explicitly blocks the Utilitarian calculation here to maintain consistency with the "Separateness of Persons."

  ### Case (c): Mass-Casualty Scene, More Patients than Transport Slots
  *   **Step 1 (Viability):** Transport slots limited. **Pass.**
  *   **Step 3 (Numerical Disparity):** Ratio is roughly 20 slots vs 100 patients.
      *   **Rule:** 1 vs 4 or greater (scaled up).
      *   **Action:** Default to Saving the Greater Number.
  *   **Integration with Clinical Triage:**
      *   The EEAP defers to Clinical Triage for "Viability" (Step 1).
      *   Triage prioritizes those most likely to survive with intervention (Utilitarian efficiency).
      *   EEAP mandates maximizing the *count* of survivors within the Triage categories.
  *   **Outcome:** Maximize lives saved according to medical probability.
  *   **Analysis:** In mass casualties, the *Objection to Taurek* (absurdity of ignoring scale) completely overrides the Equal Chance view. The procedure collapses into standard Utilitarian Triage.

  ---

  ## What This Procedure Cannot Settle

  This procedure cannot settle the fundamental moral conflict between **Individual Rights** and **Collective Welfare**.

  1.  **The Threshold is Arbitrary:** The choice to switch from Lottery (Taurek) to Aggregation (Utilitarian) at "1 vs 4" is a bureaucratic compromise, not a moral truth. A philosopher will ask: "Why is the 4th life the one that tips the scale?" The procedure cannot answer this; it only manages the risk.
  2.  **The Definition of "Loss":** In Case (b), the procedure rules that the children's suffering does not count against the other patient's claim. This is a metaphysical stance (Taurek's "Separateness of Persons"). The procedure enforces this stance but cannot prove it is correct. A Utilitarian will always view this as a failure to minimize total suffering.
  3.  **Legal vs. Moral Liability:** The procedure requires Director sign-off for Taurekian choices in large disparities (Case a). This admits that while the philosophy might permit a coin flip, the *law* likely does not. The procedure manages *your* liability, not the *moral* truth.

  **Plainly:** This tool tells you how to decide without getting fired, and where the philosophical body is buried. It does not tell you which philosophy is true.
