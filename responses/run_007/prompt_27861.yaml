answer: |-
  ### The obstacle

  The obstacle is epistemological asymmetry. Pascal argues justice is "subject to dispute," whereas might is "easily recognised." As competing claims exist ("there are always offenders"), no single conception of justice possesses the universal authority required to wield might without resistance. If you arm a specific justice, opponents dispute the justice, not merely the force. Consequently, might cannot reliably serve justice because justice lacks self-evident certainty. Instead, might usurps the role of arbiter: "might has gainsaid justice, and has declared that it is she herself who is just." Force does not wait for moral consensus; it imposes itself as the standard. The obstacle is that justice requires recognition to command might, but might commands recognition without justice. Thus, the instability of moral truth prevents force from becoming justice's servant; force inevitably becomes the master that defines truth. This structural uncertainty ensures power resists moral subordination.

  ### The sense of 'making the strong just'

  This phrase denotes legitimization, not moral transformation. Pascal does not suggest power acquires intrinsic righteousness. Rather, through the verb "declared," he indicates a performative appropriation of language. When might establishes order, it appropriates the title of justice to secure obedience. The clause "we have made what is strong just" describes a social convention where legitimacy is retroactively assigned to successful force. It is a linguistic sleight of hand: because might is "not disputed," it absorbs the undisputed authority belonging to the concept of justice. Here, "just" functions descriptively, not normatively regarding moral worth. The strong are not made good; they are made authoritative. This reflects the "reason of effects": we obey power not because it is right, but because we have linguistically conflated strength with right to resolve the dispute over justice. Ultimately, might creates the appearance of justice.

  ### Prescription or description?

  The second paragraph overturns the prescriptive hope of the first. Paragraph one proposes a normative synthesis ("We must then combine"), offering two paths. Paragraph two eliminates the first path ("unable to make what is just strong") and reveals the second ("made what is strong just") as a historical necessity rather than a moral choice. It shifts from political theory to political sociology. The "must" of the first paragraph collapses into the "have" of the second. Pascal is not offering a solution but diagnosing a condition: the ideal union is impossible because justice lacks self-evident authority. The second paragraph functions as a cynical correction, exposing the foundational violence of law. It completes the argument not by fulfilling the ideal, but by explaining why the ideal fails and describing the flawed reality that replaces it. Normativity yields to historical reality.
