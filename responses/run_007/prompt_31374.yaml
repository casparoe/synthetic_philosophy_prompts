answer: |-
  You have identified a genuine and frustrating argumentative failure mode that is frequently observed in rationalist-adjacent spaces, policy debates, and effective altruism circles. Despite its prevalence, there is **no single, canonical term** for this specific pattern in the standard rationalist lexicon or formal logic textbooks.

  However, it is widely recognized as a specific failure mode of motivated reasoning. Below is an analysis of the available terminology, how to characterize the pattern precisely, and why the Precautionary Principle is uniquely susceptible to it.

  ### 1. Is there an established name?

  There is no universally agreed-upon label like "Ad Hominem" or "Straw Man" for this specific maneuver. However, it is often discussed under three overlapping umbrellas:

  *   **Special Pleading:** In formal logic, this is the closest traditional fit. It involves applying a standard or principle to others while making oneself (or one's preferred case) an exception without sufficient justification. However, "Special Pleading" usually implies a conscious or obvious inconsistency, whereas your example highlights an *unconscious* or *invisible* shift.
  *   **Motte-and-Bailey (Colloquial Usage):** You correctly noted that this differs from the strict definition of the Motte-and-Bailey fallacy (where the "Bailey" is indefensible). However, in many rationalist forums (e.g., LessWrong), the term is often used loosely to describe *any* strategic retreat from a strong claim to a weak claim under pressure, regardless of the defensibility of the strong claim. If you used this term in a comment section, many would understand you, though purists would object for the reasons you stated.
  *   **Isolated Demand for Rigor (IDFR):** This is the closest rationalist-specific concept. IDFR typically refers to demanding high evidentiary standards for a belief one opposes while accepting low standards for a belief one holds. Your pattern is essentially **IDFR applied to normative thresholds** rather than epistemic evidence. Some community members might call this an "Isolated Demand for Stringency."

  If you need a label for this specific phenomenon, the most precise descriptive term currently in circulation is **"Motivated Principle Elasticity"** or **"Principle Drift."** These capture the idea that the principle itself is not breaking, but its "stretch" or "strength" is being manipulated by motivation.

  ### 2. How to characterize and distinguish it

  To distinguish this pattern from Motte-and-Bailey, IDFR, and legitimate contextual adjustment, you should characterize it as **"Invariant Label, Variable Parameter."**

  The arguer treats the *name* of the principle (e.g., "The Precautionary Principle") as a constant, while silently adjusting the *parameters* (e.g., the threshold of proof required, the definition of "harm," or the scope of "action") to fit the desired conclusion.

  Here is how to distinguish it from the nearby concepts:

  *   **Vs. Motte-and-Bailey:**
      *   *Motte-and-Bailey:* Relies on one position being trivial/defensible (Motte) and the other being controversial/indefensible (Bailey). The arguer knows (consciously or not) that the Bailey is weak.
      *   *This Pattern:* Both the Strong and Weak formulations are defensible in isolation. The fallacy lies not in the positions themselves, but in the **unacknowledged inconsistency of application** across similar cases. The arguer genuinely believes they are being consistent.
  *   **Vs. Isolated Demand for Rigor:**
      *   *IDFR:* Focuses on *evidence* ("Show me the data for X, but I don't need data for Y").
      *   *This Pattern:* Focuses on *policy thresholds* ("The burden of proof for X is 'beyond reasonable doubt,' but for Y it is 'preponderance of evidence'"). It is a shift in the *rule of decision*, not just the evaluation of facts.
  *   **Vs. Legitimate Contextual Adjustment:**
      *   *Legitimate:* The arguer explicitly states, "The principle applies differently here because the stakes are higher/lower," or "The baseline risk is different." The parameter shift is **transparent** and **justified by external variables** (e.g., magnitude of harm).
      *   *This Pattern:* The shift tracks **alignment with the arguer's preferences**, not external variables. The adjustment is **implicit** and presented as if the principle itself dictates the different outcomes naturally.

  **Diagnostic Test:** To expose this pattern, ask the arguer to write down the *algorithm* for the principle before evaluating the specific case. If they say, "Ban anything with a 1% risk of catastrophe," apply that algorithm to their preferred activity. If they suddenly introduce new variables ("Yes, but field epidemiology has *benefits* that offset the risk"), point out that those variables were not part of the original algorithm.

  ### 3. Why the Precautionary Principle is uniquely vulnerable

  You asked if this is specific to the Precautionary Principle (PP) or general to principles with crisp/graded formulations. The answer is both: the pattern can occur with any principle, but the PP is structurally prone to it for three reasons.

  **A. Under-Specification (The "Empty Core")**
  Legal scholar Cass Sunstein has argued that the PP is "empty" because it lacks an internal metric for *how much* precaution is required. It says "take precaution," but not "how much." This creates a large "parameter space" for the arguer to manipulate. A principle like "Do not murder" is crisp; "Do not risk harm" is graded. Any principle that relies on a **slider** (e.g., "reasonable doubt," "proportional response," "free speech") is vulnerable to Motivated Principle Elasticity.

  **B. Epistemic-Normative Bundling**
  The PP bundles an epistemic claim ("We are uncertain about the risks") with a normative claim ("Therefore, we should not act"). This allows the arguer to shift the goalposts on either end.
  *   *Shift 1 (Epistemic):* "The uncertainty is too high!" (When opposing a project).
  *   *Shift 2 (Normative):* "The cost of inaction is also a risk!" (When defending a project).
  Because the principle covers both uncertainty and action, the arguer can toggle which side of the bundle they emphasize without appearing to change the principle.

  **C. Asymmetry of Action vs. Inaction**
  The PP is inherently biased toward the status quo. It treats "new action" as risky and "inaction" as safe (or neutral). This makes it easy to apply the Strong Formulation to *new* proposals (Geoengineering, GoF) and the Weak Formulation to *ongoing* activities (Field Epidemiology, existing industrial processes) by framing the latter as "the baseline." The arguer doesn't feel they are shifting the principle; they feel they are correctly identifying what counts as an "intervention."

  **Conclusion**
  While there is no single canonical name, **"Motivated Principle Elasticity"** accurately describes the unacknowledged shifting of a principle's stringency to match desired outcomes. It is distinct from Motte-and-Bailey because both positions are defensible, and distinct from legitimate adjustment because the shift is driven by preference rather than transparent criteria. The Precautionary Principle is a prime vector for this because it is under-specified and bundles uncertainty with normativity, but you should expect to see the same pattern with any principle that relies on graded thresholds (e.g., "Freedom of Speech," "Privacy," "Proportionality").
