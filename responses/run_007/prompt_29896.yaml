      *   **Implications:** Training procedures, deletion/modification, experiments.
      *   **Audience:** 40 people (1/3 Philosophers of Mind [skeptics/illusionists], 1/3 ML Researchers [pragmatic/skeptical of relevance], 1/3 Policy/Governance [longtermist but wary of speculation]).
      *   **Format:** Q&A Prep Sheet (8 objections, ordered by damage potential, phrased as audience members would ask, 2-minute reply, candid weakness note).
      *   **Special Requirement:** Include the "Question I should most hope nobody asks."
      *   **Time:** 40 min talk, 20 min Q&A.

  2.  **Deconstruct the Audience & Potential Objections:**
      *   *Philosophers of Mind:* Will attack the theoretical basis. Is the PP applicable here? What is the probability threshold? Is "moral status" coherent without consciousness? Illusionists will say consciousness isn't real anyway.
      *   *ML Researchers:* Will attack practicality. How do I know *which* models? Does this stop progress? Is this just Luddism? "Operationalize this."
      *   *Policy/Governance:* Will attack implementation. Who decides? Regulatory capture? Paralysis? Opportunity costs (slowing down beneficial AI).

