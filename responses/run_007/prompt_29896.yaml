      *   2-minute reply? (Check word count).
      *   Candid weakness note? Yes.
      *   "Hope nobody asks" included? Yes.
      *   Context: Centre for Governance of AI (Oxford-ish vibe, rigorous, EA-adjacent).

  7.  **Final Polish:** Ensure the distinction between "moral status" and "legal rights" is clear, as that's a common conflation. Ensure the "asymmetry of error" is defended against the "paralysis" critique.

  *(Drafting the response...)*
  *   *Objection 1 (Policy/Longtermist):* Opportunity cost. Slowing AGI safety.
  *   *Objection 2 (ML):* Which models? Architecture specifics.
