      *   *Is "standing" doing different work?* Absolutely. Sometimes it means "moral permission," sometimes "effective communication," sometimes "virtue consistency."
      *   *Conclusion:* The user's intuition is sharp and correct. This is a classic case of "theoretical pluralism" masquerading as disagreement.

  3.  **Deconstruct the Four Camps (Mental Check):**
