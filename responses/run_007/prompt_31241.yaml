      *   Is the problem *moral* (unfairness) or *pragmatic* (ineffective)?

  5.  **Formulate the Reframing/Path Forward:**
      *   *Diagnosis:* The stalemate exists because "blame" is a cluster concept. The theories are capturing different *dimensions* of blame.
      *   *Reframe 1: Functional Pluralism.* Accept that different theories explain different *functions* of blame. Hypocrisy undermines different functions in different contexts.
      *   *Reframe 2: The Audience Perspective.* Shift from "Does the blamer have standing?" to "Why does the blamee (or audience) reject the blame?" This moves it to moral psychology.
      *   *Reframe 3: Degrees of Hypocrisy.* Not all hypocrisy is equal. (Self-exempting vs. weak-willed vs. deceptive). Maybe standing is scalar, not binary.
