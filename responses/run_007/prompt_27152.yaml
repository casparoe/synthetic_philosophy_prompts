      *   *Reading 2: Testimonial Dependence.* The AI is a testifier (like a senior dev). The engineer relies on the AI's "testimony" (code output). The norm requires some verification (reading diff), but accepts the AI's authority on the *reasons*. This fits the "Division of Epistemic Labor."
      *   *Reading 3: The "Understanding" Critique (Grimm, Hills, etc.).* Understanding requires grasping dependency relations. The current practice actively undermines understanding because it decouples success from explanatory grasp. The practice presupposes a deflationary view of understanding that might be epistemically dangerous long-term.

