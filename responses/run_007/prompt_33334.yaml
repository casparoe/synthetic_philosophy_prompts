      *   *Clarification:* Make sure to distinguish between *causing* death and *being responsible for* death. This is the key to Case 1 vs. Case 2.
      *   *Key Terminology:* Introduce "Counterfactual Dependence," "Normative Expectations," "Acts vs. Omissions."
      *   *Refining the Famine Case:* This is Peter Singer's "Famine, Affluence, and Morality." Need to mention that Singer argues the *moral* obligation exists regardless of causal status, but some argue the causal link is too attenuated.

