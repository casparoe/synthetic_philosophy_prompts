prompt: |-
  ok so i'm in this philosophy club at my high school (yes we exist, theres like six of us) and we've been stuck on this one thing for weeks and I'm hoping you can help because you're literally an expert on causation and action theory.

  the thing is about when we say someone "caused" something by NOT doing something. like, here are the cases we keep going in circles on:

  - case 1: i promise my neighbor i'll water her plants while she's away. i forget. plants die. everyone says i caused the plants to die.
  - case 2: i never promised anything. i just walk past her house every day, see the plants are dry, dont water them. plants die. nobody says i caused it — even though in BOTH cases, the plants died because i didnt water them. the only difference is whether i had some kind of duty or promise.
  - case 3: a lifeguard sits on his chair and watches someone drown. we say he caused the death (or at least is responsible). but if i'm just some random guy at the beach who can't even swim, and i also watch someone drown, nobody says i caused it.
  - case 4: theres a famine in another country. i could donate $20, i dont, someone dies. did i cause their death? most people say no, you just didn't help. but some people (peter singer types) say that in a world where you can so easily donate, your inaction IS a cause.

  so it seems like whether an omission counts as a cause depends on... what exactly? whether you had a special role? whether you made a promise? whether the harm was "close" to you? and then theres the deeper question of whether omissions are even the kind of thing that CAN be causes — like, causes are supposed to be events or forces or something, and "not doing something" is an absence, not a real thing in the world.

  i'm trying to figure out if there's an established name for this whole problem — the problem of when and why we treat omissions as causes. and i dont just want a label, i want to understand the LAY OF THE LAND. like, what are the main positions philosophers have taken on this? is there a distinction between "real" causation and moral responsibility that people are conflating? is there a camp that says omissions are never causes and another camp that says they are? what's the standard taxonomy?

  please think through this step by step — start by laying out the different cases and edge cases, then map the philosophical positions onto them, and dont just give me a term and call it a day. i want to understand the boundaries of the concept(s) and where the genuinely hard cases are.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school philosophy club member (one of six). Enthusiastic, clearly thought deeply about the problem, but needs structure and expert guidance.
      *   **Topic:** Causation by omission (negative causation).
      *   **Specific Cases:**
          1.  Promise to water plants -> didn't -> plants die (Causal/Moral responsibility accepted).
          2.  No promise -> walked by -> didn't water -> plants die (Causal/Moral responsibility rejected).
          3.  Lifeguard vs. Random Bystander (drowning).
          4.  Famine/Donation (Peter Singer style).
      *   **Core Question:** What determines when an omission counts as a cause? Is there a distinction between causation and responsibility? What are the main philosophical positions?
      *   **Goal:** Provide the "lay of the land," taxonomy of positions, distinctions between metaphysics and ethics, and avoid just giving a label.
      *   **Tone:** Encouraging, rigorous but accessible (high school level but treating them like serious thinkers), structured.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Name:** The problem is generally known as "Causation by Omission" or "Negative Causation." It sits at the intersection of Metaphysics (Philosophy of Action/Causation) and Ethics (Moral Responsibility).
      *   **The Tension:** Metaphysically, "nothing" shouldn't cause "something." Ethically/Legally, we hold people responsible for not acting all the time.
      *   **The Key Distinction:** Causation (Metaphysical) vs. Responsibility (Normative). This is the crucial hinge point for the user's confusion.

  3.  **Map the Philosophical Positions (The "Lay of the Land"):**
      *   *Position 1: The Skeptics/Privativists.* Omissions aren't real events. They can't be causes. If we blame someone, it's not because they *caused* it, but because they *allowed* it or were *responsible* for preventing it. (Honoré, some legal theorists).
      *   *Position 2: The Counterfactualists.* Causation is about dependence. If I had watered, plants would live. If I didn't, they die. Therefore, my not watering caused the death. This makes *too many* things causes (the "proliferation problem"). (Lewis).
      *   *Position 3: The Normative/Contextualists.* Causation isn't just physics; it's sensitive to norms, expectations, and duties. An omission is a cause *relative to a background of expectations*. This bridges the gap between Case 1 and Case 2. (Hart & Honoré, McGrath).
      *   *Position 4: The Distinction View.* Separate "Causation" (physical) from "Responsibility" (moral/legal). Omissions are never physical causes, but they can be bases for responsibility.

  4.  **Address the Specific Cases:**
      *   *Case 1 vs. 2 (Plants):* Why the difference? Duty/Expectation. Metaphysically identical, normatively distinct.
      *   *Case 3 (Lifeguard):* Role obligation.
      *   *Case 4 (Famine):* Proximity vs. Capacity. The "Overdemandingness" objection.

  5.  **Structure the Response:**
      *   **Introduction:** Validate the question (it's a classic, deep problem). Name it ("Causation by Omission").
      *   **The Core Puzzle:** The metaphysical weirdness (how can nothing do something?) vs. the intuitive reality (we blame people for not acting).
      *   **Taxonomy of Views:**
          1.  *The Counterfactual View (Lewis):* Yes, omissions are causes. (Problem: Too many causes).
          2.  *The Skeptical/Privative View:* No, omissions aren't events. (Problem: Doesn't match legal/moral practice).
          3.  *The Normative/Contextual View:* Causation depends on duties/expectations. (The likely solution to Case 1 vs 2).
          4.  *The Two-Concept View:* Separate Causation from Responsibility.
      *   **Applying the Views to the Cases:** Walk through Plants, Lifeguard, Famine using the taxonomy.
      *   **The "Hard Cases" & Boundaries:** Where do philosophers still fight? (The Famine case is the biggest battleground).
      *   **Conclusion/Next Steps:** Recommendations for reading/discussion.

  6.  **Drafting the Content (Iterative refinement):**
