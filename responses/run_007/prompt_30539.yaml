answer: |-
  ### The Readings

  1.  **Strict Frequentism:** Probability is defined strictly as the limit of relative frequency in an infinite sequence of trials. Since a single event cannot constitute a sequence, attributing probability to it is a category error.
  2.  **Reference Class Problem:** Any singular event belongs to infinitely many reference classes, each yielding different frequencies, so no unique probability value exists. Without a privileged class, the specific number assigned is arbitrary.
  3.  **Verificationism:** A statement is cognitively meaningful only if it can be empirically verified or falsified. Since a single-case chance cannot be tested by repetition, the claim is empirically empty.
  4.  **Ontic Chance Denial:** Objective chances exist only as physical propensities of repeatable setups, not as properties of individual occurrences. Therefore, singular events possess only epistemic probabilities, not objective chances.
  5.  **Hard Determinism:** The universe is deterministic, so every event either certainly happens or certainly does not. Probability merely reflects human ignorance, not a feature of the event itself.
  6.  **Linguistic Convention:** The word 'probability' is conventionally reserved for generalisations over types, not tokens. Using it for singulars is simply a misuse of terminology.
  7.  **Epistemic Reductionism:** Probability statements about singulars are just shorthand for evidence strength, not independent facts. Thus, there is no 'probability of the event' distinct from the 'probability given the evidence'.

  ### Verdicts

  1.  Defensible (within strict frequentist frameworks).
  2.  Defensible substantive thesis.
  3.  False (verificationism is largely discredited).
  4.  Defensible substantive thesis.
  5.  False (contradicted by quantum mechanics).
  6.  Platitude (true by stipulative definition).
  7.  Defensible substantive thesis.

  ### Which readings do the dismissing

  Your lecturer is most likely relying on **Strict Frequentism** or the **Reference Class Problem** to waive away your queries. Under Strict Frequentism, 'tomorrow' is a singleton that cannot be repeated, rendering '70%' ill-defined; similarly, the patient is a unique token, not a repeatable trial. The Reference Class Problem supports this dismissal by suggesting that without agreeing on which class the patient belongs to (age group? symptom profile? geography?), the 40% figure is arbitrary rather than factual. These readings allow the lecturer to treat the probabilities as ontologically or methodologically invalid rather than merely uncertain.
