prompt: |-
  Draft an adversarial-collaboration document between a realist and an instrumentalist about the ontological status of representations in deep neural networks, as debated in the mechanistic interpretability literature. The realist maintains that when researchers decompose an LLM's activations into features — curve detectors in vision models, sentiment directions, truth-tracking probes — they are discovering representations the network genuinely uses to process information. The instrumentalist maintains that these decompositions are researcher-imposed; the network computes functions, but the attribution of representational content to its internal states is a projection that picks out no mind-independent fact. The document should include:

  (1) Agreed Claims (roughly 400 words): a numbered list of claims both sides can sign, covering what interpretability techniques establish mathematically, what they do not establish, and what both sides grant about the empirical findings.

  (2) Disagreements Table: a table with columns for the issue, the realist formulation, and the instrumentalist formulation. Each camp's formulation should be one the camp would endorse as capturing its own view. Include at least the following rows: whether representational content is discovered or ascribed; what would make a particular feature attribution correct or incorrect; and whether the absence of a canonical decomposition undermines realism.

  (3) Cruxes (roughly 300 words): the sub-questions on which the dispute turns, with a brief explanation of why each is a crux — i.e., what each side would have to concede if the crux were resolved against it.

  (4) Predictions (roughly 250 words): for each crux, the empirical or theoretical result each side expects, stated in advance, and what each side would count as evidence against its own position.

  I am a PhD student in philosophy of cognitive science organizing a workshop on the foundations of interpretability, and I want a document that moves past slogans and clarifies what is genuinely at stake.
