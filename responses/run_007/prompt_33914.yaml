answer: |-
  # Adversarial Collaboration: The Ontology of Neural Features

  ### (1) Agreed Claims
  **Both parties endorse the following claims regarding the current state of mechanistic interpretability:**

  1.  **Mathematical Specificity:** Interpretability techniques (probing, Sparse Autoencoders, causal mediation) identify specific mathematical structures within the network, such as directions in activation space or subgraphs of the computational graph. Both sides agree on the linear algebra and calculus governing these identifications.
  2.  **Predictive Utility:** Decompositions labeled as "features" (e.g., "sentiment," "curve detection") successfully predict model behavior on out-of-distribution data and under causal intervention better than baseline null models. Both sides grant that these decompositions are empirically adequate for engineering and safety goals.
  3.  **Non-Uniqueness Theorem:** There is no mathematical theorem guaranteeing a unique decomposition of a neural network's function into human-interpretable features. Multiple distinct sets of features can reconstruct the same input-output mapping with equivalent loss.
  4.  **Semantic Gap:** The mapping from vector directions to natural language concepts (e.g., labeling a vector "truthful") relies on human judgment and external datasets. Both sides acknowledge that the network optimizes for loss, not semantic coherence.
  5.  **Causal Efficacy:** Intervening on identified features (e.g., ablating a "sentiment direction") reliably alters output distributions. However, both sides agree this demonstrates causal relevance of the *activation*, not necessarily the ontological reality of the *concept* associated with it.
  6.  **Architectural Contingency:** Feature structures vary across architectures and training runs. While high-level behaviors are robust, the specific internal mechanisms implementing them are not guaranteed to be identical across models trained on the same data.
  7.  **Operational Consensus:** Regardless of ontology, both sides agree that interpretability research should proceed using current methodologies. The debate concerns the *description* of success, not the *pursuit* of it.

  ### (2) Disagreements Table

  | Issue | Realist Formulation | Instrumentalist Formulation |
  | :--- | :--- | :--- |
  | **Ontological Status** | Features are **discovered** natural kinds. The network's weights encode specific variables (e.g., "dog") that exist independently of the observer's conceptual scheme. | Features are **ascribed** useful fictions. The network computes functions; "representations" are projections imposed by researchers to make the function intelligible to humans. |
  | **Truth Conditions** | A feature attribution is correct if it corresponds to the actual causal variable the network utilizes. There is a mind-independent fact of the matter about whether a "truth direction" exists. | A feature attribution is correct if it yields predictive leverage and explanatory coherence. Truth is pragmatic: a feature is "real" only insofar as it simplifies the model of the model. |
  | **Basis Ambiguity** | The absence of a canonical decomposition is an epistemic hurdle, not an ontological one. A "true" basis exists but is obscured by superposition and noise. | The absence of a canonical decomposition undermines realism. If the math allows infinite equivalent bases, selecting one as "the representation" is a choice of coordinate system, not discovery. |
  | **Superposition** | Polysemanticity (neurons encoding multiple features) is a compression mechanism for distinct, real features sharing physical substrate. | Polysemanticity suggests features are not discrete units. The "feature" is an artifact of forcing a discrete ontology onto a continuous, distributed dynamical system. |

  ### (3) Cruxes
  **The dispute turns on the following sub-questions:**

  1.  **Convergence of Decompositions:** If different interpretability methods (e.g., SAEs vs. NMF) applied to the same model converge on semantically similar features without human supervision, this suggests a mind-independent structure (Realist). If features diverge significantly based on hyperparameters (e.g., dictionary size) or initialization, this suggests features are artifacts of the decomposition method (Instrumentalist).
  2.  **The "Alien" Test:** If an intelligence without human semantic concepts analyzed the network, would they carve the activation space at the same joints (e.g., identifying a "dog" cluster)? Realists argue yes, because the environment structures the data. Instrumentalists argue no, because "dog" is a human category, not a mathematical necessity.
  3.  **Causal Isolation:** Can a feature be causally isolated without affecting unrelated capabilities? Realists expect clean ablations to remove specific concepts while leaving others intact. Instrumentalists expect "clean" ablations to be impossible due to distributed processing, implying features are overlapping approximations rather than discrete modules.

  *Stakes:* If convergence fails and causal isolation proves impossible, the Realist must concede that "features" are merely convenient coordinate systems. If convergence holds across architectures, the Instrumentalist must concede that the vector space possesses intrinsic structure independent of human priors.

  ### (4) Predictions
  **For each crux, the sides commit to the following expectations:**

  1.  **On Convergence:**
      *   *Realist:* Predicts that as SAE dictionary sizes increase, feature semantics will stabilize and align across different random seeds. *Falsification:* If feature semantics drift randomly with dictionary size, realism is untenable.
      *   *Instrumentalist:* Predicts that feature semantics will shift based on the sparsity penalty and loss landscape, reflecting the researcher's constraints rather than network truth. *Falsification:* If features converge perfectly regardless of decomposition constraints, instrumentalism loses force.

  2.  **On Cross-Architecture Alignment:**
      *   *Realist:* Predicts linear mappings will be found between features in distinct architectures (e.g., Transformer A to Transformer B) representing the same concepts. *Falsification:* If no isomorphic mapping exists between models trained on identical data, features are architecture-specific artifacts.
      *   *Instrumentalist:* Predicts alignment will be partial and require human-guided rotation. *Falsification:* If automatic, high-fidelity alignment emerges without human priors, the "projection" claim is weakened.

  3.  **On Causal Specificity:**
      *   *Realist:* Predicts interventions on specific features will degrade specific capabilities without collateral damage. *Falsification:* If ablating a "sentiment" feature degrades syntax or factual recall, the feature was not a discrete causal unit.
      *   *Instrumentalist:* Predicts widespread collateral damage due to superposition. *Falsification:* If "surgical" interventions become routine and clean, the distributed/overlapping view requires revision.
