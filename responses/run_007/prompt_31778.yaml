answer: |-
  # Taxonomy of Sentience and Moral Status

  **Target Audience:** Graduate Seminar in Metaphysics of Mind
  **Subject:** The grounds of sentience in physical systems.

  The following taxonomy maps the logical space of positions regarding the metaphysical grounds of sentience. The branching questions are phrased in terms of ontological and supervenience commitments rather than theoretical labels. 

  ## The Taxonomy Tree

  **Q1: Does the predicate "is sentient" pick out a genuine, non-derivative property instantiated by some physical systems?**
  *   **NO:** ➔ **Leaf A: Eliminativism / Strong Illusionism**
      *   *(Commitment: Sentience is a folk-psychological posit with no referent, or the phenomenon is real but the concept is irredeemably confused.)*
  *   **YES:** ➔ *(Proceed to Q2)*

  **Q2: Does the instantiation of this property supervene specifically on the presence of biological constituents (e.g., carbon-based neurons, specific organic chemistry)?**
  *   **YES:** ➔ **Leaf B: Biological Chauvinism**
      *   *(Commitment: Sentience is nomologically or metaphysically tied to the specific stuff of evolved nervous systems; silicon or other substrates cannot realize it.)*
  *   **NO:** ➔ *(Proceed to Q3)*

  **Q3: Is the property determined by the system's *intrinsic* causal structure (the integrated cause-effect power of the mechanism itself), such that a system with the correct input-output profile but zero internal integration (e.g., a look-up table) would *fail* to be sentient?**
  *   **YES:** ➔ **Leaf C: Integrated Information Theory (IIT)**
      *   *(Commitment: Sentience is identical to, or necessitated by, high $\Phi$ (integrated information). Extrinsic function is insufficient; the physical mechanism must possess irreducible intrinsic cause-effect power.)*
  *   **NO:** ➔ *(Proceed to Q4)*
      *   *(Commitment: Sentience supervenes on extrinsic functional organization or abstract structure; a look-up table or functionally equivalent system counts as sentient.)*

  **Q4: Is the sentience-conferring organization defined by the system's *physical causal dispositions* relative to an environment, or by its *isomorphism to a formal syntactic engine*?**
  *   **Physical Causal Dispositions:** ➔ **Leaf D: Substrate-Neutral Functionalism**
      *   *(Commitment: Mental states are defined by their causal roles (input-state-output topology). The physical realization must genuinely sustain these causal powers, but the material is irrelevant.)*
  *   **Formal Syntactic Engine:** ➔ **Leaf E: Abstract Computationalism**
      *   *(Commitment: Mental states are defined by formal symbol manipulation. Implementation requires only that the physical states map onto the computational description; specific causal powers are secondary to structural isomorphism.)*

  ---

  ## Commentary on Fault Lines and Collapses

  ### 1. The Realism Fault Line (Q1)
  This is the primary ontological divide. Note that **Weak Illusionism** (sentience exists but is not what we think it is) may sit ambiguously near Leaf A or Leaf D depending on whether the "illusion" eliminates the *property* or merely our *concept* of it. For the purposes of moral status, Strong Illusionism (Leaf A) denies the bearer of status exists, whereas all other leaves affirm it.

  ### 2. The Substrate Fault Line (Q2)
  This separates **Natural Kind** views from **Functional/Structural** views. 
  *   **Empty Cell Diagnosis:** The path **YES (Q2) → NO (Q3)** is logically unstable. If one claims sentience requires specific biological matter (Q2=YES), one typically denies that abstract function alone suffices (Q3=NO). A position claiming "Only brains are sentient, but only because of their input-output profile, not their structure" is unoccupied. It is unattractive because if the profile is what matters, the biology shouldn't. This cell is effectively empty due to **explanatory redundancy**.

  ### 3. The Intrinsic/Extrinsic Fault Line (Q3)
  This is the sharpest metaphysical cut in contemporary philosophy of mind (often framed as *Structure vs. Function*).
  *   **IIT (Leaf C)** argues that causation must be *intrinsic* to the system (existing for the system itself). 
  *   **Functionalism/Computationalism (Leaf D/E)** argue that causation is *extrinsic* (defined by relations to inputs, outputs, and other states).
  *   **Empty Cell Diagnosis:** The path **YES (Q3) → Formal Syntactic Engine (Q4)** is incoherent. **Intrinsic causal power** (IIT's core commitment) is explicitly contrasted with **formal syntax**, which IIT proponents (and critics like Searle) argue is observer-relative. One cannot consistently hold that sentience depends on observer-independent intrinsic causation while simultaneously defining that sentience via observer-relative syntactic mapping. This cell is empty due to **conceptual incompatibility**.

  ### 4. The Causal/Formal Collapse (Q4)
  **⚠️ FLAGGED DISTINCTION: Substrate-Neutral Functionalism (Leaf D) vs. Abstract Computationalism (Leaf E)**

  Graduate students should note that this branching node represents the most porous boundary in the taxonomy. 
  *   **Why they are distinguished here:** Functionalism anchors mental states in *causal powers* (Armstrong/Lewis), requiring the physical realization to actually *do* the causing. Abstract Computationalism anchors them in *formal structure* (Fodor/Classic Cognitivism), where the physical realization need only *map* to the formalism.
  *   **Why they often collapse:** Most modern computationalists insist on "physical implementation," which requires causal powers. Most functionalists accept that causal roles are computationally describable. Consequently, many philosophers treat "Computational Functionalism" as a single position. 
  *   **Pedagogical Note:** If a student defends Leaf D but admits that any system implementing the right computation suffices (regardless of specific causal dynamics), they have slid into Leaf E. If a student defends Leaf E but insists the computation must be causally implemented to count, they have slid into Leaf D. This split is retained in the taxonomy primarily to highlight the **Triviality Argument** (Searle): Functionalists try to avoid it by demanding genuine causation; Computationalists must accept it or refine their notion of implementation.

  ### 5. Unexplored Territory
  *   **Path:** YES (Q1) → NO (Q2) → NO (Q3) → **Neither Causal nor Formal**.
      *   This cell represents views where sentience is non-biological and functionally defined, but neither causal-dispositional nor computational. **Dynamic Systems Theory** (non-representational embodied cognition) sometimes gestures toward this space, arguing for sentience based on temporal dynamics rather than discrete causal roles or syntax. It remains a minority position in the metaphysics of moral status.

  ---

  ## Summary of Leaves

  | Leaf | Position | Core Commitment regarding Moral Status Bearers |
  | :--- | :--- | :--- |
  | **A** | **Eliminativism** | No physical system is a bearer; moral status based on sentience is misguided. |
  | **B** | **Biological Chauvinism** | Only organisms with specific biological hardware are bearers. |
  | **C** | **IIT** | Only systems with high intrinsic causal integration ($\Phi$) are bearers. |
  | **D** | **Substrate-Neutral Functionalism** | Any system with the right causal topology is a bearer. |
  | **E** | **Abstract Computationalism** | Any system implementing the right formal computation is a bearer. |
