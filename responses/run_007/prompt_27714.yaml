answer: |-
  You have diagnosed the dialectic correctly. The debate over epiphenomenalism is one of the most persistent stalemates in analytic philosophy because it is not merely a disagreement about facts, but a **clash of explanatory frameworks**.

  The reason nobody budges is that the anti-epiphenomenalist and the epiphenomenalist are playing different games with different rules regarding metaphysics, semantics, and epistemology. When the anti-epiphenomenalist demands a causal story for intentionality, they are invoking a naturalistic constraint that the epiphenomenalist has already explicitly rejected for the specific case of qualia.

  Here is a diagnosis of the disagreement, broken down by the specific dimensions you raised.

  ### 1. Is there a hidden empirical question?
  **No.** This is not an empirical deadlock; it is a metaphysical underdetermination.

  Neuroscience can establish that neural state $N$ correlates with quale $Q$ and judgment $J$. It can even show that $N$ is sufficient for $J$. But neuroscience cannot determine the *metaphysical category* of $Q$.
  *   If $Q$ is physical (identical to or constituted by $N$), then $Q$ causes $J$.
  *   If $Q$ is non-physical but nomologically supervenient on $N$, then $N$ causes $J$ and $Q$ "rides along."

  Both scenarios are empirically equivalent. The disagreement is about whether the second scenario is *metaphysically coherent* or *explanatorily adequate*. No fMRI scan can tell us whether a correlation constitutes a causal link or a common-cause parallelism regarding non-physical properties. Therefore, waiting for a new experimental paradigm is futile.

  ### 2. Is it a dispute about what "aboutness" requires?
  **Yes, this is the substantive core of the stalemate.**

  The anti-epiphenomenalist is implicitly operating with a **Causal Theory of Reference (CTR)** or a robust **Teleosemantics**. On these views, for a mental state $J$ to be *about* $Q$, there must be an appropriate causal history linking $J$ to $Q$. If $Q$ is causally inert, it cannot fix the content of $J$. Therefore, $J$ is either about $N$ (the neural state) or nothing at all.

  The epiphenomenalist, however, usually rejects CTR for phenomenal concepts. They often rely on a **Phenomenal Concept Strategy** (e.g., Loar, Papineau, though they are physicalists, the logic applies here) or an **Acquaintance Theory**.
  *   **The Epi Move:** They argue that phenomenal concepts refer to their objects via a unique mode of presentation (direct acquaintance or structural isomorphism), not via causal tracking.
  *   **The Clash:** When the anti-epi says, "You haven't explained intentionality," they mean, "You haven't fitted intentionality into the natural causal order." The epi replies, "I don't need to; phenomenal intentionality is sui generis."

  This is a **substantive** disagreement, not merely verbal, but it is foundational. It is a disagreement about whether semantics must be naturalized. You cannot resolve this without first resolving whether the mind must be fully integrated into the causal closure of the physical.

  ### 3. Are the sides operating with different standards of explanation?
  **Absolutely.** This is perhaps the most diagnostic feature of the debate.

  *   **The Anti-Epiphenomenalist Standard:** *Integration.* An explanation is only satisfying if it shows how the phenomenon (qualia) plays a role in the broader causal network of the universe. If qualia are "danglers" (Smart's term), the explanation is incomplete because it leaves the mental ontologically isolated. The "coincidence" objection is actually an appeal to **Inference to the Best Explanation**: a world where $Q$ and $J$ match without causal contact is less parsimonious than a world where $Q$ causes $J$.
  *   **The Epiphenomenalist Standard:** *Irreducibility.* An explanation is only satisfying if it preserves the intrinsic nature of qualia. They argue that any theory that makes qualia causally potent inevitably reduces them to functional/physical roles (via the causal closure of the physical), thereby explaining away the very thing that needed explaining (the "what-it-is-like-ness"). For them, the "coincidence" is a brute nomological fact, which is less costly than eliminating the explanatory gap.

  The common-cause story feels complete to the epiphenomenalist because it secures the *reliability* of the judgment without compromising the *ontological distinctness* of the quale. It feels question-begging to the anti-epiphenomenalist because it secures reliability at the cost of *semantic contact*.

  ### 4. Is the self-stultification charge a knockout?
  **No, but it is the strongest pressure point.**

  The self-stultification argument (if epiphenomenalism is true, we can't know it) relies on the premise: **Knowledge requires a causal connection to the fact known.**
  *   **If you accept this premise:** Epiphenomenalism is self-refuting. You cannot know you have qualia if qualia don't cause your belief that you have them.
  *   **If you reject this premise:** Epiphenomenalism survives.

  Epiphenomenalists have two standard counters here, neither of which satisfies the opposition:
  1.  **Reliabilism:** Knowledge requires a *reliable* belief-forming mechanism, not necessarily a direct causal link. Since $N$ causes both $Q$ and $J$, the mechanism is reliable. (Anti-epi reply: Reliability without causal contact is luck in nearby possible worlds).
  2.  **Acquaintance:** We know qualia not by inference or causal tracking, but by *being* them. The relation of acquaintance is not causal. (Anti-epi reply: This is mysticism disguised as epistemology).

  The charge is not a knockout because it assumes a causal theory of knowledge, which is precisely what is at issue when discussing non-physical properties. However, it does force the epiphenomenalist into a corner where they must defend a non-naturalistic epistemology, which raises the "cost" of their view.

  ### 5. Diagnosis: What kind of disagreement is this?
  This is a **Framework Dispute** driven by competing "bedrock modal intuitions."

  *   **Side A (Anti-Epi):** Prioritizes the **Causal Closure of the Physical**. Their bedrock intuition is that the physical world is a closed system. If qualia affect the physical (judgments), they must be physical.
  *   **Side B (Epi):** Prioritizes the **Conceivability of Zombies / The Explanatory Gap**. Their bedrock intuition is that consciousness is essentially different from function. If qualia are physical/functional, the "hard problem" remains unsolved.

  The debate cycles because Side A attacks Side B's epistemology (self-stultification), and Side B attacks Side A's metaphysics (explanatory gap). They are talking past each other because they value different theoretical virtues. Side A values **systematic unity**; Side B values **phenomenal fidelity**.

  ### 6. What would actually move this debate?
  Since empirical data is irrelevant and logical arguments are stalemated by foundational intuitions, progress can only come from one of three avenues:

  **A. A Sharper Distinction between Metaphysical and Epistemic Versions (The Phenomenal Concept Strategy)**
  The most promising philosophical move (championed by physicalists like Papineau and Loar) is to argue that the *intuition* driving epiphenomenalism is correct (there is an explanatory gap), but the *metaphysical conclusion* is wrong. They argue the gap is between *concepts*, not *properties*.
  *   **Move:** If we can successfully model how a physical state can give rise to a concept that *feels* non-physical (a phenomenal concept) without the property itself being non-physical, the motivation for epiphenomenalism dissolves.
  *   **Status:** This is where the action is, but epiphenomenalists argue this just pushes the mystery back a step (why do these concepts have this unique nature?).

  **B. Formal Results on Common-Cause Structures and Content**
  A formal semantic model showing that **reference fixing is impossible without causal interaction** would devastate epiphenomenalism. Conversely, a formal model showing how **structural isomorphism** alone can secure reference without causation would vindicate it.
  *   **Status:** Unlikely to yield a knockout. Formal systems require axioms, and the axioms will simply encode the pre-existing intuitions of the builder.

  **C. Acceptance of a "Third Way" (Panpsychism or Illusionism)**
  The stalemate suggests the dichotomy (Physicalism vs. Epiphenomenal Dualism) is flawed.
  *   **Panpsychism:** Grants that consciousness is fundamental and causally potent (avoiding epiphenomenalism) but ubiquitous (avoiding the emergence problem).
  *   **Illusionism (Dennett, Frankish):** Denies the existence of the "ineffable qualia" that the epiphenomenalist is trying to protect. If there are no "raw feels" distinct from functional judgments, the causal inertness problem vanishes.
  *   **Status:** These views are gaining traction precisely because they dissolve the stalemate rather than trying to win the existing game.

  ### Summary
  The debate persists because it is a **clash of theoretical virtues**.
  *   The **Anti-Epiphenomenalist** wins on **Naturalistic Integration** (mind fits into science).
  *   The **Epiphenomenalist** wins on **Phenomenal Integrity** (mind feels like what it is).

  Until one side is willing to sacrifice their bedrock intuition (either accepting that consciousness might be an illusion, or accepting that the physical world is not causally closed), the three moves will continue to cycle. The "self-stultification" argument is not a knockout because it begs the question against non-causal epistemologies, which the epiphenomenalist is already committed to.

  **Recommendation:** If you are writing on this, do not try to solve the causal argument. Instead, analyze the **cost-benefit analysis** each side is performing. The debate isn't about who is right about causation; it's about which mystery we are more willing to live with: the mystery of causal danglers (Epi) or the mystery of the explanatory gap (Physicalism).
