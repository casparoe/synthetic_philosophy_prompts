answer: |-
  This is a **methodological impasse rooted in competing explanatory priorities**, not a resolvable verbal or purely metaphysical dispute. Your hunch is correct: the intellectualists are optimizing for semantic unity and epistemological parsimony, while the anti-intellectualists are optimizing for fidelity to the phenomenology of action and the psychology of skill. The debate feels stuck because both sides are playing different games with different rules of evidence, yet fighting over the same territory marked by the word "knowledge."

  Here is the reasoning behind this diagnosis:

  **1. Divergent Explananda (What is being explained?)**
  The core friction is that the two sides are trying to explain different primary data. Intellectualists (like Stanley & Williamson) treat the *linguistic behavior* of knowledge ascriptions as the primary datum. Their goal is to provide a unified semantics for "knows" across all contexts (knowing that, knowing how, knowing where). If the sentence structure looks propositional, the mental state should be too. Anti-intellectualists (like Ryleans or embodied cognitivists) treat *successful agency and skill acquisition* as the primary datum. Their goal is to explain how organisms navigate the world. If the phenomenology of riding a bike feels nothing like reciting a fact, the mental state should be distinct. Because they start from different phenomena, evidence that convinces one side (e.g., syntactic embedding) looks irrelevant to the other (e.g., muscle memory).

  **2. Competing Theoretical Virtues**
  The debate is a tug-of-war between two theoretical virtues: **unity** vs. **granularity**. Intellectualists value unity; they want to reduce all knowledge to a single relation between a subject and a proposition to keep epistemology clean. Anti-intellectualists value granularity; they want to distinguish states that function differently in the cognitive architecture. When intellectualists introduce "practical modes of presentation" to save their theory from counterexamples, they are prioritizing unity (keeping it as knowledge-that) at the cost of granularity (making the "mode" do so much work it risks becoming a distinct state anyway). Anti-intellectualists see this as ad hoc theorizing designed to protect a linguistic intuition rather than describe a mental reality.

  **3. Immunization Strategies**
  The reason the debate circles endlessly is that both sides have developed immunization strategies against the other's best attacks. When anti-intellectualists offer counterexamples (e.g., the paralyzed pianist who knows how but cannot act, or the infant who acts but lacks propositions), intellectualists adjust the "mode of presentation" or the "way" variable to accommodate the data without conceding the metaphysical point. Conversely, when intellectualists offer linguistic proofs, anti-intellectualists dismiss them as surface grammar that misleads us about deep structure (a classic Rylean move). Because each side treats their own preferred data set as the "real" reality and the other's as derivative or misleading, no argument penetrates the core commitment.

  **4. Not Merely Verbal, But Verbally Masked**
  This is not purely a verbal dispute because there are genuine metaphysical stakes regarding the architecture of the mind. If intellectualism is true, learning a skill is fundamentally acquiring information. If anti-intellectualism is true, learning a skill is fundamentally training a disposition. However, the dispute *manifests* as verbal because both sides are fighting over the extension of the word "knowledge." If they agreed to stipulate distinct terms (e.g., "Propositional Knowledge" vs. "Competence"), the debate would shift to whether Competence *reduces* to Propositional Knowledge. They refuse to do this because controlling the label "knowledge" grants normative authority over the domain. The semantic fight is a proxy for a fight over which philosophical sub-discipline (language vs. action) gets to define the epistemic landscape.

  **5. The Bedrock Intuition Gap**
  Ultimately, you are encountering a clash of bedrock intuitions that functions as a methodological boundary. Intellectualists have the intuition that knowledge is essentially representational. Anti-intellectualists have the intuition that knowledge is essentially functional/behavioral. Since these are starting points rather than conclusions, arguments derived from them cannot overturn them. The stalemate persists because neither side is willing to abandon their core intuition to accept the other's explanatory framework, and there is no neutral arbiter data that both agree trumps their respective priorities.
