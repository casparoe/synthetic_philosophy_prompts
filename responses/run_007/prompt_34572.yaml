  ok so i'm taking this epistemology seminar and we've spent three weeks on the knowing-how vs knowing-that debate. we read ryle, then stanley & williamson's 2001 paper that revived the intellectualist side, then a bunch of responses and counter-responses. and honestly i'm starting to feel like this debate is just... stuck. both sides have really smart people, both sides have responded to each other's objections, and yet nobody seems to have moved an inch. the intellectualists keep giving linguistic arguments about the syntax of embedded questions and knowledge ascriptions, and the anti-intellectualists keep pointing to skill-based counterexamples and saying look you're missing the phenomenology, and it just goes in circles.

  what i want to know is: what kind of disagreement is this, actually? is it a verbal dispute about the word "knows"? is it a substantive disagreement about the metaphysics of mental states? are they answering different questions under the same label? or is it one of those things where both sides have bedrock intuitions that no argument can reach?

  i have a hunch that the intellectualists and anti-intellectualists might just care about different things — the intellectualists want a unified semantics for knowledge ascriptions and the anti-intellectualists want a psychologically real account of skilled action — but i'm not sure if that's right or if it's too easy a diagnosis.

  lead with your bottom line — what kind of disagreement this really is — and then walk me through the reasoning. no preamble, don't restate my question, just give me the diagnosis and why.
