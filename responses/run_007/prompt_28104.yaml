answer: |-
  **Term Paper Proposal**

  **Title:** Clustered Hedonism: A Homeostatic Property Cluster Account of Pleasure and the Heterogeneity Objection

  **1. Research Question**
  Can a Homeostatic Property Cluster (HPC) model of pleasure resolve the heterogeneity objection to hedonism without collapsing into desire-satisfaction theory or losing the normative unity required to claim that pleasure is the sole intrinsic good?

  **2. Background and Motivation**
  Classical hedonism rests on two claims: that pleasure is the only thing intrinsically good, and that pain is the only thing intrinsically bad. The most persistent objection to this view is the heterogeneity problem. As noted by philosophers ranging from Sidgwick to contemporary critics, pleasures appear to share no single phenomenal quality. The feeling of quenching thirst differs radically from the satisfaction of solving a mathematical proof or the aesthetic enjoyment of music. If there is no common "feel" to pleasure, it is unclear what property hedonists are identifying as the good.

  In response, contemporary hedonists generally bifurcate into two camps. The first defends a "feeling theory," positing a distinct hedonic tone present in all pleasant experiences. This view struggles to accommodate the phenomenological diversity of pleasure without becoming implausibly abstract. The second camp defends an "attitude theory" (or functionalist account), defining pleasure not by how it feels, but by the subject's pro-attitude toward it (e.g., wanting the experience to continue).

  However, the attitude theory faces a significant dilemma. If pleasure is defined solely by the desire to sustain an experience, hedonism risks collapsing into a desire-satisfaction theory of value. This undermines the distinctive hedonist claim that pleasure is *good* and therefore desired, rather than desired and therefore *good*. My friend's defense of hedonism during our discussion fell into this trap, conflating the *criteria* for pleasure with the *attitude* toward it.

  Existing literature leaves a gap here. Most debates assume that for "pleasure" to ground a unified normative theory, it must be a natural kind with strict necessary and sufficient conditions (an essentialist view). If it fails essentialism, it is often treated as a disjunctive concept with no real unity. There is little exploration of intermediate ontological models. Specifically, the Homeostatic Property Cluster (HPC) model—widely used in the philosophy of biology to define species without essentialism—has not been sufficiently applied to the philosophy of value. This paper proposes to fill that gap.

  **3. Proposed Approach**
  I will argue that pleasure is best understood as a Homeostatic Property Cluster. On this view, instances of pleasure are unified not by a single essential property, but by a set of co-occurring properties (phenomenal, motivational, and causal) maintained by homeostatic mechanisms.

  **Methodology:**
  1.  **Exposition of the HPC Model:** I will briefly outline the HPC framework (drawing on the work of Richard Boyd), emphasizing how it allows for kind-membership without strict essentialism. Properties in the cluster need not all be present in every instance, provided they co-occur reliably enough to support inductive inference.
  2.  **Application to Pleasure:** I will construct a specific HPC account of pleasure. Candidate properties for the cluster might include: positive phenomenal tone, intrinsic motivation to sustain, attention-focusing effects, and specific neurophysiological markers. I will argue that while a warm bath and solving a proof may not share the *same* phenomenal tone, they share enough overlapping cluster properties to be legitimately classified under the same kind.
  3.  **Comparative Analysis:** I will demonstrate why this approach is superior to the two standard alternatives:
      *   *Vs. Functional/Attitude Accounts:* I will show that on the HPC view, the "pro-attitude" is merely one property among others in the cluster, not the definition of the kind. This prevents the collapse into desire-satisfaction theory. The attitude is a reliable *indicator* of pleasure, not its *constitutive essence*.
      *   *Vs. Disjunctivism:* I will argue that simple disjunctivism (saying "pleasure" is just a label for unrelated states) fails to explain why hedonism can treat all pleasures as normatively equivalent. The HPC model preserves the unity required for normative generalization because the cluster properties are homeostatically linked, not accidentally conjoined.
  4.  **Normative Defense:** Finally, I will address the normative component. If pleasure is a cluster, what makes the cluster *good*? I will argue that the homeostatic mechanisms binding the cluster are themselves linked to flourishing or well-being functions. The "goodness" attaches to the functioning of the cluster as a whole, allowing hedonism to maintain that all instances are intrinsically good in virtue of their cluster membership, even if they differ phenomenally.

  **4. Criteria for Success and Failure**
  **Success:**
  The project will be successful if I can demonstrate that:
  1.  The HPC model accommodates phenomenological diversity better than essentialist feeling theories.
  2.  The HPC model avoids the circularity/collapse of attitude theories by distinguishing the *properties* of pleasure from the *attitude* toward them.
  3.  The model provides a coherent basis for normative unity, explaining why distinct cluster-members all count as intrinsically good without resorting to stipulation.

  **Failure:**
  The project would fail if:
  1.  The HPC account turns out to be so permissive that it includes states intuitively excluded from pleasure (the "looseness" objection).
  2.  I cannot explain what binds the cluster together other than the fact that we call them "pleasure" (circularity).
  3.  The normative work remains unexplained; i.e., if pleasure is just a cluster of descriptive properties, the paper fails to bridge the is-ought gap to explain why that specific cluster is *intrinsically good*.

  **5. Scope and Feasibility**
  This proposal is designed for a 6,000-word term paper. To remain within scope, I will make the following limitations:
  *   **Defense of Hedonism:** I will not attempt to prove that hedonism is the *correct* theory of value. I will only argue that it is *viable* against the heterogeneity objection if it adopts an HPC framework. The goal is defensive, not offensive.
  *   **Defense of HPC:** I will take the coherence of the HPC model in metaphysics as a given. I will not defend the HPC theory of kinds against its own philosophical critics, but rather focus on its application to value theory.
  *   **Neuroscience:** While I will mention neurophysiological markers as potential cluster properties, I will not engage in a detailed survey of neuroscience literature. This will remain a conceptual analysis.
  *   **Historical Exegesis:** I will reference historical figures (e.g., Mill, Sidgwick) only where necessary to frame the heterogeneity objection, rather than providing a historical survey of hedonism.

  By narrowing the focus to the ontological status of pleasure and its implications for the heterogeneity objection, this scope is realistic for a one-semester timeline. The argument structure is linear: Problem -> Existing Solutions -> Proposed Solution -> Objections -> Normative Implications. This ensures the word count is distributed evenly across the critical analysis.
