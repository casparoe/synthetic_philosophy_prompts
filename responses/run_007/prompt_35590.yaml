  Consider two victims, Alex and Jordan, who experience identical psychological distress from the destruction of their creative work. Alex's physical manuscript is burned by a houseguest who ignored a verbal request not to touch it. Jordan's digital manuscript, stored on a collaborative platform, is deleted by a collaborator who exploited their granted editing permissions to bypass version history protections and erase the file permanently. Neither victim suffers financial loss, physical injury, or any downstream physical consequences from the destruction, yet the violation of the digital safeguards makes Jordan's harm the more serious moral wrong.

  (a) The virtual harm is the more serious wrong because it involves a **corruption of systemic trust** rather than a mere violation of interpersonal preference. In the physical case, the houseguest ignores a social norm (a verbal request), but in the virtual case, the collaborator weaponizes the very infrastructure designed to enable cooperation (editing permissions and version control). The key feature doing the work is the **violation of informational integrity**: digital spaces rely on code-based protocols to enforce consent, and bypassing these protocols undermines the reliability of the medium itself for everyone, not just the victim. This makes the act a violation of a public good (trust in digital systems) rather than solely a private wrong.

  (b) Someone who holds that virtual harms are not real harms would have to claim that **violating code-based consent is morally equivalent to or less serious than ignoring verbal consent**. To resist the conclusion, they would need to argue that because the manuscript was made of bits rather than paper, the method of its destruction carries less moral weight. This pushback would force them into the unwanted position that **digital contracts and permissions carry no inherent moral obligation**, implying that hacking a bank account via authorized credentials is less wrong than stealing cash from a wallet, or that software licenses are morally inert. This undermines the normative foundation of the entire digital economy and modern collaboration.
