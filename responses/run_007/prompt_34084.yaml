answer: |-
  # The 'What Do You Mean, Real?' Quiz

  You and your mate argue about whether beliefs are real things, like electrons, or just useful stories we tell. You probably won't agree after this, but you might find out exactly where you disagree.

  There are nine scenarios below. Don't overthink them. Pick the answer that feels right to you, even if you're not sure why. There are no wrong answers, only different ways of seeing the mind.

  ***

  ### 1. The Chess Machine
  A chess computer prints out a message: 'I want to win, so I will move my queen.' It plays brilliantly. Does the computer actually *want* to win?

  *   **A.** No. It's just silicon and electricity. Talking about 'wanting' is a metaphor.
  *   **B.** No. It lacks the right kind of internal biology or structure to have real wants.
  *   **C.** Yes, or at least it doesn't matter. If treating it as having wants helps us predict its moves, then it has wants.

  ### 2. The Split-Brain Patient
  A patient has had the connection between their brain hemispheres severed. When shown a picture only his right eye sees, his left hand points to a shovel. When asked why he pointed, his left hand writes 'Snow'. He isn't lying; he sincerely believes he saw snow. But we know he saw a shovel. Does he *really* believe he saw snow?

  *   **A.** No. The belief isn't there. His brain is making up a story to explain his hand's movement.
  *   **B.** Yes. He is disposed to say and write 'snow', so that counts as believing it.
  *   **C.** It's useful to say he believes it, because that's how we make sense of what he says next.

  ### 3. The Future Neuroscience
  Imagine it's fifty years from now. Neuroscientists can predict everything you do by scanning your neurons. They never need to use words like 'belief' or 'desire' to explain your actions. Should we stop using those words?

  *   **A.** Yes. If neuroscience explains it all without them, beliefs were never real to begin with.
  *   **B.** No. Those neural patterns *are* beliefs. We've just found out what they look like inside.
  *   **C.** No. Neuroscience is too detailed. 'Belief' is still the best way to talk about people in everyday life.

  ### 4. The Hypocritical Smoker
  Your friend says, 'I believe smoking kills,' but he smokes twenty a day. He isn't joking. Does he really hold that belief?

  *   **A.** No. If he really believed it, he wouldn't smoke. His actions show what he actually thinks.
  *   **B.** Yes. He has the inner state representing the danger, but his desires are stronger.
  *   **C.** Sort of. It's a belief he avows, but it's not fully integrated into his behavioural patterns.

  ### 5. The Jam Choice
  In a experiment, people choose between two identical jars of jam, one placed on the left, one on the right. They pick the right one. When asked why, they say, 'I preferred the texture.' They weren't aware the position influenced them. Do they believe they preferred the texture?

  *   **A.** No. That's a confabulation. The real cause was the position of the jar.
  *   **B.** Yes. Since they are sincerely disposed to claim it, the belief exists now.
  *   **C.** It doesn't matter. Attributing the belief to them is the best way to interpret their choice.

  ### 6. The Perfect Actor
  Imagine a robot that behaves exactly like a human in every situation. It cries at funerals, laughs at jokes, and says 'I believe it will rain.' But inside, there is no consciousness, just code. Does it have beliefs?

  *   **A.** No. Beliefs require an inner experience or state, not just output.
  *   **B.** Yes. If it acts like it has beliefs in every situation, then it has beliefs.
  *   **C.** We should treat it as having beliefs, even if we know it's just code.

  ### 7. The False Belief
  A child sees a box labelled 'Smarties'. It actually contains pencils. The child says, 'I believe there are Smarties inside.' Is there a real thing inside the child's head corresponding to that belief?

  *   **A.** No. There's just neural activity. The 'belief' is a label we put on it.
  *   **B.** Yes. There is a specific representational state causing the child's expectation.
  *   **C.** There is a state, but calling it a 'belief' is just our way of tracking the child's perspective.

  ### 8. The Thermostat
  A thermostat turns the heating on when the temperature drops. Can we say the thermostat 'believes' it is too cold?

  *   **A.** Absolutely not. That's ridiculous. It's just a switch.
  *   **B.** No. It's too simple. It doesn't have enough internal complexity to hold a belief.
  *   **C.** Why not? It detects a state and acts to change it. That's the basic pattern of belief.

  ### 9. The Introspection
  When you think about what you believe, it feels like you are looking at something inside you. Are you detecting a real state?

  *   **A.** No. It feels that way, but you're actually constructing a story about yourself.
  *   **B.** Yes. You are accessing your own internal representational states.
  *   **C.** You are noticing your own dispositions to act and speak.

  ***

  # Scoring Key

  This quiz isn't designed to give you a single letter grade. It's designed to show you which philosophical cluster your intuitions sit in. There are four main positions mapped here. Tally up which option (A, B, or C) you chose most often, but read the nuances below to see where you actually land.

  ### The Four Positions

  **1. Eliminative Materialism (Mostly A)**
  If you chose **A** on most questions, you are sceptical that beliefs exist at all.
  *   **The View:** You think 'belief' and 'desire' are parts of an old theory (folk psychology) that will eventually be replaced by neuroscience. When a patient confabulates (Questions 2 & 5), you say the belief isn't there because the causal chain is broken. When neuroscience advances (Question 3), you say we should drop the old terms.
  *   **Diagnostic Work:** Questions 3 and 9 are your strongest indicators. If you said A on Q3 (neuroscience replaces belief) and A on Q9 (introspection is construction), you are firmly here.
  *   **Limitations:** This quiz might confuse you with Instrumentalists on Question 1 (Chess), as both might reject the literal reality of the machine's 'want'. Look at Question 3 to separate you: Instrumentalists keep the talk; Eliminativists drop it.

  **2. Intentional Realism (Mostly B)**
  If you chose **B** on most questions, you think beliefs are real, internal causal states.
  *   **The View:** You think beliefs are like files in a computer or states in a brain. They cause behaviour. When a smoker says they believe smoking kills but smokes (Question 4), you say the belief is real but overridden by desire. When a split-brain patient confabulates (Question 2), you say the belief is *absent* because the right internal state isn't causing the speech.
  *   **Diagnostic Work:** Questions 2, 4, and 7 are key. You insist on an internal cause. In the confabulation cases (Q2 & Q5), you deny the belief exists because the internal link is fake. This distinguishes you from Dispositionalists.
  *   **Limitations:** You might look like a Dispositionalist on Question 6 (The Actor), but for different reasons. You say 'No' because the internal state is missing; they say 'Yes' because the behaviour is present.

  **3. Dispositionalism (Mixed B and C, leaning C on behaviour questions)**
  If you found yourself choosing **C** on questions about behaviour (4, 6, 8) but **B** on questions about internal states (7, 9), you might be here.
  *   **The View:** You think to 'have a belief' just is to be disposed to act in certain ways. There doesn't need to be a ghostly inner object.
  *   **Diagnostic Work:** Look at Questions 2 and 5 (Confabulation). Unlike the Realist, you might be tempted to say the belief *is* there because the patient is disposed to say it. Unlike the Instrumentalist, you think the belief is *real* as a disposition, not just a useful tool.
  *   **Limitations:** This quiz struggles to separate you from Instrumentalists. Both of you care about patterns and behaviour. The difference is ontological: do you think the disposition is a real thing (You) or just a way of talking (Instrumentalist)? Question 9 helps: if you think introspection detects dispositions, you're here.

  **4. Instrumentalism / Interpretationism (Mostly C)**
  If you chose **C** on most questions, you think belief-talk is a tool, not a description of inner machinery.
  *   **The View:** It doesn't matter if beliefs are 'real' inside. What matters is whether treating someone as having beliefs helps us predict them.
  *   **Diagnostic Work:** Questions 1 (Chess) and 8 (Thermostat) are your tell. You are willing to attribute beliefs to simple systems if it helps prediction. In confabulation cases (Q2 & Q5), you say it's useful to interpret the person as having that belief, regardless of the neural cause.
  *   **Limitations:** Hard to distinguish from Dispositionalism. Look at Question 3 (Neuroscience). An Instrumentalist keeps using belief-talk because it's useful, even if neuroscience explains the mechanism. An Eliminativist drops it. A Realist says they are the same thing.

  ### Specific Diagnostics: The Confabulation Questions

  You asked for the confabulation cases (Questions 2 and 5) to do heavy lifting. Here is how they separate the pack:

  *   **The Realist** says: The belief is **absent**. The sincere report is a symptom of a broken causal chain. The inner state required for the belief isn't there.
  *   **The Eliminativist** says: The belief is **absent**, but adds that *no one* has beliefs really. The confabulation just proves folk psychology is bad at spotting errors.
  *   **The Dispositionalist** says: The belief is **present**. To believe is to be disposed to act/speak. The patient is disposed to say 'snow', so they believe it.
  *   **The Instrumentalist** says: The question is **misplaced**. We should attribute the belief if it makes the patient predictable. Truth doesn't matter; utility does.

  *If you answered 'No' on Q2 but 'Yes' on Q4 (Smoker), you are likely a Realist.* (You care about the inner state in the patient, but allow inner states to exist even when behaviour contradicts them in the smoker).
  *If you answered 'Yes' on Q2 and 'No' on Q4, you are likely a Dispositionalist.* (You care about the disposition to speak in the patient, but require consistent behaviour in the smoker).

  ### Hybrids and Unstable Patterns

  *   **The Realist-Instrumentalist Hybrid:** You chose B on human questions (4, 7) but C on machine questions (1, 8). You think humans have real inner states, but we only use 'belief' talk for machines as a shortcut. This is a very common, stable position.
  *   **The Unstable Skeptic:** You chose A on Neuroscience (3) but B on Introspection (9). You think science will replace beliefs, but you trust your gut feeling that they are real. You haven't decided whether to trust the future scientist or your own mind.
  *   **No Stable Position:** If your answers bounce randomly between A, B, and C without a pattern (e.g., A on Q1, B on Q2, C on Q3, A on Q4), you might not have a fixed view yet. This is common. It usually means you are a Realist about some cases (humans) and an Instrumentalist about others (machines), but haven't worked out the rule for where the line is drawn.

  ### What This Quiz Can't Tell You

  *   **Dispositionalism vs. Instrumentalism:** These are notoriously close. Both deny the need for a 'little inner picture' of the belief. The quiz treats them similarly (mostly Option C). To separate them, you need to ask yourself: 'Is the disposition a real physical fact about the person (Dispositionalism), or is it just a useful way for me to talk about them (Instrumentalism)?'
  *   **Non-Reductive Physicalism:** Some Realists think beliefs are real but not identical to neurons (they emerge from them). This quiz lumps them in with standard Realists (Option B).
  *   **Phenomenology:** The quiz focuses on belief and behaviour. It doesn't touch heavily on qualia (what it feels like to see red), which might shift your views on consciousness but not necessarily on belief.

  *If you scored mostly A, buy a neuroscience textbook. If mostly B, look into cognitive architecture. If mostly C, read up on prediction and modelling. If you're mixed, you're probably doing philosophy correctly.*
