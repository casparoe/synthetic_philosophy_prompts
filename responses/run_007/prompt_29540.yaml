answer: |-
  The neon sign above the bar buzzed, casting a flickering red glow over Maya's notebook. Jordan swirled the ice in his whiskey, eyeing the equations she'd scribbled on a napkin.

  **Jordan:** So let me get this straight. You're telling me Paul Samuelson—who literally wrote the book on this—was missing something obvious about the Kelly criterion?

  **Maya:** Not missing something obvious. Missing the *interpretation*. Look, Samuelson says Kelly betting is just expected utility maximization where you happen to have a logarithmic utility function for wealth. It's a preference thing. You *like* log wealth.

  **Jordan:** And that's not enough? If the math outputs the same bet size, why do I care about the story behind it?

  **Maya:** Because the story tells you where the normativity comes from. Peters' point is that Kelly isn't about preferences. It's about physics. It's about ergodicity. In a multiplicative process—like investing— the ensemble average (what happens across parallel universes) diverges from the time average (what happens to *you* over time). The ensemble average says you should bet big because the expected value is positive. The time average says if you bet too big, you go to zero and stay there.

  **Jordan:** Okay, I know the ergodicity breach. Non-ergodic processes exist. But here's the thing, Maya: choosing to care about the time average *is* a preference. You're smuggling in a utility function under the guise of "dynamics." Why *must* I care about the long-run growth rate? Maybe I want to maximize my chance of buying a house next year, not in forty years.

  **Maya:** But if you maximize the wrong thing, you go bust. You can't buy the house if you're bankrupt. The argument is that geometric rationality isn't a preference; it's a survival constraint. If you treat non-ergodic processes as ergodic, you're making a category error about reality.

  **Jordan:** Hold on. You're conflating "going bust" with "maximizing growth." I can have a utility function that penalizes ruin heavily without committing to pure Kelly. I can have a log utility, sure, but I can also have a power utility. Samuelson's point was that if you reject Kelly, it just means your utility function isn't log. It doesn't mean you're irrational. It means you have different risk tolerances.

  **Maya:** But where do those tolerances come from? In standard expected utility theory, you just stipulate them. "I prefer this curve." Peters is saying the curve is derived from the system's dynamics. If wealth multiplies, you *must* use geometric means to assess performance. Using arithmetic expected value is literally calculating the wrong number for a single trajectory.

  **Jordan:** It's not the wrong number for *uncertainty*. Look, when I make a decision, I don't know which future I'm in. The ensemble average represents my uncertainty about the state of the world. It's a map of my ignorance, not a claim that parallel universes exist. By optimizing over the ensemble, I'm saying I care about the value of this decision across all possible outcomes weighted by their probability.

  **Maya:** But that assumes you get to experience all those outcomes. You don't. You get one timeline. If the process is non-ergodic, the ensemble average doesn't converge to what you experience. Ever. So why optimize for a number you will never see?

  **Jordan:** Because I might not be playing a long game. That's my big pushback on the ergodicity economics hype. What about the one-shot decision? Suppose I have a terminal illness. I have one bet to make before I die. No repetition. No time series. Does the Kelly criterion apply?

  **Maya:** ...Life is rarely truly one-shot. Even then, you care about legacy, or—

  **Jordan:** No, dodge the bullet. Strictly one shot. You die tomorrow. Do you still maximize geometric growth?

  **Maya:** If it's truly one shot, the distinction collapses. But those cases are rare. The normative force of Kelly is that life *is* a sequence.

  **Jordan:** But that's an empirical claim! You're building a normative theory of rationality on the empirical claim that "life is long." If I find myself in a situation where it's not long, your "physics of decision making" breaks down. Expected utility doesn't care. EU says: "Whatever your preference is over these outcomes, maximize it." It's flexible. Your ergodicity argument feels like it's saying "You *ought* to care about the long run," and then pretending that "ought" came from math.

  **Maya:** It's not that I *ought* to care. It's that if I don't, I disappear. The "ought" is hypothetical. If you want to remain an agent in the system, you must respect the ergodicity properties. EU assumes the agent exists to collect utility in every branch of the probability tree. But in reality, ruin removes the agent.

  **Jordan:** But EU can model ruin! I just assign utility zero to bankruptcy.

  **Maya:** You can, but you have to *choose* to assign it zero. And you have to choose the right function to avoid ruin in multiplicative scenarios. Kelly *derives* the avoidance of ruin from the multiplication itself. It feels like EU is patching holes with preferences, while ergodicity is pointing out the hole is structural.

  **Jordan:** I think you're giving preferences too little credit. Preferences *are* how we encode structural constraints of our psychology and situation. If I know ruin is bad, I put that in my utility function. The math of EU is just a framework for consistency. Peters wants to turn it into a theory of truth.

  **Maya:** But is it consistent to average over worlds you can't visit? That's the rub. If I tell you "The average height of a human is 5'9"," but you're trying to build a doorway for one specific person, the average might mislead you if the distribution is weird. Here, the distribution of wealth paths is weird. It's skewed. The mean is dominated by rare huge wins you probably won't get.

  **Jordan:** I get that. The median is a better predictor for a single trial. I'm not denying the statistics. I'm denying that this changes *rationality*. Rationality is about coherence between goals and actions. If my goal is "maximize money tomorrow because I die tonight," Kelly is irrational. If your theory says Kelly is always right, your theory is wrong. If your theory says "Kelly is right if you care about long term growth," then you're just back to Expected Utility with a specific goal.

  **Maya:** Maybe. But it shifts the burden of proof. In EU, the default is often arithmetic expectation unless you specify otherwise. In ergodicity, the default is time averages unless you can prove you're in an additive world. It changes the starting point. It stops us from treating risk preferences as purely psychological quirks and starts treating them as responses to the environment's dynamics.

  **Jordan:** I'll give you this: it's a useful heuristic to check if you're ignoring path dependence. But don't tell me Samuelson was wrong. He knew you could derive Kelly from log utility. He just didn't think log utility was the only rational game in town.

  **Maya:** And I'm saying log utility isn't a preference. It's the shadow cast by multiplicative dynamics on a rational agent who wants to stay in the game.

  **Jordan:** *wants* to stay in the game. There's the preference hiding again.

  **Maya:** *laughs* Touché. Another round?

  **Jordan:** Sure. But I'm betting half my stack. Just to be safe.

  Summary: The debate hinges on whether the Kelly criterion's avoidance of ruin is a universal structural requirement for agents in multiplicative systems (Maya) or merely one specific preference configuration within a broader, flexible framework of expected utility (Jordan).
