      *   *Objection 2: The "Rationality/Coherence" Problem.* If we all accept agent-relative constraints, do we collectively bring about more of what we all agree is bad (killing)? Is a moral theory that guarantees worse outcomes (by its own lights of "killing is bad") rational?
      *   *Objection 3: The "Threshold" Problem.* At what point does the aggregate outweigh the constraint? If it's 1 vs 5, you say no. What about 1 vs 1,000,000? If there's a threshold, isn't the view secretly consequentialist above that line? If there isn't, is it absurd?
      *   *Objection 4: The "Moral Fetishism" Objection (Michael Smith).* Are you caring more about your own purity than the victims?
