          *   Validity: This is the Aumann, Hart, Perry (1997) critique of Piccione & Rubinstein. They argue that absent-mindedness implies you cannot condition on "being at an intersection" in a way that changes probabilities from the ex ante perspective because the "self" at the intersection is the same agent as the planner. However, Rao's phrasing "Either he can condition... or he cannot" is a bit strong. The debate is about *how* to condition.

      *   **Chen's Second Reply (Asymmetry & Strategy):**
