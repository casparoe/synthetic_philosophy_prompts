prompt: |-
  In most ordinary moral discourse, we treat a piece of moral criticism as dismissible — or at least as carrying less weight — when it comes from someone who engages in the very conduct they are condemning. The cheating spouse who lectures others about fidelity, the polluting corporation that runs ads about environmental responsibility, the politician who evades taxes while denouncing public fecklessness: in each case the common reaction is not that the criticism is false, but that the speaker lacks the standing to make it. We say "you're one to talk," "clean up your own house first," "who are you to judge?" And this reaction isn't merely an emotional one; it is treated, in practice, as a reason to set the criticism aside — in workplace complaints, in public debate, in friendship, and sometimes even in legal reasoning (for instance, in the clean-hands doctrine in equity, or in the admissibility of certain character evidence).

  But this practice is puzzling in several ways. First, it seems to treat moral criticism as something other than the assertion of a true proposition: if the criticism is true, why should the identity of the speaker matter? We don't dismiss a mathematician's proof because the mathematician is a hypocrite. Second, the practice is selective. A judge who has committed crimes can still sentence a criminal; a philosopher who doesn't live by their own ethical views can still be correct; a doctor who smokes can still tell a patient to quit. So the practice of discounting hypocritical blame doesn't apply to all normative speech — it seems to track something specific about blame in particular. Third, the practice seems to presuppose that blame does something beyond describing a wrong: that it involves a kind of standing, authority, or entitlement that can be forfeited. But what exactly is that thing, and how is it forfeited? Does any inconsistency between one's behavior and one's criticism destroy standing, or only certain kinds? If I condemn dishonesty but once told a white lie, have I lost standing to blame a fraudster? If not, where is the line?

  I want you to reconstruct the implicit theory of blame — of what blame is and what it requires of the blamer — that this widespread practice presupposes. In particular:

  - What must blame be, such that hypocrisy undermines it in a way it doesn't undermine other forms of normative speech (advice, legal judgment, mathematical criticism)?
  - What account of standing does the practice commit us to? Is standing a matter of the speaker's own moral record, their commitment to the norm they invoke, the relationship between speaker and target, or something else?
  - Is the practice internally consistent? That is, does it treat hypocrisy as undermining blame in some contexts but not others, and if so, can those distinctions be justified by the underlying theory, or do they reveal a contradiction?
  - What would have to change in our practices — in how workplaces handle complaints, in the norms of public political criticism, in the law — if we replaced the presupposed theory with a view on which blame is nothing more than the assertion of a moral truth, and standing is irrelevant?

  Please take a definite position: don't just lay out the options. Tell me what theory of blame you think the practice actually commits us to, where the practice is underdetermined (so that several theories could license it), and where the practice is philosophically inconsistent and needs revision.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The phenomenon of "tu quoque" or hypocritical blame in moral discourse (losing standing to blame due to one's own violations).
      *   **Task:** Reconstruct the *implicit theory of blame* presupposed by this practice.
      *   **Specific Questions to Address:**
          *   What must blame *be* for hypocrisy to undermine it (unlike math or advice)?
          *   What account of *standing* does this commit us to (record, commitment, relationship, etc.)?
          *   Is the practice *internally consistent* (justified distinctions vs. contradictions)?
          *   What would change if we adopted a "truth-only" view of blame (standing is irrelevant)?
      *   **Constraint:** Take a *definite position*. Don't just list options. Identify the theory, underdetermined areas, and inconsistencies needing revision.

  2.  **Deconstruct the Phenomenon:**
      *   *Observation:* We reject blame from hypocrites.
      *   *Contrast:* We accept mathematical proofs from hypocrites. We accept legal sentencing from criminal judges (mostly). We accept medical advice from smoking doctors.
      *   *Implication:* Blame isn't just stating a fact ("You did wrong"). It's a performative act that requires authority/standing.
      *   *Key Distinction:* Blame vs. Assessment. Blame involves a demand for accountability, not just a description of error.

  3.  **Develop the Theory of Blame (The "Definite Position"):**
      *   *Candidate Theories:*
          1.  *Consequentialist:* Blame is for modifying behavior. Hypocrites are less effective. (Weak: sometimes hypocrites are effective, yet we still reject them).
          2.  *Retributive:* Blame is giving what is due. Hypocrites forfeit the right to inflict pain. (Plausible, but doesn't explain the "conversation" aspect).
          3.  *Communicative/Relational (Scanlon/Wallace style):* Blame is a call for recognition of a violated relationship/norm.
      *   *My Choice:* The **Communicative/Authority Theory**. Blame is a *demand for accountability* within a normative community. It asserts not just "X is wrong," but "I have the right to hold you to this, and you owe *me* (or us) an explanation/repair."
      *   *Why Hypocrisy Undermines This:* If I violate the norm I'm invoking, I signal that I don't actually endorse the norm as binding *on me*. If it's not binding on me, why should it be binding on you? It undermines the *equality* required for the demand. It turns blame into a tool of power rather than a defense of shared value.

  4.  **Address the Specific Questions:**

      *   **Q1: What must blame be?**
          *   It must be a *performative claim to authority* within a reciprocal normative relationship. Unlike math (truth is objective/independent) or medical advice (causal truth), moral blame claims a *right to hold accountable*. Hypocrisy severs the reciprocity.

      *   **Q2: Account of Standing?**
          *   It's not just "moral record" (clean hands). A saint can lack standing if they are unrelated. It's not just "commitment."
          *   *Theory:* Standing is **Representative Authority**. To blame is to speak *for the norm*. If I violate the norm, I prove I am a bad representative. It's about *integrity of advocacy*, not sinlessness.
          *   *Nuance:* It's not "any inconsistency." It's "relevant inconsistency." (The white lie vs. fraudster distinction).

      *   **Q3: Internal Consistency?**
          *   *Inconsistency:* We let judges sentence criminals even if judges have secrets. We let smoking doctors advise.
          *   *Justification:* Legal judgment is *institutional*, not personal. The judge speaks for the State, not themselves. The doctor speaks for *health science*, not their own habits. Moral blame speaks for *the self in relation to the other*.
          *   *Critique:* The practice is often inconsistent regarding *degree* of hypocrisy. We forgive "small" hypocrisy in politicians but not "large." This is often pragmatic, not principled.

      *   **Q4: What if we changed to "Truth-Only"?**
          *   Workplaces: HR would have to ignore the accuser's history. Focus solely on the act.
          *   Politics: Ad hominem attacks regarding behavior would be invalid. Policy debates would be purely about policy.
          *   Law: "Clean hands" doctrine would vanish.
          *   *Result:* A colder, more bureaucratic moral landscape. Less focus on community/integrity, more on rule-compliance.

  5.  **Drafting the Argument (Iterative refinement):**

      *   *Introduction:* State the thesis clearly. The practice presupposes a **Communicative Theory of Blame with a Condition of Reciprocal Integrity**.
      *   *Section 1: The Nature of Blame.* Distinguish between "assessment" (truth-apt) and "blame" (authority-apt). Use the math vs. morality contrast. Blame is a demand, not a description.
      *   *Section 2: The Account of Standing.* Define standing as "Representative Capacity." It's not about being sinless (the "moral record" view is too strict). It's about *commitment to the norm as binding*. The "white lie vs. fraud" distinction is key here. It's about *gravity* and *relevance*.
      *   *Section 3: Consistency Check.* Address the judge/doctor examples. Distinguish *Institutional Authority* (derived from office/expertise) vs. *Moral Standing* (derived from shared participation). The practice is consistent *if* we recognize these domains differ. However, point out where it fails: e.g., when we dismiss valid moral criticism from reformed sinners (too strict) or accept blame from powerful hypocrites (too lenient).
      *   *Section 4: The "Truth-Only" Counterfactual.* Describe the shift. It would instrumentalize blame. It would separate the message from the messenger entirely. Argue why this is undesirable (loss of moral community).
      *   *Conclusion:* Summarize. The practice is mostly coherent but needs refinement on the "degree of violation" threshold.

  6.  **Refining the Position (Self-Correction during drafting):**
      *   *Critique:* Is "Representative Capacity" too vague?
      *   *Fix:* Ground it in the idea of *waiving the right to complain*. By violating the norm, I waive my right to demand others follow it *unless* I acknowledge my own fault. Hypocritical blame hides the fault.
      *   *Critique:* The prompt asks where the practice is *underdetermined*.
      *   *Fix:* Acknowledge that the practice doesn't clearly define *how much* hypocrisy is too much. (The "white lie" problem). The theory explains *why* it matters, but the practice lacks a metric for *when* it matters.
      *   *Critique:* The prompt asks where it is *inconsistent*.
      *   *Fix:* Point out the tension between "clean hands" in equity law vs. criminal sentencing. A judge with a secret crime can sentence, but a plaintiff with unclean hands loses the lawsuit. This is a genuine inconsistency in how we treat agency.

  7.  **Final Polish:** Ensure tone is philosophical but decisive. Avoid "on the one hand, on the other." Use "I argue," "The theory is," etc. (Matches the "Take a definite position" instruction).

      *(Self-Correction on the "Judge" example)*: Wait, the prompt says "A judge who has committed crimes can still sentence a criminal." This is legally true (usually), but morally puzzling. I need to explain why this *doesn't* contradict the theory.
      *Explanation:* Legal sentencing is *institutional authority*, not *moral standing*. The judge acts as the arm of the law, not as a fellow moral agent demanding reciprocity. Moral blame between peers is different. I must make this distinction sharp.

      *(Self-Correction on the "Doctor" example)*: Doctor gives causal advice ("Smoking causes cancer"). Moral blame gives normative demand ("You ought not to steal"). Causal truths don't require the speaker to embody them. Normative demands do.

      *(Final check on constraints)*: Did I answer all four bullet points? Yes. Did I take a definite position? Yes.

  8.  **Final Output Structure:**
      *   Thesis Statement.
      *   Part 1: The Nature of Blame (Demand vs. Description).
      *   Part 2: The Account of Standing (Reciprocal Integrity).
      *   Part 3: Consistency & Distinctions (Institutional vs. Moral).
      *   Part 4: The "Truth-Only" Counterfactual.
      *   Conclusion.

  (Proceed to generate response based on this structure.)
answer: |-
  The widespread practice of dismissing hypocritical blame presupposes a **Communicative Theory of Blame grounded in Reciprocal Integrity.**

  On this view, blame is not merely the assertion of a moral truth (the "assessment" view), nor is it solely a tool for behavioral modification (the "consequentialist" view). Rather, blame is a **performative demand for accountability** issued within a normative community. To blame someone is to claim the authority to hold them to a standard that binds both of you. Consequently, the practice commits us to the view that standing is not a matter of sinlessness, but of **representative fidelity**: the blamer must demonstrate that they regard the norm as genuinely binding, not merely as a weapon to be wielded against others.

  Here is the reconstruction of the implicit theory, the account of standing it requires, an analysis of its consistency, and the implications of rejecting it.

  ### 1. The Nature of Blame: Demand vs. Description
  For hypocrisy to undermine blame but not mathematical proof or medical advice, blame must be distinct from the assertion of true propositions.

  *   **Mathematical/Medical Speech:** When a doctor says, "Smoking causes cancer," they are stating a causal fact. The truth of the proposition is independent of the speaker's habits. The authority here is *epistemic* (based on knowledge). A smoking doctor still knows the biology.
  *   **Moral Blame:** When I say, "You ought not to have lied," I am not merely describing a moral fact. I am issuing a **claim of authority**. I am asserting that I have the right to demand an explanation, an apology, or a change in behavior from you.

  The implicit theory is that moral norms function as the terms of a relationship. To blame is to invoke the terms of that relationship. If I violate the norm I am invoking, I signal that I do not actually accept the norm as binding *on me*. If the norm does not bind me, I cannot consistently claim it binds you. Hypocrisy transforms blame from a defense of shared value into an exercise of raw power or dominance. It implies: "The rules apply to you, but I am above them." This destroys the **reciprocity** necessary for the communicative act of blame to be legitimate.

  Therefore, blame must be understood as a **second-personal authority claim**. It requires the blamer to stand *under* the norm in order to stand *for* the norm.

  ### 2. The Account of Standing: Reciprocal Integrity
  The practice commits us to a specific account of standing: **Standing is a function of Representative Integrity, not Moral Purity.**

  This distinction is crucial. If standing required moral purity (a "clean record"), no one could ever blame anyone, as all are fallible. The practice does not demand this. We do not dismiss a parent for disciplining a child for hitting if the parent once hit a sibling as an adult. We do not dismiss a friend for criticizing infidelity if they made a mistake years ago and acknowledged it.

  The theory presupposes that standing is forfeited only when the hypocrisy reveals a **lack of commitment to the norm as a shared constraint.**
  *   **The White Lie vs. The Fraudster:** If I condemn a fraudster while having told a white lie, I retain standing. Why? Because the white lie does not signal that I reject the norm of honesty as binding; it signals a minor lapse in a complex landscape. The fraudster, however, treats honesty as optional. My criticism remains valid because I still claim to be "on the same side" of the norm as the target.
  *   **The Cheating Spouse:** If I condemn infidelity while actively cheating, I lose standing. Why? Because my active violation signals that I view the norm of fidelity as a restriction for *you*, but not for *me*. I am not representing the norm; I am manipulating it.

  Therefore, standing is not about the speaker's moral record (past sins), but about their **current relationship to the norm**. Standing is forfeited when the speaker's conduct demonstrates that they view the norm as a tool for controlling others rather than a constraint on themselves.

  ### 3. Internal Consistency: Institutional vs. Moral Authority
  Is the practice consistent? It appears inconsistent when we allow judges to sentence criminals despite the judges' own secrets, or when we accept moral criticism from reformed sinners. However, these distinctions are justifiable **if** we distinguish between *Institutional Authority* and *Moral Standing*.

  *   **Justified Distinction (The Judge/Doctor):** A judge sentencing a criminal acts with **Institutional Authority**. Their power derives from the State and the Law, not from their personal moral integrity. The law is an external system; the judge is its operator. Similarly, a doctor speaks for medical science, not their own habits. In these cases, the "speaker" is effectively an avatar for an institution. The practice is consistent here because we are not engaging in interpersonal moral blame; we are administering a system.
  *   **Justified Distinction (The Reformed Sinner):** A reformed sinner who acknowledges their past fault retains standing. This is consistent with the theory of Reciprocal Integrity. By acknowledging their fault, they reaffirm that the norm *does* bind them; they admit they failed it. They are not claiming superiority; they are claiming shared fallibility under a shared law.
  *   **The Inconsistency (The "Clean Hands" Doctrine vs. Public Discourse):** Here the practice falters. In equity law, the "clean hands" doctrine bars relief to a plaintiff who has acted unethically regarding the subject matter. Yet, in public discourse, we often allow powerful figures to condemn minor infractions while ignoring their own major structural violations (e.g., a corporation polluting while lecturing on recycling).
      *   *The Flaw:* The practice is often underdetermined regarding **proportionality**. We lack a clear metric for when a violation is "relevant enough" to destroy standing. Is a tax evader barred from criticizing war? Is a liar barred from criticizing violence? The implicit theory says standing depends on the *relationship to the specific norm*, but in practice, we often allow "general character" attacks to dismiss specific valid criticisms. This is a point of inconsistency: we sometimes treat standing as global (you are a bad person, so everything you say is void) rather than local (you violated *this* norm, so you cannot enforce *this* norm).

  ### 4. The "Truth-Only" Counterfactual
  If we replaced this theory with a view where blame is nothing more than the assertion of moral truth (and standing is irrelevant), our practices would shift drastically toward a bureaucratic, depersonalized model of morality.

  *   **Workplaces:** HR investigations would become purely forensic. An accuser's history of similar misconduct would be inadmissible. A manager who routinely bullies staff could formally reprimand an employee for bullying without the employee being able to cite the manager's behavior as a mitigating context for the complaint's validity. The focus would be entirely on the act, severing the relational context.
  *   **Public Politics:** *Tu quoque* arguments would vanish from political debate. A politician could advocate for austerity while living lavishly, and the media would be constrained to analyze only the policy's economic merit, not the hypocrisy. This would likely increase cynicism, as the "messenger" is often the only evidence we have of the "message's" sincerity.
  *   **Law:** The "clean hands" doctrine would be abolished. A contract breaker could sue for breach of contract even if they were currently breaking the same contract.
  *   **The Cost:** While this might increase the efficiency of identifying rule-violations, it would **dissolve the moral community.** It would separate moral truth from moral agency. If standing is irrelevant, then morality becomes a set of external facts to be observed, rather than a shared practice to be upheld. We would lose the ability to demand *integrity* from our leaders and peers, reducing moral discourse to a game of spotting rule violations rather than cultivating shared values.

  ### Conclusion
  The practice of dismissing hypocritical blame is philosophically robust, provided we understand blame as a **claim to reciprocal authority** rather than a statement of fact. It commits us to a theory where standing is derived from **Representative Integrity**—the demonstration that one submits to the norms one invokes.

  However, the practice requires revision in two areas:
  1.  **Scope:** We must rigorously distinguish between *Institutional Authority* (where standing is less relevant) and *Interpersonal Moral Blame* (where standing is crucial). We currently confuse these, sometimes demanding moral purity from officials (bad) and sometimes ignoring hypocrisy in peers (bad).
  2.  **Relevance:** We need a clearer principle for **Normative Relevance**. Hypocrisy should only defeat standing when the violator's conduct shows a rejection of the *specific norm* they are invoking. We often allow irrelevant hypocrisy to silence valid criticism, which contradicts the theory of Reciprocal Integrity.

  We should not abandon the requirement of standing. To do so would be to admit that morality is merely a system of control, rather than a community of mutual accountability. The hypocrite loses the right to blame not because their facts are wrong, but because they have severed the relationship that makes blame meaningful.
