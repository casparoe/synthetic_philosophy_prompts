answer: |-
  To the members of the working group,

  We, the undersigned, submit this document as the product of our adversarial collaboration regarding the units of selection debate. Our goal in this text is not to manufacture a consensus where none exists, nor to retreat into a diplomatic vagueness that obscures our theoretical commitments. Rather, we aim to delineate precisely where our views converge on the mathematical and empirical bedrock of evolutionary theory, and where they diverge on matters of causal ontology and explanatory strategy. We have found that much of our previous friction arose from conflating questions of mathematical equivalence with questions of causal attribution, and this document serves to disentangle those threads. We begin by stating the substantive claims upon which we both agree, as these form the non-negotiable foundation of our collaboration. We both affirm that evolution by natural selection requires variation, heritability, and differential fitness, and we both accept the Price equation as a valid and exhaustive mathematical description of evolutionary change in any population. We agree that population structure, including the grouping of individuals, is an empirical fact that profoundly influences evolutionary trajectories, and we agree that altruistic behaviors, defined as acts that reduce the direct fitness of the actor while increasing the fitness of others, can evolve under specific conditions of assortment. We further agree that any viable account of selection must be able to predict the change in gene frequencies over time, and that if two accounts yield different numerical predictions for the same empirical scenario, at least one of them is mathematically incorrect. On these core dynamical principles, there is no disagreement between us.

  Having established our shared commitment to the standard Darwinian formalism, we turn to the exact points of disagreement, which we have carefully worded to ensure each advocate recognizes their position without distortion. The primary divergence concerns the ontological status of the terms in the Price equation, specifically the covariance between group character and group fitness. The gene-centered proponent holds that this between-group term is a statistical partition that describes the consequences of selection but does not necessarily pick out a distinct causal force independent of individual-level interactions. For the gene-centered proponent, the fundamental causal process is always the differential replication of genes, and group-level descriptions are convenient redcriptions of the complex web of individual inclusive fitness effects. In contrast, the multilevel proponent holds that the between-group term picks out a real, distinct causal force that can act in opposition to individual-level selection. For the multilevel proponent, selection is a multi-agent process where groups can function as Darwinian individuals in their own right, and explaining the evolution of a trait requires acknowledging the causal efficacy of the group-level variance, not merely translating it back into gene-frequency language. We agree that this is not a disagreement about the math, but a disagreement about what the math represents in the world.

  A second substantive point of disagreement concerns explanatory completeness and the existence of explanatory gaps. The gene-centered proponent claims that there is no trait whose evolution the gene's-eye account fails to predict or explain, provided that indirect fitness effects are correctly accounted for via kin selection or inclusive fitness theory. They maintain that the gene's-eye view is universally applicable and that invoking group selection adds no predictive power, only potential heuristic clarity in specific cases. The multilevel proponent claims that there are traits, particularly those involving strong synergistic interactions or high levels of between-group variance, where the gene's-eye account becomes so convoluted in its accounting of indirect effects that it fails to provide a tractable or illuminating explanation, even if it remains mathematically consistent. The multilevel proponent asserts that in these cases, the group-level account succeeds in identifying the driving mechanism of evolution where the gene-level account obscures it, and that this explanatory failure constitutes a genuine theoretical deficit, not merely a stylistic preference. We record this disagreement explicitly: one side sees the gene's-eye view as universally sufficient for explanation, while the other sees it as sometimes explanatorily deficient despite mathematical adequacy.

  We now identify the cruxes of our debate, understood as the sub-questions such that settling them would move at least one side toward the other's position, and we specify the empirical or mathematical cases we both accept as bearing on them. The first crux is whether the between-group term in the Price equation corresponds to a manipulable causal variable. To test this, we propose a thought experiment involving a metapopulation where we can independently manipulate within-group variance and between-group variance while holding mean fitness constant. The empirical case both would accept as bearing on this is a controlled evolution experiment with microbial populations where group fission and migration rates are mechanically controlled. The multilevel proponent predicts that manipulating the between-group variance term directly will alter the evolutionary outcome in a way that is best modeled as a distinct force acting on group traits, and that interventions targeting group survival will succeed even when individual incentives oppose them. The gene-centered proponent predicts that any such manipulation will ultimately be explicable as a change in the regression coefficients of individual inclusive fitness, and that there is no intervention on the group term that cannot be fully redescribed as an intervention on the statistical assortment of genes among individuals. If it were shown that an intervention on group structure produced an evolutionary change that could not be modeled as a change in individual inclusive fitness without introducing ad hoc parameters, the gene-centered proponent would concede that the group term has distinct causal status. Conversely, if it were shown that every group-level effect maps perfectly onto a simple individual-level assortment parameter without loss of tractability, the multilevel proponent would concede that the group-level causality is derivative.

  The second crux is whether there exists a biological scenario where the gene's-eye view fails to generate a stable equilibrium prediction that the multilevel view successfully predicts. We agree to examine cases of non-additive fitness interactions, specifically synergistic epistasis where the fitness benefit of a cooperative act depends non-linearly on the frequency of cooperators in the group. The mathematical case both would accept is a game-theoretic model with non-linear payoff structures embedded in a structured population. The multilevel proponent predicts that in regions of parameter space with high synergy and high group variance, the gene's-eye account will fail to converge on the correct stable equilibrium or will require complex, unstable assumptions about relatedness to match the data, whereas the multilevel account will predict the equilibrium directly from group-level fitness functions. The gene-centered proponent predicts that the inclusive fitness account, properly calculated with non-additive effects, will yield the exact same equilibrium conditions as the multilevel account, demonstrating that the alleged explanatory gap is an artifact of incomplete calculation rather than a theoretical limitation. Settlement of this crux requires a rigorous proof of equivalence or a demonstrated counter-example where the mathematical mappings break down.

  In assessing the nature of these disagreements, we offer an explicit judgment on which are genuine and which are terminological, as this distinction is vital for the working group's future discussions. We judge that the disagreement regarding the mathematical predictions of evolutionary trajectories is terminological. Since the Price equation allows for the partitioning of selection into within-group and between-group components that are mathematically transformable into inclusive fitness parameters, both sides agree on the numbers. When we argue about whether a trait will evolve, we are not actually disagreeing; we are using different languages to describe the same dynamical system. However, we judge that the disagreement regarding causal ontology and explanatory utility is genuine. It is a substantive philosophical dispute about whether causality in biology is monistic, residing ultimately in the replicator, or pluralistic, residing in any entity that exhibits variation, heredity, and fitness differences. This is not a matter of definition that can be stipulated away, because it dictates how we design experiments, how we interpret data, and what we consider a complete scientific explanation. The gene-centered proponent genuinely believes that causal power flows only one way, from replicator to vehicle, while the multilevel proponent genuinely believes that causal power can emerge at higher levels of organization. This is a metaphysical commitment that influences heuristic strategy, and it remains a live, unresolved conflict between us.

  We conclude this document by affirming our commitment to this adversarial collaboration. We recognize that our inability to reconcile these views does not impede our ability to conduct joint research, provided we are clear about which claims are shared empirical commitments and which are competing interpretive frameworks. We agree that future work should focus on identifying the specific boundary conditions where one framework becomes computationally or cognitively superior to the other, rather than arguing over the ultimate reality of the gene or the group. We sign this not as a treaty of peace that ends the debate, but as a map of the battlefield that allows us to fight more productively. We acknowledge that if future mathematical proofs demonstrate a breakdown in the equivalence between inclusive fitness and multilevel selection models under non-additive conditions, we will both update our views accordingly, but until such proof is provided, we maintain our respective positions as stated above. This document stands as our joint testimony that clarity about disagreement is more valuable than the illusion of agreement.
