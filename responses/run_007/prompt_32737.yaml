answer: |-
  This is a sophisticated pivot. Most discussions of Nagel get stuck on the normative paradox (we *shouldn't' judge by luck, but we *do*). You are isolating the **descriptive psychological claim**: *Human moral judgment is structurally incapable of filtering out luck.*

  If your claim is merely "luck influences judgment," that is trivially true and well-supported. But your stronger claim is that there is **"no way to purify it."** That is an empirical hypothesis about the limits of human moral cognition. It risks being a "just-so" story unless it makes risky predictions.

  Here is what would actually put pressure on a committed descriptive Nagelian, categorized by the domains you requested.

  ### 1. Empirical Findings: The Dissociation of Intent and Outcome
  The strongest pressure comes from experimental philosophy (X-Phi) and moral psychology that demonstrates a **functional dissociation** between outcome processing and intent processing.

  *   **The Cushman/Young Dissociation:** Fiery Cushman and Liane Young have produced data suggesting we have distinct neural/cognitive systems for judging *wrongness* (driven by intent/mental state) and *punishment* (driven by outcome/harm).
      *   **The Pressure:** If these systems can be decoupled, purification is possible. For example, in studies where participants are asked explicitly to judge *blameworthiness* rather than *punishment*, outcome bias often diminishes or disappears. If you claim "no way to purify," you must explain why these specific framings succeed where others fail.
      *   **TMS Studies:** Young et al. used Transcranial Magnetic Stimulation to disrupt the Right Temporoparietal Junction (RTPJ), which processes mental states. When disrupted, subjects became *more* outcome-dependent. Crucially, when the RTPJ is functioning normally, subjects *are* able to prioritize intent over outcome. This suggests outcome-dependence is not the default structural necessity of moral judgment, but rather a failure mode or a secondary process that can be overridden.
  *   **Cognitive Load:** If outcome luck is an inevitable structural feature, it should persist regardless of cognitive resources. However, studies show that under high cognitive load, people rely *more* on heuristics (like outcome). When given time and motivation to reason, they align closer to the "Control Principle." If purification is a resource-intensive but *available* cognitive task, the "no way to purify" claim weakens.

  ### 2. Institutional and Expert Judgment (The Legal Counter-Example)
  The law is the most robust institutionalization of moral judgment. If moral judgment is shot through with luck, legal judgment should be too.

  *   **Attempt vs. Completion:** The law distinguishes between attempted murder and completed murder. While sentencing differs (acknowledging outcome luck), the **culpability** attribution is often identical. A jury instructed properly can find an attempted murderer just as *morally guilty* as a completed murderer, even if the penalty is lower.
  *   **The Pressure:** If legal professionals (judges, seasoned lawyers) show significantly less outcome bias than laypeople, this suggests moral judgment *can* be purified through training and institutional scaffolding. If your view is that purification is impossible *for us* (humans), then expert humans who successfully bracket outcome luck are a counter-example.
  *   **Strict Liability vs. Mens Rea:** The historical trend in criminal law is moving *away* from strict liability (outcome luck) toward *mens rea* (intent). If moral psychology were rigidly bound to outcome luck, this legal evolution would be impossible to sustain. The fact that we can maintain a system that explicitly rejects outcome luck for culpability suggests the psychology is more plastic than Nagel implies.

  ### 3. Nearby Areas: The Epistemology of Blame
  Your view risks conflating **causal attribution** with **moral blame**. Recent work in the epistemology of blame (e.g., George Sher, Angela Smith, T.M. Scanlon) argues that blame is a response to the **quality of will** or **reasons-responsiveness**, not just causal history.

  *   **The "Reasons" Challenge:** If blame is fundamentally a communicative act aimed at recognizing a failure of regard, then outcome luck is epistemically irrelevant.
  *   **The Pressure:** If we find that people's *reactive attitudes* (resentment, indignation) track the quality of will even when outcomes differ, the descriptive claim fails. For instance, if I try to kill you but miss, and you feel the same *indignation* toward me as if I had succeeded (even if your *fear* or *grief* differs), then the core moral emotion has been purified.
  *   **Moral Luck as Epistemic:** Some argue we use outcomes as a **proxy** for intent because intent is hidden. (The "Epistemic Account" of moral luck). If this is true, luck isn't contaminating judgment; it's providing necessary data.
      *   **The Test:** If you present cases where intent is *perfectly known* (omniscient narrator scenarios) and outcome bias *still* persists, Nagel wins. If outcome bias disappears when intent is transparent, then luck was only ever an epistemic crutch, not a structural feature of judgment. Current data is mixed, but some studies suggest transparency reduces bias significantly.

  ### 4. Cross-Cultural and Developmental Variance
  If the infiltration of luck is a necessary feature of human moral cognition, it should be universal and developmentally stable.

  *   **Development:** Piaget argued children judge by outcome, adults by intent. Later studies (e.g., by Nelson) complicated this, but if there is a developmental trajectory where outcome dependence *decreases* with age and theory-of-mind maturation, then purification is a learnable skill, not an impossibility.
  *   **Cross-Cultural:** If there are cultures where ritual, fate, or collective responsibility structures judgment such that individual outcome luck is deemed irrelevant (e.g., certain interpretations of karma or stoic communities), the "no way to purify" claim becomes a claim about *Western* psychology, not moral judgment *simpliciter*.

  ### 5. The Falsifiability and Risk Question
  This is the most critical philosophical point you raised.

  **Does the position risk anything?**
  A strong descriptive Nagelian claim must be: *"In cases of identical intent and epistemic state, agents will invariably assign higher negative moral weight to the agent associated with the bad outcome."*

  *   **How to Falsify:** You need one robust, replicable condition where identical intent + different outcome = **identical moral judgment**.
      *   If such cases exist (and the X-Phi literature suggests they do, particularly with "moral wrongness" ratings vs. "punishment" ratings), the strong "no way to purify" claim is false.
      *   If you retreat to "Well, they might say it's identical, but their implicit bias shows otherwise," you risk moving the goalposts to an unfalsifiable position.

  **Is unfalsifiability a problem here?**
  Yes. If your claim is "Moral judgment is shot through with luck," and you define "moral judgment" as "whatever psychological process includes outcome sensitivity," you have created a tautology.
  *   **The Danger:** You risk defining the phenomenon by the very bias you claim to discover. To avoid this, you must define "moral judgment" independently (e.g., via self-report, neural correlates, or behavioral sanctions) and *then* show luck infiltrates it.
  *   **Descriptive Psychology:** Descriptive moral psychology is not allowed to be untestable. If it claims to describe human cognitive architecture, it is subject to the same empirical constraints as linguistics or vision science. If you claim "humans cannot see ultraviolet light," and someone shows a human who can, the theory dies. Similarly, if you claim "humans cannot bracket outcome luck," and you show a human who can, the theory dies.

  ### Summary: What Should Make You Worry?
  1.  **Neuroplasticity:** Evidence that training (legal, medical, ethical) physically alters the neural pathways of judgment to suppress outcome bias (RTPJ modulation).
  2.  **The Transparency Effect:** If outcome bias vanishes when intent is made perfectly transparent, luck is epistemic, not constitutive.
  3.  **The Punishment/Blame Split:** If data consistently shows people punish based on luck but *blame* based on control, then moral judgment (blame) *has* been purified, even if social sanction (punishment) hasn't. Nagel conflates the two; separating them saves the Control Principle.
  4.  **Tautology Trap:** If you cannot specify a scenario where you would admit, "Okay, in this case, luck didn't matter," then your theory explains everything and predicts nothing.

  **The Verdict:**
  Nagel is likely right that luck *influences* us deeply. But the claim that there is **"no way to purify it"** is too strong. The existence of legal systems, the dissociation of blame and punishment, and the neural modifiability of outcome bias suggest that while purification is *hard* and *costly*, it is not *impossible*. The pressure point for your view is the difference between "we are biased" (true) and "we are structurally incapable of correction" (empirically dubious).
