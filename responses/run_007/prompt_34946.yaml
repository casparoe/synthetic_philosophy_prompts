answer: |-
  This slogan is most famously associated with Daniel Dennett's *Elbow Room* (1984), but it has become a shorthand for a specific style of compatibilist argumentation. Its rhetorical power lies in its ambiguity: it sounds like a reasonable request for clarity, but it often functions as a substantive argument against incompatibilism.

  Here is a menu of four distinct readings of the slogan, ordered from the least to the most revisionary. You can use this to force a speaker in your seminar to specify which commitment they are undertaking.

  ### 1. The Methodological Reading (Taxonomic)
  **The Claim:** "There are multiple concepts currently circulating under the label 'free will.' Before we argue about whether we *have* it, we must distinguish these concepts to ensure we aren't talking past one another."

  *   **Strand:** Purely **Taxonomic**.
  *   **Classification:** **Platitude.**
      *   *Reasoning:* No serious philosopher denies that 'free will' is used in multiple ways (e.g., leeway freedom vs. sourcehood freedom). Calling for conceptual clarity is a standard starting point for any analysis.
  *   **Impact on Incompatibilist Worry:** **Leaves it completely untouched.**
      *   *Why:* This reading does not assert that the incompatibilist variety is impossible, unimportant, or non-existent. It merely asks that the incompatibilist specify *which* variety they are defending. If the incompatibilist replies, "I am defending the variety that requires the ability to do otherwise in a deterministic world," this reading grants them the right to ask if *that* variety exists. It does not deflate the worry; it only organizes it.

  ### 2. The Pragmatic Reading (Evaluative)
  **The Claim:** "Even if the incompatibilist variety of free will (e.g., libertarian agency) were metaphysically possible, it is not the variety that underwrites the practices we actually care about (moral responsibility, dignity, punishment). Therefore, the debate should focus on the variety that serves our normative interests."

  *   **Strand:** Purely **Evaluative**.
  *   **Classification:** **Substantive and Defensible.**
      *   *Reasoning:* This is a pragmatic claim about value. It argues that the *point* of the free will debate is to justify social practices. It is defensible because one can argue that "magic" contra-causal freedom adds nothing of value to responsibility practices that compatibilist control does not already provide.
  *   **Impact on Incompatibilist Worry:** **Sidesteps but does not dismiss.**
      *   *Why:* This concedes that the incompatibilist worry might be metaphysically genuine (i.e., determinism might rule out the ability to do otherwise) but argues that the worry is *axiologically* inert. It tells the incompatibilist: "You might be right that we lack *that* kind of freedom, but so what? It's not worth wanting." This changes the subject from truth to value, but it does not prove the incompatibilist wrong about determinism.

  ### 3. The Conceptual Engineering Reading (Semantic)
  **The Claim:** "The term 'free will' should be reserved *only* for the compatibilist varieties. The incompatibilist variety is a conceptual confusion or a 'philosopher's fiction.' To ask for free will in a deterministic world is to ask for something that does not fit the concept."

  *   **Strand:** **Semantic** (with normative undertones).
  *   **Classification:** **Substantive (Revisionary).**
      *   *Note:* If presented as a report on *current* linguistic usage, this is **False** (since incompatibilists clearly use the term). If presented as a proposal for *future* usage (conceptual engineering), it is Substantive.
  *   **Impact on Incompatibilist Worry:** **Licenses Dismissal (by fiat).**
      *   *Why:* This reading attempts to dissolve the worry by redefining the terms. If 'free will' *means* "the kind of control compatible with determinism," then the question "Do we have free will if determinism is true?" is answered "Yes" by definition. This licenses dismissing the incompatibilist by claiming they are suffering from a semantic illusion. However, it risks begging the question against the incompatibilist who insists the concept *requires* indeterminism.

  ### 4. The Metaphysical Dissolution Reading (Metaphysical)
  **The Claim:** "The incompatibilist variety of free will is not just unwanted; it is metaphysically impossible or incoherent (e.g., random events do not equal freedom). Therefore, the only *possible* free will is the compatibilist kind. Since we want free will, and only one kind is possible, that is the one worth wanting."

  *   **Strand:** **Metaphysical**.
  *   **Classification:** **Substantive (The Core Dispute).**
      *   *Reasoning:* This is the strongest claim. It asserts that the incompatibilist position is not just normatively inferior but metaphysically untenable. It is not a platitude; it is the central battleground of the free will debate.
  *   **Impact on Incompatibilist Worry:** **Licenses Dismissal (by metaphysics).**
      *   *Why:* This directly attacks the incompatibilist worry. It argues that the "ability to do otherwise" (in the libertarian sense) is incoherent. If successful, this dissolves the traditional problem because the "free will" the incompatibilist worries about losing never existed in the first place. However, this is not a slogan; it is a full-blown metaphysical argument that requires defense.

  ---

  ### How to Use This Menu in Seminar

  When a speaker invokes "the varieties of free will worth wanting" to deflate an incompatibilist objection, ask them to locate themselves on this menu:

  1.  **If they choose Reading 1 (Taxonomic):** Press them on why sorting the concepts solves the metaphysical problem. *"Agreed, there are varieties. But if determinism rules out the Leeway variety, haven't we lost something real, regardless of what we call it?"*
  2.  **If they choose Reading 2 (Evaluative):** Press them on whether truth matters. *"Are you saying we should be satisfied with a comforting illusion if the robust kind is impossible? Or are you claiming the robust kind is impossible?"*
  3.  **If they choose Reading 3 (Semantic):** Accuse them of verbal sleight of hand. *"Are you making a linguistic claim or a metaphysical one? If incompatibilists use the term to mean 'requires indeterminism,' you can't define them out of existence without arguing their concept is incoherent."*
  4.  **If they choose Reading 4 (Metaphysical):** Demand the argument. *"Then the slogan is doing no work. You need to argue that libertarian free will is impossible, not just that it isn't 'worth wanting.'"*

  **Summary for your notes:**
  *   **Readings 1 & 2** leave the incompatibilist worry about determinism **untouched** (one organizes it, the other ignores its value).
  *   **Readings 3 & 4** attempt to **dismiss** the worry (one by semantics, one by metaphysics), but they carry the burden of proof. The slogan often smuggles 3 or 4 in under the guise of 1 or 2.
