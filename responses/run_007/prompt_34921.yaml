      *   **Structure:**
          *   **Octave (8 lines):** Develop the thesis (Stalnaker's Thesis / The Equation): $P(\text{If } A, C) = P(C|A)$. Make it feel natural, powerful, and like conditionals are ordinary propositions.
          *   **Volta (Turn):** The point where the identification collapses.
          *   **Sestet (6 lines):** Work through the shape of the collapse (triviality results under closure assumptions).
          *   **Closing Couplet (2 lines):** State exactly what must be given up (unrestricted equation, truth-conditional proposition status, etc.).
      *   **Audience:** Needs to be recognizable to experts (faithful rendering of the logic) but accessible/poetic to non-experts.

  2.  **Deconstruct the Logic (Lewis's Triviality Results):**
      *   **The Equation:** $P(A \rightarrow C) = P(C|A)$. This is intuitive. If I say "If it rains, the ground gets wet," my confidence in that statement should match my confidence that the ground gets wet *given* that it rains.
      *   **The Assumption:** Conditionals are ordinary propositions. They have truth values. They can be negated, conjoined, disjoined. They fit into the Boolean algebra of propositions.
      *   **The Problem:** If $P(A \rightarrow C) = P(C|A)$ holds for *all* probability functions $P$ (or even a rich enough class), and conditionals are in the algebra...
      *   **The Result:** The probability function becomes trivial. Specifically, $P(C|A)$ must equal $P(C)$ (independence) or the algebra only allows very few probability values (0 or 1). Essentially, you can't have a non-trivial probability space where conditionals behave like ordinary propositions *and* satisfy The Equation.
      *   **The Choice:** Give up The Equation (maybe conditionals aren't probabilistic that way), give up Propositionalism (conditionals aren't truth-apt propositions, maybe expressivists), or restrict the logic/closure.

