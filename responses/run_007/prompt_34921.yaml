answer: |-
  To match the chance of C, given A is true,
  With credence in the claim, "If A, then C,"
  Is what a rational mind would seek to do,
  As clear as any fact that we can see.
  It joins the Boolean algebra's store,
  To negate, conjoin, or disjoin like the rest;
  An ordinary proposition, no more,
  Where probability puts the claim to test.

  But grant it closure under negation's sway,
  And conjunction's weight, and disjunction's tie,
  Then triviality blooms in broad daylight,
  Where probability functions go to die.
  Reject the Equation's unrestricted aim,
  Or that no propositions they proclaim.
