  This is a fascinating ethical puzzle because Maya isn't using a single standard moral theory (like pure utilitarianism or pure deontology). She is running a **hybrid heuristic** that switches rules depending on the *type* of harm involved.

  Here is the breakdown of the rules she seems to be using, how they apply to your job offer, and the specific test case to settle it.

  ### 1. The Two Competing Rules

  Based on her record, Maya oscillates between two distinct principles.

  **Rule A: The Complicity Principle (Deontological)**
  *   **The Logic:** It is wrong to directly participate in or fund a harmful act, regardless of whether your individual action changes the outcome. The moral weight is on *your integrity* and keeping your hands clean, not on the net result.
  *   **Key Phrase:** "You're still paying for the killing."
  *   **Fits These Cases:** Factory-farmed chicken and sweatshop clothes. In both, she admits her purchase won't change production numbers, but she forbids it because the transaction itself is tainted.
  *   **Prediction for Your Job:** **Reject.** You would be taking money directly from a harmful entity to help them pursue their goals. You become an instrument of their reputation management.

  **Rule B: The Marginal Impact Principle (Consequentialist/Threshold)**
  *   **The Logic:** You are only responsible for outcomes you actually cause. If an action has no causal leverage (the plane flies anyway, the vote doesn't decide, the straw doesn't warm the planet), you have no duty to abstain.
  *   **Key Phrase:** "The plane is going anyway."
  *   **Fits These Cases:** Flying, voting, and recycling. In all three, she argues that the harm is either fixed (the flight schedule) or threshold-based (elections/climate), so your individual contribution is morally neutral.
  *   **Prediction for Your Job:** **Accept.** The ad campaign will run with or without you. The oil will be extracted with or without your ads. Since you change nothing, you bear no guilt.

  ### 2. The Tension in Your Job Offer

  Your situation is the perfect storm because it triggers both rules simultaneously.

  *   **It looks like the Chicken/Clothes cases (Rule A):** You are being paid to support a specific industry widely considered harmful. Like buying the chicken, you are entering a financial contract that aids the "killer."
  *   **It looks like the Flying/Voting cases (Rule B):** The harm (climate change) is diffuse and statistical, not a specific identifiable victim. Furthermore, like the plane seat, your specific labor is replaceable; the "flight" (the ad campaign) happens anyway.

  **The Crucial Distinction:**
  Maya seems to allow **Rule B (Impact)** to override **Rule A (Complicity)** *only* when the harm is **diffuse/statistical** (Climate, Elections) rather than **specific/identifiable** (A specific chicken, a specific worker).

  *   **Chicken/Sweatshop:** Identifiable victims + Complicity = **Don't do it.**
  *   **Flying/Voting:** Statistical victims + No Impact = **Do it.**

  **The Question:** Does she view the Oil Company as causing **Statistical Harm** (like the plane's emissions) or **Specific Harm** (like the chicken's death)? And does *Labor* count as Complicity in the same way *Buying* does?

  ### 3. The Follow-Up Case (The Tie-Breaker)

  To know which rule she will prioritize, you need to present a case that isolates **Active Labor** for a **Statistical Harm** industry where **Replacement is Guaranteed.**

  Put this scenario to her:

  > "Imagine a friend is offered a job as a **graphic designer for a major tobacco company**. The job is making ads for cigarettes that are already legal. The company has a fixed budget and will hire someone else immediately if she says no. The health harm from smoking is long-term and statistical, not immediate like a slaughterhouse.
  >
  > **Should she take the job?**"

  **Why this works:**
  *   **Matches your Job:** It is creative labor (design) for a harmful industry (Tobacco/Oil).
  *   **Matches Flying:** The harm is statistical/long-term (Cancer/Climate), not a direct execution (Chicken).
  *   **Matches Chicken:** It involves selling a specific harmful product, not just a service (like a flight).
  *   **Matches the "Replacement" Condition:** Like the plane seat, her specific contribution doesn't change the outcome.

  **How to Interpret Her Answer:**

  1.  **If she says "She shouldn't take it":**
      *   **Her Rule:** The **Complicity Principle** wins. She believes that directly working for a harmful industry is wrong, even if the harm is statistical and you are replaceable.
      *   **Verdict for You:** **Decline the job.** She will view your design work as "paying for the killing" of the climate, just like buying the chicken.

  2.  **If she says "It's fine, the ads run anyway":**
      *   **Her Rule:** The **Marginal Impact Principle** wins. She believes that if the harm is statistical and your action changes nothing, complicity doesn't matter.
      *   **Verdict for You:** **Take the job.** She will file this under "Flying"—a harmful system you didn't create and can't stop, where your seat is filled regardless.

  3.  **If she hesitates or distinguishes Tobacco from Oil:**
      *   **Her Rule:** She may distinguish between **Product Harm** (Tobacco/Chicken) and **Externality Harm** (Oil/Climate).
      *   **Verdict:** If she says Tobacco is wrong but Oil is okay, take the job. If she says they are the same, follow her Tobacco verdict.

  ### Summary
  Maya is consistent, but her consistency relies on a hidden switch: **Identifiable vs. Statistical Victims.**
  *   **Identifiable Victims (Chicken/Workers):** Complicity matters. (Don't buy).
  *   **Statistical Victims (Climate/Elections):** Impact matters. (Fly/Don't Vote).

  Your job sits on the fence because Oil causes statistical harm, but Marketing feels like direct complicity. The **Tobacco Designer** case forces her to decide if "Statistical Harm" is enough to excuse "Direct Complicity." Her answer to that is your answer.
