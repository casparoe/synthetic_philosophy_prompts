  My friend Maya is the one person I know who has an actual worked-out view about whether individual choices matter, and she's weirdly consistent about it. I've been keeping track, and now I have a decision to make and I want to know what she'd say.

  Her record, as best I can reconstruct it:

  - She dosn't vote in national elections and says it's fine not to, because no election has ever come down to one vote and none will. Voting is fine if it makes you feel good but it's not a duty.
  - She won't buy factory-farmed chicken and says other people shouldn't either, even though she admits one person buying a chicken basically never changes how many chickens get raised. Her line is something like "you're still paying for the killing."
  - She flies for vacation without guilt. She says the plane is going anyway, and one seat in one direction doesn't change how much fuel gets burned or whether the route exists.
  - She refuses to buy cheap clothes from brands with sweatshop labor and says it's wrong, even though she knows her purchase won't shut the factory down or free anyone. Again it's the "paying someone to do it" thing.
  - She thinks not recycling a bottle or using a plastic straw isn't a real moral issue, since the harm is spread across everyone and one bottle doesn't move the needle.

  I just got offered a graphic design job at a marketing firm whose biggest client is an oil and gas company. The pay is good and the work itself is just normal ads, nothing false, but I'd be spending my week helping a fossil fuel company look good. I genuinely can't tell whether Maya would file this with the chicken and sweatshop cases (I'd be taking money to help someone do the harmful thing) or with the flight and voting cases (diffuse harm, no identifiable victim, and the campaign would run with someone else in the seat if I said no).

  I'm less interested in the actual verdict than in the rule she seems to be running. What are the plausible rules that fit all of her verdicts so far, which one best explains them, what does each predict about my job offer, and what single follow-up case should I put to her that would cleanly tell the best two or three rules apart?
