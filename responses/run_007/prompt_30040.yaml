answer: |-
  This specific style of reasoning has a name. It is **Superrationality**.

  The term was coined by Douglas Hofstadter (of *Gödel, Escher, Bach* fame) in the 1980s to describe exactly the move you are making: assuming that because you and the other players are rational and in symmetric positions, you will all arrive at the same conclusion. Therefore, you should choose the action that yields the best result if *everyone* chooses it.

  While standard game theory (Nash Equilibrium) assumes you should treat other players' actions as independent variables to be predicted, Superrationality treats your own decision as a **logical output** that identical reasoning machines (the other players) will also produce.

  Under the hood, this reasoning is an application of **Evidential Decision Theory (EDT)** (or its modern successor, Functional Decision Theory), rather than the standard Causal Decision Theory used in classical economics. Causal Decision Theory asks, "What effect does my action have on the world?" Evidential Decision Theory asks, "What does my action *tell me* about the state of the world (including the actions of others)?" When you think, "If I call about the mattress, it is evidence that others like me will also call," you are thinking evidentially.

  ### Why It Works in Some Cases and Fails in Others

  You asked for the conditions that make the difference. The divergence between the email paradox and the highway mattress comes down to one specific structural feature of the game: **Coordination vs. Anti-Coordination.**

  **1. When It Works: Coordination Problems (The Mattress & The Meeting)**
  Superrationality is highly effective in situations where the optimal outcome requires everyone to do the *same* thing, or where the cost of redundancy is low compared to the cost of inaction.
  *   **The Mattress:** This is a *Volunteer's Dilemma*. The worst outcome is that *no one* calls. The "bad" outcome is that *multiple* people call (wasting a few minutes). If you universalize your reasoning ("Everyone who sees this will call"), the problem gets solved. The redundancy is a minor cost; the solution is a major gain. Superrationality breaks the "Bystander Effect" because it overrides the assumption of independence ("Someone else will do it") with an assumption of correlation ("If I don't, no one will").
  *   **The Meeting:** Similar structure. If everyone stays silent, the meeting fails. If everyone asks questions, the meeting succeeds (or at least continues). Universalizing "speak up" leads to a better collective outcome than universalizing "stay silent."

  **2. When It Fails: Anti-Coordination Problems (The Email Game)**
  Superrationality creates a paradox in situations where the optimal outcome requires players to do *different* things.
  *   **The Email:** This is a *Unique Volunteer Dilemma* (or an Anti-Coordination Game). The winning condition is explicitly **asymmetry**: exactly one person must act, while the rest do not.
  *   **The Crash:** When you apply superrational reasoning here, you assume correlation ("If I reply, they will reply"). Since the goal is to be the *only* one, correlation is fatal. If you assume everyone thinks like you, you are forced into a loop:
      *   If I reply, everyone replies -> Loss.
      *   If I don't, no one replies -> Loss.
      *   Because the reasoning is symmetric, you cannot find a deterministic stable point.
  *   **The Solution:** In anti-coordination games, superrationality dictates that you must **randomize**. The only way for symmetric rational agents to achieve asymmetry is to adopt a *mixed strategy*. You should reply with a probability of $1/N$ (where $N$ is the number of people). If all 15 of you had rolled a 15-sided die and replied only on a 1, you would have maximized the group's chance of winning. Your deterministic reasoning ("I should/I shouldn't") was the error, not the superrationality itself.

  ### The Verdict

  The move you are making is **Superrationality**.

  It is a valid and powerful heuristic for navigating social reality because, in the real world, people *are* often correlated. We share cultures, norms, and cognitive architectures. Standard game theory often fails in real life because it assumes strangers are independent agents; superrationality correctly identifies that in many social contexts, we are running similar "software."

  **The Rule of Thumb:**
  *   Use **Superrationality** when the problem is a **Tragedy of the Commons** or a **Bystander Effect** (where we need to align to avoid mutual destruction).
  *   Suspend **Superrationality** (and introduce randomness) when the problem is **Anti-Coordination** (where we need to differentiate to avoid collision).

  Your intuition was correct: it is not magic, and it is not morality. It is a predictive engine that leverages symmetry. It failed in the email game not because the reasoning was wrong, but because the game was designed to punish the very correlation that superrationality relies on.
