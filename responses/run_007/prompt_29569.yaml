answer: |-
  **Setting:** *The Velvet Brain, a dimly lit bar two blocks from the convention center. It's 11:30 PM on the second night of the Cognitive Science Society conference. The air smells of stale hops and dry-erase marker.*

  **Characters:**
  *   **ELENA:** Associate Professor, Computational Cognitive Science. Believes in the Computational Theory of Mind (CTM), specifically a modern Bayesian/Probabilistic version.
  *   **MARCUS:** Senior Researcher, Dynamical Systems & Embodied Cognition. Skeptical of computational metaphors, leans toward radical embodied cognitive science.

  *[They are sitting at a small high-top table. Elena has a notebook open; Marcus is spinning a coaster.]*

  **ELENA:** You have to admit, the predictive processing model presented today accounted for the reaction time data better than the pure dynamical account. It wasn't just a fit; it captured the *structure* of the error.

  **MARCUS:** It captured the structure because they built a model with enough free parameters to dance around the data points. That doesn't mean the brain is doing Bayesian inference. It means the mathematicians are good at curve fitting.

  **ELENA:** Come on, Marcus. That's the old "it's just a metaphor" line. We aren't talking about silicon chips. We're talking about information processing. When the visual cortex edges detect a gradient, that is a computation. It's a transformation of representational states according to a rule. If you deny that, you deny the only framework we have that explains systematicity.

  **MARCUS:** There it is. Systematicity. The Fodor/Pylyshyn hammer. "If you can think 'the cat is on the mat,' you can think 'the mat is on the cat,' therefore you must have combinatorial syntax."

  **ELENA:** Exactly. Productivity and systematicity are the bedrock of cognition. How do you get that with differential equations? How does an attractor landscape explain why I can understand a sentence I've never heard before? That requires discrete, recombinable parts. That is computation, by definition.

  **MARCUS:** But why assume the *mechanism* shares the properties of the *output*? Just because language is combinatorial doesn't mean the neural substrate is manipulating symbols. A radio produces music, but there aren't little violins inside the speaker. You're conflating the description of the behavior with the ontology of the machine.

  **ELENA:** I'm not conflating them. I'm invoking Marr's levels. I don't care about the neurochemistry. I care about the computational level—*what* is being computed and *why*. At that level of abstraction, the brain *is* a computer. It takes input, processes it via algorithms, and produces output. If I can write code that mimics the input-output function of a cognitive module, I've identified the computation.

  **MARCUS:** But Marr's levels assume a clean separation between hardware and software that doesn't exist in biology. In your laptop, the transistor is distinct from the bit. In the brain, the "hardware" is constantly rewriting its own "software" through plasticity, neuromodulation, and metabolic constraints. The medium is not passive. You can't abstract away the biology and still call it a computation without stretching the word "computation" until it snaps.

  **ELENA:** Multiple realizability. It doesn't matter *what* it's made of. If a silicon chip and a neural net do the same function, they are instantiating the same computation.

  **MARCUS:** That's the homunculus fallacy waiting to happen. Who decides they are doing the "same" function? You, the observer. You're imposing the computational description from the outside. This is Putnam's triviality argument. If you map states of a rock to states of a finite state automaton correctly, the rock is implementing that automaton. If computation is just "state change over time," then a bucket of water is a computer. A solar system is a computer.

  **ELENA:** *[Sighs, takes a sip of beer]* We've been over this. Pancomputationalism is a risk, sure, but we constrain it. We don't say *any* mapping counts. We say the mapping has to be *causal* and *counterfactual-supporting*. The system has to be in that state *because* it processed the previous state according to the rule. The rock doesn't do that. The brain does.

  **MARCUS:** Does it? Or does the brain just evolve toward energy minima? When a neuron fires, is it "processing a symbol" or is it reacting to electrochemical pressure? You say "symbol," I say "physiological event." The moment you call it a symbol, you've smuggled in semantics. You've said this spike pattern *means* something.

  **ELENA:** It does mean something. It covaries with the environment.

  **MARCUS:** Covariation isn't meaning. Smoke covaries with fire, but smoke doesn't *represent* fire in the absence of an interpreter. This is the symbol grounding problem. In a computer, the syntax is defined by the engineer. The voltage *means* '1' because we decided it does. In the brain, there is no engineer. There is no little man inside reading the neural code. If the brain is a computer, who is reading the output?

  **ELENA:** Nobody is reading it! That's the beauty of functionalism. The "meaning" is the functional role. The state represents "predator" because of how it interacts with the "flight" module and the "fear" module. Semantics is internal to the system's architecture.

  **MARCUS:** That's circular. You're defining the role of the symbol by its relation to other symbols. You never touch the ground. You never touch the world. You have a closed loop of syntax pretending to be semantics. I'm arguing that cognition isn't about manipulating internal representations of the world; it's about coupling with the world. I don't compute a model of the table to avoid hitting it; my body perceives the affordance and moves. The computation is in the loop of agent-and-environment, not inside the skull.

  **ELENA:** But you can't explain *offline* cognition with that. I can think about a table when there is no table. I can plan for next year. I can do logic. Where is the environment in that loop?

  **MARCUS:** You're simulating the environment using motor schemas. You're re-enacting perceptual states. It's still embodied, just decoupled. But look, Elena, my main worry isn't just that you're wrong. It's that your framing is heuristically dangerous. If you assume the brain is a computer, you stop looking for the laws of neural dynamics. You start looking for "code." You start looking for the "grandmother cell" or the "engram" as if it's a file on a hard drive. And you won't find it. Because it's not there.

  **ELENA:** And if I assume it's *not* a computer, I lose the ability to model it rigorously. "Dynamics" can describe anything. A swirling storm is dynamic. A thought is dynamic. But that doesn't tell me *how* the thought leads to the decision. Computation gives me leverage. It lets me say, "If the algorithm is X, then lesion Y should produce deficit Z." And it works. We cure patients because the computational model predicted the breakdown.

  **MARCUS:** You cure patients because you intervened on a biological organ using biological knowledge, and you're retroactively claiming the computational description did the heavy lifting.

  **ELENA:** No. The computational description told us *where* to cut. Look, Marcus, I think we're fighting over the word "computation." You hear "computer" and you think "Dell laptop with a CPU." I mean "a physical system whose states can be interpreted as manipulating symbols based on their formal properties."

  **MARCUS:** But that interpretation is the problem! "Can be interpreted." That's epistemic, not ontological. The question is: Is the brain *intrinsically* computational, or is it just a biological organ that we find it *useful* to describe computationally?

  **ELENA:** Does the distinction matter? If the description yields prediction and control, it's capturing something real. If I describe gravity as the curvature of spacetime, is that "real" or just a useful model?

  **MARCUS:** It matters if the model blinds you to the reality. If you think spacetime is *literally* a fabric, you might miss the quantum structure underneath. If you think the brain is *literally* a computer, you miss the fact that it's a wet, noisy, self-organizing chemical soup where noise is a feature, not a bug. In your computers, noise is error. In the brain, stochastic resonance is how we detect signals.

  **ELENA:** Bayesian brains *use* the noise. That's still computation. Probabilistic computation. You're fighting a ghost, Marcus. Nobody thinks the brain is a von Neumann architecture anymore. We know it's parallel, distributed, noisy. But it's still transforming information.

  **MARCUS:** "Information." There's the other loaded word. Shannon information? Semantic information?

  **ELENA:** Shannon. Correlation.

  **MARCUS:** Then you don't have semantics. You have correlation. And correlation doesn't give you "aboutness." You haven't solved the hard problem of intentionality; you've just buried it under a layer of math.

  **ELENA:** *[Leans back, rubbing her temples]* Okay. Fair. We haven't solved intentionality. But neither have you. Saying "it's about coupling" doesn't explain how the coupling becomes a thought. It just pushes the mystery into the environment.

  **MARCUS:** True. I don't have a magic answer. But I think your answer is a category error. You're trying to solve a biological problem with a logical solution.

  **ELENA:** And you're trying to solve a logical problem with a biological description. Look, maybe the truth is in the middle. Maybe "computation" is the right vocabulary for the cognitive level, and "dynamics" is the right vocabulary for the neural level, and we need a bridge theory we don't have yet.

  **MARCUS:** *[Smiles slightly]* A bridge theory. That's just a polite way of saying "we're both stuck."

  **ELENA:** It's a polite way of saying the phenomenon is harder than our labels. But I'm not giving up the computational stance. It's the only thing that keeps me from drowning in the noise of the EEG data. I need the abstraction.

  **MARCUS:** And I'm not giving up the dynamical stance. It's the only thing that keeps me from hallucinating little men inside the neurons. I need the biology.

  **ELENA:** *[Raises her glass]* To the abstraction.

  **MARCUS:** *[Clinks his glass against hers]* To the biology.

  **ELENA:** We're going to be arguing about this in ten years, aren't we?

  **MARCUS:** Probably twenty. But the drinks are on you if I publish the next grant proposal first.

  **ELENA:** Deal. But if my model predicts the fMRI BOLD signal within 5% error, you're admitting that *something* computational is happening.

  **MARCUS:** I'll admit something *predictable* is happening. Don't push your luck.

  *[They laugh, the tension breaking into the comfortable exhaustion of colleagues who know the debate is the work itself.]*
