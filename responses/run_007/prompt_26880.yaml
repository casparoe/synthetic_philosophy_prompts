      *   *The WKR Problem:* The "Evil Demon" case. A demon threatens to torture you unless you admire him. You have a reason to admire him (prudential), but he isn't admirable. If fittingness = reasons to have an attitude, the demon counts as fitting.
      *   *Buck-Passer (BPVT):* Wants to say $X$ is valuable/fitting iff there are reasons to have an attitude toward $X$. But must exclude the demon's threat. Needs a principled distinction between RKRs (object-related) and WKRs (state-related/consequential). Claims this *can* be done without circularity (i.e., without just saying "RKRs are the ones that relate to value").
      *   *Reasons-Monist/Primitivist (RMP):* Thinks the distinction is messy or impossible to draw non-circularly. The demon threat *is* a reason to admire. Therefore, the Buck-Passing Account (BPA) of value fails. Value/Fittingness is primitive or distinct from reasons.
