answer: |-
  **JOINT STATEMENT ON THE WRONG KIND OF REASONS PROBLEM**

  **Date:** October 24, 2023
  **Signatories:**
  *   **Dr. Elena Vance** (Proponent of Buck-Passing Value Theory)
  *   **Dr. Marcus Thorne** (Proponent of Reasons Monism & Fittingness Primitivism)

  **Context:** This document summarizes the outcomes of a six-month adversarial collaboration regarding the "Wrong Kind of Reasons" (WKR) problem. Our goal was not to force consensus, but to isolate the precise locus of disagreement, identify shared commitments, and determine which empirical or conceptual tests would adjudicate our divergent claims.

  ### I. AGREED CLAIMS

  1.  **The Demon Intuition:** In the standard "Evil Demon" case (where a demon threatens to torture you unless you admire him), the demon does not become admirable. Even if the threat provides sufficient normative pressure to induce admiration, it does not make the demon a fitting object of admiration.
  2.  **Explanatory Requirement:** Any account of normative reasons for attitudes must explain *why* the reason rationalizes the attitude. A consideration cannot be a reason for an attitude if it renders the attitude unintelligible as a response to the object of that attitude.
  3.  **Failure of Simple Distinctions:** We agree that the traditional distinction between "object-given" and "state-given" reasons is insufficient as it stands. Merely noting that a reason concerns the consequences of having an attitude (state) rather than the properties of the object (object) does not, without further qualification, successfully filter out WKRs in all cases (e.g., cases where the object's properties entail consequences).
  4.  **Dead Ends:** We jointly declare the following theoretical moves to be dead ends for both our positions:
      *   Defining Right-Kind Reasons (RKRs) simply as "reasons that make the attitude fitting" (circular for the Buck-Passer).
      *   Denying that the demon threat provides any normative reason whatsoever (implausible for the Monist).
      *   Claiming that the WKR problem is purely linguistic with no metaphysical implications for the nature of value.
  5.  **Normative Force:** We agree that both RKRs and WKRs possess normative force. The disagreement concerns the *structural role* that force plays in the analysis of value and fittingness.

  ### II. DISAGREEMENTS TABLE

  | Question | Position A (Vance: Buck-Passing) | Position B (Thorne: Monist/Primitivist) |
  | :--- | :--- | :--- |
  | **1. Are WKRs reasons *for* the attitude?** | No. WKRs are reasons to *want*, *bring about*, or *enable* oneself to have the attitude. They are not reasons for the attitude itself. | Yes. WKRs are genuine reasons for the attitude. The distinction between "right" and "wrong" kind is not a distinction in the *existence* of reasons, but in their relevance to *value*. |
  | **2. Can Value be analyzed via Reasons?** | Yes. $X$ is valuable/fitting iff there are RKRs to have an attitude toward $X$. Value reduces to reasons, provided WKRs are filtered out. | No. Value/Fittingness is a primitive normative property. Reasons are evidence of or responses to value, but value cannot be reductively analyzed in terms of reasons without circularity. |
  | **3. Is there a principled RKR/WKR distinction?** | Yes. There is a non-circular, structural criterion (e.g., based on the "taking condition" or "constitutive aims") that distinguishes RKRs from WKRs without invoking 'value'. | No. Any attempt to draw this line non-circularly fails. To identify an RKR, one must inevitably invoke the notion of fittingness or value, making the Buck-Passing Account circular. |
  | **4. What is the source of the distinction?** | The distinction lies in the nature of the *attitude* itself (e.g., what it is to believe, admire, or fear). | The distinction lies in the *domain* of normativity (e.g., pragmatic vs. evaluative), which cannot be reduced to one another. |

  ### III. CRUXES AND TEST CASES

  We have identified two specific sub-questions ("Cruxes") where further argumentation or conceptual analysis would significantly shift the dialectic. For each, we specify a case or argument we agree is relevant, and our divergent predictions regarding what it demonstrates.

  #### Crux 1: The Target of the Normative Force
  **Sub-Question:** Are WKRs reasons *for* the attitude (Thorne), or reasons *to cause* the attitude (Vance)?

  *   **Agreed Bearing Case:** **The "Pill" Scenario.**
      *   *Setup:* A scientist offers you \$1 million to admire a saucer of mud. She also offers you a pill that will instantly cause you to admire the mud without any cognitive mediation. You can take the money and the pill.
      *   *Relevance:* This isolates the reason (money) from the object (mud) and tests whether the reason targets the *state* of admiring or the *act* of bringing it about.

  *   **Predictions:**
      *   **Vance (Buck-Passing):** The money is a reason to *take the pill*. It is not a reason for the admiration itself. If you admire the mud *because* of the money (via the pill), the admiration is not supported by a reason for admiration, but by a reason for acquisition. Therefore, the Buck-Passing Account remains safe; the money is not an RKR.
      *   **Thorne (Monist):** The money is a reason to admire the mud, full stop. The pill is merely the mechanism. The fact that the reason does not track the mud's properties shows that *reasons for attitudes* are broader than *reasons that ground value*. This proves Value cannot be analyzed as Reasons, because you can have reasons for an attitude toward a valueless object.

  #### Crux 2: The "Object-Given" Specification
  **Sub-Question:** Can 'object-given' be spelled out without sneaking in evaluative vocabulary (e.g., 'fitting', 'appropriate', 'merit')?

  *   **Agreed Bearing Argument:** **The "Feature-Tracking" Argument.**
      *   *Setup:* Consider anger toward an insult. The RKR is that the insult was disrespectful. The WKR is that getting angry will intimidate the insulter.
      *   *Relevance:* We must determine if "disrespect" can be identified as an RKR-ground without implicitly relying on the fact that it *makes anger fitting*.

  *   **Predictions:**
      *   **Vance (Buck-Passing):** Yes. We can specify "disrespect" as a feature that constitutes the *formal object* of anger (e.g., a slight against status) via functional role or constitutive aims, without using the word 'fitting'. The distinction is metaphysical/psychological, not evaluative.
      *   **Thorne (Monist):** No. Selecting "disrespect" over "intimidation potential" as the relevant feature *just is* an evaluative judgment about what anger is for. Any functional description that succeeds will tacitly presuppose the notion of fittingness it aims to analyze.

  ### IV. VERBAL DISPUTE ASSESSMENT

  We have assessed whether our disagreement is merely verbal.

  **Finding:** Partially Verbal, but with Substantive Residue.

  1.  **Verbal Component:** There is a terminological divergence regarding the phrase "Reason for [Attitude]."
      *   **Vance** reserves this phrase for considerations that count in favor of the attitude *in virtue of the attitude's constitutive standards*.
      *   **Thorne** uses this phrase for any consideration that counts in favor of having the attitude, regardless of source.
      *   *Agreement:* If we adopt Vance's terminology, Thorne agrees WKRs are not "Reasons for [Attitude]" (they are "Reasons to Cause [Attitude]"). If we adopt Thorne's terminology, Vance agrees WKRs are "Reasons" but denies they enter the value analysis.

  2.  **Substantive Residue:** Even after aligning terminology, a metaphysical disagreement remains regarding the **Analysis of Value**.
      *   **Vance** maintains that Value *is* the property of having RKRs (once filtered).
      *   **Thorne** maintains that Value is a *sui generis* property that *generates* RKRs.
      *   *Why this matters:* This affects the direction of explanation. For Vance, reasons are fundamental. For Thorne, value/fittingness is fundamental. This cannot be resolved by stipulation; it requires argument regarding the explanatory priority of normative properties.

  ### V. NEXT STEPS

  We commit to drafting separate papers addressing Crux 2 (The Feature-Tracking Argument). Vance will attempt to formulate a constitutive aim account of admiration that excludes the demon's threat without using evaluative terms. Thorne will attempt to demonstrate that any such account tacitly relies on a prior notion of correctness.

  ***

  **Signed,**

  *(Signature)*
  **Elena Vance**

  *(Signature)*
  **Marcus Thorne**
