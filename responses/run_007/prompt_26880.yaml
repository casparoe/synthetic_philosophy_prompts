          2.  *Reasons-Monist/Primitivist (RMP):* Believes there's no clean object-given/state-given line. WKRs are just reasons. Fittingness/Value must be taken as primitive (not analyzed via reasons) or at least not in a way that requires filtering WKRs first.
      *   **Context:** Good-faith adversarial collaboration on the "Wrong Kind of Reasons" (WKR) problem.
      *   **Format:** Actual document (not a description).
