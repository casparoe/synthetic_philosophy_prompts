      *   **Section 3: Cruxes:**
          *   *Crux 1: The Target of the Reason.* Is the reason for *admiring* or for *wanting to admire*?
              *   *Case:* The "Self-Fulfilling Prophecy" case. If believing you have a reason makes you admire, does that make it a reason for admiration?
