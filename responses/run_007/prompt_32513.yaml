      *   *Claim 2:* "Just as the rules of chess determine what counts as a valid move, the rules of a language game determine what counts as a meaningful statement."
      *   *Claim 3:* "If you're not playing the game, you're not making sense."
      *   *Claim 4:* "Since each community has its own language games with their own internal rules, truth is always relative to a game, and there's no standpoint outside all games from which to judge one as better than another." (The Relativist Conclusion)
