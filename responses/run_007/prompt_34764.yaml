      *   *Astronomy:* Biosignatures in exoplanet atmospheres. (EGF: Rare. LGF: Common).
      *   *Verbal Check:* Ensure "Filter" is defined consistently to avoid semantic disputes.

  7.  **Refining and Polishing (Iterative Process):**
