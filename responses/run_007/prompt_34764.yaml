  9.  **Final Polish:** (Writing the content with high precision). *Self-correction during drafting:* Make sure the "Late Filter" position doesn't sound *too* doom-laden; frame it as a probabilistic assessment of sustainability. Make sure "Early Filter" doesn't sound like religious exceptionalism; frame it as biochemical rarity.

