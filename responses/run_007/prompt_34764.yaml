          1.  Numbered list of agreed-upon claims (definitions, data, constraints).
          2.  Disagreements table (precise formulations of differences).
          3.  Identified cruxes (sub-questions driving the disagreement).
          4.  Evidence/arguments/tests for each crux + pre-registered predictions.
