      *   **Tone:** Formal, neutral, collaborative, precise (philosophical/scientific register).

  2.  **Deconstruct the Positions:**
      *   **Early Great Filter (EGF):** Life/intelligence is extremely rare. We are likely alone. The silence is because no one else is there. Optimistic for long-term survival (if we exist, we passed the hard part), but lonely.
      *   **Late Great Filter (LGF):** Life/intelligence is common. Civilizations destroy themselves before becoming interstellar. The silence is because they die young. Pessimistic for long-term survival, but potentially less lonely (in the past/present nearby).

  3.  **Drafting Section 1: Agreed Claims (Common Ground):**
