answer: |-
  Dear Friend,

  I hope this letter finds you well. I have been thinking about our recent conversation regarding the moral boundaries of markets, specifically why we often recoil from certain exchanges even when they appear consensual and harmless. It is a fascinating puzzle, and comparing the repugnance account with the commodification or corruption account offers a rich way to understand the structure of these objections. While both accounts aim to explain why we resist markets in things like kidneys, votes, or disaster supplies, they locate the source of the trouble in fundamentally different places, which leads to distinct implications for how we view the stability and validity of these moral constraints.

  The repugnance account, often associated with market designers like Alvin Roth, locates the problem primarily in the psychological and visceral reaction of the community. On this view, the wrong-making feature of a transaction is that it triggers a widely shared sense of disgust or aversion. When we consider the sale of kidneys, for instance, the objection arises because the act of putting a price on a body part feels viscerally wrong to most people, akin to a taboo. The objection attaches primarily to the act of exchange itself and the immediate emotional response it provokes in observers or participants. Because this account relies on shared sentiments, it implies that such objections are largely conventional and potentially mutable. If social norms shift, or if the transaction is redesigned to be less visible or offensive, the repugnance might fade. Consequently, an objection based solely on repugnance could be mistaken if it rests on misinformation or irrational disgust, and it is certainly capable of changing over time as society becomes desensitized or accustomed to the practice.

  In contrast, the commodification or corruption account, championed by philosophers like Michael Sandel and Elizabeth Anderson, locates the problem in the normative degradation of the good being exchanged. Here, the wrong-making feature is not the feeling of disgust, but the transformation of the social meaning of the good. When we sell votes, the objection is not merely that it feels icky, but that it corrupts the meaning of citizenship by turning a civic duty into a commercial transaction. The objection attaches to the good itself and the social meaning of the exchange, arguing that market values crowd out non-market norms like solidarity or dignity. For example, price-gouging during a disaster is objectionable not just because it angers people, but because it replaces a norm of mutual aid with a norm of profit maximization at the expense of the vulnerable. This account implies that the objection is not merely conventional or psychological but is grounded in a theory of value. While social meanings can evolve, the objection is not mistaken simply because people stop feeling disgusted; rather, it would only be mistaken if the analysis of how markets affect the good is incorrect.

  The divergence between these two accounts becomes stark when we imagine a scenario where public sentiment shifts but the structural relationship between money and the good remains unchanged. Consider the case of voting. Suppose a society undergoes a cultural shift where citizens no longer feel any visceral disgust at the idea of selling their votes, perhaps viewing it as a legitimate expression of property rights over their political influence. The repugnance account would predict that the objection has vanished and would recommend allowing the market, as the primary barrier was the shared aversion. However, the commodification account would maintain its objection and recommend prohibition, arguing that even without disgust, the market still corrupts the egalitarian meaning of democracy and undermines the ideal of equal citizenship.

  This divergence reveals that the commodification account is likely doing the deeper explanatory work. The repugnance account describes the symptom, while the commodification account diagnoses the underlying moral condition. Often, the reason we feel repugnance in the first place is that we intuitively sense the corruption of meaning; we feel disgust at selling kidneys because we recognize, however vaguely, that it treats persons as things. If the feeling fades while the corruption remains, the repugnance account loses its normative force, leaving us without a reason to protect the value of the good. Therefore, while repugnance is a useful signal for identifying contested markets, the commodification account provides the substantive moral justification for why those boundaries should exist, independent of the fluctuating tides of public sentiment.

  I hope this comparison clarifies the structural differences between these two perspectives. It suggests that when we debate market limits, we should not only ask whether a transaction makes us uncomfortable but also what kind of society we create when we allow money to speak in spheres where it perhaps should remain silent.

  Warmly,

  Your Friend
