          *   *Novel's dramatization:* It highlights the *motivation* vs. *comprehension* gap. Charlie wanted to be loved, not just smart. The doctors exploited this. The novel suggests the consent was *procedurally* obtained but *substantively* flawed because the "self" signing couldn't conceive of the consequence. It's not just about IQ; it's about the inability to imagine a radical shift in ontology.
          *   *Narrative sympathy:* We feel for Pre-Op Charlie, but we also see the tragedy of the violation. The novel suggests the consent was invalid *morally*, even if signed.

      *   **High-IQ Charlie's View of Earlier Self:**
          *   *Philosophical view:* Psychological continuity (Locke). Is Pre-Op Charlie the same person?
          *   *Novel's dramatization:* Genius Charlie is often cruel to Pre-Op Charlie. He sees him as a "vegetable" or a child. He feels disconnected. *However*, the emotional core remains. The trauma of the bakery workers is felt by both.
          *   *Authority:* Genius Charlie claims authority to stop the experiment (regarding Algernon) and to document the decline. He asserts the right to define the meaning of the life. But does he have the right to dictate the care of the future low-IQ self? The novel shows him isolating himself. He writes the report *for* the future self, but also *against* the doctors.
          *   *Narrative sympathy:* We side with Genius Charlie's insight, but we are made uncomfortable by his arrogance. The novel complicates the idea that "more intelligence = more moral authority."

      *   **Decline and Advance Directives:**
          *   *Philosophical view:* Dworkin's "precedent autonomy" vs. Dresser's "current interests."
          *   *Novel's dramatization:* This is the crux. Genius Charlie knows he will decline. He writes the progress reports. As he declines, he loses the ability to understand the reports.
          *   *The Ending:* The final "P.S. please if you get a chance put some flowers on Algernons grave in the back yard" is key. It shows emotional continuity despite cognitive loss.
