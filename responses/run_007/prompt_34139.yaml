      *   *Self-Correction on the "Ban":* Rousseau explicitly says he isn't writing a treatise on theater in the abstract, but about Geneva. He says, "I do not say that the stage is an absolute evil." (Need to verify quote mentally: Yes, he admits it has uses for other states). So the "ban everywhere" conclusion is definitely wrong.

  5.  **Final Polish:** Ensure the distinction between *mimetic* corruption (Plato) and *sociological* corruption (Rousseau) is clear. Emphasize that for Rousseau, the theater is an institution of *alienation* (spectator vs. actor), which is the core political crime, not just the content of the plays.

