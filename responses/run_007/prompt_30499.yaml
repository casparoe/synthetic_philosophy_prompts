prompt: |-
  I am a retired physical chemist who has only recently begun reading the philosophical literature on intellectual property and the ownership of ideas. A working life spent around priority disputes, material transfer agreements, and questions of who may use whose method has left me with a supply of hard cases, but not with a clear statement of what a theory in this area is actually for. Before I read another proposal, I want the specification: a list of desiderata that any adequate account of the ownership of ideas must satisfy, where adequacy is judged relative to the following purpose—an account good enough to guide thinking about scientific priority, about the ethics of using another person's ideas, and about the general shape intellectual-property protection should take. For each desideratum, give the case or consideration that motivates it. Mark which are non-negotiable (I have in mind, at least, the distinction between an idea, its expression, and its physical embodiment; the difference between independent invention and copying; and the need to explain why protection, if it exists, ever gives way to a public domain) and which are merely the preferences of particular camps (whether attribution is a property right or a separate moral claim; whether the underlying justification is labor, personality, or social incentive). Flag any pairs of desiderata that may resist joint satisfaction—for instance, enough control to reward the creator and enough freedom for later researchers to build on the idea—and say which single requirement does the most to eliminate the standard contenders, scoring the Lockean, Hegelian, and utilitarian accounts against the list only briefly. Keep the weight on the criteria and their motivating cases; the scorecard should be the shortest part.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Retired physical chemist, experienced with priority disputes, MTAs, method usage. New to philosophical literature on IP.
      *   **Goal:** Wants a "specification" (list of desiderata) for a theory of ownership of ideas *before* reading more proposals.
      *   **Purpose of Theory:** Guide thinking on scientific priority, ethics of using ideas, shape of IP protection.
      *   **Requirements:**
          *   List desiderata with motivating cases/considerations.
          *   Mark as "Non-negotiable" (NN) or "Contingent/Partisan" (CP).
          *   Specific NN examples given by user: Idea/Expression/Embodiment distinction, Independent Invention vs. Copying, Expiration/Public Domain.
          *   Flag tensions/trade-offs between desiderata.
          *   Identify the single requirement that eliminates the most standard contenders.
          *   Score Lockean, Hegelian, Utilitarian accounts briefly (shortest part).
          *   **Tone:** Rigorous, precise, respectful of scientific experience, philosophical but grounded.

  2.  **Deconstruct the Subject Matter:**
      *   The user is asking for a meta-ethical/meta-legal framework for Intellectual Property (IP), specifically tailored to *science* (priority, methods) but applicable generally.
      *   The core tension in IP philosophy is always between *incentive/attribution* (creator rights) and *dissemination/building* (public good).
      *   As a chemist, the user knows that ideas in science behave differently than novels or inventions. Discovery vs. Invention.
      *   The "Specification" needs to be functional. What must a theory *do* to be useful to this specific user?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: Distinction between idea and expression.* (User specified this). Why? Because you can't own a law of nature.
      *   *Candidate 2: Independent Discovery.* (User specified this). Why? Science is often simultaneous. Punishing independent discovery kills progress.
      *   *Candidate 3: Public Domain/Expiration.* (User specified this). Why? Knowledge must eventually be free.
      *   *Candidate 4: Attribution/Priority.* Crucial for scientists. Even if I can't stop you using my method, I need credit.
      *   *Candidate 5: Cost of Enforcement.* A theory shouldn't demand impossible policing.
      *   *Candidate 6: Cumulative Innovation.* Science stands on shoulders of giants. A theory can't lock up building blocks.

      *Refining for the "Non-negotiable" vs. "Contingent" split:*
      *   NN: Must handle the Idea/Expression split (otherwise it claims ownership of truth).
      *   NN: Must handle Independent Invention (otherwise it contradicts scientific reality).
      *   NN: Must allow for Public Domain (otherwise knowledge stagnates).
      *   CP: Attribution as Property vs. Moral Right (Legal vs. Ethical).
      *   CP: Justificatory basis (Labor vs. Utility).

  4.  **Identifying Tensions:**
      *   Reward vs. Access. (The classic IP tension).
      *   Priority (who was first) vs. Utility (who made it work).
      *   Secrecy (to protect) vs. Disclosure (to publish).

  5.  **Identifying the "Killer" Desideratum:**
      *   Which one kills the most theories?
      *   Lockean labor theory often struggles with the "Public Domain" and "Idea/Expression" distinction (if I mix labor with an idea, why don't I own it forever?).
      *   Hegelian personality theory struggles with "Independent Invention" (two people can't have the same unique personality expression in the same way).
      *   Utilitarianism struggles with "Attribution" as a right (if hiding the author maximizes utility, utilitarianism says hide it).
      *   *Decision:* The **Independent Invention** constraint is the hardest for strong property models, but the **Idea/Expression** distinction is the most fundamental metaphysical hurdle. However, the prompt asks for the one that eliminates standard contenders. The **Public Domain/Expiration** requirement is often the hardest for Lockean/Hegelian accounts to justify without importing Utilitarianism. Let's look closer. Actually, the **Idea/Expression** (or Idea/Fact) distinction is the most fatal to pure Labor theories. If I discover a law of nature, I labored, but I don't own it. A theory must explain *why* labor doesn't yield property there.
      *   *Alternative:* The requirement to distinguish **Independent Invention from Copying**. Pure property rights usually ignore mental state. IP is unique because innocent infringement is treated differently (or should be).
      *   *Selection:* I will argue that the **Independent Invention** constraint is the most eliminative because it contradicts the core intuition of "property" as exclusive control. If I own it, you can't use it, even if you made it yourself. IP says you *can*. This breaks the analogy with tangible property.

  6.  **Scoring the Theories:**
      *   *Lockean:* Good on labor, bad on limits (why stop at 20 years? why not facts?).
      *   *Hegelian:* Good on attribution/personality, bad on independent invention (personality isn't replicable).
      *   *Utilitarian:* Good on limits/public domain, bad on inherent rights/attribution (attribution is only good if it helps incentives).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's background. Set the stage.
      *   **The Specification (Desiderata):** Numbered list. NN vs. CP. Motivation/Case for each.
      *   **Tensions:** Explicitly flag the conflicts.
      *   **The Eliminator:** Identify the hardest constraint.
      *   **Scorecard:** Brief evaluation of the three major theories.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address "scientific priority"? Yes, need a specific desideratum for attribution/citation norms distinct from commercial exclusion.
      *   *Check:* Did I address "Material Transfer Agreements"? This implies a contract vs. property distinction. Maybe add a desideratum about the boundary between contract and property. *Decision:* Keep it focused on "ownership of ideas" as requested, but acknowledge contract in the tensions.
      *   *Tone Check:* Ensure it sounds like it's written for a scientist. Use terms like "boundary conditions," "state variables," "constraints."
      *   *User's NN list:* Ensure Idea/Expression, Independent Invention, and Public Domain are explicitly included and marked NN.

  9.  **Final Polish:**
      *   Make sure the "Eliminator" argument is sharp.
      *   Ensure the Scorecard is truly brief.
      *   Verify the distinction between NN and CP is clear.

  **(Self-Correction on the "Eliminator"):**
  Many philosophers argue the "Idea/Expression" dichotomy is the hardest. But for a scientist, "Independent Invention" is the daily reality (simultaneous discovery). A theory of *ownership* that doesn't account for the possibility of two owners is broken. However, the prompt asks what eliminates *standard contenders*. Lockean theory is very popular but struggles immensely with the "Proviso" (leaving enough for others) and the "Public Domain." Hegelian theory struggles with the fact that scientific ideas aren't "personal" in the artistic sense. Utilitarianism struggles to ground *rights*.
  Actually, the most fatal constraint for a *property* theory is the **Independent Invention** constraint. Standard property rights are *in rem* (against the world). IP rights are *in personam* regarding the act of copying. If a theory treats ideas like land, it fails the independent invention test. I will stick with that.

  10. **Final Review against constraints:**
      *   List desiderata? Yes.
      *   Motivating cases? Yes.
      *   Mark NN/CP? Yes.
      *   Flag tensions? Yes.
      *   Single requirement eliminating contenders? Yes.
      *   Scorecard brief? Yes.
      *   Weight on criteria? Yes.

