answer: |-
  ### Specification for a Theory of Intellectual Ownership

  You have asked for the boundary conditions before evaluating the models. As a physical chemist, you understand that a theory is only as good as its ability to predict behavior at the limits. In the philosophy of intellectual property (IP), the "limits" are the edge cases where intuition fractures.

  Below is the specification. It is divided into **Non-Negotiable Constraints (NN)**—conditions any adequate theory must meet to match legal and scientific reality—and **Contingent Preferences (CP)**—variables where reasonable theorists disagree.

  ---

  ### I. Non-Negotiable Constraints (NN)

  These are the hard boundary conditions. A theory that fails these does not describe the actual ecosystem of scientific ideas; it describes a fantasy.

  **1. The Idea/Expression/Embodiment Distinction**
  *   **Requirement:** The account must explain why ownership attaches to a specific formulation or apparatus but never to the underlying natural law, fact, or abstract method itself.
  *   **Motivating Case:** *Einstein and E=mc².* Einstein receives priority and fame, but no one can own the mass-energy equivalence. If a theory of ownership implies that mixing labor with an idea yields property in the *idea*, it fails. It must explain why the "fact of nature" remains a commons even when discovered by a specific agent.
  *   **Status:** **NN**. Without this, science becomes a system of toll-booths on truth.

  **2. The Independent Invention Defense**
  *   **Requirement:** The account must distinguish between *copying* and *parallel discovery*. It must explain why independent derivation negates a claim of wrongful appropriation, even if the resulting idea is identical.
  *   **Motivating Case:** *Newton and Leibniz.* Both developed calculus. A theory of ownership based purely on "first to hold" treats Leibniz as a thief. A functional account must recognize that in science, ideas are often "in the air" (multiple discovery). Ownership rights must be contingent on the *history of acquisition*, not just the state of possession.
  *   **Status:** **NN**. This distinguishes IP from tangible property (where finding the same gold bar independently is impossible).

  **3. The Sunset Condition (Public Domain)**
  *   **Requirement:** The account must provide a principled reason why protection expires. It cannot justify perpetual ownership.
  *   **Motivating Case:** *The Aspirin Patent.* Bayer owned acetylsalicylic acid for a time; now it is generic. If an idea is "property" derived from personality or labor, why does the right vanish after 20 years? A theory that justifies creation but cannot justify the *termination* of control fails to account for the cumulative nature of science.
  *   **Status:** **NN**. Perpetual ownership of ideas creates an "anticommons" that halts future research.

  **4. The Attribution/Priority Norm**
  *   **Requirement:** The account must separate the right to *credit* (citation/naming) from the right to *exclude* (commercial use). It must explain why a scientist retains a claim to priority even after the idea enters the public domain.
  *   **Motivating Case:** *Rosalind Franklin and DNA.* Even though the structure of DNA is public knowledge and unpatentable, using it without acknowledging Franklin's contribution is an ethical violation. A theory that conflates economic exclusion with moral attribution cannot explain why we still cite dead scientists.
  *   **Status:** **NN**. In science, priority is often more valuable than profit. A theory must account for this non-rival good.

  ---

  ### II. Contingent Preferences (CP)

  These are variables where different philosophical camps locate the "source" of the right. You may prefer one, but an adequate theory can function with any of them, provided it satisfies the NN constraints.

  **5. The Source of Value (Labor vs. Personality vs. Incentive)**
  *   **Requirement:** The theory must identify *why* the creator has a claim, but the specific justification is variable.
  *   **Motivating Case:** *The CRISPR Dispute.* Is the right to CRISPR based on the labor of Doudna/Charpentier (Lockean), the expression of their scientific will (Hegelian), or the need to incentivize biotech investment (Utilitarian)?
  *   **Status:** **CP**. This determines the *tone* of the law, not necessarily its functional limits.

  **6. The Scope of "Derivative" Control**
  *   **Requirement:** The theory must define how far control extends into modifications, but the boundary is negotiable.
  *   **Motivating Case:** *Improving a Method.* If I refine your spectrometer technique, do I owe you rent? Some theories say yes (broad control); others say no (unless I used your specific blueprint).
  *   **Status:** **CP**. This is a policy slider, not a metaphysical necessity.

  **7. Contract vs. Property**
  *   **Requirement:** The theory must decide if rights are inherent (property) or negotiated (contract/MTAs).
  *   **Motivating Case:** *Material Transfer Agreements.* You mentioned MTAs. A Lockean might view the material as property following the researcher; a Contractarian views the rights as solely defined by the signature on the MTA.
  *   **Status:** **CP**. Modern science relies on both, but a theory can prioritize one over the other.

  ---

  ### III. Structural Tensions

  No theory satisfies all desiderata without friction. You must expect the following trade-offs.

  **Tension A: Reward vs. Access (The "Control" Paradox)**
  *   **Conflict:** Desideratum NN4 (Attribution/Reward) requires giving the creator control. Desideratum NN3 (Public Domain) and NN1 (Idea Distinction) require removing control.
  *   **The Friction:** To incentivize the discovery (Reward), you must grant a temporary monopoly. To enable the next discovery (Access), you must break that monopoly.
  *   **Resolution:** Most theories resolve this by making the right *statutory* rather than *natural*. It is a privilege granted by the state, not an inherent right of the person.

  **Tension B: Priority vs. Utility**
  *   **Conflict:** Desideratum NN4 (Priority) rewards the *first* discoverer. Scientific progress often rewards the *best* explainer or the one who makes it usable.
  *   **The Friction:** Strict priority rules (First-to-File) can disadvantage the careful verifier in favor of the hasty publisher.
  *   **Resolution:** Science handles this via citation norms (soft law); IP handles this via patent claims (hard law). A unified theory often struggles to bridge the two.

  ---

  ### IV. The Eliminator

  **The Single Requirement that Eliminates the Most Contenders:**
  **Desideratum NN2: The Independent Invention Defense.**

  **Why:**
  This is the stress test that breaks the analogy with tangible property.
  *   If I carve a chair from wood, and you independently carve an identical chair from your own wood, I cannot stop you from selling yours.
  *   If I write a poem, and you independently write the *exact same poem* (word for word), I *can* stop you from publishing it (in Copyright).
  *   If I invent a chemical process, and you independently invent the *exact same process*, I *can* stop you from using it (in Patents).

  **The Elimination:**
  Any theory that relies strictly on **Lockean Labor** ("I mixed my labor with the commons, therefore it is mine") fails here. If you also mixed your labor, why is your claim inferior? Labor theory cannot explain why independent labor is voided by prior publication without importing external utilitarian constraints.
  Any theory that relies strictly on **Hegelian Personality** ("This idea is an extension of my self") fails here. Two people cannot have the same "personality" extension. If the idea is identical, the Hegelian must claim one of you is lying, which contradicts the reality of simultaneous discovery in science.

  Only a **Utilitarian/Incentive** account easily absorbs NN2. It says: "We ignore your independent labor not because it didn't happen, but because enforcing it would cost more in litigation than it would gain in incentive."

  ---

  ### V. Scorecard

  **1. Lockean (Labor-Desert)**
  *   **Performance:** Poor.
  *   **Failure:** Struggles with NN1 (Idea/Expression) and NN3 (Sunset). If I labored, why do I lose the property? Why don't I own the law of nature I found? Requires heavy modification (the "Lockean Proviso") to function in IP.
  *   **Verdict:** Good for moral intuition on plagiarism; bad for legal structure.

  **2. Hegelian (Personality)**
  *   **Performance:** Poor.
  *   **Failure:** Collapses on NN2 (Independent Invention). Cannot account for identical ideas arising from distinct persons. Also struggles with NN1; scientific facts are not "personal" expressions.
  *   **Verdict:** Good for Copyright (art); inadequate for Patents/Science.

  **3. Utilitarian (Social Welfare/Incentive)**
  *   **Performance:** Best Fit.
  *   **Success:** Easily satisfies NN2 (Independent Invention is irrelevant to social cost) and NN3 (Sunset is necessary for public good).
  *   **Weakness:** Struggles with NN4 (Attribution). If hiding the author's name maximized profit/utility, Utilitarianism would endorse it. It treats attribution as instrumental, not inherent.
  *   **Verdict:** The only framework that consistently satisfies the Non-Negotiable Constraints, though it leaves the scientist's moral claim to priority under-explained.
