      *   *Conservatism (Wright/Conservative):* Passes Anti-Bootstrapping. Fails Anti-Skepticism (requires antecedent warrant).

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the diagnostic goal.
