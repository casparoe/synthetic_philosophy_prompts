answer: |-
  The argument you are describing is widely known as the **Anti-Luminosity Argument**, and the property it attacks is called **Luminosity**.

  It was most famously formulated by the contemporary philosopher **Timothy Williamson** in his 2000 book *Knowledge and Its Limits* (specifically Chapter 5).

  Here is a breakdown of the name, the mechanics of the argument, its relationship to the KK principle, and its scope.

  ### 1. The Name and the Target Property

  **The Property: Luminosity**
  A condition $C$ is **luminous** if and only if: whenever $C$ obtains, the subject is in a position to know that $C$ obtains.
  *   *Example:* Traditional Cartesian views held that mental states like "being in pain" or "thinking" are luminous. If you are in pain, you cannot fail to know it.
  *   *The Claim:* Williamson argues that **no non-trivial condition is luminous.**

  **The Argument: The Anti-Luminosity Argument (or Margin for Error Argument)**
  This is the specific Sorites-style reasoning you described. It uses the gradual nature of conditions (like cooling down) to show that knowledge requires a "margin for error" that is incompatible with luminosity at the boundaries.

  ### 2. How the Argument Works

  The argument relies on three main components: the assumption of luminosity, a Sorites series (gradual change), and a principle of knowledge safety.

  **The Premises:**
  1.  **Luminosity Assumption:** Suppose condition $C$ (e.g., feeling cold) is luminous. (If $C$ is the case, I am in a position to know $C$).
  2.  **Gradualism:** $C$ can change gradually over time. We can imagine a sequence of moments $t_1, t_2, ... t_n$ where at $t_1$ you are definitely not cold, and at $t_n$ you are definitely cold, and the change between adjacent moments is imperceptible.
  3.  **Margin for Error (Safety):** For you to know $C$ at time $t_i$, your belief must be **safe**. This means you could not easily have been wrong. If your evidence at $t_i$ is indistinguishable from your evidence at $t_{i-1}$, and $C$ was false at $t_{i-1}$, then believing $C$ at $t_i$ is unsafe. (Because in a nearby possible world where things are exactly as they seem to you, $C$ might be false).

  **The Derivation:**
  *   Consider the first moment $t_k$ where you are actually cold ($C$ is true).
  *   Because the change is gradual, your subjective experience (evidence) at $t_k$ is indistinguishable from your experience at $t_{k-1}$ (where you were not cold).
  *   If you claim to **know** you are cold at $t_k$, your belief must be safe.
  *   But since your evidence is the same as at $t_{k-1}$, you cannot rule out that you are actually at $t_{k-1}$ (where you are not cold).
  *   Therefore, your belief at $t_k$ is not safe; you could easily have been wrong (because a moment earlier, that same evidence accompanied a lack of coldness).
  *   Therefore, you do not know you are cold at $t_k$.
  *   **Contradiction:** We assumed $C$ was luminous (if $C$, then you know $C$), but we found a case where $C$ is true and you don't know it.
  *   **Conclusion:** $C$ is not luminous.

  ### 3. Connection to the KK Principle

  You noted that this feels like the **KK Principle** ($Kp \to KKp$: If you know $p$, you know that you know $p$). You are correct that they are neighbors, but they play opposite roles in this debate.

  *   **Internalists** often argue *for* KK by arguing that knowledge is luminous. (If I know $p$, I am in a mental state that guarantees $p$; since I have privileged access to my mental states, I know I'm in that state; therefore I know that I know $p$).
  *   **Williamson** uses the Anti-Luminosity argument to argue *against* KK.
      *   If KK were true, then the condition "Knowing $p$" would be luminous. (If you know $p$, KK says you know you know $p$).
      *   Williamson shows that **no** interesting condition is luminous (including the condition of knowing).
      *   Therefore, KK is false. You can know something without knowing that you know it, specifically in "borderline" cases where your evidence is good enough for knowledge but not good enough to rule out nearby error.

  ### 4. Scope: Does it apply to *any* gradual condition?

  Williamson argues that this applies to **all contingent conditions**. He claims there are no luminous conditions other than trivial logical truths (like $A=A$). However, the argument's force depends on specific commitments in epistemology and metaphysics.

  **Where it applies strongly:**
  *   **Perceptual States:** (Being cold, seeing red, being awake). These clearly have gradual transitions and rely on fallible faculties.
  *   **Mental States:** (Being in pain, believing $p$). Williamson challenges the Cartesian idea that the mind is transparent to itself. He argues that even pain can fade gradually, and there is a last moment of "pain" where you can't distinguish it from "no pain."

  **Where it might stop applying (Counter-arguments/Limits):**
  1.  **Rejection of Safety:** The argument hinges on the **Safety Condition** for knowledge (you couldn't easily have been wrong). If you hold a theory of knowledge that does not require safety (e.g., some forms of pure Reliabilism or Process Reliabilism that ignore nearby possible worlds), the argument loses its bite. You could say, "I know I'm cold because my thermometer is reliable, even if I can't distinguish this moment from the last."
  2.  **Infallibilism:** If you define knowledge as requiring absolute certainty (Infallibilism), then you simply admit you never "know" you are cold in the boundary cases. But Williamson argues this makes knowledge too rare to be useful.
  3.  **Discrete/Sharp Boundaries:** The argument assumes **Epistemicism** about vagueness (the view that there *is* a sharp boundary between cold and not-cold, we just can't know where it is).
      *   If you are a **Supervaluationist** (there is no fact of the matter at the boundary), the argument changes. You can't know you are cold because there is no truth to be known at the boundary.
      *   If you believe some states are truly binary with no intermediate phenomenology (e.g., a digital switch flipping in the brain), the "indistinguishability" premise might fail. However, Williamson argues that our *access* to even binary states is via gradual neural processes, so the margin for error remains.
  4.  **Contextualism:** Some epistemologists argue that the standards for "knowing" shift. In a low-stakes context, the margin for error required is small, so you *can* know you are cold. In a high-stakes context, the margin widens, and you don't know. This dissolves the paradox by making "knowing" context-sensitive.

  ### Summary
  *   **Name:** The Anti-Luminosity Argument (or Margin for Error Argument).
  *   **Proponent:** Timothy Williamson.
  *   **Target:** The property of **Luminosity** (the idea that if a state obtains, you are in a position to know it).
  *   **Mechanism:** Knowledge requires a **margin for error** (safety). Gradual conditions create borderline cases where your evidence is compatible with the state not obtaining. Therefore, you cannot know the state obtains at the boundary.
  *   **Implication:** It undermines Internalism and the KK principle, suggesting that knowledge is not perfectly transparent to the knower.

  If you want to read the source, look up **Timothy Williamson, *Knowledge and Its Limits*, Chapter 5: "The Margin for Error Principle."** It is the definitive treatment of the move you have been spotting.
