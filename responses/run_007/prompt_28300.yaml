prompt: |-
  I teach an upper-level undergraduate seminar on concepts and categories — about 15 students, one 80-minute session. We've covered classical, prototype, and theory-theory views of concepts, but I want them to feel why none of those fully captures what the Letter Spirit project was after: the question of what makes every 'a' an 'a' across radically different typefaces, handwriting styles, and graphical contexts.

  Design an in-class activity where students make categorization judgments about letterforms and run into the tension between fluid recognition and rigid definition. The activity should force them to confront cases where they confidently identify something as an 'a' but cannot articulate a rule that covers all 'a's and excludes all non-'a's — and then to confront the unsettling flip side, where a rule they propose admits things they refuse to count as 'a's or excludes things they can't help but see as 'a's. By the end, they should feel the pull of the idea that a category has something like a "spirit" that isn't reducible to a checklist of features, a prototype plus similarity metric, or a theory of the domain — and they should also feel why that's philosophically uncomfortable.

  Give me: the setup and materials (I can print things and bring blank paper), the rules or structure with a timeline, and a debrief that maps specific moments in the activity to the philosophical issues. Also tell me what will predictably go wrong the first time I run it, and which aspect of the Letter Spirit problem the activity can't capture and I'll need to supply myself.

  Your response should begin with the activity itself — the setup, rules, and timeline — with no preface or commentary. The debrief and the notes on what goes wrong and what's missing should follow, but still no meta-commentary about the response.
