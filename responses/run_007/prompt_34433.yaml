  ### The Game Matrix

  Consider a two-player normal-form game where Player 1 chooses rows ($T, M, B$) and Player 2 chooses columns ($L, C, R$). The payoffs are given as $(u_1, u_2)$.

  | P1 \ P2 | $L$ | $C$ | $R$ |
  | :--- | :---: | :---: | :---: |
  | **$T$** | $2, 1$ | $0, 0$ | $2, 0$ |
  | **$M$** | $0, 0$ | $0, 2$ | $1, 2$ |
  | **$B$** | $0, 1$ | $2, 0$ | $2, 0$ |

  This game satisfies all specifications: it is $3 \times 3$, uses small integers $\{0, 1, 2\}$, and demonstrates the strict superiority of mixed-strategy elimination.

  ---

  ### 1. Iterated Elimination of Strictly Dominated **Pure** Strategies

  We check if any pure strategy is strictly worse than another pure strategy against all opponent pure strategies.

  *   **Player 1:**
      *   Compare $T$ and $M$: $T$ yields $2 > 0$ against $L$, but $0 = 0$ against $C$. Strict dominance fails due to the tie at $C$.
      *   Compare $B$ and $M$: $B$ yields $2 > 0$ against $C$, but $0 = 0$ against $L$. Strict dominance fails due to the tie at $L$.
      *   No other pure dominances exist.
  *   **Player 2:**
      *   Compare $L$ and $C$: $L$ yields $1 > 0$ against $T$, but $0 < 2$ against $M$. No dominance.
      *   Compare $L$ and $R$: $L$ yields $1 > 0$ against $T$, but $0 < 2$ against $M$. No dominance.
      *   No other pure dominances exist.

  **Result:** No strategies are eliminated.
  **Surviving Pure-Strategy Profiles:** All 9 profiles survive: $\{(T,L), (T,C), (T,R), (M,L), (M,C), (M,R), (B,L), (B,C), (B,R)\}$.

  ---

  ### 2. Iterated Elimination of Strictly Dominated **Mixed** Strategies

  We now allow players to compare pure strategies against probability distributions over their other strategies.

  **Step 1: Player 1 eliminates $M$.**
  Player 1 mixes $T$ and $B$ with probability $0.5$ each ($\sigma_1 = 0.5T + 0.5B$). This mixture strictly dominates $M$.
  *   **Against $L$:** $0.5(2) + 0.5(0) = 1 > 0$ ($M$'s payoff).
  *   **Against $C$:** $0.5(0) + 0.5(2) = 1 > 0$ ($M$'s payoff).
  *   **Against $R$:** $0.5(2) + 0.5(2) = 2 > 1$ ($M$'s payoff).

  $M$ is eliminated. The game reduces to rows $\{T, B\}$.

  **Step 2: Player 2 eliminates $C$ and $R$.**
  In the reduced game (rows $T, B$), Player 2's payoffs for $L$ are $(1, 1)$, while payoffs for $C$ and $R$ are $(0, 0)$ in both rows.
  *   $L$ strictly dominates $C$ ($1>0$ in both rows).
  *   $L$ strictly dominates $R$ ($1>0$ in both rows).
  $C$ and $R$ are eliminated. The game reduces to column $\{L\}$.

  **Step 3: Player 1 eliminates $B$.**
  In the reduced game (column $L$), Player 1's payoff for $T$ is $2$, and for $B$ is $0$.
  *   $T$ strictly dominates $B$.
  $B$ is eliminated.

  **Result:** The procedure converges to a unique profile.
  **Surviving Pure-Strategy Profiles:** Only $\{(T, L)\}$ survives.

  ---

  ### 3. The Dominance Inequality

  The elimination of $M$ relies on the following strict inequality holding for all $s_2 \in \{L, C, R\}$:

  $$ 0.5 \cdot u_1(T, s_2) + 0.5 \cdot u_1(B, s_2) > u_1(M, s_2) $$

  Substituting the values:
  *   $s_2 = L: \quad 0.5(2) + 0.5(0) = \mathbf{1} > 0$
  *   $s_2 = C: \quad 0.5(0) + 0.5(2) = \mathbf{1} > 0$
  *   $s_2 = R: \quad 0.5(2) + 0.5(2) = \mathbf{2} > 1$

  ---

  ### 4. Diagnosis of the Crucial Feature

  The feature doing the work is the **presence of specific payoff ties that prevent pure dominance but are resolved by averaging.**

  Specifically, $M$ ties with $T$ at column $C$ ($0=0$) and ties with $B$ at column $L$ ($0=0$). These ties prevent $T$ or $B$ from *strictly* dominating $M$ on their own. However, the mixed strategy averages the high payoff of $T$ at $L$ with the high payoff of $B$ at $C$, turning the ties into strict advantages ($1 > 0$).

  **Perturbation:**
  *   If we perturb the tie at $(M, C)$ from $0$ to $-1$, $T$ would strictly dominate $M$ purely, and the distinction between the procedures would vanish.
  *   If we perturb the tie at $(M, C)$ from $0$ to $1$, the mixed strategy would yield $1$ against $C$, tying $M$'s payoff of $1$. Strict dominance would fail entirely, and $M$ would survive even the mixed procedure.
  The example hinges entirely on these equalities.

  ---

  ### 5. Objection and Rebuttal

  **The Objection:**
  A proponent of pure-strategy dominance might argue that mixed strategies are not "real" actions available to a player in a one-shot game. They would claim that rationality only compels a player to avoid strategies worse than some *definite* alternative plan. Since $M$ is not worse than $T$ alone or $B$ alone, they would argue $M$ is rationally permissible, and the mixed-strategy elimination relies on a mathematical artifact rather than strategic reality.

  **The Rebuttal:**
  This objection fails because rationality is defined by **expected utility maximization**, not merely the comparison of deterministic outcomes. A rational player evaluates strategies based on their performance against beliefs about the opponent's play.
  1.  **Never a Best Response:** A strategy strictly dominated by a mixed strategy is *never* a best response to any belief (probability distribution) over the opponent's strategies. $M$ is never a best response for Player 1. Retaining a strategy that is never optimal is irrational.
  2.  **Decisiveness:** The pure-strategy procedure is incomplete; it fails to identify all irrational strategies. The mixed-strategy procedure correctly identifies the set of rationalizable strategies. Therefore, for the purpose of defining rational choice, the mixed-strategy procedure is decisive and the pure-strategy procedure is demonstrably weaker.
