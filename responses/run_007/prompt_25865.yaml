answer: |-
  **Setting:** *A quiet corner of the school library, late afternoon. Textbooks and notebooks are spread out across the table. Tom is leaning forward, animated. Alex (you) is leaning back, looking skeptical.*

  **Tom:** Look, I'm just saying, once you accept Kripke's argument about rigid designators, the rest follows. "Water is H2O" isn't just a lucky guess about the world. It's a necessary truth. It *couldn't* have been otherwise.

  **Alex:** But that's exactly what bugs me. It feels like you're letting metaphysics bully linguistics. If we woke up tomorrow and the Royal Society announced, "Actually, the stuff in the taps is XYZ, not H2O," nobody would say, "Oh, I guess I've never drunk water." They'd say, "Oh, water is XYZ." We'd update the definition. We wouldn't say we were wrong about where the water was.

  **Tom:** But that's because you're confusing *meaning* with *reference*. That's the descriptivist trap. You think the word "water" *means* "clear, drinkable liquid in lakes." But Kripke shows that's not how names or natural kind terms work. The word "water" doesn't mean a list of properties. It *picks out* a substance.

  **Alex:** Okay, but how does it pick it out if not by describing it? When I teach a kid what water is, I point to a glass and say, "That's water." I'm pointing to the properties—wet, clear, thirst-quenching. I'm not pointing to the molecular structure.

  **Tom:** Right, you're fixing the reference ostensively. You point and say, "Let's call *that* stuff water." But here's the kicker: you're pointing to the stuff *underlying* those appearances. You're saying, "Whatever shares the same hidden structure as *this* sample is water." So, when you use the word "water" in a different situation, or even in a hypothetical scenario, you aren't asking, "Does this fit the description?" You're asking, "Is this the same stuff?"

  **Alex:** But how do I know it's the "same stuff" without checking the description?

  **Tom:** Science tells you that. That's why "Water is H2O" is *a posteriori*—we needed science to find out—but *necessary*—once we found out, we realized it couldn't be anything else. Think about it modally. Can you imagine a possible world where water exists but isn't H2O?

  **Alex:** Sure. A world where the clear liquid in the lakes is XYZ.

  **Tom:** No, you can't. Because if it's XYZ, it's not water. You might have a world that *looks* like ours, with clear liquid in the lakes, but if the liquid is XYZ, then there is no water in that world. There's just "twin-water." The term "water" rigidly designates H2O. It picks out H2O in every possible world where H2O exists.

  **Alex:** See, that just feels like a stipulation. You're defining "water" as "H2O" and then acting surprised that "Water is H2O" turns out to be necessary. But in actual usage, if we found out the lakes were XYZ, the word "water" would go with the lakes, not the molecules. Language is a tool for communication, Tom. If I say "Pass the water," and you hand me H2O, great. If it turns out H2O is toxic and XYZ is what we should drink, we'd switch to calling XYZ "water." We wouldn't say, "Alas, there is no water to drink."

  **Tom:** But that's changing the subject! You're talking about changing the *concept* based on utility. I'm talking about what the word *refers to*. Think about gold. If we found out that everything we thought was gold was actually pyrite, and the real metal with atomic number 79 was something else we'd never seen, would we say, "Oh, pyrite is gold"?

  **Alex:** Probably, yeah. If all the rings and bars we have are pyrite, "gold" refers to that shiny yellow stuff.

  **Tom:** No! We'd say, "We were mistaken. This isn't gold. Gold is actually that rare metal over there." We distinguish between *appearing* to be gold and *being* gold. The descriptivist view collapses that distinction. It makes "being gold" just mean "looking like gold." But we know that's not how we treat natural kinds. We assume there's an essence.

  **Alex:** Okay, but let's grant that there's an essence. My problem is the "rigid" part. You're saying the link between the word and the essence is locked forever, from the moment of the first "baptism." But history isn't that clean. People used the word "water" for centuries before they knew about molecules. They meant "drinkable liquid."

  **Tom:** Kripke anticipates that. It's the causal-historical chain. The first people used "water" to refer to the stuff around them. They passed the word down. We inherited the reference, not the description. We are linked to that original sample by a social chain. So even though the ancients didn't know it was H2O, they were referring to H2O. They just had false beliefs about it.

  **Alex:** But that makes reference magical. How does my use of the word today reach back and touch a specific molecule type? If I'm in a community where everyone thinks water is an element, and I say "water," I'm participating in that description. If the chain is broken by a massive error—like if *all* the samples in the chain were actually XYZ—then surely the reference shifts.

  **Tom:** But that's the point of the thought experiment. If *all* the samples were XYZ, then there was no water in your community. You were talking about XYZ, but you were calling it "water" mistakenly. Like calling a cat a "dog." You can have a community that mistakenly calls cats "dogs" for a thousand years, but that doesn't make cats dogs.

  **Alex:** That's a disanalogy. "Dog" and "Cat" are biological species we can distinguish by sight. "Water" and "XYZ" are indistinguishable to the user. If the usage is identical, the meaning is identical. You're prioritizing the metaphysics of the substance over the pragmatics of the speaker.

  **Tom:** I'm prioritizing truth. If meaning is just use or description, then science can't discover what things *are*, it can only decide how we *talk*. But when scientists say "We discovered what water is," they aren't proposing a new language game. They're telling us what the stuff *is*. Kripke captures that intuition. Descriptivism makes scientific discovery sound like a legislative decision.

  **Alex:** But Kripke makes ordinary language sound like a metaphysical error. If I say, "It's possible water might not have been H2O," I'm making a sensible claim about my state of knowledge. Kripke says, "No, you're wrong. You're imagining a world with XYZ, not a world where water isn't H2O." It feels like he's correcting my intuition rather than explaining it. He's saying, "You don't mean what you think you mean."

  **Tom:** He's saying you're confusing epistemic possibility with metaphysical necessity. It's *epistemically* possible that water isn't H2O—meaning, for all we knew beforehand, it might not have been. But *metaphysically*, given that water *is* H2O, there's no world where it isn't. Kripke isn't saying you're stupid; he's saying there are two different kinds of "possible" here.

  **Alex:** I get the distinction. I just don't buy that the metaphysical one trumps the linguistic one. If the goal of language is to coordinate behavior, and we coordinate on the macroscopic properties, then the reference is fixed by those properties. If the essence diverges from the properties, the language follows the properties.

  **Tom:** And I think that leads to relativism. If reference follows properties, then "water" means something different to a chemist than to a toddler. But when they talk to each other, they understand each other. Why? Because they're talking about the same stuff. The rigid designator explains how communication works across different levels of knowledge. The toddler and the chemist are linked to the same substance, even if their descriptions differ wildly.

  **Alex:** They're linked by the context, not by a magical rigid chain. We can explain that without rigid designation. We just say the extension of the word is determined by the standard examples in the community.

  **Tom:** But "standard examples" is just a description in disguise! What makes them standard? Because they're the *real* stuff. You're smuggling in the realism you're trying to argue against.

  **Alex:** *(Laughs)* Maybe. But I still think if the Royal Society called tomorrow and said it's XYZ, you'd be the only one insisting there's no water in the taps.

  **Tom:** And I'd be the only one drinking it, knowing I was actually drinking XYZ, not water!

  **Alex:** You'd be thirsty for a long time, then.

  **Tom:** *(Grinning)* Maybe. But at least I'd be metaphysically consistent.

  **Alex:** And I'd be hydrated. Look, I think we're stuck. You think reference is about locking onto the world's structure. I think reference is about how we navigate the world together.

  **Tom:** Yeah. You're doing philosophy of language as sociology. I'm doing it as metaphysics.

  **Alex:** Exactly. Kripke wins if we care about truth conditions across possible worlds. I win if we care about what people would actually say in a crisis.

  **Tom:** Fair enough. But admit it—"Water is H2O" sounds better as a necessary truth than a contingent fact.

  **Alex:** I'll admit it sounds more profound. But profound doesn't always mean right.

  **Tom:** We'll see what the teacher says.

  **Alex:** Yeah. But if she says water is XYZ, I'm telling her you said it doesn't exist.

  **Tom:** Deal.
