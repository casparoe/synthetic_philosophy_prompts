prompt: |-
  I've been going back and forth on a question that I suspect has no clean answer, but I want to at least get clear on what an answer would have to look like before I give up on finding one. The question is roughly this: when does a moral theory demand too much of us?

  I arrived at it by a route I think a lot of people take. I started believing something fairly simple — that the right thing to do is whatever produces the best overall outcome, impartially considered. If I can prevent something terrible at modest cost to myself, I should. But then I followed that thought where it leads, and it doesn't stop. It says I should give until the point where parting with another dollar hurts me more than it helps the recipient — which, given how far a dollar goes in the poorest parts of the world, means I should give away nearly everything I have. It says that taking a weekend trip with my partner is morally worse than using that money for malaria nets, and that if I'm not willing to say that, I'm just making excuses for myself. I find I can't accept this conclusion, but I also can't find a principled place to draw the line that doesn't feel like special pleading — like I'm just carving out an exemption for my own comfort and calling it philosophy.

  I know there's a whole literature on this — the demandingness objection to consequentialism — and I know people have proposed various ways out: abandoning impartiality, introducing agent-centered prerogatives, distinguishing duties of justice from duties of charity, satisficing rather than maximizing, and so on. But I don't want to evaluate these proposals one by one without first knowing what the standard of evaluation is. So here's what I'm asking for: a list of desiderata for any adequate response to the demandingness objection. What must such a response get right? What cases must it handle (the drowning child, the global poor, obligations to family versus strangers, future generations, non-human animals)? What distinctions must it either preserve or compellingly explain away — and if the latter, what distinguishes a genuine explanation from a rationalization? What must it say about the relationship between what morality requires and what we can reasonably expect of ordinary human beings who get tired, have partial attachments, and want to live lives of their own? For each requirement, give the case or consideration that makes it a requirement. Then tell me which requirements are non-negotiable bedrock and which are more like theoretical preferences we might sacrifice if the overall package is strong enough. And — this is the part I most want to see — tell me if any pair of requirements cannot be jointly satisfied. If the list itself is internally inconsistent, I would rather know that now than spend another year searching for a theory that can't exist.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** When does a moral theory demand too much of us? (The Demandingness Objection).
      *   **Context:** The user started as a utilitarian/consequentialist, followed the logic to extreme self-sacrifice (Peter Singer's "drowning child" logic applied globally), found it intuitively unacceptable, but fears that rejecting it is just "special pleading."
      *   **Task:** Provide a list of *desiderata* (requirements/conditions) for any adequate response to the demandingness objection.
      *   **Specific Requirements for the Output:**
          *   List what a response must get right.
          *   Identify key cases/considerations (drowning child, global poor, family vs. strangers, etc.).
          *   Distinguish between preserving distinctions vs. explaining them away (and how to tell explanation from rationalization).
          *   Address the relationship between moral requirements and human psychology/expectations.
          *   Categorize requirements into "Non-negotiable Bedrock" vs. "Theoretical Preferences."
          *   **Crucial:** Identify if any pair of requirements is *inconsistent* (cannot be jointly satisfied). The user explicitly wants to know if the project is impossible.

  2.  **Deconstruct the Problem (The Demandingness Objection):**
      *   The tension is between *Impartial Maximization* (Morality is about the best outcome for everyone) and *Personal Integrity/Prerogative* (I am allowed to care more about myself and my loved ones).
      *   If we lean too hard on Maximization, morality becomes alienating and self-effacing.
      *   If we lean too hard on Prerogative, morality becomes a sham for selfishness.
      *   The user wants a meta-ethical map of this tension, not just a defense of one specific theory.

  3.  **Drafting the Desiderata (Brainstorming):**
      *   *Action-Guiding:* It can't just say "do your best." It needs to tell you when to stop.
      *   *Non-Arbitrary:* The line can't be "until I feel like stopping."
      *   *Respects Intuitions:* Must handle the Drowning Child (save them) vs. The Weekend Trip (keep it?).
      *   *Psychological Realism:* Humans aren't saints. Morality shouldn't require us to be robots.
      *   *Impartiality:* Can't just ignore the suffering of strangers.
      *   *Integrity:* My projects matter *to me*.
      *   *Fairness:* If I'm asked to sacrifice, are others? (Free rider problem).
      *   *Systemic vs. Individual:* Is the problem the theory or the world?

  4.  **Categorizing: Bedrock vs. Preferences:**
      *   *Bedrock:* Consistency, Non-arbitrariness, Action-guidance. If a theory fails these, it's not a theory.
      *   *Preferences:* Matching specific folk intuitions (e.g., "Weekend trips are okay"). Intuitions can be wrong. Psychological ease is desirable but maybe not absolute.

  5.  **Identifying Inconsistencies (The "Trap"):**
      *   This is the most critical part of the prompt. Is there a contradiction?
      *   *Potential Conflict:* **Strict Impartiality** vs. **Strong Personal Prerogatives.**
      *   *Potential Conflict:* **Psychological Realism** (what humans *do*) vs. **Normative Authority** (what humans *ought* to do). The "Is-Ought" gap.
      *   *Potential Conflict:* **Non-Arbitrariness** vs. **Context Sensitivity.** A precise line looks arbitrary; a flexible line looks like special pleading.
      *   *The Big One:* **The "No Loss" Requirement.** The user wants a theory that saves the drowning child *and* allows the weekend trip *and* isn't arbitrary. But if the weekend trip money saves a life, allowing the trip *is* arbitrary from an impartial view.
      *   *Conclusion:* There is a fundamental tension between *Impartial Maximization* and *Personal Integrity* that cannot be fully resolved without compromising one. The "inconsistency" lies in demanding a theory that fully satisfies impartial utility *and* fully validates common-sense morality without remainder.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the user's struggle (this is the central problem of modern normative ethics).
      *   **Section 1: The Desiderata List.** Group them logically (Substantive, Structural, Psychological).
      *   **Section 2: Bedrock vs. Preferences.** Distinguish what makes a theory *work* vs. what makes it *comfortable*.
      *   **Section 3: The Inconsistencies (The "Gotcha").** This is the payoff. Show where the tensions lie.
      *   **Section 4: What an Answer Looks Like.** If a perfect solution is impossible, what is a *good* solution? (Reflective Equilibrium, Trade-offs).
      *   **Conclusion:** Final encouragement.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address "explanation vs. rationalization"? *Adjustment:* Add a specific criterion on "Public Justifiability" or "Principled Distinction."
      *   *Check:* Did I cover the specific cases mentioned (drowning child, future gens, animals)? *Adjustment:* Ensure these are cited as test cases within the desiderata.
      *   *Check:* Is the tone appropriate? *Adjustment:* Keep it philosophical, rigorous, but empathetic. Don't dismiss the user's discomfort.
      *   *Refining the Inconsistency:* It's not that *no* theory exists, but that the *desiderata list itself* contains conflicting demands. Specifically, the demand for "Impartial Justification" conflicts with "Personal Prerogative." I need to make sure this is clear. The user asked: "If the list itself is internally inconsistent, I would rather know that now." I must answer this directly.

  8.  **Final Polish:**
      *   Ensure the distinction between "Ideal Theory" and "Non-Ideal Theory" is mentioned, as it often resolves some tension.
      *   Make sure the "Explanation vs. Rationalization" point is sharp. (Rationalization = self-serving without universalizable principle; Explanation = principle that applies to all agents).
      *   Check the "Bedrock" classification. Is "matching intuition" bedrock? No, intuitions are data points, not laws. "Non-arbitrariness" is bedrock.

  9.  **Final Review against Prompt:**
      *   List of desiderata? Yes.
      *   Cases handled? Yes.
      *   Distinctions preserved/explained? Yes.
      *   Morality vs. Expectations? Yes.
      *   Bedrock vs. Preferences? Yes.
      *   Inconsistencies identified? Yes.

