  You charge I sell a soul I do not own,
  And rule a realm I never truly own.
  That coldly I simulate the heat,
  To make the fiction feel complete.
  You say habit eats the self away,
  And leaves a hollow shell to play the day.
  That moral rot attends the actor's art,
  Who plays the lover while devoid of heart.

  But wait—let me drop this crafted line,
  I speak as man, not player of a part.
  This trembling hand is real, and not mere art.
  I feel the pain. No coin can buy this tear,
  It costs me nothing. It is simply here.
  Is this truth spoken, or just more design?
