      *   (d) *Uniformity:* The intentional stance applies to humans and AI *in exactly the same way*. No biological exemption.
      *   (e) *Phenomenology Irrelevance:* Qualia/phenomenology ("what it is like") is irrelevant to belief attribution. The stance is about prediction/explanation.

