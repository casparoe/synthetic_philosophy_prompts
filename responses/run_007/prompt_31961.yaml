      *   **Severity 2 (High): (c) vs. (d).** If humans have intrinsic intentionality based on architecture, and AI (presumably) does not (implied by the contrast in (c)), then the stance is not applying in *exactly the same way*. For humans, it tracks intrinsic facts; for AI, it tracks instrumental utility.
      *   **Severity 3 (Low/Apparent): (c) vs. (e).** Some might argue intrinsic intentionality requires phenomenology. If so, (e) undermines (c). But one can argue for non-conscious intrinsic intentionality. I will mark this as apparent but worth noting.

