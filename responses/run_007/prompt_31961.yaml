          *   (e) Phenomenology irrelevant.
          *   *Tension:* None. Consistent.

  4.  **Synthesize and Rank Tensions:**

      *   **Core Conflict:** The central fracture is between **Instrumentalism (a)** and **Realism about Human Minds (c)**.
