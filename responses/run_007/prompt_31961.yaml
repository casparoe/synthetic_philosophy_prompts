          *   *Verdict:* Derivative tension based on (a)/(c).

      *   **(c) & (d):**
          *   (c) says human intentionality is intrinsic (architecture-based).
          *   (d) says the stance applies to humans *in exactly the same way* as AI.
          *   *Tension:* High. If the stance applies in *exactly the same way*, then the *basis* for attribution should be the same. But (c) posits a specific basis for humans (intrinsic architecture) that implies a realist grounding, whereas the stance applied to AI (per (a) and (b)) is purely instrumental/predictive. If the stance is the *same*, why is the ontology different (intrinsic vs. instrumental)?
