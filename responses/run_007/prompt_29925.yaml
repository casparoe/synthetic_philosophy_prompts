answer: |-
  ### Restatement in Grammar-of-Graphics Vocabulary

  **The ISOTYPE Spec:**
  Define a custom mark type, `geom_pictogram`, where the quantitative aesthetic maps to the **cardinality of mark instances** rather than mark dimensions (width/height/area). Enforce a discrete scale constraint where $1 \text{ glyph} = N \text{ data units}$, implemented via a `stat_bin_unit` transform that rounds values to the nearest integer glyph count. Disable the `size` and `depth` channels for quantitative encoding; map quantity strictly to `count` along a positional axis (`x` or `y`). Apply `theme_minimal` with `ornament = 0` and `perspective_projection = NULL`. The pipeline requires a `transformer` function—a human-in-the-loop pre-processor that selects the glyph lexicon and determines the unit scale $N$ before the data enters the plotting engine.

  **Fudge Flags:**
  1.  **The `transformer`:** In Vega-Lite/ggplot, transforms are deterministic functions (e.g., `log`, `bin`). Neurath's "Transformer" is a *curatorial role* involving pedagogical judgment, not just a math operation. I'm fudging a human designer into a `stat_` layer.
  2.  **Cardinality vs. Size:** Most grammars optimize for continuous scales (mapping value $\to$ `size`). Mapping value $\to$ `n_rows_in_data` (exploding one row into 50 glyph rows) is computationally distinct from standard encoding and often requires data tidying *before* the grammar is invoked.
  3.  **Language vs. Grammar:** I'm treating the pictograms as "marks," but Neurath treats them as "vocabulary." In ggplot, a point is a point; in ISOTYPE, a man-icon is semantically loaded, not just a geometric primitive.

  ---

  ### Residue Report

  **1. Translates Cleanly (The Overlap)**
  *   **Data-Ink Ratio:** Tufte's maximization of data-ink is a direct descendant of Neurath's ban on ornament. `theme_void()` is pure ISOTYPE.
  *   **Flat Projection:** Disabling perspective (`coord_cartesian` vs. `coord_3d`) aligns perfectly with Neurath's rejection of depth cues that distort quantity comparison.
  *   **Standardization:** The idea that mark properties should be consistent across facets matches Neurath's requirement that a "worker" icon looks the same in every chart.

  **2. Translates with Distortion (The Friction)**
  *   **Count vs. Area:** Modern perception research (Cleveland/Mackinlay) ranks position and length highest, area lower. Neurath's "repeat units" rule forces a `count` encoding. In `ggplot2`, this looks like a dot plot or waffle chart, but the *intent* differs: GoG uses counts for distribution; Neurath uses counts for *magnitude*.
  *   **The Transformer:** In Vega-Lite, the compiler handles the "stat-to-mark" translation. Neurath insists a human must mediate this to ensure the "story" isn't lost to algorithmic rigidity. Reducing the Transformer to a `transform` function loses the ethical/pedagogical agency.

  **3. No Counterpart (The Void)**
  *   **Semiotic Lexicon:** The Grammar of Graphics assumes marks are abstract (points, bars). ISOTYPE assumes marks are *semantic* (a shoe means footwear, a man means labor). There is no `scale_shape_semantic()` in Vega-Lite.
  *   **Sociopolitical Goal:** GoG aims for accurate inference. ISOTYPE aims for *social empowerment*. There is no aesthetic channel for "class consciousness" or "democratic access."
  *   **Learnability:** GoG assumes encodings should be intuitively readable (pre-attentive). Neurath accepts that the system must be *taught* like a language, prioritizing long-term literacy over immediate intuition.

  ---

  ### Verdict

  The residue is partially a **blind spot** in the Grammar of Graphics, specifically regarding the perceptual efficacy of discrete unit counting versus continuous area scaling for lay audiences (GoG optimizes for density; Neurath optimizes for concrete comprehension). However, the larger residue is **Neurath smuggling in commitments** that were never about visual encoding per se: he treats visualization not as a neutral tool for inference, but as a *political technology* requiring human curation to serve a specific pedagogical mission. The Grammar of Graphics claims universality; Neurath admits partiality.

  \answer{The residue is Neurath's insistence that visualization is a learned, human-mediated language for social reform, which exceeds the grammar-of-graphics' scope of universal perceptual encoding.}
