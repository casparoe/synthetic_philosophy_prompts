answer: |-
  # JOINT STATEMENT ON THE SEMANTICS OF PROPER NAMES
  **An Adversarial Collaboration between Direct Reference (Millian) and Descriptivist (Frege-Russell) Proponents**

  **Date:** October 24, 2023
  **Signatories:** [The Millian Proponent], [The Descriptivist Proponent]

  ### Preamble
  Over the past academic term, we have engaged in a structured dialectical exchange regarding the semantic function of proper names. While we remain divided on the fundamental metaphysics of linguistic content, we have successfully isolated the points of convergence regarding linguistic data and the explanatory burdens any theory must bear. This document serves as a public record of our agreed-upon data, the precise locus of our theoretical divergence, and the empirical or conceptual cruxes that will determine the future trajectory of this debate. We sign this statement to affirm that our disagreement is substantive and theoretical, not merely a result of talking past one another regarding the phenomena.

  ---

  ### I. Agreed Claims: Data and Explanatory Targets
  We jointly affirm the following claims regarding the linguistic data and the constraints on any adequate theory of proper names.

  1.  **Cognitive Significance:** Identity statements of the form $a = b$ (e.g., "Hesperus is Phosphorus") differ in cognitive value from statements of the form $a = a$ ("Hesperus is Hesperus"). The former can be informative and rationally deniable by a competent speaker; the latter cannot.
  2.  **Substitution Failure in Intensional Contexts:** In belief ascriptions and other propositional attitude contexts, the substitution of co-referential names is not *salva veritate*. (e.g., "Lois believes Superman flies" may be true while "Lois believes Clark Kent flies" is false, even if Superman = Clark Kent).
  3.  **The A Posteriori Nature of Identity:** The truth of true identity statements between distinct names is typically established through empirical investigation, not conceptual analysis.
  4.  **Rigidity:** In modal contexts, proper names designate the same object in every possible world in which that object exists. We agree that names behave rigidly, regardless of whether this rigidity is explained by the name's semantic content or by the mechanism of reference fixation.
  5.  **Explanatory Separation:** An adequate theory must distinguish between the **semantic content** of a name (what contributes to the truth conditions of the utterance) and the **cognitive role** or **mode of presentation** (how the speaker conceives of the referent). We disagree on whether the latter is part of the former.
  6.  **Communication Success:** Speakers successfully communicate about objects even when they associate different descriptive information with the same name, provided they are linked to the same referential chain or object.

  ---

  ### II. Table of Disagreements
  The following table delineates the theoretical divergence. Each formulation is phrased to be acceptable to a sophisticated proponent of the respective view (e.g., acknowledging rigidified descriptions for the Descriptivist and pragmatic enrichment for the Millian).

  | Point of Dispute | Millian (Direct Reference) Formulation | Descriptivist (Frege-Russell) Formulation |
  | :--- | :--- | :--- |
  | **1. Semantic Content** | The semantic content of a proper name is exhausted by its referent (the object itself). Names are logically proper names in the Russellian sense, lacking descriptive sense. | The semantic content of a proper name is given by a descriptive condition or cluster of properties associated with the name by the speaker or community. |
  | **2. Source of Necessity** | The necessity of true identity statements ($a=b$) derives from the metaphysical necessity of self-identity combined with the fact that names are rigid designators of the same object. | The necessity of true identity statements derives from the logical form of the associated descriptions (e.g., rigidified descriptions like "The actual $F$"), which guarantee co-satisfaction across worlds. |
  | **3. Belief Ascriptions** | Substitution failure is a pragmatic phenomenon. The semantic content of the belief report is a singular proposition, but speakers implicate different "guises" or modes of presentation. | Substitution failure is a semantic phenomenon. The content of the name within the belief context includes the descriptive mode of presentation, altering the truth conditions. |
  | **4. Empty Names** | Sentences containing empty names (e.g., "Vulcan") express gappy propositions or no proposition at all; their apparent truth-evaluability is a pragmatic illusion or involves pretense. | Sentences containing empty names express genuine descriptive propositions that can be true or false based on whether anything satisfies the associated description, even if no object exists. |

  ---

  ### III. The Cruxes
  We identify four sub-questions ("Cruxes") where settling the matter would significantly alter the plausibility of one or both frameworks.

  1.  **The Problem of Empty Names:** Can a semantics account for the meaningfulness and truth-evaluability of negative existentials (e.g., "Santa Claus does not exist") without positing descriptive content?
  2.  **Modal Intuitions and Rigidity:** When speakers evaluate counterfactuals (e.g., "Aristotle might not have been a philosopher"), are they tracking the object directly, or are they tracking the satisfaction of a rigidified description ("The actual teacher of Alexander")?
  3.  **The Paderewski Puzzle:** How does the semantics handle cases where a single name is associated with two distinct mental files for the same object (e.g., a speaker thinks "Paderewski the musician" and "Paderewski the statesman" are different people)?
  4.  **Reference Fixing vs. Content:** Does the description used to fix the reference of a name at its baptism become part of the name's semantic content, or is it merely a historical hook that drops away?

  ---

  ### IV. Agreed Cases and Advance Predictions
  For each Crux, we have selected a specific case. We agree that the case is relevant. Below, we record our predictions regarding the *semantic content expressed* and the *truth conditions*, noting where we agree on the truth value but disagree on the explanation.

  #### Crux 1: Empty Names
  *   **Case:** The utterance "Vulcan does not exist," made after the planet Vulcan has been disproven.
  *   **Millian Prediction:** The sentence is intuitively true, but semantically it expresses a gappy proposition (a proposition with an object slot that is empty). Its acceptance as "true" is a matter of pragmatic communication or pretense, not literal semantic truth.
  *   **Descriptivist Prediction:** The sentence is literally true. It expresses a descriptive proposition (e.g., "The planet causing Mercury's perturbations does not exist"). The truth condition is satisfied because nothing fits the description.

  #### Crux 2: Modal Intuitions
  *   **Case:** The utterance "Aristotle might not have taught Alexander," evaluated in a world where Aristotle exists but became a fisherman.
  *   **Millian Prediction:** The utterance is true. The name "Aristotle" picks out the man directly. Since teaching Alexander is a contingent property of the man, the proposition is true in the counterfactual world.
  *   **Descriptivist Prediction:** The utterance is true *only if* the associated description is rigidified (e.g., "The *actual* teacher of Alexander"). If the description is non-rigid (e.g., "The teacher of Alexander"), the utterance would be false in that world. We predict speakers intend the rigidified reading, but we maintain the semantic content is the description, not the man.

  #### Crux 3: The Paderewski Puzzle
  *   **Case:** A speaker, Peter, asserts "Paderewski is not Paderewski," believing the musician and the statesman are distinct individuals.
  *   **Millian Prediction:** Peter asserts a falsehood (a contradiction of the form $a \neq a$). However, he is not irrational because he associates two distinct pragmatic "guises" with the single semantic referent. The semantics is singular; the psychology is dual.
  *   **Descriptivist Prediction:** Peter asserts a truth relative to his idiolect. Because the name "Paderewski" is associated with two distinct descriptive clusters in his mind, the name functions ambiguously. The semantic content of the first token differs from the second token.

  #### Crux 4: Reference Fixing
  *   **Case:** A baptizer points to a man and says, "Let 'Gödel' name the man who proved the incompleteness theorem," but unbeknownst to them, a man named Schmidt actually proved the theorem, and Gödel stole the work (Kripke's Gödel Case).
  *   **Millian Prediction:** The name "Gödel" refers to Gödel, not Schmidt. The description used to fix the reference is not synonymous with the name. The causal-historical chain determines reference.
  *   **Descriptivist Prediction:** Reference is determined by the weighted cluster of descriptions. If "The prover of incompleteness" is the dominant description, the name refers to Schmidt. If "The man currently holding this certificate" is dominant, it refers to Gödel. We predict that in most standard cases, the causal chain overrides the specific description, but only because "The man causally connected to this baptism" is part of the descriptive cluster.

  ---

  ### V. Note on Verbal and Terminological Disputes
  We acknowledge that a portion of our debate stems from divergent definitions of **"Semantic Content."**

  *   **The Dispute:** The Millian defines semantic content strictly as that which determines the **truth conditions of the utterance in a possible world**. The Descriptivist defines semantic content to include that which determines the **cognitive significance and rationality conditions for the speaker**.
  *   **Resolution:** We agree that this is not *merely* verbal, as it dictates the architecture of the theory (e.g., whether belief reports are context-sensitive). However, we acknowledge that if the Millian concedes that "pragmatics" does all the work of explaining cognitive significance, and the Descriptivist concedes that "descriptions" are often rigidified to match modal intuitions, the extensional outputs of our theories may converge on most standard cases. The remaining dispute is then ontological: **Is the proposition expressed by "Hesperus is Phosphorus" a singular proposition containing Venus, or a general proposition containing properties?** We agree this is the substantive core that remains.

  **Signed,**

  _________________________
  (The Millian Proponent)

  _________________________
  (The Descriptivist Proponent)
