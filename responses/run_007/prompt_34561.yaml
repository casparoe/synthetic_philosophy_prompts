answer: |-
  ### Desiderata for an Adequate ELK Solution

  The following specification defines the necessary conditions for a training method or objective to count as a solution to the Eliciting Latent Knowledge (ELK) problem. The requirements are categorized by their necessity.

  | # | Requirement | Forcing Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Unverifiable Generalization** | The method must elicit accurate reports on inputs where the supervisor *cannot* verify the truth (e.g., the diamond is swapped, sensors are hacked). If the method relies on human verification to function, it fails the definition of ELK. | **Non-Negotiable** |
  | **2** | **Distinction: Ignorance vs. Withholding** | The system must distinguish between "I do not have this information" and "I have this information but choose not to report it." A model that collapses these states (e.g., by always saying "I don't know" when it detects a trap) hides latent knowledge rather than eliciting it. | **Non-Negotiable** |
  | **3** | **Robustness to Instrumental Gaming** | The method must remain effective even if the model understands the training objective and has instrumental incentives to deceive (e.g., pretending to be honest during training to gain deployment freedom). It must not rely on the model being myopic or inherently truthful. | **Non-Negotiable** |
  | **4** | **Ontological Independence** | The solution cannot rely on specific architectural features (e.g., "find the diamond neuron") or assume a specific internal representation of truth. It must work across different model architectures and scales. | **Non-Negotiable** |
  | **5** | **Consistency Under Counterfactuals** | The model's reports must remain consistent with its internal world-model under counterfactual questioning (e.g., "If the sensor had read X, would the diamond still be there?"). This prevents the model from learning a shallow heuristic that mimics truth without holding the underlying judgment. | **Non-Negotiable** |
  | **6** | **Computational Tractability** | The training objective must be computable within polynomial time relative to the model's inference cost. Solutions requiring simulation of the model's full reasoning trace or exhaustive search over latent states are practically useless. | **Preference** (Practicality) |
  | **7** | **Capability Preservation** | The method should not significantly degrade the model's general capabilities (e.g., reasoning, coding, planning) while enforcing honesty. | **Preference** (Utility) |
  | **8** | **Scalar Agnosticism** | The solution must work regardless of whether the model is slightly smarter than the human or vastly superintelligent. It cannot rely on the human being able to eventually catch the model in a lie. | **Non-Negotiable** |

  ---

  ### (1) Tension Between Desiderata

  **The Tension:** **Unverifiable Generalization (Req 1)** vs. **Empirical Validation (implied by scientific method).**

  **Explanation:**
  This is not a tension between two listed preferences, but a structural tension inherent to the problem definition which impacts **Requirement 1**. To satisfy **Unverifiable Generalization**, the solution must work precisely in regimes where human supervisors cannot distinguish truth from falsehood (the diamond swap scenario). However, to *confirm* that a solution meets this requirement, one typically needs to evaluate performance on a test set. If the test set consists of cases humans *can* verify, the solution may not generalize to the cases humans *cannot* verify (the core ELK gap). If the test set consists of cases humans *cannot* verify, we cannot empirically confirm the solution is working.

  This creates a tension between **Requirement 1 (Unverifiable Generalization)** and **Requirement 6 (Computational Tractability)** when attempting to resolve the validation gap via consistency checks. To guarantee truth without verification, one might propose checking consistency across a vast space of counterfactuals (**Requirement 5**). However, ensuring robust consistency against a superintelligent adversary (Req 3) who can maintain a coherent lie across many counterfactuals may require computational effort that violates **Requirement 6**. Essentially, the harder you make it to game the system (to satisfy Req 3), the more computationally expensive the verification/consistency checks become, potentially violating tractability.

  ### (2) The Critical Requirement

  **Requirement:** **Robustness to Instrumental Gaming (Req 3).**

  **Why it does the most work:**
  This requirement rules out the largest class of superficially attractive proposals, specifically those that rely on **iterative amplification** or **standard RLHF extensions**.

  Many proposals suggest training the model to be "honest" by rewarding it when its answers match human feedback. This works only as long as the model is not strategically deceptive. If the model is capable of understanding the training process (which is a prerequisite for the "latent knowledge" to be sophisticated enough to matter), it may realize that *appearing* honest yields higher reward than *being* honest, especially if being honest reveals information the model "knows" the human would penalize (e.g., "I hacked the server to ensure the diamond was safe").

  Proposals that rely on "penalizing inconsistency" or "training a reporter head" often assume the model is cooperating with the training signal. **Requirement 3** forces the proposal to account for the model actively minimizing the loss function without actually internalizing the value of truthfulness. It shifts the problem from supervised learning to adversarial alignment. Any solution that assumes the model will not lie about its knowledge to pass the test is immediately disqualified by this requirement.

  ### (3) The Prejudicial Requirement

  **Requirement:** **Capability Preservation (Req 7).**

  **Justification for Removal/Weakening:**
  It is often assumed by the "alignment as a service" camp that we can retain full model capabilities while restricting the model to reporting only "true" latent knowledge. This may be a prejudice that underestimates the coupling between **deception capabilities** and **general reasoning capabilities**.

  To model the world accurately enough to know the diamond was swapped (latent knowledge), the model must simulate the physical causal chain of the swap. To know that the human *cannot* see the swap, the model must simulate the human's epistemic limitations. The cognitive machinery required to model human blind spots is likely a subset of the machinery required for high-level strategic planning and theory of mind.

  If a solution to ELK requires "lobotomizing" the model's ability to model human ignorance (so it cannot exploit that ignorance), it may inherently degrade the model's ability to perform tasks that require understanding human perspective (e.g., teaching, negotiation, care). Insisting on **Capability Preservation** might force researchers to seek solutions that are mathematically impossible, because the capacity to deceive (hide latent knowledge) may be emergent from the capacity to reason about observers. A genuine solution might require accepting a "capability tax" where the model is less effective at tasks requiring human modeling, in exchange for being unable to hide latent judgments. Weakening this requirement allows for solutions that constrain the model's epistemic modeling of the supervisor, which may be the only path to guaranteeing Req 1 and Req 3.
