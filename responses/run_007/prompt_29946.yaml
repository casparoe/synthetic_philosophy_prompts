          *   What are the implications (e.g., expats voting on taxes, residents voting without naturalization)?
          *   Is this an awkward historical compromise or a philosophically respectable position?
          *   Does anyone actually believe the implications of that position?

  2.  **Initial Assessment & Tone:**

