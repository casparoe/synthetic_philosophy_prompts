      *   **Evaluate Coherence:** Is it philosophically respectable? Yes, if you value stability and defined boundaries over pure consequentialism. Is it consistent? Often no (historical baggage).
      *   **Who Believes This?** Liberal nationalists (e.g., Yael Tamir, David Miller) argue for the importance of national membership.

  5.  **Drafting the Content (Iterative refinement):**

