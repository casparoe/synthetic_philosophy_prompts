      *   The tone should be analytical, balanced, and engaging with the philosophical depth of the question.
      *   Avoid taking a side (e.g., "you're right, it's unfair" or "no, it's necessary"). Instead, map the theoretical landscape.

  3.  **Brainstorming Theoretical Frameworks:**

