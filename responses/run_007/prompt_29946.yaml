      *   *All-Subjected Persons (ASP):* Also favors the resident non-citizen. They are subject to coercion/laws daily.
      *   *All-Citizens Principle (Membership/Stakeholder):* This is the key. Democracy isn't just about impact or subjection; it's about *membership* in a political community. Citizenship is a legal status that persists regardless of location.
      *   *Ethnic Nationalism (Jus Sanguinis):* Some countries do base citizenship on blood, but many (like the US) allow expat voting based on *legal* citizenship (jus soli/naturalization), not just ethnicity. So it's not *necessarily* ethnic nationalism, though it can overlap.
      *   *Continuity of Identity:* The state claims the citizen belongs to it forever unless formally renounced. The bond is normative, not just functional.
      *   *Externalities:* Expats *are* affected by foreign policy, even if not domestic tax rates.
      *   *Reciprocity/Allegiance:* Citizens owe allegiance (potentially military service, loyalty) even abroad; residents owe obedience but not necessarily allegiance.

  4.  **Developing the Argument Structure:**

      *   **Acknowledge the Tension:** Validate the user's intuition. It *is* a tension between functionalist theories (AAI/ASP) and formalist theories (Membership).
      *   **Identify the Underlying Theory:** It's the "Bounded Community" or "Membership" model. Democracy requires a pre-defined *demos*. Citizenship defines that boundary.
      *   **Address the "Ethnic Nationalism" Charge:** Distinguish between *civic* citizenship (legal bond) and *ethnic* citizenship. Expats voting is often about civic continuity, not just blood.
      *   **Analyze the "Permanent Relational Property":**
