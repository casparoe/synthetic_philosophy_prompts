answer: |-
  This is one of the sharpest questions in contemporary democratic theory. You have correctly identified that the standard functionalist justifications for democracy—the **All-Affected Interests (AAI)** principle and the **All-Subjected Persons (ASP)** principle—cannot explain the expat/resident discrepancy. Under AAI and ASP, your neighbor should vote, and you arguably should not (or should have diminished rights).

  The fact that most liberal democracies maintain this arrangement suggests they are operating on a third, distinct theoretical framework. It isn't necessarily "blood-and-soil" ethnic nationalism (though it can overlap), but rather a theory of **democratic membership as a bounded community of fate.**

  Here is the breakdown of the theory presupposed by this practice, its philosophical coherence, and its implications.

  ### 1. The Theory: The "Principle of Membership" (or Stakeholderhood)

  The pattern you describe presupposes that the *demos* is not defined functionally (by who is affected or subjected) but **constitutionally**.

  In this view, the state is not merely a service provider or a coercion machine; it is an ongoing association of members. Citizenship is viewed as a **status of membership** rather than a contract based on current utility.
  *   **For the Expat:** Citizenship is a "portable" status. You carry your membership with you. The state claims you belong to it regardless of geography, and you retain a claim on the state (consular protection, right of return). Therefore, you retain a voice in its direction.
  *   **For the Resident Non-Citizen:** Residence grants you protection and imposes obligations (taxes, laws), but it does not grant *membership*. You are a "guest" or a "stakeholder" in the economy, but not a shareholder in the polity.

  **Why this isn't necessarily Ethnic Nationalism:**
  While ethnic nationalism (*jus sanguinis*) often facilitates this (e.g., Hungary or Israel granting citizenship to diaspora), civic nationalist states do it too (e.g., the US). The US justification isn't blood; it's **allegiance**. The theory holds that you have sworn permanent allegiance to the constitutional order. That bond is normative, not geographical.

  ### 2. Is There a Coherent Justification?

  There are three main arguments political philosophers use to defend this asymmetry. Whether they are *convincing* is debatable, but they are coherent.

  **A. The "Community of Fate" Argument**
  Liberal nationalists (like David Miller or Yael Tamir) argue that democracy requires a pre-existing sense of solidarity. You need to trust that your fellow voters care about the common good, not just their own narrow interest.
  *   **The Expat:** Is assumed to share this cultural/political identity and solidarity. They are "one of us" who happens to be away.
  *   **The Resident:** Has not yet undergone the ritual (naturalization) that signifies entry into this circle of trust. Until they naturalize, they are assumed to lack the requisite solidarity or commitment to the long-term survival of the specific political community.

  **B. The "Potential Return" Argument**
  This is the pragmatic defense. Expats are presumed to be temporarily abroad. They might return, retire there, or send money home. Their life trajectory is still tied to the homeland.
  *   *Weakness:* This falls apart with second-generation expats who have never visited the country, yet some states (like Italy or Ireland) allow them to vote. This is harder to defend democratically and leans closer to the ethnic nationalism critique.

  **C. The "Sovereignty" Argument**
  This is the hardest-nosed defense. A democracy is the right of a *people* to self-determination. That *people* must have the right to define its own boundaries. If the *demos* allowed everyone affected (AAI) to vote, the boundary would be limitless (e.g., climate change voters globally). If it allowed everyone subjected (ASP) to vote, it would undermine the distinction between the nation and the territory.
  *   **Implication:** The current citizens (including expats) hold the exclusive right to decide who else gets to join the club. Allowing residents to vote without naturalization would bypass the sovereign will of the existing membership.

  ### 3. Addressing Your "Push" Questions

  You asked what happens if we take the "permanent relational property" theory seriously.

  **On Renunciation:**
  If citizenship is a permanent metaphysical bond, renunciation is indeed a paradox. However, the liberal version of this theory treats citizenship as a **voluntary permanent bond**.
  *   You are bound until you explicitly sever the tie.
  *   Renunciation isn't a "mistake"; it is the only exit clause. The theory implies that silence equals consent to continued membership. This is philosophically consistent with social contract theory (you are born into the contract, you must actively opt out).

  **On Expats Voting on Taxes:**
  This is the weakest link in the chain.
  *   **The US Model:** The US taxes citizens on worldwide income. This aligns the "no taxation without representation" principle with expat voting. You vote on tax rates because you might be liable for them.
  *   **The Territorial Model:** Most other countries do not tax expats. Here, the theory fails the consistency test. Expats vote on public spending they don't fund.
  *   **The Defense:** Proponents argue expats pay "political taxes" (allegiance, potential conscription, identity) and that national budgets fund things that affect expats (foreign policy, defense, passport strength).

  **On Residents Voting Without Naturalization:**
  If we take the **Membership Theory** seriously, residents *should not* vote in national elections. National elections are about the *identity and future of the community*, not just administrative management.
  *   **However:** Many political theorists (and some EU countries) argue for a **gradient of membership**.
  *   **Local Elections:** Residents *should* vote locally (school boards, city councils) because this aligns with the **All-Affected Interests** principle. Local governance is about services (trash, schools, zoning), not national identity.
  *   **National Elections:** Reserved for citizens.
  *   *Current Reality:* Most democracies don't even allow local voting for non-citizens, which suggests the practice is often less about theory and more about exclusionary inertia.

  ### 4. Is it an Awkward Compromise or Respectable Theory?

  It is **a philosophically respectable position that is historically contaminated by inconsistency.**

  **The Respectable Core:**
  The idea that democracy requires a bounded community of members who share a commitment to the polity's continuity is a standard defense in political philosophy (see: *The Boundary Problem* in democratic theory, discussed by Robert Dahl and Frederick Whelan). Without a defined *demos*, you cannot have a *kratos*. Citizenship is the legal technology used to define that *demos*.

  **The Contamination:**
  The inconsistency arises because states pick and choose when to apply the theory.
  1.  **Descendants abroad:** Allowing third-generation expats who speak neither the language nor live in the culture to vote is hard to defend under "Community of Fate." This is usually pure ethnic nationalism.
  2.  **Colonial Legacies:** Some Commonwealth realms allow British citizens to vote if they lived there 15 years ago, but deny it to Commonwealth citizens living *in* Britain. This is imperial nostalgia, not democratic theory.
  3.  **Naturalization Barriers:** If the theory is that residents *can* join the demos but *haven't yet*, then naturalization should be easy. When states make naturalization prohibitively expensive or difficult, yet still deny voting rights, they reveal that the goal is exclusion, not the preservation of a voluntary community.

  ### 5. Who Actually Believes This?

  Yes, there is a school of thought, often called **Liberal Nationalism** or **Civic Republicanism**, that holds this view sincerely.

  *   **They believe:** That voting is not just a tool to protect interests (instrumental), but an act of collective self-determination (constitutive).
  *   **They argue:** You cannot determine the "self" of the nation if the boundary of the "self" is fluid based on who happens to be standing on the soil today.
  *   **They conclude:** The expat remains part of the "self." The resident non-citizen is an ally, but not part of the "self."

  ### Summary

  The pattern presupposes that **citizenship is a status of membership, not a function of residence.**

  *   **Is it AAI/ASP?** No. It explicitly rejects those in favor of a **Membership Principle**.
  *   **Is it Ethnic Nationalism?** Sometimes, but not necessarily. It can be civic nationalism that prioritizes legal allegiance over territorial presence.
  *   **Is it Coherent?** It is internally consistent *if* you accept that nations are communities of identity rather than service providers. It becomes incoherent when states grant voting rights to diaspora with no ties (ethnicism) while blocking long-term residents from naturalizing (exclusionism).
  *   **The Implication:** If we took the theory seriously, we would likely see **local voting rights for residents** (AAI for services) but **national voting restricted to citizens** (Membership for identity), coupled with **easier naturalization** (to allow residents to join the membership if they choose).

  The frustration you feel comes from the fact that most states want the *benefit* of the Membership Theory (excluding residents) without the *burden* (making naturalization accessible or limiting expat voting after generations). They want the boundary to be hard for immigrants but porous for emigrants. That specific asymmetry is hard to defend without appealing to privilege.
