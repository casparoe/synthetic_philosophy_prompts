  2.  **Deconstruct the Core Metaphor (Spandrels):**
      *   *What is a spandrel?* In architecture, the triangular space between arches. In biology, a trait that arises as a necessary byproduct of another trait, not directly selected for.
      *   *Application to Fiction:* Why do we have subplots? Why specific rhyme schemes? Why the "rule of three"? Are these adaptive (selected for survival/engagement) or structural byproducts of how language/memory works?
      *   *The Danger:* "Just-so stories" (Kipling). Plausible-sounding evolutionary explanations without evidence.

  3.  **Determine the Structure of the Speech:**
      *   **Introduction (3 mins):** Welcome, acknowledge the interdisciplinary nature, state the purpose (collaboration), introduce the central metaphor (Spandrels).
      *   **The Problem (4 mins):** The temptation of adaptationism in both fields. Scientists seeing function everywhere; writers seeing craft everywhere. The risk of the "Just-So Story."
      *   **The Spandrel Application (5 mins):** Concrete examples in fiction. What looks adaptive but might be structural? How does this help us?
      *   **The Standard/Call to Action (3 mins):** How do we tell the difference? Criteria for good explanations. Invitation to the workshop work.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Start with the novelist's perspective. Acknowledge the scientists. It's rare for these groups to talk. Use the "San Marco" image immediately. It's visual and bridges the gap.
      *   *The Adaptationist Temptation:* Scientists want function. Writers want meaning. Both can lead to over-interpretation. Mention Gould & Lewontin gently (don't assume everyone knows the paper, but don't explain it like a primer).
      *   *Applying to Craft:* This is the meat. Need specific literary examples.
