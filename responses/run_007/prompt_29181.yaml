answer: |-
  Good morning. It is a genuine privilege to welcome you all to this workshop.

  Looking around this room, I see a divide that is rarely bridged. On one side, we have scientists who study the mind and the mechanisms of evolution. On the other, we have novelists, critics, and scholars of narrative who spend their lives inside the architecture of stories. Usually, when we meet, it is because one side is studying the other as a specimen. The scientists analyze the readers; the critics analyze the texts.

  But for the next few days, we are not specimens. We are collaborators. We are here to ask a difficult question: What can evolutionary theory tell us about why we tell stories, and how we tell them?

  As a novelist, I am used to people asking me, "Where do you get your ideas?" It is a question I usually dodge with a joke. But the question behind the question is serious. It is an evolutionary question. Why does the human animal, across every culture and epoch, expend massive amounts of energy on fabricating lies about people who never existed?

  There is a strong temptation, in this field, to answer that question with a function. We want to say that fiction is an adaptation. We want to say it was selected for because it increased fitness. Perhaps it allowed us to simulate social scenarios safely. Perhaps it strengthened group cohesion. These are compelling arguments. I find them compelling.

  But I invited you here today to talk about the spaces *between* the arches.

  I want to center our work around a concept from evolutionary biology that has a strange, beautiful name: the spandrel. For those in the room who haven't spent their weekends reading Stephen Jay Gould and Richard Lewontin's 1979 critique, "The Spandrels of San Marco and the Panglossian Paradigm," let me offer a brief architectural definition.

  In a cathedral, when two arches meet, they create a triangular space above the curve. In San Marco, these spaces were beautifully decorated. But the decoration didn't drive the architecture. The spandrel is a necessary byproduct of building the arches. It is not there because it was selected for its own sake; it is there because of the structural constraints of the design.

  Gould and Lewontin argued that biologists often make the mistake of assuming every trait is an arch—directly selected for a specific purpose—when many traits are actually spandrels—byproducts of other selections or structural constraints.

  My proposal to this group is that we apply the spandrel critique to narrative craft.

  If we do not, we risk falling into the trap of the "Just-So Story." You know the type. Rudyard Kipling's tales of how the leopard got its spots are charming, but in science, a Just-So story is a plausible-sounding adaptive explanation that lacks empirical evidence. It is a narrative about evolution that feels like a story, rather than a testable hypothesis.

  As novelists, we are professional creators of Just-So stories. It is our job to make cause and effect feel inevitable. When I write a novel, I make sure that the ending feels earned, that the character's flaw leads to their downfall. I create the illusion of design.

  The danger in this workshop is that we might collaborate to create a scientific Just-So story. We might look at a feature of fiction—say, the prevalence of the "rule of three" in folktales, or the ubiquity of the cliffhanger—and immediately assume it exists because it was *selected* for that specific function. We might say, "The rule of three exists because it optimizes cognitive load for survival learning."

  That sounds impressive. It might even be true. But it might also be a spandrel.

  Perhaps the rule of three is not an adaptation of storytelling, but a byproduct of the limitations of working memory. Perhaps the cliffhanger is not a selected mechanism for retention, but a structural necessity of serial publication formats that we later rationalized as "suspense."

  If we treat every feature of narrative as an adaptation, we risk bad science. But more importantly, we risk bad literary criticism. We risk flattening the rich, messy history of art into a checklist of survival functions.

  I am not standing here to argue against evolutionary approaches to fiction. I believe this approach is vital. If we ignore the biological substrate of the reader, we are studying ghosts. But I am arguing for rigor. I am arguing that byproduct explanations deserve a fair hearing alongside adaptive ones.

  So, how do we distinguish the arch from the spandrel in the cathedral of fiction? How do we ensure that the work we do in this room is illuminating rather than decorative?

  I propose we adopt three shared standards for our discussions this week.

  **First: Plausibility is not Proof.**
  In fiction, if a plot point is plausible, the reader accepts it. In science, plausibility is merely the starting line. When we propose that a narrative feature is adaptive, we must ask: Is this the *only* explanation?
  If we claim that tragedy is an adaptation for emotional regulation, we must also ask: Could tragedy be a byproduct of our capacity for empathy combined with our ability to simulate counterfactuals? If empathy was selected for social bonding, and simulation was selected for planning, tragedy might just be the light spilling through the spandrel. It costs nothing to produce, so it wasn't selected against, even if it wasn't selected *for*.
  Let us commit to generating null hypotheses. Let us actively try to disprove our own adaptive claims by looking for structural or developmental byproducts.

  **Second: Distinguish Between the Capacity and the Content.**
  This is crucial for the writers in the room. It is highly probable that the *capacity* for narrative is an adaptation. The ability to sequence events, to understand agency, to track social relationships—these are costly cognitive tools. They likely evolved because they helped us navigate the world.
  But the *specifics* of our stories? The fact that we prefer iambic pentameter in some cultures and haiku in others? The fact that some genres prioritize romance and others prioritize war?
  These may be cultural spandrels riding on the biological arch. We must be careful not to claim evolutionary selection for what is actually cultural drift. An adaptive account of fiction must be able to distinguish between the universal hardware and the installed software.

  **Third: Seek Convergent Evidence.**
  A Just-So story stands alone. A robust theory stands with others. If we claim a narrative feature is adaptive, does it align with what we know about developmental psychology? Does it appear in the archaeological record? Does it hold cross-culturally, or is it specific to WEIRD societies (Western, Educated, Industrialized, Rich, Democratic)?
  As novelists, we can help here. We can tell you where the universals feel intuitive and where they feel forced. But we need you to help us test those intuitions against data.

  I want to be clear: Identifying a spandrel is not dismissing it. In San Marco, the spandrels are the most beautiful part of the church. Just because a trait is a byproduct does not mean it is unimportant.
  If metaphor is a spandrel of language capacity, it is still the engine of poetry. If fiction is a byproduct of social simulation, it is still the engine of empathy.
  Understanding that something is a spandrel liberates us. It frees the scientist from having to find a survival value for every sonnet. And it frees the writer from having to justify their art as a survival tool. We can appreciate the beauty of the byproduct without inventing a function it doesn't need.

  This workshop is an opportunity to build better arches.

  To the scientists in the room: I ask you to treat the text with the same respect you treat the genome. Do not reduce the complexity of a novel to a single variable. Acknowledge that culture evolves faster than genes, and that cultural selection can mimic biological selection.

  To the writers and critics: I ask you to embrace the constraint. Do not fear the reductionist eye. If your craft can withstand the question "What is this for?", it will only become more robust. If it cannot, perhaps you will discover something even more interesting about why you write.

  We are here to avoid the Panglossian trap. We are not in the "best of all possible worlds" where every comma is an adaptation. We are in a messy, contingent world where history, biology, and chance collide to produce Hamlet.

  Over the next few days, we will hear papers and have discussions. When you hear a claim that a narrative feature is adaptive, I invite you to gently ask: "Is this an arch, or is it a spandrel?"
  When you hear a claim that a feature is a byproduct, ask: "Byproduct of what structural constraint?"

  Let us make our standard not the elegance of the story we tell about evolution, but the rigor of the evidence we bring to the text. Let us work to ensure that when we leave this room, we have not just collected a handful of clever Just-So stories, but have actually mapped the structure of the cathedral.

  There is a profound kinship between the novelist and the evolutionary biologist. We are both in the business of tracing lineages. We are both trying to understand how the past constrains the present. We are both trying to explain why things are the way they are, and not some other way.

  If we can hold the tension between adaptation and byproduct, between function and form, I believe we can produce work that is not only scientifically sound but deeply human. We can explain why stories matter without reducing them to mere tools.

  Thank you. I look forward to our work together.
