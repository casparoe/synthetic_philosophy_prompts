          *   *Example 2:* Tragedy. Adaptive (catharsis/social cohesion)? Or byproduct of our capacity for empathy + simulation?
          *   *Example 3:* Metaphor. Adaptive tool? Or spandrel of language capacity?
      *   *Refining the Argument:* I must not say "Evolutionary criticism is wrong." I must say "It needs rigor." Avoid the polemic trap. Acknowledge that *some* things are adaptive (storytelling *is* likely adaptive).
      *   *The Standard:* How to avoid Just-So stories?
          *   1. Plausibility isn't proof.
