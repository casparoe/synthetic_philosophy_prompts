answer: |-
  The practice of compulsory jury duty is indeed a striking anomaly within the modern liberal state. It resembles a feudal relic or a republican vestige embedded in a bureaucratic, market-oriented polity. To understand what theory of political obligation it presupposes, we must analyze why the state treats this specific function differently from all other public services.

  ### 1. The Presupposed Theory of Political Obligation

  The practice presupposes a hybrid theory of obligation that is primarily **Civic Republican**, supported by a **Liberal Principle of Fairness**, and rhetorically clothed in **Communitarian** membership.

  It is not purely **Liberal** in the libertarian or high-liberal sense, because it overrides individual economic autonomy and time sovereignty without market compensation. A strict liberal contractarian view (where obligations are voluntarily assumed) struggles to explain why a citizen who has not explicitly consented to a specific case must serve.

  It is not purely **Communitarian**, because communitarianism generally argues for obligations based on shared values and identity. If jury duty were purely communitarian, one might expect broader obligations (like voting or community service) to foster that shared identity. The narrowness of the duty suggests a specific functional necessity rather than a general moral cultivation.

  The strongest fit is **Civic Republicanism**. This tradition views liberty not merely as non-interference (the liberal view), but as **non-domination**. To prevent the state (judges, prosecutors) from dominating the accused, the citizenry must retain a direct share of sovereign power. The juror is not a worker; they are a temporary magistrate. The obligation arises because the citizen is a co-ruler. You cannot opt out of ruling any more than a member of a board can opt out of voting on a merger if they wish to remain a member.

  However, the **Liberal Principle of Fairness** (or reciprocity) provides the immediate justification: Citizens benefit from a legal system that protects their rights and property. Because the system relies on peer judgment to maintain legitimacy, those who benefit from the *possibility* of a jury trial bear a burden to sustain the *reality* of it.

  ### 2. Liberal Rights vs. Communitarian Burdens

  Does liberal theory license this? Yes, but only through a specific mechanism: **Right-Duty Correlativity.**

  In liberal theory, rights often generate duties in others. If every accused person has a right to be tried by a "jury of their peers," there must exist a pool of peers. If jury service were voluntary, the pool would likely be self-selected (biased), too small, or economically skewed (only the unemployed could afford to serve). Thus, the individual's *right* to a jury trial generates a *duty* on the part of the community to supply jurors. Compulsion is the only mechanism that ensures the "peer" group is actually representative of the community rather than a specific economic class.

  However, the *mode* of the obligation is communitarian. It treats political membership as carrying non-optional burdens that one cannot contract out of. You cannot pay a substitute because the duty is attached to *you* as a citizen, not to your labor capacity. The state is not buying your time; it is calling upon your civic status. This affirms the communitarian idea that membership entails a debt of participation that cannot be monetized.

  ### 3. The Narrowness of the Duty: Why Jury and Not Voting?

  If the premise is communitarian membership or civic duty, why is the duty so narrow? Why not compulsory voting or mandatory community labor?

  1.  **The Sovereignty Distinction:** Jury duty is an exercise of *sovereign power* (adjudicating law and fact), whereas sweeping streets or teaching is administrative labor. The state conscripts citizens to wield power, not to perform tasks. Compulsory voting is similar (exercising power), but it is often rejected in liberal states because the *secret ballot* requires freedom from coercion, whereas jury deliberation is a collective, public-facing duty.
  2.  **The Expertise Constraint:** The jury system presupposes that judging facts is a universal human capacity requiring no specialized training. Nursing or teaching requires expertise; therefore, conscripting laypeople would be inefficient and dangerous. Jury duty is one of the few state functions where the "amateur" status of the worker is a feature, not a bug.
  3.  **The Rights-Link:** There is a constitutional *right* to a jury trial. There is no constitutional right to a clean street or a specific teacher. The duty is tethered to a specific individual right. To make the right real, the duty must exist. Without that tether, compulsory labor lacks a liberal justification and becomes purely authoritarian.

  ### 4. Requirements, Fits, and Underdetermination

  To reconstruct the implicit theory, we must distinguish what the practice *needs*, what it *likes*, and what is *contingent*.

  *   **Strictly Required (The Core):**
      *   **Compulsion:** To prevent self-selection bias and ensure the "peer" group is representative.
      *   **Non-delegability:** The duty must attach to the person to ensure the sovereign power is distributed across the populace, not concentrated among those who can pay.
      *   **Token Compensation:** To signify that this is a civic office, not employment. (Market wages would transform the juror into a state employee, undermining their independence).

  *   **Fits Well With (The Periphery):**
      *   **Civic Education:** The practice fits well with the idea that juries teach citizens about the law (Tocqueville's view), but the system does not *require* this to function.
      *   **Community Bonding:** It fits communitarian ideals of shared sacrifice, but the system would work even if jurors hated each other.

  *   **Philosophically Underdetermined:**
      *   **Excusal Criteria:** The theory does not dictate exactly which hardships excuse service. A more communitarian view would allow fewer excusals; a more liberal view would allow more.
      *   **Unanimity vs. Majority:** The theory requires a "jury," but not necessarily 12 people or a unanimous verdict. These are historical contingencies.
      *   **Employer Compensation:** Whether employers must pay the difference is underdetermined. A fairness principle suggests the burden should be shared, but a strict state-sovereignty view says the burden is the citizen's alone.

  ### 5. The Consistently Liberal Counterfactual

  If we replaced the presupposed Republican/Communitarian theory with a **consistently Liberal** one (prioritizing individual autonomy, market efficiency, and voluntary association), the practice would change radically, likely resulting in the dissolution of the jury as we know it.

  1.  **Marketization of Service:** Jurors would be paid market wages to compensate for opportunity costs. This would acknowledge their time as private property.
  2.  **Voluntarism & Substitution:** Service would be voluntary. If the state could not find enough volunteers, it would raise wages. Citizens would be allowed to hire substitutes, treating the duty as a tax or labor obligation that can be outsourced.
  3.  **Professionalization:** Over time, a voluntary, paid system would likely evolve into a corps of professional jurors. This would increase efficiency and expertise.
  4.  **Privatization of Dispute Resolution:** A consistent liberal view might question why the state adjudicates private disputes at all. We would see a shift toward mandatory arbitration and private courts, where parties pay for judges, removing the public obligation entirely.

  **The Consequence:**
  Under a consistently liberal regime, the **legitimacy** of the verdict would shift. Currently, a verdict is legitimate because it comes from "the people." In the liberal market model, a verdict is legitimate because it comes from a "fair procedure" administered by professionals.

  However, this shift would sever the link between the citizen and the sovereign power. The jury would cease to be a check on state power and become another branch of the bureaucracy. The "peer" aspect would vanish; the accused would be judged by a class of professional adjudicators, not by their community.

  ### Conclusion

  Compulsory jury duty presupposes that the citizen is not merely a client of the state, but a **part-owner of its sovereignty**. It is a practice that liberal theory tolerates only because it is necessary to secure a fundamental liberal right (trial by peers), but it operates on republican logic.

  The narrowness of the duty exists because it is the *only* remaining mechanism where ordinary citizens directly wield state power without specialized training. If we were to make the system "consistently liberal" by marketizing it, we would gain efficiency and autonomy, but we would lose the democratic character of the law. We would transform the jury from a political institution into a service industry, solving the anomaly by abolishing the civic obligation that makes the anomaly meaningful.
