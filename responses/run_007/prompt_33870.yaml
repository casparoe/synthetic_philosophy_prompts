      *   **Central Question:** What view of the relationship between the individual and the political community does this presuppose?
      *   **Theoretical Tension:** Liberalism (individual rights, voluntary obligation) vs. Communitarianism (non-optional burdens of membership).
      *   **Specific Tasks:**
          1.  Identify the implicit theory of political obligation.
          2.  Distinguish what the theory *requires* vs. what it *fits well with*.
          3.  Identify where the practice is *philosophically underdetermined* (compatible with multiple theories).
          4.  Analyze the "narrowness" problem (Why jury duty and not voting/community labor?).
          5.  Speculate on changes if the presupposed theory were replaced by a *consistently liberal* one.

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *Liberalism:* Focuses on consent, rights, limited state power. How to justify coercion? Social contract (tacit consent), fairness principle (benefit received -> burden owed), or necessary precondition for rights (right to jury trial -> duty to provide jurors).
      *   *Communitarianism:* Focuses on membership, shared identity, civic virtue. Duty arises from who you *are* (a citizen), not what you *chose*. Jury duty is a ritual of participation.
      *   *Republican Civic Humanism:* Liberty as non-domination. Participation prevents tyranny. Jury as a check on state power.
      *   *The "Narrowness" Puzzle:* If it's about "civic duty," why not vote? If it's about "labor," why not sweep streets? The answer likely lies in the *judicial* function specifically. It's about *judging peers*, not just labor.
