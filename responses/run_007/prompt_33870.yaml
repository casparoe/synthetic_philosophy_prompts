  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the anomaly. Jury duty *is* unique compared to modern bureaucratic state functions. State the thesis: It rests on a hybrid theory, predominantly **Civic Republicanism** blended with **Liberal Fairness**, but often justified rhetorically through **Communitarian** membership.

      *   **Section 1: The Implicit Theory of Political Obligation.**
          *   It's not pure liberalism (too coercive).
          *   It's not pure communitarianism (too narrow).
          *   It looks like *Civic Republicanism*: Citizens are co-rulers. The jury isn't just labor; it's a slice of sovereignty.
          *   Also *Principle of Fairness*: You benefit from the legal system (protection of rights/property), so you must contribute to its administration.
          *   *Key Insight:* The jury is a political office, not a job.

      *   **Section 2: Liberal Justification vs. Communitarian Premise.**
          *   *Liberal:* Right to trial by peers implies a pool of peers. If everyone opts out, the right vanishes. Reciprocity.
          *   *Communitarian:* Membership entails sacrifice. It builds civic virtue.
          *   *Resolution:* The practice *licenses* itself via liberal rights (6th/7th Amendment equivalents) but *operates* on communitarian/civic republican assumptions about duty.

      *   **Section 3: The Narrowness of the Duty (Why Jury and not Voting/Sweeping?).**
          *   *Judicial Sovereignty:* The jury is a check on state power (judge/prosecutor). Sweeping streets is administrative.
          *   *Epistemic Limit:* Judging facts is something any rational person can do. Teaching/Nursing requires expertise.
          *   *Rights-Link:* There is a constitutional *right* to a jury trial. There is no constitutional *right* to a swept street or a specific teacher. The duty correlates to a specific individual right.
          *   *Voting:* Voting is a right/power, but making it compulsory changes the nature of the mandate (legitimacy vs. participation).

      *   **Section 4: Distinguishing Requirements, Fits, and Underdetermination.**
          *   *Strictly Required:* A pool of citizens large enough to ensure randomness and peer judgment. Compulsion is needed to prevent self-selection bias.
          *   *Fits Well With:* Civic virtue, community bonding, democratic education (Tocqueville's view).
          *   *Underdetermined:* Compensation levels (liberal might say market rate, republican says token), excusal criteria (hardship vs. civic priority), length of service.

      *   **Section 5: The "Consistently Liberal" Counterfactual.**
          *   If we applied strict liberalism (libertarian or high-liberal):
          *   *Marketization:* Pay market wages. Let people volunteer.
