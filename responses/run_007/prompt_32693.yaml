      *   *Target:* Diffusion Models (DMs). DMs start with noise and iteratively denoise towards a data manifold, guided by text prompts (conditioning).
      *   *Postdoc's Claim:* DM Latent Space = Concept Space; Noise/Conditioning = Twiddling; Output = Creative Product.

