  **Summary and recommendation**

  The Ethics Committee recommends honoring the patient's advance directive and withholding antibiotics for aspiration pneumonia, proceeding instead with a comfort-focused care plan. This decision rests on the principle of precedent autonomy: the competent wishes of the patient, expressed when she possessed full decision-making capacity, retain moral authority over her medical trajectory. While the patient currently exhibits moments of contentment, these experiential interests do not outweigh the critical interests defined in her valid directive. To override the directive based on subjective assessments of her current quality of life would undermine the integrity of advance care planning and expose vulnerable patients to treatments they explicitly rejected. The clinical team should transition immediately to palliative measures, ensuring symptom management while supporting the family through this difficult transition. This approach respects the patient's lifelong values regarding dignity and cognitive independence, prioritizing her right to define the limits of her own life over surrogate interpretations of her current emotional state.

  **The case for honoring the advance directive**

  The primary argument for honoring the directive centers on the moral authority of the competent self. When the patient executed her advance directive, she was fully capable of weighing values, risks, and outcomes. She articulated a specific threshold—loss of recognition and coherent conversation—triggering her refusal of life-sustaining intervention. This reflects what philosopher Ronald Dworkin termed "critical interests": deeply held values about how one's life narrative should conclude, distinct from momentary "experiential interests" like enjoying pudding or music. To disregard this is to privilege the diminished capacity of the present over the reasoned judgment of the past. The patient made a sovereign decision about what constituted a life worth living for her, based on her observation of her own mother's decline. She defined dignity not as mere biological existence but as cognitive engagement and relational continuity.

  Furthermore, respecting precedent autonomy is essential for public trust in healthcare. If valid directives are set aside because surrogates or clinicians believe the patient looks "happy enough," the reliability of advance care planning collapses. Patients cannot trust that their deeply held convictions about dignity will be respected if those convictions are subject to revision by others based on subjective observations of their later-stage demeanor. The daughter's argument relies on a discontinuity of identity, suggesting the woman in the bed is a different moral agent. However, legally and ethically, she remains the same person. Allowing surrogates to override competent refusals based on perceived contentment creates a dangerous slippery slope, potentially subjecting patients to invasive interventions they feared most, solely because they can no longer articulate their opposition.

  Additionally, surrogate decision-making is prone to bias. The daughter's desire to treat may stem from her own inability to let go, rather than an objective assessment of the patient's interests. The son's position aligns with the protective function of the directive: shielding the patient from a fate she deemed undignified. Ethical consistency demands that we treat the directive as binding unless there is evidence the patient changed her mind while competent. There is no such evidence. To override the directive is to impose the family's values over the patient's own. The clinical team's discomfort is understandable but cannot supersede the patient's right to self-determination. Ultimately, autonomy is not just about current choices but about the integrity of a life plan constructed over decades. Honoring the directive affirms that the patient's voice remains central even when silence falls. In the context of advanced dementia, pneumonia is often a terminal event; treating it extends the very state the patient sought to avoid.

  **The case for overriding the advance directive**

  The argument for overriding the directive rests on the moral status of the current patient and the limits of precedent autonomy. Philosophers like Rebecca Dresser argue that the severe cognitive changes associated with advanced dementia create a discontinuity in personal identity. The woman who signed the directive valued cognitive autonomy and relational recognition; the woman in the bed values sensory comfort and immediate presence. They are, in morally relevant ways, different persons. The earlier self had no experiential knowledge of what it feels like to be in the later stage of dementia. Her refusal was based on a hypothetical projection of indignity, whereas the current patient's reality is one of apparent contentment. To kill the current self to satisfy the demands of the past self is to sacrifice a living, feeling being for the sake of an abstract principle. The earlier self is essentially a stranger making life-and-death decisions for a vulnerable current self who cannot consent to that sacrifice.

  Moreover, the principle of beneficence obligates clinicians to act in the best interest of the person currently in their care. This patient exhibits no distress; she smiles, listens to music, and enjoys food. Withholding antibiotics amounts to allowing a treatable infection to cause death in a patient who shows no wish to die. While she cannot verbally object, her behavioral cues suggest a will to live. The daughter's contention is that the earlier self had no right to impose death on a later self who finds value in existence. There is a risk of "death by directive," where rigid adherence to paperwork ignores the phenomenological reality of the patient. The clinical criteria for the directive regarding recognition are partially met, as she sometimes brightens at visits, introducing ambiguity that should favor life.

  Furthermore, advance directives are often static documents unable to capture the adaptability of human values. People often adjust their thresholds for suffering when actually facing it. By strictly adhering to the directive, we may be enforcing a value system the patient would reject if she could understand her current state. The nursing staff's leaning toward treatment reflects a professional commitment to preserve life when suffering is not evident. Overriding the directive in this specific instance acknowledges that autonomy is not absolute when it conflicts sharply with beneficence toward a vulnerable, non-objecting individual. It prioritizes the concrete welfare of the present person over the abstract wishes of the past, suggesting that mercy and care for the living should trump the dead hand of prior instruction when the two are in direct conflict. Finally, forcing the family to watch their mother die from a treatable condition when she appears happy causes significant moral distress to the surrogates, potentially damaging the therapeutic alliance and causing lasting psychological harm to the daughter who advocates for life.

  **Verdict and action plan**

  The Committee votes to honor the advance directive. While the argument regarding the moral status of the current self is philosophically compelling, it does not meet the threshold required to invalidate a competent refusal of treatment. The patient's prior autonomy holds greater weight than surrogate interpretations of her current contentment. To rule otherwise would establish that valid directives are conditional upon the patient's continued happiness, rendering them legally and ethically fragile. The concrete welfare of the present person is important, but it cannot justify overriding a specific refusal of life-sustaining treatment made during competence.

  **Action Plan:**
  1.  **Immediate Care:** Do not administer antibiotics. Initiate a comfort care order set immediately, focusing on oxygen for dyspnea and morphine for air hunger if needed.
  2.  **Family Conference:** The attending physician and a palliative care specialist will meet with the son and daughter within 24 hours. The goal is not to debate the ethics but to explain the decision as a legal and ethical obligation to the patient's prior voice.
  3.  **Support:** Provide chaplaincy and social work support specifically for the daughter to process her moral distress.
  4.  **Timeline:** Comfort care measures to be fully implemented by 0800 tomorrow.

  **Implications for future cases**

  This decision sets a precedent that valid advance directives remain binding even when the patient's current demeanor suggests contentment, provided there is no evidence of current objection. It resolves conflicts where surrogates argue that the patient's "new personality" invalidates prior wishes. However, this case does not resolve scenarios where the patient currently exhibits clear behavioral objections to care (e.g., fighting treatment) despite a prior directive consenting to it. For the Committee to reach a different conclusion in a superficially similar case, specific conditions would need to hold: evidence that the patient expressed changed wishes while still competent, or clear, consistent behavioral evidence that the current patient is experiencing suffering rather than contentment. Hospital policy should be updated to reflect that "quality of life" assessments by surrogates cannot override specific treatment refusals in valid directives.
