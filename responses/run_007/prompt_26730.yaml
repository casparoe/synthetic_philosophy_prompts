answer: |-
  The dust of the debate hall still clung to their robes as Vātsyāyana and Dharmottara walked along the riverbank. The sun was dipping below the horizon, casting long shadows over the path leading to their lodgings. The formal session had ended in a stalemate, but the air between them remained charged.

  "You cling to ontological excess, Vātsyāyana," Dharmottara said, his voice calm but cutting. "Why posit four *pramāṇas* (instruments of knowledge) when two suffice? Perception (*pratyakṣa*) grasps the particular, and inference (*anumāna*) grasps the universal relation. Everything else is a shadow of these."

  Vātsyāyana adjusted the bundle of palm-leaf manuscripts under his arm. "Parsimony is a virtue only when it does not slice away reality. If I cut off my hand to save weight, I am lighter, but I am also maimed. You reduce testimony (*śabda*) to inference. But tell me, when I hear 'Bring the cow,' do I deduce the meaning?"

  "Precisely," Dharmottara replied. "A word is a sign. Just as smoke signifies fire, a utterance signifies a meaning. You observe the convention that a specific sound is associated with a specific object. When you hear the sound, you infer the object based on that observed regularity."

  "But consider the lie," Vātsyāyana countered quickly. "If a man says, 'Fire is cold,' I understand the sentence immediately. I grasp the meaning. Yet, I cannot infer that fire is cold, for there is no *vyāpti* (invariable concomitance) between the words and a false state of affairs. Inference requires a connection to truth. Understanding does not. If testimony were merely inference, false speech would be unintelligible noise. Yet, we understand lies perfectly well."

  Dharmottara paused, stepping over a root. "A sharp strike. But you conflate the validity of the content with the cognition of the speaker's intent. What is inferred is not the truth of the proposition, but the *tātparya* (speaker's intention). I infer that you intend to convey the concept of 'cold fire.' Whether such a thing exists is a separate matter. Furthermore, where does this word-meaning relation come from, if not from prior observation? We see a child learn 'cow' by seeing the animal and hearing the sound. That is perception and memory. To call it a distinct *pramāṇa* is to reify a habit."

  "It is not a habit; it is a generative power," Vātsyāyana insisted. "The relation is beginningless. But let us set aside words for a moment. What of comparison (*upamāna*)? You claim it is merely inference or a composite of perception and testimony. Consider the standard case: A man is told by a forester, 'A *gavaya* (wild cow) is like a cow.' Later, in the forest, he sees an animal and cognizes, 'This is what the word *gavaya* denotes.'"

  Dharmottara nodded. "I know the example. I say this is simply inference. He recalls the testimony: '*Gavaya* resembles a cow.' He perceives the animal: 'This resembles a cow.' Therefore, he concludes: 'This is a *gavaya*.' The middle term is resemblance. Where is the need for a third instrument?"

  "You miss the specific cognition that arises," Vātsyāyana said, stopping to face his rival. "The knowledge produced is not merely 'This is a *gavaya*.' It is the knowledge of the *relation* between the word and the object mediated by similarity. Testimony gave him the rule. Perception gave him the animal. But neither gave him the identification of *this* animal as the referent of *that* word. That linking cognition is unique."

  "Is it?" Dharmottara challenged. "Or is it just memory aiding perception? You say it is not inference because there is no *vyāpti*. But similarity is a valid reason (*hetu*). If it resembles a cow in the specific way described, it must be the *gavaya*. That is an inference based on similarity."

  "If it were inference," Vātsyāyana pressed, "it would require a universal premise: 'Whatever resembles a cow in this manner is a *gavaya*.' But the forester never said 'All things resembling cows are *gavayas*.' He said 'A *gavaya* is like a cow.' The direction of the comparison is from the known (cow) to the unknown (*gavaya*). Inference moves from the sign to the signified. Here, we move from the similarity to the name. The cognition 'This is the referent of the word *gavaya*' arises directly from the perception of similarity, not from a syllogism."

  Dharmottara sighed, watching the river flow. "You argue for a distinct cognitive event. I argue for a distinct causal explanation. Even if the cognition feels immediate, its causes are perception of the animal, memory of the testimony, and memory of the cow. Why posit a new *pramāṇa* when the old ones explain the cause? If I light a lamp with a flint and tinder, I do not say 'fire-production' is a third element alongside flint and tinder."

  "Because the lamp reveals objects previously unseen," Vātsyāyana replied. "Similarly, *upamāna* reveals a relation previously unknown. Testimony alone does not give it, for he had not seen the animal. Perception alone does not give it, for he did not know the name. Inference does not give it, for there is no logical necessity linking similarity to naming conventions. The knowledge of the word-object relation via similarity is *sui generis*."

  "And yet," Dharmottara turned back, his eyes sharp in the twilight, "if I accept your *upamāna*, why stop there? Why not make memory a *pramāṇa*? Why not make doubt? You multiply instruments to match the variety of psychological states, not the variety of valid means."

  "Because memory relies on a prior *pramāṇa*," Vātsyāyana said firmly. "It is not a generator of new knowledge. *Upamāna* generates new knowledge: the connection of name to object. But I concede this: if you can show me the *vyāpti* in the *gavaya* case that licenses it as inference, I will listen. Until then, the distinctness stands."

  "And I concede," Dharmottara said, resuming his walk, "that understanding a lie poses a problem for the inference model of testimony. Perhaps we infer intention, not fact. But I maintain that intention is a particular, grasped ultimately through a chain of inferences from sound to mind. I will not grant a divine power to words themselves."

  They walked in silence for a moment, the gap between them neither widening nor closing. The stars began to emerge, indifferent to the count of *pramāṇas*.

  "So we remain," Vātsyāyana said softly. "You see two roots supporting the tree of knowledge. I see four."

  "And I see," Dharmottara replied, "that you see branches and call them roots. But the tree stands regardless."

  "Let us hope it does," Vātsyāyana murmured. "For if it falls, we both perish."

  They reached the lodgings, the argument unresolved, the definitions sharpened, the divide as deep as the river behind them.
