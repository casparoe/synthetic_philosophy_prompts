prompt: |-
  I'm running a reading group with some friends — we're not academics, just people who like arguing about philosophy over drinks — and we've gotten stuck on this thing about hypocrisy and blame. You know the basic puzzle: if someone does X themself, does that mean they can't legitimately blame someone else for doing X? So the adulterer who condemns adultery, the tax cheat who lectures others about civic duty, that sort of thing. The intuition that there's something wrong with the hypocrite's blame is super strong, but when you try to say exactly what's wrong with it you run into problems. The blamed person might genuinely have done something wrong. The hypocrite's statement might be entirely true. So what's the problem exactly — is it that the hypocrite lacks some kind of standing, the way you might lack standing to forgive someone for a wrong that wasn't done to you? Or is it that the hypocrite's blame is blame but just bad in some other way? Or is the whole "standing" framing misleading and we should just say the hypocrite is blameworthy for their own conduct while their blame of the other person remains perfectly fine?

  We've been going back and forth on this for weeks and I thought it'd be fun to give the group a dialogue to react to, something that dramatizes the disagreement better than us just repeating ourselves. Could you write one? Two characters: Maya, who defends something like the view that hypocrisy really does undermine one's standing to blame — that there's something about blaming others for a fault you share that makes the blame itself illegitimate, not just hypocritical in a way that's separate from the blame's aptness. And David, who pushes back hard on this, arguing that the aptness of blame and the standing of the blamer are two different things, and that we shouldn't confuse the moral failings of the person doing the blaming with the question of whether the blamed person actually deserves it. Maybe he thinks the whole "standing" talk is a red herring and we should just say the hypocrite is blameworthy for their own hypocracy while still being correct in their blame of the other person.

  Neither should be a pushover. I want real back-and-forth where they respond to each other's actual points, not just trading speeches. Each one should land some good blows, and the reader should come away feeling like they'd need to think hard to pick a side. Don't resolve it neatly at the end. And write it in a natural conversational style — they're not reading papers at each other, they're talking, maybe over coffee or drinks. A couple pages of dialogue would be perfect.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** The ethics of hypocrisy and blame (specifically, whether hypocrisy undermines *standing* to blame).
      *   **Characters:**
          *   *Maya:* Defends the "Standing View" (hypocrisy makes blame illegitimate/unsupported).
          *   *David:* Defends the "Separation View" (blame's aptness is separate from the blamer's virtue; hypocrisy is a separate fault).
      *   **Tone:** Natural, conversational (friends over drinks/coffee), not academic lecturing.
      *   **Structure:** Back-and-forth, responsive, no easy resolution, both land good points.
      *   **Length:** A couple of pages.
      *   **Goal:** Dramatize the philosophical disagreement for a reading group.

  2.  **Character Voices & Dynamics:**
      *   *Maya:* Needs to be intuitive, focused on the *relationship* and the *message* sent by blame. She should appeal to the feeling of unfairness.
      *   *David:* Needs to be analytical, focused on *truth* and *consequences*. He should appeal to the objective wrongness of the act being blamed.
      *   *Setting:* A bar or pub fits the "drinks" prompt description better than coffee for this kind of heated debate. Let's go with a slightly noisy pub.

  3.  **Key Philosophical Points to Cover:**
      *   *The Intuition:* It feels wrong when a hypocrite blames. Why?
      *   *David's Challenge:* If the act is wrong, it's wrong. Does the messenger matter?
      *   *Maya's Counter:* Blame isn't just a statement of fact; it's a social sanction. It requires authority/standing.
      *   *The "Tu Quoque" Trap:* Is dismissing blame just because the blamer is flawed a way to evade responsibility?
      *   *The Function of Blame:* Is it about moral accounting or moral improvement?
      *   *Equality/Fairness:* Hypocrisy implies the blamer thinks they are *above* the rule.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Get straight into the tension. Maybe reference a specific example (the tax cheat or the cheater). Let's use a generic "friend of a friend" scenario to keep it grounded.
      *   **Round 1: The Core Disagreement.**
          *   Maya: It's the audacity. You can't hold someone to a standard you flout.
          *   David: But the standard exists regardless of who holds it. 2+2=4 even if a liar says it.
      *   **Round 2: The Nature of Blame.**
          *   David: Blame is just saying "You did wrong."
          *   Maya: No, blame is a *demand* for accountability. It's a transaction. If you're in debt yourself, you can't collect.
      *   **Round 3: The Danger of Dismissal.**
          *   David: If we accept your view, wrongdoers get a "get out of jail free" card whenever they spot a flaw in their accuser. That lets the wrongdoer off the hook.
          *   Maya: It's not letting them off the hook morally, it's just silencing *this specific accuser*.
      *   **Round 4: Equality and Community.**
          *   Maya: Hypocrisy claims superiority. That violates the equality needed for moral community.
          *   David: But silence is worse. If only the sinless can speak, no one speaks.
      *   **Closing:** Leave it hanging. A toast to the confusion.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Are they sounding too much like professors? *Fix:* Add interruptions, colloquialisms ("Wait, hold on," "That's not what I'm saying"), and references to the drinks.
      *   *Check:* Is David too dismissive? *Fix:* Make sure he acknowledges hypocrisy is bad, just not *disqualifying*.
      *   *Check:* Is Maya too emotional? *Fix:* Give her a structural argument about "standing" and "authority."
      *   *Check:* Is the ending resolved? *Fix:* Ensure neither concedes.

  6.  **Writing - Focusing on Flow:**
      *   Start with the specific case (Steve the cheater).
      *   Move to the principle.
      *   David pushes the "truth" angle.
      *   Maya pushes the "relationship" angle.
      *   David brings up the "silencing" consequence.
      *   Maya brings up the "equality" consequence.
      *   End on the tension between truth and authority.

  7.  **Final Polish:** Check word count and pacing. Ensure the philosophical terms (standing, aptness, legitimacy) are used naturally. ( *Self-Correction: Make sure they don't use jargon like "normative standing" without explaining it in context.*)

  **(Drafting mental snippet):**
