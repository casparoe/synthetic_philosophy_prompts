  Maya: "Yes, but you can't be the judge."
  David: "Who appointed a judge?"
  Maya: "We did, by being moral agents."
  *Okay, that's a bit stiff. Let's loosen it.*

  8.  **Final Review against constraints:**
      *   Two characters? Yes.
      *   Maya = Standing View? Yes.
      *   David = Separation View? Yes.
      *   Natural style? Yes.
      *   No neat resolution? Yes.

  Let's write it.cw
answer: |-
  **Setting:** *A slightly noisy pub, Thursday evening. Half-empty pint glasses and a bowl of pretzels between them.*

  **Maya:** Okay, but look at it this way. Imagine Steve. Steve cheats on his wife, right? We all know it. Then, at dinner, he goes on this ten-minute tear about how Mark is a scumbag for flirting with a coworker. He's furious. He's calling Mark untrustworthy. Now, you're telling me I'm supposed to nod along? That Steve's blame is… what, valid?

  **David:** I'm saying Mark *is* being untrustworthy. That's the fact of the matter. Steve's hypocrisy makes Steve a jerk, sure. It makes him annoying. But does Steve's infidelity magically erase Mark's?

  **Maya:** It doesn't erase the act, David. It erases Steve's *right* to call it out. There's a difference between stating a fact and issuing a blame. Blame isn't just a weather report—"it is raining wrongness." It's a demand. It's saying, "You owe the community something." And if you're in debt yourself, you don't get to collect.

  **David:** That's the "standing" argument, right? You think moral standing is like a bank account? If you're overdrawn, you can't make a deposit? That feels intuitive, but it falls apart when you look at the consequences. If we accept that, then every time someone calls out a wrong, the first defense is, "Oh yeah? Well, what about *you*?"

  **Maya:** No, that's not—

  **David:** Hold on, let me finish. If standing is required for blame, then the worst sinners get to commit crimes with immunity, as long as they only hang out with other sinners. If I'm a thief, I can't blame you for stealing. Which means in a corrupt society, *no one* can blame anyone. That can't be right. It silences the very people who need to hear the message.

  **Maya:** You're conflating "no one" with "the hypocrite." I'm not saying the truth disappears. I'm saying *Steve* isn't the one who gets to deliver it. There are plenty of non-cheating people who can talk to Mark. The problem isn't that Mark goes unblamed. The problem is that Steve is trying to position himself as Mark's moral superior. And he's not.

  **David:** But why does his positioning matter more than Mark's action? You're focusing entirely on the accuser and ignoring the accused. Mark did something wrong. He deserves blame. If Steve delivers that blame, Mark still deserves it. The aptness of the blame—whether it fits the crime—is objective. Steve's soul is subjective.

  **Maya:** Blame isn't objective, though! It's relational. Think about forgiveness. If I steal from you, your sister can't forgive me. She doesn't have the standing. Why? Because the wrong wasn't against her. Standing matters all over morality. Why is blame the one place where we pretend the messenger doesn't matter?

  **David:** Because forgiveness is a gift, blame is a judgment. Look, if a murderer points at another murderer and says, "Killing is wrong," is he lying?

  **Maya:** No.

  **David:** Is the statement false?

  **Maya:** No.

  **David:** Then what is the injury? If I'm the second murderer, I can't say, "Ah, but you killed too, so your statement is null." I still killed. I'm still guilty. The hypocrisy is a second wrong, added on top of the first. It doesn't cancel the first.

  **Maya:** It's not about canceling the guilt, David. It's about the *authority* to sanction. When Steve blames Mark, he's implicitly saying, "I adhere to this standard, and you have violated it." But he *doesn't* adhere to it. So the message is actually, "I adhere to this standard *for you*, but not for me." That's not moral correction. That's power play. It treats the rule as a weapon rather than a norm. And that undermines the whole point of blaming, which is to restore moral equilibrium.

  **David:** "Moral equilibrium." You sound like you're trying to balance a ledger. Sometimes blame is just about protecting the victim or stating the boundary. If a drug dealer tells his kid, "Don't do drugs, look what happened to me," is that illegitimate? He's a user. He's a hypocrite by your definition. But he's also the one person who knows the cost. His blame carries *more* weight, not less, because he's living the consequence.

  **Maya:** That's a great example, actually. But notice why it works. It works because he's including himself in the condemnation. He's saying, "I messed up, don't be like me." That's not hypocrisy; that's confession. Hypocrisy is when Steve says, "I am clean, and you are dirty," while he's covered in mud. The drug dealer dad owns the mud. Steve denies it. The standing loss comes from the *denial*, the claim to exceptionalism.

  **David:** Okay, fine. Let's grant that. Steve claims exceptionalism. He's a liar about his own virtue. But does that lie change the fact that Mark betrayed his wife? If I walk into a room and see Mark cheating, and I yell "Stop!", does it matter if I'm cheating on my own wife in the other room?

  **Maya:** If you yell "Stop!" to enforce a rule you're actively breaking, you're not enforcing a rule. You're enforcing a hierarchy. You're saying, "I can break this, you can't."

  **David:** But maybe the rule is more important than the enforcer! This is the red herring, Maya. You're so obsessed with the purity of the blamer that you're letting the blameworthy off the hook. It gives Mark an excuse. Now Mark doesn't have to think about his wife. He can just think about Steve's audacity. He can say, "Who are *you* to talk?" and walk away feeling justified. Your theory hands a weapon to the guilty.

  **Maya:** It doesn't justify Mark! It just silences Steve. Mark is still wrong. He should feel ashamed. But he shouldn't feel ashamed *because Steve said so*. He should feel ashamed because of the act. If Steve's blame is the only thing making Mark feel bad, then Mark's morality is just about obedience to Steve, not about the actual good.

  **David:** But people aren't angels. We need each other to keep us in check. If we say, "You can't criticize me unless you're perfect," we get no criticism. Because no one is perfect. So you're setting a bar for standing that no one can clear.

  **Maya:** I'm not saying you have to be perfect. I'm saying you have to be *sincere*. If you acknowledge your own fault—"Look, I struggle with this too, but we shouldn't do it"—you keep your standing. The standing is lost when you pretend the rule applies only to the other guy. It's about equality. We are moral peers. If you step out of that peerage by claiming you're above the rule, you lose the right to invoke the rule.

  **David:** So it's a forfeiture? You commit a sin, you forfeit your voice?

  **Maya:** You forfeit your voice *on that specific sin*, until you reconcile it.

  **David:** That's dangerous. Imagine a reformed smoker telling a kid not to smoke. By your logic, while he's still smoking, he can't say anything. But maybe his voice is the only one the kid will hear. If he waits until he quits to warn the kid, the kid might already be addicted. The urgency of the wrong outweighs the purity of the messenger.

  **Maya:** But if he warns the kid while lighting his own cigarette, he's teaching the kid that the warning is negotiable. He's teaching the kid that rules are for other people. Isn't that how we get corrupt institutions? A bunch of people enforcing rules they don't believe in?

  **David:** I'd rather have a corrupt enforcer than no enforcement at all. At least the rule is stated. The truth is out there. You want to hide the truth because the speaker is flawed.

  **Maya:** I want to protect the *practice* of blaming. If blame becomes something hypocrites do to feel superior, nobody will listen to it anymore. We'll become cynical. We'll hear every moral claim and just look for the speaker's dirt. That destroys the community.

  **David:** Or… we grow up. We learn that truth can come from messy people. We separate the message from the messenger. That's maturity, Maya. Insisting on the messenger's purity is… I don't know, it's childish. It's like refusing to take medicine because the doctor smokes.

  **Maya:** But morality isn't medicine. It's not a product you consume. It's a relationship you inhabit. If the relationship is poisoned by hypocrisy, the medicine doesn't work.

  **David:** *[Signals the waiter for another round]* You're saying the relationship is the point. I'm saying the *good* is the point. If Mark stops cheating because Steve yelled at him, even if Steve is a hypocrite, isn't that a net win?

  **Maya:** If Mark stops just to avoid Steve's judgment, he hasn't learned anything. He's just been managed.

  **David:** And if he doesn't stop because Steve has no "standing," his wife gets hurt. Real world consequences, Maya. Not just abstract moral equilibrium.

  **Maya:** And if we let Steve talk, we validate Steve's self-image as a righteous guy, which makes him *more* likely to keep cheating. So now you've got two cheaters feeling justified.

  **David:** *[Laughs]* So we're stuck. Either we let the hypocrite speak and risk empowering him, or we silence him and risk leaving the victim unprotected.

  **Maya:** Basically.

  **David:** Cheers to that.

  **Maya:** *[Clinks glass]* Cheers. But I'm still not inviting Steve to dinner.

  **David:** Agreed. Some standing you don't need philosophy to lose.
