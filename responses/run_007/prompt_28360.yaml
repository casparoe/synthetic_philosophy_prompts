      *   If I am rational, PP says it *should*.
      *   But Frequentist number (actual frequency) might differ from Propensity (true chance) in finite runs.
      *   So (f) is definitely the easiest thing to sacrifice.

      *Decision:* Focus on (a)+(d) tension and the falsity of (f). Suggest demoting Frequentism to an epistemic tool for finding Propensities.

  8.  **Final Structure:**
