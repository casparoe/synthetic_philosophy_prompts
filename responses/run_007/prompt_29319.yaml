prompt: |-
  I'm taking a philosophy of mind course, and a friend who's a cognitive science major sent me what he says is a fair one-paragraph summary of functionalism and multiple realizability. I've read it several times and something feels off, but I can't pinpoint where the slide happens. Here is his summary:

  "Functionalism is the view that mental states are defined by what they do, not by what they're made of. Pain just is the state that's typically caused by tissue damage and that causes wincing, avoidance, and the desire to make it stop. The big selling point is multiple realizability: we know from comparative biology that very different nervous systems can be in pain — an octopus's pain can't be the same physical state as a human's — so pain can't be identical to any one physical state like C-fiber firing. Functionalism handles this by saying that any system with the right internal program has the mental state, whether the hardware is neurons, silicon, or something else entirely. That in turn shows mental states aren't physical states at all; they're abstract functional states, the way software is independent of hardware. The standard objection is that functionalism leaves out consciousness: a system could satisfy the entire functional profile of pain and yet feel nothing — the absent qualia problem — so the view is probably false."

  I've heard that most functionalists are physicalists, so the claim that mental states aren't physical states at all strikes me as suspicious, but I can't tell whether I'm confusing functionalism with something else. I'd like you to go through the summary claim by claim and tell me what a careful functionalist would accept, what they'd want to qualify, and what they'd flatly reject. Then say whether the final verdict — that absent qualia make functionalism probably false — actually follows from anything accurate in the summary, or whether it's a contested objection being presented as a settled refutation. Please separate what is settled from what is genuinely contested among people working on this, and don't present a contested view as the consensus.
