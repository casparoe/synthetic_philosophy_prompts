answer: |-
  The principle that best systematizes your majority verdicts is the **Fittingness Principle**, which holds that reasons for an attitude must be grounded in the properties of the object that make the attitude appropriate, while pragmatic incentives provide reasons only to want or induce that attitude.

  This principle cleanly explains your verdicts on belief, fear, and respect. For belief, the attitude aims at truth, so only evidence (the friend's testimony) counts as a reason, while threats (the demon) merely give you a reason to *want* to believe. For fear, the attitude aims at danger-avoidance, so the puppy's rabies is a reason, but the demon's threat is not, because the puppy itself remains harmless. For respect, the attitude aims at recognizing merit, so the boss's competence provides a reason, but the promotion does not, because the promotion does not make the boss worthy of respect. In all these cases, the reason must bear on the "fittingness" of the attitude rather than the beneficial consequences of holding it.

  However, this principle conflicts with your verdict on admiration. You judged that the million dollars gives you a reason to admire the person, yet you judged that the promotion gives no reason to respect the incompetent boss. Since respect and admiration are both evaluative attitudes toward persons that track merit, the Fittingness Principle demands consistency between them. If pragmatic benefits cannot generate reasons for respect (because the boss lacks merit), they cannot generate reasons for admiration (because the payer lacks admirability). To maintain consistency with your stronger intuitions about belief, fear, and respect, you would need to overturn the admiration verdict and concede that the money is only a reason to *want* to admire or to *act* admiringly, not a reason for the attitude itself.

  Regarding Pascal's Wager, the Fittingness Principle implies that the infinite payoff provides no reason to *believe* in God. Just as the demon's threat does not make the earth flat, the reward of heaven does not make God's existence true. The wager provides a powerful pragmatic reason to *want* to believe, or to cultivate belief through other means, but it fails to provide an object-given reason that makes belief fitting. Consequently, on this principle, Pascal's Wager fails to solve the problem of belief; it only solves the problem of whether it is beneficial to try to believe.
