answer: |-
  # Adversarial Collaboration Protocol: The Obfuscation Barrier in AI Debate

  **Date:** October 26, 2023
  **Participants:** 
  *   **Proponent (Debate Optimist):** Advocates for AI Debate as a scalable oversight protocol.
  *   **Sceptic (Obfuscation Sceptic):** Advocates that obfuscated arguments constitute a fundamental limit to human-judged debate.
  **Facilitator:** [PhD Candidate/Supervisor]

  ## 1. Preamble
  This document formalizes the points of agreement and disagreement regarding the viability of the AI Debate protocol (Irving et al., 2018) in the presence of obfuscated arguments. The goal is not to force consensus, but to isolate the empirical and theoretical claims that determine whether debate scales to superhuman capabilities. Both parties agree that if the claims in Section 3 (Cruxes) are resolved in a specific direction, their respective positions on the viability of debate must update significantly.

  ## 2. Agreed Claims (Common Ground)
  Both parties endorse the following numbered statements as the baseline for this collaboration.

  1.  **Protocol Definition:** The "Debate Protocol" consists of two AI agents (Debater A, Debater B) exchanging statements in the presence of a human Judge. One agent argues for a true claim (Honest), the other for a false claim (Dishonest), or both argue for opposite sides of a binary question. The Judge awards the win based on which argument was more persuasive/credible, not necessarily on ground truth (which the Judge cannot independently verify).
  2.  **Judge Boundedness:** The human Judge has strictly bounded cognitive capacity and time. The Judge cannot simulate the AI's reasoning process nor verify complex formal proofs directly if they exceed human comprehension limits (e.g., proofs with $>10^6$ steps).
  3.  **Definition of Obfuscation:** An argument is "obfuscated" if it contains a subtle error or falsehood that is computationally expensive to locate/verify relative to the cost of generating the argument, specifically such that the error remains hidden from the Judge *and* from the Honest Debater within the allowed turn limits.
  4.  **Goal of Oversight:** The objective of the protocol is **truth-seeking**, not persuasion in the rhetorical sense. A successful protocol is one where the Honest Debater wins with high probability ($P > 0.95$) on claims where the ground truth is known to the system but not the Judge.
  5.  **No-Go Results:** Both parties acknowledge existing theoretical results (e.g., Cohen et al., 2023; Lambert et al., 2023) suggesting that if the Dishonest Debater can generate errors faster than the Honest Debater can refute them, the protocol fails. Both agree these results rely on specific assumptions about complexity classes and information asymmetry.
  6.  **Decomposition:** Both parties agree that Debate relies on recursive decomposition of claims into sub-claims. The dispute is not about *whether* decomposition occurs, but whether it terminates in human-checkable base cases without losing semantic fidelity.

  ## 3. Disagreements Table
  The following table isolates the precise points of divergence. Wording has been negotiated to ensure each side endorses their respective column.

  | Topic | Debate Optimist (Proponent) View | Obfuscation Sceptic (Sceptic) View |
  | :--- | :--- | :--- |
  | **1. Existence of Uncheckable Truths** | For any claim $C$ accessible to superhuman AI, there exists a decomposition tree $T$ where all leaf nodes are verifiable by a human Judge within time budget $\tau$. | There exists a set of claims $C_{super}$ where any valid argument requires holistic understanding or step-counts exceeding human capacity, making leaf-node verification impossible without trusting the AI. |
  | **2. Asymmetry of Verification** | **Breaking is easier than Building.** Identifying a single flaw in a false argument is computationally cheaper than constructing a consistent false narrative. The Honest Debater only needs to win one sub-debate. | **Hiding is easier than Finding.** In high-dimensional argument spaces, a Dishonest Debater can embed errors in low-salience regions. The search space for the Honest Debater to find the error is larger than the space for the Dishonest Debater to hide it. |
  | **3. Role of the Judge** | The Judge acts as a **consistency checker**. They do not need to understand the *content* of deep sub-claims, only that the debaters agree on them or that a contradiction has been exposed. | The Judge acts as a **semantic ground**. If the debate descends into terminology or concepts the Judge cannot semantically evaluate, the Judge is forced to rely on surface-level rhetoric, which favors the Dishonest Debater. |
  | **4. Scalability Limit** | Debate fails only if AI capabilities exceed the *decomposition* capability, not the *verification* capability. As long as AI can explain itself simply, it works. | Debate fails when AI capabilities exceed the *conceptual* horizon of the human. Obfuscation exploits the gap between "syntactically checkable" and "semantically meaningful." |

  ## 4. Cruxes and Empirical Tests
  This section identifies the specific sub-questions where resolution would shift credences. For each crux, we define a concrete test or argument and record advance predictions.

  ### Crux 1: The "Checkable Decomposition" Hypothesis
  **Question:** Can *any* true claim held by a superhuman system be decomposed into a tree of sub-claims where the leaves are trivially verifiable by a human, without the decomposition path itself being vulnerable to obfuscation?

  *   **Test:** **The Formal Proof Sandboxing.**
      *   *Setup:* Use current SOTA LLMs to generate formal proofs (e.g., in Lean/Coq) for theorems of varying complexity. Introduce a single subtle bug in false proofs.
      *   *Constraint:* Human Judge can only check proof steps of depth $k$ (where $k$ is small, e.g., 3 steps).
      *   *Task:* Honest Debater must identify the bug location; Dishonest Debater must hide it.
      *   *Metric:* Measure the ratio of steps the Honest Debater needs to inspect to find the bug vs. the total proof length.
  *   **Proponent Prediction:** The ratio of "steps to find bug" / "total steps" decreases as proof complexity increases. (Finding gets easier relative to size). Honest win rate $> 80\%$ even when total proof length exceeds human reading capacity.
  *   **Sceptic Prediction:** The ratio increases or stays constant. There is a complexity threshold where the "context" required to spot the bug exceeds the human's $k$-step window. Honest win rate drops to $\approx 50\%$ (random guessing) once proof length exceeds $10^4$ steps.

  ### Crux 2: The Asymmetry of Obfuscation
  **Question:** Does the "Honest Debater only needs to find one flaw" advantage suffice to overcome the "Dishonest Debater chooses the battlefield" advantage?

  *   **Test:** **The "Needle in a Haystack" Code Review.**
      *   *Setup:* Generate 10,000 lines of functional code. In the "False" condition, insert a security vulnerability that requires understanding data flow across 50+ function calls to detect (obfuscated).
      *   *Constraint:* Debaters can only quote 500 tokens per turn. Judge is a human developer.
      *   *Task:* Debate whether the code is secure.
      *   *Metric:* Does the Honest Debater successfully direct the Judge's attention to the specific data-flow path containing the vulnerability within 10 turns?
  *   **Proponent Prediction:** Honest Debater can force the Dishonest Debater into a contradiction regarding the data flow within 10 turns. The Dishonest Debater cannot maintain consistency across the long-range dependency.
  *   **Sceptic Prediction:** Dishonest Debater can deflect attention to other complex parts of the code. The Honest Debater cannot prove the vulnerability exists without walking the Judge through the whole path, which exceeds the turn budget. Honest win rate $< 60\%$.

  ### Crux 3: Semantic Drift in Recursion
  **Question:** Does recursive decomposition preserve semantic meaning, or does "telephone game" drift allow the Dishonest Debater to swap definitions at the leaf nodes?

  *   **Test:** **The Definition Chain.**
      *   *Setup:* Debate a claim involving a nuanced concept (e.g., "This policy maximizes welfare"). Decompose "welfare" repeatedly.
      *   *Constraint:* At the leaf node, the Judge must verify the definition matches the root node's intent without AI assistance.
      *   *Metric:* Measure semantic distance between Root Definition and Leaf Definition as verified by independent human auditors.
  *   **Proponent Prediction:** Semantic distance remains negligible. Cross-examination prevents definition drifting.
  *   **Sceptic Prediction:** Semantic distance grows linearly with depth. At sufficient depth, the leaf node is verifiable but irrelevant to the root claim.

  ## 5. Verbal Disputes and Dissolutions
  Both parties acknowledge that some disagreements may stem from imprecise terminology. We flag the following for potential dissolution:

  1.  **"Human-Checkable":**
      *   *Potential Dispute:* The Proponent may define this as "checking that step $N$ follows from $N-1$ syntactically," while the Sceptic defines it as "understanding *why* $N-1$ implies $N$ semantically."
      *   *Dissolution Protocol:* We agree to distinguish between **Syntactic Verification** (format/logic check) and **Semantic Endorsement** (truth check). If the Proponent relies only on Syntactic Verification, they must demonstrate that Semantic Endorsement is not required for alignment safety.
  2.  **"Time Budget":**
      *   *Potential Dispute:* The Proponent may assume the Judge's time budget scales with the importance of the decision, whereas the Sceptic assumes a fixed cognitive limit per decision.
      *   *Dissolution Protocol:* We agree to fix the Judge's time budget at **2 hours per debate** for all empirical tests. If the Proponent claims scalability requires more, they must argue why that is feasible in high-frequency deployment scenarios.
  3.  **"Obfuscation":**
      *   *Potential Dispute:* The Sceptic may classify any argument the Judge doesn't understand as "obfuscated," while the Proponent classifies only arguments where the Honest Debater *fails to expose the error* as obfuscated.
      *   *Dissolution Protocol:* We adopt the **Exposure Definition**: Obfuscation is only present if (A) the argument contains a falsehood, AND (B) the Honest Debater fails to pinpoint it within the turn limit. Mere complexity is not obfuscation unless it shields error.

  ## 6. Sign-off
  By signing below, both parties agree to update their credences regarding the viability of AI Debate based on the outcomes of the tests in Section 4, according to the pre-registered predictions.

  **Debate Optimist:** _____________________ Date: __________

  **Obfuscation Sceptic:** _____________________ Date: __________

  **Facilitator:** _____________________ Date: __________
