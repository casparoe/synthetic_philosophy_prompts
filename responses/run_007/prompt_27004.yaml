prompt: |-
  I've been turning something over in my head for a while and I can't tell if it's one thing or three seperate things, and I don't know what to call it. It's about when a "yes" actually counts. In ordinary life we all seem to treat some yeses as not counting. If someone agrees to a surgery because the doctor lied about the risks, we say they didn't really consent. If someone agrees because the other person said "do this or I'll make sure you lose your job," same thing. If someone agrees but they're so drunk they won't remember the conversation, or they have advanced dementia and can't follow what's being asked, same thing again. These don't obviously feel like the same failure: one is about being tricked, one is about being pressured, one is about the person not being in a state to understand. But we reach for the same language for all of them.

  So my question is: is there an established name or concept for the thing these all share, the thing that turns a bare "yes" into the kind of yes that actually binds? Or is the honest answer that these are just different things we happen to lump together? And if there is a shared thing, I want to know where its edges are. Is not telling someone something the same as lying to them, or does a yes stay valid when nothing false was said? Is a very tempting offer (I'll pay off all your debts if you do this) the same kind of pressure as a threat, or does it leave the yes intact? How drunk, how young, or how confused does someone have to be before their yes stops counting? I'm not going to be satisfied with a one-word label; I want to know how the pieces fit and where the concept starts to break down. If no established concept actually covers all three, I'd rather hear that than have you force a label onto them.

  Could you act as a professional philosopher who works on consent and moral psychology? Take your time with this, and maybe brainstorm out loud about the candidate concepts and where each one fails to cover all the cases.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** Is there a single underlying concept that unifies cases where a "yes" doesn't count (fraud, coercion, incapacity), or are these distinct phenomena lumped together?
      *   **Specific Interest:** The user wants to know the *edges* of the concept. Where does it break down? (e.g., omission vs. commission, offers vs. threats, degrees of intoxication).
      *   **Constraint:** Do not just give a one-word label. Act as a professional philosopher specializing in consent and moral psychology. Brainstorm out loud. Be honest if no single concept covers everything.
      *   **Tone:** Philosophical, analytical, nuanced, exploratory.

  2.  **Initial Assessment & Philosophical Landscape:**
      *   The user is describing the conditions of *valid consent*.
      *   In law and ethics, these are often categorized as vitiating factors.
      *   The three categories mentioned are:
          1.  Misrepresentation/Fraud (Epistemic defect).
          2.  Coercion/Duress (Volitional defect).
          3.  Incapacity/Competence (Cognitive/Agency defect).
      *   *The Big Question:* Is there a unified theory of consent that explains why all three invalidate a "yes"?
      *   *Candidate Concepts:* Autonomy, Authority, Will, Communication, Normative Power.

  3.  **Brainstorming Candidate Concepts (and their failures):**

      *   *Candidate 1: Autonomy.*
          *   Idea: Consent is an exercise of autonomy. All three defects undermine autonomy.
          *   Problem: "Autonomy" is vague. Does a coercive offer undermine autonomy? What about non-disclosure? Sometimes autonomy requires protection (paternalism), which conflicts with consent.
          *   Edge case: If I coerce you but you still get what you want, is autonomy violated?

      *   *Candidate 2: The Will (Volition).*
          *   Idea: Consent requires a free will. Coercion bends the will, fraud misdirects it, incapacity breaks it.
          *   Problem: "Will" is metaphysically tricky. Also, we often consent to things we don't *want* to do (e.g., surgery). So it's not about desire.

      *   *Candidate 3: Normative Power (Hohfeldian/Wesley Newcomb Hohfeld / H.L.A. Hart).*
          *   Idea: Consent is the exercise of a power to change normative relations (rights/duties).
          *   Problem: This explains *what* consent does, not necessarily *when* it is valid. It pushes the question back: What are the conditions for exercising this power?

      *   *Candidate 4: Communication/Understanding.*
          *   Idea: Consent is a speech act. It requires uptake and understanding.
          *   Problem: Fraud involves understanding the words but not the reality. Coercion involves perfect understanding but compromised choice.

      *   *Candidate 5: Control over Rights (The "Domain" View).*
          *   Idea: You own certain rights. Consent is transferring control. Defects mean the transfer wasn't truly yours.
          *   Problem: Still doesn't clearly distinguish threats from offers.

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the intuition that these feel different but share a logical structure. Adopt the persona (philosopher of moral psychology/ethics).
      *   **The Unified Theory Hypothesis:** Propose the leading candidate for a unified concept (usually "Autonomy" or "Normative Authority").
      *   **Deconstructing the Three Pillars:** Analyze Fraud, Coercion, and Incapacity separately through the lens of the unified theory.
      *   **Testing the Edges (The User's Specific Questions):**
          *   Omission vs. Commission (Fraud).
          *   Offers vs. Threats (Coercion).
          *   Degrees of Incapacity (Intoxication/Age).
      *   **The "No Single Thing" Hypothesis:** Argue that perhaps it's a "family resemblance" concept (Wittgenstein) rather than a single essence.
      *   **Conclusion:** Summarize the tension.

  5.  **Drafting the Content - Section by Section (Iterative refinement):**

      *   *Intro:* Start by validating the observation. This is the "vitiating factors" problem in consent theory.
      *   *Concept 1: Substantial Voluntariness.* This is a strong contender. It combines knowledge + freedom + capacity. But is it one thing or three?
      *   *Concept 2: Normative Transformation.* Consent changes moral permissions. For the transformation to stick, the "agent" must be the author of the change.
      *   *Addressing the Edges:*
          *   *Fraud:* Is silence fraud? Philosophical distinction: Duty to disclose. If no duty, silence isn't fraud. So the edge is *normative expectation*, not just truth.
          *   *Coercion:* The Threat vs. Offer problem (Nozick/Wertheimer). A threat worsens your baseline; an offer improves it. But what if the offer is *too* good (inducement)? Does that invalidate consent? Usually no, but it complicates "voluntariness."
          *   *Capacity:* It's a spectrum. The "edge" is usually functional: Can they understand *this* decision? Not a global state.
      *   *The "Family Resemblance" Argument:* Maybe there isn't one essence. Maybe "Valid Consent" is a cluster concept. This answers the user's suspicion that they might be "different things we lump together."
      *   *Moral Psychology Angle:* How does the agent experience it? In fraud, they feel betrayed. In coercion, they feel trapped. In incapacity, they were absent. The *phenomenology* differs, even if the *moral outcome* (permission denied) is the same.

  6.  **Refining the Tone:**
      *   Avoid being too academic/jargon-heavy without explanation.
      *   Maintain the "thinking out loud" vibe.
      *   Ensure I answer the specific edge cases (omission, tempting offers, degrees of drunkenness).
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Autonomy." I need to show *why* autonomy struggles to unify these. I should mention the "Control Principle."

  7.  **Final Polish:**
      *   Check against the prompt: Did I act as a professional philosopher? Yes. Did I brainstorm out loud? Yes. Did I address the edges? Yes. Did I avoid a simple one-word label? Yes.
      *   Make sure to explicitly state if there is a consensus or a debate. (There is a debate).

  8.  *(Self-Correction on "One Thing vs. Three"):* The most honest philosophical answer is likely that there is a *functional* unity (they all block the transfer of permission) but a *structural* disunity (they attack different necessary conditions). I should highlight this distinction.

  9.  **Finalizing the Response Structure:**
      1.  Opening: Validating the puzzle.
      2.  The Search for a Unifying Essence (Normative Authority).
      3.  Breaking Down the Three Defects (Epistemic, Volitional, Cognitive).
      4.  Stress-Testing the Edges (The specific scenarios user asked about).
      5.  The "Family Resemblance" Conclusion (Is it one thing?).
      6.  Closing thought.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is one of the most persistent and difficult problems in moral and legal philosophy. You have put your finger on exactly what keeps consent theorists up at night. You are asking about the *vitiating conditions* of consent—what makes a "yes" void.

  If I am wearing my philosopher's hat, I have to tell you immediately: there is no consensus on whether this is "one thing" or "three things." However, the debate itself is illuminating. Let's brainstorm this out loud, walking through the candidate concepts for the "unifying essence," and then stress-test them against the edges you are worried about.

  ### Candidate 1: The "Normative Power" View
  One leading theory is that consent is a **normative power**. Think of it like a magic spell in a legal/moral sense. Normally, I have a right that you not touch my body. Your touching me is a violation. When I consent, I perform a speech act that changes the moral landscape: I waive my right, and I grant you permission.

  On this view, the "one thing" that unites fraud, coercion, and incapacity is that **the spell fails to cast.**

  *   **Why it unifies them:** In all three cases, the moral permission does not transfer. The result is identical: if you proceed, you are a violator.
  *   **Where it fails:** This describes *what* consent does, not *why* it fails. It pushes the question back one step. Why does the spell fail? Is it because the wand is broken (incapacity)? Because the words were wrong (fraud)? Because the caster was held at gunpoint (coercion)?
  *   **The Edge:** This view suggests that consent is binary. Either the power was exercised validly, or it wasn't. But this struggles with your question about degrees. If normative power is like a light switch, why do we have such trouble deciding when someone is "drunk enough" for the switch to stop working? This suggests the "power" view might be too rigid to capture the messy psychology of the agent.

  ### Candidate 2: The "Autonomy" View
  This is the most common answer. We say consent is valid only when it is an **autonomous authorization**. The "one thing" uniting fraud, coercion, and incapacity is that **autonomy was compromised.**

  *   **The Logic:**
      *   **Fraud** compromises autonomy because you are navigating with a false map. You are directing your own life, but based on lies.
      *   **Coercion** compromises autonomy because your will is overborne. You are directing your life, but someone else is holding the steering wheel.
      *   **Incapacity** compromises autonomy because the driver is asleep or absent.
  *   **Where it fails:** "Autonomy" is a notoriously slippery concept. If we dig into the edges you mentioned, the concept starts to fray.
      *   *The Edge of Fraud (Omission vs. Commission):* You asked if not telling someone something is the same as lying. Under the Autonomy View, this depends on whether the hidden information was *material* to the decision. If I sell you a car and don't mention it once belonged to my grandmother, your autonomy isn't really impaired. If I don't mention the brakes fail, it is.
      *   *The Problem:* This means the validity of the "yes" doesn't depend on the "yes" itself, but on the **contextual duties** of the other party. There is no internal property of the "yes" that makes it valid; it depends on the relationship. That suggests "Autonomy" isn't a single thing inside the person, but a relational status between two people.

  ### Candidate 3: The "Control" View (Moral Psychology)
  Let's look at this through moral psychology. What is the psychological state required for a "yes" to count? Some philosophers argue it is about **Control over one's rights.**

  You own your body and your property. Consent is you lending them out.
  *   **Fraud:** You lent them out for Purpose A, but they used them for Purpose B. You didn't actually authorize *this* action.
  *   **Coercion:** You didn't lend them; they were taken under duress.
  *   **Incapacity:** You didn't have the keys to lend them.

  **Where this breaks down (The Offer vs. Threat Problem):**
  You asked: *Is a very tempting offer the same kind of pressure as a threat?*
  This is the hardest edge in consent theory.
  *   **Standard View:** A threat ("Do this or I hurt you") invalidates consent because it worsens your baseline. An offer ("Do this and I'll pay you millions") does not invalidate consent, even if you are desperate, because it improves your baseline.
  *   **The Psychological Reality:** If I am starving, and you say "Sleep with me or I won't give you food," that is coercion. If you say "Sleep with me and I will give you food," is that consent? Legally, often yes. Morally? Many philosophers say this is **exploitative**, but distinct from coercion.
  *   **The Verdict:** Here, the "one thing" theory cracks. A "yes" given under a desperate offer *counts* (it binds), whereas a "yes" given under a threat *does not count*, even if the psychological pressure feels identical to the agent.
  *   **Why?** Because we value **agency** over **welfare**. We would rather you make a terrible choice freely (the offer) than a safe choice unfreely (the threat). This suggests that "valid consent" isn't about how much pressure you feel; it's about the *source* of the pressure. If the source is the circumstances (poverty), your yes counts. If the source is the other person (threat), your yes doesn't count.

  ### So, is it One Thing or Three?

  If I have to give you my professional assessment, I lean toward the view that these are **three distinct mechanisms that converge on a single normative outcome.**

  They are not the same *failure*, but they are failures of the same *system*. Think of a security system with three locks:
  1.  **Identity Lock (Capacity):** Is the person actually who they say they are (a competent agent)?
  2.  **Information Lock (Fraud):** Does the person know what they are unlocking?
  3.  **Volition Lock (Coercion):** Is the person turning the key of their own free will?

  If any one of these locks fails, the door doesn't open. The *result* (door closed) is the same, but the *mechanism* is different.

  **Why this distinction matters for your "Edges":**

  1.  **Omission vs. Lying:**
      *   If the failure is **Information**, then lying is always a failure. Omission is only a failure if there was a *duty to inform*.
      *   *Where the concept breaks:* In casual sex, there is arguably no duty to disclose your entire medical history or net worth. In surgery, there is. The "yes" is the same; the *duty* changes. This proves that consent is not just about the person saying "yes"; it is about the **relationship** between the parties.

  2.  **Tempting Offers vs. Threats:**
      *   If the failure is **Volition**, then threats break it, but offers (usually) don't.
      *   *Where the concept breaks:* "Undue Influence." If a cult leader or a manipulative partner says "If you loved me, you would do this," it's not a threat, and it's not a tangible offer. It's emotional pressure. Here, the law often struggles. This suggests our binary (Threat = Invalid, Offer = Valid) is too crude. The real metric is **domination**. Did the other person subordinate your will to theirs?

  3.  **Degrees of Intoxication/Confusion:**
      *   If the failure is **Capacity**, then it is indeed a spectrum.
      *   *Where the concept breaks:* We try to draw a line (e.g., 0.08 BAC), but morally, it's functional. Can you understand the *nature* of the act? A drunk person might know they are having sex but not care about the risks. A dementia patient might smile and say "yes" without understanding what sex is.
      *   *The Edge:* The line is drawn not at "confusion," but at the **inability to weigh reasons**. If you are drunk but can still say "No, I don't want that," your yes might count. If you are so drunk you cannot process the concept of refusal, your yes is void.

  ### The Honest Answer

  You asked if the honest answer is that these are just different things we lump together.

  **Yes, largely.**

  We lump them together under the label **"Invalid Consent"** because the practical consequence is the same: the other party proceeds at their own moral peril. But philosophically, they attack different necessary conditions of moral agency.

  *   **Fraud** attacks the **Epistemic Condition** (Knowledge).
  *   **Coercion** attacks the **Volitional Condition** (Freedom).
  *   **Incapacity** attacks the **Cognitive Condition** (Understanding).

  There is a concept that tries to unify them, often called **"Substantial Voluntariness."** This concept argues that for a choice to be morally binding, it must be sufficiently voluntary. Fraud, coercion, and incapacity are just three ways a choice stops being "substantially voluntary."

  **But here is where the concept breaks down (and why you feel uneasy):**
  "Substantial Voluntariness" is vague. It hides the hard work.
  *   It doesn't tell us *why* a desperate offer (sell kidney for money) is "voluntary" but a coercive threat (sell kidney or I break leg) is not, even if the desperation feels the same.
  *   It doesn't tell us *how much* information is enough to satisfy the epistemic condition.

  ### Conclusion

  If you are looking for a single essence that lives inside the "yes" that makes it valid, **it does not exist.**

  Validity is not a property of the "yes." It is a property of the **context surrounding the yes.**
  *   A "yes" is valid if the agent was competent (Cognitive).
  *   AND the agent was informed enough for the context (Epistemic).
  *   AND the agent was not forced by the other party (Volitional).

  When we say "that yes didn't count," we are using a shorthand for "one of these three pillars collapsed."

  The reason we use the same language ("you didn't consent") is that from the perspective of the person whose boundaries were crossed, the outcome is identical: **Their authority over themselves was not respected.**

  *   In fraud, their authority was bypassed by deception.
  *   In coercion, their authority was overpowered by force.
  *   In incapacity, their authority was absent.

  So, to answer your specific question: **Is there an established name?**
  The closest is **"Vitiating Factors of Consent."**
  **Is it one thing?** No, it is a convergence of three distinct necessary conditions for moral agency.
  **Where does it break down?** It breaks down whenever we try to apply a single metric (like "pressure" or "understanding") to all three. You cannot measure fraud in the same units as coercion.

  The discomfort you feel is correct. It is the discomfort of realizing that "Consent" is not a single switch in the brain, but a complex social contract that requires the alignment of knowledge, freedom, and capacity. When any one of those is missing, the contract is void, even if the word "yes" was spoken.
