prompt: |-
  ok so here's my situation. i'm finishing a masters in philosophy of biology and trying to settle on a dissertation topic. i keep coming back to the adaptationism debates -- gould and lewontin's spandrels paper, the backlash, the whole question of whether natural selection is the only force that explains complex traits or whether developmental constraints and structural byproducts need to be taken as seriously as selection.

  the thing is, i can't tell what's actually still live in this debate. on the one hand everyone says "oh we're past the naive adaptationism of the 70s, nobody thinks every trait is an adaptation anymore." but then you read contemporary evolutionary psychology or behavioral ecology and it's just-so stories all the way down. and the evo-devo people claim they've resolved things by showing how developmental pathways constrain variation, but i'm not sure that actually settles the conceptual question -- it might just push it back a level.

  so what i want from you: what are the genuinely unresolved *conceptual* questions in the adaptationism/spandrels/constraints debate right now, as opposed to the ones where people are just using different definitions or talking past each other? and which two or three should a philosophy phd student with a decent grasp of evolutionary theory (but no bench science) actually bet 3-4 years on?

  rank them and defend the ranking. for each candidate question i want to know: why it's upstream of other questions (or not), whether it's tractable for someone doing conceptual work rather than empirical biology, what would actually count as making progress on it, and whether there's a risk it's a dead end where you just end up restating the same positions from 1979 in slightly different vocabulary.

  and heres the thing i care about most: are there questions in this area where the philosophical work could actually change how biologists do their day-to-day science, rather than just being philosophy that scientists nod at and then ignore? because i dont want to spend four years writing something that five people read.
