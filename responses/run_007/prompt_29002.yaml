answer: |-
  This is one of the central ontological disputes in modern interpretability, yet it lacks a single, universally standardized label. In philosophical terms, it is a debate between **Representational Realism** (Side A) and **Interpretive Instrumentalism** (Side B). In technical literature, it often surfaces as the debate over the **Linear Representational Hypothesis** versus **Probe Relativity** or the **Reification Critique**.

  Here is a breakdown of the fault line, how to carve the phenomenon, and the boundary cases that stress-test each position.

  ### 1. Naming the Fault Line

  There is no single settled term, but the positions map clearly onto existing philosophical and technical distinctions:

  *   **Side A (Realism):** Often operates under the **Linear Representational Hypothesis** (Park et al., 2023). They argue that high-level concepts correspond to linear subspaces in activation space.
      *   *Philosophical Label:* **Structural Realism** or **Feature Realism**.
      *   *Claim:* The direction exists intrinsically; the probe merely discovers it.
  *   **Side B (Instrumentalism):** Argues that linear directions are **Projections** or **Reifications**.
      *   *Philosophical Label:* **Interpretive Instrumentalism** or **Projectivism**.
      *   *Claim:* The direction is an artifact of the analyzer's choice of basis and loss function. The model computes a function; the "concept" is a shadow cast by our probe.
  *   **The Fault Line:** **The Ontology of Latent Directions.** (Or: *Intrinsic Features vs. Extrinsic Probes*).

  ### 2. How to Carve the Phenomenon: Criteria for "Genuine" Representation

  To move beyond "it works vs. it's a projection," you need criteria that distinguish a *control variable* used by the network from a *readout variable* correlated with the network. For a decodable, steerable structure to count as a genuine representation, it should satisfy the following hierarchy:

  #### A. Causal Specificity (The "Only" Test)
  *   **Criterion:** Steering direction $v$ changes concept $C$ without degrading unrelated capabilities or altering orthogonal concepts.
  *   **Why it matters:** If steering "truthfulness" also degrades "grammar" or alters "sentiment," the direction is likely a **confound** (a mix of features) rather than a pure representation. Side B argues most linear directions are confounds.

  #### B. Basis Independence (The "Rotation" Test)
  *   **Criterion:** The concept persists under reasonable transformations of the activation space.
  *   **Why it matters:** Neural networks (especially with ReLU/GELU) are not fully rotationally invariant, but they are overparameterized. If a concept only exists in the specific basis the network happened to land in during SGD, but vanishes if you re-parameterize the layer (while keeping the function identical), it is **basis-dependent**. Side B argues this makes the concept extrinsic.

  #### C. Causal Mediation (The "Mechanism" Test)
  *   **Criterion:** The direction is not just *correlated* with the output, it is *used* to compute it. This requires **Causal Mediation Analysis**.
  *   **Why it matters:** You can decode "the capital of France" from a layer that has nothing to do with retrieving that fact (a "shadow" representation). If you ablate the direction and the model's performance on the task does not drop (because it uses a redundant pathway), the representation is **epiphenomenal**.

  #### D. Cross-Task Consistency (The "Generalization" Test)
  *   **Criterion:** The "truthfulness" direction found in QA tasks should align with the "truthfulness" direction in summarization or dialogue.
  *   **Why it matters:** If the direction is task-specific, it is likely a **heuristic** for that loss landscape, not a general concept of truth.

  ### 3. Boundary Cases and Hard Problems

  These are the scenarios where the Realist/Instrumentalist agreement breaks down.

  | Case | Description | Hard for Side A (Realist) | Hard for Side B (Instrumentalist) |
  | :--- | :--- | :--- | :--- |
  | **The Shadow Feature** | **Decodable but Causally Inert.** A linear probe finds "sentiment," but ablating/steering it has no effect on output (the model uses a non-linear pathway). | **Critical Failure.** Shows decodability $\neq$ representation. The concept is in the *readout*, not the *compute*. | **Easy.** Confirms their view: the concept is imposed by the probe, not used by the model. |
  | **The Alien Concept** | **Causal but Uninterpretable.** Steering a direction drastically changes behavior (e.g., makes the model more sycophantic), but humans cannot label the direction semantically. | **Moderate.** Forces them to admit "concepts" exist that aren't human concepts. Requires expanding ontology. | **Moderate.** If it's causal, it's internal. But if humans can't name it, is it a "concept" or just a parameter? |
  | **The Polysemantic Blur** | **Context-Dependent.** Direction $v$ encodes "aggression" in context $X$ but "negation" in context $Y$ (Superposition). | **Critical Failure.** Challenges the idea of a stable "concept." If the meaning shifts, is it a representation or a compression artifact? | **Easy.** Argues this proves concepts are not atomic units in the net, but emergent properties of activation overlap. |
  | **The Late-Emergence** | **Training-Dependent.** A direction appears suddenly at step $T$, stays stable, then vanishes at step $T+k$. | **Hard.** Suggests representations are transient dynamical states, not stored knowledge. | **Easy.** Supports the view that representations are dynamical trajectories, not static structures. |
  | **The Redundant Ensemble** | **Distributed.** The concept is decodable from 100 different orthogonal directions. Steering any single one does nothing; you must steer all. | **Hard.** Challenges the "linear direction" hypothesis. The concept exists, but not as *a* direction. | **Easy.** Argues the "direction" finding was a statistical fluke of the probe selecting one of many valid vectors. |

  ### 4. Nearby Positions Easy to Conflate

  When arguing this, ensure you are not accidentally swapping these distinct claims:

  1.  **Compression vs. Representation:**
      *   *Conflation:* "The model compressed the data, so it must represent the concepts."
      *   *Distinction:* A model can compress information (Information Bottleneck) without disentangling it into human-readable concepts. Side B often argues we are mistaking compression for conceptualization.

  2.  **Behavioral Alignment vs. Internal Alignment:**
      *   *Conflation:* "The model acts truthful, so it represents truth."
      *   *Distinction:* Side A claims internal structure matches external behavior. Side B claims external behavior can be faked via internal circuitry that doesn't match the human concept (e.g., "sycophancy circuits" vs. "truth circuits").

  3.  **Phenomenological vs. Mechanistic Interpretability:**
      *   *Conflation:* Using steering (phenomenological) as proof of mechanism.
      *   *Distinction:* Side A often relies on **Phenomenological Interpretability** (input/output/activation mapping). Side B demands **Mechanistic Interpretability** (circuit-level explanation). Steering proves you can *hack* the model, not that you understand *how* it works.

  4.  **The "Linear" Assumption:**
      *   *Conflation:* "If it's not linear, it's not a representation."
      *   *Distinction:* Side A is often wedded to linearity for tractability. Side B argues concepts might be **non-linear manifolds**. If a concept is only decodable via a MLP probe, Side A often dismisses it, while Side B says "See? Your linear requirement was the problem."

  ### 5. Synthesis: A Proposed Resolution

  The most productive way to resolve this fault line is to adopt a **Gradient of Realism** based on **Causal Density**.

  A structure counts as a "genuine representation" proportional to:
  1.  **Decodability:** How easily a linear probe reads it.
  2.  **Causal Leverage:** How much output change per unit of steering.
  3.  **Specificity:** How little it affects orthogonal tasks.
  4.  **Necessity:** How much performance degrades if the direction is ablated (Causal Mediation).

  **The Verdict:**
  *   **Side A is right** when the direction satisfies Causal Mediation and Specificity. (e.g., Early layers in vision models often genuinely represent edges).
  *   **Side B is right** when the direction is Decodable but fails Necessity (Shadow Features) or Specificity (Confounds).

  The disagreement persists because most current interpretability work (steering/probing) stops at **Decodability** and **Leverage**, skipping **Specificity** and **Necessity**. Until Causal Mediation is standard for all steering claims, Side B's Instrumentalism remains the scientifically safer null hypothesis.

  **Recommended Reading for this specific dispute:**
  *   *For Side A:* Park et al. (2023), "Linear Representational Hypothesis."
  *   *For Side B:* Hewitt & Liang (2019), "Designing and Interpreting Probes with Control Tasks" (shows probes can find structure that isn't used).
  *   *For the Middle:* Ravfogel et al. (2022), "Linear Contrastive LeArning" (discusses when linear directions are meaningful).
  *   *Philosophical Framework:* Dennett's "Real Patterns" (1991) — a pattern is real if positing it allows compression/prediction, regardless of microscopic implementation. This bridges the gap.
