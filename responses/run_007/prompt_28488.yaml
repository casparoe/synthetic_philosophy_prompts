  # Seminar Handout: Mapping the Lottery & Preface Paradoxes
  **Instructions:** Begin at **Node 1**. Answer the question based on your intuitive judgment of the concrete scenario described. Follow the arrow corresponding to your answer. Continue until you reach a **Leaf**. The Leaf identifies the philosophical position that best matches your pattern of intuitions.

  ---

  ### **Node 1: The Standard Lottery**
  **Scenario:** A fair lottery has 10,000 tickets and exactly one winner. You hold Ticket #1. The odds of it losing are 99.99%.
  **Question:** Without checking the results, is it rational for you to **believe** that Ticket #1 will lose?
  *   **(No)** → Go to **Node 7**.
  *   **(Yes)** → Go to **Node 2**.

  ---

  ### **Node 2: The Conjunction**
  **Scenario:** You accept that it is rational to believe Ticket #1 will lose. By the same logic, it is rational to believe Ticket #2 will lose, Ticket #3 will lose, and so on.
  **Question:** Is it rational for you to believe the **conjunction**: *"Ticket 1 will lose AND Ticket 2 will lose AND... AND Ticket 10,000 will lose"*?
  *   **(No)** → **LEAF 1: Denial of Conjunction Closure** *(e.g., Kyburg)*.
      *   *Diagnosis:* You accept high probability justifies individual belief, but deny that rational belief aggregates. You tolerate a tension between believing each premise and refusing to believe their conjunction.
  *   **(Yes)** → Go to **Node 3**.
      *   *Note:* If you answer Yes, you believe a set of propositions that you know entails a falsehood (since one ticket must win). Proceed to see how you resolve this contradiction.

  ---

  ### **Node 3: The High Stakes Assertion**
  **Scenario:** You hold Ticket #1. A demon threatens to destroy your house unless Ticket #1 **wins**. You are deciding whether to assert to the demon, "I believe Ticket #1 will lose."
  **Question:** In this high-stakes context, is the statement *"I believe Ticket #1 will lose"* **false**?
  *   **(Yes)** → Go to **Node 4**.
  *   **(No)** → Go to **Node 5**.
      *   *Note:* If you say "No" (the statement is true, but perhaps unwise to say), you lean toward Contextualism or Invariantism. If "Yes" (the statement is false), you lean toward Pragmatic Encroachment.

  ---

  ### **Node 4: The Private Diary (Separating Encroachment from Contextualism)**
  **Scenario:** Back in the high-stakes scenario (House on the line). You are alone in a room, writing in a private diary that no one will ever read.
  **Question:** Do you write *"Ticket #1 will lose"*?
  *   **(No)** → **LEAF 2: Pragmatic Encroachment** *(e.g., Stanley, Fantl & McGrath)*.
      *   *Diagnosis:* Practical stakes directly affect whether you have a belief (or knowledge). High stakes destroy the rationality of the belief itself, even in private.
  *   **(Yes)** → **LEAF 3: Contextualism about Belief Ascriptions** *(e.g., Cohen, DeRose)*.
      *   *Diagnosis:* Your mental state remains the same, but the standards for correctly *calling* it "belief" shift with the conversational context. In high-stakes contexts, the word "believe" demands a higher standard than your mental state meets.
      *   *Philosopher's Note:* Distinguishing Leaf 2 and Leaf 3 via cases is notoriously difficult. Some argue they are extensionally equivalent (predict the same behavior) and differ only in metaphysical explanation.

  ---

  ### **Node 5: The Preface Comparison**
  **Scenario:** An author writes a book with 10,000 claims. She has checked each claim carefully (non-statistical evidence) and believes each one. However, she also believes that, given human fallibility, at least one claim in the book is false.
  **Question:** Is the rational tension in the **Preface Case** (believing each claim + believing one is false) the **same kind** of tension as the **Lottery Case** (believing each ticket loses + knowing one wins)?
  *   **(No)** → **LEAF 4: Distinct Treatment** *(e.g., Non-Statistical Evidence Views)*.
      *   *Diagnosis:* You treat statistical evidence (Lottery) as insufficient for belief/warrant, but non-statistical evidence (Preface) as sufficient. This dissolves the Lottery Paradox by denying the initial step (Node 1) for statistical cases only, or treats the aggregation rules differently for different evidence types.
  *   **(Yes)** → Go to **Node 6**.

  ---

  ### **Node 6: The Framework**
  **Scenario:** You maintain that one can rationally believe every ticket loses (Node 2) and that this is the same problem as the Preface (Node 5). Yet, you know one ticket wins.
  **Question:** Does this paradox show that the binary concept of **"Belief" (Yes/No)** is broken and should be replaced entirely by **degrees of confidence (Credences)**?
  *   **(Yes)** → **LEAF 5: Credal Replacement** *(e.g., Jeffrey)*.
      *   *Diagnosis:* You reject the terms of the debate. Rationality is about matching credences to probabilities (e.g., 0.9999 for each ticket), not about holding binary beliefs that lead to contradiction.
  *   **(No)** → Go to **Node 7**.

  ---

  ### **Node 7: The Threshold Test**
  **Scenario:** Return to the Lottery. Imagine a lottery with **one trillion tickets** and exactly one winner. The chance of your ticket losing is 99.9999999999%.
  **Question:** Is it now rational to **believe** your ticket will lose?
  *   **(No)** → **LEAF 6: Denial of High Probability Sufficiency** *(e.g., Williamson, Hawthorne)*.
      *   *Diagnosis:* You deny the Lockean Thesis. No amount of statistical probability alone suffices for rational belief. Rational belief requires something stronger (e.g., knowledge, safety, or non-statistical evidence).
  *   **(Yes)** → Go to **Node 8**.
      *   *Note:* If you said "No" at Node 1 (10k tickets) but "Yes" here, you accept a probabilistic threshold for belief.

  ---

  ### **Node 8: The Knowledge Gap**
  **Scenario:** In the one trillion ticket case, you grant it is rational to **believe** your ticket loses.
  **Question:** In this same case, do you **know** that your ticket loses?
  *   **(No)** → **LEAF 7: The Belief/Knowledge Gap** *(e.g., Skeptical Invariantism)*.
      *   *Diagnosis:* You allow that high probability justifies *belief*, but not *knowledge*. You accept rational belief in propositions you cannot know.
  *   **(Yes)** → **LEAF 8: Probabilistic Knowledge** *(Unoccupied/Rare)*.
      *   *Diagnosis:* **Unoccupied.** Very few philosophers defend that statistical probability alone yields knowledge in lottery cases. This position risks collapsing the distinction between *risk* and *certainty*, making it difficult to explain why we hesitate to claim we "know" lottery outcomes in ordinary discourse.

  ---

  ### **Summary of Leaves**

  | Leaf | Position | Key Commitment |
  | :--- | :--- | :--- |
  | **1** | **Denial of Conjunction Closure** | Rational belief does not aggregate over conjunctions. |
  | **2** | **Pragmatic Encroachment** | Practical stakes determine whether one has a belief. |
  | **3** | **Contextualism** | The meaning/truth-conditions of "belief" shift with context. |
  | **4** | **Distinct Treatment** | Lottery (statistical) and Preface (non-statistical) are fundamentally different. |
  | **5** | **Credal Replacement** | Binary belief is the wrong tool; use credences only. |
  | **6** | **Denial of High Prob Sufficiency** | Probability alone never justifies belief (Lockean Thesis is false). |
  | **7** | **The Belief/Knowledge Gap** | One can rationally believe what one cannot know. |
  | **8** | **Probabilistic Knowledge** | **(Unoccupied)** High probability suffices for knowledge. |

  ### **Note on Logical Space**
  *   **Leaf 8 (Probabilistic Knowledge)** is marked **Unoccupied**. While logically possible, it is rarely defended because it contradicts the strong intuition that lottery propositions are *unknowable* despite being highly probable. Defending this requires explaining away the "lottery intuition" entirely.
  *   **Leaf 2 (Encroachment) vs. Leaf 3 (Contextualism):** These positions are flagged as difficult to separate. Both predict that in high-stakes contexts, an agent will not assert "I believe." The tree separates them via the **Private Diary** test (Node 4): Encroachment says the belief vanishes even in private; Contextualism says the belief remains but the *ascription* standards shift. Some philosophers argue this distinction is not case-detectable and relies on theoretical preference.
