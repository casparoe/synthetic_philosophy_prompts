      *   *Premise 2:* If capable humans can be in a personal relationship with God, they must believe God exists (conscious belief).
      *   *Premise 3:* If capable humans can believe God exists, those who are nonresistant do believe (God ensures this).
      *   *Observation:* There are nonresistant nonbelievers.
      *   *Conclusion:* No perfectly loving God exists.

  3.  **Address the Shift: Reasonable/Inculpable $\rightarrow$ Nonresistant:**
      *   *Early Formulation (1993):* Focused on "reasonable nonbelief." Critics argued "reasonable" is too epistemic (evidence-based). Maybe the person *could* believe but chooses not to for non-epistemic reasons, or maybe they are culpable but still unaware.
      *   *Later Formulation (2007+):* Focused on "nonresistant nonbelief."
      *   *Function of "Nonresistance":* It shifts the burden from *epistemic justification* to *volitional openness*. It's not about whether they *should* believe based on evidence, but whether they are *open* to believing/relating if God were there. It blocks the Free Will Defense (that God doesn't coerce belief) by saying God only ensures belief in those who aren't fighting it.
      *   *Content of Awareness:* It's not just propositional ("God exists"). It's *conscious* belief that facilitates a *personal relationship*. Schellenberg argues you can't have a relationship with someone you don't know exists.

  4.  **Evaluate the Objection (Relationship without Explicit Belief):**
      *   *The Objection:* Maybe someone can love the Good, love Truth, or have a vague sense of the Divine (*de re*) without forming the proposition "God exists" (*de dicto*). Maybe they are in a relationship without knowing the name or specific ontology.
      *   *Schellenberg's Counter:* A *personal* relationship requires mutual awareness. You can't be friends with someone who doesn't know you exist. God knows the person; the person must know God.
      *   *Analysis:* This targets Premise 2 (Relationship requires belief).
      *   *Does it work?*
          *   *Case for "Yes":* Mystical traditions, anonymous Christians (Rahner), or general revelation arguments suggest one can align with God's will without explicit theistic belief.
          *   *Case for "No" (Schellenberg's view):* Schellenberg defines "personal relationship" specifically as a reciprocal, conscious interaction. If the human doesn't know it's God, the reciprocity is broken on the human end. It's like talking to a wall you think is a person vs. a person you think is a wall.
      *   *Target of Objection:* It targets the conceptual link between *love* and *openness to relationship* (specifically, what counts as a relationship). It does *not* primarily target the psychological claim about resistance (whether they are resisting). It says even if they aren't resisting, the *requirement* for explicit belief is too high.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Define the argument briefly. State the shift from reasonable to nonresistant.
      *   *The Work of "Nonresistance":* Explain how it avoids the "culpability" trap. It focuses on the *condition of the heart* rather than the *state of the evidence*. It isolates the variable: If God exists, He would overcome nonbelief *unless* the human blocks it.
      *   *Content of Awareness:* It must be *conscious, explicit belief*. Not just *de re* (about the object) but *de dicto* (under the description "God"). Why? Because of the "Personal Relationship" premise.
