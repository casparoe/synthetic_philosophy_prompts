prompt: |-
  I'm TAing a third-year decision theory course and next week I've got to teach the Allais paradox and the independence axiom in one fifty-minute section. The students know how to compute expected utility for simple lotteries, but they havent seen the axioms and most of them think the Allais thing is just about people being bad at math. I don't need the paradox explained to me — I need a plan for how to explain it. What has to come first, and in what order should the pieces go so the independence axiom shows up as the exact thing the example violates, rather than as a bit of formalism I impose afterward? By the end I want them to see why the second pair just is the first pair mixed with a common third lottery, and why the axiom then forces the same choice in both pairs. If you'd use something other than the original Allais pair as the carrying example, say so, and say what a good pair has to have and not have — I suspect it needs a big common-consequence chunk and a tiny probability difference, but I'm not sure. What misconceptions should I expect (I'm betting on 'this just shows expected utility is descriptively false so we should drop it' and 'it's only the certainty effect / risk aversion'), and where in the sequence should I head each one off? What should I explicitly say we're not going to settle at this level? And give me one end-of-section question that would show they understand the axiom and the violation, not just that they can reproduce the numbers.
