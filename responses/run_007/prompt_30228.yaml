answer: |-
  Here is a 50-minute lesson plan designed to make the Independence Axiom emerge from the Allais Paradox, rather than appearing as an arbitrary rule.

  ### The Strategy: "From Intuition to Inconsistency"
  **Core Pedagogical Move:** Do not define the Independence Axiom until minute 25. First, establish that their intuition leads to a mathematical contradiction under Expected Utility (EU). Second, show *why* the two choice pairs are structurally identical. Third, name the rule they broke (Independence).

  ---

  ### Part 1: The Choice & The Calculation (0–15 mins)

  **1. The Vote (5 mins)**
  Put the classic Allais pairs on the board. Do not label them "Problem 1" and "Problem 2" yet; just label them "Choice A" and "Choice B."

  *   **Choice 1:**
      *   **Option 1A:** \$1 Million for sure.
      *   **Option 1B:** 10% chance of \$5M, 89% chance of \$1M, 1% chance of \$0.
  *   **Choice 2:**
      *   **Option 2A:** 11% chance of \$1M, 89% chance of \$0.
      *   **Option 2B:** 10% chance of \$5M, 90% chance of \$0.

  **Action:** Ask for a show of hands: "Who picks 1A?" (Most will). "Who picks 2B?" (Most will).
  **Script:** "This is the most common pattern. It feels rational. 1A gives certainty. 2B gives a better shot at the big prize since the 'safe' money is gone anyway. But if you hold both these preferences, you cannot be an Expected Utility maximizer."

  **2. The Algebraic Trap (10 mins)**
  Students think this is about being "bad at math." Prove them wrong.
  Ask a student to write the EU inequality for 1A > 1B.
  $$u(1M) > 0.1u(5M) + 0.89u(1M) + 0.01u(0)$$
  Simplify (set $u(0)=0$):
  $$0.11u(1M) > 0.1u(5M)$$  *(Inequality 1)*

  Now ask for 2B > 2A:
  $$0.1u(5M) > 0.11u(1M)$$ *(Inequality 2)*

  **Script:** "Look at the board. Inequality 1 says $X > Y$. Inequality 2 says $Y > X$. This is not a calculation error. This is a logical contradiction. You cannot draw a utility curve for money that satisfies both. If EU is the standard of rationality, one of these choices *must* be wrong."

  ---

  ### Part 2: The Structural Reveal (15–35 mins)

  **3. Rewriting the Lotteries (10 mins)**
  This is the critical step. You need them to *see* the common consequence before you name the axiom.
  Rewrite Choice 1 on the board, but split the probabilities to align with Choice 2.

  *   **1A:** [**11%** chance of \$1M] + [**89%** chance of \$1M]
  *   **1B:** [**11%** chance of \$1M] + [**89%** chance of \$1M] ... Wait, that's not right.
      *   *Correction for Board:*
      *   **1A:** 100% \$1M $\rightarrow$ **11%** \$1M + **89%** \$1M
      *   **1B:** 10% \$5M + 1% \$0 + **89%** \$1M

  Now rewrite Choice 2:
  *   **2A:** **11%** \$1M + **89%** \$0
  *   **2B:** 10% \$5M + 1% \$0 + **89%** \$0

  **Action:** Circle the **89%** chunks in all four options.
  **Script:** "Look at the bolded parts. In Choice 1, both options give you an 89% chance of \$1M. In Choice 2, both options give you an 89% chance of \$0. Everything else—the 'risky' 11% part—is identical between Choice 1 and Choice 2."

  **4. Introducing the Independence Axiom (10 mins)**
  Now you define the axiom as the formalization of what they just saw.
  **Definition:** "The Independence Axiom says: If you prefer Lottery $P$ to Lottery $Q$, you should still prefer $P$ to $Q$ even if both are mixed with a common Lottery $R$."

  **Map it to Allais:**
  *   Let $P$ = The 11% chunk of 1A (\$1M for sure).
  *   Let $Q$ = The 11% chunk of 1B (10/11 chance of \$5M, 1/11 chance of 0).
  *   Let $R$ = The common 89% chunk.

  **Script:** "In Choice 1, you are comparing $P$ mixed with 'Sure \$1M' vs $Q$ mixed with 'Sure \$1M'. In Choice 2, you are comparing $P$ mixed with 'Sure \$0' vs $Q$ mixed with 'Sure \$0'. The Independence Axiom says the 'common chunk' ($R$) should be irrelevant. It should cancel out. If you switch your preference just because the common chunk changed from \$1M to \$0, you have violated Independence."

  ---

  ### Part 3: Misconceptions & Scope (35–45 mins)

  **5. Head Off "Risk Aversion" (5 mins)**
  **Misconception:** "I chose 1A because I'm risk-averse."
  **Counter:** "Risk aversion is modeled by a concave utility function (diminishing marginal utility). We just proved in Part 1 that *no* utility function, concave or convex, can satisfy both choices. This isn't about how much you value money; it's about how you weight probabilities. Specifically, you are overweighting the difference between 100% and 99% compared to 11% and 10%."

  **6. Head Off "EU is False" (5 mins)**
  **Misconception:** "Since people do this, EU is descriptively false and useless."
  **Counter:** Distinguish **Descriptive** (how humans *do* behave) vs. **Normative** (how humans *should* behave).
  **Script:** "Allais shows EU is descriptively false. We know that. But Decision Theory often uses EU as a normative standard—like logic. If I say 'All men are mortal' and 'Socrates is a man' but conclude 'Socrates is immortal,' I haven't found a new kind of human; I've made a logical error. EU asks: 'Given your preference in Choice 1, are you logically forced to pick 2A?' The answer is yes. The paradox forces you to decide which preference you want to keep."

  **7. What We Are Not Settling (2 mins)**
  **Script:** "We are not settling today whether you *should* abandon EU or abandon your intuition. Prospect Theory abandons EU to save the intuition. Savage defends EU and says fix the intuition. That is a debate for next week. Today, we just identify the break."

  ---

  ### Part 4: Assessment (45–50 mins)

  **8. The End-of-Section Question**
  Do not ask them to calculate EU. Ask them to identify the structural violation in a new context.

  **Question:**
  "Consider these two choices:
  *   **Pair 1:** Choose between (A) \$100 for sure, or (B) 50% \$200, 50% \$100.
  *   **Pair 2:** Choose between (C) 50% \$100, 50% \$0, or (D) 25% \$200, 25% \$100, 50% \$0.

  If a student prefers **A** in Pair 1 and **D** in Pair 2:
  1.  Identify the 'common consequence' shared by the options in both pairs.
  2.  State whether this violates the Independence Axiom.
  3.  Explain *why* without computing expected utility values."

  **Answer Key (for you):**
  1.  **Common Consequence:** The 50% chance of \$0 in Pair 2 (Option C and D) corresponds to the "Sure \$0" implicit in the risk of Pair 1? *Wait, let's refine the example for the TA to ensure it works.*
      *   *Better Example for Assessment:*
      *   **Pair 1:** (A) \$50 Sure vs (B) 50% \$100, 50% \$50.
      *   **Pair 2:** (C) 50% \$50, 50% \$0 vs (D) 25% \$100, 25% \$50, 50% \$0.
      *   **Common Consequence:** The 50% chance of \$0 (in C & D) vs the 50% chance of \$50 (in A & B).
      *   *Actually, keep it simpler.*
      *   **Pair 1:** $L_1$ vs $L_2$.
      *   **Pair 2:** $0.5 L_1 + 0.5 \$0$ vs $0.5 L_2 + 0.5 \$0$.
      *   **Question:** "If you prefer $L_1$ in Pair 1, what does Independence require in Pair 2? If you choose the other option, what specific feature of the lotteries caused the switch?"

  **Revised Assessment Question (Cleaner):**
  "Lottery $X$ pays \$100. Lottery $Y$ pays \$200 (50%) or \$0 (50%). You prefer $X$.
  Now consider Lottery $Z$ (50% $X$, 50% \$0) and Lottery $W$ (50% $Y$, 50% \$0).
  1. According to the Independence Axiom, which must you prefer: $Z$ or $W$?
  2. If you prefer $W$ instead, are you violating the axiom because of risk aversion? Why or why not?"

  **Why this works:**
  *   Q1 tests the mechanical application of the axiom (Mixing with common consequence shouldn't change order).
  *   Q2 tests the misconception (Risk aversion is already captured in the preference for $X$ over $Y$; switching in the second pair is a probability weighting error, not a utility curvature issue).

  ### Summary of "What Has to Come First"
  1.  **Commitment:** Get them to admit they hold the conflicting preferences.
  2.  **Impossibility:** Show EU mathematically forbids holding both.
  3.  **Structure:** Reveal the common consequence visually.
  4.  **Label:** *Then* introduce "Independence" as the name of the structural rule they broke.
  5.  **Scope:** Clarify Normative vs. Descriptive to prevent "EU is dead" dismissal.

  ### Example Choice Note
  Stick to the **Original Allais** (Common Consequence).
  *   **Why:** The "Certainty Effect" (100% vs 99%) is the psychological hook that makes students *feel* the violation is reasonable. If you use Common Ratio (e.g., scaling all probabilities down), the psychological pull is weaker, and students might just think they messed up the probability math. You need them to feel the pull of certainty to understand why the axiom is restrictive.
  *   **Requirement:** The example *must* have a large common probability chunk (like the 89%) so that when you subtract it, the remaining probabilities look small and the switch feels unjustified logically, even if it feels justified psychologically.
