          *   *Xunzi:* It's not just "bad desires." It's about *scarcity and conflict*. Without external structure (Li/Ritual), desires clash. The "good" is *order*, which is artificial (in the sense of art/craft).
          *   *The Clash:* Mencius thinks morality is *discovery* (uncovering what's there). Xunzi thinks morality is *construction* (building what isn't there).

      *   **Diagnosing the Disagreement:**
          *   *Not merely verbal:* If it were just definition, Xunzi could say, "Okay, call it 'flourishing' then, but we still need rituals." But Xunzi argues rituals *transform* nature, they don't just nurture it.
          *   *Not purely empirical:* We can't observe the "untaught child" without cultural contamination. Both use anecdotal evidence (child falling in well vs. people fighting over resources).
