  3.  **Initial Brainstorming & Diagnosis:**
      *   *Is it purely verbal?* No. Both care about *cultivation*. If they agreed on the process but disagreed on the label "xing," it would be verbal. But they disagree on the *source* of moral motivation.
      *   *Is it purely empirical?* Not exactly. You can't put a "sage" in a lab. But it involves claims about how untaught humans behave.
      *   *Is it about moral psychology?* Yes. Mencius says moral motivation is internal/spontaneous (like a reflex). Xunzi says it's external/constructed (like learning a craft).
      *   *Is it about normativity?* Yes. What counts as "nature"? Is it what *is* or what *ought to be developed*?
      *   *Key Insight:* The disagreement is substantive but *categorical*. It's a disagreement about the *locus of normativity*. Mencius locates the authority for morality *within* the natural tendencies of the heart-mind. Xunzi locates the authority *outside* in the accumulated wisdom of the sages (ritual/Dao).
      *   *Refining the "Verbal" aspect:* It *is* partly about the definition of *xing*, but the definition isn't arbitrary. It's driven by their differing meta-ethical commitments. Mencius defines *xing* to include the *potential* for goodness because he believes the cosmos supports morality. Xunzi defines *xing* as the *given* because he believes the cosmos is indifferent and order is a human artifact.
      *   *Conclusion on Disagreement Type:* It is a **substantive disagreement about the source of moral authority and the metaphysics of value**, disguised as a semantic dispute over *xing*. It's not ill-posed, but it is often *mislocated* by modern readers looking for biological essentialism.

  4.  **Drafting the Argument (Section by Section):**

      *   **Introduction:** Acknowledge the user's "verbal dispute" hypothesis (often attributed to A.C. Graham). Validate the suspicion that it's too deflationary. State the thesis: It is a substantive disagreement about the *source of moral motivation* and the *metaphysics of value*, where the definition of *xing* is a strategic move, not just a confusion.

