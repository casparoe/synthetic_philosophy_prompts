      *   *The Flaw:* $A$ is a random variable. In the case where $A$ is the smaller amount, $A=x$. In the case where $A$ is the larger amount, $A=2x$. You cannot treat $A$ as a fixed constant in the expectation calculation while simultaneously letting it vary between the two cases.
      *   *The Bayesian/Prior Argument:* To calculate $P(\text{other is larger} | \text{seen } = a)$, you need a prior distribution $P(\text{smaller amount} = y)$. If the prior is uniform over $(0, \infty)$, it's improper. For any *proper* prior, there will be some values $a$ where switching is good and some where it's bad (usually high values suggest you have the larger one).
