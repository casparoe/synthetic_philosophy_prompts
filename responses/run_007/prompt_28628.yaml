  I'm a software engineer who mostly works on ML systems, with no formal philosophy background, so the vocabulary I actually think in is loss functions, proper scoring rules, calibration, expected loss, training objectives, and so on. I keep hearing that there's a program in epistemology called accuracy-first (or epistemic utility theory) that treats degrees of belief as the kind of thing that can be more or less accurate, scores them the way you'd score a probabilistic forecast, and then trys to derive norms of rationality from minimizing expected inaccuracy (or maximizing expected accuracy; in my world that's just the usual loss-vs-reward sign flip) -- for example, that your credences should satisfy the probability axioms and update by conditionalization. Restate that program in my vocabulary as faithfully as you can. Then give me the residue report: which parts map cleanly onto 'minimize expected loss under a strictly proper scoring rule', which parts you had to fudge or quietly reinterpret, and which parts have no counterpart in how I think about models and predictions. In particular I want to know whether the philosophers are just rediscovering that strictly proper scoring rules are minimized by the true distribution, or whether they're claiming something extra that my vocabulary can't express.
