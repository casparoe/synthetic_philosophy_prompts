          *   *The Charge:* To define an "intervention," you need to exclude common causes and side effects, which seems to require causal notions. Thus, causation is defined via intervention, but intervention is defined via causation.
          *   *Woodward's Defense:* It's not reductive. It's explanatory/clarificatory. It maps causal structures, not reduces them to non-causal terms.
          *   *The Push:* If it's not reductive, what *work* is it doing? Is it just restating causal claims in variables? Does it lose normative force if it can't ground causation in something deeper?
          *   *Drafting Q1:* Focus on the "explanatory payoff" of non-reductivity.
          *   *Drafting Q2:* Focus on the epistemic access. If interventions are causal, how do we identify them without prior causal knowledge?

      *   **(b) Token/Actual Causation & Preemption:**
          *   *The Problem:* Type causation is Woodward's strength. Token (actual) causation is harder, especially with preemption (Suzy throws, Billy doesn't, but if Suzy hadn't, Billy would have).
          *   *Woodwardian Defense:* Use structural equations, hold off-path variables fixed at actual values.
          *   *The Push:* Holding a downstream variable fixed (or a variable that *would* have been caused by the backup cause) might require an "intervention" that is physically impossible or violates the very causal structure you're trying to uncover. Is the "holding fixed" a legitimate intervention?
          *   *Drafting Q3:* Focus on the admissibility of the intervention required to test the counterfactual in preemption cases.
          *   *Drafting Q4:* Focus on the distinction between type and token. Does the view collapse token causation into just type causation plus context, losing the specific "oomph" of the actual event?

      *   **(c) The Variable-Set Problem:**
          *   *The Problem:* Causal truth depends on which variables you include. Include $Z$, $X$ causes $Y$. Exclude $Z$, $X$ doesn't cause $Y$.
          *   *Woodward's Defense:* Causation is *always* relative to a model. There's no "God's eye" causal view. This is a feature (context sensitivity).
          *   *The Push:* How do we choose the *right* model? If the choice is pragmatic, isn't the causal claim pragmatic too? If we choose variables just to get the answer we want, isn't that circular?
          *   *Drafting Q5:* Focus on the criteria for variable selection independent of desired outcomes.
          *   *Drafting Q6:* Focus on the metaphysical implication. If causation is model-relative, is it still "in the world"?

      *   **Additional Questions (to reach 7-8):**
