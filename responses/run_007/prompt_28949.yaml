prompt: |-
  I'm a tutor for a final-year undergraduate philosophy of language course, and next week I have one seventy-five-minute seminar to introduce two-dimensional semantics to students who already command possible-worlds semantics, the necessary/contingent and a priori/a posteriori distinctions, and the standard Kripkean verdicts about identity statements and natural kind terms — but who have never seen the primary/secondary intension framework. Don't explain two-dimensional semantics to me; give me a plan for how to teach it. What must I first reinstall or make explicit before the primary/secondary distinction is even drawable, and in what order do the remaining pieces have to go so the framework doesn't land as an unmotivated table of labels? Pick the one example that should carry the whole session — if you would set aside the stock 'water is H2O' or 'Hesperus is Phosphorus', say exactly what they fail to do for this audience, and if you would keep one, say what it must have to carry the weight. What are the three or four misconceptions students in this position predictably form — I suspect at least one will treat the primary intension as a mental image or a Fregean sense — and at which precise point in the sequence should each be headed off? Finish with a check for understanding: a sentence or short case I can put on the board whose primary and secondary intensions would only come out correctly if the machinery had actually landed, and say what a correct response should include. Finally, tell me what I should openly refuse to cover at this level.
