answer: |-
  ### Seminar Plan: Introducing Two-Dimensional Semantics (75 Minutes)

  #### 1. Prerequisites: What to Reinstall (First 10 Minutes)
  Before drawing the matrix, you must reactivate two specific tools in their existing toolkit. If these are vague, the two dimensions will collapse into one.

  *   **Reference-Fixing vs. Synonymy:** Remind them of Kripke's distinction in *Naming and Necessity*. Kripke argues descriptions (e.g., "the watery stuff") do not give the *meaning* of "water," but they often *fix the reference*.
      *   *Why:* Two-dimensional semantics (2DS) leverages the reference-fixing description to generate the **Primary Intension** without conceding that the description is a synonym (which would violate Kripke's rigidity).
  *   **Two Modes of World-Evaluation:** Students treat possible worlds exclusively as *counterfactual* ("ways things could have been"). You must introduce the notion of a world considered as *actual* ("ways things might be, for all we know").
      *   *Drill:* Ask: "When we evaluate 'Water is H2O' in a Twin Earth scenario, are we asking what happens to *our* water in that world (counterfactual), or what the word 'water' refers to *if that world were the real one* (actual)?"

  #### 2. The Core Example: "Water is H2O"
  **Keep the stock example, but change the target.**
  Do not analyze the sentence "Water is H2O" directly. Instead, analyze the term **"Water"** via its reference-fixing description: **"The dominant clear, drinkable liquid in the local lakes."**

  *   **Why keep it?** Your students are already Kripkeans. They accept "Water = H2O" is necessary a posteriori. The pedagogical friction comes from the fact that this verdict feels like it erases the *epistemic* contingency (it *seemed* possible water wasn't H2O). This example carries the weight because it is the specific battleground where Kripkean modality clashes with Fregean cognitive significance.
  *   **What it must do:** It must force a distinction between holding the *actual world* fixed (Secondary Intension) vs. holding the *reference-fixing description* fixed (Primary Intension). If you switch to "Julius" or "I am here," you lose the connection to the natural kind essentialism they just mastered.

  #### 3. Sequence of Play (65 Minutes)

  **Phase 1: The Tension (10 mins)**
  *   State the Kripkean verdict: "Water is H2O" is Necessary A Posteriori.
  *   Pose the puzzle: If it's necessary, why was it an empirical discovery? Why can we coherently imagine a world where the clear liquid in lakes is XYZ?
  *   *Goal:* Motivate 2DS not as a new logic, but as a way to model **epistemic possibility** alongside **metaphysical necessity**.

  **Phase 2: Constructing the Matrix (25 mins)**
  *   Draw the 2D grid on the board.
      *   **Y-Axis (Rows):** Worlds considered as *Actual* (Epistemic scenarios). "Suppose *this* is the real world."
      *   **X-Axis (Columns):** Worlds considered as *Counterfactual* (Metaphysical scenarios). "Given our actual world, what happens in *that* world?"
  *   **Fill the cells together using "Water":**
      1.  **Actual/Actual (Top-Left):** Our world. Water = H2O. (True)
      2.  **Actual/Counterfactual (Top-Right):** Twin Earth (XYZ) considered as counterfactual. Given water is H2O here, what is "water" there? It's still H2O (rigid). So "Water is H2O" is True. "Water is XYZ" is False.
      3.  **Epistemic/Actual (Bottom-Left):** Twin Earth considered as *actual*. Suppose *we* live on Twin Earth. What does "water" refer to? It refers to XYZ (via the reference-fixing description).
  *   **Define the Intensions:**
      *   **Secondary Intension:** Read across the top row (Actual fixed). Result: Rigid designator (H2O in all worlds).
      *   **Primary Intension:** Read down the diagonal (World as Actual varies). Result: Descriptive function (Watery stuff in all worlds).

  **Phase 3: Misconception Intervention (15 mins)**
  *   *See Section 4 below for specific timing.*

  **Phase 4: Diagonal Propositions & Assertion (15 mins)**
  *   Briefly explain that when we assert "Water is H2O," we are often asserting the **Diagonal** (the truth value across the diagonal where Actual = Counterfactual).
  *   Explain why this saves the Kripkean verdict: The diagonal is necessary (if we fix the actual world), but the primary intension explains the a posteriori nature (we had to check which cell on the diagonal we occupy).

  #### 4. Predictable Misconceptions & Intervention Points

  1.  **The "Fregean Sense" Trap**
      *   *The Error:* Students will treat the Primary Intension as a *synonym* or *definition* (e.g., "Water *means* watery stuff").
      *   *Intervention Point:* **Phase 2 (Defining Primary Intension).**
      *   *Correction:* Emphasize that the Primary Intension is a *function from worlds to extensions*, not a linguistic synonym. "Water" does not mean "watery stuff"; rather, "watery stuff" fixes the reference in the actual world, which generates the primary intension. If you treat it as a synonym, you refute Kripke; 2DS aims to *save* Kripke.

  2.  **The "Two Meanings" Trap**
      *   *The Error:* Students will think "water" is ambiguous, having two distinct meanings (one descriptive, one rigid).
      *   *Intervention Point:* **Phase 3 (After defining both intensions).**
      *   *Correction:* Insist there is **one semantic content** that is sensitive to two parameters (context/world). The intensions are ways of *evaluating* the content, not two different contents.

  3.  **The "Extension" Confusion**
      *   *The Error:* Students will treat the Secondary Intension as just the *extension* (the set of H2O molecules) rather than a function from counterfactual worlds to extensions.
      *   *Intervention Point:* **Phase 2 (Filling the Top Row).**
      *   *Correction:* When filling the top row, ask: "What is the extension in World 1? World 2?" Show that the Secondary Intension is the *pattern* of extensions across the row, not just the extension in the actual world.

  #### 5. Check for Understanding (Board Work)
  **Time:** Last 10 Minutes.
  **Task:** Put the following sentence and case on the board. Ask them to determine the truth value of the sentence under the **Primary Intension** and the **Secondary Intension**.

  > **Sentence:** "Water is the watery stuff."
  > **Case:** Consider a world $W_{xyz}$ where the clear, drinkable liquid in the lakes is XYZ, but H2O exists elsewhere (e.g., in labs).
  > 1.  Evaluate $W_{xyz}$ as **Counterfactual** (Secondary Intension).
  > 2.  Evaluate $W_{xyz}$ as **Actual** (Primary Intension).

  **Correct Response Requirements:**
  *   **Secondary Intension (False):** Since "Water" rigidly designates H2O (fixed by our actual world), and in $W_{xyz}$ the watery stuff is XYZ, "Water (H2O) is the watery stuff (XYZ)" is false.
  *   **Primary Intension (True):** If $W_{xyz}$ is considered as *actual*, the term "Water" picks out whatever plays the water-role (XYZ). Thus, "Water (XYZ) is the watery stuff (XYZ)" is true.
  *   **Why this works:** If they get the Secondary Intension right, they understand rigidity. If they get the Primary Intension right, they understand reference-fixing relative to the world considered as actual. If they conflate them, the machinery hasn't landed.

  #### 6. Scope Limits: What to Refuse
  To survive 75 minutes, you must explicitly refuse to cover the following. Tell students these are topics for advanced modules or essays, not this seminar:

  1.  **The Metaphysical Status of Primary Intensions:** Do not debate whether primary intensions pick out "possible worlds" or "epistemic possibilities" (Chalmers vs. Stalnaker). Treat it as a semantic tool, not a metaphysical proof.
  2.  **The Logic of the Actuality Operator:** Do not introduce formal syntax (e.g., $\mathcal{A}\phi$). Use natural language ("The actual F") to illustrate the concept.
  3.  **Diagonalization as a Solution to All Problems:** Do not claim 2DS solves the problem of empty names, vagueness, or propositional attitudes broadly. It is introduced here specifically to reconcile Kripkean modality with epistemic contingency.
  4.  **Historical Lineage:** Do not distinguish Kaplan vs. Stalnaker vs. Jackson vs. Chalmers in detail. Present "Two-Dimensional Semantics" as a unified framework for this session to avoid terminological paralysis.
