answer: |-
  # Class Handout: The Singleton Surgery
  ### Why the Interpretation of Probability Matters for Decision-Making

  **Scenario: The "N-of-1" Procedure**

  **Patient:** Arthur, 45.
  **Condition:** A unique anatomical variance in his aorta combined with a rare enzyme deficiency. Arthur is the only known patient with this specific combination ($N=1$).
  **Event:** Survival of a novel surgical intervention ("Procedure Z") without permanent kidney damage.
  **Available Information (Shared by all parties):**
  1.  **Data:** There are no past cases of Procedure Z on patients with Arthur's profile. There *are* 100 past cases of Procedure Z on patients with *different* anatomies, with a 90% success rate.
  2.  **Physics/Biology:** Biomechanical simulations of Arthur's specific aorta suggest the stress load is right on the threshold of failure. The biological response to the enzyme deficiency is known to be inherently variable (stochastic) in ways the simulation cannot resolve.
  3.  **Expertise:** The lead surgeon is highly experienced but acknowledges the unique risk. She is willing to bet her own money at 9:1 odds on success.

  **The Task:** Assign a probability $P(\text{Success})$ to Arthur's surgery.

  ---

  ### 1. The Assignments

  | Interpretation | Agent | Probability Assignment | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Frequentism** | Dr. Frequent | **Undefined / Refusal** | "Probability is the limiting relative frequency in a repeatable sequence. Arthur is a singleton. There is no reference class of 'Arthur-like patients' to generate a frequency. The 90% rate from *other* patients is irrelevant to *this* sequence. I cannot assign a number." |
  | **Propensity** | Dr. Propensity | **0.5 (50%)** | "Probability is the objective physical disposition of the specific setup. The simulation shows the stress is at the exact threshold, and the biological variability is symmetric around failure/success. The physical chance of *this* system producing success is 0.5, regardless of past data on *other* systems." |
  | **Subjectivism** | Dr. Bayes | **0.9 (90%)** | "Probability is a coherent degree of belief. I start with the 90% base rate of Procedure Z as a prior. While Arthur is unique, I have no evidence to downgrade the success rate below the procedure's average. The surgeon's willingness to bet 9:1 confirms this credence is coherent. My probability is 0.9." |

  ---

  ### 2. Walkthrough of the Divergence

  **The Frequentist (The Sequence Requirement)**
  For the Strict Frequentist (à la von Mises), probability is not a property of a proposition ("Arthur survives") but of a *collective* (a sequence of trials). Because Arthur cannot be repeated, and grouping him with "other patients" violates the requirement for a homogeneous reference class, the concept of probability simply does not apply.
  *   **Decision Consequence:** Dr. Frequent cannot use Expected Utility Theory. They must rely on a different decision rule (e.g., "Minimax" or "Do not operate").

  **The Propensity Theorist (The Physical Setup)**
  For the Propensity Theorist (à la Popper), probability is a causal property of the singular experimental arrangement. The "chance" resides in the interaction between the scalpel, the aorta, and the enzyme. Even if this is the only time this surgery ever happens, the physical disposition exists *now*. The simulation reveals that disposition is balanced (0.5).
  *   **Decision Consequence:** Dr. Propensity sees the risk as much higher (50% failure) than the historical average suggests. They might recommend against surgery or demand extra kidney protection.

  **The Subjectivist (The Rational Belief)**
  For the Subjectivist (à de Finetti/Ramsey), probability is a measure of uncertainty constrained only by coherence (avoiding Dutch Books). They treat the historical 90% success rate as *evidence* to update a prior, not as the *definition* of probability. Since Arthur's uniqueness doesn't prove the procedure works *worse* on him, they retain the high confidence supported by the surgeon's betting behavior.
  *   **Decision Consequence:** Dr. Bayes sees the risk as low (10% failure). They authorize the surgery confidently.

  ---

  ### 3. Structural Feature Doing the Work

  **The "Single-Case Epistemic Gap"**

  The divergence arises because the scenario severs the link between **Past Frequencies**, **Physical Models**, and **Belief**.
  *   In standard cases, past frequencies (Frequentism) align with physical dispositions (Propensity) and rational belief (Subjectivism).
  *   In this *Singleton* case, the **Frequentist** loses their foundation (no sequence).
  *   The **Propensity** theorist relies on the *micro-model* (simulation), which ignores the *macro-history* (past surgeries).
  *   The **Subjectivist** privileges the *macro-history* (base rate) as the best guide for belief, despite the unique physics.

  **What happens if you remove this feature?**
  If we introduce **999 more Arthurs** (a repeatable sequence):
  1.  **Frequentist:** Can now calculate the actual frequency.
  2.  **Propensity:** The long-run frequency will converge to the physical propensity (Law of Large Numbers).
  3.  **Subjectivist:** The rational credence will update to match the observed frequency.
  *All three interpretations converge on the same number.* The debate only matters when data is sparse and the event is unique.

  ---

  ### 4. Defense of the "Losing" Interpretation

  **The Frequentist Counter-Attack**

  Dr. Frequent might argue that the other two are engaging in **pseudoprecision**.

  > "Dr. Bayes and Dr. Propensity are pretending to know something they cannot know. Dr. Propensity claims the physical chance is 0.5, but how can they verify a single-case propensity without a long run? It is metaphysical speculation. Dr. Bayes claims 0.9, but that is just a guess dressed up as math.
  >
  > By refusing to assign a number, I am being intellectually honest. I am signaling that **the risk is unquantifiable**, not that it is zero or 50%. In high-stakes engineering and medicine, treating 'unknown' as '0.5' or '0.9' leads to catastrophic miscalculations. My refusal forces the decision-makers to acknowledge that this is a gamble, not a calculated risk."

  **Takeaway for the Class:**
  When you see a probability number in a single-case decision (e.g., "70% chance this startup succeeds"), ask: *Is this a frequency, a physical model, or a degree of belief?* The number might be the same, but the warrant for acting on it is not.
