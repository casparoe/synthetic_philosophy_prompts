      *   *Consensus:* There is *no* settled consensus. Ethicism, Autonomism, and Contextualism are still actively battling. The "internal/external" fix is not universally accepted as the solution. Many argue external factors *do* affect interpretation and thus aesthetic value (Contextualism).

  6.  **Evaluate Claim 5 (Settled Field/Edge Cases):**
