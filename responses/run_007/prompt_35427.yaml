      *   **Structure:**
          1.  Numbered list of agreed claims (common ground).
          2.  Disagreements table (Question, Adaptationist View, Structuralist View, Judgment on substantive/verbal).
          3.  Cruxes (Key sub-questions, evidence/research programs, predictions).
          4.  Analysis of the core dispute (priors, explanation, burden of proof, terminology).
      *   **Tone:** Philosophical, scientific, balanced, precise, avoiding caricature.
      *   **Goal:** Capture the *real* debate, not the strawman version. Identify if it's about priors, definitions, or something deeper.

  2.  **Deconstruct the Positions:**
      *   **Adaptationist (Pan-selectionist leanings):** Selection is the dominant creative force. Traits are usually solutions to problems. Null hypothesis = adaptation. "Just-so stories" are testable hypotheses. Constraints exist but are usually overcome by selection over deep time.
      *   **Structuralist Pluralist (Gould/Lewontin leanings):** Selection is a filter, not always a designer. Constraints (developmental, physical, historical) limit the search space. Many traits are spandrels (byproducts). Null hypothesis = needs multiple alternatives. "Just-so stories" are often unfalsifiable post-hoc rationalizations.

  3.  **Drafting Part 1: Common Ground (The "Peace Treaty"):**
      *   Need to avoid vacuity ("Evolution happens") but also avoid slanting ("Selection is king" vs. "Constraints rule").
      *   *Claim 1:* Selection is real and powerful. (Both agree).
      *   *Claim 2:* Constraints exist. (Even hardline adaptationists admit physics/development limits).
      *   *Claim 3:* Evidence standards. (Comparative method, experimentation, genetics).
      *   *Claim 4:* History matters. (Phylogeny constrains).
      *   *Claim 5:* Methodological value. (Adaptationism generates hypotheses; Pluralism prevents error).
      *   *Claim 6:* "Optimization" is local, not global. (Both agree perfection isn't expected).

  4.  **Drafting Part 2: Disagreements Table:**
      *   *Issue 1: Default Null Hypothesis.* Adaptationist: Assume function until proven otherwise. Structuralist: Assume multiple causes until function is proven.
      *   *Issue 2: Prevalence of Spandrels.* Adaptationist: Rare, most things are tweaked for use. Structuralist: Common, many traits are byproducts.
      *   *Issue 3: Power of Constraints.* Adaptationist: Constraints channel selection but rarely stop it. Structuralist: Constraints often dictate form regardless of selection.
      *   *Issue 4: Falsifiability of Adaptive Stories.* Adaptationist: They make predictions (trade-offs, costs). Structuralist: They are often post-hoc and flexible.
      *   *Issue 5: Definition of "Adaptation".* Is it a process or a product? (Crucial for verbal dispute).

  5.  **Drafting Part 3: Cruxes (The "Deal Breakers"):**
      *   Need specific empirical areas where the rubber meets the road.
      *   *Crux 1: Genomic Architecture.* How much non-coding DNA is functional vs. junk/byproduct? (ENCODE debate echoes).
      *   *Crux 2: Developmental Bias.* Does development direct evolution more than selection filters it? (Evo-Deco data).
      *   *Crux 3: Rate of Optimization.* How fast do populations reach peaks? (Experimental evolution).

  6.  **Drafting Part 4: Meta-Analysis (The "Deep Dive"):**
      *   Address the user's specific question: Is it priors, explanation, or burden of proof?
      *   *Verbal Disagreement:* The word "Adaptation." (Process vs. State).
      *   *Burden of Proof:* Who has to prove what?
      *   *Priors:* Frequency of constraints vs. selection.
      *   *Explanation:* What counts as a complete explanation? (Ultimate vs. Proximate).
      *   *Conclusion:* It's a mix. Priors drive the research focus, but definitions muddy the water.

  7.  **Refining and Polishing:**
      *   *Check Tone:* Ensure the Adaptationist doesn't sound like a caricature (e.g., deny constraints exist) and the Structuralist doesn't sound like they deny selection.
      *   *Check Specificity:* Use terms like "phylogenetic inertia," "allometry," "fitness landscape," "null model."
      *   *Check Formatting:* Use clear headings, tables, and bullet points as requested.
      *   *Self-Correction during drafting:* I initially thought about making the disagreements too abstract. I need to ground them in research practice. For the "Verbal/Substantive" judgment, I need to be honest. Some *is* verbal (definition of adaptation), but much is substantive (frequency estimates).

  8.  **Final Review against User Prompt:**
      *   Numbered list of claims? Yes.
      *   Disagreements table (Question, Adap, Struct, Judgment)? Yes.
      *   Cruxes (Evidence, Predictions)? Yes.
      *   Analysis of priors/explanation/terminology? Yes.
      *   Tone: Adversarial collaboration.

  9.  *(Self-Correction on the "Verbal" aspect)*: Gould and Lewontin's "Spandrels" paper is famously about the *habit* of thinking, not just the biology. I need to make sure the document reflects that methodological concern, not just biological facts. The Adaptationist sees the "habit" as a heuristic engine; the Structuralist sees it as a bias engine.

