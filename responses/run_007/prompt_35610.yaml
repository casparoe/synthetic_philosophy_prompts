      *   *Better Candidate to Drop:* **Case 4's ambiguity.** The user says "Not fine." But if Case 3 is fine, Case 4 is just "more of Case 3." To make the principle clean, we might need to acknowledge that *any* measurable coupling to a shared system requires consent. So Case 3 is only fine because the coupling is *effectively zero*. If Case 4 is "measurable," it crosses the threshold.
      *   *Actually, the best candidate to drop is Case 2's nuance.* The user says "less blameworthy." A clean principle might say "Equally wrong." The risk is the same. The intent is slightly better, but the outcome risk is identical.
      *   *Wait, looking closer at Case 8.* The doctor imposes risk (resistance) on others. Why is this okay? Because of **Immediacy and Specificity**. The harm prevented is immediate and specific (death). The harm caused is diffuse and probabilistic.
      *   *Let's try to formulate the principle around "Asymmetry of Recourse."*
      *   If the victims cannot undo the action, the actor cannot act alone.
      *   Case 3: Victims (everyone) can absorb the sulfates (reversible).
      *   Case 4: Victims (neighbors) cannot undo the rainfall change.
      *   Case 1: Victims cannot undo a pandemic.
      *   Case 6: Victims (users) cannot undo a hack once exploited. Waiting allows patching (recourse).
      *   Case 8: Patient cannot undo death. Antibiotic resistance is future risk.
      *   *Principle:* **The Principle of Recourse.** Unilateral action is permissible only if the affected parties retain effective recourse to undo or mitigate the harm, OR if the action prevents an immediate, irreversible harm to a specific beneficiary that outweighs the diffuse long-term risk.

  6.  **Refining the Principle for a Physicist:**
      *   Physicists like conservation laws, thresholds, and boundary conditions.
