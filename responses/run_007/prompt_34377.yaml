  Okay so I'm teaching a grad seminar on rational choice and we're doing the centipede game this week. I've been staring at the backward induction argument and I get why it's formally valid — but I'm having trouble articulating to my students exactly what's philosophically at stake. Like, what's the best way to frame the tension between the backward induction reasoning and the intuition that you should obviously go a few rounds in the centipede game? Is the problem that backward induction requires common knowledge of rationality in a way that's somehow self-undermining, or is it something else? I feel like I need a crisp diagnosis of what the paradox actually is before I can present the various solutions to it. Can you walk me through how you'd frame it?
