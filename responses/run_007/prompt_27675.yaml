answer: |-
  Based on your twelve cases, your intuitions are remarkably consistent with a specific philosophical view: **Causation by omission is not a purely physical or counterfactual relation, but a normative one.**

  You are not judging causation based on "but-for" logic (i.e., *if they had acted, would the outcome have changed?*), because in almost every "No" case (4, 6, 12), the counterfactual is true. Instead, your verdicts track **breaches of expectation, duty, or standard practice.**

  Here is the principle that captures your view, followed by an analysis of your trouble cases and the inconsistencies you need to resolve.

  ### The Principle: Normative Expectation and Default Scripts

  **Principle:** *An omission counts as a cause only if the agent violated a normative expectation or a "default script" appropriate to their role, relationship, or the standard practices of the context.*

  Under this view, the world has "default settings." When things run according to the default (the gardener waters plants, the doctor treats patients, the manufacturer meets safety standards), we don't look for causes in the non-events. When an agent deviates from the expected default in a way that breaches a duty or norm, their omission becomes causal.

  ### How the Principle Maps Your Verdicts

  *   **The "Yes" Cluster (1, 3, 5, 7, 8, 10-Standard):** In all these cases, there is a pre-existing script. The lifeguard is *hired* to save; the parent is *obligated* to feed; the manufacturer is *regulated* to include standard safety. The omission is a deviation from the expected course of events.
  *   **The "No" Cluster (4, 6, 12):** In these cases, there is no script. The neighbor has no contract for the plants; the passerby has no medical license; the pedestrian has no duty to shout. Their inaction is part of the "background noise" of the world, not a causal intervention.
  *   **The "Resistance" (Case 2):** Your resistance here is the principle fighting your counterfactual logic. You *say* "Yes" because physically, the stranger could have saved them. But you *feel resistance* because normatively, the stranger is no different from the passerby in Case 6 or the neighbor in Case 4.

  ### Resolving Your Trouble Cases (9 & 10)

  If you adopt the **Normative Expectation** principle, here is how it dictates you should rule on your torn cases:

  **Case 9 (The Novel Safety Feature): Verdict = No Causation**
  *   **Reasoning:** Even though the engineers knew it was possible, there was no *normative expectation* (regulatory or industry standard) to include it. The "default script" for a manufacturer is to meet current standards, not to innovate every possible safety feature.
  *   **Implication:** By keeping this verdict, you commit to the view that causation is **status-quo biased**. It means that if an entire industry ignores a known risk, no single manufacturer "causes" the resulting deaths by omitting the fix, because they are all following the same script. This protects innovation (you aren't liable for not inventing the future) but potentially excuses systemic negligence.

  **Case 10 (The Unprecedented Flood Barrier): Verdict = No Causation**
  *   **Reasoning:** You already hinted at this in your description. If the barrier was not funded or standard, the government was not *expected* to build it. Therefore, failing to build it is not a causal deviation; it is just the way things are.
  *   **Implication:** This makes causation dependent on **political and bureaucratic reality**. It implies that a government cannot "cause" a disaster by failing to do something it was never planning or required to do. This avoids holding agents responsible for the impossible, but it creates a paradox: if *no* town builds barriers, *no* town's government causes the flooding, even if the flooding was preventable.

  ### The Inconsistency You Must Address: Case 2

  The biggest threat to your principle is **Case 2 (Stranger with Life Preserver)**.
  *   **Your Verdict:** Yes (with resistance).
  *   **Your Other Verdicts:** No for Neighbor (4), Passerby (6), Pedestrian (12).

  **The Conflict:** Case 2 is structurally identical to Cases 4, 6, and 12 regarding duty. There is no special relationship. The only difference is the *ease* and *salience* of the rescue (a life preserver is designed for drowning; antibiotics are for doctors; shouting is ephemeral).

  **Recommendation:** To have a clean principle, **you should flip Case 2 to "No."**
  *   **Why:** Your *resistance* is the signal that your deeper intuition aligns with the Normative Expectation principle. If you keep Case 2 as "Yes," you are forced to adopt a **"Easy Rescue" Principle** (*If you can prevent harm at little cost, your omission causes the harm*).
  *   **The Cost of "Easy Rescue":** If you adopt "Easy Rescue" to save Case 2, you break Cases 4, 6, and 12. The neighbor could water plants at little cost; the passerby had the drug ready; the pedestrian could shout easily. You would have to conclude that *everyone* who could easily prevent a death causes it if they don't. This leads to the conclusion that we are all causally responsible for almost all preventable suffering in the world (e.g., I cause a starving child's death by not mailing my lunch money). Most people find this dilutes the concept of causation too much.

  ### The Indeterminate Zone: Case 11 (Collective Failure)

  Case 11 is genuinely indeterminate under this principle, and that is acceptable.
  *   **The Issue:** This is a problem of **overdetermination**. No single individual's call would have saved the town (presumably), but the *collective* silence did.
  *   **The Principle's Limit:** The Normative Expectation principle works on individual roles. It struggles with distributed agency where no single individual had a decisive duty.
  *   **Resolution:** You can maintain that *individual* omissions were not causes, while the *collective* omission was. This suggests that "causation" might function differently at the group level than the individual level. You don't need to solve this to keep your principle for the other 11 cases.

  ### Summary of Commitments

  If you stick with the **Normative Expectation Principle** (which fits 10 of your 12 cases best):

  1.  **Case 9 & 10 become "No."** You accept that causation is relative to social and professional standards, not just physical possibility.
  2.  **Case 2 becomes "No."** You acknowledge that your resistance was correct; without a duty, the stranger is part of the background, not a cause.
  3.  **You accept Status-Quo Bias.** You admit that "causation" protects people who follow standard practice, even if that practice is sub-optimal (Case 9) or politically constrained (Case 10).

  If you try to keep **Case 2 as "Yes"**:
  You must abandon the Normative Principle. You will have to explain why the stranger with the life preserver is causal, but the neighbor with the hose (Case 4) and the passerby with the antibiotics (Case 6) are not. Currently, that distinction is unstable.

  **Final Advice:** Trust your resistance in Case 2. It is the clue that your true theory is normative, not counterfactual. Embrace the "No" verdict for Cases 9 and 10; they are the logical price of a theory that prevents causation from expanding to include everyone who failed to be a hero.
