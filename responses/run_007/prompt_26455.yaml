answer: |-
  This is one of the most profound questions in digital typography and information architecture. You have correctly identified that Unicode is not merely a catalog of shapes; it is a catalog of *intent*.

  To understand why Unicode makes the decisions it does, you have to reconstruct the implicit metaphysics of the letterform that the Consortium operates under. It is not a theory of visual identity, nor is it a pure theory of historical lineage. It is a theory of **Orthographic Functionalism**.

  Here is the reconstruction of that metaphysics, an analysis of its consistency, and a breakdown of what would happen if you switched to a pure shape-based ontology.

  ### 1. The Implicit Metaphysics: Orthographic Functionalism

  If Unicode were a philosopher, it would be a functionalist. It posits that a "character" is not a mark on a page, but an **atomic unit of semantic distinction within a specific writing system.**

  The hierarchy of identity in Unicode metaphysics looks like this:

  1.  **Script Membership (The Container):** The primary identity of a character is which writing system it belongs to. A Latin 'a' and a Cyrillic 'а' are different characters not because they look different (they often don't), but because they belong to different *systems of meaning*. To encode them as the same would be to claim that the English language and the Russian language share the same orthographic DNA. They do not.
  2.  **Semantic Contrast (The Function):** Does changing this shape change the meaning of a word in a specific language? If yes, it needs a code point.
      *   *Example:* The Greek lowercase sigma has two forms: σ (medial) and ς (final). They are visually different. In most contexts, they are the same letter. However, because their position is deterministic and they never contrast to change meaning (you can't swap them to make a new word), Unicode *could* have made them one character. But because the shape change is mandatory based on position, they are often treated as a single character with contextual shaping, though historically they have distinct code points in some contexts.
      *   *Counter-Example:* In Latin, changing 'a' to 'á' *does* change meaning (e.g., *papa* vs. *papá*). Therefore, the accent is not just a glyph variation; it is a distinct orthographic unit (or a base + combining mark).
  3.  **Historical Lineage (The Origin):** If two shapes look identical but descend from different historical roots, they are different characters. This is the justification for Latin/Cyrillic homoglyphs. They converged visually but diverged genealogically.
  4.  **Visual Shape (The Rendering):** This is the lowest priority. Shape is considered a "rendering concern," handled by fonts and CSS, not by the encoding layer.

  **The Metaphysical Claim:** A character is a *platonic ideal of linguistic function*, not a *nominalist collection of ink strokes*. When you type 'a', you are not selecting a shape; you are selecting the concept of "the first letter of the Latin alphabet." The font decides what that concept looks like.

  ### 2. Is the Practice Consistent? (The Politics of Encoding)

  Theoretically, Orthographic Functionalism is consistent. Practically, it is applied unevenly due to legacy, technical debt, and political power.

  **The CJK Unification Paradox**
  This is the biggest stress test for the theory. Unicode unified Chinese, Japanese, and Korean Han characters (Hanzi/Kanji/Hanja) that have diverged visually over centuries.
  *   **The Logic:** They share the same etymological origin and semantic meaning. Therefore, they are the same "character" (Functionalism/History).
  *   **The Friction:** To a user in Tokyo and a user in Beijing, the characters often look visibly different. By forcing them to share a code point, Unicode privileges *historical origin* over *visual shape* and even over *modern regional function*.
  *   **The Inconsistency:** This contradicts the Latin/Cyrillic split. If History trumps Shape for Han characters, why doesn't it merge Latin and Cyrillic 'a' (both descend from Greek Alpha)?
      *   *The Answer:* Script boundaries are sacred. Unicode treats "Latin" and "Cyrillic" as distinct namespaces. It treats "Chinese" and "Japanese" as shared namespaces for Han ideographs. This is a political decision as much as a linguistic one, aimed at reducing code space usage in the 1990s.

  **The Minority Language Squeeze**
  When a minority language community proposes a new letter (e.g., a specific shape of 'd' with a unique tail for a Caucasian language), they are often told to use a "base character + combining diacritic."
  *   **The Logic:** It's a glyph variant of 'd'. (Shape is secondary).
  *   **The Friction:** For the users, that specific shape *is* the letter. Treating it as a composite makes searching, sorting, and rendering difficult.
  *   **The Politics:** Unicode is conservative. Once a code point is added, it can never be removed. Major scripts (Latin, Han) have enough momentum to demand precomposed characters. Minority scripts are often asked to be more "efficient," effectively forcing them to do more technical work to represent their orthography.

  **Verdict on Consistency:** The theory is consistent *within* script boundaries, but the boundaries themselves are drawn using a mix of linguistics, history, and 1990s technical constraints.

  ### 3. What Breaks with a Pure Shape-Based Criterion?

  If Unicode adopted a **Visual Isomorphism** metaphysics (i.e., "If it looks the same, it is the same code point"), the digital text ecosystem would suffer catastrophic failures.

  **A. Search and Retrieval Collapses**
  If Latin 'a' (U+0061) and Cyrillic 'а' (U+0430) were unified because they look the same:
  *   You search for "apple" in English.
  *   The engine returns results containing the Russian word "аpple" (nonsense) or any text where a hacker swapped the 'a'.
  *   You cannot filter by language anymore. Text becomes linguistically agnostic, rendering natural language processing (NLP) nearly impossible.

  **B. Security and Homoglyph Attacks**
  This is already a problem, but unification would institutionalize it.
  *   Currently, browsers can flag a URL like `paypal.com` if it uses a Cyrillic 'а'.
  *   If they share a code point, the browser cannot distinguish them. Phishing becomes trivial at the protocol level. You could not verify digital signatures on text because the "text" would be ambiguous.

  **C. Typography and Rich Text Break**
  If Italic 'a' and Roman 'a' were different code points:
  *   **Bloat:** You would need separate code points for Bold, Italic, Bold-Italic, Small Caps, etc. The basic Latin block would explode from 128 characters to thousands.
  *   **Semantics Loss:** If I copy-paste italicized text from a word processor into a plain text field, the meaning of the emphasis is lost because the plain text field doesn't support the "Italic 'a'" code point.
  *   **Current Model:** By keeping them the same code point, the *content* remains stable while the *presentation* changes. This allows "Search" to work across different font styles.

  **D. The CJK Explosion**
  If Han Unification were reversed based on shape:
  *   Every regional variant of every character gets a new code point.
  *   Databases double or triple in size.
  *   Cross-lingual search (finding a document written in Traditional Chinese while searching in Simplified) becomes impossible without massive mapping tables. The "One Character, One Meaning" ideal would be lost to "One Font, One Character."

  **E. The "Infinite Glyph" Problem**
  Shape is analog; code points are digital.
  *   Fonts vary. Does a serif 'a' differ from a sans-serif 'a'? Does a handwritten 'a' differ from a printed one?
  *   If shape is the criterion, where do you draw the line? You end up encoding specific fonts rather than text. You are no longer encoding *language*; you are encoding *images of language*.

  ### Summary: The Metaphysics of Intent

  Unicode presupposes that **text is data, not image.**

  The implicit metaphysics is that a letter is a **container for human intention**. When I type 'a', my intention is "the first letter of the Latin alphabet." When a Russian types 'а', their intention is "the first letter of the Cyrillic alphabet." Even if our fingers hit keys that produce identical pixels on the screen, our *intentions* are distinct. Unicode encodes the intention.

  If they switched to a shape-based criterion, they would be encoding the *output* rather than the *source*. This would break the link between text and meaning, turning the universal character encoding into a universal font catalog, and destroying the ability to process text as logic, search, or secure data.

  The inconsistencies you see (CJK vs. Latin/Cyrillic, Minority vs. Major scripts) are the friction burns caused by trying to apply this high-minded functionalist metaphysics to a messy reality of historical legacy, limited memory (in the 90s), and unequal political power. But the alternative—encoding shapes—would render digital text functionally blind.
