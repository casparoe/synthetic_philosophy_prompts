          *   CJK Unification (Same code point for visually similar/different Han characters across regions).
          *   Minority Latin extensions (Rejected as glyph variants).
      *   **Key Dimensions to Analyze:** Shape, Function, Historical Origin, User Intention, Politics/Consistency.
      *   **Task 1:** Reconstruct the implicit metaphysics of the letterform that justifies these decisions.
      *   **Task 2:** Explain what would break if Unicode adopted a pure shape-based criterion.

  2.  **Initial Brainstorming & Fact-Checking:**

      *   *Unicode Principle:* "Encode characters, not glyphs." This is the mantra.
      *   *Latin vs. Cyrillic:* Homoglyphs. Security risk (spoofing), but also distinct semantic histories. They mean different things in different linguistic contexts.
      *   *Italic vs. Roman:* Stylistic variation. Rich text handles this, not the character encoding.
      *   *CJK Unification:* Han Unification. Highly controversial. Based on etymological origin (same character historically), even if shapes diverged regionally.
      *   *Minority Languages:* Often want distinct letters for phonetic distinctions. If it's just a font style of an existing letter, it's rejected. If it changes meaning/phoneme, it might be accepted (or combining marks used).
      *   *Metaphysics:* It's not Platonism (ideal shape). It's not Nominalism (just marks on paper). It's closer to *Functionalism* mixed with *Historical Essentialism*. A character is an abstract unit of orthography, defined by its role in a writing system and its lineage, not its visual instantiation.

  3.  **Drafting the "Implicit Metaphysics" (Task 1):**

      *   *Name:* Let's call it "Orthographic Functionalism" or "Abstract Semiotic Identity."
      *   *Core Tenet:* A character is a *semantic/linguistic atom*, not a visual picture.
      *   *Criterion 1: Abstract Identity over Visual Instantiation.* 'a' and '*a*' are the same atom styled differently.
      *   *Criterion 2: Historical/Etymological Lineage.* Latin 'a' and Cyrillic 'а' look the same but come from different lineages (via Greek). They belong to different *systems*.
      *   *Criterion 3: Systemic Contrast.* Does changing this shape change the meaning in a specific language context? (Minimal pairs).
      *   *Criterion 4: Interoperability & Round-tripping.* Can I search for this? Can I sort this?
      *   *The "Mix":* It's not one theory. It's a pragmatic hierarchy.
          1.  Is it a distinct unit in a writing system? (Function)
          2.  Is it historically distinct from existing units? (Origin)
          3.  Is the visual difference merely stylistic? (Shape - lowest priority)

  4.  **Analyzing Consistency & Politics (Task 1 continued):**

      *   *Is it consistent?* Ideally, yes. Practically, no.
      *   *CJK:* Unification prioritizes historical origin over visual shape (controversial).
      *   *Latin/Cyrillic:* Separation prioritizes script identity over visual shape.
      *   *Minority Languages:* Often forced to use combining marks because encoding new letters is "bloat." This feels like a bias against non-major scripts.
      *   *Conclusion:* The theory is consistent *in intent* (encode text, not fonts), but application varies due to legacy, technical constraints, and political pressure.

  5.  **Drafting the "What Would Break" (Task 2):**

      *   *Scenario:* Pure Shape-Based Encoding (Visual Isomorphism).
      *   *Breakage 1: Search & Sort.* If Latin 'a' and Cyrillic 'а' are the same code point, searching "apple" finds Russian text. Chaos.
