          *   At the intersection, if I assume I'm equally likely to be at 1 or 2 (naive), I might calculate differently.
          *   Piccione & Rubinstein argue that at the intersection, the probability of being at the 1st is $1/(1+p)$.
          *   If you optimize *at* the intersection using that belief, you get a different $p$ than the ex-ante optimal $p$. This is the time inconsistency.
          *   Aumann et al. say: Ignore the belief update. Stick to ex-ante $p$.
          *   *Connection to SB:* Halfer = Stick to prior (1/2). Thirder = Update on self-location (1/3).
          *   So: Halfer $\leftrightarrow$ Planning Optimality. Thirder $\leftrightarrow$ Action Optimality.
          *   *Wait, is Action Optimality rational?* Most decision theorists side with Aumann (Planning) in AMD. Most philosophers are split on SB. This suggests a disanalogy in normative consensus.
          *   *Why?* Because in AMD, the "belief" is derived from the strategy. In SB, the belief is derived from the setup.
      *   *Make sure to mention Updateless Decision Theory (UDT).* UDT solves AMD by committing to the plan. UDT usually aligns with Halferism (or "Self-Indication Assumption" variants depending on formulation). Actually, UDT proponents often argue SB is a pseudo-problem or side with Halfers because the decision is made ex-ante.
      *   *Memory Loss:* SB has explicit memory erasure. AMD has indistinguishable nodes. Functionally identical for the agent at the node, but ontologically different (one is psychological, one is structural).

  6.  **Final Outline Structure:**
      1.  Introduction (Definitions & Shared Core).
      2.  Structural Parallels (Decision Trees & Imperfect Recall).
      3.  Mapping the Debates (Halfer/Thirder vs. Planning/Action).
      4.  The Crucial Disanalogy (Exogenous vs. Endogenous Uncertainty).
