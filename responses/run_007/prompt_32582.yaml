      *   **Goal:** A systematic comparison.

  2.  **Analyze the Problems Individually:**

      *   **Sleeping Beauty (SB):**
          *   *Setup:* Coin toss (Heads/Tails). If Heads, wake once (Mon). If Tails, wake twice (Mon, Tue). Memory wipe between wakes. Ask: "What is your credence that the coin is Heads?"
          *   *Key Issue:* Credence (Epistemic). What probability should SB assign to Heads upon waking?
          *   *Positions:*
              *   *Halfer:* $P(Heads) = 1/2$. (No new info).
              *   *Thirder:* $P(Heads) = 1/3$. (Self-locating info: "I am awake now" samples from the three possible wake-ups).
          *   *Decision Aspect:* Often linked to betting arguments (e.g., if offered a bet each wake-up, what odds make it fair?).

      *   **Absent-Minded Driver (AMD):**
          *   *Setup:* Driver wants to exit at the 2nd intersection. Cannot distinguish intersections. Cannot remember if they passed the 1st. Payoffs: Exit 1st (0), Exit 2nd (4), Continue past 2nd (1).
          *   *Key Issue:* Action/Strategy (Pragmatic). What probability $p$ of continuing should the driver plan/execute at *each* intersection to maximize expected utility?
          *   *Positions:*
              *   *Planning Self (Ex Ante):* Maximize utility from the start. Optimal $p = 1/3$ (continuing) / $2/3$ (exiting)? Wait, let's check the math.
                  *   Payoff = $(1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1$.
                  *   Maximize $4p - 4p^2 + p^2 = 4p - 3p^2$.
                  *   Derivative: $4 - 6p = 0 \rightarrow p = 2/3$.
                  *   So, continue with prob $2/3$, exit with prob $1/3$.
              *   *Action Self (At Intersection):* Does the driver change the plan upon arriving at an intersection?
                  *   Piccione & Rubinstein (1997) argue for *time inconsistency*. The probability of being at the 1st vs. 2nd intersection changes the calculation.
                  *   Aumann et al. (1997) argue for *planning optimality* (consistent with ex-ante).
          *   *Connection to Credence:* To calculate expected utility at the intersection, the driver needs a belief about *which* intersection they are at.

  3.  **Synthesize and Compare (The "Mapping"):**

      *   *Structural Similarity:* Both involve an agent traversing a decision tree with imperfect recall (or indistinguishable states). Both involve "centered worlds" or self-locating beliefs.
      *   *Structural Difference:*
          *   SB is primarily framed as *epistemic* (Credence).
          *   AMD is primarily framed as *pragmatic* (Strategy/Action).
          *   SB has an external randomizer (Coin). AMD has the agent's own randomization (Mixed Strategy) as the source of uncertainty about location.
          *   SB involves memory *erasure*. AMD involves memory *lack* (cannot distinguish/remember), but the mechanism is slightly different (indistinguishable nodes vs. active wiping). Actually, AMD is usually modeled as imperfect recall, functionally similar to memory loss regarding the specific node.

      *   *Mapping Positions:*
          *   **Thirder $\leftrightarrow$ Modified Causal Decision Theory (CDT) / "Self-Sampling" in AMD?**
              *   Thirders treat the current awakening as a random sample from all awakenings.
              *   In AMD, if the driver treats the current intersection as a random sample from all intersections reached, they weigh the probability of being at X vs. Y based on the strategy $p$.
              *   Piccione & Rubinstein's "action optimality" looks a bit like Thirding (updating on being at an intersection).
              *   Aumann et al.'s "planning optimality" looks a bit like Halferism (stick to the ex-ante plan, ignore the "news" of being at an intersection).
          *   **Halfer $\leftrightarrow$ Planning Optimality?**
              *   Halfers say waking up gives no new info about the coin.
              *   Planning optimizers say arriving at an intersection gives no new info that should alter the ex-ante optimal plan (because the "info" is endogenous to the strategy).

      *   *The "Mixed Strategy" Link:*
          *   In SB, the "betting" arguments often drive Thirders. If you get paid per awakening, you act as if $P(Tails) = 2/3$.
          *   In AMD, the solution *requires* a mixed strategy ($p=2/3$) to maximize payoff.
          *   Is there a conflict? If a Thirder SB faces an AMD-like structure, do they converge?
          *   *Crucial Insight:* The AMD problem *generates* the probabilities of location via the strategy itself. SB probabilities are given by the setup (Coin + Protocol). This is a major disanalogy. In AMD, $P(\text{At 1st})$ depends on $p$. In SB, $P(\text{Mon})$ is fixed by the coin.

  4.  **Drafting the Comparison - Section by Section:**

      *   **Introduction:** Define both problems. Acknowledge the shared theme (imperfect recall/self-location). State the thesis: They are structurally isomorphic in terms of decision trees but diverge on the source of uncertainty (exogenous vs. endogenous), leading to different normative pressures.
      *   **Structural Isomorphism:** Show the decision trees.
          *   SB: Chance Node $\rightarrow$ Wake 1 / Wake 2.
          *   AMD: Decision Node $\rightarrow$ Int 1 / Int 2.
          *   Highlight the "Imperfect Recall" feature.
      *   **Epistemic vs. Pragmatic:**
          *   SB asks "What do I believe?" (Credence).
          *   AMD asks "What do I do?" (Strategy).
          *   Discuss how SB is often resolved via decision-theoretic bets (pragmatic encroachment), bridging the gap.
      *   **Mapping the Positions (The Core Question):**
          *   *Halfer $\approx$ Planning Optimality (Aumann et al.):* Stick to the ex-ante plan. The fact that "I am here" is not new evidence that breaks the plan.
          *   *Thirder $\approx$ Action Optimality (Piccione & Rubinstein):* Update on "I am at an intersection." Use the probability of being at a node given the strategy.
          *   *Nuance:* The mapping isn't perfect. In AMD, the probability of being at a node *depends* on the action probability. In SB, the probability of waking *depends* on the coin, not the belief.
      *   **The Source of Uncertainty (Crucial Distinction):**
          *   SB: Exogenous uncertainty (Coin).
          *   AMD: Endogenous uncertainty (Own mixed strategy).
          *   Implication: In AMD, changing your belief changes the probability of being in that state (in a causal loop sense). In SB, beliefs don't change the coin.
          *   This makes AMD a control problem and SB an inference problem.
      *   **Decision Theoretic Implications:**
          *   Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT).
          *   Thirders often align with EDT (my action correlates with other awakenings).
          *   AMD Action Optimality aligns with a specific updateless-ish view or EDT-ish view depending on formulation.
          *   Planning Optimality aligns with CDT / Updateless Decision Theory (UDT).
      *   **Conclusion:** Are they the same? No. They are "cousins." AMD highlights the tension between ex-ante planning and ex-post rationalization in control. SB highlights the tension between objective chance and self-locating evidence in belief. Treating them as one risks conflating inference with control.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check the AMD Math:* Payoff: Exit 1 (0), Exit 2 (4), Pass 2 (1).
