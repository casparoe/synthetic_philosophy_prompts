          3.  Identify "smuggled" features of statistical sampling that don't belong in political representation.
          4.  Evaluate if the lottocrat's conclusion survives without the analogy.
          5.  Suggest a better analogy if available.

  2.  **Initial Brainstorming & Critique of the Analogy:**
      *   *Survey Sampling:* Passive data extraction. Goal is to measure existing preferences/traits accurately. Sample size matters for margin of error. Respondents don't deliberate or make binding decisions.
      *   *Legislature:* Active decision-making body. Goal is to govern, legisrate, negotiate. Competence matters more than just mirroring demographics. Representatives act over time, not just at one snapshot.
      *   *The Break:* A survey respondent answers a question; a legislator *writes* the question and *decides* the answer. A survey is a snapshot; a legislature is a continuous process.
      *   *Smuggled Features:* The idea that "representation" means "mirroring" (descriptive) rather than "acting for" (substantive). The idea that the population's will is pre-existing and static (like a parameter to be estimated) rather than formed through politics.

  3.  **Drafting the Systematic Audit (Table):**
      *   Need columns: Feature, Survey Sampling, Lottocratic Legislature, Status of Mapping.
      *   Rows: Goal, Unit of Analysis, Interaction, Time, Expertise, Incentives.
      *   *Goal:* Estimate parameter vs. Make binding law. (Break)
      *   *Unit:* Respondent vs. Decision-maker. (Break)
      *   *Interaction:* Isolated vs. Deliberative/Coalitional. (Break)
      *   *Time:* Snapshot vs. Term. (Break)
      *   *Competence:* N/A (just answer truthfully) vs. High (understand complex bills). (Break)

  4.  **Identifying Smuggled Features (The "Quiet Imports"):**
      *   *Epistemic Passivity:* Surveys assume the truth is *in* the people, just need to extract it. Politics assumes truth is *made* through debate.
      *   *Atomism:* Surveys treat respondents as independent data points. Legislators are interdependent (voting blocs, parties).
      *   *Static Preferences:* Surveys measure what people want *now*. Legislatures deal with future consequences and trade-offs.
      *   *Margin of Error:* In surveys, error is noise. In legislation, error is bad law (war, economic crash).

  5.  **Evaluating the Lottocrat's Conclusion (Does it need the analogy?):**
      *   *Without the analogy:* Can they argue for sortition? Yes, but on different grounds.
      *   *Alternative Grounds:* Anti-corruption (harder to bribe 500 random people), Civic Education (school of democracy), Breaking Elite Capture (oligarchy critique).
      *   *Weakness:* Without the statistical guarantee, the "competence" objection hits harder. They need a theory of *collective intelligence* (Condorcet Jury Theorem) rather than *statistical representation*.
      *   *Verdict:* The analogy is a rhetorical shortcut that hides the hard work of justifying *decision-making* capacity. It weakens the theory if relied upon too heavily.

  6.  **Finding a Better Analogy:**
