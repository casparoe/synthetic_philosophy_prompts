      *   **Core Claim:** Lottocrats argue random selection of representatives $\approx$ random sampling in surveys.
      *   **Implications of Claim:** Guarantees descriptive representation, solves competence worries (law of large numbers), solves capture worries (breaks money/selection link).
      *   **User's Stance:** Skeptical, struggling to articulate *why* the analogy fails.
      *   **Task:**
          1.  Systematic audit (table of correspondences).
