answer: |-
  Here are ten questions designed to push your guest beyond their standard published arguments. The first three address your mandatory requirements, including the anticipated follow-ups. The remaining seven are critical wildcards.

  ### The Mandatory Questions

  **1. The Metaphysics-Normativity Gap**
  You argue that the separateness of persons objection loses its grip once we accept a reductionist account of identity. But there is a persistent worry here that you are deriving an *ought* from an *is*. Even if the boundaries between persons are metaphysically shallow, why does that fact alone dictate that we should aggregate utility across those boundaries? Isn't it possible to be a reductionist about persons but still insist that the *experience* of separation is the only thing that morally matters?

  *   **Follow-up:** You'll likely respond that moral concern should track "what matters in survival," and since reductionism shows what matters is psychological connectedness (which can cross person-boundaries), the moral boundaries must shift too. But isn't the claim that "moral concern *should* track what matters in survival" itself a normative premise that reductionism doesn't prove? Are you using Parfit's metaphysics to do work that actually requires a separate moral argument?

  **2. The Practical Difference**
  Let's look at a concrete case. Suppose I can prevent a terrible harm to myself (say, losing a limb) or a slightly smaller harm to a stranger (say, losing a finger). Common sense says I am permitted, perhaps even required, to save my own limb. If the boundary between me and the stranger is morally shallow, does your view actually demand I save the stranger? If you agree with common sense that I can save my limb, what work is the reductionist metaphysics doing? If you disagree, aren't you demanding an implausible level of self-sacrifice?

  *   **Follow-up:** I anticipate you'll say the metaphysics changes the *justification* for the action, not necessarily the action itself, or that psychological proximity still allows for some preference. But if the output of your moral calculus looks identical to the common-sense view I already hold, why should I accept the radical metaphysical overhaul? Is the point of your view just to make me feel less guilty about utilitarianism, rather than to change how we live?

  **3. Temporal vs. Interpersonal Boundaries**
  If the boundary between me and you is no more morally significant than the boundary between me-now and me-next-week, does that mean my obligation to save for my own retirement is on the same moral footing as my obligation to donate to effective charity? If I spend money on my future self rather than feeding a starving child, am I guilty of the same "boundary fetishism" as if I spent it on a stranger?

  *   **Follow-up:** You will probably argue that psychological connectedness comes in degrees, and I am more connected to my future self than to a stranger. But if morality hinges on the degree of memory or psychological overlap, does that mean people with weaker psychological connections—due to dementia, youth, or even just a busy week—have weaker moral claims on their own future? Does your view make moral status contingent on cognitive performance?

  ### The Wildcards

  **4. The Responsibility Flip**
  We've talked about sacrifice, but what about blame? If the boundaries between persons are shallow, the boundaries between *temporal selves* are too. If a criminal commits a crime and is rehabilitated ten years later, the psychological connectedness between "criminal-him" and "rehabilitated-him" might be quite weak. Does your view imply we should be *less* willing to punish people as time goes on? Are you committed to a theory of justice where punishment dissolves as identity dissolves?

  **5. The Phenomenology of Pain**
  Utilitarianism aggregates pain and pleasure. But pain is essentially subjective; it is always felt by *someone*. Even if I accept that the "someone" is a loose bundle of relations, the pain itself doesn't feel distributed. It feels local. Does your metaphysical reductionism actually change the phenomenology of suffering? If pain is still experienced locally, why does blurring the owner of the pain make it easier to justify imposing it?

  **6. The Error Theory of Instinct**
  Human beings have evolved powerful instincts to prioritize themselves and their kin. We feel these boundaries deeply. On your view, are these deep-seated moral intuitions essentially an evolutionary error? If so, are you proposing a moral system that is fundamentally unnatural for human beings to live by? How do we build a society on a view of the self that contradicts our lived experience?

  **7. The "Deep Self" Defender**
  Suppose I refuse to accept reductionism. I believe, perhaps incorrectly, that I have a deep, further fact of identity. Do I lose moral standing because I have a false metaphysical belief? Or does the *belief* in a deep self grant me a right to be treated as separate, even if that separation isn't metaphysically real? In other words, does your utilitarianism respect the agent's own conception of their identity?

  **8. Aggregation and the Utility Monster**
  One reason people cling to the separateness of persons is to block extreme aggregation—like sacrificing one person to save a million. If we weaken the person-boundary, do we make it *too* easy to sacrifice the individual for the group? Does your view inadvertently empower the "utility monster" by making the individual less of a fortress and more of a vessel for utility that can be poured elsewhere?

  **9. The Scope of Reductionism**
  You focus on adult human persons. But what about beings with very low psychological connectedness, like infants or non-human animals? If moral significance tracks psychological continuity, do beings with less complex psychological narratives count for less in your calculus? Does reductionism risk creating a hierarchy where the "most connected" minds get to aggregate the utility of the "less connected" ones?

  **10. Political Implications**
  Rawls used the separateness of persons to argue for liberal rights and against utilitarianism in the political sphere. If you successfully undermine that objection, does that mean we should abandon liberal protections of the individual in favor of more aggressive social engineering? If the individual is less sacred, does the state have more license to redistribute not just wealth, but bodily resources (like organs or labor) for the greater good?
