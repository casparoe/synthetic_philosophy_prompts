  11. **Final Polish (Self-Correction during drafting):**
      *   Make sure not to sound *too* academic. Use words like "stuff" instead of "material," "chat" instead of "discourse" where appropriate, but keep dignity.
      *   Ensure the transition from the village to the university feels seamless, showing her bridge-building.
