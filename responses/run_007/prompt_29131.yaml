answer: |-
  Good afternoon.

  Standing here, looking out at this room, I am struck by a rather difficult truth. If my aunt were here, she would likely tell me that I am not really standing here at all. Not in the way we usually mean it. She would say that I am only standing here because you are sitting there. That my voice is only finding its shape because your ears are giving it space.

  She spent her life writing about this. In the university departments where she worked, she called it Ubuntu. She wrote papers and gave lectures arguing that personhood is not a solitary thing you carry inside you, like a stone in a pocket. She argued that we are woven together. That a person is a person through other persons.

  But I look to the back of the room, to the neighbours from the village where she grew up, and I know that she didn't teach you this. You taught her. Long before she ever wrote a word of theory, you showed her what it meant to share a meal, to mourn a loss, to raise a child as a community. She spent her career translating what you already knew into a language the academics could understand. She was proud of her books, yes, but I believe she was most proud of the fact that her best ideas belonged to all of you first.

  And now we face the hard question. The question that grief forces upon us. If she was right—if who she was is truly constituted by her relationships with us—then what happens now? What does it mean to speak of her when she is no longer here to speak back?

  If a person is a network of relations, then death is not simply the loss of an individual. It is a damage to the network. It is a tearing in the fabric. When we miss her, we are not just missing an external object; we are missing the parts of ourselves that only existed when reflected in her eyes. The nephew she encouraged, the colleague she challenged, the neighbour she leaned on—those versions of us are now orphaned.

  So, what kind of 'we' is left behind?

  I think the 'we' that remains is a 'we' with a responsibility. Because if she is right, then she has not entirely vanished. She persists in the space between us. She lives in the way her colleagues treat their students with patience. She lives in the way her neighbours continue to look out for one another over the garden fence. She lives in the way her younger family members try to be kind, even when it is difficult.

  Her absence is not a void; it is a shape. It is a specific silence that demands to be filled by our actions. To honour her is not to speak about her as if she were a thing of the past. It is to recognise that the quality of her personhood now depends on the quality of ours.

  We are the keepers of her humanity now. We are the living archive of her convictions.

  So, let us not simply mourn the loss of a brilliant mind or a beloved aunt. Let us mourn the fracture in our own connections. And let us commit to repairing them. Let us be the persons who make other persons human. If we do that, then she remains, not as a memory, but as a practice.

  Thank you.
