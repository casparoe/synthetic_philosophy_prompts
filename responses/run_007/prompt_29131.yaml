prompt: |-
  I'm giving a short speech at the memorial for my aunt, who was a philosopher of Ubuntu and spent her career arguing that personhood is constituted relationally — that 'a person is a person through other persons.' The audience is a mix: her colleagues from the philosophy department, her neighbours from the village where she grew up (some of whom taught her these ideas before she ever read academic accounts of them), and younger family members who just knew her as a beloved aunt. I need to say something true to her convictions without turning it into a seminar. The hard bit: if she was right about what a person is, then what does it mean to speak about her now that she's gone — and what kind of 'we' is left behind? Write the speech itself, with no preface or commentary, in British English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Occasion:** Memorial speech for an aunt.
      *   **Subject:** A philosopher of Ubuntu ("a person is a person through other persons").
      *   **Audience:** Mixed (academic colleagues, village neighbours/elders, younger family members).
      *   **Tone:** True to her convictions, not academic/seminar-like, poignant, reflective.
      *   **Key Challenge:** Address the paradox of speaking about her death if personhood is relational. What does her absence mean for the "we" that constituted her?
      *   **Format:** The speech itself, no preface/commentary.
      *   **Language:** British English.

  2.  **Deconstruct the Core Philosophical Tension:**
      *   Ubuntu: *Umuntu ngumuntu ngabantu*. Personhood isn't an isolated substance; it's a network of relations.
      *   Death: Usually seen as the end of the person.
      *   The Twist: If she is constituted by relationships, she isn't entirely gone as long as the relationships persist in us. But the network is damaged. The "we" is altered.
      *   The Goal: Avoid eulogizing her as an isolated individual ("She was smart/kind"). Instead, eulogize the *connections* she forged and how those connections now bind *us* together.

  3.  **Audience Considerations:**
      *   *Colleagues:* Need to acknowledge her intellectual contribution without jargon.
      *   *Village Neighbours:* Need to honour the root of the wisdom (lived experience vs. theory). Acknowledge they taught her.
      *   *Family:* Need warmth, intimacy, acknowledging her role as Auntie.
      *   *Unified Voice:* The speech must weave these groups into the very "we" it describes.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Stand before them not just as a nephew/niece, but as part of the web. Use British English spelling/idioms (e.g., "mum," "neighbour," "realise").
      *   **Addressing the Philosophy (Gently):** Don't lecture. Mention her work but ground it in how she *lived* it. Connect the academic theory to the village wisdom.
      *   **The Village Connection:** Crucial point. She didn't invent this; she learned it from them. This validates the neighbours and humbles the academics.
      *   **The Paradox of Death:** This is the hard bit requested. If she is us, where is she now? She is in the space between us. Her absence is a shape in the network.
      *   **The "We" Left Behind:** We are the carriers. The responsibility falls on us to maintain the relations she valued.
      *   **Closing:** A call to action (implicit). To be human is to remember her by being human together.

  5.  **Refining the Tone (British English & Emotional Resonance):**
      *   Avoid overly sentimental Americanisms. Keep it grounded, slightly reserved but warm.
      *   Words like "whilst," " amongst," "neighbour," "realise."
      *   Ensure the rhythm feels spoken, not read.

  6.  **Addressing the "Hard Bit" (The Metaphysics of Grief):**
      *   *Idea:* If personhood is relational, death isn't erasure, it's a transformation of the relation.
      *   *Phrasing:* "She is not here, but she is not gone." "The network trembles." "We are the living archive of her personhood."
      *   *Caution:* Don't make it sound like a puzzle to solve. Make it sound like a comfort, albeit a complex one.

  7.  **Drafting - Iteration 1 (Mental Outline):**
      Hello everyone. My aunt was smart. She wrote about Ubuntu. But you villagers knew it first. She taught me to be kind. Now she's dead. But she said we are each other. So she is still here in us. We must keep being good to each other. Thank you.
      *Critique:* Too simple. Lacks the philosophical weight requested. Needs to grapple with the "what kind of we is left behind" question.

  8.  **Drafting - Iteration 2 (Adding Depth):**
      Welcome. Standing here is strange. If Auntie was right, she isn't an object we are looking at. She is the space between us. The academics know her books. The neighbours know her heart. She learned from you. Now she is gone. But her personhood lives in our relations. We are a broken circle but still a circle. We must hold each other up.
      *Critique:* Better. Needs more poetic polish and specific British phrasing. Needs to explicitly address the "what is left behind" question more profoundly.

  9.  **Drafting - Iteration 3 (Final Polish):**
      *   Start with the silence.
      *   Bring in the village elders early to honour the source.
      *   Talk about the "theory" as merely a description of what they lived.
      *   Tackle the death question: Her absence is a shared burden.
      *   End on the responsibility of the living.

  10. **Review against constraints:**
