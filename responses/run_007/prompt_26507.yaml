answer: |-
  ### The Egalitarian Decision Tree

  This tree is designed to move from the abstract charter ("equality") to concrete institutional design. Follow the branches by answering the institutional questions as the architect of your polity.

  #### **Node 1: The Nature of the Grievance**
  **Question:** When a citizen files a formal complaint that they are not being treated as an equal, what evidence does the tribunal require to validate the claim?
  *   **A.** Evidence that they are being **dominated, humiliated, or treated as inferior** in social interactions (by officials or peers).
      *   *Go to Leaf 1 (Relational).*
  *   **B.** Evidence that they possess **less well-being, fewer goods, or fewer opportunities** than the average citizen.
      *   *Go to Node 2 (Distributive).*

  ---

  #### **Node 2: The Metric of Distribution**
  **Question:** To verify the shortage of well-being or goods, does the state measure the citizen's **internal state** or their **external access**?
  *   **A.** **Internal State:** The state surveys the citizen's reported happiness, preference fulfillment, or pain levels.
      *   *Go to Node 3 (Welfare Branch).*
  *   **B.** **External Access:** The state audits the citizen's bank accounts, property deeds, or physical access to public infrastructure.
      *   *Go to Node 4 (Objective Branch).*

  ---

  #### **Node 3: The Welfare Branch (Internal State)**
  **Question:** If a citizen reports low satisfaction, does the state inquire **why** they are unsatisfied before compensating them?
  *   **A.** **No:** The state's goal is equal satisfaction levels, regardless of whether the dissatisfaction stems from bad luck, expensive tastes, or voluntary choices.
      *   *Go to Leaf 2 (Strict Welfarism).*
  *   **B.** **Yes:** The state compensates only if the dissatisfaction is caused by circumstances beyond the citizen's control (e.g., depression caused by genetics), but not if it is caused by chosen lifestyles (e.g., grief over a chosen risky hobby).
      *   *Go to Leaf 3 (Luck Welfarism).* **[See Flag 1]**

  ---

  #### **Node 4: The Objective Branch (External Access)**
  **Question:** Does the state distribute **general-purpose means** (money, tokens, tools) or guarantee **specific functionings** (the actual ability to eat, move, speak)?
  *   **A.** **Specific Functionings:** The state ensures the citizen *can* navigate the city, *can* eat nutritious food, and *can* speak in public, intervening directly if physical or social barriers prevent this.
      *   *Go to Leaf 4 (Capabilities Approach).*
  *   **B.** **General-Purpose Means:** The state provides equal purchasing power or resource credits; it is up to the citizen to convert those means into functionings.
      *   *Go to Node 5 (Resource Branch).*

  ---

  #### **Node 5: The Resource Branch (Means)**
  **Question:** If a citizen ends up with fewer effective resources due to a **voluntary gamble or lifestyle choice** (e.g., spending their housing allowance on art supplies), does the state top them up?
  *   **A.** **Yes:** The state restores their resource share to the average. The commitment to equality of outcome overrides the consequences of choice.
      *   *Go to Leaf 5 (Strict Resource Egalitarianism).*
  *   **B.** **No:** The citizen bears the cost of their choices. The state only compensates for "brute luck" (disabilities, natural disasters), not "option luck" (gambles).
      *   *Go to Leaf 6 (Luck Egalitarianism).*

  ---

  ### **The Leaves: Positions & Awkward Commitments**

  | Leaf | Position Name | The Awkward Commitment (In-World Implication) |
  | :--- | :--- | :--- |
  | **1** | **Relational Egalitarianism** | The state aggressively bans honorifics and hierarchical language while permitting vast wealth disparities, leading to rich citizens who are "socially equal" but materially dominant. |
  | **2** | **Strict Welfarism** | The state must coercively medicate or re-educate citizens who choose to be sad, ascetic, or dissatisfied to maintain the equality of satisfaction metric. |
  | **3** | **Luck Welfarism** | **[Flag 1]** The state must perform intrusive psychological audits to distinguish between "chosen" unhappiness and "unchosen" unhappiness, often failing to tell the difference. |
  | **4** | **Capabilities Approach** | The state may force a citizen to accept health interventions or education they refuse, on the grounds that they are being denied the *capability* to function, even if they value the choice to abstain. |
  | **5** | **Strict Resource Egalitarianism** | The society must constantly subsidize citizens with "expensive tastes" (e.g., someone who needs champagne to be as happy as others are with water), causing resentment among the frugal. |
  | **6** | **Luck Egalitarianism** | The state allows citizens to become destitute or die if their poverty is traced to a voluntary risk they took, creating a visible underclass of "reckless" poor who are denied aid. |

  ---

  ### **Structural Flags & Empty Nodes**

  #### **Flag 1: The Instability of Luck Welfarism**
  *   **Location:** Node 3, Branch B.
  *   **Diagnosis:** While philosophically articulated (e.g., by Richard Arneson), this position is rarely occupied in stable institutional designs. It requires the state to judge the *origin* of subjective feelings. In a novel, this creates a bureaucracy of "mind-reading" that is prone to corruption. It is functionally very close to **Luck Egalitarianism (Leaf 6)** but measures the *outcome* (happiness) rather than the *means* (resources). If your society finds it too hard to measure happiness, they will slide down to Leaf 6.

  #### **Flag 2: The Capabilities/Luck Overlap**
  *   **Location:** Node 4, Branch A.
  *   **Diagnosis:** The Capabilities Approach (Sen/Nussbaum) does not cleanly answer the "Choice" question in Node 5. A Capabilities society *could* theoretically let people suffer for bad choices (Luck Capabilities) or compensate them (Strict Capabilities).
  *   **Novelist Note:** If you choose Leaf 4, you must decide separately whether your society punishes reckless behavior. Most fictional depictions lean toward **Strict Capabilities** (the state ensures you *can* function, regardless of fault) because policing choice undermines the focus on human dignity.

  #### **Empty Node: "Naïve Resourcism"**
  *   **Location:** Node 4, Branch B → *Hypothetical Branch:* "Does the state adjust for physical disabilities?" → **No.**
  *   **Diagnosis:** This combination (Equal Cash, No Adjustments for Disability) is logically possible but **unoccupied by serious egalitarian theories**.
  *   **Why Empty:** It fails the basic test of equality. Giving a wheelchair user the same amount of money as an able-bodied person without funding ramps or chairs results in unequal freedom.
  *   **Fictional Use:** This is an excellent position for a **failed predecessor state** or a **corrupt faction** in your novel. It allows characters to say, "We are all given equal credits," while the reality is deeply inegalitarian. It creates a "lawful inequality" that drives dissent.

  #### **Empty Node: "Feudal Relationalism"**
  *   **Location:** Node 1, Branch A → *Hypothetical Branch:* "Does the state permit material starvation?" → **Yes.**
  *   **Diagnosis:** A society that insists on perfect social respect but allows citizens to starve is logically incoherent as an *egalitarian* polity. Material deprivation inevitably converts into social domination (the starving become dependent on the fed).
  *   **Fictional Use:** This is the position of a **hypocritical elite**. They preach Leaf 1 ("We bow to each other") to mask a reality of material hoarding. The tension arises when characters realize social respect is meaningless without the material power to enforce it.

  ### **Recommendation for Narrative Tension**
  For a novel focused on *internal tensions*, the most fertile ground is **Leaf 6 (Luck Egalitarianism)** or **Leaf 4 (Capabilities)**.

  *   **Choose Leaf 6** if you want conflict driven by **moral judgment**: Who deserves help? Is poverty a sin or a tragedy? This creates conflict between the "cautious" and the "reckless."
  *   **Choose Leaf 4** if you want conflict driven by **paternalism**: The state knows what you need to function better than you do. This creates conflict between the "protected" and the "autonomous."

  **Avoid Leaf 2 (Strict Welfarism)** unless you are writing a satire; the idea of a state forcing happiness is often too dystopian to sustain nuanced philosophical debate, becoming purely authoritarian too quickly.
