answer: |-
  The argument you have been handed is a sophisticated version of a **continuum argument** (or Sorites-style attack) against lexical views. It is designed to force you into a dilemma between implausible absolutism (Strong Negative Utilitarianism) and standard commensurability.

  The diagnosis is precise: **The error lies in Premise (3).**

  Your colleague's argument relies on a conflation of **continuous variation in a property** (pain intensity) with **continuity in value structure** (commensurability). Rejecting (3) allows you to keep both (2) and the denial of (5), but it does incur a theoretical cost that you have correctly anticipated: the burden of defending the threshold against charges of arbitrariness.

  Here is the detailed breakdown of the misstep, the justification for rejecting it, and the price of doing so.

  ### 1. The Diagnosis: The Error in Premise (3)

  Premise (3) states: *"If whether a pain was lexically prior to pleasure depended on how intense the pain was, then intensity and value would be varying together along a single scale — and a single scale just is commensurability."*

  This is false. It confuses the **input metric** with the **value function**.

  *   **The Input:** Pain intensity is indeed a continuous variable (a scale).
  *   **The Function:** Value assignment does not have to be a continuous function of that input.

  **The Phase Transition Analogy:**
  Consider water. Temperature varies along a single continuous scale. However, the *state* of the water (liquid vs. gas) changes lexically at 100°C (at 1 atm). The fact that temperature is a continuous scale does not mean the transition from liquid to gas must be gradual or commensurable. At 99.9°C, you have liquid; at 100.1°C, you have gas. The *basis* for the change is continuous (heat), but the *result* is categorical (phase).

  Similarly, you can posit a **discontinuous value function**. Below a certain intensity $i$, pain and pleasure are commensurable (trade-offs allowed). At or above $i$, pain becomes lexically prior (no trade-offs). The fact that intensity varies continuously does not force value to vary continuously.

  Therefore, (3) is a non-sequitur. One can maintain that lexical priority is triggered by intensity without conceding that *all* intensities share the same value structure. This blocks the slide to (4) and (5).

  ### 2. The Cost: The Arbitrariness Objection

  You correctly identified your standing worry: *"Any repair will leave me having to specify where on the intensity continuum the threshold falls... why that point rather than a nearly identical one?"*

  By rejecting (3), you embrace a **Threshold View**. This invites the standard Sorites objection: If 5.0 units of pain are lexical, why aren't 4.99 units? If there is no principled difference, the threshold seems arbitrary.

  This is the price of fixing the argument. However, this cost is manageable and is not unique to your view; it is the standard burden for any threshold deontology or lexical utilitarianism. You do not need to solve the Sorites paradox perfectly to avoid the colleague's *reductio*. You only need to show that the threshold is not *merely* arbitrary.

  Here are three ways to pay this cost, ranked from least to most theoretically demanding:

  #### A. The "Qualitative Shift" Defense (Recommended)
  Argue that severe pain is not just "more" pain, but a **different kind** of experience.
  *   **The Claim:** Mild pain is a sensation that occurs *within* a functioning agency. Severe pain (torture) is a sensation that **destroys or suspends agency**. It collapses the subject's world into the pain itself.
  *   **Why it helps:** This grounds the threshold in a qualitative discontinuity (agency-destruction) rather than a raw quantitative number. The "line" is drawn where pain transitions from being an object of experience to being the sole constituent of experience.
  *   **Cost:** You must provide a phenomenological or psychological account of this shift. But this is far less arbitrary than picking a number out of thin air.

  #### B. The "Vagueness" Defense
  Argue that the threshold is not a sharp line but a **zone of indeterminacy**.
  *   **The Claim:** There is a range of intensities where it is indeterminate whether the pain is lexically prior. In the clear cases (headache vs. torture), the view holds. In the borderline cases, the moral status is vague.
  *   **Why it helps:** It dissolves the "why 5.0 and not 4.99?" objection by denying there is a precise fact of the matter.
  *   **Cost:** You must adopt a logic of vagueness (e.g., supervaluationism) and accept that some moral questions have no determinate truth value. This complicates decision procedures but saves the core intuition.

  #### C. The "Pragmatic Precision" Defense
  Argue that moral theory does not require metaphysical precision.
  *   **The Claim:** We know torture is lexically prior and headaches are not. We do not need to know the exact micro-structure of the boundary to know that the two ends of the spectrum are different.
  *   **Why it helps:** It treats the arbitrariness objection as a demand for a precision that ethics does not owe us.
  *   **Cost:** It leaves the theory vulnerable to "boundary case" counterexamples, but secures it against the collapse into absurdity.

  ### 3. Summary of the Repair

  To save your view, you should respond to your colleague as follows:

  1.  **Reject Premise (3).** Continuous variation in pain intensity does not entail continuous variation in value structure. Value functions can be discontinuous (lexical thresholds).
  2.  **Accept the Burden.** Acknowledge that this requires defending the location/nature of the threshold.
  3.  **Meet the Burden.** Argue that the threshold corresponds to a **qualitative break in the nature of suffering** (e.g., the point where suffering overwhelms rational agency), which makes the distinction non-arbitrary even if the exact boundary is hard to specify numerically.

  **The Verdict:**
  The argument fails because it assumes that if the *trigger* for lexicality is scalar, the *status* of lexicality must be scalar. This is a category error. You can reject (3) without accepting (5). The cost is defending the threshold, but this is a standard, manageable theoretical burden, whereas accepting (5) is a fatal bullet to bite.
