      *   **Observation:** Defenders acknowledge problems but still hold the theory. The debate is stuck/stalemate.
      *   **Goal:** A *diagnosis* of the disagreement, not a recap of arguments.
      *   **Specific Questions to Address:** Is it factual (rebirth)? Conceptual (nature of desert)? Methodological (standards of justice/theory satisfaction)?

  2.  **Initial Brainstorming & Categorization:**
      *   *The Memory Problem:* This is the "Psychological Continuity" objection (Locke). If I don't remember, why is it *me*? Defenders might say "soul/continuum" matters more than memory.
      *   *The Infinite Regress:* If suffering comes from past bad karma, where did the first bad karma come from? Buddhism says "beginningless" (anadi). Hinduism might say divine play or initial ignorance. This is a metaphysical axiom vs. logical proof issue.
      *   *The Stalemate:* Why doesn't logic resolve this? Because the premises differ fundamentally.
      *   *Type of Disagreement:* It's not just empirical (can't test rebirth easily). It's not just conceptual (definitions vary). It's deeply *functional* and *soteriological*.

  3.  **Developing the Diagnosis (The "Why is it stuck?" part):**
      *   *Hypothesis 1: Incommensurable Metaphysics.* One side assumes a closed physicalist universe; the other assumes a moral cosmos. They aren't arguing about facts within a system; they are arguing about *which system* is real.
      *   *Hypothesis 2: Different Goals of Theory.* The skeptic wants *retributive justice* (punishment fits crime, agent knows why). The proponent wants *cosmic order* (everything has a cause, nothing is random).
      *   *Hypothesis 3: The "Just World" Psychological Need.* Karma satisfies a deep psychological need for meaning. Logic doesn't easily dislodge emotional/existential utility.
      *   *Hypothesis 4: The Definition of "Self".* This is crucial. If the "self" is an illusion (Buddhism), the memory objection dissolves. If the "self" is an eternal soul (Hinduism), memory matters less than continuity. The skeptic usually assumes a Western, psychological continuity view of self.

